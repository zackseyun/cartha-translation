base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: ru
  text: 'Он сказал им, следуя совету молодых людей: «Мой отец сделал ваше ярмо тяжёлым, а я прибавлю к вашему ярму. Мой отец наказывал вас плетьми, а я буду наказывать вас скорпионами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «плетьми-скорпионами», то есть плетьми с острыми наконечниками или шипами; буквально в еврейском тексте: «скорпионами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Он говорил
  rationale: Пиэль דבר обычно означает «говорить». Контекст допускает «ответил», но буквальное значение не требует уточнять речевой акт.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: по совету молодых людей
  rationale: עֵצָה — «совет», а כ обозначает соответствие ему. הַיְלָדִים в контексте — молодые советники, противопоставленные старейшинам, а не дети.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: возложил на вас тяжёлое ярмо
  rationale: Передаёт каузативное значение כבד («сделал тяжёлым») и сохраняет конкретную метафору ярма; такая русская формулировка звучит естественнее буквального «сделал ваше ярмо тяжёлым».
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: я прибавлю к вашему ярму
  rationale: Сохраняет конструкцию יסף על — «прибавить к» — и намеренно не заменяет образ абстрактным «усилю бремя».
- source_word: יִסַּר / אֲיַסֵּר
  choice: наказывал / буду наказывать
  rationale: В данном контексте речь о принудительном телесном воздействии. «Наказывать» естественно по-русски и не вносит педагогической окраски слова «дисциплинировать».
- source_word: בַּשּׁוֹטִים
  choice: плетьми
  rationale: שׁוֹט обозначает плеть или бич; «плетьми» — ясный современный эквивалент, соответствующий образу телесного наказания.
- source_word: בָּעַקְרַבִּים
  choice: скорпионами
  rationale: Основной текст сохраняет буквальный конкретный образ еврейского עַקְרַבִּים; вероятный смысл особых плетей поясняется в сноске.
theological_decisions:
- issue: Характер образа «скорпионов»
  choice: Сохранить буквальное «скорпионами» в основном тексте
  alternative: 'Перевести истолковательно: «плетьми со шипами» или «плетьми-скорпионами»'
  rationale: Еврейский текст употребляет конкретное существительное «скорпионы». Возможное обозначение снабжённых острыми концами плетей вероятно, но не бесспорно, поэтому неоднозначность сохраняется и поясняется сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранены метафора ярма и резкий образ скорпионов; архаичные «бичевал» и «юноши» не использованы. Союз «а» естественно передаёт как наращивание угрозы в первой паре, так и противопоставление во второй.
