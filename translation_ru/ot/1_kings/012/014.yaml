    rationale: Еврейский текст буквально утверждает, что отец «сделал тяжёлым ваше ярмо» (הִכְבִּיד אֶת־עֻלְּכֶם), а не прямо описывает возложение ярма. Следует сохранить именно усиление тяжести существующего образа.
