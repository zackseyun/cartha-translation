  verdict: revise
  source_fidelity: Требуется небольшая правка. וַיְדַבֵּר — завершённое повествовательное «сказал/говорил», и «Он говорил с ними» в данном контексте неоправданно создаёт оттенок длительной беседы. Кроме того, הִכְבִּיד означает «сделал тяжёлым», тогда как «возложил на вас тяжёлое ярмо» заменяет формулировку оригинала иной, хотя и близкой по смыслу, метафорой.
  naturalness: Предлагаемая редакция звучит естественно в современном литературном русском. «Следуя совету молодых людей» ясно связывает высказывание с их советом; «сделал ваше ярмо тяжёлым» сохраняет образ и остаётся понятным.
  terminology: «Ярмо», «плети» и буквальные «скорпионы» переданы удачно. «Наказывал» в контексте угрозы телесным принуждением уместно. Сноска сохраняет текстовую образность и осторожно отмечает вероятное понимание как особого вида плетей, не выдавая его за несомненное.
