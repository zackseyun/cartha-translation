base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: ru
  text: Он устроил святилище на высотах[a] и поставил священников из среды всего народа — тех, кто не были из числа потомков Левия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом высот»; то есть святилище, связанное с культовыми местами, называемыми высотами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не были из сыновей Левия»; проще: «не были левитами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: устроил / поставил
  rationale: 'Широкое значение עשה передано по контексту: применительно к святилищу — «устроил», применительно к священникам — естественное русское «поставил». Это не уточняет способ строительства или особый обряд посвящения.'
- source_word: בֵּית בָּמוֹת
  choice: святилище на высотах
  rationale: Буквальное «дом высот» в современном русском неясно. «Святилище» передаёт культовое назначение, а «на высотах» сохраняет связь с במות — местами поклонения, называемыми высотами.
- source_word: כֹּהֲנִים
  choice: священников
  rationale: Обычное и контекстуально точное соответствие для כהנים.
- source_word: מִקְצוֹת הָעָם
  choice: из среды всего народа
  rationale: Идиома указывает на выбор людей из народа в целом, а не из законной священнической линии. Формулировка избегает сомнительного буквального «с краёв народа» и не вводит идею только низших сословий.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: тех, кто не принадлежал к потомкам Левия
  rationale: Передаёт прямое указание на нелевитское происхождение священников, сохраняя родовую формулировку «сыновья Левия» в естественном современном русском виде.
theological_decisions:
- issue: Характер учреждённого Иеровоамом места поклонения
  choice: святилище на высотах
  alternative: дом высот / капища на высотах
  rationale: «Святилище» ясно передаёт культовый характер сооружения, но само по себе не добавляет оценочных слов вроде «языческое» или «незаконное»; богословская оценка остаётся за контекстом книги.
- issue: Нелевитское происхождение назначенных священников
  choice: не принадлежал к потомкам Левия
  alternative: не были левитами
  rationale: Выбранный вариант сохраняет выраженную в еврейском тексте родовую связь с Левием и не добавляет утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; техническое выражение «дом высот» вынесено в сноску, а родовая формула о Левии сохранена без конфессиональных дополнений.
