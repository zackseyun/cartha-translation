  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: ru
  text: 'Когда весь Израиль увидел, что царь не послушал их, народ ответил царю: «Какая у нас доля в Давиде? Нет у нас наследия в сыне Иессея! К своим шатрам, Израиль!»[a] «Теперь заботься о своём доме, Давид!»[b] И разошёлся Израиль по своим шатрам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «К шатрам твоим, Израиль!» Это призыв разойтись по домам и отказаться от верности царю.'
    reason: lexical_alternative
  - marker: b
    text: Слово «дом» здесь может также означать род или династию Давида.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохраняет основной смысл ראה и естественно передаёт осознание народом того, что царь отверг их просьбу.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохраняет собирательное политико-национальное обозначение исходного текста.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: не послушал их
  rationale: שׁמע с אֶל означает не просто услышать, а выслушать и внять; русский глагол «послушать» естественно передаёт отказ удовлетворить просьбу.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: народ ответил царю
  rationale: Естественно передаёт еврейскую идиому «возвратить слово» без ненужной буквальности.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Какая у нас доля в Давиде?
  rationale: «Доля» сохраняет образ участия и владения, а также связь со следующим словом «наследие», не сводя фразу к общему «что нам до Давида?».
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Нет у нас наследия в сыне Иессея!
  rationale: «Наследие» передаёт נחלה и сохраняет оттенки племенного удела и политической принадлежности; «сын Иессея» воспроизводит намеренно нерoyalное именование Давида.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: По шатрам своим, Израиль!
  rationale: Сохраняет буквальный образ шатров и формулу призыва разойтись, звучащую по-русски как лозунг политического отделения.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Теперь сам заботься о своём доме, Давид!
  rationale: В данном побудительном контексте ראה значит «смотри за, позаботься о»; частица «сам» естественно выражает подразумеваемое противопоставление после отказа Израиля от верности Давидову дому.
- source_word: בֵיתְךָ
  choice: о своём доме
  rationale: '«Дом» сохраняет многозначность: речь может идти о доме, семье или династии Давида.'
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: И разошёлся Израиль по своим шатрам
  rationale: «Разошёлся» естественно согласуется с собирательным «Израиль» и передаёт фактическое рассеяние народа по призыву; повтор слова «шатры» сохранён.
theological_decisions:
- issue: Политический лозунг против дома Давида
  choice: Передать слова как резкое отвержение политической верности Давидовой династии, не добавляя богословской оценки.
  alternative: Истолковать лозунг прямо как отвержение Божьего завета или, напротив, ослабить его до бытового конфликта.
  rationale: Контекст описывает раскол царства и мятеж против Ровоама. Перевод сохраняет силу заявления и многозначность «дома», но не навязывает выводов, которых сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Прямая речь сделана энергичной и лозунговой; архаичные обороты сведены к минимуму. Маркеры сносок [a] и [b] присутствуют в основном тексте.
