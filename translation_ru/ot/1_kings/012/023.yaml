  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: ru
  text: 'Скажи Ровоаму, сыну Соломона, царю Иудеи, всему дому Иуды и Вениамину, а также остальному народу[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте «народ» может означать людей, собравшихся на войну, однако в еврейском тексте здесь прямо не сказано «войско».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Скажи
  rationale: Императив глагола אמר требует передать повеление обратиться к названным адресатам; «скажи» естественно сочетается с последующим изложением прямой речи.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Ровоаму, сыну Соломона
  rationale: Личное имя передано в принятой русской библейской форме, а конструкция родства — прямо и ясно.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царю Иудеи
  rationale: Прямое и естественное обозначение царского титула и владения.
- source_word: כָּל בֵּית יְהוּדָה
  choice: всему дому Иуды
  rationale: Сохранён еврейский коллективно-политический образ «дом Иуды», обозначающий общину или народ Иуды.
- source_word: וּבִנְיָמִין
  choice: и Вениамину
  rationale: Название колена употреблено самостоятельно и передано без добавления отсутствующего в еврейском тексте слова «дом».
- source_word: וְיֶתֶר הָעָם
  choice: а также остальному народу
  rationale: יֶתֶר означает оставшуюся часть, а הָעָם — народ; контекст допускает собравшихся для войны, но сам стих не называет их войском.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула введения последующей речи естественно передана в русском двоеточием, поскольку содержание повеления следует в следующем стихе.
