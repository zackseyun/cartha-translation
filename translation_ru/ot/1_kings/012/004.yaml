base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: ru
  text: Твой отец сделал наше ярмо тяжким[a]. Теперь облегчи тяжёлую службу[b] и тяжкое ярмо, которые твой отец возложил на нас, — и мы будем служить тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «сделал наше ярмо суровым (или трудным)». Ярмо здесь служит образом тягостных обязанностей.'
    reason: lexical_alternative
  - marker: b
    text: «Тяжёлая служба» может также быть передано как «тяжёлый труд» или «тягостная повинность».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת־עֻלֵּנוּ
  choice: сделал наше ярмо тяжким
  rationale: Сохранены каузативное значение глагола и образ ярма. «Тяжким» естественно по-русски сочетается с «ярмом»; сноска отмечает буквальную идею суровости или трудности.
- source_word: עֻלֵּנוּ
  choice: наше ярмо
  rationale: Буквальный образ ярма передаёт тягостные повинности и сохраняет связь с повторением этого образа далее.
- source_word: הָקֵל
  choice: облегчи
  rationale: Повелительная форма передана прямо; глагол сохраняет противопоставление тяжёлой службе и тяжкому ярму.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: тяжёлую службу твоему отцу
  rationale: עֲבֹדָה может обозначать службу, труд или повинность. Формулировка сохраняет связь службы с отцом Ровоама и не сужает смысл исключительно до физического труда.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: и его тяжкое ярмо
  rationale: Сохранены местоименная отсылка к отцу, образ ярма и явное значение כבד — «тяжёлый, тяжкий».
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: которое он возложил на нас
  rationale: «Возложил на нас» естественно передаёт נתן על и сочетается с образом ярма.
- source_word: וְנַעַבְדֶךָּ
  choice: и мы будем служить тебе
  rationale: Передаёт обещание народа признать власть Ровоама при условии облегчения повинностей, не добавляя явного условного союза, отсутствующего в еврейском тексте.
