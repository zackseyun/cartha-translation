  to: Твой отец сделал наше ярмо тяжким[a]. Теперь облегчи тяжёлую службу[b] и тяжкое ярмо, которые твой отец возложил на нас, — и мы будем служить тебе.
  rationale: Исправлена синтаксическая ошибка, при которой отец оказывался адресатом службы. Оба предмета просьбы — тяжёлая служба и тяжкое ярмо — теперь естественно связаны с отцом как с тем, кто возложил их на народ. Сохранены образность, повтор «ярма», причинно-следственное обещание служить царю и лексическая вариативность сносок.
