base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: ru
  text: 'Тогда они послали за ним и позвали его[a]. Иеровоам и всё собрание[b] Израиля пришли и обратились к Ровоаму с такими словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вызвали его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «община». Здесь имеется в виду собравшийся народ Израиля или представлявшие его люди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: они послали за ним и позвали его
  rationale: Сохраняется последовательность двух еврейских глаголов. Оборот «послали за ним» естественно передаёт подразумеваемую отправку людей или вести, а «позвали его» — значение קרא + ל в данном контексте, то есть призыв Иеровоаму прийти.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Форма глагола во множественном числе согласуется с составным подлежащим «Иеровоам и всё собрание Израиля» и прямо передаёт обычное значение בוא.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: и всё собрание Израиля
  rationale: קהל обозначает собравшееся сообщество или представительный орган народа. «Собрание» сохраняет общественно-политический смысл и не придаёт выражению специально церковной окраски.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם לֵאמֹר
  choice: 'обратились к Ровоаму с такими словами:'
  rationale: Естественная русская формула введения следующей прямой речи; она передаёт и דבר אל, и служебное לֵאמֹר, не создавая тяжеловесного «говорили... говоря».
- source_word: רְחַבְעָם
  choice: Ровоам
  rationale: Употреблена традиционная русская библейская форма имени.
