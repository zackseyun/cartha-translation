  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: ru
  text: Но он отверг совет, данный ему старейшинами, и посоветовался с молодыми людьми, которые выросли вместе с ним и стояли перед ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находились при нём» или «служили ему»; выражение «стоять перед кем-либо» может обозначать придворную службу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: отверг
  rationale: Глагол עזב означает «оставить, покинуть, отказаться от». В данном контексте «отверг» естественно передаёт намеренное решение не следовать совету старейшин.
- source_word: עֲצַת
  choice: совет
  rationale: Существительное עֵצָה здесь обозначает руководство или рекомендацию, предложенную царю; русское «совет» точно и естественно в этом контексте.
- source_word: הַזְּקֵנִים
  choice: старейшин
  rationale: Слово указывает не просто на пожилых мужчин, но на признанных старших советников; «старейшины» сохраняет возрастной и общественный оттенки.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: который они дали ему
  rationale: Оборот буквально относится к совету, которым они его наставляли. Русское сочетание «дали совет» передаёт смысл без неестественного повтора глагола «советовать».
- source_word: וַיִּוָּעַץ
  choice: стал советоваться с
  rationale: Форма нифаль глагола יעץ здесь означает обращаться за советом или совещаться; «стал советоваться с» ясно передаёт это действие и его направленность на группу собеседников.
- source_word: הַיְלָדִים
  choice: молодыми людьми
  rationale: Хотя יְלָדִים может обозначать детей или юношей, здесь речь идёт о ровесниках Ровоама, выросших вместе с ним и находившихся при дворе. «Молодые люди» не создаёт ошибочного впечатления, будто это дети.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: выросшими вместе с ним
  rationale: Фраза описывает общее взросление рядом с Ровоамом; выбранный оборот краток и естественен по-русски.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: стоявшими перед ним
  rationale: Перевод сохраняет образное выражение исходного текста. В придворном контексте оно также может означать постоянное присутствие при царе или службу ему, что отражено в сноске.
