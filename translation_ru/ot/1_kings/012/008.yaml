  rationale: Правка устраняет неестественную относительную конструкцию, не добавляет аспектуального значения к «советовался» и сохраняет последовательность, придворный контекст и образность еврейского текста. Сноска сохраняет буквальный основной перевод и отмечает допустимое функциональное значение идиомы.
