base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: ru
  text: 'Юноши, выросшие вместе с ним, сказали ему: «Вот что скажи этому народу, который говорил тебе: „Твой отец сделал наше ярмо тяжёлым, а ты облегчи его для нас“. Вот что скажи им: „Мой мизинец толще чресл моего отца“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: юноши
  rationale: В контексте это молодые советники Ровоама, выросшие вместе с ним; «юноши» естественно передаёт возрастно-социальное значение без буквального «дети».
- source_word: גָּדְלוּ אִתּוֹ
  choice: выросшие вместе с ним
  rationale: Прямо передаёт совместное взросление и близость к царю.
- source_word: עֻלֵּנוּ
  choice: на нас тяжёлое ярмо
  rationale: Сохраняет образ ярма как тяжёлого бремени власти и повинностей; глагольная конструкция по-русски выражена естественно.
- source_word: קָטָנִּי
  choice: мой мизинец
  rationale: Буквально форма означает «мой малый [палец]»; в русском устойчивый и точный эквивалент — «мизинец».
- source_word: מָתְנֵי אָבִי
  choice: чресл моего отца
  rationale: Сохраняет телесную метафору и её намеренно хвастливую, грубоватую силу; «талия» была бы современнее, но анатомически и стилистически слабее.
theological_decisions:
- issue: Смысл заключительной гиперболы
  choice: Сохранена буквальная телесная гипербола без поясняющей интерпретации.
  alternative: 'Передать смысл разъяснительно: «Я гораздо сильнее моего отца».'
  rationale: Текст вкладывает в уста советников образное и вызывающее заявление; его богословские и повествовательные оттенки не следует сглаживать.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Повтор «Вот что скажи» сохранён вслед за еврейской риторической структурой. В заключительной реплике употреблено более высокое «чресла», чтобы точно удержать древнюю телесную метафору.
