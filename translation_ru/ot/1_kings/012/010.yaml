  to: 'Юноши, выросшие вместе с ним, сказали ему: «Вот что скажи этому народу, который говорил тебе: „Твой отец сделал наше ярмо тяжёлым, а ты облегчи его для нас“. Вот что скажи им: „Мой мизинец толще чресл моего отца“».'
  rationale: 'Исправлена только передача הִכְבִּיד אֶת־עֻלֵּנוּ: «сделал наше ярмо тяжёлым» точно воспроизводит синтаксис, образ и смысл еврейского текста. Остальная формулировка сохранена, включая повтор «Вот что скажи» и непояснённую гиперболу о мизинце и чреслах.'
