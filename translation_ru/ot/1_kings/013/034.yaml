base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: ru
  text: И это дело[a] стало грехом для дома Иеровоама[b], так что он был искоренён и уничтожен с лица земли.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это обстоятельство», «это событие». Еврейское דָּבָר имеет широкое значение и здесь указывает на описанный выше поступок или образ действий.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Иеровоама» — его род, царская династия.
    reason: cultural_clarification
  - marker: c
    text: 'Буквально: «с лица земли»; это выражение означает полное устранение с земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּדָּבָר הַזֶּה
  choice: И это дело стало
  rationale: Глагол היה здесь выражает наступивший результат, а דָּבָר указывает на только что описанное дело или образ действий, а не обязательно на произнесённое слово.
- source_word: לְחַטַּאת
  choice: грехом для
  rationale: Сохраняет конструкцию со значением того, что описанное дело стало грехом, связанным с домом Иеровоама, без добавления более узкой богословской трактовки.
- source_word: בֵּית יָרָבְעָם
  choice: дом Иеровоама
  rationale: Сохраняет древнееврейский образ «дома», который здесь может обозначать семью, род или царскую династию.
- source_word: וּלְהַכְחִיד
  choice: привело к тому, что он был искоренён
  rationale: Инфинитив передаёт следствие описанного греха; «искоренён» выражает исчезновение рода и остаётся отличным от следующего глагола уничтожения.
- source_word: וּלְהַשְׁמִיד
  choice: и уничтожен
  rationale: Передаёт усиленный глагол שמד и сохраняет пару близких, но не полностью совпадающих глаголов.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Естественный и торжественный русский эквивалент древнееврейского выражения о полном удалении с земли.
theological_decisions:
- issue: Подразумеваемое дополнение при глаголах истребления
  choice: Местоимение «он» относится к дому Иеровоама, то есть к его роду или династии.
  alternative: Глаголы могут быть поняты как относящиеся более общо к самому греховному делу.
  rationale: Ближайший грамматический и наиболее связный по контексту референт — «дом Иеровоама»; мужское местоимение делает подразумеваемое дополнение ясным, не выходя за рамки повествования.
- issue: Отношение инфинитивов וּלְהַכְחִיד וּלְהַשְׁמִיד к предшествующей фразе
  choice: 'Передано как фактическое следствие: «привело к тому».'
  alternative: 'Формально возможно более буквальное целевое прочтение: «чтобы искоренить и уничтожить».'
  rationale: В данном повествовательном контексте инфинитивы описывают итог греха для династии; русская формулировка избегает впечатления, будто сам Иеровоам совершал грех с намерением уничтожить свой дом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён образ «дома» как рода или династии; результативная конструкция раскрыта естественно по-русски, а два еврейских глагола уничтожения переданы разными словами.
