  text: И он пошёл другой дорогой и не вернулся той дорогой, по которой пришёл в Вефиль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И он пошёл
  rationale: Ваййиктоль с союзом וַ продолжает повествовательную последовательность; русское «И он пошёл» естественно связывает этот поступок с предыдущим контекстом.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: другой дорогой
  rationale: דֶּרֶךְ здесь означает дорогу или путь; творительный падеж естественно передаёт маршрут движения по-русски, а «другой» сохраняет прямое противопоставление прежней дороге.
- source_word: וְלֹא שָׁב
  choice: и не возвращался
  rationale: שׁוּב означает «возвращаться, идти обратно». Несовершенный вид естественно описывает соблюдение запрета на обратный путь, не добавляя отсутствующего в тексте направления.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: той дорогой, по которой пришёл
  rationale: Указательное «той» передаёт определённость исходного маршрута; относительная конструкция сохраняет отсылку суффикса בָהּ к דֶּרֶךְ.
- source_word: אֶל בֵּית אֵל
  choice: в Вефиль
  rationale: בֵּית אֵל — географическое название; традиционная русская форма «Вефиль» понятна читателю. Предлог «в» естественно обозначает прибытие в город.
