  text: וַ/יַּנַּ֥ח אֶת נִבְלָת֖/וֹ בְּ/קִבְר֑/וֹ וַ/יִּסְפְּד֥וּ עָלָ֖י/ו ה֥וֹי אָחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: ru
  text: 'И положил он его труп в свою гробницу, и оплакивали его[a]: «Увы, брат мой!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершали по нему плач». Еврейский глагол обозначает скорбь по умершему, нередко выраженную в установленном погребальном причитании.'
    reason: lexical_alternative
  - marker: b
    text: Обращение «брат мой», вероятно, представляет собой формулу плача, выражающую близость или солидарность, и не обязательно означает кровное родство.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: положил
  rationale: Форма глагола נוח в породе хифиль означает «поместить, положить». «Положил» естественно звучит в контексте погребения и сохраняет конкретность действия.
- source_word: נִבְלָתוֹ
  choice: его труп
  rationale: נְבֵלָה обозначает мёртвое тело; слово «труп» передаёт прямой и несколько суровый характер еврейского выражения точнее, чем более мягкое «тело».
- source_word: בְּקִבְרוֹ
  choice: в свою гробницу
  rationale: קֶבֶר может означать могилу или гробницу. В данном повествовательном контексте «гробница» уместна, а возвратное «свою» передаёт притяжательный суффикс и указывает на место погребения самого старого пророка.
- source_word: וַיִּסְפְּדוּ
  choice: оплакивали
  rationale: Глагол ספד означает скорбеть и совершать плач по умершему, нередко в форме установленного погребального причитания. «Оплакивали» ясно передаёт это значение в современном русском языке.
- source_word: עָלָיו
  choice: его
  rationale: При глаголе «оплакивать» значение сочетания ספד עַל естественно передаётся прямым дополнением «его», без буквального, но неидиоматичного «над ним».
- source_word: הוֹי
  choice: Увы
  rationale: Междометие הוֹי выражает скорбный возглас. «Увы» сохраняет погребальную интонацию и не привносит оттенка пророческого осуждения, возможного у слова «горе».
- source_word: אָחִי
  choice: брат мой
  rationale: אָח буквально означает «брат»; здесь это, вероятно, формула плача, выражающая близость или солидарность. Порядок слов «брат мой» придаёт фразе естественное для русского плача торжественное звучание.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным ритмом повествования. Сохранён переход от единственного числа («положил он») к неопределённо-множественному («оплакивали»), присутствующий в еврейском тексте. Добавлять «говоря» не потребовалось: двоеточие естественно вводит содержание плача.'
