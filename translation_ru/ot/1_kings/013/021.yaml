  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: ru
  text: 'И он воззвал к человеку Божьему, пришедшему из Иудеи: «Так говорит Яхве: за то, что ты воспротивился слову Яхве[a] и не соблюл повеления, которое дал тебе Яхве, твой Бог,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устам Яхве» — древнееврейское выражение, означающее то, что сказал Яхве.'
    reason: Сноска сохраняет буквальный образ פִּי יְהוָה и поясняет его идиоматическое значение.
lexical_decisions:
- source_word: וַיִּקְרָא אֶל
  choice: воззвал к
  rationale: Глагол קרא с предлогом אֶל обозначает обращение к кому-либо; «воззвал» передаёт торжественную и резкую силу пророческого обличения, не сводя выражение к нейтральному «сказал».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён устойчивый древнееврейский титул; перевод «пророк» был бы допустимым по смыслу, но менее прозрачным по отношению к форме оригинала.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Естественная русская форма традиционной пророческой формулы; настоящее время по-русски передаёт актуально провозглашаемое Божье слово.
- source_word: מָרִיתָ פִּי יְהוָה
  choice: ты воспротивился слову Яхве
  rationale: מרה выражает сопротивление и непокорность, а не просто случайное неисполнение; идиома «уста Яхве» передана естественным выражением «слово Яхве», при этом буквальный образ отмечен в сноске.
- source_word: וְלֹא שָׁמַרְתָּ אֶת הַמִּצְוָה
  choice: и не соблюл повеления
  rationale: שמר при заповеди означает соблюдать или исполнять; «повеление» сохраняет единственное число и звучит естественно в современном литературном русском.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Сохранены личное имя и обращённая к адресату заветная формула оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя и не заменяет его титулом.
- issue: Сила обвинения в מָרִיתָ
  choice: воспротивился
  alternative: не послушался; ослушался; восстал против
  rationale: «Воспротивился» сохраняет заложенную в глаголе идею сознательной непокорности, но не усиливает её до политического или вооружённого восстания.
- issue: Отношение выражения פִּי יְהוָה к последующему повелению
  choice: слову Яхве
  alternative: устам Яхве; повелению Яхве
  rationale: Идиома относится к сказанному Яхве и оставляет различимым параллельное упоминание конкретного повеления в следующей части стиха.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим тоном. Синтаксис оставлен незавершённым запятой, поскольку причинная конструкция и прямая речь продолжаются в следующем стихе; закрывающая кавычка намеренно не поставлена.
