base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: ru
  text: 'И было: после того как тот поел хлеба и попил, он оседлал осла для него — для пророка, которого вернул[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которого привёл обратно».'
    reason: Передаёт каузативное значение формы הֱשִׁיבוֹ без привнесения оттенка принуждения.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт еврейскую повествовательную формулу, вводящую следующее событие, кратко и без чрезмерно архаичного «и случилось так».
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: после того как тот поел хлеба
  rationale: Сохраняет временную конструкцию и явно названное לֶחֶם; местоимение «тот» помогает различить участника трапезы и последующий субъект, не называя их сверх текста.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: и попил
  rationale: Сохраняет параллелизм и не добавляет не названный в еврейском тексте напиток; «попил» избегает современного значения «напился» — опьянел.
- source_word: וַיַּחֲבָשׁ
  choice: он оседлал
  rationale: В данном контексте חבש означает подготовить вьючное животное, то есть оседлать его.
- source_word: לוֹ
  choice: для него
  rationale: Дательный оборот с ל указывает, что осла оседлали для пользования другого человека.
- source_word: הַחֲמוֹר
  choice: осла
  rationale: Естественный современный русский эквивалент חמור.
- source_word: לַנָּבִיא
  choice: для пророка
  rationale: Сохраняет явное обозначение адресата как «пророка» и пояснительное повторение после «для него».
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: которого вернул
  rationale: Форма породы хифиль от שוב выражает побуждение или приведение к возвращению; «вернул» естественно передаёт это в контексте рассказа.
