  text: 'И сказал он ему: «Пойди со мной домой и поешь хлеба».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пойди со мной в дом и поешь пищи (пообедай)». Еврейское слово «хлеб» может обозначать пищу или трапезу вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное и естественное русское «И сказал» сохраняет связь с предыдущим событием.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог אֶל с суффиксом 3-го лица мужского рода единственного числа обозначает адресата речи.
- source_word: לֵךְ
  choice: Пойди
  rationale: Императив глагола הלך буквально означает «иди/пойди». В русском приглашении «пойди со мной» звучит естественно и сохраняет исходную пространственную перспективу.
- source_word: אִתִּי
  choice: со мной
  rationale: Прямая передача предлога с суффиксом 1-го лица единственного числа.
- source_word: הַבָּיְתָה
  choice: домой
  rationale: Существительное «дом» с направительным ה означает движение к дому; русское наречие «домой» кратко и естественно передаёт эту форму, не добавляя явно отсутствующее притяжательное «ко мне».
- source_word: וֶאֱכֹל
  choice: и поешь
  rationale: Императив אֱכֹל продолжает приглашение. Совершенный вид «поешь» естественен в русском приглашении и не предполагает длительного процесса.
- source_word: לָחֶם
  choice: хлеба
  rationale: Сохраняется основное значение לֶחֶם — «хлеб», хотя в контексте слово может шире обозначать пищу или трапезу.
