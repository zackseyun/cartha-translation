- source_word: וַיָּשָׁב אִתּוֹ
  choice: вернулся с ним
  rationale: Форма от שׁוב обозначает последовательное завершённое действие в повествовании; «вернулся с ним» естественно передаёт возвращение в сопровождении старого пророка.
- source_word: וַיֹּאכַל לֶחֶם
  choice: ел хлеб
  rationale: Буквально «ел хлеб»; хотя выражение может означать принятие пищи вообще, конкретное слово «хлеб» сохранено из-за его смысловой роли в окружающем повествовании.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Прямая и ясная передача еврейского выражения; по контексту местоимение относится к старому пророку.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: пил воду
  rationale: Прямая передача фразы; упоминание воды важно как повторение конкретного запрета в данном эпизоде.
