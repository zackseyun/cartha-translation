base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: ru
  text: 'После того как он похоронил его, он сказал своим сыновьям: «Когда я умру, похороните меня в той гробнице, где похоронен человек Божий; положите мои кости рядом с его костями».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: После того как он похоронил его
  rationale: Естественная русская временная конструкция точно передаёт последовательность действий; отдельное «и было» в современном русском здесь утяжелило бы повествование без смысловой пользы.
- source_word: בָּנָיו
  choice: своим сыновьям
  rationale: Сохраняет конкретное значение еврейского слова, обозначающего сыновей, а не детей вообще.
- source_word: בְּמוֹתִי
  choice: Когда я умру
  rationale: Естественно передаёт временное значение инфинитивной конструкции и её направленность в будущее.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: похороните меня
  rationale: В контексте распоряжения совершенная форма с союзом имеет побудительную силу; русский императив выражает её ясно.
- source_word: בַּקֶּבֶר
  choice: в той гробнице
  rationale: Речь идёт об определённом месте погребения, способном вместить останки нескольких людей; указательное «той» естественно соотносится с последующим определительным придаточным.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Прямо и последовательно передаёт устойчивое наименование персонажа, не сужая его до истолковывающего «пророк».
- source_word: קָבוּר בּוֹ
  choice: похоронен
  rationale: Передаёт состояние, выраженное пассивным причастием; местное значение уже ясно из «где».
- source_word: אֵצֶל
  choice: рядом с
  rationale: Современное и точное обозначение пространственной близости.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: его кости ... мои кости
  rationale: Сохраняет конкретный образ еврейского текста и его значение для дальнейшего повествования.
- source_word: הַנִּיחוּ
  choice: положите
  rationale: Точно передаёт прямое повеление и естественно сочетается в русском языке со словом «кости».
theological_decisions: []
