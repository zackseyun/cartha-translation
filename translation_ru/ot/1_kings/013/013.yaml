  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: ru
  text: 'Он сказал своим сыновьям: «Оседлайте мне осла». Они оседлали ему осла, и он поехал на нём.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּנָיו
  choice: Он сказал своим сыновьям
  rationale: Форма וַיֹּאמֶר продолжает повествование; в современном русском начальное «и» необязательно. בָּנָיו означает именно «его сыновья».
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Оседлайте мне осла
  rationale: В отношении верхового животного חבש означает «оседлать, подготовить к езде». Дательный «мне» естественно передаёт לִי и сохраняет краткость приказа.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Они оседлали ему осла
  rationale: Повтор глагола и существительного сохранён как намеренная связь между приказанием и его исполнением; начальное «и» опущено ради естественного русского повествования.
- source_word: וַיִּרְכַּב עָלָיו
  choice: и он поехал на нём
  rationale: רכב על обозначает езду верхом. «Поехал на нём» естественно передаёт действие, не ограничивая его одним моментом посадки; местоимение мужского рода согласуется с русским словом «осёл».
