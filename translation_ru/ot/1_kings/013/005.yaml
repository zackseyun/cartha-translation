base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: ru
  text: И жертвенник раскололся, и пепел высыпался с жертвенника — в соответствии со знамением[a], которое человек Божий дал по слову Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как знамение» или «согласно знамению». Еврейское מוֹפֵת может означать «знамение», «чудо» или «предзнаменование».'
    reason: Лексическая многозначность מוֹפֵת и оттенок соответствия, выраженный предлогом כְּ.
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент культового מִזְבֵּחַ; дополнительное уточнение «для жертвоприношений» излишне.
- source_word: נִקְרָע
  choice: раскололся
  rationale: Форма нифаль от קרע описывает разрыв или раскалывание. Русское возвратное «раскололся» естественно передаёт происшедшее с каменным жертвенником и сохраняет результативность действия.
- source_word: וַיִּשָּׁפֵךְ
  choice: высыпался
  rationale: Хотя שׁפך буквально имеет значение «изливаться, быть вылитым», применительно к пеплу естественное русское соответствие — «высыпался».
- source_word: הַדֶּשֶׁן
  choice: пепел
  rationale: В данном контексте слово обозначает пепел или жирный остаток жертвоприношений; «пепел» ясно и без ненужной технической детализации передаёт смысл.
- source_word: מִן הַמִּזְבֵּחַ
  choice: с жертвенника
  rationale: Предлог מן обозначает исходную точку; в русском применительно к находившемуся на поверхности пеплу естественно «с жертвенника».
- source_word: כַּמּוֹפֵת
  choice: в соответствии со знамением
  rationale: Предлог כְּ выражает соответствие предсказанному знаку, а מוֹפֵת здесь обозначает подтверждающее знамение. Вариативность слова отмечена в сноске.
- source_word: אֲשֶׁר נָתַן
  choice: которое ... дал
  rationale: Сохранено прямое значение נתן «дать» и связь с ранее данным знамением, несмотря на возможность более пояснительного «возвестил».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён устойчивый древнееврейский титул без истолковывающей замены на «пророк».
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Формула сохраняет широкое значение דָּבָר — «слово, повеление» — и передаёт тетраграмматон личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Титул אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: пророк Божий
  rationale: Буквальный титул сохранён, чтобы не сужать его значение до функции пророка, хотя в контексте человек действует пророчески.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм двух событий сохранён; тире помогает естественно присоединить пояснение об исполнении знамения.
