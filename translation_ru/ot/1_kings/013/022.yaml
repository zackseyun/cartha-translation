  text: וַ/תָּ֗שָׁב וַ/תֹּ֤אכַל לֶ֨חֶם֙ וַ/תֵּ֣שְׁתְּ מַ֔יִם בַּ/מָּקוֹם֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל תֹּ֥אכַל לֶ֖חֶם וְ/אַל תֵּ֣שְׁתְּ מָ֑יִם לֹֽא תָב֥וֹא נִבְלָתְ/ךָ֖ אֶל קֶ֥בֶר אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: ru
  text: 'но ты вернулся, поел хлеба и выпил воды в том месте, о котором Он сказал тебе[a]: «Не ешь хлеба и не пей воды», — твоё мёртвое тело не будет погребено в гробнице твоих отцов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «твоё мёртвое тело не придёт к гробнице твоих отцов».'
    reason: Сохраняет еврейский образ движения («не придёт»), тогда как основной текст естественно передаёт его смысл как отказ в погребении в родовой гробнице.
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: ты вернулся
  rationale: Прямо передаёт שוב в последовательности повествовательных форм и сохраняет обращение к Божьему человеку.
- source_word: וַתֹּאכַל לֶחֶם
  choice: ел хлеб
  rationale: Сохраняет конкретный образ и словесное повторение прежнего запрета, не обобщая до «ел пищу».
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: пил воду
  rationale: Естественная русская формулировка, точно сохраняющая объект и повтор запрета.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: на том месте, о котором Он сказал тебе
  rationale: Передаёт связь относительного придаточного именно с местом; прописная буква отражает Бога как подразумеваемого говорящего в ближайшем контексте, не устраняя синтаксическую отсылку.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: «Не ешь хлеба и не пей воды»
  rationale: Сохраняет два параллельных запрета и повтор существительных; родительный падеж естественен при русском отрицании.
- source_word: נִבְלָתְךָ
  choice: твоё тело
  rationale: В данном контексте означает мёртвое тело. «Труп» передал бы резкость слова, но в современном русском звучал бы чрезмерно клинически или грубо; дальнейшее «погребено» однозначно указывает на смерть.
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: твоё тело не будет погребено в гробнице твоих отцов
  rationale: Естественно выражает на русском конкретный смысл еврейского образа «тело не придёт к гробнице», не превращая его в общее утверждение о посмертном бесчестии.
- source_word: אֲבֹתֶיךָ
  choice: твоих отцов
  rationale: Сохраняет мужской множественный род и смысл родового места погребения, не обобщая до «предков».
theological_decisions:
- issue: Характер вынесенного приговора
  choice: Буквальное предсказание, что тело Божьего человека не будет погребено в родовой гробнице
  alternative: Образное указание на посмертное бесчестие вообще
  rationale: Еврейский текст конкретно говорит о мёртвом теле и гробнице отцов. Перевод сохраняет этот предметный смысл, не развивая не высказанных в стихе богословских выводов.
- issue: Лицо, произнёсшее прежний запрет
  choice: «Он» — Бог, как подразумевает ближайший контекст
  alternative: Строчное «он», формально сохраняющее местоименную неоднозначность
  rationale: В контексте 13:21 речь идёт о слове Господа; прописная буква помогает русскому читателю правильно распознать референта, не добавляя имени в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксический контраст начального «но» сохранён. Тире отделяет приговор; «поэтому» делает естественной по-русски причинно-следственную связь, которая в еврейском выражена непосредственным присоединением следствия.
