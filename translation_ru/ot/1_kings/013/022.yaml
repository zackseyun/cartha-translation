review_pass:
  verdict: revise
  source_fidelity: 'В основной формулировке верно переданы возвращение, хлеб, вода, запрет и лишение погребения в родовой гробнице. Однако «поэтому» добавляет явно выраженную причинно-следственную связку, которой в еврейском тексте нет: приговор следует непосредственно после цитаты. «Тело» также несколько ослабляет נִבְלָתְךָ («мёртвое тело», «труп»).'
  naturalness: '«В том месте, о котором Он сказал тебе» и «не будет погребено в гробнице твоих отцов» естественны для современного литературного русского с библейской интонацией. Завершённые действия лучше передать совершенным видом: «поел» и «выпил».'
  terminology: «Гробница твоих отцов» удачно сохраняет конкретный семейно-родовой смысл קֶבֶר אֲבֹתֶיךָ и мужскую форму «отцов». «Мёртвое тело» передаёт нередко резкую лексику נבלה достаточно точно, не внося ненужной грубости. Прописное «Он» оправдано ближайшим контекстом, где речь идёт о слове Господа.
  issues:
