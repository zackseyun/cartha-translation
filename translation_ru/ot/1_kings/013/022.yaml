    issue: Добавлено «поэтому».
    rationale: В еврейском после процитированного запрета непосредственно следует приговор; отдельный причинный союз отсутствует. Русское тире достаточно передаёт переход без экспликации связи.
  - severity: low
    issue: «Тело» недостаточно явно передаёт נִבְלָתְךָ.
    rationale: Слово обозначает мёртвое тело/труп. Добавление «мёртвое» сохраняет предметную резкость высказывания и не требует читателю выводить смерть лишь из глагола «погребено».
  - severity: low
    issue: Несовершенный вид «ел» и «пил» менее точно отражает завершённые повествовательные формы.
    rationale: «Поел» и «выпил» естественно передают совершившиеся нарушения в русском повествовании.
