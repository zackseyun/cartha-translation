source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: ru
  text: Ибо непременно сбудется[a] слово, которое он возгласил по слову Яхве против жертвенника в Вефиле и против всех святилищ на высотах[b] в городах Самарии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальная еврейская конструкция сочетает абсолютный инфинитив с личной формой глагола и подчёркивает несомненность: «непременно сбудется» или «обязательно исполнится».'
    reason: Передача грамматической эмфазы и допустимого варианта перевода.
  - marker: b
    text: 'Буквально: «всех домов высот»; то есть культовых построек или святилищ при местных высотах.'
    reason: Пояснение буквального выражения и сохранение его лексической неоднозначности.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей просьбы о погребении; «ибо» сохраняет пояснительно-причинную связь и соответствует dignified modern literary register.
- source_word: הָיֹה יִהְיֶה
  choice: непременно сбудется
  rationale: Сочетание абсолютного инфинитива с имперфектом того же глагола усиливает уверенность в исполнении; русский оборот естественно передаёт эту эмфазу.
- source_word: הַדָּבָר
  choice: слово
  rationale: В пророческом контексте обозначает провозглашённое слово или весть, а не просто событие или предмет.
- source_word: אֲשֶׁר קָרָא
  choice: которое он возгласил
  rationale: Глагол передаёт публичное, громкое пророческое провозглашение; «возгласил» сохраняет его устный и торжественный характер.
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Оборот указывает, что пророк говорил на основании данного Богом слова; русский предлог «по» сохраняет возможные оттенки источника и повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: עַל
  choice: против
  rationale: В контексте пророческого обличения предлог обозначает цель направленного осуждающего провозглашения.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенника
  rationale: Прямое обозначение культового жертвенника в Вефиле.
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: Устоявшаяся русская форма топонима בית אל и естественное обозначение местонахождения.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: всех святилищ на высотах
  rationale: Функционально и понятно передаёт буквально «все дома высот»; буквальная структура отмечена в сноске, поскольку она допускает оттенок культовых построек при местных высотах.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: в городах Самарии
  rationale: Прямо передаёт конструкцию принадлежности и не устраняет возможную историко-географическую напряжённость текста.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Степень уверенности в исполнении пророчества
  choice: непременно сбудется
  alternative: сбудется; обязательно исполнится
  rationale: Конструкция הָיֹה יִהְיֶה грамматически подчёркивает несомненность исполнения, но не требует добавочного богословского истолкования.
- issue: Характер культовых объектов בָּתֵּי הַבָּמוֹת
  choice: святилища на высотах
  alternative: дома высот
  rationale: Контекст указывает на культовые сооружения или святилища при высотах; перевод сохраняет понятность, а буквальная форма и её неоднозначность вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; пророческая уверенность и повтор «против» сохранены, а не сглажены.
