  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: ru
  text: 'И в тот день он дал знамение[a], сказав: «Это знамение, о котором сказал Яхве: жертвенник расколется, и пепел[b], который на нём, будет высыпан».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудо», «предзнаменование» (евр. מוֹפֵת).'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может более конкретно обозначать золу и остатки жертвоприношений, в том числе связанные с жиром.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: дал
  rationale: Основное значение נתן — «дать, положить, установить»; в сочетании со словом מוֹפֵת естественно передаётся как «дал знамение».
- source_word: מוֹפֵת
  choice: знамение
  rationale: В данном контексте это удостоверяющий пророческое слово знак; «знамение» сохраняет также возможность необычайного, чудесного события.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Естественный для современного русского повествования способ ввести прямую речь.
- source_word: דִּבֶּר יְהוָה
  choice: сказал Яхве
  rationale: Прошедшее время передаёт уже произнесённое Божье слово, а личное имя יהוה транслитерируется как «Яхве».
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательную силу и торжественную непосредственность пророческого объявления без архаизации.
- source_word: הַמִּזְבֵּחַ נִקְרָע
  choice: жертвенник расколется
  rationale: Пассивно-результативная форма в пророческом контексте указывает на предстоящее событие; «расколется» естественно и точно передаёт разрыв жертвенника.
- source_word: וְנִשְׁפַּךְ
  choice: рассыплется
  rationale: Глагол означает «быть вылитым, просыпанным»; применительно к находящемуся на жертвеннике пеплу русское «рассыплется» звучит естественно.
- source_word: הַדֶּשֶׁן
  choice: пепел
  rationale: Понятное общее обозначение остатков сожжённых жертв; более узкий культовый оттенок поясняется в сноске.
- source_word: אֲשֶׁר עָלָיו
  choice: который на нём
  rationale: Сохраняет относительное придаточное и ясно указывает на пепел, лежащий на жертвеннике.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Временная форма пророческого знамения
  choice: 'будущее значение: «расколется… рассыплется»'
  alternative: 'результативное настоящее: «расколот… рассыпан»'
  rationale: Хотя в еврейском употреблены перфектные формы, контекст представляет событие как предстоящий удостоверяющий знак; русское будущее передаёт эту функцию, не отрицая пророческой уверенности высказывания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор слова «знамение» сохраняет риторическую структуру оригинала; «вот» передаёт пророческую указательность. Маркер второй сноски поставлен непосредственно после слова «пепел», к которому относится пояснение.
