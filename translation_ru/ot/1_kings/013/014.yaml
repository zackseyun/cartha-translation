base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: ru
  text: 'И он пошёл вслед за человеком Божьим и нашёл его сидящим под теребинтом[a]. Он спросил его: «Ты тот человек Божий, который пришёл из Иудеи?» Тот ответил: «Я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под дубом». Еврейское אֵלָה точнее обозначает теребинт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: пошёл вслед за
  rationale: Передаёт конкретное движение за человеком в данном повествовательном контексте, не добавляя явно выраженной идеи преследования.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохраняет устойчивое древнееврейское наименование и не сужает его до истолковывающего варианта «пророк Божий».
- source_word: וַיִּמְצָאֵהוּ יֹשֵׁב
  choice: нашёл его сидящим
  rationale: Точно и естественно передаёт как действие מצא, так и обозначенную причастием позу человека в момент встречи.
- source_word: תַּחַת הָאֵלָה
  choice: под терпентинным деревом
  rationale: אֵלָה прежде всего обозначает терпентинное дерево; существительное «дерево» помогает избежать возможного непонимания редкого названия в русском тексте.
- source_word: הַאַתָּה
  choice: Ты тот
  rationale: Естественно передаёт вопрос об идентичности лица, уточняемой последующим относительным предложением.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: который пришёл из Иудеи
  rationale: Прямо передаёт относительное предложение и исходное место движения.
- source_word: אָנִי
  choice: Я
  rationale: Сохраняет краткий безглагольный ответ оригинала; по-русски он естественно означает «Да, это я» без добавления отсутствующих слов.
theological_decisions:
- issue: Передача אִישׁ הָאֱלֹהִים как титула
  choice: человек Божий
  alternative: пророк Божий
  rationale: Прямой перевод сохраняет более широкое наименование исходного текста и не привносит уточнение должности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Редкое ботаническое название сохранено ради точности и пояснено сноской; краткость заключительного ответа оригинала также сохранена.
