  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: ru
  text: 'Тогда он сказал своим сыновьям: «Оседлайте для меня осла». И они оседлали его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда он сказал
  rationale: Форма с последовательным וַ продвигает повествование; в русском ввод прямой речи естественно передаётся глаголом «сказал», хотя буквально דבר — «говорить».
- source_word: אֶל בָּנָיו
  choice: своим сыновьям
  rationale: בָּנָיו обозначает его сыновей; возвратное «своим» естественно указывает на принадлежность подлежащему.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив «говоря» вводит прямую речь; по-русски его функцию естественно и без потери смысла передаёт двоеточие.
- source_word: חִבְשׁוּ לִי
  choice: Оседлайте для меня
  rationale: חבשׁ применительно к ослу означает «оседлать», а לִי указывает, что животное готовят для говорящего.
- source_word: אֶת הַחֲמוֹר
  choice: осла
  rationale: חֲמוֹר — обычное обозначение осла; определённость понятна из контекста и в русском не требует отдельного показателя.
- source_word: וַיַּחֲבֹשׁוּ
  choice: И они оседлали его
  rationale: Сохранён повтор глагола חבשׁ; местоимение «его» естественно отсылает к непосредственно названному ослу.
