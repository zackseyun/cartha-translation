  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: ru
  text: 'И он сказал: «Я не могу вернуться с тобой или пойти с тобой[a]; и не буду есть хлеба, и не буду пить с тобой воды в этом месте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте в первых двух выражениях «с тобой» употреблена форма женского рода, а в выражении о питье — форма мужского рода. По-русски это различие передать невозможно.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: 'Стандартная передача повествовательной формы wayyiqtol: она сохраняет последовательность рассказа, не придавая союзу дополнительного противительного или причинного значения.'
- source_word: לֹא אוּכַל
  choice: Я не могу
  rationale: Отрицание с יכל выражает невозможность; настоящее время естественно передаёт действующее для говорящего ограничение.
- source_word: לָשׁוּב
  choice: вернуться
  rationale: שׁוב здесь обозначает возвращение назад вместе с собеседником.
- source_word: וְלָבוֹא
  choice: или пойти
  rationale: בוא может означать «приходить», «идти» или «входить» в зависимости от точки зрения. В контексте приглашения отправиться с собеседником естественно «пойти»; указание на вход внутрь в самом выражении не обязательно.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: и не буду есть хлеба
  rationale: Будущее время передаёт отказ от действия; «хлеб» сохранён буквально в соответствии с повторяющейся формулой этого повествования.
- source_word: וְלֹא אֶשְׁתֶּה אִתְּךָ מַיִם
  choice: и не буду пить с тобой воды
  rationale: Сохранены отдельное отрицание, буквальное «вода» и синтаксическая связь «с тобой» именно с питьём.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: в этом месте
  rationale: Буквальная и естественная передача определённого указательного оборота, более полно сохраняющая исходную формулировку, чем простое «здесь».
