  text: וַ/יְדַבֵּ֤ר הַ/מֶּ֨לֶךְ֙ אֶל אִ֣ישׁ הָ/אֱלֹהִ֔ים בֹּאָ/ה אִתִּ֥/י הַ/בַּ֖יְתָ/ה וּֽ/סְעָ֑דָ/ה וְ/אֶתְּנָ֥ה לְ/ךָ֖ מַתָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/007.yaml
  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: ru
  text: 'И сказал царь человеку Божьему: «Пойдём со мной домой, подкрепись[a], и я дам тебе подарок».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поешь». Еврейский глагол означает «подкрепить, поддержать себя» и здесь подразумевает принятие пищи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Последовательная форма с וַ продолжает повествование; в современном русском естественно «И сказал», а не более буквальное «И говорил».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человеку Божьему
  rationale: Сохранено устойчивое древнееврейское обозначение буквально «человек Бога», без истолковывающей замены на «пророк».
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  choice: Пойдём со мной домой
  rationale: Направительная форма הַבַּיְתָה означает движение к дому; русское приглашение «Пойдём со мной домой» передаёт смысл естественно и не уточняет сверх текста «в мой дом».
- source_word: וּסְעָדָה
  choice: подкрепись
  rationale: Глагол סעד означает укрепить или поддержать себя, в данном контексте — пищей. «Подкрепись» сохраняет и основное значение, и подразумеваемую трапезу.
- source_word: וְאֶתְּנָה לְךָ
  choice: и я дам тебе
  rationale: Форма выражает предложение или намерение говорящего; будущее время естественно передаёт его в русском.
- source_word: מַתָּת
  choice: подарок
  rationale: Нейтрально передаёт дар или подношение, не привнося оттенка заслуженной награды.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формула «человек Божий» сохранена как традиционное и понятное обозначение; обращение передано естественно, без архаизмов.
