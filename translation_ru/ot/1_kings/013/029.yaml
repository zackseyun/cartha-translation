base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: ru
  text: Пророк поднял мёртвое тело человека Божьего, положил его на осла и отвёз его обратно. Затем он пришёл в город старого пророка, чтобы оплакать[a] и похоронить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершить по нему погребальный плач».'
    reason: Еврейский глагол ספד может обозначать не только скорбь вообще, но и выраженное вслух траурное оплакивание умершего.
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: поднял
  rationale: Глагол נשׂא обозначает поднятие или несение; «поднял» сохраняет конкретное действие перед помещением тела на осла.
- source_word: נִבְלַת
  choice: мёртвое тело
  rationale: נְבֵלָה означает тело умершего. «Мёртвое тело» точно и при этом звучит в данном повествовании достойнее и естественнее, чем «труп».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Сохранено устойчивое библейское обозначение человека, посланного Богом; в родительном падеже оно естественно связано со словами «мёртвое тело».
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: положил его на осла
  rationale: Каузативная форма נוח здесь означает «поместить, положить»; местоимение может относиться к умершему человеку или его телу, и русский оборот естественно допускает это.
- source_word: וַיְשִׁיבֵהוּ
  choice: привёз обратно
  rationale: Каузативная форма שוב значит «возвратить, доставить назад». В контексте перевозки на осле «привёз обратно» передаёт и возвращение, и способ транспортировки без излишней буквальности.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Он пришёл в город старого пророка
  rationale: Конструкция естественно означает город, где жил старый пророк. Местоимение сохраняет связность повествования, не вводя нового явно названного субъекта.
- source_word: הַזָּקֵן
  choice: старого
  rationale: В контексте это характеристика возраста, отличающая данного пророка от человека Божьего, а не наименование должности.
- source_word: לִסְפֹּד
  choice: чтобы оплакать
  rationale: ספד обозначает траурное оплакивание, нередко выраженное погребальным плачем. «Оплакать» ясно и естественно для современного русского текста.
- source_word: וּלְקָבְרוֹ
  choice: и похоронить его
  rationale: קבר имеет прямое значение «хоронить»; местоименный суффикс относится к умершему человеку Божьему.
theological_decisions: []
