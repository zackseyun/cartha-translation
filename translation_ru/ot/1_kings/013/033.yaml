source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: ru
  text: После этого Иеровоам не свернул со своего злого пути, но снова стал назначать священников высот из среды народа.[a] Всякого, кто желал этого, он посвящал,[b] и тот становился одним из священников высот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из краёв народа». Значение выражения не вполне ясно; оно может указывать на людей из народа без обычных ограничений, на людей из различных его частей или, по другому толкованию, из низших слоёв.'
    reason: Сохраняет лексическую и интерпретационную неоднозначность מִקְצוֹת הָעָם, не закрепляя спорное значение в основном тексте.
  - marker: b
    text: 'Буквально: «наполнял ему руку» — древнееврейское выражение, означающее посвящение или поставление на священническое служение.'
    reason: Поясняет священническую идиому יְמַלֵּא אֶת יָדוֹ и сохраняет её буквальный образ для проверки.
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: После этого
  rationale: В повествовательном контексте оборот естественно указывает на предшествующее событие; русское «после этого» передаёт связь без ненужного уточнения.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: не свернул со своего злого пути
  rationale: Сохраняет конкретную метафору обращения с пути и не заменяет её более истолковывающим богословским термином «не раскаялся».
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: но снова стал назначать
  rationale: Здесь שׁוּב вместе со следующим глаголом обозначает повторение или возобновление действия. «Стал назначать» естественно передаёт создание священников как поставление на служение.
- source_word: מִקְצוֹת הָעָם
  choice: из самых разных слоёв народа
  rationale: Неясный идиоматический оборот буквально связан с «краями/пределами народа». Выбранный вариант передаёт назначение без надлежащего ограничения, но не утверждает спорное значение «из низших слоёв».
- source_word: כֹּהֲנֵי בָמוֹת
  choice: священников высот
  rationale: Краткое традиционно понятное обозначение служителей местных святилищ на возвышенностях; контекст книги придаёт этим культовым местам отрицательную оценку.
- source_word: הֶחָפֵץ
  choice: Всякого, кто желал этого
  rationale: Субстантивированное причастие с артиклем употреблено обобщённо и подчёркивает открытый, неразборчивый характер назначения.
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: он посвящал
  rationale: Идиома «наполнять руку» обозначает поставление или посвящение на священническое служение; буквальная форма приведена в сноске.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: и тот становился одним из священников высот
  rationale: Согласует единственное число глагола с необычным множественным именным сказуемым и ясно передаёт вступление человека в эту группу.
theological_decisions:
- issue: Следует ли передавать שׁוּב богословским термином «раскаяться»
  choice: не свернул со своего злого пути
  alternative: не раскаялся в своём злом пути
  rationale: Хотя речь идёт о нравственном обращении, еврейский текст сохраняет образ поворота с пути. Перевод не должен преждевременно заменять этот образ более специализированным термином.
- issue: Как передать יְמַלֵּא אֶת יָדוֹ — идиому поставления на священническую службу
  choice: он посвящал
  alternative: он рукополагал / он наполнял ему руку
  rationale: «Посвящал» ясно выражает функцию идиомы, не привязывая действие к позднейшей конфессиональной практике; буквальный образ сохранён в сноске.
- issue: Как понимать מִקְצוֹת הָעָם
  choice: из самых разных слоёв народа
  alternative: из низших слоёв народа / из народа
  rationale: Выражение допускает разные толкования. Основной текст передаёт широту и отсутствие ограничений, а сноска сохраняет буквальную форму и отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранена метафора злого пути; редкая культовая реалия «высоты» оставлена в традиционной краткой форме. Спорный оборот מִקְצוֹת הָעָם передан осторожно и снабжён сноской.
