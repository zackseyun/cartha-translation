base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: ru
  text: 'И он возгласил против жертвенника по слову Яхве[a]: «Жертвенник, жертвенник! Так говорит Яхве: вот, дому Давида родится сын по имени Иосия. Он принесёт на тебе в жертву жрецов высот, которые возжигают на тебе курения[b], и человеческие кости будут сожжены на тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словом Яхве»; «согласно слову Яхве».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может относиться не только к благовониям, но и шире — к возжиганию жертв, от которых поднимается дым.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: возгласил против жертвенника
  rationale: Сочетание קרא с עַל в пророческом контексте обозначает громкое провозглашение, направленное против объекта; «возгласил» сохраняет торжественную силу речи.
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Предлог בְּ допускает оттенки основания, поручения или посредства; естественное русское выражение «по слову» передаёт действие по Божьему повелению, не устраняя многозначности полностью.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Жертвенник, жертвенник
  rationale: Повтор сохранён как торжественное пророческое обращение с риторическим олицетворением жертвенника.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Устоявшаяся и точная русская передача формулы пророческого посланника.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно и с должной торжественностью привлекает внимание к пророческому объявлению.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: в доме Давида родится сын
  rationale: Причастная форма נוֹלָד в пророческом объявлении имеет будущее значение. «В доме Давида» естественно передаёт принадлежность к династии.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: по имени Иосия
  rationale: Кратко и естественно передаёт еврейскую именную конструкцию, сохраняя конкретность пророчества.
- source_word: וְזָבַח עָלֶיךָ
  choice: Он принесёт на тебе в жертву
  rationale: זבח обозначает заклание в жертвенном контексте. Такая передача сохраняет культовую лексику и намеренную иронию осквернения жертвенника.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: жрецов высот
  rationale: «Высоты» — традиционное и точное обозначение мест местного культа; «жрецы» отличает служителей осуждаемого культа от нормативного священства Яхве.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: которые возжигают на тебе курения
  rationale: Hiphil קטר может означать возжигание благовоний или более широко — принесение дымных жертв. Основной текст использует понятную культовую формулировку, а примечание сохраняет более широкий вариант.
- source_word: וְעַצְמוֹת אָדָם
  choice: человеческие кости
  rationale: אָדָם употреблено родовым образом и означает человека вообще; «человеческие» точно передаёт это значение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное заветное имя передано напрямую как «Яхве».
- issue: Культовый оттенок וְזָבַח עָלֶיךָ
  choice: принесёт на тебе в жертву
  alternative: заколет на тебе
  rationale: Основной вариант сохраняет жертвенную семантику глагола и мрачную культовую иронию, не сводя действие к обычному убийству.
- issue: Объём значения הַמַּקְטִרִים
  choice: возжигают курения
  alternative: воскуряют на тебе жертвы; возносят на тебе жертвенный дым
  rationale: Контекст допускает как благовония, так и дымные приношения вообще; выбран естественный русский культовый оборот, а смысловая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Сохранены повтор обращения, культовая лексика и прямое именование Яхве; синтаксис сделан понятным обычному читателю без сглаживания сурового образа осквернения жертвенника.
