  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: ru
  text: 'Ведь я получил слово от Господа: «Не ешь там хлеба и не пей там воды; не возвращайся по той дороге, по которой пришёл».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: мне было сказано словом Господа
  rationale: Передаёт формулу получения Божьего повеления естественно по-русски, сохраняя повтор корня דָבָר через сочетание «сказано словом» и не уточняя способ откровения.
- source_word: לֶחֶם
  choice: хлеба
  rationale: Прямой общеупотребительный эквивалент; в данном контексте может обозначать пищу, но буквальное «хлеб» сохраняет образ исходного текста.
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: не возвращайся
  rationale: Естественно передаёт сочетание глаголов «возвращаться» и «идти»; отдельное «идя» в русском было бы тяжеловесным и не добавляло бы смысла.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: по той дороге, по которой пришёл
  rationale: 'Контекстуально точная русская формулировка: речь идёт о дороге, которой человек воспользовался, чтобы прийти в это место.'
- source_word: יְהוָה
  choice: Господа
  rationale: Традиционная русская передача тетраграмматона в библейском тексте.
theological_decisions:
- issue: Характер повеления, полученного пророком
  choice: «мне было сказано словом Господа»
  alternative: «мне было слово по слову Господа»
  rationale: Выбранная формулировка ясно указывает на божественное повеление, не вводя дополнительных представлений о способе откровения; более буквальная альтернатива неестественна по-русски.
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный регистр. Синтаксис слегка приподнят, но понятен обычному читателю; повеления переданы естественными формами единственного числа.
