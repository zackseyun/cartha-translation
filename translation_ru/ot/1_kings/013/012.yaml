  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: ru
  text: 'Их отец спросил их: «По какой дороге он пошёл?» Ведь его сыновья видели дорогу, по которой пошёл человек Божий, пришедший из Иудеи.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: спросил
  rationale: Буквально глагол означает «сказал, заговорил», но здесь вводит прямой вопрос; «спросил» естественно и точно передаёт речевую функцию.
- source_word: אֲבִיהֶם
  choice: их отец
  rationale: Суффикс третьего лица множественного числа указывает на сыновей, упомянутых в контексте.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: по какой дороге
  rationale: Сочетание спрашивает, какой именно путь был избран; по-русски направление движения естественно выражается оборотом «по какой дороге».
- source_word: הָלָךְ
  choice: пошёл
  rationale: Глагол движения передан одинаково в обоих случаях; «пошёл» уместен и в вопросе, и в сообщении о выбранном пути.
- source_word: וַיִּרְאוּ
  choice: видели
  rationale: Форма сообщает о том, что сыновья увидели путь раньше вопроса отца; русский контекст ясно передаёт эту последовательность без особой формы давнопрошедшего времени.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Суффикс единственного числа относится к отцу; местоимение сохраняет эту связь.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранено устойчивое древнееврейское обозначение без сужения его смысла до слова «пророк».
- source_word: מִיהוּדָה
  choice: из Иудеи
  rationale: Предлог מִן обозначает происхождение или исходный пункт; «из Иудеи» — точная и естественная русская передача.
theological_decisions: []
