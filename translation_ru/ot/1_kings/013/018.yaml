  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: ru
  text: 'Он сказал ему: «Я тоже пророк, как и ты. Ангел[a] сказал мне по слову Яхве: „Приведи его обратно к себе домой, чтобы он поел хлеба и выпил воды“». Но он солгал ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник». Еврейское слово может обозначать как ангела, так и человеческого посланника.'
    reason: Лексическая неоднозначность слова מַלְאָךְ.
lexical_decisions:
- source_word: נָבִיא
  choice: пророк
  rationale: Обычное и точное обозначение человека, говорящего от имени Бога.
- source_word: מַלְאָךְ
  choice: ангел
  rationale: В данном рассказе речь естественно понимается как заявление о сверхъестественном вестнике; более широкое значение слова «вестник» сохранено в сноске.
- source_word: דִּבֶּר אֵלַי
  choice: говорил мне
  rationale: Естественно передаёт прямое сообщение; форма «говорил» хорошо сочетается с последующим изложением содержания речи.
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняет пророческую формулу и возможный оттенок основания или поручения, не сводя выражение только к способу передачи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: הֲשִׁבֵהוּ
  choice: Верни его
  rationale: Каузативная форма глагола שוב означает побудить человека возвратиться; «верни его» кратко и естественно выражает этот смысл.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: с собой в свой дом
  rationale: Точно сохраняет совместное возвращение и указанное место назначения.
- source_word: וְיֹאכַל לֶחֶם וְיֵשְׁתְּ מָיִם
  choice: чтобы он поел хлеба и выпил воды
  rationale: Передаёт цель повеления и сохраняет конкретные образы хлеба и воды; совершенный вид естественен после «чтобы» в русском повествовании.
- source_word: כִּחֵשׁ לוֹ
  choice: Но он солгал ему
  rationale: Прямо передаёт разоблачение ложного заявления рассказчиком; союз «но» ясно выражает контраст.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Кем назван מַלְאָךְ
  choice: ангел
  alternative: вестник
  rationale: Контекст допускает понимание небесного посланника, однако само еврейское слово лексически шире; неоднозначность отмечена в сноске, а не устранена.
- issue: Истинность заявления старого пророка
  choice: 'сохранено прямое замечание рассказчика: «Но он солгал ему»'
  alternative: смягчённое «обманул его»
  rationale: Текст прямо характеризует сказанное как ложь и тем самым удерживает напряжение между заявленным откровением и Божьим прежним повелением.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Сохранены библейские конкретные выражения «по слову», «хлеб» и «вода» без ненужной архаизации; прямая речь оформлена естественно для русского издания.
