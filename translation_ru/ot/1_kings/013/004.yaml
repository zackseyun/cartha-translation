  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: ru
  text: 'Когда царь услышал слово человека Божьего, возгласившего против жертвенника в Вефиле, Иеровоам простёр руку от жертвенника и приказал: «Схватите его!» Но рука, которую он простёр против него, отсохла[a], и он не мог вернуть её к себе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высохла»; также возможно: «иссохла».'
    reason: Сноска сохраняет буквальный образ еврейского יבש и указывает допустимый традиционный вариант.
lexical_decisions:
- source_word: דְּבַר אִישׁ הָאֱלֹהִים
  choice: слова человека Божьего
  rationale: В данном контексте דְּבַר обозначает произнесённое пророческое слово; русское множественное «слова» естественно передаёт содержание услышанного, а традиционный титул אִישׁ הָאֱלֹהִים сохранён без истолковывающей замены на «пророк».
- source_word: קָרָא עַל
  choice: возгласившего против
  rationale: «Возгласить» передаёт публичный и сильный характер речи, а «против» сохраняет направленность обличения на жертвенник.
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: Употреблена принятая русская форма топонима; предлог «в» естественен при названии города и не меняет связи с находящимся там жертвенником.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: протянул руку от жертвенника
  rationale: «Протянул руку» естественно передаёт враждебный жест; «от жертвенника» сохраняет מֵעַל и указывает на исходное положение царя у жертвенника.
- source_word: תִּפְשֻׂהוּ
  choice: Схватите его!
  rationale: Повелительное множественное число сохранено как прямой и резкий приказ слугам, без добавления современного юридического оттенка слова «арестуйте».
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: рука ... отсохла
  rationale: Русское «отсохла» сохраняет образ высыхания יבש и естественно описывает внезапно поражённую, утратившую подвижность конечность.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: которую он протянул против него
  rationale: Повтор глагола сохранён, а «против него» передаёт враждебное значение עַל в контексте.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: вернуть её к себе
  rationale: Формулировка близко передаёт каузативное значение שוב и ясно сообщает, что царь не мог отвести руку обратно.
theological_decisions:
- issue: Характер поражения руки Иеровоама
  choice: Описать физическое поражение прямо как то, что рука «отсохла», не уточняя медицинскую причину.
  alternative: «Рука онемела», «рука стала неподвижной» или «рука иссохла».
  rationale: Повествование изображает немедленное сверхъестественное наказание после враждебного приказа царя. «Отсохла» сохраняет исходный образ и результат, не вводя диагноза и не ослабляя чудесный характер события.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён лишь настолько, чтобы длинное еврейское предложение читалось естественно; повторы, значимые для сцены, сохранены.
