  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: ru
  text: И вот, человек Божий пришёл из Иудеи в Вефиль по слову Яхве[a], а Иеровоам стоял у жертвенника, чтобы воскурить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по повелению Яхве»; буквально: «по слову Яхве».'
    reason: Выражение בִדְבַר может обозначать действие по Божьему слову, повелению или поручению.
  - marker: b
    text: 'Или: «и Иеровоам стоял при жертвеннике»; предлог может пониматься также буквально: «на жертвеннике». Глагол может означать «воскурить благовоние» либо, в более широком смысле, «сжечь приношение».'
    reason: Сохраняет отмеченные исходным текстом и английским аудитом варианты для союза וְ, предлога עַל и культового глагола לְהַקְטִיר.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт повествовательный переход и привлечение внимания без излишне архаичного «и вот, behold»-эффекта; сочетание естественно для современного литературного русского языка.
- source_word: אִישׁ אֱלֹהִים
  choice: человек Божий
  rationale: Сохраняет устойчивое древнееврейское обозначение Божьего посланника, не подменяя его более узким толкованием «пророк».
- source_word: מִיהוּדָה
  choice: из Иудеи
  rationale: Прямо передаёт исходный пункт движения; «Иудея» — традиционное русское название Иуды как территории/царства.
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Естественно выражает действие в соответствии со словом и поручением Яхве, сохраняя образ «слова» в оригинале.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: אֶל בֵּית אֵל
  choice: в Вефиль
  rationale: Нормальная русская конструкция направления и традиционная форма географического названия.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: а Иеровоам стоял
  rationale: Причастная конструкция описывает продолжающееся фоновое обстоятельство; союз «а» естественно вводит одновременную сцену, не делая временную связь более явной, чем в оригинале.
- source_word: עַל הַמִּזְבֵּחַ
  choice: у жертвенника
  rationale: В сочетании с глаголом «стоять» предлог обозначает положение при жертвеннике, а не буквально на его поверхности.
- source_word: לְהַקְטִיר
  choice: чтобы совершить воскурение
  rationale: Культовый глагол обозначает превращение приношения в дым и может относиться как к благовонию, так и шире к сжигаемой части жертвы; «совершить воскурение» сохраняет эту культовую широту лучше, чем конкретное «воскурить благовоние».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал употребляет личное имя Бога; транслитерация сохраняет это отличие и не заменяет имя титулом.
- issue: Статус пришедшего посланника
  choice: человек Божий
  alternative: пророк
  rationale: Хотя выражение обозначает пророческого посланника, перевод сохраняет формулировку текста и не вводит истолковывающий титул.
- issue: Характер действия Иеровоама у жертвенника
  choice: совершить воскурение
  alternative: воскурить благовоние
  rationale: Еврейский культовый глагол допускает более широкое значение сожжения приношения; перевод не ограничивает действие исключительно благовонием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранены традиционные имена «Вефиль» и «Иеровоам», выражение «человек Божий» и личное имя «Яхве». Синтаксис остаётся ясным для обычного читателя, а смысловые неоднозначности вынесены в примечания.
