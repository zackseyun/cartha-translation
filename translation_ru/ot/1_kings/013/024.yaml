lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Он пошёл
  rationale: Последовательная форма с וַ продвигает повествование; простое «пошёл» естественно передаёт действие без уточнения логической связи.
- source_word: וַיִּמְצָאֵהוּ אַרְיֵה
  choice: его встретил лев
  rationale: מצא буквально означает «найти», но при внезапной встрече на дороге русское «встретил» звучит естественно и не подразумевает намеренного поиска.
- source_word: בַּדֶּרֶךְ
  choice: на дороге
  rationale: Соответствует ситуации путешествия и сохраняет повтор ключевого места действия.
- source_word: וַיְמִיתֵהוּ
  choice: убил его
  rationale: Порода hифиль глагола מות выражает причинение смерти; «убил» — точный и простой современный эквивалент.
- source_word: נִבְלָתוֹ
  choice: труп его
  rationale: נבלה обозначает мёртвое тело; «труп» сохраняет прямой и мрачный смысл без архаизации.
- source_word: מֻשְׁלֶכֶת
  choice: был брошен
  rationale: Страдательное причастие от שלך подчёркивает состояние тела как поверженного или брошенного, а не просто лежащего.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: осёл стоял рядом с ним
  rationale: Причастие עֹמֵד описывает продолжающуюся сцену; местоимение «ним» согласовано с русским существительным «труп».
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: лев стоял рядом с трупом
  rationale: Повтор слова «труп» следует явному повтору существительного в еврейском тексте, а «стоял» естественно передаёт описательное причастие.
