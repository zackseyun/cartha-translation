base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: ru
  text: Он пошёл и нашёл его мёртвое тело[a], брошенное на дороге; осёл и лев стояли рядом с телом. Лев не съел тело и не растерзал осла[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его труп». Еврейское נְבֵלָה — резкое обозначение мёртвого тела, подчёркивающее действительность смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не сломал осла»; по смыслу лев не растерзал его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: мёртвое тело / тело
  rationale: Существительное נְבֵלָה обозначает мёртвое тело или труп. «Мёртвое тело» сохраняет резкость первого упоминания и естественно звучит по-русски; при повторах достаточно «тело».
- source_word: מֻשְׁלֶכֶת
  choice: брошенное
  rationale: Страдательное причастие от שלך передаёт, что тело было брошено; этот образ не следует ослаблять до нейтрального «лежавшее».
- source_word: בַּדֶּרֶךְ
  choice: на дороге
  rationale: В данном контексте דֶּרֶךְ обозначает дорогу; «на дороге» естественно и пространственно точно.
- source_word: עֹמְדִים אֵצֶל
  choice: стояли рядом с
  rationale: Сочетание причастия и предлога изображает осла и льва неподвижно стоящими возле тела.
- source_word: לֹא אָכַל
  choice: не съел
  rationale: אָכַל — обычный глагол «есть»; «не съел» сохраняет его прямое значение без усиления до «не пожрал».
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: не растерзал осла
  rationale: Буквально שׁבר значит «ломать, сокрушать», но применительно к нападению льва на животное естественный русский эквивалент — «растерзать»; он передаёт результативный и жестокий образ исходного выражения.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Он пошёл и нашёл
  rationale: Последовательные повествовательные формы прямо передают развитие действия; русский вариант сохраняет эту простую связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. «Мёртвое тело» звучит естественнее, чем повторяющееся «труп», но сохраняет наглядность и суровость еврейского текста. Во втором упоминании использовано краткое «тело», чтобы избежать стилистически тяжёлого повтора.
