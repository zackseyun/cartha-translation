- from: И вот, когда они сидели за столом, слово Яхве было к пророку, который вернул его.
  to: И когда они сидели за столом, слово Яхве пришло к пророку, который привёл его обратно.
  rationale: Исправлена неестественная буквальная калька пророческой формулы на нормативное «слово Яхве пришло к пророку». Также уточнён причинный смысл הֱשִׁיבוֹ. Союз «И» сохраняет последовательное повествовательное движение וַיְהִי, а придаточное с «когда» передаёт фоновое продолжающееся действие «они сидели».
