  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: ru
  text: И когда они сидели за столом, слово Яхве пришло к пророку, который привёл его обратно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Повествовательная форма вводит следующее событие; «И вот» естественно передаёт переход и наступление события без архаичного «и было».
- source_word: הֵם יֹשְׁבִים
  choice: когда они сидели
  rationale: Местоимение с причастием обозначает продолжающееся действие, на фоне которого произошло новое событие.
- source_word: אֶל הַשֻּׁלְחָן
  choice: за столом
  rationale: При глаголе «сидеть» сочетание идиоматически обозначает место трапезы; по-русски естественно «сидеть за столом».
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена стандартная пророческая формула и личное имя Бога.
- source_word: וַיְהִי ... אֶל הַנָּבִיא
  choice: было к пророку
  rationale: Формулировка близко передаёт еврейскую конструкцию получения пророческого откровения и сохраняет её библейскую торжественность.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: который вернул его
  rationale: 'Hiphil глагола שׁוב выражает причинное действие: этот пророк побудил человека Божьего возвратиться и привёл его обратно.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: К кому пришло слово Яхве
  choice: к пророку, который вернул его
  alternative: к человеку Божьему, которого вернули
  rationale: Грамматика относительного оборота אֲשֶׁר הֱשִׁיבוֹ указывает на пророка как на того, кто вернул другого мужчину; в контексте это старый пророк.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет пророческую формулу оригинала, но избегает устаревших оборотов вроде «и было, когда».
