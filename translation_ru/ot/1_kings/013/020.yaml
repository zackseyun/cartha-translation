    rationale: Глагол הֱשִׁיבוֹ стоит в хифиле и означает, что пророк заставил или побудил другого человека вернуться. «Привёл его обратно» естественно передаёт это в контексте.
  revised_text: И когда они сидели за столом, слово Яхве пришло к пророку, который привёл его обратно.
