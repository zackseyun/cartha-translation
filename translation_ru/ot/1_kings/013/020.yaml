  naturalness: «Слово Яхве пришло к пророку» — устойчивая и естественная русская передача пророческой формулы. «Привёл его обратно» яснее, чем «вернул его», и точнее выражает причинный оттенок хифиля הֱשִׁיבוֹ, не меняя смысла.
  terminology: «Яхве» последовательно передаёт тетраграмматон יהוה. «Слово Яхве» сохраняет значимую пророческую формулу. «Пророк» соответствует הַנָּבִיא; не следует подменять его «человеком Божьим», поскольку адресатом слова является именно старый пророк.
