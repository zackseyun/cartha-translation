  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: ru
  text: 'Когда пророк, возвративший его с пути, услышал об этом, он сказал: «Это тот человек Божий, который воспротивился слову Яхве[a]. И Яхве отдал его льву, и лев растерзал и умертвил его — по слову Яхве, которое Он изрёк ему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воспротивился устам Яхве»; также возможно: «не повиновался повелению Яхве».'
    reason: Сноска сохраняет конкретный древнееврейский образ и отмечает допустимый смысловой вариант.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן־הַדֶּרֶךְ
  choice: возвративший его с пути
  rationale: Каузативная форма שוב означает, что пророк побудил человека Божьего вернуться; «с пути» сохраняет повторяющийся в повествовании образ пути.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устоявшееся библейское обозначение пророка или посланника Бога, сохраняющее характер титула.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: воспротивился слову Яхве
  rationale: מרה передаёт неповиновение или сопротивление, а буквальное «устам Яхве» является еврейской идиомой, обозначающей высказанное повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: отдал его льву
  rationale: Конструкция נתן с ל выражает передачу человека во власть льва; русский оборот краток и близок к исходному образу.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: растерзал
  rationale: Глагол שבר буквально значит «сломал, сокрушил», но при льве как действующем лице обозначает сокрушительное нападение; «растерзал» естественно передаёт это в русском контексте.
- source_word: וַיְמִתֵהוּ
  choice: умертвил
  rationale: Каузатив от מות прямо означает «причинил смерть»; «умертвил» сохраняет отдельное действие после нападения.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: по слову Яхве, которое Он сказал ему
  rationale: Оборот указывает на исполнение ранее произнесённого слова Яхве и сохраняет повтор корня דבר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Идиома פִּי יְהוָה
  choice: слово Яхве
  alternative: уста Яхве; повеление Яхве
  rationale: «Слово Яхве» естественно по-русски передаёт устно высказанную Божью волю, не ограничивая её только формальным приказом; буквальный образ отмечен в сноске.
- issue: Причинная связь между неповиновением и отдачей льву
  choice: Поэтому Яхве отдал его льву
  alternative: И Яхве отдал его льву
  rationale: Контекст и последовательность высказывания представляют гибель как следствие неповиновения, хотя древнееврейский текст соединяет части обычным союзом ו.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; повтор имени Яхве и выражения «слово Яхве» сохранён ради композиции исходного текста.
