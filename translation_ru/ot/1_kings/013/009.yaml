  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: ru
  text: 'Ибо так повелел мне Господь: «Не ешь хлеба, не пей воды и не возвращайся по той дороге, по которой ты шёл».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: потому что так
  rationale: Передаёт причинное כִּי и указательное значение כֵן естественным современным русским оборотом.
- source_word: צִוָּה אֹתִי
  choice: повелено мне
  rationale: Безличная конструкция естественна по-русски и сохраняет невыраженного в еврейском тексте субъекта повеления.
- source_word: בִּדְבַר יְהוָה
  choice: словом Господа
  rationale: Формально передаёт способ или основание повеления; тетраграмматон по принятой русской библейской традиции передан как «Господь».
- source_word: לֹא תֹאכַל לֶחֶם וְלֹא תִשְׁתֶּה מָּיִם
  choice: Не ешь хлеба, не пей воды
  rationale: Русский родительный падеж при отрицании звучит естественно и точно передаёт запреты.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: и не возвращайся той дорогой, которой ты шёл
  rationale: Сохраняет различие глаголов «возвращаться» и «идти», не подменяя последний более интерпретирующим «пришёл».
theological_decisions:
- issue: Кто является субъектом глагола «повелел»
  choice: Безличное «повелено мне»
  alternative: «Он повелел мне»
  rationale: В данном стихе еврейский глагол имеет мужской субъект, понятный из контекста, но прямо не называет его; безличный русский оборот не добавляет местоименного референта и сохраняет связь со «словом Господа».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием; синтаксис упрощён ровно настолько, чтобы стих был понятен при чтении вслух.
