base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: ru
  text: И вот, проходившие мимо люди увидели тело, брошенное на дороге, и льва, стоявшего возле тела. Они пришли и рассказали[a] об этом в городе, где жил старый пророк.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорили в городе»; по контексту речь идёт о том, что они сообщили об увиденном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет еврейский повествовательный сигнал, привлекающий внимание к внезапно открывшейся сцене, и звучит естественно в современном русском.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: проходившие мимо люди
  rationale: Причастие передаёт продолжающееся действие, а «люди» здесь естественно обозначает неопределённую группу путников без ненужного смыслового сужения.
- source_word: הַנְּבֵלָה
  choice: тело
  rationale: В контексте человеческой смерти «тело» ясно и естественно; более резкое «труп» возможно, но не обязательно для передачи смысла.
- source_word: מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: брошенное на дороге
  rationale: Сохраняет значение страдательного причастия от שׁלך — тело было брошено или повержено, а не просто лежало.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: льва, стоявшего возле тела
  rationale: Точно передаёт положение льва рядом с телом и сохраняет наглядность сцены.
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: рассказали об этом в городе
  rationale: Буквально глагол означает «говорили», но контекст показывает, что прохожие сообщили в городе об увиденном происшествии; подразумеваемое дополнение выражено для ясности русского текста.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: где жил старый пророк
  rationale: Глагол ישׁב с указанием места обозначает проживание; эта формулировка точна и естественна в современном русском.
