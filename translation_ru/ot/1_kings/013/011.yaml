base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: ru
  text: В Вефиле жил один старый пророк.[a] Его сын пришёл и рассказал ему обо всём, что человек Божий сделал в тот день в Вефиле, и о словах, которые тот сказал царю. И они пересказали всё это своему отцу.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «некий старый пророк».'
    reason: lexical_alternative
  - marker: b
    text: 'В начале стиха еврейский текст говорит об одном сыне: «его сын пришёл и рассказал», но в заключении переходит ко множественному числу: «они пересказали это своему отцу». Множественное число имеется и у дополнения при глаголе; этот переход сохранён в переводе.'
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: один старый пророк
  rationale: Сочетание אֶחָד с неопределённым существительным может указывать на некоего представителя класса. «Один старый пророк» естественно передаёт неопределённость и сохраняет присутствующее в еврейском тексте אֶחָד.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: в Вефиле жил
  rationale: Причастие יֹשֵׁב здесь обозначает постоянное проживание, а не буквальное сидение; русский порядок слов естественно вводит место и персонажа.
- source_word: וַיָּבֹא בְנוֹ
  choice: его сын пришёл
  rationale: Форма בְנוֹ морфологически единственного числа, поэтому она не сглажена под последующий переход к множественному числу.
- source_word: וַיְסַפֶּר לוֹ
  choice: рассказал ему
  rationale: Пиэль глагола ספר означает «рассказывать, пересказывать»; выбор естественен для повествовательного сообщения.
- source_word: אֶת כָּל הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה
  choice: обо всём, что ... сделал
  rationale: Хотя מַעֲשֶׂה стоит в единственном числе, оборот с однокоренным עָשָׂה по-русски яснее и естественнее передаётся как «обо всём, что ... сделал», без неуклюжего «о всём деянии».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён традиционный и понятный по-русски пророческий титул.
- source_word: הַיּוֹם
  choice: в тот день
  rationale: В повествовании о прошлом הַיּוֹם естественно соотносится с днём описываемых событий.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: и о словах, которые тот сказал царю
  rationale: «О словах» сохраняет отдельное упоминание пророческой речи; местоимение «тот» устраняет возможную русскую двусмысленность относительно говорящего.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: И они пересказали это своему отцу
  rationale: Сохранено внезапное множественное число подлежащего («они») и множественное «их отцу» через естественное русское «своему отцу»; объект передан собирательным «это», поскольку буквальное «пересказали их» по-русски неясно.
