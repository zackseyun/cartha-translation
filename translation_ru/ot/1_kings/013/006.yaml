base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: ru
  text: 'Царь обратился к человеку Божьему: «Испроси, пожалуйста, у Яхве, твоего Бога, благоволения и помолись за меня, чтобы моя рука восстановилась». Человек Божий испросил у Яхве благоволения, и рука царя восстановилась и стала такой, как прежде.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַל נָא אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: умоли, пожалуйста, Яхве / умолил Яхве
  rationale: Еврейская идиома означает настойчиво просить о благоволении. «Умолить» естественно передаёт силу просьбы, не внося более сильной идеи умилостивления или искупления; буквальный образ лица отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохранено обращение царя «твоего», не заменённое богословски сглаживающим «нашего».
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: и помолись за меня
  rationale: Естественно и точно передаёт ходатайственную молитву, выраженную формой התפלל с предлогом בעד.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: чтобы моя рука восстановилась / рука царя восстановилась
  rationale: Глагол буквально говорит о возвращении руки к человеку, но в контексте обозначает восстановление её прежнего состояния. Русское «восстановилась» ясно передаёт этот смысл и сохраняет параллель между просьбой и исполнением.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: и стала такой, как прежде
  rationale: Естественно передаёт возвращение руки в первоначальное состояние без уточнения характера недуга сверх сказанного в тексте.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранено устойчивое библейское обозначение Божьего посланника, а не более узкое толкование «пророк».
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: обратился
  rationale: Типичная древнееврейская повествовательная формула передана естественным современным русским глаголом; буквальное «ответил и сказал» здесь звучало бы избыточно.
theological_decisions:
- issue: Слова царя «Яхве, твоего Бога»
  choice: Сохранить «твоего Бога»
  alternative: «нашего Бога»
  rationale: Формулировка источника может указывать на дистанцирование царя и одновременно признаёт особые отношения человека Божьего с Яхве. Замена местоимения устранила бы эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; личное имя Яхве и традиционное обозначение «человек Божий» сохранены.
