  text: וַ/יֹּ֤אמֶר אִישׁ הָֽ/אֱלֹהִים֙ אֶל הַ/מֶּ֔לֶךְ אִם תִּתֶּן לִ/י֙ אֶת חֲצִ֣י בֵיתֶ֔/ךָ לֹ֥א אָבֹ֖א עִמָּ֑/ךְ וְ/לֹֽא אֹ֤כַל לֶ֨חֶם֙ וְ/לֹ֣א אֶשְׁתֶּה מַּ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: ru
  text: 'Но человек Божий сказал царю: «Даже если ты отдашь мне половину своего дома[a], я не пойду с тобой и не стану ни есть хлеба, ни пить воды в этом месте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «дом» может здесь означать также всё хозяйство или имущество царя; выражение указывает на чрезвычайно щедрое вознаграждение.
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Традиционное и близкое к еврейскому выражение, обозначающее посланника, уполномоченного Богом; вариант «пророк Божий» был бы более истолковывающим.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Даже если ты отдашь мне половину своего дома
  rationale: Сочетание «даже если» естественно передаёт решительный отказ при гипотетически щедром предложении; образ «половины дома» сохранён, а возможный более широкий смысл пояснён в сноске.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: я не пойду с тобой
  rationale: Хотя глагол буквально означает «приду», в контексте приглашения царя русское «пойду с тобой» естественно передаёт направленность действия.
- source_word: לֹא אֹכַל לֶחֶם וְלֹא אֶשְׁתֶּה מַיִם
  choice: не стану ни есть хлеба, ни пить воды
  rationale: Сохраняются конкретные еврейские слова «хлеб» и «вода», а русская конструкция с повтором «ни» ясно передаёт полный отказ от еды и питья.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: в этом месте
  rationale: Близкий и естественный перевод, сохраняющий указательное значение исходного выражения.
