  terminology: «Союз» точно передаёт בְּרִית в межгосударственном контексте. «Подкуп» передаёт שֹׁחַד без неуместной юридической конкретизации и без эвфемистического смягчения. Имя «Вааса» и титул «царь Израиля» нормативны для русской библейской традиции.
