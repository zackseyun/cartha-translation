base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: ru
  text: «Между мною и тобою есть союз, как между моим отцом и твоим отцом. Вот, я послал тебе подкуп — серебро и золото. Пойди, разорви свой союз с Ваасой, царём Израиля, чтобы он отступил от меня».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: договор
  rationale: В контексте межцарских отношений слово обозначает политическое соглашение; «договор» естественно и точно передаёт смысл.
- source_word: שֹׁחַד
  choice: дар
  rationale: Слово может означать дар, подношение или взятку. Здесь речь о ценностях, посылаемых царю ради изменения союза; «дар» сохраняет дипломатический регистр и не навязывает однозначно юридическую оценку «взятка».
- source_word: הָפֵרָה
  choice: разорви
  rationale: Императив породы hифиль от פרר требует активного нарушения или расторжения действующего договора; «разорви договор» естественно по-русски.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: чтобы он отступил от меня
  rationale: Буквально выражает удаление противника, находящегося над кем-либо или теснившего его; выбранный вариант передаёт прекращение давления Ваасы.
theological_decisions:
- issue: Нравственная окраска שֹׁחַד
  choice: дар
  alternative: взятка
  rationale: Сам стих повествует о плате за нарушение договора, но не формулирует прямой нравственной оценки. «Дар» сохраняет напряжение между дипломатической формой и сомнительной целью, не усиливая оценочность сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Начальная конструкция слегка сглажена для естественности; повтор «между» сохранён по смыслу через сопоставительную фразу. Имена и титулы даны в традиционной русской библейской форме.
