  to: «Между мною и тобою есть союз, как между моим отцом и твоим отцом. Вот, я послал тебе подкуп — серебро и золото. Пойди, разорви свой союз с Ваасой, царём Израиля, чтобы он отступил от меня».
  rationale: Исправлены значение שֹׁחַד и время глагола שָׁלַחְתִּי. «Союз» отражает политический характер בְּרִית; «отступил от меня» сохраняет смысл удаления/прекращения давления в וְיַעֲלֶה מֵעָלָי, не уточняя способ ухода сверх текста.
