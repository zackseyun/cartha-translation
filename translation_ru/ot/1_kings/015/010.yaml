base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: ru
  text: Он царствовал в Иерусалиме сорок один год, а его мать звали Мааха; она была дочерью[b] Авишалома[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — Авишалом; в ряде переводов это имя передаётся как «Авессалом».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочерью»; в родословных это слово может также обозначать потомицу, в том числе внучку.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: сорок один год
  rationale: Еврейская конструкция буквально означает «сорок и один год»; современная русская форма «сорок один год» точно и естественно передаёт продолжительность царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: В данном контексте глагол обозначает продолжительность царского правления, а не восшествие на престол.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог בְּ обозначает место; это естественная русская передача.
- source_word: וְשֵׁם אִמּוֹ
  choice: а его мать звали
  rationale: Так естественно по-русски передаётся именная конструкция «и имя его матери», без изменения смысла.
- source_word: מַעֲכָה
  choice: Мааха
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בַּת
  choice: дочерью
  rationale: Основное значение слова — «дочь». Более широкое генеалогическое употребление отмечено в сноске, но не подменяет формулировку основного текста.
- source_word: אֲבִישָׁלוֹם
  choice: Авишалома
  rationale: Передаёт именно засвидетельствованную здесь еврейскую форму имени אֲבִישָׁלוֹם; традиционный вариант «Авессалом» указан в сноске.
theological_decisions:
- issue: Степень родства Маахи с Авишаломом
  choice: В основном тексте сохранено буквальное обозначение «дочь Авишалома».
  alternative: «внучка Авишалома» или «потомок Авишалома»
  rationale: Еврейский текст прямо употребляет слово «дочь», хотя в родословных оно может обозначать и более отдалённую потомицу. Перевод сохраняет эту историко-генеалогическую напряжённость, не разрешая её посредством толкования.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой. Синтаксис сделан естественным для обычного читателя; буквальная генеалогическая формулировка сохранена, а возможное более широкое значение вынесено в сноску.
