  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָֽ/רָמָ֑ה וַ/יֵּ֖שֶׁב בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/021.yaml
  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: ru
  text: Когда Вааса услышал об этом, он перестал строить Раму и остался в Фирце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перестал строить Раму и жил в Фирце».'
    reason: Глагол וַיֵּשֶׁב может обозначать пребывание, проживание или жительство; в данном контексте основное «остался» передаёт ход повествования, а вариант отражает его обычное значение «жил».
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда ... услышал об этом
  rationale: Оборот וַיְהִי с инфинитивной конструкцией вводит придаточное времени. По-русски естественно передать его без буквального «и было». Дополнение «об этом» восполняется из ближайшего контекста.
- source_word: בַּעְשָׁא
  choice: Вааса
  rationale: Традиционная русская библейская передача личного имени.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: перестал укреплять
  rationale: חדל с מִן и инфинитивом означает прекращение действия. В контексте Рамы בנה обозначает не просто строительство, а возведение укреплений, поэтому «укреплять» ясно и точно передаёт смысл.
- source_word: אֶת הָרָמָה
  choice: Раму
  rationale: Название города передано в традиционной русской форме; אֶת отмечает прямое дополнение.
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: ישׁב допускает значения «сидеть», «жить», «оставаться». Здесь «остался» естественно передаёт развитие повествования, не утверждая непременно постоянного поселения.
- source_word: בְּתִרְצָה
  choice: в Фирце
  rationale: Название города передано в традиционной русской библейской форме; предлог ב передан как «в».
