source:
  edition: WLC
  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: ru
  text: И внёс он в дом Яхве святыни своего отца и свои святыни[a] — серебро, золото и сосуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что посвятил его отец, и то, что посвятил он сам».'
    reason: 'Лексическая альтернатива: формы от קֹדֶשׁ могут обозначать как священные или посвящённые предметы, так и то, что соответствующие лица посвятили.'
lexical_decisions:
- source_word: וַיָּבֵא
  choice: внёс
  rationale: Порода hифиль глагола בוא означает «принести, внести»; «внёс» естественно сочетается с указанным местом назначения — домом Яхве.
- source_word: קָדְשֵׁי אָבִיו
  choice: святыни своего отца
  rationale: Форма множественного числа обозначает предметы, отделённые для священного употребления или посвящённые Богу. «Святыни» кратко передаёт предметный и культовый смысл, не уточняя без основания вид дара.
- source_word: וְקָדְשׁוֹ
  choice: и свои святыни
  rationale: Существительное с местоименным суффиксом употреблено собирательно. Формулировка сохраняет параллелизм с «святынями своего отца», а сноска раскрывает возможное событийное понимание — то, что он сам посвятил.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется образное и устойчивое древнееврейское обозначение святилища как «дома», без замены на более истолковывающее «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», соответствующей форме тетраграмматона в исходном тексте.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: серебро, золото и сосуды
  rationale: Перечень поясняет состав святынь. «Сосуды» является обычным и достаточно широким обозначением храмовой утвари, не сужающим значение כֵלִים.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом, не вводя конфессионально обусловленной замены.
- issue: Характер предметов, обозначенных קֹדֶשׁ
  choice: святыни
  alternative: посвящённые дары; то, что было посвящено
  rationale: «Святыни» сохраняет предметный сакральный смысл и неоднозначность между статусом предметов и действием их посвящения; событийное прочтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Инверсия «И внёс он» сохраняет повествовательную связность стиха, не создавая архаичной тяжеловесности; тире естественно вводит поясняющий перечень.
