base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/009.yaml
  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: ru
  text: В двадцатый год правления Иеровоама, царя Израиля, Аса стал царём Иудеи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Аса начал царствовать над Иудеей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: В двадцатый год правления
  rationale: Стандартная древнееврейская хронологическая формула естественно передаётся по-русски порядковым числительным; слово «правления» добавлено для ясного выражения подразумеваемого отсчёта царских лет.
- source_word: לְ/יָרָבְעָם
  choice: Иеровоама
  rationale: Предлог לְ указывает, по годам чьего царствования ведётся отсчёт; в русском это выражено родительным падежом при слове «правления».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Царский титул сохранён в естественной русской форме и поставлен как приложение к имени.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В формуле о царях завершённая форма глагола обозначает вступление на престол, а не всё царствование.
- source_word: אָסָא
  choice: Аса
  rationale: Традиционная русская форма библейского имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царём Иудеи
  rationale: Еврейское сочетание буквально означает «царь Иудеи»; после глагола «стал» русский творительный падеж естественно передаёт этот смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая и достойная летописная формулировка. Союз וּ отдельно не передан, поскольку стих открывает хронологическое сообщение, где русское «И» было бы стилистически избыточно. Маркер сноски помещён непосредственно в основном тексте.
