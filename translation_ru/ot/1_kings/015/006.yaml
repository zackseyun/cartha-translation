  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: ru
  text: И между Ровоамом и Иеровоамом была война во все дни его жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во все дни жизни Ровоама». С учётом ближайшего контекста и текстологических данных некоторые толкователи относят местоимение к Авии (Авияму).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: И война… шла
  rationale: Сочетание союза, существительного и формы היה обозначает наличие войны; по-русски «война шла» естественно передаёт продолжительное противостояние, не усиливая смысл до непрерывных сражений.
- source_word: בֵין ... וּ/בֵין
  choice: между … и
  rationale: Парная еврейская конструкция естественно передаётся стандартным русским сочетанием «между … и».
- source_word: רְחַבְעָם
  choice: Ровоам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: כָּל יְמֵי חַיָּיו
  choice: во все дни его жизни
  rationale: Формально близкая и понятная русская передача еврейского выражения длительности; местоимение сохранено без уточнения его референта.
theological_decisions:
- issue: К кому относится местоименный суффикс в выражении «во все дни его жизни»
  choice: В основном тексте сохранено неоднозначное «его жизни».
  alternative: «во все дни жизни Ровоама»; согласно иному пониманию контекста и текстологическим данным — «во все дни жизни Авии (Авияма)»
  rationale: Еврейский текст содержит местоименный суффикс мужского рода единственного числа и прямо не называет его референта. Уточнение имени в основном тексте устранило бы подлинную неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «война… шла» звучит естественно, а «во все дни его жизни» сохраняет форму и неоднозначность еврейского текста.
