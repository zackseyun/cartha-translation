  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: ru
  text: Но ради Давида Яхве, его Бог, дал ему светильник в Иерусалиме[a], чтобы воздвигнуть после него его сына и утвердить Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Светильник — образ сохранения царской линии Давида в Иерусалиме.
    reason: Пояснение метафорического значения נִיר.
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В контексте союз вводит противопоставление греху Авии и объясняет, почему его царская линия не была пресечена.
- source_word: לְמַעַן דָּוִד
  choice: ради Давида
  rationale: Естественно передаёт действие, совершаемое ради Давида, с сохранением подразумеваемого заветного основания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: его Бог
  rationale: Сохраняет местоименную неоднозначность еврейского текста; по ближайшему контексту местоимение относится к Авии.
- source_word: נִיר
  choice: светильник
  rationale: Сохраняет конкретную метафору продолжающейся царской линии Давида; слово «светильник» естественнее для предмета, который поддерживают горящим, чем более общее «свет».
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Прямо и естественно передаёт местное значение предлога ב.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: поставив после него его сына
  rationale: Передаёт возведение сына как преемника; деепричастная конструкция яснее раскрывает способ сохранения «светильника» по-русски.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: и утвердив Иерусалим
  rationale: Сохраняет названный в тексте город и передаёт каузативное значение «сделать стоящим, утвердить».
theological_decisions:
- issue: Метафорический смысл נִיר в связи с линией Давида
  choice: Сохранить в основном тексте метафору «светильник»
  alternative: свет; династия; потомство
  rationale: Так сохраняются образность и межтекстовые связи, а династический смысл разъясняется в сноске.
- issue: Референт выражения «его Бог»
  choice: Не уточнять референта в основном тексте
  alternative: Бог Авии; Бог Давида
  rationale: Еврейская местоименная форма допускает формальную неоднозначность, хотя контекст прежде всего указывает на царя Авию.
- issue: Связь инфинитивов לְהָקִים и וּלְהַעֲמִיד с главным действием
  choice: Передать их деепричастиями как способ осуществления дара
  alternative: чтобы поставить... и утвердить...
  rationale: Еврейские ל-инфинитивы могут выражать цель или результат/осуществление; русская конструкция естественно связывает сохранение линии с воцарением сына и устойчивостью Иерусалима, не вводя отдельного будущего действия.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сделан естественным для русского, при этом сохранены личное имя Яхве, метафора светильника и формальная неоднозначность выражения «его Бог».
