base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/032.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: ru
  text: И шла война между Асой и Ваасой, царём Израиля, во все дни их жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во все их дни»; возможный перевод: «всю их жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: И шла война
  rationale: Сочетание существительного מִלְחָמָה с формой היה выражает наличие войны; по-русски «шла война» естественно передаёт длительное состояние, не подменяя его более узким «сражались».
- source_word: בֵּין ... וּ/בֵין
  choice: между ... и
  rationale: Нормальная русская передача парной еврейской конструкции с повторённым предлогом.
- source_word: אָסָא
  choice: Аса
  rationale: Традиционная русская форма личного имени.
- source_word: בַּעְשָׁא
  choice: Вааса
  rationale: Традиционная русская библейская форма личного имени; после предлога употреблён творительный падеж «Ваасой».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царём Израиля
  rationale: Естественное русское приложение, обозначающее статус Ваасы.
- source_word: כָּל יְמֵי/הֶם
  choice: во все дни их жизни
  rationale: Сохраняет образ «всех их дней», но делает еврейский временной оборот понятным и естественным по-русски.
