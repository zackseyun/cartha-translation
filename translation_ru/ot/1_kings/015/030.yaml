base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: ru
  text: за грехи Иеровоама, которые он совершил и которыми побудил Израиль грешить, и за то, что он прогневал Яхве[a], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «своим раздражением (или: провокацией), которым он вызвал гнев Яхве»; еврейское слово может обозначать гнев, досаду или то, что вызывает гнев.'
    reason: Лексическая неоднозначность существительного כַּעַס и необычная для русского языка связь с последующим глаголом הִכְעִיס.
lexical_decisions:
- source_word: עַל חַטֹּאות
  choice: за грехи
  rationale: Предлог עַל здесь вводит причину описанного ранее суда; по-русски причинное «за» естественно сочетается с «грехами».
- source_word: חָטָא
  choice: которые он совершил
  rationale: Так сохраняется связь глагола с существительным «грехи» без тяжеловесного повтора «грехи, которыми он согрешил».
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: в которые ввёл Израиль
  rationale: Каузативная форма передаёт, что Иеровоам не только грешил сам, но и побудил Израиль грешить; «ввёл в грех» звучит естественно и не уточняет способ воздействия.
- source_word: בְּכַעְסוֹ
  choice: своими поступками
  rationale: Существительное כַּעַס в данном контексте обозначает то, чем Иеровоам вызвал Божий гнев. Контекстуальное «своими поступками» избегает современного политического оттенка слова «провокация» и ошибочного впечатления, будто речь только о внутреннем гневе Иеровоама; лексическая неоднозначность отмечена в сноске.
- source_word: הִכְעִיס
  choice: прогневал
  rationale: Каузативный глагол означает «вызвать гнев, прогневать»; «прогневал» кратко и точно выражает направленность действия на Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямо и естественно передаёт еврейскую сопряжённую конструкцию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер воздействия Иеровоама на Израиль
  choice: ввёл Израиль в грех
  alternative: заставил Израиль грешить
  rationale: Сохранено каузативное значение הֶחֱטִיא, но не утверждается принуждение, которого сам глагол не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис причинного фрагмента сохранён, но лексически тяжёлая конструкция כַּעַס / הִכְעִיס передана естественно для русского читателя; её буквальная форма и неоднозначность вынесены в сноску.
