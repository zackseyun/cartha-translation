base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: ru
  text: Он следовал всем грехам своего отца, которые тот совершил до него[a], и сердце его не было всецело предано Яхве, его Богу[b][c], как сердце Давида, его предка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед ним». Эти слова могут означать «в его присутствии» или «до него»; возможно, подразумевается и то, что грехи отца служили ему примером.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сердце его не было вполне верно Яхве, его Богу».'
    reason: alternative_reading
  - marker: c
    text: Еврейское יהוה (YHWH) — личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: Он следовал всем грехам
  rationale: Сочетание הלך с בְּ описывает образ жизни и нравственное поведение. Русское «следовал всем грехам» передаёт также мысль о повторении отцовского примера и звучит естественнее буквального «ходил во всех грехах».
- source_word: אָבִיו אֲשֶׁר עָשָׂה לְפָנָיו
  choice: своего отца, которые тот совершал до него
  rationale: Форма «тот» ясно относит действие к отцу. «До него» сохраняет возможное временное значение לְפָנָיו, не исключая оттенка примера, находившегося перед сыном.
- source_word: לְבָבוֹ
  choice: сердце его
  rationale: «Сердце» сохраняет библейский образ внутреннего человека, включая волю, расположение и верность.
- source_word: שָׁלֵם עִם
  choice: не было всецело предано
  rationale: В данном контексте שָׁלֵם обозначает цельность и нераздельность верности, а не безгрешное совершенство. «Всецело предано» естественно сочетается с направленностью к Богу.
- source_word: יְהוָה אֱלֹהָיו
  choice: Яхве, его Богу
  rationale: Личное имя יהוה передано транслитерацией «Яхве»; приложение «его Богу» сохраняет синтаксис и личную заветную связь.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: как сердце Давида, его предка
  rationale: Сравнение именно сердец сохранено. Поскольку Давид был не непосредственным отцом Авии, а его предком, русское «предка» устраняет возможное фактическое недоразумение, передавая широкий древнееврейский смысл אָב.
theological_decisions:
- issue: Значение שָׁלֵם применительно к сердцу
  choice: всецело предано
  alternative: совершенно / вполне верно
  rationale: Речь идёт о нераздельной верности Яхве, а не об утверждении абсолютной безгрешности. При этом сравнение с Давидом и нравственная оценка текста сохраняются.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное заветное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Передача אָבִיו применительно к Давиду
  choice: его предка
  alternative: его отца
  rationale: Древнееврейское אָב может обозначать предка. Здесь «предок» точно передаёт родственную связь и не создаёт впечатления, будто Давид был непосредственным отцом царя.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Избегается архаичное буквальное «ходил во грехах»; при этом сохраняются образы сердца, преемственности греха и сравнения с Давидом.
