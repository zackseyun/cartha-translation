  text: И шла война между Асой и Ваасой, царём Израиля, все их дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: И шла война
  rationale: Еврейская бытийная конструкция буквально означает «и была война». По-русски «шла война» естественно передаёт продолжительное состояние, не добавляя нового смысла.
- source_word: בֵּין ... וּבֵין
  choice: между ... и
  rationale: Парная конструкция прямо обозначает противостояние двух сторон.
- source_word: אָסָא
  choice: Аса
  rationale: Традиционная русская библейская форма имени.
- source_word: בַּעְשָׁא
  choice: Вааса
  rationale: Традиционная русская библейская форма имени; после предлога «между» употреблён творительный падеж.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царём Израиля
  rationale: Конструктивное сочетание обозначает царский титул Ваасы; приложение согласовано с именем в творительном падеже.
- source_word: כָּל יְמֵיהֶם
  choice: во все дни их жизни
  rationale: Еврейская идиома буквально значит «все их дни». Русская формулировка ясно и естественно передаёт продолжительность до конца жизни обоих царей.
theological_decisions:
- issue: Относится ли כָּל יְמֵיהֶם к жизни или только к царствованию обоих царей
  choice: Сохранена временная формула «во все дни их жизни» без уточнения царствований
  alternative: «во все дни их царствования»
  rationale: В тексте сказано «их дни», а не «дни их царствования»; конкретизация до периода правления была бы толкованием. При этом контекст царских повествований может ограничивать практический смысл периодом их правления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционные формы имён «Аса» и «Вааса» сохранены. Формулировка краткая и естественная.
