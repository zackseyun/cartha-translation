base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: ru
  text: Вааса, сын Ахии, из рода Иссахара, устроил против него заговор[a] и сразил его[b] в Гиввефоне, принадлежавшем филистимлянам[c], когда Надав и весь Израиль осаждали Гиввефон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «составил против него заговор»; также возможно: «вступил в заговор против него».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убил его»; буквально: «поразил его».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «находившемся во власти филистимлян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: устроил против него заговор
  rationale: Оборот קשר с עַל обозначает заговор против человека, особенно в политическом контексте; выбранная формулировка естественна по-русски и сохраняет этот смысл.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Вааса, сын Ахии
  rationale: Имена переданы в устойчивой русской библейской форме, а בֶּן — обычным обозначением сыновства.
- source_word: לְבֵית יִשָּׂשכָר
  choice: из дома Иссахара
  rationale: Фраза указывает на родовую или племенную принадлежность; «из дома» сохраняет семейно-родовой образ בַּיִת.
- source_word: וַיַּכֵּהוּ
  choice: и сразил его
  rationale: Глагол נכה буквально передаёт нанесение удара, а в данном контексте подразумевает смертельный исход; «сразил» сохраняет и образ удара, и результат.
- source_word: בְּגִבְּתוֹן
  choice: у Гиввефона
  rationale: Предлог «у» естественно обозначает место военного действия возле осаждаемого города.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: принадлежавшего филистимлянам
  rationale: Конструкция с ל выражает принадлежность или контроль; основной текст сохраняет наиболее прямое значение, не исключая фактического военного владения.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: когда Надав и весь Израиль
  rationale: Союз вводит сопутствующее обстоятельство; «когда» естественно передаёт фоновое одновременное действие.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: осаждали Гиввефон
  rationale: Оборот צור על в военном контексте означает держать город в осаде; причастная форма указывает на продолжавшееся действие.
