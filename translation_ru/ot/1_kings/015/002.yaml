  text: שָׁלֹ֣שׁ שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: ru
  text: Три года он царствовал в Иерусалиме, а его мать звали Мааха, дочь[b] Авишалома[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древнееврейском тексте здесь стоит форма имени «Авишалом»; в традиционных русских переводах родственное имя обычно передаётся как «Авессалом».
    reason: lexical_alternative
  - marker: b
    text: В древнееврейских родословных слово «дочь» иногда может означать и более отдалённую потомицу.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: три года
  rationale: Количественное числительное с существительным во множественном числе обозначает продолжительность царствования; это естественная русская форма.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Форма глагола מלך здесь означает осуществление царской власти, а не восшествие на престол.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог ב обозначает место; русский предложный оборот точно и естественно передаёт его значение.
- source_word: וְשֵׁם אִמּוֹ
  choice: а его мать звали
  rationale: Естественная современная русская передача буквального оборота «и имя его матери…», сохраняющая смысл царской формулы.
- source_word: מַעֲכָה
  choice: Мааха
  rationale: Имя передано транслитерацией с древнееврейской формы.
- source_word: בַּת
  choice: дочь
  rationale: Сохранено прямое лексическое значение; возможное более широкое генеалогическое употребление отмечено в сноске.
- source_word: אֲבִישָׁלוֹם
  choice: Авишалом
  rationale: Передана именно засвидетельствованная здесь древнееврейская форма имени, без замены на традиционную русскую форму «Авессалом».
theological_decisions:
- issue: Генеалогическое выражение בַּת אֲבִישָׁלוֹם
  choice: В основном тексте сохранено буквальное родственное обозначение «дочь Авишалома».
  alternative: Внучка или другая потомица Авишалома.
  rationale: Сам древнееврейский текст употребляет слово «дочь». Более широкое генеалогическое значение возможно, но его не следует молча подставлять вместо исходного выражения.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской формой «царствовал». Синтаксис слегка сглажен ради естественности, но содержание царской формулы и неоднозначность родословного обозначения сохранены.
