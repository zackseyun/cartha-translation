  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: ru
  text: Прочие деяния Асы, вся его мощь, всё, что он сделал, и города, которые он построил, — не записаны ли они в Книге летописей царей Иудеи? Но в старости он заболел ногами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у него заболели ноги». Древнееврейский текст указывает поражённую часть тела, но не называет точного заболевания; слово רֶגֶל может обозначать ступню или ногу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Прочие деяния Асы
  rationale: Стандартная формула завершения рассказа о царствовании. דְּבָרִים здесь обозначает дела и события, а не слова; русское «прочие деяния» передаёт смысл естественно и без лишнего начального маркера времени.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: вся его мощь
  rationale: Сохраняет абстрактное значение גְּבוּרָה — сила, могущество — и не смешивает его со следующим упоминанием всех совершённых им дел.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он сделал
  rationale: Прямая и широкая передача относительного оборота без неоправданного уточнения характера дел.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: и города, которые он построил
  rationale: בָּנָה означает «строить»; возможная по контексту мысль об укреплении городов не внесена в основной текст.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: не записаны ли они
  rationale: Сохранена риторическая вопросительная форма характерной формулы Книг Царей.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: в Книге летописей царей Иудеи
  rationale: Естественное русское название упомянутого историографического источника; предлог עַל в данном обороте передан идиоматическим «в».
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: Но в старости
  rationale: רַק вводит ограничивающее или контрастное замечание; «но» ясно передаёт этот переход, а временной оборот выражен кратко и естественно.
- source_word: חָלָה אֶת רַגְלָיו
  choice: он заболел ногами
  rationale: Естественный русский оборот, указывающий поражённую часть тела, но не называющий заболевание, которого древнееврейский текст не уточняет.
