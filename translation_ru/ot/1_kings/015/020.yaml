  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: ru
  text: Бен-Хадад послушал царя Асу[a] и послал военачальников своих войск против городов Израиля. Он поразил Ийон, Дан, Авел-Бет-Мааху и весь Киннерот[b] вместе со всей землёй Неффалима[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внял царю Асе». Еврейский оборот означает, что Бен-Хадад благосклонно выслушал просьбу и поступил в соответствии с ней.'
    reason: lexical_alternative
  - marker: b
    text: Киннерот здесь — географическое название, вероятно название области, а не нарицательное слово «арфы».
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «по всей земле Неффалима». Еврейский предлог допускает как присоединительное, так и пространственное понимание связи с предыдущим названием.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: послушал
  rationale: Оборот означает, что Бен-Хадад благосклонно выслушал Асу и откликнулся на его просьбу. «Послушал» сохраняет оба оттенка и не подразумевает, будто Аса обладал властью приказывать ему.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: военачальников своих войск
  rationale: שָׂרֵי обозначает начальников, а חֲיָלִים в данном контексте — военные силы. Русская притяжательная конструкция естественно передаёт אֲשֶׁר לוֹ.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: против городов Израиля
  rationale: При глаголе «послал» предлог עַל в военном контексте обозначает направленность враждебного действия.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה может означать нанесение удара, нападение или разгром. «Поразил» сохраняет широту исходного глагола, не уточняя исход похода сверх сказанного.
- source_word: עִיּוֹן
  choice: Ийон
  rationale: Передача еврейского географического названия средствами современной русской транслитерации.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Авел-Бет-Мааху
  rationale: Составное географическое название передано через дефисы; винительный падеж естественно встроен в русское предложение.
- source_word: כָּל כִּנְרוֹת
  choice: весь Киннерот
  rationale: Здесь כִּנְרוֹת является географическим названием и, вероятно, обозначает область; слово «весь» сохраняет כָּל и согласуется с названием территории.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: вместе со всей землёй Неффалима
  rationale: В конце перечня עַל может присоединять более обширную территорию к названным местам. Перевод передаёт этот добавочный смысл, а возможное пространственное понимание отмечено в сноске.
