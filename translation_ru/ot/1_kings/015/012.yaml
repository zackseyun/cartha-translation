  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: ru
  text: Он удалил[a] из страны мужчин, связанных с культовой проституцией[b], и убрал всех идолов[c], которых сделали его предки[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгнал». Еврейский глагол может означать удалить или заставить покинуть какое-либо место, но не уточняет способа.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает мужчин, связанных с запрещённой культовой сексуальной практикой. Точный характер их роли остаётся предметом обсуждения.
    reason: lexical_alternative
  - marker: c
    text: Еврейское название идолов имеет резко презрительную окраску и, возможно, вызывает ассоциацию с нечистотами.
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «его отцы»; это выражение может обозначать предков или людей прежних поколений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: изгнал
  rationale: В породе хифиль глагол здесь означает удалить или заставить исчезнуть из определённого места. По отношению к людям русское «изгнал из страны» звучит естественно и ясно передаёт принудительное удаление, не уточняя его способ.
- source_word: הַקְּדֵשִׁים
  choice: мужчин, занимавшихся культовой проституцией
  rationale: Форма мужского рода множественного числа обозначает мужчин, связанных с недозволенной культовой сексуальной практикой. Описательный перевод точнее традиционных, но вводящих в заблуждение обозначений и не смешивает этот термин с общим понятием однополых отношений.
- source_word: מִן הָאָרֶץ
  choice: из страны
  rationale: В данном повествовательном контексте הָאָרֶץ означает территорию царства Иуды. «Из страны» естественнее в современном русском языке, чем буквальное «из земли».
- source_word: וַיָּסַר
  choice: уничтожил
  rationale: Хифиль глагола סור означает устранить, убрать. В отношении идолов «уничтожил» естественно выражает их ликвидацию в ходе религиозной реформы, хотя еврейский глагол сам по себе не уточняет способ устранения.
- source_word: כָּל הַגִּלֻּלִים
  choice: всех мерзких идолов
  rationale: גִּלּוּלִים — резко презрительное наименование идолов. Прилагательное «мерзких» сохраняет эту оценочную окраску, тогда как буквальная передача возможной этимологической ассоциации с нечистотами была бы неестественной.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: которых сделали его предки
  rationale: Сочетание «его отцы» идиоматически указывает на прежние поколения. В современном русском «его предки» ясно передаёт этот смысл и не создаёт ошибочного впечатления, будто речь идёт о нескольких непосредственных отцах.
theological_decisions:
- issue: Значение אֲבֹתָיו
  choice: его предки
  alternative: его отцы / его праотцы
  rationale: Еврейское множественное «отцы» здесь служит обычным обозначением предшествующих поколений. «Предки» сохраняет исторический смысл без конфессионального истолкования и естественно звучит по-русски.
- issue: Характер обозначенных словом הַקְּדֵשִׁים лиц
  choice: мужчины, занимавшиеся культовой проституцией
  alternative: посвящённые мужчины / культовые блудники
  rationale: Контекст связывает термин с запрещённой культовой практикой, а грамматическая форма указывает на мужчин. Перевод не расширяет значение до общей нравственной или современной категориальной характеристики.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Описательное обозначение культовой практики выбрано ради точности и понятности; презрительная окраска названия идолов сохранена без грубой буквальности.
