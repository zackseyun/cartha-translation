  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: ru
  text: Аса сделал то, что было правильным в глазах Яхве, как Давид, его отец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его предок». Здесь слово «отец» обозначает династического предка, а не непосредственного отца.'
    reason: 'Лексическая альтернатива: אָב может обозначать как отца, так и предка.'
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: делал
  rationale: Глагол עשה означает «делать, совершать». В формуле нравственной оценки царя «делал то, что было правильным» естественно передаёт значение исходного текста.
- source_word: אָסָא
  choice: Аса
  rationale: Имя передано в принятой русской библейской форме.
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Прилагательное יָשָׁר означает «прямой, правильный, праведный». Субстантивированная конструкция здесь обозначает правильные с нравственной точки зрения поступки.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранена прозрачная древнееврейская метафора оценки с точки зрения Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: כְּדָוִד
  choice: как и … Давид
  rationale: Предлог כ־ выражает сравнение; частица «и» делает русскую фразу естественной, не изменяя смысла.
- source_word: אָבִיו
  choice: его отец
  rationale: Сохранено буквальное родственное обозначение אָב; в данном династическом контексте оно означает предка, а не непосредственного отца, что пояснено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его отличие от титулов.
- issue: Значение выражения «его отец Давид»
  choice: Сохранить «его отец» в основном тексте
  alternative: «его предок Давид»
  rationale: Так сохраняются формулировка и династический язык оригинала, а возможное непонимание устраняется сноской.
translation_notes:
  register: Современный литературный русский язык; сохранена библейская метафора «в глазах Яхве», при этом синтаксис сделан понятным и естественным.
