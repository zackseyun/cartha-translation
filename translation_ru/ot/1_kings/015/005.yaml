  terminology: «Яхве» последовательно соответствует проектному решению для יהוה. «Урия-хеттеянин» сохраняет личное имя и этническое обозначение; «дело Урии-хеттеянина» не конкретизирует характер события и сохраняет исходную неоднозначность דָּבָר.
