  source_fidelity: 'Причинный союз «потому что», имя «Яхве», образ «в глазах», всеохватность отрицания и явно ограниченное исключение переданы верно. Однако «делал угодное» не вполне точно передаёт הַיָּשָׁר («правое, правильное»): «угодное» может смещать смысл к тому, что просто приятно Богу. Оборот «дело с Урией» разговорно-неопределённый; конструкция בִּדְבַר естественнее передаётся как «в деле Урии-хеттеянина».'
