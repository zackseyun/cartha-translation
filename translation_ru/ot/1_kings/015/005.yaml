source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: ru
  text: потому что Давид поступал правильно в глазах Яхве и во все дни своей жизни не уклонялся ни от чего из того, что Он ему заповедал, кроме дела Урии-хеттеянина[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кроме случая с Урией-хеттеянином».'
    reason: Лексема דָּבָר в этом обороте может означать «дело», «случай» или «обстоятельство».
lexical_decisions:
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В контексте частица вводит основание сказанного в предыдущем стихе; причинный союз естественно передаёт эту связь.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: делал угодное
  rationale: Еврейская идиома означает поступать правильно с точки зрения оценивающего лица; по-русски «делал угодное в глазах» естественно сочетается со следующим оборотом и сохраняет нравственную оценку.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена прозрачная древнееврейская метафора оценки, понятная современному русскому читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: וְלֹא סָר
  choice: не отступал
  rationale: Глагол обозначает уклонение от предписанного пути; «не отступал» ясно выражает продолжительное послушание.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: ни от чего, что Он заповедал ему
  rationale: Отрицательное местоимение после «не отступал» естественно по-русски передаёт всеохватность כֹּל; прописная буква указывает, что субъект заповеди — Яхве.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: во все дни своей жизни
  rationale: Формулировка близка к образу оригинала и остаётся понятной в современном литературном русском.
- source_word: רַק
  choice: кроме
  rationale: Здесь частица вводит единственное явно названное исключение.
- source_word: בִּדְבַר אוּרִיָּה
  choice: в деле с Урией
  rationale: דָּבָר в этой конструкции может означать дело, случай или обстоятельство; оборот «дело с Урией» краток и не добавляет отсутствующих в стихе пояснений.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Урия хеттеянин
  rationale: Имя и этническое обозначение переданы в традиционной и понятной русской форме.
theological_decisions:
- issue: Общая положительная оценка послушания Давида при известных иных грехах
  choice: Сохранить без смягчения широкую похвалу и прямо названное исключение.
  alternative: Пояснить, что Давид был верен лишь в общем, либо добавить упоминание его покаяния.
  rationale: Сам стих соединяет всеохватную оценку с одним исключением; перевод не должен устранять это богословское напряжение толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены образ «в глазах» и личное имя Яхве; синтаксис перестроен для естественного русского порядка слов без устранения причинной связи с предыдущим стихом.
