  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: ru
  text: Тогда царь Аса созвал всю Иудею — никто не был освобождён от повинности[a], — и люди унесли камни Рамы и её древесину, которыми Вааса пользовался при строительстве[b]. Из них царь Аса построил Геву в земле Вениамина и Мицпу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не было освобождённого», то есть никто не был свободен от этой работы.'
    reason: lexical_alternative
  - marker: b
    text: Древнееврейская фраза буквально может быть понята как «которыми Вааса строил»; по контексту имеются в виду материалы, использованные им при строительстве Рамы.
    reason: ambiguity
lexical_decisions:
- source_word: הִשְׁמִיעַ אֶת כָּל־יְהוּדָה
  choice: созвал всю Иудею
  rationale: Каузативная форма глагола שׁמע буквально означает «велел услышать», а в данном контексте — объявил сбор или призвал население к общей работе. «Созвал» естественно передаёт практический смысл выражения.
- source_word: אֵין נָקִי
  choice: никто не был освобождён от повинности
  rationale: Здесь נָקִי означает не нравственную невиновность, а свободу от обязательной службы или работы. Добавление «от повинности» ясно передаёт контекст всеобщей мобилизации.
- source_word: וַיִּשְׂאוּ
  choice: унесли
  rationale: Глагол נשׂא обозначает перенос материалов; по контексту их забрали из Рамы для повторного использования.
- source_word: עֵצֶיהָ
  choice: брёвна
  rationale: Буквально «её древесину/деревья»; в строительном контексте речь идёт о деревянных строительных материалах. «Брёвна» звучит естественно и конкретно.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: которые Вааса использовал для строительства
  rationale: Относительное местоимение по смыслу относится к камням и деревянным материалам. Инструментальная передача избегает неестественного впечатления, будто Вааса «строил брёвна», при этом не добавляет отсутствующее в самой фразе прямое дополнение.
- source_word: וַיִּבֶן בָּם
  choice: из них ... построил
  rationale: Предлог ב с местоименным суффиксом указывает на камни и брёвна как на строительный материал.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Геву Вениаминову
  rationale: Традиционная и понятная русская форма отличает этот город от одноимённых мест и передаёт его связь с территорией Вениамина.
- source_word: הַמִּצְפָּה
  choice: Мицпу
  rationale: Артикль при древнееврейском топониме отдельно не передаётся; «Мицпа» — устоявшаяся русская форма названия.
