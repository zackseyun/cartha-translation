base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: ru
  text: Тогда Вааса, царь Израиля, выступил против Иудеи и построил Раму[a], чтобы никто не мог ни выйти, ни войти к Асе, царю Иудеи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «построил Раму». В контексте, вероятно, имеются в виду работы, превратившие это место в стратегически важный укреплённый пункт.'
    reason: cultural_note
  - marker: b
    text: Выражение «выйти и войти» — еврейская парная формула, обозначающая передвижение или доступ. Текст прямо указывает на движение «к Асе», не уточняя все направления движения.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל־יְהוּדָה
  choice: выступил против Иудеи
  rationale: В военном контексте עלה с עַל означает враждебное выступление или поход против кого-либо. «Выступил против» естественно передаёт это значение, не добавляя прямого указания на сражение.
- source_word: בַּעְשָׁא
  choice: Вааса
  rationale: Традиционная и узнаваемая русская передача имени царя Израиля.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: укрепил Раму
  rationale: Глагол בנה буквально означает «строить», однако применительно к уже существующему стратегическому городу здесь обозначает строительные работы по его превращению в укреплённый пограничный пункт. Буквальная возможность отмечена в сноске.
- source_word: לְבִלְתִּי תֵּת
  choice: чтобы не позволять
  rationale: Передаёт целевую конструкцию со значением намеренного воспрепятствования.
- source_word: יֹצֵא וָבָא
  choice: выходить и входить
  rationale: Сохранена еврейская парная формула, охватывающая передвижение и доступ; её смысл разъяснён в сноске.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: к Асе, царю Иудеи
  rationale: Предлог לְ непосредственно выражает направленность или отношение к Асе. Перевод не добавляет явно отсутствующее в еврейском тексте «от него».
