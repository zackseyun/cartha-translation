  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: ru
  text: Он делал зло в глазах Яхве и шёл путём Иеровоама, следуя его греху, которым тот ввёл Израиль в грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивая оценочная формула в книгах Царств передана естественно по-русски; несовершенный вид выражает характерное поведение правителя.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена прозрачная древнееврейская метафора божественной оценки.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: шёл путём Иеровоама
  rationale: Сохранена метафора пути как образа поведения; форма естественна для современного литературного русского языка.
- source_word: וּבְחַטָּאתוֹ
  choice: следуя его греху
  rationale: Передана связь с предыдущей метафорой поведения, при этом местоимение относится к Иеровоаму. Более буквальное «шёл в его грехе» по-русски неестественно.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которым тот ввёл Израиль в грех
  rationale: Каузатив породы hifil передан выражением «ввёл в грех»; «тот» помогает различить действующего царя и Иеровоама без тяжеловесного повторения имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон; форма «Яхве» передаёт его как имя, а не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением библейских метафор «в глазах» и «идти путём». Формулировка ясная и достойная, без архаизма «во грехе его».
