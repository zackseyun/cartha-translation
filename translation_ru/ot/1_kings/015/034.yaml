  source_fidelity: 'Текст точно передаёт обе древнееврейские оценочные формулы: «делал зло в глазах Яхве» соответствует וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה, а «шёл путём Иеровоама» — וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם. «Следуя его греху» естественно раскрывает неидиоматичное для русского «ходил в его грехе» и сохраняет связь с грехом Иеровоама. «Ввёл Израиль в грех» адекватно передаёт каузатив הֶחֱטִיא, не сужая его до одного конкретного способа воздействия.'
