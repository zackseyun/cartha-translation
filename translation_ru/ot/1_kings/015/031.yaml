  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие дела Надава и всё, что он сделал, разве они не записаны в книге летописей царей Израиля[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге анналов царей Израиля». Здесь имеется в виду царская летопись, а не библейские книги Паралипоменон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие дела
  rationale: יֶתֶר означает «остаток, остальное», а דִּבְרֵי в формуле царского итога обозначает сведения о деяниях правителя. «Прочие дела» естественно и точно передаёт эту историографическую формулу.
- source_word: נָדָב
  choice: Надава
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж по синтаксису фразы.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он сделал
  rationale: Прямо передаёт относительное придаточное, сохраняя полноту выражения כָל.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: הֲלֹא вводит риторический вопрос, предполагающий утвердительный ответ; «разве не» сохраняет эту функцию. «Записаны» в контексте архивного источника естественно передаёт כְּתוּבִים, буквально «написаны».
- source_word: עַל סֵפֶר
  choice: в книге
  rationale: Хотя עַל буквально означает «на», по-русски запись, содержащаяся в письменном источнике, естественно находится «в книге». סֵפֶר может обозначать книгу или свиток; здесь общее «книга» не вносит излишней конкретизации.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: летописей царей Израиля
  rationale: В данной формуле выражение обозначает анналы, то есть царскую историческую запись. Родительный оборот естественно передаёт отношение, выраженное לְ.
theological_decisions:
- issue: Отождествление упомянутого источника с каноническими книгами Паралипоменон
  choice: Передать название описательно как «книга летописей царей Израиля» и пояснить его в сноске
  alternative: Оформить «Летописи» как название известной канонической книги
  rationale: Еврейская формула указывает на царский архивный источник и сама по себе не отождествляет его с каноническими книгами Паралипоменон.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и формульного характера царского итога. Риторический вопрос передан конструкцией «разве не…», а местоимение «они» сохранено для отражения еврейского הֵם и ясной связи с перечисленными делами.
