base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: ru
  text: Аса почил с отцами своими[a] и был погребён с отцами своими в городе Давида, отца своего[b]. Вместо него воцарился его сын Иосафат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с предками своими». Буквально: «с отцами своими» — обычная царская формула смерти; в этом стихе за ней следует сообщение о погребении.'
    reason: lexical_alternative
  - marker: b
    text: Давид назван «отцом» Асы как его царственный предок, а не как непосредственный родитель.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Сохраняет смысл стандартной царской формулы о смерти, не сводя её к нейтральному «умер»; в современном русском «почил» естественно передаёт торжественный повествовательный регистр.
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Формально сохраняет древнееврейскую династическую и погребальную формулу; возможное значение «с предками» пояснено в сноске.
- source_word: וַיִּקָּבֵר
  choice: был погребён
  rationale: Точно передаёт пассивное значение нифаля и соответствует достоинству царской хроники.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: в городе Давида, отца своего
  rationale: Сохраняет синтаксис и династическую связь исходного текста; сноска предупреждает, что Давид назван отцом в смысле царственного предка.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: Кратко и естественно передаёт вступление на престол в формуле царского преемства.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт именно замещение на престоле, а не только временную последовательность.
