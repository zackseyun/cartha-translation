reference: 1 Kings 15:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: ru
  text: Когда он воцарился, то поразил весь дом Иеровоама. Он не оставил Иеровоаму ни одной живой души[a], пока не истребил его[b], по слову Яхве, которое Он изрёк через Своего слугу Ахию из Силома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не оставил Иеровоаму никакого дыхания», то есть никого не оставил в живых.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока не истребил весь его дом»; еврейское местоимение может относиться к дому Иеровоама как к единому целому.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Когда он воцарился
  rationale: Еврейская повествовательная формула с временным כְ естественно передаётся придаточным времени; «воцарился» точно соответствует контексту вступления на престол.
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה обозначает нанесение удара или поражение; в контексте уничтожения династии подразумевается убийство, но перевод сохраняет образ и силу исходного глагола.
- source_word: כָּל בֵּית יָרָבְעָם
  choice: весь дом Иеровоама
  rationale: «Дом» сохраняет династический и семейно-родовой смысл еврейского בַּיִת в царском контексте.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה לְיָרָבְעָם
  choice: не оставил у Иеровоама ни одной живой души
  rationale: Идиоматический русский оборот передаёт значение полного отсутствия выживших и отчасти сохраняет образ дыхания, заключённый в נְשָׁמָה; לְ выражает принадлежность к дому Иеровоама.
- source_word: עַד הִשְׁמִידוֹ
  choice: пока не истребил его
  rationale: Сохранено мужское единственное местоименное окончание «его»; вероятнее всего, оно соотносит дом Иеровоама как единое целое с самим Иеровоамом, но грамматическая неоднозначность отмечена в сноске.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Краткая формула естественно передаёт исполнение ранее сказанного пророчества; личное имя יהוה транслитерировано как «Яхве».
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: которое Он изрёк через Своего слугу
  rationale: «Через» естественно передаёт еврейскую формулу пророческого посредничества בְּיַד без ненужной буквальности «рукою»; «изрёк» соответствует торжественному пророческому контексту.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: Ахию из Силома
  rationale: Гентилик передан прозрачным для современного читателя указанием происхождения, а имя поставлено в требуемый русским синтаксисом винительный падеж.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Референт местоименного суффикса в הִשְׁמִידוֹ
  choice: его
  alternative: его дом; весь этот дом
  rationale: Мужской суффикс единственного числа сохранён буквально, чтобы не устранять возможную соотнесённость как с Иеровоамом, так и с его домом, понимаемым собирательно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранён династический термин «дом», но буквальная формула «рукою слуги» заменена естественным «через Своего слугу». Все сноски обозначены в основном тексте.
