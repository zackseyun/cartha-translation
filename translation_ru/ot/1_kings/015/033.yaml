  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: ru
  text: В третий год правления Асы, царя Иудеи, Вааса, сын Ахии, воцарился над всем Израилем и царствовал в Фирце двадцать четыре года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: В третий год правления
  rationale: Предлог בְּ и конструкция со словом «год» задают временную рамку. Добавление «правления» естественно для русской формулы датировки и ясно передаёт отсчёт по годам царствования Асы.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Предлог לְ указывает, к чьему царствованию относится датировка; приложение оформлено по нормам современного русского языка.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В данном месте глагол обозначает вступление Ваасы на престол; «воцарился» отличает событие воцарения от последующего указания продолжительности царствования.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Вааса, сын Ахии
  rationale: Имена переданы в принятой русской библейской форме; еврейская патронимическая конструкция сохранена как «сын Ахии».
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Сочетание עַל с מָלַךְ выражает власть над народом; «всем Израилем» формально сохраняет כָּל.
- source_word: בְּתִרְצָה
  choice: в Фирце
  rationale: Предлог בְּ обозначает место, а «в Фирце» естественно передаёт местонахождение царского правления.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: двадцать четыре года
  rationale: Числительное указывает продолжительность царствования и передано обычной современной русской конструкцией.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства летописной формулы. Формулировка остаётся близкой к синтаксису древнееврейского текста, но избегает неестественного для русского повтора «царствовал… царствовал».
