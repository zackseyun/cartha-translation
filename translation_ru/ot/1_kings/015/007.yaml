id: 1KI.15.7
reference: 1 Kings 15:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י אֲבִיָּם֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ם וּ/בֵ֥ין יָרָבְעָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: ru
  text: Остальные деяния Авияма[a] и всё, что он сделал, не записаны ли в Книге летописей царей Иудеи[b]? Между Авиямом и Иеровоамом была война.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых параллельных или связанных местах этот царь назван Авией; здесь в еврейском тексте стоит имя Авиям.
    reason: alternative_reading
  - marker: b
    text: 'Или: «в летописи царей Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: остальные деяния
  rationale: В формуле завершения царского повествования сочетание обозначает прочие дела и события царствования; «остальные деяния» естественно передаёт этот историографический смысл.
- source_word: אֲבִיָּם
  choice: Авиям
  rationale: Передано имя именно в форме масоретского текста, без согласования с встречающейся в других местах формой «Авия».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он сделал
  rationale: Прямая и широкая по смыслу передача относительного оборота без уточнения характера совершённого.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: не записаны ли
  rationale: Сохранена форма риторического вопроса; «записаны» в данном архивно-летописном контексте звучит естественнее буквального «написаны».
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Книга летописей царей Иудеи
  rationale: Передано как название царского исторического источника; конструкция с ל выражена естественным русским родительным падежом.
- source_word: וּמִלְחָמָה הָיְתָה בֵּין
  choice: Между … была война
  rationale: Прямая передача бытийной конструкции без добавления явно выраженной длительности.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Употреблена традиционная и узнаваемая русская форма библейского имени.
theological_decisions: []
