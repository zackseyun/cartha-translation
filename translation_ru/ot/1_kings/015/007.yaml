  register: Современный литературный русский язык с умеренно торжественным историографическим звучанием. Риторический вопрос оригинала сохранён; синтаксис сделан ясным для обычного читателя. Маркер примечания [b] поставлен при названии источника, к которому относится лексическая альтернатива.
