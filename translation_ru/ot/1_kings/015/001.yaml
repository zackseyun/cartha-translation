  text: וּ/בִ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ יָרָבְעָ֣ם בֶּן נְבָ֑ט מָלַ֥ךְ אֲבִיָּ֖ם עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: ru
  text: В восемнадцатый год царствования Иеровоама, сына Навата, Авиям[a] стал царём Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Авиям»; в других местах тот же царь назван «Авия».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: В восемнадцатый год царствования
  rationale: Так естественно по-русски передаётся древнееврейская формула датировки по году правления; начальный союз отдельно не выражен, поскольку служит обычной связкой повествования.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Предлог в формуле указывает на год правления названного царя. Традиционные русские формы имён сохраняются, а патроним передан прямо.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В этой формуле глагол обозначает восшествие на престол, а не весь период царствования.
- source_word: אֲבִיָּם
  choice: Авиям
  rationale: Основной текст следует форме масоретского текста אֲבִיָּם и не заменяет её встречающейся в других местах формой имени.
- source_word: עַל יְהוּדָה
  choice: Иудеи
  rationale: При глаголе царствования сочетание обозначает народ или территорию, над которой правит царь; русская конструкция «стал царём Иудеи» передаёт это естественно и точно.
