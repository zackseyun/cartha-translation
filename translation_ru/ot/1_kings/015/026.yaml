  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: ru
  text: Он делал зло в глазах Яхве и шёл путём своего отца, следуя его греху, которым тот ввёл Израиль в грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: делал зло
  rationale: Передаёт устойчивую формулу оценки царя просто и естественно, сохраняя несовершенный вид как характеристику его правления.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет еврейскую метафору оценки и передаёт тетраграмматон личным именем «Яхве».
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: шёл путём своего отца
  rationale: Сохраняет образ хождения как образ поведения и подражания отцу.
- source_word: וּבְחַטָּאתוֹ
  choice: следуя его греху
  rationale: Буквальное «и в его грехе» по-русски звучит неестественно; выбранная формулировка ясно сохраняет параллель между путём отца и характерным для него грехом.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которым тот ввёл Израиль в грех
  rationale: Передаёт каузативное значение породы hифиль глагола חטא. Указательное местоимение «тот» естественно относит действие к отцу, названному в предыдущей части.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное Божье имя — тетраграмматон; транслитерация сохраняет различие между именем и титулом.
- issue: Кто ввёл Израиль в грех
  choice: отец царя
  alternative: сам описываемый царь
  rationale: Суффикс в «его грехе» и контекст устойчивой формулы указывают на грех отца; слово «тот» делает эту связь понятной по-русски, не добавляя имени.
translation_notes:
  register: Современный литературный русский язык; сохранены достоинство повествования, метафора пути и формульный характер царской оценки. Синтаксис слегка сглажен ради естественности русского текста.
