  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: ru
  text: Высоты же не были устранены, однако сердце Асы было всецело предано Яхве всю его жизнь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце Асы было цельным с Яхве во все его дни»; возможно также: «сердце Асы было неразделённым в отношении к Яхве всю его жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: Но высоты
  rationale: בָּמוֹת обозначает местные культовые места, часто расположенные на возвышенностях. «Высоты» — краткий и традиционно понятный библейский термин; союз передан как «но» ввиду контраста с положительной оценкой Асы.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: При культовых высотах в роли подлежащего סוּר означает, что их не устранили и не отменили как места поклонения. «Упразднены» яснее передаёт реформаторский контекст, чем буквальное «не отошли».
- source_word: רַק
  choice: И всё же
  rationale: 'Здесь רַק вводит уступительное противопоставление: несмотря на сохранение высот, основная верность Асы получает положительную оценку.'
- source_word: לְבַב אָסָא
  choice: сердце Асы
  rationale: לְבַב означает внутреннего человека, включая волю и направленность; конструкция естественно передаётся родительным падежом.
- source_word: שָׁלֵם
  choice: всецело предано
  rationale: В сочетании с «сердцем» и отношением к Яхве слово выражает цельность, неразделённую верность, а не безгрешное совершенство.
- source_word: עִם יְהוָה
  choice: предано Яхве
  rationale: Предлог עִם буквально означает «с», однако выбранная русская конструкция «предано Яхве» естественно выражает направленность верности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом.
- source_word: כָּל יָמָיו
  choice: во все дни его жизни
  rationale: Так естественно и без потери полноты передаётся еврейское выражение «все его дни».
theological_decisions:
- issue: Цельность сердца Асы при неупразднённых высотах
  choice: Стих утверждает всецелую, основополагающую верность Асы Яхве, не объявляя его безгрешным и не утверждая безупречность всех его преобразований.
  alternative: Понять שָׁלֵם как абсолютную нравственную безупречность либо ослабить похвалу до неопределённого общего одобрения.
  rationale: Само сопоставление сохранившихся высот с цельным сердцем сохраняет напряжение между неполнотой реформ и неразделённой верностью Асы.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Термин «высоты» сохранён как сложившееся обозначение культовых мест; выражение «всецело предано» раскрывает идиому без устранения богословского напряжения.
