  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: ru
  text: 'Тогда Аса взял всё оставшееся серебро и золото из сокровищниц дома Яхве и из сокровищниц царского дома[a] и передал их своим слугам. Затем царь Аса послал эти ценности к Бен-Хададу, сыну Тавриммона, сыну Хезьона, царю Арама[b], жившему в Дамаске, с такими словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царского дворца».'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. «Арам»; традиционно: «Сирия».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Тогда Аса взял
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт очередность событий.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: всё серебро и золото, оставшееся
  rationale: Сохраняет значение совокупности и остатка; единственное число причастия естественно согласуется в русском с ближайшим словом «золото» при составной группе.
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: в сокровищницах дома Яхве
  rationale: «Сокровищницы» соответствует месту хранения драгоценных металлов, а «дом Яхве» сохраняет храмовое обозначение и личное имя יְהוָה.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: и в сокровищницах царского дома
  rationale: Буквально передаёт «дом царя», оставаясь естественным по-русски; возможное контекстуальное значение «дворец» отмечено в сноске.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: и передал всё это своим слугам
  rationale: Еврейская идиома «дал в руку» означает передачу под контроль; функциональный русский эквивалент избегает неестественной кальки и ясно обозначает предмет.
- source_word: וַיִּשְׁלָחֵם
  choice: Затем царь Аса послал их
  rationale: Местоимение сохраняет возможность понимать суффикс как отсылку к слугам, несущим ценности; последовательность выражена словом «затем».
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Бен-Хададу, сыну Тавриммона, сына Хезьона
  rationale: Сохраняет генеалогическую цепочку и транслитерирует имена в привычной русской форме.
- source_word: מֶלֶךְ אֲרָם
  choice: царю Арама
  rationale: Сохраняет древнееврейское историко-географическое название, не заменяя его позднейшим традиционным «Сирия».
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: жившему в Дамаске
  rationale: Естественно передаёт причастие со значением пребывания или проживания.
- source_word: לֵאמֹר
  choice: 'с такими словами:'
  rationale: Идиоматично вводит прямую речь, следующую в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Передача אֲרָם
  choice: Арам
  alternative: Сирия
  rationale: «Арам» непосредственно отражает древнееврейское историко-географическое обозначение; традиционная «Сирия» является более поздним эквивалентом.
- issue: Референт объектного суффикса в וַיִּשְׁלָחֵם
  choice: «их» — вероятнее всего слуг, посланных с ценностями
  alternative: «их» — серебро и золото
  rationale: Грамматическое мужское множественное число непосредственно подходит к «слугам»; по контексту они несут ранее переданные им ценности. Русское «их» сохраняет местоименную форму и не устраняет референциальную напряжённость полностью.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Синтаксис упрощён там, где буквальная еврейская идиома звучала бы неестественно, но имена, исторические обозначения и последовательность действий сохранены.
