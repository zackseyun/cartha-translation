  source_fidelity: 'Смысл в целом передан точно: Аса берёт оставшиеся серебро и золото из храмовых и царских сокровищниц, вручает их слугам и направляет к Бен-Хададу. Однако в русском тексте местоимение «их» после «своим слугам» практически однозначно отсылает к слугам, тогда как объектный суффикс וַיִּשְׁלָחֵם грамматически и контекстуально допускает отсылку к серебру и золоту; английский аудит выбрал именно ценности. Безопаснее устранить неясность, прямо указав, что посылаются ценности, но сохранив, что они переданы через слуг.'
