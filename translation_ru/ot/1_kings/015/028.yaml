lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: предал его смерти
  rationale: Каузативная форма глагола מות означает «причинил ему смерть». Выражение «предал его смерти» естественно по-русски передаёт каузативный оттенок и торжественную строгость повествования.
- source_word: בַעְשָׁא
  choice: Вааса
  rationale: Традиционная русская передача личного имени.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: в третий год правления
  rationale: Стандартная формула датировки по годам царствования; слово «правления» добавлено для естественности и ясности по-русски.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Предлог ל в формуле годов царствования указывает на правителя, относительно которого ведётся отсчёт; титул передан прямо и естественно.
- source_word: וַיִּמְלֹךְ
  choice: и воцарился
  rationale: Глагол מלך в данном контексте обозначает вступление на престол; «воцарился» кратко и естественно выражает начало царствования.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: תחת с местоименным суффиксом обозначает замещение и престолонаследие.
