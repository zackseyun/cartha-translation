source:
  edition: WLC
  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: ru
  text: Надав, сын Иеровоама, стал царём над Израилем во второй год правления Асы, царя Иудеи, и царствовал над Израилем два года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: Надав
  rationale: Союз וְ продолжает повествовательную последовательность; в русском отдельный начальный союз не требуется. Имя передано в принятой библейской форме.
- source_word: בֶּן יָרָבְעָם
  choice: сын Иеровоама
  rationale: Естественно передаёт стандартную конструкцию родства и сохраняет генеалогическое уточнение.
- source_word: מָלַךְ
  choice: стал царём
  rationale: Первое употребление глагола обозначает вступление на престол, в отличие от последующего указания продолжительности царствования.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Сохраняет образ управления и соответствует устойчивому русскому выражению «царствовать над».
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: во второй год
  rationale: Еврейская формула датировки использует количественное числительное, но по-русски естественно порядковое «второй».
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: правления Асы, царя Иудеи
  rationale: Предлог לְ задаёт точку отсчёта по годам царствования Асы; добавление «правления» делает русскую датировочную формулу ясной, не добавляя нового события.
- source_word: וַ/יִּמְלֹךְ
  choice: и царствовал
  rationale: При последующем указании срока глагол обозначает продолжительность правления.
- source_word: שְׁנָתָיִם
  choice: два года
  rationale: Прямо передаёт двойственное число и длительность царствования.
theological_decisions: []
