    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил с отцами своими
  rationale: Передаёт традиционную еврейскую формулу смерти, сохраняя её образность и династический оттенок, но не создавая нежелательной двусмысленности буквального «лёг/спал с отцами» в современном русском языке.
- source_word: אֲבִיָּם
  choice: Авиям
  rationale: Сохраняет форму личного имени, представленную в еврейском тексте данного стиха, в отличие от варианта «Авия», встречающегося в связанных местах.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: и похоронили его
  rationale: Сохраняет активную форму глагола во множественном числе с неопределённым субъектом, не добавляя отсутствующего в тексте указания на тех, кто совершил погребение.
- source_word: בְּעִיר דָּוִד
  choice: в городе Давида
  rationale: Устоявшаяся и ясная русская передача библейского географического наименования.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол обозначает вступление на царство, а не просто последующее царствование.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Точно выражает замещение предшественника на престоле и естественно звучит в русском сообщении о преемстве.
