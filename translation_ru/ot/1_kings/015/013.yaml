  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: ru
  text: Аса также лишил свою мать Мааху[a] положения царицы-матери, потому что она сделала отвратительный культовый предмет для Ашеры[b][c]. Аса срубил этот предмет и сжёг его в долине Кедрона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою мать». В царской родословной так могла называться также бабушка или другая старшая родственница по прямой линии.'
    reason: lexical_alternative
  - marker: b
    text: 'Точная форма этого культового предмета неизвестна; возможны также переводы: «отвратительное изображение» или «ужасный предмет».'
    reason: lexical_alternative
  - marker: c
    text: «Ашера» может означать богиню Ашеру или связанный с ней культовый символ, который нередко называют столбом Ашеры.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Также и
  rationale: Передаёт добавочное значение и связывает это действие Асы с перечисленными ранее преобразованиями.
- source_word: מַעֲכָה אִמּוֹ
  choice: Мааху, свою мать
  rationale: Сохраняет буквальное обозначение родства в еврейском тексте; форма «Мааху» соответствует русскому склонению имени.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: лишил положения царицы-матери
  rationale: Глагол в каузативной форме означает отстранение, а גְּבִירָה здесь обозначает влиятельное официальное положение старшей женщины царского дома.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: потому что она сделала
  rationale: В данном контексте относительная конструкция выражает основание для отстранения Маахи.
- source_word: מִפְלֶצֶת
  choice: отвратительного идола
  rationale: Передаёт резко отрицательную оценку культового предмета, не уточняя его спорную форму; «идол» естественнее для русского читателя, чем буквальное «ужасная вещь».
- source_word: לָאֲשֵׁרָה
  choice: для Ашеры
  rationale: Транслитерация сохраняет возможность понимать слово как имя богини либо как обозначение связанного с ней культового символа.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: срубил её идола
  rationale: «Срубил» сохраняет конкретное значение כרת и предполагаемую возможность того, что предмет был деревянным, не превращая это предположение в прямое утверждение.
- source_word: וַיִּשְׂרֹף
  choice: сжёг его
  rationale: Прямо и естественно передаёт действие сожжения; местоимение согласовано с русским словом «идол».
- source_word: בְּנַחַל קִדְרוֹן
  choice: в долине Кедрон
  rationale: נחל может обозначать вади, овраг или русло потока; «долина Кедрон» — ясное современное географическое наименование.
theological_decisions:
- issue: Значение אֲשֵׁרָה
  choice: Ашера
  alternative: богиня Ашера; столб Ашеры; культовый символ Ашеры
  rationale: Еврейское слово допускает отнесение как к богине, так и к её культовому символу. Транслитерация не устраняет эту подлинную неоднозначность.
- issue: Степень конкретности מִפְלֶצֶת
  choice: отвратительный идол
  alternative: отвратительное изображение; ужасный предмет; непристойный идол
  rationale: Точная природа предмета неизвестна. Выбранное выражение передаёт его культовый характер и отрицательную оценку, не приписывая ему конкретную форму.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; сохранены буквальное обозначение родства и неоднозначность слова «Ашера». Все примечания отмечены в основном тексте.
