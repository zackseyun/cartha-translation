  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: ru
  text: 'Отец никогда за всю его жизнь[a] не огорчал его, говоря[b]: «Почему ты так поступил?» К тому же он был очень красив, и мать родила его после Авессалома.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «от его дней»; здесь это означает «никогда за всю его жизнь».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не причинял ему боли», «не досаждал ему» либо, по смыслу данного контекста, «не укорял его». Еврейский глагол может означать причинение боли, огорчения или досады; последующий вопрос показывает, что Давид не одёргивал Адонию и не требовал у него отчёта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: не огорчил его
  rationale: Глагол עצב в данной форме означает причинить боль, огорчение или досаду. В контексте речь идёт о том, что Давид не одёргивал и не поправлял Адонию; перевод сохраняет значение причинённого неудовольствия, не сводя его исключительно к формальному упрёку.
- source_word: מִיָּמָיו
  choice: ни разу в жизни
  rationale: Буквально «от его дней»; здесь это идиома со значением «никогда за всю его жизнь».
- source_word: לֵאמֹר
  choice: вопросом
  rationale: Инфинитив вводит содержание того, что отец не говорил сыну. В русском предложении «вопросом» естественно связывает глагол с последующей прямой речью.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Почему ты так поступил?
  rationale: Передаёт прямой родительский вопрос и сохраняет наречное значение ככה «так»; «поступил» по-русски естественнее, чем буквальное «сделал», когда речь идёт о поведении.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: очень красив
  rationale: Устойчивое сочетание описывает привлекательную внешность мужчины; этот перевод естественен в современном русском языке.
- source_word: וְאֹתוֹ יָלְדָה
  choice: мать родила его
  rationale: В еврейском тексте подлежащее выражено формой женского рода, но прямо не названо. Слово «мать» ясно передаёт подразумеваемое лицо и сохраняет активную конструкцию оригинала.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: после Авессалома
  rationale: 'Выражение наиболее естественно указывает на порядок рождения: Адония был рождён после Авессалома, вероятно следующим за ним среди сыновей Давида.'
