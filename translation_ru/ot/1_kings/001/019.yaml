base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: ru
  text: Он принёс в жертву множество быков, откормленного скота и овец[a] и пригласил[b] всех сыновей царя, священника Авиафара и Иоава, военачальника, а Соломона, слугу твоего, не пригласил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать мелкий скот вообще, включая также коз.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «позвал»; по контексту речь идёт о приглашении на жертвенный пир.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: принёс в жертву
  rationale: Глагол זבח в данном повествовании обозначает жертвенное заклание; выбран естественный современный оборот, ясно передающий культовый характер действия.
- source_word: שׁוֹר
  choice: быков
  rationale: Слово обозначает крупный рогатый скот; «быков» естественно звучит в перечне жертвенных животных, хотя исходное слово не всегда строго уточняет пол.
- source_word: מְרִיא
  choice: откормленного скота
  rationale: Существительное обозначает специально откормленный скот; собирательная форма по-русски естественно согласуется с перечнем животных.
- source_word: צֹאן
  choice: овец
  rationale: Обычный русский эквивалент в таком перечне; более широкое значение, включающее мелкий скот и, возможно, коз, отмечено в сноске.
- source_word: לָרֹב
  choice: множество
  rationale: Передаёт большую численность принесённых в жертву животных и естественно относится ко всему перечню.
- source_word: וַיִּקְרָא ... לֹא קָרָא
  choice: пригласил ... не пригласил
  rationale: В контексте жертвенного пира קרא означает приглашение присутствовать; повтор одного русского глагола сохраняет словесную связь обеих частей стиха.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: всех сыновей царя
  rationale: Прямо и естественно передаёт конструкцию, сохраняя указание именно на сыновей.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: священника Авиафара
  rationale: Имя передано в принятой русской библейской форме, а титул переведён; русский порядок слов естественен для перечисления.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: Иоава, военачальника
  rationale: שַׂר הַצָּבָא обозначает руководителя войска; «военачальник» кратко и ясно передаёт должность.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ לֹא קָרָא
  choice: а Соломона, слугу твоего, не пригласил
  rationale: Союз «а» выражает контраст, подразумеваемый порядком и отрицанием в еврейском тексте; «слугу твоего» сохраняет почтительное обозначение Соломона по отношению к Давиду.
