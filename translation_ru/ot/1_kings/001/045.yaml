revisions:
- from: Священник Садок и пророк Нафан помазали его в цари у Гихона, а потом с ликованием поднялись оттуда, и весь город пришёл в волнение[a]. Вот что за шум вы слышали.
  to: Священник Садок и пророк Нафан помазали его царём у Гихона, и они поднялись оттуда с ликованием, а город пришёл в волнение[a]. Это тот шум, который вы слышали.
