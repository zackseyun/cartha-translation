  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: ru
  text: Священник Садок и пророк Нафан помазали его царём у Гихона, и они поднялись оттуда с ликованием, а город пришёл в волнение[a]. Это тот шум, который вы слышали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город огласился шумом» или «город был встревожен»; еврейский глагол передаёт шумное возбуждение и всеобщее волнение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: помазали его
  rationale: В контексте поставления царя משׁח обозначает обрядовое помазание на царское служение; русский совершенный вид естественно передаёт завершённое действие, объясняющее нынешний шум.
- source_word: צָדוֹק הַכֹּהֵן
  choice: священник Садок
  rationale: Имя передано в принятой русской библейской форме; постановка титула перед именем естественна для современного русского языка.
- source_word: וְנָתָן הַנָּבִיא
  choice: пророк Нафан
  rationale: Имя передано в принятой русской библейской форме, а נָבִיא — общеупотребительным словом «пророк».
- source_word: לְמֶלֶךְ
  choice: в цари
  rationale: Устойчивое русское выражение «помазать в цари» ясно обозначает должность, на которую он был поставлен.
- source_word: בְּגִחוֹן
  choice: у Гихона
  rationale: Предлог בְ обозначает место действия; «у Гихона» естественно указывает на источник или место с этим названием.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: а потом ... поднялись оттуда
  rationale: עלה означает движение вверх; «поднялись» сохраняет пространственный образ, а «потом» естественно выражает последовательность повествования.
- source_word: שְׂמֵחִים
  choice: с ликованием
  rationale: Форма описывает радостное состояние и манеру движения; «с ликованием» передаёт открыто выраженную общую радость.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: весь город пришёл в волнение
  rationale: Глагол הום передаёт шумное возбуждение, смятение или гул; выбранная формулировка сохраняет представление о всеобщем волнении, а шумовой оттенок раскрывается в следующем предложении и сноске.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Вот что за шум вы слышали
  rationale: הוּא здесь имеет указательно-пояснительную функцию, а קוֹל в контексте означает слышимый шум; русская формулировка естественно связывает объяснение с заданным ранее вопросом о звуках.
