base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: ru
  text: 'И царь сказал им: «Возьмите с собой слуг вашего господина, посадите[a] моего сына Соломона на мула, который принадлежит мне, и отведите его вниз, к Гихону».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделайте так, чтобы мой сын Соломон поехал верхом». Еврейский глагол имеет каузативную форму: им следует обеспечить, чтобы Соломон ехал на муле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנֵיכֶם
  choice: слуг вашего господина
  rationale: Сочетание обозначает царских слуг или придворных, находящихся под властью говорящего царя. Формулировка сохраняет его возвышенное упоминание о себе в третьем лице и не уточняет без достаточных оснований социальный статус словом «рабов».
- source_word: וְהִרְכַּבְתֶּם
  choice: посадите
  rationale: 'Порода хифиль передаёт каузативное действие: присутствующие должны устроить так, чтобы Соломон ехал верхом. В данном контексте русское «посадите … на мула» выражает это естественно и ясно.'
- source_word: הַפִּרְדָּה
  choice: мула
  rationale: Еврейское существительное имеет женскую форму и может обозначать самку мула, однако в русском языке пол животного здесь несущественен, поэтому употреблено обычное видовое название.
- source_word: אֲשֶׁר לִי
  choice: который принадлежит мне
  rationale: Относительное предложение прямо подчёркивает принадлежность мула царю и тем самым знак царского полномочия; оно сохранено, а не свёрнуто до одного притяжательного местоимения.
- source_word: וְהוֹרַדְתֶּם
  choice: отведите его вниз
  rationale: Каузатив от ירד означает побудить или помочь спуститься. Слово «вниз» сохраняет топографический смысл движения к расположенному ниже Гихону.
- source_word: גִּחוֹן
  choice: Гихону
  rationale: Название места передано принятой русской транслитерацией и поставлено в дательный падеж после предлога «к».
- source_word: בְנִי
  choice: моего сына
  rationale: Сохранено явное указание на сыновство Соломона, существенное для повествования о престолонаследии.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: И царь сказал
  rationale: Начальное «и» передаёт последовательное движение еврейского повествования без утяжеления русского синтаксиса.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Сохранены придворное обращение «вашего господина», акцент относительного оборота на принадлежности царского мула и направление движения вниз. Маркер сноски помещён непосредственно при глаголе, которого касается пояснение.
