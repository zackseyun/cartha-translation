  source_fidelity: Текст точно передаёт еврейскую конструкцию с выделенным первым объектом («а меня») и перечислением тех, кого Адония не позвал. Повторное «твоего слугу» сохранено для Нафана и Соломона; титул Садока и патроним Ванеи переданы без смысловых потерь. «Не позвал» является точным и достаточно широким соответствием לֹא קָרָא, не сводя значение преждевременно к одному лишь приглашению на пир.
