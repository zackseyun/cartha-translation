base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: ru
  text: А меня — твоего слугу, священника Садока, Ванею, сына Иодая, и Соломона, твоего слугу, — он не позвал[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «не призвал»; в контексте жертвенного пира также возможно: «не пригласил». Еврейский глагол может означать «звать», «призывать» или «приглашать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: А меня — твоего слугу
  rationale: Начальное וְ с לִי в данном контексте противопоставляет перечисленных ранее приглашённым, а отдельное אֲנִי придаёт местоимению особое ударение. Конструкция с тире естественно передаёт это выделение и сохраняет почтительное придворное самообозначение.
- source_word: צָדֹק הַכֹּהֵן
  choice: священника Садока
  rationale: Определённый титул הַכֹּהֵן передан существительным «священник»; порядок слов выбран по нормам современного русского языка.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Ванею, сына Иодая
  rationale: Использованы традиционные русские формы библейских имён; патронимическая конструкция בן передана прямо и естественно.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: Соломона, твоего слугу
  rationale: Повторное עַבְדְּךָ сохранено как придворное обозначение отношения Соломона к царю, без устранения повтора.
- source_word: לֹא קָרָא
  choice: он не позвал
  rationale: קרא может означать «звать», «призывать» или, в контексте трапезы, «приглашать». «Не позвал» сохраняет широту глагола и естественно звучит в непосредственном контексте приглашения на жертвенный пир.
