reference: 1 Kings 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: ru
  text: Адония принёс в жертву овец[a], крупный рогатый скот и откормленных животных у камня Зохелет[b], что возле Эн-Рогела, и пригласил[c] всех своих братьев — сыновей царя — и всех мужчин Иудеи[d] — слуг царя[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мелкий скот» — еврейское слово может обозначать овец и коз вместе.'
    reason: lexical_alternative
  - marker: b
    text: Зохелет — название места; его точное значение неизвестно.
    reason: cultural_note
  - marker: c
    text: 'Или: «созвал».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «всех людей Иудеи»; буквально: «всех мужчин Иудеи».'
    reason: lexical_alternative
  - marker: e
    text: Под «слугами царя» могут подразумеваться также царские придворные или должностные лица.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: принёс в жертву
  rationale: Глагол זבח обозначает жертвенное заклание, здесь связанное с пиром; перевод сохраняет культовый и политический смысл действия.
- source_word: צֹאן
  choice: овец
  rationale: Собирательное слово может охватывать мелкий скот, включая овец и коз; в данном перечислении «овец» — естественная конкретизация, а примечание сохраняет более широкую возможность.
- source_word: וּבָקָר
  choice: крупный рогатый скот
  rationale: בקר — собирательное обозначение крупного домашнего скота; этот перевод точнее широкого значения, чем «быков» или «волов».
- source_word: וּמְרִיא
  choice: откормленных животных
  rationale: Слово обозначает откормленный скот, приготовленный для особого пиршества, без обязательного указания на телят или только на крупный рогатый скот.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: у камня Зохелет
  rationale: Предлог употреблён локативно; название передано транслитерацией, поскольку точное значение топонима неясно.
- source_word: עֵין רֹגֵל
  choice: Эн-Рогела
  rationale: Географическое название передано транслитерацией и оформлено по нормам русского склонения.
- source_word: וַיִּקְרָא
  choice: пригласил
  rationale: В контексте жертвенного пира глагол означает призыв прийти и естественно передаётся как приглашение.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: всех своих братьев, царских сыновей
  rationale: 'Сохранена аппозиция: вторая группа слов уточняет, что братья Адонии были сыновьями царя.'
- source_word: אַנְשֵׁי יְהוּדָה
  choice: всех мужчин Иудеи
  rationale: Буквально сохранено мужское обозначение אַנְשֵׁי; более широкое контекстуальное понимание вынесено в примечание.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: слуг царя
  rationale: Прямой перевод עבד сохраняет возможность понимать этих людей и как придворных служителей, и как царских должностных лиц.
theological_decisions:
- issue: Гендерно маркированное выражение אַנְשֵׁי יְהוּדָה
  choice: мужчин Иудеи
  alternative: людей Иудеи
  rationale: Еврейский текст прямо употребляет существительное мужского рода «мужчины»; перевод не нейтрализует эту форму, но отмечает возможное более широкое общественное значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность и уточняющие конструкции еврейского текста, оставаясь понятным обычному читателю; топонимы переданы традиционно звучащей транслитерацией.
