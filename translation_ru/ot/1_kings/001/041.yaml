base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: ru
  text: 'Адония и все приглашённые, которые были с ним, услышали этот шум, когда заканчивали есть[a]. Услышав звук рога[b], Иоав сказал: «Отчего в городе такой шум?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как только они закончили есть». Еврейский оборот может указывать либо на завершение трапезы, либо на момент, когда они как раз заканчивали есть.'
    reason: lexical_alternative
  - marker: b
    text: Евр. шофар — духовой сигнальный инструмент, изготовлявшийся из рога животного.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышали этот шум
  rationale: Глагол означает «услышать»; объект, отсутствующий в еврейском тексте, естественно восполнен из ближайшего контекста как шум происходящего в городе.
- source_word: הַקְּרֻאִים
  choice: приглашённые
  rationale: Страдательное причастие от קרא в контексте пира обозначает приглашённых гостей; краткая субстантивированная форма естественна по-русски.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: когда заканчивали есть
  rationale: Оборот указывает на время восприятия шума и допускает понимание как завершения трапезы, так и момента её окончания; основная формулировка сохраняет эту временную близость.
- source_word: קוֹל הַשּׁוֹפָר
  choice: звук рога
  rationale: שׁוֹפָר — сигнальный духовой инструмент из рога; «рог» понятно современному читателю и сохраняет культурную конкретность.
- source_word: קִרְיָה ... הוֹמָה
  choice: в городе такой шум
  rationale: Идиоматичная русская передача буквально необычного сочетания «голос города шумит/гудит»; передаёт слышимое городское волнение, не уточняя его причины.
- source_word: אֲדֹנִיָּהוּ
  choice: Адония
  rationale: Традиционная русская библейская форма личного имени.
- source_word: יוֹאָב
  choice: Иоав
  rationale: Традиционная русская библейская форма личного имени.
