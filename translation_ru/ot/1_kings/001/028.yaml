  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: ru
  text: 'Тогда царь Давид сказал[a]: «Позовите ко мне Вирсавию». Она пришла к царю и встала перед царём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ответил и сказал». Эта еврейская повествовательная формула может вводить речь и тогда, когда перед ней нет прямого вопроса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: сказал
  rationale: Сочетание глаголов буквально означает «ответил и сказал», но в еврейском повествовании это обычная формула введения речи, не обязательно предполагающая непосредственно предшествующий вопрос. В современном русском естественно передать её одним глаголом, а буквальную форму отметить в сноске.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Естественная русская передача титула и личного имени; соответствует приложению в еврейском тексте.
- source_word: קִרְאוּ לִי
  choice: Позовите ко мне
  rationale: Глагол קרא с ל выражает призыв или приглашение явиться к говорящему. «Позовите ко мне» передаёт прямой царский приказ без излишне официального оттенка слова «призовите».
- source_word: לְבַת שָׁבַע
  choice: Вирсавию
  rationale: Использована традиционная и общеупотребительная русская форма библейского имени; винительный падеж обусловлен синтаксисом перевода.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: Она вошла к царю
  rationale: Оборот בוא לפני означает войти или явиться в чьё-либо присутствие. «Вошла к царю» естественно по-русски передаёт придворную ситуацию.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: и встала перед царём
  rationale: Передано прямое значение עמד «стоять, встать». Повтор слова «царь» сохраняет намеренный повтор еврейского текста и подчёркивает официальное присутствие перед монархом.
