base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: ru
  text: 'И слуги царя также пришли благословить нашего господина, царя Давида, говоря: «Пусть твой Бог сделает имя Соломона славнее твоего[a] и возвысит его престол над твоим престолом». И царь поклонился на постели[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «имя» означает также славу, известность и доброе имя человека.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царь совершил поклонение на постели». Еврейский глагол может обозначать как земной поклон, так и поклонение; объект действия здесь прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: И ... также
  rationale: Передаёт присоединительное значение союза и наречия, связывая сообщение с предшествующим контекстом.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: слуги царя
  rationale: В придворном контексте выражение обозначает царских служителей или должностных лиц; «слуги» сохраняет широту исходного слова.
- source_word: לְבָרֵךְ
  choice: благословить
  rationale: Речь идёт о торжественно высказанном благопожелании; перевод сохраняет как лексический, так и религиозный оттенок глагола.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: нашего господина, царя Давида
  rationale: Сохраняется придворное почтительное обращение, а приложение оформляется естественно для современного русского языка.
- source_word: יֵיטֵב ... אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: сделает имя Соломона славнее твоего
  rationale: Каузативная форма יטב и сравнительное מן переданы сравнительной конструкцией; «имя» сохранено как образ, подразумевающий славу и известность.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: и его престол — величественнее твоего престола
  rationale: Сохраняются сравнительный смысл и династический образ престола; подразумеваемый глагол «сделает» естественно распространяется на вторую часть пожелания.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Русский глагол передаёт телесный жест почтения и при этом не исключает значения поклонения Богу, сохраняя неоднозначность еврейского слова.
- source_word: עַל הַמִּשְׁכָּב
  choice: на постели
  rationale: Прямой и понятный перевод без добавления отсутствующего в еврейском тексте притяжательного местоимения.
theological_decisions:
- issue: Означает ли וַיִּשְׁתַּחוּ поклон как телесный жест или поклонение Богу
  choice: царь поклонился
  alternative: царь поклонился Богу / совершил поклонение
  rationale: В самом предложении объект действия не назван. Перевод «поклонился» сохраняет телесный жест и возможный богослужебный смысл, не делая подразумеваемый объект явным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным придворным звучанием. Синтаксис благопожелания сохранён, но сделан естественным для обычного читателя; подлинная неоднозначность заключительного глагола отмечена в сноске.
