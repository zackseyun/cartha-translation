  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: ru
  text: Искали по всей земле Израиля красивую девушку и нашли Ависагу Сунамитянку[a], и привели её к царю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть женщину из города Сунама.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: искали
  rationale: Глагол בקשׁ обозначает целенаправленные поиски; «искали» естественно передаёт повествовательный контекст без излишней книжности.
- source_word: נַעֲרָה יָפָה
  choice: красивую девушку
  rationale: נַעֲרָה — молодая женщина, обычно брачного возраста; современное русское «девушка» здесь естественнее архаичного «девица». יָפָה прямо указывает на красоту.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: по всей земле Израиля
  rationale: גְּבוּל здесь означает всю территорию страны, а не только её границы; эта формулировка ясна и естественна по-русски.
- source_word: וַיִּמְצְאוּ
  choice: нашли
  rationale: Прямой и нейтральный эквивалент простого повествовательного глагола.
- source_word: אֶת אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Ависагу Сунамитянку
  rationale: Имя передано в принятой русской библейской форме; обозначение происхождения сохранено как именование женщины из Сунама.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: привели её к царю
  rationale: Каузативная форма בוא означает «привести/доставить»; применительно к человеку «привели» звучит естественно и точно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простым, dignified повествовательным синтаксисом. Союз в начале стиха опущен как избыточный при отдельном цитировании, однако последовательность действий сохранена. Этноним «Сунамитянка» оставлен в традиционной библейской форме и пояснён в сноске.
