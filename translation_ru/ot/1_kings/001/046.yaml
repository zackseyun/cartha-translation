lexical_decisions:
- source_word: וְגַם
  choice: И … уже
  rationale: וְגַם добавляет ещё одно подтверждение к предыдущему сообщению; по-русски естественная связка «И … уже» передаёт как присоединение, так и совершившийся факт.
- source_word: יָשַׁב
  choice: воссел
  rationale: Перфект обозначает совершившееся вступление на престол; «воссел» — естественное и достойное выражение для царской интронизации.
- source_word: כִּסֵּא הַמְּלוּכָה
  choice: царский престол
  rationale: Буквально «престол царства/царской власти»; устойчивое русское сочетание «царский престол» ясно передаёт смысл без тяжеловесности.
