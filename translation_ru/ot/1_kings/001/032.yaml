    issue: «И они предстали перед царём» усиливает значение глагола.
    rationale: Еврейское וַיָּבֹאוּ обозначает, прежде всего, приход/прибытие. Контекст «перед царём» уже выражает явление в его присутствие, поэтому «предстали» не требуется и вносит более формальный оттенок.
