base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: ru
  text: 'Тогда царь Давид сказал: «Позовите ко мне священника Садока, пророка Нафана и Ванею, сына Иодая». И они пришли к царю.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Естественная русская передача имени с царским титулом.
- source_word: קִרְאוּ לִי
  choice: Позовите ко мне
  rationale: Повелительная форма множественного числа קרא с לִי означает приказ позвать названных людей к говорящему; эта формулировка точна и естественна по-русски.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: священника Садока
  rationale: Должность перед именем звучит естественно по-русски и сохраняет определённое обозначение роли Садока.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: пророка Нафана
  rationale: Стандартная передача имени и титула; русский порядок слов естественно ставит обозначение служения перед именем.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: и Ванею, сына Иодая
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; בֶּן передано прямо как «сын».
- source_word: וַיָּבֹאוּ
  choice: И они предстали
  rationale: Глагол движения с последовательным וַ продолжает рассказ; «предстали» в сочетании с последующим לִפְנֵי естественно выражает прибытие в царское присутствие.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: לִפְנֵי обозначает нахождение в присутствии лица; «перед царём» точно и литературно передаёт выражение.
