translation:
  language: ru
  text: 'Вирсавия склонилась и пала ниц перед царём, и царь спросил: «Чего ты желаешь?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что тебе?» Это выражение может означать: «Чего ты желаешь?» или «Что тебя тревожит?»'
