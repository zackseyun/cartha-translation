lexical_decisions:
- source_word: וַתִּקֹּד
  choice: склонилась
  rationale: Глагол קָדַד обозначает низкий поклон или склонение тела; «склонилась» естественно передаёт жест, не уточняя, что она встала на колени.
- source_word: בַּת שֶׁבַע
  choice: Вирсавия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וַתִּשְׁתַּחוּ
  choice: простёрлась
  rationale: Форма глагола שׁחה обозначает глубокое земное поклонение или простирание ниц; этот выбор сохраняет отличие от предшествующего וַתִּקֹּד и последовательность двух жестов.
- source_word: לַמֶּלֶךְ
  choice: перед царём
  rationale: В контексте придворного поклона ל естественно передаётся как направленность почтительного жеста к царю; по-русски идиоматично «перед царём».
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: и царь спросил её
  rationale: Буквально стоит «и сказал царь», однако последующая вопросительная реплика позволяет естественно передать глагол речи как «спросил»; местоимение «её» проясняет адресата без изменения смысла.
- source_word: מַה לָּךְ
  choice: Чего ты желаешь?
  rationale: Буквально идиома означает «что тебе?», а в данном контексте служит учтивым вопросом о просьбе или нужде Вирсавии. «Чего ты желаешь?» соответствует царскому контексту и сохраняет возможность понимать вопрос как приглашение высказать просьбу.
