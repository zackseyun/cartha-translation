translation_notes:
  register: Современный литературный русский язык с достоинством придворной сцены. Два последовательных жеста переданы разными глаголами, чтобы сохранить выраженное в еврейском тексте усиление. Архаичное «поклонилась лицом» и чрезмерно разговорное «Чего ты хочешь?» не использованы.
