  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: ru
  text: Царь послал с ним священника Цадока, пророка Натана, Бенаю, сына Иехояды, а также керетеев и пелетеев; и они посадили его на царского мула[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, точнее: «на царскую мулицу». Еврейское слово может обозначать самку мула.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: Царь послал с ним
  rationale: Сохранены повествовательное прошедшее время глагола שׁלח, значение сопровождения у אִתּוֹ и подлежащее «царь» без подстановки имени Давида.
- source_word: צָדוֹק הַכֹּהֵן
  choice: священника Цадока
  rationale: Аппозиционная конструкция естественно передана по-русски с названием служения перед именем; имя транслитерировано с еврейского.
- source_word: נָתָן הַנָּבִיא
  choice: пророка Натана
  rationale: Название служения переведено прямо, а имя передано в форме, близкой к еврейскому произношению.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Бенаю, сына Иехояды
  rationale: Отчество выражено обычным русским оборотом «сына…»; имена переданы транслитерацией с еврейского.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: керетеев и пелетеев
  rationale: Обозначения групп сохранены как собственные этнонимы без предположительной интерпретации их функций.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: они посадили его
  rationale: Каузативная форма רכב означает, что сопровождающие устроили его верхом; «посадили» звучит естественно по-русски и сохраняет каузативность.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: на царского мула
  rationale: Основной текст использует обычное современное слово «мул»; грамматически и лексически выраженная возможность значения «самка мула» отмечена в сноске.
