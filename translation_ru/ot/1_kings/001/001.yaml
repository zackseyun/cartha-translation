  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: ru
  text: Царь Давид был стар, достиг преклонных лет[a]. Его укрывали одеждами, но он не мог согреться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
