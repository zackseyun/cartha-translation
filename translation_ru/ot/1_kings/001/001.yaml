lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Царь Давид
  rationale: Царский титул и имя переданы прямо; начальный союз וְ не требует отдельного русского слова при открытии повествовательной сцены.
- source_word: זָקֵן
  choice: состарился
  rationale: Форма указывает на состояние старости; русский глагол естественно передаёт, что Давид уже достиг старческого возраста.
- source_word: בָּא בַּ/יָּמִים
  choice: достиг преклонных лет
  rationale: Еврейская идиома буквально говорит о том, что человек «вошёл в дни», то есть достиг глубокой старости. Выбран современный и понятный русский эквивалент.
- source_word: וַ/יְכַסֻּ/הוּ
  choice: Его укрывали
  rationale: Неопределённое множественное число деятелей сохранено русской формой третьего лица множественного числа; несовершенный вид естественно выражает предпринимаемую попытку согреть царя.
- source_word: בַּ/בְּגָדִים
  choice: одеждами
  rationale: בְּגָדִים обозначает одежды или предметы одежды; перевод не заменяет их более конкретными «одеялами», чего исходный текст прямо не говорит.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: но он не мог согреться
  rationale: Фраза означает, что тепло к нему не приходило. Русская формулировка передаёт безуспешность укрывания и естественно выражает контраст.
