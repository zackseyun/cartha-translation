lexical_decisions:
- source_word: וְהָיָה
  choice: И когда… сочтут
  rationale: Оборот вводит ожидаемое следствие; в русском естественно передать его цельной будущей конструкцией без буквального «и будет».
- source_word: כִּשְׁכַב
  choice: когда… ляжет
  rationale: Глагол сохраняет образ лежания, а сочетание с предками ясно указывает на смерть.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Передаёт почтительное придворное обращение Вирсавии к Давиду и сохраняет порядок, естественный для возвышенной русской речи.
- source_word: עִם אֲבֹתָיו
  choice: с предками своими
  rationale: Сохраняет древнееврейский эвфемистический образ присоединения к умершим предкам; «предками» в современном русском яснее, чем буквальное «отцами».
- source_word: וְהָיִיתִי אֲנִי
  choice: меня… сочтут
  rationale: Предикативное «быть» в данном контексте обозначает приписанный правовой и политический статус; русское «сочтут» естественно выражает эту подразумеваемую оценку.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: и сына моего Соломона
  rationale: Сохраняет родственную связь и имя; винительный падеж обусловлен русской конструкцией «сочтут».
- source_word: חַטָּאִים
  choice: виновными
  rationale: Слово может означать грешников или виновных; в контексте борьбы за престол речь, вероятно, о людях, признанных виновными и подлежащих наказанию, без уточнения конкретного обвинения.
