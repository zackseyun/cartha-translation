  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: ru
  text: Тогда все приглашённые гости Адонии задрожали от страха, встали и разошлись[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и пошли, каждый своей дорогой».'
    reason: Сноска сохраняет буквальный образ еврейской распределительной идиомы אִישׁ לְדַרְכּוֹ, которая в основном тексте естественно передана словом «разошлись».
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: задрожали от страха
  rationale: Глагол חרד передаёт дрожь, вызванную страхом или тревогой. Уточнение «от страха» естественно выражает здесь причину дрожи, не усиливая значение до «пришли в ужас».
- source_word: וַיָּקֻמוּ
  choice: встали
  rationale: Обычное значение קום в последовательности повествовательных действий; русское «встали» кратко и естественно передаёт внезапную реакцию гостей.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: все приглашённые к Адонии
  rationale: Субстантивированное страдательное причастие הַקְּרֻאִים означает «приглашённые». Оборот с ל связывает их с устроенным Адонией пиром; «приглашённые к Адонии» сохраняет эту связь без добавления отсутствующего в тексте слова «гости».
- source_word: וַיֵּלְכוּ אִישׁ לְדַרְכּוֹ
  choice: разошлись
  rationale: 'Буквально: «и пошли, каждый своей дорогой». Русское «разошлись» естественно передаёт распределительное значение идиомы; буквальная форма отмечена в сноске.'
