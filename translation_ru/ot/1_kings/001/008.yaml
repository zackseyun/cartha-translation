  text: וְ/צָד֣וֹק הַ֠/כֹּהֵן וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע וְ/נָתָ֤ן הַ/נָּבִיא֙ וְ/שִׁמְעִ֣י וְ/רֵעִ֔י וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד לֹ֥א הָי֖וּ עִם אֲדֹנִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: ru
  text: Но священник Садок, Ванея, сын Иодая, пророк Нафан, Семей, Рей и храбрецы Давида[a] не были с Адонией.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «храбрецы, которые были у Давида (или принадлежали Давиду)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ/כֹּהֵן
  choice: Но священник Садок
  rationale: Начальный союз передаёт контраст с перечисленными ранее сторонниками Адонии; порядок слов естественен для современного русского языка. כֹּהֵן точно передано как «священник».
- source_word: וּ/בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Ванея, сын Иодая
  rationale: Сохранена патронимическая конструкция «сын Иодая» и использованы укоренившиеся русские библейские формы имён.
- source_word: וְ/נָתָן הַ/נָּבִיא
  choice: пророк Нафан
  rationale: Аппозитивный титул הַנָּבִיא передан естественным русским сочетанием «пророк Нафан».
- source_word: וְ/שִׁמְעִי וְ/רֵעִי
  choice: Семей, Рей
  rationale: Личные имена переданы традиционными русскими библейскими формами; повторяющиеся союзы оформлены как естественное русское перечисление.
- source_word: וְ/הַ/גִּבּוֹרִים אֲשֶׁר לְ/דָוִד
  choice: и храбрецы Давида[a]
  rationale: גִּבּוֹרִים обозначает доблестных воинов; «храбрецы» кратко и достойно передаёт это значение. Конструкция אֲשֶׁר לְדָוִד выражает принадлежность или связь с Давидом и естественно передана родительным падежом, а буквальная неоднозначность отмечена в сноске.
- source_word: לֹא הָיוּ עִם
  choice: не были с
  rationale: 'Сохранена сдержанная буквальная формулировка: контекст подразумевает политическую поддержку, но сам текст прямо говорит лишь о том, что они не были с Адонией.'
- source_word: אֲדֹנִיָּהוּ
  choice: Адонией
  rationale: Использована традиционная русская форма имени «Адония» в требуемом творительном падеже после предлога «с».
theological_decisions:
- issue: Характер связи храбрецов с Давидом
  choice: храбрецы Давида
  alternative: храбрецы, которые были с Давидом / принадлежали Давиду
  rationale: Еврейское אֲשֶׁר לְדָוִד допускает широкое отношение принадлежности или службы. Основной текст дан естественно, без уточнения статуса, а буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные русские формы имён, ясное перечисление и намеренно сдержанное «не были с», не усиливающее текст до прямого «не поддержали».
