  text: וַ/יַּ֨עַן֙ יוֹנָתָ֔ן וַ/יֹּ֖אמֶר לַ/אֲדֹנִיָּ֑הוּ אֲבָ֕ל אֲדֹנֵ֥י/נוּ הַ/מֶּֽלֶךְ דָּוִ֖ד הִמְלִ֥יךְ אֶת שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/043.yaml
  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: ru
  text: 'Ионафан ответил Адонии: «Напротив, наш господин, царь Давид, поставил царём Соломона[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но наш господин, царь Давид, поставил царём Соломона». Еврейское אֲבָל можно передать простым «но», хотя здесь оно выражает возражение и исправление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: ответил
  rationale: Сочетание двух глаголов речи буквально означает «ответил и сказал», но в современном русском естественно передаётся одним глаголом «ответил» без потери смысла.
- source_word: לַאֲדֹנִיָּהוּ
  choice: Адонии
  rationale: Предлог ל передаёт адресата речи; имя поставлено в дательном падеже.
- source_word: אֲבָל
  choice: Напротив
  rationale: Здесь противительный союз не просто продолжает речь, а опровергает ожидания Адонии; «напротив» ясно передаёт эту корректирующую силу.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: наш господин, царь Давид
  rationale: Сохранены придворное обозначение «наш господин» и приложение «царь Давид»; пунктуация делает русскую конструкцию ясной.
- source_word: הִמְלִיךְ
  choice: поставил царём
  rationale: Каузативная форма глагола מלך означает сделать кого-либо царём, возвести или поставить на царство. Перевод не сужает значение до одного обряда, например помазания.
- source_word: אֶת שְׁלֹמֹה
  choice: Соломона
  rationale: Показатель прямого дополнения אֵת отдельно не переводится; имя передано в винительном падеже.
