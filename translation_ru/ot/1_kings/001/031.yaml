base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: ru
  text: 'Тогда Вирсавия склонилась лицом к земле и поклонилась перед царём. Она сказала: «Да живёт мой господин, царь Давид, вовеки!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, как торжественный возглас: «Да здравствует мой господин, царь Давид, вовеки!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: склонилась
  rationale: Глагол קָדַד означает низко склониться; этот выбор естественен по-русски и не уточняет позу сверх сказанного в тексте.
- source_word: אַפַּיִם אֶרֶץ
  choice: лицом до земли
  rationale: Еврейское выражение буквально соединяет «лицо» и «землю» и описывает глубокий почтительный поклон.
- source_word: וַתִּשְׁתַּחוּ
  choice: поклонилась
  rationale: Форма глагола שׁחה обозначает поклонение или простирание в знак почтения. В сочетании с предшествующим описанием «лицом до земли» слово «поклонилась» ясно передаёт действие без тяжеловесного повтора.
- source_word: לַמֶּלֶךְ
  choice: царю
  rationale: Дательный падеж естественно передаёт направленность почтительного поклона к царю.
- source_word: יְחִי
  choice: Да живёт
  rationale: Юссив выражает пожелание или приветственное благословение; конструкция «да живёт» сохраняет его форму и торжественный оттенок.
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: В обращении к царю это уважительный титул, естественно передаваемый как «мой господин».
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Русское сочетание титула и имени сохраняет оба элемента оригинала и звучит естественно.
- source_word: לְעֹלָם
  choice: вовеки
  rationale: В царском пожелании слово выражает неограниченную продолжительность; «вовеки» сохраняет торжественный регистр, оставаясь понятным современному читателю.
