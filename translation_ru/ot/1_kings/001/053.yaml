base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: ru
  text: 'Царь Соломон послал людей, и они свели Адонию от жертвенника[a]. Адония пришёл и поклонился царю Соломону, а Соломон сказал ему: «Иди к себе домой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свели его с жертвенника». Буквально: «заставили его сойти с поверхности жертвенника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал людей
  rationale: Глагол означает «послал»; дополнение в еврейском не названо, однако последующее множественное число указывает на посланных исполнителей. «Людей» естественно восполняет подразумеваемое дополнение, не уточняя их身份.
- source_word: וַיֹּרִדֻהוּ
  choice: они отвели Адонию
  rationale: Каузативная форма ירד буквально передаёт действие, при котором неназванные исполнители заставили его сойти. В данном контексте русское «отвели» естественно описывает удаление Адонии от места убежища.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: от жертвенника
  rationale: מֵעַל буквально может означать «с/от»; из предыдущего контекста известно, что Адония держался за рога жертвенника, поэтому «от жертвенника» не создаёт ошибочного впечатления, будто он стоял на его поверхности.
- source_word: וַיָּבֹא
  choice: он пришёл
  rationale: Сохранено обычное значение בוא без добавления неуказанного места назначения.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Глагол обозначает поклон или простирание в знак почтения. «Поклонился» звучит естественно и не навязывает точную глубину телесного жеста.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Иди к себе домой
  rationale: Фраза передаёт повеление отправиться в свой дом; современное русское выражение сохраняет оттенок царского отпущения и не звучит искусственно.
