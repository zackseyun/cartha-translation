translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Подразумеваемый объект при «послал» выражен как «людей» ради русской связности; имя Адонии повторено вместо местоимения, чтобы избежать двусмысленности. Частица ו в последовательности передана сочетанием «и» и «а» по нормам русского повествования.
