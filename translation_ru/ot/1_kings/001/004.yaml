base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: ru
  text: Девушка была необыкновенно красива; она стала прислужницей при царе и служила ему, но царь не познал её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть не вступил с ней в половую связь. Еврейский глагол, переданный здесь словом «познал», употреблён как эвфемизм половой близости.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: девушка
  rationale: נַעֲרָה обозначает молодую женщину; «девушка» естественно звучит в современном русском повествовании и не имеет архаического оттенка слова «дева».
- source_word: יָפָה עַד מְאֹד
  choice: была необыкновенно красива
  rationale: Оборот עַד מְאֹד выражает высокую степень; «необыкновенно красива» естественно и выразительно передаёт усиление.
- source_word: סֹכֶנֶת
  choice: прислуживать царю
  rationale: Редкое слово סֹכֶנֶת обозначает женщину при царе, исполняющую обязанности по уходу и обслуживанию. Глагольная передача естественна по-русски и не сужает значение до медицинской «сиделки».
- source_word: וַתְּשָׁרְתֵהוּ
  choice: ухаживала за ним
  rationale: שרת означает служить кому-либо; в данном контексте речь о личном уходе за престарелым царём. Выбор различает два близких по смыслу выражения еврейского текста и избегает неестественного повтора.
- source_word: יְדָעָהּ
  choice: не познал её
  rationale: ידע здесь является эвфемизмом половой близости. «Не познал её» сохраняет библейский образ и допускает пояснение в сноске.
theological_decisions:
- issue: Эвфемистическое обозначение половой близости
  choice: Сохранить в основном тексте выражение «не познал её» и пояснить его в сноске.
  alternative: «не вступал с ней в половую связь»; «не спал с ней»
  rationale: 'Так сохраняются образность и сдержанный тон еврейского повествования, а сноска однозначно сообщает подразумеваемый смысл: между царём и девушкой не было половой близости.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейским оттенком в выражении «не познал её». Синтаксис прост и понятен; редкое סֹכֶנֶת передано по функции в контексте.
