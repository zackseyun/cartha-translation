source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: ru
  text: А ты, господин мой, царь, — к тебе обращены взоры всего Израиля, чтобы ты объявил им, кто сядет на престол господина моего, царя, после него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть после царя Давида.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохраняет почтительное придворное обращение אֲדֹנִי и царский титул; инверсия звучит возвышенно, но остаётся понятной в современном русском языке.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: на тебя … устремлены глаза всего Израиля
  rationale: Сохраняет образ глаз, обращённых к царю в ожидании решения, и естественно передаёт эмфатическое положение местоимения אַתָּה.
- source_word: לְהַגִּיד לָהֶם
  choice: ты должен объявить им
  rationale: Инфинитив выражает ожидаемое от царя действие; «объявить» уместно для официального решения о престолонаследии, а конструкция «ты должен» ясно передаёт ожидание, заложенное в контексте.
- source_word: מִי יֵשֵׁב
  choice: кто сядет
  rationale: Сохраняет обычную метафору восшествия и пребывания на престоле, не заменяя её толкованием «кто будет царствовать».
- source_word: עַל כִּסֵּא
  choice: на престол
  rationale: Прямое и естественное соответствие выражению о занятии царского престола.
- source_word: אַחֲרָיו
  choice: после него
  rationale: Сохраняет местоименный суффикс третьего лица мужского рода и указание на преемство после царя Давида.
theological_decisions:
- issue: К кому относится местоимение в אַחֲרָיו
  choice: «после него», то есть после царя Давида
  alternative: «после этого» или просто «потом»
  rationale: Форма содержит суффикс третьего лица мужского рода и естественнее всего относится к царю, к которому обращается Вирсавия. Личное местоимение сохранено в тексте, а его референт пояснён в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным придворным оттенком. Сохранены образ «глаз всего Израиля», повтор титула и переход от обращения во втором лице к почтительному упоминанию царя в третьем лице.
