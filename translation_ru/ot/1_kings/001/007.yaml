  text: וַ/יִּהְי֣וּ דְבָרָ֔י/ו עִ֚ם יוֹאָ֣ב בֶּן צְרוּיָ֔ה וְ/עִ֖ם אֶבְיָתָ֣ר הַ/כֹּהֵ֑ן וַֽ/יַּעְזְר֔וּ אַחֲרֵ֖י אֲדֹנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: ru
  text: И он советовался с Иоавом, сыном Саруи, и со священником Авиафаром, и они поддержали Адонию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «помогали вслед за Адонией», то есть последовали за ним и встали на его сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: он советовался с
  rationale: Буквально сочетание означает «его слова были с», но в контексте политического сговора передаёт обсуждение и совещание. Русское «советовался с» естественно выражает этот смысл, не уточняя сверх текста содержание разговора.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Иоавом, сыном Саруи
  rationale: Имена переданы в принятой русской библейской форме; בֶּן передано родственным обозначением «сыном».
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: со священником Авиафаром
  rationale: Определённый титул הַכֹּהֵן прямо обозначает священническое служение Авиафара. Порядок слов выбран естественный для современного русского языка.
- source_word: וַיַּעְזְרוּ אַחֲרֵי
  choice: они поддержали
  rationale: עזר означает «помогать, поддерживать», а אַחֲרֵי буквально «за, вслед за» здесь указывает на следование стороне Адонии. «Поддержали» ясно передаёт политическую лояльность обоих участников.
- source_word: אֲדֹנִיָּה
  choice: Адонию
  rationale: Личное имя передано в традиционной русской форме и поставлено в винительный падеж как объект поддержки.
