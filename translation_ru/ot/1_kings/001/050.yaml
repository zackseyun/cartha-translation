base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: ru
  text: Адония боялся Соломона[a], поэтому встал, пошёл и ухватился за рога жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ухватиться за рога жертвенника означало искать в святилище убежища или пощады.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: испугался Соломона
  rationale: Сочетание глагола страха с מִפְּנֵי обозначает объект или причину страха. Русское управление «испугался Соломона» естественно передаёт весь оборот, не превращая предлог в отдельное пространственное выражение.
- source_word: וַיָּקָם
  choice: встал
  rationale: Прямой и естественный эквивалент повествовательного глагола; более современно, чем «поднялся» в данном сочетании действий.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Передаёт простое последовательное движение в древнееврейском повествовании.
- source_word: וַיַּחֲזֵק
  choice: ухватился
  rationale: Возвратная форма естественно описывает крепкое удерживание рогов жертвенника и не привносит оттенка насильственного захвата.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: рога жертвенника
  rationale: 'Сохраняется буквальная и традиционная культовая терминология: выступы по углам жертвенника названы «рогами».'
- source_word: וַאֲדֹנִיָּהוּ
  choice: Адония
  rationale: Имя передано в принятой русской библейской форме; начальный waw выражен естественным продолжением повествования без обязательного союза «и».
theological_decisions:
- issue: Жест поиска убежища или милости у жертвенника
  choice: 'В основном тексте буквально сохранено действие: «ухватился за рога жертвенника».'
  alternative: «искал убежища у жертвенника» или «прибежал к жертвеннику, прося пощады»
  rationale: Древнееврейский текст называет физическое действие, но прямо не разъясняет его правовой или символический смысл. Пояснение вынесено в сноску, чтобы не устранять смысловую напряжённость и не добавлять к тексту подразумеваемую цель как явное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Последовательность кратких глаголов сохраняет динамику древнееврейского повествования; культовый термин «рога жертвенника» оставлен без парафраза.
