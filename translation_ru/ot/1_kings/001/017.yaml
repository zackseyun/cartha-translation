base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: ru
  text: 'Она сказала ему: «Господин мой, ты поклялся мне, твоей рабыне, ГОСПОДОМ, твоим Богом: „Твой сын Соломон будет царствовать после меня и сядет на мой престол“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Господин мой
  rationale: Передаёт почтительное обращение к царю и сохраняет отличие от божественного имени יהוה.
- source_word: לַאֲמָתֶךָ
  choice: мне, твоей рабыне
  rationale: Сохраняет женский род и формулу почтительного самоуничижения при естественном русском порядке слов.
- source_word: בַיהוָה
  choice: ГОСПОДОМ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой и визуально отличает его от обращения «Господин мой».
- source_word: כִּי
  choice: двоеточие перед прямой речью
  rationale: Здесь частица вводит содержание клятвы; русская пунктуация естественно передаёт эту функцию без добавления неочевидного усиления вроде «непременно».
- source_word: יִמְלֹךְ אַחֲרָי
  choice: будет царствовать после меня
  rationale: Точно сохраняет будущее царствование Соломона как преемника Давида.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: сядет на мой престол
  rationale: Сохраняет конкретный образ восшествия на царский престол, не заменяя его отвлечённым выражением о наследовании власти.
theological_decisions:
- issue: Передача содержания царской клятвы
  choice: Прямая речь без добавочного усилителя
  alternative: «Именно Соломон…» или «Непременно Соломон…»
  rationale: В данном синтаксисе כִּי естественно понимать как вводящую содержание клятвы. Это не исключает уверенности высказывания, но не требует отдельного усилительного слова.
- issue: Передача имени יהוה
  choice: ГОСПОДЬ в соответствующем падеже
  alternative: Яхве
  rationale: Традиционная замена имени титулом остаётся понятной русскому читателю; прописное написание отмечает, что в источнике стоит личное имя Бога.
translation_notes:
  register: Современный литературный русский с достоинством придворной речи. Сохранены почтительное обращение, женская форма самоназвания и параллельные формулы о царствовании и престоле.
