  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: ru
  text: Как Яхве был с моим господином, царём, так да будет Он с Соломоном и да возвеличит его престол выше престола моего господина, царя Давида.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: В современной русской библейской традиции тетраграмматон естественно и благоговейно передаётся как «Господь»; это также позволяет ясно отнести подразумеваемое подлежащее следующего пожелания к Богу.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Как ... так
  rationale: Сохраняет еврейскую соотносительную конструкцию и звучит естественно по-русски.
- source_word: הָיָה ... עִם
  choice: был с
  rationale: Еврейский перфект указывает на Божье присутствие при Давиде вплоть до данного момента; в русском контексте это естественно выражается прошедшим временем.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: моим господином царём
  rationale: Сохраняет придворную почтительную формулу и различает человеческое «господин» и божественное имя, переданное как «Господь».
- source_word: יהי
  choice: да будет Он
  rationale: Форма выражает пожелание или благословение; прописная буква помогает естественно обозначить подразумеваемого Бога, не вводя Его имя повторно.
- source_word: וִיגַדֵּל
  choice: и да возвеличит
  rationale: Каузатив от גדל означает «сделать великим»; применительно к престолу «возвеличить» сохраняет образ царского величия.
- source_word: כִּסְאוֹ
  choice: его престол
  rationale: Сохранён конкретный образ престола, хотя по смыслу он также представляет царствование и власть Соломона.
- source_word: מִכִּסֵּא
  choice: более престола
  rationale: Предлог מן после каузативного גדל выражает сравнение; конструкция буквально и понятно передаёт превосходство одного престола над другим.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: моего господина, царя Давида
  rationale: Сохраняет почтительное обозначение Давида; запятая естественно оформляет пояснительное приложение в русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь
  alternative: Яхве
  rationale: Исходный текст содержит личное имя Бога. В основном русском тексте выбрана укоренённая передача «Господь», тогда как транслитерация «Яхве» точнее показывает форму имени, но менее привычна для общего литературного регистра.
- issue: Подразумеваемое подлежащее יהי
  choice: «Он» относится к Господу из предыдущей части
  alternative: 'Повторить: «так да будет Господь с Соломоном»'
  rationale: Еврейский юссив не выражает подлежащее явно, но контекст отсылает к Господу. Местоимение сохраняет связность и не устраняет грамматическую имплицитность повторением имени.
translation_notes:
  register: Современный литературный русский с достоинством придворного благословения. Синтаксический параллелизм «как ... так» и два пожелания с «да» сохраняют торжественность оригинала без архаизации.
