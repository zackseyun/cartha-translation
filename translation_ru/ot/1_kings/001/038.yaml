base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: ru
  text: И священник Садок, пророк Нафан, Ванея, сын Иодая, а также хелефеи и фелефеи[a] спустились, посадили Соломона на мулицу[b] царя Давида и повели его к Гихону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «царская стража». В еврейском тексте употреблены сами названия этих групп.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мула». Еврейское существительное имеет форму женского рода и обозначает самку мула.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: спустились
  rationale: Сохраняет направительное значение корня ירד («спускаться») и естественно описывает движение к Гихону.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный русский эквивалент כהן; титул естественно поставлен перед именем.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Стандартный эквивалент נביא, сохраняющий данный в еврейском тексте титул.
- source_word: בֶן יְהוֹיָדָע
  choice: сын Иодая
  rationale: Прямая и естественная передача патронима.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: хелефеи и фелефеи
  rationale: Названия групп переданы традиционной русской библейской транслитерацией, поскольку их точная этническая или служебная характеристика спорна.
- source_word: וַיַּרְכִּבוּ
  choice: посадили ... на
  rationale: 'Передаёт каузативную форму глагола רכב: они сделали так, чтобы Соломон ехал верхом.'
- source_word: פִּרְדַּת
  choice: мулицу
  rationale: Существительное имеет женскую форму и конкретно обозначает самку мула; русский язык позволяет ясно сохранить эту деталь.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царя Давида
  rationale: 'Естественно передаёт конструкцию принадлежности: «мулица царя Давида».'
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: повели его
  rationale: Каузатив от הלך означает «заставить идти», а в данном контексте — сопровождать или вести Соломона в церемониальном шествии.
- source_word: עַל גִּחוֹן
  choice: к Гихону
  rationale: При глаголе движения предлог עַל здесь указывает на направление к месту; «к Гихону» естественно по-русски и не уточняет сверх текста, к источнику ли или в местность они направились.
