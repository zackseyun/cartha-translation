  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: ru
  text: Затем поднимитесь вслед за ним; он придёт, сядет на мой престол и будет царствовать вместо меня. Ему я повелел[a] быть правителем над Израилем и над Иудеей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его я назначил правителем над Израилем и над Иудеей». Еврейский глагол обычно означает «повелевать»; в данном контексте его также понимают как назначение на должность. Еврейское נָגִיד можно также перевести как «князь» или «предводитель».'
    reason: Лексическая и контекстуальная неоднозначность צוה; возможные соответствия для נָגִיד.
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  choice: поднимитесь вслед за ним
  rationale: Глагол עלה сохраняет направленность движения вверх, а אַחֲרָיו указывает на следование за Соломоном в царской процессии.
- source_word: וּבָא וְיָשַׁב עַל־כִּסְאִי
  choice: он придёт и сядет на мой престол
  rationale: Передана последовательность действий без добавочного истолкования; выражение «сесть на престол» естественно обозначает вступление на царство.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: будет царствовать вместо меня
  rationale: תַּחְתָּי здесь обозначает замещение Давида в царской власти, а не только хронологическое следование после него.
- source_word: וְאֹתוֹ צִוִּיתִי
  choice: именно его я поставил
  rationale: Вынесенное местоимение אֹתוֹ имеет смысловое ударение. Хотя צוה обычно означает «повелевать», в данном контексте оно может выражать властное назначение на должность; основная формулировка передаёт этот контекстуальный смысл, а буквальная альтернатива сохранена в сноске.
- source_word: לִהְיוֹת נָגִיד
  choice: правителем
  rationale: נָגִיד обозначает поставленного руководителя или князя. «Правитель» понятно современному читателю и сохраняет отличие от глагола מלך — «царствовать».
- source_word: עַל־יִשְׂרָאֵל וְעַל־יְהוּדָה
  choice: над Израилем и над Иудеей
  rationale: Повтор предлога «над» отражает повтор עַל и подчёркивает власть над обеими названными общностями.
theological_decisions:
- issue: Соотношение титула נָגִיד и царской власти
  choice: נָגִיד передано как «правитель», а מלך — как «царствовать»
  alternative: «князь» или «вождь» для נָגִיד
  rationale: Разные русские слова сохраняют различие двух еврейских выражений и не сводят оба к титулу «царь».
- issue: Значение צִוִּיתִי в формуле назначения
  choice: «я поставил» в основном тексте
  alternative: «я повелел ему быть»
  rationale: Контекст допускает понимание властного назначения, однако обычное значение глагола «повелевать» остаётся реальной альтернативой и потому указано в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис сохраняет последовательность еврейского текста, но избегает архаизмов; смысловое выделение וְאֹתוֹ передано словом «именно».
