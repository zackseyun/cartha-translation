  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: ru
  text: 'И ещё царь сказал: «Благословен Яхве, Бог Израиля, который сегодня дал кому-то сесть на мой престол, и мои глаза видят это[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который сегодня дал сидящего на моём престоле, и мои глаза видят». В еврейском тексте стоит причастие «сидящий»; по контексту оно передаёт того, кому дано сесть на престол. Не сказано прямо, что именно видят глаза; «это» восполнено по смыслу.'
    reason: Сохраняет и поясняет контекстуально обусловленную передачу причастия יֹשֵׁב, а также невыраженное дополнение при רֹאוֹת.
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: И царь также сказал
  rationale: וְגַם передаёт добавление к предыдущему сообщению, а כָּכָה вводит последующие слова. В современном русском отдельное «так» здесь необязательно и утяжеляло бы вводную формулу.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая именная формула сохраняет торжественный и хвалебный характер древнееврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт древнееврейскую сопряжённую конструкцию.
- source_word: אֲשֶׁר נָתַן הַיּוֹם יֹשֵׁב
  choice: который сегодня дал одному воссесть
  rationale: Сохраняется обычное значение נתן «дать», а субстантивированное причастие יֹשֵׁב передаётся неопределённым лицом. Инфинитив «воссесть» естественно выражает предоставленную возможность или назначение, не называя Соломона там, где его имя отсутствует.
- source_word: עַל כִּסְאִי
  choice: на моём престоле
  rationale: «Престол» — обычное русское обозначение царского трона и власти в данном контексте.
- source_word: וְעֵינַי רֹאוֹת
  choice: и мои глаза видят это
  rationale: Сохранены сочинительная связь и образ личного свидетельства. Местоимение «это» восполняет невыраженный в древнееврейском объект ради естественности русского синтаксиса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Смысл יֹשֵׁב после נתן
  choice: дал одному воссесть
  alternative: дал сидящего
  rationale: Форма допускает более буквальное понимание «сидящий», однако в связи с נתן конструкция естественно выражает дарование престолонаследника или права занять престол. Перевод не добавляет имени и не уточняет сверх текста характер назначения.
translation_notes:
  register: Современный литературный русский с достоинством царской благословенной речи; синтаксис остаётся прозрачным для обычного читателя, а необычная краткость оригинала разъясняется в сноске.
