lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Нифаль глагола שׁבע обозначает принесение клятвы; краткое «поклялся» естественно для русского повествования.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён употреблённый в еврейском тексте титул с определённым значением; контекст указывает на Давида.
- source_word: וַיֹּאמַר
  choice: сказав
  rationale: Деепричастная конструкция естественно объединяет два последовательных повествовательных глагола, не добавляя смысловой силы вроде «провозгласил».
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохранена стандартная древнееврейская формула клятвы и личное имя Бога; выражение остаётся понятным в контексте глагола «поклялся».
- source_word: פָּדָה
  choice: избавил
  rationale: В данном контексте речь идёт о спасении жизни Давида от опасностей. «Избавил» передаёт совершённое спасительное действие естественнее по-русски, тогда как «искупил» могло бы неоправданно подразумевать плату.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: Здесь נֶפֶשׁ обозначает жизнь или самого человека, сохранённого среди опасностей, а не обязательно нематериальную душу.
- source_word: מִכָּל צָרָה
  choice: от всякой беды
  rationale: 'Передаёт широкое значение сочетания: от всякого бедствия, несчастья или тяжёлого положения; формулировка естественна в современном литературном русском.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение נַפְשִׁי
  choice: мою жизнь
  alternative: мою душу; меня самого
  rationale: Контекст говорит о сохранении Давида от бедствий. «Жизнь» не навязывает позднейшего дуалистического понимания слова נֶפֶשׁ.
- issue: Передача פָּדָה
  choice: избавил
  alternative: искупил; выкупил
  rationale: Глагол допускает значения выкупа и избавления, но здесь прямое дополнение «мою жизнь» и обстоятельство «от всякой беды» указывают прежде всего на спасение из опасностей. Выбор не исключает более широкого образа Божьего освобождения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства царской клятвы. Тире в конце показывает, что клятвенная речь продолжается в следующем стихе.
