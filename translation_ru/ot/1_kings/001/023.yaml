lexical_decisions:
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ לֵאמֹר
  choice: Царю доложили
  rationale: Естественная современная передача формулы сообщения; содержание прямой речи сохраняется после двоеточия.
- source_word: הִנֵּה נָתָן הַנָּבִיא
  choice: Пришёл пророк Нафан
  rationale: הִנֵּה здесь представляет прибывшего человека; «пришёл» ясно выражает подразумеваемое присутствие, не утяжеляя речь буквальным «вот».
- source_word: וַיִּשְׁתַּחוּ ... עַל אַפָּיו אָרְצָה
  choice: поклонился ему лицом до земли
  rationale: Сохраняет образ глубокого земного поклона и естественно звучит по-русски.
