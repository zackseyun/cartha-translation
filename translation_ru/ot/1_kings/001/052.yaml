  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: ru
  text: 'И сказал Соломон: «Если он окажется достойным человеком[a], ни один его волос не упадёт на землю[b]; но если в нём обнаружится зло, он умрёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыном силы (или доблести)». Еврейское выражение может обозначать достойного, способного или доблестного человека — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «ни один его волос не упадёт на землю» означает, что с ним не случится никакого вреда.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: достойным человеком
  rationale: Буквально «сыном силы/доблести». В данном контексте выражение характеризует надёжность и достойное поведение Адонии, а не только воинскую храбрость.
- source_word: יִהְיֶה
  choice: окажется
  rationale: Форма буквально означает «будет», но в условном высказывании речь идёт о том, каким Адония проявит себя в дальнейшем. «Окажется» естественно передаёт эту смысловую силу.
- source_word: לֹא יִפֹּל מִשַּׂעֲרָתוֹ אָרְצָה
  choice: ни один его волос не упадёт на землю
  rationale: Сохранён яркий еврейский образ, обозначающий полную безопасность и отсутствие вреда; русская формулировка понятна и близка к форме оригинала.
- source_word: רָעָה
  choice: зло
  rationale: Широкое нравственное значение существительного сохранено без сужения до какого-либо определённого преступления.
- source_word: תִמָּצֵא בוֹ
  choice: в нём обнаружится
  rationale: Передаёт пассивную конструкцию и мысль о том, что зло будет выявлено как присущее ему или совершённое им, не устраняя смысловую широту оригинала.
- source_word: וָמֵת
  choice: он умрёт
  rationale: Кратко и торжественно передаёт установленное последствие. Формулировка не уточняет сверх текста, является ли это предсказанием или судебным приговором.
theological_decisions:
- issue: Характер заключительной угрозы
  choice: «он умрёт»
  alternative: «он должен будет умереть» / «да будет предан смерти»
  rationale: Еврейское וָמֵת сообщает смертельное последствие, но само по себе не требует более узкой формулировки о способе или юридической процедуре казни; перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной и судебной речи. Образность еврейского оригинала сохранена, а непрозрачные для читателя выражения пояснены в сносках.
