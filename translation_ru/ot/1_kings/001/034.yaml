base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: ru
  text: 'Там пусть священник Садок и пророк Нафан помажут его в цари над Израилем. Затем протрубите в шофар[a] и возгласите: «Да здравствует царь Соломон!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шофар — рог, в который трубили, подавая общественный сигнал или делая торжественное провозглашение; традиционно его также называют трубой.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: пусть помажут
  rationale: Форма совершенного вида с союзом в последовательности распоряжений имеет побудительную силу; русская конструкция с «пусть» естественно передаёт приказание, обращённое к исполнителям.
- source_word: שָׁם
  choice: Там
  rationale: Кратко и точно отсылает к ранее названному месту.
- source_word: צָדוֹק הַכֹּהֵן
  choice: священник Садок
  rationale: В современном русском нейтральный порядок «титул + имя» звучит естественно; имя передано в принятой библейской форме.
- source_word: וְנָתָן הַנָּבִיא
  choice: и пророк Нафан
  rationale: Сохраняет координацию двух совершающих помазание и стандартно передаёт נָבִיא как «пророк».
- source_word: לְמֶלֶךְ
  choice: в цари
  rationale: Ламед обозначает назначение на царское служение; устойчивое русское выражение «помазать в цари» точно и естественно.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל в сочетании с царской властью выражает правление над народом.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: протрубите в шофар
  rationale: Повелительная форма передаёт продолжение распоряжения. «Шофар» сохраняет конкретное название сигнального рога и поясняется в сноске.
- source_word: וַאֲמַרְתֶּם
  choice: и возгласите
  rationale: В контексте публичного провозглашения царя «возгласите» точнее и естественнее простого «скажите».
- source_word: יְחִי
  choice: Да здравствует
  rationale: Устоявшаяся русская формула торжественной аккламации естественно передаёт юссив חיה.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Обычный русский порядок титула и имени в формуле провозглашения.
