  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: ru
  text: 'Тогда Нафан сказал Вирсавии, матери Соломона: «Разве ты не слышала, что Адония, сын Аггифы, стал царём[a], а наш господин Давид об этом не знает?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воцарился». По контексту речь может идти о том, что Адония сам провозгласил себя царём, однако употреблённый здесь еврейский глагол прямо этого не выражает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: בַּת שֶׁבַע
  choice: Вирсавии
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, понятная широкому читателю.
- source_word: אֵם שְׁלֹמֹה
  choice: матери Соломона
  rationale: Конструкция точно передаёт родственную связь и служит приложением к имени Вирсавии.
- source_word: לֵאמֹר
  choice: не передано отдельным словом
  rationale: Древнееврейская формула введения прямой речи в современном русском естественно выражается двоеточием и кавычками.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Разве ты не слышала
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ; женский род соответствует обращению к Вирсавии.
- source_word: מָלַךְ
  choice: стал царём
  rationale: Передаёт событийное значение глагола, не добавляя прямо не выраженной в тексте мысли о самопровозглашении.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: Адония, сын Аггифы
  rationale: Сохранены традиционные русские формы имён и прямо передано указание на происхождение.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: а наш господин Давид
  rationale: Союз «а» естественно выражает смысловое противопоставление; «господин» сохраняет придворный почтительный титул и не смешивает его с Божественным именованием.
- source_word: לֹא יָדָע
  choice: об этом не знает
  rationale: Настоящее время передаёт актуальное состояние незнания; «об этом» естественно восполняет подразумеваемый объект.
theological_decisions:
- issue: Человеческий титул אֲדֹנֵינוּ применительно к Давиду
  choice: наш господин Давид
  alternative: наш владыка Давид
  rationale: Это почтительное обращение к царю, а не Божественный титул; строчная буква сохраняет данное различие.
- issue: Характер воцарения Адонии в מָלַךְ
  choice: стал царём
  alternative: сам провозгласил себя царём
  rationale: Контекст указывает на самовольную попытку занять престол, однако сам глагол в этом стихе прямо не выражает возвратного значения или самопровозглашения; неоднозначность сохранена в основном тексте и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Традиционные русские формы библейских имён сохранены ради узнаваемости; архаические обороты устранены. Маркер сноски поставлен непосредственно после выражения, к которому относится пояснение.
