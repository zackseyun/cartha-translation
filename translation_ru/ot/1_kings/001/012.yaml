lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сочетание вводит срочный переход к практическому совету; союз וְ естественно передаётся русским «а».
- source_word: לְכִי
  choice: ступай
  rationale: Женская форма повелительного наклонения от глагола «идти». В контексте это одновременно побуждение к действию и переход к дальнейшим указаниям; «ступай» звучит естественно и сохраняет значение движения.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: прошу, позволь мне дать тебе совет
  rationale: Однокоренная конструкция «посоветую тебе совет» по-русски передана идиоматически. נָא выражает просьбу и настойчивое вежливое побуждение.
- source_word: וּמַלְּטִי
  choice: и спаси
  rationale: Повелительная форма призывает Вирсавию действовать ради избавления от смертельной опасности; «спаси» ясно передаёт практический смысл.
- source_word: נַפְשֵׁךְ
  choice: свою жизнь
  rationale: נֶפֶשׁ здесь обозначает жизнь человека, находящуюся под угрозой, а не отдельную нематериальную «душу».
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: и жизнь своего сына Соломона
  rationale: Сохранены параллелизм с жизнью Вирсавии и прямое именование Соломона.
