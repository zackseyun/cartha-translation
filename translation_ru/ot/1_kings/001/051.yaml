base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: ru
  text: 'Соломону донесли: «Вот, Адония боится царя Соломона; и вот, он ухватился за рога жертвенника и говорит: „Пусть царь Соломон сегодня поклянётся мне, что не убьёт своего раба мечом“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה
  choice: Соломону донесли
  rationale: Еврейская безличная пассивная конструкция естественно передаётся по-русски неопределённо-личной формой.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию первого הִנֵּה; второе естественно выражено началом отдельного предложения без избыточного повтора.
- source_word: אָחַז בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: ухватился за рога жертвенника
  rationale: Точно передаёт конкретное действие и принятую библейскую терминологию предметных выступов жертвенника.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: сегодня поклянётся мне
  rationale: Передаёт требование немедленной клятвы; положение слова «сегодня» в русском предложении остаётся естественным и не меняет смысла.
- source_word: עַבְדּוֹ
  choice: своего раба
  rationale: Сохранена формула самообозначения подданного перед царём без модернизирующей замены на «слугу».
theological_decisions:
- issue: Эллиптическая отрицательная формула клятвы אִם יָמִית
  choice: что не убьёт
  alternative: если убьёт
  rationale: В контексте просьбы о клятве אִם вводит традиционную эллиптическую формулу отрицательного заверения. Русское «что не убьёт» ясно передаёт её смысл, не добавляя содержания подразумеваемого проклятия.
translation_notes:
  register: Современный литературный русский с dignified библейским регистром. Две конструкции לֵאמֹר переданы двоеточием и глаголом «говорит», чтобы избежать неестественного повтора «говоря», при сохранении обоих уровней прямой речи.
