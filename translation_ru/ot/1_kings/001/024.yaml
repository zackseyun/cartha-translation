base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: ru
  text: 'И сказал Нафан: «Господин мой, царь, ты сказал: „Адония будет царствовать после меня и сядет на моём престоле“?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте нет отдельной вопросительной частицы; вопросительный смысл определяется контекстом и интонацией.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; традиционное и естественное русское «И сказал» сохраняет связь с предыдущим контекстом.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Господин мой царь
  rationale: Сохраняет притяжательное почтительное обращение и царский титул; порядок слов звучит достойно и соответствует библейской придворной речи.
- source_word: אַתָּה אָמַרְתָּ
  choice: ты сказал
  rationale: 'Еврейский перфект в данном вопросе естественно передаётся русским прошедшим временем. Местоимение «ты» сохраняет эмфатически выраженное אַתָּה: Нафан уточняет, исходило ли распоряжение лично от Давида.'
- source_word: אֲדֹנִיָּהוּ
  choice: Адония
  rationale: Употреблена устоявшаяся русская библейская форма имени.
- source_word: יִמְלֹךְ
  choice: будет царствовать
  rationale: Прямо передаёт значение «царствовать, быть царём» и уместно в контексте престолонаследия.
- source_word: אַחֲרָי
  choice: после меня
  rationale: Сохраняет краткость и возможную смысловую широту исходного выражения, ясно указывающего на преемство.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: он сядет на моём престоле
  rationale: Сохраняет образ царского престола и значение вступления в царскую власть.
theological_decisions:
- issue: Вопрос или утверждение в словах Нафана
  choice: 'Передано как вопрос: «ты сказал…?»'
  alternative: 'Утверждение: «ты сказал…»'
  rationale: Контекст и вопросительная интонация, традиционно распознаваемая в этой реплике, показывают, что Нафан осторожно выясняет, санкционировал ли Давид воцарение Адонии; при этом сама еврейская форма без отдельной вопросительной частицы допускает формальную двусмысленность.
translation_notes:
  register: Современный литературный русский с сохранением достоинства придворной речи и лаконичного синтаксиса древнееврейского повествования. Форма «Господин мой царь» намеренно несколько торжественна, но понятна современному читателю.
