  to: Если это дело произошло от моего господина царя, разве ты не сообщил своим слугам, кто сядет на престоле моего господина царя после него?[a]
  rationale: Правка сохраняет условную форму אִם и риторическую силу всего вопроса, выраженную по-русски сочетанием «Если ... разве ...». «Произошло от» передаёт совершенный характер נִהְיָה и указание на источник/санкцию решения. Примечание приведено в соответствие с лексическим примечанием аудиторской версии и привязано к слову «дело».
