  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: ru
  text: Если это дело произошло от моего господина царя, разве ты не сообщил своим слугам, кто сядет на престоле моего господина царя после него?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вопрос» или «событие».'
    reason: Еврейское דָּבָר — широкое по значению слово; в данном контексте оно может обозначать дело, вопрос или событие.
lexical_decisions:
- source_word: אִם
  choice: Неужели
  rationale: Формально союз может означать «если», но здесь он вводит заострённый риторический вопрос Нафана. «Неужели» естественно передаёт вопросительную силу контекста, не превращая реплику в прямое обвинение.
- source_word: מֵאֵת ... נִהְיָה
  choice: исходит от
  rationale: 'Сочетание указывает на источник или санкцию решения: дело исходит от царя. Настоящее время по-русски естественно выражает актуальную значимость уже принятого решения.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: мой господин царь
  rationale: Сохранено почтительное придворное обращение без излишней архаизации.
- source_word: הַדָּבָר הַזֶּה
  choice: это дело
  rationale: דבר здесь обозначает обсуждаемое решение или событие. «Дело» сохраняет широту еврейского слова и подходит контексту.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: а ты не сообщил
  rationale: Порода hифиль глагола ידע означает «дать знать, известить». Союз «а» естественно передаёт контраст и риторическое недоумение в русском вопросе.
- source_word: עֲבָדֶיךָ
  choice: своим слугам
  rationale: В придворной речи это почтительное обозначение подчинённых царя; «слуги» точнее контекстуально, чем «рабы».
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: кто сядет на престоле
  rationale: Сохранён конкретный образ восшествия на престол, а не заменён более общим «кто будет царствовать».
- source_word: אַחֲרָיו
  choice: после него
  rationale: Прямо передаёт последовательность царского преемства и сохраняет почтительное упоминание царя в третьем лице.
theological_decisions:
- issue: Значение עבד в придворном самообозначении
  choice: своим слугам
  alternative: своим рабам
  rationale: В данном контексте слово обозначает придворных, подчёркивающих подчинённость царю, а не акцентирует рабский правовой статус.
- issue: Риторическая или условная сила אִם
  choice: Неужели
  alternative: Если
  rationale: Контекст поддерживает риторический вопрос, однако условное прочтение грамматически возможно и сохранено в примечании.
translation_notes:
  register: Современный литературный русский с сохранением достоинства придворной речи. Обращение на «ты» соответствует грамматическому числу еврейского текста и библейской повествовательной норме; формулы «мой господин царь» и «после него» сохраняют почтительную дистанцию.
