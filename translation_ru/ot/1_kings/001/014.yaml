  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: ru
  text: Вот, пока ты ещё будешь говорить там с царём, я войду вслед за тобой и подтвержу твои слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дополню твои слова»; еврейское выражение может означать, что говорящий добавит подробности, подтверждающие сказанное другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание к следующему шагу замысла; «вот» естественно и достойно передаёт её в современном русском.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: пока ты ещё будешь говорить
  rationale: Сочетание наречия с суффиксом 2-го лица женского рода и причастия обозначает продолжающееся действие, на фоне которого войдёт Нафан.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: там с царём
  rationale: Сохранены и локативное «там», и обычное значение предлога עִם «с»; выражение указывает на разговор в присутствии царя.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: я войду вслед за тобой
  rationale: В дворцовом контексте בוא подразумевает вход к царю, а אַחֲרַיִךְ указывает, что Нафан войдёт после Вирсавии.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: и подтвержу твои слова
  rationale: Идиома буквально связана с наполнением или дополнением слов; здесь она означает подкрепить сказанное Вирсавией дополнительным свидетельством.
