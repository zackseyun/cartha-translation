base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: ru
  text: 'Ведь сегодня он спустился и принёс в жертву в большом количестве быков, откормленный скот и овец. Он пригласил всех царских сыновей, военачальников и священника Авиафара. И вот, они едят и пьют перед ним и возглашают: «Да здравствует царь Адония!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть живёт царь Адония!» Это обычная формула провозглашения и приветствия царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование предшествующего сообщения; «ведь» естественно передаёт пояснительную связь, не усиливая её до строго причинной.
- source_word: יָרַד הַיּוֹם
  choice: сегодня он спустился
  rationale: Сохранено направительное значение יָרַד («спуститься»); русское прошедшее время естественно для сообщения о недавнем событии.
- source_word: וַיִּזְבַּח
  choice: и принёс в жертву
  rationale: Передаёт культовый смысл זבח яснее, чем нейтральное «заколол».
- source_word: שׁוֹר וּמְרִיא וְצֹאן לָרֹב
  choice: множество быков, откормленного скота и овец
  rationale: לָרֹב отнесено ко всему перечню. מְרִיא обозначает откормленный скот без обязательного указания на возраст, поэтому не сужено до «телят».
- source_word: וַיִּקְרָא לְכָל
  choice: Он пригласил всех
  rationale: В контексте жертвенного пира קרא ל естественно означает приглашение или созыв.
- source_word: שָׂרֵי הַצָּבָא
  choice: военачальников
  rationale: Краткий современный эквивалент обозначения начальников войска.
- source_word: וְהִנָּם
  choice: И вот, они
  rationale: «И вот» сохраняет указательно-презентативную функцию оборота без архаического «се».
- source_word: לְפָנָיו
  choice: у него
  rationale: В пиршественном контексте выражение означает присутствие перед Адонией, при нём; «у него» звучит естественно и не создаёт неуместной пространственной картины.
- source_word: וַיֹּאמְרוּ
  choice: и возглашают
  rationale: Настоящее время в живом донесении передаёт продолжающуюся сцену; «возглашают» соответствует характеру публичной аккламации.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Да здравствует царь Адония!
  rationale: Устойчивое русское выражение точно передаёт пожелание жизни царю и функцию аккламации.
theological_decisions:
- issue: Провозглашение Адонии царём
  choice: Передано как прямая царская аккламация без оценки её законности.
  alternative: Добавить пояснение, что его царствование было самопровозглашённым или незаконным.
  rationale: Еврейский текст сообщает слова участников пира, но в самом стихе не формулирует оценку; такая оценка должна следовать из повествовательного контекста, а не вноситься в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на три предложения для ясности; сохранены жертвенный характер пира, направительное значение глагола «спустился» и живость донесения. Единственный маркер [a] помещён непосредственно после соответствующей аккламации.
