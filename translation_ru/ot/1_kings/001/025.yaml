    rationale: В сочетании «множество быков, откормленного скота и овец» количественное слово синтаксически прежде всего относится к быкам, тогда как לָרֹב характеризует жертвенных животных в целом. Формулировка «в большом количестве» после глагола яснее передаёт объём всего перечня.
