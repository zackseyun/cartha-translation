  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: ru
  text: И вот[a], пока она ещё говорила с царём, пришёл пророк Нафан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вот»; это еврейское выражение привлекает внимание к внезапному развитию событий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Дискурсивный маркер привлекает внимание к новому, внезапному развитию сцены; «и вот» естественно передаёт это в современном литературном русском.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: пока она ещё говорила
  rationale: Наречие с местоименным суффиксом и причастие женского рода обозначают продолжавшееся действие и его одновременность с приходом Нафана.
- source_word: עִם הַמֶּלֶךְ
  choice: с царём
  rationale: Предлог עִם обычно означает «с»; выражение сохраняет оттенок непосредственной беседы с царём.
- source_word: וְנָתָן הַנָּבִיא
  choice: пророк Нафан
  rationale: В русском естественнее поставить обозначение служения перед именем, не изменяя смысла еврейского сочетания «Нафан, пророк».
- source_word: בָּא
  choice: вошёл
  rationale: Глагол означает приход или вхождение; в контексте царской аудиенции «вошёл» ясно передаёт появление Нафана в помещении или перед царём.
