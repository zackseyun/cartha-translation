  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: ru
  text: 'Как я поклялся тебе именем Яхве[a], Бога Израиля, сказав: «Твой сын Соломон будет царствовать после меня и сядет на мой престол вместо меня[b]», — так я и сделаю сегодня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога Израиля; в некоторых переводах передаётся словом «Господь».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «после меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Как
  rationale: Открывает сопоставительную конструкцию, завершённую словами «так Я и сделаю»; начальное כִּי не требует отдельной передачи в естественном русском синтаксисе.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: Я поклялся тебе
  rationale: Перфект указывает на ранее данную клятву; прошедшее время естественно для повествовательного контекста.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог בְּ обозначает того, кем клянутся; тетраграмматон передан личным именем «Яхве».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Форма творительного падежа согласуется с русской конструкцией «поклялся Яхве, Богом Израиля».
- source_word: לֵאמֹר
  choice: сказав
  rationale: Причастная форма естественно вводит содержание клятвы и сохраняет семитскую формулу без тяжеловесности.
- source_word: כִּי שְׁלֹמֹה בְנֵךְ יִמְלֹךְ אַחֲרַי
  choice: Твой сын Соломон будет царствовать после Меня
  rationale: Вводное כִּי передаётся самим оформлением прямой речи; יִמְלֹךְ означает царствовать, а אַחֲרַי выражает преемство.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: и сядет на Мой престол вместо Меня
  rationale: Царский образ «сидеть на престоле» сохранён буквально; תַּחְתָּי допускает значение замещения или преемства, поэтому неоднозначность отмечена сноской.
- source_word: כִּי כֵן אֶעֱשֶׂה
  choice: так Я и сделаю
  rationale: Завершает соотносительную конструкцию «как… так»; частица «и» передаёт заверительный оттенок.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественный современный русский эквивалент выражения «в этот день», сохраняющий непосредственность обещания.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл תַּחְתָּי в престолонаследии
  choice: вместо Меня
  alternative: после Меня
  rationale: Форма буквально выражает положение «под/вместо» кого-либо и здесь означает замещение на престоле; поскольку контекст допускает акцент на последовательности, альтернативу сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным звучанием царской клятвы. Прописные местоимения в прямой речи обозначают говорящего царя Давида и применены как элемент традиционного библейского регистра, не как утверждение о его божественности.
