base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: ru
  text: 'Священник Садок взял из шатра рог с маслом и помазал Соломона. Затем протрубили в шофар[a], и весь народ воскликнул: «Да здравствует царь Соломон!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шофар — роговой сигнальный инструмент, обычно из бараньего рога; возможный перевод: «протрубили в рог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямо передаёт последовательное повествовательное действие глагола לקח.
- source_word: צָדוֹק הַכֹּהֵן
  choice: священник Садок
  rationale: Естественный для современного русского порядок слов, точно сохраняющий имя и титул.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: рог с маслом
  rationale: Сохраняет конкретный образ рога как сосуда; конструкция «с маслом» по-русски естественнее буквального «рог масла».
- source_word: מִן הָאֹהֶל
  choice: из шатра
  rationale: Передаёт обычное значение אֹהֶל, не вводя более специального термина «скиния», которого здесь нет в еврейском тексте.
- source_word: וַיִּמְשַׁח
  choice: помазал
  rationale: Традиционный и точный русский эквивалент ритуального משׁח, сохраняющий смысл царского посвящения.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: затрубили в шофар
  rationale: Глагол «затрубили» естественно передаёт действие, а «шофар» точно называет ритуальный духовой инструмент из рога; пояснение дано в сноске.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Естественно и точно передаёт коллективное публичное одобрение.
- source_word: וַיֹּאמְרוּ
  choice: воскликнул
  rationale: В контексте общей царской аккламации русский глагол «воскликнул» естественнее буквального «сказал», при этом единственное число согласуется с собирательным «народ».
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Да здравствует царь Соломон!
  rationale: Устоявшаяся русская формула царской аккламации, точно передающая пожелательное значение юссива יְחִי.
theological_decisions:
- issue: Степень конкретизации הָאֹהֶל в контексте царского помазания
  choice: шатёр
  alternative: скиния; священный шатёр
  rationale: Еврейский текст употребляет обычное существительное «шатёр» с определённым артиклем. Перевод не конкретизирует его как «скинию» и тем самым сохраняет формальную неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис ясен для широкого читателя; ритуальные образы исходного текста сохранены без лишней конфессиональной конкретизации.
