  text: וְֽ/אֶת נָתָן֩ הַ/נָּבִ֨יא וּ/בְנָיָ֜הוּ וְ/אֶת הַ/גִּבּוֹרִ֛ים וְ/אֶת שְׁלֹמֹ֥ה אָחִ֖י/ו לֹ֥א קָרָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: ru
  text: А пророка Нафана[a], Ванею, могучих воинов и своего брата Соломона он не пригласил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А Нафана-пророка, Ванею, могучих воинов и своего брата Соломона он не позвал». Еврейский глагол буквально означает «позвать», здесь — пригласить на пир Адонии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: А
  rationale: Союз продолжает повествование, но здесь вводит контраст между приглашёнными в ст. 9 и теми, кого Адония не пригласил; русское «А» естественно передаёт этот оттенок.
- source_word: נָתָן הַנָּבִיא
  choice: пророка Нафана
  rationale: Обычный для современного русского порядок «титул + имя» ясно передаёт еврейское сочетание имени и приложения.
- source_word: וּבְנָיָהוּ
  choice: Ванею
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительном падеже как одушевлённое прямое дополнение.
- source_word: הַגִּבּוֹרִים
  choice: могучих воинов
  rationale: Слово обозначает прославленных сильных воинов, в данном контексте — воинскую элиту Давида; перевод сохраняет как силу, так и военную специфику.
- source_word: שְׁלֹמֹה אָחִיו
  choice: своего брата Соломона
  rationale: Возвратное «своего» недвусмысленно связывает родство с Адонией, а естественный русский порядок не затрудняет чтение.
- source_word: לֹא קָרָא
  choice: не пригласил
  rationale: Глагол буквально означает «позвал», но в контексте устроенного пира выражает приглашение; «не пригласил» точно и естественно передаёт действие.
