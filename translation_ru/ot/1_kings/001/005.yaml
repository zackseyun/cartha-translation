base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: ru
  text: 'Адония, сын Аггифы, возвысил себя[a], сказав: «Я буду царствовать[b]». Он устроил себе колесницу, всадников и пятьдесят человек, бежавших перед ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал выдвигать себя»; еврейский глагол передаёт самовозвышение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я буду царём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: стал превозносить себя
  rationale: Возвратная форма передаёт самовозвышение и неодобрительный оттенок еврейского Hitpael; конструкция «стал…» естественно передаёт разворачивающееся действие причастия в повествовании.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: 'говоря: «Я буду царём»'
  rationale: Глагол מלך допускает значения «царствовать» и «быть царём». По-русски «буду царём» ясно и естественно выражает притязание Адонии, не добавляя, что он уже воцарился.
- source_word: וַיַּעַשׂ לוֹ
  choice: он обзавёлся
  rationale: Буквально выражение означает, что он «сделал/устроил для себя» всё перечисленное. «Обзавёлся» естественно объединяет колесницу, всадников и бегущую впереди свиту, не уточняя не названный в тексте способ их приобретения.
- source_word: רֶכֶב
  choice: колесницей
  rationale: Сохранено единственное число; в данном контексте речь идёт о царском экипаже, служащем знаком статуса.
- source_word: פָרָשִׁים
  choice: всадниками
  rationale: Слово обозначает конных сопровождающих; «всадники» прозрачнее и менее технично, чем «конница».
- source_word: חֲמִשִּׁים אִישׁ
  choice: пятьюдесятью людьми
  rationale: Передано точное число участников свиты. Русское «людьми» в данном синтаксисе естественно; контекст древней царской процессии не требует дополнительно подчёркивать пол словом «мужчинами».
- source_word: רָצִים לְפָנָיו
  choice: которые бежали перед ним
  rationale: Передаёт функцию пеших скороходов, двигавшихся впереди Адонии, и сохраняет наглядный образ царской процессии.
theological_decisions:
- issue: Оценка притязаний Адонии
  choice: «стал превозносить себя»
  alternative: «стал выдвигать себя» / «возвеличивал себя»
  rationale: Перевод сохраняет заложенную в возвратном еврейском глаголе отрицательную оценку самовозвышения, но не добавляет прямого нравственного осуждения, которого в стихе нет.
- issue: Характер заявления Адонии
  choice: «Я буду царём»
  alternative: «Я буду царствовать»
  rationale: Оба варианта возможны для אֶמְלֹךְ. Выбранный вариант естественно передаёт его притязание на царский статус, а сноска сохраняет глагольную альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме: «Адония», «Аггифа». Маркер [b] поставлен после слов «Я буду царём», к которым относится его сноска, а не после слова «всадниками».'
