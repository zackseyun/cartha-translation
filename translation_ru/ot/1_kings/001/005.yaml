    issue: «Он обзавёлся» для וַיַּעַשׂ לוֹ
    rationale: Глагол עשה означает, что Адония устроил/подготовил для себя перечисленное; «обзавёлся» может означать только приобретение и не передаёт его организационное действие.
  - severity: low
    issue: «Стал превозносить себя»
    rationale: Перевод передаёт самовозвышение, но «стал» добавляет начинательность. Более нейтральное «возвысил себя» сохраняет рефлексивную направленность и не вносит аспектуального уточнения.
