  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: ru
  text: 'Ванея, сын Иодая, ответил царю: «Аминь! Так да скажет Яхве, Бог моего господина, царя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Аминь! Пусть так скажет Яхве, Бог моего господина, царя». Глагол «сказать» здесь может подразумевать подтверждение или утверждение высказанного царём решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Обычное повествовательное употребление глагола ענה при введении ответной реплики; по-русски естественно «ответил».
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Ванея, сын Иодая
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; патронимическая конструкция передана буквально.
- source_word: אֶת־הַמֶּלֶךְ
  choice: царю
  rationale: При русском глаголе «ответить» адресат естественно ставится в дательном падеже, хотя еврейская конструкция маркирует прямое дополнение.
- source_word: וַיֹּאמֶר
  choice: —
  rationale: Отдельное «и сказал» опущено как избыточное после «ответил»; содержание второго глагола естественно выражено введением прямой речи.
- source_word: אָמֵן
  choice: Аминь!
  rationale: Сохраняет узнаваемую формулу подтверждения и пожелания, а также её торжественную силу.
- source_word: כֵּן יֹאמַר
  choice: Да скажет так
  rationale: Имперфект в данном контексте имеет пожелательное значение; «да скажет» сохраняет его и не подменяет глагол «сказать» более толковательным эквивалентом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий титул.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  choice: Бог моего господина царя
  rationale: Сохранены конструкция принадлежности и почтительное придворное обозначение царя; русская фраза остаётся понятной без лишних слов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Смысл כֵּן יֹאמַר
  choice: Да скажет так
  alternative: Да подтвердит это / да определит так
  rationale: Выбрана более формальная передача, сохраняющая глагол «сказать» и возможную смысловую напряжённость между речью Бога и подтверждением царского решения; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным придворным регистром. Синтаксис сделан естественным для прямой речи, при этом сохранены «Аминь», имя «Яхве» и буквальная образность «да скажет так».
