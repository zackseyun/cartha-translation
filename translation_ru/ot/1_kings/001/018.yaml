  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: ru
  text: И вот, теперь Адония стал царём, а теперь ты, мой господин, царь, не знаешь об этом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт переход к главному сообщению; второе употребление естественно выражено союзом «а» без тяжеловесного повтора.
- source_word: הִנֵּה
  choice: смотри
  rationale: Сохраняет функцию привлечения внимания к неожиданному и срочному факту.
- source_word: אֲדֹנִיָּה מָלָךְ
  choice: Адония стал царём
  rationale: Перфект מָלָךְ в данном контексте сообщает о совершившемся воцарении; формулировка не решает вопрос законности этого воцарения.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохраняет почтительное обращение и порядок титулов, оставаясь понятным по-русски.
- source_word: לֹא יָדָעְתָּ
  choice: ты об этом не знаешь
  rationale: Прямо передаёт отрицание знания; «об этом» естественно указывает на только что названное событие.
theological_decisions:
- issue: Статус царствования Адонии
  choice: «стал царём»
  alternative: «воцарился» / «царствует»
  rationale: Передаёт заявление Вирсавии о фактическом событии, не утверждая его божественную или законную санкцию.
- issue: Обращение к Давиду на «ты»
  choice: «ты, господин мой царь»
  alternative: вежливое «вы»
  rationale: Древнееврейская форма единственного числа и современная библейская русская норма допускают «ты» при сохранении почтительности в титуле.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Двоеточие после «смотри» ясно вводит срочное сообщение; повтор וְעַתָּה слегка сглажен ради естественности, при этом противопоставление сохранено союзом «а».
