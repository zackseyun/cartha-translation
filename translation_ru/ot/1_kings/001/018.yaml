  naturalness: Фраза «господин мой царь» без пунктуационного или синтаксического оформления звучит по-русски неестественно. «Мой господин, царь» сохраняет титульное обращение и остаётся понятным в современном литературном библейском регистре. Повтор «теперь» оправдан повтором исходного текста и не нарушает естественности в эмоционально-срочной речи.
  terminology: «Адония» — нормативная русская передача имени. «Стал царём» точно сообщает о совершившемся фактическом воцарении, не вынося суждения о его законности. Обращение на «ты» соответствует единственному числу еврейского текста и не отменяет почтительности титула.
