  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: ru
  text: 'Ступай к царю Давиду и скажи ему: «Не ты ли, господин мой, царь, поклялся твоей рабыне[a]: „Соломон, сын твой, будет царствовать после меня и сядет на мой престол“? Почему же тогда Адония стал царём?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоей служанке». Еврейское слово имеет женскую форму и здесь служит почтительным самоназванием Вирсавии перед царём.'
    reason: Сохраняется женский род исходного слова и поясняется его придворное, самоуничижительное употребление.
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Ступай к
  rationale: Два повелительных глагола женского рода буквально означают «иди и войди». В русском «ступай к царю» естественно передаёт направленное и настойчивое повеление без неуклюжего повтора.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: к царю Давиду
  rationale: Естественная русская передача титула и имени в дательном падеже.
- source_word: הֲלֹא אַתָּה ... נִשְׁבַּעְתָּ
  choice: Не ты ли ... поклялся
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ, и подчёркнутое местоимение אַתָּה.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Почтительное придворное обращение к человеку; слово «Господь» здесь неуместно, поскольку речь не о божественном имени.
- source_word: לַאֲמָתְךָ
  choice: своей рабыне
  rationale: Существительное имеет женский род и служит почтительным самоуничижительным обозначением Вирсавии перед царём. Женский род сохранён явно.
- source_word: לֵאמֹר כִּי
  choice: 'поклялся ...:'
  rationale: Двоеточие естественно вводит содержание клятвы. Частица כִּי здесь вводит прямую речь и не требует добавления усилительного «непременно».
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Соломон, сын твой
  rationale: Сохранён порядок слов еврейского текста и торжественный характер формулы при помощи приложения.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: будет царствовать после меня
  rationale: Передаёт как царское правление, так и последовательность престолонаследия, не уточняя сверх текста способ вступления на престол.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: и сядет на мой престол
  rationale: Сохраняет образ престола и значение воцарения; отдельное местоимение опущено как избыточное в естественном русском синтаксисе.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָּהוּ
  choice: Почему же тогда Адония стал царём?
  rationale: «Же тогда» передаёт логическое противоречие между клятвой и совершившимся воцарением; совершенный вид отражает форму מָלַךְ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством придворной речи. Синтаксис сделан ясным для обычного читателя; инверсия «сын твой» сохранена внутри клятвы как умеренно торжественная, но понятная формула.
