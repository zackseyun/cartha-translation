revisions:
- from: И Вирсавия вошла к царю во внутреннюю комнату[a]. Царь был уже очень стар, а Ависага Сунамитянка прислуживала ему.
  to: И Вирсавия вошла к царю, в его покой[a]. Царь был очень стар, а Ависага Сунамитянка прислуживала ему.
  rationale: Заменено «во внутреннюю комнату» на «в его покой», чтобы передать חדר как частное помещение, не утверждая невыраженное уточнение «внутренний». Удалено «уже» как добавочный временной оттенок. Сноска сохранена и привязана к «покой» как допустимая лексико-синтаксическая альтернатива.
