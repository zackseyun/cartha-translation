base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: ru
  text: И Вирсавия вошла к царю, в его покой[a]. Царь был очень стар, а Ависага Сунамитянка прислуживала ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вошла в комнату, где находился царь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: вошла
  rationale: Форма wayyiqtol продвигает повествование; «вошла» естественно передаёт движение Вирсавии в помещение.
- source_word: בַת־שֶׁבַע
  choice: Вирсавия
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: אֶל־הַמֶּלֶךְ הַחַדְרָה
  choice: к царю во внутреннюю комнату
  rationale: אֶל указывает на движение к царю, а направительное ה в הַחַדְרָה — на вход в комнату. «Внутренняя комната» передаёт частный, удалённый характер помещения, не уточняя его назначение.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: Царь был уже очень стар
  rationale: Союз вводит фоновое пояснение; «уже» естественно подчёркивает достигнутую глубокую старость, выраженную זָקֵן מְאֹד.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: а Ависага Сунамитянка
  rationale: Имена и этникон переданы в формах, укоренившихся в русской библейской традиции; «а» естественно вводит сопутствующее обстоятельство.
- source_word: מְשָׁרַת אֶת־הַמֶּלֶךְ
  choice: прислуживала ему
  rationale: Причастие обозначает продолжающееся служение при царе; «прислуживала» соответствует придворно-бытовому контексту и избегает церковного оттенка слова «служила». Местоимение устраняет неестественный повтор слова «царь».
