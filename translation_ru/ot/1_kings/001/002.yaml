base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: ru
  text: 'И сказали ему его слуги: «Пусть для господина моего, царя, поищут молодую девушку, девственницу; пусть она прислуживает царю и ухаживает за ним[a], и пусть ляжет к тебе на грудь[b], чтобы господину моему, царю, было тепло».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое еврейское слово, переведённое как «ухаживает за ним», может также означать «прислуживает ему» или «заботится о нём».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у тебя на груди»; возможны также значения «у тебя на лоне» или «в твоих объятиях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В контексте царского двора слово обозначает состоящих при царе слуг или придворных; «слуги» естественно и не утверждает без необходимости рабский статус.
- source_word: יְבַקְשׁוּ
  choice: пусть ... поищут
  rationale: Сохранена активная форма 3-го лица множественного числа с побудительным оттенком, а не безличное «пусть найдут» или «давайте поищем».
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: для господина моего, царя
  rationale: Передаёт почтительную придворную формулу с притяжательным «моего» и приложением «царя».
- source_word: נַעֲרָה בְתוּלָה
  choice: молодую девственницу
  rationale: «Молодую» передаёт נַעֲרָה, а «девственницу» — בְתוּלָה; по-русски сочетание звучит естественно и сохраняет оба смысловых компонента.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: пусть она прислуживает царю
  rationale: Буквально «пусть стоит перед царём», но в придворном контексте оборот означает служение при ком-либо; «прислуживает» ясно передаёт эту функцию.
- source_word: סֹכֶנֶת
  choice: ухаживает за ним
  rationale: Редкое слово обозначает женщину, заботящуюся о другом или состоящую при нём; глагольная передача естественна по-русски и не вносит отсутствующего в слове сексуального смысла.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: пусть ложится к тебе на грудь
  rationale: חֵיק обозначает грудь, лоно или объятия; «на грудь» сохраняет телесный образ и близость, необходимую для согревания.
- source_word: וְחַם
  choice: чтобы ... согревался
  rationale: Передан оттенок цели или предполагаемого результата; несовершенный вид уместен для продолжающегося согревания царя.
