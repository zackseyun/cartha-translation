source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁשׁ מֵא֣וֹת זָהָ֔ב יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: ru
  text: Царь Соломон сделал двести больших щитов[a] из кованого золота; на каждый щит пошло по шестьсот шекелей[b] золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово здесь обозначает большой щит, вероятно отличавшийся от меньших щитов, упомянутых в следующем стихе.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шестьсот золота приходилось на один щит»; единица веса «шекель» подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение глагола עשה в данном контексте — изготовить предметы; «сделал» естественно и ясно по-русски.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Естественная русская форма сочетания титула и имени.
- source_word: מָאתַיִם
  choice: двести
  rationale: Прямая передача количественного числительного.
- source_word: צִנָּה
  choice: больших щитов
  rationale: צִנָּה обозначает крупный щит и, вероятно, противопоставлено иному виду щита в следующем стихе.
- source_word: זָהָב שָׁחוּט
  choice: кованого золота
  rationale: שָׁחוּט описывает золото, обработанное ударами, то есть раскованное или расплющенное; «кованое золото» кратко и естественно передаёт способ обработки.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: шестьсот шекелей золота
  rationale: Единица веса в еврейском тексте не названа, но подразумевается; «шекелей» добавлено для ясности и отмечено сноской.
- source_word: יַעֲלֶה עַל
  choice: пошло на
  rationale: Буквально «поднималось/приходилось на»; русское «пошло на» естественно выражает количество материала, употреблённого для каждого щита.
- source_word: הַצִּנָּה הָאֶחָת
  choice: на каждый щит
  rationale: Буквальное «на один щит» имеет распределительное значение применительно ко всем двумстам щитам.
