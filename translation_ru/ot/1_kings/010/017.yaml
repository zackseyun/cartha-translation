  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: ru
  text: 'И триста щитов из кованого золота[a]: на каждый щит пошло по три мины золота[b]. Царь поместил их в Доме Ливанского леса[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из чеканного золота»; золото было расковано в тонкие листы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «три мины золота поднимались на один щит», то есть столько золота наносили на каждый щит.'
    reason: lexical_alternative
  - marker: c
    text: Дом Ливанского леса — название царского здания в дворцовом комплексе Соломона (см. 3 Цар. 7:2).
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: щитов
  rationale: מָגֵן обозначает большой защитный щит и здесь отличается от меньшего вида щитов в предыдущем стихе. Современное русское «щит» передаёт значение естественно.
- source_word: זָהָב שָׁחוּט
  choice: кованого золота
  rationale: שָׁחוּט описывает золото, обработанное ударами и превращённое в тонкие листы; «кованое золото» кратко и понятно передаёт способ обработки.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: три мины
  rationale: מָנֶה — древняя единица веса. Форма «мина» закреплена в современном русском употреблении и не подменяет меру приблизительным пересчётом.
- source_word: יַעֲלֶה עַל
  choice: пошло
  rationale: Буквально золото «поднималось на» щит; в данном контексте оборот обозначает количество золота, нанесённого на каждый щит. Русское «пошло» сохраняет идею расхода материала без утверждения, что щит был целиком золотым.
- source_word: הַמָּגֵן הָאֶחָת
  choice: на каждый щит
  rationale: Формально стоит единственное число «на один щит», но конструкция имеет распределительное значение; по-русски это естественно передаётся словами «на каждый щит».
- source_word: וַיִּתְּנֵם
  choice: поместил их
  rationale: נתן здесь означает размещение предметов в определённом месте. «Поместил» соответствует контексту и литературному регистру.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: в доме «Ливанский лес»
  rationale: Это собственное название царского здания. «Дом» прямо передаёт בֵּית, а кавычки ясно показывают, что «Ливанский лес» — название, а не указание на расположение здания в лесу.
