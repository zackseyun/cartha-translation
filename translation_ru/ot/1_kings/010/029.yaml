base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: ru
  text: Колесницу доставляли из Египта за шестьсот шекелей серебра, а коня — за сто пятьдесят[a]. Таким же образом через их посредство поставляли колесницы и коней всем хеттским царям и царям Арама[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть за сто пятьдесят шекелей серебра.
    reason: В еврейском тексте денежная единица и слово «серебро» во второй цене подразумеваются из первой части предложения.
  - marker: c
    text: 'То есть арамейских царей; традиционно: «царей Сирии».'
    reason: Поясняется историческое название Арам и его традиционный эквивалент.
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא ... מִמִּצְרַיִם
  choice: доставляли из Египта
  rationale: Буквально употреблены глаголы движения «поднималась и выходила», но в данном торговом контексте они описывают доставку товара из Египта. Несовершенный вид передаёт обычную торговую практику.
- source_word: מֶרְכָּבָה
  choice: колесницу
  rationale: Обычное значение существительного — «колесница»; единственное число обозначает одну единицу товара, для которой названа цена.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: за шестьсот шекелей серебра
  rationale: В еврейском тексте буквально «за шестьсот серебра»; слово «шекелей» восполняет подразумеваемую весовую денежную единицу, а «серебра» сохраняет явно названный материал.
- source_word: וְסוּס
  choice: а коня
  rationale: Передано основное значение «конь» без более узкого уточнения «боевой конь», которого нет в исходном тексте.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  choice: за сто пятьдесят
  rationale: Названа цена одного коня; порядок числительных изменён в соответствии с нормами русского языка.
- source_word: וְכֵן
  choice: так же
  rationale: Выражение связывает названную торговую операцию с дальнейшими поставками другим царям.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: для всех хеттских царей
  rationale: Предлог обозначает получателей либо заказчиков товара; «для» естественно передаёт эту связь по-русски.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: и царей Арама
  rationale: Сохранено собственное имя Арам, а не традиционная, но менее точная замена «Сирия».
- source_word: בְּיָדָם
  choice: через них
  rationale: Буквально «их рукой» — еврейская идиома посредничества или агентности. «Через них» естественно сохраняет местоименную отсылку, не вводя в текст прямо не названных здесь лиц.
- source_word: יֹצִאוּ
  choice: вывозили
  rationale: Каузативная форма означает «выводили, вывозили»; в торговом контексте речь идёт о последующей отправке товара другим правителям.
- source_word: implicit object of יֹצִאוּ
  choice: колесницы и коней
  rationale: Объект глагола подразумевается из первой части стиха; его повтор делает русский текст ясным и не меняет предмет сообщения.
