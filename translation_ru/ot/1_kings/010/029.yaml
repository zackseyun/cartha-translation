revisions:
- from: Колесницу доставляли из Египта за шестьсот шекелей серебра, а коня — за сто пятьдесят[a]. Так же через них[b] вывозили колесницы и коней для всех хеттских царей и царей Арама[c].
  to: Колесницу доставляли из Египта за шестьсот шекелей серебра, а коня — за сто пятьдесят[a]. Таким же образом через их посредство поставляли колесницы и коней всем хеттским царям и царям Арама[c].
  rationale: Исправлена неестественная и потенциально неверно понимаемая русская местоименная связь. Перевод сохраняет коммерческий смысл глаголов движения, подразумеваемый объект «колесницы и кони», название «Арам» и не разрешает контекстуально спорную отсылку суффикса в בְּיָדָם. Сноска b сохранена как необходимая для этой идиомы, хотя её маркер в данном стихе не обязателен в основном тексте.
