  terminology: '«Царица Савская», «царь Соломон» и «слуги» уместны. Сноску следует привести в соответствие с уточнённым основным текстом: буквальный образ «рука» поясняется как средства, возможности или щедрость, без утверждения, что это исключительно щедрость.'
