  source_fidelity: 'Основной смысл передан верно: Соломон удовлетворил просьбы царицы Савской помимо иных даров, после чего она возвратилась в свою страну со своими слугами. Однако «по царской щедрости Соломона» сужает еврейскую идиому כְּיַד до щедрости, тогда как она указывает прежде всего на средства, возможности или меру царского дара. Кроме того, опущен первый из двух последовательных глаголов וַתֵּפֶן וַתֵּלֶךְ («повернула/обратилась и пошла»).'
