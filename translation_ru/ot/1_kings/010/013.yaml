base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: ru
  text: И царь Соломон дал царице Савской всё, чего она желала и о чём просила, сверх того, что он дал ей согласно средствам царя Соломона[a]. Затем она повернула и отправилась в свою страну вместе со своими слугами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по руке царя Соломона»; еврейская идиома может означать сообразно его средствам, возможностям или щедрости.'
    reason: Сохраняет буквальный образ еврейской идиомы и поясняет её диапазон, не сводя значение только к щедрости.
lexical_decisions:
- source_word: מַלְכַּת שְׁבָא
  choice: царице Савской
  rationale: Традиционная и естественная русская передача титула и географического имени в косвенном падеже.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: всё, чего она желала и о чём просила
  rationale: 'Сохраняет оба близких, но не тождественных элемента: её желание и высказанную просьбу.'
- source_word: מִלְּבַד
  choice: сверх того
  rationale: 'В данном контексте обозначает добавление: просимое было дано помимо других царских даров.'
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: по царской щедрости Соломона
  rationale: Передаёт идиому «по руке царя Соломона» как указание на его возможности и щедрость, сохраняя связь с царским статусом.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: она отправилась в свою страну
  rationale: Два последовательных еврейских глагола образуют естественное описание отбытия; буквальное «повернулась и пошла» по-русски звучало бы неестественно и могло бы создать ложный зрительный образ.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: вместе со своими слугами
  rationale: Естественно передаёт сопровождавших царицу людей; «слуги» сохраняет широкое значение עֲבָדִים без ненужного уточнения их социального положения.
theological_decisions:
- issue: Значение идиомы כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: по царской щедрости Соломона
  alternative: по руке царя Соломона; сообразно возможностям царя Соломона
  rationale: Идиома допускает оттенки возможностей, достатка и щедрости. Основной текст передаёт наиболее естественный контекстуальный смысл, а примечание сохраняет буквальный образ и диапазон значения.
- issue: Социальное значение עֲבָדֶיהָ
  choice: своими слугами
  alternative: своими придворными; своими рабами
  rationale: Контекст говорит о свите царицы, не определяя точнее правовое положение этих людей; нейтральное «слуги» не усиливает исходный текст.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён там, где буквальное воспроизведение еврейской последовательности было бы неестественным, но смысловые компоненты и идиоматическая неоднозначность сохранены.
