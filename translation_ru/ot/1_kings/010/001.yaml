  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: ru
  text: Царица Савская услышала о славе Соломона, связанной с именем Яхве[a], и пришла испытать его загадками[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вести о Соломоне в связи с именем Яхве». Еврейское выражение кратко и допускает разные оттенки: известность Соломона могла быть связана с именем Яхве или с его репутацией.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трудными вопросами». Буквально еврейское слово означает «загадки» или «тайные изречения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: Царица Савская
  rationale: Сочетание с формой принадлежности естественно передаётся традиционным русским названием «царица Савская»; начальный союз ו не выражен отдельно, поскольку стих открывает новый эпизод и в современном русском не требует союза.
- source_word: שֹׁמַעַת
  choice: услышала
  rationale: Причастие в повествовательном контексте передаёт фоновое событие, послужившее причиной последующего прихода; совершенный вид естественен по-русски.
- source_word: אֶת שֵׁמַע שְׁלֹמֹה
  choice: о славе Соломона
  rationale: שֵׁמַע может обозначать молву, известность или дошедшую весть. «Слава Соломона» кратко и естественно передаёт здесь его широко распространившуюся известность.
- source_word: לְשֵׁם יְהוָה
  choice: связанной с именем Яхве
  rationale: Компактная и неоднозначная конструкция указывает на связь славы Соломона с именем Яхве, не уточняя однозначно причинное, целевое или тематическое отношение; примечание сохраняет более буквальную альтернативу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяется титулом.
- source_word: וַתָּבֹא
  choice: и пришла
  rationale: Последовательная глагольная форма продвигает повествование; союз «и» естественно связывает действия.
- source_word: לְנַסֹּתוֹ
  choice: испытать его
  rationale: נסה означает проверять или испытывать; здесь речь идёт о проверке мудрости Соломона.
- source_word: בְּחִידוֹת
  choice: загадками
  rationale: חִידוֹת буквально обозначает загадки или иносказательные, трудноразрешимые высказывания; «загадками» сохраняет конкретный образ исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Связь славы Соломона с именем Яхве
  choice: «славе Соломона, связанной с именем Яхве»
  alternative: «вести о Соломоне в связи с именем Яхве»
  rationale: Предлог לְ допускает несколько оттенков отношения. Основной текст ясно передаёт связь, но не определяет её как причину или цель, а примечание сохраняет более формальную формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционное «царица Савская» оставлено ради естественности и узнаваемости; синтаксическая неоднозначность לְשֵׁם не устранена причинным толкованием.
