base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: ru
  text: Царь сделал так, что серебро в Иерусалиме стало столь же обычным, как камни, а кедры — столь же многочисленными, как сикоморы[b] в Шефеле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в низменности». Шефела — область предгорий Иудеи между горной страной и прибрежной равниной.'
    reason: cultural_note
  - marker: b
    text: То есть сикоморовые смоковницы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: сделал так, что… стало / стали
  rationale: 'В данном контексте נתן выражает результативно-каузативный смысл: царь довёл количество серебра и кедров до чрезвычайного изобилия. Такая передача естественна по-русски и сохраняет действие царя как причину.'
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранено нарицательное обозначение исходного текста; имя Соломона ясно из контекста, но в самом стихе не названо.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: Массовое существительное передаёт серебро как драгоценный металл и товар вообще.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямая передача местного значения.
- source_word: כָּאֲבָנִים
  choice: столь же обычным, как камни
  rationale: Сравнительная частица כ сохранена; формулировка передаёт мысль о том, что серебро стало чрезвычайно распространённым.
- source_word: הָאֲרָזִים
  choice: кедры
  rationale: Сохранено общее обозначение кедров; контекст может подразумевать также кедровую древесину, но исходный текст прямо этого не уточняет.
- source_word: כַּשִּׁקְמִים
  choice: как сикоморы
  rationale: שקמים обозначает сикоморы, то есть сикоморовые смоковницы; краткий ботанический термин сохраняет точность, а пояснение вынесено в сноску.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: в Шефеле
  rationale: Шефела — название конкретной географической области Иудеи. Транслитерация сохраняет топоним, а его значение поясняется в сноске.
- source_word: לָרֹב
  choice: столь же многочисленными
  rationale: Выражение указывает на большое количество и естественно завершает сравнительную конструкцию о кедрах.
