  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: ru
  text: пищу на его столе, рассадку его слуг, то, как стояли его служители, и их одежды, его виночерпиев и всесожжение[a], которое он возносил в доме Яхве, — у неё перехватило дыхание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его восхождение к дому Яхве»; возможно, имеется в виду лестница, по которой он поднимался, или торжественное восхождение.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: еду на его столе
  rationale: Передаёт конкретное значение «пища, еда» и естественно описывает увиденное царицей.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: места его слуг
  rationale: מוֹשָׁב может означать сидение, место или расположение; «места» сохраняет пространственный смысл и подходит к описанию упорядоченного двора.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: строй его служителей
  rationale: מַעֲמָד связано со стоянием и установленным расположением; «строй» передаёт их организованное присутствие при дворе, не сводя выражение только к службе.
- source_word: מְשָׁרְתָיו
  choice: служителей
  rationale: Отличает официальных придворных служителей от более общего עֲבָדָיו «слуг».
- source_word: מַלְבֻּשֵׁיהֶם
  choice: их одежды
  rationale: Прямой и естественный современный эквивалент обозначения одежды и облачения.
- source_word: מַשְׁקָיו
  choice: его виночерпиев
  rationale: В придворном контексте форма обозначает служащих, подающих напитки; «виночерпии» — точный и узнаваемый русский термин.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: всесожжение, которое он возносил в доме Яхве
  rationale: Следует масоретской огласовке עֹלָה «всесожжение» и сохраняет игру корня עלה в сочетании с глаголом «возносил»; иное возможное чтение вынесено в сноску.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт тетраграмматон личным именем «Яхве».
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: у неё дух захватило
  rationale: Естественная русская идиома, сохраняющая связь רוּחַ с дыханием и передающая потрясение без избыточного объяснения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; «Яхве» передаёт его как личное заветное имя и согласуется с указанным решением консультационного слоя.
- issue: Толкование עֹלָתוֹ в перечне
  choice: его всесожжение
  alternative: его восхождение; лестница, по которой он поднимался в дом Яхве
  rationale: Основной текст следует масоретской огласовке «всесожжение», но реальная неоднозначность согласного текста сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Синтаксис сохраняет перечисление исходного контекста; выражение «дух захватило» понятно современному читателю и удерживает древнееврейский образ дыхания.
