  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: ru
  text: Все сосуды для питья царя Соломона были золотыми, и все сосуды в Доме Ливанского леса — из чистого золота.[a] Серебро во дни Соломона не считалось чем-либо ценным.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из очищенного золота».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «серебро во дни Соломона не считалось ни за что».'
    reason: source_idiom
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: сосуды для питья
  rationale: Сочетание обозначает различные предметы, предназначенные для питья; «сосуды» сохраняет широту כְּלֵי и не сужает значение до одних чаш или кубков.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: дом Ливанского леса
  rationale: Сохранено близкое к еврейскому наименование конкретного царского здания; слово «дворец» было бы более толковательным.
- source_word: זָהָב סָגוּר
  choice: чистое золото
  rationale: Сочетание указывает на золото высокого качества, вероятно очищенное; «чистое золото» естественно по-русски и не приписывает материалу непременно цельную, а не покрытую золотом конструкцию.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: не считалось чем-либо ценным
  rationale: 'Передаёт оценочный смысл формы от חשׁב и идиому «не считалось ни за что»: речь идёт не об отсутствии серебра, а о его незначительности на фоне изобилия.'
- source_word: בִּימֵי שְׁלֹמֹה
  choice: во дни Соломона
  rationale: Традиционная, понятная и уместная для исторического повествования передача временного выражения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным оттенком. Название царского здания передано близко к форме оригинала; неестественная при буквальном переводе еврейская идиома раскрыта в основном тексте, а её форма приведена в сноске.
