base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: ru
  text: Кроме того, корабль Хирама[a], который доставлял золото из Офира, привёз из Офира древесину алмуг в очень большом количестве и драгоценные камни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «флот Хирама»: еврейское существительное стоит в единственном числе, но может иметь собирательное значение и обозначать морские суда Хирама в целом.'
    reason: lexical_alternative
  - marker: b
    text: Точная порода дерева неизвестна; название также передают как «алгум».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Кроме того
  rationale: Передаёт добавочное значение оборота и естественно связывает стих с предшествующим повествованием.
- source_word: אֳנִי חִירָם
  choice: корабль Хирама
  rationale: Сохраняет грамматическое единственное число еврейского существительного, не исключая его возможного собирательного значения; эта неоднозначность отмечена в сноске.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: который доставлял золото
  rationale: Глагол נָשָׂא означает «нести, перевозить»; «доставлял» естественно описывает морскую перевозку и согласуется с повествовательным контекстом.
- source_word: מֵאוֹפִיר
  choice: из Офира
  rationale: Передаёт предлог направления от исходного места и общепринятую русскую форму топонима.
- source_word: הֵבִיא
  choice: привёз
  rationale: Естественно передаёт каузативное значение глагола בוא в контексте доставки груза морским путём.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: древесины алмуг
  rationale: Транслитерация сохраняет название неизвестной в точности породы дерева и не навязывает спорную ботаническую идентификацию.
- source_word: הַרְבֵּה מְאֹד
  choice: великое множество
  rationale: Передаёт усиленное указание на чрезвычайно большое количество и естественно сочетается с древесиной и камнями как совокупным грузом.
- source_word: וְאֶבֶן יְקָרָה
  choice: и драгоценных камней
  rationale: Формально единственное число в еврейском может иметь собирательное значение; русский множественный родительный естественен в перечне большого количества груза.
