    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: ответил
  rationale: Хотя глагол обычно означает «сказать, сообщить», здесь он описывает ответ Соломона на трудные вопросы царицы (ст. 1), поэтому «ответил» естественно передаёт контекстуальный смысл.
- source_word: דְּבָרֶיהָ
  choice: все её вопросы
  rationale: Слово דָּבָר широко по значению («слово, дело, вопрос»); в данном контексте речь идёт о трудных вопросах, которыми царица испытывала Соломона.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם מִן־הַמֶּלֶךְ
  choice: не было ничего сокрытого от царя
  rationale: Формулировка сохраняет образ еврейского текста и указание на царя, оставаясь естественной для современного литературного русского языка.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: чего он не мог бы ей объяснить
  rationale: Относительное придаточное выражает, что ни один вопрос не оказался за пределами понимания Соломона и не остался без разъяснения; модальная конструкция естественно передаёт смысл всего предложения.
