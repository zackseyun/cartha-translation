source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: ru
  text: Царь сделал из алмугового дерева[a] опоры[b] для дома Яхве и для дома царя, а также лиры и арфы для певцов. Никогда прежде такого алмугового дерева не привозили, и до сего дня подобного не видели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алгумового дерева». В параллельной традиции это название встречается в ином написании.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «опоры», встречается редко; оно может обозначать такие архитектурные элементы, как ступени или перила.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: алмуговое дерево
  rationale: Порода ценного привозного дерева точно не установлена, поэтому сохранено транслитерированное традиционное название без предположительной ботанической идентификации.
- source_word: מִסְעָד
  choice: опоры
  rationale: Редкое существительное с не вполне ясным значением. «Опоры» передаёт вероятную архитектурную функцию, не сужая смысл до ступеней или перил.
- source_word: לְבֵית יְהוָה
  choice: для дома Яхве
  rationale: Сохранён параллелизм с «домом царя» и древнееврейский образ дома как святилища.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном в исходном тексте.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: и для дома царя
  rationale: Формально сохраняет лексический и синтаксический параллелизм с «домом Яхве»; по смыслу речь идёт о царском дворце.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: лиры и арфы
  rationale: Использованы два разных современных названия струнных инструментов, чтобы не смешивать обозначенные в еврейском тексте виды, точная конструкция которых неизвестна.
- source_word: לַשָּׁרִים
  choice: для певцов
  rationale: Причастная форма от שׁיר указывает именно на поющих, а не на музыкантов вообще.
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: Никогда прежде такого алмугового дерева не привозили
  rationale: Идиоматически передаёт мысль о беспрецедентном поступлении привозной древесины; «привозили» проясняет подразумеваемое прибытие товара, не меняя смысла.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: и до сего дня подобного не видели
  rationale: Сохраняет повествовательную точку отсчёта и продолжительное действие отрицания до времени автора.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение выражения בֵית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: «Дом» сохраняет исходную метафору и параллелизм с «домом царя», при этом в контексте ясно, что речь идёт о храме.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для широкого читателя; сохранены ключевой параллелизм «дом Яхве — дом царя» и неопределённость редких названий древесины и архитектурного элемента.
