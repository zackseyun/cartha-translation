  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: ru
  text: И вся земля искала встречи с Соломоном[a], чтобы услышать его мудрость, которую Бог вложил в его сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искала лица Соломона» — древнееврейский оборот со значением «искала встречи с Соломоном» или «добивалась приёма у него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: И вся земля
  rationale: Сохранён широкий собирательный и гиперболический оборот древнееврейского текста; здесь речь идёт о народах известного мира, а не только о земле Израиля.
- source_word: מְבַקְשִׁים
  choice: искала
  rationale: Причастная форма описывает продолжительное или обычное действие; русское прошедшее несовершенного вида естественно передаёт этот обобщающий повествовательный смысл.
- source_word: אֶת פְּנֵי שְׁלֹמֹה
  choice: встречи с Соломоном
  rationale: Буквально «лица Соломона»; идиома означает стремление предстать перед царём, получить доступ к нему или быть принятым им. Основной текст передаёт смысл естественно, а образ отмечен в сноске.
- source_word: לִשְׁמֹעַ
  choice: чтобы услышать
  rationale: Инфинитив выражает цель; «услышать» прямо передаёт древнееврейский глагол и естественно сочетается с мудростью как содержанием речи Соломона.
- source_word: חָכְמָתוֹ
  choice: его мудрость
  rationale: Притяжательная конструкция точно соответствует древнееврейскому суффиксу и сохраняет акцент на дарованной Соломону мудрости.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: которую Бог вложил
  rationale: Глагол נָתַן буквально значит «дал», но в сочетании с «в сердце» по-русски естественно «вложил»; прошедшее время указывает, что Бог даровал мудрость прежде, чем люди приходили её услышать.
- source_word: בְּלִבּוֹ
  choice: в его сердце
  rationale: Сохраняется древнееврейское представление о сердце как средоточии мысли, воли и внутренней жизни; замена на «разум» неоправданно сузила бы смысл.
theological_decisions:
- issue: Передача אֱלֹהִים при отсутствии имени יהוה
  choice: Бог
  alternative: Господь
  rationale: В стихе стоит אֱלֹהִים, а не имя יהוה; «Бог» сохраняет лексическое различие исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «вся земля» намеренно сохраняет образ и гиперболу оригинала; идиома о поиске лица раскрыта естественным русским выражением и пояснена в сноске.
