base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: ru
  text: Да будет благословен Яхве, твой Бог, который благоволил к тебе, чтобы возвести тебя на престол Израиля! По вечной любви Яхве к Израилю[а] Он поставил тебя царём, чтобы творить суд и правду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «Потому что Яхве любит Израиль вовек». Еврейское выражение буквально говорит о любви Яхве к Израилю вовек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Да будет благословен
  rationale: Юссивная конструкция с причастием выражает благословение; эта формула сохраняет желательное значение и звучит естественно и торжественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: который благоволил к тебе
  rationale: Глагол חפץ с предлогом ב обозначает расположение, удовольствие и благоволение к человеку; выбранный вариант уместен в речи о Божьем избрании царя.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: и посадил тебя на престол Израиля
  rationale: Конструкция описывает возведение на царский престол. Союз «и» естественно передаёт результат Божьего благоволения, выраженный целевым инфинитивом.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: По вечной любви Яхве к Израилю
  rationale: Сохраняет именную форму אַהֲבָה и причинно-оснóвное значение предлога ב, не превращая неоднозначную конструкцию в более определённое глагольное утверждение.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: Он поставил тебя царём
  rationale: שׂים с ל выражает назначение на должность или положение; «поставил царём» точно и естественно передаёт смысл.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: чтобы творить суд и правду
  rationale: 'Сохраняет конкретную царскую обязанность и традиционную смысловую пару: справедливое судебное управление и праведный общественный порядок.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Значение בְּאַהֲבַת יְהוָה
  choice: По вечной любви Яхве к Израилю
  alternative: Поскольку Яхве вечно любит Израиль
  rationale: Именная формулировка ближе к еврейской конструкции и сохраняет возможный оттенок основания или причины, не уточняя без необходимости временной характер любви.
- issue: Пара מִשְׁפָּט וּצְדָקָה
  choice: суд и правда
  alternative: правосудие и справедливость
  rationale: Выбранная пара сохраняет различие двух еврейских понятий и библейскую царскую формулу, не сводя оба слова к почти одинаковым современным юридическим терминам.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис остаётся ясным для обычного читателя; традиционные выражения «престол», «поставил царём», «творить суд и правду» сохранены там, где они точно передают царско-судебный контекст.
