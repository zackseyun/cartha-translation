lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Когда … увидела
  rationale: Вав-последовательный продвигает повествование, а придаточное с «когда» естественно передаёт синтаксическую связь с продолжением предложения в следующем стихе.
- source_word: מַלְכַּת שְׁבָא
  choice: царица Савская
  rationale: Таково традиционное и естественное русское обозначение правительницы Савы; оно точно передаёт еврейскую сопряжённую конструкцию.
- source_word: אֵת
  choice: не переводится отдельно
  rationale: Служебная частица обозначает определённое прямое дополнение и не имеет самостоятельного соответствия в русском языке.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: всю мудрость Соломона
  rationale: Передаёт полноту, выраженную כָּל, и сохраняет естественную для русского языка родительную конструкцию.
- source_word: וְהַבַּיִת
  choice: и дом
  rationale: «Дом» — прямое значение בַּיִת. В данном царском контексте слово может обозначать дворец, поэтому контекстуальный вариант вынесен в сноску.
- source_word: אֲשֶׁר בָּנָה
  choice: который он построил
  rationale: Относительное придаточное относится к «дому»; совершенный вид естественно указывает на уже завершённое строительство.
