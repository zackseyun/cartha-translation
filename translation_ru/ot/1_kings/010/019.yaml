  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: ru
  text: К престолу вели шесть ступеней; позади него находилась закруглённая верхняя часть; по обе стороны от сиденья были подлокотники, а возле подлокотников стояли два льва.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲלוֹת לַכִּסֵּה
  choice: к престолу вели шесть ступеней
  rationale: В описании престола מַעֲלוֹת обозначает ступени, по которым к нему поднимались. Такая конструкция естественно передаёт значение לַכִּסֵּה, не превращая его буквально в неясное «шесть ступеней для престола».
- source_word: רֹאשׁ עָגֹל
  choice: закруглённый верх
  rationale: Буквально «круглая голова/верхняя часть». Контекст предмета мебели указывает на верхнюю часть престола, но не требует более узкого значения «подголовник».
- source_word: מֵאַחֲרָיו
  choice: сзади у престола
  rationale: Локативное выражение указывает, что закруглённая верхняя часть находилась с задней стороны престола.
- source_word: יָדֹת
  choice: подлокотники
  rationale: Хотя слово связано со значением «руки», в контексте престола оно обозначает его боковые опоры для рук.
- source_word: מִזֶּה וּמִזֶּה אֶל מְקוֹם הַשָּׁבֶת
  choice: по обе стороны от сиденья
  rationale: Передано функциональное расположение подлокотников относительно буквально названного «места сидения».
- source_word: אֲרָיוֹת עֹמְדִים
  choice: стояли два льва
  rationale: Причастие описывает неподвижно стоящие изображения львов; русский порядок слов сохраняет наглядность описания.
- source_word: אֵצֶל הַיָּדוֹת
  choice: возле подлокотников
  rationale: Передаёт расположение львов рядом с теми же боковыми частями престола и сохраняет терминологическую последовательность.
