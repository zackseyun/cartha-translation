  source_fidelity: 'В целом переданы все элементы еврейского описания: шесть ступеней, округлая верхняя часть сзади, подлокотники по обеим сторонам сиденья и два льва возле них. Однако оборот «сзади у престола» в русском может звучать как расположение отдельного предмета рядом с престолом и недостаточно ясно воспроизводит מֵאַחֲרָיו («позади него / с его задней стороны»).'
