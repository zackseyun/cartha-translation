  text: וַ/תִּתֵּ֨ן לַ/מֶּ֜לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב וּ/בְשָׂמִ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה לֹא בָא֩ כַ/בֹּ֨שֶׂם הַ/ה֥וּא עוֹד֙ לָ/רֹ֔ב אֲשֶׁר נָתְנָ֥ה מַֽלְכַּת שְׁבָ֖א לַ/מֶּ֥לֶךְ שְׁלֹמֹֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: ru
  text: И она дала царю сто двадцать талантов золота[a], великое множество благовоний и драгоценные камни. Никогда больше не поступало столько благовоний, сколько царица Савская дала царю Соломону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — древняя мера веса; его точная величина могла различаться, поэтому современный пересчёт здесь не приводится.
    reason: ancient_measure
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: И дала она
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; русский порядок слов сохраняет связность и ясно указывает на царицу Савскую.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: сто двадцать талантов золота
  rationale: כִּכָּר обозначает древнюю меру веса; традиционное «талант» сохраняет историческую единицу без приблизительного пересчёта.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: великое множество благовоний
  rationale: בְשָׂמִים означает ароматические вещества, пряности или благовонные составы; контекст царского дара и усиление הַרְבֵּה מְאֹד естественно переданы как «великое множество благовоний».
- source_word: וְאֶבֶן יְקָרָה
  choice: и драгоценные камни
  rationale: Единственное число אֶבֶן, вероятно, употреблено собирательно в перечне даров, поэтому по-русски естественно множественное число.
- source_word: לֹא בָא ... עוֹד
  choice: Никогда больше не доставляли
  rationale: Сочетание отрицания с עוֹד выражает «больше не»; בוא в контексте товаров означает их прибытие или доставку. Неопределённо-личная конструкция звучит естественно и не вводит названного в тексте деятеля.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: такого множества благовоний
  rationale: Формально בֹּשֶׂם стоит в единственном числе, но здесь имеет родовое или собирательное значение; לָרֹב подчёркивает исключительное количество.
- source_word: מַלְכַּת שְׁבָא
  choice: царица Савская
  rationale: Это закрепившаяся и естественная русская форма титула и географического определения.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: царю Соломону
  rationale: Русский дательный падеж естественно передаёт адресата дара, а сочетание титула с именем соответствует нормальному литературному употреблению.
