  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ru
  text: Соломон собрал колесницы и всадников[a]. У него было тысяча четыреста колесниц и двенадцать тысяч всадников. Он разместил их в колесничных городах и при царе в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конницу»; еврейское слово буквально обозначает всадников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол обозначает собирание или накопление военных сил; «собрал» естественно и точно передаёт смысл.
- source_word: רֶכֶב
  choice: колесницы
  rationale: Собирательное существительное обозначает колесницы или колесничное войско; при последующем числительном конкретное множественное число наиболее ясно.
- source_word: פָרָשִׁים
  choice: всадники
  rationale: Слово прежде всего обозначает людей, едущих верхом; «всадники» сохраняет конкретный лексический смысл, не превращая его в более отвлечённое «конница».
- source_word: וַיְהִי לוֹ
  choice: у него было
  rationale: Обычная древнееврейская конструкция обладания естественно передаётся по-русски оборотом «у него было».
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: тысяча четыреста колесниц
  rationale: Число и предмет счёта переданы прямо и в нормативной русской форме.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: двенадцать тысяч всадников
  rationale: Прямой перевод числительного с последовательной передачей פָרָשִׁים как «всадники».
- source_word: וַיַּנְחֵם
  choice: он разместил их
  rationale: Каузативная форма глагола נוח здесь означает поместить или расположить; «разместил» подходит к распределению военных сил и не предполагает более узкой детали, чем исходный текст.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: в колесничных городах
  rationale: Кратко передаёт обозначение городов, предназначенных для содержания колесниц и связанных с колесничными силами.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: и при царе в Иерусалиме
  rationale: «При царе» естественно выражает нахождение части сил вместе с царём, не добавляя отсутствующего в тексте указания на точную долю.
