  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: ru
  text: Вес золота, поступавшего Соломону за один год, составлял шестьсот шестьдесят шесть талантов золота.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная древняя единица веса; здесь годовое количество приведено в древних мерах без пересчёта в современные единицы.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: составлял
  rationale: Глагольная форма вводит повествовательное сообщение; в русском учётном контексте связка «составлял» естественно соединяет показатель веса с его числовым значением без лишнего вводного оборота.
- source_word: מִשְׁקַל
  choice: вес
  rationale: Существительное прямо обозначает вес или меру по весу; «вес» точно и естественно передаёт смысл.
- source_word: הַזָּהָב ... זָהָב
  choice: золота ... золота
  rationale: Первое употребление называет взвешиваемый металл, второе уточняет, что таланты являются мерой золота; повтор сохранён вслед за еврейской конструкцией.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: поступавшего Соломону
  rationale: בוא с ל обозначает то, что приходило или поступало Соломону. Такой перевод не уточняет не названного в тексте деятеля и естественен для описания доходов.
- source_word: בְּשָׁנָה אֶחָת
  choice: за один год
  rationale: Оборот указывает на количество, поступившее в течение одного года; по-русски в данном контексте естественно «за один год».
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: шестьсот шестьдесят шесть
  rationale: Прямая передача количественного числительного современными русскими словами.
- source_word: כִּכַּר
  choice: талантов
  rationale: «Талант» — традиционное и узнаваемое название древней крупной единицы веса; пересчёт в современные единицы в основном тексте внёс бы ложную точность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий учётный стиль стиха сохранён. Причастие «поступавшего» передаёт движение дохода к Соломону без добавления неуказанного деятеля. Сноска поясняет древнюю меру, не навязывая спорного точного пересчёта.
