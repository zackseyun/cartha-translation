lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда она сказала
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֶל־הַמֶּלֶךְ
  choice: царю
  rationale: Естественная русская передача предложного оборота с определённым существительным.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Правдой оказалось то
  rationale: Предикативное אֱמֶת указывает, что услышанное соответствовало истине. Такая формулировка сохраняет начальное смысловое выделение истины и звучит естественно по-русски.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: что я слышала
  rationale: Прямая и естественная передача относительной конструкции.
- source_word: בְּאַרְצִי
  choice: в своей стране
  rationale: אֶרֶץ здесь обозначает страну царицы; возвратное местоимение естественно передаёт суффикс первого лица в русском контексте.
- source_word: עַל־דְּבָרֶיךָ
  choice: о твоих словах
  rationale: Буквально сохраняет основной смысл דְּבָרִים и уместно сочетается с упоминанием мудрости, не устраняя более широкую смысловую возможность.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: и о твоей мудрости
  rationale: Прямая передача существительного и параллельной предложной конструкции.
