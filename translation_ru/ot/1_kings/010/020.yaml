lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  choice: И двенадцать львов
  rationale: Прямо передаёт сочинительную связь, числительное и название изображённых животных; отдельная связка не нужна, поскольку сказуемое выражено далее.
- source_word: עֹמְדִים שָׁם
  choice: стояли там
  rationale: Причастие описывает положение фигур в общей картине; русское прошедшее несовершенного вида естественно передаёт это состояние.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: на шести ступенях
  rationale: מַעֲלוֹת обозначает ступени, ведущие к престолу, а עַל естественно передаётся предлогом «на».
- source_word: מִזֶּה וּמִזֶּה
  choice: по обеим сторонам
  rationale: Современное русское выражение ясно передаёт симметричное расположение с двух сторон; буквальная пространственная формула сохранена в сноске.
- source_word: לֹא נַעֲשָׂה כֵן לְכָל מַמְלָכוֹת
  choice: ничего подобного не было сделано ни в одном царстве
  rationale: Идиоматично передаёт отрицание существования сопоставимого произведения среди царств, сохраняя пассивную конструкцию исходного текста.
