base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: ru
  text: Она прибыла в Иерусалим с весьма многочисленной свитой[a], с верблюдами, несущими благовония, огромное количество золота и драгоценные камни. Она пришла к Соломону и рассказала ему обо всём, что было у неё на сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с очень большой свитой»; более буквально: «с весьма значительной силой (или богатством)». Еврейское חַיִל может означать богатство, силу, войско или многочисленную группу сопровождающих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: с весьма многочисленной свитой
  rationale: חַיִל может означать силу, войско, богатство или значительное сопровождение. В контексте царского путешествия «свита» естественно передаёт сопровождавшую царицу многочисленную группу, не придавая ей однозначно военного характера; כָּבֵד מְאֹד выражено как «весьма многочисленной».
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: верблюдами, навьюченными благовониями
  rationale: Причастная конструкция описывает верблюдов, несущих груз. «Навьюченными» точно и естественно для караванного контекста; בְּשָׂמִים передано широким словом «благовония», охватывающим ароматические вещества и пряности.
- source_word: וְזָהָב רַב מְאֹד
  choice: огромным количеством золота
  rationale: רַב מְאֹד подчёркивает чрезвычайное изобилие; русский оборот передаёт количественный смысл без неестественного буквального «весьма многим золотом».
- source_word: וְאֶבֶן יְקָרָה
  choice: драгоценными камнями
  rationale: Единственное число אֶבֶן употреблено собирательно; в современном русском перечислении естественно множественное число.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Придя к Соломону
  rationale: Повтор глагола בוא обозначает следующий этап — личное приближение к Соломону после прибытия в Иерусалим. Деепричастная конструкция сохраняет последовательность и избегает тяжеловесного повтора.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: она высказала ему
  rationale: דבר אֶל буквально означает «говорить к/с». В сочетании со следующим выражением «высказала ему» естественно передаёт раскрытие всех мыслей и вопросов, не предполагая сверх текста полноценного взаимного разговора.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: всё, что было у неё на сердце
  rationale: Сохранена образность еврейской идиомы, обозначающей внутренние мысли, намерения и заботы; выражение понятно и естественно в современном литературном русском.
