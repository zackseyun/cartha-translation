base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: ru
  text: Но я не верила этим рассказам, пока не пришла и не увидела своими глазами. И вот, мне не рассказали и половины! Ты мудростью и благополучием превзошёл молву, которую я слышала.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты мудростью и богатством превзошёл молву, которую я слышала». Еврейское טוֹב может обозначать благо или благополучие в широком смысле; здесь, в описании процветания Соломона, оно может включать и богатство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: не верила
  rationale: Hiphil от אמן здесь означает считать услышанное истинным или достоверным; «не верила» естественно передаёт эту реакцию без добавочной эмоциональной окраски.
- source_word: לַדְּבָרִים
  choice: этим рассказам
  rationale: Буквально «словам», но по контексту речь идёт о сообщениях о Соломоне. «Рассказам» понятно и естественно по-русски, сохраняя характер сведений, полученных от других.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: не увидела всё своими глазами
  rationale: Еврейская идиома буквально означает «увидели мои глаза». Русское «увидела своими глазами» сохраняет акцент на личном свидетельстве; «всё» восполняет подразумеваемый объект из контекста.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт дискурсивный маркер удивления и подчёркивания естественным, но достойным современным русским выражением.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: мне не рассказали и половины
  rationale: Идиоматическое русское выражение точно передаёт усиленное отрицание и риторическое преуменьшение оригинала.
- source_word: הוֹסַפְתָּ ... אֶל
  choice: Ты превзошёл
  rationale: В сравнительной конструкции יסף с אֶל выражает превосходство над услышанным, а не простое добавление.
- source_word: חָכְמָה וָטוֹב
  choice: своей мудростью и благополучием
  rationale: חָכְמָה — «мудрость»; טוֹב в контексте царского великолепия может обозначать благо, процветание или благополучие. «Благополучие» сохраняет широту слова и не ограничивает его одним богатством.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: то, что я слышала
  rationale: Естественно передаёт сообщение или молву, дошедшую до царицы, и избегает тяжёлого русского повтора «слух, который я слышала».
