  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: ru
  text: Коней для Соломона доставляли из Египта и из Куве[a][b]; царские купцы получали их из Куве за плату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переданное как «Куве», имеет неясное значение. Возможно, это название области в Киликии; но его можно понимать и как нарицательное существительное со значением «табун» или «партия».
    reason: cultural_note
  - marker: b
    text: 'При другом понимании трудного еврейского текста: «…из Египта и из табуна; царские купцы получали табун за плату».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַסּוּסִים
  choice: коней… привозили
  rationale: מוֹצָא может обозначать выход, происхождение или поступление товара. В контексте поставок Соломону естественная русская передача «привозили» выражает направление торговли, не перегружая фразу канцелярским словом «импорт».
- source_word: אֲשֶׁר לִשְׁלֹמֹה
  choice: для Соломона
  rationale: Предлог לְ указывает, что кони предназначались Соломону или поступали в его распоряжение. «Для Соломона» точнее сохраняет эту широту, чем категоричное указание на собственность.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: Обычная передача названия страны и исходного пункта поставок.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: из Куве / в Куве
  rationale: В основном тексте спорное слово понято как географическое название Куве, вероятно область в Киликии. Во втором случае русское «в Куве» естественно обозначает место приобретения, хотя еврейская конструкция буквально содержит предлог «из».
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: царские купцы
  rationale: Краткая и естественная передача торговых агентов, состоявших на царской службе.
- source_word: יִקְחוּ
  choice: приобретали
  rationale: Глагол буквально означает «брали», но торговый контекст и упоминание платы указывают на приобретение; перевод не уточняет способ сделки сверх сказанного.
- source_word: בִּמְחִיר
  choice: за плату
  rationale: Передаёт коммерческий смысл выражения, не предполагая конкретной установленной цены.
