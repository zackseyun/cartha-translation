  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: ru
  text: У царя в море были корабли Таршиша вместе с кораблями Хирама. Раз в три года корабли Таршиша приходили, привозя золото и серебро, слоновую кость, обезьян и павлинов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «павлины», имеет не вполне ясное значение; возможно, речь идёт о других экзотических птицах или животных.
    reason: Сохраняет лексическую неопределённость редкого слова תֻכִּיִּים, не перегружая основной текст.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: таршишские корабли
  rationale: Буквально «корабли Таршиша»; это устойчивое обозначение, которое может указывать на тип больших дальних торговых судов либо на их связь с Таршишем. Прилагательное звучит естественно по-русски, не устраняя этой неоднозначности.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: раз в три года
  rationale: Естественная и точная передача периодичности.
- source_word: שֶׁנְהַבִּים
  choice: слоновую кость
  rationale: Общепринятое понимание редкого существительного во множественном числе; по-русски название материала обычно употребляется в единственном числе.
- source_word: קֹפִים
  choice: обезьян
  rationale: Надёжно установленное значение названия привозных животных.
- source_word: תֻכִּיִּים
  choice: павлинов
  rationale: Традиционное и вероятное понимание редкого заимствованного слова, однако точный вид привозных животных остаётся спорным; неопределённость отмечена в сноске.
