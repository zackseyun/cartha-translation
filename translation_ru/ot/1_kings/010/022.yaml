revisions:
- from: Ведь у царя были в море таршишские корабли вместе с кораблями Хирама. Раз в три года приходили таршишские корабли, привозя золото и серебро, слоновую кость, обезьян и павлинов.[a]
  to: У царя в море были корабли Таршиша вместе с кораблями Хирама. Раз в три года корабли Таршиша приходили, привозя золото и серебро, слоновую кость, обезьян и павлинов.[a]
  rationale: 'Заменено «таршишские корабли» на «корабли Таршиша» в обоих случаях, чтобы сохранить собственное имя и не снимать неоднозначность еврейского генитивного выражения. Начальное «Ведь» опущено: еврейское כִּי может вводить пояснение, но в русском самостоятельном стихе союз не требуется; смысловая связь не утрачена.'
