source:
  edition: WLC
  text: וְ/הֵ֣מָּה מְבִאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ וְ/נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: ru
  text: 'И каждый из них из года в год приносил свой дар[a]: серебряные и золотые изделия, одежды[b], оружие[c], благовония, коней и мулов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё подношение» или «свою дань». Древнееврейское מִנְחָה может обозначать дар, подношение или дань; здесь слово употреблено в царском контексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «верхние одежды» или «одеяния».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «доспехи» или шире — «военное снаряжение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: приносил
  rationale: Причастная форма с הֵמָּה в данном контексте выражает обычное, неоднократно совершавшееся действие; сочетание с «из года в год» естественно передаёт эту длительно-повторительную семантику по-русски.
- source_word: אִישׁ מִנְחָתוֹ
  choice: каждый из них ... свой дар
  rationale: אִישׁ употреблено дистрибутивно — «каждый», а מִנְחָה обозначает подношение правителю. «Дар» сохраняет возможность как добровольного подношения, так и обусловленной царским статусом дани, не разрешая неоднозначность без достаточных оснований.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: серебряные и золотые изделия
  rationale: כְּלִי — широкое обозначение предмета, сосуда или утвари; «изделия» не сужает значение до сосудов и сохраняет параллелизм.
- source_word: שְׂלָמוֹת
  choice: одежды
  rationale: Слово обозначает предметы одежды, вероятно верхние одежды или одеяния. Общее «одежды» уместно в перечне, а более узкие варианты отмечены в сноске.
- source_word: נֵשֶׁק
  choice: оружие
  rationale: Термин может охватывать оружие или военное снаряжение. «Оружие» ясно современному читателю; возможное значение «доспехи» сохранено в сноске.
- source_word: בְשָׂמִים
  choice: благовония
  rationale: В торгово-дарственном контексте речь идёт об ароматических веществах; «благовония» точнее сохраняет широту значения, чем «пряности».
- source_word: סוּסִים וּפְרָדִים
  choice: коней и мулов
  rationale: Стандартные значения; «кони» стилистически естественно в царском повествовании, «мулы» прямо передаёт פְרָדִים.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: из года в год
  rationale: Естественная русская идиома, передающая регулярное ежегодное повторение и близкая образности древнееврейского выражения.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Порядок фразы перестроен ради естественности: ежегодная повторяемость вынесена перед сказуемым, при этом все элементы древнееврейского перечня сохранены. «Дар» выбран вместо категоричного «дань», чтобы не устранять лексическую неоднозначность מִנְחָה.'
