  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב מוּפָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/018.yaml
  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: ru
  text: И сделал царь большой престол из слоновой кости и покрыл его отборным золотом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очищенным золотом»; возможно также: «чистым золотом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И сделал
  rationale: Форма wayyiqtol продолжает последовательное повествование; русское «и сделал» естественно сохраняет связь с предыдущим контекстом.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное относится в контексте к Соломону; в русском отсутствие артикля не требует дополнительного уточнения.
- source_word: כִּסֵּא
  choice: престол
  rationale: В царском контексте слово обозначает именно престол, а не обычное сиденье.
- source_word: שֵׁן
  choice: из слоновой кости
  rationale: Буквально существительное связано с зубом, но при описании изделия обозначает слоновую кость; предлог «из» естественно передаёт материал престола.
- source_word: גָּדוֹל
  choice: большой
  rationale: Слово может указывать как на размеры, так и на величие; нейтральное «большой» сохраняет основное значение без добавления толкования.
- source_word: וַיְצַפֵּהוּ
  choice: и покрыл его
  rationale: Глагол означает покрыть или облицевать материалом; «покрыл его» ясно и естественно описывает работу с золотом.
- source_word: זָהָב
  choice: золотом
  rationale: Прямое обозначение материала; творительный падеж обусловлен русским управлением.
- source_word: מוּפָז
  choice: отборным
  rationale: Редкое определение указывает на золото высокого качества; «отборное» сохраняет эту идею, не утверждая с излишней точностью конкретный способ обработки.
