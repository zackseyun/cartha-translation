  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָֽ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד הַ/שֹּׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: ru
  text: Счастливы твои люди, счастливы эти твои слуги, которые всегда стоят перед тобой и слушают твою мудрость!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Счастливы
  rationale: Форма выражает завидное состояние благополучия и счастья. «Счастливы» естественно звучит в современной русской речи и сохраняет характер торжественного восклицания.
- source_word: אֲנָשֶׁיךָ
  choice: твои люди
  rationale: В данном придворном контексте речь идёт о людях царя, вероятно придворных. «Твои люди» сохраняет отличие от следующего «твои слуги» и не сужает значение до одной должностной группы.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: В царском окружении слово обозначает состоящих на службе у царя. «Слуги» передаёт придворный контекст, не выдвигая на первый план возможное значение рабского статуса.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: которые стоят перед тобой
  rationale: Сохранён конкретный образ стояния перед царём, подразумевающий постоянное присутствие и служение при нём.
- source_word: תָּמִיד
  choice: всегда
  rationale: Передаёт постоянный, регулярный характер их присутствия; в этом контексте звучит естественнее, чем более книжное «непрестанно».
- source_word: הַשֹּׁמְעִים אֶת חָכְמָתֶךָ
  choice: и слушают твою мудрость
  rationale: Глагол שׁמע может означать как слышать, так и слушать. Здесь придворные находятся перед Соломоном и внимают проявлениям его мудрости; буквальный объект «твою мудрость» сохранён без поясняющего добавления.
