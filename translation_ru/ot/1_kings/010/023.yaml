lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: превзошёл
  rationale: В сочетании со сравнительным מִן глагол גדל означает, что Соломон стал или оказался больше других. «Превзошёл» естественно и точно передаёт сравнительный смысл.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Обычная русская форма титула с личным именем сохраняет значение определённого титула и приложения.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: всех царей земли
  rationale: אֶרֶץ допускает значения «земля» и «страна»; в контексте сопоставления с другими царями «земли» передаёт широкий, международный охват утверждения, не усиливая его до слова «мира».
- source_word: לְעֹשֶׁר
  choice: богатством
  rationale: עֹשֶׁר обозначает материальное богатство. Творительный падеж по-русски естественно выражает сферу, в которой Соломон превосходил других.
- source_word: וּלְחָכְמָה
  choice: и мудростью
  rationale: חָכְמָה прямо означает «мудрость»; творительный падеж сохраняет параллель с «богатством».
- source_word: וַ
  choice: Так
  rationale: Повествовательный союз связывает стих с предшествующим описанием и здесь может иметь итоговый оттенок; «Так» естественно вводит обобщающий результат.
