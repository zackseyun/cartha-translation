  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: ru
  text: помимо того, что поступало от странствующих торговцев[a], от торговли купцов, от всех царей Аравии[b] и наместников страны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от странствующих людей»; еврейское выражение трудно для понимания и, вероятно, обозначает разъездных торговцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царей смешанных народов»; еврейское слово может иметь такое значение, однако здесь вероятнее имеется в виду Аравия.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «областных правителей»; также возможно: «сатрапов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: помимо
  rationale: Кратко и естественно вводит дополнительные поступления сверх названной ранее суммы.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: от странствующих торговцев
  rationale: Трудное выражение буквально указывает на людей, которые ходят или странствуют; торговый контекст позволяет понять их как странствующих торговцев, не скрывая неопределённости в сноске.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: от торговли купцов
  rationale: מִסְחַר обозначает торговлю или торговый оборот, а רֹכְלִים — людей, занимающихся торговлей; сочетание передано ясным современным русским выражением.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: от всех царей Аравии
  rationale: В данном геополитическом перечне הָעֶרֶב наиболее вероятно обозначает Аравию или арабские народы; географическая формулировка естественна по-русски.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: и наместников страны
  rationale: פַחוֹת — областные правители или должностные лица, подчинённые верховной власти. «Наместники» передаёт этот статус без излишне узкой исторической привязки слова «сатрапы».
