  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: ru
  text: Тогда пророк пошёл, встал у дороги, ожидая царя, и замаскировался, надев повязку на глаза[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «с пеплом на глазах». Здесь может подразумеваться либо настоящий пепел, либо покрытие или повязка, служившая для маскировки.'
