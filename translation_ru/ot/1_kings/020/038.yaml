lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Тогда ... пошёл
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Прямое соответствие определённому существительному; в русском определённость ясна из контекста.
- source_word: וַיַּעֲמֹד לַמֶּלֶךְ עַל הַדָּרֶךְ
  choice: встал у дороги, поджидая царя
  rationale: Фраза означает, что пророк занял место у дороги с целью встретить проходившего царя. Такой перевод естественно выражает связь לַמֶּלֶךְ с действием, не создавая впечатления, будто царь уже стоял перед ним.
- source_word: וַיִּתְחַפֵּשׂ
  choice: изменил свой облик
  rationale: Возвратная форма обозначает намеренное изменение внешности ради неузнаваемости; выражение подходит к последующему рассказу, где царь его не узнаёт.
- source_word: בָּאֲפֵר
  choice: повязку
  rationale: Хотя обычное значение אֵפֶר — «пепел», сочетание «на глазах» и контекст маскировки допускают значение покрытия или повязки. Неоднозначность исходного выражения отмечена в сноске.
- source_word: עַל עֵינָיו
  choice: на глаза
  rationale: Естественная русская передача положения покрытия поверх глаз.
