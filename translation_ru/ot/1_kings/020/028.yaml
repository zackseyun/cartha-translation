  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: ru
  text: 'И подошёл человек Божий и сказал царю Израиля: «Так говорит Яхве: за то, что арамеи[a] сказали: „Яхве — бог гор, а не бог долин“, Я отдам всё это огромное множество в твои руки, и вы узнаете[b], что Я — Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Арам». Название страны или народа употреблено как собирательное подлежащее при глаголе во множественном числе.'
    reason: Уточнение формы исходного текста и коллективного значения.
  - marker: b
    text: '«Вы узнаете» — в еврейском тексте множественное число: слова относятся не только к царю, но и к Израилю.'
    reason: В русском переводе важно пояснить переход от единственного числа «твои» к множественному «вы».
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое библейское обозначение пророка; определённость устанавливается контекстом, а русское выражение естественно без артикля.
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Передаёт конкретное значение приближения без добавочного толкования.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет традиционную формулу пророческого посланничества и передаёт личное имя יְהוָה транслитерацией.
- source_word: אֲרָם
  choice: арамеи
  rationale: Название «Арам» употреблено как собирательное подлежащее при глаголе во множественном числе; обозначение народа по-русски естественно передаёт это согласование.
- source_word: אֱלֹהֵי הָרִים ... אֱלֹהֵי עֲמָקִים
  choice: бог гор, а не бог долин
  rationale: Сохраняется противопоставление возвышенной и низменной местности, а строчная буква и предикативное «бог» передают ошибочное представление арамеев о Яхве как об одном из местных божеств.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: всё это огромное полчище
  rationale: הָמוֹן обозначает многочисленную массу людей; в данном военном контексте «полчище» ясно выражает смысл, не превращая слово в формальный термин для организованной армии.
- source_word: בְּיָדֶךָ
  choice: в твои руки
  rationale: Естественный русский эквивалент древнееврейской идиомы, означающей передачу во власть и дарование победы; единственное число адресата сохранено местоимением «твои».
- source_word: וִידַעְתֶּם
  choice: вы узнаете
  rationale: Форма глагола — второе лицо мужского рода множественного числа; явное «вы» сохраняет переход от царя как непосредственного адресата ко всему Израилю.
- source_word: כִּי אֲנִי יְהוָה
  choice: что Я — Яхве
  rationale: Передаёт формулу божественного самооткровения и сохраняет личное имя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому транслитерация сохраняет личное имя и отличает его от титула.
- issue: Смысл утверждения арамеев об אֱלֹהֵי
  choice: бог гор, а не бог долин
  alternative: Бог гор, но не Бог долин
  rationale: Строчная буква помогает передать взгляд арамеев, считавших Яхве ограниченным местным божеством, не утверждая истинность такого представления.
- issue: Число адресата в заключении
  choice: множественное «вы узнаете» — царь и Израиль в совокупности
  alternative: единственное «ты узнаешь» — только царь
  rationale: Несмотря на обращение к царю, масоретский текст содержит форму וִידַעְתֶּם во множественном числе; перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический повтор двух форм וַיֹּאמֶר сглажен как неестественный для русского повествования; содержание речи не сокращено. Прямая речь оформлена так, чтобы ясно отделить слова пророка, формулу Яхве и процитированное мнение арамеев.
