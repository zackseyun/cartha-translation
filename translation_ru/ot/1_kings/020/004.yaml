base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: ru
  text: 'Царь Израиля ответил: «По твоему слову, господин мой, царь: я твой, и всё, что у меня, — твоё».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как ты сказал, господин мой, царь, я и всё, что у меня, принадлежим тебе».'
    reason: Передаёт более разговорный вариант כִּדְבָרְךָ и возможное синтаксическое оформление заключительной части.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: В повествовательной формуле два еврейских глагола вводят ответную речь; по-русски естественно передать их одним глаголом «ответил», не создавая тяжеловесного «ответил и сказал».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое и привычное для русского библейского повествования обозначение правителя Израиля.
- source_word: כִּדְבָרְךָ
  choice: как ты сказал
  rationale: Передаёт смысл формулы согласия буквально по значению и естественно по-русски; возможное более формальное прочтение отмечено в сноске.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохраняет притяжательность и придворно-почтительное обращение к человеческому правителю, не придавая слову божественного значения.
- source_word: לְךָ אֲנִי
  choice: я твой
  rationale: Кратко и точно выражает принадлежность или подчинение, сохраняя лаконичность исходной фразы.
- source_word: וְכָל אֲשֶׁר לִי
  choice: и всё, что у меня, — твоё
  rationale: Естественно выражает всеобъемлющее признание права адресата на имущество говорящего; подразумеваемое сказуемое восполнено по-русски.
theological_decisions:
- issue: Значение אֲדֹנִי при обращении к царю-человеку
  choice: господин мой
  alternative: владыка мой
  rationale: Контекст требует придворного обращения к земному царю. «Господин мой» передаёт социальную иерархию без божественной коннотации и без излишней архаизации.
- issue: Характер слов לְךָ אֲנִי
  choice: я твой
  alternative: я принадлежу тебе
  rationale: Фраза может охватывать как принадлежность, так и признание власти или подчинение. Краткое «я твой» сохраняет эту смысловую ёмкость, не уточняя её догматически или политически сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Избегается архаичное «отвечал и сказал»; обращение сохраняет придворную почтительность. Маркер сноски поставлен после всей цитаты.
