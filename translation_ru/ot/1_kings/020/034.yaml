  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: ru
  text: 'Он сказал ему: «Города, которые мой отец отнял у твоего отца, я верну. А ты устроишь себе улицы[a] в Дамаске, как мой отец устроил их в Самарии». — «А я отпущу тебя на условиях договора[b]». И он заключил с ним договор[c] и отпустил его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торговые площади» либо «кварталы». Еврейское слово буквально означает «улицы, открытые места», но здесь может обозначать предоставленные по договору торговые участки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «с договором (заветом) я отпущу тебя». Здесь речь идёт о политическом договоре между царями.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «рассёк с ним договор (завет)» — древнееврейское устойчивое выражение, означающее официально заключить обязывающее соглашение.'
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное значение עִיר; в данном военно-политическом контексте речь идёт о возвращении захваченных городов.
- source_word: לָקַח ... אָשִׁיב
  choice: отнял ... верну
  rationale: Передаёт захват владения и последующее восстановление прежнего права собственности; «верну» естественно звучит в дипломатической речи.
- source_word: וְחוּצוֹת
  choice: улицы
  rationale: Сохраняет прямое значение «улицы, открытые места», не устраняя возможный контекстуальный смысл торговых участков или кварталов; он отмечен в сноске.
- source_word: תָּשִׂים לְךָ ... כַּאֲשֶׁר שָׂם
  choice: устроишь себе ... как ... устроил
  rationale: Глагол שׂים означает «помещать, устраивать, учреждать». Повтор одного русского глагола сохраняет параллелизм еврейского текста и подходит для официально предоставляемых городских прав.
- source_word: בַּבְּרִית
  choice: по договору
  rationale: В политических отношениях между царями בְּרִית обозначает обязывающее соглашение. «По договору» естественно передаёт основание освобождения, не скрывая возможный более буквальный перевод.
- source_word: אֲשַׁלְּחֶךָּ
  choice: отпущу тебя
  rationale: По контексту Ахав освобождает пленённого Венадада после достижения соглашения; «отпущу» ясно передаёт это действие.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: заключил с ним договор
  rationale: Так естественно по-русски передаётся устойчивое еврейское выражение כרת ברית, буквально «рассёк договор/завет».
- source_word: וַיְשַׁלְּחֵהוּ
  choice: и отпустил его
  rationale: Повторяет глагол обещания и показывает его исполнение, сохраняя лексическую связь в русском тексте.
theological_decisions:
- issue: Значение בְּרִית в соглашении между двумя царями
  choice: договор
  alternative: завет
  rationale: Контекст описывает политическое соглашение и освобождение побеждённого царя, поэтому современное «договор» точнее передаёт функцию слова. Вариант «завет» сохраняется в сноске и не исключается из его смыслового диапазона.
- issue: Смена говорящего перед וַאֲנִי בַּבְּרִית אֲשַׁלְּחֶךָ
  choice: реплика Ахава выделена отдельно
  alternative: считать весь отрывок одной непрерывной репликой Венадада
  rationale: 'Местоимения и развитие переговоров естественно указывают, что после обещаний Венадада отвечает Ахав: «А я отпущу тебя». Поскольку в древнееврейском тексте кавычек нет, пунктуация отражает наиболее вероятную, но формально подразумеваемую смену говорящего.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Реплики звучат как краткие дипломатические условия. Слово «улицы» сохраняет конкретность и неоднозначность оригинала, а вероятный специальный торговый смысл пояснён в сноске.
