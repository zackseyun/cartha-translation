base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: ru
  text: Когда снова наступило то же время года[a], Бен-Хадад собрал войско Арама[b] и выступил к Афеку, чтобы сразиться с Израилем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при возвращении года»; то есть когда снова наступило соответствующее время в годовом цикле. Возможный перевод: «весной».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «собрал арамеев». Название «Арам» здесь может обозначать государство, его народ или войско.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на битву с Израилем»; в этом военном контексте: «против Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: когда год завершил свой круг
  rationale: Выражение буквально означает «при возвращении года» и указывает на наступление очередного времени в годовом цикле. Формулировка сохраняет образ исходного текста, не сужая его без необходимости до весны.
- source_word: וַיִּפְקֹד
  choice: собрал войско
  rationale: В военном контексте פקד означает провести смотр или собрать силы. По-русски «собрал войско» естественно передаёт подготовку армии к походу.
- source_word: אֶת אֲרָם
  choice: войско Арама
  rationale: Арам здесь метонимически обозначает государство, народ или его военные силы. Уточнение «войско» естественно связано с военным значением глагола, а название «Арам» сохраняет форму исходного текста.
- source_word: וַיַּעַל
  choice: выступил
  rationale: עלה буквально означает «поднялся, пошёл вверх», но в рассказе о военном походе русское «выступил» естественно передаёт движение армии, не настаивая на неясной топографической детали.
- source_word: אֲפֵקָה
  choice: к Афеку
  rationale: Направительный суффикс у названия города обозначает движение в сторону Афека.
- source_word: לַמִּלְחָמָה
  choice: чтобы сразиться
  rationale: Буквально «на войну/битву»; целевая конструкция по-русски ясно и естественно выражает назначение похода.
- source_word: עִם יִשְׂרָאֵל
  choice: с Израилем
  rationale: Предлог עִם буквально значит «с»; при глаголе «сразиться» русский язык естественно сохраняет эту форму и однозначно выражает противостояние.
