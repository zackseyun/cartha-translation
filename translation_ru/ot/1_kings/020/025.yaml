base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: ru
  text: А ты набери себе войско, равное тому, которое ты потерял, коней — столько же, сколько коней, и колесниц — столько же, сколько колесниц. Тогда сразимся с ними на равнине; несомненно, мы окажемся сильнее их». Он послушался их совета и так и сделал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: набери себе войско
  rationale: Глагол מנה здесь означает укомплектовать или набрать войско; «набери» естественно передаёт военную мобилизацию, не сводя действие к простому подсчёту.
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: взамен погибшего у тебя войска
  rationale: Буквально речь идёт о войске, «павшем» или утраченном царём; «погибшего у тебя» сохраняет образ поражения, а «взамен» ясно передаёт требование восстановить прежнюю численность.
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: коней — взамен коней и колесницы — взамен колесниц
  rationale: Распределительная формула требует равноценного восполнения каждого вида сил; тире делает её естественной по-русски.
- source_word: בַּמִּישׁוֹר
  choice: на равнине
  rationale: מִישׁוֹר обозначает ровную открытую местность, противопоставленную горам в контексте.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: и уж наверняка окажемся сильнее их
  rationale: 'Отрицательная клятвенно-уверительная конструкция אִם־לֹא выражает сильную уверенность: «несомненно, наверняка»; форма נֶחֱזַק допускает смысл превосходства в предстоящем сражении.'
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: Он послушался их
  rationale: Еврейская идиома «услышал их голос» в данном контексте означает принять совет и повиноваться ему.
theological_decisions:
- issue: Передача уверительной формулы אִם לֹא
  choice: «и уж наверняка окажемся сильнее их»
  alternative: «если только мы не окажемся сильнее их»
  rationale: В речи советников эта конструкция функционирует как уверение, а не как реальное условие; перевод сохраняет их самоуверенный тон, не подтверждая истинность утверждения от лица повествователя.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военная терминология ясна обычному читателю; синтаксис передаёт настойчивый совет и уверенность советников без архаизмов.
