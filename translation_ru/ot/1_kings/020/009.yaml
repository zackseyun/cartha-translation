base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: ru
  text: 'И сказал он посланникам Бен-Хадада: «Скажите моему господину, царю: „Всё, что ты прежде посылал рабу твоему, я исполню, но этого сделать не могу“». Посланники ушли и передали ему ответ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: посланникам
  rationale: В политическом контексте речь идёт о представителях царя, а не о сверхъестественных существах.
- source_word: בֶן הֲדַד
  choice: Бен-Хадада
  rationale: Имя передано традиционной русской библейской транслитерацией и поставлено в требуемый синтаксисом родительный падеж.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: господину моему, царю
  rationale: Сохранена формальная придворная почтительность еврейского обращения без указания на божественный титул.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: всё, о чём ты посылал сказать
  rationale: Еврейское «посылал» относится к переданному через посланников требованию; дополнение «сказать» делает эту эллиптическую конструкцию естественной по-русски, не превращая её прямо в «потребовал».
- source_word: עַבְדְּךָ
  choice: рабу твоему
  rationale: Это дипломатическая формула подчинения; «раб твой» сохраняет исторический и придворный регистр исходного текста.
- source_word: בָרִאשֹׁנָה
  choice: в первый раз
  rationale: Выражение отсылает к первому посланию Бен-Хадада и ясно противопоставляет его новому требованию.
- source_word: אֶעֱשֶׂה
  choice: я исполню
  rationale: В контексте требований естественное русское «исполню» точно передаёт действие и подчёркивает согласие выполнить ранее сказанное.
- source_word: וְהַדָּבָר הַזֶּה
  choice: но этого требования
  rationale: Здесь דָּבָר обозначает содержание нового царского сообщения; «требование» ясно передаёт контекст, а более буквальная альтернатива отмечена в сноске.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: исполнить не могу
  rationale: Естественно передаёт конструкцию способности с инфинитивом и сохраняет прямой отказ.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: передали ему ответ
  rationale: Еврейская идиома буквально говорит о возвращении ему слова; по-русски «передали ему ответ» естественно выражает сообщение ответа Бен-Хададу.
