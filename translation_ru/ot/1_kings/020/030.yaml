  terminology: «Афек» и «Бен-Хадад» переданы последовательно. «Оставшиеся мужчины» точно передаёт איש в данном военном контексте, не добавляя специального статуса «воинов». Идиома חדר בחדר передана как «внутренняя комната» и снабжена буквальной сноской без чрезмерно определённого истолкования.
