base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: ru
  text: Уцелевшие бежали в Афек, в город, и стена обрушилась на двадцать семь тысяч оставшихся мужчин. Бен-Хадад тоже бежал и вошёл в город, во внутреннюю комнату[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в комнату внутри комнаты»; идиоматическое выражение, вероятно обозначающее внутреннее или самое внутреннее помещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: оставшиеся в живых / уцелевшие
  rationale: Оба употребления обозначают тех, кто остался после сражения. Контекстуальное варьирование избегает тяжёлого повтора, сохраняя смысловую связь.
- source_word: אֲפֵקָה
  choice: в Афек
  rationale: Направительный суффикс указывает движение к Афеку; русское «в» естественно передаёт движение к городу.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: стена обрушилась
  rationale: Определённая форма сохранена как «стена»; глагол «обрушилась» естественно описывает падение городской стены и не уточняет сверх текста, вся ли стена рухнула.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: на двадцать семь тысяч ... воинов
  rationale: Число передано обычной русской формой; איש в военном контексте естественно обозначает воинов-мужчин.
- source_word: וּבֶן הֲדַד נָס
  choice: Бен-Хадад тоже бежал
  rationale: «Тоже» естественно связывает его бегство с бегством остальных; повтор корня נוּס передан тем же глаголом «бежал».
- source_word: חֶדֶר בְּחָדֶר
  choice: укрылся во внутренней комнате
  rationale: Буквально «комната в комнате»; выражение указывает на удалённое внутреннее помещение. «Укрылся» ясно передаёт подразумеваемое в контексте действие, а буквальная форма вынесена в сноску.
