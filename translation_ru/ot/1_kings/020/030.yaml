  source_fidelity: 'Союз ו перед «стена обрушилась» следует передать соединительно, а не противительным «но». Кроме того, «укрылся» добавляет действие, которого в еврейском тексте нет: сказано, что Бен-Хадад бежал и вошёл в город, во внутреннее помещение.'
