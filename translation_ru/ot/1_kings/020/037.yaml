  text: וַ/יִּמְצָא֙ אִ֣ישׁ אַחֵ֔ר וַ/יֹּ֖אמֶר הַכֵּ֣י/נִי נָ֑א וַ/יַּכֵּ֥/הוּ הָ/אִ֖ישׁ הַכֵּ֥ה וּ/פָצֹֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: ru
  text: 'Затем он нашёл другого человека и сказал: «Прошу, ударь меня». И тот человек ударил его[a] и ранил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ударил его, ударяя и раня»; повтор глагола «ударять» усиливает выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Затем он нашёл
  rationale: Нарративная форма wayyiqtol продолжает последовательность событий; «затем» естественно передаёт развитие повествования.
- source_word: אִישׁ אַחֵר
  choice: другого человека
  rationale: Сочетание означает другого мужчину или человека; в данном контексте современное русское «другого человека» точно и естественно.
- source_word: הַכֵּינִי נָא
  choice: Прошу, ударь меня
  rationale: Императив נכה с суффиксом первого лица означает «ударь меня», а частица נָא придаёт просьбе оттенок настойчивого обращения, переданный словом «прошу».
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: И тот человек ударил его
  rationale: Сохранены повествовательное соединение, выраженный субъект и объектный суффикс «его»; «тот человек» ясно указывает на только что найденного человека.
- source_word: הַכֵּה וּפָצֹעַ
  choice: ударил его и ранил
  rationale: Еврейская конструкция повторяет корень «ударять» и добавляет результат «ранить». В основном тексте смысл передан естественно по-русски, а формальное повторение отмечено в сноске.
