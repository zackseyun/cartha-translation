base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: ru
  text: 'Тогда он сказал ему: «За то, что ты не послушался голоса ГОСПОДА, вот: когда ты уйдёшь от меня, тебя поразит лев». Когда он ушёл от него, лев встретил его и поразил.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא שָׁמַעְתָּ בְּקוֹל
  choice: не послушался голоса
  rationale: Оборот означает не просто отсутствие восприятия, а неповиновение услышанному повелению; при этом сохранён библейский образ «голоса».
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Естественно передаёт причинно-возмездную связь в данном пророческом приговоре.
- source_word: הִנְּךָ
  choice: вот
  rationale: Сохраняет вводный указательный элемент, подчёркивающий близость и неизбежность предсказанного.
- source_word: הוֹלֵךְ מֵאִתִּי
  choice: как только ты уйдёшь от меня
  rationale: В контексте конструкция указывает на событие, которое последует при уходе; «как только» естественно выражает непосредственную временную связь.
- source_word: וְהִכְּךָ / וַיַּכֵּהוּ
  choice: тебя поразит / поразил
  rationale: Глагол נכה может означать ударить или поразить насмерть. Русское «поразить» сохраняет эту лексическую широту, не добавляя прямо отсутствующее слово «насмерть».
- source_word: וַיִּמְצָאֵהוּ
  choice: встретил его
  rationale: В повествовании о льве «встретил» звучит естественно и передаёт обнаружение человека зверем без ненужного оттенка целенаправленного поиска.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: ГОСПОДА
  alternative: Яхве
  rationale: Капительное «ГОСПОДЬ» следует принятой русской библейской традиции обозначения божественного имени и согласуется с консультационным текстом, не вводя конфессионально специфического толкования.
- issue: Характер последствий неповиновения
  choice: сохранён прямой пророческий приговор без поясняющего богословского комментария
  alternative: добавить, что это было Божье наказание или что человек погиб
  rationale: Источник связывает нападение льва с непослушанием голосу ГОСПОДА, но перевод не должен расширять формулировку за пределы сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён для ясности; повтор глагола «поразить» сохранён как значимая связь между пророчеством и его исполнением.
