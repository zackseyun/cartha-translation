  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: ru
  text: 'И вот они вышли из города: юноши областных правителей[a], а за ними — войско.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
