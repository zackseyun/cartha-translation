lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот они
  rationale: Передаёт соединительное וְ и указание на уже упомянутую группу; такая конструкция естественна в современном русском повествовании.
- source_word: יָצְאוּ מִן־הָעִיר
  choice: вышли из города
  rationale: Прямо передаёт движение из города, не добавляя более узкого военного оттенка вроде «выступили».
- source_word: נַעֲרֵי
  choice: юноши
  rationale: Сохраняет основное возрастное значение слова נַעַר и не устраняет его возможное значение личных слуг или сопровождающих; эта неоднозначность отмечена в сноске.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: областных правителей
  rationale: Передаёт сопряжённую конструкцию «правители областей» естественным русским словосочетанием; שַׂר обозначает начальника или правителя, а מְדִינוֹת — административные области.
- source_word: וְהַחַיִל אֲשֶׁר אַחֲרֵיהֶם
  choice: а за ними — войско
  rationale: Естественно передаёт следование войска позади названной группы и сохраняет военное значение חַיִל.
