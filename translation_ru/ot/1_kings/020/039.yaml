base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: ru
  text: 'Когда мимо проходил царь, он воззвал к нему и сказал: «Твой слуга вышел в самую гущу сражения. И вот, один человек отошёл в сторону, подвёл ко мне другого и сказал: „Стереги этого человека. Если он всё же пропадёт[a], твоя жизнь будет вместо его жизни[b], либо ты взвесишь талант серебра“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если его не окажется на месте», «если он каким-либо образом исчезнет». В еврейском тексте абсолютный инфинитив сочетается с личной формой того же глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоя жизнь вместо его жизни» — юридическая формула замещения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: проходил мимо
  rationale: Причастие в сочетании с ויהי передаёт фоновое продолжающееся действие; несовершенный вид естественно выражает его по-русски.
- source_word: צָעַק
  choice: воззвал
  rationale: Глагол обозначает громкий, настойчивый крик или призыв. «Воззвал» сохраняет срочность и соответствует dignified повествовательному регистру.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Это принятая придворная форма самоназвания перед царём; «раб» здесь мог бы неуместно сузить значение.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: в самую гущу сражения
  rationale: קֶרֶב указывает на внутреннюю часть, середину; выражение передаёт участие в разгаре боя и сохраняет направление движения.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица живо вводит неожиданное развитие событий; «и вот» естественно сохраняет эту повествовательную функцию.
- source_word: אִישׁ סָר
  choice: один человек отошёл в сторону
  rationale: סוּר означает отклониться или отойти в сторону; перевод не уточняет сверх текста, откуда именно он отошёл.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: подвёл ко мне другого
  rationale: Первый человек приводит к говорящему второго человека. «Другого» устраняет неизбежную русскую неясность повторения слова «человек», не меняя участников сцены.
- source_word: שְׁמֹר
  choice: стереги
  rationale: Императив требует держать человека под стражей; «стереги» кратко и естественно передаёт поручение.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: если он всё же пропадёт
  rationale: Нифальская конструкция с абсолютным инфинитивом усиливает значение исчезновения или отсутствия; частица «всё же» передаёт усиление, не устраняя возможного оттенка «не окажется на месте».
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: твоя жизнь будет вместо его жизни
  rationale: נֶפֶשׁ здесь означает жизнь, а תַּחַת выражает замещение; формулировка сохраняет юридическую формулу и её строгость.
- source_word: כִּכַּר כֶּסֶף
  choice: талант серебра
  rationale: כִּכַּר — древняя мера веса; традиционный термин «талант» точнее, чем замена приблизительным современным весом.
- source_word: תִּשְׁקוֹל
  choice: отвесишь
  rationale: Глагол буквально означает взвесить; перевод сохраняет образ выплаты серебром по весу.
