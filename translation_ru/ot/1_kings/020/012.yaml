    text: 'Или: «эти слова»; или: «об этом деле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во временных укрытиях»; традиционно: «в шатрах».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально еврейский приказ: «Поставьте!» Это краткая военная команда, вероятно означающая приказ занять позиции против города.'
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: эти слова
  rationale: דבר может означать «слово», «сообщение» или «дело». В контексте речь идёт о переданном ответе Ахава; «эти слова» естественно по-русски и сохраняет близость к форме еврейского выражения.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: он и цари пили
  rationale: Причастие обозначает продолжавшееся действие. Русское множественное сказуемое естественно передаёт еврейскую конструкцию «пил он и цари».
- source_word: בַּסֻּכּוֹת
  choice: в шатрах
  rationale: סֻכּוֹת обозначает временные укрытия или шалаши. В военном и царском контексте «шатры» звучит естественно, не превращая их непременно в обычные походные палатки; варианты отмечены в сноске.
- source_word: שִׂימוּ
  choice: Занять позиции!
  rationale: Буквально это краткий приказ «Поставьте!» или «Расположите!». Военный контекст позволяет естественно передать эллиптическую команду как «Занять позиции!», не уточняя не названных в тексте осадных действий.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: они заняли позиции против города
  rationale: Эллиптическая фраза с עַל в военном контексте выражает враждебное расположение против города. Перевод сохраняет повтор глагольной основы после приказа.
