  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: ru
  text: 'Когда он услышал это известие[a], он и цари как раз пили в шалашах[b]. Тогда он сказал своим слугам: «Занять позиции!»[c] И они заняли позиции против города.'
  philosophy: optimal-equivalence
  footnotes:
