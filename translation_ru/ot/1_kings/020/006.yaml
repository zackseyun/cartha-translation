  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: ru
  text: Нет, завтра примерно в это же время я пришлю к тебе моих слуг. Они обыщут твой дом и дома твоих слуг; всё, что тебе дорого[a], они захватят и унесут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё желанное (драгоценное) для твоих глаз», то есть всё, что ты особенно ценишь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положат в свои руки и возьмут»; речь идёт о захвате и выносе имущества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Нет
  rationale: В контексте выражение отвергает прежнее ограничение и усиливает требование; русское «Нет» естественно передаёт корректирующую силу оборота.
- source_word: כָּעֵת מָחָר
  choice: завтра примерно в это же время
  rationale: Передаёт временное указание на приблизительно тот же час следующего дня естественным современным русским языком.
- source_word: עֲבָדַי
  choice: моих слуг
  rationale: Речь идёт о посланных царём людях или служителях; их рабский статус здесь не является смысловым центром.
- source_word: וְחִפְּשׂוּ
  choice: обыщут
  rationale: Глагол обозначает тщательный поиск. «Обыщут» естественно подходит к домам и предполагаемому изъятию имущества, не добавляя прямого указания на разгром.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: твой дом и дома твоих слуг
  rationale: Сохраняет повтор еврейского בַּיִת и не устраняет возможный смысл «дворец» в первом употреблении.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: всё, что дорого твоим глазам
  rationale: Сохраняет образный еврейский оборот и передаёт всё ценное и желанное для адресата.
- source_word: יָשִׂימוּ בְיָדָם
  choice: они заберут в свои руки
  rationale: Буквально выражение означает «положат в свою руку/руки»; в данном контексте оно описывает завладение имуществом. «Заберут в свои руки» сохраняет образ и ясно передаёт захват.
- source_word: וְלָקָחוּ
  choice: и унесут
  rationale: Передаёт последующее удаление захваченного имущества и завершает угрозу конфискации.
