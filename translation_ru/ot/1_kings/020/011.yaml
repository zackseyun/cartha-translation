base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: ru
  text: 'И царь Израиля ответил: «Скажите ему: „Пусть тот, кто опоясывается, не хвалится, как тот, кто распоясывается“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть опоясывающийся не хвалится, как распоясывающийся». Пословица противопоставляет того, кто лишь готовится к битве, тому, кто завершил её и снимает снаряжение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: И царь Израиля ответил
  rationale: Естественная русская передача обычной еврейской формулы введения ответной реплики; буквальное «ответил и сказал» здесь звучало бы тяжеловесно.
- source_word: דַּבְּרוּ
  choice: Скажите ему
  rationale: Форма множественного числа обращена к посланникам; адресат сообщения подразумевается контекстом и естественно выражен местоимением «ему».
- source_word: אַל יִתְהַלֵּל
  choice: Пусть ... не хвалится
  rationale: 'Передаёт отрицательное волеизъявление и возвратное значение глагола: самоуверенно хвалиться или похваляться.'
- source_word: חֹגֵר
  choice: тот, кто опоясывается
  rationale: Сохраняет лаконичный образ оригинала и его подразумеваемую военную обстановку, не добавляя отсутствующее в еврейском тексте слово «доспехи».
- source_word: כִּמְפַתֵּחַ
  choice: как тот, кто распоясывается
  rationale: 'Передаёт контраст с опоясыванием: один лишь готовится к сражению, другой снимает снаряжение после него. Русская пара «опоясывается — распоясывается» сохраняет форму пословицы.'
