lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Простая повествовательная форма от הלך; «пошёл» естественно передаёт последовательность действий.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое и привычное соответствие еврейской сопряжённой конструкции.
- source_word: עַל בֵּיתוֹ
  choice: к себе домой
  rationale: При глаголе движения עַל здесь обозначает направление. «К себе домой» естественно по-русски и не уточняет без необходимости, что речь именно о дворце.
- source_word: סַר
  choice: угрюмый
  rationale: В сочетании с זָעֵף обозначает мрачное внутреннее недовольство; «угрюмый» сохраняет этот оттенок без неясного буквализма.
- source_word: וְזָעֵף
  choice: и разгневанный
  rationale: Слово выражает раздражение или гнев; «разгневанный» ясно передаёт более явный эмоциональный оттенок второго определения.
- source_word: וַיָּבֹא
  choice: и пришёл
  rationale: Прямое повествовательное соответствие глаголу בוא, сохраняющее координацию исходного текста.
- source_word: שֹׁמְרוֹנָה
  choice: в Самарию
  rationale: Направительный суффикс ה указывает движение к Самарии; по-русски это естественно выражается винительным падежом с предлогом «в».
