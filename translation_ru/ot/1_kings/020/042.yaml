  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: ru
  text: 'И он сказал ему: «Так говорит Яхве: за то, что ты отпустил из своих рук человека, которого Я обрёк на уничтожение[a], твоя жизнь будет вместо его жизни, а твой народ — вместо его народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека, находившегося под Моим заклятием». Еврейское слово חֵרֶם обозначает того, кто по Божьему суду предназначен к уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом.
- source_word: יַעַן
  choice: за то, что
  rationale: Естественно вводит причину вынесенного приговора и сохраняет причинную связь.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: ты отпустил из своих рук
  rationale: Глагол означает отпустить или освободить; выражение «из своих рук» сохраняет еврейский образ власти и удержания, не добавляя идеи побега.
- source_word: אִישׁ חֶרְמִי
  choice: человека, которого Я предал уничтожению
  rationale: 'Передаёт форму с суффиксом первого лица и судебно-религиозный смысл חֵרֶם: человек был определён Богом на уничтожение.'
- source_word: וְהָיְתָה נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: твоя жизнь будет вместо его жизни
  rationale: נֶפֶשׁ здесь обозначает жизнь, а תַּחַת выражает замещение; формулировка сохраняет ясный параллелизм приговора.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: а твой народ — вместо его народа
  rationale: Сохраняет синтаксический параллелизм и смысл замещения, опуская повтор связки по нормам русского языка.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и понятная по-русски формула пророческого послания.
theological_decisions:
- issue: Передача терминологии חֵרֶם в пророческом приговоре
  choice: которого Я предал уничтожению
  alternative: находившегося под Моим заклятием
  rationale: Основной текст ясно передаёт, что речь идёт о Божьем судебном решении, а не о личной вражде. Слово «заклятие» сохранено в примечании как более буквальная, но менее прозрачная для современного читателя альтернатива.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием пророческого приговора. Сохранены формула посланника, образ «из своих рук» и строгий параллелизм заключительной части.
