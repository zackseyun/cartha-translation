  text: וַ/יֵּצֵא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יַּ֥ךְ אֶת הַ/סּ֖וּס וְ/אֶת הָ/רָ֑כֶב וְ/הִכָּ֥ה בַ/אֲרָ֖ם מַכָּ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: ru
  text: Тогда царь Израиля выступил, поразил коней и колесницы и нанёс Араму[a] тяжёлый удар.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арамейцам». Еврейское «Арам» может обозначать царство либо его народ и войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: выступил
  rationale: В военном контексте יצא означает выход царя с войском против неприятеля. «Выступил» естественно передаёт этот смысл, не добавляя идеи длительного похода.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямая передача еврейского сопряжённого сочетания; в русском языке определённость выражается контекстом.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה может означать «ударить», «поразить» или «разгромить». «Поразил» сохраняет широту значения и не уточняет результат сверх сказанного.
- source_word: הַסּוּס
  choice: коней
  rationale: Форма единственного числа употреблена собирательно и в данном военном контексте обозначает коней неприятельского войска.
- source_word: הָרָכֶב
  choice: колесницы
  rationale: רכב здесь имеет собирательное значение и обозначает колесницы или колесничное войско; «колесницы» — ясная и естественная передача.
- source_word: וְהִכָּה
  choice: и нанёс
  rationale: Повтор глагола נכה входит в сочетание с однокоренным существительным מַכָּה. Русское «нанёс… удар» естественно передаёт эту конструкцию.
- source_word: בַאֲרָם
  choice: Араму
  rationale: Еврейский текст называет Арам — царство, которое в данном контексте может также подразумевать его войско или народ. Дательный падеж естественно сочетается с выражением «нанести удар».
- source_word: מַכָּה גְדוֹלָה
  choice: тяжёлый удар
  rationale: Буквально выражение означает «великий/сильный удар». «Тяжёлый удар» сохраняет образность и не заменяет её более определённым «разгромом» или «поражением».
