base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: ru
  text: 'Один из сынов пророков[a] сказал своему товарищу по слову Яхве[b]: «Прошу, ударь меня». Но тот отказался его ударить.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из сообщества пророков»; возможно также: «из учеников пророков». Буквально: «из сынов пророков» — обычное обозначение пророческой группы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по повелению Яхве». Выражение может указывать на слово, полученное от Яхве, и на данное им повеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Один человек
  rationale: Естественно вводит нового участника повествования; начальный וְ не требует отдельного русского союза вне более широкого контекста.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: из сынов пророков
  rationale: Сохраняет образное еврейское наименование пророческой группы, не уточняя без достаточных оснований её устройство.
- source_word: רֵעֵהוּ
  choice: своему товарищу
  rationale: Передаёт нейтральное значение רֵעַ и не предполагает близкой дружбы.
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняет еврейскую формулу пророческого полномочия или повеления, не сводя её однозначно к одному из этих оттенков.
- source_word: הַכֵּינִי נָא
  choice: Прошу, ударь меня
  rationale: נכה передано обычным «ударить», а частица נָא — вежливой просьбой «прошу»; будущий результат удара не вносится в этот стих заранее.
- source_word: וַיְמָאֵן ... לְהַכֹּתוֹ
  choice: Но тот человек отказался его ударить
  rationale: Глагол выражает именно отказ; повтор «ударить» сохраняет лексическую связь с просьбой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Истолкование выражения בְּנֵי הַנְּבִיאִים
  choice: сыны пророков
  alternative: сообщество пророков; ученики пророков
  rationale: Основной текст сохраняет форму еврейского выражения, а вероятные значения, описывающие пророческую группу, вынесены в примечание.
