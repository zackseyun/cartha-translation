base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/041.yaml
  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: ru
  text: Он поспешно снял повязку с глаз[a], и царь Израиля узнал, что тот был одним из пророков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское הָאֲפֵר традиционно иногда понимают как «пепел», однако в данном контексте слово, вероятно, обозначает покрытие или повязку на глазах, служившую для изменения внешности.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: поспешно
  rationale: Глагол מהר передаёт поспешность действия; наречие естественно звучит в русском повествовании.
- source_word: וַיָּסַר
  choice: снял
  rationale: В контексте предмета, находившегося на глазах, «снял» точнее и естественнее общего «убрал».
- source_word: הָאֲפֵר
  choice: повязку
  rationale: Хотя обычное значение слова אֵפֶר — «пепел», контекст 3 Цар. 20:38, 41 указывает на предмет, закрывавший глаза и служивший для изменения внешности; «повязка» передаёт эту функцию, а лексическая неоднозначность отмечена в сноске.
- source_word: מֵעַל עֵינָיו
  choice: с глаз
  rationale: Сочетание מן и על буквально обозначает удаление того, что находилось поверх глаз; по-русски это естественно выражается как «с глаз».
- source_word: וַיַּכֵּר אֹתוֹ
  choice: узнал
  rationale: Порода hифиль глагола נכר здесь означает распознать человека; «узнал» — обычное и точное русское соответствие.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое соответствие еврейской сопряжённой конструкции.
- source_word: כִּי
  choice: что
  rationale: 'כִּי вводит содержание узнавания: царь понял, что человек принадлежал к числу пророков.'
- source_word: מֵהַנְּבִאִים
  choice: одним из пророков
  rationale: Предлог מן имеет партитивное значение и указывает на принадлежность к группе.
- source_word: הוּא
  choice: тот был
  rationale: Местоимение относится к узнанному человеку; указательное «тот» устраняет возможную двусмысленность русского местоимения, а прошедшее «был» соответствует повествовательному плану.
