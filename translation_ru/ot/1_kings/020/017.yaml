base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: ru
  text: 'Первыми выступили юноши, состоявшие при начальниках областей. Венадад послал, и ему доложили: «Из Самарии вышли люди».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי
  choice: юноши из свиты
  rationale: נַעַר может обозначать юношу, слугу или приближённого. Сочетание «юноши из свиты» сохраняет указание на их молодость и естественно передаёт принадлежность к окружению начальников.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: начальники областей
  rationale: שָׂרִים обозначает правителей, начальников или военачальников, а מְדִינוֹת — административные области. Контекст допускает военную функцию, но прямо её не уточняет.
- source_word: בָּרִאשֹׁנָה
  choice: первыми
  rationale: Наречие указывает на первенство в последовательности действий; форма «первыми» естественно согласуется с подлежащим во множественном числе.
- source_word: וַיֵּצְאוּ
  choice: выступили
  rationale: Глагол буквально означает «вышли»; в военном контексте «выступили» естественно передаёт выход отряда, не уточняя дальнейший манёвр.
- source_word: וַיִּשְׁלַח
  choice: послал дозорных
  rationale: В еврейском тексте объект глагола «послал» не назван, однако последующее донесение подразумевает людей, отправленных наблюдать. Уточнение вынесено также в примечание.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: и ему доложили
  rationale: Форма Hiphil глагола נגד означает «сообщить, доложить». Русское «доложили» соответствует военной обстановке; отдельное «говоря» перед прямой речью в современном русском избыточно.
- source_word: אֲנָשִׁים יָצְאוּ מִשֹּׁמְרוֹן
  choice: Из Самарии вышли люди
  rationale: Передан прямой порядок смысла без добавления оценки численности или цели вышедших; שֹׁמְרוֹן дано в принятой русской форме «Самария».
- source_word: בֶּן הֲדַד
  choice: Венадад
  rationale: Использована традиционная русская библейская форма имени.
