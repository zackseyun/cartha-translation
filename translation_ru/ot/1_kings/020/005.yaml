  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: ru
  text: 'Посланники вернулись и сказали[a]: «Так говорит Бен-Хадад: „Хотя я и посылал к тебе сказать: ‘Ты должен отдать мне своё серебро и золото, своих жён и сыновей’, —“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо я посылал к тебе сказать…» Еврейская частица כִּי допускает несколько значений; здесь она передана уступительно с учётом усиления требования в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: вернулись
  rationale: Последовательная глагольная форма описывает следующее событие повествования; «вернулись» естественно передаёт значение שוב.
- source_word: הַמַּלְאָכִים
  choice: посланники
  rationale: В военно-политическом контексте речь идёт о людях-посланниках, а не о небесных существах.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена обычная формула передачи слов правителя с настоящим временем внутри повествования.
- source_word: בֶּן הֲדַד
  choice: Бен-Хадад
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: כִּי
  choice: Хотя
  rationale: Частица понята уступительно ввиду усиления требования, завершающегося в следующем стихе; неоднозначность отмечена в сноске.
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: я посылал к тебе сказать
  rationale: Передаёт предшествующую отправку послания без добавления отсутствующего в еврейском тексте дополнения.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: своё серебро и золото
  rationale: Сохранены конкретные названия ценностей; притяжательное местоимение естественно распространяется на однородную пару в русском языке.
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: своих жён и сыновей
  rationale: «Жёны» соответствует контексту, а «сыновья» сохраняет гендерную конкретность בנים.
- source_word: לִי תִתֵּן
  choice: Ты отдашь мне
  rationale: Будущая форма в русском естественно выражает категорическое требование; «отдашь» точнее по ситуации передачи имущества и людей победителю.
theological_decisions:
- issue: Связь כִּי с дальнейшим усилением требования
  choice: Уступительное «хотя» с незавершённой синтаксической конструкцией
  alternative: Причинное «ибо» или утвердительное «ведь»
  rationale: Уступительное прочтение позволяет сохранить связь стиха 5 со стихом 6, где формулируется усиленное требование, не устраняя при этом лексическую неоднозначность частицы.
