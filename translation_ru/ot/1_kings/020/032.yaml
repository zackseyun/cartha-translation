base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: ru
  text: 'Тогда они опоясались мешковиной, возложили на головы верёвки и пришли к царю Израиля. Они сказали: «Твой слуга Бен-Хадад говорит: „Прошу, сохрани мне жизнь“».[a] Царь сказал: «Он ещё жив? Он мой брат».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть живёт, прошу, моя душа (или жизнь)». Иными словами: «Прошу, сохрани мне жизнь».'
    reason: lexical_alternative
  - marker: b
    text: Слова «он мой брат», вероятно, выражают политическое или договорное братство, а не буквальное родство.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ שַׂקִּים בְּמָתְנֵיהֶם
  choice: они опоясались мешковиной
  rationale: Глагол חגר обозначает опоясывание или закрепление вокруг тела, а שַׂקִּים — грубую ткань как знак унижения и скорби. Формулировка сохраняет конкретный образ и звучит естественно по-русски.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: возложили на головы верёвки
  rationale: חֲבָלִים — «верёвки, канаты»; предлог ב здесь описывает их нахождение на головах. «Возложили» передаёт намеренное действие, не уточняя способ расположения верёвок сверх сказанного в тексте.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: В царской дипломатической речи это обычное самоуничижительное обращение; «слуга» соответствует контексту лучше, чем подчёркивающее правовой статус слово «раб».
- source_word: בֶן הֲדַד
  choice: Бен-Хадад
  rationale: Имя передано принятой русской транслитерацией, отражающей составное западносемитское имя.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: прошу, позволь мне остаться в живых
  rationale: 'Буквально: «пусть живёт, прошу, моя жизнь/душа». Русская формулировка естественно передаёт мольбу сохранить жизнь, а буквальный образ отмечен в сноске.'
- source_word: הַעוֹדֶנּוּ חַי
  choice: он ещё жив?
  rationale: Сочетание вопросительной частицы, עוֹד и חַי означает вопрос о том, продолжает ли Бен-Хадад жить.
- source_word: אָחִי הוּא
  choice: он мой брат
  rationale: Прямой перевод сохраняет открытым вопрос, обозначает ли «брат» буквальное родство, политическое равенство или союзническую близость.
theological_decisions:
- issue: Значение слова «брат» в ответе Ахава
  choice: Сохранено буквальное «Он мой брат»
  alternative: «Он мой союзник» или «Он мне как брат»
  rationale: Еврейский текст употребляет обычное слово אָחִי, не поясняя его смысл. Контекст допускает политическое или договорное братство, но замена на толкование устранила бы намеренную смысловую напряжённость.
