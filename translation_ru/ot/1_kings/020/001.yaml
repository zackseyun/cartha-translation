base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: ru
  text: Венадад, царь Арама, собрал всё своё войско, и с ним были тридцать два царя, а также кони и колесницы. Он выступил, осадил Самарию и сражался против неё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и воевал против неё». Еврейское выражение может обозначать как ведение войны в целом, так и непосредственные боевые действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן הֲדַד
  choice: Венадад
  rationale: Начальный союз ו не обязательно передавать отдельным «и» в начале нового повествовательного эпизода. Имя передано в принятой русской библейской форме.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Арам непосредственно передаёт еврейское географическое название и не подменяет его более поздним наименованием «Сирия».
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: собрал всё своё войско
  rationale: קבץ означает «собирать», а חַיִל в данном военном контексте обозначает войско как совокупную силу.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: и с ним были тридцать два царя
  rationale: Естественная русская конструкция ясно передаёт совместное присутствие союзных царей, выраженное אִתּוֹ.
- source_word: וְסוּס וָרָכֶב
  choice: а также кони и колесницы
  rationale: Еврейские собирательные формы в единственном числе естественно передаются русским множественным числом; конкретные военные образы сохранены.
- source_word: וַיַּעַל
  choice: Он выступил
  rationale: В контексте военного похода עלה обозначает движение войска к цели; «выступил» естественнее по-русски, чем буквальное «поднялся», без добавления идеи нападения.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: осадил Самарию
  rationale: צור על в военном контексте означает окружить город и держать его в осаде.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: стал сражаться против неё
  rationale: Форма глагола לחם с предлогом ב обозначает ведение боевых действий против города; «стал сражаться» передаёт продолженное действие после начала осады и не усиливает смысл до однозначного «штурмовал».
