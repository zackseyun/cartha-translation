base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: ru
  text: 'И слуги царя Арама сказали ему[a]: «Их боги — боги гор, поэтому они были сильнее нас. Но если мы сразимся с ними на равнине, то непременно окажемся сильнее их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их Бог — бог гор…» В еврейском тексте употреблены формы множественного числа («боги»), отражающие языческое представление арамеев о Боге Израиля.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: слуги
  rationale: Прямое соответствие слову עבד в придворном контексте; слово может обозначать и царских приближённых, но «слуги царя» сохраняет исходный образ без излишнего уточнения должности.
- source_word: אֲרָם
  choice: Арам
  rationale: Передано как древнее собственное имя, а не более поздним географическим названием «Сирия».
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  choice: их боги — боги гор
  rationale: Множественное число сохраняет языческое, политеистическое представление арамеев о Боге Израиля и формальную неоднозначность אֱלֹהִים.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Естественно и точно передаёт причинно-следственную связь.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: они оказались сильнее нас
  rationale: Глагол חזק с מן выражает сравнительную силу; «оказались» естественно описывает результат предшествующего сражения.
- source_word: וְאוּלָם
  choice: но
  rationale: Кратко и естественно обозначает переход к противопоставленной стратегии.
- source_word: נִלָּחֵם אִתָּם
  choice: если мы сразимся с ними
  rationale: В данном контексте форма выражает предлагаемое действие, которое служит условием уверенного прогноза.
- source_word: בַּמִּישׁוֹר
  choice: на равнине
  rationale: Передаёт ровную местность и ясно противопоставляет её горам.
- source_word: אִם לֹא
  choice: непременно
  rationale: Идиоматическое сочетание здесь выражает усиленное заверение, а не буквальное отрицательное условие.
- source_word: נֶחֱזַק מֵהֶם
  choice: окажемся сильнее их
  rationale: Сохраняет сравнительное значение и лексический повтор с предыдущим употреблением חזק.
theological_decisions:
- issue: Как передать арамейское описание Бога Израиля
  choice: «их боги — боги гор»
  alternative: «их Бог — бог гор»
  rationale: Высказывание передаёт не позицию повествователя, а политеистическое заблуждение арамеев. Множественное число соответствует грамматической форме и сохраняет богословское напряжение, не исправляя речь персонажей.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Синтаксис прост и понятен; сохранены контраст «горы — равнина», повтор сравнительной силы и уверенный тон арамейских слуг.
