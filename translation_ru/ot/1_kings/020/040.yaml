base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: ru
  text: 'Пока твой слуга был занят то тем, то другим[a], его уже не было[b]. Тогда царь Израиля сказал ему: «Таков твой приговор[c]: ты сам его вынес».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занимался то здесь, то там». Еврейский оборот означает, что человек был занят разными делами или в разных местах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а его нет». То есть порученный охране человек больше не находился там.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Таково решение по твоему делу». Царь применяет к говорящему меру суда, которую тот сам изложил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Почтительное самообозначение при обращении к царю; «раб» здесь могло бы неоправданно подчеркнуть несвободный статус.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: был занят то тем, то другим
  rationale: Естественно передаёт еврейский оборот о занятости разными делами, не уточняя, чем именно занимался говорящий.
- source_word: וְהוּא אֵינֶנּוּ
  choice: того человека не стало
  rationale: Передаёт буквальную идею отсутствия («его нет») в данном контексте, не добавляя прямо, что человек убежал; указательное «того» проясняет смену референта после слов «твой слуга».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямая и привычная передача титула и определительного сочетания.
- source_word: מִשְׁפָּטְךָ
  choice: твой приговор
  rationale: В судебном контексте слово обозначает решение или меру суда; «приговор» естественно сочетается с последующим «вынес».
- source_word: אַתָּה חָרָצְתָּ
  choice: ты сам его вынес
  rationale: Сохраняет эмфатическое אַתָּה («ты сам») и судебный смысл глагола חרץ — определить, постановить.
