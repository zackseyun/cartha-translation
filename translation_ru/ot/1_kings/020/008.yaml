  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: ru
  text: 'И сказали ему все старейшины и весь народ: «Не слушай и не соглашайся».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не повинуйся и не давай согласия». Еврейские глаголы могут означать соответственно «слушать / повиноваться» (שׁמע) и «быть готовым / соглашаться» (אבה).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; русское «и сказали» естественно сохраняет связь с предыдущим событием.
- source_word: אֵלָיו
  choice: ему
  rationale: В еврейском тексте стоит местоимение, поэтому имя Ахава не вводится из контекста.
- source_word: כָּל הַזְּקֵנִים
  choice: все старейшины
  rationale: В данном контексте זְקֵנִים обозначает руководителей общины, а не просто пожилых мужчин.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: עָם обозначает более широкую общность людей наряду со старейшинами; единственное число «весь народ» естественно по-русски.
- source_word: אַל תִּשְׁמַע
  choice: Не слушай
  rationale: שׁמע может означать «слушать» или «повиноваться»; основной текст сохраняет более непосредственное и менее истолковывающее значение.
- source_word: וְלֹא תֹאבֶה
  choice: и не соглашайся
  rationale: אבה выражает готовность или согласие; в контексте ответа на требование естественно передаётся как «не соглашайся».
