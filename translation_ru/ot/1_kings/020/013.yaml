base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: ru
  text: 'И вот, один пророк подошёл к Ахаву, царю Израиля, и сказал: «Так говорит Яхве: видел ли ты всё это огромное войско?[a] Вот, сегодня Я отдам его в твои руки, и ты узнаешь, что Я — Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё это огромное множество»; еврейское слово означает многочисленное скопление людей, здесь — вражеские силы.'
    reason: 'Лексическая альтернатива: основной текст уточняет военный референт по контексту, тогда как примечание сохраняет более широкое значение הָמוֹן.'
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет повествовательный указатель и оттенок внезапного появления, оставаясь естественным для современного русского языка.
- source_word: נָבִיא אֶחָד
  choice: один пророк
  rationale: Передаёт неопределённость лица и формально отражает אֶחָד; в данном контексте по-русски естественно вводит ранее не названного пророка.
- source_word: נִגַּשׁ אֶל
  choice: подошёл к
  rationale: Точно и естественно передаёт значение приближения к человеку.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет традиционную формулу пророческого посланничества и настоящее время еврейского выражения.
- source_word: הֲרָאִיתָ
  choice: видишь ли ты
  rationale: Хотя форма является перфектом, в ситуации находящейся перед Ахавом угрозы русский презенс естественно передаёт указание на обозримое войско; вариант «видел ли ты» также грамматически возможен.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: всё это огромное войско
  rationale: הָמוֹן буквально обозначает множество или скопление; военный контекст позволяет ясно передать референт словом «войско», а «огромное» естественно выражает גָּדוֹל применительно к численности.
- source_word: הִנְנִי נֹתְנוֹ
  choice: Вот, Я отдам его
  rationale: «Вот» сохраняет эмфатическую частицу, а русский совершенный вид в будущем передаёт близкое и уверенное божественное действие, выраженное причастием.
- source_word: בְיָדְךָ
  choice: в твои руки
  rationale: Сохраняет прозрачную еврейскую идиому передачи во власть адресата.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: и ты узнаешь, что Я — Яхве
  rationale: Передаёт результат божественного избавления, не уточняя сверх текста, означает ли «узнаешь» первоначальное знание или опытное признание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога и соответствует принятому для проекта решению.
- issue: Смысл формулы וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: «ты узнаешь, что Я — Яхве» без дополнительного толкования
  alternative: «ты признаешь, что Я — Яхве»
  rationale: Глагол ידע допускает знание, осознание и признание через пережитое действие. «Узнаешь» сохраняет эту смысловую широту и напряжение, особенно поскольку Ахав уже не впервые слышит о Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Пророческая формула и повтор имени Яхве сохранены; устаревшие обороты вроде «се» и «предам» не используются.
