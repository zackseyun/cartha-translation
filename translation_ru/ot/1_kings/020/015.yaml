  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: ru
  text: 'И он провёл смотр молодых людей при начальниках областей; их было двести тридцать два. После них он провёл смотр весь народ — всех сынов Израиля[a]: их было семь тысяч.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех израильтян». В еврейском тексте буквально: «всех сынов Израиля» — мужское родственно-народное обозначение народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: провёл смотр
  rationale: В военном контексте глагол обозначает учёт и организацию людей для выступления; «провёл смотр» передаёт больше, чем простое «пересчитал».
- source_word: נַעֲרֵי
  choice: молодых людей, состоявших при
  rationale: נַעַר может означать юношу, слугу или помощника. Формулировка сохраняет возрастной оттенок и связь с начальниками, не определяя точнее их социальный статус.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: начальниках областей
  rationale: שַׂר — руководитель или должностное лицо, а מְדִינָה — административная область. «Начальники областей» естественно звучит по-русски и не навязывает исключительно военное значение.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: двести тридцать два
  rationale: Прямая передача числительного.
- source_word: וְאַחֲרֵיהֶם
  choice: после них
  rationale: Сохраняет конкретное указание на последовательность смотра двух групп.
- source_word: כָּל הָעָם
  choice: всего народа
  rationale: Сохраняет широкое значение «народ», не заменяя его более узким словом «войско».
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: всех сынов Израиля
  rationale: Формально сохраняет еврейское родственно-народное выражение; общеупотребительный смысл разъяснён в сноске.
- source_word: שִׁבְעַת אֲלָפִים
  choice: семь тысяч
  rationale: Прямая передача числительного.
