  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: ru
  text: Семь дней одни стояли лагерем напротив других. На седьмой день началось сражение, и сыны Израиля[a] за один день сразили сто тысяч пеших воинов[b] Арама[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пехотинцев». Буквально речь идёт о воинах, сражающихся пешими.'
    reason: lexical_alternative
  - marker: c
    text: То есть арамеев или Арамейского царства; в еврейском тексте стоит собственное имя «Арам».
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: стояли лагерем
  rationale: Глагол חנה означает расположиться или стоять лагерем. В данном контексте длительности русское «стояли лагерем» естественно передаёт положение двух войск в течение семи дней.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: одни ... напротив других
  rationale: Сохраняет лаконичное противопоставление двух войск и пространственное значение נֹכַח, не вводя отсутствующих в тексте названий сторон.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: На седьмой день
  rationale: Естественная русская передача древнееврейской повествовательной формулы без архаического и стилистически избыточного «и было».
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: началось сражение
  rationale: Буквально сражение «приблизилось», но в военном контексте оборот обозначает вступление сторон в бой. Выбранная формулировка ясна и не добавляет сведений об исходе.
- source_word: וַיַּכּוּ
  choice: сразили
  rationale: נכה обозначает нанесение поражающего удара и в военном рассказе обычно подразумевает гибель. «Сразили» сохраняет военную силу глагола, не сводя его к более общему «победили».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт мужское множественное выражение «сыновья/сыны Израиля» и уместно в рассказе о войске; более привычный вариант «израильтяне» указан в примечании.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнееврейское собственное имя царства и народа; «Сирия» было бы позднейшим географическим соответствием, а не прямой передачей текста.
- source_word: מֵאָה אֶלֶף רַגְלִי
  choice: сто тысяч пеших воинов
  rationale: רַגְלִי буквально обозначает воина, сражающегося пешим. Формулировка понятнее широкому читателю, чем термин «пехота», и сохраняет числовое выражение.
- source_word: בְּיוֹם אֶחָד
  choice: за один день
  rationale: Русский предлог «за» естественно выражает срок, в пределах которого произошло описанное поражение.
theological_decisions:
- issue: Мужская форма בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранена явная мужская форма исходного текста, особенно уместная применительно к боевому составу войска; при этом примечание даёт естественный корпоративный эквивалент.
- issue: Собственное имя אֲרָם и обозначение народа/царства
  choice: воины Арама
  alternative: арамейские воины
  rationale: Основной текст сохраняет собственное имя без замены его более поздним названием «Сирия». Родительная конструкция по-русски естественно показывает, что речь идёт о войске Арама, не устраняя возможную референцию имени одновременно к царству и народу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Архаическая повествовательная формула устранена, но выражение «сыны Израиля» сохранено ради формы и военного контекста оригинала. Синтаксис сделан ясным и ритмичным; подлинная широта значения имени «Арам» пояснена, а не молча сведена только к народу или только к государству.
