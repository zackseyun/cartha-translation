  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: ru
  text: 'Тогда царь Израиля созвал всех старейшин страны и сказал: «Прошу вас, поймите и посмотрите: этот человек замышляет зло. Ведь он потребовал у меня моих жён, моих сыновей, моё серебро и моё золото, и я ему не отказал».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי הָאָרֶץ
  choice: старейшин страны
  rationale: Передаёт общественно-политический статус старейшин и значение הָאָרֶץ в данном контексте как территории царства.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Прошу вас, поймите и посмотрите
  rationale: Сохраняет два императива и смягчающую частицу נָא; естественная русская формулировка без устранения риторического повтора.
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: этот человек замышляет зло
  rationale: מְבַקֵּשׁ буквально обозначает стремление или поиск, а רָעָה — зло, беду или вред; «замышляет зло» естественно передаёт враждебное намерение, сохраняя нравственно-негативную широту выражения.
- source_word: שָׁלַח אֵלַי לְ
  choice: потребовал у меня
  rationale: В контексте посольского требования конструкция означает, что Венадад прислал требование относительно перечисленного имущества и семьи; буквальное «послал ко мне за» по-русски менее ясно.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: и я ему не отказал
  rationale: Идиома буквально означает «не удержал от него»; выбранная передача ясно выражает согласие Ахава на требование, не утверждая сверх текста, что всё уже было фактически передано.
theological_decisions:
- issue: Смысл רָעָה в обвинении Венадада
  choice: зло
  alternative: беду / неприятностей
  rationale: Еврейское слово допускает как нравственное зло, так и бедствие. Здесь речь о злонамеренном притязании; «зло» сохраняет более широкий и прямой смысл оригинала, не сводя обвинение лишь к созданию неприятностей.
- issue: Степень исполнения первого требования
  choice: я ему не отказал
  alternative: я ничего от него не удержал
  rationale: Фраза описывает отсутствие отказа, но контекст не требует понимать её как уже завершённую физическую передачу жён, сыновей и ценностей.
translation_notes:
  register: Современный литературный русский язык; речь царя звучит настойчиво и официально, но остаётся понятной обычному читателю. Синтаксический параллелизм оригинала по возможности сохранён.
