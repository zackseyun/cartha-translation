  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: ru
  text: Каждый сразил своего противника[a]. Арамеи обратились в бегство, и израильтяне преследовали их. Но Бен-Хадад, царь Арама, спасся верхом на коне, с всадниками[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый поразил своего человека», то есть противника, стоявшего перед ним.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спасся верхом на коне вместе со всадниками». Еврейский текст может описывать Бен-Хадада как бегущего верхом и сопровождаемого конными воинами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: сразил
  rationale: В военном контексте נכה обозначает нанесение поражающего удара. «Сразил» передаёт решительность действия, но не утверждает однозначно, что противник был убит.
- source_word: אִישׁ אִישׁוֹ
  choice: каждый ... своего противника
  rationale: Буквально «каждый — своего человека»; по контексту речь о противнике, стоявшем напротив. Естественная русская формулировка передаёт смысл идиомы без неясного буквализма.
- source_word: אֲרָם
  choice: арамеи
  rationale: Хотя буквально стоит название «Арам», множественное число сказуемого показывает, что имеются в виду арамейские воины. В следующей фразе титул Бен-Хадада передан буквально как «царь Арама».
- source_word: וַיָּנֻסוּ
  choice: побежали
  rationale: Глагол נוס означает бегство от опасности; «побежали» естественно описывает обращение войска в бегство.
- source_word: וַיִּרְדְּפֵם
  choice: погнались за ними
  rationale: רדף в военном повествовании значит преследовать отступающего врага; русское выражение звучит естественно и сохраняет динамику сцены.
- source_word: וַיִּמָּלֵט
  choice: спасся
  rationale: В данном контексте глагол означает успешное избавление от непосредственной опасности. «Спасся» не вводит здесь утверждения о сверхъестественном избавлении.
- source_word: בֶּן הֲדַד
  choice: Бен-Хадад
  rationale: Имя передано транслитерацией с дефисом в соответствии с нормами русского библейского именословия.
- source_word: עַל סוּס
  choice: верхом на коне
  rationale: Передаёт и предлог עַל, и единственное число סוּס, сохраняя конкретный образ.
- source_word: וּפָרָשִׁים
  choice: в сопровождении всадников
  rationale: פָרָשִׁים обозначает конных воинов. Такая передача естественно понимает союз как указание на сопровождавших царя всадников, сохраняя возможную синтаксическую неоднозначность в примечании.
