  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל הָ/עִֽירָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/002.yaml
  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: ru
  text: И послал он вестников в город[a], к Ахаву, царю Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к городу». Направительное окончание в еврейском слове указывает на движение по направлению к городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал он
  rationale: Форма wayyiqtol продвигает повествование; русский союз «и» сохраняет последовательность, а прошедшее время естественно передаёт действие.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В военно-политическом контексте речь идёт о людях, посланных передать сообщение, а не о небесных существах.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает адресата, к которому были посланы вестники.
- source_word: אַחְאָב
  choice: Ахаву
  rationale: Имя передано в принятой русской библейской форме и поставлено в дательном падеже по управлению глагола «послал».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царю Израиля
  rationale: Сопряжённая конструкция обозначает царский титул Ахава; приложение согласовано с именем в дательном падеже.
- source_word: הָעִירָה
  choice: в город
  rationale: Направительное окончание -ה указывает на движение по направлению к городу; «в город» естественно передаёт это значение, не утверждая сверх необходимого точную степень проникновения внутрь.
