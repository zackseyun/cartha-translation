base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: ru
  text: 'И сказал Ахав: «Кем?» Он ответил: «Так говорит Яхве: юношами[a] областных начальников». Ахав спросил: «Кто начнёт бой?» Он ответил: «Ты».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугами» или «помощниками областных начальников». Еврейское слово может обозначать не только юношей, но и помощников или приближённых, состоящих на службе у начальников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: Через кого?
  rationale: Предлог בְּ с вопросительным מִי указывает на посредника или исполнителя. «Через кого?» естественно передаёт вопрос о том, чьими силами Яхве совершит обещанное.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена устойчивая пророческая формула и торжественный тон исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: בְּנַעֲרֵי
  choice: через юношей
  rationale: נַעַר буквально обозначает юношу, но также может относиться к слуге, помощнику или состоящему при начальнике человеку. Основной текст сохраняет прямое значение, а служебный оттенок указан в сноске.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: областных начальников
  rationale: שָׂרִים обозначает начальников или должностных лиц, а מְדִינוֹת — административные области. Формулировка естественна по-русски и не приписывает им неопределённого в тексте военного ранга.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Кто начнёт сражение?
  rationale: Сочетание אָסַר с מִלְחָמָה идиоматически означает начать или завязать бой; буквальное «свяжет сражение» по-русски затемнило бы смысл.
- source_word: אָתָּה
  choice: Ты
  rationale: Отдельное местоимение второго лица передаёт краткий и подчёркнутый ответ Ахаву.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Повторяющееся וַיֹּאמֶר передано сочетанием «сказал», «ответил» и «спросил», чтобы ясно обозначить смену говорящих без неестественной для русского монотонности.
