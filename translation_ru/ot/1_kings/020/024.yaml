  text: 'И сделай вот что: убери царей, каждого с его места, и поставь вместо них правителей областей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: И сделай вот что
  rationale: Передаёт вынесенное вперёд дополнение и повелительную форму естественной современной русской конструкцией; דָּבָר здесь означает предписываемое действие, а не только «слово».
- source_word: הָסֵר
  choice: удали
  rationale: Побудительная форма выражает устранение царей с занимаемых ими мест; «удали» сохраняет широту значения, не уточняя без основания, были ли они полностью лишены царского достоинства.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: царей — каждого с его места
  rationale: Сохраняет определённое множественное число и распределительное אִישׁ; «место» допускает как буквальное расположение, так и должность либо командный пост.
- source_word: וְשִׂים
  choice: и поставь
  rationale: «Поставь» естественно передаёт שׂים в значении назначения людей на место прежних руководителей.
- source_word: פַּחוֹת
  choice: областных правителей
  rationale: Термин обозначает назначаемых административных правителей областей или провинций; этот вариант яснее простого «правителей» и не сужает должность до чисто военного звания.
- source_word: תַּחְתֵּיהֶם
  choice: вместо них
  rationale: В данном контексте выражение обозначает замену одних руководителей другими; «вместо них» передаёт это непосредственно и не повторяет слово «место».
