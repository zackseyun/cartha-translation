base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: ru
  text: Они выступили в полдень, а Бен-Хадад пил допьяна в шалашах[a]; с ним были тридцать два царя, помогавшие ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в укрытиях» или «в навесах»; буквально: «в шалашах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: они выступили
  rationale: Глагол יצא обозначает выход; в данном военном контексте «выступили» естественно передаёт движение из города, не добавляя идеи внезапной вылазки.
- source_word: בַּצָּהֳרָיִם
  choice: в полдень
  rationale: Форма обозначает середину дня; «в полдень» — точный и естественный русский эквивалент.
- source_word: וּבֶן הֲדַד
  choice: когда Бен-Хадад
  rationale: Союз ו здесь вводит сопутствующее обстоятельство, одновременное с выходом отряда. Имя передано близко к еврейской форме.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: пил допьяна
  rationale: Причастие שֹׁתֶה выражает продолжающееся действие, а שִׁכּוֹר — состояние опьянения. «Пил допьяна» сохраняет оба элемента и не добавляет не названный в тексте напиток.
- source_word: בַּסֻּכּוֹת
  choice: в шатрах
  rationale: סֻכּוֹת буквально означает временные укрытия или шалаши; в обстановке царского военного лагеря «шатры» звучит естественно, а буквальные варианты отмечены в сноске.
- source_word: הוּא וְהַמְּלָכִים
  choice: вместе с ... царями
  rationale: Оборот явно включает Бен-Хадада и сопровождавших его царей; по-русски это естественно передаётся конструкцией «вместе с».
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: тридцатью двумя царями
  rationale: Еврейская конструкция с числительным и существительным в единственном числе по нормам русского языка передаётся существительным во множественном числе.
- source_word: עֹזֵר אֹתוֹ
  choice: помогавшими ему
  rationale: Причастие от עזר обозначает продолжающуюся помощь или поддержку. Русское согласование во множественном числе ясно относит характеристику к тридцати двум царям.
