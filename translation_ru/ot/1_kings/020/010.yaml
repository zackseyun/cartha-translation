  to: 'Бен-Хадад послал ему сказать[a]: «Пусть боги сделают со мной то и ещё больше, если праха Самарии хватит на горсти для всех людей, которые у моих ног».'
  rationale: Убраны невыраженное усиление «хотя бы» и интерпретативное упоминание разрушения Самарии. Идиома «у моих ног» восстановлена в переводе для сохранения образа и диапазона смысла; сноска объясняет её без догматизации. Начальная русская формулировка сделана естественной для передачи дипломатического послания.
