base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: ru
  text: 'Бен-Хадад послал ему сказать[a]: «Пусть боги сделают со мной то и ещё больше, если праха Самарии хватит на горсти для всех людей, которые у моих ног».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если праха Самарии хватит на горсти для всего народа, который у моих ног». Выражение «у моих ног» может обозначать людей, находящихся в подчинении царя или в его свите; это хвастливая гипербола о многочисленности его людей.'
    reason: Поясняет буквальный образ и возможное значение идиомы, не добавляя невыраженного разрушения Самарии.
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: послал к нему сказать
  rationale: В контексте дипломатического обмена передаёт посылку сообщения, не вводя явно отсутствующих в еврейском тексте «посланников».
- source_word: בֶּן הֲדַד
  choice: Бен-Хадад
  rationale: Принята ясная русская транслитерация личного имени.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Пусть боги сделают со мной то и ещё больше
  rationale: Сохраняет форму клятвы-самопроклятия и множественное число при речи языческого царя.
- source_word: אִם
  choice: если
  rationale: Сохраняет эллиптическую условную конструкцию древнееврейской клятвенной формулы, не раскрывая её посредством лишнего толкования.
- source_word: יִשְׂפֹּק
  choice: хватит
  rationale: Естественно передаёт значение достаточности в современном русском языке.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: праха Самарии
  rationale: «Прах» сохраняет образ измельчённой земли и соответствует возвышенно-повествовательному регистру.
- source_word: לִשְׁעָלִים
  choice: хотя бы по горсти
  rationale: Передаёт контекстуально наиболее вероятное значение «горсти/углубления ладоней»; «хотя бы» делает смысл хвастливой гиперболы прозрачным.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: для всех людей, идущих за мной
  rationale: Естественно передаёт идиому «у моих ног» как обозначение войска или свиты, следующей за царём.
theological_decisions:
- issue: Значение אֱלֹהִים в клятве языческого царя
  choice: боги
  alternative: Бог
  rationale: Множественное согласование יַעֲשׂוּן и личность говорящего, Бен-Хадада, указывают на его божеств; перевод не приписывает ему обращение к Богу Израиля.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Клятвенная формула и гипербола сохранены, тогда как идиома «у моих ног» ясно передана как следование за царём.
