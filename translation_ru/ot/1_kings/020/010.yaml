  source_fidelity: 'Основной смысл передан верно: Бен-Хадад произносит формулу самопроклятия и хвастливо говорит о недостаточности праха Самарии для своих людей. Однако «хотя бы» не выражено в еврейском тексте и усиливает высказывание, а пояснение с «после разрушения Самарии» вносит в стих неявную конкретизацию. Идиому «у моих ног» безопаснее сохранить в самом переводе, поскольку она передаёт как подчинённость, так и нахождение в свите/войске.'
