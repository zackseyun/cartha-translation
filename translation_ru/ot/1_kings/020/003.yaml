  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: ru
  text: 'И он сказал ему: «Так говорит Бен-Хадад: твоё серебро и твоё золото — мои; твои жёны и твои лучшие сыновья[a] — мои».'
