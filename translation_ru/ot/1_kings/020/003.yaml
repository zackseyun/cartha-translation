lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: И он сказал ему
  rationale: Сохранена обычная повествовательная формула с косвенным дополнением; местоимения не уточняются именами, которых нет в еврейском тексте.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула передачи официального послания; настоящее время естественно вводит слова, передаваемые от имени отправителя.
- source_word: בֶּן הֲדַד
  choice: Бен-Хадад
  rationale: Имя передано близко к еврейской форме и оформлено по современным русским правилам транслитерации составных семитских имён.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: Твоё серебро и твоё золото
  rationale: Сохранены конкретные названия ценностей, а כֶּסֶף не обобщено до значения «деньги».
- source_word: לִי הוּא
  choice: мои
  rationale: Именная конструкция выражает притязание на обладание; русское множественное число согласовано с двумя предметами.
- source_word: וְנָשֶׁיךָ
  choice: и твои жёны
  rationale: В семейном контексте נָשִׁים обозначает жён, а не женщин вообще.
- source_word: וּבָנֶיךָ
  choice: из твоих сыновей
  rationale: בָּנִים передано гендерно точно как «сыновья»; конструкция с «из» естественно выражает выделение тех, кого прилагательное характеризует как лучших.
- source_word: הַטּוֹבִים
  choice: лучшие
  rationale: В контексте требования и захвата прилагательное указывает на наиболее ценных или отборных, а не обязательно на нравственно добрых.
- source_word: לִי הֵם
  choice: мои
  rationale: Повтор притязания сохранён ради параллелизма и нажима исходной речи.
