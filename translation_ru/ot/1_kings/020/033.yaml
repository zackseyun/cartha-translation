  text: וְ/הָ/אֲנָשִׁים֩ יְנַחֲשׁ֨וּ וַֽ/יְמַהֲר֜וּ וַ/יַּחְלְט֣וּ הֲ/מִמֶּ֗/נּוּ וַ/יֹּֽאמְרוּ֙ אָחִ֣י/ךָ בֶן הֲדַ֔ד וַ/יֹּ֖אמֶר בֹּ֣אוּ קָחֻ֑/הוּ וַ/יֵּצֵ֤א אֵלָי/ו֙ בֶּן הֲדַ֔ד וַֽ/יַּעֲלֵ֖/הוּ עַל הַ/מֶּרְכָּבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: ru
  text: 'Люди выжидали благоприятного предзнаменования[a] и тут же ухватились за сказанное им[b]: «Бен-Хадад — твой брат». Ахав сказал: «Ступайте, приведите его». Тогда Бен-Хадад вышел к нему, и Ахав велел ему подняться в колесницу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пытались угадать знак». Еврейский глагол может обозначать гадание по предзнаменованиям; здесь, вероятно, речь о том, что они настороженно ждали благоприятного намёка в словах Ахава.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение не вполне ясно. По смыслу они поспешно подхватили слова Ахава и восприняли их как благоприятную уступку.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поднял его в колесницу». В еврейском употреблена каузативная форма: Ахав сделал так, чтобы Бен-Хадад поднялся в колесницу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: выжидали благоприятного предзнаменования
  rationale: Глагол נחשׁ в данной форме связан с распознаванием предзнаменований. По контексту слуги не совершают описанный обряд гадания, а настороженно ждут благоприятного намёка в словах Ахава. Добавление «благоприятного» передаёт направленность их ожидания.
- source_word: וַיְמַהֲרוּ
  choice: тут же
  rationale: Передаёт быстроту их реакции естественным современным русским выражением.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: ухватились за сказанное им
  rationale: Трудное еврейское выражение, по-видимому, означает, что слуги немедленно подхватили слова Ахава и использовали их как решающую уступку. Объект действия, не выраженный прямо, восстановлен из контекста.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранено буквальное «брат», отражающее дипломатическое обращение, которым слуги воспользовались.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Ступайте, приведите его
  rationale: В контексте повеление означает привести Бен-Хадада к Ахаву. Русское «приведите» яснее передаёт требуемое действие, чем буквальное «возьмите».
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: велел ему подняться в колесницу
  rationale: Каузативная форма עלה означает, что Ахав распорядился, чтобы Бен-Хадад поднялся в колесницу; перевод не создаёт лишнего впечатления, будто Ахав физически поднял его.
- source_word: הַמֶּרְכָּבָה
  choice: колесницу
  rationale: Сохранён определённый по контексту образ царской колесницы без добавления отсутствующего в еврейском тексте притяжательного местоимения.
