  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: ru
  text: Сыны Израиля были созваны и снабжены всем необходимым и выступили им навстречу. Сыны Израиля расположились станом напротив них, словно два маленьких стада коз[a], а арамеи заполнили землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно две חֲשִׂפֵי коз». Значение редкого еврейского слова не вполне ясно; вероятно, оно обозначает две небольшие группы или маленькие стада. Образ подчёркивает контраст с многочисленным арамейским войском.'
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: были созваны
  rationale: Форма от פקד в военном контексте означает сбор и учёт войска; «были созваны» естественно передаёт мобилизацию, не сводя смысл лишь к пересчёту.
- source_word: וְכָלְכְּלוּ
  choice: снабжены всем необходимым
  rationale: Глагол כלכל здесь, вероятно, указывает на обеспечение войска припасами или средствами для похода. Развёрнутая формулировка ясна современному читателю и сохраняет некоторую широту значения.
- source_word: לִקְרָאתָם
  choice: им навстречу
  rationale: Оборот означает движение навстречу кому-либо; военный контекст сам сообщает оттенок противостояния, поэтому его не требуется усиливать словом «сразиться».
- source_word: נֶגְדָּם
  choice: напротив них
  rationale: Точно передаёт пространственное положение двух противостоящих станов.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: словно два маленьких стада коз
  rationale: Редкое слово חֲשִׂפֵי обозначает небольшие отделившиеся группы; перевод сохраняет пастушеский образ и подчёркивает малочисленность израильтян.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: а арамеи заполнили всю землю
  rationale: Коллективное название אֲרָם естественно передано как народ и войско — «арамеи». Союз «а» выражает резкий контраст, не делая еврейское waw более противительным, чем оно есть; «всю» идиоматично передаёт полноту образа.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохраняется традиционное заветное наименование народа и формальная текстура оригинала; выражение понятно в современном русском библейском регистре.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Традиционное «сыны Израиля» сохранено как значимое коллективное наименование; архаичные военные слова вроде «ополчены» и «провиантированы» исключены. Повтор оригинала сохранён, как и контраст между двумя малочисленными группами Израиля и заполнившими землю арамеями.
