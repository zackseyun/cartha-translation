  verdict: revise
  source_fidelity: Смысл двух условных вариантов и повторённый приказ переданы верно. Однако לְמִלְחָמָה означает «для войны / с военными намерениями», а «на битву» в русском скорее предполагает отправление к конкретному сражению и неоправданно сужает значение.
  naturalness: «И он сказал» нейтральнее и естественнее для современного литературного русского, чем инверсия «И сказал он». «С мирными намерениями» ясно выражает намерение, заложенное в לְשָׁלוֹם, без возможной неоднозначности оборота «с миром».
  terminology: «Взять живыми» — точная и устойчивая передача приказа захватить, не убивая. «Для войны» сохраняет широкий смысл מִלְחָמָה и не навязывает различие между войной и отдельной битвой.
