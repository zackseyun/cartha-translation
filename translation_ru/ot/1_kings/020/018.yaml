  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: ru
  text: 'И он сказал: «Если они вышли с мирными намерениями, возьмите их живыми; и если они вышли для войны, возьмите их живыми».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Стандартная повествовательная форма от אמר вводит прямую речь; русский перевод сохраняет ход еврейского повествования.
- source_word: אִם
  choice: если
  rationale: Условная частица вводит два возможных случая; «если» естественно передаёт конструкцию, не превращая её в косвенный вопрос.
- source_word: לְשָׁלוֹם
  choice: с миром
  rationale: Сочетание לְ с שָׁלוֹם здесь обозначает мирное намерение; «с миром» естественно по-русски и сохраняет смысл цели или характера выхода.
- source_word: יָצָאוּ
  choice: вышли
  rationale: Форма обозначает уже совершившийся выход; простой прошедший вид в русском естественно передаёт наблюдаемую ситуацию.
- source_word: תִּפְשׂוּם
  choice: возьмите их
  rationale: תפשׂ в военном контексте означает схватить или захватить; «возьмите» вместе с «живыми» звучит как ясный приказ взять в плен.
- source_word: חַיִּים
  choice: живыми
  rationale: Предикативное обозначение состояния, в котором людей надлежит взять; творительный падеж является естественной русской конструкцией.
- source_word: וְאִם
  choice: и если
  rationale: Сохраняется простое сочинение двух условий без добавления более сильного противопоставления.
- source_word: לְמִלְחָמָה
  choice: на битву
  rationale: מִלְחָמָה обозначает битву или войну; «на битву» сохраняет параллель с указанием цели выхода и подходит непосредственной военной сцене.
- source_word: חַיִּים תִּפְשׂוּם
  choice: живыми возьмите их
  rationale: Во втором приказе сохранён необычный порядок слов оригинала, выдвигающий «живыми» вперёд и подчёркивающий одинаковый исход при обоих условиях.
