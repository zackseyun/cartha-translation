  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: ru
  text: 'И слуги его сказали ему: «Вот, мы слышали, что цари дома Израиля — милостивые цари. Давай опояшемся вретищем, возложим верёвки себе на головы и выйдем к царю Израиля. Может быть, он сохранит тебе жизнь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: опущено как отдельная формула; побуждение передано естественным началом прямой речи
  rationale: Буквальное «вот, пожалуйста» здесь звучит по-русски неестественно; сочетание служит для привлечения внимания и смягчения предложения.
- source_word: מַלְכֵי חֶסֶד
  choice: милостивые цари
  rationale: Сохраняет характеристику царей как проявляющих милость, не сужая חֶסֶד до формальной доброты или договорной верности.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: опояшемся вретищем
  rationale: Передаёт траурно-покаянный знак и расположение ткани вокруг бёдер/талии естественным библейским русским выражением.
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: возложим верёвки себе на головы
  rationale: Сохраняет необычный конкретный образ подчинения или готовности принять казнь, не объясняя его внутри текста.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: сохранит тебе жизнь
  rationale: Идиома означает позволить адресату остаться в живых; выбор естественен по-русски и сохраняет объект во втором лице единственного числа.
theological_decisions:
- issue: Характер милости израильских царей
  choice: милостивые цари
  alternative: цари, проявляющие верность
  rationale: В данном повествовательном контексте речь о пощаде побеждённого царя, поэтому значение милосердия контекстуально первично, хотя широкий смысл חֶסֶד полностью не исчерпывается.
- issue: Символика вретища и верёвок
  choice: оставить образы без толкования
  alternative: добавить «в знак покорности»
  rationale: Исходный текст показывает действия, но прямо не формулирует их символическое значение; пояснение в основном тексте сняло бы возможную культурную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. «Вретище» сохранено как точный и узнаваемый термин; синтаксис прямой речи упрощён для естественности, а повторительная настойчивость נָא передана формой совместного побуждения «давай».
