base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: ru
  text: 'Пророк подошёл к царю Израиля и сказал ему: «Иди, укрепись, уясни и обдумай, что тебе делать[b], потому что, когда год завершит свой круг[a], царь Арама[c] пойдёт на тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при возвращении (или повороте) года». Это выражение могло обозначать время возобновления военных походов; поэтому его иногда переводят как «следующей весной».'
    reason: cultural_note
  - marker: b
    text: 'Или: «что ты будешь делать». Еврейская форма буквально имеет будущее значение, но в данном контексте, вероятно, указывает на то, что царю следует предпринять для подготовки.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционный перевод: «царь Сирии»; в еврейском тексте — «Арам».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Обычное и естественное соответствие глаголу נגשׁ со значением приближения.
- source_word: הִתְחַזַּק
  choice: укрепись
  rationale: 'Возвратная форма передаёт значение хитпаэля: царю следует укрепить себя и подготовиться к новому столкновению.'
- source_word: וְדַע וּרְאֵה
  choice: уясни и обдумай
  rationale: Сохраняются два побуждения, но сочетание передано естественно по-русски как призыв трезво понять положение и тщательно продумать действия.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: что тебе делать
  rationale: Форма буквально указывает на то, что царь будет делать; в контексте она выражает практическое решение о необходимых приготовлениях, не уточняя чрезмерно степень долженствования.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: когда год завершит свой круг
  rationale: Передаёт образ возвращения или поворота года и избегает анахроничной ассоциации с современным календарным Новым годом.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Сохраняется непосредственно названный в еврейском тексте Арам, а не позднейшее традиционное географическое обозначение Сирия.
- source_word: עֹלֶה עָלֶיךָ
  choice: пойдёт на тебя
  rationale: Естественное русское военное выражение передаёт движение войска против царя; причастие в данном предсказании имеет будущее значение.
