- from: 'И сказал Соломон: «Ты явил великую верную любовь рабу Твоему Давиду, отцу моему, потому что он ходил пред Тобой в верности, праведности и чистосердечии перед Тобой. И Ты сохранил для него эту великую верную любовь и дал ему сына, который сидит на его престоле, как это и есть сегодня[a]».'
  to: 'И сказал Соломон: «Ты явил великую верную любовь рабу Твоему Давиду, отцу моему, потому что он ходил пред Тобою в верности, праведности и искренности сердца с Тобою. И Ты сохранил для него эту великую верную любовь и дал ему сына, восседающего на его престоле, как это и есть сегодня[a]».'
