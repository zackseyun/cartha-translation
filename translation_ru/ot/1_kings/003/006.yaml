  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: ru
  text: 'И сказал Соломон: «Ты явил великую верную любовь рабу Твоему Давиду, отцу моему, потому что он ходил пред Тобою в верности, праведности и искренности сердца с Тобою. И Ты сохранил для него эту великую верную любовь и дал ему сына, восседающего на его престоле, как это и есть сегодня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как в этот день» — еврейское выражение, указывающее на нынешнее положение дел как на очевидное подтверждение сказанного.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Передаёт устойчивую, деятельную верность Бога в отношениях с Давидом, сохраняя также смысл любви; выражение естественнее по-русски, чем отвлечённая «заветная верность».
- source_word: עָשִׂיתָ עִם
  choice: явил
  rationale: Естественно передаёт еврейское сочетание «сделал с… хесед» как проявление любви и верности по отношению к человеку.
- source_word: עַבְדְּךָ
  choice: рабу Твоему
  rationale: В молитвенной и царской речи обозначает подчинённое Богу положение Давида; традиционная форма остаётся понятной современному читателю.
- source_word: כַּאֲשֶׁר
  choice: потому что
  rationale: В данном контексте союз естественно вводит основание сказанного, хотя возможен и сравнительный оттенок «так как / поскольку».
- source_word: הָלַךְ לְפָנֶיךָ
  choice: ходил пред Тобой
  rationale: Сохраняет библейскую метафору образа жизни в присутствии Бога и остаётся понятным по-русски.
- source_word: בֶּאֱמֶת
  choice: в верности
  rationale: Здесь אֱמֶת характеризует надёжность и верность Давида; это значение естественно сочетается с праведностью и чистосердечием.
- source_word: בִּצְדָקָה
  choice: в праведности
  rationale: Прямо передаёт нравственную правоту поведения Давида перед Богом.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: в чистосердечии
  rationale: Ёмко и естественно выражает прямоту, цельность и искренность сердца, избегая неестественного буквального «прямота сердца».
- source_word: עִמָּךְ
  choice: перед Тобой
  rationale: Буквально «с Тобой»; в русском предложении «перед Тобой» яснее связывает внутреннюю цельность Давида с его отношением к Богу, хотя несколько сглаживает отдельный реляционный оттенок предлога.
- source_word: וַתִּשְׁמָר לוֹ
  choice: сохранил для него
  rationale: Передаёт продолжение и исполнение прежде явленной верной любви к Давиду.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: сына, который сидит на его престоле
  rationale: Причастие обозначает уже осуществившееся воцарение сына, а не только будущую возможность.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Передаёт указание на нынешнее положение дел как видимое подтверждение Божьей верности.
theological_decisions:
- issue: Значение חֶסֶד в контексте Божьего отношения к Давиду
  choice: верная любовь
  alternative: заветная верность; неизменная любовь; милость
  rationale: Контекст включает Божью устойчивую верность Давиду и её династическое осуществление, но само слово не является техническим термином со значением «завет». «Верная любовь» сохраняет одновременно реляционный и деятельный аспекты, не сводя смысл только к чувству или юридическому обязательству.
- issue: Связь Божьей милости и поведения Давида
  choice: сохранена причинная формулировка «потому что» без дальнейшего богословского пояснения
  alternative: «так как» или сравнительное «как он ходил»
  rationale: כַּאֲשֶׁר допускает контекстуальный причинный оттенок. Перевод не уточняет сверх текста, означает ли это заслугу, соответствие отношениям или описание Давидовой верности.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранена метафора «ходил пред Тобой»; местоимения, обращённые к Богу, написаны с прописной буквы. Повтор חֶסֶד воспроизведён одинаково. Единственный знак сноски [a] помещён непосредственно после выражения, которое он поясняет.
