id: 1KI.3.10
reference: 1 Kings 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: ru
  text: И это было угодно Господу[a], потому что Соломон попросил об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И это было хорошо в глазах Господа».'
    reason: Сохраняет для читателя еврейскую оценочную идиому и более формальный вариант передачи וַיִּיטַב ... בְּעֵינֵי.
lexical_decisions:
- source_word: וַיִּיטַב
  choice: было угодно
  rationale: В данном контексте глагол יטב выражает положительную оценку просьбы. Русское «было угодно» естественно передаёт смысл, не сводя его лишь к эмоциональному «понравилось».
- source_word: הַדָּבָר
  choice: это
  rationale: Существительное דָּבָר имеет широкий смысл («слово, дело, обстоятельство»); местоименное «это» естественно отсылает к просьбе Соломона в предыдущем контексте.
- source_word: בְּעֵינֵי
  choice: Господу
  rationale: Буквально оборот означает «в глазах Господа», но в современном русском сочетание «было угодно Господу» ясно и естественно передаёт тот же оценочный смысл. Буквальная метафора сохранена в примечании.
- source_word: אֲדֹנָי
  choice: Господу
  rationale: В исходном тексте стоит אֲדֹנָי («Господь»), а не тетраграмматон יהוה; поэтому используется обычное написание титула «Господь».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину положительной оценки просьбы.
- source_word: שָׁאַל
  choice: попросил
  rationale: В контексте просьбы о даре мудрости глагол שׁאל естественно передаётся как «попросил».
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная русская форма имени.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: об этом
  rationale: Фраза буквально означает «это дело/это». Русское «попросил об этом» сохраняет отсылку к содержанию просьбы и звучит естественно.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Масоретский текст содержит אֲדֹנָי, а не יהוה; написание «ГОСПОДЬ», обычно служащее условной передачей тетраграмматона, здесь было бы неточным.
translation_notes:
  register: Современный литературный русский язык; формулировка проста и достойна, а тяжеловесная буквальная идиома вынесена в примечание.
