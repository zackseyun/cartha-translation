  text: 'Тогда царь сказал: «Принесите мне меч». И принесли меч к царю.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное; в русском контексте уже известный участник естественно называется без отдельного средства выражения артикля.
- source_word: קְחוּ לִי
  choice: Принесите мне
  rationale: Хотя לקח буквально означает «взять», здесь повелительная форма с לִי идиоматически означает веление доставить предмет говорящему.
- source_word: חָרֶב
  choice: меч
  rationale: Первое употребление без артикля вводит предмет; русский язык естественно передаёт это формой «меч» без дополнительного неопределённого местоимения.
- source_word: וַיָּבִאוּ
  choice: И принесли
  rationale: Последовательная повествовательная форма обозначает исполнение приказа; неопределённо-личная русская конструкция естественно передаёт глагол во множественном числе без названного субъекта.
- source_word: הַחֶרֶב
  choice: меч
  rationale: Артикль указывает на уже упомянутый меч; в русском определённость ясна из повторного упоминания.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: к царю
  rationale: Буквально «перед царя / пред лицом царя»; после глагола принесения современное «к царю» естественно выражает доставку в его присутствие, не создавая впечатления, будто меч положили непосредственно перед ним.
