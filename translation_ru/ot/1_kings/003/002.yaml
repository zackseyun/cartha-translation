base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: ru
  text: Однако народ приносил жертвы на высотах[a], потому что до тех дней ещё не был построен дом для имени Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на культовых возвышенностях». «Дом для имени Яхве» означает храм, который предстояло построить в Иерусалиме.'
    reason: Поясняет термин «высоты» и храмовой смысл буквального выражения «дом для имени Яхве», сохраняя оба в основном тексте.
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничение к предыдущей положительной оценке Соломона и сохраняет связь со следующим стихом.
- source_word: הָעָם
  choice: народ
  rationale: Обычное и естественное соответствие; речь идёт о народе в целом, без обязательного противопоставления правителям.
- source_word: מְזַבְּחִים
  choice: приносил жертвы
  rationale: Причастная форма обозначает продолжавшуюся или обычную практику; русское несовершенное прошедшее передаёт этот аспект.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: Сохраняет традиционный культовый термин для возвышенных мест поклонения, не сводя его однозначно к местным святилищам.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно выражает причинную связь: жертвы приносили на высотах из-за отсутствия построенного дома.'
- source_word: לֹא נִבְנָה בַיִת
  choice: ещё не был построен дом
  rationale: Сохраняет пассивную форму и буквальное значение בַיִת «дом»; «ещё» естественно показывает незавершённость к указанному времени.
- source_word: לְשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Сохраняет богословски значимое упоминание имени и в современном русском естественнее, чем буквальное «для имени».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно личное имя Бога, представленное тетраграмматоном.
- source_word: עַד הַיָּמִים הָהֵם
  choice: до тех дней
  rationale: Близко передаёт пространный еврейский временной оборот и остаётся понятным по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Следует ли истолковать בַיִת прямо как «храм»
  choice: дом
  alternative: храм
  rationale: Еврейский текст говорит «дом», а выражение «во имя Яхве» и контекст указывают на храм; основной текст не должен устранять эту образность.
- issue: Оценка жертвоприношений на высотах
  choice: оставлена невыраженной
  alternative: явно осудительная формулировка
  rationale: Стих объясняет существование практики отсутствием построенного дома, но сам по себе не формулирует её однозначную нравственную оценку; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис простой и доступный; выражения «на высотах», «дом» и «во имя Яхве» сохраняют ключевые образы и формулировки исходного текста.
