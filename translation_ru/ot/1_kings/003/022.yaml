  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: ru
  text: 'Но другая женщина сказала[a]: «Нет! Мой сын жив, а твой сын мёртв». А эта сказала: «Нет! Твой сын мёртв, а мой сын жив». Они говорили перед царём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более разговорно: «Мой сын жив, а твой сын мёртв… твой сын мёртв, а мой сын жив». В основном тексте сохранено еврейское противопоставление живого и мёртвого ребёнка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: сказала
  rationale: Обычный повествовательный глагол речи; «сказала» естественно передаёт реплику в споре.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: другая женщина
  rationale: Речь идёт о второй из двух женщин; «женщина» не привносит отсутствующего здесь значения «жена».
- source_word: לֹא כִי
  choice: Нет!
  rationale: Сочетание выражает резкое возражение; краткое «Нет!» естественно передаёт силу отрицания.
- source_word: בְּנִי הַחַי
  choice: мой сын — живой
  rationale: Субстантивированное определение с артиклем противопоставляет двух детей; конструкция «— живой» сохраняет контраст с «— мёртвый» и звучит по-русски естественнее, чем «живущий».
- source_word: וּבְנֵךְ הַמֵּת
  choice: а твой сын — мёртвый
  rationale: Параллельная конструкция сохраняет подчёркнутое противопоставление живого и мёртвого ребёнка; союз передан как «а» по функции контраста.
- source_word: וְזֹאת אֹמֶרֶת
  choice: А эта говорила
  rationale: «Эта» сохраняет указательную силу זֹאת, а имперфектное причастие речи в данном контексте естественно передано как «говорила», подчёркивая встречное утверждение.
- source_word: וַתְּדַבֵּרְנָה
  choice: Так они спорили
  rationale: Буквально глагол означает «говорили», но контекст взаимных противоречащих заявлений позволяет естественное русское «спорили»; «так» передаёт итоговое повествовательное развитие.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: Точная и естественная передача выражения; имя Соломона не добавляется, поскольку в еврейском тексте стоит «царь».
