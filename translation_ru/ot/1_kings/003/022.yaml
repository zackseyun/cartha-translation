  naturalness: «А эта говорила» в данном месте по-русски создаёт неуместный оттенок длительности или привычности. Краткие сказуемые «жив, мёртв» более естественны для утверждений о состоянии ребёнка, чем «сын — живой / мёртвый», и сохраняют резкий параллелизм реплик. «Они говорили перед царём» нейтрально и литературно.
