base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: ru
  text: И весь Израиль услышал о решении, которое вынес царь, и стал бояться царя[a], потому что увидел, что в нём есть Божья мудрость, чтобы вершить правосудие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнился трепета перед царём» или «стал почитать царя». Еврейское выражение может обозначать страх, благоговейный трепет или почтение перед признанной властью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы творить суд» или «чтобы выносить решения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ כָל יִשְׂרָאֵל
  choice: И весь Израиль услышал
  rationale: Сохраняется собирательное обозначение народа и обычное значение שׁמע; сочетание «услышал о решении» естественно передаёт распространение вести.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: о решении, которое вынес царь
  rationale: מִשְׁפָּט здесь обозначает судебное решение, а сочетание с שׁפט естественно передаётся по-русски выражением «вынести решение».
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: стал бояться царя
  rationale: ירא с מִפְּנֵי прямо выражает страх перед царём, но допускает также оттенки благоговейного трепета и почтения; неоднозначность отмечена в сноске.
- source_word: חָכְמַת אֱלֹהִים
  choice: Божья мудрость
  rationale: Сохраняется явное указание на Бога; естественная русская конструкция передаёт принадлежность или происхождение мудрости без обезличивания.
- source_word: בְּקִרְבּוֹ
  choice: в нём
  rationale: Кратко и естественно сохраняет образ мудрости, пребывающей внутри Соломона.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: чтобы вершить правосудие
  rationale: Инфинитив выражает способность или цель судебной деятельности; «вершить правосудие» сохраняет юридический и царский контекст.
theological_decisions:
- issue: Значение אֱלֹהִים в описании мудрости Соломона
  choice: Божья мудрость
  alternative: божественная мудрость
  rationale: Еврейский текст прямо называет Бога, поэтому личное указание не заменено более общим прилагательным.
- issue: Оттенок וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: стал бояться царя
  alternative: исполнился трепета перед царём; стал почитать царя
  rationale: Основное значение страха сохранено в тексте, а возможное сочетание страха, трепета и почтения не устранено и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным и юридическим регистром. Единственное число «услышал», «стал», «увидел» согласовано с собирательным выражением «весь Израиль»; слово «народ» добавлено во второй причинной части для ясности референта без изменения смысла.
