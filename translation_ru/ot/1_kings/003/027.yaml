translation_notes:
  register: Современный литературный русский язык; царское распоряжение передано ясно, властно и без архаической тяжеловесности. Избыточная для русского формула «ответил и сказал» свёрнута до естественного «ответил», а усиленный запрет сохранён в основном тексте.
