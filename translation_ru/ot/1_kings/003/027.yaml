  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: ru
  text: 'Тогда царь ответил: «Отдайте живого ребёнка ей и ни в коем случае не убивайте его: она — его мать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Тогда царь ответил
  rationale: Обычная древнееврейская формула введения ответной речи буквально сочетает «ответил» и «сказал». В современном русском одно «ответил» естественно передаёт её смысл, не создавая тяжеловесного повтора.
- source_word: תְּנוּ לָהּ
  choice: Отдайте ... ей
  rationale: Императив множественного числа обращён к исполнителям царского решения. «Отдайте» в данном контексте естественнее, чем буквальное «дайте», и ясно выражает передачу ребёнка женщине.
- source_word: הַיָּלוּד הַחַי
  choice: живого ребёнка
  rationale: יַלוּד обозначает рождённого, здесь младенца или ребёнка; הַחַי уточняет, что он жив. Контекстуально точное и естественное русское соответствие — «живого ребёнка».
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: и ни в коем случае не убивайте его
  rationale: Сочетание абсолютного инфинитива и личной формы каузативного глагола מות усиливает запрет. Выражение «ни в коем случае» сохраняет эмфазу, а «не убивайте» прямо и естественно передаёт смысл.
- source_word: הִיא אִמּוֹ
  choice: она — его мать
  rationale: Безглагольное предложение отождествляет эту женщину с матерью ребёнка. Тире естественно оформляет такое именное сказуемое в русском языке.
