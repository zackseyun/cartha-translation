  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: ru
  text: 'В Гаваоне Яхве явился Соломону ночью во сне[a], и Бог сказал: «Проси, что Мне дать тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «во сне ночи», то есть во сне, приснившемся ночью.'
    reason: Пояснение буквальной конструкции и её естественной передачи по-русски.
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: В Гаваоне
  rationale: Предлог בְּ обозначает местонахождение; «в Гаваоне» естественно передаёт место действия по-русски.
- source_word: נִרְאָה
  choice: явился
  rationale: Нифаль глагола ראה в данном контексте обозначает божественное явление; «явился» точно и естественно передаёт этот смысл без уточнения способа явления.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: אֶל שְׁלֹמֹה
  choice: Соломону
  rationale: Предлог אֶל указывает на того, кому было явление; русский дательный падеж передаёт это естественно.
- source_word: בַּ/חֲלוֹם הַ/לָּיְלָה
  choice: ночью во сне
  rationale: Еврейское выражение буквально означает «во сне ночи»; выбранный порядок слов естественен для современного русского языка и сохраняет оба элемента — сон и ночное время.
- source_word: וַ/יֹּאמֶר
  choice: и ... сказал
  rationale: Повествовательная форма с וַ последовательно продвигает рассказ; простой союз «и» не добавляет лишней временной интерпретации.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Сохранена смена обозначения с יהוה на אֱלֹהִים, явно присутствующая в исходном тексте.
- source_word: שְׁאַל
  choice: Проси
  rationale: Прямой императив допускает открытый выбор просимого; «проси» кратко и точно передаёт форму и смысл.
- source_word: מָה אֶתֶּן לָךְ
  choice: что Мне дать тебе
  rationale: Формулировка сохраняет вопросительно-волевой оттенок еврейского «что Я дам тебе?» после повеления «проси», не вводя идеи обязанности или заранее определённого дара.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как имя; транслитерация сохраняет различие между личным именем и титулом.
- issue: Смена יהוה на אֱלֹהִים в пределах одного стиха
  choice: Яхве ... Бог
  alternative: Бог ... Бог или Яхве ... Яхве
  rationale: Сохранение двух разных обозначений прозрачно отражает лексику еврейского текста и не сглаживает возможное смысловое или стилистическое напряжение.
- issue: Смысл מָה אֶתֶּן לָךְ после императива שְׁאַל
  choice: «Проси, что Мне дать тебе»
  alternative: «Проси у Меня, чего хочешь»
  rationale: Выбранный вариант не добавляет отсутствующих в оригинале слов «у Меня» и «хочешь» и сохраняет открытый вопрос о даре.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; необычность заключительной реплики умеренно сохранена ради близости к еврейскому оригиналу.
