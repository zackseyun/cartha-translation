  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: локатив «В Гаваоне», божественное явление, адресата Соломона, ночной сон, а также последующее обращение. Смена обозначений יהוה → אֱלֹהִים корректно сохранена как «Яхве ... Бог». Реплика «Проси, что Мне дать тебе» передаёт открытую конструкцию שְׁאַל מָה אֶתֶּן לָךְ без добавления «чего хочешь» или «у Меня».'
