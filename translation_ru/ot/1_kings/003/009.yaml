base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: ru
  text: Даруй же рабу Твоему сердце, умеющее слушать[a], чтобы судить Твой народ и различать добро и зло, ибо кто способен судить этот Твой великий[b] народ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимающее сердце»; буквально: «слушающее сердце».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «великий», буквально означает «тяжёлый» или «весомый»; здесь оно выражает значимость народа и тяжесть ответственности за управление им.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Даруй же
  rationale: Форма в контексте молитвы выражает просьбу, вытекающую из предшествующих слов. Частица «же» естественно передаёт эту связь, а «даруй» соответствует возвышенному, но понятному регистру обращения к Богу.
- source_word: לְעַבְדְּךָ
  choice: рабу Твоему
  rationale: Это традиционное смиренное самообозначение царя перед Богом; «раб» сохраняет образ отношений с божественным Царём и уместен в русском библейском регистре.
- source_word: לֵב שֹׁמֵעַ
  choice: сердце, способное слушать
  rationale: Передаёт буквально выраженный образ слушающего сердца, одновременно ясно указывая на восприимчивость, внимательность и готовность откликаться, необходимые для мудрого суда.
- source_word: לִשְׁפֹּט
  choice: судить
  rationale: Глагол охватывает судебные и управленческие функции, но «судить» сохраняет его основное значение и связь с последующим различением добра и зла.
- source_word: עַמְּךָ
  choice: Твой народ
  rationale: Сохраняет обращение к Богу и принадлежность народа Ему, включая заветный и политический оттенки.
- source_word: לְהָבִין
  choice: различать
  rationale: В данной породе глагол обозначает проницательное распознавание; «различать» точно соответствует судебному контексту.
- source_word: בֵּין טוֹב לְרָע
  choice: добро и зло
  rationale: Сохраняет нравственно-оценочную формулу оригинала, не сужая её до более узкого «правильное и неправильное».
- source_word: כִּי מִי יוּכַל
  choice: ведь кто способен
  rationale: Передаёт основание просьбы и риторическое признание недостаточности человека перед поставленной задачей.
- source_word: הַכָּבֵד
  choice: великий
  rationale: Еврейское слово буквально значит «тяжёлый, весомый», а здесь указывает на величину, значимость народа и тяжесть ответственности за него. «Великий» естественно звучит по-русски, а буквальный оттенок сохранён в сноске.
theological_decisions:
- issue: Антропологический образ в просьбе Соломона
  choice: сердце, способное слушать
  alternative: понимающее сердце
  rationale: В древнееврейском представлении сердце является средоточием мышления и воли. Сохранение слова «сердце» и образа слушания не сводит просьбу лишь к интеллектуальной способности; традиционное истолковывающее прочтение приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Заглавные буквы в местоимениях «Твоему», «Твой» поддерживают принятую русскую традицию почтительного обращения к Богу. Синтаксис остаётся ясным для современного читателя, а ключевые еврейские образы сохранены без излишней архаизации.
