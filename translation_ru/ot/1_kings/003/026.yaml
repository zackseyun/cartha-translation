base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: ru
  text: 'Тогда женщина, чей сын был жив, сказала царю — ведь её охватила жалость к сыну[a]: «Прошу, государь мой, отдайте ей живого ребёнка и ни в коем случае не убивайте его![b]» А другая сказала: «Пусть он не достанется ни мне, ни тебе. Разрубите его надвое!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально говорит, что её чувства сострадания «разгорелись» к сыну; это идиома сильной материнской жалости.
    reason: cultural_note
  - marker: b
    text: 'Еврейская конструкция усиливает запрет: «не убивайте его ни в коем случае».'
    reason: lexical_note
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: её охватила глубокая жалость
  rationale: Еврейская идиома описывает сильное внутреннее движение сострадания. Этот перевод естественно передаёт напряжённость материнской жалости, не воспроизводя буквально образ разгоревшихся внутренностей.
- source_word: בִּי אֲדֹנִי
  choice: Прошу, государь мой
  rationale: בִּי служит возгласом настойчивой мольбы, а אֲדֹנִי выражает почтительное обращение к царю. «Государь мой» уместно в историческом повествовании и понятно современному читателю.
- source_word: הַיָּלוּד הַחַי
  choice: живого младенца
  rationale: יַלוּד обозначает рождённого ребёнка; по ближайшему контексту речь идёт о младенце. Выбор сохраняет противопоставление живого и умершего ребёнка.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: только ни в коем случае не убивайте его
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает запрет. «Ни в коем случае» передаёт эту эмфазу, а «только» выражает отчаянный поворот просьбы.
- source_word: וְזֹאת אֹמֶרֶת
  choice: А другая сказала
  rationale: Указательное местоимение контрастно обозначает вторую женщину; явное «другая» звучит по-русски естественно.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Пусть он не достанется ни мне, ни тебе
  rationale: Подразумеваемый субъект — мальчик. Такая формулировка сохраняет состязательный смысл обладания и отрицательную волю говорящей.
- source_word: גְּזֹרוּ
  choice: Разрубите его надвое
  rationale: Краткий повелительный глагол означает «разрежьте, разделите». Дополнения «его надвое» восстанавливаются из непосредственного контекста и ясно передают жестокий приказ.
