  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: ru
  text: 'Вот, Я исполнил то, о чём ты просил.[a] Вот, Я дал тебе мудрое и проницательное сердце: никого подобного тебе не было до тебя, и после тебя не появится подобного тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я сделал согласно твоим словам».'
    reason: Сноска сохраняет прозрачность более буквальной формы כִּדְבָרֶיךָ, тогда как основной текст естественно выражает контекстуальный смысл просьбы.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохранена функция частицы, привлекающей внимание и придающей Божьему изречению торжественно-декларативный характер; в современном русском «вот» естественнее буквальных «смотри» или «узри».
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: Я исполнил то, о чём ты просил
  rationale: 'Буквально: «Я сделал согласно твоим словам». В контексте ответа на просьбу Соломона «исполнил то, о чём ты просил» ясно и естественно передаёт смысл, не меняя характера завершённого Божьего действия.'
- source_word: נָתַתִּי לְךָ
  choice: Я дал тебе
  rationale: Прямо передаёт נתן и завершённость действия, выраженную перфектом.
- source_word: לֵב
  choice: сердце
  rationale: 'Сохранён древнееврейский антропологический образ: сердце обозначает внутренний центр мышления, суждения, воли и чувств, а не только эмоции.'
- source_word: חָכָם וְנָבוֹן
  choice: мудрое и проницательное
  rationale: «Мудрое» передаёт способность верно судить и управлять, а «проницательное» — понимание и различение; сочетание сохраняет два близких, но не тождественных качества.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: подобного тебе не было прежде тебя
  rationale: Передаёт сравнительную конструкцию и беспримерность данного Соломону дара без превращения придаточного в указание цели.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: и после тебя не появится подобного тебе
  rationale: В данном контексте קום означает появление человека в истории; «не появится» звучит по-русски естественно и сохраняет будущую направленность обещания.
theological_decisions:
- issue: Характер обещанного превосходства Соломона
  choice: Сравнение в контексте относится к дарованным ему мудрости и проницательности.
  alternative: Абсолютное превосходство Соломона во всех отношениях.
  rationale: Ближайший контекст определяет предмет сравнения как «мудрое и проницательное сердце». Перевод сохраняет связь сравнения с этим даром и не расширяет утверждение до не выраженного в тексте всеобщего превосходства.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «Вот» сохранён. Двоеточие естественно связывает дар с последующим описанием его беспримерности.
