base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: ru
  text: 'Соломон любил Яхве, следуя установлениям своего отца Давида, с одним лишь исключением: он приносил жертвы и совершал воскурения на высотах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Высоты» — местные места поклонения, нередко устраивавшиеся на возвышенностях.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: любил
  rationale: Прямо передаёт значение глагола אהב и сохраняет положительную оценку отношения Соломона к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לָלֶכֶת
  choice: и следовал
  rationale: Буквальный образ «ходить» здесь обозначает постоянный образ жизни; «следовал» естественно передаёт эту идиому по-русски и показывает, в чём выражалась любовь Соломона.
- source_word: בְּחֻקּוֹת
  choice: установлениям
  rationale: Сохраняет смысл предписанных норм и постановлений, при этом звучит естественнее современного узкоюридического «уставам».
- source_word: דָּוִד אָבִיו
  choice: своего отца Давида
  rationale: Естественно передаёт еврейское сочетание имени и указания на родство.
- source_word: רַק
  choice: только
  rationale: Вводит ограничение к предшествующей положительной оценке, не усиливая его до безоговорочного осуждения.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: Традиционно и кратко обозначает местные культовые места, часто располагавшиеся на возвышенностях; смысл пояснён в сноске.
- source_word: מְזַבֵּחַ
  choice: приносил жертвы
  rationale: Причастная форма указывает на обычное или повторяющееся действие; русское несовершенное прошедшее сохраняет этот оттенок.
- source_word: וּמַקְטִיר
  choice: и совершал воскурения
  rationale: Передаёт культовое действие как регулярное, не сводя значение непременно только к сжиганию ароматического ладана.
theological_decisions:
- issue: Оценка поклонения Соломона
  choice: Сохранена положительная оценка любви Соломона к Яхве, за которой следует ограничивающее замечание о поклонении на высотах.
  alternative: Понять начало как иронию либо, напротив, считать поклонение на высотах полностью одобренным.
  rationale: Синтаксис сначала выражает одобрение, а затем вводит посредством רַק оговорку. Перевод не снимает напряжение между этими двумя частями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Идиома «ходить в установлениях» передана естественным выражением «следовать установлениям». Формулировка «совершал воскурения» сохраняет культовый оттенок и смысловую широту глагола קטר.
