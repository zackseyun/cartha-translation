  naturalness: Текст звучит современно и ясно. «Посреди ночи» несколько точнее и привычнее для внезапного ночного действия, чем «среди ночи». Конструкция «положила его себе на грудь» естественнее, чем «положила его к себе на грудь».
  terminology: «Твоя служанка» уместно передаёт женскую формулу самоуничижительного обращения к царю. «На грудь» является допустимым контекстуальным выбором для חֵיק; сноска надлежащим образом сохраняет альтернативу «на колени».
