  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: ru
  text: Она встала посреди ночи, взяла моего сына, который был рядом со мной, пока твоя служанка спала, положила его себе на грудь[a], а своего мёртвого сына положила мне на грудь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «себе на колени… мне на колени». Еврейское חֵיק может означать грудь, пазуху или колени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: среди ночи
  rationale: Передаёт значение нахождения внутри ночного времени и естественно звучит в современном русском повествовании.
- source_word: מֵאֶצְלִי
  choice: лежавшего рядом со мной
  rationale: אֵצֶל обозначает близость, «рядом, возле»; добавление «лежавшего» естественно проясняет положение ребёнка в контексте сна, не меняя смысла.
- source_word: וַאֲמָתְךָ יְשֵׁנָה
  choice: пока твоя служанка спала
  rationale: Сохраняет почтительную форму самоназвания женщины перед царём и передаёт её продолжающееся состояние во время действия другой женщины.
- source_word: וַתַּשְׁכִּיבֵהוּ
  choice: положила его
  rationale: Каузатив глагола שׁכב означает «уложить, положить так, чтобы лежал»; выбран естественный русский эквивалент.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: к себе на грудь / мне на грудь
  rationale: חֵיק может обозначать грудь, пазуху или колени. В сцене совместного сна «на грудь» сохраняет телесную близость и материнский контекст; лексическая неоднозначность отмечена в сноске.
- source_word: בְּנָהּ הַמֵּת
  choice: своего мёртвого сына
  rationale: Причастие הַמֵּת употреблено атрибутивно; по-русски естественно передаётся прилагательным «мёртвого».
