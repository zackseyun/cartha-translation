  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: ru
  text: Царь отправился в Гаваон, чтобы принести там жертвы, ибо там находилась главная высота[a]. На том жертвеннике Соломон принёс тысячу всесожжений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великая высота». Еврейское прилагательное может указывать как на величину, так и на особое значение или главенство этого места.'
    reason: Лексическая неоднозначность прилагательного הַגְּדוֹלָה.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Обычная повествовательная форма глагола הלך обозначает движение; «отправился» естественно звучит по-русски и не добавляет отсутствующего в самом глаголе значения подъёма.
- source_word: גִּבְעֹנָה
  choice: в Гаваон
  rationale: Направительное окончание при названии места указывает на движение к Гаваону; по-русски это передаётся предлогом «в» с винительным падежом.
- source_word: לִזְבֹּחַ
  choice: чтобы принести там жертвы
  rationale: Инфинитив זבח выражает цель поездки и обозначает жертвоприношение в общем смысле; множественное «жертвы» естественно в русском контексте и не смешивается с последующим специальным термином «всесожжения».
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: потому что это было великое святилище на высоте
  rationale: במה обозначает культовое место, традиционно называемое «высотой». Сочетание «святилище на высоте» делает историко-религиозный термин понятнее современному читателю, не устраняя его специфики. «Великое» сохраняет возможность понимать הגדולה как указание и на величину, и на значимость.
- source_word: אֶלֶף עֹלוֹת
  choice: тысячу всесожжений
  rationale: עֹלוֹת — специальные жертвы, полностью сжигавшиеся на жертвеннике; точный и устоявшийся русский термин — «всесожжения». Число передано буквально.
- source_word: יַעֲלֶה
  choice: принёс
  rationale: В сочетании со словом עֹלוֹת каузативная форма עלה означает «вознести, принести всесожжения». В данном повествовательном контексте форма лучше понимается как завершённое действие, без добавления непредписанной идеи обычая или многократности.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: на том жертвеннике
  rationale: Фраза прямо обозначает место принесения жертв; указательное местоимение сохранено формой «том».
theological_decisions:
- issue: Передача במה в рассказе о богослужении до постройки храма
  choice: святилище на высоте
  alternative: высота; святилище
  rationale: Выбранная передача сохраняет связь с особым библейским понятием «высота» и одновременно остаётся понятной современному читателю. Она не сглаживает напряжение, связанное с совершением богослужения в таком месте, но и не вносит в стих явной оценки.
- issue: Видо-временное значение יַעֲלֶה
  choice: принёс
  alternative: приносил; обычно приносил
  rationale: Контекст сообщает о тысяче всесожжений, принесённых во время посещения Гаваона. Простое прошедшее время не навязывает тексту значение привычного или неоднократно повторявшегося действия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термины «жертвенник» и «всесожжение» сохранены как точные и широко узнаваемые; менее прозрачное культовое понятие «высота» пояснено внутри выражения «святилище на высоте».
