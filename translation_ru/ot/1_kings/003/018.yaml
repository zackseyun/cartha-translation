base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: ru
  text: На третий день после того, как я родила, родила и эта женщина. Мы были вместе; никого постороннего[a] с нами в доме не было — в доме были только мы вдвоём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого чужого». Еврейское слово может обозначать человека, не принадлежащего к данной группе или домашнему кругу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: На третий день после того, как я родила
  rationale: Повествовательное וַיְהִי естественно передаётся самим продолжением рассказа без отдельного «и было». Конструкция לְ с инфинитивом и суффиксом первого лица здесь обозначает временную точку отсчёта — роды говорящей.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: родила и эта женщина
  rationale: Указательное הַזֹּאת сохраняет подчёркнутую ссылку говорящей на присутствующую женщину, а גַּם естественно передано частицей «и» перед именной группой.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Мы были вместе
  rationale: יַחְדָּו прямо означает «вместе»; значение отсутствия других людей выражено следующей фразой и не добавляется сюда заранее.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: никого постороннего с нами в доме не было
  rationale: זָר обозначает чужого или постороннего, то есть человека, не принадлежащего к данной группе или дому. Русское «никого постороннего» естественно в контексте и сохраняет эту смысловую грань.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: в доме были только мы вдвоём
  rationale: זוּלָתִי вводит исключение, а форма שְׁתַּיִם указывает на двух женщин. Повтор слова «дом» сохранён, как и в еврейском тексте, для подчёркивания отсутствия свидетелей.
