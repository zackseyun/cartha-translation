    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вав с последовательной формой продвигает повествование; «тогда» естественно передаёт смену действия.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное; в русском контексте определённость естественно выражается без артикля.
- source_word: גִּזְרוּ
  choice: Рассеките
  rationale: Множественное повелительное наклонение от גזר обозначает физическое разрубание; «рассеките» прямо, выразительно и соответствует достоинству повествовательного регистра.
- source_word: הַיֶּלֶד הַחַי
  choice: живого ребёнка
  rationale: Прилагательное отличает этого ребёнка от умершего в ближайшем контексте.
- source_word: לִשְׁנָיִם
  choice: надвое
  rationale: Точно и естественно передаёт разделение на две части.
- source_word: וּתְנוּ
  choice: и отдайте
  rationale: Передаёт второе согласованное повеление и последовательность действий; «отдайте» естественно при распределении между двумя претендентками.
- source_word: הַחֲצִי
  choice: половину
  rationale: Естественное русское обозначение каждой из двух частей.
- source_word: לְאַחַת ... לְאֶחָת
  choice: одной ... другой
  rationale: Женские формы числительного относятся к двум женщинам; русская эллиптическая конструкция сохраняет это указание без добавления существительного.
