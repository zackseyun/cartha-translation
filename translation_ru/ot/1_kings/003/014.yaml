base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: ru
  text: И если ты будешь ходить Моими путями, соблюдая Мои установления и заповеди, как ходил Давид, твой отец, то Я продлю твои дни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть продлю твою жизнь.
    reason: Пояснение буквальной еврейской идиомы «продлю твои дни».
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет присоединительный характер условия как продолжения речи Господа.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: ты будешь ходить Моими путями
  rationale: Сохраняет заветную метафору нравственного образа жизни и естественно звучит в русском библейском регистре.
- source_word: לִשְׁמֹר
  choice: соблюдая
  rationale: Передаёт содержание и способ хождения Божьими путями, сохраняя тесную синтаксическую связь.
- source_word: חֻקַּי וּמִצְוֺתַי
  choice: Мои установления и заповеди
  rationale: 'Различает два правовых термина: חֹק как установленное предписание и מִצְוָה как заповедь.'
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: как ходил
  rationale: Сохраняет сравнение и повтор корня הלך, поддерживая образ хождения.
- source_word: דָּוִיד אָבִיךָ
  choice: Давид, отец твой
  rationale: Следует порядку еврейского текста; постановка приложения после имени звучит dignified и ясно.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: то Я продлю дни твои
  rationale: Передаёт условное следствие и буквально сохраняет еврейскую идиому о продолжительности жизни.
theological_decisions:
- issue: Условное обещание долгой жизни в связи с заветным послушанием
  choice: 'Условие и обещание переданы прямо: послушание Соломона связано с продлением его дней.'
  alternative: Истолковать это как безусловное династическое обещание или обобщённое благословение.
  rationale: Еврейский текст грамматически выражает реальное условие וְאִם и конкретное обещание продлить дни; перевод не должен смягчать эту связь или привносить позднейшие богословские схемы.
- issue: Оценка хождения Давида
  choice: Сохранено простое сравнение «как ходил Давид» без пояснений.
  alternative: Уточнить, что речь идёт об общем направлении жизни Давида, несмотря на отдельные грехи.
  rationale: Сам стих оставляет это богословское напряжение без пояснения, поэтому перевод также не разрешает его добавленным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены метафоры «ходить путями» и «продлить дни», а инверсия «Давид, отец твой» и «дни твои» поддерживает достоинство речи без архаических форм.
