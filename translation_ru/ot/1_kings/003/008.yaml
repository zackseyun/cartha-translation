base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: ru
  text: И раб Твой — среди Твоего народа, которого Ты избрал, народа многочисленного[a], столь многочисленного, что его невозможно ни исчислить, ни сосчитать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народа великого».'
    reason: Лексема רַב может обозначать как многочисленность, так и величие; следующий оборот уточняет, что здесь в центре внимания численность.
  - marker: b
    text: 'Буквально: «который не будет исчислен и не будет сосчитан из-за множества».'
    reason: Примечание отражает два параллельных глагола оригинала и причинное значение מֵרֹב.
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: И раб Твой
  rationale: В молитвенном обращении Соломона עֶבֶד выражает смиренное подчинение Богу; «раб» естественно для современного русского библейского регистра и точнее сохраняет силу еврейского слова, чем «слуга».
- source_word: בְּתוֹךְ עַמְּךָ
  choice: среди народа Твоего
  rationale: Передаёт положение Соломона внутри Божьего народа естественно и без излишней буквальности выражения «посреди».
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: который Ты избрал
  rationale: Прямо сохраняет утверждение текста о Божьем избрании народа, не дополняя его позднейшими богословскими выводами.
- source_word: עַם רָב
  choice: народа многочисленного
  rationale: В данном контексте רַב указывает прежде всего на численность, что подтверждается следующим придаточным; «многочисленного» передаёт это яснее, чем многозначное «великого».
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: невозможно ни исчислить, ни сосчитать
  rationale: Сохраняет два близких глагола еврейского параллелизма и выражает практическую невозможность подсчёта.
- source_word: מֵרֹב
  choice: по множеству его
  rationale: 'Формально сохраняет причинное значение: народ невозможно сосчитать вследствие его многочисленности.'
theological_decisions:
- issue: Израиль как избранный Богом народ
  choice: народа Твоего, который Ты избрал
  alternative: избранного Тобою народа
  rationale: Выбранная формулировка непосредственно воспроизводит отдельное относительное придаточное оригинала и сохраняет акцент на действии Бога без богословского расширения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Синтаксис сохраняет торжественность оригинала, но остаётся понятным обычному читателю.
