  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: ru
  text: 'И сказал ему Бог: «За то, что ты просил об этом и не просил себе долгой жизни, не просил себе богатства, не просил жизни своих врагов, но просил себе разумения, чтобы слушать судебные дела, —»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: долгой жизни
  rationale: Буквально «многих дней»; в данном контексте это естественное русское обозначение долголетия.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: жизни своих врагов
  rationale: נֶפֶשׁ здесь означает жизнь; просьба о ней в контексте подразумевает желание завладеть жизнью врагов, то есть их смерти, но перевод сохраняет форму оригинала.
- source_word: הָבִין
  choice: разумения
  rationale: Инфинитив от בין выражает способность понимать и различать; существительное естественно встраивается в русскую конструкцию просьбы.
- source_word: לִשְׁמֹעַ מִשְׁפָּט
  choice: чтобы различать справедливость
  rationale: שׁמע в судебно-царском контексте означает не просто физически слышать, а воспринимать и рассудительно распознавать; מִשְׁפָּט здесь относится к справедливому судебному решению и правосудию.
theological_decisions:
- issue: Значение просьбы Соломона о לִשְׁמֹעַ מִשְׁפָּט
  choice: чтобы различать справедливость
  alternative: чтобы выслушивать судебные дела / чтобы понимать правосудие
  rationale: Выбранная формулировка передаёт данную царю способность распознавать, что справедливо, не сводя выражение ни к одному лишь слушанию дел, ни к абстрактному понятию правосудия.
- issue: «Жизнь врагов» как возможный эвфемизм их смерти
  choice: сохранить «жизни своих врагов»
  alternative: смерти своих врагов
  rationale: Хотя прагматический смысл — просить гибели врагов, формулировка оригинала намеренно сохранена, чтобы не устранять его образность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор «не просил себе» сохранён ради риторического строя еврейского текста. Конечное тире показывает, что синтаксическая конструкция продолжается в следующем стихе.
