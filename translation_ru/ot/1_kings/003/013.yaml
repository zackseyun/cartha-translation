reference: 1 Kings 3:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: ru
  text: 'Я дал тебе и то, чего ты не просил: и богатство, и почёт, так что во все дни твоей жизни среди царей не будет никого подобного тебе.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и во все дни твоей жизни среди царей не будет никого подобного тебе».'
    reason: Второе אֲשֶׁר можно понимать не как явный показатель следствия («так что»), а как более свободное присоединение следующего утверждения.
lexical_decisions:
- source_word: וְגַם
  choice: и то
  rationale: Сочетание союза с усилительно-присоединительной частицей продолжает речь Бога и вводит дополнительный дар сверх просимого; по-русски это естественно передаётся конструкцией «и то».
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: чего ты не просил
  rationale: Относительное придаточное передано естественной русской конструкцией, точно сохраняющей смысл еврейского текста.
- source_word: נָתַתִּי לָךְ
  choice: Я дал тебе
  rationale: Еврейский перфект представляет дар как уже решённый и дарованный; русское прошедшее время уместно в прямой речи Бога.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: и богатство, и почёт
  rationale: Повторение גַּם перед двумя существительными естественно воспроизводится парной конструкцией «и… и…». В контексте царского положения כָּבוֹד означает общественный почёт и высокое положение, а не отвлечённую «славу».
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: так что… не будет никого подобного тебе
  rationale: Контекст обещания о будущих днях Соломона требует в русском языке будущего времени. Отрицательная конструкция с אִישׁ идиоматично передаётся словом «никого», не устраняя сравнения с конкретной группой царей.
- source_word: בַּמְּלָכִים
  choice: среди царей
  rationale: Предлог с артиклем обозначает круг, внутри которого проводится сравнение.
- source_word: כָּל יָמֶיךָ
  choice: во все дни твоей жизни
  rationale: Так передаётся весь период оставшейся жизни Соломона; добавление «жизни» делает еврейскую идиому прозрачной для современного русского читателя.
theological_decisions:
- issue: Значение второго אֲשֶׁר и связь заключительной части стиха
  choice: 'придаточное следствия: «так что…»'
  alternative: 'присоединительное утверждение: «и…»'
  rationale: В контексте богатство и почёт ведут к исключительному положению Соломона среди царей, поэтому следственное прочтение связно и естественно. Однако еврейское אֲשֶׁר допускает менее явно выраженную логическую связь, что отмечено в сноске.
- issue: Временная отнесённость לֹא הָיָה
  choice: 'будущее обещание: «не будет»'
  alternative: 'формально прошедшее: «не было»'
  rationale: Фраза כָּל יָמֶיךָ охватывает предстоящую жизнь Соломона, а вся речь сообщает о Божьем даре и его результате. Русское будущее ясно выражает этот контекстуальный смысл, не превращая слова в утверждение только о прошлом.
- issue: Передача אִישׁ в отрицательном сравнении
  choice: «никого подобного тебе»
  alternative: «ни одного человека, подобного тебе»
  rationale: При отрицательном сказуемом אִישׁ функционирует как неопределённое «кто-либо». Русское «никого» точно и естественно передаёт конструкцию; уточнение «среди царей» сохраняет мужскую и царскую область сравнения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Синтаксис остаётся близким к еврейскому, но избегает архаизмов; двоеточие ясно вводит два дополнительных дара.
