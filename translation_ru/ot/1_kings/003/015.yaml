base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: ru
  text: И пробудился Соломон, и вот, это был сон. Он пришёл в Иерусалим, предстал перед ковчегом завета Господа, принёс жертвы всесожжения и мирные жертвы[a] и устроил пир для всех своих слуг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; эти жертвоприношения могли особо подчёркивать общение участников за общей жертвенной трапезой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: пробудился
  rationale: Глагол означает пробуждение ото сна; «пробудился» естественно и достойно звучит в повествовании.
- source_word: וְהִנֵּה חֲלוֹם
  choice: и вот, это был сон
  rationale: «Вот» сохраняет внезапность осознания, а добавленное по нормам русского языка «это был» ясно передаёт смысл краткой еврейской конструкции.
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: пришёл в Иерусалим
  rationale: Передаёт обычное значение בוא без добавления не выраженного прямо смысла «вернулся».
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: предстал перед
  rationale: В данном культовом контексте идиоматическое «предстал перед» естественнее буквального «встал перед» и сохраняет смысл нахождения перед святыней.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: ковчегом завета Господа
  rationale: Прямо и ясно передаёт цепочку сопряжённых существительных и традиционное русское название святыни.
- source_word: עֹלוֹת
  choice: жертвы всесожжения
  rationale: Устоявшийся русский термин для жертв, полностью сжигавшихся на жертвеннике.
- source_word: וַיַּעַל
  choice: принёс
  rationale: В сочетании с жертвами каузативная форма עלה обозначает их вознесение на жертвенник; по-русски это естественно выражается глаголом «принёс».
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшееся обозначение данной категории жертв; сохраняет связь с корнем, относящимся к миру и благополучию, не сводя значение только к совместной трапезе.
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: Слово обозначает праздничное застолье, нередко с напитками; «пир» кратко и естественно соответствует торжественному контексту.
- source_word: לְכָל עֲבָדָיו
  choice: для всех своих слуг
  rationale: עֲבָדִים может обозначать как слуг, так и царских служащих; «слуги» сохраняет более широкое и прямое значение.
theological_decisions:
- issue: Передача אֲדֹנָי в выражении אֲרוֹן בְּרִית אֲדֹנָי
  choice: Господа
  alternative: Владыки
  rationale: В предоставленном тексте стоит אֲדֹנָי, обычное почтительное именование Бога. «Господа» естественно для русского библейского регистра и не подменяет форму реконструированным личным именем.
- issue: Значение שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения
  rationale: Еврейский термин называет особый вид жертвоприношения и допускает оттенки мира, благополучия и совместной трапезы. Основной текст сохраняет традиционный термин, а примечание указывает значимую альтернативу, не разрешая неоднозначность односторонне.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без утраты последовательности еврейского повествования; подлинная смысловая широта שְׁלָמִים сохранена посредством примечания.
