source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: ru
  text: Соломон породнился с фараоном, царём Египта[a], взял в жёны дочь фараона и привёл её в город Давида. Она оставалась там, пока он не закончил строить свой дом, дом Яхве[b] и стену вокруг Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключил брачный союз с фараоном, царём Египта». Еврейский глагол означает вступление в родство через брак; здесь, вероятно, присутствует и оттенок политического союза.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «храм Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: породнился
  rationale: Возвратная порода глагола חתן обозначает вступление в родство через брак; в царском контексте подразумевается и династический союз. Русское «породнился» сохраняет семейный смысл, не превращая политический оттенок в единственное значение.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: взял в жёны дочь фараона
  rationale: Сочетание לקח с женщиной в качестве дополнения — обычная древнееврейская формула заключения брака. Буквальное «взял дочь» по-русски двусмысленно, поэтому брачный смысл выражен явно.
- source_word: אֶל עִיר דָּוִד
  choice: в город Давида
  rationale: Предлог אֶל при глаголе движения обозначает направление к месту или внутрь него; русское «привёл в» естественно передаёт вселение в указанное место.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: где она оставалась до тех пор, пока он не закончил строительство
  rationale: עַד задаёт временную границу. Добавление «где она оставалась» делает подразумеваемую продолжительность пребывания явной и устраняет возможное русское прочтение, будто сам её приход продолжался до завершения работ.
- source_word: אֶת בֵּיתוֹ
  choice: своего дворца
  rationale: Буквально «своего дома», но в данном царском строительном контексте речь идёт о дворцовом комплексе Соломона. «Дворец» естественнее и помогает отличить его от следующего «дома Яхве».
- source_word: וְאֶת בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохранён буквальный образ «дома», а не сразу истолкованный термин «храм»; личное имя יהוה передано как «Яхве».
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: и стены вокруг Иерусалима
  rationale: חוֹמָה — городская оборонительная стена в единственном числе, а סָבִיב указывает, что она окружает город.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие; традиционное «Господь» возможно как литургически привычная замена.
- issue: Передача בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Господа / храм Яхве
  rationale: «Дом Яхве» сохраняет конкретную метафору исходного текста и связь с противопоставленным ему домом Соломона; «храм» яснее функционально, но является контекстуальным уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён относительно длинной еврейской цепочки предложений, но последовательность событий сохранена. Термин «породнился» передаёт реальную смысловую широту глагола, а пояснение о пребывании дочери фараона естественно раскрывает временную конструкцию.
