  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: ru
  text: А теперь, Яхве, Бог мой, Ты поставил царём раба Твоего вместо Давида, отца моего, а я — малый отрок[a] и не знаю, как выходить и входить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «малый отрок». Это смиренное самоописание подчёркивает молодость и неопытность Соломона, не обязательно указывая на детский возраст.'
    reason: lexical_alternative
  - marker: b
    text: «Выходить и входить» — древнееврейский оборот, который в этом контексте может означать исполнять обязанности руководителя, в том числе вести народ.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהָי
  choice: Яхве, Бог мой
  rationale: Сохраняется личное имя Бога и звательная сила сочетания; порядок слов звучит возвышенно и естественно по-русски.
- source_word: הִמְלַכְתָּ אֶת עַבְדְּךָ
  choice: Ты поставил царём раба Твоего
  rationale: Каузатив глагола מלך передан естественным русским выражением «поставил царём»; «раб Твой» сохраняет молитвенное самоумаление Соломона.
- source_word: תַּחַת דָּוִד אָבִי
  choice: вместо Давида, отца моего
  rationale: תַּחַת обозначает занятие места предшественника; перевод сохраняет смысл царского преемства.
- source_word: נַעַר קָטֹן
  choice: ещё совсем молод
  rationale: Выражение допускает значения от ребёнка до молодого человека и здесь подчёркивает юность и неопытность; перевод не навязывает точный возраст.
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: не знаю, как выходить и входить
  rationale: Сохраняется конкретный древнееврейский оборот, а его вероятный смысл в контексте правления поясняется в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет собственное имя, не заменяя его титулом.
- issue: Самоописание Соломона как נַעַר קָטֹן
  choice: ещё совсем молод
  alternative: малое дитя
  rationale: Выражение является смиренным указанием на юность и неопытность и не обязательно означает буквальное детство; выбранный вариант сохраняет эту неопределённость.
- issue: Идиома צֵאת וָבֹא
  choice: выходить и входить
  alternative: исполнять царские обязанности / управлять народом
  rationale: Основной текст сохраняет образность и смысловую открытость еврейской идиомы, тогда как контекстуальный смысл руководства сообщён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают традиционный русский библейский регистр; идиома сохранена в тексте и разъяснена в сноске.
