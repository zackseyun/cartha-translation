  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: ru
  text: 'Тогда царь сказал[a]: «Одна говорит: „Вот мой сын — живой, а твой сын — мёртвый“; другая говорит: „Нет, твой сын — мёртвый, а мой сын — живой“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эта говорит… и эта говорит…». В еврейском тексте употреблены указательные местоимения женского рода, относящиеся к двум женщинам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён употреблённый в еврейском тексте титул без подстановки имени.
- source_word: זֹאת ... וְזֹאת
  choice: Эта ... другая же
  rationale: Женские указательные местоимения относятся к двум женщинам. По-русски повтор «эта ... и эта» звучит неестественно, поэтому контраст передан как «эта ... другая же»; подразумеваемое «женщина» не добавлено в основной текст.
- source_word: אֹמֶרֶת
  choice: говорит
  rationale: Причастие передаёт живое настоящее время в царском резюме показаний обеих женщин.
- source_word: זֶה בְּנִי הַחַי
  choice: Вот мой сын, живой
  rationale: '«Вот» передаёт указательное זֶה, а обособленное «живой» сохраняет приложение и порядок смысловых элементов: «мой сын, живой».'
- source_word: בְּנִי / בְּנֵךְ
  choice: мой сын / твой сын
  rationale: בֵּן означает «сын»; речь идёт о младенцах мужского пола.
- source_word: הַחַי / הַמֵּת
  choice: живой / мёртвый
  rationale: Русские субстантивированные прилагательные естественно и симметрично передают контраст определённых форм «живой» и «мёртвый».
- source_word: לֹא כִי
  choice: Нет
  rationale: Сочетание вводит возражение и противоположное утверждение. В русском непосредственное «Нет» ясно выражает обе функции; добавление «ибо» здесь было бы неестественным и могло бы создать ложный причинный оттенок.
