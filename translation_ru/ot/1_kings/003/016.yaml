  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: ru
  text: Тогда две женщины, занимавшиеся проституцией, пришли к царю и встали перед ним.[a]
  philosophy: optimal-equivalence
  footnotes:
