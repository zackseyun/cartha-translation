translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Выражение «занимавшиеся проституцией» сохраняет смысл זֹנוֹת без архаизма и стигматизирующей резкости, а «предстали перед ним» естественно отражает судебно-аудиенционный контекст.
