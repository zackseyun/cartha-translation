lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временной повествовательный маркер вводит следующий эпизод и естественно передаёт последовательность событий.
- source_word: תָּבֹאנָה
  choice: пришли
  rationale: Форма Qal imperfect 3-го лица женского рода множественного числа в данном повествовательном контексте обозначает завершённое действие и движение к царю.
- source_word: שְׁתַּיִם נָשִׁים
  choice: две женщины
  rationale: Прямо передаёт сочетание числительного с существительным.
- source_word: זֹנוֹת
  choice: занимавшиеся проституцией
  rationale: Причастие характеризует женщин. Эта формулировка современна, ясна и не добавляет уничижительного оттенка; более краткий вариант «две проститутки» также лексически возможен.
- source_word: אֶל הַמֶּלֶךְ
  choice: к царю
  rationale: Предлог אֶל выражает направленность движения; «к царю» сохраняет её, тогда как следующая часть стиха описывает положение женщин в его присутствии.
- source_word: וַתַּעֲמֹדְנָה
  choice: и предстали
  rationale: Глагол עמד буквально означает «стоять», однако в контексте царского суда сочетание с לְפָנָיו естественно передаётся как «предстали», без лишнего истолкования.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Обычное выражение для нахождения или явки перед правителем либо судьёй.
