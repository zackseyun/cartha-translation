  naturalness: «Тогда две женщины, занимавшиеся проституцией, пришли к царю и встали перед ним» — естественная, современная и литературно нейтральная фраза. Она не нуждается в пояснении буквального значения глагола.
  terminology: «Женщины, занимавшиеся проституцией» точно и без архаизации передаёт זֹנוֹת. Альтернатива «проститутки» также возможна и уместна в сноске; «блудницы» здесь было бы архаичным и конфессионально окрашенным.
