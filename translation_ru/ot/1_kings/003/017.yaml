base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/017.yaml
  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: ru
  text: 'И сказала одна женщина: «Прошу, господин мой! Мы с этой женщиной живём в одном доме. Я родила, когда она была со мной в доме».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: «Прошу, господин мой!»
  rationale: Просительная формула обращения к царю; «прошу» естественно передаёт вежливое ходатайство, а «господин мой» сохраняет уважительное обращение.
- source_word: אֲנִי וְהָאִשָּׁה הַזֹּאת
  choice: «Мы с этой женщиной»
  rationale: Естественная русская конструкция сохраняет обоих участников и указательное «этой».
- source_word: יֹשְׁבֹת
  choice: «живём»
  rationale: Причастие женского рода множественного числа описывает совместное проживание; настоящее время сохранено без необоснованного перевода в прошедшее.
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: «Я родила, когда она была со мной в доме»
  rationale: Передаёт рождение ребёнка в присутствии другой женщины в том же доме и избегает двусмысленного русского «родила с ней».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; уважительное, но не архаичное обращение к царю. Синтаксис сделан естественным для прямой речи при сохранении временной формы глагола совместного проживания.
