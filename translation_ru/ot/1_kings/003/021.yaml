base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: ru
  text: Утром я встала, чтобы покормить грудью своего сына, и вот — он мёртв. Но утром я внимательно всмотрелась в него, и вот — это был не мой сын, которого я родила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם בַּבֹּקֶר
  choice: Утром я встала
  rationale: Естественно передаёт повествовательную форму קום и временное выражение; повтор слова «утром» далее сохранён вслед за еврейским текстом.
- source_word: לְהֵינִיק אֶת־בְּנִי
  choice: чтобы покормить грудью своего сына
  rationale: Каузативная форма ינק в данном контексте означает кормление младенца грудью; בן передано конкретно как «сын».
- source_word: וְהִנֵּה מֵת
  choice: и вот — он мёртв
  rationale: «И вот» сохраняет внезапность обнаружения, выраженную וְהִנֵּה; именная конструкция передаёт состояние ребёнка без добавления причины или времени смерти.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: я внимательно всмотрелась в него
  rationale: Форма от בין/בון обозначает пристальное, осмысленное разглядывание; «всмотрелась» естественно передаёт момент распознания.
- source_word: וְהִנֵּה לֹא הָיָה בְנִי
  choice: 'то увидела: это не мой сын'
  rationale: Конструкция передаёт внезапное осознание, отмеченное вторым וְהִנֵּה. «Это» по-русски естественно указывает на распознанного ребёнка, не обезличивая его.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: которого я родила
  rationale: Прямо и естественно передаёт форму ילד от первого лица и подчёркивает личное материнство говорящей.
theological_decisions: []
translation_notes:
  register: Современная литературная русская речь с достоинством и ясностью; сохранены повтор «утром», драматическая внезапность первого וְהִנֵּה и смысл второго. Союз «но» естественно выражает контраст между первоначальным впечатлением и последующим внимательным распознанием.
