source:
  edition: WLC
  text: וַ/יָּ֛מָת בֶּן הָ/אִשָּׁ֥ה הַ/זֹּ֖את לָ֑יְלָה אֲשֶׁ֥ר שָׁכְבָ֖ה עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/019.yaml
  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: ru
  text: И сын этой женщины умер ночью, потому что она легла на него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «когда она легла на него»; еврейская связка сама по себе не выражает причину столь явно, как русский союз «потому что».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol от מוּת обозначает последовательное событие прошлого; в русском повествовании естественна форма простого прошедшего времени.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: сын этой женщины
  rationale: Сохранено конкретное значение «сын» и указательное определение «этой»; формулировка естественна для современного русского языка.
- source_word: לָיְלָה
  choice: ночью
  rationale: Винительный времени указывает, когда произошло событие; «ночью» кратко и естественно передаёт это значение.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В данном контексте союз вводит обстоятельство, объясняющее смерть ребёнка. Причинный перевод ясно передаёт контекстуальную связь, а формальная неоднозначность отмечена в сноске.
- source_word: שָׁכְבָה עָלָיו
  choice: она легла на него
  rationale: Перевод сохраняет обычное значение שׁכב «лечь, лежать» и пространственное значение עַל «на», не добавляя прямо отсутствующих в стихе слов вроде «во сне» или «придавила».
theological_decisions:
- issue: Характер связи между смертью ребёнка и тем, что женщина легла на него
  choice: 'Передать связь причинно: «потому что»'
  alternative: «когда она легла на него» или буквально относительная конструкция
  rationale: Контекст указывает на причинную связь, однако сам אֲשֶׁר допускает менее определённую относительную или временную передачу; неоднозначность сохранена в сноске без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и повествовательный. Формулировка сохраняет конкретность еврейского текста и не добавляет предположение «во сне».
