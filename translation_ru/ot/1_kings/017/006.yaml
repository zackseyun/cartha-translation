base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: ru
  text: И вороны приносили ему хлеб и мясо по утрам и хлеб и мясо по вечерам, а пил он из потока[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ручья» или «вади»; еврейское נַחַל означает поток или водоток, часто сезонный.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: И вороны
  rationale: עֹרְבִים в обычном значении обозначает воронов; союз וְ передан как «и», сохраняя связь с предыдущим повествованием.
- source_word: מְבִיאִים
  choice: приносили
  rationale: Причастие в повествовательном контексте выражает продолжающееся или повторяющееся действие; русское прошедшее несовершенного вида естественно передаёт эту повторяемость.
- source_word: לוֹ
  choice: ему
  rationale: Косвенное дополнение передано естественной русской формой дательного падежа.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохранено конкретное значение существительного без расширения до общего «пища».
- source_word: וּבָשָׂר
  choice: и мясо
  rationale: В данном контексте בָּשָׂר означает мясо как пищу; это естественный современный русский эквивалент.
- source_word: בַּבֹּקֶר
  choice: по утрам
  rationale: Форма с «по» естественно выражает регулярность действия, подразумеваемую причастной конструкцией.
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: и хлеб и мясо по вечерам
  rationale: Повтор слов «хлеб и мясо» сохранён, чтобы передать ритм и акцент еврейского текста.
- source_word: וּמִן הַנַּחַל
  choice: а … из потока
  rationale: נַחַל обозначает поток или водоток, нередко сезонный; «поток» понятно современному читателю, а союз в русском естественно передан как «а» при переходе к питью.
- source_word: יִשְׁתֶּה
  choice: пил он
  rationale: Имперфект здесь выражает обычное, повторяющееся действие; несовершенный вид передаёт это без лишней вспомогательной конструкции.
theological_decisions:
- issue: Кем были עֹרְבִים, приносившие пищу Илии
  choice: буквально вороны
  alternative: арабы, торговцы или иные люди
  rationale: Обычное лексическое значение עֹרְבִים — «вороны», и ближайший контекст не требует переосмысливать слово ради устранения чудесного элемента.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Повтор «хлеб и мясо» сохранён. Инверсия «а пил он» слегка подчёркивает смену действия, не создавая архаического звучания. Маркер сноски помещён непосредственно после слова «потока», к которому относится пояснение.
