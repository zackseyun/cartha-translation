  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/002.yaml
  text: And the word of Yahweh came to him[a], saying,
translation:
  language: ru
  text: 'И было к нему слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится как «Господь».'
    reason: Указывает форму в исходном тексте и распространённую традиционную передачу имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма с повествовательным waw отмечает следующий шаг рассказа; «И было» естественно вводит традиционную пророческую формулу и сохраняет связь с предыдущим повествованием.
- source_word: דְבַר
  choice: слово
  rationale: В сочетании с именем Бога это устойчивая формула откровения; «слово» точнее сохраняет её смысл и форму, чем более толковательное «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלָיו
  choice: к нему
  rationale: Предлог אֶל с местоименным суффиксом выражает направленность; «к нему» соответствует русской библейской формуле «было слово ... к нему».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно и без смысловой потери передаёт двоеточие; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет это различие, тогда как «Господь» заменяет имя титулом; «Иегова» отражает более позднюю гибридную форму произношения.
translation_notes:
  register: Современный литературный русский с сохранением краткой и торжественной пророческой формулы. Двоеточие естественно вводит прямую речь следующего стиха.
