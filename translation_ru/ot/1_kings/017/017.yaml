  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: ru
  text: После этих событий сын женщины — хозяйки дома — заболел. Болезнь его стала настолько тяжёлой, что в нём не осталось дыхания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нём не осталось жизни». Буквально: «в нём не осталось дыхания».'
    reason: 'Лексическая альтернатива: נְשָׁמָה буквально означает «дыхание», но в данном контексте выражение указывает на прекращение жизни.'
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Передаёт временную повествовательную формулу и сохраняет множественное число הַדְּבָרִים, не прибегая к тяжеловесному буквальному «и было после этих событий».
- source_word: חָלָה
  choice: заболел
  rationale: Глагол обозначает наступление болезни; совершенный вид естественно передаёт это значение по-русски.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: сын женщины — хозяйки дома
  rationale: Приложение «хозяйки дома» ясно и близко передаёт בַּעֲלַת הַבָּיִת, не уточняя сверх текста юридическое владение домом.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: Болезнь его стала настолько тяжёлой
  rationale: «Стала» отражает ухудшение состояния, а «тяжёлой» является естественным современным сочетанием применительно к болезни. «Настолько» связывает степень тяжести с последующим результатом.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: что в нём не осталось дыхания
  rationale: 'Сохраняет образ исходного текста: נְשָׁמָה означает «дыхание» и в данном контексте подразумевает прекращение жизни, но перевод не заменяет образ прямым утверждением «он умер».'
theological_decisions:
- issue: Следует ли передать заключительную фразу прямым утверждением о смерти или сохранить еврейский образ
  choice: Сохранить выражение «в нём не осталось дыхания»
  alternative: «он умер»; «в нём не осталось жизни»
  rationale: Исходный текст говорит об отсутствии נְשָׁמָה, а не использует простую формулу смерти. Сохранение образа не устраняет возможную смысловую напряжённость и не делает подразумеваемый вывод явным в основном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Тире выделяют приложение «хозяйки дома» и устраняют двусмысленность. Лексика сохраняет достоинство библейского повествования без архаизмов.
