base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: ru
  text: 'Так говорит Яхве, Бог Израиля: «Мука в кувшине не кончится, и масло в сосуде не иссякнет до дня, когда Яхве даст дождь на землю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «на лице земли».'
    reason: Сохранение в примечании еврейского пространственного оборота עַל־פְּנֵי הָאֲדָמָה.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная и точная передача еврейского сопряжённого сочетания.
- source_word: כַּד הַקֶּמַח
  choice: мука в кувшине
  rationale: Формально подлежащее — сосуд с мукой, но по-русски естественнее прямо назвать запас, который не иссякнет; «кувшин» сохраняет образ домашнего сосуда.
- source_word: לֹא תִכְלָה
  choice: не кончится
  rationale: Глагол означает достижение конца, полное израсходование; выбран ясный современный эквивалент.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: масло в сосуде
  rationale: Название небольшого сосуда передано общим словом «сосуд», чтобы отличить его от כַּד и не приписывать ему не засвидетельствованную точную форму.
- source_word: לֹא תֶחְסָר
  choice: не иссякнет
  rationale: Передаёт уменьшение запаса вплоть до нехватки и естественно сочетается с маслом.
- source_word: עַד יוֹם
  choice: до того дня
  rationale: Сохранено явное временное выражение исходного текста.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: Яхве даст дождь
  rationale: Сохранено основное значение נתן «дать» без замены на более истолковывающее «пошлёт».
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на землю
  rationale: Естественная русская передача еврейской идиомы; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой формулы. Синтаксис сделан естественным для русского, а предметные детали и временная граница обещания сохранены.
