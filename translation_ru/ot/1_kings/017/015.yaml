  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: ru
  text: И она пошла и поступила по слову Илии. И ела она — он, она и её домашние — много дней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И ела она — он, она и дом её — дни». В еврейском тексте употреблён глагол женского рода единственного числа, после которого перечислены все евшие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: И она пошла
  rationale: Форма wayyiqtol продвигает повествование; обычное русское «и» естественно передаёт последовательность действий.
- source_word: וַתַּעֲשֶׂה
  choice: и сделала
  rationale: עשה здесь означает исполнение данного Ильёй указания; «сделала» сохраняет широкий смысл исходного глагола.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: по слову Илии
  rationale: Устойчивое и понятное русское выражение передаёт действие согласно сказанному Ильёй, сохраняя лексему «слово».
- source_word: וַתֹּאכַל
  choice: И ела она
  rationale: Сохранена форма глагола 3-го лица женского рода единственного числа, после которой еврейский текст перечисляет всех участников.
- source_word: הוא והיא וביתה
  choice: он, и она, и её дом
  rationale: Сохранены порядок и повторяющийся союз исходного текста. «Он» по контексту относится к Илии; «дом» намеренно сохраняет ёмкость בַּיִת, которое может обозначать домашних или семью.
- source_word: יָמִים
  choice: много дней
  rationale: Употреблённое обстоятельственно множественное число указывает на продолжительный период; «много дней» естественно выражает это по-русски.
theological_decisions:
- issue: Необычное согласование единственного женского глагола с последующим перечислением участников
  choice: Сохранить конструкцию «И ела она — он, и она, и её дом»
  alternative: Сгладить как «И она, и он, и её домашние ели»
  rationale: Формально необычная конструкция отражает засвидетельствованный масоретский текст и не подменяет его нормализованным множественным числом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Необычный синтаксис заключительной части сохранён ради формы еврейского текста и пояснён в сноске; «её дом» передаёт возможную собирательность исходного слова без чрезмерного уточнения.
