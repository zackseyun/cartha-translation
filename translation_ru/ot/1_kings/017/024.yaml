  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: ru
  text: 'Тогда женщина сказала Илии: «Теперь я знаю, что ты — человек Божий и что слово Яхве в твоих устах — истина[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово Яхве в твоих устах истинно (верно)». Еврейское существительное может подчёркивать истину, правдивость или надёжность.'
    reason: Лексическая неоднозначность אֱמֶת и возможность естественной русской предикативной передачи прилагательным или наречием.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда ... сказала
  rationale: Форма с последовательным вавом продвигает повествование; «тогда» естественно передаёт смену события и последовательность.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохраняет непосредственное обозначение в еврейском тексте, не подставляя контекстуально верное, но отсутствующее здесь слово «вдова».
- source_word: אֶל אֵלִיָּהוּ
  choice: Илии
  rationale: Русское управление глагола «сказать» естественно требует дательного падежа.
- source_word: עַתָּה זֶה
  choice: Теперь
  rationale: Идиоматическое сочетание выражает наступившее вследствие события уверенное осознание; буквальное «теперь это» по-русски неестественно.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект обозначает достигнутое и сохраняющееся осознание; настоящее время естественно передаёт результат в данном контексте.
- source_word: אִישׁ אֱלֹהִים
  choice: человек Божий
  rationale: Устоявшееся и прозрачное русское соответствие еврейскому обозначению Божьего пророка или принадлежащего Богу человека.
- source_word: וּדְבַר יְהוָה
  choice: и что слово Яхве
  rationale: «Слово» сохраняет пророческую формулу и богословскую насыщенность דָּבָר; союз по-русски дополнен повторным «что» для ясной связи с «я знаю».
- source_word: בְּפִיךָ
  choice: в твоих устах
  rationale: Сохраняет образ исходного текста и звучит естественно в возвышенном современном русском регистре.
- source_word: אֱמֶת
  choice: истина
  rationale: Существительное передаёт не только фактическую истинность, но также правдивость и надёжность слова, не сводя смысл к одному оттенку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя Бога; форма «Яхве» прямо передаёт тетраграмматон и не заменяет его титулом.
- issue: Предикативное אֱמֶת
  choice: слово ... — истина
  alternative: слово ... истинно; слово ... верно
  rationale: Сохранение именной конструкции удерживает силу утверждения и смысловой диапазон между истиной, правдивостью и надёжностью, не разрешая его однозначно.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным для устной реплики, а образы «человек Божий» и «в твоих устах» сохранены. Маркер сноски поставлен непосредственно после слова, к которому относится пояснение.
