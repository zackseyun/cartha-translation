  source_fidelity: 'Текст точно передаёт последовательность еврейского повествования: повтор «пошёл» сохранён, כִּדְבַר יְהוָה естественно передано как «по слову Яхве», а «поселился у потока Керит» адекватно выражает пребывание у נחל. «Что напротив Иордана» передаёт пространственную формулу עַל־פְּנֵי, не превращая вероятное контекстуальное расположение к востоку от Иордана в утверждение основного текста.'
