base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: ru
  text: И он пошёл и поступил по слову Яхве; пошёл и поселился у потока Керит[a], что напротив Иордана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать поток, сезонный водоток, русло или ущелье.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед Иорданом» или «лицом к Иордану»; иногда это понимают как указание на место к востоку от Иордана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Последовательная форма продвигает повествование; простой глагол естественно передаёт переход к исполнению повеления. Повтор глагола в еврейском тексте сохранён.
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: поступил по слову Яхве
  rationale: Оборот передаёт исполнение данного Богом повеления и сохраняет образ «слова», не заменяя его более толковательным выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Глагол обозначает пребывание или проживание в данном месте; «поселился» естественно в повествовательном контексте и не требует понимать пребывание как постоянное.
- source_word: בְּנַחַל כְּרִית
  choice: у потока Керит
  rationale: Предлог передан естественным русским «у», а נַחַל — доступным словом «поток»; возможный смысл сезонного водотока или ущелья отмечен в сноске.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: что напротив Иордана
  rationale: «Напротив» сохраняет пространственное значение идиомы и не вводит отсутствующее в исходном тексте уточнение «к востоку».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Географическое значение עַל פְּנֵי הַיַּרְדֵּן
  choice: напротив Иордана
  alternative: перед Иорданом; к востоку от Иордана
  rationale: Еврейский оборот допускает значения «перед», «напротив», «лицом к». Направление «к востоку» возможно по контексту, но не выражено непосредственно, поэтому оно не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор «пошёл» и семитская формула «по слову Яхве», но синтаксис сделан естественным для русского читателя. Географическая неоднозначность исходного оборота не устранена толкованием.
