  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֵלִיָּ֨הוּ֙ אַל תִּ֣ירְאִ֔י בֹּ֖אִי עֲשִׂ֣י כִ/דְבָרֵ֑/ךְ אַ֣ךְ עֲשִׂי לִ֣/י מִ֠/שָּׁם עֻגָ֨ה קְטַנָּ֤ה בָ/רִאשֹׁנָה֙ וְ/הוֹצֵ֣אתְ לִ֔/י וְ/לָ֣/ךְ וְ/לִ/בְנֵ֔/ךְ תַּעֲשִׂ֖י בָּ/אַחֲרֹנָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: ru
  text: 'Илия сказал ей: «Не бойся. Пойди[a] и сделай, как ты сказала. Только сначала сделай мне из этого небольшую лепёшку[b] и принеси её мне, а затем приготовь для себя и своего сына».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приди»; здесь это слово служит побуждением приступить к делу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «небольшой хлебец». Еврейское слово обозначает небольшое выпеченное хлебное изделие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Прямо передаёт запрет со значением страха и естественно звучит в современном русском языке.
- source_word: בֹּאִי
  choice: Пойди
  rationale: Буквально глагол означает «приди», но в последовательности повелений здесь служит побуждением приступить к делу; по контексту русское «пойди» звучит естественно.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: сделай, как ты сказала
  rationale: Передаёт действие согласно ранее высказанному намерению вдовы без тяжеловесного буквализма «по слову твоему».
- source_word: אַךְ
  choice: Только
  rationale: Частица вводит ограничение или уточнение к предыдущему разрешению; «только» точно и естественно выражает эту функцию.
- source_word: מִשָּׁם
  choice: из этого
  rationale: Буквальное «оттуда» в русском здесь неестественно; указание относится к упомянутым в контексте запасам муки и масла, поэтому «из этого» сохраняет референцию без лишнего пояснения.
- source_word: עֻגָה קְטַנָּה
  choice: небольшую лепёшку
  rationale: עֻגָה обозначает выпеченное хлебное изделие, вероятно лепёшку; этот выбор избегает современного ассоциативного значения слова «торт» у слова «пирог»/«cake».
- source_word: בָרִאשֹׁנָה
  choice: сначала
  rationale: Ясно передаёт временной приоритет просьбы Илии.
- source_word: וְהוֹצֵאתְ לִי
  choice: и принеси её мне
  rationale: Естественно передаёт каузативное «вынеси/принеси»; местоимение «её» проясняет подразумеваемый объект.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: приготовь для себя и своего сына
  rationale: Глагол «приготовь» естественно восполняет подразумеваемую пищу и сохраняет адресатов.
- source_word: בָאַחֲרֹנָה
  choice: а затем
  rationale: Передаёт последующий порядок действий, не создавая ненужного значения абсолютной окончательности.
theological_decisions:
- issue: Нравственная и богословская напряжённость требования сначала накормить Илию
  choice: 'Прямо сохранить порядок: сначала Илии, затем вдове и её сыну'
  alternative: Смягчить просьбу пересказом или скрыть временной приоритет
  rationale: Еврейский текст недвусмысленно устанавливает этот порядок. Перевод не должен заранее оправдывать, смягчать или морализировать требование, поскольку дальнейший контекст раскрывает его значение.
translation_notes:
  register: Современный литературный русский язык с простым, достойным библейского повествования синтаксисом. Сохранены краткие повеления и напряжённый порядок действий; устранены неестественные для русского буквальные обороты без расширительного толкования.
