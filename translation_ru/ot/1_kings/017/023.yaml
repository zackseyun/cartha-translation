  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: ru
  text: 'Илия взял ребёнка, спустился с ним из верхней комнаты в дом и отдал его матери. Затем Илия сказал: «Смотри, твой сын жив».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой сын живёт».'
    reason: Лексико-грамматическая возможность передать חַי как утверждение продолжающейся жизни; основной вариант «жив» наиболее естественен в данном контексте.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח; русский глагол «взял» точно передаёт действие, не уточняя без основания, нёс ли Илия ребёнка на руках.
- source_word: הַיֶּלֶד
  choice: ребёнка
  rationale: יֶלֶד обозначает ребёнка или мальчика. «Ребёнок» естественно в данном контексте и не вводит более точного указания на возраст, которого нет в стихе.
- source_word: וַיֹּרִדֵהוּ
  choice: спустил его
  rationale: Каузативная форма ירד означает «заставить спуститься, спустить». Такой перевод сохраняет направление движения и не добавляет способ перемещения.
- source_word: הָעֲלִיָּה
  choice: верхней комнаты
  rationale: עֲלִיָּה — верхнее помещение или комната на верхнем этаже. «Верхняя комната» понятно современному читателю и сохраняет архитектурный смысл без архаизма «горница».
- source_word: הַבַּיְתָה
  choice: в дом
  rationale: Направительный суффикс -ה указывает на движение внутрь или по направлению к дому; «в дом» передаёт эту направленность.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: отдал матери
  rationale: נתן с косвенным дополнением буквально означает передачу кому-либо. «Отдал матери» естественнее по-русски, чем «дал его матери», и не требует добавления слова «вернул».
- source_word: רְאִי
  choice: Смотри
  rationale: Женская форма повелительного наклонения ראה обращена к матери. «Смотри» звучит прямо и современно, сохраняя указательную силу реплики.
- source_word: חַי בְּנֵךְ
  choice: твой сын жив
  rationale: Именное предложение с חַי утверждает состояние жизни. «Твой сын жив» кратко и драматично передаёт еврейскую фразу, не разъясняя чудо сверх текста.
theological_decisions:
- issue: Степень явности указания на возвращение ребёнка к жизни
  choice: «твой сын жив»
  alternative: «твой сын снова жив» / «твой сын возвращён к жизни»
  rationale: Еврейский текст непосредственно утверждает, что сын жив, но не содержит в этой реплике слов «снова» или «возвращён». Контекст ясно показывает чудо, поэтому перевод не должен усиливать формулировку толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Слово «горница» не использовано из-за его архаической окраски; сохранены краткость и непосредственность заключительной реплики.
