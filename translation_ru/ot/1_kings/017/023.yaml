    rationale: Для וַיֹּרִדֵהוּ требуется передать, что Илия доставил ребёнка вниз. По-русски «спустил его» чаще связано с опусканием предмета или намеренным низведением и не столь естественно в данном повествовательном контексте. «Спустился с ним» сохраняет направление и не уточняет способ перемещения сверх текста.
