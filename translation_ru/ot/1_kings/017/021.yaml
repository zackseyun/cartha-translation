  text: וַ/יִּתְמֹדֵ֤ד עַל הַ/יֶּ֨לֶד֙ שָׁלֹ֣שׁ פְּעָמִ֔ים וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י תָּ֥שָׁב נָ֛א נֶֽפֶשׁ הַ/יֶּ֥לֶד הַ/זֶּ֖ה עַל קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: ru
  text: 'Затем он трижды лёг на мальчика, воззвал к Яхве и сказал: «Яхве, Бог мой, прошу, пусть жизнь[a] этого мальчика вернётся в него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа». Буквально: «пусть душа (нефеш) этого мальчика вернётся внутрь него».'
    reason: Сноска сохраняет лексически возможное значение נֶפֶשׁ и передаёт образную буквальную форму еврейского выражения без навязывания богословского вывода.
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: простёрся
  rationale: Редкий возвратный глагол здесь описывает, как Илия вытянулся над ребёнком. «Простёрся» естественно и достойно передаёт физическое действие, не внося неясного буквального значения «измерил себя».
- source_word: עַל הַיֶּלֶד
  choice: над мальчиком
  rationale: Предлог עַל обозначает положение Илии относительно ребёнка; «над мальчиком» соответствует контексту и естественно звучит по-русски.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: трижды
  rationale: Краткий и естественный русский эквивалент выражения «три раза».
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: воззвал к Яхве
  rationale: В молитвенном контексте קרא אל означает настойчивое обращение. «Воззвал» передаёт напряжённость молитвы и сохраняет возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: יְהוָה אֱלֹהָי
  choice: Яхве, Бог мой
  rationale: Сохраняет личное имя, притяжательную форму и звательный характер прямого обращения.
- source_word: תָּשָׁב נָא
  choice: прошу, пусть … вернётся
  rationale: Юссив с частицей נָא выражает настойчивую просьбу; эта конструкция естественно передаёт её по-русски без добавления причинного значения.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В данном контексте נֶפֶשׁ обозначает жизнь, возвращения которой просит Илия. «Жизнь» ясно передаёт повествовательный смысл, а лексически возможное «душа» сохранено в сноске.
- source_word: הַיֶּלֶד הַזֶּה
  choice: этого мальчика
  rationale: יַלֶד допускает значения «ребёнок» и «мальчик»; мужской род и контекст рассказа позволяют конкретное «мальчик».
- source_word: עַל קִרְבּוֹ
  choice: в него
  rationale: Буквально выражение указывает на внутренность ребёнка. «В него» естественно передаёт возвращение жизни в самого ребёнка, не навязывая современного анатомического понимания.
theological_decisions:
- issue: Передача נֶפֶשׁ в контексте возвращения ребёнка к жизни
  choice: жизнь
  alternative: душа
  rationale: «Жизнь» лучше всего выражает непосредственный смысл просьбы, не превращая стих в техническое утверждение о составе человека. Традиционное и лексически допустимое «душа» отмечено в сноске, чтобы сохранить антропологическую неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным и молитвенным регистром. Формулировка остаётся понятной обычному читателю; личное имя Яхве передано явно, а неоднозначность נֶפֶשׁ вынесена в сноску.
