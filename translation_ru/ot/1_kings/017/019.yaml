  text: וַ/יֹּ֥אמֶר אֵלֶ֖י/הָ תְּנִֽי לִ֣/י אֶת בְּנֵ֑/ךְ וַ/יִּקָּחֵ֣/הוּ מֵ/חֵיקָ֗/הּ וַֽ/יַּעֲלֵ֨/הוּ֙ אֶל הָ/עֲלִיָּ֗ה אֲשֶׁר הוּא֙ יֹשֵׁ֣ב שָׁ֔ם וַ/יַּשְׁכִּבֵ֖/הוּ עַל מִטָּתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: ru
  text: 'Он сказал ей: «Дай мне твоего сына». Затем он взял его с её колен[a], отнёс наверх, в верхнюю комнату[b], где жил, и положил на свою постель.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от её груди» либо «из её объятий». Еврейское слово обозначает область груди или коленей и здесь передаёт образ матери, прижимающей к себе сына.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «комнату наверху»; речь может идти о помещении верхнего этажа или о комнате, устроенной на крыше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Дай мне
  rationale: Повелительная форма נתן с לִי естественно передаётся прямым и нейтральным «дай мне», без добавления резкости.
- source_word: בְּנֵךְ
  choice: твоего сына
  rationale: בֵּן обозначает именно сына, поэтому родовое «ребёнка» было бы менее точным.
- source_word: מֵחֵיקָהּ
  choice: с её колен
  rationale: חֵיק обозначает область груди или коленей, где держат близкого человека. «С её колен» естественно по-русски передаёт положение мальчика, сохраняя телесную близость; диапазон значения отражён в сноске.
- source_word: וַיַּעֲלֵהוּ
  choice: отнёс наверх
  rationale: Форма указывает на перемещение мальчика вверх; «отнёс» естественно выражает подразумеваемое физическое несение.
- source_word: הָעֲלִיָּה
  choice: верхнюю комнату
  rationale: עֲלִיָּה — помещение верхнего этажа или надстройка на крыше; «верхняя комната» точно и понятно без чрезмерной конкретизации.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: где жил
  rationale: В данном контексте ישב означает пребывание или проживание, а не буквальное сидение.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: положил
  rationale: Каузативная форма שׁכב означает «уложить, положить лежать»; краткое «положил» естественно в этом контексте.
- source_word: עַל מִטָּתוֹ
  choice: на свою постель
  rationale: Возвратное «свою» ясно относит постель к действующему лицу, Илии, и точно передаёт местоименный суффикс.
