source:
  edition: WLC
  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: ru
  text: Мука в кувшине не кончалась, и масло в сосуде не иссякало — по слову Яхве, которое он изрёк через Илию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Илии»; это еврейская идиома со значением «через Илию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: мука в кувшине
  rationale: כַּד обозначает бытовой сосуд; сочетание передано естественно по-русски, без буквального и тяжеловесного «кувшин муки».
- source_word: לֹא כָלָתָה
  choice: не кончалась
  rationale: Глагол כלה здесь означает, что запас не был полностью израсходован; несовершенный вид передаёт продолжавшееся обеспечение.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: масло в сосуде
  rationale: צַפַּחַת — небольшой сосуд для жидкости. Нейтральное «сосуд» не уточняет форму, не указанную однозначно в тексте, и отличает его от кувшина с мукой.
- source_word: לֹא חָסֵר
  choice: не иссякало
  rationale: חסר выражает недостаток или убыль; применительно к запасу масла «не иссякало» звучит естественно и сохраняет параллелизм.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Передаёт соответствие произошедшего ранее данному слову и сохраняет личное имя יהוה.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое он изрёк
  rationale: Сохраняет связь со «словом» и обозначает предшествующее торжественное Божье речевое действие без добавления толкования.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: через Илию
  rationale: Еврейская формула буквально говорит «рукой Илии», но идиоматически обозначает посредничество; «через Илию» естественно передаёт её смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Посредничество пророка в формуле בְּיַד אֵלִיָּהוּ
  choice: которое он изрёк через Илию
  alternative: которое он изрёк рукой Илии
  rationale: Формулировка ясно оставляет Яхве источником слова, а Илию — его посредником, не превращая еврейскую идиому в неестественное русское выражение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «не кончалась» и «не иссякало» передают продолжительность чуда; местоимение о Яхве написано со строчной буквы согласно общей современной орфографической норме.
