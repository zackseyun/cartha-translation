source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: ru
  text: 'Она сказала: «Жив Яхве, твой Бог! Нет у меня ни лепёшки[a], только горсть муки в кувшине да немного масла в сосуде. Вот, я собираю две хворостины, чтобы пойти и приготовить из этого для себя и для сына; мы съедим это и умрём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни каравая», «ни печёного хлеба». Еврейское מָעוֹג означает небольшую хлебную лепёшку.'
    reason: Лексема допускает несколько близких русских соответствий; примечание сохраняет конкретность предмета и показывает возможные варианты.
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Жив Яхве, твой Бог!
  rationale: Передаёт торжественную формулу клятвы естественным для русского языка библейским оборотом; личное имя יהוה сохранено как «Яхве».
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: Нет у меня ни лепёшки
  rationale: В составе клятвенного отрицания אִם имеет усиленно-отрицательное значение; מָעוֹג обозначает небольшое изделие из теста, поэтому выбрана «лепёшка», а не общее «хлеб».
- source_word: מְלֹא כַף קֶמַח
  choice: горсть муки
  rationale: Естественно передаёт буквально «полноту ладони муки» и подчёркивает ничтожность оставшегося количества.
- source_word: בַּכַּד
  choice: в кувшине
  rationale: כַּד — домашняя ёмкость для хранения; «кувшин» является понятным современным соответствием.
- source_word: וּמְעַט שֶׁמֶן בַּצַּפָּחַת
  choice: да немного масла в сосуде
  rationale: צַפַּחַת — небольшая ёмкость для жидкости; нейтральное «сосуд» не навязывает спорную точную форму предмета и отличает его от кувшина с мукой.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: Вот, я собираю
  rationale: הִנֵּה привлекает внимание к происходящему, а причастие передаёт действие, совершаемое в данный момент.
- source_word: שְׁנַיִם עֵצִים
  choice: две хворостины
  rationale: Буквально «два куска дерева»; в контексте скудного огня «хворостины» естественно передают малые ветки и подчёркивают крайнюю нужду.
- source_word: וַעֲשִׂיתִיהוּ
  choice: приготовить еду
  rationale: Местоименный суффикс отсылает к подразумеваемой лепёшке или пище из оставшихся припасов; русское «приготовить еду» звучит ясно, не добавляя конкретного способа приготовления.
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: мы съедим её и умрём
  rationale: Сохраняет последовательность и безысходность исходного высказывания; женский род местоимения соотнесён с «едой».
theological_decisions:
- issue: Передача имени יהוה в клятвенной формуле, произнесённой сидонской вдовой
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл אִם в формуле клятвы
  choice: 'усиленное отрицание: «Нет у меня ни…»'
  alternative: условное «если у меня есть…»
  rationale: В клятвенной формуле אִם вводит подразумеваемое самоосуждение и идиоматически выражает решительное отрицание; буквальное условие по-русски исказило бы смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Клятвенная формула сохранена краткой и торжественной; архаизмы сведены к минимуму. Союз «да» в перечислении придаёт естественную выразительность без стилизации под дореволюционный язык.
