base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: ru
  text: 'Илия Фесвитянин, из числа жителей Галаада[a], сказал Ахаву: «Жив Яхве, Бог Израиля, пред Которым я стою: в эти годы не будет[b] ни росы, ни дождя, разве только по моему слову[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «из числа поселенцев Галаада»; еврейское слово может обозначать как жителей, так и поселившихся там людей.'
    reason: lexical_alternative
  - marker: b
    text: Буквально формула клятвы построена как «если будет…», что в данном контексте означает решительное «не будет».
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «согласно моему слову» или «по одному моему слову».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: Илия-фесвитянин
  rationale: Форма обозначает происхождение Илии и звучит как устойчивое наименование; дефис делает сочетание естественным для современного русского языка.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: один из жителей Галаада
  rationale: תּוֹשָׁבֵי может указывать на жителей или поселенцев. Основной текст передаёт принадлежность к населению Галаада, а примечание сохраняет более буквальную альтернативу.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохранена краткая и торжественная древнееврейская формула клятвы без пояснительного расширения в основном тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача значимого определительного сочетания.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: пред Которым я стою
  rationale: Сохранён конкретный образ стояния перед Богом, подразумевающий присутствие и служение, но не сводящий выражение только к служению.
- source_word: אִם יִהְיֶה
  choice: не будет
  rationale: В формуле клятвы אִם выражает решительное отрицание; по-русски его необходимо передать явно.
- source_word: טַל וּמָטָר
  choice: ни росы, ни дождя
  rationale: Оба погодных явления сохранены раздельно и естественно включены в русскую отрицательную конструкцию.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: в эти годы
  rationale: Естественная временная формулировка, не уточняющая продолжительность сверх сказанного в источнике.
- source_word: כִּי אִם
  choice: разве только
  rationale: Передаёт исключительное условие после отрицания и звучит естественно в торжественной речи.
- source_word: לְפִי דְבָרִי
  choice: по моему слову
  rationale: Близко передаёт значение «согласно моему слову», сохраняя пророческую властность высказывания без её богословского разъяснения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Источник прямо употребляет Тетраграмматон; личное имя сохранено в основном тексте.
- issue: Смысл пророческой формулы לְפִי דְבָרִי
  choice: разве только по моему слову
  alternative: разве только согласно моему слову; разве только по слову моему
  rationale: Формулировка сохраняет связь прекращения засухи со словом Илии, не представляя его власть как независимую от Бога и не добавляя этого пояснения в текст.
- issue: Формула стояния перед Богом
  choice: пред Которым я стою
  alternative: Которому я служу
  rationale: Буквальный образ допускает оттенок служения, но не ограничивается им; сохранение образа удерживает исходную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественностью, соответствующей пророческой клятве. Сохранены библейские формы имён «Илия», «Ахав» и «Галаад», а также краткая формула «Жив Яхве». Архаизирующее «пред» употреблено точечно в устойчивом возвышенном обороте; остальной синтаксис остаётся понятным современному читателю.
