base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: ru
  text: 'И он встал и пошёл в Сарепту. Когда он подошёл ко входу в город[a], там оказалась вдова, собиравшая хворост. Он окликнул её и сказал: «Принеси мне, пожалуйста, немного воды в сосуде, чтобы я мог напиться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к городским воротам». В еврейском тексте стоит более широкое слово פֶּתַח — «вход, проход», а не специальное слово со значением «ворота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: И он встал и пошёл
  rationale: Сохраняет последовательность двух еврейских повествовательных глаголов и естественно передаёт переход к действию.
- source_word: צָרְפַתָה
  choice: в Сарепту
  rationale: Направительный суффикс указывает на движение к месту; «Сарепта» — традиционная и понятная русская форма топонима.
- source_word: וַיָּבֹא אֶל פֶּתַח הָעִיר
  choice: Когда он подошёл ко входу в город
  rationale: פֶּתַח означает «вход, отверстие» и не требует более узкого значения «ворота»; временная конструкция естественно передаёт еврейскую повествовательную связь.
- source_word: וְהִנֵּה
  choice: там оказалась
  rationale: Передаёт вводимое частицей неожиданное обнаружение, не прибегая к архаичному русскому «вот» в данной синтаксической позиции.
- source_word: אִשָּׁה אַלְמָנָה
  choice: вдова
  rationale: Естественный русский эквивалент буквального сочетания «женщина-вдова».
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: собиравшая хворост
  rationale: Глагол описывает собирание мелких кусков древесины; «хворост» точнее контекста, чем общее «дрова».
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Он окликнул её
  rationale: Естественно передаёт обращение к находящейся на расстоянии женщине.
- source_word: קְחִי נָא
  choice: Принеси мне, пожалуйста
  rationale: Хотя לקח буквально значит «взять», в просьбе доставить предмет говорящему по-русски естественно «принеси»; נָא передано вежливым «пожалуйста».
- source_word: מְעַט מַיִם
  choice: немного воды
  rationale: Прямой и естественный эквивалент указания на малое количество.
- source_word: בַּכְּלִי
  choice: в сосуде
  rationale: Сохраняет общее значение כְּלִי и не конкретизирует без основания как «кувшин».
- source_word: וְאֶשְׁתֶּה
  choice: чтобы я мог напиться
  rationale: Передаёт целевой оттенок когортатива и естественно звучит в русской просьбе.
