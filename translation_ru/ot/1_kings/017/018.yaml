  text: וַ/תֹּ֨אמֶר֙ אֶל אֵ֣לִיָּ֔הוּ מַה לִּ֥/י וָ/לָ֖/ךְ אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּ֧אתָ אֵלַ֛/י לְ/הַזְכִּ֥יר אֶת עֲוֺנִ֖/י וּ/לְ/הָמִ֥ית אֶת בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: ru
  text: 'Она сказала Илии: «Что тебе до меня, человек Божий? Ты пришёл ко мне, чтобы напомнить о моей вине[a] и умертвить моего сына?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о моём грехе» или «о моей виновности». Еврейское слово может означать проступок, вину или последствия вины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Что тебе до меня
  rationale: Современная русская идиома естественно передаёт резкий протест и стремление отстраниться; буквальное «что мне и тебе» по-русски неестественно.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохраняет устойчивый библейский титул пророка или Божьего посланника, не заменяя его толкованием.
- source_word: בָּאתָ אֵלַי
  choice: Ты пришёл ко мне
  rationale: Совершенный вид и контекст риторического вопроса передают обвинительный смысл еврейского перфекта.
- source_word: לְהַזְכִּיר
  choice: напомнить о
  rationale: 'Передаёт каузативный смысл: сделать вину вновь памятной или обратить на неё внимание; формулировка естественна для современного русского языка.'
- source_word: עֲוֺנִי
  choice: моей вине
  rationale: Слово עָוֹן может обозначать проступок, виновность или её последствия. «Вина» сохраняет нравственно-правовой оттенок и не сводит значение только к конкретному греховному поступку.
- source_word: וּלְהָמִית
  choice: и умертвить
  rationale: Передаёт каузативную форму глагола מות и сохраняет связь смерти сына с предполагаемым приходом пророка; звучит торжественно и естественнее, чем «заставить умереть».
- source_word: בְּנִי
  choice: моего сына
  rationale: Точно передаёт мужской род и родственное отношение.
theological_decisions:
- issue: Значение עֲוֺנִי в обвинении вдовы
  choice: моей вине
  alternative: моём грехе; моей виновности
  rationale: Высказывание связывает смерть сына с нравственной ответственностью вдовы, но еврейское слово не уточняет окончательно, идёт ли речь о проступке, состоянии виновности или последствиях вины. Сноска сохраняет эту смысловую широту.
- issue: Степень причинности в וּלְהָמִית
  choice: умертвить
  alternative: погубить; сделать так, чтобы мой сын умер
  rationale: Каузативная форма допускает понимание как причинения смерти, однако текст выражает обвинение самой вдовы и не требует богословского утверждения о прямой вине Илии.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и напряжённости прямой речи. Обращение «человек Божий» оставлено в традиционной библейской форме; синтаксис вопроса сделан естественным для обычного современного читателя.
