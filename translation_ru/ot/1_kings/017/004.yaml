  text: וְ/הָיָ֖ה מֵ/הַ/נַּ֣חַל תִּשְׁתֶּ֑ה וְ/אֶת הָ/עֹרְבִ֣ים צִוִּ֔יתִי לְ/כַלְכֶּלְ/ךָ֖ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: ru
  text: Из потока[a] ты будешь пить, а воронам[c] Я повелел заботиться там о твоём пропитании[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ручья»; возможен также смысл «из сезонного потока (вади)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможны также варианты: «поддерживать тебя» или «кормить тебя».'
    reason: lexical_alternative
  - marker: c
    text: Иногда вместо птиц предлагали видеть здесь название места или группы людей, однако обычное значение еврейского слова — «вороны», и дальнейший контекст подтверждает это понимание.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: ты будешь
  rationale: Еврейская конструкция вводит предстоящее обстоятельство. В современном русском естественнее передать её будущим временем без буквального и тяжеловесного «и будет так, что».
- source_word: מֵהַנַּחַל
  choice: из потока
  rationale: נַחַל может обозначать поток, ручей или сезонное русло. «Поток» понятно современному читателю и не утверждает, что вода в русле была постоянной.
- source_word: תִּשְׁתֶּה
  choice: ты будешь пить
  rationale: Форма второго лица мужского рода указывает на предстоящее действие; обычное русское будущее время точно и естественно передаёт смысл.
- source_word: הָעֹרְבִים
  choice: воронам
  rationale: Обычное значение слова — вороны как птицы семейства врановых; последующий рассказ о приносимой ими пище подтверждает это понимание.
- source_word: צִוִּיתִי
  choice: Я повелел
  rationale: Совершенный вид передаёт уже отданное и сохраняющее силу повеление. Порядок слов с выделенным «Я» уместно отражает явное местоименное значение глагольной формы.
- source_word: לְכַלְכֶּלְךָ
  choice: заботиться о твоём пропитании
  rationale: Глагол означает обеспечивать необходимым, поддерживать или питать. Выбранная формулировка естественна по-русски, соответствует ближайшему контексту пищи и не сводит действие только к одному кормлению.
- source_word: שָׁם
  choice: там
  rationale: Прямой и естественный эквивалент наречия места.
theological_decisions:
- issue: Кто получил повеление обеспечивать Илию
  choice: В тексте имеются в виду вороны — птицы, которым Бог повелел доставлять Илии пропитание.
  alternative: Иногда предлагалось понимать слово как название места либо группы людей.
  rationale: Обычное значение הָעֹרְבִים — птицы-вороны, а дальнейший контекст прямо говорит, что они приносили хлеб и мясо. Оснований заменять простое значение слова иным толкованием нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского языка; прописное «Я» употреблено как традиционная графическая форма при прямой речи Бога. Все примечания привязаны к соответствующим словам текста.
