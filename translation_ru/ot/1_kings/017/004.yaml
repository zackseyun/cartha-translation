  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: питьё из נחל, уже отданное Божье повеление воронам и их заботу об Илии «там». «Поток» обоснованно сохраняет диапазон נחל, который может обозначать ручей, поток или вади. Будущее «будешь пить» естественно передаёт имперфект. «Я повелел» адекватно передаёт совершенное действие, предшествующее прибытию Илии.'
