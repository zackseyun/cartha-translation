  terminology: «Вороны» — традиционный и контекстуально верный перевод הָעֹרְבִים; примечание корректно отмечает предлагавшиеся небуквальные прочтения, не навязывая их. «Пропитание» удачно передаёт широкий смысл לכלכל — обеспечивать, поддерживать, кормить. Все сноски имеют корректные якоря и соответствуют отмеченным словам.
