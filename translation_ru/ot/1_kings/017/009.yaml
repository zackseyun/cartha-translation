  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: ru
  text: «Встань, пойди в Сарепту, принадлежащую Сидону,[a] и живи там. Вот, Я повелел[b] там вдове содержать тебя».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находящуюся в Сидоне» или «близ Сидона». Еврейский текст буквально связывает Сарепту с Сидоном, вероятно указывая на территориальную или политическую принадлежность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я назначил там вдову поддерживать тебя». В еврейском тексте сказано «Я повелел»; это может описывать Божье властное распоряжение, даже если далее вдова не показана как осознанно получившая его.'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Встань
  rationale: Императив קום передаёт призыв подняться и приступить к действию; «встань» естественно и сохраняет силу повеления.
- source_word: לֵ֤ךְ
  choice: пойди
  rationale: Императив הלך в повелении о перемещении; «пойди» идиоматично сочетается с предшествующим «встань».
- source_word: צָרְפַתָה
  choice: в Сарепту
  rationale: Название места передано в принятой русской библейской форме; конечное направительное ה отражено предлогом «в» при глаголе движения.
- source_word: אֲשֶׁר לְצִידוֹן
  choice: принадлежащую Сидону
  rationale: Предлог לְ связывает Сарепту с Сидоном и допускает территориальную или политическую принадлежность; формулировка сохраняет эту связь, не сводя её безоговорочно к точному местоположению.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: и живи там
  rationale: Перфект с союзом после императивов имеет повелительно-последовательное значение. «Живи там» естественно передаёт продолжительное пребывание.
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание к последующему сообщению; «вот» сохраняет эту дискурсивную функцию без архаизации.
- source_word: צִוִּיתִי
  choice: я повелел
  rationale: Пиэль глагола צוה прямо означает «повелеть». Перевод сохраняет силу исходного выражения и не объясняет заранее, каким образом вдова получила или исполнила повеление.
- source_word: אִשָּׁה אַלְמָנָה
  choice: одной вдове
  rationale: Сочетание «женщине, вдове» естественно свёрнуто по-русски до «одной вдове»; неопределённость передана местоимением «одной».
- source_word: לְכַלְכְּלֶךָ
  choice: кормить тебя
  rationale: כלכל обозначает обеспечение и поддержание средствами к жизни; в данном контексте прежде всего речь идёт о пище, поэтому «кормить» звучит ясно и естественно.
theological_decisions:
- issue: Смысл утверждения Бога о том, что Он «повелел» вдове
  choice: Сохранено прямое «я повелел».
  alternative: «я назначил вдову» или «я приготовил вдову»
  rationale: Еврейское צוה обычно означает «повелевать». Дальнейший рассказ прямо не сообщает, что вдова уже осознанно получила такое повеление; перевод сохраняет это повествовательное и богословское напряжение, не разрешая его толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранены последовательность повелений, указательное «вот» и прямое «повелел». Местоимение «я» оставлено со строчной буквы по обычной русской орфографии, без внесения отсутствующего в древнееврейском тексте типографического богословского различия.
