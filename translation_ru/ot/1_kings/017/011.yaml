lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Когда она пошла принести воды
  rationale: Сочетание повествовательной формы הלך с инфинитивом לקח выражает движение с целью. «Когда» естественно передаёт, что следующий возглас прозвучал, пока она шла выполнять просьбу; «воды» восстанавливает ясный референт из предыдущего стиха.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: он окликнул её
  rationale: קרא с אֶל означает обратиться к кому-либо громким голосом. «Окликнул» естественно соответствует ситуации, когда женщина уже направилась за водой, не добавляя чрезмерной эмоциональности.
- source_word: לִקְחִי נָא לִי
  choice: Принеси мне, пожалуйста
  rationale: Императив לקח в данном контексте подразумевает взять и доставить просимое; частица נָא смягчает просьбу, а לִי обозначает получателя или заинтересованное лицо.
- source_word: פַּת לֶחֶם
  choice: кусок хлеба
  rationale: Сочетание означает небольшую часть или кусок хлеба. Выбран современный и нейтральный русский эквивалент; более экспрессивный размер куска не уточняется.
- source_word: בְּיָדֵךְ
  choice: в руке
  rationale: Сохранён конкретный образ еврейского текста — хлеб, принесённый в руке. Хотя по-русски возможно идиоматическое «с собой», буквальная образность здесь понятна и не затемняет смысл.
- source_word: לִקְחִי ... פַּת לֶחֶם
  choice: ещё и кусок хлеба
  rationale: «Ещё и» естественно показывает, что хлеб добавляется ко прежде запрошенной воде; это следует из ближайшего контекста и не меняет содержания просьбы.
