  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: ru
  text: 'И воззвал он к Яхве и сказал: «О Яхве, Бог мой! Неужели Ты навёл беду[b] и на вдову, у которой я живу[a], умертвив её сына?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которой я живу как пришелец»; еврейское слово подразумевает проживание в качестве гостя или зависимого чужеземца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неужели Ты сделал зло вдове… умертвив её сына?» Еврейский глагол может означать причинить вред, навлечь бедствие или поступить дурно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: воззвал к Яхве
  rationale: В контексте молитвы קרא אל передаёт настойчивое, эмоционально напряжённое обращение; «воззвал» сохраняет достоинство и силу выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: יְהוָה אֱלֹהָי
  choice: О Яхве, Бог мой!
  rationale: Сохраняет прямое молитвенное обращение и притяжательную форму «мой Бог».
- source_word: הֲגַם
  choice: неужели ... и
  rationale: Сочетание вопросительной и присоединительной частиц выражает потрясённый вопрос о бедствии, добавившемся к прежним страданиям.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: у которой я живу
  rationale: Hitpael от גור указывает на проживание у кого-либо в качестве пришельца или гостя; естественная русская формулировка не делает пребывание постоянным.
- source_word: הֲרֵעוֹתָ
  choice: Ты навёл беду
  rationale: Hiphil от רעע может обозначать причинение вреда или наведение бедствия, не обязательно нравственное зло.
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: умертвив её сына
  rationale: Сохраняет выраженную в тексте причинную связь с действием Бога и значение инфинитива «привести к смерти», не ослабляя напряжённости молитвы.
theological_decisions:
- issue: Обвиняет ли Илия Бога в нравственном зле или говорит о причинённом бедствии
  choice: «навёл беду»
  alternative: «сделал зло вдове»
  rationale: רעע допускает значения вреда и бедствия. Выбранный вариант не приписывает Богу нравственного зла, но сохраняет смелое обращение Илии, прямо связывающее смерть сына с Божьим действием.
- issue: Степень выраженности Божьей причинности в смерти сына
  choice: «умертвив её сына»
  alternative: «допустив смерть её сына»
  rationale: Еврейское לְהָמִית выражает причинение смерти, а не только позволение; перевод не смягчает эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенным звучанием. «Воззвал» уместно передаёт силу обращения; порядок слов и риторический вопрос сохраняют эмоциональное напряжение оригинала. Все маркеры сносок присутствуют в основном тексте.
