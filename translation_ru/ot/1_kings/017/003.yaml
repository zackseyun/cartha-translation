source:
  edition: WLC
  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: ru
  text: «Уйди отсюда, поверни к востоку и скройся у потока Керит[a], что напротив Иордана[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское נַחַל может означать поток, сезонный водоток, его русло или ущелье. Название Керит традиционно также передают как Хораф.
    reason: Лексическая широта географического термина и вариант передачи топонима.
  - marker: b
    text: 'Буквально: «что перед Иорданом» или «перед лицом Иордана»; возможно также: «что к востоку от Иордана».'
    reason: Еврейский пространственный оборот допускает несколько близких толкований, а точное местонахождение потока не установлено.
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Уйди отсюда
  rationale: Императив הלך с מִזֶּה выражает прямое повеление покинуть нынешнее место; «уйди отсюда» естественно и точно передаёт это в русском контексте.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: поверни к востоку
  rationale: פנה с направительным קֵדְמָה означает поворот или движение на восток. Дательный לְךָ при глаголе идиоматичен; отдельное «сам» по-русски создало бы ненужное смысловое ударение.
- source_word: וְנִסְתַּרְתָּ
  choice: скройся
  rationale: 'Нифаль глагола סתר здесь имеет возвратно-пассивный смысл: Илия должен укрыться и оставаться вне поля зрения.'
- source_word: בְּנַחַל
  choice: у потока
  rationale: נחל может обозначать поток, его русло, ущелье или сезонный водоток. «У потока» звучит естественно, а широта значения отмечена в сноске.
- source_word: כְּרִית
  choice: Керит
  rationale: Передача согласных еврейского топонима כרית современной русской транслитерацией; традиционная форма «Хораф» менее непосредственно отражает еврейское звучание.
- source_word: אֲשֶׁר עַל־פְּנֵי הַיַּרְדֵּן
  choice: что напротив Иордана
  rationale: Оборот עַל־פְּנֵי буквально связан с положением «перед лицом» чего-либо и может указывать на место перед или напротив Иордана. «Напротив» сохраняет пространственную неопределённость лучше, чем однозначное «к востоку от».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с прямой, краткой формой Божьего повеления. Синтаксис сохраняет последовательность трёх действий, но избегает неестественной буквальности. Топоним передан как «Керит», с традиционным русским вариантом в сноске.
