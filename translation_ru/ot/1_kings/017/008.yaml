  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/008.yaml
  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: ru
  text: 'И пришло к нему слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога, традиционно передаваемое также словом «Господь».
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Форма продолжает последовательность повествования. В сочетании с דְבַר естественно передаётся по-русски как «И пришло… слово», без архаичного оборота «и было».
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר יְהוָה обозначает Божье откровение или обращение. «Слово» сохраняет форму и богословскую насыщенность выражения, не сужая его до истолковательного «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь»; это непосредственно отражает еврейский текст.
- source_word: אֵלָיו
  choice: к нему
  rationale: Предлог אֶל с суффиксом третьего лица мужского рода единственного числа прямо означает «к нему»; местоимение относится к Илии из контекста.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит прямую речь, начинающуюся в следующем стихе. В современном русском эту функцию естественно и без потери смысла выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога, а не титул אֲדֹנָי. Транслитерация сохраняет это различие; примечание указывает на традиционную замену.
- issue: Характер Божьего обращения
  choice: слово
  alternative: весть
  rationale: «Слово» сохраняет традиционную пророческую формулу и не определяет точнее, чем оригинал, форму или объём сообщённого откровения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Начальное «И» передаёт последовательность еврейского повествования; двоеточие естественно вводит речь следующего стиха.
