lexical_decisions:
- source_word: וַיְהִי
  choice: Через некоторое время…
  rationale: Повествовательная формула вводит следующее событие; в современном русском её значение естественно передаётся переходом к обстоятельству времени без буквального «и было».
- source_word: מִקֵּץ יָמִים
  choice: через некоторое время
  rationale: Идиома указывает на истечение неопределённого промежутка времени; такой перевод сохраняет неопределённость и звучит естественно.
- source_word: וַיִּיבַשׁ
  choice: пересох
  rationale: В данном контексте глагол означает, что водоток лишился воды; «пересох» — точное и идиоматичное русское соответствие.
- source_word: הַנָּחַל
  choice: поток
  rationale: Слово обозначает водоток, часто сезонный, а также связанное с ним русло или долину. «Поток» понятен современному читателю, а географическая особенность поясняется в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит непосредственную причину пересыхания потока.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: не было дождя
  rationale: Прямо и естественно передаёт отсутствие осадков как причину засухи.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: Здесь אֶרֶץ означает страну или область, охваченную засухой, а не всю землю.
