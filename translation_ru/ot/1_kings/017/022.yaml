  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: ru
  text: И Яхве внял голосу Илии; жизнь[a] ребёнка возвратилась в него, и он ожил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа». Еврейское слово не́феш может в зависимости от контекста означать «жизнь», «душу» или «самого человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: внял
  rationale: В контексте молитвы глагол שׁמע означает не только услышать, но и благосклонно откликнуться. «Внял» кратко и естественно передаёт оба оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: голосу Илии
  rationale: Сохраняется конкретное еврейское выражение «голосу Илии» без поясняющей замены на «молитве» или «мольбе».
- source_word: וַתָּשָׁב
  choice: возвратилась
  rationale: Глагол שׁוב прямо обозначает возвращение или восстановление; форма согласована с русским словом «жизнь».
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: Здесь נֶפֶשׁ обозначает жизненное начало или саму жизнь ребёнка. «Жизнь» ясно передаёт оживление, не навязывая тексту определённую антропологическую схему.
- source_word: הַיֶּלֶד
  choice: ребёнка
  rationale: יֶלֶד означает ребёнка или мальчика; нейтральное «ребёнок» естественно в данном повествовании.
- source_word: עַל קִרְבּוֹ
  choice: в него
  rationale: Буквально речь идёт о возвращении к внутренности ребёнка. По-русски «возвратилась в него» естественно передаёт телесно-внутреннюю направленность выражения без неуклюжего буквализма.
- source_word: וַיֶּחִי
  choice: и он ожил
  rationale: Глагол חיה указывает на наступивший результат — ребёнок снова стал жив. «Ожил» по-русски точнее и естественнее в данном контексте, чем буквальное «жил».
theological_decisions:
- issue: Передача נֶפֶשׁ в рассказе об оживлении
  choice: жизнь
  alternative: душа
  rationale: Основной текст передаёт непосредственный повествовательный смысл — возвращение жизни. Вариант «душа» остаётся лексически возможным и традиционным, поэтому сохранён в сноске, но не используется для утверждения более определённого учения о составе человека, чем позволяет еврейский текст.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. «Внял голосу» сохраняет библейское достоинство и выражает благосклонный ответ, оставаясь понятным современному читателю.
