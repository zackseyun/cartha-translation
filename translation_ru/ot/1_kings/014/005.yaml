base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: ru
  text: 'И Яхве сказал Ахии: «Вот, жена Иеровоама идёт спросить у тебя о своём сыне, потому что он болен. Скажи ей то-то и то-то[a]. Когда она придёт, она будет скрывать, кто она[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так и так» — выражение, обозначающее определённые слова, содержание которых здесь пока не приводится.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет выдавать себя за другую женщину». Еврейский глагол означает намеренно сделать себя неузнаваемой, скрывая свою личность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: И сказал Яхве
  rationale: Имя יהוה передано как «Яхве»; начальный וַ естественно выражен русским повествовательным «И».
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и достойный русский указатель, привлекающий внимание без архаического оттенка.
- source_word: בָּאָה
  choice: идёт к тебе
  rationale: Форма описывает уже предстоящее или происходящее прибытие; «идёт к тебе» естественно передаёт непосредственность ситуации.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: спросить о своём сыне
  rationale: В контексте обращения к пророку выражение означает запросить у него слово или ответ о сыне; краткая русская формулировка сохраняет смысл, не перегружая текст.
- source_word: כִּי חֹלֶה הוּא
  choice: потому что он болен
  rationale: Прямая и естественная передача причинного придаточного.
- source_word: כָּזֹה וְכָזֶה תְּדַבֵּר אֵלֶיהָ
  choice: Скажи ей то-то и то-то
  rationale: 'Русская идиома «то-то и то-то» сохраняет намеренную неопределённость еврейской формулы: содержание сообщения известно говорящему, но пока не приводится.'
- source_word: וִיהִי כְבֹאָהּ
  choice: Когда она придёт
  rationale: Еврейская повествовательная формула естественно передана временным придаточным без тяжеловесного буквального «и будет при её приходе».
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: то будет выдавать себя за другую
  rationale: Hitpael от נכר обозначает стремление остаться неузнанной, принять чужой облик; русская формулировка ясно передаёт намеренное притворство.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и следует предоставленному проектному решению, не добавляя конфессиональной интерпретации.
- issue: Характер обращения к пророку
  choice: спросить о своём сыне
  alternative: вопросить у тебя слово о своём сыне
  rationale: Исходное выражение допускает оттенок запроса пророческого слова, но прямо не называет оракул; основной текст сохраняет естественную речь и не усиливает этот оттенок сверх оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования, но без архаизмов. Синтаксис сделан ясным для обычного читателя; идиома «то-то и то-то» сохраняет неопределённость оригинала.
