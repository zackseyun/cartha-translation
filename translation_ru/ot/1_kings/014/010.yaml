  issues:
  - severity: medium
    issue: «остатки дома Иеровоама»
    rationale: Слово «остатки» отсутствует в исходном тексте. Предлог אַחֲרֵי в данной идиоматической конструкции труден, но сравнение с выметанием навоза указывает на тщательное устранение дома, а не на особую категорию уже оставшихся людей.
  - severity: low
