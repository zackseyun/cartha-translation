source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: ru
  text: Поэтому вот, Я наведу бедствие на дом Иеровоама и истреблю у Иеровоама всех мужчин[a] — и невольника, и свободного[b] — в Израиле. Я вымету дом Иеровоама дочиста, как выметают навоз, пока ничего не останется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мочащегося к стене» — грубоватое еврейское выражение, обозначающее мужчину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «раба и свободного». Буквально еврейские слова означают «удерживаемого и отпущенного»; вероятно, это парная формула со значением «всех без исключения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: бедствие
  rationale: В пророчестве о суде слово обозначает ниспосылаемое несчастье, а не нравственное зло; «бедствие» естественно и сохраняет суровость угрозы.
- source_word: וְהִכְרַתִּי
  choice: истреблю
  rationale: Глагол כרת буквально связан с отсечением, а здесь означает полное уничтожение мужской линии Иеровоама. Русское «истреблю» ясно передаёт судебный контекст.
- source_word: מַשְׁתִּין בְּקִיר
  choice: всякого мужчину[a]
  rationale: Грубоватое буквальное выражение «мочащийся к стене» идиоматически обозначает лиц мужского пола; смысл вынесен в основной текст, а образность сохранена в сноске.
- source_word: עָצוּר וְעָזוּב
  choice: и невольника, и свободного[b]
  rationale: Вероятно, это устойчивая парная формула полноты, охватывающая мужчин любого положения. Сноска отмечает буквальную неясность еврейского выражения.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: Я вымету остатки дома Иеровоама
  rationale: בער в сочетании с последующим сравнением о навозе выражает полное удаление; אַחֲרֵי передаётся как «остатки», то есть всё, что ещё останется от дома Иеровоама.
- source_word: הַגָּלָל
  choice: навоз
  rationale: Слово намеренно грубое и уничижительное; «навоз» сохраняет конкретность и силу сравнения.
- source_word: עַד תֻּמּוֹ
  choice: пока ничего не останется
  rationale: Фраза подчёркивает доведение уничтожения до конца; выбранная формулировка естественна по-русски и передаёт полное отсутствие остатка.
theological_decisions:
- issue: Суровость формулы Божьего суда
  choice: Сохранена прямая речь о наведении бедствия и полном истреблении дома Иеровоама.
  alternative: Смягчить формулировки словами «несчастье», «удалю» или «накажу».
  rationale: Еврейский текст намеренно резок и содержит уничижительное сравнение с навозом; смягчение исказило бы тон пророчества.
- issue: Объём предсказанного уничтожения
  choice: Парная формула передана как охватывающая мужчин любого общественного положения, а заключение — как полное уничтожение дома.
  alternative: Буквально и неясно передать עָצוּר וְעָזוּב как «задержанного и оставленного».
  rationale: Контекст и формульный характер выражения указывают на всеохватность, но присущая выражению лексическая неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. «Поэтому Я наведу» естественнее русского буквального «поэтому вот, Я навожу». Резкость образа навоза сохранена; синтаксис упрощён без устранения подлинной неясности формулы עָצוּר וְעָזוּב.
