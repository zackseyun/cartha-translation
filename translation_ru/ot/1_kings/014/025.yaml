lexical_decisions:
- source_word: וַיְהִי
  choice: не передано отдельным словом
  rationale: Форма вводит очередное событие повествования; в современном русском дополнительное «и случилось» здесь было бы тяжеловесным, а явного наречия «теперь» в источнике нет.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: На пятом году царствования царя Ровоама
  rationale: Это формула датировки по годам правления. Добавление «царствования» естественно передаёт функцию לַמֶּלֶךְ и не позволяет понять выражение как указание на возраст Ровоама.
- source_word: שושק
  choice: Шишак
  rationale: Передача следует еврейской форме имени שושק, а не реконструированному египетскому имени Шешонк; «Сусаким» является традиционной русской формой, но дальше от еврейского звучания.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Естественная русская аппозиция, обозначающая титул и страну Шишака.
- source_word: עָלָה ... עַל
  choice: двинулся на
  rationale: В военном контексте сочетание обозначает враждебное продвижение к городу. «Двинулся на» сохраняет значение похода, не утверждая прямо, что нападение уже началось.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма библейского географического названия.
