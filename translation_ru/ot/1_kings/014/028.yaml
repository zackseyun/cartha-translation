source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: ru
  text: И всякий раз, когда царь входил в дом Яхве, телохранители[a] несли щиты[b], а затем возвращали их в помещение телохранителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бегущие»; при царском дворе так называли царских телохранителей.'
    reason: lexical_alternative
  - marker: b
    text: То есть бронзовые щиты, которые Ровоам сделал вместо золотых щитов, захваченных Шишаком (см. 3 Царств 14:27).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: И всякий раз, когда… входил
  rationale: Сочетание מִדֵּי с инфинитивом передаёт повторяющееся действие; такая русская конструкция естественно выражает обычай, существовавший в прошлом.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён древнееврейский образ «дома» как святилища и личное имя יהוה, переданное транслитерацией «Яхве».
- source_word: הָרָצִים
  choice: телохранители
  rationale: Буквально слово означает «бегущие», но в контексте царского двора обозначает сопровождавших царя воинов, то есть его телохранителей.
- source_word: יִשָּׂאוּם
  choice: несли щиты
  rationale: Имперфект в контексте повторяющейся ситуации обозначает привычное действие. Явное существительное «щиты» естественнее местоимения и проясняет отсылку к предыдущему стиху, не меняя её содержания.
- source_word: וֶהֱשִׁיבוּם
  choice: а затем возвращали их
  rationale: Порода hifil глагола שוב выражает возвращение предметов на прежнее место; «затем» ясно передаёт последовательность привычных действий.
- source_word: אֶל תָּא הָרָצִים
  choice: в помещение телохранителей
  rationale: תָּא обозначает отдельную комнату или помещение; перевод сохраняет принадлежность этого помещения телохранителям без излишне узкой реконструкции его назначения.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формула «всякий раз» сохраняет повторяемость действия; «дом Яхве» сохраняет образ исходного текста, а «телохранители» передаёт придворную функцию понятным современному читателю словом.
