  text: וַ/תָּ֨קָם֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תֵּ֖לֶךְ וַ/תָּבֹ֣א תִרְצָ֑תָ/ה הִ֛יא בָּאָ֥ה בְ/סַף הַ/בַּ֖יִת וְ/הַ/נַּ֥עַר מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: ru
  text: Тогда жена Иеровоама встала, пошла и пришла в Фирцу. Когда она подошла к порогу дома[a], мальчик умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда она была у порога дома».'
    reason: 'Лексико-синтаксическая альтернатива: בְּסַף обозначает положение у порога; обстоятельственная конструкция допускает передачу как приближения к нему, так и нахождения у него.'
lexical_decisions:
- source_word: וַתָּקָם
  choice: встала
  rationale: Qal wayyiqtol от קום продолжает последовательность повествовательных действий; «встала» точно и естественно передаёт начало движения.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: жена Иеровоама
  rationale: Сопряжённая конструкция прямо обозначает супружеское отношение; эта форма естественна для современного русского языка.
- source_word: וַתֵּלֶךְ
  choice: пошла
  rationale: הלך в простой повествовательной последовательности обозначает движение без необходимости уточнять способ или длительность пути.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: пришла в Фирцу
  rationale: Глагол בוא и направительное окончание в תִרְצָתָה указывают на прибытие к месту назначения; «пришла в Фирцу» естественно передаёт это движение.
- source_word: הִיא בָּאָה
  choice: когда она переступила
  rationale: Местоимение с причастием образует обстоятельственную конструкцию, указывающую на момент прибытия; в сочетании с порогом русское «переступила» естественно выражает достижение этой точки, не меняя временного соотношения.
- source_word: בְסַף הַבַּיִת
  choice: порог дома
  rationale: סַף точно обозначает порог или нижнюю часть дверного проёма; «порог дома» сохраняет конкретный образ.
- source_word: וְהַנַּעַר
  choice: мальчик
  rationale: נַעַר имеет широкий диапазон значений, но здесь относится к малолетнему сыну Иеровоама; «мальчик» ясно и естественно в данном контексте.
- source_word: מֵת
  choice: умер
  rationale: Форма от מות в контексте исполнения предсказания обозначает событие смерти именно в этот момент, а не только состояние.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. Последовательность действий сохранена, но избыточное для русского повторение союзов сглажено. Имя города передано в традиционной русской библейской форме «Фирца».
