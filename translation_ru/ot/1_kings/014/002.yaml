  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: ru
  text: 'Иеровоам сказал своей жене: «Прошу тебя, встань и измени свой облик, чтобы не узнали[a], что ты жена Иеровоама, и отправляйся в Силом. Вот, там пророк Ахия; это он сказал обо мне[b], что я стану царём над этим народом».


    [a] Буквально: «и они не узнают»; в еврейском тексте действующее лицо не определено.


    [b] Или: «это он сказал, что мне быть царём над этим народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и они не узнают»; в еврейском тексте действующее лицо не определено.'
    reason: Сохраняется неопределённость грамматического субъекта формы третьего лица множественного числа.
  - marker: b
    text: 'Или: «это он сказал, что мне быть царём над этим народом».'
    reason: Отмечена альтернативная синтаксическая передача сочетания עָלַי לְמֶלֶךְ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; нейтральный и естественный русский эквивалент.
- source_word: לְאִשְׁתּוֹ
  choice: своей жене
  rationale: Притяжательное отношение передано русским возвратным местоимением, естественным при подлежащем «Иеровоам».
- source_word: קוּמִי נָא
  choice: Прошу тебя, встань
  rationale: Императив сохранён, а частица נָא передана как смягчающая просьба без архаичного оттенка.
- source_word: וְהִשְׁתַּנִּית
  choice: и переоденься
  rationale: В данном контексте hitpael глагола שנה означает изменить свой вид, то есть замаскироваться; «переоденься» естественно и понятно по-русски.
- source_word: וְלֹא יֵדְעוּ
  choice: чтобы не узнали
  rationale: Связь цели естественно выражена союзом «чтобы»; неопределённый субъект множественного числа сохранён без добавления конкретного действующего лица.
- source_word: כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  choice: что ты жена Иеровоама
  rationale: Прямая и естественная передача именной конструкции, сохраняющая повтор имени из исходного текста.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: и отправляйся в Силом
  rationale: Последовательная перфектная форма здесь продолжает повеление; «отправляйся» ясно передаёт указание идти в названное место.
- source_word: הִנֵּה שָׁם
  choice: Вот, там
  rationale: «Вот» сохраняет указательно-привлекающую внимание функцию הִנֵּה, а «там» непосредственно передаёт שָׁם.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: пророк Ахия
  rationale: Порядок слов адаптирован к естественному русскому употреблению при сохранении имени и титула.
- source_word: הוּא דִבֶּר
  choice: это он сказал
  rationale: Конструкция с «это он» сохраняет эмфатическое самостоятельное местоимение הוּא.
- source_word: עָלַי לְמֶלֶךְ
  choice: обо мне, что я стану царём
  rationale: Передаёт עָלַי как «обо мне» и раскрывает статус/результат, выраженный לְמֶלֶךְ, не устраняя синтаксическую неоднозначность, отмеченную в сноске.
- source_word: עַל הָעָם הַזֶּה
  choice: над этим народом
  rationale: Стандартная русская конструкция для царствования над народом, близкая к еврейскому выражению.
theological_decisions:
- issue: Связь עָלַי с последующим לְמֶלֶךְ
  choice: «сказал обо мне, что я стану царём»
  alternative: «сказал, что мне быть царём»
  rationale: Основной текст сохраняет значение עַל «о, касательно» и естественно выражает предсказанное воцарение; сноска отмечает возможную более сжатую передачу конструкции со значением предназначения или статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским тоном. Избегаются архаизмы вроде «восстань» и «се»; повтор имени Иеровоама и эмфаза «это он» сохранены по исходному тексту.
