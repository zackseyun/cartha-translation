  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: ru
  text: Ровоам, сын Соломона, царствовал в Иудее[a]. Ровоаму был сорок один год, когда он стал царём, и он царствовал семнадцать лет в Иерусалиме — городе, который Яхве избрал из всех колен Израиля, чтобы поместить там своё имя[b]. Его мать звали Наама; она была аммонитянкой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царствовал над Иудеей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поместить там своё имя». Это заветное выражение указывает на место, особо связанное с присутствием Яхве и поклонением Ему.'
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти; «царствовал» естественно передаёт оба его употребления и сохраняет отличие от указания на момент восшествия на престол.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Предлог בְּ обычно имеет местное значение «в»; в контексте царской власти возможно также «над Иудеей», что отмечено в сноске.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Сочетание предлога с инфинитивом указывает на время вступления на царство; выбранная формулировка ясна современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: чтобы поместить там своё имя
  rationale: Сохранён буквальный библейский оборот без расширяющего толкования о пребывании имени.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: Предлог מִן выражает выбор из совокупности; «колена Израиля» — устойчивое и понятное библейское обозначение.
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: Его мать звали Наама
  rationale: Естественная современная русская передача формулы «имя его матери — Наама».
- source_word: הָעַמֹּנִית
  choice: она была аммонитянкой
  rationale: Форма женского рода обозначает этническое происхождение Наамы; развернутая конструкция звучит по-русски естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Выражение «поместить там своё имя»
  choice: сохранить исходную метафору
  alternative: «пребывать там» или «устроить там место Своего присутствия»
  rationale: Исходный текст говорит именно о помещении имени. Сохранение оборота не устраняет его богословскую насыщенность и не подменяет её одним толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для исторического повествования. Повтор имени Ровоама сохранён вслед за еврейским текстом. Архаичные формы вроде «аммонитянка родом» или «воцарился» не использованы; синтаксис сделан ясным для широкого круга читателей.
