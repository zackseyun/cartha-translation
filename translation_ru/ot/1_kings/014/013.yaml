  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: ru
  text: Весь Израиль будет оплакивать его и похоронит его, ибо только он один из дома Иеровоама будет предан погребению[a], так как в нём, в доме Иеровоама, нашлось нечто доброе[b] по отношению к Яхве, Богу Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально содержит трудный оборот: «только этот придёт для Иеровоама к могиле». По смыслу: только он из дома Иеровоама будет погребён.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что-то хорошее» или «доброе дело».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к Яхве». Это может обозначать расположение, обращённое к Яхве, или нечто доброе в отношении к Нему, угодное Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: будет оплакивать его
  rationale: Глагол ספד обозначает траурное оплакивание умершего. Эта передача естественна для современного русского языка и сохраняет контекст всенародного траура.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: и похоронит его
  rationale: Единственное число сказуемого согласуется с собирательным подлежащим «весь Израиль»; выражение прямо передаёт действие погребения.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: потому что ... он один
  rationale: Передаёт подчёркнутую исключительность этого сына в противопоставлении всему дому Иеровоама.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: из всего дома Иеровоама он один будет погребён
  rationale: Буквальное «придёт к Иеровоаму в могилу» неясно по-русски. В контексте речь о том, что лишь этот член дома Иеровоама удостоится погребения; буквальная форма отмечена в сноске.
- source_word: יַעַן נִמְצָא בוֹ
  choice: ведь только в нём ... нашлось
  rationale: Сохраняет причинное значение יַעַן и пассивную формулировку נִמְצָא, не уточняя, кем было обнаружено доброе.
- source_word: דָּבָר טוֹב
  choice: нечто доброе
  rationale: 'Сохраняет неопределённость и широту דָּבָר: это может быть качество, расположение или поступок, а не обязательно отдельное «доброе дело».'
- source_word: אֶל יְהוָה
  choice: по отношению к Яхве
  rationale: Передаёт направленность или отношение, выраженное предлогом אֶל, не сводя смысл исключительно к внутреннему расположению либо к богоугодности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּבֵית יָרָבְעָם
  choice: во всём доме Иеровоама
  rationale: «Дом» сохраняет семейно-династический смысл. Добавление «всём» естественно выражает подразумеваемое сопоставление этого сына с остальными членами дома.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Смысл выражения דָּבָר טוֹב אֶל יְהוָה
  choice: нечто доброе по отношению к Яхве
  alternative: нечто угодное Яхве
  rationale: 'Выбранная формулировка сохраняет неоднозначность: речь может идти о направленном к Яхве расположении или о качестве, положительно оцениваемом Им. Более интерпретирующее «угодное» оставлено как пояснительная возможность.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Собирательное «весь Израиль» сочетается со сказуемыми в единственном числе. Синтаксис последней части слегка перестроен ради ясности, но повтор «дом Иеровоама» сохранён, как в еврейском тексте.
