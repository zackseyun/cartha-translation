base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: ru
  text: И Он предаст Израиль[a] за грехи Иеровоама, которые он совершил и которыми ввёл Израиль в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даст Израиль». В контексте суда этот еврейский глагол означает, что Бог отдаст народ во власть бедствия или врагов.'
    reason: Лексическая альтернатива и пояснение контекстуального значения.
lexical_decisions:
- source_word: וְיִתֵּן
  choice: И Он предаст
  rationale: Глагол נתן буквально означает «дать», но здесь, в контексте суда, выражает передачу народа во власть бедствия или врагов. «Предаст» естественно передаёт этот смысл, не уточняя орудие суда, не названное в стихе.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Название народа и северного царства употреблено как прямое дополнение и понимается собирательно.
- source_word: בִּגְלַל
  choice: за
  rationale: Предлог указывает на причину суда. В сочетании «предаст… за грехи» русское «за» ясно и естественно выражает воздаяние по причине грехов.
- source_word: חַטֹּאות יָרָבְעָם
  choice: грехи Иеровоама
  rationale: Сохранены множественное число существительного и традиционная русская форма имени.
- source_word: אֲשֶׁר חָטָא
  choice: которыми тот согрешил
  rationale: Формулировка сохраняет однокоренную связь между «грехами» и «согрешил», а местоимение «тот» однозначно относит действие к Иеровоаму.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: и ввёл в грех Израиль
  rationale: Каузативная форма חטא означает, что Иеровоам побудил или привёл Израиль ко греху. «Ввёл в грех» сохраняет каузативный смысл без лишнего уточнения способа.
theological_decisions:
- issue: Образ действия Божьего суда
  choice: Он предаст Израиль
  alternative: Он отдаст Израиль
  rationale: Перевод передаёт действие Бога как суда, но не называет бедствие, врагов или иной инструмент, поскольку в данном стихе они не уточнены.
- issue: Личная вина Иеровоама и его воздействие на народ
  choice: которыми тот согрешил и ввёл в грех Израиль
  alternative: которые он совершил и которыми побудил Израиль грешить
  rationale: 'Сохранены обе стороны еврейского текста: собственный грех Иеровоама и каузативное воздействие, вследствие которого грешил Израиль.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавное «Он» указывает на Бога из контекста. Синтаксис сохраняет краткость и напряжённость исходного высказывания.
