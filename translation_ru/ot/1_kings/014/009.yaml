source:
  edition: WLC
  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: ru
  text: и поступал хуже всех, кто был до тебя. Ты пошёл и сделал себе других богов и литые изображения[a], чтобы вызвать Мой гнев, а Меня отбросил за спину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть изображения, изготовленные литьём, вероятно металлические культовые предметы.
    reason: Уточнение конкретного значения еврейского מַסֵּכוֹת и способа изготовления изображений.
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: поступал хуже всех
  rationale: Сочетание רעה с לעשות обозначает злое, нечестивое поведение, а מִכֹּל задаёт сравнение. По-русски «поступал хуже всех» естественно передаёт сравнительную степень без тяжеловесного «делал больше зла».
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: кто был до тебя
  rationale: לְפָנֶיךָ имеет здесь временной смысл и указывает на предшественников Иеровоама.
- source_word: וַתֵּלֶךְ
  choice: Ты пошёл
  rationale: Сохранён отдельный последовательный глагол, подчёркивающий сознательное продолжение действий; русская формулировка также удерживает еврейский повествовательный акцент.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: сделал себе
  rationale: Дательный לְּךָ передаёт направленность действия на самого адресата; «сделал себе» естественно и точно.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: других богов
  rationale: Прямое соответствие устойчивому заветному выражению; вариант «чужих богов» мог бы привнести оттенок этнической чуждости, не обязательный в данном месте.
- source_word: וּמַסֵּכוֹת
  choice: литые изображения
  rationale: מַסֵּכוֹת обозначает культовые изображения, изготовленные литьём. Формулировка сохраняет как предметный, так и производственный смысл, не сводя слово просто к общему «идолы».
- source_word: לְהַכְעִיסֵנִי
  choice: чтобы вызвать Мой гнев
  rationale: Инфинитив Hiphil от כעס с объектным суффиксом выражает причинение Божьего гнева; выбранная фраза естественна в современном русском и сохраняет целевое значение לְ.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: а Меня отбросил за спину
  rationale: Сохранена резкая телесная метафора презрительного отвержения. «Отбросил» передаёт силу השליך и звучит в современном русском естественнее, чем буквальное «бросил» в данном обороте.
theological_decisions:
- issue: Передача языка идолопоклонства без смягчения заветного обвинения
  choice: других богов и литые изображения
  alternative: чужих богов и идолов
  rationale: Перевод сохраняет различие между богами как объектами незаконного поклонения и конкретными культовыми изображениями, не объединяя оба понятия общим словом «идолы».
- issue: Сохранение образа отвержения Бога
  choice: а Меня отбросил за спину
  alternative: а Мной пренебрёг
  rationale: Еврейский текст использует намеренно резкую пространственную метафору. Её сохранение передаёт богословскую тяжесть личного и презрительного отвержения Бога, не заменяя образ толкованием.
- issue: Сравнительная оценка зла Иеровоама
  choice: поступал хуже всех, кто был до тебя
  alternative: сделал больше зла, чем все бывшие до тебя
  rationale: Смысл сравнения сохранён без уточнения, кого именно включает круг предшественников; тем самым не снимается возможная контекстуальная напряжённость выражения.
translation_notes:
  register: Современный литературный русский с достоинством пророческого обвинения. Синтаксис остаётся ясным для широкого читателя; прописные буквы в «Мой» и «Меня» обозначают речь Бога по принятой русской библейской традиции. Начальное «и» сохранено, поскольку стих продолжает предыдущее высказывание.
