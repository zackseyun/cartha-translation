  terminology: «Другие боги» сохраняет традиционную библейскую терминологию без добавления этнического значения. «Литые изображения» точно отражает способ изготовления, подразумеваемый מַסֵּכוֹת. Личные местоимения с прописной буквы последовательно передают речь Бога в принятой русской библейской орфографии.
