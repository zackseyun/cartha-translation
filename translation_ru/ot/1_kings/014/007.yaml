source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: ru
  text: 'Иди и скажи Иеровоаму: «Так говорит Яхве, Бог Израиля: за то, что Я возвысил тебя из среды народа и поставил тебя правителем над Моим народом Израилем…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Иди и скажи
  rationale: Два императива женского рода передают прямое поручение жене Иеровоама; по-русски эта формула звучит естественно.
- source_word: לְיָרָבְעָם
  choice: Иеровоаму
  rationale: Предлог לְ обозначает адресата речи; использована традиционная русская форма имени.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена узнаваемая и достойная пророческая формула в настоящем времени, естественная для русского библейского стиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт еврейскую сопряжённую конструкцию.
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Вводит основание последующего суда; оборот сохраняет причинный смысл и хорошо сочетается с продолжением речи в следующем стихе.
- source_word: הֲרִימֹתִיךָ
  choice: Я возвысил тебя
  rationale: Hiphil от רום обозначает возведение к более высокому положению; «возвысил» передаёт политико-статусную метафору без лишнего пояснения.
- source_word: מִתּוֹךְ הָעָם
  choice: из среды народа
  rationale: Точно передаёт выбор человека из числа народа и сохраняет возвышенный, но понятный регистр.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: и поставил тебя правителем
  rationale: Буквально «дал тебя правителем» является еврейской конструкцией назначения; «поставил» естественно выражает назначение на должность.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: над Моим народом Израилем
  rationale: Сохраняет власть «над» народом, божественное притяжательное местоимение и приложение «Израилем».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, без подмены титулом.
- issue: Значение נָגִיד в политическом контексте
  choice: правитель
  alternative: вождь; предводитель; князь
  rationale: Слово обозначает лицо, поставленное у власти. «Правитель» ясно передаёт официальные полномочия, не уточняя сверх текста форму монархического статуса.
- issue: Синтаксическая незавершённость стиха
  choice: сохранить продолжение фразы многоточием
  alternative: завершить фразу точкой
  rationale: Причинная конструкция יַעַן אֲשֶׁר продолжается в следующих стихах и получает главное предложение позднее; многоточие показывает, что пророческая речь не окончена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим регистром. Формы «Так говорит», «из среды народа» сохраняют достоинство исходной речи, оставаясь понятными. Заглавные буквы в местоимениях «Я», «Моим» применены как издательская норма благоговейного обращения к Богу, не меняющая смысла текста.
