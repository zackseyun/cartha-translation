base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: ru
  text: Иудея делала зло в глазах Господа и своими грехами вызывала в Нём ревность[a] больше, чем всеми делами своих предков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вызывала в Нём ревность»; «побуждала Его ревновать». В еврейском тексте употреблён язык ревности Господа в ответ на неверность Иудеи завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Название южного царства и его народа употреблено собирательно; поэтому далее естественно множественное «их».
- source_word: הָרַע
  choice: делала зло
  rationale: Естественно передаёт устойчивое сочетание עשה + הרע, сохраняя его нравственную оценку.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Господа
  rationale: Сохраняет ясную для современного русского читателя древнееврейскую оценочную метафору; имя יהוה передано традиционным «Господь».
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: раздражала Его ревность
  rationale: Передаёт побудительное значение глагола и сохраняет язык Божьей ревности в контексте нарушения заветной верности.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: сильнее, чем всё, что делали их предки
  rationale: Передаёт сравнительное значение מן; «предки» в современном русском яснее, чем буквальное «отцы».
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: своими грехами
  rationale: Естественно свёртывает древнееврейское сочетание однокоренных существительного и глагола, сохраняя инструментальное значение предлога בְּ.
theological_decisions:
- issue: Язык Божьей ревности
  choice: раздражала Его ревность
  alternative: вызывала в Нём ревность; побуждала Его ревновать
  rationale: Формулировка сохраняет библейскую категорию ревности Господа в ответ на неверность народа и не заменяет её более общим гневом; речь идёт не о греховной зависти, а о ревности в отношениях завета.
translation_notes:
  register: Современный литературный русский с умеренно формальным, библейски достойным звучанием. Собирательное «Иудея» согласовано с единственным числом в первой части; местоимение «их» отражает последующий древнееврейский переход к множественному числу.
