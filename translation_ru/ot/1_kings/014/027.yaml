lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное повествовательное значение עשה; «сделал» естественно и точно передаёт изготовление щитов.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: царь Ровоам
  rationale: Соответствует нормальному порядку слов и принятой русской форме имени.
- source_word: תַּחְתָּם
  choice: вместо них
  rationale: Суффикс отсылает к золотым щитам из предыдущего стиха; выражение прямо обозначает замену.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: бронзовые щиты
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в контексте древних изделий «бронзовые» является наиболее вероятным и привычным соответствием.
- source_word: וְהִפְקִיד עַל יַד
  choice: передал
  rationale: Конструкция означает отдать под чьё-либо ведение или ответственность; «передал» естественно выражает это по-русски без буквального гебраизма «в руку».
- source_word: שָׂרֵי הָרָצִים
  choice: начальникам скороходов
  rationale: Сохраняется буквальный образ «бегущих» как особого царского корпуса, не сводя его без достаточных оснований только к страже; возможная функция пояснена в сноске.
- source_word: הַשֹּׁמְרִים
  choice: охранявших
  rationale: Причастие передаёт постоянную обязанность этого корпуса и естественно связывается с предшествующей группой.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: вход в царский дворец
  rationale: Буквально «вход дома царя», но в данном контексте בֵּית הַמֶּלֶךְ обозначает царский дворец; явное русское обозначение устраняет возможное неверное понимание как частного дома.
