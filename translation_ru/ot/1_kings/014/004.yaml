base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: ru
  text: Жена Иеровоама так и сделала. Она встала, пошла в Силом и пришла к дому Ахии. Ахия же не мог видеть, потому что от старости глаза его померкли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаза его встали» — древнееврейское выражение, обозначающее утрату зрения в старости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: так и сделала
  rationale: 'Естественная русская передача повествовательной формулы: жена Иеровоама исполнила данное ей указание.'
- source_word: אֵשֶׁת יָרָבְעָם
  choice: жена Иеровоама
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
- source_word: וַתָּקָם
  choice: встала
  rationale: Сохраняет отдельное звено последовательного древнееврейского повествования и звучит естественно в современном русском языке.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: пошла в Силом
  rationale: Простой глагол движения и форма с предлогом «в» ясно передают направление к месту назначения.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: пришла к дому Ахии
  rationale: Передаёт прибытие к дому, не уточняя без достаточного основания, вошла ли она внутрь.
- source_word: וַאֲחִיָּהוּ
  choice: Ахия же
  rationale: Частица «же» естественно обозначает смену фокуса повествования и переход к состоянию Ахии.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: не мог видеть
  rationale: Прямая, ясная и стилистически нейтральная передача конструкции способности с инфинитивом.
- source_word: קָמוּ עֵינָיו
  choice: глаза его померкли
  rationale: Естественно передаёт возрастную утрату зрения; необычный буквальный образ «глаза встали» сохранён в примечании.
- source_word: מִשֵּׂיבוֹ
  choice: от старости
  rationale: Кратко и идиоматично передаёт причинное значение предлога и существительного.
