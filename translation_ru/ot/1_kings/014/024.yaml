  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: ru
  text: Были в стране и мужчины, занимавшиеся культовой проституцией[a]. Они совершали те же мерзости, что и народы, которых Яхве изгнал перед сынами Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «культовые служители». Еврейское קָדֵשׁ — существительное мужского рода; традиционно его понимают как обозначение мужчины, связанного с запрещённой культовой сексуальной практикой. Точный характер этого статуса или практики оспаривается. Форма единственного числа здесь употреблена собирательно.'
    reason: Передаёт вероятное контекстуальное значение, сохраняет мужской род исходного слова и отмечает существующую лексико-историческую неопределённость, не утверждая спорную деталь как несомненную.
lexical_decisions:
- source_word: וְגַם
  choice: и
  rationale: 'Передаёт присоединительное значение: это ещё одно обвинение в ряду перечисленных нарушений.'
- source_word: קָדֵשׁ
  choice: культовые блудники
  rationale: Существительное мужского рода в единственном числе употреблено здесь собирательно в бытийной конструкции. Выбор указывает на связь этих людей с запретной культовой сексуальной практикой и не вносит ошибочных ассоциаций традиционного перевода «содомиты».
- source_word: הָיָה בָאָרֶץ
  choice: были в стране
  rationale: Бытийное значение глагола с обстоятельством места; множественное число согласовано с естественной русской передачей собирательного קָדֵשׁ.
- source_word: עָשׂוּ
  choice: они совершали
  rationale: Передаёт широкий смысл глагола עשׂה и естественно сочетается в русском языке с существительным «мерзости».
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: все мерзости
  rationale: Сохраняет полноту, выраженную כְּכֹל, и сильную нравственно-религиозную оценку слова תּוֹעֲבוֹת; сравнительное уподобление ясно из принадлежности этих мерзостей народам.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: В данном историческом контексте обозначает не израильские народы Ханаана; «народы» не привносит более поздних новозаветных оттенков.
- source_word: הוֹרִישׁ
  choice: прогнал
  rationale: Порода хифиль здесь обозначает лишение прежних жителей владения и их удаление; «прогнал» естественно передаёт формулу завоевания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного заветного имени Бога.
- source_word: מִפְּנֵי
  choice: перед
  rationale: Сохраняет пространственный образ удаления народов перед наступающим Израилем и звучит естественно в формуле «прогнал перед».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Сохраняет форму исходного этнонима и его грамматически мужской семейный образ.
theological_decisions:
- issue: Значение קָדֵשׁ в контексте запретного культа и сексуальной практики
  choice: культовые блудники
  alternative: культовый блудник; храмовые блудники; культовые служители
  rationale: Перевод сохраняет культовую и сексуальную составляющие термина, но избегает традиционного «содомиты», которое вносит не требуемые еврейским словом позднейшие ассоциации. Собирательное множественное число естественно по-русски и согласуется с последующим глаголом во множественном числе.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Буквенная семейная формула сохранена без нейтрализации, при этом она понятна как историческое обозначение народа.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передаётся личное имя, а не заменяющий его титул.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. «Сыны Израиля» намеренно сохраняет исходную семейную формулу; остальная фраза избегает архаической синтаксической тяжеловесности.
