  source_fidelity: В черновике верно переданы бытийная конструкция, собирательное употребление קָדֵשׁ, имя Яхве и формула изгнания народов. Однако «совершали все мерзости народов» не выражает сравнительно-уподобительное כְּכֹל («подобно всем / согласно всем мерзостям»), превращая его в прямое дополнение. Значение קָדֵשׁ в отношении именно культовой проституции лексически и исторически не вполне бесспорно; его следует отметить в сноске без категоричности.
  naturalness: «Культовые блудники» понятно, но в современном литературном русском несколько шероховато и может обозначать просто людей, предающихся распутству. «Мужчины, занимавшиеся культовой проституцией» ясно передаёт выбранное значение и сохраняет мужской род, при этом сноска честно отмечает спорность нюанса. «Совершали те же мерзости, что и народы» — естественная русская передача сравнительного оборота.
  terminology: «Мерзости», «народы», «Яхве» и «сыны Израиля» уместны. Для קָדֵשׁ безопаснее дать ясный основной перевод и сноску с альтернативой «культовые служители», поскольку точный характер статуса и практики оспаривается; не следует представлять «храмовых» как несомненный вариант, поскольку привязка именно к храму не выражена непосредственно.
