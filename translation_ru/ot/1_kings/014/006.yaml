base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: ru
  text: 'Когда Ахия услышал звук её шагов, когда она подходила ко входу, он сказал: «Войди, жена Иеровоама! Зачем ты притворяешься другой?[a] Я послан к тебе с тяжёлой вестью[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зачем ты скрываешь, кто ты?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я послан к тебе с тяжёлым»; в еврейском тексте существительное не названо, но подразумевается тяжёлая весть или суровое сообщение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: звук её шагов
  rationale: Передаёт буквальный образ «звук её ног» естественным современным русским выражением.
- source_word: בָּאָה בַפֶּתַח
  choice: когда она входила в дверной проём
  rationale: Передаёт сопутствующее действие и значение פתח как входа или проёма, а не обязательно самой двери.
- source_word: בֹּאִי
  choice: Входи
  rationale: Естественная форма повелительного наклонения женского рода, соответствующая ситуации.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: жена Иеровоама
  rationale: Сохраняет прямое обращение и конструктивную связь исходного текста.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Зачем ты выдаёшь себя за другую?
  rationale: Возвратная форма נכר здесь обозначает попытку казаться другим человеком и быть неузнанной; формулировка сохраняет этот оттенок яснее, чем общее «переодеваешься».
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: Я послан к тебе
  rationale: Кратко и непосредственно передаёт состояние, выраженное страдательным причастием, не называя подразумеваемого отправителя.
- source_word: קָשָׁה
  choice: с тяжёлой вестью
  rationale: В еврейском тексте прилагательное «тяжёлая» употреблено без явного существительного. «Весть» естественно восполняет эллипсис в пророческом контексте, не устраняя его из примечания.
theological_decisions:
- issue: Подразумеваемое существительное при קָשָׁה
  choice: «с тяжёлой вестью» с примечанием об эллипсисе
  alternative: «с суровым словом»; «для тяжёлого поручения»
  rationale: Контекст указывает на тяжёлое известие или пророческое сообщение, но еврейский текст не называет существительного. Основной текст должен быть понятен по-русски, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. «Иеровоам» соответствует традиционной русской передаче имени; синтаксис прямой речи остаётся ясным и естественным.
