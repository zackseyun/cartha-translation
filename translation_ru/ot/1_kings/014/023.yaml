    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: устроили
  rationale: Хотя בנה буквально означает «строить», здесь глагол относится сразу к разнородным культовым сооружениям и предметам; «устроили» естественно охватывает весь перечень, не меняя смысла.
- source_word: גַם הֵמָּה
  choice: и они тоже
  rationale: Передаёт присоединительное и эмфатическое значение сочетания и связывает поступки народа с предыдущим контекстом.
- source_word: לָהֶם
  choice: себе
  rationale: 'Кратко и естественно передаёт возвратное значение: они создавали эти культовые места и предметы для собственного поклонения.'
- source_word: בָּמוֹת
  choice: высоты
  rationale: Устоявшийся библейский термин для мест местного культа, не обязательно расположенных только на вершинах; сохраняет лексическую связь с повторяющимся понятием книг Царств.
- source_word: מַצֵּבוֹת
  choice: священные камни
  rationale: מַצֵּבָה обозначает вертикально поставленный культовый камень; этот вариант яснее современному читателю, чем неоднозначное «столпы», и отличает их от деревянных культовых объектов следующего пункта.
- source_word: אֲשֵׁרִים
  choice: столбы Ашеры
  rationale: Множественное число в перечне культовых объектов, вероятнее всего, обозначает предметы, связанные с богиней Ашерой. Перевод сохраняет эту связь, а примечание указывает на неопределённость точного вида предмета.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: на каждом высоком холме
  rationale: Прямой и естественный перевод стереотипной формулы о местах незаконного культа.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: и под каждым раскидистым деревом
  rationale: רַעֲנָן описывает свежее, пышное, обильно покрытое листвой дерево; «раскидистым» естественно передаёт образ дерева, дающего тень, и лучше современного буквального «зелёным».
theological_decisions:
- issue: Обозначает ли אֲשֵׁרִים саму богиню Ашеру или связанные с ней культовые предметы
  choice: культовые предметы, переданные как «столбы Ашеры»
  alternative: «ашеры», «священные столбы», «изображения Ашеры»
  rationale: Положение в ряду с высотами и священными камнями указывает прежде всего на материальные культовые объекты. При этом исходное слово не определяет однозначно их форму, поэтому неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской терминологией. «Высоты» оставлены как важный повторяющийся термин книг Царств; менее прозрачные культовые реалии пояснены контекстом и сноской.
