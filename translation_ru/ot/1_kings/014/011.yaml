  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: ru
  text: Кто из дома Иеровоама умрёт в городе[a], того съедят псы, а кто умрёт в поле, того съедят птицы небесные[b], ибо Яхве сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умерший, принадлежащий Иеровоаму»; то есть любой человек из дома Иеровоама, который умрёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «птицы небес»; также возможно: «птицы неба» или традиционное «птицы небесные».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Кто из дома Иеровоама умрёт
  rationale: Буквальная конструкция «умерший, принадлежащий Иеровоаму» идиоматически указывает на любого человека из его дома. Формулировка сохраняет неопределённо-распределительный смысл и естественна по-русски.
- source_word: בָּעִיר
  choice: в городе
  rationale: Прямое обозначение места; определённая форма по контексту естественно передаётся как «в городе».
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: того съедят псы
  rationale: Глагол אָכַל означает «есть, съедать». Объект, подразумеваемый в еврейском тексте, в русском выражен местоимением «того» для ясности. «Псы» сохраняет высокий библейский регистр без усиления до «растерзают».
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: а кто умрёт в поле
  rationale: Сохранены параллелизм и прямое значение שָׂדֶה «поле»; союз передан как контрастное «а» в противопоставлении городу.
- source_word: עוֹף הַשָּׁמָיִם
  choice: небесные птицы
  rationale: Собирательное עוֹף передано множественным числом «птицы», а הַשָּׁמָיִם — естественным русским определением «небесные».
- source_word: כִּי יְהוָה דִּבֵּר
  choice: потому что так сказал Яхве
  rationale: כִּי вводит основание и непреложность приговора. Добавленное по смыслу «так» делает русскую фразу естественной, а перфект דִּבֵּר передан прошедшим временем. Личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Объём выражения לְיָרָבְעָם
  choice: из дома Иеровоама
  alternative: принадлежащий Иеровоаму; из потомков Иеровоама
  rationale: Контекст пророчества касается дома Иеровоама. «Дом» достаточно широко охватывает его династию и домашних, не сужая смысл исключительно до биологических потомков.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм двух судеб сохранён. Глаголы «съедят» и «склюют» передают один и тот же еврейский глагол идиоматично с учётом разных действующих животных; это небольшая стилистическая конкретизация, не меняющая образа.
