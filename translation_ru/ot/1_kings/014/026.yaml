  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: ru
  text: Он забрал сокровища дома Яхве[a] и сокровища царского дворца — забрал всё. Забрал он и все золотые щиты, которые сделал Соломон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм.
    reason: лексическое пояснение буквального выражения «дом Яхве»
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: забрал
  rationale: В контексте разграбления «забрал» естественно передаёт לקח и его повтор, не усиливая значение до «захватил» или «похитил».
- source_word: אֹצְרוֹת
  choice: сокровища
  rationale: Здесь речь идёт о вынесенных ценностях, а не о помещениях или хранилищах.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ еврейского выражения; в данном контексте это храм, что поясняется в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дворец
  rationale: Функционально и естественно передаёт буквальное «дом царя» в современном русском языке.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: забрал всё
  rationale: Сохраняет итоговый и подчёркнуто всеохватный характер фразы.
- source_word: מָגִנֵּי הַזָּהָב
  choice: золотые щиты
  rationale: Естественная русская передача конструкции «щиты из золота».
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: которые сделал Соломон
  rationale: Русский вид глагола и контекст ясно указывают, что щиты были изготовлены ранее; отдельная форма давнопрошедшего времени не требуется.
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: Он забрал ... Забрал он и
  rationale: Повтор ключевого глагола сохраняет риторический акцент еврейского текста, а инверсия во втором предложении естественно выражает добавление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Понимание выражения בֵּית יְהוָה
  choice: дом Яхве с пояснением «то есть храм»
  alternative: храм Яхве непосредственно в тексте
  rationale: Основной текст сохраняет образ исходного выражения, а сноска обеспечивает ясность без устранения его лексической формы.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Тире подчёркивает суммарную фразу «забрал всё», а повтор «забрал» отражает риторическую структуру оригинала.
