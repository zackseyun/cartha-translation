- from: И между Ровоамом и Иеровоамом всё время шла война[a].
  to: И между Ровоамом и Иеровоамом во все дни шла война[a].
  rationale: Исправление сохраняет синтаксис и смысл оригинала, но заменяет более обобщённое «всё время» на близкое к тексту «во все дни». Сноска теперь отмечает буквальное выражение и его длительное значение, не добавляя «рассматриваемый период» и не отдавая предпочтения жизни либо царствованию как референту.
