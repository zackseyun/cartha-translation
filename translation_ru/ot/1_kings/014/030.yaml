  text: И между Ровоамом и Иеровоамом во все дни шла война[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во все дни». Еврейское выражение указывает на постоянство конфликта, не уточняя, чьи именно дни имеются в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: И … шла война
  rationale: Сочетание существительного מִלְחָמָה с формой היה обозначает существование или продолжение состояния войны. Русское «шла война» естественно передаёт это значение, не добавляя идеи непрерывных боевых действий.
- source_word: בֵין רְחַבְעָם וּבֵין יָרָבְעָם
  choice: между Ровоамом и Иеровоамом
  rationale: Парная конструкция בֵין … וּבֵין прямо обозначает отношения между двумя противостоящими сторонами. Имена переданы в традиционной русской библейской форме.
- source_word: כָּל הַיָּמִים
  choice: всё время
  rationale: Буквально «все дни». В современном русском «всё время» естественно передаёт длительность конфликта, а примечание сохраняет формальную особенность и неоднозначность еврейского выражения.
theological_decisions:
- issue: К какому периоду относится выражение כָּל הַיָּמִים
  choice: Не уточнять в основном тексте, чьи именно это дни
  alternative: «во все дни их жизни» или «на протяжении их царствований»
  rationale: В еврейском тексте нет притяжательного местоимения и прямо не сказано, идёт ли речь о жизни, царствовании или всём рассматриваемом периоде. Уточнение вынесено в примечание, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествовательного стиля. Оборот «шла война» выбран как естественный русский эквивалент, а не как утверждение о непрерывных сражениях.
