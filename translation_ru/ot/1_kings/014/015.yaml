base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: ru
  text: И Яхве поразит Израиль, как тростник колеблется в воде. Он вырвет Израиль из этой доброй земли, которую дал их отцам, и рассеет их за Рекой[a], потому что они сделали свои ашеры[b], вызывая гнев Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть за Евфратом; в данном контексте «Река» означает Евфрат.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «свои ашеры» — культовые предметы, связанные с богиней Ашерой; их часто считают деревянными столбами или изображениями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: И поразит
  rationale: Перфект с вау в пророческом контексте передаёт будущее действие суда; «поразит» сохраняет силу глагола и звучит естественно и достойно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: и тот станет подобен тростнику, колеблемому в воде
  rationale: Сравнение относится к поражённому Израилю; такая формулировка ясно передаёт образ неустойчивого движения, не уточняя внешнюю причину колебания.
- source_word: וְנָתַשׁ
  choice: Он исторгнет
  rationale: Глагол обозначает вырывание, в том числе с корнем; «исторгнет ... из земли» сохраняет образ насильственного удаления и естественно сочетается с контекстом изгнания.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: из этой доброй земли
  rationale: «Земля» соответствует заветному контексту дара, а «добрая» сохраняет оценочное определение исходного текста.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: которую дал их отцам
  rationale: Сохраняется буквальное «отцам» и связь нынешнего поколения с предками — получателями земли.
- source_word: וְזֵרָם
  choice: и рассеет их
  rationale: «Рассеет» прямо передаёт разбрасывание и в данном контексте ясно указывает на изгнание народа.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: за Рекой
  rationale: Сохраняется исходное обозначение «Река»; исторический референт, Евфрат, поясняется в сноске.
- source_word: יַעַן אֲשֶׁר
  choice: потому что
  rationale: Современный и точный способ ввести основание объявленного суда.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: они сделали себе ашеры
  rationale: Транслитерация сохраняет неоднозначность формы культовых предметов, связанных с богиней Ашерой; «себе» естественно передаёт притяжательный суффикс.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: вызывая гнев Яхве
  rationale: Причастная конструкция передана деепричастным оборотом; упоминание гнева эксплицирует значение глагола כעס и ясно выражает результат идолопоклонства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Референт выражения «за Рекой»
  choice: Сохранить «за Рекой» в тексте и пояснить в сноске
  alternative: за Евфратом
  rationale: Так сохраняется формулировка древнееврейского текста, а историческая идентификация остаётся прозрачной для современного читателя.
- issue: Значение אֲשֵׁרֵיהֶם
  choice: ашеры
  alternative: столбы Ашеры; изображения Ашеры
  rationale: Точная форма культовых объектов остаётся предметом обсуждения. Транслитерация не сводит термин исключительно к деревянным столбам или изображениям, а сноска даёт необходимое пояснение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис разделён на два предложения ради ясности длинного пророческого высказывания; метафоры поражения, исторжения и рассеяния сохранены. Все сноски отмечены в основном тексте.
