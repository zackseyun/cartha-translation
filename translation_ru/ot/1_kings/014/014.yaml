  naturalness: «И воздвигнет Яхве себе царя над Израилем» соответствует умеренно библейскому, но понятному современному литературному регистру. Обрывочное «Но что? Даже теперь» намеренно необычно, поскольку такова синтаксическая трудность оригинала.
  terminology: «Яхве», «дом Иеровоама» и «истребит» уместны. Строчная форма «себе» соответствует обычной современной русской орфографии; прописная буква в местоимении не требуется и создаёт конфессионально-стилистическое выделение, отсутствующее в источнике.
