  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: ru
  text: И воздвигнет Яхве себе царя над Израилем, который истребит дом Иеровоама в этот день[a]. Но что? Даже теперь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Конец еврейской фразы обрывочен и труден для понимания; буквально: «и что? даже теперь». Возможно, это восклицание, подчёркивающее близость суда: «Но что? Даже теперь!» или «Что же ещё? Уже теперь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: воздвигнет
  rationale: Каузативная форма глагола קום означает «воздвигнуть, поставить, установить». «Воздвигнет» сохраняет библейский образ появления правителя по Божьей воле, не уточняя способ его воцарения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: לּוֹ
  choice: Себе
  rationale: Местоименный суффикс естественно отнесён к подлежащему — Яхве; возвратное местоимение ясно передаёт смысл «воздвигнет для Себя».
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: царя над Израилем
  rationale: Предлог עַל при обозначении царской власти передаёт правление над народом.
- source_word: אֲשֶׁר יַכְרִית
  choice: который истребит
  rationale: В породе хифиль כרת может означать полное устранение или истребление. Русское «истребит» естественно применительно к царскому роду и передаёт суровость суда.
- source_word: בֵּית יָרָבְעָם
  choice: дом Иеровоама
  rationale: «Дом» сохраняет библейское династическое обозначение семьи и потомков царя, не сужая его до современного понятия династии.
- source_word: זֶה הַיּוֹם
  choice: в этот день
  rationale: Передаёт буквальное «этот день» и сохраняет связь с трудным, обрывочным окончанием стиха.
- source_word: וּמֶה גַּם עָתָּה
  choice: Но что? Уже сейчас.
  rationale: Фраза синтаксически сжата и неясна. Такой перевод сохраняет её резкий, обрывочный характер; «уже сейчас» естественно передаёт усилительное גַּם עָתָּה в данном контексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и не вводит конфессиональной замены.
- issue: Толкование трудного окончания וּמֶה גַּם עָתָּה
  choice: 'Сохранить обрывочность: «Но что? Уже сейчас».'
  alternative: «Но что ещё? Это начинается уже сейчас»; «И что? Даже теперь»
  rationale: Еврейская конструкция эллиптична и допускает несколько пониманий. Основной текст не разворачивает её в определённое толкование, а примечание сообщает о неясности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Слова «воздвигнет» и «дом Иеровоама» сохраняют узнаваемую библейскую образность, а трудное окончание намеренно не сглажено.
