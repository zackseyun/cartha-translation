lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Точно и естественно передаёт временной оборот «в/в то время» и сохраняет повествовательную связь с предшествующими событиями.
- source_word: חָלָה
  choice: заболел
  rationale: Глагол обозначает наступление болезни; русское «заболел» естественно передаёт изменение состояния, в отличие от более статичного «был болен».
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Устоявшаяся русская библейская передача этого личного имени.
- source_word: בֶן יָרָבְעָם
  choice: сын Иеровоама
  rationale: Непосредственно передаёт еврейскую сопряжённую конструкцию и естественно звучит по-русски; приложение выделено запятыми для ясности.
