base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: ru
  text: Его похоронили, и весь Израиль оплакивал его, по слову Яхве, которое Он изрёк через Своего слугу, пророка Ахию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Его похоронили
  rationale: Форма Qal wayyiqtol передаёт последовательное событие повествования; начальное ו естественно выражено порядком фразы без обязательного «и».
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: оплакивал его
  rationale: ספד обозначает траурное оплакивание умершего; русское «оплакивать» естественно и не уточняет без необходимости, было ли оно непременно громким.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Собирательное обозначение народа сохранено в привычной русской библейской формулировке; сказуемое поставлено в единственном числе по форме подлежащего.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняется формула соответствия ранее произнесённому пророческому слову и личное имя, представленное тетраграмматоном.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое Он изрёк
  rationale: Относительное местоимение относится к «слову»; «изрёк» уместно для торжественного пророческого контекста, а прошедшее время указывает на предшествовавшее возвещение.
- source_word: בְּיַד עַבְדּוֹ
  choice: через Своего слугу
  rationale: Идиома буквально означает «рукой своего слуги» и указывает на посредничество; «через» естественно передаёт её смысл в современном русском.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: пророка Ахию
  rationale: Определённый титул и имя переданы естественным русским приложением; форма «Ахию» соответствует винительному падежу после конструкции с «через».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Формула пророческого посредничества בְּיַד עַבְדּוֹ
  choice: через Своего слугу
  alternative: рукой Своего слуги
  rationale: Выбранный вариант ясно передаёт посредничество Ахии, не добавляя утверждений о механизме пророческой речи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Формулировка сохраняет пророческую формулу исполнения, но избегает ненужного буквализма идиомы בְּיַד.
