base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие дела Ровоама и всё, что он сделал, записаны в Книге летописей царей Иудеи[a], не так ли?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в анналах царей Иудеи». Еврейское выражение, переведённое как «Книга летописей», обозначает царскую запись событий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: Прочие дела Ровоама
  rationale: יֶתֶר означает остаток или прочее, а דִּבְרֵי в формуле царских записей относится к делам и событиям правления, а не только к словам. Начальное וְ не требует отдельного русского союза в таком переходе.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он сделал
  rationale: Прямая и естественная передача широкой по смыслу конструкции с עָשָׂה без добавления оценки.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: описаны ... не так ли?
  rationale: Сохраняется риторический вопрос, предполагающий утвердительный ответ; «описаны» естественно передаёт письменную фиксацию деяний в названном источнике.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: в Летописи
  rationale: עַל при глаголе письменной фиксации идиоматически передаётся как «в», סֵפֶר здесь обозначает письменный источник, а דִּבְרֵי הַיָּמִים — летописную запись событий.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Предлог לְ входит в название архивного источника и выражает его отношение к царям Иудеи.
