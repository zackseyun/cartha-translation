base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: ru
  text: Ты же встань и иди домой. Когда ты войдёшь в город[a], ребёнок умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда твои ноги войдут в город». В еврейском тексте выражение «твои ноги» обозначает момент прибытия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתְּ
  choice: Ты же
  rationale: Самостоятельное местоимение второго лица женского рода вместе с союзом выделяет женщину и обозначает контрастный переход; частица «же» естественно передаёт это по-русски.
- source_word: קוּמִי
  choice: встань
  rationale: Повелительная форма от קום; «встань» сохраняет прямоту и торжественную сдержанность повеления без архаизма.
- source_word: לְכִי
  choice: иди
  rationale: Повелительная форма от הלך; простой глагол движения наиболее естественен в данной последовательности приказаний.
- source_word: לְבֵיתֵךְ
  choice: домой
  rationale: Хотя буквально сказано «к твоему дому», русское «домой» точно и естественно передаёт направленность движения и значение בַּיִת в этом контексте.
- source_word: בְּבֹאָה רַגְלַיִךְ הָעִירָה
  choice: Когда ты войдёшь в город
  rationale: Конструкция с ב и инфинитивом задаёт момент наступления события. Упоминание «твоих ног» является еврейским способом обозначить прибытие; в основном тексте оно передано естественной русской формой, а буквальный образ отмечен в сноске.
- source_word: וּמֵת
  choice: умрёт
  rationale: Перфект с союзом в пророческом высказывании обозначает предстоящее следствие; русское будущее время ясно передаёт предсказание.
- source_word: הַיָּלֶד
  choice: ребёнок
  rationale: יֶלֶד может означать ребёнка или мальчика; здесь пол не акцентирован, поэтому нейтральное «ребёнок» уместнее.
