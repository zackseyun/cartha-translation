base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ru
  text: Остальные деяния Иеровоама[a] — как он воевал и как царствовал — вот, они записаны в Летописи царей Израиля[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «остальные дела (или: сведения) об Иеровоаме». В этой итоговой формуле имеются в виду события и поступки, относящиеся к его царствованию.'
    reason: lexical_alternative
  - marker: b
    text: То есть в официальных царских анналах или исторических записях, а не в библейских книгах Паралипоменон.
    reason: cross_reference
  - marker: c
    text: Еврейское «вот, они записаны» — указательное выражение, обращающее внимание на письменную запись.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Остальные деяния Иеровоама
  rationale: В итоговой формуле о царствовании דִּבְרֵי обозначает не только слова, но в целом дела и события правления; «деяния» естественно передаёт этот смысл в русском историческом повествовании.
- source_word: אֲשֶׁר נִלְחַם
  choice: как он воевал
  rationale: נלחם означает «сражаться, вести войну»; конструкция с אֲשֶׁר здесь уточняет содержание упомянутых деяний.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: и как царствовал
  rationale: מלך в Qal означает «царствовать, быть царём»; параллельная русская конструкция сохраняет структуру еврейского текста.
- source_word: הִנָּם כְּתוּבִים
  choice: записаны
  rationale: הִנָּם — указательно-презентативная частица с местоименным значением, буквально «вот они»; в современном русском её функция достаточно выражена прямым утверждением о наличии записи, а буквальное «вот, они записаны» здесь звучало бы тяжеловесно.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Летописи царей Израиля
  rationale: Сочетание обозначает письменные царские анналы; «Летопись царей Израиля» естественно передаёт название архивного исторического источника.
theological_decisions:
- issue: Идентификация упомянутой летописи
  choice: Пояснить, что речь идёт о царских анналах
  alternative: Понять название как указание на библейские книги Паралипоменон
  rationale: Контекст формулы и еврейское название указывают на отдельный источник по истории царей Израиля, а не на канонические книги Паралипоменон.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Указательная частица הִנָּם не калькируется словом «вот», поскольку в данной формуле это было бы неестественно; тире ясно выделяют два аспекта деяний Иеровоама.
