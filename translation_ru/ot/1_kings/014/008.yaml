source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: ru
  text: Я отторг царство от дома Давида[b] и отдал его тебе. Но ты не был таким, как Мой слуга Давид, который соблюдал Мои заповеди и всем сердцем следовал за Мной[a], делая лишь то, что было праведно в Моих глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходил за Мной».'
    reason: lexical_alternative
  - marker: b
    text: «Дом Давида» — династическое выражение, то есть царская линия Давида.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: Я отторг
  rationale: Глагол קרע буквально обозначает разрывание; «отторг» сохраняет образ насильственного отделения царства и естественно сочетается с «от дома Давида».
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: מַמְלָכָה здесь обозначает политическое царство или область правления; «царство» точно и естественно передаёт смысл.
- source_word: מִבֵּית דָּוִד
  choice: от дома Давида
  rationale: Сохранён еврейский династический оборот «дом Давида»; его значение пояснено в сноске.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: отдал его тебе
  rationale: Форма продолжает повествование о прошлом; местоимение относится к царству. «Отдал» естественно подчёркивает передачу от одной династии другому правителю.
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: Но ты не был таким, как Мой слуга Давид
  rationale: Перфект передаёт итог поведения Иеровоама к моменту обвинения. «Слуга» соответствует почётному служению Давида Богу и не навязывает значение социальной несвободы.
- source_word: שָׁמַר מִצְוֺתַי
  choice: соблюдал Мои заповеди
  rationale: שׁמר с מִצְוֹת обычно означает исполнять или соблюдать заповеди; выбран современный устойчивый русский оборот.
- source_word: הָלַךְ אַחֲרַי
  choice: следовал за Мной
  rationale: Буквально оборот означает «ходил за Мной». Русское «следовал за Мной» естественно передаёт метафору верности и сохраняет направленность действия.
- source_word: בְּכָל לְבָבוֹ
  choice: всем сердцем
  rationale: Устойчивый русский эквивалент еврейского выражения о цельной, неразделённой внутренней преданности.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר
  choice: делая лишь то, что было праведно
  rationale: Оборот с деепричастием естественно связывает поступки Давида с его следованием Богу; «лишь» сохраняет ограничительное רַק.
- source_word: הַיָּשָׁר בְּעֵינָי
  choice: праведно в Моих глазах
  rationale: «В Моих глазах» сохраняет прозрачный еврейский образ Божьей оценки; «праведно» передаёт הַיָּשָׁר в нравственном контексте.
theological_decisions:
- issue: Оценка Давида как образца вопреки упоминаниям его грехов в других местах
  choice: 'Сохранить без оговорок собственную оценку данного стиха: Давид соблюдал заповеди и делал лишь праведное в Божьих глазах.'
  alternative: Добавить уточнение «в целом», «как правило» или согласующее пояснение о грехе Давида.
  rationale: Стих намеренно противопоставляет Давида Иеровоаму. Добавление квалифицирующих слов сняло бы сохраняемое Писанием напряжение и внесло бы отсутствующее в еврейском тексте толкование.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан доступным для обычного читателя; сохранены образы «дом Давида» и «в Моих глазах». Маркеры сносок размещены при соответствующих выражениях: лексическая сноска после «следовал за Мной», культурная — в конце стиха, поскольку её поясняемое выражение находится в первой части.'
