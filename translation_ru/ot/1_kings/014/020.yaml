  text: וְ/הַ/יָּמִים֙ אֲשֶׁ֣ר מָלַ֣ךְ יָרָבְעָ֔ם עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָ֑ה וַ/יִּשְׁכַּב֙ עִם אֲבֹתָ֔י/ו וַ/יִּמְלֹ֛ךְ נָדָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: ru
  text: Иеровоам царствовал двадцать два года. Потом он почил с отцами своими[a], и вместо него воцарился его сын Надав.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «лёг с отцами своими». Это еврейское выражение означает смерть и входит в обычную формулу о смене царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ יָרָבְעָם
  choice: Иеровоам царствовал
  rationale: Естественная русская передача стандартной итоговой формулы о правлении; начальный союз и буквальное «дни, которые» не требуется воспроизводить механически.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: двадцать два года
  rationale: Нормальная современная русская форма числительного.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: он почил с отцами своими
  rationale: Сохраняет традиционный образный эвфемизм смерти и формульный характер выражения, не добавляя прямо не указанного погребения.
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ תַּחְתָּיו
  choice: вместо него воцарился его сын Надав
  rationale: «Воцарился» ясно обозначает вступление на престол, а «вместо него» передаёт значение преемства в תַּחְתָּיו.
theological_decisions:
- issue: Эвфемизм смерти в царской формуле
  choice: 'Сохранить образ: «почил с отцами своими»'
  alternative: «умер»; «уснул с отцами своими»
  rationale: Это устойчивая повествовательная формула, а не развёрнутое учение о посмертном состоянии. «Почил» сохраняет метафору, тогда как «умер» её сглаживает; «уснул» в современном русском звучит менее естественно.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Формула «почил с отцами своими» понятна читателю и сохраняет исходную образность; инверсия «отцами своими» поддерживает достоинство стиля без излишней архаизации.
