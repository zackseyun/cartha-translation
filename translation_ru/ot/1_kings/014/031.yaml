base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: ru
  text: И почил Ровоам со своими предками, и был погребён со своими предками в Городе Давида. Его мать звали Наама; она была аммонитянкой. Вместо него воцарился его сын Авиям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В других местах тот же царь назван Авией; в еврейском тексте этого стиха стоит форма «Авиям».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: почил ... со своими предками
  rationale: Глагол שׁכב в сочетании «с отцами» входит в традиционную формулу сообщения о смерти царя. «Почил» сохраняет образный и торжественный характер выражения, а «предки» естественно передаёт широкий смысл אבות в современном русском.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: был погребён со своими предками
  rationale: Пассивная форма קבר передана прямо; повтор слов «со своими предками» сохранён как часть формульного еврейского повествования.
- source_word: בְּעִיר דָּוִד
  choice: в Городе Давида
  rationale: Устойчивое географическое обозначение передано как название исторической части Иерусалима.
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: Его мать звали Наама
  rationale: Естественная современная русская передача еврейской именной формулы без изменения содержания.
- source_word: הָעַמֹּנִית
  choice: она была аммонитянкой
  rationale: Женская форма этнонима выражена явно и естественно по-русски; отдельное предложение устраняет тяжеловесное приложение.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: вместо него воцарился
  rationale: Передаёт формулу царского преемства и значение תַּחְתָּיו — занятие места предшественника.
- source_word: אֲבִיָּם
  choice: Авиям
  rationale: Сохранена конкретная форма имени в данном стихе, отличная от формы Авия, встречающейся в других местах.
theological_decisions:
- issue: Образное обозначение смерти царя
  choice: почил со своими предками
  alternative: умер
  rationale: Сохранена традиционная метафора исходного текста без внесения дополнительных выводов о состоянии умерших.
translation_notes:
  register: Современный литературный русский с достоинством царской хроники. Синтаксис упрощён там, где буквальное воспроизведение именной формулы звучало бы неестественно, но формульный повтор «со своими предками» сохранён. Все примечания привязаны к соответствующим словам текста.
