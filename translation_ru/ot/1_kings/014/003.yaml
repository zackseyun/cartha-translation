base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: ru
  text: Возьми с собой десять хлебов, лепёшки и кувшин мёда и пойди к нему. Он скажет тебе, что будет с мальчиком.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: десять хлебов
  rationale: Числительное и собирательное обозначение хлебных изделий переданы прямо и естественно по-русски.
- source_word: נִקֻּדִים
  choice: лепёшки
  rationale: Редкое слово обозначает небольшой хлеб или выпечку, вероятно испещрённую либо крошащуюся; «лепёшки» сохраняет различие с предшествующими хлебами без излишней конкретизации.
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: кувшин мёда
  rationale: Сочетание обозначает сосуд с мёдом; «кувшин» естественно передаёт вид ёмкости.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: что будет с мальчиком
  rationale: Идиоматическая русская передача вопроса о дальнейшей участи ребёнка без уточнения исхода.
theological_decisions:
- issue: Степень определённости пророческого сообщения
  choice: Он скажет тебе, что будет с мальчиком
  alternative: Он скажет тебе, что случится с мальчиком
  rationale: Выбрана нейтральная формулировка, которая не добавляет ни благоприятного, ни неблагоприятного исхода и сохраняет напряжение повествования.
translation_notes:
  register: Современный литературный русский язык; повеление передано ясно и достойно. Буквальное «возьми в руку» естественно выражено как «возьми с собой», поскольку речь идёт о дарах, которые следует принести пророку.
