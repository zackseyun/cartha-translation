source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: ru
  text: И жили Иуда и Израиль в безопасности — каждый под своей виноградной лозой и под своей смоковницей[a], от Дана до Вирсавии[b], во все дни Соломона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «под своей виноградной лозой и под своей смоковницей» — традиционный образ мира, безопасности и благополучия на своей земле.
    reason: cultural_note
  - marker: b
    text: «От Дана до Вирсавии» — устойчивое обозначение всей страны с севера до юга.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: жили
  rationale: Глагол יָשַׁב может означать «сидеть», «обитать», «жить»; при собирательном субъекте и לָבֶטַח естественно передаёт устойчивую, безопасную жизнь.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Иуда и Израиль
  rationale: Сохранены названия двух обозначенных в еврейском тексте политико-территориальных общностей без обобщения.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Передаёт состояние защищённости и отсутствия угрозы, согласуясь с последующим образом мирной жизни.
- source_word: אִישׁ
  choice: каждый
  rationale: Существительное мужского рода в единственном числе употреблено дистрибутивно. Русское «каждый» сохраняет распределительное значение и естественно сочетается с местоимением «своей».
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: под своей виноградной лозой и под своей смоковницей
  rationale: Сохранён буквальный традиционный образ мира, благополучия и безопасного владения своей землёй; «своей» естественно передаёт еврейские притяжательные суффиксы.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: от Дана до Вирсавии
  rationale: Сохранён географический меризм, обозначающий всю страну; употреблены устоявшиеся русские библейские формы топонимов.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: во все дни Соломона
  rationale: Формально близко передаёт продолжительность описанного состояния на протяжении правления Соломона.
theological_decisions:
- issue: Передача дистрибутивного мужского אִישׁ
  choice: каждый
  alternative: каждый мужчина; каждый человек
  rationale: В контексте слово имеет распределительную функцию и представляет население в целом. «Каждый» сохраняет эту функцию, не вводя неестественного ограничения только взрослыми мужчинами и не добавляя отсутствующего существительного.
- issue: Передача образа «под своей виноградной лозой и под своей смоковницей»
  choice: сохранить буквальный образ в основном тексте
  alternative: перевести смысловой перифразой «жил в мире и достатке»
  rationale: Образ несёт литературную и межтекстовую нагрузку, выражая мир, безопасность и благополучие; буквальная передача не устраняет его смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к еврейскому, но естественен по-русски; традиционные топонимы «Дан» и «Вирсавия» сохраняют узнаваемость.
