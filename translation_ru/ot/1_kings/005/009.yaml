    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: И дал
  rationale: Прямо передаёт повествовательную форму глагола נתן и естественно продолжает русский библейский рассказ.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, слово согласовано с глаголом в единственном числе и обозначает Бога Израиля.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Основное соответствие в контексте дарованной Соломону практической и царской мудрости.
- source_word: לִשְׁלֹמֹה
  choice: Соломону
  rationale: Принятая русская форма имени поставлена в дательном падеже согласно еврейскому предлогу לְ.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: и весьма великое разумение
  rationale: «Разумение» сохраняет широкий интеллектуальный смысл תְּבוּנָה, а «весьма великое» передаёт усиление הַרְבֵּה מְאֹד без сужения его значения.
- source_word: וְרֹחַב לֵב
  choice: и широту сердца
  rationale: Буквально сохраняет еврейский образ внутренней интеллектуальной вместимости; значение «сердца» пояснено в сноске, чтобы современный читатель не свёл его только к эмоциям.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: как песок на берегу моря
  rationale: Естественно по-русски передаёт сравнение и относительное определение; образ относится к необъятной широте сердца.
theological_decisions:
- issue: Антропологическая идиома וְרֹחַב לֵב
  choice: «широту сердца» в основном тексте
  alternative: «широту ума» или «необъятный ум»
  rationale: В библейском иврите לֵב охватывает ум, понимание и внутреннюю способность человека, а не только чувства. Буквальная метафора сохраняет исходную антропологию и её многозначность; сноска предотвращает эмоционально суженное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм оригинала сохранён; архаизм «весьма» уместен в торжественном контексте и остаётся понятным современному читателю.
