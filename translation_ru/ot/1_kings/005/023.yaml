base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: ru
  text: Мои слуги спустят их с Ливана к морю, а я свяжу из них плоты[a] и доставлю их по морю до места, которое ты мне укажешь. Там я разберу плоты, а ты заберёшь брёвна. Ты же исполнишь моё желание, обеспечивая мой дом хлебом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плоты из брёвен».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «давая хлеб моему дому»; слово «хлеб» здесь, вероятно, означает пищу или продовольствие для царского двора Хирама.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: мои слуги
  rationale: В царском административном контексте речь идёт о людях Хирама, выполняющих его поручение; «слуги» передаёт это без необоснованного указания на рабский статус.
- source_word: יֹרִדוּ
  choice: спустят
  rationale: Каузативная форма глагола ירד обозначает доставку леса вниз, с Ливана к морю.
- source_word: יָמָּה
  choice: к морю
  rationale: Форма указывает направление к морю; такой перевод естественен в контексте последующей морской перевозки.
- source_word: אֲשִׂימֵם דֹּבְרוֹת בַּיָּם
  choice: свяжу из них плоты и доставлю их по морю
  rationale: דֹּבְרוֹת — связанные для сплава брёвна, то есть плоты. Формулировка естественно передаёт подготовку древесины и её перемещение морем, не вводя иного способа перевозки.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: до места, которое ты мне укажешь
  rationale: У глагола שׁלח здесь подразумевается отправка указания о месте назначения; русский перевод передаёт практический смысл эллиптической конструкции.
- source_word: וְנִפַּצְתִּים
  choice: там я разберу плоты
  rationale: נפץ означает разбить, рассеять или разделить; в данном контексте речь о разборке связанных для перевозки плотов.
- source_word: וְאַתָּה תִשָּׂא
  choice: а ты заберёшь брёвна
  rationale: После разборки плотов подразумевается, что Соломон примет и увезёт доставленную древесину. «Брёвна» явно называет подразумеваемый объект, сохраняя ход описания.
- source_word: חֶפְצִי
  choice: моё желание
  rationale: Существительное обозначает желание, волю или угодное человеку; «моё желание» сохраняет личный характер условия Хирама.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: снабжай мой дом продовольствием
  rationale: «Хлеб» здесь метонимически обозначает пищу или припасы для царского дома; «продовольствие» точно соответствует хозяйственному соглашению.
