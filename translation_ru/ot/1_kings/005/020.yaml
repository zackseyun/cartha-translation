  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: ru
  text: А теперь прикажи, чтобы для меня срубили кедры из Ливана. Пусть мои слуги работают вместе с твоими слугами, а плату за труд твоих слуг я дам тебе — какую скажешь. Ведь ты знаешь, что среди нас никто не умеет рубить лес так, как сидоняне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рубить деревья так, как сидоняне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет переход к просьбе и связь с предшествующей речью; естественно звучит по-русски.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: прикажи, чтобы для меня срубили
  rationale: Передаёт повеление с последующим юссивным значением, не уточняя названных исполнителей сверх еврейского текста.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: кедры в Ливане
  rationale: 'Предлог מִן может обозначать происхождение, однако при рубке деревьев естественный русский оборот указывает место: кедры должны быть срублены в Ливане.'
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: Пусть мои слуги работают вместе с твоими слугами
  rationale: Добавленное по смыслу «работают» естественно выражает совместное участие работников; повтор עבד последовательно передан словом «слуги».
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: а плату твоим слугам я дам тебе
  rationale: שְׂכַר означает вознаграждение за труд; формулировка сохраняет буквальную направленность выплаты царю.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: какую скажешь
  rationale: Естественно передаёт согласие Соломона на условия оплаты, которые назовёт адресат.
- source_word: אֵין בָּנוּ אִישׁ
  choice: среди нас никто
  rationale: В данном отрицательном обороте אִישׁ имеет обобщённое значение «никто»; русский вариант не превращает выражение в отдельное утверждение о гендерном составе работников.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: не умеет рубить лес
  rationale: Конструкция с ידע выражает умение, а עֵצִים в контексте лесозаготовки естественно передаётся как «лес»; буквальная альтернатива отмечена в сноске.
- source_word: כַּצִּדֹנִים
  choice: так, как сидоняне
  rationale: Сохраняет прямое сравнение с известным мастерством сидонян.
