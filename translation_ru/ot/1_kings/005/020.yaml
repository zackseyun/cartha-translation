revisions:
- from: А теперь прикажи, чтобы для меня срубили кедры в Ливане. Пусть мои слуги работают вместе с твоими слугами, а плату твоим слугам я дам тебе — какую скажешь. Ведь ты знаешь, что среди нас никто не умеет рубить лес так, как сидоняне.[a]
  to: А теперь прикажи, чтобы для меня срубили кедры из Ливана. Пусть мои слуги работают вместе с твоими слугами, а плату за труд твоих слуг я дам тебе — какую скажешь. Ведь ты знаешь, что среди нас никто не умеет рубить лес так, как сидоняне.[a]
  rationale: 'Исправлено направление, выраженное предлогом מִן («из Ливана»), и устранена возможная двусмысленность в описании платы. Остальные решения сохранены: «никто» естественно передаёт отрицательный обобщённый оборот אֵין בָּנוּ אִישׁ, а сноска корректно отмечает более буквальную альтернативу для לִכְרָת עֵצִים.'
