  - severity: low
    issue: «плату твоим слугам»
    rationale: 'Форма с дательным падежом может быть прочитана как выплата работникам. Конструкция «плату за труд твоих слуг» яснее передаёт שְׂכַר עֲבָדֶיךָ, не меняя того, что платёж адресован царю: «дам тебе».'
