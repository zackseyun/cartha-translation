  naturalness: 'Текст звучит естественно и соответствует современному литературному русскому. «Плату твоим слугам» несколько двусмысленно: может означать выплату непосредственно слугам, тогда как еврейский текст говорит о вознаграждении за их труд, которое Соломон даст адресату.'
  terminology: «Кедры», «слуги» и «сидоняне» удачны. «Срубить кедры» и «рубить лес» приемлемы в контексте заготовки древесины.
