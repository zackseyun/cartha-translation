  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: ru
  text: Ты знаешь, что Давид, мой отец, не мог построить дом для имени Яхве, его Бога, из-за войн, окружавших его, пока Яхве не положил их под его стопы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под его ноги». Буквально: «под подошвы его ног» — образ подчинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Ты знаешь
  rationale: Перфект qal во втором лице в прямом обращении естественно передаёт актуальное знание собеседника. Отдельное местоимение אַתָּה сохранено русским «ты».
- source_word: בַּיִת
  choice: дом
  rationale: Сохранён буквальный библейский образ дома, который предстояло возвести для имени Яхве; перевод «храм» был бы более истолковательным.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: имени Яхве, Бога своего
  rationale: Формула «имени Яхве» сохраняет заветный оборот исходного текста, не сводя его к значению «в честь». Возвратное «своего» однозначно относится к Давиду.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: из-за войн, окружавших его
  rationale: Хотя הַמִּלְחָמָה формально стоит в единственном числе, последующий глагол имеет форму множественного числа и описывает совокупность военных столкновений вокруг Давида; русское множественное число естественно сохраняет этот смысл.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: пока Яхве не положил их
  rationale: Глагол נתן в сочетании с образом «под стопы» означает подчинение или поражение. Местоимение «их» сохраняет формальную отсылку еврейского אֹתָם и не вводит прямо отсутствующее в тексте слово «врагов».
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: под стопы его ног
  rationale: כַּפּוֹת указывает именно на стопы ног. Полный образ сохранён как метафора окончательного подчинения, несмотря на допустимый более краткий русский оборот «под ноги».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте дважды употреблено личное имя Бога, тетраграмматон. Транслитерация «Яхве» сохраняет отличие имени от титула, не добавляя конфессионального толкования.
- issue: Неявный референт местоимения אֹתָם («их»)
  choice: сохранить местоимение «их»
  alternative: «врагов»
  rationale: 'Еврейский текст не называет врагов непосредственно: местоимение формально продолжает описание войн или враждебных сил. Слово «врагов» прояснило бы смысл, но устранило бы подлинную грамматическую напряжённость текста.'
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейской речи. Порядок «Давид, отец мой» и «Бога своего» слегка приподнят, но остаётся понятным. Образ «дом имени Яхве» намеренно не заменён словом «храм».
