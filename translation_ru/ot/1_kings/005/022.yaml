  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: ru
  text: 'И послал Хирам к Соломону сказать: «Я услышал то, что ты передал мне[a]. Я исполню всё твоё желание относительно кедровой древесины и древесины кипариса[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что ты послал ко мне»; речь может идти о послании Соломона или о выраженной в нём просьбе.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское название дерева בְּרוֹשִׁים точно не отождествлено; возможные переводы: «можжевельник» или «пихта».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная форма с waw продвигает повествование; русский союз «и» естественно сохраняет связь с предшествующим контекстом.
- source_word: חִירָם
  choice: Хирам
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Естественная русская формула введения прямой речи после глагола посылания.
- source_word: שָׁמַעְתִּי
  choice: Я услышал
  rationale: Перфект обозначает состоявшееся восприятие послания; простой прошедший вид естественен в русском ответе.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: то, что ты передал мне
  rationale: Сохраняет широкое значение буквально «того, что ты послал ко мне», но по-русски естественно указывает на содержание переданного сообщения, не превращая его прямо в просьбу.
- source_word: אֶעֱשֶׂה
  choice: Я исполню
  rationale: В сочетании с «желанием» русский глагол «исполню» естественно передаёт обещание сделать требуемое, не сужая его до одной лишь поставки.
- source_word: כָּל חֶפְצְךָ
  choice: всё твоё желание
  rationale: Близко передаёт חֵפֶץ как желание или волю; несколько торжественный оборот соответствует достоинству повествования.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: относительно кедровой древесины
  rationale: Предлог ב понимается как указание на предмет договорённости; «древесина» яснее строительного контекста, чем «деревья».
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: и древесины кипариса
  rationale: «Кипарис» — распространённая передача спорного названия дерева בְּרוֹשׁ; неопределённость вида отмечена в сноске.
