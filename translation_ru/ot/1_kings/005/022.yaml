translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прям и понятен; буквальность смягчена лишь там, где дословная русская фраза звучала бы неестественно. Все маркеры сносок помещены непосредственно при соответствующих выражениях.
