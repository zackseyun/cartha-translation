  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: ru
  text: Эти назначенные управители[a] снабжали царя Соломона и всех, кто имел доступ к столу царя Соломона[b], — каждый в свой месяц; ни в чём не было недостатка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наместники», «чиновники». Еврейское слово обозначает назначенных должностных лиц, ведавших округами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всех, кто приближался к столу царя Соломона»; то есть тех, кто был допущен к царскому столу.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: снабжали
  rationale: Пиэль глагола כלכל в данном административно-хозяйственном контексте означает обеспечивать необходимым, прежде всего припасами. «Снабжали» естественно передаёт действие, не сужая его до одного вида продовольствия.
- source_word: הַנִּצָּבִים הָאֵלֶּה
  choice: эти поставленные чиновники
  rationale: הַנִּצָּבִים обозначает назначенных царём должностных лиц, ведавших округами. Сочетание «поставленные чиновники» передаёт как их официальный статус, так и значение назначения, не приписывая им точного современного титула.
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: царя Соломона
  rationale: Естественная русская передача сочетания титула и имени; падеж определяется глаголом «снабжали».
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: и всех, кто имел доступ к столу царя Соломона
  rationale: Буквальный образ «приближался к столу» в контексте означает допуск к царскому столу и содержание при дворе. «Имел доступ» ясно передаёт эту устойчивую придворную реалию, а образ стола сохраняется.
- source_word: אִישׁ חָדְשׁוֹ
  choice: каждый в свой месяц
  rationale: Распределительное выражение указывает на помесячную очередь служащих. Формулировка сохраняет краткость и мужскую форму оригинала.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: они ни в чём не допускали недостатка
  rationale: Фраза означает, что чиновники не оставляли ничего недостающим. Такая передача сохраняет их как действующий субъект и яснее контекста, чем возможное «они ни в чём не нуждались».
