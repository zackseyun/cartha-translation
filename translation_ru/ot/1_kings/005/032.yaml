base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: ru
  text: И строители Соломона, строители Хирама и жители Гевала[a] обтесали и подготовили древесину и камни, чтобы построить дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «геваляне» (традиционно также «гивлитяне»), то есть люди из Гевала, древнего Библа.'
    reason: lexical_alternative
  - marker: b
    text: То есть дом Господа — храм.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: обтесали
  rationale: Глагол פסל обозначает обтёсывание или придание формы строительному материалу. «Обтесали» естественно сочетается и с деревом, и с камнем и точнее передаёт действие, чем общее «обработали».
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: строители Соломона
  rationale: Форма בֹּנֵי здесь представляет причастие множественного числа в сопряжённом состоянии — «строители», а не существительное «сыновья»; перевод передаёт принадлежность работников Соломону.
- source_word: וּבֹנֵי חִירוֹם
  choice: строители Хирама
  rationale: Параллельная конструкция передана так же, как предшествующее выражение, чтобы сохранить симметрию еврейского текста.
- source_word: וְהַגִּבְלִים
  choice: жители Гевала
  rationale: Этноним обозначает людей из Гевала, древнего Библа. Описательный перевод понятнее современному читателю, а традиционные варианты этнонима сохранены в сноске.
- source_word: וַיָּכִינוּ
  choice: приготовили
  rationale: В породе hифиль כון означает «приготовить, сделать готовым»; выбранное слово естественно для строительного контекста.
- source_word: הָעֵצִים
  choice: дерево
  rationale: В данном контексте речь идёт о древесном строительном материале. Собирательное «дерево» звучит естественно и не уточняет форму материала сверх еврейского текста.
- source_word: וְהָאֲבָנִים
  choice: камни
  rationale: Прямой перевод сохраняет общее обозначение материала и не вводит отсутствующее в тексте уточнение «блоки».
- source_word: לִבְנוֹת הַבָּיִת
  choice: чтобы построить дом
  rationale: Инфинитив передаёт цель приготовления материалов. «Дом» сохраняет исходный образ и установленное в контексте обозначение храма.
theological_decisions:
- issue: Значение הַבָּיִת в храмовом контексте
  choice: дом
  alternative: храм / дом Господа
  rationale: Еврейский текст говорит буквально «дом»; из контекста ясно, что имеется в виду храм Господа. Основной текст сохраняет исходное выражение, а сноска поясняет референт, не подменяя его толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и ясен; повтор «строители» сохраняет параллелизм оригинала. Все пояснения, отсутствующие непосредственно в еврейском тексте, вынесены в сноски.
