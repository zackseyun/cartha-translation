    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И ... доставлял
  rationale: Связка וַיְהִי с последующим причастием вводит развитие повествования и длительное либо регулярное действие; по-русски это естественно передаётся союзом «и» и глаголом несовершенного вида.
- source_word: חִירוֹם
  choice: Хирам
  rationale: Имя передано в принятой русской библейской форме.
- source_word: נֹתֵן
  choice: доставлял
  rationale: Причастие в конструкции с וַיְהִי указывает на продолжавшееся или регулярное действие. «Доставлял» естественно для снабжения строительными материалами и не выходит за рамки значения «давать, предоставлять».
- source_word: לִשְׁלֹמֹה
  choice: Соломону
  rationale: Предлог לְ передан русским дательным падежом.
- source_word: עֲצֵי אֲרָזִים
  choice: кедровую древесину
  rationale: В контексте строительных поставок сочетание обозначает лесоматериал, а не растущие деревья.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: и кипарисовую древесину
  rationale: «Кипарис» — распространённый современный эквивалент בְּרוֹשׁ, однако точное определение породы остаётся спорным, что отмечено в сноске.
- source_word: כָּל חֶפְצוֹ
  choice: всё, чего тот желал
  rationale: Передаёт полноту желаемого Соломоном; указательное местоимение «тот» устраняет возможную русскую двусмысленность относительно обладателя желания, ясного из контекста поставок.
