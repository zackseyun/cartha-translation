lexical_decisions:
- source_word: וַיְהִי
  choice: составлял
  rationale: Форма היה с повествовательным וַ передаёт состояние в последовательности рассказа; «составлял» естественно вводит установленное суточное количество без архаичного «и было».
- source_word: לֶחֶם שְׁלֹמֹה
  choice: запас продовольствия для Соломона
  rationale: לֶחֶם буквально означает «хлеб», но здесь, в административном перечне припасов, обозначает продовольственное обеспечение Соломона и его двора. Предлог «для» естественно передаёт отношение, выраженное сочетанием существительных.
- source_word: לְיוֹם אֶחָד
  choice: на один день
  rationale: Сохранено прямое указание на количество, необходимое в течение одного дня.
- source_word: שְׁלֹשִׁים כֹּר
  choice: тридцать коров
  rationale: Древняя единица меры сохранена транслитерацией, без неточного пересчёта в современные единицы.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Слово обозначает тонко смолотую, высококачественную муку; перевод сохраняет отличие от более общего קָמַח.
- source_word: וְשִׁשִּׁים כֹּר
  choice: и шестьдесят коров
  rationale: Единица меры передана последовательно тем же словом.
- source_word: קָמַח
  choice: обычная мука
  rationale: Общее обозначение муки противопоставлено здесь סֹלֶת, муке тонкого помола; «обычная» ясно и кратко передаёт это контекстное различие.
