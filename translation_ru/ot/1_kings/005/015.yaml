base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: ru
  text: И послал Хирам, царь Тира, своих слуг к Соломону, потому что услышал, что его помазали царём вместо его отца, ибо Хирам всегда любил Давида.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Хирам неизменно был расположен к Давиду» или «был другом Давида». Еврейское выражение буквально говорит, что Хирам был любящим Давида «во все дни», то есть сохранял к нему постоянную благосклонность.'
    reason: 'Лексическая альтернатива: אהב обозначает любовь или привязанность; в данном царско-дипломатическом контексте оно может также описывать прочную дружескую расположенность.'
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная повествовательная форма естественно передаётся простым прошедшим временем; союз «и» сохраняет связь с предыдущим повествованием.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Хирам, царь Тира
  rationale: Сохраняются традиционная русская передача имени и конструкция, обозначающая титул и владение.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: В дипломатическом контексте слово может обозначать слуг, подданных или царских служащих; «слуг» сохраняет широту исходного обозначения, не уточняя их должность.
- source_word: כִּי שָׁמַע
  choice: потому что услышал
  rationale: Первое כִּי указывает причину отправки посланных; русская форма прошедшего времени естественно выражает предшествующее известие без тяжеловесного уточнения.
- source_word: מָשְׁחוּ לְמֶלֶךְ
  choice: его помазали царём
  rationale: Сохранён явный образ царского помазания; неопределённо-личная форма отражает невыраженный субъект множественного числа.
- source_word: תַּחַת אָבִיהוּ
  choice: вместо его отца
  rationale: תַּחַת в контексте престолонаследия обозначает занятие места отца, не сводясь лишь к хронологическому «после».
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: ведь Хирам всегда любил Давида
  rationale: Оборот с причастием и היה передаёт устойчивое отношение, а כָּל הַיָּמִים — его продолжительность. «Любил» сохраняет сильную и намеренно широкую лексику оригинала.
theological_decisions:
- issue: Характер отношений Хирама с Давидом
  choice: «всегда любил Давида»
  alternative: «всегда был другом Давида» / «всегда был расположен к Давиду»
  rationale: Еврейский корень אהב буквально выражает любовь, но в царско-дипломатическом контексте может описывать прочную дружбу или благосклонность. Основной текст сохраняет буквальную силу слова, а примечание указывает возможный реляционно-политический оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Синтаксис остаётся близким к еврейской причинной цепочке, но звучит естественно; двусмысленность слова אהב не устраняется.
