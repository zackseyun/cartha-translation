source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: ru
  text: 'И вот, я намерен построить дом[a] для имени Яхве, моего Бога[b], как Яхве сказал Давиду, отцу моему: «Твой сын, которого Я поставлю вместо тебя на твоём престоле[c], — он построит дом для Моего имени».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построить храм»; буквально по-еврейски: «построить дом».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «дом для имени Яхве» — храмовая формула: дом посвящён имени Бога и связан с Его присутствием.'
    reason: cultural_note
  - marker: c
    text: 'Или: «которого Я назначу после тебя»; буквально: «которого Я дам вместо тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: И вот, я намерен
  rationale: Сочетание частицы с местоимением привлекает внимание к заявлению Соломона, а причастие אֹמֵר перед инфинитивом в данном контексте выражает твёрдое намерение, а не просто акт речи.
- source_word: לִבְנוֹת בַּיִת
  choice: построить дом
  rationale: בַּיִת буквально означает «дом». Хотя речь идёт о храме, сохранение слова «дом» передаёт исходный образ и его богословское звучание; значение ясно из контекста.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: для имени Яхве, моего Бога
  rationale: Формула «для имени» сохранена без сведения её смысла лишь к прославлению или почитанию; она указывает на посвящение дома имени Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как ... и сказал
  rationale: Сравнительно-соотносительная конструкция связывает намерение Соломона с прежде данным Божьим обещанием; частица «и» естественно подчёркивает точное соответствие.
- source_word: אֶל דָּוִד אָבִי
  choice: Давиду, отцу моему
  rationale: Сохраняется порядок исходного текста при естественном для литературного русского приложении.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: которого Я поставлю вместо тебя
  rationale: Глагол נָתַן буквально имеет значение «дать», но в контексте царского престолонаследия выражает назначение преемника; «поставлю вместо тебя» сохраняет и назначение, и идею замещения.
- source_word: עַל כִּסְאֶךָ
  choice: на твоём престоле
  rationale: Естественная русская передача устойчивого царского выражения о наследовании власти и царствовании.
- source_word: הוּא
  choice: он
  rationale: Отдельное местоимение в еврейском тексте имеет подчёркивающую функцию; русская конструкция с тире сохраняет акцент на назначенном сыне как строителе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. Форма «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Смысл формулы לְשֵׁם יְהוָה
  choice: для имени Яхве
  alternative: в честь Яхве; во имя Яхве
  rationale: Буквальная храмовая формула сохранена, чтобы не устранять её богословскую многозначность, связанную с посвящением дома Божьему имени и присутствию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; формулы «дом для имени» и эмфатическое «он» сохранены ради смысловой и богословской точности.
