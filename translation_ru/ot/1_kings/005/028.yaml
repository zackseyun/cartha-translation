  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: ru
  text: 'Он отправил их в Ливан — по десять тысяч каждый месяц, посменно[a]: один месяц они находились в Ливане, а два месяца — у себя дома[b]. Адонирам ведал принудительными работами[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сменяющими друг друга группами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в своём доме»; речь идёт о том, что после месяца работ в Ливане каждый работник два месяца проводил дома.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «трудовой повинностью»; еврейское слово обозначает обязательный труд, налагаемый государством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Он посылал их
  rationale: Имперфектный вид естественно передаёт повторяющееся действие в описанной системе ежемесячной ротации, сохраняя простое значение глагола שלח.
- source_word: לְבָנוֹנָה
  choice: в Ливан
  rationale: Направительный суффикс при названии места обозначает движение к Ливану; по-русски естественно «в Ливан».
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: по десять тысяч каждый месяц
  rationale: Предлог ב в данном числовом контексте имеет распределительное значение; «по десять тысяч каждый месяц» ясно выражает ежемесячную численность.
- source_word: חֲלִיפוֹת
  choice: посменно
  rationale: Существительное указывает на чередование или смену групп; «посменно» кратко и естественно передаёт систему ротации.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: один месяц они находились в Ливане
  rationale: Единственное число חֹדֶשׁ употреблено обстоятельственно; добавление «один» делает противопоставление последующим двум месяцам явным без изменения смысла.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: а два месяца — у себя дома
  rationale: Буквально «в его доме»; единственное число с местоименным суффиксом имеет распределительный смысл применительно к каждому работнику. Русское «у себя дома» передаёт это естественно.
- source_word: וַאֲדֹנִירָם עַל הַמַּס
  choice: Над принудительной повинностью был поставлен Адонирам
  rationale: מַס обозначает обязательную государственную трудовую повинность. Формулировка сохраняет принудительный характер и передаёт עַל как руководство или надзор.
