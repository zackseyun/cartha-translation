lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: произнёс
  rationale: Пиэль глагола דבר означает «говорить, произносить». «Произнёс» естественно сочетается с исчисляемыми изречениями и, в отличие от «сочинил», не добавляет отсутствующего в еврейском тексте прямого указания на письменное авторство.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: три тысячи
  rationale: Прямая передача количественного числительного с соблюдением норм современного русского языка.
- source_word: מָשָׁל
  choice: изречений
  rationale: Существительное в единственном числе после числительного употреблено счётно-собирательно. מָשָׁל охватывает пословицу, притчу и мудрое изречение; «изречения» сохраняет широту значения лучше, чем более узкое «притчи» или «пословицы».
- source_word: וַיְהִי
  choice: было
  rationale: В числовой формуле глагол היה указывает на общее количество; русская конструкция «песен его было» передаёт это естественно.
- source_word: שִׁירוֹ
  choice: песен его
  rationale: Форма единственного числа с местоименным суффиксом имеет здесь собирательно-счётное значение, поскольку далее названо количество 1005; по-русски требуется родительный падеж множественного числа.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: тысяча пять
  rationale: 'Еврейское «пять и тысяча» переставлено в обычный для современного русского языка порядок без изменения точного количества: 1005.'
