base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: ru
  text: 'Когда Хирам услышал слова Соломона, он очень обрадовался и сказал: «Благословен Господь ныне, давший Давиду мудрого сына править этим многочисленным народом!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Господь
  rationale: Естественная и торжественная русская формула благословения; тетраграмматон передан традиционным «Господь».
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Сохранено самостоятельное временное наречие исходного текста без ослабления или пропуска.
- source_word: עַל הָעָם
  choice: править … народом
  rationale: Предлог עַל здесь выражает поставление сына над народом; глагольная передача по-русски ясно и естественно обозначает царское правление.
- source_word: הָעָם הָרָב הַזֶּה
  choice: этим многочисленным народом
  rationale: רַב в данном контексте обозначает многочисленность народа; «многочисленный» сохраняет смысл точнее, чем двусмысленное «великий».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана укоренённая в русской библейской речи передача, не добавляющая конфессионально специфического толкования.
- issue: Характер утверждения Хирама
  choice: Сохранено прямое благословение Господа без пояснения убеждений говорящего
  alternative: Добавить пояснение о признании Хирамом Бога Израиля
  rationale: Исходный текст не разъясняет полноту или природу веры Хирама, поэтому богословское напряжение не следует разрешать редакционно.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для чтения вслух; восклицательный знак передаёт сильную радость Хирама, прямо указанную в контексте.
