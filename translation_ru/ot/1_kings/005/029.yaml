  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: ru
  text: У Соломона было семьдесят тысяч носильщиков и восемьдесят тысяч каменотёсов в горах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на горе»; единственное число здесь может обозначать горную местность. Слово, переведённое как «каменотёсы», буквально означает «высекающие» или «рубящие»; в данном контексте, вероятно, имеются в виду работники каменоломен.'
    reason: Сохранить буквальную форму и лексическую неоднозначность еврейского выражения.
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: У Соломона было
  rationale: Конструкция היה + ל выражает наличие или принадлежность; такой перевод естественен по-русски и точно передаёт смысл.
- source_word: שִׁבְעִים אֶלֶף
  choice: семьдесят тысяч
  rationale: Прямой перевод количественного числительного.
- source_word: נֹשֵׂא סַבָּל
  choice: носильщиков
  rationale: Сочетание причастия «несущий» со словом «груз, ноша» обозначает работников, переносивших тяжести; «носильщики» передаёт это кратко и понятно.
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: и восемьдесят тысяч
  rationale: Прямой перевод количественного числительного с союзом.
- source_word: חֹצֵב
  choice: каменотёсов
  rationale: Слово обозначает тех, кто вырубает или высекáет материал; в контексте строительных работ подразумевается камень. «Каменотёсы» — понятное и уместное обозначение таких работников.
- source_word: בָּהָר
  choice: в горах
  rationale: Буквально употреблено единственное число «на горе», которое может иметь собирательное или топографическое значение; «в горах» естественно передаёт место проведения каменоломных работ, не привязывая их к одной определённой горе.
