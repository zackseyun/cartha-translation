translation:
  language: ru
  text: Не считая трёх тысяч трёхсот главных распорядителей Соломона[a], поставленных над работой и руководивших народом[b], выполнявшим работу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главных чиновников» или «главных надзирателей». Еврейские административные термины выражают одновременно высокий должностной ранг и функцию надзора.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может означать осуществлять власть, даже господствовать; здесь речь идёт о руководстве людьми, занятыми на работе.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: кроме
  rationale: Передаёт добавление к ранее названному числу и естественно связывает стих с предшествующим контекстом.
- source_word: שָּׂרֵי הַנִּצָּבִים
  choice: начальников надсмотрщиков
  rationale: Сочетание обозначает руководителей назначенных должностных лиц; перевод сохраняет как высокий ранг, так и надзорную функцию.
- source_word: לִשְׁלֹמֹה
  choice: Соломона
  rationale: Родительный падеж естественно передаёт отношение этих должностных лиц к Соломону.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: поставленных над работами
  rationale: Передаёт вверенную им власть и ответственность за весь комплекс работ, не сводя выражение лишь к непосредственному наблюдению.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: трёх тысяч трёхсот человек
  rationale: Число дано словами в литературном стиле; «человек» добавлено для ясной русской синтаксической связи.
- source_word: הָרֹדִים
  choice: которые руководили
  rationale: Глагол רדה выражает осуществление власти; в контексте организации труда «руководили» звучит естественно, сохраняя властный оттенок.
- source_word: בָּעָם
  choice: народом
  rationale: Сохраняется буквальное «народ», тогда как контекст уточняет, что имеются в виду занятые на работах люди.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: выполнявшим работы
  rationale: Естественно передаёт причастный оборот и характеризует народ как рабочую силу проекта.
