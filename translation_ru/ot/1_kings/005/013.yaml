base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: ru
  text: Он говорил о деревьях — от кедра, растущего в Ливане, до иссопа[a], который растёт из стены; говорил он и о животных, птицах, ползающих существах и рыбах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «небольшого ароматного растения». Точная ботаническая идентификация древнееврейского אֵזוֹב неизвестна; «иссоп» — традиционный перевод.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: говорил о
  rationale: Сочетание דבר с עַל означает речь о предмете; нейтральное «говорил о» не усиливает значение до «научно рассуждал» или «описывал».
- source_word: הָעֵצִים
  choice: деревьях
  rationale: В данном обзоре растительного мира עֵצִים естественно передать как «деревья»; широкий диапазон выражен крайними примерами — от кедра до небольшого иссопа.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: кедра, растущего в Ливане
  rationale: «Кедр» — обычное соответствие אֶרֶז; добавление «растущего» естественно выражает эллиптическое указание на его нахождение в Ливане.
- source_word: מִן ... וְעַד
  choice: от … до
  rationale: Стандартная русская конструкция сохраняет охват всего диапазона — от великого к малому.
- source_word: הָאֵזוֹב
  choice: иссопа
  rationale: «Иссоп» — традиционное и узнаваемое соответствие, хотя точная ботаническая идентификация древнееврейского растения остаётся неясной; это отмечено в сноске.
- source_word: יֹצֵא בַּקִּיר
  choice: растёт из стены
  rationale: Буквально «выходит из стены»; в ботаническом контексте «растёт из стены» ясно и естественно передаёт образ.
- source_word: הַבְּהֵמָה
  choice: животных
  rationale: В перечне категорий живых существ слово имеет широкое значение; «животные» предпочтительнее более узких «скот» или стилистически иных «звери».
- source_word: הָעוֹף
  choice: птицах
  rationale: В этом классификационном перечне естественное русское соответствие — «птицы».
- source_word: הָרֶמֶשׂ
  choice: пресмыкающихся
  rationale: Слово обозначает существ, передвигающихся ползком; «пресмыкающиеся» сохраняет библейскую категорию, хотя она шире современной зоологической категории рептилий.
- source_word: הַדָּגִים
  choice: рыбах
  rationale: Обычное родовое обозначение водных существ в данном перечне.
