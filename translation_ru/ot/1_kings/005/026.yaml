base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: ru
  text: Яхве дал Соломону мудрость, как сказал ему[a]. Между Хирамом и Соломоном был мир, и оба они заключили завет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как обещал ему». В еврейском: «как сказал ему»; в данном контексте речь может идти о ранее данном обещании.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «рассекли завет» — еврейское устойчивое выражение со значением «заключили завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой русской транслитерацией, не заменяя его титулом.
- source_word: נָתַן חָכְמָה
  choice: дал мудрость
  rationale: Прямо и естественно передаёт простое значение глагола נָתַן и существительного חָכְמָה.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: как и говорил ему
  rationale: Сохраняет буквальное значение דִּבֶּר («говорил»), не превращая предшествующее слово Бога в явно сформулированное обещание.
- source_word: וַיְהִי שָׁלוֹם בֵּין ... וּבֵין
  choice: между ... был мир
  rationale: Естественно передаёт мирные отношения между двумя царями, не сужая значение до личной дружбы.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: заключили завет
  rationale: Русское устойчивое выражение сохраняет ключевое значение בְרִית; политически возможное «договор» было бы менее лексически прозрачно.
- source_word: שְׁנֵיהֶם
  choice: они вдвоём
  rationale: Ясно подчёркивает взаимное участие обеих названных сторон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохранено как имя и передано современной русской транслитерацией без подмены титулом.
- issue: Передача בְרִית в международно-политическом контексте
  choice: завет
  alternative: договор
  rationale: Несмотря на политический контекст, исходный текст употребляет обычное слово «завет»; его сохранение поддерживает последовательность ключевой библейской лексики.
- issue: Характер прежнего слова Бога Соломону
  choice: говорил ему
  alternative: обещал ему
  rationale: Контекст допускает понимание речи как обещания, но глагол буквально означает «говорил»; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов сделан естественным для русского; термин «завет» и имя «Яхве» сохранены ради лексической прозрачности. Маркеры примечаний размещены при тех выражениях, к которым относятся.
