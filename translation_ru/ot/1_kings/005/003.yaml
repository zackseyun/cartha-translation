  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: ru
  text: десять голов откормленного крупного скота и двадцать голов скота с пастбищ, сто голов мелкого скота[a], а кроме того — олени, газели, косули[b] и откормленная птица[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское צֹאן обозначает мелкий скот и может включать как овец, так и коз.
    reason: lexical_alternative
  - marker: b
    text: Точное значение еврейского יַחְמוּר неизвестно; возможно, имеется в виду лань или иной вид оленевых.
    reason: lexical_alternative
  - marker: c
    text: 'Точный вид птицы, обозначенный словом בַרְבֻּרִים, неизвестен; возможно: «откормленные гуси».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: откормленный крупный скот
  rationale: בָקָר — собирательное обозначение крупного рогатого скота, а בְּרִאִים описывает упитанных, специально откормленных животных. Формулировка естественна для современного русского языка и передаёт отличие от скота с пастбищ.
- source_word: בָּקָר רְעִי
  choice: скот с пастбищ
  rationale: רְעִי связано с выпасом; выражение указывает на животных, содержавшихся на подножном корме, в отличие от специально откормленных.
- source_word: צֹאן
  choice: мелкий скот
  rationale: צֹאן может охватывать овец и коз как единый разряд мелкого домашнего скота. Это сохраняет объём значения без неоправданного сужения до одних овец.
- source_word: לְבַד
  choice: а кроме того
  rationale: Оборот вводит дополнительные виды пищи сверх уже перечисленного скота.
- source_word: אַיָּל
  choice: олени
  rationale: אַיָּל обозначает оленя, нередко самца; в перечне дичи уместно современное общее название во множественном числе.
- source_word: צְבִי
  choice: газели
  rationale: Обычное значение צְבִי — газель; множественное число естественно в русском перечне животных.
- source_word: יַחְמוּר
  choice: косули
  rationale: Точное зоологическое отождествление спорно. «Косули» — традиционно возможная передача; неопределённость сохранена в примечании.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: откормленная птица
  rationale: Название בַרְבֻּרִים не позволяет уверенно определить вид птицы, тогда как אֲבוּסִים указывает на откорм. Обобщённая передача избегает ложной точности.
