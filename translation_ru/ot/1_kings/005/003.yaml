  terminology: Термины «крупный скот», «мелкий скот», «олени», «газели» и «откормленная птица» последовательны и не вносят ложной богословской или зоологической определённости. Сноски корректно привязаны к «мелкому скоту», «косулям» и «откормленной птице». Русский вариант также удачно исправляет менее точное английское сужение צֹאן до одних овец.
