base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/006.yaml
  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: ru
  text: У Соломона было сорок тысяч стойл для коней его колесниц[a] и двенадцать тысяч всадников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конюшен для коней его колесниц»; еврейское слово точнее обозначает стойла или места кормления коней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: У Соломона было
  rationale: Еврейская конструкция ויהי ל выражает обладание или принадлежность; русская конструкция «у ... было» естественно и точно передаёт этот смысл.
- source_word: אַרְבָּעִים אֶלֶף
  choice: сорок тысяч
  rationale: Прямая передача количественного числительного.
- source_word: אֻרְוֺת
  choice: стойл
  rationale: Слово обозначает отдельные места для содержания или кормления коней; «стойла» точнее, чем более широкое «конюшни».
- source_word: סוּסִים
  choice: коней
  rationale: Обычное русское обозначение лошадей в военном и колесничном контексте.
- source_word: לְמֶרְכָּבוֹ
  choice: при его колесницах
  rationale: Единственное число с притяжательным суффиксом имеет собирательный смысл и относится к колесничному составу Соломона; «при его колесницах» естественно связывает стойла с колесничными конями, не создавая впечатления, будто стойла предназначались для самих колесниц.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: и двенадцать тысяч
  rationale: Прямая передача числового сочетания и соединительного союза.
- source_word: פָּרָשִׁים
  choice: всадников
  rationale: Наиболее прямое значение — люди, ездящие верхом; вариант «колесничие» менее вероятен лексически.
