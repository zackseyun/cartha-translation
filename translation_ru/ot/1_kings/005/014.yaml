  text: וַ/יָּבֹ֨אוּ֙ מִ/כָּל הָ֣/עַמִּ֔ים לִ/שְׁמֹ֕עַ אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה מֵ/אֵת֙ כָּל מַלְכֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר שָׁמְע֖וּ אֶת חָכְמָתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: ru
  text: И приходили люди из всех народов[a], чтобы послушать мудрость Соломона, — от всех царей земли, которые слышали о его мудрости.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из всех племён». Еврейское עַמִּים стоит во множественном числе и может обозначать народы или этнические общности.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально означает «от всех царей земли». Вероятно, эти люди приходили от царей или по поручению царей, слышавших о мудрости Соломона.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: приходили
  rationale: Форма wayyiqtol продолжает повествование; русский несовершенный вид естественно передаёт повторяющиеся приезды людей, обусловленные широкой славой Соломона.
- source_word: מִכָּל הָעַמִּים
  choice: из всех народов
  rationale: Множественное עַמִּים обозначает различные народы; «из всех народов» естественно и сохраняет множественность исходного выражения.
- source_word: לִשְׁמֹעַ
  choice: чтобы послушать
  rationale: Инфинитив выражает цель прихода; «послушать» в данном контексте естественнее буквального «услышать» и подразумевает личное восприятие мудрых речей Соломона.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: мудрость Соломона
  rationale: Прямо передаёт еврейскую сопряжённую конструкцию, не уточняя, имеются ли в виду речи, суждения или общий дар мудрости.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: от всех царей земли
  rationale: 'Сохранена сжатая и несколько неоднозначная конструкция источника: посетители могли приходить от царей или по их поручению; добавление «посланные» было бы истолкованием.'
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: которые слышали о его мудрости
  rationale: Русская конструкция «слышали о» естественно выражает получение известий о мудрости; относительное местоимение грамматически относится к царям.
