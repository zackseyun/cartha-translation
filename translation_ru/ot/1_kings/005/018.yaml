source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: ru
  text: 'Но теперь Яхве, мой Бог, даровал мне покой со всех сторон: нет ни противника[a], ни бедствия[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недруга». Еврейское שָׂטָן здесь — нарицательное слово, не обязательно личное имя Сатаны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «несчастья», «беды» или «пагубного происшествия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Передаёт переход и контраст между прежними обстоятельствами и нынешним мирным положением.
- source_word: הֵנִיחַ
  choice: даровал мне покой
  rationale: 'Форма хифиль от נוח имеет каузативное значение: Яхве дал Соломону возможность жить спокойно.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Прямо передаёт конструкцию с притяжательным суффиксом первого лица.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Естественно по-русски выражает отсутствие угроз со стороны окружающих народов.
- source_word: אֵין שָׂטָן
  choice: нет ни противника
  rationale: שָׂטָן здесь является нарицательным существительным со значением политического или военного противника, а не личным именем Сатаны.
- source_word: וְאֵין פֶּגַע רָע
  choice: ни бедствия
  rationale: Сочетание обозначает пагубное происшествие, несчастье или беду; «бедствие» естественно передаёт общий характер угрозы, не сужая её до конкретного вида несчастья.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет это различие.
- issue: Следует ли понимать שָׂטָן как личное имя Сатаны
  choice: нарицательное «противник»
  alternative: Сатана
  rationale: Контекст говорит о политическом мире и отсутствии враждебного противодействия; грамматика не требует видеть здесь имя сверхъестественного существа.
- issue: Объём значения פֶּגַע רָע
  choice: бедствие
  alternative: несчастье; беда; пагубное происшествие
  rationale: Выбран широкий русский эквивалент, сохраняющий представление о вредоносном событии без уточнения его причины или характера.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Даровал» уместно передаёт действие Бога и остаётся понятным; синтаксис краток и естественен.
