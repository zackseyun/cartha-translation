base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: ru
  text: Соломон властвовал над всеми царствами от Реки[a] до земли филистимлян и до границы Египта. Они приносили ему дань[b] и служили Соломону все дни его жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть река Евфрат.
    reason: cross_reference
  - marker: b
    text: 'Или: «дары». Еврейское слово «минха» может означать дар, приношение или дань; здесь политический контекст указывает на дань.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: властвовал
  rationale: Причастие в сочетании с הָיָה описывает продолжительное владычество в прошлом; несовершенный вид естественно передаёт эту длительность.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: над всеми царствами
  rationale: Предлог при משל обозначает власть над кем-либо; множественное число указывает на ряд подвластных царств.
- source_word: מִן הַנָּהָר
  choice: от Реки
  rationale: Сохранено традиционное географическое обозначение с определённостью оригинала; подразумеваемый Евфрат назван в сноске.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: земли филистимлян
  rationale: Прямо и понятно передаёт конструкцию «земля филистимлян», не заменяя её позднейшим географическим названием.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: и до границы Египта
  rationale: Передаёт предел описываемой территории без уточнений, отсутствующих в еврейском тексте.
- source_word: מַגִּשִׁים מִנְחָה
  choice: приносили ему дань
  rationale: В политическом контексте מִנְחָה означает дань или подношение вассала; местоимение «ему» естественно выражает адресата, указанного контекстом.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: служили Соломону
  rationale: Сохраняет широкий смысл подчинённого служения и не конкретизирует его как принудительный труд.
- source_word: כָּל יְמֵי חַיָּיו
  choice: во все дни его жизни
  rationale: Сохранён выразительный древнееврейский оборот, понятный и уместный в литературном русском языке.
