  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: ru
  text: Ибо он владычествовал над всей областью по ту сторону Реки[a], от Типсаха до Газы, и над всеми царями по ту сторону Реки; и со всех сторон у него был мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть реки Евфрат.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: владычествовал
  rationale: Причастие обозначает продолжающееся господство; несовершенный вид передаёт длительность, а глагол естественно выражает верховную власть Соломона над территорией и царями.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: над всей областью по ту сторону Реки
  rationale: Выражение עֵבֶר הַנָּהָר имеет территориальное значение. Слово «область» делает это значение явным, не подменяя исходное географическое обозначение.
- source_word: הַנָּהָר
  choice: Река
  rationale: В еврейском тексте стоит определённое нарицательное «Река», традиционно обозначающее Евфрат; исходная форма сохранена в основном тексте, а референт пояснён в сноске.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: от Типсаха до Газы
  rationale: Прямая передача географического диапазона; תִּפְסַח передано принятой русской транслитерацией «Типсах».
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: над всеми царями по ту сторону Реки
  rationale: Предлог и контекст выражают верховенство над царями указанной территории; формулировка сохраняет политический смысл без дополнительных толкований.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: и … у него был мир
  rationale: שָׁלוֹם здесь означает мир и безопасность в политическом окружении; русская конструкция естественна и близка к форме оригинала.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: со всех сторон
  rationale: Идиоматическая русская передача мира со всех окружающих направлений; она не сужает значение до соседей или конкретных пограничных областей.
