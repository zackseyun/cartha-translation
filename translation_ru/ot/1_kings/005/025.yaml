base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: ru
  text: Соломон давал Хираму двадцать тысяч коров пшеницы в качестве продовольствия для его дома[a] и двадцать коров оливкового масла, полученного толчением[b]. Так Соломон давал Хираму из года в год.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как продовольствие для его дома». Вероятно, речь идёт о пище для царского двора Хирама.'
    reason: lexical_alternative
  - marker: b
    text: То есть высококачественного масла, которое получали, толча или дробя оливки, а не выжимая их при последующем прессовании.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: давал / давал
  rationale: Перфект сообщает об установленной поставке, а имперфект с כֹּה и выражением «из года в год» описывает регулярно повторявшееся действие. В русском естественно передать оба глагола прошедшим временем несовершенного вида.
- source_word: כֹּר
  choice: кор
  rationale: «Кор» — конкретная древняя мера объёма; транслитерация сохраняет точность исходного текста, не подменяя её расплывчатым словом «мер».
- source_word: חִטִּים
  choice: пшеница
  rationale: Существительное обозначает именно пшеницу, а не зерно вообще.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: в пищу его дому
  rationale: מַכֹּלֶת означает пищу или продовольствие, а «дом» может охватывать домашних Хирама и его царский двор. Формулировка сохраняет образ исходного текста; вероятный смысл разъяснён в сноске.
- source_word: שֶׁמֶן כָּתִית
  choice: масло из толчёных оливок
  rationale: כָּתִית указывает на масло, полученное из оливок посредством толчения или дробления. Развёрнутый русский вариант понятнее буквального «битое масло»; оливковое происхождение подразумевается контекстом древнеизраильского словоупотребления.
- source_word: כֹּה
  choice: столько
  rationale: В данном контексте כֹּה отсылает к только что названным объёмам ежегодных поставок. «Столько» естественно выражает количественный оттенок, не исключая общего значения «так».
- source_word: שָׁנָה בְשָׁנָה
  choice: из года в год
  rationale: Устойчивое современное русское выражение точно передаёт регулярное ежегодное повторение.
