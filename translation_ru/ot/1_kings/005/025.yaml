    rationale: Русское «в пищу» требует иной конструкции; исходное מַכֹּלֶת לְבֵיתוֹ означает продовольствие для его дома (то есть, вероятно, царского хозяйства/двора).
  - severity: low
    issue: «Столько» чрезмерно ограничивает значение כֹּה.
    rationale: В контексте כֹּה связывает изложенные поставки с их регулярным осуществлением; «так» передаёт это без сведения слова только к количеству.
