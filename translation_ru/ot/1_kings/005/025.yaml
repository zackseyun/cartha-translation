revisions:
- from: Соломон давал Хираму двадцать тысяч коров пшеницы в пищу его дому[a] и двадцать коров масла из толчёных оливок[b]. Столько Соломон давал Хираму из года в год.
  to: Соломон давал Хираму двадцать тысяч коров пшеницы в качестве продовольствия для его дома[a] и двадцать коров оливкового масла, полученного толчением[b]. Так Соломон давал Хираму из года в год.
  rationale: Исправлена неестественная русская конструкция при сохранении значения «продовольствие для его дома». «Так» точнее отражает כֹּה как указание на описанный порядок ежегодных поставок. Формулировка о масле оставляет в основном тексте понятный смысл и поддерживается культурной сноской.
