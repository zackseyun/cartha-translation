- source_word: וַיִּשְׁלַח
  choice: Тогда … послал
  rationale: Форма wayyiqtol от שׁלח обозначает следующее действие повествования; «тогда» естественно передаёт последовательность событий.
- source_word: שְׁלֹמֹה
