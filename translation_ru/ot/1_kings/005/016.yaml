  rationale: Имя передано в общепринятой русской библейской форме.
- source_word: אֶל חִירָם
  choice: Хираму
  rationale: Предлог אֶל указывает на адресата; русский дательный падеж естественно выражает это отношение. Имя חִירָם передано как «Хирам» в соответствии с данной еврейской формой.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит последующую прямую речь. Конструкция «послал сказать» естественна для современного русского языка и сохраняет связь с последующим сообщением.
