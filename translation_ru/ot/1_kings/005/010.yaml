  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: ru
  text: И мудрость Соломона превосходила мудрость всех жителей Востока[a] и всю мудрость Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Востока» — идиоматическое обозначение жителей восточных земель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: превосходила
  rationale: Глагол רבה с последующим сравнительным מִן здесь выражает превосходство в степени, а не просто увеличение; «превосходила» естественно передаёт эту сравнительную конструкцию.
- source_word: חָכְמַת
  choice: мудрость
  rationale: Повторяющееся חָכְמָה обозначает мудрость в широком смысле — познания, разумение и интеллектуальное превосходство; «мудрость» является точным и устойчивым соответствием.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная русская форма личного имени.
- source_word: כָּל
  choice: всех / всю
  rationale: Формы согласованы с русскими существительными и сохраняют всеохватное значение обоих употреблений כָּל.
- source_word: בְּנֵי קֶדֶם
  choice: жители Востока
  rationale: Буквально «сыны Востока»; это идиоматическое этногеографическое обозначение людей, живущих к востоку. «Жители Востока» ясно и естественно передаёт смысл, а буквальный образ сохранён в сноске.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: и всю мудрость Египта
  rationale: Вторая сравнительная группа зависит от того же глагола. Русская конструкция не требует повторения «превосходила» и сохраняет значение исходного текста.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: Традиционная русская форма географического названия; в тексте употреблён требуемый родительный падеж «Египта».
