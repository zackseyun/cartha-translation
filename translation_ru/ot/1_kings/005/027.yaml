  text: Царь Соломон набрал со всего Израиля мужчин для принудительных работ[a]; их было тридцать тысяч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провёл среди всего Израиля набор на принудительные работы». Еврейское מַס здесь означает обязательную трудовую службу, а не прежде всего денежный налог.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... מַס
  choice: набрал ... людей для принудительных работ
  rationale: Сочетание каузативной формы עלה с מַס означает введение трудовой повинности и набор людей для неё. Такая передача естественна по-русски и ясно выражает административное принуждение.
- source_word: מַס
  choice: людей для принудительных работ
  rationale: В данном контексте מַס обозначает обязательную трудовую службу, а не денежный налог. Формулировка избегает малопонятного термина «барщина» и не создаёт впечатления денежной подати.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: со всего Израиля
  rationale: Предлог указывает на население, из которого набирали работников; «со всего Израиля» естественно передаёт всеохватность набора.
- source_word: וַיְהִי הַמַּס
  choice: их было
  rationale: Вторая часть стиха сообщает численность набранных людей. Местоименная конструкция по-русски естественна и не требует тяжёлого повтора.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: тридцать тысяч человек
  rationale: אִישׁ служит здесь счётным обозначением участников трудовой повинности. «Человек» — обычная русская форма после числительного и в контексте не устраняет подразумеваемую группу взрослых мужчин.
