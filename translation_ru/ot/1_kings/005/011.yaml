base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: ru
  text: Он был мудрее всякого человека[a], в том числе Этана-эзрахита[b], Хемана, Калкола и Дарды, сыновей Махола, — и имя его было известно среди всех окрестных народов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех людей» либо «всего человечества». Древнееврейское адам может обозначать как отдельного человека, так и человечество в целом.'
    reason: lexical_alternative
  - marker: b
    text: «Эзрахит», вероятно, родовое или этническое обозначение; возможно также понимание «зерахит».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и имя его было среди всех окрестных народов»; речь идёт о его широкой известности.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: Он был мудрее
  rationale: Форма глагола חכם с последующим сравнительным מִן выражает превосходство в мудрости; по-русски это естественно передаётся сравнительной конструкцией «был мудрее».
- source_word: מִכָּל הָאָדָם
  choice: всякого человека
  rationale: אָדָם допускает как индивидуальное, так и собирательное значение. Контекст сравнения с названными по имени мудрецами поддерживает «всякого человека», при этом более широкая возможность отмечена в сноске.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: мудрее Ефана эзрахита
  rationale: הָאֶזְרָחִי, вероятнее всего, является родовым или этническим обозначением. Транслитерация «эзрахит» сохраняет неопределённость происхождения термина.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: Емана, Халкола и Дарды
  rationale: Личные имена переданы транслитерацией, близкой к древнееврейской форме и принятой русской библейской традиции.
- source_word: בְּנֵי מָחוֹל
  choice: сыновей Махола
  rationale: Наиболее прямое понимание сочетания — патронимическое или родовое обозначение. Возможный смысл, связанный с «пляской», здесь не навязывается.
- source_word: וַיְהִי שְׁמוֹ
  choice: имя его было известно
  rationale: 'Буквально: «имя его было». Русское добавление «известно» ясно передаёт подразумеваемую славу, не заменяя образ имени отвлечённым словом «слава».'
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: среди всех окрестных народов
  rationale: גּוֹיִם обозначает окружающие народы, без позднейшего богословского оттенка слова «язычники»; предлог ב естественно передан как «среди».
theological_decisions:
- issue: Объём значения אָדָם в сравнительном утверждении
  choice: всякого человека
  alternative: всех людей / всего человечества
  rationale: Единственное число и последующее перечисление мужчин-мудрецов позволяют сохранить индивидуализированное «всякого человека», не исключая собирательного понимания, указанного в сноске.
- issue: Передача идиомы «его имя было»
  choice: имя его было известно
  alternative: слава о нём распространилась
  rationale: Выбранный вариант сохраняет древнееврейский образ «имени» и одновременно делает подразумеваемый смысл понятным современному русскому читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет сравнительное перечисление оригинала; архаизмы сведены к минимуму, а имена переданы в узнаваемой русской библейской форме.
