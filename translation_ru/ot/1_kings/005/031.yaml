  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: ru
  text: Царь приказал, и они добыли большие, дорогие камни — тёсаные камни[a], — чтобы заложить основание дома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обработанные камни»; еврейское выражение обозначает камни, обтёсанные для кладки.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть храма; буквально: «дома».'
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Царь приказал
  rationale: Последовательная глагольная форма продолжает повествование. Русский порядок слов и глагол «приказал» естественно передают краткую еврейскую конструкцию без добавления неуказанного содержания приказа.
- source_word: וַיַּסִּעוּ
  choice: они добыли
  rationale: Каузативная форма от נסע буквально связана с приведением в движение или извлечением; в контексте подготовки строительного камня речь, вероятнее всего, о его добыче. «Добыли» передаёт этот смысл естественнее, чем узкое «высекли», поскольку последующая фраза отдельно указывает на обработку камня.
- source_word: אֲבָנִים גְּדֹלוֹת אֲבָנִים יְקָרוֹת
  choice: большие, дорогие камни
  rationale: «Большие» прямо передаёт размер, а «дорогие» — высокую стоимость или ценность строительного материала, не создавая впечатления, будто речь идёт о драгоценных камнях.
- source_word: לְיַסֵּד
  choice: чтобы заложить основание
  rationale: В строительном контексте יסד означает закладывать основание; целевая конструкция с «чтобы» естественно передаёт еврейский инфинитив с לְ.
- source_word: הַבַּיִת
  choice: дома
  rationale: Сохранено буквальное еврейское обозначение «дом»; из контекста ясно, что имеется в виду храм, что поясняется в сноске.
- source_word: אַבְנֵי גָזִית
  choice: тёсаные камни
  rationale: 'גזית обозначает камень, обтёсанный и подготовленный для кладки. Тире передаёт приложительное уточнение: это характеристика уже названных больших и дорогих камней, а не отдельный материал или орудие.'
