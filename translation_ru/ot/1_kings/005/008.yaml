  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: ru
  text: Ячмень и солому для коней и скакунов[a] доставляли туда, где находился каждый человек, — согласно установленному для него порядку.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать особых верховых или упряжных животных; возможно, мулов либо колесничных коней.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «согласно его установлению (порядку)». Или: «согласно возложенной на него обязанности»; возможны также значения «согласно его назначению» и «согласно положенной ему доле». «Каждый человек» употреблено распределительно и, вероятно, относится к каждому из ответственных за снабжение.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: ячмень
  rationale: Существительное обозначает ячмень, здесь употреблявшийся как корм; в русском языке собирательная форма без множественного числа естественна.
- source_word: וְהַתֶּבֶן
  choice: солому
  rationale: תֶּבֶן обычно означает солому или сухие стебли и в данном контексте назван как корм наряду с ячменём.
- source_word: לַסּוּסִים
  choice: для коней
  rationale: Прямой перевод сочетания предлога с существительным; «кони» соответствует достойному повествовательному регистру.
- source_word: וְלָרָכֶשׁ
  choice: и скакунов
  rationale: רֶכֶשׁ обозначает особых верховых или упряжных животных, вероятно породистых коней; «скакуны» сохраняет отличие от общего סוּסִים, не сужая значение до мулов или колесничных коней.
- source_word: יָבִיאוּ
  choice: они доставляли
  rationale: Активная форма множественного числа сохранена; несовершенный вид по-русски естественно передаёт повторявшееся снабжение.
- source_word: אֶל־הַמָּקוֹם
  choice: в то место
  rationale: Естественная передача направления к определённому месту.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: где находился каждый из них
  rationale: 'אִישׁ имеет распределительное значение: речь идёт о каждом из ответственных людей. Дополнение «из них» делает русскую фразу связной, не называя не указанное в стихе должностное лицо.'
- source_word: כְּמִשְׁפָּטוֹ
  choice: согласно установленному для него порядку
  rationale: מִשְׁפָּט здесь означает предписание, установленную норму или служебное назначение, а не судебное решение.
