  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: ru
  text: Когда небо закроется и дождя не будет, ибо они согрешат против Тебя, и они помолятся, обратившись лицом к этому месту, прославят Твоё имя[a] и отвернутся от своего греха, потому что Ты смиряешь их[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздадут Тебе благодарение» или «исповедуют Твоё имя». Еврейский глагол может обозначать благодарную хвалу либо открытое признание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что Ты подвергаешь их страданию». То же еврейское написание можно также прочитать как «потому что Ты отвечаешь им», однако контекст засухи как вразумления поддерживает значение «смиряешь».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Когда небо будет закрыто
  rationale: 'Предлог ב с инфинитивом нифаля задаёт временное условие: «когда… будет закрыто/удержано». В современном русском единственное число «небо» естественнее морфологического воспроизведения еврейской формы שָׁמַיִם.'
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: и не будет дождя
  rationale: Прямо и естественно передаёт отсутствие дождя как следствие «закрытого» неба.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: из-за того, что они согрешат против Тебя
  rationale: כִּי имеет причинное значение, а לָךְ при глаголе греха означает направленность проступка против Бога. Будущее время согласовано с гипотетическим условием молитвы.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: и тогда они помолятся, обратившись к этому месту
  rationale: אֶל обозначает направление молитвы к храму, а не обращение к самому месту как адресату. Деепричастная конструкция ясно выражает пространственную ориентацию.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: воздадут хвалу Твоему имени
  rationale: Глагол ידה в этой породе охватывает благодарение, хвалу и открытое признание. «Воздадут хвалу» естественно звучит по-русски и сохраняет широкий богослужебный смысл; другие возможные оттенки отмечены в сноске.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: и отвернутся от своего греха
  rationale: שׁוב с מִן буквально выражает поворот прочь от греха. Такой перевод прозрачен и не заменяет образ более толковательным словом «покаются».
- source_word: כִּי תַעֲנֵם
  choice: потому что Ты смиряешь их
  rationale: В контексте засухи как наказания и последующего отвращения от греха древнее понимание «смирять/угнетать» хорошо связывает части высказывания. Вместе с тем масоретская огласовка допускает понимание от глагола «отвечать», поэтому оно сохранено в сноске.
theological_decisions:
- issue: Направление молитвы к храму
  choice: помолятся, обратившись к этому месту
  alternative: помолятся этому месту
  rationale: Храм задаёт направление молитвы как место Божьего имени, но не становится её адресатом. Формулировка не привносит поклонения месту.
- issue: Значение תַעֲנֵם
  choice: Ты смиряешь их
  alternative: Ты отвечаешь им
  rationale: Контекст связывает засуху, грех и отвращение от греха вследствие Божьего воздействия; древние переводы и контекст поддерживают значение «смирять». Однако форма в масоретском тексте действительно может читаться как «отвечаешь», поэтому неоднозначность не устранена, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенным регистром. Заглавные местоимения обращения к Богу сохранены. Конечное тире показывает, что синтаксическое предложение продолжается в следующем стихе.
