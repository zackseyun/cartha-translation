    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временной указатель вводит слова Соломона и естественно передаёт последовательность повествования.
- source_word: אָמַר
  choice: сказал
  rationale: Обычный русский эквивалент глагола אמר при введении прямой и передаваемой речи.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная и общепонятная русская форма личного имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לִשְׁכֹּן
  choice: будет обитать
  rationale: Инфинитив с ל после אָמַר выражает содержание сказанного; русская придаточная конструкция звучит естественно и не уточняет сверх текста, относится ли высказывание к намерению или будущему действию.
- source_word: בָּעֲרָפֶל
  choice: во мраке
  rationale: עֲרָפֶל обозначает густую тьму, мглу или тёмное облако, особенно в описаниях явленного Божьего присутствия; «во мраке» сохраняет образ сокрытого присутствия и допускает отмеченную в сноске альтернативу.
theological_decisions:
- issue: Пребывание Яхве в עֲרָפֶל
  choice: Яхве сказал, что будет обитать во мраке
  alternative: Яхве сказал, что будет обитать в тёмном облаке
  rationale: Основной вариант сохраняет парадокс Божьего присутствия во тьме и не сводит образ только к атмосферному явлению; возможный смысл «тёмное облако» указан в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной библейской формулировкой. «Обитать» выбрано вместо разговорного «жить», чтобы передать мотив Божьего пребывания, не создавая излишней архаичности.
