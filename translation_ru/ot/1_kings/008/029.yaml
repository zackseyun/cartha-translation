base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: ru
  text: 'чтобы Твои глаза были открыты и ночью, и днём и обращены к этому дому — к месту, о котором Ты сказал: «Моё имя будет там»[a], — чтобы слышать молитву, которую Твой раб будет возносить, обращаясь к этому месту.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Моё имя будет там» — храмовая формула, указывающая на особую связь Бога с избранным Им местом и подразумевающая Его заветное присутствие, но не сводимая только к этому пояснению.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: чтобы ... были
  rationale: Инфинитив с ל продолжает просьбу предыдущего контекста и выражает желаемый результат; придаточное с «чтобы» естественно передаёт эту связь по-русски.
- source_word: עֵינֶךָ פְתֻחוֹת
  choice: Твои глаза были открыты
  rationale: Сохранён исходный антропоморфный образ открытых глаз как знак внимательного отношения Бога, без замены его отвлечённым толкованием.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: обращены к этому дому
  rationale: Предлог אֶל обозначает направленность. Добавленное по требованиям русского синтаксиса «обращены» делает образ естественным, сохраняя направление Божьего взора к храму; «дом» удерживает храмовую лексику оригинала.
- source_word: לַיְלָה וָיוֹם
  choice: и ночью, и днём
  rationale: Передаёт устойчивую пару со значением непрестанного внимания, сохраняя конкретный образ оригинала.
- source_word: אֶל הַמָּקוֹם
  choice: к месту
  rationale: Сохраняет повторяющийся в стихе мотив определённого Богом места и направительное значение אֶל.
- source_word: אֲשֶׁר אָמַרְתָּ יִהְיֶה שְׁמִי שָׁם
  choice: 'о котором Ты сказал: «Моё имя будет там»'
  rationale: Формулировка прямо передаёт утверждение оригинала и не заменяет «имя» истолкованием вроде «присутствие» или «обитание».
- source_word: שְׁמִי
  choice: Моё имя
  rationale: Сохранена значимая храмовая формула оригинала и присущая ей богословская ёмкость.
- source_word: לִשְׁמֹעַ
  choice: чтобы слышать
  rationale: Инфинитив цели передан придаточным цели; глагол «слышать» сохраняет как буквальный смысл, так и контекстуальный оттенок благосклонного внимания к молитве.
- source_word: אֶל הַתְּפִלָּה
  choice: молитву
  rationale: «Молитва» — прямое и широкое соответствие תְּפִלָּה, подходящее к данному контексту прошения.
- source_word: יִתְפַּלֵּל
  choice: будет возносить
  rationale: Будущее время естественно передаёт несовершенный вид в контексте предстоящих или повторяющихся молитв; «возносить молитву» позволяет избежать неестественного русского повтора «молиться молитвой».
- source_word: עַבְדְּךָ
  choice: Твой раб
  rationale: «Раб» сохраняет принятую в молитвенной речи форму смиренного самообозначения перед Богом и соответствует возвышенному, но понятному регистру.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: обращаясь к этому месту
  rationale: Оборот естественно передаёт направленность молитвы к храму, выраженную повторным אֶל, не утверждая, будто молитва адресована самому месту.
theological_decisions:
- issue: Антропоморфный образ открытых Божьих глаз
  choice: 'Сохранить образ: «Твои глаза были открыты»'
  alternative: «обрати внимание на этот дом» или «наблюдай за этим домом»
  rationale: Оригинал использует телесный образ Божьего внимательного отношения; буквальный образ сохраняет поэтическую и богословскую силу текста.
- issue: Смысл формулы «Моё имя будет там»
  choice: Сохранить формулу в основном тексте без истолковывающей замены
  alternative: «Моё присутствие будет там» или «Я буду обитать там»
  rationale: Фраза связана с избранием храма и Божьим заветным присутствием, но не тождественна полностью ни одному пояснительному пересказу; примечание разъясняет её, не устраняя многозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены ключевые образы «глаз», «дома», «места» и Божьего «имени»; синтаксис слегка упорядочен для естественного русского звучания. Местоимения, относящиеся к Богу, написаны с прописной буквы как регистровое решение проекта.
