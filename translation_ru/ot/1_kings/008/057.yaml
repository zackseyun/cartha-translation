id: 1KI.8.57
reference: 1 Kings 8:57
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: ru
  text: Да будет с нами Яхве, наш Бог, как был Он с нашими отцами[a]. Пусть Он не оставит нас и не покинет нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с нашими предками». Буквально: «с нашими отцами»; имеются в виду праотцы Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Да будет
  rationale: Юссив от היה выражает молитвенное пожелание; «Да будет» естественно и торжественно передаёт эту волитивную форму.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Форма с суффиксом первого лица множественного числа прямо означает «наш Бог».
- source_word: עִמָּנוּ
  choice: с нами
  rationale: Предлог עם здесь обозначает присутствие и сопребывание.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Вводит прямое сравнение с Божьим присутствием у прежних поколений.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: был Он с нашими отцами
  rationale: Сохраняет прямое значение אבותינו и отсылку к праотцам Израиля; порядок слов поддерживает ясность сравнения в русском.
- source_word: אַל יַעַזְבֵנוּ
  choice: Пусть Он не оставит нас
  rationale: Отрицательный юссив выражает просьбу; עזב передано обычным русским глаголом «оставить».
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: и не покинет нас
  rationale: נטש близко по смыслу к עזב, но «покинет» сохраняет параллелизм без полного лексического повторения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача אֲבֹתֵינוּ
  choice: нашими отцами
  alternative: нашими предками
  rationale: «Отцами» формально сохраняет мужской род исходного слова и его конкретную связь с праотцами Израиля; более широкое по смыслу «предками» отмечено в сноске.
- issue: Соотношение עזב и נטש
  choice: не оставит нас и не покинет нас
  alternative: не оставит и не отвергнет нас
  rationale: Выбраны два близких, но не тождественных глагола, чтобы сохранить синонимический параллелизм и не усиливать נטש до однозначного «отвергнет».
translation_notes:
  register: Современный литературный русский с молитвенно-торжественным, но понятным строем. Местоимение «Он» написано с прописной буквы как уважительная издательская конвенция; богословского различия это не создаёт.
