    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: тогда услышь
  rationale: Форма перфекта 2-го лица единственного числа в контексте молитвенного прошения передаёт обращённую к Богу просьбу. Союз связывает её с условием предыдущих стихов; «тогда» естественно выражает эту связь по-русски.
- source_word: הַשָּׁמַיִם
  choice: на небесах
  rationale: Буквально стоит «небеса» с показателем прямого дополнения, однако в повторяющейся формуле этой молитвы слово имеет обстоятельственный смысл. «На небесах» естественно по-русски и не добавляет значения исходного движения, которое выражало бы «с небес».
- source_word: תְּפִלָּתָם
  choice: их молитву
  rationale: תְּפִלָּה — общее обозначение молитвы; единственное число с суффиксом множественного числа передано собирательно и естественно.
- source_word: תְּחִנָּתָם
  choice: их мольбу
  rationale: תְּחִנָּה обозначает настойчивое прошение о милости. «Мольба» сохраняет усиленный оттенок по сравнению с более общим словом «молитва» и остаётся понятным современному читателю.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: и защити их дело
  rationale: 'Буквально: «и соверши их суд/правосудие». В данном судебном обороте имеется в виду осуществление правосудия в их пользу, то есть поддержка и защита их правого дела. Выбранная формулировка передаёт юридический смысл естественным русским языком.'
theological_decisions:
- issue: Судебный оборот в обращённом к Богу прошении
  choice: защити их дело
  alternative: соверши для них правосудие; поддержи их правое дело
  rationale: Еврейский оборот עשה משפט допускает оттенки осуществления правосудия, защиты права и оправдания стороны. Перевод сохраняет судебно-реляционный смысл, не уточняя сверх текста, каким именно образом Бог должен вынести или исполнить решение.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью без архаизмов. Пара «молитва и мольба» сохраняет смысловое различие двух еврейских существительных, а судебная идиома передана понятно, с альтернативами в сноске.
