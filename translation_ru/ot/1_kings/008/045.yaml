  text: тогда услышь на небесах[a] их молитву и мольбу и соверши для них правосудие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небеса». Возможно также: «с небес», хотя в еврейском тексте нет предлога «с».'
