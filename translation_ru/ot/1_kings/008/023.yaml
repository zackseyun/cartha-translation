  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: ru
  text: 'И он сказал: «Яхве, Бог Израиля! Нет Бога, подобного Тебе[a], ни на небесах вверху, ни на земле внизу. Ты хранишь завет и неизменную любовь[b] к Твоим рабам, которые ходят пред Тобой всем сердцем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Нет подобного Тебе среди богов».'
    reason: Еврейское אֱלֹהִים здесь может быть понято как «Бог» или как множественное «боги».
  - marker: b
    text: Еврейское хесед означает любовь, проявляющуюся в верности и постоянстве, особенно в отношениях завета.
    reason: Одного русского соответствия недостаточно, чтобы полностью передать сочетание любви, преданности и верности в חֶסֶד.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И он сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol; сохраняет связь с предшествующим контекстом, не уточняя сверх текста, кто говорит.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная русская передача конструкции принадлежности в прямом обращении.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: Нет подобного Тебе Бога
  rationale: Выражает несравненность Яхве и сохраняет возможное понимание אֱלֹהִים как единственного числа; другое грамматически возможное прочтение отмечено в сноске.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: ни на небесах вверху, ни на земле внизу
  rationale: Сохраняет множественное число «небеса» и пространственный меризм, охватывающий весь мир.
- source_word: שֹׁמֵר
  choice: Ты хранишь
  rationale: Личная глагольная конструкция естественнее по-русски, чем причастное приложение, и верно передаёт продолжающееся описание Божьего характера.
- source_word: הַבְּרִית
  choice: завет
  rationale: Основной термин для установленного Богом обязательного отношения; определённость ясна из контекста.
- source_word: וְהַחֶסֶד
  choice: и неизменную любовь
  rationale: Передаёт одновременно любовь и её постоянную, верную природу; широкий смысл חֶסֶד пояснён в сноске.
- source_word: לַעֲבָדֶיךָ
  choice: к Твоим рабам
  rationale: Сохраняет отношение служения и принадлежности, существенное в обращении к Богу, без сведения слова к наёмной службе.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: которые ходят пред Тобой
  rationale: Сохраняет еврейскую метафору образа жизни в Божьем присутствии; «пред Тобой» поддерживает dignified biblical register.
- source_word: בְּכָל לִבָּם
  choice: всем сердцем
  rationale: Естественно передаёт безраздельную внутреннюю преданность; в русском числе выражение распределительно относится ко всем рабам.
theological_decisions:
- issue: Значение אֱלֹהִים в утверждении о несравненности
  choice: Нет подобного Тебе Бога
  alternative: Нет подобного Тебе среди богов
  rationale: Контекст допускает понимание существительного как единственного числа «Бог», но еврейская форма также позволяет сравнительное прочтение «среди богов»; основной текст не превращает стих в более узкое догматическое утверждение, а альтернатива сохранена в сноске.
- issue: Смысл חֶסֶד рядом со словом «завет»
  choice: неизменная любовь
  alternative: верная любовь; милость; верность завету
  rationale: Выбранная формулировка удерживает вместе личную любовь и постоянство верности, не сводя חֶסֶד только к эмоции, милосердию или юридическому обязательству.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога Израиля и отличает его от титула «Господь».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «Яхве», «завет», «рабы» и «ходят пред Тобой» сохраняют ключевые образы и отношения исходного текста; синтаксис разделён на естественные для русского языка фразы. Заглавные местоимения в обращении к Богу использованы как русская благоговейная издательская норма, не меняющая смысла оригинала.
