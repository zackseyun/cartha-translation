base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: ru
  text: и прости Твой народ, согрешивший против Тебя, и все их преступления, которые они совершили против Тебя[a]; даруй им милость у их пленителей, чтобы те сжалились над ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все их мятежи». Еврейское слово может обозначать сознательное восстание, особенно нарушение верности Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и те сжалятся над ними». Последнюю фразу можно понимать не только как цель, но и как результат.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: и прости
  rationale: Перфект второго лица в контексте молитвенных прошений передаёт просьбу; русский императив естественно выражает эту функцию.
- source_word: לְעַמְּךָ אֲשֶׁר חָטְאוּ לָךְ
  choice: Твой народ, согрешивший против Тебя
  rationale: Сохраняется образ народа как единого целого и обычное русское управление «согрешить против кого-либо».
- source_word: וּלְכָל פִּשְׁעֵיהֶם אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: и все их преступления, которыми они восстали против Тебя
  rationale: «Преступления» передаёт нравственно-религиозную тяжесть פשע, а «восстали» сохраняет заложенный в однокоренном глаголе оттенок сознательного мятежа против Бога без неестественного русского повтора.
- source_word: וּנְתַתָּם לְרַחֲמִים לִפְנֵי שֹׁבֵיהֶם
  choice: и даруй им сострадание у пленивших их
  rationale: Идиома נתן לְרַחֲמִים означает, что Бог обеспечивает им сострадательное отношение со стороны тех, перед кем они находятся; формулировка сохраняет Бога как действующего и не перегружает фразу пояснением.
- source_word: וְרִחֲמוּם
  choice: чтобы те сжалились над ними
  rationale: Передаёт вероятное целевое значение последовательности и сохраняет корневую связь с רַחֲמִים через русские слова «сострадание» и «сжалились».
theological_decisions:
- issue: Связь между Божьим прощением и состраданием пленивших
  choice: Стих передан как молитва о том, чтобы Бог простил народ и даровал ему сострадательное отношение пленивших.
  alternative: 'Заключительную фразу можно понимать как прямое следствие: «и те сжалятся над ними».'
  rationale: Еврейская последовательность допускает как целевой, так и результативный оттенок; основной текст выбирает естественное целевое прочтение, а примечание сохраняет синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным строем. Местоимение «Тебя» написано с прописной буквы в соответствии с традиционным русским обращением к Богу. Лексическая игра רַחֲמִים/רחם частично сохранена сочетанием «сострадание»/«сжалились».
