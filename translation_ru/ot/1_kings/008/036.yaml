base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: ru
  text: то услышь на небесах и прости грех Твоих слуг — Твоего народа Израиля, когда[a] будешь наставлять их на добрый путь, по которому им следует идти. И пошли дождь на Твою землю, которую Ты дал Своему народу в наследие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Ты наставишь их на добрый путь, по которому им следует идти». Еврейский союз может выражать как время, так и причину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: услышь на небесах
  rationale: В еврейском тексте предлог не выражен; по контексту молитвы естественно подразумевается место, где Бог слышит. Русское «на небесах» сохраняет образ и звучит естественно.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: и прости грех
  rationale: חַטָּאת здесь обозначает проступок, нуждающийся в прощении, а не жертву за грех.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: Твоих слуг — Твоего народа Израиля
  rationale: 'עֶבֶד в обращении к Богу уместно передать как «слуга». Тире показывает пояснительную связь: слуги названы Божьим народом Израилем.'
- source_word: כִּי תוֹרֵם
  choice: когда будешь наставлять их
  rationale: כִּי допускает несколько значений. В данном контексте временное «когда» естественно связывает прощение с Божьим наставлением, не устраняя исходную смысловую гибкость полностью; она отмечена в сноске.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: на добрый путь, по которому им следует идти
  rationale: Сохраняется метафора пути как образа поведения. После русского «наставлять» управление «на путь» естественнее буквального «учить пути».
- source_word: וְנָתַתָּה מָטָר
  choice: И пошли дождь
  rationale: Буквально «дай дождь», однако современное русское сочетание «пошли дождь» естественно для молитвенной просьбы и точно передаёт смысл.
- source_word: עַל אַרְצְךָ
  choice: на Твою землю
  rationale: Сохранено прямое указание на принадлежность земли Богу.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: которую Ты дал Своему народу в наследие
  rationale: נַחֲלָה обозначает наследственный удел; формулировка ясна современному читателю и сохраняет тему дарованной Богом земли.
theological_decisions:
- issue: Божья собственность на землю и дарование её Израилю
  choice: на Твою землю, которую Ты дал Своему народу в наследие
  alternative: на землю, которую Ты дал Своему народу в наследие
  rationale: Местоименный суффикс при «земле» прямо называет её Божьей, а следующее придаточное — наследием народа. Сохранение обоих утверждений передаёт заложенное в тексте напряжение между Божьим владением и даром Израилю.
- issue: Связь Божьего наставления с прощением и дождём
  choice: когда будешь наставлять их
  alternative: потому что Ты наставляешь их / ибо Ты наставишь их
  rationale: Значение כִּי неоднозначно. Временное прочтение хорошо соответствует ходу прошения, но причинное прочтение остаётся грамматически возможным и поэтому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции. Императивы «услышь», «прости», «пошли» передают форму прошения без архаизации.
