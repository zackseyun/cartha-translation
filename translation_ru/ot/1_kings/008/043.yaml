  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: ru
  text: услышь на небесах, в месте Твоего обитания, и поступи согласно всему, о чём воззовёт к Тебе чужеземец[a], чтобы все народы земли узнали Твоё имя, боялись Тебя, как народ Твой Израиль, и знали, что этот дом назван Твоим именем[b], который я построил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о чём попросит Тебя чужеземец»; буквально: «о чём воззовёт к Тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Твоё имя призвано над этим домом». Это библейское выражение указывает, что дом связан с Божьим именем, принадлежит Ему и носит Его имя.'
    reason: idiom_explanation
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: услышь
  rationale: Имперфект в контексте молитвы выражает просьбу. Русский повелительный «услышь» естественно передаёт просительный смысл.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: на небесах, в месте Твоего обитания
  rationale: Сохраняется представление о небесах как месте Божьего обитания; приложение передано ясной русской конструкцией.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: и сделай всё, о чём
  rationale: Передаёт широкое значение глагола עשה и полноту выражения כְּכֹל אֲשֶׁר без ненужного уточнения характера ответа.
- source_word: יִקְרָא אֵלֶיךָ
  choice: воззовёт к Тебе
  rationale: קרא אל обозначает обращённый к кому-либо зов, здесь — молитвенное обращение. «Воззовёт» сохраняет молитвенную окраску и не сводит выражение лишь к просьбе.
- source_word: הַנָּכְרִי
  choice: иноплеменник
  rationale: Слово обозначает человека из другого народа. «Иноплеменник» точно передаёт этническую принадлежность и уместно в dignified biblical register.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: все народы земли
  rationale: Сохраняет универсальный охват и множественное עַמֵּי — «народы».
- source_word: לְיִרְאָה אֹתְךָ
  choice: боялись Тебя
  rationale: «Бояться» сохраняет смысловой диапазон ירא — страх, благоговение и трепет — не заменяя его более узким толкованием «почитать».
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: Твоё имя наречено над
  rationale: Формально прозрачная передача древнееврейской идиомы сохраняет образ наречения имени и не устраняет его смысловую насыщенность.
theological_decisions:
- issue: Смысл ירא в отношении народов к Богу
  choice: боялись Тебя
  alternative: чтили Тебя; благоговели перед Тобой
  rationale: Буквальное «боялись» сохраняет напряжение между страхом, благоговением и почитанием, присущее исходному слову.
- issue: Идиома שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: Твоё имя наречено над этим домом
  alternative: этот дом носит Твоё имя; этот дом принадлежит Тебе
  rationale: Основной текст сохраняет библейскую идиому, а примечание разъясняет подразумеваемую принадлежность и связь храма с Богом, не подменяя образ толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции; синтаксис остаётся понятным современному читателю.
