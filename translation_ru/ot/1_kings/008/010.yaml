  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: ru
  text: Когда священники вышли из святилища[a], облако наполнило дом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из святого места»; возможно также как техническое обозначение: «из Святого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Когда … вышли
  rationale: Сочетание וַיְהִי с инфинитивной конструкцией בְּצֵאת вводит следующее событие и задаёт время главного действия. Русское «Когда … вышли» естественно передаёт повествовательный переход без тяжеловесного «И было, когда».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямое соответствие определённому существительному во множественном числе; определённость в русском языке ясна из контекста.
- source_word: מִן הַקֹּדֶשׁ
  choice: из святилища
  rationale: קֹדֶשׁ обозначает освящённое пространство храма, из которого вышли священники. «Святилище» естественно и сохраняет возможный широкий смысл; более буквальное «святое место» указано в сноске.
- source_word: וְהֶעָנָן
  choice: облако
  rationale: Определённое существительное указывает на явившееся облако. В русском придаточное времени естественно соединяется с главным предложением без отдельной передачи союза וְ.
- source_word: מָלֵא
  choice: наполнило
  rationale: Форма Qal perfect, согласованная с существительным «облако», описывает завершённое повествовательное событие; простой прошедший вид уместен.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквальное «дом Яхве» сохраняет конкретный храмовый образ בֵּית и передаёт личное имя יהוה как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. «Яхве» передаёт его как имя, не заменяя титулом и не привнося конфессионального толкования.
- issue: Область, обозначенная словом הַקֹּדֶשׁ
  choice: святилище
  alternative: святое место; Святое
  rationale: Контекст указывает на священную внутреннюю область храма, однако само слово не требует здесь узкотехнического русского термина. Основной перевод и сноска сохраняют эту лексическую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; конкретный образ «дом Яхве» и неоднозначность термина קֹדֶשׁ сохранены.
