base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: ru
  text: Но обратись к молитве раба Твоего и к его мольбе о милости[a], Яхве, Боже мой, чтобы услышать вопль[b] и молитву, которую раб Твой возносит перед Тобою сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к его прошению». Еврейское слово означает настойчивую просьбу о милости или благосклонности.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «звучный возглас». Еврейское слово может обозначать громкий крик или возглас; здесь по контексту это вопль, обращённый к Богу в молитве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Но обратись к
  rationale: Глагол פנה сохраняет образ обращения в чью-либо сторону и в контексте молитвы означает просьбу обратить благосклонное внимание. Союз передан как «но», поскольку просьба следует за признанием в предыдущем стихе, что небеса не могут вместить Бога.
- source_word: תְּפִלַּת
  choice: молитве
  rationale: Прямой и естественный эквивалент תפלה; повтор этого слова далее в стихе сохранён.
- source_word: עַבְדְּךָ
  choice: раба Твоего / раб Твой
  rationale: В обращении к Богу עבד выражает смиренное положение служащего Ему человека. Форма «раб» сохраняет традиционную библейскую образность и оба повтора оригинала.
- source_word: תְּחִנָּתוֹ
  choice: его мольбе о милости
  rationale: תחנה обозначает настойчивую просьбу о благосклонности или милости. Местоимение третьего лица относится к Соломону, который называет себя Божьим рабом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהָי
  choice: Боже мой
  rationale: Естественная русская форма прямого обращения с притяжательным значением.
- source_word: לִשְׁמֹעַ
  choice: услышь
  rationale: Инфинитив цели при просьбе обратить внимание естественно передан по-русски вторым повелительным глаголом, без изменения смысла молитвенной просьбы.
- source_word: הָרִנָּה
  choice: вопль
  rationale: רנה может означать громкий, звучный возглас. В данном молитвенном контексте «вопль» передаёт настойчивое обращение к Богу и не привносит значения пения.
- source_word: הַתְּפִלָּה
  choice: молитву
  rationale: Повтор תפלה сохранён в соответствии с еврейским параллелизмом.
- source_word: מִתְפַּלֵּל
  choice: обращается … с молитвой
  rationale: Причастие обозначает совершающееся действие. Русская конструкция «молитва, с которой … обращается» звучит естественно и сохраняет процессуальный оттенок.
- source_word: לְפָנֶיךָ
  choice: к Тебе
  rationale: В сочетании с русским «обращается» это естественно передаёт молитву, совершаемую перед Богом, в Его присутствии.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный прямой эквивалент временного указания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не подменяет его словом «Господь».
- issue: Оттенок תְּחִנָּה
  choice: мольба о милости
  alternative: прошение; мольба
  rationale: Выражение указывает не просто на просьбу, а на настойчивое искание благосклонности или милости; перевод не уточняет, на каком основании она ожидается.
- issue: Значение רִנָּה в молитвенном контексте
  choice: вопль
  alternative: громкий возглас; ликование; песнь
  rationale: Слово допускает разные виды звучного возгласа, но параллель с молитвой и мольбой здесь указывает на обращённый к Богу крик. Возможная широта образа отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский с достоинством молитвенной речи. Заглавные местоимения в обращении к Богу поддерживают принятый русский религиозный регистр. Синтаксис слегка разгружен: еврейская конструкция с инфинитивом цели передана двумя согласованными просьбами — «обратись» и «услышь».'
