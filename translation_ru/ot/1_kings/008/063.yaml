  terminology: «Яхве» последовательно передаёт тетраграмматон. «Мирные жертвы» — устойчивый русский библейский термин для שְׁלָמִים; примечание корректно указывает возможные смысловые альтернативы. «Посвятили» удачно передаёт חנך в контексте посвящения храма. «Израильтяне» естественно передаёт этнонимное בְּנֵי יִשְׂרָאֵל.
