  source_fidelity: Русский текст верно передаёт жертвоприношение Соломона Яхве, термин זֶבַח הַשְּׁלָמִים, оба числа и категории животных, а также совместное посвящение дома Яхве царём и всем Израилем. Более широкое «мелкий скот» для צֹאן оправдано и не сужает еврейский термин до одних овец. Опущенный в русском стилистический повтор еврейской конструкции «принёс жертву… которую принёс» не влияет на смысл.
