id: 1KI.8.63
reference: 1 Kings 8:63
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: ru
  text: 'Соломон принёс Яхве мирные жертвы: двадцать две тысячи голов крупного скота и сто двадцать тысяч голов мелкого скота[a]. Так царь и все израильтяне посвятили дом Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; также возможно: «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... אֵת זֶבַח
  choice: принёс ... жертвы
  rationale: Естественно передаёт этимологическую конструкцию с глаголом זבח и существительным זֶבַח, избегая тяжеловесного повтора «совершил жертвоприношение жертвы».
- source_word: הַשְּׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшийся русский культовый термин; сохраняет связь корня שׁלם с миром и благополучием, хотя весь смысловой диапазон термина им не исчерпывается.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: בָּקָר
  choice: голов крупного скота
  rationale: Коллективное обозначение крупного рогатого скота; счётное слово «голов» требуется естественным русским синтаксисом при больших числах.
- source_word: צֹאן
  choice: голов мелкого скота
  rationale: צֹאן охватывает овец и коз, поэтому «мелкий скот» точнее более узкого «овцы»; «голов» делает числовую конструкцию естественной.
- source_word: וַיַּחְנְכוּ
  choice: посвятили
  rationale: В контексте первого храмового служения означает посвящение здания священному назначению; «освятили» могло бы внести иной богословский оттенок.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Формально сохраняет образ «дома», не подменяя его пояснительным «храм».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: все израильтяне
  rationale: В данном этнонимном выражении буквально «сыны Израиля» обозначает народ Израиля в совокупности; современное «израильтяне» ясно и естественно передаёт функцию выражения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл זֶבַח הַשְּׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения / жертвы благополучия
  rationale: «Мирные жертвы» — понятный и устоявшийся термин, но альтернативные варианты отражают другие стороны семантики שְׁלָמִים; примечание сохраняет эту неоднозначность.
- issue: Объём значения צֹאן
  choice: мелкий скот
  alternative: овцы
  rationale: Еврейское слово может обозначать стада овец и коз; более широкая передача не сужает состав принесённых животных без основания.
- issue: 'Участники посвящения: בְּנֵי יִשְׂרָאֵל'
  choice: все израильтяне
  alternative: все сыны Израиля
  rationale: Выражение функционирует как общее название народа, а не как явное ограничение по полу; идиоматический этноним передаёт его референцию без добавления богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Сохранено «дом Яхве» как значимый библейский образ; тяжеловесные буквальные повторы сглажены. Числа переданы словами, а категории животных — без неоправданного сужения значения.
