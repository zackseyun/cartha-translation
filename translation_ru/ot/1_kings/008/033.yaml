id: 1KI.8.33
reference: 1 Kings 8:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: ru
  text: Когда Твой народ Израиль потерпит поражение перед врагом за то, что согрешил против Тебя, и обратится к Тебе, исповедует Твоё имя[a], будет молиться и умолять Тебя в этом доме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославит Твоё имя»; или: «воздаст Тебе благодарение». Еврейский глагол в зависимости от контекста может означать исповедание, хвалу или благодарение.'
    reason: Лексическая многозначность глагола ידה.
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: потерпит поражение
  rationale: Нифаль от נָגַף в военном контексте обозначает поражение перед врагом. Русское выражение естественно передаёт пассивно-результативный смысл и не архаично.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Твой народ Израиль
  rationale: Сохранены притяжательное обозначение отношений с Богом и наименование народа.
- source_word: לִפְנֵי אוֹיֵב
  choice: перед врагом
  rationale: Сохранён обычный для еврейских формул поражения оборот с לִפְנֵי; неопределённость существительного без артикля по-русски естественно передаётся без уточнения.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: за то, что согрешил против Тебя
  rationale: В данном контексте אֲשֶׁר вводит причину поражения. Единственное число согласовано с собирательным существительным «народ».
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: но затем обратится к Тебе
  rationale: שׁוּב выражает возвращение к Богу. «Обратится» естественно передаёт это движение без добавления более развёрнутой доктринальной формулы; «но» ясно обозначает поворот в условной последовательности.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: исповедает имя Твоё
  rationale: В контексте греха, поражения и возвращения Hiphil ידה уместно передать как признание Божьего имени и власти. Возможные значения хвалы и благодарения сохранены в сноске.
- source_word: וְהִתְפַּלְלוּ
  choice: станет молиться
  rationale: Прямой и современный русский эквивалент Hitpael глагола פלל.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: умолять Тебя
  rationale: Передаёт настойчивую мольбу, выраженную Hitpael от חנן, не добавляя в основной текст отсутствующее существительное «милость».
- source_word: בַּבַּיִת הַזֶּה
  choice: в этом доме
  rationale: Предлог בְּ здесь означает «в», а «дом» сохраняет исходный образ, хотя по контексту речь идёт о храме.
theological_decisions:
- issue: Передача обращения к Богу после греха
  choice: обратится к Тебе
  alternative: вернётся к Тебе; покается и вернётся к Тебе
  rationale: Глагол שׁוּב обозначает поворот или возвращение. Выбранная формулировка сохраняет богословское направление действия, не добавляя к одному глаголу двойную формулу покаяния и возвращения.
- issue: Передача וְהוֹדוּ אֶת שְׁמֶךָ в покаянном контексте
  choice: исповедает имя Твоё
  alternative: прославит имя Твоё; возблагодарит имя Твоё
  rationale: Контекст греха, поражения и обращения поддерживает значение открытого признания Божьего имени, однако многозначность ידה не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сохраняет незавершённость условного придаточного, поскольку стих продолжается в следующем предложении молитвы.
