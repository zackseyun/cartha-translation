revisions:
- from: Когда Твой народ Израиль потерпит поражение перед врагом за то, что согрешил против Тебя, но затем обратится к Тебе, исповедает имя Твоё[a], станет молиться и умолять Тебя в этом доме,
  to: Когда Твой народ Израиль потерпит поражение перед врагом за то, что согрешил против Тебя, и обратится к Тебе, исповедует Твоё имя[a], будет молиться и умолять Тебя в этом доме,
  rationale: Убраны не выраженные в оригинале значения противопоставления, последующего времени и начала действия. Сохранены условная незавершённость стиха, коллективное единственное число при «народ», а также лексическая неоднозначность ידה в сноске.
