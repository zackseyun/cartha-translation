review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: военное поражение, причинная связь с грехом, обращение к Богу, исповедание имени, молитва и мольба в этом доме. Однако союз «но затем» не имеет опоры в еврейском тексте: последовательные waw не задают здесь ни явного противопоставления, ни дополнительного временного оттенка. «Станет молиться» также неоправданно вносит начинательное значение.'
  naturalness: Текст в целом литературен и сохраняет незавершённый синтаксис условного периода. Замена «но затем обратится» на «и обратится» и «станет молиться» на «будет молиться» делает последовательность ближе к оригиналу и более нейтральной.
  terminology: '«Потерпит поражение», «обратится к Тебе», «исповедует Твоё имя», «умолять Тебя» и «в этом доме» допустимы в современном литературно-библейском регистре. Сноску следует немного отредактировать: «возблагодарит имя» по-русски неестественно; благодарение естественно воздаётся Богу.'
  issues:
  - severity: medium
    issue: Добавлены противопоставительный и временной оттенки в «но затем обратится».
    rationale: Еврейское וְשָׁבוּ продолжает ряд действий и означает «и обратятся/вернутся»; в тексте нет отдельного показателя для «но» или «затем».
  - severity: low
    issue: «Станет молиться» придаёт глаголу начинательное значение.
    rationale: וְהִתְפַּלְלוּ просто обозначает молитву; «будет молиться» точнее сохраняет условно-будущую последовательность.
  - severity: low
    issue: В сноске неестественна формула «возблагодарит имя Твоё».
    rationale: Русский глагол «возблагодарить» обычно принимает адресата; вариант «воздаст Тебе благодарение» естественно передаёт соответствующее значение еврейского глагола.
  revised_text: Когда Твой народ Израиль потерпит поражение перед врагом за то, что согрешил против Тебя, и обратится к Тебе, исповедует Твоё имя[a], будет молиться и умолять Тебя в этом доме,
  revised_footnotes:
