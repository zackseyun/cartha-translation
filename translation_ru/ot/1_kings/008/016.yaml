source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: ru
  text: С того дня, как Я вывел Мой народ Израиль из Египта, Я не избирал ни одного города среди всех колен Израиля, чтобы построить дом, чтобы имя Моё было там, но[a] избрал Давида, чтобы он был над Моим народом Израилем.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и избрал Давида». Еврейский союз может иметь соединительное значение, однако контекст, вероятно, указывает на противопоставление: город не был избран, а Давид был избран.'
    reason: lexical_alternative
  - marker: b
    text: «Дом, чтобы имя Моё было там» — еврейская формула о святилище, связанном с именем и присутствием Господа.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: Я вывел
  rationale: Каузативная форма глагола יצא обычно обозначает выведение Израиля из Египта; «вывел» естественно и точно передаёт этот смысл.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: Мой народ Израиль
  rationale: Приложение отождествляет «Мой народ» с Израилем; в русском это сочетание ясно без дополнительной пунктуации.
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: Я не избрал города ни в одном из колен Израиля
  rationale: Сжатая еврейская конструкция говорит о городе, относящемся к одному из колен. Русское «ни в одном из колен» естественно выражает охват всех колен и отрицание выбора.
- source_word: לִבְנוֹת בַּיִת
  choice: чтобы построить дом
  rationale: Сохранено буквальное «дом», а не подставлено толкование «храм», чтобы удержать исходный образ.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: где пребывало бы Моё имя
  rationale: Передаёт назначение дома естественным русским оборотом; «пребывало» выражает устойчивое присутствие, не отождествляя имя с материальным местом.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: но избрал Давида
  rationale: Союз ו допускает соединительное «и», однако контекст противопоставляет отсутствие избранного города избранию Давида.
- source_word: לִהְיוֹת עַל עַמִּי יִשְׂרָאֵל
  choice: чтобы он был над Моим народом Израилем
  rationale: Формулировка сохраняет буквальное значение «быть над» и не конкретизирует характер власти сильнее исходного текста.
theological_decisions:
- issue: Богословие храма в выражении «дом, где пребывало бы Моё имя»
  choice: Сохранить существительное «дом» и образ присутствия Божьего имени.
  alternative: Перевести прямо как «храм» или «дом, где Я буду обитать».
  rationale: Так сохраняется характерная для Второзакония и книг Царств богословская формула имени, без отождествления Бога с храмовым зданием и без замены исходного образа толкованием.
- issue: Связь между отсутствием избранного города и избранием Давида
  choice: Передать ו противительным союзом «но».
  alternative: Передать нейтральным союзом «и».
  rationale: 'Контекст подчёркивает контраст: город ещё не был избран, тогда как Давид был избран. Примечание сохраняет допустимую соединительную трактовку.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены ключевые образы «дом», «имя» и «быть над»; синтаксис сделан понятным для обычного читателя без конфессионально окрашенных уточнений.
