source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: ru
  text: В тот день царь освятил середину двора перед домом Яхве[a], ибо там он принёс всесожжение, хлебное приношение и тук мирных жертв[b], потому что бронзовый жертвенник перед Яхве был слишком мал, чтобы вместить всесожжение, хлебное приношение и тук мирных жертв.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть перед храмом Яхве.
    reason: Поясняет древнееврейское выражение «дом Яхве», не заменяя образ «дома» в основном тексте.
  - marker: b
    text: 'Или: «жировые части мирных жертв».'
    reason: Поясняет, что древнееврейское слово обозначает жировые части, предназначенные для сожжения на жертвеннике.
lexical_decisions:
- source_word: קִדַּשׁ
  choice: освятил
  rationale: Глагол обозначает отделение пространства для священного употребления; «освятил» естественно и точно передаёт культовый смысл.
- source_word: תּוֹךְ הֶחָצֵר
  choice: середину двора
  rationale: תּוֹךְ здесь имеет пространственное значение «середина, внутренняя часть»; контекст указывает на участок храмового двора.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: перед домом Яхве
  rationale: Сохранены пространственное значение לִפְנֵי и древнееврейский образ храма как «дома» Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: עָשָׂה שָׁם
  choice: там он принёс
  rationale: В жертвенном контексте עָשָׂה означает совершить или принести жертву; «принёс» идиоматично по-русски.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Традиционный и точный русский термин для жертвы עֹלָה, целиком сжигавшейся на жертвеннике.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из продуктов земледелия; устойчивое библейское выражение «хлебное приношение» понятно и не сужает его до цельного зерна.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: тук мирных жертв
  rationale: חֶלֶב обозначает предназначенные для сожжения жировые части, а שְׁלָמִים — мирные жертвы; «тук» сохраняет точный культовый смысл.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: бронзовый жертвенник
  rationale: נְחֹשֶׁת может означать медь или бронзу; для храмового жертвенника общепринято и контекстуально вероятно «бронзовый».
- source_word: קָטֹן מֵהָכִיל
  choice: был слишком мал, чтобы вместить
  rationale: Конструкция выражает недостаточную вместимость жертвенника для большого объёма приношений.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя; форма «Яхве» прямо передаёт тетраграмматон и не заменяет его титулом.
- issue: Значение שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; благодарственные жертвы
  rationale: «Мирные жертвы» сохраняет широкий традиционный смысл термина и не сводит его к одной возможной функции, такой как благодарение или общение.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной храмово-жертвенной терминологией. Синтаксис упрощён для ясного чтения, но повтор исходного текста сохранён. «Дом Яхве» оставлен в основном тексте как значимый древнееврейский образ и пояснён сноской.
