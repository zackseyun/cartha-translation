source:
  edition: WLC
  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: ru
  text: чтобы Он склонил наши сердца к Себе, чтобы мы ходили всеми Его путями и соблюдали Его заповеди, установления и постановления, которые Он заповедал нашим отцам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашим предкам». Буквально: «нашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת לְבָבֵנוּ אֵלָיו
  choice: чтобы Он склонил наши сердца к Себе
  rationale: Каузативный инфинитив от נטה передаёт побуждение или направление внутреннего человека к Богу. «Склонил наши сердца» сохраняет образ исходного текста, а «к Себе» естественно передаёт направленность אֵלָיו в молитвенном контексте.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: чтобы мы ходили всеми Его путями
  rationale: Сохранена библейская метафора хождения как образа образа жизни и поведения; творительный падеж после «ходили» естественно передаёт בְּ в этом устойчивом выражении.
- source_word: וְלִשְׁמֹר
  choice: и соблюдали
  rationale: В сочетании с предписаниями שׁמר означает исполнять и соблюдать их. «Соблюдали» ясно и естественно для современного русского языка.
- source_word: מִצְוֺתָיו
  choice: Его заповеди
  rationale: «Заповеди» точно передаёт обязательные повеления и сохраняет традиционный заветный регистр.
- source_word: וְחֻקָּיו
  choice: установления
  rationale: חֹק / חֻקָּה обозначает предписанное установление; этот вариант сохраняет отличие термина от заповедей и постановлений.
- source_word: וּמִשְׁפָּטָיו
  choice: постановления
  rationale: מִשְׁפָּט в правовом контексте может обозначать судебное или нормативное постановление. «Постановления» звучит естественнее современного «суды» и не смешивает термин с חֻקִּים.
- source_word: אֲשֶׁר צִוָּה
  choice: которые Он заповедал
  rationale: Относительное предложение отнесено ко всем трём видам предписаний; глагол «заповедал» сохраняет силу צוה.
- source_word: אֶת אֲבֹתֵינוּ
  choice: нашим отцам
  rationale: Буквально сохранён мужской термин родства אָבוֹתֵינוּ. Возможное более обобщённое понимание «предкам» вынесено в примечание.
theological_decisions:
- issue: Божье действие и человеческое послушание
  choice: чтобы Он склонил наши сердца к Себе, чтобы мы ходили… и соблюдали
  alternative: склоняя наши сердца к Себе, направлял нас ходить…
  rationale: Формулировка сохраняет присущую тексту связь Божьего воздействия на сердце с последующим хождением и соблюдением заповедей, не объясняя сверх текста характер их соотношения.
- issue: Триада терминов закона завета
  choice: заповеди, установления и постановления
  alternative: повеления, уставы и суды
  rationale: Три разных еврейских термина переданы тремя различимыми русскими словами, чтобы не сглаживать юридическую и заветную фактуру исходного текста.
- issue: Обозначение предшествующих поколений Израиля
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Основной текст сохраняет грамматически мужское родственное обозначение оригинала, а более широкая по референции передача отмечена как допустимая.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-заветным регистром. Метафоры «склонить сердца» и «ходить путями» сохранены как понятные библейские образы. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным издательским стилем.
