  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: ru
  text: Когда Твой народ выступит на войну против своего врага в поход, в который Ты их пошлёшь[a], и они будут молиться Яхве, обратившись к городу[b], который Ты избрал, и к дому, который я построил для Твоего имени[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по пути, которым Ты пошлёшь их»; «путь» может обозначать направление или военный поход.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «в направлении города»; это выражает обращённость молящихся к городу.'
    reason: lexical_alternative
  - marker: c
    text: 'То есть к храму; в еврейском тексте буквально: «к дому».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Здесь частица вводит возможное обстоятельство в последовательности прошений Соломона; «когда» естественно передаёт условно-временной смысл.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: Твой народ выйдет на войну
  rationale: Сохраняет конкретный образ выхода на военный поход и естественно звучит по-русски.
- source_word: עַל אֹיְבוֹ
  choice: против своего врага
  rationale: Единственное число суффикса при «враге» согласовано с собирательным существительным «народ».
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: по пути, которым Ты пошлёшь его
  rationale: Сохраняет образ пути и представляет Бога направляющим народ; местоимение «его» согласуется с русским словом «народ».
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: и будет молиться Яхве
  rationale: Число согласовано с собирательным «народ»; личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: דֶּרֶךְ הָעִיר
  choice: обратившись к городу
  rationale: В этом сочетании דֶּרֶךְ обозначает направление молитвы; такая формулировка ясна и естественна в современном русском.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: городу, который Ты избрал
  rationale: Передаёт текст без добавления подразумеваемой цели избрания города.
- source_word: וְהַבַּיִת
  choice: и к дому
  rationale: Сохраняет буквальное «дом», хотя по контексту речь идёт о храме.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: который я построил для Твоего имени
  rationale: Сохраняет значимую библейскую формулу «для имени», не сводя её к пояснительному пересказу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Передача הַבַּיִת
  choice: дом
  alternative: храм
  rationale: Хотя имеется в виду храм, исходный текст употребляет «дом»; это сохраняет канонический образ дома, построенного для Божьего имени.
- issue: Направление молитвы
  choice: обратившись к городу ... и к дому
  alternative: по направлению к городу ... и дому
  rationale: Глагольная формулировка естественно выражает физическую ориентацию молящихся, не приписывая самому городу или храму самостоятельной силы.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Прописные местоимения при обращении к Богу использованы как издательская норма данного перевода. Стих сохраняет незавершённость предложения, продолжающегося в следующем стихе.
