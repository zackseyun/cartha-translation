base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: ru
  text: И когда Соломон окончил возносить Яхве всю эту молитву и мольбу о милости[a], он поднялся от жертвенника Яхве, перед которым стоял на коленях с простёртыми к небу ладонями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошение». Еврейское слово обозначает настойчивую просьбу о милости или благосклонности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: И когда ... окончил
  rationale: Сочетание וַיְהִי с כְּ и инфинитивом вводит временное придаточное; по-русски естественно передаётся конструкцией «И когда ... окончил» без буквального «и было».
- source_word: לְהִתְפַּלֵּל ... אֵת כָּל הַתְּפִלָּה
  choice: окончил возносить ... всю эту молитву
  rationale: Глагол «возносить» позволяет естественно сохранить молитву как прямой объект, как в еврейском тексте, и передаёт действие молитвы в достойном современном русском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: הַתְּחִנָּה
  choice: мольбу о милости
  rationale: Слово обозначает настойчивое прошение о благосклонности или милости; такой перевод выражает оттенок точнее, чем одно лишь нейтральное «прошение».
- source_word: קָם ... מִכְּרֹעַ עַל בִּרְכָּיו
  choice: поднялся с колен
  rationale: Естественная русская формулировка сохраняет явно обозначенную в источнике перемену позы и упоминание коленей без неидиоматического повтора.
- source_word: מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: перед жертвенником Яхве
  rationale: 'Сохраняется пространственное значение לִפְנֵי: Соломон находился перед жертвенником.'
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: ладони его были простёрты к небу
  rationale: כַּף конкретно обозначает ладонь или кисть руки; «ладони» точно передаёт молитвенную позу, а направление выражено естественным оборотом «к небу».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл תְּחִנָּה
  choice: мольба о милости
  alternative: прошение
  rationale: Выбранный вариант сохраняет направленность просьбы на милость или благосклонность, не добавляя конкретного догматического содержания.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан естественным для широкого читателя, при этом сохранены личное имя Яхве, телесная поза Соломона и конкретное указание на ладони.
