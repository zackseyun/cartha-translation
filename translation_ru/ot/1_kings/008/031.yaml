base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: ru
  text: Если человек согрешит против своего ближнего и на него возложат клятву[a], чтобы привести его к присяге, и клятва предстанет перед Твоим жертвенником в этом доме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заклятие», «проклятие». Еврейское слово может обозначать как саму клятву, так и проклятие, призываемое на нарушившего её.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: согрешит
  rationale: Глагол חטא обозначает грех или проступок; «согрешит» сохраняет нравственно-религиозную силу слова в судебном контексте.
- source_word: אִישׁ
  choice: человек
  rationale: Здесь существительное употреблено обобщённо. Русское «человек» естественно передаёт родовое значение, не превращая его в указание исключительно на мужчину.
- source_word: לְרֵעֵהוּ
  choice: против своего ближнего
  rationale: רֵעַ означает ближнего, товарища или другого члена сообщества; «ближний» сохраняет привычный библейский этический смысл.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: и на него возложат клятву
  rationale: Безличная русская конструкция естественно передаёт наложение на обвиняемого судебной клятвы, не уточняя не названного в еврейском тексте деятеля.
- source_word: לְהַאֲלֹתוֹ
  choice: чтобы привести его к присяге
  rationale: Каузативный инфинитив означает побудить или обязать человека поклясться; выбранная формулировка ясна в судебном контексте и сохраняет причинительное значение.
- source_word: וּבָא אָלָה
  choice: и клятва предстанет
  rationale: В масоретском тексте אָלָה естественно понимать как подлежащее «клятва». Лёгкая персонификация сохраняет синтаксис и образ появления клятвы перед Божьим жертвенником.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: перед Твоим жертвенником
  rationale: Прямо и естественно передаёт пространственное и судебно-сакральное выражение.
- source_word: בַּבַּיִת הַזֶּה
  choice: в этом доме
  rationale: «Дом» сохраняет буквальное значение בַּיִת и богословски значимое наименование храма в молитве Соломона.
theological_decisions:
- issue: Значение אָלָה в храмово-судебном контексте
  choice: клятва
  alternative: проклятие; заклятие
  rationale: Контекст описывает судебную присягу перед жертвенником, поэтому в основном тексте уместнее «клятва». Однако слово может обозначать также проклятие, призываемое как последствие ложной клятвы; эта смысловая напряжённость сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение к Богу передано с прописной буквы. Синтаксис сохраняет незавершённость стиха, поскольку предложение продолжается в следующем стихе.
