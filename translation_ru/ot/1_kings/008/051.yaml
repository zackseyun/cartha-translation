base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: ru
  text: Ибо они — Твой народ и Твоё наследие[a], которых Ты вывел из Египта, из железоплавильной печи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё владение»; или: «Твоё достояние».'
    reason: lexical_alternative
  - marker: b
    text: «Железоплавильная печь» — образ Египта как места жестокого угнетения и страданий; ср. Второзаконие 4:20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание предыдущей просьбы Соломона; «ведь» естественно передаёт пояснительно-причинную связь в русском контексте.
- source_word: עַמְּךָ
  choice: Твой народ
  rationale: Прямо и естественно передаёт обозначение Израиля как народа, принадлежащего Богу.
- source_word: וְנַחֲלָתְךָ
  choice: и Твоё наследие
  rationale: Сохраняет образ удела и принадлежности, важный для заветного языка; возможны также значения «владение» и «достояние».
- source_word: הֵם
  choice: они —
  rationale: Самостоятельное местоимение выражено явно; тире естественно оформляет именное сказуемое в русском языке.
- source_word: אֲשֶׁר
  choice: которое
  rationale: Относительное местоимение грамматически соотнесено с ближайшим собирательным существительным «наследие», при этом обозначает тот же народ.
- source_word: הוֹצֵאתָ
  choice: Ты вывел
  rationale: 'Каузативная форма от יצא передаёт действие исхода: Бог вывел народ; «вывел» является естественной и устойчивой русской формулировкой.'
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Точно передаёт исходное направление и соответствует принятому русскому выражению об исходе из Египта.
- source_word: מִתּוֹךְ
  choice: из
  rationale: В сочетании с образом печи русское «из» достаточно передаёт выход изнутри и избегает тяжеловесного «из среды».
- source_word: כּוּר הַבַּרְזֶל
  choice: железоплавильной печи
  rationale: Передаёт образ печи для плавки железа яснее, чем двусмысленное русское сочетание «железная печь», которое может означать печь, изготовленную из железа.
theological_decisions:
- issue: Израиль как Божье «наследие»
  choice: Сохранить «Твоё наследие» в основном тексте
  alternative: «Твоё владение» или «Твоё достояние»
  rationale: «Наследие» удерживает заложенный в נַחֲלָה язык удела и принадлежности, не снимая напряжения, возникающего при применении этого слова к Божьему народу.
- issue: Образ Египта как плавильной печи
  choice: Сохранить метафору без пояснения в основном тексте
  alternative: Передать смысл описательно как «место тяжкого угнетения»
  rationale: Исходный текст использует сильный образ, а не прямое толкование; его значение уместно раскрыть в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для молитвы Соломона. Местоимения, относящиеся к Богу, написаны с прописной буквы. Формулировка сохраняет образность еврейского текста и остаётся понятной обычному читателю.
