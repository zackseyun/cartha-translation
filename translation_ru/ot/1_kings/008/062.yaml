translation:
  language: ru
  text: И царь, и весь Израиль вместе с ним приносили жертвы[a] перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жертвовали жертву» — глагол и существительное в еврейском тексте однокоренные; это сочетание подчёркивает совершение жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: И царь
  rationale: Союз ו продолжает повествование, а определённая форма существительного указывает на уже упомянутого царя — Соломона.
- source_word: וְכָל יִשְׂרָאֵל
  choice: и весь Израиль
  rationale: Сохранено собирательное национальное обозначение без пояснительной замены на «все израильтяне».
- source_word: עִמּוֹ
  choice: вместе с ним
  rationale: Естественно передаёт участие всего Израиля вместе с царём.
- source_word: זֹבְחִים זֶבַח
  choice: приносили жертвы
  rationale: Причастие передаёт продолжавшееся действие, а однокоренное сочетание глагола и существительного по-русски естественно выражается устойчивой формой «приносили жертвы»; буквальная структура отмечена в сноске.
- source_word: לִפְנֵי
  choice: пред
  rationale: Краткое и достойное соответствие пространственно-культовому выражению «перед, в присутствии».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יְהוָה; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Форма «пред Яхве» сохраняет достоинство культового контекста, а «приносили жертвы» звучит естественно и передаёт продолжающееся действие.
