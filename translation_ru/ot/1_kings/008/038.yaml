  source_fidelity: Основной смысл передан, включая два термина для молитвенного обращения, личное знание נֶגַע сердца и жест простирания рук к дому. Однако «у какого-либо человека / у всего ... народа» в этой конструкции по-русски неестественно и размывает вероятную субъектную связь לְ; «если каждый знает» без достаточной необходимости превращает относительное описание в условие.
  naturalness: '«Какова бы ни была ... у человека» звучит синтаксически тяжеловесно и семантически неясно: молитва или мольба обычно не бывает «у» человека. Более естественное пассивное «будут вознесены ...» передаёт подразумеваемое действие, как и английский audit trail, при этом альтернативное понимание «за» остаётся отмеченным в сноске. «Когда каждый знает» лучше соответствует относительной связи אֲשֶׁר, чем «если».'
  terminology: «Мольба» — современное литературное соответствие תְּחִנָּה и яснее, чем несколько книжное «моление». «Язва своего сердца» сохраняет сильный образ נֶגַע, но в современном контексте естественнее «язва в своём сердце»; сноска удерживает буквальную генитивную формулу и диапазон значений. «Дом» сохранён, а храмовый референт пояснён.
