  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: ru
  text: Какая бы молитва или мольба ни была вознесена каким-либо человеком[a] или всем Твоим народом Израилем, когда каждый знает язву в своём сердце[b] и простирает руки к этому дому[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский оборот можно также понять как «за какого-либо человека»; предлог допускает несколько оттенков. Подразумеваемое «вознесена ... человеком» передаёт наиболее вероятную связь в данном контексте.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «язву (или поражение) своего сердца»; выражение может обозначать личное бедствие или внутреннюю боль.'
    reason: lexical_alternative
  - marker: c
    text: То есть к храму, названному здесь «этим домом».
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: Какова бы ни была молитва, каково бы ни было моление
  rationale: Конструкция передаёт всеохватность כָּל и различает общее обозначение молитвы от более настойчивого прошения תְּחִנָּה, оставаясь естественной для современного русского языка.
- source_word: אֲשֶׁר תִהְיֶה
  choice: как... ни была / каково... ни было
  rationale: Глагол «быть» сохранён без добавления отсутствующего в еврейском тексте глагола «возносить»; уступительно-неопределённая русская конструкция передаёт любой возможный случай молитвы.
- source_word: לְכָל הָאָדָם
  choice: у какого-либо человека
  rationale: Предлог לְ допускает значение принадлежности или отношения. Оборот «у человека» сохраняет эту широту лучше, чем однозначное «вознесённая человеком» или «за человека».
- source_word: לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: у всего Твоего народа Израиля
  rationale: Сохранён параллелизм с предыдущим оборотом и традиционное заветное наименование народа; прописная буква в местоимении выражает почтительное обращение к Богу.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: если каждый знает
  rationale: 'אִישׁ имеет распределительное значение внутри названной совокупности: речь идёт о каждом отдельном молящемся. «Если» естественно связывает условие с продолжающимся в следующем стихе обращением.'
- source_word: נֶגַע לְבָבוֹ
  choice: язву своего сердца
  rationale: '«Язва» сохраняет сильный и намеренно неоднозначный образ נֶגַע: личное поражение, бедствие или внутренняя боль. Не уточняется, идёт ли речь исключительно о страдании, совести или грехе.'
- source_word: וּפָרַשׂ כַּפָּיו
  choice: и простирает руки
  rationale: Устойчивое и понятное русское выражение передаёт жест молитвы; «руки» естественнее буквального «ладони».
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: к этому дому
  rationale: Сохранено исходное «дом», а направление אֶל передано предлогом «к». В контексте домом является храм.
theological_decisions:
- issue: Неоднозначность לְ при указании молящегося или того, о ком молятся
  choice: у какого-либо человека / у всего Твоего народа
  alternative: вознесённая каким-либо человеком / за какого-либо человека
  rationale: Еврейская конструкция может обозначать принадлежность, отношение, субъекта или заинтересованное лицо. Нейтральное «у» не устраняет эту подлинную неоднозначность.
- issue: Смысл выражения נֶגַע לְבָבוֹ
  choice: язву своего сердца
  alternative: беду своего сердца / поражение своего сердца
  rationale: 'Буквальный образ оставлен открытым: он может указывать на осознаваемое человеком личное бедствие или внутреннее поражение. Перевод не сводит его к одной богословской категории.'
- issue: Передача הַבַּיִת
  choice: дом
  alternative: храм
  rationale: Хотя речь идёт о храме, сохранено прямое значение еврейского слова и его богословский образ дома Господа; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис оставляет стих незавершённым, поскольку его условная конструкция продолжается повелением в 1 Царств 8:39. Слова «моление», «язва» и «простирает руки» сохраняют достоинство и образность оригинала без архаической перегруженности.
