revisions:
- from: Какова бы ни была молитва, каково бы ни было моление у какого-либо человека[a] или у всего Твоего народа Израиля, если каждый знает язву своего сердца[b] и простирает руки к этому дому[c],
  to: Какая бы молитва или мольба ни была вознесена каким-либо человеком[a] или всем Твоим народом Израилем, когда каждый знает язву в своём сердце[b] и простирает руки к этому дому[c],
  rationale: Исправлен неестественный русский оборот с «у» и сохранена исходная неоднозначность предлога в сноске. Добавленное «вознесена» — допустимое контекстное восполнение для молитвы, соответствующее синтаксическому смыслу и английскому audit trail. Относительная связь передана через «когда», а якоря сносок поставлены у соответствующих слов в последовательном порядке. Стих намеренно оставлен незавершённым, поскольку синтаксис продолжается в следующем стихе.
  reviewer_model: gpt-5.6-terra
