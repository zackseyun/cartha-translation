base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: ru
  text: Но разве Бог действительно будет обитать на земле? Вот, небеса, даже небеса небес[a], не могут вместить Тебя[b]; тем более не может вместить Тебя этот дом[c], который я построил!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небеса и небеса небес»; это выражение указывает на высочайшие небеса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не могут удержать Тебя».'
    reason: lexical_alternative
  - marker: c
    text: Под «этим домом» подразумевается храм, построенный Соломоном.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: Но действительно ли
  rationale: Сочетание вводит риторический вопрос с оттенком изумления; «но» естественно передаёт поворот от мысли о храме к Божьей необъятности, а «действительно ли» сохраняет эмфазу.
- source_word: יֵשֵׁב
  choice: будет обитать
  rationale: В контексте Божьего присутствия и храма глагол означает пребывание или обитание, а не буквальное сидение.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Прямо передаёт пространственное противопоставление земли небесам.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию и звучит естественно в возвышенной современной русской речи.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: небеса и небеса небес
  rationale: Формально сохраняет древнееврейское усилительное выражение, не устраняя его образность; смысл пояснён в сноске.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: не могут вместить Тебя
  rationale: Передаёт неспособность всего сотворённого пространства охватить или заключить Бога.
- source_word: אַף כִּי
  choice: тем менее
  rationale: 'Передаёт аргумент от большего к меньшему: если даже небеса не вмещают Бога, то тем более не вмещает построенный храм.'
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי
  choice: этот дом, который я построил
  rationale: Сохраняет исходное «дом» как принятое обозначение храма и завершённость действия Соломона.
theological_decisions:
- issue: Божья трансцендентность и присутствие в храме
  choice: Сохранён риторический вопрос об обитании Бога на земле и утверждение, что даже небеса не могут Его вместить.
  alternative: Передать стих как прямое отрицание Божьего пребывания на земле либо как утверждение, будто храм буквально заключает Бога в себе.
  rationale: Контекст одновременно говорит о реальном Божьем присутствии и о том, что никакое сотворённое место Его не ограничивает; перевод не снимает это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимение «Тебя» написано с прописной буквы как уважительная традиция русского библейского стиля; синтаксис остаётся ясным для современного читателя.
