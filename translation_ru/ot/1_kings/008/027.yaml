  rationale: Перевод исправлен для естественного русского выражения риторического вопроса и особенно для точной передачи вывода «тем более» в отрицательной конструкции. Добавленное «даже» эксплицирует усилительное значение древнееврейского выражения «небеса небес», при этом буквальная форма сохранена в сноске. Смысл о Божьем пребывании и трансцендентности не сглажен.
