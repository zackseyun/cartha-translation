base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: ru
  text: Давид, мой отец, задумал построить дом во имя Яхве[a], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построить храм во имя Яхве». Буквально по-еврейски: «построить дом».'
    reason: 'Лексическая альтернатива: «храм» прямо называет подразумеваемое святилище, тогда как основной текст сохраняет буквальное «дом».'
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма продолжает повествование и вводит состояние или намерение; «И было» сохраняет связь с контекстом без добавления отсутствующего в еврейском слова «теперь».
- source_word: עִם לְבַב
  choice: на сердце у
  rationale: Еврейская идиома обозначает намерение, находящееся в сердце человека. Русское «было на сердце у» сохраняет образ и звучит естественно в возвышенном повествовании.
- source_word: דָּוִד אָבִי
  choice: Давида, отца моего
  rationale: Сохраняет порядок еврейского текста, а приложение с запятыми обеспечивает ясность на русском языке.
- source_word: לִבְנוֹת
  choice: построить
  rationale: Обычный и точный русский эквивалент глагола בנה в контексте строительства святилища.
- source_word: בַּיִת
  choice: дом
  rationale: Еврейский текст буквально говорит «дом». Этот выбор сохраняет значимый образ храма как дома Бога, не заменяя его истолковывающим словом «храм».
- source_word: לְשֵׁם
  choice: во имя
  rationale: Русское устойчивое выражение «во имя» естественно передаёт посвящение дома имени Яхве и сохраняет богословски значимое упоминание имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Естественная русская передача сопряжённой конструкции, поясняющей, кому принадлежит имя Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача בַּיִת в храмовом контексте
  choice: дом
  alternative: храм
  rationale: Слово «дом» непосредственно соответствует еврейскому тексту и сохраняет образную и богословскую напряжённость; «храм» яснее обозначает референт, но уже истолковывает его.
- issue: Передача לְשֵׁם
  choice: во имя
  alternative: для имени
  rationale: «Во имя» — естественное современное русское выражение посвящения, тогда как «для имени» формальнее воспроизводит структуру оригинала, но звучит менее естественно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «Давида, отца моего» сохраняет достоинство и порядок исходного текста; идиома «было на сердце» удерживает древнееврейский образ, оставаясь понятной современному читателю.
