source:
  edition: WLC
  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: ru
  text: Ведь Ты отделил их для Себя в наследие от всех народов земли, как Ты сказал через Моисея[a], Твоего слугу, когда Ты вывел наших отцов[b] из Египта, Владыка Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наших предков».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте: «Адонай Яхве»; традиционно: «Господь Бог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: отделил их
  rationale: Порода hифиль глагола בדל означает отделение или обособление. «Отделил их» естественно передаёт действие Бога, не добавляя прямо не выраженного оттенка освящения.
- source_word: לְךָ לְנַחֲלָה
  choice: для Себя в наследие
  rationale: Сочетание выражает принадлежность Богу и назначение Израиля быть Его наследием или особым владением; перевод сохраняет метафору наследия.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: от всех народов земли
  rationale: Предлог מן выражает отделение от остальных народов, а הָאָרֶץ здесь имеет всеобщий, а не только местный смысл.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: как и говорил
  rationale: Передаёт соответствие Божьего действия Его прежнему слову; частица «и» делает эту связь естественной по-русски.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея» — древнееврейский оборот, обозначающий посредничество; функционально естественный русский эквивалент — «через Моисея».
- source_word: עַבְדֶּךָ
  choice: Твоего слугу
  rationale: 'В почётном обозначении Моисея עבד лучше передать словом «слуга», а не «раб»: в данном контексте на первом плане верное служение Богу.'
- source_word: בְּהוֹצִיאֲךָ
  choice: когда выводил
  rationale: Инфинитивная конструкция с בְּ имеет временное значение. Несовершенный вид по-русски естественно изображает обстоятельство исхода, на фоне которого Бог говорил.
- source_word: אֶת אֲבֹתֵינוּ
  choice: наших отцов
  rationale: Сохраняет буквально выраженное мужское обозначение предшествующего поколения; по смыслу возможно более общее «наших предков».
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Обычная и точная русская форма исходной формулы, передающая движение из страны.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי и позволяет без тавтологии сохранить личное имя יהוה в форме «Яхве».
theological_decisions:
- issue: Передача принадлежности Израиля Богу в выражении לְךָ לְנַחֲלָה
  choice: для Себя в наследие
  alternative: как Своё достояние
  rationale: Выбранный вариант сохраняет библейскую метафору наследия и не сводит её лишь к владению; при этом не уточняется сверх текста характер этой принадлежности.
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: 'Так сохраняются оба разных элемента исходного текста: титул אֲדֹנָי и личное имя יהוה. Традиционный вариант «Господь Бог» понятен, но заменяет имя нарицательным обозначением.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сохраняет единую цепь мысли оригинала, а древнееврейский оборот «рукой Моисея» раскрыт естественным выражением «через Моисея».
