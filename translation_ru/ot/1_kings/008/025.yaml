  source_fidelity: 'Смысл обещания и его условный характер в целом переданы верно. Однако «мужчина» для אִישׁ в династическом контексте неестественно и затемняет подразумеваемого преемника; оборот «не переведётся у тебя предо Мной мужчина» синтаксически тяжёл и не передаёт ясно связь с престолом. В сноске следует исправить форму еврейского глагола: в тексте стоит יִכָּרֵת, а не נִכְרַת.'
