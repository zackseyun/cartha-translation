  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: ru
  text: 'И теперь, Яхве, Бог Израиля, исполни для раба Твоего Давида, моего отца, то, что Ты сказал ему: «Не переведётся у тебя предо Мной потомок, сидящий на престоле Израиля, если только сыновья твои будут хранить свой путь, ходя предо Мной, как ты ходил предо Мной».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не будет отсечён у тебя предо Мной человек, сидящий на престоле Израиля». Смысл выражения: у Давида не переведётся потомок, занимающий израильский престол.'
    reason: Сноска сохраняет буквальный образ יִכָּרֵת («будет отсечён») и поясняет династический смысл, тогда как основной текст передаёт его естественным русским оборотом.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שְׁמֹר
  choice: исполни
  rationale: Когда объектом служит ранее данное слово-обещание, глагол означает сохранить верность сказанному, то есть исполнить его; буквальное «сохрани» по-русски здесь менее естественно.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: для раба Твоего Давида, отца моего
  rationale: «Раб» сохраняет обычное библейское обозначение смиренного и заветного отношения царя к Богу; порядок слов близок к еврейскому и понятен по-русски.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: то, что Ты сказал ему
  rationale: Сохраняет нейтральное значение דִּבֶּר и не вводит слово «обещал», хотя содержание речи является обещанием.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: не переведётся у тебя предо Мной мужчина
  rationale: Русский идиом «не переведётся» естественно передаёт отрицательную форму נִכְרַת в значении непрерывности рода; «у тебя» сохраняет לְךָ, а «мужчина» — אִישׁ.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: сидящий на престоле Израиля
  rationale: Передаёт причастную форму יֹשֵׁב и определяет династического преемника.
- source_word: רַק אִם
  choice: если только
  rationale: Явно сохраняет сильное условие, выраженное сочетанием רַק אִם.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: сыновья твои будут хранить свой путь
  rationale: Сохраняет образ внимательного хранения своего пути, то есть поведения, не сводя его сразу к отвлечённому «правильно жить».
- source_word: לָלֶכֶת לְפָנַי
  choice: ходя предо Мной
  rationale: Деепричастный оборот естественно выражает способ, которым сыновья должны хранить свой путь.
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: как ты ходил предо Мной
  rationale: Сохраняет повтор ключевого образа «ходить пред Богом» и обращение к Давиду внутри цитаты.
theological_decisions:
- issue: Условность обещания о продолжении династии Давида
  choice: 'Сохранено прямое условие: «если только сыновья твои…»'
  alternative: Понимать обещание как безусловное, а условие — лишь как относящееся к полноте его переживания или к отдельным царям.
  rationale: В данном стихе רַק אִם непосредственно вводит условие, связанное с поведением потомков. Перевод не согласовывает это напряжение искусственно с другими формулировками обещания Давиду.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «Твоего», «Ты», «предо Мной» поддерживают молитвенный регистр; синтаксис остаётся ясным для обычного читателя. Маркер сноски поставлен после цитаты, к которой относится пояснение.
