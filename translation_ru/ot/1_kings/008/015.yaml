base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: ru
  text: 'И он сказал: «Благословен[a] Яхве, Бог Израиля, который Своими устами сказал Давиду, моему отцу, и Своей рукой исполнил сказанное:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет прославлен Яхве». Еврейская формула благословения традиционно передаётся словом «благословен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Сохраняет традиционную форму еврейского благословения и форму страдательного причастия, не сводя выражение только к призыву хвалить.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная русская передача стандартной сопряжённой конструкции.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: который Своими устами говорил
  rationale: Сохраняет выраженный в еврейском тексте телесный образ и параллель «устами — рукой».
- source_word: אֵת דָּוִד אָבִי
  choice: Давиду, отцу моему
  rationale: При глаголе דבר частица אֵת обозначает адресата речи; дательный падеж естественен по-русски.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: и Своей рукой исполнил сказанное
  rationale: Сохраняет образ руки как действия и делает понятным подразумеваемое дополнение — то, что Бог прежде сказал.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит в русском языке прямую речь, продолжающуюся в следующем стихе, и выполняет функцию еврейского quotative לֵאמֹר без тяжеловесного повторения «сказав».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Соотношение Божьего слова и действия
  choice: Своими устами говорил… Своей рукой исполнил
  alternative: обещал… исполнил
  rationale: Сохранён образный параллелизм оригинала, подчёркивающий соответствие сказанного и совершённого, без сужения значения глагола דבר до «обещал».
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Двоеточие сохраняет переход к прямой речи следующего стиха.
