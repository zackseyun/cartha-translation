  text: כִּ֤י הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם אֶל מְק֖וֹם הָֽ/אָר֑וֹן וַ/יָּסֹ֧כּוּ הַ/כְּרֻבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: ru
  text: Ведь херувимы простирали крылья над местом ковчега[a] и сверху осеняли ковчег и его шесты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по направлению к месту ковчега». Еврейский предлог обычно обозначает направление, однако контекст позволяет понимать его как указание на то, что крылья простирались над местом ковчега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предыдущему утверждению; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: הַכְּרוּבִים
  choice: херувимы
  rationale: Традиционный и точный русский термин для храмового контекста.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: простирали крылья
  rationale: Причастие описывает устойчивое положение распростёртых крыльев; несовершенный вид сохраняет длительно-описательный оттенок без неестественной конструкции.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: над местом ковчега
  rationale: Хотя אֶל обычно имеет направительное значение «к/по направлению к», пространственный контекст и следующая фраза о покрытии поддерживают значение расположения крыльев над местом ковчега; неоднозначность отмечена в сноске.
- source_word: וַיָּסֹכּוּ
  choice: осеняли
  rationale: Глагол סכך выражает покрытие или укрытие сверху; «осеняли» точно передаёт образ распростёртых над ковчегом крыльев и сохраняет возвышенный, но понятный регистр.
- source_word: עַל הָאָרוֹן
  choice: ковчег
  rationale: Пространственное отношение передано глаголом «осеняли» и наречием «сверху», поэтому отдельное «над» здесь излишне.
- source_word: בַּדָּיו
  choice: его шесты
  rationale: Имеются в виду длинные шесты для переноски ковчега; «шесты» — ясное современное обозначение без архаизма «древки».
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: Передаёт расположение и направление укрывающего действия над ковчегом и шестами.
