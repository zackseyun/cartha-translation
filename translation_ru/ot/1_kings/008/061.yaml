base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: ru
  text: Пусть же ваше сердце будет всецело предано Яхве, нашему Богу[a], чтобы ходить по Его установлениям и соблюдать Его заповеди, как в этот день[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет нераздельно предано Яхве, нашему Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как в этот день»; выражение соотносит требуемую преданность с нынешним днём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Пусть же ... будет
  rationale: В данном контексте форма выражает побуждение; «пусть будет» естественно передаёт наставительный смысл, а «же» связывает призыв с предшествующей речью Соломона.
- source_word: לְבַבְכֶם
  choice: ваше сердце
  rationale: «Сердце» сохраняет библейский образ внутреннего человека — его воли, помыслов и преданности; единственное число отражает собирательную форму оригинала.
- source_word: שָׁלֵם
  choice: всецело
  rationale: В контексте завета слово обозначает полноту и нераздельность верности, не утверждая безгрешного совершенства.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: с Яхве, нашим Богом
  rationale: Предлог עִם буквально означает «с» и сохраняет образ близости и заветных отношений; личное имя יהוה передано как «Яхве».
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: следовать Его установлениям
  rationale: Буквально выражение означает «ходить в Его установлениях», то есть жить сообразно им. По-русски «следовать установлениям» естественно передаёт смысл, не утрачивая идеи постоянного образа жизни.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: и соблюдать Его заповеди
  rationale: В правовом и заветном контексте שׁמר означает хранить и исполнять; устойчивое русское сочетание — «соблюдать заповеди».
- source_word: כַּיּוֹם הַזֶּה
  choice: как в этот день
  rationale: Формулировка близка к еврейской идиоме и указывает на нынешний день как на явленный образец или свидетельство такой преданности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал содержит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл שָׁלֵם в отношении сердца
  choice: всецело с Яхве
  alternative: нераздельно предано Яхве; совершенно перед Яхве
  rationale: Выбранная передача выражает полноту заветной верности, не истолковывая стих как утверждение нравственной безгрешности.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранены личное имя «Яхве», собирательное «ваше сердце» и смысл полной, нераздельной верности; буквальная метафора «ходить в установлениях» передана естественным русским выражением «следовать установлениям».
