  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: ru
  text: 'и если в земле, куда их увели в плен, они придут в себя, обратятся и будут умолять Тебя в земле тех, кто пленил их, говоря: «Мы согрешили, поступали превратно, творили зло»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: они примут это к сердцу
  rationale: 'Буквально: «возвратят к своему сердцу»; еврейская идиома означает осознать случившееся, глубоко задуматься и внутренне принять его к сердцу.'
- source_word: וְשָׁבוּ
  choice: обратятся
  rationale: Глагол שׁוב передаёт возвращение или обращение. «Обратятся» естественно в контексте возвращения к Богу и не сводит смысл только к эмоциональному раскаянию.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: станут молить Тебя
  rationale: Форма от חנן означает настойчиво просить милости; «молить» сохраняет направленность просьбы к Богу и её смиренный характер.
- source_word: וְהֶעֱוִינוּ
  choice: поступали превратно
  rationale: Глагол עוה обозначает извращённое, неправое поведение; выбранная формулировка отличает его от предшествующего «согрешили» и последующего «творили зло».
- source_word: רָשָׁעְנוּ
  choice: творили зло
  rationale: Передаёт признание виновного, нечестивого поведения естественным современным русским выражением.
theological_decisions:
- issue: Значение וְשָׁבוּ в последовательности признания и молитвы
  choice: обратятся
  alternative: раскаются
  rationale: Исходный глагол прежде всего означает «вернуться, обратиться». Перевод «обратятся» сохраняет его образ и не заменяет его более узким богословским термином «раскаются».
- issue: Тройное признание вины
  choice: «Мы согрешили, поступали превратно, творили зло»
  alternative: свести к общему «мы тяжко согрешили»
  rationale: Сохранены три разных еврейских глагола и риторическое нарастание признания без искусственного выравнивания их значений.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимение «Тебя» написано с прописной буквы как обращение к Богу. Синтаксис сохранён как продолжение условной конструкции соседних стихов; завершающая запятая указывает на продолжение предложения.
