  source_fidelity: Смысл условного признания и молитвы передан верно. Однако «станут молить» добавляет начинательное значение, отсутствующее в форме וְהִתְחַנְּנוּ; нейтральное «будут умолять» точнее. Идиома וְהֵשִׁיבוּ אֶל־לִבָּם естественно передаётся как «придут в себя».
  naturalness: «В земле пленивших их» грамматически возможно, но тяжеловесно и менее естественно для современного литературного русского, чем «в земле тех, кто пленил их». «Придут в себя» в данном контексте ясно означает осознание и возвращение к здравому суждению.
  terminology: '«Обратятся» удачно сохраняет широкий смысл שׁוב, не сужая его до одного лишь раскаяния. Три признания вины сохранены раздельно: «согрешили, поступали превратно, творили зло». Обращение «Тебя» с прописной буквы соответствует выбранному молитвенному регистру.'
