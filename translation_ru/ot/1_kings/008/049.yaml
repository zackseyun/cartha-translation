  text: וְ/שָׁמַעְתָּ֤ הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתְּ/ךָ֔ אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
translation:
  language: ru
  text: тогда услышь на небесах[a], в месте Твоего обитания, их молитву и мольбу и защити их дело[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с небес». В еврейском тексте предлог не выражен; далее небеса названы местом Божьего обитания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «даруй им правосудие» или «вступись за них». Буквально: «соверши их суд» — то есть справедливо рассуди и поддержи их дело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: тогда услышь
  rationale: Перфект 2-го лица мужского рода единственного числа в последовательности прошений передаёт обращённую к Богу просьбу. Союз וְ по связи с предшествующим условием естественно передан словом «тогда».
- source_word: הַשָּׁמַיִם
  choice: на небесах
  rationale: Форма буквально означает «небеса», но здесь употреблена обстоятельственно и обозначает небесную сферу, где пребывает Бог. Предлог в еврейском тексте прямо не выражен, поэтому возможна также передача «с небес».
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: в месте Твоего обитания
  rationale: מָכוֹן обозначает установленное, прочное место; сочетание называет небеса местом Божьего пребывания. Русская формулировка сохраняет образ и звучит естественно.
- source_word: תְּפִלָּתָם וְאֶת תְּחִנָּתָם
  choice: их молитву и мольбу
  rationale: «Молитва» передаёт общее значение תְּפִלָּה, а «мольба» сохраняет оттенок настойчивой просьбы о милости в תְּחִנָּה.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: и защити их дело
  rationale: Буквально «соверши их суд/правосудие» — судебная идиома, означающая вступиться за чьё-либо дело и обеспечить справедливое решение. Выбранная формулировка сохраняет юридический образ и остаётся понятной.
theological_decisions:
- issue: Образ Бога, слышащего на небесах, в месте Своего обитания
  choice: 'Сохранить пространственный образ: «услышь на небесах, в месте Твоего обитания»'
  alternative: «услышь с небес, из места Твоего обитания»
  rationale: Текст молитвы говорит о небесном обитании Бога языком библейского образа. Перевод не превращает этот образ ни в отвлечённое утверждение, ни в учение о пространственной ограниченности Бога.
- issue: Судебный смысл выражения מִשְׁפָּטָם
  choice: «защити их дело»
  alternative: «даруй им правосудие»; «оправдай их»
  rationale: Фраза требует Божьего справедливого вмешательства в их дело, но не обязательно заранее утверждает их невиновность; поэтому перевод не снимает напряжения между защитой дела и справедливым судом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Слова «мольба» и «защити их дело» понятны широкому читателю, при этом сохраняют различие между двумя видами прошения и судебный оттенок заключительной идиомы.
