  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: ru
  text: И священники не могли стоять для служения[a] из-за облака, потому что слава Яхве наполнила дом Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могли стоять, чтобы служить».'
    reason: lexical_alternative
  - marker: b
    text: То есть храм.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: не могли
  rationale: Передаёт значение способности или возможности без добавочного толкования.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное и точное обозначение храмовых священнослужителей в данном контексте.
- source_word: לַעֲמֹד
  choice: стоять
  rationale: Сохраняет прямое значение инфинитива; контекст допускает смысл «оставаться на своём месте», но не требует вводить его в основной текст.
- source_word: לְשָׁרֵת
  choice: совершать служение
  rationale: Естественно для современного русского языка и передаёт официальное священническое служение, а не служение вообще.
- source_word: מִפְּנֵי הֶעָנָן
  choice: из-за облака
  rationale: Идиоматически передаёт причинное значение сочетания с מִפְּנֵי.
- source_word: כִּי
  choice: потому что
  rationale: Ясно выражает пояснительно-причинную связь со словами о неспособности священников служить.
- source_word: מָלֵא
  choice: наполнила
  rationale: Совершенный вид естественно передаёт завершённое действие, объясняющее сложившееся положение.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сохраняет образ явленной Божьей славы и не заменяет его толкованием вроде «присутствие».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ еврейского текста; в сноске уточняется, что речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Значение выражения כְבוֹד יְהוָה
  choice: слава Яхве
  alternative: присутствие Яхве
  rationale: «Слава» сохраняет исходный богословский образ и его смысловую насыщенность, не сводя его к одному толкованию.
- issue: Передача בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Буквальное «дом» сохраняет образность оригинала, а исторический референт уточняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис остаётся ясным для обычного читателя; образ «дом Яхве» и повторение имени сохранены вслед за еврейским текстом.
