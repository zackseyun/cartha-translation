revisions:
- from: Тогда царь Соломон созвал к себе в Иерусалим старейшин Израиля, всех глав колен и предводителей родовых домов сынов Израиля[a], чтобы поднять ковчег завета Яхве из Города Давида, то есть с Сиона.
  to: Тогда царь Соломон созвал в Иерусалим к царю Соломону старейшин Израиля, всех глав колен и предводителей родовых домов сынов Израиля[a], чтобы поднять ковчег завета Яхве из города Давида, то есть Сиона.
  rationale: Исправлена конструкция при «Сионе», чтобы сохранить в русском тексте отождествление города Давида с Сионом, а не представить Сион лишь как альтернативный исходный пункт. Повторное обозначение «к царю Соломону» восстановлено по оригиналу. Написание «город Давида» приведено к русской орфографической норме. Сноска сохранена на том же словосочетании и продолжает пояснять буквальное «сынов Израиля».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:28:09Z'
review_pass:
  verdict: revise
  source_fidelity: Состав участников, цель собрания и направление перенесения ковчега переданы в целом точно. Однако «из Города Давида, то есть с Сиона» грамматически превращает Сион в исходный пункт, а не сохраняет пояснительное отождествление «город Давида, то есть Сион».
  naturalness: Текст в основном соответствует современному литературному русскому. «К себе в Иерусалим» возможно, но явное «к царю Соломону» точнее воспроизводит повторное обозначение адресата в оригинале и не создаёт рефлексивного оттенка, отсутствующего в еврейском тексте.
  terminology: «Яхве», «ковчег завета», «старейшины», «главы колен» и «родовые дома сынов Израиля» приемлемы. Нарицательное обозначение «город Давида» следует писать со строчной буквы; это не собственное имя в данной конструкции.
  issues:
  - severity: medium
    issue: Нарушено пояснительное отождествление «город Давида, то есть Сион».
    rationale: 'Форма «из Города Давида, то есть с Сиона» синтаксически делает оба существительных зависимыми от предлога «из/с», тогда как הִיא צִיּוֹן является именной идентификацией города. Нужно: «из города Давида, то есть Сиона».'
  - severity: low
    issue: «К себе» интерпретирует и сглаживает повторное именование царя.
    rationale: 'Еврейский текст прямо называет адресата: «к царю Соломону в Иерусалим». Сохранение этого обозначения повышает формальную точность и остаётся естественным по-русски.'
  - severity: low
    issue: Необоснованная прописная буква в «Города Давида».
    rationale: В русском переводе это описательное географическое обозначение, а не единое собственное имя; нормативно «город Давида».
