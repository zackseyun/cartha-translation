  variant: modern literary Russian
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: ru
  text: Тогда царь Соломон созвал в Иерусалим к царю Соломону старейшин Израиля, всех глав колен и предводителей родовых домов сынов Израиля[a], чтобы поднять ковчег завета Яхве из города Давида, то есть Сиона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля»; это семейно-национальное выражение обозначает израильский народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной повествовательный переход к следующему событию.
- source_word: יַקְהֵל
  choice: созвал
  rationale: Каузативная форма глагола קהל означает «собрать, созвать»; «созвал» естественно звучит в контексте официального царского собрания.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшин Израиля
  rationale: Точный и устоявшийся русский эквивалент обозначения признанных общественных руководителей.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: всех глав колен
  rationale: מַטּוֹת здесь обозначает племенные подразделения Израиля, то есть колена, а не буквальные посохи.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: предводителей родовых домов
  rationale: Передаёт признанное руководство и родовую организацию; выражение «родовые дома» понятно современному читателю и сохраняет социальную структуру оригинала.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет буквальный семейно-национальный образ древнееврейского выражения; его собирательное значение пояснено в сноске.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה יְרוּשָׁלִָם
  choice: к себе в Иерусалим
  rationale: В контексте созыва אֶל указывает на прибытие к царю. Русское «к себе» естественно устраняет тяжеловесное повторение имени Соломона, а титул «царь» сохранён при первом упоминании.
- source_word: לְהַעֲלוֹת
  choice: чтобы поднять
  rationale: Сохраняет значение движения вверх при перенесении ковчега из Города Давида к храму.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Точно передаёт древнееврейскую сопряжённую конструкцию и личное имя Бога.
- source_word: מֵעִיר דָּוִד
  choice: из Города Давида
  rationale: Прямо передаёт географическое название; прописная буква показывает, что это устойчивое наименование места.
- source_word: הִיא צִיּוֹן
  choice: то есть с Сиона
  rationale: Ясно выражает отождествление Города Давида с Сионом, согласуя пояснение с русской конструкцией движения «из/с».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Семейно-национальное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Сохранён мужской семейный образ оригинала и его заветно-национальный оттенок; собирательный смысл разъяснён в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для русского читателя: повтор «Соломон… к царю Соломону» передан как «царь Соломон созвал к себе», без изменения участников или направления созыва.'
