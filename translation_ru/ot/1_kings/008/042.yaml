base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: ru
  text: ибо они услышат о Твоём великом имени[a], о Твоей могучей руке и простёртой мышце, и он придёт и помолится в сторону этого дома, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь множественное число («они услышат»), а далее — единственное («он придёт и помолится»): вероятно, речь переходит от иноземцев вообще к отдельному иноземцу как представителю этой группы.'
    reason: Смена грамматического числа в оригинале
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-причинную связь с просьбой о молитве иноземца в предыдущем стихе.
- source_word: יִשְׁמְעוּן
  choice: они услышат
  rationale: Будущее время и множественное число сохраняют обобщённое указание на иноземцев.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: о Твоём великом имени
  rationale: С глаголом «услышать» предлог «о» естественно передаёт известность имени; образ «имени» сохранён без сведения его только к славе или репутации.
- source_word: יָדְךָ הַחֲזָקָה
  choice: Твоей сильной руке
  rationale: Буквально и естественно сохраняет конкретный библейский образ Божьей силы.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: простёртой мышце
  rationale: Сохраняет традиционный возвышенный библейский образ действующей Божьей мощи; «мышца» в современном литературном русском допустима в данном сакральном контексте.
- source_word: וּבָא
  choice: и он придёт
  rationale: Сохраняет переход исходного текста от множественного числа к единственному — от иноземцев вообще к отдельному представителю.
- source_word: וְהִתְפַּלֵּל
  choice: и помолится
  rationale: Согласовано с предшествующим глаголом единственного числа и естественно звучит по-русски.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: обратившись к этому дому
  rationale: Передаёт направленность молитвы к храму, не создавая впечатления, будто речь обязательно идёт о молитве внутри здания.
theological_decisions:
- issue: Антропоморфный язык о Божьей силе
  choice: Сохранить буквальные образы «рука» и «мышца»
  alternative: 'Передать абстрактно: «сила» и «могущество»'
  rationale: Конкретные антропоморфные образы значимы для богословия и поэтики древнееврейского текста; абстрактная передача неоправданно сгладила бы их.
- issue: Переход от множественного числа к единственному
  choice: «они услышат… и он придёт»
  alternative: 'Согласовать всё во множественном числе: «они услышат… придут и помолятся»'
  rationale: Смена числа присутствует в исходном тексте и, вероятно, переводит внимание от иноземцев как группы к отдельному иноземцу; её не следует молча устранять.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской религиозно-издательской практике. Конечное тире сохраняет незавершённость синтаксиса, продолжающегося в следующем стихе.
