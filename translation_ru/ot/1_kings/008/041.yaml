base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: ru
  text: И также об иноземце[a], который не принадлежит к Твоему народу Израилю, но придёт из далёкой страны ради имени Твоего, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземце», «иностранце». Еврейское слово обозначает не израильтянина, а не просто путешественника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И также
  rationale: Сохраняет соединительную и добавочную силу выражения, связывая этот случай с предыдущими прошениями молитвы.
- source_word: אֶל הַנָּכְרִי
  choice: об иноземце
  rationale: В контексте молитвы אֶל вводит новый предмет прошения; «иноземец» ясно обозначает человека не из Израиля и звучит достойно в современном русском.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: который не из Твоего народа Израиля
  rationale: Передаёт принадлежность к народу и сохраняет заветное обозначение Израиля как Божьего народа.
- source_word: וּבָא
  choice: но придёт
  rationale: Будущее время естественно согласуется с продолжающимся условно-просительным контекстом; «но» передаёт лёгкое противопоставление между непринадлежностью к Израилю и приходом издалека.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: из далёкой земли
  rationale: Прямо и естественно передаёт устойчивое обозначение географической удалённости.
- source_word: לְמַעַן שְׁמֶךָ
  choice: ради имени Твоего
  rationale: Сохраняет библейское богословское значение имени как явленной славы и известности Бога, не сводя выражение к простой причине.
theological_decisions:
- issue: Заветное различие между Израилем и приходящим неевреем
  choice: иноземце, который не из Твоего народа Израиля
  alternative: чужеземце, который не принадлежит к Твоему народу Израилю
  rationale: Формулировка сохраняет явное различие между Израилем как Божьим народом и не израильтянином, не превращая его в чисто социальную категорию и не ослабляя открытость молитвы для приходящего ради Божьего имени.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Конечная запятая и тире сохраняют незавершённость синтаксиса, поскольку предложение продолжается в следующих стихах.
