base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: ru
  text: В восьмой день он отпустил народ. Они благословили царя и ушли к своим шатрам[a], радостные и с весёлым сердцем, благодаря всему добру, которое Яхве сделал для Давида, Своего слуги, и для Израиля, Своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домой»; буквально: «к своим шатрам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: В восьмой день
  rationale: Временное выражение передано прямо; уточнение «праздника» следует из контекста, но в самом стихе отсутствует.
- source_word: שִׁלַּח אֶת הָעָם
  choice: он отпустил народ
  rationale: Порода пиэль глагола שלח здесь означает позволить собравшимся уйти; «отпустил» естественно и точно передаёт смысл.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: Они благословили царя
  rationale: Сохранено основное значение ברך. Контекст может подразумевать также прощальное благопожелание, но не требует заменять «благословили» более узким толкованием.
- source_word: לְאָהֳלֵיהֶם
  choice: к своим шатрам
  rationale: Сохранён буквальный образ еврейского текста; идиоматический смысл «домой» указан в сноске.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: радуясь и ликуя сердцем
  rationale: Переданы активная радость и идиома внутреннего ликования с сохранением образа сердца; формула звучит естественно в современном литературном русском.
- source_word: עַל כָּל הַטּוֹבָה
  choice: о всём том добром
  rationale: Предлог עַל указывает на основание и предмет радости; формулировка охватывает благие дела и дарованные блага.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: לְדָוִד עַבְדּוֹ
  choice: для Давида, Своего слуги
  rationale: В царско-заветном контексте עבד естественно передаётся словом «слуга», без неуместных ассоциаций слова «раб».
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: и для Израиля, Своего народа
  rationale: Прямо сохранено заветное обозначение Израиля как народа Яхве.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл благословения царя
  choice: благословили царя
  alternative: пожелали царю благополучия на прощание
  rationale: Основное значение ברך сохранено, поскольку текст допускает как собственно благословение, так и связанное с уходом благопожелание; более узкое толкование не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественного русского без добавления контекстуального слова «праздника». Местоимение «Своего» написано с прописной буквы как уважительное указание на Бога.
