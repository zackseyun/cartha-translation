  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: ru
  text: И теперь, Боже Израиля, прошу, да утвердится Твоё слово, которое Ты сказал слуге Твоему Давиду, отцу моему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный союз и временное наречие, продолжая ход молитвы Соломона.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Боже Израиля
  rationale: Форма «Боже» естественно передаёт звательное обращение в современной литературной русской речи.
- source_word: יֵאָמֶן נָא
  choice: пусть же подтвердится
  rationale: «Пусть» передаёт желательность, частица «же» — просительный оттенок נָא, а «подтвердится» сохраняет залог и идею того, что сказанное Богом окажется твёрдым и истинным.
- source_word: דבריך
  choice: Твоё слово
  rationale: В еврейском тексте стоит форма множественного числа, однако в данном контексте она обозначает сказанное Богом как единое обетование; русское единственное число звучит естественно и согласуется с единственным числом еврейского глагола.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: которое Ты сказал
  rationale: Прямо передаёт относительное предложение и обычное значение глагола «говорить», не подменяя его более толковательным «обещал».
- source_word: לְעַבְדְּךָ
  choice: рабу Твоему
  rationale: В обращении к Богу слово עבד обозначает подчинённое и почётное положение Давида; традиционное русское «раб Твой» здесь уместно и понятно.
- source_word: דָּוִד אָבִי
  choice: Давиду, отцу моему
  rationale: Сохраняет еврейскую последовательность имени и приложения и при этом ясно звучит по-русски.
theological_decisions:
- issue: Характер просьбы о ранее сказанном Давиду
  choice: Молитва о том, чтобы Божье слово подтвердилось
  alternative: Молитва о том, чтобы Божье обещание исполнилось
  rationale: Выбранная формулировка сохраняет смысл твёрдости и истинности корня אמן, одновременно подразумевая исполнение, но не сводя значение только к нему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным строем. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический выбор; синтаксис остаётся ясным для обычного читателя.
