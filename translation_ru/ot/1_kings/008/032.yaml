  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: ru
  text: 'тогда услышь с небес[a], действуй и рассуди Твоих слуг: признай нечестивого виновным, обратив его путь на его же голову[b], а праведного оправдай[c], воздав ему по его праведности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышь на небесах». Еврейское выражение может указывать либо на место, где Бог слышит, либо на то, откуда Он слышит.'
    reason: lexical_alternative
  - marker: b
    text: «Обратить его путь на его же голову» — еврейский образ, означающий воздать человеку за его собственные поступки.
    reason: cultural_note
  - marker: c
    text: 'Или: «признай праведного правым (невиновным)» или «защити праведного».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: услышь на небесах
  rationale: Еврейская молитвенная формула буквально говорит «услышь небеса/небо»; форма «услышь на небесах» естественно передаёт небеса как место, где Бог слышит молитву, и сохраняет неоднозначность с возможным пониманием «услышь с небес».
- source_word: וְעָשִׂיתָ
  choice: и действуй
  rationale: Широкий глагол עשה означает «делать, действовать»; в контексте просьбы о судебном вмешательстве «действуй» по-русски естественнее неопределённого «сделай».
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Рассуди Твоих слуг
  rationale: Глагол שׁפט обозначает судебное разбирательство. «Рассуди» передаёт просьбу вынести решение между сторонами, не предрешая исхода.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: признай нечестивого виновным
  rationale: Каузативная форма רשע в юридическом контексте означает объявить виновным. Такая формулировка сохраняет и судебный смысл, и характеристику лица как нечестивого.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: обрати его путь на его же голову
  rationale: Сохранён образ еврейской идиомы, в которой «путь» означает поведение и его последствия возвращаются на голову самого человека; смысл поясняется в сноске.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: праведного признай правым
  rationale: Каузатив צדק здесь имеет судебное значение — признать правоту или невиновность. «Признай правым» образует ясную юридическую параллель с «признай… виновным».
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: воздай ему по его праведности
  rationale: Фраза выражает соответствующее праведности воздаяние. «Воздай» естественно передаёт действие в контексте суда, не уточняя сверх текста форму награды.
theological_decisions:
- issue: Судебный или преобразующий смысл глаголов רשע и צדק
  choice: 'Передать оба глагола как судебные решения: «признай… виновным» и «признай правым».'
  alternative: Передать их как «накажи нечестивого» и «вознагради праведного».
  rationale: Контекст — разбирательство под клятвой, а обе каузативные формы являются юридическими терминами. Выбранный перевод не привносит отсутствующую в стихе идею внутреннего нравственного преобразования.
- issue: Значение «праведности» в заключительной фразе
  choice: Сохранить «по его праведности».
  alternative: «По его правоте» или «за его праведность».
  rationale: Слово צְדָקָה допускает связь как с праведностью человека, так и с его правотой в данном деле. Буквально близкая формулировка сохраняет эту напряжённость, а сноска сообщает более узкое судебное прочтение.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Местоимение «Твоих» написано с прописной буквы как уместная в библейском издании форма почтительного обращения. Юридический параллелизм исходного текста сохранён без конфессионально обусловленного толкования.
