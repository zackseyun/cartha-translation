  naturalness: Следует устранить неестественное для современного русского «услышь на небесах» и сохранить связность ряда просьб в одном предложении. Оборот «обратив его путь на его же голову» намеренно сохраняет образ исходного текста и объяснён сноской.
  terminology: «Признай нечестивого виновным» и «оправдай праведного» точно передают юридическую противоположность הִרְשִׁיעַ / הִצְדִּיק. Сноску с альтернативой к «оправдай» следует поставить непосредственно при этом слове, а не при заключительном «праведности».
