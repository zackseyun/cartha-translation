base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: ru
  text: Царь Соломон и всё собрание Израиля, собравшееся к нему[a], находились вместе с ним перед ковчегом и приносили в жертву овец и крупный скот, которых из-за их великого множества невозможно было ни исчислить, ни сосчитать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собравшееся перед ним». Еврейское выражение может указывать на собрание народа в связи с Соломоном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: собрание Израиля
  rationale: «Собрание» естественно обозначает собравшийся народ как единое целое и не привносит позднейших церковных ассоциаций.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: созванное к нему
  rationale: Нифаль причастия יעד указывает на созванных или собравшихся в связи с Соломоном; «к нему» сохраняет направленность עָלָיו. Согласование в единственном числе соответствует собирательному слову «собрание».
- source_word: אִתּוֹ
  choice: находились вместе с ним
  rationale: В еврейском предложении связка подразумевается; русское сказуемое делает отношение ясным, не добавляя нового содержания.
- source_word: לִפְנֵי הָאָרוֹן
  choice: перед ковчегом
  rationale: Это точная и устоявшаяся передача пространственного выражения без расширения до «ковчега завета».
- source_word: מְזַבְּחִים
  choice: приносили в жертву
  rationale: Причастие обозначает продолжающееся жертвенное действие; данная формулировка ясна и естественна по-русски.
- source_word: צֹאן וּבָקָר
  choice: овец и крупный скот
  rationale: צֹאן охватывает мелкий скот, но в данном жертвенном контексте краткое «овец» понятно; בָּקָר точно передано как «крупный скот».
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: которых невозможно было ни исчислить, ни сосчитать
  rationale: Сохранены оба близких по значению глагола и усилительная парная конструкция оригинала.
- source_word: מֵרֹב
  choice: из-за великого множества
  rationale: Передаёт причинное значение предлога и подчёркнутое указание на многочисленность животных.
theological_decisions:
- issue: Наименование ковчега
  choice: ковчег
  alternative: ковчег завета
  rationale: В этом стихе стоит только הָאָרוֹן, поэтому уточнение «завета» не добавляется из более широкого контекста.
- issue: Отношение собрания к Соломону в הַנּוֹעָדִים עָלָיו
  choice: созванное к нему
  alternative: собравшееся перед ним
  rationale: Формулировка сохраняет направленность и связь собрания с царём, не разрешая чрезмерно жёстко допустимый смысл предлога עַל.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксическая протяжённость оригинала сохранена без архаизмов; риторическая пара «ни исчислить, ни сосчитать» передаёт полноту еврейского выражения.
