  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: ru
  text: чтобы они боялись Тебя[a] во все дни, пока живут[b] на земле[c], которую Ты дал нашим отцам[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговели перед Тобой». Здесь страх включает благоговение и почитание Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё время, пока они живут». Буквально: «во все дни, когда они живут».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на лице земли». По контексту имеется в виду прежде всего земля, данная Израилю, хотя еврейское слово может также обозначать землю вообще или почву.'
    reason: lexical_ambiguity
  - marker: d
    text: 'Или: «нашим предкам». Буквально: «нашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза в молитве Соломона естественным современным русским языком.
- source_word: יִרָאוּךָ
  choice: они боялись Тебя
  rationale: Глагол ירא применительно к Богу охватывает страх, благоговение и почитание. «Боялись Тебя» сохраняет весомую библейскую формулировку, не сводя её лишь к уважению.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Сохраняет образ и полноту времени в еврейском выражении, оставаясь понятным по-русски.
- source_word: אֲשֶׁר הֵם חַיִּים
  choice: пока живут
  rationale: 'Естественно передаёт относительную конструкцию, определяющую продолжительность: во все дни их жизни.'
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на земле
  rationale: Русское выражение естественно передаёт еврейскую идиому «на лице земли». Последующее уточнение о даре отцам указывает здесь прежде всего на данную Израилю землю.
- source_word: אֲשֶׁר נָתַתָּה
  choice: которую Ты дал
  rationale: Простое прошедшее время ясно передаёт совершившийся дар земли.
- source_word: לַאֲבֹתֵינוּ
  choice: нашим отцам
  rationale: Буквально сохраняет родственное и заветное обозначение предшествующих поколений; более общее «предкам» дано как допустимый вариант.
theological_decisions:
- issue: Значение ירא по отношению к Богу
  choice: боялись Тебя
  alternative: благоговели перед Тобой
  rationale: Выбранный вариант сохраняет библейское понятие страха перед Богом вместе с присущими ему благоговением и почитанием, не смягчая напряжение исходного слова.
- issue: Объём значения הָאֲדָמָה
  choice: земле
  alternative: земле вообще; стране
  rationale: Само слово допускает значения «земля», «почва», а иногда «страна», но определительное предложение «которую Ты дал нашим отцам» направляет смысл к дарованной Израилю земле, не устраняя полностью лексическую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены библейские выражения «боялись Тебя» и «во все дни», но громоздкая еврейская относительная конструкция естественно передана словами «пока живут».
