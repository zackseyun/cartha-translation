  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: ru
  text: Услышь мольбу Твоего слуги и Твоего народа Израиля, когда они будут молиться в сторону этого места[a]. Ты же услышь на небесах, в месте Твоего обитания[b]; услышь и прости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к этому месту». Еврейское выражение можно передать более буквально; «в сторону этого места» уточняет направленность молитвы к храму.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на небесах, где Ты обитаешь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: мольбу
  rationale: Слово обозначает настойчивую просьбу о милости; «мольба» естественно передаёт просительный и эмоционально напряжённый характер выражения.
- source_word: עַבְדְּךָ
  choice: Твоего слуги
  rationale: В обращении царя к Богу это смиренное самообозначение. «Слуга» сохраняет подчинённость и звучит естественнее в современном русском, чем «раб» в данном контексте.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Твоего народа Израиля
  rationale: Передаёт принадлежность Израиля Богу и сохраняет прямую конструкцию исходного текста.
- source_word: יִתְפַּלְלוּ
  choice: будут молиться
  rationale: Стандартное значение формы глагола פלל; русское будущее соответствует контексту молитвы о последующих обращениях народа.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: обращаясь к этому месту
  rationale: Предлог אֶל допускает «к/по направлению к». В контексте молитвы выражение указывает на её направленность к храму, не утверждая, что молящиеся находятся в нём.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: месте Твоего обитания
  rationale: Сохраняет образ места, где Бог пребывает, и возвышенный молитвенный регистр.
- source_word: אֶל הַשָּׁמַיִם
  choice: на небесах
  rationale: 'Хотя אֶל обычно означает направление «к», здесь при глаголе «услышать» и обозначении Божьего обитания выражение естественно понимается локативно: Бог слышит на небесах.'
- source_word: וְשָׁמַעְתָּ
  choice: услышь
  rationale: Императив в русском естественно передаёт молитвенную силу еврейского перфекта с союзом в данном просительном контексте и подразумевает внимательный, действенный ответ.
- source_word: וְסָלָחְתָּ
  choice: и прости
  rationale: סלח — обычный глагол Божьего прощения; «прости» ясно и непосредственно передаёт смысл.
theological_decisions:
- issue: Соотношение храма и небес как места Божьего обитания
  choice: Сохранены и направленность молитвы к земному храму, и утверждение, что Бог слышит на небесах.
  alternative: Передать как молитву непосредственно «в этом храме» либо как просьбу услышать «с небес».
  rationale: Исходный текст намеренно соединяет храм как земной центр молитвы с небесами как местом Божьего обитания; перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический знак почтения. Повтор «услышь» сохранён вслед за еврейским текстом; синтаксис слегка сглажен для естественности русского языка.
