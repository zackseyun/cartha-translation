source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: ru
  text: Тогда Соломон встал перед жертвенником Яхве, напротив всего собрания Израиля, и простёр руки к небесам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Форма от עמד обозначает последовательное повествовательное действие; «встал» естественно передаёт принятие Соломоном положения перед жертвенником.
- source_word: לִפְנֵי
  choice: перед
  rationale: С жертвенником как дополнением предлог сохраняет ясное пространственное значение.
- source_word: מִזְבַּח יְהוָה
  choice: жертвенником Яхве
  rationale: Конструкция принадлежности передана естественным русским сочетанием; личное имя יהוה транслитерировано как «Яхве».
- source_word: נֶגֶד
  choice: напротив
  rationale: Передаёт пространственное положение Соломона относительно всего собрания и отличает это выражение от предшествующего לִפְנֵי.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: всего собрания Израиля
  rationale: קהל обозначает собравшуюся общину; «собрание» современно и уместно для публичного богослужебного события.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: простёр руки
  rationale: Устойчиво и достойно передаёт молитвенный жест; буквально כף может означать ладонь, но в данном сочетании по-русски естественно «руки».
- source_word: הַשָּׁמָיִם
  choice: небесам
  rationale: Множественная форма еврейского слова передана русским множественным «небесам», естественным в возвышенном, но понятном молитвенном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, а не титул; «Яхве» сохраняет эту особенность и представляет распространённую научную реконструкцию произношения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Простёр» сохраняет достоинство молитвенной сцены, оставаясь понятным. Подстрочное примечание не требуется, поскольку форма «к небесам» непосредственно отражает еврейское הַשָּׁמָיִם.
