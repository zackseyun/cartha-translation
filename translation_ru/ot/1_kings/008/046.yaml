review_pass:
  verdict: revise
  source_fidelity: Начальное כִּי корректно передано условным «Если» с уместной сноской о варианте «Когда». «Согрешат против Тебя», обобщённое «нет человека, который не грешил бы», Божий гнев и предание врагу соответствуют еврейскому тексту. Однако сочетание «уведут их в плен в землю врага» стилистически тяжеловесно и недостаточно ясно связывает пленение с переселением в вражескую страну. «Уведут их пленниками в землю врага» естественно передаёт וְשָׁבוּם שֹׁבֵיהֶם и сохраняет указание на пленение.
  naturalness: В целом регистр современный литературный, торжественный и уместный для молитвы. Прописное «Тебя» и «Ты» последовательно. Исправление устраняет неудачное скопление двух «в» и однокоренной повтор «пленившие… в плен», не жертвуя смыслом.
  terminology: «Человек» адекватно передаёт обобщённое אָדָם; формула не вносит гендерного ограничения. «Разгневаешься», «предашь их врагу» и «земля врага» терминологически и стилистически приемлемы. Сноска имеет верную привязку к начальному союзу и отражает реально возможное временно-условное прочтение.
  issues:
  - severity: low
