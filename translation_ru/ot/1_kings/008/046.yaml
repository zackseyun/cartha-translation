source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: ru
  text: Если[a] они согрешат против Тебя — ведь нет человека, который не грешил бы, — и Ты разгневаешься на них, предашь их врагу, и пленившие их уведут их пленниками в землю врага, далёкую или близкую,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда».'
    reason: Союз כִּי в этом контексте допускает как условное, так и временно-условное понимание.
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Если они согрешат против Тебя
  rationale: Начальное כִּי вводит условную ситуацию в молитве Соломона. Русское «если» естественно передаёт условный смысл, а לָךְ при глаголе חטא — направленность греха против Бога.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: ведь нет человека, который не грешил бы
  rationale: אָדָם здесь употреблено обобщённо и означает человека как представителя всего человечества. «Человек» точно и естественно передаёт это значение по-русски; конструкция с «не грешил бы» соответствует обобщённому отрицанию.
- source_word: וְאָנַפְתָּ בָם
  choice: и Ты разгневаешься на них
  rationale: Глагол אָנַף выражает гнев; «разгневаешься» сохраняет последовательность условной ситуации и не ослабляет смысл.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: предашь их врагу
  rationale: נתן לפני в данном военном контексте означает отдать во власть противника. Безартиклевое אוֹיֵב передано неопределённым по смыслу русским «врагу».
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: и пленившие их уведут их в плен
  rationale: Переданы и субъект «пленившие их», и однокоренное указание на пленение; это сохраняет выразительный повтор еврейского текста и ясно обозначает насильственное переселение.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  choice: в землю врага, далёкую или близкую
  rationale: Сохранены определённость второго упоминания врага и согласование прилагательных с «землёй»; противопоставление расстояний передано буквально и естественно.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человек
  alternative: никто
  rationale: «Человек» сохраняет ключевое существительное исходного текста и одновременно в современном русском естественно охватывает всё человечество, не вводя гендерного ограничения.
- issue: Неизбежность греха в обобщённом утверждении
  choice: нет человека, который не грешил бы
  alternative: нет человека, который не согрешит
  rationale: Сослагательная форма после отрицательной конструкции естественно выражает универсальное утверждение, не превращая его в указание лишь на единичный будущий поступок.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью. Местоимения, обращённые к Богу, написаны с прописной буквы. Конечная запятая сохранена, поскольку стих представляет собой начало продолжающегося условного периода.
