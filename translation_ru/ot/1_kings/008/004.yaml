base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: ru
  text: Перенесли наверх ковчег Яхве[a], шатёр собрания и все священные принадлежности, находившиеся в шатре; священники и левиты[b] перенесли их наверх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подняли». Еврейский глагол может означать «поднять» или «перенести наверх», в том числе в торжественном шествии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «священники и левиты». Иногда эти слова понимают более узко — как обозначение левитского священства, однако еврейский текст называет обе группы.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: подняли
  rationale: Форма породы хифиль от עלה означает «поднять, доставить наверх». В контексте торжественного перенесения к храму «подняли» сохраняет направленность движения, не уточняя без необходимости способ переноса.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן обозначает здесь священный ковчег, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Перевод прямо передаёт оба компонента выражения и остаётся понятным современному читателю; речь идёт о святилище-шатре, где происходила встреча с Богом.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: все священные принадлежности
  rationale: כְּלִים — широкое обозначение предметов, сосудов и принадлежностей. Такой перевод не сужает значение только до сосудов и естественно звучит по-русски.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: которые были в шатре
  rationale: Относительное предложение естественно относится к непосредственно предшествующим священным принадлежностям; краткое «в шатре» избегает ненужного повтора полного названия.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: подняли их
  rationale: Повтор глагола сохранён вслед за еврейским построением, а местоимение охватывает перечисленные священные предметы.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священники и левиты
  rationale: Еврейский текст прямо называет две группы; перевод не объединяет их толковательно в выражение «левитские священники».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано как «Яхве», а не заменено титулом.
- issue: Соотношение священников и левитов при перенесении святынь
  choice: 'сохранить две явно названные группы: «священники и левиты»'
  alternative: «левитские священники»
  rationale: Грамматика называет обе группы через союз. Перевод сохраняет формулировку и возможное напряжение с другими описаниями обязанностей священников и левитов, не разрешая его толковательно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический повтор оригинала сохранён; архаизмы и конфессионально обусловленные уточнения не вводятся.
