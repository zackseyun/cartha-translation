  naturalness: «Я встал на место Давида» и особенно сочетание с настоящим «сижу на престоле» звучат несколько механически в современном литературном русском. «Я занял место Давида… сел на престол… построил» ясно выражает законное преемство и завершённые действия, не добавляя толкования.
  terminology: «Яхве», «престол», «дом» и «Бог Израиля» выдержаны удачно. «Во имя Яхве» — естественное русское соответствие לְשֵׁם и может быть сохранено; сноска корректно уточняет, что «дом» относится к храму.
