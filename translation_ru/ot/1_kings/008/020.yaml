source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: ru
  text: 'И Яхве исполнил Своё слово, которое изрёк[a]: я занял место Давида, отца моего, сел на престол Израиля, как сказал Яхве, и построил дом[b] во имя Яхве, Бога Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «утвердил Своё слово» или «осуществил сказанное Им».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом»; здесь имеется в виду храм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: исполнил
  rationale: Порода hифиль глагола קום в сочетании со «словом» означает утвердить сказанное или привести его в исполнение; «исполнил» естественно передаёт осуществление данного Богом слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: слово, которое изрёк
  rationale: Сохранены существительное и однокоренное значение речи, без сужения смысла до слова «обещание».
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: я встал на место Давида, отца моего
  rationale: Выражение обозначает династическое преемство; «встал на место» сохраняет связь с корнем קום и не предполагает враждебного вытеснения.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: и сижу на престоле Израиля
  rationale: ישב при слове «престол» описывает воцарение и продолжающееся царствование; настоящее время естественно выражает нынешнее положение Соломона как результат совершившегося восшествия.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: и построил дом
  rationale: «Дом» буквально передаёт הַבַּיִת и сохраняет библейский образ дома Яхве; из контекста ясно, что речь о храме.
- source_word: לְשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Устойчивое русское выражение сохраняет богословски значимую связь храма с именем Яхве, не сводя её только к почитанию.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая и общепринятая передача заветного наименования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя; транслитерация «Яхве» сохраняет его, не подменяя титулом.
- issue: Передача הַבַּיִת
  choice: дом
  alternative: храм
  rationale: Хотя референтом является храм, буквальное «дом» сохраняет значимый образ дома Яхве; пояснение дано в сноске.
- issue: Значение לְשֵׁם יְהוָה
  choice: во имя Яхве
  alternative: для имени Яхве; в честь Яхве
  rationale: Формулировка сохраняет богословскую ёмкость понятия имени и не ограничивает его значением простого чествования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Изрёк» поддерживает достоинство царской молитвы, а синтаксис остаётся понятным современному читателю. Повтор имени Яхве и образ «дома» сохранены по еврейскому тексту.
