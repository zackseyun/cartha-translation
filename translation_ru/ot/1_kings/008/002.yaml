  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: ru
  text: И собрались к царю Соломону все израильтяне на праздник в месяце Этаним, то есть в седьмом месяце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ אֶל־הַמֶּלֶךְ שְׁלֹמֹה
  choice: собрались к царю Соломону
  rationale: Предлог אֶל выражает направленность к царю; по-русски естественно «собрались к», без добавления значения «перед».
- source_word: כָּל־אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Идиоматическое собирательное обозначение народа Израиля; буквальное «всякий муж Израиля» в современном русском звучит неестественно и может неоправданно сужать круг до мужчин.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: в месяце этаним
  rationale: Сохранено древнее название месяца; יֶרַח передано обычным русским словом «месяц».
- source_word: בֶּחָג
  choice: на праздник
  rationale: Слово חַג обозначает установленный праздничный период; в данном контексте речь о празднике Кущей, однако его название в самом стихе не дано.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: то есть в седьмом месяце
  rationale: Связка «то есть» естественно передаёт пояснительное отождествление; повтор предлога нужен для ясного русского синтаксиса.
