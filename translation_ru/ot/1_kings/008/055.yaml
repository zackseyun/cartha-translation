  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: ru
  text: 'И он встал и благословил всё собрание Израиля громким голосом, сказав:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: И он встал
  rationale: Последовательная глагольная форма продолжает повествование; «встал» прямо передаёт עמד и естественно звучит в контексте публичного обращения.
- source_word: וַיְבָרֶךְ
  choice: и благословил
  rationale: ברך здесь означает произнесение благословения над собравшимся народом; краткое «благословил» сохраняет формулировку источника, не уточняя механизм благословения.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: всё собрание Израиля
  rationale: קהל обозначает собравшуюся общину; «собрание» передаёт общественный и совокупный смысл без излишне конфессиональной окраски, а כָּל — словом «всё».
- source_word: קוֹל גָּדוֹל
  choice: громким голосом
  rationale: Буквально «великим/большим голосом»; в данном идиоматическом сочетании речь идёт о громкости, поэтому естественный русский эквивалент — «громким голосом».
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Инфинитив вводит содержание последующей речи; деепричастие «сказав» сохраняет синтаксическую связь со следующим стихом.
theological_decisions:
- issue: Характер благословения Израиля Соломоном
  choice: Сохранено нейтральное «благословил», то есть произнёс благословение над собранием.
  alternative: Передать более причинно или сакраментально, как будто Соломон собственной властью сообщает благодать.
  rationale: Еврейское ברך допускает формальное публичное произнесение благословения. Контекст не требует уточнять богословский механизм, поэтому перевод не усиливает значения исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Порядок действий и формальная связь с последующей прямой речью сохранены; неестественная русская калька «великим голосом» заменена идиоматическим выражением «громким голосом».
