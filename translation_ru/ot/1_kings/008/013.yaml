lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Я действительно построил
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «действительно» естественно передаёт эту эмфазу по-русски.
- source_word: בֵּית זְבֻל
  choice: величественный дом
  rationale: בֵּית буквально означает «дом», а редкое זְבֻל обозначает возвышенное, величественное обиталище. Такое сочетание сохраняет храмовую метафору и передаёт высокий статус жилища.
- source_word: לָךְ
  choice: Тебе
  rationale: Предлог выражает предназначение и личную обращённость к Богу; русское «построил Тебе» передаёт это непосредственно.
- source_word: מָכוֹן
  choice: прочное место
  rationale: Существительное обозначает утверждённое, прочно установленное место; «прочное» передаёт устойчивость, не подменяя последующее указание на обитание.
- source_word: לְשִׁבְתְּךָ
  choice: где Ты будешь обитать
  rationale: Форма от ישׁב допускает значения «сидеть» и «обитать»; в контексте дома естественно «обитать», при этом возможный оттенок восседания не вносится в основной текст.
- source_word: עוֹלָמִים
  choice: вовеки
  rationale: Форма выражает неограниченную, длительную продолжительность; «вовеки» кратко и достойно передаёт её в библейском регистре современного литературного русского языка.
theological_decisions:
- issue: Следует ли смягчать утверждение о храме как месте постоянного обитания Бога
  choice: Сохранить прямую речь о Божьем обитании вовеки
  alternative: 'Уточнить: «место для пребывания Твоего имени» или «место поклонения Тебе»'
  rationale: В еврейском тексте прямо говорится о месте для Божьего обитания. Перевод не должен привносить сюда богословские оговорки из более широкого контекста.
- issue: Передавать ли לְשִׁבְתְּךָ как обитание или восседание на престоле
  choice: обитать
  alternative: восседать
  rationale: Оба оттенка возможны у корня ישׁב, однако образ дома непосредственно поддерживает значение «обитать». Возможная царственная коннотация отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранено буквальное «дом», а не поясняющее «храм». Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
