base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: ru
  text: Ты сохранил для раба Твоего Давида, отца моего, то, что сказал ему[a]; Своими устами Ты сказал и Своей рукой исполнил, как это видно и ныне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что сказал рабу Твоему Давиду, отцу моему».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Своими устами Ты сказал и Своей рукой исполнил» — яркий образ того, что Бог осуществил сказанное Им.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: Ты исполнил
  rationale: В данном контексте שׁמר означает соблюдение данного Давиду слова. Русское «исполнил» естественно передаёт исполнение обещанного; повтор с последующим מִלֵּאתָ сохраняет риторическое усиление исходного текста.
- source_word: לְעַבְדְּךָ
  choice: для раба Твоего
  rationale: Предлог ל допускает значения «для» и «по отношению к». «Для» естественно выражает исполнение данного Давиду слова, сохраняя заветное обозначение «раб».
- source_word: דָּוִד אָבִי
  choice: Давида, отца моего
  rationale: Такой порядок близок к еврейскому и при этом естественен для современного литературного русского языка.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: то, что сказал ему
  rationale: Перевод сохраняет буквальное значение глагола «говорить», не подменяя его более толковательным «обещал», и поддерживает повтор речи далее.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Ты сказал Своими устами
  rationale: Сохранён конкретный образ уст и параллелизм между Божьей речью и действием.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: и Своей рукой исполнил это
  rationale: Сохранён антропоморфный образ руки как обозначения действенной силы; «исполнил» передаёт доведение сказанного до осуществления.
- source_word: כַּיּוֹם הַזֶּה
  choice: как и есть ныне
  rationale: Формула указывает на видимое в настоящий момент исполнение; выражение звучит достойно и понятно в современном русском.
theological_decisions:
- issue: 'Антропоморфные выражения о Боге: «уста» и «рука»'
  choice: Сохранить оба конкретных образа в основном тексте.
  alternative: 'Передать описательно: «Ты сказал и осуществил».'
  rationale: Исходный текст намеренно сопоставляет Божьи уста и руку, то есть слово и действие. Сохранение образов удерживает риторику текста и не разрешает её посредством богословской парафразы.
- issue: Характер сказанного Давиду
  choice: Перевести דִּבַּרְתָּ как «сказал», не уточняя в основном тексте, что это было обещание.
  alternative: Перевести как «обещал».
  rationale: Контекст подразумевает обещание, однако еврейский глагол буквально означает речь. Более широкий вариант сохраняет повтор и не вносит лишнего уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Сохранены параллелизм «устами — рукой» и повтор глагола «исполнил» как допустимое риторическое усиление.
