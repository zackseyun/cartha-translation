source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: ru
  text: Благословен Яхве, даровавший покой Своему народу Израилю, согласно всему, что Он сказал. Ни одно из всех Его добрых слов[a], сказанных через Моисея, Его слугу, не осталось неисполненным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ни одно из всех Его добрых обещаний…» Здесь «слово» может также означать высказанное обещание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая торжественная формула благословения сохраняет предикативный и славословный характер еврейского выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте, не заменяя его титулом.
- source_word: נָתַן מְנוּחָה
  choice: даровавший покой
  rationale: Речь идёт о дарованном народу устойчивом покое после вражды и нестабильности; «покой» точнее, чем только внутренний «мир».
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: Своему народу Израилю
  rationale: Естественно передаёт принадлежность народа Богу и приложение «Израиль» без изменения связи между словами.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: как и говорил
  rationale: Сохраняет значение соответствия всему прежде сказанному, но избегает тяжеловесного буквального оборота «согласно всему, что говорил».
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ни одно ... не осталось неисполненным
  rationale: 'Передаёт смысл еврейской идиомы: ни одно сказанное Богом слово не оказалось без исполнения.'
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: из всех Его добрых слов
  rationale: Коллективное единственное число естественно передано русским множественным; «слова» сохраняет лексическую связь с Божьей речью, не подменяя её толкованием «обещания».
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Стандартная еврейская формула посредничества передана естественным современным русским оборотом; буквальное «рукою Моисея» здесь звучало бы архаично.
- source_word: עַבְדּוֹ
  choice: Его слугу
  rationale: В отношении Моисея слово обозначает почётное служение и поручение Бога; «слуга» уместнее, чем социально окрашенное «раб».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не превращает его в титул.
- issue: Передача דָּבָר / דְּבָרוֹ как «слово» или «обещание»
  choice: слово / слова
  alternative: обещание / обещания
  rationale: Контекст подразумевает исполнение обещанного, однако еврейский текст употребляет более широкое «слово». Основной текст сохраняет эту формулировку, а оттенок обещания отмечен в сноске.
- issue: Смысл формулы לֹא נָפַל
  choice: не осталось неисполненным
  alternative: не упало; не оказалось тщетным
  rationale: Выбранный вариант ясно передаёт идиоматический смысл исполнения Божьих слов, не добавляя утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным библейским звучанием. Синтаксис слегка уплотнён ради естественности; повтор корня «говорить/слово» частично сохранён, а еврейская формула «рукою Моисея» передана как «через Моисея».
