  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: ru
  text: 'И Яхве сказал Давиду, отцу моему: «Так как у тебя было на сердце построить дом[a] для Моего имени, ты хорошо сделал, что это было у тебя на сердце».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». Буквально: «дом».'
    reason: 'Лексическое пояснение: בַּיִת буквально означает «дом», но в данном контексте обозначает храм.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: Форма продолжает повествование, а в данном контексте вводит противопоставление намерению Давида; союз «но» естественно передаёт эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֶל דָּוִד אָבִי
  choice: Давиду, отцу моему
  rationale: Сохранена речь Соломона от первого лица; приложение оформлено естественно для русского языка.
- source_word: יַעַן אֲשֶׁר
  choice: так как
  rationale: Сочетание вводит основание последующей оценки; «так как» ясно и литературно передаёт причинное значение.
- source_word: הָיָה עִם לְבָבְךָ
  choice: у тебя было на сердце
  rationale: Сохранён древнееврейский образ сердца как средоточия намерения, при этом выражение понятно по-русски.
- source_word: לִבְנוֹת בַּיִת
  choice: построить дом
  rationale: Буквально בַּיִת означает «дом»; в контексте речь идёт о храме, что пояснено в сноске.
- source_word: לִשְׁמִי
  choice: для Моего имени
  rationale: Сохранена богословски значимая связь святилища с именем Бога без истолковывающей замены.
- source_word: הֱטִיבֹתָ
  choice: хорошо ты сделал
  rationale: Хифиль глагола יטב здесь выражает одобрение намерения Давида; выбранная формулировка естественна и не утверждает, будто он уже построил храм.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: что это было у тебя на сердце
  rationale: כִּי вводит содержание или основание одобрения; «что» сохраняет повтор исходного образа без тяжеловесного повтора причинного союза.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и не заменяет его титулом.
- issue: Передача בַּיִת в связи со святилищем
  choice: дом
  alternative: храм
  rationale: Слово буквально означает «дом» и сохраняет библейский образ дома для имени Бога; контекстуальное значение «храм» указано в сноске.
- issue: Смысл одобрения הֱטִיבֹתָ
  choice: одобряется намерение Давида
  alternative: одобряется уже совершённое строительство
  rationale: Повтор «это было у тебя на сердце» показывает, что одобрение относится к намерению построить дом, а не к завершённому действию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены повторы и образ «на сердце», значимые для структуры еврейского текста; местоимение в выражении «Моего имени» написано с прописной буквы по русской благоговейной традиции.
