base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: ru
  text: И там Я приготовил место для ковчега, в котором находится завет Яхве, заключённый Им с нашими отцами[a], когда Он вывел их из земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с нашими предками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: И там Я устроил место
  rationale: שׂים означает «положить, поставить, поместить»; в сочетании с מָקוֹם естественное русское «устроил место» передаёт совершённое обустройство места для ковчега, не добавляя идеи строительства.
- source_word: לָאָרוֹן
  choice: для ковчега
  rationale: В храмовом контексте אָרוֹן обозначает ковчег; последующее упоминание завета ясно определяет его назначение.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: в котором находится завет Яхве
  rationale: Относительно-местная конструкция буквально связывает нахождение завета с ковчегом. «Находится» естественно восполняет отсутствующую в еврейском связку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: אֲשֶׁר כָּרַת
  choice: заключённый Им
  rationale: Буквальное «который Он отсёк» отражало бы еврейскую идиому неестественно; по-русски завет обычно «заключают». Причастная конструкция сохраняет отнесение оборота к завету.
- source_word: עִם אֲבֹתֵינוּ
  choice: с нашими отцами
  rationale: Сохраняется прямо выраженное мужское множественное אבותינו; в контексте возможен более широкий смысл «предки», отмеченный в сноске.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: когда Он вывел их из земли Египетской
  rationale: Инфинитивная конструкция с ב имеет временной смысл; каузативная форма יצא передана глаголом «вывел».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение אֲבֹתֵינוּ
  choice: с нашими отцами
  alternative: с нашими предками
  rationale: Основной текст сохраняет мужское обозначение исходника, а возможный собирательный смысл не исключается и указан в сноске.
- issue: Местонахождение завета
  choice: в котором находится завет Яхве
  alternative: где завет Яхве
  rationale: Формулировка сохраняет утверждение текста о завете в ковчеге, вероятно представленном скрижалями, не вводя это пояснение в сам перевод.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Заглавные местоимения при указании на Бога применены последовательно в пределах стиха; «земля Египетская» сохраняет узнаваемую формулу исхода без архаизации синтаксиса.
