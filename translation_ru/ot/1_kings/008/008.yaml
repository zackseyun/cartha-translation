  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: ru
  text: Шесты были так длинны, что концы шестов были видны в Святом месте, перед внутренним святилищем[a], но снаружи их не было видно; они остаются там и по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Святым святых». Древнееврейское слово обозначает внутреннее святилище храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: были так длинны
  rationale: Глагол ארך описывает протяжённость шестов, которая объясняет последующую видимость их концов. Результативная формулировка естественна по-русски и сохраняет причинную связь контекста.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: בַּדִּים — шесты для переноски ковчега. «Шесты» — ясное и современное русское обозначение без архаизации.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: их концы были видны
  rationale: רָאשֵׁי буквально означает «головы», но применительно к шестам естественный русский эквивалент — «концы». Нифаль глагола ראה передан как состояние видимости.
- source_word: מִן הַקֹּדֶשׁ
  choice: из Святилища
  rationale: В данном описании הַקֹּדֶשׁ обозначает внешнее помещение храма в отличие от внутреннего святилища. Прописная буква помогает передать это как название храмовой части.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: перед внутренним святилищем
  rationale: דְּבִיר обозначает внутреннее помещение храма, где находился ковчег; עַל־פְּנֵי здесь естественно передаётся предлогом «перед». Альтернативное традиционное название вынесено в примечание.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: но снаружи их не было видно
  rationale: 'Формулировка естественно передаёт противопоставление: из Святилища концы видны, а извне — нет.'
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: они остаются там и по сей день
  rationale: Стандартная древнееврейская формула указывает на продолжавшееся ко времени рассказчика положение; настоящее время в русском сохраняет эту перспективу.
