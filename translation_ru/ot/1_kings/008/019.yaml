base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: ru
  text: Однако не ты построишь этот дом, а твой сын, который произойдёт от тебя[a], — он построит этот дом для моего имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходящий из твоих чресл», то есть твой кровный потомок.'
    reason: Сохраняет буквальный телесный образ еврейского выражения и ясно поясняет значение идиомы.
lexical_decisions:
- source_word: רַק
  choice: Однако
  rationale: В данном контексте слово вводит ограничение к предшествующему одобрению намерения Давида; «однако» естественно передаёт уступительно-противительный смысл.
- source_word: לֹא תִבְנֶה
  choice: не ты построишь
  rationale: Отрицание с имперфектом в божественном изречении допускает оттенки как запрета, так и предопределённого будущего; русская форма будущего времени сохраняет эту напряжённость, а порядок слов подчёркивает противопоставление Давида его сыну.
- source_word: הַבָּיִת
  choice: этот дом
  rationale: Сохраняется исходное «дом», а не интерпретирующее «храм». Указательное «этот» естественно обозначает уже упомянутый и определённый дом.
- source_word: כִּי אִם
  choice: а
  rationale: После отрицания русская конструкция «не ты…, а твой сын» ясно и естественно передаёт исправляющее противопоставление.
- source_word: בִּנְךָ
  choice: твой сын
  rationale: Единственное число с суффиксом указывает на конкретного сына в контексте.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: который произойдёт от тебя
  rationale: Передаёт смысл физического происхождения естественным современным русским языком; буквальный образ сохранён в примечании.
- source_word: הוּא
  choice: он
  rationale: 'Самостоятельное местоимение имеет эмфатическую функцию; оно сохранено, чтобы подчеркнуть: дом построит именно сын, а не Давид.'
- source_word: יִבְנֶה הַבַּיִת
  choice: он построит этот дом
  rationale: Повтор глагола и существительного воспроизводит еврейское повторение и торжественный характер обещания.
- source_word: לִשְׁמִי
  choice: для моего имени
  rationale: Буквально сохраняет значимое библейское выражение о доме, посвящённом имени Господа, не заменяя его толкованием.
theological_decisions:
- issue: Передавать הַבָּיִת как «дом» или как «храм»
  choice: дом
  alternative: храм
  rationale: В исходном тексте стоит «дом». Хотя по контексту речь идёт о храме, образ дома имеет самостоятельное богословское значение и не должен молча заменяться истолкованием.
- issue: Понимать לֹא תִבְנֶה как запрет или как предсказание
  choice: не ты построишь
  alternative: тебе нельзя строить
  rationale: Форма в этом божественном изречении может звучать и как постановление, и как указание на будущее. Выбранный перевод не сводит её исключительно к прямому запрету.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «не ты…, а твой сын» и повторное «он» сохраняют исходное противопоставление и эмфазу. Местоимение «моего» дано со строчной буквы по обычной современной орфографической норме; это не умаляет референта.
