review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы все основные элементы стиха: Божье слышание, прощение греха Израиля и возвращение народа в данную отцам землю. Однако «возврати их в землю» в современном русском обычно означает буквально поместить в грунт и потому искажает пространственно-территориальный смысл אֶל־הָאֲדָמָה. Следует: «возврати их в землю их отцов» или, яснее, «возврати их в землю, которую Ты дал их отцам».'
  naturalness: «Услышь на небесах» допустимо в высоком библейском регистре; сноска корректно отмечает вариант «с небес». Формулировка «возврати их в землю» неестественна и семантически двусмысленна. «Возврати их в землю, которую Ты дал их отцам» звучит естественно и сохраняет торжественный молитвенный регистр.
  terminology: «Прости грех Твоего народа Израиля» точно передаёт לְחַטַּאת עַמְּךָ יִשְׂרָאֵל; единственное число «грех» уместно как собирательное. «Отцам» сохраняет исходную мужскую формулировку и традиционный язык обетования, не требуя дополнительной конфессиональной интерпретации.
  issues:
  - severity: medium
    issue: Неудачное сочетание «возврати их в землю».
    rationale: В русском «в землю» преимущественно относится к грунту, могиле или почве, тогда как אֲדָמָה здесь означает страну/территорию. Добавление относительного придаточного «которую Ты дал их отцам» снимает двусмысленность и прямо передаёт еврейский текст.
  revised_text: то услышь на небесах и прости грех Твоего народа Израиля, и возврати их в землю, которую Ты дал их отцам.[a]
  revised_footnotes:
  - marker: a
    text: 'Или: «услышь с небес».'
    reason: lexical_alternative
  revision_rationale: Исправлено только «возврати их в землю» посредством восстановления следующего в оригинале относительного придаточного. Это устраняет русскую двусмысленность, уточняет территориальное значение «земли» и сохраняет порядок и смысл исходного текста.
