lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: услышь на небесах
  rationale: Беспредложное еврейское сочетание указывает на небеса как место Божьего пребывания. Русское «услышь на небесах» сохраняет конструкцию и молитвенный смысл, не заменяя её возможным истолкованием «услышь с небес».
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: и прости грех
  rationale: סלח обозначает Божье прощение, а חטאת здесь — грех народа, не жертву за грех. Единственное число сохранено как собирательное.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Твоего народа Израиля
  rationale: Родительный оборот естественен для современного русского языка и ясно называет Израиль Божьим народом.
- source_word: וַהֲשֵׁבֹתָם אֶל הָאֲדָמָה
  choice: и возврати их в землю
  rationale: Каузативная форма שוב выражает возвращение людей на прежнее место. «Возврати их в землю» сохраняет пространственный смысл; אֲדָמָה в контексте обетования означает территорию, а не почву.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: которую Ты дал их отцам
  rationale: Формулировка сохраняет мужское אבות и связь с праотцами, которым была дана земля, не обобщая его до «предков».
theological_decisions:
- issue: Значение לַאֲבוֹתָם в контексте обещанной земли
  choice: их отцам
  alternative: их предкам
  rationale: «Отцам» точнее передаёт мужское обозначение праотцов и сохраняет формулу обетования земли без конфессионального уточнения их личности.
- issue: Характер возвращения в וַהֲשֵׁבֹתָם
  choice: возврати их в землю
  alternative: восстанови их на земле
  rationale: Текст говорит о конкретном возвращении народа в данную Богом землю; выбранный вариант сохраняет каузативное и пространственное значение, не превращая его в отвлечённое восстановление.
- issue: Местонахождение или источник слышания в תִּשְׁמַע הַשָּׁמַיִם
  choice: услышь на небесах
  alternative: услышь с небес
  rationale: Основной текст сохраняет неоднозначную беспредложную еврейскую конструкцию и понимает небеса как место Божьего слышания; возможное понимание небес как точки, откуда Бог слышит, отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской библейской традиции. Синтаксис остаётся близким к последовательности еврейского текста, но звучит естественно.
