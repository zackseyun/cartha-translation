base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: ru
  text: В то время Соломон праздновал праздник, и с ним — весь Израиль, великое собрание от Лево-Хамата[a] до потока Египта[b], пред Яхве, нашим Богом, семь дней и семь дней — четырнадцать дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от входа в Хамат». Еврейское выражение можно понимать как описательное обозначение границы либо как название места Лево-Хамат.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «до вади Египта». Еврейское слово часто обозначает сезонный водоток или его русло, а не большую постоянную реку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: совершил праздник
  rationale: Сочетание עשה с חג означает проведение или соблюдение праздника. «Совершил праздник» передаёт идиому естественно и в достойном библейском регистре.
- source_word: קָהָל גָּדוֹל
  choice: великое собрание
  rationale: קהל обозначает собравшуюся общину; «собрание» сохраняет коллективный и формальный смысл.
- source_word: מִלְּבוֹא חֲמָת
  choice: от Лево-Хамата
  rationale: Выражение часто функционирует как устойчивое географическое название пограничного пункта. Описательное прочтение сохранено в сноске.
- source_word: נַחַל מִצְרַיִם
  choice: Египетского потока
  rationale: נחל обычно обозначает поток, русло или сезонный водоток, а не крупную реку; этот перевод не вызывает ошибочной ассоциации с Нилом.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: пред Яхве, нашим Богом
  rationale: «Пред» прямо передаёт пространственно-реляционное значение לִפְנֵי, а «Яхве» сохраняет личное имя, представленное тетраграмматоном.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: семь дней и ещё семь дней
  rationale: Сохранены повтор и структура двух последовательных семидневных периодов; «ещё» естественно выражает их последовательность, не сводя фразу сразу к общей сумме.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: четырнадцать дней
  rationale: Аппозиционное итоговое указание передано прямо и естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Отнесение двух семидневных периодов
  choice: сохранить повтор без уточнения названий двух празднований
  alternative: явно отнести первые семь дней к освящению храма, а вторые — к празднику
  rationale: Сам стих называет только «праздник» и даёт схему семь плюс семь дней. Перевод не вводит подразумеваемое из контекста разграничение непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прояснён разделением на два предложения; местоимение «Они» эксплицирует подразумеваемый субъект длительности празднования. Все варианты в сносках отмечены в основном тексте.
