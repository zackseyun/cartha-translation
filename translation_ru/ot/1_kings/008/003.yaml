  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: ru
  text: И пришли все старейшины Израиля, и священники понесли ковчег.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ковчег завета; полное название здесь не употреблено, но ясно из контекста.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Форма повествовательной последовательности от בוא; «пришли» естественно и точно передаёт движение к месту, не добавляя неуказанного пункта назначения.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: все старейшины Израиля
  rationale: כֹּל охватывает всю названную группу, а конструкция זִקְנֵי יִשְׂרָאֵל обозначает признанных руководителей Израиля; «старейшины» — устойчивое и понятное соответствие.
- source_word: וַיִּשְׂאוּ
  choice: понесли
  rationale: נשׂא может означать «поднять» и «нести»; в контексте переноса ковчега совершенный вид с начинательным оттенком естественно передаётся словом «понесли».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Определённое существительное во множественном числе прямо называет присутствующую группу священников.
- source_word: אֶת הָאָרוֹן
  choice: ковчег
  rationale: В еврейском тексте употреблено только определённое «ковчег»; уточнение «ковчег завета» ясно из контекста, но в самом стихе отсутствует.
