translation_notes:
  register: Современный литературный русский язык с сохранением краткой повествовательной структуры оригинала. Союз «и» сохраняет последовательность еврейского повествования. Лексическую многозначность נשׂא отражает глагол «понесли», сочетающий поднятие и последующий перенос.
