source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: ru
  text: тогда Ты услышь с небес, с места Твоего обитания, прости, действуй и воздай каждому по всем его путям, чьё сердце Ты знаешь, — ведь Ты один знаешь сердца всех сынов человеческих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всех сынов человека»; древнееврейское выражение, означающее всех людей.'
    reason: Пояснение буквальной формы и всеобщего смысла идиомы כָּל בְּנֵי הָאָדָם.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: услышь
  rationale: Имперфект в контексте молитвенного прошения передан побудительной формой, а не простым будущим временем.
- source_word: הַשָּׁמַיִם
  choice: на небесах
  rationale: Форма обозначает место, где Бог слышит молитву; русский предложный оборот естественно сочетается с последующим приложением.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: месте Твоего обитания
  rationale: Сохраняется значение установленного места пребывания, но без неестественной для современного русского языка буквальности.
- source_word: וְסָלַחְתָּ
  choice: прости
  rationale: Последовательная перфектная форма продолжает ряд молитвенных просьб.
- source_word: וְעָשִׂיתָ
  choice: действуй
  rationale: Глагол имеет широкое значение «делать, совершать»; «действуй» передаёт ответное Божье действие, не уточняя его характера сверх текста.
- source_word: וְנָתַתָּ לָאִישׁ
  choice: воздай каждому
  rationale: Единственное число имеет распределительное значение; «воздай» естественно выражает предоставление каждому результата, соответствующего его путям.
- source_word: כְּכָל דְּרָכָיו
  choice: по всем его путям
  rationale: Сохранена древнееврейская метафора пути как образа поведения и жизненного уклада.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: зная его сердце
  rationale: Деепричастный оборот естественно передаёт определительное отношение к каждому человеку и не превращает знание сердца в отдельное основание воздаяния.
- source_word: לְבָב / לְבָבוֹ
  choice: сердце / сердца
  rationale: «Сердце» сохраняет библейский образ внутреннего человека, включая мысли, намерения и волю.
- source_word: לְבַדְּךָ
  choice: Ты один
  rationale: Передано подчёркнутое исключительное знание Бога.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: всех сынов человеческих
  rationale: Сохраняется образная форма древнееврейского собирательного выражения; примечание поясняет, что оно охватывает всех людей.
theological_decisions:
- issue: Исключительное знание Богом человеческого сердца
  choice: ведь Ты один знаешь сердца
  alternative: ведь только Ты знаешь внутренность каждого человека
  rationale: Сохранены как исключительность Божьего знания, так и библейский образ сердца без его сведения только к мыслям или чувствам.
- issue: Антропологическое выражение כָּל בְּנֵי הָאָדָם
  choice: всех сынов человеческих
  alternative: всех людей
  rationale: Основной текст сохраняет мужскую образную форму и исходную текстуру выражения, а примечание ясно указывает на его всеобщий смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис сделан плавным, при этом сохранены повторение просьб, метафора путей и образ сердца. Маркер примечания поставлен при выражении, которое он поясняет.
