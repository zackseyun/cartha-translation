  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: ru
  text: и обратятся к Тебе всем сердцем и всей душой в земле своих врагов, которые увели их в плен, и будут молиться Тебе, повернувшись лицом к своей земле[a], которую Ты дал их отцам, к городу, который Ты избрал, и к храму, который я построил для Твоего имени[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по направлению к своей земле»; речь идёт о молитве лицом в сторону этой земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к дому, который я построил для Твоего имени»; здесь «дом» означает храм.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: и обратятся к Тебе
  rationale: Глагол שׁוּב означает «вернуться, обратиться». В данном контексте подразумевается покаянное возвращение к Богу, но «обратятся к Тебе» сохраняет как направленность действия, так и смысловой оттенок покаяния, не делая его единственным значением.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: всем сердцем и всей душой
  rationale: Сохранена традиционная и естественная для русского языка библейская формула, выражающая полную внутреннюю преданность.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: в земле своих врагов, которые увели их в плен
  rationale: «Земля» сохраняет перекличку с последующим упоминанием их собственной земли; שׁבה прямо обозначает взятие или увод в плен.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: и будут молиться Тебе
  rationale: Будущее время естественно продолжает условно-пророческую последовательность русской фразы и точно передаёт обращённость молитвы к Богу.
- source_word: דֶּרֶךְ אַרְצָם
  choice: обратившись к своей земле
  rationale: דֶּרֶךְ при названии места указывает на направление. Русская формулировка ясно выражает физическую ориентацию молящихся, а не только тему их молитвы.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: которую Ты дал их отцам
  rationale: «Отцам» сохраняет конкретную заветную формулу исходного текста; «предкам» было бы возможно, но менее буквально.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: к городу, который Ты избрал
  rationale: Глагол «избрал» сохраняет торжественный библейский оттенок выбора Богом, оставаясь понятным современному читателю.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: и к храму, который я построил для Твоего имени
  rationale: 'בַּיִת буквально значит «дом», но здесь однозначно обозначает храм; «храм» предотвращает неясность в современном русском. Форма בנית в контексте речи Соломона понята как первое лицо единственного числа: «я построил».'
theological_decisions:
- issue: Покаянный оттенок глагола שׁוּב
  choice: «обратятся к Тебе»
  alternative: «вернутся к Тебе» или «раскаются перед Тобой»
  rationale: Выбранная формулировка сохраняет одновременно идею возвращения к Богу и возможный покаянный смысл, не сводя многозначность еврейского глагола только к формальному раскаянию.
- issue: Лицо глагола при описании построенного храма
  choice: «который я построил»
  alternative: «который построен» или «который они построили»
  rationale: Масоретский согласный текст בנית в контексте молитвы Соломона естественно читается как форма первого лица единственного числа. Это соответствует говорящему и не устраняет значимую деталь текста.
- issue: Значение формулы «для Твоего имени»
  choice: сохранено буквально
  alternative: «посвящённому Тебе»
  rationale: Формула имени несёт самостоятельное богословское содержание в повествовании о храме; её не следует заменять толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сохраняет структуру протасиса более широкой молитвы, поэтому стих оканчивается запятой.
