translation:
  language: ru
  text: Пусть Твои глаза будут открыты для мольбы[a] Твоего слуги и мольбы Твоего народа Израиля, чтобы Ты внимал им[b] всякий раз, когда они взывают к Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошению». Еврейское слово обозначает настойчивую просьбу о благоволении или милости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слышать их». Еврейский глагол может означать «слышать», «слушать» или «внимать» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Пусть ... будут
  rationale: Инфинитив с ל продолжает молитвенное прошение Соломона; русская побудительно-желательная конструкция естественно передаёт этот смысл.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: Твои глаза будут открыты
  rationale: Сохранён прямой антропоморфный образ Божьего внимательного благоволения, без замены его толкованием.
- source_word: תְּחִנַּת
  choice: мольбе
  rationale: Слово обозначает настойчивую просьбу о милости; «мольба» передаёт и просьбу, и её напряжённость, оставаясь понятным современному читателю.
- source_word: עַבְדְּךָ
  choice: Твоего слуги
  rationale: В контексте царской молитвы это самоназвание Соломона перед Богом; «слуга» естественнее и точнее по функции, чем «раб» в его современном узком восприятии.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Твоего народа Израиля
  rationale: Сохранено определение Израиля как принадлежащего Богу народа; русская конструкция естественно читается без пояснительной вставки.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: чтобы внимать им
  rationale: Глагол שׁמע здесь выражает не простое слуховое восприятие, а внимательное слушание молитвы; при этом в сноске сохранена более буквальная возможность «слышать».
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: всякий раз, когда они взывают к Тебе
  rationale: Сочетание בְּכֹל с формой от קרא имеет временно-повторительный смысл; «взывают» уместно для обращения к Богу в молитве и передаёт его настойчивость.
theological_decisions:
- issue: Антропоморфный образ открытых глаз Бога
  choice: Сохранить образ «Твои глаза будут открыты» в основном тексте
  alternative: 'Передать толковательно: «будь внимателен»'
  rationale: Еврейский текст прямо использует телесный образ Божьего внимания. Его сохранение удерживает литературное и богословское напряжение текста, не утверждая буквально телесность Бога.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Божественные местоимения написаны с прописной буквы. Сохранён исходный образ открытых глаз; синтаксис сделан ясным для современного читателя.
