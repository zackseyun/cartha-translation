base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: ru
  text: В ковчеге не было ничего, кроме двух каменных скрижалей, которые Моисей положил туда, на Хориве, где Яхве заключил завет с сынами Израиля, когда они вышли из земли Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: В ковчеге не было ничего, кроме
  rationale: Естественная русская передача отрицательной конструкции существования с רַק в значении исключения.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: двух каменных скрижалей
  rationale: «Скрижали» — понятное и укоренившееся в русском библейском языке обозначение каменных табличек завета; прилагательное сохраняет указание на материал.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: которые Моисей положил туда
  rationale: Глагол הִנִּיחַ означает «положить, поместить, оставить»; простой прошедший вид естественен в русском повествовании.
- source_word: בְּחֹרֵב
  choice: на Хориве
  rationale: Традиционное и естественное русское управление для названия горы или горной местности Хорив.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: где Яхве заключил завет с
  rationale: Относительное אֲשֶׁר по смыслу связывает событие с Хоривом; идиома «резать завет» естественно передаётся по-русски как «заключить завет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Сохраняет родовую метафору и формальную структуру еврейского выражения, оставаясь понятным в литературном русском языке.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: когда они вышли из земли Египетской
  rationale: Передаёт временное значение инфинитивной конструкции и сохраняет явную отсылку к исходу из Египта.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие без замены имени титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Выбран вариант, сохраняющий семейно-родовой образ оригинала; он не ограничивает смысл только непосредственными сыновьями патриарха, поскольку выражение обозначает народ Израиля.
- issue: Подразумеваемый «завет» при כָּרַת
  choice: заключил завет
  alternative: заключил с сынами Израиля
  rationale: Хотя слово בְּרִית в масоретском тексте этого стиха не выражено, глагол כָּרַת в данном контексте эллиптически отсылает к заключению завета; добавление существительного необходимо для ясного русского выражения идиомы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слова «ковчег», «скрижали», «завет» и форма «земля Египетская» поддерживают достоинство и межтекстовые связи, не делая синтаксис архаичным.
