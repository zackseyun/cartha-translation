  - severity: medium
    issue: Передача מִשְׁפַּט עַבְדּוֹ / מִשְׁפַּט עַמּוֹ
    rationale: «Отстаивал право» допустимо, но менее точно передаёт משפט как судебное дело, тяжбу или правовое притязание конкретной стороны. «Поддерживал дело» сохраняет юридически-защитный смысл без излишней конкретизации.
  - severity: low
