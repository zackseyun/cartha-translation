  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: ru
  text: И пусть эти мои слова, с которыми я обращался с мольбой перед Яхве, будут близки Яхве, нашему Богу, днём и ночью, чтобы Он поддерживал дело Своего слуги и дело Своего народа Израиля согласно потребности каждого дня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дело дня в его день»; то есть то, что необходимо или надлежит в каждый отдельный день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: И пусть ... будут
  rationale: Форма выражает пожелание, продолжающее молитву Соломона, а не простое будущее.
- source_word: דְבָרַי אֵלֶּה
  choice: эти мои слова
  rationale: Прямо и естественно передаёт указательное и притяжательное значение еврейской конструкции.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי לִפְנֵי יְהוָה
  choice: с которыми я взывал к Яхве
  rationale: Глагол передаёт настойчивую мольбу; «взывал» сохраняет её напряжённость, а «к Яхве» естественно выражает молитвенную обращённость при буквальном «перед лицом Яхве».
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: будут близки Яхве, нашему Богу
  rationale: 'Сохраняет пространственный образ текста: слова молитвы должны постоянно оставаться близкими Богу, то есть перед Ним.'
- source_word: יוֹמָם וָלָיְלָה
  choice: днём и ночью
  rationale: Точно сохраняет еврейский устойчивый оборот непрерывности.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: чтобы Он отстаивал право
  rationale: Судебная идиома означает поддерживать правое дело или обеспечивать справедливое решение; «отстаивал право» естественно передаёт этот смысл.
- source_word: עַבְדּוֹ
  choice: Своего слуги
  rationale: В молитвенной царской речи עבד обозначает Соломона как подчинённого Богу; «слуга» здесь уместнее буквального «раб».
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: изо дня в день, по потребности каждого дня
  rationale: Передаёт как распределительное «день за днём», так и смысл того, что требуется в каждый конкретный день.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Смысл выражения לַעֲשׂוֹת מִשְׁפַּט
  choice: отстаивал право
  alternative: творил суд; совершал правосудие; поддерживал дело
  rationale: Формулировка сохраняет судебно-защитный смысл идиомы и не уточняет сверх текста, каким именно способом Бог поддержит царя и Израиль.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Прописные местоимения при обращении к Богу использованы как допустимая русская религиозно-литературная норма. Синтаксис сохраняет протяжённость исходного благопожелания, но остаётся понятным современному читателю.
