  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: ru
  text: чтобы все народы земли узнали, что Господь — Бог; другого нет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: чтобы ... узнали
  rationale: Целевая конструкция לְמַעַן с инфинитивом передана естественным русским придаточным цели; совершенный вид «узнали» выражает достижение знания.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: все народы земли
  rationale: Сохраняет всеобщий охват и обычное библейское обозначение народов мира.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая консультационному слою LORD.
- source_word: הוּא הָאֱלֹהִים
  choice: — Бог
  rationale: Русская именная конструкция с тире естественно передаёт отождествление; отдельное «Он» здесь звучало бы тяжеловесно, хотя еврейское הוּא придаёт утверждению подчёркнутость.
- source_word: אֵין עוֹד
  choice: нет другого
  rationale: Кратко и буквально передаёт исключительность утверждения, сохраняя подразумеваемое «Бога».
theological_decisions:
- issue: Исключительное исповедание о Яхве как Боге
  choice: «Господь — Бог и нет другого»
  alternative: «Господь есть Бог; кроме Него нет никого»
  rationale: Выбранный вариант сохраняет категоричность исходного текста, не уточняя сверх него, относится ли «другого» грамматически к другому Богу или вообще к кому-либо ещё.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Синтаксическая подчёркнутость еврейского «Он — Бог» выражена тире и категоричностью именного сказуемого без неестественного для русского дублирования местоимения.
