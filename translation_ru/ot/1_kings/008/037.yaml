  to: Если в стране будет голод, если будет мор, если будет иссушение посевов или их пожелтение, саранча или пожирающая посевы саранча[a], если враг осадит его в его городах[b], какое бы бедствие ни постигло его, какая бы болезнь ни поразила его —
