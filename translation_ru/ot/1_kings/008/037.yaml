id: 1KI.8.37
reference: 1 Kings 8:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: ru
  text: Если в стране будет голод, если будет мор, если будет иссушение посевов или их пожелтение, саранча или пожирающая посевы саранча[a], если враг осадит его в его городах[b], какое бы бедствие ни постигло его, какая бы болезнь ни поразила его —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает пожирающее посевы насекомое; возможно, особый вид или стадия развития саранчи. Точный вид неизвестен; традиционный вариант перевода — «гусеница».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в земле его ворот». «Ворота» здесь, вероятно, обозначают города страны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: голод
  rationale: В перечне всенародных бедствий слово обозначает не обычное чувство голода, а голод в стране; по-русски это естественно выражается словом «голод».
- source_word: דֶּבֶר
  choice: мор
  rationale: Речь идёт о массовой смертельной эпидемии. «Мор» кратко передаёт значение и не смешивается с более общим נֶגַע далее в стихе.
- source_word: שִׁדָּפוֹן
  choice: иссушающий зной
  rationale: Слово обозначает повреждение посевов иссушением или палящим ветром; перевод сохраняет вероятную причину бедствия, не сводя его к конкретной современной болезни растений.
- source_word: יֵרָקוֹן
  choice: пожелтение
  rationale: В земледельческом контексте обозначает болезненное побледнение или пожелтение растений. Контекстуальное добавление «посевы» делает смысл ясным по-русски.
- source_word: אַרְבֶּה
  choice: саранча
  rationale: Обычное обозначение саранчи, употреблённое собирательно.
- source_word: חָסִיל
  choice: пожирающая саранча
  rationale: Название пожирающего посевы насекомого, вероятно вида или стадии саранчи; неопределённость уточнена в сноске.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: если враг осадит народ
  rationale: Глагол выражает окружение и стеснение при осаде. Местоимение относится к Израилю как к собирательному целому, поэтому по-русски назван «народ».
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: в каком-либо из его городов
  rationale: «Ворота» метонимически обозначают укреплённые города. Идиоматический перевод передаёт местный смысл фразы, а буквальный образ сохранён в сноске.
- source_word: כָּל נֶגַע
  choice: какое бы бедствие ни постигло его
  rationale: נֶגַע здесь имеет широкое значение удара, поражения или бедствия; такая формулировка сохраняет обобщающую силу כָּל и не дублирует «мор».
- source_word: כָּל מַחֲלָה
  choice: какая бы болезнь ни поразила его
  rationale: Общее обозначение болезни; глагол «поразила» естественно передаёт наступление бедствия и поддерживает параллелизм.
theological_decisions:
- issue: К кому относится местоимение единственного числа в לוֹ, אֹיְבוֹ и שְׁעָרָיו
  choice: к народу Израиля как собирательному целому
  alternative: к отдельному жителю страны
  rationale: Ближайший контекст молитвы говорит о всенародных бедствиях и стране; еврейский текст олицетворяет народ в единственном числе. Перевод делает эту референцию ясной, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Перечень бедствий передан ясными параллельными конструкциями; финальное тире сохраняет незавершённость синтаксиса, продолжающегося в следующем стихе. Все сноски поставлены непосредственно после соответствующих выражений.
