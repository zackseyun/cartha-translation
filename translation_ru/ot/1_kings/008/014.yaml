  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: ru
  text: Затем царь повернулся[a] и благословил всё собрание Израиля[b], а всё собрание Израиля в это время стояло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернул своё лицо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всю общину Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: повернулся
  rationale: Еврейское выражение буквально означает «повернул своё лицо». В современном русском возвратный глагол естественно передаёт физический поворот, не вводя отсутствующего в тексте направления.
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Обычное и точное соответствие глаголу ברך; в данном публичном контексте подразумевает произнесение благословения без необходимости пояснять это в основном тексте.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: всё собрание Израиля
  rationale: קהל обозначает собравшийся народ как единое целое. «Собрание» сохраняет корпоративный смысл и звучит современно и нейтрально.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: а всё собрание Израиля в это время стояло
  rationale: Причастие עֹמֵד описывает продолжающееся положение народа во время благословения. Формулировка «в это время стояло» передаёт фоновое действие, а повтор слов «всё собрание Израиля» сохраняет заметную структуру исходного текста.
