  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: ru
  text: И внесли священники ковчег завета Яхве на его место — во внутреннее святилище храма, в Святое святых, под крылья херувимов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: И внесли
  rationale: Форма продолжает последовательное повествование. Глагол «внесли» естественно передаёт движение ковчега внутрь храма.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямое соответствие определённому существительному во множественном числе.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: 'Сохранена последовательность исходной сопряжённой конструкции: ковчег, связанный с заветом Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מְקוֹמוֹ
  choice: на его место
  rationale: Местоименный суффикс относится к ковчегу; слово «надлежащее» не добавляется, поскольку его нет в исходном тексте.
- source_word: דְּבִיר הַבַּיִת
  choice: внутреннее святилище храма
  rationale: דְּבִיר обозначает самое внутреннее помещение храмового здания; «святилище» передаёт сакральный контекст, а «храм» естественно выражает значение הַבַּיִת в данном контексте.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  rationale: Традиционное и понятное русское выражение точно воспроизводит еврейскую усилительную конструкцию и обозначает самое святое помещение храма.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: под крылья херувимов
  rationale: Предлог передаёт направление помещения ковчега под распростёртые крылья; «херувимы» — устоявшееся русское обозначение этих храмовых существ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Характер выражения קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  alternative: самое святое место
  rationale: Выбранный вариант сохраняет форму еврейского выражения и его храмовый смысл, не устраняя присущую ему идиоматическую усилительность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Тире помогает естественно раскрыть последовательное уточнение места, выраженное в еврейском тексте повтором אֶל. Слово «храм» выбрано контекстуально вместо буквального «дом», чтобы избежать неясности для современного читателя.
