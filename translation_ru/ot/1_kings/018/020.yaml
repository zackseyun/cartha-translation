  text: И Ахав разослал весть всем сынам Израиля и собрал пророков на горе Кармил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем израильтянам». Буквально: «всем сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Передаёт обычное значение שׁלח без добавления в основном тексте подразумеваемых слов «весть» или «людей».
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: ко всем сынам Израиля
  rationale: Сохраняет буквальный родственный оборот בְּנֵי יִשְׂרָאֵל и понимает בְּ как указание адресата после глагола «послал»; более естественный вариант дан в сноске.
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Прямое и естественное соответствие глаголу קבץ в значении собирания людей в одном месте.
- source_word: הַנְּבִיאִים
  choice: пророков
  rationale: Стандартное соответствие древнееврейскому נְבִיאִים; определённость в русском языке передаётся контекстом.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: на горе Кармил
  rationale: По-русски направление после «собрал» естественно выражается сочетанием «на горе»; «Кармил» передаёт еврейское כַּרְמֶל.
