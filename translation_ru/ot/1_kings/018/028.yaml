  verdict: revise
  source_fidelity: 'Основной смысл передан верно: громкое взывание, ритуальное самоповреждение, обычай, мечи и копья и предел действия сохранены. Однако сочетание «стали громко взывать ... и наносили» неоправданно смешивает начинательный совершенный вид с несовершенным повествовательным; более ровное русское повествование лучше передать двумя несовершенными формами. «По ним» при крови возможно, но «по их телам» яснее выражает, что кровь текла на их телах, не добавляя нового смысла.'
  naturalness: Перевод в целом современный и понятный. Исправленная видовая пара делает фразу естественнее, а «по их телам» устраняет небольшую шероховатость и возможное ложное впечатление, будто кровь текла лишь рядом с ними.
  terminology: «Взывать», «наносить себе порезы», «мечи и копья» адекватны и соответствуют регистру. «По своему обычаю» удачно передаёт כְּמִשְׁפָּטָם как установившуюся практику, без навязывания юридического или конфессионального смысла.
