  - marker: b
    text: 'Или: «по установленному у них порядку»; «как у них было принято».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ בְּקוֹל גָּדוֹל
  choice: стали громко взывать
  rationale: В контексте обращения к Ваалу קרא обозначает настойчивый громкий призыв; русское «взывать» естественно передаёт религиозное обращение и напряжённость сцены.
- source_word: וַיִּתְגֹּדְדוּ
  choice: наносили себе порезы
  rationale: Возвратная форма обозначает ритуальное самоповреждение посредством рассечения кожи. Формулировка ясна современному читателю и не усиливает образ сверх еврейского текста.
- source_word: כְּמִשְׁפָּטָם
  choice: по своему обычаю
  rationale: מִשְׁפָּט здесь указывает на установленный ими ритуальный обычай или практику, а не на судебное решение.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: мечами и копьями
  rationale: Предлог ב обозначает орудие действия; «копья» — обычный современный эквивалент רְמָחִים.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: пока кровь не полилась по ним
  rationale: Конструкция с עַד выражает предел действия, а שׁפך сохраняет образ льющейся крови. «По ним» передаёт עֲלֵיהֶם применительно к крови на их телах.
