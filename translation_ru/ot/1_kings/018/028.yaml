  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: ru
  text: Они громко взывали и, по своему обычаю[b], наносили себе порезы[a] мечами и копьями, пока кровь не полилась по их телам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассекали себя». Еврейское слово обозначает ритуальное нанесение себе порезов.'
