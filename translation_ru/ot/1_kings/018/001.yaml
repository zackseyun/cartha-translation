base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: ru
  text: 'По прошествии многих дней, в третий год, слово Яхве пришло к Илии: «Пойди, покажись Ахаву, и Я дам дождь на землю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пошлю дождь на землю». Буквально: «дам дождь на поверхность земли».'
    reason: Лексическая альтернатива для «дам дождь» и пояснение буквального еврейского оборота «на פני земли».
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: Спустя много дней
  rationale: Передаёт переход к новому эпизоду и продолжительный промежуток времени без архаичного русского оборота «и было» в начале фразы.
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: было слово Яхве к
  rationale: Сохраняет характерную пророческую формулу и остаётся понятным в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: на третий год
  rationale: Естественный русский способ обозначить время события; не уточняет сверх текста, от какого именно момента отсчитывается год.
- source_word: הֵרָאֵה אֶל אַחְאָב
  choice: покажись Ахаву
  rationale: Точно передаёт повелительную форму со значением «дай себя увидеть, явись».
- source_word: וְאֶתְּנָה מָטָר
  choice: и Я дам дождь
  rationale: Сохраняет основное значение глагола נתן — «дать» — и образ дождя как дара Бога.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на землю
  rationale: Естественно передаёт смысл еврейского пространственного оборота; буквальный образ «на лицо земли» приведён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Божье действие в отношении дождя
  choice: Я дам дождь
  alternative: Я пошлю дождь
  rationale: Выбор сохраняет буквальное значение נתן и не ослабляет представление о дожде как о Божьем даре; более идиоматичный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис пророческой формулы сохранён, но архаизмы сведены к минимуму. Маркер сноски помещён при словах о дожде, к которым относится примечание.
