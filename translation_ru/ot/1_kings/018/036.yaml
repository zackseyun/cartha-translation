base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: ru
  text: 'Когда настало время возношения хлебного приношения, пророк Илия подошёл и сказал: «Яхве, Бог Авраама, Исаака и Израиля[a]! Пусть сегодня станет известно, что Ты — Бог в Израиле, что я — Твой слуга и что по Твоему слову[b] я сделал всё это».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит «Израиль», а не более привычное в формуле имён патриархов «Иаков».
    reason: alternative_reading
  - marker: b
    text: 'Или: «Твоим словом»; также возможно: «по Твоему повелению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: когда настало время возношения хлебного приношения
  rationale: Инфинитив עלה обозначает возношение приношения, а מִנְחָה — прежде всего хлебное приношение. Формулировка передаёт как временную конструкцию, так и культовый смысл, не добавляя отсутствующего в тексте указания на вечер.
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Естественно передаёт конкретное приближение Илии и сохраняет торжественный контекст без излишней архаизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Бог Авраама, Исаака и Израиля
  rationale: Следует точному чтению еврейского текста, где употреблено имя «Израиль», а не более привычное в этой формуле «Иаков».
- source_word: הַיּוֹם יִוָּדַע
  choice: пусть сегодня станет известно
  rationale: Нифаль имперфекта здесь имеет молитвенно-пожелательное значение; русская конструкция ясно передаёт просьбу.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Бог в Израиле
  rationale: Сохраняет прямое значение предлога ב и не уточняет сверх текста, идёт ли речь о пребывании среди Израиля или власти над ним.
- source_word: עַבְדֶּךָ
  choice: Твой слуга
  rationale: В контексте пророческого служения «слуга» естественно выражает положение посланника, исполняющего поручение Бога.
- source_word: וּבִדְבָרֶךָ
  choice: по Твоему слову
  rationale: Предлог ב допускает нормативный и инструментальный оттенки. «По Твоему слову» естественно передаёт действие в соответствии с Божьим повелением, сохраняя возможный оттенок «Твоим словом».
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: я сделал всё это
  rationale: דברים здесь означает дела или обстоятельства, а не произнесённые слова; русская фраза кратка и ясна.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Имя третьего патриарха в формуле
  choice: Израиль
  alternative: Иаков
  rationale: Масоретский текст прямо читает «Израиль». Перевод не гармонизирует эту форму с более привычной формулой «Авраама, Исаака и Иакова».
- issue: Смысл בְּיִשְׂרָאֵל
  choice: в Израиле
  alternative: над Израилем; среди Израиля
  rationale: Буквальная и естественная передача сохраняет широту отношения, выраженного предлогом ב, не сводя его исключительно к власти или пространственному присутствию.
