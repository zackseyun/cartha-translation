base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: ru
  text: Ахав поднялся, чтобы есть и пить, а Илия поднялся на вершину Кармила[a], склонился к земле и положил лицо между коленями.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на вершину горы Кармил». Слово «гора» в еврейском тексте этого стиха прямо не выражено.'
    reason: lexical_alternative
  - marker: b
    text: Здесь описана поза Илии. Из более широкого контекста можно заключить, что он молился, однако в самом стихе молитва прямо не названа.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: пошёл
  rationale: Обычный повествовательный глагол עלה передаёт движение вверх; по-русски в связи с целью «есть и пить» естественно сказать «пошёл», тогда как направление явно выражено далее при описании Илии.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: есть и пить
  rationale: Инфинитивы выражают цель; краткая русская конструкция естественна и сохраняет оба действия.
- source_word: וְאֵלִיָּהוּ
  choice: а Илия
  rationale: Еврейский союз буквально означает «и», однако здесь сопоставляет действия Ахава и Илии. Русское «а» естественно передаёт это сопоставление, не усиливая его до резкого противопоставления.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: поднялся на вершину Кармила
  rationale: רֹאשׁ буквально «голова», здесь идиоматически «вершина». Глагол «поднялся» сохраняет направленность עלה; слово «гора» не добавлено, поскольку его нет в стихе.
- source_word: וַיִּגְהַר אַרְצָה
  choice: склонился к земле
  rationale: Редкий глагол גהר описывает низко согнутую позу. Формулировка передаёт телесное действие и не добавляет прямо не названных молитвы или поклонения.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין ברכו
  choice: положил лицо между коленями
  rationale: Конкретное описание позы Илии передано близко к еврейскому тексту. По смыслу предполагается «своими коленями», но русский возвратный притяжательный элемент можно естественно опустить.
theological_decisions:
- issue: Следует ли прямо назвать позу Илии молитвой
  choice: Сохранить только описание телесной позы.
  alternative: «склонился в молитве» или «стал молиться, опустив лицо между коленями»
  rationale: Контекст позволяет видеть здесь молитву, но сам стих говорит лишь о движениях и позе Илии. Добавление слова «молитва» сняло бы сохраняемую исходным текстом недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся простым и повествовательным; конкретность исходного описания сохранена без конфессионально окрашенных добавлений.
