  language: en
  yaml_path: translation/ot/1_kings/018/033.yaml
  text: Then he arranged the wood, cut the bull into pieces, and placed it on the wood.
translation:
  language: ru
  text: Затем он разложил дрова, рассёк быка на части и положил его на дрова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: разложил
  rationale: Глагол ערך здесь означает упорядоченно расположить дрова для жертвоприношения; «разложил» естественно передаёт это действие по-русски.
- source_word: הָעֵצִים
  choice: дрова
  rationale: В данном контексте собирательное значение — древесина, приготовленная как топливо для жертвенника; русское «дрова» точно и естественно.
- source_word: וַיְנַתַּח
  choice: рассёк … на части
  rationale: Глагол נתּח обозначает разделение туши жертвенного животного на части; «рассёк на части» сохраняет ритуальный контекст и достоинство стиля.
- source_word: הַפָּר
  choice: быка
  rationale: Существительное פַּר обычно обозначает быка, особенно в контексте жертвоприношения; указание на молодость здесь не обязательно.
- source_word: וַיָּשֶׂם
  choice: положил
  rationale: Глагол שׂים означает поместить или положить; «положил» естественно описывает размещение частей жертвы.
- source_word: עַל הָעֵצִים
  choice: на дрова
  rationale: 'Предлог עַל здесь выражает простое пространственное отношение: части быка помещены поверх дров.'
