  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: ru
  text: 'Илия сказал: «Жив Яхве Воинств, перед Которым я стою! Сегодня я непременно предстану перед Ахавом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явлюсь ему» или «покажусь ему». В еврейском тексте: «ему»; имеется в виду Ахав. Глагол может означать «явиться», «показаться» или «предстать перед кем-либо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохраняет обычную еврейскую формулу клятвы и её торжественную силу в естественной для библейского русского языка форме.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя и широкий смысл צְבָאוֹת, не сужая его исключительно до земных армий.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: пред Которым я стою
  rationale: Сохраняет образ служения в присутствии высшего Владыки и пророческую придворную лексику оригинала.
- source_word: כִּי הַיּוֹם
  choice: сегодня непременно
  rationale: В контексте клятвы כִּי вводит твёрдое заверение; «непременно» естественно выражает его усилительный оттенок.
- source_word: אֵרָאֶה אֵלָיו
  choice: предстану перед Ахавом
  rationale: Нифаль глагола ראה здесь означает явиться, показаться или представить себя адресату; «предстану» ясно передаёт намеренное появление перед царём. Имя Ахав эксплицирует местоимение из непосредственного контекста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл стояния перед Яхве
  choice: пред Которым я стою
  alternative: Которому я служу
  rationale: Буквальная образность допускает значение служения, но не сводится к нему; поэтому сохранена содержательная многозначность выражения.
translation_notes:
  register: Современный литературный русский язык с торжественностью клятвенной формулы. Синтаксис сохраняет образность еврейского текста; имя Ахав введено для ясности, а буквальная местоименная форма отмечена в сноске.
