  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: ru
  text: 'А теперь ты говоришь: «Пойди, скажи твоему господину: „Вот Илия“», — и он убьёт меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Естественно передаёт переход к нынешней ситуации и сохраняет соединительное значение еврейского выражения.
- source_word: לַאדֹנֶיךָ
  choice: моему господину
  rationale: Речь идёт о земном господине Авдия, царе Ахаве; строчная буква исключает смешение с божественным титулом.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Вот Илия
  rationale: Кратко и непосредственно передаёт указательное הִנֵּה, не добавляя отсутствующего в еврейском тексте глагола «здесь».
- source_word: וַהֲרָגָנִי
  choice: и он убьёт меня
  rationale: Сохраняет местоименно подразумеваемого субъекта и страх говорящего перед ожидаемым последствием.
theological_decisions:
- issue: Кого обозначает «он» в заключительной части
  choice: Сохранено местоимение «он» без явного называния Ахава
  alternative: «и Ахав убьёт меня»
  rationale: Контекст указывает на Ахава, однако исходный текст не называет его здесь прямо; перевод сохраняет форму и естественную связность оригинала.
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно и сохраняет настойчивость и тревогу Авдия. Вложенные кавычки разграничивают слова Илии и сообщение, которое Авдий должен передать.
