  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: ru
  text: А теперь пошли и собери ко мне весь Израиль на гору Кармил[a], а также четыреста пятьдесят пророков Ваала и четыреста пророков Ашеры[b], которые едят за столом Иезавели[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к горе Кармил»; еврейский предлог указывает на движение к месту сбора.'
    reason: lexical_alternative
  - marker: b
    text: «Ашера» может обозначать богиню либо, в некоторых контекстах, связанный с ней культовый предмет. Здесь параллель с Ваалом говорит в пользу имени богини.
    reason: cultural_note
  - marker: c
    text: То есть находятся на содержании Иезавели и пользуются её царским покровительством.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет соединительный оттенок וְ и вводит непосредственное повеление Илии естественным современным оборотом.
- source_word: שְׁלַח קְבֹץ
  choice: пошли и собери
  rationale: 'Передаёт два императива: Ахав должен разослать распоряжения и собрать народ; русский синтаксис сохраняет краткость и последовательность действий.'
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямо передаёт направление к Илии, не заменяя его более толковательным «предо мной».
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохраняет коллективное национальное обозначение и риторический размах еврейского выражения.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: на гору Кармил
  rationale: Предлог אֶל обозначает движение к месту сбора; в русском языке направление на гору естественно выражается конструкцией «на гору».
- source_word: נְבִיאֵי הַבַּעַל
  choice: пророков Ваала
  rationale: Ясно передаёт принадлежность или служение пророков Ваалу и соответствует принятой русской форме имени.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: четыреста пятьдесят
  rationale: Число передано словами в литературном библейском тексте.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: пророков Ашеры
  rationale: Параллель с пророками Ваала благоприятствует пониманию Ашеры как имени божества; спорное толкование не вносится в основной текст.
- source_word: אַרְבַּע מֵאוֹת
  choice: четыреста
  rationale: Число передано словами последовательно с предыдущим числительным.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: которые едят за столом Иезавели
  rationale: Сохраняет конкретный образ еврейского текста; подразумеваемое царское содержание и покровительство пояснены в сноске, а не подменяют перевод.
theological_decisions:
- issue: Значение אֲשֵׁרָה в данном стихе
  choice: 'Имя богини: «Ашера»'
  alternative: Культовый предмет, связанный с Ашерой, например священный столб
  rationale: Синтаксический параллелизм с «пророками Ваала» сильнее поддерживает личное божественное имя. Сноска сохраняет известную лексическую неоднозначность.
- issue: Объём выражения «весь Израиль»
  choice: Сохранено коллективное выражение «весь Израиль»
  alternative: Все израильтяне
  rationale: Еврейская формула обозначает народ в его совокупности и несёт риторическую широту; перевод не уточняет без основания, присутствовал ли буквально каждый человек.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы «Кармил», «Ваал», «Ашера», «Иезавель» соответствуют устойчивой русской библейской передаче. Конкретные образы оригинала сохранены, а культурные и лексические пояснения вынесены в сноски.
