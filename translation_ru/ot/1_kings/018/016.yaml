  text: וַ/יֵּ֧לֶךְ עֹבַדְיָ֛הוּ לִ/קְרַ֥את אַחְאָ֖ב וַ/יַּגֶּד ל֑/וֹ וַ/יֵּ֥לֶךְ אַחְאָ֖ב לִ/קְרַ֥את אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/016.yaml
  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: ru
  text: И пошёл Авдия навстречу Ахаву и сообщил ему[a]. Тогда Ахав пошёл навстречу Илии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доложил ему». Еврейский глагол может означать «сказать», «сообщить» или «доложить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Форма от הלך последовательно развивает повествование и здесь имеет обычное значение движения; «пошёл» естественно и не добавляет отсутствующих в тексте оттенков.
- source_word: עֹבַדְיָהוּ
  choice: Авдия
  rationale: Традиционная русская библейская передача личного имени, уместная в современном литературном тексте.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Оборот обозначает направленное движение к человеку ради встречи; русское «пойти навстречу» кратко и идиоматично передаёт оба употребления.
- source_word: אַחְאָב
  choice: Ахав
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: וַיַּגֶּד לוֹ
  choice: сообщил ему
  rationale: Глагол נגד в породе hифиль может означать «сказать, сообщить, доложить». Выбор сохраняет значение передачи сведений и не уточняет подразумеваемое содержание сообщения.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: Тогда Ахав пошёл
  rationale: Последовательная глагольная форма продолжает цепь событий; «тогда» естественно обозначает повествовательную последовательность по-русски.
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Устоявшаяся русская библейская передача личного имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и последовательности еврейского повествования. Союз в начале стиха передан как «И», а следующая последовательная форма — естественным русским «тогда»; содержание сообщения, не названное в еврейском тексте, не добавлено.
