base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: ru
  text: Ответь мне, Яхве, ответь мне, чтобы этот народ узнал, что Ты, Яхве, — Бог и что Ты обратил их сердце[a] вспять[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их сердце» — единственное число, употреблённое собирательно обо всём народе; возможно также перевести: «их сердца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обратно». Выражение обычно понимают как возвращение народа к Яхве, однако буквально направление «к Себе» здесь не названо.'
    reason: ambiguity
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Ответь мне
  rationale: В контексте молитвы глагол ענה обозначает ответ Бога, проявленный в действии. Повтор сохранён как настойчивая просьба.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяется титулом «Господь».
- source_word: וְיֵדְעוּ
  choice: чтобы ... узнал
  rationale: Сочетание союза с имперфектом здесь естественно выражает цель или ожидаемый результат просьбы Илии.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохранено собирательное единственное число עם; по-русски сочетание звучит естественно.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: что Ты, Яхве, — Бог
  rationale: Фраза исповедует Яхве истинным Богом в противопоставлении Ваалу. Русское «— Бог» естественно передаёт сказуемое, не превращая личное имя и титул в составное именование.
- source_word: הֲסִבֹּתָ
  choice: повернул
  rationale: Каузативная форма сохраняет прямое действие Бога; перфект передан прошедшим временем, без ослабления до дозволения или возможности.
- source_word: אֶת לִבָּם
  choice: их сердце
  rationale: Сохранено еврейское единственное число, которое коллективно относится ко всему народу.
- source_word: אֲחֹרַנִּית
  choice: назад
  rationale: Наречие буквально обозначает движение назад или обратно. Нейтральное «назад» сохраняет образ и не добавляет отсутствующее в тексте «к Себе».
theological_decisions:
- issue: Действие Бога в обращении народа
  choice: Ты повернул их сердце назад
  alternative: Ты вернул их сердца к Себе
  rationale: Основной текст сохраняет совершённое действие и сильное утверждение о Божьей инициативе, но не добавляет направление «к Себе», которого буквально нет в еврейской фразе. Тем самым не устраняется напряжение и возможная двусмысленность выражения.
- issue: Определённость в выражении הָאֱלֹהִים
  choice: Ты, Яхве, — Бог
  alternative: Ты, Яхве, — тот Бог
  rationale: Артикль может подчёркивать, что именно Яхве является истинным Богом, однако буквальное «тот Бог» по-русски звучит неестественно и способно привнести указательный оттенок. Контраст с Ваалом достаточно ясно передаётся формой «— Бог».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Синтаксический параллелизм и повтор оригинала сохранены; архаизмы и конфессионально закреплённая замена имени Яхве титулом не используются.
