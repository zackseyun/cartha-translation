  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: ru
  text: 'В седьмой раз он сказал: «Смотри: от моря поднимается небольшое облако, величиной с ладонь человека[a]». Тогда он сказал: «Поднимись и скажи Ахаву: „Запрягай[b] и спускайся, чтобы дождь тебя не задержал[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно ладонь человека».'
    reason: Лексема כַּף означает «ладонь» или «кисть руки»; сравнение может описывать размер или очертание облака.
  - marker: b
    text: То есть запряги или подготовь колесницу и упряжку к поездке.
    reason: 'Культурно-контекстуальное пояснение: в еврейском тексте объект действия не назван прямо.'
  - marker: c
    text: 'Или: «чтобы дождь не помешал тебе»; буквально — «не удержал тебя».'
    reason: Глагол עצר допускает оттенки «задерживать», «удерживать» и «препятствовать».
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: В седьмой раз
  rationale: В контексте речь идёт о седьмом выходе слуги посмотреть в сторону моря. Русское выражение естественно передаёт повторяемое действие без архаического вводного оборота.
- source_word: הִנֵּה
  choice: Смотри
  rationale: Передаёт указание на только что замеченное явление и сохраняет непосредственность реплики.
- source_word: עָב קְטַנָּה
  choice: небольшое облако
  rationale: Точно и естественно передаёт размер облака; «небольшое» соответствует достоинству литературного повествования лучше разговорного «маленькое».
- source_word: כְּכַף אִישׁ
  choice: с мужскую ладонь
  rationale: Идиоматическое русское сравнение ясно выражает видимый размер облака и сохраняет мужской референт אִישׁ.
- source_word: עֹלָה מִיָּם
  choice: от моря поднимается
  rationale: Причастная форма описывает продолжающееся движение; порядок слов естественен по-русски и акцентирует направление появления облака.
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Сохраняет направительное значение императива, а не сводит его к общему «иди».
- source_word: אֱסֹר
  choice: Запрягай
  rationale: В данном контексте глагол «связывать, привязывать» обозначает подготовку упряжки или колесницы к поездке. Русский непереходный императив естественно передаёт эту дорожную команду.
- source_word: וָרֵד
  choice: и спускайся
  rationale: Передаёт повеление двигаться вниз с Кармила и сохраняет топографическую направленность.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: чтобы дождь тебя не задержал
  rationale: עצר здесь означает задержать или воспрепятствовать движению. Формулировка сохраняет практический смысл предупреждения, не утверждая, что дождь непременно полностью остановит Ахава.
