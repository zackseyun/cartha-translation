translation_notes:
  register: Современный литературный русский язык с краткими, энергичными репликами. Повторение «он сказал» сохраняет формальную неопределённость подлежащего в еврейском повествовании; из контекста вторую реплику произносит Илия. Архаизмы и конфессионально маркированная лексика не используются.
