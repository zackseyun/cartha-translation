base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: ru
  text: 'Когда весь народ увидел это, все пали ниц и сказали: «Яхве — Он Бог[a]! Яхве — Он Бог!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте перед словом «Бог» стоит определённый артикль; в контексте он указывает на Яхве как на истинного Бога в противопоставлении Ваалу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: Когда весь народ увидел это
  rationale: Глагол וַיַּרְא означает «увидел»; дополнение «это», подразумеваемое контекстом, естественно отсылает к только что явленному огню и всему произошедшему.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: все пали ниц
  rationale: 'Устойчивое современное русское выражение передаёт буквальный образ падения лицом к земле и смысл благоговейного поклонения. Повтор «все» делает русскую фразу ясной: действие относится ко всему народу.'
- source_word: וַיֹּאמְרוּ
  choice: сказали
  rationale: Нейтральный глагол точно передаёт обычный еврейский глагол речи, не добавляя отсутствующего в тексте указания на громкость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Яхве и титулом «Бог», существенное в противопоставлении Ваалу.
- source_word: הוּא
  choice: Он
  rationale: Отдельное местоимение в еврейском тексте имеет усилительную функцию; его сохранение по-русски подчёркивает исповедание народа.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Форма с артиклем указывает на истинного Бога в противопоставлении Ваалу; в современном русском предикативное «Бог» передаёт это естественнее, чем буквальное «этот Бог» или «тот самый Бог».
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Яхве — Он Бог!
  rationale: Конструкция с тире и сохранённым местоимением передаёт эмфатический строй еврейской фразы; восклицательный знак уместно выражает кульминационный характер дважды повторённого признания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено личное имя Бога. «Яхве» сохраняет имя и ясно показывает противопоставление Яхве Ваалу, не заменяя имя титулом.
- issue: Значение определённой формы הָאֱלֹהִים
  choice: Бог с пояснением в сноске
  alternative: истинный Бог; тот самый Бог
  rationale: Артикль в данном контексте выделяет Яхве как Бога в противоположность Ваалу, но добавление слова «истинный» в основной текст сделало бы подразумеваемый смысл явным сверх формы оригинала. Краткая сноска сохраняет и естественность, и смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. «Пали ниц» сохраняет достоинство и телесную конкретность сцены; повтор исповедания воспроизведён полностью.
