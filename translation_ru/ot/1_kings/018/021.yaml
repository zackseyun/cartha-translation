  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: ru
  text: 'Илия подошёл к народу и сказал[a]: «До каких пор вы будете хромать между двумя ветвями? Если Яхве — Бог, следуйте за Ним; а если Ваал — следуйте за ним». Но народ не ответил ему ни слова.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. образ буквально говорит о хромоте «на/между двумя ветвями (разветвлениями, развилками)». Вероятно, это образ колебания или разделённой верности; возможно также: «колебаться между двумя мнениями».'
    reason: Сохраняет конкретный и неоднозначный образ еврейского выражения פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים, отмечая контекстуальное понимание без подмены им текста.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Передаёт обычное значение глагола נגשׁ — приблизиться, подойти — естественным современным русским словом.
- source_word: כָּל הָעָם
  choice: ко всему народу
  rationale: Сохраняет собирательный характер выражения и полноту обращения Илии.
- source_word: עַד מָתַי
  choice: До каких пор
  rationale: Естественная русская формула настойчивого вопроса с оттенком упрёка.
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: будете хромать между двумя путями
  rationale: «Хромать» сохраняет конкретный образ неустойчивого движения в פסח. «Два пути» естественно выражают раздвоенность и необходимость выбора, тогда как буквальные «две ветви/развилки» по-русски затемняли бы метафору; неоднозначность исходного образа отмечена в сноске.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Если Яхве — Бог
  rationale: Сохраняет личное имя יהוה и предикативную конструкцию, в которой ставится вопрос об истинной божественности.
- source_word: לְכוּ אַחֲרָיו
  choice: следуйте за Ним / следуйте за ним
  rationale: Естественно передаёт идиому «идти за», означающую верность и подчинение; различие регистра в местоимениях помогает русскому читателю различать Яхве и Ваала, не изменяя содержания.
- source_word: הַבַּעַל
  choice: Ваал
  rationale: В русском языке имя этого божества обычно употребляется без артикля.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: Но народ не ответил ему ни слова
  rationale: Сохраняет подчёркнутое полное молчание народа; «но» естественно передаёт контекстуальное противопоставление.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет Тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Образ раздвоенной верности в פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: сохранить образ хромоты, передав раздвоение как «между двумя путями»
  alternative: колебаться между двумя мнениями; хромать на оба колена; хромать между двумя ветвями
  rationale: Выбор сохраняет телесный образ неустойчивости и одновременно остаётся понятным по-русски. Сноска сообщает более буквальные варианты и не сводит образ к одному отвлечённому толкованию.
- issue: Эллипсис в וְאִם הַבַּעַל
  choice: «а если Ваал» без добавления слова «Бог»
  alternative: «а если Ваал — Бог»
  rationale: Так сохраняется краткость и синтаксический эллипсис еврейского текста; подразумеваемое сказуемое ясно из первой части противопоставления.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Реплика краткая и резкая; архаизмы исключены. Прописное «Ним» при Яхве соответствует распространённой русской издательской норме, строчное «ним» при Ваале устраняет возможную референциальную неясность.
