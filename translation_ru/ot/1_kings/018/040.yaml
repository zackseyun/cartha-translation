base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: ru
  text: 'Тогда Илия сказал им[a]: «Схватите пророков Ваала! Пусть ни один из них не ускользнёт». Они схватили их, и Илия свёл их вниз, к потоку Кишон[b], и заколол их там.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть ни один человек не ускользнёт из них». То есть: «пусть ни один из них не ускользнёт».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к руслу Кишона», «к вади Кишон». Еврейское на́хал может означать поток, русло сезонного водотока или вади.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: Схватите
  rationale: Повелительная форма множественного числа передаёт настойчивый приказ силой задержать пророков; «схватите» звучит кратко и естественно.
- source_word: נְבִיאֵי הַבַּעַל
  choice: пророков Ваала
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции без пояснительного расширения.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: Пусть ни один из них не ускользнёт
  rationale: 'Мужской род единственного числа употреблён распределительно: речь о том, чтобы не ушёл ни один человек из этой группы. «Не ускользнёт» сохраняет значение бегства и срочность приказа.'
- source_word: וַיִּתְפְּשׂוּם
  choice: Они схватили их
  rationale: Повтор того же русского глагола сохраняет лексическую связь между приказом и его исполнением.
- source_word: וַיּוֹרִדֵם
  choice: отвёл их вниз
  rationale: Каузативная форма глагола ירד означает, что Илия повёл или доставил их вниз; русский оборот сохраняет направление движения, не уточняя его способ.
- source_word: נַחַל קִישׁוֹן
  choice: к потоку Кишон
  rationale: נַחַל может обозначать поток, русло сезонного водотока или вади. «Поток» — понятное современному русскому читателю географическое обозначение, а примечание сохраняет широту значения.
- source_word: וַיִּשְׁחָטֵם
  choice: заколол их
  rationale: שׁחט обозначает заклание или убой и здесь требует прямой, не смягчающей насилие передачи; «заколол» сохраняет конкретную резкость глагола лучше, чем общее «убил».
- source_word: שָׁם
  choice: там
  rationale: Прямая передача наречия места.
theological_decisions:
- issue: Описание насильственной расправы над пророками Ваала
  choice: Прямо передать, что Илия заколол их, без смягчения и без добавления нравственной или богословской оценки.
  alternative: Передать как «казнил» или «предал смерти» либо добавить указание на божественное повеление.
  rationale: Еврейский текст прямо повествует о захвате и заклании, но в этом стихе не формулирует дополнительного обоснования. Перевод сохраняет суровость события и не вносит отсутствующих в тексте утверждений.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым повествовательным ритмом. Повеление передано естественно и резко; насилие исходного текста не смягчено. Название «Кишон» оставлено несклоняемым после родового обозначения «поток».
