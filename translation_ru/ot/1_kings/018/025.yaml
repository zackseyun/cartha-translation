base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: ru
  text: 'Тогда Илия сказал пророкам Ваала: «Выберите себе одного тельца и первыми приготовьте его, потому что вас много. Затем призовите имя вашего бога[a], но огня не подкладывайте[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «призвать имя» означает обратиться к божеству, взывая к нему или прося его о помощи.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «огня не кладите». Древнееврейский текст не уточняет, куда именно его не следует класть; связь с жертвой ясна из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: пророкам Ваала
  rationale: Сопряжённая конструкция прямо обозначает пророков, принадлежащих культу Ваала.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: выберите себе одного тельца
  rationale: Фраза указывает на одного из двух ранее упомянутых тельцов; «себе» сохраняет значение לָכֶם.
- source_word: וַעֲשׂוּ רִאשֹׁנָה
  choice: и приготовьте его первыми
  rationale: В жертвенном контексте עשה означает подготовить животное, а רִאשֹׁנָה указывает, что пророки Ваала должны сделать это раньше Илии.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: потому что вас много
  rationale: Сохраняется прямо выраженная причина, по которой им предоставлено действовать первыми.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: затем призовите имя вашего бога
  rationale: Сохраняется древнееврейская идиома «призывать имя», то есть обращаться к божеству с мольбой; единственное число соответствует Ваалу в непосредственном контексте.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: но огня не подкладывайте
  rationale: «Подкладывать огонь» естественно передаёт запрет помещать огонь к приготовленной жертве, не превращая его в более широкое «не зажигайте».
theological_decisions:
- issue: Число существительного אֱלֹהֵיכֶם применительно к Ваалу
  choice: вашего бога
  alternative: ваших богов
  rationale: Хотя форма אֱלֹהִים внешне множественная, непосредственный референт — Ваал, названный в единственном числе; перевод во множественном числе внёс бы не заявленную здесь множественность божеств.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранена библейская идиома «призвать имя», снабжённая пояснением; неявное в оригинале место огня не добавлено как отдельный предмет или конструкция.
