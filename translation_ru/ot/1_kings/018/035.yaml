  text: Вода потекла вокруг жертвенника[a], и ров он также наполнил[b] водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вода пошла вокруг жертвенника»; еврейский глагол «идти» здесь описывает движение воды.'
