lexical_decisions:
- source_word: וַיֵּלְכוּ הַמַּיִם
  choice: Вода растеклась
  rationale: Глагол הָלַךְ буквально означает «идти», но при воде естественно обозначает её движение. «Растеклась» передаёт картину ясно и современно, не добавляя идеи стремительного потока.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: вокруг жертвенника
  rationale: Точно передаёт окружающее жертвенник пространство; русское «вокруг» естественно выражает охват со всех сторон.
- source_word: אֶת־הַתְּעָלָה
  choice: ров
  rationale: В данном эпизоде תְּעָלָה — вырытая вокруг жертвенника канава или траншея. «Ров» краток, понятен и соответствует её назначению.
- source_word: מִלֵּא מָיִם
  choice: наполнился водой
  rationale: Естественная русская формулировка передаёт результат действия и позволяет не определять в основном тексте явно не названного деятеля при еврейском переходном глаголе.
theological_decisions:
- issue: Кто наполнил ров водой во второй части стиха
  choice: 'Безличная по отношению к деятелю формулировка: «ров также наполнился водой»'
  alternative: «И также он наполнил ров водой»
  rationale: В масоретском тексте מִלֵּא — переходная форма мужского рода единственного числа, буквально «он наполнил», однако деятель прямо не назван. Контекст допускает отнесение действия к Илии, тогда как общий ход сцены подчёркивает движение воды. Основной текст сохраняет событие, не устраняя эту синтаксическую напряжённость; буквальная конструкция указана в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и достойным звучанием. Формулировка избегает неестественного «вода пошла», но сохраняет буквальный вариант в примечании; синтаксическая неоднозначность второй части не разрешена догматически.
