  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: ru
  text: Когда Иезавель истребляла пророков Яхве[a], Авдий взял сто пророков, спрятал их по пятьдесят человек в пещере[b] и снабжал их хлебом и водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничтожала»; букв. «отсекала» пророков Яхве.'
    reason: Сноска сохраняет буквальный образ глагола כרת и указывает его контекстуальный смысл.
  - marker: b
    text: 'Букв.: «пятьдесят человек в пещере». Вероятно, имеются в виду две группы по пятьдесят человек, спрятанные в разных пещерах.'
    reason: Еврейская формулировка использует единственное число «пещера», но по смыслу, вероятно, распределяет сто пророков на две группы; вывод не следует делать безоговорочной частью перевода.
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: Когда … истребляла
  rationale: Конструкция с היה и инфинитивом вводит временной фон. Глагол כרת буквально означает «отсекать», но здесь имеет смысл уничтожения людей; несовершенный вид передаёт продолжавшееся действие.
- source_word: אִיזֶבֶל
  choice: Иезавель
  rationale: Устоявшаяся русская форма личного имени.
- source_word: נְבִיאֵי יְהוָה
  choice: пророков Яхве
  rationale: Сопряжённая конструкция передана естественным русским родительным оборотом; личное имя Бога сохранено как «Яхве».
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое значение לקח сохранено без добавления невыраженных подробностей; контекст показывает, что Авдий взял пророков под свою защиту.
- source_word: עֹבַדְיָהוּ
  choice: Авдий
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: מֵאָה נְבִאִים
  choice: сто пророков
  rationale: Прямая и ясная передача числительного и существительного.
- source_word: וַיַּחְבִּיאֵם
  choice: спрятал их
  rationale: Естественная современная передача каузативной формы חבא — «скрыл, спрятал».
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: по пятьдесят человек в пещере
  rationale: Формулировка сохраняет необычное единственное число «в пещере» и одновременно передаёт распределение пророков группами по пятьдесят; вероятный смысл о разных пещерах разъяснён в сноске, а не внесён безоговорочно в текст.
- source_word: וְכִלְכְּלָם
  choice: снабжая их
  rationale: Форма כלכל обозначает продолжительное обеспечение необходимым. Деепричастная конструкция естественно связывает это действие с укрытием и передаёт его длительность.
- source_word: לֶחֶם וָמָיִם
  choice: хлебом и водой
  rationale: Конкретное выражение переведено буквально и естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, поэтому личное имя передано транслитерацией «Яхве», а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся простым и доступным; тире выделяют уточнение о распределении пророков. Архаизмы и конфессионально маркированные формулы не используются.
