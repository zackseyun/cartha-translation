  terminology: «Пророчествовать», «пророки Ваала» и «хлебное приношение» употреблены последовательно и уместно. «Принесение хлебного приношения» точнее и естественнее, чем «возношение», которое в русском библейском употреблении может вызвать ненужную ассоциацию с особым обрядом возношения.
