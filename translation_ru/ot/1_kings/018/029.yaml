  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: ru
  text: Когда миновал полдень, они продолжали пророчествовать[a] до времени принесения хлебного приношения[b]. Но не было ни голоса, ни ответа, и никто не внимал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжали неистовствовать». Здесь обычный еврейский глагол «пророчествовать» описывает экстатическое поведение пророков Ваала.'
    reason: lexical_alternative
  - marker: b
    text: Эту фразу можно также понимать как указание на время регулярного вечернего приношения.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда
  rationale: Формула וַיְהִי вводит следующий этап повествования; в современном русском её функцию естественно передаёт временная конструкция без тяжеловесного «и было».
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: когда миновал полдень
  rationale: כ с инфинитивом задаёт временную связь, а עֲבֹר указывает, что полдень прошёл.
- source_word: וַיִּתְנַבְּאוּ
  choice: они продолжали пророчествовать
  rationale: Обычный глагол со значением «пророчествовать» здесь описывает длительное экстатическое поведение пророков Ваала. Перевод сохраняет лексическую связь с пророчеством и передаёт продолженность действия.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: до времени возношения хлебного приношения
  rationale: Буквально речь идёт о вознесении/принесении מִנְחָה. «Хлебное приношение» сохраняет культовый смысл термина, тогда как временное понимание регулярного вечернего приношения отмечено в сноске.
- source_word: וְאֵין קוֹל
  choice: не было ни голоса
  rationale: קוֹל может значить «голос» или «звук»; в ожидании ответа божества «голос» наиболее точно сохраняет образ оригинала.
- source_word: וְאֵין עֹנֶה
  choice: ни ответа
  rationale: Причастие עֹנֶה буквально указывает на отсутствие отвечающего; русское «ни ответа» естественно продолжает трёхчастную риторическую последовательность.
- source_word: וְאֵין קָשֶׁב
  choice: ни внимания
  rationale: 'Кָשֶׁב обозначает внимание, прислушивание. Лаконичная формула сохраняет кульминационную мысль: не было даже признака того, что кто-либо внимает.'
theological_decisions:
- issue: Обозначение экстатического поведения пророков Ваала
  choice: продолжали пророчествовать
  alternative: продолжали неистовствовать
  rationale: В еврейском употреблён обычный глагол «пророчествовать». Основной текст сохраняет этот факт и повествовательную иронию, не подменяя его более оценочным толкованием; контекстуальная альтернатива дана в сноске.
- issue: Значение времени מִנְחָה
  choice: до времени возношения хлебного приношения
  alternative: до времени регулярного вечернего приношения
  rationale: Слово прямо называет приношение, но в повествовании формула может также обозначать установленное время дневного жертвоприношения. Основной текст не добавляет отсутствующее в оригинале слово «вечернее», а возможное временное понимание сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского; трёхчастное «ни голоса, ни ответа, ни внимания» сохраняет краткость и нарастание еврейской фразы.
