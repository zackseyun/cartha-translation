base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: ru
  text: 'И сказал Илия Ахаву: «Поднимись, ешь и пей, ибо слышен гул дождя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «ибо [есть] звук гула дождя». Еврейское выражение קוֹל הֲמוֹן הַגָּשֶׁם компактно и образно; הֲמוֹן может означать гул, рёв, шум, а также обилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное и естественное русское «И сказал» сохраняет связность рассказа.
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Употреблена устоявшаяся русская библейская форма имени.
- source_word: לְאַחְאָב
  choice: Ахаву
  rationale: Предлог לְ обозначает адресата речи; дательный падеж естественно передаёт это значение по-русски.
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Глагол עלה означает движение вверх; «поднимись» сохраняет пространственный смысл и естественно звучит как повеление.
- source_word: אֱכֹל וּשְׁתֵה
  choice: ешь и пей
  rationale: Прямое соответствие двум повелительным формам без поясняющего расширения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для повеления Илии.
- source_word: קוֹל
  choice: слышен шум
  rationale: קוֹל обозначает звук или шум. Предикативная конструкция «слышен шум» естественна по-русски и сохраняет образ воспринимаемого звука.
- source_word: הֲמוֹן הַגָּשֶׁם
  choice: ливня
  rationale: Сочетание буквально передаёт гул, шум или мощь дождя. «Шум ливня» кратко и образно выражает сильный, приближающийся дождь, не устраняя семантическую неоднозначность без примечания.
theological_decisions:
- issue: Является ли шум дождя уже физически слышимым или пророчески возвещённым
  choice: Формулировка «слышен шум» оставляет высказывание без пояснения механизма восприятия.
  alternative: «Я слышу шум» или «приближается ливень».
  rationale: В еврейском тексте нет выраженного местоимения «я» и нет глагола приближения; перевод не должен разрешать повествовательное напряжение добавлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Краткие повеления сохранены; образная сила заключительной еврейской фразы передана естественным сочетанием «шум ливня».
