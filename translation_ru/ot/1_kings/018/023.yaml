base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: ru
  text: Пусть дадут нам двух быков. Пусть они выберут себе одного из них, рассекут его на части и положат на дрова, но огня не подкладывают[a]. А я приготовлю другого быка, положу его на дрова и не буду подкладывать огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «но огня пусть не кладут». Глагол «подкладывают» передаёт подразумеваемое расположение огня под жертвой, лежащей на дровах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: Пусть дадут нам
  rationale: Форма выражает предложение или условие вызова. Такая передача прямо и естественно сохраняет побудительный смысл.
- source_word: שְׁנַיִם פָּרִים
  choice: двух быков
  rationale: פַּר обозначает быка, особенно часто в жертвенном контексте; указание на возраст в стихе отсутствует.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: Пусть они выберут себе одного быка
  rationale: לָהֶם передано возвратным «себе», а сочетание с числительным указывает на одного из двух быков.
- source_word: וִינַתְּחֻהוּ
  choice: рассекут его на части
  rationale: נתח в контексте приготовления жертвы означает разделить тушу на части; «рассекут» сохраняет достоинство стиля и конкретность действия.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: положат на дрова
  rationale: הָעֵצִים здесь означает приготовленное для огня дерево; русское «дрова» естественно передаёт этот собирательный смысл.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: но огня не подкладывают
  rationale: Буквально сказано «огня не кладут». Глагол «подкладывать» естественно описывает расположение огня относительно жертвы на дровах, не меняя сути запрета.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: А я приготовлю другого быка
  rationale: עשה применительно к жертвенному животному означает приготовить его; «другого» ясно указывает на оставшегося из двух быков.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: положу его на дрова
  rationale: Местоимение «его» восстановлено по очевидному объекту действия и необходимо для естественного русского синтаксиса.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: и тоже не стану подкладывать огонь
  rationale: Передача сохраняет параллель с условием для пророков; «тоже» эксплицирует очевидную симметрию двух приготовлений.
theological_decisions:
- issue: Передача языка приготовления жертвы без привнесения поздней богословской терминологии
  choice: 'Использованы конкретные действия: «рассекут на части», «положат на дрова», «не подкладывают огня»'
  alternative: Передавать действия техническими культовыми терминами, например «устроят» или «принесут в жертву»
  rationale: Стих описывает практические условия испытания на Кармиле, а не развивает учение о жертвоприношении. Конкретная лексика ближе к еврейскому тексту и не добавляет отсутствующих утверждений.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным повествовательным регистром. Синтаксис сохраняет последовательность и параллелизм условий состязания; архаизмы и узкоконфессиональная терминология не используются.
