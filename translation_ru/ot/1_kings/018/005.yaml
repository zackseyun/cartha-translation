base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: ru
  text: 'И сказал Ахав Авдию: «Пройди по всей земле, ко всем водным источникам и ко всем руслам потоков[a]. Может быть, мы найдём траву и сможем сохранить коней и мулов живыми, чтобы не лишиться части скота[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всем потокам». Еврейское слово может обозначать поток, его русло или долину, по которой течёт сезонный водоток.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы не быть отсечёнными от скота». Вероятно, имеется в виду утрата или вынужденное сокращение части поголовья из-за нехватки корма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: по всей земле
  rationale: При глаголе движения предлог בְּ может обозначать передвижение по территории; контекст предполагает поиски по всей стране.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: водные источники
  rationale: Передаёт конкретное значение природных источников воды и естественно звучит по-русски.
- source_word: הַנְּחָלִים
  choice: русла потоков
  rationale: נַחַל может обозначать поток, долину или сезонное водное русло. В условиях засухи выражение «русла потоков» не создаёт впечатления, будто вода там непременно ещё течёт.
- source_word: אוּלַי נִמְצָא
  choice: может быть, мы найдём
  rationale: Сохраняет выраженную в еврейском тексте надежду и неопределённость.
- source_word: חָצִיר
  choice: трава
  rationale: В данном контексте речь идёт о растительности, пригодной для корма; «трава» естественнее и точнее, чем подразумевающее заготовку слово «сено».
- source_word: וּנְחַיֶּה
  choice: сохраним жизнь
  rationale: Порода hифиль выражает причинение или сохранение жизни; формулировка ясно передаёт цель поисков корма.
- source_word: סוּס וָפֶרֶד
  choice: коням и мулам
  rationale: Еврейские формы единственного числа имеют собирательное значение; в современном русском множественное число естественно обозначает соответствующие группы животных.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: чтобы нам не пришлось уничтожить часть скота
  rationale: כרת буквально означает «отсекать», а конструкция с מִן здесь имеет частичное значение. Русская формулировка передаёт вероятный смысл вынужденного сокращения поголовья, не утверждая, каким именно способом это произошло бы.
