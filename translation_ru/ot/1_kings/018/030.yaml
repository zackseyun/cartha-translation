base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: ru
  text: 'Тогда Илия сказал всему народу: «Подойдите ко мне». Весь народ подошёл к нему, и он восстановил разрушенный жертвенник Яхве.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «исцелил» жертвенник; то есть привёл его в прежнее, надлежащее состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ / וַיִּגְּשׁוּ
  choice: «Подойдите» / «подошёл»
  rationale: Глагол נגשׁ обозначает физическое приближение; повтор одного русского корня сохраняет связь между повелением Илии и его исполнением.
- source_word: וַיְרַפֵּא
  choice: «восстановил»
  rationale: Буквально глагол רפא означает «исцелил», но применительно к разрушенному жертвеннику передаёт возвращение его в надлежащее состояние. «Восстановил» естественно звучит по-русски и сохраняет более широкий оттенок, чем одно лишь «починил».
- source_word: מִזְבַּח יְהוָה
  choice: «жертвенник Яхве»
  rationale: Конструкция выражает принадлежность или посвящение жертвенника Яхве; личное имя Бога передано транслитерацией.
- source_word: הֶהָרוּס
  choice: «разрушенный»
  rationale: Страдательное причастие от הרס указывает на жертвенник, который был разрушен или снесён.
- source_word: וַיֹּאמֶר
  choice: «Тогда ... сказал»
  rationale: Последовательная повествовательная форма продвигает рассказ; «тогда» естественно передаёт эту связь в современном русском языке.
- source_word: כָל הָעָם
  choice: «весь народ»
  rationale: Естественная русская передача собирательного выражения, обозначающего всех присутствующих.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: «Яхве»
  alternative: «Господь» или «Иегова»
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон; «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Метафора רפא применительно к жертвеннику
  choice: В основном тексте «восстановил», буквальный образ указан в сноске
  alternative: «исцелил» или «починил»
  rationale: Так сохраняется смысл восстановления жертвенника без неестественного для русского основного текста выражения, а буквальная метафора остаётся доступной читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «подойдите — подошёл» намеренно отражает еврейский повтор; синтаксис прост и понятен обычному читателю.
