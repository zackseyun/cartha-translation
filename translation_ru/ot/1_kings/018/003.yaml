  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: ru
  text: Ахав позвал Авдия, управлявшего царским домом[a]. Авдий же очень боялся Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который был над домом». Так называли высшего придворного, управлявшего царским домом и хозяйством; возможный перевод: «управлявшего дворцом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ
  choice: Ахав позвал Авдия
  rationale: Глагол קרא с אֶל здесь означает, что Ахав велел позвать Авдия или обратился к нему. «Позвал» естественно передаёт выражение, не усиливая его до более властного «призвал» или «вызвал».
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: управлявшего царским домом
  rationale: Буквально «который над домом»; в придворном контексте это обозначение высшего должностного лица, ведавшего царским домом и хозяйством. Формулировка передаёт и административную функцию, и широкий смысл בַּיִת, не сводя его только к зданию дворца.
- source_word: עֹבַדְיָהוּ
  choice: Авдий
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: очень боялся Яхве
  rationale: Сочетание выражает устойчивое качество Авдия — глубокий страх перед Богом. Глагол «боялся» сохраняет прямое значение ירא и присущую выражению смысловую напряжённость между страхом и благоговением.
- source_word: מְאֹד
  choice: очень
  rationale: Обычное современное русское усиление точно передаёт наречие מְאֹד без архаизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Смысл יָרֵא применительно к Яхве
  choice: боялся Яхве
  alternative: благоговел перед Яхве; чтил Яхве
  rationale: «Боялся» сохраняет буквальный образ и богословскую многозначность страха Божьего; варианты «благоговел» и «чтил» естественны, но заранее сужают значение до почтения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Порядок слов и частица «же» ясно отделяют фоновое замечание об Авдии. Формулировка избегает как канцеляризма, так и излишней архаики.
