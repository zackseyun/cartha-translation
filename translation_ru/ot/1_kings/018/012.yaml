source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: ru
  text: Когда я уйду от тебя, Дух Яхве может унести тебя в неизвестное мне место[a]. И когда я приду сообщить Ахаву, он тебя не найдёт и убьёт меня. А твой слуга с юности боится Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер Яхве унесёт тебя»; еврейское רוּחַ может означать «дух», «ветер» или «дыхание», хотя здесь контекст лучше поддерживает перевод «Дух».'
    reason: Лексическая многозначность רוּחַ.
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: И вот, когда я уйду от тебя
  rationale: Конструкция вводит предполагаемую будущую ситуацию; русское «И вот, когда» естественно передаёт переход и временно-условный оттенок.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В контексте сверхъестественного перенесения пророка наиболее вероятно значение «Дух», однако многозначность רוּחַ отмечена в сноске.
- source_word: יִשָּׂאֲךָ
  choice: унесёт тебя
  rationale: Глагол נשא означает «нести, уносить, поднимать»; «унесёт» ясно выражает опасение внезапного перемещения Илии.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: неизвестно куда
  rationale: Естественный современный русский эквивалент указания на неизвестное говорящему место назначения.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Я приду и сообщу Ахаву
  rationale: Сохраняется последовательность действий; «сообщу» уместно для доклада царю.
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: но он тебя не найдёт — и тогда убьёт меня
  rationale: Противительный союз и «тогда» естественно выявляют подразумеваемую причинно-следственную связь, не меняя содержания.
- source_word: וְעַבְדְּךָ
  choice: А ведь твой слуга
  rationale: Это почтительное самообозначение; «А ведь» передаёт смысл обращения к собственной верности как основанию для жалобы.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: с юности боится Яхве
  rationale: Форма יָרֵא описывает устойчивое состояние благоговейного страха, продолжающееся с юности до настоящего времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Значение רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: ветер Яхве
  rationale: Пророческий контекст и представление о божественной силе, способной перенести Илию, поддерживают личностно-деятельное значение «Дух»; лексическая возможность значения «ветер» сохранена в сноске.
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Характер страха в יָרֵא אֶת יְהוָה
  choice: боится Яхве
  alternative: почитает Яхве
  rationale: «Боится» сохраняет библейское богословское напряжение между страхом и благоговением, не сводя выражение только к почтению.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис сделан естественным для устной жалобы Авдия; сохранены имя Яхве, почтительное «твой слуга» и богословски насыщенное «боится».
