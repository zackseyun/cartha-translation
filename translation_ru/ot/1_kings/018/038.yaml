base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: ru
  text: Тогда пал огонь Яхве[a] и поглотил всесожжение, дрова, камни и пыль, а воду, которая была во рву, слизал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огонь от Яхве». Еврейское сочетание может подчёркивать, что огонь исходил от Яхве.'
    reason: 'Лексико-синтаксическая альтернатива: конструкция אֵשׁ יְהוָה допускает как значение принадлежности, так и указание на источник.'
lexical_decisions:
- source_word: וַתִּפֹּל
  choice: пал
  rationale: Прямо передаёт образ ниспадающего огня и последовательность повествования.
- source_word: אֵשׁ יְהוָה
  choice: огонь Яхве
  rationale: Сохраняет тесное сочетание существительных в еврейском тексте и прямое употребление личного имени Бога; возможное указание на источник огня отмечено в сноске.
- source_word: וַתֹּאכַל
  choice: пожрал
  rationale: Сохраняет яркую метафору еврейского глагола «есть, пожирать» и естественно сочетается с огнём.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Точный и общепонятный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: הָעֵצִים
  choice: дрова
  rationale: В данном контексте речь идёт не просто о древесине, а о топливе, уложенном на жертвеннике.
- source_word: הָאֲבָנִים
  choice: камни
  rationale: Прямое соответствие, сохраняющее чудесную силу описанного огня.
- source_word: הֶעָפָר
  choice: прах
  rationale: Передаёт рыхлую землю или пыль у жертвенника и поддерживает dignified повествовательный регистр.
- source_word: לִחֵכָה
  choice: слизал
  rationale: Сохраняет буквальный и выразительный образ облизывающего огня, не заменяя его более общим «поглотил».
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: воду, которая была во рву
  rationale: תעלה обозначает вырытую вокруг жертвенника канаву или ров; «ров» естественен и ясен в данном повествовании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Связь слов אֵשׁ יְהוָה
  choice: огонь Яхве
  alternative: огонь от Яхве
  rationale: Основной текст сохраняет компактное и допускающее оттенки еврейское сочетание, тогда как сноска отмечает возможный акцент на божественном источнике огня.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным звучанием. Глаголы «пожрал» и «слизал» сохраняют два разных ярких образа оригинала; перечисление и нарастающая сила чуда переданы без поясняющих добавлений.
