revisions:
- from: Из этих камней он построил жертвенник во имя Яхве и сделал вокруг жертвенника ров величиной примерно в два сеа зерна[a].
  to: Из этих камней он построил жертвенник во имя Яхве и сделал вокруг жертвенника ров размером с вместилище двух сеа зерна[a].
  rationale: Убрано не обусловленное оригиналом «примерно». Формулировка «размером с вместилище двух сеа зерна» ближе к כְּבֵית סָאתַיִם זֶרַע и остаётся читаемой по-русски; сноска сохраняет оба основных возможных понимания трудной фразы.
