  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: ru
  text: Из этих камней он построил жертвенник во имя Яхве и сделал вокруг жертвенника ров размером с вместилище двух сеа зерна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вместилище двух сеа зерна». Значение этого трудного выражения не вполне ясно: оно может указывать на вместимость рва или на площадь, для засева которой требовалось два сеа зерна. Сеа — древняя мера объёма.'
    reason: Сохраняет неоднозначность еврейского выражения, не внося необоснованной приблизительности, и поясняет древнюю меру.
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Из этих камней он построил жертвенник
  rationale: Передаёт буквальную конструкцию «построил камни [как] жертвенник» естественным русским языком, не добавляя прямо не выраженного здесь значения «восстановил».
- source_word: בְּשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Устойчиво и точно передаёт בְּשֵׁם как действие, совершаемое во имя носителя личного имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени сохраняет отличие тетраграмматона от титула «Господь».
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: сделал ров
  rationale: «Ров» ясно обозначает вырытое углубление вокруг жертвенника и естественно звучит в данном повествовательном контексте.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: величиной примерно в два сеа зерна
  rationale: Сохраняет эллиптичность и меру исходного выражения, не сводя однозначно размер рва ни к вместимости, ни к площади посева; трудность разъяснена в примечании.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: вокруг жертвенника
  rationale: Кратко и естественно передаёт окружающее положение рва.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом; форма «Яхве» соответствует принятой современной научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным синтаксисом. Слово «жертвенник» сохраняет библейскую культовую точность; личное имя «Яхве» передано прямо. Неясная мера размера оставлена в основном тексте без ложной конкретизации и пояснена сноской.
