base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: ru
  text: 'В полдень Илия стал насмехаться над ними и сказал: «Кричите во весь голос, ведь он бог! Может быть, он задумался, или отошёл в сторону[a], или отправился в путь. А может быть, он спит и проснётся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально имеет менее определённый смысл: «отлучился» или «отошёл»; вероятно, это эвфемизм, возможно означающий «отошёл по нужде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: В полдень
  rationale: Естественно передаёт временной переход в еврейском повествовании; отдельное «и случилось» по-русски здесь было бы тяжеловесным.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: стал насмехаться над ними
  rationale: Передаёт начало действия и явную язвительную насмешку Илии.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Кричите громче
  rationale: Естественный русский призыв, передающий повеление звать громким голосом и саркастический контекст.
- source_word: כִּי אֱלֹהִים הוּא
  choice: ведь он бог
  rationale: Речь идёт о Ваале как языческом божестве; строчная буква не отождествляет его с Богом Израиля и сохраняет иронию.
- source_word: שִׂיחַ
  choice: он задумался
  rationale: Сохраняет вероятный смысл погружённости в размышление, не делая выражение излишне специальным.
- source_word: שִׂיג לוֹ
  choice: отошёл по нужде
  rationale: Передаёт вероятный эвфемистический смысл редкого выражения, сохраняя в русском эвфемизм.
- source_word: דֶרֶךְ לוֹ
  choice: отправился в путь
  rationale: Естественно передаёт отсутствие из-за дороги или путешествия.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: А может быть, он спит и проснётся
  rationale: Сохраняет предположительность и непереходный смысл глагола «проснётся», не заменяя его толкованием «его надо разбудить».
theological_decisions:
- issue: Передача אֱלֹהִים применительно к Ваалу
  choice: бог
  alternative: Бог
  rationale: Контекст представляет саркастическую речь Илии о языческом божестве, а не исповедание Бога Израиля.
- issue: Толкование эвфемистического שִׂיג לוֹ
  choice: отошёл по нужде
  alternative: отлучился
  rationale: Вероятный телесный смысл выражен деликатно; примечание сохраняет более буквальную неопределённость редкой фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сарказм Илии передан ясно, но без просторечия; редкое эвфемистическое выражение сопровождено примечанием. Маркер [a] помещён при вводе реплики, чтобы не разрывать её синтаксис.
