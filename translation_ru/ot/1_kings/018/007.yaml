  text: וַ/יְהִ֤י עֹבַדְיָ֨הוּ֙ בַּ/דֶּ֔רֶךְ וְ/הִנֵּ֥ה אֵלִיָּ֖הוּ לִ/קְרָאת֑/וֹ וַ/יַּכִּרֵ֨/הוּ֙ וַ/יִּפֹּ֣ל עַל פָּנָ֔י/ו וַ/יֹּ֕אמֶר הַ/אַתָּ֥ה זֶ֖ה אֲדֹנִ֥/י אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: ru
  text: 'Когда Авдий был в пути, вот, навстречу ему шёл Илия. Узнав его, Авдий пал ниц и спросил: «Не ты ли это, господин мой Илия?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет повествовательный указатель внезапного появления и живость древнееврейского текста.
- source_word: לִקְרָאתוֹ
  choice: навстречу ему
  rationale: Прямо передаёт значение движения к встрече; конструкция «шёл навстречу» естественна по-русски.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: пал ниц
  rationale: Устойчивое и понятное выражение, точно обозначающее падение лицом к земле в знак почтения.
- source_word: הַאַתָּה זֶה
  choice: Не ты ли это
  rationale: Передаёт вопрос узнавания с оттенком удивления; не превращает его в простое утверждение.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Сохраняет уважительное человеческое обращение и порядок компонентов оригинала, не смешивая его с божественным титулом.
theological_decisions:
- issue: Характер почтения Авдия перед Илиёй
  choice: «пал ниц» и «господин мой» переданы как жест и обращение глубокого уважения
  alternative: Истолковать действие как поклонение в религиозном смысле
  rationale: Контекст и лексика сами по себе не требуют богослужебного значения; перевод сохраняет действие без догматического уточнения.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Имя עֹבַדְיָהוּ передано в принятой русской библейской форме «Авдий», אֵלִיָּהוּ — «Илия». Повтор имени «Авдий» во втором предложении устраняет возможную русскую местоименную двусмысленность, не изменяя смысла.
