base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: ru
  text: 'Он ответил: «Не я навлёк беду[a] на Израиль, а ты и дом твоего отца, потому что вы оставили заповеди Яхве[b] и пошли[d] вслед за Баалами[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навлёк несчастье»; речь идёт о бедствии, постигшем народ.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит יהוה (ЙХВХ), личное имя Бога; здесь передано как «Яхве».
    reason: alternative_reading
  - marker: c
    text: 'В еврейском тексте — множественное число: «Баалы»; оно может подразумевать различные местные формы или проявления культа Баала.'
    reason: cultural_note
  - marker: d
    text: Еврейский глагол стоит в форме женского рода единственного числа; её соотнесённость в данном контексте не вполне ясна. Русское множественное число согласовано с «ты и дом твоего отца».
    reason: textual_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: навлёк беду
  rationale: Глагол עכר означает причинить бедствие или навлечь несчастье на общество. Выражение «навлёк беду» естественно по-русски и сохраняет связь с обвинением Ахава в предыдущем стихе.
- source_word: כִּי אִם
  choice: а
  rationale: Сочетание частиц здесь противопоставляет отрицание Илии встречному обвинению Ахава и его династии.
- source_word: וּבֵית אָבִיךָ
  choice: и дом твоего отца
  rationale: Сохранён древнееврейский образ «дома отца», обозначающий семью и династию, а не только ближайших родственников.
- source_word: בַּעֲזָבְכֶם
  choice: потому что вы оставили
  rationale: Предлог ב при инфинитиве указывает здесь на причину. Множественное «вы» передаёт обращение к Ахаву вместе с домом его отца.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: «Заповеди» передаёт нормативный и заветный смысл מִצְוֺת и естественно звучит в русском библейском контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: пошли вслед за
  rationale: Сохранён образ следования, который в данном контексте означает религиозную преданность и поклонение.
- source_word: הַבְּעָלִים
  choice: Баалами
  rationale: Сохранено явно выраженное в еврейском тексте множественное число, указывающее на различные местные формы культа Баала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Множественное число הַבְּעָלִים
  choice: Баалами
  alternative: Баалом
  rationale: Множественное число сохранено, чтобы не сводить разные местные проявления или культы Баала к форме единственного числа.
- issue: Коллективная ответственность Ахава и отцовского дома
  choice: ты и дом твоего отца… вы оставили
  alternative: ты и твоя семья… оставили
  rationale: Формулировка сохраняет династический оттенок выражения «дом отца» и множественное число причинной конструкции, не ограничивая обвинение одним Ахавом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прямой и понятный; древнееврейское династическое выражение «дом твоего отца» сохранено ради смысловой точности.
