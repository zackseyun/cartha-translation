base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: ru
  text: 'Он сказал: «Чем я согрешил, что ты отдаёшь своего слугу в руки Ахава, чтобы он предал меня смерти?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он убил меня».'
    reason: 'Лексическая альтернатива: более прямой и современный способ передать каузативную форму לַהֲמִיתֵנִי.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Стандартная повествовательная формула; союз ו в русском связном повествовании здесь не требует обязательной передачи словом «и».
- source_word: מֶה חָטָאתִי
  choice: Чем я согрешил
  rationale: Естественная русская вопросительная конструкция сохраняет нравственно-религиозное значение глагола חטא и не сводит его к проступку вообще.
- source_word: כִּי אַתָּה נֹתֵן
  choice: что ты предаёшь
  rationale: כִּי вводит основание жалобы, а причастие נֹתֵן выражает совершающееся или неминуемое действие. «Предаёшь» естественно сочетается с образом передачи во власть.
- source_word: עַבְדְּךָ
  choice: своего слугу
  rationale: Это почтительное самообозначение говорящего перед собеседником; «слуга» здесь уместнее социально маркированного «раб».
- source_word: בְּיַד אַחְאָב
  choice: в руки Ахава
  rationale: Сохранена понятная по-русски древнееврейская метафора передачи во власть другого лица.
- source_word: לַהֲמִיתֵנִי
  choice: чтобы тот предал меня смерти
  rationale: Каузативная форма от מות означает причинение смерти. Местоимение «тот» естественно относит действие к ближайшему названному лицу — Ахаву; выражение сохраняет торжественный регистр.
