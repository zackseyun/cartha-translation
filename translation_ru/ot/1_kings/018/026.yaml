base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: ru
  text: 'И они взяли быка, которого он дал им, приготовили его и с утра до полудня призывали имя Ваала, говоря: «Ваал, ответь нам!» Но не было ни голоса, и никто не отвечал. Они хромали[a] вокруг жертвенника, который был устроен.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плясали» или «скакали». Еврейский глагол, вероятно, обозначает ритуальное прихрамывание или подпрыгивание; возможно, здесь намеренно повторён тот же корень, который Илия употребил в стихе 21.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת־הַפָּר
  choice: они взяли быка
  rationale: Передаёт обычное повествовательное значение לקח и жертвенный термин פַּר без ненужного уточнения возраста животного.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: которого он дал им
  rationale: Сохраняет активную конструкцию и подразумеваемого в еврейском тексте субъекта; из предыдущего стиха понятно, что речь об Илии.
- source_word: וַיַּעֲשׂוּ
  choice: приготовили его
  rationale: В данном жертвенном контексте глагол эллиптически означает подготовку быка; вариант «принесли в жертву» сказал бы больше, чем текст.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: призывали имя Ваала
  rationale: Сохраняет библейскую формулу обращения к божеству и её культовый оттенок.
- source_word: מֵהַבֹּקֶר וְעַד־הַצָּהֳרַיִם
  choice: с утра до полудня
  rationale: Естественная современная передача обозначенного промежутка времени.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: Ваал, ответь нам!
  rationale: Прямо передаёт звательное обращение и просьбу о явном ответе.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: не было ни голоса, и никто не отвечал
  rationale: 'Сохраняет усиленную двухчастную констатацию: не слышно голоса и нет отвечающего.'
- source_word: וַיְפַסְּחוּ
  choice: хромали
  rationale: Передаёт вероятное значение ритуального прихрамывания или подпрыгивания и сохраняет связь с тем же корнем в стихе 21.
- source_word: עַל הַמִּזְבֵּחַ
  choice: вокруг жертвенника
  rationale: В сочетании с обозначением ритуального движения предлог естественно указывает на движение возле или вокруг жертвенника, а не по его поверхности.
- source_word: אֲשֶׁר עָשָׂה
  choice: устроенного жертвенника
  rationale: Передаёт факт сооружения или приготовления жертвенника, не называя неопределённого субъекта формы единственного числа и сохраняя естественность русского текста.
theological_decisions:
- issue: Формула обращения к Ваалу
  choice: призывали имя Ваала
  alternative: взывали к Ваалу
  rationale: Выбранный вариант сохраняет повторяющуюся в Писании формулу קרא בשם, не придавая самому обращению богословской законности.
- issue: Значение וַיְפַסְּחוּ и словесная связь со стихом 21
  choice: хромали
  alternative: плясали; скакали
  rationale: Перевод сохраняет вероятную намеренную иронию и корневую связь с обвинением Илии в стихе 21, не сводя неоднозначное ритуальное движение к обычному танцу.
- issue: Неуказанный субъект אֲשֶׁר עָשָׂה
  choice: устроенного жертвенника
  alternative: жертвенника, который он сделал
  rationale: Масоретский текст формально содержит глагол мужского рода единственного числа, но не называет деятеля; русский причастный оборот не вынуждает отождествлять его и не устраняет факт сооружения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; повтор и резкий контраст отсутствия ответа сохранены. Маркер сноски поставлен непосредственно после неоднозначного глагола.
