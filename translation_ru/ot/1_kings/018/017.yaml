source:
  edition: WLC
  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: ru
  text: 'Когда Ахав увидел Илию, он сказал ему: «Так это ты навлекаешь беду на Израиль[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приносишь несчастье Израилю»; возможен также более краткий перевод: «возмутитель Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда
  rationale: Формула вводит очередное событие повествования; в современном русском отдельное «и было» здесь избыточно, а связь с временной конструкцией естественно передаётся придаточным предложением.
- source_word: כִּרְאוֹת
  choice: когда … увидел
  rationale: Инфинитивная конструкция с כִּ выражает временное обстоятельство. Русское придаточное с «когда» точно и естественно передаёт этот смысл.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция выражена падежной формой имени.
- source_word: אֵלִיָּהוּ
  choice: Илию
  rationale: Употреблена традиционная русская форма имени Илия в требуемом винительном падеже.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычный повествовательный глагол речи, прямо и естественно передаваемый русским «сказал».
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог с местоименным суффиксом обозначает адресата речи; по-русски естественно передаётся дательным падежом.
- source_word: הַאַתָּה זֶה
  choice: Так это ты
  rationale: Вопросительная частица, местоимение и указательное слово образуют подчёркнутый, конфронтационный вопрос. Частица «так» естественно усиливает обвинительный тон, не добавляя нового содержания.
- source_word: עֹכֵר
  choice: навлекаешь беду
  rationale: Причастие от עכר обозначает того, кто причиняет бедствие или несчастье. Глагольная формулировка звучит естественно по-русски и сохраняет направленность обвинения, не усиливая его до однозначного «губитель».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма национального имени; конструкция с предлогом «на» передаёт того, на кого, по обвинению Ахава, навлекается беда.
theological_decisions:
- issue: Смысл и тон обвинения Ахава
  choice: 'Прямое обвинение: «навлекаешь беду на Израиль»'
  alternative: «приносишь несчастье Израилю»; «возмутитель Израиля»; «губитель Израиля»
  rationale: Перевод передаёт утверждение Ахава, будто бедствия Израиля вызваны Илиёй, но не подтверждает истинность этого обвинения. Более сильное «губитель» могло бы сузить значение עכר и чрезмерно усилить формулировку.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Реплика Ахава передана кратко и резко; архаическое «и было» и тяжеловесное причастное обозначение лица не используются.
