base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: ru
  text: 'Тогда Илия сказал народу: «Я один остался пророком Яхве[a], а пророков Ваала — четыреста пятьдесят человек».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я остался единственным пророком Яхве». Здесь Илия говорит о своём положении в этом открытом противостоянии, хотя ранее повествование упоминает других пророков, которых спрятал Авдий (3 Цар. 18:4, 13).'
    reason: Передаёт возможный более явный способ выразить эмфатическое «я один» и поясняет повествовательный контекст, не согласовывая и не изменяя слова Илии в основном тексте.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Употреблена традиционная и общеизвестная русская форма имени.
- source_word: אֶל הָעָם
  choice: народу
  rationale: עָם обозначает собравшийся народ Израиля; дательный падеж естественно передаёт адресата речи.
- source_word: אֲנִי נוֹתַרְתִּי ... לְבַדִּי
  choice: Я — я один — остался
  rationale: Самостоятельное местоимение אֲנִי и לְבַדִּי создают эмфатическое самообозначение. Повтор «я» сохраняет эту выразительность по-русски, а «остался» передаёт состояние оставшегося.
- source_word: נָבִיא לַיהוָה
  choice: пророком Яхве
  rationale: Творительный падеж после «остался» естественен в русском; родительная конструкция показывает принадлежность пророка Яхве и его служение Ему.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: а пророков Ваала
  rationale: Союз «а» передаёт контраст между одиночеством Илии и многочисленностью пророков Ваала.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: четыреста пятьдесят человек
  rationale: Словесная запись числа и «человек» точно и естественно передают полный счёт людей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Утверждение Илии, что он остался один
  choice: Я — я один — остался пророком Яхве
  alternative: Я один остаюсь пророком Яхве
  rationale: Высказывание сохранено без гармонизации с упоминанием пророков, спрятанных Авдией. Эмфатическая форма отражает напряжение самого повествования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Тире выделяют эмфатическое «я один», не создавая неестественного буквального повтора. Названия книги в сноске приведены по принятой русской нумерации: 3 Царств.'
