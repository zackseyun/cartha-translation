base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: ru
  text: 'И взял Илия двенадцать камней — по числу колен сыновей Иакова[a], к которому было обращено слово Яхве: «Израиль будет твоим именем»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Иакова». Буквально в еврейском тексте: «сыновей Иакова».'
    reason: lexical_alternative
  - marker: b
    text: 'Эти слова напоминают о том, как Бог дал Иакову новое имя (Быт. 32:28; 35:10): «Израиль будет твоим именем».'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычная передача повествовательной формы глагола לקח; в данном контексте звучит естественно и точно.
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: двенадцать камней
  rationale: Прямая и естественная передача числительного с существительным.
- source_word: כְּמִסְפַּר
  choice: по числу
  rationale: Кратко и естественно передаёт соответствие количества камней числу колен.
- source_word: שִׁבְטֵי בְנֵי יַעֲקֹב
  choice: колен сыновей Иакова
  rationale: Сохраняет родоплеменное значение שֵׁבֶט и буквальное семейное выражение בְנֵי יַעֲקֹב.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: к которому пришло слово Яхве
  rationale: Относительное местоимение отнесено к Иакову; формула сохраняет образ прихода Божьего слова и указывает на предшествующее откровение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит прямую речь по-русски и функционально передаёт еврейское לֵאמֹר.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Израиль будет имя твоё
  rationale: Сохраняет вынесенное вперёд имя «Израиль» и торжественный порядок слов исходного текста, оставаясь понятным по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя без конфессионального истолкования.
- issue: К кому относится אֲשֶׁר («к которому»)
  choice: к Иакову
  alternative: к сыновьям Иакова или к Израилю как народу
  rationale: Единственное число местоимения אֵלָיו и последующие слова о переименовании естественно указывают на Иакова, хотя конструкция следует после упоминания его сыновей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире облегчает длинную синтаксическую конструкцию; необычный, но понятный порядок слов в прямой речи сохраняет акцент исходного текста на имени «Израиль».
