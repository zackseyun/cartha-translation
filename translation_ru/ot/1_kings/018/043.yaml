  source_fidelity: 'Текст точно передаёт последовательность еврейского оригинала: приказ слуге подняться и посмотреть в сторону моря, исполнение приказа, сообщение «ничего нет» и краткое повеление повторить возвращение семь раз. «Поднимись, пожалуйста» удачно отражает императив עֲלֵה и смягчающую частицу נָא. Неоднозначность שׁוּב сохранена естественным «Возвращайся».'
