id: 1KI.18.43
reference: 1 Kings 18:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: ru
  text: 'И сказал он своему слуге[a]: «Поднимись, пожалуйста, и посмотри в сторону моря». Тот поднялся, посмотрел и сказал: «Ничего нет». Тогда он сказал: «Возвращайся семь раз»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «своему юноше» или «своему помощнику».
    reason: lexical_alternative
  - marker: b
    text: То есть возвращайся и снова смотри, пока это не будет сделано семь раз.
    reason: clarification
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: своему слуге
  rationale: נַעַר может обозначать юношу, слугу или помощника; в данном контексте человек исполняет поручения Илии, поэтому «слуга» естественно передаёт его роль, не утверждая его возраст.
- source_word: עֲלֵה נָא
  choice: Поднимись, пожалуйста
  rationale: Императив עֲלֵה указывает на движение вверх, а частица נָא смягчает просьбу или придаёт ей оттенок настойчивости; такая формулировка сохраняет оба элемента.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: посмотри в сторону моря
  rationale: הַבֵּט означает «посмотри», а דֶּרֶךְ יָם здесь задаёт направление взгляда — к морю.
- source_word: אֵין מְאוּמָה
  choice: Ничего нет
  rationale: 'Краткая и естественная русская передача категорического отрицания: ничего не видно.'
- source_word: שֻׁב
  choice: Возвращайся
  rationale: Императив от שׁוב буквально призывает вернуться; из контекста следует повторение подъёма и наблюдения, но это поясняется в сноске, а в тексте сохраняется лаконичность оригинала.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямая передача числового выражения, обозначающего повторение действия.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной речью. Местоимение «он» сохранено в соответствии с контекстуальной связностью стиха; реплики переданы естественно, без добавления имени Илии, отсутствующего в еврейском тексте.
