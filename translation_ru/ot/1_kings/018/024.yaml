base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: ru
  text: '«Призовите имя вашего бога[a], а я призову имя Яхве; и тот бог, который ответит огнём, — тот и есть Бог». И весь народ ответил: «Это хорошее предложение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших богов». Еврейская форма может пониматься как множественное число; в данном контексте возможно и единственное число.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Хорошо это слово (дело)». Еврейское דָּבָר может означать «слово», «дело» или «предложение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: Призовите имя
  rationale: Оборот קרא בשם при обращении к божеству означает призвать его по имени; русский оборот «призвать имя» сохраняет культовый смысл и близок к форме оригинала.
- source_word: אֱלֹהֵיכֶם
  choice: вашего бога
  rationale: Хотя форма морфологически допускает множественное число, контекст состязания с Ваалом и последующее единственное число יַעֲנֶה поддерживают собирательно адресованное «вашего бога».
- source_word: וַאֲנִי אֶקְרָא
  choice: а я призову
  rationale: Союз ו соединяет действия, но контекст выражает противопоставление сторон; русское «а» передаёт его естественно, не усиливая до резкого «но».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: Тот Бог, который ответит огнём
  rationale: Артикль и определительное предложение выделяют участника состязания, который даст ответ. בָאֵשׁ естественно передаётся инструментальным «огнём».
- source_word: הוּא הָאֱלֹהִים
  choice: Он и есть Бог
  rationale: Ударное местоимение הוּא сохранено; частица «и» в конструкции «и есть» естественно выражает идентифицирующий и кульминационный смысл.
- source_word: וַיַּעַן כָּל הָעָם וַיֹּאמְרוּ
  choice: И весь народ ответил
  rationale: Русское единственное число согласуется с собирательным «народ». Второй глагол речи не воспроизведён отдельно как избыточный для современного русского, но его значение включено в прямую речь.
- source_word: טוֹב הַדָּבָר
  choice: Хорошо сказано
  rationale: דָּבָר здесь обозначает высказанное предложение или дело. Идиоматическое «Хорошо сказано» сохраняет связь с речью и передаёт одобрение предложения без неестественного «слово хорошо».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Число в אֱלֹהֵיכֶם
  choice: вашего бога
  alternative: ваших богов
  rationale: Форма допускает формально-множественное прочтение, однако ближайший контекст говорит о конкретном божестве пророков Ваала и далее употребляет глагол в единственном числе. Альтернатива сохранена в сноске.
- issue: Регистр слова אֱלֹהִים в условии испытания
  choice: Бог
  alternative: бог
  rationale: Фраза формулирует критерий установления того, кто действительно является Богом. Заглавная буква уместна в русском издании, хотя логическая формулировка начинается с конкурирующих притязаний.
translation_notes:
  register: Современный литературный русский с торжественной, но общедоступной интонацией. Синтаксис слегка упрощён по сравнению с еврейской цепочкой глаголов; риторическое ударение в «Он и есть Бог» сохранено. Все сноски отмечены в основном тексте.
