  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: ru
  text: Илия пошёл, чтобы предстать перед Ахавом. Голод же в Самарии был тяжёлым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И пошёл
  rationale: Вайиктоль продолжает повествовательную последовательность; обычное русское «И пошёл» естественно связывает действие с повелением предыдущего стиха.
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Использована традиционная и общепринятая русская форма библейского имени.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: чтобы явиться Ахаву
  rationale: Нифаль от ראה здесь означает «показаться, явиться». Формулировка сохраняет направленность действия к Ахаву и звучит естественно по-русски.
- source_word: וְהָרָעָב
  choice: А голод
  rationale: Союз вводит фоновое, сопутствующее обстоятельство, а не очередное действие; русское «А» естественно обозначает этот переход.
- source_word: חָזָק
  choice: был жестокий
  rationale: При слове «голод» прилагательное указывает на тяжесть и силу бедствия. Сочетание «жестокий голод» понятно, выразительно и сохраняет образность исходного слова «сильный».
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב обозначает место. Форма не уточняет сверх исходного текста, имеется ли в виду город или соответствующая местность.
