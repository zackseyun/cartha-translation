source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: ru
  text: 'Как жив Яхве, твой Бог: нет ни народа, ни царства, куда мой господин не посылал искать тебя. Когда там говорили: «Его здесь нет», — он заставлял это царство и этот народ поклясться, что они не смогли тебя найти.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Жив Яхве, твой Бог
  rationale: Сохраняет древнееврейскую формулу торжественной клятвы и звучит понятно и достойно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: нет ни народа, ни царства, куда… не
  rationale: В составе клятвенной формулы אִם имеет эмфатическую, а не обычную условную силу; русская отрицательная конструкция естественно передаёт категоричность утверждения.
- source_word: גּוֹי וּמַמְלָכָה
  choice: народ… царство
  rationale: Сохраняет два различных политико-общественных обозначения исходного текста и их параллелизм.
- source_word: שָׁלַח אֲדֹנִי שָׁם לְבַקֶּשְׁךָ
  choice: куда мой господин не посылал искать тебя
  rationale: Передаёт последовательность «посылал… искать», не добавляя отсутствующих в тексте исполнителей; «мой господин» здесь является почтительным обозначением царя Ахава.
- source_word: וְאָמְרוּ אָיִן
  choice: 'когда там говорили: «Его здесь нет»'
  rationale: אָדיִן выражает отсутствие; местоимение «его» естественно восполняет подразумеваемого Илию, а «здесь» передаёт ответ местных властей.
- source_word: וְהִשְׁבִּיעַ
  choice: он заставлял… поклясться
  rationale: Каузативная форма глагола שבע означает побуждение или принуждение к клятве; несовершенный вид соответствует повторявшемуся действию в разных странах.
- source_word: אֶת הַמַּמְלָכָה וְאֶת הַגּוֹי
  choice: то царство и тот народ
  rationale: Указательное «то/тот» естественно по-русски отсылает к каждому ранее упомянутому царству и народу.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: что тебя не нашли
  rationale: כִּי вводит содержание клятвы; контекст завершённого поиска поддерживает прошедшее время, не добавляя оттенка неспособности, которого глагол сам по себе не требует.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и отличает его от титула אֲדֹנִי, который в этом стихе относится к Ахаву.
- issue: Сила אִם после формулы клятвы
  choice: 'Категорическое отрицательное утверждение: «нет ни…»'
  alternative: 'Буквальное условие: «если есть…»'
  rationale: В древнееврейской клятвенной речи отрицательная санкция часто остаётся подразумеваемой, поэтому אִם вводит усиленное заверение; буквальное русское «если» сделало бы фразу незавершённой и могло бы ошибочно передать сомнение.
- issue: Содержание навязанной клятвы
  choice: «что тебя не нашли»
  alternative: «что не смогут найти тебя»
  rationale: Форма יִמְצָאֶךָ допускает контекстуальную временную интерпретацию; здесь клятва подтверждает результат уже проведённого поиска. Перевод не вводит явно модального значения неспособности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранена торжественная краткость клятвенной формулы; повторное действие Ахава передано несовершенным видом «посылал», «заставлял». Архаизмы и канцелярская тяжеловесность избегаются.
