  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: ru
  text: 'И он сказал ему: «Это я. Пойди, скажи своему господину: „Илия здесь“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: И он сказал ему
  rationale: Последовательная глагольная форма продолжает повествование, а לוֹ прямо обозначает адресата речи.
- source_word: אָנִי
  choice: Я
  rationale: Самостоятельное ударное местоимение служит кратким самоопознанием Илии. Русское «Я» естественно в этом ответе и сохраняет лаконичность и некоторую эллиптичность еврейского текста.
- source_word: לֵךְ אֱמֹר
  choice: Пойди, скажи
  rationale: Два повелительных глагола переданы прямо; «пойди» здесь естественно вводит поручение.
- source_word: לַאדֹנֶיךָ
  choice: своему господину
  rationale: Слово אָדוֹן обозначает земного господина Авдия — Ахава. Строчная буква отличает это употребление от божественного титула.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Вот Илия
  rationale: הִנֵּה — указательная частица предъявления; «вот» кратко и естественно передаёт её силу. Имя передано в традиционной русской библейской форме.
theological_decisions:
- issue: Значение אָדוֹן применительно к земному правителю
  choice: господин
  alternative: владыка; хозяин
  rationale: Речь идёт об Ахаве как о земном начальнике Авдия. «Господин» точно передаёт отношение подчинённости, а строчная буква предотвращает смешение с титулом Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной краткостью. Эллиптическое самоопознание «Я» сохранено без поясняющего добавления, отсутствующего в еврейском тексте.
