- from: Тем временем[a] небо потемнело от туч и ветра, и хлынул сильный дождь[b]. Ахав сел в колесницу и отправился в Изреель.
  to: Тем временем[a] небо потемнело, набежали тучи, поднялся ветер, и хлынул сильный дождь[b]. Ахав сел в колесницу и отправился в Изреель.
  rationale: Перестроено описание погоды, чтобы тучи и ветер были переданы как элементы надвигающейся бури, а не как одинаковые причины потемнения неба. Сноска о временной идиоме уточнена без вводящей в заблуждение буквальной кальки. Остальные решения сохранены.
