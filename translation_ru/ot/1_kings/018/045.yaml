base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: ru
  text: Тем временем[a] небо потемнело, набежали тучи, поднялся ветер, и хлынул сильный дождь[b]. Ахав сел в колесницу и отправился в Изреель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская идиома, означающая «тем временем» или «вскоре».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и был великий дождь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: Тем временем
  rationale: Еврейская идиома обозначает краткий промежуток времени или происходящее между тем; «тем временем» естественно связывает стих с предшествующим повествованием, не передавая выражение буквально.
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ
  choice: небо потемнело
  rationale: В погодном контексте הַשָּׁמַיִם естественно передаётся как «небо», а глагол означает, что оно стало тёмным, мрачным.
- source_word: עָבִים וְרוּחַ
  choice: от туч и ветра
  rationale: Предлог «от» естественно выражает, чем было вызвано или сопровождалось потемнение неба; עָבִים обозначает дождевые или густые тучи.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: и хлынул сильный дождь
  rationale: Буквально «и был великий дождь»; русский глагол «хлынул» естественно передаёт наступление сильного ливня, а «сильный» соответствует интенсивности גָּדוֹל.
- source_word: וַיִּרְכַּב אַחְאָב
  choice: Ахав сел в колесницу
  rationale: Глагол означает «взошёл/сел для езды»; колесница подразумевается ближайшим повествовательным контекстом и необходима для естественного русского выражения.
- source_word: וַיֵּלֶךְ יִזְרְעֶאלָה
  choice: и отправился в Изреель
  rationale: Направительный суффикс передаёт движение к Изреелю; «отправился» сохраняет общее значение глагола движения.
