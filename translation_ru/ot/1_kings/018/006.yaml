base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: ru
  text: 'И разделили они между собой страну, чтобы пройти по ней: Ахав пошёл по одной дороге один, а Авдий — по другой дороге один.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейский текст дважды говорит «по одной дороге»: «Ахав пошёл по одной дороге один, и Авдий пошёл по одной дороге один». Во второй части «по другой дороге» естественно выражает подразумеваемое противопоставление маршрутов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: разделили они между собой
  rationale: Порода пиэль глагола חלק выражает активное разделение, а לָהֶם в данном контексте указывает на распределение между двумя участниками.
- source_word: אֶת הָאָרֶץ
  choice: землю
  rationale: Здесь אֶרֶץ обозначает область, которую предстояло обследовать; «землю» сохраняет широту исходного слова.
- source_word: לַעֲבָר בָּהּ
  choice: чтобы пройти по ней
  rationale: Инфинитив עבר с предлогом ב выражает движение по территории; формулировка естественна по-русски и не добавляет прямо не названной цели поисков.
- source_word: הָלַךְ
  choice: пошёл
  rationale: В повествовании הלך обозначает отправление по маршруту и не обязательно подчёркивает пешее передвижение.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: по одному пути / по другому пути
  rationale: Первое вхождение передано буквально, а второе — естественным русским противопоставлением, ясно показывающим, что мужчины разошлись разными маршрутами.
- source_word: לְבַדּוֹ
  choice: один
  rationale: Передаёт значение «сам, отдельно от другого» и подчёркивает, что каждый отправился своим маршрутом.
- source_word: עֹבַדְיָהוּ
  choice: Авдий
  rationale: Использована традиционная русская библейская форма имени, хорошо узнаваемая читателями.
