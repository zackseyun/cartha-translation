base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: ru
  text: И рука ГОСПОДА была на Илии[a]. Он подобрал полы одежды[b] и бежал впереди Ахава до самого въезда в Изреель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рука ГОСПОДА сошла на Илию». Еврейский текст буквально говорит, что рука ГОСПОДА «была на» нём.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «препоясал свои чресла», то есть подобрал и закрепил длинную одежду, чтобы она не мешала бежать.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача священного имени, сохраняющая его заветный характер и не вводящая спорную вокализацию в основной текст.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: рука ГОСПОДА была на
  rationale: Передаёт еврейский образ и божественное воздействие, не уточняя, шла ли речь о чудесной силе, пророческом побуждении или о том и другом.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: подобрал полы одежды
  rationale: 'Естественно выражает подразумеваемое действие: Илия собрал и закрепил длинную одежду, чтобы она не мешала бежать; буквальный образ поясницы пояснён в сноске.'
- source_word: וַיָּרָץ לִפְנֵי
  choice: бежал впереди
  rationale: Сохраняет пространственный смысл выражения, не усиливая возможный церемониальный оттенок.
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  choice: до самого въезда в Изреель
  rationale: Передаёт предел движения — подход или въезд в город — естественным современным русским языком.
theological_decisions:
- issue: Характер силы, данной Илии
  choice: Сохранён образ «рука ГОСПОДА была на Илии» без уточнения способа божественного действия.
  alternative: Истолковать выражение как конкретно чудесное наделение сверхъестественной скоростью либо только как пророческое вдохновение.
  rationale: Еврейская идиома ясно указывает на действие Бога, но не определяет его точный характер; перевод не снимает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Архаизм «чресла» вынесен в культурную сноску; основной текст делает действие понятным без излишнего толкования.
