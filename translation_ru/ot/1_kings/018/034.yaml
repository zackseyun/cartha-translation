  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: ru
  text: 'Тогда он сказал: «Наполните четыре кувшина[a] водой и вылейте её на всесожжение и на дрова». Потом он сказал: «Сделайте это во второй раз», — и они сделали это во второй раз. Затем он сказал: «Сделайте это в третий раз», — и они сделали это в третий раз.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды»; еврейское слово обозначает сосуд для жидкости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал / Потом он сказал / Он сказал
  rationale: Последовательная форма с וַ продвигает повествование; варьирование русских связок сохраняет ход событий и избегает тяжеловесного повторения «и сказал».
- source_word: מִלְאוּ
  choice: Наполните
  rationale: Форма повелительного наклонения во множественном числе естественно передаётся прямой командой.
- source_word: אַרְבָּעָה כַדִּים
  choice: четыре кувшина
  rationale: כַּד обозначает сосуд для хранения или переноса жидкости; «кувшин» естественен по-русски и не уточняет материал сосуда.
- source_word: מַיִם
  choice: водой
  rationale: Обычное значение существительного; творительный падеж обусловлен русским управлением глагола «наполнить».
- source_word: וְיִצְקוּ
  choice: и вылейте её
  rationale: В контексте это продолжение команды тем же адресатам. Местоимение женского рода относится к воде как к собирательному объёму.
- source_word: עַל הָעֹלָה
  choice: на всесожжение
  rationale: עֹלָה — установленный термин для жертвы, целиком сжигаемой на жертвеннике; предлог «на» точно передаёт физическое направление действия.
- source_word: וְעַל הָעֵצִים
  choice: и на дрова
  rationale: В данном контексте עֵצִים означает приготовленное для жертвы топливо; «дрова» точнее и естественнее общего «дерево».
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: Сделайте это во второй раз / они сделали во второй раз
  rationale: Передаёт повтор действия как второй счётный этап, сохраняя параллелизм команды и исполнения.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: Сделайте это в третий раз / они сделали в третий раз
  rationale: Контекст требует третьего выполнения того же действия, а параллельная формулировка воспроизводит структуру еврейского текста.
theological_decisions:
- issue: Передача жертвенного термина עֹלָה
  choice: всесожжение
  alternative: жертва всесожжения
  rationale: «Всесожжение» — точный и устоявшийся русский библейский термин для жертвы, целиком возносимой в огне; более развёрнутый вариант здесь не требуется.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь и повторения сохранены, но связки слегка варьируются ради естественного русского синтаксиса.
