  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: ru
  text: Разве моему господину не сообщили, что я сделал, когда Иезавель убивала пророков Яхве? Я спрятал сто человек из числа пророков Яхве — по пятьдесят человек в пещере[a] — и снабжал их хлебом и водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по пятьдесят человек в каждой пещере»; возможно также: «двумя группами по пятьдесят в пещерах». В еврейском тексте повтор числительного выражает распределение группами по пятьдесят.'
    reason: Синтаксическая конструкция допускает разные способы явно передать распределительное значение и число пещер.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: Разве моему господину не рассказывали
  rationale: Риторический вопрос предполагает утвердительный ответ. Безлично-пассивное «не рассказывали» естественно передаёт еврейскую пассивную форму; «моему господину» выражает почтительное обращение Авдия к Илии, а не божественный титул.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי
  choice: что я сделал
  rationale: Прямо и естественно передаёт объектную относительную конструкцию.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: когда Иезавель убивала
  rationale: Предлог с инфинитивом имеет временное значение; несовершенный вид передаёт продолжавшееся преследование, во время которого действовал Авдий.
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: сто человек из числа пророков Яхве
  rationale: «Из числа» сохраняет партитивное значение מִן, а «человек» явно отражает אִישׁ.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: по пятьдесят человек в пещере
  rationale: Повтор числительного выражает распределение группами по пятьдесят. Единственное число «в пещере» сохранено, а возможные способы понимания конструкции указаны в примечании.
- source_word: וָאֲכַלְכְּלֵם
  choice: снабжал их
  rationale: Глагол означает обеспечивать необходимым, поддерживать существование; «снабжал» естественно сочетается с названными далее хлебом и водой.
- source_word: לֶחֶם וָמָיִם
  choice: хлебом и водой
  rationale: Сохранены конкретность и лаконичность исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено четырёхбуквенное имя Бога; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Риторический вопрос и почтительное обращение сохранены; второе предложение выделяет содержание поступка без тяжеловесной вложенности.
