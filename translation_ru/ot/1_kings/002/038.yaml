base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: ru
  text: 'И сказал Шимей царю: «Это хорошо.[a] Как сказал мой господин, царь, так и поступит твой слуга». И жил Шимей в Иерусалиме много дней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это слово хорошо»; или: «Это дело хорошо»; или: «То, что ты сказал, хорошо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: Хорошо это слово
  rationale: דָּבָר может означать «слово», «речь», «дело» или «решение». В контексте Шимей одобряет высказанное царём условие; «это слово» сохраняет прямоту и смысловую широту еврейского выражения.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: אֲדֹנִי — почтительное обращение «мой господин». Порядок слов слегка архаичен, но понятен и уместен для придворной речи, а также близок к структуре оригинала.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: так и поступит твой слуга
  rationale: עֶבֶד здесь служит формулой смиренного самоназвания подданного перед царём, поэтому «слуга», а не «раб». Имперфект יַעֲשֶׂה в данном обещании передан будущим временем.
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: В контексте места жительства יָשַׁב означает «жить, обитать, оставаться». «Жил» естественно передаёт длительное пребывание Шимея в Иерусалиме.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Буквальная и понятная русская передача еврейского оборота, обозначающего продолжительный, но точно не определённый срок.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Традиционная русская библейская форма личного имени.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Общепринятая русская форма топонима с естественной передачей предлога בְּ.
