base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: ru
  text: 'Царь Соломон ответил своей матери: «Зачем ты просишь Ависагу Сунамитянку для Адонии? Проси уж для него и царскую власть[a], ведь он мой старший брат, — для него, для священника Авиафара и для Иоава, сына Саруи!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царство»; возможно также: «престол». Еврейское слово здесь означает царское правление или право царствовать.'
    reason: Лексическая многозначность слова הַמְּלוּכָה и его династический смысл в контексте.
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: Царь Соломон ответил своей матери
  rationale: Русское «ответил» естественно передаёт формулу «ответил и сказал» без тяжеловесного дублирования; имя матери из контекста не добавляется.
- source_word: וְלָמָה אַתְּ שֹׁאֶלֶת
  choice: Зачем ты просишь
  rationale: «Зачем» естественно передаёт риторический вопрос о цели просьбы и сохраняет резкость ответа.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Ависагу Сунамитянку
  rationale: Сохраняется традиционная русская форма имени и обозначение происхождения; винительный падеж соответствует объекту просьбы.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: Проси уж для него и царскую власть
  rationale: Частица «уж» и союз «и» передают саркастическое усиление; «царская власть» обозначает право царствовать, а не территорию.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: ведь он мой старший брат
  rationale: Передаёт причинно-ироническое обоснование и подчёркивает старшинство Адонии.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: — для него, для священника Авиафара и для Иоава, сына Саруи!
  rationale: Сохраняется эллиптическое, обрывистое перечисление сторонников Адонии; тире передаёт резкий переход к кульминации.
theological_decisions:
- issue: Политико-династический смысл просьбы об Ависаге
  choice: «царскую власть»
  alternative: «царство» или «престол»
  rationale: Соломон прямо истолковывает просьбу как притязание на царское правление. Формулировка сохраняет этот смысл, не добавляя мотивов сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Традиционные формы библейских имён сохранены; синтаксис сделан естественным для современного читателя без сглаживания сарказма и политической напряжённости реплики.
