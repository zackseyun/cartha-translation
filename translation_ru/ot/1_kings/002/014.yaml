lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему действию.
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: Мне нужно кое-что сказать тебе
  rationale: Буквально конструкция означает «у меня [есть] слово/дело к тебе»; выбранная современная русская идиома передаёт намерение обратиться с неким делом, не уточняя его содержания.
- source_word: וַתֹּאמֶר
  choice: Она ответила
  rationale: Глагол אָמַר буквально значит «сказала», но в данной реплике выполняет функцию непосредственного ответа; «ответила» естественно передаёт ход диалога.
- source_word: דַּבֵּר
  choice: Говори
  rationale: Повелительная форма мужского рода единственного числа от דָּבַר; краткое «говори» точно и естественно передаёт приглашение продолжить.
