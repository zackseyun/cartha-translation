base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: ru
  text: 'Ты и сам знаешь, что причинил мне[a] Иоав, сын Саруи, что он сделал двум военачальникам израильских войск — Авениру, сыну Нира, и Амессаю, сыну Иефера: он убил их, пролив в мирное время кровь войны[b], и обагрил кровью войны пояс на своих чреслах и сандалию на своей ноге.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно передать также: «что сделал мне». В контексте оно говорит о поступке Иоава, причинившем Давиду ущерб.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поместил кровь войны в мире». Этот образ говорит о кровопролитии, свойственном войне, совершённом в мирных условиях.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: Ты и сам знаешь
  rationale: Передаёт присоединительное וְגַם и усиленное прямое обращение אַתָּה естественной современной русской формой.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: что сделал со мной
  rationale: לִי в данном контексте выражает направленность действия во вред говорящему; «со мной» по-русски естественнее буквального «мне», сохраняя возможный оттенок личного ущерба.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: с двумя военачальниками израильских войск
  rationale: שָׂרֵי обозначает военных начальников, а множественное צִבְאוֹת отражено словом «войск» без тяжеловесной конструкции.
- source_word: וַיַּהַרְגֵם
  choice: он убил их
  rationale: Прямая и точная передача глагола הרג с объектным суффиксом.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: пролив в мирное время кровь, какую проливают на войне
  rationale: Передаёт резкое противопоставление военного кровопролития и мирных условий. Буквальное «поместил кровь войны в мире» по-русски неясно, поэтому образ раскрыт без устранения самого контраста.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: запятнал этой кровью войны пояс ... и сандалии
  rationale: Глагол נתן буквально означает «положил, поместил», но в сочетании с кровью на одежде естественное русское «запятнал» сохраняет конкретный образ и подразумеваемую вину за кровь.
- source_word: יוֹאָב ... צְרוּיָה ... אַבְנֵר ... נֵר ... עֲמָשָׂא ... יֶתֶר
  choice: Иоав ... Саруия ... Авенир ... Нир ... Амессай ... Иефер
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, понятные русскоязычному читателю.
theological_decisions:
- issue: Характер убийств Авенира и Амессая
  choice: Сохранено противопоставление крови войны и мирного времени
  alternative: 'Передать обобщённо: «вероломно убил их»'
  rationale: Исходный текст не просто осуждает убийство, а характеризует его посредством напряжённого образа военного кровопролития в условиях мира; перевод не заменяет этот образ готовой нравственной оценкой.
- issue: Кровь на поясе и сандалиях
  choice: Сохранён конкретный образ запятнанных кровью предметов
  alternative: Истолковать только абстрактно как «навлёк на себя вину за кровь»
  rationale: Образ может указывать как на буквальные следы убийства, так и на прилипшую к убийце кровную вину; перевод не ограничивает его одним толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён ровно настолько, чтобы длинное обвинение оставалось ясным; конкретная телесная образность пояса и сандалий сохранена. Имена даны в традиционных русских библейских формах.
