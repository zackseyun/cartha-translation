lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: Когда приблизилось время Давиду умереть
  rationale: Еврейское выражение буквально говорит, что «дни Давида приблизились к смерти». Русский перевод естественно передаёт приближение срока смерти, сохраняя конструкцию с Давидом как подразумеваемым субъектом инфинитива.
- source_word: וַיְצַו
  choice: он повелел
  rationale: Глагол צוה обозначает властное распоряжение или наказ; «повелел» передаёт торжественный характер последних указаний Давида без архаической тяжеловесности.
- source_word: אֶת־שְׁלֹמֹה בְנוֹ
  choice: своему сыну Соломону
  rationale: Естественный русский порядок слов ясно передаёт родство и адресата повеления.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Перед последующей прямой речью двоеточие в современном русском естественно выполняет функцию еврейской вводной формулы «сказав» и избегает ненужной буквальности.
