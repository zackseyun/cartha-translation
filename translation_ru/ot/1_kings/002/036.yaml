base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: ru
  text: 'Царь послал за Семеем, призвал его и сказал ему: «Построй себе дом в Иерусалиме и живи там; никуда оттуда не выходи[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сюда и туда», то есть куда бы то ни было.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал за
  rationale: В повествовательной формуле глагол означает, что царь послал за Семеем; такой перевод естественен по-русски и не требует добавлять отсутствующий в еврейском тексте объект «людей» или «слуг».
- source_word: וַיִּקְרָא לְשִׁמְעִי
  choice: призвал Семея
  rationale: קרא с ל здесь передаёт вызов к царю. «Призвал» сохраняет самостоятельность второго еврейского глагола и уместно для царского распоряжения.
- source_word: בְּנֵה לְךָ בַיִת
  choice: построй себе дом
  rationale: Императив передан прямо, а לְךָ — естественным русским дательным выгоды «себе»; «дом» обозначает жилище без добавочного оттенка.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Обычная передача местного значения предлога и традиционного русского написания топонима.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: и живи там
  rationale: В контексте предписанного постоянного места проживания ישׁב естественно передаётся современным русским «живи», а не книжным «обитай».
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: никуда оттуда не выходи
  rationale: «Не выходи» близко передаёт יצא, а «оттуда» сохраняет исходную точку ограничения; отрицательное местоимение естественно соединяет запрет с последующей идиомой.
- source_word: אָנֶה וָאָנָה
  choice: никуда
  rationale: Парное наречное выражение буквально указывает на разные направления («сюда и туда»), но в отрицательном предписании идиоматически означает «никуда».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Сохранены два последовательных действия царя — он послал за Семеем и призвал его, — без ненужной архаизации. Точка с запятой подчёркивает переход от предписания жить в Иерусалиме к запрету покидать его.
