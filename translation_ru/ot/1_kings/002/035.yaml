  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: ru
  text: Царь назначил Бенаю, сына Иехояды, вместо него[a] начальником войска, а священника Цадока царь назначил вместо Эвьятара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть вместо Иоава, отстранённого от должности военачальника в предшествующем повествовании.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: назначил
  rationale: Буквально глагол означает «дал / поставил», но в данном административном контексте речь идёт о назначении на должность; «назначил» естественно передаёт этот смысл.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Бенаю, сына Иехояды
  rationale: Еврейская патронимическая конструкция передана прямо; имена транслитерированы с еврейского. В винительном падеже имя «Беная» имеет форму «Бенаю».
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Сохранены заместительное значение предлога и местоименная отсылка; из ближайшего контекста ясно, что имеется в виду Иоав.
- source_word: עַל־הַצָּבָא
  choice: начальником войска
  rationale: Сочетание буквально означает «над войском» и указывает на должность командующего; русская конструкция естественно выражает эту служебную роль.
- source_word: צָדוֹק הַכֹּהֵן
  choice: священника Цадока
  rationale: Титул сохранён, а имя транслитерировано с еврейского; порядок слов приспособлен к естественному русскому синтаксису.
- source_word: תַּחַת אֶבְיָתָר
  choice: вместо Эвьятара
  rationale: תַּחַת здесь обозначает замену прежнего носителя должности; перевод сохраняет смысл преемства.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённый титул передан прямо. Его повтор во второй части стиха сохранён вслед за еврейским текстом.
