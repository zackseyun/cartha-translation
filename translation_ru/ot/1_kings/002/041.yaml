lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: Безлично употреблённая пассивная форма передаёт сообщение сведений Соломону, не называя сообщившего; по-русски естественно выразить это неопределённо-личной конструкцией.
- source_word: לִשְׁלֹמֹה
  choice: Соломону
  rationale: Предлог ל обозначает адресата сообщения; русский дательный падеж естественно передаёт эту функцию.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание сообщения в косвенной речи.
- source_word: הָלַךְ
  choice: ходил
  rationale: Глагол הלך обозначает движение; в сочетании с последующим וַיָּשֹׁב форма «ходил… и вернулся» естественно описывает завершённую поездку, не добавляя способ передвижения.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Традиционная русская передача древнееврейского личного имени.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Предлог מ указывает исходный пункт движения.
- source_word: גַּת
  choice: в Геф
  rationale: Название места без выраженного предлога выступает направлением движения; «в» требуется нормами русского языка. Использована традиционная русская форма топонима.
- source_word: וַיָּשֹׁב
  choice: и вернулся
  rationale: Глагол שוב означает возвращение; совершенный вид естественно передаёт завершённое действие в последовательности повествования.
