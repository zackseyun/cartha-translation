base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: ru
  text: И Соломон сел на престол своего отца Давида, и царство его прочно утвердилось.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его правление стало весьма прочным»; также возможно: «его царская власть прочно утвердилась».'
    reason: Еврейское מַלְכוּת может означать царство, правление, царствование или царскую власть, а заключительная фраза допускает несколько естественных способов передачи устойчивости власти Соломона.
lexical_decisions:
- source_word: יָשַׁב
  choice: сел
  rationale: В сочетании с «на престол» глагол обозначает занятие царского престола; «сел» сохраняет исходный образ и естественно звучит по-русски.
- source_word: כִּסֵּא
  choice: престол
  rationale: В контексте царской преемственности речь идёт именно о царском престоле, а не просто о сиденье.
- source_word: אָבִיו
  choice: своего отца
  rationale: Давид — непосредственный, родной отец Соломона; возвратное местоимение естественно связывает отца с подлежащим русского предложения.
- source_word: וַתִּכֹּן
  choice: прочно утвердилось
  rationale: Нифаль глагола כון передаёт состояние установленности и устойчивости; наречие «прочно» также естественно выражает усиление посредством מְאֹד.
- source_word: מַלְכֻתוֹ
  choice: царство его
  rationale: Слово может обозначать царство, царствование или царскую власть. «Царство» сохраняет широту значения и не сужает высказывание исключительно до срока правления либо личного статуса царя.
- source_word: מְאֹד
  choice: прочно
  rationale: 'Интенсивность передана идиоматически через усиление результата: царство не просто утвердилось, а утвердилось прочно.'
theological_decisions:
- issue: Язык царской преемственности и престол Давида
  choice: Стих передан как историческое сообщение о воцарении Соломона и упрочении его царства.
  alternative: Подчеркнуть династическую легитимность или позднейшее мессианское значение престола Давида.
  rationale: Сам стих сообщает о вступлении Соломона на престол после Давида, но прямо не раскрывает более поздних канонических и богословских связей; поэтому они не внесены в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм еврейского текста сохранён без архаизации; подлинная смысловая широта מַלְכוּת отмечена в сноске.
