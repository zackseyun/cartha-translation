base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: ru
  text: 'Она сказала: «У меня к тебе одна небольшая просьба: не откажи мне[a]». Царь ответил ей: «Проси, мать моя, ведь я не откажу тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отврати моего лица». Это еврейское выражение означает: «не откажи мне в просьбе».'
    reason: Передаёт буквальный образ оригинала и объясняет его идиоматическое значение, не создавая в основном тексте неестественной русской конструкции.
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: одной небольшой просьбе
  rationale: Передаёт буквальное сочетание «одна малая просьба» естественным современным русским языком, не усиливая и не умаляя просьбу.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: не отверни от меня лица / не отверну от тебя лица
  rationale: Сохраняет повтор и образ лица в еврейском тексте; русская конструкция понятна как просьба не отказать и при этом остаётся достаточно близкой к форме оригинала.
- source_word: אִמִּי
  choice: мать моя
  rationale: Точно передаёт обращение «моя мать» и сохраняет уважительный, торжественный тон речи царя без добавления оттенков слова «матушка».
theological_decisions:
- issue: Идиома об отвращении лица
  choice: Сохранить образ лица в основном тексте и пояснить его значение в сноске.
  alternative: 'Передать только смыслом: «не откажи мне / я не откажу тебе».'
  rationale: Образ не создаёт доктринальной трудности и важен для точного параллелизма двух реплик; пояснение делает идиоматический смысл доступным современному читателю.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. Синтаксический параллелизм реплик сохранён; архаизмы вроде «не отврати лица моего» не использованы.
