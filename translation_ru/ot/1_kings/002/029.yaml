  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: ru
  text: 'Царю Соломону донесли, что Иоав убежал к шатру Яхве[a], и вот, он у жертвенника. Тогда Соломон послал Ванею, сына Иодая, сказав: «Иди, порази его[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к шатру Господа». Еврейское אֹהֶל означает «шатёр», а Яхве — собственное имя Бога.'
    reason: Уточняет лексическое значение אֹהֶל и характер традиционной альтернативы для имени יהוה.
  - marker: b
    text: 'Или: «напади на него». В данном контексте глагол обозначает удар, ведущий к смерти.'
    reason: Сохраняет возможный диапазон значения פגע ב и поясняет контекстуальный смертельный смысл.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: Безличная форма естественно передаёт еврейский пассив и сообщение сведений царю.
- source_word: נָס
  choice: убежал
  rationale: Глагол обозначает бегство; в русском повествовании предшествование сообщению ясно из контекста и не требует аналитической формы.
- source_word: אֶל אֹהֶל יְהוָה
  choice: к шатру Яхве
  rationale: «Шатёр» прямо передаёт אֹהֶל, а «Яхве» сохраняет личное имя, представленное тетраграмматоном.
- source_word: וְהִנֵּה
  choice: и теперь находится
  rationale: הִנֵּה привлекает внимание к обнаруженному положению Иоава; такое выражение звучит естественно в современном русском сообщении, сохраняя дейктическую выразительность.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: возле жертвенника
  rationale: אֵצֶל указывает на близость, не уточняя прикосновения к жертвеннику.
- source_word: וַיִּשְׁלַח
  choice: Тогда Соломон послал
  rationale: «Тогда» естественно выражает последовательность и связь действий в повествовании.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Ванею, сына Иодая
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён с прозрачной передачей патронима.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Формально и естественно вводит прямую речь после глагола посылания.
- source_word: לֵךְ
  choice: Иди
  rationale: Прямое соответствие простому повелительному наклонению הלך.
- source_word: פְּגַע בּוֹ
  choice: порази его
  rationale: Передаёт удар или нападение с подразумеваемым здесь смертельным исходом, но не заменяет многозначный глагол однозначным «убей».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие, а примечание указывает традиционный русский вариант.
- issue: Характер повеления פְּגַע בּוֹ
  choice: порази его
  alternative: убей его
  rationale: Контекст указывает на смертную казнь, однако выбранная формулировка сохраняет более широкий лексический диапазон еврейского глагола и не устраняет его напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без потери повествовательной последовательности; архаизмы избегаются, кроме устойчивой культовой лексемы «жертвенник».
