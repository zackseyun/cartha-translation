base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: ru
  text: 'Да обратит Яхве кровь, пролитую им, на его голову[a], за то что он напал на двух людей, более праведных и лучших, чем он, и убил их мечом без ведома моего отца Давида: Авенира, сына Нира, военачальника Израиля, и Амасу, сына Иефера, военачальника Иуды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его кровь на его голову». Еврейский оборот означает, что ответственность за пролитую им кровь и возмездие за неё обращаются на самого виновного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: И возвратит
  rationale: Каузативная форма глагола שוב в данном обороте выражает воздаяние; «возвратит» сохраняет еврейский образ и естественно сочетается с выражением «на его же голову».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: его кровь на его же голову
  rationale: Сохраняет компактный древнееврейский образ личной ответственности за пролитую кровь; частица «же» ясно передаёт возврат возмездия на самого виновного.
- source_word: פָּגַע
  choice: напал
  rationale: В контексте последующего убийства глагол обозначает враждебное нападение; «напал» не смешивает его с отдельным וַיַּהַרְגֵם, «убил их».
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: более праведных и лучших, чем он
  rationale: Сохраняет оба сравнительных определения и их нравственно-правовую оценку, не сводя צדיקים только к невиновности в конкретном деле.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: и убил их мечом
  rationale: Прямо и ясно передаёт убийство и сохраняет указание на орудие.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: без ведома моего отца Давида
  rationale: Естественная русская обстоятельственная конструкция ясно сообщает, что Давид не знал об этих убийствах и не санкционировал их.
- source_word: שַׂר צְבָא
  choice: военачальник
  rationale: Краткое и современное литературное обозначение начальника войска, подходящее обоим названным лицам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Смысл оборота о крови на голове
  choice: Сохранить образ божественного воздаяния за кровопролитие
  alternative: Развернуть как «возложит на него вину за пролитую кровь»
  rationale: Фраза говорит об ответственности виновного и справедливом возмездии. Основной текст сохраняет многозначный образ, а примечание разъясняет идиому, не сужая её до одного абстрактного понятия.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён без утраты причинной связи и параллельных воинских титулов; имена переданы в привычной русской библейской форме.
