base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: ru
  text: Вирсавия пришла к царю Соломону, чтобы поговорить с ним об Адонии. Царь встал ей навстречу, поклонился ей, затем сел на свой престол и велел поставить престол для матери царя. Она села по правую руку от него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: об Адонии
  rationale: Предлог עַל здесь естественно обозначает предмет или дело разговора. Контекст показывает, что Вирсавия ходатайствует за Адонию, однако сам стих выражает это не прямо, поэтому перевод сохраняет формальную неоднозначность.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: поклонился ей
  rationale: Глагол שׁחה обозначает почтительный поклон; местоименный суффикс указывает, что поклон обращён к Вирсавии. В контексте это придворный знак уважения, без добавления культового смысла.
- source_word: כִּסֵּא
  choice: престол
  rationale: То же существительное употреблено и о царском престоле Соломона, и о сиденье, поставленном для царской матери. Повтор слова «престол» сохраняет намеренную параллель и подчёркивает её высокий статус.
- source_word: לִימִינוֹ
  choice: по правую руку от него
  rationale: Естественная русская передача положения справа от царя, традиционно связанного с почётным местом, без внесения дополнительного толкования.
theological_decisions:
- issue: Характер поклона Соломона Вирсавии
  choice: «поклонился ей» без поясняющей оговорки
  alternative: «почтительно поклонился ей» или примечание о том, что это не поклонение
  rationale: Древнееврейский текст сообщает о поклоне как жесте почтения, но не противопоставляет его богопоклонению. Перевод не должен искусственно создавать или разрешать богословскую проблему.
- issue: Статус матери царя
  choice: сохранено буквальное «престол для матери царя»
  alternative: «сиденье для царицы-матери»
  rationale: Оригинал повторяет כִּסֵּא и использует описательное אֵם הַמֶּלֶךְ. Сохранение этих элементов передаёт высокий статус Вирсавии, не вводя отсутствующий в стихе официальный титул.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Цепочка древнееврейских союзов передана последовательными предложениями и словом «затем», чтобы избежать тяжеловесности, сохранив порядок всех действий. Имена даны в закрепившейся русской библейской форме.
