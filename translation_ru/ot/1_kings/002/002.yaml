lexical_decisions:
- source_word: אָנֹכִי הֹלֵךְ
  choice: Я ухожу
  rationale: Самостоятельное местоимение с причастием обозначает происходящее или близкое действие. «Я ухожу» естественно передаёт приближение смерти, не устраняя образ пути.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: путём всей земли
  rationale: Сохранена древнееврейская метафора общего для земных людей пути — смерти. В русском это выражение понятно в контексте и не требует поясняющей вставки в основной текст.
- source_word: וְחָזַקְתָּ
  choice: Будь же твёрд
  rationale: Форма с союзом в данном контексте имеет побудительное значение. Частица «же» связывает наставление с сообщением Давида о своём уходе; «твёрд» передаёт стойкость и мужество, не сужая смысл только до физической силы.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: и будь мужчиной
  rationale: Буквально выражение означает «будь/стань мужчиной» и обращено к Соломону. Основной текст сохраняет гендерную форму и краткость оригинала, а возможный оттенок проявления зрелости, мужества и ответственности отмечен в сноске.
theological_decisions:
- issue: Гендерно маркированное наставление Соломону
  choice: будь мужчиной
  alternative: покажи себя мужчиной; поступай мужественно
  rationale: Древнееврейское אִישׁ — существительное мужского рода, а наставление отца обращено конкретно к сыну. Буквальная формулировка сохраняет смысловую напряжённость и не подменяет её современным гендерно-нейтральным обобщением; коннотации мужества и ответственной зрелости вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью исходного напутствия. Метафора «путь всей земли» сохранена; «будь мужчиной» намеренно оставлено в основном тексте как прямое, гендерно точное обращение к Соломону.
