lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: сказала
  rationale: Стандартная передача повествовательной формы глагола אמר, вводящей прямую речь.
- source_word: בַּת שֶׁבַע
  choice: Вирсавия
  rationale: Устоявшаяся русская библейская форма личного имени; имя не переводится буквально.
- source_word: טוֹב
  choice: Хорошо
  rationale: Краткий утвердительный ответ, естественный в современной русской речи и сохраняющий лаконичность еврейского текста.
- source_word: אָנֹכִי אֲדַבֵּר
  choice: я поговорю
  rationale: Передаёт явно выраженное местоимение и глагол דבר естественной русской конструкцией, не конкретизируя речь как просьбу.
- source_word: עָלֶיךָ
  choice: о тебе
  rationale: Формально и естественно передаёт сочетание דבר с על, сохраняя возможность смысла «относительно тебя»; благоприятное заступничество следует из контекста, но не вносится однозначно в основной текст.
- source_word: אֶל הַמֶּלֶךְ
  choice: с царём
  rationale: Русское «поговорить с кем-либо» естественно передаёт направленность речи к царю, выраженную еврейским אֶל.
