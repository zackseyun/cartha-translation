  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: ru
  text: Тогда Беная, сын Иехояды, поднялся, поразил его[a] и умертвил; и тот был похоронен при своём доме[b] в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напал на него». В еврейском тексте здесь употреблены два разных глагола: один обозначает нападение или удар, а следующий — умерщвление.'
    reason: lexical_alternative
  - marker: b
    text: Слова «при своём доме» могут означать погребение на принадлежавшей ему усадьбе или семейной земле в пустыне.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Сохраняет основное пространственное значение глагола עלה («подниматься, идти вверх»), не добавляя прямо отсутствующее в тексте «выступил против него».
- source_word: וַיִּפְגַּע בּוֹ
  choice: поразил его
  rationale: פגע с предлогом ב в данном контексте обозначает враждебное нападение или удар. «Поразил его» передаёт действие, не сливая его со следующим глаголом умерщвления.
- source_word: וַיְמִתֵהוּ
  choice: умертвил
  rationale: Каузативная форма глагола מות означает «предать смерти, умертвить». Выбор сохраняет отличие от предшествующего удара и подходит к контексту исполнения царского приговора.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: 'Страдательная конструкция естественно передаёт нифаль и смену действующего лица: далее говорится уже о погребении Иоава.'
- source_word: בְּבֵיתוֹ
  choice: при своём доме
  rationale: בית может обозначать не только здание, но также усадьбу или семейное владение. Предлог «при» не создаёт ложного впечатления, будто погребение состоялось внутри жилого дома.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Передаёт обычное значение מדבר, при этом не уточняя без достаточных оснований характер местности.
