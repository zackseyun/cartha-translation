  verdict: approve
  source_fidelity: 'Перевод точно передаёт последовательность еврейского текста: Беная «поднялся», совершил отдельное враждебное действие против Иоава и затем умертвил его; далее корректно передана страдательная форма сообщения о погребении. Пространственное значение וַיַּעַל сохранено без неоправданного добавления значения «выступил против».'
  naturalness: Текст звучит литературно и понятно. Формула «поразил его и умертвил» намеренно несколько торжественна, но уместна в библейском повествовании и удачно сохраняет два разных еврейских глагола. «Тот был похоронен» ясно возвращает повествование к Иоаву и избегает ложного впечатления, что похоронен был Беная.
  terminology: Имена «Беная» и «Иехояда» допустимы как последовательная передача еврейских форм. «При своём доме» осторожно передаёт בְּבֵיתוֹ, не утверждая погребение внутри здания; сноска надлежащим образом поясняет возможное значение семейного владения. «Пустыня» соответствует בַּמִּדְבָּר и не чрезмерно конкретизирует тип местности.
