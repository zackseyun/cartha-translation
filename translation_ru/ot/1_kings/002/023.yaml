  to: 'И поклялся царь Соломон Яхве, сказав: «Пусть Бог сделает со мной то и ещё больше, ибо Адония сказал это себе на погибель!»[a]'
  rationale: Исправлено значение כִּי на причинно-утвердительное «ибо» без добавления отрицания. Идиома בְּנַפְשׁוֹ передана естественным русским выражением «себе на погибель» и пояснена сноской. Имя Яхве оставлено в основном тексте; отдельная сноска о нём не требуется, поскольку это принятый в проекте способ передачи тетраграмматона.
