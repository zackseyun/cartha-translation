  naturalness: «Ценою своей жизни сказал Адония эти слова» неестественно и может подразумевать, что он уже умер. Оборот «сказал это себе на погибель» — современный литературный и ясный способ передать идиоматическое בְּנַפְשׁוֹ в данном судебно-повествовательном контексте.
  terminology: «Яхве», «Бог», «Соломон» и «Адония» употреблены последовательно и уместно. «Поклялся ... Яхве» точно передаёт клятву именем Яхве.
