  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: ru
  text: 'И поклялся царь Соломон Яхве, сказав: «Пусть Бог сделает со мной то и ещё больше, ибо Адония сказал это себе на погибель!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил это против своей жизни»; то есть Адония своими словами навлёк на себя смертельную опасность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Обычный и точный русский глагол для принесения клятвы в повествовательном контексте.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог ב обозначает того, кем клянутся; тетраграмматон передан личным именем «Яхве».
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Пусть Бог сделает со мной то и ещё больше
  rationale: Сохранена традиционная форма клятвенного самоосуждения, в которой конкретное наказание не называется.
- source_word: כִּי
  choice: если не
  rationale: После формулы самоосуждения частица вводит клятвенное заверение; русская формула «если не...» естественно выражает подразумеваемое наказание в случае ложности заявления, не отрицая самого утверждения.
- source_word: בְנַפְשׁוֹ
  choice: ценою своей жизни
  rationale: Идиома означает, что сказанное ставит жизнь Адонии под угрозу или влечёт её утрату; выражение также сохраняет связь с נֶפֶשׁ, «жизнь».
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: сказал ... эти слова
  rationale: Естественное русское соответствие еврейскому обороту «сказал это слово/дело» во множественном оформлении.
- source_word: אֲדֹנִיָּהוּ
  choice: Адония
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблено личное имя Бога; транслитерация сохраняет различие между יהוה и титулом אֲדֹנָי.
- issue: Значение כִּי в формуле клятвы
  choice: если не
  alternative: ибо
  rationale: Здесь возможны клятвенно-условное и причинно-утвердительное понимания. Основной текст сохраняет типичную семитскую структуру клятвы, а сноска отмечает альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формула клятвы сохранена, но синтаксис сделан понятным современному читателю; подлинная неоднозначность כִּי вынесена в сноску.
