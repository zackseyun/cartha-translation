  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: ru
  text: 'И исполняй свой долг перед Яхве, твоим Богом: ходи Его путями и соблюдай Его предписания, заповеди, правовые установления и свидетельства, как написано в Законе Моисея, чтобы ты поступал благоразумно[a] во всём, что будешь делать, и куда бы ты ни направился.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ты преуспевал». Еврейский глагол может обозначать благоразумные, умелые действия или успех, к которому они приводят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: И исполняй порученное тебе
  rationale: Глагол с союзом продолжает увещание, а существительное обозначает вверенную обязанность. Такая формулировка естественна по-русски и сохраняет смысл ответственного поручения.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твоим Богом
  rationale: Личное имя יהוה передано принятой русской транслитерацией «Яхве», без замены титулом; суффикс второго лица сохранён.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ходи Его путями
  rationale: Сохранена понятная русскому читателю библейская метафора поведения как хождения путями Бога.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: Его постановления, заповеди, законы и свидетельства
  rationale: Сохранён четырёхчленный юридико-заветный перечень и различие терминов; «законы» здесь естественнее русского «суды» для מִשְׁפָּטִים.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: в Законе Моисея
  rationale: В данном контексте письменного Моисеева корпуса традиционное «Закон Моисея» ясно передаёт значение תּוֹרָה.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: чтобы ты поступал благоразумно
  rationale: Передаёт основной оттенок разумного, умелого действия, не исключая сопутствующего значения успеха; неоднозначность отмечена в сноске.
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: и куда бы ты ни направился
  rationale: Идиоматическая русская передача пространственного выражения, обозначающего любое направление деятельности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл לְמַעַן תַּשְׂכִּיל
  choice: чтобы ты поступал благоразумно
  alternative: чтобы ты преуспевал; чтобы тебе сопутствовал успех
  rationale: Еврейский глагол способен указывать как на благоразумное и умелое поведение, так и на достигаемый благодаря ему успех. Основной текст сохраняет акцент на поведении, а сноска — семантическую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты заветно-правовой терминологии; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской практике.
