source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/עָֽבַרְתָּ֙ אֶת נַ֣חַל קִדְר֔וֹן יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת דָּמְ/ךָ֖ יִהְיֶ֥ה בְ/רֹאשֶֽׁ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: ru
  text: 'В тот день, когда ты выйдешь и перейдёшь долину Кедрон[a], знай наверняка: ты непременно умрёшь; кровь твоя будет на твоей голове[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перейдёшь поток Кедрон». Еврейское слово נחל может обозначать долину, вади или сезонный водоток.'
    reason: lexical_alternative
  - marker: b
    text: То есть ты сам будешь нести ответственность за свою смерть.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: В тот день, когда
  rationale: Сочетание вводит условно-временную ситуацию и её последствие. Такой перевод естественен по-русски и сохраняет торжественно-правовой тон выражения «в день».
- source_word: צֵאתְךָ
  choice: ты выйдешь
  rationale: Инфинитивная конструкция с местоименным суффиксом обозначает выход Семея за установленную границу; личная форма естественна в современном русском.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: и перейдёшь долину Кедрон
  rationale: Глагол עבר прямо передан как «перейдёшь». Слово נחל может обозначать долину, вади либо сезонный водоток; «долина Кедрон» — ясное географическое обозначение без излишней архаизации.
- source_word: יָדֹעַ תֵּדַע
  choice: знай наверняка
  rationale: Инфинитив абсолютный при личной форме усиливает значение глагола; оборот передаёт настойчивое повеление и полную определённость.
- source_word: כִּי מוֹת תָּמוּת
  choice: ты непременно умрёшь
  rationale: Инфинитив абсолютный с личной формой выражает эмфатическую неизбежность смерти; «непременно» естественно передаёт это усиление.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: кровь твоя будет на твоей голове
  rationale: Сохранён древнееврейский образ ответственности за собственную смерть; его смысл пояснён в сноске.
theological_decisions:
- issue: Правовая формула ответственности за смерть
  choice: Сохранить в основном тексте выражение «кровь твоя будет на твоей голове».
  alternative: «Ты сам будешь виновен в своей смерти».
  rationale: Образная формула оригинала несёт одновременно правовой и нравственный смысл. Буквально-идиоматический перевод сохраняет напряжение текста, а сноска делает значение понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с торжественным правовым оттенком. Эмфатические древнееврейские конструкции переданы естественными русскими усилителями; образная формула о крови сохранена.
