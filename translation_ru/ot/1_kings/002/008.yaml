  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: ru
  text: 'И вот, с тобой Шимей, сын Геры, вениамитянин из Бахурима. Он проклял меня жестоким проклятием в тот день, когда я шёл в Маханаим. Но он спустился к Иордану мне навстречу, и я поклялся ему именем Яхве: «Я не предам тебя смерти мечом».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «если я предам тебя смерти мечом». Это сокращённая формула клятвы, означающая: «Я не предам тебя смерти мечом».'
    reason: Объяснение эллиптической формулы клятвы и её буквальной формы.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательно-вводную силу оборота и звучит естественно в современном литературном русском языке.
- source_word: עִמְּךָ
  choice: с тобой
  rationale: Передаёт присутствие Шимея в сфере власти или окружении Соломона без излишнего уточнения.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי מִבַּחֻרִים
  choice: Шимей, сын Геры, вениамитянин из Бахурима
  rationale: Естественно передаёт имя, отцовство, племенную принадлежность и место происхождения.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: проклял меня жестоким проклятием
  rationale: Сохраняет усилительную однокоренную конструкцию еврейского текста; «жестоким» выражает суровость и силу проклятия, не добавляя идеи физического насилия.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: в тот день, когда я шёл в Маханаим
  rationale: Ясно и естественно передаёт временное обстоятельство и направление движения.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: спустился к Иордану мне навстречу
  rationale: Сохраняет глагол нисходящего движения и связь встречи с Иорданом.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: я поклялся ему именем Яхве
  rationale: Передаёт клятву, данную Шимею с призыванием божественного имени, и сохраняет личное имя יהוה.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Я не предам тебя смерти мечом
  rationale: Передаёт фактический смысл эллиптической отрицательной клятвы и сохраняет формально-судебный оттенок каузативного глагола.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет явленное личное имя, не подменяя его титулом.
- issue: Смысл формулы אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 'явная отрицательная клятва: «Я не предам тебя смерти мечом»'
  alternative: 'буквальное условное: «если я предам тебя смерти мечом»'
  rationale: Частица אִם входит в эллиптическую формулу клятвы с опущенным самопроклятием; по смыслу Давид твёрдо обещает не казнить Шимея мечом.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; усилительный повтор «проклял… проклятием» намеренно сохранён. Маркер сноски поставлен при формуле клятвы, которую он поясняет.
