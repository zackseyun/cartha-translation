  - severity: low
    issue: Добавление «с ним» в первом повелении.
    rationale: Контекстуально оно относится к Иоаву, но в еврейском тексте объект при «поступи/сделай» не назван. Более сжатая формулировка лучше сохраняет исходную недоговорённость.
  - severity: low
