  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: ru
  text: Поступи, руководствуясь своей мудростью, и не дай его седой голове сойти в шеол с миром.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сведи его седую голову в шеол с миром».'
    reason: lexical_alternative
  - marker: b
    text: '«Шеол» — древнееврейское название мира мёртвых; возможный перевод: «могила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Поступи с ним
  rationale: Глагол עשה имеет широкое значение «делать, поступать». В данном контексте речь идёт о том, как Соломону следует обойтись с Иоавом; добавление «с ним» естественно выражает подразумеваемый объект, не уточняя сам способ действия.
- source_word: כְּחָכְמָתֶךָ
  choice: по своей мудрости
  rationale: Предлог כ указывает на соответствие действия мудрому рассуждению Соломона. Такая формулировка естественна по-русски и сохраняет прямую связь с еврейским словом «мудрость».
- source_word: וְלֹא תוֹרֵד
  choice: и не допусти, чтобы … сошли
  rationale: 'Порода Hiphil глагола ירד выражает причинное значение: «не заставь/не дай сойти». Конструкция «не допусти, чтобы» передаёт направленное Давидом требование и звучит естественно в сочетании с образом седин.'
- source_word: שֵׂיבָתוֹ
  choice: его седины
  rationale: Существительное обозначает седину, седые волосы и метонимически старость. «Его седины» сохраняет образ оригинала и не сводит его к отвлечённому «преклонному возрасту».
- source_word: בְּשָׁלֹם
  choice: мирно
  rationale: Здесь שָׁלוֹם означает спокойный, благополучный конец без возмездия. Наречие «мирно» естественно передаёт обстоятельственное значение еврейского сочетания.
- source_word: שְׁאֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не сужает значение до физической могилы.
theological_decisions:
- issue: Передача שְׁאֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет смысловую широту еврейского термина и не навязывает представление лишь о месте погребения. Контекст говорит о том, что Иоав не должен умереть мирной смертью, избежав возмездия.
- issue: Причинное значение וְלֹא תוֹרֵד
  choice: не допусти, чтобы … сошли
  alternative: не сведи … в шеол
  rationale: Основной текст передаёт причинность, не делая Давида или Соломона непосредственным исполнителем смерти. Более буквальное «не сведи» возможно и отмечено в сноске, поскольку форма Hiphil допускает такое выражение.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости наставления. Образ «его седины» и термин «шеол» оставлены ради смысловой и образной близости к еврейскому тексту; синтаксис слегка перестроен для естественного русского звучания.
