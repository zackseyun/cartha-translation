  terminology: «Яхве», «шатёр», «жертвенник» и «рога жертвенника» точны и уместны. Имёна «Иоав», «Адония», «Авессалом» соответствуют обычной русской библейской передаче. Культурная сноска полезна, но формулировку о значении жеста следует подать как просьбу/обращение, не как автоматический юридический результат.
