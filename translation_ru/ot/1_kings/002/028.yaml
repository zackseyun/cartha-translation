  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: ru
  text: 'До Иоава дошла весть: Иоав примкнул к Адонии, а к Авессалому не примкнул.[a] Тогда Иоав убежал к шатру Яхве и ухватился за рога жертвенника.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «склонился (или повернул) вслед за Адонией, а вслед за Авессаломом не склонился». Возможный смысл: «примкнул к Адонии, но не примкнул к Авессалому».'
    reason: Сноска передаёт образность еврейской идиомы и отмечает возможную контрастную передачу связи, не навязывая уступительного значения.
  - marker: b
    text: «Рога» — рогообразные выступы по углам жертвенника. Ухватиться за них было обращением с просьбой о защите или милости.
    reason: Культурно-историческое пояснение конкретного культового предмета и жеста без утверждения автоматического правового последствия.
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: весть
  rationale: Существительное обозначает дошедшее сообщение или известие; «весть» естественно и уместно в повествовательном контексте, не придавая ему оттенка недостоверного слуха.
- source_word: בָּאָה עַד
  choice: дошла до
  rationale: Передаёт буквальный образ движения сообщения и является естественным русским выражением.
- source_word: נָטָה אַחֲרֵי
  choice: примкнул к
  rationale: В данном контексте идиома означает политически встать на чью-либо сторону. Русское «повернул вслед за» было бы неестественным и могло бы затемнить смысл; повтор глагола в обеих частях сохранён.
- source_word: אֲדֹנִיָּה
  choice: Адония
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: хотя к Авессалому не примыкал
  rationale: «Хотя» естественно передаёт возможный уступительный оттенок связи, а повтор «примыкал» сохраняет риторический параллелизм исходного текста.
- source_word: וַיָּנָס
  choice: убежал
  rationale: Глагол выражает поспешное бегство; «убежал» ясно и естественно в современном русском повествовании.
- source_word: אֹהֶל יְהוָה
  choice: шатёр Яхве
  rationale: Буквально «шатёр Яхве». «Шатёр» сохраняет конкретный образ и не вводит более техническое «скиния».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: ухватился за рога жертвенника
  rationale: Передаёт конкретное физическое действие без внесения его предполагаемого правового результата в основной текст.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: рога жертвенника
  rationale: Это традиционное и точное обозначение рогообразных выступов по углам жертвенника; культурное пояснение вынесено в сноску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Передача политической идиомы נָטָה אַחֲרֵי
  choice: примкнул к
  alternative: пошёл вслед за; встал на сторону
  rationale: В контексте речь идёт о политической поддержке. Выбранный вариант ясно передаёт смысл и сохраняет одинаковую формулировку применительно к Адонии и Авессалому.
- issue: Смысл связи между поддержкой Адонии и неподдержкой Авессалома
  choice: уступительное «хотя»
  alternative: сочинительное «а/но»
  rationale: Еврейский союз допускает более нейтральную связь, однако фраза выглядит как контрастное, возможно уступительное замечание. Сноска сохраняет грамматическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена даны в привычных русских формах; технически архаичное «скиния» не использовано. Политическая идиома передана ясно, а её буквальная форма и синтаксическая неоднозначность отмечены в сноске.
