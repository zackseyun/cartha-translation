  source_fidelity: 'Основной смысл передан точно: весть достигает Иоава, названа его поддержка Адонии в противопоставлении Авессалому, затем его бегство к шатру Яхве и хватание за рога жертвенника. Однако «хотя» придаёт связи уступительное значение, которого еврейский текст однозначно не требует: waw естественнее передать нейтральным «а» (или «но»).'
