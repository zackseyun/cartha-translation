base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: ru
  text: 'По истечении трёх лет два раба Шимея убежали к Ахишу, сыну Маахи, царю Гефа. И Шимею сообщили: «Вот, твои рабы в Гефе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: по прошествии трёх лет
  rationale: Передаёт достижение конца трёхлетнего периода естественным современным русским оборотом.
- source_word: וַיִּבְרְחוּ
  choice: убежали
  rationale: В контексте ухода зависимых людей от хозяина естественно передаёт значение бегства.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: рабы / твои рабы
  rationale: Контекст побега от хозяина подчёркивает несвободный статус; русское «слуги» могло бы его затушевать.
- source_word: אֶל אָכִישׁ בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: к Ахишу, сыну Маахи, царю Гефа
  rationale: Сохраняет направление движения, родовое именование и титул; названия переданы в принятой русской библейской форме.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: Шимею сообщили
  rationale: Неопределённое множественное подлежащее естественно передаётся русской неопределённо-личной конструкцией; отдельное «говоря» избыточно перед прямой речью.
- source_word: הִנֵּה עֲבָדֶיךָ בְּגַת
  choice: Твои рабы в Гефе
  rationale: В кратком сообщении הִנֵּה выполняет указательно-презентативную функцию, которая по-русски естественно выражается самой конструкцией; «вот» возможно, но здесь необязательно.
