    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: И повелел царь
  rationale: Глагол צוה прямо передаёт властное распоряжение царя; «повелел» сохраняет достоинство повествовательного регистра.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Ванее, сыну Иодая
  rationale: Имена переданы в закрепившейся русской библейской форме; дательный падеж обусловлен управлением глагола «повелел».
- source_word: וַיֵּצֵא
  choice: тот вышел
  rationale: Местоимение «тот» естественно уточняет, что действие совершил Ванея, а не царь, не добавляя нового содержания.
- source_word: וַיִּפְגַּע בּוֹ
  choice: поразил Семия
  rationale: פגע с предлогом ב в контексте казни означает нанесение смертельного удара. Имя объекта восстановлено из непосредственного контекста стиха 2:44; это устраняет неясность двух русских местоимений подряд, тогда как следующий глагол отдельно сообщает результат.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: 'Прямо сохранена еврейская последовательность: удар, затем смерть.'
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: Так царство утвердилось
  rationale: Nifal от כון выражает состояние прочной установленности; «утвердилось» естественно передаёт и результат, и итоговую функцию заключительной фразы.
- source_word: בְּיַד שְׁלֹמֹה
  choice: в руках Соломона
  rationale: Сохранён образ еврейской идиомы, обозначающей власть и контроль; русское множественное «в руках» является естественным идиоматическим соответствием.
theological_decisions:
- issue: Характер утверждения царства
  choice: Сохранить политически-властный смысл формулы «царство утвердилось в руках Соломона»
  alternative: «власть Соломона окончательно укрепилась»
  rationale: Буквенный образ не утверждает отдельно ни божественного одобрения казни, ни исключительно личной власти; он подводит итог установлению царства под контролем Соломона.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Начальное «И» сохраняет связь с цепью древнееврейского повествования. Архаичные обороты устранены, однако традиционные формы имён сохранены для узнаваемости.
