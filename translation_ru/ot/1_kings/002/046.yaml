  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: ru
  text: И царь отдал приказ Ванее, сыну Иодая; тот вышел, поразил Семея, и тот умер. Так царство утвердилось в руках Соломона.[a]
  philosophy: optimal-equivalence
  footnotes:
