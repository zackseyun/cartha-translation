base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: ru
  text: 'А священнику Авиафару царь сказал: «Ступай в Анафоф, на своё поле. Ты заслуживаешь смерти[a], но сегодня я не казню тебя, потому что ты нёс ковчег Господа Яхве перед Давидом, отцом моим, и терпел все тяготы, которые терпел отец мой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ты человек смерти», то есть подлежишь смертной казни.'
    reason: Пояснение древнееврейской юридической идиомы אִישׁ מָוֶת.
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Анафоф
  rationale: Традиционная русская передача названия города левитов, соответствующая древнееврейскому топониму.
- source_word: עַל שָׂדֶיךָ
  choice: в своё владение
  rationale: Буквально «на своё поле»; в контексте речь идёт о возвращении Авиафара в принадлежавшее ему земельное владение в Анафофе. Такая передача естественна по-русски и не предполагает обязательно одно обрабатываемое поле.
- source_word: אִישׁ מָוֶת
  choice: ты заслуживаешь смерти[a]
  rationale: Древнееврейская идиома буквально означает «человек смерти», то есть человек, подлежащий смертной казни. Смысл передан ясно, а буквальный образ сохранён в примечании.
- source_word: אֲמִיתֶךָ
  choice: не предам тебя смерти
  rationale: Каузативная форма глагола מות означает «умертвить, предать смерти». Формулировка соответствует судебному контексту и сохраняет повтор слова «смерть».
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: ты носил ковчег Владыки Яхве
  rationale: נשא здесь обозначает физическое несение ковчега. Сочетание אֲדֹנָי יְהוִה передано двумя отдельными элементами — титулом «Владыка» и личным именем «Яхве» — без слияния или устранения одного из них.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: перед Давидом, отцом моим
  rationale: Сохраняется пространственно-реляционное значение לִפְנֵי — «перед, в присутствии» — и слегка торжественный порядок слов оригинала.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: терпел все тяготы, которые терпел отец мой
  rationale: Парные формы от ענה выражают перенесённые страдания и унижения. Повтор «терпел» воспроизводит намеренное лексическое эхо оригинала, а «тяготы» естественно указывает на разделённые с Давидом бедствия.
- source_word: כִּי ... וְכִי
  choice: потому что ... и
  rationale: Обе части сообщают основания для помилования; русский союз «и» при общей причинной рамке избегает тяжеловесного повтора, не меняя логической связи.
theological_decisions:
- issue: Передача составного божественного именования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: В исходном тексте присутствуют и титул אֲדֹנָי, и тетраграмматон יהוה. Передача «Владыка Яхве» различает оба элемента, сохраняет личное имя и избегает неестественного сочетания «Господь Господь».
- issue: Характер участия Авиафара в бедствиях Давида
  choice: терпел все тяготы, которые терпел отец мой
  alternative: разделял все страдания моего отца
  rationale: Выбранная формулировка не сводит значение лишь к сочувствию, а указывает на реально перенесённые Авиафаром бедствия и сохраняет повтор двух однокоренных форм исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Имена переданы в привычной русской библейской форме; синтаксис упрощён там, где буквальное воспроизведение было бы тяжеловесным, при сохранении повторов и причинных связей оригинала.
