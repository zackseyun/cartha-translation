- from: 'А священнику Авиафару царь сказал: «Ступай в Анафоф, в своё владение. Ты заслуживаешь смерти[a], но сегодня я не предам тебя смерти, потому что ты носил ковчег Владыки Яхве перед Давидом, отцом моим, и терпел все тяготы, которые терпел отец мой».'
  to: 'А священнику Авиафару царь сказал: «Ступай в Анафоф, на своё поле. Ты заслуживаешь смерти[a], но сегодня я не казню тебя, потому что ты нёс ковчег Господа Яхве перед Давидом, отцом моим, и терпел все тяготы, которые терпел отец мой».'
