  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: ru
  text: И Соломон изгнал Авиафара, лишив его священнического служения Яхве, и тем исполнил[a] слово Яхве, которое Он произнёс о доме Илия в Силоме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы исполнить слово Яхве». Еврейская конструкция может выражать цель или результат.'
    reason: alternative_reading
  - marker: b
    text: См. 1 Царств 2:27–36; 3:11–14 — о слове, произнесённом против дома Илия.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: отстранил
  rationale: Глагол означает изгнание или удаление. В сочетании с последующим указанием на священническое служение «отстранил» естественно передаёт официальное лишение Авиафара его роли, не подразумевая без достаточных оснований изгнание из страны.
- source_word: מִהְיוֹת כֹּהֵן
  choice: от служения священником
  rationale: Конструкция с מִן и инфинитивом היה обозначает удаление из состояния или должности; русский оборот ясно показывает прекращение священнического служения.
- source_word: כֹּהֵן לַיהוָה
  choice: священником Яхве
  rationale: Дательный предлог ל выражает принадлежность служения Яхве. Такая формулировка естественна по-русски и не добавляет отсутствующих в тексте уточнений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְמַלֵּא
  choice: и тем исполнил
  rationale: Инфинитив с ל может выражать как цель, так и результат. Оборот «и тем исполнил» естественно представляет поступок Соломона как осуществление ранее произнесённого слова, а альтернативная целевая трактовка отмечена в сноске.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Устойчивое и контекстуально точное обозначение данного прежде Божьего пророческого изречения.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое Он произнёс
  rationale: Местоимение с прописной буквы делает в русском тексте ясной отсылку к Яхве, а глагол «произнёс» соответствует торжественному повествовательному регистру.
- source_word: עַל בֵּית עֵלִי
  choice: о доме Илия
  rationale: עַל допускает значения «о» и «против». Нейтральное «о» сохраняет широту конструкции, тогда как содержание суда ясно из контекста и параллельных мест.
- source_word: בְּשִׁלֹה
  choice: в Силоме
  rationale: Предлог ב имеет обычное местное значение; форма соответствует принятому русскому названию города.
theological_decisions:
- issue: Связь поступка Соломона с пророческим словом
  choice: 'Поступок представлен как осуществление ранее произнесённого слова Яхве: «и тем исполнил».'
  alternative: «Чтобы исполнить слово Яхве», то есть с акцентом на цель поступка.
  rationale: לְמַלֵּא может обозначать результат либо цель. Основной текст подчёркивает свершившееся исполнение пророчества, не утверждая прямо внутренний мотив Соломона; грамматическая альтернатива сохранена в сноске.
- issue: Направленность слова о доме Илия
  choice: «о доме Илия»
  alternative: «против дома Илия»
  rationale: Хотя в контексте это слово суда, предлог עַל сам по себе допускает более широкое «о». Перевод не усиливает формулировку сверх выраженного в данном стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; личное имя יהוה последовательно передано как «Яхве». Все сноски отмечены в основном тексте.
