revisions:
- from: И Соломон отстранил Авиафара от служения священником Яхве и тем исполнил[a] слово Яхве, которое Он произнёс о доме Илия в Силоме[b].
  to: И Соломон изгнал Авиафара, лишив его священнического служения Яхве, и тем исполнил[a] слово Яхве, которое Он произнёс о доме Илия в Силоме[b].
  rationale: «Изгнал» прямо передаёт силу וַיְגָרֶשׁ. Оборот «лишив его священнического служения Яхве» идиоматично выражает удаление Авиафара из положения священника Яхве, не добавляя конкретного места изгнания. Остальные элементы и обе сноски сохранены, поскольку они верно передают синтаксическую неоднозначность и контекстуальную связь.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:25:38Z'
