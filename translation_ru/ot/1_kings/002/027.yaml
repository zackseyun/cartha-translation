  naturalness: Предлагаемая редакция естественна для современного литературного русского и сохраняет сжатый повествовательный стиль. Оборот «лишив его священнического служения Яхве» ясно выражает удаление из статуса, переданного מִהְיוֹת כֹּהֵן לַיהוָה.
  terminology: «Яхве», «слово Яхве», «дом Илия» и «Силом» приемлемы. Основной текст сохраняет результативное понимание לְמַלֵּא, а сноска корректно отмечает возможное целевое значение. Перекрёстная ссылка соответствует указанным местам.
