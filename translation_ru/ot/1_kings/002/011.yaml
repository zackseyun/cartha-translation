base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: ru
  text: 'Давид царствовал над Израилем сорок лет: в Хевроне он царствовал семь лет, а в Иерусалиме — тридцать три года.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ דָּוִד
  choice: Давид царствовал… сорок лет
  rationale: 'Еврейский оборот буквально говорит: «и дни, которые царствовал Давид… — сорок лет». В современном русском естественнее прямо выразить продолжительность царствования, не теряя смысла исходной идиомы.'
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол точно передаёт царское правление и сохраняет повтор ключевого понятия в сводке о правлении Давида.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при מָלַךְ обозначает власть над народом; «царствовал над Израилем» — естественное и точное русское сочетание.
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Предлог בְּ обозначает место; название города передано в принятой русской библейской форме.
- source_word: וּבִירוּשָׁלִַם
  choice: а в Иерусалиме
  rationale: Союз ו в данном перечислении естественно передаётся русским «а», подчёркивающим переход ко второму месту царствования без смыслового противопоставления.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: тридцать три года
  rationale: Современная русская форма составного числительного точно передаёт еврейское «тридцать и три».
