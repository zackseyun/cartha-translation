  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: ru
  text: И почил Давид с отцами своими и был похоронен в Городе Давида.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Почил с отцами своими» — обычное древнееврейское выражение, означающее смерть.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В царской формуле о смерти глагол שׁכב входит в устойчивое выражение. Русское «почил» естественно передаёт смерть и вместе с тем сохраняет образ покоя, не сводя выражение к простому «умер».
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохраняет традиционный семитский оборот и его родовую окраску; более разъясняющее «со своими предками» возможно, но менее формально близко к тексту.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Нифаль здесь имеет пассивное значение; «был похоронен» — ясный и естественный современный русский эквивалент.
- source_word: בְּעִיר דָּוִד
  choice: в Городе Давида
  rationale: Передаёт устойчивое географическое наименование; прописная буква показывает, что это название места, а не общее описание.
- source_word: וַ
  choice: И
  rationale: Начальное повествовательное וַ последовательно продолжает рассказ; «И» сохраняет синтаксическую связь с предшествующим контекстом и библейскую повествовательную плавность.
