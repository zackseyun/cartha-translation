base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: ru
  text: 'Тогда царь послал за Шимеем, призвал его и сказал ему: «Разве я не взял с тебя клятву именем Яхве и не предупредил тебя[a], сказав: „В тот день, когда ты выйдешь и пойдёшь куда бы то ни было[b], знай наверняка: ты непременно умрёшь“? И ты сказал мне: „Это хорошее слово[c]; я услышал“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «торжественно обязал тебя» или «засвидетельствовал против тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пойдёшь туда или сюда»; это выражение означает «пойдёшь куда бы то ни было».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Это хорошее дело»; также возможно: «Хорошо то, что ты сказал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: взял с тебя клятву перед Яхве
  rationale: Каузативная форма глагола שבע означает, что царь заставил Шимея поклясться или связал его клятвой. Русское выражение «взял с тебя клятву» естественно передаёт этот смысл; «перед Яхве» сохраняет религиозно-правовую силу формулы, не подменяя имя Божье титулом.
- source_word: וָאָעִד בְּךָ
  choice: предупредил тебя
  rationale: В данном контексте Hiphil глагола עוד обозначает официальное предостережение, связанное с клятвой. Более судебные оттенки — «торжественно обязал» или «призвал в свидетели против тебя» — сохранены в сноске.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: пойдёшь куда бы то ни было
  rationale: Парное выражение буквально означает движение «туда или сюда» и идиоматически охватывает любое место назначения.
- source_word: יָדֹעַ תֵּדַע
  choice: знай наверняка
  rationale: Инфинитив абсолютный усиливает личную форму глагола и выражает несомненность знания; русское «знай наверняка» передаёт усиление без неестественного повтора.
- source_word: מוֹת תָּמוּת
  choice: ты непременно умрёшь
  rationale: Инфинитив абсолютный при личной форме усиливает уверенность и категоричность смертного приговора.
- source_word: טוֹב הַדָּבָר
  choice: Хорошо это слово
  rationale: דבר допускает значения «слово», «высказывание» и «дело». Выбор «слово» сохраняет прямую связь с произнесённым царём условием и не устраняет лексическую неоднозначность.
- source_word: שָׁמָעְתִּי
  choice: я услышал
  rationale: Перевод сохраняет прямое значение глагола שמע. В данном юридическом контексте слышание может подразумевать принятие сказанного, но текст не выражает это отдельным словом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное covenantное имя יהוה. Передача «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Подразумевает ли שָׁמָעְתִּי согласие или послушание
  choice: я услышал
  alternative: я принимаю; я послушаюсь
  rationale: Контекст допускает оттенок принятия условия, однако буквальная формулировка сохраняет напряжение между услышанным предупреждением и последующим нарушением Шимея, не усиливая его ответ сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-судебной речи. Синтаксис риторического вопроса сохранён, но тяжёлые еврейские повторы переданы естественными русскими усилителями. Имя שִׁמְעִי передано как «Шимей», ближе к еврейской форме.
