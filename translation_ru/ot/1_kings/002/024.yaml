base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: ru
  text: А теперь, как жив Яхве, Который утвердил меня, посадил меня на престол моего отца Давида и устроил мне дом[a], как и обещал, — сегодня Адония будет предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроил для меня династию». В царском контексте еврейское слово «дом» может обозначать продолжающийся род, а не здание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: жив Яхве
  rationale: Сохранена обычная древнееврейская формула клятвы с прямым упоминанием личного имени Бога; в русском она естественно передаётся формулой «жив Яхве».
- source_word: הֱכִינַנִי
  choice: утвердил меня
  rationale: Порода hифиль глагола כון выражает утверждение, упрочение положения; в контексте речь идёт об утверждении Соломона как царя.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: посадил меня на престол
  rationale: Передаёт каузативное значение глагола и естественно обозначает возведение на царский престол.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: престол Давида, отца моего
  rationale: Сохраняет структуру еврейского сочетания и торжественный, но понятный современному читателю регистр.
- source_word: עָשָׂה לִי בַּיִת
  choice: создал мне дом
  rationale: Основной текст сохраняет образ «дома», значимый для повествования о Божьем обещании Давиду; возможный династический смысл пояснён в сноске.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: как и обещал
  rationale: Буквально «как говорил», но в контексте исполненного Божьего обязательства русское «как и обещал» ясно передаёт прагматический смысл.
- source_word: כִּי
  choice: двоеточие после формулы клятвы
  rationale: Здесь частица вводит торжественно подтверждаемое содержание клятвы. В русском её усилительная функция естественно выражается всей синтаксической конструкцией, без отдельного слова.
- source_word: יוּמַת
  choice: будет предан смерти
  rationale: 'Передаёт пассивно-каузативное значение формы hофаль: Адония не просто умрёт, а будет казнён по царскому приговору.'
- source_word: אֲדֹנִיָּהוּ
  choice: Адония
  rationale: Традиционная и узнаваемая русская форма библейского личного имени.
theological_decisions:
- issue: Значение слова «дом» в царском контексте
  choice: Сохранить «дом» в основном тексте, пояснив династический смысл в сноске
  alternative: Передать непосредственно как «династия» или «царский род»
  rationale: בַּיִת может обозначать не здание, а продолжающийся царский род. Сохранение образа «дома» удерживает связь с обещанием Давиду и не устраняет намеренную ёмкость выражения.
- issue: Характер слов Яхве
  choice: Передать כַּאֲשֶׁר דִּבֵּר как «как и обещал»
  alternative: 'Более буквально: «как Он говорил»'
  rationale: Контекст указывает на исполнение данного Богом слова; «обещал» выражает эту силу высказывания, не вводя дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным звучанием, соответствующим царской клятве и приговору. Архаизмы устранены, но формула «жив Яхве» и образ «дома» сохранены ради смысловой и межтекстовой точности.
