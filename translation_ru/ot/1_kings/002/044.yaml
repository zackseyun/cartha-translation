source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: ru
  text: 'И сказал царь Шимею: «Ты знаешь всё зло, о котором знает твоё сердце[a], — всё, что ты сделал Давиду, отцу моему. И Яхве обратил твоё зло на твою же голову[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которое знает твоё сердце». То есть Шимей внутренне сознаёт свою вину.'
    reason: Пояснение сохранённого еврейского образа и его смыслового акцента.
  - marker: b
    text: 'Или: «возвратил твоё зло на твою голову». Еврейский глагол изображает зло Шимея возвращающимся на него самого.'
    reason: Лексическая альтернатива, уточняющая образ воздаяния.
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: И сказал царь Шимею
  rationale: Последовательная форма с וַ передаёт дальнейшее развитие повествования; в русском библейском повествовании естественно и достойно звучит «И сказал».
- source_word: אַתָּה יָדַעְתָּ
  choice: Ты знаешь
  rationale: Самостоятельное местоимение подчёркивает личную осведомлённость Шимея; отдельное «ты» сохраняет этот акцент без искусственного усиления.
- source_word: כָּל הָרָעָה
  choice: всё зло
  rationale: רָעָה здесь обозначает нравственно дурные поступки против Давида; «зло» сохраняет их моральную оценку.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: о котором знает твоё сердце
  rationale: Сохранена еврейская персонификация сердца как носителя внутреннего знания и осознания вины.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: всё, что ты сделал Давиду, отцу моему
  rationale: Повтор «всё» естественно связывает относительное придаточное с «всё зло» и устраняет тяжеловесное нагромождение русских придаточных.
- source_word: וְהֵשִׁיב
  choice: И ... обратил
  rationale: 'Hiphil от שוב выражает причинение возврата: Яхве обращает содеянное зло обратно на виновного. «Обратил» сохраняет образ воздаяния, не сводя его к более толковательному «воздал».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, прямо стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֶת רָעָתְךָ
  choice: твоё зло
  rationale: Повтор слова «зло» воспроизводит повтор רָעָה и подчёркивает соответствие между поступком Шимея и постигшим его воздаянием.
- source_word: בְּרֹאשֶׁךָ
  choice: на твою же голову
  rationale: Сохранён исходный образ возвращающегося на виновника воздаяния; частица «же» естественно передаёт возвратность и направленность на самого Шимея.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст употребляет собственное имя Бога. Транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Божественное действие в воздаянии
  choice: Яхве обратил твоё зло на твою же голову
  alternative: Яхве воздал тебе за твоё зло
  rationale: Формулировка сохраняет прямо выраженное действие Яхве и образ возвращения зла на виновника, не расширяя высказывание до общей доктрины воздаяния.
- issue: Временное значение וְהֵשִׁיב
  choice: обратил
  alternative: обратит
  rationale: Форма — перфект с соединительным וְ, поэтому основной перевод передаёт действие как совершившееся или уже приведённое в исполнение. Контекст может допускать пророческую уверенность, но перевод не заменяет грамматическую форму будущим временем.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Сохранены повтор «зло», образ знающего сердца и идиома «на голову»; синтаксис слегка перестроен ради ясности без устранения смыслового напряжения.
