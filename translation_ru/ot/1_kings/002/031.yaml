base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: ru
  text: 'Тогда царь сказал ему: «Сделай, как он сказал: порази его и похорони. Так сними с меня и с дома моего отца невинную кровь[a], которую пролил Иоав».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «невинная кровь» означает кровь, пролитую без правого основания; в данном контексте оно также подразумевает вину за такое кровопролитие.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Сделай, как он сказал
  rationale: Прямо и естественно передаёт повеление исполнить только что высказанное требование Иоава.
- source_word: וּפְגַע בּוֹ
  choice: порази его
  rationale: В данном контексте פגע ב означает нанести смертельный удар, то есть казнить; «порази» сохраняет образность и не смягчает приказ.
- source_word: וּקְבַרְתּוֹ
  choice: и похорони
  rationale: Последовательное повеление передано без добавочного уточнения, отсутствующего в еврейском тексте.
- source_word: וַהֲסִירֹתָ
  choice: Так сними
  rationale: Форма продолжает цепь повелений и одновременно допускает оттенок результата; «так» естественно связывает казнь и погребение со снятием вины.
- source_word: דְּמֵי חִנָּם
  choice: вину за невинную кровь
  rationale: Буквально выражение означает «невинная кровь», но в сочетании со снятием её с человека и дома обозначает ответственность за несправедливое кровопролитие. Включение слова «вина» делает этот юридико-нравственный смысл ясным по-русски, сохраняя образ крови.
- source_word: שָׁפַךְ
  choice: пролил
  rationale: Устойчивое русское соответствие выражению о насильственном пролитии крови.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: с меня и с дома моего отца
  rationale: Сохраняет пространственную метафору вины, лежащей на человеке и царском доме.
theological_decisions:
- issue: Ответственность Соломона и дома Давида за пролитую Иоавом кровь
  choice: «сними с меня и с дома моего отца вину за невинную кровь»
  alternative: «удали от меня и от дома моего отца невинную кровь»
  rationale: Перевод сохраняет представление о вменяемой ответственности за несправедливое кровопролитие, не определяя точнее, каким образом казнь Иоава её снимает.
translation_notes:
  register: Современный литературный русский язык с кратким, властным тоном царского приказа. Синтаксис остаётся близким к еврейскому, но юридико-нравственный смысл идиомы передан понятно для обычного читателя.
