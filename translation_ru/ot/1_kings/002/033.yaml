id: 1KI.2.33
reference: 1 Kings 2:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: ru
  text: И кровь их обратится на голову Иоава и на голову его потомков навеки[a], а Давиду, его потомкам, его дому и его престолу будет мир навеки от Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «кровь их»; это выражение указывает на вину за пролитую кровь и на последствия кровопролития.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: И… обратится
  rationale: Глагол буквально означает «вернуться, обратиться назад»; в данном судебном изречении форма выражает будущее последствие. Перевод сохраняет образ возмездия, возвращающегося к виновному.
- source_word: דְמֵיהֶם
  choice: кровь их
  rationale: Сохранён конкретный образ крови убитых; в сочетании с выражением «на голову» он указывает также на вину за пролитую кровь и её последствия.
- source_word: בְּרֹאשׁ
  choice: на голову
  rationale: Сохранена древнееврейская судебная метафора, согласно которой вина и последствия поступка ложатся на виновного.
- source_word: זַרְעוֹ
  choice: его потомков
  rationale: В данном династическом контексте собирательное זֶרַע естественно передаётся современным русским словом «потомки», а не буквальным «семя».
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: навеки
  rationale: Краткое и весомое соответствие выражению неограниченной, непреходящей длительности; одинаковый перевод сохраняет словесную связь двух частей стиха.
- source_word: יִהְיֶה שָׁלוֹם
  choice: будет мир
  rationale: 'Передаёт прямое утверждение о будущем, сохраняя широкое значение שָׁלוֹם: мир, благополучие и устойчивость, не сводя его лишь к процветанию.'
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: Давиду, его потомкам, его дому и его престолу
  rationale: Дательный падеж естественно передаёт значение отношения и предназначения. Слова «дом» и «престол» сохранены ради их династического смысла.
- source_word: מֵעִם יְהוָה
  choice: от Яхве
  rationale: Предлог обозначает источник мира, а личное имя Бога передано как «Яхве».
theological_decisions:
- issue: Противопоставление участи Иоава и участи Давида
  choice: а Давиду… будет мир
  alternative: и Давиду… будет мир
  rationale: Хотя еврейский союз формально может означать «и», по смыслу здесь противопоставлены суд над Иоавом и мир для Давида. Союз «а» ясно и без избыточного усиления передаёт этот контраст.
- issue: Значение שָׁלוֹם в династическом контексте
  choice: мир
  alternative: благополучие
  rationale: «Мир» сохраняет многозначность исходного слова, включая благополучие, целостность и устойчивость дома и престола Давида, тогда как «благополучие» было бы уже по смыслу.
- issue: Связь потомков Иоава с кровной виной
  choice: сохранить прямое утверждение текста без богословского смягчения
  alternative: истолковать слова только как последствия для самого Иоава
  rationale: Исходный текст прямо упоминает потомков Иоава и не объясняет механизм или меру этого последствия; перевод сохраняет напряжение и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-царского изречения. Синтаксис остаётся близким к еврейскому параллелизму, но читается естественно; повтор «навеки» намеренно сохранён.
