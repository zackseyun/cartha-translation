base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: ru
  text: 'Он сказал: «Ты знаешь, что царская власть принадлежала мне и весь Израиль обратил ко мне свои взоры[a], ожидая, что я стану царём. Но царская власть перешла к моему брату, потому что досталась ему от Яхве[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь Израиль обратил ко мне свои лица»; то есть ожидал, что царём станет он.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что она была ему от Яхве». Еврейская конструкция указывает на Яхве как источник царской власти, не называя прямо способ её передачи.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: царская власть
  rationale: В данном контексте слово обозначает не территорию, а царское правление и право на престол; «царская власть» ясно передаёт этот смысл по-русски.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: весь Израиль обратил ко мне свои взоры
  rationale: Передаёт направленность и ожидание, выраженные еврейским оборотом «обратить/устремить лицо», сохраняя его образность в естественной русской форме.
- source_word: לִמְלֹךְ
  choice: ожидая, что я стану царём
  rationale: В контексте притязаний Адонии инфинитив относится к его воцарению; конструкция с «ожидая» естественно связывает его с предшествующей идиомой, не утверждая законности притязания.
- source_word: וַתִּסֹּב
  choice: перешла
  rationale: Глагол описывает поворот событий и передачу власти другому; «перешла» сохраняет идею перемены без уточнения её механизма.
- source_word: וַתְּהִי לְאָחִי
  choice: к моему брату
  rationale: В сочетании «царская власть перешла к моему брату» естественно передаёт значение принадлежности и перехода, выраженное предлогом לְ.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: потому что досталась ему от Яхве
  rationale: Передаёт Яхве как источник перехода царской власти, не добавляя отсутствующего в еврейском тексте прямого глагола «дал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אָחִי
  choice: моему брату
  rationale: Прямо передаёт родственное обозначение Соломона с точки зрения Адонии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Степень определённости Божьего участия в переходе власти
  choice: потому что досталась ему от Яхве
  alternative: потому что Яхве отдал её ему
  rationale: Еврейская фраза утверждает, что власть была у брата «от Яхве», но не употребляет глагол «дать»; выбранная формулировка сохраняет божественный источник и не усиливает синтаксис.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «царская власть» сохранён ради ясности референта; притязание Адонии передано как его собственное утверждение без богословского одобрения.
