  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: ru
  text: А сыновьям Верзеллия Галаадитянина окажи милость[a], и пусть они будут среди тех, кто ест за твоим столом[b], ведь они пришли ко мне на помощь[c], когда я бежал от Авессалома, твоего брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступи преданно с сыновьями Верзеллия». Еврейское выражение может обозначать не только доброту, но и верную, деятельную благосклонность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «среди едящих за твоим столом» — то есть получающих постоянное содержание и особую благосклонность царя.'
    reason: cultural_note
  - marker: c
    text: 'Или: «пришли ко мне», «приблизились ко мне». Еврейский глагол буквально означает «приблизились»; в этом контексте он подразумевает помощь Давиду во время бегства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: А сыновьям
  rationale: Союз продолжает ряд наставлений Давида; русское «А» естественно передаёт переход и лёгкое противопоставление предыдущему распоряжению. «Сыновьям» сохраняет конкретное значение בנים в данном повествовательном контексте.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Верзеллия Галаадитянина
  rationale: Использованы укоренившиеся в русской библейской традиции формы имени и обозначения происхождения, понятные современному читателю.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: окажи милость
  rationale: Устойчивое сочетание передаёт деятельную доброту и благосклонность; примечание сохраняет возможный оттенок верности и преданности в חֶסֶד.
- source_word: וְהָיוּ
  choice: и пусть они будут
  rationale: В контексте наставления форма выражает волю или распоряжение Давида, что естественно передаётся конструкцией «пусть будут».
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: среди тех, кто ест за твоим столом
  rationale: Сохранён образ постоянного участия в царской трапезе, подразумевающий содержание и благосклонность.
- source_word: כִּי כֵן
  choice: потому что так
  rationale: Переданы причинное значение כִּי и указательно-сопоставительный смысл כֵן без излишнего уточнения характера ответной милости.
- source_word: קָרְבוּ אֵלַי
  choice: они приблизились ко мне
  rationale: Сохранено буквальное и неоднозначное значение корня קרב; контекст допускает смысл поддержки, отмеченный в сноске.
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: когда я бежал от
  rationale: Инфинитивная конструкция естественно передана временным придаточным, а מִפְּנֵי в контексте бегства — русским «от».
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: Авессалома, твоего брата
  rationale: Сохранено родственное обозначение, важное для семейного и политического контекста наставления.
theological_decisions:
- issue: Оттенок חֶסֶד
  choice: милость
  alternative: верность / преданная доброта
  rationale: Контекст требует практической благосклонности в ответ на прежнюю поддержку, но не обязывает вводить специализированную терминологию завета; более широкий оттенок указан в сноске.
- issue: Смысл קָרְבוּ אֵלַי
  choice: приблизились ко мне
  alternative: поддержали меня / пришли ко мне
  rationale: Буквальная формулировка сохраняет смысловую открытость еврейского текста, тогда как контекстуальное значение поддержки поясняется отдельно.
