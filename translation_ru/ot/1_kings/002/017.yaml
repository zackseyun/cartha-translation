lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Прошу, поговори
  rationale: Повелительная форма женского рода с частицей נָא выражает вежливую просьбу Адонии к Вирсавии. Такая передача естественна для современного русского языка.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: с царём Соломоном
  rationale: Глагол «поговори» по-русски естественно управляет предлогом «с»; царский титул поставлен перед именем согласно обычному русскому порядку.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы; «ведь» естественно передаёт пояснительно-причинный оттенок в прямой речи.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: он тебе не откажет
  rationale: Еврейская идиома буквально говорит о том, что царь «не возвратит (не отвернёт) твоего лица»; по смыслу это отказ просителю или в просьбе.
- source_word: וְיִתֶּן לִי
  choice: чтобы он отдал мне
  rationale: Префиксальная форма после просьбы передаёт содержание ходатайства. «Чтобы он отдал мне» ясно и естественно выражает требуемое действие, не превращая его в самостоятельное пожелание.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Ависагу Сунамитянку
  rationale: Имя и обозначение происхождения переданы в традиционной русской библейской форме; падежные окончания соответствуют синтаксису русского предложения.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивое современное русское выражение точно передаёт цель — вступление в брак.
