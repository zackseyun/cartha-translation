base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: ru
  text: А царь Соломон будет благословен[a], и престол Давида будет утверждён пред Яхве навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царь Соломон благословен». Еврейское именное сказуемое может быть понято как утверждение в настоящем времени, хотя контекст поддерживает и выбранное в основном тексте будущее значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: А царь Соломон
  rationale: Союз ו передаёт контраст с приговором Семею в предыдущем стихе, поэтому русское «А» естественно выражает ход мысли; имя и титул переведены прямо.
- source_word: בָּרוּךְ
  choice: будет благословен
  rationale: Краткое страдательное прилагательное или причастие означает «благословен». Будущая связка согласует высказывание с последующим יִהְיֶה и с направленным в будущее царским провозглашением, не скрывая возможного чтения в настоящем времени, отмеченного в сноске.
- source_word: וְ/כִסֵּא דָוִד
  choice: и престол Давида
  rationale: 'Сохранены сочинительная связь и еврейская конструкция принадлежности: «престол Давида».'
- source_word: יִהְיֶה נָכוֹן
  choice: будет утверждён
  rationale: Сочетание היה с נכון выражает устойчивость, прочность и утверждённость. Формулировка естественна для династического престола и сохраняет образ исходного текста.
- source_word: לִ/פְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי буквально означает «перед, пред, в присутствии». «Пред» сохраняет торжественный, но понятный современному читателю регистр; личное имя יְהוָה передано как «Яхве».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткий и естественный русский эквивалент значения «навсегда, вовеки», уместный в контексте обещания о престоле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; личное имя сохранено в общепринятой научной русской форме без замены титулом.
- issue: Временная отнесённость בָּרוּךְ
  choice: будет благословен
  alternative: благословен
  rationale: Контекст судебного провозглашения и параллельное יִהְיֶה поддерживают направленное в будущее прочтение. Поскольку сама безглагольная форма допускает декларацию настоящего состояния, этот вариант сохранён в сноске.
- issue: Характер обещания о престоле Давида
  choice: будет утверждён пред Яхве навеки
  alternative: будет прочен пред Яхве навеки
  rationale: Перевод сохраняет династическую и богословскую силу формулы, не уточняя сверх текста, каким именно образом или при каких условиях престол будет утверждён.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Форма «пред Яхве» лаконична и соответствует царскому провозглашению; синтаксис остаётся ясным для обычного современного читателя.
