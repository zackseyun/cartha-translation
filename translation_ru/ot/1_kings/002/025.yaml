  text: И царь Соломон послал Бенаю, сына Иехояды. Беная поразил его, и тот умер.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное значение глагола שׁלח точно передаёт действие, не добавляя явно не выраженного в самом глаголе значения приказа о казни.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Естественная русская форма сохраняет и титул, и личное имя.
- source_word: בְּיַד
  choice: послал Бенаю
  rationale: Буквально «рукой Бенаи»; в данном контексте оборот обозначает Бенаю как исполнителя поручения. Естественный русский синтаксис делает его прямым дополнением при глаголе «послал», а буквальный образ сохранён в сноске.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Бенаю, сына Иехояды
  rationale: Имена переданы близко к масоретскому звучанию; падежные формы и приложение соответствуют нормам современного литературного русского языка.
- source_word: וַיִּפְגַּע בּוֹ
  choice: Тот поразил его
  rationale: Глагол פגע с предлогом ב в этом контексте обозначает враждебное, смертельное поражение. «Поразил» сохраняет отдельное последующее сообщение о смерти и не сводит обе еврейские глагольные формы к одному слову «убил».
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Простая последовательная конструкция сохраняет самостоятельное и прямое сообщение еврейского текста о смерти.
