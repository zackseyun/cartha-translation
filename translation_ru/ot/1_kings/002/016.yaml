id: 1KI.2.16
reference: 1 Kings 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁאֵלָ֤ה אַחַת֙ אָֽנֹכִי֙ שֹׁאֵ֣ל מֵֽ/אִתָּ֔/ךְ אַל תָּשִׁ֖בִי אֶת פָּנָ֑/י וַ/תֹּ֥אמֶר אֵלָ֖י/ו דַּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: ru
  text: 'И теперь у меня к тебе одна просьба: не откажи мне[a]. Она сказала ему: «Говори».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отврати (или: не возврати) моего лица»; то есть «не отвергни меня, не откажи в моей просьбе».'
    reason: Сноска сохраняет образность еврейской идиомы и указывает её смысловые варианты.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный элемент וְ и переход к следующему шагу разговора, выраженный עַתָּה.
- source_word: שְׁאֵלָה אַחַת
  choice: одна просьба
  rationale: שְׁאֵלָה означает просьбу или прошение; выбранный вариант естественен в современном русском и сохраняет числительное.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: у меня к тебе
  rationale: Контекстуально и идиоматически передаёт непосредственное обращение с просьбой, избегая неестественного русского «я прошу у тебя одну просьбу».
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: не откажи мне
  rationale: Передаёт смысл еврейской идиомы «не отврати/не возврати моего лица» естественным современным русским выражением; буквальный образ сохранён в сноске.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Она сказала ему
  rationale: Точно передаёт повествовательную последовательность и женский род говорящей.
- source_word: דַּבֵּר
  choice: Говори
  rationale: Кратко и непосредственно передаёт повелительную форму, приглашающую высказать просьбу.
