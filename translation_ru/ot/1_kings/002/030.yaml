base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: ru
  text: 'Тогда Ванея пришёл к шатру Яхве[a] и сказал ему: «Так говорит царь: „Выйди“». Но тот ответил: «Нет, я умру здесь». Ванея передал царю весть: «Так сказал Иоав и так ответил мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скинии Яхве». В еврейском тексте буквально: «шатру Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: шатёр Яхве
  rationale: אֹהֶל буквально означает «шатёр». Такой перевод прямо передаёт еврейский текст и не подменяет его более традиционным, но толковательным словом «скиния».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохраняет обычную древнееврейскую формулу посланника и при этом естественно звучит по-русски.
- source_word: צֵא
  choice: Выйди
  rationale: Точный и естественный русский императив в обращении к человеку, находящемуся внутри шатра.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Нет, я умру здесь
  rationale: Передаёт решительный отказ Иоава и его намерение или ожидание умереть именно на этом месте, не уточняя сверх текста оттенок כִּי.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: передал царю весть
  rationale: Естественно передаёт идиому возвращения с ответом или донесением.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: Так сказал Иоав и так ответил мне
  rationale: Сохраняет повтор כֹּה и формальный характер доклада Ванеи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; форма «Яхве» прямо передаёт тетраграмматон и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «Так говорит царь» и повтор «так… и так» сохранены как особенности исходного повествования; архаизмы по возможности исключены.
