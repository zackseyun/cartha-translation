base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: ru
  text: Тогда Шимей встал, оседлал своего осла и отправился в Геф, к Анхусу, искать своих рабов[a]. Шимей пошёл и привёл своих рабов из Гефа.
  philosophy: optimal-equivalence
  footnotes:
