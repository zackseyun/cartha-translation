lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычное повествовательное значение קום; передаёт последовательность действий естественным современным русским языком.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: оседлал своего осла
  rationale: В контексте поездки חבש обозначает подготовку животного к езде, то есть седлание.
- source_word: גַּתָה
  choice: в Геф
  rationale: Направительный суффикс -ה указывает на движение к городу; использована традиционная русская форма названия.
- source_word: אָכִישׁ
  choice: Анхус
  rationale: Употреблена устоявшаяся в русской библейской традиции форма личного имени.
- source_word: לְבַקֵּשׁ
  choice: искать
  rationale: Конкретное значение בקש в данном повествовательном контексте; слово естественно и не создаёт излишне возвышенного регистра.
- source_word: עֲבָדָיו
  choice: своих рабов
  rationale: עבד может означать раба или слугу. Контекст бегства и возвращения зависимых людей делает значение «рабы» наиболее вероятным, при этом альтернативное понимание отмечено в сноске.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: привёл своих рабов из Гефа
  rationale: Каузативная форма בוא означает «привести». Формулировка сохраняет явно выраженное в еврейском тексте указание исходного места, не добавляя отдельного слова «обратно».
