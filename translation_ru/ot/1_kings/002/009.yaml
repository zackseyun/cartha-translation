  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: ru
  text: Но теперь не оставляй его безнаказанным, ведь ты мудрый человек и знаешь, как с ним поступить; сведи его седую голову в шеол[a] в крови.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу»; или: «в мир мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: не оставляй его безнаказанным
  rationale: Пиэль глагола נקה с объектным суффиксом здесь означает не признать невиновным и не освободить от наказания. Выбранный вариант естественно передаёт судебный смысл.
- source_word: אִישׁ חָכָם
  choice: мудрый человек
  rationale: Сохраняет прямое обращение к Соломону и обычное значение словосочетания.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: и знаешь, что с ним сделать
  rationale: Перфект וְיָדַעְתָּ допускает контекстуальное понимание уверенности Давида в уже присущей Соломону мудрости; по-русски настоящее время звучит естественно и не добавляет модальности долженствования, отсутствующей явно в еврейском тексте.
- source_word: וְהוֹרַדְתָּ
  choice: низведи же
  rationale: Каузативный хифиль от ירד означает «заставить сойти, низвести». В цепи наставлений форма имеет предписывающую силу; «низведи» сохраняет образ и высокий, но понятный регистр.
- source_word: שֵׂיבָתוֹ
  choice: его седину
  rationale: Буквально обозначает седину и метонимически старость. «Его седину» сохраняет выразительный еврейский образ, не заменяя его толкованием.
- source_word: בְּדָם
  choice: в крови
  rationale: Передаёт буквальный предлог ב и резкий образ насильственной, кровавой смерти, не сглаживая его.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет широкий древнееврейский образ мира мёртвых и не сужает его до физической могилы.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет космологическую и богословскую многозначность термина, тогда как «могила» может неоправданно сузить смысл.
- issue: Характер наказания Шимея
  choice: сохранён прямой образ «низведи его седину в крови»
  alternative: умереть кровавой смертью; казнить его
  rationale: Текст ясно предполагает насильственную смерть, но образная формулировка оригинала сохранена без добавления конкретного юридического способа исполнения приговора.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного контекста. Сохранены лаконичность, повелительная сила и суровая образность оригинала; редкий термин «шеол» пояснён сноской.
