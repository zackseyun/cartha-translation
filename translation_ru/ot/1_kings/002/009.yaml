revisions:
- from: Но теперь не оставляй его безнаказанным, ведь ты мудрый человек и знаешь, что с ним сделать. Низведи же его седину в крови в шеол[a].
  to: Но теперь не оставляй его безнаказанным, ведь ты мудрый человек и знаешь, как с ним поступить; сведи его седую голову в шеол[a] в крови.
  rationale: Правка устраняет неестественную русскую сочетаемость, заменяя «седину» на «седую голову», и делает финальный образ синтаксически яснее. Она не смягчает и не конкретизирует насильственный характер смерти, сохраняет каузативную силу הוֹרַדְתָּ, термин «шеол» и его альтернативные значения в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысловое ядро передано верно: Давид запрещает оставлять Шимея без наказания, полагается на мудрость Соломона и предписывает насильственный конец, выраженный образом нисхождения в шеол. Однако «его седину» в роли объекта глагола «низведи» по-русски менее естественно и слабее передаёт образ שֵׂיבָתוֹ как «седой головы»/старости. Порядок «в крови в шеол» также тяжеловесен.'
  naturalness: Текст в целом литературен, но заключительная фраза нуждается в стилистической правке. «Сведи его седую голову в шеол в крови» сохраняет библейскую образность и высокий, понятный современному читателю регистр. «Как с ним поступить» естественнее, чем разговорное «что с ним сделать» в данном судебно-царском контексте.
  terminology: «Шеол» — удачная транслитерация, не навязывающая толкования как исключительно «могила» или «мир мёртвых». Сноска с альтернативами уместна и должна быть прикреплена к этому слову. «Мудрый человек» точно передаёт אִישׁ חָכָם в обращении к Соломону.
  issues:
  - severity: medium
    issue: Не вполне естественный образ «низведи его седину».
    rationale: Еврейское שֵׂיבָתוֹ буквально относится к седине, но в данном устойчивом образе речь о «седой голове» человека. Русское «низвести седину» звучит искусственно, тогда как «свести седую голову» сохраняет и образ, и смысл.
  - severity: medium
    issue: Тяжеловесный порядок слов «в крови в шеол».
    rationale: Два предложных оборота подряд затрудняют чтение. Перестановка «в шеол в крови» соответствует порядку конечного пункта движения и сохраняет намеренно суровый образ еврейского текста.
  - severity: low
    issue: «Что с ним сделать» несколько разговорно для данного регистра.
    rationale: «Как с ним поступить» естественнее в современном литературном русском и точнее отражает обобщённое אֲשֶׁר תַּעֲשֶׂה לוֹ, не конкретизируя способ наказания.
