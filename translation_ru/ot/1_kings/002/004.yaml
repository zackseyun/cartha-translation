base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: ru
  text: 'чтобы Яхве утвердил Своё слово, которое Он сказал обо мне[a]: «Если твои сыновья будут хранить свой путь, ходя предо Мной верно[b], всем сердцем и всей душой, то на престоле Израиля не переведётся твой потомок[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое Он сказал мне». Еврейское выражение буквально означает «сказал обо мне (относительно меня)»; в контексте возможно и понимание «сказал мне».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в истине», «с верностью» или «честно». Еврейское слово может обозначать истину, верность и надёжность.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «у тебя не пресечётся мужчина от престола Израиля». Это еврейский оборот: у Давида не прекратится потомок, занимающий престол Израиля.'
    reason: idiom_explanation
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза естественным русским оборотом.
- source_word: יָקִים
  choice: утвердил
  rationale: Каузатив глагола קום означает «поставить, сделать стоящим», а применительно к слову — утвердить или подтвердить его; «утвердил» сохраняет образ и язык обещания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: דְּבָרוֹ
  choice: Своё слово
  rationale: Сохраняет буквальное «слово», которое в контексте является обещанием; возвратное местоимение естественно для русского синтаксиса.
- source_word: דִּבֶּר עָלַי
  choice: сказал обо мне
  rationale: Предлог עַל обычно выражает значение «о, относительно»; вариант «мне» отмечен в сноске как контекстуально возможная передача.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: будут следить за своим путём
  rationale: Сохраняет метафору жизненного пути и значение שׁמר — внимательно хранить, блюсти или следить.
- source_word: לָלֶכֶת לְפָנַי
  choice: ходя предо Мной
  rationale: Сохраняет библейскую метафору поведения перед Богом и передаёт инфинитив как пояснение того, каким образом сыновья должны блюсти свой путь.
- source_word: בֶּאֱמֶת
  choice: верно
  rationale: В данном нравственно-заветном контексте אֱמֶת обозначает истинность, верность и цельность поведения; «верно» звучит естественно, не сводя выражение только к интеллектуальной истине.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: всем сердцем и всей душой
  rationale: Естественная русская передача полноты внутренней преданности с сохранением обоих еврейских выражений.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: на престоле Израиля всегда будет сидеть кто-нибудь из твоих потомков
  rationale: Передаёт смысл отрицательного династического оборота естественным современным русским языком. Буквальная форма с глаголом «отсекаться/пресекаться» приведена в сноске.
theological_decisions:
- issue: Условность обещания Давиду
  choice: 'Условие сохранено прямо: «Если твои сыновья… то…».'
  alternative: Сгладить условие и представить последующее обещание как безусловное.
  rationale: Еврейский текст явно связывает династическое обещание с поведением сыновей Давида. Перевод не устраняет напряжение с иными формулировками обещания в других местах Писания.
- issue: К кому или о ком было сказано слово
  choice: «сказал обо мне»
  alternative: «сказал мне»
  rationale: Форма עָלַי в данном сочетании естественно читается как «обо мне/относительно меня», хотя контекст допускает традиционное понимание «мне»; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Обороты «Яхве», «ходя предо Мной» и «всем сердцем и всей душой» сохраняют сакральный регистр, тогда как заключительная еврейская идиома передана понятно и естественно; её формальная структура сохранена в сноске.
