  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: ru
  text: 'И пришёл Адония, сын Хаггифы, к Вирсавии, матери Соломона. Она спросила: «С миром ли ты пришёл?» Он ответил: «С миром».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא может означать «приходить» или «идти» в зависимости от точки зрения; здесь повествование ориентировано на Вирсавию, поэтому естественно «пришёл к».
- source_word: אֲדֹנִיָּהוּ
  choice: Адония
  rationale: Традиционная русская библейская форма личного имени, соответствующая еврейскому אֲדֹנִיָּהוּ.
- source_word: בֶן חַגֵּית
  choice: сын Хаггифы
  rationale: Конструкция буквально обозначает происхождение по матери; форма «сын Хаггифы» естественна и сохраняет структуру оригинала.
- source_word: בַּת שֶׁבַע
  choice: Вирсавия
  rationale: Устоявшаяся русская библейская форма имени, предпочтительная для узнаваемости в литературном русском тексте.
- source_word: אֵם שְׁלֹמֹה
  choice: матери Соломона
  rationale: Приложение поясняет, кто такая Вирсавия, и подчёркивает её связь с царём Соломоном; структура оригинала сохранена.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: С миром ли ты пришёл?
  rationale: שָׁלוֹם в данном контексте выражает вопрос о мирных намерениях. Русская формула сохраняет еврейский образ и настороженный оттенок вопроса.
- source_word: שָׁלוֹם
  choice: С миром
  rationale: Краткий эллиптический ответ повторяет ключевое слово вопроса и сохраняет лаконизм еврейского текста.
