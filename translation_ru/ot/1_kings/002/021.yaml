  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: ru
  text: 'И она сказала: «Пусть Ависагу Сунамитянку отдадут в жёны Адонии, твоему брату».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала она
  rationale: Последовательная форма с וַ продолжает повествование; простой союз «и» сохраняет ход еврейского рассказа.
- source_word: יֻתַּן
  choice: Пусть ... будет отдана
  rationale: Пассивный юссив выражает просьбу или предложение; конструкция с «пусть» передаёт и побудительность, и пассивный залог.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Ависага Сунамитянка
  rationale: Имя передано в принятой русской библейской форме, а обозначение происхождения — традиционным и понятным словом «Сунамитянка».
- source_word: לַאֲדֹנִיָּהוּ
  choice: Адо́нии
  rationale: Предлог לְ обозначает получателя; имя передано в принятой русской библейской форме и поставлено в дательном падеже.
- source_word: אָחִיךָ
  choice: твоему брату
  rationale: Суффикс второго лица мужского рода единственного числа относится к Соломону; родственная связь и прямое обращение сохранены.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: В брачном контексте выражение означает передачу женщины для заключения брака; русское «в жёны» естественно и точно передаёт этот смысл.
