  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: ru
  text: Почему же ты не соблюл клятву, данную именем Яхве,[a] и повеление, которое я возложил на тебя?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «клятву Яхве». В данном контексте — клятву, данную именем Яхве или перед Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «повеление, которое я повелел на тебя». Предлог передаёт возложенное на человека обязательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Почему же
  rationale: Частица «же» естественно передаёт связь вопроса с предшествующим обвинением, не воспроизводя союз וּ механически.
- source_word: שָׁמַרְתָּ
  choice: ты не соблюл
  rationale: Глагол שׁמר означает «хранить, соблюдать»; «соблюсти» естественно сочетается и с клятвой, и с повелением.
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: клятву Яхве
  rationale: Сохранена форма сопряжённого сочетания; контекст допускает понимание клятвы как данной перед Яхве или скреплённой его именем, что отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано русской транслитерацией, а не заменено титулом.
- source_word: וְאֶת הַמִּצְוָה
  choice: и повеление
  rationale: מִצְוָה здесь обозначает обязательное предписание; «повеление» соответствует достоинству царской речи и звучит естественно по-русски.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: которое я дал тебе
  rationale: Идиоматическая русская передача предписания, возложенного на человека; буквальная конструкция с עַל сохранена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Принадлежность или направленность клятвы в שְׁבֻעַת יְהוָה
  choice: клятва Яхве с поясняющей сноской
  alternative: клятва перед Яхве / клятва именем Яхве
  rationale: Еврейская конструкция формально допускает родительное сочетание, однако контекст указывает на клятву, данную перед Яхве или его именем. Основной текст сохраняет краткость и неоднозначность, а сноска предотвращает ошибочное понимание, будто клятву дал сам Яхве.
translation_notes:
  register: Современный литературный русский язык; вопрос звучит прямо и торжественно. Повтор еврейского корня «повеление — повелел» в основном тексте сглажен ради естественности, а буквальная форма отражена в сноске.
