  source_fidelity: В проекте верно переданы заговор Зимри, убийство царя и поставление Амврия царём. Однако עַל־יִשְׂרָאֵל в конструкции שַׂר צָבָא относится к должности Амврия («военачальник над Израилем»), а не к его царскому титулу. Перенос «над Израилем» к слову «царём» меняет синтаксическую связь оригинала и расходится с английской контрольной формулировкой. Также וְגַם («также, к тому же») следует отразить.
