  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: ru
  text: 'И народ, стоявший лагерем, услышал: «Зимри составил заговор и к тому же убил царя». Тогда весь Израиль в тот же день, прямо в лагере, провозгласил Амврия, военачальника Израиля, царём.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: народ, стоявший лагерем
  rationale: Причастная конструкция обозначает народ, находившийся в военном лагере; современное русское выражение передаёт это естественно, не добавляя отсутствующего в тексте указания «там».
- source_word: קָשַׁר
  choice: составил заговор
  rationale: Глагол в данном политическом контексте означает участие в заговоре или мятеже против царя.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: убил царя
  rationale: Хотя буквальное значение глагола — «поразил», контекст сообщает об убийстве царя Илы; русское «убил» ясно передаёт итоговое значение.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: провозгласил царём ... Амврия
  rationale: Каузативная идея выражает поставление Амврия царём; «провозгласил царём» естественно для срочного избрания войском в лагере.
- source_word: שַׂר צָבָא
  choice: военачальника
  rationale: Обозначает начальника войска; «военачальник» — краткий и понятный современный эквивалент.
