  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: ru
  text: 'за свои грехи, которые он совершил: он делал зло в глазах Яхве, шёл путём Иеровоама и совершал грех, вводя Израиль в грех.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и за грех его, который он совершил, чтобы ввести Израиль в грех».'
    reason: Сноска показывает тесное соединение собственного греха царя с его каузативным воздействием на Израиль и сохраняет более буквальную структуру еврейского текста.
lexical_decisions:
- source_word: עַל חטאתו אֲשֶׁר חָטָא
  choice: за свои грехи, которые он совершил
  rationale: Предлог עַל обозначает причину наказания. Хотя в еврейском стоит форма единственного числа и родственная глагольная конструкция («за грех его, которым он согрешил»), в данном контексте существительное имеет собирательный смысл; русское множественное число естественно передаёт совокупность проступков.
- source_word: לַעֲשׂוֹת הָרַע
  choice: он делал зло
  rationale: Инфинитив раскрывает содержание грехов. Личная форма после двоеточия ясна и естественна в современном русском языке.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён понятный древнееврейский образ оценки поступков Богом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: шёл путём Иеровоама
  rationale: Сохранена метафора пути как образа поведения и образа жизни.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: и совершал грех, вводя Израиль в грех
  rationale: Формулировка сохраняет как собственный грех царя, так и каузативное значение לְהַחֲטִיא — он побуждал Израиль грешить; при этом не устраняется синтаксическая напряжённость еврейской фразы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Ответственность царя за грех Израиля
  choice: вводя Израиль в грех
  alternative: заставляя Израиль грешить
  rationale: 'Каузатив выражен ясно, но без чрезмерно жёсткого оттенка принуждения: речь может идти о побуждении, руководстве или создании условий для греха.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены метафоры «в глазах» и «шёл путём»; двоеточие естественно вводит пояснение к слову «грехи».
