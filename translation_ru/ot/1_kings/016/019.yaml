    issue: Сноска более буквально передаёт предлог בְּ как «и за грех его».
    rationale: В еврейском стоит «и в/посредством его греха», однако в этой синтаксически напряжённой конструкции русский вариант с «за» служит пояснением причинной связи и не влияет на смысл основного текста. Исправление не является необходимым.
