  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: ru
  text: 'Тогда слово Яхве пришло к Ииую, сыну Ханани, против Ваасы:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма היה вводит новое событие повествования; традиционная, но понятная русская формула естественно сочетается с выражением «слово ... к».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и богословскую содержательность слова как Божьего откровения, не сводя его просто к сообщению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: к
  rationale: В формуле откровения предлог обозначает адресата Божьего слова; по-русски естественно «слово ... к Ииую».
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: Ииую, сыну Анании
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; приложение обособлено для ясности.
- source_word: עַל
  choice: против
  rationale: В данном контексте предлог вводит пророчество суда, направленное против Ваасы; при этом более широкое значение отмечено в сноске.
- source_word: בַּעְשָׁא
  choice: Ваасы
  rationale: Употреблена закрепившаяся русская библейская форма имени в родительном падеже после «против».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно и без потери смысла выполняет двоеточие, тогда как буквальное «говоря» здесь звучит тяжеловесно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон, поэтому личное имя сохранено в транслитерации, без замены титулом.
- issue: Смысл предлога עַל в пророческой формуле
  choice: против Ваасы
  alternative: о Ваасе
  rationale: Последующая речь является обличительным пророчеством суда, поэтому «против» передаёт направленность изречения, а возможная более широкая трактовка сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «И было слово Яхве к...». Имена переданы в формах, привычных русскому библейскому читателю. Формальное «говоря» заменено двоеточием как естественным русским способом ввести прямую речь следующего стиха.
