  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: ru
  text: Но его слуга Зимри, начальник половины колесниц, составил против него заговор, когда тот был в Фирце и напивался допьяна в доме Арцы, управлявшего дворцом в Фирце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: составил против него заговор
  rationale: Глагол קשר с עַל в повествовании о царях обозначает политический заговор против правителя; русский оборот сохраняет этот смысл и звучит естественно.
- source_word: עַבְדּוֹ
  choice: его слуга
  rationale: Буквальное значение עבד — «слуга»; при дворе это слово может обозначать также подчинённого должностного лица. Выбранный вариант сохраняет широту значения.
- source_word: זִמְרִי
  choice: Зимри
  rationale: Традиционная русская передача личного имени.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: начальник половины колесниц
  rationale: 'Близко передаёт конструкцию: שַׂר — начальник или военачальник, а רכב здесь означает колесницы либо колесничное войско.'
- source_word: וְהוּא
  choice: когда тот был
  rationale: Местоимение вводит сопутствующее обстоятельство; «тот» ясно относит последующее описание к царю, а не к Зимри.
- source_word: בְתִרְצָה
  choice: в Фирце
  rationale: Использована традиционная русская форма топонима; повтор в конце стиха сохранён вслед за еврейским текстом.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: напивался допьяна
  rationale: Сочетание причастия «пьющий» и слова, связанного с опьянением, изображает продолжающееся питьё, ведущее к пьянству. Выражение сохраняет динамичность без неестественного буквализма.
- source_word: בֵּית אַרְצָא
  choice: в доме Арцы
  rationale: Естественная русская передача בית с личным именем; имя транслитерировано в форме Арца, а в родительном падеже — Арцы.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: управлявшего дворцом
  rationale: Устойчивое административное выражение обозначает должностное лицо, ведавшее царским домом или дворцом. «Управлявший дворцом» ясно передаёт функцию в данном царском контексте.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным: «тот» устраняет возможную путаницу в отношении опьяневшего царя. Специальная сноска не требуется; административный титул передан непосредственно как «управлявший дворцом». В предоставленном английском консультационном слое маркер [a] в основном тексте, вероятно, смещён: его текст относится к выражению о питье, а не к имени Зимри; в русском проекте эта несогласованность не воспроизводится.'
