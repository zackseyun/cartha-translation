base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: ru
  text: Когда он воцарился и сел на престол, он истребил весь дом Ваасы. Он не оставил ему ни одного мужчины[a], ни родственника[b], ни друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мочащегося к стене» — грубоватая древнееврейская идиома, обозначающая мужчину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «родственника-мстителя» или «родственника-выкупщика». Еврейское слово обозначает близкого родственника, на котором лежали семейные обязанности, в том числе защита интересов рода, кровная месть или выкуп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ
  choice: Когда он воцарился
  rationale: Сочетание повествовательной формулы с временной конструкцией указывает на вступление Зимри на царство. В русском языке отдельное «и было» здесь утяжеляло бы фразу, тогда как «когда он воцарился» естественно передаёт последовательность событий.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: едва сев на престол
  rationale: Передаёт непосредственность действия после восшествия на престол; деепричастная конструкция звучит естественно и сохраняет образ сидения на престоле.
- source_word: הִכָּה
  choice: истребил
  rationale: В данном контексте глагол означает смертоносное поражение всего династического дома. «Истребил» ясно передаёт результат, не используя архаичное «поразил» в потенциально двусмысленном смысле.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: весь дом Ваасы
  rationale: «Дом» сохраняет библейское династическое значение — род и окружение правителя, а не здание.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Он не оставил у него
  rationale: Сохраняет местоименное указание на Ваасу и смысл полного уничтожения его линии.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ни одного мужчины
  rationale: Грубоватый буквальный оборот «мочащийся к стене» является идиомой, обозначающей мужчину. В основном тексте передан смысл, а форма идиомы отмечена в сноске.
- source_word: וְגֹאֲלָיו
  choice: ни родственников-заступников
  rationale: גֹּאֵל — ближайший родственник, обязанный защищать семейные интересы, выкупать имущество или мстить за кровь. Составное обозначение сохраняет и родство, и функциональный оттенок, не сводя слово только к одной обязанности.
- source_word: וְרֵעֵהוּ
  choice: ни друзей
  rationale: רֵעַ обычно обозначает друга, товарища или близкого соратника. «Друзей» — ясный и нейтральный вариант; политические союзники также могут подразумеваться контекстом.
theological_decisions:
- issue: Значение גֹאֵל в перечне уничтоженных лиц
  choice: родственники-заступники
  alternative: мстители; искупители; близкие родственники
  rationale: Контекст не уточняет, какая именно семейно-правовая обязанность имеется в виду. Перевод сохраняет родственную связь и роль защитника, не навязывая исключительно идею кровной мести или выкупа.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. «Дом Ваасы» сохранён как привычное обозначение династии; архаизмы устранены. Грубая исходная идиома вынесена в сноску, а многозначность термина גֹאֵל сохранена в основном тексте и пояснении.
