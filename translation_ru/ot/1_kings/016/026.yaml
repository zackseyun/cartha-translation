  terminology: «Иеровоам, сын Навата», «Яхве, Бог Израиля» и «ничтожные идолы» согласуются с русской библейской традицией и с семантикой оригинала. Сноска должна сохранять притяжательное «их» и не выдавать спорную форму «своей пустотой» за буквальный эквивалент.
