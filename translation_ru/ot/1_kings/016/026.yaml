base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: ru
  text: Он во всём следовал пути Иеровоама, сына Навата, и его грехам, которыми тот ввёл Израиль в грех, вызывая гнев Яхве, Бога Израиля, их ничтожными идолами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их суетами» или «их ничтожными вещами»; это пренебрежительное обозначение идолов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: он во всём следовал пути
  rationale: Глагол הלך с существительным «путь» описывает образ жизни и поведение. Русское «следовал пути» сохраняет метафору, а «во всём» передаёт полноту уподобления.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Имена переданы в закрепившейся русской библейской форме.
- source_word: וּבְחַטֹּאתָיו
  choice: и его грехам
  rationale: Суффикс третьего лица мужского рода относится к Иеровоаму; множественное число передано прямо.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Порода хифиль глагола חטא имеет каузативное значение. Местоимение «тот» естественно проясняет, что действующим лицом остаётся Иеровоам, а не подлежащее главной части.
- source_word: לְהַכְעִיס
  choice: вызывая гнев
  rationale: Инфинитив выражает цель или результат такого поведения. Выражение «вызывать гнев» естественно по-русски передаёт идею намеренного раздражения или провоцирования Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямое и естественное соответствие еврейской сопряжённой конструкции.
- source_word: בְּהַבְלֵיהֶם
  choice: своими ничтожными идолами
  rationale: הבל буквально обозначает нечто мимолётное, пустое или ничтожное и здесь полемически относится к идолам. Перевод передаёт и референт, и оценочный оттенок; буквальная образность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение בְּהַבְלֵיהֶם
  choice: своими ничтожными идолами
  alternative: своей суетой; своими пустыми вещами
  rationale: Контекст грехов Иеровоама указывает на идолопоклонство, однако оценочная метафора пустоты и ничтожности также существенна и потому сохранена в тексте и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры пути. Синтаксис упрощён для ясности, но причинно-целевой оттенок инфинитива и полемическая окраска הבל сохранены.
