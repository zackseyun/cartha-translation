base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: ru
  text: Но сторонники Амврия взяли верх[a] над сторонниками Фамния, сына Гонафова. Фамний умер, и Амврий стал царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказались сильнее» или «стали сильнее». Еврейский глагол может обозначать силу или превосходство; здесь речь идёт о том, что сторона Амврия одержала верх в междоусобной борьбе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: одолел
  rationale: Глагол חזק в сочетании с прямым дополнением выражает превосходство одной стороны над другой. «Одолел» естественно передаёт победу сторонников Амврия в политической борьбе.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: народ, стоявший за Амврия
  rationale: Оборот אַחֲרֵי в данном контексте обозначает поддержку и принадлежность к стороне претендента; «стоявший за» ясно и естественно передаёт политическую лояльность.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: народ, стоявший за Фамния
  rationale: Сохранён параллелизм двух противоборствующих сторон; אֶת при חזק понимается как указание на сторону, над которой одержали верх.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Фамния, сына Гонафова
  rationale: Использованы традиционные русские библейские формы имён, узнаваемые читателю; конструкция בן передана обычным родственным определением.
- source_word: וַיָּמָת תִּבְנִי
  choice: Фамний умер
  rationale: Последовательная форма продвигает повествование. Нейтральное «умер» не уточняет причину смерти, которой еврейский текст не сообщает.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: Амврий стал царём
  rationale: В контексте завершения борьбы מלך обозначает воцарение Амврия, а не просто последующее царствование.
theological_decisions:
- issue: Причина смерти Фамния
  choice: Не уточнять, как именно и вследствие чего умер Фамний
  alternative: 'Передать связь как прямой результат поражения: «поэтому Фамний умер»'
  rationale: Еврейская повествовательная последовательность сообщает смерть после победы партии Амврия, но не называет ни причины, ни обстоятельств; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка «стоявший за» понятна широкому читателю и передаёт политическую поддержку; синтаксический параллелизм оригинала сохранён.
