translation_notes:
  register: 'Современный литературный русский язык с традиционными русскими формами библейских имён и топонимов: Аса, Амврий, Фирца. Синтаксис сохраняет хронологическое различие между всем двенадцатилетним царствованием и шестью годами в Фирце; пояснительная сноска не требуется, поскольку это ясно выражено в основном тексте.'
