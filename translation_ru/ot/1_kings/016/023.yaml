  text: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֤ךְ עָמְרִי֙ עַל יִשְׂרָאֵ֔ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/תִרְצָ֖ה מָלַ֥ךְ שֵׁשׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: ru
  text: В тридцать первый год правления Асы, царя Иудеи, Амврий стал царём над Израилем и царствовал двенадцать лет; шесть лет он царствовал в Фирце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: В тридцать первый год правления
  rationale: Еврейская формула датировки буквально говорит «в год тридцать и один»; добавление «правления» естественно передаёт подразумеваемый отсчёт лет царствования Асы.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Предлог לְ указывает, к чьему царствованию относится датировка; конструкция передана современной русской формулой с приложением.
- source_word: מָלַךְ
  choice: стал царём
  rationale: Первое употребление глагола в контексте хронологической формулы обозначает вступление Амврия на престол.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: При глаголе מלך предлог עַל обозначает народ, над которым осуществляется царская власть.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: царствовал двенадцать лет
  rationale: Фраза указывает общую продолжительность царствования Амврия; повтор глагола в русском делает синтаксическую связь ясной и естественной.
- source_word: בְּתִרְצָה מָלַךְ שֵׁשׁ שָׁנִים
  choice: шесть лет он царствовал в Фирце
  rationale: Сохраняется различие между общей продолжительностью царствования в двенадцать лет и шестью годами царствования с местопребыванием в Фирце.
