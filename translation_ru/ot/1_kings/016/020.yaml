- from: Остальные деяния Замврия и его заговор, который он устроил[a], — не записаны ли они в книге «Летопись царей Израиля»?
  to: Остальные деяния Зимри и его заговор, который он устроил[a], — не записаны ли они в книге летописей царей Израиля?
  rationale: Исправлена транслитерация имени Зимри, уточнена передача анналистической формулы и заменена вводящая в заблуждение сноска. «Заговор, который он устроил» сохраняет политический смысл и завершённость действия; сноска отмечает исходный корневой повтор, не воспроизводя неестественную для русского кальку.
