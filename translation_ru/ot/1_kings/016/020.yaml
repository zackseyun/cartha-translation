base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Остальные деяния Зимри и его заговор, который он устроил[a], — не записаны ли они в книге летописей царей Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст употребляет существительное и глагол одного корня: буквально, «его заговор, который он замыслил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Остальные деяния Замврия
  rationale: В царской итоговой формуле דִּבְרֵי означает дела или деяния правителя, а не только его слова; וְיֶתֶר указывает на прочие, не изложенные здесь деяния.
- source_word: וְקִשְׁרוֹ
  choice: и его заговор
  rationale: קֶשֶׁר в контексте борьбы за царскую власть обозначает заговор; притяжательное местоимение «его» передаёт суффикс 3-го лица мужского рода.
- source_word: אֲשֶׁר קָשָׁר
  choice: который он устроил
  rationale: Глагол того же корня, что и существительное «заговор», указывает на совершённое Замврием заговорщическое действие. «Устроил» естественно звучит по-русски, а корневой повтор отмечен в сноске.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: не записаны ли они
  rationale: Сохранена форма стандартного риторического вопроса; «записаны» естественно передаёт письменную фиксацию в названной летописи.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в книге «Летопись царей Израиля»
  rationale: В архивной формуле עַל סֵפֶר естественно передаётся как «в книге», а דִּבְרֵי הַיָּמִים обозначает летописный свод. Кавычки показывают, что выражение функционирует как название источника.
