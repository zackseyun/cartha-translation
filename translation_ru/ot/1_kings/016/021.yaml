  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: ru
  text: 'Тогда народ Израиля разделился на две части: половина народа встала на сторону Тивни, сына Гината, чтобы поставить его царём[a], а другая половина — на сторону Омри.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «половина народа последовала за Тивни, сыном Гината, чтобы поставить его царём, а другая половина — за Омри».'
    reason: 'Лексическое различие: древнееврейский оборот הָיָה אַחֲרֵי допускает передачу как политической поддержки («встать на сторону»), так и следования за претендентом.'
lexical_decisions:
- source_word: יֵחָלֵק
  choice: разделился
  rationale: Нифаль глагола חלק означает «разделиться, быть разделённым». Единственное число естественно согласуется в русском с собирательным существительным «народ».
- source_word: הָעָם יִשְׂרָאֵל
  choice: народ Израиля
  rationale: Сочетание определяет народ как население Израиля; эта передача естественна и не добавляет отсутствующего в тексте смысла.
- source_word: לַחֵצִי
  choice: на две части
  rationale: Форма с предлогом выражает разделение пополам; по-русски «на две части» звучит ясно и естественно.
- source_word: חֲצִי הָעָם
  choice: половина народа
  rationale: Передаёт количественный смысл и сохраняет параллельное противопоставление двух половин.
- source_word: הָיָה אַחֲרֵי
  choice: встала на сторону
  rationale: Буквальное «была за/следом за» в данном политическом контексте означает поддержку одного из претендентов. «Встала на сторону» ясно передаёт политическую приверженность.
- source_word: תִבְנִי בֶן גִּינַת
  choice: Тивни, сына Гината
  rationale: Имена переданы современной транслитерацией непосредственно с древнееврейского; оборот с приложением естественен для русского текста.
- source_word: לְהַמְלִיכוֹ
  choice: чтобы поставить его царём
  rationale: Каузативная форма глагола מלך означает сделать так, чтобы он царствовал. «Поставить царём» сохраняет этот смысл, не добавляя конкретной церемонии коронации.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: а другая половина — на сторону Омри
  rationale: Глагольная часть восполняется из параллельной первой половины предложения. «Другая» делает противопоставление естественным по-русски, а тире позволяет избежать тяжёлого повтора.
