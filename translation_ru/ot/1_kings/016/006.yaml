lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил с отцами своими
  rationale: Сохранена традиционная древнееврейская формула, обозначающая смерть царя. Глагол «почил» передаёт образ сна, а «с отцами своими» формально соответствует тексту и сохраняет повторяющуюся формулу книг Царств.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Форма нифаль имеет здесь пассивное значение; выбран естественный современный русский эквивалент.
- source_word: בְּתִרְצָה
  choice: в Фирце
  rationale: Предлог ב при названии города естественно передаётся русским «в»; употреблена закрепившаяся русская форма топонима.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В сообщении о престолонаследии глагол обозначает вступление на царство; такой перевод звучит естественно и ясно в современном русском языке.
- source_word: אֵלָה בְנוֹ
  choice: его сын Ила
  rationale: Порядок слов адаптирован к естественному русскому синтаксису без изменения смысла.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт значение замещения и непосредственного наследования престола, выраженное תַּחַת в данном контексте.
