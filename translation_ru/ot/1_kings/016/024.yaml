base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: ru
  text: Он купил у Шемера холм Самарию за два таланта серебра[a], построил на этом холме город и назвал построенный им город Самарией — по имени Шемера, владельца холма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная древняя мера веса; здесь речь идёт о количестве серебра.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: купил
  rationale: Глагол קנה в контексте уплаты цены означает приобретение собственности; «купил» — естественный современный эквивалент.
- source_word: הָהָר
  choice: холм
  rationale: Слово הַר может обозначать гору или холм; применительно к возвышенности, на которой строится город, «холм» точнее по-русски.
- source_word: שֹׁמְרוֹן
  choice: Шомрон
  rationale: Передача еврейского топонима שֹׁמְרוֹן непосредственно с языка оригинала; здесь это сначала название холма, затем города.
- source_word: מֵאֵת שֶׁמֶר
  choice: у Шемера
  rationale: Предлог обозначает лицо, у которого приобретена собственность; русская конструкция «купил у Шемера» естественно передаёт этот смысл.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: за два таланта серебра
  rationale: כִּכָּר в данном денежно-весовом контексте — талант, а двойственное число указывает на два таланта.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: застроил этот холм
  rationale: Буквально «построил холм»; переходный русский глагол «застроил» ясно передаёт строительство на холме, не добавляя конкретных сооружений.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: назвал построенный им город
  rationale: Еврейская идиома «назвал имя города» естественно передаётся по-русски глаголом «назвал».
- source_word: עַל שֵׁם שֶׁמֶר
  choice: по имени Шемера
  rationale: Оборот указывает, что город получил название по имени человека; русский вариант сохраняет эту явную связь.
- source_word: אֲדֹנֵי הָהָר
  choice: владельца холма
  rationale: אדון здесь обозначает собственника земли, а не титул или божественное именование.
