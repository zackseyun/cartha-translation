source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: ru
  text: Кроме того, через пророка Ииуя, сына Анании, слово Яхве было обращено против Ваасы и его дома — за всё зло, которое он совершил в глазах Яхве, вызывая Его гнев делами своих рук и став подобным дому Иеровоама, а также за то, что он поразил его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его» в еврейском тексте стоит в мужском роде, единственном числе. Оно может относиться к самому Иеровоаму или, что вероятнее по контексту, к его дому, то есть династии, как к собирательному целому.
    reason: Сохранение неоднозначности референта местоименного суффикса.
lexical_decisions:
- source_word: וְגַם
  choice: Кроме того
  rationale: Передаёт присоединение к предыдущему повествованию и естественно начинает русское предложение.
- source_word: בְּיַד יֵהוּא ... הַנָּבִיא
  choice: через пророка Ииуя
  rationale: Конструкция בְּיַד обозначает посредничество; «через» ясно передаёт роль пророка как вестника, не воспроизводя неестественно идиому «рукою».
- source_word: דְּבַר יְהוָה הָיָה אֶל
  choice: слово Яхве было обращено против
  rationale: Сохраняет пророческую формулу «слово Яхве», а «против» соответствует обличительному и судебному контексту.
- source_word: בֵּיתוֹ
  choice: его дома
  rationale: '«Дом» сохраняет широту еврейского выражения: семью, царский род и династию.'
- source_word: עַל כָּל הָרָעָה
  choice: за всё зло
  rationale: Предлог עַל здесь указывает на основание суда; краткое русское «за» естественно выражает причинно-судебный смысл.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет исходный образ и обычную библейскую формулу нравственной оценки.
- source_word: לְהַכְעִיסוֹ
  choice: вызывая Его гнев
  rationale: Передаёт каузативный смысл глагола и ясно указывает, что зло Ваасы навлекало гнев Яхве.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: делами своих рук
  rationale: Сохраняет конкретный еврейский образ, не ограничивая его только идолами или только политическими поступками.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: став подобным дому Иеровоама
  rationale: Передаёт достигнутое сходство Ваасы и его династии с домом Иеровоама, не уточняя сверх текста, в чём именно оно состояло.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: а также за то, что он истребил его
  rationale: '«Истребил» соответствует контексту уничтожения царского дома, а местоимение «его» сохраняет неоднозначность мужского суффикса: речь может идти об Иеровоаме лично либо о его доме как собирательном целом.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Объект в выражении הִכָּה אֹתוֹ
  choice: истребил его
  alternative: уничтожил его дом
  rationale: Мужской суффикс единственного числа допускает отнесение как к Иеровоаму, так и к его дому/династии как собирательному целому. Основной текст сохраняет эту напряжённость, а не разрешает её без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён настолько, чтобы длинная причинная конструкция оставалась понятной, но повторы имени Яхве, образ «в глазах» и выражение «делами своих рук» сохранены ради связи с исходным текстом.
