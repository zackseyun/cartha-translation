  choice: Передать выражение как полное истребление Ваасы и его дома, не указывая в основном тексте буквальный огонь как способ суда.
  alternative: «Я выжгу вслед за Ваасой» или «Я поглощу вслед за Ваасой».
  rationale: Еврейское выражение возвещает всеобъемлющий суд над Ваасой и его царским родом. Буквальная калька по-русски неясна и может ошибочно сделать акцент на физическом огне, тогда как контекст говорит прежде всего об устранении династии.
