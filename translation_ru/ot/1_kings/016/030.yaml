  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: ru
  text: Ахав, сын Омри, делал зло в глазах Яхве — больше, чем все, кто был до него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... הָרַע
  choice: делал зло
  rationale: Сочетание глагола עשה с субстантивированным הָרַע — обычная еврейская формула совершения зла. Русское «делал зло» естественно передаёт её, не усиливая значения до «творил злодеяния».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный еврейский оборот, обозначающий оценку с точки зрения Яхве; он понятен и естественен в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного Божьего имени, а не заменён титулом «Господь».
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: больше всех, кто был до него
  rationale: Сравнительная конструкция מן передаёт превосходство Ахава в совершении зла над всеми предшественниками. Формулировка сохраняет обобщённость оригинала и не добавляет отсутствующее в стихе слово «цари».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением характерного библейского оборота «в глазах Яхве». Синтаксис сделан кратким и ясным; неоднозначно широкое «всех, кто был до него» не сужено до одних царей.
