  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: ru
  text: Ахав, сын Амврия, стал царём над Израилем в тридцать восьмой год правления Асы, царя Иудеи. Ахав, сын Амврия, царствовал над Израилем в Самарии двадцать два года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: стал царём
  rationale: В начальной части царской формулы перфект глагола מלך обозначает вступление на престол; этот перевод отличает воцарение от последующего указания продолжительности царствования.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: в тридцать восьмой год правления
  rationale: Формула передаёт порядковое значение и синхронизирует воцарение Ахава с царствованием Асы; слово «правления» естественно поясняет по-русски точку отсчёта.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Родительный падеж выражает царствование Асы как временную точку отсчёта и сохраняет его титул.
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Здесь глагол вводит сообщение о продолжительности правления, поэтому длительное значение «царствовал» точнее, чем повторное «стал царём».
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב обозначает место; Самария представлена как царская резиденция, где Ахав правил.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: двадцать два года
  rationale: Естественная русская форма обозначения продолжительности царствования.
- source_word: וְ
  choice: Ахав
  rationale: Начальный союз связывает стих с предшествующим повествованием, но в русском отдельном стихе его можно не передавать словом «и», чтобы избежать неестественного начала, не теряя последовательности рассказа.
