base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: ru
  text: В двадцать седьмой год правления Асы, царя Иудеи, Замврий царствовал в Фирце семь дней. В это время народ стоял лагерем против Гивветона[a], принадлежавшего филистимлянам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Гивветона». В данном военном контексте выражение, вероятно, означает, что народ расположился лагерем против города.'
    reason: 'Лексическая неоднозначность предлога עַל: он может обозначать как направленность против города, так и расположение возле него.'
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: В двадцать седьмой год правления
  rationale: Естественно передаёт стандартную формулу датировки по годам царствования.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Сохраняет синхронизацию царствований и титул Асы в естественной русской форме.
- source_word: מָלַךְ ... שִׁבְעַת יָמִים
  choice: царствовал ... семь дней
  rationale: В данном сочетании глагол с указанием продолжительности естественно означает, что Замврий был царём семь дней; русский вариант не создаёт неестественного оттенка заранее установленного срока, возможного при «воцарился на семь дней».
- source_word: בְּתִרְצָה
  choice: в Фирце
  rationale: Простое обозначение места; употреблена традиционная русская форма топонима.
- source_word: וְהָעָם חֹנִים
  choice: В это время народ стоял лагерем
  rationale: Причастие обозначает продолжающееся состояние, а союз вводит сопутствующее обстоятельство; самостоятельное предложение ясно и естественно передаёт эту связь.
- source_word: עַל גִּבְּתוֹן
  choice: против Гивветона
  rationale: В военном контексте עַל вероятнее всего указывает на расположение войска против города, но пространственное значение «у» сохраняется в сноске как реальная альтернатива.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: принадлежавшего филистимлянам
  rationale: Передаёт отношение принадлежности без добавления более узкого смысла военного удержания или оккупации.
