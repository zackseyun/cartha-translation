  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: ru
  text: В его дни Хиил из Вефиля отстроил Иерихон[a]. Ценой Авирама, своего первенца, он заложил его основание, а ценой Сегува, своего младшего сына, установил его ворота[b] — по слову Яхве, которое Он изрёк через Иисуса, сына Навина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «построил Иерихон». Перевод «отстроил» учитывает, что прежде город был разрушен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при (или: с) Авирааме, своём первенце… и при (или: с) Сегуве, своём младшем». В свете Нав. 6:26 эти слова означают, что строительство стоило Хиилу жизни его сыновей.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Сохраняет временную формулу оригинала и естественно связывает событие с эпохой ранее названного царя.
- source_word: בָּנָה
  choice: отстроил
  rationale: Сам глагол означает «строить», но контекст разрушенного ранее Иерихона указывает на восстановление; сноска сохраняет буквальный вариант.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Хиил из Вефиля
  rationale: Передаёт происхождение или связь с Вефилем естественным современным русским оборотом.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Ценой Авирама, своего первенца
  rationale: Предлог ב в контексте исполнения проклятия указывает на цену, которой стало лишение сына; при этом буквальная конструкция отмечена в сноске.
- source_word: יִסְּדָהּ
  choice: он заложил его основание
  rationale: Точно передаёт строительное значение глагола יסד; местоимение относится к Иерихону.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: а ценой Сегува, своего младшего сына
  rationale: Параллельно первой фразе передаёт цену завершения строительства; «младший сын» ясно выражает семейный порядок рождения.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: установил его ворота
  rationale: В контексте города דלתות естественно означает городские ворота или их створки.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Кратко и точно передаёт формулу соответствия ранее произнесённому слову; личное имя יהוה транслитерировано как «Яхве».
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: которое Он изрёк через
  rationale: ביד здесь является формулой посредничества; «через» естественно передаёт роль Иисуса Навина как того, через кого было сказано слово.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисуса, сына Навина
  rationale: Использована укоренившаяся русская библейская форма имени и патронимического обозначения.
theological_decisions:
- issue: Характер исполнения проклятия в связи с сыновьями Хиила
  choice: Строительство Иерихона представлено как совершённое ценой первенца и младшего сына Хиила, в исполнение слова Яхве.
  alternative: Буквально предлог допускает передачу «при Авирааме… при Сегуве» или «с Авираамом… с Сегувом», без явного называния смерти.
  rationale: Языковая перекличка с Нав. 6:26 наиболее естественно указывает на гибель сыновей как цену строительства, однако сноска сохраняет формальную неоднозначность предлога и не добавляет обстоятельств их смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет параллелизм двух этапов строительства. Имена переданы в традиционных русских библейских формах; יהוה — как «Яхве» в соответствии с предоставленным консультационным слоем.
