  text: וַ/יָּבֹ֤א זִמְרִי֙ וַ/יַּכֵּ֣/הוּ וַ/יְמִיתֵ֔/הוּ בִּ/שְׁנַת֙ עֶשְׂרִ֣ים וָ/שֶׁ֔בַע לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: ru
  text: И вошёл Зимри, поразил его и убил — в двадцать седьмой год правления Асы, царя Иудеи, — и воцарился вместо него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И вошёл
  rationale: Глагол בוא допускает значения «прийти» и «войти». В контексте убийства внутри дома (ст. 9) «вошёл» естественно передаёт направленное проникновение, а начальное «и» сохраняет последовательность повествования.
- source_word: זִמְרִי
  choice: Зимри
  rationale: Традиционная и узнаваемая русская передача древнееврейского личного имени.
- source_word: וַיַּכֵּהוּ
  choice: поразил его
  rationale: Глагол נכה означает «ударить, поразить». Формулировка сохраняет отдельность первого насильственного действия перед прямо названным убийством и не добавляет отсутствующих в тексте подробностей.
- source_word: וַיְמִיתֵהוּ
  choice: и убил
  rationale: Порода хифиль глагола מות означает «умертвить, убить». «Убил» — прямой и естественный современный эквивалент.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: в двадцать седьмой год правления
  rationale: Стандартная формула датировки по годам царствования. Слово «правления» добавлено для ясности по-русски и явно следует из упоминания царя.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Предлог לְ обозначает царствование, служащее точкой отсчёта. Конструкция естественно передаёт титул Асы без изменения смысла.
- source_word: וַיִּמְלֹךְ
  choice: и воцарился
  rationale: Глагол מלך может означать как «царствовать», так и «стать царём». В сочетании с תַּחְתָּיו здесь подчёркнуто занятие престола убитого; «воцарился» кратко и естественно передаёт вступление на царство.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте царской преемственности выражение означает занятие места предшественника. «Вместо него» близко к форме оригинала и не превращает её лишь во временное «после него».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Пунктуационное выделение даты помогает ясно связать заключительное «вместо него» с убитым царём, не меняя порядка смысловых частей оригинала.
