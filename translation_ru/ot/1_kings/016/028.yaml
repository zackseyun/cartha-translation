  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: ru
  text: И почил Амврий с отцами своими, и был похоронен в Самарии; а вместо него воцарился его сын Ахав.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: И почил Амврий с отцами своими
  rationale: Формула буквально говорит, что Амврий «лёг/уснул со своими отцами», и в царских повествованиях служит устойчивым обозначением смерти. Русское «почил с отцами своими» сохраняет образность и формульный характер древнееврейского выражения, оставаясь понятным в библейском повествовательном регистре.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Нифаль передаёт пассивное действие; «был похоронен» естественно и точно звучит по-русски.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ обозначает место; в данном контексте речь идёт о погребении в городе Самарии.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол обозначает вступление на царство. «Воцарился» кратко и естественно передаёт смену царя, не добавляя лишних подробностей.
- source_word: אַחְאָב בְּנוֹ תַּחְתָּיו
  choice: вместо него воцарился его сын Ахав
  rationale: תַּחְתָּיו указывает на занятие места предшественника. Такой порядок слов ясно выражает династическое преемство и естественен для современного литературного русского языка.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Традиционные русские формы имён «Амврий» и «Ахав» сохранены. Идиома смерти передана формульно, без сведения её к простому «умер»; отдельная сноска не требуется, поскольку «почил» в русском языке само по себе понятно обозначает смерть.
