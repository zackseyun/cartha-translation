  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: ru
  text: за все грехи Ваасы и грехи его сына Илы, которые они совершили и которыми ввели Израиль в грех, вызывая гнев Яхве, Бога Израиля, своими идолами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своими суетами» или «своими ничтожными вещами»; это распространённое пренебрежительное обозначение идолов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: за
  rationale: В формуле суда предлог указывает на основание наказания; русское «за» естественно передаёт причинно-обвинительный смысл.
- source_word: כָּל חַטֹּאות
  choice: все грехи
  rationale: Прямо передаёт множественное число חַטֹּאות и всеохватность כָּל.
- source_word: בַּעְשָׁא
  choice: Вааса
  rationale: Традиционная русская передача личного имени с необходимой формой родительного падежа.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: и грехи его сына Илы
  rationale: Ясно передаёт конструкцию принадлежности и родственную связь, оставаясь естественным по-русски.
- source_word: אֲשֶׁר חָטְאוּ
  choice: которые они совершили
  rationale: По-русски грехи обычно «совершают»; относительное местоимение сохраняет связь с упомянутыми грехами.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: и которыми ввели Израиль в грех
  rationale: Передаёт каузативное значение породы хифиль глагола חטא и связь действий царей с грехом Израиля.
- source_word: לְהַכְעִיס
  choice: вызывая гнев
  rationale: Передаёт цель или результат поступков и подразумеваемую идею побуждения Бога к гневу без неестественной русской конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции.
- source_word: בְּהַבְלֵיהֶם
  choice: своими идолами
  rationale: В контексте царского идолопоклонства הֲבָלִים метонимически обозначает идолов, одновременно характеризуя их как пустые и ничтожные; буквальный оттенок сохранён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение בְּהַבְלֵיהֶם в контексте идолопоклонства
  choice: своими идолами
  alternative: своей суетой; своими ничтожными вещами
  rationale: Контекст указывает на предметы ложного поклонения, однако древнееврейское слово подчёркивает их пустоту и ничтожность; эта полемическая многозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет причинную связь с предшествующим приговором, а повтор относительных конструкций слегка сглажен ради ясности. Маркер сноски поставлен при слове «идолами», к которому относится пояснение.
