  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: А остальные деяния Ваасы, всё, что он сделал, и его могущество — разве не записано всё это в Книге летописей царей Израиля?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге анналов царей Израиля».'
    reason: Лексическое значение דִּבְרֵי הַיָּמִים допускает передачу как «анналы»; речь идёт об официальном историческом источнике.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: Остальные деяния Ваасы
  rationale: יֶתֶר обозначает оставшуюся часть повествования, а דִּבְרֵי в царской летописной формуле относится к делам и событиям правления, а не только к словам.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: то, что он совершил
  rationale: Передаёт относительную конструкцию без добавления отсутствующего в еврейском тексте слова «всё»; «совершил» естественно звучит в историческом повествовании.
- source_word: וּגְבוּרָתוֹ
  choice: и его могущество
  rationale: Сохраняет абстрактное значение גְּבוּרָה — сила или могущество — не сужая его до воинской храбрости либо отдельных подвигов.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Сохраняет форму риторического вопроса и повторяющуюся в Книгах Царей летописную формулу.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: В сочетании с глаголом «записаны» предлог עַל естественно передаётся по-русски как «в»; סֵפֶר здесь обозначает письменный источник.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Книге летописей царей Израиля
  rationale: Передаёт название архивно-летописного источника современным и понятным русским выражением; לְ обозначает отношение этой летописи к царям Израиля.
theological_decisions: []
