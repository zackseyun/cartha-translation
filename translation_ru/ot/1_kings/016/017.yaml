  naturalness: 'Начальная конструкция с «и» и повтором «и» допустима для библейского повествования, но «Амврий и весь Израиль с ним» при глаголе единственного числа может восприниматься как не вполне гладкое согласование. Перестройка с «вместе со всем Израилем, который был с ним» сохраняет исходное соотношение: единственным грамматическим субъектом первого глагола остаётся Амврий.'
  terminology: Формы «Амврий», «Гиввафон» и «Фирца» последовательно выдержаны в предложенном традиционном русском библейском именослове. «Осадили» точно передаёт военное значение וַיָּצֻרוּ.
