  text: И Амврий вместе со всем Израилем, который был с ним, поднялся из Гиввафона, и они осадили Фирцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: поднялся
  rationale: Передаёт основное значение עלה — движение вверх; сохраняет возможный топографический или военный оттенок, не уточняя его как «выступил в поход».
- source_word: עָמְרִי
  choice: Амврий
  rationale: Традиционная русская библейская форма имени.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: и весь Израиль с ним
  rationale: Сохраняет собирательное обозначение «Израиль» и не сужает его явно до войска, хотя в контексте речь идёт о людях, следовавших за Амврием.
- source_word: מִגִּבְּתוֹן
  choice: от Гиввафона
  rationale: Традиционная русская библейская форма топонима; предлог מִן передан как «от», естественный при обозначении исходного пункта движения.
- source_word: וַיָּצֻרוּ
  choice: они осадили
  rationale: Глагол צור в данном военном контексте означает окружить город и вести осаду; «осадили» кратко и точно передаёт это действие.
- source_word: עַל
  choice: —
  rationale: Значение предлога включено в русское управление переходного глагола «осадили» и не требует отдельного соответствия.
- source_word: תִּרְצָה
  choice: Фирцу
  rationale: Традиционная русская библейская форма топонима; употреблён винительный падеж как прямое дополнение при «осадили».
