base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: ru
  text: В двадцать шестой год правления Асы, царя Иудеи, Эла, сын Бааши, воцарился над Израилем в Тирце и царствовал два года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: В двадцать шестой год правления
  rationale: Естественно передаёт древнееврейскую формулу датировки по году царствования; добавление «правления» ясно выражает подразумеваемый смысл без тяжеловесного буквального повтора слова «год».
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Асы, царя Иудеи
  rationale: Предлог לְ в формуле датировки указывает, к чьему царствованию относится названный год; приложение сохранено в естественной русской форме.
- source_word: מָלַךְ
  choice: воцарился … и царствовал
  rationale: В сообщении о вступлении на престол глагол указывает на начало царствования, тогда как שְׁנָתָיִם задаёт его продолжительность. Русская формулировка ясно различает вступление на престол и последующее двухлетнее царствование.
- source_word: אֵלָה
  choice: Эла
  rationale: Имя транслитерировано в принятой русской библейской форме.
- source_word: בֶן בַּעְשָׁא
  choice: сын Бааши
  rationale: Прямая и естественная передача конструкции родства; имя поставлено в нормативную русскую форму родительного падежа.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при глаголе מלך обозначает власть над народом или царством; перевод не добавляет отсутствующее в тексте слово «царство».
- source_word: בְּתִרְצָה
  choice: в Тирце
  rationale: Предлог בְּ обозначает место; «в Тирце» естественно указывает на столицу, где он правил.
- source_word: שְׁנָתָיִם
  choice: два года
  rationale: Двойственное число прямо обозначает продолжительность в два года.
