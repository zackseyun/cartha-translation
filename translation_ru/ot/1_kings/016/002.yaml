  source_fidelity: 'Перевод точно передаёт причинный оборот יַעַן אֲשֶׁר, возвышение «из праха», назначение Ваасы правителем и последующее обвинение. «Ввёл ... в грех» адекватно выражает каузативную форму וַתַּחֲטִא. Оборот «вызывая у Меня гнев их грехами» сохраняет связь гнева с грехами народа и не снимает с Ваасы ответственности за то, что он привёл народ к греху. Незавершённая синтаксическая конструкция уместна: следствие изложено в следующем стихе.'
