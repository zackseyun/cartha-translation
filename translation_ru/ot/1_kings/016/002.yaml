source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: ru
  text: За то, что Я поднял тебя из праха и поставил правителем над Моим народом Израилем, а ты пошёл путём Иеровоама и ввёл Мой народ Израиль в грех, вызывая у Меня гнев их грехами,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Оборот вводит основание последующего суда; «за то, что» естественно связывает этот стих с продолжающимся в следующем стихе приговором.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: Я поднял тебя из праха
  rationale: Сохраняется образ возвышения из ничтожного положения; «прах» точно и стилистически достойно передаёт עָפָר.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: и поставил правителем
  rationale: נָגִיד обозначает поставленного вождя или правителя; такой перевод ясен в контексте царской власти.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: а ты пошёл путём Иеровоама
  rationale: Сохранена метафора пути как образа поведения; союз «а» естественно выражает контраст между Божьим возвышением и ответом Ваасы, не усиливая его до резкого «но».
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: и ввёл Мой народ Израиль в грех
  rationale: Каузативная форма חטא передаётся естественным русским выражением, показывающим ответственность царя за грех народа.
- source_word: לְהַכְעִיסֵנִי
  choice: вызывая у Меня гнев
  rationale: Передаёт результат или цель действий и сохраняет личный характер Божьего негодования.
- source_word: בְּחַטֹּאתָם
  choice: их грехами
  rationale: Инструментальное בְ передано творительным падежом; местоимение естественно относится к народу Израиля.
theological_decisions:
- issue: К кому относится суффикс множественного числа в בְּחַטֹּאתָם («их грехами»)
  choice: К грехам народа Израиля, которого Вааса ввёл в грех.
  alternative: К греховным обычаям пути Иеровоама в более широком смысле, включая участие самого Ваасы.
  rationale: Ближайший синтаксический антецедент — «Мой народ Израиль»; перевод сохраняет одновременно ответственность царя как соблазнителя и ответственность народа за собственные грехи.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Синтаксис сохраняет незавершённость стиха, поскольку основанный на этой причине приговор следует далее. Местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
