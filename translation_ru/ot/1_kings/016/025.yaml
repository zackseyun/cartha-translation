base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: ru
  text: Омри делал зло в глазах Яхве и поступал хуже всех, кто был до него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и был хуже всех, кто был до него». Еврейский глагол может характеризовать либо самого Омри, либо его поступки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: делал
  rationale: В сочетании с הָרַע глагол עשה означает совершение поступков, оцениваемых как зло; «делал зло» естественно передаёт устойчивую формулу.
- source_word: הָרַע
  choice: зло
  rationale: Субстантивированное прилагательное в формуле «делать зло» естественно передаётся русским существительным «зло».
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён прозрачный древнееврейский образ оценки с чьей-либо точки зрения; выражение понятно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: וַיָּרַע
  choice: поступал хуже
  rationale: Глагольная форма допускает характеристику самого Омри либо сравнительную оценку его злых поступков. В контексте «поступал хуже» сохраняет деятельный смысл и звучит естественно.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: всех, кто был до него
  rationale: Сравнительный оборот передан без добавления отсутствующего в стихе слова «цари»; из контекста ясно, что речь идёт о предшественниках.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Характер оценки וַיָּרַע
  choice: поступал хуже
  alternative: был хуже
  rationale: Еврейский глагол может характеризовать как самого Омри, так и его действия. Основной текст выбирает естественное контекстуальное прочтение, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; сохранена библейская оценочная формула «в глазах Яхве», при этом сравнительная конструкция передана естественно и без лишнего уточнения «цари».
