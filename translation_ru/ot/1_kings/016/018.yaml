base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: ru
  text: Когда Зимри увидел, что город взят, он вошёл в цитадель царского дворца[a], поджёг над собой царский дворец огнём[b] и умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепость» или «дворец». Еврейское слово может обозначать укреплённое царское сооружение или дворец.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сжёг над собой царский дом огнём». Оборот передаёт, что Зимри устроил пожар в царской резиденции, находясь в ней сам.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּרְאוֹת זִמְרִי
  choice: Когда Зимри увидел
  rationale: Предлог כ при инфинитиве образует временную конструкцию; русское «когда… увидел» естественно передаёт её в повествовании.
- source_word: נִלְכְּדָה הָעִיר
  choice: город взят
  rationale: Нифаль глагола לכד обозначает захват города; краткая страдательная конструкция соответствует контексту.
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: укреплённую часть царского дворца
  rationale: אַרְמוֹן может обозначать дворец, крепость или укреплённое дворцовое сооружение. Такое выражение сохраняет отличие от последующего בֵּית מֶלֶךְ и избегает неестественного «крепость царского дома».
- source_word: וַיִּשְׂרֹף עָלָיו אֶת בֵּית מֶלֶךְ בָּאֵשׁ
  choice: поджёг над собой царский дворец
  rationale: «Поджёг» естественно передаёт действие огнём, уже заключённое в русском глаголе; «над собой» сохраняет необычный образ еврейского עָלָיו, не уточняя сверх текста, обрушилось ли здание.
- source_word: וַיָּמֹת
  choice: и умер
  rationale: Сохранено простое повествовательное продолжение без добавления причинной связки.
