  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие деяния Илы и всё, что он сделал, — разве не записаны они в Книге летописей царей Израиля[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Книге хроник царей Израиля».'
    reason: Сочетание דִּבְרֵי הַיָּמִים может обозначать летопись, хронику или анналы; вариант сохраняет возможную архивную окраску названия.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: Прочие деяния Илы
  rationale: יֶתֶר означает «остаток, прочее», а דִּבְרֵי в устойчивой царской формуле обозначает дела и события правления. «Прочие деяния» естественно передаёт формулу на современном русском языке. Имя אֵלָה передано в принятой русской библейской форме «Ила».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он сделал
  rationale: Прямая и естественная передача относительного оборота; широкое значение עשה сохранено глаголом «сделал».
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: הֲלוֹא вводит риторический вопрос, предполагающий утвердительный ответ. «Записаны» естественно передаёт письменную фиксацию в официальном источнике.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: в Книге летописей
  rationale: Хотя עַל буквально значит «на», применительно к содержанию документа по-русски естественно «в». דִּבְרֵי הַיָּמִים здесь обозначает летописную, анналистическую запись.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: В названии источника לְ выражает отнесённость записи к израильским царям; родительный падеж естественно передаёт эту связь.
