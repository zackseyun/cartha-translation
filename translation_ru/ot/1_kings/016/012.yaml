  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: ru
  text: Так Зимри истребил весь дом Ваасы[a], по слову Яхве, которое Он изрёк против Ваасы через пророка Ииуя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Ваасы» — его царский род, то есть династия, а не просто домашние.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: истребил
  rationale: Порода hифиль глагола שׁמד выражает причинение полного уничтожения. «Истребил» естественно для исторического повествования и передаёт более сильное значение, чем общее «уничтожил».
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: весь дом Ваасы
  rationale: В царском контексте «дом» обозначает царский род или династию, а не здание и не только домашних; библейская метафора сохранена и пояснена сноской.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Краткая русская формула передаёт соответствие события ранее произнесённому слову и его исполнение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое Он изрёк
  rationale: «Изрёк» уместно для торжественной пророческой речи; местоимение делает отсылку к Яхве ясной.
- source_word: אֶל בַּעְשָׁא
  choice: о Ваасе
  rationale: Предлог אֶל буквально обычно означает «к/к кому», однако здесь слово суда направлено в отношении Ваасы. Нейтральное «о» сохраняет смысловую напряжённость лучше, чем явно враждебное «против», а буквальная альтернатива дана в сноске.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: через пророка Ииуя
  rationale: Идиома «рукой» обозначает посредничество; «через» естественно передаёт роль пророка как вестника.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет это различие без замены имени титулом.
- issue: Направленность пророческого слова в אֶל בַּעְשָׁא
  choice: о Ваасе
  alternative: к Ваасе; против Ваасы
  rationale: Контекст указывает на слово суда, но сам предлог допускает более прямое «к». Перевод «о Ваасе» не скрывает неблагоприятного контекста и не усиливает предлог до однозначного «против»; буквальная возможность отмечена.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис остаётся ясным; традиционная династическая метафора «дом» сохранена, а неоднозначность предлога אֶל вынесена в сноску.
