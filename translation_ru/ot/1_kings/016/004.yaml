base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: ru
  text: Кто из принадлежащих Ваасе умрёт в городе[a], того съедят псы; а кто из принадлежащих ему умрёт в поле[b], того съедят птицы небесные.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто из людей Ваасы»; возможно, речь идёт о его доме или династии. Еврейское выражение обозначает принадлежность или связь, не уточняя её.'
    reason: lexical_alternative
  - marker: b
    text: Под «полем» здесь может подразумеваться открытая местность вне города.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: кто ... умрёт
  rationale: Причастие в единственном числе употреблено обобщённо и обозначает любого человека из числа связанных с Ваасой; русская неопределённо-относительная конструкция передаёт это естественно.
- source_word: לְבַעְשָׁא
  choice: из принадлежащих Ваасе
  rationale: Предлог לְ выражает отношение или принадлежность. Формулировка сохраняет широту еврейского выражения и не сужает его прямо до семьи или династии.
- source_word: בָּעִיר
  choice: в городе
  rationale: Прямое пространственное значение конструкции с בְּ.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: того съедят псы
  rationale: Глагол אָכַל означает «есть, съедать». В русском объект «того» делает синтаксис ясным; «псы» сохраняет достоинство и суровый библейский регистр.
- source_word: וְהַמֵּת לוֹ
  choice: а кто из принадлежащих ему умрёт
  rationale: Местоимение относится к Ваасе, а обобщённое причастие параллельно первой части стиха. Повтор формулировки сохраняет структуру оригинала.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Передаёт обычное значение שׂדה и сохраняет противопоставление городу.
- source_word: עוֹף הַשָּׁמָיִם
  choice: небесные птицы
  rationale: Собирательное עוֹף передано множественным числом; выражение естественно по-русски и сохраняет образ птиц небесного пространства.
- source_word: יֹאכְלוּ עוֹף הַשָּׁמָיִם
  choice: того склюют небесные птицы
  rationale: Хотя יֹאכְלוּ буквально значит «съедят», русский глагол «склюют» естественно описывает действие птиц и передаёт тот же результат без ослабления сурового образа.
