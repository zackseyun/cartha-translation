base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: А прочие деяния Амврия, всё, что он совершил, и могущество, которое он проявил,[a] — разве они не записаны в Летописи царей Израиля?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и его подвиги». Еврейское слово может означать как могущество, так и деяния, в которых оно проявляется.'
    reason: lexical_alternative
  - marker: b
    text: «Летопись царей Израиля» — летописная книга царских анналов, а не каноническая книга Паралипоменон.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: А прочие деяния Амврия
  rationale: Формула יֶתֶר דִּבְרֵי обозначает остальные сведения о делах царя. «Прочие деяния» естественно передаёт смысл, а начальное «А» сохраняет связующую силу וְ без внесения временного «теперь».
- source_word: אֲשֶׁר עָשָׂה
  choice: всё, что он совершил
  rationale: Относительное придаточное подытоживает поступки Амврия; «совершил» соответствует царскому летописному регистру и избегает тяжёлого повтора «деяния… сделал».
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: и могущество, которое он проявил
  rationale: גְּבוּרָה может обозначать как силу или могущество, так и подвиги, в которых они обнаруживаются. Основной текст сохраняет абстрактное значение и передаёт повторное עָשָׂה естественным русским выражением «проявил»; альтернативный смысл отмечен в сноске.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Сохраняется риторический вопрос, предполагающий утвердительный ответ, и значение письменной фиксации.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Летописи царей Израиля
  rationale: В данном заглавном обороте סֵפֶר דִּבְרֵי הַיָּמִים означает царский анналистический источник. «Летопись царей Израиля» ясно и естественно передаёт название, не отождествляя источник с каноническими книгами Паралипоменон.
