  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: ru
  text: И словно для него было пустяком ходить во грехах Иеровоама, сына Навата[a], он взял в жёны Иезавель, дочь Этбаала, царя сидонян, и пошёл служить Ваалу и поклонился ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Было ли для него пустяком ходить во грехах Иеровоама, сына Навата?..» Еврейское начало стиха имеет риторическую форму и подчёркивает, что Ахав счёл эти грехи чем-то незначительным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: словно ему было мало
  rationale: Передаёт риторический оборот, представляющий прежние грехи как нечто недостаточное или незначительное для Ахава, и вводит дальнейшее усиление отступничества.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: ходить во грехах
  rationale: Сохраняет еврейскую метафору устойчивого образа жизни и поведения; в русском библейском регистре она понятна и уместна.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: он взял в жёны Иезавель
  rationale: Естественно передаёт буквальную конструкцию «взял жену — Иезавель», не сводя её к более свободному пересказу.
- source_word: אֶתְבַּעַל
  choice: Этбаал
  rationale: Транслитерация близко отражает еврейскую форму имени и сохраняет содержащийся в нём элемент «Баал».
- source_word: צִידֹנִים
  choice: сидонян
  rationale: 'Передаёт множественное обозначение народа: Этбаал назван царём сидонян.'
- source_word: וַיֵּלֶךְ וַיַּעֲבֹד אֶת־הַבַּעַל
  choice: пошёл служить Ваалу
  rationale: Сохраняет глагол движения и культовое значение עבד — религиозно служить божеству.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: поклоняться ему
  rationale: Передаёт отдельный акт преклонения перед Ваалом, не смешивая его полностью с предшествующим «служить».
theological_decisions:
- issue: Соотношение грехов Иеровоама и последующего служения Ваалу
  choice: 'Начало стиха передано как риторическое усиление: Ахав не остановился на грехах Иеровоама, но пошёл дальше, вступив в брак с Иезавелью и начав служить Ваалу.'
  alternative: 'Понять начало как прямой вопрос: «Неужели мало было ему ходить во грехах Иеровоама…?»'
  rationale: Еврейское הֲנָקֵל допускает вопросительную форму, однако в контексте повествования функция оборота — подчеркнуть нарастание отступничества. Основной текст сохраняет это усиление, а сноска — формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Метафора «ходить во грехах» сохранена как значимый образ поведения; синтаксис упрощён настолько, чтобы стих оставался понятным обычному читателю.
