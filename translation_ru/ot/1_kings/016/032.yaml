base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: ru
  text: Он поставил жертвенник Ваалу в храме Ваала[a], который он построил в Самарии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в доме Ваала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: поставил
  rationale: Каузативная форма глагола קום здесь означает «поставить, воздвигнуть, установить». «Поставил» естественно сочетается с «жертвенник» в современном русском языке и передаёт действие без излишней архаизации.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Обычный русский библейский эквивалент для מזבח, обозначающего сооружение для принесения жертв.
- source_word: לַבָּעַל
  choice: Ваалу
  rationale: Предлог ל обозначает посвящение или предназначение жертвенника. Русский дательный падеж естественно передаёт смысл «жертвенник, посвящённый Ваалу».
- source_word: בֵּית הַבַּעַל
  choice: храме Ваала
  rationale: Буквально выражение означает «дом Ваала», но в данном культовом контексте בַּיִת обозначает храм. «Храм Ваала» ясно и естественно передаёт значение; буквальный вариант сохранён в сноске.
- source_word: אֲשֶׁר בָּנָה
  choice: который построил
  rationale: Относительное местоимение мужского рода однозначно соотносится с «храмом». В русском контексте простое прошедшее время естественно выражает предшествующее строительство без обязательного дополнительного указания на давнопрошедшее действие.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Стандартная передача топонима שֹׁמְרוֹן; предлог ב указывает место.
theological_decisions:
- issue: Передача בֵּית הַבַּעַל
  choice: храм Ваала
  alternative: дом Ваала
  rationale: Речь идёт о культовом здании, поэтому «храм» непосредственно и понятно передаёт контекстуальное значение. Чтобы не скрывать буквальную форму еврейского выражения и связь слова בַּיִת со значением «дом», она указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краткий и ясный; «жертвенник» сохраняет устоявшуюся сакральную лексику, а «храм» делает функцию здания понятной обычному читателю.
