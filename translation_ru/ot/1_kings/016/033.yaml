  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: ru
  text: Ахав также сделал ашеру[a]. И Ахав продолжал делать ещё больше, чтобы гневить Яхве, Бога Израиля, чем все цари Израиля, бывшие до него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столб Ашеры». Еврейское слово אֲשֵׁרָה может обозначать богиню Ашеру или связанный с ней культовый предмет.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Прямо передаёт обычное значение עשה и не сужает его до контекстуально возможного «поставил».
- source_word: הָאֲשֵׁרָה
  choice: ашеру
  rationale: Транслитерация сохраняет возможность понимать אֲשֵׁרָה как богиню Ашеру либо как связанный с ней культовый предмет; определённость выражена контекстом и формой винительного падежа.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: сделал больше
  rationale: Конструкция יסף с инфинитивом вместе с последующим сравнением указывает здесь не только на продолжение действий, но и на превосходство прежних царей по степени зла.
- source_word: לְהַכְעִיס
  choice: чтобы разгневать
  rationale: 'Передаёт каузативное значение породы hифиль: вызвать гнев, разгневать.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Естественно и точно передаёт еврейское сопряжённое сочетание.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל אֲשֶׁר הָיוּ לְפָנָיו
  choice: больше, чем все цари Израиля, бывшие до него
  rationale: Сравнительное מן передано оборотом «больше, чем», а לְפָנָיו в данном контексте означает предшествовавших ему царей.
theological_decisions:
- issue: Референт אֲשֵׁרָה
  choice: Сохранить термин «ашера» без уточнения в основном тексте.
  alternative: «столб Ашеры» либо «Ашера» как имя богини
  rationale: Само еврейское слово может обозначать как богиню, так и связанный с ней культовый предмет; стих не позволяет уверенно устранить эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; синтаксис сделан ясным для широкого читателя, при этом сохранены повтор имени Ахав, сравнительная сила высказывания и неоднозначность культового термина.
