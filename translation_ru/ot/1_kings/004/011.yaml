lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: Бен-Авинадав
  rationale: Передано как личное имя («сын Авинадава»), в соответствии с формой перечня окружных начальников и традиционным пониманием конструкции.
- source_word: כָּל נָפַת דֹּאר
  choice: во всей области Дора
  rationale: נָפָה здесь обозначает административную область или округ. Буквальное «возвышенность» возможно этимологически, но в данном перечне естественнее и контекстуально точнее географико-административное значение.
- source_word: טָפַת
  choice: Тафат
  rationale: Женское личное имя передано транслитерацией, близкой к древнееврейскому звучанию.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: была его женой
  rationale: Естественная русская передача древнееврейской конструкции принадлежности и брачного отношения.
