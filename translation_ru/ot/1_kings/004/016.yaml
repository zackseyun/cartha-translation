  text: Baana son of Hushai[a], in Asher and Bealoth.
translation:
  language: ru
  text: Баана, сын Хушая, — в Асире и Беалоте.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и Алоте». Чтение и местонахождение последнего названия не вполне ясны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: Баана
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение сыновней принадлежности в административном перечне.
- source_word: חוּשָׁי
  choice: Хушая
  rationale: Личное имя транслитерировано и поставлено в родительный падеж после слова «сын».
- source_word: בְּ/אָשֵׁר
  choice: в Асире
  rationale: Предлог בְ естественно передан как «в»; выражение указывает территорию, порученную чиновнику, не усиливая его до толкования «над Асиром».
- source_word: וּ/בְעָלֽוֹת
  choice: и Беалоте
  rationale: Название местности передано как «Беалот»; в русском падежное оформление распространяется на однородные названия после «в», хотя в еврейском тексте предлог перед вторым названием не повторён. Текстовая и географическая неуверенность отмечена в сноске.
