  text: וַֽ/יְהִי֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/001.yaml
  text: King Solomon was king over all Israel.
translation:
  language: ru
  text: Царь Соломон был царём над всем Израилем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: был
  rationale: Форма וַיְהִי здесь вводит новое повествовательное положение дел и вместе с именной частью образует сказуемое. В современном русском отдельное «и было» звучало бы тяжеловесно, поэтому переходная функция не выражена самостоятельным словом.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: 'Определённое существительное стоит при имени как титул: «царь Соломон». В русском титул перед личным именем обычно употребляется без артиклевого эквивалента.'
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная русская форма личного имени.
- source_word: מֶלֶךְ
  choice: царём
  rationale: Второе употребление מֶלֶךְ является именной частью сказуемого и обозначает царский статус Соломона. Творительный падеж после «был» естественен в современном русском и сохраняет именную конструкцию оригинала.
- source_word: עַל
  choice: над
  rationale: В контексте царской власти предлог обозначает владычество над народом; «над» — естественный русский эквивалент.
- source_word: כָּל
  choice: всем
  rationale: 'Передаёт полноту охвата: царская власть распространялась на весь Израиль.'
- source_word: יִשְׂרָאֵל
  choice: Израилем
  rationale: Традиционная русская форма названия народа и страны; падеж обусловлен предлогом «над».
theological_decisions:
- issue: Передача повторения מֶלֶךְ
  choice: 'Сохранить оба употребления: «Царь Соломон был царём над всем Израилем».'
  alternative: «Соломон царствовал над всем Израилем» или «Соломон был царём над всем Израилем».
  rationale: В еврейском тексте слово מֶלֶךְ употреблено сначала как титул, затем как сказуемое. Сохранение повтора передаёт акцент оригинала на установленной царской власти Соломона над всем Израилем, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная формулировка. Лексический повтор «царь — царём» намеренно сохранён как значимая особенность исходного текста.
