  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: ru
  text: Ахимаас[a] — в земле Неффалима; он также взял в жёны Басемат, дочь Соломона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над землёй Неффалима» или «для земли Неффалима»; еврейский предлог может обозначать территорию, порученную Ахимаасу в этом перечне окружных начальников.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взял Басемат, дочь Соломона, в жёны» — обычное еврейское выражение со значением «женился на ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Ахимаас
  rationale: Традиционная русская передача еврейского личного имени; она уместна для современного литературного библейского текста.
- source_word: בְּנַפְתָּלִי
  choice: в земле Неффалима
  rationale: Предлог בְ с названием колена или области указывает здесь на территорию ведения чиновника. Добавление «земле» делает географический смысл ясным, не уточняя сверх текста характер полномочий.
- source_word: גַּם הוּא
  choice: он также
  rationale: Передаёт присоединительное ударение еврейского сочетания естественным русским порядком слов.
- source_word: לָקַח ... לְאִשָּׁה
  choice: взял в жёны
  rationale: Устойчивое и понятное русское соответствие стандартной еврейской брачной формуле, сохраняющее её образность.
- source_word: בָּשְׂמַת
  choice: Басемат
  rationale: Транслитерация личного имени с передачей конечного согласного ת; форма отличает её от укоренившейся передачи другого библейского контекста, не меняя значения имени.
- source_word: בַּת שְׁלֹמֹה
  choice: дочь Соломона
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
