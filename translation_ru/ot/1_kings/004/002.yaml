lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот какие
  rationale: Сочетание союза и указательного местоимения вводит перечень; перевод сохраняет связь с предшествующим текстом и естественно начинает список по-русски.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Слово обозначает высокопоставленных правителей, начальников или царских должностных лиц. В контексте двора «сановники» передаёт высокий административный статус, не предполагая наследственного княжеского достоинства.
- source_word: אֲשֶׁר לוֹ
  choice: были у него
  rationale: Буквально передаёт конструкцию принадлежности или связи с царём, не добавляя прямо не выраженного значения «служили».
- source_word: עֲזַרְיָהוּ
  choice: Азария
  rationale: Принятая русская библейская форма имени.
- source_word: בֶן צָדוֹק
  choice: сын Садока
  rationale: Прямое и естественное соответствие еврейской конструкции родства.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Еврейский текст буквально говорит «священник» и не употребляет отдельного выражения «первосвященник».
theological_decisions:
- issue: К кому относится определение הַכֹּהֵן («священник») — к Азарии или к Садоку
  choice: Сохранить формулировку «Азария, сын Садока, священник», а неоднозначность пояснить в сноске.
  alternative: «Азария, сын священника Садока» или «Азария, сын Садока, первосвященник»
  rationale: Еврейская конструкция допускает соотнесение приложения как с Азарией, так и с Садоком; кроме того, текст не говорит прямо «первосвященник». Перевод не должен без необходимости разрешать эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, подходящим для царского административного перечня регистром. Формула «были у него» намеренно сохраняет краткость и семантическую открытость оригинала. Точка с запятой показывает, что перечень продолжается в следующих стихах.
