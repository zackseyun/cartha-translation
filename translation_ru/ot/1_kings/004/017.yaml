  naturalness: Фраза с тире естественна как элемент перечня. «В Иссахаре» звучит по-русски проще и ближе к исходной формуле, чем «в земле Иссахара». Ударения в самом библейском тексте не нужны и визуально выбиваются из современного литературного регистра.
