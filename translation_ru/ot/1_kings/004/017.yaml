lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Традиционная русская форма еврейского личного имени; имя транслитерируется, а не переводится по значению.
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение родства и отчества в перечне должностных лиц.
- source_word: פָּרוּחַ
  choice: Паруа́х
  rationale: Транслитерация личного имени с передачей конечного гортанного согласного через «х»; ударение указано для ясного чтения редкого имени.
- source_word: בְּ/יִשָׂשכָר
  choice: в земле Иссаха́ра
  rationale: Предлог בְ буквально указывает на нахождение в пределах области; добавление «земле» делает эллиптическую административную формулу естественной по-русски, не превращая её явно в указание на власть над коленом.
