  text: Бен-Хесед[a] — в Арубботе; ему принадлежали Сохо и вся земля Хефера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «сын Хеседа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Бен-Хесед
  rationale: В перечне окружных управителей сочетание, вероятнее всего, выполняет функцию имени; транслитерация сохраняет эту ономастическую форму, а буквальный разбор приведён в примечании.
- source_word: בָּאֲרֻבּוֹת
  choice: в Арубботе
  rationale: Предлог ב имеет локативное значение «в»; географическое название передано транслитерацией.
- source_word: לוֹ
  choice: ему были поручены
  rationale: Буквально «ему [принадлежали/были]»; в контексте административного списка речь идёт о территории, вверенной управителю. Формулировка передаёт этот смысл, не подразумевая личной собственности.
- source_word: שֹׂכֹה
  choice: Сохо
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: и вся земля Хефер
  rationale: אֶרֶץ здесь означает землю или область, а כָל сохранено словом «вся»; название региона транслитерировано.
