base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: ru
  text: 'Баана, сын Ахилуда: Таанах и Мегиддо, и вся область Беф-Шеана, что близ Цартана, ниже Изрееля, от Беф-Шеана до Авел-Мехолы и до мест по ту сторону Иокмеама.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «и до другой стороны Иокмеама». Древнееврейское обозначение границы кратко и допускает разные способы синтаксического понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Баана, сын Ахилуда
  rationale: Личные имена переданы транслитерацией в формах, естественных для русской библейской речи.
- source_word: תַּעְנַ֖ךְ וּמְגִדּוֹ
  choice: Таанах и Мегиддо
  rationale: Географические названия переданы традиционными и узнаваемыми русскими формами.
- source_word: וְכָל בֵּית שְׁאָן
  choice: и вся область Беф-Шеана
  rationale: כָל с названием города здесь охватывает связанную с ним территорию; слово «область» делает административно-географический смысл ясным, не сводя выражение к самому городу.
- source_word: אֲשֶׁר אֵצֶל צָרְתַנָה
  choice: что близ Цартана
  rationale: אֵצֶל обозначает близость или соседство; «близ» сохраняет пространственную связь без чрезмерной точности.
- source_word: מִתַּחַת לְיִזְרְעֶאל
  choice: ниже Изрееля
  rationale: Сохранён топографический смысл более низкого положения; перевод не заменяет его предположительным указанием стороны света.
- source_word: מִבֵּית שְׁאָן עַד אָבֵל מְחוֹלָה
  choice: от Беф-Шеана до Авел-Мехолы
  rationale: Естественно передаёт формулу территориальной протяжённости.
- source_word: עַד מֵעֵבֶר לְיָקְמֳעָם
  choice: и до мест по ту сторону Иокмеама
  rationale: Необычная краткая пограничная формула передана плавно, но с сохранением пространственного образа «по ту сторону»; добавленное «мест» обозначает подразумеваемую территорию.
