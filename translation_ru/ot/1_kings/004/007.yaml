  rationale: Исправление делает русский текст более естественным и яснее передаёт распределённую ежегодную обязанность каждого из двенадцати должностных лиц. Термин для נִצָּבִים оставлен нейтральным, а альтернативы сохранены в сноске; богословских или конфессионально обусловленных уточнений не внесено.
