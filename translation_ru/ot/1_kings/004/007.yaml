  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: ru
  text: У Соломона было двенадцать чиновников[a], поставленных над всем Израилем. Они снабжали продовольствием царя и его двор; каждый — в течение одного месяца в году.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управителей», «начальников». Еврейское слово имеет широкое значение и обозначает назначенных должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: У Соломона было
  rationale: Предлог לְ выражает здесь обладание; русская конструкция «у Соломона было» естественно передаёт этот смысл. Начальное וְ не нуждается в отдельном «и» при публикации отдельного стиха.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Прямое соответствие количественному числительному.
- source_word: נִצָּבִים
  choice: поставленных управителей
  rationale: Причастная форма обозначает назначенных или поставленных должностных лиц. «Управители» соответствует административному контексту, а «поставленных» сохраняет смысловой оттенок еврейского слова.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Предлог עַל при названии административной должности указывает на сферу ответственности или власти.
- source_word: וְכִלְכְּלוּ
  choice: Они снабжали продовольствием
  rationale: В данном придворно-хозяйственном контексте כלכל означает обеспечивать необходимыми припасами; уточнение «продовольствием» ясно передаёт характер снабжения.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: царя и его дом
  rationale: '«Дом» сохраняет широкое значение בַּיִת: царское семейство и двор, а не только здание.'
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: один месяц в году
  rationale: Фраза обозначает продолжительность ежегодной обязанности каждого управителя.
- source_word: יִהְיֶה עַל אֶחָד לְכַלְכֵּל
  choice: каждый из них должен был делать это
  rationale: Буквально обязанность «лежала на одном»; по-русски распределительный смысл естественно выражается через «каждый из них должен был».
