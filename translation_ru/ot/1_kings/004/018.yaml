lexical_decisions:
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому имени.
- source_word: בֶן
  choice: сын
  rationale: Обычная и естественная передача еврейской родственной конструкции в кратком административном перечне.
- source_word: אֵלָא
  choice: Элы
  rationale: Имя передано как «Эла» с требуемой русской формой родительного падежа после слова «сын».
- source_word: בְּ/בִנְיָמִן
  choice: в земле Вениамина
  rationale: Предлог בְ прежде всего указывает на нахождение или сферу служения; добавление «земле» делает территориальный смысл естественным по-русски, не устраняя возможного административного оттенка.
