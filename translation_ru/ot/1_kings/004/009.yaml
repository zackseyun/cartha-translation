  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: ru
  text: Бен-Декер[a] — в Макаце, Шаалвиме, Бет-Шемеше и Элон-Бет-Ханане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «сын Декера»; здесь еврейская форма имени сохранена как личное обозначение «Бен-Декер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Бен-Декер
  rationale: В перечне областных начальников сочетание «бен + имя» служит личным обозначением; транслитерация сохраняет еврейскую форму имени, а буквальное понимание отмечено в сноске.
- source_word: בְּמָקַץ
  choice: в Макаце
  rationale: Предлог בְ непосредственно выражает местную связь; «в» передаёт её без внесения из контекста значения «над».
- source_word: וּבְשַׁעַלְבִים
  choice: Шаалбиме
  rationale: Название места транслитерировано; общий предлог «в» относится ко всему однородному ряду, что естественно для русского языка.
- source_word: וּבֵית שָׁמֶשׁ
  choice: Бет-Шемеше
  rationale: Несмотря на отсутствие повторённого предлога в еврейском тексте, продолжается тот же местный ряд; географическое название передано транслитерацией, а не переведено буквально.
- source_word: וְאֵילֹון בֵּית חָנָן
  choice: Элон-Бет-Ханане
  rationale: Сочетание принято как составное географическое название; местное значение предлога перенесено из начала перечисления.
