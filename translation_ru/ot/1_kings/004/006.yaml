  text: וַ/אֲחִישָׁ֖ר עַל הַ/בָּ֑יִת וַ/אֲדֹנִירָ֥ם בֶּן עַבְדָּ֖א עַל הַ/מַּֽס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: ru
  text: Ахишар заведовал царским домом[a], а Адонирам, сын Авды, — принудительными работами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «над домом»; это придворная должность, связанная с управлением царским домом или дворцом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трудовой повинностью». Речь идёт об обязательных работах на государство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: Ахишар
  rationale: Личное имя передано принятой русской библейской транслитерацией; союз וַ в перечне естественно передан построением фразы.
- source_word: עַל הַבָּיִת
  choice: заведовал царским домом
  rationale: В перечне придворных должностей עַל указывает на руководство, а הַבַּיִת — на царский дом, то есть двор и его хозяйство. «Заведовал» естественно передаёт административную функцию, не сводя её к надзору за зданием.
- source_word: וַאֲדֹנִירָם
  choice: а Адонирам
  rationale: Личное имя транслитерировано; союз передан как «а», что естественно связывает однородные пункты перечня без смыслового противопоставления.
- source_word: בֶּן עַבְדָּא
  choice: сын Авды
  rationale: Обычная русская передача патронимической формулы; имя поставлено в родительный падеж.
- source_word: עַל הַמַּס
  choice: принудительными работами
  rationale: מַס в административном контексте обозначает государственную трудовую повинность. Такая передача ясна современному читателю и точнее, чем общее «подать».
