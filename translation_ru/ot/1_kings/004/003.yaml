  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: ru
  text: Елихореф и Ахия, сыновья Шиши, были писцами[a]; Иосафат, сын Ахилуда, — летописцем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «секретарями». Еврейское слово обозначает царских служащих, занимавшихся письмом и документами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хранителем записей», «докладчиком». Речь идёт о придворном чиновнике, который вёл записи и докладывал царю о делах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Елихореф
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: וַאֲחִיָּה
  choice: и Ахия
  rationale: Личное имя с союзом передано принятой русской библейской формой.
- source_word: בְּנֵי שִׁישָׁא
  choice: сыновья Шиши
  rationale: Прямо передаёт конструкцию принадлежности и следует форме имени именно в масоретском тексте данного стиха.
- source_word: סֹפְרִים
  choice: писцами
  rationale: В данном административном перечне слово обозначает царских служащих, ведавших письмом и документами. «Писцы» сохраняет традиционный и достаточно широкий смысл, не смешивая эту должность со следующей.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶּן אֲחִילוּד
  choice: сын Ахилуда
  rationale: Естественная русская передача указания на происхождение.
- source_word: הַמַּזְכִּיר
  choice: летописцем
  rationale: 'Название придворной должности: этот чиновник хранил записи и доводил дела до сведения царя. «Летописец» — понятная и традиционная русская передача, отличающая эту должность от писцов.'
