base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: ru
  text: Гевер, сын Урия, — в земле Галаада, земле Сигона, царя аморреев, и Ога, царя Васана; он был единственным правителем в этой земле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который был в земле»; возможно также административное понимание: «который управлял этой землёй».'
    reason: Еврейское выражение אֲשֶׁר בָּאָרֶץ буквально пространственно («который был в земле»), однако в контексте перечня должностных лиц допускает и административное понимание.
lexical_decisions:
- source_word: גֶּבֶר
  choice: Гевер
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בֶּן אֻרִי
  choice: сын Урия
  rationale: Обычная русская передача еврейской патронимической конструкции; имя אֻרִי поставлено в родительном падеже.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: в земле Галаадской
  rationale: Существительное אֶרֶץ сохранено, поскольку далее оно повторяется в приложении; форма соответствует естественному высокому, но понятному русскому регистру.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: земле Сигона, царя аморреев, и Ога, царя Васанского
  rationale: Сохранено приложение, отождествляющее Галаад с прежними владениями Сигона и Ога; синтаксическая связь обоих царей со словом «земля» не устранена.
- source_word: נְצִיב
  choice: наместник
  rationale: В административном контексте главы слово обозначает назначенного областного правителя; «наместник» ясно передаёт должность и подходит к историческому повествованию.
- source_word: אֶחָד
  choice: единственный
  rationale: В данной конструкции числительное подчёркивает, что для этой земли был один наместник; «единственный» естественнее по-русски, чем буквальное «один».
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: в этой земле
  rationale: Сохранено буквальное пространственное значение предлога ב; возможное административное понимание вынесено в примечание.
