base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/008.yaml
  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: ru
  text: 'И вот их имена: Бен-Хур[a] — в нагорье Ефрема;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын Хура», если это указание на отца, а не личное имя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сочетание союза и указательного местоимения вводит перечень; «И вот» естественно передаёт связующую и предъявительную функцию выражения.
- source_word: שְׁמוֹתָם
  choice: их имена
  rationale: В еврейском это безглагольная именная конструкция. Русское настоящее «вот их имена» сохраняет её непосредственность и уместно при введении списка.
- source_word: בֶּן חוּר
  choice: Бен-Хур
  rationale: В перечне окружных начальников сочетание может восприниматься как личное имя; транслитерация сохраняет это прочтение, а возможное патронимическое понимание отмечено в сноске.
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: В территориальном выражении הַר обозначает гористую возвышенную область, а не обязательно одну гору; «нагорье» точно и естественно передаёт региональный смысл.
