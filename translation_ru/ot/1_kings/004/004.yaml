  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: ru
  text: Ванея, сын Иодая, стоял во главе войска, а Садок и Авиафар были священниками[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главными служителями» или «высшими должностными лицами», если כֹּהֲנִים понимается здесь в более широком придворно-административном смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: стоял во главе войска
  rationale: Сочетание עַל с областью ответственности выражает руководство или надзор. Русское «стоял во главе войска» естественно передаёт этот смысл, не вводя отсутствующего в еврейском тексте точного воинского звания.
- source_word: הַצָּבָא
  choice: войска
  rationale: Здесь צָבָא обозначает организованные вооружённые силы; «войско» — ясный и уместный современный русский эквивалент.
- source_word: כֹּהֲנִים
  choice: священниками
  rationale: Обычное и основное значение слова — «священники». Садок и Авиафар известны в тексте как священники, поэтому придворно-административный контекст не даёт достаточных оснований заменять основное значение.
- source_word: בְנָיָהוּ
  choice: Ванея
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: יְהוֹיָדָע
  choice: Иодая
  rationale: Использована устоявшаяся русская библейская форма имени с падежным оформлением по нормам русского языка.
- source_word: צָדוֹק
  choice: Садок
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: אֶבְיָתָר
  choice: Авиафар
  rationale: Использована устоявшаяся русская библейская форма личного имени.
theological_decisions:
- issue: Следует ли понимать כֹּהֲנִים в данном перечне придворных должностных лиц не в культовом смысле, а как «главные служители» или «высшие сановники».
  choice: священниками
  alternative: главными служителями; высшими сановниками
  rationale: Основное лексическое значение כֹּהֲנִים — «священники», и Садок с Авиафаром в других местах прямо выступают как священники. Перевод сохраняет это наиболее обоснованное значение, а возможное более широкое административное понимание отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «стоял во главе войска» звучит естественно и сохраняет административный характер еврейского выражения; имена даны в традиционных русских библейских формах.
