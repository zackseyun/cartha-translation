id: 1KI.4.5
reference: 1 Kings 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֥הוּ בֶן נָתָ֖ן עַל הַ/נִּצָּבִ֑ים וְ/זָב֧וּד בֶּן נָתָ֛ן כֹּהֵ֖ן רֵעֶ֥ה הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: ru
  text: Азарьяху, сын Натана, ведал наместниками; Завуд, сын Натана, был священником[a] и другом царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «высшим сановником» или «царским советником».'
    reason: Лексема כֹּהֵן обычно означает «священник», но в данном придворном контексте может обозначать высокопоставленного царского служащего.
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Азарьяху
  rationale: Имя передано транслитерацией с сохранением полной древнееврейской формы на -ьяху, а не в традиционно сокращённой форме «Азария».
- source_word: בֶן נָתָן
  choice: сын Натана
  rationale: Естественная русская передача родственной формулы; имя נָתָן транслитерировано как «Натан».
- source_word: עַל הַנִּצָּבִים
  choice: ведал наместниками
  rationale: Предлог עַל здесь выражает руководство, а נִצָּבִים обозначает назначенных административных служащих. «Ведал наместниками» ясно и естественно передаёт управленческую функцию, не уточняя сверх текста характер их округов или обязанностей.
- source_word: זָבוּד
  choice: Завуд
  rationale: Имя передано прямой транслитерацией древнееврейской формы.
- source_word: כֹּהֵן
  choice: священником
  rationale: Сохранено основное словарное значение слова. Возможный придворно-административный смысл отмечен в сноске, поскольку контекст допускает его, но не требует заменять им прямое значение.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: другом царя
  rationale: Буквальная и естественная передача выражения, которое может обозначать близкого царского доверенного или приближённого.
theological_decisions:
- issue: Значение כֹּהֵן в перечне царских должностных лиц
  choice: В основном тексте — «священником», с придворно-административной альтернативой в сноске.
  alternative: высшим сановником; царским советником
  rationale: Обычное значение כֹּהֵן — «священник». Контекст царского двора допускает понимание высокой придворной должности, однако источник не устраняет лексическую неоднозначность, поэтому она сохранена посредством сноски.
translation_notes:
  register: Современный литературный русский язык; административное «ведал» звучит достойно и понятно. Точка с запятой разграничивает сведения о двух лицах, а союз «и» сохраняет два определения Завуда. Маркер сноски поставлен непосредственно после слова «священником», к которому относится лексическая альтернатива.
