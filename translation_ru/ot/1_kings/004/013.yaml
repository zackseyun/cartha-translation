base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: ru
  text: Бен-Гевер[a] — в Рамот-Галааде; ему принадлежали селения Иаира[b], сына Манассии, что в Галааде; ему же принадлежала область Аргов[c], что в Васане, — шестьдесят больших городов со стенами и бронзовыми засовами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын Гевера»; здесь, вероятно, личное имя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или передать названием: «Хаввот-Иаир»; возможно, речь о шатровых поселениях Иаира.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «округ» или «территория Аргов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: сын Гевера
  rationale: Передаёт обычное еврейское сочетание «сын + имя» и сохраняет возможность понимать Гевера как имя отца чиновника; именное прочтение указано в сноске.
- source_word: בְּרָמֹת גִּלְעָד
  choice: в Рамоте Галаадском
  rationale: Предлог ב здесь имеет местное значение; форма соответствует естественной русской передаче географического названия.
- source_word: לֹו
  choice: ему принадлежали
  rationale: В контексте списка областных начальников оборот выражает закреплённую за чиновником территорию; повтор передан конструкцией «а также» без потери смысла.
- source_word: חַוֺּת יָאִיר
  choice: селения Иаира
  rationale: חַוּוֹת обозначает поселения или селения; понятный русский эквивалент предпочтительнее непрозрачной транслитерации.
- source_word: חֶבֶל אַרְגֹּב
  choice: область Аргов
  rationale: חֶבֶל здесь обозначает территориальный участок или округ; «область» естественно звучит в административно-географическом контексте.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: шестьдесят больших городов
  rationale: גְּדֹלוֹת может указывать на размер или значительность; нейтральное «больших» сохраняет эту широту.
- source_word: חוֹמָה וּבְרִיחַ נְחֹשֶׁת
  choice: со стенами и бронзовыми засовами
  rationale: Единственное число имеет распределительное значение применительно ко всем городам. בְרִיחַ означает запорный брус или засов, а не ворота; נְחֹשֶׁת может обозначать медь или бронзу.
