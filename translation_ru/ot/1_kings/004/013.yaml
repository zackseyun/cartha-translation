  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис административного перечня сохранён, но повтор לֹו естественно свёрнут в «а также». Имена переданы в привычной русской библейской форме; подлинные лексические альтернативы вынесены в сноски.
