base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: ru
  text: И он пошёл оттуда и нашёл Елисея, сына Сафата. Тот пахал, и перед ним шли двенадцать упряжек[a], а сам он был с двенадцатой. Илия прошёл мимо него и набросил на него свой плащ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двенадцать пар»; в данном земледельческом контексте имеются в виду пары тягловых животных, вероятнее всего волов.'
    reason: lexical_alternative
  - marker: b
    text: То есть верхнюю одежду Илии; традиционный перевод — «милоть». В контексте она связана с его пророческим служением.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: И он пошёл оттуда
  rationale: Сохраняет развитие повествования, выраженное последовательным вав, и пространственное значение מִשָּׁם.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: и нашёл Елисея, сына Сафата
  rationale: Прямо передаёт значение מָצָא и использует принятые русские формы библейских имён.
- source_word: וְהוּא חֹרֵשׁ
  choice: Тот пахал
  rationale: Причастие обозначает продолжающееся действие и вводит сцену; местоимение «тот» естественно связывает фразу с Елисеем.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: двенадцать упряжек
  rationale: צֶמֶד в земледельческом контексте обозначает запряжённую пару животных; «упряжек» естественно по-русски передаёт рабочие пары, не вставляя прямо отсутствующее в еврейском тексте слово «волы».
- source_word: לְפָנָיו
  choice: перед ним шли
  rationale: Передаёт пространственное отношение; глагол «шли» делает русскую фразу понятной, не меняя картины пахоты.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: а сам он был с двенадцатой
  rationale: Сохраняет краткость и некоторую эллиптичность еврейского выражения, указывающего, что Елисей находился при двенадцатой упряжке.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Илия прошёл мимо него
  rationale: Передаёт движение Илии возле Елисея без добавления толкования символического поступка.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: и набросил на него свой плащ
  rationale: אַדֶּרֶת здесь означает характерную верхнюю одежду Илии; «плащ» современно и понятно, а «набросил» естественно описывает направленное на Елисея действие.
theological_decisions:
- issue: Символическое значение одежды Илии
  choice: 'Передать только сам поступок: «набросил на него свой плащ».'
  alternative: Разъяснить в тексте, что Илия тем самым призвал Елисея или назначил его преемником.
  rationale: Стих описывает символический жест, но не объясняет его прямо. Его значение должно раскрываться из контекста, а не вноситься в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Архаичное «милоть» вынесено в примечание; в основном тексте употреблено общепонятное «плащ». Синтаксис сохраняет последовательность еврейского повествования и не разъясняет символический жест сверх сказанного в стихе.
