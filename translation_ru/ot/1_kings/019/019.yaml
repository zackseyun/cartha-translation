  source_fidelity: 'Перевод точно передаёт последовательность повествования и основные элементы еврейского текста: уход «оттуда», нахождение Елисея, пахоту с двенадцатью צְמָדִים перед ним, его положение при двенадцатой упряжке и жест Илии с одеждой. «Упряжки» — удачное естественное соответствие в русском контексте пахоты; примечание корректно поясняет подразумеваемые парные команды, не превращая «волов» в обязательный элемент основного текста.'
