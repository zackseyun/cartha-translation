base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: ru
  text: 'Он оставил волов, побежал за Илиёй и сказал: «Позволь мне, пожалуйста, поцеловать[a] своего отца и свою мать, а потом я пойду за тобой». Илия сказал ему: «Иди, возвращайся[b]: что я тебе сделал?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая общий смысл: «Позволь мне проститься с отцом и матерью». Еврейский глагол буквально означает «поцеловать».'
    reason: lexical_alternative
  - marker: b
    text: 'Ответ Илии не вполне ясен. Его можно понять как разрешение вернуться либо как краткую, незавершённую реплику, оставляющую решение за Елисеем; последние слова допускают и смысл: «Что я для тебя сделал?»'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: оставил
  rationale: Глагол עזב здесь естественно передаёт прекращение работы и уход от волов, не усиливая смысл до окончательного оставления.
- source_word: הַבָּקָר
  choice: волов
  rationale: В контексте пахоты речь идёт о тягловых животных; «волов» точнее общего «скот».
- source_word: וַיָּרָץ אַחֲרֵי
  choice: побежал за
  rationale: Передаёт буквальное преследование и звучит естественно по-русски.
- source_word: אֶשְּׁקָה נָּא
  choice: Позволь мне, пожалуйста, поцеловать
  rationale: Сохраняет конкретное значение глагола «целовать» и вежливую частицу נָא; прощальный смысл поясняется в сноске.
- source_word: לְאָבִי וּלְאִמִּי
  choice: отца и мать
  rationale: Сохраняется раздельное упоминание обоих родителей; принадлежность естественно выражена русской конструкцией после «поцеловать».
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: а потом я пойду за тобой
  rationale: «Пойду за тобой» сохраняет образ движения следом и возможный смысл последования; «потом» ясно передаёт последовательность действий.
- source_word: לֵךְ שׁוּב
  choice: Иди, возвращайся
  rationale: Сохранены оба кратких повеления оригинала и его резкость, хотя выражение остаётся эллиптичным.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: Что я тебе сделал?
  rationale: Прямой русский эквивалент сохраняет неоднозначность вопроса; союз כִּי не выражен отдельно, поскольку в русском такая связь естественно передаётся соположением фраз.
theological_decisions:
- issue: Смысл ответа Илии כִּי מֶה עָשִׂיתִי לָךְ
  choice: Сохранить буквальный вопрос «Что я тебе сделал?» без истолкования в основном тексте.
  alternative: Фразу можно понимать как разрешение вернуться, как напоминание о совершённом призвании или как предоставление Елисею свободы решения.
  rationale: Еврейская реплика допускает несколько пониманий. Перевод не выбирает между разрешением, упрёком и напоминанием и тем самым сохраняет напряжение оригинала.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис преимущественно естественный, но в реплике «Иди, возвращайся» намеренно сохранены краткость и необычность еврейского оригинала. Имена переданы в традиционной русской библейской форме: Илия.'
