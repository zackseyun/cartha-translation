base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: ru
  text: 'И сказал ему Яхве: «Ступай, возвращайся своей дорогой в пустыню Дамаска[a]. Когда придёшь, помажь Азаила царём над Арамом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сторону пустыни Дамаска». Еврейская форма слова «пустыня» содержит окончание, указывающее направление движения.'
    reason: lexical_alternative
  - marker: b
    text: Арам — еврейское название страны, которую часто называют Сирией.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: לֵךְ שׁוּב
  choice: Иди, вернись
  rationale: Сохранены два последовательных повелительных глагола; формулировка остаётся естественной для современного русского языка.
- source_word: לְדַרְכְּךָ
  choice: своим путём
  rationale: Русский оборот естественно передаёт указание вернуться по своему пути, не воспроизводя еврейский предлог буквально.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: к Дамасской пустыне
  rationale: Окончание направления указывает на движение к пустынной местности, связанной с Дамаском; предлог «к» не утверждает без необходимости, что Илия должен войти внутрь неё.
- source_word: וּבָאתָ
  choice: Когда придёшь
  rationale: В контексте форма обозначает действие, по достижении которого следует исполнить очередное повеление.
- source_word: וּמָשַׁחְתָּ
  choice: помажь
  rationale: Форма продолжает цепь повелений; русский императив ясно и естественно передаёт обязательность поручения.
- source_word: חֲזָאֵל
  choice: Азаил
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: царём над Арамом
  rationale: Сохранена формула поставления на царство и непосредственно передано еврейское название страны.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность Божьих повелений, избегая излишней архаичности.
