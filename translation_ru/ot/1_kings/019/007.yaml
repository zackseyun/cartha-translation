  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: ru
  text: 'Ангел[a] Яхве вернулся во второй раз, прикоснулся к нему и сказал: «Встань и поешь, ведь путь тебе не под силу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вестник Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: В повествовательном контексте שוב обозначает возвращение; «вернулся» естественно и точно передаёт действие.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאָךְ может означать как «ангел», так и «вестник»; в данном рассказе традиционное и естественное основное чтение — «Ангел», а лексическая альтернатива сохранена в сноске. Имя יהוה передано как «Яхве».
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Передаёт не просто повторение, а явно указанное второе действие.
- source_word: וַיִּגַּע בּוֹ
  choice: прикоснулся к нему
  rationale: Точно передаёт נגע с местоименным дополнением; повторность уже выражена словами «во второй раз».
- source_word: קוּם אֱכֹל
  choice: Встань и поешь
  rationale: Современная естественная русская формулировка двух повелений без архаического оттенка.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для повеления; «ведь» естественно связывает причину с предшествующей прямой речью.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: путь тебе не под силу
  rationale: Еврейское выражение буквально представляет путь как чрезмерный, превосходящий силы Илии. Русская идиома сохраняет смысл превышения возможностей, не сводя его только к расстоянию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; форма «Яхве» передаёт личное заветное имя и соответствует заданному принципу перевода.
- issue: Значение מַלְאָךְ в выражении מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  alternative: вестник Яхве
  rationale: Контекст допускает базовое значение «вестник», но речь идёт о небесном посланнике, поэтому в основном тексте выбрано привычное «Ангел»; подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Формулировка «путь тебе не под силу» естественна для широкого круга читателей и не уточняет сверх текста, идёт ли речь исключительно о длине, трудности или требуемых силах.
