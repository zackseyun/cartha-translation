source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: ru
  text: 'И будет так: того, кто спасётся от меча Азаила, предаст смерти Ииуй, а того, кто спасётся от меча Ииуя, предаст смерти Елисей[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убьёт». Еврейский глагол употреблён в каузативной форме — буквально «причинит смерть». В данном контексте это может означать как непосредственное действие Елисея, так и суд, осуществлённый через его пророческое служение.'
    reason: Лексическая альтернатива и сохранение неоднозначности относительно способа действия Елисея.
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Формульное выражение вводит объявленный будущий исход. Такой перевод сохраняет связь с еврейской конструкцией и естественно звучит по-русски.
- source_word: הַנִּמְלָט / וְהַנִּמְלָט
  choice: того, кто спасётся / а того, кто спасётся
  rationale: Субстантивированное причастие имеет обобщённое значение. Конструкция «того, кто» ясно и естественно передаёт его в современном русском языке.
- source_word: מֵחֶרֶב
  choice: от меча
  rationale: Сохранён буквальный образ меча, который здесь обозначает смертоносное вооружённое действие или суд.
- source_word: חֲזָאֵל
  choice: Азаил
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: יָמִית
  choice: предаст смерти
  rationale: Форма хифиль от מות имеет каузативное значение. «Предаст смерти» передаёт причинение смерти и сохраняет более выраженный агентный оттенок, чем нейтральное «умрёт».
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Участие Елисея в исполнении смертного приговора
  choice: Сохранено прямое утверждение, что Елисей предаст смерти спасшегося от меча Ииуя.
  alternative: Понимать это как суд, совершаемый посредством пророческого слова или служения Елисея, а не обязательно как совершённое им лично убийство.
  rationale: Еврейский синтаксис прямо и параллельно называет Азаила, Ииуя и Елисея исполнителями смертоносного суда. Основной текст не смягчает эту формулировку, а возможное опосредованное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух частей стиха сохранён; имена переданы в устоявшихся русских библейских формах.
