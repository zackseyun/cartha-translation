  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: ru
  text: 'И лёг он и уснул под кустом дрока. И вот, ангел[a] коснулся его и сказал ему: «Встань, поешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник». Еврейское слово מַלְאָךְ может обозначать как человеческого посланника, так и ангела; здесь контекст указывает скорее на ангела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: И лёг он и уснул
  rationale: Последовательные формы повествования передают два простых действия. Такой порядок слов сохраняет достоинство библейского рассказа и естественно звучит по-русски.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: под одним ракитовым кустом
  rationale: רֹתֶם обозначает пустынный кустарник Retama raetam, традиционно называемый по-русски ракитовым кустом; אֶחָד здесь можно сохранить как «одним», не придавая ему особого смыслового акцента.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Выражение вводит неожиданное и яркое развитие событий; «И вот» сохраняет повествовательную силу и остаётся естественным в современном литературном русском.
- source_word: מַלְאָךְ
  choice: ангел
  rationale: Слово может означать как посланника, так и ангела. Последующий контекст сверхъестественной помощи благоприятствует значению «ангел», а иной вариант отмечен в сноске.
- source_word: נֹגֵעַ בּוֹ
  choice: коснулся его
  rationale: Причастие описывает прикосновение; в русском повествовании естественно передать его глаголом совершенного вида.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Сохранены и повествовательная связь, и явно выраженное дополнение «ему».
- source_word: קוּם אֱכֹל
  choice: Встань, поешь
  rationale: Два кратких повеления переданы естественно и непосредственно. «Поешь» в данном контексте звучит по-русски естественнее голого «ешь» и не добавляет существенного нового содержания.
theological_decisions:
- issue: Следует ли переводить מַלְאָךְ как «ангел» или «посланник»
  choice: ангел
  alternative: посланник
  rationale: Само слово допускает оба значения, однако контекст сверхъестественной помощи в пустыне указывает на ангельское существо. Лексическая неоднозначность не устраняется и указана в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Частица «вот» сохраняет выразительность исходного повествования; архаизмы вроде «возстань» или чрезмерно книжное «се» не используются.
