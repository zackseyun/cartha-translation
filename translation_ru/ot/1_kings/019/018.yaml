  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: ru
  text: Но Я сохранил[a] в Израиле семь тысяч — все колени, которые не преклонились перед Ваалом, и все уста, которые не целовали его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я оставил в Израиле семь тысяч».'
    reason: lexical_alternative
  - marker: b
    text: Поцелуй, обращённый к идолу, был знаком почитания и поклонения.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Но Я оставлю
  rationale: Порода hифиль глагола שׁאר означает «оставить, сохранить как остаток». В данном контексте перфект с союзом может обозначать предстоящее действие в продолжение слов о том, что произойдёт; поэтому выбран русский будущий вид. Союз передан как «но», поскольку ответ Бога противопоставлен жалобе Илии. Значение «для Себя» прямо в масоретском тексте не выражено и потому в основной текст не добавлено.
- source_word: בְיִשְׂרָאֵל
  choice: в Израиле
  rationale: Естественная передача обстоятельства места.
- source_word: שִׁבְעַת אֲלָפִים
  choice: семь тысяч
  rationale: Обычная русская передача еврейской конструкции с количественным числительным.
- source_word: כָּל הַבִּרְכַּיִם
  choice: все колени
  rationale: Сохранён конкретный телесный образ и собирательное выражение оригинала; речь метонимически идёт о людях.
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: которые не преклонялись перед Ваалом
  rationale: Глагол כּרע обозначает преклонение колен, а в данном контексте — поклонение и подчинение. Русское «преклоняться перед» естественно передаёт направленность этого действия.
- source_word: הַבַּעַל
  choice: Ваалом
  rationale: Несмотря на артикль в еврейском тексте, в русском языке имя этого божества обычно употребляется без него.
- source_word: וְכָל הַפֶּה
  choice: и все уста
  rationale: Собирательное единственное число передано множественным «все уста», что сохраняет телесный образ и параллелизм с «все колени».
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: которые не целовали его
  rationale: Сохранены буквальный образ поцелуя и местоимение оригинала; его antecedent — Ваал. Множественное число согласовано с русским словом «уста».
theological_decisions:
- issue: Высказывание о сохранённом остатке без внесения поздней богословской терминологии
  choice: Я оставлю в Израиле семь тысяч
  alternative: Я сохранил для Себя в Израиле семь тысяч
  rationale: Основной текст передаёт действие Бога, но не добавляет отсутствующее в масоретском тексте «для Себя» и не вводит специальный термин «остаток». Временная неоднозначность формы отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены параллельные телесные образы «колени» и «уста»; синтаксис упрощён лишь настолько, чтобы фраза была понятна обычному читателю.
