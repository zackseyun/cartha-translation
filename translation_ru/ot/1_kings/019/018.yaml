  rationale: Исправлены временная форма главного глагола и вид первой относительной глагольной формы для более точной передачи еврейских перфектов. Телесные образы, имя Ваала, местоименная отсылка «его» и культурная сноска сохранены. «Для Себя» не добавлено, поскольку в еврейской формулировке оно не выражено явно.
