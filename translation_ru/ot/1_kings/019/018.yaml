  source_fidelity: 'В основном текст точно передаёт образный параллелизм и культовый контекст. Однако וְהִשְׁאַרְתִּי — перфект 1-го лица («Я оставил / сохранил»); в данном контексте его естественнее передать русским прошедшим временем, а не будущим «оставлю». Добавление «для Себя» в основной текст не обязательно: оно не выражено отдельным словом в масоретском тексте.'
  naturalness: «Все колени» и «все уста» — несколько возвышенные, но понятные и уместные для современного литературного библейского русского. Прошедшие формы «не преклонились» и «не целовали» лучше согласуются с еврейскими перфектами и с русским синтаксисом.
  terminology: «Ваал» — нормативная передача имени. «Преклониться перед Ваалом» точно выражает жест поклонения. Сноска о поцелуе как знаке почитания полезна и не навязывает конфессионального истолкования.
