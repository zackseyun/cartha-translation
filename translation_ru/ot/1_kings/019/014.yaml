source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: ru
  text: 'Он сказал: «Я пламенно ревновал[a] о Яхве, Боге Воинств, потому что сыны Израиля оставили Твой завет, разрушили Твои жертвенники и убили Твоих пророков мечом. Я один остался, и они ищут моей жизни[b], чтобы отнять её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я чрезвычайно ревновал». В еврейском тексте инфинитив абсолютный употреблён вместе с личной формой того же глагола, усиливая высказывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «ищут моей жизни, чтобы отнять её» означает: «пытаются меня убить».'
    reason: idiom_explanation
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Я пламенно ревновал
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает значение. «Пламенно ревновал» естественно передаёт напряжённую преданность Илии и сохраняет библейское понятие ревности без оттенка зависти.
- source_word: לַיהוָה
  choice: о Яхве
  rationale: Предлог ל указывает на предмет ревности; личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Боге Воинств
  rationale: Титул сохраняет широкое значение צבאות и не ограничивает его только земными или только небесными силами.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение ревности Илии; «потому что» ясно выражает причинную связь.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: оставили Твой завет
  rationale: עזב означает оставить или покинуть; в сочетании с «заветом» эта формулировка естественна и сохраняет тяжесть нарушения отношений с Богом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт корпоративное и заветное наименование народа, оставаясь понятным в возвышенном повествовательном регистре.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: разрушили Твои жертвенники
  rationale: הרס обозначает разрушение или снос сооружения; русский глагол точно и естественно передаёт действие.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: убили Твоих пророков мечом
  rationale: Сохранены прямое значение глагола и инструментальная конкретность оборота בֶחָרֶב.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Я один остался
  rationale: Краткая естественная конструкция сохраняет подчёркнутое ощущение одиночества Илии.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי
  choice: они ищут моей жизни
  rationale: Сохранён близкий к форме источника идиоматический оборот, означающий намерение убить; примечание разъясняет смысл.
- source_word: לְקַחְתָּהּ
  choice: чтобы отнять её
  rationale: Местоимение относится к «жизни», а инфинитив выражает цель поисков.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено заветное имя Бога; транслитерация сохраняет различие между личным именем и титулом.
- issue: Передача אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  alternative: Бог Саваоф; Бог небесных воинств
  rationale: «Воинств» сохраняет семантическую широту титула, тогда как добавление «небесных» разрешило бы неоднозначность, отсутствующую в источнике.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранено буквальное заветно-родовое обозначение без сведения его к отдельным мужчинам; более идиоматический вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Формула «сыны Израиля» и титул «Бог Воинств» сохранены ради заветного и образного характера источника; синтаксис при этом сделан ясным для современного читателя.
