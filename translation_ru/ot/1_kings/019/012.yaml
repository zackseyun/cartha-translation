base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: ru
  text: И после землетрясения — огонь; Яхве не был в огне. И после огня — звук тонкой тишины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тихий, едва слышный голос», «лёгкий шёпот». Буквально еврейское выражение означает «звук тонкой тишины»; это намеренно необычная и трудная для однозначного истолкования фраза.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר
  choice: И после
  rationale: Сохраняет последовательность явлений и сочинительную связь еврейского повествования.
- source_word: הָרַעַשׁ
  choice: землетрясения
  rationale: רַעַשׁ обозначает сильное сотрясение и в данном контексте естественно понимается как землетрясение.
- source_word: אֵשׁ
  choice: огонь
  rationale: Передаёт следующее явление в ряду; русскому языку не требуется неопределённый артикль.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: но Яхве не был в огне
  rationale: Предлог ב передан локативно как «в» без уточнения характера Божьего присутствия; «но» естественно выражает подразумеваемое противопоставление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: קוֹל
  choice: звук
  rationale: Сохраняет неоднозначность между звуком и голосом и не вводит прямую речь, которой в еврейском тексте нет.
- source_word: דְּמָמָה
  choice: тишины
  rationale: Передаёт значение тишины, безмолвия или покоя и сохраняет парадоксальное сочетание со словом «звук».
- source_word: דַקָּה
  choice: тонкой
  rationale: Буквально передаёт значение «тонкая, едва уловимая» и сохраняет намеренно необычный образ оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Передача выражения קוֹל דְּמָמָה דַקָּה
  choice: звук тонкой тишины
  alternative: тихий, едва слышный голос; лёгкий шёпот
  rationale: Основной текст сохраняет лексическую напряжённость и неоднозначность трудного еврейского выражения, не превращая звук однозначно в речь или шёпот.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Тире передаёт сжатость перечисления в еврейском тексте; необычное выражение «звук тонкой тишины» сознательно сохранено и пояснено сноской.
