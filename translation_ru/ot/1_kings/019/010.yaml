source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: ru
  text: 'И сказал он: «Я пламенно ревновал о Яхве[a], Боге Воинств, потому что сыны Израиля оставили Твой завет, разрушили Твои жертвенники и убили Твоих пророков мечом. Я один остался, и они ищут моей жизни[b], чтобы отнять её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; здесь оно передано как «Яхве».
    reason: alternative_reading
  - marker: b
    text: 'Букв.: «ищут моей жизни, чтобы взять её»; то есть хотят убить меня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: я пламенно ревновал
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает высказывание. «Пламенно ревновал» естественно передаёт сильную, деятельную преданность, не сводя её к зависти.
- source_word: לַיהוָה
  choice: о Яхве
  rationale: Предлог ל при глаголе קנא обозначает того, ради кого или о ком проявляется ревность; личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Боге Воинств
  rationale: צְבָאוֹת означает «воинства, сонмы, армии». Традиционно возвышенное «Бог Воинств» сохраняет образ исходного титула и не подменяет его иным титулом вроде «Всемогущий».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание жалобы Илии и в современном русском ясно передаёт причинную связь.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: оставили Твой завет
  rationale: עָזַב значит «оставлять, покидать, отвергать». «Оставили» точно и естественно передаёт нарушение отношений завета.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Буквальное выражение обозначает народ Израиля в целом. «Сыны Израиля» сохраняет форму и торжественный регистр оригинала.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: разрушили Твои жертвенники
  rationale: הָרַס обозначает разрушение или снос сооружения; «разрушили» ясно и непосредственно подходит к жертвенникам.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: убили Твоих пророков мечом
  rationale: Сохранены прямое значение глагола и конкретное указание на орудие убийства.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: я один остался
  rationale: Фраза подчёркивает, что Илия считает себя единственным уцелевшим; русская конструкция сохраняет этот акцент без неестественного повтора.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי
  choice: они ищут моей смерти
  rationale: Буквально выражение говорит, что они «ищут мою жизнь/душу», но идиоматически означает намерение убить. «Ищут моей смерти» естественно сохраняет угрозу жизни.
- source_word: לְקַחְתָּהּ
  choice: чтобы отнять у меня жизнь
  rationale: Женский суффикс отсылает к נַפְשִׁי. Повтор слова «жизнь» в русском устраняет неясное местоимение и передаёт намерение лишить Илию жизни.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, а не титул אֲדֹנָי. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер ревности Илии
  choice: пламенно ревновал о Яхве
  alternative: был крайне ревнив к Яхве
  rationale: Контекст говорит о ревностной преданности Богу и Его завету, а не о зависти или подозрительности. При этом глагол «ревновал» сохраняет библейскую напряжённость понятия ревности.
- issue: Заявление Илии о своём одиночестве
  choice: я один остался
  alternative: я один из пророков остался
  rationale: Оригинал не добавляет «из пророков» и не уточняет сферу утверждения. Перевод сохраняет широкую формулировку Илии, не согласовывая её заранее с последующим Божьим ответом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Обращённые к Богу местоимения написаны с прописной буквы. Синтаксический параллелизм жалобы сохранён; архаизмы сведены к содержательно оправданному выражению «Бог Воинств» и формуле «сыны Израиля».
