base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: ru
  text: Он встал, поел и попил и, набравшись сил от той пищи[a], шёл сорок дней и сорок ночей до Хорива, горы Божьей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в силе той пищи»; то есть благодаря силе, полученной от съеденной пищи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Он встал
  rationale: Форма повествовательной последовательности от קום означает «встать, подняться». «Встал» естественно для современного русского рассказа и точно передаёт действие.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: поел и попил
  rationale: Глаголы אכל и שׁתה обозначают простые последовательные действия. Совершенный вид передаёт завершённость; приставочные формы звучат по-русски естественнее нейтральных, но в данном контексте несколько книжных «ел и пил».
- source_word: וַיֵּלֶךְ
  choice: шёл
  rationale: הלך в контексте длительности обозначает путь. «Шёл» сохраняет простой смысл глагола, не уточняя способ передвижения и не добавляя значения организованного путешествия.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: подкрепившись той пищей
  rationale: Буквально выражение говорит о силе, полученной от той еды. Русская конструкция естественно передаёт питание как источник сил, не сводя אֲכִילָה непременно к формальной трапезе.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: сорок дней и сорок ночей
  rationale: Точная и традиционная передача еврейского выражения длительности.
- source_word: עַד
  choice: до
  rationale: Предлог обозначает конечную точку пути; русское «до» здесь естественнее, чем временное «пока не».
- source_word: הַר הָאֱלֹהִים
  choice: Божьей горы
  rationale: Сопряжённое сочетание буквально означает «гора Бога». «Божья гора» сохраняет принадлежность и торжественное библейское обозначение, оставаясь естественным современным русским выражением.
- source_word: חֹרֵב
  choice: Хорива
  rationale: Имя места передано в принятой русской библейской форме и поставлено в родительный падеж после предлога «до».
theological_decisions:
- issue: Значение הָאֱלֹהִים в выражении הַר הָאֱלֹהִים
  choice: Божьей
  alternative: божественной
  rationale: В устойчивом обозначении Хорива речь идёт о горе Бога Израиля, а не просто о горе с отвлечённым качеством божественности. Перевод сохраняет личную отнесённость без дополнительных богословских пояснений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Последовательность коротких действий сохранена; неестественно буквальное выражение о «силе еды» передано идиоматически, а его форма отмечена в сноске.
