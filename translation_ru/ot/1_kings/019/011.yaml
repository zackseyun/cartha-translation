  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: ru
  text: 'И Он сказал: «Выйди и встань на горе перед Яхве». И вот, Яхве проходил мимо, а сильный и могучий ветер разрушал горы и сокрушал скалы перед Яхве; но Яхве не был в ветре[a]. После ветра произошло землетрясение, но Яхве не был в землетрясении[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Яхве не в ветре». Это может означать, что Яхве не открывался в нём, однако перевод сохраняет буквальную и намеренно неоднозначную формулировку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Яхве не в землетрясении». Повествование не уточняет точный смысл этого выражения; перевод сохраняет его локативную формулировку и не отрицает власти Яхве над происходящим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: צֵא
  choice: выйди
  rationale: Императив יצא обозначает выход Илии из места, где он находился; «выйди» естественно и точно передаёт направление движения.
- source_word: וְעָמַדְתָּ
  choice: и стань
  rationale: Глагол עמד здесь имеет прямое пространственное значение и не требует дополнительного усиления.
- source_word: בָהָר
  choice: на горе
  rationale: Предлог ב в данном пространственном контексте естественно передаётся по-русски сочетанием «на горе».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет пространственный и одновременно торжественный оттенок буквального выражения «перед лицом Яхве» без излишнего развёртывания.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательную и драматизирующую функцию הִנֵּה в повествовании.
- source_word: עֹבֵר
  choice: проходил мимо
  rationale: Причастная форма изображает действие как происходящее в этот момент; несовершенный вид сохраняет эту длительность.
- source_word: רוּחַ
  choice: ветер
  rationale: Разрушительное воздействие на горы и скалы ясно указывает здесь на природное явление, а не на «дух».
- source_word: גְּדוֹלָה וְחָזָק
  choice: великий и сильный
  rationale: Оба определения переданы раздельно, что сохраняет еврейское усиление; «великий» поддерживает возвышенный, но понятный регистр.
- source_word: מְפָרֵק הָרִים
  choice: раздирал горы
  rationale: Передаёт насильственное разрушительное действие причастия פרק и его продолжающийся характер в сцене.
- source_word: וּמְשַׁבֵּר סְלָעִים
  choice: и сокрушал скалы
  rationale: Сохраняет параллелизм двух причастных действий и образ дробления твёрдых скал.
- source_word: רַעַשׁ
  choice: землетрясение
  rationale: В последовательности природных явлений רַעַשׁ наиболее естественно обозначает сотрясение земли.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя; транслитерация «Яхве» сохраняет это отличие и не подменяет имя титулом.
- issue: Смысл выражений לֹא בָרוּחַ יְהוָה и לֹא בָרַעַשׁ יְהוָה
  choice: «не в ветре был Яхве» и «не в землетрясении был Яхве»
  alternative: «Яхве не являлся в ветре / землетрясении»; «Яхве не присутствовал в ветре / землетрясении»
  rationale: Локативное «в» сохранено без истолкования. Текст не объясняет точный характер отсутствия Яхве в этих явлениях и не отрицает Его власти над ними.
- issue: Соотношение прохождения Яхве и природных явлений
  choice: 'Сохранена последовательность: Яхве проходит мимо, а ветер действует пред Ним'
  alternative: Представить ветер как само явление Яхве
  rationale: 'Так сохраняется напряжение исходного повествования: разрушительный ветер идёт пред Яхве, однако Яхве не находится в ветре.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «пред Яхве», «И вот» и «сокрушал» поддерживают достоинство повествования, оставаясь понятными современному читателю. Инверсия «не в ветре был Яхве» сохраняет акцент исходного текста на природном явлении и его богословскую неоднозначность.
