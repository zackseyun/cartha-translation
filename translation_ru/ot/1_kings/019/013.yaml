  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: ru
  text: 'Когда Илия услышал это[a], он закрыл лицо плащом, вышел и встал у входа в пещеру. И вот к нему обратился голос: «Что ты здесь делаешь[b], Илия?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте дополнение к глаголу «услышал» не названо; из контекста ясно, что речь идёт о непосредственно предшествующем звуке или голосе.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Что тебе здесь?» Еврейская идиома спрашивает, какое дело или намерение привело Илию в это место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: когда ... услышал это
  rationale: Предлог כְּ с инфинитивом образует временное придаточное. Дополнение в еврейском тексте не выражено; местоимение «это» естественно по-русски отсылает к непосредственно предшествующему событию, не уточняя, был ли это звук или голос.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: он закутал лицо своим плащом
  rationale: Глагол передаёт плотное укрывание или обёртывание, פָּנָיו означает лицо, а אַדֶּרֶת — верхнюю одежду, плащ или мантию. «Закутал лицо своим плащом» ясно и естественно описывает действие.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: вышел и встал
  rationale: Сохранена последовательность простых повествовательных действий исходного текста.
- source_word: פֶּתַח הַמְּעָרָה
  choice: у входа в пещеру
  rationale: פֶּתַח обозначает отверстие или вход. Русское «у входа в пещеру» естественно передаёт место, где остановился Илия.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: 'Сочетание сохраняет функцию הִנֵּה: оно живо вводит новое явление, не добавляя обязательного оттенка внезапности.'
- source_word: אֵלָיו קוֹל וַיֹּאמֶר
  choice: к нему обратился голос
  rationale: Буквально перед нами безглагольная конструкция «к нему — голос», за которой следует «и сказал». В русском «к нему обратился голос» естественно объединяет появление голоса и его обращение к Илии.
- source_word: מַה לְּךָ פֹה
  choice: Что ты здесь делаешь
  rationale: Еврейская идиома спрашивает, какое дело или намерение привело человека в это место. Этот перевод передаёт её шире и естественнее, чем более узкое «Почему ты здесь?».
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Невыраженное дополнение при «услышал»
  choice: услышал это
  alternative: услышал звук; услышал голос; услышал
  rationale: Исходный текст не называет объект глагола. Нейтральное «это» делает русскую фразу естественной, но не решает однозначно, относится ли она к звуку или голосу предыдущего стиха.
- issue: Смысл вопроса מַה לְּךָ פֹה
  choice: Что ты здесь делаешь?
  alternative: Почему ты здесь?; Что тебе здесь?
  rationale: Выбранный вариант сохраняет вопрос о присутствии, деле или цели Илии и не сужает его исключительно до причины.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным для обычного читателя; традиционная форма имени «Илия» сохранена. Частица «И вот» передаёт повествовательную выразительность הִנֵּה без добавления отсутствующей в оригинале внезапности.
