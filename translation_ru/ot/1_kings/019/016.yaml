  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: ru
  text: И Ииуя, сына Нимши, помажь царём над Израилем, а Елисея, сына Шафата, из Авел-Мехолы помажь пророком на твоё место[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после тебя» или «вместо тебя»; еврейское выражение может обозначать как преемство, так и замещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: помажь
  rationale: Форма Qal imperfect 2 м. ед. в данном контексте выражает повеление. Русский императив естественно и ясно передаёт поручение.
- source_word: לְמֶלֶךְ
  choice: царём
  rationale: Предлог לְ обозначает назначение на должность; русский творительный предикативный естественно передаёт смысл «поставить царём».
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: עַל при обозначении царской власти указывает на народ, над которым поставлен правитель.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Ииуя, сына Нимши
  rationale: Использованы традиционные русские формы библейских имён; בֶן передано словом «сын» с требуемым русским падежным согласованием.
- source_word: אֱלִישָׁע בֶּן שָׁפָט
  choice: Елисея, сына Шафата
  rationale: Сохранено патронимическое обозначение оригинала в естественной русской форме.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: из Авел-Мехолы
  rationale: Предлог מִן обозначает происхождение из местности; «из» естественно передаёт место, откуда был Елисей.
- source_word: לְנָבִיא
  choice: пророком
  rationale: Назначение на служение передано русским творительным падежом, как и назначение царём.
- source_word: תַּחְתֶּיךָ
  choice: на твоё место
  rationale: Выражение передаёт замещение или преемство, не сводя смысл исключительно к хронологическому «после тебя» либо к более резкому «вместо тебя».
- source_word: וְאֵת ... וְאֶת
  choice: И ... а
  rationale: Первое וְ сохраняет связь с предыдущим контекстом, а «а» естественно соединяет два параллельных поручения; показатели прямого дополнения אֵת отдельно не переводятся.
theological_decisions:
- issue: Отношение служения Елисея к служению Илии в выражении תַּחְתֶּיךָ
  choice: «на твоё место» — назначение Елисея преемником Илии
  alternative: «после тебя» в хронологическом смысле или «вместо тебя» с усиленным оттенком замещения
  rationale: Основной перевод сохраняет идею передачи пророческого служения и не уточняет сверх текста, было ли это прежде всего хронологическим преемством или немедленным замещением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Императивы делают поручение ясным, традиционные формы имён обеспечивают узнаваемость, а синтаксис остаётся естественным для современного читателя.
