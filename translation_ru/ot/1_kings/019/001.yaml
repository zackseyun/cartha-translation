base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: ru
  text: Ахав рассказал Иезавели обо всём, что сделал Илия, и о том, как он убил мечом всех пророков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: рассказал
  rationale: Естественно передаёт значение глагола «сообщил, поведал» в повествовательном контексте.
- source_word: וְאֵת כָּל אֲשֶׁר הָרַג
  choice: и о том, как он убил
  rationale: Передаёт второе дополнение при глаголе сообщения и сохраняет мужской род подлежащего, который в ближайшем контексте относится к Илии.
- source_word: בֶּחָרֶב
  choice: мечом
  rationale: Прямое и устойчивое соответствие инструментальному значению еврейского выражения.
theological_decisions:
- issue: Кто убил пророков
  choice: Местоимение «он» естественно отнесено к Илии.
  alternative: Понять субъектом Ахава или оставить связь более неясной.
  rationale: Грамматика и предшествующее повествование (3 Цар. 18:40) указывают на Илию; при этом перевод не добавляет его имя повторно.
- issue: Кого обозначают «все пророки»
  choice: Сохранено обобщённое «всех пророков» без поясняющей вставки.
  alternative: 'Уточнить в тексте: «всех пророков Ваала».'
  rationale: В данном стихе еврейский текст говорит только «всех пророков»; конкретизация ясна из контекста, но не должна вноситься непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза ясная и dignified, без архаизмов. Конструкция «о том, как» устраняет неестественную буквальность, не меняя смысла исходного синтаксиса.
