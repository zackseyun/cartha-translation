  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: ru
  text: 'А сам он прошёл по пустыне день пути, затем пришёл и сел под ракитником[a]. Он попросил себе смерти и сказал: «Довольно! Теперь, Яхве, возьми мою жизнь, ведь я не лучше моих предков».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под кустом ракитника». Рֹתֶם — пустынный кустарник, а не крупное дерево.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: прошёл по пустыне день пути
  rationale: Сочетание דֶּרֶךְ יוֹם обозначает путь, преодолённый за один день; предложная форма בַּמִּדְבָּר указывает на движение по пустынной местности.
- source_word: רֹתֶם אַחַת
  choice: ракитник
  rationale: רֹתֶם — пустынный кустарник, обычно отождествляемый с ретамой (ракитником). В русском языке существительное в единственном числе естественно передаёт неопределённое אַחַת без тяжеловесного «одним».
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: он попросил себе смерти
  rationale: Еврейское выражение означает просьбу о собственной смерти. Русская формулировка передаёт смысл ясно, не превращая נֶפֶשׁ в отдельную от человека «душу».
- source_word: רַב עַתָּה
  choice: Довольно! Теперь
  rationale: רַב здесь является кратким возгласом «довольно», а עַתָּה сохраняет срочность последующей просьбы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: קַח נַפְשִׁי
  choice: возьми мою жизнь
  rationale: В контексте просьбы о смерти נֶפֶשׁ означает жизнь самого Илии; «жизнь» естественнее и точнее, чем «душу».
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: ведь я не лучше моих предков
  rationale: Сравнительная конструкция טוֹב ... מִן означает «лучше, чем». אֲבֹתָי здесь естественно понимать как предков или отцов прежних поколений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст сохраняет личное имя Бога, к которому непосредственно обращается Илия, не подменяя его титулом.
- issue: Значение נֶפֶשׁ в просьбе Илии
  choice: жизнь
  alternative: душа
  rationale: Контекст однозначно касается смерти Илии; перевод «жизнь» не вносит в текст позднейшего антропологического противопоставления души и тела.
translation_notes:
  register: Современный литературный русский язык с краткой, эмоционально напряжённой прямой речью. Синтаксис сохраняет последовательность еврейского повествования, но избегает неестественных буквализмов и архаизмов.
