lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Он посмотрел
  rationale: Глагол נבט обозначает направленный взгляд; нейтральное «посмотрел» передаёт действие, не добавляя отсутствующего в тексте направления.
- source_word: וְהִנֵּה
  choice: — и вот
  rationale: Частица הִנֵּה привлекает внимание к увиденному и придаёт повествованию живость; «и вот» естественно сохраняет эту функцию в современном русском.
- source_word: מְרַאֲשֹׁתָיו
  choice: у его изголовья
  rationale: Слово обозначает место у головы лежащего человека. «У его изголовья» точно и естественно соответствует сцене.
- source_word: עֻגַת רְצָפִים
  choice: лепёшка, испечённая на раскалённых камнях
  rationale: עֻגָה — круглая хлебная лепёшка, а רְצָפִים, вероятно, означает нагретые камни для выпечки. Перевод передаёт предмет и предполагаемый способ приготовления, сохраняя иной вариант в сноске.
- source_word: וְצַפַּחַת מָיִם
  choice: и стоял кувшин с водой
  rationale: צַפַּחַת — небольшой сосуд, кувшин или фляга. «Кувшин с водой» ясно и естественно; добавленный по требованиям русского синтаксиса глагол согласован с описанием расположенных у изголовья припасов.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Он поел, попил
  rationale: Парные повествовательные формы передают последовательные простые действия. Совершенные глаголы «поел, попил» естественно звучат в данном контексте.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: и снова лёг
  rationale: Сочетание שׁוּב с глаголом «лежать/ложиться» означает повторение действия. «Снова лёг» точно передаёт смысл без буквального и неестественного «вернулся и лёг».
