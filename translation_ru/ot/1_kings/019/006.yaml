  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: ru
  text: Он посмотрел — и вот, у его изголовья лежала лепёшка, испечённая на раскалённых камнях[a], и стоял кувшин с водой. Он поел, попил и снова лёг.
