  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: ru
  text: Он увидел, встал и отправился спасать свою жизнь. Он пришёл в Вирсавию, что в Иудее, и оставил там своего слугу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Увидев это
  rationale: Масоретский текст буквально говорит «и увидел», не уточняя объект. Русское «увидев это» сохраняет зрительное значение и естественно отсылает к предшествующей угрозе, не вводя отсутствующее в тексте «испугался».
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: спасая свою жизнь, отправился в путь
  rationale: Идиома обозначает уход ради сохранения собственной жизни. Такой перевод передаёт смысл естественным современным русским языком, сохраняя мотив бегства от смертельной опасности.
- source_word: בְּאֵר שֶׁבַע
  choice: Вирсавию
  rationale: Использована укоренившаяся русская библейская форма географического названия Беэр-Шева.
- source_word: נַעֲרוֹ
  choice: своего слугу
  rationale: В данном повествовательном контексте נַעַר обозначает сопровождающего слугу, а не просто юношу.
theological_decisions:
- issue: Причина ухода Илии
  choice: Сохранено «увидев», без замены на «испугался»
  alternative: «Он испугался» по древним версиям и возможной иной огласовке
  rationale: Представленный WLC читает וַיַּרְא («и увидел»). Перевод не подменяет это чтение психологическим утверждением, хотя контекст показывает угрозу его жизни.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Последовательность кратких еврейских глагольных форм слегка сглажена ради естественного русского синтаксиса без утраты событий.
