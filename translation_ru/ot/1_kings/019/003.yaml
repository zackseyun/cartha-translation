  verdict: revise
  source_fidelity: 'В масоретском тексте последовательно стоят: «увидел», «встал», «пошёл ради своей жизни», «пришёл в Вирсавию, которая [принадлежит] Иудее», «оставил там своего слугу». Черновик верно передаёт общий ход и не заменяет «увидел» на интерпретационное «испугался», однако «это» вводит объект, которого еврейский текст не называет.'
  naturalness: Текст в целом современный и гладкий. Прямое «Он увидел, встал...» несколько более сжато, но для библейского повествования естественно и позволяет не конкретизировать, что именно он увидел. «Отправился спасать свою жизнь» ясно передаёт идиому без избыточного «в путь».
  terminology: «Вирсавия» — традиционная русская библейская форма Беэр-Шевы. «Слуга» уместно передаёт נער в данном контексте. Формула «что в Иудее» приемлемо передаёт אשר ליהודה, хотя буквально речь о принадлежности Иудее.
