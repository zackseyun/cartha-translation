base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: ru
  text: И он возвратился от него, взял пару волов и принёс их в жертву. Он развёл огонь из воловьего снаряжения[a], сварил мясо, раздал его людям, и они ели. Потом он встал, пошёл за Илиёй и служил ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из упряжи волов»; букв. «из принадлежностей (орудий) волов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: И он возвратился от него
  rationale: Еврейское выражение буквально означает «возвратился от следования за ним». В контексте Елисей возвращается от Илии к волам и людям; краткое русское выражение естественно передаёт направление, не утверждая, что он отказался следовать за Илиёй.
- source_word: צֶמֶד הַבָּקָר
  choice: пару волов
  rationale: צֶמֶד обозначает пару, обычно соединённую ярмом. Поскольку далее эта пара становится объектом заклания, «пара волов» яснее, чем «ярмо волов».
- source_word: וַיִּזְבָּחֵהוּ
  choice: принёс их в жертву
  rationale: זבח обычно обозначает жертвенное заклание. Перевод сохраняет жертвенный оттенок, но не уточняет адресата или обрядовые обстоятельства, которых текст не называет.
- source_word: וּבִכְלִי הַבָּקָר
  choice: на упряжи волов
  rationale: כְּלִי — широкое обозначение орудий или принадлежностей. В данном контексте имеются в виду деревянные части воловьей упряжи, использованные как топливо; «на упряжи» звучит по-русски естественно, а примечание сохраняет лексическую широту.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: он сварил мясо
  rationale: בשל может означать «варить» или шире «готовить». «Сварил мясо» близко к обычному значению и естественно для современного русского языка.
- source_word: לָעָם
  choice: раздал людям
  rationale: עם здесь обозначает собравшихся местных людей. «Людям» прямо и нейтрально передаёт смысл без добавления отсутствующего в тексте уточнения.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: пошёл за Илиёй
  rationale: Формально сохраняет пространственный образ «идти за» и его связь с предшествующим движением Елисея.
- source_word: וַיְשָׁרְתֵהוּ
  choice: стал служить ему
  rationale: שרת обозначает служение, нередко исполнение обязанностей помощника. «Стал служить ему» сохраняет широкий смысл, не сводя роль Елисея только к бытовому прислуживанию.
theological_decisions:
- issue: Следует ли передавать זבח явно жертвенным языком
  choice: «принёс их в жертву»
  alternative: «заколол их»
  rationale: Глагол несёт жертвенный оттенок, который важно сохранить. При этом перевод не определяет вид жертвы и не сообщает, кому именно она была принесена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным регистром. Цепь действий передана ясно и последовательно; избегаются как архаизмы, так и разговорные выражения.
