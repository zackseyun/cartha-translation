base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: ru
  text: 'Он пришёл туда, к пещере, и заночевал там. И вот, слово Яхве обратилось к нему: «Что ты здесь делаешь[a], Илия?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему ты здесь, Илия?» Буквально по-еврейски: «Что тебе здесь, Илия?»'
    reason: Лаконичная еврейская идиома допускает вопрос как о причине присутствия Илии, так и о том, что он здесь делает.
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: Там он пришёл к пещере
  rationale: Глагол בוא передаёт прибытие, а אֶל — направленность к пещере. Такой перевод сохраняет движение повествования и не уточняет без необходимости, что Илия непременно вошёл внутрь.
- source_word: וַיָּלֶן שָׁם
  choice: и заночевал в ней
  rationale: Глагол לון означает «провести ночь, заночевать». Местоименное «в ней» естественно связывает ночлег с упомянутой пещерой и избегает тяжёлого повтора «там».
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Частица הִנֵּה привлекает внимание к внезапному развитию событий; «и вот» естественно сохраняет эту повествовательную функцию в современном русском языке.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена устойчивая пророческая формула «слово Яхве», а личное имя יהוה передано транслитерацией, а не заменено титулом.
- source_word: וַיֹּאמֶר לוֹ
  choice: двоеточие перед прямой речью
  rationale: В еврейском тексте буквально сказано, что слово обратилось к нему. В русском языке конструкция «пришло слово…:» естественно вводит его содержание и позволяет избежать неуклюжего «слово сказало ему», не меняя источника речи.
- source_word: מַה לְּךָ פֹה
  choice: Что ты здесь делаешь
  rationale: Буквально идиома означает «Что тебе здесь?». В контексте это вопрос о присутствии Илии и его положении; выбранная формулировка естественна и сохраняет более широкий оттенок, чем однозначное «Почему ты здесь?».
- source_word: אֵלִיָּהוּ
  choice: Илия
  rationale: Использована устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Субъект откровения в формуле דְבַר יְהוָה
  choice: к нему пришло слово Яхве
  alternative: Яхве обратился к нему; к нему было слово Господне
  rationale: Выбранная формулировка сохраняет «слово Яхве» как грамматический и богословски значимый элемент пророческой формулы, не подменяя его непосредственным действием Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены повествовательное «и вот», пророческая формула «слово Яхве» и неоднозначность вопроса; архаизмы и конфессионально маркированные замены избегаются.
