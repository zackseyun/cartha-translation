- from: 'Там он пришёл к пещере и заночевал в ней. И вот к нему пришло слово Яхве: «Что ты здесь делаешь[a], Илия?»'
  to: 'Он пришёл туда, к пещере, и заночевал там. И вот, слово Яхве обратилось к нему: «Что ты здесь делаешь[a], Илия?»'
  rationale: Исправленное чтение не утверждает, что Илия ночевал именно внутри пещеры, и избегает добавления глагола «пришло» в пророческую формулу. При этом сохранены движение к пещере, повтор «там», выделительная частица «и вот», личное имя Яхве и широкая, не сведённая только к мотиву, формулировка вопроса.
