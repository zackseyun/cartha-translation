revisions:
- from: 'Тогда Иезавель послала к Илии вестника со словами: «Пусть боги сделают так и прибавят ещё[a], если завтра к этому времени я не сделаю с твоей жизнью то же, что с жизнью одного из них!»'
  to: 'Тогда Иезавель послала к Илии вестника со словами: «Пусть боги так поступят со мной — и ещё хуже, если завтра к этому времени я не сделаю твою жизнь такой же, как жизнь одного из них!»'
  rationale: 'Исправлена только русская идиоматика клятвенной формулы: «со мной» передаёт её неизбежно подразумеваемый самопроклинающий смысл, а «и ещё хуже» — её усиление. Угроза переформулирована так, чтобы сохранить повтор «жизнь» и сравнение с жизнью одного из них, но избежать неестественной и потенциально двусмысленной конструкции «сделать с жизнью».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:02:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Иезавель посылает человеческого вестника Илии и произносит клятвенную угрозу на следующий день. Множественное «боги» обоснованно морфологией глаголов и контекстом; альтернативное единственное значение надлежащим образом отмечено в сноске. Однако русская передача клятвенной формулы нуждается в восполнении подразумеваемого адресата кары («со мной»), без которого она звучит неполно и менее ясно передаёт функцию формулы.'
  naturalness: '«Пусть боги сделают так и прибавят ещё» неестественно по-русски: «сделают так» и особенно «прибавят ещё» остаются без ясного дополнения. Кроме того, «сделаю с твоей жизнью то же, что с жизнью одного из них» тяжеловесно и может ошибочно подразумевать, что Иезавель уже что-либо сделала с этими людьми. Более прямое сравнение самих «жизней» сохраняет еврейский повтор и звучит естественнее.'
  terminology: «Иезавель», «Илия», «вестник», «боги» и «жизнь» выбраны удачно. Сноска должна согласовываться с исправленной, идиоматичной формой клятвы и сохранять альтернативу единственного числа.
  issues:
  - severity: medium
    issue: Неясная русская клятвенная формула
    rationale: В еврейском это устойчивый эллиптический оборот самопроклятия; подразумеваемое «мне» необходимо для естественного современного русского эквивалента, хотя формально не выражено отдельным словом.
  - severity: low
    issue: Тяжеловесная конструкция «сделаю с твоей жизнью то же»
    rationale: Она ослабляет прямое сравнение в оригинале и может создать неверное впечатление, будто Иезавель была действующим лицом в судьбе «одного из них». Формулировка через «сделаю твою жизнь такой же» точнее следует синтаксическому образу текста.
  revised_text: 'Тогда Иезавель послала к Илии вестника со словами: «Пусть боги так поступят со мной — и ещё хуже, если завтра к этому времени я не сделаю твою жизнь такой же, как жизнь одного из них!»'
  revised_footnotes:
