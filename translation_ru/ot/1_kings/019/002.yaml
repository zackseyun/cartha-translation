base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: ru
  text: 'Тогда Иезавель послала к Илии вестника со словами: «Пусть боги так поступят со мной — и ещё хуже, если завтра к этому времени я не сделаю твою жизнь такой же, как жизнь одного из них!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Тогда ... послала
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: מַלְאָךְ
  choice: вестника
  rationale: В придворном контексте речь идёт о человеке-посланце, а не о сверхъестественном ангеле.
- source_word: לֵאמֹר
  choice: со словами
  rationale: Естественная русская формула введения прямой речи.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Пусть боги сделают так и прибавят ещё
  rationale: Передаёт устойчивую формулу клятвы с призыванием усиленного возмездия, не добавляя отсутствующего в еврейском тексте «мне».
- source_word: אֱלֹהִים
  choice: боги
  rationale: Множественные формы глаголов יַעֲשׂוּן и יוֹסִפוּן и контекст речи Иезавели поддерживают множественное значение; неоднозначность отмечена в сноске.
- source_word: כִּי
  choice: если
  rationale: В составе клятвенной формулы вводит условие, при неисполнении которого говорящая призывает на себя кару.
- source_word: כָעֵת מָחָר
  choice: завтра к этому времени
  rationale: Точно и естественно обозначает соответствующее время следующего дня.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: не сделаю с твоей жизнью то же
  rationale: Русская конструкция передаёт значение שׂים и сохраняет образное упоминание жизни, не сводя угрозу к пояснительному «не убью тебя».
- source_word: נַפְשְׁךָ
  choice: твоей жизнью
  rationale: В данном контексте נֶפֶשׁ означает жизнь человека, а не нематериальную душу.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: что с жизнью одного из них
  rationale: Сохраняет повтор слова «жизнь» и сравнение с участью одного из убитых пророков.
theological_decisions:
- issue: Значение אֱלֹהִים в клятве Иезавели
  choice: 'множественное: «боги»'
  alternative: 'единственное: «Бог»'
  rationale: Согласованные глаголы имеют множественное число, а контекст речи Иезавели допускает призывание нескольких божеств. Поскольку אֱלֹהִים само по себе может иметь и единственное значение, вариант отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формула угрозы сохранена как клятва, а не заменена прямым пересказом «я убью тебя». Подлинная неоднозначность אֱלֹהִים вынесена в сноску.
