    text: 'Или: «Пусть Бог так поступит со мной — и ещё хуже». Еврейское слово אֱלֹהִים может означать как «Бог», так и «боги»; здесь значение «боги» согласуется с окружением Иезавели и с глаголами во множественном числе в формуле клятвы.'
    reason: alternative_reading
