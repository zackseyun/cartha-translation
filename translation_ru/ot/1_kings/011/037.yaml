  source_fidelity: 'Перевод точно передаёт последовательность и основные значения еврейского текста: «возьму тебя» (אֶקַּח), осуществление царской власти (וּמָלַכְתָּ), сферу власти «над всем» (בְּכֹל), оборот «чего пожелает твоя душа» (תְּאַוֶּה נַפְשֶׁךָ) и итоговое утверждение царём над Израилем (וְהָיִיתָ מֶּלֶךְ עַל־יִשְׂרָאֵל). Неоднозначность антропологического оборота не устранена толковательно.'
