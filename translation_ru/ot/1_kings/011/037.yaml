  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: ru
  text: Я возьму тебя, и ты будешь царствовать над всем, чего пожелает твоя душа[a], и будешь царём над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чего ты пожелаешь»; буквально: «чего пожелает твоя душа».'
    reason: Лексико-стилистическая альтернатива для еврейского оборота תְּאַוֶּה נַפְשֶׁךָ.
lexical_decisions:
- source_word: אֶקַּח
  choice: Я возьму
  rationale: Сохранено основное конкретное значение глагола לקח — «брать». В контексте речь идёт о Божьем поставлении, однако перевод «изберу» сделал бы это толкование частью текста.
- source_word: וּמָלַכְתָּ
  choice: ты будешь царствовать
  rationale: Глагол מלך обозначает осуществление царской власти, а не только вступление на престол.
- source_word: בְּכֹל אֲשֶׁר
  choice: над всем, чего
  rationale: Предлог ב при глаголе царствования естественно передаёт сферу власти; по-русски это выражено сочетанием «царствовать над».
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: чего пожелает твоя душа
  rationale: Сохранён образный еврейский оборот с נֶפֶשׁ («душа»), при этом фраза остаётся понятной на современном русском языке.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: и будешь царём
  rationale: Конструкция היה с существительным обозначает положение или статус; «будешь царём» естественно передаёт официальное утверждение царской власти.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל в сочетании с царской властью указывает на народ, над которым правит царь.
theological_decisions:
- issue: Антропологический оборот נֶפֶשׁ
  choice: «твоя душа»
  alternative: «ты пожелаешь»; «твоё сердце пожелает»
  rationale: Здесь слово נֶפֶשׁ не обязательно выражает техническое учение о составе человека, но оно является частью еврейского образа. Буквальный перевод сохраняет этот образ и не подменяет его словом «сердце».
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным библейским звучанием. Союзы и параллельные конструкции исходного текста сохранены без излишней архаизации.
