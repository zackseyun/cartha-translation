  variant: modern literary Russian
source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: ru
  text: Однако при твоей жизни Я не сделаю этого ради Давида, твоего отца; из руки твоего сына Я вырву его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть царство, о котором говорится в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Частица вводит ограничение к объявленному прежде суду; «однако» естественно передаёт здесь противительно-ограничительный смысл.
- source_word: בְּיָמֶיךָ
  choice: при твоей жизни
  rationale: Еврейское выражение буквально означает «в твои дни», то есть во время жизни и царствования Соломона; современная русская формулировка ясно передаёт временной смысл.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: Я не сделаю этого
  rationale: Местоименный суффикс отсылает к объявленному в предыдущем стихе действию — отторжению царства; перевод сохраняет эту контекстуальную отсылку.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: ради Давида, твоего отца
  rationale: לְמַעַן обозначает действие ради кого-либо или из уважения к нему; «ради» кратко и естественно сохраняет мотив особого отношения к Давиду.
- source_word: מִיַּד בִּנְךָ
  choice: из руки твоего сына
  rationale: Сохранён образный еврейский оборот, обозначающий изъятие из власти или владения сына Соломона.
- source_word: אֶקְרָעֶנָּה
  choice: Я вырву его
  rationale: Глагол קָרַע означает «разорвать, оторвать, вырвать»; «вырву» передаёт насильственное отнятие царства и естественно сочетается с образом руки.
theological_decisions:
- issue: Характер отсроченного суда над Соломоном
  choice: Объявленное отторжение царства не произойдёт при жизни Соломона, но царство будет вырвано из руки его сына.
  alternative: 'Можно было прямо повторить объект: «царство Я вырву из руки твоего сына».'
  rationale: В еврейском тексте объект выражен местоименным суффиксом и определяется предыдущим стихом. Основной текст сохраняет эту анафорическую связь, а сноска проясняет её, не добавляя богословских выводов.
- issue: Основание отсрочки
  choice: «ради Давида, твоего отца»
  alternative: «из-за Давида, твоего отца» или «для Давида, твоего отца»
  rationale: «Ради» сохраняет мотив благоволения к Давиду, не уточняя сверх текста природу этого отношения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «При твоей жизни» предпочтено буквальному, но менее естественному «в твои дни». Образ «из руки… вырву» сохранён как ясная и выразительная метафора утраты власти.
