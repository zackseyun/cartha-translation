  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: ru
  text: 'И будет так: если ты будешь слушать всё, что Я тебе повелю, ходить Моими путями и поступать правильно в Моих глазах, соблюдая Мои установления и заповеди, как поступал Мой слуга Давид, то Я буду с тобой, построю тебе надёжный дом[a], как построил Давиду, и отдам тебе Израиль.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть дам тебе устойчивую царскую династию. Буквально: «надёжный (верный, прочный) дом»; возможны также переводы «устойчивый дом» или «долговечный дом».'
    reason: Поясняет династический смысл בַיִת и передаёт диапазон значений נֶאֱמָן, не выдавая один русский вариант за единственно буквальный.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: будешь слушать
  rationale: Сохраняет значение слухового восприятия и внимательного послушания; дальнейшие формулировки раскрывают практический смысл послушания.
- source_word: אֲצַוֶּךָ
  choice: Я повелю тебе
  rationale: Будущая форма естественно передаёт несовершенный вид в условной конструкции и сохраняет силу Божьего повеления.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: ходить Моими путями
  rationale: Сохранена библейская метафора заветной жизни, понятная в современном литературном русском языке.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: поступать правильно в Моих глазах
  rationale: Передаёт нравственную оценку с Божьей точки зрения и сохраняет образ оригинала.
- source_word: לִשְׁמֹר
  choice: соблюдая
  rationale: Деепричастие ясно обозначает способ, которым осуществляется правильное поведение.
- source_word: חֻקּוֹתַי
  choice: Мои установления
  rationale: «Установления» естественно передаёт нормативный и заветный смысл слова, не звуча излишне архаично.
- source_word: מִצְוֺתַי
  choice: Мои заповеди
  rationale: Общеупотребительный библейский термин, сохраняющий заветно-правовой регистр.
- source_word: עַבְדִּי
  choice: Мой слуга
  rationale: В отношении Давида это почётное обозначение служения Богу; «слуга» передаёт контекст точнее, чем социально более узкое «раб».
- source_word: בַיִת נֶאֱמָן
  choice: прочный дом
  rationale: נֶאֱמָן здесь выражает надёжность и устойчивость, а «дом» сохраняет династическую метафору и связь с обещанием Давиду.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: отдам тебе Израиль
  rationale: Естественная русская формулировка ясно передаёт Израиль как даруемое Богом царство.
theological_decisions:
- issue: Значение «дома» в обещании
  choice: Сохранено слово «дом», подразумевающее прочную царскую династию
  alternative: Буквальный дом или дворец; прямой перевод «династия»
  rationale: Сравнение с домом Давида и контекст царского преемства указывают на династию, однако сохранение метафоры поддерживает каноническую связь; смысл пояснён в сноске.
- issue: Условный характер обещания
  choice: Обещание прямо поставлено в зависимость от послушания Иеровоама
  alternative: Безусловное дарование
  rationale: Частица אִם и последующая цепочка требований грамматически выражают подлинное условие, которое не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Сохранены ключевые метафоры «ходить путями», «в Моих глазах» и «дом», но синтаксис сделан естественным для современного читателя.
