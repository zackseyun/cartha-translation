  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: ru
  text: Он был противником Израиля во все дни Соломона[a], вдобавок к бедствию от Адада. Он питал отвращение к Израилю и царствовал над Арамом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо зла (бедствия), связанного с Ададом». Древнееврейская фраза эллиптична и допускает понимание, что этот противник появился в дополнение к бедствию, причинённому Ададом.'
    reason: Альтернативное прочтение трудной эллиптической конструкции.
lexical_decisions:
- source_word: שָׂטָן
  choice: противник
  rationale: В историческом контексте речь идёт о человеке — политическом враге Израиля, а не о Сатане как сверхъестественном существе.
- source_word: לְיִשְׂרָאֵל
  choice: противником Израиля
  rationale: Предлог ל обозначает сторону, которой противостоит названный противник; русское управление передаёт это естественно.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: во все дни Соломона
  rationale: Сохраняет форму и широту древнееврейского временного выражения, не ограничивая его явно только жизнью или только царствованием.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: вдобавок к бедствию от Адада
  rationale: Трудная эллиптическая конструкция передана без добавления отсутствующего в тексте глагола; רָעָה здесь обозначает причинённое Израилю бедствие или вред, а не отвлечённое нравственное зло.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: питал отвращение к Израилю
  rationale: Передаёт сильную неприязнь глагола קוץ и естественно оформляет объект с ב по-русски.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: царствовал над Арамом
  rationale: Сохраняет значение מלך и древнее собственное название Арам, не заменяя его более поздним названием «Сирия».
theological_decisions:
- issue: Следует ли понимать שָׂטָן как имя «Сатана»
  choice: нарицательное «противник»
  alternative: имя собственное «Сатана»
  rationale: Контекст повествует о человеческих политических противниках Соломона; употребление имени «Сатана» внесло бы в текст отсутствующий здесь позднейший демонологический смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены древние имена и подлинная неоднозначность трудной фразы; тяжёлые кальки и конфессионально окрашенная терминология исключены.
