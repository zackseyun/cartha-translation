base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: ru
  text: И сделал Соломон зло в глазах Яхве и не следовал за Яхве с полной преданностью, как Давид, его отец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не следовал за Яхве вполне» или «не был всецело предан Яхве». Еврейская идиома обозначает неполноту верности или послушания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ שְׁלֹמֹה הָרַע
  choice: И делал Соломон зло
  rationale: Глагол עשה с субстантивированным הָרַע описывает устойчивое поведение Соломона; несовершенный вид «делал» естественно передаёт повествовательную оценку его поступков.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена понятная по-русски древнееврейская оценочная метафора «в глазах».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: מִלֵּא אַחֲרֵי יְהוָה
  choice: следовал за Яхве всем сердцем
  rationale: Идиома буквально связана с «полнотой» следования и означает полную, безраздельную верность. Русское «следовал всем сердцем» естественно выражает эту полноту, не утверждая в данном предложении полного отступничества.
- source_word: כְּדָוִד אָבִיו
  choice: как Давид, его отец
  rationale: Сравнительный оборот сохранён без добавления отсутствующего в еврейском тексте глагола; «отец» здесь обозначает непосредственного отца Соломона.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» прямо сохраняет его и не подменяет титулом.
- issue: Степень неверности Соломона в выражении מִלֵּא אַחֲרֵי יְהוָה
  choice: не следовал за Яхве всем сердцем
  alternative: не вполне следовал за Яхве; не был всецело предан Яхве
  rationale: Формулировка передаёт неполноту верности, не усиливая этот конкретный оборот до безоговорочного утверждения о полном отступничестве.
translation_notes:
  register: Современный литературный русский язык с умеренно буквальным сохранением библейской метафоры «в глазах». Синтаксис простой и торжественный; богословская напряжённость между следованием и неполной верностью сохранена.
