source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: ru
  text: 'Но Я не отторгну всё царство: одно колено Я дам твоему сыну — ради Давида, Моего слуги, и ради Иерусалима, который Я избрал.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: Частица вводит ограничение ранее объявленного суда; «но» естественно передаёт здесь её противительный оттенок.
- source_word: כָּל הַמַּמְלָכָה
  choice: всё царство
  rationale: Передаёт полноту царства, выраженную כָּל, и естественно сочетается с отрицанием.
- source_word: אֶקְרָע
  choice: Я отторгну
  rationale: Глагол буквально означает «разорвать»; в данном политическом контексте «отторгну» сохраняет образ насильственного отделения царства и звучит естественно по-русски.
- source_word: שֵׁבֶט אֶחָד
  choice: одно колено
  rationale: שֵׁבֶט здесь обозначает племенное подразделение Израиля; традиционное русское библейское «колено» остаётся понятным и уместным в возвышенном современном регистре.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: Я дам твоему сыну
  rationale: Прямая передача формы будущего времени и простого значения глагола נתן.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: ради Давида, Моего слуги
  rationale: «Ради» выражает основание или мотив сохранения, не добавляя особого догматического механизма; «слуга» — современный и точный эквивалент עֶבֶד в отношении к Богу.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: и ради Иерусалима
  rationale: Повтор «ради» сохраняет параллелизм двух оснований, явно представленных в еврейском тексте.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: который Я избрал
  rationale: Совершенный вид передаёт совершившийся выбор; в русском прошедшее «избрал» естественно и не исключает продолжающейся значимости этого выбора.
theological_decisions:
- issue: Основание сохранения одного колена
  choice: 'Сохранены два параллельных основания: ради Давида, Божьего слуги, и ради избранного Богом Иерусалима.'
  alternative: Свести основание только к завету с Давидом либо представить Иерусалим и храм единственной главной причиной.
  rationale: Еврейский текст называет оба основания параллельно и не объясняет их соотношение через более узкую богословскую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «не всё царство Я отторгну» сохраняет акцент еврейского текста на неполноте суда. Заглавные местоимения в речи Бога применены как издательская норма благоговейного русского библейского стиля.
