  text: וַ/תֵּ֨לֶד ל֜/וֹ אֲח֣וֹת תַּחְפְּנֵ֗יס אֵ֚ת גְּנֻבַ֣ת בְּנ֔/וֹ וַ/תִּגְמְלֵ֣/הוּ תַחְפְּנֵ֔ס בְּ/ת֖וֹךְ בֵּ֣ית פַּרְעֹ֑ה וַ/יְהִ֤י גְנֻבַת֙ בֵּ֣ית פַּרְעֹ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: ru
  text: Сестра Тафнисы родила ему сына Генувата[a]. Тафниса отняла его от груди в доме фараона[b], и Генуват жил в доме фараона среди сыновей фараона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «родила ему Генувата, его сына». По-русски тот же смысл естественнее выражен словами «родила ему сына Генувата».'
    reason: lexical_alternative
  - marker: b
    text: То есть Тафниса довела ребёнка до возраста, когда его перестали кормить грудью; после этого он продолжал жить при дворе фараона.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לּוֹ
  choice: родила ему
  rationale: Глагол ילד с לּוֹ указывает, что сестра Тафнисы родила сына Адеру; русское выражение естественно передаёт дательный оборот.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: сестра Тафнисы
  rationale: Прямо передаёт конструкцию принадлежности; для имени использована укоренившаяся в русской библейской традиции форма «Тафниса».
- source_word: גְּנֻבַת
  choice: Генуват
  rationale: Традиционная русская форма личного имени, достаточно близкая к еврейскому звучанию и узнаваемая читателям.
- source_word: בְּנוֹ
  choice: сына
  rationale: Суффикс указывает на сына Адера. В русском обороте «родила ему сына» принадлежность выражена местоимением «ему», поэтому отдельное «его» было бы избыточным.
- source_word: וַתִּגְמְלֵהוּ
  choice: отняла его от груди
  rationale: В данном контексте גמל означает завершение грудного вскармливания; перевод сохраняет конкретный смысл, не заменяя его общим «воспитывала».
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: в доме фараона
  rationale: בְּתוֹךְ обозначает пребывание внутри царского дома, включающего дворец и придворное окружение; краткая русская формулировка сохраняет образ еврейского текста.
- source_word: וַיְהִי
  choice: жил
  rationale: Буквально «был», но применительно к ребёнку в определённом доме русское «жил» естественно передаёт продолжительное пребывание, не добавляя идеи, что оно обязательно началось именно тогда.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: среди сыновей фараона
  rationale: Сохраняет буквальное значение בְּנֵי как «сыновья» и подчёркивает положение Генувата среди царских детей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены повтор «в доме фараона» и конкретное «среди сыновей фараона». Имена даны в традиционных русских библейских формах; архаические обороты вроде «в доме фараоновом» не используются.
