  source_fidelity: 'Основной смысл передан верно: семьсот законных жён высокого статуса, триста наложниц, и жёны изменили направленность сердца Соломона. Однако «княжеских дочерей» неоправданно сужает שָׂרוֹת до дочерей князей: исходное слово обозначает княгинь/принцесс либо, в более широком понимании, женщин высокого статуса.'
