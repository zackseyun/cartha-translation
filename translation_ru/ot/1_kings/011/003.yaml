base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: ru
  text: У него было семьсот жён, княгинь[a], и триста наложниц; его жёны склонили его сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знатных женщин»; еврейское слово указывает на их высокий статус.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: У него было
  rationale: Еврейская конструкция היה + ל выражает обладание; это естественный русский эквивалент.
- source_word: נָשִׁים
  choice: жён
  rationale: В контексте царских браков речь идёт именно о жёнах, а не просто о женщинах.
- source_word: שָׂרוֹת
  choice: княжеских дочерей
  rationale: Слово обозначает женщин высокого, правящего рода; такое приложение естественно поясняет статус Соломоновых жён и сохраняет связь со значением «княгини».
- source_word: וּפִלַגְשִׁים
  choice: и триста наложниц
  rationale: «Наложницы» — традиционный и точный русский термин для признанных партнёрш более низкого брачного статуса.
- source_word: וַיַּטּוּ
  choice: склонили
  rationale: Форма от נטה буквально передаёт направленное изменение сердца; «склонили» сохраняет образ и не добавляет явно отсутствующего в этом стихе дополнения «от Господа».
- source_word: אֶת לִבּוֹ
  choice: его сердце
  rationale: Сохраняется библейский антропологический образ сердца как средоточия воли, мысли и верности.
theological_decisions:
- issue: Значение выражения «его сердце»
  choice: Сохранить буквальный образ, охватывающий внутреннюю волю, преданность и направленность Соломона.
  alternative: Передать только как изменение чувств или прямо истолковать как отступление от Господа.
  rationale: Еврейское לֵב имеет более широкий смысл, чем эмоции; при этом сам стих не называет объект удаления, поэтому перевод не должен преждевременно снимать смысловую напряжённость.
- issue: Направление действия וַיַּטּוּ
  choice: «склонили его сердце» без добавленного направления
  alternative: «отвратили его сердце» или «увели его сердце от Господа»
  rationale: Исходный текст этого стиха сообщает изменение направленности сердца, но не содержит отдельного слова «прочь» и не называет здесь дополнение; ближайший контекст раскрывает его далее.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «жёны его» в заключительной части слегка приподнимает регистр и подчёркивает субъект действия, не затрудняя понимания.
