base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: ru
  text: Иеровоам, сын Навата[a], ефремлянин из Цереды (его мать звали Церуа; она была вдовой), служил Соломону и поднял руку на царя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ефрафянин»; однако здесь, вероятнее всего, имеется в виду принадлежность к колену Ефрема.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднял руку на царя»; возможно: выступил против царя или поднял мятеж.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: ефремлянин
  rationale: В данном контексте слово, вероятнее всего, обозначает принадлежность к колену Ефрема. Возможное понимание «ефрафянин» сохранено в примечании.
- source_word: הַצְּרֵדָה
  choice: Цереда
  rationale: Название населённого пункта передано принятой русской библейской транслитерацией.
- source_word: צְרוּעָה
  choice: Церуа
  rationale: Личное имя передано транслитерацией с еврейского.
- source_word: אִשָּׁה אַלְמָנָה
  choice: она была вдовой
  rationale: Естественная современная русская передача сочетания «женщина, вдова» без избыточного повтора.
- source_word: עֶבֶד לִשְׁלֹמֹה
  choice: служил Соломону
  rationale: עֶבֶד допускает значения «раб», «слуга», «служащий». В придворно-административном контексте нейтральное «служил Соломону» естественно и не уточняет статус сверх сказанного.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: поднял руку на царя
  rationale: Сохранена еврейская метафора в естественном русском выражении; в контексте она означает выступление или мятеж против царя.
- source_word: וְ
  choice: Иеровоам
  rationale: 'Начальный союз не выражен отдельным русским словом: повествовательная связь ясна из контекста, а искусственное начальное «и» не требуется.'
