revisions:
- from: Соломон искал случая предать Иеровоама смерти[a]. Но Иеровоам встал и бежал в Египет, к Сусакиму, царю Египта, и оставался в Египте до смерти Соломона.
  to: Соломон искал возможности убить Иеровоама[a]. Но Иеровоам встал и бежал в Египет, к Сусакиму, царю Египта, и оставался в Египте до смерти Соломона.
  rationale: Исправление устраняет не выраженный в оригинале юридический оттенок «предать смерти» и выбирает нейтральное «убить». Формулировка «искал возможности» передаёт значение בקש как направленного стремления или попытки, не утверждая успешного осуществления. Остальная структура, имена и временное указание сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:00:43Z'
review_pass:
  verdict: revise
  source_fidelity: '«Искал случая предать ... смерти» в целом передаёт направленное намерение, но «предать смерти» в современном русском обычно оттеняет формальную казнь или судебное решение, которого еврейский текст не уточняет. Более нейтральное «убить» точнее сохраняет смысл לְהָמִית. «Искал возможности» естественно передаёт וַיְבַקֵּשׁ с инфинитивом, не утверждая, что покушение уже произошло. Остальные части стиха верны: бегство, направление в Египет к Сусакиму, пребывание там до смерти Соломона.'
  naturalness: Исправленный вариант сохраняет современный литературный, сдержанно библейский регистр. «Встал и бежал» — естественная повествовательная передача последовательных еврейских форм; «оставался в Египте» ясно выражает длительность пребывания в контексте «до смерти Соломона».
  terminology: Имена «Иеровоам» и традиционная русская библейская форма «Сусаким» употреблены последовательно. Терминологически нагруженных богословских слов в стихе нет. «Убить» нейтральнее и точнее, чем «предать смерти», поскольку не вносит судебно-карательного оттенка.
  issues:
  - severity: medium
    issue: «Предать Иеровоама смерти» может подразумевать юридическую казнь.
    rationale: Хифиль מות означает «умертвить/убить» и сам по себе не обозначает судебную процедуру. Следует выбрать нейтральный русский глагол.
  - severity: low
    issue: «Искал случая» несколько конкретизирует поиски как ожидание удобного случая.
    rationale: В контексте это близко к בקש, но «искал возможности» чуть прямее передаёт стремление осуществить действие без излишней идиоматической окраски.
  revised_text: Соломон искал возможности убить Иеровоама[a]. Но Иеровоам встал и бежал в Египет, к Сусакиму, царю Египта, и оставался в Египте до смерти Соломона.
