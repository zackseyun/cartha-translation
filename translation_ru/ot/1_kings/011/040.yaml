  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: ru
  text: Соломон искал возможности убить Иеровоама[a]. Но Иеровоам встал и бежал в Египет, к Сусакиму, царю Египта, и оставался в Египте до смерти Соломона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пытался убить Иеровоама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: искал случая
  rationale: Передаёт намерение и направленное стремление, выраженные בקש, не утверждая, что попытка казни уже состоялась.
- source_word: לְהָמִית
  choice: предать ... смерти
  rationale: Сохраняет каузативное значение породы хифиль глагола מות и серьёзность намерения правителя; по-русски звучит естественно и достойно.
- source_word: וַיָּקָם
  choice: встал
  rationale: Сохраняет повествовательный переход к решительному действию, выраженный глаголом קום.
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Точно передаёт бегство от опасности и соответствует литературному русскому повествованию.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: в Египет, к Сусакиму, царю Египта
  rationale: Различает страну как направление бегства и царя как лицо, к которому направился Иеровоам, сохраняя повтор слова «Египет».
- source_word: וַיְהִי בְמִצְרַיִם
  choice: оставался в Египте
  rationale: В сочетании с последующим עַד простое היה с обозначением места естественно выражает продолжительное пребывание; буквальное «был в Египте» возможно, но менее ясно по-русски.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: до смерти Соломона
  rationale: Прямо и естественно передаёт еврейскую именную конструкцию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Имя שִׁישַׁק передано в традиционной русской библейской форме «Сусаким». Союз «но» естественно обозначает противопоставление между замыслом Соломона и бегством Иеровоама, хотя еврейский текст использует обычную повествовательную последовательность с וַ.
