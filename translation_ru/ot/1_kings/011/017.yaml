base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: ru
  text: Адад бежал в Египет[a] вместе с несколькими эдомитянами из числа слуг его отца. Сам Адад был ещё маленьким мальчиком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы прийти в Египет». В древнееврейском глагол «прийти» может употребляться там, где по-русски естественнее назвать направление движения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совсем юным». Древнееврейское выражение подчёркивает, что Адад был ещё очень молод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Глагол ברח в породе каль означает бегство от опасности; «бежал» точно и естественно передаёт повествовательный контекст.
- source_word: אֲדַד
  choice: Адад
  rationale: Традиционная русская передача личного имени.
- source_word: הוּא
  choice: сам Адад
  rationale: Самостоятельное местоимение подчёркивает лицо Адада; в русском это ударение естественно передано словом «сам» во втором предложении, без тяжеловесного буквального повтора в первом.
- source_word: וַאֲנָשִׁים אֲדֹמִיִּים
  choice: вместе с несколькими эдомитянами
  rationale: Сочетание обозначает неопределённое число мужчин-эдомитян. «Несколькими» ясно показывает, что речь не обо всех эдомитянах, а творительный с «вместе с» естественно выражает совместное бегство.
- source_word: מֵעַבְדֵי אָבִיו
  choice: из числа слуг его отца
  rationale: Предлог מן имеет здесь разделительно-партитивное значение, а עבד обозначает людей, состоявших на службе у отца Адада.
- source_word: אִתּוֹ
  choice: вместе с ним
  rationale: Передаёт сопровождение Адада эдомитянами; в русском местоимение опущено внутри итоговой формулировки как однозначно подразумеваемое после имени Адада.
- source_word: לָבוֹא מִצְרָיִם
  choice: в Египет
  rationale: Инфинитив בוא буквально означает «прийти», но после глагола бегства сочетание естественно обозначает место назначения. Русское «бежал в Египет» сохраняет смысл без неестественного буквализма.
- source_word: נַעַר קָטָן
  choice: маленьким мальчиком
  rationale: נער обозначает мальчика или юношу, а קטן подчёркивает его малый возраст. Сочетание «маленький мальчик» естественно передаёт оба элемента.
theological_decisions: []
