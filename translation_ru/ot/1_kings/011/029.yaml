revisions:
- from: В то время, когда Иеровоам вышел из Иерусалима, на дороге его встретил пророк Ахия из Силома. Он[a] был закутан в новый плащ, и оба они были одни в поле.
  to: В то время, когда Иеровоам вышел из Иерусалима, на дороге его встретил пророк Ахия из Силома. Он[a] был одет в новый плащ, и оба они были одни в поле.
  rationale: Заменено только «был закутан» на «был одет», чтобы избежать избыточного оттенка укутывания и сохранить естественную русскую передачу описательного еврейского причастия. Местоимение и примечание сохранены, поскольку они не устраняют синтаксическую неоднозначность оригинала.
