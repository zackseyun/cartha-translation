  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: ru
  text: В то время, когда Иеровоам вышел из Иерусалима, на дороге его встретил пророк Ахия из Силома. Он[a] был одет в новый плащ, и оба они были одни в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст не уточняет однозначно, кто был одет в новый плащ — Ахия или Иеровоам.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: В то время
  rationale: Еврейская повествовательная формула вводит новую сцену и задаёт её время; краткая русская формулировка передаёт эту функцию без неестественного буквализма.
- source_word: יָצָא מִירוּשָׁלָם
  choice: вышел из Иерусалима
  rationale: Сохраняется основное направительное значение יָצָא и естественное русское управление.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: его встретил
  rationale: מצא буквально означает «найти», но в данном повествовательном контексте обозначает встречу на дороге; «встретил» по-русски естественнее, не меняя события.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: пророк Ахия из Силома
  rationale: Русская конструкция «из Силома» ясно и естественно передаёт gentilicum הַשִּׁילֹנִי, а определение «пророк» сохраняет идентификацию персонажа.
- source_word: בַּדֶּרֶךְ
  choice: на дороге
  rationale: Прямой и современный русский эквивалент локативного выражения.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: Он был закутан
  rationale: Передаёт фоновое состояние, выраженное причастием породы hitpael, и сохраняет местоименную неоднозначность оригинала.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: в новый плащ
  rationale: שַׂלְמָה обозначает верхнюю одежду; «плащ» конкретно и естественно по-русски и подходит к последующему разрыванию одежды.
- source_word: וּשְׁנֵיהֶם לְבַדָּם בַּשָּׂדֶה
  choice: и оба они были одни в поле
  rationale: Формулировка сохраняет акцент на том, что кроме этих двоих никого не было, и не добавляет к שׂדה отсутствующего определения «открытое».
theological_decisions:
- issue: К кому относится местоимение וְהוּא перед описанием нового плаща
  choice: Сохранить местоимение «Он» без указания имени
  alternative: Явно назвать Ахию или Иеровоама
  rationale: Грамматика допускает соотнесение местоимения более чем с одним участником; явное имя молча устранило бы реальную неоднозначность еврейского текста.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-торжественное. Синтаксис упрощён до естественной русской формы, при этом сохранены последовательность событий, поле как место уединения и неоднозначность местоимения.
