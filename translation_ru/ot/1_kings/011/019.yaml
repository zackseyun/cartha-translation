base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: ru
  text: Адад снискал большое расположение в глазах фараона, и тот дал ему в жёны сестру его жены[a] — сестру Тахпенес, царицы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «его жены» обычно понимают как указание на жену фараона; менее вероятно, что имеется в виду жена Адада.
    reason: alternative_reading
  - marker: b
    text: 'Еврейское слово обозначает высокопоставленную царскую женщину; возможные переводы: «владычица», «главная царская женщина» или «царица-мать». Точная придворная роль здесь неясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: снискал большое расположение в глазах
  rationale: Сохраняет образность еврейской идиомы «найти благоволение в глазах» и передаёт усиление מְאֹד естественным современным русским выражением.
- source_word: פַרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: дал ему в жёны
  rationale: Естественно и точно передаёт передачу женщины Ададу для вступления в брак.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: сестру своей жены
  rationale: Возвратное местоимение естественно указывает на подлежащее «тот», то есть на фараона, не устраняя полностью заложенную в еврейской местоименной форме возможность иного соотнесения.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: сестру Тахпенес
  rationale: Передаёт приложение, отождествляющее жену фараона с Тахпенес и женщину, данную Ададу, с её сестрой.
- source_word: הַגְּבִירָה
  choice: царицы
  rationale: В данном контексте это естественное русское обозначение высокопоставленной царской женщины. Более специальное «царица-мать» могло бы неоправданно уточнить египетскую придворную должность; лексическая широта отмечена в сноске.
theological_decisions:
- issue: К кому относится суффикс в אִשְׁתּוֹ («его/своей жены»)
  choice: 'К фараону: он дал Ададу сестру собственной жены.'
  alternative: 'К Ададу: фараон дал ему сестру жены Адада.'
  rationale: Подлежащее глагола «дал» — фараон, а последующее пояснение «сестру Тахпенес» лучше всего поддерживает отнесение к жене фараона. Поскольку сама еврейская форма допускает формальную неоднозначность, альтернатива сохранена в сноске.
- issue: Значение титула הַגְּבִירָה
  choice: царица
  alternative: царица-мать; главная царская женщина; владычица
  rationale: Титул обозначает высокопоставленную женщину при царском дворе, но точное соответствие египетской должности здесь неясно. «Царица» естественно согласуется с тем, что Тахпенес названа женой фараона, а возможные более буквальные или специальные значения указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Сохранена еврейская идиома «в глазах», но синтаксис сделан естественным для русского читателя. Тире ясно присоединяет пояснение о Тахпенес.
