  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: ru
  text: И воздвиг ему Бог противника[a] — Резона, сына Элиады, который бежал от своего господина Адад-Эзера, царя Цовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. сатан — здесь нарицательное слово со значением «противник», а не имя собственное Сатана.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: воздвиг
  rationale: Порода hифиль глагола קום означает «побудить встать, воздвигнуть». «Воздвиг» сохраняет представление о том, что Бог вывел противника на историческую сцену, и звучит естественно в возвышенном повествовании.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном повествовательном контексте имеется в виду Бог Израиля.
- source_word: לוֹ
  choice: ему
  rationale: Сохраняет формальную конструкцию с ל; направленность против Соломона ясно выражена существительным «противника».
- source_word: שָׂטָן
  choice: противника
  rationale: Здесь это нарицательное существительное со значением политического противника, а не имя собственное «Сатана».
- source_word: רְזוֹן
  choice: Резона
  rationale: Личное имя передано транслитерацией и поставлено в винительный падеж по нормам русского синтаксиса.
- source_word: בֶּן אֶלְיָדָע
  choice: сына Элиады
  rationale: Обычная формула происхождения передана естественной русской конструкцией.
- source_word: אֲשֶׁר בָּרַח
  choice: который бежал
  rationale: Русское прошедшее время в придаточном естественно обозначает предшествующее событие без необходимости добавлять отдельный показатель давнопрошедшего времени.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: от Адад-Эзера
  rationale: מֵאֵת обозначает удаление от лица; «от» точно и естественно передаёт это отношение.
- source_word: מֶלֶךְ צוֹבָה
  choice: царя Цовы
  rationale: Сопряжённая конструкция передана обычным русским родительным оборотом.
- source_word: אֲדֹנָיו
  choice: своего господина
  rationale: Возвратное местоимение устраняет возможную двусмысленность русской фразы, а «господин» передаёт человеческую власть Адад-Эзера над Резоном, не смешивая её с божественным титулом.
theological_decisions:
- issue: Значение שָׂטָן в данном контексте
  choice: нарицательное «противник»
  alternative: имя собственное «Сатана»
  rationale: Текст прямо называет человеческого политического противника — Резона, сына Элиады. Передача именем «Сатана» внесла бы в стих отсутствующее в нём демонологическое значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок «воздвиг ему Бог» сохраняет акцент исходной конструкции, оставаясь понятным; тире естественно вводит уточняющее имя противника.
