  text: וַ/יָּקֻ֨מוּ֙ מִ/מִּדְיָ֔ן וַ/יָּבֹ֖אוּ פָּארָ֑ן וַ/יִּקְחוּ֩ אֲנָשִׁ֨ים עִמָּ֜/ם מִ/פָּארָ֗ן וַ/יָּבֹ֤אוּ מִצְרַ֨יִם֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וַ/יִּתֶּן ל֣/וֹ בַ֗יִת וְ/לֶ֨חֶם֙ אָ֣מַר ל֔/וֹ וְ/אֶ֖רֶץ נָ֥תַן לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: ru
  text: Они отправились из Мадиама и пришли в Фаран. Взяв с собой людей из Фарана, они пришли в Египет к фараону, царю Египта. Тот дал ему дом, распорядился выдавать ему пищу[a] и дал ему землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и о хлебе сказал ему»; по смыслу фараон распорядился обеспечивать его пищей.'
    reason: Сноска сохраняет необычную и неоднозначную форму еврейского выражения, тогда как основной текст передаёт его наиболее вероятный смысл.
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: Они отправились из Мадиама
  rationale: В повествовании קום с указанием исходного пункта идиоматически обозначает начало пути. «Отправились» естественно передаёт смысл, не вводя буквального, но здесь несущественного образа вставания.
- source_word: פָּארָן
  choice: Фаран
  rationale: Использована укоренившаяся русская библейская форма географического названия.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Взяв с собой людей из Фарана
  rationale: אֲנָשִׁים может обозначать мужчин или людей в составе группы; контекст не требует подчёркивать пол. Деепричастный оборот ясно передаёт присоединение спутников и избегает тяжёлой цепочки союзов.
- source_word: אֶל־פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: к фараону, царю Египта
  rationale: Сохранена еврейская аппозиция в естественной русской форме; титул передан со строчной буквы.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Тот дал ему дом
  rationale: «Тот» однозначно указывает на фараона как подлежащее, тогда как местоимение «ему» относится к Адáду из контекста предыдущих стихов. בַּיִת передано прямо как «дом».
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: распорядился выдавать ему пищу
  rationale: 'Буквальная конструкция необычна: «и хлеб сказал ему». По контексту אָמַר выражает распоряжение о содержании, а לֶחֶם имеет широкое значение пищи или пропитания. Добавление «выдавать» делает административный смысл понятным по-русски.'
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: и дал ему землю
  rationale: אֶרֶץ здесь означает земельное владение, предоставленное фараоном, а не отдельную страну; «землю» сохраняет широту исходного слова.
