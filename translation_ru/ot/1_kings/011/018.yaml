translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Паратаксис оригинала умеренно сглажен делением на предложения и деепричастным оборотом; последовательность событий и смена множественного числа на единственное сохранены. Маркер [a] помещён непосредственно после выражения, которое поясняет сноска.
