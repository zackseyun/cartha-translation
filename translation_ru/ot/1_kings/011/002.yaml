base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: ru
  text: 'из тех народов, о которых Яхве сказал сынам Израиля[a]: «Не входите к ним, и они не должны входить к вам; ведь они непременно склонят ваши сердца к своим богам». К ним Соломон прилепился с любовью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По смыслу в данном контексте: «Не вступайте с ними в брак, и они не должны вступать в брак с вами». Буквальнее еврейский текст говорит: «Не входите к ним, и они не должны входить к вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: из тех народов
  rationale: גּוֹיִם означает «народы»; указательное «тех» естественно связывает фразу с перечислением женщин в предыдущем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально и понятно сохраняет еврейское выражение и мужскую форму множественного числа.
- source_word: לֹא תָבֹאוּ בָהֶם וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: Не входите к ним, и они пусть не входят к вам
  rationale: Сохраняет взаимно-параллельную и несколько общую формулировку בוא с בְ, не подменяя её прямо словом «вступать в брак»; этот контекстуальный смысл пояснён в сноске.
- source_word: אָכֵן
  choice: потому что ... непременно
  rationale: В данном предупреждении אָכֵן подчёркивает несомненность названного последствия; русская конструкция одновременно естественно выражает обоснование запрета.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: склонят ваши сердца
  rationale: «Склонят» сохраняет образ каузативной формы נטה и множественное «сердца» согласно еврейскому суффиксу второго лица множественного числа.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: к своим богам
  rationale: По-русски естественно передаёт направление религиозной приверженности, выраженное оборотом «вслед за их богами».
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה לְאַהֲבָה
  choice: именно к ним Соломон прилепился с любовью
  rationale: «Прилепился» передаёт сильную и устойчивую привязанность דבק; «с любовью» сохраняет смысл לְאַהֲבָה без сведения его к страсти.
theological_decisions:
- issue: Делать ли запрет прямо запретом смешанных браков
  choice: Сохранить в основном тексте более общее «входить к ним / входить к вам» и пояснить брачный смысл в сноске
  alternative: «Не вступайте с ними в брак, и они пусть не вступают в брак с вами»
  rationale: Контекст явно говорит о браках Соломона, однако сам еврейский оборот сформулирован шире. Такой перевод сохраняет исходную неоднозначность и одновременно позволяет пояснить вероятный смысл.
- issue: Передача образа обращения сердца к чужим богам
  choice: «склонят ваши сердца к своим богам»
  alternative: «отвратят ваши сердца вслед за своими богами»
  rationale: В тексте нет отдельного глагола «отвратить»; нейтральное «склонят к» точнее сохраняет формулировку и богословское напряжение предупреждения.
- issue: Референт местоимения בָּהֶם
  choice: «именно к ним»
  alternative: «к этим женщинам»
  rationale: Грамматически местоимение мужского рода множественного числа отсылает к народам, хотя по контексту речь о женщинах из этих народов. Перевод не устраняет эту особенность добавлением отсутствующего существительного.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сохраняет связь с предыдущим стихом; «прилепился» оставлено как понятное и выразительное библейское слово. Маркер сноски помещён непосредственно после выражения, к которому относится пояснение.
