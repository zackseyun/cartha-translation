source:
  edition: WLC
  text: וַ/יִּתְפֹּ֣שׂ אֲחִיָּ֔ה בַּ/שַּׂלְמָ֥ה הַ/חֲדָשָׁ֖ה אֲשֶׁ֣ר עָלָ֑י/ו וַ/יִּ֨קְרָעֶ֔/הָ שְׁנֵ֥ים עָשָׂ֖ר קְרָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: ru
  text: Тогда Ахия взялся за новый плащ, который был на нём[a], и разорвал его на двенадцать частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который он носил». Буквально: «который был на нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: взялся за
  rationale: Передаёт конкретное физическое действие — Ахия берётся за одежду, — не добавляя оттенка насилия, возможного у глагола «схватил».
- source_word: שַׂלְמָה
  choice: плащ
  rationale: Слово обозначает верхнюю одежду; «плащ» естественно и понятно в современном русском повествовании.
- source_word: הַחֲדָשָׁה
  choice: новый
  rationale: Прямо передаёт определение и сохраняет значимую для символического действия деталь.
- source_word: אֲשֶׁר עָלָיו
  choice: который был на нём
  rationale: Близко следует еврейской формулировке и сохраняет её местоименную неоднозначность.
- source_word: וַיִּקְרָעֶהָ
  choice: разорвал его
  rationale: Прямо и естественно передаёт разрывание плаща; местоимение выражает объектный суффикс.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: на двенадцать частей
  rationale: Естественно по-русски выражает результат разрывания, сохраняя точное число и символическую силу действия.
theological_decisions:
- issue: К кому относится местоимение в выражении אֲשֶׁר עָלָיו
  choice: Сохранить формулировку «который был на нём» без уточнения носившего плащ.
  alternative: «который был на Ахии» или «который носил Ахия»
  rationale: Еврейский текст использует местоимение без имени; контекст указывает на Ахию, однако перевод не должен устранять формальную неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Формулировка сохраняет конкретность действия и местоименную неоднозначность еврейского текста.
