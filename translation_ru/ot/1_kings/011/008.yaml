base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/008.yaml
  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: ru
  text: Так же он поступил со всеми своими чужеземными жёнами[a], воскурявшими благовония и приносившими жертвы своим богам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так же он поступил со всеми своими чужеземными жёнами». Какое именно действие совершил Соломон, в еврейском тексте здесь не повторяется; оно подразумевается из предыдущего стиха.'
    reason: Лексико-синтаксический вариант передачи эллиптического выражения.
lexical_decisions:
- source_word: וְכֵן
  choice: Так же
  rationale: Связывает стих с предыдущим и указывает, что Соломон подобным образом поступил и в отношении остальных чужеземных жён.
- source_word: עָשָׂה
  choice: сделал
  rationale: Общий глагол «делать» оставлен без уточнённого дополнения, поскольку еврейский текст подразумевает действие, названное в предыдущем стихе.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: для всех своих чужеземных жён
  rationale: Предлог לְ передаёт направленность действия в их пользу, נָשִׁים в контексте означает жён, а הַנָּכְרִיּוֹת — женщин из других народов.
- source_word: מַקְטִירוֹת
  choice: воскурявших благовония
  rationale: Женский род и множественное число причастия согласуются с жёнами; культовый глагол קטר здесь естественно обозначает воскурение благовоний.
- source_word: וּמְזַבְּחוֹת
  choice: и приносивших жертвы
  rationale: Причастие от זבח обозначает совершение жертвоприношений; русское несовершенное причастие сохраняет оттенок продолжающейся или повторяющейся культовой деятельности.
- source_word: לֵאלֹהֵיהֶן
  choice: своим богам
  rationale: Множественное число с суффиксом женского множественного числа относится к божествам, которым поклонялись эти жёны; «своим» естественно указывает на принадлежность подлежащему оборота.
theological_decisions:
- issue: К кому относятся причастия מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: К чужеземным жёнам, которые воскуряли благовония и приносили жертвы.
  alternative: К культовой деятельности при устроенных Соломоном святилищах без прямого указания, что действия совершали сами жёны.
  rationale: Формы женского рода множественного числа непосредственно согласуются с выражением «его чужеземные жёны», поэтому перевод сохраняет наиболее прямую грамматическую связь.
- issue: Подразумеваемое дополнение при עָשָׂה
  choice: Не уточнять действие в основном тексте, оставив «сделал» с отсылкой к предыдущему стиху.
  alternative: 'Явно перевести: «устроил святилища на возвышенностях».'
  rationale: В еврейском стихе конкретное действие опущено и восстанавливается из контекста; его явное добавление устранило бы намеренную эллиптичность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. «Чужеземные» точнее и достойнее по регистру, чем разговорное «иностранные»; «воскуряли благовония» сохраняет понятную культовую терминологию. Некоторая незавершённость оборота «сделал для» намеренно отражает эллипсис еврейского текста и разъясняется сноской.
