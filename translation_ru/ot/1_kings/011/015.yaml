base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: ru
  text: 'И было[a]: когда Давид был в Эдоме[b], когда Иоав, военачальник войска, поднялся, чтобы похоронить убитых, он поразил всех мужчин в Эдоме —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И случилось». Это обычная еврейская повествовательная формула, которая здесь вводит пояснение к предыдущему стиху.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейское выражение необычно: «когда Давид был [с] Эдомом»; в данном контексте речь идёт о пребывании или военном походе Давида в Эдоме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Обычная древнееврейская повествовательная формула, здесь вводящая поясняющий рассказ; краткая русская формула сохраняет её функцию и достоинство стиля.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: когда Давид был в Эдоме
  rationale: Конструкция с инфинитивом образует временное придаточное. Необычное אֶת אֱדוֹם в военном контексте естественно передаётся как пребывание Давида в Эдоме, не исключая смысла похода против него.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: Иоав ... поднялся
  rationale: Буквальное пространственное значение עלה сохранено; временная связь выражена общим союзом «когда» без навязывания более точной последовательности событий.
- source_word: שַׂר הַצָּבָא
  choice: военачальник
  rationale: Краткое и современное обозначение официального командующего войском.
- source_word: לְקַבֵּר
  choice: похоронить
  rationale: Инфинитив цели естественно передаёт цель подъёма Иоава.
- source_word: הַחֲלָלִים
  choice: убитых
  rationale: Слово обозначает павших от насильственной смерти, особенно в сражении; «убитых» сохраняет этот смысл без архаизма.
- source_word: וַיַּךְ
  choice: он поразил
  rationale: Глагол נכה в военном повествовании означает нанесение смертельного поражения. «Поразил» сохраняет прямоту и традиционную библейскую весомость, не смягчая насилие.
- source_word: כָּל זָכָר
  choice: всех мужчин
  rationale: זָכָר обозначает лиц мужского пола. В данном военном контексте «всех мужчин» звучит естественнее русского «всех самцов» и сохраняет всеохватность выражения.
- source_word: בֶּאֱדוֹם
  choice: в Эдоме
  rationale: Предлог ב передан в его прямом местном значении без расширения до «по всему Эдому».
theological_decisions:
- issue: Передача сообщения о жестоком военном насилии
  choice: Сохранить прямое утверждение, что были поражены все мужчины в Эдоме
  alternative: Смягчить до «разбил эдомитян» либо пояснить это как полное истребление
  rationale: Еврейский текст прямо сообщает о насилии и его масштабе. Перевод не смягчает утверждение, но и не добавляет отсутствующего в стихе толкования.
- issue: Определение субъекта глагола וַיַּךְ
  choice: Сохранить местоимение «он», как в еврейском тексте
  alternative: Явно назвать Иоава или Давида
  rationale: Грамматически ближайшим возможным субъектом является Иоав, однако явное имя в исходном тексте не повторено. Местоимение сохраняет формальную неоднозначность и связь со следующим стихом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет фоновую повествовательную конструкцию исходного текста; конечное тире показывает, что предложение продолжается в следующем стихе.
