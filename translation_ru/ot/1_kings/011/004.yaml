base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: ru
  text: Когда Соломон состарился, его жёны склонили его сердце к другим богам, и его сердце не было всецело предано Яхве, его Богу,[a] как сердце Давида, его отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце его не было цельным с Яхве, его Богом». Здесь говорится о неразделённой верности Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: Когда Соломон состарился
  rationale: Естественно передаёт временную конструкцию «ко времени старости Соломона», не утяжеляя современный русский текст.
- source_word: נָשָׁיו
  choice: его жёны
  rationale: Прямое соответствие форме множественного числа с притяжательным суффиксом.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: склонили его сердце
  rationale: Сохраняет каузативное значение глагола נטה и образ сердца; не усиливает смысл до явно выраженного «совратили».
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: к другим богам
  rationale: В русском языке направление сердечной склонности естественнее выражается предлогом «к»; понятие следования за иными богами остаётся ясным из контекста.
- source_word: לְבָבוֹ
  choice: сердце его
  rationale: Сохраняет библейский антропологический образ, охватывающий волю, мысли и верность.
- source_word: שָׁלֵם עִם
  choice: всецело предано
  rationale: Передаёт целостность и неразделённость сердца в отношениях с Богом естественным литературным русским выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: как сердце его отца Давида
  rationale: Сохраняет явное сравнение именно сердец и естественный русский порядок слов.
theological_decisions:
- issue: Значение שָׁלֵם применительно к сердцу Соломона
  choice: всецело предано
  alternative: цельно с; нераздельно с; совершенно предано
  rationale: Выражение указывает на полноту и неразделённость верности Яхве. Выбранный вариант понятен современному читателю и не сводит смысл к безгрешности.
- issue: Упоминание «других богов»
  choice: другим богам
  alternative: чужим богам
  rationale: אֱלֹהִים אֲחֵרִים буквально означает «другие боги»; это сохраняет формулировку текста, не подменяя религиозную противоположность этнической чуждостью.
translation_notes:
  register: Современный литературный русский язык с сохранением библейских образов «сердца» и личного имени Яхве. Синтаксис плавный и доступный; архаизмы не используются.
