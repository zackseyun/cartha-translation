  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: ru
  text: 'Царь Соломон любил многих чужеземных женщин[a]: моавитянок, аммонитянок, идумеянок, сидонянок и хеттеянок, а также дочь фараона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многих чужеземных жён». В еврейском тексте буквально сказано «многих чужеземных женщин»; из контекста видно, что это были женщины, которых Соломон брал в жёны или в наложницы.'
    reason: 'Лексическая альтернатива: контекст позволяет уточнение «жёны», но основной текст сохраняет более общее слово оригинала.'
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: Царь Соломон
  rationale: Союз וְ продолжает повествование и в современном русском не требует отдельной передачи в начале предложения; титул и имя переданы прямо.
- source_word: אָהַב
  choice: любил
  rationale: Прямое значение глагола — «любить»; его не следует ослаблять до «был расположен» или истолковывать как одно лишь желание.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: многих чужеземных женщин
  rationale: Сохраняется буквальное «женщин», а не более узкое «жён»; נָכְרִיּוֹת обозначает принадлежность к другим народам.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: в том числе дочь фараона
  rationale: Оборот естественно добавляет дочь фараона к уже названным чужеземным женщинам и выражает включение без противопоставления.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: моавитянок, аммонитянок, идумеянок, сидонянок и хеттеянок
  rationale: Женские названия народов естественно передают ряд этнонимов; «сидонянок» сохраняет конкретную отсылку к Сидону.
theological_decisions:
- issue: Передавать נָשִׁים как «женщин» или «жён»
  choice: женщин
  alternative: жён
  rationale: В стихе употреблено общее слово «женщины». Брачный или консортный характер отношений следует из контекста, но не должен подменять лексическую форму исходного текста.
- issue: Включена ли дочь фараона в число чужеземных женщин
  choice: 'включена: «в том числе дочь фараона»'
  alternative: 'выделена как отдельная категория: «а также дочь фараона»'
  rationale: Добавительная конструкция естественно допускает и в данном контексте поддерживает включение дочери фараона в названную группу, хотя её положение в синтаксическом ряду несколько выделено.
translation_notes:
  register: Современный литературный русский, ясный и достойный. «Чужеземные» точнее и естественнее в библейском историческом контексте, чем нейтральное «иностранные»; этнонимы даны в привычных русских формах женского рода.
