  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: ru
  text: 'И сказал он Иеровоаму: «Возьми себе десять кусков[a], потому что так говорит Яхве, Бог Израиля: „Вот, Я разрываю царство из руки Соломона и отдам тебе десять колен“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «десять оторванных кусков». Еврейское слово обозначает куски, получившиеся при разрывании, и связывает слова Ахии с его символическим действием с одеждой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: Возьми себе
  rationale: Императив קַח передан как «возьми», а личный дательный לְךָ — естественным русским «себе».
- source_word: קְרָעִים
  choice: кусков
  rationale: Существительное от корня קרע «разрывать» обозначает части разорванной одежды; «куски» естественно в контексте, а связь с разрыванием пояснена в сноске.
- source_word: כִּי כֹה אָמַר
  choice: потому что так говорит
  rationale: Сохраняет причинную связь כִּי и узнаваемую пророческую формулу כֹה אָמַר в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не заменой титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная русская передача конструкции принадлежности.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» сохраняет функцию привлечения внимания и непосредственность высказывания без архаичного «се».
- source_word: קֹרֵעַ
  choice: вырываю
  rationale: Причастие передаёт яркое, представленное как совершающееся действие; «вырываю» согласуется с образом изъятия из руки и в русском применимо к царству из-под власти Соломона.
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: Прямое и обычное соответствие обозначению царства как политического владения.
- source_word: מִיַּד שְׁלֹמֹה
  choice: из руки Соломона
  rationale: Сохранён древнееврейский образ руки как власти или обладания, важный для выразительности пророчества.
- source_word: וְנָתַתִּי לְךָ
  choice: и отдам тебе
  rationale: Перфект с вавом в пророческой последовательности естественно передаётся будущим временем; «отдам» идиоматично выражает передачу владения.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: десять колен
  rationale: «Колена Израиля» — понятное и устойчивое библейское обозначение племенных объединений; определённость устанавливается контекстом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя; «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Аспект действия קֹרֵעַ
  choice: Я вырываю
  alternative: Я вырву; Я разрываю
  rationale: Настоящее время сохраняет живую, представленную как уже совершающуюся пророческую сцену. «Вырываю» передаёт лишение Соломона власти, тогда как буквальное «разрываю царство» в современном русском менее естественно; связь с символическим разрыванием одежды остаётся в ближайшем контексте.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи, без архаизмов «се» и «ибо». Сохранены имя Яхве, образ руки как власти и вводное «вот». Местоимение Бога внутри прямой речи написано с прописной буквы по устойчивой русской библейской издательской норме.
