  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: ru
  text: Иеровоам был человеком выдающихся способностей[a]. Соломон увидел, что молодой человек усердно трудится, и поставил его над всеми работами, возложенными на дом Иосифа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильным и доблестным человеком». Еврейское выражение может указывать на силу, доблесть или выдающиеся способности.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Иосифа» — племена, происходившие от Иосифа, прежде всего Ефрем и Манассия.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Иеровоам был человеком
  rationale: Начальное וְ продолжает повествование, но отдельного временного «теперь» не выражает. По-русски естественно назвать Иеровоама прямо, не воспроизводя тяжеловесное «человек Иеровоам».
- source_word: גִּבּוֹר חָיִל
  choice: способным и деятельным
  rationale: Устойчивое сочетание может обозначать силу, доблесть, состоятельность или выдающиеся способности. В данном административном контексте речь, вероятнее всего, о заметной дееспособности Иеровоама, а не обязательно о воинской доблести; примечание сохраняет широту выражения.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямое соответствие глаголу ראה; последующая придаточная часть объясняет, что именно Соломон заметил.
- source_word: הַנַּעַר
  choice: этот молодой человек
  rationale: נַעַר может означать юношу, молодого человека или слугу. Здесь взрослому человеку поручают надзорную должность, поэтому возрастно-статусное «молодой человек» подходит лучше, чем «мальчик» или «слуга».
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: что этот молодой человек усердно трудится
  rationale: 'Буквально: «что он — делающий работу». В контексте оборот характеризует его трудолюбие и объясняет назначение; русское выражение передаёт эту оценку без чрезмерного уточнения рода работы.'
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: поставил его над
  rationale: Каузативная форма פקד здесь означает назначить или поставить кого-либо ответственным за определённую область.
- source_word: לְכָל סֵבֶל
  choice: над всей трудовой повинностью
  rationale: סֵבֶל обозначает тяжёлую, возложенную как повинность работу или связанную с ней рабочую службу. «Трудовая повинность» передаёт общественно-административный характер выражения, не сводя его просто к обычной рабочей силе.
- source_word: בֵּית יוֹסֵף
  choice: дома Иосифа
  rationale: Сохранено библейское родоплеменное обозначение; его значение поясняется в примечании.
