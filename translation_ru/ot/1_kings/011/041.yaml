base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: ru
  text: Прочие деяния Соломона, всё, что он сделал, и его мудрость — разве всё это не записано в Книге деяний Соломона?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Книга летописей Соломона». Буквально еврейское название содержит выражение «слова (дела, события) Соломона» — устойчивое обозначение записи о его деяниях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Прочие деяния Соломона
  rationale: יֶתֶר обозначает оставшуюся часть сведений, а דִּבְרֵי в формуле завершения царствования означает дела или события правления. «Прочие деяния» естественно и точно передаёт историографический смысл без буквального, но неуместного здесь «слова».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он сделал
  rationale: Сохраняет широкий смысл עשה и не уточняет характер или успешность совершённого.
- source_word: וְחָכְמָתוֹ
  choice: и его мудрость
  rationale: Прямая передача существительного с местоименным суффиксом; мудрость выделена как самостоятельная примечательная сторона царствования Соломона.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: разве не записаны они
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ. «Записаны» естественно для ссылки на письменный источник и соответствует значению пассивной формы כְּתֻבִים.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя предлог буквально может передаваться как «на», по-русски о содержащемся в письменном источнике естественно говорить «записано в книге». סֵפֶר может обозначать книгу или свиток; здесь выбран традиционный общий термин.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: Книга деяний Соломона
  rationale: Название передаёт предполагаемый характер источника — запись дел царя — и сохраняет связь с первым употреблением דִּבְרֵי в стихе. Вариант «летопись» возможен, но более интерпретативен и вынесен в сноску.
