base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: ru
  text: Он собрал вокруг себя людей и стал предводителем отряда, когда Давид убил их. Они отправились в Дамаск[a], поселились там и царствовали в Дамаске.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте во всей заключительной части стиха стоят глаголы во множественном числе: «они отправились… поселились… царствовали». В некоторых переводах здесь употреблено единственное число («он»), поскольку в контексте речь сосредоточена на Резоне.'
    reason: Сохранение грамматического напряжения исходного текста и указание распространённого альтернативного прочтения.
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Он собрал вокруг себя людей
  rationale: Оборот קבץ с עַל и местоименным суффиксом передаёт собирание сторонников вокруг себя. Русское «собрал вокруг себя людей» естественно выражает и действие, и направленность.
- source_word: שַׂר גְּדוּד
  choice: предводителем отряда
  rationale: שַׂר означает начальника или предводителя, а גְּדוּד — отряд либо вооружённую группу. Нейтральное «отряд» не добавляет прямо не выраженного в тексте значения разбойничьего или набегового формирования.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: когда Давид убивал их
  rationale: ב с инфинитивом-сопряжённой формой обозначает временное обстоятельство. Несовершенный вид «убивал» естественно передаёт обстоятельственный и процессуальный оттенок, а местоимение «их» сохраняет неоднозначность своего референта.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Они отправились в Дамаск
  rationale: Перевод сохраняет множественное число глагола и ясно передаёт направленное движение к Дамаску.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: поселились там
  rationale: В контексте переселения ישב естественно означает «поселиться, обосноваться»; «там» идиоматично передаёт местоименный суффикс женского рода, относящийся к Дамаску как месту.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: стали царствовать в Дамаске
  rationale: Глагол מלך в породе qal означает «царствовать, быть царём». Формулировка сохраняет как его царскую семантику, так и множественное число еврейского глагола.
theological_decisions:
- issue: Множественное число глаголов в заключительной части стиха при том, что повествовательный контекст сосредоточен на Резоне
  choice: 'Сохранить множественное число: «Они отправились… поселились… стали царствовать»'
  alternative: 'Согласовать с Резоном в единственном числе: «Он отправился… поселился… стал царствовать»'
  rationale: Масоретский текст последовательно употребляет во всех трёх заключительных сказуемых формы множественного числа. Их сохранение отражает исходный текст и не устраняет толкованием имеющееся повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; архаизмы избегаются. «Предводитель отряда» сохраняет военный смысл без излишней конкретизации, а непривычное множественное «стали царствовать» намеренно удерживает грамматику еврейского текста.
