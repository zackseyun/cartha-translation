source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: ru
  text: за то, что они оставили Меня и поклонялись Астарте[a], божеству сидонян, Хамосу, богу Моава, и Милкому[b], богу аммонитян, и не ходили Моими путями, не делали того, что правильно в Моих глазах, и не исполняли Моих установлений и законов, как Давид, его отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально означает «божество сидонян»; возможны также переводы: «бог сидонян» или «богиня сидонян», поскольку Астарта была женским божеством.'
    reason: lexical_alternative
  - marker: b
    text: Здесь в еврейском тексте стоит имя «Милком»; иногда его связывают с Молохом.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Сохраняет причинное значение и естественно продолжает формулировку приговора из предыдущего стиха.
- source_word: עֲזָבוּנִי
  choice: они оставили Меня
  rationale: Передаёт заветное отступничество естественным современным русским языком; прописная буква у местоимения поддерживает принятый библейский регистр.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонялись
  rationale: В данном культовом контексте глагол обозначает поклонение с земным поклоном; русский глагол передаёт и действие, и его религиозный смысл.
- source_word: לְעַשְׁתֹּרֶת
  choice: Астарте
  rationale: Использована закрепившаяся в современном русском языке форма имени западносемитской богини; дательный падеж обусловлен глаголом «поклонялись».
- source_word: אֱלֹהֵי צִדֹנִין
  choice: божеству сидонян
  rationale: Слово «божество» сохраняет формальную неопределённость еврейского אֱלֹהֵי и позволяет не вносить в основной текст грамматическое противоречие между формой выражения и известным женским образом Астарты.
- source_word: לִכְמוֹשׁ
  choice: Хамосу
  rationale: Традиционная и узнаваемая русская передача имени моавитского божества.
- source_word: וּלְמִלְכֹּם
  choice: Милкому
  rationale: Следует масоретскому чтению מִלְכֹּם, не подменяя его известным, но не тождественным именем Молох.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: и не ходили Моими путями
  rationale: Сохраняет понятную в русском библейскую метафору образа жизни и верности Божьей воле.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: не делали угодного в Моих глазах
  rationale: Передаёт нормативную оценку Бога и сохраняет образ «в Моих глазах», избегая тяжеловесного «правильного» в данном контексте.
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: и не исполняли Моих установлений и законов
  rationale: В русском языке установления и законы естественно «исполняют»; добавление глагола раскрывает единое управление еврейского עשה без изменения смысла.
- source_word: כְּדָוִד אָבִיו
  choice: как Давид, его отец
  rationale: Сохраняет мужской единственный суффикс и естественно относит его к Соломону, сыну Давида, о котором вынесен приговор.
theological_decisions:
- issue: Родовое обозначение Астарты при אֱלֹהֵי
  choice: божеству сидонян
  alternative: богине сидонян; богу сидонян
  rationale: Астарта почиталась как богиня, тогда как форма אֱלֹהֵי сама по себе не маркирует женский род. Нейтральное «божество» не исправляет источник молча и не создаёт в русском тексте явно ошибочного согласования.
- issue: Отождествление Милкома с Молохом
  choice: Милком
  alternative: Молох
  rationale: Масоретский текст данного стиха прямо содержит имя Милком; возможная связь с Молохом отмечена отдельно, но не внесена в основной текст.
- issue: Референт выражения «его отец»
  choice: Давид как отец Соломона
  alternative: Давид как династический предок другого лица
  rationale: Контекст приговора касается Соломона, а Давид был его непосредственным отцом; текст не требует расширительного династического толкования.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Сохранены понятные образы «ходить путями» и «в Моих глазах», но синтаксис правовых терминов сделан естественным для русского языка. Имена переданы в узнаваемых русских формах.
