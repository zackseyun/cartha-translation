  terminology: '«Астарта», «Хамос», «Милком», «Моав» и «аммонитяне» употреблены в узнаваемых русских библейских формах. «Установления и законы» адекватно передаёт חֻקּוֹתַי וּמִשְׁפָּטַי. Примечание к Астарте следует сформулировать так, чтобы не объявлять мужской род единственно буквальным смыслом: еврейское אֱלֹהֵי здесь допускает общее «божество».'
