  source_fidelity: В целом перевод точно передаёт причинную конструкцию, перечень божеств, масоретское имя «Милком», образ «ходить Моими путями» и сопоставление с Давидом. Однако «угодного в Моих глазах» смещает הַיָּשָׁר («правое, правильное») к значению «приятное/угодное» и потому нуждается в уточнении. Нейтральное «божеству сидонян» оправданно сохраняет неоднозначность родового обозначения при Астарте, не навязывая русское «бог» или «богиня».
