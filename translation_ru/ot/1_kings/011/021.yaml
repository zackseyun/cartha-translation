base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: ru
  text: 'Когда Адад услышал в Египте, что Давид почил со своими предками[a] и что Иоав, военачальник, умер, он сказал фараону: «Отпусти меня, и я пойду в свою землю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг со своими отцами» — обычное древнееврейское выражение, означающее смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: услышал
  rationale: Передаёт обычное значение глагола и в данном повествовательном контексте естественно означает, что Адад получил известие.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: почил со своими предками
  rationale: Сохраняет образ устойчивой древнееврейской формулы о смерти, но звучит понятнее и естественнее для современного русского читателя, чем буквальное «лёг со своими отцами».
- source_word: מֵת
  choice: умер
  rationale: Естественно передаёт сообщение о смерти Иоава; вариант «был мёртв» формально подчёркивает результирующее состояние, но в русском придаточном звучит менее плавно.
- source_word: שַׂר הַצָּבָא
  choice: военачальник
  rationale: Краткое и современное обозначение начальника войска без архаичного оттенка.
- source_word: שַׁלְּחֵנִי
  choice: отпусти меня
  rationale: В контексте обращения к фараону глагол выражает просьбу разрешить Ададу покинуть двор; «отпусти» естественно передаёт этот смысл.
- source_word: וְאֵלֵךְ
  choice: и я пойду
  rationale: Передаёт волитивную форму как желаемое действие, следующее за просьбой отпустить.
- source_word: אַרְצִי
  choice: в свою землю
  rationale: Сохраняет основное значение אֶרֶץ и притяжательный суффикс, не сужая выражение до более интерпретирующего «на родину».
