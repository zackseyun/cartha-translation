  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: известие, полученное Ададом в Египте; формулу о кончине Давида; смерть Иоава как военачальника; просьбу к фараону отпустить его; намерение вернуться в свою землю. «Почил со своими предками» является осмысленной литературной передачей формулы «лёг с отцами своими», а сноска сохраняет её буквальный образ. «И я пойду» естественно передаёт волитивное продолжение просьбы; контекст ясно выражает цель просьбы.'
