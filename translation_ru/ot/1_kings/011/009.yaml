  source_fidelity: 'Основной смысл передан точно: Яхве разгневался на Соломона, поскольку сердце Соломона отвратилось от Яхве, Бога Израиля. Однако «являвшегося ему дважды» с несовершенным видом может означать повторяющееся или продолжающееся явление; в контексте и при פַּעֲמָיִם речь о двух состоявшихся явлениях. Совершенный вид точнее передаёт эту отсылку.'
