  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: ru
  text: И разгневался Яхве на Соломона за то, что сердце его уклонилось от Яхве, Бога Израиля, который дважды явился ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: И разгневался
  rationale: Форма передаёт наступление или проявление гнева; совершенный вид естественно выражает это в русском повествовании, не усиливая значение до «пришёл в ярость».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в исходном тексте и не заменяет имя титулом.
- source_word: בִּשְׁלֹמֹה
  choice: на Соломона
  rationale: Предлог ב при глаголе гнева по-русски идиоматично передаётся сочетанием «разгневаться на».
- source_word: כִּי
  choice: за то, что
  rationale: Союз вводит причину гнева; «за то, что» естественно связывается с русской конструкцией «разгневался на ...».
- source_word: נָטָה לְבָבוֹ
  choice: сердце его уклонилось
  rationale: Сохраняется образ сердца и значение отклонения от верности; «уклонилось» звучит естественно и достойно в данном контексте.
- source_word: מֵעִם
  choice: от
  rationale: Обозначает удаление и разрыв прежней приверженности; направление уже выражено глаголом «уклонилось».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая и прозрачная передача сопряжённой конструкции, сохраняющая отождествление Яхве с Богом Израиля.
- source_word: הַנִּרְאָה אֵלָיו
  choice: являвшегося ему
  rationale: Определённое причастие относится к Яхве, Богу Израиля; русское причастие сохраняет атрибутивную форму и указывает на предшествующие явления.
- source_word: פַּעֲמָיִם
  choice: дважды
  rationale: Естественная русская передача еврейской двойственной формы со значением двух раз.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В стихе непосредственно употреблено личное имя; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Антропопатическое описание Божьего гнева
  choice: разгневался
  alternative: был разгневан; пришёл в ярость
  rationale: Перевод прямо сохраняет приписываемый Яхве гнев в ответ на отступление Соломона, не смягчая и не усиливая выражение.
- issue: Образ сердца как средоточия верности
  choice: сердце его уклонилось
  alternative: он отвернулся; сердце его отступило
  rationale: Сохранён исходный образ сердца и направленного отклонения от Яхве, без сведения смысла лишь к внешнему поступку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок «сердце его» выбран ради плавности и достоинства фразы; архаичные формы и конфессионально обусловленная замена имени Яхве титулом не используются.
