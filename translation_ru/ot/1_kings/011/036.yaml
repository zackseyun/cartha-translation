  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: ru
  text: Но его сыну Я дам одно колено, чтобы у Давида, раба Моего, всегда был светильник[a] предо Мною в Иерусалиме — городе, который Я избрал Себе, чтобы поместить там Моё имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свет». Евр. «светильник» — образ продолжения династии Давида или её неизменного царского присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט אֶחָד
  choice: одно колено
  rationale: В контексте разделения царства שֵׁבֶט обозначает племенную и политическую единицу, а не скипетр.
- source_word: לְמַעַן הֱיוֹת
  choice: чтобы ... был
  rationale: Передаёт целевое значение конструкции естественным русским оборотом.
- source_word: נִיר
  choice: светильник
  rationale: Сохраняет конкретную династическую метафору непрерывности рода Давида; перевод «свет» сделал бы образ менее точным.
- source_word: לְדָוִיד עַבְדִּי
  choice: у Давида, раба Моего
  rationale: Дательный участника при הֱיוֹת естественно передан конструкцией обладания «у Давида ... был»; приложение сохраняет почётное обозначение Давида как Божьего раба.
- source_word: כָּל הַיָּמִים
  choice: всегда
  rationale: Современно и кратко передаёт идиому постоянной, продолжающейся длительности.
- source_word: לְפָנַי
  choice: предо Мною
  rationale: Сохраняет библейский образ пребывания перед Богом и соответствует достоинству регистра.
- source_word: בָּחַרְתִּי לִי
  choice: Я избрал Себе
  rationale: Сохраняет значимый возвратный дательный לִי и завершённое избрание города Богом.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: чтобы утвердить там Моё имя
  rationale: «Утвердить имя» естественнее по-русски, чем буквальное «положить имя», и сохраняет формулу имени, не заменяя её толкованием о присутствии или поклонении.
- source_word: וְלִבְנוֹ
  choice: Но его сыну
  rationale: Союз в контексте выражает противопоставление предшествующему отнятию царства.
theological_decisions:
- issue: Династическая метафора נִיר
  choice: «светильник» как образ продолжающейся династии Давида перед Богом
  alternative: «свет» как более общая метафора
  rationale: Конкретный образ светильника сохраняет богословскую напряжённость текста и не подменяет метафору прямым объяснением о царском роде.
- issue: Богословие имени в לָשׂוּם שְׁמִי שָׁם
  choice: сохранить формулу «утвердить там Моё имя»
  alternative: «являть там Моё присутствие» или «чтобы там поклонялись Мне»
  rationale: Исходный текст говорит об имени Бога; перевод не должен сводить эту формулу к одному из возможных богословских толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «Я», «Моего», «Мною», «Себе», «Моё» пишутся с прописной буквы как уважительное обозначение Бога. Тире перед приложением «городе» облегчает длинную синтаксическую конструкцию.
