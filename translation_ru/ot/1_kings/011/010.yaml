base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: ru
  text: 'и заповедал ему об этом: не следовать за другими богами[a], но он не исполнил того, что повелел Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не идти вслед за другими богами» — устойчивое выражение, означающее обратиться к иным богам и поклоняться им.'
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: и заповедал ему
  rationale: Форма перфекта с союзом продолжает предыдущее описание Божьих действий. Русское «заповедал ему» естественно передаёт глагол צוה и адресата; отдельное выражение предпрошедшего времени в русском не требуется.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: об этом
  rationale: В данном контексте הַדָּבָר הַזֶּה указывает на уже названное требование. «Об этом» звучит естественнее буквального «об этом деле» и сохраняет отсылку к контексту.
- source_word: לְבִלְתִּי לֶכֶת
  choice: не следовать
  rationale: Конструкция выражает содержание запрета. «Не следовать» передаёт как образ движения, так и подразумеваемую религиозную приверженность.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: за другими богами
  rationale: Сочетание сохраняет древнееврейский заветный образ следования за иными божествами и остаётся понятным по-русски.
- source_word: וְלֹא שָׁמַר
  choice: но он не исполнил
  rationale: Союз передан противительным «но», поскольку поступок Соломона противопоставлен Божьему запрету. В контексте повеления שמר означает соблюсти или исполнить его.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: того, что повелел Яхве
  rationale: Оборот сохраняет содержание относительного придаточного. «Повелел» позволяет избежать тяжёлого повтора «заповедал», не меняя смысла צוה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией тетраграмматона, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Смысл выражения «идти вслед за другими богами»
  choice: не следовать за другими богами
  alternative: не ходить вслед за другими богами
  rationale: Выбранный вариант сохраняет заветный образ обращения к иным богам и поклонения им, не сводя выражение к буквальному перемещению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Структура продолжает предыдущее предложение, поэтому текст начинается со строчной буквы и союза «и». Двоеточие ясно вводит содержание заповеди.
