  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: ru
  text: Ведь Иоав и весь Израиль[a] оставались там шесть месяцев, пока он не истребил[b] всех мужчин в Эдоме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «всем Израилем» здесь, вероятно, подразумевается израильское войско, находившееся с Иоавом, а не всё население страны.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «отсек»; то есть уничтожил, истребил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предыдущему утверждению; «ведь» естественно передаёт объяснительно-причинный оттенок.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: шесть месяцев
  rationale: Числительное с существительным обозначает продолжительность пребывания.
- source_word: יָשַׁב שָׁם
  choice: оставались там
  rationale: В данном военном контексте יָשַׁב означает продолжительное пребывание, а не оседлое жительство; множественное число по-русски согласуется с составным подлежащим.
- source_word: יוֹאָב וְכָל יִשְׂרָאֵל
  choice: Иоав и весь Израиль
  rationale: Сохранено коллективное обозначение исходного текста; здесь оно, вероятно, относится к израильскому войску при Иоаве.
- source_word: עַד
  choice: пока … не
  rationale: Естественная русская конструкция, обозначающая предел продолжавшегося действия.
- source_word: הִכְרִית
  choice: истребил
  rationale: Порода hифиль глагола כרת в этом контексте означает устранить, уничтожить; «истребил» ясно передаёт смысл еврейской идиомы «отсекать».
- source_word: כָּל זָכָר
  choice: всех мужчин
  rationale: זָכָר буквально обозначает лицо мужского пола. В контексте военной расправы естественное русское «мужчин» сохраняет референцию, не используя менее литературное «особей мужского пола».
- source_word: בֶּאֱדוֹם
  choice: в Эдоме
  rationale: 'Предлог ב имеет здесь локативное значение: действие происходило на территории Эдома.'
