  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: ru
  text: Но одно колено останется за ним[a] ради Моего слуги Давида и ради Иерусалима — города, который Я избрал из всех колен Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одно колено будет у него». Нередко считается, что Вениамин здесь включён в Иуду, в частности из-за расположения Иерусалима, однако сам еврейский текст говорит об «одном колене».'
    reason: Сохранение буквального чтения и пояснение альтернативного толкования без гармонизации основного текста.
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Но одно колено
  rationale: שֵׁבֶט здесь обозначает племенное колено Израиля, а союз וְ по контексту передаёт противопоставление предшествующему разделению царства.
- source_word: יִהְיֶה לּוֹ
  choice: останется за ним
  rationale: Буквально «будет у него»; в контексте отнятия царства речь идёт о сохранении одного колена за сыном Соломона.
- source_word: לְמַעַן
  choice: ради
  rationale: Кратко и естественно передаёт мотив действия — ради Давида и ради избранного города.
- source_word: עַבְדִּי דָוִד
  choice: Моего слуги Давида
  rationale: «Слуга» естественно передаёт почётное заветно-царское наименование עֶבֶד; прописная буква в местоимении соответствует принятому русскому библейскому регистру.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Иерусалима — города
  rationale: Тире ясно оформляет приложение и сохраняет отождествление Иерусалима с избранным городом.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: который Я избрал
  rationale: Совершенный вид передаёт завершённый Божий выбор; еврейское בָהּ идиоматически не выражается отдельно по-русски.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: Предлог מִן при בחר обозначает выбор из совокупности; эта формулировка точна и естественна по-русски.
theological_decisions:
- issue: Числовое напряжение между «одним коленом» здесь и местами, где с Иудеей при Ровоаме связан также Вениамин
  choice: Сохранить буквальное «одно колено»
  alternative: Истолковать его как Иуду вместе с Вениамином либо заменить на «одно царство» или «два колена»
  rationale: Масоретский текст прямо говорит об одном колене. Перевод не должен устранять историко-богословское напряжение посредством гармонизации; возможное объяснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан прозрачным, без архаизмов; местоимения, относящиеся к Богу, написаны с прописной буквы.
