    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: почил ... со своими отцами
  rationale: Устойчивое древнееврейское выражение сообщает о смерти и приобщении к предкам. «Почил» сохраняет образ сна и звучит естественно в достойном повествовательном регистре; «со своими отцами» передаёт формульный и династический характер оборота.
- source_word: וַיִּקָּבֵר
  choice: был погребён
  rationale: Форма нифаль имеет здесь пассивное значение; выбран точный и естественный русский эквивалент.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: в городе Давида, своего отца
  rationale: Передано и название места погребения, и приложенное к имени Давида указание на его родство с Соломоном, сохраняющее династический акцент.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол означает вступление на царство; «воцарился» кратко и естественно выражает смену царя.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Выражение обозначает занятие прежнего положения преемником и точнее сохраняет значение замещения, чем просто «после него».
