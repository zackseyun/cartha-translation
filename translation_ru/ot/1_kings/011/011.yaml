source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: ru
  text: 'И сказал Яхве Соломону: «Поскольку это было с тобой[a] и ты не соблюдал Моего завета и Моих постановлений, которые Я заповедал тебе, Я непременно оторву от тебя царство и отдам его твоему слуге».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это было с тобой». Еврейский оборот идиоматичен и может указывать на сложившееся поведение или состояние Соломона.'
    reason: Лексическая альтернатива и сохранение неоднозначности идиоматического выражения.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: יַעַן אֲשֶׁר הָיְתָה זֹּאת עִמָּךְ
  choice: за то, что ты так поступил
  rationale: Естественно передаёт причинную конструкцию и сжатый еврейский оборот, который в контексте указывает на поведение Соломона; неоднозначность оборота отмечена в сноске.
- source_word: שָׁמַרְתָּ
  choice: соблюдал
  rationale: Подходит к обоим дополнениям — завету и постановлениям — и сохраняет нормативно-заветный смысл глагола.
- source_word: בְּרִיתִי
  choice: Моего завета
  rationale: Сохраняет юридический и богословский вес еврейского термина בְּרִית.
- source_word: חֻקֹּתַי
  choice: Моих постановлений
  rationale: Современное и ясное обозначение установленных Богом обязательных предписаний.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: Я заповедал тебе
  rationale: Естественная русская передача повелительного значения конструкции; глагол «заповедал» уместен в библейском заветном контексте.
- source_word: קָרֹעַ אֶקְרַע
  choice: Я непременно отторгну
  rationale: Наречие передаёт усиление инфинитивом абсолютным, а «отторгну» сохраняет образ насильственного отделения царства.
- source_word: הַמַּמְלָכָה מֵעָלֶיךָ
  choice: у тебя царство
  rationale: Естественно выражает лишение Соломона царской власти и владения, буквально снимаемого с него.
- source_word: לְעַבְדֶּךָ
  choice: твоему слуге
  rationale: В придворно-политическом контексте עֶבֶד обозначает подчинённого царю человека; «слуга» не привносит излишне узкого значения рабства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Толкование הָיְתָה זֹּאת עִמָּךְ
  choice: ты так поступил
  alternative: это было с тобой; это стало твоим состоянием; таково было твоё поведение
  rationale: В контексте выражение называет основание суда — отступничество Соломона. Основной текст передаёт это естественно, а сноска сохраняет буквальную форму и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. Формулировка сохраняет торжественность судебного объявления, оставаясь понятной современному читателю.
