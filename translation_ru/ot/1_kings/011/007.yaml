base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: ru
  text: Тогда Соломон построил святилище на возвышенности для Хамоса, мерзости Моава, на горе напротив Иерусалима, и для Молоха[a], мерзости аммонитян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Милкома». Древнееврейская форма здесь традиционно читается как «Молох», но некоторые связывают её с аммонитским божеством Милкомом.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной переход к следующему событию повествования.
- source_word: יִבְנֶה
  choice: построил
  rationale: Хотя форма глагола морфологически имперфектная, после אָז она обозначает завершённое событие прошлого в повествовательной последовательности.
- source_word: בָּמָה
  choice: святилище на возвышенности
  rationale: Передаёт культовое значение термина и его обычную связь с возвышенным местом; одно слово «высота» в современном русском недостаточно ясно.
- source_word: לִכְמוֹשׁ
  choice: для Хамоса
  rationale: Предлог указывает на посвящение культового места божеству; имя передано в принятой русской библейской форме.
- source_word: שִׁקֻּץ מוֹאָב
  choice: мерзости Моава
  rationale: Сохраняет сильную осудительную характеристику, данную самим повествователем, без поясняющего добавления «бог».
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: на горе напротив Иерусалима
  rationale: Прямо передаёт пространственное значение выражения, не вводя в основной текст более точную географическую идентификацию.
- source_word: וּלְמֹלֶךְ
  choice: и для Молоха
  rationale: Следует масоретской огласовке מֹלֶךְ; возможное отождествление с Милкомом отмечено в сноске.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: мерзости аммонитян
  rationale: Сохраняет параллелизм с «мерзостью Моава», а этноним передаёт בְּנֵי עַמּוֹן естественно для современного русского языка.
theological_decisions:
- issue: Осудительное обозначение чужеземных божеств
  choice: В обоих случаях שִׁקֻּץ переведено как «мерзость»
  alternative: «отвратительное божество» или «мерзкий идол»
  rationale: Осуждение присутствует в самом древнееврейском тексте. Буквенная конструкция сохраняет силу и параллелизм оригинала, не добавляя явно не названное существительное.
- issue: Идентификация מֹלֶךְ
  choice: В основном тексте — «Молох»
  alternative: «Милком»
  rationale: Масоретская огласовка поддерживает чтение «Молох», однако связь с аммонитским Милкомом остаётся обсуждаемой и потому отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выражение «святилище на возвышенности» выбрано ради понятности культового термина בָּמָה; осудительное «мерзость» намеренно сохранено.
