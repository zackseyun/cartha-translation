base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: ru
  text: 'И вот по какой причине он поднял руку на царя[a]: Соломон построил Милло[b] и заделал пролом в городе Давида, отца Соломона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с передачей смысла: «восстал против царя». Буквально в еврейском тексте: «поднял руку на царя».'
    reason: alternative_reading
  - marker: b
    text: Милло — вероятно, название укрепления или сооружения из террас и насыпи в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: причина
  rationale: В обороте וְזֶה הַדָּבָר אֲשֶׁר слово вводит объяснение поступка Иеровоама; «причина» естественно передаёт эту функцию, хотя буквально возможно «дело».
- source_word: הֵרִים יָד
  choice: поднял руку на
  rationale: Сохранён понятный по-русски образ еврейской идиомы, обозначающей враждебное выступление или мятеж; более истолковывающее «восстал против» вынесено в примечание.
- source_word: בַּמֶּלֶךְ
  choice: на царя
  rationale: Предлог при идиоме указывает на объект враждебного действия; определённое «царя» точно соответствует тексту, а Соломон назван далее.
- source_word: הַמִּלּוֹא
  choice: Милло
  rationale: Это особое название иерусалимского сооружения или участка укреплений; из-за неуверенности в точном устройстве предпочтена транслитерация с пояснением.
- source_word: סָגַר
  choice: заделал
  rationale: Глагол буквально означает «закрыл»; применительно к пролому естественное русское «заделал» сохраняет образ и не добавляет более широкого смысла «укрепил».
- source_word: פֶּרֶץ
  choice: пролом
  rationale: В контексте городских укреплений обозначает брешь или разрыв; «пролом» точно и понятно передаёт значение.
- source_word: עִיר דָּוִד
  choice: город Давида
  rationale: Устоявшееся обозначение иерусалимской крепости, связанной с Давидом.
- source_word: אָבִיו
  choice: своего отца
  rationale: Возвратное местоимение недвусмысленно относит Давида к Соломону; слово передано в обычном прямом значении.
