base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: ru
  text: Соломон последовал за Ашторет[a], богиней сидонян, и за Милкомом[b], мерзостью аммонитян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Астарта» — более распространённая форма имени этого божества.
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь «Милком». Иногда его связывают с Молохом, однако имя «Молох» в этом стихе не употреблено.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: последовал за
  rationale: Еврейский оборот הלך אחרי обозначает следование кому-либо в верности или поклонении, а не просто физическое движение. Русское «последовал за» сохраняет образ исходного текста и не вводит прямо глагол «поклонялся».
- source_word: עַשְׁתֹּרֶת
  choice: Астарта
  rationale: Передача имени «Астарта» укоренилась в современном русском литературном и историческом употреблении и соответствует обозначаемому западносемитскому божеству; еврейская форма имени отмечена в сноске.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: богиней сидонян
  rationale: Форма אֱלֹהֵי морфологически допускает «бог/боги», однако здесь стоит в приложении к имени единственного женского божества. «Богиней» ясно передаёт референт, не меняя смысла словосочетания.
- source_word: מִלְכֹּם
  choice: Милкомом
  rationale: Масоретский текст данного стиха читает «Милком», поэтому имя передано транслитерацией и не заменено на «Молох».
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: мерзостью аммонитян
  rationale: שִׁקּוּץ — сильное неодобрительное обозначение чего-либо отвратительного, нередко идола. «Мерзость» сохраняет оценочную силу и традиционную библейскую выразительность.
theological_decisions:
- issue: Следует ли прямо назвать действие Соломона идолопоклонством
  choice: 'Сохранить образ следования: «последовал за»'
  alternative: «поклонялся»
  rationale: Контекст указывает на отступничество и поклонение чужим божествам, но сам стих употребляет идиому «идти/следовать за». Выбранная передача сохраняет формулировку и богословское напряжение исходного текста.
- issue: Род обозначения Астарты при форме אֱלֹהֵי
  choice: «богиней сидонян»
  alternative: «божеством сидонян» или формально «богом сидонян»
  rationale: Имя относится к женскому божеству, а выражение служит приложением к нему. Русское «богиней» естественно согласуется с референтом; буквальная морфологическая особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Последовал за» понятно широкому читателю и сохраняет исходную идиому; «мерзость» намеренно удерживает сильную отрицательную оценку текста.
