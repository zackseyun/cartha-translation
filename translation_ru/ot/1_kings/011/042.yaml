  yaml_path: translation/ot/1_kings/011/042.yaml
  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: ru
  text: И царствовал Соломон в Иерусалиме над всем Израилем сорок лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: И царствовал… сорок лет
  rationale: Еврейская конструкция буквально говорит о «днях, в которые» Соломон царствовал, то есть о продолжительности его правления. В современном русском языке естественнее выразить это прямо, не утрачивая смысла и сохраняя начальное וְ как повествовательное «И».
- source_word: מָלַךְ
  choice: царствовал
  rationale: Форма Qal обозначает осуществление царской власти; «царствовал» — точный и традиционно понятный русский эквивалент.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: בִ/ירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Предлог בְּ имеет здесь местное значение, естественно передаваемое русским «в».
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Предлог עַל обозначает власть царя над народом, а «весь Израиль» сохраняет собирательное национально-политическое значение исходного выражения.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямая передача указанной продолжительности царствования.
