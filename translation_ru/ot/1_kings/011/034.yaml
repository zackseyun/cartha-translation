  source_fidelity: 'Смысл в целом передан точно: речь о том, что всё царство не будет отнято у Соломона, ради Давида, избранного Божьего слуги, соблюдавшего заповеди и установления. Однако אֲשִׁתֶנּוּ означает «Я поставлю/сделаю его», а не «Я оставлю его»; контекстуальное сглаживание меняет выраженное действие.'
  naturalness: Текст литературный, ясный и выдержан в современном библейском регистре. «Правителем» — естественное и достаточно широкое соответствие נָשִׂיא.
  terminology: «Заповеди и установления» удачно сохраняет различие между מִצְוֺתַי и חֻקּוֹתָי. «Слуга» для עַבְדִּי уместно. Божественные местоимения с прописной буквы соответствуют принятому русскому библейскому оформлению.
