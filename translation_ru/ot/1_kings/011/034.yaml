  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: ru
  text: Но Я не отниму у него всё царство, потому что Я поставлю его правителем на все дни его жизни — ради Давида, Моего слуги, которого Я избрал, который соблюдал Мои заповеди и установления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: правителем
  rationale: В данном контексте слово обозначает того, кто стоит во главе царства; «правителем» естественно по-русски и не вносит более узкого титула «князь».
- source_word: אֲשִׁתֶנּוּ
  choice: Я оставлю его
  rationale: Буквально форма означает «Я поставлю его», однако в контексте Соломон уже царствует; по-русски «оставлю его правителем» ясно передаёт продолжение его власти на протяжении жизни.
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: Мои заповеди и установления
  rationale: Сохранено различие между מִצְוֹת — заповедями — и חֻקּוֹת — установленными предписаниями.
theological_decisions:
- issue: Основание сохранения власти Соломона
  choice: ради Давида, Моего слуги
  alternative: из-за Давида, раба Моего
  rationale: «Ради» точно передаёт לְמַעַן как указание на благоволение к Давиду; «слуга» сохраняет достоинство формулы עַבְדִּי без ненужной для современного русского ассоциации с рабством.
- issue: Характеристика верности Давида
  choice: который соблюдал Мои заповеди и установления
  alternative: за то, что он соблюдал Мои заповеди и уставы
  rationale: Сохранено прямое относительное придаточное оригинала без попытки согласовать это обобщение с отдельными рассказами о проступках Давида.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Синтаксис слегка упрощён двоеточием, которое естественно выражает пояснительное отношение второй части к первой.
