  source_fidelity: 'Основной смысл передан верно: фараон спрашивает, чего Ададу недостаёт у него, и почему тот стремится уйти в свою страну; ответ «Ничего» сохраняет эллиптическое לֹא. Однако «хочешь уйти» несколько ослабляет מְבַקֵּשׁ («стремишься», «добиваешься»). Сноска неточно называет буквальным соответствием «отпуская, отпусти меня»: еврейский инфинитив абсолютный здесь служит для усиления, а не соответствует русскому деепричастию.'
