base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: ru
  text: 'Фараон сказал ему: «Но чего тебе у меня недостаёт, что ты стремишься уйти в свою страну?» Тот ответил: «Ничего. Но всё же отпусти меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «непременно отпусти меня». Инфинитив абсолютный, соединённый с личной формой того же глагола, усиливает просьбу.'
    reason: Точно объясняет эмфатическую еврейскую конструкцию без ложной имитации её русским деепричастием.
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В вопросе фараона союз вводит возражение на просьбу Адада и естественно передаётся русским «но».
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: чего тебе недостаёт у меня
  rationale: Передаёт значение состояния нужды или недостатка и сохраняет личный, придворный контекст выражения עִמִּי.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: что ты хочешь
  rationale: Внутри вопроса הִנֵּה привлекает внимание к намерению собеседника, а причастие בקש выражает стремление; буквальное «вот, ты ищешь» по-русски было бы неестественно.
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: уйти в свою страну
  rationale: «Уйти» естественно выражает отбытие от фараона, не добавляя прямо не названного значения «вернуться»; возвратное «свою» передаёт притяжательный суффикс.
- source_word: לֹא
  choice: Ничего
  rationale: Краткое отрицание эллиптически отвечает на вопрос о том, чего недостаёт Ададу; «ничего» ясно восполняет подразумеваемый смысл.
- source_word: כִּי
  choice: Но всё же
  rationale: Союз противопоставляет отсутствие недостатка настойчивой просьбе об отпуске; «всё же» естественно передаёт этот поворот мысли.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: отпусти меня
  rationale: Глагол означает отпустить или позволить уйти; усиление конструкции отмечено сноской, чтобы основной текст оставался естественным.
