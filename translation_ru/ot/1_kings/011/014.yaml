  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: ru
  text: И Яхве воздвиг против Соломона противника[a] — Адада-эдомитянина. Он происходил из царского рода Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. сатан — здесь «противник» или «соперник», а не имя собственное Сатана.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: воздвиг
  rationale: Порода hифиль глагола קום выражает побуждение к появлению или выступлению. «Воздвиг» сохраняет прямое действие Бога и естественно сочетается с «противником».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: שָׂטָן
  choice: противника
  rationale: Здесь слово употреблено как нарицательное обозначение человеческого политического противника, которым далее назван Адад, а не как имя собственное Сатаны.
- source_word: לִשְׁלֹמֹה
  choice: против Соломона
  rationale: При שָׂטָן предлог ל указывает на того, кому противостоит названный противник.
- source_word: הֲדַד הָאֲדֹמִי
  choice: Адада-эдомитянина
  rationale: Имя передано традиционной русской формой «Адад», а этническая принадлежность — нормативным словом «эдомитянин».
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: из царского рода
  rationale: Буквально «из семени царя»; это генеалогическая идиома, обозначающая принадлежность к царской династии.
- source_word: הוּא בֶּאֱדוֹם
  choice: он был … в Эдоме
  rationale: Сохранено отдельное местоименное утверждение еврейского текста. В сочетании с предыдущей фразой оно связывает царское происхождение Адада с Эдомом, не уточняя сверх текста, относится ли оборот прежде всего к его роду или местонахождению.
theological_decisions:
- issue: Значение שָׂטָן в данном стихе
  choice: нарицательное «противник»
  alternative: имя собственное «Сатана»
  rationale: Синтаксис прямо отождествляет противника с Ададом-эдомитянином. Контекст говорит о человеческом политическом оппоненте Соломона и не даёт оснований вводить образ дьявола.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет повествовательную связь וַ־; тире ясно оформляет приложение. Формулировка последней части намеренно близка к синтаксису источника, чтобы не устранять неоднозначность оборота הוּא בֶּאֱדוֹם.
