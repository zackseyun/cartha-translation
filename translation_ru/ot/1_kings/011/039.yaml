source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: ru
  text: И Я причиню страдания потомкам Давида за это, но не навсегда[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не во все дни».'
    reason: Сохранение буквального образа еврейского выражения לֹא כָל הַיָּמִים при идиоматическом переводе в основном тексте.
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: И Я причиню страдания
  rationale: Пиэль глагола ענה здесь означает подвергнуть бедствию или унижению. Выражение «причиню страдания» естественно передаёт судебный контекст, не сужая смысл до внутреннего смирения или социального угнетения.
- source_word: זֶרַע דָּוִד
  choice: потомкам Давида
  rationale: זֶרַע — собирательное существительное со значением потомства. Русское «потомкам» звучит естественно и ясно обозначает династическую линию Давида.
- source_word: לְמַעַן זֹאת
  choice: за это
  rationale: В данном контексте оборот указывает на причину наказания и отсылает к описанному ранее проступку.
- source_word: אַךְ
  choice: но
  rationale: Частица вводит ограничение предшествующего объявления о суде; союз «но» кратко и естественно выражает это противопоставление.
- source_word: לֹא כָל הַיָּמִים
  choice: не навсегда
  rationale: Буквально «не все дни». Русское «не навсегда» идиоматично и точно передаёт ограниченную продолжительность наказания; буквальный образ сохранён в сноске.
theological_decisions:
- issue: Продолжительность суда над потомством Давида
  choice: 'Наказание ограничено во времени: «не навсегда».'
  alternative: Буквальное «не во все дни».
  rationale: Еврейский текст одновременно утверждает действительность наказания и прямо ограничивает его продолжительность. Перевод сохраняет это напряжение, не уточняя, когда и каким образом наказание прекратится.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, но без архаизмов. Заглавное «Я» уместно в прямой речи Бога. Синтаксис следует движению еврейской фразы, сохраняя причинное основание суда и последующее ограничение.
