  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: ru
  text: Но Я отниму царство у его сына[a] и отдам его тебе — десять колен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки его сына» — еврейский оборот, означающий, что царство будет изъято из-под власти его сына.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «и отдам его тебе, десять колен». Последние слова уточняют, что передаваемое царство включает десять колен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Но Я отниму
  rationale: Форма с союзом в пророческой речи передаёт будущее действие. «Но» отражает противопоставление предыдущему контексту, а «отниму» естественно выражает взятие царства из-под власти прежнего владельца.
- source_word: הַמְּלוּכָה
  choice: царство
  rationale: Здесь имеется в виду царская держава, которая будет отнята у династии Соломона; «царство» — ясный и контекстуально точный русский эквивалент.
- source_word: מִיַּד בְּנוֹ
  choice: у его сына
  rationale: Буквально «из руки его сына»; еврейский оборот обозначает изъятие из власти или владения. По-русски значение естественно передаётся конструкцией «отниму… у его сына».
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: и отдам его тебе
  rationale: Местоименный суффикс относится к слову «царство». Глагол נתן здесь означает передачу царства адресату.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: — десять колен
  rationale: 'Фраза уточняет, в каком составе царство будет отдано: десять колен. Тире естественно оформляет это пояснение в современном русском тексте.'
theological_decisions:
- issue: Соотношение «царства» и «десяти колен»
  choice: 'Сохранено пояснительное приложение: «царство… — десять колен»'
  alternative: «отдам тебе десять колен»
  rationale: Еврейский текст сначала называет царство, а затем уточняет его как десять колен. Выбранная конструкция сохраняет эту структуру и не устраняет её напряжение.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. Заглавная буква в местоимении «Я» обозначает говорящего Бога согласно принятой русской библейской традиции. Образ «из руки» вынесен в примечание, тогда как основной текст передаёт смысл идиомы естественной русской конструкцией.
