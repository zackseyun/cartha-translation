lexical_decisions:
- source_word: וְ/אֶת
  choice: и
  rationale: אֵת обозначает определённое прямое дополнение и отдельно не переводится; וְ передано союзом «и», сохраняющим структуру продолжающегося перечня.
- source_word: הַ/מְּכֹנוֹת
  choice: подставки
  rationale: В контексте храмовой утвари מְכֹנוֹת — описанные выше опоры на колёсах, на которых стояли чаши. «Подставки» ясно передаёт их функцию, не делая подвижность главным значением.
- source_word: עָשֶׂר
  choice: десять
  rationale: Количественное числительное при существительном женского рода מְכֹנוֹת.
- source_word: הַ/כִּיֹּרֹת
  choice: чаши
  rationale: כִּיּוֹר обозначает большой сосуд, в данном контексте предназначенный для омовения. «Чаши» — понятное современное обозначение формы предмета; традиционное «умывальницы» архаично.
- source_word: עֲשָׂרָה
  choice: десять
  rationale: Количественное числительное при существительном мужского рода כִּיֹּרוֹת в еврейской конструкции.
- source_word: עַל
  choice: на
  rationale: Предлог указывает на расположение чаш сверху на поддерживающих их конструкциях.
- source_word: הַ/מְּכֹנוֹת
  choice: подставках
  rationale: Повтор того же термина передан последовательно с необходимой русской падежной формой.
