lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: И сделал он Тронный зал
  rationale: אוּלָם обозначает зал или портик; в контексте дворцового комплекса естественно «зал». הַכִּסֵּא буквально означает «трон» или «сиденье», поэтому «Тронный зал» кратко и точно передаёт царский контекст. Глагол עָשָׂה перенесён вперёд ради естественного русского синтаксиса.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: где должен был вершить суд
  rationale: Имперфект יִשְׁפָּט здесь может обозначать предназначенное или обычное действие. Формулировка передаёт назначение помещения, не сводя значение лишь к единичному событию.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: Зал суда
  rationale: Сочетание называет помещение по его функции. «Суд» сохраняет смысл מִשְׁפָּט и менее интерпретативно, чем «правосудие».
- source_word: וְסָפוּן בָּאֶרֶז
  choice: он был обшит кедром
  rationale: סָפוּן означает покрытие или облицовку; «обшит кедром» естественно звучит в русском архитектурном описании.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: от пола до пола
  rationale: Масоретский текст буквально повторяет הַקַּרְקַע, «пол/земля». Необычное чтение сохранено в основном тексте, а распространённое контекстуальное понимание вынесено в сноску.
