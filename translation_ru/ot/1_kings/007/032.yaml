  source_fidelity: 'В целом перевод точно передаёт четыре колеса, их положение под מִסְגְּרוֹת и высоту каждого колеса. Однако «были прикреплены к подставке» добавляет глагольное значение и отношение крепления, которых в еврейском тексте прямо нет: בַּמְּכוֹנָה обозначает положение/принадлежность к подставке. Более нейтральное «были на подставке» лучше сохраняет краткость и неопределённость оригинала и соответствует английскому аудиторскому варианту.'
