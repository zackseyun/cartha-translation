  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: ru
  text: Четыре колеса находились под панелями[a], а оси колёс были на подставке[b]. Высота каждого колеса составляла полтора локтя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рамами» или «обрамлениями» (евр. מִסְגְּרוֹת).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руки колёс»; в данном контексте, вероятно, имеются в виду оси или опорные стержни колёс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: колёса / колесо
  rationale: В описании бронзовой подставки слово обозначает обычные колёса; это прямой и естественный русский эквивалент.
- source_word: לְמִתַּחַת
  choice: под
  rationale: Передаёт пространственное положение ниже панелей естественным современным русским языком.
- source_word: הַמִּסְגְּרוֹת
  choice: панелями
  rationale: В данном ремесленно-архитектурном контексте речь идёт о боковых секциях конструкции; возможные значения «рамы» и «обрамления» сохранены в примечании.
- source_word: וִידוֹת
  choice: оси
  rationale: Буквально слово связано со значением «руки», но в механическом контексте обозначает выступающие детали, на которых крепились или держались колёса; «оси» ясно передаёт вероятную функцию.
- source_word: בַּמְּכוֹנָה
  choice: были прикреплены к подставке
  rationale: מְכוֹנָה обозначает передвижную бронзовую подставку. Глагольное уточнение естественно передаёт подразумеваемую связь осей с конструкцией, не утверждая сверх контекста их точное устройство.
- source_word: קוֹמַת
  choice: высота
  rationale: Здесь слово обозначает вертикальный размер.
- source_word: הָאֶחָד
  choice: каждого
  rationale: Форма «одно» употреблена дистрибутивно применительно ко всем колёсам; по-русски естественно «каждого колеса».
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: полтора локтя
  rationale: Сохраняет древнюю единицу измерения и естественно передаёт величину в современном русском языке.
