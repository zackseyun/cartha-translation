  text: וְ/עַ֛ל רֹ֥אשׁ הָ/עַמּוּדִ֖ים מַעֲשֵׂ֣ה שׁוֹשָׁ֑ן וַ/תִּתֹּ֖ם מְלֶ֥אכֶת הָ/עַמּוּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/022.yaml
  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: ru
  text: А наверху столбов было украшение в виде лилий[a]. И была завершена работа над столбами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украшение с узором из лилий»; возможно также: «украшение в виде лотосов».'
    reason: Еврейское שׁוֹשָׁן обычно переводится как «лилия», но название растения и точная форма архитектурного мотива не вполне определённы.
  - marker: b
    text: 'Или: «Было закончено изготовление столбов».'
    reason: Выражение מְלֶאכֶת הָעַמּוּדִים может относиться как ко всей работе над столбами, так и к их изготовлению или художественному исполнению.
lexical_decisions:
- source_word: רֹאשׁ
  choice: наверху
  rationale: В архитектурном контексте слово обозначает верхнюю часть столбов; «наверху» естественно по-русски и не вводит более узкий технический термин «капитель».
- source_word: הָעַמּוּדִים
  choice: столбов
  rationale: עַמּוּדִים обозначает несущие или монументальные столбы; этот вариант соответствует храмовому контексту и привычен в русском библейском языке.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: украшение в виде лилий
  rationale: Сочетание буквально говорит об изделии или работе лилии; в данном архитектурном описании оно естественно понимается как декоративный мотив, выполненный в форме лилий.
- source_word: וַתִּתֹּם
  choice: была завершена
  rationale: Глагол תמם выражает достижение завершённости; пассивная русская конструкция естественно передаёт смысл при подлежащем «работа».
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: работа над столбами
  rationale: מְלָאכָה может обозначать работу, изготовление или исполнение. Русское «работа над столбами» сохраняет широту выражения и звучит естественнее буквального «работа столбов».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис разделён на два предложения ради ясности; начальное «А» сохраняет связь с предыдущим описанием. Технический термин «капитель» не введён, поскольку в данном стихе стоит общее слово «верх».
