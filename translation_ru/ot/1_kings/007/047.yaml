source:
  edition: WLC
  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: ru
  text: И оставил Соломон все эти изделия невзвешенными, потому что их было чрезвычайно много[a]; вес бронзы так и не был установлен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И оставил Соломон все эти изделия, потому что их было чрезвычайно много; вес бронзы не был исследован (установлен)».'
    reason: Либо глагол «оставил» сам по себе не уточняет, что именно осталось несделанным, либо это уточнение подразумевается последующей фразой о весе.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: оставил … невзвешенными
  rationale: Глагол означает «оставил, не стал продолжать действие»; ближайшая фраза о неустановленном весе позволяет естественно выразить подразумеваемое действие, не вводя отдельной мысли.
- source_word: כָּל הַכֵּלִים
  choice: все эти изделия
  rationale: כֵּלִים — широкое обозначение предметов или принадлежностей; в данном контексте речь идёт о перечисленных храмовых изделиях. «Изделия» звучит естественнее, чем более узкое «сосуды».
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: потому что их было чрезвычайно много
  rationale: Предлог מִן при רֹב выражает причину, а повтор מְאֹד передаёт сильное усиление количества.
- source_word: לֹא נֶחְקַר
  choice: так и не был установлен
  rationale: Нифаль глагола חקר здесь означает, что вес не был выяснен или определён; частица «так и» естественно подчёркивает отсутствие итогового определения.
- source_word: מִשְׁקַל
  choice: вес
  rationale: Прямое и контекстуально точное соответствие существительному со значением веса или количества по весу.
- source_word: הַנְּחֹשֶׁת
  choice: бронзы
  rationale: В описаниях храмовой утвари נְחֹשֶׁת обычно обозначает бронзу, а не чистую медь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство исторического повествования и сильное усиление количества. Смысловое уточнение «невзвешенными» сопровождено примечанием, сохраняющим более буквальное прочтение.
