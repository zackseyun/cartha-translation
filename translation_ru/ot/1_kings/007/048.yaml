  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: ru
  text: 'И сделал Соломон всю утварь дома Яхве[a]: золотой жертвенник и золотой стол, на котором лежал хлеб Присутствия[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дома Яхве». Еврейская конструкция эллиптична; речь идёт об утвари, относящейся к храму Яхве.'
    reason: Поясняет буквальное выражение и его эллиптическую связь с храмовой утварью, не добавляя оттенка целевого назначения.
  - marker: b
    text: 'Традиционно: «хлеб предложения»; буквально: «хлеб лица (присутствия)».'
    reason: Сохраняет традиционное наименование и поясняет буквальный образ еврейского выражения.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Широкое значение עשה естественно передаётся глаголом «сделал»; более узкое «изготовил» излишне подчёркивало бы ремесленную сторону.
- source_word: כָּל הַכֵּלִים
  choice: всю утварь
  rationale: В данном перечне כֵּלִים обозначает совокупность храмовых предметов. «Утварь» точно и естественно передаёт это собирательное значение.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: для дома Яхве
  rationale: 'В масоретском тексте оборот эллиптичен: после אֲשֶׁר отсутствуют явно выраженные предлог или глагол. Контекст указывает на принадлежность перечисленных предметов храму; русское «для дома» естественно передаёт эту связь, не создавая впечатления, будто Соломон изготовил их уже внутри здания.'
- source_word: מִזְבַּח הַזָּהָב
  choice: золотой жертвенник
  rationale: Прилагательное «золотой» кратко и идиоматично передаёт еврейское сочетание и не уточняет без необходимости, был ли предмет целиком сделан из золота или покрыт им.
- source_word: הַשֻּׁלְחָן ... זָהָב
  choice: золотой стол
  rationale: Стоящее в конце זָהָב естественно относится к столу. В русском определение перенесено перед существительным ради ясности и плавности.
- source_word: לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  rationale: Передаёт культовый термин буквально и при этом понятнее современному читателю, чем традиционное, но непрозрачное «хлеб предложения». Заглавная буква показывает, что речь идёт о Божьем присутствии, а примечание сохраняет традиционный вариант.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога — Тетраграмматон. «Яхве» сохраняет различие между именем и титулом, не добавляя отсутствующее в тексте слово «Господь».
- issue: Значение לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  alternative: хлеб предложения
  rationale: Буквально выражение связано с «лицом/присутствием». Перевод сохраняет культовый и богословский смысл, а традиционная формулировка дана в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ради ясности, однако порядок перечня и различие между личным именем Бога и титулом сохранены.
