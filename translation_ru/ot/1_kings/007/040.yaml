  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: ru
  text: Хирам сделал умывальники, лопатки и чаши[a]. Так Хирам завершил всю работу для дома Яхве, которую он выполнил для царя Соломона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чаши для кропления» — сосуды, использовавшиеся при жертвоприношениях.'
    reason: Лексема מִזְרָקוֹת может обозначать особые культовые чаши для принятия или разбрызгивания жертвенной крови либо другой жидкости.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: умывальники
  rationale: Существительное обозначает большие сосуды для омовения среди храмовой утвари. «Умывальники» передаёт их назначение и остаётся понятным современному читателю.
- source_word: יָּעִים
  choice: лопатки
  rationale: Речь идёт о храмовых приспособлениях для удаления золы или углей; «лопатки» естественно передаёт предмет меньшего размера, чем обычная лопата.
- source_word: מִּזְרָקוֹת
  choice: чаши[a]
  rationale: Это сосуды, связанные с жертвенным обрядом и, вероятно, с кровью или иной жидкостью. Основной текст сохраняет широкое и ясное «чаши», а культовая специфика отмечена в сноске.
- source_word: וַיְכַל
  choice: закончил
  rationale: Глагол указывает на завершение всей порученной работы; «закончил» звучит естественно и точно.
- source_word: כָּל הַמְּלָאכָה
  choice: всю работу
  rationale: Общее обозначение труда или выполненных изделий здесь служит итоговой формулой; «всю работу» не сужает значение до одного лишь ремесленного мастерства.
- source_word: בֵּית יְהוָה
  choice: для дома Яхве
  rationale: 'Сохранён буквальный образ «дома» и целевое значение конструкции: работа предназначалась для святилища, а не просто совершалась внутри него.'
- source_word: חִירוֹם / חִירָם
  choice: Хирам
  rationale: Обе орфографические формы имени в стихе переданы единообразно принятой русской формой «Хирам».
- source_word: אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה
  choice: которую он выполнял для царя Соломона
  rationale: Глагол עשה во второй части передан как «выполнял», чтобы естественно связать его со словом «работа» и избежать неуклюжего повторения «сделал».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и отличает его от титула «Господь».
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок частей итогового предложения слегка перестроен ради естественности: сохранены и адресат работы — царь Соломон, и её назначение — дом Яхве. Термины храмовой утвари переданы понятно, без архаизмов.'
