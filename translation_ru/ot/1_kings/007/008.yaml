  text: וּ/בֵית/וֹ֩ אֲשֶׁר יֵ֨שֶׁב שָׁ֜ם חָצֵ֣ר הָ/אַחֶ֗רֶת מִ/בֵּית֙ לָֽ/אוּלָ֔ם כַּ/מַּֽעֲשֶׂ֥ה הַ/זֶּ֖ה הָיָ֑ה וּ/בַ֜יִת יַעֲשֶׂ֤ה לְ/בַת פַּרְעֹה֙ אֲשֶׁ֣ר לָקַ֣ח שְׁלֹמֹ֔ה כָּ/אוּלָ֖ם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: ru
  text: Дом Соломона, где ему предстояло жить[a], находился в другом дворе, дальше от зала, и был выполнен таким же образом. Для дочери фараона[b], которую Соломон взял в жёны, он построил дом, подобный этому залу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в другом дворе, дальше в глубине от зала». Еврейское обозначение расположения трудно для понимания, поэтому переводы по-разному описывают положение резиденции относительно зала.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «которую Соломон взял»; то есть взял в жёны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Дом Соломона
  rationale: Суффикс буквально означает «его дом», но в русском после развернутого описания построек ясное обозначение Соломона устраняет возможную неясность и естественно продолжает повествование.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: где ему предстояло жить
  rationale: יָשַׁב означает «сидеть, пребывать, жить»; в описании строительства форма указывает на предназначение дома как будущей резиденции.
- source_word: חָצֵר הָאַחֶרֶת
  choice: в другом дворе
  rationale: חָצֵר — двор или внутренний двор. Определённость еврейской формы передаёт конкретный иной двор дворцового комплекса; по-русски «в другом дворе» звучит естественнее, чем «в ином дворе».
- source_word: מִבֵּית לָאוּלָם
  choice: дальше от зала
  rationale: Трудная пространственная фраза обозначает положение резиденции в глубине комплекса относительно зала. Перевод передаёт вероятный смысл, не предлагая излишне точной реконструкции планировки.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: был выполнен так же
  rationale: מַעֲשֶׂה здесь относится к способу исполнения или качеству строительной работы; краткая русская формулировка сохраняет сравнение с ранее описанной постройкой.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: он построил дом
  rationale: В контексте сводного рассказа форма обозначает совершённое строительство; «построил» точнее по контексту, чем общее «сделал».
- source_word: לְבַת פַּרְעֹה
  choice: для дочери фараона
  rationale: Прямая передача конструкции принадлежности естественным современным русским языком.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: которую Соломон взял в жёны
  rationale: לָקַח применительно к женщине может обозначать взятие в брак; выражение «взял в жёны» сохраняет еврейскую идиому и делает её смысл ясным.
- source_word: כָּאוּלָם הַזֶּה
  choice: подобный этому залу
  rationale: אוּלָם в данном дворцовом контексте — значительное крытое сооружение, поэтому «зал» уместнее бытового «крыльцо»; сравнительная конструкция передана словом «подобный».
