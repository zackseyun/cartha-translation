base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: ru
  text: Он отлил две бронзовые колонны. Высота одной колонны была восемнадцать локтей, а шнур длиной двенадцать локтей охватывал вторую колонну.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «а шнур длиной двенадцать локтей охватывал её». В еврейском тексте буквально: «вторую колонну».'
    reason: 'Текстовая трудность: масоретский текст прямо называет вторую колонну, хотя возможна передача по смыслу с местоименной отсылкой к упомянутой колонне.'
lexical_decisions:
- source_word: וַיָּצַר
  choice: отлил
  rationale: В контексте изготовления бронзовых храмовых предметов глагол передаёт литьё металла, а не просто придание формы.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: две ... колонны
  rationale: Для крупных архитектурных элементов храма современное русское «колонны» естественно и точно; «столпы» звучало бы архаично.
- source_word: נְחֹשֶׁת
  choice: бронзовые
  rationale: В данном древнем металлообрабатывающем контексте слово обычно обозначает бронзу; «латунные» было бы анахронично, а «медные» — излишне узко.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: восемнадцать локтей
  rationale: Сохранена древняя единица измерения без приблизительного пересчёта.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: Высота одной колонны была
  rationale: Передаёт именную конструкцию оригинала естественным современным русским синтаксисом.
- source_word: וְחוּט
  choice: а шнур
  rationale: חוּט буквально означает нить или шнур; здесь шнур используется для обозначения окружности.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: длиной в двенадцать локтей
  rationale: Добавление «длиной» естественно поясняет отношение меры к шнуру, не меняя содержания.
- source_word: יָסֹב
  choice: охватывал
  rationale: Точно передаёт значение «обходил вокруг, опоясывал» без внесения в основной текст отсутствующего глагола «измерял».
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: вторую колонну
  rationale: Следует масоретскому тексту WLC, в котором прямо стоит «вторую колонну», несмотря на возможную текстовую трудность.
