- from: Под его краем по всей окружности шли изображения тыкв[a] — по десять на локоть; они опоясывали Море кругом. Тыквы располагались в два ряда и были отлиты вместе с ним как одно целое.
  to: Под его краем вокруг него располагались тыквообразные украшения[a] — по десять на локоть; они окружали Море со всех сторон. Эти украшения были расположены в два ряда и отлиты вместе с ним.
  rationale: Исправление устраняет неоправданное уточнение «изображения» и лексическую непоследовательность, сохраняя образ тыквообразных элементов, повтор идеи окружения, техническое название «Море» и указание на совместную отливку.
