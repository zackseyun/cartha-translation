base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: ru
  text: Под его краем вокруг него располагались тыквообразные украшения[a] — по десять на локоть; они окружали Море со всех сторон. Эти украшения были расположены в два ряда и отлиты вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бутоны» или «выпуклости»; еврейское слово обозначает декоративные формы, похожие на тыквы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: изображения тыкв
  rationale: Слово обозначает декоративные формы, напоминающие тыквы; добавление «изображения» ясно показывает, что речь идёт об орнаменте, а не о настоящих плодах.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: под его краем
  rationale: שׂפה буквально означает «губа, край»; применительно к большой чаше естественное русское соответствие — «край».
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: по всей окружности шли
  rationale: Передаёт охват предмета кругом и естественно воспроизводит усиление, созданное в еврейском однокоренными словами.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: по десять на локоть
  rationale: Фраза указывает плотность размещения украшений вдоль окружности; русский оборот точен и понятен.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: они опоясывали Море кругом
  rationale: «Море» — название большой литой чаши; глагол «опоясывали» передаёт непрерывное расположение орнамента вокруг неё, а «кругом» сохраняет повтор исходного текста.
- source_word: שְׁנֵי טוּרִים
  choice: располагались в два ряда
  rationale: טורים означает «ряды»; глагол добавлен ради естественного русского синтаксиса.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: были отлиты вместе с ним как одно целое
  rationale: Однокоренные формы указывают, что украшения были сформированы при отливке самого Моря, а не прикреплены позднее.
