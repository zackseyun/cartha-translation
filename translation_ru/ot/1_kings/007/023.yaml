  rationale: Причастие указывает на предмет, изготовленный литьём металла; «литое» естественно сочетается с названием «Море».
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: от края до края — десять локтей
  rationale: Передаёт размер поперёк сосуда, сохраняя образ краёв и естественный русский порядок слов.
- source_word: עָגֹל סָבִיב
  choice: круглым со всех сторон
  rationale: Передаёт как круглую форму, так и усиление סָבִיב без тяжеловесного буквального повтора.
- source_word: קוֹמָתוֹ
  choice: высотой в пять локтей
  rationale: В описании сооружения קוֹמָה естественно означает высоту.
- source_word: וְקוה
  choice: и шнур
  rationale: Контекст измерения и традиционное чтение указывают на мерный шнур; краткое «шнур» сохраняет предметный образ еврейского текста.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: охватывал его по окружности
  rationale: Естественно выражает полное окружение сосуда и сохраняет пространственный акцент исходной фразы.
- source_word: אַמָּה
  choice: локоть
  rationale: Традиционное русское название древней меры длины, уместное в основном тексте без приблизительного пересчёта.
