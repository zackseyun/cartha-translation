  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: ru
  text: Он сделал литое море[a], десять локтей от края до края, круглое со всех сторон; высотой пять локтей, и мерный шнур[c] в тридцать локтей окружал его со всех сторон.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «резервуар». В еврейском тексте этот большой храмовый сосуд называется «морем»; это наименование сохранено в основном тексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шнур в тридцать локтей»; то есть длина окружности составляла тридцать локтей.'
    reason: cultural_note
  - marker: c
    text: В написанном еврейском тексте стоит קוה, а традиционное чтение — קָו («мерный шнур»). Ср. параллельное место во 2 Летописи 4:2.
    reason: textual_variant
