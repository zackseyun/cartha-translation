base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: ru
  text: Толщина его стенок была в ладонь, а его край был выполнен как край чаши — в виде цветка лилии[a]. Море вмещало две тысячи батов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его край был сделан наподобие края чаши, как цветок лилии».'
    reason: lexical_alternative
  - marker: b
    text: В параллельном описании во 2 Пар. 4:5 названы три тысячи батов. Это различие может быть связано с историей передачи текста либо с разным пониманием полной вместимости и обычного наполнения.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: толщина его стенок
  rationale: Существительное обозначает толщину материала сосуда; уточнение «стенок» естественно по-русски и ясно передаёт предмет измерения.
- source_word: טֶפַח
  choice: в ладонь
  rationale: Тефах — древняя мера длины, равная ширине ладони; выражение «в ладонь» понятно современному читателю и сохраняет образ исходной меры.
- source_word: שְׂפָתוֹ
  choice: край
  rationale: Буквально «губа»; применительно к большому сосуду современное русское «край» естественно обозначает его верхнюю кромку.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: был сделан наподобие края чаши
  rationale: Передаёт и ремесленное оформление, выраженное מַעֲשֶׂה, и сравнение верхнего края сосуда с краем чаши.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: как цветок лилии
  rationale: Сохраняет конкретный цветочный образ и допускает подразумеваемую форму раскрытого цветка, не добавляя отсутствующего в тексте объяснения.
- source_word: אַלְפַּיִם בַּת
  choice: две тысячи батов
  rationale: Сохраняется древняя мера жидкостей «бат» без приблизительного пересчёта, который создал бы ложную точность.
- source_word: יָכִיל
  choice: вмещало
  rationale: Форма выражает вместимость сосуда, а не обязательно фактическое содержимое в данный момент.
theological_decisions:
- issue: Различие в указанной вместимости между 3 Царств 7:26 и 2 Паралипоменон 4:5
  choice: В основном тексте сохранено чтение WLC «две тысячи батов»; различие отмечено в сноске без попытки согласовать цифры.
  alternative: Истолковать две тысячи как обычное наполнение, а три тысячи как предельную вместимость.
  rationale: Исходный стих прямо называет две тысячи и не проводит различия между рабочим объёмом и полной вместимостью; такое согласование возможно, но не должно вноситься в перевод как установленный факт.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Название сосуда «Море» восстановлено из ближайшего контекста для ясного подлежащего; древняя единица объёма сохранена транслитерацией. Образность исходного текста оставлена без технического переистолкования.
