lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: панели
  rationale: В описании подстав термин обозначает отдельные украшенные плоскости, расположенные между конструктивными элементами.
- source_word: שְׁלַבִּים
  choice: перекладины
  rationale: Слово обозначает элементы каркаса; «перекладины» естественно передаёт их конструктивную функцию и отличает их от панелей.
- source_word: אֲרָיוֹת בָּקָר וּכְרוּבִים
  choice: львы, быки и херувимы
  rationale: Названия декоративных фигур переданы прямо; собирательное בָּקָר в данном контексте естественно переведено как «быки».
- source_word: כֵּן מִמָּעַל
  choice: над ними — такие же изображения
  rationale: כֵּן выражает соответствие уже названному декору, а מִמָּעַל — его расположение сверху; добавление «изображения» делает эллиптическую конструкцию ясной по-русски.
- source_word: לֹיוֹת
  choice: гирлянды
  rationale: Редкое слово, вероятно, называет свисающие декоративные плетения или фестоны; точная форма украшения остаётся неясной и отмечена сноской.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: выполненные в виде свисающего рельефа
  rationale: Трудное выражение, по-видимому, описывает нисходящую или подвесную рельефную работу; перевод сохраняет пространственный и художественный смысл без претензии на полную определённость.
