base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: ru
  text: Он установил столбы у притвора храма[a]. Он установил правый столб и назвал его Иахин, а затем установил левый столб и назвал его Вооз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иахин и Вооз — переданные по-русски еврейские имена столбов, а не перевод их возможных значений.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: установил
  rationale: Порода хифиль глагола קום здесь означает «поставить, сделать стоящим». «Установил» естественно передаёт размещение изготовленных столбов на предназначенном им месте и подходит для всех трёх повторений.
- source_word: הָעַמֻּדִים
  choice: столбы
  rationale: עַמּוּד обозначает столб или колонну. В русском библейском и архитектурном контексте «столбы» сохраняет конкретность и соответствует именованным отдельно стоящим элементам.
- source_word: לְאֻלָם הַהֵיכָל
  choice: у притвора храма
  rationale: אוּלָם — передний притвор храма; לְ в данном контексте естественно понимать как указание места или примыкания. «У притвора храма» не уточняет сверх текста, стояли ли столбы внутри притвора или непосредственно перед ним.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: правый столб
  rationale: יְמָנִי буквально означает «правый, находящийся справа». Перевод сохраняет пространственную ориентацию, не заменяя её предполагаемой стороной света.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: назвал его
  rationale: Буквальная еврейская формула — «назвал его имя», но современное русское «назвал его» естественно и точно передаёт акт наречения.
- source_word: יָכִין
  choice: Иахин
  rationale: Имя столба транслитерировано в принятой русской библейской форме, а не переведено по возможному значению.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: левый столб
  rationale: שְׂמָאלִי означает «левый, находящийся слева»; формулировка сохраняет параллелизм с «правым столбом».
- source_word: בֹּעַז
  choice: Воаз
  rationale: Имя столба транслитерировано в принятой русской библейской форме, а не истолковано как выражение с возможным лексическим значением.
