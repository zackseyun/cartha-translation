source:
  edition: WLC
  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: ru
  text: 'Оно стояло на двенадцати быках: три были обращены на север, три — на запад[a], три — на юг и три — на восток. Сверху на них находилось Море, а задние части всех быков были обращены внутрь[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к морю»; это обычное библейское обозначение запада.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а все они были обращены задними частями внутрь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: стояло
  rationale: Причастие qal употреблено как сказуемое и описывает положение Моря; русская форма прошедшего времени естественно передаёт повествовательное описание.
- source_word: בָּקָר
  choice: быках
  rationale: Слово обозначает крупный рогатый скот; в данном архитектурном контексте речь идёт о двенадцати изображениях быков. «Волы» могло бы необоснованно указывать на кастрированных животных.
- source_word: פֹנִים
  choice: были обращены
  rationale: Буквально связано с «лицом», но в повторяющейся конструкции обозначает ориентацию фигур по сторонам света.
- source_word: צָפוֹנָה / יָמָּה / נֶגְבָּה / מִזְרָחָה
  choice: на север / на запад / на юг / на восток
  rationale: Направительные формы перечисляют четыре стороны света; единообразная русская конструкция ясно передаёт их ориентацию.
- source_word: הַיָּם
  choice: Море
  rationale: Это особое название большой литой храмовой чаши; прописная буква сохраняет его функцию названия храмового предмета.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: Сверху на них находилось
  rationale: Передаёт пространственное отношение без добавления отсутствующего в еврейском тексте глагола «было установлено».
- source_word: אֲחֹרֵיהֶם
  choice: задние части всех быков
  rationale: Буквально «их задние части»; формулировка точна, понятна и не звучит грубо.
- source_word: בָּיְתָה
  choice: внутрь
  rationale: Направительная форма здесь означает ориентацию к внутренней стороне, то есть к центру под Морем.
