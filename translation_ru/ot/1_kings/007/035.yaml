  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: ru
  text: На верхней части подставки находился круглый обод высотой в пол-локтя, проходивший по всему её периметру; на верхней части подставки её опоры[a] и панели[b] составляли с ней единое целое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ручки». Еврейское слово יְדֹתֶיהָ буквально означает «её руки» и может обозначать выступающие части подставки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рамы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: сверху подставки
  rationale: רֹאשׁ здесь обозначает верхнюю часть сооружения, а מְכוֹנָה — бронзовую передвижную подставку; выбран естественный для современного русского языка оборот.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: высотой в пол-локтя
  rationale: קוֹמָה указывает на вертикальный размер; формулировка точно и естественно передаёт меру высоты.
- source_word: עָגֹל סָבִיב
  choice: круглый обод… опоясывавший её
  rationale: עָגֹל означает «круглый», а סָבִיב — «вокруг». В еврейском тексте название детали подразумевается; «обод» кратко и уместно восполняет его в архитектурном описании.
- source_word: יְדֹתֶיהָ
  choice: опоры
  rationale: Буквально «её руки»; применительно к предмету יָד может обозначать рукояти, выступающие элементы или опоры. В данном конструктивном контексте «опоры» наиболее вероятно, а альтернатива сохранена в сноске.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: панели
  rationale: מִסְגְּרוֹת может обозначать обрамлённые секции, рамы или панели. «Панели» понятно передаёт вероятный вид деталей, не устраняя альтернативу.
- source_word: מִמֶּנָּה
  choice: были выполнены заодно с ней
  rationale: Буквально «из неё/от неё»; в описании литой конструкции выражение указывает, что детали составляли с подставкой единое целое, а не были прикреплены отдельно.
