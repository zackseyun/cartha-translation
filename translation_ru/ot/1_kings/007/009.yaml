  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: ru
  text: Всё это было из дорогих камней[a], вытесанных по размеру и распиленных пилой с внутренней и внешней стороны, от основания до верхней кладки[b], а снаружи — до большого двора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ценных камней». Здесь, вероятно, имеются в виду дорогие высококачественные строительные камни, а не драгоценные камни.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «верхняя кладка», обозначает не вполне ясную архитектурную деталь; возможно, это верхний завершающий ряд или верхняя отделка стены.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: дорогих камней
  rationale: יְקָרֹת означает «ценные, дорогие». В архитектурном контексте речь, вероятнее всего, идёт о дорогостоящем высококачественном строительном камне, а не о самоцветах.
- source_word: כְּמִדֹּת גָּזִית
  choice: вытесанных по размеру
  rationale: Передаёт как обработку камня, так и его изготовление по заданным размерам; «вытесанных» естественно для тесаного строительного камня.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: распиленных пилой
  rationale: Сохраняет явное указание и на действие, и на инструмент, присутствующее в еврейском тексте.
- source_word: מִבַּיִת וּמִחוּץ
  choice: с внутренней и внешней стороны
  rationale: В данном строительном контексте выражение, вероятно, относится к обработке внутренних и наружных поверхностей каменной кладки.
- source_word: מִמַּסָּד
  choice: от основания
  rationale: מַסָּד обозначает основание или фундамент; «основание» естественно сочетается с верхним пределом кладки и не уточняет сверх текста.
- source_word: עַד הַטְּפָחוֹת
  choice: до верхней кладки
  rationale: Точное значение редкого архитектурного термина הַטְּפָחוֹת неясно. «Верхняя кладка» передаёт вероятный смысл верхнего завершающего ряда, не создавая чрезмерно узкой технической определённости.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: а снаружи — до большого двора
  rationale: Близко передаёт пространственное продолжение описания до חָצֵר הַגְּדוֹלָה; «большой двор» — ясный и естественный архитектурный термин.
theological_decisions: []
