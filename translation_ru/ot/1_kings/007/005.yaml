  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: ru
  text: Все дверные проёмы и косяки имели квадратные обрамления[a]; окна располагались одно напротив другого в три ряда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имели квадратные верхние перекладины»; значение еврейского архитектурного термина не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «окно напротив окна три раза»; вероятно, имеются в виду соответствующие друг другу окна, расположенные в три ряда или яруса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: дверные проёмы
  rationale: Слово обозначает отверстия или входы; в архитектурном контексте речь идёт о проёмах, а не о дверных полотнах.
- source_word: מְּזוּזוֹת
  choice: косяки
  rationale: Архитектурное значение — боковые стойки дверного проёма; «косяки» естественно и точно передаёт этот смысл по-русски.
- source_word: רְבֻעִים
  choice: четырёхугольные
  rationale: Форма имеет четыре стороны или угла. «Четырёхугольные» сохраняет возможную широту значения и не сужает его до строго квадратной формы.
- source_word: שָׁקֶף
  choice: обрамления
  rationale: Редкий архитектурный термин может обозначать раму, обрамление или, более узко, верхнюю перекладину; нейтральное «обрамления» не устраняет эту неопределённость.
- source_word: מ֧וּל
  choice: одно напротив другого
  rationale: Передаёт пространственное соответствие и взаимное расположение архитектурных элементов.
- source_word: מֶחֱזָה
  choice: окна
  rationale: В описании здания слово, вероятно, обозначает окно или проём для обзора; «окна» наиболее естественно в данном контексте.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: в три ряда
  rationale: Буквально «три раза»; в архитектурном контексте это, вероятно, трёхкратно повторённое расположение, то есть три ряда или яруса.
