  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: ru
  text: 'и четыреста гранатов для двух ажурных решёток[a]: по два ряда гранатов на каждой решётке, чтобы покрыть две чашеобразные капители[b], находившиеся на вершинах столбов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сетки». Еврейское слово обозначает декоративную ажурную конструкцию на капителях.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «две чаши капителей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: гранаты
  rationale: Существительное буквально обозначает плоды граната; здесь имеются в виду украшения такой формы, но конкретный образ сохранён без поясняющей вставки.
- source_word: שְׂבָכוֹת
  choice: плетёные решётки
  rationale: Слово обозначает декоративную сетчатую, ажурную конструкцию; сочетание передаёт и её открытый рисунок, и рукотворный характер.
- source_word: טוּרִים
  choice: ряды
  rationale: Обычное и ясное обозначение упорядоченного расположения украшений.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: на каждой решётке
  rationale: Буквально «на одной решётке»; в контексте двух решёток оборот имеет распределительное значение.
- source_word: לְכַסּוֹת
  choice: чтобы покрывать
  rationale: Инфинитив указывает на назначение рядов гранатов; сохранено прямое значение глагола.
- source_word: גֻּלֹּת
  choice: чаши
  rationale: Слово обозначает округлые, чашеобразные части; конкретная архитектурная метафора сохранена в основном тексте.
- source_word: כֹּתָרֹת
  choice: венцы
  rationale: В данном архитектурном контексте речь идёт о верхних декоративных частях столбов; «венцы» сохраняет образ исходного слова и понятно в сочетании со столбами.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: находившихся наверху столбов
  rationale: В архитектурном описании оборот указывает на положение венцов над столбами; перевод естественно выражает пространственный смысл.
