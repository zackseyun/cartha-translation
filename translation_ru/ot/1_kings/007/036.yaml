  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: ru
  text: На панелях её опор и на её рамах он выгравировал херувимов, львов и пальмы — сообразно месту для каждого изображения[a] — и венки вокруг них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там, где для каждой фигуры находилось место». Еврейская фраза трудна для понимания и, вероятно, описывает расположение резных изображений сообразно свободному месту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гирлянды». Еврейское слово, вероятно, обозначает декоративные свисающие украшения, окружавшие фигуры.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: выгравировал
  rationale: В описании художественной отделки глагол обозначает нанесение резных или чеканных изображений; «выгравировал» естественно передаёт эту работу по поверхности.
- source_word: הַלֻּחֹת יְדֹתֶיהָ
  choice: панелях его опор
  rationale: Сочетание буквально связано с «плитами/панелями» и «руками», но в данном устройстве речь идёт о панелях конструктивных выступов или опор.
- source_word: מַסְגְּרֹתֶיהָ
  choice: его рамах
  rationale: Слово обозначает обрамляющие конструктивные части подставы; «рамы» сохраняет предметный архитектурный смысл.
- source_word: כְּרוּבִים
  choice: херувимов
  rationale: Традиционный и нейтральный русский термин для храмовых образов крылатых небесных существ.
- source_word: אֲרָיוֹת
  choice: львов
  rationale: Прямое обозначение львов как декоративного мотива.
- source_word: תִמֹרֹת
  choice: пальмы
  rationale: В храмовой орнаментике слово обозначает изображения пальм или пальмовые мотивы; краткое «пальмы» естественно в перечислении.
- source_word: כְּמַעַר אִישׁ
  choice: сообразно месту для каждого изображения
  rationale: Трудная еврейская фраза, вероятно, описывает распределение фигур в зависимости от имевшегося для каждой из них места; добавление «изображения» проясняет отнесение местоименного смысла.
- source_word: לֹיֹת סָבִיב
  choice: а вокруг них венки
  rationale: Редкое существительное, вероятно, обозначает окружающие фигуры декоративные венки или гирлянды; «венки» сохраняет традиционный предметный образ, а «вокруг них» передаёт סָבִיב.
