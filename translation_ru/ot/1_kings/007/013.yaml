- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: послал за ... и привёл
  rationale: Сочетание двух глаголов описывает распоряжение царя и прибытие Хирама; «послал за» естественно передаёт подразумеваемый вызов, а «привёл» сохраняет каузативный смысл контекста, не создавая впечатления насильственного захвата.
- source_word: חִירָם
  choice: Хирам
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: מִצֹּר
  choice: из Тира
  rationale: Предлог מִן обозначает исходный пункт, а צֹר — город Тир.
