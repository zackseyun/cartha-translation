base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: ru
  text: Котлы[a], лопатки, чаши[b] и вся эта утварь, которую Хирам изготовил для царя Соломона, для дома Яхве, — всё это было из полированной[c] бронзы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горшки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тазы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «начищенной до блеска».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: котлы
  rationale: Слово обозначает сосуды типа горшков или котлов; в перечне храмовой утвари «котлы» звучит естественно и не сужает их назначение чрезмерно.
- source_word: הַיָּעִים
  choice: лопатки
  rationale: Речь об орудиях для работы у жертвенника, в частности для удаления золы; «лопатки» — точное и традиционно понятное обозначение.
- source_word: הַמִּזְרָקוֹת
  choice: чаши
  rationale: Слово обозначает сосуды для принятия или разбрызгивания жидкостей. «Чаши» естественно в контексте храмовой утвари; возможно также «тазы».
- source_word: כָּל־הַכֵּלִים הָאֵלֶּה
  choice: всю эту утварь
  rationale: כֵּלִים — широкое обозначение предметов и принадлежностей. В храмовом перечне русское собирательное «утварь» передаёт смысл естественнее буквального «сосуды», а «эту» отсылает к перечисленным предметам.
- source_word: עָשָׂה
  choice: изготовил
  rationale: В контексте работы мастера «изготовил» передаёт обычное значение глагола и звучит естественно, не добавляя оттенков художественного творчества.
- source_word: חִירָם
  choice: Хирам
  rationale: Принятая русская передача данного имени, соответствующая форме еврейского текста.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: для царя Соломона
  rationale: Предлог לְ указывает на заказчика или получателя работы; такая конструкция ясна и естественна по-русски.
- source_word: בֵּית יְהוָה
  choice: для дома Яхве
  rationale: 'Сохранено буквальное «дом», а смысл назначения передан предлогом «для»: предметы изготовлены для употребления в доме Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, что непосредственно отражает еврейский текст.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В контексте древней храмовой металлической утвари «бронза» — наиболее вероятный и общепринятый эквивалент; «медь» возможна лексически, но менее вероятна здесь.
- source_word: מְמֹרָט
  choice: полированная
  rationale: Причастие описывает металл, поверхность которого сглажена и доведена до блеска; «полированная» точно и понятно передаёт это значение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное Божье имя. «Яхве» сохраняет имя и наиболее прямо отражает принятую научную реконструкцию произношения, не подменяя его титулом.
- issue: Синтаксическая роль נְחֹשֶׁת מְמֹרָט
  choice: — всё из полированной бронзы
  alternative: из полированной бронзы (как определение только ближайшего оборота)
  rationale: Заключительная именная группа естественно служит сказуемым ко всему перечню. Добавленное «всё» делает эту связь ясной по-русски, не меняя объёма утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для перечня храмовой утвари. Собирательное «утварь» устраняет тяжеловесное повторение «сосуды», а тире и слово «всё» ясно передают заключительное именное сказуемое еврейского текста.
