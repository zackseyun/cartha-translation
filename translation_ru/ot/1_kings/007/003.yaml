  yaml_path: translation/ot/1_kings/007/003.yaml
  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: ru
  text: Сверху он был обшит кедром[a] — над боковыми помещениями, которые находились на столбах; всего их было сорок пять, по пятнадцать в каждом ряду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сверху он был покрыт кедром — над боковыми конструкциями, которые находились на столбах». Значение древнееврейских архитектурных терминов здесь не вполне ясно; צלעות может означать «стороны», «рёбра», «боковые помещения» или «боковые конструкции».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: был обшит
  rationale: Страдательная форма от ספן передаёт покрытие или облицовку отделочным материалом; «обшит» естественно звучит в архитектурном контексте и не сужает значение до устройства кровли.
- source_word: בָּאֶרֶז
  choice: кедром
  rationale: Предлог ב указывает на материал; творительный падеж естественно передаёт это по-русски.
- source_word: מִמַּעַל
  choice: сверху
  rationale: Наречие обозначает расположение в верхней части сооружения; «сверху» кратко и естественно.
- source_word: עַל הַצְּלָעוֹת
  choice: над боковыми помещениями
  rationale: צלעות буквально может означать «стороны» или «рёбра», а в архитектурном контексте — боковые помещения либо конструкции. Основной текст передаёт вероятный конкретный смысл, а примечание сохраняет неоднозначность.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: которые находились на столбах
  rationale: Относительное предложение сохраняет простое пространственное отношение עַל, не уточняя без достаточных оснований способ опоры.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: всего их было сорок пять
  rationale: Число, вероятно, подводит итог количеству упомянутых элементов; местоимение делает русское предложение связным, не меняя содержания.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: по пятнадцать в каждом ряду
  rationale: טור означает «ряд»; конструкция объясняет распределение общего числа сорок пять по рядам.
