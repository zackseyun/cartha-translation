base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: ru
  text: Он поставил пять подстав на правой стороне храма и пять — на левой, а Море поставил на юго-восточной стороне храма.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с правой стороны храма, к востоку, напротив юга» — краткое пространственное описание юго-восточной стороны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: подставы
  rationale: В данном контексте это бронзовые передвижные конструкции, на которых стояли чаши. «Подставы» ясно передаёт их функцию, не сводя их лишь к повозкам или основаниям.
- source_word: כֶּתֶף
  choice: сторона
  rationale: Буквально слово означает «плечо», но применительно к зданию обозначает его сторону.
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально — «дом»; в контексте речь идёт о храме. «Храм» естественно и однозначно передаёт референт для современного русского читателя.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: с правой стороны / с левой
  rationale: Сохранена телесно-пространственная ориентация еврейского текста без преждевременной замены сторонами света.
- source_word: הַיָּם
  choice: Море
  rationale: Это принятое наименование большой литой храмовой чаши; прописная буква показывает, что речь идёт об особом храмовом предмете, а не о природном водоёме.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: с юго-восточной стороны храма
  rationale: Компактная последовательность пространственных указаний описывает место справа от храма, к востоку и со стороны юга; в естественном русском это юго-восточная сторона. Буквальная структура сохранена в примечании.
