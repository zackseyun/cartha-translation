lexical_decisions:
- source_word: שְׁקֻפִים
  choice: оконные проёмы
  rationale: В архитектурном контексте слово обозначает обрамлённые отверстия или оконные проёмы; этот вариант естественнее по-русски, чем буквальное «оконные рамы», и не сужает значение до перемычек.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: в три ряда
  rationale: טוּר обозначает ряд или последовательное расположение; русская конструкция ясно передаёт устройство здания.
- source_word: מֶחֱזָה
  choice: окно
  rationale: Слово может обозначать проём для обзора или света; в параллельном архитектурном описании «окно» — наиболее ясный и естественный эквивалент.
- source_word: אֶל מֶחֱזָה
  choice: напротив окна
  rationale: Предлог אֶל здесь выражает взаимную ориентацию проёмов; «напротив» точно и естественно передаёт их соответствующее расположение.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: так трижды
  rationale: Сохранено буквальное значение «три раза», не превращая вероятное указание на три яруса в несомненное утверждение.
