  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: ru
  text: Основание было сложено из дорогостоящих камней[a], больших камней — камней в десять локтей и камней в восемь локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ценных камней». Еврейское выражение подчёркивает их высокую стоимость или качество; в данном строительном контексте речь, вероятнее всего, не о драгоценных камнях-самоцветах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: Основание было сложено
  rationale: Пассивная форма от יסד в архитектурном контексте описывает устройство основания. Перевод естественно выражает подразумеваемый субъект, не добавляя отсутствующих деталей.
- source_word: אֲבָנִים יְקָרוֹת
  choice: из дорогостоящих камней
  rationale: יְקָרוֹת указывает на высокую стоимость или ценность. «Дорогостоящие камни» в строительном контексте меньше ассоциируются с самоцветами, чем устойчивое сочетание «драгоценные камни».
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: больших камней
  rationale: גְּדֹלוֹת здесь обозначает физический размер; «большие камни» — ясный и прямой современный эквивалент.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: камней в десять локтей
  rationale: Сочетание указывает размер камней, но не уточняет, по какой оси он измерен. Формулировка сохраняет эту неопределённость.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: и камней в восемь локтей
  rationale: Сохранена параллельная конструкция предыдущей фразы и не добавлено отсутствующее в еврейском тексте указание длины, ширины или высоты.
- source_word: אַמּוֹת
  choice: локтей
  rationale: «Локоть» — традиционное русское обозначение древней единицы длины; перевод не подменяет исходную меру приблизительным современным пересчётом.
