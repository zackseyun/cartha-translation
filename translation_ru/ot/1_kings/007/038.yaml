base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: ru
  text: Он сделал десять бронзовых умывальников. Каждый умывальник вмещал сорок батов[a] и был размером в четыре локтя[b]. На каждой из десяти подставок стояло по одному умывальнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бат — древнееврейская мера объёма жидкостей.
    reason: cultural_note
  - marker: b
    text: 'Или: «четыре локтя в поперечнике». В древнееврейском тексте сказано только «четыре локтя», без уточнения измеряемого параметра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: чаши
  rationale: Обозначает большие сосуды для омовений при храме. «Чаши» понятно современному читателю и здесь естественнее, чем устаревающее «умывальники».
- source_word: נְחֹשֶׁת
  choice: бронзовые
  rationale: В описании храмовой утвари слово традиционно и контекстуально передаётся как «бронза», хотя само древнееврейское обозначение металла может охватывать медь и медные сплавы.
- source_word: בַּת
  choice: батов
  rationale: Сохранено древнееврейское название меры жидкостей, чтобы не создавать ложной точности пересчётом в современные единицы.
- source_word: יָכִיל
  choice: вмещала
  rationale: Глагол выражает вместимость сосуда; «вмещала» точно и естественно передаёт этот смысл.
- source_word: אַרְבַּע בָּאַמָּה
  choice: имела четыре локтя в поперечнике
  rationale: В исходном тексте назван размер в четыре локтя без прямого указания измеряемой стороны. «В поперечнике» передаёт наиболее вероятный смысл, а примечание сохраняет формальную неопределённость.
- source_word: מְכוֹנָה
  choice: подставка
  rationale: Речь о поддерживающих конструкциях, описанных в ближайшем контексте; «подставка» ясно передаёт их функцию, не добавляя в этот стих лишних технических подробностей.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: На каждой из десяти подставок стояло по одной чаше
  rationale: 'Естественная русская передача распределительной конструкции: по одному сосуду на каждую из десяти подставок.'
