translation:
  language: ru
  text: А свой дом Соломон строил тринадцать лет[a] и закончил строительство всего своего дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой дворец». Еврейское слово «дом» в этом контексте может обозначать царскую резиденцию или дворцовый комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: בַּיִת обычно означает «дом», но в царском контексте может обозначать резиденцию или дворцовый комплекс. «Свой дом» сохраняет еврейский образ и передаёт контраст с предшествующим рассказом о храме.
- source_word: בָּנָה
  choice: строил
  rationale: 'Форма Qal perfect в сочетании с указанием продолжительности естественно передаётся по-русски несовершенным видом: строительство продолжалось тринадцать лет.'
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: тринадцать лет
  rationale: В русском языке длительность действия выражается винительным падежом без предлога.
- source_word: וַיְכַל
  choice: завершил
  rationale: Форма от כלה обозначает доведение работы до конца и продвигает повествование; «завершил» ясно выражает достижение результата.
- source_word: כָּל בֵּיתוֹ
  choice: весь свой дом
  rationale: כָּל выражает полноту, а повтор слова «дом» сохраняет лексическую связь с началом стиха. В контексте имеется в виду вся царская резиденция или весь дворцовый комплекс.
- source_word: וְאֶת
  choice: А
  rationale: Сочетание союза с показателем прямого дополнения открывает связанную, но контрастную тему после рассказа о храме; русское «А» естественно передаёт этот дискурсивный переход.
