  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: ru
  text: А выше — дорогие камни, обтёсанные по размерам[a], и кедр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по размерам тёсаного камня».'
    reason: Более буквальная передача כְּמִדּוֹת גָּזִית; конструкция может обозначать размеры, соответствующие тёсаному камню.
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: А выше
  rationale: В описании сооружения выражение естественно указывает на находившиеся выше части кладки; «а выше» сохраняет пространственный переход.
- source_word: אֲבָנִים יְקָרוֹת
  choice: дорогие камни
  rationale: Прилагательное обозначает ценный, дорогостоящий материал; «дорогие» не создаёт лишней ассоциации с драгоценными камнями.
- source_word: כְּמִדּוֹת גָּזִית
  choice: вытесанные по размеру
  rationale: Передаёт строительный смысл тщательно обработанных камней заданных размеров, оставаясь естественным по-русски; более буквальная и синтаксически неоднозначная формулировка дана в сноске.
- source_word: וָאָרֶז
  choice: и кедр
  rationale: Сохраняет краткость еврейского текста, где назван кедр без отдельного слова «древесина».
