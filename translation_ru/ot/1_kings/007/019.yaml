base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: ru
  text: А капители, находившиеся на вершинах столбов в притворе[a], были выполнены в виде цветка лилии[b] — четыре локтя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во входном зале»; возможно также: «на портике». Еврейское אוּלָם обозначает входной зал или портик храмового здания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или просто: «в виде лилии». Некоторые считают, что שׁוּשַׁן здесь обозначает орнамент в форме цветка лотоса.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «четыре локтя». Вероятно, это высота лилиеобразной части капителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת
  choice: капители
  rationale: В архитектурном описании это точное и современное название венчающей части столба или колонны; буквальное «венцы» менее ясно.
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: верхушки столбов
  rationale: Передаёт буквальный образ «голова/верх столбов» естественным современным русским языком, не заменяя עַמּוּדִים более узким термином «колонны».
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: были выполнены в виде цветка лилии
  rationale: Передаёт именную конструкцию «работа/изделие лилии» как описание формы. «Цветок лилии» ясно указывает на растительный орнамент, тогда как возможное понимание как лотоса вынесено в примечание.
- source_word: בָּאוּלָם
  choice: в притворе
  rationale: В храмовом контексте אוּלָם обозначает входное помещение или портик. «Притвор» естественен для русского описания храмового здания, а альтернативы приведены в примечании.
- source_word: אַרְבַּע אַמּוֹת
  choice: четыре локтя
  rationale: Сохраняет краткую форму еврейского текста без добавления отсутствующего слова «высотой»; вероятное значение размера поясняется в примечании.
