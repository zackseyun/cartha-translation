  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: ru
  text: Он сделал две капители из литой бронзы, чтобы установить их на вершинах столбов. Высота одной капители была пять локтей[a], и высота второй капители — пять локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, приблизительно 45 см; пять локтей — около 2,25 м.
    reason: measurement_clarification
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: капители / капители
  rationale: В архитектурном контексте слово обозначает венчающую, обычно украшенную часть столба. «Капитель» — точный и употребительный современный русский термин; буквальное «венцы» могло бы быть понято неверно.
- source_word: עָשָׂה
  choice: сделал
  rationale: Обычный глагол изготовления, соответствующий нейтральному повествовательному стилю оригинала.
- source_word: לָתֵת
  choice: чтобы установить
  rationale: Инфинитив выражает цель изготовления; «установить» естественно передаёт размещение архитектурных деталей.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: на вершинах столбов
  rationale: רָאשֵׁי буквально означает «головы», но применительно к столбам естественно передаётся как «вершины».
- source_word: מֻצַק נְחֹשֶׁת
  choice: из литой бронзы
  rationale: Передаёт и материал, и способ изготовления; נְחֹשֶׁת в данном контексте традиционно и уместно переводится как «бронза».
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: Сохранена древняя мера длины оригинала без неточного пересчёта в современные единицы.
- source_word: קוֹמַת
  choice: высота
  rationale: В контексте размеров архитектурной детали это точный и естественный русский эквивалент.
- source_word: הָאֶחָת
  choice: одной
  rationale: Сохраняет выражение «одна» без превращения его в явно порядковое «первая».
- source_word: הַשֵּׁנִית
  choice: второй
  rationale: Передаёт явное порядковое обозначение второго предмета в еврейском тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Архитектурный термин «капитель» сохраняет точность оригинального контекста, а древняя мера оставлена в основном тексте с пояснением в сноске.
