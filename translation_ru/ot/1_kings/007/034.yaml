  yaml_path: translation/ot/1_kings/007/034.yaml
  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: ru
  text: На четырёх углах одной подставы были четыре опоры; её опоры были частью самой подставы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: опоры
  rationale: Буквально слово означает «плечи», но здесь это технические элементы конструкции; «опоры» естественно передаёт их функцию по контексту.
- source_word: מְכֹנָה
  choice: подстава
  rationale: Обозначает передвижную подставу для умывальницы; «подстава» сохраняет связь с описанием храмового оборудования и традиционную техническую точность.
- source_word: הָאֶחָת
  choice: одной
  rationale: Сохранено формально выраженное числительное/определение «одна», как в масоретском тексте, без исправления на предполагаемое «каждой».
- source_word: מִן הַמְּכֹנָה
  choice: с подставой одно целое
  rationale: 'Буквально «из подставы»: опоры были не отдельными деталями, а выходили из самой конструкции и составляли с ней единое целое.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; техническое описание передано ясно и сдержанно. Необычное «одной подставы» сохранено вслед за еврейским текстом, без молчаливой гармонизации до «каждой подставы».
