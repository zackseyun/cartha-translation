  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: ru
  text: Он сделал столбы и два ряда вокруг одного сетчатого плетения, чтобы покрыть капители, находившиеся над гранатами[a]; так же он сделал и для второй капители.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «гранатов». Вероятно, имеются в виду декоративные изображения плодов граната. Еврейская фраза трудна; некоторые понимают её так, что два ряда таких украшений окружали сетчатое плетение каждой капители.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Обычное повествовательное употребление עשה; «сделал» прямо и естественно передаёт значение глагола.
- source_word: הָעַמּוּדִים
  choice: столбы
  rationale: В архитектурном контексте עמוד обозначает несущий или декоративный столб; это понятный и традиционный русский термин.
- source_word: שְׁנֵי טוּרִים
  choice: два ряда
  rationale: טור обозначает последовательный ряд; здесь речь идёт о расположении декоративных элементов.
- source_word: סָבִיב
  choice: вокруг
  rationale: Передаёт круговое расположение украшений без добавления отсутствующих в еврейском тексте деталей.
- source_word: הַשְּׂבָכָה הָאֶחָת
  choice: одной сетчатой отделки
  rationale: שבכה — сетчатая, переплетённая декоративная работа; הָאֶחָת указывает на одну из двух соответствующих конструкций, но не обязательно имеет порядковое значение «первой».
- source_word: לְכַסּוֹת
  choice: чтобы покрыть
  rationale: Инфинитив с ל выражает цель; «покрыть» сохраняет прямое значение כסה.
- source_word: הַכֹּתָרֹת
  choice: капители
  rationale: В описании столбов כותרת является архитектурным термином для верхней венчающей части столба.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: находившиеся поверх
  rationale: Естественно передаёт пространственное выражение «которые [были] над/на вершине», не устраняя необычность масоретского текста.
- source_word: הָרִמֹּנִים
  choice: гранатов
  rationale: Буквально «гранатов»; в данном контексте, вероятно, имеются в виду украшения в форме плодов граната, что поясняется в сноске.
- source_word: וְכֵן עָשָׂה
  choice: так же он сделал
  rationale: Формула указывает на повторение той же работы на парной архитектурной детали.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: для второй капители
  rationale: Прямо передаёт соответствующую капитель второго столба без лишнего уточнения.
