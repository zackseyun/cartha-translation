base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: ru
  text: и тазы, щипцы для светильников, чаши[a], чашечки и совки для углей — из чистого золота; и дверные гнёзда[b] для дверей внутреннего помещения, то есть Святого святых[c], и для дверей храмового зала[d] — из золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чаши для кропления».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеются в виду гнёзда или иные детали, в которых вращались дверные штыри, а не петли современного типа.
    reason: cultural_note
  - marker: c
    text: 'Или: «Святейшего места».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «дома — храмового зала»; речь идёт о главном зале храма, отличном от внутреннего помещения.'
    reason: translation_note
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: тазы
  rationale: В перечне храмовой утвари слово естественно обозначает вместительный сосуд; «тазы» также отличает его от следующих מִזְרָקוֹת.
- source_word: הַמְזַמְּרוֹת
  choice: щипцы для светильников
  rationale: В храмовом контексте это приспособления для ухода за фитилями; описательный перевод понятнее редкого «щипцы для снятия нагара».
- source_word: הַמִּזְרָקוֹת
  choice: чаши для кропления
  rationale: Слово обозначает культовые чаши для обращения с жидкостью, в том числе для кропления; уточнение отличает их от других сосудов списка.
- source_word: הַכַּפּוֹת
  choice: чашечки
  rationale: Существительное обозначает небольшой вогнутый сосуд; «чашечки» сохраняет форму и не навязывает более узкую функцию ложек или кадильниц.
- source_word: הַמַּחְתּוֹת
  choice: совки для углей
  rationale: Это храмовые принадлежности для переноса горячих углей; такой перевод точнее и понятнее, чем потенциально неоднозначные «кадильницы».
- source_word: זָהָב סָגוּר
  choice: чистое золото
  rationale: Устойчивое сочетание указывает на высококачественное очищенное золото; «чистое золото» естественно по-русски.
- source_word: הַפֹּתוֹת
  choice: дверные гнёзда
  rationale: Вероятнее всего, речь о гнёздах или опорах, в которых вращались дверные штыри, а не о современных боковых петлях.
- source_word: הַבַּיִת הַפְּנִימִי לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: внутреннее помещение, то есть Святое святых
  rationale: Передаёт внутреннюю часть храмового здания и поясняющую конструкцию, называющую её самым святым помещением.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: для дверей храмового зала
  rationale: הֵיכָל здесь означает главный зал храма, отличный от внутреннего помещения; русский оборот избегает неестественного буквального повтора «дома».
theological_decisions:
- issue: Передача קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  alternative: Святейшее место
  rationale: Сохранена традиционная и понятная русская формула еврейского суперлатива; вариант «Святейшее место» передаёт смысл более прямо, но менее узнаваем.
translation_notes:
  register: Современный литературный русский с достоинством храмового контекста. Перечень сохранён как часть продолжающегося предложения; редкие предметы переданы ясными функциональными названиями, а архитектурная неопределённость вынесена в примечание.
