  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: ru
  text: и светильники — пять справа и пять слева перед внутренним святилищем[a] — из чистого[b] золота, и цветочные украшения, лампы и щипцы[c] — из золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Святым святых». Еврейское слово דְּבִיר обозначает самое внутреннее помещение храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очищенного золота».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «щипцы для фитилей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: светильники
  rationale: מְנוֹרוֹת обозначает храмовые светильники-подставки для масляных ламп. «Светильники» — естественный русский эквивалент, не создающий ошибочной ассоциации со свечами.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: справа ... слева
  rationale: Передаёт буквальные пространственные обозначения еврейского текста, не заменяя их возможной храмовой ориентацией «с юга ... с севера».
- source_word: לִפְנֵי הַדְּבִיר
  choice: перед внутренним святилищем
  rationale: דְּבִיר — самое внутреннее помещение храма. Формулировка ясна современному читателю и сохраняет предметное значение термина.
- source_word: זָהָב סָגוּר
  choice: из чистого золота
  rationale: Устойчивое и естественное обозначение золота высокой степени очистки; возможное понимание как «очищенного золота» отмечено в сноске.
- source_word: הַפֶּרַח
  choice: цветочные украшения
  rationale: Единственное число имеет здесь собирательное значение и обозначает декоративные элементы в виде цветов; такой перевод яснее буквального «цветок» в перечне храмовой утвари.
- source_word: הַנֵּרֹת
  choice: лампы
  rationale: Обозначает отдельные масляные лампы, помещавшиеся на светильниках.
- source_word: הַמֶּלְקַחַיִם
  choice: щипцы
  rationale: Прямой русский эквивалент названия парного инструмента для обслуживания ламп; более специальное «щипцы для снятия нагара» дано как поясняющая альтернатива.
- source_word: זָהָב
  choice: из золота
  rationale: Сохраняет именную конструкцию заключительной части перечня и естественно относится к цветочным украшениям, лампам и щипцам.
theological_decisions:
- issue: Обозначение הַדְּבִיר
  choice: внутреннее святилище
  alternative: Святое святых
  rationale: Основной текст передаёт архитектурное значение слова, а традиционное культовое наименование сохраняется в сноске; богословское отождествление не скрывается и не навязывается как единственная лексическая форма.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового инвентарного перечня. Тире помогают ясно показать расположение светильников и материал изготовления. Начальное «и» сохранено, поскольку стих синтаксически продолжает предшествующий перечень.
