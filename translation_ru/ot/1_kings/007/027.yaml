base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: ru
  text: Он сделал десять бронзовых подставок[a]. Длина каждой подставки составляла четыре локтя, ширина — четыре локтя, а высота — три локтя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оснований». Еврейское слово обозначает бронзовые опоры для умывальниц в храмовом комплексе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol продолжает последовательное повествование. Простое прошедшее время естественно передаёт действие; союз וַ не требуется выражать отдельным «и» или «затем».
- source_word: הַמְּכֹנוֹת
  choice: подставок
  rationale: В данном контексте מְכוֹנוֹת — бронзовые опоры для умывальниц, описываемые далее. «Подставки» ясно передаёт их функцию и не создаёт ошибочного представления об обычных повозках.
- source_word: עֶשֶׂר
  choice: десять
  rationale: Точное соответствие количественному числительному.
- source_word: נְחֹשֶׁת
  choice: бронзовых
  rationale: В описаниях храмовой утвари נְחֹשֶׁת обычно обозначает бронзу, хотя само еврейское слово может шире относиться к меди и её сплавам.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: Каждая подставка
  rationale: Буквально «одна подставка»; в перечне размеров это еврейский способ указать на каждый отдельный предмет.
- source_word: אַמָּה
  choice: локтя
  rationale: Сохранена древняя мера длины без неточного современного пересчёта.
- source_word: אֹרֶךְ ... רָחְבָּהּ ... קוֹמָתָהּ
  choice: в длину ... в ширину ... в высоту
  rationale: Естественная русская конструкция для последовательного указания трёх размеров с сохранением всех величин исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; лаконичная описательная проза. Термин «подставки» понятен без специальной подготовки, а древняя мера «локоть» сохранена как традиционная библейская единица. Маркер примечания поставлен непосредственно после слова, к которому относится лексическая альтернатива.
