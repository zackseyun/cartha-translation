  source_fidelity: 'Начальная часть передана точно: мать была вдовой из колена Неффалима, отец — тирянин и ремесленник по бронзе. Триада «мудрость, разумение и знание» и специализация в работе с бронзой сохранены. Однако «всю порученную ему работу» неоправданно снимает неоднозначность еврейского суффикса в מְלַאכְתּוֹ («его работу»): исходный текст не говорит прямо, что работа была поручена ему.'
