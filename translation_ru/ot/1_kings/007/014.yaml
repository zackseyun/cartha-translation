base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: ru
  text: Он был сыном вдовы из колена Неффалима, а его отец был тирянином[a], мастером, работавшим с бронзой. Он был исполнен мудрости, разумения и знания, чтобы выполнять любые работы по бронзе[b]. Он пришёл к царю Соломону и сделал всю свою работу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человеком из Тира.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «нехошет» может означать медь или бронзу; в контексте храмовой утвари здесь уместно «бронза».
    reason: lexical_alternative
  - marker: c
    text: Еврейский суффикс буквально означает «его»; из контекста не вполне ясно, относится ли он к мастеру или к царю.
    reason: ambiguity
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: сыном вдовы
  rationale: Естественно и точно передаёт конструкцию, подчёркивающую, что его мать была вдовой.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: из колена Неффалима
  rationale: מַטֶּה в данном родоплеменном контексте означает «колено»; форма имени соответствует принятой русской библейской традиции.
- source_word: אִישׁ צֹרִי
  choice: тирянином
  rationale: צֹרִי — этникон со значением «тирянин, человек из Тира»; краткая русская форма естественна и точна.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: мастером по бронзе
  rationale: חֹרֵשׁ обозначает искусного ремесленника, а не просто работника; נְחֹשֶׁת в контексте храмовой утвари уместно передать как «бронза».
- source_word: וַיִּמָּלֵא
  choice: Он был исполнен
  rationale: Пассивная форма указывает на обретённую полноту способностей; «был исполнен» сохраняет образ исходного текста и достойный регистр.
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: мудрости, разумения и знания
  rationale: Сохраняется трёхчастный ряд практических и интеллектуальных способностей ремесленника.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: чтобы выполнять всякую работу с бронзой
  rationale: Передаёт широкий охват כָּל מְלָאכָה и естественно описывает работу с данным материалом.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Он пришёл к царю Соломону
  rationale: Точно передаёт последовательность повествования без избыточного причинного оттенка.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: и выполнил всю порученную ему работу
  rationale: Суффикс допускает понимание «его работа»; в русском явное «порученную ему» делает контекстный смысл естественным, при этом неоднозначность отмечена в сноске.
