  text: בְּ/כִכַּ֤ר הַ/יַּרְדֵּן֙ יְצָקָ֣/ם הַ/מֶּ֔לֶךְ בְּ/מַעֲבֵ֖ה הָ/אֲדָמָ֑ה בֵּ֥ין סֻכּ֖וֹת וּ/בֵ֥ין צָרְתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: ru
  text: На равнине Иордана[a], между Суккотом и Цартаном, царь отлил их[b] в плотной глинистой земле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Иорданской долине». Буквально еврейское выражение обозначает область, или равнину, Иордана.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вылил их»; здесь имеется в виду отливка металлических изделий.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в толще земли»; вероятно, имеется в виду плотный глинистый грунт, пригодный для отливки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: На равнине Иордана
  rationale: В географическом контексте כִּכָּר обозначает область или равнину, здесь — Иорданскую равнину. Формулировка сохраняет образ исходного текста и естественна по-русски.
- source_word: יְצָקָם
  choice: отлил их
  rationale: Глагол יצק в данном контексте означает литьё металлических изделий; местоименное окончание 3-го лица множественного числа передано словом «их».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Исходный текст содержит нарицательное существительное с артиклем, а не имя Соломона; определённость в русском языке ясна из контекста.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: в плотной глинистой земле
  rationale: מַעֲבֶה указывает на толщину или плотность земли. В контексте отливки речь, вероятно, идёт о плотном глинистом грунте, пригодном для изготовления литейных форм.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: между Суккотом и Цартаном
  rationale: Названия переданы транслитерацией с еврейского; падежные формы соответствуют нормам современного русского языка.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; синтаксис перестроен для естественного звучания без изменения пространственных связей. Сохранено «царь», а не добавлено имя Соломона. Не вполне ясное выражение о плотности земли передано в тексте контекстуально, а буквальный смысл сохранён в сноске.
