base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: ru
  text: Его отверстие[a] выступало вверх изнутри венца на один локоть. Отверстие было круглым, как у подставки[b], в полтора локтя; на отверстии были также резные украшения[c], а их обрамления были квадратными, не круглыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уста»; в еврейском тексте отверстие названо архитектурной метафорой.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское техническое выражение не вполне ясно; возможны переводы: «подобно работе подставки», «как устройство подставки» или «подобно сделанному основанию».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные переводы: «резьба», «плетёный орнамент», «венки» или «гирлянды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: отверстие
  rationale: В описании сооружения слово פֶּה («рот, уста») метафорически обозначает отверстие; «отверстие» естественно передаёт смысл и сохраняет повтор исходного текста.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: изнутри венца
  rationale: בַּיִת здесь обозначает внутреннюю часть, а כֹּתֶרֶת — венчающий верхний элемент конструкции.
- source_word: וָמַעְלָה בָּאַמָּה
  choice: выступало вверх ... на один локоть
  rationale: В еврейской фразе подразумевается вертикальное продолжение; глагол «выступало» делает это пространственное описание ясным без лишней конкретизации.
- source_word: עָגֹל
  choice: круглым
  rationale: Прямое обозначение круглой формы.
- source_word: מַעֲשֵׂה כֵן
  choice: подобно работе основания
  rationale: 'Буквальная и намеренно осторожная передача трудного технического выражения: כֵּן может означать основание, подставку или станину, а מַעֲשֵׂה — работу либо устройство.'
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: в полтора локтя
  rationale: Передаёт меру исходного текста, не добавляя отсутствующего в нём уточнения о диаметре или высоте.
- source_word: מִקְלָעוֹת
  choice: резные украшения
  rationale: Обобщённое обозначение декоративной работы, не определяющее с уверенностью спорный орнаментальный мотив.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: их обрамления
  rationale: Слово обозначает рамы, обрамлённые участки или филёнки; «обрамления» сохраняет широкий архитектурный смысл.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: были квадратными, не круглыми
  rationale: Прямая передача явного противопоставления четырёхугольной и круглой формы.
