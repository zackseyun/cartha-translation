base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: ru
  text: 'Для капителей, находившихся на вершинах столбов, были сделаны решётки сетчатой работы и витые шнуры цепного плетения: семь для одной капители[a] и семь для другой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «сетки сетчатого плетения и плетёные пряди в виде цепей». В еврейском тексте употреблены парные ремесленные термины, описывающие декоративную металлическую работу на капителях столбов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: решётки сетчатой работы
  rationale: Сохраняет конкретный образ ажурной металлической конструкции и характерное для еврейского текста сочетание однокоренных ремесленных терминов, не прибегая к архаизмам.
- source_word: גְּדִלִים
  choice: витые шнуры
  rationale: Слово обозначает скрученные или плетёные элементы. «Витые шнуры» передаёт их форму, не уточняя без достаточных оснований, были ли это венки или гирлянды.
- source_word: מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: цепного плетения
  rationale: Выражение характеризует декоративную работу как состоящую из цепей или напоминающую цепи; выбранная формулировка естественна по-русски и подходит к описанию металлического орнамента.
- source_word: לַכֹּתָרֹת
  choice: для капителей
  rationale: В архитектурном контексте כֹּתֶרֶת — декоративное завершение столба; «капитель» является точным и современным русским термином.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: на вершинах столбов
  rationale: Передаёт буквальный пространственный образ «на головах столбов» естественным современным русским выражением.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: семь для одной капители и семь для другой
  rationale: Сохраняет явное распределение семи декоративных элементов на каждую из двух капителей.
