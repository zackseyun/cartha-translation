  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: ru
  text: Он построил Дом Ливанского леса — сто локтей в длину, пятьдесят локтей в ширину и тридцать локтей в высоту, — на четырёх рядах кедровых столбов[a], с кедровыми балками[b] на столбах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «с четырьмя рядами кедровых столбов»; предлог может указывать либо на опору («на»), либо на устройство сооружения («с»).'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово буквально означает вытесанные части кедра; речь может идти о балках, стропилах или иных деревянных элементах конструкции.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Последовательная форма с וַ передаёт продолжение повествования; в современном русском естественно простое прошедшее время без обязательного начального «и».
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Дом Ливанского леса
  rationale: Сохранено буквальное наименование сооружения через конструкцию со значением «дом леса Ливана»; слово «дворец» не вводится, поскольку функция здания здесь прямо не названа.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: сто локтей в длину, пятьдесят локтей в ширину и тридцать локтей в высоту
  rationale: Естественная русская формула размеров сохраняет древнюю меру «локоть» и параллелизм трёх величин.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: на четырёх рядах кедровых столбов
  rationale: טוּרֵי означает ряды, עַמּוּדֵי — столбы; «на» сохраняет основное пространственное значение עַל, а возможное значение устройства посредством этих рядов отмечено в сноске.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: с кедровыми балками на столбах
  rationale: כְרֻתוֹת буквально обозначает вытесанные или отрубленные элементы; в архитектурном контексте «балки» — ясный и вероятный эквивалент, при этом лексическая неопределённость вынесена в сноску.
