  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: ru
  text: Большой двор по всему периметру был сложен из трёх рядов тёсаного камня и одного ряда кедровых брусьев[b] — так же, как внутренний двор дома Яхве и притвор[c] дома.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а также для внутреннего двора дома Яхве и для притвора дома». Еврейский предлог может обозначать как соответствие, так и отношение; в основном тексте он передан сравнением: «так же, как».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из трёх ярусов кладки из тёсаного камня и одного яруса кедровых брусьев».'
    reason: lexical_alternative
  - marker: c
    text: То есть крытая входная часть храмового здания.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: большой двор
  rationale: חָצֵר обозначает ограждённый двор; «двор» естественно и точно передаёт архитектурный контекст.
- source_word: סָבִיב
  choice: по всему периметру
  rationale: Передаёт значение окружения со всех сторон и естественно сочетается с описанием кладки двора.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: три ряда тёсаного камня
  rationale: טוּר в строительном контексте — ряд или ярус кладки, а גָּזִית — обработанный, тёсаный камень. Основной вариант остаётся понятным неспециалисту.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: и один ряд кедровых брусьев
  rationale: כְּרֻתֹת буквально указывает на вырубленные или обтёсанные деревянные элементы; «брусья» ясно передаёт их строительную функцию.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: так же, как внутренний двор дома Яхве
  rationale: Предлог ל־ понят как вводящий соответствие или сравнение с устройством внутреннего двора; неоднозначность отражена в сноске.
- source_word: אֻלָם
  choice: притвор
  rationale: Обозначает входное помещение или крытую входную часть монументального здания; «притвор» точно и привычно в русском описании храма.
- source_word: הַבָּיִת
  choice: дом
  rationale: Сохраняет буквальное храмовое именование «дом», при ясном из контекста указании на храмовое здание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя; форма «Яхве» прямо передаёт его и соответствует принятому решению не заменять имя титулом.
- issue: Значение предлога ל־ перед внутренним двором и притвором
  choice: 'сравнение: «так же, как»'
  alternative: 'отношение или назначение: «и для внутреннего двора… и для притвора…»'
  rationale: В контексте строительного описания сравнительное понимание естественно связывает устройство большого двора с названными частями храма, однако грамматика допускает и более буквальное понимание, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Архитектурные термины выбраны понятными для широкого читателя; более технический вариант вынесен в сноску. Эллиптическая еврейская конструкция раскрыта минимально, без устранения грамматической неоднозначности.
