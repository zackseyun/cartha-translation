revisions:
- from: На двух столбах были капители — также и сверху, напротив округлой выпуклости[a], находившейся рядом с сетчатым плетением[b]; а гранатов было двести, рядами по всей окружности второй капители[c].
  to: Капители на двух столбах располагались также вверху, напротив округлой выпуклости[a], находившейся рядом с сетчатым плетением[b]; вокруг второй капители[c] рядами шли двести изображений гранатов.
  rationale: Перестроено первое предложение, чтобы «также вверху» не оставалось синтаксически оторванным, при этом не уточняется спорное соотношение капители, выпуклой части и сетчатого элемента. «Напротив» сохранено как передача לְעֻמַּת, а «рядом с» передаёт осторожное понимание לְעֵבֶר в трудной конструкции. Добавлено «изображений» для естественного обозначения орнамента.
