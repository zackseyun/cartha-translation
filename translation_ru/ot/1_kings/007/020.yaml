base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: ru
  text: Капители на двух столбах располагались также вверху, напротив округлой выпуклости[a], находившейся рядом с сетчатым плетением[b]; вокруг второй капители[c] рядами шли двести изображений гранатов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живота»; имеется в виду округлая, выпуклая часть капители.'
    reason: lexical_alternative
  - marker: b
    text: То есть декоративной сетки или решётчатого плетения на капители.
    reason: cultural_note
  - marker: c
    text: 'Или: «другой капители». Еврейское слово «вторая» здесь может отличать соответствующую капитель второго столба.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת
  choice: капители
  rationale: В данном архитектурном контексте слово обозначает верхние декоративные части колонн; «капители» — точный и современный русский термин.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: на двух столбах
  rationale: Прямо передаёт местоположение капителей и сохраняет конкретное число столбов.
- source_word: גַּם מִמַּעַל
  choice: также и сверху
  rationale: Сохраняет добавочное значение גַּם и пространственное значение מִמַּעַל, не уточняя сверх того трудную архитектурную конструкцию стиха.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: напротив округлой выпуклости
  rationale: לְעֻמַּת означает «напротив, перед», а буквальное «живот» здесь образно называет округлую выступающую часть капители.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: находившейся рядом с сетчатым плетением
  rationale: שבכה обозначает сетчатый или решётчатый декоративный элемент; לְעֵבֶר в этой трудной пространственной формулировке допускает значение расположения рядом или с другой стороны.
- source_word: הָרִמּוֹנִים
  choice: гранатов
  rationale: Речь идёт о декоративных изображениях плодов граната; краткая форма естественно читается в контексте храмового убранства.
- source_word: מָאתַיִם
  choice: двести
  rationale: Прямая передача количественного числительного.
- source_word: טֻרִים סָבִיב
  choice: рядами по всей окружности
  rationale: Передаёт упорядоченное расположение украшений рядами вокруг капители, не добавляя отсутствующего в масоретском тексте числа рядов.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: по всей окружности второй капители
  rationale: שֵּׁנִית прямо означает «вторая»; пространственная формулировка по-русски естественно связывает украшения с окружностью капители.
