  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: ru
  text: Устройство колёс было таким же, как устройство колеса колесницы; их оси[a], ободья, спицы[b] и ступицы — всё это было отлито.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рукояти» или «опоры». Еврейское слово буквально связано со словом «рука», но здесь, в описании колёс, вероятно, означает осевые детали или опоры.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обручи» вместо «спиц» и «распорки» или «крепления» вместо «ступиц». Оба еврейских термина редки, и точное назначение этих деталей определяется по контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה הָאֹפַנִּים / כְּמַעֲשֵׂה אוֹפַן
  choice: Колёса были сделаны так же, как колёса
  rationale: מַעֲשֵׂה обозначает устройство или способ изготовления. Русская глагольная конструкция естественно передаёт сравнение, выраженное כְּ, без тяжеловесного повтора «работа… как работа».
- source_word: הַמֶּרְכָּבָה
  choice: колесницы
  rationale: Обычное значение слова в библейском иврите; оно соответствует древнему контексту точнее, чем «повозка».
- source_word: יְדוֹתָם
  choice: оси
  rationale: Буквально слово связано с «руками» или «рукоятями», однако в перечне деталей колеса, вероятнее всего, обозначает осевые элементы. Неопределённость отмечена в сноске.
- source_word: גַבֵּיהֶם
  choice: ободья
  rationale: Буквально «спины»; применительно к колёсам речь, вероятно, идёт об их наружных ободьях.
- source_word: חִשֻּׁקֵיהֶם
  choice: спицы
  rationale: Редкий технический термин; по контексту обозначает соединительные части колеса. Возможное значение «обручи» сохранено в сноске.
- source_word: חִשֻּׁרֵיהֶם
  choice: ступицы
  rationale: Редкий термин в перечне частей колеса, вероятно обозначающий центральные детали; альтернативы приведены в сноске.
- source_word: הַכֹּל מוּצָק
  choice: были целиком отлиты
  rationale: מוּצָק — пассивная форма от יצק, указывающая на литьё. «Целиком» передаёт суммирующее הַכֹּל и естественно относится ко всем перечисленным деталям.
