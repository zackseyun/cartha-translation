  yaml_path: translation/ot/1_kings/007/044.yaml
  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: ru
  text: и одно Море[a], и двенадцать волов под Морем;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один водоём и двенадцать волов под водоёмом». Еврейское слово «море» здесь обозначает большой резервуар для воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Море
  rationale: В перечне храмовой утвари יָם обозначает большой литой резервуар для воды, традиционно именуемый «Морем». Прописная буква передаёт его употребление как устойчивого названия предмета.
- source_word: הָאֶחָד
  choice: одно
  rationale: Определённая форма числительного выделяет единственное Море на фоне нескольких других предметов в перечне; по-русски это естественно передаётся словом «одно».
- source_word: הַבָּקָר
  choice: волов
  rationale: Здесь בָּקָר обозначает фигуры крупных рогатых животных, служившие опорой Морю. «Волы» — традиционное и точное обозначение в данном архитектурном контексте; «быки» излишне уточняло бы пол.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Прямое соответствие количественному числительному.
- source_word: תַּחַת
  choice: под
  rationale: Предлог указывает на физическое положение волов ниже Моря, которое они поддерживали.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющийся союз с показателем прямого дополнения продолжает перечень; непереводимый отдельно объектный показатель в русском не выражается.
