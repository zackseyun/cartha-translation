    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: столбы
  rationale: В данном архитектурном контексте речь идёт о двух больших храмовых столбах; это естественный и общепонятный русский термин.
- source_word: גֻלֹּת
  choice: округлые элементы
  rationale: Слово обозначает округлые архитектурные детали капителей, но их точная форма неясна. Перевод сохраняет эту неопределённость и не утверждает, что это непременно чаши или шары.
- source_word: כֹּתָרֹת
  choice: капители
  rationale: Точный современный архитектурный термин для верхних украшенных частей столбов.
- source_word: רֹאשׁ
  choice: наверху
  rationale: В отношении архитектурного сооружения это естественная передача буквального значения «голова, верх».
- source_word: שְּׂבָכוֹת
  choice: сетчатые решётки
  rationale: Передаёт ажурную, подобную сети конструкцию и остаётся понятным современному читателю.
- source_word: לְכַסּוֹת
  choice: чтобы покрывать
  rationale: Инфинитив выражает назначение решёток; целевая конструкция прямо передаёт эту функцию.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: два / две
  rationale: Повтор числительного сохранён, поскольку он организует перечень изготовленных предметов.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: находившихся наверху столбов
  rationale: Сохраняет повторяющееся уточнение местоположения деталей и при этом звучит естественно по-русски.
