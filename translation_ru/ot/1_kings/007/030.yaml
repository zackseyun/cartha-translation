  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: ru
  text: У каждой подставки[a] было четыре бронзовых колеса и бронзовые оси; на четырёх её ножках находились выступы-опоры[b]. Под чашей эти выступы были отлиты, каждая опора — рядом с гирляндой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «основания»: еврейское מְכוֹנָה обозначает передвижную несущую конструкцию под чашей.'
    reason: lexical_alternative
  - marker: b
    text: Буквально «плечи»; здесь, по-видимому, имеются в виду выступающие детали, поддерживавшие чашу.
    reason: lexical_alternative
  - marker: c
    text: 'Значение редкого еврейского слова не вполне ясно; возможно также: «венком» или «фестоном».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: бронзовые колёса
  rationale: אוֹפַנִּים означает колёса; в описании храмовой утвари נְחֹשֶׁת естественно передавать как «бронза».
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: у каждой подставки
  rationale: מְכוֹנָה здесь обозначает передвижную несущую конструкцию под чашей. Еврейское сочетание с числительным описывает одну подставку как типовой экземпляр; по-русски распределительное «у каждой» естественно в данном контексте.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: бронзовые оси
  rationale: В непосредственном контексте колёс редкое סַרְנִים обозначает детали осевого механизма; «оси» точно передаёт эту функцию.
- source_word: פַעֲמֹתָיו
  choice: её ножки
  rationale: Слово связано со стопой, ногой или шагом; в описании конструкции наиболее непосредственно указывает на четыре нижние ножки. Контекстуальное «углы» возможно, но менее буквально.
- source_word: כְּתֵפֹת
  choice: выступы-опоры
  rationale: Буквально «плечи»; применительно к металлической конструкции это, вероятно, выступающие несущие детали. Сочетание сохраняет образ формы и поясняет функцию.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: под чашей
  rationale: כִּיּוֹר — большая чаша или умывальник; «чаша» понятно современному читателю и соответствует предмету в контексте.
- source_word: יְצֻקוֹת
  choice: были отлиты
  rationale: Страдательная форма от יצק в контексте обработки металла прямо указывает на литьё.
- source_word: מֵעֵבֶר אִישׁ
  choice: каждая — рядом с
  rationale: Распределительное אִישׁ индивидуализирует опоры, а מֵעֵבֶר указывает на их положение возле декоративного элемента, не позволяя уверенно уточнить геометрию.
- source_word: לֹיוֹת
  choice: гирляндой
  rationale: Редкое слово, вероятно, обозначает литой орнамент в виде гирлянды, фестона или венка; «гирлянда» естественно передаёт вероятный декоративный смысл.
