lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: Зал колонн
  rationale: Сочетание обозначает значительное зальное сооружение, характерной чертой которого были колонны. «Зал колонн» передаёт конструкцию естественно и сохраняет её архитектурный смысл.
- source_word: עָשָׂה
  choice: построил
  rationale: Основное значение глагола — «сделал», но применительно к зданию современное русское «построил» точнее передаёт действие без изменения смысла.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: длиной в пятьдесят локтей и шириной в тридцать локтей
  rationale: 'Естественная русская форма точно сохраняет обе меры и древнееврейскую последовательность: сначала длина, затем ширина.'
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Перед колоннами был притвор
  rationale: Во втором употреблении אוּלָם, вероятно, обозначает переднюю пристройку или входную часть Зала. Слово «притвор» подходит к архитектурному контексту; множественное местоимение передано через вероятный антецедент «колонны».
- source_word: וְעַמֻּדִים
  choice: колонны
  rationale: Существительное сохранено явно, несмотря на сжатый синтаксис исходного текста. В контексте монументального дворцового сооружения «колонны» звучит естественнее, чем «столбы».
- source_word: וְעָב
  choice: навес
  rationale: Значение редкого архитектурного термина неясно. «Навес» правдоподобно обозначает выступающий покрывающий элемент, но неопределённость отмечена в сноске.
- source_word: עַל־פְּנֵיהֶם
  choice: перед ними
  rationale: Сохранены пространственное значение выражения и множественное число местоименного суффикса; неясность его точного референта не устраняется добавлением отсутствующего в тексте пояснения.
