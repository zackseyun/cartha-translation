  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: ru
  text: Так была завершена вся работа, которую царь Соломон выполнил для дома Яхве. Затем Соломон внёс священные предметы Давида, своего отца, — серебро, золото и сосуды — и поместил их в сокровищницы дома Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַם כָּל הַמְּלָאכָה
  choice: Так была завершена вся работа
  rationale: Глагол שלם выражает достижение полноты, завершённость; страдательная конструкция естественна по-русски и сохраняет согласование со словом «работа».
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: которую царь Соломон выполнил
  rationale: В сочетании с «работой» глагол עשה естественно передаётся как «выполнил», а не более общим «сделал».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранены конкретный образ «дома» и личное имя יהוה, без поясняющей замены на «храм» или титул.
- source_word: וַיָּבֵא
  choice: внёс
  rationale: Порода hifil глагола בוא означает «внести, привести внутрь»; русский глагол передаёт направленность движения.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: святыни, принадлежавшие его отцу Давиду
  rationale: קָדְשֵׁי обозначает вещи, отделённые как священные или посвящённые. Оборот с «принадлежавшие» естественно передаёт конструкцию принадлежности, не утверждая, что святыни были предназначены Давиду.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: серебро, золото и сосуды
  rationale: Перечень сохранён как пояснительное приложение. כֵּלִים — широкое обозначение предметов и утвари; в храмовом контексте «сосуды» является точным и традиционно понятным соответствием.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: поместил их в сокровищницы
  rationale: נתן здесь означает помещение предметов, а множественное אֹצְרוֹת — хранилища ценностей при храме. Местоимение «их» добавлено для естественной русской связи с перечислением.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение קָדְשֵׁי
  choice: святыни
  alternative: посвящённые дары
  rationale: «Святыни» сохраняет связь корня קדש со святостью и оставляет открытым, были ли это дары, ценности или иные освящённые предметы; перечень далее частично поясняет их состав.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ради ясности, но образ «дома Яхве», последовательность действий и смысловая широта слова קָדְשֵׁי сохранены.
