base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: ru
  text: а также все города-хранилища[a], бывшие у Соломона, города для колесниц, города для всадников[b] и всё, что Соломон пожелал построить[c] в Иерусалиме, на Ливане и во всей подвластной ему земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города для хранения припасов» или «города для запасов». Еврейское выражение обозначает города, предназначенные для хранения запасов и снабжения.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает именно всадников, то есть конное войско, а не лошадей вообще.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «желание Соломона, которое он пожелал построить». Однокоренной повтор в еврейском тексте подчёркивает силу желания Соломона осуществить эти строительные замыслы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: города для хранения припасов
  rationale: Сочетание обозначает города, предназначенные для складирования запасов или снабжения; такой перевод ясен современному читателю и сохраняет административное назначение городов.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: принадлежавшие Соломону
  rationale: Конструкция с ל выражает принадлежность или отнесённость к Соломону; причастный оборот естественно передаёт это по-русски.
- source_word: עָרֵי הָרֶכֶב
  choice: города для колесниц
  rationale: Речь идёт о городах, предназначенных для размещения колесниц и связанной с ними военной инфраструктуры.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: города для всадников
  rationale: פָּרָשִׁים обозначает именно всадников, а не лошадей вообще; формулировка сохраняет отличие от городов для колесниц.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: всё, что Соломон пожелал
  rationale: Однокоренная именная и глагольная формы создают в еврейском эмфазу; русский перевод передаёт полноту и силу желания без неестественного повтора.
- source_word: לִבְנוֹת
  choice: построить
  rationale: Обычное и контекстуально точное обозначение осуществления царских строительных проектов.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: в Иерусалиме, на Ливане
  rationale: Предлоги переданы как указание места. Для названия горной области Ливана в русском языке естественно сочетание «на Ливане», позволяющее не сводить значение к строительному материалу.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: по всей земле, которой он правил
  rationale: Формулировка сохраняет территориальное значение אֶרֶץ и смысл царской власти в מֶמְשַׁלְתּוֹ, оставаясь естественной для современного русского языка.
