  text: וַ/יִּשְׁלַ֥ח חִירָ֖ם לַ/מֶּ֑לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֖ים כִּכַּ֥ר זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/014.yaml
  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
translation:
  language: ru
  text: И послал Хирам царю сто двадцать талантов золота[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная древняя мера веса; здесь имеются в виду сто двадцать талантов золота.
    reason: cultural_note
  - marker: b
    text: То есть царю Соломону; в еврейском тексте сказано просто «царю».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Форма с повествовательным вау продолжает последовательность событий; простой прошедший вид «послал» естественно передаёт значение שלח.
- source_word: חִירָם
  choice: Хирам
  rationale: Имя передано в принятой русской библейской форме, соответствующей еврейскому חִירָם.
- source_word: לַמֶּלֶךְ
  choice: царю
  rationale: Еврейский текст буквально говорит «царю»; из контекста ясно, что речь идёт о Соломоне, но имя в основной текст не добавлено.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: сто двадцать
  rationale: Прямое и естественное русское соответствие данному количественному выражению.
- source_word: כִּכַּר
  choice: талантов
  rationale: כִּכָּר обозначает древнюю крупную меру веса; традиционное русское соответствие — «талант».
- source_word: זָהָב
  choice: золота
  rationale: Существительное означает «золото»; родительный падеж естественно выражает содержимое или материал при обозначении меры веса.
