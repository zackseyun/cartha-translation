source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: ru
  text: 'И скажут: «Потому что они оставили Яхве, своего Бога, который вывел их отцов[a] из Египетской земли, а они прилепились к другим богам, поклонялись им и служили им, поэтому Яхве навёл на них всё это бедствие[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их предков». Буквально: «их отцов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всё это зло»; здесь имеется в виду бедствие, постигшее их как суд, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И скажут
  rationale: В связи с предыдущим вопросом форма естественно передаёт будущий ответ тех, кто увидит разорение.
- source_word: עַל אֲשֶׁר
  choice: За то, что
  rationale: Оборот вводит причину суда; русское выражение сохраняет причинно-возмездную связь и согласуется с последующим «за это».
- source_word: עָזְבוּ
  choice: оставили
  rationale: Передаёт сознательный разрыв верности Богу без архаичного оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: При Яхве форма имеет единственное значение; возвратное «своего» естественно соотносит Бога с субъектом «они».
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: вывел ... из земли Египетской
  rationale: Сохраняет традиционную формулу исхода и торжественный библейский регистр.
- source_word: אֲבֹתָם
  choice: их отцов
  rationale: Сохраняет грамматически мужское и буквально выраженное обозначение предшествующих поколений; более широкое значение отмечено в сноске.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: прилепились к другим богам
  rationale: Передаёт крепкую, намеренную привязанность и оттенок измены заветной верности; формула естественна для возвышенного русского библейского языка.
- source_word: וישתחו לָהֶם
  choice: поклонялись им
  rationale: Передаёт жест простирания и его культовый смысл, не смешивая его со следующим глаголом служения.
- source_word: וַיַּעַבְדֻם
  choice: служили им
  rationale: Сохраняет отдельный смысл культового служения после поклонения.
- source_word: עַל כֵּן
  choice: за это
  rationale: Ясно выражает следствие и словесно перекликается с начальным указанием причины.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: навёл на них всё это бедствие
  rationale: רָעָה здесь обозначает постигшее их несчастье как суд, а не нравственное зло.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет личное имя Бога; транслитерация сохраняет его и не подменяет титулом.
- issue: Значение אֲבֹתָם
  choice: их отцов
  alternative: их предков
  rationale: Основной текст сохраняет мужскую форму исходника, а сноска указывает допустимое более широкое родовое значение.
- issue: Характер הָרָעָה в данном контексте
  choice: бедствие
  alternative: зло; несчастье
  rationale: Речь идёт о пагубном последствии Божьего суда, а не о приписывании Богу нравственного зла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм «за то, что… за это» сохраняет причинно-следственную структуру еврейского текста; ряд «прилепились — поклонялись — служили» передаёт три самостоятельных действия.
