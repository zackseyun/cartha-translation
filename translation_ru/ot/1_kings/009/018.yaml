  text: и Баалат, и Тамар[a] в пустыне, в стране.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Тамар»; в параллельном месте, 2 Паралипоменон 8:4, стоит «Тадмор».'
