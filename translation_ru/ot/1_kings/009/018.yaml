lexical_decisions:
- source_word: וְ/אֶת
  choice: и
  rationale: Союз ו продолжает перечень, а показатель определённого прямого дополнения אֵת отдельно не переводится.
- source_word: בַּעֲלָת
  choice: Баалат
  rationale: Географическое название передано транслитерацией в форме, естественной для русского библейского текста.
- source_word: תמר
  choice: Тамар
  rationale: Основной текст WLC содержит תמר; вариант «Тадмор» из параллельного места сохранён в сноске.
- source_word: בַּ/מִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «пустыня» — ясный и естественный русский эквивалент.
- source_word: בָּ/אָֽרֶץ
  choice: в той земле
  rationale: Определённый артикль перед אֶרֶץ отражён указательным местоимением «той», что передаёт определённость и позволяет сохранить отдельное географическое уточнение исходного текста.
