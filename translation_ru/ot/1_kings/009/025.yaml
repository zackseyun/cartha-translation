  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: регулярность действия («три раза в год»), жертвы всесожжения и мирные жертвы, жертвенник, построенный для Яхве, культовое действие перед Яхве и завершение «дома». «На нём» обоснованно передаёт вероятную связь אִתּוֹ с жертвенником, не решая спорный синтаксис чрезмерно категорично. «Воскурял» допустимо как основное чтение וְהַקְטֵיר; сноска корректно сохраняет более широкое значение «обращать жертву в дым».'
