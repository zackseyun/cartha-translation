  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: ru
  text: Три раза в год Соломон возносил жертвы всесожжения и мирные жертвы на жертвеннике, который он построил для Яхве, и воскурял на нём перед Яхве[a]. Так он завершил дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращал на нём жертвы в дым». Еврейский глагол может обозначать не только воскурение благовоний, но и вообще сжигание жертвы, при котором она превращается в дым.'
    reason: lexical_alternative
  - marker: b
    text: То есть храм.
    reason: referent_clarification
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: возносил
  rationale: В породе хифиль глагол עלה в жертвенном контексте означает «возносить, приносить жертву». Русское «возносил» сохраняет образ восхождения жертвенного дыма и остаётся естественным в культовом контексте.
- source_word: עֹלוֹת
  choice: жертвы всесожжения
  rationale: Устойчивое русское обозначение жертв, полностью сжигавшихся на жертвеннике.
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный и понятный русский эквивалент названия жертв общения и благополучия; он не сводит значение слова к одному частному аспекту обряда.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: три раза в год
  rationale: Прямой и идиоматичный русский эквивалент еврейского выражения времени.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: на жертвеннике, который он построил для Яхве
  rationale: Передаёт место жертвоприношения и относительное придаточное без ненужного усложнения.
- source_word: וְהַקְטֵיר
  choice: воскурял
  rationale: Глагол קטר в хифиле может обозначать воскурение благовоний, но также шире — превращение жертвы в дым. Основной текст использует естественный культовый глагол, а более широкая возможность отмечена в сноске.
- source_word: אִתּוֹ
  choice: на нём
  rationale: Местоименный суффикс вероятнее всего соотносится с жертвенником. «На нём» естественно передаёт ритуальное действие, не вводя личного референта.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет пространственно-культовое выражение «перед Яхве» и не перегружает трудную еврейскую конструкцию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет отличие имени Бога от титула «Господь».
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Так он завершил дом
  rationale: Пиэль глагола שלם здесь означает довести до полноты или завершить. «Дом» сохраняет еврейскую метафору храма; его референт пояснён в сноске.
theological_decisions:
- issue: Характер участия Соломона в жертвоприношениях
  choice: Действия прямо приписаны Соломону, как в еврейском тексте, без уточнения, совершал ли он их собственноручно или распоряжался об их совершении.
  alternative: Явно представить Соломона либо лично исполняющим священнические действия, либо лишь поручающим их священникам.
  rationale: Царское повествовательное резюме допускает как непосредственное действие, так и действие по полномочию. Перевод сохраняет эту напряжённость и не вносит конфессионального вывода.
- issue: Значение וְהַקְטֵיר
  choice: В основном тексте передать как «воскурял», отметив в сноске более широкое жертвенное значение.
  alternative: Перевести исключительно как «обращал жертвы в дым».
  rationale: Контекст храма допускает воскурение благовоний, однако семантика глагола шире; сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Синтаксис упрощён до естественной русской фразы, при этом сохранены личное имя Яхве, традиционные названия жертв и неоднозначность описания роли Соломона.
