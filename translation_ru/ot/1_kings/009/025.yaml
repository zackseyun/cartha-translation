  terminology: «Яхве» последовательно передаёт тетраграмматон. Термины «жертвы всесожжения» и «мирные жертвы» точны и традиционно узнаваемы. «Дом» сохраняет формулировку оригинала, а сноска верно поясняет, что имеется в виду храм. Сноска a привязана к «воскурял» и соответствует отмеченной лексической неоднозначности, а сноска b — к «дому»; привязки функционально корректны.
