  source_fidelity: Текст точно передаёт וְזֶה דְבַר как вводное «Вот сведения о», מַס как трудовую, а не денежную повинность, и административное הֶעֱלָה как «наложил». Целевой инфинитив «чтобы построить» верно отражает לִבְנוֹת. Все объекты строительной деятельности и их порядок сохранены. «Дом Яхве» передаёт בֵּית יהוה без подмены имени титулом; «Милло» обоснованно оставлено транслитерацией.
