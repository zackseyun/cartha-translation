source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: ru
  text: Вот сведения о трудовой повинности[a], которую царь Соломон наложил, чтобы построить дом Яхве, свой дом, Милло[b], стену Иерусалима, Хацор, Мегиддо и Гезер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «обязательной трудовой службе»; имеется в виду принудительный труд на государство, а не денежный налог.
    reason: lexical_alternative
  - marker: b
    text: Милло — вероятно, известное укрепление или сооружение из насыпных террас в Иерусалиме; еврейское название может означать «заполнение» или относиться к террасам.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: сведения
  rationale: В сочетании וְזֶה דְבַר הַמַּס слово вводит пояснительное сообщение о повинности. «Сведения» естественно передаёт этот смысл, не сводя דָּבָר только к «слову» или «делу».
- source_word: הַמַּס
  choice: трудовая повинность
  rationale: В контексте царских строительных работ מַס обозначает обязательный труд, налагаемый государством, а не денежный налог или дань.
- source_word: הֶעֱלָה
  choice: наложил
  rationale: 'Порода хифиль глагола עלה здесь имеет административный смысл: царь ввёл или наложил повинность.'
- source_word: לִבְנוֹת
  choice: чтобы построить
  rationale: Инфинитив выражает цель наложения трудовой повинности.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется буквальный образ «дома» и личное имя Бога, выраженное тетраграмматоном.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Передаёт принадлежность дома Соломону и сохраняет контраст с домом Яхве; в контексте речь идёт о царском дворце.
- source_word: הַמִּלּוֹא
  choice: Милло
  rationale: Это название известного сооружения или участка укреплений в Иерусалиме; транслитерация не навязывает спорную точную реконструкцию.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: стену Иерусалима
  rationale: Прямой и естественный перевод еврейского сочетания.
- source_word: חָצֹר
  choice: Хацор
  rationale: Принятая русская передача географического названия.
- source_word: מְגִדּוֹ
  choice: Мегиддо
  rationale: Принятая русская передача географического названия.
- source_word: גָּזֶר
  choice: Гезер
  rationale: Принятая русская передача географического названия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; «Яхве» передаёт личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся близким к еврейскому перечислению, но звучит естественно. Частица וְ в начале не передана отдельным «и» или «теперь», поскольку здесь она служит связкой с контекстом.
