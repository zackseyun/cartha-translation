  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: ru
  text: И было, по прошествии двадцати лет[a], в которые Соломон построил два дома[b] — дом Яхве и царский дом, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по окончании двадцати лет». Еврейский оборот указывает на завершение двадцатилетнего периода.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «два дома»; далее они названы домом Яхве и царским домом.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Краткая повествовательная формула естественно передаёт переход к следующему событию и сохраняет некоторую торжественность без архаичного «и случилось».
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: к концу двадцати лет
  rationale: Оборот обозначает достижение границы завершившегося двадцатилетнего периода; по-русски «к концу» также естественно связывает срок с завершённым строительством.
- source_word: אֲשֶׁר בָּנָה
  choice: Соломон построил
  rationale: Русский вид глагола передаёт завершённость строительства к указанному сроку. Отдельное относительное придаточное было бы тяжеловесным и могло бы ошибочно подразумевать непрерывное строительство на протяжении всех двадцати лет.
- source_word: שְׁנֵי הַבָּתִּים
  choice: два дома
  rationale: Сохраняется буквальное значение בַּיִת и параллель со следующими двумя наименованиями; пояснение вынесено в сноску.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняются как образ «дома», так и личное имя יהוה, а не заменяющий его титул.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Естественный русский оборот сохраняет повтор слова «дом» и не сужает значение до истолковывающего «дворец».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, то есть личное имя Бога. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной повествовательной интонацией. Конечное тире и запятая показывают, что синтаксическая конструкция продолжается в следующем стихе. Маркеры сносок расположены непосредственно после тех выражений, которые они поясняют.
