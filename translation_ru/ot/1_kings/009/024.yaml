base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: ru
  text: Но дочь фараона поднялась из Города Давида в свой дом, который он построил для неё. Тогда он построил Милло[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «насыпь» либо «террасы». Еврейское слово «Милло», вероятно, обозначает укрепление или систему подпорных земляных сооружений и террас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица отмечает переход или противопоставление в повествовании; «но» естественно передаёт эту связь, не придавая ей ограничительного значения «только».
- source_word: בַּת פַּרְעֹה
  choice: дочь фараона
  rationale: Естественная русская передача еврейского сопряжённого сочетания; титул «фараон» в таком обороте пишется со строчной буквы.
- source_word: עָלְתָה
  choice: поднялась
  rationale: Глагол עלה обозначает движение вверх и, вероятно, отражает топографию; «поднялась» сохраняет это значение.
- source_word: מֵעִיר דָּוִד
  choice: из Города Давида
  rationale: Предлог מִן передаёт исходную точку движения, а название места сохраняется как собственное имя.
- source_word: אֶל בֵּיתָהּ
  choice: в свой дом
  rationale: בַּיִת буквально означает «дом» и в царском контексте может подразумевать дворец, однако нейтральное «дом» не добавляет толкования; возвратное «свой» естественно указывает на принадлежность субъекту.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: который он построил для неё
  rationale: Относительное предложение прямо относится к дому. Простое прошедшее время сохраняет форму исходного текста; предшествование строительству ясно из контекста.
- source_word: אָז
  choice: тогда
  rationale: Кратко и естественно передаёт временную последовательность.
- source_word: בָּנָה
  choice: он построил
  rationale: Форма обозначает совершённое действие; оснований добавлять «начал строить» нет.
- source_word: הַמִּלּוֹא
  choice: Милло
  rationale: Это спорный технический или топографический термин, вероятно название известного сооружения в Иерусалиме; транслитерация сохраняет референт без преждевременного выбора между значениями «насыпь», «террасы» и «укрепление».
