base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: ru
  text: Хирам, царь Тира, снабдил Соломона кедровой древесиной, кипарисовой древесиной[a] и золотом — всем, чего тот желал. Тогда царь Соломон отдал Хираму двадцать городов в земле Галилеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «можжевеловой», «пихтовой» или древесиной другого хвойного дерева; точная порода, обозначенная еврейским словом беро́ш, не установлена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: снабжал
  rationale: Хотя основное значение глагола — «нести, поднимать», конструкция с лицом как прямым дополнением и материалами с предлогом ב по контексту означает обеспечение необходимыми материалами. Несовершенный вид естественно передаёт предшествовавшее снабжение.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: кедровой древесиной
  rationale: עֵץ при названии породы дерева здесь обозначает строительную древесину, а не живые деревья.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: кипарисовой древесиной[a]
  rationale: Кипарис — распространённая передача спорного названия хвойного дерева בְּרוֹשׁ; неопределённость точной породы отмечена в сноске.
- source_word: וּבַזָּהָב
  choice: и золотом
  rationale: Прямая передача названия материала без смыслового расширения.
- source_word: לְכָל חֶפְצוֹ
  choice: всем, чего тот желал
  rationale: Передаёт полноту желаемого Соломоном и с помощью указательного местоимения устраняет неестественную для русского языка синтаксическую двусмысленность без изменения референта.
- source_word: אָז יִתֵּן
  choice: тогда ... отдал
  rationale: אָז вводит последующее событие, а имперфект יִתֵּן в повествовательном контексте обозначает действие в прошлом. «Отдал» уместно для передачи городов во владение.
- source_word: עֶשְׂרִים עִיר
  choice: двадцать городов
  rationale: Стандартная передача геополитического значения עִיר в данном контексте.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: в земле Галилейской
  rationale: Сохраняет значение אֶרֶץ «земля, область» и использует традиционную, понятную русскую форму географического названия.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Хирам ... Соломон ... Тир ... Галилея
  rationale: Употреблены закрепившиеся в современной русской библейской и общеязыковой традиции формы имён и географических названий.
