translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прямая речь передана естественно, а дипломатическое «брат мой» сохранено. Возможная неодобрительная игра слов в названии не разрешена догматически и вынесена в примечание.
