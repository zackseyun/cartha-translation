base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: ru
  text: 'Он сказал: «Что это за города ты дал мне, брат мой?» И назвал он их землёй Кавул[a] — так они называются и по сей день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Кавул», вероятно, географическое название, но в еврейском тексте здесь может быть и пренебрежительная игра слов — возможно, с намёком на нечто негодное либо скованное, ограниченное.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Что это за города
  rationale: Вопросительное מָה здесь выражает качественную оценку и недовольство Хирама. Современная русская конструкция «Что это за города» естественно передаёт и вопрос, и неодобрительный оттенок, не усиливая его толкованием.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: ты дал мне
  rationale: Еврейский перфект обозначает завершённую передачу; русский прошедший вид «дал» точно и естественно передаёт её в прямой речи.
- source_word: אָחִי
  choice: брат мой
  rationale: Сохранены явное притяжательное значение суффикса и дипломатическое обращение между правителями; порядок слов соответствует dignified narrative register.
- source_word: וַיִּקְרָא לָהֶם
  choice: И назвал он их
  rationale: קרא с ל обозначает называние или присвоение имени. «Назвал» яснее русского «стал называть» и сохраняет отсылку к городам.
- source_word: אֶרֶץ כָּבוּל
  choice: землёй Кавул
  rationale: כָּבוּל передано как топоним, поскольку точное значение возможной игры слов неясно. Форма «Кавул» отражает еврейские согласные и произношение с ב без дагеша; значение не вносится в основной текст.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: так они называются и по сей день
  rationale: Формула означает сохранение названия до времени повествователя. В русском добавление подразумеваемого глагола устраняет неестественную двусмысленность буквального «до сего дня», при этом не меняет содержания.
