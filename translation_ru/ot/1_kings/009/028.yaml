  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: ru
  text: Они прибыли в Офир[a], взяли оттуда четыреста двадцать талантов золота и доставили его царю Соломону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришли в Офир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: отправились
  rationale: Форма глагола בוא буквально обозначает прибытие или движение к месту. В данном повествовательном контексте русское «отправились» естественно передаёт движение участников экспедиции в Офир, не предполагая точки наблюдения говорящего; более буквальный вариант отмечен в сноске.
- source_word: אוֹפִירָה
  choice: в Офир
  rationale: Конечное направительное ה указывает на движение к месту; по-русски это выражено предлогом «в» с винительным падежом.
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Обычное значение לקח подходит прямому повествованию и не уточняет способ получения золота, которого исходный текст не сообщает.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Сохраняет явно выраженное значение исходной точки, переданное предлогом מִן.
- source_word: זָהָב
  choice: золота
  rationale: Стандартный русский эквивалент; родительный падеж естественно употребляется после указания количества.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים
  choice: четыреста двадцать
  rationale: Точное числовое значение сохранено и записано словами в соответствии с литературным оформлением текста.
- source_word: כִּכָּר
  choice: талантов
  rationale: Традиционный и общепонятный библейский термин для древней крупной единицы веса; форма согласована с числительным.
- source_word: וַיָּבִאוּ
  choice: доставили
  rationale: Каузативная форма глагола בוא означает «принесли, привезли, доставили». «Доставили» естественно охватывает перевозку крупного груза, не уточняя её способ.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: царю Соломону
  rationale: Естественный русский порядок титула и имени; дательный падеж передаёт направление передачи груза.
