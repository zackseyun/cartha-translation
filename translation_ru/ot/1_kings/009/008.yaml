id: 1KI.9.8
reference: 1 Kings 9:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: ru
  text: 'И этот дом станет развалинами[a]. Все, кто будет проходить мимо него, ужаснутся, присвистнут[b] и скажут: «Почему Яхве так поступил с этой землёй и с этим домом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «этот дом будет высок (возвышен)». В данном контексте многие понимают это как указание на то, что дом станет развалинами или зрелищем, вызывающим ужас; ср. 2 Пар. 7:21.'
    reason: textual_variant
  - marker: b
    text: 'Или: «издадут неодобрительный свист». Еврейский глагол обозначает резкий свист как выражение изумления или насмешки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: И этот дом
  rationale: «Дом» сохраняет буквальное значение בַּיִת и связь с домом, построенным для Яхве; из контекста ясно, что речь идёт о храме.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: станет развалинами
  rationale: Масоретский текст буквально читается как «будет высок/возвышен», однако в контексте суда это затруднительно. Параллель во 2 Пар. 7:21 и древняя текстовая традиция указывают на разорение; трудность отмечена в сноске.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Каждый, кто будет проходить мимо него
  rationale: Естественно передаёт еврейский оборот о всяком прохожем и сохраняет распределительное значение כָּל.
- source_word: יִשֹּׁם
  choice: ужаснётся
  rationale: Глагол выражает потрясение и ужас при виде опустошения; «ужаснётся» естественно и ёмко передаёт эту реакцию.
- source_word: וְשָׁרָק
  choice: и присвистнет
  rationale: Глагол обозначает резкий свист как выражение изумления или насмешки. «Присвистнет» естественно описывает такую реакцию; возможный оттенок неодобрительного свиста указан в сноске.
- source_word: וְאָמְרוּ
  choice: Тогда спросят
  rationale: Неопределённое множественное лицо по-русски естественно передаётся без выраженного подлежащего; «спросят» соответствует следующему вопросу.
- source_word: עַל מֶה
  choice: Почему
  rationale: Краткий и естественный русский эквивалент вопроса о причине.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Яхве так поступил
  rationale: «Так поступил» естественно передаёт указание כָּכָה на наблюдаемое действие суда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: с этой землёй и с этим домом
  rationale: Русское управление «так поступить с» идиоматично; повтор «дом» сохраняет еврейскую риторику.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл עֶלְיוֹן в контексте суда
  choice: станет развалинами
  alternative: будет высок / возвышен
  rationale: Буквальное масоретское чтение создаёт явное напряжение с контекстом проклятия. Параллель во 2 Пар. 7:21 поддерживает смысл разорения, но подлинная текстовая неоднозначность открыто сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Дом» оставлен вместо поясняющего «храм» ради лексической и риторической связи исходного текста. Формы «ужаснётся», «присвистнет» и безлично-неопределённое «спросят» понятны современному читателю и не перегружают стих.
