lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Глагол בנה в породе qal имеет основное значение «строить». В данном контексте речь может идти также о восстановлении или укреплении города, но основной текст сохраняет прямое лексическое значение.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: גָּזֶר
  choice: Гезер
  rationale: Современная русская передача названия древнего города, близкая к еврейской форме.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: Нижний Беф-Орон
  rationale: Прилагательное תַּחְתּוֹן отличает нижний из двух городов, носивших название Беф-Орон; такой порядок слов естественен для современного русского языка.
- source_word: אֶת / וְאֶת
  choice: отдельно не переводятся
  rationale: Показатели прямого дополнения переданы русской синтаксической конструкцией без отдельного словесного соответствия.
