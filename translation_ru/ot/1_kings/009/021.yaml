  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: ru
  text: Их потомков, оставшихся после них в этой земле, которых израильтяне не смогли предать заклятию[a], Соломон обложил трудовой повинностью, которую они несут до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол означает «предать заклятию»; возможные переводы: «обречь на уничтожение» или «полностью истребить». Речь идёт о помещении людей или предметов под херем, то есть под безвозвратное посвящение суду, обычно предполагающее уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: их потомков
  rationale: Множественное בָּנִים с местоименным суффиксом здесь обозначает последующее поколение оставшихся народов; «потомков» естественно передаёт более широкий смысл, не ограничивая его только сыновьями.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: оставшихся после них
  rationale: Передаёт результативное значение נותר и временное отношение к предшествующему поколению.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: В данном историческом контексте אֶרֶץ означает землю Ханаана/Израиля; указательное «этой» естественно передаёт определённость еврейского выражения.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: не смогли предать заклятию
  rationale: «Предать заклятию» сохраняет связь החרים с חֵרֶם — безвозвратным посвящением суду, обычно предполагающим уничтожение, — и не сводит выражение к обычному военному истреблению.
- source_word: וַיַּעֲלֵם ... לְמַס עֹבֵד
  choice: Соломон обложил трудовой повинностью
  rationale: Сочетание каузативной формы עלה с מַס עֹבֵד обозначает административное возложение обязательного труда; русское выражение ясно передаёт принудительный характер повинности без утверждения конкретного правового статуса рабов.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и уместное в историческом повествовании соответствие еврейской временной формуле; сохраняет лаконичность оригинала.
theological_decisions:
- issue: Передача החרים в контексте завоевания и суда
  choice: предать заклятию
  alternative: полностью истребить; обречь на уничтожение
  rationale: Выбранный вариант удерживает одновременно идею уничтожения и особого безвозвратного посвящения Божьему суду, не устраняя богословское напряжение и не превращая действие лишь в военную расправу.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Израильтяне» предпочтено архаизирующему «сыны Израиля», тогда как «до сего дня» сохранено как понятная устойчивая повествовательная формула. Вынесенный вперёд объект отражает порядок и акцент еврейского текста.
