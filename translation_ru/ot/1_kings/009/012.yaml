  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: ru
  text: И отправился Хирам из Тира посмотреть города, которые дал ему Соломон, но они ему не понравились[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они не были правильны в его глазах»; то есть он не одобрил их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: отправился
  rationale: Глагол יצא в повествовательной форме обозначает выход или отправление. «Отправился» естественно передаёт движение Хирама из Тира, не добавляя мотива.
- source_word: מִצֹּר
  choice: из Тира
  rationale: Предлог מן указывает на исходную точку движения; «из Тира» — естественное русское соответствие.
- source_word: לִרְאוֹת
  choice: посмотреть
  rationale: ראה буквально означает «видеть, смотреть». В данном контексте возможен оттенок осмотра, но «посмотреть» сохраняет широту исходного слова и естественно звучит по-русски.
- source_word: הֶעָרִים
  choice: города
  rationale: עיר может обозначать город или поселение; «города» соответствует контексту и обычному словоупотреблению.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: которые дал ему Соломон
  rationale: Относительное предложение определяет города. Русская форма прошедшего времени естественно передаёт действие, предшествовавшее их осмотру, без необходимости вводить дополнительную временную конструкцию.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: но они ему не понравились
  rationale: Идиома ישר בעיני выражает одобрение или приемлемость в чьей-либо оценке. Выбранная формулировка естественна для современного русского языка; буквальный образ сохранён в сноске.
