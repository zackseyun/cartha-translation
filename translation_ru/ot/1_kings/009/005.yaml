base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: ru
  text: 'то Я навеки утвержу престол твоего царства над Израилем, как обещал Давиду, твоему отцу: «Не пресечётся у тебя потомок, сидящий на престоле Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: то Я… утвержу
  rationale: Форма с waw выражает следствие условия предыдущего стиха; «утвержу» естественно передаёт идею установления и упрочения.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: престол твоего царства
  rationale: Сохранена образность и конструкция исходного текста без сведения «престола» лишь к династии.
- source_word: לְעֹלָם
  choice: навеки
  rationale: Передаёт временную неограниченность обещания, не снимая напряжения между обещанием и условием контекста.
- source_word: דִּבַּרְתִּי עַל־דָּוִד
  choice: обещал Давиду
  rationale: В данном контексте דיבר על указывает на ранее данное Давиду слово; по-русски «обещал Давиду» ясно и естественно.
- source_word: לֹא־יִכָּרֵת לְךָ אִישׁ
  choice: не пресечётся у тебя потомок
  rationale: Буквально говорится, что у адресата «не будет отсечён мужчина»; русский оборот передаёт продолжение мужской династической линии без неестественной кальки.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: сидящий на престоле Израиля
  rationale: Смысл конструкции — представитель рода не перестанет занимать престол; причастный оборот естественен в русском и сохраняет привязку к престолу Израиля.
theological_decisions:
- issue: Соотношение вечного обещания и условия послушания в контексте
  choice: Сохранить категорическое «навеки», оставив условную связь через «то» с предыдущим стихом
  alternative: Ослабить до «надолго» или представить обещание как безусловное вне контекста
  rationale: Исходный текст одновременно содержит условную рамку и לְעֹלָם; перевод не должен устранять это богословское напряжение.
- issue: Характер династического обещания
  choice: «не пресечётся у тебя потомок, сидящий на престоле Израиля»
  alternative: «у тебя всегда будет царь над Израилем»
  rationale: Выбранная формулировка сохраняет образ непресечения линии и престола, не добавляя толкования о непрерывности фактического царствования сверх формулировки стиха.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Архаичные кальки вроде «не истребится у тебя муж от престола» устранены; синтаксис остаётся близким к еврейскому ходу мысли.
