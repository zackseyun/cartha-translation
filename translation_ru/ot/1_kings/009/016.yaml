  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: ru
  text: Фараон, царь Египта, выступил в поход, захватил Газер и предал его огню, а живших в городе хананеев перебил. Затем он отдал Газер своей дочери, жене Соломона, как свадебный дар[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как приданое». Еврейское слово обозначает дар, связанный с выдачей дочери замуж; точный характер этого дара не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: выступил в поход
  rationale: В данном контексте глагол обозначает военное выступление; перевод передаёт направленное движение войска естественным современным русским языком, не добавляя конкретного географического направления.
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Обычное военное значение глагола לכד применительно к овладению городом.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: предал его огню
  rationale: Естественная русская формула сохраняет явное упоминание огня и значение полного сожжения города без тяжеловесного «сжёг его огнём».
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: живших в городе хананеев
  rationale: Единственное число в еврейском имеет собирательное значение; русское множественное число ясно обозначает хананейское население города.
- source_word: הָרָג
  choice: перебил
  rationale: В сочетании с собирательным обозначением жителей передаёт убийство всего названного населения; слово современно и соответствует суровому повествовательному тону.
- source_word: וַיִּתְּנָהּ
  choice: отдал Газер
  rationale: Повтор названия города вместо местоимения устраняет возможную двусмысленность рядом с упоминанием дочери; мужской грамматический род русского топонима требует соответствующего оформления.
- source_word: שִׁלֻּחִים
  choice: как свадебный дар
  rationale: Редкое слово обозначает дар, связанный с выдачей женщины замуж. Нейтральное выражение сохраняет общий смысл, не приравнивая древний обычай безоговорочно к строго определённому современному понятию приданого.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: своей дочери, жене Соломона
  rationale: Приложение естественно по-русски отождествляет дочь фараона с женой Соломона.
