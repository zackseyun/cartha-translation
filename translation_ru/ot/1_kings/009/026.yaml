  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: ru
  text: Царь Соломон также построил флот в Эцион-Гевере, расположенном близ Элота, на берегу Красного моря[a], в земле Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-еврейски: «Тростниковое море»; традиционный перевод — «Красное море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: также … флот
  rationale: Существительное אֳנִי может обозначать корабль или совокупность кораблей; в данном контексте естественное русское «флот» передаёт морское предприятие Соломона. Союз וָ выражен словом «также», связывающим стих с предшествующим повествованием.
- source_word: עָשָׂה
  choice: построил
  rationale: Хотя основное значение глагола — «сделал», применительно к кораблям русское «построил» точно и идиоматично.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: в Эцион-Гевере
  rationale: Предлог בְּ здесь указывает на место строительства; форма «в Эцион-Гевере» естественна для названия населённого пункта или порта.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: что у Элота
  rationale: Необычная конструкция с אֵת обозначает пространственную близость или соположение. «У Элота» сохраняет эту связь, не уточняя её сверх текста.
- source_word: עַל שְׂפַת יַם סוּף
  choice: на берегу Красного моря[a]
  rationale: שְׂפַת буквально означает «край, кромка» и в данном сочетании — «берег». Традиционное и географически понятное «Красное море» оставлено в тексте, а более буквальная передача названия вынесена в сноску.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: в земле Эдома
  rationale: Передача сохраняет существительное אֶרֶץ и географический акцент исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествовательного стиля. Библейские топонимы переданы близко к еврейской форме; избегнуты архаизмы «Елаф» и «Чермное море». Слово «флот» в русском уже подразумевает совокупность судов, поэтому добавление «кораблей» сочтено избыточным.
