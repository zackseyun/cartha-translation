  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: ru
  text: 'Вот главные должностные лица, поставленные над работами Соломона[a]: пятьсот пятьдесят человек, управлявших[b] людьми, выполнявшими работу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главные начальники надзирателей». Еврейское слово может обозначать назначенных должностных лиц или тех, кого поставили над другими.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надзиравших за людьми, выполнявшими работу». Еврейский глагол может означать управлять, осуществлять власть или руководить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: начальники распорядителей
  rationale: 'Сочетание передаёт конструкцию сопряжённого состояния: речь идёт о начальниках назначенных должностных лиц. «Распорядители» естественно звучит в административном контексте и не придаёт выражению военного оттенка.'
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: поставленных над работами Соломона
  rationale: Сохраняет значение пребывания «над» работой, то есть ответственности за неё, и передаёт לִשְׁלֹמֹה как отношение к Соломону и служение ему.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: пятьсот пятьдесят человек
  rationale: Нормальная русская передача числительного; слово «человек» проясняет счёт лиц и естественно связывает числительное с последующим причастным оборотом.
- source_word: הָרֹדִים
  choice: управлявших
  rationale: Глагол רדה обозначает осуществление власти или управления. «Управлявших» сохраняет силу исходного слова, тогда как «надзиравших» могло бы чрезмерно сузить его до наблюдения.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: народом, который выполнял работу
  rationale: Сохраняет широкое значение עָם — «народ, люди», не подменяя его более узким «работники»; относительное предложение ясно определяет, о каких людях идёт речь.
