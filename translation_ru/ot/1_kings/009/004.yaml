  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: ru
  text: А ты[a], если будешь ходить предо Мной, как ходил Давид, отец твой, в непорочности сердца и правоте, исполняя всё, что Я повелел тебе, и соблюдая Мои установления и законы[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что до тебя».'
    reason: Передаёт возможное более явное смысловое выделение וְאַתָּה.
  - marker: b
    text: 'Или: «Мои постановления и установленные правила».'
    reason: Еврейские חֻקִּים и מִשְׁפָּטִים — близкие юридические термины; их точное разграничение здесь не вполне определённо.
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Передаёт переход к прямому обращению и лёгкое смысловое выделение адресата естественным современным русским оборотом.
- source_word: אִם
  choice: если
  rationale: Прямо и без усиления вводит условие.
- source_word: תֵּלֵךְ לְפָנַי
  choice: будешь ходить предо Мной
  rationale: Сохраняет библейскую метафору поведения перед Богом; форма «предо Мной» естественна в возвышенном контексте.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: как ходил Давид, отец твой
  rationale: Сохраняет сравнение и повтор глагола, а также естественное для достойного библейского регистра положение приложения.
- source_word: בְּתָם לֵבָב
  choice: в непорочности сердца
  rationale: Передаёт цельность и нравственную искренность, не утверждая абсолютной безгрешности; возможная двусмысленность пояснена в сноске.
- source_word: וּבְיֹשֶׁר
  choice: и правоте
  rationale: Передаёт нравственную прямоту и правильность поведения, сохраняя отличие от «непорочности сердца».
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: исполняя всё, что Я повелел тебе
  rationale: Естественно связывает образ хождения с послушными действиями и сохраняет всеохватность כְּכֹל.
- source_word: חֻקַּי
  choice: Мои установления
  rationale: Передаёт предписания завета и сохраняет лексическое отличие от משפטים.
- source_word: וּמִשְׁפָּטַי
  choice: и законы
  rationale: Понятное современному читателю обозначение обязательных правовых предписаний; альтернативы отмечены в сноске.
- source_word: תִּשְׁמֹר
  choice: соблюдая
  rationale: В контексте завета точно передаёт значение верного исполнения предписаний; причастная конструкция естественно продолжает условное предложение.
theological_decisions:
- issue: Характеристика примера Давида
  choice: «в непорочности сердца и правоте» понимается как цельность и верность Богу, а не абсолютная безгрешность
  alternative: Понять выражение как утверждение полной нравственной безупречности Давида
  rationale: תָּם обозначает цельность и непорочность, но контекст не требует вывода о безгрешности; сноска сохраняет смысловую напряжённость, не ослабляя похвалу Давиду.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены метафора «ходить предо Мной», условная незавершённость стиха и различие двух правовых терминов. Все сноски отмечены в основном тексте.
