source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: ru
  text: Но если ты или твои сыновья отвернётесь от Меня[a], не будете соблюдать Мои заповеди и установления, которые Я дал вам, и пойдёте служить другим богам и поклоняться им,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы и ваши сыновья». Еврейскую фразу можно понимать как обращение к Соломону вместе с его потомками; в основном тексте подчёркнуто, что условие относится как к самому Соломону, так и к его царской линии.'
    reason: Альтернативное прочтение соединительной конструкции и династического охвата предупреждения.
lexical_decisions:
- source_word: אִם
  choice: но если
  rationale: Частица вводит условие; «но» передаёт противопоставление предшествующему обещанию, вытекающее из контекста.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: отвернётесь
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает идею поворота; вместе с מֵאַחֲרַי оно обозначает отступление от Господа. Русское «отвернётесь» естественно передаёт это в контексте предостережения.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: ты или твои сыновья
  rationale: В контексте предупреждение относится к Соломону и его династическим потомкам. Разделительное «или» ясно выражает применимость условия как к самому Соломону, так и к его сыновьям; буквальная соединительная форма отмечена в сноске.
- source_word: מֵאַחֲרַי
  choice: от Меня
  rationale: Еврейская идиома буквально говорит об отступлении от следования за Господом. В сочетании с «отвернётесь» русское «от Меня» передаёт её кратко и естественно.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: не будете соблюдать
  rationale: שׁמר применительно к заповедям означает исполнять или соблюдать их. «Соблюдать» естественно для современного русского языка и сохраняет заветно-правовой оттенок.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: Мои заповеди и установления
  rationale: Два различных правовых термина сохранены разными русскими словами; «установления» передаёт חֻקּוֹת без архаичного или узкоконфессионального оттенка.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: которые Я дал вам
  rationale: נתן означает «дать», а конструкция с לִפְנֵי представляет требования как предложенные адресатам. Краткая русская формулировка сохраняет смысл без неестественного буквализма «дал перед вами».
- source_word: וַהֲלַכְתֶּם
  choice: и пойдёте
  rationale: הלך вводит последующие действия отступничества. «Пойдёте служить» является естественным русским сочетанием и сохраняет самостоятельный глагол исходного текста.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: служить другим богам
  rationale: עבד передано как «служить», чтобы не смешивать его со следующим глаголом поклонения.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: поклоняться им
  rationale: Глагол обозначает преклонение или простирание перед кем-либо. «Поклоняться» естественно передаёт культовый смысл, оставаясь отличным от «служить».
theological_decisions:
- issue: Династический охват предупреждения
  choice: 'Предупреждение относится к Соломону и его сыновьям: «ты или твои сыновья».'
  alternative: Буквальное «вы и ваши сыновья» либо более широкое «вы и ваши дети».
  rationale: Контекст обращения к Соломону и упоминание именно сыновей указывают на царскую династию, а не на безразличное к полу обозначение всего народа. При этом соединительная форма еврейского текста сохранена как альтернативное понимание в сноске.
- issue: Различение служения и поклонения иным богам
  choice: 'Сохранены два действия: «служить» и «поклоняться».'
  alternative: Объединить оба глагола общим понятием поклонения.
  rationale: Еврейский текст намеренно употребляет עבד и השתחוה; сохранение обоих не сужает описание идолопоклонства до одного аспекта.
translation_notes:
  register: Современный литературный русский язык с dignified заветно-правовой лексикой. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Конечная запятая сохранена, поскольку условное предложение продолжается в следующем стихе.
