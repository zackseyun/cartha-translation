  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: ru
  text: 'И сказал ему Яхве: «Я услышал твою молитву и твою мольбу[a], с которой ты взывал ко Мне. Я освятил этот дом[b], который ты построил, чтобы поместить там Моё имя навеки. Мои глаза и Моё сердце будут там во все дни[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошение», «моление»; еврейское слово обозначает смиренную, настойчивую просьбу о благоволении.'
    reason: lexical_alternative
  - marker: b
    text: То есть храм, построенный Соломоном; еврейский текст буквально называет его «домом».
    reason: cultural_note
  - marker: c
    text: 'Образное выражение постоянного Божьего внимания, расположения и заботы; буквально: «Мои глаза и Моё сердце будут там во все дни».'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; соответствует проектному принципу сохранения тетраграмматона.
- source_word: שָׁמַעְתִּי
  choice: Я услышал
  rationale: Русское совершенное прошедшее естественно выражает завершённое действие, значимое для настоящего ответа Бога.
- source_word: תְּפִלָּתְךָ וְאֶת־תְּחִנָּתְךָ
  choice: твою молитву и твою мольбу
  rationale: 'Сохраняет два соотнесённых, но не тождественных понятия: молитву и смиренное, настойчивое прошение о милости.'
- source_word: אֲשֶׁר הִתְחַנַּנְתָּה לְפָנַי
  choice: с которой ты обратился ко Мне
  rationale: Естественно передаёт родственный существительному глагол, не создавая тяжеловесного повтора «мольбу, которой умолял»; לְפָנַי выражено обращением непосредственно к Богу.
- source_word: הִקְדַּשְׁתִּי
  choice: Я освятил
  rationale: Передаёт выделение дома как святого и предназначенного для Бога, сохраняя культовый смысл глагола.
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: Сохраняет буквальный образ «дома», хотя в контексте речь идёт о храме Соломона.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: чтобы поместить там Моё имя
  rationale: Сохраняет храмовую формулу об имени Бога и не заменяет её толкованием о физическом пребывании Бога.
- source_word: עַד־עוֹלָם
  choice: навеки
  rationale: Естественно и возвышенно передаёт идею непреходящей длительности в данном заветно-храмовом контексте.
- source_word: עֵינַי וְלִבִּי
  choice: Мои глаза и Моё сердце
  rationale: Сохраняет намеренно антропоморфный образ Божьего внимания, расположения и заботы.
- source_word: כָּל־הַיָּמִים
  choice: во все дни
  rationale: Сохраняет конкретную временную формулу еврейского текста вместо её полного сглаживания словом «всегда».
theological_decisions:
- issue: Антропоморфный образ «Мои глаза и Моё сердце»
  choice: Сохранить образ буквально
  alternative: Передать как «Моё внимание и Моя забота»
  rationale: Буквальная передача сохраняет богословскую и поэтическую выразительность текста, не навязывая читателю разъясняющий пересказ.
- issue: Формула «поместить там Моё имя»
  choice: Сохранить формулу об имени Бога
  alternative: Передать как «чтобы Я пребывал там» или «чтобы Мне поклонялись там»
  rationale: Исходный текст говорит именно о помещении имени; перевод не должен сводить эту заветную формулу к одному из возможных богословских истолкований.
- issue: Значение עַד־עוֹלָם в храмовом обещании
  choice: Передать как «навеки», не добавляя оговорок в основной текст
  alternative: Ослабить до «надолго» или расширить доктринальным пояснением
  rationale: Формула выражает непреходящее намерение и должна сохранять силу исходного обещания; её связь с последующими условиями повествования не следует заранее разрешать внутри стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые образы «дом», «поместить имя», «глаза и сердце» и «во все дни».
