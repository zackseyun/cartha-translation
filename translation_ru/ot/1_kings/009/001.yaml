  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: ru
  text: И когда Соломон закончил строить дом Яхве, дом царя и всё, что Соломон желал сделать,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё желаемое Соломоном»; возможно также: «все замыслы, которые Соломон хотел осуществить».'
    reason: Слово חֵשֶׁק может обозначать как желание, так и предмет желания; в данном контексте возможна более конкретная передача, подразумевающая задуманные работы.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: И когда… закончил
  rationale: Сочетание повествовательного וַיְהִי с временной конструкцией כְּכַלּוֹת вводит обстоятельство времени. По-русски естественно передать его единым оборотом «И когда… закончил», не воспроизводя буквально формулу «и было».
- source_word: לִבְנוֹת
  choice: строить
  rationale: После глагола «закончил» инфинитив «строить» естественно передаёт завершение строительства.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется буквальный образ «дома», а не вводится контекстуально верное, но более толковательное слово «храм»; имя יְהוָה передано как «Яхве».
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Естественная русская форма сохраняет параллель с «домом Яхве» и не заменяет исходный образ словом «дворец».
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: всё, что Соломон желал сделать
  rationale: Передаёт сочетание существительного חֵשֶׁק («желание; желаемое») с относительным предложением и сохраняет лексическую перекличку с חָפֵץ, не конкретизируя желаемое как «замыслы» или «проекты».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон, поэтому оно передано транслитерацией, а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Синтаксис оставлен незавершённым запятой, поскольку стих образует временную придаточную часть, продолжение которой следует в 1 Царств 9:2.
