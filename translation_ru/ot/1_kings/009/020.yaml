base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: ru
  text: Весь народ, оставшийся от аморреев, хеттов, ферезеев, евеев и иевусеев, — те, кто не принадлежал к числу сынов Израиля,[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к израильтянам». Буквально: «не из сынов Израиля».'
    reason: Уточняется буквальная форма еврейского выражения; в основном тексте «к числу» добавлено ради естественной русской сочетаемости.
lexical_decisions:
- source_word: כָּל הָעָם
  choice: Весь народ
  rationale: Сочетание כָּל с определённым собирательным существительным עָם естественно передаётся как «весь народ».
- source_word: הַנּוֹתָר מִן
  choice: оставшийся от
  rationale: Причастие нифаля от יתר обозначает оставшихся; מִן указывает на принадлежность к перечисленным народам. Формулировка сохраняет конструкцию оригинала без добавления идеи места.
- source_word: הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: аморреев, хеттов, ферезеев, евеев и иевусеев
  rationale: Употреблены устоявшиеся русские библейские формы этнонимов; еврейские формы единственного числа имеют здесь собирательное значение.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: те, кто не принадлежал к сынам Израиля
  rationale: Самостоятельное הֵמָּה подчёркивает и возобновляет подлежащее, поэтому передано словом «те». Оборот «не принадлежал к» естественно выражает происхождение или групповую принадлежность, передаваемую מִן; «сынам Израиля» сохраняет форму בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Значение выражения בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Основной текст сохраняет традиционный и прозрачный для еврейской формы оборот «сыны Израиля», не ограничивая его смысл только взрослыми мужчинами; более идиоматичный собирательный эквивалент дан в сноске.
- issue: Синтаксическая функция הֵמָּה
  choice: те, кто
  alternative: не выражать местоимение отдельно
  rationale: Усилительное самостоятельное местоимение сохранено в естественной русской возобновляющей конструкции. Это также удерживает незавершённость фразы, продолжающейся в следующем стихе.
translation_notes:
  register: Современный литературный русский с умеренно формальным библейским достоинством. Тире отражают вставной относительный оборот и незавершённый переход к следующему стиху; архаичные формы вроде «Аморреянина» не используются.
