  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: ru
  text: Но из сынов Израиля Соломон никого не сделал рабом, потому что они были воинами, его слугами, военачальниками, офицерами[a], командирами его колесничного войска и всадниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «адъютантами». Еврейское слово, вероятно, обозначает особую категорию высокопоставленных военных помощников или колесничных командиров.'
    reason: Точное значение древнего военного звания שָׁלִישׁ остаётся спорным.
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Но из сынов Израиля
  rationale: «Но» передаёт противопоставление по отношению к порабощённому нееврейскому населению в предыдущем стихе; «сыны Израиля» сохраняет форму древнееврейского выражения.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: Соломон никого не сделал рабом
  rationale: Контекст говорит о принудительном труде и зависимом положении. Такая формулировка естественна по-русски, передаёт собирательное единственное число עָבֶד и не смягчает его до «слуги».
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воинами
  rationale: Краткий современный эквивалент выражения «мужи войны»; военный и мужской контекст здесь сохраняется самим значением существительного и историческим контекстом.
- source_word: וַעֲבָדָיו
  choice: его слугами
  rationale: В перечне царских должностей עבד обозначает состоящих на службе у царя, а не обязательно рабов; «слуги» сохраняет широкое значение слова.
- source_word: וְשָׂרָיו
  choice: военачальниками
  rationale: В данном военно-административном перечне שׂר естественно означает начальников или командиров.
- source_word: וְשָׁלִשָׁיו
  choice: офицерами[a]
  rationale: Точная историческая функция שָׁלִישׁ неясна; нейтральное «офицеры» передаёт высокий военный чин, а примечание сохраняет возможные более узкие толкования.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: начальниками его колесниц
  rationale: Передаёт начальников колесничного подразделения без излишней модернизации терминологии.
- source_word: וּפָרָשָׁיו
  choice: всадниками
  rationale: Прямой и естественный русский эквивалент для конных воинов.
theological_decisions:
- issue: Общественное положение, выраженное словом עָבֶד
  choice: никого не сделал рабом
  alternative: не назначал на подневольные работы; не сделал слугой
  rationale: Предыдущий стих описывает постоянную трудовую повинность покорённых народов. Перевод «рабом» не скрывает несвободный статус, но не добавляет отсутствующих в тексте подробностей о конкретной форме труда.
- issue: Различное значение עבד в одном стихе
  choice: рабом — его слугами
  alternative: слугой — его слугами; рабом — его рабами
  rationale: Первое употребление описывает навязанный израильтянам статус, которого Соломон им не дал, тогда как форма с притяжательным суффиксом входит в перечень людей на царской службе. Русские контекстуальные эквиваленты сохраняют это смысловое напряжение, не утверждая, что все царские служащие были рабами.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Перечень чинов сохранён без архаизмов вроде «князья» и без чрезмерно технической реконструкции древних военных должностей.
