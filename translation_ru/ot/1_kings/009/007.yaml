  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: ru
  text: то Я отсеку Израиль от земли, которую дал им, а дом[a], который Я освятил для Моего имени[b], удалю от лица Моего[c]. И станет Израиль поговоркой и посмешищем[d] среди всех народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». В еврейском тексте: «дом».'
    reason: lexical_alternative
  - marker: b
    text: «Для Моего имени» — еврейское выражение о том, что храм посвящён Богу, носит Его имя и служит Его чести.
    reason: cultural_note
  - marker: c
    text: 'Или: «удалю из Моего присутствия».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «притчей и насмешкой»; возможный смысл: «поговоркой и предметом насмешек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: то Я отсеку
  rationale: Порода hифиль глагола כרת передаёт устранение, отсечение. «Отсеку» сохраняет образ и силу суда, не утверждая полного истребления народа.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: от земли
  rationale: Буквально выражение содержит образ «с лица земли», однако в современном русском эта формула может подразумевать полное уничтожение. Контекст говорит о земле, данной Израилю, поэтому «от земли» ясно передаёт изгнание с неё и не усиливает смысл.
- source_word: הָאֲדָמָה אֲשֶׁר נָתַתִּי לָהֶם
  choice: земли, которую дал им
  rationale: Здесь אֲדָמָה обозначает дарованную Израилю землю, а не почву как вещество.
- source_word: הַבַּיִת
  choice: дом
  rationale: Сохранено исходное «дом», хотя по контексту речь идёт о храме; это поддерживает сквозной образ дома Божьего в книге Царей.
- source_word: הִקְדַּשְׁתִּי
  choice: Я освятил
  rationale: Глагол означает отделить как святыню. «Освятил» естественно и точно применительно к храму.
- source_word: לִשְׁמִי
  choice: для Моего имени
  rationale: Сохранена важная для книги Царей формула посвящения дома Божьему имени; её смысл пояснён в сноске.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: отвергну от лица Моего
  rationale: שׁלח буквально означает «отослать, удалить», а в данном контексте выражает отвержение храма. Формулировка сохраняет антропоморфный образ Божьего лица и силу угрозы.
- source_word: וְהָיָה יִשְׂרָאֵל
  choice: И станет Израиль
  rationale: «Станет» естественно выражает возникающее вследствие суда состояние.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: притчей и посмешищем
  rationale: «Притча» сохраняет отдельное значение מָשָׁל, а «посмешище» передаёт насмешку и презрение, выраженные שְׁנִינָה.
- source_word: בְּכָל הָעַמִּים
  choice: среди всех народов
  rationale: «Народы» естественно передаёт множественное עַמִּים и не ограничивает его современными государствами.
theological_decisions:
- issue: Не усилить угрозу суда до утверждения о полном уничтожении Израиля
  choice: отсеку Израиль от земли
  alternative: истреблю Израиль с лица земли
  rationale: Глагол כרת допускает устранение и отсечение, а упоминание дарованной земли указывает прежде всего на лишение земли и изгнание. Выбранный вариант сохраняет суровость суда, не снимая и не усиливая неоднозначность.
- issue: Передача обозначения храма словом הַבַּיִת
  choice: дом
  alternative: храм
  rationale: Исходный текст говорит «дом». Сохранение этого слова передаёт богословски значимый мотив дома, освящённого для имени Бога; референт поясняется в сноске.
- issue: Антропоморфное выражение מֵעַל פָּנָי
  choice: от лица Моего
  alternative: из Моего присутствия
  rationale: Основной текст сохраняет образ исходника, а более истолковывающий смысл «из Моего присутствия» дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены ключевые образы «дом», «имя» и «лицо», а потенциально неясные идиомы пояснены сносками.
