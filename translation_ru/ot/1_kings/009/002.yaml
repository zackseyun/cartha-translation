  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: ru
  text: И Яхве явился Соломону во второй раз[a], как явился ему в Гаваоне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова»; буквально: «во второй раз».'
    reason: Лексическая альтернатива для שֵׁנִית.
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает явление Бога; «явился» естественно и точно передаёт теофанический контекст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Сохраняет явное указание еврейского текста на второе по счёту явление.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Кратко и естественно вводит сравнение с прежним явлением.
- source_word: נִרְאָה
  choice: являлся
  rationale: Повторяет тот же корень и указывает на предшествующее явление; русский вид и контекст естественно выражают временное соотношение без тяжеловесной конструкции.
- source_word: אֵלָיו
  choice: ему
  rationale: Передаёт направительно-реляционное значение אֶל с местоименным суффиксом без уточнения способа явления.
- source_word: בְּגִבְעוֹן
  choice: в Гаваоне
  rationale: Русское управление с названием города естественно требует предлога «в»; используется традиционная русская форма топонима.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому тексту, но звучит естественно; союз וַ передан как «И», поддерживая повествовательную связь.
