lexical_decisions:
- source_word: וְגַם לְאִיזֶבֶל
  choice: И об Иезавели
  rationale: Сохраняет присоединительное значение וְגַם и передаёт לְ при דִּבֶּר как указание на того, о ком произнесено предсказание, не создавая впечатления, будто Яхве непосредственно обращался к Иезавели.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: 'Яхве сказал:'
  rationale: Имя יְהוָה передано как «Яхве», а обычная древнееврейская формула введения прямой речи естественно выражена по-русски глаголом и двоеточием.
- source_word: הַכְּלָבִים יֹאכְלוּ
  choice: Собаки съедят
  rationale: Передаёт простые лексические значения существительного и глагола без усиления до «растерзают» или «пожрут»; будущее время соответствует пророческому предсказанию.
- source_word: בְּחֵל יִזְרְעֶאל
  choice: на земле Изрееля
  rationale: חֵל в этом месте имеет неясное значение. Основной текст передаёт общий пространственный смысл, не настаивая на спорной архитектурной конкретизации; вариант о крепостном вале сохранён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение לְאִיזֶבֶל при דִּבֶּר
  choice: об Иезавели
  alternative: Иезавели / против Иезавели
  rationale: По контексту Илия сообщает Ахаву изречение о судьбе Иезавели; перевод не представляет её непосредственной адресаткой, но и не добавляет отсутствующего в тексте явного «против».
- issue: Толкование בְּחֵל יִזְרְעֶאל
  choice: на земле Изрееля
  alternative: у крепостного вала Изрееля
  rationale: Неясность редкого существительного требует не закреплять в основном тексте спорную реконструкцию; более конкретное пространственно-архитектурное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с простой, торжественно-сдержанной пророческой формулировкой. Прямая речь оформлена естественно для русского синтаксиса; намеренно избегнуты как архаическое «рёк», так и усиленное «псы пожрут».
