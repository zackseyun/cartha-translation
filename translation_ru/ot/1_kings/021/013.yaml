base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: ru
  text: 'Пришли двое негодных людей[a], сели напротив него, и эти негодные люди свидетельствовали против Навота перед народом, говоря: «Навот проклял[b] Бога и царя». Его вывели за город, побили камнями, и он умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Велиала»; далее — «люди Велиала». Это идиома, обозначающая негодных, порочных людей.'
    reason: lexical_alternative
  - marker: b
    text: 'В древнееврейском тексте буквально: «благословил». Здесь это почтительный эвфемизм вместо слова «проклял».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: негодные люди / негодные человека
  rationale: Это древнееврейская идиома о нравственно низких, порочных людях, а не указание на происхождение. Такой перевод естественен по-русски и не привносит позднейшего понимания Велиала как собственного имени.
- source_word: נֶגְדּוֹ
  choice: напротив него
  rationale: Предлог обозначает положение лицом к Навоту и сохраняет картину публичного разбирательства.
- source_word: וַיְעִדֻהוּ
  choice: засвидетельствовали против Навота
  rationale: 'Форма глагола имеет здесь юридический смысл: эти люди выступили со свидетельством против обвиняемого.'
- source_word: נֶגֶד הָעָם
  choice: перед народом
  rationale: Выражение подчёркивает публичный характер обвинения.
- source_word: בֵּרַךְ
  choice: проклял
  rationale: В данном обвинении глагол «благословлять» употреблён как почтительный эвфемизм вместо «проклинать». В основном тексте передан подразумеваемый смысл, а буквальная форма отмечена в сноске.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В израильском контексте речь идёт о Боге Израиля; единственное число передаёт предполагаемого референта.
- source_word: וָמֶלֶךְ
  choice: и царя
  rationale: Союз связывает два объекта предполагаемого проклятия без изменения синтаксической связи.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: его вывели за город
  rationale: Краткий и естественный русский оборот точно передаёт удаление Навота из города для казни.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: побили камнями
  rationale: Устойчивое русское выражение ясно обозначает казнь через побивание камнями и сохраняет упоминание о камнях.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Прямая последовательная формулировка сохраняет заключительный результат повествования.
theological_decisions:
- issue: Передача эвфемистического בֵּרַךְ в обвинении в богохульстве
  choice: В основном тексте передать смысл как «проклял»
  alternative: Перевести буквально «благословил» и пояснить эвфемизм
  rationale: Буквальное «благословил» исказило бы смысл обвинения для современного читателя. Перевод «проклял» раскрывает подразумеваемое значение, тогда как сноска сохраняет прозрачность формы древнееврейского текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным повествовательным тоном. Юридический оттенок глагола וַיְעִדֻהוּ сохранён словом «засвидетельствовали»; избыточно архаические выражения не использованы.
