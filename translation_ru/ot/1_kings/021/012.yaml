  text: Они объявили пост и посадили Навуфея во главе народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед народом»; или: «на самом видном месте среди народа». Буквально по-еврейски: «во главе народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: объявили
  rationale: В сочетании с צֹום глагол обозначает публичное провозглашение поста; «объявили» естественно передаёт официальное действие.
- source_word: צֹום
  choice: пост
  rationale: Существительное обозначает установленный, публично соблюдаемый пост.
- source_word: וְהֹשִׁיבוּ
  choice: и посадили
  rationale: Порода hифиль глагола ישׁב здесь означает «сделать так, чтобы сел», то есть усадить в определённом месте.
- source_word: אֶת נָבוֹת
  choice: Навуфея
  rationale: Имя נָבוֹת передано в принятой русской библейской форме; винительный падеж обусловлен ролью прямого дополнения.
- source_word: בְּרֹאשׁ
  choice: во главе
  rationale: 'Передаёт буквальный образ «у головы / во главе» и сохраняет возможную неоднозначность: почётное место, первое место или положение перед собравшимися.'
- source_word: הָעָם
  choice: народа
  rationale: Обычное значение עַם — «народ»; в данном контексте речь идёт о собравшихся жителях или общественном собрании.
