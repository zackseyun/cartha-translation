base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: ru
  text: Когда Ахав услышал эти слова, он разорвал на себе одежду, надел власяницу прямо на тело, постился, лежал во власянице и ходил тихо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ходил медленно», «ходил понуро»; еврейское выражение описывает тихую, сдержанную или подавленную манеру держаться.'
    reason: Лексическая неоднозначность редкого наречия אַט.
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Естественная русская временная конструкция передаёт смысл повествовательной формулы וַיְהִי и инфинитивного оборота כִשְׁמֹעַ без тяжеловесного «И было».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: Речь идёт о только что произнесённом Илиёй приговоре; «слова» сохраняет речевое значение דָּבָר.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: разорвал на себе одежду
  rationale: Передаёт обычный жест скорби и унижения; оборот «на себе» естественно звучит по-русски и не добавляет нового действия.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: надел на голое тело власяницу
  rationale: «Власяница» — понятное в библейском регистре обозначение грубой покаянно-траурной одежды; «на голое тело» передаёт конкретный образ עַל בְּשָׂרוֹ, то есть непосредственное соприкосновение с телом.
- source_word: וַיָּצֹם
  choice: постился
  rationale: Прямой и естественный эквивалент глагола צום.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: лежал во власянице
  rationale: Сохраняет значение положения тела и не уточняет, что Ахав спал, поскольку глагол этого сам по себе не требует.
- source_word: וַיְהַלֵּךְ אַט
  choice: ходил понуро
  rationale: Передаёт продолжительное, подавленное и смиренное поведение в данном контексте, но редкое אַט допускает также оттенки тихой или медленной походки; поэтому неоднозначность отмечена в сноске.
theological_decisions:
- issue: Характер реакции Ахава
  choice: Сообщить только о внешних действиях скорби и унижения, не оценивая прямо искренность его раскаяния.
  alternative: Назвать его поведение истинным покаянием либо лишь показным обрядом.
  rationale: Еврейский текст описывает поступки Ахава, но в этом стихе не выносит суждения о его внутреннем состоянии; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Власяница» сохраняет культурно значимый образ траура и унижения; синтаксис сделан плавным и доступным. Маркер сноски поставлен непосредственно после неоднозначного выражения.
