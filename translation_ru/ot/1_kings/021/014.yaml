lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Тогда они послали сказать
  rationale: Последовательный вав продвигает повествование; сочетание с לֵאמֹר естественно передаётся по-русски как «послали сказать».
- source_word: אֶל אִיזֶבֶל
  choice: Иезавели
  rationale: Направление передачи вести естественно выражено русским дательным падежом; имя передано в традиционной русской библейской форме.
- source_word: סֻקַּל
  choice: побили камнями
  rationale: Пуаль выражает пассивное действие. Русская неопределённо-личная конструкция естественно сохраняет отсутствие названного исполнителя и не добавляет отсутствующего в глаголе уточнения «до смерти».
- source_word: נָבוֹת
  choice: Навуфея
  rationale: Использована традиционная русская библейская форма имени с требуемым винительным падежом.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Формально последовательная глагольная форма означает «и он умер»; перевод сохраняет последовательность действий и не заменяет её описанием состояния.
