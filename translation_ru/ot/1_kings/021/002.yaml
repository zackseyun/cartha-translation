  text: וַ/יְדַבֵּ֣ר אַחְאָ֣ב אֶל נָב֣וֹת לֵ/אמֹר֩ תְּנָ/ה לִּ֨/י אֶֽת כַּרְמְ/ךָ֜ וִֽ/יהִי לִ֣/י לְ/גַן יָרָ֗ק כִּ֣י ה֤וּא קָרוֹב֙ אֵ֣צֶל בֵּיתִ֔/י וְ/אֶתְּנָ֤ה לְ/ךָ֙ תַּחְתָּ֔י/ו כֶּ֖רֶם ט֣וֹב מִמֶּ֑/נּוּ אִ֚ם ט֣וֹב בְּ/עֵינֶ֔י/ךָ אֶתְּנָה לְ/ךָ֥ כֶ֖סֶף מְחִ֥יר זֶֽה־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: ru
  text: 'Ахав сказал Навоту: «Дай мне свой виноградник, чтобы он стал моим огородом, ведь он рядом с моим домом. Взамен я дам тебе виноградник лучше этого. Или, если тебе это угодно[a], дам тебе за него серебро — его цену».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если это хорошо в твоих глазах» — то есть «если это тебе по душе» или «если ты это одобряешь».'
    reason: Сноска сохраняет образность еврейской идиомы и поясняет, что она выражает личное одобрение адресата.
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל־נָבוֹת לֵאמֹר
  choice: Ахав сказал Навоту
  rationale: Обычная повествовательная формула передачи прямой речи; краткий русский оборот естественно передаёт обращение, не добавляя оттенков манеры речи.
- source_word: תְּנָה־לִּי אֶת־כַּרְמְךָ
  choice: Дай мне свой виноградник
  rationale: Сохраняется прямота повелительной формы נתן и обычное значение כֶּרֶם — «виноградник».
- source_word: וִיהִי־לִי לְגַן־יָרָק
  choice: чтобы он стал у меня огородом
  rationale: Конструкция передаёт цель намерения Ахава; «огород» естественно обозначает участок для выращивания овощей и зелени.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: ведь он рядом с моим домом
  rationale: «Ведь» естественно вводит названную Ахавом причину, а «рядом с моим домом» точно передаёт пространственную близость.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: Взамен я дам тебе
  rationale: «Взамен» ясно передаёт значение замены или обмена, выраженное תַּחְתָּיו.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: виноградник лучше этого
  rationale: Сохраняется простое сравнительное значение טוֹב מִמֶּנּוּ без уточнения, в чём именно новый виноградник будет лучше.
- source_word: אִם־טוֹב בְּעֵינֶיךָ
  choice: если тебе угодно
  rationale: Естественный современный русский эквивалент еврейской идиомы «если хорошо в твоих глазах», выражающей одобрение или предпочтение адресата.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: дам тебе серебром его стоимость
  rationale: Передаётся и денежная форма расчёта («серебром»), и мысль о выплате цены виноградника; формулировка не уточняет способ определения стоимости.
