- from: 'Ахав сказал Навоту: «Дай мне свой виноградник, чтобы он стал у меня огородом, ведь он рядом с моим домом. Взамен я дам тебе виноградник лучше этого, а если тебе угодно[a], дам тебе серебром его стоимость».'
  to: 'Ахав сказал Навоту: «Дай мне свой виноградник, чтобы он стал моим огородом, ведь он рядом с моим домом. Взамен я дам тебе виноградник лучше этого. Или, если тебе это угодно[a], дам тебе за него серебро — его цену».'
