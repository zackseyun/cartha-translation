base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: ru
  text: Когда Ахав услышал, что Навуф мёртв[a], он встал и спустился к винограднику Навуфа-изреелитянина, чтобы вступить во владение им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Навуф умер». Древнееврейская форма может указывать как на наступившее состояние («мёртв»), так и на завершившееся событие («умер»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы завладеть им»; возможен также перевод «чтобы унаследовать его». Древнееврейский глагол в зависимости от контекста может означать вступление во владение, обладание или наследование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Сочетание повествовательного перехода וַיְהִי с временной конструкцией כִּשְׁמֹעַ естественно передаётся придаточным времени без архаического «и было».
- source_word: מֵת
  choice: мёртв
  rationale: Форма глагола מות здесь может обозначать ставшее известным состояние Навуфа; «мёртв» сохраняет результирующий оттенок, не исключая понимания «умер».
- source_word: וַיָּקָם
  choice: встал
  rationale: Буквально передаёт קום и сохраняет последовательность решительных действий в повествовании.
- source_word: לָרֶדֶת
  choice: спустился
  rationale: Сохраняет направительное значение ירד — движение вниз — и естественно звучит по-русски.
- source_word: הַיִּזְרְעֵאלִי
  choice: изреелитянина
  rationale: Передаёт этникон или обозначение жителя Изрееля компактным нормативным русским словом.
- source_word: לְרִשְׁתּוֹ
  choice: чтобы вступить во владение им
  rationale: ירשׁ в данном контексте означает фактическое принятие владения; формулировка не добавляет к самому глаголу значения насильственного захвата, хотя несправедливость ясна из контекста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегнуты как архаическое «и было», так и разговорное «поднялся». Повтор имени Ахав во второй части, присутствующий в древнееврейском тексте, заменён местоимением ради естественности русского синтаксиса; референция однозначна.
