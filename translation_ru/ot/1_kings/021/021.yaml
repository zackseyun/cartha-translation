  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: ru
  text: Вот, Я наведу на тебя бедствие, истреблю твоё потомство и истреблю в доме Ахава всякого мужчину[a] — и несвободного, и свободного — в Израиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякого мочащегося к стене» — грубоватое древнееврейское выражение, означающее всякого мужчину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет торжественную пророческую формулу и непосредственность объявления суда, не прибегая к архаичному «се».
- source_word: מֵבִיא ... רָעָה
  choice: наведу ... бедствие
  rationale: В контексте Божьего суда רָעָה обозначает пагубу или бедствие, а не нравственное зло; «наведу бедствие» естественно для современного русского языка.
- source_word: אֵלֶיךָ
  choice: на тебя
  rationale: Передаёт направленность объявленного бедствия против адресата и соответствует естественному русскому сочетанию «навести на».
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: смету всё, что останется после тебя
  rationale: Глагол выражает полное удаление, а אַחֲרֶיךָ буквально указывает на то, что находится или остаётся после адресата. Формулировка сохраняет образ и не сужает подразумеваемое исключительно до потомков.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: истреблю у Ахава
  rationale: В формуле суда כרת означает уничтожение; конструкция с לְ указывает на принадлежащих дому или роду Ахава.
- source_word: מַשְׁתִּין בְּקִיר
  choice: всякого мужчину
  rationale: Грубоватое древнееврейское выражение является идиомой, обозначающей лиц мужского пола; буквальный образ вынесен в сноску.
- source_word: וְעָצוּר וְעָזוּב
  choice: и несвободного, и свободного
  rationale: Парное выражение охватывает мужчин всякого положения. Такой перевод передаёт противопоставление и всеохватность, не оставляя в основном тексте неясную буквальную кальку.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Естественная передача указания на место и народ, среди которого будет совершён суд.
theological_decisions:
- issue: Значение רָעָה в объявлении Божьего суда
  choice: бедствие
  alternative: зло
  rationale: Контекст говорит о губительном наказании, а не приписывает Богу нравственное зло; «бедствие» сохраняет суровость суда без постороннего богословского вывода.
- issue: Подразумеваемый объект в וּבִעַרְתִּי אַחֲרֶיךָ
  choice: всё, что останется после тебя
  alternative: твоё потомство
  rationale: Контекст допускает отнесение к потомкам и дому Ахава, однако в самой фразе потомство прямо не названо. Более широкая формулировка сохраняет эту смысловую напряжённость.
- issue: Всеохватность выражения וְעָצוּר וְעָזוּב
  choice: и несвободного, и свободного
  alternative: и заключённого, и оставленного
  rationale: Парная формула, по-видимому, означает уничтожение всех без исключения. Выбранный вариант передаёт традиционно распознаваемое социальное противопоставление, тогда как буквальная калька остаётся для современного читателя неясной.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным регистром пророческого приговора. Сохранены резкость и всеохватность угрозы; неясные древнееврейские идиомы переданы понятно, а буквальная форма наиболее грубой из них отмечена в сноске.
