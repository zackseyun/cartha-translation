    issue: «смету всё, что останется после тебя»
    rationale: Добавляет отсутствующее в еврейском тексте значение «останется» и неудачно передаёт идиоматическое אַחֲרֶיךָ. В контексте речь о продолжении рода/дома Ахава.
  - severity: low
    issue: «истреблю у Ахава»
    rationale: Конструкция понятна, но для современного литературного русского менее естественна, чем «истреблю в доме Ахава»; последнее передаёт смысл формулы о принадлежащих дому Ахава.
