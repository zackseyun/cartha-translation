review_pass:
  verdict: revise
  source_fidelity: В целом переданы объявление бедствия, его направленность на Ахава, формула полного уничтожения и грубая идиома «мочащийся к стене». Однако «смету всё, что останется после тебя» неоправданно вводит идею остатка и звучит так, будто речь идёт о последствии после смерти адресата. В данном контексте בִּעַרְתִּי אַחֲרֶיךָ — формула устранения того, что следует за адресатом, то есть его потомства/династии.
  naturalness: «Смету всё, что останется после тебя» неестественно в современном русском и семантически смещает текст. «Истреблю у Ахава» также несколько шероховато; «истреблю в доме Ахава» ясно выражает принадлежность к его дому без изменения смысла. Остальной торжественный регистр удачен.
  terminology: «Бедствие» точно передаёт רָעָה в контексте суда. «Всякого мужчину» с примечанием к грубой идиоме уместно. Пара «несвободного и свободного» понятна, хотя «раба и свободного» было бы более традиционно; безопаснее сохранить нейтральную современную формулировку проекта.
