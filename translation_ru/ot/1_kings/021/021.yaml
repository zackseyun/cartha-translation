- from: Вот, Я наведу на тебя бедствие, смету всё, что останется после тебя, и истреблю у Ахава всякого мужчину[a] — и несвободного, и свободного — в Израиле.
  to: Вот, Я наведу на тебя бедствие, истреблю твоё потомство и истреблю в доме Ахава всякого мужчину[a] — и несвободного, и свободного — в Израиле.
