  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כֶּ֧רֶם הָיָ֛ה לְ/נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י אֲשֶׁ֣ר בְּ/יִזְרְעֶ֑אל אֵ֚צֶל הֵיכַ֣ל אַחְאָ֔ב מֶ֖לֶךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: ru
  text: После этих событий у Навота-изреелитянина был виноградник в Изрееле, рядом с дворцом Ахава, царя Самарии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Формула вводит новый эпизод и указывает на его временную связь с предшествующим повествованием. Русское выражение передаёт эту функцию естественно, без архаичного «и было».
- source_word: כֶּרֶם
  choice: виноградник
  rationale: Обычное и прямое значение слова; контекст не требует уточняющего добавления.
- source_word: הָיָה לְנָבוֹת
  choice: у Навота … был
  rationale: Еврейская конструкция существования с предлогом לְ выражает принадлежность. Русская конструкция «у … был» одновременно естественна и близка к форме оригинала.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Навота-изреелитянина
  rationale: Имя передано в традиционной русской форме, а этникон прямо указывает на связь Навота с Изреелем. Дефисное приложение читается ясно и компактно.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: в Изрееле
  rationale: Относительное предложение указывает местонахождение виноградника; в русском его естественно передать обстоятельственным оборотом без отдельного «который находился».
- source_word: אֵצֶל
  choice: рядом с
  rationale: Передаёт непосредственную близость естественным современным русским выражением.
- source_word: הֵיכַל
  choice: дворцом
  rationale: В контексте царской резиденции слово обозначает дворец, а не храм.
- source_word: אַחְאָב מֶלֶךְ שֹׁמְרוֹן
  choice: Ахава, царя Самарии
  rationale: Сохранены традиционная русская форма имени и приложение, обозначающее царский статус и владение Ахава.
