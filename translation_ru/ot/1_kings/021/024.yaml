  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: ru
  text: Кто из дома Ахава умрёт в городе, того съедят псы, а кто умрёт в поле, того склюют птицы небесные.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: кто из дома Ахава умрёт
  rationale: Субстантивированное причастие с לְ выражает любого человека, принадлежащего к дому или роду Ахава; перевод передаёт обобщённый смысл естественно для русского языка.
- source_word: בָּעִיר
  choice: в городе
  rationale: Прямое обозначение места, сохраняющее противопоставление городу и полю.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: того съедят псы
  rationale: Сохраняется буквальное значение אכל и мрачный образ; «псы» уместно в достоинственном библейском регистре.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Буквальный и естественный перевод, сохраняющий пространственный контраст.
- source_word: יֹאכְלוּ עוֹף הַשָּׁמָיִם
  choice: того склюют небесные птицы
  rationale: Для птиц русское «склюют» естественнее общего «съедят», при этом точно передаёт поедание тела; «небесные птицы» сохраняет еврейский образ עוֹף הַשָּׁמָיִם.
theological_decisions:
- issue: Круг лиц, обозначенный לְאַחְאָב
  choice: из дома Ахава
  alternative: принадлежащий Ахаву
  rationale: Контекст пророчества говорит о доме и династии Ахава; формулировка не ограничивает смысл слугами или собственностью царя.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм двух частей сохранён; местоименное «того» делает синтаксис ясным и естественным.
