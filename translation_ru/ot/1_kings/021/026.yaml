base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: ru
  text: Он поступал крайне мерзко, следуя за идолами[a] и поступая во всём так, как поступали амореи, которых Яхве изгнал перед сынами Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово גִּלֻּלִים — резко презрительное обозначение идолов; возможный перевод: «мерзкие идолы», а более буквально — «навозные идолы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед израильтянами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: поступал крайне мерзко
  rationale: Передаёт деятельное значение глагола и усилитель מְאֹד, сохраняя резкую нравственную оценку; по-русски звучит естественнее, чем буквальное «стал крайне мерзок».
- source_word: לָלֶכֶת אַחֲרֵי
  choice: следуя за
  rationale: Сохраняет еврейский образ следования, выражающий приверженность и религиозную верность.
- source_word: הַגִּלֻּלִים
  choice: идолами
  rationale: Ясный современный эквивалент; заложенный в еврейском слове резко презрительный оттенок пояснён в сноске.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: во всём так же, как
  rationale: 'Естественно передаёт полноту сравнения: поведение Ахава соответствовало всему тому, что делали амореи.'
- source_word: הָאֱמֹרִי
  choice: амореи
  rationale: Форма единственного числа употреблена собирательно; русский язык здесь требует множественного числа.
- source_word: הוֹרִישׁ
  choice: изгнал
  rationale: В данном контексте Hiphil глагола ירשׁ означает лишение прежних жителей владения и удаление их из земли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед сынами Израиля
  rationale: Сохраняет пространственный образ исходного выражения и грамматически мужскую формулировку בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Основной текст сохраняет грамматический образ оригинала, а более идиоматичный собирательный смысл отмечен в сноске.
- issue: Характер нравственной оценки וַיַּתְעֵב
  choice: поступал крайне мерзко
  alternative: стал крайне мерзок; совершал мерзости
  rationale: Выбрано деятельное прочтение без сведения выражения к изменению состояния и без превращения глагола во множественное существительное «мерзости».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным для обычного читателя, при этом сохранены образ «следования за» идолами, резкая нравственная оценка, имя Яхве и формула «сыны Израиля».
