lexical_decisions:
- source_word: ק֣וּם
  choice: Встань
  rationale: Повелительная форма קום передана прямым и естественным русским повелением, сохраняющим энергичный пророческий тон.
- source_word: רֵד
  choice: спустись
  rationale: Повелительная форма ירד обозначает движение вниз; «спустись» точно и естественно передаёт направление.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Передаёт движение для встречи, не усиливая смысл до «выступи против» или «обличи».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царю Израиля
  rationale: Прямая передача царского титула; падеж определяется русской конструкцией «навстречу Ахаву».
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: который в Самарии
  rationale: Сохраняет краткую безглагольную характеристику местонахождения Ахава и не добавляет отсутствующего в тексте значения «живёт».
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и достойный эквивалент указательной частицы, привлекающей внимание к нынешнему местонахождению Ахава.
- source_word: בְּכֶרֶם נָבוֹת
  choice: в винограднике Навота
  rationale: Предлог ב обозначает местонахождение внутри виноградника; родительная конструкция естественна по-русски.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: куда спустился
  rationale: Относительное наречие «куда» естественно объединяет в русском языке указание на место и направленное движение, не воспроизводя избыточное для русского «туда».
- source_word: לְרִשְׁתּוֹ
  choice: чтобы вступить во владение им
  rationale: ירשׁ в данном контексте означает принятие или получение владения виноградником. Формулировка передаёт конкретный имущественный смысл, не добавляя к самому глаголу оттенка насильственного захвата.
