  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: ru
  text: «Встань, спустись навстречу Ахаву, царю Израиля, который в Самарии. Вот, он в винограднике Навота, куда спустился, чтобы вступить во владение им[a]».
