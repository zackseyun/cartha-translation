    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: она написала
  rationale: Форма wayyiqtol, 3-е лицо женского рода единственного числа, продолжает повествование; подлежащее из контекста — Иезавель.
- source_word: בַּסְּפָרִים
  choice: в письмах
  rationale: В данном контексте סְפָרִים означает письма, направленные городским старейшинам и знатным, а не книги.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский показатель цитаты естественно передаётся в современном русском оформлением прямой речи, без буквального «говоря».
- source_word: קִרְאוּ צוֹם
  choice: Объявите пост
  rationale: Императив множественного числа указывает на официальное провозглашение общего поста; это устойчивое и ясное русское выражение.
- source_word: וְהוֹשִׁיבוּ
  choice: и посадите
  rationale: Побудительная порода глагола ישב означает «велеть/дать сесть, посадить»; русский переходный глагол сохраняет причинительное значение.
- source_word: אֶת נָבוֹת
  choice: Навота
  rationale: Имя נָבוֹת передано в принятой русской библейской форме и поставлено в винительный падеж как прямое дополнение.
- source_word: בְּרֹאשׁ הָעָם
  choice: во главе народа
  rationale: Буквальный образ «у/во главе народа» сохранён, поскольку выражение может указывать как на переднее, так и на заметное или почётное место в собрании.
