source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: ru
  text: «Видел ли ты, как Ахав смирился предо Мной? Поскольку он смирился предо Мной, Я не наведу бедствие[a] в его дни; в дни его сына Я наведу бедствие на его дом[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастье», «беду». В данном контексте речь идёт о карающем бедствии, а не о нравственном зле.'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь может означать семью, потомков или царскую династию Ахава.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Видел ли ты
  rationale: Вопросительная форма и перфект глагола ראה переданы естественным русским вопросом, указывающим на уже замеченное действие Ахава.
- source_word: נִכְנַע
  choice: смирился
  rationale: Нифаль глагола כנע здесь обозначает смирение и подчинение перед Богом; перевод не добавляет отсутствующего в тексте прямого утверждения о покаянии.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: предо Мной
  rationale: Русское библейски возвышенное, но понятное выражение естественно передаёт положение человека перед Божьим лицом и сохраняет повтор оригинала.
- source_word: יַעַן כִּי
  choice: За то, что
  rationale: Оборот ясно выражает причинную связь между смирением Ахава и отсрочкой суда.
- source_word: לֹא אָבִיא
  choice: Я не наведу
  rationale: Каузативная форма בוא с обозначением бедствия естественно передаётся по-русски устойчивым сочетанием «навести бедствие».
- source_word: הָרָעָה
  choice: бедствие
  rationale: В контексте Божьего суда רעה означает губительное несчастье или кару, а не нравственное зло.
- source_word: בְּיָמָיו
  choice: при его жизни
  rationale: Передаёт смысл древнееврейского временного оборота яснее для современного русского читателя.
- source_word: בִּימֵי בְנוֹ
  choice: во дни его сына
  rationale: Сохраняет образность и временной контраст оригинала, оставаясь понятным в литературном русском.
- source_word: עַל בֵּיתוֹ
  choice: на его дом
  rationale: Сохраняет многозначность слова «дом», которое может обозначать семью, потомков или царскую династию.
theological_decisions:
- issue: Характер ответа Ахава
  choice: «смирился», без прямого обозначения покаяния
  alternative: «покаялся» или «подчинился»
  rationale: Текст утверждает, что Ахав смирился перед Богом, но не употребляет явной лексики покаяния; перевод сохраняет эту богословскую напряжённость.
- issue: Значение רָעָה как действия Божьего суда
  choice: «бедствие»
  alternative: «зло» или «несчастье»
  rationale: Речь идёт о карающем бедствии, а не о нравственном зле; выбранное слово точно передаёт судебный контекст.
- issue: Объём значения «дом Ахава»
  choice: Сохранить «дом» в основном тексте
  alternative: «династия» или «семья»
  rationale: Исходное выражение допускает как семейно-домашнее, так и династическое понимание, поэтому неоднозначность сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенными формами «предо Мной» и «во дни». Повтор «смирился предо Мной» сохранён как значимый элемент исходного текста; синтаксис сделан ясным для обычного читателя.
