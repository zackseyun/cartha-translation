  naturalness: 'Текст литературен и понятен. Однако «За то, что» в современном русском нередко имеет оттенок воздаяния или наказания («в наказание за то, что»), тогда как יַעַן כִּי здесь вводит причину отсрочки суда. «Поскольку» передаёт связь точнее и нейтральнее. Параллельные временные выражения лучше передать единообразно: «в его дни» / «в дни его сына».'
