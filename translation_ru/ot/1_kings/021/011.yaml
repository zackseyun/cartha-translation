base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: ru
  text: И жители его города — старейшины и знатные люди[a], жившие в его городе, — поступили так, как передала им Иезавель, как было написано в письмах, которые она им послала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сановники»; еврейское слово может обозначать знатных людей либо лиц высокого общественного или должностного положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: поступили
  rationale: Глагол עשה в данном контексте означает исполнение распоряжений; «поступили» естественно вводит последующее «так, как».
- source_word: אַנְשֵׁי עִירוֹ
  choice: жители его города
  rationale: Хотя буквально выражение означает «мужи его города», последующее приложение уточняет, что речь идёт о городских руководителях; «жители» звучит естественно по-русски и не превращает выражение в отдельное обозначение всех горожан.
- source_word: הַזְּקֵנִים
  choice: старейшины
  rationale: В общественно-правовом контексте это признанные руководители общины, а не просто пожилые мужчины.
- source_word: הַחֹרִים
  choice: знатные люди
  rationale: חֹרִים обозначает людей высокого общественного положения или ранга; этот вариант понятен современному читателю и сохраняет социальный смысл.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: жившие в его городе
  rationale: ישב здесь обозначает постоянное проживание; выбран естественный русский эквивалент.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: так, как велела им Иезавель
  rationale: В еврейском тексте объект глагола «послала» не выражен, но контекст писем ясно указывает на переданные распоряжения. Русское «велела» естественно передаёт исполнение инструкций, не добавляя их содержания.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: как было написано в письмах
  rationale: סְפָרִים здесь означает письменные послания Иезавели, поэтому «письмах» точнее общих «документах» или «свитках».
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: которые она им послала
  rationale: Относительное предложение непосредственно определяет письма и сохраняет повтор глагола отправления из исходного текста.
