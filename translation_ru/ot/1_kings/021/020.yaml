base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: ru
  text: 'И сказал Ахав Илии: «Ты нашёл меня, враг мой?» Тот ответил: «Нашёл, потому что ты продал себя, чтобы делать зло в глазах Яхве[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH» (тетраграмматон). В этом переводе передано как «Яхве»; традиционно переводится «Господь». Другой вариант передачи — «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: Ты нашёл меня
  rationale: Прямой вопрос с глаголом מצא; «нашёл» естественно передаёт смысл и сохраняет резкий, обличительный контекст.
- source_word: אֹיְבִי
  choice: враг мой
  rationale: Существительное с суффиксом первого лица передано буквально; постпозиция местоимения сохраняет достоинство и напряжённость обращения без архаического «о».
- source_word: מָצָאתִי
  choice: Нашёл
  rationale: Повтор того же глагола מצא сохраняет словесное эхо между вопросом Ахава и ответом Илии; объект в русском естественно опустить как очевидный из контекста.
- source_word: יַעַן
  choice: потому что
  rationale: Ясно передаёт причинное значение союза в современном русском языке.
- source_word: הִתְמַכֶּרְךָ
  choice: ты продал себя
  rationale: Возвратная форма от מכר буквально выражает добровольную продажу себя и сохраняет сильную метафору порабощения злу.
- source_word: לַעֲשׂוֹת הָרַע
  choice: чтобы делать зло
  rationale: Естественная русская передача инфинитивной конструкции; не добавляет смыслов сверх нравственной оценки исходного текста.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет понятный по-русски древнееврейский образ божественной оценки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом; примечание сообщает традиционный вариант.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. «Яхве» является распространённой научной реконструкцией произношения; традиционный русский эквивалент указан в примечании.
- issue: Сила метафоры הִתְמַכֶּרְךָ
  choice: ты продал себя
  alternative: ты предался
  rationale: Буквальная метафора сохраняет ответственность Ахава и образ самоотдачи во власть зла, не превращая выражение в специальное учение о рабстве или свободе воли.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены повтор «нашёл — нашёл», метафора «продал себя» и образ «в глазах»; синтаксис диалога сделан естественным для русского читателя.
