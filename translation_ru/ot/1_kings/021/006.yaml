- from: 'Он ответил ей: «Дело в том, что я говорил с Навотом-изреелитянином и сказал ему: „Отдай мне свой виноградник за деньги, или, если хочешь, я дам тебе вместо него другой виноградник“. Но он сказал: „Не отдам тебе моего виноградника“».'
  to: 'Он сказал ей: «Дело в том, что я сказал Навоту-изреелитянину: „Отдай мне свой виноградник за серебро или, если хочешь, я дам тебе вместо него другой виноградник“. Но он сказал: „Не отдам тебе моего виноградника“».'
