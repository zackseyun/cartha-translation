  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: ru
  text: 'Он сказал ей: «Дело в том, что я сказал Навоту-изреелитянину: „Отдай мне свой виноградник за серебро или, если хочешь, я дам тебе вместо него другой виноградник“. Но он сказал: „Не отдам тебе моего виноградника“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: «Дело в том, что»
  rationale: Вводит объяснение Ахава; по-русски эта конструкция естественно передаёт причинно-пояснительную связь, не превращая её в отдельное авторское утверждение.
- source_word: בְּכֶסֶף
  choice: «за деньги»
  rationale: כֶּסֶף буквально означает «серебро», но в контексте покупки обозначает средство оплаты; «за деньги» ясно и естественно для современного читателя.
- source_word: אִם חָפֵץ אַתָּה
  choice: «если хочешь»
  rationale: Передаёт условие и желание адресата без излишне архаичного «если тебе угодно».
- source_word: כֶרֶם תַּחְתָּיו
  choice: «вместо него другой виноградник»
  rationale: Явно передаёт предложенный обмен; слово «другой» естественно подразумевается русской конструкцией и не меняет смысла.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением прямой речи и повторения «мой/моего виноградника», значимого для притязания Ахава и отказа Навота. Имя и этноним переданы как «Навот-изреелитянин».
