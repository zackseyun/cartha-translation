  text: 'И слово Яхве пришло к Илии Фесвитянину:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит следующее событие повествования; традиционная, но понятная формула «И было» естественно сочетается в русском с выражением «слово… к…».
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена устойчивая пророческая формула; «слово» точнее передаёт её форму и богословскую насыщенность, чем более истолковывающее «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: אֶל
  choice: к
  rationale: В русской библейской формуле откровения направление речи к адресату естественно выражается предлогом «к».
- source_word: אֵלִיָּהוּ
  choice: Илии
  rationale: Использована укоренившаяся русская библейская форма имени Илия в дательном падеже.
- source_word: הַתִּשְׁבִּי
  choice: Фесвитянину
  rationale: Употреблено традиционное русское обозначение происхождения Илии; оно сохраняет краткость еврейского определения.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание речи в следующем стихе; в современном русском эту функцию естественно и точно выполняет двоеточие без тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой пророческой формулы. Синтаксис слегка библейский, но не архаичный; לֵאמֹר передано функционально двоеточием.
