  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: ru
  text: 'И слово Яхве было обращено к Илии-фесвитянину:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В сочетании со «словом Яхве» это естественная для русского библейского повествования формула, сохраняющая структуру еврейского выражения и не добавляющая отдельного глагола речи.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» точно передаёт דָּבָר и сохраняет устойчивую пророческую формулу и её межтекстовые связи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией отражает непосредственно стоящий в еврейском тексте тетраграмматон, а не заменяет его титулом.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленность откровения к его получателю; по-русски в этой формуле естественно «к Илии».
- source_word: אֵלִיָּהוּ
  choice: Илии
  rationale: Использована традиционная русская форма имени Илия в требуемом дательном падеже.
- source_word: הַתִּשְׁבִּי
  choice: фесвитянину
  rationale: Традиционная русская передача обозначения происхождения или прозвания пророка; она кратко сохраняет форму определения в исходном тексте.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит прямую речь следующего стиха. В современном русском двоеточие естественно выполняет эту функцию и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; «Яхве» сохраняет его как имя, тогда как «Господь» представляет традиционную замену титулом.
- issue: Функция לֵאמֹר на границе стихов
  choice: двоеточие, вводящее последующую прямую речь
  alternative: «говоря»
  rationale: Оба варианта указывают на дальнейшие слова Бога; двоеточие яснее и естественнее в современном русском, не изменяя содержания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Сохранена пророческая формула, но לֵאמֹר передано современной русской пунктуацией. Маркер сноски поставлен непосредственно после неоднозначного обозначения происхождения.
