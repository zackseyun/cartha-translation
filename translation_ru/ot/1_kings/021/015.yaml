- source_word: וַיָּמֹת
  choice: и он умер
  rationale: 'Сохраняется последовательность сообщённых событий: Навуфа побили камнями, после чего он умер.'
- source_word: קוּם
  choice: Встань
  rationale: Прямой современный эквивалент повелительной формы קום, сохраняющий резкость приказа.
- source_word: רֵשׁ
  choice: вступи во владение
  rationale: Глагол ירש здесь означает завладеть ставшей доступной собственностью; перевод не сужает значение до юридического наследования и не усиливает его до открытого захвата.
- source_word: כֶּרֶם
  choice: виноградник
  rationale: Обычное и точное обозначение כרם в данном контексте.
- source_word: הַיִּזְרְעֵאלִי
  choice: изреелитянина
  rationale: Передаёт прилагательное принадлежности, связывающее Навуфа с Изреелем.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: отказался отдать тебе за серебро
  rationale: Сохраняет буквальную лексику «дать за серебро», не подменяя её более истолковывающим «продать за деньги»; естественная альтернатива приведена в сноске.
- source_word: אֵין נָבוֹת חַי
  choice: Навуфа уже нет в живых
  rationale: Естественно передаёт отрицательную экзистенциальную конструкцию и сохраняет её отдельно от последующего прямого утверждения о смерти.
- source_word: כִּי מֵת
  choice: он умер
  rationale: Передаёт заключительное резкое подтверждение смерти Навуфа; двоеточие естественно выражает пояснительную связь.
