  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: ru
  text: 'Когда Иезавель услышала, что Навуф был побит камнями и умер, она сказала Ахаву: «Встань и вступи во владение виноградником Навуфа-изреелитянина, который он отказался отдать тебе за серебро[a], потому что Навуфа нет в живых: он умер».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который он отказался продать тебе за деньги». Буквально по-еврейски: «который он отказался отдать тебе за серебро».'
    reason: lexical_alternative
