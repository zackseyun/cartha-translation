  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: ru
  text: 'Тогда Иезавель, его жена, сказала ему[a]: «Ты теперь правишь Израилем как царь? Встань, поешь и ободрись[b]. Я дам тебе виноградник Навуфея, изреелитянина».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно насмешливо: «Ты теперь осуществляешь царскую власть над Израилем». В еврейском тексте нет явного вопросительного показателя.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «ешь хлеб, и пусть твоему сердцу станет хорошо». «Есть хлеб» — древнееврейское выражение со значением «принимать пищу».'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו אִיזֶבֶל אִשְׁתּוֹ
  choice: Тогда жена Ахава Иезавель сказала ему
  rationale: Последовательная форма глагола продолжает повествование; имя Ахава естественно раскрывает местоименную связь в отдельном русском стихе, а приложение сохраняет роль говорящей как его жены.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: Разве не ты теперь царствуешь над Израилем?
  rationale: Сочетание «делать царство/царскую власть» означает осуществлять царскую власть. Риторический вопрос естественно передаёт упрёк Иезавели, тогда как частица «разве не» сохраняет подразумеваемое утверждение.
- source_word: קוּם
  choice: Встань
  rationale: Прямое и естественное соответствие повелительной форме.
- source_word: אֱכָל לֶחֶם
  choice: поешь
  rationale: Буквально «ешь хлеб»; в данном контексте это древнееврейское выражение означает принять пищу, поэтому русское «поешь» точнее передаёт обычный смысл.
- source_word: וְיִטַב לִבֶּךָ
  choice: и ободрись
  rationale: Буквально говорится о том, чтобы сердцу стало хорошо; «ободрись» естественно передаёт перемену внутреннего настроения без ненужной буквальности.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Я отдам тебе
  rationale: Выраженное местоимение подчёркивает, что Иезавель сама обеспечит результат; «отдам» уместно для обещания передать Ахаву конкретный виноградник.
- source_word: אֶת כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: виноградник Навуфея-изреелитянина
  rationale: Естественно передаёт конструкцию принадлежности и географическое обозначение Навуфея.
theological_decisions:
- issue: Смысл и интонация начальной реплики Иезавели
  choice: 'Риторический вопрос: «Разве не ты теперь царствуешь над Израилем?»'
  alternative: 'Утверждение или насмешливое побуждение: «Вот теперь ты и прояви царскую власть над Израилем!» / «Ты теперь осуществляешь царскую власть над Израилем».'
  rationale: В еврейском тексте нет явного вопросительного показателя, поэтому грамматически возможна утвердительная или насмешливая интонация. Контекст благоприятствует риторическому вопросу-упрёку, но альтернативная интонация отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Реплика звучит резко и властно. Сохранена неоднозначность первой фразы через основной риторический вопрос и сноску; буквальные семитизмы, не вполне естественные по-русски, разъяснены в примечании.
