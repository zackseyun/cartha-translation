  source_fidelity: Начальная реплика в черновике («Разве не ты теперь царствуешь над Израилем?») скорее спрашивает о самом статусе Ахава как царя, тогда как еврейское תעשה מלוכה означает осуществлять царскую власть / править как царь и в контексте является язвительным побуждением действовать по-царски. «Ты теперь правишь Израилем как царь?» точнее передаёт этот смысл, сохраняя вопросительную интерпретацию и отмеченную неоднозначность. «Дам» ближе к אֶתֵּן, чем «отдам».
  naturalness: «Иезавель, его жена» и «виноградник Навуфея, изреелитянина» — естественные современные русские конструкции и яснее передают еврейские приложения, чем «жена Ахава Иезавель» и дефисное «Навуфея-изреелитянина». «Поешь и ободрись» уместно в литературном повествовании.
