source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: ru
  text: И Я сделаю твой дом[a] таким, как дом Иеровоама, сына Навата, и как дом Ваасы, сына Ахии, за то, что ты прогневал Меня и ввёл Израиль в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твою династию». Здесь «дом» означает царский род Ахава.'
    reason: 'Лексическая альтернатива: בַּיִת в данном контексте обозначает не здание, а династию.'
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я сделаю
  rationale: Буквально נתן означает «дать», но в формуле суда с последующим сравнением речь идёт о том, каким станет царский дом; «сделаю … таким» естественно передаёт результат.
- source_word: בֵּיתְךָ
  choice: твой дом
  rationale: בַּיִת здесь обозначает царский род, или династию. «Дом» сохраняет еврейский образ, а значение поясняется в сноске.
- source_word: כְּבֵית ... וּכְבֵית
  choice: как дом … и как дом
  rationale: Предлог כְּ выражает прямое сравнение; повтор сохраняет параллельное построение еврейского текста.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использована традиционная русская форма библейских имён и прямо передана патронимическая конструкция.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Ваасы, сына Ахии
  rationale: Использована традиционная русская форма библейских имён и прямо передана патронимическая конструкция.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: за то, что ты прогневал Меня
  rationale: Оборот называет основание суда и через корень כעס говорит о вызванном Божьем гневе. Русское «прогневал Меня» кратко и естественно передаёт этот смысл.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: и ввёл Израиль в грех
  rationale: 'Порода hифиль глагола חטא имеет каузативный смысл: адресат не просто согрешил сам, а побудил Израиль грешить. «Ввёл … в грех» ясно передаёт эту ответственность без излишне механистичного оттенка.'
theological_decisions:
- issue: Невыраженный объект при אֲשֶׁר הִכְעַסְתָּ
  choice: Явно передать объект как «Меня»
  alternative: 'Оставить объект невыраженным: «ты вызвал гнев»'
  rationale: Из контекста речи Господа ясно, что Ахав прогневал именно Его. В русском языке явный объект делает фразу естественной и не добавляет отсутствующего в контексте богословского утверждения.
- issue: Значение בֵּית в пророчестве о царском суде
  choice: Сохранить в основном тексте образ «дом»
  alternative: Передать толкованием «династия» или «царский род»
  rationale: «Дом» обозначает царскую линию и связывает суд над Ахавом с судьбой прежних царских домов. Сохранение метафоры передаёт литературную форму источника, а сноска устраняет возможную неясность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим тоном. Синтаксический параллелизм двух сравнений сохранён; традиционные русские формы библейских имён обеспечивают узнаваемость.
