base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: ru
  text: 'Но Навуфей сказал Ахаву: «Да сохранит меня Яхве от того, чтобы я отдал тебе наследственный удел моих отцов!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская идиома буквально передаёт мысль: «Далеко от меня — от Яхве — отдать тебе наследственный удел моих отцов». Это формула решительного отказа; возможны также переводы: «Для меня немыслимо перед Яхве отдать тебе…» или «Да не допустит Яхве, чтобы я отдал тебе…».'
    reason: Лексическая альтернатива и сохранение неоднозначности еврейской идиомы.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: Последовательная форма продолжает повествование, а союз «но» естественно передаёт противопоставление предложению Ахава в предыдущем стихе.
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Да не допустит Яхве, чтобы я…
  rationale: Современная русская формула сильного, религиозно мотивированного отказа передаёт смысл идиомы и сохраняет прямое упоминание имени Яхве. Более буквальное построение по-русски было бы неясным, поэтому оно отмечено в сноске.
- source_word: מִתִּתִּי
  choice: чтобы я отдал
  rationale: Инфинитив обозначает действие, которое Навуфей решительно отвергает; личная конструкция естественна после выбранной русской формулы.
- source_word: נַחֲלַת
  choice: наследственный удел
  rationale: Сочетание передаёт и наследственный характер земли, и её статус как закреплённого за родом владения.
- source_word: אֲבֹתַי
  choice: моих отцов
  rationale: Сохраняется явно мужская форма множественного числа и указание на родовую преемственность.
- source_word: לָךְ
  choice: тебе
  rationale: Дательный падеж естественно передаёт адресата передачи имущества.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное имя Бога, не заменяя его титулом.
- issue: Передача выражения חָלִילָה לִּי מֵיְהוָה
  choice: Да не допустит Яхве, чтобы я…
  alternative: Да будет далеко от меня от Яхве…; Для меня немыслимо перед Яхве…
  rationale: Выбрана понятная русская формула решительного отказа, связанного с Яхве. Поскольку еврейская конструкция допускает оттенки запрета, отвращения и клятвенного отречения, её более буквальная форма приведена в сноске, а неоднозначность не превращена в подробное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достойной повествовательной интонацией. «Наследственный удел» понятно обозначает родовую землю и точнее простого «наследства». Восклицательный знак передаёт силу отказа без разговорной резкости.
