  to: Поистине, не было никого подобного Ахаву, который продал себя[a], чтобы делать зло в глазах Яхве[b], и которого подстрекала Иезавель, его жена.
  rationale: Исправлены усилительная частица в начале стиха и синтаксическая связь заключительного придаточного с Ахавом. Перевод сохраняет образ «продал себя», личное имя Яхве и напряжение между личной ответственностью Ахава и подстрекательством Иезавели, не превращая последнее в однозначное причинное объяснение.
