base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: ru
  text: Поистине, не было никого подобного Ахаву, который продал себя[a], чтобы делать зло в глазах Яхве[b], и которого подстрекала Иезавель, его жена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «продал себя»; образ добровольного предания себя совершению зла.'
    reason: Поясняет образное выражение, сохраняя его в основном тексте.
  - marker: b
    text: Яхве — личное имя Бога Израиля, переданное еврейскими буквами יהוה.
    reason: Поясняет передачу тетраграмматона.
lexical_decisions:
- source_word: רַק
  choice: И всё же
  rationale: Частица вводит подчёркнутое, контрастное замечание; «И всё же» естественно передаёт эту функцию в данном контексте.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: не было никого подобного Ахаву
  rationale: Русская идиома ясно передаёт мысль об исключительности Ахава в зле.
- source_word: הִתְמַכֵּר
  choice: продал себя
  rationale: Сохранён яркий метафорический образ порочной самоотдачи, выраженный возвратной формой глагола מכר.
- source_word: לַעֲשׂוֹת הָרַע
  choice: чтобы делать зло
  rationale: Передаёт целевое значение инфинитивной конструкции и звучит естественно по-русски.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён еврейский образ оценки происходящего с точки зрения Яхве; выражение понятно современному читателю.
- source_word: הֵסַתָּה אֹתוֹ
  choice: подстрекала его к этому
  rationale: Глагол в породе hифиль обозначает побуждение к дурному; «к этому» естественно связывает действие Иезавели с ранее названным злом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Соотношение личной ответственности Ахава и влияния Иезавели
  choice: 'Сохранены оба утверждения: Ахав «продал себя», а Иезавель его подстрекала'
  alternative: Передать придаточное исключительно как причину поступков Ахава
  rationale: Еврейское אֲשֶׁר допускает относительную связь и не требует снимать напряжение между добровольной самоотдачей Ахава злу и подстрекательством со стороны жены.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Двоеточие делает длинную еврейскую конструкцию яснее, а оборот «а жена его Иезавель» сохраняет вторичность её подстрекательства по отношению к ответственности Ахава.
