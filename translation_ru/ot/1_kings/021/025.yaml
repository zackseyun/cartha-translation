  - severity: medium
    issue: Передача אֲשֶׁר הֵסַתָּה אֹתוֹ
    rationale: «А жена его Иезавель подстрекала его к этому» допустимо по смыслу, но добавляет указательное «к этому» и ослабляет синтаксическую связь относительного придаточного с Ахавом. «Которого подстрекала Иезавель, его жена» ближе к тексту и сохраняет связь без излишнего причинного истолкования.
  revised_text: Поистине, не было никого подобного Ахаву, который продал себя[a], чтобы делать зло в глазах Яхве[b], и которого подстрекала Иезавель, его жена.
