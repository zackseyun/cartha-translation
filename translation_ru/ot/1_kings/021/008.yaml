base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: ru
  text: И написала она письма от имени Ахава, запечатала их его печатью и послала эти письма старейшинам и знатным людям, которые были в его городе[a] и жили вместе с Навотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые были в городе Ахава». Еврейский суффикс в выражении «его город» может относиться как к Навоту, так и к Ахаву.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: И написала она
  rationale: Последовательная форма продолжает повествование; женский род указывает на Иезавель из контекста. Такой порядок слов естественно сохраняет связь с предыдущим стихом.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: письма / эти письма
  rationale: В данном контексте סֵפֶר обозначает официальное письменное послание; «письма» — наиболее точное и понятное соответствие.
- source_word: בְּשֵׁם אַחְאָב
  choice: от имени Ахава
  rationale: Русское выражение передаёт действие с использованием имени и официального авторитета Ахава, не утверждая, что он лично написал письма.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: запечатала их его печатью
  rationale: Формулировка близко передаёт наложение принадлежавшей Ахаву официальной печати на письма.
- source_word: הַזְּקֵנִים
  choice: старейшинам
  rationale: Здесь слово обозначает местных руководителей; «старейшины» — устоявшееся и понятное русское соответствие.
- source_word: הַחֹרִים
  choice: знатным людям
  rationale: Слово обозначает людей высокого общественного положения. «Знатные люди» звучит современно и яснее, чем архаичное «именитые».
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: которые были в его городе
  rationale: Сохранено местоимение мужского рода и тем самым неоднозначность еврейского суффикса; основной текст понимает его как относящийся к Навоту, а возможная отсылка к Ахаву отмечена в сноске.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: и жили рядом с Навотом
  rationale: ישב с אֶת выражает совместное или соседнее проживание. «Рядом с Навотом» естественно указывает на жителей той же местности и не создаёт впечатления, будто старейшины жили в одном доме с ним.
theological_decisions:
- issue: К кому относится местоименный суффикс в בְּעִירוֹ
  choice: «его город» понимается как город Навота
  alternative: «его город» может означать город Ахава
  rationale: Дальнейшее определение «жившие рядом с Навотом» естественно связывает местных руководителей с городом Навота. Однако грамматически возможна и отсылка к Ахаву, поэтому неоднозначность не устранена молча, а отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейской последовательности действий, но избегает неестественных и двусмысленных для современного читателя оборотов.
