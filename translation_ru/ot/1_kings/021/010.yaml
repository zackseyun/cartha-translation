  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: ru
  text: 'И посадите напротив него двух негодных людей, и пусть они засвидетельствуют против него: «Ты проклял[a] Бога и царя». Потом выведите его и побейте камнями насмерть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «Ты благословил Бога и царя». Здесь «благословил» — почтительный эвфемизм вместо «проклял».'
    reason: Сохранить прозрачность эвфемистического значения בֵּרַכְתָּ и его буквальной формы.
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: И посадите
  rationale: Каузативная форма от ישׁב означает «усадить, посадить»; повелительное «посадите» естественно передаёт указание устроителям собрания.
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: двух негодных людей
  rationale: Идиома характеризует нравственно низких, бесчестных людей; перевод не превращает בְלִיַּעַל в имя собственное и сохраняет указание на двух мужчин-свидетелей.
- source_word: נֶגְדּוֹ
  choice: напротив него
  rationale: Передаёт пространственное расположение лицом к Навуфею в официальной обстановке.
- source_word: וִיעִדֻהוּ
  choice: пусть они засвидетельствуют против него
  rationale: В судебном контексте каузативная форма от עוד обозначает дачу свидетельства против обвиняемого.
- source_word: בֵּרַכְתָּ
  choice: Ты проклял
  rationale: Обычное значение корня — «благословлять», но здесь это почтительный эвфемизм для «проклинать»; контекст ложного обвинения, ведущего к смертной казни, требует передать подразумеваемый смысл в основном тексте.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: Бога и царя
  rationale: Контекст указывает на единственного Бога и земного царя как два объекта предъявляемого обвинения.
- source_word: וְהוֹצִיאֻהוּ
  choice: Потом выведите его
  rationale: Глагол означает вывести наружу, по контексту — к месту казни; «потом» естественно выражает последовательность действий.
- source_word: וְסִקְלֻהוּ וְיָמֹת
  choice: побейте камнями насмерть
  rationale: Компактно и естественно передаёт как способ казни, так и предписанный результат — его смерть.
theological_decisions:
- issue: Эвфемистическое употребление בּרך при упоминании Бога
  choice: В основном тексте перевести «проклял»
  alternative: Буквально перевести «благословил», пояснив эвфемизм
  rationale: Буквальное «благословил» исказило бы смысл сфабрикованного обвинения. Формальная особенность еврейского текста сохраняется в сноске.
- issue: Значение בְּנֵי בְלִיַּעַל
  choice: «негодных людей»
  alternative: «сынов Велиала» или «негодяев»
  rationale: В данном месте выражение является нравственной характеристикой, а не несомненным личным именем; выбранный вариант не привносит позднейших демонологических представлений.
translation_notes:
  register: Современный литературный русский язык с ясной судебной лексикой и сдержанным библейским достоинством. Синтаксис сохраняет последовательность повелений, не становясь буквалистски тяжеловесным.
