base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: ru
  text: 'И скажи ему[a]: «Так говорит Яхве: „Ты совершил убийство и ещё завладел?“» И скажи ему: «Так говорит Яхве: „На том месте, где псы лизали кровь Навота, псы будут лизать и твою кровь — твою собственную[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И говори ему, говоря». Это обычная еврейская формула введения прямой речи.'
    reason: translation_form
  - marker: b
    text: 'Буквально в конце: «также ты». Эти слова подчёркивают, что такое же бесчестие постигнет самого Ахава.'
    reason: emphasis
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: И скажи ему / Затем скажи ему
  rationale: Стандартная формула поручения передана естественно по-русски; повтор сохранён как часть торжественной пророческой речи.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена пророческая формула в настоящем времени и личное имя Бога.
- source_word: הֲרָצַחְתָּ
  choice: Ты убил
  rationale: רצח обозначает предосудительное, незаконное лишение жизни и допускает перевод «убил» или «совершил убийство». Вопросительная форма и контекст ясно сохраняют обвинительный смысл без неестественного русского «ты убил как убийца?».
- source_word: וְגַם יָרָשְׁתָּ
  choice: и ещё завладел
  rationale: ירש здесь означает вступить во владение, завладеть имуществом после смерти Навота. Дополнение не выражено в еврейском тексте, поэтому в переводе также не конкретизировано.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: На том месте, где
  rationale: Естественная русская передача конкретного места, связанного с последующим воздаянием.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: лизали ... будут лизать
  rationale: Повтор одного корня сохранён, как и соответствие между совершившимся и предсказанным действием.
- source_word: הַכְּלָבִים
  choice: псы
  rationale: «Псы» сохраняет буквальный образ и его уничижительно-мрачную окраску, оставаясь понятным современному читателю.
- source_word: דַּם נָבוֹת
  choice: кровь Навота
  rationale: Прямо передаёт еврейскую сопряжённую конструкцию; имя транслитерировано в принятой русской библейской форме.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: и твою кровь — твою собственную
  rationale: Конечное גַּם אָתָּה представляет собой резкое личное усиление. Повтор местоименного определения по-русски подчёркивает, что воздаяние постигнет самого Ахава.
theological_decisions:
- issue: Степень обвинительной силы הֲרָצַחְתָּ
  choice: 'В основном тексте: «Ты убил» с примечанием о возможном «совершил убийство».'
  alternative: «Ты совершил убийство» или «Ты убил как убийца».
  rationale: Глагол несёт нравственно-правовой оттенок незаконного убийства, однако краткое «убил» звучит по-русски естественнее и в данном контексте не ослабляет обвинения. Примечание сохраняет более узкую лексическую возможность.
- issue: Смысл заключительного גַּם אָתָּה
  choice: «твою собственную» как эмфатическое личное уточнение.
  alternative: «и тебя самого»; «также и твою».
  rationale: Формулировка сохраняет направленность суда лично на Ахава и резкость еврейской концовки, не превращая её в отдельное утверждение о том, что псы будут лизать самого человека, а не его кровь.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксический повтор оригинала сохранён, но громоздкая формула לֵאמֹר передана идиоматично. Кавычки разграничивают поручение Илии, формулу посланника и слова Яхве.
