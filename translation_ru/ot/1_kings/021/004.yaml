base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: ru
  text: 'Ахав пришёл в свой дом угрюмый и разгневанный из-за того, что сказал ему Навуфей Изреелитянин[a]: «Не отдам я тебе наследие моих отцов[b]». Он лёг на постель, отвернул лицо и не стал есть[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за слова, которое сказал ему Навуфей Изреелитянин». Еврейское דָּבָר может означать «слово», «дело» или «то, что было сказано».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наследие моих предков». Буквально: «моих отцов».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не ел хлеба»; в еврейском языке это выражение может относиться к пище вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: мрачный и раздражённый
  rationale: Сочетание передаёт угрюмую замкнутость и сердитое недовольство Ахава естественными словами современного русского языка.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: из-за того, что сказал ему
  rationale: В данном контексте דָּבָר обозначает сказанное Навуфеем; оборот сохраняет смысл и звучит естественнее буквального «из-за слова, которое сказал».
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Навуфей Изреелитянин
  rationale: Имя и обозначение происхождения переданы в традиционной русской библейской форме.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: наследие моих отцов
  rationale: «Наследие» передаёт не просто собственность, а родовое владение; «отцов» сохраняет явно мужскую форму и патрилинейный оттенок оригинала.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: отвернулся к стене
  rationale: Глагол буквально сообщает, что Ахав повернул лицо; «к стене» ясно передаёт подразумеваемое направление жеста в сцене лежания на постели, не меняя его смысла.
- source_word: וְלֹא אָכַל לָחֶם
  choice: отказывался от еды
  rationale: Буквальное «не ел хлеба» является идиомой общего отказа от пищи; несовершенный вид передаёт сознательное продолжающееся нежелание есть.
theological_decisions:
- issue: Родовая принадлежность наследственного владения
  choice: наследие моих отцов
  alternative: наследие моих предков
  rationale: Оригинал употребляет мужское множественное אֲבוֹתַי; выбранная формулировка сохраняет патрилинейный акцент и не нейтрализует его.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; родовое значение נַחֲלָה и эмоциональная окраска описания Ахава сохранены.
