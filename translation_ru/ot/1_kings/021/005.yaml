  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: ru
  text: 'Тогда к нему пришла его жена Иезавель и сказала ему: «Почему ты так мрачен и не ешь?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что это — дух твой мрачен, и ты не ешь хлеба?»'
    reason: Сноска сохраняет более буквальную структуру вопроса, метафору «дух» и выражение «есть хлеб».
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Тогда ... пришла
  rationale: Вайиктоль продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему событию.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: жена Ахава Иезавель
  rationale: Имя передано в принятой русской библейской форме; местоименный суффикс раскрыт именем Ахава для ясности по-русски.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: спросила
  rationale: Глагол буквально означает «сказала/говорила ему», но следующая прямая речь является вопросом, поэтому «спросила» естественно передаёт функцию реплики.
- source_word: מַה זֶּה
  choice: Почему
  rationale: Буквальное «Что это?» здесь идиоматически вводит вопрос о причине состояния Ахава.
- source_word: רוּחֲךָ סָרָה
  choice: ты так мрачен
  rationale: רוּחַ обозначает внутреннее состояние, а סָרָה — угрюмое, подавленное или отвернувшееся расположение духа. Русское «ты так мрачен» естественно передаёт смысл без неясной кальки «дух твой мрачен».
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: и не ешь
  rationale: «Есть хлеб» — древнееврейская идиома обычного приёма пищи; в современном русском «не ешь» точно и естественно передаёт её смысл.
