base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: ru
  text: 'Тогда царь спросил Сиву: «Для чего тебе всё это?[a]» Сива ответил: «Ослы — чтобы на них ездили люди царского дома, хлеб и летние плоды[c] — чтобы ели молодые люди[b], а вино — чтобы пил тот, кто утомится в пустыне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что это тебе?» или «Что это для тебя?» Возможный смысл: «Что ты хочешь этим сказать?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуги» или «сопровождающие».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «летний урожай». Еврейское слово может обозначать плоды или иной урожай, собранный летом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: Для чего всё это у тебя?
  rationale: Сохраняет элементы еврейской идиомы («что это у/для тебя?»), но естественно передаёт контекстуальный вопрос о назначении принесённого.
- source_word: הַחֲמוֹרִים
  choice: ослы
  rationale: Обычное современное русское название животного.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: люди из царского дома
  rationale: Здесь בֵּית обозначает не здание, а дом в смысле семьи и окружения царя; добавление «люди» делает субъект действия ясным по-русски.
- source_word: לִרְכֹּב
  choice: чтобы ездили
  rationale: Естественно выражает цель, для которой предназначены ослы.
- source_word: הַלֶּחֶם
  choice: хлеб
  rationale: Передаёт прямое значение слова без неоправданного обобщения до «пищи».
- source_word: הַקַּיִץ
  choice: летние плоды
  rationale: Не уточняет вид плодов, которого еврейский текст не называет, и сохраняет сезонное значение термина.
- source_word: הַנְּעָרִים
  choice: слуги
  rationale: В данном повествовательном контексте речь, вероятно, идёт о сопровождающих царя слугах; возможное буквальное значение «молодые люди» сохранено в примечании.
- source_word: הַיָּעֵף
  choice: тот, кто утомится
  rationale: Единственное число прилагательного понято обобщённо и передано без изменения числа или устранения его дистрибутивного смысла.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Стандартный и понятный русский эквивалент для безлюдной, необжитой местности; он не требует представлять исключительно песчаную пустыню.
