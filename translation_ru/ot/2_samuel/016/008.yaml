  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: ru
  text: Яхве обратил на тебя всю кровь дома Саула[a], вместо которого ты царствовал, и Яхве отдал царство в руки твоего сына Авессалома. И вот, ты в своём бедствии[b], потому что ты — человек крови[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всю кровь дома Саула»; возможно также: «всё кровопролитие дома Саула» или «всю вину за кровь дома Саула».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «ты в своём зле». Еврейское слово может означать как нравственное зло, так и бедствие или несчастье; в данном контексте вероятнее имеется в виду постигшее Давида бедствие.'
    reason: lexical_alternative
  - marker: c
    text: «Человек крови» — выражение о человеке, отмеченном кровопролитием, насилием или виной за пролитую кровь.
    reason: idiom_explanation
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: обратил на тебя
  rationale: Каузативная форма שוב выражает возвращение последствий на Давида. Русское «обратил на тебя» сохраняет образ воздаяния и звучит естественнее буквального «возвратил на тебя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
  choice: всю кровь дома Саула
  rationale: Сохраняет конкретный и намеренно многозначный еврейский образ; множественное דְּמֵי может подразумевать пролитую кровь или вину за кровопролитие.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: вместо которого ты стал царём
  rationale: תחתיו указывает на занятие места Саула; такая формулировка ясно передаёт смену царя.
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: отдал царство в руки
  rationale: Сохраняет древнееврейский образ передачи царства под власть другого и остаётся понятным по-русски.
- source_word: וְהִנְּךָ
  choice: И вот
  rationale: Естественный современный русский эквивалент частицы, привлекающей внимание к наступившему положению Давида.
- source_word: בְּרָעָתֶךָ
  choice: тебя постигло твоё бедствие
  rationale: רָעָה допускает значения нравственного зла и бедствия. Контекст указывает на постигшее Давида несчастье; притяжательное местоимение сохранено.
- source_word: אִישׁ דָּמִים
  choice: человек крови
  rationale: Сохраняет резкий еврейский идиоматический образ и его неоднозначность между кровопролитием, насилием и виной за кровь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет это различие.
- issue: Значение בְּרָעָתֶךָ
  choice: тебя постигло твоё бедствие
  alternative: ты в своём зле
  rationale: Непосредственный контекст — мятеж Авессалома и бедствие Давида. Сноска сохраняет возможный нравственный смысл, не выдавая обвинение Семея за оценку повествователя.
- issue: Характер обвинения אִישׁ דָּמִים
  choice: человек крови
  alternative: кровожадный человек
  rationale: Более узкое «кровожадный» приписало бы Давиду склонность к убийству, тогда как выражение может обозначать человека, отмеченного кровопролитием или виновного в крови.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис упрощён там, где буквальное воспроизведение было бы неестественным, но ключевые образы «кровь дома Саула», «в руки» и «человек крови» сохранены. Порядок сносок приведён к последовательному [a], [b], [c].
