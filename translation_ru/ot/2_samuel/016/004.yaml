translation:
  language: ru
  text: 'Тогда царь сказал Циве: «Вот, всё, что принадлежит Мемфивосфею, — твоё». Цива сказал: «Я поклоняюсь. Да найду я благоволение в твоих глазах, господин мой царь!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: «Вот»
  rationale: Сохраняет указательно-эмфатическую функцию еврейского слова и естественно вводит царское решение.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: «Я склоняюсь перед тобой»
  rationale: Передаёт жест почтительного преклонения перед царём, не придавая ему обязательно культового смысла.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: «Да найду я благоволение в твоих глазах»
  rationale: Сохраняет образность и форму пожелания исходного выражения.
