    issue: «принадлежало ... теперь твоё»
    rationale: Еврейское כֹּל אֲשֶׁר לִמְפִיבֹשֶׁת буквально обозначает «всё, что у/принадлежит Мемфивосфею». Прошедшее время и слово «теперь» являются добавлениями и создают ненужный временной контраст.
  - severity: low
    issue: «Я склоняюсь перед тобой»
    rationale: Допустимо по смыслу, однако הִשְׁתַּחֲוֵיתִי — обычная формула почтительного поклона. «Я поклоняюсь» точнее и стилистически привычнее в данном регистре.
