base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: ru
  text: Когда Давид немного миновал вершину[a], навстречу ему вышел Сива, слуга[b] Мемфивосфея, с парой осёдланных ослов. На них было двести хлебов, сто кистей изюма, сто летних плодов[c] и бурдюк вина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «немного от вершины»; речь идёт о том, что Давид немного миновал вершину холма или горы.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «юноша» или «прислужник»; здесь по контексту имеется в виду слуга Мемфивосфея.
    reason: lexical_alternative
  - marker: c
    text: Под «летними плодами» здесь может подразумеваться инжир, но еврейское слово имеет более широкое значение.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: отошёл немного от вершины
  rationale: В топографическом контексте רֹאשׁ означает вершину; конструкция естественно указывает, что Давид уже немного миновал её.
- source_word: וְהִנֵּה
  choice: навстречу ему вышел
  rationale: В русском повествовании внезапность появления естественно передаётся самой конструкцией встречи; буквальное «вот» здесь звучало бы несколько тяжеловесно.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: слуга Мемфивосфея
  rationale: נַעַר может означать юношу, слугу или прислужника; отношение Сивы к Мемфивосфею в данном контексте лучше всего выражает «слуга».
- source_word: צֶמֶד חֲמֹרִים
  choice: пара ослов
  rationale: צֶמֶד обозначает пару; упоминание ярма не требуется и могло бы создать не предусмотренный текстом образ.
- source_word: חֲבֻשִׁים
  choice: осёдланных
  rationale: В отношении подготовленных для пути и перевозки груза ослов глагольная форма естественно передаётся словом «осёдланных».
- source_word: מָאתַיִם לֶחֶם
  choice: двести хлебов
  rationale: Счётное употребление слова «хлеб» в русском библейском повествовании понятно и не вводит отсутствующее в оригинале уточнение формы выпечки.
- source_word: צִמּוּקִים
  choice: связок изюма
  rationale: Слово обозначает сушёный виноград, вероятно собранный или спрессованный вместе; «связки» сохраняет счётность и не утверждает определённо, что это были лепёшки.
- source_word: קַיִץ
  choice: летних плодов
  rationale: Термин обозначает летние плоды и может в данном контексте подразумевать инжир, однако широкий перевод сохраняет лексическую неоднозначность.
- source_word: נֵבֶל יָיִן
  choice: бурдюк вина
  rationale: נֵבֶל здесь обозначает кожаный сосуд; «бурдюк вина» — краткое и естественное русское соответствие.
