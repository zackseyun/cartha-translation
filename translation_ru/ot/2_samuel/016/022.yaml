base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: ru
  text: И раскинули для Авессалома шатёр на крыше, и Авессалом вошёл к наложницам своего отца на глазах у всего Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед всем Израилем».'
    reason: Возможная более формальная передача выражения לְעֵינֵי כָּל יִשְׂרָאֵל; основной текст сохраняет образ видимого, публичного действия.
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: раскинули
  rationale: Глагол נטה применительно к шатру означает «раскинуть, установить». «Раскинули шатёр» естественно передаёт образ натянутого полотнища и сохраняет конкретность еврейского выражения.
- source_word: הָאֹהֶל
  choice: шатёр
  rationale: Существительное с определённым артиклем обозначает конкретный шатёр, приготовленный для задуманного публичного действия. «Шатёр» соответствует обстановке древнего повествования и современному литературному русскому языку.
- source_word: עַל הַגָּג
  choice: на крыше
  rationale: Прямое и естественное обозначение плоской крыши дома, служившей открытым пространством и обеспечивавшей публичность происходящего.
- source_word: וַיָּבֹא ... אֶל
  choice: вошёл к
  rationale: Сохранён еврейский эвфемизм, который в данном контексте означает половую связь. Формулировка не делает текст ни неоправданно расплывчатым, ни более откровенным, чем оригинал.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: наложницам своего отца
  rationale: Прямая передача сочетания в сопряжённой конструкции; возвратное местоимение «своего» естественно по-русски указывает на отца Авессалома.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: на глазах у всего Израиля
  rationale: Идиоматическая русская передача буквального «перед глазами всего Израиля», сохраняющая смысл открытого, засвидетельствованного действия.
theological_decisions:
- issue: Передача сексуального эвфемизма в контексте захвата царской власти
  choice: вошёл к наложницам
  alternative: лёг с наложницами; вступил в связь с наложницами
  rationale: Сохранение эвфемизма отражает сдержанный и торжественный регистр еврейского повествования, не скрывая значения, ясного из контекста, и не добавляя отсутствующей в оригинале прямоты.
- issue: Публичный характер поступка Авессалома
  choice: на глазах у всего Израиля
  alternative: перед всем Израилем
  rationale: Выбранная формулировка сохраняет образ «глаз» из еврейского текста и подчёркивает демонстративный характер действия, не утверждая, что буквально каждый израильтянин непосредственно присутствовал.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксический повтор имени «Авессалом» сохранён вслед за еврейским текстом. Маркер сноски поставлен при выражении, к которому относится лексическая альтернатива.
