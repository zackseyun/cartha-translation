base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: ru
  text: Авессалом и весь народ[a], израильтяне, пришли в Иерусалим; с ним был и Ахитофел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь народ, каждый израильтянин» или «весь народ, мужи Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: Авессалом
  rationale: Имя передано в традиционной русской библейской форме. Начальный союз не выражен отдельно, поскольку в русском повествовании стих естественно начинается без добавочного «и», а временного значения «теперь» в еврейском тексте нет.
- source_word: וְ/כָל הָ/עָם֙
  choice: и весь народ
  rationale: עָם здесь обозначает собирательно людей, поддерживавших Авессалома; «войско» неоправданно сужало бы смысл.
- source_word: אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: израильтяне
  rationale: Коллективное выражение буквально означает «муж Израиля» и стоит как пояснение к «весь народ». «Израильтяне» естественно передаёт национально-собирательный смысл, а буквальная форма сохранена в примечании.
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: пришли в Иерусалим
  rationale: Обычное значение בוא и естественное русское обозначение движения к городу переданы глаголом «пришли» с предлогом «в».
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: с ним был и Ахитофел
  rationale: В еврейской конструкции подразумевается связка; в русском она выражена глаголом «был». Местоимение по контексту относится к Авессалому, а имя дано в традиционной форме.
