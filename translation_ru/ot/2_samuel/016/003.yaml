base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: ru
  text: 'И царь спросил: «А где сын твоего господина?» Сива ответил царю: «Вот, он остаётся в Иерусалиме[a], потому что сказал: „Сегодня дом Израиля возвратит мне царство моего отца“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живёт в Иерусалиме». Еврейское причастие может обозначать продолжающееся проживание или пребывание на месте, а не только буквальное сидение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: И царь спросил
  rationale: Глагол речи вводит вопрос; по-русски «спросил» естественно передаёт его функцию, а начальное «И» сохраняет последовательность повествования.
- source_word: וְאַיֵּה
  choice: А где
  rationale: «А» естественно передаёт присоединительный союз и продолжение расспроса; אַיֵּה — вопрос о местонахождении.
- source_word: בֶּן אֲדֹנֶיךָ
  choice: сын твоего господина
  rationale: Формально и ясно передаёт социальное обозначение אדון без придания ему божественного смысла.
- source_word: צִיבָא
  choice: Сива
  rationale: Традиционная русская форма библейского личного имени.
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и естественный русский эквивалент указательно-презентативной частицы.
- source_word: יוֹשֵׁב
  choice: остаётся
  rationale: Причастие ישׁב в данном контексте обозначает пребывание или оставание на месте, а не обязательно буквальное сидение.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Устоявшаяся русская форма географического названия с требуемым предлогом.
- source_word: כִּי
  choice: потому что
  rationale: Вводит названную Сивой причину того, что сын его господина остался в Иерусалиме.
- source_word: הַיּוֹם
  choice: Сегодня
  rationale: Прямой и современный эквивалент временного наречия.
- source_word: יָשִׁיבוּ לִי
  choice: возвратит мне
  rationale: Hiphil от שוב означает «вернуть, восстановить»; «возвратит мне» сохраняет образ возвращения царства прежнему наследнику.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет корпоративно-национальное выражение еврейского текста, не упрощая его до одного слова «Израиль».
- source_word: מַמְלְכוּת אָבִי
  choice: царство моего отца
  rationale: Близко воспроизводит конструкцию исходного текста и звучит естественно по-русски.
theological_decisions:
- issue: Сообщение Сивы о мотивах сына его господина
  choice: Передать обвинение Сивы прямо как цитируемую речь, не подтверждая его истинность.
  alternative: Добавить дистанцирующие слова вроде «якобы сказал» или «по словам Сивы».
  rationale: Еврейский текст лишь сообщает слова Сивы. Явное выражение сомнения внесло бы оценку из более широкого повествовательного контекста в сам этот стих.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой и доступный; сохранены выражение «дом Израиля» и неоднозначность сообщения Сивы.
