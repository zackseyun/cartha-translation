  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: ru
  text: 'Авессалом сказал Хусию: «Такова твоя верность другу? Почему ты не пошёл со своим другом?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: твоя верность
  rationale: 'В данном контексте חֶסֶד обозначает преданность и верность в личных и политических отношениях: Авессалом упрекает Хусия за то, что тот якобы не сохранил верность Давиду.'
- source_word: רֵעֶךָ
  choice: друг / своим другом
  rationale: רֵעַ означает друга, товарища или близкого человека; «друг» естественно звучит по-русски и сохраняет повтор в еврейском тексте.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Почему ты не ушёл вместе со своим другом?
  rationale: הלך с אֶת выражает совместное движение. «Ушёл вместе» ясно передаёт подразумеваемый уход Давида из Иерусалима и сохраняет простоту исходной конструкции.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: Такова-то твоя верность другу?
  rationale: Безглагольная фраза является риторическим вопросом с оттенком насмешливого упрёка. Частица «-то» естественно передаёт это возмущение, не снимая вопросительной формы.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Сохранён обычный повествовательный эквивалент глагола אמר; вопросительный характер передаётся самой прямой речью.
theological_decisions: []
translation_notes:
