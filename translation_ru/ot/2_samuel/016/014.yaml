  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: ru
  text: Царь и весь народ, бывший с ним, пришли утомлёнными, и там он перевёл дух.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол стоит в единственном числе: «он перевёл дух»; возможно также коллективное понимание: «они перевели дух». Иной перевод: «он отдохнул».'
    reason: Сноска сохраняет заметное несоответствие между множественным составным подлежащим первой части и единственным числом заключительного глагола, а также указывает близкую лексическую альтернативу.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришли
  rationale: Глагол בוא означает «приходить, прибывать». Русское «пришли» естественно передаёт достижение места; множественное число обусловлено составным подлежащим «царь и весь народ».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён титул, употреблённый в еврейском тексте, без замены его именем Давида.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: и весь народ, бывший с ним
  rationale: Передана определительная конструкция «который был с ним» в естественной для литературного русского языка сжатой форме.
- source_word: עֲיֵפִים
  choice: утомлёнными
  rationale: Прилагательное обозначает физическую усталость или изнеможение. «Утомлёнными» точно и без излишнего усиления передаёт это значение.
- source_word: וַיִּנָּפֵשׁ
  choice: он перевёл дух
  rationale: Форма глагола стоит в единственном числе; выражение передаёт восстановление сил и дыхания после утомительного пути, сохраняя живой образ исходного слова.
- source_word: שָׁם
  choice: там
  rationale: Обычное пространственное наречие, указывающее на место отдыха.
theological_decisions:
- issue: Число подлежащего при וַיִּנָּפֵשׁ
  choice: «он перевёл дух» — сохранено грамматическое единственное число, вероятнее всего относящееся к царю
  alternative: «они перевели дух» — коллективное согласование с царём и народом
  rationale: Масоретский текст однозначно содержит глагольную форму мужского рода единственного числа. Перевод не исправляет её молча, а коллективное понимание отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «перевёл дух» понятен современному читателю и передаёт не только остановку, но и восстановление после усталости.
