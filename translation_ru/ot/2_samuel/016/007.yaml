  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: ru
  text: 'И вот что говорил Семей, проклиная его: «Убирайся, убирайся, виновник кровопролития[a], негодный человек[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек крови»; древнееврейское множественное «крови» может указывать на кровопролитие или вину за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нечестивец». Древнееврейское выражение означает негодного, низкого человека; здесь оно не обязательно является именем «Велиал».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: И вот что говорил
  rationale: Передаёт ввод содержания речи без буквального и неестественного «и так сказал»; несовершенный вид уместен для слов, произносимых в ходе продолжающегося проклятия.
- source_word: שִׁמְעִי
  choice: Семей
  rationale: Использована традиционная русская форма библейского имени, хорошо узнаваемая читателями.
- source_word: בְּ/קַֽלְל/וֹ
  choice: проклиная его
  rationale: Конструкция с инфинитивом выражает одновременное действие; местоименный суффикс мужского рода относится в контексте к Давиду.
- source_word: צֵא צֵא
  choice: Убирайся, убирайся
  rationale: Повтор повелительной формы передаёт усиленное требование уйти и презрительное отвержение; «убирайся» естественно звучит как прямое оскорбительное повеление.
- source_word: אִישׁ הַ/דָּמִים
  choice: виновник кровопролития
  rationale: Множественное דמים — древнееврейский оборот, связанный с пролитой кровью и виной за неё. Перевод передаёт обвинение, не приписывая Давиду прямо не названную кровожадность как мотив.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: негодный человек
  rationale: בְּלִיַּעַל здесь служит нарицательным нравственным оскорблением со значением негодности или низости, а не обязательно собственным именем.
theological_decisions:
- issue: Значение אִישׁ הַדָּמִים
  choice: виновник кровопролития
  alternative: человек крови; кровожадный человек
  rationale: Основной текст ясно передаёт обвинение в пролитии крови, сохраняя различие между виной за кровопролитие и внутренней кровожадностью.
- issue: Передача בְּלִיַּעַל
  choice: негодный человек
  alternative: нечестивец; человек Велиала
  rationale: В данном ветхозаветном употреблении это обычное оскорбительное обозначение нравственно низкого человека. Форма «Велиал» могла бы необоснованно внести позднейшее представление о личном имени.
translation_notes:
  register: Современный литературный русский язык с сохранением резкости прямой речи. Повтор «убирайся» воспроизводит эмоциональное усиление оригинала; оскорбления переданы понятно, без архаизации и без внесения позднейших богословских ассоциаций.
