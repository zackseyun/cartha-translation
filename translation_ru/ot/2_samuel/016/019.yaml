  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: ru
  text: И во-вторых, кому мне служить? Разве не перед его сыном? Как я служил перед твоим отцом, так буду и перед тобой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед его сыном… перед твоим отцом… перед тобой». Это придворный оборот, обозначающий служение в присутствии царя или под его властью.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: И во-вторых
  rationale: Естественный русский маркер, вводящий второй довод Хусия.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: кому мне служить?
  rationale: Передаёт служение и верность при царском дворе, сохраняя риторический вопрос.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Не перед его ли сыном?
  rationale: Сохраняет לִפְנֵי и ожидаемый утвердительный ответ, не устраняя придворную образность оригинала.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Как я служил перед твоим отцом
  rationale: Сохраняет глагол «служить» и повторяющийся придворный оборот «перед».
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: так буду и перед тобой
  rationale: Не добавляет отсутствующий во второй части глагол עבד и сохраняет переход от «служил» к «буду».
