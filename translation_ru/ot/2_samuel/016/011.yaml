base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: ru
  text: 'Тогда Давид сказал Авессе и всем своим слугам: «Вот, мой сын, который вышел из моих недр, ищет моей смерти; тем более теперь — этот вениамитянин! Оставьте его, пусть проклинает, ведь Яхве сказал ему[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с подразумеваемым смыслом: «ведь Яхве велел ему это». Буквально: «ведь Яхве сказал ему»; содержание сказанного в еврейском тексте не указано, но из контекста подразумевается проклятие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую силу еврейского слова и естественно вводит сопоставление в современной русской речи.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: мой сын, который произошёл от меня
  rationale: Передаёт подчёркнутое естественное родство без буквального «вышел из моих внутренностей», которое по-русски звучало бы неестественно и могло бы отвлечь от смысла.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: ищет моей смерти
  rationale: Русское библейское выражение ясно передаёт намерение лишить жизни и сохраняет образность исходной идиомы лучше, чем полностью разъяснительное «пытается убить меня».
- source_word: וְאַף כִּי עַתָּה
  choice: тем более теперь
  rationale: 'Сохраняет риторическое усиление: если так поступает родной сын Давида, этого тем более можно ожидать от вениаминитянина.'
- source_word: בֶּן הַיְמִינִי
  choice: этот вениаминитянин
  rationale: Обозначает принадлежность к колену Вениамина и естественно звучит по-русски; указательное «этот» передаёт определённость и контекстуальную направленность выражения.
- source_word: הַנִּחוּ לוֹ
  choice: Оставьте его
  rationale: Передаёт форму множественного числа и приказ Давида своим людям не вмешиваться.
- source_word: וִיקַלֵּל
  choice: пусть проклинает
  rationale: Передаёт разрешительно-побудительное продолжение после повеления, не усиливая его до одобрения действия.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: ведь Яхве сказал ему
  rationale: 'Сохраняет буквальную синтаксическую неполноту: содержание сказанного подразумевается контекстом, но прямо в еврейском тексте не выражено.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Приписывает ли Давид проклятия Семея прямому повелению Бога или лишь Божьему попущению
  choice: «ведь Яхве сказал ему»
  alternative: «ведь Яхве позволил ему» или «ведь Яхве велел ему проклинать»
  rationale: Еврейский текст передаёт слова Давида как прямое утверждение о сказанном Яхве, но не формулирует содержание речи. Перевод не смягчает это до попущения и не добавляет отсутствующую прямую заповедь, тем самым сохраняя богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Эллиптическое «тем более теперь — этот вениаминитянин!» сохранено ради риторической силы и близости к структуре еврейского текста. Маркер сноски поставлен у относящейся к ней заключительной фразы.
