  source_fidelity: 'Основной смысл передан точно: Давид сопоставляет угрозу со стороны родного сына с проклятиями представителя Вениамина, велит не вмешиваться и приписывает слова/действие Яхве, не раскрывая в основном тексте содержания сказанного. Однако «который произошёл от меня» ослабляет телесно-родственное выражение מִמֵּעַי и звучит как общее происхождение, а этноним «вениаминитянин» менее нормативен и естественен, чем «вениамитянин».'
