  terminology: '«Яхве» последовательно передаёт יהוה. «Вениамитянин» точно обозначает принадлежность к колену Вениамина. «Ищет моей смерти» адекватно передаёт идиому «ищет моей жизни» в значении стремится лишить жизни. Сноска сохраняет существенную неоднозначность: в еврейском тексте не названо содержание того, что Яхве сказал этому человеку.'
