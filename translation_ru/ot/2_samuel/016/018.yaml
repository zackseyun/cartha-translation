  - severity: medium
    issue: «Все израильтяне» нейтрализует אִישׁ в выражении וְכָל אִישׁ יִשְׂרָאֵל.
    rationale: Хотя собирательное прочтение естественно, исходный текст говорит о «каждом мужчине Израиля»; «все мужчины Израиля» сохраняет обозначение и остаётся современным русским.
