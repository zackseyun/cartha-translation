  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: ru
  text: 'Хусий сказал Авессалому: «Нет, ибо я буду принадлежать тому, кого избрали Яхве, этот народ и все мужчины Израиля, и с ним останусь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «Нет, ибо я буду принадлежать тому, кого изберут Яхве, этот народ и все мужчины Израиля, и с ним останусь». Еврейский перфект обычно указывает на уже совершившийся выбор, но в контексте относительный оборот может пониматься и как принцип выбора.'
    reason: Сохраняется контекстуально возможное прочтение относительной конструкции, не устраняя намеренную двусмысленность речи Хусия.
lexical_decisions:
- source_word: לֹא כִּי
  choice: Нет!
  rationale: Сочетание вводит решительное возражение и последующее пояснение. В русском причинная связь достаточно ясна из следующей фразы, а отдельное «ибо» звучало бы тяжеловесно.
- source_word: אֲשֶׁר בָּחַר
  choice: тому, кого избрали
  rationale: Перфект בָּחַר естественно передаётся прошедшим временем; относительная конструкция указывает на конкретного человека, не называя его прямо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: וְהָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняются собирательное единственное число и указательное значение еврейского выражения.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: и все израильтяне
  rationale: Буквально выражение означает «и каждый муж Израиля», но в данном общественно-политическом контексте естественное русское собирательное обозначение передаёт совокупность израильтян без неуместного акцента на поле.
- source_word: לא אֶהְיֶה
  choice: я буду принадлежать
  rationale: Масоретское לא, вероятно, представляет написание частицы לו («ему»), а אֶהְיֶה эллиптически выражает верность или принадлежность. Русская формулировка раскрывает подразумеваемое отношение, не отождествляя избранного прямо с Авессаломом.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: и с ним останусь
  rationale: יָשַׁב здесь означает не буквальное сидение, а продолжительное пребывание и служение рядом с человеком.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Намеренная двусмысленность речи Хусия
  choice: сохранить неназванным того, «кого избрали»
  alternative: прямо отнести слова к Авессалому
  rationale: Фраза допускает понимание, выгодное Авессалому, но одновременно может подразумевать Давида как избранника Яхве. Перевод не должен устранять эту повествовательную двусмысленность.
- issue: Выражение אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  alternative: каждый муж Израиля
  rationale: В контексте речь идёт о народной поддержке царя. Естественное русское обозначение не вводит богословского вывода о составе группы и передаёт коллективный смысл.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной прозы. Имена переданы в привычной русской библейской форме: Хусий, Авессалом. Короткое «Нет!» сохраняет силу возражения; порядок перечисления следует еврейскому тексту. Единственная сноска отмечена в основном тексте.'
