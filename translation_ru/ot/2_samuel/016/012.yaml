  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: ru
  text: Может быть, Яхве увидит моё бедствие[a] и воздаст мне добром взамен его проклятия в этот день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно письменной форме: «мою вину».'
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: Может быть
  rationale: Передаёт надежду, соединённую с неуверенностью, не усиливая уверенность Давида.
- source_word: יִרְאֶה
  choice: увидит
  rationale: Сохраняет конкретный образ еврейского ראה; в данном сочетании подразумевается, что Яхве заметит бедственное положение Давида.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: ב/עונ/י
  choice: моё бедствие
  rationale: Основной текст следует традиционному чтению, которое по контексту указывает на унижение и страдание Давида; письменная форма «мою вину» сохранена в сноске.
- source_word: וְהֵשִׁיב ... לִי טוֹבָה
  choice: и воздаст мне добром
  rationale: В породе хифиль שוב здесь выражает ответное воздаяние; эта формулировка естественно передаёт благой ответ, направленный Давиду.
- source_word: תַּחַת
  choice: за
  rationale: 'Кратко и естественно выражает обмен или возмещение: добро взамен проклятий.'
- source_word: קִלְלָתוֹ
  choice: его ... проклятия
  rationale: Множественное число в русском естественно передаёт продолжающуюся брань и проклятия Семея в повествовательном контексте.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодняшние
  rationale: Естественно связывает временное уточнение «в этот день» с проклятиями, сохраняя акцент на нынешних действиях Семея.
theological_decisions:
- issue: Толкование ב/עונ/י с учётом кетива и кере
  choice: моё бедствие
  alternative: мою вину
  rationale: Контекст и традиционное чтение указывают на нынешнее страдание и унижение Давида, тогда как письменная форма допускает «мою вину». Разночтение сохранено, а не устранено.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Имя Яхве сохранено. Маркер сноски помещён непосредственно после спорного чтения.
