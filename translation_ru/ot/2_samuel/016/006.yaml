    text: 'Или: «побивал камнями Давида и всех слуг царя Давида». Еврейский глагол допускает такой более буквальный перевод, однако здесь имеется в виду не казнь через побиение камнями, а то, что Семей бросал в них камни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: бросал камни в
  rationale: Порода סקל означает побивать или забрасывать камнями. В данном контексте речь идёт не о формальной казни, а о многократном враждебном бросании камней; несовершенный вид «бросал» естественно передаёт продолженное действие.
- source_word: עַבְדֵי
  choice: слуг
  rationale: עבד здесь широко обозначает людей на царской службе; «слуг» не приписывает им непременно рабский статус и остаётся близким к исходному выражению.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царя Давида
  rationale: Естественное русское сочетание титула и имени, сохраняющее оба элемента еврейского текста.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Сохраняет широкое значение עם и не ограничивает сопровождавших Давида исключительно войском.
- source_word: הַגִּבֹּרִים
  choice: воины
  rationale: В повествовательном контексте גִּבּוֹרִים обозначает доблестных, сильных бойцов, вероятно отборных воинов Давида; современное «воины» звучит естественнее буквального «сильные мужи».
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: справа и слева от Давида
  rationale: Суффикс мужского рода по контексту наиболее естественно относится к Давиду. Повтор имени устраняет неестественную для русского языка местоименную двусмысленность, не меняя смысла расположения сопровождавших его людей.
