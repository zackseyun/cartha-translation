  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: ru
  text: Он бросал камни в Давида и во всех слуг царя Давида[a], а весь народ и все воины были справа и слева от Давида.
  philosophy: optimal-equivalence
  footnotes:
