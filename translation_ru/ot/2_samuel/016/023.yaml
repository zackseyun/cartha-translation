base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: ru
  text: Совет Ахитофела, который он давал в те дни, воспринимали так, словно вопрошали Бога[a]. Таким был всякий совет Ахитофела и для Давида, и для Авессалома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно вопрошали посредством слова Бога»; выражение может означать обращение к Богу за ответом. Сравнение подчёркивает, насколько высоко ценили советы Ахитофела.'
    reason: Лексическая альтернатива для בִּדְבַר הָאֱלֹהִים и пояснение силы сравнения.
lexical_decisions:
- source_word: עֲצַת
  choice: совет
  rationale: Существительное обозначает совет или рекомендацию советника; «совет» естественно по-русски, сохраняет придворный оттенок и повтор корня в стихе.
- source_word: אֲשֶׁר יָעַץ
  choice: который он давал
  rationale: Сочетание «совет, который он давал» естественно передаёт однокоренной еврейский глагол без неуклюжего русского повтора «советовал совет».
- source_word: בַּיָּמִים הָהֵם
  choice: в те дни
  rationale: Точная и привычная передача временного выражения.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: словно вопрошали Бога
  rationale: Передаёт безлично-обобщённое сравнение и идиому обращения к Богу за указанием; не утверждает, что совет Ахитофела сам был Божьим откровением.
- source_word: כֵּן כָּל עֲצַת אֲחִיתֹפֶל
  choice: так относились ко всякому совету Ахитофела
  rationale: В русском языке ясно выражает подразумеваемую высокую оценку каждого его совета и естественно связывает вторую часть с первой.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: и Давид, и Авессалом
  rationale: Парная конструкция «и … и …» отражает повтор גַּם … גַּם; перестройка делает Давида и Авессалома субъектами подразумеваемого отношения к совету, что естественно по-русски.
theological_decisions:
- issue: Сила сравнения с вопрошанием Бога
  choice: Советы Ахитофела воспринимались так, словно через вопрошание Бога получали надёжное указание.
  alternative: Совет Ахитофела практически выполнял роль божественного оракула.
  rationale: Еврейский текст устанавливает сравнение, а не тождество. Перевод сохраняет необычайный авторитет совета, не называя его богодухновенным откровением.
- issue: Значение בִּדְבַר הָאֱלֹהִים
  choice: вопрошали Бога
  alternative: вопрошали о слове от Бога
  rationale: Предлог ב с דְבַר допускает более буквальную передачу через «слово/указание Бога», однако в контексте выражение описывает обращение за Божьим решением. Основной текст передаёт идиоматический смысл, а примечание сохраняет лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Вопрошали» слегка возвышенно, но понятно и уместно для обращения к Богу. Синтаксис перестроен ради естественности, при этом повтор слова «совет» и парность Давида и Авессалома сохранены.
