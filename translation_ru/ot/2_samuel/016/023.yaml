  source_fidelity: Основной текст верно передаёт высокую оценку советов Ахитофела и не отождествляет их с Божьим откровением. Однако «так относились» во второй части переводит смысловое следствие вместо повторяемого сказуемого сравнения и несколько ослабляет формулу оригинала. Более прямое «таким был» сохраняет повтор и относит оценку к совету как таковому. Выражение בִּדְבַר הָאֱלֹהִים — идиоматично и допускает буквальную отсылку к «слову Бога»; в основном тексте уместно «вопрошали Бога», а примечание должно точнее отметить эту возможность.
  naturalness: «Совет Ахитофела, который он давал в те дни» — естественная литературная конструкция. «Таким был всякий совет...» звучит по-русски ясно и торжественно, не вводя невыраженный глагол отношения. «Вопрошали Бога» регистрово уместно в библейском повествовании.
  terminology: Имена «Ахитофел», «Давид» и «Авессалом» переданы нормативно. «Совет» последовательно отражает עֲצַת. Примечание заменяет не вполне естественное «вопрошали о слове» на более точную и читаемую формулировку, сохраняя лексическую неоднозначность דָּבָר.
