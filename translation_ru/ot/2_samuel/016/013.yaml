  source_fidelity: 'Смысл в целом передан верно: Давид с людьми движется по дороге, Шимей — по склону напротив него, продолжая проклинать, бросать камни и пыль. Однако «в его сторону» несколько ослабляет повторённое לְעֻמָּתוֹ, которое прежде всего сохраняет пространственное положение «напротив него».'
  naturalness: «Он всё шёл, проклиная, бросал…» звучит синтаксически тяжеловесно и создаёт неоправданное впечатление отдельного повторного действия. Более естественно выразить длительность наречием «всё время» при деепричастии.
  terminology: Имена и ключевая лексика переданы корректно. «Бросал камни» не навязывает значения судебного побивания камнями. Для עִפַּר בֶּעָפָר естественно «разбрасывал пыль»; отдельная буквальная сноска не требуется и её нынешняя формулировка неудачна как русское пояснение.
