revisions:
- from: Давид и его люди шли по дороге, а Шимей шёл по склону горы напротив него; он всё шёл, проклиная, бросал в его сторону камни и швырял пыль.[a]
  to: Давид и его люди шли по дороге, а Шимей шёл по склону горы напротив него, всё время проклиная, бросая камни в его сторону и разбрасывая пыль.
  rationale: Перестроена фраза для современного литературного русского при сохранении длительного характера действий, выраженного еврейской конструкцией הֹלֵךְ ... הָלוֹךְ. «В его сторону» сохраняет направленность бросания камней в условиях, где повторное לְעֻמָּתוֹ отсылает к противостоящему положению Шимея; «напротив него» уже ясно передаёт это положение в первой части предложения. Удалена необязательная и неудачно сформулированная сноска.
