base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: ru
  text: Давид и его люди шли по дороге, а Шимей шёл по склону горы напротив него, всё время проклиная, бросая камни в его сторону и разбрасывая пыль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: по дороге
  rationale: דֶּרֶךְ обозначает дорогу или путь; сочетание с предлогом и артиклем здесь конкретно описывает маршрут Давида.
- source_word: בְּצֵלַע הָהָר
  choice: по склону горы
  rationale: צֵלַע буквально означает «бок, сторона»; применительно к горе естественное русское соответствие — «склон горы».
- source_word: לְעֻמָּתוֹ
  choice: напротив него / в его сторону
  rationale: Выражение указывает на пространственное положение напротив или на соответствующей стороне. При первом употреблении оно описывает положение Шимея, при втором — направление бросаемых камней; вариативная передача сохраняет оба употребления без неестественного повтора.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: шёл ... всё шёл
  rationale: Повтор форм глагола הלך подчёркивает продолжительность движения; «всё шёл» передаёт этот длительный характер действия на естественном русском языке.
- source_word: וַיְקַלֵּל
  choice: проклиная
  rationale: Порода пиэль глагола קלל означает «проклинать»; деепричастие связывает проклятия с продолжающимся движением.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: бросал ... камни
  rationale: Хотя סקל может обозначать побивание камнями, контекст здесь описывает враждебное преследование, а не официальную казнь; выбранная формулировка не привносит судебного оттенка.
- source_word: וְעִפַּר בֶּעָפָר
  choice: швырял пыль
  rationale: Однокоренное сочетание обозначает бросание пыли или рыхлой земли; «швырял пыль» передаёт резкость враждебного жеста.
- source_word: וַאֲנָשָׁיו
  choice: его люди
  rationale: В данном контексте אֲנָשִׁים — сопровождавшие Давида мужчины и сторонники; «его люди» звучит естественно и не сужает значение до воинов.
