  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: ru
  text: 'Когда Хусий из Арки, друг Давида, пришёл к Авессалому, он сказал ему: «Да здравствует царь! Да здравствует царь!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть живёт царь!» Это еврейское царское приветствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Еврейская повествовательная формула вводит следующее событие; русское «когда» естественно передаёт временную связь, не утяжеляя фразу буквальным «и было, когда».
- source_word: בָּא
  choice: пришёл
  rationale: Обычный глагол движения здесь обозначает прибытие Хусия к Авессалому.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Хусий Архитянин
  rationale: Имя передано в принятой русской библейской форме; обозначение происхождения הָאַרְכִּי — естественным русским этнонимическим наименованием.
- source_word: רֵעֶה דָוִד
  choice: друг Давида
  rationale: Сочетание прямо обозначает личную и политически значимую связь Хусия с Давидом.
- source_word: אֶל אַבְשָׁלוֹם
  choice: к Авессалому
  rationale: Предлог אֶל при глаголе движения передаёт направленность прибытия к человеку.
- source_word: וַיֹּאמֶר חוּשַׁי אֶל אַבְשָׁלֹם
  choice: он сказал ему
  rationale: Местоимения устраняют тяжёлое для русского повторение уже названных имён, не создавая смысловой неясности.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Да здравствует царь!
  rationale: Устойчивая русская формула царского приветствия точно передаёт пожелательно-провозгласительный смысл еврейской формы.
- source_word: יְחִי הַמֶּלֶךְ (повтор)
  choice: Да здравствует царь!
  rationale: Повтор сохранён как выражение усиленной публичной аккламации и как элемент повествовательной двусмысленности.
theological_decisions:
- issue: Двусмысленность приветствия Хусия, обращённого к Авессалому
  choice: Сохранить обычную царскую аккламацию без указания, кого именно Хусий внутренне признаёт царём
  alternative: Явно обозначить иронию, обманный замысел или скрытую верность Давиду
  rationale: Сам стих не раскрывает намерение Хусия непосредственно. Нейтральная формула сохраняет заложенное контекстом напряжение и не добавляет толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис облегчён по сравнению с буквальным еврейским построением, повтор аккламации сохранён. Маркер сноски поставлен после обеих повторённых формул, поскольку примечание относится к аккламации в целом.
