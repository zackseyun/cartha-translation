base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: ru
  text: Когда царь Давид дошёл до Бахурима, и вот, оттуда вышел человек из рода дома Саула. Его звали Шимей, сын Геры. Он всё выходил и проклинал[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходя, выходил и проклинал». В еврейском тексте глагол «выходить» усилен абсолютным инфинитивом, что, вероятно, указывает на продолжительное или повторяющееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: Когда царь Давид дошёл до Бахурима
  rationale: Конструкция с waw продолжает повествование, а עַד указывает на достижение места. «Когда… дошёл» естественно вводит последующее событие и сохраняет значение прибытия.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и оживляющую повествование силу частицы, вводящей внезапно появившегося персонажа.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: оттуда вышел человек
  rationale: Причастие יוֹצֵא описывает разворачивающееся действие; в русском повествовании совершенный вид естественно передаёт появление человека на сцене.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: из рода дома Саула
  rationale: «Род» передаёт родственную группу מִשְׁפָּחָה, а «дом Саула» сохраняет династический и семейный смысл בֵּית.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: Его звали Шимей, сын Геры
  rationale: Современная и ясная русская форма традиционной формулы именования, сохраняющая имя и отчество по отцу.
- source_word: יֹצֵא יָצוֹא וּמְקַלֵּל
  choice: Он шёл оттуда, не переставая проклинать
  rationale: Сочетание причастия с абсолютным инфинитивом усиливает или продлевает действие; русский оборот передаёт его непрерывный характер и одновременное проклятие, избегая неестественного буквального повтора.
