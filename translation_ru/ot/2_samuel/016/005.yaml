translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет живость древнееврейского повествования; синтаксис разделён на короткие фразы ради ясности. Маркер сноски поставлен у оборота, который она поясняет.
