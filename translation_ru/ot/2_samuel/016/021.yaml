base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: ru
  text: 'Ахитофел сказал Авессалому: «Войди к наложницам своего отца[a], которых он оставил присматривать за домом. Тогда весь Израиль услышит, что ты стал отвратителен своему отцу[b], и все, кто с тобой, ободрятся[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Войди к» — древнееврейский эвфемизм, означающий вступить в половую связь.
    reason: lexical_alternative
  - marker: b
    text: Древнееврейский глагол буквально связан с образом зловония; здесь он означает стать отвратительным, омерзительным.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «укрепятся руки всех, кто с тобой» — они ободрятся и станут решительнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: войди к
  rationale: Сохраняет древнееврейский эвфемизм, обозначающий половую связь, и его сдержанный тон; значение поясняется в сноске.
- source_word: פִּלַגְשֵׁי
  choice: наложницам
  rationale: Точный и общепринятый русский эквивалент для женщин признанного, но более низкого брачного статуса в древнем царском доме.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: оставил присматривать за домом
  rationale: Естественно передаёт цель, ради которой Давид оставил женщин, не сужая שמר исключительно до физической охраны.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Тогда весь Израиль услышит
  rationale: Передаёт ожидаемое следствие совета; «весь Израиль» обозначает народ как целое.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: ты стал ненавистен своему отцу
  rationale: Передаёт сильный переносный смысл глагола — стать отвратительным, вызвать отвращение, — естественным современным русским выражением без буквального образа дурного запаха.
- source_word: וְחָזְקוּ יְדֵי
  choice: ободрятся
  rationale: 'Передаёт значение древнееврейской идиомы «укрепятся руки»: сторонники приобретут решимость и смелость.'
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: все, кто с тобой
  rationale: Сохраняет широкую реляционную формулировку оригинала, не заменяя её более узким политическим толкованием «сторонники».
theological_decisions:
- issue: Эвфемизм в совете о сексуальном и политическом акте
  choice: «Войди к наложницам своего отца»
  alternative: «Переспи с наложницами своего отца» / «Вступи в связь с наложницами своего отца»
  rationale: Сохранён эвфемизм исходного текста и его серьёзный тон; сноска устраняет возможную неясность, не делая формулировку грубой или сенсационной.
- issue: Характер разрыва между Авессаломом и Давидом
  choice: «ты стал ненавистен своему отцу»
  alternative: «ты сделался отвратителен своему отцу» / «ты вызвал отвращение у своего отца»
  rationale: Формулировка сохраняет направленность выражения אֶת אָבִיךָ и показывает задуманный необратимый разрыв, не добавляя богословской оценки поступка сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для устной речи советника; сексуальный эвфемизм и сильная образность נבאש сохранены через основной текст и краткие пояснения. Все маркеры сносок размещены непосредственно после соответствующих выражений.
