base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: ru
  text: 'Но царь сказал[a]: «Что мне до вас, сыновья Церуи? Если он проклинает потому, что Яхве сказал ему: „Проклинай Давида“, то кто может сказать: „Зачем ты так поступил?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь он проклинает, потому что Яхве сказал ему: „Проклинай Давида“». Еврейские частицы допускают здесь не только условное, но и объяснительное понимание.'
    reason: Альтернативное синтаксическое прочтение неоднозначных еврейских частиц.
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Что мне до вас
  rationale: Устойчивый русский оборот передаёт не буквальный вопрос о принадлежности, а отстранение и укор, обращённый к сыновьям Церуи.
- source_word: בְּנֵי צְרֻיָה
  choice: сыновья Церуи
  rationale: Прямая передача сочетания, называющего Иоава и Авессу по имени их матери; форма «Церуя» близка еврейскому имени и естественно склоняется по-русски.
- source_word: יְקַלֵּל / קַלֵּל
  choice: проклинает / Проклинай
  rationale: Повтор одного корня сохраняет лексическую связь между действием Шимея и приведённым повелением. Несовершенный вид в императиве естественно передаёт продолжающееся действие в контексте.
- source_word: כִּי ... וְכִי
  choice: Если ... потому, что
  rationale: Так передаётся условно-причинная логика речи Давида, при этом допустимое объяснительное понимание частиц отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: אָמַר לוֹ
  choice: сказал ему
  rationale: Русское прошедшее время естественно обозначает предшествующее повеление, которым объясняется нынешнее действие Шимея.
- source_word: וּמִי יֹאמַר
  choice: то кто может спросить
  rationale: '«Может» передаёт риторический смысл: никто не вправе потребовать отчёта, если действие совершено по слову Яхве; «спросить» естественно вводит следующий вопрос.'
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Зачем ты так поступил?
  rationale: Естественная современная русская формулировка вопроса, сохраняющая обращение во втором лице и смысл совершённого действия.
theological_decisions:
- issue: Участие Яхве в проклятиях Шимея
  choice: Слова Давида допускают, что Яхве прямо велел Шимею проклинать Давида.
  alternative: Ослабить высказывание до простого Божьего позволения либо представить прямое повеление как бесспорное утверждение вне условной рамки.
  rationale: 'Еврейский текст говорит, что Яхве сказал ему: «Проклинай Давида», но синтаксис частиц допускает условное и объяснительное прочтение. Перевод сохраняет эту богословскую напряжённость, не отождествляя повеление с нравственным одобрением и не сводя его к одному лишь позволению.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Реплики сформулированы понятно и естественно; сохранены риторический вопрос, повтор корня «проклинать» и неоднозначность условно-объяснительной конструкции.
