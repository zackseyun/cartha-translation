base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: ru
  text: Тем более, когда нечестивые люди убили праведного человека в его собственном доме, на его постели! Неужели теперь я не взыщу с вас за его кровь[a] и не истреблю вас с земли[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потребую его крови из вашей руки» — то есть призову вас к ответу за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о судебном устранении убийц с земли, а не только о ритуальном очищении.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Тем более, когда
  rationale: Оборот продолжает рассуждение от меньшего в ст. 10 к большему; эта формулировка естественно передаёт усиление довода.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: нечестивые люди
  rationale: Передаёт прямую нравственную оценку רְשָׁעִים в достойном современном регистре.
- source_word: הָרְגוּ
  choice: убили
  rationale: Глагол означает «убить»; более узкое «совершили убийство» или «убили преступно» было бы контекстуально верным, но лексически более толковательным.
- source_word: אִישׁ צַדִּיק
  choice: праведного человека
  rationale: Сохраняет обычное значение צַדִּיק и не сводит его без пояснения только к юридической невиновности.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: в его собственном доме, на его постели
  rationale: «Собственном» подчёркивает выраженную притяжательным суффиксом принадлежность и передаёт возмутительные обстоятельства убийства без изменения смысла.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: Неужели теперь я не взыщу с вас за его кровь
  rationale: Передаёт риторический вопрос и юридическую идиому требования ответа за пролитую кровь; русский оборот остаётся понятным и сохраняет образ крови.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: и не истреблю вас с земли
  rationale: В данном судебном контексте בער означает устранение виновных, фактически посредством казни. «Истреблю» сохраняет силу выражения лучше, чем нейтральное «удалю».
theological_decisions:
- issue: Передача юридической идиомы о взыскании крови
  choice: «взыщу с вас за его кровь» в основном тексте
  alternative: «призову вас к ответу за его кровь» или «отомщу вам за его кровь»
  rationale: Выбранный вариант сохраняет ветхозаветный образ крови и юридический характер ответственности, не сводя действие Давида к личной мести.
- issue: Значение устранения «с земли»
  choice: «истреблю вас с земли»
  alternative: «удалю вас с земли» или «очищу землю от вас»
  rationale: Контекст говорит о судебном устранении убийц. Формулировка не превращает выражение лишь в ритуальное очищение и не добавляет к тексту подробностей исполнения приговора.
translation_notes:
  register: Современный литературный русский язык с торжественным судебным оттенком. Риторическая сила еврейского вопроса сохранена; синтаксис слегка расчленён в соответствии с нормами естественной русской речи.
