  text: וַ/יַּ֨עַן דָּוִ֜ד אֶת רֵכָ֣ב וְ/אֶת בַּעֲנָ֣ה אָחִ֗י/ו בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֵֽרֹתִ֖י וַ/יֹּ֣אמֶר לָ/הֶ֑ם חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: ru
  text: 'Но Давид ответил Рехаву и Баане, его брату, сыновьям Риммона, беэротянина, и сказал им: «Жив Господь[a], избавивший меня от всякой беды,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — YHWH; также передаётся как «Яхве».
    reason: Уточнение личного имени Бога и допустимого варианта его передачи.
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в этой повествовательной форме вводит ответ Давида; «ответил» естественно передаёт формулу диалога.
- source_word: רֵכָב
  choice: Рехав
  rationale: Имя передано принятой русской библейской транслитерацией с учётом конечного ב без дагеша.
- source_word: בַּעֲנָה
  choice: Баана
  rationale: Личное имя транслитерировано в форме, привычной для русской библейской традиции.
- source_word: אָחִיו
  choice: его брату
  rationale: Форма единственного числа с суффиксом 3-го лица указывает на Баану как брата Рехава.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: сыновьям Риммона-беэротянина
  rationale: Сочетание называет их отца и обозначает его происхождение; дефис делает определение естественным по-русски.
- source_word: חַי יְהוָה
  choice: Жив Господь
  rationale: Устойчивая формула клятвы передана кратко и торжественно, без ослабления её силы.
- source_word: פָּדָה
  choice: избавивший
  rationale: В данном контексте פדה означает спасительное освобождение от бедствий; «избавивший» естественнее русского буквального «выкупивший» и сохраняет смысл совершённого избавления.
- source_word: נַפְשִׁי
  choice: меня
  rationale: נפש с притяжательным суффиксом здесь обозначает самого Давида, чья жизнь подвергалась опасности; русское «меня» точно и естественно передаёт этот смысл.
- source_word: מִכָּל צָרָה
  choice: от всякой беды
  rationale: צָרָה обозначает беду или тяжёлое положение, а כָּל придаёт выражению всеохватный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь с примечанием о форме YHWH и варианте «Яхве»
  alternative: Яхве в основном тексте
  rationale: «Господь» соответствует укоренившейся русской библейской форме и естественно звучит в формуле клятвы; примечание открыто указывает, что в еврейском тексте стоит личное имя Бога, не устраняя возможную передачу «Яхве».
- issue: Смысл פדה применительно к נפש
  choice: избавивший меня
  alternative: выкупивший мою жизнь
  rationale: Контекст говорит о спасении Давида от всех бед, а не уточняет уплату выкупа; выбранная формулировка сохраняет спасительный смысл, не вводя отсутствующего в стихе механизма выкупа.
translation_notes:
  register: Современный литературный русский язык с торжественной краткостью клятвенной формулы. Синтаксис оставлен открытым, поскольку речь Давида продолжается в следующем стихе; в конце поставлен восклицательный знак как пунктуационное оформление формулы, хотя смысловое продолжение следует далее.
