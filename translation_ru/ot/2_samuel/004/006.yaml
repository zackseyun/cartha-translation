  source_fidelity: В целом переданы вход в дом, оборот о пшенице и место удара. Однако נִמְלָטוּ означает «спаслись/убежали, скрылись от преследования», тогда как «скрылись» может означать лишь укрылись и не вполне передаёт успешное бегство. «В самую глубь» несколько усиливает תּוֹךְ («внутренняя часть, середина»); «в глубь дома» точнее без лишней экспрессии.
  naturalness: Текст литературный и понятный. Прямая формулировка «ударили его в живот» естественнее, чем номинализация «нанесли ему удар», а «спаслись бегством» ясно передаёт исход их ухода.
  terminology: Имена «Рехав» и «Баана» приемлемы и последовательно передают еврейские формы. «Живот» — корректный современный эквивалент הַחֹמֶשׁ; примечание надлежащим образом сохраняет традиционный вариант без утверждения спорной этимологии как бесспорной.
