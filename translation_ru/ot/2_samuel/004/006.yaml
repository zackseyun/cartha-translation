    text: 'Или, в традиционной передаче: «под пятое ребро». Еврейское выражение, вероятнее всего, обозначает область живота или брюшной полости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: И вот
  rationale: Сочетание вводит очередное действие и привлекает к нему внимание; «И вот» естественно передаёт повествовательный указательный оттенок без архаизации.
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: они вошли в самую глубь дома
  rationale: Глагол обозначает приход или вход, а עַד תּוֹךְ — продвижение внутрь, до внутренней части. «В самую глубь дома» передаёт проникновение далеко внутрь естественным русским выражением.
- source_word: לֹקְחֵי חִטִּים
  choice: забирая пшеницу
  rationale: Причастный оборот буквально описывает их как берущих пшеницу. Перевод сохраняет эллиптичность еврейского текста и не делает явно выраженными ни цель, ни притворство, хотя контекст может подразумевать предлог для входа.
- source_word: וַיַּכֻּהוּ
  choice: нанесли ему удар
  rationale: נכה означает «ударить, поразить». Формулировка передаёт сам акт удара, не подменяя его более определённым «убили».
- source_word: אֶל הַחֹמֶשׁ
  choice: в живот
  rationale: Слово обозначает область живота или брюшной полости; традиционное понимание «под пятое ребро» менее вероятно и вынесено в примечание.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: Затем Рехав и его брат Баана
  rationale: Союз передан как указание на последовательность событий. Порядок слов сделан естественным для русского языка при сохранении родства персонажей.
- source_word: נִמְלָטוּ
  choice: скрылись
  rationale: Форма глагола מלט означает успешное бегство или спасение; «скрылись» естественно описывает их уход после нападения.
