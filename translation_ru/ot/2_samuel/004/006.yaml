base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: ru
  text: И вот, они вошли в глубь дома, забирая пшеницу, и ударили его в живот[a]. Затем Рехав и его брат Баана спаслись бегством.
  philosophy: optimal-equivalence
  footnotes:
