base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: ru
  text: Они вошли в дом, когда он лежал на своей постели в спальне[a], поразили его и умертвили. Затем они отделили ему голову[c], взяли его голову и всю ночь шли по дороге через Араву[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в комнате, где он спал».'
    reason: lexical_alternative
  - marker: b
    text: Арава — географическое название рифтовой долины (равнины); здесь оно употреблено как топоним.
    reason: cultural_note
  - marker: c
    text: 'Или: «отсекли ему голову»; еврейский глагол буквально означает «удалили, отделили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: они вошли в дом
  rationale: Глагол בוא с направительным הַבַּיִת обозначает вход в дом; «вошли» естественно и точно передаёт движение.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: когда он лежал на своей постели
  rationale: Оборот имеет обстоятельственное значение и описывает его состояние в момент их прихода. «Когда» естественно передаёт временную связь.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: в спальне
  rationale: Буквально это комната, предназначенная для сна; «спальня» — ясный современный эквивалент без архаической тяжеловесности.
- source_word: וַיַּכֻּהוּ
  choice: поразили его
  rationale: נכה обозначает нанесение удара или поражение. Формулировка не сливает этот глагол со следующим явным указанием на умерщвление.
- source_word: וַיְמִתֻהוּ
  choice: умертвили
  rationale: Каузативная форма מות означает причинить смерть. «Умертвили» сохраняет эту силу и последовательность двух действий.
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: отделили его голову
  rationale: Каузатив סור буквально выражает удаление или отделение. Контекст подразумевает обезглавливание, но основной текст сохраняет более широкую лексику источника; явный вариант дан в примечании.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: взяли её
  rationale: לקח — обычный глагол «взять». Русское местоимение устраняет тяжёлый повтор, сохраняя отдельность второго действия.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: шли дорогой через Араву
  rationale: Фраза означает движение путём, проходящим через географическую область Арава. Формулировка сохраняет и путь, и название местности.
- source_word: כָּל הַלָּיְלָה
  choice: всю ночь
  rationale: Естественный современный русский эквивалент временного выражения.
