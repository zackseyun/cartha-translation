base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: ru
  text: 'Когда некто сообщил мне: «Вот, Саул мёртв», — и сам считал, что принёс добрую весть[a], — я схватил его и убил в Циклаге. Такую награду[b] я дал ему за эту весть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и он был в собственных глазах словно тот, кто принёс добрую весть».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская концовка эллиптична и звучит иронически: вестник ожидал вознаграждения, но «наградой» за сообщение о смерти Саула стала его собственная казнь.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пример, подтверждающий слова Давида в контексте; «ведь» естественно передаёт пояснительно-обосновывающую связь, не сводя её лишь ко времени.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: того, кто сообщил мне
  rationale: Субстантивированное причастие означает «тот, кто сообщил». Русская конструкция сохраняет определённость и естественно вводит прямую речь; отдельное «говоря» здесь избыточно.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: «Вот, Саул мёртв»
  rationale: «Вот» передаёт функцию הִנֵּה как слова, привлекающего внимание, а «мёртв» — результативно-состоянийный смысл מֵת.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: считая себя вестником доброй вести
  rationale: Оборот בְּעֵינָיו выражает собственную оценку человека, а כִמְבַשֵּׂר — представление о себе как о приносящем благую, желанную весть. Формулировка сохраняет субъективность этой оценки.
- source_word: וָאֹחֲזָה בוֹ
  choice: я схватил
  rationale: Глагол אָחַז обозначает крепко взять, схватить; выбранный русский глагол краток и передаёт силу действия.
- source_word: וָאֶהְרְגֵהוּ
  choice: и убил
  rationale: Прямой эквивалент глагола «убить», без добавления не выраженной явно судебной терминологии.
- source_word: בְּצִקְלָג
  choice: в Циклаге
  rationale: Принятая русская форма библейского географического названия с нормативным склонением.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: Такую награду я дал ему за его весть
  rationale: Эллиптическая концовка иронически называет казнь «наградой» за принесённое известие. Отдельное предложение делает смысл понятным, не устраняя иронии.
