  terminology: Имя «Мемфивосфей» соответствует устойчивой русской библейской передаче. «Кормилица» приемлемо для אֹמַנְתּוֹ. Буквальное значение נְכֵה רַגְלָיִם следует сохранить в сноске, не создавая впечатления медицинского диагноза.
