  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: ru
  text: У Ионафана, сына Саула, был сын, хромой на обе ноги.[a] Ему было пять лет, когда из Изрееля пришла весть о Сауле и Ионафане. Его кормилица взяла его на руки и бросилась бежать. Когда она поспешно убегала, он упал и стал хромым. Его звали Мемфивосфей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поражённый в ноги».'
    reason: Сноска сохраняет буквальный образ еврейского выражения נְכֵה רַגְלָיִם; «обе» в основном тексте отражает двойственное число слова «ноги».
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: с повреждёнными ногами
  rationale: Передаёт физическое нарушение нейтральным современным языком. Двойственное число רַגְלָיִם относится к ногам, однако отдельного слова «обе» в еврейском тексте нет; более буквальный вариант приведён в сноске.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: ему было пять лет
  rationale: Естественный русский способ точно обозначить возраст.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן מִיִּזְרְעֶאל
  choice: когда из Изрееля пришла весть о Сауле и Ионафане
  rationale: Сохраняет источник вести и не уточняет сверх текста её содержание, хотя из контекста речь идёт об их гибели.
- source_word: אֹמַנְתּוֹ
  choice: его кормилица
  rationale: Традиционное и понятное в историческом повествовании обозначение женщины, которая растила ребёнка и заботилась о нём.
- source_word: וַתִּשָּׂאֵהוּ
  choice: взяла его на руки
  rationale: Естественно передаёт поднятие и несение пятилетнего ребёнка перед бегством.
- source_word: וַתָּנֹס
  choice: побежала
  rationale: В данном контексте передаёт срочное бегство; последующая фраза прямо называет её действие бегством.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: в спешке, когда она убегала
  rationale: Сохраняет обстоятельство поспешности и повторное указание на бегство, не делая фразу тяжеловесной.
- source_word: וַיִּפֹּל
  choice: он упал
  rationale: Мужской род глагола показывает, что субъект — ребёнок, а не кормилица.
- source_word: וַיִּפָּסֵחַ
  choice: стал хромым
  rationale: Передаёт наступившее вследствие падения состояние и результативно-инхоативный смысл формы.
- source_word: מְפִיבֹשֶׁת
  choice: Мемфивосфей
  rationale: Устоявшаяся русская библейская форма имени, узнаваемая читателями.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Избегаются как уничижительные обозначения инвалидности, так и чрезмерно медицинская терминология. Начальное וְ передано без искусственного вводного «теперь»; простая повествовательная связь ясна из контекста.
