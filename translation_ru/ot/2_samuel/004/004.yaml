revisions:
- from: У Ионафана, сына Саула, был сын с повреждёнными ногами.[a] Ему было пять лет, когда из Изрееля пришла весть о Сауле и Ионафане. Его кормилица взяла его на руки и побежала. Но в спешке, когда она убегала, он упал и стал хромым. Его звали Мемфивосфей.
  to: У Ионафана, сына Саула, был сын, хромой на обе ноги.[a] Ему было пять лет, когда из Изрееля пришла весть о Сауле и Ионафане. Его кормилица взяла его на руки и бросилась бежать. Когда она поспешно убегала, он упал и стал хромым. Его звали Мемфивосфей.
  rationale: 'Уточнено описание состояния мальчика, чтобы передать значение еврейского выражения как хромоты/поражения обеих ног, а не как неопределённого повреждения. Глагол бегства усилен до «бросилась бежать». Остальные элементы сохранены: источник вести, отсутствие уточнения её содержания, субъект падения и результативное «стал хромым».'
