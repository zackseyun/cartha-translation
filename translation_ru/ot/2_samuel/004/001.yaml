  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: ru
  text: Когда сын Саула услышал, что Авенир умер в Хевроне, у него опустились руки[a], и весь Израиль пришёл в смятение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «руки его ослабели» — еврейский оборот, означающий утрату сил или мужества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: сын Саула
  rationale: Сохранено косвенное обозначение Иевосфея из еврейского текста без добавления отсутствующего здесь имени.
- source_word: כִּי מֵת אַבְנֵר
  choice: что Авенир умер
  rationale: כִּי вводит содержание услышанного, а перфект מֵת обозначает уже совершившуюся смерть; в русском это естественно передаётся прошедшим временем.
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Обычное локативное значение предлога בְּ при названии места.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: у него опустились руки
  rationale: Естественный русский фразеологизм сохраняет телесный образ еврейского выражения и передаёт утрату сил и решимости.
- source_word: כָל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное национальное обозначение исходного текста.
- source_word: נִבְהָלוּ
  choice: пришёл в смятение
  rationale: Передаёт состояние тревоги, растерянности и потрясения, выраженное глаголом בהל, и естественно сочетается с собирательным подлежащим.
