base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: ru
  text: Давид приказал молодым людям, и те убили их, отсекли им руки и ноги и повесили у пруда[a] в Хевроне. А голову Иевосфея они взяли и похоронили в гробнице Авенира в Хевроне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повесили над прудом». Еврейский предлог может обозначать как близость к месту, так и положение над ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: И приказал Давид слугам
  rationale: Нарративное וַ передано союзом «и». נְעָרִים может означать молодых людей, слуг или приближённых; в данном контексте речь об исполнителях приказа Давида, поэтому «слугам» естественно и контекстуально точно.
- source_word: וַיַּהַרְגוּם
  choice: и они убили их
  rationale: Прямо передаёт обычное значение הרג, не добавляя отсутствующего в тексте судебного толкования «казнили».
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: отсекли им руки и ноги
  rationale: קצץ означает отсекать или отрубать. Русская конструкция с дательным принадлежности звучит естественно и сохраняет буквальный, суровый характер описания.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: повесили у пруда
  rationale: תלה передано как «повесили»; עַל здесь, вероятно, указывает на место возле пруда, однако допускает и более пространственное понимание, что отражено в примечании.
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Обычная и естественная русская форма обозначения местонахождения.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: голову Иевосфея
  rationale: Конструктивная цепочка передана прямо; использована укоренившаяся русская библейская форма имени.
- source_word: לָקָחוּ
  choice: взяли
  rationale: Сохраняет простое и широкое значение לקח без ненужного уточнения.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: похоронили в гробнице Авенира
  rationale: Подразумеваемое дополнение — голова Иевосфея. «Гробница» естественно обозначает названное место погребения и сохраняет достоинство изложения.
theological_decisions:
- issue: Нравственная и богословская оценка поступка Давида
  choice: Передать повествовательное сообщение без добавочной оценки
  alternative: Использовать явно судебную лексику, например «казнили»
  rationale: Стих описывает приказ Давида, убийство, отсечение конечностей и публичное выставление тел, но в самом стихе не даёт прямой богословской оценки. Перевод сохраняет суровость и напряжение рассказа, не привнося оправдания или осуждения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность еврейского рассказа, но остаётся понятным обычному читателю; жестокие детали не смягчены и не усилены.
