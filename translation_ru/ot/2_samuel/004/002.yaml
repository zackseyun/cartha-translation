source:
  edition: WLC
  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: ru
  text: 'У сына Саула были два предводителя отрядов: одного звали Баана, а второго — Рехав. Они были сыновьями Риммона из Беэрота, из потомков Вениамина, ведь Беэрот тоже причислялся к Вениамину[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считался принадлежащим Вениамину».'
    reason: Сочетание תֵּחָשֵׁב עַל может обозначать, что город считали относящимся или принадлежащим колену Вениамина.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים שָׂרֵי גְדוּדִים
  choice: два предводителя отрядов
  rationale: Слово שָׂרֵי обозначает начальников или предводителей, а גְדוּדִים — военные либо набеговые отряды. Краткое «предводителя отрядов» естественно по-русски и не представляет их непременно командирами регулярной армии.
- source_word: בֶן שָׁאוּל
  choice: у сына Саула
  rationale: Фраза указывает на упомянутого в предыдущем стихе сына Саула. Русская конструкция с «у» естественно передаёт отношение обладания в предложении.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: одного звали ... а второго —
  rationale: Передаёт повторную еврейскую формулу называния точно, но без неестественного для современного русского буквального оборота «имя одного».
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי
  choice: сыновьями Риммона из Беэрота
  rationale: Гентилий הַבְּאֶרֹתִי обозначает человека из Беэрота; описательный русский оборот прозрачен и не требует малоупотребительного этнохоронима.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: из потомков Вениамина
  rationale: Еврейская родовая формула «из сынов Вениамина» здесь означает принадлежность к колену; «из потомков» ясно сохраняет идею происхождения.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: причислялся к Вениамину
  rationale: Страдательная форма חשׁב выражает учёт или признание принадлежности, а עַל в данном сочетании указывает на отнесение Беэрота к Вениамину. Формулировка сохраняет некоторую неопределённость между племенной и территориальной принадлежностью.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной прозы. Имена переданы непосредственно с древнееврейского: Баана, Рехав, Риммон, Беэрот. Начальный ו не развёрнут в отдельное «теперь» или «и», поскольку здесь он служит связью повествования и не требует самостоятельного русского маркера.'
