  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: ru
  text: 'Они принесли голову Иш-Бошета к Давиду в Хеврон и сказали царю: «Вот голова Иш-Бошета, сына Саула, твоего врага, который покушался на твою жизнь. Сегодня Яхве даровал господину моему, царю, возмездие[a] над Саулом и его потомством».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возмездия» (множественное число); форма может иметь усилительное или собирательное значение — «возмездие» либо «дела возмездия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Они принесли
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; начальный союз в русском не требуется для естественного течения рассказа.
- source_word: רֹאשׁ
  choice: голову
  rationale: В данном контексте имеется в виду физическая голова убитого; метафорическое прочтение неуместно.
- source_word: אִישׁ בֹּשֶׁת
  choice: Иш-Бошет
  rationale: Передана масоретская форма имени, стоящая в этом стихе; исторически родственная форма «Эшбаал» здесь не засвидетельствована.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Устоявшаяся русская передача географического названия.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно передаёт указательно-предъявительную функцию частицы без архаизации.
- source_word: אֹיִבְךָ
  choice: твоего врага
  rationale: Прямой эквивалент существительного «враг»; расположение приложения после имени Саула сохраняет синтаксическую связь исходного текста.
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: покушался на твою жизнь
  rationale: Современная русская идиома ясно передаёт намерение лишить человека жизни, выраженное еврейским оборотом с נֶפֶשׁ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, а не заменяет его титулом.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: господину моему, царю
  rationale: Сохранены придворное обращение, суффикс первого лица и приложение «царь»; строчная буква отличает человеческий титул от Божьего имени.
- source_word: נְקָמוֹת
  choice: возмездие
  rationale: Контекстуально естественное русское единственное число передаёт интенсивное или собирательное значение еврейской формы множественного числа; формальная особенность отмечена в сноске.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: над Саулом и его потомством
  rationale: Предлог «над» ясно обозначает тех, на кого направлено возмездие; זֶרַע в династическом контексте передано как «потомство».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет эту функцию.
- issue: Оценка утверждения убийц о Божьем возмездии
  choice: Сохранить утверждение без авторского уточнения
  alternative: Добавить указание, что это лишь их собственное или ложное истолкование
  rationale: Слова о действии Яхве принадлежат персонажам в прямой речи. Сам перевод не должен заранее подтверждать или опровергать их богословскую оценку; повествовательную оценку даёт последующий ответ Давида.
- issue: К кому относится выражение «твой враг, который покушался на твою жизнь»
  choice: Сохранить связь с Саулом
  alternative: Отнести определение к Иш-Бошету
  rationale: Порядок слов и ближайший референт в еврейском тексте, а также повествовательный контекст указывают на Саула; русское приложение после имени сохраняет эту связь без расширительного пояснения.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования, без архаизмов вроде «се» и без разговорной сниженности. Прямая речь сохраняет придворную формулу обращения и не добавляет оценки словам убийц.
