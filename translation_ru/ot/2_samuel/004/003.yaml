  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: ru
  text: Жители же Беэрота бежали в Гиттаим и живут там как пришельцы до сего дня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живут там как чужеземные поселенцы до сего дня».'
    reason: Слово גָּרִים может подчёркивать как проживание вне родной земли, так и социальное положение чужеземца среди местных жителей.
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: бежали
  rationale: Форма Qal wayyiqtol от ברח передаёт завершённое бегство; простое прошедшее время соответствует еврейской повествовательной последовательности и не требует добавлять предпрошедшее значение.
- source_word: הַבְּאֵרֹתִים
  choice: жители Беэрота
  rationale: Еврейское обозначение жителей города естественнее всего передаётся по-русски описательным сочетанием, без искусственного этнонима.
- source_word: גִּתָּיְמָה
  choice: в Гиттаим
  rationale: Направительный суффикс -ה указывает на движение к месту; русский предлог «в» естественно выражает прибытие в город.
- source_word: וַיִּהְיוּ שָׁם
  choice: и живут там
  rationale: В сочетании с «до сего дня» глагольная форма описывает состояние, продолжающееся от прошлого до времени рассказчика; русское настоящее время передаёт эту длительность естественно.
- source_word: גָּרִים
  choice: как пришельцы
  rationale: גור обозначает проживание вне родного сообщества в положении неполноправного или чужого жителя. «Пришельцы» сохраняет социальный оттенок слова, не сводя его лишь к кратковременному пребыванию.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и ясное русское соответствие формуле, указывающей на продолжение положения до времени рассказчика.
- source_word: וַ
  choice: же
  rationale: Постпозитивная частица «же» естественно вводит пояснительно-контрастное замечание о жителях Беэрота в связи с предшествующим контекстом.
