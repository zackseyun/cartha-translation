  terminology: «Пришельцы» сохраняет важный смысл проживания вне собственного местного сообщества и не навязывает более узкое современное юридическое значение. Сноска корректно предлагает «чужеземные поселенцы» как разъясняющую альтернативу. Топонимы «Беэрот» и «Гиттаим» переданы последовательно.
