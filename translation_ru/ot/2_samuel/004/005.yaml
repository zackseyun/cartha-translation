base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: ru
  text: Сыновья Риммона, беэротянина, Рехав и Баана отправились и в самый зной пришли к дому Иш-Бошета, когда тот лежал, отдыхая в полдень.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лежание полудня», то есть полуденный отдых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: сыновья Риммона-беэротянина
  rationale: בְּנֵי буквально означает «сыновья»; последующее называние Рехава и Бааны поддерживает прямой родственный смысл. Нисба הַבְּאֵרֹתִי естественно передана как «беэротянин».
- source_word: רֵכָב וּבַעֲנָה
  choice: Рехав и Баана
  rationale: Имена переданы по еврейскому звучанию и в формах, естественных для русской библейской ономастики.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: отправились в путь и ... пришли
  rationale: Сохранены оба последовательных глагола движения, но по-русски избегнуто неестественное сочетание «пошли и пришли».
- source_word: כְּחֹם הַיּוֹם
  choice: в самый зной
  rationale: Выражение указывает на жаркую часть дня; перевод передаёт образ и не сводит его строго к точному часу.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: дом Иевосфея
  rationale: Конструкция означает дом, принадлежащий Иш-Бошету. Использована укоренившаяся русская библейская форма имени «Иевосфей».
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: Он в это время лежал, отдыхая в полдень
  rationale: Передано обстоятельственное состояние героя при прибытии братьев. Необычная внутренняя конструкция «лежал лежание полудня» естественно выражена как полуденный отдых, без разговорного «дремал».
