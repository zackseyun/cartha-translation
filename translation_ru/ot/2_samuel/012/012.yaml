  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: ru
  text: Ведь ты сделал это тайно, а Я сделаю это перед всем Израилем, при свете солнца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание объявленного в предыдущем стихе суда; «ведь» естественно передаёт пояснительную связь.
- source_word: עָשִׂיתָ
  choice: ты сделал это
  rationale: Глагол отсылает к проступку Давида, не называя его вновь; местоимение «это» сохраняет эллиптичность еврейского текста.
- source_word: בַסָּתֶר
  choice: тайно
  rationale: Передаёт действие, совершённое скрытно, и ясно противопоставляется последующей публичности.
- source_word: וַאֲנִי
  choice: а Я
  rationale: В контексте союз выражает контраст между тайным поступком Давида и открытым действием Бога.
- source_word: אֶעֱשֶׂה
  choice: сделаю
  rationale: Сохраняет прямое первое лицо и будущую направленность пророческого объявления.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: это
  rationale: В современном русском местоименное «это» естественно отсылает к только что объявленному действию суда; буквальное «это дело» звучало бы тяжеловесно.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: перед всем Израилем
  rationale: Точно передаёт публичность действия и присутствие всего Израиля как свидетеля.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: при свете солнца
  rationale: Сохраняет образ солнца и естественно выражает смысл открытого действия среди бела дня.
theological_decisions:
- issue: Действующее лицо объявленного суда
  choice: 'Сохранено прямое божественное действие: «Я сделаю»'
  alternative: «Я сделаю так, что это произойдёт»
  rationale: Еврейский текст употребляет прямую форму первого лица; перевод не смягчает и не преобразует её в косвенную причинность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая речь. Прописная «Я» маркирует речь Бога согласно устойчивой русской библейской традиции.
