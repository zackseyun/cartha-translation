source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: ru
  text: Он снял с головы их царя венец[a]. Венец весил один талант золота[b], и в нём был драгоценный камень; венец оказался на голове Давида. Из города он вывез чрезвычайно много добычи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «венец Милкома» (также: «Малкама»), если понимать מַלְכָּם как имя аммонитского божества, а не как «их царя».'
    reason: alternative_reading
  - marker: b
    text: Талант — очень крупная древняя мера веса, которую часто оценивают примерно в 34 килограмма, хотя в древности её точная величина различалась.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Обозначает царский венец или корону; «венец» естественно звучит в русском историко-библейском повествовании.
- source_word: מַלְכָּם
  choice: их царя
  rationale: Согласно данной масоретской огласовке и морфологии, это существительное «царь» с суффиксом 3-го лица множественного числа. Возможное прочтение как имени божества сохранено в примечании.
- source_word: מֵעַל רֹאשׁוֹ
  choice: с головы
  rationale: Естественно передаёт исходное значение удаления с поверхности, выраженное сочетанием предлогов מִן и עַל.
- source_word: כִּכַּר זָהָב
  choice: один талант золота
  rationale: כִּכָּר — крупная древняя мера веса; традиционный и точный русский эквивалент — «талант».
- source_word: וְאֶבֶן יְקָרָה
  choice: и в нём был драгоценный камень
  rationale: Еврейская фраза предельно сжата — буквально «и драгоценный камень». Добавление «в нём был» ясно связывает камень с венцом, не уточняя способ его крепления.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: затем венец возложили на голову Давида
  rationale: Передаёт наступившее событие, а не только статическое положение; повтор существительного устраняет неясность рода русского местоимения.
- source_word: וּשְׁלַל הָעִיר הוֹצִיא
  choice: из города он вывез добычу
  rationale: Глагол в породе hifil означает «вывести/вынести наружу»; применительно к военной добыче «вывез» звучит естественно и сохраняет направленность действия.
- source_word: הַרְבֵּה מְאֹד
  choice: чрезвычайно много
  rationale: Естественно передаёт усиленное указание на огромное количество.
theological_decisions:
- issue: Следует ли понимать מַלְכָּם как «их царь» или как имя аммонитского божества Милкома (Малкама)
  choice: их царя
  alternative: 'Милкома (также: Малкама)'
  rationale: Масоретская огласовка и предоставленный морфологический разбор поддерживают значение «их царь», а упоминание головы естественно относится к царю. Поскольку прочтение как имени божества лексически возможно и засвидетельствовано в традиции перевода, оно не исключено, а вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; подлинная неоднозначность מַלְכָּם сохранена в примечании. Слово «венец» повторено во втором предложении, чтобы избежать двусмысленного местоимения после существительных разных родов.
