    rationale: Глагол וַיֵּאָנַשׁ может нести оттенок тяжёлой болезни, но в данном стихе безопаснее передать основной смысл «заболел»; выраженное усиление («очень тяжело») появляется в 2 Царств 12:16. Сноска может отметить возможный оттенок, не превращая его в основной текст.
  - severity: low
    issue: Сноска сформулирована как менее точная альтернатива к основному тексту
    rationale: 'При основном варианте «тот тяжело заболел» примечание «Или: “и он заболел”» фактически лишь меняет местоимение и ослабляет основной перевод. После нейтрального основного варианта сноска может содержательно отразить возможный лексический оттенок.'
