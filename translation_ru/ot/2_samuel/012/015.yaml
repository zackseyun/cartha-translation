  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: ru
  text: Затем Нафан пошёл к себе домой, и Яхве поразил ребёнка, которого жена Урии родила Давиду, и он заболел.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также смысл: «тяжело заболел»; еврейский глагол может подразумевать серьёзную болезнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ נָתָן אֶל בֵּיתוֹ
  choice: Затем Нафан пошёл к себе домой
  rationale: Последовательная форма с וַ передвигает повествование вперёд; «затем» естественно передаёт ход событий. «К себе домой» по-русски естественно выражает буквальное «в свой дом».
- source_word: וַיִּגֹּף
  choice: поразил
  rationale: Глагол נָגַף обозначает нанесение поражающего удара или бедствия. «Поразил» сохраняет прямое действие и не уточняет природу недуга сверх сказанного далее.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму и функцию Божьего имени, не заменяя его титулом.
- source_word: הַיֶּלֶד
  choice: ребёнка
  rationale: В данном контексте речь идёт о маленьком ребёнке; это точный и естественный русский эквивалент.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: которого жена Урии родила Давиду
  rationale: Сохранено намеренное обозначение женщины как «жены Урии», а не по имени; дательный «Давиду» передаёт לְדָוִד без избыточного истолкования.
- source_word: וַיֵּאָנַשׁ
  choice: и тот тяжело заболел
  rationale: Глагол указывает на тяжёлую болезнь; местоимение «тот» однозначно возвращает читателя к ребёнку и избегает неестественного повторения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога, поэтому оно сохраняется, а не заменяется титулом.
- issue: Непосредственная божественная причинность болезни ребёнка
  choice: Яхве поразил ребёнка
  alternative: Яхве допустил, чтобы ребёнок заболел
  rationale: Еврейский текст прямо приписывает действие Яхве; перевод не смягчает и не переосмысляет эту причинность.
- issue: Обозначение матери ребёнка
  choice: жена Урии
  alternative: Вирсавия
  rationale: Повествование здесь намеренно не называет её по имени. Такая формулировка сохраняет нравственное и повествовательное напряжение исходника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямое «поразил» сохраняет суровость исходного текста; конструкция «тот тяжело заболел» ясна обычному читателю. Маркер сноски поставлен после соответствующего утверждения.
