base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: ru
  text: 'Тогда Давид сильно разгневался на этого человека и сказал Нафану: «Жив Яхве! Человек, сделавший это, — сын смерти[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын смерти», то есть человек, заслуживающий смерти или достойный смерти.'
    reason: Пояснение древнееврейской идиомы בֶן מָוֶת.
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד ... מְאֹד
  choice: Давид сильно разгневался
  rationale: Еврейская идиома буквально изображает разгорающийся гнев, а מְאֹד прямо усиливает его. «Сильно разгневался» естественно и полно передаёт оба элемента на современном русском языке.
- source_word: בָּאִישׁ
  choice: на этого человека
  rationale: Предлог обозначает объект гнева, а указательное «этого» ясно отсылает к человеку из рассказа Нафана.
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Сохраняется краткая и торжественная древнееврейская формула клятвы, естественная для библейского регистра русского языка.
- source_word: בֶן מָוֶת
  choice: сын смерти
  rationale: Буквально сохранена выразительная древнееврейская идиома; её смысл — человек, заслуживающий смерти, — разъяснён в сноске.
- source_word: הָאִישׁ הָעֹשֶׂה זֹאת
  choice: Человек, сделавший это
  rationale: Причастная конструкция передана ясным русским оборотом, определяющим виновного по его поступку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Буквальная или смысловая передача בֶן מָוֶת
  choice: сын смерти
  alternative: заслуживает смерти; достоин смерти
  rationale: Основной текст сохраняет образность и судебную силу еврейской идиомы, а сноска предотвращает её ошибочное буквальное понимание.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским оттенком в формуле клятвы. Синтаксис сделан естественным для обычного читателя; образная идиома «сын смерти» сохранена ради близости к оригиналу и снабжена пояснением.
