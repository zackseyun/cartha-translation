base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: ru
  text: После этого Давид утешил[a] свою жену Вирсавию, вошёл к ней и лёг с ней[b]. Она родила сына, и он назвал его Соломоном. Яхве любил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободрил», «утешил после горя».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «вошёл к ней и лёг с ней» означает, что Давид вступил с ней в половую близость.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: утешил
  rationale: Порода пиэль глагола נחם здесь означает утешение после горя — смерти ребёнка; «утешил» естественно и точно передаёт смысл.
- source_word: בַּת שֶׁבַע
  choice: Вирсавию
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: אִשְׁתּוֹ
  choice: свою жену
  rationale: Определение сохранено, поскольку еврейский текст прямо называет Вирсавию женой Давида, что значимо для повествования.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: вошёл к ней и лёг с ней
  rationale: Сохранены оба координированных выражения и сдержанный повествовательный регистр оригинала; сочетание является эвфемистическим обозначением половой близости.
- source_word: וַתֵּלֶד בֵּן
  choice: Она родила сына
  rationale: Прямой и естественный русский эквивалент еврейского выражения.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: он назвал его Соломоном
  rationale: Форма глагола имеет мужской род и в контексте естественно указывает на Давида; русский оборот передаёт идиому «назвал его имя» без буквализма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲהֵבוֹ
  choice: полюбил его
  rationale: Глагол אהב прямо означает любовь, а местоименный суффикс относится к новорождённому сыну.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» передаёт его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены лаконичность, последовательность действий и эвфемистическая форма оригинала; архаизмы не используются.
