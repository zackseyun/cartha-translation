base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: ru
  text: 'Тогда слуги сказали ему: «Что это ты сделал? Пока ребёнок был жив, ты постился и плакал, а когда ребёнок умер, ты встал и поел[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «встал и ел хлеб»; выражение «есть хлеб» означает принимать пищу.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: Тогда слуги сказали ему
  rationale: Последовательная форма глагола продолжает повествование; «тогда» естественно передаёт развитие событий. В обстановке царского двора עֲבָדָיו уместно передать как «слуги».
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Что это ты сделал?
  rationale: Естественный современный русский вопрос сохраняет удивление слуг и не превращает вопрос в более истолковывающее «зачем».
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Пока ребёнок был жив
  rationale: В данном противопоставлении оборот выражает обстоятельство времени, связанное с ребёнком; «ребёнок» соответствует контексту младенца.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: ты постился и плакал
  rationale: Прямой перевод, сохраняющий параллельность двух действий и торжественный повествовательный регистр.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: а когда ребёнок умер
  rationale: Союз «а» ясно передаёт контраст с поведением Давида при жизни ребёнка, а «умер» сохраняет динамический характер еврейского глагола.
- source_word: קַמְתָּ
  choice: ты встал
  rationale: Краткий и естественный эквивалент קום в данном контексте.
- source_word: וַתֹּאכַל לָחֶם
  choice: и поел
  rationale: Еврейское «есть хлеб» здесь является обычной идиомой принятия пищи; «поел» естественно передаёт смысл на современном русском, а буквальная образность отмечена в сноске.
theological_decisions: []
