base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: ru
  text: 'Тогда Иоав послал к Давиду вестников и сказал: «Я сражался против Раввы и также захватил город вод[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водный город»; вероятно, имеется в виду часть Раввы, контролировавшая её водоснабжение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Тогда … послал
  rationale: Последовательная форма с וַ־ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном контексте речь идёт о людях, посланных передать военный доклад, а не об ангелах.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: Я сражался против Раввы
  rationale: Глагол обозначает участие в бою, а предлог בְ при названии осаждаемого города здесь естественно передаётся как «против».
- source_word: רַבָּה
  choice: Раввы
  rationale: Использована укоренившаяся в русской библейской традиции форма названия города; уточнение «аммонитян» в самом стихе отсутствует.
- source_word: גַּם
  choice: и
  rationale: В русском сочетание «сражался … и захватил» естественно выражает добавочное значение גַּם без стилистически тяжеловесного «также».
- source_word: לָכַדְתִּי
  choice: захватил
  rationale: Военный контекст требует значения овладения частью города или укреплённым объектом.
- source_word: עִיר הַמָּיִם
  choice: город вод
  rationale: Буквально передаёт необычное еврейское сочетание и не устраняет его смысловую неоднозначность; вероятное конкретное значение вынесено в примечание.
