base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: ru
  text: 'И сказал Нафан Давиду: «Ты — тот человек![a] Так говорит Яхве, Бог Израиля: Я помазал тебя царём над Израилем и Я избавил тебя от руки Саула».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты — этот человек!» Еврейский текст буквально: «Ты — человек с определённым артиклем»; по контексту речь идёт о человеке из притчи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой глагола продолжает повествование; обычная русская библейская повествовательная связь «И сказал» точно передаёт последовательность и звучит естественно.
- source_word: אַתָּה הָאִישׁ
  choice: Ты — тот самый человек!
  rationale: Безглагольная именная фраза резко и выразительно раскрывает смысл притчи. В русском «тот самый человек» естественно указывает на только что описанного виновника; при этом буквальная форма отмечена в сноске.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческой речи; сохраняет торжественный регистр без архаизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции и заветного наименования.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: Я ... и Я
  rationale: Повтор независимого местоимения в исходном тексте подчёркивает действия Яхве; повтор «Я» сохраняет этот акцент.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: помазал тебя царём
  rationale: Глагол обозначает помазание на царское служение, а творительный падеж естественно передаёт назначение на должность.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог указывает на царскую власть над народом.
- source_word: הִצַּלְתִּיךָ
  choice: избавил тебя
  rationale: Глагол означает выведение из опасности или из-под чужой власти; «избавил» сохраняет смысл без ненужного догматического уточнения.
- source_word: מִיַּד שָׁאוּל
  choice: от руки Саула
  rationale: Сохранён ясный в русском языке семитский образ руки как власти и силы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Повтор אָנֹכִי в Божьей речи
  choice: Я ... и Я
  alternative: Я ... и затем опустить второе местоимение
  rationale: Повтор в еврейском тексте усиливает противопоставление Божьих благодеяний поступку Давида; русский повтор сохраняет этот риторический акцент, не добавляя нового смысла.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы и умеренно библейской образности. Реплика Нафана передана резко и кульминационно; архаичные формы не используются.
