source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: ru
  text: 'И послал Яхве Нафана к Давиду. Нафан пришёл к нему и сказал: «В одном городе были[a] два человека: один — богатый, другой — бедный».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жили». Буквально в еврейском тексте: «были».'
    reason: 'Лексическая альтернатива: по контексту היה можно естественно передать как «жили», однако основной текст сохраняет более буквальное бытийное значение.'
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; «послал» прямо передаёт значение שׁלח, а начальное «и» сохраняет связь с предшествующим рассказом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֶת נָתָן
  choice: Нафана
  rationale: Имя передано в закрепившейся русской библейской форме; показатель прямого дополнения отдельно не переводится.
- source_word: אֶל דָּוִד
  choice: к Давиду
  rationale: Предлог אֶל здесь обозначает адресата и направление посланничества; перевод «против Давида» преждевременно усилил бы обвинительный оттенок.
- source_word: וַיָּבֹא אֵלָיו
  choice: Нафан пришёл к нему
  rationale: Глагол בוא с אֶל естественно передаётся как «прийти к». Имя повторено вместо местоимения, чтобы в русском тексте не возникло сомнения, кто пришёл.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал
  rationale: Русское «сказал» после «пришёл к нему» естественно выражает обращение к Давиду; повтор «ему» был бы избыточен, хотя в еврейском адресат указан явно.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: два человека
  rationale: Нейтральное и естественное обозначение двух мужчин в вводной части притчи.
- source_word: הָיוּ
  choice: были
  rationale: Сохранено прямое бытийное значение היה без добавления смыслового оттенка проживания.
- source_word: בְּעִיר אֶחָת
  choice: в одном городе
  rationale: Близко передаёт буквальную структуру выражения; «в некоем городе» возможно, но имеет более книжную окраску.
- source_word: אֶחָד עָשִׁיר וְאֶחָד רָאשׁ
  choice: один — богатый, другой — бедный
  rationale: Смысл кратких именных конструкций передан естественным русским противопоставлением; רָאשׁ в данном контексте означает бедного, неимущего человека.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» отражает более позднюю традицию чтения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис краткий и ясный; традиционные формы имён «Нафан» и «Давид» сохранены. Тире подчёркивают симметричное противопоставление богатого и бедного.
