  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: ru
  text: Но теперь он умер. Зачем же мне ещё поститься? Разве я могу вернуть его? Я пойду к нему[a], а он ко мне не вернётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я иду к нему». Еврейское причастие здесь может выражать несомненное будущее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה מֵת
  choice: Но теперь он умер
  rationale: «Но теперь» передаёт контраст с прежним положением, а «умер» естественно выражает наступившее и сохраняющееся состояние смерти.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: Зачем же мне поститься?
  rationale: Риторическое «зачем» естественно передаёт вопрос о цели продолжения поста; частица «же» подчёркивает перемену обстоятельств.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: Разве я могу вернуть его?
  rationale: Порода хифиль глагола שוב означает «заставить вернуться, вернуть». «Разве» передаёт ожидаемый отрицательный ответ, не добавляя способа возвращения к жизни.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Я пойду к нему
  rationale: Причастие הֹלֵךְ в контексте выражает несомненное будущее. Русское «пойду» звучит естественно и не уточняет природу посмертного следования.
- source_word: וְהוּא לֹא יָשׁוּב אֵלָי
  choice: а он ко мне не вернётся
  rationale: Будущее время соответствует форме и контексту; союз «а» ясно передаёт противопоставление двух направлений движения.
theological_decisions:
- issue: Подразумевает ли высказывание Давида сознательную встречу с умершим ребёнком после смерти
  choice: 'Сохранить буквальный смысл: «Я пойду к нему», не уточняя, что именно означает это следование после смерти.'
  alternative: Истолковать слова либо только как сошествие Давида в область мёртвых, либо как обещание личной встречи с ребёнком.
  rationale: Еврейский текст утверждает лишь, что Давид пойдёт к ребёнку, тогда как ребёнок к Давиду не вернётся. Перевод не должен превращать эту фразу в более определённое учение о посмертном состоянии или участи умерших детей.
translation_notes:
  register: Современный литературный русский язык; речь лаконична и достойна, риторические вопросы звучат естественно. Лексическая перекличка корня שוב передана словами «вернуть» и «вернётся».
