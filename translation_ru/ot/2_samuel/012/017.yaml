base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: ru
  text: Старшие в его доме[a] встали возле него, чтобы поднять его с земли, но он не пожелал и не стал есть с ними хлеба[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «старейшины его дома». Слово «дом» здесь может обозначать домашнее окружение или царский двор.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «есть хлеб» здесь означает принимать пищу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: встали
  rationale: Форма глагола קום передаёт конкретное действие старейшин; «встали» сохраняет образ и естественно сочетается с последующим «над ним».
- source_word: זִקְנֵי בֵיתוֹ
  choice: старейшины его дома
  rationale: Буквально «старейшины его дома»; слово «дом» здесь может обозначать царский двор или домашних слуг, поэтому более узкое «семья» не выбрано.
- source_word: עָלָיו
  choice: над ним
  rationale: 'Предлог עַל в этой сцене имеет пространственный смысл: Давид лежит на земле, а старейшины стоят над ним. Перевод сохраняет конкретность еврейского выражения.'
- source_word: לַהֲקִימוֹ
  choice: чтобы поднять его
  rationale: Каузативная форма глагола קום означает «побудить встать, поднять»; русский перевод передаёт и цель, и каузативность.
- source_word: מִן הָאָרֶץ
  choice: с земли
  rationale: В данном контексте אֶרֶץ обозначает поверхность земли, на которой лежал Давид, а не страну или мир.
- source_word: וְלֹא אָבָה
  choice: но он не пожелал
  rationale: Глагол אָבָה выражает отсутствие желания или согласия. «Не пожелал» сохраняет этот оттенок и не усиливает его до категорического «отказался».
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: и не стал есть с ними хлеба
  rationale: Перевод сохраняет как значение редкого глагола ברה «есть, принимать пищу», так и прямое дополнение לֶחֶם «хлеб»; в контексте выражение означает принятие пищи вообще.
