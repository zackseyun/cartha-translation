revisions:
- from: К богачу пришёл путник[a]. Богач пожалел брать из своего мелкого или крупного скота, чтобы приготовить угощение для пришедшего к нему путника. Он взял овечку бедняка и приготовил её для человека, который пришёл к нему.
  to: К богачу пришёл путник[a], но богач пожалел своего скота и не стал брать ни из своего мелкого скота, ни из крупного, чтобы приготовить угощение для путника, пришедшего к нему. Вместо этого он взял овцу бедняка и приготовил её для человека, пришедшего к нему.
  rationale: Правка устраняет неестественную русскую конструкцию, точнее выражает контекстуальное значение וַיַּחְמֹל («пожалел своего скота и не стал брать») и сохраняет перечислительную силу выражения «из своего мелкого скота и из крупного». «Овца» сохраняет обозначение самки без невыраженной в этом стихе уменьшительности. Добавление «Вместо этого» естественно передаёт переход ко второму действию и не меняет смысла.
