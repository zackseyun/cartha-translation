base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: ru
  text: К богачу пришёл путник[a], но богач пожалел своего скота и не стал брать ни из своего мелкого скота, ни из крупного, чтобы приготовить угощение для путника, пришедшего к нему. Вместо этого он взял овцу бедняка и приготовил её для человека, пришедшего к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гость». В еврейском тексте здесь и далее употреблены близкие, но разные обозначения человека, находящегося в пути, и человека, которого принимают как гостя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: путник
  rationale: Слово обозначает человека, находящегося в пути. «Путник» естественно для притчевого повествования и не сводит значение к социальному статусу гостя.
- source_word: וַיַּחְמֹל
  choice: пожалел брать
  rationale: Глагол обычно означает «щадить, жалеть»; при опущенном объекте здесь передаёт нежелание богача расходовать собственный скот. Формулировка сохраняет оттенок жалости к своему добру, не превращая его просто в нейтральное «не захотел».
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: из своего мелкого или крупного скота
  rationale: Два собирательных существительных обозначают соответственно стадо овец и коз и стадо крупного скота. Русская парная формула ясна и передаёт притяжательные суффиксы словом «своего».
- source_word: לַעֲשׂוֹת
  choice: приготовить угощение
  rationale: В контексте гостеприимства глагол означает приготовление пищи. Добавление «угощение» делает эллиптическую конструкцию естественной по-русски, не уточняя способ приготовления.
- source_word: לָאֹרֵחַ
  choice: для ... путника
  rationale: Слово может обозначать как путешественника, так и принятого в доме гостя. «Путник» сохраняет связь с первым обозначением пришедшего; альтернатива отмечена в сноске.
- source_word: כִּבְשַׂת
  choice: овечку
  rationale: Еврейское слово обозначает молодую овцу женского пола. Уменьшительная форма естественно передаёт малость и ценность единственного животного в контексте притчи.
- source_word: הָאִישׁ הָרָאשׁ
  choice: бедняка
  rationale: רָאשׁ означает бедного, нуждающегося человека. «Бедняк» кратко и ясно поддерживает резкое противопоставление богачу.
- source_word: וַיַּעֲשֶׂהָ
  choice: приготовил её
  rationale: Повтор глагола עשה передан тем же корнем, что и ранее; местоимение сохраняет женский род и прямую отсылку к овечке.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: пришедшего к нему / который пришёл к нему
  rationale: Обе причастные конструкции описывают прибывшего посетителя. Вариативность русской синтаксической формы избегает тяжёлого дословного повтора, сохраняя смысловой повтор оригинала.
