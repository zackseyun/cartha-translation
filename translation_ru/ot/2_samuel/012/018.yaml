  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: ru
  text: 'На седьмой день ребёнок умер. Слуги Давида боялись сообщить ему, что ребёнок умер[a], ведь они говорили: «Когда ребёнок был ещё жив, мы говорили с ним, но он нас не слушал. Как же теперь сказать ему: „Ребёнок умер“? Он может совершить зло».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что ребёнок мёртв». В конце стиха выражение «совершить зло» можно также понять как «сделать что-нибудь дурное», «навредить» или, возможно, «навредить себе»; еврейский текст не уточняет, какого именно поступка опасались слуги.'
    reason: Лексическая альтернатива и сохранение неопределённости выражения וְעָשָׂה רָעָה.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: На седьмой день
  rationale: Нарративная формула вводит следующее событие; по-русски естественный временной переход не требует буквального «и было».
- source_word: וַיָּמָת הַיָּלֶד
  choice: ребёнок умер
  rationale: יֶלֶד допускает значения «ребёнок» и «мальчик»; контекст указывает на младенца, поэтому «ребёнок» точнее и не завышает возраст.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: Слуги Давида боялись
  rationale: ירא здесь обозначает страх и опасение, а не благоговение.
- source_word: לְהַגִּיד לוֹ
  choice: сообщить ему
  rationale: הגיד означает «сказать, сообщить, объявить»; «сообщить» естественно передаёт известие о смерти.
- source_word: כִּי מֵת הַיֶּלֶד
  choice: что ребёнок умер
  rationale: В русском событийная формулировка «умер» звучит естественнее, чем статическая «был мёртв», и точно передаёт содержание известия.
- source_word: כִּי אָמְרוּ
  choice: Они говорили
  rationale: Причинная связь понятна из контекста; отдельное предложение естественно вводит внутреннее обсуждение слуг.
- source_word: הִנֵּה בִהְיוֹת הַיֶּלֶד חַי
  choice: Когда ребёнок был ещё жив
  rationale: הִנֵּה акцентирует обстоятельство, но отдельное «вот» в современной русской прямой речи здесь необязательно; «ещё» ясно выражает контраст.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: мы говорили с ним, но он нас не слушал
  rationale: Русское «не слушал нас» естественно передаёт идиому «не слушал нашего голоса» без неуместной буквальности; «но» выявляет явное противопоставление.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Как же теперь сказать ему
  rationale: «Же» и контекстуальное «теперь» передают тревожный вывод из предшествующей ситуации.
- source_word: וְעָשָׂה רָעָה
  choice: Он может причинить зло
  rationale: Краткая еврейская фраза буквально указывает на совершение зла или вреда, не называя объекта; формулировка сохраняет эту неопределённость.
theological_decisions:
- issue: Толкование וְעָשָׂה רָעָה
  choice: Неопределённое причинение зла или вреда без названного объекта
  alternative: Он может навредить себе; он может плохо отреагировать; он может сделать что-нибудь дурное
  rationale: Еврейский текст не уточняет ни действие, ни его объект. Перевод не должен самовольно превращать опасение слуг в утверждение о самоповреждении либо только об эмоциональной реакции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования, без архаизмов. Синтаксис прямой речи сделан естественным для обычного читателя; неоднозначность заключительной фразы сохранена и пояснена в сноске.
