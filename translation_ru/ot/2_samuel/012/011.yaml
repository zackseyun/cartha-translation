base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вот, Я воздвигну против тебя бедствие из твоего же дома. Я возьму твоих жён у тебя на глазах и отдам их твоему ближнему[a], и он ляжет с твоими жёнами на глазах у этого солнца[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тому, кто тебе близок». Еврейское слово может означать ближнего, товарища или человека из близкого окружения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на глазах у этого солнца», то есть открыто, публично.'
    reason: literal_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для русского библейского регистра передача пророческой формулы в настоящем времени.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет функцию частицы, привлекающей внимание к последующему объявлению.
- source_word: מֵקִים עָלֶיךָ רָעָה
  choice: воздвигну против тебя бедствие
  rationale: «Бедствие» обозначает пагубное судебное последствие, а не нравственное зло; «воздвигну против» сохраняет образ и направленность действия.
- source_word: מִבֵּיתֶךָ
  choice: из твоего же дома
  rationale: «Дом» сохраняет семейно-династический образ, а частица «же» подчёркивает, что бедствие возникнет внутри собственного дома Давида.
- source_word: לְעֵינֶיךָ
  choice: у тебя на глазах
  rationale: Естественно передаёт наглядный еврейский оборот и подчёркивает осведомлённость Давида.
- source_word: לְרֵעֶיךָ
  choice: твоему ближнему
  rationale: 'Сохраняет неопределённость רֵעַ: речь может идти о близком человеке, спутнике или человеке из ближайшего окружения.'
- source_word: וְשָׁכַב עִם
  choice: он ляжет с
  rationale: Сохраняет серьёзный эвфемизм исходного текста, не переходя к более разговорному выражению.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: при свете этого солнца
  rationale: Сохраняет конкретный образ «этого солнца» и одновременно понятно выражает публичность происходящего.
theological_decisions:
- issue: Значение רָעָה в высказывании о Божьем суде
  choice: бедствие
  alternative: зло
  rationale: В данном контексте слово обозначает губительное несчастье как суд над Давидом, а не нравственное зло; перевод не снимает утверждение о том, что бедствие воздвигает сам Яхве.
- issue: Личность רֵעַ
  choice: не уточнять личность и передать как «ближний»
  alternative: назвать сообщника, соседа или Авессалома
  rationale: Сам стих не называет человека; более точная идентификация по дальнейшему повествованию преждевременно устранила бы неопределённость формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис разделён на два предложения для ясности, при этом сохранены повтор «твоих жён» и резкие образы публичного суда.
