source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: ru
  text: А у бедняка не было ничего, кроме одной маленькой овечки[a], которую он купил. Он растил её, и она росла вместе с ним и его сыновьями. Она ела от его куска хлеба, пила из его чаши, лежала у него на груди и была ему как дочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает овцу или ягнёнка женского пола.
    reason: lexical_clarification
lexical_decisions:
- source_word: רָשׁ
  choice: бедняк
  rationale: Существительное обозначает бедного, неимущего человека; «бедняк» естественно передаёт противопоставление богачу из предыдущего стиха.
- source_word: אֵין כֹּל כִּי אִם
  choice: не было ничего, кроме
  rationale: Естественная русская передача конструкции полного отсутствия с единственным исключением.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: одна маленькая овечка
  rationale: Передаёт единственность, женский пол животного и уменьшительно-ласковый оттенок, усиливающий эмоциональную выразительность притчи.
- source_word: אֲשֶׁר קָנָה
  choice: которую он купил
  rationale: קנה здесь естественно означает приобретение покупкой.
- source_word: וַיְחַיֶּהָ
  choice: Он растил её
  rationale: Буквально форма означает «сохранял ей жизнь, поддерживал её жизнь»; в данном бытовом контексте «растил» естественно выражает продолжительную заботу о ягнёнке, не сводя действие к разовому спасению.
- source_word: וַתִּגְדַּל
  choice: она росла
  rationale: Прямо передаёт взросление животного и сохраняет словесную связь с тем, что хозяин её растил.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: вместе с ним и его сыновьями
  rationale: Сохраняет формальное значение בָּנָיו «его сыновья» и усиление совместности словом יַחְדָּו.
- source_word: מִפִּתּוֹ
  choice: от его куска
  rationale: פַּת обозначает кусок или ломоть пищи, часто хлеба; «от его куска» сохраняет образ разделённой с животным собственной еды.
- source_word: מִכֹּסוֹ
  choice: из его чаши
  rationale: Прямая и естественная передача образа близкого совместного быта.
- source_word: בְחֵיקוֹ תִשְׁכָּב
  choice: лежала у него на груди
  rationale: חֵיק может обозначать грудь, лоно или объятия; выбранный вариант понятен современному читателю и сохраняет образ телесной близости и привязанности.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: была ему как дочь
  rationale: Сохраняет явное сравнение и его эмоциональную силу, не превращая образное родство в буквальное.
theological_decisions:
- issue: Очеловечивающий семейный образ овечки
  choice: Сохранить прямые образы совместной еды, близости и отношения как к дочери
  alternative: Смягчить эмоциональность и передать лишь то, что хозяин очень любил животное
  rationale: Еврейский текст намеренно изображает овечку членом семьи, усиливая нравственную и эмоциональную силу притчи; перевод не должен ослаблять этот образ.
- issue: Значение בָּנָיו
  choice: его сыновьями
  alternative: его детьми
  rationale: Еврейская форма буквально означает «его сыновья»; русский вариант остаётся естественным и не требует обобщающей замены.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Короткие синтаксические звенья сохраняют последовательность еврейского рассказа; лексика проста и понятна без излишней архаизации.
