base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: ru
  text: Тогда Давид поднялся с земли, омылся, умастился маслом и переоделся. Он вошёл в дом Яхве и поклонился[a]. Затем он пришёл в свой дом, попросил еды, и ему подали хлеб; он поел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся ниц»; еврейский глагол может обозначать телесный поклон как выражение почитания и поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: поднялся с земли
  rationale: Передаёт конкретное действие Давида, лежавшего на земле во время поста и скорби; «земля» естественнее здесь, чем «пол».
- source_word: וַיִּרְחַץ
  choice: умылся
  rationale: В данном ряду действий רחץ означает омовение после скорби; «умылся» звучит естественно, хотя еврейское слово может обозначать и более полное омовение.
- source_word: וַיָּסֶךְ
  choice: умастился маслом
  rationale: סוך означает нанесение масла на тело; дополнение «маслом» ясно выражает подразумеваемый предмет и отличает действие от царского или священнического помазания.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: переоделся
  rationale: Естественно передаёт идиоматический смысл буквального «сменил свою одежду».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет обычное обозначение святилища и передаёт тетраграмматон личным именем «Яхве».
- source_word: וַיִּשְׁתָּחוּ
  choice: поклонился
  rationale: Глагол обозначает поклон или простирание ниц; «поклонился» сохраняет и телесный жест, и контекст почитания, не уточняя степень наклона.
- source_word: וַיִּשְׁאַל
  choice: попросил еды
  rationale: В еврейском тексте предмет просьбы не назван, но следующий оборот о поданном хлебе ясно подразумевает пищу; дополнение необходимо для естественного русского синтаксиса.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохраняет прямое значение слова, которое также может метонимически обозначать пищу вообще.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: ему подали хлеб
  rationale: Естественный русский эквивалент идиомы «положили ему хлеб», сохраняющий неопределённость действующих лиц.
- source_word: וַיֹּאכַל
  choice: он поел
  rationale: Передаёт завершённое действие в повествовательной цепочке и естественно завершает описание прекращения поста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: Значение וַיִּשְׁתָּחוּ
  choice: поклонился
  alternative: совершил поклонение; простёрся ниц
  rationale: Перевод сохраняет смысл телесного выражения почтения и не устраняет присущую глаголу широту; в контексте дома Яхве поклон явно обращён к Богу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткие последовательные глаголы сохраняют темп еврейской повествовательной цепочки; устранены ненужные архаизмы.
