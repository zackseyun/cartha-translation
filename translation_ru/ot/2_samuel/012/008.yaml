  source_fidelity: 'В целом перевод точно передаёт структуру и лексику стиха: повтор «отдал», «дом», условную конструкцию и неопределённое כָּהֵנָּה וְכָהֵנָּה. Однако предлог בְּ («в/на, в пределах») с חֵיק точнее передать как «на лоно» или «в лоно», а не «в объятия»: «объятия» несколько меняют образ и могут звучать как описание физического жеста. Кроме того, «ещё столько и столько» в русском может означать просто удвоение уже названного количества; «то и другое» лучше сохраняет открытую, перечислительную неопределённость еврейского выражения.'
  naturalness: «Дом твоего господина», «дом Израиля и Иуды» и торжественное «Я отдал» естественны для современного литературного библейского русского. Фраза «жён ... в твои объятия» грамматически возможна, но стилистически и образно менее точна, чем «на твоё лоно». Условная фраза хорошо звучит с союзом «то».
  terminology: '«Господин» удачно отличает человеческого властителя от Господа. «Лоно» — литературное, но понятное библейское слово и прямее соответствует חֵיק. Перевод не истолковывает передачу жён как одобрение конкретных супружеских отношений. Сноска a должна быть согласована с основным текстом: при «на твоё лоно» она уже не может называть это буквальным вариантом.'
