base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: ru
  text: И Я отдал тебе дом твоего господина и жён твоего господина на твоё лоно[a]; Я отдал тебе дом Израиля и Иуды. И если бы этого было мало, то Я прибавил бы тебе то и другое[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «лоно» может означать грудь или колени; этот оборот выражает близкое принятие или обладание.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ещё столько же и больше». Еврейское выражение намеренно неопределённо и означает дальнейшее прибавление подобных даров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Я отдал
  rationale: Повествовательная форма от נתן обозначает совершённое в прошлом действие; «отдал» естественно передаёт также переход владения к Давиду.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: дом твоего господина
  rationale: '«Дом» сохраняет конкретность и многозначность בַּיִת: жилище, имущество, двор или династический дом Саула. «Господина» здесь обозначает человеческого властителя и не смешивается с именем Господа, которое в русском тексте передаётся иначе.'
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: жён твоего господина
  rationale: Прямо передаёт конструкцию оригинала, не заменяя её более толковательными словами «гарем» или «женщины двора».
- source_word: בְּחֵיקֶךָ
  choice: в твои объятия
  rationale: חֵיק буквально означает грудь, лоно или колени; в данном обороте выражает близкое принятие и обладание. «В твои объятия» сохраняет образ и звучит естественно в современном русском.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: дом Израиля и Иуды
  rationale: Сохраняет слово «дом» и параллель с предыдущей фразой, не сужая смысл до территории, царства или населения.
- source_word: וְאִם מְעָט
  choice: если бы этого было мало
  rationale: Русская условная конструкция естественно передаёт гипотетическую недостаточность уже перечисленных даров.
- source_word: וְאֹסִפָה לְּךָ
  choice: Я прибавил бы тебе
  rationale: Передаёт каузативное значение יסף «добавлять, прибавлять» и условную модальность контекста.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: ещё столько и столько
  rationale: Парное указательное выражение означает неопределённое дальнейшее увеличение. Такой перевод сохраняет намеренную неопределённость и наращивающий смысл.
theological_decisions:
- issue: Следует ли понимать передачу жён Саула как явное Божье одобрение супружеских отношений с ними
  choice: Сохранено прямое утверждение о том, что жёны господина были отданы Давиду «в объятия», без пояснения характера отношений.
  alternative: 'Перевести толковательно: «отдал тебе гарем твоего господина» или смягчить: «поручил твоей заботе женщин дома твоего господина».'
  rationale: Еврейский текст связывает эту передачу с царским наследованием и владением, но не формулирует здесь отдельного нравственного суждения. Перевод сохраняет богословское напряжение и не добавляет ни одобрения, ни смягчения.
translation_notes:
  register: Современный литературный русский с достоинством прямой Божьей речи. Повтор «отдал тебе» и слово «дом» сохранены ради риторического параллелизма оригинала; синтаксис слегка упорядочен для естественного русского звучания.
