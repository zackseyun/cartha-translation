base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: ru
  text: 'Тогда Давид сказал Нафану: «Я согрешил против Яхве». Нафан сказал Давиду: «Яхве также удалил твой грех[a]; ты не умрёшь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставил твой грех пройти»; в данном контексте: «удалил твой грех».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «ты не будешь предан смерти». Еврейский текст буквально говорит: «ты не умрёшь», хотя контекст может подразумевать избавление от смертного приговора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: я согрешил
  rationale: Форма qal perfect, 1-е лицо единственного числа, выражает прямое признание уже совершённого греха; русское совершенное прошедшее естественно передаёт и совершённость, и актуальность признания.
- source_word: לַיהוָה
  choice: против Яхве
  rationale: Предлог ל при глаголе חטא в исповедальном контексте естественно передаётся по-русски как «против»; имя יהוה сохранено как личное имя «Яхве».
- source_word: גַּם
  choice: и
  rationale: В ответе Нафана גַּם связывает Божье действие с признанием Давида и может иметь оттенки «также» или «со своей стороны». Русское «и» сохраняет эту связь, не навязывая более узкого толкования.
- source_word: הֶעֱבִיר חַטָּאתְךָ
  choice: снял с тебя грех
  rationale: Hiphil глагола עבר буквально означает «заставил пройти, отвёл, удалил». Выражение «снял с тебя грех» естественно обозначает устранение вины и её смертельного последствия, не уточняя здесь механизм прощения.
- source_word: לֹא תָמוּת
  choice: ты не умрёшь
  rationale: Отрицательная форма imperfect глагола מות прямо говорит, что Давид не умрёт. Перевод не добавляет отсутствующего в еврейском тексте пассива «не будешь предан смерти».
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Тогда ... сказал ... Нафан ответил
  rationale: Последовательность повествовательных форм передана естественным русским синтаксисом; «ответил» ясно выражает диалогическую связь второго высказывания без изменения его содержания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте дважды употреблено собственное заветное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл הֶעֱבִיר חַטָּאתְךָ
  choice: снял с тебя грех
  alternative: простил твой грех; удалил твой грех; отвёл твой грех
  rationale: Текст утверждает Божье устранение греха и последующее избавление Давида от смерти, но не объясняет здесь способ искупления. Формулировка сохраняет эту богословскую сдержанность.
- issue: Характер слов לֹא תָמוּת
  choice: ты не умрёшь
  alternative: ты не будешь предан смерти
  rationale: Контекст допускает судебный оттенок избавления от смертного приговора, однако грамматически текст говорит просто о том, что Давид не умрёт; буквальная широта сохранена.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием прямой речи. Сохранены личное имя «Яхве», лаконизм исповеди Давида и судебный оттенок ответа Нафана; архаизмы и конфессионально маркированные формулы не использованы.
