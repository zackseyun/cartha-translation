  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: ru
  text: И за овечку он должен возместить вчетверо, потому что сделал это и не пожалел.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пощадил». Еврейский глагол может означать «жалеть» или «щадить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: овечку
  rationale: Уменьшительная форма естественно обозначает самку ягнёнка и соответствует повествованию о единственной любимой овечке бедняка.
- source_word: יְשַׁלֵּם
  choice: должен возместить
  rationale: Пиэль глагола שׁלם здесь выражает обязательное возмещение ущерба в судебном приговоре Давида.
- source_word: אַרְבַּעְתָּיִם
  choice: вчетверо
  rationale: Наречное числительное означает возмещение в четырёхкратном размере и перекликается с требованием Исх. 22:1.
- source_word: עֵקֶב אֲשֶׁר
  choice: потому что
  rationale: Оборот вводит основание вынесенного приговора; это естественный современный русский эквивалент.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: сделал это
  rationale: Передаёт смысл буквально, но без тяжеловесного русского оборота «сделал это дело».
- source_word: לֹא חָמָל
  choice: не пожалел
  rationale: Глагол חמל объединяет оттенки жалости и удержания от причинения вреда; «не пожалел» естественно сохраняет эту смысловую ёмкость.
