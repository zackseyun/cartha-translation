  text: וַ/יֶּאֱסֹ֥ף דָּוִ֛ד אֶת כָּל הָ/עָ֖ם וַ/יֵּ֣לֶךְ רַבָּ֑תָ/ה וַ/יִּלָּ֥חֶם בָּ֖/הּ וַֽ/יִּלְכְּדָֽ/הּ־־׃
