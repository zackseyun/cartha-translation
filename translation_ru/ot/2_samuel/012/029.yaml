  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: ru
  text: Тогда Давид собрал весь народ[a], пошёл к Равве, сразился с ней и захватил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё войско» или «всех воинов»; буквально по-еврейски: «весь народ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол אסף здесь означает собрать людей вместе. «Собрал» естественно звучит по-русски и не уточняет сверх еврейского текста характер военного сбора.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Буквально выражение означает «весь народ». В военном контексте, вероятно, имеются в виду воины или войско, однако основной текст сохраняет более широкую формулировку оригинала.
- source_word: רַבָּתָה
  choice: к Равве
  rationale: Название города רַבָּה снабжено направительным ה, обозначающим движение к нему. Форма «к Равве» передаёт это направление и соответствует русскому склонению названия.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: сразился с ней
  rationale: Глагол לחם с предлогом ב обозначает вступление в бой против города. Местоимение женского рода согласуется по-русски с подразумеваемым словом «Равва» или «город» через название женского рода; формулировка естественна для повествования.
- source_word: וַיִּלְכְּדָהּ
  choice: захватил её
  rationale: לכד в военном повествовании обычно означает овладеть городом, захватить его. «Захватил» ясно и точно передаёт результат осады.
