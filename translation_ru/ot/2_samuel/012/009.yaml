source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: ru
  text: Почему ты пренебрёг словом Яхве[a], сделав зло в Его глазах? Урию хеттеянина ты поразил мечом, жену его взял себе в жёны[b], а его самого убил мечом аммонитян[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с презрением отнёсся к слову Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взял себе в жену»; выражение подчёркивает, что Давид присвоил жену Урии.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «мечом сынов Аммона», то есть Давид устроил гибель Урии от рук аммонитян.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямой вопрос передаёт силу обличения Нафана и естественно звучит по-русски.
- source_word: בָּזִיתָ
  choice: пренебрёг
  rationale: Глагол בזה выражает презрение и неуважение; «пренебрёг» сохраняет нравственную тяжесть и естественно сочетается со «словом».
- source_word: דְּבַר יְהוָה
  choice: словом Яхве
  rationale: «Слово» сохраняет широту דבר — высказанную волю и повеление Бога; личное имя передаёт непосредственно стоящее в тексте יהוה.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: сделав зло в Его глазах
  rationale: Деепричастная конструкция естественно связывает поступок с пренебрежением; образ «в Его глазах» сохраняет характерную древнееврейскую формулу оценки.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: поразил мечом
  rationale: Сохраняет буквальное значение נכה и повтор образа меча, не устраняя последующее отдельное «убил».
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: взял себе в жёны
  rationale: Естественная русская формула сохраняет и личное присвоение, выраженное לְךָ, и брачное значение לְאִשָּׁה.
- source_word: הָרַגְתָּ
  choice: убил
  rationale: Прямое соответствие обычному глаголу הרג; контекст сам ясно устанавливает вину Давида.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: мечом аммонитян
  rationale: Идиоматически передаёт «мечом сынов Аммона» и сохраняет указание на аммонитян как средство, через которое Давид устроил смерть Урии.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Урию-хеттеянина
  rationale: Нормативная русская передача имени и этнического обозначения в требуемом винительном падеже.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; «Яхве» сохраняет это различие, не подменяя имя титулом.
- issue: Связь презрения к слову Бога со злым поступком
  choice: «пренебрёг …, сделав зло»
  alternative: «пренебрёг …, чтобы сделать зло»
  rationale: Инфинитив לַעֲשׂוֹת допускает тесную смысловую связь результата или пояснения с основным глаголом. Русское деепричастие не приписывает Давиду намерение презреть слово именно с целью совершить зло.
- issue: Ответственность Давида за смерть Урии
  choice: «его самого убил мечом аммонитян»
  alternative: «он был убит мечом аммонитян»
  rationale: Активная форма исходного текста прямо возлагает убийство на Давида, хотя непосредственными исполнителями стали аммонитяне.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Сохранены повтор «мечом», формула «в Его глазах» и активное возложение вины на Давида; синтаксис слегка упорядочен для ясности и естественности.
