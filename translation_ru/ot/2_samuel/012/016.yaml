  - marker: b
    text: 'Буквально: «постился постом». В еврейском тексте однокоренные слова подчёркивают пост Давида.'
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: искал
  rationale: Глагол בקש обозначает усердное искание и в данном контексте подразумевает обращение к Богу с просьбой. «Искал» сохраняет форму исходного выражения, не усиливая её до однозначного «умолял».
- source_word: אֶת־הָאֱלֹהִים
  choice: Бога
  rationale: Прямое дополнение называет того, к кому было направлено усердное искание Давида.
- source_word: בְּעַד
  choice: ради
  rationale: Предлог передаёт действие в интересах другого; здесь Давид обращается к Богу ради больного сына.
- source_word: הַנַּעַר
  choice: мальчика
  rationale: Слово נַעַר может обозначать мальчика, юношу, слугу или ребёнка. Здесь по контексту речь идёт о малолетнем сыне Давида; «мальчик» непосредственно отражает выбранное древнееврейское существительное, а контекстуальный вариант указан в сноске.
- source_word: וַיָּצָם ... צוֹם
  choice: постился
  rationale: В древнееврейском употреблены однокоренные глагол и существительное, буквально «постился постом», что подчёркивает действие. В основном тексте выбран естественный современный русский оборот, а особенность оригинала сохранена в сноске.
- source_word: וּבָא
  choice: вошёл
  rationale: בוא передаёт вход или движение внутрь. Место в исходном тексте не названо, поэтому оно не добавляется в переводе.
- source_word: וְלָן
  choice: провёл ночь
  rationale: לון означает оставаться или располагаться где-либо на ночь; выбран ясный современный эквивалент.
- source_word: וְשָׁכַב אָרְצָה
  choice: лежал на земле
  rationale: Перевод сохраняет как положение тела, так и направленность к земле, не заменяя «землю» предположительным «полом».
theological_decisions:
- issue: Степень выраженности молитвенной просьбы в וַיְבַקֵּשׁ
  choice: искал Бога
  alternative: умолял Бога
  rationale: Контекст допускает смысл настойчивой молитвы, однако сам глагол не требует более сильного «умолял». Более буквальное выражение сохраняет смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Синтаксис сохраняет последовательность действий оригинала; не указанное в древнееврейском тексте место, куда вошёл Давид, не добавлено.
