  text: Давид обратился к Богу за ребёнка[a]. Он постился[b], вошёл, провёл ночь и лежал на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за мальчика». Здесь имеется в виду заболевший сын Давида (ст. 15, 18).'
