  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: ru
  text: И Он послал весть через пророка Нафана[a] и назвал его Иедидией[b] — ради Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою пророка Нафана».'
    reason: lexical_alternative
  - marker: b
    text: Имя Иедидия, вероятно, означает «любимый Яхве».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из-за Яхве», «по причине Яхве». Еврейское выражение допускает оттенки причины и действия ради кого-либо.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал весть
  rationale: Глагол буквально означает «послал»; при обороте בְּיַד и отсутствии выраженного объекта контекст подразумевает переданное через Нафана сообщение. «Послал весть» естественно передаёт это по-русски, не представляя самого Нафана прямым дополнением.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: через пророка Нафана
  rationale: Буквально «рукою пророка Нафана»; это обычный древнееврейский оборот, обозначающий посредничество или действие через кого-либо.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: назвал мальчика
  rationale: Буквальное «назвал его имя» в современном русском неестественно. «Назвал мальчика» ясно передаёт наречение имени и устраняет возможное впечатление, будто именуется Нафан.
- source_word: יְדִידְיָהּ
  choice: Иедидия
  rationale: Имя передано принятой русской библейской транслитерацией; его вероятное значение пояснено в сноске.
- source_word: בַּעֲבוּר
  choice: ради
  rationale: 'Предлог может обозначать основание, причину или чьи-либо интересы: «ради», «из-за», «по причине». Краткое «ради» сохраняет смысловую напряжённость выражения, не превращая его в однозначное причинное пояснение.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Кто послал весть и дал имя
  choice: Местоимение «Он» указывает на Яхве как наиболее вероятного субъекта обоих глаголов в продолжение слов предыдущего стиха о том, что Яхве полюбил ребёнка.
  alternative: Субъектом наречения имени можно считать Нафана, а при иной синтаксической связи — Давида.
  rationale: Контекст и последовательность однородных глагольных форм благоприятствуют Яхве как общему субъекту. При этом отдельное повторение имени Бога в русском тексте не добавлено; сноска отмечает существующую грамматическую возможность иного понимания.
- issue: Связь имени Иедидия с Яхве
  choice: Сохранено краткое и несколько неоднозначное «ради Яхве».
  alternative: «Потому что Яхве полюбил его» или «по воле Яхве».
  rationale: Исходный текст не выражает глагол «полюбил» в данном предложении и не говорит прямо «по воле». Более развёрнутые варианты сделали бы подразумеваемую связь однозначнее, чем она сформулирована по-еврейски.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавная буква в «Он» помогает связать действие с Яхве из предыдущего контекста; слово «мальчика» добавлено только для естественности и ясности референции. Все сноски привязаны к соответствующим местам текста.
