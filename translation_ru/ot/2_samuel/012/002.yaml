  text: The rich man had very many sheep and cattle[a].
translation:
  language: ru
  text: У богатого было очень много мелкого скота и крупного рогатого скота[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У богатого было великое множество овец и крупного рогатого скота».'
    reason: Возможна более конкретная передача собирательного צֹאן как «овцы»; основной текст сохраняет более широкое значение «мелкий скот».
lexical_decisions:
- source_word: לְעָשִׁיר
  choice: у богача
  rationale: Предлог לְ при הָיָה образует конструкцию обладания («у кого-либо было»). Определённое «богача» естественно продолжает противопоставление двух людей в предыдущем стихе.
- source_word: הָיָה
  choice: было
  rationale: В сочетании с לְ глагол выражает обладание; русская конструкция «у … было» точно и естественно передаёт смысл.
- source_word: צֹאן
  choice: мелкого скота
  rationale: Собирательное צֹאן обозначает мелкий домашний скот, прежде всего овец и коз; это точнее, чем ограничивать значение одними овцами.
- source_word: וּבָקָר
  choice: и крупного скота
  rationale: בָּקָר обозначает крупный рогатый скот и здесь составляет обычную пару с צֹאן.
- source_word: הַרְבֵּה מְאֹד
  choice: очень много
  rationale: Сочетание выражает усиленно большое количество; «очень много» ясно и без архаичности сохраняет эту эмфазу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена лаконичность притчевого рассказа. Термины «мелкий и крупный скот» передают две собирательные категории животных точнее, чем более узкое «овцы и коровы».
