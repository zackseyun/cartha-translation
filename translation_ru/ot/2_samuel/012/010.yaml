  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: ru
  text: Итак, меч никогда не отступит от твоего дома[a], потому что ты презрел Меня[b] и взял себе в жёны жену Урии Хеттеянина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «дом» может означать также семью, домашних или царскую династию.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты презрел Меня». Совершённое против Урии и его жены представлено как презрение к самому Богу.'
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Союз и наречие вводят следствие из предыдущего обличения; «итак» естественно передаёт выводный оттенок в современном русском языке.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: никогда не отступит
  rationale: Глагол סור при подлежащем «меч» означает удаление или прекращение действия, а עַד עוֹלָם придаёт приговору длительный, неопределённо-постоянный характер. Русское «никогда не отступит» передаёт сочетание целиком без буквального и неестественного «до века».
- source_word: חֶרֶב
  choice: меч
  rationale: Сохранён исходный образ меча как знака насильственной смерти и непрекращающегося бедствия.
- source_word: מִבֵּיתְךָ
  choice: от твоего дома
  rationale: «Дом» сохраняет широту еврейского выражения, которое может охватывать семью, домашнее окружение и царскую династию.
- source_word: עֵקֶב כִּי
  choice: потому что
  rationale: Сочетание прямо указывает причину объявленного суда; простой причинный союз звучит ясно и естественно.
- source_word: בְזִתָנִי
  choice: ты презрел Меня
  rationale: Глагол בזה означает презрение или пренебрежительное отношение. Личное местоимение сохранено согласно прямому смыслу еврейского текста.
- source_word: וַתִּקַּח
  choice: и взял
  rationale: Последовательная глагольная форма обозначает завершённое действие; русский прошедший вид естественно согласуется с предшествующим обвинением.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: жену Урии-хеттеянина
  rationale: Формулировка сохраняет акцент на том, что женщина была женой Урии, и ясно передаёт его этническое обозначение.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: взял себе в жёны
  rationale: Это естественный русский эквивалент еврейского выражения «чтобы быть тебе женой»; он передаёт присвоение чужой жены без громоздкого повтора.
theological_decisions:
- issue: К кому относится местоимение в выражении «ты презрел Меня»
  choice: 'Сохранить прямое обращение Бога: «Меня»'
  alternative: «Ты презрел слово/повеление Господа»
  rationale: 'В еврейском тексте стоит местоименный суффикс первого лица единственного числа. Такая передача сохраняет богословское напряжение: зло, совершённое против Урии и его жены, названо презрением к самому Богу.'
- issue: Объём значения выражения «твой дом»
  choice: 'Перевести буквально: «твой дом»'
  alternative: «твоя семья», «твой род» или «твоя династия»
  rationale: Еврейское בַּיִת может обозначать семью, домочадцев и династическую линию. Буквальная формулировка не сужает намеренно широкий смысл приговора.
- issue: Временной охват выражения עַד עוֹלָם
  choice: Передать как «никогда не отступит»
  alternative: «не отступит вовеки» или «не отступит навсегда»
  rationale: Фраза выражает продолжительный, не имеющий обозначенного конца приговор. «Никогда» естественно передаёт его силу, не уточняя сверх текста метафизическую продолжительность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого приговора. Сохранены образ меча, широкое значение слова «дом» и прямое божественное «Меня»; синтаксис сделан естественным для обычного современного читателя.
