  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: ru
  text: 'Он сказал: «Пока ребёнок был жив, я постился и плакал, ведь я говорил себе: „Кто знает? Может быть, Яхве будет милостив ко мне, и ребёнок останется жив“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: пока ребёнок был жив
  rationale: Оборот обозначает продолжавшееся в прошлом состояние; русский вариант естественно передаёт временное значение и сохраняет подразумеваемую ограниченность этого периода.
- source_word: צַמְתִּי
  choice: я постился
  rationale: Глагол צום прямо означает воздержание от пищи как пост.
- source_word: וָאֶבְכֶּה
  choice: и плакал
  rationale: בכה означает «плакать, рыдать»; «плакал» звучит естественно и достойно в современной русской речи.
- source_word: כִּי אָמַרְתִּי
  choice: потому что думал
  rationale: כִּי вводит основание поступков Давида, а אָמַרְתִּי здесь передаёт внутреннее рассуждение; по-русски «думал» естественнее буквального «говорил».
- source_word: מִי יוֹדֵעַ
  choice: Кто знает?
  rationale: Устойчивое выражение передаёт неопределённость и надежду относительно возможного действия Бога.
- source_word: יְחָנֵּנִי
  choice: будет милостив ко мне
  rationale: Форма от חנן означает проявить благоволение или милость к человеку; выбранный вариант сохраняет личный объект и оттенок незаслуженной милости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וְחַי הַיָּלֶד
  choice: и ребёнок останется жив
  rationale: В контексте после «Кто знает?» фраза выражает ожидаемый, но неопределённый исход; «останется жив» естественно передаёт продолжение жизни ребёнка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит Тетраграмматон, поэтому личное имя сохраняется без замены титулом.
- issue: Степень уверенности Давида в исходе
  choice: Может быть, Яхве будет милостив ко мне, и ребёнок останется жив
  alternative: Яхве будет милостив ко мне, и ребёнок останется жив
  rationale: Выражение «Кто знает?» распространяет неопределённость на всю надежду Давида; добавление «может быть» не превращает надежду в уверенное предсказание.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанная. Сохранены личное имя Яхве, причинная связь и напряжение между надеждой Давида и неизвестностью исхода.
