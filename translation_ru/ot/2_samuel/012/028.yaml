  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: ru
  text: Теперь собери остальное войско, разбей лагерь против города и возьми его, иначе я сам возьму город и его назовут моим именем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет названо моё имя над ним». Этот оборот может означать, что город будет связан с именем Иоава и честь его взятия достанется ему.'
    reason: Пояснение буквального еврейского образа и его вероятного смысла без устранения неоднозначности.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Передаёт переход к срочному следующему действию естественным современным русским выражением.
- source_word: אֱסֹף אֶת יֶתֶר הָעָם
  choice: собери остальное войско
  rationale: В контексте осады עָם обозначает воинов, остающихся при Давиде; «войско» яснее контекстуального «народ».
- source_word: וַחֲנֵה עַל הָעִיר
  choice: разбей лагерь против города
  rationale: Сохраняет основное значение חנה — расположиться лагерем — и враждебную направленность עַל, не заменяя выражение более толковательным «осади».
- source_word: וְלָכְדָהּ
  choice: и возьми его
  rationale: Обычное русское выражение для захвата города; местоимение согласовано со словом «город».
- source_word: פֶּן
  choice: иначе
  rationale: Естественно передаёт предостережение и нежелательное возможное следствие.
- source_word: אֶלְכֹּד אֲנִי
  choice: я сам возьму город
  rationale: Ударное местоимение אֲנִי передано словом «сам»; повтор глагола לכד сохранён.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: и его назовут моим именем
  rationale: Передаёт еврейский оборот естественно по-русски, сохраняя идею связи города с именем победителя; буквальный образ и диапазон смысла отмечены в сноске.
theological_decisions:
- issue: Значение выражения «моё имя будет названо над ним»
  choice: Естественное «его назовут моим именем» с пояснением в сноске
  alternative: «моё имя будет провозглашено над ним» или «честь взятия города припишут мне»
  rationale: Первый вариант чрезмерно буквален и неестественен по-русски, второй заранее сводит неоднозначный образ только к славе за победу. Текст со сноской сохраняет и идиоматичность, и смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Военная ситуация выражена ясно, без излишней терминологичности; синтаксис сохраняет последовательность повелений и заключительное предостережение оригинала.
