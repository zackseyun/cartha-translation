  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: ru
  text: Иоав воевал против Раввы аммонитян и захватил царский город[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
