lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: воевал против
  rationale: Форма нифаль глагола לחם обозначает участие в сражении или ведение войны; сочетание «воевал против» естественно передаёт военный и направленный характер действия.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Раввы аммонитян
  rationale: רַבָּה — название города, а בְּנֵי עַמּוֹן — обычное обозначение аммонитян. Русская форма «Раввы аммонитян» ясно указывает, о какой Равве идёт речь.
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: В военном контексте לכד означает овладеть городом или взять его; «захватил» точно и естественно передаёт это значение.
- source_word: עִיר הַמְּלוּכָה
  choice: царский город
  rationale: Буквально выражение связано с царствованием или царской властью. «Царский город» сохраняет форму и неоднозначность еврейского выражения лучше, чем более толковательное «столица».
