  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: ru
  text: Жителей города он вывел и приставил к работе с пилами[a], железными кирками и железными топорами, а также заставил их трудиться у печи для обжига кирпича[b]. Так он поступил со всеми городами аммонитян[c]. Затем Давид и весь народ возвратились в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил их под пилы, под острые железные орудия и под железные режущие орудия». Точные названия орудий и смысл предлогов неясны.'
    reason: Лексическая и синтаксическая неопределённость в перечне орудий.
  - marker: b
    text: 'Древнееврейский текст здесь труден. Традиционно: «провёл их через печь для обжига кирпича»; некоторые понимают весь отрывок как описание казни, а не принудительных работ.'
    reason: Сохранение существенного альтернативного прочтения.
  - marker: c
    text: Ср. параллельный рассказ в 1 Паралипоменон 20:3, где формулировка также допускает разные толкования.
    reason: Перекрёстная ссылка на параллельное место.
lexical_decisions:
- source_word: הוֹצִיא
  choice: вывел
  rationale: Порода hифиль глагола יצא обычно выражает понудительное значение «вывести»; русский вариант передаёт его прямо и естественно.
- source_word: וַיָּשֶׂם
  choice: приставил к работе с
  rationale: Буквально глагол означает «поставил, поместил». В сочетании с перечнем орудий выражение вероятно описывает назначение пленных на принудительные работы, однако буквальная и более суровая трактовка отмечена в сноске.
- source_word: בַּמְּגֵרָה
  choice: с пилами
  rationale: מְגֵרָה означает «пила». Единственное число можно понимать собирательно; множественное число естественно звучит в русском перечне орудий.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: железными кирками
  rationale: 'Точное значение חֲרִצֵי неясно: речь может идти об острых железных орудиях либо молотильных приспособлениях. «Кирки» уместны в контексте тяжёлого труда, но неопределённость сохранена в сноске.'
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: железными топорами
  rationale: Слово обозначает железные режущие орудия; «топоры» — конкретный и понятный русский эквивалент, при этом более общее значение отмечено в сноске.
- source_word: וְהֶעֱבִיר אוֹתָם
  choice: заставил их трудиться
  rationale: Буквально конструкция означает «провёл их, заставил их пройти». В данном трудовом контексте она может обозначать направление пленных на повинность; буквальная трактовка сохранена в сноске.
- source_word: במלכן
  choice: у печи для обжига кирпича
  rationale: Согласный текст труден. С учётом контекста и параллели в 1 Пар 20:3 выражение часто связывают с изготовлением или обжигом кирпича. Основной текст следует этому связному прочтению, не скрывая альтернативы.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Так он поступил
  rationale: Настоящая форма в повествовательном окружении обобщает действия Давида; русское прошедшее время естественно передаёт повествовательный смысл.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: со всеми городами аммонитян
  rationale: «Аммонитяне» — общепринятое современное русское название народа, буквально названного «сынами Аммона».
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: возвратились в Иерусалим
  rationale: שוב с указанием места назначения означает возвращение. Составное подлежащее «Давид и весь народ» требует в русском множественного числа.
theological_decisions:
- issue: Описывает ли стих казнь аммонитских пленников орудиями и печью или их обращение на тяжёлые принудительные работы
  choice: В основном тексте описаны принудительные работы с орудиями и у печи для обжига кирпича.
  alternative: 'Традиционное буквальное понимание допускает, что Давид подверг пленников казни: предал их пилам и железным орудиям и провёл через печь.'
  rationale: Фразы с וַיָּשֶׂם и וְהֶעֱבִיר ... במלכן синтаксически и лексически трудны. Контекст покорения населения и параллель в 1 Пар 20:3 позволяют понимать их как трудовую повинность, но древнееврейский текст не исключает более сурового прочтения; поэтому оно явно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировки доступны широкому читателю; устаревшие слова и излишне буквальный синтаксис устранены. Основной текст читается связно, а подлинная неопределённость древнееврейского текста вынесена в ясные сноски.
