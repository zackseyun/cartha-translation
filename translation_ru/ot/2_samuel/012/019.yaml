base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: ru
  text: 'Давид увидел, что его слуги перешёптываются, и понял, что ребёнок умер. Тогда Давид спросил своих слуг: «Ребёнок умер?» Они ответили: «Умер».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: 'Прямо передаёт обычное значение ראה: Давид наблюдает поведение слуг и на основании этого делает вывод.'
- source_word: מִתְלַחֲשִׁים
  choice: перешёптываются
  rationale: Возвратная форма и контекст указывают на тихий разговор слуг между собой; русское слово естественно передаёт оба оттенка.
- source_word: וַיָּבֶן
  choice: понял
  rationale: בין здесь обозначает понимание, достигнутое по наблюдаемым признакам; «понял» естественно и точно в повествовательном контексте.
- source_word: מֵת
  choice: умер / умер
  rationale: В русском языке при сообщении о смерти ребёнка глагольная формулировка звучит естественнее, чем «мёртв», и может передавать как наступившее событие, так и его результат; краткий ответ сохраняет лаконичность еврейского מֵת.
- source_word: הַיָּלֶד
  choice: ребёнок
  rationale: יֶלֶד может означать ребёнка или мальчика; по контексту речь идёт о младенце, поэтому «ребёнок» точнее.
- source_word: עֲבָדָיו
  choice: его слуги / своих слуг
  rationale: В данном контексте עֶבֶד обозначает людей из царского окружения, прислуживающих Давиду; «слуги» не вносит без необходимости акцент на правовом статусе рабов.
- source_word: הֲמֵת הַיֶּלֶד
  choice: Ребёнок умер?
  rationale: Еврейская конструкция спрашивает, мёртв ли ребёнок. В современном русском «Ребёнок умер?» является наиболее естественным эквивалентом и не меняет сути вопроса.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: спросил ... ответили
  rationale: Хотя אמר буквально означает «сказать», вопросительная форма и последующая реплика делают «спросил» и «ответили» естественным русским соответствием без изменения смысла.
