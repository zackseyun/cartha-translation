  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: ru
  text: Однако, поскольку этим делом ты выказал крайнее презрение к врагам Яхве[a], родившийся у тебя сын непременно умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Во многих переводах эта часть передана так: «ты дал врагам Яхве повод хулить» или «злословить». Такое понимание основано на истолковании или исправлении трудного еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Однако
  rationale: Передаёт сильное противопоставление предшествующему объявлению о прощении и звучит естественно в современном русском языке.
- source_word: כִּי
  choice: поскольку
  rationale: Вводит причину объявленного последствия; причинная связь выражена ясно и литературно.
- source_word: נִאֵץ נִאַצְתָּ
  choice: ты выказал крайнее презрение
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол; выражение сохраняет значение презрения и эмфатический характер конструкции.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: к врагам Яхве
  rationale: Сохраняет врагов Яхве как объект действия согласно данной масоретской форме текста, не заменяя трудное чтение более привычным толкованием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בַּדָּבָר הַזֶּה
  choice: этим делом
  rationale: В контексте דָּבָר обозначает совершённое дело или происшедшее; «делом» естественнее и конкретнее русского «обстоятельством».
- source_word: גַּם
  choice: не выражено отдельным словом
  rationale: Добавочно-следственная или усилительная функция частицы естественно передаётся самой структурой русского предложения; буквальное «также» здесь было бы тяжеловесно.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: родившийся у тебя сын
  rationale: Сохраняет значение «сын» и пассивно-результативный смысл причастия в естественной русской форме.
- source_word: מוֹת יָמוּת
  choice: непременно умрёт
  rationale: Передаёт усилительную конструкцию абсолютного инфинитива с личной глагольной формой и подчёркивает несомненность исхода.
theological_decisions:
- issue: Синтаксическая роль выражения «враги Яхве»
  choice: 'Согласно представленному масоретскому тексту, враги Яхве оставлены объектом действия Давида: «ты выказал крайнее презрение к врагам Яхве».'
  alternative: «Ты дал врагам Яхве повод хулить» или «ты тяжко оскорбил Яхве».
  rationale: Представленный еврейский текст грамматически ставит אֹיְבֵי יְהוָה после показателя прямого дополнения אֶת. Хотя это чтение трудно по смыслу, его не следует молча исправлять; распространённое истолковательное или исправленное чтение приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка основного текста намеренно сохраняет смысловую трудность масоретского чтения; сноска сообщает распространённую альтернативу без её внесения в текст.
