    issue: Несоответствие в англоязычной аудиторской сноске и её якоре.
    rationale: В English POB сноска a стоит после “mourned”, но поясняет “Jonathan his son”; сноска b стоит после “house of Israel”, но поясняет “the people of Yahweh”. В русском тексте этих сносок нет, и смысловая передача от этого не страдает; однако это следует исправить в английской записи аудита, если она публикуется.
