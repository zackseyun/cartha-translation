  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: ru
  text: Они скорбели, плакали и постились до вечера о Сауле, о его сыне Ионафане, о народе Яхве и о доме Израиля, потому что они пали от меча.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: скорбели
  rationale: Глагол ספד обозначает траур по умершим, нередко выраженный в оплакивании. «Скорбели» естественно передаёт общий смысл и не смешивается со следующим, более конкретным «плакали».
- source_word: וַיִּבְכּוּ
  choice: плакали
  rationale: בכה прямо обозначает плач; современное русское «плакали» ясно и уместно в торжественном повествовании.
- source_word: וַיָּצֻמוּ
  choice: постились
  rationale: צום означает воздержание от пищи как выражение скорби или религиозного посвящения; «постились» является прямым и привычным соответствием.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Фраза указывает, как долго продолжались скорбь, плач и пост; «до вечера» естественно звучит по-русски.
- source_word: עַל
  choice: о
  rationale: Повторяющийся предлог עַל вводит тех, по ком совершается траур. Русская конструкция «скорбеть/плакать о ком-либо» здесь естественна; повтор «о» сохраняет структуру перечня.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: о его сыне Ионафане
  rationale: Суффикс «его» относится к Саулу. Такой порядок слов ясно передаёт родство и звучит естественнее по-русски, чем буквальное «об Ионафане, сыне его».
- source_word: עַם יְהוָה
  choice: о народе Яхве
  rationale: Сочетание буквально означает народ, принадлежащий Яхве; перевод сохраняет как коллективное обозначение, так и личное Божье имя.
- source_word: בֵּית יִשְׂרָאֵל
  choice: о доме Израиля
  rationale: «Дом Израиля» — традиционный и понятный библейский оборот с корпоративным значением; он не сводится без необходимости к одному слову «Израиль».
- source_word: כִּי
  choice: потому что
  rationale: כִּי вводит причину траура; «потому что» недвусмысленно выражает причинную связь в современном русском языке.
- source_word: נָפְלוּ
  choice: они пали
  rationale: נפל в контексте войны означает погибнуть. «Пали» сохраняет образ исходного глагола и его возвышенно-военный оттенок, не добавляя сведений сверх текста.
- source_word: בֶּחָרֶב
  choice: от меча
  rationale: Буквальный образ смерти от меча сохранён; выражение «пали от меча» естественно для русского библейского повествования и не обобщает его до «погибли в бою».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога, а не титул אֲדֹנָי. Транслитерация «Яхве» сохраняет это различие.
- issue: Соотношение выражений «народ Яхве» и «дом Израиля»
  choice: Сохранены как два отдельных элемента перечня
  alternative: Объединить или истолковать их как одно обозначение Израиля
  rationale: Исходный текст соединяет эти выражения повторяющимся וְעַל. Перевод сохраняет формальное различие и возможное смысловое напряжение, не решая, полностью ли совпадают названные группы.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным звучанием. Синтаксический параллелизм еврейского перечня сохранён повторением предлога «о». Архаизмы сведены к уместным и понятным библейским выражениям «дом Израиля» и «пали от меча».
