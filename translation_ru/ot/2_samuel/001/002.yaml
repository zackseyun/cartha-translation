base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: ru
  text: И вот, на третий день из стана, от Саула, пришёл человек с разорванной одеждой и землёй на голове[b][a]. Когда он пришёл к Давиду, он пал на землю и поклонился[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со стороны Саула»; еврейское выражение указывает на связь с Саулом или пребывание при нём, но не обязательно на то, что человек был послан Саулом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «земля на его голове» — общепринятый знак горя или траура.'
    reason: cultural_note
  - marker: c
    text: 'Или: «простёрся ниц». Этот глагол может обозначать глубокое почтение, подчинение или преклонение — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Естественно передаёт временную формулу и последовательность повествования без архаичного «и было».
- source_word: וְהִנֵּה
  choice: не передано отдельным словом
  rationale: Частица вводит неожиданно появившегося участника сцены; в современном русском эта функция естественно выражается самим порядком повествования, тогда как «вот» здесь звучало бы несколько искусственно.
- source_word: מִן־הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: из стана, от Саула
  rationale: «Стан» ясно указывает на военный лагерь, а «от Саула» сохраняет неоднозначность связи и не подразумевает обязательно, что Саул послал этого человека.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: Одежда на нём была разорвана
  rationale: Современная и ясная формулировка, передающая внешний знак скорби.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: голова посыпана землёй
  rationale: Передаёт буквально указанную землю и одновременно естественно выражает обычай посыпать голову в знак скорби.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: Подойдя к Давиду
  rationale: Естественный русский деепричастный оборот точно передаёт временное обстоятельство.
- source_word: וַיִּפֹּל אַרְצָה
  choice: он пал на землю
  rationale: Сохраняет направленность действия и достоинство библейского повествования.
- source_word: וַיִּשְׁתָּחוּ
  choice: поклонился
  rationale: Не уточняет преждевременно, был ли это поклон почтения, подчинения или почитания.
theological_decisions:
- issue: Характер поклона Давиду
  choice: поклонился
  alternative: простёрся ниц / воздал почтение
  rationale: Еврейский глагол допускает поклон как жест глубокого почтения или подчинения; перевод не вводит значения богопоклонения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Избегаются архаизмы вроде «и было» и конфессионально нагруженные уточнения. Все сноски привязаны к соответствующим местам основного текста.
