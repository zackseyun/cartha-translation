base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: ru
  text: Саул и Ионафан, любимые и милые[a] при жизни и в смерти не разлучились. Быстрее орлов[b], сильнее львов[c] были они.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приятные», «привлекательные».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «быстрее крупных хищных птиц». Еврейское слово может обозначать не только орла, но и грифа; «орлы» — традиционный и наиболее естественный здесь перевод.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «могущественнее львов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Саул и Ионафан
  rationale: Имена переданы в их традиционной русской библейской форме.
- source_word: הַנֶּאֱהָבִים
  choice: любимые
  rationale: Страдательно-прилагательное значение от אהב описывает их как тех, кого любили; слово естественно звучит в возвышенной погребальной песне.
- source_word: וְהַנְּעִימִם
  choice: и милые
  rationale: נעים обозначает приятность, привлекательность и расположение к человеку. «Милые» сохраняет поэтический параллелизм с «любимые», не сводя похвалу ни к нравственной безупречности, ни к внешней красоте.
- source_word: בְּחַיֵּיהֶם
  choice: при жизни
  rationale: Естественный современный русский оборот, передающий временное значение еврейского выражения.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: и в смерти не разлучились
  rationale: Сохранены образная симметрия жизни и смерти и значение нифаля от פרד — не быть разделёнными, не разлучиться.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: быстрее орлов были они
  rationale: В данном сравнении קלל выражает быстроту, а נשר традиционно и уместно в этом поэтическом контексте передаётся как «орёл».
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: сильнее львов были они
  rationale: גבר здесь выражает превосходство в силе; сравнительная конструкция передана кратко и поэтично.
theological_decisions:
- issue: Тон плача Давида о Сауле и Ионафане
  choice: Сохранить возвышенную совместную похвалу Саулу и Ионафану без оговорок и нравственных оценок.
  alternative: Ослабить похвалу Саулу из-за его прежних поступков либо усилить её до утверждения об их нравственном совершенстве.
  rationale: Стих является частью погребального плача и намеренно прославляет обоих погибших. Перевод сохраняет это напряжение с более широким повествованием о Сауле, не разрешая его за автора.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической интонацией. Инверсия в последнем предложении подчёркивает параллелизм двух сравнений и характер плача.
