- from: Горы Гелвуйские, да не будет на вас ни росы, ни дождя, ни полей приношений[a], ибо там был осквернён щит могучих, щит Саула, не помазанный маслом[b].
  to: Горы Гелвуя, да не будет на вас ни росы, ни дождя; да не будет и полей приношений[a], ибо там был осквернён щит могучих, щит Саула, не помазанный маслом[b].
  rationale: Исправлена синтаксическая неоднозначность, возникавшая из-за присоединения «полей приношений» к предложному обороту «на вас». Вторая отрицательная волевая конструкция воспроизводит поэтическое продолжение проклятия, не разрешая спорный смысл תְּרוּמוֹת. Топоним приведён к более естественной современной форме; прочие существенные решения и обе сноски сохранены.
