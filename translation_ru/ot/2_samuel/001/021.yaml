  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: ru
  text: Горы Гелвуя, да не будет на вас ни росы, ни дождя; да не будет и полей приношений[a], ибо там был осквернён щит могучих, щит Саула, не помазанный маслом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «ни плодоносных полей», «ни полей первых плодов» или «ни полей священных приношений». Еврейское выражение трудно для понимания; слово תְּרוּמוֹת часто означает приношения, отделённые для Бога.'
    reason: lexical_alternative
  - marker: b
    text: Последние слова, вероятно, означают, что щит Саула больше не был натёрт маслом, как обычно делали при подготовке кожаного щита к бою; речь здесь, по всей видимости, не о Сауле как «помазаннике».
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Горы Гелвуйские
  rationale: Сочетание передаёт прямое поэтическое обращение к горной области Гелвуй; традиционное русское прилагательное сохраняет возвышенное, но понятное звучание.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: да не будет на вас ни росы, ни дождя
  rationale: Конструкция с אַל выражает проклятие-пожелание; оборот «да не будет» естественно передаёт это значение и сохраняет прямое обращение.
- source_word: וּשְׂדֵי תְרוּמוֹת
  choice: ни полей приношений
  rationale: Трудное еврейское выражение сохранено без чрезмерного истолкования. תְּרוּמוֹת обычно обозначает выделенные приношения; основные альтернативы приведены в сноске.
- source_word: כִּי שָׁם
  choice: ибо там
  rationale: Передаёт основание проклятия и соответствует торжественно-поэтическому регистру плача.
- source_word: נִגְעַל
  choice: был осквернён
  rationale: Форма допускает значение осквернения или опозоренного состояния; выбранный вариант сохраняет образ поруганного щита, не добавляя деталей, отсутствующих в тексте.
- source_word: מָגֵן גִּבּוֹרִים
  choice: щит могучих
  rationale: Гִּבּוֹרִים может означать могучих людей или воинов. «Могучих» сохраняет краткость и возвышенный параллелизм плача.
- source_word: מָגֵן שָׁאוּל
  choice: щит Саула
  rationale: 'Сохранён appозиционный повтор: сначала щит могучих вообще, затем щит Саула в частности.'
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: не помазанный маслом
  rationale: Фраза наиболее естественно описывает щит, который не был натёрт или смазан маслом. Буквальный образ «помазанный» сохранён, а культурный смысл пояснён в сноске.
theological_decisions:
- issue: Возможное смешение מָשִׁיחַ с богословским титулом «Помазанник»
  choice: 'Фраза отнесена к щиту: «не помазанный маслом».'
  alternative: Отнести выражение к Саулу как к помазаннику или перевести «словно не помазанный маслом».
  rationale: Непосредственное сочетание с «маслом» и контекст описания павшего щита поддерживают обычное значение обработки щита маслом, а не мессианский титул. Сравнительное «словно» в еврейском прямо не выражено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом погребального плача. Сохранены прямое обращение, повтор слова «щит» и трудность выражения «поля приношений»; архаизмы и конфессионально окрашенные уточнения не вводились.
