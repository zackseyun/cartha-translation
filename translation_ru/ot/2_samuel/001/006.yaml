  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: ru
  text: 'И юноша, принёсший ему весть, сказал: «Я случайно оказался[a] на горе Гелвуй, и вот Саул опирается на своё копьё, и вот колесницы и всадники[b] настигли его[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально усиленная древнееврейская конструкция подчёркивает случайность: «случилось мне случайно оказаться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «колесничное войско и конники».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тесно преследовали его» или «настигали его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: юноша
  rationale: Передаёт обычное значение נַעַר в данном контексте и не привносит ни значения малолетства, ни служебного положения.
- source_word: הַמַּגִּיד לוֹ
  choice: принёсший ему весть
  rationale: Причастный оборот от נגד обозначает юношу как сообщающего Давиду известие; такая формулировка естественна для русского повествования.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: я случайно оказался
  rationale: Сочетание абсолютного инфинитива с личной формой подчёркивает случайность присутствия; русская формулировка передаёт смысл без неестественного буквального повтора.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: на горе Гелвуйской
  rationale: Традиционная и узнаваемая русская форма библейского географического названия, при этом конструкция с предлогом «на» естественна.
- source_word: וְהִנֵּה
  choice: и увидел / а
  rationale: Повторяющийся указательный маркер הִנֵּה передан средствами живого русского повествования; буквальное двукратное «вот» здесь звучало бы тяжеловесно.
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: опирается на своё копьё
  rationale: Причастие Niphal от שׁען выражает физическую опору; настоящее повествовательное время сохраняет непосредственность рассказа.
- source_word: הָרֶכֶב וּבַעֲלֵי הַפָּרָשִׁים
  choice: колесницы и всадники
  rationale: רֶכֶב может быть собирательным обозначением колесничного войска, а идиоматическое выражение בַעֲלֵי הַפָּרָשִׁים обозначает конных воинов; выбран ясный и доступный эквивалент.
- source_word: הִדְבִּקֻהוּ
  choice: уже настигают его
  rationale: Hiphil от דבק может означать догнать, настичь или тесно преследовать. Настоящее время передаёт разворачивающуюся сцену, а «уже» — непосредственную близость преследователей.
