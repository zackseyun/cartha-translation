  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: ru
  text: 'Тогда Давид позвал одного из юношей и сказал: «Подойди и порази его[a]». Тот поразил его, и он умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напади на него». Еврейское выражение פְּגַע בּוֹ может обозначать насильственное нападение вообще; контекст и последующее сообщение показывают, что исходом стала смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В повествовательном контексте קרא означает позвать или призвать; «позвал» естественно передаёт действие без излишней официальности.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: одного из юношей
  rationale: נְעָרִים может обозначать молодых людей, слуг или приближённых. Прямое «юношей» сохраняет возрастно-статусное значение исходного слова, не превращая его в название должности.
- source_word: גַּשׁ
  choice: Подойди
  rationale: Императив נגשׁ означает приблизиться, подойти; «подойди» естественно звучит в непосредственном приказе.
- source_word: פְּגַע בּוֹ
  choice: порази его
  rationale: פגע с ב может обозначать нападение или нанесение удара. В данном контексте приказ ведёт к смерти, однако сам глагол не является обычным прямым словом «убить»; «порази» сохраняет эту смысловую широту.
- source_word: וַיַּכֵּהוּ
  choice: Тот поразил его
  rationale: נכה — обычный глагол со значением «ударить, поразить». Последующая фраза отдельно сообщает о смерти, поэтому действие и его результат не объединены в «убил».
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: מות — стандартный глагол «умереть»; союз передаёт последовательность повествования.
