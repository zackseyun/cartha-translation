  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: ru
  text: Скорблю о тебе, брат мой Ионафан! Ты был мне очень дорог. Твоя любовь ко мне была дивной, превыше любви женщин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больше любви к женщинам»; или: «больше любви, которую проявляют женщины». Поэтическое еврейское сравнение само по себе не уточняет, что именно сопоставляется.'
