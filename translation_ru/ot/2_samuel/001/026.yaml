lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Скорблю о тебе
  rationale: Передаёт личную боль и скорбь Давида в контексте погребальной песни; «о тебе» естественно выражает направленность скорби, обозначенную עַל.
- source_word: אָחִי
  choice: брат мой
  rationale: Сохраняет буквальное обращение «мой брат» и его оттенок глубокой близости, не заменяя его толкованием вроде «друг».
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: Ты был мне очень дорог
  rationale: Глагол выражает приятность, отраду и привлекательность; буквальное «очень приятен» в современном русском звучит холодно и неестественно, тогда как «очень дорог» уместно передаёт смысл в контексте плача.
- source_word: נִפְלְאָתָה
  choice: была дивной
  rationale: Передаёт значение необычайности, изумительности и чудесности, сохраняя возвышенный поэтический регистр.
- source_word: אַהֲבָתְךָ לִי
  choice: Твоя любовь ко мне
  rationale: Естественно передаёт направленность любви Ионафана к Давиду, выраженную местоименным сочетанием с לִי.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: превыше любви женщин
  rationale: «Превыше» передаёт сравнительное מִן, а сочетание «любовь женщин» сохраняет поэтическую обобщённость и не уточняет, идёт ли речь о любви к женщинам или любви, проявляемой женщинами.
theological_decisions:
- issue: Смысл сопоставления с «любовью женщин»
  choice: Сохранить буквальное и неоднозначное сравнение, не определяя его как сексуальное, романтическое или исключительно дружеское.
  alternative: Уточнить как «превыше любви к женщинам» либо «превыше любви, которую дарят женщины».
  rationale: Еврейское выражение само по себе не устанавливает точную направленность родительного отношения и не помещает связь Давида и Ионафана в современные категории; перевод сохраняет эту поэтическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенной интонацией плача. Обращение «брат мой» и слово «дивной» поддерживают поэтический характер, не делая текст архаичным; синтаксис остаётся ясным для обычного читателя.
