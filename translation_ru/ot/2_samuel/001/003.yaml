  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: ru
  text: 'Давид спросил его: «Откуда ты пришёл?» Тот ответил: «Я спасся из лагеря Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: Откуда
  rationale: Сочетание спрашивает о месте происхождения или отправления; «Откуда» естественно и точно передаёт этот смысл по-русски.
- source_word: תָּבוֹא
  choice: ты пришёл
  rationale: Хотя в еврейском употреблена форма имперфекта, в данном вопросе она относится к уже совершённому прибытию собеседника; русское прошедшее время передаёт это естественно.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: спросил ... ответил
  rationale: В еврейском оба раза стоит обычный глагол «сказать», но контекст ясно выражает вопрос и ответ. Русские глаголы речи делают диалог естественным, не изменяя его содержания.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: из лагеря Израиля
  rationale: מַחֲנֶה обозначает военный лагерь; конструкция «лагерь Израиля» сохраняет связь с народом и военным контекстом.
- source_word: נִמְלָטְתִּי
  choice: я спасся
  rationale: Форма Niphal глагола מלט означает успешное избавление или бегство от опасности. «Спасся» передаёт достигнутый результат, не добавляя невыраженных подробностей.
- source_word: דָּוִד
  choice: Давид
  rationale: Использована устоявшаяся русская форма библейского имени.
