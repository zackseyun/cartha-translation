base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: ru
  text: Дочери Израиля, плачьте о Сауле, который одевал вас в алые одежды с изысками[a], возлагал на ваши одежды золотые украшения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с украшениями», «с роскошью» или «с наслаждениями».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «золотые драгоценности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: Дочери Израиля
  rationale: Сохраняет прямое обращение и поэтический образ еврейского текста; «женщины Израиля» было бы более разъясняющим и менее формально точным.
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: плачьте о Сауле
  rationale: В контексте погребальной песни предлог אֶל обозначает того, о ком совершается плач; русское выражение естественно передаёт призыв к оплакиванию.
- source_word: הַמַּלְבִּשְׁכֶם שָׁנִי
  choice: который одевал вас в багряницу
  rationale: Причастная конструкция относится к Саулу. «Багряница» кратко и поэтично обозначает дорогую одежду багряного цвета.
- source_word: עִם עֲדָנִים
  choice: с роскошью
  rationale: Редкое множественное существительное допускает значения наслаждений, изысков или украшений; «с роскошью» сохраняет общий смысл богатого убранства, не сводя его только к украшениям.
- source_word: הַמַּעֲלֶה
  choice: украшал
  rationale: Буквально причастие выражает возложение или помещение чего-либо сверху; в сочетании с золотыми уборами естественный русский эквивалент — «украшал».
- source_word: עֲדִי זָהָב
  choice: золотыми уборами
  rationale: Передаёт украшения или драгоценности из золота и сохраняет возвышенный поэтический регистр.
- source_word: עַל לְבוּשְׁכֶן
  choice: ваши одежды
  rationale: Включено как прямое дополнение при естественной русской перестройке «украшал ваши одежды», передающей исходное «возлагал ... на вашу одежду».
