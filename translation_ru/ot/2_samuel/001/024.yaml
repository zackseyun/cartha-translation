revisions:
- from: Дочери Израиля, плачьте о Сауле, который одевал вас в багряницу с роскошью[a], украшал ваши одежды золотыми уборами[b].
  to: Дочери Израиля, плачьте о Сауле, который одевал вас в алые одежды с изысками[a], возлагал на ваши одежды золотые украшения[b].
  rationale: Исправление устраняет неестественное сочетание «с роскошью» и неоправданно архаичное, более узкое «багряница». Сохранены прямое поэтическое обращение, плач о Сауле, образ богатых алых одежд и возложение золотых украшений на одежду. Сноски остаются привязанными к соответствующим неоднозначным выражениям и отражают допустимые лексические варианты без догматического толкования.
  reviewer_model: gpt-5.6-terra
