lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: И оплакал
  rationale: Глагол קונן означает исполнить или произнести погребальный плач. «Оплакал» естественно передаёт действие по-русски, не добавляя отсутствующего в еврейском тексте прямого указания на пение или сочинение.
- source_word: הַקִּינָה הַזֹּאת
  choice: этой плачевной песней
  rationale: קִינָה обозначает формальный плач по умершим, нередко поэтический. «Плачевная песнь» сохраняет жанровое значение и позволяет естественно передать внутреннюю фигуру «оплакивал плачем».
- source_word: עַל שָׁאוּל וְעַל יְהוֹנָתָן בְּנוֹ
  choice: Саула и его сына Ионафана
  rationale: После русского «оплакал» объект естественно ставится в винительном падеже; местоимение «его» относится к Саулу, как и суффикс בְּנוֹ в еврейском тексте.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Устоявшаяся русская библейская форма имени.
