base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: ru
  text: После смерти Саула Давид, вернувшись после разгрома амаликитян[a], пробыл в Циклаге два дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Амалика»; это собирательное обозначение амаликитян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: не передано отдельным словом
  rationale: Повествовательная формула вводит продолжение рассказа; в современном русском её функцию естественно передаёт само начало временного придаточного без тяжеловесного «и было».
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: После смерти Саула
  rationale: Сохраняет именную временную конструкцию еврейского текста и звучит естественно по-русски.
- source_word: וְדָוִד שָׁב
  choice: когда Давид возвратился
  rationale: Форма глагола обозначает действие, предшествующее основному событию; временная конструкция ясно передаёт последовательность без необходимости в громоздком русском плюсквамперфекте.
- source_word: מֵהַכּוֹת
  choice: разбив
  rationale: Глагол נכה в военном контексте означает нанесение поражения или поражение врага; «разбив» сохраняет военный смысл и не утверждает полного истребления.
- source_word: אֶת הָעֲמָלֵק
  choice: амаликитян
  rationale: Единственное собирательное название «Амалик» здесь обозначает народ; русское множественное этническое название наиболее ясно в основном тексте.
- source_word: וַיֵּשֶׁב
  choice: провёл
  rationale: При указанном кратком сроке «провёл два дня» естественнее русского «жил» и точно выражает временное пребывание.
- source_word: בְּצִקְלָג
  choice: в Циклаге
  rationale: Традиционная русская передача названия места с естественным предложным управлением.
- source_word: יָמִים שְׁנָיִם
  choice: два дня
  rationale: Прямо передаёт обстоятельство продолжительности.
