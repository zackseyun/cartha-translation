base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: ru
  text: 'И он сказал мне: «Стань надо мной, прошу, и убей меня, потому что меня охватила мука[a], хотя жизнь всё ещё во мне[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меня схватили судороги (спазмы)». Еврейское слово, переведённое как «мука», встречается редко, и его точное значение неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потому что вся моя жизнь (душа) ещё во мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И он сказал мне
  rationale: Прямо передаёт повествовательную последовательность и обращение к рассказчику.
- source_word: עֲמָד נָא עָלַי
  choice: Встань, прошу, надо мной
  rationale: Сохраняет значение עמד «стоять», предлог על «над» в сцене с лежащим раненым и вежливо-просительное נָא.
- source_word: וּמֹתְתֵנִי
  choice: и убей меня
  rationale: Каузативная форма глагола מות означает «причини мне смерть»; прямое «убей меня» естественно в современной русской речи и не смягчает просьбу.
- source_word: אֲחָזַנִי הַשָּׁבָץ
  choice: меня охватила мука
  rationale: אחז передаёт овладение или сильный захват, а редкое הַשָּׁבָץ имеет неясное точное значение. «Мука» сохраняет неопределённость, не навязывая конкретный медицинский диагноз.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: хотя жизнь всё ещё во мне
  rationale: נפש здесь обозначает жизненную силу или жизнь, а не обязательно нематериальную «душу». «Хотя» естественно передаёт вероятный уступительный смысл второго כִּי в контексте, при этом буквальная конструкция отмечена в сноске.
theological_decisions:
- issue: Значение נֶפֶשׁ
  choice: жизнь
  alternative: душа
  rationale: В данном контексте речь идёт о продолжающейся физической жизни смертельно раненого; перевод «душа» мог бы внести не требуемое текстом антропологическое уточнение.
- issue: Связь заключительной части с просьбой о смерти
  choice: уступительное «хотя»
  alternative: причинное «ведь/потому что»
  rationale: 'Формально כִּי часто имеет причинное значение, но здесь контекст поддерживает уступительное понимание: несмотря на мучительное состояние, жизнь ещё остаётся в нём. Буквальная форма сохранена в примечании.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Просьба передана прямо, без архаизма «умертви» и без медицинской конкретизации редкого еврейского термина.
