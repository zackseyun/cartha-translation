  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: ru
  text: 'Не рассказывайте об этом в Гате,

    не возвещайте об этом на улицах Аскалона,

    чтобы не радовались дочери филистимлян,

    чтобы не ликовали дочери необрезанных[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Необрезанные» — буквальное заветно-полемическое обозначение филистимлян.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: не рассказывайте об этом
  rationale: Глагол נגד означает «рассказывать, сообщать, объявлять». Местоименное «об этом» естественно передаёт подразумеваемую из контекста весть о гибели Саула и Ионафана, не вводя её содержания в стих.
- source_word: בְגַת
  choice: в Гате
  rationale: Предлог употреблён в местном значении; название филистимского города передано в принятой русской библейской форме.
- source_word: תְּבַשְּׂרוּ
  choice: не возвещайте
  rationale: Пиэль глагола בשר обозначает принесение или публичное провозглашение вести. «Возвещайте» сохраняет поэтический регистр и параллелизм, отличаясь по оттенку от «рассказывайте».
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: на улицах Аскалона
  rationale: חוּצוֹת может обозначать улицы или открытые городские пространства; «на улицах» естественно выражает публичную обстановку. Название передано в принятой русской форме «Аскалон».
- source_word: פֶּן
  choice: чтобы не
  rationale: Частица вводит предостережение о нежелательном результате. Русское «чтобы не» естественно и дважды сохраняет параллельную структуру еврейского стиха.
- source_word: תִּשְׂמַחְנָה
  choice: радовались
  rationale: שמח выражает радость; нейтральное «радовались» позволяет более сильному следующему глаголу получить оттенок усиления.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: дочери филистимлян
  rationale: Буквальная формулировка сохраняет поэтическое обозначение женщин филистимского народа и параллель со следующей строкой.
- source_word: תַּעֲלֹזְנָה
  choice: ликовали
  rationale: עלז обозначает бурную, торжествующую радость. «Ликовали» передаёт усиление относительно «радовались» и соответствует стилю плача.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: дочери необрезанных
  rationale: עֲרֵלִים буквально означает «необрезанные». Передача сохраняет этнорелигиозное, заветное и полемическое звучание выражения, не заменяя его более общим толкованием.
theological_decisions:
- issue: Передача заветно-полемического обозначения הָעֲרֵלִים
  choice: необрезанных
  alternative: язычников
  rationale: В еврейском тексте обозначение прямо связано с отсутствием обрезания как знака заветной принадлежности. Буквальная передача сохраняет богословскую и риторическую напряжённость, тогда как «язычников» обобщает смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Строчный параллелизм еврейского плача сохранён; различие между «радовались» и более сильным «ликовали» передаёт нарастание выражения.
