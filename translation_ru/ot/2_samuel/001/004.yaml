base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: ru
  text: 'Давид спросил его: «Что произошло?[a] Расскажи мне, пожалуйста». Тот ответил: «Народ бежал с поля боя; многие из народа пали и погибли[b]. Также умерли Саул и Ионафан, его сын[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что было за дело?» Возможный перевод: «Что случилось?»'
    reason: lexical_alternative
  - marker: b
    text: «Пали» — обычное древнееврейское выражение о сражённых в бою; последующее «и погибли» прямо указывает на результат.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Также Саул и Ионафан, его сын, умерли». Возможный перевод: «Саул и его сын Ионафан также мертвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: Что произошло?
  rationale: Еврейское выражение буквально означает «что было за дело?», но в данном контексте Давид просит сообщить, чем завершились события. Современное русское «Что произошло?» естественно передаёт смысл идиомы.
- source_word: הַגֶּד נָא לִי
  choice: Расскажи мне, пожалуйста
  rationale: Императив הַגֵּד означает «расскажи, сообщи», а частица נָא придаёт просьбе оттенок вежливости или настойчивости.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: Народ бежал с поля боя
  rationale: נָס означает «бежал», а מִן הַמִּלְחָמָה здесь указывает на бегство из сражения. «С поля боя» звучит естественно по-русски и соответствует военному контексту.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: многие из народа пали и погибли
  rationale: В военном контексте נפל — обычное обозначение павших или сражённых. Сохранено отдельное וַיָּמֻתוּ («и погибли»), чтобы не сливать два еврейских глагола и передать явное указание на смерть.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: Погибли также Саул и его сын Ионафан
  rationale: Форма מֵתוּ прямо сообщает об их смерти. Прошедшее время «погибли» естественно для русского повествовательного отчёта; указание «его сын» сохранено.
