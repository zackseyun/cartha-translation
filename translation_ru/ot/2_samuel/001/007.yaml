    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Он обернулся
  rationale: Буквально выражение означает «повернулся назад/за себя»; в данном пространственном контексте естественное русское соответствие — «обернулся».
- source_word: וַיִּרְאֵנִי
  choice: и увидел меня
  rationale: Форма глагола ראה с суффиксом первого лица прямо означает «увидел меня».
- source_word: וַיִּקְרָא אֵלַי
  choice: затем позвал меня
  rationale: קרא с אֶל означает обращённый к человеку зов. «Позвал меня» естественно передаёт смысл, не усиливая его до «приказал подойти».
- source_word: וָאֹמַר
  choice: и я ответил
  rationale: Хотя אמר буквально значит «сказал», после обращения к говорящему русское «ответил» естественно выражает дискурсивную связь, не меняя содержания.
- source_word: הִנֵּנִי
  choice: Я здесь
  rationale: Устойчивая формула самопредъявления и готовности откликнуться; «Я здесь» сохраняет её краткость и естественно звучит по-русски.
