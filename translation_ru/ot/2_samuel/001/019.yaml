  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: ru
  text: Слава твоя[a], Израиль, сражена на твоих высотах[b]! Как пали могучие!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское צְבִי можно также перевести как «краса» или «великолепие»; некоторые понимают его буквально: «газель».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на твоих возвышенностях». Здесь имеются в виду высоты местности, а не обязательно культовые места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: Слава твоя
  rationale: צְבִי может означать красу, великолепие или славу, а также газель. В плаче о Сауле и Ионафане переносное значение естественно обозначает славу Израиля; притяжательное «твоя» согласует обращение с последующим «твоих».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя передано традиционной русской формой и оформлено как прямое обращение.
- source_word: עַל בָּמוֹתֶיךָ
  choice: на твоих высотах
  rationale: 'Сохраняется пространственное и поэтическое значение: речь идёт о возвышенностях Израиля, без ненужного указания на культовые высоты.'
- source_word: חָלָל
  choice: сражена
  rationale: Слово обозначает убитого, павшего; форма женского рода согласована с выбранным словом «слава» и передаёт состояние после гибели.
- source_word: אֵיךְ נָפְלוּ
  choice: Как пали
  rationale: Краткая восклицательная формула естественно передаёт рефрен погребального плача.
- source_word: גִבּוֹרִים
  choice: могучие
  rationale: גִבּוֹרִים может обозначать могучих людей, героев или воинов. «Могучие» сохраняет широту и поэтическую силу выражения.
