  rationale: Исправлена русская референциальная неоднозначность в обороте о падении Саула; формулировка убийства сделана семантически прямой, без оттенка судебной казни; заключительная фраза приведена к более естественному современному литературному синтаксису. Сноски и их маркеры сохранены, а утверждение амаликитянина не гармонизируется с 1 Царств 31.
