base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: ru
  text: Я встал над ним и умертвил его, потому что знал, что после его падения он не выживет. Затем я снял венец с его головы и браслет[a] с его руки и принёс их сюда, к моему господину.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украшение на руку». Еврейское слово обозначает украшение, которое носили на руке.'
    reason: lexical_alternative
  - marker: b
    text: Так амаликитянин рассказывает Давиду о смерти Саула. Сравните более ранний рассказ в 1 Царств 31:4–5.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: я встал над ним
  rationale: Сочетание עמד с על здесь описывает положение амаликитянина над лежащим Саулом; буквальное «на нём» по-русски передавало бы иной смысл.
- source_word: וַאֲמֹתְתֵהוּ
  choice: предал его смерти
  rationale: Каузативная форма глагола מות прямо означает причинить смерть. Формулировка сохраняет торжественно-повествовательный регистр, не смягчая заявления говорящего.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: потому что знал, что ... он не выживет
  rationale: Переданы обе части конструкции с כִּי; «не выживет» естественно выражает невозможность остаться в живых после падения.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: после своего падения
  rationale: Субстантивированная инфинитивная конструкция передана временным оборотом без уточнения характера падения, которого нет в еврейском тексте.
- source_word: הַנֵּזֶר
  choice: венец
  rationale: Здесь имеется в виду царский головной знак. «Венец» сохраняет достоинство регистра и привычен в библейском повествовании, оставаясь понятным современному читателю.
- source_word: וְאֶצְעָדָה
  choice: браслет
  rationale: Редкое слово обозначает украшение, носимое на руке. «Браслет» — наиболее естественный современный русский эквивалент; место ношения пояснено сноской.
- source_word: זְרֹעוֹ
  choice: с его руки
  rationale: זְרוֹעַ обозначает руку, нередко от плеча до кисти; более узкое «предплечье» текстом не требуется.
- source_word: וָאֲבִיאֵם ... הֵנָּה
  choice: принёс их сюда
  rationale: Простое прошедшее время отражает последовательность wayyiqtol, а «сюда» сохраняет дейктическое значение הֵנָּה в прямой речи.
- source_word: אֶל אֲדֹנִי
  choice: моему господину
  rationale: אֲדֹנִי здесь — почтительное обращение к Давиду как к человеческому господину, а не божественный титул.
theological_decisions:
- issue: Рассказ о смерти Саула
  choice: 'Передать слова амаликитянина прямо: он утверждает, что сам умертвил Саула.'
  alternative: Смягчить или переиначить его заявление ради согласования с 1 Царств 31:4–5.
  rationale: Стих сообщает речь персонажа, не вынося здесь оценки её достоверности. Напряжение с предшествующим повествованием следует сохранить, а не устранять внутри перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис прямой и понятный; заявление амаликитянина сохранено без гармонизирующих добавлений. Все сноски отмечены в основном тексте.
