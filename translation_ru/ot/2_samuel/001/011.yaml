translation:
  language: ru
  text: Тогда Давид схватился за свою одежду и разодрал её; так же поступили и все мужчины, бывшие с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: схватился за
  rationale: Передаёт физическое действие — Давид берётся за одежду, чтобы разодрать её, — и естественно звучит по-русски.
- source_word: בִּבְגָדוֹ
  choice: свою одежду
  rationale: Еврейское слово стоит в единственном числе; русское «одежду» сохраняет эту форму и естественно обозначает предмет одежды без необоснованного уточнения его вида.
- source_word: וַיִּקְרָעֵם
  choice: разодрал её
  rationale: Глагол קרע означает разрывать одежду; «разодрал» уместно передаёт традиционный жест скорби. Хотя масоретский суффикс формально множественного числа, ближайшее существительное בגדו стоит в единственном; русский перевод согласован по смыслу с «одежду».
- source_word: וְגַם
  choice: так же поступили и
  rationale: Естественно восполняет эллипсис и показывает, что находившиеся рядом мужчины повторили действие Давида.
- source_word: כָּל הָאֲנָשִׁים
  choice: все ... люди
  rationale: В данном повествовательном контексте אֲנָשִׁים обозначает находившихся при Давиде мужчин; русское «люди» здесь естественно и не меняет состав названной группы.
- source_word: אֲשֶׁר אִתּוֹ
  choice: бывшие с ним
  rationale: Кратко и непосредственно передаёт относительное придаточное, обозначающее спутников Давида.
