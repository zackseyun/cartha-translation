source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: ru
  text: 'И сказал ему Давид: «Кровь твоя — на твоей голове[a], потому что твои же уста свидетельствовали против тебя, сказав[b]: „Я сам убил помазанника Яхве“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с оттенком приговора: «Да будет кровь твоя на твоей голове». Это древнееврейское выражение возлагает ответственность за смерть человека на него самого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дав свидетельство против тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: И сказал ему Давид
  rationale: 'Последовательная форма с וַ передвигает повествование вперёд; русское «и сказал» естественно сохраняет библейскую повествовательную связь, а אֵלָיו передано явно: «ему».'
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Кровь твоя — на твоей голове
  rationale: Сохранён древнееврейский судебный образ, возлагающий на человека ответственность за его собственную смерть. Множественная форма דָּמֶיךָ в этом устойчивом выражении естественно передаётся по-русски собирательным единственным числом «кровь».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание вынесенного Давидом приговора.
- source_word: פִּיךָ
  choice: твои же уста
  rationale: Сохранена метонимия части тела, подчёркивающая самообвинение через сказанные слова; частица «же» естественно передаёт этот акцент по-русски.
- source_word: עָנָה בְךָ
  choice: свидетельствовали против тебя
  rationale: В судебном контексте сочетание означает выступить со свидетельством против кого-либо; выбранная формулировка ясно передаёт юридический смысл.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Причастная конструкция естественно вводит содержание свидетельства и согласуется с русским синтаксисом.
- source_word: אָנֹכִי
  choice: Я сам
  rationale: Самостоятельное местоимение אָנֹכִי эмфатично; «сам» сохраняет подчёркнутое самообвинение.
- source_word: מֹתַתִּי
  choice: убил
  rationale: Форма означает причинение смерти; «убил» — прямой, современный и контекстуально точный русский эквивалент.
- source_word: מְשִׁיחַ יְהוָה
  choice: помазанника Яхве
  rationale: מְשִׁיחַ здесь обозначает Саула как посвящённого на царство, поэтому переводится как титул «помазанник», без привнесения более позднего специального значения слова «Мессия».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что сохраняет различие между именем Бога и обозначением «Господь».
theological_decisions:
- issue: Передача формулы דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: «Кровь твоя — на твоей голове» как утверждение ответственности
  alternative: «Да будет кровь твоя на твоей голове» как формула пожелания или приговора
  rationale: В именной древнееврейской фразе связка и наклонение не выражены явно. Основной текст естественно понимает слова как объявление собственной ответственности амаликитянина, а сноска сохраняет формально возможный оттенок приговора.
- issue: Значение מְשִׁיחַ в данном повествовании
  choice: помазанник
  alternative: Мессия
  rationale: Речь идёт о царе Сауле как помазанном на царство; перевод «Мессия» мог бы неоправданно внести в повествование позднейшие христологические ассоциации.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное божественное имя; его передача транслитерацией сохраняет лексическое различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства судебной речи и ключевых древнееврейских образов. Порядок слов «И сказал ему Давид» слегка приподнят, но понятен и уместен в повествовании; остальная фраза построена естественно для современного читателя.
