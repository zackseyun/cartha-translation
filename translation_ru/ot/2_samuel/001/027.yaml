  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: ru
  text: Как пали могучие, и погибло оружие войны![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боевые орудия» или «военное снаряжение». Еврейское выражение обозначает военное оснащение в широком смысле, а не только наступательное оружие.'
    reason: lexical_alternative
  - marker: b
    text: «Оружие войны» можно понимать образно — как указание на самих Саула и Ионафана, военную силу Израиля; возможно и буквальное прочтение.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Вводит скорбное восклицание, а не вопрос; сохраняет поэтический рефрен плача.
- source_word: נָפְלוּ
  choice: пали
  rationale: В контексте плача означает гибель в бою; краткая форма естественна для возвышенной русской поэзии и сохраняет повторяющийся рефрен.
- source_word: גִבּוֹרִים
  choice: могучие
  rationale: Обозначает доблестных и сильных воинов, но не сводит выражение только к военному званию; субстантивированное прилагательное сохраняет лаконичность оригинала.
- source_word: וַיֹּאבְדוּ
  choice: погибло
  rationale: Передаёт значение утраты или гибели и допускает как буквальное уничтожение военного снаряжения, так и образное указание на погибших воинов.
- source_word: כְּלֵי מִלְחָמָה
  choice: оружие войны
  rationale: Естественно передаёт сочетание «предметы/орудия войны» и сохраняет возможность как буквального, так и метафорического прочтения. Единственное число «оружие» в русском имеет собирательное значение.
theological_decisions:
- issue: Относится ли «оружие войны» к военному снаряжению или образно к Саулу и Ионафану
  choice: Сохранено двусмысленное выражение «оружие войны» без пояснения в основном тексте.
  alternative: Передать прямо как «воины» либо только как «боевое снаряжение».
  rationale: Контекст допускает метафорическое обозначение Саула и Ионафана как военной силы Израиля, тогда как сама еврейская фраза может обозначать и реальные предметы военного назначения; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Краткая, ритмичная строка в возвышенном, но понятном современном литературном русском. Формы «пали» и «могучие» поддерживают жанр погребального плача без архаизации; пунктуация сохраняет силу заключительного восклицания.
