  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: ru
  text: 'и велел научить сынов Иуды песне «Лук». Вот, она записана в Книге Праведного:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְלַמֵּד
  choice: велел научить
  rationale: Инфинитив с ל после ויאמר передаёт распоряжение Давида; по-русски естественно выразить его конструкцией «велел научить».
- source_word: בְּנֵי יְהוּדָה
  choice: сынов Иуды
  rationale: Сохранена традиционная библейская форма, обозначающая людей колена Иуды.
- source_word: קָשֶׁת
  choice: «Луку»
  rationale: Слово буквально означает «лук». Кавычки отражают вероятное понимание как названия плача или песни, не устраняя полностью присущую еврейскому тексту краткость и неоднозначность.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Книге Праведного
  rationale: Буквально «книга Праведного/Прямого»; собственное наименование передано семантически и с прописных букв.
theological_decisions:
- issue: Статус слова קשת
  choice: Оформить «Лук» как название произведения
  alternative: 'Передать без кавычек: «научить сынов Иуды владеть луком»'
  rationale: Контекст вводит следующий поэтический плач, а английский консультационный слой также понимает слово как заглавие. При этом буквальное значение сохранено.
- issue: Идентификация ספר הישר
  choice: Книга Праведного
  alternative: Книга Яшара
  rationale: Еврейское определение допускает смысловой перевод; текст не отождествляет эту книгу с каким-либо позднейшим произведением, поэтому дополнительная идентификация не вносится.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Начальное «и» сохранено как связь с предыдущим стихом; «Вот» передаёт הִנֵּה без архаичного «се».
