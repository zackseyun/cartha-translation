  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: ru
  text: 'Тогда Давид спросил юношу, сообщившего ему: «Откуда ты знаешь, что Саул и его сын Ионафан умерли?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Давид спросил
  rationale: Форма с последовательным וַ продвигает повествование; глагол «спросил» естественно передаёт функцию реплики, которая непосредственно оформлена как вопрос.
- source_word: הַנַּעַר
  choice: юношу
  rationale: נַעַר здесь обозначает молодого мужчину, способного сообщить о событиях сражения; «юноша» сохраняет указание на возраст без смысла «слуга».
- source_word: הַמַּגִּיד לוֹ
  choice: принёсшего ему эту весть
  rationale: Причастие идентифицирует юношу как сообщающего Давиду. Такая формулировка естественна по-русски и сохраняет значение донесения вести.
- source_word: אֵיךְ יָדַעְתָּ
  choice: Откуда ты знаешь
  rationale: Буквальное «как ты узнал» возможно, но в данном контексте Давид спрашивает об основании знания; современное русское «откуда ты знаешь» передаёт это прямо и естественно.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание знания.
- source_word: מֵת
  choice: погибли
  rationale: Единственное число сказуемого при составном подлежащем допустимо в древнееврейском. Русское множественное число необходимо; «погибли» естественно в военном контексте и обозначает смерть обоих.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Местоименный суффикс относится к Саулу и прямо обозначает Ионафана как его сына.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Саул и Ионафан
  rationale: Использованы традиционные русские библейские формы личных имён.
