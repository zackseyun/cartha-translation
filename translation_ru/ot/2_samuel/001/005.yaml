revisions:
- from: 'Тогда Давид спросил юношу, принёсшего ему эту весть: «Откуда ты знаешь, что Саул и его сын Ионафан погибли?»'
  to: 'Тогда Давид спросил юношу, сообщившего ему: «Откуда ты знаешь, что Саул и его сын Ионафан умерли?»'
  rationale: Заменено «погибли» на нейтральное «умерли», чтобы не добавлять обстоятельства смерти, которых исходный текст здесь не выражает. Формулировка «сообщившего ему» сохраняет естественный русский синтаксис и ближе передаёт значение определительного причастия «сообщающий ему».
