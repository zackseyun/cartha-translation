  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: ru
  text: Как пали могучие посреди битвы! Ионафан лежит убитый на твоих высотах[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на твоих возвышенностях». Еврейское слово обозначает возвышенные места. К кому относится «твоих», не вполне ясно: оно может относиться к Ионафану или быть поэтическим обращением к местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Вводит скорбное восклицание, а не вопрос; сохраняет поэтическую силу и повторяющийся мотив плача.
- source_word: נָפְלוּ
  choice: пали
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённость действия и торжественно-трагический тон.
- source_word: גִבֹּרִים
  choice: могучие
  rationale: Передаёт доблесть и силу павших, не сужая значение до формального воинского звания; поддерживает поэтический регистр.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: посреди битвы
  rationale: Сохраняет значение нахождения в самой гуще сражения и звучит естественно в русском поэтическом плаче.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная и общепонятная русская передача библейского имени.
- source_word: עַל
  choice: на
  rationale: Естественно передаёт пространственное значение предлога.
- source_word: בָּמוֹתֶיךָ
  choice: твоих высотах
  rationale: Сохраняет образ возвышенной местности и местоименный суффикс второго лица, не привнося культового смысла выражения «высоты» как святилища.
- source_word: חָלָל
  choice: сражён
  rationale: Передаёт значение убитого, павшего человека; краткая предикативная форма соответствует эллиптичности и напряжённости еврейской строки.
theological_decisions:
- issue: К кому относится суффикс второго лица в בָּמוֹתֶיךָ («твоих высотах»)
  choice: Сохранено «твоих», понимаемое как поэтическое обращение к земле Израиля или её горам.
  alternative: Отнесение «твоих высот» непосредственно к Ионафану.
  rationale: Контекст плача допускает олицетворённое обращение к земле; буквальная местоименная форма сохраняет имеющуюся в еврейском тексте неоднозначность, не закрепляя её скрыто за одним референтом.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом погребального плача. Повторяющаяся формула передана как «Как пали могучие», а инверсия второй строки сохраняет поэтическую выразительность без архаизации.
