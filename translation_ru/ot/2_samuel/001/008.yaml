  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: ru
  text: 'Он спросил меня: «Кто ты?» Я ответил ему[a]: «Я амаликитянин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «и он сказал ему»; по контексту имеется в виду ответ рассказчика Саулу: «и я сказал ему».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Он спросил меня
  rationale: 'Глагол «сказал» вводит прямой вопрос, поэтому по-русски естественно и точно передать его как «спросил»; לִי обозначает адресата: «меня».'
- source_word: מִי אָתָּה
  choice: Кто ты?
  rationale: Естественная русская передача именного вопросительного предложения с местоимением второго лица мужского рода.
- source_word: ויאמר אֵלָיו
  choice: Я ответил ему
  rationale: Масоретский текст буквально имеет форму «и он сказал ему», однако в рассказе амаликитянина по смыслу отвечает сам рассказчик Саулу. «Ответил» естественно выражает функцию реплики, а сноска сохраняет формальную трудность текста.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: Я амаликитянин
  rationale: Именное предложение самоидентификации; в современном русском связка «есть» не требуется. Этноним передан общепринятой формой «амаликитянин».
theological_decisions: []
