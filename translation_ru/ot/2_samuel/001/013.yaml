  terminology: «Амаликитянин» — традиционное и корректное этническое наименование. «Переселенец» — приемлемая современная передача גֵּר, если не вкладывать в неё современный юридический статус. Сноска должна нейтрально фиксировать, к кому относится определение «переселенец», не меняя направления двух разборов.
