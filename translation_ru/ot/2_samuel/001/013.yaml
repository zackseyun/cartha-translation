base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: ru
  text: 'Давид спросил юношу, который принёс ему эту весть: «Ты откуда?» Тот ответил: «Я сын амаликитянина, переселенца».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также понять так: «Я сын переселенца-амаликитянина». Основной перевод может означать, что отец говорящего был амаликитянином, жившим переселенцем в чужой земле; альтернативный порядок слов связывает этническое определение с переселенцем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: юноша
  rationale: Слово обозначает молодого мужчину и здесь не требует значения «слуга».
- source_word: הַמַּגִּיד לוֹ
  choice: который принёс ему эту весть
  rationale: Причастие от נגד указывает на принесшего Давиду сообщение; такая передача естественна по-русски и сохраняет связь с предшествующим рассказом.
- source_word: אֵי מִזֶּה
  choice: Ты откуда?
  rationale: Естественная современная передача вопроса о происхождении.
- source_word: בֶּן אִישׁ
  choice: сын
  rationale: Буквальное «сын человека/мужчины» в русском избыточно; оборот выражает родственную принадлежность.
- source_word: גֵּר
  choice: переселенец
  rationale: Передаёт живущего не на своей исконной земле чужеземца, не используя архаичное «пришелец» и не сводя значение к краткому пребыванию.
- source_word: עֲמָלֵקִי
  choice: амаликитянин
  rationale: Традиционное русское этническое наименование потомка Амалика.
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение подчёркивает самоидентификацию; в русском она естественно выражена конструкцией «Я сын…».
