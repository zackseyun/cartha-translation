  source_fidelity: 'Основной текст точно передаёт вопрос Давида, идентификацию юноши как вестника и его ответ. Однако сноска неверно описывает второй возможный синтаксический разбор: вариант «сын переселенца-амаликитянина» не может соответствовать утверждению, что он указывает на отца как на амаликитянина, поселившегося среди чужого народа; это значение передаёт основной порядок «амаликитянина, переселенца».'
