base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: ru
  text: 'От крови убитых, от жира[a] могучих

    лук Ионафана не отступал назад[b],

    и меч Саула не возвращался пустым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «жир» может также подразумевать лучшую или самую ценную часть, усиливая образ победы в бою.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не обращался назад». Древнееврейский глагол может означать отступление или движение назад.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: от крови убитых
  rationale: Предлог מִן сохраняет образ удаления от крови или соприкосновения с ней, а חֲלָלִים в военном контексте естественно обозначает убитых в бою.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: от жира могучих
  rationale: Буквальное «жир» сохраняет резкий телесный образ древнееврейской военной поэзии; «могучих» передаёт גִּבּוֹרִים в возвышенном регистре и подразумевает сильных воинов.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: лук Ионафана
  rationale: Естественная русская передача сопряжённой конструкции, сохраняющая краткость и поэтический параллелизм.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: не отступал назад
  rationale: Форма глагола נסוג с אָחוֹר выражает отступление или обращение назад; выбранный вариант сохраняет олицетворение оружия и допускаемую оригиналом образность.
- source_word: וְחֶרֶב שָׁאוּל
  choice: и меч Саула
  rationale: Сопряжённая конструкция передана естественно по-русски и параллельно выражению «лук Ионафана».
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: не возвращался пустым
  rationale: Передаёт идиому о действенности оружия, не разъясняя сверх текста его смертоносный результат, и сохраняет поэтическое олицетворение.
