source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: ru
  text: 'И сказал ему Давид: «Как же ты не побоялся поднять руку на помазанника Яхве, чтобы погубить его?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему ты не побоялся…?» Еврейское אֵיךְ буквально означает «как?» и здесь выражает потрясённый укор.'
    reason: lexical_alternative
  - marker: b
    text: «Помазанник Яхве» — царь, посвящённый на царство помазанием по воле Яхве; здесь имеется в виду Саул.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: И сказал ему Давид
  rationale: Последовательная форма с וַ־ продвигает повествование; русское «И сказал» естественно сохраняет библейскую повествовательную связь.
- source_word: אֵיךְ לֹא יָרֵאתָ
  choice: Как же ты не побоялся
  rationale: «Как же» сохраняет буквальное значение אֵיךְ («как?») и передаёт потрясённый укор; частица «же» делает эту силу естественной по-русски.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: поднять руку на
  rationale: Русский устойчивый оборот точно передаёт еврейскую идиому насильственного действия против человека, не требуя буквального и менее естественного «простереть руку».
- source_word: לְשַׁחֵת
  choice: чтобы погубить его
  rationale: Инфинитив выражает цель действия; «погубить» сохраняет значение уничтожения и в контексте ясно указывает на лишение жизни. Местоимение «его» добавлено для естественности русского синтаксиса, его референт однозначен.
- source_word: מְשִׁיחַ
  choice: помазанника
  rationale: В данном историческом контексте слово обозначает Саула как царя, посвящённого помазанием, а не употребляется непосредственно как позднейший мессианский титул.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между Божьим именем и титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация личного имени точнее отражает форму источника, тогда как «Господь» является традиционной заменой титулом.
- issue: Значение מְשִׁיחַ применительно к Саулу
  choice: помазанник Яхве
  alternative: мессия Яхве
  rationale: Здесь речь о царском помазании Саула. «Помазанник» сохраняет смысл слова, не привнося в повествование более поздние мессианские ассоциации.
- issue: Характер вопроса אֵיךְ לֹא יָרֵאתָ
  choice: Как же ты не побоялся
  alternative: Почему ты не побоялся
  rationale: Исходное «как?» выражает потрясённый укор. Выбранная формулировка сохраняет и лексическую форму, и риторическую силу, не сводя её к запросу о причине.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Поднять руку на» — ясная современная идиома; «Как же» сохраняет эмоциональную и риторическую напряжённость оригинала.
