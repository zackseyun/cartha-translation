base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: ru
  text: Поэтому я буду славить Тебя[a] среди народов, Яхве, и буду воспевать Твоё имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду благодарить Тебя». Еврейский глагол может выражать как хвалу, так и благодарение.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Выражение вводит вывод из предшествующего рассказа об избавлении; «поэтому» кратко и ясно передаёт причинно-следственную связь.
- source_word: אוֹדְךָ
  choice: я буду славить Тебя
  rationale: Форма от ידה в данном контексте означает публично воздавать хвалу или благодарение. «Славить» естественно сочетается с последующим «воспевать», не исключая оттенка благодарности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает здесь народы вне Израиля; «среди народов» сохраняет международный и публичный характер хвалы без более поздних ассоциаций слова «язычники».
- source_word: וּלְשִׁמְךָ
  choice: и буду воспевать Твоё имя
  rationale: Сочетание предлога ל со словом «имя» при זמר естественно передаётся по-русски как «воспевать имя»; слово «имя» сохраняет смысл явленной личности и славы Бога.
- source_word: אֲזַמֵּר
  choice: буду воспевать
  rationale: Порода пиэль глагола זמר указывает на пение или музицирование в хвале; «воспевать» передаёт это ёмко и поэтично.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное имя Бога. Транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального истолкования.
- issue: Оттенок значения אוֹדְךָ
  choice: буду славить Тебя
  alternative: буду благодарить Тебя
  rationale: Еврейский глагол допускает оба оттенка. В параллели с «буду воспевать» на первом плане стоит хвала, однако оттенок благодарения остаётся возможным и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк сохранён; местоимения, обращённые к Богу, написаны с прописной буквы. Имя «Яхве» передано напрямую по еврейскому тексту.
