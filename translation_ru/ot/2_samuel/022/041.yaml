  text: 'Ты заставил моих врагов повернуться ко мне спиной[a];

    я истребил ненавидевших меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ты дал мне затылок (или: шею) моих врагов» — образ врагов, обращённых в бегство перед победителем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Существительное אֹיֵב обычно означает «враг», а суффикс первого лица единственного числа передаёт значение «моих».
- source_word: תַּתָּה לִּי עֹרֶף
  choice: заставил… повернуться ко мне спиной
  rationale: Буквально оборот говорит о том, что Бог «дал мне затылок/шею» врагов; это образ бегущего противника. Перевод раскрывает идиоматический смысл и сохраняет образ поворота спиной.
- source_word: מְשַׂנְאַי
  choice: ненавидевших меня
  rationale: Субстантивированное причастие от שׂנא с суффиксом первого лица обозначает тех, кто ненавидел говорящего; прошедшее время естественно согласуется с повествовательным контекстом.
- source_word: וָאַצְמִיתֵם
  choice: я истребил
  rationale: Глагол צמת в породе Hiphil означает уничтожить, истребить или положить конец. «Истребил» передаёт силу исходного глагола и соответствует возвышенному поэтическому регистру.
