base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: ru
  text: Я истребил их[a] и сокрушил[b]; они не поднялись и пали под ноги мои.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поглотил их»; в военной образности — «уничтожил, истребил».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разбил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Я истребил их
  rationale: В военном контексте глагол אכל («есть, поглощать») выражает полное уничтожение. «Истребил» естественно передаёт здесь смысл метафоры, а буквальный образ отмечен в сноске.
- source_word: וָאֶמְחָצֵם
  choice: и сокрушил
  rationale: Глагол מחץ означает сильный, решительный удар — «разбить, сокрушить». Выбор сохраняет суровую поэтическую образность и не сводит её к нейтральному «победил».
- source_word: וְלֹא יְקוּמוּן
  choice: они не поднялись
  rationale: Перевод сохраняет прямое утверждение исходного текста, не добавляя модального значения «не смогли».
- source_word: וַיִּפְּלוּ
  choice: и пали
  rationale: «Пали» точно передаёт נפל и соответствует возвышенному поэтическому регистру песни.
- source_word: תַּחַת רַגְלָי
  choice: под ноги мои
  rationale: Формулировка сохраняет конкретный образ поверженных врагов и поэтическую инверсию, не заменяя его отвлечённым указанием на подчинение.
theological_decisions:
- issue: Жестокая военная образность в победной песне Давида
  choice: Сохранить речь от первого лица о полном уничтожении и низвержении врагов
  alternative: Смягчить до «я полностью победил их»
  rationale: Еврейский текст намеренно использует резкие глаголы уничтожения, сокрушения и падения. Их смягчение устранило бы существенную черту поэтического изображения и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом древнееврейской победной песни. Инверсия «под ноги мои» сохранена как естественная для поэтической речи; резкость военной образности не смягчена.
