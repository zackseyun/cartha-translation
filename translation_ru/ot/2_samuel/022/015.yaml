  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: ru
  text: Он послал стрелы и рассеял врагов, молнию — и привёл их в смятение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Оба глагола можно также передать как описание разгрома врагов: «разогнал их… и обратил их в бегство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Основное значение שלח — «посылать». В сочетании со стрелами по-русски возможно «пустил», однако «послал» точнее сохраняет поэтический образ еврейского текста, не конкретизируя способ действия.
- source_word: חִצִּים
  choice: стрелы
  rationale: Прямое и естественное соответствие, сохраняющее воинский образ.
- source_word: וַיְפִיצֵם
  choice: и рассеял врагов
  rationale: Каузативная форма передаёт значение «рассеять, разогнать». Местоименный суффикс относится к противникам, подразумеваемым контекстом; существительное «врагов» вводится для ясности по-русски.
- source_word: בָּרָק
  choice: молнию
  rationale: בָּרָק означает «молния, вспышка молнии». В русском единственное число сохраняет лаконичность и параллелизм строки.
- source_word: וַיְהֻמֵּם
  choice: и привёл их в смятение
  rationale: 'Форма от המם выражает каузативное действие: привести в замешательство или смятение, обратить в бегство. Выбор сохраняет внутреннее состояние и не сужает смысл до военного поражения.'
theological_decisions:
- issue: К кому относятся местоименные суффиксы в וַיְפִיצֵם и וַיְהֻמֵּם
  choice: К врагам или противникам Давида, подразумеваемым в контексте песни
  alternative: Оставить объект только в форме местоимения «их», не называя врагов прямо
  rationale: Еврейские суффиксы мужского рода множественного числа требуют объекта, а контекст божественной брани естественно указывает на противников. В первом полустишии «врагов» делает русский текст ясным, после чего «их» сохраняет связь.
- issue: Соотношение глаголов «рассеял» и «привёл в смятение»
  choice: Передать их различными выражениями, сохранив смысловой параллелизм без полного отождествления
  alternative: Оба глагола понимать как описание разгрома или обращения врагов в бегство
  rationale: 'Корни פוץ и המם семантически сближаются в контексте битвы, но не тождественны: первый подчёркивает рассеяние, второй — смятение или разгром. Перевод сохраняет эту напряжённость.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической теофании. Порядок образов оригинала сохранён; тире подчёркивает параллель между стрелами и молнией. Уточнение «врагов» введено лишь ради ясного референта местоименных суффиксов.
