lexical_decisions:
- source_word: הָאֵל
  choice: Бог
  rationale: Определённая форма указывает на Бога; в контексте продолжает характеристику Бога из предыдущей строки.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: дающий мне отмщение
  rationale: Сохраняет буквальное направление לִי — «мне», не заменяя его толкованием «за меня»; множественная форма נְקָמֹת имеет собирательно-интенсивное значение и естественно передаётся русским единственным числом «отмщение».
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: и низвергающий народы под меня
  rationale: Причастие מוֹרִיד передано параллельным причастным оборотом; «под меня» сохраняет образ подчинения народов говорящему и синтаксическую напряжённость оригинала.
theological_decisions:
- issue: Кому принадлежит отмщение и какова роль говорящего
  choice: «дающий мне отмщение»
  alternative: «совершающий отмщение за меня»
  rationale: Еврейское לִי буквально означает «мне» и допускает понимание отмщения как данного говорящему; перевод не подменяет эту формулировку более истолковывающим «за меня».
- issue: Характер подчинения народов
  choice: «низвергающий народы под меня»
  alternative: «покоряющий мне народы»
  rationale: Выбранный вариант сохраняет пространственную метафору תַּחְתֵּנִי и действие корня ירד, не сглаживая их до общего понятия покорения.
translation_notes:
  register: Современный литературный русский с торжественной поэтической окраской. Параллельные причастные конструкции сохраняют строй древнееврейской хвалебной поэзии; «низвергающий» уместно передаёт сильное нисходящее действие, не звуча архаично чрезмерно.
