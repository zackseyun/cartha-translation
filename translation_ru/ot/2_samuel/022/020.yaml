  text: וַ/יֹּצֵ֥א לַ/מֶּרְחָ֖ב אֹתִ֑/י יְחַלְּצֵ֖/נִי כִּי חָ֥פֵֽץ בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: ru
  text: Он вывел меня на простор[a], избавил меня, потому что благоволил ко мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в широкое место». Еврейский образ противопоставляет свободу и облегчение тесноте и бедствию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «находил во мне радость»; «был доволен мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Он вывел меня
  rationale: Порода хифиль глагола יצא имеет каузативное значение «вывести». Этот вариант естественен по-русски и сохраняет образ освобождения.
- source_word: לַמֶּרְחָב
  choice: на простор
  rationale: מֶרְחָב обозначает широкое, открытое пространство и здесь образно противопоставлен тесноте и бедствию. Русское «на простор» точно и естественно передаёт этот образ.
- source_word: יְחַלְּצֵנִי
  choice: избавил меня
  rationale: Глагол חלץ в пиэле может означать «вырвать, избавить, спасти». «Избавил меня» соответствует поэтическому регистру и параллелен предыдущей строке.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание избавления; «потому что» ясно выражает причинную связь.
- source_word: חָפֵץ בִּי
  choice: благоволил ко мне
  rationale: Сочетание חפץ ב выражает расположение, удовольствие или желание в отношении кого-либо. «Благоволил ко мне» сохраняет личный и положительный смысл, не сводя его к простой оценке поведения.
theological_decisions:
- issue: Причина Божьего избавления
  choice: потому что благоволил ко мне
  alternative: потому что находил во мне радость / потому что был доволен мной
  rationale: Перевод сохраняет прямое утверждение текста о Божьем благоволении к говорящему, но не добавляет вывода о заслугах и не разрешает более широкое богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм еврейского стиха сохранён; формулировки понятны без специальной церковной подготовки.
