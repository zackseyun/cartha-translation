  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: ru
  text: Ведь все Его суды были предо мной, и от Его установлений я не отступал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и от неё я не отступал»; возможно также по смыслу: «и от них я не отступал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание предыдущего утверждения; «ведь» естественно передаёт причинно-пояснительную связь в русской поэтической речи.
- source_word: כָל
  choice: все
  rationale: Сохраняет всеохватное значение еврейского квантора.
- source_word: מִשְׁפָּטָיו
  choice: Его суды
  rationale: Передаёт судебно-нормативный смысл מִשְׁפָּט и сохраняет отличие от параллельного חֻקּוֹת; заглавная буква местоимения соответствует принятому благоговейному русскому регистру.
- source_word: לְנֶגְדִּי
  choice: были предо мной
  rationale: Сохраняет образ постоянного нахождения перед взором или в сознании говорящего и звучит естественно в возвышенной современной речи.
- source_word: וְחֻקֹּתָיו
  choice: и от Его установлений
  rationale: «Установления» передаёт смысл закреплённых предписаний и сохраняет лексическое различие с «судами».
- source_word: לֹא אָסוּר
  choice: я не отступал
  rationale: Естественно выражает значение סוּר — уклоняться или отходить — в контексте верности Божьим предписаниям.
- source_word: מִמֶּנָּה
  choice: от Его установлений
  rationale: Необычная форма местоимения женского рода единственного числа допускает соотнесение с предшествующим собирательно понятым выражением; явное повторение референта обеспечивает ясность, не устраняя текстовую особенность, отмеченную в сноске.
theological_decisions:
- issue: Передача двух терминов закона завета без сглаживания различий
  choice: 'Сохранены разные обозначения: «суды» и «установления».'
  alternative: Передать оба слова обобщённо как «законы» или «повеления».
  rationale: В еврейском тексте употреблены два различных юридико-заветных термина в поэтическом параллелизме; их различение не навязывает тексту упрощённой богословской классификации.
- issue: Референт местоименной формы מִמֶּנָּה
  choice: В основном тексте смысл разъяснён как «от Его установлений», а формальная неоднозначность отмечена в сноске.
  alternative: 'Передать буквально и менее определённо: «от неё» либо по смыслу множественного числа: «от них».'
  rationale: Форма женского рода единственного числа грамматически необычна после формы множественного числа и может отражать поэтическое собирательное употребление; перевод не должен скрывать эту особенность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия «предо мной» и глагол «отступал» сохраняют достоинство и ритм, оставаясь понятными широкому читателю. Маркер сноски помещён в основном тексте.
