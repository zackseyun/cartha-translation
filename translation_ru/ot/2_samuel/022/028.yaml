  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: ru
  text: 'Ты спасаешь бедствующий народ[a], но глаза Твои — на надменных[b]: Ты низлагаешь их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедный народ», «угнетённый народ». Еврейское слово может обозначать бедных, страдающих, угнетённых или униженных.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «высоких»; по смыслу также: «гордых», «превозносящихся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: народ
  rationale: Единственное число обозначает совокупность людей; «народ» естественно передаёт собирательное значение и сохраняет поэтический параллелизм.
- source_word: עָנִי
  choice: бедствующий
  rationale: Слово может обозначать бедного, угнетённого или страдающего. «Бедствующий» передаёт тяжёлое и униженное положение, не сводя смысл только к материальной бедности или только к нравственному смирению.
- source_word: תּוֹשִׁיעַ
  choice: Ты спасаешь
  rationale: Форма породы хифиль от ישׁע означает спасать или избавлять. «Спасаешь» кратко и сохраняет широкий смысл глагола.
- source_word: עֵינֶיךָ
  choice: глаза Твои
  rationale: Сохранён конкретный еврейский образ, а не заменён отвлечённым словом «взгляд».
- source_word: רָמִים
  choice: надменные
  rationale: Буквально речь идёт о «высоких»; в данном противопоставлении слово имеет отрицательный нравственный оттенок и обозначает превозносящихся людей.
- source_word: תַּשְׁפִּיל
  choice: Ты низлагаешь их
  rationale: Хифиль от שׁפל означает делать низким, унижать, низлагать. «Низлагаешь» сохраняет образ понижения положения; местоимение «их» явно выражает подразумеваемый объект в русском синтаксисе.
- source_word: וְ
  choice: но
  rationale: Хотя союз формально означает «и», параллельные строки противопоставляют спасение бедствующих низложению надменных, поэтому по-русски естественно «но».
theological_decisions:
- issue: Нравственный или социальный характер противопоставления
  choice: Бог спасает находящихся в бедственном и униженном положении, а надменных низлагает.
  alternative: Бог спасает исключительно материально бедных и понижает исключительно социально возвышенных.
  rationale: Еврейские слова допускают социально-экономический оттенок, однако поэтическое противопоставление также несёт нравственный смысл. Перевод и примечания сохраняют оба измерения, не ограничивая текст одним из них.
- issue: Синтаксическая связь выражения «глаза Твои — на надменных» с глаголом «низлагаешь»
  choice: 'Сохранены две соположенные части: Божьи глаза обращены на надменных, и Он их низлагает.'
  alternative: «Ты опускаешь надменные глаза» или «Ты смотришь на надменных, чтобы унизить их».
  rationale: Масоретский текст 2 Царств называет «Твои глаза» и «надменных» раздельно; двоеточие сохраняет напряжённый поэтический синтаксис и не превращает цель действия в явно выраженную там, где она лишь подразумевается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Порядок «глаза Твои» поддерживает библейский ритм, оставаясь понятным. Двоеточие передаёт сжатость и напряжение еврейского параллелизма.
