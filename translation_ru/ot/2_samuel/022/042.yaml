  text: יִשְׁע֖וּ וְ/אֵ֣ין מֹשִׁ֑יעַ אֶל יְהוָ֖ה וְ/לֹ֥א עָנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: ru
  text: Они взывали о помощи, но некому было спасти; взывали к Яхве, но Он им не ответил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: они взывали о помощи
  rationale: В данном контексте форма передаёт отчаянное обращение за избавлением, а не просто взгляд; такой перевод естественно соотносится с последующим «некому было спасти».
- source_word: וְאֵין מֹשִׁיעַ
  choice: но некому было спасти
  rationale: Причастие מֹשִׁיעַ обозначает того, кто спасает или избавляет. Безличная русская конструкция естественна и не привносит титул «Спаситель».
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל указывает, к кому направлен призыв, а имя יהוה передано транслитерацией «Яхве», сохраняющей личное имя Бога.
- source_word: וְלֹא עָנָם
  choice: но Он им не ответил
  rationale: Глагол ענה означает «ответить»; местоименный суффикс указывает на множественное число объекта. Противительный союз естественно выражает безуспешность обращения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет это различие, не заменяя имя титулом.
- issue: Неответ Бога на призыв врагов
  choice: но Он им не ответил
  alternative: но ответа не было
  rationale: Еврейский глагол имеет подлежащее в 3-м лице единственного числа, естественно относящееся к Яхве; перевод сохраняет прямое утверждение текста, не объясняя причин молчания.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор «взывали» добавлен во второй части как естественное восстановление эллипсиса и для сохранения параллелизма. Заглавная буква в «Он» соответствует принятой русской библейской издательской традиции, не меняя смысла.
