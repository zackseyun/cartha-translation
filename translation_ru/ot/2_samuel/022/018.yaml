  language: en
  yaml_path: translation/ot/2_samuel/022/018.yaml
  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: ru
  text: Он избавил меня от сильного врага моего, от ненавидевших меня, потому что они были сильнее меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Он избавил меня
  rationale: Форма глагола נצל в породе hифиль означает спасение или избавление от опасности; «избавил» естественно и точно в данном контексте.
- source_word: מֵאֹיְבִי עָז
  choice: от сильного врага моего
  rationale: עָז передаёт силу и могущество противника. «Сильного» сохраняет прямое значение и согласуется с параллельным אָמְצוּ.
- source_word: מִשֹּׂנְאַי
  choice: от ненавидевших меня
  rationale: Причастная форма множественного числа обозначает тех, кто ненавидит говорящего; субстантивированная конструкция по-русски передаёт это без добавления слова «люди».
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: потому что они были сильнее меня
  rationale: אָמְצוּ выражает превосходство противников в силе, а מִמֶּנִּי — сравнительное «чем я / меня»; именная русская конструкция звучит естественно.
theological_decisions:
- issue: Характер превосходства врагов
  choice: они были сильнее меня
  alternative: они одолели меня
  rationale: Еврейский текст говорит о превосходстве в силе, но не утверждает, что враги уже победили Давида; выбранный вариант не вносит идею состоявшегося поражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Постпозиция «врага моего» сохраняет достоинство песни, оставаясь понятной современному читателю; синтаксический параллелизм оригинала сохранён.
