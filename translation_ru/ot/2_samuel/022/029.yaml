base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: ru
  text: Ведь Ты — мой светильник[a], Яхве, и Яхве озаряет мою тьму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мой светильник»; по смыслу возможно: «мой свет». В еврейском тексте употреблён конкретный образ светильника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание или пояснение к предыдущим словам; «ведь» естественно сохраняет эту связь, не сводя её исключительно к строгой причинности.
- source_word: נֵירִי
  choice: мой светильник
  rationale: Существительное обозначает конкретный светильник, а не отвлечённый свет; перевод сохраняет зримую поэтическую метафору.
- source_word: יְהוָה / וַיהוָה
  choice: Яхве / и Яхве
  rationale: Личное имя Бога передано транслитерацией и повторено во второй части стиха, как в еврейском тексте, с сохранением параллелизма.
- source_word: יַגִּיהַּ
  choice: озаряет
  rationale: Каузативная форма глагола выражает действие «давать свет, освещать»; «озаряет» звучит естественно и поэтично, сохраняя образ света.
- source_word: חָשְׁכִּי
  choice: мою тьму
  rationale: Сохранены буквальный образ тьмы и суффикс первого лица без уточнения, означает ли тьма бедствие, опасность или уныние.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано как «Яхве», а не заменено титулом; его повторение сохранено.
- issue: Смысл образа «моя тьма»
  choice: Сохранить метафору без поясняющей конкретизации
  alternative: Моё бедствие / тьму вокруг меня
  rationale: Контекст допускает разные оттенки — бедствие, опасность, отсутствие пути или надежды; перевод не устраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Заглавное «Ты» употреблено как уважительное обращение к Богу. Конкретная метафора светильника и повтор имени Яхве сохранены.
