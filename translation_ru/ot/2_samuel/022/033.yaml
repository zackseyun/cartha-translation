  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: ru
  text: Бог — моё могучее убежище, и Он делает мой путь безупречным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при более буквальном следовании согласной форме: «и Он делает Свой путь безупречным». Параллель в Псалме 17:33 (евр. 18:33) поддерживает чтение «мой путь».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Бог
  rationale: Определённая форма здесь естественно обозначает Бога; по-русски добавление указательного оттенка или буквального артикля не требуется.
- source_word: מָעוּזִּי חָיִל
  choice: моё могучее убежище
  rationale: Сочетание выражает одновременно защищённость и силу. «Могучее убежище» сохраняет оба оттенка, не сужая образ до военной крепости.
- source_word: וַיַּתֵּר
  choice: делает
  rationale: Редкая и трудная форма в данном построении, вероятно, передаёт значение устроения или приведения пути к целостности; нейтральное «делает» сохраняет связь с последующим сказуемым, не уточняя спорный оттенок.
- source_word: תָּמִים
  choice: непорочным
  rationale: Слово обозначает цельность, безупречность и нравственную чистоту. «Непорочным» естественно относится к жизненному пути и не обязательно подразумевает абсолютное безгрешное совершенство.
- source_word: דרכו
  choice: мой путь
  rationale: Масоретская огласовка допускает «его путь», однако параллель в Псалме 17:33 (евр. 18:33) поддерживает первое лицо — «мой путь». Альтернатива сохранена в сноске.
theological_decisions:
- issue: Местоименное чтение последнего слова
  choice: Бог делает путь говорящего непорочным
  alternative: Бог делает Свой путь непорочным
  rationale: Параллельное место в Псалме 17:33 (евр. 18:33) поддерживает чтение «мой путь», тогда как согласная форма и масоретская традиция данного стиха допускают «его путь». Основной текст следует более ясной поэтической параллели, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Сохранён образ убежища и намеренно не устранена текстовая неоднозначность местоимения.
