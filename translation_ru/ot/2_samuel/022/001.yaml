  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: ru
  text: И Давид обратился к Яхве со словами этой песни в тот день, когда Яхве избавил его от руки всех его врагов и от руки Саула.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: произнёс
  rationale: Глагол דבר означает «говорить, произносить». Хотя далее следует песня, перевод сохраняет формулировку оригинала и не заменяет её глаголом «спел».
- source_word: לַיהוָה / יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה; форма «Яхве» является современной научно обоснованной русской передачей.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: слова этой песни
  rationale: Перевод сохраняет оба элемента еврейского выражения — «слова» и «песня», не сокращая его до одного слова «песню».
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Еврейский временной оборот естественно передан по-русски и сохраняет указание на обстоятельства произнесения песни.
- source_word: הִצִּיל
  choice: избавил
  rationale: В породе hифиль глагол נצל обозначает спасение или избавление от угрожающей власти; «избавил» уместно в контексте преследований и врагов.
- source_word: מִכַּף
  choice: от руки
  rationale: Сохранён образ כף — «ладонь, рука», метафорически обозначающий власть или хватку противника.
- source_word: כָּל אֹיְבָיו
  choice: всех его врагов
  rationale: Прямая и естественная передача собирательного выражения.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская форма еврейского личного имени שָׁאוּל.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал дважды употребляет личное имя יהוה. Транслитерация «Яхве» сохраняет различие между Божьим именем и титулом «Господь», не подменяя одно другим.
- issue: Отношение Давида к Яхве в выражении לַיהוָה
  choice: произнёс Яхве
  alternative: произнёс перед Яхве / обратился к Яхве
  rationale: Дательный оборот сохраняет направленность песни к Яхве и близко следует синтаксису оригинала, не уточняя сверх текста, была ли она исполнена как молитва, хвала или публичное песнопение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены исходные повторы имени «Яхве» и образ «руки» как обозначение вражеской власти. Союз «И» отражает повествовательную связь с предшествующим контекстом.
