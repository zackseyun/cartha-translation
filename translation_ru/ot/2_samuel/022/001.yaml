    rationale: В русском языке после глагола «произнёс» имя «Яхве» может читаться как то, что Давид произнёс, тогда как לַיהוָה обозначает адресата. Замена на «обратился к Яхве со словами» ясно передаёт синтаксическую роль адресата и не добавляет способ исполнения песни.
