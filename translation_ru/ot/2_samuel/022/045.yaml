lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: чужеземцы
  rationale: Буквально «сыны чужбины» или «сыны чужеземцев»; это еврейское обозначение людей из чужих народов. «Чужеземцы» естественно передаёт смысл на современном русском языке.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: покоряются мне
  rationale: Форма глагола כחש в контексте победной песни обозначает вынужденное, возможно неискреннее подчинение. Основной текст передаёт сам факт покорности, а оттенок притворства сохранён в сноске.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: едва услышав обо мне
  rationale: Буквально «при слышании уха»; идиома выражает немедленную реакцию на одно лишь известие. Добавление «обо мне» естественно проясняет подразумеваемый объект слуха в русском языке.
- source_word: יִשָּׁמְעוּ לִי
  choice: они повинуются мне
  rationale: Глагол שׁמע с предлогом ל здесь означает не просто услышать, а послушаться, повиноваться.
