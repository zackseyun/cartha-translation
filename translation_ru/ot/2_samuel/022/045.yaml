  text: Чужеземцы покоряются мне[a]; стоит им услышать — они повинуются мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притворно выказывают мне покорность»; еврейский глагол может подразумевать вынужденное или неискреннее подчинение.'
