base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: ru
  text: Ибо валы смерти окружили меня[a]; потоки нечестия[b] устрашили меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «волны смерти»; еврейское слово обозначает буруны, валы или разбивающиеся волны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потоки Велиала», если понимать בְלִיַּעַל как имя собственное, а не как обозначение нечестия или пагубного зла.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предыдущим словам; «ибо» естественно передаёт причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: אֲפָפֻנִי
  choice: окружили меня
  rationale: Глагол обозначает охватывание со всех сторон; выбран ясный современный эквивалент без архаизации.
- source_word: מִשְׁבְּרֵי
  choice: валы
  rationale: Слово обозначает морские буруны или разбивающиеся волны. «Валы» сохраняют образ мощных, накатывающихся вод и естественно сочетаются со «смертью» в русской поэзии.
- source_word: מָוֶת
  choice: смерти
  rationale: Прямой эквивалент; смерть метафорически представлена как окружившие героя морские валы.
- source_word: נַחֲלֵי
  choice: потоки
  rationale: Существительное может обозначать русла, ручьи или бурные сезонные потоки; в данном параллелизме «потоки» ясно передают угрожающую водную стихию.
- source_word: בְלִיַּעַל
  choice: нечестия
  rationale: В этом раннем поэтическом контексте слово естественнее понимать как нарицательное обозначение негодности, пагубного зла или нечестия, а не как имя собственное. «Нечестие» звучит по-русски естественнее буквальной «негодности» и сохраняет нравственно-пагубный оттенок.
- source_word: יְבַעֲתֻנִי
  choice: устрашили меня
  rationale: Глагол выражает сильный испуг или внезапный ужас. «Устрашили» точно передаёт интенсивность и поддерживает поэтический регистр.
theological_decisions:
- issue: Следует ли понимать בְלִיַּעַל как имя собственное «Велиал» или как нарицательное обозначение нечестия и пагубного зла
  choice: В основном тексте передано нарицательным словом «нечестие».
  alternative: «потоки Велиала»; также возможно «потоки погибели» или «потоки зла».
  rationale: Поэтический параллелизм описывает угрожающие воды, а древнееврейское слово в этом контексте не требует позднейшего персонифицированного, демонологического понимания. При этом подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Водная образность и параллелизм исходного текста сохранены; синтаксис остаётся ясным для широкого круга читателей.
