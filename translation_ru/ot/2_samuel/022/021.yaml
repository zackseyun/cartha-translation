base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: ru
  text: 'Яхве воздаст мне по моей праведности[a],

    по чистоте моих рук[b] воздаст мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступит со мной». Еврейский глагол может означать, что с человеком обходятся или ему воздают сообразно его поступкам.'
    reason: lexical_alternative
  - marker: b
    text: «Чистота рук» — еврейский образ невиновности или нравственной чистоты поступков.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: воздал мне
  rationale: Глагол גמל может означать обращение с человеком или воздаяние ему сообразно его поступкам. Параллельное יָשִׁיב לִי и контекст благоприятного воздаяния поддерживают здесь перевод «воздал мне», при сохранении более широкого варианта в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: כְּצִדְקָתִי
  choice: по моей праведности
  rationale: צדקה здесь обозначает правоту или праведное поведение говорящего; предлог כְּ выражает соответствие или меру. Перевод сохраняет прямое утверждение текста, не превращая его в заявление о безгрешности.
- source_word: כְּבֹר יָדַי
  choice: по чистоте моих рук
  rationale: Буквальный образ сохраняет еврейскую поэтическую метафору нравственной чистоты и невиновности в поступках; её смысл пояснён в сноске.
- source_word: יָשִׁיב לִי
  choice: отплатил мне
  rationale: Каузативная форма שוב здесь выражает возвращение или воздаяние. «Отплатил мне» естественно передаёт ответное воздаяние и поддерживает поэтический параллелизм.
theological_decisions:
- issue: Следует ли смягчать слова Давида о собственной праведности, чтобы они не звучали как притязание на безгрешность или заслугу в спасении
  choice: Сохранено прямое утверждение «по моей праведности» и образ «по чистоте моих рук» как слова о правоте и поведении говорящего в данном контексте.
  alternative: Смягчить формулировку до «по моей невиновности» либо истолковать её как утверждение об абсолютной безгрешности и заслуженном спасении.
  rationale: Еврейский текст прямо говорит от первого лица о праведности и чистоте рук. Перевод не устраняет этой богословской напряжённости, но и не добавляет более широкого догматического вывода, которого сам стих не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Сохранены параллелизм двух строк, личное имя «Яхве» и конкретный образ чистых рук; синтаксис остаётся понятным современному читателю.
