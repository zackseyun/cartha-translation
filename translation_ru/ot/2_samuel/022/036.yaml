  text: Ты дал мне щит Твоего спасения, и Твоя кротость[a] возвеличила меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё смирение» или «Твоё снисхождение». Еврейское слово трудно для истолкования и, возможно, говорит о том, что Бог милостиво склоняется к человеку, чтобы возвысить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Ты дал
  rationale: Форма wayyiqtol породы qal от נתן передаёт простое прошедшее действие; личное обращение к Богу сохранено.
- source_word: לִי
  choice: мне
  rationale: Естественная русская конструкция с глаголом «дать» сохраняет значение косвенного дополнения.
- source_word: מָגֵן
  choice: щит
  rationale: Сохранён конкретный военный образ, без замены абстрактным понятием защиты.
- source_word: יִשְׁעֶךָ
  choice: Твоего спасения
  rationale: Передаёт значение спасения или избавления и сохраняет притяжательную конструкцию оригинала.
- source_word: וַעֲנֹתְךָ
  choice: Твоё смирение
  rationale: Трудная форма, вероятно связанная с ענה, допускает понимание как смирение, кротость или снисхождение Бога. «Смирение» сохраняет неожиданную богословскую напряжённость и образ Бога, милостиво склоняющегося к человеку.
- source_word: תַּרְבֵּנִי
  choice: возвеличило меня
  rationale: Hiphil от רבה означает сделать великим, увеличить или возвысить; «возвеличило меня» естественно передаёт результативный смысл в данном поэтическом контексте.
theological_decisions:
- issue: Значение וַעֲנֹתְךָ применительно к Богу
  choice: Твоё смирение
  alternative: Твоя кротость; Твоё снисхождение; Твоя помощь
  rationale: Основной текст сохраняет прямой и богословски напряжённый смысл — добровольное склонение Бога к Своему слуге, — а примечание честно указывает на лексическую трудность и другие возможные понимания.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного поэтического регистра. Местоимения, обращённые к Богу, написаны с прописной буквы. Необычное «смирение» не сглажено, а пояснено в сноске.
