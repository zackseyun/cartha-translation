base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: ru
  text: Жив Яхве! Благословенна моя скала! Да будет превознесён Бог — скала моего спасения![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное другое членение: «Бог скалы моего спасения». Слово «спасение» также можно передать как «избавление».'
    reason: Сочетание אֱלֹהֵי צוּר יִשְׁעִי допускает другое синтаксическое членение; יֶשַׁע имеет также значение «избавление».
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: 'Именное предложение с предикативным חַי передаёт торжественное славословие: Яхве жив. Краткая форма «Жив Яхве!» естественна для возвышенной русской речи и не смешивает эту формулу с клятвенным оборотом «жив Яхве, что…».'
- source_word: וּבָרוּךְ צוּרִי
  choice: Благословенна моя скала!
  rationale: Сохранена буквальная метафора צוּר «скала» и хвалебное значение пассивного причастия בָּרוּךְ. Женская форма обусловлена грамматическим родом русского слова «скала».
- source_word: וְיָרֻם
  choice: Да будет превознесён
  rationale: Юссив выражает пожелание-прославление. Конструкция с «да будет» сохраняет волитивный оттенок и уместный торжественный регистр.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: Бог — скала моего спасения
  rationale: Форма אֱלֹהֵי внешне допускает конструктивное прочтение, однако поэтический параллелизм и повтор צוּר поддерживают понимание «Бог» с последующим приложением. «Спасение» сохраняет широкий смысл יֶשַׁע; тире ясно оформляет приложение по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, непосредственно стоящее в еврейском тексте, без замены титулом.
- issue: Метафора צוּר применительно к Богу
  choice: скала
  alternative: твердыня; прибежище
  rationale: Конкретный образ устойчивости и защиты сохранён, а не заменён его истолкованием.
- issue: Синтаксис אֱלֹהֵי צוּר יִשְׁעִי
  choice: Бог — скала моего спасения
  alternative: Бог скалы моего спасения
  rationale: Выбрано аппозитивное прочтение, лучше согласующееся с поэтическим параллелизмом и естественной русской речью; формальная неоднозначность конструктивной цепочки отмечена в сноске.
translation_notes:
  register: Современный литературный русский с краткими, торжественными восклицаниями, соответствующими поэтическому славословию. Метафора «скала» последовательно сохранена в обеих строках; архаизирующий синтаксис ограничен формулой «да будет превознесён».
