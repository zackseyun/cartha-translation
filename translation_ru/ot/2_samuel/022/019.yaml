  source_fidelity: «Они выступили против меня» адекватно передаёт יְקַדְּמֻנִי в враждебном контексте, не устраняя отмеченную в сноске смысловую возможность «настигли/встретили». «В день моего бедствия» точно соответствует בְּיוֹם אֵידִי. Противительный союз «но» уместно выражает контекстуальное отношение между двумя частями стиха. «Яхве был моей опорой» верно передаёт יְהוָה מִשְׁעָן לִי.
