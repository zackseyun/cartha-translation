base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: ru
  text: Они выступили против меня[a] в день моего бедствия, но Яхве[b] был моей опорой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они настигли меня»; или: «Они встретили меня».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское יהוה (YHWH) — личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: Они выступили против меня
  rationale: Пиэль от קדם с местоименным дополнением 1-го лица в данном враждебном контексте обозначает встречу или выступление навстречу с целью противостояния. Формулировка передаёт направленность действия и его враждебный характер, не сводя значение к простому «встретили».
- source_word: בְּיוֹם אֵידִי
  choice: в день моего бедствия
  rationale: Временная конструкция передана естественным русским оборотом; אֵיד обозначает тяжёлое бедствие, несчастье или гибельную пору.
- source_word: וַיְהִי
  choice: но ... был
  rationale: 'Хотя союз ו формально может быть передан как «и», контекст выражает противопоставление: враги выступили против героя, однако Яхве стал для него опорой.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: מִשְׁעָן לִי
  choice: был моей опорой
  rationale: מִשְׁעָן буквально означает то, на что опираются; в метафорическом употреблении современное русское «опора» ясно и естественно передаёт смысл. לִי идиоматически выражено притяжательной конструкцией «моей».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя YHWH. Транслитерация «Яхве» сохраняет это имя, тогда как «Господь» представляет традиционную замену титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Сохранены метафора опоры, контраст между нападением врагов и помощью Яхве, а также смысловая широта глагола קדם посредством сноски.
