  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: ru
  text: Он воссел на херувима и полетел; Он явился[a] на крыльях ветра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал виден». Еврейский глагол можно понять и как «был виден», и как «явился».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב עַל
  choice: воссел на
  rationale: Глагол רכב с предлогом עַל обозначает езду или положение верхом. «Воссел на» естественно передаёт возвышенную поэтическую картину, не добавляя отсутствующих в еврейском тексте деталей движения.
- source_word: כְּרוּב
  choice: херувима
  rationale: Единственное число сохранено; употреблён общепринятый русский библейский термин без поясняющего парафраза.
- source_word: וַיָּעֹף
  choice: и полетел
  rationale: Прямое значение глагола עוף — «лететь»; перевод сохраняет последовательность и динамику еврейской поэзии.
- source_word: וַיֵּרָא
  choice: Он явился
  rationale: Нифаль от ראה допускает значения «был виден» и «явился». «Явился» звучит естественно по-русски и уместно передаёт картину богоявления, а неоднозначность отмечена в сноске.
- source_word: כַּנְפֵי
  choice: на крыльях
  rationale: Буквальный и понятный образ, соответствующий форме множественного числа в сопряжённом сочетании.
- source_word: רוּחַ
  choice: ветра
  rationale: В данном поэтическом контексте רוּחַ обозначает ветер; перевод «духа» здесь менее вероятен, а «бури» добавляло бы не выраженную прямо характеристику.
theological_decisions:
- issue: Передача образа Бога, восседающего на херувиме и являющегося на крыльях ветра
  choice: Сохранить конкретный поэтический образ без рационализирующего пояснения
  alternative: Передать образ отвлечённо как быстрое небесное явление Бога
  rationale: Еврейский текст использует яркий язык богоявления. Буквальная образность сохраняет богословское напряжение и не превращает поэзию в догматическое разъяснение.
- issue: Неоднозначность формы וַיֵּרָא
  choice: В основном тексте — «явился», в сноске — «стал виден»
  alternative: В основном тексте — «стал виден» или «был виден»
  rationale: Оба понимания возможны для нифаля от ראה. Основной вариант лучше соответствует естественному русскому повествованию о богоявлении, а сноска сохраняет более пассивный оттенок формы.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим регистром. Заглавное «Он» во второй части помогает ясно указать на Господа и поддерживает традиционный благоговейный стиль; образность исходного текста сохранена.
