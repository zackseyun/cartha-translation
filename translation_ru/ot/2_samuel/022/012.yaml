  language: en
  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: ru
  text: Он сделал мрак вокруг Себя укрытиями[a] — скопление вод, густые облака небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поставил вокруг Себя мрак как укрытия — собрание вод, густые облака небес». Еврейская строка предельно поэтична, а редкое выражение «скопление вод» можно также понять как «собрание вод» или, более истолковательно, как «тёмные дождевые тучи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: устроил
  rationale: Глагол означает «поставил, поместил, устроил». «Устроил» естественно сочетается с образом окружающих Бога укрытий и сохраняет значение целенаправленного размещения.
- source_word: חֹשֶׁךְ
  choice: мрак
  rationale: В поэтическом описании богоявления «мрак» звучит естественно и передаёт окружающую Бога непроглядную тьму.
- source_word: סְבִיבֹתָיו
  choice: вокруг Себя
  rationale: Передаёт пространственное окружение; прописная буква в местоимении соответствует принятому русскому библейскому регистру при указании на Бога.
- source_word: סֻכּוֹת
  choice: укрытия
  rationale: Сохранено множественное число еврейского слова. «Укрытия» передаёт функцию סֻכָּה, не вызывая здесь неуместной ассоциации с праздничными кущами.
- source_word: חַשְׁרַת מַיִם
  choice: скопление вод
  rationale: Редкое и не вполне ясное выражение, вероятно обозначающее собравшуюся, плотную массу воды. «Скопление вод» сохраняет конкретный грозовой образ без сведения его непосредственно к дождевым тучам.
- source_word: עָבֵי שְׁחָקִים
  choice: густые облака небес
  rationale: עָבִים обозначает плотные, густые облака, а שְׁחָקִים — небеса или небесные выси. Формулировка сохраняет возвышенную поэтичность.
theological_decisions:
- issue: Связь мрака, укрытий, вод и облаков
  choice: Сохранить цепь образов через тире, не определяя её как строгое отождествление или простое перечисление
  alternative: Передать всё как одно укрытие из тёмных дождевых облаков
  rationale: Еврейский стих синтаксически сжат и допускает разные способы соотнесения образов. Перевод не должен устранять эту поэтическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Перестройка «укрытия из мрака» устраняет неестественную для русского языка конструкцию и одновременно сохраняет множественное число סֻכּוֹת.
