base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: ru
  text: 'Я взываю к Яхве, достойному хвалы,[a]

    и от врагов спасаюсь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взываю к Яхве, восхваляемому»; возможно также: «к Яхве, которого следует хвалить». Еврейская форма, переданная словом «спасаюсь», может иметь и будущее значение: «буду спасён».'
    reason: Сохранение лексического диапазона страдательного причастия מְהֻלָּל и возможного будущего значения имперфекта אִוָּשֵׁעַ.
lexical_decisions:
- source_word: מְהֻלָּל
  choice: Достойного хвалы
  rationale: Страдательное причастие от הלל характеризует Яхве как того, кого надлежит хвалить. Эта формулировка естественна по-русски и сохраняет определительную силу формы.
- source_word: אֶקְרָא
  choice: призываю
  rationale: קרא с именем Бога означает обращение к Нему, призывание Его в молитве; «призываю» передаёт это точнее, чем нейтральное «зову».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: וּמֵאֹיְבַי
  choice: и от врагов моих
  rationale: Предлог מִן обозначает источник или угрозу, от которой приходит избавление; союз וְ координирует части стиха.
- source_word: אִוָּשֵׁעַ
  choice: спасаюсь
  rationale: Нифаль имперфекта от ישׁע выражает получение спасения или избавления. Настоящее время подходит для обобщённо-повторяющегося смысла, хотя форма допускает и будущее прочтение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Временной оттенок אִוָּשֵׁעַ
  choice: спасаюсь
  alternative: буду спасён
  rationale: 'В поэтическом контексте имперфект может выражать обычное или повторяющееся действие: призывая Яхве, говорящий получает избавление. Возможность будущего значения отмечена в сноске, чтобы не устранять грамматическую неоднозначность.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «врагов моих» поддерживает ритм, оставаясь понятной; тире ясно связывает характеристику «Достойного хвалы» с именем Яхве.
