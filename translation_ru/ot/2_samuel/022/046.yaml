  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: ru
  text: Чужеземцы падают духом и с трепетом выходят из своих укреплений[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Чужеземцы увядают». Еврейский глагол буквально может означать увядание или угасание.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол здесь труден для понимания; возможны также переводы: «выходят, съёжившись от страха», «выходят, хромая» или, более буквально, «опоясываются».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из своих крепостей»; менее вероятно: «из мест своего заключения» или «из своих оград».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: чужеземцы
  rationale: Буквально «сыны чужбины/чужеземца»; это идиоматическое обозначение иноземных людей. «Чужеземцы» естественно для возвышенной поэзии и сохраняет коллективный смысл.
- source_word: יִבֹּלוּ
  choice: падают духом
  rationale: Глагол נבל обычно означает «увядать, блекнуть». В контексте военной победной песни образ передаёт утрату мужества и сил; буквальная образность сохранена в сноске.
- source_word: וְיַחְגְּרוּ
  choice: с трепетом выходят
  rationale: Форма трудна для толкования. Обычное значение корня חגר — «опоясываться», однако в данном параллелизме её часто понимают как описание боязливого, судорожного или хромающего выхода покорённых врагов. Перевод передаёт наиболее вероятный контекстуальный смысл, не скрывая альтернатив.
- source_word: מִמִּסְגְּרוֹתָם
  choice: из своих укреплений
  rationale: Существительное может обозначать закрытые или ограждённые места. В военном контексте естественнее всего понимать его как оборонительные укрепления; иные лексические возможности отмечены в сноске.
