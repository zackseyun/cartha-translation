  text: כִּ֥י בְ/כָ֖ה אָר֣וּץ גְּד֑וּד בֵּ/אלֹהַ֖/י אֲדַלֶּג שֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: ru
  text: Ибо с Тобой[a] я могу устремиться на отряд[b]; с моим Богом я могу перепрыгнуть стену[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря Тебе», «Тобой»; еврейский предлог может указывать как на совместность, так и на средство действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разбойничью шайку», «воинский отряд».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «крепостную стену», «вал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей хвалы; «ибо» сохраняет пояснительную связь и возвышенный поэтический тон.
- source_word: בְכָה
  choice: с Тобой
  rationale: 'Предлог ב допускает значение сопровождения или средства. «С Тобой» естественно по-русски и сохраняет некоторую неоднозначность: действие совершается в Божьем присутствии и благодаря Его содействию.'
- source_word: אָרוּץ
  choice: я могу устремиться
  rationale: Имперфект в поэтическом контексте может выражать способность, дарованную Богом. Глагол «устремиться» передаёт энергичное движение против неприятеля.
- source_word: גְּדוּד
  choice: отряд
  rationale: Слово обозначает военный отряд, дружину или разбойничью группу; «отряд» понятно современному читателю и уместно в военном контексте.
- source_word: בֵּאלֹהַי
  choice: с моим Богом
  rationale: Повтор предлога поддерживает параллелизм двух строк; выражение сохраняет личный тон «мой Бог» и не сужает значение предлога исключительно до средства.
- source_word: אֲדַלֶּג
  choice: я могу перепрыгнуть
  rationale: Порода пиэль глагола דלג передаёт прыжок через преграду; модальное «могу» выражает способность в параллели с первой строкой.
- source_word: שׁוּר
  choice: стену
  rationale: В данном военном образе слово означает стену, вероятно укреплённую; «стена» — прямой и естественный русский эквивалент.
theological_decisions:
- issue: Божественное содействие в военном образе
  choice: 'Обе строки описывают способность действовать, обретаемую с Богом: «я могу…».'
  alternative: 'Передать лишь сам факт действия: «я устремляюсь… я перепрыгиваю…».'
  rationale: Поэтические формы имперфекта допускают значение способности, а повтор ב связывает успех героя с Богом. Формулировка не превращает стих в более широкое доктринальное утверждение.
- issue: Значение предлога ב
  choice: Основной текст сохраняет формулировку «с Тобой / с моим Богом».
  alternative: «Благодаря Тебе / благодаря моему Богу» или «Тобой / моим Богом».
  rationale: Еврейский предлог может обозначать сопровождение либо средство. Русское «с» сохраняет подлинную смысловую широту, тогда как сноска поясняет значение Божьего содействия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Заглавное написание местоимения «Тобой» подчёркивает обращение к Богу. Параллелизм сохранён повтором «я могу» и конструкцией «с Тобой / с моим Богом».
