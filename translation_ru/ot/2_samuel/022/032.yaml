  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: ru
  text: Ибо кто — Бог, кроме Яхве? И кто — скала, кроме нашего Бога?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «кто — Скала, кроме нашего Бога?» В еврейском тексте «скала» — частая метафора Бога, иногда звучащая почти как титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей хвалы; «ибо» естественно сохраняет пояснительно-причинную связь и возвышенный поэтический регистр.
- source_word: מִי
  choice: кто
  rationale: В обеих параллельных частях это вопросительное местоимение образует риторический вопрос.
- source_word: אֵל
  choice: Бог
  rationale: В контексте утверждается исключительность истинного Бога; русское «Бог» точно передаёт смысл и синтаксическую краткость оригинала.
- source_word: מִבַּלְעֲדֵי
  choice: кроме
  rationale: 'Предлог выражает исключение: нет Бога и скалы помимо Яхве, нашего Бога. «Кроме» кратко и естественно в обеих параллельных строках.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от стоящего рядом обозначения אֵל.
- source_word: צוּר
  choice: скала
  rationale: Сохранена прямая древнееврейская метафора устойчивости, защиты и силы; слово употреблено как именная часть сказуемого, без добавления неопределённого артикля, отсутствующего в русском.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Форма с суффиксом первого лица множественного числа передана буквально и сохраняет общинно-заветное звучание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом; это также позволяет услышать параллелизм между Яхве и «нашим Богом».
- issue: Понимание צוּר как обычной метафоры или почти титула
  choice: скала
  alternative: Скала
  rationale: Грамматика допускает обычное предикативное существительное, поэтому в основном тексте выбрана строчная буква. Вместе с тем частое богословское употребление этой метафоры применительно к Богу позволяет понимать её почти как титул; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с кратким, торжественным поэтическим синтаксисом. Параллелизм двух риторических вопросов и повтор «кроме» сохранены; метафора не заменена толкованием вроде «защитник» или «убежище».
