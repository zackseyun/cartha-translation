  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: ru
  text: С верным Ты являешь Себя верным; с безупречным воином — безупречным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד / תִּתְחַסָּד
  choice: верным / являешь Себя верным
  rationale: Однокоренные слова переданы повтором «верный», сохраняющим взаимность и поэтическую игру еврейского текста. «Верный» здесь выражает преданность и постоянство в отношениях.
- source_word: גִּבּוֹר תָּמִים
  choice: безупречным воином
  rationale: גִּבּוֹר обозначает сильного человека, богатыря или воина; в данном контексте «воин» естественно и соответствует параллельному месту. תָּמִים передано как «безупречный», то есть цельный и непорочный.
- source_word: תִּתַּמָּם
  choice: являешь Себя… безупречным
  rationale: Возвратная форма передана конструкцией «являешь Себя», не сводящей смысл только к поступкам и сохраняющей параллелизм с первой строкой.
theological_decisions:
- issue: Взаимность Божьего отношения к человеку
  choice: Сохранена формула «с верным… верным; с безупречным… безупречным» без поясняющего истолкования.
  alternative: Передать глаголы как «поступаешь милостиво» и «поступаешь непорочно».
  rationale: Исходный текст намеренно выражает соответствие между качеством человека и тем, как Бог являет Себя ему; перевод не уточняет механизм этой взаимности и не превращает её в доктринальную формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавные «Ты» и «Себя» обозначают обращение к Богу. Эллипсис во второй половине сохраняет краткость и параллелизм оригинала.
