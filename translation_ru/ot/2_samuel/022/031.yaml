  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: ru
  text: Путь Бога безупречен; слово Яхве испытано[a]; он — щит для всех, кто ищет у него убежища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очищено» или «проверено». Еврейское слово вызывает образ металла, очищенного огнём при плавке.'
    reason: Лексическая альтернатива и пояснение исходной метафоры.
lexical_decisions:
- source_word: הָאֵל
  choice: Бог
  rationale: Сочетание с артиклем открывает тематически выделенную фразу. В русском эта выделенность передана конструкцией «Бог — Его путь…», без добавления отсутствующего в тексте указательного значения.
- source_word: תָּמִים
  choice: безупречен
  rationale: В данном контексте слово характеризует путь Бога как цельный и не имеющий изъяна; «безупречен» естественно передаёт это значение и не сводит его только к абстрактному совершенству.
- source_word: דַּרְכּוֹ
  choice: Его путь
  rationale: דֶּרֶךְ означает «путь» и здесь образно указывает на образ действий Бога.
- source_word: אִמְרַת יְהוָה
  choice: слово Яхве
  rationale: אִמְרָה может обозначать слово, изречение или обещание; широкое «слово» сохраняет поэтический параллелизм и не сужает смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: צְרוּפָה
  choice: испытано
  rationale: Форма восходит к образу металла, очищенного и проверенного плавкой. «Испытано» ясно передаёт итог метафоры, а её буквальный фон отмечен в сноске.
- source_word: מָגֵן
  choice: щит
  rationale: Сохранён конкретный защитный образ исходного текста.
- source_word: הַחֹסִים בּוֹ
  choice: кто ищет у Него убежища
  rationale: Глагол חסה выражает поиск защиты или прибежища; выбранная формулировка сохраняет пространственно-защитный образ, не заменяя его более отвлечённым «доверяется».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Метафорический смысл צְרוּפָה применительно к слову Яхве
  choice: испытано
  alternative: очищено; переплавлено; проверено
  rationale: Перевод передаёт надёжность слова как выдержавшего испытание, но сноска сохраняет образ очищения металла огнём и не превращает метафору в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической интонацией. Заглавные местоимения «Его», «Он» употреблены как стилистический знак почтительности. Параллельные части стиха разделены точками с запятой; образ щита и убежища сохранён.
