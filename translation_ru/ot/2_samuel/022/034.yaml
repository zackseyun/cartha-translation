base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/034.yaml
  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
translation:
  language: ru
  text: Он делает мои[a] ноги подобными ногам ланей[b] и даёт мне твёрдо стоять на моих высотах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В традиционном масоретском чтении: «мои»; в написании текста: «его».'
    reason: textual_variant
  - marker: b
    text: Буквально речь идёт о самках оленя — образе проворства и уверенного движения.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на моих возвышенностях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: делает … как
  rationale: Порода пиэль здесь выражает уподобление. Оборот «делает мои ноги, как у…» естественно передаёт причинное значение и вводит последующее сравнение.
- source_word: רגלי/ו
  choice: мои ноги
  rationale: Масоретское чтение и первое лицо во второй половине стиха поддерживают «мои ноги»; отличие письменной формы отмечено в сноске.
- source_word: כָּאַיָּלוֹת
  choice: как у ланей
  rationale: Форма женского рода множественного числа обозначает самок оленя. «Лани» сохраняет эту особенность и привычный поэтический образ проворства и уверенного движения по высотам.
- source_word: בָּמוֹתַי
  choice: на моих высотах
  rationale: Буквально «мои высоты». В данном поэтическом контексте речь идёт о возвышенных местах, а не обязательно о культовых высотах.
- source_word: יַעֲמִדֵנִי
  choice: ставит меня
  rationale: Гифиль от עמד буквально означает «побуждает стоять, ставит». Перевод сохраняет причинное значение, не добавляя прямо не выраженного слова «безопасно».
