base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: ru
  text: 'В беде своей я призвал Яхве,

    к Богу моему воззвал.

    Из Своего храма[a] Он услышал мой голос,

    и мой вопль о помощи достиг Его ушей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Своего дворца» или «из Своего святилища». «Храм» может обозначать небесное жилище Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: В беде своей
  rationale: Оборот обозначает пребывание в бедственном, стеснённом положении. «В беде своей» естественно звучит по-русски и сохраняет поэтическую сжатость.
- source_word: אֶקְרָא ... אֶקְרָא
  choice: я призвал ... воззвал
  rationale: Повтор глагола קרא сохранён с умеренным русским варьированием. В контексте песни о пережитом избавлении формы переданы прошедшим временем; «воззвал» подчёркивает обращение за помощью, не добавляя отдельного богословского смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהַי
  choice: Богу моему
  rationale: Прямо передаёт форму с притяжательным суффиксом первого лица единственного числа.
- source_word: וַיִּשְׁמַע
  choice: Он услышал
  rationale: Еврейская повествовательная форма естественно обозначает последовавшее событие в прошлом. Русское прошедшее время согласуется с ретроспективным контекстом песни.
- source_word: מֵהֵיכָלוֹ
  choice: из храма Своего
  rationale: הֵיכָל может означать храм, святилище или царский дворец. «Храм» сохраняет основную сакральную ассоциацию; неоднозначность отмечена в сноске.
- source_word: קוֹלִי
  choice: мой голос
  rationale: Прямой и естественный эквивалент еврейского выражения.
- source_word: שַׁוְעָתִי
  choice: мой вопль о помощи
  rationale: Существительное обозначает крик человека, взывающего о помощи; перевод явно выражает подразумеваемую просьбу.
- source_word: בְּאָזְנָיו
  choice: достиг Его ушей
  rationale: 'Буквально «в Его ушах». Динамическая формулировка сохраняет телесный образ и ясно передаёт смысл: вопль был услышан.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение הֵיכָל как места Божьего пребывания
  choice: храм
  alternative: дворец; святилище
  rationale: Слово совмещает храмовый и царский оттенки и здесь может обозначать небесное жилище Бога. В основном тексте выбрано естественное «храм», а иные возможные значения сохранены в сноске.
- issue: Временной план глаголов молитвы и ответа
  choice: прошедшее время
  alternative: 'настоящее время: «взываю… слышит»'
  rationale: Песня ретроспективно рассказывает об избавлении, а וַיִּשְׁמַע представляет ответ как последовавшее событие. Прошедшее время делает эту повествовательную связь ясной, не превращая стих в общее утверждение.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью и параллелизмом. Инверсия «к Богу моему» и возвышенное «воззвал» уместны для песни, но остаются понятными современному читателю. Заглавные буквы в местоимениях, относящихся к Богу, использованы как принятая русская издательская конвенция.
