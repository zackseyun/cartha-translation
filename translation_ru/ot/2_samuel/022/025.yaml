  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: ru
  text: И Яхве воздал мне по моей праведности, по моей чистоте перед Его глазами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: воздал
  rationale: В этой конструкции глагол выражает ответное воздаяние. «Воздал» естественно для возвышенного повествовательного контекста и не сужает смысл до исключительно награды.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לִי
  choice: мне
  rationale: Предлог указывает на адресата воздаяния; дательный падеж естественно передаёт это по-русски.
- source_word: כְּצִדְקָתִי
  choice: по праведности моей
  rationale: Сохраняет значение соответствия, выраженное כְּ, и прямое утверждение говорящего о своей праведности.
- source_word: כְּבֹרִי
  choice: по чистоте моей
  rationale: בֹּר обозначает чистоту или непорочность. «Чистота» точно и естественно передаёт смысл; упоминание рук не добавлено, поскольку его нет в данном стихе.
- source_word: לְנֶגֶד עֵינָיו
  choice: пред очами Его
  rationale: Сохраняет конкретный образ еврейского выражения «перед его глазами» и одновременно передаёт идиоматический смысл «в его глазах».
theological_decisions:
- issue: Утверждение Давида о собственной праведности и чистоте
  choice: Сохранено прямое утверждение от первого лица без смягчения и поясняющей квалификации.
  alternative: Истолковать это как относительную верность завету или перефразировать так, чтобы снять напряжение с повествованием о грехах Давида.
  rationale: Еврейский текст прямо связывает воздаяние Яхве с праведностью и чистотой говорящего. Перевод сохраняет это богословское напряжение, не навязывая его разрешения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «по праведности моей» и форма «пред очами Его» сохраняют поэтический параллелизм и конкретную образность оригинала, оставаясь понятными современному читателю.
