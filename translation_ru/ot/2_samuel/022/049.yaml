  yaml_path: translation/ot/2_samuel/022/049.yaml
  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: ru
  text: избавляющий меня от моих врагов; ты возносишь меня над теми, кто восстаёт против меня; от человека, творящего насилие,[a] ты спасаешь меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от человека насилий»; возможный перевод: «от жестокого человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: избавляющий меня
  rationale: Причастная форма от каузативного יצא буквально передаёт выведение из опасности. В данном контексте естественное русское «избавляющий» сохраняет значение освобождения и продолжает описание Бога из предыдущей строки.
- source_word: מֵאֹיְבָי
  choice: от моих врагов
  rationale: Прямо передаёт предлог מִן, существительное «враги» и суффикс первого лица.
- source_word: וּמִקָּמַי
  choice: над теми, кто восстаёт против меня
  rationale: Сохраняет глагольный образ от קום и его враждебный смысл, не сводя выражение к более общему «противники».
- source_word: תְּרוֹמְמֵנִי
  choice: ты возносишь меня
  rationale: Передаёт образ возвышения от רום и смысл торжества над восстающими против говорящего.
- source_word: מֵאִישׁ חֲמָסִים
  choice: от человека, творящего насилие
  rationale: Сохраняет грамматическое единственное число אִישׁ, а качественное חֲמָסִים естественно раскрывает как характеристику человека, связанного с насилием.
- source_word: תַּצִּילֵנִי
  choice: ты спасаешь меня
  rationale: Естественно передаёт נצל в значении избавления от непосредственной угрозы и избегает неясности русского «избавляешь» без дополнения.
