translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Смена причастного описания на прямое обращение сохранена вслед за еврейским текстом; местоимение «ты» дано со строчной буквы как грамматическая, а не конфессиональная норма.
