  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: ru
  text: С чистым Ты являешь Себя чистым, а с лукавым поступаешь хитро[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол редок, и его значение не вполне ясно; возможны передачи: «являешь Себя извилистым» или «действуешь наперекор». Образ выражает соответствующий ответ Бога лукавому: тот не может перехитрить Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: чистым
  rationale: Прилагательное обозначает чистоту; этот выбор естественен по-русски и позволяет отчасти сохранить корневой повтор со следующим глаголом.
- source_word: תִּתָּבָר
  choice: Ты являешь Себя чистым
  rationale: Возвратная форма выражает то, каким Бог являет Себя в отношении чистого человека; перевод сохраняет рефлексивность и поэтическое соответствие.
- source_word: עִקֵּשׁ
  choice: коварным
  rationale: Слово описывает нравственно искривлённого, лукавого человека. «Коварный» передаёт здесь не физическую кривизну, а обманчивость поведения и естественно сочетается с «поступаешь хитро».
- source_word: תִּתַּפָּל
  choice: поступаешь хитро
  rationale: Редкий и трудный глагол связан с представлением об извилистости или противодействии. Этот перевод передаёт, что Бог отвечает коварному так, что превосходит его хитрость, но не приписывает Богу нравственной испорченности; буквальная напряжённость отмечена в сноске.
- source_word: עִם
  choice: с
  rationale: Предлог выражает соотнесённость Божьего обращения с названным человеком; русское «с» сохраняет лаконичный параллелизм.
theological_decisions:
- issue: Как передать ответ Бога коварному, не устраняя отрицательный оттенок редкого еврейского глагола и не приписывая Богу нравственную извращённость
  choice: поступаешь хитро
  alternative: являешь Себя извилистым; оказываешься противодействующим
  rationale: Основной текст сохраняет мысль о соответствующем и превосходящем ответе Бога на человеческое коварство. Сноска прямо сообщает о более буквальной и напряжённой возможности, не скрывая неоднозначности исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Местоимение «Ты» написано с прописной буквы как элемент принятого библейского регистра; тире во второй строке не используется, чтобы не создавать искусственной эллиптичности при различии глагольных конструкций.
