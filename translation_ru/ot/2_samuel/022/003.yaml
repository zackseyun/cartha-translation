base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: ru
  text: Бог мой[a], скала моя, в Нём я укрываюсь; щит мой и рог моего спасения[b], твердыня моя и убежище моё, Спаситель мой[c], от насилия Ты спасаешь меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Бог моей скалы»; древнееврейская конструкция буквально допускает такое прочтение, но в данном ряду поэтических наименований вероятнее приложение: «Бог мой, скала моя».'
    reason: lexical_alternative
  - marker: b
    text: Рог — древнееврейский образ силы и победоносной мощи.
    reason: cultural_note
  - marker: c
    text: 'Или: «Избавитель мой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: Бог мой, скала моя
  rationale: Формально сочетание допускает понимание «Бог моей скалы», однако в цепи поэтических наименований естественнее прочесть его как приложение. Сноска сохраняет грамматическую неоднозначность.
- source_word: אֶחֱסֶה בּוֹ
  choice: в Нём я укрываюсь
  rationale: Передаёт значение глагола חסה — искать и находить прибежище — и сохраняет прямую связь с Богом.
- source_word: מָגִנִּי
  choice: щит мой
  rationale: Сохраняет конкретный образ защиты без поясняющей замены абстрактным существительным.
- source_word: קֶרֶן יִשְׁעִי
  choice: рог моего спасения
  rationale: Буквально сохраняет древнееврейский образ рога как силы и победоносной мощи; родительная конструкция соответствует оригиналу.
- source_word: מִשְׂגַּבִּי
  choice: твердыня моя
  rationale: Передаёт образ недоступного укреплённого места и звучит естественно в возвышенной русской поэзии.
- source_word: וּמְנוּסִי
  choice: убежище моё
  rationale: Существительное связано с бегством в безопасное место; «убежище» ясно передаёт этот смысл и отличается от образа твердыни.
- source_word: מֹשִׁעִי
  choice: Спаситель мой
  rationale: Причастная форма от ישׁע обозначает того, кто спасает или избавляет; выбран прямой и традиционно понятный русский эквивалент.
- source_word: מֵחָמָס
  choice: от насилия
  rationale: Сохраняет абстрактное значение חָמָס и не вводит подразумеваемых, но прямо не названных насильников.
- source_word: תֹּשִׁעֵנִי
  choice: Ты спасаешь меня
  rationale: Передаёт обращение ко второму лицу и не сужает несовершенный вид древнееврейского глагола до единственного прошлого или будущего события.
theological_decisions:
- issue: Цепь метафорических наименований Бога
  choice: 'Сохранены конкретные образы: скала, щит, рог, твердыня и убежище.'
  alternative: Заменить их истолковывающими словами вроде «защитник» и «источник силы».
  rationale: Накопление образов составляет богословскую и поэтическую ткань стиха; их разъясняющая замена обеднила бы текст.
- issue: Значение מֹשִׁעִי
  choice: Спаситель мой
  alternative: избавитель мой
  rationale: Оба значения лексически возможны. «Спаситель» прямо согласуется с последующим однокоренным глаголом «спасаешь» и не добавляет утверждений сверх текста.
- issue: Временная и видовая сила תֹּשִׁעֵנִי
  choice: Ты спасаешь меня
  alternative: Ты спасёшь меня
  rationale: Древнееврейский имперфект допускает контекстуальные оттенки. Настоящее время естественно выражает переживаемое или характерное действие Бога, не исключая дальнейшего спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Конкретные древнееврейские метафоры сохранены; инверсия в притяжательных сочетаниях поддерживает ритм и достоинство текста, оставаясь понятной современному читателю.
