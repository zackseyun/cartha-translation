lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: Я преследовал
  rationale: Глагол רדף в породе qal обозначает преследование; выбранный вариант естественен для военного контекста и сохраняет длительное движение за врагом.
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Существительное אֹיֵב с суффиксом первого лица единственного числа прямо означает «моих врагов» и сохраняет личный характер речи.
- source_word: וָאַשְׁמִידֵם
  choice: и истребил их
  rationale: Глагол שׁמד в породе hifil означает уничтожить или истребить. «Истребил» передаёт силу и полноту действия, оставаясь уместным в возвышенной поэтической речи.
- source_word: וְלֹא אָשׁוּב
  choice: я не повернул назад
  rationale: В данном контексте שׁוב означает не прекращать преследование и не поворачивать обратно; буквальный образ сохранён без уточняющей интерпретации.
- source_word: עַד כַּלּוֹתָם
  choice: пока им не пришёл конец
  rationale: Конструкция с כלה выражает доведение до конца, исчерпание или уничтожение. Выбранная формулировка естественна по-русски и сохраняет возможность понимать оборот как наступление конца врагов, не исключая активного значения «пока я не покончил с ними».
