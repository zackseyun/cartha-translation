  source_fidelity: 'Первые четыре смысловых компонента переданы верно: רדף — «преследовал», אויבי — «своих врагов», השמיד — «истребил», ולא אשוב — «не повернул назад». Заключительное «пока им не пришёл конец» передаёт общий итог, но несколько ослабляет и эвфемизирует значение כלותם («до их полного уничтожения / пока с ними не было покончено»).'
