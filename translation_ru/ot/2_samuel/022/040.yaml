base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: ru
  text: Ты препоясал меня силой для битвы[a] и заставил восставших против меня склониться передо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты наделил меня силой для битвы». Буквально глагол передаёт образ препоясывания, то есть подготовки и укрепления для сражения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «заставил восставших против меня склониться подо мной». Еврейский глагол выражает принуждение склониться или пасть на колени; пространственный образ передаёт полное подчинение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: Ты препоясал меня
  rationale: Редкий глагол אזר обозначает препоясывание, а в переносном смысле — наделение силой и готовностью. «Препоясал меня силой» сохраняет образ еврейского текста и естественно звучит в возвышенной поэтической речи.
- source_word: חַיִל
  choice: силой
  rationale: В данном контексте חַיִל означает мощь или силу, которой Бог наделяет говорящего для сражения.
- source_word: לַמִּלְחָמָה
  choice: для битвы
  rationale: מִלְחָמָה может означать войну или битву; здесь сочетание с подготовкой говорящего лучше передаётся как «для битвы».
- source_word: תַּכְרִיעַ
  choice: поверг
  rationale: Каузативная форма כרע означает заставить склониться, пасть или преклонить колени. «Поверг» кратко и естественно передаёт насильственное низведение противников, хотя образ склонения поясняется в сноске.
- source_word: קָמַי
  choice: восставших против меня
  rationale: Причастная форма от קום буквально обозначает тех, кто встал или восстал против говорящего; перевод сохраняет этот образ.
- source_word: תַּחְתֵּנִי
  choice: под меня
  rationale: Буквально «подо мной/под меня». При глаголе движения «поверг» форма «под меня» сохраняет пространственный образ подчинения.
