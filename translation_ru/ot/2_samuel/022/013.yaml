  text: От сияния пред Ним разгорелись огненные угли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: От сияния
  rationale: Существительное נֹגַהּ обозначает сияние, яркий свет; предлог מִן передаёт источник или исходную точку. «От сияния» естественно звучит по-русски и сохраняет образ богоявления.
- source_word: נֶגְדּוֹ
  choice: пред Ним
  rationale: נֶגֶד с местоименным суффиксом 3-го лица мужского рода означает «перед ним», «пред ним». Форма «пред Ним» уместна в возвышенной поэзии и сохраняет пространственный образ.
- source_word: בָּעֲרוּ
  choice: разгорелись
  rationale: Глагол בער в породе qal означает «гореть, пылать». «Разгорелись» живо передаёт возникновение или усиление пламени, не вводя внешнего действующего лица.
- source_word: גַּחֲלֵי אֵשׁ
  choice: огненные угли
  rationale: Буквально сочетание значит «угли огня». По-русски «огненные угли» естественнее и сохраняет яркий поэтический образ; вариант «горящие угли» также лексически возможен.
theological_decisions:
- issue: Образ богоявления и подразумеваемая причинность
  choice: Огненные угли представлены как разгоревшиеся от сияния пред Богом, без добавления прямого действия Бога.
  alternative: «Его сияние воспламенило огненные угли».
  rationale: Еврейская строка поэтически сжата и не выражает отдельного каузативного глагола. Выбранная передача сохраняет последовательность образов и не делает подразумеваемую причинность более определённой, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Местоимение «Ним» написано с прописной буквы как традиционное указание на Бога; синтаксис остаётся ясным для современного читателя.
