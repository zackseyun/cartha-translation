lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Я истёр их
  rationale: Глагол שׁחק в породе qal выражает измельчение вплоть до состояния праха. «Истёр» естественно сочетается с образом праха и сохраняет силу исходного образа.
- source_word: כַּעֲפַר אָרֶץ
  choice: словно прах земной
  rationale: עפר — «прах, пыль, рыхлая земля», а ארץ — «земля». Формулировка сохраняет еврейскую конструкцию и звучит достойно и понятно по-русски.
- source_word: כְּטִיט חוּצוֹת
  choice: словно уличную грязь
  rationale: טיט обозначает грязь или ил, а חוצות — улицы либо открытые общественные места. «Уличная грязь» кратко и наглядно передаёт образ.
- source_word: אֲדִקֵּם
  choice: я размельчил их
  rationale: Hiphil от דקק означает сделать мелким, раздробить или растолочь. «Размельчил» передаёт результативность формы и не повторяет дословно первый глагол.
- source_word: אֶרְקָעֵם
  choice: и втоптал
  rationale: רקע может означать выбивать, расплющивать, растягивать или утаптывать. В сочетании с уличной грязью «втоптал» естественно передаёт воинственный образ, а иная возможная смысловая грань отмечена в сноске.
