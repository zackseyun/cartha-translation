  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: ru
  text: Тогда стали видны русла моря, обнажились основания мира — от окрика Яхве, от дуновения дыхания Его ноздрей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: стали видны
  rationale: Передаёт значение нифаля «стали видимыми» и естественно звучит в современной русской поэтической прозе.
- source_word: אֲפִקֵי יָם
  choice: русла моря
  rationale: אֲפִיקִים обозначает русла или водные протоки; «русла моря» сохраняет образ отступивших вод, не сужая его до источников или морского дна.
- source_word: יִגָּלוּ
  choice: обнажились
  rationale: Нифаль глагола גלה означает «быть открытым, обнажиться»; выбор сохраняет яркий образ и параллелизм с «стали видны».
- source_word: מֹסְדוֹת תֵּבֵל
  choice: основания мира
  rationale: תֵּבֵל в поэзии обозначает мир, нередко обитаемый мир; краткое «мира» естественно и сохраняет космический масштаб.
- source_word: בְּגַעֲרַת
  choice: от грозного окрика
  rationale: גְּעָרָה — властный окрик, порицание или угрозa. В теофаническом контексте «грозный окрик» передаёт одновременно голосовую и устрашающую силу образа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: от дуновения дыхания Его ноздрей
  rationale: Сохраняет накопление слов נִשְׁמָה и רוּחַ и буквальный антропоморфный образ אַף «ноздри», не заменяя его отвлечённым «гневом».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя; транслитерация «Яхве» сохраняет это различие и не превращает имя в титул.
- issue: Значение אַפּוֹ в образе божественного дыхания
  choice: Его ноздрей
  alternative: Его гнева
  rationale: Хотя אַף может метонимически означать гнев, сочетание с дыханием/дуновением поддерживает буквальный телесный образ ноздрей; подразумеваемый гнев не устраняется, но и не подменяет образ.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической образностью. Сохранены параллелизм, космический масштаб и антропоморфный образ; синтаксис сделан ясным для обычного читателя.
