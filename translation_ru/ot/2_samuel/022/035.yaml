lexical_decisions:
- source_word: מְלַמֵּד
  choice: обучает
  rationale: Причастная форма глагола למד обозначает продолжающееся обучение и практическую подготовку; «обучает» естественно передаёт это значение в воинском контексте.
- source_word: יָדַי
  choice: мои руки
  rationale: Сохранён конкретный телесный образ оригинала, а не обобщённое «меня».
- source_word: לַמִּלְחָמָה
  choice: битве
  rationale: מִלְחָמָה может обозначать как войну, так и отдельное сражение. В сочетании с обучением рук «битве» звучит естественно и сохраняет непосредственный боевой контекст.
- source_word: וְנִחַת
  choice: могут согнуть
  rationale: Форма описывает сгибание лука благодаря силе рук говорящего. Передача через способность естественна по-русски и согласуется с контекстом дарованной Богом воинской силы; более буквальная пассивная конструкция указана в примечании.
- source_word: קֶשֶׁת
  choice: лук
  rationale: Обычное обозначение данного оружия.
- source_word: נְחוּשָׁה
  choice: бронзовый
  rationale: Слово может относиться к бронзе или меди; «бронзовый лук» — ясная и наиболее вероятная передача образа особо прочного оружия.
- source_word: זְרֹעֹתַי
  choice: мои руки
  rationale: זְרוֹעַ точнее обозначает руку как источник физической силы, в отличие от יָד. В естественном русском стихе «руки» передаёт этот образ без неуместно анатомического «предплечья»; различие поясняется примечанием.
theological_decisions:
- issue: Божественная источник воинского умения и силы
  choice: Стих приписывает Богу обучение и физическую силу Давида для реального сражения.
  alternative: Истолковать слова как общее обещание духовной силы для всех верующих.
  rationale: Контекст песни благодарения говорит о Божьем избавлении и поддержке царя в буквальной войне; перевод не превращает исторический образ в аллегорию.
- issue: Грамматическое выражение сгибания лука
  choice: Передать результат как способность рук говорящего согнуть лук, отметив буквальную пассивную возможность в сноске.
  alternative: «Бронзовый лук сгибается моими руками».
  rationale: Еврейская конструкция допускает пассивное понимание и подчёркивает действие силы, данной Богом. Основной текст сохраняет смысл без тяжеловесной русской конструкции, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной поэтической интонацией. Сохранены конкретные телесные и воинские образы. Повтор слова «руки» обусловлен отсутствием в обычном русском столь же естественного различения между יָד и זְרוֹעַ; различие разъяснено в сноске.
