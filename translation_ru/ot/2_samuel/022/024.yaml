    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Я был
  rationale: Форма глагола היה в поэтическом повествовании естественно передаётся прошедшим временем; союз ו выражен русской связью между строками и не требует механического «и» в начале.
- source_word: תָמִים
  choice: непорочен
  rationale: Слово обозначает цельность, полноту и нравственную безупречность. «Непорочен» сохраняет сильное утверждение текста, но само по себе не требует значения абсолютной безгрешности.
- source_word: לוֹ
  choice: перед Ним
  rationale: Буквально «Ему/по отношению к Нему»; в данном контексте выражает оценку человека Богом. «Перед Ним» естественно передаёт смысл «в Его глазах».
- source_word: וָאֶשְׁתַּמְּרָה
  choice: хранил себя
  rationale: Возвратная форма שׁמר выражает сознательное оберегание самого себя; «хранил себя» сохраняет эту возвратность и уместно для возвышенной поэзии.
- source_word: מֵעֲוֺנִי
  choice: от своего беззакония
  rationale: עָוֹן может означать беззаконие, вину или грех. «Беззаконие» сохраняет нравственную тяжесть слова, а «своего» передаёт суффикс первого лица и естественно согласуется с «себя».
theological_decisions:
- issue: Подразумевает ли высказывание Давида абсолютную безгрешность
  choice: Сохранить сильное заявление о непорочности перед Богом как о нравственной цельности, не уточняя его как абсолютное совершенство
  alternative: Передать как прямое утверждение абсолютной нравственной безгрешности
  rationale: תָמִים допускает смысл цельности и непорочности. Перевод сохраняет богословское напряжение между сильным самоописанием Давида и упоминанием «своего беззакония», не разрешая его добавочным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Заглавная буква в местоимении «Ним» обозначает Бога согласно принятой русской издательской практике; порядок маркеров приведён в последовательность [a], [b].
