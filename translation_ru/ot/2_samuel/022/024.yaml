  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: ru
  text: Я был безупречен перед Ним[a] и берег себя от своего беззакония[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был целостен перед Ним»; еврейское слово может подчёркивать цельность и полноту, а не только отсутствие вины.'
