  yaml_path: translation/ot/2_samuel/022/002.yaml
  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: ru
  text: 'Он сказал: «Господь — моя скала, моя крепость и мой избавитель».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; написание с прописной буквы отличает имя Бога в данном контексте.
- source_word: סַלְעִי
  choice: моя скала
  rationale: Сохраняет конкретный поэтический образ надёжного укрытия и опоры.
- source_word: מְצֻדָתִי
  choice: моя крепость
  rationale: Передаёт образ защищённого, укреплённого места естественным литературным русским словом.
- source_word: מְפַלְטִי לִי
  choice: мой избавитель
  rationale: Форма с притяжательным суффиксом уже выражает личное отношение; дополнительное לִי усиливает личную направленность, но буквальное «избавитель для меня» по-русски тяжеловесно и избыточно.
theological_decisions:
- issue: Передача личного имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» сохраняет устойчивую русскую библейскую традицию и не вносит конфессионально специфического оттенка; исходное имя учтено в редакционном решении.
- issue: Повтор личной отнесённости в מְפַלְטִי לִי
  choice: мой избавитель
  alternative: мой избавитель для меня
  rationale: Личную направленность сохраняет «мой»; неестественный русский повтор не требуется и не добавляет отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Три параллельных именных образа сохранены; связка «есть» естественно опущена.
