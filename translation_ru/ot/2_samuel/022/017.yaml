  text: Он послал с высоты[a], взял меня и извлёк меня из многих вод[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёр с высоты». В еврейском тексте не названо то, что было послано или простёрто.'
