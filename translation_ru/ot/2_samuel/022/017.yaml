  - marker: b
    text: 'Или: «из великих вод» или «из могучих вод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: простёр руку
  rationale: Глагол буквально означает «послал» и может выражать протягивание чего-либо. Поскольку дополнение в еврейском тексте не названо, «руку» восстановлено по смыслу образа спасения; это делает фразу естественной по-русски, не меняя направления действия.
- source_word: מִמָּרוֹם
  choice: с высоты
  rationale: Передаёт пространственный и поэтический смысл מָרוֹם, не конкретизируя его словом «небеса», которого в оригинале нет.
- source_word: יִקָּחֵנִי
  choice: взял меня
  rationale: Сохраняет широкое, простое значение לקח и не усиливает его до «схватил» или «подхватил».
- source_word: יַמְשֵׁנִי
  choice: извлёк меня
  rationale: Порода hифиль глагола משה обозначает вытаскивание, особенно из воды; «извлёк» точно и уместно в возвышенной поэтической речи.
- source_word: מִמַּיִם רַבִּים
  choice: из вод многих
  rationale: Сохраняет буквальный образ многочисленных вод и поэтический порядок слов; не сужает значение до «бурных» или «могучих» вод.
theological_decisions:
- issue: Образ Божьего спасения свыше
  choice: с высоты
  alternative: с небес
  rationale: Оригинал говорит о высоте, не называя прямо небеса; более общее пространственное выражение сохраняет поэтическую образность и не вводит лишней космологической конкретизации.
- issue: Неназванный объект глагола יִשְׁלַח
  choice: простёр руку
  alternative: послал с высоты
  rationale: В контексте спасения подразумевается протянутое свыше действие. Добавление «руку» отмечено сноской и служит естественности русского текста, не превращая подразумеваемый образ в скрытое догматическое утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «из вод многих» сохранена ради ритма и образности; архаические формы и конфессионально окрашенная лексика не используются.
