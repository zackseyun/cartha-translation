  source_fidelity: 'Основной смысл передан точно: מגדיל ישועות отражено как дарование великих избавлений, множественное число יְשׁוּעוֹת сохранено; «царь», «помазанник», Давид, его потомство и длительность עַד עוֹלָם представлены без утраты. Однако пунктуационная аппозиция с одиночным тире несколько слишком уверенно объединяет «Давида и его потомство» как пояснение к одному слову «помазанник». Более нейтральная последовательность косвенных дополнений ближе к еврейскому построению и сохраняет его компактность.'
