base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: ru
  text: Он дарует великие избавления[a] Своему царю и являет неизменную любовь[b] Своему помазаннику[c], Давиду и его потомству навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвеличивает избавления»; возможны также переводы: «дарует великие победы» или «великое спасение».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово חֶסֶד может также означать «верная любовь», «преданная любовь» или «верность завету».
    reason: lexical_alternative
  - marker: c
    text: «Помазанник» может быть передано и как «Мессия». Здесь слово прежде всего относится к Давиду и царю из его династии, сохраняя при этом более широкое мессианское звучание обещания.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל
  choice: дарует великие
  rationale: Причастие породы hифиль от גדל буквально означает «делающий великим, возвеличивающий». В сочетании с יְשׁוּעוֹת естественное русское выражение «дарует великие избавления» передаёт результативно-каузативный смысл без неясного буквализма.
- source_word: יְשׁוּעוֹת
  choice: избавления
  rationale: Форма множественного числа обозначает спасительные действия, избавления или победы. Множественное «избавления» сохраняет грамматическое число и подчёркивает неоднократные действия Бога.
- source_word: מַלְכּוֹ
  choice: царю Своему
  rationale: Существительное с суффиксом 3-го лица мужского рода единственного числа прямо обозначает царя, принадлежащего или относящегося к Господу. Порядок слов выбран ради естественного русского стиля.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: и являет верную любовь
  rationale: חֶסֶד включает любовь, преданность и верность обязательствам, особенно в контексте отношений завета. «Являет верную любовь» звучит естественно и сохраняет как личностную, так и верностную сторону слова; заветный оттенок пояснён в сноске.
- source_word: לִמְשִׁיחוֹ
  choice: Своему помазаннику
  rationale: מָשִׁיחַ буквально означает «помазанный, помазанник». В ближайшем историческом контексте речь идёт о Давиде и царе из его династии; перевод сохраняет также мессианское звучание, не превращая его преждевременно в однозначное имя-титул.
- source_word: לְדָוִד
  choice: Давиду
  rationale: Имя передано в принятой русской библейской форме; оборот после тире раскрывает, кто непосредственно назван Божьим помазанником.
- source_word: וּלְזַרְעוֹ
  choice: и его потомству
  rationale: זֶרַע — собирательное существительное в единственном числе, обозначающее потомство или род. «Потомству» сохраняет собирательный смысл и заветное звучание естественнее, чем буквальное «семени».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткое и естественное русское соответствие выражению неограниченной длительности в контексте обещания Давиду и его линии.
theological_decisions:
- issue: Передача חֶסֶד в контексте обещания Давиду
  choice: верную любовь
  alternative: верность завету; неизменную любовь; преданную любовь
  rationale: Основной текст не добавляет слово «завет», отсутствующее непосредственно в еврейской фразе, но прилагательное «верную» сохраняет оттенок постоянства и преданности. Сноска указывает на важный заветный смысл термина.
- issue: Передача מְשִׁיחוֹ
  choice: Своему помазаннику
  alternative: Своему Мессии
  rationale: Непосредственный референт — Давид и давидический царь. «Помазанник» сохраняет исторический смысл и одновременно оставляет открытой более широкую мессианскую перспективу, не сводя текст только к одному уровню исполнения.
- issue: Отношение «Давиду и его потомству» к слову «помазаннику»
  choice: аппозиция после тире
  alternative: перечень без пунктуационного выделения
  rationale: Тире естественно показывает, что Давид и его потомство конкретизируют царского помазанника и линию обещания, при этом не утверждает, будто каждый потомок без различия обязательно назван помазанником в одном и том же смысле.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Своему» написано с прописной буквы по принятой русской традиции благоговейного обозначения Бога. Сохранено множественное число «избавления» и собирательное «потомство»; богословская многозначность слов חֶסֶד и מָשִׁיחַ не устранена.
