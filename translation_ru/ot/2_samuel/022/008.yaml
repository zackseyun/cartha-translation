  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: ru
  text: Тогда земля зашаталась и задрожала; основания небес затрепетали и поколебались, потому что Он разгневался.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: задрожала
  rationale: Передаёт сильное сотрясение земли и сохраняет параллелизм с предшествующим глаголом.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: основания небес
  rationale: Формально и естественно передаёт поэтический космологический образ исходного текста.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  choice: затрепетали и поколебались
  rationale: Сохраняет два близких, но не тождественных глагола движения без искусственного уточнения образа.
- source_word: כִּי חָרָה לוֹ
  choice: потому что Он разгневался
  rationale: Идиома буквально связана с разгоранием гнева; в современном русском естественно передаётся глаголом «разгневался».
theological_decisions:
- issue: Не названный прямо субъект гнева
  choice: Он
  alternative: Господь
  rationale: В стихе субъект выражен местоименным суффиксом, а его отождествление ясно из контекста; местоимение сохраняет форму исходного текста и не добавляет имени.
translation_notes:
