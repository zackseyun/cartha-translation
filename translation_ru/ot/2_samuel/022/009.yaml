lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: дым поднялся
  rationale: Передаёт направленное вверх движение и сохраняет конкретный поэтический образ.
- source_word: בְּאַפּוֹ
  choice: из Его ноздрей
  rationale: Хотя אַף может идиоматически означать гнев, параллель с «из Его уст» поддерживает конкретный телесный образ; ב передано по-русски как указание на источник исходящего дыма.
- source_word: וְאֵשׁ מִפִּיו
  choice: и огонь из Его уст
  rationale: Прямой перевод сохраняет параллелизм с дымом из ноздрей и антропоморфный образ теофании.
- source_word: תֹּאכֵל
  choice: пожирал
  rationale: Личная форма глагола точнее сохраняет активное действие еврейского текста и представляет огонь как пожирающий.
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: угли разгорелись
  rationale: «Разгорелись» естественно передаёт яркое горение или воспламенение, не добавляя определения, отсутствующего при существительном.
- source_word: מִמֶּנּוּ
  choice: от Него
  rationale: Сохраняет значение источника; формулировка допускает образ огня, исходящего от Бога, не уточняя сверх текста механизм возгорания.
theological_decisions:
- issue: Антропоморфный язык о Боге в теофании
  choice: Сохранены буквальные образы ноздрей, уст, дыма и огня, исходящих от Него.
  alternative: 'Передать בְּאַפּוֹ отвлечённо: «в Его гневе».'
  rationale: Поэтический контекст и параллель с устами поддерживают телесный образ. Буквальная передача сохраняет напряжение между антропоморфизмом и указанием на Божий гнев, не сводя образ к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной поэтической образностью. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
