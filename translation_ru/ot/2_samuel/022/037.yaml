  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: ru
  text: Ты даёшь простор моим шагам[a], и лодыжки мои не подвернулись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ты расширяешь мои шаги подо мной». Это еврейское выражение означает, что Бог даёт достаточно места и надёжную опору для движения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лодыжки мои не пошатнулись». Еврейский глагол может также обозначать поскальзывание или утрату устойчивости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: даёшь простор
  rationale: Порода hифиль от רחב выражает причинение широты, простора. По-русски «даёшь простор» естественно передаёт этот каузативный смысл и сохраняет поэтический образ.
- source_word: צַעֲדַי
  choice: моим шагам
  rationale: Существительное צעד означает «шаг» или «поступь». Выбор сохраняет телесный образ движения и прямую связь с еврейским текстом.
- source_word: תַּחְתֵּנִי
  choice: передано в смысле устойчивого простора для движения
  rationale: Буквально — «подо мной». В составе еврейской идиомы выражает достаточную и надёжную опору; буквальная пространственная формулировка сохранена в сноске.
- source_word: וְלֹא
  choice: и … не
  rationale: Сохранена сочинительная связь без внесения более сильного целевого значения «чтобы не».
- source_word: מָעֲדוּ
  choice: не подгибаются
  rationale: Глагол מעד может означать скольжение, шатание или утрату устойчивости. В сочетании с лодыжками «не подгибаются» естественно передаёт образ телесной устойчивости.
- source_word: קַרְסֻלָּי
  choice: мои лодыжки
  rationale: Слово обозначает область лодыжек, а не ступни вообще; точный анатомический образ сохранён.
