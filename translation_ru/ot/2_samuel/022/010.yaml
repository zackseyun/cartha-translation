lexical_decisions:
- source_word: וַיֵּט
  choice: наклонил
  rationale: Глагол נטה с объектом «небеса» изображает, как Бог склоняет небеса вниз; «наклонил» естественно по-русски и сохраняет динамичный космический образ.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Поэтическое «небеса» передаёт возвышенный и космический характер теофании лучше, чем нейтральное «небо».
- source_word: וַיֵּרַד
  choice: сошёл
  rationale: Краткий и естественный русский эквивалент ירד, сохраняющий пространственный образ нисхождения.
- source_word: וַעֲרָפֶל
  choice: мрак
  rationale: עֲרָפֶל обозначает густую тьму или тёмное облако, нередко связанную с явлением Господа. «Мрак» звучит поэтично и не устраняет лексическую неоднозначность, которая отмечена в сноске.
- source_word: תַּחַת
  choice: под
  rationale: Прямой пространственный эквивалент, естественный в данном поэтическом обороте.
- source_word: רַגְלָיו
  choice: Его ногами
  rationale: Сохраняется буквальный телесный образ еврейского текста, а не вводится пояснительное «стопами» или «следами».
theological_decisions:
- issue: Антропоморфный образ явления Бога
  choice: 'Сохранить буквальные пространственные и телесные образы: «сошёл» и «под Его ногами».'
  alternative: 'Смягчить образ, например: «явился с небес».'
  rationale: Еврейская поэзия описывает теофанию антропоморфным языком. Перевод не должен устранять напряжение между Божьей трансцендентностью и зримым образом Его нисхождения.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Параллельная структура стиха и конкретная образность оригинала сохранены; местоимение «Его» написано с прописной буквы как традиционно уважительное обозначение Бога.
