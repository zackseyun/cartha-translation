  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: ru
  text: Ведь я соблюдал пути Яхве и не отступал от моего Бога, поступая нечестиво.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не поступал нечестиво против моего Бога».'
    reason: Лаконичная еврейская конструкция допускает понимание предлога не только как удаления от Бога, но и как обозначения поступка против Него.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предыдущего утверждения; «ведь» естественно передаёт пояснительную силу в русской поэтической речи.
- source_word: שָׁמַרְתִּי
  choice: я хранил
  rationale: Глагол שׁמר означает «хранить, соблюдать»; «хранил» сохраняет образ путей и обозначает устойчивую верность.
- source_word: דַּרְכֵי
  choice: пути
  rationale: Множественное число от דֶּרֶךְ обозначает пути как образ поведения и предписанного Богом образа жизни.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: וְלֹא רָשַׁעְתִּי
  choice: и не отступал нечестиво
  rationale: Передаёт как нравственную характеристику глагола רשע, так и идею удаления, создаваемую последующим предлогом מִן.
- source_word: מֵאֱלֹהָי
  choice: от моего Бога
  rationale: Предлог מִן прежде всего обозначает удаление «от»; форма אֱלֹהָי содержит притяжательное значение «мой Бог».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл רָשַׁעְתִּי מֵאֱלֹהָי
  choice: не отступал нечестиво от моего Бога
  alternative: не поступал нечестиво против моего Бога
  rationale: Выбранный вариант сохраняет нравственную силу רשע и пространственно-реляционную силу מִן, не сводя выражение только к вине перед Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и образ «путей» сохранены; архаизмы по возможности исключены.
