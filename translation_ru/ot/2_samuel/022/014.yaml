  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: ru
  text: 'Яхве возгремел с небес,

    и Всевышний подал Свой голос.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал Свой голос»; поэтическое выражение, параллельное словам «возгремел». Возможный перевод: «возвысил Свой голос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: возгремел
  rationale: Форма глагола רעם обозначает произведённый гром; «возгремел» естественно передаёт грозовую теофанию и сохраняет возвышенную поэтическую окраску.
- source_word: מִן שָׁמַיִם
  choice: с небес
  rationale: שָׁמַיִם допускает значения «небо/небеса»; в контексте явления Бога «с небес» звучит естественно и сохраняет пространственно-богословский смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не его замена титулом.
- source_word: וְעֶלְיוֹן
  choice: и Всевышний
  rationale: עֶלְיוֹן выступает здесь как божественный титул в поэтическом параллелизме с именем Яхве; «Всевышний» — ясное и традиционно понятное русское соответствие.
- source_word: יִתֵּן קוֹלוֹ
  choice: подал Свой голос
  rationale: 'Буквально: «дал Свой голос». Выражение «подал голос» понятно по-русски, сохраняет образность оригинала и параллель с громом, не сводя её однозначно к простому «заговорил».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Соотношение יְהוָה и עֶלְיוֹן
  choice: Сохранить как параллельные обозначения одного действующего лица
  alternative: Истолковать «Всевышний» как отдельное или исключительно пояснительное наименование
  rationale: Еврейский поэтический параллелизм соотносит обе строки, но перевод не добавляет отсутствующего в тексте явного отождествляющего пояснения.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Инверсия и архаизмы сведены к минимуму; «возгремел» сохранено ради образа грозовой теофании. Местоимение «Свой» написано с прописной буквы как уместная в русском библейском регистре форма почтительности.
