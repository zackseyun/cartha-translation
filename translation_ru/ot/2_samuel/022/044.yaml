  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: ru
  text: Ты избавил меня от распрей моего народа[a]; Ты сохранил меня главой народов[b]; народ, которого я не знал, служил мне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от раздоров, связанных с моим народом». Еврейское выражение может указывать как на внутренние раздоры среди народа Давида, так и на конфликты, связанные с его народом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты уберёг меня как вождя народов».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «народ, которого я не знал, будет служить мне». Еврейская глагольная форма в поэтическом контексте допускает оттенок будущего времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Ты избавил меня
  rationale: Порода hифиль глагола פלט с суффиксом первого лица выражает избавление, спасение от опасности; «избавил» естественно для русской поэтической речи и сохраняет направленность действия Бога.
- source_word: מֵרִיבֵי עַמִּי
  choice: от распрей в моём народе
  rationale: רִיב охватывает распри, раздоры и противоборство. Формулировка сохраняет возможность понимать речь о внутренних конфликтах среди народа Давида, не сужая значение до судебных тяжб; возможная связь распрей с народом отмечена в сноске.
- source_word: תִּשְׁמְרֵנִי
  choice: Ты сохранил меня
  rationale: שׁמר означает хранить, оберегать, сохранять. Здесь «сохранил» передаёт Божье поддержание Давида в положении правителя.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: как главу народов
  rationale: רֹאשׁ метафорически обозначает главу или предводителя, а לְ указывает на роль или положение. Сохранена исходная метафора.
- source_word: גּוֹיִם
  choice: народов
  rationale: В царском контексте גּוֹיִם обозначает народы или нации вне Израиля; «народов» звучит естественно и не привносит более поздний оттенок слова «язычники».
- source_word: עַם לֹא יָדַעְתִּי
  choice: народ, которого я не знал
  rationale: Единственное собирательное עַם передано как «народ», а перфект יָדַעְתִּי — нейтральным прошедшим временем, обозначающим отсутствие прежнего знакомства или отношений.
- source_word: יַעַבְדֻנִי
  choice: служил мне
  rationale: עבד здесь обозначает политическое служение или подчинение. Прошедшее время согласуется с ретроспективным характером песни, тогда как возможный будущий оттенок имперфекта сохранён в сноске.
theological_decisions:
- issue: Царская власть над чужими народами
  choice: Сохранён непосредственный историко-царский смысл слов Давида без прямого мессианского уточнения.
  alternative: Передать этот стих в основном тексте как непосредственное пророчество о Мессии.
  rationale: Контекст представляет песнь Давида о Божьем избавлении и утверждении его царской власти. Возможное более широкое каноническое прочтение не должно подменять непосредственный смысл еврейского текста.
- issue: Временной оттенок יַעַבְדֻנִי
  choice: 'Основной текст передан прошедшим временем: «служил мне».'
  alternative: «будет служить мне».
  rationale: Еврейский имперфект в поэзии допускает будущий, длительный или результирующий оттенок. Ретроспективный контекст поддерживает прошедшее время, но неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимение «Ты» написано с прописной буквы как традиционная форма почтительного обращения к Богу; синтаксис остаётся ясным для современного читателя.
