  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: ru
  text: Узы шеола окружили меня[a]; сети смерти встретили меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могилы»; или: «мира мёртвых» — вместо «шеола».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вышли мне навстречу»; возможно также: «встали у меня на пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: узы
  rationale: Слово обозначает верёвки, путы или узы. «Узы» естественно звучит в русской поэзии и сохраняет образ связанности и невозможности вырваться, не переосмысливая его как «муки».
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не сужает смысл до могилы или абстрактной смерти.
- source_word: סַבֻּנִי
  choice: окружили меня
  rationale: Прямо передаёт значение глагола סבב — окружать, обступать.
- source_word: קִדְּמֻנִי
  choice: встали у меня на пути
  rationale: Глагол קדם здесь описывает встречу или выход навстречу. Эта формулировка передаёт враждебное столкновение и сохраняет пространственный образ, не усиливая его до «настигли».
- source_word: מֹקְשֵׁי
  choice: сети
  rationale: מוקש означает ловушку или силок. «Сети» — понятный русский поэтический образ, хорошо сочетающийся с узами в первой строке.
- source_word: מָוֶת
  choice: смертельные
  rationale: Атрибутивная передача сочетания «сети смерти» естественна по-русски; при этом она может восприниматься как «несущие смерть». Более буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Сохранение древнееврейского термина не решает заранее, идёт ли речь прежде всего о могиле, смерти или мире мёртвых, и тем самым удерживает смысловую и богословскую широту образа.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического параллелизма. «Шеол» оставлен как содержательно значимый древнееврейский термин; строчная буква соответствует его употреблению как обозначения мира мёртвых, а не имени собственного.
