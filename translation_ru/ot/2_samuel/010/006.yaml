  register: Современный литературный русский язык с достоинством исторического повествования. Этноним «аммонитяне» выбран вместо формального «сыновья Аммона» ради естественности; «арамеи» сохраняет историческое наименование. Синтаксис следует последовательности еврейского текста, но перестроен ровно настолько, чтобы перечень союзных войск читался ясно.
