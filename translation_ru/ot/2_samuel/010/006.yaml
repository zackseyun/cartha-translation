  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: ru
  text: Когда аммонитяне увидели, что стали отвратительны Давиду[a], они послали за арамеями из Бет-Рехова и арамеями из Цовы и наняли двадцать тысяч пехотинцев; царя Маахи с тысячью воинов; и людей из Това[b] — двенадцать тысяч воинов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стали зловонием для Давида», то есть вызвали у него отвращение.'
    reason: lexical_alternative
  - marker: b
    text: Возможно также прочтение «Иш-Тов» — как название места или рода.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Естественное современное русское обозначение народа; буквальное «сыновья Аммона» в данном повествовательном контексте звучало бы искусственно.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: стали ненавистны Давиду
  rationale: Передаёт идиоматический смысл глагола באשׁ — стать отвратительными, вызвать резкое отвращение; буквальный образ дурного запаха сохранён в сноске.
- source_word: וַיִּשְׁלְחוּ וַיִּשְׂכְּרוּ
  choice: послали нанять
  rationale: Сохраняет оба еврейских глагола, не добавляя отсутствующего в тексте объекта «послов»; по-русски цель посылки выражена инфинитивом естественно.
- source_word: אֲרַם בֵּית רְחוֹב
  choice: арамеев из Бет-Рехова
  rationale: Этноним «арамеи» исторически и лексически точнее традиционного «сирийцы»; сочетание понимается как арамеи соответствующей области.
- source_word: אֲרַם צוֹבָא
  choice: арамеев из Цовы
  rationale: Передаёт אֲרַם этнонимом «арамеи», а צובא — принятой русской библейской формой топонима «Цова».
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: двадцать тысяч пеших воинов
  rationale: Точно обозначает сухопутное пешее войско и звучит понятнее для широкого читателя, чем термин «пехотинцы» в древнем контексте.
- source_word: מֶלֶךְ מַעֲכָה
  choice: царя Маахи
  rationale: Конструктивное сочетание указывает на правителя области Мааха, а не на царя по имени Мааха.
- source_word: אִישׁ טוֹב
  choice: людей из Това
  rationale: По контексту и параллельному месту выражение вероятнее всего относится к людям области Тов; грамматически возможная передача «Иш-Тов» отмечена в сноске.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: двенадцать тысяч человек
  rationale: Прямая и ясная передача численности без добавления не выраженного существительного «воинов».
