base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: ru
  text: А остальных воинов он отдал под начало своего брата Авессы[a], а сам выстроил их в боевой порядок против сынов Аммона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал в руку своего брата Авессы», то есть передал под его командование.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «аммонитян». Буквально: «сынов Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: остальных воинов
  rationale: Буквально «остальной народ», но в данном военном контексте речь идёт об оставшейся части войска; «воины» ясно передаёт контекстуальный смысл.
- source_word: נָתַן בְּיַד
  choice: отдал под начало
  rationale: Еврейская идиома буквально означает «дал в руку» и здесь указывает на передачу воинов под власть и командование Авессы.
- source_word: אַבְשַׁי
  choice: Авесса
  rationale: Использована устоявшаяся в русской библейской традиции форма имени, узнаваемая современным читателем.
- source_word: אָחִיו
  choice: своего брата
  rationale: Суффикс относится к Иоаву; возвратное местоимение естественно и недвусмысленно передаёт родственную связь.
- source_word: וַיַּעֲרֹךְ
  choice: и тот выстроил их для боя
  rationale: Глагол ערך в военном контексте означает построение войска в боевой порядок. «Тот» естественно указывает на ближайшего деятеля, Авессу.
- source_word: לִקְרַאת
  choice: против
  rationale: Буквально выражение связано с выходом навстречу, однако в контексте сражения обозначает противостояние неприятелю.
- source_word: בְּנֵי עַמּוֹן
  choice: сынов Аммона
  rationale: Сохранено буквальное еврейское обозначение народа; более гладкий вариант — «аммонитян».
theological_decisions: []
