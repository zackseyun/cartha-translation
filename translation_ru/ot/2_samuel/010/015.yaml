  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: ru
  text: Когда арамеи увидели, что потерпели поражение от Израиля, они собрались вместе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא אֲרָם
  choice: Когда арамеи увидели
  rationale: Вав-последовательность продвигает повествование, а связь двух действий естественно передана временным придаточным. Единственное собирательное имя אֲרָם обозначает здесь арамеев как народ или войско; множественное число по-русски ясно согласуется с последующим וַיֵּאָסְפוּ.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание увиденного, а не причину.
- source_word: נִגַּף
  choice: потерпели поражение
  rationale: Нифаль глагола נגף в военном контексте означает быть разбитым или побеждённым; выбранное выражение естественно для современного русского языка и не уточняет способ поражения.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: от Израиля
  rationale: В контексте сражения לִפְנֵי указывает, перед кем или чьей силой было понесено поражение. Русское «от Израиля» естественно выражает победившую сторону без неясного буквализма «перед Израилем».
- source_word: וַיֵּאָסְפוּ יָחַד
  choice: они собрались вместе
  rationale: Нифаль אָסף означает «собраться», а יָחַד — «вместе». Перевод сохраняет оба элемента и не вводит более узкое военное толкование «перегруппировались».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Собирательное אֲרָם раскрыто как «арамеи», чтобы избежать неестественного олицетворения страны и сохранить грамматическую связь с глаголом во множественном числе.
