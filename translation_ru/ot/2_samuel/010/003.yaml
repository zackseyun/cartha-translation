  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי עַמּ֜וֹן אֶל חָנ֣וּן אֲדֹֽנֵי/הֶ֗ם הַֽ/מְכַבֵּ֨ד דָּוִ֤ד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַֽחֲמִ֑ים הֲ֠/לוֹא בַּ/עֲב֞וּר חֲק֤וֹר אֶת הָ/עִיר֙ וּ/לְ/רַגְּלָ֣/הּ וּ/לְ/הָפְכָ֔/הּ שָׁלַ֥ח דָּוִ֛ד אֶת עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: ru
  text: 'Аммонитские вельможи сказали Хануну, своему господину: «Неужели, по-твоему,[a] Давид чтит твоего отца, раз послал к тебе людей, чтобы утешить тебя?[b] Не для того ли Давид послал к тебе своих слуг, чтобы обследовать город, разведать его и разрушить?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих глазах».'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о посланниках, прибывших выразить Хануну соболезнования после смерти его отца.
    reason: cultural_note
  - marker: c
    text: 'Или: «ниспровергнуть». Еврейский глагол буквально может означать «перевернуть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: аммонитские вельможи
  rationale: שָׂרִים обозначает знатных правителей, сановников или начальников. «Вельможи» естественно передаёт придворно-политическую обстановку и их высокий статус, не утверждая, что все они были царевичами.
- source_word: אֲדֹנֵיהֶם
  choice: своему господину
  rationale: Здесь אָדוֹן — человеческий титул власти. «Господин» сохраняет иерархический оттенок и не смешивает его с обращением к Богу.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: Неужели, по-твоему, Давид чтит
  rationale: Причастие от כבד означает оказывать честь, а идиома בְּעֵינֶיךָ — «в твоих глазах», то есть «по-твоему». Формулировка передаёт насмешливо-недоверчивый вопрос советников.
- source_word: מְנַחֲמִים
  choice: людей, чтобы утешить тебя
  rationale: Еврейское причастие во множественном числе буквально обозначает «утешителей». Контекст указывает на посланников с соболезнованиями; развёрнутая русская формулировка звучит естественнее и сохраняет функцию этих людей.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: обследовать город
  rationale: חקר здесь означает тщательно исследовать или осмотреть. «Обследовать» хорошо сочетается с подозрением в скрытой военной разведке.
- source_word: וּלְרַגְּלָהּ
  choice: разведать его
  rationale: Пиэль глагола רגל означает высмотреть, разведать или шпионски осмотреть. «Разведать» ясно выражает военную цель и сохраняет местоименную отсылку к городу.
- source_word: וּלְהָפְכָהּ
  choice: разрушить
  rationale: הפך буквально связано с переворачиванием, а в данном враждебном контексте означает ниспровергнуть или разрушить город. «Разрушить» понятно современному читателю и не добавляет лишней конкретики.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: עֲבָדִים при царе может обозначать слуг, подчинённых или царских служащих. «Слуги» сохраняет обычное значение слова; контекст показывает, что речь идёт о посланниках Давида.
theological_decisions:
- issue: Подозрение аммонитских вельмож не является утверждением повествователя
  choice: Сохранить обвинение в виде двух риторических вопросов
  alternative: Передать обвинение как установленный факт или прямо назвать посланников Давида шпионами
  rationale: Еврейский текст приводит подозрительные слова советников Хануна, но не подтверждает их оценку голосом повествователя. Риторическая форма сохраняет различие между речью персонажей и позицией рассказчика.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. «Вельможи» и «господин» сохраняют придворный контекст; синтаксис риторических вопросов передаёт насмешливое подозрение советников. Все примечания отмечены в основном тексте.
