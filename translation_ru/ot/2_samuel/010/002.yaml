base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: ru
  text: 'И сказал Давид: «Я проявлю доброту к Хануну, сыну Нахаша, как его отец проявил доброту ко мне». И Давид послал своих слуг, чтобы утешить Хануна в связи со смертью его отца[a]. Слуги Давида пришли в землю аммонитян.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «утешить его в связи с его отцом»; то есть выразить соболезнование по случаю смерти отца.'
    reason: Еврейское выражение называет утешение «в связи с его отцом»; смерть отца подразумевается контекстом.
lexical_decisions:
- source_word: חֶסֶד
  choice: милость
  rationale: В данном дипломатическом контексте слово обозначает благожелательность и верность в отношениях. «Милость» сохраняет широту еврейского понятия и естественно сочетается с глаголом «оказать» в обоих случаях.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Хануну, сыну Нахаша
  rationale: Имена переданы принятой русской библейской транслитерацией; родственная связь выражена ясно и естественно.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Передаёт сравнение и взаимность поступка без ненужного усиления.
- source_word: עָשָׂה ... חֶסֶד
  choice: оказал милость
  rationale: Это естественное русское соответствие еврейскому сочетанию «сделать милость».
- source_word: לְנַחֲמוֹ אֶל אָבִיו
  choice: утешить Хануна в скорби об отце
  rationale: Контекст указывает на утешение после смерти отца. Имя повторено вместо местоимения, чтобы в русском тексте не возникло двусмысленности относительно того, кого следовало утешить.
- source_word: בְּיַד עֲבָדָיו
  choice: послал своих слуг
  rationale: Еврейский оборот буквально означает действие «через/рукою» слуг; по-русски отправление слуг естественно и точно передаёт их роль посланников.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: землю аммонитян
  rationale: «Аммонитяне» — ясное и традиционное русское обозначение народа, буквально названного «сынами Аммона».
