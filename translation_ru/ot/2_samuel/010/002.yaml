  to: 'И сказал Давид: «Я проявлю доброту к Хануну, сыну Нахаша, как его отец проявил доброту ко мне». И Давид послал своих слуг, чтобы утешить Хануна в связи со смертью его отца[a]. Слуги Давида пришли в землю аммонитян.'
