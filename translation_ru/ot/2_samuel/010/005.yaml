base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: ru
  text: 'Когда Давиду сообщили, он отправил навстречу им людей[a], потому что эти люди были глубоко унижены[b]. Царь сказал: «Оставайтесь в Иерихоне, пока у вас не отрастут бороды, а потом возвращайтесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послал навстречу им». В еврейском тексте прямо не сказано, кого именно Давид отправил; по смыслу подразумеваются люди, посланные встретить их.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «были очень пристыжены» или «были сильно опозорены». Еврейское слово указывает на пережитый позор и унижение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Когда об этом сообщили Давиду
  rationale: В еврейском подлежащее не названо. Безличная русская конструкция естественно передаёт неопределённого деятеля; «об этом» восполняет подразумеваемый из контекста объект сообщения.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: он послал им навстречу
  rationale: Сохранена сжатая конструкция оригинала без добавления слова «посланников», хотя по смыслу Давид, очевидно, отправил людей.
- source_word: נִכְלָמִים מְאֹד
  choice: были глубоко унижены
  rationale: Форма от כלם обозначает состояние пережитого позора или публичного унижения; наречие «глубоко» передаёт усиление מְאֹד естественным русским выражением.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Оставайтесь в Иерихоне
  rationale: В данном контексте ישׁב означает временно оставаться или пребывать, а не буквально «сидеть».
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: пока у вас не отрастут бороды
  rationale: צמח значит «расти, произрастать»; контекст предшествующего острижения бород требует естественного русского «отрастут». Множественное «бороды» передаёт распределительное значение при обращении к нескольким мужчинам.
- source_word: וְשַׁבְתֶּם
  choice: а потом возвращайтесь
  rationale: Глагол שׁוב означает «возвращаться»; «потом» явно выражает временную последовательность, заданную оборотом с עַד.
