base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: ru
  text: Арамеи бежали от израильтян, и Давид убил семьсот арамейских воинов на колесницах[a] и сорок тысяч всадников. Он также сразил Шовака, военачальника их войска[b], и тот умер там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семьсот колесниц» или «семьсот колесничного войска». Точный референт неясен; возможно, имеются в виду воины на колесницах. В 1 Пар. 19:18 сказано: «семь тысяч колесниц».'
    reason: textual_variant
  - marker: b
    text: 'Или: «военачальника его войска». В еврейском тексте местоименный суффикс стоит в единственном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Арамеи бежали от израильтян
  rationale: אֲרָם здесь обозначает арамейский народ, а מִפְּנֵי в военном контексте выражает бегство от противника. Русские названия народов дают естественную и ясную фразу.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: Давид убил
  rationale: Глагол הרג прямо означает «убить»; нейтральный современный глагол также сохраняет отличие от נכה далее.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: семьсот воинов на колесницах
  rationale: רֶכֶב буквально обозначает колесницу или колесничное войско. Поскольку объектом убийства должны быть люди, перевод передаёт вероятный человеческий референт, не скрывая буквальную трудность в примечании.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: сорок тысяч всадников
  rationale: פָּרָשִׁים — всадники или конница; «всадники» является прямым и естественным русским соответствием.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Шовака
  rationale: Имя שׁוֹבַךְ передано русской транслитерацией масоретского чтения; падежная форма обусловлена синтаксисом.
- source_word: שַׂר צְבָאוֹ
  choice: военачальника их войска
  rationale: שַׂר в данном контексте означает военного начальника, а צָבָא — войско. В основном тексте множественное «их» естественно соотносит войско с арамеями; формально единственное число суффикса отмечено в сноске.
- source_word: הִכָּה
  choice: сразил
  rationale: נכה означает «поразить, сразить». «Сразил» уместно перед последующим сообщением о смерти и сохраняет отличие от הרג.
- source_word: וַיָּמָת שָׁם
  choice: и тот умер там
  rationale: Прямо передаёт факт смерти и שָׁם «там»; указательное «тот» ясно относит глагол к Шоваку, а не к Давиду.
