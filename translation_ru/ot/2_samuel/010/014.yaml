  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: ru
  text: Когда сыновья Аммона[a] увидели, что Арам[b] обратился в бегство, они сами побежали от Авессы и вошли в город. Тогда Иоав отошёл от сыновей Аммона[c] и пришёл в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аммонитяне»; буквально: «сыновья Аммона».'
    reason: lexical_alternative
  - marker: b
    text: То есть арамеи; в еврейском тексте — «Арам».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «отошёл от сыновей Аммона»; этот оборот означает, что Иоав прекратил военные действия против них.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: сыновья Аммона
  rationale: Буквально передаёт еврейское родовое обозначение и при этом понятно современному русскому читателю; идиоматический вариант «аммонитяне» указан в сноске.
- source_word: רָאוּ כִּי
  choice: увидели, что
  rationale: Сохраняет прямое значение конструкции восприятия, не усиливая её до «поняли».
- source_word: נָס
  choice: бежал
  rationale: Форма обозначает уже происшедшее бегство Арама, которое увидели сыновья Аммона.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохраняет еврейское название страны/народа и избегает анахроничного «Сирия»; коллективное значение пояснено в сноске.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: они побежали от Авессы
  rationale: Естественно передаёт военное бегство «от лица/присутствия» Авессы без неестественной русской кальки.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: вошли в город
  rationale: Точно и идиоматично передаёт движение внутрь определённого, известного из контекста города.
- source_word: וַיָּשָׁב יוֹאָב
  choice: Тогда Иоав
  rationale: Значение последующего отхода выражено всей фразой «прекратил сражение»; «тогда» естественно связывает события повествования.
- source_word: מֵעַל בְּנֵי עַמּוֹן
  choice: прекратил сражение с сыновьями Аммона
  rationale: Передаёт военный смысл отхода от действий против аммонитян, избегая двусмысленного русского «отступил от», которое могло бы подразумевать поражение.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: и пришёл в Иерусалим
  rationale: Передаёт обычное значение בוא без добавления отсутствующего в этой части фразы повторного «вернулся».
