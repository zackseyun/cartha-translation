base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: ru
  text: Хададэзер послал за арамеями, которые были за Рекой[a], и вывел их. Они пришли в Хелам, а перед ними[c] был Шовах[b], начальник войска Хададэзера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть с другой стороны Евфрата.
    reason: cultural_note
  - marker: b
    text: Имя также передают как «Шовак».
    reason: lexical_alternative
  - marker: c
    text: Выражение «перед ними», вероятно, означает, что он шёл во главе войска.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал за
  rationale: В сочетании со следующим каузативным глаголом естественно передаёт отправку за арамейскими силами, которых Хададезер затем вывел; подразумеваемый адресат посланных не уточняется.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: вывел арамеев
  rationale: Каузативная форма יצא означает «вывести» или «привести откуда-либо»; выбранный вариант сохраняет каузативность без добавления военной интерпретации «собрал».
- source_word: אֲרָם
  choice: арамеи
  rationale: В контексте речь идёт об арамейском народе или войске, а не только о земле Арам; «арамеи» точнее и не создаёт современных ассоциаций слова «сирийцы».
- source_word: מֵעֵבֶר הַנָּהָר
  choice: за Рекой
  rationale: Сохранено буквальное обозначение «за Рекой»; предполагаемое указание на Евфрат вынесено в примечание.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: они пришли в Хелам
  rationale: חֵילָם понято как географическое название согласно масоретской традиции и непосредственному контексту.
- source_word: וְשׁוֹבַךְ
  choice: Шовах
  rationale: Передача отражает еврейские согласные и обычное произношение конечной כ без дагеша как «х»; альтернативная транслитерация отмечена в сноске.
- source_word: שַׂר צְבָא
  choice: начальник войска
  rationale: Ясное современное обозначение высшего военного руководителя, близкое к еврейскому сочетанию «начальник войска».
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Сохранено буквальное и несколько неоднозначное пространственное выражение; вероятный смысл военного предводительства пояснён в примечании.
