base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: ru
  text: Когда Иоав увидел, что боевые порядки противника стояли перед ним и позади него, он отобрал из всех отборных воинов Израиля и выстроил их против Арама.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Арам» здесь означает арамейское войско.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохраняет обычное повествовательное значение ראה и естественно подразумевает осознание тактической обстановки.
- source_word: פְּנֵי הַמִּלְחָמָה הָיְתָה אֵלָיו
  choice: против него выстроились для боя
  rationale: Естественно передаёт военный смысл буквального оборота «лицо битвы было обращено к нему», не создавая неясного русского образа.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: и спереди, и сзади
  rationale: Точно и естественно выражает угрозу с двух сторон.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: отобрал людей из числа лучших воинов Израиля
  rationale: מִכֹּל указывает на выбор из всей группы, а בְּחוּרֵי обозначает отборных, пригодных к бою людей; формулировка избегает ошибочного смысла, будто были выбраны все.
- source_word: וַיַּעֲרֹךְ
  choice: выстроил их
  rationale: В военном контексте ערך означает расположить войско в боевом порядке; местоимение «их» делает русский синтаксис ясным.
- source_word: לִקְרַאת אֲרָם
  choice: против Арама
  rationale: Передаёт значение выступления навстречу для сражения и сохраняет собственное имя אֲרָם.
