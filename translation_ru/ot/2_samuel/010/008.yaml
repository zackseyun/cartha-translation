  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: ru
  text: И вышли сыны Аммона[a] и выстроились для битвы у входа в ворота, а арамеи из Цовы и Рехова, люди из Това[b] и Маахи стояли отдельно в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аммонитяне». Буквально: «сыны Аммона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иш-Тов». Еврейское אִישׁ טוֹב можно понять как «люди из Това» либо как географическое название «Иш-Тов».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: В повествовательном военном контексте יצא означает выход войска из города к месту сражения.
- source_word: בְּנֵי עַמּוֹן
  choice: сыны Аммона
  rationale: Формально сохраняет еврейское обозначение народа; более привычное «аммонитяне» вынесено в примечание.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: выстроились к битве
  rationale: Военная идиома обозначает построение сил в боевой порядок; формулировка ясна и естественна по-русски.
- source_word: פֶּתַח הַשָּׁעַר
  choice: у входа в ворота
  rationale: Передаёт конкретное место расположения аммонитского войска возле городских ворот.
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: а арамеи из Цовы и Рехова
  rationale: אֲרַם здесь обозначает арамейские силы; Цова и Рехов понимаются как связанные с ними географические названия.
- source_word: וְאִישׁ טוֹב
  choice: люди из Това
  rationale: Передаёт вероятный смысл отряда из области Тов, сохраняя неоднозначность сочетания в примечании.
- source_word: וּמַעֲכָה
  choice: и Маахи
  rationale: Название Мааха включено в ряд областей, откуда прибыли союзные силы; подразумеваемое «люди из» естественно восстанавливается из контекста.
- source_word: לְבַדָּם
  choice: стояли отдельно
  rationale: Выражает пространственное отделение союзных войск от аммонитян; глагол «стояли» контекстуально восполняет эллипсис.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямо передаёт שָׂדֶה и сохраняет контраст с расположением у городских ворот без добавления определения «открытом».
