  footnotes:
  - marker: a
    text: 'Или: «и всё войско, то есть доблестных воинов». Еврейское выражение допускает понимание «доблестных воинов» либо как пояснения к слову «войско», либо как обозначения состава войска.'
    reason: Сохранена синтаксическая неоднозначность сочетания כָּל הַצָּבָא הַגִּבֹּרִים.
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Когда Давид услышал об этом
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; придаточное с «когда» естественно передаёт связь с последующим действием. Дополнение в еврейском тексте не выражено, но русское «об этом» ясно отсылает к событиям предыдущего стиха, не уточняя их сверх контекста.
- source_word: וַיִּשְׁלַח
  choice: он послал
  rationale: Обычное значение глагола שׁלח в породе qal; нейтральное «послал» точно и естественно в данном военном контексте.
- source_word: אֶת יוֹאָב
  choice: Иоава
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; имя передано в принятой русской библейской форме.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: и всё войско
  rationale: צָבָא здесь обозначает военные силы, а כָּל — их полноту. «Всё войско» — ясное современное соответствие.
- source_word: הַגִּבֹּרִים
  choice: доблестных воинов
  rationale: גִּבּוֹרִים обозначает сильных, доблестных воинов. Такое выражение сохраняет смысл слова без архаичного «богатыри» и без чрезмерно конкретного «отборный отряд».
