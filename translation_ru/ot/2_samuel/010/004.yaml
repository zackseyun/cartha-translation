base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: ru
  text: Ханун взял слуг Давида, сбрил каждому половину бороды, обрезал их одежды до половины, до ягодиц[a], и отослал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «до седалища» или «до интимных мест». Соответствующее еврейское слово встречается редко, и точное обозначение части тела остаётся спорным. По смыслу Ханун очень коротко обрезал их одежды, позорно обнажив их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: схватил
  rationale: Хотя לקח обычно означает «взял», в данном контексте насильственного унижения посланников естественное русское «схватил» передаёт действие, не добавляя продолжительного пленения.
- source_word: עַבְדֵי דָוִד
  choice: слуг Давида
  rationale: עבד может обозначать раба, слугу или царского служащего; здесь речь идёт о посланниках на службе у Давида, поэтому нейтральное «слуги» сохраняет широту значения.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: сбрил каждому половину бороды
  rationale: Уточнение «каждому» естественно выражает распределительное значение местоимения множественного числа и ясно показывает, что половина бороды была сбрита у каждого посланника.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: обрезал их одежды до половины
  rationale: כרת передаёт отсечение части одежды, а בַּחֵצִי указывает на уровень или середину; формулировка сохраняет конкретный образ без уточнения вида одежды.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: до самых ягодиц
  rationale: Редкое שְׁתוֹת, вероятно, обозначает ягодицы, седалище или прилегающую интимную область. В основном тексте выбран наиболее прямой анатомический эквивалент, а неопределённость отмечена в сноске.
- source_word: וַיְשַׁלְּחֵם
  choice: отпустил их
  rationale: В контексте людей, которых сначала схватили и унизили, русское «отпустил» звучит естественнее буквального «послал их» и передаёт их удаление от Хануна.
