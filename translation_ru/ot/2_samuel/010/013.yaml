  text: וַ/יִּגַּ֣שׁ יוֹאָ֗ב וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ לַ/מִּלְחָמָ֖ה בַּֽ/אֲרָ֑ם וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: ru
  text: Иоав с людьми, которые были с ним, выступил на битву против Арама[a], и арамеи обратились в бегство от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «против Арама»; в данном контексте — против арамейского войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: выступил
  rationale: Глагол означает «приблизился, подошёл», но в сочетании с «на битву» описывает выдвижение для вступления в бой; «выступил» естественно передаёт военный контекст.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: с людьми, которые были с ним
  rationale: Сохраняет обычное значение עָם «народ, люди», хотя в данном контексте речь идёт о воинах Иоава.
- source_word: לַמִּלְחָמָה
  choice: на битву
  rationale: Передаёт направленность и цель движения — вступление в сражение.
- source_word: בַּאֲרָם
  choice: против Арама
  rationale: Сохраняет еврейское название страны/народа; предлог ב в контексте битвы имеет значение противостояния.
- source_word: וַיָּנֻסוּ
  choice: побежали
  rationale: נוּס означает спасаться бегством; «побежали» передаёт бегство, не подразумевая организованного отступления.
- source_word: מִפָּנָיו
  choice: от него
  rationale: Еврейское выражение буквально означает «от его лица» и идиоматически указывает на бегство от Иоава.
- source_word: יוֹאָב
  choice: Иоав
  rationale: Принятая русская библейская форма имени.
