  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: ru
  text: Когда все цари, служившие Ададезеру, увидели, что потерпели поражение от Израиля, они заключили мир с Израилем и стали служить ему. И арамеи больше не решались приходить на помощь аммонитянам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: служившие Ададезеру
  rationale: Естественно передаёт зависимое положение царей, буквально названных «слугами Ададезера», без неуместного оттенка домашнего рабства.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: потерпели поражение от Израиля
  rationale: Идиома означает военное поражение перед лицом Израиля; современная русская формулировка ясно передаёт смысл.
- source_word: וַיַּשְׁלִמוּ אֶת יִשְׂרָאֵל
  choice: заключили мир с Израилем
  rationale: В данном военном контексте форма от שׁלם обозначает установление мира, вероятно с признанием зависимости.
- source_word: וַיַּעַבְדוּם
  choice: стали служить ему
  rationale: Местоименный суффикс относится к Израилю как собирательному единственному; русский перевод сохраняет это согласование.
- source_word: וַיִּרְאוּ אֲרָם לְהוֹשִׁיעַ עוֹד
  choice: арамеи больше не решались приходить на помощь
  rationale: Буквально «Арам побоялся ещё спасать»; выражение «не решались» естественно передаёт страх как причину отказа от дальнейшей военной помощи, а «приходить на помощь» соответствует контексту лучше, чем чрезмерно сильное «спасать».
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитянам
  rationale: Обычное современное русское обозначение народа, буквально названного «сынами Аммона».
