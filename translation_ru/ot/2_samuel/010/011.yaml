base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: ru
  text: 'Он сказал: «Если Арам будет одолевать меня[a], ты выручишь меня; а если аммонитяне будут одолевать тебя, я пойду выручить тебя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если Арам окажется сильнее меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально первая часть взаимного обещания звучит: «ты будешь мне для избавления», а вторая — «я пойду, чтобы избавить тебя».'
    reason: source_form
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: будет / будут одолевать
  rationale: В военном контексте חזק обозначает превосходство в силе или взятие верхa. «Одолевать» естественно передаёт разворачивающуюся боевую ситуацию, не утверждая окончательного поражения.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено данное в еврейском тексте название народа или государства; оно не заменено более поздним географическим названием «Сирия».
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: меня / тебя при глаголе «одолевать»
  rationale: Предлог מן при חזק выражает превосходство над кем-либо; в русском это значение естественно передаётся прямым дополнением при глаголе «одолевать».
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Общепринятое и естественное русское обозначение этнической группы, буквально названной «сынами Аммона».
- source_word: וְהָיְתָה לִּי לִישׁוּעָה / וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: ты выручишь меня / я пойду выручить тебя
  rationale: Однокоренные ישועה и הושיע в данной тактической обстановке говорят о спасительной военной поддержке. Повтор «выручишь / выручить» сохраняет смысловую связь и звучит естественно по-русски.
theological_decisions:
- issue: Смысл ישועה и הושיע в военном контексте
  choice: 'Передать как практическую помощь и избавление от опасности: «выручить»'
  alternative: «быть спасением / спасти» или нейтральное «помочь»
  rationale: «Выручить» сохраняет оттенок избавления, присущий корню ישׁע, но не привносит в тактическую договорённость более узкий богословский смысл слова «спасение».
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формой. Название «Арам» сохранено вслед за еврейским текстом; «аммонитяне» употреблено как привычный русский этноним. Взаимность боевой поддержки подчёркнута параллельным повтором «выручишь / выручить».
