base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: ru
  text: Крепись, и будем крепки[a] ради нашего народа и городов нашего Бога. Пусть Яхве сделает то, что хорошо в Его глазах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и проявим силу»; возможен также перевод: «и укрепимся». Еврейский глагол имеет возвратное значение и может указывать на проявление силы или на укрепление себя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И Яхве сделает то, что хорошо в Его глазах». Еврейскую глагольную форму можно понимать как простое будущее; в основном тексте она передана как пожелание, выражающее покорность воле Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Будь твёрд
  rationale: Прямое повеление в мужском роде и единственном числе; передаёт призыв проявить стойкость в бою и сохраняет связь с последующим однокоренным глаголом.
- source_word: וְנִתְחַזַּק
  choice: и будем тверды
  rationale: Когортатив породы хитпаэль выражает совместное побуждение проявить или обрести твёрдость. Краткая формулировка естественна по-русски и сохраняет повтор корня חזק.
- source_word: בְּעַד
  choice: за
  rationale: В военном контексте предлог указывает на действие в защиту или ради кого-либо; русское «за» кратко и естественно передаёт этот смысл.
- source_word: עַמֵּנוּ
  choice: наш народ
  rationale: עם обозначает народ, а не только войско; это значение поддерживается параллельным упоминанием городов Бога.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: города нашего Бога
  rationale: Точно передаёт конструкцию принадлежности и связь городов народа с его Богом.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя Бога, не заменяя его титулом.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: Пусть Яхве сделает то, что благо в Его глазах
  rationale: Сохраняет образ еврейской идиомы и передаёт yiqtol как пожелание, выражающее доверие Божьей воле, не скрывая возможности изъявительного понимания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не смешивает его с титулом.
- issue: Модальность יַעֲשֶׂה после призыва
  choice: Пусть Яхве сделает
  alternative: И Яхве сделает
  rationale: Контекст позволяет понять форму как пожелание и вверение исхода Богу, однако грамматически возможно и простое будущее; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным призывом. Однокоренной параллелизм חזק сохранён сочетанием «Будь твёрд — будем тверды». Идиома «благо в Его глазах» оставлена узнаваемо семитской, но понятной современному читателю.
