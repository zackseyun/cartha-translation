base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: ru
  text: Когда Давиду донесли об этом, он собрал весь Израиль, перешёл Иордан и пришёл в Хелам. Арамеи выстроились навстречу Давиду и вступили с ним в бой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Когда Давиду донесли об этом
  rationale: 'Безличная конструкция сохраняет пассивный смысл: сообщивший не назван. «Когда» естественно передаёт повествовательную связь, а «об этом» восполняет подразумеваемое содержание сообщения по контексту.'
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: он собрал весь Израиль
  rationale: Сохраняется широкий собирательный смысл еврейского текста без уточнения «войско», которого в оригинале нет.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: перешёл Иордан
  rationale: Обычное современное русское выражение для пересечения реки; название употреблено без добавочного слова «река», как и в источнике.
- source_word: וַיָּבֹא חֵלָמָה
  choice: и пришёл в Хелам
  rationale: Направительный суффикс указывает на движение к месту; по-русски прибытие естественно передаётся как «пришёл в Хелам».
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Арамеи выстроились
  rationale: Глагол в военном контексте означает построение к сражению. Этноним во множественном числе естественнее русского собирательного названия страны и согласуется с глаголом во множественном числе.
- source_word: לִקְרַאת דָּוִד
  choice: навстречу Давиду
  rationale: Передаёт буквальную идею движения или расположения для встречи, тогда как враждебный характер встречи становится ясен из военного контекста.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: и вступили с ним в бой
  rationale: Еврейская конструкция буквально говорит о сражении «с ним». Русское выражение недвусмысленно обозначает враждебное столкновение и не создаёт впечатления совместной борьбы на одной стороне.
