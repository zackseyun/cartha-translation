  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: ru
  text: 'Это последние слова Давида:


    «Изречение[a] Давида, сына Иессея,

    изречение мужа, вознесённого ввысь,

    помазанника Бога Иакова[b]

    и сладкозвучного певца Израиля[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провозглашение», «речение». Еврейское слово служит формулой торжественной, нередко пророческой речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мессия Бога Иакова». Буквально: «помазанник Бога Иакова». Здесь так назван Давид; выражение вместе с тем сохраняет царское и мессианское звучание.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «приятный певец песнопений Израиля»; буквально выражение можно понимать как «услада песнопений Израиля». Слово «певец» в еврейском тексте отдельно не выражено, но подразумевается в данном поэтическом титуле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה דִּבְרֵי דָוִד הָאַחֲרֹנִים
  choice: Вот последние слова Давида
  rationale: «Вот» естественно вводит новый раздел и передаёт указательную силу אֵלֶּה; «последние слова» прямо отражает דִּבְרֵי... הָאַחֲרֹנִים.
- source_word: נְאֻם
  choice: изречение
  rationale: Торжественный речевой маркер, часто употребляемый в пророческих провозглашениях. «Изречение» сохраняет возвышенный и формальный характер, не добавляя идеи предсказания.
- source_word: הַגֶּבֶר הֻקַם עָל
  choice: муж, вознесённый ввысь
  rationale: «Муж» соответствует возвышенному регистру הַגֶּבֶר, а пассивное «вознесённый» сохраняет образ возвышения, не называя прямо подразумеваемого деятеля.
- source_word: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב
  choice: помазанник Бога Иакова
  rationale: В ближайшем контексте речь непосредственно о Давиде как царе, помазанном Богом; нарицательное «помазанник» сохраняет также более широкое мессианское звучание.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: сладкозвучный певец Израиля
  rationale: Поэтическое русское выражение передаёт приятность/усладу, связанную с песнями, и традиционно понятную роль Давида, хотя слово «певец» в еврейском подразумевается, а не выражено прямо.
theological_decisions:
- issue: Следует ли передавать מְשִׁיחַ как титул «Мессия»
  choice: помазанник
  alternative: Мессия; помазанный
  rationale: Непосредственный референт — Давид. Перевод «помазанник» передаёт исторический царский смысл и не устраняет мессианский резонанс, но не превращает его без достаточного основания в прямое именование Мессии.
- issue: Кем совершено возвышение Давида в הֻקַם
  choice: сохранён пассив «вознесённый» без названного деятеля
  alternative: «которого Бог вознёс»
  rationale: Божественное действие вероятно по контексту, но в данной фразе субъект прямо не назван; перевод сохраняет эту сдержанность исходного текста.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. «Муж» и «изречение» поддерживают возвышенный регистр, оставаясь понятными. Параллельное двукратное נְאֻם сохранено. Поэтическая разбивка отражает цепь приложений в еврейском тексте.
