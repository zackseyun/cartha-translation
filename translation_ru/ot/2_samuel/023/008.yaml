base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: ru
  text: 'Вот имена доблестных воинов Давида: Йошев-Башшевет[a], тахкемонянин, глава Троих[b]. Он — Адино Эцни[c], сразивший восемьсот за один раз.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст этого стиха труден. «Йошев-Башшевет» следует масоретскому тексту; в параллельном месте, 1 Пар 11:11, стоит «Яшовеам, сын Хахмони».
    reason: textual_variant
  - marker: b
    text: 'В некоторых древних свидетельствах и толкованиях: «глава тридцати»; масоретский текст читается как «глава Троих».'
    reason: alternative_reading
  - marker: c
    text: 'Еврейское выражение «Адино Эцни» крайне неясно. Многие понимают его не как имя, а приблизительно так: «он поднял своё копьё» или «он размахивал своим копьём».'
    reason: lexical_alternative
