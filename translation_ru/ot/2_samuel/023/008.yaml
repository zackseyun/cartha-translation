  choice: воины Давида
  rationale: Конструкция с לְ выражает принадлежность к окружению или отряду Давида; русская именная конструкция передаёт эту связь без оттенка собственности.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Йошев-Башшевет
  rationale: Трудная масоретская форма сохранена как имя собственное, без молчаливого исправления по параллели в 1 Пар 11:11.
- source_word: תַּחְכְּמֹנִי
  choice: тахкемонянин
  rationale: Передано как обозначение происхождения или рода в соответствии с формой текста Самуила.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: глава Троих
  rationale: Следует огласовке масоретского текста и передаёт руководящее положение среди элитной тройки; вариант «глава тридцати» отмечен в сноске.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Адино Эцни
  rationale: Крайне неясное выражение сохранено как имя или наименование по масоретской огласовке; возможное понимание как фразы об оружии вынесено в сноску.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: выступивший против восьмисот и поразивший их
  rationale: עַל передаёт направленное противостояние, а חָלָל — павших или поражённых. Развёрнутая русская формулировка делает синтаксическую связь понятной, не добавляя способа поражения, которого масоретский текст прямо не называет.
- source_word: בְּפַעַם אֶחָד
  choice: за один раз
  rationale: Естественно передаёт единичность случая или столкновения.
