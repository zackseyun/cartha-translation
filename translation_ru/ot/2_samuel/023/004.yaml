lexical_decisions:
- source_word: וּכְאוֹר
  choice: Он — как … свет
  rationale: Союз וּ и сравнительная частица כְּ продолжают характеристику правителя из предыдущего стиха. Местоимение «Он» восполняет подразумеваемое подлежащее, а тире передаёт безглагольность еврейской строки.
- source_word: בֹּקֶר
  choice: утренний / утро
  rationale: Обычное значение — «утро»; два употребления переданы однокоренными словами, чтобы сохранить повтор и поэтический параллелизм.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: при восходе солнца
  rationale: Глагол זרח обозначает появление или сияние солнца; предложная конструкция естественно передаёт обстоятельственный смысл без излишнего уточнения.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: безоблачное утро
  rationale: Кратко и естественно передаёт буквально сжатое «утро — нет облаков».
- source_word: מִנֹּגַהּ
  choice: от сияния
  rationale: Сохраняет значение נֹגַהּ («сияние, яркий свет») и предлог מִן, не устраняя синтаксическую неоднозначность заключительной строки.
- source_word: מִמָּטָר
  choice: от дождя
  rationale: Формально сохраняет повтор предлога מִן и намеренно не сводит его значение только ко временному «после дождя».
- source_word: דֶּשֶׁא
  choice: свежая зелень
  rationale: Слово обозначает молодую траву или свежую растительность; «свежая зелень» передаёт образ нового роста и звучит естественно по-русски.
- source_word: מֵאָרֶץ
  choice: из земли
  rationale: Передаёт происхождение и появление растительности из почвы, сохраняя поэтическую образность.
theological_decisions:
- issue: Подразумеваемое подлежащее сравнения
  choice: Добавлено «Он», относящее сравнение к правителю из стиха 3.
  alternative: 'Оставить фрагмент без подлежащего: «И как утренний свет…»'
  rationale: Еврейская строка эллиптична, но контекст ясно указывает на справедливого правителя. Восполнение подлежащего делает русский текст понятным, не добавляя нового богословского утверждения.
- issue: Связь элементов заключительной строки
  choice: Сохранена сжатая последовательность «от сияния, от дождя — свежая зелень из земли».
  alternative: 'Развернуть причинно-временную связь: «от сияния после дождя из земли поднимается свежая зелень».'
  rationale: Синтаксис еврейского текста допускает разные способы связать сияние, дождь и появление зелени. Сжатая передача сохраняет поэтическое напряжение и не выдаёт одно толкование за несомненное.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Эллипсис заключительной строки сохранён намеренно; тире помогает русскому читателю воспринять образ без внесения отсутствующего в оригинале глагола.
