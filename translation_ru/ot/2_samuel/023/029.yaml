lexical_decisions:
- source_word: חֵלֶב
  choice: Хелев
  rationale: Личное имя передано транслитерацией; форма «Хелев» естественно отражает конечную букву ב без дагеша в русской библейской традиции.
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение родства в перечне имён; русская конструкция с приложением сохраняет краткость оригинала.
- source_word: בַּעֲנָה
  choice: Бааны
  rationale: Имя передано традиционной русской формой «Баана» в родительном падеже.
- source_word: הַנְּטֹפָתִי
  choice: нетофатянин
  rationale: Этникон с артиклем указывает на происхождение или родовую связь с Нетофой; краткая форма уместна в воинском списке.
- source_word: אִתַּי
  choice: Иттай
  rationale: Транслитерация сохраняет удвоенный согласный и соответствует еврейской форме имени.
- source_word: רִיבַי
  choice: Ривая
  rationale: Имя «Ривай» поставлено в родительный падеж после слова «сын».
- source_word: מִגִּבְעַת
  choice: из Гивы
  rationale: Предлог מִן обозначает происхождение; «из Гивы» прямо и естественно передаёт его значение.
- source_word: בְּנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Сохранено буквальное выражение, связывающее Гиву с потомками или племенем Вениамина; более плавный русский вариант приведён в сноске.
