base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: ru
  text: 'Бог Израиля сказал, Скала Израиля сказала мне: «Тот, кто праведно властвует над людьми, кто властвует в страхе Божьем[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эту строку также можно понимать в мессианском ключе: как описание идеального царя, которое некоторые связывают с Мессией.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: сказал
  rationale: Перфект вводит торжественное изречение; простое прошедшее время естественно передаёт его в русском повествовательном контексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Конструктивное сочетание, называющее Бога, Которому принадлежит Израиль.
- source_word: לִי דִבֶּר
  choice: мне говорил
  rationale: לִי естественнее всего понимать как адресата речи — Давида; вариант «обо мне» здесь менее вероятен.
- source_word: צוּר יִשְׂרָאֵל
  choice: Скала Израиля
  rationale: Сохранён божественный титул-метафора, выражающий твёрдость, надёжность и защиту.
- source_word: מוֹשֵׁל בָּאָדָם
  choice: кто властвует над людьми
  rationale: Причастие передано обобщённой конструкцией, а собирательное אָדָם — естественным современным русским «людьми».
- source_word: צַדִּיק
  choice: праведно
  rationale: Формально прилагательное в сжатой поэтической строке характеризует способ правления; наречие сохраняет и нравственную, и судебно-справедливую окраску.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: кто властвует в страхе Божьем
  rationale: Повтор причастия сохранён ради параллелизма; «в страхе Божьем» передаёт благоговейную подотчётность Богу без добавочного истолкования.
theological_decisions:
- issue: Общее наставление о царской власти или мессианское высказывание
  choice: Основной текст передаёт описание праведного правителя без прямого отождествления с Мессией.
  alternative: Строку можно понимать как идеал царя, в конечном счёте исполняющийся в Мессии.
  rationale: Еврейский текст прямо не называет Мессию, но контекст последних слов Давида допускает мессианское прочтение; эта напряжённость сохранена в примечании.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и библейского титула «Скала Израиля». Незавершённый синтаксис и конечная запятая сохранены, поскольку стих продолжается в следующей строке.
