base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: ru
  text: Он встал и поражал филистимлян, пока рука у него не устала и не прилипла к мечу. В тот день Яхве даровал великую победу[a], а народ вернулся вслед за ним лишь затем, чтобы собрать добычу с павших[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое избавление» либо «великое спасение». Еврейское слово может обозначать спасение в широком смысле; здесь речь идёт о решительном избавлении в сражении, которое даровал Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лишь чтобы снимать». Имеется в виду снять с павших оружие, доспехи, одежду и другие военные трофеи.'
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: встал
  rationale: Глагол קום обозначает решительное вступление в действие; «встал» кратко и естественно передаёт повествовательную динамику, не добавляя мотивов.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: поражал филистимлян
  rationale: נכה в военном контексте означает наносить удары и поражать противника. Несовершенный вид «поражал» естественно передаёт продолжавшееся действие до изнеможения руки.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: пока рука его не устала
  rationale: יגע выражает утомление или изнеможение; конструкция с «пока… не» естественно передаёт предел продолжавшегося действия.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: рука его не прилипла к мечу
  rationale: דבק значит «прилипать, крепко держаться, прилепляться». Буквально-наглядное «прилипла» сохраняет возможность понимать образ как судорогу руки или как выразительное описание неослабевающей хватки.
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Яхве даровал великую победу
  rationale: Сочетание עשה с תְּשׁוּעָה указывает, что решительное избавление совершил Бог. В русском военном повествовании «даровал победу» ясно сохраняет божественную инициативу без буквального и неестественного «сделал спасение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: великая победа
  rationale: תְּשׁוּעָה может обозначать спасение, избавление или победу. Здесь непосредственный военный контекст поддерживает «победу», а сноска сохраняет более широкий смысловой диапазон.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: народ вернулся вслед за ним
  rationale: Формулировка близко передаёт движение народа за героем после его решающего боя, не вводя отсутствующего в тексте уточнения «войско».
- source_word: אַךְ לְפַשֵּׁט
  choice: лишь затем, чтобы снять с павших добычу
  rationale: אַךְ ограничивает цель возвращения, а פשט в послебоевом контексте означает снимать с убитых вооружение, одежду и ценности. Формулировка передаёт действие ясно и без излишней грубости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его функцию и не заменяет именем-титулом.
- issue: Значение תְּשׁוּעָה в военном контексте
  choice: победа
  alternative: избавление; спасение
  rationale: Контекст описывает исход сражения, поэтому «победа» наиболее непосредственно выражает референт. При этом сноска сохраняет присущий слову более широкий смысл избавления и спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет последовательность еврейского рассказа; яркий образ руки, прилипшей к мечу, оставлен без медицинского или героизирующего пояснения. Все смысловые альтернативы, существенные для богословского и лексического диапазона, вынесены в сноски.
