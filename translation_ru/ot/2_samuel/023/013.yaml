base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: ru
  text: И тридцать из тридцати главных воинов[a] спустились и во время жатвы[b] пришли к Давиду, в пещеру Адуллама; отряд филистимлян[c] стоял станом в долине Рефаим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст сжат и труден: буквально — «тридцать из тридцати, глава»; последнее слово стоит в единственном числе. Выражение может означать «тридцать главных воинов» или точнее относиться к членам особой группы Давидовых воинов, называемой «Тридцать».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «к жатве». Вероятнее всего, выражение обозначает время жатвы.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское חַיַּת פְּלִשְׁתִּים буквально содержит слово со значением «живое существо; животное», но здесь оно употреблено в военном смысле: «отряд» или «подразделение филистимлян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Сохраняет обычное направительное значение корня ירד и естественно звучит в повествовании.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: тридцать из тридцати предводителей
  rationale: Формулировка намеренно сохраняет сжатость и трудность еврейского текста, не сводя её безоговорочно ни к тридцати главным воинам вообще, ни к членам особой группы «Тридцать».
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Повторяющийся предлог אֶל указывает на движение к Давиду и пещере; «пришли» естественно передаёт это в русском повествовании.
- source_word: אֶל קָצִיר
  choice: во время жатвы
  rationale: Предложное сочетание, буквально связанное с жатвой, вероятнее всего имеет временное значение.
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: к Давиду, в пещеру Адуллам
  rationale: Сохраняет обе цели движения и не добавляет отсутствующего в оригинале глагола «встретить».
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: отряд филистимлян
  rationale: Хотя חַיָּה обычно означает живое существо или животное, здесь выражение употреблено в военном смысле — об отряде или подразделении.
- source_word: חֹנָה
  choice: стоял станом
  rationale: Причастие от חנה обозначает продолжающееся расположение лагерем; выбран традиционно-повествовательный, но понятный современному читателю оборот.
- source_word: בְּעֵמֶק רְפָאִים
  choice: в долине Рефаим
  rationale: Название местности передано транслитерацией; родовой термин «долина» оставлен со строчной буквы по нормам русского письма.
