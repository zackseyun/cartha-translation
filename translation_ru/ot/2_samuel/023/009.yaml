  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: ru
  text: После него — Елеазар, сын Додо, сына Ахохи[a]. Он был одним из трёх могучих воинов, бывших с Давидом, когда они поносили[b] филистимлян, собравшихся там на битву, а израильтяне поднялись[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «сын Додая, сына ахохитянина».'
    reason: Неоднозначны огласовка имени דדי и понимание אֲחֹחִי как личного имени или родового обозначения.
  - marker: b
    text: 'Или: «бросали вызов».'
    reason: В военном контексте חרף может обозначать не только словесное поношение, но и дерзкий вызов противнику.
  - marker: c
    text: 'Буквально: «поднялись»; в данном контексте это может означать, что они ушли или отступили.'
    reason: Обычное значение עלה связано с движением вверх, однако контекст допускает идиоматическое обозначение ухода с поля боя.
lexical_decisions:
- source_word: ו/אחר/ו
  choice: После него —
  rationale: Оборот вводит следующего в перечне воина; тире естественно передаёт бессказуемное представление лица по-русски.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: сын Додо, сына Ахохи
  rationale: Сохраняет возможное прочтение согласного текста как цепочки личных имён; альтернативное понимание последнего элемента как родового обозначения вынесено в сноску.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: одним из трёх могучих воинов
  rationale: Предлог выражает принадлежность к группе, а גברים в военном контексте обозначает прославленных сильных воинов.
- source_word: עִם דָּוִד
  choice: бывших с Давидом
  rationale: Передаёт связь и совместное присутствие Давида и трёх воинов без добавления невыраженных подробностей.
- source_word: בְּ/חָֽרְפָם
  choice: когда они поносили
  rationale: Корень חרף обозначает хулу, поношение или вызывающее оскорбление; «поносили» сохраняет эту смысловую остроту, не сводя действие лишь к военному противостоянию.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское название народа; форма обусловлена управлением глагола.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: собравшихся там на битву
  rationale: Форма нифаля описывает собравшихся для битвы филистимлян; причастный оборот естественно связывает её с ближайшим существительным.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: а израильтяне ушли
  rationale: עלה буквально означает движение вверх, но здесь, в повествовании о битве, может обозначать уход с поля боя. Нейтральное «ушли» не уточняет, было ли это отступлением; буквальный образ и контекстуальная возможность отмечены в сноске.
