translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. «Могучие воины» понятно передаёт героико-военный оттенок без архаичного «богатыри». Синтаксис разделён на два предложения ради ясности, при этом последовательность и неоднозначности исходного текста сохранены в основном тексте и сносках.
