  text: מִן הַ/שְּׁלֹשִׁ֣ים נִכְבָּ֔ד וְ/אֶל הַ/שְּׁלֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂמֵ֥/הוּ דָוִ֖ד אֶל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: ru
  text: Он пользовался почётом среди тридцати[a], но не сравнялся с тремя[b]. Давид поставил его во главе своей стражи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «почитался больше тридцати». Еврейское выражение допускает как включительное, так и сравнительное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не достиг трёх», то есть не достиг положения трёх выдающихся воинов.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение может также означать «над теми, кто был у него в подчинении» или «над его отрядом».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: среди тридцати
  rationale: Предлог מִן допускает как включительное, так и сравнительное понимание. В перечне воинов естественно звучит принадлежность к группе, а возможное сравнительное значение отмечено в сноске.
- source_word: נִכְבָּד
  choice: пользовался почётом
  rationale: Нифаль от כבד выражает состояние почитаемого, уважаемого человека. Эта формулировка передаёт значение естественным современным русским языком, не навязывая сравнительной степени.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: но не сравнялся с тремя
  rationale: Буквальное «не дошёл до трёх» здесь обозначает недостижение их ранга или положения. «Не сравнялся» ясно передаёт образное значение, сохраняя различие между тридцатью и элитной тройкой.
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: Давид поставил его
  rationale: שׂים буквально означает «поставить, поместить», а в контексте назначения на ответственную должность русское «поставил» одновременно естественно и близко к форме оригинала.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: во главе своей стражи
  rationale: Редкое מִשְׁמַעַת может обозначать подчинение, поручение, командование либо состоящих при правителе людей. В военно-дворцовом контексте «стража» вероятна, но неоднозначность исходного выражения оговорена в сноске.
theological_decisions: []
