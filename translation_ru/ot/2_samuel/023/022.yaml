  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: ru
  text: Это совершил Ванея, сын Иодая,[a] и он прославился среди трёх могучих воинов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Такие подвиги совершил Ванея, сын Иодая».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и у него было имя среди трёх могучих воинов». Некоторые толкователи, сопоставляя этот стих с более широким перечнем воинов Давида, предполагают чтение «среди тридцати», однако еврейский текст здесь гласит «среди трёх».'
    reason: lexical_and_textual_note
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Это совершил
  rationale: Указательное местоимение подытоживает перечисленные ранее подвиги. Единственное число «это» естественно передаёт собирательную отсылку, а «совершил» уместно для выдающихся деяний.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Ванея, сын Иодая
  rationale: Использованы традиционные русские библейские формы имён; конструкция «сын Иодая» прямо передаёт еврейское сопряжённое сочетание.
- source_word: וְלוֹ שֵׁם
  choice: и он прославился
  rationale: 'Буквально: «и у него [было] имя»; это еврейская идиома, обозначающая известность и славу. В основном тексте она передана естественным современным русским выражением, а буквальная форма сохранена в примечании.'
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: среди трёх могучих воинов
  rationale: Масоретский текст прямо читает «трёх», а הַגִּבֹּרִים в данном военном перечне обозначает выдающихся, доблестных воинов.
theological_decisions:
- issue: Принадлежность Ванеи к «трём» или его известность среди них
  choice: среди трёх могучих воинов
  alternative: наряду с тремя могучими воинами / среди тридцати воинов
  rationale: Предлог ב допускает контекстуальный нюанс, однако основной текст сохраняет наиболее прямое чтение WLC, не согласуя его молча с параллельными перечнями.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного исторического текста. Слово «могучих» сохраняет повышенный оттенок גִּבֹּרִים, а «воинов» ясно обозначает его контекстуальное значение.
