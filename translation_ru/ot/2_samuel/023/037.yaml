lexical_decisions:
- source_word: צֶלֶק
  choice: Целек
  rationale: Личное имя передано транслитерацией с учётом древнееврейского צ и огласовки.
- source_word: הָעַמֹּנִי
  choice: аммонитянин
  rationale: Этникон обозначает происхождение Целека из Аммона; выбран обычный и понятный русский эквивалент.
- source_word: נַחְרַי
  choice: Нахарай
  rationale: Транслитерация личного имени сохраняет огласовку масоретского текста.
- source_word: הַבְּאֵרֹתִי
  choice: беэротянин
  rationale: Кратко передаёт географический этникон — человека из Беэрота — и сохраняет форму перечня.
- source_word: נשאי כְּלֵי
  choice: оруженосец
  rationale: В военном контексте сочетание «нести оружие/снаряжение» обозначает должность оруженосца. Число в представленном согласном тексте допускает иную трактовку, отмеченную в сноске.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Иоава, сына Саруии
  rationale: Сохранено полное родственное определение; родительный падеж естественно связан со словом «оруженосец».
