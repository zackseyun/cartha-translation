translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся ясным и энергичным; сохранены последовательность действий, повтор слова «египтянин» и неоднозначность описания внешности. Союз «а» служит естественному русскому сопоставлению вооружения двух участников, не вводя богословского толкования.
