  text: וְ/הוּא הִכָּה֩ אֶת אִ֨ישׁ מִצְרִ֜י אשר מַרְאֶ֗ה וּ/בְ/יַ֤ד הַ/מִּצְרִי֙ חֲנִ֔ית וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: ru
  text: Он также сразил египтянина, человека внушительного вида[a]. У египтянина в руке было копьё, а он спустился к нему с посохом[b], вырвал копьё из руки египтянина и убил его его же копьём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красивого человека» или «человека примечательной внешности». Еврейское выражение говорит о внешнем облике египтянина в широком смысле; с учётом параллельного места в 1 Паралипоменон 11:23 некоторые понимают его как указание на необычайно высокий рост.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с дубиной» или «с палкой». Еврейское שֵׁבֶט в зависимости от контекста может означать посох, палку, жезл или дубину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: сразил
  rationale: Глагол נכה обозначает удар или поражение противника. «Сразил» естественно передаёт воинский контекст, не устраняя последующее прямое указание на убийство.
- source_word: אִישׁ מִצְרִי
  choice: египтянина
  rationale: В современном русском этноним самостоятельно и полно передаёт сочетание «человек-египтянин».
- source_word: אשר מַרְאֶה
  choice: человека внушительного вида
  rationale: Фраза относится к внешнему облику египтянина, но сама по себе не уточняет, имеется ли в виду красота, рост или иная примечательная черта. «Внушительного вида» сохраняет эту широту.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: У египтянина в руке было копьё
  rationale: Естественная русская передача еврейской конструкции обладания с сохранением конкретного образа.
- source_word: וַיֵּרֶד אֵלָיו
  choice: он спустился к нему
  rationale: Сохранено основное пространственное значение ירד — «спускаться, сходить вниз», без добавления прямо не выраженного оттенка нападения.
- source_word: בַּשָּׁבֶט
  choice: с посохом
  rationale: שֵׁבֶט может обозначать посох, жезл, палку или дубину. «Посох» — достаточно широкая и наименее интерпретирующая передача в данном контексте.
- source_word: וַיִּגְזֹל
  choice: вырвал
  rationale: גזל подразумевает насильственное отнятие; «вырвал» живо и естественно передаёт действие в рукопашной схватке.
- source_word: וַיַּהַרְגֵהוּ
  choice: убил его
  rationale: Прямая современная передача обычного глагола הרג, означающего убийство.
- source_word: בַּחֲנִיתוֹ
  choice: его же копьём
  rationale: Местоименный суффикс естественнее всего относится к египтянину, у которого только что было отнято копьё. Частица «же» ясно выражает развязку, не добавляя нового содержания.
- source_word: וְהוּא
  choice: Он также
  rationale: Так естественно передаётся продолжение перечня подвигов и добавочное значение связки.
