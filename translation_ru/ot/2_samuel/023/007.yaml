source:
  edition: WLC
  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: ru
  text: А тот, кто прикоснётся к ним[a], должен вооружиться железом и древком копья[b]; их непременно сожгут огнём там, где они находятся[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «К ним» — к негодным людям из предыдущего стиха, уподобленным колючкам.
    reason: cross_reference
  - marker: b
    text: 'Или: «должен запастись железом и древком копья»; буквально: «должен быть наполнен железом и деревом копья».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на том самом месте». Значение редкого еврейского выражения не вполне ясно; буквально оно связано с пребыванием или местом нахождения.'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: וְאִישׁ
  choice: А тот
  rationale: Союз וְ в данном противопоставлении естественно передан как «а»; אִישׁ имеет обобщающее значение — всякий человек, который станет иметь дело с упомянутыми прежде колючками.
- source_word: יִגַּע בָּהֶם
  choice: кто прикоснётся к ним
  rationale: Глагол נגע прежде всего означает «касаться, прикасаться»; это значение сохраняет образ опасных колючек и не сужает его до попытки схватить их.
- source_word: יִמָּלֵא
  choice: должен вооружиться
  rationale: Нифаль глагола מלא буквально означает «быть наполненным», но в сочетании с железом и древком копья выражает необходимость снабдить или защитить себя соответствующими орудиями. «Вооружиться» естественно передаёт смысл, а буквальная форма отмечена в сноске.
- source_word: בַרְזֶל
  choice: железом
  rationale: Существительное означает «железо»; конкретный вид железного орудия в еврейском тексте не назван, поэтому перевод не уточняет его.
- source_word: וְעֵץ חֲנִית
  choice: и древком копья
  rationale: Буквально «деревом копья»; речь идёт о деревянном древке, а не о наконечнике.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: их непременно сожгут
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение. Русское «непременно» передаёт эмфатическую конструкцию, а неопределённо-личная форма сохраняет неназванного исполнителя действия.
- source_word: בַּשָּׁבֶת
  choice: там, где они находятся
  rationale: 'Редкая форма, вероятно, указывает на место пребывания: колючки сжигают прямо там, где они находятся. Более буквальный вариант и смысловая неопределённость отмечены в сноске.'
