  register: Современный литературный русский язык с сохранением поэтического образа колючек. Точка с запятой ясно разделяет необходимую защиту при прикосновении и окончательное сожжение. Формулировки dignified, но доступны обычному читателю; не вводятся дополнительные богословские толкования.
