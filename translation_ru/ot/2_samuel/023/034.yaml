  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: В перечне имён слово естественнее всего обозначает непосредственное сыновство; более широкое «потомок» здесь менее вероятно.
- source_word: אֲחַסְבַּי
  choice: Ахасбай
  rationale: Личное имя транслитерировано с еврейского.
- source_word: הַמַּעֲכָתִי
  choice: маахитянин
  rationale: Форма с артиклем является обозначением этнической или географической принадлежности; русское существительное сохраняет это значение без пояснительного перифраза.
- source_word: אֱלִיעָם
  choice: Елиам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: אֲחִיתֹפֶל
  choice: Ахитофел
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: הַגִּלֹנִי
  choice: гилонянин
  rationale: Этникон, образованный от названия Гило; существительное «гилонянин» близко воспроизводит еврейскую форму.
