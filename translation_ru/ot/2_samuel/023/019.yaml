  text: מִן הַ/שְּׁלֹשָׁה֙ הֲ/כִ֣י נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלֹשָׁ֖ה לֹא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: ru
  text: Разве не был он более почитаем, чем те трое?[a] Он стал их предводителем, но уровня троих не достиг.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Разве не был он почитаем среди троих?» Еврейскую конструкцию можно понять как указание на принадлежность к группе, однако сравнительное значение — «более почитаем, чем те трое» — лучше соответствует синтаксису и параллельному описанию в этом отрывке.'
    reason: lexical_alternative
  - marker: b
    text: То есть он не достиг положения или ранга «трёх» — высшей группы среди могучих воинов Давида.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: больше тех троих
  rationale: Предлог מִן после נִכְבָּד естественно выражает сравнение. Указательное «тех» показывает, что речь идёт об уже известной группе из трёх воинов.
- source_word: הֲכִי
  choice: разве не
  rationale: Сочетание вводит риторический вопрос, предполагающий утвердительный ответ; «разве не» естественно передаёт это в современном русском языке.
- source_word: נִכְבָּד
  choice: почитаем
  rationale: Форма от כבד означает, что человек пользовался почётом и высоким уважением; сравнительная степень выражена всей конструкцией с מִן.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: и он стал их предводителем
  rationale: שַׂר здесь обозначает руководителя воинской группы. «Предводитель» сохраняет военный контекст и звучит естественно и достойно.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: но с тремя не сравнялся
  rationale: Буквально «до трёх не дошёл»; в контексте речь идёт не о движении, а о недостижении их уровня или положения. Перевод сохраняет смысл сравнения без излишнего уточнения его природы.
