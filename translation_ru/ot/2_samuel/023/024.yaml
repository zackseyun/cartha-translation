  yaml_path: translation/ot/2_samuel/023/024.yaml
  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: ru
  text: Асаил, брат Иоава, — один из тридцати; Елханан, сын Додо[a], из Вифлеема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 1 Паралипоменон 11:26, стоит имя «Додай».
    reason: alternative_reading
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Асаил
  rationale: Раздельное написание в масоретском тексте передаёт известное личное имя עֲשָׂהאֵל; выбрана укоренившаяся русская библейская форма «Асаил».
- source_word: אֲחִי יוֹאָב
  choice: брат Иоава
  rationale: Естественно и точно передаёт конструкцию принадлежности и родственную связь.
- source_word: בַּשְּׁלֹשִׁים
  choice: один из тридцати
  rationale: Предлог ב с определённым числительным обозначает принадлежность к группе воинов; русская формулировка ясно выражает включённость в неё.
- source_word: אֶלְחָנָן
  choice: Елханан
  rationale: Транслитерация личного имени в соответствии с принятой русской библейской традицией.
- source_word: בֶּן דֹּדוֹ
  choice: сын Додо
  rationale: Основной текст WLC читает דֹּדוֹ как личное имя «Додо»; отличающееся чтение параллельного места отмечено в сноске без гармонизации.
- source_word: בֵּית לָחֶם
  choice: из Вифлеема
  rationale: В данном перечне название места указывает на происхождение Елханана; «из Вифлеема» прозрачно и естественно по-русски.
theological_decisions: []
translation_notes:
  register: Краткая именная запись сохранена в форме перечня. Язык современный и литературный, при этом традиционные русские формы библейских имён удержаны. Тире помогает обозначить подразумеваемую связку, отсутствующую в еврейском тексте.
