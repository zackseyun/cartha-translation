- source_word: אֶלְיַחְבָּא
  choice: Элияхба
  rationale: Личное имя передано транслитерацией с еврейского; форма отражает согласные и огласовку масоретского текста.
- source_word: הַשַּׁעַלְבֹנִי
  choice: из Шаалбона
  rationale: Этникон с артиклем обозначает уроженца или жителя Шаалбона/Шаалбима. Описательная русская форма естественна и сохраняет связь с названием места.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма представляет собой множественное число сопряжённого состояния от «сын». Несмотря на синтаксическую трудность перед следующим именем в единственном числе, множественное число сохранено без исправления текста.
- source_word: יָשֵׁן
  choice: Яшена
  rationale: Слово понято как личное имя в сочетании «сыновья Яшена» и передано транслитерацией без конъектуры.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени, понятная современному читателю.
