base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: ru
  text: 'Но он сказал: «Да не допущу я этого, Яхве! Разве это не кровь людей, которые отправились туда, рискуя жизнью?[a]»[b] И он не захотел пить эту воду. Вот что совершили трое могучих воинов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые шли со своими жизнями»; выражение означает, что они подвергали себя смертельной опасности.'
    reason: lexical_alternative
  - marker: b
    text: Давид говорит о воде как о крови этих людей, потому что они добыли её, рискуя погибнуть.
    reason: metaphor_explanation
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Яхве, немыслимо для меня
  rationale: Идиома חָלִילָה выражает решительное отвращение к поступку и категорический отказ. Такая передача естественна по-русски, сохраняет личную реакцию Давида и позволяет понять יְהוָה как обращение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: сделать такое
  rationale: Предлог מִן с инфинитивом после חָלִילָה указывает на действие, которое говорящий решительно отвергает.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Разве это не кровь людей
  rationale: Вопросительная частица הֲ передана риторическим вопросом. Слово «кровь» сохранено как сильная метафора цены смертельного риска.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: которые ходили, рискуя жизнью
  rationale: Буквально выражение означает «которые ходили со своими жизнями»; в данном контексте оно говорит о смертельной опасности. Глагол «ходили» сохранён, а смысл идиомы раскрыт естественным русским оборотом.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: И он не захотел пить эту воду
  rationale: אָבָה обозначает желание или согласие. Явное «эту воду» восстанавливает понятный из контекста референт местоименного суффикса и избегает неясного русского «её».
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: Вот что совершили трое могучих воинов
  rationale: Фраза подводит итог описанному подвигу. «Могучие воины» естественно передаёт גִּבֹּרִים в данном военном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл отождествления воды с кровью
  choice: Сохранён риторический вопрос «Разве это не кровь людей…?»
  alternative: «Разве я стану пить кровь этих людей?»; «Эта вода — словно кровь этих людей»
  rationale: Еврейский текст грамматически сжат и буквально называет воду кровью людей из-за смертельного риска, которому они подверглись. Перевод сохраняет метафору и риторическую напряжённость, не добавляя отсутствующего в вопросе глагола «пить».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. Синтаксис риторического вопроса и образ крови сохранены; буквальная семитская идиома о «жизнях» разъяснена в сноске.
