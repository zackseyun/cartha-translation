base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: ru
  text: После него — Шамма, сын Аге, хараритянин. Филистимляне собрались на битву[a]. Там был участок поля, полный чечевицы, и народ бежал от филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское לַחַיָּה трудно для истолкования. Возможно, имеется в виду «в отряд» или иное воинское соединение; некоторые понимают это слово как название места Лехи. В основном тексте по контексту принято значение «на битву».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: После него
  rationale: Сохраняет краткую последовательную связь в перечне воинов, не добавляя отсутствующего в еврейском тексте глагола.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: Шамма, сын Аге, хараритянин
  rationale: Имена переданы транслитерацией; הָרָרִי сохранено как родовое или местное обозначение, а не истолковано как «житель гор».
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: Филистимляне собрались
  rationale: Естественно передаёт военное сосредоточение, выраженное глаголом אסף.
- source_word: לַחַיָּה
  choice: на битву
  rationale: Форма трудна для истолкования. Контекст и параллель в 1 Пар 11:13 поддерживают функциональный военный смысл, однако иные возможные прочтения сохранены в примечании.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: участок поля
  rationale: Передаёт конкретный земельный надел и сохраняет конструкцию исходного текста без излишнего пояснения.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: полный чечевицы
  rationale: Следует прямому описанию участка как наполненного чечевицей, не вводя подразумеваемое «засеянный».
- source_word: וְהָעָם נָס מִפְּנֵי פְלִשְׁתִּים
  choice: и народ бежал от филистимлян
  rationale: Сохраняет общее слово «народ» и естественно по-русски передаёт идиому נָס מִפְּנֵי.
