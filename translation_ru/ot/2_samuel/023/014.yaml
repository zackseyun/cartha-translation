  yaml_path: translation/ot/2_samuel/023/014.yaml
  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: ru
  text: Давид был тогда в крепости, а филистимский гарнизон стоял тогда в Вифлееме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: тогда … тогда
  rationale: Наречие дважды обрамляет обе части стиха; повтор сохранён, поскольку по-русски он остаётся ясным и передаёт временной акцент еврейского текста.
- source_word: מְצוּדָה
  choice: крепость
  rationale: Передаёт укреплённое, пригодное для обороны место, не уточняя его устройство сверх исходного текста.
- source_word: מַצַּב
  choice: гарнизон
  rationale: В данном военном контексте обозначает размещённый в Вифлееме филистимский военный пост или отряд; «гарнизон» естественно передаёт это значение по-русски.
- source_word: פְּלִשְׁתִּים
  choice: филистимский
  rationale: Естественная русская атрибутивная передача сочетания «гарнизон филистимлян» без изменения смысла.
- source_word: בֵּית לָחֶם
  choice: Вифлеем
  rationale: Устоявшаяся русская форма географического названия.
- source_word: וְ
  choice: а
  rationale: Соединяет две одновременные фоновые ситуации и естественно выражает их сопоставление в русском повествовании; более буквальное «и» также возможно.
