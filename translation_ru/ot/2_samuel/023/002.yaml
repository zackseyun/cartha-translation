  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: ru
  text: Дух Яхве говорил через меня[a], и слово его было на моём языке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорил во мне». Еврейский предлог здесь может указывать как на пребывание внутри, так и на действие через посредника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: Дух Яхве
  rationale: В контексте пророческой речи רוּחַ обозначает Духа как действующего в откровении, а не ветер или дыхание. Личное имя יְהוָה передано как «Яхве».
- source_word: דִּבֶּר בִּי
  choice: говорил через меня
  rationale: 'Глагол דִּבֶּר означает «говорил», а предлог בְּ при местоимении здесь естественно передаёт посредничество: Давид служит проводником божественной речи. Русское «через меня» звучит современно и ясно.'
- source_word: וּמִלָּתוֹ
  choice: и слово его
  rationale: מִלָּה означает «слово, изречение». «Слово» сохраняет образ и смысловую весомость божественной речи, не расширяя его до более толковательного «послания».
- source_word: עַל לְשׁוֹנִי
  choice: было у меня на языке
  rationale: Передан буквальный образ слова «на языке», но добавленная естественная русская конструкция «у меня» устраняет возможное понимание «на моём языке» как указания на язык речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон, поэтому сохранено личное имя Бога в принятой русской форме «Яхве», а не заменено титулом.
- issue: Значение רוּחַ в контексте пророческой речи
  choice: Дух
  alternative: дыхание; ветер
  rationale: Говорение через Давида указывает на божественную действующую силу в пророческом откровении; «Дух» лучше всего соответствует контексту, не добавляя более поздних догматических формулировок.
- issue: Значение предлога בְּ в בִּי
  choice: через меня
  alternative: во мне; мною
  rationale: Параллель со словом Бога на языке Давида поддерживает инструментальное или посредническое значение, однако возможная локативная окраска сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Формула «у меня на языке» сохраняет древнееврейский образ и при этом не создаёт двусмысленности, будто речь идёт о языке общения. Местоимение «его» написано со строчной буквы согласно нейтральной современной издательской норме.
