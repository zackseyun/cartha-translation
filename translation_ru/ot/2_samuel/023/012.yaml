  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: ru
  text: Он же встал посреди поля, отстоял его и поразил филистимлян. И Яхве даровал великую победу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое избавление» или «великое спасение». Еврейское слово допускает все эти значения; здесь речь идёт о спасительном действии Яхве в битве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: встал
  rationale: Возвратная порода глагола передаёт сознательное занятие позиции; в военном контексте простое «встал» естественно выражает решимость удерживать место.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: посреди поля
  rationale: חֶלְקָה буквально обозначает участок земли; «поле» естественно в русском повествовании и соответствует контексту сражения.
- source_word: וַיַּצִּילֶהָ
  choice: отстоял его
  rationale: Глагол נצל означает избавлять или спасать, а местоименный суффикс женского рода относится к участку земли. «Отстоял» ясно передаёт спасение поля от захвата.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: поразил филистимлян
  rationale: В повествовании о битве נכה обозначает нанесение поражения или разящий удар; «поразил» сохраняет и образ действия, и военный результат.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Яхве даровал
  rationale: Сочетание עשה с обозначением избавления буквально говорит, что Яхве его совершил. Русское «даровал» естественно выражает прямую божественную инициативу, не приписывая победу воину.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: великую победу
  rationale: תְּשׁוּעָה может означать спасение, избавление или победу; непосредственный военный контекст делает «победу» наиболее ясным основным переводом, а более широкая семантика отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст употребляет собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Значение תְּשׁוּעָה в рассказе о битве
  choice: победа
  alternative: избавление; спасение
  rationale: Здесь слово обозначает спасительное действие Яхве, проявившееся в исходе сражения. Основной текст передаёт конкретный военный смысл, а сноска сохраняет более широкий диапазон значения.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. «Отстоял» передаёт спасение конкретного поля без отвлечённой религиозной лексики; «даровал победу» подчёркивает божественную инициативу. Частица «же» мягко связывает стих с предшествующим противопоставлением.
