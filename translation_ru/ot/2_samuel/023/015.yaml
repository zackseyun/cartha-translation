  text: 'Давид очень захотел воды и сказал[a]: «Кто даст мне напиться воды из колодца у ворот Вифлеема?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явной передачей смысла: «Если бы кто-нибудь дал мне напиться воды из колодца у ворот Вифлеема!» В еврейском тексте желание выражено вопросом: «Кто даст…?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: сильно захотел пить
  rationale: Форма хитпаэль от אוה выражает сильное желание. В данном контексте предмет желания — вода, поэтому естественное русское выражение «сильно захотел пить» передаёт эмоциональную силу глагола без неясного «возжелал».
- source_word: וַיֹּאמַר
  choice: сказал
  rationale: Обычное значение глагола; контекст сообщает словам оттенок желания, но еврейский текст не уточняет «воскликнул» или «сказал про себя».
- source_word: מִי
  choice: Кто даст
  rationale: Сохраняет вопросительную форму еврейского выражения, которое в контексте передаёт сильное желание.
- source_word: יַשְׁקֵנִי
  choice: даст мне напиться
  rationale: Хифиль от שקה означает «дать пить, напоить». Такое выражение естественно по-русски и сохраняет каузативный смысл.
- source_word: מַיִם
  choice: воды
  rationale: Прямое соответствие; родительный падеж обусловлен русской конструкцией «напиться воды».
- source_word: מִבֹּאר
  choice: из колодца
  rationale: בְּאֵר обычно обозначает колодец, а предлог מן указывает на источник воды.
- source_word: בֵּית לֶחֶם
  choice: Вифлееме
  rationale: Традиционная и общеупотребительная русская форма библейского топонима.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: что у ворот
  rationale: Фраза определяет колодец по его расположению возле городских ворот; «у ворот» естественно и не создаёт впечатления, будто колодец находился внутри самих ворот.
