- source_word: מַהְרַי
  choice: Махарай
  rationale: Личное имя передано стандартной транслитерацией с сохранением звучания еврейской формы.
- source_word: הַנְּטֹפָתִי
  choice: нетофафянин
  rationale: Обозначение происхождения или родовой связи передано традиционным русским этнонимическим образованием; это сохраняет форму перечня и не сужает значение до одного лишь места рождения.
