base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: ru
  text: Авесса, брат Иоава, сына Церуи, был главой Троих[a]. Он поднял своё копьё на триста человек и поразил их[b] и пользовался славой среди Троих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «глава Троих». Из-за текстуальной сложности этого раздела и параллельного места в 1 Паралипоменон 11:20 некоторые понимают здесь: «глава Тридцати».'
    reason: textual_variant
  - marker: b
    text: 'Или: «взмахнул своим копьём на триста человек и поразил их». Еврейская фраза очень сжата; буквально: «поднял своё копьё на триста убитых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: главой Троих
  rationale: רֹאשׁ означает «глава, предводитель». Масоретское чтение и заключительное בַּשְּׁלֹשָׁה поддерживают понимание названия группы как «Трое», хотя параллельное место и текстуальная сложность допускают «тридцать»; альтернатива сохранена в сноске.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: поднял своё копьё
  rationale: Глагол עורר буквально передаёт идею пробуждения, приведения в движение или поднятия; с копьём как дополнением речь идёт о его поднятии и применении в бою.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: против трёхсот человек и сразил их
  rationale: חָלָל обозначает поражённого или убитого. Развёрнутая русская формулировка естественно передаёт сжатое еврейское выражение, не скрывая его буквального строения, указанного в сноске.
- source_word: וְלוֹ שֵׁם
  choice: и снискал себе имя
  rationale: Буквальная идиома «у него было имя» означает известность и славу. «Снискал себе имя» сохраняет образ имени и звучит естественно и достойно по-русски.
- source_word: בַּשְּׁלֹשָׁה
  choice: среди Троих
  rationale: Предлог בְּ при названии группы здесь естественно передаётся словом «среди». Заглавная буква показывает, что «Трое» — обозначение круга прославленных воинов.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Авесса ... Иоав ... Саруя
  rationale: Использованы укоренившиеся в русской библейской традиции формы личных имён, понятные современному читателю.
