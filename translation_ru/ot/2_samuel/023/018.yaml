  - severity: low
    issue: «поднял своё копьё против трёхсот человек»
    rationale: Сочетание «поднять копьё против» возможно, но звучит менее идиоматично, чем «поднять копьё на». Добавление «человек» и экспликация «поразил их» остаются допустимым раскрытием эллиптической военной формулы.
