  source_fidelity: 'В целом переданы имя, родство, статус Авессы и число «триста». Однако «снискал себе имя» вносит оттенок приобретения славы, которого в еврейской формуле וְלוֹ שֵׁם нет: она сообщает о наличии имени/славы. Формулировка «поднял своё копьё против трёхсот человек» также менее естественна по-русски, хотя интерпретация «и сразил их» допустима для сжатого עַל־שְׁלֹשׁ מֵאוֹת חָלָל.'
  naturalness: «Поднял копьё на триста человек» — естественная русская конструкция для направленного боевого действия. «Пользовался славой среди Троих» передаёт идиому без неуместного оттенка достижения. Традиционная форма «Церуя» и родительный «Церуи» соответствуют устойчивому русскому библейскому употреблению.
  terminology: «Трое» сохранено как обозначение элитной группы, с заглавной буквы. Текстуальная возможность «Тридцать» надлежащим образом остаётся в сноске. Имена Авесса, Иоав и Церуя оставлены в традиционных русских библейских формах.
