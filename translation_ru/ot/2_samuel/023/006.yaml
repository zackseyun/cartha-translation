  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: ru
  text: 'А все негодные[a] — как терновник, который отбрасывают: его не берут рукой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «негодные», здесь означает порочных или нечестивых людей, а не позднейшее имя собственное «Велиал».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: А все негодные люди
  rationale: בְּלִיַּעַל здесь обозначает негодных, нечестивых людей, а не позднейшее имя собственное «Велиал». Слово «люди» добавлено для ясной передачи личного множественного референта.
- source_word: כְּקוֹץ
  choice: как … терновник
  rationale: Единственное число еврейского существительного сохранено как собирательный образ колючего растения; «терновник» естественно согласуется с последующим местоимением единственного числа.
- source_word: מֻנָד
  choice: отброшенный прочь
  rationale: Страдательное причастие передаёт то, что отгоняют или отбрасывают; эта формулировка сохраняет образ терновника, который устраняют, не беря голой рукой.
- source_word: כֻּלָּהַם
  choice: все
  rationale: 'Передана полнота охвата: речь идёт обо всех негодных людях.'
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение предыдущего сравнения и естественно звучит в современной русской речи.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: рукой его не возьмёшь
  rationale: Безлично-обобщённая русская конструкция естественно передаёт то, что такой терновник не берут рукой, сохраняя практическую невозможность, подразумеваемую контекстом.
theological_decisions:
- issue: Следует ли понимать בְּלִיַּעַל как имя собственного духовного существа?
  choice: негодные люди
  alternative: Велиал / люди Велиала
  rationale: В данном древнееврейском контексте слово имеет нарицательное значение «негодность, нечестие» и относится к людям; перевод именем собственным внёс бы более позднюю персонификацию.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Собирательный образ терновника и переход к единственному числу сохранены; двоеточие не добавлено, чтобы не усиливать связь сверх выраженной еврейским союзом.
