source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: ru
  text: Тогда трое могучих воинов прорвались через стан филистимлян, зачерпнули воды из вифлеемского колодца, что у ворот, понесли её и доставили Давиду. Но он не захотел её пить[a] и возлил её Господу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не захотел пить их». В еврейском тексте стоит местоименный суффикс множественного числа, согласующийся со словом «вода», которое имеет форму множественного числа.'
    reason: lexical_alternative
  - marker: b
    text: То есть возлил воду Господу как посвящённое Ему приношение; глагол может иметь оттенок обрядового возлияния.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: прорвались через
  rationale: Глагол передаёт преодоление вражеской позиции; выражение естественно для военного контекста.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: трое могучих воинов
  rationale: Сочетание сохраняет смысл особой группы доблестных бойцов Давида и понятно современному читателю.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: через стан филистимлян
  rationale: «Стан» передаёт военный лагерь и сохраняет достойный повествовательный регистр.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: зачерпнули воды
  rationale: Глагол означает набрать или почерпнуть воду из колодца; форма «воды» естественна после глагола и близка еврейскому выражению.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: из вифлеемского колодца, что у ворот
  rationale: Переданы принадлежность колодца Вифлеему и его расположение у городских ворот.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: понесли её и доставили Давиду
  rationale: Сохранены два последовательных еврейских глагола — несение воды и её доставление Давиду — без неестественного русского повтора.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: он не захотел её пить
  rationale: Передана волевая окраска אָבָה; в русском вода естественно обозначается местоимением единственного числа, тогда как особенность еврейского числа отмечена в сноске.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: возлил её
  rationale: «Возлил» сохраняет конкретное действие и допускает присущую глаголу נסך жертвенно-обрядовую окраску, не определяя акт слишком узко.
- source_word: לַיהוָה
  choice: Господу
  rationale: Дательный падеж передаёт направленность и посвящение действия; тетраграмматон передан традиционным русским обозначением «Господь».
theological_decisions:
- issue: Характер возлияния воды Давидом
  choice: Конкретное возлияние Господу с возможной жертвенно-посвятительной окраской
  alternative: Простое выливание воды как знак отказа без обрядового смысла
  rationale: Глагол נסך часто связан с возлиянием, а слова «Господу» указывают на посвящение действия. Перевод не называет его формально установленной жертвой и тем самым сохраняет смысловое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным звучанием. «Стан» и «возлил» уместно сохраняют военный и сакральный колорит, оставаясь понятными из контекста.
