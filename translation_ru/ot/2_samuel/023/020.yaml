  register: Современный литературный русский язык с достоинством исторического повествования. Имена переданы близко к древнееврейской форме. Длинная именная цепочка разделена на два предложения ради ясности; спорное אֲרִאֵל сохранено транслитерацией и пояснено в сноске.
