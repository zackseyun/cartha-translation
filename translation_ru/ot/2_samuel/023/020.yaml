base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: ru
  text: Беная, сын Иехояды, сына доблестного человека, совершивший великие подвиги, был родом из Кавцеэла. Он сразил двух ариэлов Моава[a]. Он спустился в яму и сразил в ней льва в снежный день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова אֲרִאֵל (ариэл) здесь неясно. Оно может означать «львоподобные воины», «герои» либо быть именем или титулом.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: доблестного человека
  rationale: В данном перечне воинских подвигов выражение, вероятно, характеризует силу и доблесть, а не просто состояние «живой». Такая передача также согласуется с близкой параллелью в 1 Пар. 11:22.
- source_word: רַב פְּעָלִים
  choice: совершивший великие подвиги
  rationale: Контекст говорит о выдающихся деяниях воина; «подвиги» естественно передаёт здесь конкретные славные дела, а конструкция с причастием делает русскую фразу ясной.
- source_word: מִקַּבְצְאֵל
  choice: был родом из Кавцеэла
  rationale: Предлог מִן указывает на место происхождения; развёрнутая русская формулировка звучит естественнее буквального «из Кавцеэла» в цепочке определений.
- source_word: הִכָּה
  choice: сразил
  rationale: В рассказе о воинских подвигах глагол נכה обозначает нанесение смертельного поражения; «сразил» сохраняет энергичность повествования и не звучит архаично.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: двух ариэлов Моава[a]
  rationale: Значение אֲרִאֵל здесь спорно. Транслитерация сохраняет реальную лексическую неопределённость, а сноска сообщает основные возможные толкования.
- source_word: יָרַד
  choice: спустился
  rationale: Глагол передаёт движение вниз; «спустился» естественен в связи с ямой.
- source_word: האריה
  choice: льва
  rationale: Существительное однозначно обозначает льва.
- source_word: בְּתוֹךְ הַבֹּאר
  choice: в яму … там
  rationale: בּוֹר может означать яму или водосборную цистерну. В этом контексте нейтральное «яма» не сужает значение, а «там» естественно передаёт нахождение внутри неё.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: в снежный день
  rationale: Идиоматичная современная передача дня, отмеченного снегом, без добавления невыраженных обстоятельств.
theological_decisions: []
