- source_word: שַׁמָּה
  choice: Шамма
  rationale: Личное имя передано русской транслитерацией с удвоенной согласной, отражающей еврейскую форму.
- source_word: הַחֲרֹדִי
  choice: из Харода
  rationale: Еврейское определение происхождения естественно и ясно передано по-русски как указание на место или родовую связь; такой вариант избегает неестественного этнонима «хароди́тянин» и сохраняет краткость перечня.
- source_word: אֱלִיקָא
  choice: Элика
  rationale: Личное имя передано русской транслитерацией, близкой к еврейскому звучанию.
- source_word: הַחֲרֹדִי
  choice: из Харода
  rationale: Повторено одинаково при обоих именах, чтобы сохранить параллельное построение исходного перечня.
