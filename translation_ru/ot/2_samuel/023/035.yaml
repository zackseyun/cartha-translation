lexical_decisions:
- source_word: חצרו
  choice: Хецро
  rationale: Личное имя в перечне воинов Давида передано транслитерацией с учётом масоретской огласовки; форма «Хецро» естественна для современной русской библейской передачи.
- source_word: הַכַּרְמְלִי
  choice: кармильтянин
  rationale: Прилагательное происхождения с артиклем обозначает человека из Кармила; русская форма кратко и естественно вписывается в перечень.
- source_word: פַּעֲרַי
  choice: Паарай
  rationale: Личное имя транслитерировано с сохранением раздельного звучания гласных, отражённого масоретской огласовкой.
- source_word: הָאַרְבִּי
  choice: арвитянин
  rationale: Прилагательное происхождения с артиклем, вероятно указывающее на место Арав; форма «арвитянин» сохраняет сжатый характер перечня и не навязывает более точной географической идентификации.
