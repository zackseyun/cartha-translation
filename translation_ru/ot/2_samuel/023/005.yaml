  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: ru
  text: Ибо мой дом не таков в отношениях с Богом[a]. Но Он заключил со мной вечный завет, во всём упорядоченный и надёжно хранимый. Ибо всё моё спасение и всё моё желание — разве Он не даст этому произрасти?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве мой дом не таков в отношениях с Богом?» Многие понимают начало стиха как положительный риторический вопрос, а не как отрицательное утверждение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Он непременно даст этому произрасти (расцвести)». Последняя фраза на еврейском языке трудна и может быть понята либо как риторический вопрос, либо как усиленное утверждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо / ведь
  rationale: 'Повторяющийся союз выполняет разные связующие функции: в начале поясняет предыдущее изречение, а далее вводит основание утверждения.'
- source_word: לֹא כֵן
  choice: не таков
  rationale: Сохраняет отрицательную форму масоретского текста и не уточняет сверх текста, в каком именно отношении дом Давида «не таков».
- source_word: בֵּיתִי
  choice: мой дом
  rationale: «Дом» сохраняет как семейное, так и династическое значение слова в контексте завета.
- source_word: עִם אֵל
  choice: перед Богом
  rationale: Буквальное «с Богом» по-русски здесь двусмысленно и неестественно; «перед Богом» ясно передаёт отношение дома Давида к Богу, не конкретизируя его далее.
- source_word: בְרִית עוֹלָם
  choice: вечный завет
  rationale: Устоявшееся и точное русское выражение, передающее непреходящую силу עוֹלָם.
- source_word: שָׂם לִי
  choice: заключил со мной
  rationale: В контексте завета идиоматическое русское «заключил со мной» передаёт действие установления завета лучше, чем буквальное «положил мне».
- source_word: עֲרוּכָה בַכֹּל
  choice: во всём устроенный
  rationale: Передаёт мысль о завете, приведённом в полный порядок, сохраняя всеохватность בַכֹּל.
- source_word: וּשְׁמֻרָה
  choice: надёжно хранимый
  rationale: 'Сохраняет пассивно-результативный смысл: завет оберегается и остаётся в безопасности.'
- source_word: כָל יִשְׁעִי
  choice: всё моё спасение
  rationale: «Спасение» передаёт широкий смысл избавления и сохраняет богословскую ёмкость יֵשַׁע.
- source_word: וְכָל חֵפֶץ
  choice: всё моё желание
  rationale: «Желание» естественно передаёт חֵפֶץ и поддерживает параллелизм со «спасением».
- source_word: יַצְמִיחַ
  choice: взрастит
  rationale: 'Глагол передаёт каузативный образ произрастания: Бог даст названному осуществиться и достичь полноты.'
theological_decisions:
- issue: Смысл начальной фразы כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: 'Отрицательное утверждение: «Ибо не таков мой дом перед Богом»'
  alternative: 'Положительный риторический вопрос: «Разве не таков мой дом перед Богом?»'
  rationale: Огласованный масоретский текст содержит отрицание, поэтому оно сохранено в основном тексте, несмотря на напряжение с последующим утверждением о вечном завете. Значимое положительное прочтение вынесено в примечание.
- issue: Смысл заключительной фразы כִּי לֹא יַצְמִיחַ
  choice: 'Положительный риторический вопрос: «Разве Он не взрастит всё это?»'
  alternative: 'Усиленное утверждение: «Он непременно даст всему этому произрасти»; либо буквальное отрицание: «ибо Он не взрастит»'
  rationale: 'Сжатая еврейская конструкция допускает разные понимания. Риторический вопрос сохраняет отрицательную форму и одновременно согласуется с утверждением о вечном завете. Добавленное «всё это» оставляет совокупный референт достаточно широким: спасение, желание и заветное обетование.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены ключевые образы «дома», «вечного завета» и произрастания; синтаксис разделён на ясные фразы без устранения смыслового напряжения исходного текста.
