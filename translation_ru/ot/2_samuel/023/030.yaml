  text: Benaiah the Pirathonite[a], Hiddai from the wadis of Gaash[b];
translation:
  language: ru
  text: Беная, пирафонянин; Хиддай[a] из ущелий[b] Гааша;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном списке в 1 Паралипоменон 11:32 это имя дано в форме «Хурай».
    reason: cross_reference
  - marker: b
    text: Еврейское слово может означать долину, овраг, ущелье или русло сезонного потока; традиционный перевод — «потоки» или «долины».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Беная
  rationale: Личное имя передано транслитерацией в форме, естественной для современного русского библейского текста.
- source_word: פִּרְעָתֹנִי
  choice: пирафонянин
  rationale: Прилагательное указывает на происхождение из Пирафона; русское обозначение жителя естественно передаёт эту связь.
- source_word: הִדַּי
  choice: Хиддай
  rationale: Передана форма имени в масоретском тексте книги Самуила; отличие параллельного места отмечено в сноске.
- source_word: מִ/נַּחֲלֵי
  choice: из ущелий
  rationale: נחל здесь обозначает особенности рельефа — долины, овраги или русла сезонных потоков; «ущелья» ясно и естественно передают географический смысл, не создавая впечатления постоянных водотоков.
- source_word: גָעַשׁ
  choice: Гааша
  rationale: Географическое название транслитерировано и поставлено в родительный падеж после «ущелий».
