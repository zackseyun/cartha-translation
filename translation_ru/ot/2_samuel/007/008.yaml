  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: ru
  text: 'Итак, вот что скажи Моему слуге Давиду: «Так говорит Яхве Воинств: Я взял тебя с пастбища[a], от стада, за которым ты ходил, чтобы ты стал правителем[b] над Моим народом, над Израилем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из загона». Еврейское слово может обозначать пастбище либо место, где пребывает стадо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предводителем», «вождём». Еврейское слово обозначает человека, поставленного руководить, и не обязательно является особым титулом «царь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к следующей части Божьей речи и вывод из предшествующего контекста; звучит естественно в современном русском.
- source_word: כֹּה תֹאמַר
  choice: вот что скажи
  rationale: Естественная русская передача формулы поручения, сохраняющая повелительную силу.
- source_word: לְעַבְדִּי לְדָוִד
  choice: Моему слуге Давиду
  rationale: Слово עבד здесь обозначает почётное положение Давида по отношению к Богу, а не подчёркивает рабский социальный статус; приложение передано без неестественного повторения предлога.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и точная русская формула посланнического провозглашения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное Божье имя и широту титула צבאות, не уточняя без основания, земные или небесные воинства имеются в виду.
- source_word: לְקַחְתִּיךָ
  choice: Я взял тебя
  rationale: Прямая передача Божьего избрания и возвышения Давида.
- source_word: מִן הַנָּוֶה
  choice: с пастбища
  rationale: נוֶה может обозначать пастбище или место пребывания стада; «пастбище» ясно и естественно в данном контексте.
- source_word: מֵאַחַר הַצֹּאן
  choice: от стада, за которым ты ходил
  rationale: Сохраняет буквальный образ нахождения «позади стада» и одновременно ясно указывает на прежнее пастушеское занятие Давида.
- source_word: לִהְיוֹת נָגִיד
  choice: чтобы ты стал правителем
  rationale: Инфинитив передаёт цель или результат, а נגיד означает назначенного руководителя и не тождествен формальному титулу царя.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: Моего народа, Израиля
  rationale: Приложение «Израиля» естественно отождествляет Божий народ, сохраняя оба элемента еврейского выражения; управление «правителем народа» в русском не требует повторения предлога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит Тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога, не заменяя его титулом.
- issue: Передача עבד применительно к Давиду
  choice: слуга
  alternative: раб
  rationale: Здесь это обозначение принадлежности и служения Давида Богу в заветно-царском контексте; «раб» неоправданно выдвинул бы на первый план социально-правовой статус.
- issue: Передача נגיד
  choice: правитель
  alternative: вождь; князь; предводитель; царь
  rationale: Термин обозначает поставленного Богом руководителя с властью, но сам по себе не является точным эквивалентом титула «царь»; более узкий титул не внесён.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формулы «вот что скажи» и «так говорит» ясны обычному читателю; личное имя «Яхве» и титул «Воинств» сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской благоговейной издательской традицией.
