base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: ru
  text: И даже это показалось малым в Твоих глазах, Владыка Господь; Ты также говорил о доме[a] раба Твоего на отдалённое будущее[b]. И это — наставление для человека[c], Владыка Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «дом» здесь может означать семью, род или династию.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вдаль»; в данном контексте речь идёт об отдалённом будущем.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная фраза в еврейском тексте трудна для понимания. Возможны также переводы: «это — установление для человечества», «таков закон человека» или «это — наставление о человечестве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: И даже это показалось малым в Твоих глазах
  rationale: 'Сохраняется еврейский образ оценки «в глазах Твоих», а וַתִּקְטַן передано естественным русским оборотом «показалось малым». עוֹד в данном контексте выражает усиление: «даже это».'
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Господь
  rationale: «Владыка» передаёт אֲדֹנָי, а «Господь» — традиционное русское соответствие имени יהוה; сочетание избегает неестественного «Господь Господь».
- source_word: וַתְּדַבֵּר גַּם אֶל
  choice: Ты возвестил также о
  rationale: דבר с אֶל здесь вводит Божье слово о доме Давида. «Возвестил» естественно передаёт торжественный контекст обещания, не добавляя содержания сверх исходного текста.
- source_word: בֵּית עַבְדְּךָ
  choice: о доме раба Твоего
  rationale: Сохраняется буквальный образ «дома», который в контексте может обозначать семью, род или династию; значение поясняется в сноске.
- source_word: לְמֵרָחוֹק
  choice: на далёкое будущее
  rationale: Пространственное значение «вдаль» здесь имеет временной смысл и относится к отдалённым грядущим временам.
- source_word: תּוֹרַת הָאָדָם
  choice: наставление для человека
  rationale: תּוֹרָה может означать наставление, установление или закон. «Наставление» сохраняет широту слова, а «для человека» передаёт הָאָדָם, не исключая возможного собирательного значения «человечество».
theological_decisions:
- issue: Смысл трудной заключительной фразы וְזֹאת תּוֹרַת הָאָדָם
  choice: И это — наставление для человека
  alternative: «И это — установление для человечества»; «и таков закон человека»; «и это — наставление о человечестве»
  rationale: Еврейская фраза допускает несколько синтаксических и смысловых толкований. Основной текст следует её лексическим составляющим и не превращает её в однозначное династическое, мессианское или юридическое утверждение; реальные альтернативы вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые еврейские образы «в Твоих глазах» и «дом раба Твоего», а неясность последней фразы не устранена толкованием.
