source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: ru
  text: 'Ведь Ты, Яхве Воинств, Бог Израиля, открыл это Своему слуге[a], сказав: «Я построю тебе дом»[b]. Поэтому Твой слуга нашёл в себе решимость[c] обратиться к Тебе с этой молитвой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл ухо Своего слуги» — еврейская идиома со значением «открыл, сообщил Своему слуге».'
    reason: lexical_alternative
  - marker: b
    text: В этом контексте слово «дом» может обозначать и строение, и царский род, династию.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «нашёл своё сердце», то есть обрёл внутреннюю решимость или смелость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широкий смысл титула, относящегося к подвластным Ему небесным и земным воинствам; не заменяет имя конфессионально обусловленным титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача конструкции, сохраняющая заветное отождествление Бога с Израилем.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: открыл это Своему слуге
  rationale: Естественно передаёт значение еврейской идиомы «открыть ухо», то есть сообщить или открыть нечто; буквальный образ сохранён в сноске.
- source_word: עַבְדְּךָ
  choice: Твой слуга
  rationale: В царской молитве выражает смиренное положение Давида перед Богом, не выдвигая на первый план значение подневольного рабства.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Явно сохраняет вводящую прямую речь функцию формы.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Я построю тебе дом
  rationale: 'Сохраняет ключевое слово «дом» и его намеренную многозначность: дом как строение и дом как династия.'
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт логический переход от Божьего откровения к молитвенному ответу Давида.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: нашёл в себе решимость
  rationale: Естественно передаёт смысл идиомы «нашёл своё сердце» — обрёл смелость или внутреннюю решимость; буквальная форма отмечена в сноске.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: обратиться к Тебе с этой молитвой
  rationale: Современная русская формулировка точно передаёт молитву, непосредственно обращённую к Богу.
theological_decisions:
- issue: Формула Божьего откровения
  choice: открыл это Своему слуге
  alternative: открыл ухо Своего слуги
  rationale: Основной текст передаёт смысл идиомы понятным русским языком, а сноска сохраняет её буквальный образ и возможность проверки.
- issue: Значение слова «дом»
  choice: дом
  alternative: храм; династия
  rationale: Контекст завета с Давидом поддерживает намеренную смысловую напряжённость между жилищем и династией; конкретизация устранила бы её без достаточного основания.
- issue: Идиома внутренней решимости
  choice: нашёл в себе решимость
  alternative: нашёл своё сердце; осмелился
  rationale: Выбранная формулировка раскрывает идиоматический смысл, не превращая его исключительно в эмоциональную смелость и не сохраняя непонятную русскому читателю кальку.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы. Избегаются как архаизмы вроде «Саваоф», так и разговорные обороты; ключевые еврейские идиомы переданы понятно и документированы в сносках.
