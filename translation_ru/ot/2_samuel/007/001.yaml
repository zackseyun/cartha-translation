lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Когда
  rationale: Формула вводит временное придаточное и новую сцену; «Когда» естественно передаёт её функцию без архаичного «И было».
- source_word: יָשַׁב
  choice: жил
  rationale: В данном контексте глагол обозначает постоянное пребывание в жилище, а не физическое сидение.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён употреблённый в еврейском тексте титул; имя Давида не подставляется.
- source_word: בְּבֵיתוֹ
  choice: в своём доме
  rationale: Буквальное значение בַּיִת — «дом»; этот выбор также сохраняет последующую игру значений слова «дом» в главе.
- source_word: וַיהוָה
  choice: а Яхве
  rationale: Имя יהוה передано как «Яхве»; союз «а» естественно связывает в русском две фоновые части временной конструкции, не выражая противопоставления.
- source_word: הֵנִיחַ לוֹ
  choice: даровал ему покой
  rationale: Каузативная форма глагола נוח означает, что Яхве обеспечил царю покой от военных угроз.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Передаёт окружающий, всеобъемлющий характер безопасности.
- source_word: מִכָּל אֹיְבָיו
  choice: от всех его врагов
  rationale: Точно сохраняет источник угрозы, от которой царю был дан покой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; личное имя передано транслитерацией, а не заменено титулом.
- issue: Значение בַּיִת применительно к царскому жилищу
  choice: дом
  alternative: дворец
  rationale: «Дом» сохраняет прямое значение еврейского слова и важную для главы литературно-богословскую многозначность, не исключая царского характера жилища.
