base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: ru
  text: Я буду ему Отцом, и он будет Мне сыном. Когда он совершит беззаконие, Я накажу его жезлом людей и ударами, наносимыми людьми[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и ударами сынов человеческих». Еврейское выражение обозначает людей вообще.'
    reason: 'Лексический вариант: современная русская передача выражения בְּנֵי אָדָם; буквальная форма сохранена в примечании.'
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Я буду ему отцом
  rationale: Сохранена еврейская реляционная конструкция с לְ; она естественна по-русски и не сглаживается до «Я буду его отцом».
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: и он будет Мне сыном
  rationale: Передана взаимная формула отношений, параллельная первой части стиха.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Когда он совершит беззаконие
  rationale: אֲשֶׁר здесь вводит обстоятельство последующего действия; «когда» передаёт временной оттенок, не усиливая условность, а «совершит беззаконие» сохраняет нравственную тяжесть корня עוה.
- source_word: וְהֹכַחְתִּיו
  choice: Я накажу его
  rationale: В сочетании с жезлом и ударами глагол обозначает исправительное наказание, а не только словесное обличение.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: жезлом человеческим
  rationale: 'Сохранена метафора жезла и открытость выражения: речь может идти как об обычных человеческих средствах наказания, так и о наказании через людей.'
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: и ударами сынов человеческих
  rationale: «Удары» ясно передаёт נְגָעִים в данном контексте, а «сыны человеческие» формально сохраняет еврейское обозначение людей вообще; более естественный вариант вынесен в примечание.
theological_decisions:
- issue: Отнесение обещания о сыновстве к царскому потомку Давида и его последующее мессианское употребление
  choice: Стих переведён в его непосредственном контексте как обращённый к потомку и царю из дома Давида, без добавления явного мессианского толкования.
  alternative: Передать текст как прямое мессианское пророчество в основном тексте.
  rationale: Еврейский текст говорит прежде всего о Давидовом потомке в рамках завета и прямо допускает его беззаконие и наказание; перевод сохраняет эту историческую и богословскую напряжённость, не исключая последующего применения языка сыновства в Писании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены параллелизм и образность оригинала; архаичные формы вне устойчивого выражения «сыны человеческие» не использованы. Местоимение «Мне» при обращении Бога к Себе написано с прописной буквы по принятой русской библейской традиции.
