  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: ru
  text: И ныне, Владыка Яхве, Ты — Бог, и слова Твои истинны[a], и Ты сказал Своему рабу об этом благе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слова Твои будут истинны»; также возможно: «слова Твои надёжны».'
    reason: Еврейское יִהְיוּ формально допускает будущее значение, а אֱמֶת может обозначать как истину, так и надёжность, верность.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И ныне
  rationale: Сохраняет соединительное וְ и молитвенно-торжественное значение עַתָּה; выражение естественно для современного литературного русского в данном регистре.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное Божье имя יהוה, сохраняя оба элемента обращения без неестественного повтора «Господь Господь».
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: Ты — Бог
  rationale: Именная конструкция с אַתָּה הוּא имеет усилительный оттенок. Русское ударение и тире естественно передают категоричность утверждения, не добавляя отсутствующего в русском артикля.
- source_word: דְבָרֶיךָ
  choice: слова Твои
  rationale: Сохраняется множественное число исходного текста; «обещания» было бы контекстуальным истолкованием.
- source_word: יִהְיוּ אֱמֶת
  choice: истинны
  rationale: Имперфект יִהְיוּ в этом исповедальном контексте может выражать устойчивую действительность, а אֱמֶת — истинность и надёжность. Настоящее время звучит по-русски естественно; формальная возможность будущего значения отмечена в сноске.
- source_word: וַתְּדַבֵּר
  choice: Ты возвестил
  rationale: Глагол означает речь Бога, уже обращённую к Давиду. «Возвестил» сохраняет смысл говорения и соответствует достоинству молитвенного регистра, не сужая его до «пообещал».
- source_word: אֶל עַבְדְּךָ
  choice: рабу Твоему
  rationale: В библейской царской молитве עֶבֶד обозначает смиренное положение Давида перед Богом; традиционное русское «раб» здесь точнее статусно и естественно в данном регистре.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: это благо
  rationale: Субстантивированное прилагательное женского рода буквально указывает на «это доброе». «Это благо» сохраняет широту выражения и не конкретизирует его как обещание или благословение.
theological_decisions:
- issue: Передача сложного Божьего наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул и личное имя, прямо присутствующее в еврейском тексте, и избегает как замены имени словом «Бог», так и стилистически тяжёлого сочетания двух близких титулов.
- issue: Временное и смысловое значение יִהְיוּ אֱמֶת
  choice: слова Твои истинны
  alternative: слова Твои будут истинны; слова Твои надёжны
  rationale: Контекст допускает как формально будущее прочтение имперфекта, так и утверждение непреходящей истинности Божьих слов. Основной текст использует естественную русскую формулировку, а неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранены традиционные прописные местоимения при обращении к Богу. Синтаксис ясен для обычного читателя, но не сглаживает усиленное исповедание «Ты — Бог» и смысловую неоднозначность יִהְיוּ אֱמֶת.
