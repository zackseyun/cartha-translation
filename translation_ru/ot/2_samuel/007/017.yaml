  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: ru
  text: Все эти слова и всё это видение[a] Нафан передал Давиду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откровение». Еврейское слово обозначает пророческое откровение, нередко получаемое в форме видения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: в точности со всеми
  rationale: Предлог כְּ выражает соответствие, а כֹל — полноту. Оборот передаёт мысль о точном и полном соответствии сказанного полученному сообщению.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: этими словами
  rationale: В контексте переданного Нафану Божьего сообщения דְּבָרִים естественнее понимать как «слова», а не обобщённо как «дела» или «вещи».
- source_word: וּכְכֹל
  choice: и со всем
  rationale: Союз и повтор конструкции соответствия сохранены, чтобы передать еврейский параллелизм, но по-русски второй оборот сделан компактнее.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: этим видением
  rationale: חִזָּיוֹן обозначает пророческое видение или полученное через него откровение. «Видение» — прямой эквивалент, сохраняющий способ пророческого восприятия.
- source_word: כֵּן
  choice: в точности
  rationale: 'כֵּן подводит итог сравнению: Нафан говорил именно так, как ему было сообщено. Значение включено в начальный оборот ради естественного русского порядка слов.'
- source_word: דִּבֶּר
  choice: говорил
  rationale: Обычный русский повествовательный эквивалент глагола דבר; несовершенный вид естественно описывает содержание речи, переданной Давиду.
- source_word: נָתָן
  choice: Нафан
  rationale: Использована традиционная русская библейская форма имени.
- source_word: אֶל דָּוִד
  choice: Давиду
  rationale: Направление речи, выраженное אֶל, естественно передаётся русским дательным падежом.
theological_decisions:
- issue: Характер пророческого сообщения в חִזָּיוֹן
  choice: В основном тексте — «видение».
  alternative: «откровение»
  rationale: «Видение» прямо передаёт еврейский термин и сохраняет указание на пророческую форму сообщения; сноска отмечает более широкое смысловое значение, не устраняя неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор исходного параллелизма сохранён без тяжеловесного буквального «согласно всем… согласно всему…».
