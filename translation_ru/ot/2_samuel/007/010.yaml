  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: ru
  text: И Я назначу место Моему народу Израилю и насажу его, и он будет жить на своём месте и больше не будет потревожен. И сыны неправды[a] не станут больше угнетать его, как прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть злодеи, нечестивцы; буквально: «сыны неправды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: И Я назначу место
  rationale: Глагол שׂוּם буквально означает «поместить, установить», но при מָקוֹם в контексте обещания выражает назначение народу определённого места. «Назначу место» сохраняет инициативу Бога и не сужает смысл до понятия родины.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: Моему народу Израилю
  rationale: Два обозначения находятся в приложении; перевод сохраняет как отношение принадлежности «Моему народу», так и имя «Израилю».
- source_word: וּנְטַעְתִּיו
  choice: и насажу его
  rationale: Сохранена метафора насаждения и мужской род единственного числа, соответствующий собирательному существительному «народ» и еврейскому местоименному суффиксу.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: и он будет жить на своём месте
  rationale: Собирательный Израиль передан единственным числом. תַּחְתָּיו в данном контексте обозначает устойчивое пребывание на отведённом ему месте, а не пространственное положение «под ним».
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: и больше не будет потревожен
  rationale: רגז допускает значения колебания, тревоги и нарушения покоя. Пассивная русская формулировка естественно передаёт внешнее нарушение безопасности в контексте нападений.
- source_word: בְנֵי עַוְלָה
  choice: сыны неправды
  rationale: Сохранён образный еврейский оборот и его явно мужская форма. עַוְלָה охватывает неправду, несправедливость и нечестие; более идиоматический смысл пояснён в сноске.
- source_word: לְעַנּוֹתוֹ
  choice: угнетать его
  rationale: Пиэль ענה здесь обозначает причинение страдания и притеснение со стороны враждебных людей. «Угнетать» естественно соответствует историческому контексту.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: как прежде
  rationale: Кратко и естественно передаёт сопоставление с прежними периодами притеснения.
theological_decisions:
- issue: Собирательный Израиль при глаголах и суффиксах мужского рода единственного числа
  choice: 'Последовательно передать единственным числом: «насажу его», «он будет жить», «угнетать его»'
  alternative: 'Передать по смыслу множественным числом: «насажу их», «они будут жить», «угнетать их»'
  rationale: Русское «народ» естественно допускает согласование в мужском роде единственного числа, поэтому можно сохранить грамматическую форму и национальную персонификацию еврейского текста без ущерба ясности.
- issue: Идиома בְנֵי עַוְלָה
  choice: Сохранить в тексте образ «сыны неправды»
  alternative: «злодеи», «нечестивцы» или «люди, творящие зло»
  rationale: Буквальный образ значим и понятен в возвышенной библейской речи; сноска сообщает его идиоматический смысл, не сводя многозначное עַוְלָה только к одному оттенку.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные местоимения по отношению к Богу использованы как принятая русская издательская норма. Синтаксис сохраняет последовательность обещаний, а местоимения единственного числа — собирательный образ народа Израиля.
