  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: ru
  text: И твой дом[a], и твоё царство будут упрочены навеки пред тобой[b]; твой престол будет утверждён навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «дом» означает также царский род, то есть династию.
    reason: lexical_alternative
  - marker: b
    text: 'Некоторые древние текстовые свидетельства читают: «предо Мной».'
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: будут упрочены
  rationale: Нифаль глагола אמן выражает состояние прочности, надёжности и длительной утверждённости. Пассивная форма «будут упрочены» передаёт этот оттенок и позволяет отличить выражение от נָכוֹן во второй части стиха.
- source_word: בֵּיתְךָ
  choice: твой дом
  rationale: В контексте царского обетования בַּיִת обозначает не только дом, но и царский род, династию. Основное значение сохранено в тексте, а династический смысл пояснён в сноске.
- source_word: וּמַמְלַכְתְּךָ
  choice: и твоё царство
  rationale: Существительное обозначает царство или царскую власть; «царство» прямо и естественно сочетается здесь с «домом» и «престолом».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Фраза выражает неограниченную продолжительность. Повтор в обеих частях стиха сохранён ради исходного смыслового акцента.
- source_word: לְפָנֶיךָ
  choice: пред тобой
  rationale: 'Предоставленный масоретский текст имеет суффикс второго лица мужского рода единственного числа: «пред тобой». Значимый вариант «предо Мной» приведён в сноске.'
- source_word: כִּסְאֲךָ
  choice: твой престол
  rationale: Это прямое обозначение царского престола, которое также метонимически указывает на царскую власть.
- source_word: יִהְיֶה נָכוֹן
  choice: будет утверждён
  rationale: Сочетание היה с נָכוֹן передаёт прочность и устойчивую утверждённость престола. Формулировка естественна по-русски и сохраняет отличие от «будут упрочены» в первой части.
theological_decisions:
- issue: Династическое обетование и возможное мессианское значение
  choice: Сохранить слова «дом», «царство» и «престол», не делая мессианское истолкование явным в самом переводе.
  alternative: Передать «дом» словом «династия» либо прямо обозначить мессианское исполнение обетования.
  rationale: Непосредственно стих обещает продолжение царского дома Давида. Более широкое мессианское прочтение возможно, но не должно вноситься в формулировку перевода сверх сказанного в еврейском тексте.
- issue: Разночтение «пред тобой» / «предо Мной»
  choice: 'Следовать предоставленному масоретскому тексту: «пред тобой», сохранив иной вариант в сноске.'
  alternative: Принять чтение «предо Мной», поддерживаемое некоторыми древними текстовыми свидетельствами и контекстом Божьей речи.
  rationale: Форма לְפָנֶיךָ в исходном тексте недвусмысленно означает «пред тобой», однако вариант «предо Мной» достаточно значим, чтобы его не скрывать.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Параллелизм и двукратное «навеки» сохранены; лексика остаётся понятной обычному читателю.
