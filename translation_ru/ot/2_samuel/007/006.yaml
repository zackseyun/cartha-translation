base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: ru
  text: Ведь Я не обитал в доме с того дня, когда вывел сынов Израиля[a] из Египта, и до сего дня, но всё это время переходил с места на место, пребывая в шатре и в скинии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в шатре и в обиталище». Слово, переведённое как «скиния», может означать «обиталище»; здесь оно относится к переносному святилищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: не обитал
  rationale: В сочетании с «в доме» глагол означает постоянное проживание; «обитал» сохраняет достоинство речи и противопоставление переносному святилищу.
- source_word: בְּבַיִת
  choice: в доме
  rationale: Существительное формально неопределённое и означает «дом»; перевод «в храме» был бы контекстуальным истолкованием.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: с того дня, когда вывел
  rationale: Оборот задаёт начальную временную точку, а Hiphil עלה обозначает выведение из Египта; по-русски «вывел» естественнее буквального «поднял».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Передаёт мужскую форму и традиционный библейский оборот, оставаясь понятным современному читателю; в примечании приведён смысловой вариант.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Естественно сочетается с русским глаголом «вывел» и точно обозначает исходное место.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: и до сего дня
  rationale: Сохраняет границу длительного периода вплоть до момента речи и соответствует торжественному регистру.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: но переходил с места на место
  rationale: Конструкция выражает продолжительное перемещение в противоположность постоянному обитанию в доме; союз «но» естественно выявляет контраст.
- source_word: בְּאֹהֶל
  choice: в шатре
  rationale: Передаёт переносное жилище или святилище без внесения определённости, которой нет в еврейской форме.
- source_word: וּבְמִשְׁכָּן
  choice: и в скинии
  rationale: В культовом контексте משכן обозначает переносное святилище; «скиния» — устоявшийся и точный русский термин, тогда как буквально возможно «обиталище».
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет явную форму еврейского выражения, а примечание разъясняет его обычное собирательное значение без изменения референта.
- issue: Культовое значение מִשְׁכָּן
  choice: скиния
  alternative: обиталище
  rationale: Контекст говорит о переносном святилище до строительства постоянного дома; «скиния» передаёт это значение, а примечание сохраняет лексическую широту слова.
- issue: Соотношение אֹהֶל и מִשְׁכָּן
  choice: в шатре и в скинии
  alternative: в шатре-обиталище
  rationale: Сохранены два отдельных еврейских существительных и соединительный союз; перевод не решает молча, обозначают ли они два аспекта одного святилища или риторическую пару.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Обитал», «до сего дня» и «скиния» поддерживают достоинство прямой речи Бога, не делая синтаксис архаичным. Продолженное значение еврейской конструкции естественно выражено формой «переходил с места на место».
