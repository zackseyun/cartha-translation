source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: ru
  text: 'Во всех местах, где Я ходил среди всех сынов Израиля, говорил ли Я хотя бы слово одному из колен Израиля[a], которому Я повелел пасти Мой народ Израиль, говоря: «Почему вы не построили Мне дом из кедра?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В масоретском тексте 2 Царств 7:7: «одному из колен Израиля». В параллельном месте, 1 Паралипоменон 17:6, сказано: «одному из судей Израиля»; вероятно, имеются в виду руководители, которым было поручено пасти народ.'
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: Я ни ходил
  rationale: Возвратная порода глагола הלך здесь передаёт перемещение Бога среди народа, а не постоянное пребывание; конкретный образ хождения сохранён.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Где бы Я ни ходил среди всех сынов Израиля
  rationale: Русская уступительно-обобщающая конструкция естественно передаёт всеохватность еврейского оборота и сохраняет пространственный оттенок образа хождения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено традиционное и формально точное мужское обозначение народа как потомков Израиля.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: говорил ли Я хоть слово
  rationale: Сочетание вопросительной частицы с однокоренными существительным и глаголом имеет усилительную силу; «хоть слово» естественно передаёт категорический риторический вопрос.
- source_word: אֶת אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: какому-либо из колен Израиля
  rationale: Масоретский текст книги Самуила прямо читает «одно из колен Израиля»; дательный падеж после «говорил» естественно передаёт адресата речи.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: которому повелел пасти
  rationale: Сохранены синтаксическая связь относительного придаточного с «коленом» и пастырская метафора управления, хотя контекст позволяет видеть за коленом его руководителей.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: Мой народ Израиль
  rationale: Переданы и принадлежность народа Богу, и поясняющее наименование Израиля.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Почему вы не построили Мне дом из кедра?
  rationale: «Дом из кедра» естественен в современном русском; местоимение «вы» сохраняет множественное число еврейского глагола и не устраняет напряжение с предшествующим единственным числом.
theological_decisions:
- issue: Гендерно маркированное заветное наименование народа
  choice: сынов Израиля
  alternative: народ Израиля; израильтян
  rationale: Еврейское выражение имеет форму мужского рода и служит обычным национально-заветным обозначением; буквальная форма понятна по-русски и сохраняет исходный образ происхождения.
- issue: Расхождение между «коленами» в 2 Царств и обозначением вождей в параллельном месте
  choice: какому-либо из колен Израиля
  alternative: кому-либо из судей (или правителей) Израиля
  rationale: Основной текст следует масоретскому чтению שִׁבְטֵי, «колена». Параллель 1 Паралипоменон 17:6 и упоминание поручения пасти народ указывают на руководителей, но это не подменяет чтение данного стиха и потому вынесено в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены риторический вопрос, образ Божьего хождения среди народа, пастырская метафора и неожиданная смена единственного числа на множественное в прямой речи.
