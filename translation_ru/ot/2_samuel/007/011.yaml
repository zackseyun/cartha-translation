source:
  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: ru
  text: и с того дня, когда Я поставил судей над Моим народом Израилем. Я даровал тебе покой от всех твоих врагов. И Яхве возвещает тебе, что Яхве создаст тебе дом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом» здесь, вероятно, указывает на царский род, династию Давида, и одновременно перекликается с желанием Давида построить дом — храм — Яхве.
    reason: Сохранение лексической многозначности и игры слов.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: и с того дня
  rationale: Сохраняет соединительную силу וּ и исходную временную точку, продолжая мысль предыдущего стиха.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: Я поставил судей
  rationale: В данном сочетании צוה обозначает учреждение или назначение судей, а не только отдачу им повеления.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: над Моим народом Израилем
  rationale: Предлог עַל передаёт власть и управление судей над народом.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Я даровал тебе покой от всех твоих врагов
  rationale: Каузативная форма נוח означает дать покой или избавление; «даровал покой» естественно передаёт действие Бога и достигнутый результат.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: И Яхве возвещает тебе
  rationale: נגד в породе хифиль означает сообщать или возвещать; настоящее время уместно для совершаемого здесь торжественного объявления. Начальное «И» сохраняет соединительную функцию וְ без добавления более определённого «также».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: что Яхве Сам создаст тебе дом
  rationale: '«Создаст тебе дом» передаёт широкий смысл עשה и сохраняет образ дома, который в контексте указывает на династию, одновременно перекликаясь с храмом. «Сам» естественно подчёркивает контраст: не Давид построит дом Яхве, а Яхве создаст дом Давиду.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение בַּיִת в обещании Давиду
  choice: дом
  alternative: династия; царский род; храм
  rationale: 'Буквальное «дом» сохраняет намеренную многозначность: речь идёт о династии Давида, но формулировка отзывается на его желание построить дом-храм Яхве.'
- issue: Субъект и контраст в обещании о доме
  choice: Яхве Сам создаст тебе дом
  alternative: Яхве построит тебе дом
  rationale: Эта формулировка сохраняет божественную инициативу и литературный переворот между замыслом Давида и обещанием Бога, не сводя «дом» к зданию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы. Фрагментарное начало сохранено, поскольку стих продолжает синтаксис предыдущего контекста; пунктуация следует масоретскому членению с паузой после «Израилем».
