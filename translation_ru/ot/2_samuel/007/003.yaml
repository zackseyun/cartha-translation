  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: ru
  text: 'И Нафан сказал царю: «Ступай и сделай всё, что у тебя в сердце[a], потому что Яхве с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что у тебя на сердце». Здесь «сердце» означает внутренний замысел, намерение или решимость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И … сказал
  rationale: Последовательная форма с וַ продвигает повествование; союз «и» естественно сохраняет связь с предыдущим контекстом.
- source_word: נָתָן
  choice: Нафан
  rationale: Использована традиционная русская библейская форма имени.
- source_word: אֶל הַמֶּלֶךְ
  choice: царю
  rationale: Еврейский текст употребляет нарицательное «царь» с определённым артиклем и не называет Давида по имени в этом стихе.
- source_word: לֵךְ עֲשֵׂה
  choice: Ступай и сделай
  rationale: Два повелительных глагола выражают разрешение и побуждение действовать. «Ступай и сделай» передаёт их прямо и естественно в достойном современном русском стиле.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: всё, что у тебя на сердце
  rationale: לֵבָב здесь обозначает внутреннее намерение, замысел или решимость, а не только чувство. Русская идиома «на сердце» естественна и сохраняет образ оригинала.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для совета Нафана; «потому что» ясно передаёт причинное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Прямо передаёт присутствие и поддержку, сохраняя богословскую ёмкость выражения без поясняющего расширения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале непосредственно употреблён тетраграмматон. Форма «Яхве» передаёт личное имя, не подменяя его титулом.
- issue: Смысл утверждения «Яхве с тобой»
  choice: сохранено без уточнения
  alternative: «Яхве поддерживает тебя» или «Яхве на твоей стороне»
  rationale: Более развёрнутые варианты могли бы сузить смысл до одобрения конкретного замысла. Буквальная формулировка сохраняет возможные значения Божьего присутствия и поддержки, а также повествовательное напряжение перед последующим откровением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Ступай» передаёт повелительное לֵךְ естественнее, чем буквальное «иди» в данном контексте разрешения; синтаксис остаётся ясным для широкого читателя.
