base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: ru
  text: Когда исполнятся твои дни и ты ляжешь вместе со своими предками[a], Я воздвигну после тебя твоего потомка[b], который произойдёт из твоего собственного тела[c], и утвержу его царство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский эвфемизм смерти и погребения среди предков.
    reason: cultural_note
  - marker: b
    text: 'Или: «твоё потомство»; буквально: «твоё семя». Еврейское слово может обозначать как одного потомка, так и потомство в целом.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «выйдет из твоих внутренностей»; то есть будет твоим родным, кровным потомком.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Здесь союз вводит будущее временное обстоятельство, а не причинное пояснение.
- source_word: יִמְלְאוּ יָמֶיךָ
  choice: исполнятся твои дни
  rationale: Сохраняет образ наполнения дней и торжественный тон древнееврейского выражения.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: ты ляжешь с твоими отцами
  rationale: Сохраняет обычный древнееврейский эвфемизм смерти и погребения среди предков, не заменяя его истолкованием.
- source_word: וַהֲקִימֹתִי
  choice: Я воздвигну
  rationale: В породе хифиль с потомком как дополнением глагол означает поставить или воздвигнуть преемника.
- source_word: זַרְעֲךָ
  choice: твоего потомка
  rationale: В данном контексте последующие местоимения единственного числа указывают на представительного потомка, однако само еврейское слово может иметь также собирательное значение; это отмечено в сноске.
- source_word: אַחֲרֶיךָ
  choice: после тебя
  rationale: Передаёт как временную последовательность, так и идею престолонаследия.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: который произойдёт из твоего чрева
  rationale: Достаточно буквально сохраняет телесный образ מֵעֶה и ясно обозначает родного, биологического потомка.
- source_word: וַהֲכִינֹתִי
  choice: упрочу
  rationale: Передаёт каузативный смысл корня כון — сделать твёрдым, прочным и устойчивым — и позволяет отличить его от предыдущего «воздвигну».
- source_word: מַמְלַכְתּוֹ
  choice: его царство
  rationale: Естественно передаёт царскую власть и владение в контексте династического обетования.
theological_decisions:
- issue: Объём значения זַרְעֲךָ в обетовании Давиду
  choice: твоего потомка
  alternative: твоё потомство; твоё семя
  rationale: Единственное число согласуется с ближайшим преемником, тогда как лексема זֶרַע допускает собирательное значение. Сноска сохраняет династическую и мессианскую открытость текста, не навязывая её основному переводу.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного династического тона. Архаизирующее «чрево» оставлено как понятный библейский образ, пояснённый сноской; синтаксис сделан плавным и пригодным для публичного чтения.
