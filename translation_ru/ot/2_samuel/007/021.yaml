base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: ru
  text: Ради Твоего слова[a] и по сердцу Твоему[b] Ты совершил всё это великое дело[c], чтобы Твой раб узнал об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «из-за Твоего слова» или «ради Твоего обещания».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по сердцу Твоему», то есть согласно Твоему собственному намерению или воле.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте единственное число: буквально «всё это величие»; возможно также: «все эти великие дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Ради
  rationale: Предлог выражает основание или побуждение. «Ради» естественно сочетается со «словом» и сохраняет возможный оттенок «ради сказанного / во исполнение сказанного», не сводя выражение только к причинному «из-за».
- source_word: דְּבָרְךָ
  choice: Твоего слова
  rationale: דבר может означать слово, сказанное или обещание. «Твоего слова» сохраняет широту еврейского выражения; в контексте оно может подразумевать данное Богом обещание.
- source_word: וּכְלִבְּךָ
  choice: и по сердцу Твоему
  rationale: לב здесь обозначает внутреннее намерение, волю или желание. Сохранение образа сердца передаёт метафору оригинала и не заменяет её более отвлечённым толкованием.
- source_word: עָשִׂיתָ
  choice: Ты совершил
  rationale: Перфект обозначает завершённое действие. «Совершил» уместно для торжественной молитвенной речи и естественно сочетается с последующим обобщённым выражением.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: всё это великое
  rationale: В еврейском стоит единственное число и обобщающее существительное «величие». Русское субстантивированное «всё это великое» сохраняет собирательный смысл и звучит естественнее буквального «всё это величие» после глагола «совершил».
- source_word: לְהוֹדִיעַ
  choice: чтобы дать знать
  rationale: 'Порода hифиль имеет каузативное значение: «сделать так, чтобы узнал». «Дать знать» передаёт эту направленность яснее, чем более широкое «показать».'
- source_word: עַבְדֶּךָ
  choice: Твоему рабу
  rationale: В царской молитве это почтительное и смиренное самообозначение Давида перед Богом; «раб» является точным и традиционно понятным русским соответствием.
theological_decisions:
- issue: Значение выражения «Твоего слова» в контексте завета
  choice: Сохранено широкое «Твоего слова».
  alternative: «Твоего обещания» или «того, что Ты сказал».
  rationale: Контекст позволяет понимать слово как Божье обещание Давиду, однако сам еврейский текст употребляет более широкое דבר. Перевод не сужает его смысл заранее.
- issue: Образ сердца применительно к Богу
  choice: Сохранено «по сердцу Твоему».
  alternative: «по Твоей воле» или «по Твоему желанию».
  rationale: Так сохраняется антропоморфный образ оригинала и его указание на собственное намерение Бога без замены образа богословской абстракцией.
- issue: Единственное собирательное обозначение Божьего деяния
  choice: «всё это великое».
  alternative: «все эти великие дела».
  rationale: Еврейский текст представляет содеянное как единое проявление величия. Множественное число было бы понятнее в некоторых контекстах, но устранило бы эту особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис остаётся ясным для обычного читателя, а еврейские образы «слово» и «сердце» сохранены.
