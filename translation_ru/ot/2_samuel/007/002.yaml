base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: ru
  text: 'И сказал царь пророку Нафану: «Вот, я живу в кедровом доме, а ковчег Божий пребывает среди полотнищ[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутри завесы». Еврейское слово стоит в единственном числе и обозначает шатровое полотнище или завесу; в данном контексте оно может употребляться собирательно, о шатровых полотнищах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная передача повествовательной формы wayyiqtol, сохраняющая последовательное течение еврейского рассказа.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: В еврейском тексте употреблён определённый титул; имя Давида не добавляется.
- source_word: נָתָן הַנָּבִיא
  choice: пророку Нафану
  rationale: Естественный для современного русского порядок слов при приложении-титуле; личное имя передано в принятой библейской форме.
- source_word: רְאֵה נָא
  choice: Вот
  rationale: В данном высказывании это естественный русский способ привлечь внимание собеседника к очевидному контрасту; буквальное «посмотри же» звучало бы тяжеловесно.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: я живу
  rationale: Глагол ישׁב здесь обозначает проживание; отдельное местоимение сохраняется, не усиливаясь до «я сам».
- source_word: בְּבֵית אֲרָזִים
  choice: в кедровом доме
  rationale: Конструкция указывает на дом из кедрового дерева или отделанный им; выражение естественно и конкретно по-русски.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: а ковчег Божий
  rationale: Союз ו в контексте выражает противопоставление между жилищем царя и местом пребывания ковчега.
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  choice: находится под полотнищем
  rationale: Для неодушевлённого ковчега «находится» звучит естественнее повторного «живёт», а «под полотнищем» сохраняет конкретный образ шатрового покрытия, не обобщая его до «шатра».
theological_decisions:
- issue: Место пребывания ковчега
  choice: под полотнищем
  alternative: в шатре; среди завес; под завесой
  rationale: יְרִיעָה обозначает полотнище, завесу или покрытие шатра. Перевод сохраняет временный шатровый образ и не привносит последующее храмовое богословие; число и точный пространственный образ остаются отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён контраст между кедровым домом царя и скромным шатровым покрытием ковчега; синтаксис сделан естественным для широкого читателя.
