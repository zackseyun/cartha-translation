    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: Моя неизменная любовь
  rationale: חֶסֶד здесь обозначает устойчивую, верную любовь в рамках заветных отношений. «Неизменная любовь» естественно звучит по-русски и передаёт постоянство Божьего расположения, не сводя значение только к милосердию.
- source_word: יָסוּר
  choice: не отступит
  rationale: Глагол סור означает «отступать, удаляться, отходить». При подлежащем «любовь» выражение «не отступит от него» сохраняет образ исходного текста и звучит естественно.
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: Предлог מן с местоименным суффиксом прямо выражает удаление от обещанного царского потомка.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз вводит сопоставление с тем, что произошло с Саулом; краткое «как» точно сохраняет сравнительную связь.
- source_word: הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: Я отнял её у Саула
  rationale: Каузативная форма סור означает удаление или отнятие; подразумеваемым дополнением служит Божья неизменная любовь. Местоимение «её» делает русскую фразу ясной, не добавляя нового содержания.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: которого Я удалил от лица твоего
  rationale: Формулировка сохраняет буквальный пространственный образ «из-перед тебя» и не ограничивает его значение лишь лишением царской власти.
theological_decisions:
- issue: Смысл חֶסֶד в контексте завета с Давидом
  choice: «неизменная любовь»
  alternative: «милость»; «любовь, верная завету»; «верная любовь»
  rationale: Выбранный вариант передаёт постоянство и верность Божьего отношения, не превращая перевод в узкую богословскую формулу. Заветный оттенок поясняется в сноске.
- issue: Значение выражения מִלְּפָנֶיךָ
  choice: «от лица твоего»
  alternative: «из твоего присутствия»; «с глаз твоих»; «с царского места перед тобой»
  rationale: Еврейское выражение допускает более широкий смысл удаления Саула по отношению к Давиду. Сохранение образа не разрешает намеренно оставленную в тексте смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Архаизирующее «от лица твоего» сохранено точечно ради исходного образа; его смысл пояснён в сноске.
