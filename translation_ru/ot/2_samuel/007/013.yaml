source:
  edition: WLC
  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: ru
  text: Он построит дом для Моего имени[a], и Я навеки утвержу престол его царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм для Моего имени». В еврейском тексте буквально сказано «дом для Моего имени», благодаря чему сохраняется проходящая через всю главу игра значений: дом как храм и дом как династия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение мужского рода прямо обозначает обещанного потомка Давида; дополнительное усиление «именно он» контекстом не требуется.
- source_word: יִבְנֶה
  choice: построит
  rationale: Имперфект qal в контексте обещания передаёт будущее действие; совершенный вид естественно выражает завершённое строительство.
- source_word: בַּיִת
  choice: дом
  rationale: 'Слово буквально означает «дом» и здесь указывает на святилище, но его прямой перевод сохраняет ключевую для главы игру значений: дом как храм и дом как династия.'
- source_word: לִשְׁמִי
  choice: для Моего имени
  rationale: Так передаётся сочетание предлога ל с существительным «имя» без истолковывающего расширения; выражение остаётся ясным и сохраняет библейский богословский образ.
- source_word: וְכֹנַנְתִּי
  choice: и Я… утвержу
  rationale: Форма первого лица в последовательности обещаний имеет будущее значение. «Утвержу» естественно передаёт придание престолу прочности и устойчивости.
- source_word: אֶת כִּסֵּא
  choice: престол
  rationale: В царском контексте כִּסֵּא непосредственно означает престол; показатель прямого дополнения אֶת отдельно не переводится.
- source_word: מַמְלַכְתּוֹ
  choice: его царства
  rationale: Существительное обозначает царство или царскую власть; родительное сочетание «престол его царства» точно сохраняет структуру и смысл оригинала.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Устойчивое выражение обозначает непреходящую длительность; «навеки» ясно и торжественно передаёт силу данного обещания.
theological_decisions:
- issue: Передавать ли בַּיִת буквально как «дом» или истолковывающе как «храм»
  choice: дом
  alternative: храм
  rationale: Непосредственно речь идёт о святилище, которое построит потомок Давида, однако вся глава строится на смысловом взаимодействии дома-храма и дома-династии. «Дом» сохраняет эту литературную и богословскую многозначность.
- issue: Сила выражения עַד עוֹלָם в обетовании Давиду
  choice: навеки
  alternative: на долгое время
  rationale: В контексте заветного обещания выражение несёт смысл непреходящей длительности. Ослабление до неопределённо долгого срока неоправданно уменьшило бы силу исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Божественные местоимения написаны с прописной буквы согласно распространённой русской библейской традиции. Порядок слов слегка адаптирован ради естественности, при этом образность и синтаксические связи оригинала сохранены.
