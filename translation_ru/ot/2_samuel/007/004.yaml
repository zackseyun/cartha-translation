lexical_decisions:
- source_word: וַיְהִי
  choice: Но
  rationale: Первая повествовательная форма продвигает рассказ, а союз «но» естественно передаёт контраст с предварительным одобрением Нафана в предыдущем стихе.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Естественное русское соответствие временной фразе, сохраняющее указание на конкретную ночь.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: было слово Яхве
  rationale: Сохранена традиционная пророческая формула и ключевое слово «слово»; русский порядок слов делает выражение понятным без буквального повторения «и было».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל נָתָן
  choice: к Нафану
  rationale: Предлог אֶל обозначает адресата откровения; имя נָתָן передано в принятой русской библейской форме «Нафан».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь следующего стиха; в современном русском эту функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формула «было слово Яхве» намеренно сохраняет пророческий оттенок; двоеточие естественно вводит последующую речь.
