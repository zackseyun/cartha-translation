source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: ru
  text: 'И да возвеличится имя Твоё навеки, чтобы говорили[a]: «Яхве Воинств — Бог над Израилем», и да будет утверждён пред Тобой дом раба Твоего Давида[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говоря»; оборот может обозначать как цель, так и результат: «так что будут говорить».'
    reason: Сохраняется смысловая широта еврейского לֵאמֹר и поясняется неопределённый субъект русского «говорили».
  - marker: b
    text: «Дом» здесь означает не только жилище, но прежде всего семью, потомство и царскую династию Давида.
    reason: Культурно-контекстуальное пояснение династического значения слова בַּיִת в 2 Царств 7.
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: И да возвеличится
  rationale: Форма выражает пожелание в контексте молитвы. «Да возвеличится» естественно передаёт мысль о том, что имя Бога будет явлено великим и прославлено, не предполагая изменения самого Бога.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохранён еврейский образ; «имя» здесь включает славу, известность и явленную людям сущность Бога, но перевод не сужает смысл до одного из этих оттенков.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткое и естественное обозначение непрекращающейся длительности в возвышенной современной русской речи.
- source_word: לֵאמֹר
  choice: чтобы говорили
  rationale: Инфинитив вводит следующую далее исповедальную формулу. Неопределённо-личная конструкция по-русски яснее буквального «говоря» и сохраняет целевое или результативное отношение без указания конкретных говорящих.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יְהוָה передано транслитерацией «Яхве», а צְבָאוֹת — словом «Воинств», сохраняющим широту традиционного божественного титула и не ограничивающим его только земными армиями.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: Бог над Израилем
  rationale: Предлог עַל здесь естественно выражает власть и верховенство; «над Израилем» сохраняет этот оттенок.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: и ... дом раба Твоего Давида
  rationale: Сохранено слово «дом», важное для словесной связи внутри 2 Царств 7; в данном контексте оно обозначает также семью, потомство и царскую династию Давида.
- source_word: יִהְיֶה נָכוֹן
  choice: да будет утверждён
  rationale: Сочетание выражает прочность, устойчивость и установленность. Молитвенное «да будет» согласуется с волитивным характером всего высказывания.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Прямой и естественный перевод, сохраняющий смысл пребывания в Божьем присутствии и под Его благоволением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул. Транслитерация сохраняет это различие.
- issue: Значение слова «дом» в обетовании Давиду
  choice: Сохранить «дом» в основном тексте и пояснить династический смысл в сноске
  alternative: династия; род
  rationale: Так сохраняются лексическая форма оригинала и значимая для главы игра смыслов между зданием и царским родом, при этом сноска предотвращает ошибочное понимание только как физического строения.
- issue: Модальность заключительной части стиха
  choice: да будет утверждён
  alternative: будет утверждён
  rationale: Контекст молитвы и параллелизм с וְיִגְדַּל допускают понимание как пожелания. Перевод сохраняет молитвенную направленность, хотя форма также может быть понята как уверенное утверждение результата.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формы «навеки», «пред Тобой» и конструкция «да…» сохраняют достоинство библейской речи, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы как издательская норма русского религиозного текста.
