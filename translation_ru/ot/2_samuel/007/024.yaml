  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: ru
  text: Ты утвердил для Себя Свой народ, Израиль, чтобы он навеки был Твоим народом, и Ты, Яхве[a], стал их Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст содержит личное имя Бога יהוה (ЙХВХ), традиционно передаваемое также как «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «был их Богом». Еврейская конструкция допускает описание как установившихся, так и уже существующих отношений; «стал» здесь соответствует контексту установления завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: утвердил
  rationale: Форма глагола כון передаёт придание прочности и устойчивого положения; «утвердил» сохраняет как образ прочности, так и контекст установления заветных отношений.
- source_word: לְךָ ... לְךָ לְעָם
  choice: для Себя ... чтобы он ... был Твоим народом
  rationale: Повтор предлога ל выражает принадлежность Израиля Яхве и его предназначение быть Его народом; русский оборот передаёт этот повтор естественно и ясно.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Свой народ, Израиль
  rationale: Приложение «Израиль» поясняет, какой именно народ назван принадлежащим Богу; запятая делает эту структуру ясной по-русски.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткий современный эквивалент, выражающий непреходящую длительность заветного положения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: стал их Богом
  rationale: Конструкция היה с ל может обозначать вступление в отношение или пребывание в нём. В контексте утверждения Израиля Божьим народом «стал их Богом» подчёркивает установление взаимных заветных отношений, не исключая статального понимания.
theological_decisions:
- issue: Взаимная формула завета
  choice: «чтобы он навеки был Твоим народом ... стал их Богом»
  alternative: «чтобы он навеки был Твоим народом ... был их Богом»
  rationale: 'Перевод сохраняет взаимность заветной формулы: Израиль — народ Яхве, а Яхве — Бог Израиля. Выбор «стал» согласуется с динамикой данного контекста, но грамматика допускает и статальное «был», поэтому альтернатива отмечена в сноске.'
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное Божье имя, присутствующее в еврейском тексте, тогда как «Господь» представляет традиционную замену имени титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией; повтор «народ» сохранён ради заветной формулы и близости к еврейской структуре.
