base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: ru
  text: И теперь, благоволи благословить дом[b] раба Твоего, чтобы он вечно пребывал пред Тобой. Ибо Ты, Владыка Яхве[a], сказал, и Твоим благословением дом раба Твоего будет благословен вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «Адонай Яхве»: сочетание титула «Владыка» с личным именем Бога — Яхве.'
    reason: alternative_reading
  - marker: b
    text: «Дом» здесь может означать также род или династию Давида.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: В данном завершении молитвы выражение вводит итоговую просьбу; «итак» естественно передаёт логический переход, сохраняя связь с предшествующим.
- source_word: הוֹאֵל וּבָרֵךְ
  choice: благоволи благословить
  rationale: הוֹאֵל выражает готовность или милостивое согласие. Русское молитвенное «благоволи» кратко и естественно передаёт почтительную просьбу, не превращая её в простой императив.
- source_word: בֵּית עַבְדְּךָ
  choice: дом раба Твоего
  rationale: Слово בַּיִת здесь охватывает дом, род и династию Давида. Буквальное «дом» сохраняет намеренную многозначность и словесную связь с темой дома во всей главе.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: чтобы он вечно пребывал пред Тобой
  rationale: Оборот буквально означает «чтобы быть вечно пред Тобой». «Пребывал» естественно выражает продолжающееся существование, не добавляя идеи утверждения, которой нет в глаголе היה.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: אֲדֹנָי передано как титул «Владыка», а יהוה — как личное имя «Яхве»; это позволяет ясно сохранить сочетание титула и имени без неестественного повтора «Господь Господь».
- source_word: דִּבַּרְתָּ
  choice: сказал это
  rationale: Совершенный вид передаёт уже произнесённое Божье обещание. Местоимение «это» естественно отсылает к предшествующим словам обещания.
- source_word: וּמִבִּרְכָתְךָ יְבֹרַךְ
  choice: и по Твоему благословению ... будет благословен
  rationale: 'Предлог מִן указывает на источник или основание: благословенное состояние дома исходит от Божьего благословения. Пассивная форма сохранена.'
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт неограниченную длительность обещанного благословения и соответствует возвышенному, но понятному регистру молитвы.
theological_decisions:
- issue: Передача имени יהוה в сочетании אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Сочетание в еврейском тексте содержит титул и собственное имя. Выбранный вариант сохраняет оба элемента и избегает смешения יהוה с нарицательным «Бог».
- issue: Следует ли явно передать בַּיִת как династию
  choice: дом раба Твоего
  alternative: династия раба Твоего; род раба Твоего
  rationale: 'Контекст относится к династии Давида, однако «дом» намеренно сохраняет смысловой диапазон еврейского слова и ключевую для главы игру значений: Давид намеревался построить дом Богу, а Бог обещает устроить дом Давиду.'
- issue: Степень категоричности заключительного утверждения
  choice: будет благословен вовеки
  alternative: да будет благословен вовеки
  rationale: Еврейский имперфект יְבֹרַךְ после ссылки на Божье слово естественно выражает уверенность в будущем результате; перевод сохраняет это как уверенное следствие Божьего благословения, а не повторную просьбу.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным оттенком. Формы «Твоего», «Тобой», «Твоему» написаны с прописной буквы как традиционное уважительное обращение к Богу. «Благоволи» и «пред Тобой» сохраняют достоинство молитвы, оставаясь понятными современному читателю.
