  rationale: Правка минимальна и не меняет смысла. «И теперь» ближе к וְעַתָּה, «ибо» передаёт כִּי в обосновании просьбы, а «Твоим благословением» воспроизводит инструментально-источниковый оттенок מִן. Удалено невыраженное в оригинале «это»; сохранены молитвенный регистр, двусмысленность «дома» и личное имя Яхве.
