base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: ru
  text: '«Пойди и скажи Моему слуге Давиду: „Так говорит Яхве: ты ли построишь Мне дом, чтобы Я обитал в нём?[a]“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты ли тот, кто построит Мне дом, чтобы Я обитал в нём?» Еврейский вопрос подчёркивает именно личность Давида и имеет риторический характер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Пойди и скажи
  rationale: Повелительное наклонение לֵךְ и следующий за ним перфект с последовательным וְ переданы двумя связанными повелениями; эта форма естественна для современного литературного русского языка.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: Моему слуге Давиду
  rationale: עֶבֶד в царском и заветном контексте имеет почётное значение «слуга». Имя «Давиду» естественно выступает приложением без повторения предлога.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная пророческая формула; личное имя יהוה передано транслитерацией «Яхве».
- source_word: הַאַתָּה תִּבְנֶה
  choice: ты ли построишь
  rationale: Сочетание вопросительной частицы с отдельным местоимением создаёт эмфатический, риторический вопрос. Частица «ли» сохраняет акцент на личности Давида, не превращая вопрос в простое уточнение будущего действия.
- source_word: לִי בַיִת
  choice: Мне дом
  rationale: Слово בַּיִת передано как «дом», а не «храм», чтобы сохранить его непосредственное значение и важную для главы игру значений между домом для Бога и домом Давида.
- source_word: לְשִׁבְתִּי
  choice: чтобы Я обитал в нём
  rationale: Инфинитив с суффиксом первого лица выражает цель. Глагол «обитать» соответствует возвышенному контексту Божьего пребывания, а «в нём» естественно указывает на дом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохранено как имя, а не заменено титулом.
- issue: Значение בַּיִת
  choice: дом
  alternative: храм
  rationale: Хотя речь идёт о святилище, «дом» сохраняет лексику оригинала и богословски значимую игру слов в дальнейшей части главы.
- issue: Сила вопроса הַאַתָּה תִּבְנֶה
  choice: ты ли построишь
  alternative: неужели ты построишь / разве ты построишь
  rationale: Формулировка сохраняет эмфатический вопрос и намеренно не уточняет сверх текста, выражает ли он главным образом удивление, отрицательное ожидание или выделение Давида как предполагаемого строителя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим регистром. Синтаксис сделан естественным, при этом сохранены повтор «дом» и эмфатическая неоднозначность вопроса.
