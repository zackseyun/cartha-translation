  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: ru
  text: И ныне, Яхве, Боже, утверди навеки слово[a], которое Ты изрёк о Твоём слуге и о его доме[b], и сделай, как Ты изрёк.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещание».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «дом» означает царский дом Давида — его род и династию, а не только его домашнее хозяйство.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהִים — обычным титулом «Бог»; вместе они образуют естественное русское обращение.
- source_word: הַדָּבָר
  choice: слово
  rationale: Сохраняет прямое значение דָּבָר и повтор с глаголом «изрёк»; подразумеваемое значение обещания указано в сноске, а не внесено в основной текст.
- source_word: דִּבַּרְתָּ
  choice: Ты изрёк
  rationale: Передаёт совершившуюся речь Бога и соответствует возвышенному, но понятному регистру молитвы. Написание местоимения с прописной буквы принято как русская форма почтительного обращения к Богу.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: о Твоём рабе и о его доме
  rationale: Предлог עַל здесь обозначает предмет речи. «Раб» точно сохраняет самоумаление Давида перед Богом, а «дом» удерживает ключевую метафору главы.
- source_word: הָקֵם
  choice: утверди
  rationale: Hiphil от קום выражает просьбу сделать сказанное твёрдым и непреложным; «утверди слово» естественно по-русски и не меняет объект действия.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт идею бессрочной, непреходящей длительности.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: и сделай, как Ты изрёк
  rationale: Сохраняет лаконичный императив и намеренный повтор корня דבר, не подменяя общее «сделай» более толковательным «исполни».
theological_decisions:
- issue: Передавать ли הַדָּבָר как «слово» или как «обещание»
  choice: слово
  alternative: обещание
  rationale: Контекст имеет характер обещания и завета, однако еврейский текст буквально говорит о «слове». Основной текст сохраняет эту формулировку, а смысловая альтернатива вынесена в сноску.
- issue: Раскрывать ли בֵּיתוֹ непосредственно как «династия»
  choice: его дом
  alternative: его царский дом, то есть династия
  rationale: В главе речь идёт о потомках и династии Давида, но образ «дома» является ключевой словесной связью текста. Поэтому он сохранён, а значение пояснено в сноске.
- issue: Передача עַבְדְּךָ в молитвенном обращении
  choice: Твоём рабе
  alternative: Твоём слуге
  rationale: «Раб» точнее сохраняет традиционный библейский язык самоумаления и полного подчинения Богу, не добавляя учения о социальном рабстве.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Формы «ныне» и «изрёк» сохраняют возвышенный тон, оставаясь общеупотребительными и ясными; синтаксис близок к еврейскому оригиналу без неестественной кальки.
