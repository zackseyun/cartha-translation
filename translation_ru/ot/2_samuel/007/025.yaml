  - severity: medium
    issue: «Рабе» для עַבְדְּךָ
    rationale: В этом контексте עֶבֶד — обычное самоназвание молящегося как преданного служителя. «Твоём слуге» передаёт это значение естественнее для современного русского и не добавляет социально-правовой оттенок.
  - severity: low
    issue: Формулировка пояснения к «дому»
    rationale: «А не только домашних» эллиптично и может быть понято как обозначение людей. Следует прямо указать, что не имеется в виду лишь домашнее хозяйство.
