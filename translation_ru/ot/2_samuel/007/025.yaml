  source_fidelity: 'Основной смысл передан точно: просьба утвердить навеки сказанное о Давиде и его доме и поступить согласно сказанному. Однако в современном литературном русском «слуга» в данном молитвенном контексте естественнее передаёт עַבְדְּךָ, не утрачивая выражения смиренного служения; «раб» здесь излишне сужает значение до современно воспринимаемого социального статуса. Обращение «Яхве, Боже» с запятой яснее оформляет два еврейских обращения, יהוה и אֱלֹהִים.'
  naturalness: «Яхве Бог» без запятой по-русски читается скорее как составное именование, чем как непосредственное обращение. Форма «Яхве, Боже» естественна и сохраняет торжественный молитвенный регистр. «Ныне», «утверди» и «изрёк» допустимы в современном литературном библейском стиле.
  terminology: «Яхве» последовательно передаёт тетраграмматон; «слово», «утверди» и «дом» сохраняют ключевые еврейские выражения. Сноска о «доме» должна говорить о династическом значении без неточного противопоставления «домашним».
