  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: ru
  text: И кто подобен Твоему народу — Израилю, единственному народу на земле, ради которого Бог пошёл, чтобы искупить его Себе в народ, создать Себе имя и совершить для вас великие и грозные дела[a] ради Твоей земли, перед Твоим народом, который Ты искупил Себе из Египта[b], — от народов и их богов?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великие и внушающие трепет дела». Еврейское слово может обозначать то, что вызывает благоговение, ужас или страх.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительные слова на еврейском языке синтаксически трудны. Возможны также переводы: «из Египта — народы и его бога» или «из Египта — народы и богов».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: И кто подобен Твоему народу — Израилю
  rationale: Сохраняет риторический вопрос о несравненности и подчёркнуто отождествляет Божий народ с Израилем; тире естественно передаёт приложение в современном русском языке.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: единственному народу на земле
  rationale: Передаёт контекстуальный акцент на уникальности Израиля среди народов, а не только числительное «один».
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: ради которого Бог пошёл
  rationale: Несмотря на морфологически множественную форму אֱלֹהִים, контекст указывает на Бога Израиля; конкретный глагол «пошёл» сохранён, а конструкция «ради которого» делает связь с предшествующим словом естественной по-русски.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: чтобы искупить его Себе в народ
  rationale: «Искупить» сохраняет значение פדה и библейский мотив избавления; «Себе в народ» передаёт как принадлежность Богу, так и результат действия.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: создать Себе имя
  rationale: Передаёт идиому об обретении известности и славы без добавления отсутствующего в тексте толкования.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: и совершить для вас
  rationale: Прямо сохраняет масоретское לָכֶם, обращённое к Израилю во множественном числе, не исправляя его ради синтаксического выравнивания.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: великие и грозные дела
  rationale: Естественная русская формулировка передаёт величие деяний и вызываемые ими страх и трепет; возможный оттенок благоговейного изумления отмечен в сноске.
- source_word: לְאַרְצְךָ
  choice: ради Твоей земли
  rationale: Предлог ל допускает значение направленности или пользы; «ради» естественно связывает Божьи деяния с землёй Израиля.
- source_word: מִפְּנֵי עַמְּךָ
  choice: перед Твоим народом
  rationale: Сохраняет пространственный образ происходящего впереди народа, не разворачивая его в толкование «изгоняя».
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: который Ты искупил Себе из Египта
  rationale: Повтор פדה переведён последовательно словом «искупил»; «Себе» сохраняет идею принадлежности, выраженную לְּךָ.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: от народов и их богов
  rationale: Основной текст следует контекстуально вероятному пониманию заключительных слов как указания на народы и связанных с ними богов, но синтаксическая трудность отражена в сноске.
theological_decisions:
- issue: Число и референт אֱלֹהִים
  choice: «Бог» в единственном числе, то есть Бог Израиля
  alternative: «боги» во множественном числе
  rationale: Контекст молитвы говорит об уникальном действии Бога Израиля ради Своего народа; множественный перевод исказил бы смысл данного места.
- issue: Синтаксически трудное окончание גּוֹיִם וֵאלֹהָיו
  choice: «от народов и их богов»
  alternative: «из Египта — народы и его бога» или «из Египта — народы и богов»
  rationale: Еврейская формулировка сжата и допускает разные способы синтаксического членения. Основной вариант согласуется с контекстом избавления Израиля и устранения народов перед ним, однако неоднозначность не скрыта и вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис по возможности сохраняет протяжённую риторическую структуру оригинала, но приложение «Израилю» оформлено тире для ясности.
