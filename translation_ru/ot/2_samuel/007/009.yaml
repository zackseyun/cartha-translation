base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: ru
  text: Я был с тобой, куда бы ты ни шёл, и истребил перед тобой всех твоих врагов. Я сделаю твоё имя великим[a], как имя великих людей на земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сделал твоё имя великим». Еврейская форма допускает прошедшее время, однако в контексте её можно понимать как обещание.'
    reason: temporal_ambiguity
  - marker: b
    text: 'Или: «как слава великих людей на земле». Здесь «имя» также означает известность или славу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Я был с тобой
  rationale: Простое прошедшее время естественно продолжает рассказ Господа о Его прежних действиях; выражение сохраняет оттенки присутствия и поддержки.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: куда бы ты ни шёл
  rationale: Естественная русская передача еврейского оборота со значением всеохватности.
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ מִפָּנֶיךָ
  choice: истребил всех твоих врагов у тебя на пути
  rationale: В данном контексте כרת означает устранить или уничтожить; оборот מִפָּנֶיךָ передаёт удаление врагов перед Давидом, с его пути.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם גָּדוֹל
  choice: Я сделаю твоё имя великим
  rationale: Будущее время соответствует переходу от прежних деяний к обещанию. Эта русская формулировка сохраняет библейский образ имени как известности и славы, одновременно естественно передавая значение конструкции с לְךָ.
- source_word: כְּשֵׁם הַגְּדֹלִים אֲשֶׁר בָּאָרֶץ
  choice: подобным имени великих людей на земле
  rationale: Повтор слова «имя» сохраняет еврейский параллелизм; «великие люди» естественно обозначает прославленных и влиятельных людей, а «на земле» отражает широкий смысл אָרֶץ.
theological_decisions:
- issue: Временное значение וְעָשִׂיתִי в контексте Божьей речи
  choice: 'Будущее: «Я сделаю твоё имя великим»'
  alternative: 'Прошедшее: «Я сделал твоё имя великим»'
  rationale: Хотя форма является перфектом, развитие речи от воспоминания о прошлых деяниях к обетованию и параллель в 1 Пар. 17:8 поддерживают будущее значение, не устраняя при этом грамматическую неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Библейская метафора «имя» сохранена; менее естественное буквальное «от лица твоего» передано по смыслу как «у тебя на пути».
