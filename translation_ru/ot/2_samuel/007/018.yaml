source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: ru
  text: 'Тогда царь Давид вошёл, сел перед Яхве и сказал: «Кто я, Владыка Яхве, и что такое мой дом[a], что Ты привёл меня так далеко?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя семья», «мой род». Здесь «дом» может также подразумевать род и зарождающуюся династию Давида; это слово перекликается с повторяющейся в главе темой «дома».'
    reason: Сохраняет важное многозначное слово и поясняет его семейно-династический смысл.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: Передаёт конкретное движение внутрь, не уточняя место, которое в стихе не названо.
- source_word: וַיֵּשֶׁב
  choice: сел
  rationale: В данном повествовательном контексте естественнее физическое значение глагола ישׁב, а не «жил» или «оставался».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Кратко и непосредственно передаёт пребывание в присутствии Яхве.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняет составное обращение: титул אֲדֹנָי и личное Божье имя יהוה, не создавая неестественного сочетания «Господь Господь».'
- source_word: מִי אָנֹכִי
  choice: Кто я
  rationale: Естественная русская формула смиренного риторического вопроса.
- source_word: וּמִי בֵיתִי
  choice: и что такое мой дом
  rationale: Еврейское מִי буквально означает «кто», но по-русски применительно к дому естественно «что такое»; слово «дом» сохранено ради ключевой игры смыслов всей главы.
- source_word: הֲבִיאֹתַנִי
  choice: Ты привёл меня
  rationale: Прямо передаёт каузативную форму глагола בוא — «привести».
- source_word: עַד הֲלֹם
  choice: к этому
  rationale: Передаёт достижение нынешнего положения, не сводя выражение исключительно ко времени или пространству.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и отличает его от титула אֲדֹנָי.
- issue: Значение выражения «мой дом»
  choice: Сохранить «мой дом» с пояснением
  alternative: моя семья / мои домашние / моя династия
  rationale: В 2 Царств 7 слово «дом» связывает храм, семью и обещанную Давиду династию. Выбор одного уточнённого значения устранил бы намеренную смысловую многослойность.
- issue: Смысл עַד הֲלֹם
  choice: к этому
  alternative: доныне / так далеко / до такого положения
  rationale: Фраза допускает пространственно-временной образ достигнутой точки и указание на нынешнее положение Давида; нейтральная формулировка не сужает этот смысл.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным синтаксисом. Местоимение «Ты» в обращении к Богу написано с прописной буквы как устойчивая русская почтительная норма. Не названное в оригинале место входа намеренно не уточняется.
