  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: ru
  text: Поэтому Ты велик, Владыка Яхве[a], ибо нет подобного Тебе и нет Бога, кроме Тебя[b], согласно всему, что мы слышали своими ушами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Владыка Яхве»; «Яхве» — личное имя Бога, записываемое четырьмя согласными יהוה.'
    reason: cultural_note
  - marker: b
    text: 'Или: «и нет Бога помимо Тебя»; возможна также передача: «и нет иного бога, кроме Тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассказа о Божьих деяниях и сохраняет логическую связь молитвы.
- source_word: גָּדַלְתָּ
  choice: Ты велик
  rationale: Перфект глагола גדל здесь естественно понимать как утверждение признанного или явленного величия; краткая русская формулировка соответствует славословному контексту.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» сохраняет личное имя יהוה и позволяет избежать неестественного сочетания «Господь Господь».
- source_word: כִּי אֵין כָּמוֹךָ
  choice: нет подобного Тебе
  rationale: כִּי вводит основание утверждения; в русском двоеточие естественно выражает эту пояснительную связь. Оборот сохраняет идею несравненности.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: и нет Бога, кроме Тебя
  rationale: 'זוּלָתֶךָ выражает исключение: «кроме Тебя», «помимо Тебя». Написание «Бога» с прописной буквы соответствует прямому исповеданию единственного Бога.'
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: таково всё, что мы слышали своими ушами
  rationale: Передаёт соотнесённость исповедания со всем услышанным и сохраняет подчёркнутый еврейский оборот «своими ушами», не делая русский синтаксис чрезмерно буквальным.
theological_decisions:
- issue: Передача составного титула אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбор различает титул אֲדֹנָי и собственное имя יהוה, не подменяя имя общим титулом и не создавая повтора «Господь Господь».
- issue: Исключительность Бога в אֵין אֱלֹהִים זוּלָתֶךָ
  choice: нет Бога, кроме Тебя
  alternative: нет иного бога, кроме Тебя; нет Бога помимо Тебя
  rationale: Формулировка прямо сохраняет монотеистическое исповедание текста, не добавляя позднейших философских или конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного славословия. Синтаксис слегка приподнят, но понятен обычному читателю; сохранены обращение на «Ты» и эмфатический оборот «своими ушами».
