lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Давиду сообщили
  rationale: Безличная конструкция естественно передаёт древнееврейскую пассивную форму и сохраняет Давида в роли адресата сообщения.
- source_word: אֵת אֲשֶׁר
  choice: что
  rationale: Вводит содержание сообщения; «что» естественно и точно связывает его с глаголом «сделала».
- source_word: עָשְׂתָה
  choice: сделала
  rationale: Форма перфекта обозначает уже совершённое действие; русский вид передаёт его завершённость без необходимости в отдельной форме предпрошедшего времени.
- source_word: רִצְפָּה
  choice: Рицпа
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בַת אַיָּה
  choice: дочь Айи
  rationale: Прямо передаёт древнееврейское указание на происхождение; родительный падеж соответствует русской норме.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: наложница Саула
  rationale: Точно передаёт социальный статус и отношение принадлежности в сочетании-конструкте, не прибегая к эвфемизму.
