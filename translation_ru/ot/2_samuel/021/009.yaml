    issue: Основной вариант «повесили их» слишком узко определяет способ действия, обозначенный וַיֹּקִיעֻם.
    rationale: Глагол יקע в этом контексте связан с публичной казнью/выставлением, но не позволяет надёжно установить именно повешение в современном узком смысле. Нейтральное «казнили» сохраняет смысл повествования, а варианты способа следует оставить в сноске.
  - severity: medium
