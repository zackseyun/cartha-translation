base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: ru
  text: Он предал их в руки гаваонитян, и те казнили их[a] на горе перед Яхве. Все семеро пали вместе. Их предали смерти в первые дни жатвы, в начале жатвы ячменя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «повесили их», «пронзили их» или «посадили их на кол», «публично выставили их». Еврейский глагол относится к публичной казни или выставлению, но точный способ неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: предал их в руки
  rationale: Сочетание נתן с בְּיַד означает передачу во власть другой стороны. Русское «предал в руки» естественно передаёт этот смысл и сохраняет образ еврейской идиомы.
- source_word: הַגִּבְעֹנִים
  choice: гаваонитян
  rationale: Традиционная и узнаваемая русская передача названия этого народа.
- source_word: וַיֹּקִיעֻם
  choice: повесили их
  rationale: Глагол обозначает публичное умерщвление или выставление тела посредством подвешивания либо пронзания. В основном тексте выбран наиболее естественный русский эквивалент, а неопределённость способа сохранена в сноске.
- source_word: בָּהָר
  choice: на горе
  rationale: Передаёт определённую форму единственного числа без превращения её в более широкое обозначение горной местности.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет пространственно-судебную и заветную окраску выражения, не уточняя её сверх текста.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: Все семеро пали вместе
  rationale: Сохраняет еврейский образ падения в смерти и ясно передаёт совместность участи семерых.
- source_word: הֻמְתוּ
  choice: их умертвили
  rationale: 'Хофал глагола מות выражает причинительный пассив: они были преданы смерти. Русская безличная конструкция звучит естественно и не добавляет нового деятеля.'
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: в первые дни жатвы
  rationale: Прямо и естественно обозначает ранний период жатвы.
- source_word: תחלת קְצִיר שְׂעֹרִים
  choice: в начале жатвы ячменя
  rationale: Передаёт уточняющее временное выражение и сохраняет повтор слова «жатва».
theological_decisions:
- issue: Точный способ казни в глаголе יקע
  choice: 'В основном тексте: «повесили их»; в сноске сохранены варианты «посадили на кол» и «выставили на всеобщее обозрение».'
  alternative: «посадили их на кол» или «выставили их на всеобщее обозрение»
  rationale: Еврейский глагол указывает на публичную казнь или выставление тел, но не позволяет уверенно определить конкретный способ. Перевод не должен снимать эту неоднозначность.
- issue: Значение לִפְנֵי יְהוָה
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: Буквальная формулировка сохраняет возможную культовую, заветную и судебную значимость события, не выбирая одну из них.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Выражение «предал в руки» сохраняет библейскую идиому, оставаясь понятным; архаические обороты по возможности исключены. Божественное имя передано как «Яхве» согласно установке проекта.
