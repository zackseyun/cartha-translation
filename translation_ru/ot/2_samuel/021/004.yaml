  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ הַ/גִּבְעֹנִ֗ים אֵֽין ל/י כֶּ֤סֶף וְ/זָהָב֙ עִם שָׁא֣וּל וְ/עִם בֵּית֔/וֹ וְ/אֵֽין לָ֥/נוּ אִ֖ישׁ לְ/הָמִ֣ית בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֛אמֶר מָֽה אַתֶּ֥ם אֹמְרִ֖ים אֶעֱשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: ru
  text: 'Гаваонитяне ответили ему: «У нас нет требований к Саулу и его дому ни на серебро, ни на золото[a], и не нам предавать смерти кого-либо в Израиле[b]». Тогда он спросил: «Что же, по-вашему, мне для вас сделать?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Между нами и Саулом и его домом дело не в серебре и золоте». Еврейское выражение идиоматично и, вероятно, относится к денежному возмещению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и у нас нет права предать смерти кого-либо в Израиле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: У нас нет требований к Саулу и его дому ни на серебро, ни на золото
  rationale: Буквальная конструкция «нет у меня серебра и золота с Саулом» в данном контексте идиоматична и относится к денежному возмещению. Русское «нет требований… ни на серебро, ни на золото» передаёт юридико-компенсационный смысл, не утверждая более определённо, чем позволяет текст, что речь идёт именно об отказе от уже предложенного выкупа. Единственное לִי передано множественным числом согласно коллективному ответу гаваонитян.
- source_word: עִם
  choice: к
  rationale: Предлог обозначает сторону, к которой относилось бы требование. В русском сочетание «требования к Саулу и его дому» естественно передаёт этот смысл; буквальное «с» здесь было бы неясно.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: и не нам предавать смерти кого-либо в Израиле
  rationale: Эллиптическая фраза, вероятнее всего, говорит не об отсутствии человека, которого можно убить, а об отсутствии у гаваонитян права или полномочия казнить израильтянина. Оборот «не нам» сохраняет некоторую недосказанность оригинала и не сводит её исключительно к формально-правовой формулировке.
- source_word: אִישׁ
  choice: кого-либо
  rationale: В контексте слово употреблено обобщённо и обозначает любого отдельного человека. «Кого-либо» звучит по-русски естественно и не добавляет ненужного акцента на поле.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: Что же, по-вашему, мне для вас сделать?
  rationale: Сжатая еврейская конструкция представляет просьбу назвать условия. «По-вашему» передаёт אַתֶּם אֹמְרִים, а инфинитивный оборот «мне… сделать» естественно выражает подразумеваемую волю или долженствование, не превращая реплику в простое обещание будущего действия.
theological_decisions:
- issue: Смысл слов гаваонитян о предании смерти человека в Израиле
  choice: Сохранить идиоматическое «не нам», подразумевающее отсутствие права или полномочия
  alternative: 'Передать прямо: «у нас нет права предать смерти ни одного израильтянина»'
  rationale: Контекст поддерживает правовой смысл, однако еврейский текст не называет «право» явно. Выбранная формулировка сохраняет эту смысловую напряжённость и не приписывает гаваонитянам более точного юридического тезиса, чем выражен в оригинале.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный регистр. «Гаваонитяне» соответствует принятой библейской форме. Выражения «требования… ни на серебро, ни на золото» и «не нам предавать смерти» сочетают ясность с сохранением правовой и идиоматической неоднозначности еврейского текста.
