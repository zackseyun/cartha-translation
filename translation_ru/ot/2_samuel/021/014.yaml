base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: ru
  text: Они похоронили кости Саула и его сына Ионафана в земле Вениамина, в Целе, в гробнице Киса, отца Саула. Они исполнили всё, что повелел царь, и после этого Бог внял мольбе о земле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог ответил на молитву о земле»; также возможно: «Бог позволил умолить Себя о земле». Еврейский глагол подразумевает благосклонный ответ на мольбу.'
    reason: Лексическая неоднозначность редкой конструкции с нифалем עתר и дополнением לָאָרֶץ.
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Они похоронили
  rationale: Последовательная повествовательная форма глагола קבר обозначает совершённое погребение; начальный союз опущен ради естественного русского повествования.
- source_word: עַצְמוֹת שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: кости Саула и его сына Ионафана
  rationale: Сохранено конкретное значение «кости»; перестановка определения даёт ясную и естественную русскую формулировку и однозначно связывает Ионафана с Саулом.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: в земле Вениамина
  rationale: Передаёт явно названную территорию колена Вениамина, не сокращая выражение до одного имени.
- source_word: בְּצֵלָע
  choice: в Целе
  rationale: Название места передано традиционной русской библейской формой «Цела» с требуемым предложным падежом.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: в гробнице Киса, отца Саула
  rationale: קבר в контексте семейного места погребения естественно передаётся как «гробница». Имя «Саула» эксплицирует референт местоименного суффикса и устраняет возможную русскую двусмысленность.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Они исполнили всё, что повелел царь
  rationale: «Исполнили» идиоматично сочетается с царским повелением и сохраняет смысл полного выполнения приказанного.
- source_word: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Бог внял мольбе о земле
  rationale: Нифаль глагола עתר обозначает благосклонный ответ на мольбу или прошение. «Внял мольбе» естественно выражает этот смысл, не добавляя конкретного молящегося и не усиливая результат до «исцелил землю».
- source_word: אַחֲרֵי כֵן
  choice: после этого
  rationale: Точно и естественно передаёт временную последовательность.
theological_decisions:
- issue: Смысл וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Бог внял мольбе о земле
  alternative: Бог ответил на молитву о земле; Бог позволил умолить Себя о земле
  rationale: Сам глагол подразумевает благосклонный ответ на обращённую к Богу мольбу, хотя существительное «мольба» в тексте отдельно не стоит. Выбранная формулировка сохраняет подразумеваемое прошение, но не уточняет его содержание и не вводит отсутствующее в стихе утверждение об «исцелении» земли.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Имена переданы в привычных русских формах. Синтаксис упрощён там, где буквальное следование еврейскому порядку слов создало бы неясность; конкретность слова «кости» и семантика ответа на мольбу сохранены.
