base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: ru
  text: 'И снова была война в Гате. Там был человек огромного роста[a]: на руках и на ногах у него было по шесть пальцев[b], всего двадцать четыре. Он тоже был потомком Рафы[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек меры»; возможно также: «человек необычайных размеров».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пальцев его рук и пальцев его ног — шесть и шесть».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «был рождён Рафе». Возможно, речь идёт о происхождении от Рафы или о принадлежности к рефаимам — народу, который связывали с исполинами.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: война
  rationale: Существительное обозначает войну или военный конфликт в целом; в контексте повторяющихся столкновений «война» точнее, чем единичная «битва».
- source_word: בְּגַת
  choice: в Гате
  rationale: Предлог ב обозначает место; по-русски естественно сказать, что война была «в Гате».
- source_word: אִישׁ מדין
  choice: человек огромного роста
  rationale: Кетив מדין, вероятно, передаёт представление о необычайной величине или размерах человека. Перевод сохраняет смысл, не воспроизводя неясное выражение буквально.
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: на руках и на ногах у него было ... пальцев
  rationale: Русское слово «пальцы» применимо как к рукам, так и к ногам; формулировка ясно передаёт явное разграничение в еврейском тексте.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: по шесть
  rationale: Еврейское повторение числа относится соответственно к пальцам рук и ног; «по шесть» естественно и недвусмысленно передаёт распределительный смысл.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: всего двадцать четыре
  rationale: Фраза подводит итог общему числу пальцев; этот русский оборот передаёт её ясно и естественно.
- source_word: יֻלַּד לְהָרָפָה
  choice: был потомком Рафы
  rationale: Пассивная форма ילד с ל здесь выражает происхождение или принадлежность к роду. «Потомок Рафы» естественно передаёт родословную связь, сохраняя Рафу как имя или родовое обозначение.
theological_decisions:
- issue: Кого обозначает הָרָפָה
  choice: Рафа как имя предка или родовое обозначение
  alternative: исполин; рефаим
  rationale: Контекст указывает прежде всего на происхождение. Транслитерация не отождествляет Рафу безоговорочно ни с отдельным «исполином», ни со всей группой рефаимов и тем самым сохраняет смысловую открытость текста.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранён торжественный библейский тон без архаизмов; неясность выражений «человек меры» и «Рафа» вынесена в примечания.
