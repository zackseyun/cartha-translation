base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: ru
  text: И снова в Гове была война с филистимлянами. Елханан, сын Яаре-Оргима[b], вифлеемлянин, сразил Голиафа из Гефа[a]; древко его копья было как ткацкий брус.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В 1 Пар. 20:5 сказано иначе: Елханан убил Лахми, брата Голиафа. Многие считают, что текст книги Самуила в этом месте сохранился в трудном или повреждённом виде, и согласуют его с Паралипоменоном.'
    reason: textual_variant
  - marker: b
    text: Еврейское имя «Яаре-Оргим» вызывает затруднение; по мнению некоторых, слово «оргим» («ткачи») было случайно повторено из конца стиха.
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: в Гове
  rationale: Предлог בְּ при названии места естественно передаётся как «в»; топоним גוב транслитерирован как «Гов» с русским падежным окончанием.
- source_word: וַיַּךְ
  choice: сразил
  rationale: Глагол נכה в контексте поединка означает нанесение смертельного удара; «сразил» сохраняет воинский оттенок и не добавляет лишних подробностей.
- source_word: יַעְרֵי אֹרְגִים
  choice: Яаре-Оргима
  rationale: Сохранено трудное чтение масоретского текста без молчаливого исправления по параллельному месту.
- source_word: בֵּית הַלַּחְמִי
  choice: вифлеемлянин
  rationale: Форма обозначает жителя или уроженца Вифлеема; традиционное русское образование звучит естественно и точно.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: Голиафа из Гефа
  rationale: Основной текст прямо называет Голиафа-гатянина; выражение «из Гефа» понятнее современному читателю, чем этноним «гефянин».
- source_word: וְעֵץ חֲנִיתוֹ
  choice: древко его копья
  rationale: Буквально עֵץ — «дерево», но применительно к копью речь идёт о его деревянном древке.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: как ткацкий навой
  rationale: מְנוֹר обозначает тяжёлый брус ткацкого станка; «ткацкий навой» передаёт предмет сравнения точнее, чем общее «брус».
theological_decisions:
- issue: Расхождение с рассказом о Давиде и Голиафе в 1 Царств 17 и с параллелью в 1 Паралипоменон 20:5
  choice: 'В основном тексте сохранено масоретское чтение: Елханан сразил Голиафа из Гефа.'
  alternative: Елханан сразил Лахми, брата Голиафа из Гефа.
  rationale: Предоставленный еврейский текст прямо называет Голиафа. Значимое расхождение не следует устранять путём скрытой гармонизации; вариант параллельного места отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис упрощён без потери последовательности еврейского текста. Сноска [a] поставлена после спорного имени Голиафа, а [b] — после образа ткацкого навоя, хотя её содержание относится к имени Яаре-Оргим.
