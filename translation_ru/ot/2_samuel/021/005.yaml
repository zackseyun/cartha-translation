- from: 'Они сказали царю: «Тот человек, который истреблял нас и замыслил против нас уничтожить нас, чтобы нам не осталось места во всех пределах Израиля…»'
  to: 'Они сказали царю: «Тот человек, который погубил нас и строил против нас замыслы, чтобы истребить нас, чтобы нам нигде не осталось места во всей земле Израиля…»'
  rationale: Исправлена русская синтаксическая связь враждебного замысла и его цели; заключительный оборот уточнён так, чтобы передать отсутствие места где-либо на всей израильской территории. Многоточие сохранено, поскольку высказывание продолжается в следующем стихе.
