base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: ru
  text: 'Они сказали царю: «Тот человек, который погубил нас и строил против нас замыслы, чтобы истребить нас, чтобы нам нигде не осталось места во всей земле Израиля…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: истреблял нас
  rationale: Глагол כלה означает доведение до конца, уничтожение. Несовершенный вид «истреблял» естественно передаёт направленные против гаваонитян действия Саула, не утверждая, что уничтожение уже было полным.
- source_word: דִּמָּה לָנוּ
  choice: замыслил против нас
  rationale: В данном контексте דמה выражает враждебный замысел; сочетание с לָנוּ передано как «против нас».
- source_word: נִשְׁמַדְנוּ
  choice: уничтожить нас
  rationale: Нифаль שׁמד обозначает уничтожение или истребление. Русский инфинитив естественно выражает цель в связи с предшествующим «замыслил».
- source_word: מֵהִתְיַצֵּב
  choice: чтобы нам не осталось места
  rationale: Буквально речь идёт о невозможности стоять или утвердиться; в контексте существования народа на территории Израиля эта формулировка естественно передаёт отсутствие возможности сохранять там своё место.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: во всех пределах Израиля
  rationale: גְּבוּל здесь обозначает территориальные пределы, а не только пограничную линию; выражение сохраняет всеохватность כָל.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Указательная русская формулировка естественно отсылает к уже названному Саулу и сохраняет обвинительный тон прямой речи.
