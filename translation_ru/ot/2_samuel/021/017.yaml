base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: ru
  text: 'Но Авишай, сын Церуи, пришёл ему на помощь, поразил филистимлянина и убил его. Тогда воины Давида поклялись ему: «Ты больше не пойдёшь с нами на войну, чтобы не погасить светильник Израиля[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свет Израиля». В еврейском тексте буквально «светильник» — образ жизненно важной роли Давида в жизни и устойчивости народа.'
    reason: Лексический вариант и пояснение метафоры.
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: пришёл ему на помощь
  rationale: Глагол עזר означает «помогать». Выражение естественно передаёт вмешательство Авишая в поединок, не усиливая смысл до «спас».
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Авишай, сын Церуи
  rationale: Имена переданы близко к древнееврейскому звучанию; בן выражено обычным русским обозначением родства.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: поразил филистимлянина
  rationale: נכה здесь означает нанесение удара. Следующий глагол прямо сообщает о смерти, поэтому перевод не дублирует этот результат.
- source_word: וַיְמִיתֵהוּ
  choice: и убил его
  rationale: Порода хифиль глагола מות означает причинение смерти; «убил» — ясный и естественный современный эквивалент.
- source_word: אַנְשֵׁי דָוִד
  choice: воины Давида
  rationale: Буквально «люди Давида»; в военном контексте речь идёт о его бойцах, поэтому «воины» естественно уточняет подразумеваемое значение.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Ты больше не пойдёшь с нами на войну
  rationale: В контексте клятвы форма выражает твёрдый запрет. Будущее время по-русски сохраняет его торжественную категоричность.
- source_word: וְלֹא תְכַבֶּה
  choice: чтобы не погасить
  rationale: Формально сочинённая отрицательная конструкция выражает предотвращаемое последствие. Русское придаточное цели естественно передаёт эту связь.
- source_word: נֵר יִשְׂרָאֵל
  choice: светильник Израиля
  rationale: נֵר буквально означает «светильник». Сохранение конкретного образа не сводит метафору к одному истолкованию.
theological_decisions:
- issue: Метафорическое обозначение Давида как поддерживающего жизнь Израиля света
  choice: светильник Израиля
  alternative: свет Израиля
  rationale: Древнееврейский текст использует конкретный образ светильника. Он сохранён без замены отвлечённым толкованием роли Давида.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис сделан естественным для устной клятвы; древнееврейская метафора сохранена в основном тексте.
