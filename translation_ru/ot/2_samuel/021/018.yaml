base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: ru
  text: После этого снова была война с филистимлянами в Гове. Тогда Сивхай, хушатянин, поразил Сафа[a], одного из потомков Рафы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Саф»; в параллельном месте, 1 Паралипоменон 20:4, это имя имеет форму «Сиппай».
    reason: textual_variant
  - marker: b
    text: 'Или: «одного из потомков великана». Еврейское выражение может указывать либо на человека по имени Рафа, либо на род великанов-рефаимов.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественный временной переход, сохраняющий последовательность повествования.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: снова была война
  rationale: Передаёт повторность, выраженную עוֹד, и при этом звучит естественно по-русски.
- source_word: בְּגֹב
  choice: в Гове
  rationale: Предлог ב обозначает место действия; форма «в Гове» естественна для русского географического названия.
- source_word: פְּלִשְׁתִּים
  choice: филистимлянами
  rationale: Устоявшееся русское обозначение этого народа.
- source_word: אָז
  choice: Тогда
  rationale: Передаёт переход к следующему событию в повествовательной последовательности.
- source_word: הִכָּה
  choice: поразил
  rationale: Сохраняет боевое значение נכה и в данном контексте подразумевает смертельное поражение, не заменяя глагол более узким «убил».
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Сивхай, хушатянин
  rationale: Имя и этническое либо местное определение переданы транслитерацией; приложение обособлено по нормам современного русского языка.
- source_word: סַף
  choice: Саф
  rationale: Передаёт чтение масоретского текста; отличающаяся форма имени в параллельном месте отмечена в сноске.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: одного из потомков Рафы
  rationale: Фраза указывает на принадлежность к роду или потомству; перевод сохраняет имя Рафа и не вносит толкование «великан» в основной текст.
theological_decisions:
- issue: Следует ли понимать הָרָפָה как имя собственное «Рафа» или как обозначение «великан».
  choice: Рафа — имя либо родоначальник линии потомков
  alternative: великан; рефаим
  rationale: В конструкции с יְלִדֵי естественно видеть указание на род или потомство. Основной текст сохраняет формальную неоднозначность исходного выражения, а традиционное понимание как «великан» приводится в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование изложено просто и достойно. Имена переданы близко к еврейской форме, а подлинная неоднозначность выражения о потомках Рафы сохранена посредством сноски.
