    rationale: Для современного литературного русского она звучит неестественно. «Искал лица Яхве» буквально передаёт еврейскую идиому и лучше согласуется со сноской.
  - severity: low
    issue: Сноска a привязана к имени, а не к выражению «искал лица»
    rationale: Сноска поясняет именно еврейскую идиому בִּקֵּשׁ אֶת־פְּנֵי, поэтому её следует поставить после всего словосочетания.
  - severity: low
    issue: «Умертвил» не является современным нейтральным соответствием
    rationale: «Убил» естественно передаёт הֵמִית и не добавляет юридического либо церковнославянского оттенка.
  - severity: low
    issue: «Это из-за» слегка разговорно
    rationale: В торжественном повествовательном контексте «Причина —» звучит литературнее, сохраняя смысл причинного объяснения.
