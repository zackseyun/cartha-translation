base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: ru
  text: 'Во дни Давида три года подряд, год за годом, был голод. Давид искал лица Яхве[a], и Яхве сказал: «Причина — Саул и его дом, виновный в кровопролитии[b], потому что он убил гаваонитян».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратился к Яхве»; буквально: «искал лица Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом кровей» — еврейское выражение о доме, виновном в кровопролитии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: голод
  rationale: В повествовательном контексте слово обозначает тяжёлую и продолжительную нехватку пищи; русское «голод» естественно передаёт это значение.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: три года подряд, год за годом
  rationale: 'Сохранены оба элемента еврейского выражения: продолжительность в три года и подчёркнутая непрерывность бедствия.'
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: взыскал лица Яхве
  rationale: Передан буквальный образ «искать лица», выражающий личное обращение к Богу за ответом; альтернативное функциональное значение пояснено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: из-за Саула и его дома, повинного в пролитии крови
  rationale: Предлог в данном ответе указывает на причину голода; «дом» означает семью или династию, а идиома «дом кровей» — вину за кровопролитие.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: потому что он умертвил гаваонитян
  rationale: Единственное число глагола отсылает к Саулу как главному виновнику; «умертвил» сохраняет торжественный повествовательный регистр.
- source_word: הַגִּבְעֹנִים
  choice: гаваонитян
  rationale: Употреблена традиционная и узнаваемая русская форма названия народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не превращает его в титул.
- issue: Причина голода и выражение о доме Саула
  choice: Голод объясняется виной Саула и его дома за пролитие крови гаваонитян.
  alternative: 'Более буквально: «к Саулу и к дому кровей».'
  rationale: Контекст требует причинного смысла ответа, но формулировка не уточняет сверх текста, каким образом вина распределяется между Саулом и его домом.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным для русского языка, при этом сохранены повтор «три года… год за годом», образ взыскания лица и юридико-нравственный смысл вины за кровь.
