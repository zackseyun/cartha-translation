  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: ru
  text: Он взял оттуда кости Саула и кости его сына Ионафана, и они собрали кости казнённых, чьи тела были выставлены напоказ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может подразумевать повешенных или посаженных на кол; здесь имеются в виду казнённые, чьи тела публично выставили.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: перенёс
  rationale: Каузативная форма от עלה буквально передаёт движение вверх; в данном контексте речь идёт об извлечении и перенесении останков. «Перенёс» естественно по-русски и не навязывает конкретного способа извлечения.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямое и естественное соответствие указательному наречию.
- source_word: עַצְמוֹת
  choice: кости
  rationale: Сохраняет конкретное значение еврейского существительного, не заменяя его более общим словом «останки».
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: его сына Ионафана
  rationale: Ясно выражает, что Ионафан — сын Саула, и звучит естественно в современном русском языке.
- source_word: וַיַּאַסְפוּ
  choice: собрали
  rationale: Сохранено множественное число еврейской глагольной формы; неопределённо-личная русская конструкция не вводит не названных в тексте действующих лиц.
- source_word: הַמּוּקָעִים
  choice: казнённых, чьи тела были выставлены напоказ
  rationale: 'Передаёт несомненные элементы значения: насильственную казнь и публичное выставление тел, не определяя спорный точный способ — повешение или пронзание/посажение на кол.'
