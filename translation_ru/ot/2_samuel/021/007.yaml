  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: ru
  text: Но царь пощадил Мемфивосфея, сына Ионафана, сына Саула, ради клятвы Яхве[a], которая была между ними — между Давидом и Ионафаном, сыном Саула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть клятвы, данной перед Яхве или с призыванием имени Яхве; буквально: «клятвы Яхве».'
    reason: Сноска поясняет наиболее вероятный контекстуальный смысл конструктивного сочетания, не устраняя его формальной неоднозначности.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: пощадил
  rationale: В данном повествовательном контексте глагол означает, что царь не отдал Мемфивосфея на смерть. «Пощадил» точно передаёт конкретное действие и подразумеваемое милосердие.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён данный в еврейском тексте титул; из контекста ясно, что речь идёт о Давиде.
- source_word: מְפִיבֹשֶׁת
  choice: Мемфивосфей
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: сына Ионафана, сына Саула
  rationale: Сохранена повторяющаяся родословная конструкция оригинала, не заменённая пояснением «внука Саула».
- source_word: עַל
  choice: ради
  rationale: Предлог указывает на основание, побудившее царя пощадить Мемфивосфея. «Ради» естественно выражает действие из уважения к обязательству.
- source_word: שְׁבֻעַת יְהוָה
  choice: клятвы Яхве
  rationale: 'Буквальная конструкция сохраняет возможную двусмысленность: это может пониматься как клятва, данная с призыванием Яхве, а грамматически также как принадлежащая Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: которая была между ними
  rationale: Прямо сохранён образ клятвы как взаимного обязательства между сторонами.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: между Давидом и Ионафаном
  rationale: Повтор еврейского предлога сглажен согласно нормам современного русского языка, а двусторонний характер обязательства сохранён.
theological_decisions:
- issue: Значение выражения «клятва Яхве»
  choice: В основном тексте сохранено буквальное выражение «клятва Яхве»; в сноске указан наиболее вероятный смысл — клятва, данная перед Яхве или с призыванием его имени.
  alternative: Клятва, данная самим Яхве.
  rationale: В контексте отношений Давида и Ионафана речь, вероятнее всего, идёт об их клятве с призыванием Яхве как свидетеля, однако буквальная формулировка не позволяет молча устранить грамматическую неоднозначность.
- issue: Кого обозначает титул «царь»
  choice: Сохранён титул «царь».
  alternative: Назвать Давида по имени.
  rationale: Контекст отождествляет царя с Давидом, но оригинал в этой части стиха употребляет именно титул.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис оригинала в целом сохранён, но повторное уточнение оформлено тире для ясности. Имена переданы в привычных русских библейских формах; тетраграмматон — как «Яхве».
