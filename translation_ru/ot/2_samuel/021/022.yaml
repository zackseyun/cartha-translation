base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: ru
  text: Эти четверо родились от Рафы[a] в Гате и пали от руки Давида и от руки его слуг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Рафа», «от великана» или «от рефаимов». Вероятно, еврейское выражение указывает на происхождение от линии великанов, связанной с Гатом.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: эти четверо
  rationale: Передаёт сочетание числительного с указательным местоимением естественно для современного русского языка; слово «мужчины» в еврейском тексте прямо не выражено.
- source_word: יֻלְּדוּ
  choice: родились
  rationale: Пассивная форма глагола ילד здесь обозначает рождение и происхождение. «Родились» — естественный современный эквивалент, не утяжеляющий текст архаичным «были рождены».
- source_word: לְהָרָפָה
  choice: у Рафы
  rationale: Сохраняет возможное понимание הָרָפָה как имени или обозначения родоначальника, не подменяя его в основном тексте толкованием «великан» либо «рефаимы».
- source_word: בְּגַת
  choice: в Гате
  rationale: Обычное локативное значение предлога בְּ; форма соответствует русской передаче названия города Гат.
- source_word: וַיִּפְּלוּ
  choice: пали
  rationale: Сохраняет образ еврейского נפל и в военном контексте естественно означает гибель.
- source_word: בְיַד
  choice: от руки
  rationale: Сохраняет еврейскую идиому, обозначающую деятеля или непосредственную причину гибели, и остаётся понятной в литературном русском языке.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: Прямо передаёт עבדיו; в данном царском и военном контексте речь идёт о людях, состоявших на службе у Давида, но более конкретное «воины» в еврейском тексте не выражено.
theological_decisions:
- issue: Кого обозначает הָרָפָה
  choice: 'Имя или титульное обозначение предка либо родоначальника: «Рафа»'
  alternative: «великан» как нарицательное обозначение или «рефаимы» как название рода или народа
  rationale: Стих подводит итог предшествующим рассказам о сражениях с великанами и связывает этих четверых с линией Рафы в Гате. Поскольку еврейская форма допускает несколько толкований, основной текст сохраняет её как имя, а альтернативы вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной окраской. Выражения «пали от руки» и «его слуг» сохраняют образность и структуру исходного текста, оставаясь понятными обычному читателю.
