base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: ru
  text: И снова была война между филистимлянами и Израилем. Давид спустился вместе со своими слугами[a], и они сразились с филистимлянами. Давид выбился из сил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воинами». Буквально: «слугами»; так могли называть людей на царской службе, в том числе воинов из его окружения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: И снова началась война
  rationale: Передаёт возобновление военных действий естественным современным русским языком; «началась» выражает наступление новой повествовательной ситуации.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: между филистимлянами и Израилем
  rationale: Необычное сочетание предлогов обозначает противостоящие стороны; такая формулировка ясна и не приписывает инициативу одной из них.
- source_word: וַיֵּרֶד
  choice: выступил в поход
  rationale: Буквально глагол означает «спустился», однако без обозначения исходной точки это по-русски звучит неясно; контекст указывает на выход Давида к месту сражения.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: со своими слугами
  rationale: Сохраняет основное значение עֲבָדִים и естественно включает значение «вместе с ним»; в данном царском и военном контексте речь может идти о людях на службе Давида.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: они сразились с филистимлянами
  rationale: Прямо передаёт вступление в бой и естественно звучит по-русски.
- source_word: וַיָּעַף
  choice: выбился из сил
  rationale: Передаёт наступившее в ходе сражения изнеможение, а не просто общее чувство усталости.
