base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: ru
  text: Царь призвал гаваонитян и обратился к ним. Гаваонитяне же не принадлежали к сынам Израиля, а были из уцелевших аморреев[a]; сыны Израиля поклялись им. Саул же стремился поразить их из ревности за сынов Израиля и Иуду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из остатка аморреев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из рвения за сынов Израиля и Иуду». Еврейское слово может означать как ревность, так и рвение, в зависимости от контекста.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: И царь призвал гаваонитян
  rationale: «Призвал» естественно передаёт вызов людей к царю; имя Давида не добавляется, поскольку в еврейском тексте стоит титул «царь».
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: и говорил с ними
  rationale: Буквально «и сказал им»; в данном контексте несовершенный по виду русский оборот естественно вводит последующее обращение царя, сохраняя связь со следующим стихом.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: были не из сынов Израиля
  rationale: Сохранён семейно-национальный образ בני ישראל и его повтор далее в стихе; выражение остаётся понятным по-русски.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: из остатка аморреев
  rationale: יֶתֶר обозначает оставшуюся часть; собирательное единственное «аморрея» по-русски естественно передаётся названием народа во множественном числе.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: поклялись им
  rationale: Кратко и точно передаёт принесение обязательной клятвы гаваонитянам; предшествование действия ясно из пояснительного контекста без обязательного добавления русского плюсквамперфекта.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: но Саул стремился истребить их
  rationale: בקש с инфинитивом выражает намерение или попытку, а נכה в данном контексте означает смертельное поражение; «истребить» соответствует направленности действия против группы и не утверждает, что замысел был полностью осуществлён.
- source_word: בְּקַנֹּאתוֹ
  choice: ревнуя
  rationale: Русское библейски узнаваемое «ревновать о» охватывает горячую, пристрастную преданность и сохраняет нравственную неоднозначность קנא лучше, чем слова со значением одной лишь зависти.
theological_decisions:
- issue: Национальное обозначение בני ישראל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: 'Формулировка сохраняет повтор исходного выражения и его родовой образ, не превращая его в утверждение только о мужчинах: здесь это название всего народа.'
- issue: Мотив Саула в בְּקַנֹּאתוֹ
  choice: ревнуя о сынах Израиля и Иуде
  alternative: из ревности к Израилю и Иуде; из усердия ради Израиля и Иуды
  rationale: Исходное слово допускает как похвально звучащее рвение, так и пристрастную ревность. «Ревнуя о» сохраняет эту напряжённость и не оправдывает поступок Саула.
- issue: Значение לְהַכֹּתָם
  choice: истребить их
  alternative: поразить их; убить их
  rationale: Контекст коллективного преследования гаваонитян указывает на намерение уничтожить общину. При этом глагол «стремился» сохраняет различие между замыслом и его полным осуществлением.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Сыны Израиля» сохранено ради повторения и образности оригинала; «ревнуя о» намеренно удерживает смысловую неоднозначность мотива Саула. Все сноски отмечены в основном тексте.
