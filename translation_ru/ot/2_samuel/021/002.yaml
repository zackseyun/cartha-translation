revisions:
- from: И царь призвал гаваонитян и говорил с ними. Гаваонитяне же были не из сынов Израиля, а из остатка аморреев[a]. Сыны Израиля поклялись им, но Саул стремился истребить их, ревнуя о сынах Израиля и Иуде[b].
  to: Царь призвал гаваонитян и обратился к ним. Гаваонитяне же не принадлежали к сынам Израиля, а были из уцелевших аморреев[a]; сыны Израиля поклялись им. Саул же стремился поразить их из ревности за сынов Израиля и Иуду[b].
  rationale: Правка устраняет несоответствие вида в первом предложении, не усиливает значение глагола «поразить» до «истребить» и даёт современный, при этом семантически открытый эквивалент мотиву Саула. Разъяснение о принадлежности гаваонитян к Израилю не включено в сноску, поскольку это уже передано основным текстом; сноски сохранены только для реальных лексических вариантов и привязаны к соответствующим словам.
