  - severity: medium
    issue: «Истребить» чрезмерно конкретизирует לְהַכֹּתָם
    rationale: Глагол נכה означает «поразить, нанести удар» и в этом контексте может подразумевать убийство, но сам по себе не требует значения полного уничтожения общины.
