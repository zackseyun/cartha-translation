base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: ru
  text: Тогда Рицпа, дочь Айи, взяла мешковину и расстелила её для себя на скале — от начала жатвы и до тех пор, пока на них не полилась вода с небес.[a] Днём она не давала небесным птицам садиться на них, а ночью — диким зверям поля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть пока на них не пролился дождь с неба. Буквально: «пока на них не полилась вода с небес».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: власяницу
  rationale: Слово שַׂק обозначает грубую ткань, связанную с трауром. «Власяница» естественно передаёт здесь предмет и его траурное значение, хотя материал не обязательно был буквально волосяным.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: расстелила её для себя на скале
  rationale: נטה применительно к ткани означает растянуть или расстелить; לָהּ передано как «для себя», а אֶל при данном обозначении места — как «на».
- source_word: מִתְּחִלַּת קָצִיר
  choice: от начала жатвы
  rationale: Сохранено общее обозначение жатвы без добавления конкретной зерновой культуры, которой в стихе нет.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: до тех пор, пока на них не полилась вода с небес
  rationale: Передан образ воды, изливающейся с небес, без сведения выражения непосредственно к слову «дождь».
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесным птицам
  rationale: Традиционное и понятное русское соответствие еврейскому выражению «птицы небес».
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: садиться на них
  rationale: В отношении птиц נוח здесь означает опускаться, садиться или устраиваться на телах; «садиться» естественно по-русски.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевым зверям
  rationale: Краткое литературное соответствие выражению о диких наземных животных.
- source_word: יוֹמָם ... לָיְלָה
  choice: днём ... ночью
  rationale: Естественно передаёт симметричные обстоятельства времени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Для ясности длительного бдения добавлено «Она оставалась там», логически выводимое из контекста, но не выраженное отдельной глагольной формой в еврейском тексте. Синтаксис последнего предложения слегка перестроен, чтобы ясно отнести «днём» к птицам, а «ночью» — к зверям.
