revisions:
- from: Тогда Рицпа, дочь Айи, взяла власяницу и расстелила её для себя на скале. Она оставалась там от начала жатвы до тех пор, пока на них не полилась вода с небес.[a] Днём она не давала небесным птицам садиться на них, а ночью — полевым зверям.
  to: Тогда Рицпа, дочь Айи, взяла мешковину и расстелила её для себя на скале — от начала жатвы и до тех пор, пока на них не полилась вода с небес.[a] Днём она не давала небесным птицам садиться на них, а ночью — диким зверям поля.
  rationale: Убрано невыраженное в оригинале «Она оставалась там». «Власяницу» заменено на «мешковину», чтобы передать грубую траурную ткань без утверждения о волосяном материале или о предмете одежды. Временной оборот сохранён непосредственно при описании расстеленной ткани; местоимение «них» намеренно сохраняет отсылку к останкам, упомянутым в предшествующем контексте. Сноска и её якорь сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:24:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'В черновике точно переданы основные элементы стиха: Рицпа, дочь Айи; ткань, расстеленная на скале; период от начала жатвы до излития воды с небес; охрана останков от птиц днём и зверей ночью. Однако отдельное предложение «Она оставалась там» добавляет явно не выраженное в еврейском тексте действие. Власяница — прежде всего одежда и обычно предполагает волосяной материал, тогда как שַׂק обозначает грубую ткань; безопаснее передать это как «мешковину».'
  naturalness: Предлагаемая редакция сохраняет современный литературный строй и устраняет добавленное предложение. Конструкция с тире естественно связывает временной промежуток с устроенным Рицпой бдением, не вводя нового глагола.
  terminology: Имя «Рицпа» и «Айя» переданы приемлемо. «Мешковина» точнее «власяницы» для שַׂק и не навязывает отсутствующую характеристику материала. «Диким зверям поля» сохраняет образ חַיַּת הַשָּׂדֶה; «садиться» уместно для птиц. Сноска верно отличает буквальный образ излияния воды от толкования как дождя.
  issues:
  - severity: medium
    issue: 'Добавлено: «Она оставалась там».'
    rationale: Еврейский текст не содержит отдельного сказуемого со значением «оставалась». Продолжительность передана временным оборотом после описания того, как Рицпа расстелила ткань; добавление следует убрать.
  - severity: medium
    issue: «Власяницу» следует заменить.
    rationale: שַׂק — грубая ткань (sackcloth), а не обязательно предмет одежды или ткань из волос. «Мешковина» точнее передаёт предмет без лишней конкретизации.
