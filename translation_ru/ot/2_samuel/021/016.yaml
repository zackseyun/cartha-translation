  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: ru
  text: Ишби-Бенов[a], один из потомков Рафа[b], — его копьё весило триста шекелей бронзы, и он был опоясан новым мечом[c], — сказал, что сразит Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма имени неясна. «Ишби-Бенов» следует традиционному пониманию; возможны иная передача имени или иное разделение согласных.
    reason: textual_variant
  - marker: b
    text: 'Или: «один из рождённых у Рафа». Вероятно, имеется в виду род великанов, связанный с рефаимами.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «новым»; существительное в еврейском тексте опущено. Традиционно считается, что подразумевается меч.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: Ишби-Бенов
  rationale: Масоретская форма трудна и допускает иное членение, однако традиционное понимание её как личного имени соответствует повествовательному контексту. Неопределённость отмечена в сноске.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: один из потомков Рафа
  rationale: Сочетание указывает на происхождение или принадлежность к роду. Имя Рафа сохранено транслитерацией, без сведения его значения просто к слову «великан».
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: его копьё весило
  rationale: В данном военном контексте קֵין традиционно понимается как копьё или его древко. Русская конструкция с глаголом «весило» естественно передаёт именное выражение оригинала.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: триста шекелей бронзы
  rationale: Древняя мера веса сохранена без приблизительного пересчёта; נְחֹשֶׁת в контексте оружия передано как «бронза».
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: он был опоясан новым мечом
  rationale: В еврейском тексте названо лишь «новое» в женском роде, а существительное опущено. По традиционному и контекстуально вероятному пониманию подразумевается меч; эллипсис отмечен в сноске.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: сказал, что сразит Давида
  rationale: Буквально оборот содержит глагол «сказал» и инфинитив «поразить». Перевод сохраняет речевой оттенок и передаёт выраженное намерение естественным русским синтаксисом.
