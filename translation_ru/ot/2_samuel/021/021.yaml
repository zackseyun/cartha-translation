  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: ru
  text: Он поносил Израиль, и Ионафан, сын Шимея[a], брата Давида, сразил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях и в параллельном месте (1 Пар. 20:7) вместо «Шимей» стоит «Шимеа» или «Шима».
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: поносил
  rationale: Глагол חרף обозначает оскорбительную, дерзкую речь против противника; в военном контексте «поносил» передаёт не просто насмешку, а публичное поругание Израиля.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено собирательное обозначение народа как в еврейском тексте, без пояснительной замены на «израильтян».
- source_word: וַיַּכֵּהוּ
  choice: сразил его
  rationale: נכה буквально означает нанесение удара, а в данном боевом контексте подразумевает смертельное поражение; «сразил» естественно сохраняет оба оттенка.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная и узнаваемая русская передача библейского имени.
- source_word: בֶּן שמעי
  choice: сын Шимея
  rationale: Основной текст следует форме имени שמעי; разночтение по параллельному месту отмечено в сноске.
- source_word: אֲחִי דָוִד
  choice: брата Давида
  rationale: Родительный оборот естественно передаёт конструкцию «брат Давида» и относит это определение к Шимею.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным строем. «Поносил» сохраняет торжественную серьёзность военного рассказа, не становясь архаизмом; «сразил» передаёт подразумеваемый смертельный исход без избыточного пояснения.
