source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: ru
  text: 'Давид сказал гаваонитянам: «Что мне сделать для вас и чем искупить вину, чтобы вы благословили наследие Яхве[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «и благословите наследие Яхве». «Наследие Яхве» здесь означает Израиль — принадлежащий Ему народ.'
    reason: Грамматически וּבָרְכוּ допускает сочинительное прочтение, а образное выражение נַחֲלַת יְהוָה нуждается в кратком культурно-смысловом пояснении.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; нейтрально вводит прямую речь, не уточняя сверх текста характер речевого действия.
- source_word: הַגִּבְעֹנִים
  choice: гаваонитянам
  rationale: Традиционное и узнаваемое русское название жителей Гаваона.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: Что мне сделать для вас
  rationale: Передаёт совещательный оттенок имперфекта и естественно звучит в современной русской речи.
- source_word: וּבַמָּה
  choice: и чем
  rationale: Сохраняет инструментальный смысл буквального «и посредством чего», не утяжеляя фразу.
- source_word: אֲכַפֵּר
  choice: искупить вину
  rationale: Порода пиэль глагола כפר выражает устранение тяжкой вины посредством искупительного действия. Формулировка сохраняет богословский вес слова и при этом естественнее по-русски, чем «совершить искупление» в данном вопросе.
- source_word: וּבָרְכוּ
  choice: чтобы вы благословили
  rationale: В контексте соединительная форма с волитивным значением естественно понимается как желаемый результат действий Давида; цель передана без устранения возможного сочинительного прочтения, отмеченного в сноске.
- source_word: נַחֲלַת יְהוָה
  choice: наследие Яхве
  rationale: Близко передаёт конструкцию со значением народа, принадлежащего Яхве; слово «наследие» сохраняет библейский образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Значение כפר в контексте кровной вины и нарушения обязательства
  choice: искупить вину
  alternative: загладить вину; совершить искупление; умилостивить
  rationale: Выбранная формулировка сохраняет связь с устранением тяжкой общей вины перед Богом и пострадавшими гаваонитянами, не сводя действие лишь к извинению или возмещению ущерба.
- issue: Смысл заключительной части וּבָרְכוּ אֶת נַחֲלַת יְהוָה
  choice: 'целевой/результативный: «чтобы вы благословили наследие Яхве»'
  alternative: 'сочинительный: «и благословите наследие Яхве»'
  rationale: Контекст поддерживает понимание благословения как желаемого результата искупительного действия Давида. Однако грамматически возможно и более буквальное сочинительное прочтение, поэтому оно сохранено в сноске.
- issue: Референт выражения «наследие Яхве»
  choice: сохранить образное выражение в основном тексте
  alternative: передать прямо как «народ Яхве» или «Израиль»
  rationale: Еврейская метафора богословски значима и понятна при кратком пояснении; её не следует незаметно заменять толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой и доступный; сохранены ключевые образы «искупить вину» и «наследие Яхве». Личное имя יְהוָה передано как «Яхве».
