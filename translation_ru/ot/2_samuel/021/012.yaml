  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: ru
  text: И пошёл Давид и взял кости Саула и кости Ионафана, его сына, у жителей Иависа Галаадского, которые украли их с площади Беф-Сана, где филистимляне повесили их в тот день, когда поразили Саула на Гелвуе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Повесили» можно также понять как «выставили напоказ» и, при более узком толковании, «насадили»; еврейский глагол прежде всего означает «вешать».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  choice: кости
  rationale: Буквальное значение существительного; в контексте последующего погребения сохраняет конкретность еврейского текста лучше, чем более общее «останки».
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: жители Иависа Галаадского
  rationale: Сочетание בַּעֲלֵי с названием города обозначает связанных с ним людей, то есть жителей; традиционная русская форма топонима ясна и естественна.
- source_word: גָּנְבוּ
  choice: тайно унесли
  rationale: Основное значение — «украли», однако согласно 1 Цар 31:12 жители Иависа сняли тела ночью. В отношении возвращения тел павших «тайно унесли» естественно передаёт скрытность действия без нежелательного русского оттенка присвоения чужого имущества.
- source_word: מֵרְחֹב בֵּית שַׁן
  choice: с площади Беф-Сана
  rationale: רְחֹב обозначает открытое городское пространство, площадь; русский перевод не требует добавления «общественной».
- source_word: תלו/ם שם
  choice: повесили их
  rationale: Глагол תלה прямо означает «вешать». Контекст допускает публичное выставление и, возможно, насаживание, но не требует более узкого значения.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: поразили Саула
  rationale: 'Сохраняет глагольный образ נכה и не сглаживает повествовательное напряжение: в 1 Цар 31 Саул после ранения пал на собственный меч.'
- source_word: בַּגִּלְבֹּעַ
  choice: на Гелвуе
  rationale: Передаёт предлог בְּ и традиционную русскую форму названия горной местности без пояснительного добавления «гора».
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: И пошёл Давид и забрал
  rationale: Последовательность форм с וַ передаёт развитие повествования. «Забрал» здесь естественнее, чем «взял», поскольку речь идёт о получении и перенесении костей.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: его сына Ионафана
  rationale: Естественный русский порядок слов ясно относит «сына» к Саулу.
theological_decisions:
- issue: Кто непосредственно убил Саула
  choice: филистимляне «поразили Саула»
  alternative: филистимляне «убили Саула»
  rationale: Буквальное «поразили» согласуется с данным стихом и не устраняет напряжение с рассказом 1 Цар 31:3–5, где Саул, тяжело раненный филистимлянами, пал на собственный меч.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены конкретное «кости» и буквальное «повесили»; синтаксис разделён на два предложения ради ясности. Использованы привычные русские библейские формы имён и топонимов.
