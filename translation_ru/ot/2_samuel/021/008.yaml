    issue: Неясная родственная связь в оборотах «которых она родила Саулу» и «которых она родила Адриэлу».
    rationale: В русском дательный падеж при «родила» не является нейтральным современным способом назвать отца и может быть понят как «родила для кого-либо». Предлог «от» однозначно выражает требуемое значение отцовства.
  revised_text: И взял царь двух сыновей Рицпы, дочери Айи, которых она родила от Саула, — Армони и Мемфивосфея, — и пятерых сыновей Мелхолы, дочери Саула[a], которых она родила от Адриэла, сына Верзеллия из Мехолы.
