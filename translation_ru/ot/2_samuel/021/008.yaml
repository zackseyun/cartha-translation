  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: ru
  text: И взял царь двух сыновей Рицпы, дочери Айи, которых она родила от Саула, — Армони и Мемфивосфея, — и пятерых сыновей Мелхолы, дочери Саула[a], которых она родила от Адриэла, сына Верзеллия из Мехолы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и у древних толкователей: «Мерова» вместо «Мелхола»; ср. 1 Царств 18:19, где сказано, что Адриэл женился на Мерове, дочери Саула.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח הַמֶּלֶךְ
  choice: И взял царь
  rationale: Последовательная форма с וַ продвигает повествование; русский порядок слов сохраняет повествовательную связность и титул исходного текста, не заменяя его именем Давида.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: двух сыновей Рицпы, дочери Айи
  rationale: Конструктивная цепочка с числительным передана прямо и естественно; имена приведены в традиционной русской библейской форме.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: которых она родила Саулу
  rationale: Глагол ילד с ל обозначает отца; буквальная русская конструкция ясна и сохраняет повторяющийся синтаксис стиха.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: Армони и Мемфивосфея
  rationale: Собственные имена переданы в формах, узнаваемых русскому читателю; падеж выражает функцию прямого дополнения.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: пятерых сыновей Мелхолы, дочери Саула
  rationale: Основной текст следует чтению WLC מִיכַל; вариант «Мерова» не подставляется ради гармонизации, а отмечается в сноске.
- source_word: לְעַדְרִיאֵל בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: Адриэлу, сыну Верзеллия из Мехолы
  rationale: Патроним передан обычной русской конструкцией, а географическое определение הַמְּחֹלָתִי — прозрачным выражением «из Мехолы», более понятным современному читателю, чем искусственный этнохороним.
theological_decisions:
- issue: 'Текстуально-историческое расхождение: Мелхола названа матерью сыновей Адриэла'
  choice: Сохранить «Мелхолы» в основном тексте как чтение WLC и отметить вариант в сноске.
  alternative: «Меровы»; ср. 1 Царств 18:19, где женой Адриэла названа Мерова.
  rationale: Перевод не должен молча устранять напряжение между местами Писания. Основная строка отражает предоставленный еврейский текст, а значимый древний вариант сообщается читателю.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксический параллелизм двух групп сохранён; архаичные формы сведены к минимуму, но традиционные русские формы известных библейских имён оставлены ради узнаваемости.
