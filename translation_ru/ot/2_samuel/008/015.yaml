  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: ru
  text: Давид царствовал над всем Израилем и осуществлял правосудие и справедливость по отношению ко всему своему народу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вершил суд и поступал справедливо по отношению ко всему своему народу». Слова «правосудие и справедливость» передают устойчивую еврейскую пару, характеризующую идеальное царское правление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Глагол מלך здесь описывает продолжающееся царское правление Давида, а не только его восшествие на престол.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Предлог עַל при מלך обозначает область правления, а כָּל сохраняет всеохватность утверждения.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: творил
  rationale: Сочетание ויהי с причастием выражает длительное или обычное действие; несовершенный вид русского глагола передаёт эту характеристику правления.
- source_word: מִשְׁפָּט
  choice: суд
  rationale: В контексте царского правления слово обозначает справедливое отправление суда и правосудия; «суд» сохраняет отдельный член устойчивой древнееврейской пары.
- source_word: וּצְדָקָה
  choice: правду
  rationale: צְדָקָה здесь означает правоту, справедливость и должный порядок. «Правда» сохраняет отличие от מִשְׁפָּט и естественно сочетается с выражением «творить суд» в возвышенной повествовательной речи.
- source_word: לְכָל עַמּוֹ
  choice: для всего своего народа
  rationale: Предлог לְ передаёт направленность царского служения на благо народа, а местоимение «своего» отражает суффикс третьего лица при עַם.
theological_decisions:
- issue: Передача царской формулы מִשְׁפָּט וּצְדָקָה
  choice: суд и правду
  alternative: правосудие и справедливость
  rationale: Выбранная формулировка сохраняет два самостоятельных понятия — справедливое судебное управление и нравственную правоту — и не сводит их к одному современному юридическому термину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «творил суд и правду». Несовершенный вид обоих сказуемых передаёт длительный, характерный образ правления Давида.
