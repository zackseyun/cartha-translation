  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: ru
  text: Иоав, сын Саруи, командовал войском, а Иосафат, сын Ахилуда, был царским летописцем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был царским секретарём». Еврейское слово обозначает придворного чиновника, который вёл записи и докладывал царю о делах; точный круг его обязанностей неизвестен.'
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: командовал войском
  rationale: В перечне должностных лиц сочетание עַל с обозначением войска выражает руководство и власть; естественное русское соответствие передаёт административный смысл.
- source_word: מַזְכִּיר
  choice: царский летописец
  rationale: Слово обозначает придворного чиновника, который вёл записи и докладывал царю о делах. Добавление «царский» уточняет должностной характер термина, а примечание сохраняет неопределённость точного круга обязанностей.
- source_word: בֶּן
  choice: сын
  rationale: В обозначении происхождения это прямое и естественное соответствие.
- source_word: וְ / וִ
  choice: а
  rationale: Союз связывает два пункта перечня; русское «а» естественно разграничивает параллельно названных должностных лиц без выражения противопоставления.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Иоав / Саруя / Иосафат / Ахилуд
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, понятные современному читателю.
