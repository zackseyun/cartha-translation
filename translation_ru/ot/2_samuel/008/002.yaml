revisions:
- from: Он поразил Моав и отмерил их верёвкой[a], уложив их на землю. Он отмерил две верёвки на смерть и одну полную верёвку — чтобы оставить в живых. Так моавитяне стали слугами Давида и приносили дань.[b]
  to: Он поразил Моав и измерил их мерным шнуром[a], уложив их на землю. Он отмерил две длины шнура для умерщвления, а полную длину шнура — для сохранения жизни. Так моавитяне стали слугами Давида и приносили дань[b].
  rationale: Исправление уточняет, что речь идёт не о двух отдельных верёвках, а о двух отмеренных длинах мерного шнура. Оно сохраняет суровую и намеренно неразвёрнутую формулу оригинала, не превращая подразумеваемое соотношение в явное «две трети» и не добавляя числительное там, где его нет в еврейском тексте. Сноска сохраняет необходимое минимальное пояснение процедуры и остаётся привязанной к заключительному результату описания.
