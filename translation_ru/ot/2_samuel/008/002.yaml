  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: ru
  text: Он поразил Моав и измерил их мерным шнуром[a], уложив их на землю. Он отмерил две длины шнура для умерщвления, а полную длину шнура — для сохранения жизни. Так моавитяне стали слугами Давида и приносили дань[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верёвкой».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст описывает, как Давид измерял лежавших на земле моавитян шнуром: две отмеренные части предназначались для смерти, а полная часть — для сохранения жизни. Тем самым одни были казнены, а другие оставлены в живых.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: Он поразил
  rationale: Сохраняет конкретное и широкое значение נכה в военном контексте, не сводя его лишь к результату «победил».
- source_word: מוֹאָב
  choice: Моав / моавитяне
  rationale: В первом упоминании сохранено название народа как собирательное «Моав», а в заключении естественное русское «моавитяне» передаёт согласование с множественным לַעֲבָדִים.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: и отмерил их верёвкой
  rationale: Глагол מדד передан конкретно; חבל обозначает верёвку или мерный шнур, служащий здесь средством измерения.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: уложив их на землю
  rationale: 'Передаёт каузативную конструкцию кратко и естественно: Давид велел им лечь или заставил их лечь для измерения.'
- source_word: שְׁנֵי חֲבָלִים לְהָמִית
  choice: две верёвки на смерть
  rationale: Сохраняет суровую краткость и образность еврейского текста, не превращая подразумеваемые доли в явную дробь.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: и одну полную верёвку — чтобы оставить в живых
  rationale: «Одну» естественно выражает противопоставление двум отмеренным длинам; לְהַחֲיוֹת прямо означает сохранение жизни. Асимметрия формулировки остаётся близкой исходному тексту и ясной по-русски.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: Так моавитяне стали слугами Давида
  rationale: В политическом контексте עֲבָדִים обозначает подчинённых или вассалов; «слугами» сохраняет основное значение без чрезмерно узкого «рабами».
- source_word: נֹשְׂאֵי מִנְחָה
  choice: и приносили дань
  rationale: В контексте подчинения царю מִנְחָה означает дань, а причастие указывает на продолжающуюся обязанность.
theological_decisions:
- issue: Характер расправы над Моавом и смысл измерения
  choice: Сохранить буквальный образ людей, уложенных на землю и распределённых мерной верёвкой на смерть и на сохранение жизни.
  alternative: Передать лишь общий разгром Моава либо прямо сказать в основном тексте, что две трети были казнены, а треть оставлена в живых.
  rationale: Еврейский текст описывает конкретную и жестокую процедуру, но не формулирует её результат в виде дробей. Перевод не смягчает рассказ и не делает подразумеваемое соотношение более определённым, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены лаконичность, повтор измерительной лексики и суровая образность оригинала; синтаксис сделан понятным обычному читателю.
