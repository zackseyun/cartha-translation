review_pass:
  verdict: revise
  source_fidelity: 'Смысловой ход еврейского текста в черновике передан верно: Моав поражён, людей укладывают на землю, две отмеренные части назначаются для смерти, полная часть — для сохранения жизни; затем Моав подчинён Давиду и приносит дань. Однако «две верёвки» по-русски означает две отдельные верёвки, тогда как חֲבָלִים в контексте обозначает отмеренные длины/участки линии. «Одну» в следующей фразе также лучше не добавлять в основной текст, поскольку в еврейском тексте числительное не выражено.'
  naturalness: «Отмерил их верёвкой» и особенно «отмерил две верёвки на смерть» звучат неестественно и могут быть поняты неверно. «Измерил их мерным шнуром» и «отмерил две длины шнура» яснее передают процедуру современным литературным русским. Формула «для умерщвления / для сохранения жизни» сохраняет лаконичный параллелизм и звучит естественнее, чем «на смерть».
  terminology: «Моав», «моавитяне», «слуги Давида» и «дань» уместны. «Слуги» сохраняет политически подчинённый характер עֲבָדִים, не навязывая более узкое социально-правовое значение. «Мерный шнур» точно выражает инструментальное значение בַּחֶבֶל; в дальнейшем «длины шнура» передаёт измеренные участки.
