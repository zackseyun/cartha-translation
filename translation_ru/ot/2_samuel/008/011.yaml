revisions:
- from: Их[a] царь Давид также посвятил Яхве вместе с серебром и золотом, которые он посвятил из добытого у всех народов, покорённых им[b].
  to: Их[a] царь Давид также посвятил Яхве вместе с серебром и золотом, которые он посвятил Яхве, взяв у всех народов, покорённых им[b].
  rationale: Убрано добавочное «добытого», не имеющее прямого соответствия в исходном тексте. Оборот «взяв у всех народов» естественно выражает исходное значение предлога «из/от», обозначающего источник металлов. Повтор «посвятил Яхве» в придаточном явно передаёт повтор еврейского глагола и устраняет возможную неясность русской конструкции.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:21:01Z'
