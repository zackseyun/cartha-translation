base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: ru
  text: Их[a] царь Давид также посвятил Яхве вместе с серебром и золотом, которые он посвятил Яхве, взяв у всех народов, покорённых им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть предметы, упомянутые в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «завоёванных им». Еврейский глагол может означать подчинение народов силой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: также
  rationale: Передаёт добавочное значение частицы и связывает посвящение этих даров с уже упомянутыми серебром и золотом.
- source_word: אֹתָם
  choice: их
  rationale: Сохраняет местоименную отсылку к дарам, названным в предыдущем стихе, не уточняя её сверх исходного текста.
- source_word: הִקְדִּישׁ
  choice: посвятил
  rationale: Естественно передаёт отделение ценностей для Бога и сохраняет культовый смысл глагола.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Обычная и естественная для русского библейского повествования передача титула и имени.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, а не заменяет его титулом.
- source_word: עִם
  choice: вместе с
  rationale: Ясно соединяет только что упомянутые дары с серебром и золотом.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: серебром и золотом
  rationale: Естественная русская передача названий драгоценных металлов; определённость выражается контекстом.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: которые он посвятил
  rationale: Сохраняет относительное придаточное и повтор ключевого глагола исходного текста.
- source_word: מִכָּל הַגּוֹיִם
  choice: из добытого у всех народов
  rationale: Предлог מִן обозначает источник; слово «добытого» делает эллиптическую еврейскую конструкцию понятной по-русски в военном контексте, не определяя конкретный вид имущества.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: покорённых им
  rationale: Передаёт военное подчинение народов и сохраняет возможность понимать его как покорение, а не обязательно как окончательное присоединение территорий.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; форма «Яхве» непосредственно передаёт это имя и не заменяет его титулом.
- issue: Характер победы, выраженный כִּבֵּשׁ
  choice: покорённых им
  alternative: завоёванных им
  rationale: «Покорённых» сохраняет значение принудительного подчинения, не утверждая сверх текста непременного территориального присоединения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис близок к еврейскому оригиналу, но эллиптическое выражение источника серебра и золота раскрыто словами «из добытого», чтобы фраза была ясна обычному читателю.
