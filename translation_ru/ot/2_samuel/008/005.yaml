translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Союз «но» естественно выражает контраст между прибытием помощи и последующим поражением, не меняя хода событий. Названия «Арам» и «Цова» ориентированы на древнееврейскую форму, а не на традиционные позднейшие эквиваленты.
