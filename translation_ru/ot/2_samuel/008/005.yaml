  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: ru
  text: Арамейцы из Дамаска[a] пришли на помощь Хададэзеру[b], царю Цовы, и Давид поразил двадцать две тысячи арамеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Арам Дамаска»; имеется в виду арамейское царство с центром в Дамаске. Традиционный перевод «Сирия» отражает более позднее название этой области.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых библейских местах и традициях передачи текста это имя имеет форму «Хадарэзер».
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: пришли
  rationale: Глагол בוא в последовательном повествовании означает прибытие; множественное число согласовано с естественным русским обозначением жителей/сил Арама — «арамейцы».
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: арамейцы из Дамаска
  rationale: Выражение обозначает Арам, центром которого был Дамаск. Такой перевод понятен современному читателю и не подменяет древний Арам позднейшим названием «Сирия».
- source_word: לַעְזֹר
  choice: на помощь
  rationale: Точно и естественно передаёт цель действия, выраженную глаголом עזר — «помогать».
- source_word: לַהֲדַדְעֶזֶר
  choice: Хададэзеру
  rationale: Имя передано транслитерацией данной еврейской формы; вариант с ר вместо ד отмечен в сноске.
- source_word: מֶלֶךְ צוֹבָה
  choice: царю Цовы
  rationale: Конструктивная цепь прямо обозначает титул Хададэзера и подвластное ему царство.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Военное употребление נכה указывает на нанесение сокрушительного удара, обычно с гибелью людей; «поразил» сохраняет силу выражения, не превращая его без необходимости в более узкое «убил».
- source_word: בַּאֲרָם
  choice: арамеев
  rationale: После נכה предлог ב отмечает тех, по кому был нанесён удар; по-русски естественно назвать поражённый народ прямым дополнением.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: двадцать две тысячи арамеев
  rationale: Число передано точно. В военном контексте «арамеи» естественно обозначает мужчин из названной группы, не добавляя отсутствующего в тексте слова «воины».
