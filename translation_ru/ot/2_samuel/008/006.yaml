base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: ru
  text: И Давид разместил гарнизоны[a] в Дамасском Араме[b], и Арам стал служить Давиду и приносить дань[c]. И Яхве даровал Давиду победу[d], куда бы он ни шёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наместников» либо «военные посты». Еврейское слово может обозначать размещённых на территории должностных лиц, военные подразделения или укреплённые посты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Араме Дамасском»; традиционно: «в Дамасской Сирии». «Арам» — древнееврейское название этой области и народа.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «принося дар». Еврейское слово может означать дар, приношение или дань; здесь, вероятно, имеется в виду дань, вносимая покорённым государством.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквальнее: «спасал» или «избавлял Давида». В данном военном контексте это означает, что Яхве давал ему побеждать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: разместил
  rationale: Глагол שׂים означает «поместить, поставить». В сочетании с военным объектом «разместил» звучит естественно и передаёт учреждение постоянного присутствия на покорённой территории.
- source_word: נְצִבִים
  choice: гарнизоны
  rationale: В контексте военного завоевания слово, вероятнее всего, обозначает размещённые военные подразделения или посты, хотя возможно и значение «наместники»; неоднозначность отмечена в сноске.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: в Дамасском Араме
  rationale: Сохранено древнееврейское географическое название «Арам», а сочетание передано как название арамейского государства с центром в Дамаске.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: Арам стал служить Давиду
  rationale: Формулировка передаёт политическое подчинение Арама и сохраняет смысл עֲבָדִים, избегая неестественного по-русски буквального выражения «Арам стал слугами».
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: принося дань
  rationale: מִנְחָה может означать дар, приношение или дань. В контексте вассальной зависимости наиболее точен политический смысл «дань».
- source_word: וַיֹּשַׁע
  choice: даровал … победу
  rationale: Каузативная форма ישׁע обозначает спасительное действие Яхве. В рассказе о военных походах «даровал победу» ясно передаёт контекстуальный смысл, а более буквальная возможность указана в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: куда бы он ни шёл
  rationale: Естественная русская передача идиомы, выражающей неизменный успех Давида повсюду, куда он направлялся, без неоправданного сужения значения до военных маршей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер подчинения Арама в выражении לַעֲבָדִים
  choice: стал служить Давиду
  alternative: стал подвластен Давиду; стал рабом Давида
  rationale: Речь идёт о политической зависимости народа или государства, подтверждаемой выплатой дани. Выбранная формулировка сохраняет образ служения, но не навязывает индивидуальный смысл рабства.
- issue: Значение спасительного действия וַיֹּשַׁע
  choice: даровал Давиду победу
  alternative: спасал Давида; избавлял Давида
  rationale: Военный контекст поддерживает значение победы, однако глагол сохраняет более широкую идею спасения или избавления; она отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся близким к последовательности древнееврейского текста, но устранены неестественные для русского языка согласовательные конструкции. Географическое имя «Арам» сохранено; ключевые смысловые неоднозначности вынесены в сноски.
