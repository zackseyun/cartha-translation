  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: ru
  text: Он поставил гарнизоны в Эдоме; по всему Эдому он поставил гарнизоны, и весь Эдом стал служить Давиду[a]. Яхве даровал Давиду победу, куда бы тот ни пошёл[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь Эдом стал рабами (или слугами) Давида»; название страны употреблено собирательно вместо её жителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Яхве спасал (избавлял) Давида, куда бы тот ни пошёл». В данном военном контексте спасение выражается в дарованной победе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: поставил
  rationale: Глагол שׂים имеет широкое значение «помещать, ставить»; «поставил гарнизоны» естественно передаёт действие, не уточняя его сверх исходного текста.
- source_word: נְצִבִים
  choice: гарнизоны
  rationale: В контексте военного покорения Эдома слово, вероятнее всего, обозначает размещённые для контроля военные силы или опорные пункты; возможное значение «наместники» отмечается как менее вероятное.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: в Эдоме / по всему Эдому
  rationale: 'Первое выражение обозначает место, а второе имеет распределительный смысл: гарнизоны были размещены по всей стране.'
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: весь Эдом стал служить Давиду
  rationale: Так сохраняется коллективное обозначение страны и передаётся политическое подчинение. Еврейское עֲבָדִים буквально означает «рабы/слуги», поэтому более буквальная формулировка приведена в сноске.
- source_word: וַיּוֹשַׁע
  choice: даровал … победу
  rationale: Каузативная форма от ישׁע означает «спасать, избавлять, давать победу»; в военном итоговом сообщении «даровал победу» ясно выражает контекстуальный смысл и сохраняет божественную инициативу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: куда бы тот ни пошёл
  rationale: Русская конструкция естественно выражает всеохватность успеха Давида и не добавляет отсутствующего в самом глаголе значения «выступал в поход».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер подчинения Эдома
  choice: стал служить Давиду
  alternative: стал рабом Давида; все эдомитяне стали слугами Давида
  rationale: Фраза указывает на покорение и зависимое служение, но сама по себе не требует уточнять конкретный правовой статус каждого эдомитянина. Перевод сохраняет политический смысл, а сноска — буквальную образность.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Повтор «поставил гарнизоны» сохранён вслед за еврейским текстом. Местоимение «тот» устраняет возможную двусмысленность относительно того, кто шёл.
