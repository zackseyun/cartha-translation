base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: ru
  text: Давид захватил у него тысячу семьсот всадников и двадцать тысяч пеших воинов[a]. Затем Давид подрезал сухожилия всем колесничным коням[b], оставив коней для ста колесниц[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте книги Самуила — «тысячу семьсот всадников»; в параллельном месте, 1 Паралипоменон 18:4, — «семь тысяч всадников».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «всему колесничному войску». Подрезать сухожилия можно было коням, поэтому подразумеваемый объект назван прямо.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «но оставил из них на сто колесниц».'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד обозначает захват в бою; «захватил» естественно передаёт военный контекст.
- source_word: מִמֶּנּוּ
  choice: у него
  rationale: Местоименный суффикс стоит в единственном числе и в контексте указывает на Ададезера.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: тысячу семьсот всадников
  rationale: פָּרָשִׁים — всадники или конница; сохранено число масоретского текста книги Самуила.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: двадцать тысяч пеших воинов
  rationale: Передаёт военное значение буквально выраженных «людей пеших» и сохраняет противопоставление всадникам.
- source_word: וַיְעַקֵּר
  choice: подрезал сухожилия
  rationale: В данном контексте עקר означает вывести коней из строя, подрезав им сухожилия; это яснее для современного читателя, чем редкое специальное слово.
- source_word: אֶת כָּל הָרֶכֶב
  choice: всем колесничным коням
  rationale: רֶכֶב буквально может означать колесницы или колесничное войско, но объектом действия «подрезать сухожилия» метонимически являются кони.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: оставив коней для ста колесниц
  rationale: יתר означает оставить или сохранить; контекст показывает, что было сохранено количество коней, необходимое для ста колесниц.
