base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: ru
  text: После этого Давид поразил филистимлян и покорил их. Давид отнял у филистимлян Метег-ха-Амму[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально означает «узда матери»; его точный смысл неясен. Возможно, «мать» здесь означает город-мать, то есть главный город, а всё выражение образно говорит о власти над ним. В параллельном месте, 1 Пар. 18:1, сказано: «Гат и его дочерние города».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт переход к следующему событию повествования, не вводя избыточного буквального оборота «и было».
- source_word: וַיַּךְ
  choice: поразил
  rationale: Сохраняет конкретное значение глагола נכה в военном контексте; последующий глагол отдельно указывает на подчинение противника.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название этого народа.
- source_word: וַיַּכְנִיעֵם
  choice: покорил их
  rationale: Порода хифиль глагола כנע означает подчинить, привести в покорность; выбран естественный для русского военного повествования эквивалент.
- source_word: וַיִּקַּח
  choice: отнял
  rationale: В сочетании с מִיַּד выражает переход объекта из-под власти филистимлян к Давиду; «отнял у» естественно передаёт весь оборот.
- source_word: מֶתֶג הָאַמָּה
  choice: Метег-ха-Амму
  rationale: Трудное выражение допускает понимание как имени или как образного обозначения власти над главным городом. Транслитерация в основном тексте не устраняет эту подлинную неясность; примечание раскрывает буквальный и контекстуальный варианты.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: у филистимлян
  rationale: Еврейский оборот буквально означает «из руки филистимлян», то есть из-под их власти или контроля; по-русски это естественно выражено конструкцией «отнял у».
