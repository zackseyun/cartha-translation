  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: ru
  text: Когда Тои, царь Хамата, услышал, что Давид разбил всё войско Ададезера,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 1 Паралипоменон 18:9, имя царя передано как «Тоу». Еврейский текст здесь содержит форму «Тои».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Прямо передаёт повествовательную форму глагола שׁמע и естественно вводит содержание полученной вести.
- source_word: תֹּעִי
  choice: Тои
  rationale: Основной текст следует форме имени в масоретском тексте данного стиха; вариант из параллельного места отмечен в сноске.
- source_word: מֶלֶךְ חֲמָת
  choice: царь Хамата
  rationale: Естественная передача сопряжённой конструкции, обозначающей титул и владение Тои.
- source_word: כִּי
  choice: что
  rationale: Здесь союз вводит содержание того, что услышал Тои, а не причину действия.
- source_word: הִכָּה
  choice: разбил
  rationale: В военном контексте глагол נכה означает нанесение поражения; «разбил» сохраняет его силу и звучит естественно по-русски.
- source_word: אֵת כָּל חֵיל
  choice: всё войско
  rationale: חַיִל здесь обозначает совокупность военных сил; «войско» — ясный и уместный современный эквивалент.
- source_word: הֲדַדְעָזֶר
  choice: Ададезер
  rationale: Традиционная русская библейская передача личного имени, соответствующая еврейской форме.
