    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от сынов Аммона».'
    reason: lexical_alternative
  - marker: c
    text: В некоторых других местах это имя пишется «Хададрезер».
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: из Арама
  rationale: Сохраняет древнееврейское географическое имя אֲרָם, не заменяя его более поздним названием «Сирия».
- source_word: וּמִמּוֹאָב
  choice: Моава
  rationale: Передаёт название народа и территории; предлог «из» естественно распространяется на однородный ряд.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: от аммонитян
  rationale: Буквально «от сынов Аммона»; современный русский этноним ясно и естественно передаёт национально-этническое значение.
- source_word: וּמִפְּלִשְׁתִּים
  choice: филистимлян
  rationale: Употреблён общепринятый русский этноним; управление продолжается от предлога «от».
- source_word: וּמֵעֲמָלֵק
  choice: Амалика
  rationale: Источник использует собственное имя עֲמָלֵק, а не явную форму этнонима; поэтому сохранено «Амалик».
- source_word: וּמִשְּׁלַל
  choice: а также из добычи, взятой у
  rationale: שָׁלָל означает военную добычу. Добавление «взятой у» делает русскую синтаксическую связь прозрачной без изменения смысла.
- source_word: הֲדַדְעֶזֶר
  choice: Гададезера
  rationale: Транслитерация соответствует написанию имени в данном стихе; вариант «Ададезер» также возможен при иной традиции передачи начального ה.
- source_word: בֶּן רְחֹב
  choice: сына Рехова
  rationale: Прямая и естественная передача родственной конструкции.
- source_word: מֶלֶךְ צוֹבָה
  choice: царя Цовы
  rationale: Формально передаёт титул и собственное географическое имя.
