lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד שֵׁם
  choice: Давид прославился
  rationale: Еврейская идиома буквально означает «сделал себе имя», то есть приобрёл известность или славу. «Прославился» естественно и точно передаёт её смысл по-русски.
- source_word: בְּשֻׁבוֹ
  choice: когда возвратился
  rationale: Предлог ב с инфинитивом и местоименным суффиксом выражает время действия; эта формулировка ясна и соответствует повествовательному контексту.
- source_word: מֵהַכּוֹתוֹ
  choice: после поражения
  rationale: Конструкция указывает на действие, после которого Давид возвратился. Существительное «поражение» сохраняет военный смысл נכה и позволяет связать последующее число с подразумеваемыми побеждёнными людьми.
- source_word: אֶת אֲרָם
  choice: Арама
  rationale: Основной текст WLC содержит название אֲרָם. Оно передано как «Арам», а не более поздним географическим названием «Сирия» и не истолковывающим обозначением «арамеи».
- source_word: בְּגֵיא מֶלַח
  choice: в Соляной долине
  rationale: Сочетание является названием местности с предлогом ב; «в Соляной долине» естественно для русского языка.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: восемнадцати тысяч человек
  rationale: В еврейском тексте дано только число без существительного. «Человек» восполняет подразумеваемый объект в военном контексте и делает синтаксическую связь прозрачной.
theological_decisions:
- issue: 'Кого поразил Давид: Арам или Эдом'
  choice: В основном тексте — «Арам», с вариантом «Эдом» в сноске.
  alternative: Эдом
  rationale: Масоретский текст 2 Царств 8:13 читает «Арам», тогда как некоторые текстовые свидетельства, параллель в 1 Паралипоменон 18:12 и географический контекст указывают на «Эдом». Основной перевод следует указанному исходному тексту, не скрывая значимый вариант.
translation_notes:
  register: Современный литературный русский язык; достоинство исторического повествования сохранено. Идиома передана смысловым русским соответствием, а существенное разночтение вынесено в сноску.
