  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: ru
  text: Давид взял золотые щиты[a], принадлежавшие слугам Ададезера, и принёс их в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «щиты из золота». Согласно менее распространённому толкованию еврейского слова — «золотые колчаны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение глагола לקח; контекст военной добычи ясен и без усиления до «захватил».
- source_word: שִׁלְטֵי הַזָּהָב
  choice: золотые щиты
  rationale: Традиционное и наиболее вероятное понимание שׁלטים в контексте военной добычи. Естественное русское сочетание «золотые щиты» передаёт еврейскую конструкцию без тяжеловесности; менее вероятный вариант «колчаны» отмечен в сноске.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: принадлежавшие
  rationale: В данном контексте конструкция выражает принадлежность или обладание, а не только пространственное нахождение.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: слугам Ададезера
  rationale: עבדים здесь, вероятнее всего, обозначает царских слуг или приближённых; нейтральное «слуги» сохраняет широту значения, не уточняя их статус без достаточных оснований.
- source_word: וַיְבִיאֵם
  choice: и принёс их
  rationale: Порода Hiphil глагола בוא обычно означает «принести/привести»; неодушевлённый предмет требует здесь естественного русского «принёс».
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма топонима.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный синтаксис, соответствующий еврейскому оригиналу. Выражение «золотые щиты» выбрано как наиболее естественное, а подлинная лексическая неоднозначность вынесена в сноску.
