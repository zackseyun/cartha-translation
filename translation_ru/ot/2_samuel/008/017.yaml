  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: ru
  text: Садок, сын Ахитува, и Ахимелех, сын Авиафара, были священниками[a], а Сераия — писцом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главными служителями», «царскими сановниками». Некоторые понимают это слово здесь в более широком, придворно-административном смысле, поскольку данный отрывок перечисляет служащих Давида.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «секретарём». Еврейское слово обозначает должностное лицо, отвечавшее за письменные документы и административную работу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Садок
  rationale: Традиционная и узнаваемая русская передача еврейского личного имени.
- source_word: בֶּן
  choice: сын
  rationale: В данном перечне должностных лиц слово естественнее всего указывает на непосредственное сыновство, а не на более широкое происхождение.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: אֲחִימֶלֶךְ
  choice: Ахимелех
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: אֶבְיָתָר
  choice: Авиафар
  rationale: Традиционная и хорошо узнаваемая русская форма еврейского личного имени.
- source_word: כֹּהֲנִים
  choice: священниками
  rationale: Основное и обычное значение еврейского слова — «священники». Контекст перечня царских служащих допускает более широкое административное понимание, которое сохранено в примечании.
- source_word: שְׂרָיָה
  choice: Сераия
  rationale: Устоявшаяся русская передача еврейского личного имени.
- source_word: סוֹפֵר
  choice: писцом
  rationale: В контексте царского двора обозначает должностное лицо, ведавшее письменными документами и административной работой. «Писец» точно сохраняет связь с письмом, а современное пояснение дано в примечании.
theological_decisions:
- issue: Значение כֹּהֲנִים в перечне царских должностных лиц
  choice: священниками
  alternative: главными служителями; царскими сановниками
  rationale: По умолчанию слово означает священников, и контекст не даёт достаточных оснований заменять это значение административным. Реальная лексическая возможность более широкого понимания отмечена в сноске без устранения смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Имена переданы в традиционных русских формах. Конструкция с «были» и именной частью «писцом» естественно оформляет краткий перечень должностей; тире во второй части устраняет ненужный повтор.
