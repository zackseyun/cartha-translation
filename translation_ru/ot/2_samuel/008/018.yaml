base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: ru
  text: Беная, сын Иехояды, начальствовал над керетеями и пелетеями, а сыновья Давида были священниками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главными служителями»; «царскими сановниками». Еврейское слово обычно означает «священники», но некоторые понимают его здесь в более широком, придворном смысле, поскольку речь идёт о царском управлении.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Беная, сын Иехояды
  rationale: Имена переданы близко к еврейскому звучанию и в естественной для русского языка форме.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: над керетеями и пелетеями
  rationale: Названия двух групп транслитерированы без уточнения их этнического или военного статуса. Предлог «над» связан с восстановленным по контексту сказуемым.
- source_word: כֹּהֲנִים
  choice: священниками
  rationale: Сохранено обычное и прямое значение еврейского слова; возможное придворное значение вынесено в сноску, чтобы не устранять напряжение текста.
- source_word: הָיוּ
  choice: были
  rationale: Передано обычное значение связочного глагола; вариант «служили как» был бы более истолковывающим.
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: Беная... начальствовал над керетеями и пелетеями
  rationale: В масоретском тексте сказуемое здесь не выражено. «Начальствовал над» естественно восполняет эллипсис в перечне царских должностных лиц и соответствует параллельному сообщению во 2 Царств 20:23.
theological_decisions:
- issue: Смысл утверждения, что сыновья Давида были כֹּהֲנִים
  choice: 'В основном тексте: «были священниками»'
  alternative: «были главными служителями» или «были царскими сановниками»
  rationale: Прямое лексическое значение сохранено, хотя оно создаёт историко-богословское напряжение, поскольку сыновья Давида не принадлежали к священническому роду. Контекстуальное придворное толкование указано в сноске, а не подставлено вместо неоднозначного текста.
- issue: Невыраженное сказуемое при Бенае и двух группах
  choice: 'Восстановить: «начальствовал над»'
  alternative: Формально сохранить бессоюзное перечисление без сказуемого
  rationale: Русское предложение требует явной синтаксической связи. Контекст перечня должностных лиц и параллель во 2 Царств 20:23 поддерживают это восполнение, не уточняя конкретную должность Бенаи сверх текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным синтаксисом. Имена и названия групп переданы близко к еврейской форме; неоднозначность слова כֹּהֲנִים сохранена в основном тексте и пояснена в сноске.
