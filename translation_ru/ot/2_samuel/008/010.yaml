  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: ru
  text: Тогда Тои послал своего сына Иорама к царю Давиду, чтобы осведомиться о его благополучии и благословить его[a] за то, что тот сразился с Ададезером и разбил его, ведь Ададезер воевал с Тои. При Иораме были[b] серебряные, золотые и бронзовые изделия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном дипломатическом контексте «благословить» может также означать «поздравить».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и в его руке были»; то есть эти предметы были при нём.'
    reason: literal_idiom
lexical_decisions:
- source_word: וַיִּשְׁלַח תֹּעִי אֶת יוֹרָם בְּנוֹ
  choice: Тогда Тои послал своего сына Иорама
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; «тогда» естественно передаёт её по-русски. Порядок «своего сына Иорама» соответствует нормальному современному русскому синтаксису.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: чтобы осведомиться о его благополучии
  rationale: Еврейское идиоматическое выражение означает узнать, всё ли у человека хорошо; перевод сохраняет смысл и дипломатически-торжественный регистр.
- source_word: וּלְבָרֲכוֹ
  choice: и благословить его
  rationale: Сохранено основное значение корня ברך. В дипломатическом контексте выражение может также подразумевать поздравление, что отмечено в сноске.
- source_word: נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: сразился с Адад-Эзером и разбил его
  rationale: Предлог ב обозначает здесь противника, а נכה в военном контексте указывает на нанесение поражения; «разбил» передаёт результат без утверждения, что Адад-Эзер был убит.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: ведь Адад-Эзер воевал с Тои
  rationale: Сжатая конструкция буквально описывает Адад-Эзера как «человека войн Тои». Естественный русский перевод передаёт устойчивую вражду, не вводя лишнего титула или характеристики.
- source_word: וּבְיָדוֹ הָיוּ
  choice: Иорам принёс с собой
  rationale: 'Буквально: «и в его руке были». В контексте речь о предметах, доставленных посланником; явное имя устраняет неясность русского местоимения, а буквальный образ указан в сноске.'
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: серебряные, золотые и бронзовые изделия
  rationale: כְּלִי — широкое обозначение предмета, сосуда или изделия. «Изделия» сохраняет неопределённость их вида; נְחֹשֶׁת в данном контексте передано как «бронза».
