revisions:
- from: Тогда Тои послал своего сына Иорама к царю Давиду, чтобы осведомиться о его благополучии и благословить его[a] за то, что тот сразился с Адад-Эзером и разбил его, ведь Адад-Эзер воевал с Тои. Иорам принёс с собой[b] серебряные, золотые и бронзовые изделия.
  to: Тогда Тои послал своего сына Иорама к царю Давиду, чтобы осведомиться о его благополучии и благословить его[a] за то, что тот сразился с Ададезером и разбил его, ведь Ададезер воевал с Тои. При Иораме были[b] серебряные, золотые и бронзовые изделия.
  rationale: Уточнена только последняя фраза, чтобы не превращать подразумеваемое наличие предметов при Иораме в прямо выраженное действие их доставки. Имя Ададезер приведено к обычной современной русской библейской форме. Сноски сохранены на тех же смысловых местах; сноска b теперь поясняет буквальный образ без дополнительного утверждения о доставке.
