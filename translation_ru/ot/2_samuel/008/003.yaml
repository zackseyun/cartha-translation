- source_word: מֶלֶךְ צוֹבָה
  choice: царя Совы
  rationale: Сопряжённая конструкция передана естественным русским сочетанием; географическое название транслитерировано в традиционной библейской форме.
- source_word: בְּלֶכְתּוֹ
  choice: когда тот пошёл
  rationale: Инфинитивная конструкция с ב выражает временное обстоятельство. Местоимение «тот» ясно указывает на Ададезера и устраняет неестественную для русского синтаксическую двусмысленность.
- source_word: לְהָשִׁיב יָדוֹ
  choice: восстановить свою власть
  rationale: Буквально «вернуть свою руку»; «рука» здесь является идиомой власти или контроля. Формулировка сохраняет некоторую широту значения и остаётся понятной современному читателю.
- source_word: בִּנְהַר
  choice: у Реки
  rationale: Абсолютное употребление «Реки» в данном контексте, вероятнее всего, указывает на Евфрат. Основной текст сохраняет форму источника, а вероятное отождествление дано в сноске.
