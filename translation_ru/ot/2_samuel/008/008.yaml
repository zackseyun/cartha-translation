base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: ru
  text: А из Бетаха и Беротая[a], городов Хадад-Эзера, царь Давид взял чрезвычайно много бронзы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном рассказе, 1 Пар. 18:8, эти места названы Тивхатом и Куном; еврейский текст данного стиха называет их Бетахом и Беротаем.
    reason: cross_reference
  - marker: b
    text: 'Или: «меди»; еврейское слово может обозначать как медь, так и бронзу — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  choice: А из Бетаха
  rationale: Союз и предлог переданы естественным русским оборотом «а из»; форма названия следует масоретскому тексту данного стиха.
- source_word: וּמִבֵּרֹתַי
  choice: и Беротая
  rationale: Название транслитерировано по еврейской форме בֵּרֹתַי; после предлога «из» употреблён родительный падеж.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: городов Адад-Эзера
  rationale: Сопряжённая конструкция обозначает города, принадлежавшие Адад-Эзеру или находившиеся под его властью.
- source_word: לָקַח
  choice: взял
  rationale: Сохранено основное значение глагола без уточнения, было ли это изъятием добычи или захватом самого металла.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Естественная для русского языка передача титула с именем.
- source_word: נְחֹשֶׁת
  choice: бронзы
  rationale: В данном историческом контексте традиционное и вероятное значение — «бронза», хотя еврейское слово может также обозначать медь.
- source_word: הַרְבֵּה מְאֹד
  choice: чрезвычайно много
  rationale: Передаёт сильное количественное усиление буквально и естественно для современного русского языка.
