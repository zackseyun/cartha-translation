  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: ru
  text: Тогда Авенир, сын Нира, и слуги Иевосфея[a], сына Саула, вышли из Маханаима в Гаваон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Иш-Бошет; тот же человек назван Эшбаалом в 1 Паралипоменон 8:33; 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Тогда ... вышли
  rationale: Последовательный waw продолжает повествование, поэтому «тогда» естественно передаёт развитие событий. Хотя еврейский глагол стоит в единственном числе, далее следует составное подлежащее — Авенир и слуги, — поэтому по-русски требуется множественное число.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Авенир, сын Нира
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; патроним передан прямо.
- source_word: וְעַבְדֵי
  choice: и слуги
  rationale: Слово עֶבֶד может обозначать слуг, служителей или состоящих при правителе людей. «Слуги» сохраняет широкое значение оригинала и не уточняет без достаточных оснований их воинский или придворный статус.
- source_word: אִישׁ בֹּשֶׁת
  choice: Иевосфея
  rationale: Масоретский текст содержит имя Иш-Бошет; в основном тексте использована его традиционная русская библейская форма «Иевосфей». Отличающаяся форма имени в Паралипоменоне отмечена в сноске.
- source_word: בֶּן שָׁאוּל
  choice: сына Саула
  rationale: Патроним переведён буквально и сохраняет отождествление Иевосфея как сына Саула.
- source_word: מִמַּחֲנַיִם
  choice: из Маханаима
  rationale: Предлог מִן обозначает исходный пункт движения; географическое название передано принятой русской формой.
- source_word: גִּבְעֹנָה
  choice: в Гаваон
  rationale: Направительное окончание указывает на движение к Гаваону. Русское «в Гаваон» естественно выражает направление без добавочного уточнения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского языка, при этом сохранены последовательность участников, родственные обозначения и направление движения. Традиционные русские формы личных и географических имён сочетаются с более точной передачей еврейских форм в сноске.
