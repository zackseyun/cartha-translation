  text: Асаил преследовал Авенира и, следуя за ним, не сворачивал ни вправо, ни влево.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: преследовал
  rationale: Глагол רדף обозначает активное и продолжающееся преследование; «преследовал» естественно передаёт это в повествовательном контексте.
- source_word: אַחֲרֵי אַבְנֵר
  choice: Авенира
  rationale: При русском глаголе «преследовать» объект ставится в винительном падеже без предлога; значение следования за кем-либо сохраняется.
- source_word: וְלֹא נָטָה לָלֶכֶת
  choice: не сворачивал
  rationale: נטה в данном контексте означает отклонение от направления движения. Несовершенный вид передаёт продолжительность действия во время погони.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: ни вправо, ни влево
  rationale: Это естественный русский эквивалент устойчивого древнееврейского выражения, обозначающего отсутствие отклонения от пути.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: следуя за ним
  rationale: Фраза буквально указывает на движение позади Авенира и продолжение преследования. Местоимение устраняет тяжеловесный повтор имени, не меняя референции.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: Асаил / Авенир
  rationale: Использованы традиционные русские библейские формы личных имён, узнаваемые читателями и уместные в литературном переводе.
