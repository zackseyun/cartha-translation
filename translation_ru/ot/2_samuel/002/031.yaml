  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: ru
  text: А слуги Давида поразили триста шестьдесят человек из колена Вениамина и из людей Авенира — все они погибли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И слуги Давида поразили…» Еврейский союз можно передать просто как «и»; в основном тексте употреблено «а», поскольку этот стих сопоставляет потери противной стороны с потерями Давида в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: А слуги Давида
  rationale: Союз וְ в данном контексте передаёт сопоставление с потерями Давида в предыдущем стихе; «а» естественно выражает этот оттенок, не усиливая его до резкого противопоставления. עֲבָדִים здесь обозначает находившихся на службе у Давида воинов, поэтому выбрано «слуги», а не «рабы».
- source_word: הִכּוּ
  choice: поразили
  rationale: Глагол נכה в военном контексте означает нанесение поражения или смертельного удара. «Поразили» сохраняет самостоятельное значение глагола, тогда как последующее מֵתוּ прямо указывает на смерть.
- source_word: מִ/בִּנְיָמִן
  choice: из колена Вениамина
  rationale: Предлог מִן указывает, из какой группы были погибшие. Добавление «колена» делает племенное значение Вениамина ясным современному русскому читателю.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: и из людей Авенира
  rationale: Сочетание обозначает людей, принадлежавших к войску или стороне Авенира. Русское «из людей Авенира» естественно согласуется с подсчётом потерь и сохраняет формулировку источника.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: триста шестьдесят человек
  rationale: Прямой и естественный перевод числительного с אִישׁ; «человек» подходит для подсчёта воинов.
- source_word: מֵתוּ
  choice: все они погибли
  rationale: Источник отдельно сообщает, что эти люди умерли. «Погибли» естественно для смерти в бою, а «все они» ясно связывает сказуемое со всеми тремястами шестьюдесятью, не сливая מֵתוּ с הִכּוּ.
