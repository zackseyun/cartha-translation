  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: ru
  text: Иоав и Авесса преследовали Авенира, и солнце зашло; они дошли до холма Амма, расположенного напротив Гиаха[a], по дороге в Гаваонскую пустыню[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Гиахом»; древнееврейское выражение может обозначать положение перед каким-либо местом или напротив него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у дороги в Гаваонскую пустыню»; древнееврейский текст может подчёркивать сам маршрут, а не только направление движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: преследовали Авенира
  rationale: Глагол רדף с אַחֲרֵי в военном повествовании обозначает погоню; русское «преследовали» естественно и точно передаёт смысл.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: Солнце уже заходило
  rationale: Буквально «солнце пришло» — древнееврейская идиома заката. Несовершенный вид естественно передаёт фоновое обстоятельство, сопутствующее прибытию.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: когда они дошли до
  rationale: עַד указывает на предел движения; «дошли до» ясно обозначает достигнутую точку. Связь через «когда» естественно выражает одновременность событий, не меняя их последовательности.
- source_word: גִּבְעַת אַמָּה
  choice: холма Амма
  rationale: Сочетание существительного с собственным именем передано принятой русской географической конструкцией.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: расположенного напротив Гиаха
  rationale: עַל־פְּנֵי может означать положение перед чем-либо или напротив него; основной текст использует естественное географическое «напротив», а неоднозначность отмечена в сноске.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: по дороге в Гаваонскую пустыню
  rationale: דֶּרֶךְ может обозначать дорогу или путь; выражение передано как указание маршрута к пустынной местности, связанной с Гаваоном.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: Иоав / Авесса / Авенир / Амма / Гиах / Гаваон
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, понятные современному читателю.
