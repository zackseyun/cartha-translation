revisions:
- from: 'И они встали и перешли[a], по числу: двенадцать за Вениамина[b] и за Иевосфея[c], сына Саула, и двенадцать из слуг Давида[d].'
  to: 'Они встали и перешли[a] в количестве: двенадцать со стороны Вениамина и Иевосфея[c], сына Саула, и двенадцать из слуг Давида[d].'
  rationale: Перевод уточнён ради современного естественного русского языка и более ясного выражения синтаксической роли числительного. «Со стороны Вениамина и Иевосфея» передаёт вероятное значение предлога ל как указания на сторону, оставляя в сноске возможность понимания как происхождения. Имя, термин «слуги» и симметрия двух групп сохранены. Сноска b сохранена в наборе как значимое лексическое примечание, но её маркер не ставится в основном тексте, поскольку основной вариант «со стороны» уже выражает решение перевода; это соответствует исходной практике, где не все доступные сноски обязательно привязаны к слову, но при необходимости редакционная система может привязать [b] к «Вениамина».
  reviewer_model: gpt-5.6-terra
