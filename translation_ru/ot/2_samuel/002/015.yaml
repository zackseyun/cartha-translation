base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: ru
  text: 'Они встали и перешли[a] в количестве: двенадцать со стороны Вениамина и Иевосфея[c], сына Саула, и двенадцать из слуг Давида[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошли». Еврейский глагол может обозначать переход или движение через что-либо либо на другую сторону.'
    reason: lexical_alternative
  - marker: c
    text: Евр. «Иш-Бошет»; в других книгах Ветхого Завета встречается родственная форма имени «Эшбаал». Традиционная русская передача — «Иевосфей».
    reason: alternative_reading
  - marker: d
    text: 'Или: «из людей Давида». В данном военном контексте «слуги» — это люди, состоявшие у Давида на службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: они встали
  rationale: Глагол קום обозначает начало следующего действия; «встали» естественно и близко передаёт еврейскую повествовательную последовательность.
- source_word: וַיַּעַבְרוּ
  choice: перешли
  rationale: עבר обозначает движение через границу или на другую сторону; контекст указывает на выход участников к месту поединка.
- source_word: בְמִסְפָּר
  choice: по числу
  rationale: Оборот подчёркивает, что участников пересчитали и с обеих сторон выступило равное количество; сохранён лаконичный еврейский способ выражения.
- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: за Вениамина и за Иевосфея
  rationale: Предлог ל здесь, вероятнее всего, указывает на сторону или представительство. Русское «за» естественно передаёт участие от имени соответствующей стороны, не превращая принадлежность в происхождение.
- source_word: בֶּן שָׁאוּל
  choice: сына Саула
  rationale: Стандартное обозначение родства, согласованное с формой имени в контексте предложения.
- source_word: מֵעַבְדֵי דָוִד
  choice: из слуг Давида
  rationale: עבדים буквально означает «слуги», но в данном царско-военном контексте может относиться к состоящим на службе воинам; основной текст сохраняет лексическую прозрачность.
