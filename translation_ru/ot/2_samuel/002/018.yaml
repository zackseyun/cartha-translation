- source_word: קַל בְּרַגְלָיו
  choice: был быстроног
  rationale: Краткое и естественное русское выражение передаёт быстроту бега и сохраняет образ, связанный с ногами.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: как одна из газелей
  rationale: צְבִי здесь вероятнее всего обозначает газель — животное, известное быстротой; грамматический род согласован с русским словом «газель».
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: обитающих в поле
  rationale: Передаёт указание на диких животных в их открытой природной среде без ненужного расширения смысла.
