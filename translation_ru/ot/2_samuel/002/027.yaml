  source_fidelity: 'В основном верно переданы клятвенная формула и нереальное условие. Однако «лишь утром» меняет значение מֵהַבֹּקֶר: это не обязательно указание, что погоня продолжалась бы до утра, а скорее время, с которого люди уже прекратили бы преследование. «Прекратили бы преследовать» контекстуально оправдано, но следует яснее сохранить временной смысл и индивидуальное «каждый — своего брата».'
  naturalness: «Жив Бог!» и условная конструкция звучат естественно в современном литературном русском. Формулировка «люди лишь утром прекратили бы» двусмысленна и чрезмерно акцентирует отсрочку; «люди уже утром отошли бы» естественнее в данном контексте.
  terminology: Имена и ключевая клятвенная формула переданы удачно. «Брат» следует сохранить в единственном числе как образ исходного выражения, не уточняя конфессионально или этнически сверх текста.
