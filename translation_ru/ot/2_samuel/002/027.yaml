base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: ru
  text: 'Иоав ответил: «Жив Бог! Если бы ты не заговорил, то люди уже утром отошли бы, каждый прекратив преследовать своего брата[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то с утра народ поднялся бы, каждый — от своего брата». Глагол «поднялся бы» в военном контексте может означать отход; выражение «от своего брата» — прекращение преследования.'
    reason: Сохраняет буквальный образ еврейского текста и поясняет контекстуальное понимание глагола נַעֲלָה и оборота מֵאַחֲרֵי אָחִיו.
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: Жив Бог!
  rationale: Устойчивая формула клятвы; сохраняет образ и звучит естественно и торжественно по-русски.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: Если бы ты не заговорил
  rationale: Передаёт нереальное условие в прошедшем времени. «Заговорил» естественно выражает то, что Авенир вмешался словами, не добавляя конкретного объекта речи.
- source_word: כִּי אָז מֵהַבֹּקֶר
  choice: лишь утром
  rationale: В контексте ответ Иоава означает, что без слов Авенира погоня не прекратилась бы до утра. Частицы כִּי אָז вводят следствие, а מֵהַבֹּקֶר обозначает утро как рубеж; неоднозначность конструкции отмечена в сноске.
- source_word: נַעֲלָה
  choice: прекратили бы
  rationale: Основное значение עלה — «подниматься, уходить вверх», но здесь военный контекст указывает на отход и прекращение погони. В русском буквальное «поднялись бы» не передаёт ясного смысла.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: преследовать своих братьев
  rationale: 'Буквально: «каждый — вслед за своим братом»; в данном повествовании речь идёт о прекращении преследования соплеменников-израильтян. Множественное «своих братьев» естественно согласуется с собирательным «люди».'
