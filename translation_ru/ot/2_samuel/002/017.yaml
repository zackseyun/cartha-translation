  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: ru
  text: В тот день битва была чрезвычайно жестокой, и Авенир с воинами Израиля потерпели поражение от слуг Давида.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть от людей, состоявших на службе у Давида, в данном случае — от его воинов.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: битва
  rationale: В данном повествовательном контексте речь идёт о конкретном сражении, а не о продолжительной войне.
- source_word: קָשָׁה עַד מְאֹד
  choice: чрезвычайно жестокой
  rationale: Сочетание описывает крайнюю тяжесть и ожесточённость сражения; такой перевод естественен по-русски и передаёт усиление עַד מְאֹד.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямой и естественный перевод обычного еврейского обстоятельства времени.
- source_word: וַיִּנָּגֶף
  choice: потерпели поражение
  rationale: Нифаль глагола נָגַף в военном контексте обозначает поражение от противника; множественное число согласовано по нормам русского языка с составным субъектом.
- source_word: אַבְנֵר
  choice: Авенир
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: с воинами Израиля
  rationale: Буквально выражение означает «мужи Израиля», но в непосредственном контексте обозначает людей, участвующих в сражении; «воины» ясно и естественно передаёт этот смысл.
- source_word: לִפְנֵי
  choice: от
  rationale: В формуле военного поражения русский предлог «от» естественно обозначает противостоящую сторону, сохраняя смысл еврейского выражения.
- source_word: עַבְדֵי דָוִד
  choice: слуг Давида
  rationale: Сохраняет исходное обозначение людей, состоявших на службе у Давида, не сводя его исключительно к термину «воины».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Порядок слов слегка перестроен ради естественности; военная лексика передаёт контекст ясно, а слово «слуги» сохраняет связь с עַבְדֵי.
