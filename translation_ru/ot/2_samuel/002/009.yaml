  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: ru
  text: и поставил его царём над Галаадом, ашуритами[a], Изреелем, Ефремом, Вениамином и всем Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «ашуритами». Некоторые понимают это как «Асир», то есть как обозначение колена или области Асира.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: и поставил его царём
  rationale: Порода хифиль глагола מלך с местоименным суффиксом означает возвести или поставить кого-либо царём; выбранная формулировка естественно передаёт каузативный смысл.
- source_word: אֶל / עַל
  choice: над
  rationale: При глаголе поставления царём и названиях областей и народов оба предлога в данном контексте обозначают сферу царской власти; русское «над» передаёт это единообразно и естественно.
- source_word: הַגִּלְעָד
  choice: Галаадом
  rationale: Устоявшаяся русская передача названия области.
- source_word: הָאֲשׁוּרִי
  choice: ашуритами
  rationale: Масоретская огласовка указывает на этноним в единственном числе с собирательным значением. Неясность формы сохранена, а распространённое понимание как названия колена или области Асира вынесено в примечание.
- source_word: יִזְרְעֶאל
  choice: Изреелем
  rationale: Устоявшаяся русская передача географического названия.
- source_word: אֶפְרַיִם
  choice: Ефремом
  rationale: Устоявшаяся русская форма названия колена и его территории.
- source_word: בִּנְיָמִן
  choice: Вениамином
  rationale: Устоявшаяся русская форма названия колена и его территории.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: всем Израилем
  rationale: Форма כֻּלֹּה подчёркивает полноту охвата; «всем Израилем» кратко и точно сохраняет этот смысл.
