base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: ru
  text: Каждый схватил противника за голову, а меч его — в боку противника; и они пали вместе. Поэтому то место в Гивоне назвали Хелкат-Хаццуримом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хелкат-Хаццурим — передача еврейского названия места. Его точное значение неясно; среди предлагаемых переводов — «Поле боков», «Поле острых мечей» и другие близкие варианты.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ
  choice: Каждый схватил
  rationale: 'Глагол חזק в данной боевой сцене обозначает сильную, насильственную хватку; сочетание с אִישׁ имеет распределительное значение: так поступил каждый из участников.'
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: своего противника за голову
  rationale: רֹאשׁ передано буквально как «голова», а רֵעַ в контексте поединка обозначает стоящего напротив участника пары, а не обязательно друга или товарища.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: и вонзил меч ему в бок
  rationale: В еврейском тексте оборот намеренно сжат и не содержит выраженного глагола. В русском для ясности требуется восполнить действие; «вонзил» естественно передаёт боевой контекст, а צַד — «бок».
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: так что они пали вместе
  rationale: יַחְדָּו подчёркивает совместность или одновременность падения; «так что» естественно выражает результат предшествующего взаимного удара.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Поэтому то место ... назвали
  rationale: Форма единственного числа имеет неопределённого деятеля и по-русски естественно передаётся неопределённо-личной конструкцией; «поэтому» показывает связь названия с происшедшим.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Хелкат-Хаццуримом
  rationale: Спорное по смыслу географическое название передано транслитерацией, чтобы не закреплять одну из нескольких возможных этимологий.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: то место в Гивоне
  rationale: Относительное определение естественно встроено в русское предложение и указывает местонахождение названного участка.
