  terminology: Традиционные формы имён Иоав, Авенир, Давид и Асаил выдержаны. «Слуги Давида» сохраняет лексическую связь с עֲבָדִים; «воины» в предыдущей фразе уместно передаёт военный референт עָם, не добавляя притяжательного определения.
