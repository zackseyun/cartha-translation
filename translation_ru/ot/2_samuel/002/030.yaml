revisions:
- from: Иоав вернулся с погони за Авениром и собрал всех своих людей. При перекличке оказалось, что из слуг Давида не хватает девятнадцати человек, не считая Асаила[a].
  to: Иоав вернулся, прекратив погоню за Авениром, и собрал всех воинов. При перекличке недосчитались девятнадцати слуг Давида, не считая Асаила[a].
  rationale: Исправление устраняет невыраженное в оригинале «своих» и несколько упрощает синтаксис. «Всех воинов» отражает военный референт слова עָם в непосредственном контексте сражения. Сноска сохранена, поскольку поверхностное чтение еврейского «девятнадцать человек и Асаил» может создать неясность относительно того, входит ли Асаил в число девятнадцати.
