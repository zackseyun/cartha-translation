  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: ru
  text: Иоав вернулся, прекратив погоню за Авениром, и собрал всех воинов. При перекличке недосчитались девятнадцати слуг Давида, не считая Асаила[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «девятнадцать человек и Асаил»; Асаил назван в дополнение к девятнадцати.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: вернулся с погони за Авениром
  rationale: שׁוב означает «вернуться», а сочетание מֵאַחֲרֵי в данном военном контексте указывает на возвращение после преследования. Формулировка передаёт и движение назад, и прекращение погони.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: и собрал всех своих людей
  rationale: עָם буквально значит «народ, люди», но здесь обозначает отряд Иоава. «Всех своих людей» естественно для современного русского повествования и не сужает значение до формального войскового подразделения.
- source_word: וַיִּפָּקְדוּ
  choice: при перекличке оказалось, что … не хватает
  rationale: Нифаль глагола פקד с последующим מִן в этом контексте означает, что при подсчёте обнаружилось отсутствие людей. «При перекличке» естественно передаёт военный подсчёт после боя.
- source_word: מֵעַבְדֵי דָוִד
  choice: из слуг Давида
  rationale: עֲבָדִים буквально означает «слуги» и в царско-военном контексте включает людей, состоявших на службе у Давида. Сохранено лексически прозрачное «слуги».
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: девятнадцати человек
  rationale: Прямое и естественное соответствие числительному и существительному אִישׁ в контексте подсчёта потерь.
- source_word: וַעֲשָׂה אֵל
  choice: не считая Асаила
  rationale: В представленной огласовке имя עֲשָׂהאֵל графически разделено; по смыслу это «и Асаил» как дополнительная потеря сверх девятнадцати. Русское «не считая Асаила» ясно выражает это отношение.
