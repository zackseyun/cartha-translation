lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: и людей, которые были с ним
  rationale: Передаёт личный мужской референт и относительное определение без избыточного русского сочетания «своих людей, которые были с ним».
- source_word: הֶעֱלָה
  choice: привёл туда
  rationale: В породе hифиль глагол означает «поднять, привести наверх». В контексте движения к Хеврону, расположенному в нагорье, речь идёт о приведении людей к уже названному месту; «туда» естественно связывает стих с предыдущим, тогда как буквальное «поднял» по-русски могло бы быть понято неверно.
- source_word: אִישׁ וּבֵיתוֹ
  choice: каждого с его домочадцами
  rationale: Распределительное אִישׁ указывает на каждого мужчину отдельно, а בֵּיתוֹ здесь обозначает его домашнее сообщество, а не здание.
- source_word: וַיֵּשְׁבוּ
  choice: и они поселились
  rationale: В контексте переселения ישב означает не просто пребывание, а устройство на постоянное или длительное жительство.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: в городах Хеврона
  rationale: Сохраняется множественное число עָרֵי и связь населённых пунктов с Хевроном; возможное территориальное понимание пояснено в сноске.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Употреблена закрепившаяся в современной русской библейской традиции форма имени.
