  text: וַ/יֹּ֤אמֶר אַבְנֵר֙ אֶל יוֹאָ֔ב יָק֤וּמוּ נָא֙ הַ/נְּעָרִ֔ים וִֽ/ישַׂחֲק֖וּ לְ/פָנֵ֑י/נוּ וַ/יֹּ֥אמֶר יוֹאָ֖ב יָקֻֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: ru
  text: 'Тогда Авнер сказал Иоаву: «Пусть юноши выйдут и померятся силами у нас на глазах[a]». Иоав ответил: «Пусть выйдут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поиграют перед нами». Употреблённый здесь еврейский глагол обычно означает «играть», «забавляться» или «насмехаться», но в данном контексте речь идёт о состязании, которое становится смертельной схваткой.'
    reason: Примечание сохраняет необычный игровой оттенок еврейского глагола и не скрывает его смысловую напряжённость.
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: юноши
  rationale: Сохраняет обычное значение слова — молодые мужчины; из ближайшего контекста становится ясно, что это воины.
- source_word: וִישַׂחֲקוּ
  choice: померятся силами
  rationale: В данном повествовательном контексте глагол описывает состязание, которое переходит в смертельную схватку. Формулировка передаёт соревновательный оттенок, не называя происходящее заранее просто боем.
- source_word: לְפָנֵינוּ
  choice: у нас на глазах
  rationale: Естественно передаёт буквальное «перед нами» в значении действия в присутствии и на виду у Авнера и Иоава.
- source_word: יָקוּמוּ
  choice: выйдут
  rationale: В контексте вызова участников вперёд русское «выйдут» естественнее буквального «встанут» и сохраняет движение к месту состязания.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; реплики краткие и сдержанные. Выражение «померятся силами» звучит естественно и сохраняет зловещую двусмысленность предложения Авнера.
