  rationale: 'Исправлены только безопасные, необходимые места: сноска теперь точно передаёт синтаксическое отношение «вернуться от следования за», а «скажешь народу» не усиливает значение исходного глагола. Остальная формулировка сохранена, поскольку она верно передаёт еврейский текст и выдержана в современном литературном библейском регистре.'
