base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: ru
  text: 'Тогда Авенир воззвал к Иоаву: «Неужели меч будет пожирать вечно? Разве ты не знаешь, что конец будет горьким? Сколько ещё ты будешь медлить, прежде чем скажешь народу повернуть назад и перестать преследовать своих братьев[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вернуться от следования за своими братьями»; в данном контексте: «перестать преследовать своих братьев».'
    reason: Лָשׁוּב означает «вернуться, повернуть назад», а מֵאַחֲרֵי — «от следования за». Контекст столкновения делает смысл прекращения преследования наиболее вероятным, но буквальный вариант сохраняет исходный образ.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: воззвал к
  rationale: Глагол обозначает громкий призыв на расстоянии; «воззвал к» передаёт военную сцену и сохраняет достоинство повествования.
- source_word: הֲלָנֶצַח
  choice: неужели ... вечно
  rationale: Риторический вопрос выражает протест против кажущегося бесконечным продолжения боя; «вечно» естественно и точно передаёт לָנֶצַח.
- source_word: תֹּאכַל חֶרֶב
  choice: меч будет пожирать
  rationale: Сохранена яркая персонификация меча как пожирающего людей; буквальное «есть» по-русски менее естественно, а «пожирать» точно передаёт образ.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: конец будет горьким
  rationale: Формулировка сохраняет метафору горечи и указывает на тяжёлый итог продолжения кровопролития, не уточняя сверх текста, в чём именно он будет состоять.
- source_word: וְעַד מָתַי לֹא תֹאמַר
  choice: сколько ещё ты будешь медлить, прежде чем велишь
  rationale: 'Еврейская конструкция буквально спрашивает: «до каких пор ты не скажешь». Русская формулировка естественно выражает подразумеваемую задержку; «велишь» передаёт косвенное повеление в военной обстановке.'
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: повернуть назад и перестать преследовать
  rationale: שׁוּב означает повернуть/возвратиться, а מֵאַחֲרֵי в данном боевом контексте — прекратить движение следом за противником. Сочетание ясно передаёт и изменение направления, и прекращение погони.
- source_word: אֲחֵיהֶם
  choice: своих братьев
  rationale: 'Буквальное «братьев» сохраняет эмоциональную и родственную силу обращения: израильтяне сражаются с собратьями, а не с чужеземцами.'
theological_decisions:
- issue: Кого называет «братьями» Авенир
  choice: сохранить буквальное «своих братьев» без пояснения в тексте
  alternative: «своих соплеменников» или «других израильтян»
  rationale: Исходный текст подчёркивает братство противоборствующих сторон. Более пояснительные варианты ослабили бы образ и добавили бы толкование.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Имена переданы в традиционной русской библейской форме: Авенир, Иоав. Метафоры меча и горького конца сохранены; синтаксис последнего вопроса слегка перестроен ради естественности и ясности.'
