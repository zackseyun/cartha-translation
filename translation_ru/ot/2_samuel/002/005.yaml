  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: ru
  text: 'И послал Давид вестников к мужчинам из Иависа-Галаада и сказал им: «Да благословит вас Яхве за то, что вы оказали эту милость вашему господину, Саулу, и похоронили его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В повествовательном контексте речь идёт о людях, посланных Давидом; «вестники» ясно передаёт эту функцию.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: жителям Иависа Галаадского
  rationale: Буквально «мужам Иависа Галаадского»; в данном обращении естественное русское «жителям» обозначает представителей городской общины без изменения референта.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Благословенны вы у Яхве
  rationale: Пассивное причастие передано как утверждение, а не пожелание. Необычное לַיהוָה допускает понимание отношения к Яхве; альтернативное инструментальное понимание отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: חֶסֶד
  choice: милость
  rationale: Здесь слово обозначает конкретный поступок преданной доброты по отношению к Саулу; «милость» сохраняет нравственную и лояльную окраску слова.
- source_word: אֲדֹנֵיכֶם עִם שָׁאוּל
  choice: вашему господину Саулу
  rationale: Повторное עִם связывает пояснение «Саулу» с «вашему господину»; русское приложение естественно выражает тождество этих обозначений.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: и похоронили его
  rationale: Передаёт завершённый поступок, за который Давид хвалит жителей Иависа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Смысл формулы בְּרֻכִים אַתֶּם לַיהוָה
  choice: Благословенны вы у Яхве
  alternative: Благословенны вы Яхве
  rationale: Дательный предлог ל допускает более одного синтаксического оттенка. Основной текст сохраняет формулу с отношением к Яхве, а сноска сообщает распространённое понимание Яхве как деятеля благословения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Топоним оформлен в традиционной русской библейской форме «Иавис Галаадский»; синтаксис упрощён без устранения неоднозначности формулы благословения.
