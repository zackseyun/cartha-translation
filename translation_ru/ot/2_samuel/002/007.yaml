base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: ru
  text: А теперь пусть будут крепки ваши руки[a], и будьте доблестными мужами, ведь ваш господин Саул умер. И меня также дом Иуды помазал царём над собой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть будут крепки ваши руки»; это призыв ободриться, набраться решимости и быть готовыми действовать.'
    reason: Поясняет еврейскую идиому при сохранении её образа в основном тексте.
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: В отличие от английского консультационного текста, еврейский источник содержит явное וְעַתָּה («и теперь»). В русском «А теперь» естественно передаёт переход к призыву.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: пусть укрепятся ваши руки
  rationale: Сохранён конкретный еврейский образ рук как выражение решимости и способности действовать; форма передаёт побудительное значение.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: и будьте доблестными мужами
  rationale: בְּנֵי חַיִל обозначает мужественных, способных и отважных мужчин, нередко в военном контексте. «Доблестные мужи» сохраняет мужской род и возвышенный, но понятный регистр.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: ведь ваш господин Саул умер
  rationale: כִּי вводит основание призыва, естественно передаваемое словом «ведь». אֲדֹנֵיכֶם здесь является человеческим политическим титулом, а не именованием Бога.
- source_word: וְגַם אֹתִי
  choice: И меня также
  rationale: Порядок слов сохраняет выделение Давида как объекта помазания, а «также» передаёт добавочное значение גַּם.
- source_word: מָשְׁחוּ בֵית יְהוּדָה
  choice: дом Иуды помазал
  rationale: Сохранено коллективное обозначение «дом Иуды» и церемониально-политический смысл глагола «помазать».
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: царём над собой
  rationale: Возвратное «над собой» естественно согласует русский текст с собирательным единственным числом «дом Иуды» и передаёт отношение власти.
theological_decisions:
- issue: Значение אֲדֹנֵיכֶם применительно к Саулу
  choice: ваш господин
  alternative: ваш владыка; ваш правитель
  rationale: Это почтительное обозначение Саула как земного государя. Строчная буква и контекст не допускают смешения с божественным титулом.
- issue: Мужской образ в לִבְנֵי חַיִל
  choice: доблестными мужами
  alternative: мужественными; храбрыми людьми
  rationale: В исходном выражении грамматически и контекстуально представлены мужчины, вероятно способные к военному действию; перевод не нейтрализует этот смысл.
- issue: Субъект помазания Давида
  choice: дом Иуды помазал меня
  alternative: люди Иуды помазали меня
  rationale: Сохранён корпоративный образ «дома Иуды», не уточняя сверх текста, кто именно совершил помазание.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Конструкция «дом Иуды» сохранена как важный корпоративный образ; «доблестные мужи» понятно передаёт воинский оттенок. Пунктуация разделяет два основания и избегает перегруженного сложного предложения.
