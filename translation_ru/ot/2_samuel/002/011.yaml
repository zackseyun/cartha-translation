  language: ru
  text: Давид царствовал в Хевроне над домом Иуды семь лет и шесть месяцев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «число дней, в которые Давид был царём». Это еврейское выражение обозначает продолжительность его царствования в Хевроне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים אֲשֶׁר הָיָה
  choice: Давид царствовал… семь лет и шесть месяцев
  rationale: Буквально конструкция говорит о «числе дней, в которые Давид был царём», но в данном контексте это еврейский способ обозначить продолжительность царствования. Русское «царствовал… семь лет и шесть месяцев» естественно и точно передаёт смысл.
- source_word: מֶלֶךְ
  choice: царствовал
  rationale: Именная конструкция «был царём» в сочетании с указанием срока естественно передаётся русским глаголом «царствовал».
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Предлог בְּ обозначает место; «в Хевроне» — обычная русская форма для царствования в городе.
- source_word: עַל בֵּית יְהוּדָה
  choice: над домом Иуды
  rationale: Сохранено слово «дом», имеющее здесь собирательный смысл и обозначающее народ или политическое сообщество Иуды; «над» передаёт власть царя.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: семь лет и шесть месяцев
  rationale: Прямой и естественный перевод указанной продолжительности.
