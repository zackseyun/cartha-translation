base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: ru
  text: 'И пришли мужчины Иуды и там помазали Давида царём над домом Иуды. Они сообщили Давиду: «Мужчины Иависа Галаадского — те, кто похоронил Саула».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или проще: «Мужчины Иависа Галаадского похоронили Саула».'
    reason: Относительное предложение может быть передано как идентифицирующая конструкция или как более простое повествовательное сообщение.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли
  rationale: Обычное повествовательное значение בוא; «пришли» естественно обозначает прибытие в уже названный Хеврон.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: мужи Иуды
  rationale: Сохраняет мужской референт אַנְשֵׁי и племенное наименование, не подменяя его территориальным словом «Иудея».
- source_word: וַיִּמְשְׁחוּ
  choice: помазали
  rationale: Стандартное обозначение царского помазания, сохраняющее политический и богословский смысл действия.
- source_word: לְמֶלֶךְ
  choice: царём
  rationale: Творительный предикативный после «помазали» естественен для русского языка.
- source_word: עַל בֵּית יְהוּדָה
  choice: над домом Иуды
  rationale: Слово «дом» сохраняет корпоративно-племенной образ исходного текста.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Давиду сообщили
  rationale: Передаёт значение Hiphil глагола נגד; отдельное «говоря» в современном русском было бы тяжеловесным, а прямая речь уже выражает функцию לֵאמֹר.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: Мужи Иависа Галаадского
  rationale: Сохраняет мужской референт и использует традиционную русскую форму географического названия.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: те, кто похоронил Саула
  rationale: Передаёт относительное предложение и его возможную идентифицирующую силу, не добавляя мотивов или оценки поступка.
theological_decisions:
- issue: Гендерно маркированное коллективное обозначение אַנְשֵׁי
  choice: мужи
  alternative: люди; жители; предводители
  rationale: Еврейское слово лексически указывает на мужчин; «мужи» сохраняет это значение и уместно для представителей племени в царском повествовании.
- issue: Образ «дома Иуды»
  choice: сохранить «дом Иуды»
  alternative: Иуда; колено Иуды
  rationale: Так сохраняется корпоративно-родовой образ בֵּית без сужения его до территории или явного толкования как одного лишь колена.
- issue: Идентифицирующая сила заключительной относительной конструкции
  choice: «те, кто похоронил Саула»
  alternative: «похоронили Саула»
  rationale: Основной текст отражает возможное выделение совершивших погребение, а примечание сохраняет более простое синтаксическое прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Мужи» и «дом Иуды» сохраняют исходные образы, тогда как синтаксис сообщения сделан естественным для современного читателя.
