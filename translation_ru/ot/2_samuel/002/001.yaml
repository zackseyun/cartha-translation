base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: ru
  text: 'После этого Давид обратился к Яхве[a] с вопросом: «Подняться ли мне в один из городов Иуды?» Яхве ответил ему: «Поднимись». Давид спросил: «Куда мне подняться?» Он ответил: «В Хеврон».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно передаётся: «Господь».'
    reason: Указывает форму Божьего имени в еврейском тексте и знакомую читателям традиционную передачу.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт еврейскую повествовательную формулу и временной переход, не воспроизводя избыточно буквальное «и было после этого».
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: обратился к Яхве с вопросом
  rationale: Передаёт обращение за божественным указанием, а не просто бытовой вопрос; при этом звучит понятно и современно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: Подняться ли мне / Поднимись
  rationale: 'Сохраняет повтор одного и того же еврейского глагола и его направительное значение: города Иуды находились в горной области.'
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: в один из городов Иуды
  rationale: Сохраняет неопределённость выбора одного города и традиционное обозначение территории/колена Иуды.
- source_word: אָנָה
  choice: Куда
  rationale: Точно и естественно выражает вопрос о направлении движения.
- source_word: חֶבְרֹנָה
  choice: В Хеврон
  rationale: Направительное окончание в еврейском передано русским предлогом движения «в».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя, тогда как «Господь» представляет традиционную замену титулом.
- issue: Характер вопроса Давида
  choice: обратился к Яхве с вопросом
  alternative: спросил у Яхве
  rationale: Конструкция שׁאל ביהוה в данном повествовательном контексте подразумевает поиск Божьего указания. Формулировка сохраняет этот оттенок, не уточняя не названный в стихе способ получения ответа.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Лексический повтор «подняться — поднимись — подняться» сохранён. Последнее «Он ответил» сохраняет допустимую для еврейского повествования местоименную форму, при ясном из контекста референте.
