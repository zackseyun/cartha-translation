translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным звучанием. Синтаксис упрощён без потери участников и пространственного противопоставления; двусмысленное в русском контексте наречие «вместе» не воспроизводится отдельно, поскольку значение совместного схождения сторон выражено глаголом «встретились».
