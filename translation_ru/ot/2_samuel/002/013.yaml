base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: ru
  text: Иоав, сын Саруи, и слуги Давида вышли и встретились с ними у Гаваонского водоёма[a]. Одни сели по одну сторону водоёма, а другие — по другую.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Гаваонского бассейна»; еврейское слово может обозначать сооружённый бассейн или резервуар для воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹאָב בֶּן צְרוּיָה
  choice: Иоав, сын Саруи
  rationale: Имя и родственное обозначение переданы в принятой русской библейской форме; начальный повествовательный союз не выражен отдельно ради естественного русского повествования.
- source_word: וְעַבְדֵי דָוִד
  choice: и слуги Давида
  rationale: Сохраняет основное значение עבד и не уточняет до «воинов», хотя контекст имеет военный характер.
- source_word: יָצְאוּ
  choice: вышли
  rationale: Прямое и естественное соответствие обычному значению יצא без добавления не выраженной явно идеи походного строя.
- source_word: וַיִּפְגְּשׁוּם
  choice: встретились с ними
  rationale: Передаёт значение פגש и объектный суффикс, отсылающий к Авениру и людям Иевосфея из предыдущего стиха.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: у Гаваонского водоёма
  rationale: Предлог передан пространственным «у»; בְּרֵכָה обозначает устроенный бассейн или резервуар, а «водоём» здесь естественно и не создаёт ассоциации с современным плавательным бассейном.
- source_word: יַחְדָּו
  choice: встретились
  rationale: Идея совместного схождения в одном месте естественно включена в русское «встретились»; отдельное «вместе» было бы двусмысленным, будто обе стороны действовали сообща.
- source_word: וַיֵּשְׁבוּ
  choice: расположились
  rationale: В данном военном контексте ישׁב описывает занятие места; «расположились» естественнее русского буквального «сели», не добавляя идеи длительного пребывания.
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: одни ... а другие
  rationale: Естественно передаёт противопоставление двух групп, выраженное указательными местоимениями.
- source_word: עַל הַבְּרֵכָה מִזֶּה ... עַל הַבְּרֵכָה מִזֶּה
  choice: по одну сторону водоёма ... по другую
  rationale: Передаёт еврейскую пространственную идиому ясно и без неестественного буквального повторения.
