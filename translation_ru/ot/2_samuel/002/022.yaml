base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: ru
  text: 'Авенир снова сказал Асаилу: «Сверни в сторону, не иди за мной. Зачем мне сразить тебя наземь? И как тогда я смогу поднять лицо[a] перед Иоавом, твоим братом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как тогда я смогу посмотреть в лицо Иоаву, твоему брату?» Буквально: «как я подниму моё лицо к Иоаву, твоему брату?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: Авенир снова сказал
  rationale: Конструкция со значением «добавил ещё сказать» идиоматически указывает, что Авенир заговорил вновь. «Снова сказал» естественно передаёт повторность.
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: Перестань преследовать меня
  rationale: Буквально речь идёт о том, чтобы отвернуть или отступить от идущего следом; в данном контексте это естественный призыв прекратить погоню.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Зачем мне сразить тебя наземь?
  rationale: Глагол נכה в породе хифиль означает «поразить, сразить», а אַרְצָה передаёт направленность к земле. Формулировка сохраняет яркий образ, не заменяя его прямым «убить».
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: И как тогда я смогу поднять лицо
  rationale: Сохранён еврейский образ «поднять лицо», выражающий способность предстать перед человеком без стыда. «Смогу» естественно передаёт подразумеваемую невозможность, а «тогда» выявляет связь с предыдущим вопросом.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: перед Иоавом, твоим братом
  rationale: Предлог אֶל при обороте «поднять лицо» обозначает человека, перед которым Авениру пришлось бы предстать; русское «перед» естественно сочетается с сохранённой идиомой.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Асаил / Авенир / Иоав
  rationale: Использованы закрепившиеся в русской библейской традиции формы личных имён.
