base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: ru
  text: Тогда Иоав затрубил в рог[a], и весь народ остановился; они больше не преследовали Израиль и не продолжали сражаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в трубу». Еврейское слово שׁוֹפָר обозначает рог, служивший сигнальным духовым инструментом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: затрубил
  rationale: В сочетании с בַּשּׁוֹפָר глагол תקע означает подать сигнал, дуя в инструмент. «Затрубил» естественно передаёт это действие по-русски.
- source_word: בַּשּׁוֹפָר
  choice: в рог
  rationale: שׁוֹפָר обозначает рог, использовавшийся как сигнальный духовой инструмент. «Рог» сохраняет конкретный образ еврейского текста, не уточняя без необходимости, что он был бараньим.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: и весь народ остановился
  rationale: עמד буквально означает «встать, стоять», но в данном военном контексте описывает прекращение движения и действий. «Остановился» ясно и естественно передаёт контекстуальный смысл; הָעָם сохранено как «народ».
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: больше не преследовали Израиль
  rationale: רדף אחרי означает «преследовать», а отрицание с עוֹד — «больше не, далее не». Название «Израиль» сохранено без поясняющего расширения.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: и не продолжали сражаться
  rationale: Конструкция יסף с инфинитивом выражает продолжение или повторение действия; при отрицании и עוֹד здесь указывает, что сражение не продолжилось. Формулировка сохраняет возможный оттенок как продолжения, так и возобновления боя.
