base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: ru
  text: Но он не захотел свернуть, и тогда Авнер ударил его задним концом копья в живот[a]. Копьё вышло у него из спины; он упал там и умер на месте. И каждый, кто приходил к тому месту, где Асаэль упал и умер, останавливался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово חֹמֶשׁ — трудное обозначение части тела. В старых переводах его нередко передавали словами «под пятое ребро»; здесь оно, вероятно, означает живот или область брюшной полости.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: он не захотел свернуть
  rationale: Передаёт отказ Асаэля прекратить преследование, сохраняя конкретный образ поворота в сторону.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: задним концом копья
  rationale: Близко передаёт заднюю часть копья, не уточняя сверх текста её устройство или наличие острия.
- source_word: אֶל הַחֹמֶשׁ
  choice: в живот
  rationale: חֹמֶשׁ — трудный анатомический термин; в данном контексте естественно указывает на область живота или брюшной полости. Традиционное «под пятое ребро» отмечено в сноске.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: копьё вышло у него из спины
  rationale: Ясно передаёт, что копьё прошло сквозь тело и показалось сзади.
- source_word: וַיָּמָת תַּחְתָּו
  choice: умер на месте
  rationale: 'Естественно передаёт идиоматический смысл: он умер там же, где упал.'
- source_word: וַיַּעֲמֹדוּ
  choice: останавливался
  rationale: В контексте глагол означает, что каждый подходивший прекращал движение и замирал у места гибели Асаэля.
