  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: ru
  text: Авенир же, сын Нира, военачальник войска Саула, взял Иевосфея[a], сына Саула, и перевёл его в Маханаим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В 1 Паралипоменон 8:33 и 9:39 Иевосфей назван Ешбаалом.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Авенир же
  rationale: Частица וְ связывает повествование с предыдущим стихом и здесь выражает контраст с воцарением Давида в Иудее; русское «же» передаёт этот переход естественно, не усиливая его до резкого «но».
- source_word: בֶּן נֵר
  choice: сын Нира
  rationale: Формально и естественно передана обычная древнееврейская конструкция родства; имена даны в закрепившейся русской библейской форме.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: военачальник Саула
  rationale: שַׂר צָבָא обозначает главу или начальника войска, а אֲשֶׁר לְשָׁאוּל указывает на принадлежность Саулу. Сжатая русская формулировка сохраняет оба значения.
- source_word: לָקַח
  choice: взял
  rationale: Сохранено основное значение глагола. Контекст не требует более сильного «схватил» или «захватил», которое могло бы необоснованно подразумевать насилие.
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: Иевосфея
  rationale: Передана традиционная русская форма имени, соответствующая чтению масоретского текста אִישׁ בֹּשֶׁת. Параллельная форма имени из Паралипоменона отмечена в сноске.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: переправил его
  rationale: 'Порода хифиль от עבר выражает побуждение или содействие переходу: «провести, переправить». Такой перевод сохраняет возможный оттенок пересечения местности или водной преграды, не уточняя маршрут.'
- source_word: מַחֲנָיִם
  choice: Маханаим
  rationale: Географическое название транслитерировано в форме, близкой к древнееврейскому звучанию и понятной в современном русском библейском тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис близок к древнееврейскому, но естественен по-русски; традиционные личные имена сочетаются с более точной формой топонима «Маханаим».
