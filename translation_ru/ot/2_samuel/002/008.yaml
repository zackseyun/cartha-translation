- from: Авенир же, сын Нира, военачальник Саула, взял Иевосфея, сына Саула, и переправил его в Маханаим.[a]
  to: Авенир же, сын Нира, военачальник войска Саула, взял Иевосфея[a], сына Саула, и перевёл его в Маханаим.
  rationale: Изменены только формулировки, необходимые для устранения неоправданного указания на водную переправу, более явной передачи отношения Авенира к войску Саула и корректной привязки сноски к имени Иевосфея. Неоднозначность относительно фактического маршрута сохранена.
