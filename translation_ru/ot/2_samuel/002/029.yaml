base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: ru
  text: Авнер и его люди шли по Араве всю ту ночь, перешли Иордан, прошли весь Битрон[a] и пришли в Маханаим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «прошли всю область ущелий». Еврейское слово «Битрон» может быть названием местности или описательным географическим обозначением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: по Араве
  rationale: Здесь עֲרָבָה, вероятно, обозначает географическую область Иорданской впадины, а не просто равнину; транслитерация сохраняет топонимический смысл.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: всю ту ночь
  rationale: Естественно передаёт длительность действия на протяжении всей указанной ночи и сохраняет указательное значение הַהוּא.
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: перешли Иордан
  rationale: Глагол עבר с прямым дополнением здесь означает пересечение реки; «перешли» — ясный современный эквивалент.
- source_word: כָּל הַבִּתְרוֹן
  choice: прошли весь Битрон[a]
  rationale: 'Точное значение הַבִּתְרוֹן неясно: это может быть название местности либо обозначение изрезанной ущельями области. Транслитерация не устраняет эту неопределённость; сноска сообщает основную альтернативу.'
- source_word: מַחֲנָיִם
  choice: Маханаим
  rationale: Собственное географическое название передано традиционной транслитерацией, без перевода его возможного значения.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: шли… прошли… пришли
  rationale: Последовательность глаголов движения сохранена естественными русскими соответствиями, отражающими путь, прохождение местности и прибытие.
- source_word: וַאֲנָשָׁיו
  choice: его люди
  rationale: Буквальное и уместное в военном контексте выражение; вариант «воины» был бы более истолковывающим.
