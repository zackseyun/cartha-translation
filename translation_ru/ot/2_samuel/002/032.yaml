base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: ru
  text: Они унесли Асаила и похоронили его в гробнице его отца[a], которая была в Вифлееме. Затем Иоав и его люди шли всю ночь, и рассвет застал их в Хевроне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могиле его отца». Еврейское слово קֶבֶר может обозначать и могилу, и гробницу или семейное место погребения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и стало светло для них в Хевроне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: унесли
  rationale: В данном погребальном контексте נשׂא означает, что тело Асаила подняли и понесли для погребения. «Унесли» естественно передаёт движение с телом от места гибели.
- source_word: עֲשָׂהאֵל
  choice: Асаил
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронили его
  rationale: Обычное и ясное соответствие глаголу קבר в современном литературном русском языке.
- source_word: בְּקֶבֶר אָבִיו
  choice: в гробнице его отца
  rationale: קֶבֶר может означать как могилу, так и гробницу или семейное место погребения. В основном тексте выбрано «гробница», а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: которая находилась в Вифлееме
  rationale: В еврейском тексте связка и предлог при названии города выражены сжато; по-русски предложение естественно требует явного сказуемого и формы «в Вифлееме».
- source_word: וַיֵּלְכוּ כָל־הַלַּיְלָה
  choice: шли всю ночь
  rationale: הלך обозначает движение без обязательного оттенка строевого марша. «Шли всю ночь» сохраняет простоту и длительность действия.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: Иоав и его люди
  rationale: Буквальное «его люди» уместно в военном повествовании и не сужает значение до формального статуса солдат.
- source_word: וַיֵּאֹר לָהֶם בְּחֶבְרוֹן
  choice: на рассвете они достигли Хеврона
  rationale: Идиома буквально сообщает, что для них стало светло в Хевроне. Контекстуально она указывает, что рассвет застал их при прибытии туда; естественная русская формулировка передаёт это без буквальной неуклюжести, а исходный образ отмечен в сноске.
- source_word: בְּחֶבְרוֹן
  choice: Хеврона
  rationale: Использована устоявшаяся русская библейская форма географического названия; при глаголе «достигли» требуется родительный падеж.
