base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: ru
  text: Тогда сыны Вениамина собрались за Авениром[a], соединились в один отряд[b] и заняли позицию на вершине одного холма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «следуя за Авениром». Древнееврейское выражение может обозначать как положение позади кого-либо, так и следование за ним как за предводителем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в одну группу». Древнееврейское слово обозначает сплочённую группу людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: собрались
  rationale: Возвратно-коллективная форма глагола קבץ описывает совместное собирание; в данном повествовании речь идёт о перегруппировке воинов.
- source_word: בְנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохраняет буквальное родовое выражение древнееврейского текста и при этом уместно в dignified русском библейском повествовании.
- source_word: אַחֲרֵי אַבְנֵר
  choice: за Авениром
  rationale: Предлог אַחֲרֵי допускает как пространственное значение «позади», так и следование за предводителем; русское «за Авениром» естественно сохраняет обе возможности.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: в один отряд
  rationale: אֲגֻדָּה обозначает объединённую группу; военный контекст делает «отряд» точным и естественным соответствием.
- source_word: וַיַּעַמְדוּ
  choice: заняли позицию
  rationale: В боевом контексте עמד означает не просто стоять, а расположиться для противостояния; выбранная формулировка ясно передаёт этот оттенок.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: на вершине одного холма
  rationale: רֹאשׁ в топографическом употреблении означает вершину, а «одного» сохраняет числительное אֶחָת без превращения его в неопределённый артикль.
