  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: ru
  text: 'Тогда Авнер сказал ему: «Сверни вправо или влево, схвати одного из юношей и возьми себе его снаряжение[a]». Но Асаил не захотел перестать преследовать его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его доспехи». Еврейское слово, вероятно, означает снаряжение, снятое с поверженного воина; точный вид предметов неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה לְךָ עַל יְמִינְךָ אוֹ עַל שְׂמֹאלֶךָ
  choice: Сверни вправо или влево
  rationale: Императив נטה в контексте погони означает отклониться от нынешнего пути; естественная русская формулировка сохраняет обе предложенные стороны движения.
- source_word: וֶאֱחֹז לְךָ
  choice: схвати
  rationale: אחז передаёт решительное овладение кем-либо; значение לְךָ далее естественно выражено общим «себе» при взятии снаряжения без тяжеловесного повтора.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: одного из молодых воинов
  rationale: נְעָרִים буквально обозначает молодых людей, но военный контекст позволяет ясно передать их как молодых воинов, не приписывая им специального звания.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: возьми себе его снаряжение[a]
  rationale: חֲלִצָה здесь, вероятно, означает снятое с бойца военное снаряжение. «Снаряжение» сохраняет широту термина; возможное более узкое понимание отмечено в сноске.
- source_word: וְלֹא אָבָה
  choice: не захотел
  rationale: אבה выражает отсутствие желания или согласия; «не захотел» естественно и точно передаёт эту волевую окраску.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: перестать преследовать его
  rationale: Буквально выражение означает «отступить от следования за ним»; в данном контексте речь идёт о прекращении погони, что по-русски естественно передаётся глаголом «преследовать».
