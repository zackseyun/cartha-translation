base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: ru
  text: А теперь пусть Яхве явит вам неизменную любовь и верность[a]. И я также окажу вам это благодеяние[b], потому что вы сделали это дело[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве явит вам неизменную любовь и верность». Еврейскую форму глагола можно понять и как благословенное пожелание, и как утверждение о будущем.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сделаю с вами это добро»; также возможно: «окажу вам эту милость».'
    reason: lexical_alternative
  - marker: c
    text: «Это дело» — упомянутое в предыдущем стихе погребение Саула.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет связь с предыдущими словами Давида и естественно вводит благословение.
- source_word: יַעַשׂ יְהוָה
  choice: пусть Яхве явит
  rationale: Префиксальная форма здесь естественно понимается как пожелание или благословение; «явит» по-русски сочетается с последующими отвлечёнными понятиями.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: חֶסֶד וֶאֱמֶת
  choice: неизменную любовь и верность
  rationale: В устойчивом сочетании חסד обозначает преданную, постоянную любовь, а אמת — надёжность и верность; перевод сохраняет их взаимосвязь и различие.
- source_word: וְגַם אָנֹכִי
  choice: И я также
  rationale: Сохраняет добавочное значение גם и подчёркнутое личное местоимение אָנֹכִי.
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: отплачу вам этим добром
  rationale: Передаёт обещание Давида ответить добром на совершённый поступок; «этим добром» сохраняет существительное טובה и не смешивает его с חסד.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: потому что вы сделали это дело
  rationale: Контекстуально אשר вводит основание обещания Давида, а «это дело» сохраняет указательную формулировку оригинала.
theological_decisions:
- issue: Модальность יַעַשׂ
  choice: 'Пожелание-благословение: «пусть Яхве явит»'
  alternative: 'Будущее утверждение: «Яхве явит»'
  rationale: Контекст речи Давида допускает благословение как наиболее вероятное прочтение, однако грамматическая форма может быть понята и как сообщение о будущем; неоднозначность отмечена в сноске.
- issue: Характер חֶסֶד וֶאֱמֶת
  choice: «неизменная любовь и верность»
  alternative: «милость и истина»
  rationale: В данном межличностном и богословском контексте речь идёт не об отвлечённой истине, а о надёжной верности; при этом перевод не вводит специальную конфессиональную терминологию.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены личное имя Яхве, благословительный тон и повтор корня «делать» там, где это возможно без неестественной русской конструкции; во второй части выбран идиоматический глагол «отплачу», ясно выражающий ответное добро.
