base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: ru
  text: Иш-Бошету[a], сыну Саула, было сорок лет, когда он стал царём над Израилем, и царствовал он два года. Но дом Иуды[b] следовал за Давидом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В масоретском тексте здесь стоит имя Иш-Бошет; в родственных преданиях встречается форма Эшбаал.
    reason: alternative_reading
  - marker: b
    text: «Дом Иуды» — собирательное обозначение племени или царства Иуды.
    reason: lexical_alternative
  - marker: c
    text: 'То есть поддерживал Давида и сохранял ему верность; буквально: «был за Давидом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: было сорок лет
  rationale: Стандартный древнееврейский оборот для обозначения возраста передан естественным современным русским выражением.
- source_word: אִישׁ בֹּשֶׁת
  choice: Иш-Бошет
  rationale: Сохранена форма имени, представленная в масоретском тексте данного стиха, в современной русской транслитерации; связанная форма Эшбаал отмечена в сноске.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Оборот указывает на возраст при вступлении на царство. Русская формулировка естественно передаёт значение регнальной формулы.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: В контексте царской власти предлог עַל обозначает правление над народом.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: и царствовал он два года
  rationale: Сохранена простая глагольная формула продолжительности царствования и повествовательный ритм оригинала.
- source_word: אַךְ
  choice: но
  rationale: Союз выражает противопоставление между властью Иш-Бошета над Израилем и верностью Иуды Давиду.
- source_word: בֵּית יְהוּדָה
  choice: дом Иуды
  rationale: Буквальный корпоративный образ понятен по-русски и сохраняет значение племени или политического сообщества Иуды.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: следовал за Давидом
  rationale: Древнееврейская идиома обозначает поддержку и политическую верность; выражение «следовал за» сохраняет образ оригинала и остаётся естественным по-русски.
