  yaml_path: translation/ot/2_samuel/002/020.yaml
  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: ru
  text: 'Авенир обернулся и сказал: «Это ты, Асаил?» Тот ответил: «Я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: обернулся
  rationale: Глагол פנה означает поворот; в сцене погони «обернулся» естественно передаёт, что Авенир повернулся к преследовавшему его человеку.
- source_word: אַחֲרָיו
  choice: обернулся
  rationale: Сочетание с אַחֲרָיו указывает на поворот назад. В русском это пространственное значение естественно включается в глагол «обернулся»; буквальное «повернулся позади себя» было бы неестественным.
- source_word: הֲאַתָּה זֶה
  choice: Это ты
  rationale: Сочетание вопросительной частицы, местоимения и указательного слова служит вопросом об установлении личности. «Это ты?» сохраняет указательный оттенок זֶה и звучит естественно по-русски.
- source_word: עֲשָׂהאֵל
  choice: Асаил
  rationale: Использована традиционная русская библейская форма имени.
- source_word: אָנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение представляет собой краткий утвердительный ответ с самоидентификацией. Русское «Я» сохраняет лаконичность оригинала; «Да, я» было бы яснее, но добавляло бы отсутствующее в еврейском тексте слово.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым диалогом. Союз וַ перед ответом передан как «Тот ответил», чтобы ясно обозначить смену говорящего и избежать тяжеловесного повторения «и сказал».
