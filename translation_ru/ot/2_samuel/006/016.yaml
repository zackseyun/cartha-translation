base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: ru
  text: Когда ковчег Яхве входил в город Давида, Мелхола, дочь Саула, выглянула из окна и увидела царя Давида, скачущего и кружащегося[a] перед Яхве; и в своём сердце презрела его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские глаголы описывают бурные, радостные движения — прыжки и кружение перед Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: Когда ... входил
  rationale: Конструкция задаёт временной фон происходящего; несовершенный вид естественно передаёт продолжающееся действие, на фоне которого Мелхола увидела Давида.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Сохранены конструкция принадлежности и личное имя, передающее тетраграмматон.
- source_word: עִיר דָּוִד
  choice: Город Давида
  rationale: Устойчивое географическое наименование передано как собственное имя.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Мелхола, дочь Саула
  rationale: Традиционная русская форма имени сочетается с сохранением повествовательно значимого указания на её происхождение.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: смотрела из окна
  rationale: Естественное русское выражение передаёт взгляд из помещения через окно, не уточняя без необходимости направление вниз.
- source_word: מְפַזֵּז וּמְכַרְכֵּר
  choice: скакал и кружился
  rationale: Два отдельных глагола сохраняют образ бурных праздничных движений и не сводятся к общему «танцевал».
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: она презрела его в своём сердце
  rationale: Близкая к форме оригинала передача сохраняет внутренний, не высказанный вслух характер презрения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте дважды стоит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Оценка поведения Давида
  choice: нейтральное описание «скакал и кружился»
  alternative: интерпретирующее «плясал в исступлении»
  rationale: Текст описывает энергичные движения, но не характеризует их как непристойные или исступлённые; отрицательная оценка принадлежит Мелхоле.
