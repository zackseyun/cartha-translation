  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: ru
  text: Давид и весь дом Израиля праздновали перед Яхве, играя на всевозможных инструментах из кипарисовой древесины[a], а также на лирах, арфах, бубнах, трещотках[b] и кимвалах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со всякой древесиной кипарисов». Выражение трудно для истолкования; вероятно, имеются в виду различные музыкальные инструменты из кипарисовой древесины. Точная порода дерева неизвестна.'
    reason: lexical_alternative
  - marker: b
    text: Точное значение редкого древнееврейского слова неизвестно; возможно, это были систры или другие инструменты, звучавшие при встряхивании.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: веселились
  rationale: Глагол в данной форме обозначает праздничное, радостное действие и может включать игру и танец. «Веселились» естественно передаёт общий характер происходящего, не сводя его лишь к музыкальному исполнению.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет обычное древнееврейское выражение действия в присутствии Бога и передаёт личное имя יהוה как «Яхве».
- source_word: בְכֹל עֲצֵי בְרוֹשִׁים
  choice: играя на всевозможных инструментах из кипарисового дерева
  rationale: Буквально выражение означает «со всякими кипарисовыми деревьями/изделиями из кипариса» и, вероятно, эллиптически указывает на музыкальные инструменты. Добавление «инструментах» делает предполагаемый смысл понятным, а сноска сохраняет сведения о трудности текста.
- source_word: כִנֹּרוֹת
  choice: лирах
  rationale: כִּנּוֹר обозначает струнный инструмент типа лиры; это точнее традиционного широкого соответствия «гусли».
- source_word: נְבָלִים
  choice: арфах
  rationale: Доступное современному читателю обозначение другого струнного инструмента, отличного от כִּנּוֹר, хотя его точное устройство неизвестно.
- source_word: תֻפִּים
  choice: бубнах
  rationale: Речь идёт о ручных рамочных барабанах, употреблявшихся на празднествах; «бубны» — естественное и узнаваемое русское соответствие.
- source_word: מְנַעַנְעִים
  choice: трещотках
  rationale: Редкое слово, по-видимому, обозначает ударно-шумовые инструменты, на которых играли встряхиванием. «Трещотки» понятно передаёт предполагаемый способ звукоизвлечения без претензии на точную идентификацию.
- source_word: צֶלְצֶלִים
  choice: кимвалах
  rationale: Устоявшееся русское библейское название металлических ударных инструментов типа тарелок.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Сохраняет древнееврейское собирательное выражение, представляющее Израиль как единое сообщество.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное заветное имя Бога. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Характер действия מְשַׂחֲקִים пред Яхве
  choice: веселились
  alternative: играли / ликовали
  rationale: Исходный глагол допускает праздничную игру, веселье и радостное ликование. Выбор не уточняет вид действия сверх того, что сообщают контекст и перечисление инструментов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «пред Яхве» сохраняет краткость и торжественность исходной формулы; названия инструментов подобраны так, чтобы оставаться понятными без архаической перегруженности.
