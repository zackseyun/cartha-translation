  terminology: «Лиры», «арфы», «бубны», «трещотки» и «кимвалы» приемлемы. «Трещотки» остаётся вероятностной идентификацией и нуждается в сноске; «кимвалы» сохраняют различие с современными оркестровыми тарелками и подходят контексту.
