  source_fidelity: 'В целом перечисление инструментов и передача имени יהוה как «Яхве» верны. Однако מְשַׂחֲקִים обозначает праздничное, игровое ликование; «веселились» несколько сужает и облегчает этот публичный культовый контекст. «Праздновали» передаёт значение точнее, не навязывая танец или исключительно музыкальное исполнение. Трудное בְּכֹל עֲצֵי בְרוֹשִׁים следует сохранять с оговоркой: вероятная связь с инструментами допустима в основном тексте при ясной сноске.'
