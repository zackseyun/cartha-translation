base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: ru
  text: 'Давид ответил Мелхоле: «Это было перед Яхве, который избрал меня вместо твоего отца и всего его дома, чтобы поставить меня правителем над народом Яхве, над Израилем. И я буду веселиться[a] перед Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду танцевать». Еврейский глагол имеет более широкое значение и может обозначать радостное, праздничное или игровое действие, не только танец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Оборот обозначает действие в присутствии Яхве. «Перед Яхве» естественно по-русски и сохраняет повтор выражения в стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: который избрал меня, а не твоего отца и весь его дом
  rationale: После בחר предлог מן выражает выбор одного вместо другого. Русская конструкция «меня, а не...» яснее и естественнее буквального сравнительного «выше»; «дом» сохраняет семейно-династический смысл.
- source_word: לְצַוֹּת אֹתִי נָגִיד
  choice: и поставил меня правителем
  rationale: В данном сочетании צוה означает назначение на должность, а נָגִיד — наделённого властью правителя. Сочинительная формулировка естественно передаёт цель выбора в русском синтаксисе.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: над народом Яхве, над Израилем
  rationale: Сохранены оба оборота с עַל и пояснительное повторение, отождествляющее народ Яхве с Израилем.
- source_word: וְשִׂחַקְתִּי
  choice: И я буду веселиться
  rationale: 'שׂחק обозначает радостное, праздничное или игровое действие и не является столь узким обозначением танца, как глаголы в ближайшем контексте. Форма с וְ допускает и в контексте ответа Мелхоле поддерживает продолженное/будущее намерение: Давид не только объясняет прежнее действие, но и заявляет, что будет так поступать.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Насколько конкретно описать действие Давида
  choice: буду веселиться
  alternative: буду танцевать; праздновал
  rationale: שׂחק шире глаголов, специально обозначающих танец, поэтому основной текст не сужает значение. Возможный танцевальный смысл сохранён в примечании.
- issue: Временная отнесённость וְשִׂחַקְתִּי
  choice: буду веселиться
  alternative: веселился; праздновал
  rationale: Связанная форма перфекта в повествовательно-речевом контексте может выражать последующее действие или решимость. Это также согласуется с тем, что Давид отвечает на упрёк заявлением о готовности продолжать; прошедшее прочтение остаётся возможным по контексту.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Начальное «Я делал это» восполняет подразумеваемое в еврейском тексте действие и позволяет естественно связать оборот «перед Яхве» с последующим относительным предложением. Повтор «перед Яхве» и «над... над...» сохранён как риторически значимый.
