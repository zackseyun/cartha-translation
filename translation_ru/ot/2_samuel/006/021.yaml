  rationale: Исправлены целевая связь «чтобы поставить», ясность сопоставления с отцом Мелхолы и его домом, а также начальная русская конструкция. Будущее значение в заключительной части и широкая передача שׂחק сохранены; возможность более узкого «танцевать» остаётся в примечании.
