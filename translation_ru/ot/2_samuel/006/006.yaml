  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: ru
  text: Когда они дошли до гумна Нахона[a], Узза протянул руку к ковчегу Бога и ухватился за него, потому что волы оступились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «до гумна Нахона» или, менее вероятно, «до устроенного (прочного) гумна».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поскользнулись»; возможен также смысл: «едва не опрокинули его» или «дали ковчегу соскользнуть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: гумно
  rationale: Существительное обозначает площадку для молотьбы; «гумно» — точный, устоявшийся и понятный в библейском повествовании русский эквивалент.
- source_word: נָכוֹן
  choice: Нахона
  rationale: Форма естественнее всего понимается как имя собственное при слове «гумно». Вариант с нарицательным значением сохранён в примечании из-за лексической неоднозначности.
- source_word: וַיִּשְׁלַח
  choice: протянул руку
  rationale: В данном контексте глагол описывает движение руки к предмету; дополнение «руку» подразумевается еврейским выражением и естественно требуется по-русски.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Бога
  rationale: Сохранено полное обозначение ковчега из исходного текста без замены на более узкое конфессионально привычное выражение.
- source_word: וַיֹּאחֶז בּוֹ
  choice: ухватился за него
  rationale: Передаёт резкое удерживающее действие, не приписывая Уззе насилия или иных мотивов, которых текст не называет.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит непосредственную причину действия Уззы.
- source_word: שָׁמְטוּ
  choice: оступились
  rationale: В контексте тягловых животных слово может указывать на потерю устойчивости или скольжение. «Оступились» естественно по-русски и не уточняет сверх текста, что именно произошло с ковчегом.
- source_word: הַבָּקָר
  choice: волы
  rationale: В сцене перевозки имеются в виду упряжные животные; «волы» точнее общего слова «скот».
theological_decisions:
- issue: Причина действия Уззы
  choice: Узза схватился за ковчег потому, что волы оступились.
  alternative: Волы поскользнулись, дали ковчегу соскользнуть или едва не опрокинули его.
  rationale: Еврейский текст называет волов субъектом неоднозначного глагола, связанного с потерей устойчивости или выскальзыванием, но не объясняет точную механику происшествия. Перевод сохраняет эту сдержанность и не утверждает прямо, что ковчег уже падал.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Гумно» сохранено как точный традиционный сельскохозяйственный термин; синтаксис сделан ясным и естественным. Все смысловые альтернативы, существенно влияющие на картину события, вынесены в примечания.
