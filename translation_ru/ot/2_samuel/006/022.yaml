base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: ru
  text: Я унижу себя ещё больше, чем это, и буду низок в собственных глазах; но среди рабынь, о которых ты говорила, я буду в почёте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְקַלֹּתִי עוֹד מִזֹּאת
  choice: Я унижусь ещё больше, чем теперь
  rationale: Нифаль глагола קלל передаёт умаление достоинства или презренность; возвратное «унижусь» естественно выражает готовность Давида к дальнейшему самоуничижению. Сравнение מִזֹּאת сохранено как «чем теперь», то есть больше того, что Мелхола только что осудила.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: и буду мал в собственных глазах
  rationale: «Мал» сохраняет образ низкого положения и самооценки, не превращая выражение автоматически в нравственную добродетель «смирения» и не придавая ему оттенка нравственной низости.
- source_word: הָאֲמָהוֹת
  choice: рабыни
  rationale: Слово אָמָה обозначает женщину несвободного или низкого домашнего статуса. «Рабыни» яснее, чем смягчённое «служанки», сохраняет социальный контраст стиха.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: о которых ты говорила
  rationale: Форма второго лица женского рода обращена к Мелхоле и отсылает к её словам в предыдущем стихе.
- source_word: עִמָּם אִכָּבֵדָה
  choice: у тех … я буду в почёте
  rationale: Русское «у тех … в почёте» естественно обозначает социальную среду, в которой Давид обретёт уважение, и сохраняет противопоставление между унижением и честью.
theological_decisions:
- issue: Социальный статус женщин, обозначенных словом אָמָהוֹת
  choice: В основном тексте употреблено «рабыни»
  alternative: служанки; женщины-служанки
  rationale: Контекст строится на противопоставлении царского статуса Давида и женщин низкого домашнего положения. Более сильное социальное обозначение сохраняет это напряжение и не смягчает реалии исходного текста.
- issue: Связь последней части стиха с предыдущей
  choice: Союз וְ передан противительным «но»
  alternative: и
  rationale: Хотя еврейский союз формально допускает простое «и», смысловой контраст между самоуничижением Давида и почётом среди рабынь в русском языке яснее передаётся союзом «но».
translation_notes:
  register: Современный литературный русский с умеренно торжественным звучанием. Формулировка сохраняет риторическое противопоставление унижения и почёта; обращение к Мелхоле передано формой женского рода «говорила».
