base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: ru
  text: Давид поднялся и пошёл со всем народом, который был с ним, из Баале-Иуды[a], чтобы поднять оттуда ковчег Божий, над которым призывается имя — имя Яхве Воинств[b], восседающего над херувимами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Баалы Иудейской». Еврейская форма здесь необычна и, вероятно, обозначает место, связанное с Кириаф-Иаримом.'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «Яхве Саваоф» или «Господь Саваоф». Еврейское слово означает «воинства» или «армии».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обитающего между херувимами». Сжатую еврейскую конструкцию можно также передать: «над которым наречено имя Яхве Воинств, восседающего над херувимами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: И поднялся Давид и пошёл
  rationale: Сохранены оба последовательных глагола еврейского повествования; «поднялся» здесь естественно обозначает начало действия.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: со всем народом, который был с ним
  rationale: Предлог «с» ясно передаёт совместность действия, не устраняя полную относительную конструкцию оригинала.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: из Баале-Иуды
  rationale: Форма понята как географическое название, поскольку далее сказано «оттуда»; необычность названия отражена в сноске.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: чтобы перенести оттуда вверх
  rationale: Каузатив от עלה буквально указывает на перемещение вверх; «перенести» естественно для ковчега, а «вверх» сохраняет пространственно-богословский оттенок движения к Иерусалиму.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Устойчивое и ясное русское обозначение данного священного предмета.
- source_word: אֲשֶׁר נִקְרָא שֵׁם שֵׁם
  choice: над которым наречено Имя — имя
  rationale: Сохранена сжатая и торжественная формула наречения имени, а также повтор существительного שֵׁם; предлог «над» позволяет связать формулу с ковчегом, не сводя её к простому владению.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Тетраграмматон передан как личное имя «Яхве», а צְבָאוֹת переведено прозрачным для современного читателя словом «Воинств», сохраняющим небесно-военный смысл титула.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: восседающего над херувимами
  rationale: «Восседающего» выражает царственное присутствие, подразумеваемое יֹשֵׁב в контексте ковчега; «над херувимами» соответствует образу престола, не навязывая вариант «между».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит собственное заветное имя; транслитерация «Яхве» сохраняет его как имя и соответствует представленному доктринальному решению.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; воинств небесных
  rationale: «Воинств» переводит значение, не прибегая к непрозрачной транслитерации «Саваоф» и не уточняя прямо «небесных», чего в данной форме текста нет.
- issue: Сжатая формула наречения имени над ковчегом
  choice: над которым наречено Имя — имя Яхве Воинств
  alternative: который называется Именем; который носит имя Яхве Воинств
  rationale: 'Выбранная формулировка сохраняет грамматическую и богословскую напряжённость оригинала: имя связано с ковчегом, но ковчег не отождествляется с Богом и формула не сводится к обычному названию.'
- issue: Значение יֹשֵׁב при херувимах
  choice: восседающего над херувимами
  alternative: обитающего между херувимами
  rationale: Контекст ковчега допускает престольный образ; вариант «обитающего между» оставлен в сноске как традиционная и лексически возможная передача.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены повествовательная последовательность, повтор слова «Имя» и сжатость богословской формулы; архаизмы ограничены словом «наречено», уместным в сакральном контексте.
