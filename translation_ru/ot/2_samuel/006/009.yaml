  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: ru
  text: 'В тот день Давид испугался Яхве и сказал: «Как ковчег Яхве придёт ко мне?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вопрос может выражать как практическую неуверенность, так и страх или чувство недостоинства после смерти Уззы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: испугался
  rationale: Глагол ירא в породе qal с прямым дополнением указывает здесь на сильный страх Давида после смерти Уззы. «Испугался» естественно передаёт эмоциональную силу контекста, не сводя её лишь к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное соответствие еврейскому обстоятельству времени.
- source_word: אֵיךְ יָבֹא
  choice: как же… придёт
  rationale: 'Форма сохраняет вопросительную неоднозначность: речь может идти как о практической возможности, так и о тревоге Давида перед святостью Яхве. Будущее «придёт» непосредственно отражает יָבֹא, а частица «же» естественно передаёт напряжённость вопроса.'
- source_word: אֵלַי
  choice: ко мне
  rationale: Передаёт форму с местоименным суффиксом без уточнений вроде «в мой дом», которых нет в еврейском тексте.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Прозрачно передаёт сопряжённую конструкцию и сохраняет личное имя Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, поэтому сохранено личное имя Бога; форма «Яхве» соответствует принятой научной реконструкции произношения.
- issue: Характер страха Давида
  choice: испугался Яхве
  alternative: благоговел перед Яхве
  rationale: Непосредственный контекст смерти Уззы указывает на настоящий испуг, однако перевод не добавляет оценки этого страха и не исключает религиозного трепета.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-д dignified библейским звучанием. Порядок первого предложения слегка перестроен ради естественности русской речи; смысл и временная привязка сохранены.
