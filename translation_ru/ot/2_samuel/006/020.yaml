base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: ru
  text: 'И возвратился Давид, чтобы благословить свой дом[a]. Но Мелхола, дочь Саула, вышла навстречу Давиду и сказала: «Как славен был сегодня царь Израиля, обнажившись сегодня на глазах у рабынь своих рабов[b], словно бесстыдно обнажается один из ничтожных людей[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих домашних». Еврейское слово «дом» может обозначать как жилище, так и живущих в нём людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служанок своих слуг». Еврейские слова обозначают зависимых людей низкого социального положения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «словно обнажается один из никчёмных людей». Еврейская конструкция усиливает действие и выражает презрение Мелхолы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: благословить
  rationale: Сохраняет обычное значение корня ברך и цель возвращения Давида без излишнего уточнения формы благословения.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: בית может обозначать и жилище, и домашних; русское «дом» естественно сохраняет эту смысловую широту.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Мелхола, дочь Саула
  rationale: Традиционная русская форма имени сочетается с прямой передачей повествовательного акцента на её принадлежности к дому Саула.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: Как прославился сегодня
  rationale: Передаёт значение כבד и позволяет контексту и реплике выразить явный сарказм, не заменяя его пояснительным пересказом.
- source_word: נִגְלָה
  choice: обнажившись
  rationale: Возвратная форма естественно передаёт нифаль глагола גלה и сохраняет некоторую неопределённость относительно степени обнажения.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Современный естественный русский эквивалент идиомы, подчёркивающий публичность действия.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: рабынь своих рабов
  rationale: Сохраняет зависимый статус обеих групп и точное родительное отношение еврейского выражения, не смягчая социальную иерархию.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: как бесстыдно обнажается
  rationale: Наречие передаёт усилительную конструкцию и презрительную оценку Мелхолы, которую невозможно буквально воспроизвести по-русски без тяжеловесности.
- source_word: אַחַד הָרֵקִים
  choice: какой-нибудь из ничтожных людей
  rationale: Передаёт частичную конструкцию «один из» и уничижительное значение ריקים без чрезмерно разговорной лексики.
theological_decisions:
- issue: Социальный статус в אַמְהוֹת עֲבָדָיו
  choice: рабыни своих рабов
  alternative: служанки своих слуг
  rationale: Контекст унизительной реплики строится в том числе на различии статусов; поэтому лексика рабства сохраняется, а не смягчается.
- issue: Характер обнажения Давида
  choice: обнажившись
  alternative: выставив себя напоказ
  rationale: Исходный глагол указывает на обнажение или открытие, но сам по себе не определяет его точную степень; перевод не уточняет больше источника.
- issue: Сарказм Мелхолы
  choice: Как прославился сегодня
  alternative: Ну и прославился же сегодня
  rationale: Ирония очевидна из продолжения фразы, поэтому она сохраняется контекстуально, без добавления отсутствующих в еврейском тексте частиц.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Реплика Мелхолы звучит язвительно, но не просторечно; повтор «сегодня» сохранён как выразительная особенность еврейского текста.
