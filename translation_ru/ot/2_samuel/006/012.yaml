  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: ru
  text: 'Царю Давиду донесли: «Яхве благословил дом Овед-Эдома и всё, что ему принадлежит, благодаря ковчегу Божьему». Тогда Давид пошёл и с радостью перенёс ковчег Божий из дома Овед-Эдома в Город Давида.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: 'Безличное сообщение сохраняет значение хофаля: вестник не назван; русское «донесли» естественно вводит известие, сообщённое царю.'
- source_word: לַמֶּלֶךְ דָּוִד
  choice: царю Давиду
  rationale: Естественная русская передача титула и имени в дательном падеже.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский показатель цитирования не нуждается в отдельном «говоря»; пунктуация современного русского языка точно передаёт его функцию.
- source_word: בֵּרַךְ יְהוָה
  choice: Яхве благословил
  rationale: Перфект обозначает совершившееся благословение, о котором сообщают Давиду; русский прошедший вид передаёт это естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное божественное имя, представленное тетраграмматоном, не заменяя его титулом.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: дом Овед-Эдома
  rationale: «Дом» сохраняет широту еврейского выражения, способного охватывать семью, хозяйство и имущество, а также поддерживает повтор во второй части стиха.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: и всё, что ему принадлежит
  rationale: Ясно и современно передаёт всё находящееся во владении или относящееся к хозяйству Овед-Эдома.
- source_word: בַּעֲבוּר
  choice: ради
  rationale: Передаёт причинное значение присутствия ковчега; в данном контексте по-русски естественно означает «из-за, благодаря».
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Устоявшееся и точное обозначение священного ковчега без пояснительного расширения.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Тогда Давид пошёл
  rationale: «Тогда» передаёт продвижение повествования и реакцию Давида на полученное известие, не усиливая причинность сверх текста.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: перенёс ковчег Божий
  rationale: В каузативном употреблении עלה означает доставить или поднять ковчег к месту назначения; «перенёс» естественно описывает процесс транспортировки, а маршрут обозначен далее.
- source_word: עִיר דָּוִד
  choice: Город Давида
  rationale: Название конкретного места передано как топоним с прописной буквы.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Прямая и естественная передача обстоятельства образа действия.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя YHWH; форма «Яхве» сохраняет различие между именем и титулом.
- issue: Причина благословения дома Овед-Эдома
  choice: ради ковчега Божьего
  alternative: из-за ковчега Божьего
  rationale: Сохранена явная причинная связь בַּעֲבוּר между присутствием ковчега и благословением, без объяснения механизма или богословского расширения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис упрощён естественным оформлением прямой речи; сохранены повтор «дом Овед-Эдома» и ключевой термин «ковчег Божий». Имя עֹבֵד אֱדֹם передано как «Овед-Эдом», близко к еврейской форме и привычно для русской библейской ономастики.
