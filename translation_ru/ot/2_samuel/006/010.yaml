base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: ru
  text: Но Давид не захотел перенести к себе ковчег Яхве, в Город Давида[a], и отвёл его в дом гефянина Овед-Эдома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Городу Давида» или «вверх, к Городу Давида». Еврейский предлог может обозначать направление к месту, в том числе движение вверх.'
    reason: lexical_alternative
  - marker: b
    text: То есть человека из Гефа.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Но Давид не решился
  rationale: Глагол אָבָה обозначает готовность или согласие; с отрицанием здесь естественно передаёт отсутствие решимости после случившегося, не усиливая смысл до прямого отказа.
- source_word: לְהָסִיר אֵלָיו
  choice: перенести к себе
  rationale: Хотя הֵסִיר буквально может означать «убрать, отвести», в данном контексте речь идёт о перемещении ковчега к месту Давида; «перенести к себе» ясно передаёт направление и сохраняет контраст с последующим отведением в другой дом.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Сохраняется обычное обозначение священного ковчега и непосредственно передаётся личное имя יהוה.
- source_word: עַל עִיר דָוִד
  choice: в Город Давида
  rationale: Предлог עַל при глаголе движения может указывать на движение к месту или вверх к нему. В русском повествовании направление естественно выражено как «в Город Давида»; возможный оттенок подъёма отмечен в сноске.
- source_word: וַיַּטֵּהוּ
  choice: отвёл его
  rationale: Форма от נטה здесь означает направить в сторону, изменить намеченный путь. «Отвёл» передаёт реальное перенаправление ковчега без тяжеловесности.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: в дом Овед-Эдома
  rationale: בֵּית в контексте размещения ковчега прежде всего обозначает дом как место пребывания, хотя может включать и значение домочадцев.
- source_word: הַגִּתִּי
  choice: гефянина
  rationale: Еврейское обозначение происхождения передано традиционным русским этнохоронимом, то есть «человека из Гефа».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Оттенок решения Давида
  choice: не решился
  alternative: не захотел; отказался
  rationale: Контекст сообщает о страхе Давида, однако само אָבָה выражает отсутствие готовности или согласия. «Не решился» естественно учитывает контекст, не представляя действие как окончательный или вызывающий отказ.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «ковчег». Синтаксис сделан ясным и повествовательным; имя «Овед-Эдом» передано в форме, близкой к еврейскому звучанию. Все сноски отмечены в основном тексте.
