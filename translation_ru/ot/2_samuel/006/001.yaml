lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: снова
  rationale: Сочетание יסף + עוד здесь имеет наречное значение и указывает на повторное действие Давида.
- source_word: אֶת כָּל
  choice: всех
  rationale: Передаёт значение полноты охвата прямого дополнения; показатель אֶת отдельно не переводится.
- source_word: בָּחוּר
  choice: отборных воинов
  rationale: Слово может обозначать молодых мужчин либо избранных, лучших мужчин; контекст большого организованного сбора поддерживает военное значение «отборные воины».
- source_word: בְּיִשְׂרָאֵל
  choice: Израиля
  rationale: Предлог ב в данной конструкции естественно передаётся родительным падежом, обозначающим принадлежность к народу Израиля.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: тридцать тысяч
  rationale: Прямое соответствие еврейскому числительному.
