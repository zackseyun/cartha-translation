  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: ru
  text: Ковчег Яхве оставался в доме Овед-Эдома, гефянина[a], три месяца, и Яхве благословил Овед-Эдома и всех его домочадцев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человека, связанного с Гефом.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «весь его дом»; еврейское выражение может обозначать семью и всё домашнее хозяйство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: оставался
  rationale: Глагол יׁשב может означать «сидеть», «жить», «оставаться»; при неодушевлённом подлежащем и указании длительности естественно передаётся как «оставался».
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: 'Сочетание передано прямо: אֲרוֹן — «ковчег», а יהוה — личное имя Бога «Яхве».'
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: в доме Овед-Эдома
  rationale: Здесь בֵּית обозначает место пребывания ковчега, то есть физический дом; личное имя передано транслитерацией, а не переводом.
- source_word: הַגִּתִּי
  choice: гефянина
  rationale: Этникон указывает на человека, связанного с Гефом; традиционная русская форма «гефянин» сохраняет лаконичность оригинала.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: три месяца
  rationale: В русском языке длительность при глаголе «оставался» естественно выражается винительным падежом без предлога.
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Прямое и укоренённое соответствие глаголу ברך, не требующее поясняющей парафразы.
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: Овед-Эдома и всех его домочадцев
  rationale: Повторное בֵּיתוֹ относится не только к зданию, но шире к семье и домашнему кругу; «домочадцы» естественно выражает этот смысл, не исключая домашнее окружение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Объём благословения «всего его дома»
  choice: всех его домочадцев
  alternative: весь его дом
  rationale: Еврейское בֵּיתוֹ допускает широкий смысл — семья или всё домашнее хозяйство. Основной текст передаёт наиболее естественный в контексте личный смысл, а примечание сохраняет более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой («ковчег», «благословил»). Синтаксис близок к еврейскому, но естественен по-русски; личное имя יהוה передано как «Яхве».
