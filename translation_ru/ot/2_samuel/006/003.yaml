base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: ru
  text: Они поставили ковчег Божий на новую повозку и повезли его из дома Авинадава, который был на холме[a]. Узза и Ахио, сыновья Авинадава, вели новую повозку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находившегося в Гиве», если понимать это выражение как название места, а не как указание на холм.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: поставили ... на
  rationale: Каузативная форма רכב обозначает помещение на средство передвижения; по-русски применительно к ковчегу и повозке естественно «поставили ... на».
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: «Ковчег» — утвердившееся обозначение священного предмета; сочетание сохраняет конструкцию принадлежности исходного текста и звучит естественно в русском библейском повествовании.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: на новую повозку
  rationale: Предлог אֶל здесь указывает на помещение предмета на повозку. «Повозка» — ясное современное соответствие עֲגָלָה.
- source_word: וַיִּשָּׂאֻהוּ
  choice: вывезли его
  rationale: נשא имеет значения «поднять, нести, переносить». В данном контексте ковчег уже находится на повозке, поэтому «вывезли» естественно передаёт его перемещение из дома, не создавая ошибочного впечатления, будто его несли на руках.
- source_word: מִבֵּית אֲבִינָדָב
  choice: из дома Авинадава
  rationale: Прямое и естественное воспроизведение еврейской сопряжённой конструкции.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: стоявшего на холме
  rationale: Основной текст понимает בַּגִּבְעָה как топографическое описание дома. Возможность прочитать Гиву как название места сохранена в сноске.
- source_word: וְעֻזָּא וְאַחְיֹו
  choice: Узза и Ахио
  rationale: Имена переданы в традиционной русской библейской форме.
- source_word: בְּנֵי אֲבִינָדָב
  choice: сыновья Авинадава
  rationale: В повествовательном контексте בְּנֵי естественнее всего обозначает непосредственных сыновей.
- source_word: נֹהֲגִים
  choice: вели
  rationale: Причастие נהג означает ведение или управление животными либо повозкой; «вели повозку» ясно и не уточняет без достаточных оснований, шли ли они рядом или непосредственно правили упряжью.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: новую повозку
  rationale: Повтор исходного текста сохранён ради повествовательного акцента и лексической последовательности.
