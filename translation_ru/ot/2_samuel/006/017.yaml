  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: ru
  text: Ковчег Яхве внесли и поставили на его место, внутри шатра, который Давид раскинул для него. Затем Давид принёс перед Яхве жертвы всесожжения и мирные жертвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; также возможно: «жертвы благополучия».'
    reason: Еврейское שְׁלָמִים имеет широкий смысловой диапазон, связанный с миром, благополучием и общением за жертвенной трапезой. Маркер поставлен непосредственно после соответствующего выражения, а не после слов о месте ковчега.
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן в данном устойчивом культовом выражении обозначает священный ковчег; יְהוָה передано личным именем «Яхве».
- source_word: וַיָּבִאוּ
  choice: внесли
  rationale: Порода hifil глагола בוא выражает внесение ковчега в приготовленное для него место; «внесли» естественно передаёт и движение, и вход внутрь.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: и поставили на его место
  rationale: יצג означает поставить или установить в определённом положении; формулировка сохраняет прямой смысл местоимения и не добавляет идеи специально отведённого места.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: внутри шатра
  rationale: בְּתוֹךְ указывает на нахождение внутри; «шатёр» уместен для переносного сооружения, описанного глаголом נטה.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: который Давид раскинул для него
  rationale: נטה в сочетании с шатром означает раскинуть или поставить его. «Для него» сохраняет мужской род местоимения, соотносящегося с ковчегом.
- source_word: וַיַּעַל דָּוִד
  choice: Затем Давид принёс
  rationale: עלה в жертвенном контексте означает вознести или принести жертву. «Принёс» естественно по-русски и не уточняет, совершал ли Давид все обрядовые действия лично.
- source_word: עֹלוֹת
  choice: жертвы всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; множественное число сохранено.
- source_word: וּשְׁלָמִים
  choice: и мирные жертвы
  rationale: שְׁלָמִים — традиционно «мирные жертвы»; термин узнаваем, хотя его смысловой диапазон также включает общение и благополучие, что отмечено в сноске.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי буквально означает «перед, в присутствии»; краткая формулировка сохраняет пространственно-культовый оттенок оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие; «Господь» является традиционной заменой при чтении, а «Иегова» отражает позднюю смешанную форму.
- issue: Роль Давида в принесении жертв
  choice: Давид принёс жертвы
  alternative: Давид лично совершил весь жертвенный обряд
  rationale: Глагол וַיַּעַל приписывает принесение жертв Давиду, но стих не разъясняет распределение обрядовых действий. Перевод сохраняет эту недосказанность и не вводит вывода о том, что Давид собственноручно исполнил каждое действие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан ясным для обычного читателя, но культовые термины «ковчег», «жертвы всесожжения» и «мирные жертвы» сохранены. «Затем» естественно связывает последовательные действия, выраженные еврейским повествовательным וַ.
