base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: ru
  text: Давид танцевал[a] изо всех сил перед Яхве, и Давид был в льняном эфоде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «кружился» или «прыгал»; еврейское слово изображает энергичное праздничное движение.'
    reason: lexical_alternative
  - marker: b
    text: Эфод — особое одеяние, связанное в Израиле со священным служением; здесь сказано, что Давид был в эфоде из льна.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: плясал
  rationale: Причастие описывает энергичное праздничное движение. «Плясал» естественно передаёт телесную выразительность и радостный характер действия, не уточняя без достаточных оснований, что Давид именно кружился или подпрыгивал.
- source_word: בְּכָל עֹז
  choice: изо всех сил
  rationale: Устойчивое современное выражение передаёт полноту усилия и интенсивность действия.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» кратко и естественно передаёт пространственно-религиозный смысл «перед, в присутствии», а личное имя יהוה передано как «Яхве».
- source_word: חָגוּר
  choice: на Давиде был
  rationale: Контекстуальная конструкция ясно сообщает, что Давид носил названное одеяние, и избегает архаичного или потенциально вводящего в заблуждение буквального «опоясан».
- source_word: אֵפוֹד
  choice: эфод
  rationale: Это специальное название израильского культового одеяния, не имеющее точного русского эквивалента; транслитерация сохраняет термин.
- source_word: בָּד
  choice: льняной
  rationale: Слово обозначает материал — лён; перевод не добавляет отсутствующего в тексте указания на особую тонкость ткани.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон. «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер эфода на Давиде
  choice: Не называть Давида священником и ограничиться описанием одежды
  alternative: священнический эфод / священническое облачение
  rationale: Стих сообщает, что Давид носил льняной эфод, но сам по себе не утверждает, что он занимал священническую должность; пояснение сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Пред Яхве» сохраняет краткость исходной формулы; точка с запятой передаёт два тесно связанных сообщения стиха. Повтор имени «Давид» сохранён вслед за еврейским текстом.
