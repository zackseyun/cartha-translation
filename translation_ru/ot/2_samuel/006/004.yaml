review_pass:
  verdict: revise
  source_fidelity: 'Основная передача верна: сохранены исходный пункт, определение дома («на холме»), ковчег Бога и положение Ахио перед ковчегом. Однако «повезли» конкретизирует способ перемещения, тогда как נשׂא означает более общее «нести/переносить». Контекст с повозкой делает эту конкретизацию понятной, но сам стих её не выражает. Кроме того, сочетание «Его ... вместе с Божьим ковчегом» воспроизводит реальную синтаксико-референциальную трудность масоретского текста, но без пояснения может ошибочно подразумевать два разных предмета.'
  naturalness: Русский текст в целом литературный. «Авинадав», «Ахио», «ковчег» и «Гива» употреблены естественно. Формулировка намеренно несколько шероховата из-за текста оригинала; краткая сноска должна прямо отмечать эту трудность, а не только фиксировать вариант топонима.
  terminology: «Ковчег Божий» — традиционная и понятная передача אֲרוֹן הָאֱלֹהִים. Передача גִּבְעָה как «холм» с альтернативой «Гива» в сноске корректна. Имя Ахио передано последовательно.
  issues:
  - severity: medium
    issue: «Повезли» излишне задаёт способ транспортировки.
    rationale: וַיִּשָּׂאֻהוּ буквально обозначает перенос/перемещение и сам по себе не называет повозку. Контекст предыдущего стиха допускает перевозку, но нейтральное «перенесли» ближе к форме данного стиха.
  - severity: medium
    issue: Текстовая неровность «его ... вместе с Божьим ковчегом» не объяснена в пользовательской сноске.
    rationale: Местоименный суффикс и последующее «с ковчегом Бога» в еврейском тексте создают трудность референции. Основной текст следует сохранить без гармонизации, но сноска должна предупредить читателя, что формулировка буквально следует еврейскому тексту и её точная связь неясна.
  revised_text: Его перенесли из дома Авинадава[a], который был на холме, вместе с ковчегом Божьим, а Ахио шёл впереди ковчега.
  revised_footnotes:
  - marker: a
    text: 'Или: «который был в Гиве». Еврейское גִּבְעָה можно понимать как нарицательное «холм» или как название места — «Гива». Формулировка «его ... вместе с ковчегом Божьим» буквально следует еврейскому тексту; точная связь местоимения с упоминанием ковчега неясна.'
    reason: alternative_reading; textual_difficulty
  revision_rationale: «Перенесли» передаёт נשׂא без дополнительного указания на средство передвижения. Сохранена намеренно трудная последовательность оригинала, а сноска делает её прозрачной для читателя, не предлагая недоказуемой гармонизации. Сноска о «Гиве» сохраняет исходную лексическую неоднозначность.
