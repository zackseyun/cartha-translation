    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Его повезли
  rationale: Глагол נשׂא здесь обозначает перемещение ковчега; с учётом повозки в ближайшем контексте «повезли» естественно передаёт действие, не создавая впечатления, будто ковчег несли на руках.
- source_word: מִבֵּית אֲבִינָדָב
  choice: из дома Авинадава
  rationale: Предлог מן указывает на исходную точку, а בית в сопряжённой конструкции — на дом Авинадава.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: который был на холме
  rationale: גִּבְעָה с артиклем естественно понимать как нарицательное «холм»; возможное прочтение как топонима сохранено в сноске.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: вместе с Божьим ковчегом
  rationale: עִם выражает совместность; «Божий ковчег» — ясная и естественная русская передача конструкции принадлежности.
- source_word: וְאַחְיוֹ
  choice: а Ахио
  rationale: Имя передано традиционной русской библейской транслитерацией; союз «а» естественно вводит одновременное действие другого участника.
- source_word: הֹלֵךְ
  choice: шёл
  rationale: Причастие обозначает продолжающееся действие, одновременное с перевозкой ковчега; русский несовершенный вид передаёт эту длительность.
- source_word: לִפְנֵי הָאָרוֹן
  choice: впереди ковчега
  rationale: Пространственное выражение означает движение перед ковчегом и естественно передаётся словом «впереди».
