base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: ru
  text: И разгневался Давид, потому что Яхве сокрушительно обрушился на Озу[a]. Он назвал то место Перец-Оза, и по сей день оно называется так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Перец-Оза» образовано от того же еврейского корня, что и слова «сокрушительно обрушился»; оно означает примерно «прорыв против Озы». В оригинале это игра слов.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: И разгневался Давид
  rationale: Еврейский оборот выражает гнев. «Разгневался» естественно и с должной силой передаёт состояние Давида, не уточняя спорный объект его гнева.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: Яхве поразил Озу внезапным ударом
  rationale: Глагол и однокоренное существительное от פרץ описывают резкое, сокрушительное действие. Буквальное воспроизведение корневого повтора по-русски было бы неестественным, поэтому сила образа передана сочетанием «внезапным ударом», а игру слов поясняет сноска.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: И назвал он то место
  rationale: Естественная русская формула наречения имени месту.
- source_word: פֶּרֶץ עֻזָּה
  choice: Перец-Оза
  rationale: Название места транслитерировано; его связь с корнем פרץ и предшествующей фразой раскрыта в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: как оно называется и по сей день
  rationale: В еврейском тексте буквально «до сего дня». Добавление «как оно называется» естественно связывает временную формулу с наречением имени и не изменяет смысла.
theological_decisions:
- issue: Прямое действие Яхве в суде над Озой
  choice: Яхве поразил Озу внезапным ударом
  alternative: Яхве допустил поражение Озы
  rationale: Текст прямо называет Яхве действующим лицом; перевод не смягчает это до косвенного допущения или случайного последствия.
- issue: Неоднозначность причины или направленности гнева Давида
  choice: разгневался Давид из-за того, что
  alternative: Давид разгневался на Яхве за то, что
  rationale: Предлог עַל вводит причину гнева, но сам по себе не требует утверждать, что гнев был непосредственно направлен на Яхве. Перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Инверсия «И разгневался Давид» и «назвал он» сохраняет повествовательную выразительность, оставаясь понятной современному читателю.
