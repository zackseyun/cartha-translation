base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: ru
  text: И воспылал гнев Яхве на Уззу, и Бог поразил его там за проступок[a]. И умер он там, рядом с ковчегом Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение неясно. Возможные переводы: «за ошибку», «за непочтительность» или «за дерзкий поступок»; возможно также: «за то, что он протянул руку».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Передаёт образ горящего гнева, лежащий в основе еврейской идиомы, и при этом естественно звучит в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בְּעֻזָּה
  choice: на Уззу
  rationale: 'При идиоме חרה אף предлог указывает на того, против кого направлен гнев; по-русски естественно: «гнев ... на Уззу».'
- source_word: וַיַּכֵּהוּ
  choice: поразил его
  rationale: Глагол נכה означает нанесение удара; «поразил» уместно в повествовательном и сакральном контексте, не опережая отдельное сообщение о смерти.
- source_word: שָׁם
  choice: там
  rationale: Наречие дважды сохранено в тексте, чтобы передать повтор и акцент оригинала на месте суда и смерти.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Сохраняет переход оригинала от личного имени Яхве к обозначению «Бог».
- source_word: עַל הַשַּׁל
  choice: за этот проступок
  rationale: 'Редкое и неясное слово הַשַּׁל обозначено достаточно широко: «проступок» передаёт виновное действие, не уточняя сверх текста, было ли это ошибкой, непочтительностью или дерзким прикосновением.'
- source_word: וַיָּמָת
  choice: И умер он
  rationale: Прямо передаёт следующий повествовательный глагол и сохраняет смерть как отдельное следствие после Божьего удара.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: рядом с ковчегом Бога
  rationale: В данном пространственном контексте עִם естественно означает нахождение рядом; «ковчег Бога» сохраняет лексику оригинала.
theological_decisions:
- issue: Причина поражения Уззы в неясном выражении עַל הַשַּׁל
  choice: за этот проступок
  alternative: за ошибку; за непочтительность; за дерзкий поступок; возможно, за то, что он протянул руку
  rationale: Еврейское существительное редкое и допускает разные толкования. Широкое слово «проступок» не устраняет виновность действия, но и не превращает одно из спорных толкований в однозначный текст; варианты раскрыты в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «воспылал гнев» и «умер он» сохраняет достоинство и повествовательный акцент, оставаясь понятной современному читателю.
