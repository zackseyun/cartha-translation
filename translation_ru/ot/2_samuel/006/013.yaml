source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: ru
  text: И когда несущие ковчег Яхве прошли шесть шагов, он принёс в жертву быка и откормленное животное.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откормленного телёнка». В еврейском тексте буквально: «откормленное животное».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן передано традиционным культовым термином «ковчег», а личное имя יְהוָה — формой «Яхве».
- source_word: וַיְהִי כִּי
  choice: И когда
  rationale: Нарративная конструкция вводит временное обстоятельство; «И когда» естественно связывает стих с предшествующим рассказом.
- source_word: נֹשְׂאֵי
  choice: несущие
  rationale: Причастие обозначает людей, которые в это время несли ковчег; русское причастие сохраняет длительный характер действия.
- source_word: צָעֲדוּ ... שִׁשָּׁה צְעָדִים
  choice: прошли шесть шагов
  rationale: Однокоренные глагол и существительное описывают продвижение шагами; по-русски сочетание «прошли шесть шагов» звучит естественно и точно.
- source_word: וַיִּזְבַּח
  choice: он принёс в жертву
  rationale: Единственное число глагола в контексте естественнее всего относить к Давиду; выражение ясно передаёт жертвенное действие.
- source_word: שׁוֹר
  choice: быка
  rationale: Слово обозначает крупный рогатый скот, в данном жертвенном контексте — быка.
- source_word: מְרִיא
  choice: откормленное животное
  rationale: Еврейское существительное обозначает откормленное животное, не уточняя его вид; более конкретное «телёнок» оставлено как возможное традиционное понимание в примечании.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Подразумеваемое подлежащее при וַיִּזְבַּח
  choice: он, то есть Давид
  alternative: неопределённое или коллективное подлежащее
  rationale: В еврейском тексте стоит глагол мужского рода единственного числа без названного подлежащего; ближайший главный участник повествования — Давид. Перевод сохраняет местоимение и не вставляет имя прямо в текст.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой («ковчег», «принёс в жертву»). Синтаксис простой и повествовательный; неопределённость вида второго жертвенного животного сохранена в основном тексте и пояснена сноской.
