base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: ru
  text: Давид и весь дом Израиля поднимали ковчег Яхве под громкие возгласы[a] и звук рога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ликующим кличем» или «с радостным ликованием». Еврейское слово обозначает громкий возглас, в том числе торжественный или радостный клич.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «под звук шофара» или «под звук трубы». Шофар — духовой инструмент, обычно сделанный из бараньего рога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: поднимали
  rationale: 'Причастие породы хифиль описывает продолжающееся действие: Давид и израильтяне вносили ковчег наверх, к Иерусалиму.'
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Так сохраняется буквальный семейно-корпоративный образ еврейского выражения, при этом оборот понятен в современном русском языке.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: אֲרוֹן передано традиционным библейским словом «ковчег», а личное имя יהוה — формой «Яхве».
- source_word: תְרוּעָה
  choice: ликующими возгласами
  rationale: Слово обозначает громкий крик или возглас, в данном праздничном контексте — радостное ликование. Такое прочтение также отличает человеческие возгласы от следующего упоминания рога.
- source_word: קוֹל שׁוֹפָר
  choice: звуки рога
  rationale: שׁוֹפָר — духовой инструмент из рога, нередко бараньего; «рог» не создаёт ошибочного впечатления о современном металлическом инструменте. Русское множественное «звуки» здесь естественно передаёт еврейское собирательное выражение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי («Господь»).
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «дом Израиля» сохранён как понятный корпоративный образ; конструкция «поднимали… с… и под…» передаёт продолжающееся праздничное шествие без стилистической архаизации.
