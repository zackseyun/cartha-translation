  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: ru
  text: Он раздал всему народу, всему множеству Израиля — и мужчинам, и женщинам[a] — каждому по одной хлебной лепёшке, по одной порции мяса[b] и по одной лепёшке из изюма. Затем весь народ разошёлся, каждый к себе домой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от мужчины и до женщины»; это выражение охватывает всех собравшихся — как мужчин, так и женщин.'
    reason: cultural_note
  - marker: b
    text: 'Или: «по одной мере (доле)». Еврейское слово אֶשְׁפָּר встречается редко, и его точное значение неясно. Здесь его часто понимают как порцию мяса, в том числе с учётом параллельного рассказа в 1 Паралипоменон 16:3.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Он раздал
  rationale: Порода пиэль глагола חלק здесь обозначает раздачу отдельных долей множеству людей. «Раздал» естественно и конкретно передаёт действие.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: всему народу, всему множеству Израиля
  rationale: Сохранены обе параллельные, усиливающие друг друга формулировки еврейского текста; «множество» передаёт הֲמוֹן без сведения двух выражений к одному.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: и мужчинам, и женщинам
  rationale: Еврейская формула буквально означает «от мужчины и до женщины» и подчёркивает, что раздача охватила всех собравшихся. По-русски естественнее выразить это парной конструкцией.
- source_word: לְאִישׁ
  choice: каждому
  rationale: В данном контексте слово имеет распределительное значение и относится ко всем людям, только что названным мужчинами и женщинами.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: по одной хлебной лепёшке
  rationale: חַלָּה обозначает хлебное изделие, лепёшку или каравай. «Хлебная лепёшка» конкретно и понятно передаёт предмет без излишней точности относительно его формы.
- source_word: אֶשְׁפָּר אֶחָד
  choice: по одной порции мяса
  rationale: אֶשְׁפָּר — редкое слово с не вполне ясным значением. Контекст раздачи пищи и параллель в 1 Паралипоменон 16:3 позволяют понимать его как порцию, вероятно мяса; неопределённость отмечена в сноске.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: по одной лепёшке из изюма
  rationale: אֲשִׁישָׁה обычно понимается как спрессованная лепёшка из сушёных плодов, вероятнее всего изюма. Выбрана традиционная и понятная передача.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Затем весь народ разошёлся, каждый к себе домой
  rationale: «Разошёлся» естественно описывает возвращение собравшихся по домам, а «каждый к себе домой» сохраняет распределительный единственный оборот оригинала.
