translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены повтор и полнота исходной формулы, но буквальный семитский оборот о мужчинах и женщинах естественно перестроен. Формы «каждому» и «к себе домой» не создают ошибочного впечатления, будто речь идёт только о мужчинах.
