  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: ru
  text: И у Мелхолы, дочери Саула, не было ребёнка до дня её смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомства»; еврейское слово может обозначать ребёнка вообще, не обязательно сына.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: И у Мелхолы
  rationale: Сочетание союза с предлогом вводит Мелхолу как обладательницу в конструкции существования; по-русски естественно передать это через «И у Мелхолы».
- source_word: בַּת שָׁאוּל
  choice: дочери Саула
  rationale: Приложение точно передаёт родственную принадлежность и сохраняет несколько торжественный повествовательный строй.
- source_word: לֹא הָיָה לָהּ
  choice: не было
  rationale: Еврейская конструкция принадлежности буквально означает «не было у неё»; русская конструкция «у Мелхолы… не было» естественна и близка оригиналу.
- source_word: יָלֶד
  choice: ребёнка
  rationale: Существительное в данном контексте может обозначать ребёнка без обязательного указания на мужской пол; «ребёнка» не вносит неоправданного уточнения.
- source_word: עַד יוֹם מוֹתָהּ
  choice: до дня её смерти
  rationale: Близкая и естественная передача стандартного временного выражения, подчёркивающего пожизненную бездетность.
theological_decisions:
- issue: Смысл слов «до дня её смерти»
  choice: Сохранить временную формулу оригинала без дополнительных выводов.
  alternative: 'Передать истолковывающе: «до конца жизни» или «всю жизнь».'
  rationale: Фраза утверждает, что Мелхола оставалась бездетной на протяжении жизни. Буквально близкая формулировка сохраняет образ и не создаёт богословских выводов сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским повествовательным тоном. Традиционная русская форма имени «Мелхола» обеспечивает узнаваемость; синтаксис остаётся естественным и близким к еврейскому оригиналу.
