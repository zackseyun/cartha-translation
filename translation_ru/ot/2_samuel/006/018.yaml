source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: ru
  text: Когда Давид закончил возносить всесожжение и мирные жертвы, он благословил народ именем Яхве Воинств[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Яхве воинств»; традиционно: «Господь Саваоф». Слово «воинства» может обозначать войска или небесные силы.'
    reason: Поясняет форму и смысл божественного титула, а также сохраняет его возможную смысловую широту.
lexical_decisions:
- source_word: וַיְכַל
  choice: закончил
  rationale: Глагол כלה обозначает завершение предшествующего действия; простое «закончил» естественно передаёт последовательность повествования.
- source_word: מֵהַעֲלוֹת
  choice: возносить
  rationale: Hiphil-инфинитив עלה с предлогом מן после כלה означает «закончить возносить/приносить»; в жертвенном контексте «возносить» точно передаёт направленность действия и сочетается с названиями жертв.
- source_word: הָעוֹלָה
  choice: всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, полностью сжигаемой на жертвеннике. Единственное число исходного текста сохранено.
- source_word: וְהַשְּׁלָמִים
  choice: и мирные жертвы
  rationale: שְׁלָמִים обозначает жертвы мира, благополучия и общения. «Мирные жертвы» — точный, узнаваемый и краткий русский эквивалент; множественное число сохранено.
- source_word: וַיְבָרֶךְ
  choice: он благословил
  rationale: ברך здесь прямо означает благословение; местоимение добавлено для естественной русской связи между частями предложения.
- source_word: אֶת־הָעָם
  choice: народ
  rationale: עָם относится ко всему собравшемуся народу; «народ» сохраняет широту еврейского слова.
- source_word: בְּשֵׁם
  choice: именем
  rationale: Выражение בְּשֵׁם указывает на имя и авторитет, с которыми произносится благословение; русский творительный «именем» передаёт это естественно и без лишнего пояснения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что отражает непосредственную форму исходного текста.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе божественного имени-титула צְבָאוֹת означает «воинства» и может охватывать как небесные силы, так и войска; форма «Воинств» сохраняет эту смысловую широту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено традиционным титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств; Яхве, Господь воинств
  rationale: Выбранная форма сохраняет конструкцию и смысл еврейского титула, не сужая צְבָאוֹת исключительно до земных армий. Прописная буква отмечает цельный божественный титул.
- issue: Смысл שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Еврейский термин допускает смысловые оттенки мира, благополучия и совместной трапезы. Основной текст использует традиционно узнаваемое название, не утверждая, что оно исчерпывает всю семантику термина.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и общедоступный; традиционные жертвенные термины сохранены там, где они точны и узнаваемы. Личное имя Бога передано прямо, а менее прозрачный титул пояснён сноской.
