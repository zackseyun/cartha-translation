  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: ru
  text: Итак, Иоав и его брат Авесса убили Авенира за то, что тот убил их брата Асаила в битве при Гаваоне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Иоав и его брат Авесса убили Авенира». Союз в еврейском тексте можно передать простым «и»; «итак» подчёркивает итоговую и пояснительную связь с предшествующим повествованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: убили
  rationale: Нейтрально и прямо передаёт действие; «совершили убийство» или «убили предательски» добавляло бы правовую либо нравственную оценку, не выраженную самим глаголом.
- source_word: לְאַבְנֵר
  choice: Авенира
  rationale: Предлог לְ после הרג в этой конструкции отмечает объект; по-русски естественно употребить прямое дополнение.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Передаёт основание и мотив возмездия, сохраняя естественную русскую связь между действиями.
- source_word: הֵמִית
  choice: убил
  rationale: Hифиль от מות означает причинение смерти. Предшествование ясно из контекста и конструкции «за то, что тот убил», поэтому искусственный плюсквамперфект не требуется.
- source_word: אָחִיו / אֲחִיהֶם
  choice: его брат / их брата
  rationale: Первое место называет Авессу братом Иоава, второе — Асаила братом обоих; обе родственные связи сохранены явно.
- source_word: בְּגִבְעוֹן
  choice: при Гаваоне
  rationale: Устойчивое и естественное русское обозначение места сражения возле города.
- source_word: בַּמִּלְחָמָה
  choice: в битве
  rationale: Передаёт конкретное сражение, известное из повествовательного контекста.
- source_word: וְ / וַ
  choice: Итак
  rationale: Передаёт итогово-пояснительную связь стиха с предшествующим повествованием; буквальное «И» также возможно.
