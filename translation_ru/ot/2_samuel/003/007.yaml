base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: ru
  text: 'У Саула была наложница по имени Рицпа, дочь Айи. И Иевосфей сказал Авениру: «Почему ты вошёл к наложнице моего отца[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «Почему ты вступил в связь с наложницей моего отца?» В еврейском тексте буквально сказано «вошёл к» — это обычный эвфемизм, обозначающий половую связь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: У Саула была
  rationale: Конструкция с ל выражает принадлежность или обладание; по-русски это естественно передаётся оборотом «у Саула была». Начальный ו вводит фоновую информацию и не требует отдельного союза.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: наложница
  rationale: Стандартное обозначение соответствующего социально-семейного положения; оно точнее сохраняет категорию исходного текста, чем пояснительное «второстепенная жена».
- source_word: וּשְׁמָהּ רִצְפָּה
  choice: по имени Рицпа
  rationale: Естественный современный русский способ передать еврейское «и имя её — Рицпа» без потери идентифицирующей функции.
- source_word: בַת אַיָּה
  choice: дочь Айи
  rationale: Прямая передача патронимического оборота с использованием традиционной русской формы имени.
- source_word: וַיֹּאמֶר
  choice: И Иевосфей сказал
  rationale: В еврейском тексте субъект выражен местоименно формой глагола, но из предыдущего стиха ясно, что говорит Иевосфей. Имя восполняется для ясности русского повествования.
- source_word: אֶל אַבְנֵר
  choice: Авениру
  rationale: При глаголе речи русская конструкция с дательным падежом естественно передаёт еврейское אֶל.
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямой и естественный эквивалент вопросительного слова причины.
- source_word: בָּאתָה אֶל
  choice: ты вошёл к
  rationale: Сохранён буквальный образ распространённого сексуального эвфемизма; его значение поясняется в сноске.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: наложнице моего отца
  rationale: Естественная передача сопряжённой конструкции и притяжательного суффикса без устранения заложенного в обвинении династического напряжения.
theological_decisions:
- issue: Обвинение Авенира и значение выражения בָּאתָה אֶל
  choice: Сохранить эвфемизм «вошёл к», пояснив сексуальный смысл в сноске.
  alternative: 'Передать прямо: «вступил в связь с» или «спал с».'
  rationale: Исходный текст формулирует обвинение эвфемистически. Сохранение образа не решает сверх текста вопрос о фактической виновности Авенира и не сглаживает политико-династический подтекст присвоения царской наложницы.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Использованы привычные русские библейские формы имён: Саул, Рицпа, Айя, Иевосфей, Авенир. Синтаксис остаётся ясным для обычного читателя, а эвфемизм оригинала сохранён и пояснён.'
