- from: 'Тогда Авенир сильно разгневался из-за слов Иевосфея и сказал: «Разве я — собачья голова, принадлежащая Иуде?[a] До сего дня я хранил верность дому Саула, твоего отца, его братьям и друзьям и не отдал тебя в руки Давида, а ты сегодня вменяешь мне в вину дело с этой женщиной!»'
  to: 'Тогда Авенир сильно разгневался из-за слов Иевосфея и сказал: «Разве я — собачья голова, принадлежащая Иуде?[a] До сегодняшнего дня я хранил верность дому Саула, твоего отца, его братьям и друзьям и не отдал тебя в руки Давида, а ты сегодня вменяешь мне в вину обвинение из-за этой женщины!»'
  rationale: Исправлена только заключительная формулировка, чтобы не добавлять отсутствующее в оригинале «дело» и сохранить неоднозначность обвинения. «До сего дня» заменено на современное «до сегодняшнего дня» при сохранении ретроспективного смысла первой הַיּוֹם и контраста со вторым «сегодня». Сноска сохраняет буквальный образ и отмечает, а не утверждает, вероятное толкование.
