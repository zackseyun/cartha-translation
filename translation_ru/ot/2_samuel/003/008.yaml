  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: ru
  text: 'Тогда Авенир сильно разгневался из-за слов Иевосфея и сказал: «Разве я — собачья голова, принадлежащая Иуде?[a] До сегодняшнего дня я хранил верность дому Саула, твоего отца, его братьям и друзьям и не отдал тебя в руки Давида, а ты сегодня вменяешь мне в вину обвинение из-за этой женщины!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «собачья голова, принадлежащая Иуде». Это трудное для понимания оскорбительное выражение; возможно, Авенир отрицает, что он презренный сторонник Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Авенир сильно разгневался
  rationale: Еврейская идиома буквально говорит о разгорающемся гневе; современное русское выражение передаёт и смысл, и усиление מְאֹד.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: из-за слов Иевосфея
  rationale: עַל обозначает здесь причину гнева, а דִּבְרֵי буквально означает «слова».
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Разве я — собачья голова, принадлежащая Иуде?
  rationale: Сохранён трудный и оскорбительный образ «собачьей головы» и неоднозначная связь с Иудой; толкование не подменено пояснительным пересказом.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: До сего дня я хранил верность
  rationale: В контексте Авенир ссылается на свою службу вплоть до настоящего дня; «хранил верность» передаёт политико-реляционный смысл חֶסֶד, не сводя его к простой доброте.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: дому Саула, твоего отца
  rationale: «Дом» сохраняет династический смысл בֵּית, а управление дательным падежом естественно после «хранил верность».
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: его братьям и друзьям
  rationale: Переданы обычные значения «братья» и «друзья/близкие» без неоправданного сужения до иных категорий родства или союзничества.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: не отдал тебя в руки Давида
  rationale: Русская идиома сохраняет образ передачи человека под власть другого, выраженный оборотом בְּיַד.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: ты сегодня вменяешь мне в вину дело с этой женщиной
  rationale: פקד על в сочетании с עָוֺן имеет смысл привлечения к ответу или обвинения; «дело с этой женщиной» ясно передаёт предмет обвинения, не добавляя имени Рицпы в текст.
