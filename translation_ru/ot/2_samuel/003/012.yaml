    issue: Будущее время в «моя рука будет с тобой»
    rationale: В еврейском стоит именная конструкция «вот, моя рука с тобой». Будущее возможно как контекстуальный оттенок обещания, но не необходимо; настоящее точнее сохраняет форму и силу образа.
