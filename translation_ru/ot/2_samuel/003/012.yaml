  rationale: Исправлена передача повторной формулы речи, чтобы не создавать в русском впечатления отдельной последующей реплики Авенира и при этом сохранить повторяемость еврейского «сказать». Настоящее время в образе «моя рука с тобой» ближе к еврейской именной конструкции; образ и его политический смысл сохранены и пояснены в сноске.
