base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: ru
  text: 'Авенир послал от своего имени[a] вестников к Давиду, передав: «Кому принадлежит земля?» — и ещё: «Заключи со мной союз, и вот, моя рука с тобой[b], чтобы обратить к тебе весь Израиль».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместо себя». Еврейское выражение здесь указывает, что вестники представляли самого Авенира.'
    reason: alternative_reading
  - marker: b
    text: «Моя рука с тобой» — образное выражение, означающее деятельную поддержку и силу на стороне Давида.
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: от своего имени
  rationale: В данном контексте выражение указывает, что Авенир послал представителей от себя; этот вариант естественен по-русски и сохраняет значение представительства.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В политическом контексте речь идёт о людях-посланцах, а не об ангелах; «вестники» — ясный и традиционно уместный русский эквивалент.
- source_word: לְמִי אָרֶץ
  choice: Кому принадлежит земля?
  rationale: Сохранён краткий риторический вопрос о принадлежности земли и, возможно, праве на власть, без превращения подразумеваемого смысла в прямое утверждение.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Заключи со мной союз
  rationale: כרת ברית — устойчивое выражение со значением заключения завета или договора. В этом политическом контексте «союз» звучит естественно, а повелительное значение сохранено.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: и вот, моя рука будет с тобой
  rationale: Сохранена метафора руки как содействия, силы и поддержки; будущее «будет» естественно передаёт обещание поддержки в рамках предлагаемого соглашения.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: чтобы обратить к тебе
  rationale: Глагол выражает побуждение к смене политической верности; «обратить к тебе» сохраняет направленность и не уточняет сверх текста способ такого перехода.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Передаёт собирательное обозначение народа и племён Израиля в стандартной библейской форме.
theological_decisions:
- issue: Смысл риторического вопроса לְמִי אָרֶץ
  choice: 'Сохранить прямой вопрос: «Кому принадлежит земля?»'
  alternative: Передать как утверждение «Земля принадлежит мне» либо как толкование «Кто должен править этой землёй?»
  rationale: Еврейская фраза кратка и допускает оттенки притязания на распоряжение страной или вопроса о законной власти. Прямой вопрос сохраняет эту политическую и богословскую напряжённость.
- issue: Метафора «моя рука с тобой»
  choice: Сохранить образ руки в основном тексте и пояснить его в сноске
  alternative: Развернуть непосредственно как «я поддержу тебя»
  rationale: Буквальный образ существен для политической силы обещания Авенира, но его идиоматическое значение полезно пояснить современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор еврейского לֵאמֹר передан естественным сочетанием «сказать… И ещё сказал», чтобы не создавать тяжеловесного русского повтора. Подлинная неоднозначность вопроса о земле сохранена.
