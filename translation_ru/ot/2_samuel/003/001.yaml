source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: ru
  text: Война между домом Саула и домом Давида затянулась[a]. Давид становился всё сильнее, а дом Саула — всё слабее[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «была долгой».'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь может означать семью, род или правящую династию; вероятно, слово имеет одновременно семейный и политический смысл.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: Война… затянулась
  rationale: Еврейское прилагательное אֲרֻכָּה буквально означает «долгая» и здесь указывает на продолжительность войны; «затянулась» естественно передаёт эту мысль по-русски.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: между домом Саула и домом Давида
  rationale: '«Дом» сохраняет широту בֵּית: семья, род и политико-династическая сторона одновременно.'
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: Давид становился всё сильнее
  rationale: Сочетание הֹלֵךְ с последующим признаком выражает постепенное, продолжающееся усиление.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: дом Саула — всё слабее
  rationale: Фраза обозначает продолжающийся упадок силы дома Саула и образует выразительный параллельный контраст с усилением Давида.
