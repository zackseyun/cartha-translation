  to: 'И послал Давид вестников к Иевосфею, сыну Саула, сказать: «Отдай мне мою жену Мелхолу, которую я обручил себе[a] за сто крайних плотей филистимлян».[b]'
  rationale: Исправлено «краеобрезаний» на «крайних плотей» для точной передачи еврейского עָרְלוֹת. Формула «которую я обручил себе» точнее сохраняет переходный глагол и לִי («себе»), чем «с которой я обручился»; добавлена лексическая сноска с естественным русским эквивалентом. Напряжение исходного текста между «мою жену» и основанием притязания через обручение сохранено.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:20:10Z'
