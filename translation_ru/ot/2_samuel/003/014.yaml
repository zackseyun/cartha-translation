  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אִֽישׁ בֹּ֥שֶׁת בֶּן שָׁא֖וּל לֵ/אמֹ֑ר תְּנָ֤/ה אֶת אִשְׁתִּ/י֙ אֶת מִיכַ֔ל אֲשֶׁר֙ אֵרַ֣שְׂתִּי לִ֔/י בְּ/מֵאָ֖ה עָרְל֥וֹת פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: ru
  text: 'И послал Давид вестников к Иевосфею, сыну Саула, сказать: «Отдай мне мою жену Мелхолу, которую я обручил себе[a] за сто крайних плотей филистимлян».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «которую я взял себе в невесты». В еврейском тексте буквально: «которую я обручил себе».'
    reason: lexical_alternative
  - marker: b
    text: 'См. 1 Царств 18:25–27: Давид получил Мелхолу, представив крайние плоти филистимлян как брачную плату, назначенную Саулом.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Вав-последовательный продолжает повествование; русское «и» естественно сохраняет связь и последовательность, не добавляя причинного оттенка.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В контексте речь идёт о людях, передающих официальное требование Давида; «вестники» точно и литературно передаёт значение.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: к Иевосфею, сыну Саула
  rationale: Сохранена традиционная русская форма имени и близкое к еврейскому приложению обозначение родства.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Стандартное русское введение прямой речи, соответствующее еврейскому инфинитиву.
- source_word: תְּנָה
  choice: Отдай мне
  rationale: Императив נתן здесь выражает требование вернуть Давиду женщину, которую он называет своей женой; «отдай» естественнее контекстуального «дай», не меняя сути требования.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: мою жену Мелхолу
  rationale: 'Повторный показатель прямого дополнения оформляет приложение: жена названа по имени. Русский синтаксис естественно передаёт это без повтора.'
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: с которой я обручился
  rationale: Глагол ארשׂ обозначает обручение. Возвратная русская конструкция естественно передаёт направленность לִי, не сглаживая различие между «женой» и предшествующим обручением.
- source_word: בְּמֵאָה
  choice: за сто
  rationale: Предлог выражает цену или условие приобретения брачного права; «за» кратко и естественно передаёт этот смысл.
- source_word: עָרְלוֹת פְּלִשְׁתִּים
  choice: краеобрезаний филистимлян
  rationale: Сохранено конкретное и намеренно резкое обозначение брачного дара из повествования 1 Царств 18; эвфемизация не требуется.
theological_decisions:
- issue: Соотношение брачного статуса Мелхолы и языка обручения
  choice: Сохранить одновременно «мою жену» и «с которой я обручился».
  alternative: Сгладить напряжение переводом «на которой я женился» либо «которую добыл себе в жёны».
  rationale: Еврейский текст называет Мелхолу женой Давида, но обосновывает его притязание глаголом обручения и упоминанием брачной платы. Перевод сохраняет эту юридико-брачную напряжённость, не разрешая её за автора.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Использована традиционная русская библейская форма имени «Иевосфей» и «Мелхола». Формулировка остаётся прямой там, где прям и исходный текст.
