base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: ru
  text: 'Авнер сказал Давиду: «Я встану, пойду и соберу весь Израиль к моему господину, царю, чтобы они заключили с тобой союз[a], а ты царствовал над всем, чего желает твоя душа[b]». Давид отпустил Авнера, и тот ушёл с миром[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключили с тобой завет». Буквально выражение содержит глагол «резать» или «рассекать»; это устойчивый древнееврейский оборот со значением «заключить союз (завет)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над всем, чего ты желаешь».'
    reason: lexical_alternative
  - marker: c
    text: «Уйти с миром» — древнееврейское выражение, подразумевающее безопасный уход на мирных условиях.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Я встану, пойду
  rationale: Когортативные формы выражают решительное намерение Авенира. Последовательность двух глаголов сохранена естественным для русского языка способом.
- source_word: וְאֶקְבְּצָה
  choice: и соберу
  rationale: Глагол קבץ здесь означает собрать представителей всего Израиля для политического объединения под властью Давида.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: к господину моему, царю
  rationale: Предлог אֶל передаёт направление — Израиль будет собран к Давиду. Формула сохраняет почтительное придворное обращение и приложение «царю».
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Устоявшееся собирательное обозначение народа и его племён.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: чтобы они заключили с тобой союз
  rationale: Выражение כרת ברית — устойчивое обозначение заключения договора или союза. В данном контексте речь идёт о политическом соглашении; целевой оттенок связи передан союзом «чтобы».
- source_word: וּמָלַכְתָּ
  choice: и ты царствовал
  rationale: Глагол מלך обозначает осуществление царской власти; русское «царствовать» прямо передаёт этот смысл.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: над всем, чего желает твоя душа
  rationale: Сохранены и значение предлога как указания на область царствования, и явное упоминание נֶפֶשׁ как средоточия желания.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: Давид отпустил Авенира
  rationale: В контексте שלח означает позволить гостю уйти, отправить его в путь; «отпустил» естественно передаёт это значение без оттенка изгнания.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: и тот ушёл с миром
  rationale: Сохранена традиционная еврейская формула, указывающая на безопасный уход и мирные отношения сторон.
theological_decisions:
- issue: Передача языка союза
  choice: заключили с тобой союз
  alternative: 'заключили с тобой завет; буквально: отсекли с тобой союз'
  rationale: Контекст непосредственно политический. «Союз» ясно передаёт характер соглашения, не исключая более широкого библейского понятия завета; буквальный образ глагола отмечен в сноске.
- issue: Передача נֶפֶשׁ в выражении желания
  choice: чего желает твоя душа
  alternative: чего ты желаешь; чего желает твоё сердце
  rationale: Упоминание «души» сохраняет антропологический образ исходного текста и его некоторую непривычность, не подменяя его более толковательным «сердцем».
- issue: Связь между союзом и царствованием
  choice: чтобы они заключили… и ты царствовал
  alternative: и они заключат… и ты будешь царствовать
  rationale: Такая конструкция естественно выражает предполагаемый результат действий Авенира, не превращая его слова ни в безусловное пророчество, ни в богословское обещание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Придворная формула «господину моему, царю» намеренно сохраняет порядок и достоинство исходного обращения; архаизмы вне значимых библейских выражений не используются.
