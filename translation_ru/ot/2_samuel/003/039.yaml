base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: ru
  text: А я сегодня ещё слаб[a], хотя и помазан царём, а эти люди, сыновья Церуи, слишком суровы для меня[b]. Пусть Яхве воздаст тому, кто делает зло, по его злу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё мягок (неокрепший)». Еврейское слово может означать «мягкий, нежный», а в данном контексте — «слабый».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слишком сильны для меня» или «мне не под силу». Еврейское выражение может указывать как на их жёсткость, так и на неспособность Давида справиться с ними.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Или: «Яхве воздаст тому, кто делает зло, по его злу». Еврейская форма может выражать как пожелание, так и простое будущее.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: слаб
  rationale: В данном контексте слово указывает на недостаток силы и политическую уязвимость Давида, а не на мягкость характера; «слаб» ясно передаёт этот смысл.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: хотя и помазан на царство
  rationale: 'Соположение слабости Давида и его царского статуса имеет уступительный смысл: несмотря на помазание, он ещё не способен обуздать сыновей Церуи.'
- source_word: בְּנֵי צְרוּיָה
  choice: сыновья Церуи
  rationale: Сохранено родовое обозначение Иоава и его братьев, как в еврейском тексте.
- source_word: קָשִׁים מִמֶּנִּי
  choice: слишком сильны для меня
  rationale: Выражение передаёт, что эти люди жестоки и непреклонны и что Давиду не под силу совладать с ними. Основной текст подчёркивает практическое превосходство, а примечание сохраняет оттенок суровости.
- source_word: יְשַׁלֵּם
  choice: Пусть … воздаст
  rationale: Имперфект естественно понимать как пожелание или призыв к Божьему воздаянию; возможное значение простого будущего сохранено в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: делающему зло
  rationale: Причастный оборот передан близко к форме и смыслу еврейского выражения, без превращения его в характеристику личности.
- source_word: כְּרָעָתוֹ
  choice: по его злу
  rationale: Формулировка сохраняет идею воздаяния, соответствующего совершённому человеком злу, и близость к еврейскому тексту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя יהוה; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Модальность заключительных слов Давида
  choice: 'пожелание: «Пусть Яхве воздаст…»'
  alternative: 'утверждение о будущем: «Яхве воздаст…»'
  rationale: Контекст допускает обращённое к Богу пожелание справедливого воздаяния, однако форма может выражать и простое будущее; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому, но уступительное отношение передано естественным русским оборотом «хотя и». Имя «Церуя» передано прямой транслитерацией; богословская и лексическая неоднозначность вынесена в сноски.
