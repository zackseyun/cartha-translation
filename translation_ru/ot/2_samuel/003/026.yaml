base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: ru
  text: Уйдя от Давида, Иоав послал посланцев вслед за Авнером, и они привели его обратно от колодца Сира[a]. Давид же об этом не знал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от Бор-Сиры», если понимать еврейское выражение как единое название места, а не как «колодец Сира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא в повествовательной форме обозначает конкретное движение наружу или прочь; «вышел» прямо передаёт его значение.
- source_word: מֵעִם דָּוִד
  choice: от Давида
  rationale: Сочетание предлогов выражает удаление от того, с кем находился человек. «От Давида» естественно и точно передаёт этот смысл по-русски.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном повествовательном контексте מַלְאָכִים — люди, посланные за Авнером, а не небесные существа.
- source_word: אַחֲרֵי אַבְנֵר
  choice: вслед за Авнером
  rationale: Предлог אַחֲרֵי здесь указывает на следование за человеком; формулировка допускает подразумеваемое контекстом преследование, не усиливая его явно.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: они возвратили его
  rationale: 'Порода хифиль глагола שׁוב имеет каузативное значение: посланные сделали так, что Авнер вернулся. «Возвратили его» сохраняет эту причинность.'
- source_word: מִבּוֹר הַסִּרָה
  choice: от колодца Сира
  rationale: בּוֹר может обозначать яму, водосборник, цистерну или колодец. В данном топонимическом сочетании «колодец Сира» — ясный и традиционно понятный вариант; возможность прочитать всё выражение как название места отмечена в сноске.
- source_word: וְדָוִד לֹא יָדָע
  choice: а Давид об этом не знал
  rationale: Союз передаёт контраст с тайными действиями Иоава, а «об этом» естественно обозначает содержание, неизвестное Давиду, не добавляя нового события.
