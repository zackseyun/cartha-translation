  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: ru
  text: Пока продолжалась война между домом Саула и домом Давида, Авенир укреплял своё положение в доме Саула.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «становился сильнее в доме Саула». Древнееврейский глагол может означать «укреплял себя (своё положение)» или «становился сильнее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: Пока продолжалась война
  rationale: Оборот с инфинитивом בִּהְיוֹת выражает длительный временной фон. Русское «пока продолжалась» естественно передаёт продолжающийся характер войны, не воспроизводя буквально повествовательное וַיְהִי.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: между домом Саула и домом Давида
  rationale: «Дом» сохраняет семейно-политическую многозначность древнееврейского בֵּית и не сужает смысл до одной лишь династии.
- source_word: וְאַבְנֵר
  choice: Авенир
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הָיָה מִתְחַזֵּק
  choice: всё больше укреплял своё положение
  rationale: Форма хитпаэль глагола חזק может обозначать как усиление, так и целенаправленное укрепление себя. В данном политическом контексте выражение естественно передаёт постепенное упрочение влияния Авенира, сохраняя деятельный оттенок формы.
- source_word: בְּבֵית שָׁאוּל
  choice: в доме Саула
  rationale: Предлог בְּ обозначает сферу, внутри которой Авенир укреплялся; выражение сохраняет одновременно семейный и политический смысл «дома».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением библейского политико-родового выражения «дом Саула / дом Давида». Формулировка ясная и достойная, без архаического «и было».
