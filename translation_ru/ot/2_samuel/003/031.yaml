review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы повеления скорби и положение Давида позади מיטה. Однако добавление «идя» в повеление не выражено в еврейском тексте: לִפְנֵי («перед») может описывать положение в похоронном обряде, но отдельного глагола движения здесь нет.'
  naturalness: «Разорвите на себе одежды» возможно, но «разорвите свои одежды» звучит естественнее в современном литературном русском. «Идя перед ним» и стилистически утяжеляет фразу, и создаёт ненужную конкретизацию. «Плачьте перед Авнером» сохраняет лаконичность и ритуальный контекст.
  terminology: «Вретище» — приемлемый традиционно-библейский термин для שַׂק. «Погребальные носилки» удачно и понятно передаёт מיטה в данном контексте; сноска корректно отмечает лексическую альтернативу «ложе». Имена Давид, Иоав и Авнер переданы нормативно.
  issues:
  - severity: medium
    issue: В основной текст добавлено «идя» в выражении «оплакивайте Авнера, идя перед ним».
    rationale: В еврейском וְסִפְדוּ לִפְנֵי אַבְנֵר содержатся повеление оплакивать и предлог «перед», но нет глагола «идти». Добавление сужает и конкретизирует синтаксически краткое выражение источника; кроме того, замена «перед Авнером» на «оплакивайте Авнера» меняет функцию לִפְנֵי.
  - severity: low
    issue: Оборот «разорвите на себе одежды» менее естественен, чем «разорвите свои одежды».
    rationale: Притяжательный суффикс בִגְדֵיכֶם прямо и естественно передаётся русским «свои»; смысл траурного разрывания одежды сохраняется.
