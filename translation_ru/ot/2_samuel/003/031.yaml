revisions:
- from: 'Тогда Давид сказал Иоаву и всему народу, который был с ним: «Разорвите на себе одежды, обвяжитесь вретищем и оплакивайте Авнера, идя перед ним». А царь Давид шёл за погребальными носилками[a].'
  to: 'Тогда Давид сказал Иоаву и всему народу, который был с ним: «Разорвите свои одежды, обвяжитесь вретищем и плачьте перед Авнером». А царь Давид шёл за погребальными носилками[a].'
  rationale: Удалено не выраженное в оригинале «идя», чтобы сохранить краткое и несколько контекстно обусловленное «перед Авнером». «Свои одежды» — более естественная современная русская передача притяжательного суффикса. Остальные решения, включая «вретище», «погребальные носилки» и сноску к מיטה, сохранены.
