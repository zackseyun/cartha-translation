translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Слово «вретище» сохранено как устоявшееся обозначение траурной грубой ткани; менее понятное «погребальное ложе» вынесено в примечание. Маркер примечания поставлен непосредственно при словах, к которым оно относится.
