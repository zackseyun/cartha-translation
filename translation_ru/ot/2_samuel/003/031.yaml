  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: ru
  text: 'Тогда Давид сказал Иоаву и всему народу, который был с ним: «Разорвите свои одежды, обвяжитесь вретищем и плачьте перед Авнером». А царь Давид шёл за погребальными носилками[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за погребальным ложем». Еврейское слово часто означает «кровать» или «ложе», но здесь речь идёт о носилках, на которых несли тело Авнера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: разорвите на себе одежды
  rationale: Обычное для древнего траура разрывание собственной одежды; оборот «на себе» ясно передаёт смысл притяжательного суффикса и естественно звучит по-русски.
- source_word: חִגְרוּ שַׂקִּים
  choice: обвяжитесь вретищем
  rationale: Глагол חגר обозначает подпоясывание или обвязывание, а שַׂק — грубую ткань, носимую в знак скорби; «вретище» сохраняет историко-культурную реалия и привычно в библейском регистре.
- source_word: וְסִפְדוּ לִפְנֵי אַבְנֵר
  choice: и оплакивайте Авнера, идя перед ним
  rationale: ספד означает обрядовый плач по умершему, а לִפְנֵי в контексте похоронной процессии имеет пространственный смысл «перед». Добавленное «идя» естественно выражает подразумеваемое движение процессии, не меняя её расположения.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: шёл за
  rationale: Причастие הֹלֵךְ передаёт продолжающееся действие, а אַחֲרֵי здесь указывает на положение позади в процессии.
- source_word: הַמִּטָּה
  choice: погребальные носилки
  rationale: Хотя מִטָּה обычно означает кровать или ложе, здесь это приспособление, на котором несли тело Авнера; «погребальные носилки» понятно современному читателю и точно соответствует контексту.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: А царь Давид
  rationale: Титул перед именем естественен для русского языка; союз передан как «а», поскольку повествование переключает внимание с приказа народу на участие самого царя.
