base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: ru
  text: 'Ты ведь знаешь Авенира, сына Нира: он пришёл, чтобы обмануть тебя[a], выведать твои выходы и входы[b] и узнать всё, что ты делаешь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонить тебя» или «ввести тебя в заблуждение». Еврейский глагол может означать обольщать, склонять или обманывать; в данном враждебном контексте подходит значение «обмануть».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твой выход и твой вход». Это выражение охватывает все передвижения или всю деятельность человека.'
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Ты же знаешь
  rationale: Перфект ידע здесь обозначает наличное знание; частица «же» естественно передаёт обвинительный нажим речи Иоава, не превращая фразу в отдельный вопрос.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Авенира, сына Нира
  rationale: Передача имён соответствует традиционной русской библейской форме; приложение оформлено естественно для современного литературного русского языка.
- source_word: כִּי
  choice: двоеточие после «знаешь»
  rationale: כִּי вводит содержание того, что Давид, по словам Иоава, знает; бессоюзное пояснение с двоеточием звучит по-русски естественнее буквального «что».
- source_word: לְפַתֹּתְךָ
  choice: чтобы обмануть тебя
  rationale: Враждебный политико-военный контекст поддерживает значение намеренного введения в заблуждение, хотя глагол может также означать обольщение или склонение.
- source_word: בָּא
  choice: он приходил
  rationale: Глагол описывает уже состоявшийся визит Авенира; несовершенный вид по-русски уместен при указании цели прихода.
- source_word: לָדַעַת
  choice: выведать / узнать
  rationale: Оба инфинитива выражают цель получения сведений. «Выведать» в первом случае передаёт подозрение в разведывательном умысле, а «узнать» во втором избегает тяжёлого повтора.
- source_word: מוֹצָאֲךָ וְאֶת מבואך
  choice: куда ты выходишь и откуда возвращаешься
  rationale: Фраза сохраняет образ выходов и возвращений, но оформлена естественно по-русски; это меризм, охватывающий передвижения и деятельность Давида.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: всё, что ты делаешь
  rationale: Причастная форма עֹשֶׂה допускает актуально-продолженное значение; русское настоящее время естественно охватывает текущую деятельность.
