  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: ru
  text: 'И царь оплакал Авенира, сказав:


    «Неужели Авенир должен был умереть, как умирает глупец?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: воспел плач
  rationale: Глагол קונן обозначает исполнение погребального плача. Выражение «воспел плач» естественно вводит следующий поэтический текст и точнее, чем общее «оплакивал».
- source_word: אֶל אַבְנֵר
  choice: об Авенире
  rationale: При глаголе плача אֶל указывает на того, кому посвящён плач. Русское «плач об Авенире» передаёт это значение естественно и без предположения, что слова обращены непосредственно к умершему.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранено нарицательное обозначение Давида из исходного текста; замена его именем была бы неоправданным уточнением.
- source_word: וַיֹּאמַר
  choice: сказав
  rationale: Обычный глагол речи передан деепричастием для естественной русской связи с предшествующим «воспел плач».
- source_word: הַכְּמוֹת נָבָל
  choice: как умирает глупец
  rationale: Сравнительная конструкция буквально говорит о смерти или умирании глупца. Русская глагольная формулировка сохраняет образ и звучит естественно.
- source_word: נָבָל
  choice: глупец
  rationale: Слово обозначает не только неразумного, но и нравственно низкого, презренного человека. «Глупец» сохраняет основное значение и библейскую смысловую широту, не сужая его до «негодяя».
- source_word: יָמוּת אַבְנֵר
  choice: Неужели Авениру умирать
  rationale: Имперфект в поэтическом риторическом вопросе выражает скорбный протест. Безлично-инфинитивная русская конструкция передаёт оттенок недоумения и возмущения, не превращая строку в утверждение.
- source_word: אַבְנֵר
  choice: Авенир
  rationale: Использована устоявшаяся русская библейская форма имени, понятная читателям и соответствующая литературной традиции.
theological_decisions:
- issue: Характер вопроса о смерти Авенира
  choice: Сохранён риторический скорбный вопрос без пояснения причины позорной смерти
  alternative: Передать как прямое утверждение либо истолковать смерть как смерть нечестивца
  rationale: Еврейская строка выражает протест и сравнение, но сама по себе не определяет окончательно нравственный статус Авенира и не даёт богословской оценки его участи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным погребально-поэтическим регистром. Синтаксис первой строки сделан плавным, а параллельный риторический вопрос сохранён без добавочных толкований.
