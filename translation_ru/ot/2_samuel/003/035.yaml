  text: וַ/יָּבֹ֣א כָל הָ/עָ֗ם לְ/הַבְר֧וֹת אֶת דָּוִ֛ד לֶ֖חֶם בְּ/ע֣וֹד הַ/יּ֑וֹם וַ/יִּשָּׁבַ֨ע דָּוִ֜ד לֵ/אמֹ֗ר כֹּ֣ה יַעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י אִם לִ/פְנֵ֧י בֽוֹא הַ/שֶּׁ֛מֶשׁ אֶטְעַם לֶ֖חֶם א֥וֹ כָל מְאֽוּמָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: ru
  text: 'Тогда весь народ пришёл и стал уговаривать Давида поесть хлеба[a], пока ещё не кончился день. Но Давид поклялся: «Пусть Бог сделает со мной это и ещё больше[b], если до захода солнца я вкушу хлеба или вообще чего-нибудь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово означает «хлеб», но может употребляться и в более широком значении — «пища». Здесь сохранено конкретное слово.
    reason: lexical_alternative
  - marker: b
    text: Это обычная формула клятвенного самопроклятия. Как именно Бог должен наказать нарушившего клятву, в еврейском тексте не уточняется.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: стал уговаривать ... поесть
  rationale: Каузативная форма глагола ברה в данном контексте обозначает попытку дать скорбящему пищу или побудить его поесть. Такой перевод естественно передаёт действие народа, не утверждая, что Давида действительно накормили.
- source_word: לֶחֶם
  choice: хлеба
  rationale: Слово может обозначать пищу вообще, однако конкретное «хлеб» сохраняет образность еврейского текста и уместно в контексте поста и траура.
- source_word: בְּעוֹד הַיּוֹם
  choice: пока ещё не кончился день
  rationale: Фраза указывает, что дневное время ещё продолжалось, и подготавливает последующее упоминание захода солнца.
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Прямой и естественный русский эквивалент глагола, вводящего торжественную клятву.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Пусть Бог сделает со мной это и ещё больше
  rationale: Сохранена условная формула самопроклятия, причём конкретная кара, как и в еврейском тексте, не названа.
- source_word: כִּי אִם
  choice: если
  rationale: В формуле клятвы сочетание вводит условие, при нарушении которого говорящий навлекает на себя подразумеваемую кару.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: до захода солнца
  rationale: Идиоматический русский перевод буквального выражения «до прихода солнца», означающего наступление заката.
- source_word: אֶטְעַם
  choice: я вкушу
  rationale: 'Глагол буквально означает «пробовать, вкушать». Выбор сохраняет усиленный смысл: Давид отказывается даже от малейшего количества пищи.'
- source_word: אוֹ כָל מְאוּמָה
  choice: или вообще чего-нибудь
  rationale: Фраза расширяет запрет за пределы хлеба и подчёркивает полный отказ от любой пищи.
theological_decisions:
- issue: Формула клятвенного самопроклятия
  choice: Сохранить неопределённое «Пусть Бог сделает со мной это и ещё больше»
  alternative: «Пусть Бог сурово накажет меня»
  rationale: Еврейский текст не называет конкретной кары; более явный перевод необоснованно устранил бы эту намеренную недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. «Вкушу» несколько возвышенно, но точно передаёт буквальный смысл и подчёркивает полный характер поста; синтаксис клятвы сохраняет присущую оригиналу недосказанность.
