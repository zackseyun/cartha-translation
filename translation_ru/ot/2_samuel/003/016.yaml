  source_fidelity: 'Нужна небольшая правка: в черновике «идя за ней» соединяет значение הָלוֹךְ с אַחֲרֶיהָ и тем самым оставляет «и плача» без ясного пространственного уточнения. В еврейском тексте муж идёт с ней, при этом продолжает идти и плакать позади/вслед за ней. Исправленный текст раздельно передаёт эти компоненты.'
  naturalness: «Муж её шёл с нею, плача позади неё» — естественная для современного литературного русского повествовательная конструкция с умеренно библейским оттенком. «Ступай, возвращайся» сохраняет два повеления и звучит понятно в контексте прямой речи.
  terminology: «Муж», «Бахурим» и «Авенир» уместны. Имя Авенир соответствует распространённой русской библейской передаче. Сноска перенесена к выражению, которое передаёт אַחֲרֶיהָ.
