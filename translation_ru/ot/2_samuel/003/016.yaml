base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: ru
  text: 'Муж её шёл с нею, плача позади неё[a], до самого Бахурима. Тогда Авенир сказал ему: «Ступай, возвращайся»[b]. И тот вернулся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вслед за ней».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст: «Иди, возвратись» — два последовательных повеления; возможно также: «Иди назад».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: муж её
  rationale: В данном контексте אִישׁ с суффиксом 3-го лица женского рода означает мужа женщины; такой перевод точен и естественен по-русски.
- source_word: הָלוֹךְ וּבָכֹה
  choice: идя за ней и плача
  rationale: Сочетание передаёт продолжающееся сопутствующее действие. Деепричастная конструкция сохраняет длительность и не утяжеляет русскую фразу.
- source_word: אַחֲרֶיהָ
  choice: за ней
  rationale: Предлог указывает на следование вслед за женщиной; «за ней» естественно передаёт пространственное отношение, не уточняя без необходимости «позади».
- source_word: עַד בַּחֻרִים
  choice: до самого Бахурима
  rationale: עַד с названием места обозначает предел движения; частица «самого» естественно подчёркивает достигнутую границу.
- source_word: בַּחֻרִים
  choice: Бахурим
  rationale: Название места передано принятой русской библейской транслитерацией.
- source_word: לֵךְ שׁוּב
  choice: Ступай, возвращайся
  rationale: Сохранены оба повелительных глагола еврейского текста и их выразительная последовательность.
- source_word: וַיָּשֹׁב
  choice: И тот вернулся
  rationale: Форма продолжает повествование и сообщает исполнение приказа; указательное местоимение устраняет возможную двусмысленность русского «он».
