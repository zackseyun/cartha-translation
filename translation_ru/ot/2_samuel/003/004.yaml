- source_word: וְהָרְבִיעִי
  choice: четвёртый
  rationale: Порядковое числительное продолжает перечень из предыдущего стиха. Начальное וְ не выражено в основном тексте ради естественного русского перечисления, но отмечено в сноске.
- source_word: אֲדֹנִיָּה
  choice: Адония
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בֶן
  choice: сын
  rationale: Конструкция с בֶן прямо обозначает сыновство; форма «сын Хаггифы» естественна для русского родословного перечня.
- source_word: חַגִּית
  choice: Хаггифа
  rationale: Принята традиционная русская библейская форма имени; после слова «сын» употреблён родительный падеж «Хаггифы».
- source_word: וְהַחֲמִישִׁי
  choice: пятый
  rationale: Порядковое числительное вводит следующий пункт перечня. Связь с предыдущим пунктом естественно передана точкой с запятой без отдельного союза.
- source_word: שְׁפַטְיָה
  choice: Шефатия
  rationale: Русская транслитерация имени, достаточно близкая к еврейской форме שְׁפַטְיָה.
- source_word: אֲבִיטָל
  choice: Авитала
  rationale: Традиционная русская передача имени; после слова «сын» употреблён родительный падеж «Авиталы».
