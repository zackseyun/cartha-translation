  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: ru
  text: Пусть она падёт на голову Иоава и на весь дом его отца; и пусть в доме Иоава никогда не переведутся страдающий истечением, поражённый тяжёлой кожной болезнью[a], держащий веретено[b], погибающий от меча и нуждающийся в хлебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально употреблено традиционно переводимое как «прокажённый» слово, которое может обозначать различные тяжёлые поражения кожи, а не только проказу в современном медицинском смысле.
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «опирающийся на посох». Значение выражения не вполне ясно; слово обычно означает «веретено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: Пусть она падёт на голову
  rationale: Передаёт формулу возложения вины или возмездия на чью-либо голову. Местоимение «она» по контексту относится к кровной вине за смерть Авенира, названной в предыдущем стихе.
- source_word: בֵּית אָבִיו
  choice: дом его отца
  rationale: Сохраняет древнееврейское обозначение отцовского рода или семейного дома, не сужая его до ближайших домочадцев.
- source_word: וְאַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: и пусть в доме Иоава никогда не переведутся
  rationale: Естественная русская формула проклятия, точно передающая пожелание, чтобы перечисленные бедствия не прекращались в роду Иоава.
- source_word: זָב
  choice: страдающий истечением
  rationale: Обозначает человека с телесным истечением, которое в законе связано с ритуальной нечистотой; «истечение» сохраняет предметный смысл без необоснованного медицинского уточнения.
- source_word: מְצֹרָע
  choice: поражённый тяжёлой кожной болезнью
  rationale: Древнееврейское слово охватывает более широкий круг кожных поражений, чем современная болезнь Хансена; перевод избегает вводящего в заблуждение узкого отождествления с проказой.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: держащий веретено
  rationale: פֶּלֶךְ обычно означает веретено; конкретный образ сохранён без истолкования того, означает ли он немощь, унижение или занятие определённым трудом.
- source_word: נֹפֵל בַּחֶרֶב
  choice: погибающий от меча
  rationale: Передаёт устойчивый древнееврейский образ насильственной смерти и естественно звучит в современном русском языке.
- source_word: חֲסַר לָחֶם
  choice: нуждающийся в хлебе
  rationale: Сохраняет образ хлеба как необходимого пропитания и выражает постоянную нужду.
theological_decisions:
- issue: Характер высказывания Давида
  choice: Пожелание суда, то есть проклятие, обращённое против Иоава и его рода
  alternative: Предсказание будущих событий
  rationale: Юссивные формы лучше всего понимать как пожелание возмездия, а не как простое сообщение о будущем.
- issue: Подразумеваемое подлежащее в начале стиха
  choice: Кровная вина за смерть Авенира
  alternative: Само проклятие или возмездие как обобщённое понятие
  rationale: Связь с предыдущим стихом делает кровную вину наиболее вероятным подразумеваемым референтом, однако перевод не вставляет развёрнутое пояснение в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией проклятия. Синтаксис сделан естественным для русского читателя, при этом сохранены древние образы «головы», «дома отца», меча и хлеба. Все маркеры примечаний присутствуют в основном тексте.
