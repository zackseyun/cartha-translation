lexical_decisions:
- source_word: כִלְאָב
  choice: Килеав
  rationale: Передача еврейского имени по форме масоретского текста; сохраняет отличие от варианта «Далуия» в 1 Пар. 3:1.
- source_word: לַאֲבִיגַל
  choice: от Авигеи
  rationale: Предлог ל в родословном перечне естественно указывает на мать; по-русски это ясно и кратко передаётся оборотом «от Авигеи».
- source_word: הַכַּרְמְלִי
  choice: кармелитянина
  rationale: Нисба обозначает происхождение Навала из Кармила, а не принадлежность к позднейшему религиозному ордену.
- source_word: גְּשׁוּר
  choice: Гессура
  rationale: Традиционная русская библейская форма географического имени, понятная в контексте царства.
