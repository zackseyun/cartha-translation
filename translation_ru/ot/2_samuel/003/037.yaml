base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: ru
  text: И в тот день весь народ и весь Израиль узнали, что умерщвление Авнера, сына Нира, исходило не от царя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это было не от царя»; возможно также: «царь не приказывал этого». Еврейский оборот указывает на источник или происхождение случившегося.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: узнали
  rationale: Форма ידע в последовательном повествовании обозначает обретение знания или осознание факта; «узнали» естественно передаёт это развитие.
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: весь народ и весь Израиль
  rationale: Сохранены оба параллельных коллективных обозначения и корпоративное выражение «весь Израиль».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Обычное и точное русское соответствие временному обороту.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: исходило не от царя
  rationale: Передаёт значение источника или происхождения, выраженное предлогом מן, не превращая его в более узкое утверждение об отсутствии приказа.
- source_word: לְהָמִית
  choice: умерщвление
  rationale: Отглагольное существительное позволяет естественно связать в русском языке причинное значение Hiphil «предать смерти» с оборотом об источнике действия.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: Авнера, сына Нира
  rationale: Имена переданы традиционной русской библейской формой; родственное обозначение сохранено.
theological_decisions:
- issue: Степень утверждения о причастности Давида к смерти Авнера
  choice: Смерть Авнера не исходила от царя.
  alternative: Царь не приказывал убивать Авнера; царь был невиновен в смерти Авнера.
  rationale: Еврейский текст говорит об источнике действия, но прямо не употребляет ни понятия приказа, ни юридической категории невиновности. Перевод сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Не вполне естественный буквальный оборот заменён на «исходило не от царя», а его образность и возможное значение приказа отражены в сноске.
