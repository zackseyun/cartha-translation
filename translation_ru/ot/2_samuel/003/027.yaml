base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: ru
  text: Когда Авенир вернулся в Хеврон, Иоав отвёл его в сторону, внутрь ворот, чтобы поговорить с ним наедине. Там он ударил его в живот[a], и Авенир умер — за кровь Асаила, брата Иоава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная буквальная передача: «в пятое ребро»; вероятно, имеется в виду область живота или брюшной полости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שוב здесь означает возвращение Авенира в Хеврон после того, как его отпустили.
- source_word: וַיַּטֵּהוּ
  choice: отвёл его в сторону
  rationale: Порода hифиль глагола נטה передаёт направленное отклонение в сторону; формулировка естественно описывает, как Иоав увёл Авенира с его пути.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: внутрь ворот
  rationale: תוך указывает на внутреннюю часть, а שער — на ворота или пространство ворот; вариант понятен по-русски и не навязывает точной архитектурной реконструкции.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: будто желая поговорить с ним наедине
  rationale: Редкое בַּשֶּׁלִי, вероятно, обозначает спокойную, доверительную или уединённую беседу. «Наедине» естественно соответствует сцене; «будто желая» передаёт функцию инфинитивной конструкции в контексте обманного отвода, не превращая предполагаемую беседу в состоявшийся разговор.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: там он ударил его в живот[a]
  rationale: חֹמֶשׁ в подобных рассказах обозначает область живота или брюшной полости; «в живот» ясно передаёт место смертельного удара, а традиционный буквальный вариант отмечен в сноске.
- source_word: וַיָּמָת
  choice: и Авенир умер
  rationale: Последовательная форма продвигает повествование. Повтор имени устраняет возможную русскую двусмысленность после двух мужских действующих лиц.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: за кровь Асаила, брата Иоава
  rationale: Предлог ב выражает основание или мотив возмездия. «За кровь» сохраняет краткость и юридико-мстительный оттенок еврейской формулы; уточнение имени Иоава устраняет неоднозначность русского притяжательного оборота.
theological_decisions:
- issue: Характер убийства как возмездия за пролитую кровь
  choice: «за кровь Асаила»
  alternative: «в отмщение за смерть Асаила»
  rationale: Выбранный вариант сохраняет библейский образ крови и не добавляет явной нравственной или юридической оценки поступка Иоава.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно высоким библейским регистром. Сохранены образ «за кровь» и неопределённость редкого בַּשֶּׁלִי без конфессионального истолкования. Маркер сноски поставлен после слова «живот», к которому относится примечание.
