base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: ru
  text: И вот, слуги Давида и Иоав вернулись из набега[a] и принесли с собой большую добычу. Авенира же не было с Давидом в Хевроне, потому что Давид отпустил его, и тот ушёл с миром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернулись из военного отряда». Еврейское слово גְּדוּד может обозначать отряд или вооружённую группу; перевод «набег» выбран потому, что далее упоминается добыча.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «ушёл с миром» означает, что Авенир покинул Хеврон мирно и безопасно, оставаясь в добрых отношениях с Давидом.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт ввод нового, наглядно представленного поворота повествования без архаичного «се».
- source_word: עַבְדֵי דָוִד
  choice: слуги Давида
  rationale: Сохраняет основное значение עֶבֶד; в данном военно-дворцовом контексте речь идёт о людях на службе у Давида, а не обязательно о рабах.
- source_word: וְיוֹאָב
  choice: и Иоав
  rationale: Союз сохранён, личное имя передано в принятой русской библейской форме.
- source_word: בָּא מֵהַגְּדוּד
  choice: вернулись из набега
  rationale: Глагол в еврейском формально стоит в единственном числе при составном подлежащем, но по-русски требуется множественное. Контекст добычи поддерживает событийное значение גְּדוּד — «набег»; «вернулись» естественно выражает прибытие обратно.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: и принесли с собой большую добычу
  rationale: «Добыча» — ясное современное обозначение имущества, захваченного в военном походе; רָב передано как «большую».
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָוִד בְּחֶבְרוֹן
  choice: Авенира же уже не было с Давидом в Хевроне
  rationale: Частица «же» выражает контраст, а «уже» естественно передаёт отсутствие Авенира к моменту возвращения Иоава.
- source_word: כִּי שִׁלְּחוֹ
  choice: потому что Давид отпустил его
  rationale: Имя Давида явно названо вместо двусмысленного русского «он», поскольку из контекста именно Давид отпустил Авенира; «отпустил» нейтрально передаёт שׁלח.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: и тот ушёл с миром
  rationale: Сохраняет образность еврейского выражения и его смысл мирного, безопасного ухода; «тот» ясно указывает на Авенира.
