  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: ru
  text: Авенир пришёл к Давиду в Хеврон, и с ним было двадцать человек. Давид устроил пир[a] для Авенира и людей, которые были с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовил угощение»; «устроил пиршество».'
    reason: Лексические варианты передачи оборота וַיַּעַשׂ ... מִשְׁתֶּה.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא может означать движение «приходить/идти» в зависимости от точки отсчёта; здесь повествовательный фокус направлен на Давида в Хевроне, поэтому естественно «пришёл».
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: к Давиду в Хеврон
  rationale: Хотя перед названием города нет отдельного предлога, по контексту Хеврон обозначает место, где находился Давид; такой перевод естественен по-русски.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: и с ним было двадцать человек
  rationale: В еврейском это безглагольная конструкция; форма «было» необходима для естественного русского синтаксиса. Слово אֲנָשִׁים здесь обозначает мужчин, сопровождавших Авенира, но русское счётное сочетание «двадцать человек» звучит наиболее естественно.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: устроил пир
  rationale: Сочетание עשה + משתה буквально передаёт совершение или устройство пира; «устроил пир» точно и естественно выражает этот смысл по-русски.
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: Существительное обозначает пир или пиршество, нередко с подразумеваемым винопитием. «Пир» сохраняет широкий смысл, не добавляя прямо не выраженной детали.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: для Авенира и людей, которые были с ним
  rationale: Перевод сохраняет обе группы участников и не заменяет явное описание источника более толковательным выражением «его людей».
