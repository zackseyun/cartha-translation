base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: ru
  text: Авенир также говорил с вениамитянами, и Авенир также отправился в Хеврон, чтобы поговорить с Давидом обо всём, что Израиль и весь дом Вениамина считали хорошим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאָזְנֵי בִנְיָמִין
  choice: с вениамитянами
  rationale: Буквально «в уши Вениамина»; в данном контексте это идиома обращения к представителям колена. Русское «говорил с вениамитянами» естественно передаёт действие и ясно обозначает коллективный смысл названия Вениамин.
- source_word: גַּם ... גַּם
  choice: также ... а затем
  rationale: Первое גַּם подчёркивает дополнительную беседу с Вениамином; второе вводит следующий дополнительный шаг Авенира. В русском буквальное «также... также» тяжеловесно, поэтому параллелизм передан естественной последовательностью.
- source_word: בְּחֶבְרוֹן
  choice: в Хеврон
  rationale: Предлог בְּ отмечает место последующей беседы; вместе с глаголом движения по-русски естественно сказать, что Авенир отправился в Хеврон.
- source_word: לְדַבֵּר בְּאָזְנֵי דָוִד
  choice: чтобы передать Давиду
  rationale: Буквально «чтобы говорить в уши Давида». «Передать Давиду» сохраняет речевое действие и естественно связывает его с последующим содержанием сообщения, не уточняя сверх текста характер переговоров.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: всё, что было угодно
  rationale: Идиома «хорошо в глазах» обозначает то, что считается хорошим, приемлемым или желательным. «Было угодно» сохраняет оценочный смысл и одинаково сочетается с обоими коллективами.
- source_word: יִשְׂרָאֵל
  choice: Израилю
  rationale: Название народа сохранено как коллективное собственное имя, параллельно выражению «весь дом Вениамина».
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: всему дому Вениамина
  rationale: Сохранён библейский родственно-политический образ «дом», не сводящий выражение исключительно к административному понятию колена.
theological_decisions: []
