  naturalness: «Поговорить с Давидом обо всём, что ... считали хорошим» — естественная современная литературная русская конструкция. Она ясно связывает «всё» с содержанием разговора и не перегружает стих буквальным воспроизведением идиомы «в глазах».
  terminology: Имена «Авенир», «Хеврон», «Израиль», «Вениамин» и выражение «дом Вениамина» сохранены. «Вениамитяне» уместно раскрывает коллективное значение первого «Вениамин».
