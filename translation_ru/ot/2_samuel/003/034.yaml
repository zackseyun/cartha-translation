base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: ru
  text: 'Руки твои не были связаны,

    и ноги твои не были закованы в медные оковы.

    Как падают перед злодеями[a],

    так пал ты!


    И весь народ ещё больше плакал о нём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед сынами неправды»; то есть перед нечестивыми или творящими зло людьми.'
    reason: Сноска сохраняет буквальный древнееврейский образ בְּנֵי עַוְלָה и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Руки твои не были связаны
  rationale: Пассивная форма אָסַר означает «быть связанным». Порядок слов сохраняет поэтическую выразительность плача и обращение к погибшему.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: и ноги твои не были закованы в медные оковы
  rationale: נְחֻשְׁתַּיִם обозначает медные или бронзовые ножные оковы; הֻגָּשׁוּ в данном сочетании передаёт помещение ног в оковы. «Закованы» естественно выражает это по-русски.
- source_word: כִּנְפוֹל
  choice: Как падают
  rationale: Инфинитив с כְּ вводит сравнение. Русская неопределённо-личная форма естественно передаёт обобщённый характер образа.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: от рук злодеев
  rationale: Буквально выражение означает «перед сынами неправды» и идиоматически указывает на нечестивых, злых людей. «От рук злодеев» естественно сочетается с глаголом «падать» и ясно передаёт насильственную гибель; буквальный образ отмечен в сноске.
- source_word: נָפָלְתָּ
  choice: так пал ты
  rationale: Перфект обозначает совершившуюся трагическую гибель. «Пал» соответствует возвышенному, но понятному регистру погребального плача.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: И весь народ стал плакать о нём ещё сильнее
  rationale: Конструкция יָסַף с инфинитивом может означать продолжение или усиление действия. В контексте плача Давида естественно выражено усиление общего плача, при этом «стал» указывает на последовавшую реакцию народа.
