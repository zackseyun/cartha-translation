  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: ru
  text: а шестой — Итреам, от Эглы, жены Давида[a]. Все они — сыновья Давида, родившиеся в Хевроне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жена Давида». В данном контексте это выражение называет Эглу женой Давида, но не обязательно его единственной женой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: а шестой
  rationale: Порядковое числительное с союзом продолжает перечень сыновей из предыдущих стихов. Слово «сын» ясно из контекста, поэтому не добавлено.
- source_word: יִתְרְעָם
  choice: Итреам
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: לְעֶגְלָה
  choice: от Эглы
  rationale: В формуле родословного перечня предлог לְ указывает на мать; по-русски естественно сказать, что сын родился «от» женщины.
- source_word: אֵשֶׁת דָּוִד
  choice: жены Давида
  rationale: Сопряжённая конструкция буквально означает «жена Давида». Родительный оборот естественен после имени Эглы и сам по себе не утверждает, что она была единственной женой Давида.
- source_word: אֵלֶּה
  choice: они
  rationale: Указательное местоимение подводит итог предшествующему перечню. В русском связное «они» ясно отсылает к перечисленным сыновьям.
- source_word: יֻלְּדוּ
  choice: родились
  rationale: Пассивная форма ילד в этой генеалогической формуле естественно передаётся русским «родились».
- source_word: לְדָוִד
  choice: у Давида
  rationale: В сочетании ילד + לְ предлог выражает родительскую связь. Русская формула «родились у Давида» передаёт её естественно.
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Предлог обозначает место рождения.
theological_decisions:
- issue: Может ли выражение אֵשֶׁת דָּוִד подразумевать, что Эгла была единственной женой Давида?
  choice: жены Давида
  alternative: одной из жён Давида
  rationale: Основной текст сохраняет буквальную сопряжённую конструкцию и не вносит уточнение, отсутствующее в еврейском тексте; примечание предотвращает ошибочное понимание как указания на единственную жену.
translation_notes:
  register: Современный литературный русский язык; краткая структура перечня сохранена. Тире после «шестой» помогает естественно прочитать эллиптическую конструкцию без добавления слова «сын».
