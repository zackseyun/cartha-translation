base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: ru
  text: 'Он сказал: «Хорошо. Я заключу с тобой союз. Только об одном прошу тебя: ты не увидишь моего лица[a], если прежде не приведёшь Мелхолу, дочь Саула, когда придёшь увидеть моё лицо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты не предстанешь передо мной, если прежде не приведёшь Мелхолу, дочь Саула, когда придёшь предстать передо мной». Буквально по-еврейски: «не увидишь моего лица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Хорошо
  rationale: Краткое выражение согласия с предложением Авенира; сохраняет лаконичность еврейского текста.
- source_word: אֶכְרֹת ... בְּרִית
  choice: заключу ... союз
  rationale: Естественная русская передача еврейской идиомы «срезать союз», сохраняющая официальный характер обязательства.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Только об одном прошу тебя
  rationale: Передаёт ограничительное значение אַךְ и просьбу Давида как единственное условие; по-русски звучит естественно и сдержанно.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: ты не увидишь моего лица
  rationale: Сохраняет буквальный образ и придворный оттенок допуска к личной встрече, не устраняя возможное идиоматическое значение.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: если прежде не приведёшь
  rationale: 'Передаёт исключительное условие и временную последовательность: Мелхола должна быть приведена до встречи.'
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Мелхолу, дочь Саула
  rationale: Употреблена традиционная русская форма имени и естественная аппозиция, соответствующая еврейскому обозначению.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: когда придёшь увидеться со мной
  rationale: Естественно передаёт приход для личной встречи; буквальная формулировка и её повтор отражены в сноске.
