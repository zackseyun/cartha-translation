  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: ru
  text: 'Тогда Иоав пришёл к царю и сказал: «Что ты наделал? Вот, Авенир пришёл к тебе. Зачем же ты отпустил его, так что он ушёл — ушёл совсем?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он ушёл, уходя» — усилительная еврейская конструкция, подчёркивающая, что Авенир действительно ушёл, ушёл совсем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Тогда ... пришёл
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему событию.
- source_word: אֶל הַמֶּלֶךְ
  choice: к царю
  rationale: Прямое и естественное обозначение направления движения.
- source_word: מֶה עָשִׂיתָה
  choice: Что ты наделал?
  rationale: В данном контексте вопрос выражает резкий упрёк; «наделал» естественно передаёт завершённое действие с отрицательными последствиями.
- source_word: הִנֵּה
  choice: Вот,
  rationale: Сохраняет указательно-эмфатическую функцию частицы и привлекает внимание к приходу Авенира.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: Авенир приходил к тебе
  rationale: Глагол обозначает состоявшийся приход; несовершенный вид «приходил» здесь естественно соотносится с последующим уходом Авенира.
- source_word: לָמָּה זֶּה
  choice: Зачем же
  rationale: Частица «же» передаёт усиленный, обвинительный характер вопроса, а «зачем» естественно относится к намеренному решению отпустить Авенира.
- source_word: שִׁלַּחְתּוֹ
  choice: ты отпустил его
  rationale: Порода пиэль глагола שלח здесь означает позволить уйти или отпустить; выбор сохраняет ответственность Давида за решение.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: Ведь он ушёл — совсем ушёл!
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом усиливает утверждение об уходе. Повтор с «совсем» естественно передаёт завершённость и эмфазу.
