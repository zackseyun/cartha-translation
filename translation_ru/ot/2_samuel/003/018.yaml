source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: ru
  text: 'Итак, действуйте, ведь Яхве сказал о Давиде: «Рукою Давида, Моего слуги, Я спасу[a] Мой народ Израиль от руки филистимлян и от руки всех врагов Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид, Мой слуга, спасёт Мой народ Израиль от руки филистимлян и от руки всех врагов Израиля». Еврейскую форму можно понять так, что Давид является грамматическим субъектом, а не Яхве, действующим через Давида.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход от предшествующего рассуждения к настоятельному призыву действовать; по-русски естественнее буквального «и теперь».
- source_word: עֲשׂוּ
  choice: действуйте
  rationale: Повелительная форма во множественном числе призывает слушателей осуществить уже обсуждавшееся намерение.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для призыва и естественно связывает его с последующим упоминанием слова Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: сказал о Давиде
  rationale: В данном контексте последующая речь сообщает Божье определение о роли Давида; אֶל допускает отнесённость высказывания к лицу. Формула לֵאמֹר естественно передана двоеточием.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: Рукою Давида, Моего слуги
  rationale: Сохраняет образ руки как средства действия и передаёт עַבְדִּי соответствующим царско-служебному контексту словом «слуга».
- source_word: הוֹשִׁיעַ
  choice: Я спасу[a]
  rationale: Основной текст понимает Яхве как говорящего и действующего посредством Давида, согласно синтаксическому контексту и древней переводческой традиции; неоднозначная еврейская форма документирована в сноске.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: Мой народ Израиль
  rationale: Сохраняет заветное притяжательное определение и название народа в естественной русской конструкции.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: от руки филистимлян и от руки всех его врагов
  rationale: Повтор образа «руки» сохраняет литературную структуру и обозначает избавление от чужой власти; местоимение согласовано по-русски с собирательным существительным «народ».
theological_decisions:
- issue: Кто является субъектом действия הוֹשִׁיעַ
  choice: 'Яхве спасёт Израиль посредством Давида: «Рукою Давида… Я спасу»'
  alternative: 'Давид является грамматическим субъектом: «Давид, Мой слуга, спасёт Мой народ Израиль»'
  rationale: Контекст прямой Божьей речи и конструкция בְּיַד позволяют представить Давида орудием Божьего спасения; вместе с тем форма הוֹשִׁיעַ допускает прочтение с Давидом как субъектом. Альтернатива вынесена в сноску, чтобы не устранять реальную грамматическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Итак, действуйте» передаёт настоятельность без архаики; повтор «рукою… от руки» намеренно сохраняет еврейскую образность. Прописные буквы в «Моего», «Я», «Мой» отражают речь Бога и принятый русский издательский регистр.
