base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: ru
  text: 'После этого[a], узнав о случившемся, Давид сказал: «Я и моё царство навеки неповинны перед Яхве в крови Авенира, сына Нира[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Впоследствии»; «Позже».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от кровей Авенира, сына Нира» — еврейское выражение, означающее непричастность к пролитию крови Авенира и отсутствие ответственности за его смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временное значение «после этого / впоследствии» и связывает слова Давида с предшествующим событием.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: узнав о случившемся, Давид
  rationale: Глагол буквально означает «услышал»; в данном повествовательном контексте русское «узнав о случившемся» ясно передаёт получение вести о только что описанном убийстве.
- source_word: נָקִי
  choice: невиновны
  rationale: Слово обозначает непричастность и отсутствие вины. Множественное число согласует сказуемое с составным подлежащим «я и моё царство» по нормам современного русского языка.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: Я и моё царство
  rationale: Сохраняет соединение личной непричастности Давида с непричастностью его царства; מַמְלָכָה здесь естественно понимать как царство, а не только отвлечённую царскую власть.
- source_word: מֵעִם יְהוָה
  choice: пред Яхве
  rationale: Передаёт положение перед Богом как свидетелем и судьёй. Имя יהוה транслитерировано как «Яхве».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и достойно передаёт продолжительное, непреходящее действие заявления.
- source_word: מִדְּמֵי
  choice: в пролитии крови
  rationale: Буквально «от кровей»; множественное דָּמִים идиоматически указывает на насильственно пролитую кровь и ответственность за кровопролитие. Русская формулировка делает эту юридико-нравственную связь понятной.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Авенира, сына Нира
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён с сохранением патронимической конструкции.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер заявления Давида о невиновности
  choice: невиновны пред Яхве в пролитии крови
  alternative: свободны от кровной вины перед Яхве
  rationale: Формулировка сохраняет судебно-нравственный смысл и конкретный образ пролитой крови, не утверждая сверх текста, что Бог уже вынес отдельный оправдательный приговор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пред Яхве» сохраняет достоинство и судебный оттенок, а «в пролитии крови» естественно раскрывает еврейскую идиому. Все сноски отмечены в основном тексте.
