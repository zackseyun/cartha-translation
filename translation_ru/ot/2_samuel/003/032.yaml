lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֶת־אַבְנֵר
  choice: Авенира похоронили
  rationale: Форма Qal wayyiqtol 3-го лица множественного числа от קבר обозначает последовательное событие повествования. Неопределённо-личная русская конструкция естественна и не вводит не названного в еврейском тексте субъекта.
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Предлог בְּ обозначает место; «в Хевроне» — естественное обозначение погребения в городе.
- source_word: וַיִּשָּׂא הַמֶּלֶךְ אֶת־קוֹלוֹ
  choice: Царь возвысил голос
  rationale: Сохранён образный древнееврейский оборот о громком выражении скорби; выражение «возвысил голос» имеет уместный литературный и торжественный регистр.
- source_word: וַיֵּבְךְּ
  choice: и заплакал
  rationale: Глагол בכה означает плакать, рыдать. «Заплакал» естественно передаёт начало действия после того, как царь возвысил голос.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: у могилы Авенира[a]
  rationale: Хотя אֶל обычно указывает направление («к»), в сцене погребального плача оборот естественно понимается как указание на место или направленность плача. Основной текст передаёт контекстуально вероятный смысл, а буквальная возможность отмечена в сноске.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: и весь народ плакал
  rationale: Повтор корня בכה сохранён посредством глагола «плакал»; כָּל־הָעָם передано обычным русским выражением «весь народ».
