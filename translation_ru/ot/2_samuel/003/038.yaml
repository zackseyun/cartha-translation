lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательным имперфектом продолжает повествование; обычная русская библейская повествовательная формула естественно передаёт эту связь.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное прямо обозначает царя Давида; добавлять его имя нет необходимости.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: עֶבֶד в придворном контексте может обозначать как слуг, так и царских приближённых или должностных лиц. «Слугам» сохраняет основное значение слова, не уточняя их положение сверх текста.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Разве вы не знаете
  rationale: Сочетание вопросительной частицы с отрицанием вводит риторический вопрос, предполагающий утвердительный ответ; эта русская формулировка передаёт его естественно и близко к форме оригинала.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что слушатели должны знать.
- source_word: שַׂר
  choice: вождь
  rationale: Слово обозначает предводителя, начальника, военачальника, правителя или князя. В отношении Авенира «вождь» передаёт его высокий военный и общественный статус, не приписывая ему происхождение царского князя.
- source_word: וְגָדוֹל
  choice: и великий человек
  rationale: Прилагательное употреблено субстантивированно и подчёркивает величие, значимость и высокий статус умершего; добавление «человек» необходимо для естественной русской речи.
- source_word: נָפַל
  choice: пал
  rationale: Глагол буквально означает «упал», но здесь возвышенно и эвфемистически говорит о смерти. Русское «пал» сохраняет и образ, и торжественный тон.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественная современная передача буквального выражения «в этот день» без потери смысла.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог обозначает национальную и общественную среду, в которой произошла эта значимая смерть.
