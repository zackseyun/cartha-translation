base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: ru
  text: У Давида в Хевроне родились сыновья. Его первенцем был Амнон, сын Ахиноамы из Изрееля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ахиноамы, изреелитянки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/ילדו
  choice: родились
  rationale: Форма передаёт рождение сыновей без явного указания матерей как грамматического субъекта; «родились» естественно выражает это по-русски.
- source_word: לְ/דָוִד
  choice: у Давида
  rationale: В русских родословных и повествовательных формулировках сочетание «у Давида родились» идиоматично передаёт отношение, выраженное ל.
- source_word: בָּנִים
  choice: сыновья
  rationale: Еврейское слово обозначает именно сыновей, а не детей вообще.
- source_word: בְּ/חֶבְרוֹן
  choice: в Хевроне
  rationale: Прямое и естественное выражение места.
- source_word: וַ/יְהִי
  choice: был
  rationale: Простая связка естественно вводит уточнение о первенце, не перегружая русский текст передачей повествовательного союза.
- source_word: בְכוֹר/וֹ
  choice: его первенцем
  rationale: «Первенец» сохраняет значение первого по рождению сына и возможный семейно-правовой оттенок лучше, чем «старший сын».
- source_word: אַמְנוֹן
  choice: Амнон
  rationale: Традиционная русская передача личного имени.
- source_word: לַ/אֲחִינֹעַם
  choice: сын Ахиноамы
  rationale: В данном перечне предлог указывает на материнство; конструкция «сын Ахиноамы» ясна и естественна в современном русском языке.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: из Изрееля
  rationale: Феминитив обозначает происхождение Ахиноамы; описательное выражение естественно для современного русского и не вводит тяжеловесный этноним.
