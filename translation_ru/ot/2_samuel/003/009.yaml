  naturalness: «Пусть Бог сделает с Авнером то-то и ещё больше» — приемлемая в современном литературном русском передача намеренно недоговорённой формулы самопроклятия. Явное «если я не...» естественно раскрывает условно-отрицательную силу формулы; двоеточие уместно, поскольку речь продолжается в следующем стихе.
