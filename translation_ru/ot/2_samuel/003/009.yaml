  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: ru
  text: 'Пусть Бог сделает с Авнером то-то и ещё больше, если я не сделаю для Давида того, в чём поклялся ему Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как Яхве поклялся Давиду, так и я сделаю для него». В составе клятвенной формулы эта фраза означает: «если я не сделаю для него так».'
    reason: Сноска сохраняет буквальную синтаксическую форму еврейского текста и отмечает идиоматическое условное значение клятвы.
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Пусть Бог сделает это с Авнером и ещё больше прибавит ему
  rationale: Сохранена стандартная древнееврейская формула самообязывающей клятвы, в которой говорящий называет себя в третьем лице и призывает на себя Божье наказание.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В формуле клятвы слово обозначает единого Бога; единственное число естественно в русском контексте.
- source_word: לְאַבְנֵר
  choice: с Авнером
  rationale: Предлог передаёт объект предполагаемого наказания; имя в третьем лице сохранено как особенность речи Авнера.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לְדָוִד
  choice: так, как поклялся ему Яхве
  rationale: Сравнительная конструкция связывает намерение Авнера с клятвой Яхве, данной Давиду.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: если я не поступлю с Давидом так
  rationale: В составе формулы клятвы частица כִּי получает условно-отрицательный смысл, подразумеваемый русской формулой «пусть… если я не…»; имперфект передаёт решительное будущее действие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, поэтому сохранено личное имя Бога.
- issue: Характер слов Авнера
  choice: Самопроклятие в подтверждение решимости исполнить обещанное Давиду
  alternative: Простое утверждение о будущем действии
  rationale: Начальная формула «пусть Бог сделает… и ещё больше» имеет форму клятвы и обусловливает последующее обещание.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной силы клятвы. Двоеточие показывает, что высказывание продолжается в следующем стихе.
