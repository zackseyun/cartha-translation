lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Авенир говорил со
  rationale: Еврейская конструкция буквально означает, что слово Авенира было со старейшинами; по-русски естественно передаётся как состоявшийся разговор или обращение.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: уже давно
  rationale: Парное выражение «и вчера, и третьего дня» идиоматически указывает на предшествующее время, а не обязательно на два конкретных дня.
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: желали, чтобы Давид стал вашим царём
  rationale: Передаёт стремление израильских старейшин иметь Давида царём над собой естественным современным русским языком.
