  text: 'Авенир беседовал со старейшинами Израиля: «Вот уже некоторое время[a] вы хотите, чтобы Давид был вашим царём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и вчера, и позавчера»; то есть уже прежде, некоторое время назад.'
