base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: ru
  text: чтобы передать царство от дома Саула и утвердить престол Давида над Израилем и над Иудой — от Дана до Вирсавии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «от Дана до Вирсавии» означает всю страну с севера на юг.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: отнять
  rationale: Каузативная форма здесь обозначает переход царства от одного правящего дома к другому. В сочетании «у дома Саула» глагол «отнять» естественно передаёт устранение прежней династии и сохраняет активную каузативность.
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: Слово охватывает как царскую власть, так и подвластное царство; русский эквивалент «царство» сохраняет эту широту.
- source_word: מִבֵּית שָׁאוּל
  choice: у дома Саула
  rationale: «Дом» сохранён как библейский династический образ, а конструкция с «у» требуется выбранным русским глаголом «отнять».
- source_word: וּלְהָקִים
  choice: и утвердить
  rationale: В каузативной форме глагол означает установить и прочно закрепить; «утвердить престол» естественно для возвышенного современного русского языка.
- source_word: אֶת כִּסֵּא דָוִד
  choice: престол Давида
  rationale: Сохранён конкретный образ престола как обозначение царской власти, без замены его отвлечённым понятием правления.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: над Израилем и над Иудой
  rationale: Повтор предлога передан по-русски, чтобы сохранить подчёркнутое различение двух политических областей.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: от Дана до Вирсавии
  rationale: Это традиционная и ясная русская передача географической формулы, обозначающей всю землю с севера на юг.
theological_decisions:
- issue: Династический язык «дом Саула» и царский образ «престол Давида»
  choice: Сохранить конкретные образы дома и престола.
  alternative: 'Передать отвлечённо: «династия Саула» и «власть Давида».'
  rationale: Еврейский текст говорит о политической смене царского дома посредством устойчивых династических образов. Их сохранение передаёт библейскую фактуру, не добавляя последующих богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Инфинитивная конструкция сохранена, поскольку стих продолжает синтаксическую мысль предыдущего контекста. Тире перед географической формулой помогает естественно связать её со всей областью царствования.
