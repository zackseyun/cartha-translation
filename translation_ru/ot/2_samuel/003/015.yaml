  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: ru
  text: Иевосфей послал за ней и забрал её у её мужа, у Фалтиила, сына Лаиша.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Глагол שׁלח в повествовательной форме означает «послал». Объект посылания не назван, поэтому перевод не добавляет «людей» или «весть».
- source_word: אִישׁ בֹּשֶׁת
  choice: Иевосфей
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; она понятна русскому читателю и соответствует данному лицу.
- source_word: וַיִּקָּחֶהָ
  choice: забрали её
  rationale: Буквально форма означает «взял её», однако после неопределённого «послал» естественное русское множественное число передаёт подразумеваемых исполнителей, не уточняя, кто именно был послан. «Забрали» выражает удаление от мужа без усиления до «схватили».
- source_word: מֵעִם אִישׁ
  choice: от мужа
  rationale: Существительное אִישׁ буквально значит «мужчина», но в данном контексте обозначает её мужа. Русское «от мужа» естественно выражает отношение и значение отделения.
- source_word: מֵעִם פַּלְטִיאֵל
  choice: от Фалтиела
  rationale: 'Повтор предлога מֵעִם сохранён как «от», чтобы передать еврейское уточнение: «от мужа, от Фалтиела».'
- source_word: בֶּן לוש
  choice: сына Лаиша
  rationale: בֶּן означает «сын»; косвенный падеж обусловлен русским синтаксисом. Имя передано традиционной формой «Лаиш».
theological_decisions:
- issue: Статус Фалтиела по отношению к Мелхоле
  choice: Перевести אִישׁ как «муж», сохранив прямое обозначение брачного отношения в данном контексте.
  alternative: «мужчина» или «человек»
  rationale: Контекст прямо представляет Фалтиела как мужчину, от которого забирают Мелхолу; «муж» передаёт контекстуальное значение слова, не вынося дополнительной богословской оценки законности этого брака.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским повествовательным ритмом. Начальное «И» и повтор «от» сохраняют связность и акцент исходного текста; формы имён следуют узнаваемой русской библейской традиции.
