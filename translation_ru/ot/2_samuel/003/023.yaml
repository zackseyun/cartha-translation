  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: ru
  text: 'Когда Иоав и всё войско, бывшее с ним, пришли, Иоаву сообщили: «Авенир, сын Нира, приходил к царю, и тот отпустил его, а Авенир ушёл с миром».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: вернулись
  rationale: В контексте возвращения Иоава и его войска из набега естественное русское соответствие; форма буквально означает «пришли/прибыли».
- source_word: וַיַּגִּדוּ לְיוֹאָב לֵאמֹר
  choice: Иоаву сообщили
  rationale: Естественно передаёт формулу сообщения без тяжеловесного буквального «сказали Иоаву, говоря».
- source_word: וַיְשַׁלְּחֵהוּ
  choice: тот отпустил его
  rationale: Местоимение «тот» ясно указывает на царя как подлежащее и сохраняет значение «отослал/отпустил».
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Сохраняет традиционный и контекстуально значимый образ благополучного, мирного ухода.
theological_decisions:
- issue: Значение ухода Авенира בְּשָׁלוֹם
  choice: ушёл с миром
  alternative: ушёл невредимым / благополучно
  rationale: Буквальная формулировка сохраняет повествовательное и богословское напряжение с последующим убийством Авенира, не сводя выражение только к физической безопасности.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. Повтор имени «Иоав» сохранён там, где он обеспечивает ясность, а древнееврейская формула речи передана идиоматично.
