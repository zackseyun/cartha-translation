translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Царский писец» понятнее в административном контексте, чем просто «писец», и ближе к исходной лексеме, чем слово «секретарь». Именная часть сказуемого во множественном числе оформлена естественной русской конструкцией с тире.
