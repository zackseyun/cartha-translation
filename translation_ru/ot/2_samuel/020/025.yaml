lexical_decisions:
- source_word: שיא
  choice: Шева
  rationale: Имя передано прямой транслитерацией данной еврейской формы; варианты в параллельных списках не подменяют чтение этого стиха.
- source_word: סֹפֵר
  choice: царский писец
  rationale: Слово обозначает писца, занимавшего административную должность при царе. Сочетание «царский писец» сохраняет основной образ исходного слова и одновременно поясняет служебный характер должности.
- source_word: צָדוֹק
  choice: Садок
  rationale: Традиционная и узнаваемая русская передача собственного имени.
- source_word: אֶבְיָתָר
  choice: Авиафар
  rationale: Традиционная и узнаваемая русская передача собственного имени.
- source_word: כֹּהֲנִים
  choice: священниками
  rationale: Обычная русская передача названия служителей культа; творительный падеж естественно следует за конструкцией «были».
- source_word: וְ
  choice: а
  rationale: Повторяющийся союз связывает пункты перечня; русское «а» естественно продолжает административный список и различает названные должности без выражения резкого противопоставления.
