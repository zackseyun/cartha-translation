base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: ru
  text: Они пришли и осадили его в Авел-Бет-Маахе[a]. Они насыпали осадный вал к городу, и он встал у внешнего укрепления[b]. Весь народ, бывший с Иоавом, разрушал его, чтобы обрушить стену.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осадили город». Буквально в еврейском тексте — «осадили его», вероятно, потому что целью преследования был Савей, находившийся в городе.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может обозначать вал, передовое оборонительное сооружение или внешнюю стену.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Они пришли
  rationale: Обычный повествовательный перевод формы от בוא, обозначающей прибытие войска.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: осадили его
  rationale: Глагол צור с עַל означает «осадить»; мужское местоимение сохраняет фокус еврейского текста на Савее, укрывшемся в городе, а не заменяется пояснительным «город».
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: в Авел-Бет-Маахе
  rationale: Название города передано современной русской транслитерацией; падежное окончание обеспечивает естественное русское звучание.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: насыпали осадный вал
  rationale: Буквальное «высыпали/насыпали» в осадном контексте означает сооружение земляной насыпи; «осадный вал» ясно передаёт назначение סֹלְלָה.
- source_word: אֶל הָעִיר
  choice: у города
  rationale: Предлог указывает направление к городу; по-русски «насыпали … у города» естественно описывает размещение осадного сооружения, не усиливая значение до явно враждебного «против».
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: и тот достиг внешнего укрепления
  rationale: Женская форма глагола соотносится с סֹלְלָה; חֵל обозначает внешнее оборонительное сооружение. «Достиг» естественно передаёт положение насыпи вплотную к укреплению, хотя буквально сказано «стоял».
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: Весь народ, бывший с Иоавом
  rationale: Эллиптическая конструкция выражает сопровождение или принадлежность к стороне Иоава; сохранено общее «народ», а не более узкое «воины».
- source_word: מַשְׁחִיתִם לְהַפִּיל הַחוֹמָה
  choice: разрушал стену, чтобы обрушить её
  rationale: Причастие от שׁחת описывает продолжающееся разрушительное действие, а Hiphil от נפל — намерение заставить стену пасть. Объект «стену» сделан явным из следующей части фразы для ясности по-русски.
