revisions:
- from: Они пришли и осадили его в Авел-Бет-Маахе[a]. Они насыпали осадный вал у города, и тот достиг внешнего укрепления[b]. Весь народ, бывший с Иоавом, разрушал стену, чтобы обрушить её.
  to: Они пришли и осадили его в Авел-Бет-Маахе[a]. Они насыпали осадный вал к городу, и он встал у внешнего укрепления[b]. Весь народ, бывший с Иоавом, разрушал его, чтобы обрушить стену.
  rationale: 'Исправлены две безопасные неточности: «к городу» сохраняет направленность еврейского предлога, а «встал у внешнего укрепления» передаёт статическое расположение осадного вала. Неоднозначный объект в заключительной части сохранён местоимением «его», чтобы не навязывать решение о том, относится ли разрушение непосредственно к укреплению, городу или стене.'
  reviewer_model: gpt-5.6-terra
