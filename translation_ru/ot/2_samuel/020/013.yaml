base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: ru
  text: Как только его убрали с дороги[a], все двинулись вслед за Иоавом, чтобы преследовать Савея, сына Бихри.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с большой дороги»; еврейское слово может обозначать проложенную или главную дорогу.'
    reason: Лексическая альтернатива для מְסִלָּה; основной текст выбирает естественное русское «дорога».
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Как только
  rationale: Вводит придаточное времени; в данном повествовательном контексте передаёт немедленное продолжение движения после устранения препятствия.
- source_word: הֹגָה
  choice: его убрали
  rationale: 'Глагол в породе хофаль выражает понудительный пассив: названный в контексте Амессай был убран с дороги. Местоимение восполняется из предыдущего стиха.'
- source_word: מִן הַמְסִלָּה
  choice: с дороги
  rationale: מְסִלָּה обозначает проложенную, нередко большую дорогу; в русском контексте «с дороги» естественно передаёт место, откуда убрали тело, не создавая современного образа автомагистрали.
- source_word: עָבַר
  choice: двинулись
  rationale: Здесь глагол обозначает продолжение продвижения после того, как путь был освобождён.
- source_word: כָּל אִישׁ
  choice: все воины
  rationale: Буквально «каждый мужчина»; по контексту речь идёт о вооружённых людях Иоава. «Все воины» естественно передаёт собирательное значение и сохраняет контекст.
- source_word: אַחֲרֵי יוֹאָב
  choice: вслед за Иоавом
  rationale: Передаёт движение людей за своим предводителем и естественно звучит в русском повествовании.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: чтобы преследовать
  rationale: Инфинитив с לְ выражает цель движения; רדף — военное преследование.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Савея, сына Бихри
  rationale: Традиционная русская передача имени Шева — «Савей»; патроним сохранён непосредственно.
