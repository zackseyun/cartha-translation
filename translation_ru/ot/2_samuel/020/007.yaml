lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: вслед за ним вышли
  rationale: Сохраняет значение движения следом за ранее названным лицом и не уточняет его референта сверх контекста.
- source_word: אַנְשֵׁי יוֹאָב
  choice: люди Иоава
  rationale: Естественно передаёт конструкцию принадлежности и обозначает людей, находившихся под началом Иоава.
- source_word: הַכְּרֵתִי
  choice: керетеи
  rationale: Передаёт групповое наименование транслитерацией, не подменяя его предположительным толкованием; традиционный русский вариант отмечен в сноске.
- source_word: הַפְּלֵתִי
  choice: пелетеи
  rationale: Транслитерация собственного группового наименования, обычно стоящего в паре с керетеями.
- source_word: כָל הַגִּבֹּרִים
  choice: все могучие воины
  rationale: Передаёт как военное значение גִּבּוֹרִים, так и оттенок силы и доблести.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Точно указывает исходную точку движения.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: чтобы преследовать
  rationale: Естественно передаёт цель движения и значение погони.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Савея, сына Бихри
  rationale: Использует укоренившуюся русскую форму имени Савей и явно передаёт еврейское отчество через «сына Бихри».
