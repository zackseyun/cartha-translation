base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: ru
  text: За ним выступили люди Иоава, керетеи[a], пелетеи и все храбрые воины. Они вышли из Иерусалима, чтобы преследовать Шеву, сына Бихри.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В традиционных русских переводах: «хелефеи и фелефеи».'
