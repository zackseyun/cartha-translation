revisions:
- from: Вслед за ним вышли люди Иоава, керетеи[a], пелетеи и все могучие воины. Они вышли из Иерусалима, чтобы преследовать Савея, сына Бихри.
  to: За ним выступили люди Иоава, керетеи[a], пелетеи и все храбрые воины. Они вышли из Иерусалима, чтобы преследовать Шеву, сына Бихри.
  rationale: Исправлены передача имени Шевы и ошибочная привязка традиционного варианта в сноске. Уточнена стилистика военного перечисления без добавления толкований и без изменения структуры или смысла стиха.
