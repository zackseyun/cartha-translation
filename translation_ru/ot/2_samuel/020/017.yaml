base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: ru
  text: 'Он подошёл к ней, и женщина спросила: «Ты Иоав?» Он ответил: «Я». Тогда она сказала ему: «Выслушай слова твоей рабыни[a]». Он ответил: «Я слушаю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоей служанки». Еврейское слово — женское самоназвание, выражающее смирение и подчинённое положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: Он подошёл к ней
  rationale: Глагол קרב в породе qal обозначает приближение, а אֵלֶיהָ указывает направление к женщине. «Подошёл к ней» естественно передаёт физическое движение в современном русском языке.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: В данном повествовательном контексте אִשָּׁה обозначает взрослую женщину, без указания на семейное положение.
- source_word: הַאַתָּה יוֹאָב
  choice: Ты Иоав?
  rationale: Вопросительная частица с самостоятельным местоимением выражает прямой вопрос об идентичности. Краткая русская конструкция сохраняет непосредственность реплики.
- source_word: אָנִי
  choice: Я
  rationale: Самостоятельное местоимение служит кратким подтверждением личности. Русское «Я» сохраняет лаконичность еврейского ответа, не добавляя отсутствующего в тексте «да».
- source_word: שְׁמַע
  choice: Выслушай
  rationale: Императив שמע здесь просит не просто услышать звук, а внимательно принять речь женщины. «Выслушай» естественно передаёт эту просьбу в контексте разговора.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Форма множественного числа в сопряжённом состоянии буквально означает «слова». Этот выбор сохраняет образ и синтаксическую форму источника.
- source_word: אֲמָתֶךָ
  choice: твоей рабыни
  rationale: אָמָה — обозначение женщины-рабыни или служанки, здесь употреблённое как смиренное самоназвание. «Рабыня» сохраняет женский род и выраженную социальную покорность исходного слова.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: Я слушаю
  rationale: Причастие с самостоятельным местоимением выражает продолжающееся внимательное слушание. Русское «Я слушаю» естественно передаёт этот смысл и сохраняет подчёркнутое местоимение.
