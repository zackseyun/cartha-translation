lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Тогда она сказала
  rationale: Последовательная глагольная форма вводит продолжение повествования, а לֵאמֹר естественно передаётся знаками прямой речи.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: говорили
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольную идею; вместе с בָרִאשֹׁנָה оно описывает известное издавна обыкновение говорить так.
- source_word: בָרִאשֹׁנָה
  choice: в прежние времена
  rationale: Здесь речь идёт о прежнем обычае или старом установившемся порядке, а не просто о первом этапе последовательности.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Пусть непременно спросят
  rationale: Абсолютный инфинитив с имперфектом придаёт выражению подчёркнутый характер; «непременно» сохраняет эту эмфазу, а форма с «пусть» подходит для цитируемого изречения.
- source_word: בְּאָבֵל
  choice: в Авеле
  rationale: Предлог ב естественно передаётся как «в» перед названием города; Авель — сокращённое название Авель-Бет-Маахи.
- source_word: וְכֵן הֵתַמּוּ
  choice: и так завершали дело
  rationale: וְכֵן указывает на способ или результат, а форма от תמם означает доведение до конца; дополнение «дело» подразумевается контекстом и делает фразу естественной по-русски.
