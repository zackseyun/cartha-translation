  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: ru
  text: Когда Давид пришёл в свой дом в Иерусалиме, царь взял десять наложниц, которых оставил присматривать за домом, и поместил их под стражу[a]. Он обеспечивал их всем необходимым, но не входил к ним[b]. Так они оставались взаперти до дня своей смерти, живя как вдовы при живом муже[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дом стражи»; то есть в место заключения или содержания под надзором.'
    reason: lexical_alternative
  - marker: b
    text: «Входить к ним» — древнееврейский эвфемизм, означающий вступать в половые отношения.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «вдовство живых» — они жили как вдовы, хотя Давид оставался жив.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Сохраняет обычное значение בַּיִת и не вводит более узкое «дворец», хотя речь идёт о царской резиденции.
- source_word: פִּלַגְשִׁים
  choice: наложниц
  rationale: Стандартное русское обозначение женщин признанного, но более низкого брачного статуса в древнем царском доме.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: оставил присматривать за домом
  rationale: Передаёт שׁמר естественно по-русски и включает смысл надзора и заботы о резиденции без чрезмерно военного оттенка.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: дом под стражей
  rationale: Сохраняет конкретный образ «дома стражи/заключения» и не скрывает принудительный характер содержания.
- source_word: וַיְכַלְכְּלֵם
  choice: обеспечивал их всем необходимым
  rationale: Передаёт длительное материальное содержание ясным современным языком.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: не входил к ним
  rationale: Сохраняет древнееврейский эвфемизм, смысл которого поясняется в сноске.
- source_word: צְרֻרוֹת
  choice: оставались взаперти
  rationale: Передаёт пассивно-результативное и продолжительное состояние затворничества.
- source_word: עַד יוֹם מֻתָן
  choice: до дня своей смерти
  rationale: Близко воспроизводит именную конструкцию оригинала и естественно звучит по-русски.
- source_word: אַלְמְנוּת חַיּוּת
  choice: живыми вдовами
  rationale: 'Кратко сохраняет парадокс необычного еврейского выражения: они жили как вдовы, хотя Давид был жив.'
theological_decisions:
- issue: Нравственная и общественная оценка обращения Давида с наложницами
  choice: Описать содержание под стражей, обеспечение и прекращение супружеских отношений без оправдания или прямого осуждения.
  alternative: Представить это лишь как защиту либо добавить явную нравственную оценку поступка.
  rationale: Еврейский текст сурово описывает действия Давида и положение женщин, но не даёт здесь прямой нравственной оценки; перевод не должен ни смягчать, ни усиливать её.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировки сохраняют суровость эпизода и необычный образ заключительной фразы, не добавляя конфессиональной или нравоучительной интерпретации.
