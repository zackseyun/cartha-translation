revisions:
- from: Когда Давид вернулся в свой дом в Иерусалиме, царь взял десять наложниц, которых оставил присматривать за домом, и поместил их в дом под стражей[a]. Он обеспечивал их всем необходимым, но не входил к ним[b]. Они оставались взаперти до дня своей смерти — живыми вдовами[c].
  to: Когда Давид пришёл в свой дом в Иерусалиме, царь взял десять наложниц, которых оставил присматривать за домом, и поместил их под стражу[a]. Он обеспечивал их всем необходимым, но не входил к ним[b]. Так они оставались взаперти до дня своей смерти, живя как вдовы при живом муже[c].
  rationale: 'Исправлено значение בֵּית מִשְׁמֶרֶת: женщины были помещены под стражу, а не в дом, находившийся под охраной. Нейтрализован добавочный смысл глагола «вернулся». Последняя фраза перестроена для естественного русского звучания при сохранении длительного затворничества, смерти как предела этого состояния и парадокса «вдовства при живом муже».'
