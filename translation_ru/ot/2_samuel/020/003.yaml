  source_fidelity: Нужна небольшая правка. «Дом под стражей» по-русски означает дом, который охраняют, а не место, куда женщин поместили под надзор/в заключение. Еврейское בֵּית מִשְׁמֶרֶת обозначает именно место содержания под стражей. «Вернулся» вероятно по контексту, но глагол оригинала нейтрально означает «пришёл»; предпочтительно не добавлять оттенок возвращения.
  naturalness: 'В целом стиль современный и ясный. «Поместил их под стражу» естественно передаёт действие и принудительное содержание; буквальный образ «дома стражи» сохранён в сноске. Заключительный оборот лучше сделать синтаксически прозрачным: женщины оставались взаперти и жили как вдовы при живом муже.'
