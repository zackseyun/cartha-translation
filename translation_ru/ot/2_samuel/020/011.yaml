base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: ru
  text: 'Один из слуг Иоава[a] встал над ним и сказал: «Кто поддерживает Иоава и кто за Давида — пусть следует за Иоавом![b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «слуги», может также означать «юноши» или «приближённые». Здесь имеются в виду подчинённые Иоава.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «после Иоава». В данном призыве смысл таков: следовать за Иоавом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Один
  rationale: Существительное אִישׁ здесь вводит неопределённого человека из числа подчинённых Иоава; русское «один из» естественно передаёт эту функцию.
- source_word: עָמַד עָלָיו
  choice: встал над ним
  rationale: Сочетание עמד с עַל может означать положение над кем-либо или возле него. В контексте Амаса лежит на дороге, поэтому «встал над ним» сохраняет конкретную пространственную картину.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: из слуг Иоава
  rationale: נַעַר может обозначать юношу, слугу или сопровождающего. Здесь речь идёт о подчинённом Иоава; «слуга» естественно передаёт служебное отношение, а лексическая неоднозначность отмечена в сноске.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: кто поддерживает Иоава
  rationale: חָפֵץ выражает желание, расположение или благосклонность. В военном призыве «поддерживает» ясно передаёт верность стороне Иоава, не придавая выражению неуместно эмоционального оттенка.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: и кто за Давида
  rationale: Предлог לְ здесь выражает принадлежность или верность; краткое «за Давида» естественно передаёт политико-военную лояльность.
- source_word: אַחֲרֵי יוֹאָב
  choice: за Иоавом
  rationale: Буквально выражение означает «после/за Иоавом». В призыве это эллиптическое побуждение следовать за ним; русский возглас «за Иоавом!» сохраняет и образ, и лаконичность оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, напряжённым ритмом военного призыва. Эллиптическое «за Иоавом!» сохраняет форму и энергичность древнееврейской реплики.
