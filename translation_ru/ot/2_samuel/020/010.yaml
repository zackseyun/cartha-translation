base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: ru
  text: 'Но Амаса не остерёгся меча, который был в руке Иоава, и тот ударил его им в живот[a], так что внутренности его вывалились на землю. Второго удара Иоав не нанёс: Амаса умер. А Иоав и его брат Авишай погнались за Шевой, сыном Бихри.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пятое ребро». Однако еврейское слово здесь, вероятнее всего, обозначает живот или область брюшной полости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: не остерёгся
  rationale: Нифаль глагола שׁמר здесь означает насторожиться, быть начеку, остерегаться опасности. Формулировка естественна по-русски и передаёт, что Амаса не распознал угрозу.
- source_word: חֶרֶב
  choice: меч
  rationale: Обычное значение חֶרֶב; контекст прямо говорит об оружии в руке Иоава.
- source_word: בְּיַד יוֹאָב
  choice: в руке Иоава
  rationale: Сохранён конкретный пространственный смысл еврейского выражения.
- source_word: וַיַּכֵּהוּ בָּהּ
  choice: тот ударил его им
  rationale: Глагол נכה имеет широкое значение «ударить, поразить». «Ударил» не уточняет способ действия сверх того, что выражено в источнике; местоимение «тот» ясно указывает на Иоава.
- source_word: אֶל הַחֹמֶשׁ
  choice: в живот
  rationale: В повествованиях Самуила חֹמֶשׁ, вероятнее всего, обозначает область живота или брюшной полости. Традиционное «в пятое ребро» возможно как исторический вариант, но не является наиболее вероятным смыслом.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: так что внутренности его вывалились на землю
  rationale: Фраза сохраняет наглядность и суровость исходного описания, оставаясь литературной и понятной современному читателю.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Второго удара Иоав не нанёс
  rationale: Буквально выражение означает, что Иоав не повторил действия над ним; в контексте подразумевается удар. Русская формулировка естественно восполняет эллипсис.
- source_word: וַיָּמֹת
  choice: Амаса умер
  rationale: Имя вместо местоимения устраняет возможную двусмысленность после упоминания обоих участников, не меняя смысла простого повествовательного глагола.
- source_word: רָדַף אַחֲרֵי
  choice: погнались за
  rationale: Естественное русское выражение для преследования бегущего противника; сохраняет военный контекст.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Савей, сын Бихри
  rationale: 'Имена переданы в форме, укоренённой в русской библейской традиции: שֶׁבַע — Савей, בִּכְרִי — Бихри.'
