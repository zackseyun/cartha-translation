  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: ru
  text: Амаса корчился в крови[a] посреди дороги. Тот человек, увидев, что весь народ останавливается, убрал Амасу с дороги в поле и набросил на него одежду, ибо видел, что каждый, кто подходил к нему, останавливался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ворочался (перекатывался) в крови». Еврейский глагол описывает движение тела; здесь, вероятно, имеются в виду предсмертные движения тяжело раненного Амасы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: корчился
  rationale: Возвратная форма глагола גלל буквально описывает перекатывание или ворочание. В данном контексте «корчился» естественно передаёт движения смертельно раненного Амасы, не приписывая им добровольности; буквальный оттенок сохранён в примечании.
- source_word: בַּדָּם
  choice: в крови
  rationale: Такой оборот естественен по-русски и сохраняет наглядность еврейского текста, не добавляя отсутствующего в нём местоимения «своей».
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: посреди дороги
  rationale: מְסִלָּה обозначает проложенную дорогу, нередко большую или насыпную. В данном повествовании нейтральное «дорога» звучит естественно и ясно передаёт место действия.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Определённый артикль указывает на конкретного человека, известного из предшествующего контекста; «тот человек» сохраняет эту определённость.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: что весь народ останавливается
  rationale: Здесь עמד означает, что идущие прекращали движение при виде Амасы. Настоящее время в зависимой части естественно передаёт разворачивающееся и повторяющееся действие.
- source_word: וַיַּסֵּב
  choice: убрал
  rationale: Каузативная форма סבב означает, что человек переместил Амасу в сторону. «Убрал» ясно передаёт устранение тела с дороги, не уточняя не названный в тексте способ перемещения.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: с дороги на поле
  rationale: Конструкция обозначает перемещение с проезжей дороги в прилегающее поле; русский оборот краток и однозначен.
- source_word: בֶּגֶד
  choice: одежду
  rationale: בֶּגֶד — общее название предмета одежды. Перевод не сужает значение до «плаща» и сохраняет предметный смысл.
- source_word: כָּל הַבָּא עָלָיו
  choice: каждый, кто подходил к нему
  rationale: Выражение описывает людей, которые, идя по дороге, оказывались возле Амасы. «Подходил к нему» естественно передаёт приближение, не добавляя намерения помочь.
- source_word: וְעָמָד
  choice: останавливался
  rationale: Повтор עמד возвращает к ранее описанной реакции прохожих; несовершенный вид по-русски передаёт повторяемость действия.
