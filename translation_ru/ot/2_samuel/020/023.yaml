  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: ru
  text: Иоав начальствовал над всем войском Израиля, а Ванея, сын Иодая, — над карийцами[a] и фелефеями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «керетеями» (также «херетеями»). Точная передача и отождествление названия этой группы не установлены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹאָב
  choice: Иоав
  rationale: Союз וְ вводит очередной пункт перечня должностных лиц; в русском отдельный начальный союз не требуется. Имя передано в традиционной русской форме.
- source_word: אֶל כָּל הַצָּבָא יִשְׂרָאֵל
  choice: начальствовал над всем войском Израиля
  rationale: В безглагольной административной формуле אֶל обозначает положение по отношению к войску, то есть командование им. «Начальствовал над» естественно передаёт должностное полномочие, а כָּל сохранено словом «всем».
- source_word: וּבְנָיָה בֶּן יְהוֹיָדָע
  choice: а Ванея, сын Иодая
  rationale: Имена переданы в устойчивой русской библейской форме; «а» естественно связывает и различает два пункта перечня.
- source_word: עַל הַכָּרִי
  choice: над карийцами[a]
  rationale: Масоретское написание указывает на карийцев (кариев), вероятно подразделение царской охраны. Этноним передан транслитерационно, без попытки истолковать его функцию; известный вариант отражён в сноске.
- source_word: וְעַל הַפְּלֵתִי
  choice: и фелефеями
  rationale: עַל обозначает руководство подразделением и по-русски распространяется из предыдущего оборота. Название группы передано традиционной русской библейской формой.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением достоинства административного перечня. Эллипсис во второй части («— над») избегает ненужного повтора глагола и точно передаёт безглагольную структуру оригинала. Традиционные русские формы личных и групповых имён сохранены там, где они устоялись.
