base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: ru
  text: Когда они были у большого камня, что в Гаваоне, Амесса подошёл к ним[a]. Иоав был одет в воинскую одежду; поверх неё на его бёдрах был пояс с прикреплённым к нему мечом в ножнах. Когда Иоав вышел, меч выпал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Амесса пришёл перед ними». Возможно: «Амесса подошёл им навстречу».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и она выпала». Женская форма еврейского глагола, вероятнее всего, относится к мечу, поскольку слово «меч» в еврейском здесь женского рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: Когда они были у большого камня
  rationale: Предлог עִם при обозначении места передан естественным русским «у», выражающим нахождение рядом.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: что в Гаваоне
  rationale: Краткое определительное придаточное естественно обозначает местонахождение известного камня.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: Амесса предстал перед ними
  rationale: Сохраняется пространственно-событийный смысл לִפְנֵי — «перед ними», без однозначного сведения выражения к намеренной встрече.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: был одет в воинскую одежду
  rationale: מַד может обозначать особую, в данном контексте воинскую одежду; формулировка остаётся понятной и не вводит более конкретного вида доспеха.
- source_word: וְעָלָיו חֲגוֹר
  choice: а поверх неё опоясан поясом
  rationale: Передаёт состояние опоясанности и то, что пояс находился поверх одежды.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: меч в ножнах был пристёгнут к поясу у него на бедре
  rationale: «Пристёгнут» передаёт מְצֻמֶּדֶת, «у него на бедре» естественно выражает положение оружия при מָתְנַיִם, а женский суффикс в תַּעְרָהּ соотнесён с мечом.
- source_word: וְהוּא יָצָא
  choice: Когда Иоав вышел
  rationale: Обстоятельственная связь с последующим падением естественна по-русски; имя повторено для ясности референта.
- source_word: וַתִּפֹּל
  choice: меч выпал
  rationale: Женская форма глагола наиболее естественно указывает на חֶרֶב, грамматически женского рода в еврейском; явное существительное устраняет неясный русский референт.
