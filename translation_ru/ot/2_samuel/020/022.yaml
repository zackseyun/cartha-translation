translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; жестокая деталь оригинала не смягчена. Подлинная многозначность בוא и обстоятельственный смысл בְּחָכְמָתָהּ переданы без конфессиональных или толковательных добавлений.
