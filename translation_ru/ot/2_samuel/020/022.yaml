base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: ru
  text: Тогда женщина, поступив мудро, пошла ко всему народу. Они отсекли голову Савея, сына Бихри, и бросили её Иоаву. Иоав протрубил в рог, и они разошлись от города — каждый к своему шатру[a]. А Иоав вернулся в Иерусалим к царю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый к своим шатрам» — устойчивое выражение, означающее, что люди разошлись по своим местам.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל כָּל הָעָם
  choice: женщина ... пошла ко всему народу
  rationale: Глагол בוא допускает значения «приходить» и «идти» в зависимости от точки зрения. Здесь «пошла» естественно передаёт движение женщины к собравшемуся народу и не добавляет отсутствующих в тексте подробностей.
- source_word: בְּחָכְמָתָהּ
  choice: поступив мудро
  rationale: Оборот передаёт обстоятельственно-инструментальный смысл еврейского выражения («в своей мудрости», «посредством своей мудрости») естественным современным русским языком.
- source_word: אֶל כָּל הָעָם
  choice: ко всему народу
  rationale: עָם имеет широкое значение; нейтральное «народ» не сужает референт до воинов или горожан.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: они отсекли голову
  rationale: При существительном «голова» глагол כרת обозначает отсечение; выбранное выражение точно и естественно по-русски.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Савея, сына Бихри
  rationale: Использованы укоренившиеся русские библейские формы имён; патронимическая конструкция передана явно.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: бросили её Иоаву
  rationale: Местоимение «её» естественно указывает на голову; предлог передаёт направление и получателя действия.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Иоав протрубил в рог
  rationale: Подлежащее, подразумеваемое формой единственного числа, по контексту — Иоав. «Рог» точнее передаёт שׁוֹפָר, чем обозначение современной трубы.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: все разошлись от города
  rationale: Передан распад осаждавшего город войска и его удаление; «разошлись» сохраняет значение рассеивания без обязательного оттенка панического бегства.
- source_word: אִישׁ לְאֹהָלָיו
  choice: каждый к своему шатру
  rationale: Формально сохранён устойчивый древнееврейский оборот, смысл которого поясняется в сноске.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: А Иоав вернулся в Иерусалим к царю
  rationale: Прямо сохранены место назначения и возвращение Иоава к царю; союз «а» естественно обозначает смену участника повествования.
