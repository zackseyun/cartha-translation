base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: ru
  text: Я — из мирных и верных в Израиле. Ты хочешь погубить город и мать в Израиле.[a] Зачем тебе поглотить удел Яхве?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город, который является матерью в Израиле» — вероятно, значимый город, служащий опорой для других жителей Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי
  choice: из мирных и верных
  rationale: Две формы множественного числа передают принадлежность говорящей к мирным и верным людям Израиля. Такая конструкция сохраняет собирательный смысл еврейского выражения и естественно звучит по-русски.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: хочешь погубить
  rationale: Оборот с причастием и инфинитивом выражает намерение. Буквальное «умертвить» плохо сочетается с городом как объектом, тогда как «погубить» сохраняет тяжесть действия и подходит к уничтожению города и его жителей.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: город и мать в Израиле
  rationale: 'Буквальная координация сохраняет метафору и синтаксическую неоднозначность: речь может идти либо о городе и «матери», либо, вероятнее, о городе как матери в Израиле. Возможное аппозиционное понимание дано в сноске.'
- source_word: תְבַלַּע
  choice: поглощать
  rationale: Сохранён яркий буквальный образ глагола «глотать, поглощать», который в контексте осады означает уничтожение.
- source_word: נַחֲלַת יְהוָה
  choice: удел Яхве
  rationale: «Удел» естественно передаёт נַחֲלָה и сохраняет заветную мысль о народе и земле, принадлежащих Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем Яхве и титулом «Господь».
theological_decisions:
- issue: Образ «матери в Израиле»
  choice: Сохранить в основном тексте буквальное «город и мать в Израиле»
  alternative: «город, который является матерью в Израиле» или «город-мать в Израиле»
  rationale: Еврейская фраза допускает аппозиционное понимание, но её грамматическая форма и образность не требуют молча устранять неоднозначность. Сноска сообщает вероятный смысл, не подменяя им текст.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной риторики и метафорики. «Погубить» выбрано вместо неестественного применительно к городу «умертвить»; заключительный вопрос передан как выразительное «Зачем тебе…?».
