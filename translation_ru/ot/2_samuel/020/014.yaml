  source_fidelity: Основной текст в целом точно передаёт движение Савея через территории израильских колен к Авелу и Бет-Маахе, собрание беритов и их присоединение к нему. «По землям» — допустимое эксплицитное выражение территориального значения בְּכָל שִׁבְטֵי יִשְׂרָאֵל. Однако «тоже пошли за ним» несколько сужает וַיָּבֹאוּ אַף אַחֲרָיו, где глагол буквально означает «пришли»; более нейтральное «тоже пришли вслед за ним» сохраняет формулировку оригинала и его возможную нюансировку.
  naturalness: Русский текст современный и ясный. «До Авела и Бет-Маахи» естественно передаёт направительное значение; «бериты» как неустановленное этническое обозначение уместно оставить транслитерацией. Небольшая правка второго предложения повышает точность без ущерба естественности.
