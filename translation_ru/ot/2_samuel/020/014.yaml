  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: ru
  text: Он прошёл по землям всех колен Израиля до Авела и Бет-Маахи. Все бериты[a] собрались и тоже пришли вслед за ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «все бериты». В некоторых переводах передано: «все бихриты»; это связывает данную группу с Савеем, сыном Бихри, по контексту. Однако масоретский текст здесь непосредственнее поддерживает форму «бериты».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «и они тоже пошли за ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Он прошёл
  rationale: Глагол עבר в повествовательной форме обозначает продвижение через территорию; «прошёл» естественно передаёт движение по землям колен.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: по землям всех колен Израиля
  rationale: Предлог ב здесь имеет локально-распределительное значение. Добавление «по землям» делает географический смысл ясным и избегает неестественного русского выражения «через все колена».
- source_word: אָבֵלָה
  choice: до Авела
  rationale: Направительное окончание -ה указывает на движение к Авелу; «до» естественно выражает достигнутый пункт движения.
- source_word: וּבֵית מַעֲכָה
  choice: и Бет-Маахи
  rationale: В контексте это географическое название, а не буквальное «дом Маахи»; форма поставлена в родительный падеж после «до».
- source_word: וְכָל הַבֵּרִים
  choice: Все бериты
  rationale: Масоретская огласовка непосредственно указывает на название группы «бериты». Транслитерация сохраняет неопределённость идентификации и не подменяет текст контекстуальной реконструкцией «бихриты».
- source_word: וַיִּקָּהֲלוּ
  choice: собрались
  rationale: Форма от קהל описывает людей, собравшихся вместе; «собрались» кратко и естественно передаёт это значение.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: и тоже пошли за ним
  rationale: Буквальное «пришли вслед за ним» в данном контексте означает присоединение к его движению. «Пошли за ним» передаёт идиоматический смысл, а «тоже» соответствует אַף.
