  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: ru
  text: 'Тогда мудрая женщина крикнула из города: «Послушайте! Послушайте! Скажите, пожалуйста, Иоаву: „Подойди сюда, чтобы я могла поговорить с тобой“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: одна мудрая женщина
  rationale: Естественно передаёт неопределённое упоминание женщины и прямо сохраняет характеристику «мудрая».
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Послушайте! Послушайте!
  rationale: Сохраняет повтор повелительной формы множественного числа и настойчивость возгласа.
- source_word: אִמְרוּ נָא
  choice: Скажите, пожалуйста
  rationale: Частица נָא придаёт просьбе вежливый или настоятельный оттенок; «пожалуйста» естественно выражает его по-русски.
- source_word: קְרַב עַד הֵנָּה
  choice: Подойди сюда
  rationale: Краткое и естественное русское соответствие приглашению приблизиться к месту, где находится говорящая.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: и я поговорю с тобой
  rationale: Когортативная форма выражает намерение женщины заговорить с Иоавом; союз «и» сохраняет простую координацию исходного текста.
