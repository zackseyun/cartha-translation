lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Обычная повествовательная форма глагола הלך; «отправился» естественно передаёт начало порученного действия.
- source_word: לְהַזְעִיק
  choice: созвать
  rationale: Порода hифиль от זעק здесь означает срочно собрать людей; «созвать» сохраняет официальный и настоятельный характер, не сводя значение исключительно к военной мобилизации.
- source_word: אֶת יְהוּדָה
  choice: Иудею
  rationale: Название области и племени употреблено собирательно, то есть подразумевает жителей или воинов Иудеи; русский перевод сохраняет краткость оригинала.
- source_word: וייחר
  choice: опоздал
  rationale: Глагол אחר в данном контексте указывает на несоблюдение установленного срока; «опоздал к сроку» естественно передаёт сочетание с מִן הַמּוֹעֵד.
- source_word: מִן הַמּוֹעֵד
  choice: к сроку
  rationale: מוֹעֵד обозначает назначенное время; вместе с אחר выражение означает, что Амаса не уложился в установленный срок.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: который царь назначил ему
  rationale: יעד означает назначить, установить время. Подлежащее в еврейском не названо явно, но из предыдущего стиха им является царь Давид; слово «царь» обеспечивает в русском ясную отсылку без добавления имени.
