base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: ru
  text: 'И сказал Давид Авессе: «Теперь Савей, сын Бихри, причинит нам больше вреда, чем Авессалом. Ты возьми слуг твоего господина и преследуй его, чтобы он не нашёл себе укреплённых городов и не скрылся у нас из виду[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и избавит наши глаза»; это еврейское выражение означает «скроется у нас из виду» или «ускользнёт от нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: причинит нам больше зла
  rationale: В данном контексте глагол обозначает причинение беды или вреда. Формулировка сохраняет сравнительную конструкцию и серьёзный тон, не сводя выражение к отвлечённому моральному злу.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Сава, сын Бихри
  rationale: Использованы традиционная русская форма имени Сава и близкая к еврейскому звучанию форма Бихри.
- source_word: מִן אַבְשָׁלוֹם
  choice: чем Авессалом
  rationale: Предлог מִן здесь выражает сравнение; краткая русская конструкция сохраняет смысл без избыточного дополнения «причинил».
- source_word: אַתָּה קַח
  choice: Ты возьми
  rationale: Отдельное местоимение אַתָּה придаёт повелению особое ударение, которое сохранено в переводе.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: слуг своего господина
  rationale: Сочетание передаёт отношения подчинения и указывает на людей Давида, не вводя более узкого значения «рабы».
- source_word: וּרְדֹף אַחֲרָיו
  choice: и преследуй его
  rationale: Естественная русская передача военного преследования; буквальное воспроизведение предлога после глагола по-русски было бы избыточным.
- source_word: פֶּן
  choice: чтобы ... не
  rationale: Современная и ясная русская конструкция для отрицательной цели или опасения.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: не нашёл себе укреплённых городов
  rationale: Сохранены буквальное значение מָצָא «нашёл», дательный выгоды לוֹ «себе» и образ укреплённых городов как убежища.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: и не скрылся у нас из виду
  rationale: Еврейская идиома буквально связана с «нашими глазами» и означает уйти из поля зрения, ускользнуть. Русское выражение сохраняет зрительный образ и естественно звучит.
