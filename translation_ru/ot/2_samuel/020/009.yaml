base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: ru
  text: 'Иоав сказал Амессаю[a]: «Всё ли у тебя благополучно, брат мой?» Иоав правой рукой взял Амессая за бороду, чтобы поцеловать его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Взяться за бороду и поцеловать — жесты, связанные с дружеским приветствием; однако в данном контексте Иоав использует этот жест для обмана.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  choice: Всё ли у тебя благополучно
  rationale: Еврейская идиома выражает вопрос о мире и благополучии человека. Русская формулировка передаёт этот смысл естественно, не сводя реплику к нейтральному «Как дела?».
- source_word: אָחִי
  choice: брат мой
  rationale: Сохранены существительное и явный притяжательный суффикс; обращение передаёт притворную сердечность Иоава, не объясняя её внутри текста.
- source_word: וַתֹּחֶז
  choice: взял … за
  rationale: Глагол обозначает удерживание или хватание. «Взял за бороду» естественно по-русски и не усиливает насильственный оттенок прежде описанного в следующем стихе нападения.
- source_word: יַד יְמִין יוֹאָב
  choice: правой рукой … Иоав
  rationale: Сохранена подчёркнутая исходным текстом деталь о правой руке Иоава и по возможности воспроизведён порядок компонентов еврейской фразы.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: Амессая за бороду
  rationale: Русская конструкция «взять кого-либо за бороду» естественно передаёт предложное сочетание и принадлежность бороды Амессаю.
- source_word: לִנְשָׁק לוֹ
  choice: чтобы поцеловать его
  rationale: Инфинитив с ל выражает цель действия; придаточное цели ясно и естественно передаёт эту связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Инверсия «правой рукой взял Иоав» умеренно возвышенна и сохраняет акцент и порядок деталей исходного текста; реплика звучит сердечно, но не скрывает непривычной для современного читателя формулы приветствия.
