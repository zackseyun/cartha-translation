lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Иоав ответил
  rationale: Двойная древнееврейская формула введения речи буквально означает «Иоав ответил и сказал», но в современном русском естественно передаётся одним глаголом «ответил» без потери смысла.
- source_word: חָלִילָה חָלִילָה לִי
  choice: Нет, нет!
  rationale: Удвоенное междометное выражение передаёт решительное и эмоциональное отвержение мысли. Русское «Нет, нет!» сохраняет повтор и звучит естественнее буквального «далеко это от меня».
- source_word: אִם אֲבַלֵּע
  choice: Не стану я поглощать
  rationale: После חָלִילָה частица אִם вводит решительно отвергаемое действие и по-русски естественно передаётся отрицательной конструкцией. «Поглощать» сохраняет яркий образ глагола בלע — «глотать, поглощать».
- source_word: וְאִם אַשְׁחִית
  choice: или губить
  rationale: Глагол שׁחת в породе хифиль означает «уничтожать, разорять, губить». «Губить» ясно передаёт разрушительное действие, а союз «или» естественно связывает два отвергаемых намерения.
