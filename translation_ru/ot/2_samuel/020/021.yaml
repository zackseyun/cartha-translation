  source_fidelity: 'Текст точно передаёт смысл еврейского оригинала: опровержение прежнего предположения, указание на Савея, сына Бихри, его враждебное выступление против царя Давида, требование выдать только виновника и обещание Иоава отступить от города. Повтор «на царя, на Давида» обоснованно сохраняет эмфазу оригинала. «Поднял руку» верно удерживает образ идиомы, не подменяя его в основном тексте однозначным толкованием.'
