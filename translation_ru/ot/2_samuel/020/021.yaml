translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествования. Имена переданы в привычных русских библейских формах. Буквальный образ «поднял руку» оставлен в основном тексте, а его мятежный смысл пояснён в сноске; географическая неоднозначность הַר также сохранена в сноске.
