  text: לֹא כֵ֣ן הַ/דָּבָ֗ר כִּ֡י אִישׁ֩ מֵ/הַ֨ר אֶפְרַ֜יִם שֶׁ֧בַע בֶּן בִּכְרִ֣י שְׁמ֗/וֹ נָשָׂ֤א יָד/וֹ֙ בַּ/מֶּ֣לֶךְ בְּ/דָוִ֔ד תְּנֽוּ אֹת֣/וֹ לְ/בַדּ֔/וֹ וְ/אֵלְכָ֖ה מֵ/עַ֣ל הָ/עִ֑יר וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל יוֹאָ֔ב הִנֵּ֥ה רֹאשׁ֛/וֹ מֻשְׁלָ֥ךְ אֵלֶ֖י/ךָ בְּעַ֥ד הַ/חוֹמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: ru
  text: '«Нет, дело не в этом. Но один человек из горной области Ефрема[a], по имени Савей, сын Бихри, поднял руку[b] на царя, на Давида. Выдайте только его, и я отступлю от города». Женщина сказала Иоаву: «Вот, его голову бросят тебе через стену».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с горы Ефрема»; выражение обычно понимают как название гористой области Ефрема.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть восстал против царя. Буквально: «поднял свою руку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: Нет, дело не в этом
  rationale: Естественно передаёт опровержение предыдущего предположения женщины, не воспроизводя механически еврейский порядок слов.
- source_word: כִּי
  choice: Но
  rationale: После отрицания союз вводит поправку и объяснение; русское «но» естественно выражает этот переход.
- source_word: מֵהַר אֶפְרַיִם
  choice: из горной области Ефрема
  rationale: Выражение обозначает гористую область, связанную с Ефремом, а не обязательно одну отдельную гору.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: по имени Савей, сын Бихри
  rationale: Сохраняет формулу именования; «Савей» — укоренившаяся русская библейская форма имени שֶׁבַע.
- source_word: נָשָׂא יָדוֹ
  choice: поднял руку
  rationale: Сохраняет образ еврейской идиомы, контекстуально указывающей на враждебное выступление или мятеж.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: на царя, на Давида
  rationale: Повтор предлога передаёт эмфатическую аппозицию оригинала и отождествляет царя с Давидом.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Выдайте только его
  rationale: Естественно выражает требование передать осаждающим одного виновника, сохраняя ограничительное значение לְבַדּוֹ.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: и я отступлю от города
  rationale: В контексте осады речь идёт об отходе Иоава и его войска от города, а не о выходе из него.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт эмфатическое заверение в современной, но достойной русской речи.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: его голову бросят тебе через стену
  rationale: Русская неопределённо-личная конструкция естественно передаёт пассивное причастие с оттенком близкого будущего; «через стену» соответствует действию в контексте.
