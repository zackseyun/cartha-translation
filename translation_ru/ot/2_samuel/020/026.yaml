- source_word: וְגַם
  choice: И ... также
  rationale: Сочетание союза и усилительно-присоединительной частицы передаёт продолжение перечня и добавочное значение; конструкция естественна в русском повествовании.
- source_word: עִירָא
  choice: Ира
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: הַיָּאִרִי
  choice: Иаирянин
  rationale: Относительное обозначение рода или происхождения естественно и кратко передаётся русской формой «Иаирянин».
- source_word: הָיָה
  choice: был
  rationale: В перечне должностных лиц форма глагола выполняет простую связочную функцию в прошедшем времени, а не означает «стал».
- source_word: כֹהֵן
  choice: священником
  rationale: Сохранено основное словарное значение слова. Возможное обозначение высокого придворного служителя вынесено в сноску, чтобы не устранять неоднозначность оригинала.
- source_word: לְדָוִד
  choice: при Давиде
  rationale: В данном административном контексте русский оборот «при Давиде» естественно выражает служебное отношение к царю, не уточняя чрезмерно характер должности.
theological_decisions:
- issue: Значение כֹּהֵן в контексте царского двора
  choice: В основном тексте сохранено «священником»
  alternative: главным сановником; царским советником
  rationale: Хотя в придворном контексте слово может обозначать высокого служителя царя, его прямое и обычное значение — «священник». Основной текст сохраняет это значение, а функциональные толкования приведены в сноске, чтобы не разрешать неоднозначность оригинала без достаточных оснований.
