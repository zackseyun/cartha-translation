source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: ru
  text: 'Там оказался негодный человек[a] по имени Шева, сын Бихри, вениамитянин. Он протрубил в рог[b] и сказал: «Нет у нас доли[c] в Давиде, нет у нас наследия в сыне Иессея! Каждый — к своим шатрам[d], Израиль!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злой человек», «негодяй»; буквальнее: «человек негодности». Традиционный вариант — «человек Велиара».'
    reason: lexical_alternative
  - marker: b
    text: Евр. шофар — рог, которым подавали общественный сигнал; традиционно считается бараньим рогом.
    reason: cultural_note
  - marker: c
    text: 'Или: «Нет у нас части в Давиде».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «каждый к своим шатрам». Это распределительный оборот — призыв каждому разойтись к себе домой или в свой стан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: оказался
  rationale: В сочетании с שָׁם форма выражает наличие или появление человека в данном месте, а не его именование. «Там оказался» естественно передаёт повествовательное введение без добавления отсутствующего в еврейском тексте слова «теперь».
- source_word: אִישׁ בְּלִיַּעַל
  choice: негодный человек
  rationale: Здесь בְּלִיַּעַל характеризует человека как нравственно низкого, злого или беспутного; это не обязательно имя собственное. Перевод не привносит более позднее представление о Велиаре как личном демоническом существе.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Шева, сын Бихри
  rationale: Имена переданы транслитерацией, приближённой к еврейской форме.
- source_word: אִישׁ יְמִינִי
  choice: вениамитянин
  rationale: Выражение обозначает племенную принадлежность; «вениамитянин» кратко и ясно передаёт этот смысл.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: протрубил в рог
  rationale: שׁוֹפָר — сигнальный рог, традиционно связываемый с бараньим рогом. «Протрубил в рог» передаёт и предмет, и публичный сигнальный характер действия.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Нет у нас доли в Давиде
  rationale: חֵלֶק означает долю или часть; оборот выражает отказ признавать свою причастность к царствованию Давида.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: нет у нас наследия в сыне Иессея
  rationale: «Наследие» сохраняет основной образ נַחֲלָה и его возможные земельно-заветные отзвуки, не устраняя политический смысл лозунга.
- source_word: בְּבֶן יִשַׁי
  choice: в сыне Иессея
  rationale: Обозначение Давида через отца вместо царского титула сохраняет намеренно пренебрежительный оттенок речи.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Каждый — к своим шатрам
  rationale: Буквально это распределительный оборот «каждый к своим шатрам». Лаконичная конструкция сохраняет форму призыва и не заменяет образ шатров его подразумеваемым смыслом «по домам».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Слово понято как обращение к Израилю и поставлено в конце лозунга, как в еврейском тексте.
theological_decisions:
- issue: Является ли בְּלִיַּעַל именем собственным или характеристикой человека
  choice: Описательное выражение «негодный человек»
  alternative: «человек Велиара» или «сын Велиара»
  rationale: В данном историческом контексте сочетание характеризует нравственную негодность или беззаконие Шевы. Имя собственного демонического существа текст здесь не требует.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом мятежного лозунга. Сохранены повтор «нет у нас», образ наследия, пренебрежительное «сын Иессея» и буквальный образ шатров; архаическое звательное «о Израиль» не добавлено.
