  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: ru
  text: 'Тогда царь сказал Амасе: «Созови для меня мужчин Иуды[a] не позднее чем через три дня, а сам оставайся здесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте употреблено собирательное выражение мужского рода. Вероятно, имеются в виду способные к военной службе мужчины Иуды, однако прямо «воинами» они не названы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вав с последовательной глагольной формой продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное относится в контексте к Давиду; замена титула именем не требуется.
- source_word: הַזְעֶק
  choice: созови
  rationale: Побудительная форма породы hифиль от זעק здесь означает объявить сбор, мобилизовать. «Созови» естественно передаёт распоряжение собрать людей.
- source_word: לִי
  choice: ко мне
  rationale: В сочетании с глаголом созыва дательный компонент естественно понимается как направление сбора к царю; «ко мне» сохраняет эту возможность и соответствует контексту.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: мужчин Иуды
  rationale: אִישׁ стоит в единственном числе, но употреблён собирательно. Перевод сохраняет мужской собирательный смысл и не добавляет прямо не выраженного значения «воины».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: за три дня
  rationale: В контексте приказа сочетание обозначает срок, в который поручение должно быть исполнено, а не продолжительность действия.
- source_word: וְאַתָּה
  choice: а сам
  rationale: Явно выраженное местоимение подчёркивает Амасу; русское «а сам» естественно сохраняет выделение и умеренное сопоставление.
- source_word: פֹּה
  choice: здесь
  rationale: Прямой и естественный эквивалент наречия места.
- source_word: עֲמֹד
  choice: оставайся
  rationale: Хотя основное значение глагола — «стоять», здесь приказ означает находиться и ждать в указанном месте; «оставайся» передаёт смысл без излишне буквального физического оттенка.
