  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: ru
  text: И все израильтяне оставили Давида и последовали за Савеем, сыном Бихри[a], а люди Иуды неотступно держались своего царя[b] от Иордана до Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякий муж Израиля поднялся от следования за Давидом вслед за Савеем». Оборот описывает уход от Давида и переход к Савею.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «крепко держались своего царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: перестали следовать
  rationale: Буквально глагол означает «поднялся / пошёл», но в сочетании מֵאַחֲרֵי דָוִד и при последующем אַחֲרֵי естественно выражает уход от Давида и смену преданности. Русское «перестали следовать» передаёт функцию оборота, не навязывая конкретного направления движения.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Еврейское выражение буквально значит «всякий муж Израиля» и употреблено собирательно. Современное русское «все израильтяне» естественно передаёт эту коллективную множественность.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: пошли за Савеем, сыном Бихри
  rationale: Повтор אַחֲרֵי обозначает следование за новым предводителем и тем самым перенос политической преданности. «Пошли за» сохраняет и образ движения, и смысл поддержки.
- source_word: וְאִישׁ יְהוּדָה
  choice: а люди Иуды
  rationale: Форма единственного числа имеет собирательное значение. Союз «а» естественно передаёт контраст между отпадением Израиля и верностью Иуды.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: остались верны своему царю
  rationale: דבק буквально описывает крепкое прилепление, а здесь означает стойкую преданность царю. Такое выражение в современном русском яснее буквального «держались своего царя».
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: сопровождали его от Иордана до Иерусалима
  rationale: Сам по себе оборот указывает протяжённость от Иордана до Иерусалима; по контексту люди Иуды держались царя на всём пути. Добавление «сопровождали его» делает синтаксическую связь ясной, не меняя характера их верности.
theological_decisions:
- issue: Характер следования за Давидом и Савеем
  choice: 'Передать как смену политической преданности: «перестали следовать… и пошли за…»'
  alternative: 'Сохранить буквальное пространственное выражение: «поднялись от Давида вслед за Савеем»'
  rationale: Контекст повествует о расколе и выборе предводителя. Выбранная формулировка сохраняет образ следования, одновременно делая подразумеваемую смену стороны понятной.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Имена переданы в традиционной русской библейской форме: Савей, Бихри. Собирательные мужские выражения оригинала переданы естественными русскими множественными формами.'
