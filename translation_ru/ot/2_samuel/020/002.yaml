    issue: В текст добавлено действие «сопровождали его».
    rationale: В оригинале нет отдельного глагола «сопровождать». Оборот «от Иордана до Иерусалима» относится к тому, что люди Иуды держались царя; добавление самостоятельного действия излишне конкретизирует текст.
  - severity: low
    issue: «Перестали следовать» не передаёт движение, выраженное וַיַּעַל.
    rationale: Хотя контекст действительно говорит о переходе на сторону Савея, глагол עלה содержит компонент движения. Формула «оставили Давида и последовали за Савеем» естественно передаёт переход и не требует неестественного буквального «поднялись от Давида».
