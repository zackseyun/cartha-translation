lexical_decisions:
- source_word: אֲדֹרָם
  choice: Адорам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: עַל
  choice: заведовал
  rationale: В административном контексте предлог указывает на руководство определённой государственной службой; русский глагол естественно передаёт подразумеваемую именную конструкцию.
- source_word: הַמַּס
  choice: трудовой повинностью
  rationale: В контексте царской администрации מַס обозначает обязательную государственную трудовую службу, а не обычный денежный налог. «Трудовая повинность» точно и понятно передаёт это значение.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: בֶּן אֲחִילוּד
  choice: сын Ахилуда
  rationale: Стандартная передача еврейской патронимической конструкции.
- source_word: הַמַּזְכִּיר
  choice: царским делопроизводителем
  rationale: Титул обозначает придворного чиновника, ведавшего государственными записями и памятными документами. «Делопроизводитель» точнее описывает служебную функцию, чем «летописец», а уточнение «царский» естественно следует из контекста перечня царских чиновников.
