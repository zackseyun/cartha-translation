base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: ru
  text: Давид позвал Урию[a], и тот ел и пил в его присутствии[b]. Давид напоил его допьяна. Вечером Урия вышел, чтобы лечь на свою постель вместе со слугами своего господина[c], но к себе домой не спустился[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пригласил Урию».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед ним», то есть в присутствии Давида.'
    reason: lexical_alternative
  - marker: c
    text: То есть со слугами Давида; господин Урии здесь — Давид.
    reason: referent_clarification
  - marker: d
    text: 'Буквально: «не спустился к своему дому». Направительный глагол сохранён вслед за еврейским текстом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: Давид позвал Урию
  rationale: Конструкция קרא с ל может означать позвать или призвать кого-либо. «Позвал» естественно передаёт инициативу Давида, не уточняя сверх текста, было ли это приглашением или приказом.
- source_word: לְפָנָיו
  choice: в его присутствии
  rationale: Буквально «перед ним»; современное русское выражение ясно указывает, что Урия ел и пил в присутствии Давида.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: Давид напоил его
  rationale: Каузативная форма от שׁכר означает, что Давид довёл Урию до опьянения. Повтор имени устраняет возможную местоименную двусмысленность.
- source_word: בָּעֶרֶב
  choice: Вечером
  rationale: Естественно передаёт временной переход в повествовании.
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: лёг на свою постель
  rationale: Передаёт конкретное действие «лечь» и значение מִשְׁכָּב как постели или места для сна, не подменяя его глаголом «уснул».
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: вместе со слугами своего господина
  rationale: Сохраняет отношения принадлежности в еврейском тексте; господин Урии в данном контексте — Давид.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: но к себе домой не спустился
  rationale: Сохранён направительный глагол ירד «спускаться», важный и повторяющийся в ближайшем контексте; союз «но» естественно выражает смысловой контраст.
