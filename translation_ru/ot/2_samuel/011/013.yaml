translation_notes:
  register: Современный литературный русский, ясный и сдержанно-повествовательный. Имена повторены там, где цепочка еврейских местоимений могла бы вызвать неясность. Сохранён образ движения «спустился», а буквальное «перед ним» раскрыто естественным выражением в основном тексте.
