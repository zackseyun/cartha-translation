base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: ru
  text: 'Он написал в письме: «Поставьте Урию на передний край, где бой особенно ожесточён[a], а затем отойдите от него, чтобы его поразили и он погиб».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «туда, где бой наиболее ожесточён».'
    reason: Еврейское выражение буквально сочетает указание на расположение перед лицом/напротив боя с характеристикой боя как сильного, тяжёлого; его можно передать более кратко как место наиболее ожесточённого боя.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Он написал
  rationale: Последовательная повествовательная форма передаётся русским прошедшим временем; начальный союз в современном русском повествовании не требуется.
- source_word: בַּסֵּפֶר
  choice: в письме
  rationale: В контексте סֵפֶר обозначает письменное послание Давида Иоаву, а не книгу.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формула введения прямой речи естественно передаётся в русском языке двоеточием без отдельного слова «говоря».
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: Поставьте Урию
  rationale: Императив множественного числа означает назначение Урии на определённую боевую позицию; «поставьте» сохраняет приказной и военный оттенок.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: впереди, на самый опасный участок боя
  rationale: Идиоматическое сочетание указывает на передовую позицию в месте особенно тяжёлого, ожесточённого боя. Формулировка передаёт как непосредственную подверженность удару, так и интенсивность сражения.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: а затем отступите, оставив его без поддержки
  rationale: Буквально речь идёт об отходе тех, кто находится позади Урии. Естественная русская формулировка ясно передаёт задуманный тактический смысл — лишить его поддержки, не добавляя нового действия.
- source_word: וְנִכָּה
  choice: чтобы его поразили
  rationale: Страдательная форма глагола נכה означает, что Урия будет поражён в бою; отдельный глагол не объединяется с последующим указанием на смерть.
- source_word: וָמֵת
  choice: и он погиб
  rationale: Сохранён отдельный итоговый глагол, подчёркивающий намеренно смертельную цель приказа.
