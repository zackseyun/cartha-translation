base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: ru
  text: Под вечер[a] Давид встал с постели и ходил по крыше царского дома[b]. С крыши он увидел купающуюся женщину[c]; женщина была очень красива.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И было ко времени вечера».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дома царя»; по контексту возможно: «царского дворца».'
    reason: lexical_alternative
  - marker: c
    text: 'Или, при иной синтаксической связи: «увидел женщину, купавшуюся на крыше».'
    reason: ambiguity
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Под вечер
  rationale: Естественно передаёт временную рамку и продвижение повествования; буквальная древнееврейская вводная формула отмечена в сноске.
- source_word: וַיָּקָם
  choice: встал
  rationale: Прямой и естественный русский эквивалент глагола קום в данном контексте.
- source_word: מֵעַל מִשְׁכָּבוֹ
  choice: с постели
  rationale: מִשְׁכָּב обозначает место, где лежат; «постель» естественно звучит в современном русском повествовании и не уточняет вид ложа.
- source_word: וַיִּתְהַלֵּךְ
  choice: стал ходить
  rationale: Передаёт длительный или повторяющийся характер движения, возможный для формы хитпаэль, без добавочного оттенка праздной прогулки.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: по крыше царского дома
  rationale: Сохраняет конкретную древнееврейскую формулировку «дом царя»; контекстуальный вариант «дворец» указан в сноске.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: он увидел купающуюся женщину
  rationale: Причастная конструкция естественно передаёт продолжающееся действие רֹחֶצֶת и не уточняет способ омовения.
- source_word: מֵעַל הַגָּג
  choice: С крыши
  rationale: Наиболее естественно понимается как указание на место, откуда Давид увидел женщину; возможная синтаксическая неоднозначность сохранена в сноске.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: была очень красива
  rationale: Идиоматично передаёт буквальное «очень хороша видом» и сохраняет акцент на внешности без неестественного русского оборота.
theological_decisions:
- issue: К чему относится מֵעַל הַגָּג
  choice: 'к точке наблюдения Давида: «С крыши он увидел»'
  alternative: 'к месту, где купалась женщина: «женщина, купавшаяся на крыше»'
  rationale: Порядок слов и обычное прочтение контекста поддерживают точку наблюдения Давида, однако древнееврейская конструкция допускает иную синтаксическую связь, поэтому альтернатива вынесена в сноску и не устраняется молча.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная древнееврейская формула сглажена ради естественности, а её буквальный вид дан в сноске. Синтаксическая неоднозначность пространственного оборота не скрыта.
