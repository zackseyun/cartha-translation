base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: ru
  text: Лучники стреляли в твоих слуг со стены, и некоторые из слуг царя погибли; погиб и твой слуга Урия Хеттеянин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а твой слуга Урия Хеттеянин тоже мёртв».'
    reason: 'Лексическая альтернатива: еврейское מֵת может обозначать как наступившую смерть, так и состояние «мёртв».'
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: Стрелки стреляли
  rationale: Передаёт военное значение корня ירה и причастия הַמּוֹרִים естественным современным русским выражением.
- source_word: אֶל עֲבָדֶיךָ
  choice: в твоих слуг
  rationale: При глаголе «стрелять» предлог אֶל естественно передаётся как «в»; «слуги» сохраняет придворно-служебную лексику обращения к царю.
- source_word: מֵעַל הַחוֹמָה
  choice: со стены
  rationale: Кратко и естественно обозначает возвышенную позицию стрелков на городской стене.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: и некоторые из слуг царя погибли
  rationale: 'Предлог מִן имеет партитивное значение: погибли некоторые из царских слуг, а не все. «Погибли» уместно в военном повествовании.'
- source_word: וְגַם עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: погиб и твой слуга Урия-хеттеянин
  rationale: Конструкция с «и» сохраняет добавочный и кульминационный характер сообщения; этноним передан принятой русской формой.
- source_word: מֵת
  choice: погиб
  rationale: В повествовательном контексте естественно сообщает о наступившей смерти, тогда как форма также допускает статическое понимание «мёртв».
