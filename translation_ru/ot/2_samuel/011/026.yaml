  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: ru
  text: Когда жена Урии услышала, что её муж Урия умер[a], она оплакивала своего мужа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что её муж Урия мёртв».'
    reason: 'Лексическая альтернатива: מֵת может описывать как наступление смерти («умер»), так и состояние («мёртв»).'
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: услышала
  rationale: Обычное значение שׁמע в породе каль — «слышать, услышать». В повествовании «услышала» естественно передаёт получение вести, не усиливая значение до более толковательного «узнала».
- source_word: אֵשֶׁת אוּרִיָּה
  choice: жена Урии
  rationale: Русская родительная конструкция точно и естественно передаёт древнееврейское сопряжённое сочетание.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного, поэтому в русском здесь уместно «что».
- source_word: מֵת
  choice: умер
  rationale: Форма сообщает о смерти Урии; «умер» естественно звучит после «услышала, что» и передаёт завершившееся событие. Возможное статальное прочтение «мёртв» сохранено в сноске.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: её муж Урия
  rationale: Переданы и имя, и повторное обозначение супружеского отношения; такой порядок слов современен и понятен по-русски.
- source_word: וַתִּסְפֹּד
  choice: стала оплакивать
  rationale: ספד обозначает траурное оплакивание умершего. Сочетание «стала оплакивать» естественно передаёт последующее действие в повествовательной цепи и допускает продолжительность траура.
- source_word: עַל
  choice: оплакивать
  rationale: Значение предлога при глаголе траурного плача в русском естественно включается в управление переходного глагола «оплакивать» и не требует отдельного соответствия.
- source_word: בַּעְלָהּ
  choice: своего мужа
  rationale: В брачном контексте בַּעַל означает «муж». Возвратное притяжательное местоимение «своего» устраняет возможную двусмысленность и естественно для русского языка.
theological_decisions: []
