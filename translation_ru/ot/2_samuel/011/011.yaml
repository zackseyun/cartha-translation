  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: ru
  text: 'Урия ответил Давиду: «Ковчег, Израиль и Иуда находятся во временных укрытиях[a], а мой господин Иоав и слуги моего господина стоят лагерем в открытом поле. Неужели я пойду домой, чтобы есть, пить и лечь в постель с женой?[b] Жив ты и жива душа твоя: я не сделаю этого!»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в шалашах»; речь идёт о временных укрытиях в полевых условиях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И я пойду домой…?» Еврейская формулировка представляет собой риторический вопрос, выражающий отказ Урии.'
    reason: alternative_reading
  - marker: c
    text: 'Еврейская клятвенная формула буквально продолжается словами: «если я сделаю это»; после клятвы такое «если» выражает решительное отрицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: Ковчег
  rationale: В еврейском тексте стоит просто «ковчег» с определённым артиклем. Перевод не добавляет отсутствующих здесь уточнений «Божий» или «завета».
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: находятся во временных укрытиях
  rationale: Существительное סֻכּוֹת обозначает шалаши или временные полевые укрытия. Выбран естественный современный оборот, сохраняющий смысл временного размещения.
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Это почтительное обозначение человека, Иоава, а не божественное имя. «Мой господин» сохраняет социальный и уважительный оттенок.
- source_word: עַל פְּנֵי הַשָּׂדֶה חֹנִים
  choice: стоят лагерем в открытом поле
  rationale: Сочетание описывает продолжающееся военное расположение вне защищённого жилища; перевод передаёт и лагерь, и открытость местности.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: Неужели я пойду домой
  rationale: Форма будущего времени в контексте выражает возмущённый риторический вопрос, а не нейтральное сообщение о намерении.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: чтобы есть, пить и лечь с женой
  rationale: Сохранена последовательность трёх действий. «Лечь с женой» передаёт сдержанный сексуальный эвфемизм оригинала без разговорного огрубления.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: Жив ты и жива душа твоя
  rationale: Перевод сохраняет удвоенную древнееврейскую формулу клятвы и слово נֶפֶשׁ «душа», не сводя выражение к одному современному обороту.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: я не сделаю этого
  rationale: После клятвенной формулы частица אִם входит в эллиптическую формулу решительного отрицания. Явное отрицание необходимо по-русски, чтобы не создать ложного условного смысла.
