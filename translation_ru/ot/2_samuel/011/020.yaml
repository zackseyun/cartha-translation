base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: ru
  text: 'И если гнев царя разгорится и он скажет тебе: «Почему вы подошли так близко к городу, чтобы сражаться? Разве вы не знали, что со стены могут метать[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что со стены могут стрелять». Еврейский глагол может означать стрельбу или метание различных предметов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И если
  rationale: Передаёт связь с предшествующим повествованием и вводит предполагаемое условие без тяжеловесного буквального оборота.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: гнев царя разгорится
  rationale: Сохраняет образ усиливающегося гнева и естественно звучит в современном русском повествовании.
- source_word: וְאָמַר לְךָ
  choice: и он скажет тебе
  rationale: Будущее время естественно передаёт действие внутри предполагаемой ситуации.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: вы подошли так близко к городу
  rationale: Глагол означает приближение; «так близко» передаёт упрёк за опасное сближение со стеной, очевидный из контекста.
- source_word: לְהִלָּחֵם
  choice: чтобы сражаться
  rationale: Инфинитив выражает цель приближения; выбран обычный современный военный оборот.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Разве вы не знали
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: אֲשֶׁר יֹרוּ
  choice: что ... в вас будут стрелять
  rationale: Глагол ירה в военном контексте может обозначать стрельбу или метание снарядов. «Стрелять» естественно по-русски; объект «в вас» ясно подразумевается ситуацией и необходим для плавности выражения.
- source_word: מֵעַל הַחוֹמָה
  choice: со стены
  rationale: Идиоматично передаёт исходную точку действия; буквальное «сверху стены» по-русски избыточно.
