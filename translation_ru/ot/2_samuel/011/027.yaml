base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: ru
  text: Когда миновало время плача, Давид послал за ней и взял её к себе в дом. Она стала его женой и родила ему сына. Но то, что сделал Давид, было злом в глазах Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «было неугодно Яхве». Буквально по-еврейски: «было злом в глазах Яхве»; этот оборот выражает Божью нравственную оценку поступка Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵבֶל
  choice: время плача
  rationale: Слово обозначает скорбь и связанный с ней период оплакивания после смерти Урии. «Время плача» передаёт как переживание, так и временной смысл контекста.
- source_word: וַיַּעֲבֹר
  choice: миновало
  rationale: Буквально глагол означает «прошло»; с временным периодом естественное русское соответствие — «миновало».
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: Давид послал за ней и взял её к себе в дом
  rationale: Сохраняется последовательность двух еврейских глаголов. «Взял её к себе в дом» естественно передаёт принятие Вирсавии в дом Давида, не превращая это выражение само по себе в прямое обозначение брака.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: Она стала его женой
  rationale: Конструкция указывает на изменение положения женщины и естественно передаётся по-русски как «стала его женой».
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: родила ему сына
  rationale: Точное и идиоматичное соответствие еврейской конструкции с косвенным дополнением.
- source_word: וַיֵּרַע
  choice: было злом
  rationale: Форма выражает отрицательную нравственную оценку, а не только неудовольствие; перевод сохраняет силу осуждения.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: то, что сделал Давид
  rationale: Естественное русское выражение, точно передающее здесь значение דָּבָר как дела или поступка.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный еврейский оборот, обозначающий Божью оценку поступка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Сила нравственной оценки поступка Давида
  choice: «было злом в глазах Яхве»
  alternative: «было неугодно Яхве»
  rationale: Основной перевод сохраняет прямую нравственную характеристику еврейского וַיֵּרַע и не ослабляет осуждение до субъективного неудовольствия.
- issue: Передача имени יהוה
  choice: «Яхве»
  alternative: «Господь»
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте; замена титулом скрыла бы это различие.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Краткие последовательные предложения сохраняют ход еврейского рассказа; заключительное «но» подчёркивает противопоставление между внешним устройством жизни Давида и Божьей оценкой его поступка.
