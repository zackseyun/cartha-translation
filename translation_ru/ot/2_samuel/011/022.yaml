  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: ru
  text: Посланец отправился в путь, пришёл и передал Давиду всё, что велел ему сообщить Иоав.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. буквально: «всё, что послал его Иоав»; по смыслу — всё, что Иоав поручил ему сообщить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: посланец
  rationale: В данном контексте מַלְאָךְ обозначает человека, доставляющего военное донесение; «посланец» естественно передаёт эту роль и исключает сверхъестественный смысл слова «ангел».
- source_word: וַיֵּלֶךְ
  choice: отправился в путь
  rationale: Форма продолжает повествовательную последовательность и указывает на отбытие посланца. Такой перевод естественнее по-русски, чем буквальное «пошёл», перед последующим «пришёл».
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычное значение בוא — «приходить, прибывать»; «пришёл» сохраняет лаконичность и последовательность еврейского рассказа.
- source_word: וַיַּגֵּד לְדָוִד
  choice: передал Давиду
  rationale: В породе хифиль נגד означает «сообщить, рассказать, известить». В контексте донесения «передал» звучит естественно и не добавляет официальности, которой нет в тексте.
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Передаёт полноту содержания сообщения, выраженную כָּל, в естественной русской конструкции.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: что велел ему сообщить Иоав
  rationale: 'Буквально: «что послал его Иоав» или «что Иоав послал его [передать]». Контекстуальное дополнение «сообщить» раскрывает подразумеваемую цель посылки, не меняя смысла.'
- source_word: לְדָוִד
  choice: Давиду
  rationale: Имя передано в принятой русской библейской форме и поставлено в дательный падеж согласно синтаксису.
