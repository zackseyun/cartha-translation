base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: ru
  text: 'Тогда Давид сказал Урии: «Останься здесь и сегодня, а завтра я отпущу тебя». И Урия остался в Иерусалиме в тот день и на следующий день.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вав с последовательной глагольной формой продвигает повествование; «тогда» естественно передаёт смену событий.
- source_word: שֵׁב בָּזֶה
  choice: Останься здесь
  rationale: В данном контексте ישׁב означает временно оставаться в месте, а בָּזֶה указывает на текущее место.
- source_word: גַּם הַיּוֹם
  choice: ещё на сегодня
  rationale: 'Передаёт добавочное значение גַּם: Давид велит Урии остаться и этот день; формулировка естественна для современного русского языка.'
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: а завтра я отпущу тебя
  rationale: שׁלח здесь означает позволить или велеть Урии отправиться дальше; «отпущу» сохраняет роль Давида и не уточняет направление сверх текста.
- source_word: וַיֵּשֶׁב
  choice: И ... оставался
  rationale: Повтор корня ישׁב передан однокоренным с повелением глаголом и обозначает пребывание Урии в городе в указанный период.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: в тот день и на следующий
  rationale: מִמָּחֳרָת обозначает следующий день; перевод ясно и естественно передаёт обе временные отметки.
