  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: ru
  text: И послал Давид посланников, и взял её. Она пришла к нему, и он лёг с нею. Она же очищалась от своей нечистоты.[a] Затем она вернулась домой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она очистилась от своей нечистоты». Древнееврейскую конструкцию можно понимать как фоновое замечание об обрядовом очищении, возможно после менструальной нечистоты.'
    reason: Альтернативное временное прочтение причастной конструкции; уточнение о менструальной нечистоте сформулировано как вероятный контекст, а не как прямо названный факт.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Простой повествовательный глагол точно передаёт שלח и сохраняет лаконичность древнееврейского рассказа.
- source_word: מַלְאָכִים
  choice: посланников
  rationale: В данном контексте слово обозначает людей, посланных с поручением; «посланники» не уточняет их официальный статус сверх сказанного в тексте.
- source_word: וַיִּקָּחֶהָ
  choice: взял её
  rationale: Буквально передаёт לקח и сохраняет резкую, нравственно весомую краткость повествования, не заменяя её пояснительным «велел привести».
- source_word: וַתָּבֹוא אֵלָיו
  choice: она пришла к нему
  rationale: Прямо передаёт глагол движения с предлогом, не добавляя к нему эвфемистического или причинного смысла.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: он лёг с нею
  rationale: Сохраняет обычный библейский оборот, обозначающий половую связь, и поддерживает достойный литературный регистр.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: она же очищалась от своей нечистоты
  rationale: Возвратная форма причастия здесь относится к обрядовому очищению, а не к нравственному освящению. «Нечистота» сохраняет культовую категорию טֻמְאָה, а конструкция с прошедшим несовершенным видом передаёт фоновый характер замечания.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: затем она вернулась домой
  rationale: Естественно передаёт продолжение повествовательной последовательности; «домой» в современном русском здесь точнее по употреблению, чем тяжеловесное «в свой дом».
theological_decisions:
- issue: Временное значение и функция замечания об обрядовом очищении
  choice: 'Передать причастную конструкцию как фоновое действие: «Она же очищалась от своей нечистоты».'
  alternative: «Она очистилась от своей нечистоты» или «она уже очистилась от своей нечистоты».
  rationale: Древнееврейское причастие естественно допускает понимание продолжающегося или фонового действия, однако контекст позволяет видеть здесь и указание на завершившееся очищение после менструальной нечистоты. Основной текст сохраняет форму исходника, а сноска отмечает временную неоднозначность. Замечание связано с обрядовой чистотой и вероятным временем зачатия, но само по себе не выносит нравственной оценки участникам.
- issue: Степень принуждения и вина участников
  choice: Сохранить краткое «взял её» и не добавлять прямого утверждения ни о согласии, ни о сопротивлении Вирсавии.
  alternative: «Велел привести её», «забрал её» или формулировка, прямо называющая действие насилием.
  rationale: Повествование подчёркивает инициативу и власть Давида, но данный стих не описывает реакцию Вирсавии достаточно подробно, чтобы перевод разрешал вопрос о согласии дополнительными словами.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного, последовательного ритма древнееврейского повествования. Оборот «лёг с нею» намеренно оставлен в библейском литературном регистре; терминология об очищении передаёт обрядовый, а не нравственный смысл.
