  language: ru
  text: Иоав послал Давиду весть и сообщил ему обо всём, что касалось сражения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обо всех обстоятельствах сражения». Буквально: «все слова сражения» — древнееврейское выражение, обозначающее подробности или донесение о сражении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал весть
  rationale: Глагол буквально означает «послал», но в сочетании с последующим «сообщил» контекст указывает на отправку донесения; «послал весть» естественно передаёт это по-русски.
- source_word: יוֹאָב
  choice: Иоав
  rationale: Традиционная русская передача личного имени.
- source_word: וַיַּגֵּד לְדָוִד
  choice: сообщил Давиду
  rationale: Порода хифиль глагола נגד означает «сообщать, рассказывать, докладывать»; «сообщил» соответствует повествовательному и военному контексту.
- source_word: אֶת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: обо всём, что произошло в сражении
  rationale: Буквально «все слова/дела сражения»; здесь это идиома, обозначающая все обстоятельства или подробности боя. Выбранная формулировка ясна и естественна, не сводя значение только к произнесённым словам.
- source_word: הַמִּלְחָמָה
  choice: сражение
  rationale: Хотя слово может обозначать войну вообще, ближайший контекст говорит о конкретном боевом столкновении.
