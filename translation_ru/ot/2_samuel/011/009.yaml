base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: ru
  text: Но Урия спал[a] у входа в царский дворец[b] вместе со всеми слугами своего господина[c] и не спустился к себе домой[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лёг»; «провёл ночь». Еврейский глагол может обозначать как лежание, так и сон; здесь речь о том, что Урия остался там на ночь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у входа в царский дом». Буквально: «у входа в дом царя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «своего хозяина». Здесь имеется в виду Давид, которому подчинялся Урия.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «не пошёл к себе домой». Буквально: «не спустился к своему дому».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: лёг спать
  rationale: Глагол שׁכב может означать «лечь» или «спать». В данном повествовательном контексте выражение «лёг спать» естественно передаёт и действие, и то, что Урия остался там на ночь.
- source_word: פֶּתַח
  choice: у входа
  rationale: Слово обозначает вход, проём или дверной проход; «у входа» сохраняет пространственный смысл, не подразумевая непременно дверную створку.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Буквально — «дом царя». Выражение «царский дом» близко к форме оригинала и в контексте обозначает царскую резиденцию.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: вместе со всеми слугами своего господина
  rationale: Конструкция выражает совместное пребывание. «Слуги» уместно передаёт עבדים в придворном контексте, а «господин» сохраняет социальную иерархию.
- source_word: אֲדֹנָיו
  choice: своего господина
  rationale: Слово означает «его господин/хозяин» и здесь относится к Давиду как к тому, кому подчинён Урия.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: и не спустился к себе домой
  rationale: Глагол ירד буквально означает «спуститься». Формулировка сохраняет направление движения и при этом звучит естественно по-русски.
