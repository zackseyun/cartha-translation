base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: ru
  text: 'Тогда Давид сказал Урии: «Спустись к себе домой и вымой ноги».[a] Затем Урия вышел из дома царя, и вслед за ним последовал дар от царя.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вымыть ноги» буквально описывает обычное омовение после дороги, но здесь может также подразумевать отдых дома после пути.
    reason: cultural_note
  - marker: b
    text: 'Или: «долю от царя». Еврейское слово может обозначать то, что несут или посылают, в том числе долю, угощение или дар.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: Спустись
  rationale: Императив глагола ירד буквально передаёт движение вниз; этот оттенок уместен при уходе от царя к дому Урии и естественно звучит по-русски.
- source_word: לְבֵיתְךָ
  choice: к себе домой
  rationale: Буквально — «к твоему дому». Русское «к себе домой» естественно передаёт обращённое к Урии указание вернуться в собственный дом.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: и омой ноги
  rationale: Сохранён конкретный образ еврейского выражения «вымой ноги», не сводимый в основном тексте к более общему «освежись».
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: из царского дома
  rationale: Передаёт буквальное «из дома царя», не заменяя его контекстуально возможным, но более узким словом «дворец».
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: дар от царя
  rationale: מַשְׂאֵת может обозначать несомое или посылаемое подношение, долю либо подарок. «Дар от царя» естественно подходит контексту и сохраняет некоторую широту значения.
- source_word: אַחֲרָיו
  choice: следом за ним
  rationale: Естественно передаёт движение вслед за Урией.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского: безличное «отправили» передаёт еврейскую конструкцию, в которой дар образно «вышел следом» за Урией. Маркеры сносок поставлены при выражениях, к которым относятся примечания.'
