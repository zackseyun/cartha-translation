revisions:
- from: 'Тогда Давид сказал Урии: «Спустись к себе домой и омой ноги».[a] Урия вышел из царского дома, и следом за ним отправили дар от царя.[b]'
  to: 'Тогда Давид сказал Урии: «Спустись к себе домой и вымой ноги».[a] Затем Урия вышел из дома царя, и вслед за ним последовал дар от царя.[b]'
  rationale: 'Исправление сохраняет прямой образ и грамматическую организацию еврейского текста: вслед за Урией следует царское подношение, а не неопределённые лица «отправляют» его. Лексика слегка выровнена в сторону современного литературного русского; сноска уточнена, чтобы не сужать возможный подтекст.'
