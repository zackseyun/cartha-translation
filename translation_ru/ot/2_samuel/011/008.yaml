  - severity: low
    issue: Формулировка сноски «устройство на ночлег дома»
    rationale: Оригинальная фраза буквально означает омовение ног и в контексте может подразумевать домашний отдых после пути. Упоминание именно ночлега является более узкой конкретизацией, чем требуется текстом.
