  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: ru
  text: 'Вестник сказал Давиду: «Люди одолели нас и вышли против нас в поле, но мы теснили их[a] до самого входа в ворота».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мы были на них»; в военном контексте этот оборот, вероятно, означает, что войско Давида перешло в наступление и теснило противника к воротам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: вестник
  rationale: В данном военном повествовании речь идёт о человеке, доставившем донесение, а не об ангеле; «вестник» точно и лаконично передаёт значение.
- source_word: כִּי
  choice: не выражено отдельным словом
  rationale: Союз вводит содержание донесения; в естественной русской прямой речи его функция передаётся самим построением цитаты.
- source_word: גָבְרוּ עָלֵינוּ
  choice: одолели нас
  rationale: Сочетание גבר с עַל означает оказаться сильнее и взять верх над кем-либо. «Одолели нас» естественно передаёт результат этого превосходства, не добавляя окончательного поражения.
- source_word: הָאֲנָשִׁים
  choice: эти люди
  rationale: Еврейский текст буквально говорит «люди»; указательное «эти» естественно отсылает к противнику в контексте донесения, не заменяя слово более узким «воины».
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: вышли против нас в поле
  rationale: Оборот описывает выход защитников города навстречу войску для боя; «против нас» сохраняет враждебную направленность, а «в поле» — пространственное указание.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: мы теснили их
  rationale: Буквально «мы были на них/против них»; в военном контексте и перед указанием предела движения оборот естественно означает наступательный напор, оттеснение противника.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: до самого входа в ворота
  rationale: Передаёт и пространственный предел עַד, и различие между «входом/проёмом» и городскими воротами; частица «самого» естественно подчёркивает достигнутый предел.
