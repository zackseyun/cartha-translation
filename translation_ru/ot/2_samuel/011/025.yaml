source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: ru
  text: 'Тогда Давид сказал посланцу: «Так скажи Иоаву: „Пусть это дело не кажется тебе дурным[a], ведь меч пожирает то одного, то другого[b]. Усиль натиск на город и разрушь его“. И ободри его[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть это дело не будет злым в твоих глазах»; возможный смысл: «Пусть это дело тебя не огорчает».'
    reason: lexical_alternative
  - marker: b
    text: Буквально древнееврейское выражение звучит как «меч пожирает так и так» и означает, что на войне он поражает то одного, то другого.
    reason: idiom
  - marker: c
    text: 'Или: «И укрепи его». Вероятнее всего, речь об Иоаве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: посланцу
  rationale: В данном повествовательном контексте речь идёт о человеке, доставившем известие, а не об ангеле; «посланец» точно передаёт функцию и сохраняет достоинство стиля.
- source_word: כֹּה תֹאמַר
  choice: Так скажи
  rationale: Естественная русская передача формулы, вводящей речь, которую надлежит передать другому лицу.
- source_word: אַל יֵרַע בְּעֵינֶיךָ אֶת הַדָּבָר הַזֶּה
  choice: Пусть это дело не кажется тебе дурным
  rationale: Передаёт смысл древнееврейского оборота «не будет злым в твоих глазах», сохраняя его оценочную, отчасти нравственную окраску и оставаясь естественным по-русски.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: ведь меч пожирает то одного, то другого
  rationale: «Пожирает» сохраняет яркую метафору глагола אכל, а «то одного, то другого» естественно передаёт идиоматическое כָזֹה וְכָזֶה и мысль о непредсказуемости военных потерь.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: Усиль натиск на город
  rationale: Буквально речь идёт об усилении военных действий против города; «усиль натиск» ясно и естественно выражает смысл в контексте осады.
- source_word: וְהָרְסָהּ
  choice: и разрушь его
  rationale: Глагол означает разрушить или снести; местоимение согласовано с русским словом «город».
- source_word: וְחַזְּקֵהוּ
  choice: И ободри его
  rationale: Форма буквально означает «укрепи его» и, вероятнее всего, относится к Иоаву; в межличностном контексте «ободри» естественно передаёт требуемое действие.
theological_decisions:
- issue: Нравственная окраска слов Давида о гибели Урии
  choice: Сохранено выражение «не кажется тебе дурным» без смягчения до одного лишь «не огорчайся».
  alternative: «Пусть это тебя не огорчает»
  rationale: Древнееврейский оборот допускает значение неудовольствия, но буквально использует слово «злой/дурной». Сохранение оценочной окраски не позволяет переводу заранее снимать нравственное напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Формула «Так скажи» и метафора «меч пожирает» сохраняют библейскую выразительность, тогда как «усиль натиск» избегает неестественного буквального оборота «усиль свою войну». Вложенная прямая речь оформлена русскими кавычками первого и второго уровней.
