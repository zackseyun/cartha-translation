  source_fidelity: Перевод точно передаёт синтаксис и смысл древнееврейского текста. «Посланец» уместно обозначает человеческого вестника; «Пусть это дело не кажется тебе дурным» сохраняет оценочный оборот «не зло в твоих глазах»; «меч пожирает то одного, то другого» удачно воспроизводит образ и идиому. «Усиль натиск на город и разрушь его» ясно передаёт повеления усилить военные действия против города и разрушить его. Заключительное «И ободри его» обоснованно относится к Иоаву и, как в оригинале, остаётся указанием Давида посланцу после передаваемой речи.
