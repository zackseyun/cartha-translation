base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/005.yaml
  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: ru
  text: 'Женщина забеременела и послала сказать Давиду: «Я беременна».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: забеременела
  rationale: Глагол הרה обозначает наступление беременности; «забеременела» естественно передаёт событийное значение формы, не смешивая его с последующим обозначением состояния.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Существительное אִשָּׁה может означать «женщина» или «жена». Здесь непосредственная формулировка называет Вирсавию женщиной, не подчёркивая в этом предложении её брачный статус.
- source_word: וַתִּשְׁלַח וַתַּגֵּד לְדָוִד
  choice: послала сказать Давиду
  rationale: Буквально здесь стоят последовательные глаголы «послала» и «сообщила». Русское сочетание «послала сказать» ясно передаёт подразумеваемую отправку вести и избегает неестественного буквального повтора.
- source_word: הָרָה אָנֹכִי
  choice: Я беременна
  rationale: Предикативное הָרָה с местоимением אָנֹכִי выражает настоящее состояние; это точная и естественная современная русская формулировка.
- source_word: דָוִד
  choice: Давид
  rationale: Устоявшаяся русская форма библейского имени.
