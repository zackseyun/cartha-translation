  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: ru
  text: 'И Давид послал разузнать о женщине. И ему сказали: «Разве это не Вирсавия, дочь Елиама, жена Урии-хеттеянина?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: разузнать об этой женщине
  rationale: Глагол דרש здесь означает наведение справок; «разузнать» естественно передаёт целенаправленный расспрос, а указательное «этой» соответствует определённому артиклю при אשה в данном контексте.
- source_word: בַּת שֶׁבַע
  choice: Вирсавия
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: הַחִתִּי
  choice: хеттеянин
  rationale: Современное и узнаваемое русское обозначение этнической принадлежности Урии.
theological_decisions:
- issue: Неуказанный говорящий в וַיֹּאמֶר
  choice: Ему сказали
  alternative: И он сказал
  rationale: Форма глагола буквально стоит в мужском роде единственного числа, но субъект не назван и по контексту наиболее естественно понимать ответ неназванного посланника или осведомителя. Безлично-личная русская конструкция сохраняет неопределённость и не приписывает слова Давиду.
- issue: Риторический вопрос הֲלוֹא
  choice: Разве это не…?
  alternative: Не это ли…?
  rationale: Передаёт узнавание и утвердительный оттенок вопроса, не устраняя его вопросительной формы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис разделён на два предложения для естественности; родственные и брачные связи сохранены буквально, поскольку они существенно обозначают личность женщины и нравственное напряжение эпизода.
