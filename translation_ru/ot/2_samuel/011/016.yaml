  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: ru
  text: Когда Иоав наблюдал за городом, он поставил Урию на то место, где, как он знал, находились сильные воины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доблестные воины»; также возможно: «грозные бойцы». Еврейское выражение אַנְשֵׁי חַיִל здесь обозначает способных и сильных воинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר יוֹאָב אֶל־הָעִיר
  choice: Когда Иоав наблюдал за городом
  rationale: Предлог בְּ при инфинитиве образует временную конструкцию; в условиях осады שׁמר означает наблюдение за городом. Русское «наблюдал за городом» естественно передаёт этот смысл, не усиливая его до «осаждал».
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: он поставил Урию
  rationale: Буквальное значение נתן — «дал, поместил»; здесь речь о намеренном размещении воина на боевой позиции. «Поставил» сохраняет простоту оригинала и ясно звучит в военном контексте.
- source_word: הַמָּקוֹם
  choice: на то место
  rationale: Определённая форма существительного מָקוֹם передана указательным сочетанием «то место», естественным перед последующим придаточным «где…».
- source_word: יָדַע
  choice: как он знал
  rationale: Сохранено обычное значение глагола «знать»; вставная конструкция позволяет естественно передать порядок и смысл еврейской фразы.
- source_word: אַנְשֵׁי חַיִל
  choice: сильные воины
  rationale: В данном боевом контексте выражение обозначает способных, сильных или грозных бойцов противника. «Сильные воины» понятно современному читателю и не создаёт впечатления, будто речь идёт о специальном отряде Давида.
- source_word: שָׁם
  choice: находились
  rationale: Местное наречие «там» естественно включено в русскую конструкцию «где… находились», без избыточного повторения «там».
