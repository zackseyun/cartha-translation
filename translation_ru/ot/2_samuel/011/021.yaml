  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: ru
  text: '«Кто сразил Авимелеха, сына Иеруббешета[a]? Разве не женщина бросила на него со стены верхний жернов[b], и он умер в Тевеце[c]? Зачем вы подошли к стене?» Тогда скажи: «Твой слуга Урия-хеттеянин тоже умер».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Иеруббешет»; ср. Судей 9:1, где стоит имя «Иеруббаал».
    reason: alternative_reading
  - marker: b
    text: 'Или: «обломок жернова»; еврейское выражение, вероятно, обозначает верхний жернов.'
    reason: lexical_alternative
  - marker: c
    text: См. рассказ об этом событии в Судей 9:53.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: сразил
  rationale: Глагол означает «ударить, поразить» и в данном контексте подразумевает смертельный исход. «Сразил» сохраняет образ удара и звучит естественно в военном повествовании.
- source_word: אֲבִימֶלֶךְ בֶּן־יְרֻבֶּשֶׁת
  choice: Авимелех, сын Иеруббешета
  rationale: Перевод следует масоретскому тексту, где стоит форма «Иеруббешет», не заменяя её более знакомой по Судей 9 формой «Иеруббаал».
- source_word: הֲלוֹא
  choice: разве не
  rationale: Отрицательный вопрос предполагает утвердительный ответ; русское «разве не» естественно передаёт его риторическую силу.
- source_word: פֶּלַח רֶכֶב
  choice: верхний жернов
  rationale: Сочетание может буквально обозначать часть или обломок жернова, но, вероятнее всего, речь идёт о верхнем камне ручной мельницы. Неопределённость отмечена в сноске.
- source_word: מֵעַל הַחוֹמָה
  choice: со стены
  rationale: Предлог указывает на движение сверху; «со стены» кратко и естественно передаёт положение женщины на городской стене.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: и он умер в Тевеце
  rationale: Сохраняется последовательное повествовательное соединение исходного текста без чрезмерного уточнения причинной связи.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל־הַחוֹמָה
  choice: Зачем вы подошли к стене?
  rationale: «Подошли» прямо передаёт значение глагола «приблизиться»; «зачем» естественно выражает упрёк в данном контексте.
- source_word: וְאָמַרְתָּ
  choice: Тогда скажи
  rationale: Форма обращена к одному посланнику и содержит указание, что ему ответить после предполагаемого упрёка.
- source_word: גַּם עַבְדְּךָ אוּרִיָּה הַחִתִּי מֵת
  choice: И твой слуга Урия-хеттеянин погиб
  rationale: Начальное «и» передаёт добавочное значение גַּם, «слуга» соответствует придворной речи, а «погиб» естественно обозначает смерть в бою.
