  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: ru
  text: Когда Урия пришёл к нему, Давид спросил о благополучии Иоава, о благополучии войска[a] и о ходе войны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «народа»; здесь имеются в виду воины, находившиеся с Иоавом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «о благополучии войны». В еврейском тексте одно и то же слово «благополучие» повторено во всех трёх частях вопроса.'
    reason: source_idiom
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא здесь обозначает прибытие Урии к Давиду; «пришёл» естественно передаёт повествовательный контекст.
- source_word: אֵלָיו
  choice: к нему
  rationale: Предлог אֶל с местоименным суффиксом указывает на движение к Давиду; местоимение сохраняет связность исходного повествования.
- source_word: וַיִּשְׁאַל
  choice: спросил
  rationale: שׁאל вводит расспрос Давида о положении на фронте; нейтральное «спросил» точно и естественно в современном русском языке.
- source_word: לִשְׁלוֹם
  choice: о благополучии / о ходе
  rationale: В первых двух случаях שָׁלוֹם означает состояние или благополучие Иоава и войска. Применительно к войне буквальное «благополучие войны» по-русски неестественно, поэтому смысл передан как «о ходе войны», а повтор исходного выражения отмечен в сноске.
- source_word: יוֹאָב
  choice: Иоав
  rationale: Имя передано в принятой русской библейской форме.
- source_word: הָעָם
  choice: войско
  rationale: Буквальное значение — «народ», но в данном военном контексте речь идёт о людях, находящихся с Иоавом в походе, то есть о войске.
- source_word: הַמִּלְחָמָה
  choice: война
  rationale: מִלְחָמָה может обозначать войну, сражение или военные действия; здесь контекст широкой осады поддерживает вариант «война».
