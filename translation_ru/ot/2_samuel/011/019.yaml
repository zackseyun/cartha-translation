lexical_decisions:
- source_word: וַיְצַו
  choice: И он велел
  rationale: Глагол צוה выражает распоряжение или повеление. «Велел» сохраняет властный оттенок и естественно звучит в русском повествовании.
- source_word: הַמַּלְאָךְ
  choice: посланнику
  rationale: В данном военном контексте מַלְאָךְ обозначает человека, доставляющего донесение, а не ангела.
- source_word: לֵאמֹר
  choice: введено двоеточием
  rationale: Стандартная древнееврейская формула введения прямой речи естественно передаётся в современном русском пунктуационно, без буквального «говоря».
- source_word: כְּכַלּוֹתְךָ
  choice: Когда ты закончишь
  rationale: Конструкция с כ и инфинитивом образует временное придаточное; перевод не добавляет значения немедленности.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: обо всём, что произошло в сражении
  rationale: Буквально — «все слова/дела сражения»; в контексте донесения речь идёт о полном изложении событий боя. Формулировка естественна по-русски и сохраняет полноту כָּל.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: рассказывать царю
  rationale: Инфинитив «говорить» с адресатом здесь обозначает передачу царю полного военного донесения; «рассказывать царю» естественно передаёт эту функцию.
