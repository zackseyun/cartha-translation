source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: ru
  text: На рубеже года[a], в то время, когда посланники отправляются в путь[b], Давид послал Иоава, а с ним — своих слуг и весь Израиль. Они опустошили владения аммонитян и осадили Равву, Давид же оставался в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при возвращении (или повороте) года»; вероятно, имеется в виду весенняя пора военных походов.'
    reason: cultural_note
  - marker: b
    text: 'По другому чтению: «когда цари выступают в поход». Оно соответствует параллельному месту в 1 Пар. 20:1 и хорошо подходит военному контексту; однако в предоставленном еврейском тексте здесь стоит «посланники».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: на рубеже года
  rationale: Выражение буквально говорит о «возвращении/повороте года». Русское «на рубеже года» сохраняет образ смены годового цикла, не превращая вероятное указание на весенний сезон военных походов в часть основного текста.
- source_word: לְעֵת צֵאת הַמַּלְאֿכִים
  choice: в то время, когда посланники отправляются в путь
  rationale: Предоставленный текст WLC содержит слово מַלְאָכִים с алефом — «посланники». Поэтому в основном тексте сохранено засвидетельствованное чтение, а контекстуально убедительный вариант «цари выступают в поход», известный также по параллельному месту, вынесен в примечание.
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычный и естественный перевод глагола שלח в повествовательном контексте.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: Слово обозначает людей на царской службе и не обязательно только военачальников или чиновников; «слуги» сохраняет широту исходного понятия.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное выражение оригинала; в данном военном контексте оно относится к израильскому войску или ополчению, но исходный текст не уточняется без необходимости.
- source_word: וַיַּשְׁחִתוּ אֶת בְּנֵי עַמּוֹן
  choice: опустошили владения аммонитян
  rationale: Форма от שׁחת выражает разрушительное действие. Такой перевод передаёт разорение в ходе военной кампании, не создавая впечатления полного истребления народа; слово «владения» эксплицирует естественный объект опустошения в русском языке.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: осадили Равву
  rationale: Глагол צור с предлогом על обозначает осаду города; краткая конструкция естественна по-русски.
- source_word: יוֹשֵׁב
  choice: оставался
  rationale: Причастие буквально означает «сидел/пребывал», но здесь подчёркивает, что Давид не выступил вместе с войском, а остался в Иерусалиме.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Устоявшаяся русская форма названия города.
theological_decisions:
- issue: Чтение לְעֵת צֵאת הַמַּלְאֿכִים и создаваемый им контраст с поведением Давида
  choice: когда посланники отправляются в путь
  alternative: когда цари выступают в поход
  rationale: В предоставленном еврейском тексте WLC стоит «посланники», и подмена этого чтения в основном тексте скрыла бы реальную текстовую трудность. Вариант «цари» хорошо согласуется с военным контекстом и 1 Пар. 20:1 и усиливает повествовательную иронию — Давид не делает того, что обычно делают цари, — однако его следует обозначить как альтернативное чтение, а не молча вводить в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис ясен для широкого читателя; союз «же» передаёт подчёркнутый контраст между действиями войска и тем, что Давид остался в Иерусалиме. Текстовое расхождение не сглажено, а открыто отражено в примечании.
