review_pass:
  verdict: revise
  source_fidelity: 'Основной текст верно следует предоставленной еврейской форме מַלְאכִים («посланники»), а не выбранному в английской POB версии «цари». Однако «владения аммонитян» добавляет в исходный текст объект «владения/земли»: еврейское בְּנֵי עַמּוֹן обозначает аммонитян как народ.'
  naturalness: Перевод в целом современный и литературный. Конструкция «а с ним — своих слуг» слегка затрудняет синтаксическую связь; «своих слуг вместе с ним» яснее. Точку с запятой перед заключительным противопоставлением делает русскую фразу более плавной.
  terminology: «Аммонитяне», «Равва», «Иерусалим» переданы устойчиво. «Разорили аммонитян» сохраняет объект исходного текста и естественно передаёт разрушительное действие в военном контексте, не утверждая полного уничтожения. Примечание b должно осторожнее называть вариант «цари» альтернативным чтением, а не создавать впечатление, что это непосредственно написано в предоставленной форме текста.
  issues:
  - severity: medium
    issue: Добавленный объект в выражении «опустошили владения аммонитян»
    rationale: В еврейском тексте прямой объект — «сыновья Аммона», то есть аммонитяне, а не их владения. Добавление «владения» сужает и изменяет объект действия.
  - severity: low
    issue: Не вполне ясная связь в «а с ним — своих слуг»
    rationale: Русское «с ним» можно мгновенно соотнести с Давидом, хотя по синтаксису оригинала слуги отправлены вместе с Иоавом. Более прямой порядок слов устраняет эту шероховатость.
  - severity: low
    issue: Категоричная формулировка примечания b о чтении «цари»
    rationale: При предоставленной форме с алефом основной текст должен оставаться «посланники». Вариант «цари» следует представить как возможное альтернативное чтение, поддерживаемое военным контекстом и параллельным рассказом, не подменяя им форму источника.
  revised_text: На рубеже года[a], в то время, когда посланники отправляются в путь[b], Давид послал Иоава, своих слуг вместе с ним и весь Израиль. Они разорили аммонитян и осадили Равву; Давид же оставался в Иерусалиме.
  revised_footnotes:
