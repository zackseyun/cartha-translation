  source_fidelity: 'Текст точно передаёт оба употребления וַיִּשְׁלַח: сначала — распоряжение Давида, переданное Иоаву, затем — исполнение Иоавом распоряжения. Добавленное «сказать» естественно раскрывает подразумеваемый способ передачи приказа и соответствует английскому audit trail «sent word»; нового участника или смыслового обстоятельства не вводит. «Ко мне» и «к Давиду» верно передают направление אֶל.'
