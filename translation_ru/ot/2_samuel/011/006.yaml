  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: ru
  text: 'И послал Давид к Иоаву сказать: «Пришли ко мне Урию-хеттеянина». И Иоав послал Урию к Давиду.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: И послал Давид к Иоаву сказать
  rationale: Глагол שׁלח означает «посылать». Поскольку адресат назван, а далее непосредственно следует повеление, добавление «сказать» естественно передаёт подразумеваемое сообщение, не вводя отдельного посланника, которого еврейский текст не называет.
- source_word: שְׁלַח אֵלַי
  choice: Пришли ко мне
  rationale: Императив שְׁלַח передан прямым повелением «пришли»; אֵלַי означает «ко мне». Глагол «пришли» в русском естественно употребляется, когда велят направить человека к говорящему.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: Урию-хеттеянина
  rationale: Имя אוּרִיָּה передано в принятой русской библейской форме «Урия», а этноним הַחִתִּי — традиционным и понятным обозначением «хеттеянин». Частица прямого дополнения אֶת отдельно не переводится.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: И Иоав послал Урию к Давиду
  rationale: Повтор глагола שׁלח сохранён, как и последовательная повествовательная связь посредством начального «И».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Инверсия «послал Давид» поддерживает повествовательный ритм, оставаясь понятной. Кавычки и пунктуация оформлены по современным русским нормам.
