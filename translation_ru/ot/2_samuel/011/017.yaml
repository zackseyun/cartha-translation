base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: ru
  text: Мужчины города вышли и вступили в бой с Иоавом. Некоторые из слуг Давида пали[a]; погиб и Урия-хеттеянин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пали из народа, из слуг Давида»; двойной оборот означает, что пала часть людей, служивших Давиду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ אַנְשֵׁי הָעִיר
  choice: Жители города вышли
  rationale: יצא означает «выходить»; русское «вышли» естественно передаёт движение защитников из города, не навязывая точку отсчёта глаголами «пришли» или «ушли». В данном военном контексте אַנְשֵׁי הָעִיר обозначает мужчин-защитников, но «жители города» звучит по-русски естественно, а контекст ясно указывает на участников боя.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: вступили в бой с Иоавом
  rationale: Идиома обозначает враждебное военное столкновение. Выражение «вступили в бой с» естественно для современного русского языка и не предполагает, будто Иоав сражался на их стороне.
- source_word: וַיִּפֹּל
  choice: пали
  rationale: Сохранена древнееврейская военная идиома со значением гибели в бою; в русском «пали» уместно и не требует добавлять не выраженное прямо указание на способ смерти.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: Некоторые из слуг Давида
  rationale: 'Двойная конструкция с מן имеет партитивный смысл: погибла часть людей, принадлежавших к числу служивших Давиду. Сжатая русская формулировка передаёт этот смысл без тяжеловесного буквального повтора; точная форма оригинала отмечена в сноске.'
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: погиб и Урия-хеттеянин
  rationale: Частица גַּם передана присоединительным «и», подчёркивающим, что Урия также оказался среди погибших. «Погиб» в военном контексте естественнее общего «умер», а этническое обозначение сохранено.
