base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: ru
  text: Утром Давид написал письмо Иоаву и отправил его с Урией.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «рукой Урии»; то есть через Урию, который доставил письмо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Утром
  rationale: Последовательная повествовательная форма וַיְהִי вводит очередное событие, а בַבֹּקֶר обозначает время. В современном русском естественное «Утром» передаёт и временной переход, и ход повествования без тяжеловесного «И было».
- source_word: וַיִּכְתֹּב
  choice: написал
  rationale: Прямой и обычный русский эквивалент глагола письма в повествовательном контексте.
- source_word: סֵפֶר
  choice: письмо
  rationale: Слово может обозначать письменный документ вообще, но адресование Иоаву и последующая передача через посланца указывают здесь на письмо.
- source_word: אֶל יוֹאָב
  choice: Иоаву
  rationale: Русский дательный падеж естественно обозначает адресата и передаёт значение предлога אֶל в этом контексте.
- source_word: וַיִּשְׁלַח
  choice: отправил его
  rationale: Глагол означает «послал, отправил»; местоимение «его» естественно уточняет, что было отправлено письмо.
- source_word: בְּיַד אוּרִיָּה
  choice: с Урией
  rationale: Буквально «рукой Урии» — идиома передачи или доставки. Русское «с Урией» ясно передаёт, что письмо нёс сам Урия, и сохраняет мрачную иронию повествования без неестественной кальки.
