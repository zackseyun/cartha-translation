base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: ru
  text: 'Давиду сообщили: «Урия не спустился к себе домой[a]». Тогда Давид сказал Урии: «Разве ты не пришёл с дороги[b]? Почему ты не спустился к себе домой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не спустился к своему дому». Здесь «спуститься» может отражать путь с возвышенности или из дворцового района к своему жилищу.'
    reason: cultural_note
  - marker: b
    text: 'Или: «из путешествия». Буквально: «с дороги» или «с пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 'Давиду сообщили:'
  rationale: Форма множественного числа передаёт неопределённых сообщающих, а двоеточие естественно вводит прямую речь, выполняя функцию לֵאמֹר.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Урия не спустился к себе домой
  rationale: «Спустился» сохраняет буквальное значение ירד и повтор ключевого глагола; «к себе домой» естественно передаёт אֶל־בֵּיתוֹ в современном русском языке.
- source_word: וַיֹּאמֶר דָּוִד אֶל אוּרִיָּה
  choice: Тогда Давид сказал Урии
  rationale: «Тогда» естественно обозначает последовательность повествования, выраженную формой с וַ־.
- source_word: הֲלוֹא
  choice: Разве… не
  rationale: Эта русская вопросительная конструкция передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: מִדֶּרֶךְ
  choice: с дороги
  rationale: Выражение сохраняет образ דֶּרֶךְ («дорога, путь») и по-русски естественно означает прибытие после поездки или похода.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: Почему ты не спустился к себе домой?
  rationale: Сохранены вопрос о причине, буквальный глагол «спустился» и повтор формулировки первой реплики.
