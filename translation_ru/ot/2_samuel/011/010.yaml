  terminology: 'Имена «Давид» и «Урия», включая дательный «Урии», переданы нормативно. Повтор «спустился к себе домой» уместно сохраняет повтор исходного текста. Примечание a нуждается в уточнении: אֶל означает направление «к», а не «в».'
