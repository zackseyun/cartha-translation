base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: ru
  text: Авессалом поставил Амессая во главе войска вместо Иоава. Амессай был сыном человека по имени Иефер, израильтянина[a], который вошёл к Авигее, дочери Нааса, сестре Саруии, матери Иоава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Иефер, израильтянин». В 1 Пар 2:17: «Иефер, измаильтянин».'
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: поставил ... во главе войска
  rationale: Естественно передаёт назначение на должность и власть над войском.
- source_word: תַּחַת יוֹאָב
  choice: вместо Иоава
  rationale: В данном контексте תַּחַת обозначает замену прежнего военачальника.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: сыном человека по имени Иефер
  rationale: Сохраняет неопределённое אִישׁ и естественно соединяет его с последующим указанием имени.
- source_word: הַיִּשְׂרְאֵלִי
  choice: израильтянина
  rationale: Следует масоретскому тексту WLC; разночтение в 1 Пар 2:17 отмечено в сноске.
- source_word: אֲשֶׁר בָּא אֶל
  choice: который вошёл к
  rationale: Сохраняет древнееврейский эвфемизм половой близости, не делая перевод излишне эксплицитным.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: Авигее, дочери Нааса
  rationale: Прямо и естественно передаёт родственную конструкцию.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: сестре Саруии, матери Иоава
  rationale: Сохраняет цепочку приложений и однозначно указывает, что матерью Иоава была Саруия.
