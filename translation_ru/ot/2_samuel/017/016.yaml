base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: ru
  text: 'А теперь скорее пошлите весть Давиду и скажите ему: «Не ночуй сегодня на равнинах пустыни[a], но непременно переправься, иначе царь и весь народ, который с ним, будут поглощены».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у переправ в пустыне». Еврейское выражение обычно обозначает пустынные равнины или низменности, однако упоминание немедленной переправы позволяет понимать его как место у переправы через Иордан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет переход к срочному следующему действию и естественно звучит в русском повествовании.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: скорее пошлите весть
  rationale: Передаёт повеление и срочность; добавление «весть» естественно восполняет подразумеваемый объект глагола «пошлите».
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: Давиду и скажите ему
  rationale: Передаёт формулу сообщения без тяжеловесного буквального «говоря».
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Не ночуй сегодня
  rationale: Глагол לון означает оставаться или располагаться на ночлег; выбран естественный современный русский эквивалент.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: на равнинах пустыни
  rationale: Основное значение עֲרָבוֹת — пустынные равнины или низменности. Контекст переправы допускает иное географическое понимание, отмеченное в сноске.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: но непременно переправься
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает повеление; «непременно» ясно передаёт эту эмфазу.
- source_word: פֶּן
  choice: иначе
  rationale: Естественно вводит предупреждение о возможном последствии.
- source_word: יְבֻלַּע
  choice: будут поглощены
  rationale: Сохраняет яркий пассивный образ глагола בלע, который в военном контексте подразумевает гибель или полное уничтожение.
- source_word: לַמֶּלֶךְ
  choice: царь
  rationale: Сохраняет употреблённый в еврейском тексте титул Давида.
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: и весь народ, который с ним
  rationale: Не сужает עָם до войска и близко передаёт относительное придаточное.
