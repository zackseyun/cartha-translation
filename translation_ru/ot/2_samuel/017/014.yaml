base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: ru
  text: 'Тогда Авессалом и все мужи Израиля сказали: «Совет Хусия Архитянина лучше совета Ахитофела». Ибо Яхве повелел сорвать хороший совет Ахитофела[a], чтобы Яхве навёл на Авессалома бедствие[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «определил сорвать». Еврейский глагол обычно означает «повелел», но в данном контексте может описывать действенное решение Яхве относительно совета Ахитофела.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «зло», «несчастье» или «погибель»; здесь имеется в виду бедствие, которое должно постигнуть Авессалома.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказали
  rationale: Последовательная форма продвигает повествование; сказуемое перед двумя однородными субъектами стоит в единственном числе в еврейском, но по-русски естественно множественное число.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: и все израильтяне
  rationale: Буквально «и всякий/весь муж Израиля»; выражение имеет собирательное значение, естественно передаваемое современным русским словом «израильтяне».
- source_word: טוֹבָה ... מֵעֲצַת
  choice: лучше совета
  rationale: Прилагательное с מִן выражает сравнение; русский язык требует сравнительной степени.
- source_word: עֲצַת
  choice: совет
  rationale: Слово обозначает как данную рекомендацию, так и стратегический замысел; «совет» сохраняет обе стороны значения и повтор исходного слова.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Хусия архитянина
  rationale: Передаёт имя и этноним/обозначение происхождения в принятой русской библейской форме.
- source_word: צִוָּה
  choice: определил
  rationale: Обычное значение — «повелел», однако здесь глагол описывает действенное решение Яхве расстроить совет; «определил» естественно в данном контексте и не привносит узкой догматической системы.
- source_word: לְהָפֵר
  choice: расстроить
  rationale: Порода hифиль от פרר означает сделать недействительным, сорвать; «расстроить совет» точно и идиоматично по-русски.
- source_word: הַטּוֹבָה
  choice: хороший
  rationale: Сохраняет прямую авторскую оценку совета Ахитофела как хорошего, не уточняя её как моральную или исключительно стратегическую.
- source_word: לְבַעֲבוּר
  choice: чтобы
  rationale: Ясно передаёт целевое или результативное отношение между Божьим решением и грядущим бедствием.
- source_word: הָרָעָה
  choice: бедствие
  rationale: В контексте речь идёт о пагубе, постигшей Авессалома, а не о нравственном зле; примечание сохраняет более широкий диапазон еврейского слова.
theological_decisions:
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное заветное имя, непосредственно стоящее в еврейском тексте.
- issue: Божественное действие в צִוָּה לְהָפֵר
  choice: Яхве определил расстроить
  alternative: Яхве повелел расстроить
  rationale: Передаётся действенная воля Бога в отношении совета Ахитофела; примечание сохраняет обычное лексическое значение «повелел», не устраняя неоднозначности.
- issue: Значение הָרָעָה применительно к действию Бога
  choice: бедствие
  alternative: зло; несчастье; погибель
  rationale: Контекст указывает на судебное бедствие для Авессалома. Выбор не приписывает Богу нравственное зло, но примечание сохраняет широту исходного термина.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; сохранены повтор слова «совет», оценка «хороший» и явная причинно-целевая связь. Все маркеры примечаний присутствуют в основном тексте.
