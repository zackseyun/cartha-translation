  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: ru
  text: Если же он укроется в каком-нибудь городе, весь Израиль принесёт к тому городу верёвки, и мы стащим его[a] к руслу потока[b], пока там не найдётся даже камешка[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стащим Давида». Еврейское местоимение мужского рода может относиться к Давиду, хотя образ верёвок и последующее упоминание камешка, вероятнее всего, подразумевают город.'
    reason: referential_ambiguity
  - marker: b
    text: Евр. на́халь — поток, овраг или русло сезонного водотока.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пока там не найдётся даже камешка»; это гиперболический образ полного уничтожения.'
    reason: literary_clarification
lexical_decisions:
- source_word: יֵאָסֵף
  choice: укроется
  rationale: Нифаль глагола אסף в данном военном контексте означает, что Давид отступит и найдёт убежище в городе. «Укроется» естественно передаёт смысл, не вводя отсутствующего в тексте указания на укреплённость города.
- source_word: וְהִשִּׂיאוּ
  choice: принесёт
  rationale: В сочетании с חֲבָלִים форма передаёт доставку или перенос верёвок к городу; «принесёт» ясно и естественно выражает конкретное действие.
- source_word: חֲבָלִים
  choice: верёвки
  rationale: Речь идёт о верёвках, которыми в гиперболическом образе собираются стащить город; это наиболее ясный современный эквивалент.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: мы стащим его
  rationale: 'סחב означает тащить или волочить. Русское местоимение мужского рода сохраняет референциальную неоднозначность еврейского суффикса: оно может указывать на Давида, но по развитию образа обычно относится к городу; в русском «город» также мужского рода.'
- source_word: הַנַּחַל
  choice: русло потока
  rationale: נחל обозначает поток, овраг или русло сезонного водотока. «Русло потока» понятно современному читателю и передаёт географический образ точнее, чем заимствованное «вади».
- source_word: גַּם צְרוֹר
  choice: даже камешка
  rationale: 'צְרוֹר здесь означает небольшой камень. Уменьшительная форма сохраняет гиперболу: от разрушенного города не останется ничего, вплоть до малого камня.'
theological_decisions:
- issue: К кому относится местоименный суффикс в אֹתוֹ
  choice: Сохранена возможность отнести «его» как к городу, так и к Давиду, при том что образ преимущественно предполагает город.
  alternative: Однозначно перевести «стащим город» или «стащим Давида».
  rationale: Еврейский текст употребляет местоимение мужского рода после существительного «город» женского рода. Контекст последующей фразы поддерживает отнесение к городу, однако грамматическая форма допускает связь с Давидом; перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным синтаксисом. Сохранён гиперболический военный образ; архаизмы и узкоспециальное «вади» не используются. Формула «в каком-нибудь городе» передаёт неопределённость אֶל עִיר.
