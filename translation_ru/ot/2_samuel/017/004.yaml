base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/004.yaml
  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: ru
  text: Этот совет понравился Авессалому и всем старейшинам Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Этот совет был хорош в глазах Авессалома и в глазах всех старейшин Израиля».'
    reason: Сохраняет исходный образ и повтор еврейского выражения בְּעֵינֵי, а также более буквально передаёт смысл וַיִּישַׁר.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: понравился
  rationale: 'В сочетании с בְּעֵינֵי глагол передаёт одобрение: нечто сочли хорошим, правильным или приемлемым. «Понравился» естественно выражает этот смысл в современном русском языке, не приписывая совету объективной нравственной правоты.'
- source_word: הַדָּבָר
  choice: этот совет
  rationale: Буквально — «слово», «дело» или «то, о чём идёт речь»; в данном контексте имеется в виду только что высказанный совет Ахитофела. Указательное «этот» ясно связывает фразу с предшествующей речью.
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: Авессалому и всем старейшинам
  rationale: Еврейская идиома буквально означает «в глазах… и в глазах…». В основном тексте она передана естественной русской конструкцией с дательным падежом, а повтор и исходный образ отражены в сноске.
- source_word: אַבְשָׁלֹם
  choice: Авессалом
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: всем старейшинам Израиля
  rationale: זִקְנֵי обозначает признанных старейшин и руководителей народа, а כָּל сохраняется словом «всем».
theological_decisions:
- issue: Означает ли וַיִּישַׁר объективную правоту совета или субъективное одобрение
  choice: 'Передать как субъективное одобрение: «понравился»'
  alternative: «был правильным»
  rationale: Конструкция с «в глазах» описывает оценку Авессалома и старейшин, а не утверждает от лица повествователя нравственную правильность совета.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и повествовательно естественная. «Старейшины» сохраняет библейский общественно-политический термин, а сноска показывает буквальную еврейскую идиому и её смысловой оттенок.
