  source_fidelity: 'В целом смысл передан верно: выход из колодца, донесение Давиду, срочное повеление перейти воду и враждебный совет Ахитофела сохранены. Однако «сообщили обо всём» добавляет к וַיַּגִּדוּ («сообщили/рассказали») не выраженное в оригинале обобщение.'
