revisions:
- from: 'Когда те ушли, они выбрались из колодца, пошли и сообщили обо всём царю Давиду. Они сказали Давиду: «Вставайте и скорее переправляйтесь через воду, потому что вот какой совет дал против вас Ахитофел».'
  to: 'После того как они ушли, те выбрались из колодца, пошли и сообщили царю Давиду. Они сказали Давиду: «Вставайте и скорее переправляйтесь через воду, ибо Ахитофел дал против вас такой совет».'
  rationale: Убрано невыраженное «обо всём» и сглажен порядок слов в заключительной фразе без изменения смысла. «Те» оставлено во второй части первого предложения, чтобы сохранить различение с ранее ушедшими людьми при отсутствии их имени в самом стихе. Неопределённое «воду» и множественное число повелений сохранены.
