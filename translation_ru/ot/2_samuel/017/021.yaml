base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: ru
  text: 'После того как они ушли, те выбрались из колодца, пошли и сообщили царю Давиду. Они сказали Давиду: «Вставайте и скорее переправляйтесь через воду, ибо Ахитофел дал против вас такой совет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: Когда те ушли
  rationale: Естественно передаёт временную конструкцию «после того, как они ушли»; местоимение относится к удалившимся преследователям из предыдущего контекста.
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: они выбрались из колодца
  rationale: Глагол буквально означает «поднялись»; в данном контексте русское «выбрались» естественно описывает выход из укрытия в колодце.
- source_word: וַיַּגִּדוּ
  choice: сообщили обо всём
  rationale: Передаёт сообщение сведений; «обо всём» естественно по-русски обозначает содержание донесения, раскрытое далее прямой речью.
- source_word: קוּמוּ
  choice: Вставайте
  rationale: Форма множественного числа обращена к Давиду и сопровождающим его людям; русский перевод сохраняет это число.
- source_word: וְעִבְרוּ מְהֵרָה אֶת הַמַּיִם
  choice: и скорее переправляйтесь через воду
  rationale: «Переправляйтесь» ясно передаёт пересечение водной преграды; «воду» сохраняет обобщённое обозначение еврейского текста, не уточняя Иордан в основном тексте.
- source_word: כִּי כָכָה יָעַץ עֲלֵיכֶם אֲחִיתֹפֶל
  choice: потому что вот какой совет дал против вас Ахитофел
  rationale: Сохраняет указательное «вот какой» и враждебную направленность выражения עֲלֵיכֶם, не конкретизируя не изложенное здесь содержание совета.
