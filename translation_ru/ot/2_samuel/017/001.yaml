base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: ru
  text: 'Тогда Ахитофел сказал Авессалому: «Позволь мне выбрать двенадцать тысяч человек; я выступлю в погоню за Давидом этой ночью»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «Прошу, я выберу двенадцать тысяч человек, выступлю и буду преследовать Давида этой ночью».'
    reason: Сохраняется возможное более формальное прочтение последовательности когортативов как заявления-предложения, тогда как основной текст естественно передаёт просьбу о разрешении.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: אֲחִיתֹפֶל
  choice: Ахитофел
  rationale: Имя передано в соответствии с устоявшейся русской библейской традицией.
- source_word: אֶל־אַבְשָׁלֹם
  choice: Авессалому
  rationale: Русский дательный падеж естественно передаёт адресата речи; имя дано в традиционной русской форме.
- source_word: אֶבְחֲרָה נָּא
  choice: Позволь мне выбрать
  rationale: Когортатив с נָא выражает вежливую просьбу или предложение; эта формулировка естественно передаёт значение, не превращая слова Ахитофела в простой приказ.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: двенадцать тысяч человек
  rationale: Передаёт буквальное значение אִישׁ и не уточняет без необходимости, что речь именно о воинах, хотя контекст военный.
- source_word: וְאָקוּמָה
  choice: и я встану
  rationale: Сохраняет образ глагола קוּם («встать, подняться») и его когортативную направленность на решительное действие.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: и погонюсь за Давидом
  rationale: Русское «погнаться за» точно и естественно передаёт военное преследование, выраженное сочетанием רדף אַחֲרֵי.
- source_word: הַלָּיְלָה
  choice: сегодня ночью
  rationale: В контексте слово с артиклем обозначает наступившую или предстоящую ночь; «сегодня ночью» ясно и современно передаёт этот смысл.
