  to: 'Тогда Ахитофел сказал Авессалому: «Позволь мне выбрать двенадцать тысяч человек; я выступлю в погоню за Давидом этой ночью»[a].'
  rationale: 'Правка делает русский текст более естественным и литературно нейтральным, сохраняя все смысловые компоненты еврейского текста: просьбу-предложение, число людей, начало действий, преследование Давида и временное указание на текущую ночь. Сноска сохраняет отмеченную в английском аудите более формальную альтернативу, без догматического или интерпретационного уточнения.'
