  source_fidelity: 'Основной смысл передан верно: Ахитофел обращается к Авессалому с вежливым предложением выбрать двенадцать тысяч человек, выступить и преследовать Давида в эту ночь. Однако «встану» в современном русском слишком буквально и неестественно для военного выступления; в данном контексте קוּם естественно передать как «выступить».'
  naturalness: «Погонюсь за Давидом» разговорно и несколько сниженно для литературного библейского повествования. Сочетание «выступить в погоню за Давидом» естественно, ясно и сохраняет последовательность действий. Знак сноски следует поставить перед завершающей точкой русского предложения.
  terminology: Традиционные русские библейские формы «Ахитофел», «Авессалом» и «Давид» уместны. «Человек» сохраняет неуточнённое אִישׁ и не навязывает более узкое «воины».
