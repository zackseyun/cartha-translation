base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: ru
  text: 'И сказал Хусай: «Ты знаешь своего отца и его людей: они — могучие воины и свирепы[a], словно медведица в поле, лишившаяся медвежат. Твой отец — воин; он не станет ночевать вместе с войском[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ожесточены», «озлоблены»; буквально: «горьки душой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не станет ночевать с народом». В данном контексте под «народом», вероятно, подразумеваются воины Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: могучие воины
  rationale: Передаёт силу и воинскую доблесть, подразумеваемые словом в данном военном контексте.
- source_word: מָרֵי נֶפֶשׁ
  choice: ожесточены
  rationale: Естественно по-русски выражает состояние озлобленности и опасной свирепости; буквальный образ «горьки душой» сохранён в примечании.
- source_word: כְּדֹב שַׁכּוּל
  choice: словно медведица… лишившаяся медвежат
  rationale: Передаёт образ самки медведя, потерявшей потомство, и связанную с ним крайнюю опасность.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямой пространственный эквивалент, не сужающий значение до конкретного типа местности.
- source_word: אִישׁ מִלְחָמָה
  choice: опытный воин
  rationale: Естественное русское обозначение человека, искушённого в войне; слово «опытный» раскрывает контекстуальную силу еврейской идиомы.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: он не станет ночевать вместе с войском
  rationale: Сохраняет значение ночлега и контекстуально понимает עָם как сопровождающую Давида боевую силу, не скрывая буквальной альтернативы в примечании.
- source_word: יָדַעְתָּ
  choice: ты знаешь
  rationale: Прямое и естественное обращение к Авессалому.
- source_word: אֲנָשָׁיו
  choice: его людей
  rationale: Сохраняет широкое значение исходного слова, тогда как военный контекст поясняет их роль.
