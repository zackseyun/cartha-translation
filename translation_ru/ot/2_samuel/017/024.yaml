  text: Давид пришёл в Маханаим, и Авессалом перешёл Иордан — он и все израильтяне с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: пришёл
  rationale: Форма qal перфекта от בוא обозначает прибытие к названному месту; «пришёл» естественно передаёт повествовательное движение.
- source_word: מַחֲנָיְמָה
  choice: в Маханаим
  rationale: Направительный суффикс -ה указывает на движение к месту; при глаголе «пришёл» это естественно выражается предлогом «в».
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: перешёл Иордан
  rationale: Глагол עבר с прямым дополнением обозначает пересечение реки; «перешёл Иордан» — ясная и литературная русская формулировка.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение сохранено в пояснительной конструкции «он и…», не усиливая его до «он сам» без достаточных оснований.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Буквально коллективная конструкция означает «всякий/каждый муж Израиля». В данном контексте речь идёт о сопровождавших Авессалома израильтянах; выбранная формулировка естественна по-русски и не подразумевает буквально всё население.
- source_word: עִמּוֹ
  choice: бывшие с ним
  rationale: Предлог с местоименным суффиксом выражает сопровождение. Причастный оборот ясно связывает слова «с ним» с израильтянами.
- source_word: וְ
  choice: а
  rationale: Между параллельными действиями Давида и Авессалома русский противительно-сопоставительный союз «а» естественно передаёт связь, выраженную еврейским waw, не превращая её в резкое противопоставление.
