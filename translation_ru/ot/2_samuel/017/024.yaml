translation_notes:
  register: Современный литературный повествовательный стиль. Топоним передан традиционной русской формой «Маханаим», имя אַבְשָׁלוֹם — традиционной формой «Авессалом». Тире делает приложенную конструкцию «он и…» понятной и сохраняет явное местоимение оригинала.
