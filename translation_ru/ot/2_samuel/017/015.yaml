base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: ru
  text: 'Тогда Хусай сказал священникам Садоку и Авиафару: «Вот что[a] посоветовал Ахитофел Авессалому и старейшинам Израиля, а вот что посоветовал я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так и так» — еврейское выражение, которым передают содержание сказанного, не повторяя его слово в слово.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: חוּשַׁי
  choice: Хусай
  rationale: Имя передано современной русской транслитерацией с опорой на еврейскую форму.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: священникам Садоку и Авиафару
  rationale: Так по-русски ясно и естественно показано, что определение «священники» относится к обоим названным лицам.
- source_word: כָּזֹאת וְכָזֹאת
  choice: вот что
  rationale: Еврейское устойчивое выражение дословно означает «так и так» и передаёт содержание сказанного без дословного повторения. «Вот что» естественно выполняет эту функцию в данном контексте, где далее подразумевается пересказ советов.
- source_word: יָעַץ
  choice: посоветовал
  rationale: Глагол обозначает данную в политико-военном контексте рекомендацию; «посоветовал» сохраняет смысл и звучит естественно в современном русском повествовании.
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: Авессалому и старейшинам Израиля
  rationale: Русское управление глагола «посоветовал» требует дательного падежа; оба адресата совета переданы явно.
- source_word: יָעַצְתִּי אָנִי
  choice: посоветовал я
  rationale: 'Постпозиция местоимения «я» сохраняет выраженное самостоятельным еврейским местоимением противопоставительное ударение: в отличие от совета Ахитофела — совет Хусая.'
