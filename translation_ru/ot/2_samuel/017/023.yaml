base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: ru
  text: Когда Ахитофел увидел, что его совету не последовали[a], он оседлал осла, встал и отправился к себе домой, в свой город. Он отдал распоряжения своим домашним[b], затем удавился[c] и умер. Его похоронили в гробнице его отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что его совет не исполнили». Буквально: «его совет не был сделан».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «распорядился о своём доме»; возможно также: «привёл дела своего дома в порядок». Буквально сказано, что он дал распоряжения своему дому или домашним.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «повесился». Глагол может обозначать смерть от удушения или повешения; в данном контексте речь идёт о самоубийстве Ахитофела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: его совету
  rationale: עֵצָה обозначает совет, замысел или план; в политико-военном контексте «совет» сохраняет как рекомендательный, так и стратегический оттенок.
- source_word: לֹא נֶעֶשְׂתָה עֲצָתוֹ
  choice: его совету не последовали
  rationale: Буквально сказано, что совет «не был сделан»; по смыслу речь о том, что его не исполнили. Русская конструкция естественна и сохраняет пассивную неопределённость относительно действующих лиц.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: он оседлал осла
  rationale: חבש применительно к ослу означает оседлать или подготовить его к поездке. Определённый артикль не выражает принадлежности, поэтому «своего осла» не добавлено.
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычный древнееврейский глагол последовательного повествования; «встал» близко к форме и естественно по-русски.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: к себе домой, в свой город
  rationale: 'Переданы оба элемента: дом как непосредственное место назначения и город, где он находился; формулировка избегает неестественного «к своему дому в своём городе».'
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: отдал распоряжения своим домашним
  rationale: Глагол צוה с אֶל допускает смысл распоряжений, обращённых к дому как домашним. Это ближе к явной форме текста, чем интерпретирующее «привёл свои дела в порядок».
- source_word: וַיֵּחָנַק
  choice: удавился
  rationale: Форма в данном контексте описывает самоубийство, но сам глагол может относиться к удушению или повешению. «Удавился» кратко передаёт рефлексивный смысл, не устраняя лексическую широту без примечания.
- source_word: בְּקֶבֶר אָבִיו
  choice: в гробнице его отца
  rationale: קֶבֶר может обозначать могилу или гробницу; «гробница» уместна для семейного места погребения и сохраняет прямую ссылку на отца.
