  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: ru
  text: 'мёд, творог[a], овец[b] и сыр из коровьего молока[c]. Всё это они принесли Давиду и людям, которые были с ним, чтобы поесть, ибо они сказали: «В пустыне народ голоден, устал и хочет пить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «масло»; еврейское слово может обозначать разные молочные продукты, но здесь, вероятно, имеется в виду творог или другой продукт из свернувшегося молока.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мелкий скот»; еврейское слово может собирательно обозначать овец и коз.'
    reason: lexical_alternative
  - marker: c
    text: Буквально выражение указывает на молочный продукт из крупного рогатого скота; точный вид этого продукта неясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: мёд
  rationale: Обычное значение слова — мёд; возможное более широкое значение «сладкий сироп» здесь менее вероятно.
- source_word: חֶמְאָה
  choice: творог
  rationale: В библейском контексте слово обозначает густой или свернувшийся молочный продукт, а не обязательно современное сливочное масло.
- source_word: צֹאן
  choice: овец
  rationale: Краткий и естественный перевод в перечне припасов; при этом еврейское собирательное существительное может охватывать также коз.
- source_word: שְׁפוֹת בָּקָר
  choice: коровий сыр
  rationale: Редкое выражение указывает на молочный продукт из крупного рогатого скота; перевод сохраняет конкретность, не уточняя способ изготовления.
- source_word: הִגִּישׁוּ
  choice: принесли
  rationale: В данном повествовательном контексте естественно передаёт действие снабжения Давида и его людей припасами.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: Давиду и людям, которые были с ним
  rationale: Сохраняет обоих получателей и относительное придаточное исходного текста.
- source_word: לֶאֱכֹל
  choice: чтобы те могли поесть
  rationale: Передаёт значение цели и устраняет возможную для русского текста двусмысленность относительно того, кто должен есть.
- source_word: כִּי אָמְרוּ
  choice: потому что говорили
  rationale: Союз вводит причину принесения припасов; неопределённый субъект множественного числа сохранён без лишнего уточнения.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: голоден, устал и хочет пить
  rationale: Естественно по-русски передаёт три однородных состояния без усиления их степени.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В данном контексте обозначает безлюдную, малонаселённую местность; «пустыня» является ясным и традиционным русским соответствием.
