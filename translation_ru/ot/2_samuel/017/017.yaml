base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: ru
  text: Ионафан и Ахимаас находились у источника Эн-Рогель[a], а служанка[b] ходила и сообщала им, а они шли и сообщали царю Давиду, потому что не могли быть замечены, входя в город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стояли у источника Эн-Рогель». Еврейское причастие буквально означает «стояли», но в данном контексте, вероятно, указывает на то, что они находились там или были поставлены там.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово שִׁפְחָה обозначает служанку или рабыню.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: находились
  rationale: Причастие буквально означает «стоящие», но при указании места в данном повествовательном контексте обозначает продолжительное пребывание или расположение на посту. «Находились» естественно передаёт этот смысл по-русски.
- source_word: בְּעֵין רֹגֵל
  choice: у источника Эн-Рогель
  rationale: עֵין — «источник», а רֹגֵל входит в состав географического названия. Такое выражение помогает русскому читателю понять характер места, сохраняя транслитерацию собственного имени.
- source_word: הַשִּׁפְחָה
  choice: служанка
  rationale: Существительное обозначает женщину-служанку или рабыню. «Служанка» ясно передаёт её роль, не усиливая без необходимости акцент на правовом статусе.
- source_word: וְהָלְכָה ... וְהֵם יֵלְכוּ
  choice: приходила ... они шли
  rationale: Цепочка форм описывает установленный порядок передачи сведений, а не обязательно одно единичное действие. Русское несовершенное прошедшее естественно выражает повторяемую или предусмотренную последовательность.
- source_word: וְהִגִּידָה לָהֶם ... וְהִגִּידוּ
  choice: передавала им вести ... сообщали всё
  rationale: Hiphil глагола נגד означает «сообщать, рассказывать, передавать сведения». В контексте тайной связи выбраны естественные русские соответствия без добавления содержания самих вестей.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: царю Давиду
  rationale: Обычная русская форма сочетания титула и личного имени в дательном падеже.
- source_word: כִּי לֹא יוּכְלוּ לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: потому что не могли входить в город на виду у людей
  rationale: Оборот буквально говорит, что их не могли видеть входящими в город. Выбранная формулировка естественно выражает опасность обнаружения при входе, сохраняя причинную связь.
