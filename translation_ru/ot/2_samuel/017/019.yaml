  text: וַ/תִּקַּ֣ח הָ/אִשָּׁ֗ה וַ/תִּפְרֹ֤שׂ אֶת הַ/מָּסָךְ֙ עַל פְּנֵ֣י הַ/בְּאֵ֔ר וַ/תִּשְׁטַ֥ח עָלָ֖י/ו הָֽ/רִפ֑וֹת וְ/לֹ֥א נוֹדַ֖ע דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: ru
  text: Тогда женщина взяла покрывало, расстелила его над отверстием колодца и рассыпала сверху толчёное зерно[a], и ничего не стало известно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздробленное зерно»; редкое еврейское слово обозначает толчёное или дроблёное зерно либо приготовленный из него продукт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не было известно ничего».'
    reason: literal_rendering
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: אִשָּׁה может означать «женщина» или «жена»; здесь речь идёт о женщине из дома, и нейтральное «женщина» не вносит лишнего уточнения.
- source_word: הַמָּסָךְ
  choice: покрывало
  rationale: מָסָךְ обозначает покрытие, завесу или полог. «Покрывало» естественно передаёт предмет, которым можно скрыть отверстие колодца, не уточняя материал.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: над отверстием колодца
  rationale: Буквально выражение означает «над поверхностью/лицом колодца»; в данном контексте имеется в виду его открытая верхняя часть.
- source_word: וַתִּשְׁטַח
  choice: рассыпала сверху
  rationale: Глагол שׁטח означает «расстилать, раскладывать, распределять по поверхности». С зерном «рассыпала» звучит естественно и передаёт действие, скрывающее покрывало.
- source_word: הָרִפוֹת
  choice: толчёное зерно
  rationale: Редкое слово רִפוֹת обозначает раздробленное или истолчённое зерно либо продукт из него; этот вариант понятен современному читателю и сохраняет предметную деталь.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: и ничего не стало известно
  rationale: Формулировка сохраняет отрицательную пассивную конструкцию «не было узнано/не стало известно ничего», не превращая её явно в цель действия или результат обнаружения.
