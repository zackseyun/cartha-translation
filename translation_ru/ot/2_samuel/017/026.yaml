lexical_decisions:
- source_word: וַיִּחַן
  choice: расположились станом
  rationale: Глагол חנה обозначает устройство лагеря. Множественное число естественно согласует сказуемое с составным подлежащим «Израиль и Авессалом», тогда как единственное число в еврейском отражает обычное согласование с собирательным субъектом.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Название употреблено собирательно, обозначая израильтян, выступивших с Авессалом; сохранение национального имени передаёт формулировку и политический смысл оригинала.
- source_word: וְאַבְשָׁלֹם
  choice: и Авессалом
  rationale: Союз соединяет Авессалома с Израилем как составным субъектом; имя передано в принятой русской библейской форме.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: в земле Галаадской
  rationale: Сочетание אֶרֶץ с географическим названием означает землю или область; традиционная русская форма естественна, ясна и сохраняет географическое обозначение.
