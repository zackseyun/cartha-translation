base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: ru
  text: 'Слуги Авессалома пришли к женщине в дом и спросили: «Где Ахимаас и Ионафан?» Женщина ответила им: «Они перешли через ручей[a]». Слуги искали их, но не нашли и вернулись в Иерусалим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через поток» или «через водный канал». Древнееврейское выражение необычно, и точный вид водотока неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: слуги Авессалома
  rationale: עֶבֶד может обозначать раба, слугу или состоящего на службе человека. Здесь речь идёт о людях, выполняющих поручение Авессалома, поэтому нейтральное «слуги» наиболее уместно.
- source_word: אֶל הָאִשָּׁה הַבַּיְתָה
  choice: пришли к женщине в дом
  rationale: אֶל указывает на движение к женщине, а направительное окончание в הַבַּיְתָה — к дому или внутрь дома. Русская формулировка естественно передаёт оба элемента, не делая семейное положение женщины частью смысла.
- source_word: אַיֵּה
  choice: Где
  rationale: Местный вопрос перед двумя именами естественно передаётся по-русски словом «где».
- source_word: עָבְרוּ
  choice: перешли через
  rationale: עבר обычно означает переход или движение через нечто; в данном контексте дополнение связано с водотоком.
- source_word: מִיכַל הַמָּיִם
  choice: ручей
  rationale: Необычное древнееврейское выражение, по контексту, обозначает небольшой водоток или водный канал. «Ручей» понятно современному читателю и не перегружает фразу буквальным «водный поток»; неопределённость отмечена в сноске.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: исκали их, но не нашли
  rationale: בקשׁ здесь означает разыскивать людей. Местоимение «их» восполняет подразумеваемое дополнение, а «но» естественно выражает безуспешность поисков.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: вернулись в Иерусалим
  rationale: שׁוב означает возвращение; русское управление «вернулись в Иерусалим» точно и естественно.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с ясным повествовательным синтаксисом. Имена переданы в привычной русской библейской форме: Авессалом, Ахимаас, Ионафан. Необычность обозначения водотока сохранена посредством сноски, а не искусственно буквальной формулировки в основном тексте.'
