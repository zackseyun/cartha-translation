base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: ru
  text: 'Когда Хусий пришёл к Авессалому, Авессалом сказал ему: «Вот что сказал Ахитофел. Поступить ли нам так, как он сказал?[a] А если нет, говори ты».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сделаем ли мы его слово?» — то есть исполним ли совет Ахитофела.'
    reason: Сноска сохраняет необычную буквальную форму еврейского выражения и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: В повествовательной последовательности глагол בוא обозначает прибытие Хусия к Авессалому; «пришёл» естественно передаёт направленность, выраженную אֶל.
- source_word: חוּשַׁי
  choice: Хусий
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени, понятная современному читателю.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: Вот что сказал
  rationale: Оборот указывает на содержание только что изложенного совета Ахитофела. Формулировка естественна по-русски и сохраняет указательное значение זֶה, не перегружая речь буквальным «такое слово».
- source_word: הֲנַעֲשֶׂה אֶת דְּבָרוֹ
  choice: Поступить ли нам так, как он сказал?
  rationale: Вопросительная частица с формой первого лица множественного числа выражает обсуждение решения, а буквальное «сделать его слово» означает исполнить данный совет. Выбранная формулировка ясно и естественно передаёт этот смысл.
- source_word: אִם אַיִן
  choice: А если нет
  rationale: Краткий условно-противительный оборот передан естественным русским выражением; союз «а» обозначает переход к альтернативе.
- source_word: אַתָּה דַבֵּר
  choice: говори ты
  rationale: 'Постпозитивное «ты» передаёт подчёркнутое самостоятельным местоимением אַתָּה противопоставление: теперь должен высказаться Хусий.'
