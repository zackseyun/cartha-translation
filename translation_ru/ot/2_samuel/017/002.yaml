base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: ru
  text: Я нападу на него, когда он будет утомлён и ослабел[a], и приведу его в смятение. Весь народ, что с ним, разбежится, а я поражу одного лишь царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слаб руками»; это выражение может означать упадок сил или мужества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Я нападу на него
  rationale: Сочетание בוא с עַל в данном военном контексте обозначает враждебное выступление против человека. «Нападу» естественно передаёт этот смысл по-русски.
- source_word: יָגֵעַ
  choice: утомлён
  rationale: Прилагательное обозначает усталость вследствие напряжения или усилий; «утомлён» соответствует военному контексту и литературному регистру.
- source_word: וּרְפֵה יָדַיִם
  choice: обессилен[a]
  rationale: Буквально выражение означает «слаб руками» и может указывать на упадок физических сил или мужества. В тексте выбран естественный русский эквивалент, а образ исходного выражения сохранён в примечании.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: приведу его в смятение
  rationale: Каузативная форма חרד означает заставить дрожать, испугать или повергнуть в тревогу. «Приведу в смятение» передаёт вызванную внезапным нападением панику, не сводя значение лишь к эмоции страха.
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: Весь народ, который с ним, разбежится
  rationale: Сохранены собирательное «народ» и относительная конструкция «который с ним»; «разбежится» естественно выражает бегство группы людей.
- source_word: וְהִכֵּיתִי
  choice: я поражу
  rationale: נכה означает нанести удар или поразить и в контексте подразумевает смертельное нападение. «Поражу» сохраняет формальную широту глагола, не заменяя его прямо словом «убью».
- source_word: הַמֶּלֶךְ
  choice: царя
  rationale: Определённое существительное передано титулом «царь»; хотя речь идёт о Давиде, имя в исходном тексте здесь не употреблено.
- source_word: לְבַדּוֹ
  choice: одного лишь
  rationale: Оборот подчёркивает, что единственной целью станет царь. «Одного лишь царя» ясно передаёт ограничительное значение и не создаёт впечатления, будто речь только о его физической изоляции.
