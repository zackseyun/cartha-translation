base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: ru
  text: Когда Давид пришёл в Маханаим, Шови, сын Нахаша, из Раббы, города аммонитян, Махир, сын Аммиэля, из Ло-Девара, и Барзиллай, галаадитянин из Роглима,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Когда … пришёл
  rationale: Конструкция с וַיְהִי и временным инфинитивом כְּבוֹא вводит новое событие повествования. Русское «когда … пришёл» естественно передаёт временное значение без буквального и тяжеловесного «и было».
- source_word: מַחֲנָיְמָה
  choice: в Маханаим
  rationale: Направительный ה указывает на движение к месту; после глагола «пришёл» это естественно выражается предлогом «в».
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Шови, сын Нахаша
  rationale: Имена транслитерированы с еврейского; патронимическая конструкция передана обычным русским оборотом.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: из Раббы аммонитян
  rationale: רַבָּה — название города, а בְּנֵי עַמּוֹן обозначает аммонитян. Формулировка сохраняет связь города с народом и звучит естественно по-русски.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Махир, сын Аммиэля
  rationale: Личные имена переданы транслитерацией, а בֶן — словом «сын».
- source_word: מִלֹּא דְבָר
  choice: из Ло-Девара
  rationale: Географическое название транслитерировано и оформлено через дефис как составной топоним.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Барзиллай, галаадитянин
  rationale: Имя транслитерировано; определение הַגִּלְעָדִי передано существительным, обозначающим региональную принадлежность.
- source_word: מֵרֹגְלִים
  choice: из Роглима
  rationale: Название места передано транслитерацией; предлог מִן выражен русским «из».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Стих представляет собой начало предложения, продолжающегося в следующем стихе, поэтому сохранена завершающая запятая и не добавлен отсутствующий в еврейском тексте сказуемый.
