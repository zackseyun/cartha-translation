  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: ru
  text: И мы придём к нему в одном из мест, где его обнаружат, и осядем на нём, как роса падает на землю. И не уцелеет ни он сам, ни один из всех людей, которые с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: И мы придём к нему
  rationale: Сохраняет основное значение בוא и направленность אֵלָיו; в данном военном контексте враждебный смысл ясен без добавления «нападём».
- source_word: בְאַחַת הַמְּקוֹמֹת אֲשֶׁר נִמְצָא שָׁם
  choice: в одно из мест, где он окажется
  rationale: Естественно передаёт неопределённое место обнаружения Давида; נִמְצָא допускает смысл «будет найден / окажется».
- source_word: וְנַחְנוּ עָלָיו
  choice: и покроем его
  rationale: Глагол נוח буквально означает «покоиться, располагаться»; в военном сравнении с росой русское «покроем» передаёт образ сплошного охвата, не смешивая этот глагол с последующим נפל «падать».
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: как роса покрывает землю
  rationale: По-русски роса обычно «ложится» или «покрывает» землю; формулировка сохраняет образ всеохватности, хотя буквально сказано «как роса падает на землю».
- source_word: וְלֹא נוֹתַר בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ גַּם אֶחָד
  choice: И ни от него, ни от всех людей, которые с ним, не останется ни одного
  rationale: Передаёт отрицание и заключительное усиление גַּם אֶחָד «даже одного»; «люди» уместно обозначает сопровождающих его мужчин.
