  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: ru
  text: 'Но я советую: пусть к тебе непременно соберётся весь Израиль, от Дана до Вирсавии, столь же многочисленный, как песок на берегу моря, а ты сам отправься в сражение.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и лицо твоё идёт в сражение»; это выражение означает, что Авессалом должен лично отправиться в сражение.'
    reason: Сноска сохраняет образность еврейской идиомы и поясняет её смысл, не добавляя того, что Авессалом непременно должен возглавить атаку.
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В данном контексте частица вводит совет Хусия, противопоставленный предыдущему плану Ахитофела; русское «но» естественно передаёт этот контраст.
- source_word: יָעַצְתִּי
  choice: я советую
  rationale: Форма глагола יעץ здесь выражает совершаемый речевой акт; настоящее время естественно для прямого совета.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: пусть… непременно соберётся
  rationale: Инфинитив абсолютный при личной форме того же корня усиливает действие; «непременно» сохраняет эмфатический смысл.
- source_word: עָלֶיךָ
  choice: к тебе
  rationale: При глаголе אסף предлог указывает на сбор к вождю или вокруг него; «к тебе» звучит естественно и не исключает значения сбора под его началом.
- source_word: כָל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохраняется обычное собирательное обозначение всего народа или его войска.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: от Дана до Вирсавии
  rationale: Традиционная географическая меризма, обозначающая всю территорию Израиля; название Беэр-Шевы передано укоренившейся русской библейской формой «Вирсавия».
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: многочисленный, как песок на берегу моря
  rationale: Передаётся образ неисчислимого множества; прилагательное согласовано с собирательным «Израиль».
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: а ты сам выступи
  rationale: Буквально «и лицо твоё идущее» — идиома личного присутствия Авессалома; «ты сам» сохраняет эмфазу, а повелительная форма естественно продолжает совет.
- source_word: בַּקְרָב
  choice: в бой
  rationale: В военном контексте קרב означает сражение; сочетание «выступить в бой» естественно передаёт направленность действия.
