  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены риторическая всеохватность («весь Израиль», «от Дана до Вирсавии»), усиление «непременно» и морской образ. Формулировка избегает архаизмов, кроме укоренившегося русского библейского топонима «Вирсавия».
