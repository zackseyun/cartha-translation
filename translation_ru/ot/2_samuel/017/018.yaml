base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: ru
  text: Но один юноша увидел их и сообщил Авессалому. Тогда они оба поспешно отправились и пришли к дому одного человека в Бахуриме. Во дворе у него был колодец, и они спустились туда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спустились в него», то есть в колодец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: юноша
  rationale: Слово может обозначать мальчика, юношу или слугу; здесь «юноша» естественно передаёт возрастную характеристику, не добавляя указания на статус.
- source_word: וַיַּגֵּד
  choice: сообщил
  rationale: Форма глагола נגד означает «сообщить, донести». «Сообщил» уместно для передачи сведений Авессалому и звучит естественно по-русски.
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Передаёт явное указание еврейского текста на двух человек.
- source_word: מְהֵרָה
  choice: поспешили
  rationale: Наречное употребление выражает срочность; русский глагол «поспешили» естественно включает значение быстроты.
- source_word: בֵּית אִישׁ
  choice: к дому одного человека
  rationale: Неопределённое лицо вводится естественной русской конструкцией без добавочной идентификации.
- source_word: בְּבַחוּרִים
  choice: в Бахуриме
  rationale: Название местности передано принятой русской библейской транслитерацией и локативной конструкцией.
- source_word: בְאֵר
  choice: колодец
  rationale: Обычное значение слова — колодец; контекст следующего стиха, где закрывают его отверстие, этому не противоречит.
- source_word: בַּחֲצֵרוֹ
  choice: во дворе у него
  rationale: חָצֵר обозначает огороженный двор при доме; такой порядок слов идиоматичен в современном русском.
- source_word: וַיֵּרְדוּ שָׁם
  choice: они спустились туда
  rationale: Сохраняет буквальную пространственную неопределённость שָׁם («туда»), хотя из контекста ясно, что речь идёт о колодце.
