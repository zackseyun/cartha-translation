  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: ru
  text: Даже храбрец, чьё сердце — как сердце льва, совсем падёт духом[a], ведь весь Израиль знает, что твой отец — могучий воин и что люди, которые с ним, — храбрые воины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «растает, растает» — усиленная конструкция со значением «совсем падёт духом» или «полностью лишится мужества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: храбрец
  rationale: Идиома буквально означает «сын силы/доблести» и обозначает мужественного, опытного воина; «храбрец» естественно передаёт её в единственном числе.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: чьё сердце — как сердце льва
  rationale: Сохранено исходное сравнение и образ львиного сердца без замены на менее наглядное прилагательное.
- source_word: הִמֵּס יִמָּס
  choice: непременно падёт духом
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол. Русское выражение передаёт утрату мужества, а наречие «непременно» — эмфатическую конструкцию.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего утверждения; «ведь» естественно выражает эту пояснительно-причинную связь.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: весь Израиль знает
  rationale: Прямая и естественная передача общеизвестного, устойчивого знания.
- source_word: גִבּוֹר
  choice: могучий воин
  rationale: В данном военном контексте слово характеризует Давида как сильного и прославленного бойца, а не просто как физически сильного человека.
- source_word: וּבְנֵי חַיִל אֲשֶׁר אִתּוֹ
  choice: люди, которые с ним, — храбрые воины
  rationale: Передаёт относительную конструкцию и повторную идиому בְּנֵי חַיִל, сохраняя её военный смысл.
