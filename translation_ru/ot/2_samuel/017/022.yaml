    text: 'Или: «до утреннего света». Еврейское выражение сохраняет образ утреннего света и может обозначать время, к которому переправа была завершена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычное значение формы глагола קום — «встал». Контекст допускает более истолковывающее «отправился», но в основном тексте сохранено прямое значение.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: и вместе с ним — весь народ, который был с ним
  rationale: «Народ» передаёт собирательное הָעָם без неоправданного ограничения группы одними мужчинами; «вместе с ним» естественно связывает народ с действием Давида.
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: они перешли Иордан
  rationale: עבר с прямым дополнением означает пересечение реки; «перешли Иордан» — ясная и естественная русская формулировка.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: к утреннему свету
  rationale: Передаёт временной предел, к которому переправа была завершена, и сохраняет образ света, выраженный существительным אוֹר. Возможность понимания עַד как «до» отмечена в сноске.
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר אֶת־הַיַּרְדֵּן
  choice: не осталось ни одного человека, который не перешёл бы Иордан
  rationale: 'Естественно передаёт усиленную отрицательную конструкцию: ни один из сопровождавших Давида не отсутствовал среди переправившихся, то есть переправились все.'
