base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: ru
  text: Тогда Давид и весь народ, который был с ним, встали и перешли Иордан. К утреннему свету[a] не было ни одного человека, который не перешёл Иордан.
  philosophy: optimal-equivalence
  footnotes:
