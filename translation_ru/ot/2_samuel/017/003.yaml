  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: ru
  text: 'И я возвращу к тебе весь народ[a]: возвращение всех связано с человеком, которого ты ищешь; и весь народ будет в мире.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этого места труден; буквально: «как возвращение всех — человек, которого ты ищешь». Вероятный смысл: судьба этого одного разыскиваемого человека связана с возвращением всех остальных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: и я возвращу
  rationale: 'Порода хифиль глагола שׁוב имеет каузативный смысл: говорящий намерен привести народ обратно, а не просто вернуться сам.'
- source_word: כָל הָעָם
  choice: весь народ
  rationale: עָם обычно означает «народ». В данном контексте речь идёт о людях, последовавших за Давидом, однако более узкое «войско» было бы излишним уточнением.
- source_word: כְּשׁוּב הַכֹּל
  choice: Когда вернутся все
  rationale: Еврейская конструкция трудна и, вероятно, эллиптична. Перевод сохраняет образ возвращения всех, не превращая неясный синтаксис в определённое причинное утверждение.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: человека, которого ты ищешь
  rationale: Сохраняется единственное число и прямое указание на Давида как на разыскиваемого человека.
- source_word: יִהְיֶה שָׁלוֹם
  choice: будет жить в мире
  rationale: שָׁלוֹם здесь обозначает мирное и благополучное состояние народа после прекращения конфликта; эта формулировка естественна по-русски.
