lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Авессалом сказал
  rationale: Вав с имперфектом продвигает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: קְרָא נָא
  choice: Позовите, пожалуйста
  rationale: Императив с частицей נָא имеет оттенок вежливой просьбы; современная русская формула сохраняет его.
- source_word: גַּם לְחוּשַׁי הָאַרְכִּי
  choice: также Хусия Архитянина
  rationale: Первое גַּם добавляет Хусия к уже выслушанному советнику; этникон הָאַרְכִּי передан традиционной русской формой «Архитянин».
- source_word: וְנִשְׁמְעָה
  choice: и послушаем
  rationale: Когортатив первого лица множественного числа выражает предложение или побуждение к совместному действию.
- source_word: מַה בְּפִיו גַּם הוּא
  choice: что скажет он
  rationale: Буквальное «что в его устах, и он тоже» является идиомой о мнении или предложении человека. Постпозиция «он» сохраняет добавочное ударение второго גַּם без тяжеловесного повтора «тоже» после «также».
