lexical_decisions:
- source_word: מִשְׁכָּב
  choice: постельные принадлежности
  rationale: Существительное обозначает то, на чём или с чем лежат. В перечне припасов собирательное русское выражение естественно передаёт форму единственного числа и не уточняет без основания, шла ли речь именно о кроватях.
- source_word: סַפּוֹת
  choice: тазы
  rationale: Слово, вероятно, обозначает широкие бытовые сосуды; «тазы» уместны в перечне хозяйственных вещей, а возможное значение «чаши» сохранено в сноске.
- source_word: כְלִי יוֹצֵר
  choice: глиняную посуду
  rationale: Буквально «сосуды горшечника». Современное выражение передаёт и назначение, и материал изделий без тяжеловесной кальки.
- source_word: חִטִּים
  choice: пшеницу
  rationale: Обычное название указанной зерновой культуры.
- source_word: שְׂעֹרִים
  choice: ячмень
  rationale: Обычное название указанной зерновой культуры.
- source_word: קֶמַח
  choice: муку
  rationale: Слово обозначает размолотое зерно; «мука» — ясный и естественный русский эквивалент.
- source_word: קָלִי
  choice: жареное зерно
  rationale: Термин обозначает зерно, приготовленное сухим нагреванием. Одинаковый перевод обоих употреблений сохраняет намеренный или текстуально засвидетельствованный повтор еврейского текста.
- source_word: פּוֹל
  choice: бобы
  rationale: Название, вероятно, относится к конским бобам (Vicia faba). Общее «бобы» естественно в основном тексте, а более точная идентификация дана в сноске.
- source_word: עֲדָשִׁים
  choice: чечевицу
  rationale: Стандартное русское название этой бобовой культуры.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий перечислительный строй оригинала сохранён. Повтор «жареное зерно» передан дословно в обоих местах, поскольку еврейский текст повторяет קָלִי. Союзы между всеми ранними членами списка не воспроизводятся механически, чтобы перечень звучал естественно по-русски.
