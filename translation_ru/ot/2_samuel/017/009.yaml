base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: ru
  text: 'Вот, он сейчас скрывается в одной из ям[a] или в каком-нибудь другом месте. И случится: как только он нападёт на них в самом начале, всякий, кто услышит об этом, скажет: «Среди людей, идущих за Авессаломом, произошло побоище[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одной из впадин». Еврейское слово может обозначать яму, углубление или иное подобное укрытие на местности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «произошёл разгром», «они потерпели тяжёлое поражение». Здесь еврейское слово означает тяжёлый военный удар или поражение, а не эпидемию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: Вот, он сейчас
  rationale: «Вот» естественно привлекает внимание и сохраняет живость речи, а «сейчас» передаёт подчёркнутую непосредственность עַתָּה.
- source_word: נֶחְבָּא
  choice: скрывается
  rationale: Нифаль допускает состояние сокрытости и возвратное значение. В данном контексте «скрывается» звучит естественно и не уточняет конкретное укрытие.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: в одной из ям
  rationale: פְּחָתִים обозначает ямы, впадины или углубления местности; «ям» — прямой и понятный эквивалент, а более широкий диапазон отмечен в сноске.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: в каком-нибудь другом месте
  rationale: Добавление «другом» естественно выражает альтернативу после אוֹ, не конкретизируя место.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: если при первом же столкновении некоторые из них падут
  rationale: Оборот передаёт предполагаемые первые потери среди людей Авессалома. «При первом же столкновении» естественно раскрывает военный смысл буквального «в начале».
- source_word: הַשֹּׁמֵעַ
  choice: всякий, кто услышит об этом
  rationale: Артиклированное причастие имеет обобщённое значение; выбранная формулировка естественна по-русски.
- source_word: מַגֵּפָה
  choice: потерпели поражение
  rationale: В военном контексте слово обозначает тяжёлый удар, поражение или избиение, а не эпидемию. «Потерпели поражение» ясно передаёт контекст, не усиливая смысл до обязательного полного уничтожения.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: люди, идущие за Авессаломом
  rationale: אַחֲרֵי здесь выражает следование и верность Авессалому; формулировка сохраняет образ исходного текста и понятна в политико-военном контексте.
