  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: ru
  text: 'Царь спросил его: «Где он?» Цива ответил царю: «Вот он в доме Махира, сына Аммиэля, в Ло-Деваре».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: «Он…» без отдельного междометия
  rationale: В ответе на прямой вопрос частица вводит указание на местонахождение; по-русски её значение естественно передаётся самой конструкцией ответа, тогда как «вот» здесь звучало бы менее естественно.
- source_word: בֵּית מָכִיר
  choice: «в доме Махира»
  rationale: Сохранено прямое пространственное значение и конструкция принадлежности.
- source_word: בְּלוֹ דְבָר
  choice: «в Ло-Деваре»
  rationale: Название места передано транслитерацией без попытки переводить возможное значение имени.
- source_word: צִיבָא
  choice: «Цива»
  rationale: Традиционная и узнаваемая русская передача древнееврейского имени.
