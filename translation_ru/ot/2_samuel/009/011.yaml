base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: ru
  text: 'И сказал Сива царю: «Всё, что господин мой царь повелит своему слуге, твой слуга исполнит». А Мемфивосфей ел за моим столом[a], как один из царских сыновей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «за моим столом». Неожиданная смена лица, вероятно, передаёт слова или точку зрения Давида. Некоторые древние версии и многие переводы читают по смыслу: «за царским столом».'
    reason: Сохраняет первое лицо масоретского текста и открыто отмечает текстовую и речевую неоднозначность.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная формула введения прямой речи.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: Всё, что ... повелит
  rationale: Естественно передаёт всеохватность выражения и значение повеления; форма будущего уместна в обещании исполнить распоряжения.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохраняет почтительную придворную формулу без излишней архаизации.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: своему слуге / твой слуга
  rationale: В данном придворном контексте עבד служит формулой почтительного самообозначения; «раб» чрезмерно подчёркивало бы несвободный статус.
- source_word: כֵּן יַעֲשֶׂה
  choice: исполнит
  rationale: Кратко и естественно передаёт обещание поступить именно согласно царскому повелению.
- source_word: אֹכֵל
  choice: ел
  rationale: Причастие обозначает продолжавшееся или обычное положение дел; русское несовершенное прошедшее естественно передаёт этот смысл.
- source_word: עַל שֻׁלְחָנִי
  choice: за моим столом
  rationale: Русское идиоматическое выражение для совместной трапезы сохраняет первое лицо масоретского текста.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: как один из царских сыновей
  rationale: Сохраняет сравнение и указание на статус, подобный статусу членов царской семьи.
theological_decisions:
- issue: Говорящий в выражении «за моим столом»
  choice: 'Сохранено первое лицо масоретского текста: «за моим столом».'
  alternative: «за царским столом» либо «за столом царя» как сглаживание смены лица и как чтение, поддержанное древними версиями.
  rationale: WLC прямо читает שֻׁלְחָנִי, «моим столом». Неясная смена говорящего представляет собой подлинную текстовую трудность, которую не следует молча устранять; сноска сообщает читателю о возможном сглаженном понимании.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Имя ציבא передано традиционно как «Сива», а מְפִיבֹשֶׁת — как «Мемфивосфей». Синтаксис прямой речи упрощён без потери её почтительной придворной тональности.
