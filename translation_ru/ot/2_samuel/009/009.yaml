source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: ru
  text: 'Тогда царь призвал Циву, слугу Саула[a], и сказал ему: «Всё, что принадлежало Саулу и всему его дому[b], я отдал сыну твоего господина[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юношу Саула», «приближённого Саула»; здесь, вероятно, имеется в виду слуга или человек из его свиты.'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь может означать семью и домочадцев Саула, а также принадлежавшее его дому имущество.
    reason: lexical_alternative
  - marker: c
    text: Речь о Мемфивосфее, внуке Саула; слово «сын» в библейском языке может обозначать и потомка.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: слуга
  rationale: Хотя слово может означать «юноша» или «слуга, приближённый», здесь оно обозначает положение Цивы при доме Саула; «слуга» естественно передаёт эту роль по-русски.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: всё, что принадлежало Саулу
  rationale: Еврейская конструкция с לְ выражает принадлежность; такой перевод ясно и естественно передаёт владение.
- source_word: וּלְכָל בֵּיתוֹ
  choice: и всему его дому
  rationale: Сохранён многозначный образ «дома», который может охватывать семью, домочадцев и владение Саула; пояснение дано в сноске.
- source_word: נָתַתִּי
  choice: я отдал
  rationale: Перфект обозначает совершённую передачу с сохраняющимся результатом; в русской прямой речи естественна форма прошедшего времени совершенного вида.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: сыну твоего господина
  rationale: «Господин» обозначает здесь человека, стоящего выше Цивы в отношениях служения, а не божественный титул. Буквальная родственная формулировка сохранена, а её контекстуальный смысл пояснён.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Тогда царь призвал ... и сказал
  rationale: Последовательность форм продвигает повествование; «тогда» естественно отмечает переход к следующему действию.
theological_decisions:
- issue: Кого называет выражение «сын твоего господина»
  choice: В основном тексте сохранено буквальное «сыну твоего господина»; в сноске указан Мемфивосфей.
  alternative: Заменить в тексте выражение именем «Мемфивосфею».
  rationale: 'Буквальная формулировка сохраняет способ обозначения персонажа в еврейском тексте и не скрывает родословную особенность: Мемфивосфей был внуком Саула, хотя «сын» может употребляться шире — о потомке.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Призвал» и «господин» сохраняют достоинство регистра, не создавая архаичной тяжеловесности. Все сноски привязаны к соответствующим словам основного текста.
