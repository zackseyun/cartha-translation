    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал за ним
  rationale: Глагол буквально означает «послал», но в сочетании с последующим «взял его» контекстуально и естественно по-русски передаёт распоряжение привести человека; дополнение «за ним» не устраняет последовательность двух действий.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Естественная русская передача определённого титула с именем.
- source_word: וַיִּקָּחֵהוּ
  choice: забрал его
  rationale: לקח имеет основное значение «брать, взять»; «забрал» здесь естественно обозначает перемещение Мемфивосфея по царскому распоряжению, не делая явно выраженным отсутствующий в глаголе смысл «привёл».
- source_word: מִבֵּית
  choice: из дома
  rationale: בַּיִת может обозначать как жилище, так и домохозяйство; буквальное «из дома» сохраняет эту контекстуальную широту.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Махира, сына Аммиэла
  rationale: Имена переданы в принятой русской библейской транслитерации, а конструкция родства сохранена явно.
- source_word: מִלּוֹ דְבָר
  choice: из Ло-Девара
  rationale: Форма понята как название места; повтор предлога מִן отражён повтором русского «из».
