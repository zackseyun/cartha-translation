revisions:
- from: Ты, твои сыновья и твои рабы будете возделывать для него землю и собирать урожай, чтобы у сына твоего господина был хлеб[a] и он мог есть. Но Мемфивосфей, сын твоего господина, всегда будет есть за моим столом». У Сивы было пятнадцать сыновей и двадцать рабов.
  to: Ты, твои сыновья и твои рабы будете возделывать для него землю и приносить урожай, чтобы у сына твоего господина был хлеб[a] и он его ел. Но Мемфивосфей, сын твоего господина, всегда будет есть хлеб за моим столом». У Сивы было пятнадцать сыновей и двадцать рабов.
  rationale: 'Исправлены два смысловых отклонения: обязанность доставлять плоды земли вместо одного лишь сбора урожая и простое питание вместо возможности питаться. Повтор «хлеб» восстановлен в заключительном обещании о столе Давида. Примечание сохранено и остаётся привязанным к первому вхождению «хлеб».'
