base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: ru
  text: Ты, твои сыновья и твои рабы будете возделывать для него землю и приносить урожай, чтобы у сына твоего господина был хлеб[a] и он его ел. Но Мемфивосфей, сын твоего господина, всегда будет есть хлеб за моим столом». У Сивы было пятнадцать сыновей и двадцать рабов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «хлеб», в этом контексте может также означать пищу или пропитание вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת־הָאֲדָמָה
  choice: будете возделывать для него землю
  rationale: Глагол עבד с прямым дополнением אֲדָמָה обозначает здесь земледельческий труд; множественное сказуемое естественно согласует поручение с перечисленными исполнителями.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: твои рабы / рабов
  rationale: В данном контексте речь идёт о зависимых членах домашнего хозяйства Сивы, а не просто о наёмных работниках; «рабы» прямо передаёт их социальный статус.
- source_word: וְהֵבֵאתָ
  choice: собирать урожай
  rationale: Буквально глагол означает «приносить», но подразумеваемый объект определяется земледельческим контекстом. Русское «собирать урожай» ясно и естественно выражает внесение плодов земли.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם
  choice: чтобы у сына твоего господина был хлеб
  rationale: Сохранено слово «хлеб», связывающее обеспечение с последующим образом трапезы, а целевая конструкция естественно передаёт функцию урожая.
- source_word: וַאֲכָלוֹ
  choice: и он мог есть
  rationale: Форма указывает на питание сына господина за счёт полученного; по-русски отсутствие прямого объекта избегает неестественного буквального «есть его» применительно к хлебу или продовольствию.
- source_word: יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: всегда будет есть за моим столом
  rationale: Русская идиома «есть за столом» естественно передаёт постоянное царское содержание и участие в трапезе; второе «хлеб» не повторяется, поскольку по-русски оборот без него звучит яснее.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: У Сивы было пятнадцать сыновей и двадцать рабов
  rationale: В еврейском это именное предложение принадлежности; прошедшее «было» естественно вводит фоновое пояснение.
