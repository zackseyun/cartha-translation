base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: ru
  text: 'У дома Саула был слуга по имени Сива. Его позвали к Давиду, и царь спросил его: «Ты Сива?» Он ответил: «Твой слуга»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более полно: «Я твой слуга». В еврейском тексте ответ краток: «Твой слуга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: У дома Саула был
  rationale: 'Еврейская конструкция с לְ выражает принадлежность: слуга состоял при доме Саула. Такой перевод сохраняет упоминание «дома» как семьи или династии и естественно передаёт значение обладания.'
- source_word: עֶבֶד
  choice: слуга
  rationale: Слово может означать как раба, так и слугу. Здесь речь идёт о зависимом человеке, служившем дому Саула; «слуга» естественно для данного контекста и не уточняет степень несвободы сверх текста.
- source_word: וּ/שְׁמ/וֹ צִיבָא
  choice: по имени Сива
  rationale: Идиоматическая русская передача буквального «и имя его — Сива»; имя дано в традиционной русской форме.
- source_word: וַ/יִּקְרְאוּ ל/וֹ אֶל דָּוִד
  choice: Его позвали к Давиду
  rationale: Неопределённо-личная конструкция естественно передаёт еврейскую форму множественного числа без названного субъекта; предлог и направление сохраняются выражением «к Давиду».
- source_word: הַ/מֶּלֶךְ
  choice: царь
  rationale: Определённый титул относится к Давиду; в русском контексте повторное определение не требуется.
- source_word: הַ/אַתָּה צִיבָא
  choice: Ты Сива?
  rationale: Прямой и естественный вопрос, соответствующий еврейской вопросительной конструкции.
- source_word: עַבְדֶּךָ
  choice: Твой слуга
  rationale: Сохранён эллиптический, почтительный ответ без добавления подразумеваемого «я» или «я —».
