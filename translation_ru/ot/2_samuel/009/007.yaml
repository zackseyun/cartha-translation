  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: ru
  text: 'Давид сказал ему: «Не бойся, ведь я непременно окажу тебе милость[a] ради Ионафана, твоего отца. Я возвращу тебе все земли Саула, твоего отца[b], и ты всегда будешь есть за моим столом[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское хесед может также означать «верная любовь», «преданная любовь» или «неизменная милость».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Саула, твоего отца». Слово «отец» в древнееврейском языке может обозначать предка; Саул был дедом Мемфивосфея.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «есть хлеб за моим столом» — то есть постоянно получать содержание и участвовать в трапезах царя.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Естественная современная передача отрицательного повеления, сохраняющая прямое ободрение.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: ведь я непременно окажу
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает обещание; наречие «непременно» передаёт эту эмфазу.
- source_word: חֶסֶד
  choice: милость
  rationale: В данном контексте слово обозначает благожелательность и верность, проявленные в конкретном поступке ради Ионафана. «Милость» естественна в повествовании, а оттенок преданной, верной любви отмечен в сноске.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: ради Ионафана, твоего отца
  rationale: «Ради» передаёт как основание поступка, так и личные отношения, побуждающие Давида действовать.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Я возвращу тебе
  rationale: Каузативная форма глагола שוב здесь означает возвращение прежнему владельцу земли или родового владения.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: все земли Саула
  rationale: Существительное в единственном числе может иметь собирательное значение и здесь указывает на земельное владение Саула, а не обязательно на одно поле.
- source_word: שָׁאוּל אָבִיךָ
  choice: Саула, твоего отца
  rationale: Основной текст сохраняет формулировку древнееврейского оригинала и его широкое употребление слова אָב; фактическое родство пояснено в сноске.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: ты всегда будешь есть за моим столом
  rationale: Естественная русская передача идиомы, обозначающей постоянное обеспечение пищей и участие в царской трапезе.
theological_decisions:
- issue: Смысл חֶסֶד как верной, обусловленной отношениями милости
  choice: В основном тексте — «милость», с пояснением оттенков верной любви и преданности в сноске.
  alternative: «верная любовь»; «преданная любовь»; «неизменная милость»
  rationale: Обещание Давида основано на его связи и обязательстве перед Ионафаном. Перевод не сводит слово ни к отвлечённой доброте, ни к специально сформулированной богословской концепции.
- issue: Обозначение Саула словом אָב по отношению к Мемфивосфею
  choice: Сохранено «твоего отца», а более широкое родственное значение пояснено.
  alternative: «твоего деда»; «твоего предка»
  rationale: Так сохраняется повтор אָב в оригинале и его семантическая широта; сноска устраняет возможное впечатление, будто Саул был непосредственным отцом Мемфивосфея.
translation_notes:
  register: Современный литературный русский язык с достойной повествовательной интонацией. Усиление обещания передано словом «непременно»; еврейская идиома о хлебе раскрыта естественной русской фразой, а буквальный образ сохранён в сноске.
