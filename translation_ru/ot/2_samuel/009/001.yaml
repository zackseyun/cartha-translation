  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: ru
  text: 'Давид сказал: «Остался ли ещё кто-нибудь из дома Саула, чтобы мне оказать ему милость[a] ради Ионафана?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преданную любовь» или «верность завету». Еврейское слово часто означает милость, проявляемую с верностью и преданностью, а не просто доброе чувство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартный повествовательный глагол אמר передаётся как «сказал»; вопросительная форма последующей речи не требует замены на «спросил».
- source_word: הֲכִי יֶשׁ עוֹד
  choice: остался ли ещё кто-нибудь
  rationale: Сочетание вопросительной конструкции с יֶשׁ עוֹד выражает вопрос о продолжающемся существовании; по-русски естественно передаётся через «остался ли ещё кто-нибудь».
- source_word: אֲשֶׁר נוֹתַר לְבֵית שָׁאוּל
  choice: из дома Саула
  rationale: בית здесь обозначает род или династический дом, а נותר — уцелевшего или оставшегося человека. Русская конструкция сохраняет семейно-династический смысл без пространственного оттенка.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: чтобы мне оказать ему милость
  rationale: עשה עם חסד — устойчивое сочетание со значением проявить или оказать милость. «Чтобы» естественно выражает целевую связь в вопросе.
- source_word: חֶסֶד
  choice: милость
  rationale: «Милость» уместна для благодеяния царя и сохраняет большую смысловую глубину, чем простая «доброта»; примечание раскрывает оттенки верности и преданной любви.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: ради Ионафана
  rationale: בַּעֲבוּר указывает на основание или мотив действия; «ради Ионафана» кратко и естественно передаёт этот смысл.
theological_decisions:
- issue: Смысл חֶסֶד в намерении Давида по отношению к дому Саула
  choice: Передать в основном тексте словом «милость» и пояснить оттенок верной, преданной любви в сноске.
  alternative: «преданная любовь»; «верная любовь»; «верность завету»
  rationale: Контекст связывает благодеяние Давида с его отношениями и обязательством перед Ионафаном. «Милость» естественна в русском повествовании, а сноска сохраняет заложенный в חֶסֶד оттенок верности, не делая более узкое богословское толкование частью основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Дом Саула» сохранён как понятный библейский оборот со значением рода или династии; синтаксис вопроса сделан естественным для современной речи.
