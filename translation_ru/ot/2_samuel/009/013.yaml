  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: ru
  text: Мемфивосфей жил в Иерусалиме, потому что всегда ел за царским столом. Он был хром на обе ноги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: жил
  rationale: Причастие от ישׁב при названии города обозначает постоянное проживание; «жил» естественно передаёт это значение в современном русском языке.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину проживания Мемфивосфея в Иерусалиме; причинное значение сохраняется явно.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: царским столом
  rationale: Русское выражение «есть за царским столом» естественно передаёт древнееврейскую конструкцию и подразумеваемое царское содержание и общение.
- source_word: תָּמִיד
  choice: всегда
  rationale: Передаёт постоянный, регулярно повторявшийся характер предоставленной привилегии.
- source_word: אֹכֵל
  choice: ел
  rationale: Причастие обозначает привычное действие; сочетание «всегда ел» естественно выражает его в русском повествовании.
- source_word: פִסֵּחַ
  choice: хром
  rationale: Прямой и нейтральный современный эквивалент обозначения физического состояния.
- source_word: שְׁתֵּי רַגְלָיו
  choice: на обе ноги
  rationale: Естественная русская идиома, точно передающая древнееврейское «[в] обеих его ногах / две его ноги».
- source_word: וְהוּא
  choice: Он был
  rationale: Вав вводит заключительное описание; отдельное предложение без буквального «и» звучит естественно и сохраняет его добавочный характер.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; лаконичная повествовательная фраза. Имя передано в традиционной русской библейской форме «Мемфивосфей». Причинная связь כִּי сохранена без примечания, поскольку альтернативное русское «ведь» не меняет существенным образом смысл.
