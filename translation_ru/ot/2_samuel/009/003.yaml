  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: ru
  text: 'И сказал царь: «Не осталось ли ещё кого-нибудь из дома Саула, чтобы мне оказать ему Божью милость[a]?» Цива ответил царю: «Есть ещё сын Ионафана, хромой на обе ноги[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость Бога»; выражение может также означать милость, подобную Божьей.'
