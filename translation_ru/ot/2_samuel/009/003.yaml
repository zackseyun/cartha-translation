  - marker: b
    text: 'Или: «с повреждёнными ногами»; речь идёт о нарушении, затруднявшем ходьбу.'
    reason: lexical_clarification
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: Не осталось ли ещё кого-нибудь
  rationale: Вопросительная конструкция спрашивает, остался ли кто-либо; отрицательная форма с частицей «ли» естественна по-русски и не утверждает, что никого нет.
- source_word: לְבֵית שָׁאוּל
  choice: из дома Саула
  rationale: «Дом» сохраняет семейно-династический смысл еврейского выражения.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: чтобы мне оказать ему
  rationale: При חֶסֶד глагол עשה естественно передаётся сочетанием «оказать милость»; конструкция сохраняет целевую направленность слов Давида.
- source_word: חֶסֶד אֱלֹהִים
  choice: Божью милость
  rationale: Передаёт широкий смысл верной, благой милости, связанной с Богом, не сужая неоднозначный генитив до одного толкования.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: Есть ещё сын Ионафана
  rationale: Сохраняет акцент на том, что потомок Ионафана всё ещё остаётся в живых.
- source_word: נְכֵה רַגְלָיִם
  choice: у которого поражены обе ноги
  rationale: Описывает нарушение способности ходить без уничижительного обозначения человека; двойственное רַגְלַיִם указывает на обе ноги.
theological_decisions:
- issue: Значение חֶסֶד אֱלֹהִים
  choice: Божью милость
  alternative: верность Божьему завету; милость, угодную Богу
  rationale: Сочетание допускает оттенки милости, свойственной Богу, исходящей от Бога или обусловленной верностью обязательству. Основной текст сохраняет эту широту, а примечание отмечает возможный заветный оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранены библейское семейно-династическое выражение «дом Саула» и неоднозначность сочетания חֶסֶד אֱלֹהִים. Описание инвалидности дано нейтрально и без стигматизирующей лексики.
