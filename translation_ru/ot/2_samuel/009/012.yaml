  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: ru
  text: У Мемфивосфея был маленький сын, и звали его Миха. Все, кто жил в доме Сивы[a], были слугами[b] Мемфивосфея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все домашние Сивы».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «слуги», в зависимости от контекста может означать и «рабы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: У Мемфивосфея был
  rationale: 'Еврейская конструкция с ל выражает обладание: буквально «у Мемфивосфея [был]». Такая формулировка естественна по-русски и близка к структуре источника.'
- source_word: בֵּן קָטָן
  choice: малолетний сын
  rationale: קָטָן указывает на малый возраст сына. «Малолетний» точно и естественно передаёт смысл, не создавая впечатления, будто речь лишь о небольшом росте.
- source_word: וּ/שְׁמ/וֹ מִיכָא
  choice: и звали его Миха
  rationale: Формулировка сохраняет отдельную еврейскую именную конструкцию и передаёт имя מִיכָא принятой русской библейской формой «Миха».
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: Все жившие в доме Сивы
  rationale: מוֹשַׁב связано с проживанием и здесь имеет собирательное значение. Перевод ясно обозначает людей, обитавших в доме Сивы, при сохранении возможного понимания как всего его домашнего сообщества в сноске.
- source_word: עֲבָדִים
  choice: слугами
  rationale: עֲבָדִים может обозначать как слуг, так и рабов. В данном контексте речь идёт о служении дома Сивы Мемфивосфею; нейтральное «слуги» подходит контексту, а более жёсткий вариант сохранён в сноске.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: Мемфивосфея
  rationale: 'После русского слова «слуги» отношение, выраженное еврейским ל, естественно передаётся родительным падежом: они состояли на службе у Мемфивосфея.'
