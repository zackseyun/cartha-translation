  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: ru
  text: 'Он поклонился и сказал: «Что такое раб твой, что ты обратил внимание[a] на мёртвого пса, подобного мне?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернулся к». Здесь это означает благосклонно заметить, удостоить внимания.'
