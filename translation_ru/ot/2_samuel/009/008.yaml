lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Глагол שׁחה в этой форме обозначает почтительный поклон или простирание перед вышестоящим. «Поклонился» естественно звучит по-русски и не уточняет сверх текста, был ли это земной поклон.
- source_word: מֶה עַבְדֶּךָ
  choice: что такое раб твой
  rationale: Сохранён буквальный и намеренно самоуничижительный вопрос «что [такое] раб твой?». Формула «раб твой» передаёт придворное самообозначение, не выдвигая на первый план юридический статус раба.
- source_word: כִּי
  choice: что
  rationale: 'Здесь союз вводит продолжение риторического вопроса: «что такое… что ты…». Такая конструкция сохраняет связь частей и естественна для литературного русского языка.'
- source_word: פָנִיתָ אֶל
  choice: обратил внимание на
  rationale: Буквальный образ — «повернулся к», но в контексте выражение означает благосклонно заметить или удостоить внимания. Основной текст передаёт смысл, а буквальный образ сохранён в сноске.
- source_word: הַכֶּלֶב הַמֵּת
  choice: такого мёртвого пса
  rationale: Выражение передаёт крайнюю степень самоуничижения и ощущения собственной ничтожности. Указательное «такого» естественно связывает образ с последующим сравнением «как я».
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: как я
  rationale: Кратко и естественно передаёт относительный оборот, относящий образ «мёртвого пса» к самому говорящему.
