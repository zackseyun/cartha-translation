  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: ru
  text: 'Мемфивосфей, сын Ионафана, сына Саула, пришёл к Давиду, пал лицом к земле и поклонился. Давид сказал: «Мемфивосфей!» Тот ответил: «Вот твой слуга».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: пал лицом к земле
  rationale: Естественно по-русски передаёт буквальный образ падения на лицо, не ослабляя жест глубокого почтения.
- source_word: וַיִּשְׁתָּחוּ
  choice: и поклонился
  rationale: Передаёт отдельное действие почтительного преклонения без добавления богослужебного оттенка, которого контекст не требует.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Вот твой слуга
  rationale: Сохраняет указательно-презентативную силу הִנֵּה и формулу смиренного самообозначения; современно и понятно по-русски.
