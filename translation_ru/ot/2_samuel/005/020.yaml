base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: ru
  text: 'И пришёл Давид в Баал-Перацим[a] и поразил их там. И сказал: «Яхве прорвался сквозь моих врагов передо мною, подобно прорыву вод»[b]. Поэтому он назвал это место Баал-Перацим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Баал-Перацим» может означать «владыка прорывов» или «место прорывов»; оно созвучно словам Давида о том, что Яхве «прорвался» сквозь его врагов.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как прорываются паводковые воды». В еврейском тексте слова «прорвался», «прорыв вод» и название «Баал-Перацим» образуют игру слов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Баал-Перацим
  rationale: Название места передано транслитерацией. Форма сохраняет связь с корнем פרץ, на котором построена игра слов в объяснении Давида.
- source_word: וַיַּכֵּם
  choice: разбил их
  rationale: В военном контексте נכה означает нанести поражение, поразить. «Разбил их» естественно для современного русского повествования и сохраняет военную силу глагола.
- source_word: פָּרַץ
  choice: прорвался сквозь
  rationale: Глагол означает прорываться, пробивать себе путь. Выбор сохраняет образ неудержимого движения и словесную связь с названием Баал-Перацим.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Прямой и естественный перевод существительного с суффиксом первого лица единственного числа.
- source_word: לְפָנַי
  choice: передо мной
  rationale: Формально близкая передача пространственного выражения, сохраняющая возможность понимать Давида как свидетеля и участника совершённой Богом победы.
- source_word: כְּפֶרֶץ מָיִם
  choice: словно прорвавшиеся воды
  rationale: Естественный русский образ напора воды, сохраняющий повтор корня «прорыв-» и связь с предыдущим глаголом и названием места.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: назвал то место
  rationale: Современная и ясная русская передача еврейского оборота «нарёк имя того места» без архаизации.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохраняется в транслитерации, без подмены титулом.
- issue: Характер действия Яхве в образе прорыва
  choice: прорвался сквозь моих врагов
  alternative: сокрушил моих врагов; пробил брешь в моих врагах
  rationale: 'Выбранная формулировка не сводит образ только к поражению врагов и сохраняет напряжение метафоры: Яхве изображён как сила, прорывающаяся через них подобно водам.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис близок к еврейскому тексту там, где это не нарушает естественности; игра слов передана повтором корня «прорыв-» и пояснена в сносках.
