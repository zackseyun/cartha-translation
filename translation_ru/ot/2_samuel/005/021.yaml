base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: ru
  text: Они оставили там своих идолов[b], а Давид и его люди унесли их[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В 1 Паралипоменон 14:12 добавлено, что Давид приказал сжечь идолов. Здесь, в еврейском тексте книги Самуила, сказано только, что Давид и его люди унесли их.
    reason: cross_reference
  - marker: b
    text: 'Или: «изваяния». Еврейское слово обозначает культовые изображения; перевод «идолы» прямо передаёт их назначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: они оставили
  rationale: Глагол עזב здесь естественно передаёт действие отступивших филистимлян, оставивших предметы на месте; «оставили» точно и нейтрально.
- source_word: שָׁם
  choice: там
  rationale: Прямое соответствие еврейскому наречию места.
- source_word: עֲצַבֵּיהֶם
  choice: своих идолов
  rationale: Существительное обозначает культовые изображения; «идолы» ясно передаёт их религиозную функцию, а возвратное «своих» естественно соотносит их с подлежащим.
- source_word: וַיִּשָּׂאֵם
  choice: унесли их
  rationale: נשא может означать «поднять, нести, унести». В данном контексте «унесли» передаёт физическое перемещение и не добавляет цели этого действия.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: Давид и его люди
  rationale: Буквальный и естественный перевод; контекст показывает, что речь идёт о сопровождавших Давида воинах, но слово «воины» было бы более истолковательным.
theological_decisions:
- issue: Соотношение с параллельным рассказом в 1 Паралипоменон 14:12, где сообщается о сожжении идолов
  choice: Перевести масоретский текст 2 Царств как «унесли их», не согласуя его формулировку с Паралипоменоном
  alternative: Передать так, будто идолы были здесь же сожжены, либо включить их последующее уничтожение непосредственно в основной текст
  rationale: В еврейском тексте данного стиха сказано лишь, что Давид и его люди унесли идолов. Дополнительное сообщение Паралипоменона следует отметить в сноске, не внося его в перевод Самуила.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательным синтаксисом. Формулировка сохраняет лаконичность еврейского текста и не гармонизирует его с параллельным местом.
