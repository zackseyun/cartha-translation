lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Филистимляне
  rationale: 'Союз ו в русском повествовании естественно не выражать отдельно: связь с предыдущим контекстом сохраняется без тяжеловесного начального «и». פְלִשְׁתִּים передано общепринятым этнонимом «филистимляне».'
- source_word: בָּאוּ
  choice: пришли
  rationale: Форма qal перфекта глагола בוא в данном повествовательном контексте обозначает завершённое прибытие; «пришли» естественно и точно.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: расположились по
  rationale: В военном контексте נטשׁ описывает размещение войска на пространстве. «Расположились по» передаёт пространственную протяжённость, не вводя слишком специального значения «развернулись».
- source_word: בְּ/עֵמֶק
  choice: по долине
  rationale: Предлог ב при глаголе пространственного размещения естественно передаётся русским «по», а עֵמֶק — словом «долина».
- source_word: רְפָאִים
  choice: Рефаим
  rationale: В составе географического названия עֵמֶק רְפָאִים слово транслитерируется как «Рефаим», а не истолковывается как обозначение народа или существ.
