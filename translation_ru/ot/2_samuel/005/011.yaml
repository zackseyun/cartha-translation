base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: ru
  text: Хирам, царь Тира, послал Давиду вестников, кедровую древесину, мастеров по дереву и мастеров по кладке каменных стен[a]. Они построили для Давида дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каменщиков». В еврейском выражении буквально присутствуют слова «камень» и «стена».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дворец для Давида». Еврейское слово буквально означает «дом», но в царском контексте может обозначать дворец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычный повествовательный эквивалент глагола שלח; естественно передаёт отправку как людей, так и доставляемых материалов.
- source_word: חִירָם
  choice: Хирам
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: מֶלֶךְ צֹר
  choice: царь Тира
  rationale: Точно передаёт сопряжённую конструкцию и использует традиционное русское название города Тир.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: 'Сохраняет широкое значение слова: посланные лица; контекст допускает дипломатических посланников, но не требует уточнения «послы».'
- source_word: וַעֲצֵי אֲרָזִים
  choice: кедровые брёвна
  rationale: Еврейское выражение буквально связано с кедровыми деревьями и обозначает строительную древесину; «брёвна» конкретно и естественно в данном строительном контексте.
- source_word: חָרָשֵׁי עֵץ
  choice: мастеров по дереву
  rationale: Передаёт ремесленников, работающих с деревом, не сужая значение до одной современной специальности.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: мастеров по каменной кладке стен
  rationale: 'Естественная русская формулировка, сохраняющая оба явных элемента трудного еврейского выражения: «камень» и «стена».'
- source_word: וַיִּבְנוּ
  choice: Они построили
  rationale: Множественное число относится к присланным мастерам; отдельное предложение естественно продолжает еврейское повествование.
- source_word: בַיִת
  choice: дом
  rationale: Основное значение слова сохранено в тексте; в царском контексте возможное значение «дворец» указано в сноске.
- source_word: לְדָוִד
  choice: для Давида
  rationale: Прямо передаёт дательный оттенок пользы или предназначения.
theological_decisions:
- issue: Значение בַיִת в царском контексте
  choice: дом
  alternative: дворец
  rationale: Еврейское слово само по себе означает «дом», хотя применительно к царю может обозначать дворец. Основной текст не устраняет эту лексическую неоднозначность, а контекстуальный вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «а с ними» делает перечень отправленных людей и материалов ясным по-русски, не меняя содержания. Термин «мастера» сохраняет более широкое значение, чем названия узких ремесленных специальностей.
