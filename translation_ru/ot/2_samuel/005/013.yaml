source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: ru
  text: И взял Давид ещё наложниц и жён из Иерусалима после того, как пришёл из Хеврона[a], и родились у Давида ещё сыновья и дочери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Иерусалиме». Буквально по-еврейски: «из Иерусалима»; это может указывать на место, откуда Давид взял их после своего переселения туда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Глагол לקח здесь обозначает принятие женщин в жёны и наложницы; «взял» сохраняет прямоту и краткость еврейского выражения.
- source_word: עוֹד
  choice: ещё
  rationale: 'В обоих случаях наречие указывает на прибавление: Давид взял дополнительных жён и наложниц, и у него родились другие дети.'
- source_word: פִּלַגְשִׁים
  choice: наложниц
  rationale: Стандартное значение слова; оно сохранено отдельно от категории жён, как и в еврейском тексте.
- source_word: וְנָשִׁים
  choice: и жён
  rationale: Хотя נָשִׁים может означать «женщины», в сочетании с «наложницами» речь идёт о супругах.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Предлог מִן обычно выражает исходную точку — «из». Буквальная конструкция сохранена, а возможное местное понимание отмечено в сноске.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: после того, как пришёл из Хеврона
  rationale: Фраза ясно передаёт временную последовательность после перехода Давида из Хеврона.
- source_word: וַיִּוָּלְדוּ ... לְדָוִד
  choice: родились у Давида
  rationale: Нифаль глагола ילד естественно передаётся как «родились», а לְדָוִד — русской конструкцией принадлежности «у Давида».
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Перевод сохраняет прямо названные в еврейском тексте обе группы, не обобщая их словом «дети».
theological_decisions:
- issue: Повествовательное сообщение о многожёнстве Давида
  choice: Передать действие описательно, без нравственной оценки.
  alternative: Добавить формулировку, выражающую одобрение или осуждение.
  rationale: В этом стихе еврейский текст сообщает о поступке Давида и рождении детей, но прямо не даёт ему нравственной оценки; перевод не должен привносить её.
- issue: Необычная конструкция מִירוּשָׁלִַם
  choice: Сохранить формальное значение «из Иерусалима» и отметить альтернативу в сноске.
  alternative: Сгладить как «в Иерусалиме» без сноски.
  rationale: Предлог буквально означает «из», однако по контексту возможна локативная интерпретация. Сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис близок к еврейскому повествованию, но остаётся понятным; различие между жёнами и наложницами сохранено.
