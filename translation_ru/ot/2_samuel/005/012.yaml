base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: ru
  text: И Давид понял, что Яхве утвердил его царём над Израилем[a] и возвысил его царство ради своего народа Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради народа Давида, Израиля», если еврейский суффикс «его» относится к Давиду, а не к Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: И понял
  rationale: ידע может обозначать как знание, так и осознание. В данном повествовательном контексте «понял» естественно передаёт то, что Давид распознал значение совершившегося.
- source_word: הֱכִינוֹ
  choice: утвердил его
  rationale: Каузативная форма כון означает сделать прочным, утвердить. В контексте царской власти «утвердил его царём» передаёт и назначение, и упрочение положения Давида.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму и функцию Божьего имени в еврейском тексте.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: Предлог לְ обозначает положение или роль, а עַל — власть над народом; русский творительный падеж естественно выражает поставление и утверждение в царском сане.
- source_word: נִשֵּׂא
  choice: возвысил
  rationale: Форма от נשׂא передаёт поднятие или возвышение. «Возвысил» уместно описывает усиление царства и сохраняет образ исходного глагола.
- source_word: מַמְלַכְתּוֹ
  choice: его царство
  rationale: ממלכה может означать царство, царскую власть или правление. «Царство» наиболее прямо сохраняет широту значения и местоименную неоднозначность.
- source_word: בַּעֲבוּר
  choice: ради
  rationale: Предлог указывает здесь на цель или благо получателя; краткое русское «ради» точно передаёт этот смысл.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: Своего народа Израиля
  rationale: Наиболее вероятный референт местоименного суффикса — Яхве, действующий субъект предшествующих глаголов. Возвратное «Своего» по-русски ясно связывает народ с Яхве; альтернативная связь с Давидом отмечена в сноске.
theological_decisions:
- issue: К кому относится местоименный суффикс в עַמּוֹ («его народ»)?
  choice: 'К Яхве: «ради Своего народа Израиля».'
  alternative: 'К Давиду: «ради его народа Израиля».'
  rationale: 'Яхве является действующим субъектом: Он утвердил Давида и возвысил царство. Поэтому наиболее естественно понимать Израиль как Его народ. Однако еврейский местоименный суффикс формально допускает отнесение к Давиду, и эта неоднозначность сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной повествовательной интонацией. Имя Яхве передано прямо; синтаксис близок к еврейскому оригиналу без неестественной кальки.
