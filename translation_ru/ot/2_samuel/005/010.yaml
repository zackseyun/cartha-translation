  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: ru
  text: И Давид всё больше возвышался[a], и Яхве, Бог Воинств, был с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «становился всё более великим». Еврейское выражение подчёркивает непрерывное возрастание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: всё больше возвышался
  rationale: Сочетание личной формы הלך с абсолютным инфинитивом הָלוֹךְ и последующим וְגָדוֹל выражает непрерывное усиление или возрастание. Русская конструкция передаёт поступательный характер возвышения Давида без неестественного буквального «шёл, идя и возрастая».
- source_word: דָּוִד
  choice: Давид
  rationale: Устоявшаяся русская форма личного имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог Воинств
  rationale: צְבָאוֹת обозначает воинства или множества сил. «Бог Воинств» сохраняет широту еврейского титула, не ограничивая его только земными либо только небесными войсками.
- source_word: עִמּוֹ
  choice: был с ним
  rationale: Прямая и естественная передача сопровождения и благосклонного присутствия Бога при Давиде с сохранением местоимения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: войск; небесных воинств
  rationale: Исходное слово не уточняет здесь, имеются ли в виду исключительно земные или небесные силы. «Воинств» сохраняет эту смысловую широту.
- issue: Характер возвышения Давида
  choice: всё больше возвышался
  alternative: становился всё более великим; всё более усиливался
  rationale: Фраза описывает продолжающееся возрастание положения или могущества Давида, не уточняя лишь одну сторону его величия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возвышался» естественно передаёт рост положения и могущества Давида; форма «Бог Воинств» сохраняет традиционную широту титула без излишнего уточнения.
