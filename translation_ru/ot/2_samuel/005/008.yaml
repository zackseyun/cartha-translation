base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: ru
  text: 'И сказал Давид в тот день: «Кто поразит иевусеев, доберётся до водного прохода[a] и поразит хромых и слепых, которых ненавидит душа Давида...» Поэтому говорят[b]: «Слепой и хромой не войдут в дом[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до водовода», «до желоба» или «до шахты». Точное значение еврейского слова неизвестно; вероятно, оно обозначает часть городской водной системы.'
    reason: lexical_alternative
  - marker: b
    text: Синтаксис предшествующей фразы в еврейском тексте труден. Некоторые понимают слова «хромые и слепые» как часть насмешки иевусеев, приведённой в предыдущем стихе, а не как объект призыва Давида.
    reason: alternative_reading
  - marker: c
    text: 'Или: «во дворец»; в данном контексте слово «дом» может обозначать царскую резиденцию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Кто поразит иевусеев
  rationale: Сочетание כָּל с причастием передаёт неопределённый призыв «кто (всякий, кто)…»; יְבֻסִי имеет собирательное значение, поэтому употреблено множественное число.
- source_word: וְיִגַּע בַּצִּנּוֹר
  choice: и доберётся до водного прохода
  rationale: נגע здесь естественно означает «достичь, добраться», а не обязательно «ударить». Значение צִנּוֹר не вполне ясно; «водный проход» указывает на вероятную связь с системой водоснабжения, не утверждая точного устройства сооружения.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: а также до хромых и слепых
  rationale: Предлог «до» восполняется из предыдущего оборота ради читаемости, но трудная связь слов сохраняется. Частица אֵת допускает понимание этой группы как объекта действия; иной синтаксический разбор отмечен в сноске.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: которых ненавидит душа Давида
  rationale: Сохранён буквальный и напряжённый образ «душа Давида», а множественное «которых» согласовано с предшествующими группами.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Поэтому говорят
  rationale: Безлично-неопределённое русское выражение естественно передаёт неопределённый субъект еврейского глагола и вводит устойчивое изречение.
- source_word: עִוֵּר וּפִסֵּחַ לֹא יָבוֹא אֶל הַבָּיִת
  choice: Слепой и хромой не войдёт в дом
  rationale: Сохранены единственное число и общий, пословичный характер еврейской формулы. «Дом» оставляет открытым вопрос, идёт ли речь об обычном доме или царской резиденции.
theological_decisions:
- issue: К кому относятся слова «хромые и слепые» и как понимать ненависть Давида
  choice: Сохранить трудную формулировку масоретского текста и прямое упоминание ненависти души Давида, не смягчая её.
  alternative: Понять «хромых и слепых» как продолжение насмешки иевусеев из предыдущего стиха или перефразировать так, чтобы не приписывать ненависть Давиду.
  rationale: Синтаксис стиха сжат и неоднозначен. Перевод не должен превращать спорное толкование в основной текст и не распространяет эту фразу на общее богословское учение о людях с инвалидностью или о доступе в святилище.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Незавершённость прямой речи отмечена многоточием, поскольку еврейская фраза представляет собой сжатый вызов без явно выраженной главной части. Сохранены резкость и неоднозначность исходного текста.
