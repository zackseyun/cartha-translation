lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד в военном контексте означает овладеть укреплённым местом; «захватил» естественно и точно передаёт завершённое действие.
- source_word: וַ
  choice: Но
  rationale: Последовательный союз продолжает повествование и в данном контексте выражает лёгкое противопоставление самоуверенной речи иевусеев в предыдущем стихе.
- source_word: מְצֻדַת
  choice: крепость
  rationale: Существительное מצודה обозначает укреплённое, защищённое место. «Крепость» понятно современному читателю и не уточняет архитектурный тип сверх исходного текста.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Передано в принятой русской форме библейского топонима.
- source_word: הִיא
  choice: это
  rationale: Самостоятельное местоимение связывает два обозначения одного места; русское «это» естественно передаёт пояснительное отождествление.
- source_word: עִיר דָּוִד
  choice: город Давида
  rationale: Конструкция сопряжённого состояния прямо обозначает город, связанный с Давидом; традиционная русская форма остаётся ясной и естественной.
