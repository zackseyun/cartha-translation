base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: ru
  text: Когда филистимляне услышали, что Давида помазали царём над Израилем, все филистимляне поднялись, чтобы разыскать Давида. Давид услышал об этом и спустился в крепость[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укреплённое место». Еврейское слово обозначает укреплённое, защищённое место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Общепринятое в русском библейском и литературном употреблении название этого народа.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного филистимлянами.
- source_word: מָשְׁחוּ
  choice: помазали
  rationale: Глагол означает ритуальное помазание; русская конструкция передаёт предшествующее событие без необходимости вводить специальную форму давнопрошедшего времени.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: Сохраняет значение поставления Давида царём и выраженную предлогом עַל власть над Израилем.
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Передаёт буквальное пространственное значение עלה, не добавляя прямо не выраженного значения военного похода.
- source_word: כָל פְּלִשְׁתִּים
  choice: все они
  rationale: Сохраняет всеохватность כָל, а местоимение естественно избегает тяжёлого повтора названия народа в одном русском предложении.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: чтобы разыскать Давида
  rationale: Передаёт целевую конструкцию и намеренный поиск, не конкретизируя подразумеваемую враждебную цель как пленение или убийство.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Давид услышал об этом
  rationale: Дополнение в еврейском подразумевается контекстом; «об этом» делает русскую фразу естественной.
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохраняет пространственное значение глагола ירד.
- source_word: הַמְּצוּדָה
  choice: укрепление
  rationale: Нейтрально передаёт укреплённое и защищённое место, не уточняя его архитектурный тип сверх сказанного в тексте.
