  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ כֵּ֔ן כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָ֑ה וַ/יַּךְ֙ אֶת פְּלִשְׁתִּ֔ים מִ/גֶּ֖בַע עַד בֹּאֲ/ךָ֥ גָֽזֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: ru
  text: Давид сделал так, как повелел ему Яхве, и разбил филистимлян от Гевы[a] до подступов к Газеру[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Масоретский текст: «от Гевы». В некоторых переводах здесь встречается другое название места, в том числе под влиянием параллельного места в 1 Паралипоменон 14:16.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «до твоего прихода к Газеру», то есть до подхода к Газеру или его окрестностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: сделал так
  rationale: Естественно передаёт еврейское сочетание со значением исполнения ранее данного указания, сохраняя краткость повествования.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: как повелел ему
  rationale: Передаёт точное соответствие действий Давида повелению, не добавляя отсутствующего в тексте толкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיַּךְ
  choice: разбил
  rationale: В военном контексте глагол נכה обозначает нанесение поражения; «разбил» звучит естественно и передаёт итог сражения без архаизма.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Общепринятое русское название этого народа.
- source_word: מִגֶּבַע
  choice: от Гевы
  rationale: Следует масоретскому тексту, в котором назван город Гева (גבע), не гармонизируя чтение с параллельным местом.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: до подступов к Газеру
  rationale: Сохраняет пространственный смысл идиомы — до подхода к городу или его окрестностей — и несколько точнее отражает בֹּאֲךָ, чем простое «до Газера».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. «Повелел» сохраняет достоинство библейского регистра, не звуча архаично; «разбил» естественно передаёт военный контекст. Сноски поставлены при тех выражениях, к которым они относятся.
