  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: ru
  text: Давид поселился в крепости и назвал её Городом Давида. Давид строил вокруг, от Милло[a] вглубь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от Милло и внутрь» или «от Милло к внутренней части города». Милло, вероятно, было известным сооружением, насыпью или системой террас в Иерусалиме; точный характер этого объекта неизвестен.'
    reason: Сохраняет спорность значения «Милло» и синтаксико-топографическую неопределённость выражения «от Милло … вглубь».
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Глагол ישב может означать «жить, обитать, поселиться». В данном повествовательном контексте речь идёт о том, что Давид устроил свою резиденцию в захваченной крепости; «поселился» передаёт это естественно и без архаизма.
- source_word: בַּמְּצֻדָה
  choice: в крепости
  rationale: מְצֻדָה обозначает укреплённое, защищённое место. «Крепость» — ясный и естественный русский эквивалент.
- source_word: וַיִּקְרָא לָהּ
  choice: назвал её
  rationale: Конструкция קרא ל выражает именование. По-русски «назвал её» естественнее буквального «призвал ей имя» и точно передаёт смысл.
- source_word: עִיר דָּוִד
  choice: Городом Давида
  rationale: Это устойчивое топонимическое обозначение; прописная буква показывает, что речь идёт о названии места.
- source_word: וַיִּבֶן
  choice: застроил
  rationale: Основное значение בנה — «строить». В сочетании с סָבִיב русское «застроил всё вокруг» естественно передаёт строительные работы на окружающей территории, не добавляя более узкого смысла «укрепил» или «перестроил».
- source_word: סָבִיב
  choice: всё вокруг
  rationale: סָבִיב указывает на окружающее пространство; сочетание «всё вокруг» передаёт полноту охвата и звучит естественно.
- source_word: מִן הַמִּלּוֹא
  choice: от Милло
  rationale: 'Точное значение מִלּוֹא здесь спорно: вероятно, это название известного сооружения, насыпи или системы террас в Иерусалиме. Транслитерация сохраняет неопределённость исходного текста.'
- source_word: וָבָיְתָה
  choice: и внутрь
  rationale: Направительная форма, вероятнее всего, означает движение к внутренней части города. Перевод сохраняет пространственный смысл и союз, не отождествляя выражение с каким-либо конкретным зданием.
