base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: ru
  text: Все старейшины Израиля пришли в Хеврон к царю, и царь Давид заключил с ними завет[a] в Хевроне перед Яхве[b], и они помазали Давида царём над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассёк завет» — еврейское устойчивое выражение со значением «заключил завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в присутствии Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Форма повествовательной последовательности от בוא обозначает прибытие; направление к Хеврону выражено далее.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: все старейшины Израиля
  rationale: Передаёт полноту, выраженную כָּל, и собирательное обозначение руководителей Израиля.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: к царю в Хеврон
  rationale: Направительное окончание в חֶבְרוֹנָה указывает на движение в Хеврон; по-русски естественно сказать, что старейшины пришли туда к царю.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: заключил ... завет
  rationale: Это устойчивое еврейское выражение, буквально «рассёк завет»; русский оборот «заключить завет» ясно передаёт его смысл и сохраняет торжественную силу בְּרִית.
- source_word: לָהֶם
  choice: с ними
  rationale: В сочетании с выражением «заключить завет» дательный предлог обозначает другую сторону завета и естественно передаётся как «с ними».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет формальную обстановку заключения завета и передаёт личное имя יהוה транслитерацией; возможный смысл «в присутствии Яхве» отмечен в сноске.
- source_word: וַיִּמְשְׁחוּ
  choice: помазали
  rationale: В контексте поставления царя משׁח обозначает обряд помазания, а не общее посвящение.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: Творительный предикативный падеж естественно выражает поставление Давида царём, а «над Израилем» сохраняет значение עַל.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Естественная русская передача еврейского сочетания титула и имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога в соответствии с исходным текстом и не подменяет его титулом.
- issue: Заветная лексика בְּרִית
  choice: завет
  alternative: договор
  rationale: «Завет» сохраняет религиозную, политическую и торжественную весомость данного союза, заключённого пред Яхве.
- issue: Значение לִפְנֵי יהוה
  choice: пред Яхве
  alternative: в присутствии Яхве
  rationale: Краткая формула близка к структуре оригинала и сохраняет возможные оттенки свидетельства и присутствия, не сводя выражение только к одному из них.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Форма «пред» выбрана как естественная для торжественной заветной сцены, без чрезмерной архаизации. Маркеры сносок поставлены непосредственно после выражений, которые они поясняют.
