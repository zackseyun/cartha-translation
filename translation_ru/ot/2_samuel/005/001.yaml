  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: ru
  text: 'Тогда все колена Израиля пришли к Давиду в Хеврон[a] и сказали: «Вот, мы — твоя кость и твоя плоть[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская форма названия «Хеврон» имеет окончание, указывающее направление: «в Хеврон».'
    reason: lexical_alternative
  - marker: b
    text: «Кость и плоть» — древнееврейское выражение близкого кровного родства или общей семейной принадлежности.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Тогда … пришли
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт развитие событий, а «пришли» — обычное значение בוא.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: все колена Израиля
  rationale: Сохраняет собирательный общенациональный смысл и традиционное, но понятное русское обозначение племён Израиля.
- source_word: אֶל דָּוִד חֶבְרוֹנָה
  choice: к Давиду в Хеврон
  rationale: אֶל выражает движение к Давиду, а направительное окончание в חֶבְרוֹנָה — движение в Хеврон; русская конструкция естественно передаёт оба отношения.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: и сказали
  rationale: Обычная древнееврейская формула введения прямой речи передана без неестественного удвоения «сказали, говоря».
- source_word: הִנּוּ
  choice: Вот
  rationale: Частица привлекает внимание к следующему утверждению; «вот» сохраняет её указательно-эмфатическую функцию и соответствует современному литературному регистру.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: твоя кость и твоя плоть
  rationale: Буквальное воспроизведение сохраняет порядок образов и выраженную в метафоре кровную близость, не сводя формулу лишь к политическому союзу.
- source_word: אֲנָחְנוּ
  choice: мы —
  rationale: В именном древнееврейском предложении связка подразумевается; в русском настоящем времени её естественно передаёт нулевая связка с тире.
theological_decisions:
- issue: Родственная формула и её политико-богословская сила
  choice: «мы — твоя кость и твоя плоть»
  alternative: «мы — твой народ»; «мы — твои родственники»
  rationale: Буквальная образность сохраняет одновременно кровное родство, общую идентичность Израиля и основание признания царской власти Давида, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Колена» и «плоть» сохранены как понятные в библейском контексте слова; синтаксис прямой и естественный. Маркеры примечаний поставлены при тех выражениях, которые они поясняют.
