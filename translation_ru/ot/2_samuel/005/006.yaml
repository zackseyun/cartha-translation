base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: ru
  text: 'Царь и его люди пошли в Иерусалим, к иевусеям, жителям той земли. Иевусеи сказали Давиду[a]: «Тебе сюда не войти: тебя остановят даже слепые и хромые»[b], — говоря: «Давиду сюда не войти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «и он сказал Давиду». Единственное число, вероятно, имеет собирательное значение и относится к иевусеям.'
    reason: Глагол וַיֹּאמֶר стоит в единственном числе, хотя по контексту речь произносят иевусеи.
  - marker: b
    text: 'Еврейская фраза трудна. Возможен более буквальный перевод: «если только ты не уберёшь слепых и хромых». По смыслу это, вероятно, насмешка: иевусеи считали город настолько неприступным, что Давида могли бы остановить даже слепые и хромые.'
    reason: Синтаксис כִּי אִם הֱסִירְךָ допускает разные способы разбора; сноска сохраняет реальную неоднозначность и точнее передаёт условно-исключительное значение כִּי אִם.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное повествовательное значение глагола הלך; военный оттенок следует из контекста, но сам глагол не требует перевода «выступил в поход».
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: царь со своими людьми
  rationale: Сохраняет широкое значение אֲנָשָׁיו и не сужает его обязательно до «воинов».
- source_word: אֶל הַיְבֻסִי
  choice: к иевусеям
  rationale: אֶל прежде всего обозначает направленность «к»; единственное число этнонима имеет собирательное значение. Враждебность ситуации ясна из контекста без добавления «против».
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: жившим в той земле
  rationale: Причастие в единственном числе согласуется с собирательным этнонимом; русский перевод естественно передаёт его множественным числом.
- source_word: וַיֹּאמֶר לְדָוִד
  choice: И Давиду сказали
  rationale: Безлично-множественная русская конструкция передаёт коллективного говорящего по контексту, не скрывая полностью того, что еврейская глагольная форма стоит в единственном числе; это отмечено в сноске.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Тебе сюда не войти
  rationale: Инфинитивная русская конструкция естественно передаёт уверенную, насмешливую угрозу применительно к укреплённому городу.
- source_word: כִּי אִם הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: тебя прогонят даже слепые и хромые
  rationale: 'Контекстуально передаёт насмешку и допускаемое строением формы הֱסִירְךָ понимание Давида как объекта: город якобы настолько неприступен, что его смогут отразить даже слепые и хромые. Грамматическая трудность отражена в сноске.'
- source_word: לֵאמֹר לֹא יָבוֹא דָוִד הֵנָּה
  choice: 'говоря: «Давиду сюда не войти»'
  rationale: Сохраняет повтор, вводимый вторым לֵאמֹר, и его риторическую функцию.
theological_decisions:
- issue: Упоминание слепых и хромых в оскорбительной насмешке
  choice: Сохранить конкретные слова «слепые и хромые» как речь иевусеев
  alternative: 'Передать обобщённо: «даже самые слабые среди нас»'
  rationale: Текст сообщает враждебную насмешку, а не даёт богословскую оценку людям с инвалидностью. Обобщающая замена скрыла бы образность и резкость еврейского текста.
- issue: Кто прогоняет или удаляет кого в трудной еврейской фразе
  choice: 'В основном тексте понять Давида как объект: «тебя прогонят даже слепые и хромые»'
  alternative: «пока ты не уберёшь слепых и хромых»
  rationale: Выбранное прочтение лучше передаёт очевидную по контексту хвастливую насмешку и допускается формой с местоименным суффиксом; альтернативная синтаксическая трактовка остаётся открытой в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формула «тебе сюда не войти» звучит естественно и передаёт вызывающую уверенность осаждённых. Этноним дан в традиционной русской библейской форме «иевусеи».
