  source_fidelity: 'Основной смысл передан верно: царь с людьми направляется к Иерусалиму, иевусеи насмешливо заявляют, что Давид не сможет войти. Однако «к Иерусалиму» в современном русском чаще означает лишь движение в направлении города; в данном контексте естественнее и точнее «в Иерусалим». Трудная фраза о слепых и хромых удачно передана как насмешка, но сноска должна точнее формулировать альтернативное буквальное прочтение: «если только ты не уберёшь...», а не «пока ты не уберёшь...».'
