  yaml_path: translation/ot/2_samuel/005/022.yaml
  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: ru
  text: И филистимляне снова поднялись и расположились по долине Рефаим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развернулись в долине»; возможен также смысл «рассеялись по долине». Еврейский глагол, вероятно, означает, что филистимляне заняли позиции по всей долине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: снова поднялись
  rationale: Сочетание יסף с עוֹד и инфинитивом выражает повторение действия. «Снова поднялись» естественно передаёт как повторный поход, так и значение עלה — движение вверх, вероятно к Иудейскому нагорью.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское обозначение этого народа.
- source_word: וַיִּנָּטְשׁוּ
  choice: расположились по
  rationale: В данном военном контексте глагол, вероятно, описывает развёртывание войск и занятие позиций на пространстве долины, а не буквальное «оставление» или беспорядочное рассеивание.
- source_word: בְּעֵמֶק רְפָאִים
  choice: по долине Рефаим
  rationale: Предлог «по» естественно сочетается с описанием войск, занявших пространство долины; имя места передано традиционной транслитерацией.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. «Поднялись» сохраняет пространственный оттенок древнееврейского глагола, а «расположились по долине» ясно передаёт вероятный военный смысл, не устраняя лексическую неоднозначность, отмеченную в сноске.
