lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: Елишама
  rationale: Личное имя передано принятой русской библейской формой. Начальный союз ו не воспроизводится отдельно, поскольку в естественном русском перечислении перед первым именем этого фрагмента он избыточен и связь с предыдущим стихом сохраняется пунктуационно.
- source_word: וְ/אֶלְיָדָע
  choice: Елиада
  rationale: Личное имя транслитерировано в традиционной русской библейской форме; союз ו передан русским союзом «и» перед последним членом перечисления.
- source_word: וֶ/אֱלִיפָלֶט
  choice: Елифелет
  rationale: Еврейское личное имя передано традиционной русской формой «Елифелет», без перевода его этимологического значения.
