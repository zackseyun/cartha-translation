  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: ru
  text: 'И спросил Давид у Яхве, и Он сказал: «Не поднимайся. Обойди их с тыла и подойди к ним напротив деревьев бака[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бальзамовых деревьев»; по традиции — «тутовых деревьев». Точный вид дерева, обозначенного еврейским словом, неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: спросил ... у Яхве
  rationale: Сочетание שׁאל с ב указывает на обращение к Яхве за указанием; «спросил у» естественно по-русски и сохраняет форму исходного выражения.
- source_word: לֹא תַעֲלֶה
  choice: Не поднимайся
  rationale: Отрицание с имперфектом выражает запрет; עלה буквально означает движение вверх, а в военном контексте — выступление или наступление. Краткая форма сохраняет образ и силу повеления.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: Обойди их с тыла
  rationale: Фраза предписывает обходной манёвр к задней стороне неприятеля; перевод естественно передаёт тактический смысл.
- source_word: וּבָאתָ לָהֶם
  choice: подойди к ним
  rationale: בוא с ל здесь обозначает приближение к противнику. «Подойди к ним» сохраняет пространственный смысл, не усиливая его до прямо названной атаки.
- source_word: מִמּוּל
  choice: со стороны
  rationale: ממול обозначает положение напротив или перед чем-либо. В сочетании с деревьями и описанием манёвра «со стороны» ясно передаёт направление подхода, хотя буквальное пространственное значение отмечено в решении.
- source_word: בְּכָאִים
  choice: деревьев бака
  rationale: Точный вид растения неизвестен. Транслитерация не создаёт ложной ботанической определённости; вероятные традиционные отождествления вынесены в примечание.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. «Яхве» передаёт его как имя и не заменяет титулом.
- issue: Кто говорит после вопроса Давида
  choice: Он сказал
  alternative: Яхве сказал
  rationale: В еврейском тексте субъект глагола ויאמר подразумевается и естественно относится к Яхве. Местоимение сохраняет структуру текста без лишнего повторения имени.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формой. Военная команда передана ясно, без архаизмов и без избыточного истолкования; неопределённость названия дерева сохранена.
