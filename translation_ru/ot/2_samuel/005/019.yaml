base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: ru
  text: 'Давид вопросил Яхве: «Выступить ли мне против филистимлян? Отдашь ли Ты их в мои руки[a]?» Яхве ответил Давиду: «Выступай, потому что Я непременно отдам филистимлян в твои руки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дашь ли Ты их в мою руку?» Этот еврейский оборот означает отдать врага под чью-либо власть, то есть даровать над ним победу.'
    reason: Пояснение еврейской идиомы и её буквального образа.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: вопросил Яхве
  rationale: Глагол שׁאל с предлогом ב в данном контексте означает обращение к Богу за указанием. «Вопросил» передаёт это значение в достойном библейском регистре, не уточняя не названный в тексте способ получения ответа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменено титулом.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: выступить ли мне / выступай
  rationale: עלה буквально означает «подниматься, идти вверх», но в военном контексте обозначает выступление против неприятеля. Одинаковый корень передан повтором одного русского глагола.
- source_word: אֶל־פְּלִשְׁתִּים
  choice: против филистимлян
  rationale: Предлог אֶל буквально указывает направление, однако военный контекст требует в русском языке значения враждебного движения — «против».
- source_word: הֲתִתְּנֵם ... בְּיָדִי
  choice: отдашь ли Ты их в мои руки
  rationale: Сохранён образ распространённого еврейского оборота «дать в руку», означающего передать под власть и даровать победу.
- source_word: כִּי נָתֹן אֶתֵּן
  choice: потому что Я непременно отдам
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола выражает усиленную уверенность; её передаёт наречие «непременно».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Способ вопрошания Бога
  choice: не уточнять способ
  alternative: истолковать как обращение через священника, эфод или жребий
  rationale: Текст сообщает, что Давид вопросил Яхве, но не называет посредника или ритуальный способ; перевод не вводит отсутствующих подробностей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён по сравнению с буквальным «говоря», которое в русском здесь избыточно. Заглавное «Ты» употреблено как традиционная форма почтительного обращения к Богу; смысловой неоднозначности это не создаёт.
