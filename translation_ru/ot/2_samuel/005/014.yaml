lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Сочетание союза с указательным местоимением вводит перечень. Русское «вот» естественно передаёт эту представительную функцию; отдельное «и» здесь стилистически необязательно.
- source_word: שְׁמוֹת
  choice: имена
  rationale: Форма множественного числа в сопряжённом состоянии непосредственно вводит следующий перечень имён.
- source_word: הַיִּלֹּדִים
  choice: тех, кто родился
  rationale: Субстантивированное страдательное причастие буквально обозначает «рождённых». Формулировка не добавляет отсутствующего в самой форме существительного «сыновья» или «дети» и естественно звучит по-русски.
- source_word: לוֹ
  choice: у него
  rationale: В данном обороте предлог обозначает родительское отношение. По-русски «родился у него» естественно передаёт смысл «был рождён ему».
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места рождения.
- source_word: שַׁמּוּעַ
  choice: Шаммуа
  rationale: Транслитерация еврейского личного имени с сохранением удвоенного согласного, отражённого дагешем.
- source_word: שׁוֹבָב
  choice: Шовав
  rationale: Прямая русская транслитерация еврейского личного имени.
- source_word: נָתָן
  choice: Нафан
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Устоявшаяся русская библейская форма имени.
