  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: ru
  text: Когда услышишь шум шагов в верхушках бальзамовых деревьев[a], тогда действуй решительно, потому что в тот час Яхве уже выступил перед тобой, чтобы поразить стан филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деревьев бака»; точный вид дерева, названного в еврейском тексте, неизвестен. По традиции также переводят: «тутовых деревьев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Когда услышишь
  rationale: Оборот с היה и инфинитивом с ב задаёт будущее временное условие; по-русски естественно передаётся придаточным времени.
- source_word: קוֹל צְעָדָה
  choice: шум шагов
  rationale: קוֹל означает слышимый звук или шум, а צְעָדָה — шагание; сочетание сохраняет образ шагов, слышимых как знак движения войска.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: над верхушками бальзамовых деревьев
  rationale: רָאשֵׁי — верхушки; точный вид дерева הַבְּכָאִים неизвестен. «Бальзамовые деревья» — вероятное, но не бесспорное обозначение, поэтому неопределённость отмечена сноской.
- source_word: אָז תֶּחֱרָץ
  choice: тогда действуй решительно
  rationale: חרץ в данном контексте выражает энергичное и решительное действие по получении знака, а не только быстроту.
- source_word: כִּי אָז יָצָא
  choice: потому что в тот час ... выйдет
  rationale: כִּי вводит основание приказа, а перфект יָצָא в будущей временной ситуации естественно передаётся русским будущим временем; «в тот час» связывает Божье выступление с услышанным знаком.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Выражает, что Яхве выступает впереди Давида и предваряет его в сражении.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: чтобы поразить стан филистимлян
  rationale: נכה в военном контексте значит «поразить», а מַחֲנֶה буквально обозначает стан или военный лагерь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Временная форма יָצָא применительно к Божьему действию
  choice: выйдет
  alternative: уже вышел; выходит
  rationale: Хотя еврейский перфект может представлять действие как совершившееся, весь оборот описывает будущий знак и последующее действие Давида. Русское будущее сохраняет эту перспективу, не утверждая, что выступление произошло раньше самого знака.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Стан» сохраняет военный образ и остаётся понятным; синтаксис сделан ясным и пригодным для публичного чтения.
