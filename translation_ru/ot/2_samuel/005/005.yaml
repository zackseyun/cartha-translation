base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: ru
  text: В Хевроне он царствовал над Иудой семь лет и шесть месяцев, а в Иерусалиме царствовал тридцать три года над всем Израилем и Иудой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: В Хевроне
  rationale: Предлог בְּ обозначает место; форма «в Хевроне» естественна для современного русского языка.
- source_word: מָלַךְ
  choice: царствовал
  rationale: В данном контексте форма глагола подводит итог продолжительности правления, а не обозначает момент восшествия на престол.
- source_word: עַל יְהוּדָה
  choice: над Иудой
  rationale: Сочетание עַל с מָלַךְ указывает на народ или область, которыми правил царь; «над Иудой» точно передаёт эту связь.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: семь лет и шесть месяцев
  rationale: Прямое и естественное воспроизведение указанной продолжительности.
- source_word: וּבִירוּשָׁלַם
  choice: а в Иерусалиме
  rationale: Союз וְ здесь естественно передаётся русским противопоставительно-сопоставительным «а», поскольку сопоставляются два места и периода царствования.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: тридцать три года
  rationale: Нормальная современная русская форма составного числительного.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: над всем Израилем и Иудой
  rationale: Перевод сохраняет упоминание обеих частей царства и политическое различение Израиля и Иуды в еврейском тексте.
