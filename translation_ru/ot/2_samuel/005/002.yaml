base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: ru
  text: 'И прежде[a], когда Саул был царём над нами, именно ты выводил Израиль и вводил его[b]. И Яхве сказал тебе: «Ты будешь пасти Мой народ Израиль и будешь правителем[c] над Израилем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и вчера, и третьего дня»; это еврейское выражение означает «прежде», «уже некоторое время».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выводил Израиль и вводил его». Это еврейское выражение означает руководство народом в его делах, особенно во время военных походов.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вождём». Еврейское слово здесь отличается от обычного слова «царь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: И прежде
  rationale: Еврейское выражение буквально означает «и вчера, и третьего дня», но идиоматически указывает на прежнее время. «И прежде» естественно передаёт этот смысл и связывает стих с предыдущим контекстом.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: когда Саул был царём над нами
  rationale: Предлог ב при инфинитиве образует временное придаточное; формулировка прямо и естественно передаёт синтаксис оригинала.
- source_word: אַתָּה
  choice: именно ты
  rationale: Самостоятельное местоимение имеет эмфатическую функцию; «именно ты» сохраняет противопоставительный акцент.
- source_word: הַמּוֹצִיא וְהַמֵּבִיא אֶת־יִשְׂרָאֵל
  choice: выводил Израиль и приводил его обратно
  rationale: Сохранён конкретный образ двух глаголов, который в данном контексте обозначает руководство народом, особенно в военных походах. «Обратно» делает вторую половину понятной по-русски, не устраняя образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, а не заменено титулом «Господь».
- source_word: תִרְעֶה
  choice: будешь пасти
  rationale: Глагол רעה выражает пастырскую метафору царского руководства. Буквальное «пасти» сохраняет её богословскую и литературную выразительность.
- source_word: נָגִיד
  choice: правителем
  rationale: נָגִיד обозначает поставленного вождя или правителя и отличается от обычного слова «царь». «Правитель» ясно передаёт функцию, сохраняя это различие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит Тетраграмматон, поэтому личное имя передано транслитерацией «Яхве», без замены титулом.
- issue: Пастырская метафора царской власти в תִרְעֶה
  choice: Ты будешь пасти Мой народ Израиль
  alternative: Ты будешь править Моим народом Израилем; Ты будешь заботиться о Моём народе Израиле
  rationale: Оригинал намеренно описывает правление как пастырство; сохранение метафоры не сводит смысл к административной власти и не устраняет её богословское напряжение.
- issue: Различие между נָגִיד и מֶלֶךְ
  choice: правителем
  alternative: вождём; князем; царём
  rationale: «Правитель» не смешивает נָגִיד с употреблённым ранее словом «царь» и не придаёт термину узкого наследственно-монархического значения современного слова «князь».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён до естественного русского порядка слов, но сохранены эмфаза «именно ты», пастырская метафора и различие между «царём» и «правителем». Местоимение «Мой» написано с прописной буквы в соответствии с устойчивой русской религиозно-издательской практикой.
