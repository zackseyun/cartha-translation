lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: Давиду было тридцать лет
  rationale: Буквально «сын тридцати лет»; это обычное древнееврейское обозначение возраста, естественно передаваемое по-русски конструкцией «было тридцать лет».
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Предлог ב при инфинитиве constructus מלך с местоименным суффиксом задаёт время вступления Давида на царство; выбранная формулировка естественна по-русски и сохраняет смысл формулы о начале правления.
- source_word: מָלָךְ
  choice: царствовал он
  rationale: Глагол מלך означает осуществлять царскую власть, царствовать. Инверсия сохраняет ясность подлежащего и придаёт фразе достоинство без архаизации.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямое обозначение продолжительности царствования.
- source_word: דָּוִד
  choice: Давид
  rationale: Традиционная и общепринятая русская форма личного имени.
