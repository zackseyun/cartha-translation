  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: ru
  text: 'И сказал царь Садоку: «Верни ковчег Божий в город. Если я обрету благоволение в глазах Яхве, он вернёт меня и даст мне увидеть его и место его пребывания[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увидеть Его и место Его пребывания». Древнееврейские местоимения могут относиться к Богу, хотя ближайшее упомянутое существительное — «ковчег Божий».'
    reason: Альтернативное понимание местоименных отсылок в древнееврейском тексте.
lexical_decisions:
- source_word: הָשֵׁב
  choice: Верни
  rationale: Повелительная форма породы хифиль от שׁוב, обращённая к Садоку; «верни» естественно передаёт приказ отнести ковчег обратно.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Передаёт именно אֱלֹהִים («Бог»), не заменяя его именем Яхве; сочетание естественно для литературного русского языка.
- source_word: הָעִיר
  choice: в город
  rationale: Направление движения ясно из глагола возвращения; русский предлог «в» выражает его естественно.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Если я обрету благоволение в глазах Яхве
  rationale: Сохраняет образность устойчивого древнееврейского выражения и его личностно-реляционный оттенок, не сводя смысл к более толковательному «если я буду угоден».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וֶהֱשִׁבַנִי
  choice: он возвратит меня
  rationale: Хифиль от שׁוב с суффиксом первого лица означает, что Яхве даст Давиду вернуться; «возвратит меня» сохраняет каузативный смысл и связь с возвращением в город.
- source_word: וְהִרְאַנִי
  choice: и даст мне увидеть
  rationale: Естественно передаёт каузативную форму ראה («даст/позволит увидеть»), не утяжеляя фразу буквальным «покажет мне» с неясной конструкцией дополнений.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение мужского рода грамматически подходит русскому слову «ковчег» и одновременно сохраняет возможное отнесение к Богу.
- source_word: נָוֵהוּ
  choice: его обитель
  rationale: «Обитель» передаёт значение места пребывания, не уточняя его как храм, которого тогда ещё не было, и сохраняет неоднозначность местоименного отнесения.
theological_decisions:
- issue: К кому относятся слова אֹתוֹ וְאֶת־נָוֵהוּ («его и его обитель»)
  choice: В основном тексте сохранено двусмысленное «его и его обитель», допускающее ближайшее отнесение к ковчегу и месту его пребывания.
  alternative: Понять местоимения как указание на Бога и Его обитель.
  rationale: Ближайший грамматический антецедент — «ковчег Божий», но ковчег тесно связан с Божьим присутствием, поэтому древнееврейская формулировка допускает более богоцентричное прочтение. Русский текст и сноска сохраняют это напряжение, не разрешая его искусственно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Строчные местоимения в основном тексте намеренно сохраняют неоднозначность древнееврейской фразы; в альтернативном чтении сноски прописные буквы обозначают отнесение к Богу.
