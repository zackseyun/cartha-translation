  to: 'И сказал царь Садоку: «Верни ковчег Божий в город. Если я обрету благоволение в глазах Яхве, он вернёт меня и даст мне увидеть его и место его пребывания[a]».'
  rationale: 'Заменено «его обитель» на «место его пребывания»: такая формулировка естественна в современном литературном русском, не называет это место храмом и сохраняет как ближайшее отнесение к ковчегу, так и отмеченное в сноске возможное отнесение к Богу. «Возвратит меня» заменено на более естественное «вернёт меня» без изменения каузативного смысла.'
