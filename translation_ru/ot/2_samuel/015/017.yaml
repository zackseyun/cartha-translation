  yaml_path: translation/ot/2_samuel/015/017.yaml
  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: ru
  text: Царь вышел, и весь народ следовал за ним. Они остановились у последнего дома[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у дальнего дома»; возможно, это название места: «Бет-Мерхак». Еврейское выражение буквально можно понять как «дом отдалённости»; его также толкуют как «последний» или «крайний дом».'
    reason: Сохраняет буквальное, описательное и топонимическое понимания неоднозначного еврейского выражения, не выдавая ни одно из них за несомненное.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Форма глагола יצא в повествовании обозначает выход или отправление; «вышел» прямо и естественно передаёт движение царя из города.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное указывает в контексте на Давида; стандартное русское соответствие — «царь».
- source_word: וְכָל הָעָם
  choice: весь народ
  rationale: עָם обозначает сопровождавших царя людей в широком смысле; «народ» не сужает их состав до одного лишь войска.
- source_word: בְּרַגְלָיו
  choice: за ним пешком
  rationale: Буквально выражение означает «у его ног»; здесь оно описывает людей, сопровождающих царя, вероятно пешим ходом. «За ним пешком» сохраняет обе смысловые стороны идиомы.
- source_word: וַיַּעַמְדוּ
  choice: они остановились
  rationale: В контексте движения עמד означает остановиться или занять место; «остановились» естественно звучит в русском повествовании.
- source_word: בֵּית הַמֶּרְחָק
  choice: у дальнего дома
  rationale: Буквально сочетание связано с «домом отдалённости» и может обозначать удалённый дом. Перевод сохраняет исходный образ и не делает однозначным более толковательное значение «последний дом».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Разделение на два предложения устраняет неестественную перегрузку, а конструкция «за ним пешком» ясно передаёт идиому בְּרַגְלָיו. Сноска поставлена непосредственно при неоднозначном выражении, к которому относится.
