  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: ru
  text: 'Смотрите: я буду ждать[a] у переправ в пустыне[b], пока вы не пришлёте мне весть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я задержусь»; «я останусь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у переходов в пустыне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Смотрите
  rationale: Форма повелительного наклонения во множественном числе служит для привлечения внимания. «Смотрите» сохраняет прямоту обращения и остаётся естественным в повествовательной речи.
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение подчёркивает говорящего; в русском языке отдельное «я» перед сказуемым достаточно передаёт это ударение без тяжеловесного «я сам».
- source_word: מִתְמַהְמֵהַּ
  choice: буду ждать
  rationale: Причастная форма хитпаэля выражает намеренное промедление или пребывание на месте. В данном контексте Давид остаётся ждать известий, поэтому функциональное значение естественно передаётся как «буду ждать».
- source_word: בְּעַבְרוֹת
  choice: у переправ
  rationale: Множественное число обозначает места перехода, вероятнее всего броды или переправы. «У переправ» точно передаёт пространственное значение предлога и не требует уточнять способ перехода.
- source_word: הַמִּדְבָּר
  choice: в пустыне
  rationale: Слово обозначает пустынную, малонаселённую местность, а не обязательно песчаную пустыню. В современном русском библейском повествовании «пустыня» здесь ясно и привычно.
- source_word: עַד בּוֹא דָבָר
  choice: пока … не придёт весть
  rationale: דָבָר в контексте означает сообщение или известие. Оборот «придёт весть» сохраняет образ и краткость еврейской конструкции.
- source_word: מֵעִמָּכֶם
  choice: от вас
  rationale: Предложное сочетание указывает, что весть должна исходить от адресатов.
- source_word: לְהַגִּיד לִי
  choice: для меня
  rationale: Инфинитив נגד выражает цель — довести сообщение до Давида. «Весть для меня» естественно передаёт эту направленность, избегая неуклюжего буквального оборота «чтобы сообщить мне» после безличного «придёт весть».
