  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: ru
  text: 'Тогда царь сказал священнику Садоку: «Ты провидец?[a] Возвращайся в город с миром, а с вами — оба ваших сына: Ахимаас, твой сын, и Ионафан, сын Авиафара».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Видишь ли ты?» Еврейское выражение можно понять либо как обращение к Садоку как к провидцу, либо как вопрос о том, видит ли он.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹאֶה אַתָּה
  choice: Ты провидец?
  rationale: Форма הֲרֹאֶה допускает понимание רֹאֶה как обозначения провидца; вопросительная частица הֲ передана вопросительной конструкцией. Необычность выражения сохранена, поскольку еврейский текст неоднозначен.
- source_word: שֻׁבָה הָעִיר
  choice: Возвращайся … в город
  rationale: Императив שוב с направительным ה передаёт возвращение к месту назначения; по-русски естественно явно обозначить направление предлогом «в».
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Сохраняет прямое значение שָׁלוֹם и естественно выражает благополучное, мирное возвращение, не сужая смысл только до физической безопасности.
- source_word: שְׁנֵי בְנֵיכֶם אִתְּכֶם
  choice: с вами двое ваших сыновей
  rationale: 'Множественное число местоимений сохранено: речь охватывает Садока, Авиафара и их сыновей. Оборот оформлен по нормам современного русского языка.'
- source_word: אֲחִימַעַץ בִּנְךָ וִיהוֹנָתָן בֶּן־אֶבְיָתָר
  choice: твой сын Ахимаас и Ионафан, сын Авиафара
  rationale: Сохранены явные родственные обозначения и параллельное называние обоих сыновей; имена переданы в традиционной русской библейской форме.
theological_decisions:
- issue: Неоднозначность הֲרֹאֶה אַתָּה
  choice: Ты провидец?
  alternative: Ты ведь видишь? / Видишь ли?
  rationale: Контекст допускает как титул или характеристику Садока, так и вопрос о его способности видеть и понимать происходящее. Основной текст следует возможному субстантивированному значению, а альтернативное прочтение вынесено в сноску без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; тире вводит присоединённое указание о двух сыновьях. Архаизмы, конфессионально окрашенные добавления и снятие исходной неоднозначности избегаются.
