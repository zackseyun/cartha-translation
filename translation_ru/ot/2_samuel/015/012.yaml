base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: ru
  text: Когда Авессалом приносил жертвы, он послал за Ахитофелом[a], гилонянином, советником Давида, из его города — из Гило. Заговор становился всё сильнее[b], и людей на стороне Авессалома становилось всё больше[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послал Ахитофела». Еврейский глагол допускает такой более буквальный перевод, однако отсутствие указанного места назначения и общий контекст указывают, вероятнее всего, на то, что Авессалом велел вызвать Ахитофела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заговор креп» или «замысел становился сильнее».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «народ шёл и умножался с Авессаломом» — оборот, обозначающий, что к Авессалому присоединялось всё больше людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал за
  rationale: При прямом дополнении, обозначающем человека, и без указанного места назначения глагол в данном контексте естественно понимать как посылку людей с целью вызвать Ахитофела; русское «послал за» передаёт это без лишнего уточнения.
- source_word: הַגִּלֹנִי
  choice: гилонянин
  rationale: Оттопонимическое обозначение жителя или уроженца Гило; традиционная и естественная русская форма.
- source_word: יוֹעֵץ דָּוִד
  choice: советник Давида
  rationale: Конструкция выражает служебное отношение Ахитофела к Давиду; «советник» сохраняет политический смысл роли.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: из его города Гило
  rationale: Переданы и принадлежность города Ахитофелу, и его название; приложение оформлено естественно для современного русского языка.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: когда Авессалом приносил жертвы
  rationale: Предлог с инфинитивом указывает на одновременность действий. Повтор имени устраняет случайную русскую двусмысленность относительно совершающего жертвоприношение, тогда как суффикс в еврейском контексте относится к Авессалому.
- source_word: הַקֶּשֶׁר
  choice: заговор
  rationale: В контексте организованного восстания Авессалома слово обозначает политический заговор; «заговор» точно и нейтрально передаёт смысл.
- source_word: אַמִּץ
  choice: набирал силу
  rationale: В сочетании с וַיְהִי форма описывает развивающееся укрепление заговора, а не только статическое состояние.
- source_word: הָעָם הוֹלֵךְ וָרָב
  choice: людей ... становилось всё больше
  rationale: Еврейская конструкция выражает непрерывное увеличение числа сторонников; выбранная формулировка естественно передаёт длительность и нарастание.
- source_word: אֶת אַבְשָׁלוֹם
  choice: на стороне Авессалома
  rationale: Здесь אֶת выражает совместность или принадлежность к стороне Авессалома; перевод делает политическое присоединение понятным, не добавляя богословской интерпретации.
