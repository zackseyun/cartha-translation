lexical_decisions:
- source_word: וְהָיָה
  choice: И всякий раз… он
  rationale: Сочетание с последующим инфинитивным оборотом в повествовательном контексте описывает повторяющееся действие; русская конструкция «всякий раз… он» естественно передаёт этот узуальный смысл.
- source_word: בִּקְרָב אִישׁ
  choice: когда кто-нибудь подходил
  rationale: קרב обозначает приближение. Хотя אִישׁ буквально значит «мужчина, человек», здесь слово употреблено обобщённо; «кто-нибудь» естественно передаёт неопределённого посетителя без утверждения, что речь непременно только о мужчинах.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: чтобы поклониться ему
  rationale: Глагол обозначает телесный поклон или простирание как выражение почтения. «Поклониться» сохраняет жест и в русском контексте не требует узкорелигиозного понимания.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: он протягивал руку
  rationale: Оборот буквально описывает протягивание руки; несовершенный вид передаёт повторяемость действия.
- source_word: וְהֶחֱזִיק לוֹ
  choice: обнимал его
  rationale: Каузативная форма חזק с предлогом ל здесь означает схватить или удержать человека. В последовательности дружеских жестов перед поцелуем русское «обнимал» естественно выражает заключение человека в объятия, не придавая действию насильственного оттенка.
- source_word: וְנָשַׁק לוֹ
  choice: и целовал
  rationale: נשק прямо означает «целовать»; несовершенный вид соответствует повторяющемуся действию.
theological_decisions:
- issue: Характер поклона перед Авессаломом
  choice: «поклониться ему» с пояснением в сноске как жест почтения
  alternative: «пасть перед ним ниц» или религиозно окрашенное «поклоняться ему»
  rationale: В данном политико-социальном контексте השתחוה обозначает почтительный поклон или выражение верноподданнического уважения, не обязательно богослужебное поклонение. Перевод сохраняет сам жест, не разрешая неоднозначность чрезмерно узко.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повторяемость действий передана конструкцией «всякий раз» и глаголами несовершенного вида. Синтаксис плавный, без архаизмов.
