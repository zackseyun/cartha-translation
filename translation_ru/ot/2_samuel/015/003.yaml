base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: ru
  text: 'И Авессалом сказал ему: «Смотри, дело твоё хорошее и справедливое[a], но от царя нет никого, кто выслушал бы тебя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои доводы хороши и справедливы». Еврейское דָּבָר может означать «слово», «вопрос» или, в судебном контексте, «дело, притязание».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «но нет у тебя слушающего от царя», то есть человека, уполномоченного царём выслушать и разобрать дело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: И Авессалом говорил ему
  rationale: 'Последовательная форма продвигает повествование, а несовершенный вид «говорил» естественно передаёт повторявшееся действие, заданное контекстом: Авессалом так обращался к каждому приходившему на суд.'
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив служит для привлечения внимания; «смотри» звучит естественно и современно, сохраняя прямое обращение.
- source_word: דְבָרֶךָ
  choice: дело твоё
  rationale: У דָּבָר широкий диапазон значений — «слово», «вопрос», «дело»; в контексте обращения за судом «дело» передаёт юридический оттенок, не сводя выражение лишь к отдельному притязанию.
- source_word: טוֹבִים וּנְכֹחִים
  choice: хорошее и правое
  rationale: Сочетание сохраняет широкую положительную оценку טוֹב и значение правильности или справедливости у נָכֹחַ. Формы единственного числа согласованы по-русски со словом «дело».
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: но от царя нет никого, кто выслушал бы тебя
  rationale: Причастие שֹׁמֵעַ обозначает того, кто слушает, здесь — разбирает судебное дело; מֵאֵת הַמֶּלֶךְ указывает на исходящие от царя полномочия или представительство. Формулировка сохраняет образ «слушания» и остаётся естественной по-русски.
