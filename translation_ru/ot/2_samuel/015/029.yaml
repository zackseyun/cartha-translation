  text: Садок и Авиафар вернули ковчег Божий в Иерусалим и остались там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: отнесли… обратно
  rationale: 'Форма от שׁוב употреблена каузативно и имеет прямое дополнение «ковчег Божий»: священники возвратили его в Иерусалим. Выражение «отнесли обратно» естественно передаёт как действие переноса, так и возвращение.'
- source_word: צָדוֹק
  choice: Садок
  rationale: Традиционная русская библейская форма личного имени.
- source_word: וְאֶבְיָתָר
  choice: и Авиафар
  rationale: Традиционная русская библейская форма личного имени; союз сохранён.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Перевод точно сохраняет краткое выражение исходного текста и не добавляет отсутствующего здесь слова «завета».
- source_word: יְרוּשָׁלָם
  choice: в Иерусалим
  rationale: Предлог «в» естественно выражает направление движения, подразумеваемое глаголом и контекстом.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: и остались там
  rationale: В данном повествовательном контексте ישב обозначает дальнейшее пребывание в месте; «остались там» звучит современно и естественно.
