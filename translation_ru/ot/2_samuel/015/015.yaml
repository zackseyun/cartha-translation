lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: сказали
  rationale: Обычная повествовательная форма глагола אמר, вводящая прямую речь; простое прошедшее время естественно для русского рассказа.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: слуги царя
  rationale: В придворном контексте עבד обозначает состоящих на царской службе и зависимых от него людей; «слуги» сохраняет широкий смысл и не преувеличивает значение рабского статуса.
- source_word: אֶל הַמֶּלֶךְ
  choice: царю
  rationale: Русский дательный падеж естественно передаёт адресата речи без избыточного предлога.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: Как бы ни решил
  rationale: Оборот передаёт готовность принять любой избранный царём образ действий. «Решил» здесь естественно по-русски выражает контекстуальное значение выбора дальнейшего шага.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: мой господин царь
  rationale: Сохраняется почтительное придворное обращение и личная форма אֲדֹנִי.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» кратко и естественно передаёт указательно-презентативную силу הִנֵּה и подчёркивает готовность говорящих.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: Сохраняются самообозначение говорящих, обращение ко второму лицу и повтор корня עבד из начала стиха.
