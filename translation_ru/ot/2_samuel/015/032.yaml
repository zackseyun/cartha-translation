  source_fidelity: 'Основная смысловая передача точна: Давид приходит к вершине, Хушай идёт ему навстречу, а разорванная одежда и земля на голове передают его вид. Однако повествовательный маркер וְהִנֵּה в еврейском тексте вводит именно появление Хушая; в черновике он перенесён в начало отдельного предложения, описывающего уже его внешний вид.'
  naturalness: «Когда Давид дошёл до вершины» и «где он поклонялся Богу» естественны для современного литературного русского. Более связное одно предложение с «и вот» непосредственно перед появлением Хушая лучше сохраняет и еврейский порядок повествовательного акцента, и русский ритм. «В разорванной одежде и с землёй на голове» звучит естественно и зримо.
  terminology: «Вершина», «поклонялся Богу» и «Хушай-архитянин» приемлемы. «Земля на голове» сохраняет широту אֲדָמָה и не подменяет её «прахом». «Одежда» несколько обобщает כֻּתֹּנֶת, но в данном контексте не искажает смысла.
