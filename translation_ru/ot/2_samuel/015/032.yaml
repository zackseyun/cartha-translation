base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: ru
  text: Когда Давид дошёл до вершины[a], где он поклонялся Богу, и вот[b] навстречу ему вышел Хушай-архитянин — в разорванной одежде и с землёй на голове.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где он обычно поклонялся Богу». Еврейская форма может обозначать как отдельное действие в прошлом, так и обычное, повторявшееся действие.'
    reason: lexical_alternative
  - marker: b
    text: «И вот» передаёт еврейский повествовательный оборот, привлекающий внимание к неожиданному появлению Хушая.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: вершина
  rationale: Буквально «голова»; в данном топографическом контексте слово обозначает вершину возвышенности.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: где он поклонялся Богу
  rationale: Глагол буквально описывает преклонение и в сочетании с указанием на Бога означает поклонение. Форма допускает как отдельное действие в прошлом, так и обычное, повторявшееся действие; основной текст сохраняет эту неоднозначность.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Естественный русский повествовательный оборот, привлекающий внимание к внезапному появлению Хушая.
- source_word: לִקְרָאתוֹ
  choice: навстречу ему вышел
  rationale: Передаёт направленное движение к Давиду; глагол движения естественно восполнен по русскому синтаксису.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Хушай-архитянин
  rationale: Имя передано близко к еврейскому звучанию; определение понято как обозначение происхождения или принадлежности к Архе.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: одежда на Хушае была разорвана
  rationale: כֻּתֹּנֶת обозначает нательную или длинную одежду типа туники; обобщённое «одежда» понятно современному читателю и не навязывает неточную реконструкцию фасона.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: на голове у него была земля
  rationale: אֲדָמָה означает землю или почву, а не обязательно мелкую пыль. Сохранён зримый знак скорби без замены исходного слова на более привычный «прах».
theological_decisions:
- issue: Вид действия יִשְׁתַּחֲוֶה
  choice: где он поклонялся Богу
  alternative: где он обычно поклонялся Богу / где поклонялись Богу
  rationale: Еврейский имперфект может обозначать обычное действие, однако контекст не требует однозначно закреплять привычность; местоименное подлежащее естественнее всего соотнести с Давидом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Синтаксис разделён на два предложения для ясности; «и вот» сохранено как выразительный повествовательный маркер.
