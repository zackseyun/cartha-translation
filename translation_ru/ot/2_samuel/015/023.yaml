  text: וְ/כָל הָ/אָ֗רֶץ בּוֹכִים֙ ק֣וֹל גָּד֔וֹל וְ/כָל הָ/עָ֖ם עֹֽבְרִ֑ים וְ/הַ/מֶּ֗לֶךְ עֹבֵר֙ בְּ/נַ֣חַל קִדְר֔וֹן וְ/כָל הָ/עָם֙ עֹבְרִ֔ים עַל פְּנֵי דֶ֖רֶךְ אֶת הַ/מִּדְבָּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: ru
  text: И вся страна громко плакала, а весь народ переходил. Царь перешёл долину Кедрон[a], и весь народ шёл по дороге к пустыне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поток Кедрон». Еврейское נחל может означать долину, овраг или сезонный водоток.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза здесь сжата; возможно также: «по дороге, ведущей в пустыню».'
    reason: textual_clarity
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: вся страна
  rationale: Собирательное выражение обозначает страну вместе с её жителями и сохраняет образ еврейского текста; речь не идёт обо всей земле как мире.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: громко плакала
  rationale: 'Буквально: «плакали громким голосом». По-русски наречная конструкция естественно передаёт слышимый всеобщий плач, а единственное число согласуется с собирательным «вся страна».'
- source_word: כָל הָעָם
  choice: весь народ
  rationale: עָם здесь охватывает всех сопровождавших Давида, а не только воинов.
- source_word: עֹבְרִים / עֹבֵר
  choice: переходил / перешёл
  rationale: Причастия при народе рисуют продолжающееся движение, тогда как действие царя естественно передано завершённым видом; повтор корня сохранён.
- source_word: בְּנַחַל קִדְרוֹן
  choice: перешёл долину Кедрон
  rationale: נחל может обозначать вади, овраг, долину сезонного водотока или сам поток. «Долина Кедрон» ясно передаёт топографию, а неоднозначность отмечена в сноске.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: по дороге к пустыне
  rationale: Сжатая еврейская конструкция указывает на путь в направлении пустыни. Перевод сохраняет направление, не навязывая спорного синтаксического уточнения.
