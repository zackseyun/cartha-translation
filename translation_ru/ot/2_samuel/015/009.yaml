  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; естественное введение прямой речи.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное указывает на уже известного из контекста царя Давида; имя не добавляется, чтобы сохранить форму еврейского текста.
- source_word: לֵךְ
  choice: иди
  rationale: Императив глагола הלך естественно и прямо передаётся русским «иди».
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Устойчивое выражение благожелательного напутствия при уходе; «иди с миром» естественно по-русски и сохраняет образ исходной предложной конструкции.
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма глагола קום обозначает вставание и начало последующего действия; «встал» современно и нейтрально.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Глагол הלך в повествовательной последовательности обозначает отправление в путь; «пошёл» естественно следует после «встал».
- source_word: חֶבְרוֹנָה
  choice: в Хеврон
  rationale: Направительный суффикс -ה при названии города выражает движение к нему; в русском это естественно передаётся конструкцией «в Хеврон».
