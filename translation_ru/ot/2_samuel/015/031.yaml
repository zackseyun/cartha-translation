base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: ru
  text: 'Давиду сообщили: «Ахитофел — среди заговорщиков вместе с Авессалом». Тогда Давид сказал: «Яхве, прошу, сделай совет Ахитофела глупостью[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расстрой совет Ахитофела». Буквальнее: «сделай совет Ахитофела глупым».'
    reason: Лексема может обозначать как превращение совета в глупость, так и его срыв; основной текст сохраняет образ еврейской формулировки.
lexical_decisions:
- source_word: הִגִּיד לֵאמֹר
  choice: сообщили
  rationale: Безлично-неопределённая конструкция естественно передаёт еврейскую формулу сообщения, не добавляя не названного в тексте субъекта; отдельное «говоря» в современном русском перед прямой речью избыточно.
- source_word: בַּקֹּשְׁרִים
  choice: среди заговорщиков
  rationale: Форма обозначает людей, участвующих в заговоре, а не только отвлечённое понятие «заговор».
- source_word: עִם אַבְשָׁלוֹם
  choice: вместе с Авессалом
  rationale: Передаёт прямое значение совместности и связи заговорщиков с Авессалом, не уточняя сверх текста характер подчинения.
- source_word: סַכֶּל נָא
  choice: прошу, обрати … в безумие
  rationale: «Прошу» передаёт просительную частицу נָא, а «обрати … в безумие» сохраняет образ просьбы сделать совет глупым или безумным, не сводя смысл лишь к его практическому провалу.
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: совет Ахитофела
  rationale: «Совет» соответствует политико-стратегическому контексту и сохраняет возможность понимать слово как рекомендацию или замысел.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее здесь в прямом обращении, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה в молитвенном обращении
  choice: Яхве
  alternative: Господи
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет это различие, тогда как «Господи» заменяет имя титулом.
- issue: Смысл просьбы סַכֶּל אֶת־עֲצַת
  choice: обрати совет … в безумие
  alternative: расстрой совет
  rationale: Основной текст сохраняет буквальный образ превращения совета в глупость или безумие. Возможный результат — сделать совет неудачным — отмечен в сноске, но не подменяет образ исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи и молитвы. Опущено буквальное «говоря», неестественное в данном русском контексте; частица «тогда» плавно связывает сообщение с ответной молитвой Давида. Сноска поставлена при том выражении, к которому относится.
