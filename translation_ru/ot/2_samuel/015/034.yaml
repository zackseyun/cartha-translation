base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: ru
  text: 'Но если ты вернёшься в город и скажешь Авессалому: «Я буду твоим слугой, о царь! Прежде я был слугой твоего отца, а теперь я — твой слуга», — то сорвёшь для меня замысел Ахитофела.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם הָעִיר תָּשׁוּב
  choice: Но если ты вернёшься в город
  rationale: Естественно передаёт условную конструкцию и сохраняет противопоставление предыдущему совету Давида.
- source_word: עַבְדְּךָ אֲנִי הַמֶּלֶךְ אֶהְיֶה
  choice: Я буду твоим слугой, царь!
  rationale: Масоретская акцентуация допускает разбор הַמֶּלֶךְ как обращения; русская перестановка устраняет неестественный порядок слов, не меняя смысла.
- source_word: עֶבֶד אָבִיךָ וַאֲנִי מֵאָז וְעַתָּה וַאֲנִי עַבְדֶּךָ
  choice: Прежде я был слугой твоего отца, а теперь буду твоим слугой
  rationale: Передаёт временное противопоставление מֵאָז / וְעַתָּה и подразумеваемую связку; будущее «буду» естественно продолжает заявление о новой службе.
- source_word: וְהֵפַרְתָּה
  choice: то расстроишь
  rationale: Глагол הפר в хифиле означает нарушить, сорвать или сделать недейственным; «расстроишь совет» является понятным литературным соответствием.
- source_word: לִי
  choice: ради меня
  rationale: 'Передаёт дательный заинтересованного лица: Хусий должен сорвать совет в пользу Давида.'
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: совет Ахитофела
  rationale: Прямое и естественное соответствие еврейской именной конструкции.
theological_decisions:
- issue: Характер предложенных Хусию слов
  choice: Сохранить их как прямую речь Давида без нравственной оценки
  alternative: Добавить формулировку, прямо называющую слова обманом
  rationale: Стих сообщает стратегическое поручение, но сам не формулирует богословской или нравственной оценки; перевод не должен привносить её.
- issue: Отношение прежней службы к новой
  choice: 'Передать простое временное противопоставление: «прежде… а теперь…»'
  alternative: Усилить симметрию оборотом «как служил… так и теперь…»
  rationale: Еврейский текст несколько шероховат и буквально сополагает прежнюю и нынешнюю службу; выбранный вариант сохраняет смысл без искусственного усиления логической связи.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Формы «слуга», «царь», «расстроишь совет» понятны широкому читателю и не звучат ни архаично, ни разговорно. Имена переданы в традиционной русской библейской форме: Авессалом, Ахитофел.'
