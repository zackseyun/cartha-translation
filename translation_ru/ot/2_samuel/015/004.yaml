base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: ru
  text: 'Авессалом говорил[a]: «О, если бы меня назначили судьёй в стране! Тогда каждый, у кого есть тяжба или судебное дело[b], приходил бы ко мне, и я выносил бы решение в его пользу[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто поставит меня судьёй в стране?» В данном контексте вопрос выражает желание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спор и иск».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «признавал бы его правым»; «оправдывал бы его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: говорил
  rationale: В контексте форма вводит неоднократно повторявшиеся слова Авессалома; русское несовершенное прошедшее естественно передаёт повторяемость.
- source_word: מִי יְשִׂמֵנִי
  choice: Вот бы меня поставили
  rationale: 'Буквально: «Кто поставит меня?» Здесь вопрос выражает горячее желание, а не запрос сведений; безличная конструкция не добавляет конкретного деятеля.'
- source_word: שֹׁפֵט
  choice: судьёй
  rationale: Слово обозначает того, кто разбирает правовые споры; «судья» точно соответствует ближайшему контексту.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Сохраняет территориальное значение существительного с определённым артиклем, не сужая его до современной государственной категории.
- source_word: וְעָלַי יָבוֹא
  choice: приходил бы ко мне
  rationale: Условное наклонение естественно передаёт мыслимый результат желаемого назначения.
- source_word: כָּל אִישׁ
  choice: каждый
  rationale: Мужская форма единственного числа употреблена обобщённо; русское «каждый» естественно сохраняет грамматическую форму и универсальный охват.
- source_word: רִיב וּמִשְׁפָּט
  choice: тяжба или судебное дело
  rationale: «Тяжба» передаёт спор либо иск, а «судебное дело» — правовой вопрос, требующий разбирательства; союз передан как «или» по смыслу парного выражения.
- source_word: וְהִצְדַּקְתִּיו
  choice: я выносил бы решение в его пользу
  rationale: Hiphil от צדק в судебном контексте означает признать правым или оправдать; выбранная формулировка сохраняет явно благоприятный для просителя исход, обещанный Авессаломом.
theological_decisions:
- issue: Судебный смысл וְהִצְדַּקְתִּיו
  choice: выносил бы решение в его пользу
  alternative: воздавал бы ему справедливость
  rationale: Исходная форма выражает не только справедливое рассмотрение вообще, но признание человека правым; перевод сохраняет эту напряжённую, заведомо благоприятную формулировку, важную для изображения заискивания Авессалома.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Разговорное «Вот бы» передаёт риторическое пожелание без архаизма; юридические термины остаются понятными неспециалисту.
