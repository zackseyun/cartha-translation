  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: ru
  text: 'Авессалом вставал рано утром и стоял у дороги, ведущей к воротам. Всякого, у кого была тяжба[a] и кто приходил к царю на суд, Авессалом подзывал и спрашивал: «Из какого ты города?» Тот отвечал: «Твой слуга — из одного из колен Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «судебное дело»; еврейское רִיב может означать спор, жалобу, тяжбу или судебное дело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: вставал рано утром
  rationale: Глагол означает ранний подъём; несовершенный вид передаёт повторявшееся действие в данном контексте.
- source_word: וְעָמַד
  choice: становился
  rationale: Основное значение — «стоять, становиться»; несовершенный вид согласован с описанием постоянного образа действий Авессалома.
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: у дороги, ведущей к воротам
  rationale: עַל יַד означает «рядом, возле», а конструкция דֶּרֶךְ הַשַּׁעַר указывает на дорогу или подход к воротам; формулировка естественна по-русски.
- source_word: רִיב
  choice: тяжба
  rationale: В судебном контексте слово обозначает спор, жалобу или судебное дело; «тяжба» сохраняет юридическую окраску и не сужает значение до конкретного вида иска.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: шёл к царю на суд
  rationale: מִשְׁפָּט здесь относится к судебному разбирательству или решению; «на суд» кратко и естественно передаёт цель прихода.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: Авессалом подзывал
  rationale: Глагол означает обращение или призыв; «подзывал» естественно описывает повторявшееся действие, не придавая ему характера официального вызова.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: Из какого ты города?
  rationale: Прямо передаёт вопрос о городе происхождения и звучит естественно в современном русском языке.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: из одного из колен Израиля
  rationale: «Колено» — понятный и устойчивый библейский эквивалент обозначения племени Израиля; предлог «из» передаёт происхождение.
- source_word: עַבְדֶּךָ
  choice: Твой слуга
  rationale: Здесь это почтительное самообозначение при обращении к царскому сыну; «слуга» передаёт социальный регистр без необязательного акцента на рабском статусе.
