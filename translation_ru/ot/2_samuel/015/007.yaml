  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: ru
  text: 'По прошествии сорока лет[a] Авессалом сказал царю: «Позволь мне пойти в Хеврон и исполнить обет, который я дал ГОСПОДУ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых древних переводах: «четырёх лет». В еврейском тексте: «сорока лет».'
    reason: Существенное древнее разночтение связано с известной хронологической трудностью; основной текст следует WLC.
  - marker: b
    text: Еврейский оборот «в Хевроне» формально может связываться как с просьбой пойти, так и с обетом; по контексту он обычно понимается как указание на место, куда Авессалом намерен отправиться.
    reason: Сноска сохраняет синтаксическую неоднозначность исходного текста, тогда как основной русский текст передаёт наиболее естественное в контексте понимание.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: по прошествии сорока лет
  rationale: Точно передаёт временную формулу масоретского текста; разночтение числа отмечено в сноске, а не внесено в основной текст.
- source_word: אֵלֲכָה נָּא
  choice: позволь мне пойти
  rationale: Частица נָא выражает вежливую просьбу; такая формулировка естественна в современной литературной русской речи.
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: и исполнить обет
  rationale: Глагол שלם в породе пиэль применительно к обету означает исполнить или уплатить обещанное; «исполнить обет» — естественное и точное русское выражение.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Передаёт тетраграмматон традиционным русским эквивалентом, отличимым графически от обычного титула.
- source_word: בְּחֶבְרוֹן
  choice: в Хеврон
  rationale: По ближайшему контексту Хеврон является местом, куда Авессалом просит отпустить его для исполнения обета; по-русски направление естественно выражается винительным падежом с «в».
theological_decisions:
- issue: Необычное число лет в масоретском тексте
  choice: В основном тексте сохранено «сорока лет».
  alternative: «Четырёх лет» по некоторым древним свидетелям.
  rationale: Заданный еврейский источник однозначно читает אַרְבָּעִים, «сорок»; историко-хронологическая трудность не должна молча устраняться, поэтому вариант вынесен в сноску.
- issue: Связь оборота «в Хевроне»
  choice: 'Передано как направление: «пойти в Хеврон и исполнить обет».'
  alternative: «исполнить в Хевроне обет» или понять оборот как место принесения обета.
  rationale: Следующий стих сообщает, что обет был дан в Гешуре, поэтому здесь Хеврон естественно понимать как место его предполагаемого исполнения; перевод сохраняет смысл, не добавляя богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Просьба передана естественно, без архаизма «дозволь». Имя יהוה оформлено как «ГОСПОДЬ» прописными буквами.
