base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: ru
  text: А Давид поднимался по подъёму на Масличную гору — поднимался и плакал[a]. Голова его была покрыта, и шёл он босиком. Все люди, бывшие с ним, покрыли головы, каждый — свою[b], и поднимались, плача[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол «подниматься» повторён: «поднимался… поднимался и плакал».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый покрыл свою голову»; в еврейском употреблено единственное число с распределительным значением.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «они поднялись, поднимаясь и плача». Еврейская конструкция подчёркивает продолжительность и выразительность действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: по склону Масличной горы
  rationale: מַעֲלֵה обозначает подъём, склон или ведущую вверх дорогу. «Склон Масличной горы» естественно передаёт топографический смысл и сохраняет принятое современное русское название места.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: поднимался ... поднимался и плакал
  rationale: Повтор причастия создаёт картину продолжающегося действия и подчёркивает мучительное восхождение; в русском повтор сохранён без излишне тяжёлой буквальности.
- source_word: בֹּכֶה
  choice: плакал
  rationale: Простое «плакал» передаёт непосредственный эмоциональный и физический смысл, не добавляя оттенка обрядового плача.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: Голова его была покрыта
  rationale: Формулировка сохраняет состояние, выраженное страдательным причастием, и не уточняет отсутствующий в тексте способ покрытия головы.
- source_word: יָחֵף
  choice: босиком
  rationale: Обычное и ясное современное русское соответствие.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: Все люди, бывшие с ним
  rationale: הָעָם здесь обозначает сопровождавших Давида людей в целом; перевод не сужает значение до воинов.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: покрыли головы — каждый свою
  rationale: Идиоматичный русский множественного числа дополнен distributive конструкцией, отражающей еврейское אִישׁ «каждый».
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: поднимались всё выше, плача на ходу
  rationale: Конструкция с инфинитивами абсолютными изображает продолжающееся восхождение и плач. «Всё выше» и «на ходу» передают длительность и живость сцены, избегая неестественного русского повтора.
