- from: А Давид поднимался по склону Масличной горы — поднимался и плакал[a]. Голова его была покрыта, и шёл он босиком. Все люди, бывшие с ним, также покрыли головы — каждый свою[b], — и поднимались всё выше, плача на ходу[c].
  to: А Давид поднимался по подъёму на Масличную гору — поднимался и плакал[a]. Голова его была покрыта, и шёл он босиком. Все люди, бывшие с ним, покрыли головы, каждый — свою[b], и поднимались, плача[c].
