base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: ru
  text: Так поступал Авессалом со всеми израильтянами, которые приходили к царю на суд, и Авессалом крал сердца мужчин Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завоёвывал расположение мужчин Израиля». Буквально в еврейском тексте: «крал сердце»; этот образ подразумевает, что Авессалом скрытно или с помощью манипуляций склонял людей на свою сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: Так поступал Авессалом
  rationale: Форма повествовательного глагола вместе с описанием обычного действия указывает на неоднократное поведение, изложенное в предыдущем стихе. «Так поступал» естественно передаёт отсылку к этому образу действий.
- source_word: לְכָל יִשְׂרָאֵל
  choice: со всеми израильтянами
  rationale: Буквально выражение означает «ко всему Израилю», но по-русски применительно к повторявшемуся обращению с отдельными приходившими людьми естественнее «со всеми израильтянами».
- source_word: אֲשֶׁר יָבֹאוּ
  choice: которые приходили
  rationale: Имперфект в прошедшем повествовании обозначает обычное, повторявшееся действие; русский несовершенный вид точно передаёт эту функцию.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: к царю на суд
  rationale: מִשְׁפָּט здесь означает судебное разбирательство или решение. Порядок «к царю на суд» ясен и естественен в современном русском языке.
- source_word: וַיְגַנֵּב
  choice: крал
  rationale: Сохранён буквальный образ глагола גנב «красть». Несовершенный вид согласуется с длительным результатом повторявшихся действий Авессалома и не сглаживает оттенок скрытого или манипулятивного завоевания верности.
- source_word: אֶת לֵב אַנְשֵׁי יִשְׂרָאֵל
  choice: сердца мужей Израиля
  rationale: Коллективное единственное «сердце» естественно передано русским множественным числом. «Мужей Израиля» сохраняет явно мужскую форму אַנְשֵׁי и библейски достойный регистр.
theological_decisions:
- issue: Гендерное выражение אַנְשֵׁי יִשְׂרָאֵל
  choice: мужей Израиля
  alternative: народа Израиля / израильтян
  rationale: В еврейском тексте употреблено существительное мужского рода «мужи». Хотя оно может представлять более широкую общность, основной текст сохраняет гендерную форму источника, не исключая возможного коллективного смысла.
- issue: Метафора «украсть сердце»
  choice: крал сердца
  alternative: завоёвывал расположение / склонял на свою сторону
  rationale: 'Буквальная метафора несёт нравственное напряжение: Авессалом приобретал верность людей скрытным или манипулятивным путём. Нейтральный пересказ ослабил бы этот оттенок.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «На суд» понятно обычному читателю, а «мужей Израиля» сохраняет формальную точность источника. Маркер сноски поставлен непосредственно после метафоры, которую поясняет.
