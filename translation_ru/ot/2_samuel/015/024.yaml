base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: ru
  text: И вот, Садок тоже пришёл, а с ним — все левиты, несущие ковчег Божьего завета. Они поставили ковчег Божий[a], и Авиафар поднялся[b], пока весь народ не завершил переход из города[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поместили ковчег Божий». Еврейский глагол может означать, что ковчег поставили или расположили в этом месте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «взошёл». Буквально в еврейском тексте — «поднялся»; точный смысл движения в данном контексте неясен.'
    reason: alternative_reading
  - marker: c
    text: То есть из Иерусалима.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Естественный для современного русского повествовательный указатель, сохраняющий функцию привлечения внимания без архаичного «се».
- source_word: גַם צָדוֹק
  choice: Садок тоже
  rationale: Частица גַם передаёт добавление нового участника; «тоже» естественно звучит при имени.
- source_word: וְכָל הַלְוִיִּם אִתּוֹ
  choice: а с ним — все левиты
  rationale: Передаёт полный состав группы и ясно связывает местоимение с Садоком; тире поддерживает естественный русский синтаксис.
- source_word: נֹשְׂאִים
  choice: несущие
  rationale: Причастие точно передаёт одновременное действие левитов.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: ковчег Божьего завета
  rationale: Естественно передаёт еврейскую цепочку сопряжения и сохраняет явное упоминание завета и Бога.
- source_word: וַיַּצִּקוּ
  choice: поставили
  rationale: По контексту обозначает помещение ковчега на место; более редкие буквальные оттенки корня здесь были бы неестественны или вводили бы в заблуждение.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: Авиафар поднялся
  rationale: Сохраняет основное пространственное значение עלה и не подменяет не вполне ясную повествовательную деталь толкованием.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: пока весь народ не вышел
  rationale: По-русски естественно выражает предел продолжавшегося действия; «вышел» в сочетании «из города» передаёт направленное движение לַעֲבוֹר без искусственного «перешёл» при неуказанном объекте перехода.
- source_word: מִן הָעִיר
  choice: из города
  rationale: Следует формулировке источника, не заменяя общее обозначение города именем Иерусалима.
theological_decisions:
- issue: Как обозначить город
  choice: «из города» в основном тексте
  alternative: «из Иерусалима»
  rationale: В еврейском тексте стоит «из города»; контекстуальную идентификацию как Иерусалим следует дать в примечании, а не вносить в основной текст.
- issue: Значение וַיַּעַל применительно к Авиафару
  choice: «Авиафар поднялся»
  alternative: «Авиафар взошёл»; «Авиафар принёс жертвы»
  rationale: Форма от עלה прежде всего выражает движение вверх. Перевод сохраняет неоднозначность контекста и не вводит предположение о жертвоприношении.
- issue: Значение וַיַּצִּקוּ
  choice: «поставили ковчег»
  alternative: «поместили ковчег»; «опустили ковчег»
  rationale: Контекст требует действия размещения ковчега, однако точный пространственный оттенок глагола не вполне определён; альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования, но без архаизмов вроде «се». Имена переданы в традиционной русской библейской форме. Синтаксис сделан ясным для обычного читателя; подлинная неопределённость глаголов וַיַּצִּקוּ и וַיַּעַל сохранена посредством сносок.
