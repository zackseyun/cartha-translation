base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: ru
  text: 'Тогда Давид сказал всем своим слугам, которые были с ним в Иерусалиме: «Вставайте, бежим, ведь нам не спастись от Авессалома. Поспешите уйти[a], иначе он поспешит, настигнет нас, обрушит на нас бедствие[b] и поразит город мечом[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поспешите идти»; имеется в виду немедленно покинуть город.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зло». Здесь это слово обозначает беду или несчастье, а не обязательно нравственное зло.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «устами меча» — древнееврейское выражение, означающее поражение и гибель от меча.'
    reason: idiom_explanation
lexical_decisions:
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: В контексте царского двора слово обозначает находящихся на службе у Давида людей; «слуги» сохраняет широту значения, не приписывая им непременно рабский статус.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: Вставайте, бежим
  rationale: Повелительное קוּמוּ и когортатив וְנִבְרָחָה передают срочный призыв Давида к совместному бегству. Краткая русская формулировка естественно выражает эту неотложность.
- source_word: פְלֵיטָה
  choice: спастись
  rationale: Здесь существительное означает возможность уцелеть посредством бегства. Конструкция «нам не спастись» естественна по-русски и не вводит отсутствующей в тексте прямой идеи сверхъестественного избавления.
- source_word: מִפְּנֵי אַבְשָׁלוֹם
  choice: от Авессалома
  rationale: Предлог указывает на исходящую от Авессалома угрозу; буквальное «от лица Авессалома» в современном русском было бы неестественно.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Поспешите уйти
  rationale: Повеление с инфинитивом настойчиво требует немедленного ухода. «Поспешите уйти» передаёт смысл естественнее, чем буквальное «поспешите идти».
- source_word: פֶּן יְמַהֵר וְהִשִּׂגָנוּ
  choice: как бы он сам не поспешил, не настиг нас
  rationale: 'Сохранены отрицательно-предупредительное значение פֶּן и повтор мотива спешки. Частица «сам» подчёркивает противопоставление: Давид велит своим людям спешить, чтобы Авессалом не опередил их действиями.'
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: не обрушил на нас бедствие
  rationale: רָעָה в данном контексте означает губительную беду, а не обязательно нравственное зло; «обрушил» передаёт каузативную направленность действия против них.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: не поразил город мечом
  rationale: Русская формулировка передаёт военное разорение и убийство мечом, избегая неестественного буквального выражения «устами меча».
