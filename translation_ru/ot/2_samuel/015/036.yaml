base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: ru
  text: 'Вот, там с ними находятся двое их сыновей: Ахимаас, сын Садока, и Ионафан, сын Авиафара. Через них[a] передавайте мне всё[b], что услышите.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их руке»; это еврейское выражение означает передачу через посредников.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякое известие»; еврейское слово может означать слово, дело или сообщение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую функцию слова и естественно звучит в современном русском повествовании.
- source_word: שָׁם עִמָּם
  choice: там с ними
  rationale: Передаёт и местонахождение сыновей, и их присутствие вместе со священниками.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: два их сына
  rationale: Прямо передаёт конструкцию и отсылает к Садоку и Авиафару.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: Ахимаас, сын Садока, и Ионафан, сын Авиафара
  rationale: Предлог ל обозначает здесь принадлежность или родственную связь; явное указание «сын» естественно по-русски и определяется предшествующей фразой «два их сына».
- source_word: וּשְׁלַחְתֶּם
  choice: передавайте
  rationale: В данном контексте форма выражает распоряжение; несовершенный вид уместно передаёт предполагаемую передачу любых поступающих сведений.
- source_word: בְּיָדָם
  choice: через них
  rationale: Еврейское «в их руке» является идиомой посредничества; русский эквивалент ясно выражает передачу сведений посредством сыновей.
- source_word: כָּל דָּבָר
  choice: всё
  rationale: Сохраняет широту многозначного דָּבָר — «слово, дело, сообщение» — без неоправданного сужения до одного вида сведений.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: что услышите
  rationale: Прямо передаёт значение שׁמע и естественно описывает получение сведений.
