  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: ru
  text: 'Давид сказал ему: «Если ты пойдёшь со мной[a], то будешь мне в тягость».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перейдёшь со мной». Еврейский глагол может буквально означать «переходить» или «переправляться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: Давид сказал
  rationale: Вав-последовательный продвигает повествование; в современном русском это естественно передаётся без обязательного начального «и» или «тогда».
- source_word: לוֹ
  choice: ему
  rationale: В еврейском тексте стоит местоимение; имя Хусия, понятное из контекста, в сам стих не добавляется.
- source_word: אִם
  choice: если
  rationale: Прямо и естественно вводит условное предложение.
- source_word: עָבַרְתָּ אִתִּי
  choice: ты пойдёшь со мной
  rationale: Глагол עבר буквально может означать переход или переправу, но здесь речь идёт о дальнейшем сопровождении Давида. «Пойдёшь со мной» естественно передаёт смысл в современном русском; более буквальный вариант сохранён в сноске.
- source_word: וְהָיִתָ עָלַי לְמַשָּׂא
  choice: то будешь мне в тягость
  rationale: Сочетание היה + על с существительным מַשָּׂא выражает обременение Давида. Русское «быть кому-либо в тягость» точно и естественно передаёт этот межличностный смысл.
