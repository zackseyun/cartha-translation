  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: ru
  text: С Авессаломом пошли двести человек из Иерусалима, которых пригласили; они шли в простоте своей[a] и ничего не знали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничего не подозревая»; «в своей невиновности». Еврейское выражение может обозначать простодушие, невиновность или цельность; здесь последующие слова поясняют, что они не знали о замысле Авессалома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת־אַבְשָׁלוֹם הָלְכוּ
  choice: С Авессаломом пошли
  rationale: Предлог אֶת при глаголе движения выражает сопровождение; русская конструкция с «с» естественно передаёт, что люди пошли вместе с Авессаломом.
- source_word: מָאתַיִם אִישׁ
  choice: двести человек
  rationale: После числительного אִישׁ обозначает считаемых людей мужского пола; по-русски нормативно и естественно «двести человек».
- source_word: מִירוּשָׁלַםִ
  choice: из Иерусалима
  rationale: Предлог מִן указывает на место происхождения или отправления.
- source_word: קְרֻאִים
  choice: приглашённые
  rationale: Страдательное причастие от קרא в данном контексте означает людей, которых пригласили; слово «гости» не добавляется, поскольку его нет в еврейском тексте.
- source_word: וְהֹלְכִים לְתֻמָּם
  choice: которые шли, ничего не подозревая
  rationale: לְתֻמָּם может указывать на простодушие, невиновность или цельность; следующая фраза уточняет, что эти люди не знали о замысле. «Ничего не подозревая» естественно передаёт контекстуальный смысл, не приписывая им особой нравственной безупречности.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: и ни о чём не зная
  rationale: Буквально выражение означает, что они «не знали никакого дела/ничего»; в контексте речь об их полной неосведомлённости относительно замысла Авессалома.
theological_decisions:
- issue: Характер невиновности приглашённых
  choice: ничего не подозревая
  alternative: в простоте своей; в своей непорочности
  rationale: Контекст определяет לְתֻמָּם прежде всего как неосведомлённость о заговоре, а не как утверждение об абсолютной нравственной непорочности этих людей; сноска сохраняет более широкую смысловую возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор еврейского глагола «идти» частично сохранён, но синтаксис сделан естественным для русского. Тире отделяет пояснительное определение «приглашённые».
