  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: ru
  text: И все его слуги проходили рядом с ним; и все керетеи, и все пелетеи, и все гефяне — шестьсот человек, пришедших вместе с ним из Гата[a], — проходили перед царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально включает слова «его нога»; возможный смысл: «последовавших за ним из Гата» или «пришедших с ним пешком из Гата».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: עֶבֶד может обозначать слуг, приближённых или царских служащих. Нейтральное «слуги» сохраняет основной смысл, не сужая его до конкретной должности.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: проходили рядом с ним
  rationale: Оборот עַל יָד означает нахождение рядом, сбоку; выбран естественный русский эквивалент с сохранением пространственного смысла.
- source_word: הַכְּרֵתִי
  choice: керетеи
  rationale: Название группы в войске Давида передано транслитерацией, без попытки истолковать её этническую принадлежность или функцию.
- source_word: הַפְּלֵתִי
  choice: пелетеи
  rationale: Название группы передано транслитерацией параллельно «керетеям».
- source_word: הַגִּתִּים
  choice: гефяне
  rationale: Так обозначены выходцы из Гата; «гефяне» — понятное и укоренившееся в русской библейской речи этническое наименование.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: шестьсот человек
  rationale: אִישׁ служит здесь счётным обозначением мужчин; «воинов» контекстуально возможно, но добавляло бы не выраженную прямо характеристику.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: пришедших вместе с ним из Гата[a]
  rationale: Необычный оборот буквально содержит слово «нога» и указывает на сопровождение человека, возможно в его свите или пешком. Основной текст передаёт общий смысл, а буквальный образ и возможная альтернатива сохранены в примечании.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: проходили перед царём
  rationale: עַל פְּנֵי здесь естественно означает движение перед царём или мимо него в поле его зрения; русский оборот сохраняет сцену шествия и формальную неоднозначность.
