base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: ru
  text: 'Тогда царь сказал Иттаю из Гефа: «Зачем и тебе идти с нами? Вернись и оставайся с царём[a], ведь ты чужеземец и к тому же изгнанник из своего места[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Неясно, кого именно Давид называет здесь царём; возможно, речь идёт о царской власти, остающейся в Иерусалиме.
    reason: alternative_reading
  - marker: b
    text: 'Еврейский оборот сжат и труден для однозначного перевода. Буквально: «и к тому же изгнанник ты к своему месту». Он может подчёркивать изгнанническое положение Иттая и его связь с собственным местом или родиной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Тогда царь сказал
  rationale: Вайиктоль продолжает последовательное повествование; «тогда» естественно передаёт развитие событий, а титул «царь» сохраняется вместо имени Давида.
- source_word: אִתַּי הַגִּתִּי
  choice: Иттаю гефянину
  rationale: Имя передано традиционной русской формой «Иттай», а обозначение происхождения из Гефа — принятой библейской формой «гефянин».
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Зачем и тебе идти с нами?
  rationale: Инфинитивная русская конструкция естественно передаёт вопрос о намерении и сохраняет акцент גם אַתָּה — «и тебе».
- source_word: שׁוּב וְשֵׁב
  choice: Вернись и оставайся
  rationale: Два повелительных глагола сохранены. ישׁב в данном контексте означает не буквальное сидение, а пребывание на месте.
- source_word: עִם הַמֶּלֶךְ
  choice: с царём
  rationale: Буквальная формулировка сохранена без уточнения личности царя, поскольку еврейский текст её прямо не называет.
- source_word: נָכְרִי
  choice: чужеземец
  rationale: Передаёт положение человека не из местного народа; слово соответствует достоинству библейского повествования и не означает просто незнакомца.
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: и к тому же изгнанник вдали от родных мест
  rationale: גֹּלֶה обозначает изгнанного или перемещённого человека. Сжатое לִמְקוֹמֶךָ допускает трудное понимание направления или отношения к своему месту; основная формулировка выражает удалённость от родины, не превращая оборот в приказ вернуться туда.
theological_decisions:
- issue: Кого обозначает «царь» в выражении עִם הַמֶּלֶךְ
  choice: Сохранить «с царём» без имени
  alternative: «с царём Авессаломом»; «с царём в Иерусалиме»; «со мной, царём»
  rationale: Еврейский текст повторяет титул и не называет его носителя. Уточнение сняло бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис прямой и понятный; сохранены повтор титула «царь», два повеления и неоднозначность их референта. Все маркеры сносок присутствуют в основном тексте.
