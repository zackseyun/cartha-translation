base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: ru
  text: 'Ведь твой слуга дал обет, когда жил в Гешуре, в Араме, сказав: «Если Яхве непременно[a] вернёт меня в Иерусалим, то я буду служить[b] Яхве».


    [a] В еврейском тексте здесь употреблены две однокоренные глагольные формы; повторение усиливает значение: «если Яхве непременно вернёт меня».


    [b] Или: «поклоняться». Употреблённый здесь глагол может обозначать служение Богу, совершаемое в поклонении.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь употреблены две однокоренные глагольные формы; повторение усиливает значение: «если Яхве непременно вернёт меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклоняться». Употреблённый здесь глагол может обозначать служение Богу, совершаемое в поклонении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: дал обет
  rationale: Еврейская конструкция с однокоренными существительным и глаголом буквально означает «обетом поклялся / дал обет». По-русски «дал обет» естественно передаёт смысл без неуклюжего повтора.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Это принятая почтительная форма самоназвания при обращении к царю; «слуга» сохраняет придворный регистр и не привносит акцент на рабском статусе.
- source_word: בְּשִׁבְתִּי
  choice: когда жил
  rationale: Инфинитивная конструкция с предлогом указывает на время и состояние пребывания. «Когда жил» ясно и естественно по-русски.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: в Гешуре, в Араме
  rationale: Передаёт двойное географическое указание исходного текста, не уточняя сверх сказанного характер связи Гешура с Арамом.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: если Яхве и вправду вернёт меня
  rationale: Повторение форм корня שוב придаёт высказыванию усилительный оттенок. «И вправду» передаёт эмфазу, а «вернёт меня» сохраняет направленность возвращения в названное место.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: то я буду служить Яхве
  rationale: Глагол עבד имеет широкое значение служения и в отношении Бога может включать поклонение. «Служить» сохраняет эту смысловую широту; «то» естественно обозначает следствие в условной конструкции.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Значение עבד применительно к Богу
  choice: служить
  alternative: поклоняться
  rationale: «Служить» сохраняет более широкий смысл еврейского глагола, тогда как культовый оттенок «поклоняться» отмечен в сноске и не навязан основному тексту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Придворная почтительность выражена формой «твой слуга»; синтаксис остаётся ясным для обычного читателя. Буквальные еврейские повторы не воспроизводятся механически, но их выразительная сила отражена в тексте и сноске.
