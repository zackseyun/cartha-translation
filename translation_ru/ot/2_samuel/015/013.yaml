  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: ru
  text: 'И пришёл к Давиду вестник и сказал: «Сердца израильтян — на стороне Авессалома».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце мужей Израиля — за Авессаломом»; это выражение означает их расположение и верность Авессалому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Форма wayyiqtol от בוא последовательно развивает повествование и естественно передаётся простым прошедшим временем.
- source_word: הַמַּגִּיד
  choice: вестник
  rationale: Причастие породы hifil обозначает того, кто приносит известие; «вестник» естественно для политического донесения и сохраняет повествовательный регистр.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Инфинитивная конструкция вводит прямую речь; в современном русском повествовании сочинительная форма звучит естественнее буквального «говоря».
- source_word: הָיָה לֶב
  choice: сердца ... склонились
  rationale: «Сердце» обозначает внутреннее расположение, волю и верность. Множественное «сердца» передаёт распределительный смысл при собирательном обозначении израильтян, а «склонились» выражает изменение политической приверженности.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтян
  rationale: Формально единственное число употреблено собирательно. «Израильтян» ясно и естественно обозначает людей Израиля, не добавляя отсутствующего в тексте уточнения о войске.
- source_word: אַחֲרֵי
  choice: к
  rationale: Буквально «за/вслед за», но в сочетании с «сердцем» указывает на приверженность и переход на сторону Авессалома.
- source_word: אַבְשָׁלוֹם
  choice: Авессалому
  rationale: Использована традиционная русская библейская форма имени в требуемом дательном падеже.
theological_decisions:
- issue: Характер поддержки Авессалома
  choice: Сохранён образ сердца, склонённого к Авессалому, с пояснением политической верности в сноске.
  alternative: «Израильтяне перешли на сторону Авессалома».
  rationale: Источник выражает приверженность образно и допускает оттенки расположения, воли и верности; прямое «перешли на сторону» было бы яснее, но сузило бы образ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён естественной конструкцией «и сказал», а образ сердца сохранён как понятный по-русски способ выразить политическую приверженность.
