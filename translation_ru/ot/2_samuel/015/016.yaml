  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: ru
  text: И вышел царь, и весь его дом последовал за ним пешком[a]. Царь оставил десять женщин — наложниц присматривать за домом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у его ног». В данном контексте еврейское выражение означает, что царский дом следовал за ним пешком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא в повествовательной форме обозначает выход или отправление. «Вышел» сохраняет конкретный образ движения и не усиливает значение до «покинул».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён употреблённый в еврейском тексте титул; хотя из контекста ясно, что речь о Давиде, его имя здесь не названо.
- source_word: וְכָל בֵּיתוֹ
  choice: и весь его дом
  rationale: בַּיִת с местоименным суффиксом здесь означает людей царского дома, а не здание. Выражение «весь его дом» естественно для библейского повествования и сохраняет повтор слова «дом» в двух разных значениях.
- source_word: בְּרַגְלָיו
  choice: последовал за ним пешком
  rationale: Буквально выражение означает «у его ног», но в данном контексте передаёт следование за царём пешком. Перевод раскрывает идиому, а буквальная форма отмечена в сноске.
- source_word: וַיַּעֲזֹב
  choice: оставил
  rationale: עזב здесь означает оставить кого-либо на месте. «Оставил» не привносит отрицательной оценки, возможной в слове «бросил».
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: десять женщин — наложниц
  rationale: 'Сохранены оба существительных исходного текста и их пояснительное соотношение: эти десять женщин были наложницами.'
- source_word: לִשְׁמֹר
  choice: присматривать
  rationale: שׁמר охватывает значения хранения, охраны и попечения. В сочетании с домом «присматривать» естественно передаёт порученную им заботу о царском жилище, не сводя задачу только к вооружённой охране.
- source_word: הַבָּיִת
  choice: домом
  rationale: Здесь בַּיִת обозначает оставленное царское жилище. «Дом» точнее следует лексике источника, чем более конкретное «дворец».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Повтор «дом» сохранён намеренно: в первом случае это люди царского дома, во втором — царское жилище. Тире перед «наложниц» ясно передаёт приложение без устранения слова «женщин».'
