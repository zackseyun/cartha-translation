base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: ru
  text: 'Иттай ответил царю: «Жив Яхве, и жив мой господин царь: где бы ни был мой господин царь — на смерть ли, на жизнь ли, — там будет и твой слуга».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Жив Яхве, и жив мой господин царь» — древнееврейская формула торжественной клятвы.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת הַמֶּלֶךְ וַיֹּאמַר
  choice: Иттай ответил царю
  rationale: Стандартная повествовательная формула ответа передана естественно по-русски; отдельное «и сказал» опущено как семитская избыточность, уже выраженная глаголом «ответил».
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: Жив Яхве, и жив мой господин царь
  rationale: Сохранена торжественная древнееврейская формула клятвы и параллелизм обеих частей; имя יהוה передано как «Яхве».
- source_word: כִּי אִם
  choice: двоеточие после формулы клятвы
  rationale: В контексте клятвы сочетание вводит категорически подтверждаемое содержание. Русская пунктуационная конструкция естественно передаёт эту заверительную силу без добавления отдельного наречия.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: где бы ни был
  rationale: Передаёт неопределённость места и всеохватность обязательства естественным современным русским оборотом.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: на смерть ли, на жизнь ли
  rationale: Сохранены порядок исходного текста, симметрия и смысл готовности разделить любую участь царя, без уточнения того, что источник оставляет сжатым.
- source_word: עַבְדֶּךָ
  choice: твой слуга
  rationale: Здесь это почтительное самообозначение перед царём; «раб» могло бы неоправданно выдвинуть на первый план юридический статус.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерационная передача сохраняет личное имя Бога и согласуется с предоставленным руководством проекта.
- issue: Характер обещания Иттая
  choice: Сохранена формула клятвы и открытая готовность быть с царём «на смерть ли, на жизнь ли»
  alternative: Разъяснить как «даже если придётся умереть» или переставить в привычный порядок «в жизни и смерти»
  rationale: Более разъясняющая формулировка сузила бы сжатое выражение оригинала и могла бы сгладить его риторический порядок.
translation_notes:
  register: Современный литературный русский с умеренно торжественным оттенком. Синтаксис сделан естественным, но сохранены клятвенная формула, царский титул и выразительный порядок «смерть — жизнь». Маркер сноски [a] присутствует в основном тексте.
