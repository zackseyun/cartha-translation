base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: ru
  text: 'Но если он скажет: «Я не благоволю к тебе»[a], — вот я; пусть он поступит со мной так, как сочтёт правильным[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты мне неугоден»; буквально: «Я не нахожу удовольствия в тебе».'
