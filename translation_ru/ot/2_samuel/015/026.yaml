  - marker: b
    text: 'Буквально: «как хорошо в его глазах» — еврейское выражение со значением «как он сочтёт хорошим (правильным)».'
    reason: idiom
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит условие, противопоставленное надежде, выраженной в предыдущем стихе.
- source_word: כֹּה יֹאמַר
  choice: он скажет
  rationale: כֹּה при глаголе речи вводит прямую речь и не требует отдельного соответствия в естественном русском переводе; имперфект передаёт гипотетическое будущее условие.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Ты мне неугоден
  rationale: Естественная русская формулировка сохраняет смысл отсутствия удовольствия или благоволения, не придавая глаголу физического оттенка желания.
- source_word: הִנְנִי
  choice: вот я
  rationale: Традиционная формула самопредъявления здесь выражает готовность и покорность говорящего.
- source_word: יַעֲשֶׂה לִּי
  choice: пусть он поступит со мной
  rationale: Передаёт разрешительно-волевое значение формы и добровольное подчинение Давида Божьему решению.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: так, как сочтёт правильным
  rationale: Естественно передаёт еврейскую идиому «как хорошо в его глазах», обозначающую то, что кто-либо считает хорошим или правильным.
theological_decisions:
- issue: К кому относятся местоимения третьего лица
  choice: Сохранены местоимения «он» и подразумеваемое «его» со строчной буквы; из контекста они относятся к Господу.
  alternative: Повторить имя «Господь» либо писать местоимения с прописной буквы.
  rationale: В еврейском тексте Божье имя в этом стихе не повторяется. Местоименная форма сохраняет связь с предыдущим стихом и не вводит отсутствующую в источнике типографскую богословскую маркировку.
- issue: Оттенок חפץ применительно к Божьему отношению к Давиду
  choice: «Ты мне неугоден»
  alternative: «Я не благоволю к тебе»; «Я не нахожу в тебе удовольствия».
  rationale: Выбранная формулировка сохраняет оценочно-реляционный смысл и не уточняет, означает ли отсутствие удовольствия окончательное отвержение, временную немилость или иной Божий суд.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формула «вот я» сохранена ради краткости и оттенка покорной готовности; архаические формы и конфессионально обусловленная капитализация местоимений не используются.
