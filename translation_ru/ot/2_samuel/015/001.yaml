  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: ru
  text: После этого Авессалом завёл себе[a] колесницу, коней и пятьдесят человек, бежавших впереди него.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приобрёл себе», «обеспечил себя». Еврейский глагол может означать как изготовление, так и приобретение или устройство чего-либо для себя.'
    reason: lexical_alternative
  - marker: b
    text: Колесница, кони и пятьдесят бегущих впереди людей образовывали свиту царского типа и подчёркивали публичное самовозвышение Авессалома.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт еврейскую повествовательную формулу и сохраняет временную связь с предшествующими событиями.
- source_word: וַיַּעַשׂ לוֹ
  choice: завёл себе
  rationale: В данном сочетании עשה может означать не только изготовление, но и приобретение или обеспечение себя чем-либо. «Завёл себе» естественно по-русски охватывает этот смысл и сохраняет возвратный оттенок לוֹ.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מֶרְכָּבָה
  choice: колесницу
  rationale: Прямое соответствие существительному; царский характер колесницы не добавлен в основной текст.
- source_word: וְסֻסִים
  choice: и коней
  rationale: Сохраняет простую структуру еврейского перечисления; «кони» соответствует возвышенному, но понятному повествовательному регистру.
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: а также пятьдесят человек
  rationale: Точно передаёт счётное выражение; союзное оформление делает длинное перечисление естественным по-русски.
- source_word: רָצִים
  choice: бежавших
  rationale: Причастие передаёт действие и функцию сопровождавших Авессалома людей, не превращая её в формальный титул «скороходы».
- source_word: לְפָנָיו
  choice: впереди него
  rationale: Ясно обозначает движение перед Авессаломом в составе публичного шествия.
theological_decisions:
- issue: Политический смысл свиты Авессалома
  choice: Описать колесницу, коней и бегущих впереди людей без прямого указания на притязания на царскую власть.
  alternative: «Авессалом устроил себе царское шествие»
  rationale: Еврейский текст создаёт образ царского великолепия и самовозвышения через конкретные детали, но прямо не формулирует мотив Авессалома. Перевод сохраняет этот подразумеваемый смысл, не превращая его в утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Фраза «завёл себе» понятна обычному читателю и не сужает многозначность еврейского עשה до личного изготовления или только покупки.
