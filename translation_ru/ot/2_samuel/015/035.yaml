  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: ru
  text: Разве там с тобой нет священников Садока и Авиафара? Обо всём, что услышишь из царского дома, сообщай священникам Садоку и Авиафару.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: Разве… нет
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: כָל־הַדָּבָר
  choice: обо всём
  rationale: Естественно передаёт совокупное значение выражения «всякое дело / всё, что» без ненужного уточнения.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: из царского дома
  rationale: Сохраняет образ и возможный смысл царского дворца или окружения царя, не сужая его до одного толкования.
- source_word: תַּגִּיד
  choice: сообщай
  rationale: Императивное значение в данном наставлении естественно выражено русским повелительным наклонением.
