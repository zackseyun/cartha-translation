base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: ru
  text: 'Авессалом разослал лазутчиков по всем коленам Израиля и велел им: «Когда услышите звук рога, скажите: „Авессалом воцарился в Хевроне!“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: тайных посланцев
  rationale: Слово обычно означает «разведчики, соглядатаи», однако здесь эти люди не собирают сведения, а тайно передают условный приказ. Перевод передаёт скрытый характер их поручения и их фактическую роль.
- source_word: שֹׁפָר
  choice: рога
  rationale: Речь о шофаре — сигнальном роге, а не о современной трубе; общеупотребительное «рог» точно и понятно в контексте.
- source_word: מָלַךְ
  choice: стал царём
  rationale: Перфект глагола может сообщать о вступлении на царство; формула «стал царём» естественно передаёт провозглашение свершившегося факта, не утверждая законность власти.
- source_word: לֵאמֹר ... וַאֲמַרְתֶּם
  choice: с таким наказом ... объявляйте
  rationale: Передаёт ввод поручения и последующий приказ естественным современным русским языком.
theological_decisions:
- issue: Статус царствования Авессалома
  choice: «стал царём» как содержание заранее подготовленного возгласа
  alternative: «царствует» или «воцарился»
  rationale: Текст сообщает формулу, которую заговорщики должны провозгласить, а не даёт авторскую оценку законности или действительности царской власти Авессалома.
translation_notes:
  register: Современный литературный русский, повествовательный и сдержанно торжественный. «Наказ» уместен как ясное обозначение данного через посланцев распоряжения; повелительное «объявляйте» отражает публичный характер требуемого возгласа.
