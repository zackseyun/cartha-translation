revisions:
- from: 'Авессалом разослал тайных посланцев по всем коленам Израиля с таким наказом: «Как только услышите звук рога, объявляйте: „Авессалом стал царём в Хевроне!“»'
  to: 'Авессалом разослал лазутчиков по всем коленам Израиля и велел им: «Когда услышите звук рога, скажите: „Авессалом воцарился в Хевроне!“»'
  rationale: Правка восстанавливает прямое значение «лазутчики», передаёт временную конструкцию без добавления «как только» и делает формулировку распоряжения более близкой к оригиналу и естественной по-русски. «Воцарился» отражает объявительный характер еврейского מָלַךְ и не является авторским признанием законности царствования.
  reviewer_model: gpt-5.6-terra
