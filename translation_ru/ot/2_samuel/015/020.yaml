    rationale: Фраза «а сегодня мне заставлять тебя...» грамматически возможна, но в современной литературной речи звучит неполно; «разве мне» ясно обозначает вопросительную интонацию еврейского текста.
  - severity: low
    issue: «Преданная любовь» — не самое естественное русское сочетание
    rationale: Слово «преданная» может описывать любящего, а не устойчивый характер любви. «Неизменная любовь» яснее выражает смысл חֶסֶד и звучит естественнее.
