  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: ru
  text: Ты пришёл лишь вчера, а сегодня разве мне заставлять тебя скитаться вместе с нами, когда я и сам иду куда придётся?[a] Возвращайся и уведи с собой своих братьев.[b] Да будут с тобой неизменная любовь и верность![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда я иду туда, куда я иду». Повтор в еврейском тексте подчёркивает неопределённость пути Давида.'
    reason: lexical_alternative
  - marker: b
    text: «Братьями» здесь, вероятно, названы спутники или соплеменники Иттая.
    reason: cultural_note
  - marker: c
    text: В еврейском тексте заключительные слова «неизменная любовь и верность» не имеют выраженного глагола; по контексту они поняты как благословение.
    reason: textual_ambiguity
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Ты пришёл лишь вчера
  rationale: Буквально конструкция означает «вчера — твой приход». Современная русская фраза передаёт недавность прибытия Иттая; «лишь» выявляет подразумеваемый довод Давида.
- source_word: אֲנוּעֲךָ
  choice: мне заставлять тебя скитаться
  rationale: 'Форма от נוע имеет каузативный смысл: вынуждать двигаться без устойчивого пристанища. «Скитаться» сохраняет образ нестабильного бегства.'
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: когда я и сам иду куда придётся
  rationale: Еврейское выражение буквально повторяет глагол «идти» и остаётся несколько неопределённым. «Куда придётся» естественно по-русски передаёт неизвестность пути Давида, не превращая её в утверждение о предопределённой необходимости.
- source_word: שׁוּב וְהָשֵׁב
  choice: Возвращайся и уведи
  rationale: Первый глагол — простой повелительный «вернись», второй — каузативная форма «возврати/уведи». Различие форм сохранено естественными русскими глаголами.
- source_word: אַחֶיךָ
  choice: своих братьев
  rationale: Сохранено буквальное родственное обозначение. По контексту оно может относиться к спутникам или соплеменникам Иттая, что поясняется в сноске.
- source_word: חֶסֶד וֶאֱמֶת
  choice: преданная любовь и верность
  rationale: Устойчивая пара обозначает деятельную, неизменную благосклонность и надёжность. «Преданная любовь» передаёт חֶסֶד весомее, чем общее «доброта», а «верность» естественно выражает אֱמֶת в этой формуле.
theological_decisions:
- issue: Безглагольная формула חֶסֶד וֶאֱמֶת в конце стиха
  choice: Да пребудут с тобой преданная любовь и верность!
  alternative: 'Преданная любовь и верность; либо: пусть Господь явит тебе преданную любовь и верность'
  rationale: В масоретском тексте нет ни явного глагола, ни названного деятеля. Благословительная формулировка соответствует контексту, но не вводит прямо имя Бога, отсутствующее в данном еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Риторический вопрос передан естественно, без архаизмов; неопределённость маршрута и краткость заключительного благословения сохранены.
