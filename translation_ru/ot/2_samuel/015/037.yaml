  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: ru
  text: Так Хусий, друг Давида, пришёл в город, когда Авессалом входил в Иерусалим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Авессалом вошёл в Иерусалим». Еврейский союз можно понимать как простое «и», а глагол — передать формой совершенного вида.'
    reason: Альтернативное грамматическое прочтение связи между двумя частями стиха.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא обозначает приход или вхождение. Сочетание «пришёл в город» естественно по-русски передаёт направленное движение и сохраняет формулировку источника.
- source_word: חוּשַׁי
  choice: Хусий
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени.
- source_word: רֵעֶה דָוִד
  choice: друг Давида
  rationale: רֵעֶה означает друга, близкого человека или спутника. «Друг Давида» — прямой и контекстуально уместный перевод, не приписывающий Хусию более узкой официальной должности советника.
- source_word: הָעִיר
  choice: город
  rationale: Сохранено нарицательное существительное оригинала; из контекста ясно, что имеется в виду Иерусалим.
- source_word: וְאַבְשָׁלֹם
  choice: когда Авессалом
  rationale: Союз ו здесь естественно понимать как вводящий сопутствующее по времени действие. В сноске сохранена возможность простого последовательного прочтения «и».
- source_word: יָבֹא
  choice: входил
  rationale: Форма yiqtol после предшествующего wayyiqtol может представлять фоновое или одновременное, ещё разворачивающееся действие; русский несовершенный вид передаёт это различие без излишнего пояснения.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Использована общепринятая русская форма названия города.
theological_decisions:
- issue: Временная связь между приходом Хусия и входом Авессалома
  choice: «когда Авессалом входил» — действия представлены как одновременные или перекрывающиеся во времени
  alternative: «и Авессалом вошёл в Иерусалим» — простая последовательность событий
  rationale: Различие между wayyiqtol וַיָּבֹא и yiqtol יָבֹא поддерживает фоновое или сопутствующее понимание второго действия, однако союз ו допускает и более простое последовательное прочтение; поэтому альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным и достойным звучанием. Традиционные русские формы библейских имён сохранены; синтаксис остаётся понятным широкому кругу читателей.
