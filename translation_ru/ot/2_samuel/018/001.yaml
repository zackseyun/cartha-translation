    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: пересчитал
  rationale: В данном военном контексте פקד означает провести смотр и учёт войска; «пересчитал» естественно передаёт действие, а военный оттенок уточнён в сноске.
- source_word: הָעָם
  choice: людей
  rationale: עם буквально означает «народ, люди»; здесь речь идёт о людях Давида, составлявших его военную силу, но перевод не заменяет исходное слово более узким «воины».
- source_word: אֲשֶׁר אִתּוֹ
  choice: бывших с ним
  rationale: Сохраняет простое указание на тех, кто находился с Давидом, не превращая его без необходимости в формальное «под его командованием».
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: поставил над ними
  rationale: Прямо передаёт сочетание שׂים с עַל и естественно выражает назначение начальников.
- source_word: שָׂרֵי אֲלָפִים
  choice: тысяченачальников
  rationale: Устоявшееся и ёмкое русское обозначение военных начальников над тысячами или соответствующими подразделениями.
- source_word: שָׂרֵי מֵאוֹת
  choice: сотников
  rationale: Устоявшееся русское военное обозначение начальников над сотнями или соответствующими подразделениями; сохраняет параллелизм исходного текста.
