base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: ru
  text: Авессалом случайно встретился с людьми Давида. Он ехал на муле, и мул прошёл под густыми ветвями большого теревинфа[a]. Голова Авессалома застряла в теревинфе, и он повис между небом и землёй, а мул под ним продолжил путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под густыми ветвями большого дуба». Еврейское слово אֵלָה может обозначать большое дерево; «теревинф» — более точный лексический вариант.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא
  choice: случайно оказался
  rationale: Нифаль от קרא в данном контексте указывает на непреднамеренную встречу; формулировка передаёт случайность события и естественно звучит по-русски.
- source_word: לִפְנֵי עַבְדֵי דָוִד
  choice: перед слугами Давида
  rationale: Сохраняет пространственно-реляционное значение לִפְנֵי и лексическую форму עֲבָדִים; в контексте это люди или воины Давида.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: ехал на муле
  rationale: Естественно передаёт причастную конструкцию, описывающую состояние Авессалома во время встречи.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: под густыми ветвями большого теревинфа
  rationale: שׂוֹבֶךְ обозначает густое, переплетённое ветвление; אֵלָה точнее передано как «теревинф», а גְּדוֹלָה — как «большой».
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: Голова Авессалома застряла в теревинфе
  rationale: Передаёт непроизвольное и прочное удерживание головы деревом, не добавляя отсутствующего в еврейском тексте упоминания волос.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: он повис между небом и землёй
  rationale: Контекстуально передаёт результат пассивной формы נתן и сохраняет образное еврейское выражение.
- source_word: עָבָר
  choice: ушёл дальше
  rationale: Ясно передаёт продолжение движения мула после того, как Авессалом застрял.
theological_decisions:
- issue: Чем именно Авессалом зацепился за дерево
  choice: головой
  alternative: волосами
  rationale: Масоретский текст прямо говорит רֹאשׁוֹ, «его голова», и не упоминает волосы; популярную детализацию не следует вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены возвышенный образ «между небом и землёй» и лексическая неоднозначность названия дерева в сноске; устранены ненужные повторы имени там, где русский синтаксис позволяет ясное местоименное продолжение.
