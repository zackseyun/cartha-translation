  source_fidelity: 'В целом перевод точно передаёт последовательность еврейского повествования: случайную встречу, езду на муле, густые ветви большого дерева, то, что застряла именно голова Авессалома, его положение между небом и землёй и дальнейшее движение мула. Однако עַבְדֵי דָוִד в данном военном контексте естественнее передать как «люди Давида», а не «слуги Давида».'
