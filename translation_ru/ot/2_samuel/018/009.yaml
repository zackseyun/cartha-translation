  terminology: Имя «Авессалом» передано нормативно. «Теревинф» — обоснованный точный выбор для אֵלָה; альтернативу «дуб» следует сохранить в сноске, не выдавая её за единственно верную. Упоминание головы, а не волос, верно следует масоретскому тексту.
