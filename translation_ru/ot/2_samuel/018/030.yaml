  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: ru
  text: 'Царь сказал[a]: «Отойди в сторону и встань здесь». Тот отошёл в сторону и встал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Повернись и встань здесь». Еврейский глагол может обозначать поворот вообще, но в данном контексте, вероятно, речь идёт о том, чтобы отойти в сторону и освободить место следующему вестнику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר, вводящая прямую речь; естественный русский эквивалент.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Существительное с определённым артиклем указывает на уже известного из контекста царя; в русском определённость передаётся контекстом.
- source_word: סֹב
  choice: отойди в сторону
  rationale: Императив от סבב обозначает поворот или перемещение. В данном контексте царь, вероятно, велит вестнику отойти в сторону, освободив место следующему гонцу; перевод сохраняет это значение, а иной возможный смысл отмечен в сноске.
- source_word: הִתְיַצֵּב
  choice: встань
  rationale: Императив породы hitpael от יצב означает занять место или встать в определённой позиции; краткое «встань» естественно в сочетании с указанием места.
- source_word: כֹּה
  choice: здесь
  rationale: В этой повелительной конструкции наречие указывает на место, поэтому естественно переводится как «здесь».
- source_word: וַיִּסֹּב
  choice: отошёл в сторону
  rationale: Повествовательная форма того же корня, что и סֹב; повтор формулировки сохраняет связь между приказом и его исполнением.
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Обычное повествовательное употребление עמד; «встал» кратко и естественно передаёт исполнение приказа занять указанное место.
