base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: ru
  text: 'Давид выслал воинов: одну треть — под началом Иоава[a], одну треть — под началом Авишая, сына Церуи, брата Иоава, и одну треть — под началом Иттая из Гата. Царь сказал воинам: «Я тоже непременно пойду с вами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руке Иоава»; это выражение означает «под властью» или «под командованием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: выслал
  rationale: В военном контексте глагол означает отправку войска для участия в сражении; «выслал» естественно передаёт это значение и направленность действия.
- source_word: הָעָם
  choice: воинов
  rationale: Буквально «народ», но в данном контексте речь идёт о людях Давида, выступающих в бой; «воины» ясно обозначает референт без излишнего уточнения.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: треть
  rationale: Форма обозначает каждую из трёх частей, на которые Давид разделил свои силы.
- source_word: בְּיַד
  choice: под началом
  rationale: Буквально «в руке»; это идиома власти и руководства. В русском военном контексте «под началом» звучит естественно.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Авессы, сына Саруи, брата Иоава
  rationale: Сохранены традиционные русские формы имён и обе родственные характеристики в естественной приложительной конструкции.
- source_word: אִתַּי הַגִּתִּי
  choice: Еффея-гефянина
  rationale: Использованы традиционные русские библейские формы имени и обозначения происхождения из Гефа.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Царь сказал
  rationale: Естественная русская повествовательная связь не требует механической передачи начального союза, при этом обозначение Давида как царя сохранено.
- source_word: יָצֹא אֵצֵא
  choice: непременно пойду
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает утверждение; наречие «непременно» передаёт эту эмфазу.
- source_word: גַּם אֲנִי
  choice: я и сам
  rationale: 'Передаёт добавочное и личное ударение: царь заявляет, что также лично выступит вместе с воинами.'
- source_word: עִמָּכֶם
  choice: с вами
  rationale: Прямо передаёт значение совместного участия.
