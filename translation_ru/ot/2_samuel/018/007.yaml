  text: וַ/יִּנָּ֤גְפוּ שָׁם֙ עַ֣ם יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וַ/תְּהִי שָׁ֞ם הַ/מַּגֵּפָ֧ה גְדוֹלָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא עֶשְׂרִ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: ru
  text: 'Там народ Израиля потерпел поражение от слуг Давида, и в тот день там произошло великое побоище[a]: двадцать тысяч человек[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое поражение», «великий удар»; это еврейское слово в других контекстах может также означать «мор». Здесь оно относится к гибельному удару в сражении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «двадцать тысяч». Слово «человек» добавлено для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: потерпел поражение
  rationale: Нифаль глагола נָגַף в военном контексте означает быть разбитым или поражённым; этот вариант ясно передаёт исход сражения, не утверждая, что каждый участник был убит.
- source_word: עַם יִשְׂרָאֵל
  choice: народ Израиля
  rationale: Буквальное соответствие еврейскому выражению; в контексте речь идёт об израильских силах, однако формулировка сохраняет лексику оригинала.
- source_word: לִפְנֵי
  choice: от
  rationale: В конструкции поражения перед противником русский предлог «от» естественно обозначает сторону, нанёсшую поражение.
- source_word: עַבְדֵי דָוִד
  choice: слуг Давида
  rationale: עֶבֶד может обозначать слугу, подданного или состоящего при правителе человека; здесь это сторонники и воины Давида. «Слуги Давида» сохраняет социальную характеристику оригинала.
- source_word: הַמַּגֵּפָה
  choice: побоище
  rationale: מַגֵּפָה может означать удар, поражение или мор, но в данном описании битвы указывает на массовую гибель. «Побоище» естественно передаёт военный контекст и масштаб потерь.
- source_word: גְדוֹלָה
  choice: великое
  rationale: Прямо передаёт значение прилагательного «великий, большой» и соответствует достоинству повествовательного регистра.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественный и точный русский эквивалент стандартного временного выражения.
- source_word: עֶשְׂרִים אָלֶף
  choice: двадцать тысяч человек
  rationale: В оригинале дано только число. Слово «человек» добавлено для ясности как естественное русское обозначение числа погибших или выбывших участников сражения.
