base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: ru
  text: 'Тогда дозорный сказал: «Я вижу, что первый бежит, как Ахимаас, сын Садока».[a] Царь сказал: «Он хороший человек и идёт с доброй вестью».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я вижу бег первого — как бег Ахимааса, сына Садока».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и придёт с доброй вестью»; еврейский глагол можно понять как форму будущего времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: дозорный
  rationale: Причастное существительное обозначает человека, наблюдающего с поста. «Дозорный» естественно и точно передаёт роль персонажа в повествовательном контексте.
- source_word: מְרוּצַת הָרִאשׁוֹן כִּמְרֻצַת
  choice: По бегу первого я вижу, что это…
  rationale: Еврейский текст буквально сопоставляет манеру бега первого человека с бегом Ахимааса. В основном тексте смысл выражен естественно по-русски, а формальная конструкция сохранена в сноске.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Ахимаас, сын Садока
  rationale: Имена переданы в традиционной русской библейской форме; конструкция בן явно выражена словом «сын».
- source_word: אִישׁ טוֹב זֶה
  choice: Он хороший человек
  rationale: Естественная русская передача буквального «хороший человек этот» сохраняет положительную оценку Ахимааса царём.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: и идёт с доброй вестью
  rationale: Выражение передаёт приближение посланника и содержание ожидаемой вести. Настоящее время естественно в непосредственной сцене, однако форма yiqtol допускает будущее понимание, отмеченное в сноске.
