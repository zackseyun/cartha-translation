lexical_decisions:
- source_word: וַיִּתְקַע
  choice: затрубил
  rationale: В сочетании с שׁוֹפָר глагол означает подать сигнал, дуя в рог; «затрубил» естественно передаёт конкретное действие в военном повествовании.
- source_word: בַּשֹּׁפָר
  choice: в рог
  rationale: שׁוֹפָר — сигнальный рог, нередко изготовленный из бараньего рога. «Рог» сохраняет конкретный образ древнего инструмента; возможный идиоматический вариант отмечен в сноске.
- source_word: וַיָּשָׁב הָעָם
  choice: люди повернули назад
  rationale: שׁוּב здесь обозначает прекращение движения вперёд и возвращение; הָעָם буквально означает «народ, люди», а в контексте — воинов Иоава. Основной текст сохраняет более широкое обозначение.
- source_word: מִרְדֹף
  choice: перестав преследовать
  rationale: Предлог מִן с инфинитивом выражает прекращение действия. Деепричастная конструкция естественно связывает прекращение преследования с поворотом назад.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено имя, стоящее в еврейском тексте; из контекста имеются в виду израильские силы, поддерживавшие Авессалома.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину прекращения преследования; «потому что» ясно передаёт эту связь в современном русском языке.
- source_word: חָשַׂךְ
  choice: удержал
  rationale: Глагол может означать «удерживать», «сдерживать», «не допускать» или «щадить». В данном контексте «удержал» передаёт то, что Иоав не позволил своим людям продолжить погоню, не приписывая ему определённого мотива.
- source_word: אֶת הָעָם
  choice: людей
  rationale: Повтор слова «люди» соответствует повтору הָעָם в еврейском тексте и не превращает контекстуальное военное значение в явное добавление.
