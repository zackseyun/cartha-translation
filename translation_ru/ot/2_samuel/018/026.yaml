revisions:
- from: 'Тогда дозорный увидел, что бежит ещё один человек[a], и крикнул привратнику: «Смотри, ещё один человек бежит один». Царь сказал: «И он несёт весть».'
  to: 'Тогда дозорный увидел другого человека, бегущего, и крикнул привратнику: «Смотри, человек бежит один». Царь сказал: «Этот тоже несёт весть[a]».'
  rationale: Перенесён якорь сноски к переводу מְבַשֵּׂר и уточнена её альтернатива. Во второй реплике дозорного убрано невыраженное в еврейском тексте повторение «ещё один». «Этот тоже» сохраняет указательное значение זֶה и включительное значение גַּם, а «несёт весть» оставляет характер новости неопределённым.
