base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: ru
  text: 'Тогда дозорный увидел другого человека, бегущего, и крикнул привратнику: «Смотри, человек бежит один». Царь сказал: «Этот тоже несёт весть[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Этот тоже вестник»; еврейское причастие может обозначать человека, несущего сообщение, часто добрую весть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: дозорный
  rationale: Причастная форма от צפה обозначает человека, который наблюдает с дозорного места; «дозорный» естественно и точно подходит к обстановке у городских ворот.
- source_word: אִישׁ אַחֵר
  choice: ещё один человек
  rationale: אַחֵר выделяет второго бегущего как дополнительного и отличного от первого; по-русски здесь естественнее «ещё один человек».
- source_word: רָץ
  choice: бежит
  rationale: Причастие описывает продолжающееся действие, наблюдаемое дозорным; настоящее время «бежит» сохраняет этот аспект.
- source_word: הַשֹּׁעֵר
  choice: привратник
  rationale: Слово обозначает служителя у городских ворот; «привратник» — точный и литературный русский эквивалент.
- source_word: הִנֵּה
  choice: Смотри
  rationale: Указательная частица привлекает внимание к увиденному; «Смотри» передаёт её живую силу без архаизации.
- source_word: לְבַדּוֹ
  choice: один
  rationale: Форма указывает, что бегущий движется без спутников; краткое «один» естественно в прямой речи.
- source_word: גַּם זֶה
  choice: И он
  rationale: Передаёт включение второго бегущего в ту же категорию, что и первого, не утяжеляя русскую реплику буквальным «и этот».
- source_word: מְבַשֵּׂר
  choice: несёт весть
  rationale: Причастие piel от בשׂר означает принесение сообщения, нередко благой вести; нейтральное «несёт весть» не предрешает характер новости.
