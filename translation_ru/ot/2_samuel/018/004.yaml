  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: ru
  text: 'Царь сказал им[a]: «Я сделаю то, что вы считаете лучшим». Затем царь встал у ворот[b], а весь народ выходил сотнями и тысячами[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «То, что будет хорошо в ваших глазах, я сделаю»; то есть то, что они сочтут наилучшим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рядом с воротами». Еврейское выражение буквально означает «у руки ворот» и указывает на место возле них.'
    reason: lexical_alternative
  - marker: c
    text: То есть организованными воинскими подразделениями — по сотням и по тысячам.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: то, что вы считаете лучшим
  rationale: Еврейская идиома буквально означает «то, что будет хорошо в ваших глазах» и передаёт оценку или одобрение. Выбранный вариант естественно выражает её смысл по-русски; буквальный образ отмечен в сноске.
- source_word: אֶעֱשֶׂה
  choice: Я сделаю
  rationale: Прямая передача формы глагола עשה без добавления отсутствующих в исходном тексте оттенков.
- source_word: אֶל יַד הַשַּׁעַר
  choice: у ворот
  rationale: Выражение буквально связано с «рукой/стороной ворот», но идиоматически обозначает положение рядом с ними. «У ворот» естественно и точно передаёт местонахождение.
- source_word: וְכָל הָעָם
  choice: весь народ
  rationale: Хотя контекст военный и речь идёт о воинах, сохранено широкое исходное слово עָם, «народ», без его сужения до «войска».
- source_word: יָצְאוּ
  choice: выходил
  rationale: Глагол יצא имеет общее значение «выходить». Несовершенный вид по-русски естественно представляет последовательный выход подразделений, не добавляя более узкого значения «выступать строем».
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: сотнями и тысячами
  rationale: Сохраняется числовая структура еврейского выражения; в данном контексте оно обозначает организованные воинские подразделения, что пояснено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Идиома о том, что хорошо «в глазах», передана естественно в основном тексте и сохранена буквально в сноске. Военный характер групп не внесён вместо слова «народ», а пояснён отдельно.
