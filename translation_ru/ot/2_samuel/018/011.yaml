base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: ru
  text: 'Иоав сказал человеку, сообщившему ему об этом: «Ведь ты видел его; почему же ты не сразил его там наземь? А мне надлежало бы[a] дать тебе десять кусков серебра[b] и один пояс».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на мне было бы дать тебе»; возможно также: «я дал бы тебе».'
    reason: Сохраняет идиоматическое значение обязанности в обороте עָלַי + инфинитив и отмечает более простую передачу.
  - marker: b
    text: 'Буквально: «десять серебра»; конкретная единица веса или денежная единица в еврейском тексте не названа.'
    reason: «Кусков» — нейтральное восполнение для естественности русского текста, не отождествляющее серебро с сиклями, монетами или мерами.
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: сообщившему ему об этом
  rationale: Субстантивированное причастие обозначает человека, передавшего Иоаву сообщение; «об этом» естественно восполняет содержание из контекста.
- source_word: וְהִנֵּה רָאִיתָ
  choice: Так ты видел его!
  rationale: Передаёт заострённую реакцию Иоава и подразумеваемое из контекста дополнение — Авессалома; в русском это звучит естественнее буквального «и вот, ты видел».
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: не сразил его там наземь
  rationale: «Сразил» сохраняет образ нанесённого удара, не заменяя его прямым «убил», а «наземь» передаёт направительное אָרְצָה — «к земле, на землю».
- source_word: וְעָלַי לָתֶת לְךָ
  choice: А мне надлежало бы дать тебе
  rationale: Оборот עָלַי с инфинитивом выражает лежащую на говорящем обязанность; «мне надлежало бы» сохраняет эту силу и остаётся понятным современному читателю.
- source_word: עֲשָׂרָה כֶסֶף
  choice: десять мер серебра
  rationale: 'В еврейском тексте единица не названа буквально: «десять серебра». Слово «мер» делает русскую фразу грамматически естественной, не уточняя единицу как сикли.'
- source_word: חֲגֹרָה אֶחָת
  choice: один пояс
  rationale: «Пояс» — ясный современный эквивалент חֲגֹרָה; числительное «один» отражает явное אֶחָת.
theological_decisions:
- issue: Сила оборота עָלַי + инфинитив
  choice: мне надлежало бы дать
  alternative: я дал бы
  rationale: Выбранный вариант сохраняет значение обязанности или обязательства, не сводя оборот к простому обещанию награды; альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной повествовательной интонацией. «Сразил наземь» сохраняет краткость и образность исходной речи, не вводя более определённого «убил».
