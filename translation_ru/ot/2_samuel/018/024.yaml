  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: ru
  text: 'Давид сидел между двумя воротами[a]. Дозорный поднялся на крышу ворот у стены, поднял глаза и увидел: вот, человек бежит один.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между двумя надвратными сооружениями». Буквально по-еврейски: «между двумя воротами»; вероятно, имеется в виду пространство внутри укреплённого входа в город.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: сидел
  rationale: Причастие описывает продолжавшееся положение Давида в данный момент повествования; русское прошедшее несовершенного вида естественно передаёт это состояние.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: между двумя воротами
  rationale: Сохранено буквальное значение еврейского выражения без уточнения архитектуры, которой сам текст прямо не описывает.
- source_word: הַצֹּפֶה
  choice: дозорный
  rationale: Слово обозначает человека, несущего наблюдение; «дозорный» естественно для военного контекста городской стены.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: на крышу ворот у стены
  rationale: Передано движение вверх к верхней части ворот и её пространственная связь со стеной без излишней архитектурной конкретизации.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: поднял глаза
  rationale: Сохранён понятный по-русски еврейский образный оборот.
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'увидел: вот'
  rationale: «Увидел» передаёт действие, а «вот» сохраняет указательную силу הִנֵּה и внезапное предъявление увиденного.
- source_word: אִישׁ
  choice: один человек
  rationale: «Человек» передаёт мужское единичное лицо, а «один» вместе с дальнейшим контекстом естественно подчёркивает, что он был один.
- source_word: רָץ
  choice: бежит
  rationale: Настоящее время после «увидел» живо передаёт наблюдаемое в этот момент продолжающееся действие причастия.
- source_word: לְבַדּוֹ
  choice: один
  rationale: Передаёт, что бегущий был без сопровождения; в русском сочетание «один человек бежит» звучит естественнее, чем буквальное «бежит в одиночку».
