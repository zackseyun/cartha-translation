base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: ru
  text: 'Иоав сказал ему: «Сегодня не тебе быть вестником[a]. В другой день сможешь принести весть, но сегодня не неси вести, потому что сын царя мёртв».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нести добрую весть». Еврейское слово может обозначать весть вообще, но часто подразумевает радостную весть; здесь речь идёт о смерти царского сына.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: не тебе нести весть
  rationale: 'Буквально — «не человек вести ты сегодня». Русская конструкция «не тебе нести весть» естественно передаёт ситуативный смысл: сегодня Ахимаасу не назначено быть вестником. Слово בְּשֹׂרָה может означать как весть вообще, так и добрую весть; неоднозначность отмечена в сноске.'
- source_word: וּבִשַּׂרְתָּ
  choice: Понесёшь её
  rationale: 'Перфект с вавом в данном контексте указывает на возможность или разрешение в будущем: в другой день он сможет выступить вестником. Краткая форма сохраняет повтор корня בשׂר без тяжеловесности.'
- source_word: לֹא תְבַשֵּׂר
  choice: не неси
  rationale: Имперфект с לֹא в прямой речи выражает запрет применительно к нынешнему дню. Русское повелительное «не неси» ясно передаёт распоряжение Иоава.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину запрета и естественно передаётся причинной конструкцией.
- source_word: בֶּן הַמֶּלֶךְ
  choice: сын царя
  rationale: Точно и естественно передаёт еврейскую сопряжённую конструкцию.
- source_word: מֵת
  choice: мёртв
  rationale: 'Сохраняет результативно-состоянийный смысл: царский сын находится среди мёртвых; форма лаконична и соответствует контексту.'
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Современный естественный эквивалент повторяющегося выражения «в этот день»; повтор сохранён ради смыслового противопоставления с другим днём.
