translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный регистр. Идиоматическое «не тебе нести весть» заменяет неестественное буквальное «ты не человек вести», при этом сохраняет временное ограничение «сегодня». Повтор «сегодня» оставлен, как в еврейском тексте.
