  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: отказ Иоава медлить, три орудия в руке, их вонзание в сердце Авессалома, его пребывание в живых и образ нахождения «в сердце теревинфа». «Копья» является контекстуально вероятным, но не бесспорным уточнением для שְׁבָטִים; лексическая альтернатива надлежащим образом сохранена в сноске. Необычный повтор «сердце ... сердце» обоснованно оставлен, поскольку отражает повтор לֵב в оригинале.'
  naturalness: Текст написан на современном литературном русском языке и сохраняет сжатый, повествовательный библейский регистр. Формула «не стану медлить перед тобой» несколько буквальна, но понятна, стилистически уместна и не снимает заложенную в לְפָנֶיךָ неопределённость. «В сердце теревинфа» намеренно необычно, но оправдано исходным образом.
