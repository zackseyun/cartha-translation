base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: ru
  text: 'Иоав сказал: «Нет, я не стану медлить перед тобой». Он взял в руку три копья[a] и вонзил их в сердце Авессалома, пока тот был ещё жив в сердце теревинфа[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «три прута (посоха)». Еврейское слово может означать прут, посох или жезл, но здесь, вероятно, речь идёт о колющем оружии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дуба». Еврейское слово אֵלָה обычно обозначает теревинф, однако его также переводят более общим словом «дуб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֹחִילָה לְפָנֶיךָ
  choice: Нет, я не стану медлить перед тобой
  rationale: «Медлить» естественно передаёт каузативную форму יחל в контексте отказа Иоава ждать; «перед тобой» сохраняет пространственно-личную идиому לְפָנֶיךָ, не уточняя сверх текста, означает ли она просто присутствие собеседника или его наблюдение.
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: три копья
  rationale: Слово שֵׁבֶט обычно обозначает жезл, прут или посох, однако военный контекст и последующее вонзание указывают на колющее оружие. «Копья» ясно передаёт вероятную функцию предметов; буквальный диапазон отмечен в сноске.
- source_word: וַיִּתְקָעֵם
  choice: вонзил их
  rationale: Глагол תקע здесь выражает сильное колющее движение. «Вонзил» звучит естественно и сохраняет насильственный характер действия.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: в сердце Авессалома
  rationale: Сохранено прямое анатомическое значение לֵב; оно не заменено более общим «грудь».
- source_word: עוֹדֶנּוּ חַי
  choice: пока тот был ещё жив
  rationale: Фраза подчёркивает, что в момент удара Авессалом ещё не умер; местоимение «тот» естественно разграничивает его и Иоава.
- source_word: בְּלֵב הָאֵלָה
  choice: в сердце теревинфа
  rationale: Буквальное «в сердце» означает внутреннюю часть или середину дерева и сохраняет намеренный словесный переклик с «сердцем Авессалома». אֵלָה преимущественно обозначает теревинф; вариант «дуб» указан в сноске.
