  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: ru
  text: 'Но народ сказал: «Не выходи. Если мы обратимся в бегство, они не обратят на нас внимания; и если половина из нас погибнет, они не обратят на нас внимания. Ведь ты для нас стоишь десяти тысяч. Поэтому лучше, чтобы ты помогал нам из города».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Не выходи с нами
  rationale: Отрицание с формой несовершенного вида в прямой речи передаёт настойчивое запрещение. «С нами» естественно выражает подразумеваемый выход вместе с войском, не меняя смысла.
- source_word: כִּי אִם נֹס נָנוּס
  choice: Если мы обратимся в бегство
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагол; русское выражение «обратимся в бегство» естественно передаёт военный контекст и решительность действия.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: они не обратят на нас внимания
  rationale: Буквально «не направят к нам сердце»; это идиома со значением «не уделят внимания, не придадут значения».
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: и даже если половина из нас погибнет
  rationale: Глагол означает «умереть, погибнуть». Частица «даже» естественно выявляет уступительную силу параллельного условия в данном контексте.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Ведь теперь таких, как мы, — десять тысяч
  rationale: Перевод следует масоретскому тексту WLC, где стоит עַתָּה, «теперь», а не אַתָּה, «ты». Более привычное чтение о ценности Давида отражено в примечании как текстовый вариант, а не внесено молча в основной текст.
- source_word: וְעַתָּה טוֹב
  choice: Поэтому будет лучше
  rationale: טוֹב здесь обозначает предпочтительный образ действий; причинно-следственная связь естественно передана словом «поэтому».
- source_word: מֵעִיר לְעָזִיר
  choice: из города ... будешь помогать нам
  rationale: Предлог מִן указывает на исходную точку помощи, а форма от עזר означает «помогать, приходить на помощь». Формулировка не уточняет без достаточных оснований, идёт ли речь о подкреплении или иной поддержке.
