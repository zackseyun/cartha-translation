base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: ru
  text: 'Тогда Иоав сказал кушитянину[a]: «Ступай, расскажи царю о том, что ты видел». Кушитянин поклонился Иоаву и побежал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Куши», если это личное имя; традиционный перевод — «эфиоп» или «эфиоплянин».'
    reason: Лексема כּוּשִׁי может быть понята как обозначение происхождения либо как личное имя; традиционный географический эквивалент менее точен по отношению к древнему Кушу.
lexical_decisions:
- source_word: כּוּשִׁי
  choice: кушитянин
  rationale: Передаёт еврейское обозначение человека по происхождению из Куша; это прозрачнее и точнее традиционного «эфиоп» и не исключает отмеченную в сноске возможность понимания слова как имени.
- source_word: לֵךְ
  choice: Ступай
  rationale: Естественная русская форма прямого приказания, соответствующая императиву «иди» и уместная в повествовательном диалоге.
- source_word: הַגֵּד
  choice: расскажи
  rationale: Хифиль от נגד означает сообщить, довести до сведения; «расскажи царю» естественно передаёт конструкцию и не придаёт ей излишне официального оттенка.
- source_word: אֲשֶׁר רָאִיתָה
  choice: о том, что ты видел
  rationale: Сохраняет содержание относительной конструкции и естественно связывается в русском языке с глаголом «расскажи».
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Передаёт почтительный телесный жест перед Иоавом, не истолковывая его как поклонение и не уточняя без необходимости, что человек пал ниц.
- source_word: וַיָּרֹץ
  choice: побежал
  rationale: Прямо передаёт повествовательную форму глагола רוץ и сохраняет динамику эпизода.
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: «Тогда» естественно обозначает последовательное развитие повествования, выраженное формой с вау-последовательным.
