  source_fidelity: 'Перевод точно передаёт последовательность действий и основные формы еврейского текста: Иоав обращается к кушитянину, повелевает ему сообщить царю увиденное; тот выражает почтение Иоаву и бежит. «О том, что ты видел» естественно передаёт אֲשֶׁר רָאִיתָה, не добавляя нового содержания.'
