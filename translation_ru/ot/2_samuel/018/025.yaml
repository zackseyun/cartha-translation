lexical_decisions:
- source_word: הַצֹּפֶה
  choice: страж
  rationale: Причастно-именная форма обозначает человека, поставленного наблюдать; «страж» естественно звучит в контексте городских ворот и сохраняет исторический регистр.
- source_word: וַיִּקְרָא
  choice: крикнул
  rationale: Глагол здесь означает громко позвать или возвестить; «крикнул» передаёт необходимое повышение голоса без лишней экспрессии.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: доложил царю
  rationale: Порода Hiphil глагола נגד означает сообщить или известить; в военном и придворном контексте русское «доложил» наиболее естественно.
- source_word: אִם לְבַדּוֹ
  choice: Если он один
  rationale: Перевод прямо передаёт состояние посланца, идущего в одиночку, не добавляя отсутствующего в еврейском тексте глагола движения.
- source_word: בְּשׂוֹרָה
  choice: весть
  rationale: Существительное может обозначать весть вообще, хотя контекст допускает и благоприятную весть. Основной текст сохраняет эту лексическую неоднозначность.
- source_word: בְּפִיו
  choice: значит, несёт весть
  rationale: Буквальное «весть в его устах» понятно, но в современном русском звучит неестественно; «несёт весть» передаёт смысл идиомы, а «значит» выражает вывод царя из того, что бегущий один.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: подходил всё ближе и ближе
  rationale: Сочетание передаёт длительное, поступательное приближение; русская конструкция естественно воспроизводит прогрессивный характер действия.
