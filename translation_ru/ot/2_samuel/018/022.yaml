base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: ru
  text: 'Ахимаас, сын Садока, снова сказал Иоаву: «Что бы ни случилось[a], позволь и мне побежать вслед за кушитом». Но Иоав ответил: «Зачем тебе бежать, сын мой? У тебя нет вести, которая принесла бы тебе пользу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будь что будет».'
    reason: Лексический вариант передачи идиомы וִיהִי מָה.
  - marker: b
    text: 'Еврейская фраза в конце стиха трудна для понимания. Возможно: «у тебя нет вести, которую благосклонно примут» или «за эту весть ты не получишь награды».'
    reason: Сохранение неоднозначности выражения אֵין בְּשׂוֹרָה מֹצֵאת.
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: снова сказал
  rationale: Еврейское сочетание буквально означает «ещё добавил» и указывает на повторную настойчивую просьбу; «снова сказал» естественно передаёт эту функцию.
- source_word: וִיהִי מָה
  choice: что бы ни случилось
  rationale: Устойчивое выражение передаёт готовность действовать независимо от последствий; выбран современный и ясный русский эквивалент.
- source_word: אָרֻצָה נָּא
  choice: позволь ... побежать
  rationale: Когортатив с נָא выражает настойчивую, но вежливую просьбу; конструкция «позволь мне» естественно передаёт волевой оттенок.
- source_word: גַם אֲנִי
  choice: и мне
  rationale: Подчёркивает желание Ахимааса также стать гонцом вслед за уже посланным человеком.
- source_word: הַכּוּשִׁי
  choice: кушит
  rationale: Прямая передача этнонима, не отождествляющая древний Куш без оговорок с современной Эфиопией.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Зачем тебе бежать?
  rationale: Естественный русский вопрос сохраняет недоумение и возражение Иоава, хотя указательное זֶה не передано отдельным словом.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет обращение, выражающее расположение или покровительственный тон, без предположения о буквальном родстве.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: Эта весть ничего тебе не принесёт
  rationale: Эллиптическая и трудная еврейская фраза допускает смысл отсутствия выгоды, награды или благоприятного приёма. Нейтральная формулировка сохраняет эту смысловую широту, а варианты разъяснены в сноске.
