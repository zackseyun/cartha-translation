base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: ru
  text: 'Но он сказал: «Что бы ни случилось, позволь мне бежать». Тогда Иоав сказал ему: «Беги». И Ахимаас побежал по дороге через равнину[b] и обогнал кушита[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Вероятно, имеется в виду равнина Иордана; в еврейском тексте это географическое уточнение прямо не выражено.
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «миновал кушита».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: Что бы ни случилось, я побегу
  rationale: 'Идиоматическое выражение передаёт настойчивость Ахимааса: он намерен бежать независимо от обстоятельств. Формулировка сохраняет уступительный оттенок и естественно звучит по-русски.'
- source_word: רוּץ
  choice: Беги
  rationale: Прямой перевод повелительной формы глагола רוץ.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: дорогой через равнину
  rationale: Передаёт как דֶּרֶךְ — «дорога, путь», так и הַכִּכָּר — «равнина», не уточняя в основном тексте географию сверх сказанного на иврите.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: и обогнал кушита
  rationale: В контексте бега עבר с прямым дополнением означает, что Ахимаас настиг и опередил другого гонца. «Обогнал» передаёт это естественнее, чем буквальное «прошёл мимо».
- source_word: הַכּוּשִׁי
  choice: кушита
  rationale: Сохраняет этногеографическое обозначение человека из Куша, не подменяя его традиционным, но менее точным названием «эфиоп».
- source_word: אֲחִימַעַץ
  choice: Ахимаас
  rationale: Устоявшаяся русская библейская передача личного имени.
