  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: ru
  text: 'Но тот человек ответил Иоаву: «Даже если бы мне на ладони отвесили тысячу серебра[a], я не поднял бы руки на царского сына, ведь мы сами слышали, как царь приказал тебе, Авессе и Еффею: „Берегите для меня юношу Авессалома“[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если бы я взвешивал на своих ладонях тысячу серебра». Имеется в виду получение большой платы серебром, которое отвешивали по весу; название денежной единицы в еврейском тексте не указано.'
    reason: lexical_alternative
  - marker: b
    text: 'Конец еврейского текста труден: буквально — «берегите ми юношу, Авессалома». Слово «ми» передаёт еврейское מִי и в данном контексте неясно. По смыслу и в свете 18:5 многие понимают: «Берегите для меня юношу Авессалома».'
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: если бы мне отвесили тысячу серебряных монет прямо в руки
  rationale: Сохраняет образ серебра, отвешиваемого как плата, и естественно передаёт условно-уступительный смысл. «Монет» употреблено как понятное обозначение серебряных денежных единиц без уточнения не названной в еврейском тексте меры.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: я не поднял бы руки на
  rationale: Естественная русская идиома, сохраняющая образ руки и выражающая насильственное действие против человека.
- source_word: בֶּן הַמֶּלֶךְ
  choice: царского сына
  rationale: Прямо и естественно передаёт конструкцию принадлежности и подчёркивает статус Авессалома.
- source_word: בְאָזְנֵינוּ
  choice: мы сами слышали
  rationale: Передаёт смысл непосредственного свидетельства; «сами» воспроизводит эмфатический оттенок выражения.
- source_word: צִוָּה
  choice: приказал
  rationale: Соответствует властному распоряжению царя и звучит естественно в современной русской речи.
- source_word: שִׁמְרוּ
  choice: Сберегите
  rationale: В данном контексте означает сохранить в безопасности, а не просто наблюдать или охранять; слово согласуется с защитительной просьбой Давида в 18:5.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: для меня юношу Авессалома
  rationale: Передаёт наиболее вероятный контекстуальный смысл трудного масоретского чтения, не скрывая проблему благодаря сноске.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Определённый артикль указывает на уже упомянутого участника повествования; «тот» естественно связывает реплику с предыдущим контекстом.
- source_word: וְלֹא אָנֹכִי
  choice: Даже если бы… я не…
  rationale: Условно-уступительная конструкция естественно передаёт подчёркнутый отказ говорящего.
theological_decisions:
- issue: Смысл трудного чтения מִי в повелении о защите Авессалома
  choice: «Сберегите для меня юношу Авессалома» в основном тексте с текстологической сноской
  alternative: «Сберегите юношу Авессалома» или буквальное, но неясное воспроизведение מִי
  rationale: Контекст и параллельное повеление в 2 Цар. 18:5 поддерживают значение «для меня», однако масоретское чтение остаётся трудным и потому явно отмечено, без догматического разрешения неоднозначности.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Имена переданы в традиционной русской библейской форме: Иоав, Авесса, Еффей, Авессалом. Основной текст сделан ясным и естественным, а лексическая и текстологическая трудности сохранены в сносках.'
