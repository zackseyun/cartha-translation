  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: ru
  text: И вышло войско в поле навстречу Израилю[a], и сражение произошло в Ефремовом лесу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «народ»; здесь это слово обозначает войско Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: войско
  rationale: Обычно существительное означает «народ», но в данном военном контексте обозначает воинов Давида; «войско» естественно и точно передаёт контекстуальный смысл.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: Существительное означает «поле, открытая местность»; при глаголе «вышло» форма «в поле» естественно передаёт движение к месту боя.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Прямое значение — «навстречу, для встречи»; враждебный характер встречи ясен из военного контекста, поэтому усиление до «против» не требуется.
- source_word: יִשְׂרָאֵל
  choice: Израилю
  rationale: Сохранено данное в еврейском тексте имя «Израиль», хотя в контексте речь идёт о силах, выступивших на стороне Авессалома.
- source_word: הַמִּלְחָמָה
  choice: сражение
  rationale: Здесь слово обозначает конкретное боевое столкновение, а не войну в целом.
- source_word: וַתְּהִי
  choice: произошло
  rationale: Буквально глагол означает «было, стало»; с существительным «сражение» русский оборот «сражение произошло» звучит естественно и сохраняет смысл.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: в Ефремовом лесу
  rationale: Естественная русская передача сочетания «лес Ефрема», сохраняющая название места и не пытающаяся разрешить связанные с его географией вопросы.
