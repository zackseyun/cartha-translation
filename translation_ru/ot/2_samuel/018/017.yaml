base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: ru
  text: Они взяли Авессалома, бросили его в большую яму в лесу и сложили над ним огромную груду камней. А весь Израиль разбежался — каждый к своему шатру.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть каждый разошёлся к себе домой.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Прямое и естественное соответствие обычному повествовательному употреблению לקח; не добавляет значения насильственного захвата.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: бросили его
  rationale: Передаёт энергичное действие и унизительное обращение с телом без архаичного оттенка.
- source_word: בַיַּעַר אֶל הַפַּחַת הַגָּדוֹל
  choice: в большую яму в лесу
  rationale: פחת обозначает яму или углубление; русский порядок слов ясно передаёт, что яма находилась в лесу.
- source_word: וַיַּצִּבוּ עָלָיו גַּל אֲבָנִים
  choice: сложили над ним груду камней
  rationale: Естественно описывает сооружение каменной груды над телом и сохраняет пространственное значение עָלָיו.
- source_word: גָּדוֹל מְאֹד
  choice: огромную
  rationale: Кратко и естественно передаёт усиленное сочетание «очень большая» применительно к груде камней.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: А весь Израиль разбежался
  rationale: Сохраняет собирательное название народа и передаёт бегство множества людей естественным русским глаголом.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: каждый к своему шатру
  rationale: Сохраняет распределительное значение איש и буквальный образ шатра; идиоматический смысл пояснён в сноске.
theological_decisions:
- issue: Буквальное или идиоматическое понимание לְאֹהָלוֹ
  choice: к своему шатру
  alternative: к себе домой
  rationale: Буквальный образ понятен по-русски и сохраняет фактуру исходного текста, тогда как идиоматический смысл жилища или дома указан в сноске.
- issue: Распределительное мужское единственное אִישׁ
  choice: каждый
  alternative: каждый мужчина
  rationale: В этой устойчивой распределительной конструкции איש означает каждого участника бегущего войска; «каждый» точно и естественно передаёт функцию формы, не вводя ненужного акцента на поле.
translation_notes:
  register: 'Современная литературная русская повествовательная речь: ясная, сдержанная и достойная. Сохранены собирательное «весь Израиль» и конкретный образ шатра; синтаксис слегка сглажен для естественного русского звучания.'
