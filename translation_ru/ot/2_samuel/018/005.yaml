base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: ru
  text: 'И царь приказал Иоаву, Авессе и Еффею: «Ради меня обойдитесь бережно с юношей Авессаломом[a]». И весь народ слышал, как царь отдавал всем военачальникам приказ об Авессаломе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ради меня пощадите юношу Авессалома». Еврейская фраза кратко соединяет личную просьбу царя, требование мягкого обращения и уточнение имени Авессалома.'
    reason: Сохраняет возможный военный оттенок пощады, не подменяя им в основном тексте более широкое значение לְאַט — «бережно, мягко обращаться».
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: И царь приказал
  rationale: Глагол צוה выражает властное повеление; «приказал» естественно передаёт его силу в военном контексте, а титул «царь» сохранён вместо замены именем Давида.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: Иоаву, Авессе и Еффею
  rationale: Имена переданы в традиционной русской библейской форме; дательный падеж естественно обозначает адресатов приказа.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартный древнееврейский ввод прямой речи в современном русском не требует отдельного слова «говоря».
- source_word: לְאַט לִי
  choice: Ради меня пощадите
  rationale: לְאַט требует мягкого, сдержанного обращения, а לִי выражает личную просьбу царя. В боевой ситуации «пощадите» естественно передаёт требуемую снисходительность, не сводя приказ лишь к манере обращения.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: юношу Авессалома
  rationale: נַעַר здесь выражает отцовское восприятие взрослого сына как молодого человека; «юноша» сохраняет эту эмоциональную окраску. Второе לְ понято как уточняющее приложение к «юноше».
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: И весь народ слышал
  rationale: Сохранено буквальное «народ», хотя по контексту имеются в виду собравшиеся воины; глагол подчёркивает публичность приказа.
- source_word: בְּצַוֹּת הַמֶּלֶךְ
  choice: как царь отдавал ... приказ
  rationale: Предлог בְּ с инфинитивом передаёт сопутствующее или одновременное обстоятельство; русское «как» здесь естественно описывает услышанное действие.
- source_word: כָּל הַשָּׂרִים
  choice: всем военачальникам
  rationale: שָׂרִים в непосредственном военном контексте обозначает начальников войска, а не гражданских сановников.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: об Авессаломе
  rationale: Кратко и естественно передаёт значение «касательно Авессалома».
