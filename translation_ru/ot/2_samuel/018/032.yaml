base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: ru
  text: 'Тогда царь спросил кушита: «Всё ли благополучно с юношей Авессаломом[a]?» Кушит ответил: «Пусть враги моего господина, царя, и все, кто восстаёт против тебя со злым умыслом, будут как этот юноша[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально вопрос поставлен о «мире» юноши. Еврейское שָׁלוֹם означает благополучие, целость и безопасность, поэтому речь шире, чем только о том, остался ли он жив.
    reason: lexical_alternative
  - marker: b
    text: 'Кушит отвечает косвенно: он не говорит прямо о смерти Авессалома, но даёт понять, что того постигла участь врага царя.'
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: кушит
  rationale: Еврейское обозначение уроженца или жителя Куша. «Кушит» сохраняет древнее географическое наименование и не отождествляет его безоговорочно с современной Эфиопией.
- source_word: הֲשָׁלוֹם לַנַּעַר לְאַבְשָׁלוֹם
  choice: Всё ли благополучно с юношей Авессаломом?
  rationale: שָׁלוֹם обозначает мир, целость и благополучие; вопрос касается участи Авессалома в целом, включая его безопасность и жизнь. Русская формулировка естественна и сохраняет эту смысловую широту.
- source_word: לַנַּעַר / כַנַּעַר
  choice: с юношей / как этот юноша
  rationale: נַעַר допускает значения «отрок», «юноша», «молодой человек». Хотя Авессалом взрослый, в данном контексте «юноша» передаёт взгляд отца и повтор исходного слова.
- source_word: יִהְיוּ
  choice: Пусть ... будут
  rationale: Форма выражает пожелание с оттенком проклятия, а не простое предсказание.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: враги моего господина царя
  rationale: Сохранены придворное обращение и связь врагов с царём; порядок слов остаётся понятным в современном русском.
- source_word: קָמוּ עָלֶיךָ לְרָעָה
  choice: кто восстаёт против тебя со злым умыслом
  rationale: קום על обозначает враждебное выступление или мятеж, а לְרָעָה — злую, губительную цель. «Со злым умыслом» естественно передаёт намерение причинить зло.
theological_decisions:
- issue: Косвенное сообщение о смерти Авессалома
  choice: «будут как этот юноша»
  alternative: «разделят участь этого юноши» или прямое «пусть погибнут, как он»
  rationale: Кушит не произносит прямо, что Авессалом умер. Сравнительная конструкция сохраняет уклончивость ответа и эмоциональное напряжение повествования, не добавляя явного утверждения о смерти.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Придворное обращение сохранено без архаизмов; косвенность ответа и повтор слова «юноша» воспроизведены.
