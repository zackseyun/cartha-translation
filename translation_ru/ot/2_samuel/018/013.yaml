  text: אֽוֹ עָשִׂ֤יתִי ב/נפש/ו שֶׁ֔קֶר וְ/כָל דָּבָ֖ר לֹא יִכָּחֵ֣ד מִן הַ/מֶּ֑לֶךְ וְ/אַתָּ֖ה תִּתְיַצֵּ֥ב מִ/נֶּֽגֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: ru
  text: Или, если бы я вероломно посягнул на его жизнь, — а от царя ничто не укроется, — ты сам остался бы в стороне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: я вероломно посягнул на его жизнь
  rationale: Сочетание буквально связывает совершение «лжи/вероломства» с жизнью Авессалома. Русское «вероломно посягнул на его жизнь» естественно передаёт предательское причинение смертельного вреда, не утверждая прямо, что убийство состоялось.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: а от царя ничто не укроется
  rationale: Передаёт широкое значение דָּבָר («дело, обстоятельство, известие») и пассивную идею «не будет скрыто» естественным русским оборотом.
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: остался бы в стороне
  rationale: В данном контексте выражение означает отстраниться и не прийти на помощь; вариант сохраняет обвинительный смысл, не усиливая его до прямого противодействия.
