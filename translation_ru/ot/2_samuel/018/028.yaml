base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: ru
  text: 'Ахимаас громко воззвал к царю: «Мир!»[a] Затем он пал ниц перед царём, лицом к земле, и сказал: «Благословен Яхве, твой Бог, который отдал во власть[b] людей, поднявших руку на моего господина царя!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё благополучно!» Еврейское слово «шалом» здесь может быть не только приветствием, но и сообщением о благополучном исходе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предал»; «передал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: громко воззвал
  rationale: Глагол обозначает обращение возвышенным голосом; в сцене прибытия вестника это естественно передаёт его возглас к царю.
- source_word: שָׁלוֹם
  choice: Мир!
  rationale: 'Краткое соответствие сохраняет многозначность еврейского слова: это может быть и приветствие, и сообщение о благополучном исходе.'
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: пал ниц перед царём, лицом до земли
  rationale: Передаёт конкретную телесную позу полного почтительного преклонения, не заменяя её отвлечённым толкованием.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Благословен Яхве, твой Бог
  rationale: Сохраняет традиционную хвалебную формулу и личное имя Бога в форме, принятой проектом.
- source_word: סִגַּר
  choice: предал
  rationale: В данном военно-политическом контексте глагол означает передачу противников во власть другого; дополнение «в руки» в еврейском тексте отсутствует.
- source_word: הָאֲנָשִׁים
  choice: людей
  rationale: Речь идёт о конкретных участниках мятежа; русское «людей» естественно и не добавляет лишнего акцента на поле.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: поднявших руку на
  rationale: Сохраняет образ еврейской идиомы, обозначающей враждебное выступление или мятеж.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: на моего господина царя
  rationale: Передаёт придворную почтительность Ахимааса к Давиду и естественно сочетается с русской идиомой «поднять руку на».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя и следует установленной для проекта передаче, не подменяя имя титулом.
- issue: Характер Божьего действия в סִגַּר
  choice: предал людей
  alternative: запер людей; отдал людей в руки
  rationale: Контекст говорит о том, что Бог отдал противников во власть победившей стороны. Формулировка не добавляет отсутствующего в оригинале указания «в наши руки».
translation_notes:
  register: Современный литературный русский язык с достоинством придворной сцены. Синтаксис сделан естественным для повествования, при этом сохранены краткий возглас вестника, конкретная поза преклонения и образ поднятой против царя руки.
