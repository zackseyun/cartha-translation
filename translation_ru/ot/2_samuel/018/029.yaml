  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: ru
  text: 'Царь спросил: «Всё ли благополучно с юношей Авессаломом?» Ахимаас ответил: «Я видел большое смятение[a], когда Иоав послал слугу царя и твоего слугу, но не знал, что это было».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большое скопление людей»; или: «сильный шум». Еврейское слово может обозначать множество людей, шум или суматоху.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לַנַּעַר לְאַבְשָׁלוֹם
  choice: Всё ли благополучно с юношей Авессаломом?
  rationale: В вопросе שָׁלוֹם означает благополучие и целость, а не только отсутствие войны. Формулировка сохраняет общий вопрос Давида о состоянии Авессалома, не сужая его до одной лишь физической безопасности.
- source_word: לַנַּעַר
  choice: с юношей
  rationale: נַעַר здесь обозначает молодого мужчину; «юноша» сохраняет несколько отстранённую и вместе с тем эмоционально значимую форму, которой Давид называет сына.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: сильное смятение
  rationale: הָמוֹן может обозначать множество людей, шум или суматоху. «Сильное смятение» естественно передаёт неопределённое сочетание движения, шума и беспорядка; другие возможные оттенки указаны в сноске.
- source_word: לִשְׁלֹחַ
  choice: когда Иоав посылал
  rationale: Инфинитивная конструкция естественно передана временным придаточным. Несовершенный вид «посылал» соответствует описанию увиденной Ахимаасом обстановки в момент отправки вестников.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: слугу царя
  rationale: עֶבֶד в данном контексте обозначает подчинённого царского служителя или посланца; «слуга» не вносит излишне узкого указания на рабский статус.
- source_word: וְאֶת עַבְדֶּךָ
  choice: и твоего слугу
  rationale: Сохранена принятая при дворе почтительная формула самообозначения Ахимааса без пояснительной вставки «меня».
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: но не знал, что произошло
  rationale: 'В еврейском тексте фраза эллиптична: буквально «но не знал, что». Добавление «произошло» делает её естественной по-русски, не уточняя содержание неизвестного.'
