base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: ru
  text: 'Тогда Ахимаас, сын Садока, сказал: «Позволь мне побежать и принести царю добрую весть[a], ибо Яхве рассудил его дело в его пользу[b], избавив его от власти врагов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принести царю весть». Еврейский глагол может означать просто «сообщить весть», но нередко относится к доброй вести; здесь это соответствует контексту победы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассудил за него», «воздал ему по праву» или, по смыслу результата, «избавил его». Еврейский глагол имеет судебный оттенок: Яхве вынес решение в пользу царя, избавив его от власти врагов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִימַעַץ בֶּן־צָדוֹק אָמַר
  choice: Тогда Ахимаас, сын Садока, сказал
  rationale: Союз וַ продвигает повествование и естественно передаётся словом «тогда»; родственная формула и глагол речи переведены прямо.
- source_word: אָרוּצָה נָּא
  choice: Позволь мне побежать
  rationale: Когортатив выражает желание говорящего, а נָא придаёт просьбе вежливый характер.
- source_word: וַאֲבַשְּׂרָה אֶת־הַמֶּלֶךְ
  choice: и принести царю добрую весть
  rationale: Пиэль בשׂר означает сообщить весть и нередко подразумевает благую весть; в данном контексте речь идёт о победе, поэтому этот положительный оттенок уместно выразить в тексте.
- source_word: כִּי
  choice: о том, что
  rationale: Частица вводит содержание вести; русская конструкция естественно связывает её с «принести ... весть».
- source_word: שְׁפָטוֹ יְהוָה
  choice: Яхве восстановил его справедливость
  rationale: 'Глагол שׁפט с местоименным суффиксом допускает судебный смысл: Яхве рассудил дело в пользу царя и восстановил его права. Формулировка сохраняет эту судебную составляющую.'
- source_word: מִיַּד אֹיְבָיו
  choice: избавив от руки его врагов
  rationale: Предлог מן с образом «руки» обозначает освобождение из-под власти врагов; деепричастная конструкция показывает, как проявилось Божье решение, сохраняя исходный образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Судебный или исключительно спасительный смысл שְׁפָטוֹ
  choice: «восстановил его справедливость», с последующим пояснением об избавлении
  alternative: «избавил его» / «рассудил в его пользу»
  rationale: Корень שׁפט несёт судебную семантику, тогда как מִיַּד אֹיְבָיו указывает на практический результат — избавление от власти врагов. Перевод сохраняет оба аспекта и не сводит первый к одному лишь спасению.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой и понятный; сохранены личное имя Яхве, образ «руки врагов» и судебно-спасительная многозначность שׁפט.
