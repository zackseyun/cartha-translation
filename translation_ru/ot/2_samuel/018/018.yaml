base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: ru
  text: 'Ещё при жизни Авессалом взял и поставил себе памятный столб, который находится в долине Царя, ибо сказал: «Нет у меня сына, чтобы сохранять память о моём имени». Он назвал этот столб по своему имени, и доныне он называется «Памятник Авессалома»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Рука Авессалома». Здесь слово «рука» употреблено в значении памятного знака или монумента.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב
  choice: поставил
  rationale: Сочетание «взял и поставил» передаёт последовательность буквально, но в данном контексте еврейское לָקַח не добавляет существенного отдельного действия и по-русски звучало бы разговорно. «Поставил» естественно передаёт сооружение стоячего памятного камня.
- source_word: בְחַיּו
  choice: ещё при жизни
  rationale: Естественное русское выражение, подчёркивающее, что Авессалом воздвиг памятник себе сам, пока был жив.
- source_word: מַצֶּבֶת
  choice: памятный столб
  rationale: Слово обозначает установленный вертикально камень или столб. Сочетание сохраняет конкретный образ и одновременно ясно выражает мемориальную функцию.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: в Царской долине
  rationale: Краткая и естественная передача географического названия «долина царя»; прописная буква указывает на собственное название.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: который сохранил бы память о моём имени
  rationale: Целевая конструкция означает продолжение памяти об имени Авессалома. Русская формулировка передаёт и память, и предполагаемую роль сына.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: Он назвал этот столб своим именем
  rationale: 'Точно и естественно передаёт идиому: Авессалом дал столбу собственное имя.'
- source_word: יַד אַבְשָׁלוֹם
  choice: Памятник Авессалома
  rationale: Буквально יָד означает «рука», но здесь это идиоматическое обозначение памятного знака или монумента. Смысл вынесен в основной текст, буквальная форма отмечена в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: доныне
  rationale: Литературная, понятная и краткая передача формулы «до этого дня», указывающей, что название сохранялось ко времени повествователя.
theological_decisions:
- issue: Слова Авессалома «Нет у меня сына» при упоминании его сыновей в 2 Царств 14:27
  choice: Сохранено прямое утверждение «Нет у меня сына» без согласования с другим местом
  alternative: 'Уточнить: «нет сына, который сохранил бы моё имя», предполагая смерть сыновей или отсутствие наследника'
  rationale: Еврейский текст прямо говорит אֵין לִי בֵן. Перевод не должен устранять повествовательное напряжение посредством отсутствующего в стихе объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Доныне» сохраняет достоинство повествования, оставаясь общеупотребительным. Маркер сноски поставлен непосредственно после выражения, которое поясняет.
