  text: Тогда десять молодых людей, оруженосцев Иоава, окружили Авессалома, поразили его и убили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: окружили
  rationale: В данном повествовательном контексте סבב обозначает движение вокруг человека с целью взять его в кольцо; «окружили» естественно и точно передаёт этот смысл.
- source_word: עֲשָׂרָה נְעָרִים
  choice: десять молодых воинов
  rationale: נְעָרִים здесь относится не к детям, а к молодым людям на военной службе у Иоава. Добавление «воинов» ясно передаёт контекст, не приписывая им более точного звания.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: оруженосцев Иоава
  rationale: Буквально это «носившие оружие/снаряжение Иоава»; в военном контексте русское «оруженосцы» является кратким и традиционно понятным соответствием.
- source_word: וַיַּכּוּ
  choice: поразили его
  rationale: נכה имеет широкий смысл «ударить, поразить». «Поразили» сохраняет отдельное физическое действие перед последующим сообщением об убийстве.
- source_word: וַיְמִיתֻהוּ
  choice: убили
  rationale: Порода hифиль глагола מות означает «умертвить, причинить смерть»; «убили» — прямое и естественное русское соответствие.
- source_word: אַבְשָׁלוֹם
  choice: Авессалома
  rationale: Использована устоявшаяся русская библейская форма имени, поставленная в винительный падеж по синтаксису предложения.
