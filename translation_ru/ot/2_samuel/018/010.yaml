translation:
  language: ru
  text: 'Один человек увидел и сообщил Иоаву: «Вот, я видел Авессалома, висящего на теревинфе[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на дубе». Еврейское אֵלָה обычно обозначает теревинф, но иногда понимается более широко и переводится как «дуб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Один человек
  rationale: Передаёт буквально выраженное единственное лицо и естественно вводит нового участника повествования.
- source_word: וַיַּרְא
  choice: увидел это
  rationale: Глагол означает «увидел»; местоимение «это» естественно восполняет подразумеваемый из контекста объект наблюдения.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: сообщил Иоаву
  rationale: В данном повествовательном контексте נגד обозначает передачу увиденного как сообщения; «сообщил» по-русски звучит яснее, чем буквальное «рассказал» без дополнения.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию частицы, привлекающей внимание к сообщаемому, без архаического оттенка.
- source_word: רָאִיתִי
  choice: я видел
  rationale: Форма сообщает о завершённом наблюдении в прошлом; русское прошедшее время естественно передаёт этот смысл.
- source_word: תָּלוּי
  choice: висящего
  rationale: Пассивное причастие описывает состояние Авессалома — он находился в подвешенном положении; согласование с винительным падежом естественно для русской конструкции.
- source_word: בָּאֵלָה
  choice: на теревинфе
  rationale: אֵלָה обычно обозначает теревинф. Предлог «на» естественно описывает человека, повисшего на дереве, тогда как русское «в теревинфе» звучало бы неестественно.
