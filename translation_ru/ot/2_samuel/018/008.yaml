  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: ru
  text: Там сражение развернулось по всей местности[a], и в тот день лес поглотил больше людей, чем поглотил меч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Там сражение было рассредоточено по всей местности». Еврейское причастие может подчёркивать, что боевые действия были рассредоточены по всей местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: распространилась
  rationale: Страдательное причастие породы нифаль от פוץ передаёт рассеивание или распространение. В контексте сражения русский глагол «распространилась» естественно выражает его охват всей местности, не устраняя оттенка рассредоточения.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: по всей земле
  rationale: Еврейское выражение обозначает широкий пространственный охват. Здесь «земля» относится к местности, где шла битва, а не ко всему миру; краткая русская формулировка передаёт идиоматический смысл.
- source_word: וירב היער לאכל בעם
  choice: лес поглотил больше людей
  rationale: Сочетание רבה с инфинитивом לאכל и последующим сравнением означает, что лес стал причиной гибели большего числа людей. «Поглотил» сохраняет яркую метафору поедания и олицетворение леса.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: чем поглотил меч
  rationale: Сравнение прямо противопоставляет гибель из-за леса гибели от меча. Повтор «поглотил» сохраняет параллелизм и олицетворение исходного текста.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная для современного русского повествования передача временного оборота.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением образности еврейского текста. Повтор глагола «поглотил» намеренно удерживает метафорический параллелизм леса и меча; «людей» естественнее по-русски, чем буквальное «народа», когда речь идёт о числе погибших.
