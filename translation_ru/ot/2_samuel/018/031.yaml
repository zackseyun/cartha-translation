source:
  edition: WLC
  text: וְ/הִנֵּ֥ה הַ/כּוּשִׁ֖י בָּ֑א וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִתְבַּשֵּׂר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי שְׁפָטְ/ךָ֤ יְהוָה֙ הַ/יּ֔וֹם מִ/יַּ֖ד כָּל הַ/קָּמִ֥ים עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: ru
  text: 'И вот пришёл кушитянин[a] и сказал: «Да услышит мой господин царь добрую весть! Сегодня Яхве оправдал тебя[b], избавив от руки всех, кто восстал против тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть человек из Куша; возможно также: «эфиоп».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассудил в твою пользу»; буквально также возможно: «совершил для тебя суд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательный повествовательный маркер, который живо вводит появление нового вестника, и естественно звучит по-русски.
- source_word: הַכּוּשִׁי
  choice: кушитянин
  rationale: Передаёт этноним с определённым артиклем, а не личное имя. Эта форма точнее привязана к древнему Кушу, чем современное географическое обозначение «эфиоп».
- source_word: בָּא
  choice: пришёл
  rationale: Естественная передача завершённого действия в последовательном повествовании.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная передача глагола אמר в повествовательной последовательности.
- source_word: יִתְבַּשֵּׂר
  choice: да услышит … добрую весть
  rationale: Передаёт юссивно-пожелательную силу формы и почтительную речь вестника; выражение остаётся понятным и сохраняет связь корня со благой вестью.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: мой господин царь
  rationale: Сохраняет придворную формулу почтительного обращения; в данном контексте «господин» не является божественным титулом.
- source_word: כִּי
  choice: опущено как отдельный союз после восклицания
  rationale: В русском языке последующее предложение естественно раскрывает содержание доброй вести без обязательного «ибо»; смысловая связь сохранена.
- source_word: שְׁפָטְךָ
  choice: оправдал тебя
  rationale: Передаёт судебный смысл действия Яхве в пользу Давида, не сводя его лишь к военной победе. Возможные более буквальные прочтения отмечены в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественно и точно сохраняет временное указание.
- source_word: מִיַּד
  choice: избавив от руки
  rationale: Сохраняет прозрачный древнееврейский образ руки как власти, одновременно ясно выражая избавление.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: всех, кто восстал против тебя
  rationale: Сохраняет образ враждебного восстания и хорошо соответствует контексту мятежа, не заменяя выражение общим словом «враги».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Судебно-спасительный смысл שְׁפָטְךָ
  choice: оправдал тебя
  alternative: рассудил в твою пользу / совершил для тебя суд
  rationale: Основной текст выражает судебное решение в пользу Давида, а не утверждает его безусловную нравственную безупречность; сноска сохраняет буквальную и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Частица «да» сохраняет почтительную придворную манеру речи, не делая фразу непонятной. Образ «от руки» намеренно сохранён как ясная библейская метафора власти.
