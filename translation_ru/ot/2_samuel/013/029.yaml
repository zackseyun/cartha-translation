base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: ru
  text: Слуги Авессалома[a] поступили с Амноном так, как велел Авессалом[b]. Тогда все сыновья царя поднялись, каждый сел на своего мула и бежали прочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юноши Авессалома» или «приближённые Авессалома». Еврейское слово может обозначать молодого человека, слугу или состоящего при ком-либо человека.'
    reason: lexical_alternative
  - marker: b
    text: 'В предыдущем стихе приказ изложен прямо: убить Амнона, когда он развеселится от вина.'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: слуги Авессалома
  rationale: נַעַר может обозначать юношу, слугу или приближённого. Здесь речь идёт о людях, исполняющих приказ Авессалома; «слуги» естественно передаёт их роль, не уточняя их официальный статус.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: поступили с Амноном
  rationale: Оборот с עשה и לְ обозначает действие, направленное на Амнона. Перевод сохраняет сжатость еврейского текста, а содержание действия раскрывается в предыдущем стихе.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: так, как велел
  rationale: Сравнительный оборот выражает точное исполнение ранее отданного приказа; «велел» естественно для современного русского повествования.
- source_word: וַיָּקֻמוּ
  choice: поднялись
  rationale: Глагол передаёт резкую реакцию царских сыновей и звучит естественнее современного книжного «встали» в данной последовательности действий.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: все царские сыновья
  rationale: Прямо и естественно передаёт конструкцию «все сыновья царя» и указывает на сыновей Давида, присутствовавших на пире.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: каждый сел на своего мула
  rationale: אִישׁ употреблено распределительно — «каждый», а פֶּרֶד означает мула. Русский оборот краток и идиоматичен.
- source_word: וַיָּנֻסוּ
  choice: они бежали
  rationale: נוּס означает спасаться бегством. «Бежали» ясно передаёт срочное бегство, а местоимение устраняет возможную ошибочную связь сказуемого с ближайшим словом «мула».
