base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: ru
  text: Тогда Фамарь посыпала голову пеплом, разорвала особое одеяние, которое было на ней[a], положила руку себе на голову и ушла, громко крича.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение имеет неясное значение. Возможные переводы: «длинная одежда», «одежда с длинными рукавами», «богато украшенная одежда» или, по традиции, «разноцветная одежда». В этом контексте речь идёт об отличительной одежде дочерей царя-девственниц (см. ст. 18).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: пепел
  rationale: Слово обозначает пепел, которым посыпали голову в знак скорби; русское «посыпала голову пеплом» естественно передаёт этот обрядовый жест.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: посыпала голову пеплом
  rationale: Буквальная конструкция «взяла пепел на голову» по смыслу описывает возложение пепла на голову; выбранная формулировка соответствует современному русскому употреблению.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: особая одежда
  rationale: 'Значение выражения спорно: возможны указания на длину, рукава, отделку или многоцветность. В контексте это отличительная одежда незамужних царских дочерей; нейтральное «особая одежда» не закрепляет одну недоказанную трактовку.'
- source_word: אֲשֶׁר עָלֶיהָ
  choice: бывшую на ней
  rationale: Относительное придаточное уточняет, что Фамарь разорвала одежду, в которую была одета; формулировка близка к еврейскому тексту и естественна по-русски.
- source_word: קָרָעָה
  choice: разорвала
  rationale: Обычный русский глагол для ритуального разрывания одежды в знак горя.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: положила руку на голову
  rationale: Конкретный телесный жест скорби и унижения сохранён без дополнительного истолкования.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: пошла прочь, всё время громко крича
  rationale: Сочетание личной формы с абсолютным инфинитивом передаёт продолжающееся действие; «всё время» сохраняет длительный характер, а «громко крича» — силу זעק без уточнения содержания крика.
