  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: ru
  text: 'Тогда Давид послал в дом к Фамари сказать: «Пожалуйста, пойди в дом своего брата Амнона и приготовь для него пищу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал сказать
  rationale: Глагол означает «послал»; сочетание с обращением к человеку и последующей прямой речью естественно передаётся по-русски как «послал сказать».
- source_word: הַבַּיְתָה
  choice: которая была дома
  rationale: Форма с направительным окончанием буквально допускает значение движения «в дом», однако по контексту речь идёт о том, что весть была послана Фамари туда, где она находилась. Перевод сохраняет это ситуативное понимание и отмечает неоднозначность сноской.
- source_word: לְכִי נָא
  choice: Пожалуйста, пойди
  rationale: Повелительная форма женского рода единственного числа с частицей נָא выражает смягчённую просьбу.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: в дом своего брата Амнона
  rationale: Естественная русская передача конструкции «дом Амнона, брата твоего» с сохранением указания на родство.
- source_word: וַעֲשִׂי לוֹ
  choice: и приготовь ему
  rationale: Хотя עשה имеет широкое значение «делать», в сочетании с пищей русское «приготовь» точно и естественно передаёт кулинарный контекст.
- source_word: הַבִּרְיָה
  choice: пищу
  rationale: Существительное обозначает пищу, особенно предназначенную больному или выздоравливающему. Нейтральное «пищу» не уточняет вид блюда сверх исходного текста.
