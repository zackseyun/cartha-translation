  - severity: low
    issue: Сноска предлагает «в дом» как альтернативу, но основной текст уже интерпретирует форму более свободно.
    rationale: После прямой передачи направления в основном тексте текстовая сноска не нужна; исключение её устраняет искусственно созданную проблему, не теряя смысловой информации.
