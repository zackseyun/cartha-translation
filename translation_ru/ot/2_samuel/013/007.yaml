  source_fidelity: 'Начальное «которая была дома» передаёт контекстуально возможное понимание הַבַּיְתָה, но преобразует направительную форму в придаточное, утверждающее местонахождение Фамари. В данном месте естественнее сохранить направление посылки: Давид послал в дом к Фамари. Остальные элементы точно отражают еврейский текст: вежливо смягчённое повеление женского рода, родство Амнона и приготовление пищи для него.'
  naturalness: Фраза «послал сказать Фамари, которая была дома» несколько тяжеловесна и звучит как пояснение повествователя. «Послал в дом к Фамари сказать» — современная литературная и ясная повествовательная конструкция. «Приготовь для него пищу» естественно в русском порядке слов.
  terminology: Традиционные библейские формы имён «Фамарь» и «Амнон» приемлемы и последовательно сохранены. «Пища» нейтрально передаёт הַבִּרְיָה, не навязывая конкретный вид блюда или медицинское назначение.
