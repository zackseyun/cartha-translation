base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: ru
  text: 'Амнон так терзался из-за своей сестры Фамари, что заболел[a]: ведь она была девственницей, и Амнону казалось невозможным предпринять что-либо по отношению к ней[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Амнон так терзался из-за своей сестры Фамари, что довёл себя до болезни». Еврейскую форму можно понимать и как «заболел», и как «сделал себя больным».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский оборот передаёт мысль: «Амнону казалось невозможным сделать ей что-либо». Речь идёт о том, что Амнон не видел осуществимого способа действовать.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: так терзался
  rationale: Глагол передаёт сильную внутреннюю стеснённость и мучительное душевное состояние Амнона; «терзался» естественно выражает эту напряжённость, не добавляя оценки его чувства.
- source_word: לְהִתְחַלּוֹת
  choice: что заболел
  rationale: Форма хитпаэль допускает как результативное «заболеть», так и рефлексивное «довести себя до болезни». В основном тексте выбрано естественное русское выражение результата, а неоднозначность отмечена в сноске.
- source_word: בַּעֲבוּר
  choice: из-за
  rationale: Предлог здесь обозначает причину; «из-за» ясно и естественно передаёт эту связь.
- source_word: אֲחֹתוֹ
  choice: своей сестры
  rationale: Прямое обозначение родства необходимо сохранить, поскольку оно принципиально важно для смысла и нравственного напряжения повествования.
- source_word: בְתוּלָה
  choice: девственницей
  rationale: Это точный современный эквивалент, передающий именно девственность, а не просто юный возраст или незамужнее положение.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: Амнону казалось невозможным
  rationale: Еврейский оборот описывает действие как недоступное или практически неосуществимое с точки зрения Амнона. Русская формулировка сохраняет субъективность этой оценки.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: что-либо с ней сделать
  rationale: Фраза намеренно остаётся широкой и не уточняет заранее последующее преступление; «с ней сделать» естественнее по-русски и сохраняет угрожающий контекст.
theological_decisions:
- issue: Характер невозможности действовать по отношению к Фамари
  choice: 'Передать как субъективную практическую невозможность: «Амнону казалось невозможным».'
  alternative: Представить это как объективный нравственный или законный запрет.
  rationale: Текст сообщает взгляд Амнона и не объясняет здесь, почему действие было для него недоступно. Перевод не должен превращать повествовательную формулировку в прямое богословское или правовое утверждение.
translation_notes:
  register: Современный литературный русский язык, сдержанный и повествовательный. Сохранены родственная связь, девственность Фамари и субъективная перспектива Амнона; неоднозначность לְהִתְחַלּוֹת вынесена в сноску.
