  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: ru
  text: 'Ионадав сказал ему: «Ляг в постель и притворись больным. Когда отец придёт навестить тебя, скажи ему: „Пусть, пожалуйста, придёт моя сестра Фамарь, чтобы покормить меня, и приготовит у меня на глазах пищу[a], чтобы я видел и ел из её рук“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать пищу, приготовленную для больного или выздоравливающего.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Ляг в постель
  rationale: Естественно передаёт указание лечь на своё ложе; современное русское «в постель» здесь звучит идиоматичнее буквального «на постель».
- source_word: וְהִתְחָל
  choice: притворись больным
  rationale: Контекст указывает на притворную болезнь, а не на попытку действительно заболеть.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Когда отец придёт навестить тебя
  rationale: Последовательность указаний естественно выражается временным придаточным; «навестить» соответствует приходу к якобы больному.
- source_word: תָּבֹא נָא
  choice: Пусть, пожалуйста, придёт
  rationale: Сохраняет побудительное значение и вежливо-просительный оттенок частицы נָא.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: чтобы покормить меня
  rationale: ברה в данном контексте означает дать пищу или подкрепить больного; такой перевод отличает это действие от последующего עשה, «приготовить».
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: и приготовит у меня на глазах пищу
  rationale: Передаёт как приготовление особой пищи, так и важное для замысла указание делать это перед глазами Амнона.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: чтобы я видел
  rationale: Сохраняет буквальное зрительное значение ראה и не вводит отсутствующего в еврейском тексте прямого дополнения.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: и ел из её рук
  rationale: Сохраняет личный характер кормления и важную для повествования близость; русское множественное «из рук» идиоматично передаёт еврейское «из её руки».
