  source_fidelity: 'Основной смысл передан верно: Тамар подаёт пищу, Амнон намеренно отказывается есть и велит удалить всех присутствующих. Однако «пусть все уйдут» сглаживает обращённое к слугам каузативное повеление הוֹצִיאוּ; более точно и естественно: «Выведите от меня всех!»'
