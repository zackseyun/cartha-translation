base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: ru
  text: 'Тогда она взяла сковороду и выложила кушанье перед ним[a], но он отказался есть. Амнон сказал: «Выведите от меня всех!»[b] И все ушли от него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вылила перед ним»; здесь глагол употреблён о подаче приготовленной пищи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выведите от меня всякого мужчину»; выражение относится ко всем присутствовавшим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: сковороду
  rationale: Существительное обозначает сосуд, в котором готовили или из которого подавали пищу; «сковорода» естественно продолжает сцену приготовления лепёшек.
- source_word: וַתִּצֹק לְפָנָיו
  choice: выложила кушанье перед ним
  rationale: Глагол יצק буквально означает «выливать», однако здесь описывает перекладывание приготовленной пищи из сковороды перед Амноном. «Выложила» сохраняет конкретность действия и звучит естественно по-русски.
- source_word: וַיְמָאֵן לֶאֱכוֹל
  choice: он отказался есть
  rationale: מָאֵן выражает сознательный отказ, а не просто отсутствие желания или аппетита.
- source_word: הוֹצִיאוּ כָל אִישׁ
  choice: Пусть все уйдут
  rationale: Каузативное повеление буквально требует удалить каждого присутствующего; по-русски распоряжение «Пусть все уйдут» естественно передаёт его смысл.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: от меня / от него
  rationale: Идиоматическое выражение означает удаление от чьего-либо присутствия; краткий перевод сохраняет повтор исходного текста.
