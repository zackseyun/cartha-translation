  terminology: '«Сковорода» допустимо передаёт מַשְׂרֵת в данном кулинарном контексте. Примечание b нуждается в исправлении: буквальное пояснение должно отражать каузативное повеление и не должно создавать впечатления, будто в еврейском тексте стоит форма «каждого мужчину» как прямой русский эквивалент.'
