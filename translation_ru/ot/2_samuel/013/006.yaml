  text: וַ/יִּשְׁכַּ֥ב אַמְנ֖וֹן וַ/יִּתְחָ֑ל וַ/יָּבֹ֨א הַ/מֶּ֜לֶךְ לִ/רְאֹת֗/וֹ וַ/יֹּ֨אמֶר אַמְנ֤וֹן אֶל הַ/מֶּ֨לֶךְ֙ תָּֽבוֹא נָ֞א תָּמָ֣ר אֲחֹתִ֗/י וּ/תְלַבֵּ֤ב לְ/עֵינַ/י֙ שְׁתֵּ֣י לְבִב֔וֹת וְ/אֶבְרֶ֖ה מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: ru
  text: 'Итак, Амнон лёг и притворился больным. Когда царь пришёл навестить его, Амнон сказал царю: «Пусть, пожалуйста, придёт моя сестра Фамарь и у меня на глазах приготовит две лепёшки[a], чтобы я поел из её рук».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «два пирожка»; точный вид блюда, обозначенного еврейским словом, неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: лёг
  rationale: В контексте Амнон ложится в постель как часть обмана; краткое «лёг» естественно передаёт повествовательную форму.
- source_word: וַיִּתְחָל
  choice: притворился больным
  rationale: Форма и контекст указывают на изображение болезни, а не на действительное заболевание.
- source_word: לִרְאֹתוֹ
  choice: навестить его
  rationale: Буквально выражение означает «увидеть его», но в ситуации больного современное русское «навестить» естественно передаёт подразумеваемый визит.
- source_word: תָּבוֹא נָא
  choice: Пусть, пожалуйста, придёт
  rationale: Частица נָא смягчает побудительную просьбу; выбранная конструкция сохраняет её вежливый характер.
- source_word: תָּמָר אֲחֹתִי
  choice: моя сестра Фамарь
  rationale: Русский порядок слов естественнее еврейского; традиционная русская форма имени «Фамарь» уместна в библейском литературном тексте.
- source_word: וּתְלַבֵּב
  choice: приготовит
  rationale: Редкий глагол обозначает изготовление названного далее блюда; «приготовит» не уточняет неизвестный способ приготовления.
- source_word: לְעֵינַי
  choice: у меня на глазах
  rationale: Естественный современный русский эквивалент, сохраняющий подчёркнуто зрительный смысл выражения.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: две лепёшки
  rationale: Точный вид блюда не установлен. «Лепёшки» передаёт общее значение выпечного или мучного изделия, не утверждая, что оно было сердцевидным.
- source_word: וְאֶבְרֶה
  choice: чтобы я поел
  rationale: Глагол относится к принятию пищи, особенно в контексте якобы больного; русская цельная конструкция звучит естественно.
- source_word: מִיָּדָהּ
  choice: из её рук
  rationale: Русское множественное число идиоматично выражает личное получение пищи от неё, сохраняя оттенок непосредственного обслуживания.
