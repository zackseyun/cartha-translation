- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: во внутреннюю комнату
  rationale: חֶדֶר обозначает внутреннее помещение, а направительный суффикс во втором употреблении выражает движение внутрь. Одинаковый перевод обоих употреблений сохраняет лексический повтор и подчёркивает уединённость места.
- source_word: וְאֶבְרֶה
  choice: чтобы я поел
  rationale: Форма от ברה выражает намерение Амнона поесть; придаточное цели естественно передаёт связь с предшествующим приказом.
- source_word: מִיָּדֵךְ
  choice: из твоих рук
  rationale: Русское идиоматическое выражение естественно передаёт еврейское «из твоей руки» и сохраняет личный, манипулятивно-интимный характер просьбы.
- source_word: הַלְּבִבוֹת
  choice: лепёшки
  rationale: В данном контексте речь идёт об особом мучном кушанье, приготовленном Фамарью; «лепёшки» достаточно конкретно и понятно современному читателю.
- source_word: אָחִיהָ
  choice: своему брату
  rationale: Явное обозначение родства сохранено как значимая часть повествования.
