  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: ru
  text: 'Тогда Амнон сказал Фамари: «Принеси еду во внутреннюю комнату[a], чтобы я поел из твоей руки». Фамарь взяла приготовленные ею лепёшки и принесла их во внутреннюю комнату своему брату Амнону.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в отдельную комнату» или просто «в комнату». Еврейское חֶדֶר означает внутреннее помещение; вариант «внутренняя комната» передаёт уединённость места.'
