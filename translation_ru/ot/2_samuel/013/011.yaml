  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: ru
  text: 'Когда она поднесла ему еду, чтобы он поел[a], он схватил её и сказал ей: «Иди сюда, ложись со мной, сестра моя!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда она подошла к нему, чтобы он поел». Еврейский глагол может означать как то, что Фамарь подошла, так и то, что она поднесла ему еду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ אֵלָיו לֶאֱכֹל
  choice: она поднесла ему еду, чтобы он поел
  rationale: Форма נגשׁ допускает значения «приблизиться» и «поднести». В контексте Фамарь подаёт приготовленную пищу, поэтому основным выбран смысл «поднесла»; подразумеваемое дополнение «еду» естественно восстанавливается из контекста. Неоднозначность отмечена в сноске.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: он схватил её
  rationale: חזק с предлогом ב обозначает крепко ухватить или удержать. «Схватил» ясно передаёт насильственный характер действия без избыточного усиления.
- source_word: בּוֹאִי
  choice: иди сюда
  rationale: Женская форма повелительного наклонения глагола בוא означает призыв приблизиться. Русское «иди сюда» естественно и сохраняет резкую повелительность реплики.
- source_word: שִׁכְבִי עִמִּי
  choice: ложись со мной
  rationale: Сочетание שׁכב с עִם имеет сексуальный смысл. «Ложись со мной» сохраняет прямоту и тяжесть требования, не прибегая ни к смягчению, ни к грубой разговорности.
- source_word: אֲחוֹתִי
  choice: сестра моя
  rationale: 'Буквальное обозначение родства необходимо сохранить: оно усиливает нравственный ужас происходящего. Постпозиция местоимения соответствует достоинству повествовательного регистра.'
theological_decisions:
- issue: Передача сексуального требования без эвфемистического смягчения
  choice: ложись со мной
  alternative: переспи со мной
  rationale: Еврейское выражение является сексуальной идиомой. Выбранный вариант достаточно ясен, но менее разговорен и не обесценивает тяжесть насилия.
- issue: Сохранение обращения, указывающего на родство
  choice: сестра моя
  alternative: моя сестра
  rationale: 'Указание на родство не случайно: оно подчёркивает нравственную тяжесть и кровосмесительный характер требования. Оба порядка слов возможны; выбран более торжественный и повествовательно уместный.'
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и достойной передачей сцены. Насильственное действие и сексуальное требование выражены прямо, без смягчения и без натуралистического усиления.
