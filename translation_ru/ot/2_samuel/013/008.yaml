  terminology: Традиционные формы имён «Фамарь» и «Амнон» уместны в русском библейском регистре. «Тесто», «замесила», «лепёшки», «приготовила» терминологически понятны и не содержат неоправданной интерпретации редких לְבִבוֹת / תְּלַבֵּב.
