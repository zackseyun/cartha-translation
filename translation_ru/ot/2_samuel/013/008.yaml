  source_fidelity: 'Русский текст точно передаёт последовательность и основные элементы еврейского оригинала: Фамарь идёт в дом Амнона, который лежит; берёт тесто, месит его, готовит изделия у него на глазах и подвергает их тепловой обработке. Обстоятельственное «а он лежал» корректно отражает וְהוּא שֹׁכֵב. «Приготовила» обоснованно сохраняет более широкое значение וַתְּבַשֵּׁל, не навязывая варку.'
