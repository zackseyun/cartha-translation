  text: וַ/תֵּ֣לֶךְ תָּמָ֗ר בֵּ֛ית אַמְנ֥וֹן אָחִ֖י/הָ וְ/ה֣וּא שֹׁכֵ֑ב וַ/תִּקַּ֨ח אֶת הַ/בָּצֵ֤ק ו/תלוש וַ/תְּלַבֵּ֣ב לְ/עֵינָ֔י/ו וַ/תְּבַשֵּׁ֖ל אֶת הַ/לְּבִבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: ru
  text: И пошла Фамарь в дом своего брата Амнона, а он лежал. Она взяла тесто, замесила его, у него на глазах сделала из него лепёшки[a] и приготовила эти лепёшки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «сделала лепёшки в форме сердца». Еврейские глагол и существительное редки и, вероятно, связаны со словом «сердце».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «сварила эти лепёшки». Еврейский глагол нередко означает именно варку, хотя здесь может иметь более общее значение — приготовление пищи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: И пошла
  rationale: Последовательная форма с וַ продвигает повествование; «И пошла» естественно передаёт продолжение рассказа, не добавляя излишней причинности.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: в дом своего брата Амнона
  rationale: Передаёт направление движения и сохраняет важное указание на родство; возвратное «своего» естественно для современного русского языка.
- source_word: וְהוּא שֹׁכֵב
  choice: а он лежал
  rationale: Обстоятельственная конструкция описывает состояние Амнона; «лежал» ближе к еврейскому тексту, чем более конкретное «лежал в постели».
- source_word: הַבָּצֵק
  choice: тесто
  rationale: Обычное и точное обозначение теста в контексте приготовления пищи.
- source_word: וְתָלֹשׁ
  choice: замесила его
  rationale: Глагол לוש обычно обозначает замешивание теста; местоимение делает русскую фразу связной.
- source_word: וַתְּלַבֵּב
  choice: сделала из него лепёшки
  rationale: Редкий глагол связан с названием приготовляемого изделия; формулировка передаёт действие, не утверждая как несомненную гипотезу о форме сердца.
- source_word: לְעֵינָיו
  choice: у него на глазах
  rationale: Естественный русский эквивалент выражения «перед его глазами», подчёркивающий, что Амнон видел приготовление.
- source_word: וַתְּבַשֵּׁל
  choice: приготовила
  rationale: Глагол может обозначать варку, но также употребляется шире о тепловом приготовлении пищи; нейтральный вариант избегает неоправданной конкретизации способа.
- source_word: הַלְּבִבוֹת
  choice: эти лепёшки
  rationale: Существительное обозначает изготовленные изделия; «лепёшки» понятно современному читателю, а указательное слово естественно связывает их с предыдущим действием.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён «Фамарь» и «Амнон». Синтаксис сохраняет последовательность действий и не конкретизирует ни место, где лежал Амнон, ни форму изделий, ни способ их теплового приготовления сверх того, что надёжно следует из еврейского текста.
