base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: ru
  text: На ней было богато украшенное одеяние[a], ибо такие одеяния носили дочери царя, девственницы. Слуга Амнона вывел её наружу и запер за ней дверь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежда с длинными рукавами», «разноцветная одежда»; точный вид этого одеяния неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: богато украшенная одежда
  rationale: Сочетание обозначает особую, отличительную одежду, но точный смысл פַּסִּים спорен. Выбран естественный и контекстуально уместный вариант; иные основные толкования сохранены в сноске.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ ... מְעִילִים
  choice: так одевались
  rationale: Конструкция поясняет обычай царских дочерей. Русское выражение передаёт привычное действие и позволяет избежать тяжеловесного повторения слова «одежда».
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: царские дочери-девственницы
  rationale: 'Перевод сохраняет оба прямо названных признака: принадлежность к царскому дому и девственность.'
- source_word: מְשָׁרְתוֹ
  choice: слуга Амнона
  rationale: В контексте это личный служитель Амнона. Имя добавлено для ясности местоименной отсылки; в русском «его слуга» рядом с несколькими мужскими участниками может быть менее прозрачным.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: вывел её вон
  rationale: Передаёт каузативное значение глагола и направленность наружу, не усиливая действие до явно насильственного «вытолкал».
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: запер за ней дверь
  rationale: נעל означает запереть или задвинуть засов; естественная русская формула точно передаёт завершённость действия.
