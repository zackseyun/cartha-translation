  rationale: Сочетание פרץ с предлогом ב при обозначении лица здесь имеет идиоматический смысл настойчивого давления или уговоров, а не буквального «прорыва». Формулировка передаёт продолжительность и силу просьбы Авессалома после первоначального отказа Давида.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Традиционная и общеупотребительная русская передача библейского имени.
- source_word: וַיִּשְׁלַח
  choice: отпустил
  rationale: В данном контексте Давид уступает просьбе и позволяет сыновьям отправиться на пир к Авессалому. «Отпустил» естественно связывает стих с предшествующим отказом; возможен также более буквальный перевод «послал».
- source_word: אִתּוֹ
  choice: с ним
  rationale: Сохранено местоимение еврейского текста; по контексту оно относится к Авессалому.
- source_word: אֶת אַמְנוֹן
  choice: Амнона
  rationale: Показатель прямого дополнения отдельно не переводится; имя дано в традиционной русской форме и поставлено в винительном падеже.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: и всех царских сыновей
  rationale: Естественная современная русская передача конструкции «всех сыновей царя», сохраняющая семейный и царский смысл.
