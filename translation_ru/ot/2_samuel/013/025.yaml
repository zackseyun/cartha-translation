base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: ru
  text: 'Но царь сказал Авессалому: «Нет, сын мой, не стоит всем нам идти, чтобы не быть тебе в тягость». Авессалом настойчиво уговаривал его, но царь не захотел идти и благословил его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא נֵלֵךְ כֻּלָּנוּ
  choice: не стоит всем нам идти
  rationale: Вежливое, но твёрдое отклонение приглашения; נָא передано естественной современной русской формулой без излишне буквального «пожалуйста, не пойдём».
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: чтобы не быть тебе в тягость
  rationale: Идиома с корнем כבד означает обременить хозяина своим многочисленным присутствием; русский оборот точно и естественно передаёт смысл.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Авессалом настойчиво уговаривал его
  rationale: Конструкция означает усиленно настаивать на чём-либо перед кем-либо; имя восстановлено вместо местоимения для ясности смены действующего лица.
- source_word: וַיְבָרֲכֵהוּ
  choice: и благословил его
  rationale: Сохранено прямое значение ברך; контекст допускает благословение при прощании, но не требует заменять его словом «попрощался».
