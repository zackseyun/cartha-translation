base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: ru
  text: 'Она сказала ему: «Нет, брат мой, не надругайся надо мной[a], ведь так не поступают в Израиле. Не совершай этого гнусного дела[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «не унижай меня» или, по смыслу данного контекста, «не насилуй меня». Еврейский глагол обозначает насильственное унижение и бесчестье, в том числе при сексуальном насилии.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «этого позорного поступка» или «этой мерзости». Еврейское слово обозначает нравственно возмутительное деяние, а не просто глупость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Она сказала ему
  rationale: Обычная повествовательная формула с последовательным wayyiqtol; союз וַ естественно не передаётся в современном русском начале стиха.
- source_word: אַל אָחִי
  choice: Нет, брат мой
  rationale: Первое אַל перед обращением выражает настойчивый протест, а не вежливую просьбу. Родственное обращение сохранено, поскольку оно подчёркивает характер происходящего.
- source_word: אַל תְּעַנֵּנִי
  choice: не надругайся надо мной
  rationale: Глагол ענה в породе пиэль в контексте сексуального насилия сочетает значения насильственного посягательства, унижения и причинённого бесчестья. Русское «надругайся» сохраняет эту смысловую широту, не устраняя сексуального смысла контекста.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: ведь так не поступают в Израиле
  rationale: Безличная форма нифаля выражает общепринятую нравственную норму сообщества. Настоящее время и неопределённо-личная конструкция естественно передают её по-русски.
- source_word: אַל תַּעֲשֵׂה אֶת הַנְּבָלָה הַזֹּאת
  choice: Не совершай этого гнусного дела
  rationale: נְבָלָה обозначает нравственно возмутительный и позорный поступок, а не просто неразумие. «Гнусное дело» ясно передаёт тяжесть моральной оценки; «совершай» естественно сочетается с обозначением поступка.
