base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: ru
  text: 'Авессалом пришёл к царю и сказал: «Вот, у твоего слуги стригут овец. Пусть же царь и его слуги пойдут с твоим слугой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה־נָא
  choice: Вот
  rationale: Передаёт привлечение внимания собеседника; частица נָא здесь смягчает обращение, но отдельное «пожалуйста» перед «вот» по-русски звучало бы неестественно.
- source_word: גֹזְזִים
  choice: стригут овец
  rationale: Субстантивированное причастие буквально обозначает стригущих; в контексте праздника по случаю стрижки овец естественный русский оборот «у твоего слуги стригут овец» передаёт ситуацию яснее, не добавляя новых участников.
- source_word: עַבְדֶּךָ
  choice: твой слуга / твоим слугой
  rationale: Сохранена почтительная форма самообозначения Авессалома при обращении к царю, а не заменена местоимением «я».
- source_word: יֵלֶךְ־נָא
  choice: Пусть же … пойдут
  rationale: Юссивное пожелание с נָא передано как вежливое приглашение-просьба; «же» естественно выражает настойчивое смягчение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением придворной формы обращения в третьем лице. «Царь и его слуги» грамматически согласовано во множественном числе («пойдут»), что естественно для русского языка.
