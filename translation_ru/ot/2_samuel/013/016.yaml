base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: ru
  text: 'Но она сказала ему[a]: «Нет! Ведь это великое зло — отослать меня — больше другого зла, которое ты мне причинил». Но он не захотел её слушать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Не надо, ибо это великое зло — отослать меня — больше другого, которое ты мне причинил». Еврейская фраза сжата и синтаксически трудна.'
    reason: Сохраняет возможное запретительное значение אַל и показывает более формальную структуру неоднозначной еврейской фразы.
lexical_decisions:
- source_word: אַל
  choice: Нет!
  rationale: Хотя אַל обычно вводит запрет («не…»), здесь в сжатой реплике Фамари оно выражает решительный протест. «Нет!» естественно передаёт эту силу по-русски.
- source_word: אוֹדֹת
  choice: ведь
  rationale: Слово вводит основание протеста; русское «ведь» естественно связывает возражение с последующим объяснением.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: это ещё большее зло
  rationale: רָעָה здесь означает нравственное зло и причинённый вред. Сравнительная конструкция по-русски естественно передаётся словами «ещё большее зло».
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: чем то другое, которое ты мне причинил
  rationale: Сохраняется ссылка на другое, ранее названное по смыслу зло, без прямого уточнения его характера. «Причинил» естественнее русского буквального «сделал со мной» и соответствует контексту вреда.
- source_word: לְשַׁלְּחֵנִי
  choice: прогнать меня
  rationale: Глагол означает отослать или выгнать; в данном контексте насильственного удаления «прогнать» точно и естественно передаёт действие.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Но он не захотел её слушать
  rationale: אָבָה выражает нежелание или отказ. Перевод сохраняет волевой характер отказа, а «но» ясно обозначает повествовательный поворот.
