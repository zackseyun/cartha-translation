  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: ru
  text: 'Авессалом приказал своим людям: «Смотрите же: когда сердце Амнона развеселится от вина[a] и я скажу вам: „Поразите Амнона“, — убейте его. Не бойтесь! Разве не я вам приказал? Будьте сильны и покажите себя доблестными мужами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Амнону станет весело от вина». Буквально: «когда сердце Амнона станет добрым от вина».'
    reason: Поясняется еврейская идиома и даётся более обычный русский вариант без утверждения о полном опьянении.
lexical_decisions:
- source_word: נְעָרָיו
  choice: своим людям
  rationale: В данном контексте נַעַר обозначает состоящих при Авессаломе молодых слуг или приближённых, которым он поручает насилие. «Своим людям» естественно по-русски передаёт личную подчинённость и не сводит их роль к домашней прислуге, хотя возрастной оттенок остаётся невыраженным.
- source_word: רְאוּ נָא
  choice: Смотрите же
  rationale: Императив требует внимательно следить за наступлением условленного момента; частица נָא здесь естественно передаётся усилительным «же», не превращая приказ в вежливую просьбу.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: когда сердце Амнона развеселится от вина
  rationale: 'Сохранён образный строй еврейской идиомы: вино приводит сердце Амнона в весёлое, беспечное состояние. Формулировка не усиливает смысл до определённого утверждения о полном опьянении.'
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Поразите Амнона
  rationale: Глагол נכה широко означает нанесение удара или поражение. «Поразите» сохраняет отдельный приказ атаковать, после которого следующий глагол прямо уточняет смертельный исход.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: убейте его
  rationale: Порода hифиль глагола מות означает причинить смерть. Прямое «убейте» точно и естественно передаёт приказ.
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь
  rationale: Прямой запрет передан современным и сильным русским выражением.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: Разве не я вам приказал?
  rationale: Риторический вопрос и ударное אָנֹכִי переданы конструкцией «разве не я», подчёркивающей личную власть и ответственность Авессалома.
- source_word: חִזְקוּ
  choice: Будьте сильны
  rationale: Сохранено прямое значение императива חזק, которое в контексте включает также решимость и смелость.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: покажите себя доблестными мужами
  rationale: Идиома בני חיל характеризует мужчин как храбрых и способных к решительному действию. «Доблестные мужи» сохраняет мужской и воинский оттенок, оставаясь уместным в достоинстве исторического повествования.
theological_decisions:
- issue: Мужская форма выражения לִבְנֵי חָיִל
  choice: покажите себя доблестными мужами
  alternative: будьте мужественны; будьте храбры
  rationale: Обращение направлено к мужчинам из окружения Авессалома, а еврейская идиома буквально имеет форму «сыны доблести/силы». Мужская характеристика сохранена без привнесения дополнительного богословского смысла.
- issue: Степень воздействия вина на Амнона
  choice: сердце Амнона развеселится от вина
  alternative: Амнон опьянеет
  rationale: Исходная идиома описывает весёлое и ослабляющее осторожность действие вина, но сама по себе не устанавливает степень опьянения. Перевод сохраняет эту смысловую сдержанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной окраской исторического повествования. Прямая речь резкая и повелительная; архаизмы сведены к контекстуально уместному сочетанию «доблестные мужи». Маркер [a] поставлен непосредственно при поясняемой винной идиоме.
