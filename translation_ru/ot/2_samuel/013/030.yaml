  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: ru
  text: 'Пока они были в пути, до Давида дошло сообщение[a]: «Авессалом убил всех сыновей царя, и ни одного из них не осталось».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Давида дошла весть»; еврейское слово может также означать непроверенное сообщение или слух.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Пока они были в пути
  rationale: Естественно передаёт обстоятельственное и временное значение еврейской повествовательной конструкции, не утяжеляя русский текст буквальным «и было».
- source_word: הַשְּׁמֻעָה
  choice: сообщение
  rationale: 'Слово может означать весть, сообщение или слух. «Сообщение» сохраняет нейтральность: дошедшие до Давида сведения ещё не были проверены и далее окажутся преувеличенными.'
- source_word: בָאָה אֶל דָּוִד
  choice: до Давида дошло
  rationale: Русское идиоматическое выражение точно передаёт прибытие вести к Давиду.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском цитатная функция инфинитива естественно передаётся пунктуационным введением прямой речи, без громоздкого «говоря».
- source_word: הִכָּה
  choice: убил
  rationale: Хотя глагол буквально имеет значение «поразил», в данном сообщении последующая фраза «ни одного… не осталось» ясно указывает на убийство; «убил» естественно и недвусмысленно передаёт смысл контекста.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: всех сыновей царя
  rationale: Прямой и естественный перевод, сохраняющий конкретное указание на сыновей мужского пола.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: и ни одного из них не осталось
  rationale: Сохраняет усиленное отрицание и значение глагола «оставаться, уцелеть» в естественной русской форме.
