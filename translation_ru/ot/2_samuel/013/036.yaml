    text: 'Буквально: «плакали плачем весьма великим» — еврейский усилительный оборот, выражающий чрезвычайно сильный плач.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Когда он закончил говорить
  rationale: Еврейская повествовательная формула с временным оборотом естественно передана по-русски; последовательность событий сохраняется без стилистически тяжёлого «и было».
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и оживляющую повествование функцию частицы, привлекая внимание к появлению царских сыновей.
- source_word: בְנֵי הַמֶּלֶךְ בָּאוּ
  choice: пришли сыновья царя
  rationale: Прямая и естественная передача конструкции принадлежности и обычного глагола движения.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: Они громко зарыдали
  rationale: Идиома буквально означает «подняли свой голос и заплакали»; цельная русская формулировка передаёт громкий, открытый плач, не создавая неестественной кальки.
- source_word: וְגַם הַמֶּלֶךְ וְכָל עֲבָדָיו
  choice: Царь и все его слуги тоже
  rationale: «Тоже» ясно выражает присоединение царя и его людей к плачу сыновей; «слуги» сохраняет широкое значение עֲבָדָיו и не уточняет придворный ранг без основания.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: плакали — плач был очень велик
  rationale: Сохранена еврейская усилительная конструкция с однокоренными словами, но фраза разделена тире ради ясного и достойного современного русского звучания.
