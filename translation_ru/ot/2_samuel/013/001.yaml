lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Сочетание повествовательной формулы с временным оборотом вводит следующий эпизод; естественное русское «После этого» сохраняет связь с предшествующими событиями без буквального и тяжеловесного «И было после этого».
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: у Авессалома, сына Давида, была
  rationale: Еврейская конструкция обладания с לְ естественно передаётся русской конструкцией «у ... была». Определение «сына Давида» сохранено, поскольку оно повторяется и подчёркивает родственные связи внутри царской семьи.
- source_word: אָחוֹת יָפָה
  choice: красивая сестра
  rationale: יָפָה прямо обозначает красоту; «красивая» — ясный и стилистически нейтральный русский эквивалент.
- source_word: וּשְׁמָהּ תָּמָר
  choice: по имени Фамарь
  rationale: Естественный русский способ передать простую еврейскую формулу называния, сохраняя всё её содержание.
- source_word: וַיֶּאֱהָבֶהָ
  choice: полюбил её
  rationale: Использован обычный еврейский глагол «любить». Совершенный вид «полюбил» естественно передаёт наступление состояния в повествовательной последовательности и не вводит заранее отрицательную оценку, раскрываемую дальнейшим рассказом.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: Амнон, сын Давида
  rationale: Повторное обозначение «сын Давида» сохранено ради авторского акцента на отношениях внутри царского дома.
theological_decisions:
- issue: Передача אָהֵב в нравственно напряжённом повествовании
  choice: полюбил её
  alternative: возжелал её; воспылал к ней страстью
  rationale: Сам стих употребляет обычный глагол «любить», хотя последующий рассказ обнаруживает порочность и насильственный характер чувства Амнона. Основной текст сохраняет эту литературную и богословскую напряжённость, не истолковывая глагол преждевременно.
translation_notes:
  register: 'Современный литературный русский язык; изложение ясное и сдержанное. Имена переданы в традиционной русской библейской форме: Авессалом, Фамарь, Амнон. Повтор «сын Давида» намеренно сохранён.'
