  text: וְ/אַבְשָׁל֥וֹם בָּרַ֖ח וַ/יֵּ֣לֶךְ גְּשׁ֑וּר וַ/יְהִי שָׁ֖ם שָׁלֹ֥שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/038.yaml
  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: ru
  text: Но[a] Авессалом бежал, ушёл в Гешур и пробыл там три года[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Авессалом…» Еврейский союз в данном контексте можно передать и как «и», и как «но».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и был там три года».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Но Авессалом
  rationale: Союз ו допускает как нейтральное «и», так и контекстуальное «но». Здесь «но» естественно передаёт возобновление повествования с оттенком противопоставления.
- source_word: בָּרַח
  choice: бежал
  rationale: Глагол ברח означает бегство от опасности или преследования; «бежал» точно и лаконично передаёт этот смысл.
- source_word: וַ/יֵּלֶךְ
  choice: ушёл
  rationale: הלך в повествовательной последовательности означает движение к названному месту. «Ушёл» естественно сочетается с предшествующим бегством, не добавляя идеи успешного спасения.
- source_word: גְּשׁוּר
  choice: Гешур
  rationale: Название местности передано традиционной русской транслитерацией.
- source_word: וַ/יְהִי שָׁם
  choice: и пробыл там
  rationale: Буквально выражение означает «и был там», но при указании продолжительности по-русски естественнее «пробыл там».
- source_word: שָׁלֹשׁ שָׁנִים
  choice: три года
  rationale: Прямое и обычное обозначение продолжительности времени.
