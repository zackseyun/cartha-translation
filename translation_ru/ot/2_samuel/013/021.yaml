source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ דָּוִ֔ד שָׁמַ֕ע אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יִּ֥חַר ל֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/021.yaml
  text: When King David heard all these things[a], he was very angry.
translation:
  language: ru
  text: Когда царь Давид услышал обо всём случившемся[a], он сильно разгневался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышал все эти дела (или: слова)».'
    reason: Слово דְּבָרִים имеет широкий диапазон значений — «слова», «дела», «обстоятельства», «события»; основной текст передаёт его контекстуально как «случившееся».
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Когда царь Давид
  rationale: Союз וְ в повествовательной последовательности естественно передан временной связью «когда»; титул и имя переведены прямо и в обычном русском порядке.
- source_word: שָׁמַע
  choice: услышал
  rationale: Основное значение глагола — «слышать»; в контексте Давид узнаёт о произошедшем из сообщения.
- source_word: אֵת
  choice: отдельно не переводится
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного русского эквивалента.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: обо всём случившемся
  rationale: דְּבָרִים может обозначать слова, дела, обстоятельства или события. Здесь выражение относится ко всей только что описанной истории; «обо всём случившемся» звучит естественно и сохраняет широкий контекстуальный смысл.
- source_word: וַ/יִּחַר ל/וֹ מְאֹד
  choice: он сильно разгневался
  rationale: Еврейская идиома буквально описывает то, что у него «сильно разгорелось»; по-русски смысл естественно выражается как сильный гнев, без добавления отсутствующего в тексте отдельного слова «гнев» в роли подлежащего.
theological_decisions:
- issue: Следует ли уточнять причину гнева Давида или подразумевать последующие действия?
  choice: Не уточнять ни объект гнева, ни реакцию Давида.
  alternative: Добавить, на кого именно разгневался Давид, либо упомянуть, что он не наказал Амнона.
  rationale: Масоретский текст данного стиха сообщает только о сильном гневе Давида. Дополнительные уточнения разрешили бы оставленную текстом неопределённость или внесли бы материал из вариантов и толкований.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный повествовательный стиль. Формула «сильно разгневался» сохраняет интенсивность מְאֹד и естественно передаёт еврейскую идиому.
