base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: ru
  text: 'Тогда Авессалом сказал[a]: «Если нет, прошу, пусть мой брат Амнон пойдёт с нами». Но царь сказал ему: «Почему ему идти с тобой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «Если ты не пойдёшь, прошу, пусть мой брат Амнон пойдёт с нами». В еврейском тексте эта фраза выражена неполно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал / Но ... спросил
  rationale: Последовательный вав продвигает повествование; «тогда» естественно вводит просьбу Авессалома, а «но» передаёт противопоставленную реакцию царя. Во второй реплике русское «спросил» естественно оформляет прямой вопрос, не изменяя смысла глагола речи.
- source_word: וָלֹא
  choice: Если нет
  rationale: Краткое эллиптическое выражение отсылает к предшествующему отказу царя. Лаконичный перевод сохраняет недосказанность еврейского текста; более явное понимание вынесено в примечание.
- source_word: נָא
  choice: пусть хотя бы
  rationale: Частица смягчает просьбу. В данном контексте после отказа сочетание «пусть хотя бы» естественно передаёт вежливую уступительную просьбу по-русски.
- source_word: יֵלֶךְ
  choice: пусть ... пойдёт / зачем ... идти
  rationale: Юссив в просьбе передан конструкцией «пусть ... пойдёт»; форма в риторическом вопросе царя естественно передана русским инфинитивом.
- source_word: אִתָּנוּ
  choice: с нами
  rationale: Прямой комитативный эквивалент формы с суффиксом первого лица множественного числа.
- source_word: אַמְנוֹן אָחִי
  choice: мой брат Амнон
  rationale: Такой порядок слов наиболее естественен в современном русском и полностью сохраняет родственное обозначение и имя.
- source_word: לָמָה
  choice: зачем
  rationale: В вопросе о предполагаемом действии «зачем» звучит естественно и передаёт вопрос царя о причине или цели поездки Амнона.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Форма единственного числа относится к Авессалому; русский перевод сохраняет это отличие от предшествующего «с нами».
