  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: ru
  text: 'А мне куда деваться с моим бесчестьем?[a] И ты станешь одним из негодяев в Израиле.[b] А теперь прошу, поговори с царём: он не откажет тебе во мне.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «куда я унесу своё бесчестье?» Также возможно: «мой позор» или «моё поругание».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может буквально передаваться как «один из глупцов», но здесь речь идёт о нравственно низком, бесстыдном человеке.
    reason: lexical_alternative
  - marker: c
    text: То есть царь не откажется отдать её Амнону. Из слов Фамари неясно, была ли это искренняя надежда или отчаянная попытка отсрочить насилие.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה אוֹלִיךְ אֶת חֶרְפָּתִי
  choice: куда деваться с моим бесчестьем
  rationale: Буквальный образ движения — «куда я унесу своё бесчестье?» — выражает невозможность избавиться от публичного позора. Русская идиома «куда мне деваться с…» естественно передаёт риторический вопрос и сохраняет оттенок неотступного бесчестья.
- source_word: חֶרְפָּתִי
  choice: моим бесчестьем
  rationale: Слово обозначает позор, поругание и утрату общественной чести; «бесчестье» уместно в достоинственном повествовательном регистре и подчёркивает социальные последствия насилия.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: одним из негодяев
  rationale: נָבָל здесь характеризует нравственно низкого, бесстыдного человека, а не просто человека с недостатком ума. «Негодяй» ясно передаёт моральное осуждение на современном русском.
- source_word: דַּבֶּר נָא
  choice: прошу, поговори
  rationale: Частица נָא смягчает повеление и выражает настойчивую просьбу. «Прошу, поговори» звучит естественно в прямой речи и сохраняет мольбу Фамари.
- source_word: לֹא יִמְנָעֵנִי מִמֶּךָּ
  choice: он не откажет тебе во мне
  rationale: Оборот буквально означает, что царь не удержит Фамарь от Амнона. Русская конструкция передаёт предполагаемое согласие царя отдать её ему, не добавляя слова «замуж», которого в тексте нет.
theological_decisions:
- issue: Характер обращения Фамари к царю
  choice: Передать её слова прямо, не определяя, была ли просьба искренней или тактической.
  alternative: Уточнить, что Фамарь действительно ожидала разрешения на брак, либо что она лишь пыталась отсрочить насилие.
  rationale: Сам стих не сообщает, считала ли Фамарь такой исход законным и возможным или пыталась выиграть время. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит настойчиво и естественно, сохраняя достоинство и трагическое напряжение сцены. Имена и контекст не добавлены в основной текст, поскольку их нет в данном стихе.
