base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: ru
  text: Тогда царь встал[a], разорвал свои одежды и лёг на землю; все его слуги стояли в разорванных одеждах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Разрывание одежд было обычным выражением скорби, ужаса или траура.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма Qal wayyiqtol от קום продолжает последовательность повествования и передаёт резкую реакцию царя.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное обозначает известного из контекста царя Давида; вслед за оригиналом сохранён титул, а не подставлено имя.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: разорвал на себе одежды
  rationale: Сочетание קרע с בגד обозначает обычай разрывать свою одежду при скорби или потрясении. Оборот «на себе» естественно выражает русский идиоматический смысл, не добавляя нового действия.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: лёг на землю
  rationale: שכב обозначает принятие лежачего положения, а אַרְצָה с направительным окончанием — движение к земле; «лёг на землю» точно и естественно передаёт оба элемента.
- source_word: וְכָל־עֲבָדָיו
  choice: а все его слуги
  rationale: עֲבָדָיו здесь может охватывать царских слуг и придворных. «Слуги» сохраняет широту термина и не уточняет их должности сверх текста.
- source_word: נִצָּבִים
  choice: стояли рядом
  rationale: Причастие Niphal от נצב описывает продолжающееся положение стоя, вероятно в присутствии царя. «Рядом» естественно передаёт сценическую соотнесённость, хотя пространственная близость выражена контекстуально.
- source_word: קְרֻעֵי בְגָדִים
  choice: в разорванных одеждах
  rationale: Пассивное причастие с существительным описывает состояние одежды слуг как уже разорванной; русская предложная конструкция сохраняет этот результативный смысл.
