  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: ru
  text: 'Тогда Ионадав, сын Шимы, брата Давида, ответил: «Пусть господин мой не говорит: „Все юноши, царские сыновья, убиты“. Умер только Амнон. Ибо это было задумано Авессаломом[a] с того дня, как Амнон обесчестил Фамарь, свою сестру[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это было установлено по слову (или: повелению) Авессалома»; речь идёт о его твёрдом решении или замысле.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может означать «унизил»; в данном контексте речь идёт об изнасиловании.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: сказал
  rationale: В повествовательной формуле וַיַּעַן нередко вводит реплику как ответ на ситуацию; сочетание двух глаголов естественно передаётся по-русски одним «сказал», без тяжеловесного «ответил и сказал».
- source_word: שִׁמְעָה
  choice: Шима
  rationale: Передаёт еврейское имя שִׁמְעָה в форме, близкой к его звучанию; родительный падеж — «сын Шимы».
- source_word: אֲחִי דָוִד
  choice: брата Давида
  rationale: 'Определение относится к Шиме: Ионадав был сыном Шимы, который был братом Давида.'
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Пусть господин мой не думает
  rationale: Глагол אמר буквально означает «говорить», но здесь речь о принятии поступившего сообщения за истину; «не думает» естественно выражает запрещение такого вывода, сохраняя почтительное обращение.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: все юноши, сыновья царя
  rationale: נְעָרִים здесь обозначает молодых мужчин, далее уточнённых приложением «сыновья царя».
- source_word: הֵמִיתוּ
  choice: убиты
  rationale: Пассивная русская конструкция естественно передаёт содержание дошедшего до Давида сообщения, не вводя неопределённое «они», чей референт в отдельном стихе неясен.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: Умер один лишь Амнон
  rationale: Сохраняет усиленное לְבַדּוֹ, подчёркивающее, что погиб только Амнон.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: Авессалом решил это
  rationale: Идиома עַל־פִּי вместе с результативным הָיְתָה שׂוּמָה указывает на установленное Авессаломом решение или замысел. Краткая активная конструкция ясна по-русски, а буквальная образность и возможный оттенок приказа отмечены в сноске.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: с того дня, когда Амнон обесчестил
  rationale: Пиэль ענה в данном контексте означает сексуальное надругательство и унижение. Имя Амнона названо явно, чтобы русский читатель не принял ближайшее имя Авессалома за субъект действия.
- source_word: תָּמָר אֲחֹתוֹ
  choice: Фамарь, его сестру
  rationale: Сохраняет обозначение Фамари как сестры; местоимение по контексту относится к Амнону, который также был её братом по отцу.
theological_decisions:
- issue: Степень эксплицитности описания преступления Амнона
  choice: обесчестил
  alternative: изнасиловал; унизил
  rationale: «Обесчестил» сохраняет семантическую широту ענה — насилие и унижение — и соответствует достоинству повествовательного регистра; более прямое контекстуальное значение указано в сноске без смягчения сути события.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Придворная почтительность сохранена в обращении «господин мой». Внутренняя цитата оформлена кавычками второго уровня. Имена переданы в привычной русской библейской форме, кроме שִׁמְעָה, переданного непосредственно как «Шима».
