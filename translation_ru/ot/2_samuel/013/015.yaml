  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: ru
  text: 'И Амнон возненавидел её чрезвычайно сильной ненавистью, потому что ненависть, с которой он её ненавидел, была сильнее любви, которую он прежде питал к ней. И Амнон сказал ей: «Встань, иди!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Встань, иди». Два кратких повеления передают резкость обращения Амнона к Фамари.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: И возненавидел её Амнон
  rationale: Повествовательная форма продолжает последовательность событий; глагол שׂנא означает «ненавидеть», а суффикс 3-го лица женского рода указывает на Фамарь как на объект.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: чрезвычайно великой ненавистью
  rationale: Творительный образа действия сохраняет однокоренное усиление «возненавидел… ненавистью» и нагромождение показателей интенсивности גְּדוֹלָה מְאֹד.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение предыдущего утверждения и здесь естественно передаётся причинной связью.
- source_word: גְדוֹלָה הַשִּׂנְאָה … מֵאַהֲבָה
  choice: ненависть… была сильнее любви
  rationale: Предлог מִן выражает сравнение. «Сильнее» естественно сочетается в русском с чувствами и передаёт сравнительный смысл прилагательного גָּדוֹל.
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: которой он возненавидел её
  rationale: Сохранена относительная конструкция и намеренный повтор корня שׂנא.
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: которой он прежде любил её
  rationale: Слово «прежде» естественно передаёт предшествование этой любви возникшей затем ненависти, не устраняя риторический параллелизм.
- source_word: קוּמִי לֵכִי
  choice: Встань, уходи!
  rationale: Два повелительных глагола женского рода переданы кратко и резко. В данном контексте «уходи» естественнее русского «иди» и выражает требование покинуть место без дополнительного уточнения направления.
