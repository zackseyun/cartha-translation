  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: ru
  text: 'Итак, пусть мой господин, царь, не принимает близко к сердцу[a] известие, будто все сыновья царя умерли: умер только Амнон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть не полагает это слово на своё сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Передаёт связующий переход к исправлению ранее полученного известия, сохраняя начальное וְ.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: пусть ... не принимает близко к сердцу
  rationale: Естественная русская идиома, сохраняющая образ сердца и смысл призыва не усваивать тревожное известие как истинное.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Достоинственное придворное обращение, передающее почтительность и суффикс первого лица.
- source_word: דָּבָר לֵאמֹר
  choice: 'слова:'
  rationale: Здесь דָּבָר обозначает содержание сообщения, которое далее приводится прямой речью; двоеточие естественно передаёт функцию לֵאמֹר.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ מֵתוּ
  choice: Все сыновья царя умерли
  rationale: Прямо передаёт содержание ложного донесения; прошедшее совершенного вида естественно для русского сообщения о смерти.
- source_word: כִּי אִם אַמְנוֹן לְבַדּוֹ מֵת
  choice: потому что умер один только Амнон
  rationale: כִּי אִם в контексте вводит исключающее исправление, а «один только» ясно сохраняет усиленную исключительность לְבַדּוֹ.
