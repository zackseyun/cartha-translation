base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: ru
  text: Через два полных года[a] у Авессалома стригли овец в Ваал-Гацоре, что близ Ефрема, и Авессалом пригласил всех царских сыновей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «двух лет дней» — выражение, обозначающее полный двухлетний срок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: через два полных года
  rationale: Сочетание буквально означает «через два года дней» и выражает завершившийся двухлетний срок; «через два полных года» естественно передаёт смысл идиомы.
- source_word: גֹזְזִים
  choice: стригли овец
  rationale: Причастие от גזז обозначает стригущих; объект «овец» подразумевается контекстом и выражен по-русски для ясности.
- source_word: בְּבַעַל חָצוֹר
  choice: в Ваал-Гацоре
  rationale: Географическое название передано традиционной русской транслитерацией; предлог указывает на место стрижки.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: что близ Ефрема
  rationale: עִם здесь указывает на географическую близость; формулировка сохраняет относительное определение места.
- source_word: וַיִּקְרָא
  choice: пригласил
  rationale: В контексте праздника по случаю стрижки глагол «позвал» имеет прагматический смысл приглашения.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: всех царских сыновей
  rationale: Естественная русская передача конструкции принадлежности, сохраняющая полный охват словом «всех».
- source_word: וַיְהִי
  choice: через…
  rationale: Нарративная конструкция вводит следующее событие; отдельное «и было» в современном русском не требуется, а последовательность естественно выражена временным оборотом.
