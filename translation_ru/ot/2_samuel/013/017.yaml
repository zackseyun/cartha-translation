  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: ru
  text: 'Тогда он позвал своего юношу, который прислуживал ему, и сказал: «Выведите[a], пожалуйста, эту[b] от меня вон и запри за ней дверь[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте первый приказ стоит во множественном числе, хотя назван один слуга; следующий приказ — в единственном. Перевод сохраняет эту смену числа.
    reason: textual_ambiguity
  - marker: b
    text: Буквально «эту». Указательное местоимение женского рода относится к Фамари и звучит намеренно отстранённо и презрительно.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «закрой на засов». Еврейский глагол может означать «запереть», «задвинуть засов» или «крепко закрыть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: своего юношу, который прислуживал ему
  rationale: Сочетание сохраняет как значение נַעַר — «юноша, молодой слуга», так и описательную силу причастия מְשָׁרֵת — «служащий, прислуживающий».
- source_word: שִׁלְחוּ נָא
  choice: Выгони, пожалуйста
  rationale: Глагол означает удалить или выслать наружу; «выгони» естественно передаёт действие в данной сцене, а «пожалуйста» отражает частицу נָא, не смягчая властного характера приказа.
- source_word: זֹאת
  choice: эту
  rationale: Самостоятельное указательное местоимение женского рода прямо отсылает к Фамари и сохраняет намеренно отстранённый, презрительный тон без добавления отсутствующего в еврейском тексте существительного «женщину».
- source_word: מֵעָלַי הַחוּצָה
  choice: от меня вон
  rationale: Так передаётся движение прочь от говорящего и наружу; русское «вон» сохраняет резкий тон приказа.
- source_word: וּנְעֹל הַדֶּלֶת אַחֲרֶיהָ
  choice: и запри за ней дверь
  rationale: נעל может означать запереть, закрыть на засов или преградить; нейтральное «запри» естественно по-русски и не уточняет устройство древней двери.
