source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: ru
  text: У Амнона был друг по имени Ионадав, сын Шимы, брата Давида. Ионадав был человеком весьма умным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весьма мудрым»; или: «весьма хитроумным». Еврейское слово имеет широкий смысл и может обозначать мудрость, ум или искусность; дальнейшее повествование показывает, что ум Ионадава проявился в нравственно сомнительном совете.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַמְנוֹן
  choice: У Амнона был
  rationale: Еврейская конструкция с לְ выражает обладание; по-русски естественно передаётся конструкцией «у ... был». Союз ו связывает предложение с контекстом, но отдельного временного «теперь» в источнике нет.
- source_word: רֵעַ
  choice: друг
  rationale: Существительное обозначает друга, товарища или близкого человека; «друг» естественно передаёт характер отношений в данном повествовании.
- source_word: וּשְׁמוֹ יוֹנָדָב
  choice: по имени Ионадав
  rationale: Естественная русская передача еврейской формулы называния без изменения её смысла.
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: сын Шимы, брата Давида
  rationale: 'Форма «брата» однозначно относит приложение к Шиме: именно Шима назван братом Давида.'
- source_word: אִישׁ חָכָם מְאֹד
  choice: человеком весьма умным
  rationale: חָכָם имеет широкий диапазон значений — «мудрый, умный, искусный». В контексте последующего нравственно сомнительного совета «умный» сохраняет интеллектуальный смысл, не приписывая Ионадаву нравственной мудрости; מְאֹד передано усилителем «весьма».
theological_decisions:
- issue: Нравственная оценка свойства Ионадава
  choice: умным
  alternative: мудрым; хитрым
  rationale: Источник прямо характеризует Ионадава словом חָכָם, которое может быть положительным или нейтральным в зависимости от контекста. «Умный» сохраняет эту неоднозначность лучше, чем положительно окрашенное «мудрый» или отрицательно окрашенное «хитрый».
translation_notes:
  register: Современный литературный русский язык с естественным порядком слов и умеренно возвышенным библейским регистром. Разделение на два предложения делает родственные связи ясными и сохраняет повествовательное ударение на характеристике Ионадава.
