base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: ru
  text: Авессалом не говорил Амнону ни худого, ни доброго[a], потому что ненавидел Амнона за то, что тот надругался[b] над Фамарью, сестрой Авессалома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не говорил Амнону ни худого, ни доброго»; это выражение означает, что Авессалом вообще ничего ему не говорил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унизил». В данном контексте еврейский глагол означает совершённое Амноном сексуальное насилие над Фамарью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: не говорил Амнону
  rationale: Сочетание דבר с עם означает говорить с кем-либо или кому-либо. Русское «не говорил Амнону» естественно вводит последующее «ни худого, ни доброго» и передаёт прекращение общения без лишнего истолкования.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: ни худого, ни доброго
  rationale: Сохранена еврейская полярная формула, охватывающая всякую речь. В русском она звучит несколько возвышенно, но ясно и уместно для библейского повествования; смысл идиомы пояснён в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину молчания Авессалома; «потому что» прямо и естественно выражает причинную связь.
- source_word: שָׂנֵא
  choice: ненавидел
  rationale: Прямой современный эквивалент сильного обозначения ненависти, без смягчения чувства Авессалома.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: за то, что
  rationale: Естественная русская причинная конструкция, сохраняющая оттенок основания ненависти, выраженный буквально как «из-за дела, что…».
- source_word: עִנָּה
  choice: надругался
  rationale: В данном контексте глагол обозначает сексуальное насилие, унижение и поругание Фамари. «Надругался» ясно передаёт это, не сводя многозначный еврейский глагол к узкому юридическому термину.
- source_word: אֲחֹתוֹ
  choice: его сестрой
  rationale: Местоимение отнесено к Авессалому, ближайшему смысловому носителю родственной связи; имя Фамарь поставлено в естественной русской конструкции.
