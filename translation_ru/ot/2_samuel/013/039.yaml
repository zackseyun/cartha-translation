base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: ru
  text: Царь Давид тосковал, желая пойти к Авессалому[a], ибо он утешился об Амноне, так как тот умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза допускает иное понимание: «Царь Давид перестал выходить к Авессалому». В контексте это иногда понимают как прекращение действий против него. Вероятно, в традиционном понимании подразумевается слово «душа»: «душа царя Давида изнывала, желая выйти к Авессалому».'
    reason: Сохранить заметную грамматическую и смысловую неоднозначность масоретского текста, не выдавая контекстуальное значение «против» за буквальное значение предлога.
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: истосковался по Авессалому
  rationale: 'Форма וַתְּכַל, вероятно, предполагает опущенное существительное женского рода «душа»: «душа царя Давида изнывала, желая выйти к Авессалому». По-русски это естественно и ёмко передаётся глаголом «истосковался», не требующим буквального воспроизведения идиомы «выйти к».'
- source_word: נִחַם עַל־אַמְנוֹן
  choice: утешился после смерти Амнона
  rationale: 'Глагол נחם в форме нифаль здесь означает «утешиться», а עַל указывает, в связи с кем или чем прошло горе. Следующее כִּי מֵת поясняет причину: Амнон был мёртв.'
theological_decisions:
- issue: Неоднозначность первой фразы из-за необычной грамматики и возможного опущенного слова «душа»
  choice: 'Передать традиционно-контекстуальное понимание: Давид тосковал по Авессалому'
  alternative: «Царь Давид перестал выходить против Авессалома» или «перестал стремиться к Авессалому»
  rationale: Женский род וַתְּכַל естественно объясняется подразумеваемым נֶפֶשׁ («душа»), а ближайший контекст 14:1 говорит, что сердце царя было обращено к Авессалому. Однако грамматическая трудность подлинна, поэтому альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык. «Истосковался» передаёт сильное и продолжительное стремление естественно и достойно; «уже» ясно выражает завершившееся утешение, подразумеваемое формой נִחַם и контекстом.
