  text: וַ/יֹּ֨אמֶר אֵלֶ֜י/הָ אַבְשָׁל֣וֹם אָחִ֗י/הָ הַ/אֲמִינ֣וֹן אָחִי/ךְ֮ הָיָ֣ה עִמָּ/ךְ֒ וְ/עַתָּ֞ה אֲחוֹתִ֤/י הַחֲרִ֨ישִׁי֙ אָחִ֣י/ךְ ה֔וּא אַל תָּשִׁ֥יתִי אֶת לִבֵּ֖/ךְ לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תֵּ֤שֶׁב תָּמָר֙ וְ/שֹׁ֣מֵמָ֔ה בֵּ֖ית אַבְשָׁל֥וֹם אָחִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: ru
  text: 'И сказал ей брат её Авессалом: «Не Амнон ли, брат твой, был с тобой?[a] А теперь, сестра моя, молчи: он твой брат. Не принимай этого близко к сердцу». И осталась Фамарь опустошённой[b] в доме своего брата Авессалома.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «был с тобой» — сдержанное выражение, которое здесь указывает на сексуальное насилие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разорённой», «в запустении». Еврейское слово передаёт состояние опустошения, разорённости и потрясения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: Амнон
  rationale: Имя передано в принятой русской библейской форме, близкой к еврейскому звучанию.
- source_word: הָיָה עִמָּךְ
  choice: был с тобой
  rationale: Сохранено намеренно косвенное выражение еврейского текста; в данном контексте оно подразумевает совершённое над Фамарью сексуальное насилие.
- source_word: הַחֲרִישִׁי
  choice: молчи
  rationale: Краткий императив естественно передаёт повеление хранить молчание и не смягчает тревожный тон слов Авессалома.
- source_word: אָחִיךְ הוּא
  choice: он твой брат
  rationale: Буквально сохранена ссылка Авессалома на родство без добавочного истолкования её мотива или смысла.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Не принимай этого близко к сердцу
  rationale: Современный русский фразеологический эквивалент еврейского оборота «не полагай сердца на это дело»; передаёт призыв не сосредоточиваться на случившемся.
- source_word: וַתֵּשֶׁב
  choice: осталась
  rationale: В контексте глагол описывает дальнейшее пребывание Фамари в доме Авессалома и её сохраняющееся состояние.
- source_word: שֹׁמֵמָה
  choice: опустошённой
  rationale: Слово обозначает разорённость, запустение и потрясённое состояние; «опустошённой» естественно передаёт как внутреннюю, так и социальную разорённость Фамари.
- source_word: בֵּית אַבְשָׁלוֹם אָחִיהָ
  choice: в доме своего брата Авессалома
  rationale: Сохранены конкретное домашнее место действия и повторное указание на родство.
theological_decisions:
- issue: Косвенное обозначение сексуального насилия
  choice: Сохранить выражение «был с тобой» в основном тексте и пояснить его в сноске.
  alternative: «Надругался над тобой» или «лёг с тобой».
  rationale: Еврейский текст говорит косвенно. Более явный вариант прояснил бы событие, но снял бы присущую исходному повествованию эвфемистическую сдержанность.
- issue: Смысл слов «он твой брат»
  choice: Передать буквально, не объясняя, почему Авессалом ссылается на родство.
  alternative: Добавить «всё-таки» либо истолковать фразу как основание для молчания.
  rationale: Текст оставляет disturbing связь между родством и требованием молчать без развёрнутого объяснения; перевод не должен сглаживать или доктринально переосмысливать её.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена «Авессалом» и «Фамарь» даны в укоренившихся русских библейских формах, «Амнон» — в форме, непосредственно отражающей исходное имя. Синтаксис слегка приподнят, но понятен обычному современному читателю.
