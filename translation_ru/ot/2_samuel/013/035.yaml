  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: ru
  text: 'Тогда Ионадав сказал царю: «Вот, сыновья царя пришли. Как и говорил твой слуга, так и случилось».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: יֽוֹנָדָב
  choice: Ионадав
  rationale: Использована традиционная русская библейская форма имени.
- source_word: אֶל הַמֶּלֶךְ
  choice: царю
  rationale: Естественный русский дательный падеж точно передаёт адресата речи; речь идёт о земном царе Давиде.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к непосредственно наблюдаемому событию; «вот» современно и сохраняет указательную силу.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: сыновья царя
  rationale: Сохранено множественное число, важное в контексте опровержения вести о гибели всех царских сыновей.
- source_word: בָּאוּ
  choice: пришли
  rationale: Совершенный вид передаёт уже состоявшееся и теперь очевидное прибытие.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: Как говорил твой слуга
  rationale: Выражение передаёт содержание ранее сказанного; «твой слуга» сохраняет придворное самообозначение говорящего.
- source_word: כֵּן הָיָה
  choice: так и случилось
  rationale: Фраза подтверждает точное соответствие события прежним словам Ионадава и естественно звучит по-русски.
