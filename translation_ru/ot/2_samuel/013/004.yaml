  terminology: Имена «Амнон», «Тамар» и «Авессалом» приняты и последовательны. «Я люблю» верно сохраняет обычное значение אָהֵב, не подменяя его интерпретацией «желаю». Родственное определение передано без доктринального или психологического уточнения.
