  source_fidelity: В целом перевод точно передаёт вопрос о причине видимого истощения, повторяемость «утро за утром», побудительный вопрос и признание Амнона. Однако בֶּן הַמֶּלֶךְ естественнее и прямее передать как «сын царя», а глагол וַיֹּאמֶר не следует без необходимости сужать до «спросил».
