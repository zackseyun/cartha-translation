base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: ru
  text: 'Он сказал ему: «Почему ты, сын царя, каждое утро[a] так измождён? Не скажешь мне?» Амнон сказал ему: «Я люблю[b] Тамар, сестру моего брата Авессалома».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утро за утром»; более буквально: «утром, утром».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я влюблён в Тамар». Буквально по-еврейски: «Я люблю Тамар».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямой вопрос о причине; простое «почему» точно и естественно передаёт еврейское вопросительное слово.
- source_word: כָּכָה דַּל
  choice: такой измождённый
  rationale: דַּל здесь описывает заметно ослабевший, истощённый вид Амнона, а не бедность; «измождённый» передаёт физическое и душевное угасание, не уточняя его причину.
- source_word: בֶּן הַמֶּלֶךְ
  choice: царский сын
  rationale: Сохраняет прямое обращение и его риторический акцент, оставаясь естественным по-русски.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: утро за утром
  rationale: Повтор существительного выражает регулярность; русский оборот сохраняет образную повторяемость исходной фразы.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Не расскажешь мне?
  rationale: Вопрос предполагает утвердительный ответ и побуждает собеседника открыться; выбранная формулировка естественно передаёт это ожидание.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: сестру моего брата Авессалома
  rationale: Сохраняет порядок отношений в еврейском тексте и подчёркивает связь Тамар с братом Амнона.
- source_word: אֲנִי אֹהֵב
  choice: Я люблю
  rationale: Использован обычный глагол «любить» без внесения в сам стих более узкого толкования как влюблённости или вожделения.
theological_decisions:
- issue: Характер чувства Амнона к Тамар
  choice: Я люблю Тамар
  alternative: Я влюблён в Тамар; Я желаю Тамар
  rationale: Еврейский текст использует обычный глагол אָהֵב («любить»). Хотя последующее повествование раскрывает греховный характер желания Амнона, данный стих сам по себе называет его чувство любовью; перевод не должен заранее разрешать эту нравственную и психологическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествованием. Имена переданы как «Амнон», «Тамар» и «Авессалом»; синтаксис обращения и родственных связей сохраняет акценты оригинала без ненужной архаизации.
