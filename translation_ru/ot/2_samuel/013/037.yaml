base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: ru
  text: Авессалом же бежал и отправился к Фалмаю, сыну Аммихура, царю Гессура. А Давид[a] всё это время оплакивал своего сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте имя Давида здесь не названо: буквально — «и он оплакивал». Из контекста ясно, что речь идёт о Давиде.'
    reason: implicit_subject
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם בָּרַח
  choice: Авессалом же бежал
  rationale: Частица «же» естественно передаёт повествовательное противопоставление, а «бежал» точно выражает значение ברח.
- source_word: וַיֵּלֶךְ אֶל
  choice: и отправился к
  rationale: «Отправился к» естественно передаёт движение к человеку и звучит яснее, чем буквальное «пошёл к».
- source_word: תַּלְמַי בֶּן עַמִּיחוּר
  choice: к Фалмаю, сыну Аммихуда
  rationale: Имена переданы в традиционной русской библейской форме; патронимическая конструкция сохранена прямо.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: царю Гессура
  rationale: Сопряжённая конструкция передана обычным русским сочетанием титула с родительным падежом географического названия.
- source_word: וַיִּתְאַבֵּל עַל בְּנוֹ
  choice: А Давид всё это время оплакивал своего сына
  rationale: Глагол обозначает траур и скорбь по умершему; «оплакивал» передаёт это точнее, чем общее «скорбел». Имя субъекта добавлено для ясности и отмечено сноской, поскольку в еврейском тексте оно подразумевается контекстом.
- source_word: כָּל הַיָּמִים
  choice: всё это время
  rationale: Идиоматично передаёт продолжительность в данном повествовательном контексте, не создавая ошибочного впечатления «до конца жизни».
theological_decisions:
- issue: Неявный субъект формы וַיִּתְאַבֵּל
  choice: В основном тексте назван Давид с указанием сноски
  alternative: Оставить местоимение «он», формально сохранив неоднозначность
  rationale: Грамматически субъект не назван, однако ближайший широкий контекст указывает на Давида; сноска сохраняет прозрачность исходной неоднозначности и не позволяет принять Фалмая или Авессалома за субъекта.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно возвышенный. Традиционные русские формы библейских имён сохранены. Буквальный оборот «все дни» передан естественным для русского повествования выражением «всё это время».
