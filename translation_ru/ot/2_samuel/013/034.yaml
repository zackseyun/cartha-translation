  - marker: b
    text: Еврейское «поднял свой глаз» — устойчивое выражение со значением «посмотрел; взглянул».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с дороги позади него, со стороны горы». Пространственное соотношение частей этой фразы в еврейском тексте выражено сжато и допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Глагол ברח обозначает бегство или спасение бегством; «бежал» кратко и естественно передаёт развитие повествования.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: юноша, стоявший на страже
  rationale: נַעַר может означать юношу или слугу, а причастие צֹפֶה — наблюдающего, дозорного. Перевод сохраняет оба элемента, не превращая персонажа безусловно в должностного стража.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: поднял глаза
  rationale: Естественный русский эквивалент распространённой еврейской идиомы, сохраняющий образ исходного текста.
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'и увидел: вот'
  rationale: «Вот» передаёт функцию הִנֵּה, привлекающего внимание к внезапно открывшейся наблюдателю картине.
- source_word: עַם רַב
  choice: множество людей
  rationale: Передаёт собирательное עַם и значение многочисленности у רַב, не предполагая организованного собрания.
- source_word: הֹלְכִים
  choice: идёт
  rationale: В сочетании с собирательным «множество людей» в русском требуется единственное число; нейтральное «идёт» не добавляет направления, которое в еврейском определяется контекстом.
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: по дороге позади него, со стороны горы
  rationale: Близко передаёт сжатое пространственное описание масоретского текста, не устраняя неясность связи оборотов и местоимения.
