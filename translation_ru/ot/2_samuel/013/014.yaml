base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: ru
  text: Но он не захотел её слушать[a], одолел её[b], надругался над ней[c] и лёг с ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не захотел слушать её голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оказался сильнее её».'
    reason: lexical_alternative
  - marker: c
    text: Древнееврейский глагол может означать «унизил» или «надругался»; здесь речь идёт о сексуальном насилии.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: не захотел
  rationale: Глагол выражает нежелание или отказ; сочетание «не захотел… слушать» естественно передаёт волевой характер отказа.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: слушать её
  rationale: 'Буквально: «слушать её голос»; в данном контексте речь о том, чтобы внять её словам и мольбе.'
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: одолел её
  rationale: Конструкция с חזק и сравнительным מן означает, что он превозмог её силой. «Одолел её» естественно передаёт фактическое превосходство и действие, не делая фразу громоздкой.
- source_word: וַיְעַנֶּהָ
  choice: надругался над ней
  rationale: В контексте сексуального насилия ענה обозначает унижение и поругание женщины посредством насильственного полового акта. Выбор сохраняет тяжесть смысла и не ослабляет насильственный характер события.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: лёг с ней
  rationale: Близко передаёт древнееврейское выражение со значением полового сношения и сохраняет отдельный глагол в последовательности повествования.
theological_decisions:
- issue: Степень прямоты обозначения сексуального насилия
  choice: «надругался над ней» с поясняющей сноской о сексуальном насилии
  alternative: «изнасиловал её»
  rationale: Контекст однозначно описывает насилие, однако глагол ענה имеет более широкий оттенок унижения и поругания. Основной текст сохраняет эту смысловую широту, а сноска устраняет возможное смягчающее прочтение.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и тяжёлый. Последовательность глаголов оригинала сохранена. Формулировка не романтизирует и не смягчает насилие, а сноски отражают буквальную форму и лексическую широту древнееврейского текста.
