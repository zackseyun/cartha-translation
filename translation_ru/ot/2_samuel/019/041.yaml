  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: ru
  text: Затем царь переправился в Гилгал, и Кимхан переправился вместе с ним. Весь народ Иуды сопровождал царя при переправе[a], как и половина народа Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переправил царя». Еврейский глагол с прямым дополнением здесь может означать как помощь царю в переправе, так и сопровождение его на другой берег.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: переправился
  rationale: В контексте возвращения Давида речь идёт о переправе через Иордан; глагол «переправился» естественно и точно передаёт движение через водную преграду.
- source_word: הַגִּלְגָּלָה
  choice: к Галгалу
  rationale: Направительный суффикс -ה указывает на движение по направлению к Галгалу; «к Галгалу» сохраняет эту направленность без утверждения, что царь уже вошёл в город.
- source_word: וְכִמְהָן
  choice: и Химгам
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: עָבַר עִמּוֹ
  choice: переправился вместе с ним
  rationale: Повтор того же русского глагола сохраняет лексическую связь с переправой царя; «вместе с ним» естественно передаёт עִמּוֹ.
- source_word: וְכָל עַם יְהוּדָה
  choice: весь народ Иуды
  rationale: Фраза обозначает людей, принадлежавших к Иуде; этот вариант краток и сохраняет политико-племенное различие между Иудой и Израилем.
- source_word: וַיַעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: переправил царя
  rationale: 'При прямом дополнении עבר здесь имеет каузативно-переходное значение: народ Иуды помог царю совершить переправу или доставил его на другой берег. Русское «переправил» точно и естественно передаёт это значение.'
- source_word: וְגַם
  choice: а с ним и
  rationale: Конструкция естественно вводит дополнительную группу участников и сохраняет добавочный акцент וְגַם.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: половина народа Израиля
  rationale: Буквально передаёт количественное выражение и сохраняет противопоставление Иуды и Израиля, не уточняя сверх текста, какие именно группы подразумеваются.
