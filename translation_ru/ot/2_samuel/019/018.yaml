translation:
  language: ru
  text: И с ним была тысяча человек из Вениамина, а также Сива, слуга дома Саула, с пятнадцатью своими сыновьями и двадцатью слугами. Они перешли Иордан перед царём[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впереди царя». Еврейское выражение может означать как нахождение перед царём, в его присутствии, так и движение впереди него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: тысяча человек
  rationale: Числительное с אִישׁ обозначает тысячу мужчин; в современном русском «тысяча человек» естественно выражает численность группы, не подразумевая смешанный состав.
- source_word: מִבִּנְיָמִן
  choice: из Вениамина
  rationale: Кратко сохраняет указание на племенную принадлежность; имя колена употреблено метонимически.
- source_word: צִיבָא
  choice: Сива
  rationale: Традиционная русская библейская передача личного имени.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: слуга дома Саула
  rationale: В данном контексте נַעַר обозначает служителя, а «дом Саула» сохраняет одновременно бытовой и династический оттенок.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: с пятнадцатью своими сыновьями
  rationale: Предлог «с» естественно связывает перечисление со спутниками Сивы; «своими» ясно указывает на Сиву.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: и двадцатью слугами
  rationale: עֶבֶד допускает значения «раб» и «слуга»; здесь речь идёт о людях из домашнего окружения, поэтому нейтральное «слуги» уместнее.
- source_word: וְצָלְחוּ
  choice: они перешли
  rationale: Глагол в сочетании с названием реки означает переход на другой берег.
- source_word: הַיַּרְדֵּן
  choice: Иордан
  rationale: Устоявшееся русское название реки; дополнительное слово «река» не требуется.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: 'Формулировка сохраняет пространственную неоднозначность: действие могло совершаться как в присутствии царя, так и впереди него.'
