  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: ru
  text: Царь возвратился и дошёл до Иордана. Люди из колена Иуды[a] пришли в Галгал, чтобы выйти навстречу царю и переправить царя через Иордан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Иуда пришёл». Название колена употреблено собирательно — о людях из колена Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: Глагол שוב в повествовательной форме обозначает возвращение Давида после бегства; «возвратился» естественно и точно передаёт контекст.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: дошёл до Иордана
  rationale: Сочетание בוא с עַד указывает на достижение границы или места, не утверждая, что царь уже перешёл реку.
- source_word: וִיהוּדָה
  choice: люди из колена Иуды
  rationale: Название «Иуда» употреблено собирательно о колене и его людях. Явное выражение собирательного смысла делает фразу понятной современному русскому читателю и не позволяет принять «Иуду» за отдельного человека.
- source_word: בָּא
  choice: пришли
  rationale: Форма qatal сообщает о прибытии людей Иуды; русское прошедшее время естественно продолжает повествование. Множественное число согласовано с раскрытым собирательным значением.
- source_word: הַגִּלְגָּלָה
  choice: в Галгал
  rationale: Направительный ה при названии места обозначает движение к Галгалу; по-русски это естественно передаётся предлогом «в».
- source_word: לָלֶכֶת לִקְרַאת
  choice: чтобы выйти навстречу
  rationale: Два инфинитива выражают цель движения. «Выйти навстречу» естественно передаёт намеренное движение для встречи, не меняя смысла.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: переправить царя через Иордан
  rationale: Каузативная форма עבר означает помочь или сделать так, чтобы царь перешёл реку. «Переправить» сохраняет этот смысл, не уточняя не названное в тексте средство переправы.
