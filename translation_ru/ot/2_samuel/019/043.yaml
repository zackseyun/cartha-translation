translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Собирательное противопоставление Иуды и Израиля сохранено через формы единственного числа, соответствующие еврейской риторике; внутри реплики сохранён переход от единственного «мне/ты» к общему «мы».
