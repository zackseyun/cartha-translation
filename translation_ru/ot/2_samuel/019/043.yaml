base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: ru
  text: 'Каждый из мужей Иуды ответил израильтянину: «Царь мне близок[a]. Почему же ты сердишься из-за этого? Разве мы хоть что-нибудь ели за царский счёт? Или нам что-нибудь подарили?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «царь близок ко мне». Говорящий говорит от лица Иуды; вероятнее всего, имеется в виду родственная или племенная близость.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст последней фразы труден; возможно также: «Или нам что-нибудь было поднесено?»'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן כָּל אִישׁ יְהוּדָה עַל אִישׁ יִשְׂרָאֵל
  choice: Каждый из мужей Иуды ответил израильтянину
  rationale: Сохраняется необычная собирательно-распределительная форма единственного числа («каждый муж Иуды» — «мужу Израиля»), при этом фраза звучит понятно по-русски. Предлог עַל при ענה в данном споре обозначает сторону, которой отвечают.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: Царь мне близок
  rationale: Передаёт буквальную relational-семантику קָרוֹב и сохраняет возможный оттенок родственной либо племенной близости, не сводя выражение безоговорочно к одному значению.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Почему же ты сердишься из-за этого?
  rationale: Идиома חרה ל передана естественным русским «сердиться»; הַדָּבָר הַזֶּה в контексте означает обсуждаемое дело или случившееся.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Разве мы хоть что-нибудь ели за царский счёт?
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает вопрос; «хоть что-нибудь» передаёт эмфазу. מִן הַמֶּלֶךְ здесь указывает на содержание за счёт царя или получение выгоды от него.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: Или нам что-нибудь подарили?
  rationale: Трудная пассивная конструкция от נשׂא параллельна вопросу о материальной выгоде. Русское «подарили» естественно выражает вероятный смысл, а неопределённый субъект не приписывает действие царю прямо, поскольку в еврейском тексте он здесь не назван.
