source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: ru
  text: 'А теперь встань, выйди и ободри своих слуг[a]. Клянусь Яхве: если ты не выйдешь, этой ночью с тобой не останется ни одного человека. И это будет для тебя хуже, чем все беды, постигшие тебя с юности до сих пор.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говори к сердцу своих слуг» — то есть обратись к ним с добрыми, ободряющими или убеждающими словами.'
    reason: Пояснение еврейской идиомы и сохранение её смыслового диапазона.
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт переход к срочному требованию и естественно связывает его с предыдущей речью.
- source_word: קוּם צֵא
  choice: встань, выйди
  rationale: Сохранены оба последовательных повеления и конкретное движение, выраженное еврейским текстом.
- source_word: וְדַבֵּר עַל־לֵב
  choice: и ободри
  rationale: Еврейская идиома буквально говорит об обращении к сердцу и в данном контексте означает речь, призванную поддержать, успокоить или расположить слушателей. «Ободри» естественно и ёмко передаёт основную функцию слов Иоава; буквальный образ и диапазон значений отмечены в сноске.
- source_word: עֲבָדֶיךָ
  choice: своих слуг
  rationale: В царском контексте речь идёт о подчинённых и приближённых Давида; «слуги» сохраняет придворно-служебное отношение, не навязывая значения рабской собственности.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: Клянусь Яхве
  rationale: Формула передана как непосредственная клятва; имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: если ты не выйдешь
  rationale: Отрицательная конструкция в составе клятвенного предупреждения естественно передаётся условным придаточным.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: этой ночью с тобой не останется ни одного человека
  rationale: לין здесь обозначает пребывание на ночь, а отрицательное «ни одного человека» сохраняет усиленную мысль о полном оставлении Давида.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: И это будет для тебя хуже всех бед
  rationale: Сравнительное значение задаётся предлогом מִן; רָעָה здесь обозначает несчастье или бедствие, а не нравственное зло.
- source_word: אֲשֶׁר בָּאָה עָלֶיךָ מִנְּעֻרֶיךָ עַד עָתָּה
  choice: постигавших тебя с юности доныне
  rationale: Причастная форма по-русски естественно охватывает череду бед на протяжении всей жизни Давида до настоящего момента.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте употреблено личное заветное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Характер выражения דַבֵּר עַל־לֵב
  choice: ободри
  alternative: говори к сердцу
  rationale: Идиома допускает оттенки утешения, заверения и убеждения. Контекст требует, чтобы Давид поддержал и расположил к себе людей, однако перевод не уточняет содержание его речи сверх значения ободрения; буквальная образность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с прямым, напряжённым тоном увещевания. Повеления кратки и энергичны; архаизм «доныне» использован умеренно как устойчивое торжественное обозначение периода вплоть до настоящего времени.
