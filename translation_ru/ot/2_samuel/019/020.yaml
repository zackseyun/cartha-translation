base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: ru
  text: 'И сказал он царю: «Пусть господин мой не ставит мне в вину[a] и не вспоминает, как твой слуга поступил дурно в тот день, когда господин мой, царь, вышел из Иерусалима, — чтобы царь принял это близко к сердцу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть не вменяет мне беззакония» или «пусть не исчисляет мне вины»; еврейский оборот имеет судебный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы царь положил это на своё сердце»; еврейская идиома означает принять что-либо близко к сердцу, серьёзно к этому отнестись или удержать это против кого-либо. Синтаксическая связь этого инфинитивного оборота с предшествующим запретом допускает разные толкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: не ставит мне в вину
  rationale: Еврейское выражение буквально говорит об исчислении или вменении беззакония. Русский оборот «ставить в вину» естественно передаёт судебно-нравственный смысл просьбы, не вводя излишне специальной терминологии.
- source_word: עָוֺן
  choice: вина (в составе выражения «ставить в вину»)
  rationale: В данном обороте существительное может обозначать проступок, вину или беззаконие, которое засчитывается человеку. Цельное русское выражение лучше передаёт функцию слова в контексте.
- source_word: תִּזְכֹּר
  choice: вспоминает
  rationale: 'Прямой эквивалент сохраняет заложенный в контексте, но не высказанный прямо смысл: не вспоминать проступок с намерением взыскать за него.'
- source_word: הֶעֱוָה
  choice: поступил дурно
  rationale: Форма глагола עוה указывает на неправильный, предосудительный поступок. Этот вариант современен, ясен и сохраняет нравственную оценку без архаизма.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Здесь это почтительное самообозначение подданного перед царём; «слуга» естественнее русского «раб» передаёт придворную формулу в данном контексте.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: вышел из Иерусалима
  rationale: Формально близкая передача сохраняет повествовательную связь с бегством Давида из города.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: принимает этого близко к сердцу
  rationale: Еврейская идиома буквально говорит о помещении чего-либо на сердце и означает серьёзно принять это во внимание, придать этому значение или удержать против кого-либо.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение к земному царю, а не Божье имя. Порядок слов сохраняет достоинство и придворный оттенок речи.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Повтор титула сохранён, поскольку он отражает почтительную манеру обращения и стиль еврейского текста.
theological_decisions:
- issue: Связь заключительного оборота לָשׂוּם הַמֶּלֶךְ אֶל לִבּוֹ с предшествующим запретом
  choice: 'Передать как продолжение просьбы с подразумеваемым отрицанием: «Пусть царь не принимает этого близко к сердцу»'
  alternative: «так, чтобы царь принял это близко к сердцу» или более буквально «положить царю это на сердце»
  rationale: В еврейском тексте отрицательная частица прямо стоит при «не вспоминает», а инфинитивный оборот тесно от него зависит. По смыслу просьбы Шимея отрицание распространяется и на принятие проступка к сердцу. Отдельное русское предложение ясно передаёт эту связь, не превращая слова в богословски нагруженное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Сохранены повторы «господин мой» и «царь», характерные для почтительного обращения; синтаксис слегка разгружен делением прямой речи на два предложения.
