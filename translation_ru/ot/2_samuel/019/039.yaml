base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: ru
  text: 'Тогда царь сказал: «Пусть Кимхам переправится со мной, и я сделаю для него то, что ты сочтёшь хорошим; и всё, что ты пожелаешь возложить на меня[a], я сделаю для тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё, о чём ты попросишь меня». Еврейское выражение несколько эллиптично; буквально: «и всё, что ты выберешь на меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Тогда царь сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Пусть Кимгам переправится со мной
  rationale: Имперфект имеет побудительное значение, а «переправится» сохраняет контекст перехода через Иордан.
- source_word: כִּמְהָם
  choice: Кимгам
  rationale: Имя передано транслитерацией, близкой к еврейскому произношению.
- source_word: וַאֲנִי אֶעֱשֶׂה לּוֹ
  choice: и я сделаю для него
  rationale: Сохраняется широкое значение עשה без уточнения характера обещанного благодеяния.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: то, что ты сочтёшь хорошим
  rationale: Естественная современная передача еврейской идиомы «доброе в твоих глазах», то есть то, что адресат считает хорошим или желательным.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: и всё, что ты пожелаешь возложить на меня
  rationale: Формулировка сохраняет эллиптичность оборота и значение предлога עַל, подразумевающего принятие царём обязательства.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: я сделаю для тебя
  rationale: Прямая и естественная передача повторного личного обещания царя.
