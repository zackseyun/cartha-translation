base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: ru
  text: 'любить ненавидящих тебя и ненавидеть любящих тебя. Ведь сегодня ты ясно показал, что военачальники и слуги для тебя ничего не значат[a]. Ибо сегодня я знаю: если бы Авессалом был жив, а все мы сегодня умерли[b], это было бы правильно в твоих глазах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «сегодня ты объявил, что у тебя нет военачальников и слуг». Смысл еврейского оборота в том, что в глазах Давида они словно ничего не значат.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «если бы только Авессалом был жив, а все мы сегодня были мертвы». Это резкое контрфактическое обвинение Иоава, а не буквальная передача слов Давида.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: любить ненавидящих тебя
  rationale: Инфинитив сохраняет синтаксическую связь с предшествующим обвинением и словесную силу причастия «ненавидящие», не подменяя его более широким понятием «враги».
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: и ненавидеть любящих тебя
  rationale: Параллельная инфинитивная конструкция передаёт резкий риторический контраст оригинала.
- source_word: הִגַּדְתָּ הַיּוֹם
  choice: сегодня ты ясно показал
  rationale: 'В данном контексте глагол обозначает не только словесное заявление: поведение Давида открыто обнаружило его отношение.'
- source_word: שָׂרִים וַעֲבָדִים
  choice: военачальники и слуги
  rationale: Военная обстановка поддерживает значение «военачальники» для שָׂרִים, тогда как עֲבָדִים охватывает людей, состоящих на царской службе.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: военачальники и слуги для тебя ничего не значат
  rationale: 'Так естественно передан смысл упрёка: речь не об их буквальном отсутствии, а о том, что Давид своим поведением показал полное пренебрежение к ним.'
- source_word: יָדַעְתִּי הַיּוֹם
  choice: теперь я знаю
  rationale: Перфект выражает сформировавшийся к этому дню вывод Иоава; «теперь» по-русски естественно связывает его с событиями дня.
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: если бы Авессалом остался жив, а все мы сегодня умерли
  rationale: Контекст требует резкого контрфактического обвинения; условная конструкция ясно передаёт его, не превращая слова Иоава в буквальную цитату Давида.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: это было бы правильно в твоих глазах
  rationale: Сохранён образный оборот оригинала и его оценочный, почти нравственный оттенок; более гладкое «это было бы тебе угодно» ослабило бы образ.
