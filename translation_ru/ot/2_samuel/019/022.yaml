base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: ru
  text: 'Но Авесса, сын Саруи, ответил: «Разве не следует предать Семея смерти за это — за то, что он проклял помазанника Яхве?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: возразил
  rationale: 'В данном диалоге сочетание двух формул речи естественно передаётся одним русским глаголом «возразил»: Авесса отвечает на предложение Давида о милости, выдвигая противоположное требование.'
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Авесса, сын Саруи
  rationale: Использованы традиционные русские библейские формы имён; родственная формула сохранена буквально.
- source_word: הֲתַחַת זֹאת
  choice: за это
  rationale: Оборот указывает на основание или воздаяние за поступок; краткое русское «за это» сохраняет как причинный, так и возмездный оттенок.
- source_word: לֹא יוּמַת
  choice: разве не следует предать ... смерти
  rationale: Хофаль глагола מות означает причинение смерти, здесь в контексте судебной казни. Формулировка передаёт риторический вопрос и юридическую направленность, не превращая его в простой вопрос о смерти.
- source_word: שִׁמְעִי
  choice: Семей
  rationale: Выбрана укоренившаяся в русской библейской традиции форма имени.
- source_word: כִּי קִלֵּל
  choice: за то, что он проклинал
  rationale: כִּי вводит основание предлагаемой казни; повтор «за это — за то, что» естественно раскрывает отсылочное «это», сохраняя причинную связь. Имперфективное русское «проклинал» соответствует описанию совершённого словесного поношения в повествовательном контексте.
- source_word: מְשִׁיחַ יְהוָה
  choice: помазанника Яхве
  rationale: «Помазанник» сохраняет значение царя, поставленного через помазание, а личное имя «Яхве» непосредственно передаёт тетраграмматон, не заменяя его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное заветное имя Бога. «Яхве» передаёт его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение מְשִׁיחַ в отношении Давида
  choice: помазанник
  alternative: помазанный царь
  rationale: Буквальное «помазанник» сохраняет богословскую насыщенность и возможную широту титула, тогда как добавление «царь» верно контекстуально, но отсутствует в данном стихе.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис упрощён без потери риторической силы вопроса; архаизмы вроде «да не будет ли умерщвлён» исключены. Традиционные русские формы личных имён сочетаются с прямой передачей имени Яхве.
