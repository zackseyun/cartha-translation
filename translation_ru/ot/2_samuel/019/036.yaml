base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: ru
  text: Мне сегодня восемьдесят лет. Могу ли я различать добро и зло?[a] Может ли твой слуга ощущать вкус того, что я ем и пью? Могу ли я ещё слышать голоса певцов и певиц? Зачем же твоему слуге и дальше быть обузой моему господину, царю?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Могу ли я понимать, что хорошо и что плохо?» Древнееврейское выражение может обозначать нравственную или практическую способность судить; здесь контекст старости и ослабевших чувств указывает на общее снижение способности различать и оценивать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Мне сегодня восемьдесят лет
  rationale: Естественная русская передача древнееврейского оборота для обозначения возраста; הַיּוֹם передано словом «сегодня».
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Могу ли я различать добро и зло?
  rationale: ידע בין обозначает способность распознавать и различать. Пара «добро и зло» сохраняет обычное значение слов טוֹב и רָע, а вопросительная форма соответствует ряду риторических вопросов в контексте.
- source_word: אִם יִטְעַם עַבְדְּךָ
  choice: Может ли твой слуга ощущать вкус
  rationale: טעם здесь относится к ослабевшему чувству вкуса; «ощущать вкус» по-русски точнее выражает сенсорную способность, чем буквальное «пробовать».
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: того, что я ем и пью
  rationale: Сохранено первое лицо древнееврейских глаголов, несмотря на предшествующее почтительное самообозначение «твой слуга».
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: Могу ли я ещё слышать голоса певцов и певиц?
  rationale: «Ещё» передаёт עוֹד, а отдельные формы мужского и женского рода сохранены как «певцов и певиц».
- source_word: לְמַשָּׂא
  choice: обузой
  rationale: 'Слово употреблено метафорически: речь не о буквальной ноше, а о человеке, который будет причинять царю затруднения.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: для господина моего, царя
  rationale: Сохранено почтительное придворное обращение к земному царю без придания слову «господин» божественного смысла.
theological_decisions:
- issue: Значение выражения «различать добро и зло»
  choice: В основном тексте сохранена традиционная и лексически прямая пара «добро и зло», а примечание указывает на более широкое практическое значение.
  alternative: «различать хорошее и плохое» или «понимать, что хорошо и что плохо»
  rationale: Выражение допускает нравственное и практическое понимание. Контекст старости и ослабления чувств склоняет к общей утрате рассудительности, но не позволяет полностью исключить нравственный оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Риторические вопросы переданы ясно и естественно; формы «твой слуга» и «господин мой, царь» сохраняют исторический этикет, не звуча чрезмерно архаично.
