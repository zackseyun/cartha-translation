  rationale: 'Внесена только стилистически и контекстуально безопасная замена «в сражении» на «в бою». Остальные решения сохраняются: русский текст не обязан воспроизводить начальный союз «и»; «помазали царём над собой» удерживает терминологическое значение מָשַׁח; сноска привязана к завершающему обороту, к которому относится вариант.'
