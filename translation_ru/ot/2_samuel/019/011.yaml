  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: ru
  text: Авессалом, которого мы помазали царём над собой, погиб в бою. Почему же вы теперь молчите о том, чтобы вернуть царя?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему же вы теперь молчите и не возвращаете царя?»'
    reason: Еврейская связь между «молчите» и инфинитивом «вернуть» допускает более прямую передачу, при которой молчание подразумевает отказ предпринять возвращение царя.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: Авессалом
  rationale: Начальное ו продолжает предшествующую речь; в русском связность контекста не требует обязательного союза «и».
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: мы помазали царём над собой
  rationale: «Помазали» сохраняет политико-религиозный смысл מָשַׁח, а добавление «царём» естественно передаёт подразумеваемое поставление правителем и делает сочетание с «над собой» понятным по-русски.
- source_word: מֵת בַּמִּלְחָמָה
  choice: погиб в сражении
  rationale: Передаёт завершившуюся смерть Авессалома в ходе вооружённого столкновения; «сражение» здесь естественнее общего «война».
- source_word: וְעַתָּה לָמָה
  choice: Почему же вы теперь
  rationale: «Теперь» передаёт עַתָּה, а частица «же» естественно выражает вывод и упрёк, заключённые в связке וְעַתָּה לָמָה.
- source_word: מַחֲרִשִׁים
  choice: молчите
  rationale: Сохраняет прямое значение корня חרשׁ — хранить молчание, не подменяя его более толковательным «бездействуете» или «медлите».
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: о том, чтобы вернуть царя
  rationale: Hiphil от שׁוּב означает побудить вернуться, вернуть. Оборот «молчать о том, чтобы» естественно связывает молчание с обсуждаемым возвращением царя.
theological_decisions:
- issue: Обозначение поставления Авессалома царём
  choice: помазали царём над собой
  alternative: поставили царём над собой
  rationale: Текст употребляет обычный глагол царского помазания даже по отношению к Авессалому. Сохранение «помазали» не сглаживает религиозно-политический вес действия и не вносит в перевод оценку законности его власти.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формулировка доступна широкому читателю; архаизмы и конфессионально окрашенные толкования исключены.
