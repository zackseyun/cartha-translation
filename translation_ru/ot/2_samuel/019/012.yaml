  verdict: revise
  source_fidelity: В целом переданы адресаты, титул, поручение и причинно-риторическая структура стиха. Однако «Почему вы хотите последними...» приписывает старейшинам намерение, которого имперфект תִהְיוּ не выражает; вопрос говорит о том, что они окажутся/будут последними. Формула о приходе «слова всего Израиля» остаётся семантически широкой и должна быть отмечена сноской.
  naturalness: Текст в основном звучит современно и литературно. Оборот «почему вы хотите последними возвратить» и стилистически тяжеловесен, и неточен. «Послал к ... с такими словами» естественно передаёт שָׁלַח אֶל ... לֵאמֹר, не подразумевая, что Давид непременно отправил именно устное сообщение.
  terminology: «Царь Давид», «священники», «старейшины Иуды» и имена Садок, Авиафар переданы удачно. Для דְּבַר כָּל־יִשְׂרָאֵל сохранено нейтральное «слово от всего Израиля»; сноска объясняет возможные контекстуальные оттенки, не закрепляя один из них как единственно верный.
