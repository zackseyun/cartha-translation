base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: ru
  text: 'И царь Давид послал к священникам Садоку и Авиафару с такими словами: «Обратитесь к старейшинам Иуды и скажите: „Почему вы будете последними, кто возвратит царя в его дом? Ведь слово от всего Израиля уже дошло до царя в его доме“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь предложение (или обращение) всего Израиля уже дошло до царя в его доме». Еврейское выражение «слово всего Израиля» имеет широкий смысл и может означать весть, предложение или призыв всего Израиля возвратить Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: послал сказать
  rationale: Сочетание глагола «послать» с адресатами и последующим לֵאמֹר указывает на передачу поручения; по-русски «послал сказать» естественно выражает эту конструкцию.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царь Давид
  rationale: Естественная русская форма титула с именем, сохраняющая царское обозначение.
- source_word: צָדוֹק וְאֶבְיָתָר הַכֹּהֲנִים
  choice: священникам Садоку и Авиафару
  rationale: Приложение «священники» естественно передано как обозначение должности перед именами; дательный падеж обусловлен оборотом «послал сказать».
- source_word: דַּבְּרוּ אֶל
  choice: обратитесь к
  rationale: Передаёт повеление говорить непосредственно старейшинам и звучит естественно в современном литературном русском.
- source_word: זִקְנֵי יְהוּדָה
  choice: старейшинам Иуды
  rationale: Стандартная передача названия руководителей племени или области Иуды.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: почему вы хотите последними
  rationale: Имперфект в риторическом вопросе имеет увещательный оттенок; «хотите» по-русски передаёт упрёк, не превращая фразу в простое предсказание.
- source_word: לְהָשִׁיב אֶת הַמֶּלֶךְ
  choice: возвратить царя
  rationale: Каузативная форма שוב означает сделать так, чтобы царь вернулся; «возвратить» сохраняет этот смысл.
- source_word: אֶל בֵּיתוֹ
  choice: в его дом
  rationale: Сохраняет буквальный и широкий смысл בַּיִת — дом или царская резиденция — без неоправданного уточнения «дворец».
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: ведь весть от всего Израиля
  rationale: דָּבָר здесь допускает значения «слово», «весть», «предложение» или «обращение»; «весть» естественна в русском тексте, а широта выражения отмечена в сноске.
- source_word: בָּא אֶל הַמֶּלֶךְ
  choice: уже дошла до царя
  rationale: Перфект обозначает состоявшееся достижение адресата; «уже дошла» ясно выражает его актуальный результат.
- source_word: אֶל בֵּיתוֹ
  choice: в его доме
  rationale: В повторной фразе предлог может описывать местонахождение царя; русский местный оборот устраняет неестественное впечатление, будто весть направлена к дому как объекту.
