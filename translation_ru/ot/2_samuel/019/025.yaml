base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: ru
  text: И Мемфивосфей, сын Саула, спустился навстречу царю. Он не ухаживал за своими ногами[a], не подстригал усов[b] и не стирал одежды с того дня, как царь ушёл, до того дня, когда он вернулся благополучно[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не делал своих ног»; вероятно, имеется в виду обычный уход за ногами, но конкретная процедура не названа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не ухаживал за усами». Еврейское слово обозначает область волос над верхней губой, а не обязательно всю бороду.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пришёл с миром»; возможно также: «вернулся благополучно». В еврейском тексте подлежащее прямо не названо, но по контексту, вероятнее всего, имеется в виду царь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: спустился
  rationale: Передаёт обычное пространственное значение глагола «спускаться» без добавления направления, которого нет в тексте.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: навстречу царю
  rationale: Естественно передаёт идиому движения с целью встретить человека.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: не ухаживал за своими ногами
  rationale: Буквально сказано «не делал своих ног»; широкая формулировка сохраняет неопределённость конкретной процедуры ухода.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: не подстригал усов
  rationale: שָׂפָם обозначает волосы в области верхней губы; «усы» точнее, чем более широкое «борода».
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: не стирал одежды
  rationale: כִבֵּס здесь прямо означает стирку одежды; единственное собирательное «одежды» звучит естественно и достойно.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: с того дня, как царь ушёл
  rationale: Передаёт временную конструкцию и нейтральное значение הלך без необоснованно возвышенного регистра.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: до того дня, когда тот возвратился невредимым
  rationale: По контексту בְשָׁלוֹם указывает на благополучное возвращение; местоимение «тот» помогает отнести действие к царю, не устраняя примечанием формальную неоднозначность.
