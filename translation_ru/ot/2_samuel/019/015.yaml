  text: וַ/יַּ֛ט אֶת לְבַ֥ב כָּל אִישׁ יְהוּדָ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וַֽ/יִּשְׁלְחוּ֙ אֶל הַ/מֶּ֔לֶךְ שׁ֥וּב אַתָּ֖ה וְ/כָל עֲבָדֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/015.yaml
  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: ru
  text: 'И он склонил сердца всех жителей Иудеи, так что они стали как один человек. Тогда они послали сказать царю: «Возвращайся со всеми своими слугами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט
  choice: склонил
  rationale: 'Глагол נטה здесь передаёт воздействие на расположение сердец: «склонил, расположил». Такой перевод естественен по-русски и не уточняет сверх текста способ воздействия.'
- source_word: לְבַב כָּל אִישׁ יְהוּדָה
  choice: сердца всех жителей Иудеи
  rationale: 'Буквально: «сердце каждого мужа Иудеи». Собирательное русское выражение сохраняет всеохватность и избегает ошибочного ограничения только мужчинами.'
- source_word: כְּאִישׁ אֶחָד
  choice: так что они стали как один человек
  rationale: Сохраняется образ единодушия и тесная связь с воздействием на сердца; конструкция передана ясным современным русским синтаксисом.
- source_word: שׁוּב אַתָּה וְכָל עֲבָדֶיךָ
  choice: Возвращайся со всеми своими слугами
  rationale: Идиоматически передаёт «возвращайся ты и все твои слуги», сохраняя обращение к царю и совместность возвращения.
theological_decisions:
- issue: К кому относится подлежащее «он» в начале стиха
  choice: Сохранено местоимение «он» без добавления имени
  alternative: «Давид склонил…»
  rationale: Еврейский текст использует местоименное подлежащее, определяемое контекстом; перевод не должен устранять эту референциальную зависимость добавлением имени.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; образ «как один человек» сохранён.
