  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: ru
  text: Ведь раб твой лишь немного пройдёт с царём через Иордан; почему же царю вознаграждать меня такой наградой?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздать мне таким воздаянием». В еврейском тексте употреблены глагол и существительное одного корня (גמל), что подчёркивает мысль о вознаграждении или воздаянии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: Ведь ... лишь немного
  rationale: כִּי вводит основание отказа, а מְעַט указывает на краткость сопровождения; по-русски это естественно передаётся как «ведь ... лишь немного».
- source_word: יַעֲבֹר
  choice: пройдёт
  rationale: 'Имперфект обозначает предполагаемое действие: Верзеллий намерен лишь недолго сопровождать царя. «Пройдёт» сохраняет образ движения и не придаёт высказыванию излишне жёсткой условности.'
- source_word: עַבְדְּךָ
  choice: раб твой
  rationale: В обращении к царю это традиционная формула самоуничижения, а не акцент на юридическом рабстве. Порядок слов сохраняет достоинство библейской речи.
- source_word: אֶת הַיַּרְדֵּן
  choice: за Иордан
  rationale: При עבר выражение обозначает переправу через реку. В данном контексте «за Иордан» естественно передаёт движение на другой берег, после которого спутник ещё может пройти с царём некоторое расстояние.
- source_word: אֶת הַמֶּלֶךְ
  choice: с царём
  rationale: 'Здесь אֶת — предлог совместности: Верзеллий сопровождает царя.'
- source_word: וְ/לָמָּה
  choice: за что же
  rationale: Риторический вопрос выражает вежливый отказ от царского вознаграждения; русское «за что же» естественно связывает вопрос с отсутствием достаточной заслуги.
- source_word: יִגְמְלֵנִי ... הַגְּמוּלָה הַזֹּאת
  choice: воздавать мне таким воздаянием
  rationale: Глагол и существительное происходят от одного корня גמל. Намеренный русский повтор сохраняет исходное усиление и допускает значение как награды, так и ответного воздаяния.
