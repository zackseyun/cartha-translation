  text: וַ/יִּרְגַּ֣ז הַ/מֶּ֗לֶךְ וַ/יַּ֛עַל עַל עֲלִיַּ֥ת הַ/שַּׁ֖עַר וַ/יֵּ֑בְךְּ וְ/כֹ֣ה אָמַ֣ר בְּ/לֶכְתּ֗/וֹ בְּנִ֤/י אַבְשָׁלוֹם֙ בְּנִ֣/י בְנִ֣/י אַבְשָׁל֔וֹם מִֽי יִתֵּ֤ן מוּתִ/י֙ אֲנִ֣י תַחְתֶּ֔י/ךָ אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: ru
  text: 'Царь был глубоко потрясён. Он поднялся в комнату над воротами[a] и заплакал. По дороге он говорил: «Сын мой Авессалом! Сын мой, сын мой Авессалом! О, если бы[b] я умер вместо тебя, Авессалом, сын мой, сын мой!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в верхнюю комнату ворот».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кто даст, чтобы я умер вместо тебя?» Это древнееврейский оборот, выражающий сильное желание: «если бы» или «о, если бы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: был глубоко потрясён
  rationale: Глагол רגז может обозначать дрожь, волнение или сильное душевное потрясение. В контексте скорби естественное русское выражение передаёт прежде всего внутреннее потрясение царя, не сводя его к физической дрожи.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: комнату над воротами
  rationale: עֲלִיָּה — верхняя комната; сочетание указывает на помещение над сооружением ворот. Перевод сохраняет архитектурный образ и звучит естественно по-русски.
- source_word: וַיֵּבְךְּ
  choice: заплакал
  rationale: Глагол בכה означает плакать. Совершенный вид естественно передаёт последовательность повествовательных действий.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: По дороге он говорил
  rationale: Оборот буквально описывает то, что царь говорил во время своего движения. «Говорил» позволяет услышать последующее как повторявшийся плач, а не как одно краткое высказывание.
- source_word: בְּנִי
  choice: сын мой
  rationale: 'Все повторы обращения сохранены: именно они создают ритм и эмоциональную силу отцовского плача.'
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Буквально «кто даст?» — древнееврейский идиоматический оборот, выражающий сильное, неисполнимое желание. «О, если бы» ясно и торжественно передаёт его силу в современном русском языке.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: я умер вместо тебя
  rationale: Конструкция выражает контрфактическое желание Давида самому умереть на месте сына. Русская форма естественно передаёт замещение и безвозвратность случившегося.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, хорошо узнаваемая современным читателем.
