base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: ru
  text: 'И сказал Давид: «Что мне до вас, сыновья Церуи, что вы сегодня выступаете против меня[a]? Разве сегодня в Израиле следует предавать кого-нибудь смерти? Разве я не знаю, что сегодня я — царь над Израилем?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «сатан» — «противник, оппонент»; здесь это нарицательное слово, а не собственное имя.
    reason: Разъясняет значение שָׂטָן в данном контексте и предотвращает ошибочное понимание как имени Сатана.
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Что мне до вас
  rationale: Естественная русская передача еврейского оборота, выражающего резкое отмежевание и упрёк.
- source_word: בְּנֵי צְרוּיָה
  choice: сыновья Церуи
  rationale: Сохранено конкретное родственное наименование Иоава и Авессы, выступающее здесь как обращение.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: что вы сегодня становитесь моими противниками
  rationale: שָׂטָן употреблено как нарицательное существительное со значением «противник»; форма множественного числа согласована с обращением к сыновьям Церуи. Глагольная форма допускает оттенок становления, который сохранён.
- source_word: יוּמַת אִישׁ
  choice: следует предавать кого-нибудь смерти
  rationale: Передаёт судебно-каузативный смысл пассивной формы, а «кого-нибудь» естественно выражает обобщённое значение אִישׁ в данном вопросе.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Разве я не знаю
  rationale: Сохраняет форму риторического вопроса, ожидающего утвердительного ответа.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: царь над Израилем
  rationale: Предлог עַל непосредственно передан словом «над», подчёркивающим царскую власть Давида.
theological_decisions:
- issue: Значение שָׂטָן
  choice: нарицательное «противник»
  alternative: собственное имя «Сатана»
  rationale: В данном историко-повествовательном контексте слово обозначает людей, противящихся решению Давида; понимание его как собственного имени привнесло бы не выраженное здесь демонологическое значение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Риторические вопросы и повтор слова «сегодня» сохранены; синтаксис сделан понятным без устранения напряжения между царской властью Давида и предложением казнить виновного.
