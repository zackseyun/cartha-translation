  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: ru
  text: И в тот день люди крадучись вошли в город, как крадучись уходят покрытые стыдом люди, когда бегут в бою.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: крадучись вошли / крадучись уходят
  rationale: Возвратная форма глагола גנב передаёт скрытное, незаметное движение. Повтор «крадучись» сохраняет лексический повтор еврейского текста, а разные глаголы движения естественно передают контекст входа в город и ухода после поражения.
- source_word: הַנִּכְלָמִים
  choice: пристыженные
  rationale: Причастие обозначает людей, испытывающих стыд и унижение; «пристыженные» сохраняет оттенок позора поражения.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: беглецы с поля боя
  rationale: 'Буквально: «при их бегстве в битве/сражении». Сжатая русская формулировка ясно выражает бегство из боя, не превращая его просто в нейтральное отступление.'
