  text: וַ/יְרַגֵּ֣ל בְּ/עַבְדְּ/ךָ֔ אֶל אֲדֹנִ֖/י הַ/מֶּ֑לֶךְ וַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים וַ/עֲשֵׂ֥ה הַ/טּ֖וֹב בְּ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: ru
  text: Он оклеветал твоего слугу перед моим господином царём, но мой господин царь — как ангел Божий; поэтому поступи, как тебе угодно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: оклеветал
  rationale: В данном контексте глагол означает злонамеренно оговорить или представить кого-либо в ложном свете; «оклеветал» естественно и точно передаёт обвинение Мемфивосфея.
- source_word: בְּעַבְדְּךָ
  choice: твоего слугу
  rationale: Сохраняет форму почтительного самообозначения говорящего и принадлежность, выраженную суффиксом второго лица.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: как ангел Божий
  rationale: Буквально сохраняет сравнение и не уточняет подразумеваемое качество царя сверх сказанного в тексте.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: поэтому поступи, как тебе угодно
  rationale: Передаёт идиому «сделай доброе в твоих глазах» естественным современным русским оборотом, обозначающим решение по собственному усмотрению; союз связывает вывод с предшествующей оценкой царя.
theological_decisions:
- issue: Значение выражения «ангел Божий»
  choice: 'Сохранено буквально: «как ангел Божий»'
  alternative: «словно Божий ангел, способный различить истину»
  rationale: Источник не называет конкретное качество ангела; буквальная передача сохраняет образ и его смысловую открытость.
- issue: Нормативный или субъективный смысл הַטּוֹב בְּעֵינֶיךָ
  choice: «как тебе угодно»
  alternative: «что считаешь правильным»
  rationale: Идиома подчёркивает свободу царского усмотрения. Вариант не утверждает, что любое решение объективно добро, и сохраняет напряжение между почтением и зависимостью просителя.
translation_notes:
  register: Современный литературный русский язык с сохранением придворно-почтительного обращения. «Слуга» выбрано вместо более архаичного «раб» как естественное самообозначение подданного перед царём; фраза остаётся ясной и достоинственной.
