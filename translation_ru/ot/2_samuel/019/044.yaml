base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: ru
  text: 'Израильтянин ответил иудею: «У меня десять долей в праве на царя[a], и на Давида у меня прав больше, чем у тебя[b]. Почему же ты пренебрёг мной? Разве не я первым заговорил о возвращении моего царя?[c]» Но слова иудеев оказались резче слов израильтян.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у меня десять рук в царе». Здесь «руки» — идиома со значением долей или частей; вероятно, имеются в виду притязания десяти северных колен в сравнении с Иудой.'
    reason: cultural_note
  - marker: b
    text: 'Или: «и на Давида у меня больше притязаний, чем у тебя». Еврейская фраза эллиптична и допускает передачу через долю, право или притязание.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Разве не моё предложение вернуть моего царя было первым?» Слово דָּבָר может означать слово, дело или предложение.'
    reason: alternative_reading
  - marker: d
    text: 'Или: «Но речи иудеев были суровее речей израильтян»; также возможно: «были сильнее» или «яростнее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: 'израильтянин / иудей; далее: израильтяне / иудеи'
  rationale: В диалоге единственное число, вероятно, представляет говорящего от каждой стороны; в заключительном обобщении существительные естественно переданы во множественном числе, сохраняя коллективный смысл.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: у меня десять долей в царе
  rationale: יָדוֹת буквально означает «руки», но здесь это идиома со значением долей или частей; «десять долей» ясно передаёт притязание десяти северных колен.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: и на Давида у меня больше прав, чем у тебя
  rationale: Еврейская конструкция эллиптична. Сравнение относится к доле, притязанию или праву на Давида, а не к общему превосходству говорящего.
- source_word: הֱקִלֹּתַנִי
  choice: ты пренебрёг мной
  rationale: Порода hифиль от קלל выражает отношение к кому-либо как к малозначимому. «Пренебрёг» естественно передаёт нанесённую обиду, не усиливая её до ненависти.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: Разве не я первым заговорил о возвращении моего царя?
  rationale: Трудная, эллиптическая фраза утверждает первенство Израиля в поднятии вопроса о возвращении царя. «Заговорил» естественно передаёт דְבָרִי, сохраняя связь с речью, а «моего царя» сохраняет явный суффикс первого лица.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: слова иудеев оказались резче слов израильтян
  rationale: קשׁה обозначает суровость или резкость речи. Русское множественное «слова» естественно выражает коллективное значение еврейского единственного דְּבַר.
