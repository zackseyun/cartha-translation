  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: ru
  text: 'Мемфивосфей сказал царю: «Пусть он заберёт хоть всё, раз мой господин, царь, благополучно пришёл в свой дом[a]».'
  philosophy: optimal-equivalence
  footnotes:
