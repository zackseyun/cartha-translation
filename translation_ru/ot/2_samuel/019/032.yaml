base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: ru
  text: А галаадитянин Верзеллий спустился из Рогелима и вместе с царём переправился через Иордан, чтобы проводить его через Иордан.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…чтобы проводить его у Иордана». Заключительное сочетание в еврейском тексте синтаксически трудно: его понимают либо как «через Иордан», либо как указание на место у Иордана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Верзеллий
  rationale: Традиционная русская библейская форма личного имени, узнаваемая для читателя и соответствующая принятой передаче этого персонажа.
- source_word: הַגִּלְעָדִי
  choice: галаадитянин
  rationale: Краткое и естественное обозначение происхождения из Галаада.
- source_word: יָרַד מֵרֹגְלִים
  choice: пришёл из Рогелима
  rationale: Глагол буквально обозначает движение вниз, однако по-русски в данном повествовательном контексте естественнее передать сам факт прибытия; направление несущественно и без географического пояснения звучало бы тяжеловесно.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: вместе с царём переправился через Иордан
  rationale: Сочетание глагола עבר, царя как сопровождаемого лица и названия реки описывает переправу Верзеллия вместе с царём; перевод сохраняет и совместность движения, и переход через реку.
- source_word: לְשַׁלְּחוֹ
  choice: чтобы проводить его
  rationale: Инфинитив выражает цель сопровождения и прощального провожания; «проводить» естественно передаёт смысл в современном русском языке.
- source_word: אֶת בַּיַּרְדֵּן
  choice: у Иордана
  rationale: Текст WLC в данном месте формально труден и допускает разные синтаксические членения; «у Иордана» передаёт место проводов с минимальной дополнительной интерпретацией.
