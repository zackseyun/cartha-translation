base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: ru
  text: Верзеллий был очень стар — ему было восемьдесят лет. Он обеспечивал царя всем необходимым, пока царь находился в Маханаиме, ведь Верзеллий был весьма состоятельным человеком.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был человеком очень влиятельным»; буквально: «был человеком весьма великим». Еврейское выражение может указывать на богатство, высокое положение или влияние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: был очень стар
  rationale: Предикативное זָקֵן усилено מְאֹד; естественное современное русское соответствие — «был очень стар».
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: ему было восемьдесят лет
  rationale: Еврейская возрастная формула буквально означает «сын восьмидесяти лет», но по-русски естественно передаётся личной конструкцией.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: обеспечивал царя всем необходимым
  rationale: כלכל обозначает материальное содержание и снабжение; добавление «всем необходимым» ясно передаёт смысл, не ограничивая помощь одним видом припасов.
- source_word: בְּשִׁיבָתוֹ
  choice: пока тот жил
  rationale: Форма от ישב здесь указывает на пребывание; местоимение относится к царю. «Тот» устраняет возможную русскую двусмысленность.
- source_word: בְמַחֲנַיִם
  choice: в Маханаиме
  rationale: Название места передано традиционной русской библейской формой.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, как Верзеллий мог содержать царя.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: был человеком весьма состоятельным
  rationale: В данном контексте «великий/значительный человек» вероятнее всего подразумевает большие средства, позволявшие снабжать царя; «состоятельный» естественно выражает контекстуальный смысл, а более широкая семантика сохранена в примечании.
