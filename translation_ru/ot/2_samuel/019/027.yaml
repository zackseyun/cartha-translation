  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: ru
  text: 'И он сказал: «Слуга мой оклеветал меня перед моим господином, царём[a], потому что твой слуга сказал: „Я оседлаю для себя осла, сяду на него и пойду с царём“, ибо твой слуга хром».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманул меня»; возможно также: «предал меня». Еврейский глагол может обозначать обман или вероломный поступок; перевод «оклеветал меня» выбран потому, что в данном контексте речь идёт о ложном донесении царю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: оклеветал меня
  rationale: В контексте Мемфивосфей обвиняет слугу в ложном донесении царю. Глагол допускает более широкое значение обмана или вероломства, но здесь «оклеветал» точнее передаёт характер поступка.
- source_word: עַבְדִּי
  choice: слуга мой
  rationale: Речь о личном слуге в царском повествовании; «слуга» естественно передаёт социальную роль без неоправданного усиления оттенка несвободы.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господином моим, царём
  rationale: Сохранена почтительная придворная формула и приложение «царём».
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Я оседлаю себе осла
  rationale: Форма выражает намерение или решимость говорящего; «оседлаю» является контекстуальным значением חבש при упоминании осла.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: сяду на него
  rationale: Естественное русское выражение для намерения ехать верхом; местоимение согласовано с русским словом «осёл».
- source_word: וְאֵלֵךְ אֶת הַמֶּלֶךְ
  choice: отправлюсь с царём
  rationale: הלך с אֶת здесь обозначает сопровождение, а не движение к царю.
- source_word: פִסֵּחַ
  choice: хром
  rationale: Прямое и нейтральное в современном русском обозначение физической хромоты.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Сохранена обычная почтительная форма самоименования при обращении к царю.
