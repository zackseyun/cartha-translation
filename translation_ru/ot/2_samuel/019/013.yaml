base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: ru
  text: Вы — братья мои[a], вы — кость моя и плоть моя[b]. Почему же вы должны быть последними, кто вернёт царя[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родичи мои»; буквально: «братья мои».'
    reason: lexical_alternative
  - marker: b
    text: «Кость моя и плоть моя» — еврейское выражение, обозначающее близкое кровное родство.
    reason: cultural_note
  - marker: c
    text: Давид говорит здесь о себе в третьем лице — «царь».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: братья мои
  rationale: Сохраняет прямое значение еврейского слова и обращение Давида к соплеменникам; более общее «родичи» вынесено в примечание.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: кость моя и плоть моя
  rationale: Сохраняет конкретный образ и параллелизм еврейской идиомы, обозначающей близкое кровное родство.
- source_word: וְלָמָה
  choice: Почему же
  rationale: Частица «же» естественно передаёт связь риторического вопроса с предшествующим доводом о родстве.
- source_word: תִהְיוּ אַחֲרֹנִים
  choice: вы последними
  rationale: Передаёт сравнительный смысл — оказаться позади других — и сохраняет побудительную силу риторического вопроса.
- source_word: לְהָשִׁיב
  choice: вернёте
  rationale: Каузативная форма означает «привести/вернуть»; с прямым дополнением «царя» русский переходный глагол «вернуть» передаёт этот смысл естественно.
- source_word: אֶת־הַמֶּלֶךְ
  choice: царя
  rationale: Сохраняет третье лицо оригинала, где Давид говорит о себе как о царе, не заменяя его на «меня».
