base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: ru
  text: 'И победа в тот день обернулась для всего народа трауром[a], потому что в тот день народ услышал[b]: «Царь скорбит о своём сыне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление в тот день стало для всего народа трауром».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народ услышал, говоря»; это еврейский оборот, означающий, что народ услышал сообщение или услышал, что говорят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: победа
  rationale: В военном контексте слово обозначает успешный исход сражения, избавление от врага; «победа» здесь естественнее русского «спасение» и точнее передаёт непосредственную ситуацию.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: обернулась ... плачем
  rationale: 'Результативная конструкция передаёт резкую перемену: победа стала поводом не для радости, а для траура. «Обернулась» естественно выражает этот контраст.'
- source_word: אֵבֶל
  choice: плач
  rationale: Слово обозначает траур, скорбь и её общественное выражение. В данном повествовательном контексте «плач» ясно передаёт всеобщую скорбь, не сводя её только к внутреннему переживанию.
- source_word: הָעָם
  choice: народ / люди
  rationale: Сохранено общее значение еврейского слова, хотя в контексте речь прежде всего о воинах и сторонниках Давида. Повтор варьирован ради естественного русского изложения без изменения референта.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: потому что ... люди услышали весть
  rationale: Еврейское «услышал, говоря» — формула получения сообщения. «Услышали весть» естественно передаёт её репортивный смысл.
- source_word: נֶעֱצַב
  choice: скорбит
  rationale: Форма выражает состояние боли и печали; «скорбит» соответствует серьёзности царского горя по сыну.
- source_word: עַל בְּנוֹ
  choice: о своём сыне
  rationale: Предлог обозначает предмет или причину скорби. Русское «скорбит о сыне» — наиболее естественное сочетание.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Плач» сохраняет общественный и выраженный характер אֵבֶל; сноска отмечает более формальный вариант «траур». Формула сообщения передана естественным русским оборотом.
