base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: ru
  text: 'Барзиллай сказал царю: «Сколько мне ещё жить[a], чтобы мне подниматься с царём в Иерусалим?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сколько дней лет моей жизни…?»'
    reason: Сноска сохраняет многослойную и подчёркнутую древнееврейскую формулировку יְמֵי שְׁנֵי חַיַּי, которая при дословной передаче звучит по-русски неестественно.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר естественно передаётся русским «сказал».
- source_word: בַּרְזִלַּי
  choice: Барзиллай
  rationale: Имя передано современной транслитерацией с древнееврейского, без опоры на традиционную форму из более ранних русских переводов.
- source_word: אֶל הַמֶּלֶךְ
  choice: царю
  rationale: Еврейский текст употребляет нарицательное существительное с артиклем; имя Давида здесь не добавляется.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  choice: Сколько мне ещё жить
  rationale: Идиоматическая русская передача риторического вопроса о малом остатке жизни. Слово «ещё» выражает ясный контекстуальный смысл, а необычная буквальная структура сохранена в сноске.
- source_word: כִּי אֶעֱלֶה
  choice: чтобы идти
  rationale: כִּי при вопросе вводит следствие, а форма אֶעֱלֶה имеет модальный оттенок. Русская конструкция с «чтобы» естественно передаёт этот риторический смысл.
- source_word: אֶת הַמֶּלֶךְ
  choice: с царём
  rationale: 'Хотя אֶת часто служит показателем прямого дополнения, здесь по контексту оно выражает сопровождение: Барзиллай говорит о совместном пути с царём.'
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Употреблена общепринятая русская форма названия города.
