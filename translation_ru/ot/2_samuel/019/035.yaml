  register: Современный литературный русский язык; реплика звучит естественно и сдержанно, сохраняя риторический характер вопроса. Выбрано «идти», а не буквальное «подниматься», поскольку по-русски путь в Иерусалим обычно так не обозначается; пространственный оттенок глагола не является центральным для реплики.
