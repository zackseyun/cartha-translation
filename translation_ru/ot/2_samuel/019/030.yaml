  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: ru
  text: 'Тогда царь сказал ему: «Зачем тебе ещё говорить о своём деле? Я решил[a]: ты и Сива разделите землю[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я сказал».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: Тогда царь сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: לָמָּה תְּדַבֵּר עוֹד דְּבָרֶיךָ
  choice: Зачем тебе ещё говорить о своём деле?
  rationale: עוֹד указывает на дальнейшую речь, а דְּבָרֶיךָ в контексте спора означает дело или предмет ходатайства. Конструкция сохраняет оттенок нетерпения царя, не превращая реплику в строго юридическую формулу.
- source_word: אָמַרְתִּי
  choice: Я решил
  rationale: Буквально «я сказал», но здесь высказывание царя имеет силу вынесенного решения. Более буквальный вариант сохранён в сноске.
- source_word: אַתָּה וְצִיבָא
  choice: ты и Сива
  rationale: Местоимение передано явно; «Сива» — традиционная и узнаваемая русская форма имени צִיבָא.
- source_word: תַּחְלְקוּ
  choice: разделите
  rationale: Имперфект в царском постановлении выражает властное распоряжение; русское будущее совершенного вида естественно передаёт эту силу.
- source_word: הַשָּׂדֶה
  choice: землю
  rationale: Буквально «поле», однако в споре о владении слово обозначает земельное имущество в целом. Буквальный вариант отмечен в сноске.
