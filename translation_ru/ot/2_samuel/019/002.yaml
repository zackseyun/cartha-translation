  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: ru
  text: 'Иоаву сообщили: «Вот, царь плачет и скорбит об Авессаломе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: сообщили
  rationale: Хофал от נגד передаёт безлично-пассивное сообщение информации. Русская неопределённо-личная конструкция естественно звучит и, как еврейская форма, не называет сообщившего.
- source_word: לְיוֹאָב
  choice: Иоаву
  rationale: Предлог לְ обозначает адресата сообщения; имя передано в принятой русской библейской форме.
- source_word: הִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к содержанию сообщения и сохраняет его непосредственность без архаизации.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён титул с определённым значением, относящийся в контексте к Давиду; он не заменён личным именем.
- source_word: בֹּכֶה
  choice: плачет
  rationale: Причастие описывает продолжающееся действие; русский глагол настоящего времени естественно передаёт это состояние.
- source_word: וַיִּתְאַבֵּל
  choice: скорбит
  rationale: Форма хитпаэль от אבל обозначает пребывание в трауре, скорбь по умершему. Настоящее время согласует описание с продолжающимся плачем, хотя в еврейском употреблена повествовательная глагольная форма.
- source_word: עַל אַבְשָׁלֹם
  choice: об Авессаломе
  rationale: עַל при глаголе скорби указывает на того, о ком скорбят; сочетание «скорбеть об» естественно для современного литературного русского языка.
