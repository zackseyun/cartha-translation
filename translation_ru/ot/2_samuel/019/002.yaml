translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского: адресат вынесен в начало, а безлично-пассивная еврейская форма передана неопределённо-личным «сообщили». Имя «Авессалом» дано в устойчивой русской библейской форме.'
