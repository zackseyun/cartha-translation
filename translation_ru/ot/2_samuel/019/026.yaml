  text: וַ/יְהִ֛י כִּי בָ֥א יְרוּשָׁלִַ֖ם לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה לֹא הָלַ֥כְתָּ עִמִּ֖/י מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: ru
  text: 'И когда он пришёл в Иерусалим, чтобы встретить царя, царь сказал ему: «Почему ты не пошёл со мной, Мемфивосфей?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: И когда
  rationale: Повествовательная формула вводит новую сцену; этот вариант естественно передаёт и связь с предыдущим рассказом, и временное значение.
- source_word: בָא יְרוּשָׁלַם
  choice: он пришёл в Иерусалим
  rationale: בוא обычно означает «приходить, входить»; место назначения естественно выражено сочетанием «в Иерусалим».
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: чтобы встретить царя
  rationale: לִקְרַאת указывает на движение навстречу или с целью встречи; целевая конструкция ясна и естественна по-русски.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: царь сказал ему
  rationale: Сохранено повторное обозначение царя, обеспечивающее ясность субъекта речи; אמר передано обычным «сказал».
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: ты не пошёл со мной
  rationale: הלך буквально обозначает движение «идти»; «пошёл со мной» сохраняет исходную перспективу Давида и не заменяет её более разговорным «поехал» или «не пришёл».
- source_word: מְפִיבֹשֶׁת
  choice: Мемфивосфей
  rationale: Использована устоявшаяся русская библейская форма имени.
