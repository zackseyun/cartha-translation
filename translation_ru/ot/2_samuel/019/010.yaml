base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: ru
  text: 'И весь народ во всех коленах Израиля спорил[a]: «Царь избавил нас от власти наших врагов и спас нас от власти филистимлян[b], а теперь он бежал из страны из-за Авессалома[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обсуждал это», «вёл спор». Еврейское слово указывает на распространённые среди колен разногласия, а не просто на обычный разговор.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из руки наших врагов» и «из руки филистимлян». В еврейском языке «рука» здесь означает власть или господство.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «спасаясь от Авессалома», «по причине Авессалома». Еврейский оборот может подчёркивать как удаление от него, так и вызванную им причину бегства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: спорил
  rationale: Нифальское причастие здесь передаёт продолжающийся общенародный спор или обсуждение с разногласиями; «спорил» сохраняет напряжённость выражения и естественно звучит по-русски.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: во всех коленах Израиля
  rationale: Оборот обозначает распространение спора по всем племенам народа; традиционное библейское «колена Израиля» понятно современному русскому читателю.
- source_word: הִצִּילָנוּ
  choice: избавил нас
  rationale: Глагол означает избавление от опасности или чужой власти; выбор отличает его от следующего близкого по смыслу глагола.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: от власти наших врагов
  rationale: Буквально «из руки наших врагов»; в данном военно-политическом контексте «рука» идиоматически означает власть или контроль.
- source_word: מִלְּטָנוּ
  choice: спас нас
  rationale: Передаёт избавление и благополучный выход из опасности, сохраняя смысловое различие с הִצִּילָנוּ без искусственной тяжеловесности.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: от власти филистимлян
  rationale: Тот же еврейский образ «руки» передан его ясным русским значением — «власть».
- source_word: וְעַתָּה
  choice: а теперь
  rationale: Союз вводит контраст между прежними победами царя и его нынешним бегством.
- source_word: בָּרַח
  choice: бежал
  rationale: Совершенный вид естественно передаёт завершившееся бегство, результат которого сохраняется в описываемый момент.
- source_word: מִן הָאָרֶץ
  choice: из страны
  rationale: Здесь אֶרֶץ обозначает территорию страны, а не землю как почву или весь мир.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: из-за Авессалома
  rationale: После глагола бегства выражение указывает на удаление от Авессалома под его давлением или по причине вызванной им угрозы; русский вариант сохраняет эту причинную широту.
