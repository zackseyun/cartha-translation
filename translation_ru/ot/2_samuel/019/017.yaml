base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: ru
  text: Шимей, сын Геры, вениамитянин из Бахурима, поспешил и спустился вместе с людьми Иуды[a] навстречу царю Давиду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с человеком Иуды»; здесь это выражение, по-видимому, употреблено собирательно — «с людьми Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: поспешил
  rationale: Глагол передаёт поспешность и срочность действия; «поспешил» естественно звучит в современном русском повествовании.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: Шимей, сын Геры
  rationale: Сохранена еврейская патронимическая конструкция, естественно оформленная по-русски.
- source_word: בֶּן הַיְמִינִי
  choice: вениамитянин
  rationale: В данном контексте выражение обозначает принадлежность к колену Вениамина, а не второе указание на отца.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: из Бахурима
  rationale: Кратко и естественно передано указание на место происхождения Шимея.
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохранено конкретное топографическое значение еврейского глагола движения.
- source_word: עִם אִישׁ יְהוּדָה
  choice: вместе с иудеями
  rationale: Формально единственное число אִישׁ здесь естественно понимать собирательно; контекст описывает группу людей из Иуды.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Передаёт направленное движение с целью встретить прибывающего царя.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: царю Давиду
  rationale: Титул и имя переданы в естественном русском порядке с падежом, требуемым оборотом «навстречу».
