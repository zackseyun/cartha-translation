revisions:
- from: 'И вот все израильтяне[a] пришли к царю и сказали ему: «Почему наши братья, люди Иуды, похитили тебя у нас[b] и переправили через Иордан царя и его дом, а с ним и всех людей Давида?»'
  to: 'И вот все израильтяне[a] пришли к царю и сказали ему: «Почему наши братья, люди Иуды, увели тебя[b] и переправили через Иордан царя, его домочадцев и всех людей Давида, которые были с ним?»'
  rationale: «Увели тебя» — естественная русская передача в основном тексте; буквальная метафора «украли тебя» сохранена и пояснена в сноске. Убрано невыраженное в оригинале «у нас». «Домочадцев» передаёт значение «его дома» как царского домашнего окружения, а заключительная группа людей Давида включена в состав переправленных и ясно соотнесена с царём.
