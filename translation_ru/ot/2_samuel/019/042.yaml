base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: ru
  text: 'И вот все израильтяне[a] пришли к царю и сказали ему: «Почему наши братья, люди Иуды, увели тебя[b] и переправили через Иордан царя, его домочадцев и всех людей Давида, которые были с ним?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь муж Израиля». Здесь употреблено собирательное обозначение мужчин, представлявших Израиль.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «украли тебя». Еврейский глагол «красть» употреблён метафорически: люди Иуды вернули царя без участия остальных израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт повествовательный указатель и привлекает внимание к внезапному появлению представителей Израиля, не прибегая к архаичному «се».
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Сочетание с формально единственным אִישׁ имеет собирательное значение. Естественная русская форма обозначает представленных здесь мужчин Израиля; это уточнено в сноске.
- source_word: בָּאִים
  choice: пришли
  rationale: Причастие в данном повествовательном контексте естественно передаётся русским прошедшим временем.
- source_word: גְּנָבוּךָ
  choice: похитили тебя у нас
  rationale: 'Сохраняет резкую метафору глагола «красть, похищать» и политический упрёк: люди Иуды распорядились возвращением царя без участия остальных израильтян. «У нас» раскрывает подразумеваемую направленность обвинения.'
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: наши братья, люди Иуды
  rationale: Сохраняет родственную риторику внутринародного спора; «люди Иуды» естественно передаёт собирательное אִישׁ יְהוּדָה.
- source_word: וַיַּעֲבִרוּ
  choice: переправили через
  rationale: 'Передаёт каузативную форму глагола עבר: люди Иуды помогли царю и сопровождавшим его перейти Иордан.'
- source_word: בֵּיתוֹ
  choice: его дом
  rationale: «Дом» сохраняет широкий древнееврейский смысл семьи и двора царя, не сводя его только к кровным родственникам или зданию.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: а с ним и всех людей Давида
  rationale: Передаёт и присоединение последней группы, и заключительное עִמּוֹ «с ним», при этом русская конструкция ясно включает людей Давида в число переправленных.
