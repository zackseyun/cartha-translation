  - severity: medium
    issue: «Его дом» не передаёт контекстуальное значение בֵּיתוֹ.
    rationale: В сочетании с переправой через Иордан русское «дом» обычно понимается как здание. В еврейском контексте речь о царском доме, то есть его домашнем окружении/домочадцах.
  - severity: low
