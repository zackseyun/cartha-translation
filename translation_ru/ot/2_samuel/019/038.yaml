base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: ru
  text: Прошу, позволь рабу твоему вернуться[a], чтобы мне умереть в моём городе, рядом с могилой моего отца и моей матери. А вот раб твой Кимгам; пусть он перейдёт вместе с моим господином, царём, и сделай для него то, что угодно тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть возвратится раб твой». Варзиллий почтительно говорит о себе в третьем лице.'
    reason: clarity
  - marker: b
    text: 'Буквально: «то, что хорошо в твоих глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Пусть ... возвратится
  rationale: Глагол שׁוב означает возвращение, а נָא придаёт просьбе вежливый характер; русская конструкция с «пусть» естественно передаёт просительное значение.
- source_word: עַבְדְּךָ
  choice: раб твой
  rationale: В данном придворном обращении это почтительное самообозначение Варзиллия перед царём; традиционное «раб твой» сохраняет социальный и стилистический оттенок.
- source_word: וְאָמֻת
  choice: чтобы мне умереть
  rationale: 'Сочетание союза с имперфектом после просьбы естественно выражает цель: возвращение домой, чтобы умереть там.'
- source_word: בְּעִירִי
  choice: в моём городе
  rationale: Прямо передаёт форму с притяжательным суффиксом, не добавляя отсутствующего в еврейском тексте усиления «родном» или «собственном».
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: рядом с могилой моего отца и моей матери
  rationale: Хотя עִם обычно значит «с», в контексте места смерти и семейного погребения смысл естественно передаётся пространственным «рядом с»; буквальная форма отмечена в сноске.
- source_word: וְהִנֵּה
  choice: А вот
  rationale: Передаёт указательно-представительное значение הִנֵּה и переход от просьбы Варзиллия к предложению относительно Кимгама.
- source_word: כִמְהָם
  choice: Кимгам
  rationale: Передача личного имени по принятой русской библейской форме, близкой еврейскому звучанию.
- source_word: יַעֲבֹר עִם
  choice: пусть он перейдёт вместе с
  rationale: Имперфект в контексте имеет побудительно-желательное значение; «перейдёт» сохраняет мотив переправы через Иордан.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: с господином моим, царём
  rationale: Сохраняет почтительное придворное обращение и синтаксическую связь с предлогом «с».
- source_word: וַעֲשֵׂה לוֹ
  choice: и сделай для него
  rationale: עשה с ל здесь означает действие в пользу человека; «для него» не создаёт двусмысленности русского «сделай с ним».
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: то, что угодно тебе
  rationale: Естественно передаёт еврейскую идиому «то, что хорошо в твоих глазах», не превращая её в нравственную оценку объективного добра; буквальный образ указан в сноске.
