base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: ru
  text: 'И царь сказал Шимею: «Ты не умрёшь»[a]. И царь поклялся ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с пояснением смысла: «Тебя не предадут смерти». Буквально по-еврейски: «Ты не умрёшь»; здесь эти слова могут быть царским обещанием помиловать Шимея и не казнить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И … сказал
  rationale: Форма wayyiqtol продолжает последовательность повествования; союз «и» сохраняет связь с предыдущим событием и естественно звучит в библейском повествовательном стиле.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное обозначает уже известного из контекста царя; в русском языке определённость передаётся без артикля.
- source_word: אֶל שִׁמְעִי
  choice: Шимею
  rationale: Получатель речи естественно обозначается дательным падежом; имя передано в принятой русской библейской форме.
- source_word: לֹא תָמוּת
  choice: Ты не умрёшь
  rationale: Отрицательная форма имперфекта выражает торжественное царское заверение или решение. Буквальный перевод сохраняет возможную широту смысла и не уточняет без необходимости, идёт ли речь именно о казни.
- source_word: וַיִּשָּׁבַע
  choice: И … поклялся
  rationale: Нифаль глагола שבע означает «поклясться, принести клятву»; «поклялся» кратко и точно передаёт действие.
- source_word: לוֹ
  choice: ему
  rationale: Местоименный суффикс относится к Шимею; дательный падеж сохраняет отношение адресата клятвы без повторения имени.
theological_decisions:
- issue: Характер обещания в словах לֹא תָמוּת
  choice: Сохранено буквальное «Ты не умрёшь».
  alternative: «Тебя не предадут смерти» / «Тебя не казнят».
  rationale: Контекст допускает понимание слов как царского помилования от казни, однако еврейский текст буквально говорит «не умрёшь». Основной текст сохраняет эту формулировку и присущую ей смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксический параллелизм двух предложений и повтор слова «царь» сохранены в соответствии с еврейским текстом.
