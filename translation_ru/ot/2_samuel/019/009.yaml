  text: וַ/יָּ֥קָם הַ/מֶּ֖לֶךְ וַ/יֵּ֣שֶׁב בַּ/שָּׁ֑עַר וּֽ/לְ/כָל הָ/עָ֞ם הִגִּ֣ידוּ לֵ/אמֹ֗ר הִנֵּ֤ה הַ/מֶּ֨לֶךְ֙ יוֹשֵׁ֣ב בַּ/שַּׁ֔עַר וַ/יָּבֹ֤א כָל הָ/עָם֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/יִשְׂרָאֵ֔ל נָ֖ס אִ֥ישׁ לְ/אֹהָלָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: ru
  text: 'Тогда царь встал и сел у ворот. Всему народу сообщили: «Вот, царь сидит у ворот». И весь народ пришёл к царю. Израиль же бежал[b] — каждый к своему шатру[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый к своим шатрам»; это выражение означает, что люди разошлись по своим жилищам или родовым местам.'
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «И Израиль бежал». Еврейский союз может выражать как простое продолжение, так и контраст, заметный из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Тогда царь встал
  rationale: Последовательная форма wayyiqtol продолжает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: и сел у ворот
  rationale: ישׁב здесь означает, что царь занял место для публичного появления. Русское «у ворот» естественно обозначает городские ворота как общественное место, не сводя их к створкам.
- source_word: הִגִּידוּ לֵאמֹר
  choice: Всему народу сообщили
  rationale: Множественное неопределённо-личное действие передано русской безличной конструкцией. Отдельное «говоря» опущено, поскольку прямая речь уже естественно выражает еврейскую цитатную конструкцию.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к видимому и актуальному положению царя; «вот» современно и точно передаёт её указательную силу.
- source_word: יוֹשֵׁב
  choice: сидит
  rationale: Причастие обозначает продолжающееся состояние царя в момент сообщения.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: И весь народ пришёл к царю
  rationale: בוא + לפני описывает приближение и явление перед царём; по-русски «пришёл к царю» звучит естественно и не добавляет церемониального смысла.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Израиль же бежал
  rationale: Союз с частицей «же» сохраняет возможное простое соединение и одновременно отмечает контраст. Перфект נָס передаёт фоновое положение после поражения Авессалома без обязательного русского плюсквамперфекта.
- source_word: אִישׁ לְאֹהָלָיו
  choice: каждый к своему шатру
  rationale: Сохранены распределительное значение אִישׁ и образ шатра; краткая русская конструкция передаёт рассеяние людей по своим жилищам.
theological_decisions:
- issue: Распределительное мужское выражение אִישׁ
  choice: каждый
  alternative: каждый мужчина / каждый человек
  rationale: Русское «каждый» имеет мужскую грамматическую форму и естественно передаёт распределительное אִישׁ; добавление «мужчина» было бы тяжеловесным, а «каждый человек» могло бы излишне расширить референцию.
- issue: Связь заключительной части с предыдущим повествованием
  choice: Израиль же бежал
  alternative: А Израиль бежал / Но Израиль уже разбежался
  rationale: Еврейский ו допускает простое соединение и контекстуальный контраст. «Же» сохраняет эту смысловую напряжённость, не делая противительный оттенок столь однозначным, как «но».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис краткий и ясный; сохранены коллективное имя «Израиль», образ городских ворот и идиома о шатрах. Маркеры сносок поставлены непосредственно при поясняемых выражениях.
