lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание просьбы Семея и естественно связывает признание с предшествующей речью.
- source_word: יָדַע עַבְדְּךָ
  choice: твой слуга знает
  rationale: Сохраняет почтительное самообозначение в царской речи и передаёт перфект как настоящее состояние осознания.
- source_word: חָטָאתִי
  choice: я согрешил
  rationale: Передаёт обычное нравственно-религиозное значение глагола חטא без ослабления до «поступил плохо».
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Естественный современный русский указатель, привлекающий внимание к поступку как подтверждению признания.
- source_word: בָאתִי הַיּוֹם רִאשׁוֹן
  choice: сегодня я первым… пришёл
  rationale: Идиоматично передаёт завершённое прибытие и предикативное значение «первым».
- source_word: לְכָל בֵּית יוֹסֵף
  choice: из всего дома Иосифа
  rationale: Представляет Семея первым из всей обозначенной группы; неоднозначность предложной конструкции отмечена в сноске.
- source_word: בֵּית יוֹסֵף
  choice: дом Иосифа
  rationale: Сохраняет коллективное племенное наименование, не подменяя его толкованием «Ефрем».
- source_word: לָרֶדֶת לִקְרַאת
  choice: пришёл встретить
  rationale: В основном тексте передаёт цель движения естественным русским выражением; буквальный топографический оттенок «сойти» указан в сноске.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: моего господина царя
  rationale: Сохраняет придворную почтительность обращения и синтаксическую связь титулов.
