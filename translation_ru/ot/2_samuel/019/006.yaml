base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: ru
  text: 'Иоав пришёл к царю в дом[a] и сказал: «Сегодня ты покрыл стыдом всех своих слуг, которые сегодня спасли твою жизнь и жизни твоих сыновей и дочерей, жён и наложниц[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «домом» здесь, вероятно, подразумевается царская резиденция, то есть дворец.
    reason: cultural_note
  - marker: b
    text: 'Буквально в еврейском тексте несколько раз сказано «жизнь»: «твою жизнь, и жизнь твоих сыновей и дочерей, и жизнь твоих жён и наложниц». Здесь это слово означает физическую жизнь, а не «душу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: в дом
  rationale: Буквальное значение — «дом»; в данном контексте, вероятно, имеется в виду царская резиденция, что поясняется в сноске без подмены текста толкованием.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: покрыл стыдом
  rationale: Естественное русское выражение передаёт каузативное значение «заставил стыдиться, опозорил» и образ еврейского оборота с «лицами», не воспроизводя его неестественно буквально.
- source_word: עֲבָדֶיךָ
  choice: твоих слуг
  rationale: Сохраняет отношение подданных к царю и не сужает значение до воинов или сановников.
- source_word: הַמְמַלְּטִים
  choice: которые ... спасли
  rationale: Причастие обозначает избавление от смертельной опасности; «спасли» естественно сочетается с последующим перечислением жизней.
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  choice: жизнь тебе ... сыновьям ...
  rationale: נפש здесь означает физическую жизнь, а не нематериальную душу. Русская конструкция «спасли жизнь кому» позволяет ясно и без тяжёлого повторения передать весь перечень.
- source_word: פִּלַגְשֶׁיךָ
  choice: наложницам
  rationale: Точный и общепринятый русский термин для женщин, состоявших в признанном, но менее статусном союзе.
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: вошёл ... и сказал
  rationale: Последовательность повествовательных форм естественно передаётся русским рядом глаголов совершенного вида; дополнительное «тогда» не требуется.
theological_decisions:
- issue: Передача исторических семейно-социальных категорий без нравственной оценки
  choice: жёнам и наложницам
  alternative: жёнам и второстепенным жёнам
  rationale: Формулировка прямо сохраняет различие категорий в древнем царском доме, не смягчая его и не добавляя конфессиональной или нравственной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис упрощён ради ясности, но повтор «сегодня» сохранён как риторическая черта оригинала. Выражение «покрыл стыдом» естественно передаёт конкретный еврейский оборот «посрамил лица».
