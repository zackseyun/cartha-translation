  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: ru
  text: 'И сказал царь Барзиллаю: «Переправься со мной, и я буду содержать тебя у себя в Иерусалиме».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма wayyiqtol; союз сохраняет последовательное течение еврейского рассказа.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное; в контексте речь идёт о Давиде, однако исходный титул сохраняется без подстановки имени.
- source_word: אֶל בַּרְזִלָּי
  choice: Барзиллаю
  rationale: Русский дательный падеж естественно передаёт адресата речи; личное имя транслитерировано.
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: Переправься со мной
  rationale: Глагол עבר в данном контексте обозначает переправу через Иордан; отдельное местоимение אַתָּה придаёт обращению акцент, который по-русски достаточно выражен формой повелительного наклонения и контекстом.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: и я буду обеспечивать тебя
  rationale: כלכל здесь означает заботиться о нуждах человека, содержать или обеспечивать его; выбран естественный современный русский эквивалент без сужения к одной форме поддержки.
- source_word: עִמָּדִי
  choice: при себе
  rationale: Передаёт не только совместное местонахождение, но и пребывание Барзиллая при царе, не добавляя идеи, отсутствующей в тексте.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое соответствие названию места с предлогом ב.
