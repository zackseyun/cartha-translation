  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: ru
  text: Весь народ перешёл Иордан, и царь переправился. Царь поцеловал Барзиллая и благословил его, и он вернулся к себе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятнее всего, речь идёт о Барзиллае: «и Барзиллай вернулся к себе». Однако в еврейском тексте подлежащее прямо не названо.'
    reason: Уточнение неоднозначного местоименного подлежащего без устранения неоднозначности в основном тексте.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: Глагол עבר в данном контексте обозначает переход через Иордан; «перешёл» естественно и точно передаёт движение через реку.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: עם имеет широкое значение «народ, люди». Контекст не требует ограничивать эту группу только воинами.
- source_word: אֶת הַיַּרְדֵּן
  choice: Иордан
  rationale: В русском библейском и литературном употреблении название реки естественно употребляется без добавления слова «река».
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: и царь тоже переправился
  rationale: «Переправился» естественно передаёт повторное употребление עבר применительно к царю, а «тоже» ясно выражает присоединение царя к уже названному переходу народа.
- source_word: וַיִּשַּׁק
  choice: поцеловал
  rationale: נשק здесь означает «целовать»; простой русский глагол сохраняет жест привязанности и прощания без лишнего пояснения.
- source_word: לְבַרְזִלַּי
  choice: Барзиллая
  rationale: Имя передано в принятой русской библейской форме и поставлено в требуемый винительный падеж.
- source_word: וַיְבָרֲכֵהוּ
  choice: благословил его
  rationale: ברך прямо означает «благословлять». Перевод сохраняет явную лексику исходного текста, не сводя действие лишь к прощанию.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: и он вернулся к себе
  rationale: Формулировка сохраняет местоименную неоднозначность еврейского текста и естественно передаёт לִמְקֹמוֹ, не конкретизируя это место как дом.
