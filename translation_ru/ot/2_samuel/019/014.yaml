base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: ru
  text: 'А Амасе скажите: «Разве ты не моя кость и моя плоть? Пусть Бог сделает со мной то и ещё больше, если ты не будешь военачальником при мне во все последующие дни[a] вместо Иоава».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во все дни»; в этом контексте выражение указывает на постоянное исполнение этой обязанности.'
    reason: Поясняет еврейское выражение כָּל הַיָּמִים и сохраняет его буквальную форму без излишнего уточнения срока.
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: А Амасе скажите
  rationale: Сохраняет обращённое к нескольким посланникам повеление и естественно продолжает контекст.
- source_word: הֲלוֹא
  choice: Разве ты не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: кость моя и плоть моя
  rationale: Сохраняет выразительную еврейскую формулу кровного родства, не сводя её к толкованию «родственник».
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Пусть Бог сделает со мной то и ещё больше
  rationale: Сохраняет традиционную клятвенную формулу и намеренно не уточняет подразумеваемое наказание.
- source_word: אִם לֹא
  choice: если не будешь ты
  rationale: В составе клятвы вводит содержание обещания; русская условная конструкция сохраняет форму исходного выражения.
- source_word: שַׂר צָבָא
  choice: военачальником
  rationale: Кратко и ясно обозначает верховного командующего войском.
- source_word: תִּהְיֶה לְפָנַי
  choice: будешь ты военачальником при мне
  rationale: «При мне» естественно передаёт служение перед царём и под его властью, сохраняя образную близость к לְפָנַי.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Формально сохраняет буквальный образ непрерывного срока службы; его смысл пояснён в сноске.
- source_word: תַּחַת יוֹאָב
  choice: вместо Иоава
  rationale: 'Здесь תַּחַת означает замещение: Амаса должен занять должность Иоава.'
theological_decisions:
- issue: Число и референция אֱלֹהִים в клятвенной формуле
  choice: Бог
  alternative: боги
  rationale: Хотя форма морфологически множественная, в устойчивой израильской клятвенной формуле слово обозначает единого Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Родственная и клятвенная формулы сохранены близко к еврейскому тексту; синтаксис слегка упорядочен ради естественности.
