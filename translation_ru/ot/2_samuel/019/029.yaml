base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: ru
  text: Ведь весь дом моего отца состоял лишь из людей, заслуживавших смерти перед моим господином, царём[a], а ты посадил твоего слугу среди тех, кто ест за твоим столом. Какое же ещё право[b] есть у меня, чтобы и дальше взывать к царю?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди смерти», то есть люди, подлежащие смерти или заслуживающие казни.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «право» означает справедливое притязание или основание требовать, а не прежде всего личную нравственную праведность.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: Ведь ... заслуживал смерти
  rationale: Эмфатическая ограничительная конструкция передана естественно по-русски; смысл «не что иное, как люди смерти» выражен сказуемым, относящимся ко всему дому.
- source_word: כָּל בֵּית אָבִי
  choice: весь дом моего отца
  rationale: Сохранён библейский образ «дома» как рода или большой семьи; выражение понятно в современном литературном русском.
- source_word: אַנְשֵׁי מָוֶת
  choice: заслуживал смерти
  rationale: Идиома обозначает людей, подлежащих смерти или казни, а не уже умерших; согласование в единственном числе обусловлено собирательным «дом».
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: перед моим господином царём
  rationale: Предлог передаёт положение семьи в оценке и перед судом царя, сохраняя придворное обращение.
- source_word: וַתָּשֶׁת
  choice: но ты посадил
  rationale: Глагол буквально означает «поместил»; «посадил ... среди тех, кто ест за столом» естественно выражает предоставленное место и подчёркивает контраст.
- source_word: עַבְדְּךָ
  choice: своего слугу
  rationale: Здесь это почтительное самоназвание подданного перед царём, а не указание на рабский статус.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: среди тех, кто ест за твоим столом
  rationale: Сохранён конкретный образ участия в царской трапезе и связанного с ним особого благоволения.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Какое же ещё право есть у меня
  rationale: צְדָקָה в данном судебно-реляционном контексте означает справедливое притязание или основание требовать, а не прежде всего личную нравственную праведность.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: чтобы и дальше взывать к царю
  rationale: «Взывать» сохраняет силу זעק — настойчиво обращаться с жалобой или прошением — и звучит достойно и естественно.
