  verdict: revise
  source_fidelity: 'Смысл исходного текста в целом передан верно: речь идёт о средстве переправы, перевозящем царское окружение, и о Шимее, павшем перед царём во время переправы через Иордан. Однако «царский дом» в основном тексте по-русски прежде всего вызывает представление о династии или здании и требует более естественной передачи коллективного значения בֵּית הַמֶּלֶךְ. «Всё, что будет угодно» также добавляет оттенок будущности и всеохватности, которых в еврейском тексте нет.'
  naturalness: «Перевозное судно» понятно, но тяжеловесно для повествования; «паром» — естественное современное обозначение средства речной переправы. «Царский двор» в данном контексте ясно обозначает царское окружение. Явное «царь» в последней части устраняет возможную двусмысленность местоимения.
  terminology: Имена «Шимей», «Гера» и «Иордан» переданы нормативно. «Пал перед царём» удачно сохраняет буквальность и оттенок униженного обращения. Идиома «доброе в его глазах» передана через естественное «то, что было угодно царю» и снабжена примечанием.
