  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: ru
  text: Паром переправился, чтобы перевезти царский двор[a] и сделать то, что было угодно царю[b]. А Шимей, сын Геры, пал перед царём, когда царь переходил Иордан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть людей царского дома и сопровождавшую царя свиту, а не здание дворца.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «и сделать доброе в его глазах» — то есть сделать то, что ему угодно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: перевозное судно
  rationale: Существительное обозначает средство переправы через реку; нейтральное «перевозное судно» сохраняет предметный образ, не уточняя без достаточных оснований тип судна.
- source_word: וְעָבְרָה
  choice: переправилось
  rationale: Форма qal perfect 3-го лица женского рода согласуется с הָעֲבָרָה и в повествовании естественно передаётся русским прошедшим совершенного вида.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: чтобы перевезти царский дом
  rationale: Инфинитив породы hifil выражает перемещение через реку; «перевезти» естественно связано с упомянутым судном. «Царский дом» сохраняет широкий коллективный смысл еврейского выражения.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: и исполнить всё, что будет угодно царю
  rationale: Еврейская идиома буквально говорит о совершении «доброго в его глазах» и означает исполнение того, что ему угодно. Явное «царю» устраняет неестественную для русского языка местоименную двусмысленность.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: пал перед царём
  rationale: Буквальный оборот сохраняет и телесное движение, и оттенок унижения или мольбы, не превращая его в более узкое истолкование «поклонился».
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: когда тот переходил Иордан
  rationale: Инфинитивная конструкция имеет временное значение. Указательное «тот» естественно относит суффикс к ближайшему смысловому референту — царю, сохраняя действие в процессе.
