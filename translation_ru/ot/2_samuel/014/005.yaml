  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: ru
  text: 'Царь спросил её: «Что с тобой?» Она ответила: «Да, я вдова, и мой муж умер».


    [a] Или: «Увы, я вдова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Увы, я вдова».'
    reason: Еврейскую частицу אֲבָל здесь можно понимать не только как усилительное «да, действительно», но и как выражение скорби.
lexical_decisions:
- source_word: מַה לָּךְ
  choice: Что с тобой?
  rationale: Еврейская идиома буквально означает «что тебе?» и в данном контексте служит вопросом о беде или причине обращения. «Что с тобой?» естественно и точно передаёт личную направленность вопроса.
- source_word: אֲבָל
  choice: Поистине
  rationale: Здесь частица, вероятнее всего, имеет усилительно-утвердительное значение, а не обычное противительное «но». Перевод сохраняет её эмфатическую силу; возможное эмоциональное значение отмечено в сноске.
- source_word: אִשָּׁה אַלְמָנָה
  choice: я вдова
  rationale: Сочетание существительного «женщина» с обозначением вдовства естественно передаётся по-русски словом «вдова» без потери смысла.
- source_word: וַיָּמָת אִישִׁי
  choice: мой муж умер
  rationale: אִישׁ с притяжательным суффиксом в этом контексте означает «мой муж», а глагольная форма повествует о его смерти.
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: Прямой перевод определённого существительного; контекст уже указывает, о каком царе идёт речь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь проста и достойна, синтаксис диалога естественен. Союз «и» сохранён перед сообщением о смерти мужа, чтобы передать последовательность еврейской речи.
