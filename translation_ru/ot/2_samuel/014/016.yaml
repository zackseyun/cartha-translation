  text: כִּ֚י יִשְׁמַ֣ע הַ/מֶּ֔לֶךְ לְ/הַצִּ֥יל אֶת אֲמָת֖/וֹ מִ/כַּ֣ף הָ/אִ֑ישׁ לְ/הַשְׁמִ֨יד אֹתִ֤/י וְ/אֶת בְּנִ/י֙ יַ֔חַד מִֽ/נַּחֲלַ֖ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: ru
  text: Ибо царь выслушает и избавит свою рабыню от руки человека, который хочет истребить меня и моего сына вместе и лишить нас Божьего удела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Божий удел» может означать как удел, данный Богом среди Израиля, так и достояние, принадлежащее Богу — Его землю или народ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание уверенности женщины, продолжая мысль предыдущего стиха; «ведь» естественно передаёт пояснительно-утвердительный оттенок.
- source_word: יִשְׁמַע
  choice: выслушает
  rationale: В данном контексте שמע означает не только физически услышать, но и благосклонно принять обращение; «выслушает» сохраняет эту смысловую широту, не утверждая отдельно, что царь непременно повинуется.
- source_word: לְהַצִּיל
  choice: и избавит
  rationale: Инфинитив цели или результата связан со слушанием царя. Сочинительная конструкция звучит по-русски естественно и передаёт ожидаемое вслед за слушанием избавление.
- source_word: אֲמָתוֹ
  choice: свою рабыню
  rationale: Существительное имеет женский род и служит самоуничижительным придворным обозначением говорящей; русский перевод прямо сохраняет как род, так и социально-речевой оттенок.
- source_word: מִכַּף הָאִישׁ
  choice: от руки человека
  rationale: Сохранён древнееврейский образ руки как власти или захвата; он понятен в русском библейском контексте и не требует замены толкованием.
- source_word: לְהַשְׁמִיד
  choice: который хочет истребить
  rationale: Инфинитив выражает намерение названного человека. Относительная конструкция устраняет неестественную для русского языка цепочку инфинитивов, не ослабляя значения полного уничтожения.
- source_word: יַחַד
  choice: вместе
  rationale: Наречие подчёркивает общую участь матери и сына.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: из удела Божьего
  rationale: «Удел» передаёт נחלה как наследственное место или достояние и сохраняет возможность понимать родительный оборот как удел, принадлежащий Богу, либо как удел, дарованный Богом.
theological_decisions:
- issue: Значение выражения «удел Божий»
  choice: 'Формулировка оставлена открытой: речь идёт об уделе в установленном Богом порядке, из которого мать и сын будут устранены.'
  alternative: Выражение может обозначать собственное достояние Бога — Его народ или землю.
  rationale: Контекст связан с прекращением семейной линии и утратой места в Израиле, однако древнееврейский родительный оборот не позволяет однозначно выбрать между уделом, данным Богом, и достоянием, принадлежащим Богу.
- issue: Связь לְהַשְׁמִיד с действующим лицом
  choice: Намерение истребить приписано «человеку», от руки которого женщина ожидает избавления.
  alternative: 'Формально инфинитив можно было бы передать менее определённой конструкцией цели: «чтобы истребить».'
  rationale: Ближайший контекст и содержание угрозы ясно указывают на враждебного человека, тогда как русская относительная конструкция делает эту связь понятной без богословского расширения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Придворное самоназвание «рабыня» и образ «от руки» сохранены; синтаксис слегка перестроен ради ясности. Выражение «удел Божий» намеренно не сужено до одного толкования.
