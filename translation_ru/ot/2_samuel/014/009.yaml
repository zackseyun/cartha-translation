  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: ru
  text: 'И сказала женщина из Фекои царю: «На мне, господин мой, царь, вина[a], и на доме моего отца; а царь и престол его невиновны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконие», «ответственность»; еврейское слово может означать проступок, вину или связанные с ними ответственность и последствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: женщина из Фекои
  rationale: Женская форма обозначения жителя указывает на место происхождения; описательный оборот естественен в современном русском и сохраняет географическую привязку.
- source_word: עָלַי
  choice: На мне
  rationale: Начальная позиция сохраняет эмфатическое принятие ответственности женщиной.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохраняет почтительное придворное обращение и порядок компонентов еврейского выражения, оставаясь понятным по-русски.
- source_word: הֶעָוֺן
  choice: вина
  rationale: В данном судебно-правовом контексте слово обозначает вину либо связанную с ней ответственность; «вина» не сужает смысл до одного лишь наказания.
- source_word: וְעַל בֵּית אָבִי
  choice: и на доме моего отца
  rationale: Сохраняет библейскую семейно-правовую идиому «дом отца», не заменяя её более широким словом «семья».
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: а царь и престол его
  rationale: Союз «а» естественно передаёт смысловое противопоставление; «престол» сохранён как обозначение царской власти и династии.
- source_word: נָקִי
  choice: невиновны
  rationale: Передаёт судебный смысл непричастности к вине; в русском согласовано во множественном числе с составным подлежащим.
theological_decisions:
- issue: Формула освобождения царя от ответственности
  choice: царь и престол его невиновны
  alternative: царь и престол его чисты от вины
  rationale: Речь идёт о непричастности к ответственности в рассматриваемом деле, а не о всеобщем нравственном совершенстве царя.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены повтор титула «царь», эмфатическое «на мне» и идиома «дом моего отца».
