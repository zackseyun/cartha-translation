  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: ru
  text: 'Тогда женщина сказала: «Позволь твоей служанке сказать слово моему господину, царю». И он сказал: «Говори».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה
  choice: Тогда женщина сказала
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующей реплике, а הָאִשָּׁה в контексте означает «женщина».
- source_word: תְּדַבֶּר נָא
  choice: Пусть ... скажет
  rationale: Форма с נָא выражает почтительную просьбу. В русском придворном обращении конструкция «пусть твоя служанка скажет» естественно передаёт и просьбу, и самоуничижительное именование говорящей.
- source_word: שִׁפְחָתְךָ
  choice: твоя служанка
  rationale: Существительное имеет женский род и буквально обозначает служанку или рабыню; «служанка» сохраняет женскую форму и формулу смиренного обращения без излишне резкой социальной окраски слова «рабыня».
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: господину моему, царю
  rationale: אֲדֹנִי здесь является почтительным обращением к человеку. Такой порядок слов сохраняет торжественную придворную речь и ясно обозначает царя как адресата.
- source_word: דָּבָר
  choice: слово
  rationale: Буквальный и уместный в данном речевом обороте эквивалент; возможное значение «дело» здесь менее непосредственно.
- source_word: וַיֹּאמֶר דַּבֵּרִי
  choice: 'Он ответил: «Говори»'
  rationale: Глагол «ответил» естественно обозначает реплику царя в диалоге, а краткое повелительное «говори» точно передаёт императив женского рода.
