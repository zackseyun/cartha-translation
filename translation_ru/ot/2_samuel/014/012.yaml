  source_fidelity: 'Смысл передан верно: женщина почтительно просит разрешения обратиться к царю, а он велит ей говорить. Однако «пусть твоя служанка скажет» в русском может звучать как распоряжение царя, а не как просьба женщины; «позволь ... сказать» яснее передаёт вежливую просительную форму תְּדַבֶּר נָא. Глагол וַיֹּאמֶר нейтральнее передать как «сказал», а не «ответил».'
