base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: ru
  text: У Авессалома родились три сына и одна дочь; её звали Фамарь. Она была красива собой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: У Авессалома родились
  rationale: Нифаль глагола ילד выражает рождение, а לְ указывает на родительскую принадлежность. Русская конструкция «у Авессалома родились» естественно передаёт оба элемента.
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: три сына и одна дочь
  rationale: Сохранены точное число и указание пола детей; «одна» соответствует אַחַת и подчёркивает, что дочь была одна.
- source_word: וּשְׁמָהּ תָּמָר
  choice: её звали Фамарь
  rationale: Женский суффикс относится к только что упомянутой дочери. Идиоматическая русская формула передаёт смысл буквально выраженного «её имя — Фамарь».
- source_word: תָּמָר
  choice: Фамарь
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הִיא הָיְתָה אִשָּׁה יְפַת מַרְאֶה
  choice: Она была красива собой
  rationale: Естественная современная русская формулировка точно передаёт описание привлекательной внешности, избегая тяжеловесного буквализма «женщина, красивая видом».
