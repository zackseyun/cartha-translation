base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: ru
  text: 'Тогда он сказал своим слугам: «Смотрите, поле Иоава рядом с моим, и там у него ячмень. Пойдите и подожгите его». И слуги Авессалома подожгли поле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקַת
  choice: поле
  rationale: В данном земледельческом контексте слово обозначает возделываемый участок земли; «поле» естественно и точно передаёт смысл.
- source_word: אֶל יָדִי
  choice: рядом с моим
  rationale: Буквально «у моей руки»; в описании земель это идиома пространственной близости. Русское «рядом с моим» ясно указывает на соседство участков.
- source_word: שְׂעֹרִים
  choice: ячмень
  rationale: Форма множественного числа обозначает ячмень как выращиваемую культуру; по-русски здесь естественно собирательное единственное число.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: подожгите его / подожгли поле
  rationale: Каузативные формы יצת означают предать огню, поджечь. Повтор глагола сохраняет связь приказа с его исполнением, а явное «поле» во второй части звучит естественно.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: слугам / слуги Авессалома
  rationale: עבד допускает значения «раб» и «слуга», но придворно-повествовательный контекст не уточняет несвободный статус; «слуги» не вносит лишней конкретизации.
- source_word: רְאוּ
  choice: Видите
  rationale: Императив привлекает внимание собеседников к расположенному рядом полю. «Видите» естественно вводит указание в современной русской прямой речи.
- source_word: לְכוּ
  choice: Пойдите
  rationale: Прямой императив движения перед приказом поджечь поле; форма соответствует dignified современному повествованию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной повествовательной интонацией. Идиома אֶל יָדִי передана по смыслу непосредственно в тексте; отдельная сноска не требуется, поскольку буквальная форма по-русски была бы неясна и не добавляет значимой неоднозначности.
