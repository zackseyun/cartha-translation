  source_fidelity: 'Смысл передан в целом точно: Авессалом указывает на соседний участок Иоава с ячменём, велит предать его огню, и слуги исполняют приказ. Однако «Видите» в форме изъявительного наклонения звучит менее точно для еврейского повелительного רְאוּ и менее естественно в реплике; требуется повелительное «Смотрите» (или «Посмотрите»).'
