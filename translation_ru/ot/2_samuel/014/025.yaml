base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: ru
  text: Во всём Израиле не было мужчины столь красивого, как Авессалом[a], и столь прославляемого. От подошв ног до темени не было на нём ни единого изъяна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столь восхваляемого». Еврейское выражение указывает на то, что Авессалома чрезвычайно хвалили, в данном контексте — за его красоту.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: как Авессалом
  rationale: 'Частица כְּ участвует в превосходном сравнении: во всём Израиле не было мужчины, равного Авессалому красотой. Союз וּ естественно передаётся связностью контекста без добавления временного «теперь».'
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: Во всём Израиле не было мужчины столь красивого
  rationale: Передаёт идиоматическое превосходное сравнение и сохраняет прямое указание на весь Израиль.
- source_word: לְהַלֵּל מְאֹד
  choice: его превозносили за красоту
  rationale: Инфинитив с מְאֹד выражает чрезвычайно высокую похвалу; дополнение «за красоту» ясно связывает похвалу с внешностью в данном контексте.
- source_word: מִכַּף רַגְלוֹ וְעַד קָדְקֳדוֹ
  choice: От ступней до темени
  rationale: Естественный русский меризм, охватывающий всё тело; כַּף רֶגֶל обозначает подошву/нижнюю часть стопы, а קָדְקֹד — темя, верх головы.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: не было на нём ни единого изъяна
  rationale: מוּם здесь означает видимый телесный недостаток; «изъян» сохраняет возвышенный регистр и не ограничивает смысл медицинским дефектом.
