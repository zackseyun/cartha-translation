  naturalness: '«Во всём Израиле не было мужчины столь красивого, как Авессалом» звучит естественно. Более плавно и ближе к структуре оригинала соединить чрезвычайную похвалу с характеристикой Авессалома: «столь красивого и столь прославляемого». «От подошв ног до темени» — устойчивый современный литературный меризм.'
