revisions:
- from: Ведь мы непременно умрём и станем словно вода, пролитая на землю, которую уже не собрать. Но Бог не отнимает жизни[a], а замышляет, как сделать, чтобы изгнанный не оставался вдали от Него[b].
  to: Ведь все мы непременно умрём и подобны воде, пролитой на землю, которую уже не собрать. Но Бог не отнимает жизни[a], а строит замыслы, чтобы изгнанный не оставался изгнанным от Него[b].
  rationale: Исправлено неудачное «станем словно вода» на прямое сравнение, соответствующее еврейскому образу. «Замышляет, как сделать» заменено на более литературное и нейтральное «строит замыслы». В заключительной части восстановлен повтор понятия изгнания, присутствующий в исходном тексте, без снятия документированной лексической неоднозначности.
