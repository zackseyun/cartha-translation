  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: ru
  text: Ведь все мы непременно умрём и подобны воде, пролитой на землю, которую уже не собрать. Но Бог не отнимает жизни[a], а строит замыслы, чтобы изгнанный не оставался изгнанным от Него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог не проявляет пристрастия к человеку». Еврейская фраза трудна и допускает иное понимание.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «чтобы изгнанный не был отторгнут от Него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-аргументативную связь с предшествующим обращением и естественно звучит по-русски.
- source_word: מוֹת נָמוּת
  choice: мы непременно умрём
  rationale: Сочетание инфинитива абсолютного с личной формой глагола подчёркивает неизбежность смерти; наречие «непременно» передаёт это усиление.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: и станем словно вода, пролитая на землю
  rationale: В русском предложении восполнен подразумеваемый глагол, чтобы образ был ясным и естественным; «пролитая» согласуется с последующей невозможностью собрать воду.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: которую уже не собрать
  rationale: Безличная конструкция кратко и выразительно передаёт невозвратимость; «уже» раскрывает подразумеваемую необратимость, не меняя смысла образа.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Но Бог не отнимает жизни
  rationale: Трудная фраза понята в связи с темами смерти и возвращения изгнанного. Родительный падеж после отрицания естественен для современного литературного русского; альтернативное понимание сохранено в примечании.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: а замышляет, как сделать
  rationale: Однокоренная еврейская конструкция выражает обдуманное намерение. Русская формулировка избегает неестественного буквального повтора и подводит к придаточному цели.
- source_word: לְבִלְתִּי יִדַּח
  choice: чтобы ... не оставался вдали
  rationale: Передаёт не только изгнание, но и намерение прекратить продолжающееся отчуждение; более буквальный вариант дан в примечании.
- source_word: מִמֶּנּוּ נִדָּח
  choice: изгнанный ... от Него
  rationale: Сохраняет единственное число и личное отношение изгнанного к Богу; прописная буква проясняет ближайший референт местоимения в данном толковании.
theological_decisions:
- issue: Значение וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Бог не отнимает жизни
  alternative: Бог не проявляет пристрастия к человеку
  rationale: Оборот допускает разные толкования. Основной вариант лучше связывает утверждение с непосредственным контекстом смерти, изгнания и восстановления, однако альтернативу нельзя исключить, поэтому она документирована в примечании.
- issue: Смысл לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  choice: чтобы изгнанный не оставался вдали от Него
  alternative: чтобы изгнанный не был отторгнут от Него
  rationale: Основной вариант выражает восстановительную направленность Божьего замысла и передаёт состояние изгнания; более буквальное прочтение допускает акцент на самом изгнании и сохранено в примечании.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи, без архаизмов. Образ пролитой воды сохранён, а трудные богословски значимые места не сглажены: альтернативные прочтения вынесены в примечания. Местоимение «Него» написано с прописной буквы, поскольку в основном прочтении относится к Богу.'
