translation:
  language: ru
  text: 'Тогда царь сказал женщине: «Иди домой, а я дам распоряжение относительно тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дам распоряжение для тебя»; возможно также: «дам распоряжение в твою пользу». Еврейский предлог допускает разные оттенки, но речь идёт о распоряжении царя по её делу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; «тогда» естественно передаёт развитие действия по-русски.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямое соответствие определённому существительному; в русском контексте определённость не требует отдельного показателя.
- source_word: הָאִשָּׁה
  choice: женщине
  rationale: В данном контексте אִשָּׁה обозначает женщину из Фекои, а не жену.
- source_word: לְכִי לְבֵיתֵךְ
  choice: Иди домой
  rationale: Императив женского рода передан прямо; «домой» — естественное современное русское выражение для направления к своему дому.
- source_word: וַאֲנִי אֲצַוֶּה
  choice: а я отдам распоряжение
  rationale: Явное местоимение אֲנִי сохраняет смысловое выделение говорящего, а piel צוה передаёт властное распоряжение царя. Союз «а» естественно обозначает переход от действия женщины к обещанному действию царя.
- source_word: עָלָיִךְ
  choice: о тебе
  rationale: Предлог עַל при צוה может указывать на лицо или дело, относительно которого будет дано распоряжение; формулировка намеренно не усиливает оттенок благодеяния.
