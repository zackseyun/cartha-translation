  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: ru
  text: 'Но царь сказал: «Пусть он удалится в свой дом и пусть не видит лица моего».[a] И Авессалом удалился в свой дом и не видел лица царя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «видеть моё лицо» и «видеть лицо царя» — еврейское выражение, означающее находиться в чьём-либо присутствии или быть допущенным к нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: пусть возвратится / возвратился
  rationale: В сочетании с אֶל־בֵּיתוֹ глагол обозначает направленное движение обратно к своему дому. Повтор одного русского глагола сохраняет соответствие между приказом царя и его исполнением.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Передаёт основное значение «дом» и возвратное отношение притяжательного суффикса к Авессалому; звучит естественно по-русски.
- source_word: וּפָנַי לֹא יִרְאֶה
  choice: а лица моего не видит
  rationale: Буквально сохраняет еврейский образ «видеть лицо», означающий личное присутствие или допуск к царю. Форма настоящего времени с отрицанием в прямой речи передаёт волю и запрет царя.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: и лица царя не видел
  rationale: Сохраняет намеренный повтор идиомы из царского приказа и подчёркивает, что Авессалом не был допущен к царю.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Стандартное соответствие еврейскому מֶלֶךְ.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Традиционная и общепонятная русская форма библейского имени.
- source_word: וַיֹּאמֶר
  choice: Но царь сказал
  rationale: 'Союз «но» уместно выражает контраст контекста: Авессалому разрешили вернуться, однако царь отказал ему в личной встрече.'
theological_decisions:
- issue: Буквальная идиома «видеть моё лицо / лицо царя» или истолковывающая передача допуска к царю
  choice: Сохранить идиому буквально в основном тексте
  alternative: «пусть не является ко мне» / «не был допущен к царю»
  rationale: Буквальная передача сохраняет повтор и риторическую силу еврейского текста, не уточняя сверх сказанного характер царской аудиенции; значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Порядок слов «лица моего не видит» и «лица царя не видел» слегка маркирован, но естественен для библейского повествования и сохраняет смысловой акцент и повтор оригинала.
