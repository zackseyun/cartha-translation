  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: ru
  text: 'Тогда женщина сказала: «Почему же ты замыслил такое против народа Божьего? Произнося это слово, царь тем самым подобен виновному[a], ведь он не возвращает своего изгнанника[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царь оказывается как виновный»; высказанное им суждение подразумевает его собственную виновность.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «его изгнанника»; возможно также: «изгнанного от него». Речь идёт об Авессаломе, но женщина не называет его прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: замыслил
  rationale: Глагол может обозначать размышление, намерение или замысел; в обличительном контексте «замыслил» передаёт осознанный образ действий, не сводя смысл к простой мысли.
- source_word: כָזֹאת
  choice: такое
  rationale: Указательное выражение отсылает к поступку, выявленному логикой притчи; по-русски краткое «такое» естественно сохраняет обвинительную силу.
- source_word: עַל עַם אֱלֹהִים
  choice: против народа Божьего
  rationale: Предлог עַל при חָשַׁב в данном контексте выражает направленность во вред; буквенное обозначение Божьего народа сохранено без сужения до Авессалома.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: Произнося это решение, царь тем самым
  rationale: 'Конструкция с מִן и инфинитивом передаёт обстоятельство или средство: собственными словами царь ставит себя в положение виновного. «Решение» естественно обозначает вынесенное царём суждение в предшествующем контексте.'
- source_word: כְּאָשֵׁם
  choice: как бы признаёт себя виновным
  rationale: כְּ сохраняет сравнительный оттенок. Формулировка передаёт не прямое юридическое осуждение, а то, что высказанное царём суждение подразумевает его собственную виновность.
- source_word: לְבִלְתִּי הָשִׁיב
  choice: ведь ... не возвращает
  rationale: 'Конструкция указывает основание обвинения; «ведь» ясно выражает причинную связь, а настоящее время соответствует несовершённому факту: изгнанник всё ещё не возвращён.'
- source_word: נִדְּחוֹ
  choice: своего изгнанника
  rationale: Субстантивированное пассивное причастие обозначает того, кто изгнан или удалён; «своего изгнанника» сохраняет единственное число и притяжательный суффикс, не называя Авессалома прямо.
theological_decisions:
- issue: Объём выражения «народ Божий»
  choice: Сохранить «против народа Божьего» без поясняющего сужения.
  alternative: Против Израиля; против Авессалома и царского дома.
  rationale: Еврейский текст прямо говорит о народе Бога. Контекст связывает обвинение с изгнанием Авессалома и благополучием царства, но перевод не должен устранять более широкий заветный и общественный смысл выражения.
- issue: Характер виновности царя
  choice: 'Сохранить сравнительно-импликативный смысл: «как бы признаёт себя виновным».'
  alternative: 'Прямое утверждение: «царь виновен».'
  rationale: Форма כְּאָשֵׁם содержит показатель сравнения כְּ; слова царя ставят его в положение виновного, однако текст риторически выражает это не как простую прямую декларацию.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сделан естественным для устного обличения; сохранены риторическая косвенность обвинения, выражение «народ Божий» и неопределённое обозначение изгнанника.
