base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: ru
  text: 'И сказал царь Иоаву: «Вот, я сделал это. Иди и верни юношу Авессалома».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с имперфектом продолжает повествовательную последовательность; традиционная русская связка «И сказал» естественна для библейского повествования и точно передаёт движение рассказа.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён определённый титул исходного текста без замены личным именем.
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: הִנֵּה привлекает внимание, а נָא здесь смягчает или подчёркивает высказывание. Русское «Вот» естественно передаёт совокупную дискурсивную функцию без архаичного или неуместно просительного оттенка.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: я исполнил это дело
  rationale: Сохранена широкая формулировка еврейского текста — буквально «сделал это дело», — но выбран естественный русский глагол «исполнил», который в контексте может относиться к удовлетворению просьбы, не превращая подразумеваемое в явное.
- source_word: וְלֵךְ
  choice: Теперь пойди
  rationale: Союз связывает решение царя с последующим повелением. «Теперь» естественно выражает переход к требуемому действию, не усиливая причинность.
- source_word: הָשֵׁב
  choice: верни
  rationale: 'Порода хифиль глагола שוב имеет каузативный смысл: Иоав должен сделать так, чтобы Авессалом возвратился. Русское переходное «верни» точно передаёт этот смысл.'
- source_word: הַנַּעַר
  choice: юношу
  rationale: נַעַר допускает значения от мальчика до молодого человека. «Юноша» сохраняет возрастно-относительный и отеческий оттенок, не называя взрослого Авессалома ребёнком.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Авессалома
  rationale: Сохранено приложение после слова «юношу» и употреблена закрепившаяся в русской библейской традиции форма имени.
theological_decisions:
- issue: Подразумевает ли עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה прямое удовлетворение просьбы Иоава?
  choice: Сохранить общее выражение «я исполнил это дело».
  alternative: «Я исполнил твою просьбу» или «я сделал то, о чём ты просил».
  rationale: Контекст позволяет понимать слова царя как согласие на просьбу, однако дополнения «твою просьбу» в еврейском тексте нет. Более широкая передача сохраняет исходную недосказанность и не вводит толкование в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским повествовательным регистром. Синтаксис ясен обычному читателю; архаизмы вроде «се» и канцелярские обороты исключены.
