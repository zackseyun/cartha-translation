base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: ru
  text: Иоав пришёл к царю и доложил ему, и царь велел позвать Авессалома. Авессалом пришёл к царю и пал ниц перед царём, лицом к земле; царь поцеловал Авессалома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Поцелуй царя, вероятно, служил знаком примирения или возвращённого благоволения, хотя в тексте сказано лишь, что царь поцеловал Авессалома.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Иоав пришёл к царю
  rationale: Обычная повествовательная форма глагола בוא обозначает приближение к царю; «пришёл» естественно передаёт направление движения.
- source_word: וַיַּגֵּד לוֹ
  choice: и доложил ему
  rationale: В придворном контексте Hiphil глагола נגד означает сообщить или доложить. «Доложил» естественно для обращения к царю и не добавляет отсутствующего в тексте содержания сообщения.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: Тогда царь велел позвать Авессалома
  rationale: Оборот קרא אל в данном придворном контексте означает вызов Авессалома к царю. Русское «велел позвать» ясно передаёт практический смысл, а неявно выраженный субъект и более буквальный вариант отмечены в сноске.
- source_word: וַיִּשְׁתַּחוּ לוֹ עַל־אַפָּיו אַרְצָה
  choice: пал перед ним ниц, лицом на землю
  rationale: Глагол שחה и уточнение «лицом к земле» описывают полное почтительное простирание. «Пал ниц» — современное литературное и узнаваемое выражение; добавление «лицом на землю» сохраняет конкретность еврейского текста.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: царь поцеловал Авессалома
  rationale: Перевод прямо передаёт физическое действие и не вносит в основной текст толкование его церемониального или примирительного значения.
theological_decisions:
- issue: Значение царского поцелуя
  choice: 'Передать буквально: «царь поцеловал Авессалома».'
  alternative: «Царь примирился с Авессаломом» или «царь восстановил его в своём расположении».
  rationale: По контексту поцелуй, вероятно, служит знаком примирения или возвращённого благоволения, однако еврейский текст называет лишь само действие. Буквальная передача сохраняет заложенную в повествовании недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. «Доложил» соответствует придворной обстановке, а «пал ниц» сохраняет достоинство и телесную конкретность сцены без архаизации всего стиха.
