  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: ru
  text: 'Тогда Иоав встал, пришёл в дом Авессалома и сказал ему: «Почему твои слуги подожгли мой участок[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «участок, который принадлежит мне, огнём [подожгли]».'
    reason: Сноска показывает явное в еврейском тексте определение принадлежности («который принадлежит мне») и инструментальное «огнём», которые в основном тексте естественно переданы глаголом «подожгли мой участок».
lexical_decisions:
- source_word: וַיָּקָם
  choice: Тогда Иоав встал
  rationale: Глагольная форма продолжает последовательное повествование; «тогда» передаёт ход событий, а «встал» естественно сохраняет исходный образ действия.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: пришёл в дом Авессалома
  rationale: Направительное окончание в הַבָּיְתָה указывает на движение к дому; контекст связывает дом с Авессаломом. Формулировка естественна для русского повествования.
- source_word: לָמָּה
  choice: Зачем
  rationale: В данном упрёке вопрос касается причины и намерения поступка; «зачем» звучит естественно, не устраняя обвинительного оттенка.
- source_word: הִצִּיתוּ
  choice: подожгли
  rationale: Порода hифиль глагола יצת обозначает предание огню, зажигание. «Подожгли» кратко и точно передаёт причинное действие.
- source_word: עֲבָדֶךָ
  choice: твои слуги
  rationale: Хотя форма существительного внешне единственного числа, согласованный глагол стоит во множественном числе и указывает на собирательное значение. «Слуги» соответствует придворному контексту и не усиливает значение до «рабы».
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: мой участок
  rationale: חֶלְקָה означает участок или надел земли, а אֲשֶׁר לִי прямо выражает принадлежность. Русское «мой участок» естественно свёртывает относительную конструкцию без потери смысла.
- source_word: בָּאֵשׁ
  choice: подожгли
  rationale: Буквально сочетание обозначает предание участка огню; в русском инструментальное «огнём» естественно включается в значение глагола «подожгли».
