base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: ru
  text: 'Авессалом сказал Иоаву: «Вот, я послал за тобой, сказав: “Приди сюда, чтобы я послал тебя к царю передать ему: ‘Зачем я пришёл из Гессура? Лучше бы мне всё ещё быть там’[a]”. Теперь же пусть мне будет позволено увидеть лицо царя[b]; а если на мне есть вина, пусть он предаст меня смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза эллиптична; возможный перевод: «Лучше мне, если бы я всё ещё был там».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть я увижу лицо царя»; это выражение означает предстать перед царём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию указания и привлечения внимания, не придавая реплике архаического звучания.
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: я посылал к тебе сказать
  rationale: Передаёт посылку сообщения или призыва к Иоаву, а не отправление какого-либо предмета.
- source_word: בֹּא הֵנָּה
  choice: Приди сюда
  rationale: Прямой и естественный эквивалент повеления с указательным наречием.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: чтобы я послал тебя к царю
  rationale: Когортатив после призыва выражает цель; конструкция с «чтобы» ясно передаёт эту связь.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Зачем я пришёл из Гессура?
  rationale: Сохраняет активную форму первого лица и передаёт жалобу Авессалома без внесения отсутствующего в еврейском каузативного смысла «зачем меня вернули».
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Лучше бы мне по-прежнему быть там
  rationale: Естественно восполняет эллиптическую сравнительную конструкцию и сохраняет значение עוֹד — продолжение пребывания в Гессуре.
- source_word: וְעַתָּה
  choice: Теперь же
  rationale: Обозначает переход от жалобы к требованию, не превращая временную связку в причинно-следственную.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: позволь мне увидеть лицо царя
  rationale: Сохраняет еврейский образ «увидеть лицо», который в контексте означает получить доступ к царю и предстать перед ним.
- source_word: עָוֺן
  choice: вина
  rationale: Подходит к судебному оттенку речи и охватывает виновность в проступке, не сужая значение до определённого религиозного термина.
- source_word: וֶהֱמִתָנִי
  choice: пусть он предаст меня смерти
  rationale: Передаёт каузативную форму глагола מות в торжественном, но понятном современном русском регистре.
