  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: ru
  text: 'И сказала твоя служанка: «Пусть же слово господина моего, царя, принесёт покой, ведь господин мой, царь, подобен ангелу Божьему[a] и способен различать добро и зло.[b] И да будет Яхве, твой Бог, с тобой!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «посланнику Божьему».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слышать добро и зло»; выражение может обозначать способность различать их и судить о них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: твоя раба
  rationale: Форма женского рода буквально обозначает служанку или рабыню; «твоя раба» сохраняет пол говорящей и её почтительное самоуничижение в придворной речи.
- source_word: יִהְיֶה נָּא
  choice: пусть же
  rationale: Юссив с נָא выражает почтительную просьбу; частица «же» естественно передаёт мягкую настойчивость, не утяжеляя русскую фразу.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: слово господина моего, царя
  rationale: דבר допускает значения «слово», «дело» и «решение». «Слово» сохраняет образ исходного текста, а контекст указывает на царское решение.
- source_word: לִמְנוּחָה
  choice: принесёт покой
  rationale: Существительное означает покой, облегчение или успокоение; динамическая конструкция естественна по-русски и передаёт ожидаемый результат царского слова.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: подобен ангелу Божьему
  rationale: מלאך может означать посланника или ангела. В возвышенном сравнении царя наиболее вероятен сверхъестественный смысл; русское «ангелу Божьему» естественно передаёт конструкцию без навязывания уникальности одного определённого ангела.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: способен различать добро и зло
  rationale: Буквально сказано «слышать добро и зло», но в судебно-царском контексте שׁמע обозначает восприятие и распознавание при вынесении решения. «Различать» ясно передаёт идиоматический смысл.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное имя יהוה передано как «Яхве», а притяжательная связь сохранена.
- source_word: יְהִי עִמָּךְ
  choice: да будет ... с тобой
  rationale: Стандартная благожелательная юссивная формула естественно передаётся русским пожеланием «да будет».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и отличает его от титула «Господь».
- issue: Значение מַלְאַךְ в сравнении с царём
  choice: ангел
  alternative: посланник
  rationale: Контекст возвышает способность царя распознавать добро и зло; «ангел Божий» лучше сохраняет обычную библейскую силу этого сравнения, хотя лексически возможно «посланник».
- issue: Смысл выражения «слышать добро и зло»
  choice: различать добро и зло
  alternative: слышать добро и зло
  rationale: Выбран идиоматический судебный смысл, понятный современному читателю; буквальная форма сохранена в примечании, чтобы не скрывать образность и возможную широту глагола.
translation_notes:
  register: Современный литературный русский с достоинством придворной речи. Инверсия «господина моего, царя» сохраняет торжественный и почтительный тон, оставаясь понятной. Женский род говорящей передан явно. Единственная сноска отмечает буквальный образ там, где основной текст передаёт идиоматический судебный смысл.
