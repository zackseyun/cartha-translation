base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: ru
  text: 'Иоав послал в Фекою за мудрой женщиной и привёл её оттуда. Он сказал ей: «Прошу тебя, притворись скорбящей[a], надень траурную одежду[b], не умащайся маслом[c] и будь похожа на женщину, которая уже много дней оплакивает умершего[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скорби»; «веди себя как скорбящая». Древнееврейский глагол означает «скорбеть, носить траур», но из контекста видно, что женщине поручено изобразить скорбь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одежды траура».'
    reason: lexical_alternative
  - marker: c
    text: Во время скорби люди воздерживались от умащения маслом, которое обычно служило для ухода за телом и ассоциировалось с повседневным благополучием и праздничностью.
    reason: cultural_note
  - marker: d
    text: 'Буквально: «как женщина, много дней скорбящая об умершем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Фекоя
  rationale: Традиционная и узнаваемая русская форма библейского топонима; направительное окончание древнееврейского слова передано русской конструкцией «в Фекою».
- source_word: אִשָּׁה חֲכָמָה
  choice: мудрая женщина
  rationale: Сохраняет основное значение חכם, не исключая подразумеваемых контекстом рассудительности и умения убедительно говорить.
- source_word: הִתְאַבְּלִי נָא
  choice: прошу, притворись плакальщицей
  rationale: Сам глагол означает «скорбеть, носить траур», однако контекст показывает, что Иоав поручает женщине разыграть роль скорбящей. «Плакальщицей» естественно обозначает принятую ею роль, а примечание сохраняет буквальную возможность.
- source_word: וְלִבְשִׁי נָא בִגְדֵי אֵבֶל
  choice: надень траурную одежду
  rationale: Естественная современная передача буквального сочетания «одежды траура».
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: не умащай себя маслом
  rationale: Передаёт нанесение масла на тело как обычай ухода и освежения; глагол «умащать» сохраняет культурную конкретность без добавления ритуального смысла.
- source_word: וְהָיִית כְּאִשָּׁה
  choice: и выгляди как женщина
  rationale: В контексте подготовленной инсценировки речь идёт о внешнем виде и поведении; такой перевод естественнее буквального «будь как женщина».
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: которая уже много дней оплакивает умершего
  rationale: «Уже много дней» передаёт длительность, а неопределённое единственное מֵת — умершего человека без уточнения личности или пола.
