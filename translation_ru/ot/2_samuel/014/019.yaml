base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: ru
  text: 'Тогда царь спросил: «Не рука ли Иоава стоит за всем этим?» Женщина ответила: «Как верно то, что ты жив, господин мой царь![a] Никто не может ни вправо, ни влево уклониться от всего, что сказал господин мой царь, ибо твой слуга Иоав велел мне, и он вложил в уста твоей служанки все эти слова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Жива душа твоя». Это древнееврейская клятвенная формула: «Как верно то, что ты жив». Выражение «ни вправо, ни влево уклониться» — образ невозможности отступить от сказанного царём, возразить ему или уклониться от его верного вывода.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: Не рука ли Иоава стоит за всем этим?
  rationale: Сохраняет образ «руки» как обозначение участия и направляющего влияния, а оборот «стоит за» естественно передаёт смысл по-русски.
- source_word: בְּכָל זֹאת
  choice: за всем этим
  rationale: Относится ко всему замыслу и изложенному женщиной делу.
- source_word: חֵי נַפְשְׁךָ
  choice: Живи душа твоя
  rationale: Сохранена буквальная форма древнееврейской клятвенной формулы; её значение поясняется в сноске.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: Ни вправо, ни влево нельзя уклониться
  rationale: Сохраняет направительный образ и передаёт невозможность отклониться от точного суждения царя; отрицательная клятвенная конструкция אִם передана категорическим отрицанием.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: от всего, что сказал
  rationale: Предлог מִן связан с образом уклонения, а דִּבֶּר естественно передаётся глаголом «сказал».
- source_word: עַבְדְּךָ יוֹאָב
  choice: твой слуга Иоав
  rationale: В придворном контексте «слуга» точнее и естественнее, чем социально более узкое «раб».
- source_word: צִוָּנִי
  choice: велел мне
  rationale: Передаёт распоряжение Иоава естественным современным русским языком, сохраняя его властный характер.
- source_word: שָׂם בְּפִי
  choice: вложил в уста
  rationale: Сохранён выразительный древнееврейский образ снабжения человека словами для произнесения.
- source_word: שִׁפְחָתְךָ
  choice: твоей рабы
  rationale: Женская форма и уничижительное придворное самоназвание переданы традиционным и понятным русским выражением.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Контекст показывает, что Иоав подготовил именно её речь, поэтому «слова» точнее широкого «дела» или «вещи».
