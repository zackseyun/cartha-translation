base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: ru
  text: 'Тогда Иоав пал лицом на землю, поклонился и благословил царя. Иоав сказал: «Сегодня твой слуга узнал, что обрёл благоволение в твоих глазах, господин мой, царь, потому что царь исполнил просьбу своего слуги[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал слово своего слуги».'
    reason: Сноска сохраняет необычную форму исходного выражения, тогда как основной текст передаёт его контекстуальный смысл.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: пал лицом на землю
  rationale: Передаёт направленность движения и позу почтения, сохраняя образ еврейского выражения и естественно звуча по-русски.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: В придворном контексте глагол обозначает поклон или земное почтение перед высшим; перевод не приписывает действию религиозного поклонения.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: благословил царя
  rationale: Сохраняет основное значение piel глагола ברך с человеком в качестве дополнения; в контексте благословение выражает благодарность и почтение.
- source_word: הַיּוֹם יָדַע עַבְדְּךָ
  choice: Сегодня твой слуга узнал
  rationale: Перфект ידע выражает наступившее благодаря событию осознание; «узнал» естественно передаёт значение «теперь убедился».
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Это обычная формула самоуничижительного обращения к царю, а не акцент на юридическом рабском статусе.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: обрёл благоволение в твоих глазах
  rationale: Сохраняет исходную метафору и устойчивый библейский оборот, оставаясь понятным современному читателю.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Передаёт почтительное придворное обращение и приложение «царь», не сакрализуя титул.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В данном контексте частица вводит основание, по которому Иоав понял, что пользуется благоволением царя.
- source_word: עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ
  choice: исполнил просьбу своего слуги
  rationale: Буквально речь идёт о том, что царь «сделал слово» слуги; по смыслу он удовлетворил высказанную Иоавом просьбу. Основной текст передаёт это естественно, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Характер поклона человеческому царю
  choice: «поклонился» как выражение придворного почтения
  alternative: «поклонился как Богу» / «совершил поклонение»
  rationale: Контекст описывает почтение царю, но не утверждает религиозного поклонения; перевод не вносит такого богословского смысла.
- issue: Значение обращения עַבְדְּךָ
  choice: «твой слуга» как придворная формула
  alternative: «твой раб» с акцентом на правовом рабстве
  rationale: Самообозначение Иоава выражает подчинённость и почтительность перед царём; контекст не требует подчёркивать рабский статус.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным придворным регистром. Сохранены повтор слова «царь», формула «твой слуга» и образ «в твоих глазах»; архаизмы и конфессионально окрашенные истолкования избегаются.
