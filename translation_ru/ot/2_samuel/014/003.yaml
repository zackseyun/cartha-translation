  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: ru
  text: Затем пойди к царю и скажи ему вот что. Иоав вложил ей в уста слова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вложил ей в уста слова» означает, что Иоав подсказал женщине слова, которые ей следовало сказать.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Затем пойди
  rationale: Форма перфекта 2-го лица женского рода с союзом продолжает последовательность указаний и по смыслу передаёт распоряжение; «затем пойди» естественно выражает очередность действий.
- source_word: אֶל־הַמֶּלֶךְ
  choice: к царю
  rationale: Предлог אֶל обозначает направленность движения к лицу; буквальный и естественный русский эквивалент — «к царю».
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: и скажи ему
  rationale: דבר с אֶל означает обращённую к кому-либо речь. В данном контексте подготовленного сообщения «скажи ему» звучит по-русски естественнее, чем буквальное «говори ему».
- source_word: כַּדָּבָר הַזֶּה
  choice: вот что
  rationale: Оборот вводит содержание предстоящей речи. «Вот что» передаёт указательное значение и не требует неестественного буквального «согласно этому слову».
- source_word: וַיָּשֶׂם
  choice: вложил
  rationale: В сочетании со «словами» и «устами» глагол שׂים образует образное выражение; русское «вложил в уста» сохраняет метафору и её смысл.
- source_word: אֶת־הַדְּבָרִים
  choice: слова
  rationale: Множественное דְּבָרִים обозначает подготовленную Иоавом речь. «Слова» сохраняет конкретность исходного выражения без добавления отсутствующего в еврейском указательного местоимения.
- source_word: בְּפִיהָ
  choice: ей в уста
  rationale: Буквальный образ «в её уста» естественно передаётся русским оборотом «вложил ей в уста» и означает, что Иоав подсказал женщине, что говорить.
