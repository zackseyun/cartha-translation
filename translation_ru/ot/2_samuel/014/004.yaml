  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: ru
  text: 'Женщина из Фекои[a] сказала царю. Она пала лицом на землю, поклонилась и сказала: «Спаси меня[b], царь!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «фекоитянка».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «Спаси, царь»; подразумеваемое дополнение «меня» добавлено для естественности русского выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: женщина из Фекои
  rationale: Форма הַתְּקֹעִית указывает на происхождение женщины. Оборот «женщина из Фекои» естественен в современном русском языке и сохраняет географическую привязку.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: сказала царю
  rationale: Глагол אָמַר обычно означает «сказать». Русская конструкция передаёт обращение женщины к царю, не добавляя отсутствующего в тексте содержания.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: пала лицом на землю
  rationale: 'Передан образ глубокого уничижения: женщина падает так, что её лицо обращено к земле. «Пала» соответствует достоинству повествовательного регистра.'
- source_word: וַתִּשְׁתָּחוּ
  choice: поклонилась
  rationale: Глагол обозначает поклон или простирание в знак почтения либо мольбы. «Поклонилась» понятно современному читателю и не приписывает действию исключительно богослужебного смысла.
- source_word: הוֹשִׁיעָה
  choice: спаси меня
  rationale: Повелительная форма от יָשַׁע выражает настоятельную просьбу о спасении или избавлении. Дополнение «меня» подразумевается контекстом и делает реплику естественной по-русски.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Слово употреблено как обращение. В русском языке звательная функция ясно выражается формой «царь» без добавления частицы «о».
