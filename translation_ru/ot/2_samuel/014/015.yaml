base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: ru
  text: 'И теперь я пришла сказать моему господину царю об этом деле, потому что народ напугал меня. Твоя служанка сказала: «Позволь мне поговорить с царём; может быть, царь исполнит просьбу своей служанки».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделает слово своей служанки», то есть исполнит её просьбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и связующий союз, и временной переход к объяснению причины её прихода.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: я пришла рассказать
  rationale: Передаёт приход с целью речи; женский род определяется говорящей. «Рассказать» естественно вводит излагаемое дело.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: моему господину царю
  rationale: Сохраняет царский титул и почтительное обращение в естественном русском порядке слов.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: об этом деле
  rationale: דבר здесь обозначает представленное царю дело, а не только отдельное слово.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: потому что народ напугал меня
  rationale: 'Пиэль глагола ירא имеет каузативное значение: народ вызвал у неё страх.'
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: И сказала твоя служанка
  rationale: Сохраняет придворное самоуничижительное обозначение говорящей и её женский род.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Позволь мне поговорить с царём
  rationale: Когортатив с נָא выражает вежливое намерение или просьбу; эта формулировка естественно передаёт волевой оттенок.
- source_word: אוּלַי
  choice: может быть
  rationale: Передаёт осторожную надежду без усиления уверенности.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: царь исполнит просьбу своей служанки
  rationale: Буквально речь идёт о том, что царь «сделает слово» служанки; по-русски смысл естественно передаётся как исполнение её просьбы.
