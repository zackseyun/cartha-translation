base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: ru
  text: 'Всякий раз, когда он стриг волосы на голове, — а делал он это из года в год, потому что они отягощали его, — он взвешивал состриженные волосы: двести шекелей по царской мере веса.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по царскому камню», то есть по царскому эталону веса.'
    reason: 'Культурно-лексическое пояснение: «камень» обозначает каменную гирю или иной материальный эталон веса.'
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: Когда он стриг волосы на голове
  rationale: Инфинитивная конструкция задаёт временное и повторяющееся обстоятельство. Глагол «стричь» естественно передаёт периодическое укорачивание волос, не подразумевая непременно бритья наголо; слово «волосы» эксплицировано по ближайшему контексту.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים אֲשֶׁר יְגַלֵּחַ
  choice: а стриг он их из года в год
  rationale: Идиома указывает на регулярно повторявшийся срок, вероятнее всего ежегодный. «Из года в год» естественно передаёт обычное повторяющееся действие, не перегружая фразу буквальным «по истечении дней».
- source_word: כִּי־כָבֵד עָלָיו
  choice: потому что они отягощали его
  rationale: Сохранён образ тяжести и тяготы. Множественное «они» естественно соотносится в русском тексте с волосами.
- source_word: וְגִלְּחוֹ וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: то взвешивал состриженные волосы
  rationale: Форма повествует об обычном действии при каждой стрижке. «Состриженные» ясно обозначает, что взвешивались уже срезанные волосы, и устраняет тяжеловесное повторение.
- source_word: מָאתַיִם שְׁקָלִים
  choice: двести шекелей
  rationale: Сохранена древняя единица веса без спорного пересчёта в современные единицы; здесь шекель обозначает именно меру массы.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: по царской мере веса
  rationale: 'Буквально «по царскому камню»: речь о каменной гире или эталоне, определявшем царский стандарт веса. Основной текст передаёт функцию выражения, а буквальный образ пояснён в сноске.'
