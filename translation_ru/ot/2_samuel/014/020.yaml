source:
  edition: WLC
  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: ru
  text: Чтобы придать делу иной вид[a], твой слуга Иоав сделал это. Но мой господин мудр, как мудр ангел Божий, и знает всё, что происходит в стране[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернуть лицо дела»; возможный смысл: представить дело иначе или повернуть его в другую сторону.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на земле». В данном контексте, вероятно, имеется в виду страна или царство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: Чтобы
  rationale: Инфинитивная конструкция выражает цель; «чтобы» естественно и точно передаёт целевое значение.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: придать делу иной вид
  rationale: Передаёт образное «повернуть лицо дела» как изменение того, в каком виде представлено или рассматривается дело, не подменяя его отсутствующей в еврейском тексте идеей хода событий.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: сделал это
  rationale: Естественная русская передача; избегает тяжёлого повтора слова «дело» при сохранении смысла.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Соответствует почтительной придворной форме самообозначения перед царём.
- source_word: וַאדֹנִי
  choice: Но мой господин
  rationale: Союз передан как мягко-противительный переход от объяснения поступка Иоава к похвале проницательности царя.
- source_word: חָכָם כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: мудр, как мудр ангел Божий
  rationale: Сохраняет явное сравнение и естественно звучит по-русски; сочетание «ангел Божий» не вынуждает видеть здесь одного определённого ангела.
- source_word: לָדַעַת
  choice: и знает
  rationale: В данном контексте инфинитив обозначает проявление или результат мудрости; личная форма даёт естественное русское предложение без изменения смысла.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: всё, что происходит в стране
  rationale: В контексте царского управления речь, вероятнее всего, обо всех делах в пределах страны; глагол «происходит» естественно передаёт эллиптическое «всё, что в стране».
theological_decisions:
- issue: Смысл сравнения с ангелом Божьим
  choice: Придворное сравнение, восхваляющее необыкновенную мудрость и осведомлённость Давида
  alternative: Утверждение о божественной природе или всеведении царя
  rationale: Еврейский текст содержит сравнение, а не отождествление; перевод сохраняет возвышенность выражения, не усиливая его до онтологического утверждения.
- issue: Определённость выражения מַלְאַךְ הָאֱלֹהִים
  choice: ангел Божий
  alternative: Ангел Божий как конкретная, заранее известная фигура
  rationale: Конструктивная цепочка сама по себе не требует в русском контексте указания на единственного определённого ангела; выбранная формулировка сохраняет возможную обобщённость сравнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным придворным тоном. Формы «твой слуга» и «мой господин» сохраняют почтительность речи женщины перед царём; идиома передана понятно, но её образ и неоднозначность отмечены в сноске.
