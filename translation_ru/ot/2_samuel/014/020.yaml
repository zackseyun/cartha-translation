  source_fidelity: Перевод точно передаёт целевое לְבַעֲבוּר, придворное самоназвание «твой слуга», действие Иоава и хвалебное сравнение мудрости царя с мудростью ангела Божьего. «Придать делу иной вид» удачно передаёт смысл идиомы סַבֵּב אֶת־פְּנֵי הַדָּבָר, не сводя её к изменению «хода» дела. «Всё, что происходит в стране» является уместной контекстуальной передачей כָּל אֲשֶׁר בָּאָרֶץ; сноска сохраняет вариант «на земле».
