base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: ru
  text: Авессалом послал за Иоавом, чтобы тот отправил его к царю, но Иоав не захотел прийти к нему.[a] Авессалом снова послал за ним — во второй раз, — но тот не захотел прийти к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отказался прийти»; букв. «не пожелал прийти».'
    reason: Лексема אָבָה обозначает желание или согласие; в данном контексте возможен более сильный перевод «отказался», однако основной текст сохраняет более буквальную формулировку.
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: Авессалом послал за Иоавом
  rationale: Хотя שׁלח буквально означает «послать», сочетание с אֶל־יוֹאָב и последующим указанием цели передаёт посылку к Иоаву с просьбой прийти; русское «послал за Иоавом» естественно выражает этот смысл.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: чтобы тот отправил его к царю
  rationale: Инфинитив выражает цель обращения к Иоаву. Местоимение «тот» ясно указывает на Иоава, а «его» сохраняет местоименную форму оригинала, где по контексту имеется в виду Авессалом.
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: но Иоав не захотел прийти к нему
  rationale: אָבָה означает «быть согласным, желать». Формулировка «не захотел» сохраняет буквальный смысл и не усиливает его до однозначного «отказался». Имя «Иоав» добавлено для устранения неестественной для русского языка местоименной двусмысленности; «к нему» сохраняет направление, выраженное אֵלָיו.
- source_word: עוֹד שֵׁנִית
  choice: снова послал за ним — во второй раз
  rationale: 'Переданы оба элемента: עוֹד («снова, ещё») и שֵׁנִית («во второй раз»). Тире делает присущую еврейскому тексту смысловую избыточность естественной в современном русском повествовании.'
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: послал ... но ... не захотел ... снова послал ... но ... не захотел
  rationale: Сохранены повтор и контраст, задающие ритм еврейского повествования.
