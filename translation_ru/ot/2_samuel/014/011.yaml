base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: ru
  text: 'Тогда она сказала: «Пусть царь вспомнит о Яхве, твоём Боге, чтобы кровный мститель не продолжал губить[a] и чтобы моего сына не погубили». Царь ответил: «Жив Яхве: ни один волос с головы твоего сына не упадёт на землю[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейский оборот буквально связан с «умножением» разрушительных действий; в контексте он может означать как их продолжение, так и усиление.
    reason: lexical_alternative
  - marker: b
    text: 'Древнееврейский образ, означающий обещание полной защиты: сын не понесёт даже малейшего вреда.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: Пусть царь вспомнит
  rationale: Юссив с частицей נָא выражает почтительную просьбу; форма «пусть» сохраняет её просительный, а не просто будущий смысл.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: о Яхве, твоём Боге
  rationale: Имя יהוה передано как «Яхве», а местоименное определение сохранено буквально как обращение к ответственности царя перед своим Богом.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: чтобы кровный мститель больше не умножал гибель
  rationale: Оборот מן с инфинитивом Hiphil от רבה выражает удержание от умножения или продолжения разрушительных действий. Формулировка сохраняет образ нарастающей гибели и юридический термин.
- source_word: גֹּאֵל הַדָּם
  choice: кровный мститель
  rationale: Это устойчивое обозначение ближайшего родственника, на которого возлагалась месть за пролитую кровь.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: и чтобы моего сына не погубили
  rationale: Неопределённое множественное число глагола сохранено русской неопределённо-личной конструкцией без искусственного уточнения действующих лиц.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Краткая торжественная формула точно передаёт древнееврейскую клятву.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: ни один волос с головы твоего сына не упадёт на землю
  rationale: После клятвенной формулы אִם имеет силу решительного отрицания; русский библейский оборот естественно выражает обещание полной защиты.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; личное имя сохранено, а не заменено титулом.
- issue: Степень обещанной царём защиты
  choice: решительное заверение в полной неприкосновенности сына
  alternative: 'буквальное условное высказывание: «если упадёт волос…»'
  rationale: Вслед за формулой клятвы частица אִם служит клятвенным отрицанием. Образ волоса, не падающего на землю, оставлен в тексте, а его смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Юридический термин «кровный мститель» сохранён; трудный древнееврейский оборот передан ясно, но его смысловая неоднозначность отмечена в сноске. Формула «Жив Яхве» оставлена краткой и торжественной.
