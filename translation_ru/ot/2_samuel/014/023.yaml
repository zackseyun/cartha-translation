  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: ru
  text: Иоав встал, пошёл в Гешур и привёл[a] Авессалома в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернул Авессалома в Иерусалим». Из контекста ясно, что Авессалом возвращался из изгнания, однако значение «обратно» не выражено в самом еврейском глаголе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: 'Глагол קום в повествовательной последовательности буквально передаёт начало действия: Иоав встал, чтобы исполнить поручение. Такой перевод сохраняет образ и торжественно-повествовательный ритм, не сводя два еврейских глагола к одному «отправился».'
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное повествовательное значение הלך — «идти, пойти». Форма продолжает последовательность событий без добавочного оттенка длительного путешествия.
- source_word: גְּשׁוּרָה
  choice: в Гешур
  rationale: Направительный суффикс -ה указывает на движение к Гешуру; по-русски это естественно выражается предлогом «в».
- source_word: וַיָּבֵא
  choice: привёл
  rationale: Каузативная форма от בוא означает «привести». Контекст допускает смысл возвращения из изгнания, но значение «обратно» не выражено самим глаголом и вынесено в примечание.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Авессалома
  rationale: Передано традиционной русской формой личного имени; показатель прямого дополнения отдельно не переводится.
- source_word: יְרוּשָׁלִָם
  choice: в Иерусалим
  rationale: При русском глаголе «привёл» название города естественно оформляется как обозначение направления с предлогом «в».
- source_word: וַ
  choice: и
  rationale: Повторяющийся повествовательный союз связывает действия в последовательную цепь; русское «и» сохраняет эту связь без излишнего уточнения причинности.
