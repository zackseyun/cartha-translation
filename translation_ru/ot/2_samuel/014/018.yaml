  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: ru
  text: 'Тогда царь ответил женщине: «Прошу, не скрывай от меня ничего из того, о чём я тебя спрашиваю». Женщина сказала: «Говори, господин мой царь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: В еврейском употреблена обычная парная формула «ответил и сказал»; в современном русском повествовании одного глагола «ответил» достаточно для естественной передачи реплики без потери смысла.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי דָּבָר
  choice: Прошу, не скрывай от меня ничего
  rationale: Частица נָא придаёт запрету просительный оттенок; после отрицания דָּבָר естественно передаётся русским «ничего».
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: из того, о чём я тебя спрошу
  rationale: В данном контексте царь предваряет следующий вопрос. Будущее время по-русски ясно передаёт непосредственное намерение спросить, тогда как еврейское причастие допускает актуально-настоящее прочтение.
- source_word: יְדַבֶּר נָא אֲדֹנִי הַמֶּלֶךְ
  choice: Говори, господин мой царь
  rationale: Третье лицо в еврейской почтительной формуле естественно преобразовано в русское прямое обращение; «господин мой царь» сохраняет придворную учтивость.
