lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: прожил
  rationale: Глагол ישׁב может означать «сидеть, жить, оставаться». В сочетании с указанием места и длительности «прожил» естественно передаёт продолжительное пребывание.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Традиционная русская форма библейского личного имени.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямое обозначение места с принятой русской формой топонима.
- source_word: שְׁנָתַיִם יָמִים
  choice: два полных года
  rationale: Сочетание буквально имеет вид «два года, дни»; слово יָמִים подчёркивает полную меру названного срока. Перевод «два полных года» передаёт эту идиоматическую силу.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: но лица царя не видел
  rationale: Сохранён конкретный древнееврейский образ «видеть лицо царя», означающий личный доступ к царю или аудиенцию. Союз «но» естественно выражает контраст в русском контексте.
