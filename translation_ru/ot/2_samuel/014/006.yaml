lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: у твоей рабы
  rationale: שִׁפְחָה обозначает рабыню или служанку, а здесь служит почтительным самоназванием женщины перед царём. Русское «твоя раба» естественно передаёт и женский род, и её смиренное положение.
- source_word: שְׁנֵי בָנִים
  choice: два сына
  rationale: בָנִים здесь означает именно сыновей, а не детей вообще.
- source_word: וַיִּנָּצוּ שְׁנֵיהֶם
  choice: они подрались
  rationale: Глагол נצה в данном контексте обозначает физическую схватку; «подрались» ясно и естественно передаёт это значение.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое и естественное соответствие еврейскому обозначению места.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: и некому было разнять их
  rationale: Буквально מַצִּיל — «избавляющий, спасающий», но в контексте драки речь идёт о том, кто мог бы вмешаться и разнять братьев.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת־הָאֶחָד
  choice: один ударил другого
  rationale: נכה означает «ударить, поразить»; перевод сохраняет сам удар отдельно от его смертельного исхода.
- source_word: וַיָּמֶת אֹתוֹ
  choice: и убил его
  rationale: 'Форма от מות с прямым дополнением имеет каузативный смысл: один стал причиной смерти другого.'
