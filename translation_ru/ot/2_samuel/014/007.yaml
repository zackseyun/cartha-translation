source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: ru
  text: 'И вот[a], весь род восстал против твоей рабы и говорит: «Выдай того, кто поразил своего брата, чтобы мы предали его смерти за жизнь брата, которого он убил, и уничтожили также наследника». Так они погасят оставшийся у меня тлеющий уголёк[b] и не оставят моему мужу ни имени, ни потомка на земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посмотри». Частица привлекает внимание царя к внезапно возникшей угрозе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально — образ оставшегося живого угля: единственной надежды на продолжение рода.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательное и повествовательно-эмфатическое значение частицы естественным современным русским оборотом.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: весь род
  rationale: В контексте имеется в виду расширенная родственная группа, а не только ближайшая семья; «род» точно и понятно передаёт этот смысл.
- source_word: שִׁפְחָתֶךָ
  choice: твоей рабы
  rationale: Буквально это «твоя рабыня/служанка» — смиренное женское самообозначение при обращении к царю. Форма «рабы» сохраняет пол говорящей и уместный библейский регистр.
- source_word: קָמָה ... עַל
  choice: восстал против
  rationale: Идиома обозначает враждебное выступление, а не простое вставание.
- source_word: תְּנִי
  choice: Выдай
  rationale: В судебно-родовом контексте требуется передать виновного для расправы; «выдай» естественно выражает принудительную передачу.
- source_word: מַכֵּה אָחִיו
  choice: того, кто поразил своего брата
  rationale: 'Сохраняется более широкое значение причастия от נכה и последовательность исходного текста: лишь далее прямо сказано, что брат был убит.'
- source_word: וּנְמִתֵהוּ
  choice: и мы предадим его смерти
  rationale: Передаёт намерение убить с уместным для требования оттенком судебной расправы, не вводя технического понятия официальной казни.
- source_word: בְּנֶפֶשׁ אָחִיו
  choice: за жизнь брата
  rationale: Сохраняет правовую формулу воздаяния жизнью за жизнь.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: и уничтожим также наследника
  rationale: Передаёт дополнительное намерение родственников устранить единственного оставшегося наследника, сохраняя суровую лексику оригинала.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: Так они погасят оставшийся у меня тлеющий уголь
  rationale: Метафора последнего живого угля сохранена, а «тлеющий» ясно даёт понять, что уголь ещё не погас и может поддержать огонь.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: ни имени, ни потомка
  rationale: «Имя» сохраняет культурно значимый образ памяти и продолжения рода, а «потомок» конкретизирует שְׁאֵרִית в данном контексте как оставшегося представителя семейной линии.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на земле
  rationale: Естественный русский эквивалент устойчивого древнееврейского выражения; буквальное «на лице земли» здесь звучало бы неестественно.
theological_decisions:
- issue: 'Характер требования родственников: возмездие или формальная казнь'
  choice: «предадим его смерти за жизнь брата»
  alternative: «казним его за убийство брата»
  rationale: Исходный текст выражает принцип воздаяния жизнью за жизнь, но не уточняет формальную судебную процедуру; перевод не должен превращать родовую расправу в официальную казнь.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи перед царём. Сохранены ключевые образы оригинала — восстание рода, жизнь за жизнь, наследник и последний тлеющий уголь; синтаксис слегка сглажен ради ясности без снятия правовой и нравственной напряжённости.
