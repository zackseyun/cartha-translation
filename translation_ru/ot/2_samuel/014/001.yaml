  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: ru
  text: Иоав, сын Саруи, знал, что сердце царя обращено к Авессалому[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царь тосковал по Авессалому». Еврейское выражение кратко и может означать в более общем смысле: «сердце царя было устремлено к Авессалому». Возможен и противоположный перевод: «сердце царя было против Авессалома», хотя последующий контекст скорее указывает на положительное расположение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: знал
  rationale: Форма wayyiqtol от ידע продолжает повествование. Простое «знал» естественно передаёт значение без добавления отсутствующего в еврейском тексте явного временного наречия.
- source_word: יוֹאָב בֶּן צְרֻיָּה
  choice: Иоав, сын Саруи
  rationale: Имена переданы в принятой русской библейской форме; конструкция родства выражена естественным русским приложением.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что было известно Иоаву.
- source_word: לֵב הַמֶּלֶךְ
  choice: сердце царя
  rationale: Сохранён еврейский образ сердца как внутренней расположенности, воли и чувства, без сужающей замены на «мысли» или «намерения».
- source_word: עַל
  choice: обращено к
  rationale: Предлог в кратком выражении с «сердцем» допускает разные оттенки. «Обращено к» сохраняет направленность и не сводит её однозначно к тоске, благосклонности либо враждебности.
- source_word: אַבְשָׁלוֹם
  choice: Авессалому
  rationale: Использована традиционная русская форма имени; дательный падеж обусловлен сочетанием «обращено к».
theological_decisions:
- issue: Неоднозначность отношения царя к Авессалому
  choice: сердце царя обращено к Авессалому
  alternative: царь тосковал по Авессалому; сердце царя было против Авессалома
  rationale: Еврейское выражение предельно кратко и прямо не определяет характер расположения Давида. Основной текст сохраняет эту напряжённость, а примечание приводит более определённые варианты; последующий контекст скорее указывает на положительную направленность.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого библейского образа. Формулировка «сердце царя обращено к» понятна, звучит достойно и намеренно не снимает неоднозначность оригинала.
