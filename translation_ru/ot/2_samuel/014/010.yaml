lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Стандартное соответствие מֶלֶךְ; определённость естественно передаётся русским контекстом без артикля.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: того, кто заговорит с тобой об этом
  rationale: Субстантивированное причастие обозначает человека, который станет обращаться к женщине; будущее «заговорит» естественно в данном распоряжении. «Об этом» проясняет подразумеваемую связь с её делом, не уточняя содержание угрозы.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: приведи ко мне
  rationale: Порода hифиль глагола בוא имеет каузативное значение «привести»; соединительный союз в прямой речи естественно не выражен отдельно.
- source_word: לֹא יֹסִיף עוֹד
  choice: больше не
  rationale: Сочетание יסף с עוד указывает на прекращение или неповторение действия; современное русское «больше не» кратко и точно передаёт этот смысл.
- source_word: לָגַעַת בָּךְ
  choice: тебя не тронет
  rationale: Сохранено основное значение נגע «касаться, трогать»; в контексте защиты выражение допускает смысл враждебного воздействия или причинения вреда.
