    rationale: Шׁוּט — повелительная форма единственного числа, обращённая к Иоаву, тогда как וּפִקְדוּ имеет множественное число. Сочетание «Пройди ... и пересчитайте» формально отражает текст, но в русском выглядит как непреднамеренная грамматическая ошибка. «Обойди ... и проведите перепись» яснее сохраняет исходную смену адресата/исполнителей.
