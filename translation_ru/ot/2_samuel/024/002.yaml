base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: ru
  text: 'И сказал царь Иоаву, военачальнику, который был с ним: «Обойди же все колена Израиля — от Дана до Вирсавии — и проведите перепись[a] народа, чтобы я знал численность народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пересчитайте» или «зарегистрируйте». Еврейский глагол может означать подсчёт или постановку людей на учёт, иногда в военном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное русское «И сказал» здесь естественно и сохраняет связь с предыдущим контекстом.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Передаёт употреблённый в еврейском тексте титул, не заменяя его контекстуально подразумеваемым именем Давида.
- source_word: שַׂר הַחַיִל
  choice: военачальник
  rationale: Краткое современное обозначение начальника войска; избегает архаичного «начальник воинства».
- source_word: אֲשֶׁר אִתּוֹ
  choice: который был с ним
  rationale: Прямо передаёт относительное придаточное и не добавляет отсутствующего в тексте указания места.
- source_word: שׁוּט נָא
  choice: Пройди
  rationale: שׁוּט обозначает передвижение по территории. Частица נָא смягчает побуждение, но в русском царском распоряжении отдельное «пожалуйста» звучало бы неестественно; повелительная форма в контексте не нуждается в усилении.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: по всем коленам Израиля
  rationale: Предлог «по» естественно сочетается с глаголом движения и передаёт охват всех племенных областей.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: от Дана до Вирсавии
  rationale: Сохраняет меризм, обозначающий всю протяжённость страны; «Вирсавия» — укоренившаяся русская форма топонима.
- source_word: וּפִקְדוּ
  choice: и пересчитайте
  rationale: Форма множественного числа показывает, что Иоав должен выполнить поручение вместе с подчинёнными. «Пересчитайте» ясно выражает проведение переписи, а возможный оттенок регистрации или военного учёта отмечен в сноске.
- source_word: אֶת הָעָם
  choice: народ
  rationale: עָם означает народ и не должно без достаточных оснований сужаться до воинов или войска.
- source_word: וְיָדַעְתִּי
  choice: чтобы мне узнать
  rationale: В данном повелительном контексте выражает цель распоряжения; русская конструкция сохраняет первое лицо и звучит естественно.
- source_word: מִסְפַּר הָעָם
  choice: его численность
  rationale: Местоимение устраняет тяжеловесный повтор «народа» в русском, сохраняя точный смысл — число людей.
theological_decisions:
- issue: Объём значения הָעָם в военно-административном контексте
  choice: народ
  alternative: воины; войско; способные к войне мужчины
  rationale: Хотя распоряжение дано военачальнику и перепись могла иметь военное назначение, исходный текст употребляет широкое עָם, а не специальное обозначение воинов. Перевод не сужает референт сверх сказанного.
- issue: Значение פקד при проведении переписи
  choice: пересчитайте с примечанием о возможной регистрации или смотре
  alternative: зарегистрируйте; проведите смотр
  rationale: Корень допускает учёт, регистрацию и в некоторых контекстах военный смотр. Основной текст ясно передаёт непосредственную цель — установить численность, а сноска сохраняет более специальный оттенок.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис остаётся прозрачным; архаизмы вроде «воинство» и искусственное «пожалуйста» в царском приказе не используются.
