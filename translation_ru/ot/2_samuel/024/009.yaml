base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: ru
  text: 'Иоав сообщил царю число народа по переписи: в Израиле было восемьсот тысяч отважных мужчин, обнажавших меч[a], а мужчин Иуды — пятьсот тысяч.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельном отрывке, 1 Паралипоменон 21:5, указаны другие числа: 1 100 000 для Израиля и 470 000 для Иуды. Здесь перевод следует еврейскому тексту 2 Царств и не согласовывает эти числа.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: число пересчитанного народа
  rationale: Сочетание обозначает итог переписи или воинского учёта народа. Эта формулировка сохраняет оба смысловых компонента — подсчёт и полученное число — и естественно звучит по-русски.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: в Израиле было
  rationale: Русская экзистенциальная конструкция естественно вводит итоговое число, передавая собирательное значение названия «Израиль».
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: восемьсот тысяч
  rationale: Прямая передача количественного числительного.
- source_word: אִישׁ חַיִל
  choice: доблестных воинов
  rationale: В контексте воинского учёта выражение обозначает сильных, способных к бою мужчин; «доблестные воины» сохраняет военный оттенок חַיִל и не сводит его лишь к физической пригодности.
- source_word: שֹׁלֵף חֶרֶב
  choice: обнажавших меч
  rationale: Буквальный воинский образ «вынимать/обнажать меч» сохранён; причастный оборот ясно характеризует мужчин как способных вступить в бой.
- source_word: וְאִישׁ יְהוּדָה
  choice: а в Иудее
  rationale: Собирательное אִישׁ יְהוּדָה указывает на мужчин Иудеи. В русском контексте конструкция «а в Иудее» естественно продолжает сопоставление итогов, тогда как слово «человек» выражено в конце фразы.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: пятьсот тысяч человек
  rationale: Сохраняется явно выраженное в еврейском тексте אִישׁ и обеспечивается естественная русская форма после числительного.
theological_decisions:
- issue: Расхождение чисел с параллельным местом 1 Паралипоменон 21:5
  choice: 'Передать масоретский текст 2 Царств: восемьсот тысяч в Израиле и пятьсот тысяч в Иудее.'
  alternative: Согласовать числа с 1 Паралипоменон либо объяснить их различным составом учтённых войск.
  rationale: Перевод не должен устранять текстовое расхождение посредством недоказанной гармонизации. Возможные объяснения следует отделять от основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Военная образность исходного текста сохранена; синтаксис слегка перестроен ради ясности и естественности.
