base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: ru
  text: 'И сказал Арауна: «Почему господин мой, царь, пришёл к своему слуге[a]?» Давид ответил: «Чтобы купить у тебя гумно и построить жертвенник Яхве, чтобы прекратилось бедствие, поразившее народ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его слуге». Так Арауна почтительно говорит о себе в третьем лице; по смыслу: «твоему слуге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: зачем
  rationale: Вопрос относится к цели прихода царя; в данном разговорном контексте «зачем» естественнее русского «почему» и согласуется с последующим ответом Давида, выражающим цель.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой, царь
  rationale: Сохраняет почтительное придворное обращение и оба компонента еврейского выражения, оставаясь понятным на современном русском.
- source_word: עַבְדּוֹ
  choice: своему слуге
  rationale: 'Буквально стоит третье лицо: «его/своему слуге»; это формальная придворная самореференция Арауны. Местоимение «своему» ясно соотносится с царём и сохраняет грамматическую форму.'
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: купить у тебя гумно
  rationale: «Купить у тебя» естественно передаёт сделку, а «гумно» — традиционный и точный русский термин для площадки, где молотят зерно.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: построить жертвенник
  rationale: Прямо и естественно передаёт инфинитив цели.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: чтобы прекратилось поражение народа
  rationale: 'Нифаль выражает желаемый результат: бедствие должно прекратиться. «Поражение народа» сохраняет представление о нанесённом народу смертоносном ударе, не ограничивая значение исключительно болезнью.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон — личное имя Бога; «Яхве» непосредственно передаёт его как имя, не заменяя титулом.
- issue: Характер מַגֵּפָה
  choice: поражение
  alternative: моровая язва
  rationale: Еврейское слово может обозначать мор, бедствие или смертоносный удар. «Поражение» сохраняет более широкий смысл и связь с тем, что народ поражён Богом, не уточняя сверх текста механизм бедствия.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямой речи сохранён, но сделан естественным для русского читателя. «Гумно» оставлено как точный культурно-исторический термин.
