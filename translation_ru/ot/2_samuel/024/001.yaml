base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: ru
  text: 'И снова гнев Яхве воспылал на Израиль[a], и Он подстрекнул Давида против них, сказав: «Пойди[b], пересчитай Израиль и Иуду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В 1 Паралипоменон 21:1 сказано, что против Израиля восстал сатана и побудил Давида. Здесь основной текст следует наиболее естественному пониманию подлежащего в еврейском тексте 2 Царств и сохраняет напряжение между двумя повествованиями, не пытаясь искусственно согласовать их.
    reason: cross_reference
  - marker: b
    text: 'Или: «сосчитай»; возможный смысл: «проведи перепись Израиля и Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: И снова
  rationale: В сочетании с последующим описанием гнева глагол указывает на повторное действие; «И снова» естественно передаёт возобновление происходящего.
- source_word: אַף יְהוָה לַחֲרוֹת
  choice: гнев Яхве воспылал
  rationale: Еврейское выражение буквально рисует гнев как разгорающийся жар. «Воспылал» сохраняет метафору и соответствует достоинству повествовательного стиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: 'В сочетании с глаголом гнева предлог обозначает направленность гнева против Израиля; по-русски естественно: «гнев воспылал на Израиль».'
- source_word: וַיָּסֶת
  choice: побудил
  rationale: Порода гифиль глагола סות выражает побуждение или подстрекательство. «Побудил» ясно передаёт причинное воздействие, не уточняя его способ.
- source_word: בָּהֶם
  choice: выступить против них
  rationale: Фраза после «побудил Давида» трудна; в контексте она наиболее естественно указывает на действие Давида против народа. Добавленное «выступить» необходимо для связного современного русского синтаксиса, а «против них» сохраняет направленность еврейского выражения.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Обычная формула введения прямой речи; деепричастие естественно связывает её с предшествующим действием.
- source_word: לֵךְ
  choice: Пойди
  rationale: Прямо передаёт повелительную форму глагола הלך.
- source_word: מְנֵה
  choice: пересчитай
  rationale: Глагол означает считать или исчислять. «Пересчитай» кратко и естественно выражает требование определить численность народа, не разворачивая его сразу в толкование «проведи перепись».
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: Израиль и Иуду
  rationale: Сохранены два названия, различающие Израиль и Иуду, без пояснительного расширения.
theological_decisions:
- issue: Кто побудил Давида в сопоставлении с 1 Паралипоменон 21:1
  choice: Он побудил Давида
  alternative: Некто побудил Давида; сатана побудил Давида
  rationale: Наиболее естественный грамматический субъект וַיָּסֶת — ранее названный Яхве. Основной текст следует синтаксису 2 Царств и не согласовывает его искусственно с параллельным местом, где назван сатана; напряжение между свидетельствами сохраняется.
- issue: Значение трудного оборота בָּהֶם
  choice: выступить против них
  alternative: побудил Давида из-за них; побудил Давида в отношении них
  rationale: Предлог допускает некоторую смысловую неоднозначность. Контекст последующего суда поддерживает направленность действия против народа, но перевод не приписывает Давиду более конкретного намерения, чем сообщает текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Воспылал» сохраняет образность оригинала, тогда как остальная фраза построена ясно и естественно. Местоимение «Он» написано с прописной буквы по принятому русскому благоговейному употреблению, не меняя смысла исходного текста.
