base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: ru
  text: Они пришли в Галаад и в землю Тахтим-Ходши[a], затем пришли в Дан-Яан[b] и направились к Сидону, обходя окрестности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «Тахтим-Ходши» неясно. Некоторые исправляют или истолковывают текст как «земля хеттеев у Кадеса» либо сходным образом, однако смысл и точное отождествление этой местности остаются неизвестными.
    reason: alternative_reading
  - marker: b
    text: «Дан-Яан», вероятно, название местности; её точное местонахождение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: они пришли
  rationale: Форма wayyiqtol от בוא последовательно описывает передвижение; повтор глагола сохраняет поэтапный характер маршрута.
- source_word: הַגִּלְעָדָה
  choice: в Галаад
  rationale: Направительное окончание указывает на движение в сторону области; по-русски естественно передать предлогом «в».
- source_word: אֶרֶץ
  choice: землю
  rationale: Здесь слово обозначает географическую область, а не землю вообще.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Тахтим-Ходши
  rationale: Выражение текстологически и географически неясно; транслитерация не подменяет еврейский текст предположительной реконструкцией.
- source_word: דָּנָה יַּעַן
  choice: в Дан-Яан
  rationale: Сочетание, вероятнее всего, является названием места; направительное окончание передано русским предлогом «в».
- source_word: וְסָבִיב אֶל צִידוֹן
  choice: и обошли окрестности до Сидона
  rationale: סביב передаёт движение вокруг или по окружающей местности, а אֶל־צִידוֹן указывает направление; развернутая русская формулировка делает краткую маршрутную запись понятной без устранения её географической неопределённости.
