revisions:
- from: 'В тот день Гад пришёл к Давиду и сказал ему: «Поднимись и воздвигни Яхве[a] жертвенник на гумне Арауны-иевусея[b]».'
  to: 'В тот день Гад пришёл к Давиду и сказал ему: «Поднимись и воздвигни жертвенник для Яхве[a] на гумне Арауны, иевусея[b]».'
  rationale: Правка делает посвятительное значение לְ ясным и естественным для современного литературного русского, не меняя смысла. Этническое определение оформлено как приложение. Сноска сохраняет более буквальную передачу еврейского дательного отношения, а сноска к имени фиксирует форму в параллельном тексте.
