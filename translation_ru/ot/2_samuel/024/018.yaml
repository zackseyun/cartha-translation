    rationale: Он формально передаёт לַיהוָה, но в современном русском воспринимается как намеренный архаизм и менее прозрачен, чем посвящительный оборот «жертвенник для Яхве».
  - severity: low
    issue: Дефис в форме «Арауны-иевусея».
    rationale: В данном случае «иевусея» — этническое приложение к имени, а не часть составного личного имени; запятая соответствует русской пунктуации и яснее передаёт еврейское определение.
