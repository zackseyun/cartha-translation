base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: ru
  text: 'В тот день Гад пришёл к Давиду и сказал ему: «Поднимись и воздвигни жертвенник для Яхве[a] на гумне Арауны, иевусея[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воздвигни Яхве жертвенник».'
    reason: lexical_alternative
  - marker: b
    text: В 1 Пар. 21:18 это имя передано как Орна.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычное повествовательное значение глагола בוא; направление к Давиду естественно передаётся глаголом «прийти».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямо и естественно передаёт указанное в еврейском тексте определённое время.
- source_word: עֲלֵה
  choice: поднимись
  rationale: Сохраняет направительное значение повелительной формы עלה — «подняться, взойти».
- source_word: הָקֵם
  choice: воздвигни
  rationale: Каузативная форма קום означает «поставить, воздвигнуть»; в сочетании с жертвенником «воздвигни» точно и уместно по регистру.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Устойчивый русский эквивалент для מזבח.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Дательный падеж передаёт посвящение или адресата воздвигаемого жертвенника, а личное имя сохраняет прямое употребление יהוה.
- source_word: בְּגֹרֶן
  choice: на гумне
  rationale: Гумно — площадка для молотьбы; предлог «на» естественно обозначает место возведения жертвенника.
- source_word: ארניה
  choice: Арауна
  rationale: Передаёт форму имени в книге Самуила; параллельное место в Паралипоменоне использует форму Орна.
- source_word: הַיְבֻסִי
  choice: иевусей
  rationale: Традиционное и понятное русское обозначение принадлежности к иевусеям.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение ל при יהוה
  choice: дательный оборот «воздвигни Яхве жертвенник»
  alternative: «воздвигни жертвенник для Яхве»
  rationale: Дательный оборот по-русски естественно выражает посвящение жертвенника и не сужает функцию предлога ל до единственного оттенка.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Слово «гумно» сохраняет точное культурно-историческое значение, а синтаксис остаётся ясным для обычного читателя.
