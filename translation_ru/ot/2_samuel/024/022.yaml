base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: ru
  text: 'Тогда Аравна сказал Давиду: «Пусть мой господин, царь, возьмёт и принесёт во всесожжение то, что ему угодно.[a] Вот волы для всесожжения, а молотильные сани и принадлежности волов[b] — на дрова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что хорошо в его глазах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воловья упряжь». Древнееврейское выражение имеет широкое значение и может обозначать различное деревянное снаряжение волов, предназначенное здесь на топливо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: пусть … возьмёт и принесёт во всесожжение
  rationale: Форма выражает почтительное разрешение или приглашение; глагол עלה в жертвенном контексте передан с сохранением связи со следующим עֹלָה.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохранено почтительное придворное обращение, естественное для литературного русского языка.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: то, что ему угодно
  rationale: Естественно передаёт древнееврейскую идиому «доброе в его глазах» и сохраняет переход к третьему лицу при обращении к царю.
- source_word: רְאֵה
  choice: вот
  rationale: В данном контексте это естественный русский указательный маркер, привлекающий внимание к предложенным животным и предметам.
- source_word: הַבָּקָר
  choice: волы
  rationale: Контекст молотьбы указывает на тягловый скот; «волы» конкретнее общего «скот».
- source_word: לָעֹלָה
  choice: для всесожжения
  rationale: Устоявшееся обозначение жертвы, полностью сжигаемой на жертвеннике; конструкция не требует добавления артикля, отсутствующего в русском.
- source_word: הַמֹּרִגִּים
  choice: молотильные сани
  rationale: מורג обозначает деревянное приспособление типа доски или саней, применявшееся для молотьбы.
- source_word: כְלֵי הַבָּקָר
  choice: воловья упряжь
  rationale: כְּלִי имеет широкое значение «снаряжение, принадлежности»; «упряжь» понятно в контексте тягловых волов, но примечание сохраняет более широкую возможность.
- source_word: לָעֵצִים
  choice: на дрова
  rationale: Ясно передаёт предназначение деревянных орудий как топлива для жертвы.
