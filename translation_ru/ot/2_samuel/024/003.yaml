base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: ru
  text: 'Но Иоав сказал царю: «Пусть Яхве, твой Бог, умножит народ в сто раз против нынешнего числа, и пусть глаза моего господина царя увидят это[a]. Но почему мой господин царь желает этого?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и глаза моего господина царя видят». В еврейском тексте дополнение не названо; подразумевается, что царь увидит такое умножение народа.'
    reason: Сохранение невыраженного объекта при естественном русском построении фразы.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Иоав сказал
  rationale: Последовательная форма продвигает повествование, однако ответ Иоава противопоставлен повелению царя, поэтому контекстуально уместно «но».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму, присутствующую в еврейском тексте, без замены титулом.
- source_word: וְיוֹסֵף
  choice: пусть … умножит
  rationale: Форма выражает пожелание; «умножит» естественно сочетается с дальнейшим указанием «во сто раз».
- source_word: אֶל־הָעָם כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: народ во сто раз
  rationale: Идиоматическое сочетание означает увеличение нынешней численности народа в сто раз; по-русски это передаётся ясно и без воспроизведения неестественной буквальной конструкции.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: и пусть глаза моего господина царя увидят это
  rationale: Сохранён образ «глаз» и пожелательный смысл в контексте. Дополнение «это» подразумевается, но прямо в еврейском тексте не названо, что отмечено сноской.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: желает этого
  rationale: חפץ обозначает желание или расположение к чему-либо; здесь речь о желании провести исчисление. Краткое «этого» естественно отсылает к царскому замыслу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное Божье имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Объект при глаголе «увидят»
  choice: «это» в основном тексте с пояснением в сноске
  alternative: оставить глагол без объекта или передать «увидят их»
  rationale: 'Еврейский текст не выражает объект явно. Русская фраза требует естественного дополнения, но сноска сохраняет подлинную неоднозначность: можно подразумевать само умножение либо умножившийся народ.'
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Формула «мой господин царь» сохранена как почтительное обращение; синтаксис упрощён лишь там, где буквальное воспроизведение еврейской идиомы звучало бы неестественно.
