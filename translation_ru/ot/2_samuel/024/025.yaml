source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: ru
  text: Там Давид построил жертвенник Яхве и принёс всесожжения и мирные жертвы[a]. Тогда Яхве внял мольбе за землю[b], и язва отступила от Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: Слово שְׁלָמִים обозначает жертвы, связанные с миром, благополучием и общением; один русский эквивалент не передаёт всего диапазона.
  - marker: b
    text: 'Буквально: «Яхве внял земле»; еврейское выражение означает, что Он благосклонно ответил на мольбу за землю или ради неё.'
    reason: Сноска сохраняет необычную конструкцию оригинала и поясняет подразумеваемое глаголом прошение.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד
  choice: Там Давид построил
  rationale: Сохраняет порядок и повествовательную простоту еврейского текста; שָׁם отсылает к гумну Орны.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: жертвенник Яхве
  rationale: «Жертвенник» — точный традиционный эквивалент; дательный оттенок ל естественно передан русской конструкцией посвящения.
- source_word: וַיַּעַל עֹלוֹת
  choice: принёс всесожжения
  rationale: Русское «принести жертву» естественно передаёт культовое значение עלה; «всесожжения» сохраняет название данного вида жертв.
- source_word: וּשְׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшийся и достаточно понятный русский эквивалент названия жертв; возможный смысл общения отмечен в сноске.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Яхве внял мольбе о земле
  rationale: Нифаль глагола עתר подразумевает благосклонный ответ на мольбу, хотя сама мольба отдельно не названа; «о земле» естественно передаёт לָאָרֶץ, не уточняя сверх текста, чья именно молитва имеется в виду.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: поражение Израиля прекратилось
  rationale: «Поражение» соответствует מַגֵּפָה в контексте посланного Богом смертоносного бедствия, а «прекратилось» естественно выражает пассивно-результативное значение עצר и идиому מֵעַל יִשְׂרָאֵל.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передаёт собственное заветное имя, присутствующее в еврейском тексте, а не заменяет его титулом.
- issue: Смысл וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Яхве внял мольбе о земле
  alternative: Яхве благосклонно отозвался ради земли
  rationale: Выбранный вариант сохраняет заложенный в форме глагола ответ на прошение, но не вводит прямо не названного молящегося и не раскрывает богословскую причинность подробнее оригинала.
- issue: Агент прекращения поражения
  choice: поражение Израиля прекратилось
  alternative: поражение было отведено от Израиля
  rationale: Еврейский пассив не называет агента непосредственно. Русская формулировка сохраняет это, хотя контекст связывает прекращение бедствия с ответом Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; культовые термины сохранены там, где они остаются понятными. Все маркеры сносок размещены непосредственно в основном тексте.
