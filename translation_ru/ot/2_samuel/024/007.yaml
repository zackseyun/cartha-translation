    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: к укреплённому городу Тиру
  rationale: מִבְצָר обозначает укреплённое место или крепость. В сочетании с названием Тира перевод «укреплённый город Тир» естественно передаёт военно-географический смысл, не сводя его непременно к отдельной цитадели.
- source_word: וְכָל עָרֵי
  choice: и ко всем городам
  rationale: Предлог «к» повторён по-русски, поскольку эти города являются следующими пунктами движения при глаголе «пришли».
- source_word: הַחִוִּי וְהַכְּנַעֲנִי
  choice: хиввеев и хананеев
  rationale: Употреблены традиционные русские названия народов; родительный падеж показывает принадлежность названных городов.
- source_word: וַיֵּצְאוּ
  choice: а затем вышли
  rationale: «Вышли» сохраняет основное значение יצא, а «затем» естественно обозначает очередной этап маршрута. Союз «а» делает длинную последовательность движения ясной, не меняя её содержания.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: к Негеву Иудеи
  rationale: Негев передан как географическое название, что уместно в описании маршрута. При этом возможное нарицательное значение «юг, южная область» сохранено в сноске.
- source_word: בְּאֵר שָׁבַע
  choice: Вирсавия
  rationale: Использована укоренившаяся в русской библейской традиции форма названия Беэр-Шевы.
