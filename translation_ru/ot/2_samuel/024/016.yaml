base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: ru
  text: 'Когда ангел простёр руку к Иерусалиму, чтобы погубить его, Яхве пожалел о бедствии[a] и сказал ангелу, истреблявшему народ: «Довольно! Теперь опусти руку». Ангел Яхве находился у гумна Арауны[b], иевусеянина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Яхве отказался от бедствия». Буквально еврейский текст говорит, что Яхве «пожалел о бедствии»; слово רָעָה здесь означает бедствие, а не нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: В параллельном рассказе, в 1 Паралипоменон 21:15, Арауна назван Орнаном.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: простёр руку
  rationale: Передаёт устойчивый образ протянутой для действия руки и естественно звучит в возвышенной современной прозе.
- source_word: הַמַּלְאָךְ
  choice: ангел
  rationale: В контексте суда и бедствия речь идёт о небесном посланнике, поэтому «ангел» точнее общего слова «вестник».
- source_word: לְשַׁחֲתָהּ
  choice: чтобы погубить его
  rationale: Инфинитив выражает цель разрушительного действия против Иерусалима; местоимение согласовано с русским мужским родом названия города.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Яхве пожалел о бедствии
  rationale: Сохраняет антропопатический язык оригинала и напряжение выражения; «бедствие» передаёт здесь несчастье или кару, а не нравственное зло.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: истреблявшему народ
  rationale: Причастная конструкция сохраняет значение продолжающегося разрушительного действия и естественна по-русски.
- source_word: רַב
  choice: Довольно!
  rationale: Краткое восклицание точно передаёт самостоятельное повелительное значение слова.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Теперь опусти руку
  rationale: Сохраняет конкретный образ руки и выражает приказ немедленно прекратить действие.
- source_word: וּמַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: Буквально передаёт конструкцию принадлежности, не предрешая богословскую природу названной фигуры.
- source_word: הָיָה עִם
  choice: находился у
  rationale: В данном пространственном контексте ясно обозначает близость к гумну.
- source_word: גֹּרֶן
  choice: гумно
  rationale: Точный русский термин для площадки, где молотили зерно; он сохраняет историко-земледельческий колорит повествования.
- source_word: הָאֹרְנָה
  choice: Арауна
  rationale: Передаёт форму имени в книге Самуила; отличающаяся форма параллельного текста указана в примечании.
theological_decisions:
- issue: Антропопатический язык о Боге в וַיִּנָּחֶם יְהוָה
  choice: Яхве пожалел о бедствии
  alternative: Яхве отказался от бедствия; Яхве раскаялся в бедствии
  rationale: Выбранная формулировка сохраняет прямую силу еврейского выражения, не превращает бедствие в нравственное зло и не объясняет за читателя, как именно соотнести перемену действия с неизменностью Бога.
- issue: Личность מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  alternative: теофаническое явление; сотворённый ангельский посланник
  rationale: Стих называет фигуру, но не разрешает вопрос о её дальнейшей богословской идентификации; перевод оставляет эту неоднозначность открытой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены конкретный образ руки, краткость Божьего повеления и традиционный земледельческий термин «гумно»; устаревшие синтаксические обороты избегаются.
