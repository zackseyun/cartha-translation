base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: ru
  text: 'И сказал Давид Гаду: «Мне очень тяжело. Давайте попадём в руки Яхве, ведь велико Его милосердие[a], но пусть я не попаду в руки человека[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ведь многочисленны Его милости»; возможно также: «ведь велико Его сострадание».'
    reason: lexical_alternative
  - marker: b
    text: «В руки человека» — то есть под власть или контроль людей.
    reason: idiom_explanation
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Мне очень тяжело
  rationale: Естественно передаёт предикативную конструкцию с לִי и сильное личное переживание Давида, не сужая смысл до одной лишь внешней опасности.
- source_word: נִפְּלָה נָּא
  choice: Лучше нам попасть
  rationale: Форма 1-го лица множественного числа сохраняет отождествление Давида с народом. Частица נָא выражает побуждение или просьбу; в данном контексте по-русски естественно передать выбор предпочтительного исхода словом «лучше».
- source_word: בְיַד יְהוָה
  choice: в руку Яхве
  rationale: Сохранён образ руки как власти и контроля, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: כִּי רַבִּים רחמיו
  choice: ведь велико Его милосердие
  rationale: Русское собирательное «милосердие» естественно выражает множественное רחמיו и согласуется с רַבִּים по смыслу как указание на изобилие сострадания; буквальная множественность отмечена в сноске.
- source_word: וּבְיַד אָדָם
  choice: но в руку человека
  rationale: Сохраняет контраст между рукой Яхве и рукой человека; אָדָם здесь имеет обобщённое значение.
- source_word: אַל אֶפֹּלָה
  choice: пусть я не попаду
  rationale: Передаёт отрицательное волеизъявление 1-го лица единственного числа и сохраняет намеренную смену числа после «нам».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Число в נִפְּלָה и אֶפֹּלָה
  choice: «нам попасть» и «пусть я не попаду»
  alternative: Унифицировать оба глагола как единственное или множественное число
  rationale: Еврейский текст намеренно переходит от 1-го лица множественного числа к 1-му лицу единственного числа. Перевод сохраняет эту напряжённость, не исправляя её.
- issue: Значение רחמיו
  choice: Его милосердие
  alternative: Его милости многочисленны
  rationale: Еврейское множественное число допускает как представление о многочисленных проявлениях милости, так и собирательное значение обильного сострадания; основной текст выбирает естественную русскую формулировку, а буквальную форму сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Образ «руки» сохранён ради контраста исходного текста; устаревшие обороты сведены к минимуму.
