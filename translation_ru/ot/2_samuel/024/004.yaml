  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: ru
  text: Но слово царя возобладало над Иоавом и над начальниками войска, и Иоав и начальники войска вышли от царя, чтобы пересчитать народ Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ אֶל־יוֹאָב וְעַל שָׂרֵי הֶחָיִל
  choice: Но слово царя пересилило Иоава и военачальников
  rationale: Глагол חזק здесь передаёт превосходство царского решения над возражением Иоава и начальников; «пересилило» естественно выражает это в современном русском, не добавляя отсутствующего в тексте объяснения.
- source_word: שָׂרֵי הֶחָיִל
  choice: военачальники
  rationale: В данном повествовательном контексте сочетание обозначает начальников войска; краткое «военачальники» звучит естественно и точно.
- source_word: וַיֵּצֵא ... לִפְנֵי הַמֶּלֶךְ
  choice: И вышли ... от царя
  rationale: Буквально оборот означает выход из присутствия царя. Русское «вышли от царя» сохраняет придворный контекст без тяжеловесного «из присутствия царя».
- source_word: לִפְקֹד אֶת־הָעָם אֶת־יִשְׂרָאֵל
  choice: чтобы пересчитать народ Израиля
  rationale: В контексте переписи פקד означает считать или проводить учёт; «пересчитать» ясно передаёт цель выхода.
theological_decisions:
- issue: Степень противодействия царскому приказу
  choice: «слово царя пересилило Иоава и военачальников»
  alternative: «царский приказ возобладал над Иоавом и военачальниками»
  rationale: Выбранный вариант сохраняет образное «слово царя» исходного текста и напряжение между приказом Давида и возражением его подчинённых, не уточняя сверх текста ни форму приказа, ни мотив их уступки.
translation_notes:
  register: Современный литературный русский язык; сдержанный повествовательный стиль. Синтаксис разделён на два предложения для естественности, при сохранении последовательности и причинной связи событий через контекст.
