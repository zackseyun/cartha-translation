revisions:
- from: Но слово царя пересилило Иоава и военачальников. И вышли Иоав и военачальники от царя, чтобы пересчитать народ Израиля.
  to: Но слово царя возобладало над Иоавом и над начальниками войска, и Иоав и начальники войска вышли от царя, чтобы пересчитать народ Израиля.
