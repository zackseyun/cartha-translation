base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: ru
  text: И Давид поднялся по слову Гада, как повелел Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה обозначает движение вверх. «Поднялся» сохраняет направительный оттенок и естественно звучит в повествовании.
- source_word: דָּוִד
  choice: Давид
  rationale: Традиционная русская форма личного имени.
- source_word: כִּדְבַר גָּד
  choice: исполняя слово Гада
  rationale: Буквально конструкция означает «согласно слову Гада». В данном контексте речь идёт о действии в соответствии с переданным пророком указанием; причастный оборот передаёт это естественно, сохраняя слово «слово».
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз выражает соответствие слова Гада повелению Яхве. Простое «как» точно и естественно передаёт связь без избыточного усиления.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол צוה означает «приказывать, повелевать». Совершенный вид показывает, что повеление предшествовало поступку Давида.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» передаёт личное имя, не заменяя его титулом и не навязывая дополнительного толкования.
- issue: Связь слова Гада с повелением Яхве
  choice: сохранена формулировка «слово Гада, как повелел Яхве»
  alternative: «по повелению Яхве, переданному через Гада»
  rationale: Исходный текст ставит рядом слово Гада и повеление Яхве, но не разворачивает механизм передачи. Перевод сохраняет эту сжатость и не добавляет отсутствующего в стихе пояснения.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Сохранён направительный оттенок глагола עלה и прямое употребление Божьего имени.
