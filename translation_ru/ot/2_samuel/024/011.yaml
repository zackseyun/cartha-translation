base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: ru
  text: 'Когда Давид утром встал, слово Яхве было обращено к пророку Гаду, провидцу Давида:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма повествовательной последовательности от קום обозначает, что Давид поднялся ото сна; «встал» естественно звучит в современном русском повествовании.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Краткий и естественный русский эквивалент временного оборота.
- source_word: וּדְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена пророческая формула со словом «слово», а тетраграмматон передан личным именем «Яхве».
- source_word: הָיָה אֶל
  choice: уже пришло к
  rationale: В пророческом контексте оборот «было к» означает получение откровения. «Уже пришло» естественно передаёт вероятное предшествование этому событию по отношению к пробуждению Давида, не скрывая буквальную конструкцию благодаря сноске.
- source_word: גָּד הַנָּבִיא
  choice: пророку Гаду
  rationale: Имя передано в принятой русской форме «Гад», а נָבִיא — обычным обозначением служения «пророк».
- source_word: חֹזֵה דָוִד
  choice: прозорливцу Давида
  rationale: «Прозорливец» сохраняет отдельное обозначение חֹזֶה и его связь с получением видений, не смешивая его с уже употреблённым словом «пророк».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит в русском языке прямую речь, продолжающуюся в следующем стихе, и функционально передаёт לֵאמֹר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное covenantное имя Бога; форма «Яхве» сохраняет различие между именем и титулом.
- issue: Временное отношение откровения Гаду к пробуждению Давида
  choice: слово Яхве уже пришло
  alternative: слово Яхве пришло
  rationale: Именная конструкция с הָיָה после повествовательного וַיָּקָם допускает понимание как фонового, уже состоявшегося события. Слово «уже» делает это естественным по-русски, а сноска сохраняет формальную неоднозначность исходного оборота.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Прозорливец» несколько возвышенно, но точно отличает חֹזֶה от נָבִיא. Двоеточие вместо буквального «говоря» избегает неестественного русского оборота и ясно показывает продолжение речи в следующем стихе.
