  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: ru
  text: 'После того как Давид пересчитал народ[a], его стала мучить совесть[b]. Давид сказал Яхве: «Я тяжко согрешил, совершив это. И теперь, Яхве, прошу, сними вину[c] с твоего слуги, ведь я поступил крайне безрассудно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исчислил народ»; по смыслу также: «провёл перепись народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сердце Давида ударило его» — еврейская идиома, обозначающая угрызения совести и внутреннее обличение.'
    reason: cultural_note
  - marker: c
    text: Еврейское слово может означать «беззаконие», «вину», а иногда и наказание, ставшее следствием греха.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: его стала мучить совесть
  rationale: Еврейская идиома буквально изображает сердце Давида, которое «ударило его». По-русски смысл внутреннего обличения естественно и ясно передаётся выражением «стала мучить совесть», а исходный образ сохраняется в сноске.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: После того как Давид пересчитал народ
  rationale: 'Передаёт временную последовательность: угрызения совести последовали за подсчётом народа. «Пересчитал» понятно современному читателю и не добавляет административных подробностей, подразумеваемых словом «перепись».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой в современном русском языке транслитерацией, а не заменено титулом.
- source_word: חָטָאתִי מְאֹד אֲשֶׁר עָשִׂיתִי
  choice: Я тяжко согрешил тем, что сделал
  rationale: «Тяжко согрешил» сохраняет усилитель מְאֹד и звучит естественно и весомо; придаточная конструкция связывает признание греха с совершённым поступком.
- source_word: הַעֲבֶר נָא
  choice: прошу, сними
  rationale: Форма выражает настойчивую, но смиренную просьбу удалить то, что связано с грехом. «Сними вину» — естественное русское сочетание.
- source_word: עֲוֺן עַבְדְּךָ
  choice: вину с твоего слуги
  rationale: В контексте исповеди עָוֹן прежде всего обозначает лежащую на Давиде нравственную вину; слово «слуга» передаёт смиренное самообозначение царя перед Богом.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: ведь я поступил крайне безрассудно
  rationale: Передаёт действие, а не только состояние, и сохраняет усилительное מְאֹד. «Безрассудно» лучше соответствует достоинству молитвенной речи, чем разговорное «очень глупо».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует преобладающей научной реконструкции произношения.
- issue: Значение עָוֹן в просьбе Давида
  choice: вина
  alternative: беззаконие; наказание
  rationale: Слово допускает значения совершённого беззакония, возникшей вины и последствий греха. После прямого признания в грехе просьба «сними вину» наиболее естественна, однако более широкий смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис упрощён для ясности без устранения образности и смысловой многозначности оригинала; местоимения, относящиеся к Богу, даны со строчной буквы по общим современным издательским нормам.
