base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: ru
  text: Они перешли Иордан и разбили лагерь в Ароэре, справа от города[a], находящегося посреди долины Гада[b], по направлению к Иазеру[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «справа от города». Некоторые понимают это географически как «к югу от города».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посреди оврага Гада» или «посреди русла потока Гада». Еврейское слово может обозначать долину, овраг, сезонное русло или поток.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к Иазеру». Еврейский предлог может указывать как направление к месту, так и движение до него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: Они перешли Иордан
  rationale: Глагол עבר с прямым дополнением «Иордан» в повествовании о передвижении означает переправу через реку; «перешли Иордан» естественно и точно передаёт это значение.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает остановиться и разбить лагерь. Выражение «расположились станом» сохраняет походный контекст и звучит литературно, не будучи архаичным.
- source_word: בַּעֲרוֹעֵר
  choice: в Ароэре
  rationale: Предлог ב при названии места обозначает место стоянки; по-русски естественно «в Ароэре».
- source_word: יְמִין הָעִיר
  choice: справа от города
  rationale: ימין буквально обозначает правую сторону. Перевод сохраняет пространственное выражение оригинала, не подменяя его толкованием «к югу».
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: который находится посреди долины Гада
  rationale: Относительное предложение относится к «городу». נחל может обозначать долину, овраг, русло сезонного потока или сам поток; «долина» даёт понятное географическое описание, а неоднозначность отмечена в сноске.
- source_word: וְאֶל יַעְזֵר
  choice: в сторону Иазера
  rationale: Предлог אל может указывать как на движение к месту, так и на направление. «В сторону Иазера» не утверждает прибытия, которого текст однозначно не выражает.
