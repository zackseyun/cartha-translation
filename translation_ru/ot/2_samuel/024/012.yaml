base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: ru
  text: '«Пойди и скажи Давиду: „Так говорит Яхве: Я предлагаю тебе три[a]. Выбери себе одну из них, и Я сделаю это тебе“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три»; существительное в еврейском тексте не названо. По контексту речь идёт о трёх возможных бедствиях или наказаниях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: Пойди и скажи
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление; по-русски последовательность «пойди и скажи» естественно передаёт его силу.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная формула речи посланника и личное имя Бога.
- source_word: שָׁלֹשׁ
  choice: три
  rationale: В еврейском тексте дано только числительное женского рода без существительного. Русский язык позволяет сохранить эту недосказанность, а дальнейшее «одну из них» делает смысл понятным.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: Я предлагаю тебе
  rationale: В контексте Бог ставит перед Давидом три возможных бедствия для выбора. Это естественная русская передача контекстуального смысла оборота, хотя буквально он может указывать на возложение чего-либо на Давида.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: Выбери себе одну из них
  rationale: «Себе» передаёт לְךָ и подчёркивает личную ответственность Давида за выбор; партитивная конструкция естественно передана словами «одну из них».
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: и Я сделаю это с тобой
  rationale: Передаёт неблагоприятный для Давида смысл, не превращая общее выражение в более конкретное «наведу на тебя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Характер трёх вариантов
  choice: Не называть их прямо «наказаниями» или «бедствиями»
  alternative: три наказания; три бедствия; три варианта
  rationale: В данном стихе существительное отсутствует. Контекст показывает, что речь идёт о грозящих бедствиях, но перевод сохраняет формальную недосказанность исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной формулы пророческой речи. Синтаксис сделан ясным для обычного читателя; неоднозначность голого числительного сохранена и пояснена сноской.
