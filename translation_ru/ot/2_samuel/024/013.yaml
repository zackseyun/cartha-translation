base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: ru
  text: 'И пришёл Гад к Давиду, сообщил ему и сказал: «Придут ли в твою землю[a] семь лет голода? Или будешь ты три месяца бежать от своих врагов[b], пока они преследуют тебя? Или будет три дня мора[c] в твоей земле? Теперь знай и реши, какой ответ мне дать тому, кто послал меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте этой книги: «семь лет». В параллельном месте, 1 Паралипоменон 21:12, сказано: «три года»; такое чтение имеется также в некоторых древних текстовых свидетелях.'
    reason: textual_variant
  - marker: b
    text: 'Или: «противников».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чумы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: И пришёл Гад к Давиду
  rationale: Обычная повествовательная формула; «пришёл» естественно передаёт движение Гада к Давиду.
- source_word: וַיַּגֶּד לוֹ
  choice: передал ему сказанное
  rationale: Форма от נגד в породе хифиль означает сообщить или передать. Добавление «сказанное» по-русски естественно обозначает переданную Гадом Божью весть, не уточняя её содержание сверх контекста.
- source_word: הֲתָבוֹא לְךָ שֶׁבַע שָׁנִים רָעָב
  choice: 'Что избрать тебе: семь лет голода'
  rationale: Еврейская вопросительная конструкция перечисляет предложенные бедствия; русское «что избрать тебе» ясно выражает подразумеваемый выбор. רָעָב здесь означает продолжительный голод, а не личное чувство голода.
- source_word: אִם שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: или три месяца бежать тебе от твоих врагов
  rationale: Эллиптическая еврейская конструкция естественно раскрыта русским инфинитивным оборотом. צַר обозначает врага или противника.
- source_word: וְהוּא רֹדְפֶךָ
  choice: пока они преследуют тебя
  rationale: Хотя местоимение формально стоит в единственном числе, оно соотносится с множественным «враги» как с совокупностью; множественное число естественно по-русски.
- source_word: דֶּבֶר
  choice: мор
  rationale: В данном контексте слово означает смертоносную эпидемию. «Мор» кратко и весомо передаёт бедствие; возможный более современный вариант «эпидемия» указан в примечании.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Теперь обдумай и реши
  rationale: Буквальное «узнай и посмотри» в этой паре императивов призывает к осмыслению и выбору; функциональный русский эквивалент передаёт смысл без неестественного буквализма.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: какой ответ мне дать Пославшему меня
  rationale: השיב דבר — идиома возвращения ответа. Причастие «пославший меня» передано субстантивированно; прописная буква указывает на Бога, ясного из контекста пославшего пророка.
theological_decisions:
- issue: Расхождение числа лет голода с параллельным местом 1 Паралипоменон 21:12
  choice: В основном тексте переведено масоретское чтение «семь лет».
  alternative: В 1 Паралипоменон 21:12 указаны «три года»; некоторые текстовые свидетели и переводы также читают здесь «три года».
  rationale: Предоставленный древнееврейский текст WLC ясно содержит שֶׁבַע, «семь». Расхождение следует сохранить открыто в примечании, а не молча согласовывать параллельные рассказы.
- issue: Личность пославшего Гада
  choice: «Пославшему меня» с прописной буквы
  alternative: «тому, кто послал меня»
  rationale: Контекст однозначно указывает на Господа, пославшего пророка, но имя Бога в самой фразе отсутствует. Субстантивированное причастие сохраняет эту непрямую формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка приподнят, но понятен; устранены неестественные кальки. Маркеры примечаний размещены непосредственно после соответствующих выражений.
