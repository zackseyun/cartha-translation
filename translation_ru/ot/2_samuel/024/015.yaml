base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: ru
  text: И послал Яхве на Израиль моровую язву с утра до назначенного времени[a]. И из народа, от Дана до Вирсавии, умерли семьдесят тысяч мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до установленного срока». Древнееврейское выражение может обозначать назначенное или установленное время; менее вероятно в этом контексте: «до времени собрания».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: послал
  rationale: Буквально глагол означает «дал», но в сочетании с דֶּבֶר естественно передаёт действие как «послал моровую язву», сохраняя прямую божественную причинность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: דֶּבֶר
  choice: моровую язву
  rationale: Устойчивое и понятное русское обозначение смертоносной эпидемии; оно точнее передаёт древнееврейское דֶּבֶר, чем слишком широкое «бедствие».
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: Русская конструкция естественно выражает бедствие, обрушившееся на народ.
- source_word: מֵהַבֹּקֶר
  choice: с утра
  rationale: Естественная современная русская передача начальной временной границы.
- source_word: וְעַד עֵת מוֹעֵד
  choice: до назначенного времени
  rationale: מוֹעֵד здесь вероятнее всего обозначает установленный или назначенный срок; неоднозначность отмечена в сноске.
- source_word: וַיָּמָת מִן הָעָם
  choice: умерло из народа
  rationale: Сохраняет партитивное значение מִן и естественно согласует сказуемое с последующим количеством.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: от Дана до Вирсавии
  rationale: Традиционная и узнаваемая русская передача географической формулы, обозначающей всю протяжённость Израиля.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: семьдесят тысяч мужчин
  rationale: אִישׁ после числительного употреблено распределительно и имеет мужскую форму; «мужчин» сохраняет эту конкретность.
theological_decisions:
- issue: Божественная причинность суда
  choice: послал Яхве моровую язву
  alternative: допустил Яхве моровую язву
  rationale: Древнееврейский текст прямо приписывает действие Яхве и не содержит смягчающего глагола со значением «допустил».
- issue: Значение עֵת מוֹעֵד
  choice: до назначенного времени
  alternative: до установленного срока; до времени собрания
  rationale: В данном повествовательном контексте наиболее вероятна временная конечная точка, однако выражение допускает оттенок установленного срока, а в иных контекстах מוֹעֵד может быть связано с собранием.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены прямое указание на действие Яхве, географическая формула и мужская конкретность אִישׁ. Маркер сноски помещён непосредственно после спорного выражения.
