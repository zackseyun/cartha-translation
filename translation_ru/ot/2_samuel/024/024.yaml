base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: ru
  text: 'Но царь сказал Арауне: «Нет, я непременно куплю это у тебя за цену. Я не стану возносить Яхве, моему Богу, всесожжения, доставшиеся мне даром».[a] И Давид купил гумно и скот за пятьдесят шекелей серебра.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не стану возносить Яхве, моему Богу, всесожжения даром» или «бесплатно».'
    reason: lexical_alternative
  - marker: b
    text: В 1 Пар. 21:25 говорится, что Давид заплатил за место шестьсот шекелей золота; здесь указаны пятьдесят шекелей серебра за гумно и скот.
    reason: cross_reference
  - marker: c
    text: 'Или: «волов». Еврейское слово может обозначать крупный рогатый скот в целом или, в более узком смысле, быков (волов).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Арауна
  rationale: Передаёт форму личного имени в еврейском тексте этой книги; форма «Орна» относится к параллельному повествованию в 1 Паралипоменон.
- source_word: קָנוֹ אֶקְנֶה
  choice: я непременно куплю
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; наречие «непременно» естественно передаёт эту эмфазу.
- source_word: בִּמְחִיר
  choice: за плату
  rationale: Слово обозначает цену или плату при покупке и здесь противопоставлено получению даром.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, не заменяя его титулом.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшийся и точный русский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: חִנָּם
  choice: доставшиеся мне даром
  rationale: Буквально означает «даром, бесплатно»; добавление «доставшиеся мне» естественно выражает подразумеваемое отношение к жертвам, не превращая смысл в более широкое утверждение о цене жертвенности.
- source_word: הַגֹּרֶן
  choice: гумно
  rationale: Точный традиционный русский сельскохозяйственный термин для площадки, где молотили зерно; уместен в dignified biblical register.
- source_word: הַבָּקָר
  choice: волов
  rationale: Собирательное существительное может обозначать крупный рогатый скот; в данном жертвенном и рабочем контексте «волы» — естественное конкретное соответствие, при сохранении альтернативы в примечании не требуется из-за ясности контекста.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: за пятьдесят шекелей серебра
  rationale: Естественно передаёт материал и весовую денежную меру исходного выражения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл חִנָּם в словах Давида
  choice: всесожжения, доставшиеся мне даром
  alternative: всесожжения, которые ничего мне не стоили
  rationale: Выбранный вариант сохраняет буквальный смысл «даром» и не усиливает текст до абстрактного богословского принципа о личной цене всякой жертвы.
- issue: Соотношение цены здесь и в 1 Паралипоменон 21:25
  choice: сохранить указанную здесь цену без гармонизации
  alternative: истолковать обе суммы как одну и ту же покупку
  rationale: Этот стих прямо связывает пятьдесят шекелей серебра с гумном и волами; параллель сообщает шестьсот шекелей золота за место. Примечание обозначает различие, не навязывая его разрешения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямой и понятный; сохранены традиционные термины «всесожжение», «гумно» и мера «шекель». Все маркеры примечаний помещены в основном тексте.
