base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: ru
  text: 'Увидев ангела, поражавшего народ, Давид сказал Господу: «Вот, я согрешил и поступил неправильно; но эти овцы — что они сделали? Пусть Твоя рука будет против меня и против дома моего отца».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господу
  rationale: Традиционная русская передача тетраграмматона, естественная для литературного библейского текста.
- source_word: הַמַּלְאָךְ הַמַּכֶּה
  choice: ангела, поражавшего
  rationale: Причастная конструкция сохраняет прямой смысл и продолжающееся действие еврейского текста.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую частицу и подчёркивает признание Давида.
- source_word: הֶעֱוֵיתִי
  choice: поступил беззаконно
  rationale: Отличает второе признание от חָטָאתִי и передаёт нравственную извращённость или неправоту поступка без чрезмерного уточнения.
- source_word: הַצֹּאן
  choice: эти овцы
  rationale: Сохраняет пастырскую метафору оригинала применительно к народу.
- source_word: יָדְךָ
  choice: рука Твоя
  rationale: Сохранён образ Божьей руки как действующей силы суда; не заменён толкованием.
- source_word: בְבֵית אָבִי
  choice: против дома моего отца
  rationale: «Дом» сохранён в значении семьи или рода, не сужаясь до здания.
theological_decisions:
- issue: Направленность Божьей руки
  choice: против меня и против дома моего отца
  alternative: на мне и на доме моего отца
  rationale: Предлог ב здесь в контексте кары естественно передаётся как направленность действия «против», при этом образ руки сохраняется.
- issue: Ответственность Давида и невиновность народа
  choice: я согрешил, я поступил беззаконно; но эти овцы — что сделали они?
  alternative: это я согрешил и поступил беззаконно, а эти овцы — что они сделали?
  rationale: 'Сохранено напряжение текста: Давид признаёт свою вину и противопоставляет её положению народа, не добавляя систематического объяснения коллективного суда.'
- issue: Просительная частица נָא
  choice: Пусть же
  alternative: Прошу, пусть
  rationale: Передаёт настойчивую просьбу без добавления отсутствующего отдельного глагола «прошу».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Порядок первой фразы сделан естественным для русского языка; метафоры «овцы», «рука» и «дом отца» сохранены.
