    text: 'Или: «проходивших мимо него». Еврейское выражение буквально описывает движение царя и его слуг относительно Аравны и допускает оба понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: выглянул
  rationale: Глагол передаёт взгляд из помещения, через проём или с возвышенного места; «выглянул» естественно сохраняет эту пространственную окраску.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямой эквивалент ראה; последовательность «выглянул и увидел» сохраняет ход еврейского повествования.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: Прямое значение עבד; в царском окружении слово может обозначать также приближённых и служащих, но более конкретное «чиновников» было бы истолкованием.
- source_word: עֹבְרִים עָלָיו
  choice: проходивших мимо него
  rationale: Сочетание причастия עבר с על буквально описывает движение царя и его людей относительно Аравны. Такой перевод близок к форме исходного текста, а контекстуально возможное значение «шедших к нему» отмечено в сноске.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычное и естественное соответствие יצא, согласующееся с тем, что перед этим Аравна выглядывает из своего местоположения.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Глагол обозначает поклон или простирание ниц. В данном контексте это почтение человеческому царю, поэтому перевод не вводит значения богопоклонения.
- source_word: אַפָּיו אָרְצָה
  choice: склонившись лицом до земли
  rationale: Передаёт телесную позу полного поклона и сохраняет образ лица, обращённого к земле, в естественной русской форме.
- source_word: אֲרַוְנָה
  choice: Аравна
  rationale: Транслитерация имени по еврейской форме данного стиха; форма «Орнан» относится к параллельному повествованию в Книгах Паралипоменон.
theological_decisions:
- issue: Характер жеста Аравны перед царём
  choice: почтительный земной поклон человеческому царю — «поклонился царю»
  alternative: «поклонился царю как божеству» / «совершил поклонение царю»
  rationale: השׁתחוה может обозначать как поклонение Богу, так и почтительный поклон человеку. Здесь адресат — царь Давид в обычной встрече, поэтому физический жест передан без привнесения идеи божественного поклонения.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены повтор имени и конкретная телесная образность поклона; неоднозначность направления движения вынесена в сноску.
