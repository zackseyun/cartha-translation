review_pass:
  verdict: revise
  source_fidelity: Основной перевод «проходивших мимо него» возможен при формально-пространственном понимании עֹבְרִים עָלָיו, но в данном контексте он создаёт по-русски сильное впечатление, что царь миновал Аравну. Непосредственно далее Аравна спрашивает, зачем царь пришёл к нему; поэтому «шедших к нему» лучше передаёт контекстуально вероятное направление, сохраняя альтернативу в сноске. «Выглянул и увидел», «слуг» и имя «Аравна» точны. Поклон следует выразить как полное падение ниц, поскольку дополнение אַפָּיו אָרְצָה конкретизирует жест.
  naturalness: «Склонившись лицом до земли» понятно, но для современного литературного русского менее естественно и несколько тяжеловесно. Оборот «пал перед царём ниц, лицом к земле» ясно и естественно передаёт полный земной поклон, не приписывая религиозного поклонения.
  terminology: «Пал перед царём ниц» здесь обозначает придворное почтение перед человеческим царём и не несёт утверждения о богопоклонении. Сноска должна маркировать именно лексико-синтаксическую альтернативу направления движения. Английский аудит фиксирует вариант “passing by him”, но также признаёт “approaching/coming toward him” как возможный; контекст поддерживает выбор последнего в русском основном тексте.
