  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: ru
  text: Аравна выглянул и увидел царя и его слуг, шедших к нему[a]. Тогда Аравна вышел и пал перед царём ниц, лицом к земле.
  philosophy: optimal-equivalence
  footnotes:
