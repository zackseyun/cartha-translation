source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: ru
  text: 'Всё это царь Арауна отдал царю[a]. И Арауна сказал царю: «Да примет тебя Яхве, твой Бог[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «Арауна, царь». Некоторые переводы опускают этот необычный титул при имени Арауны.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «да будет благосклонен к тебе»; «да явит тебе благоволение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: всё это
  rationale: Указывает на всю совокупность перечисленного ранее — гумно, волов и дерево; по-русски естественно отсылает к ближайшему контексту.
- source_word: נָתַן
  choice: отдал
  rationale: Форма qatal в повествовательном контексте передаёт завершённое действие; «отдал» ясно выражает передачу предложенного царю.
- source_word: אֲרַוְנָה
  choice: Арауна
  rationale: Передача имени в соответствии с еврейской формой в книге Самуила; вариант «Орнан» из параллельного места в Паралипоменоне сюда не переносится.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранено необычное приложение к имени Арауны, прямо присутствующее в масоретском тексте.
- source_word: לַמֶּלֶךְ
  choice: царю
  rationale: Предлог ל обозначает получателя — царя Давида.
- source_word: וַיֹּאמֶר
  choice: И … сказал
  rationale: Последовательно продолжает повествование и естественно передаёт waw-consecutive.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, без замены его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Точно передаёт конструкцию с суффиксом второго лица мужского рода единственного числа, обращённую к Давиду.
- source_word: יִרְצֶךָ
  choice: да примет тебя
  rationale: Глагол רצה выражает благосклонное принятие; формулировка сохраняет как личную направленность, так и связь с жертвоприношением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Титул הַמֶּלֶךְ при имени Арауны
  choice: 'Сохранить в основном тексте: «царь Арауна»'
  alternative: «Арауна отдал всё это царю»
  rationale: Масоретский текст прямо содержит приложение «царь» после имени Арауны. Хотя оно необычно и иногда сглаживается, его не следует устранять без текстового основания.
- issue: Значение יִרְצֶךָ
  choice: «да примет тебя»
  alternative: «да будет благосклонен к тебе»; «да явит тебе благоволение»
  rationale: Выбранный вариант сохраняет возможный жертвенный оттенок контекста, не исключая более широкого значения благоволения, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной формой пожелания «да примет». Необычный титул Арауны сохранён, а повтор слова «царь» отражает намеренную формальную близость к еврейскому тексту.
