  text: Они прошли по всей стране и по истечении девяти месяцев и двадцати дней пришли в Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: обошли
  rationale: Глагол שׁוט обозначает передвижение по некоторой области. В контексте переписи «обошли» естественно передаёт целенаправленное путешествие по всей территории, не придавая ему оттенка бесцельного блуждания.
- source_word: בְּכָל הָאָרֶץ
  choice: всю страну
  rationale: Сочетание ב + כל + הארץ указывает на передвижение по всей охватываемой территории. «Всю страну» в сочетании с глаголом «обошли» звучит естественно и здесь точнее контекстуального «землю».
- source_word: וַיָּבֹאוּ
  choice: вернулись
  rationale: בוא буквально значит «пришли» или «прибыли». В данном контексте участники вышли из Иерусалима (ст. 4) и по завершении обхода пришли туда снова, поэтому «вернулись» естественно выражает подразумеваемое направлением повествования возвращение.
- source_word: מִקְצֵה
  choice: через
  rationale: В сочетании с обозначением срока выражение указывает на момент завершения прошедшего периода. Русское «через» ясно и естественно передаёт, сколько времени прошло до возвращения.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: девять месяцев и двадцать дней
  rationale: Прямое и идиоматичное воспроизведение обозначения продолжительности с правильным русским согласованием числительных.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
