  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: ru
  text: Крупного скота было тридцать шесть тысяч, и доля из него для Господа составила семьдесят две головы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: крупного скота
  rationale: בָּקָר обозначает крупный рогатый скот как собирательную категорию; в перечне добычи естественно русское «крупного скота».
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: тридцать шесть тысяч
  rationale: Число передано в обычном для современного русского языка порядке.
- source_word: מִכְסָם
  choice: доля из него
  rationale: מֶכֶס здесь означает установленную часть военной добычи, отделённую для Господа. «Доля» естественно звучит по-русски и сохраняет контекстуальный смысл сбора; местоимение согласовано с собирательным «скот».
- source_word: לַיהוָה
  choice: для Господа
  rationale: Предлог ל указывает на предназначение и принадлежность выделенной доли; יהוה передано традиционным русским библейским соответствием «Господь».
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: семьдесят две головы
  rationale: Число дано в современном русском порядке; счётное слово «головы» добавлено для ясности и естественного обозначения отдельных животных.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: В основном тексте выбрано традиционное и широко понятное русское библейское обозначение «Господь». Оно не меняет того, что в еврейском тексте стоит личное имя יהוה, тогда как транслитерация «Яхве» была бы более непосредственной, но менее традиционной.
translation_notes:
  register: Современный литературный русский язык; краткая инвентарная формулировка оригинала сохранена. «Составила» помогает естественно связать количество скота с выделенной долей, не добавляя нового содержания.
