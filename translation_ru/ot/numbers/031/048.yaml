  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: ru
  text: И подошли[a] к Моисею начальники, поставленные над тысячами войска, — тысяченачальники и сотники[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приблизились».'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «начальники», обозначает людей, назначенных руководить воинскими подразделениями; далее они уточняются как тысяченачальники и сотники.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: подошли
  rationale: Глагол קרב обозначает движение к кому-либо; «подошли к Моисею» естественно передаёт конкретный смысл и последовательность повествования.
- source_word: הַפְּקֻדִים
  choice: начальники, поставленные
  rationale: Форма от פקד указывает на назначенных или поставленных лиц. В данном контексте это ответственные за воинские подразделения, а не рядовые воины.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: поставленные над тысячами войска
  rationale: Фраза указывает на область ответственности начальников; «над» передаёт подразумеваемое контекстом руководство, а «тысячи войска» сохраняет военную структуру исходного текста.
- source_word: אַלְפֵי
  choice: тысячами
  rationale: Хотя אֶלֶף может обозначать также род или воинское подразделение, военный контекст и параллель с «сотнями» поддерживают числовое обозначение подразделений.
- source_word: הַצָּבָא
  choice: войска
  rationale: Здесь צבא означает организованные вооружённые силы; «войско» ясно и уместно в современном русском повествовании.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: тысяченачальники
  rationale: Устоявшееся и компактное русское обозначение начальников воинских подразделений по тысяче человек сохраняет структуру военной иерархии.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: и сотники
  rationale: Параллельное обозначение начальников подразделений по сто человек; «сотники» естественно сочетается с «тысяченачальниками».
theological_decisions: []
