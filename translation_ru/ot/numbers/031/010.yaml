lexical_decisions:
- source_word: עָרֵיהֶם
  choice: их города
  rationale: עִיר обозначает город или поселение; «города» сохраняет обычное географическое значение слова и уместно в военном контексте.
- source_word: בְּמוֹשְׁבֹתָם
  choice: где они жили
  rationale: מוֹשָׁב может означать место жительства, обиталище или поселение. В сочетании с «их города» оборот «где они жили» естественно передаёт локативный смысл, не устраняя возможного более формального понимания, указанного в сноске.
- source_word: טִירֹתָם
  choice: их становища
  rationale: טִירָה может обозначать стан, ограждённое место или поселение. «Становища» отличает эти места от городов и подходит для менее постоянных либо шатровых поселений мадианитян, не придавая им непременно военного характера.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: сожгли огнём
  rationale: Инструментальный оборот «огнём» сохраняет выраженное в еврейском тексте упоминание огня и его торжественно-повествовательную выразительность.
- source_word: וְאֵת ... וְאֵת
  choice: все ... и все ...
  rationale: Повтор «все» сохраняет структуру двух однородных объектов и подчёркивает полноту действия.
