lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма с последовательным וַ продолжает повествование. В формуле введения прямой речи естественное современное русское «И сказал» передаёт функцию דּבר без тяжеловесного «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Предлог אֶל обозначает адресата речи; русский дательный падеж естественно передаёт сочетание «к Моисею» в данной речевой формуле.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитивная формула вводит последующую прямую речь. В современном русском её функцию естественно передаёт двоеточие, без буквального и стилистически избыточного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Передача «Яхве» сохраняет это имя, тогда как «Господь» заменяет его титулом; «Иегова» представляет традиционную альтернативную форму.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формула сохраняет достоинство библейского стиля. Формула לֵאמֹר передана русской пунктуацией, поскольку содержание речи следует в следующем стихе.
