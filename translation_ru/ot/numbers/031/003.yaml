base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: ru
  text: 'И сказал Моисей народу: «Вооружите из своей среды мужчин для войны, и пусть они выступят против Мадиана, чтобы совершить возмездие Яхве[a] над Мадианом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмездие за Яхве». Еврейское выражение может означать возмездие, принадлежащее Яхве, или возмездие, совершаемое от его имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Обычная повествовательная формула перед прямой речью; в современном русском «сказал» звучит естественнее буквального «говорил».
- source_word: הֵחָלְצוּ
  choice: Вооружите
  rationale: В военном контексте глагол означает снарядить или подготовить к походу; «вооружите» кратко передаёт боевой смысл.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: из своей среды мужчин
  rationale: Передаёт как отбор из числа адресатов, так и мужской род существительного אֲנָשִׁים.
- source_word: לַצָּבָא
  choice: для войска
  rationale: Сохраняет конкретное военное значение צבא и связь с мобилизацией людей.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: и пусть они выступят против Мадиана
  rationale: Идиома с עַל выражает враждебное выступление против противника; русский глагол «выступят» естественно передаёт военный контекст, не уточняя способ нападения.
- source_word: לָתֵת נִקְמַת
  choice: чтобы совершить возмездие
  rationale: Буквально «дать возмездие»; по-русски устойчиво и точно звучит «совершить возмездие».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בְּמִדְיָן
  choice: над Мадианом
  rationale: Обозначает объект возмездия и естественно сочетается в русском с выражением «совершить возмездие».
theological_decisions:
- issue: Принадлежность и направленность возмездия в נִקְמַת יְהוָה
  choice: возмездие Яхве
  alternative: возмездие за Яхве
  rationale: Конструкция может обозначать возмездие, принадлежащее Яхве, исходящее от него или совершаемое ради него. Основной текст сохраняет наиболее прямую родительную конструкцию, а примечание отмечает подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Военная и богословская резкость исходного текста не смягчается; синтаксис сделан понятным для обычного читателя.
