base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: ru
  text: Только золото, серебро, медь[a], железо, олово и свинец —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронза». Еврейское слово может обозначать как медь, так и бронзу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: В данном контексте частица вводит ограничение или исключение из предшествующего указания; «только» естественно передаёт эту функцию и сохраняет связь со следующим стихом.
- source_word: הַזָּהָב
  choice: золото
  rationale: Обычное обозначение металла; определённость еврейской формы в русском перечислении отдельно не выражается.
- source_word: הַכָּסֶף
  choice: серебро
  rationale: Здесь имеется в виду металл, а не деньги, поскольку слово входит в перечень металлов, подлежащих очищению.
- source_word: הַנְּחֹשֶׁת
  choice: медь
  rationale: Еврейское слово может обозначать медь либо медный сплав, в том числе бронзу. Для русского текста выбрано более широкое и традиционно естественное «медь», а возможное значение «бронза» отмечено в сноске.
- source_word: הַבַּרְזֶל
  choice: железо
  rationale: Прямое и общепринятое соответствие названию металла.
- source_word: הַבְּדִיל
  choice: олово
  rationale: В перечнях металлов слово обычно обозначает олово; менее конкретное «сплав» здесь маловероятно.
- source_word: הָעֹפָרֶת
  choice: свинец
  rationale: Прямое и общепринятое соответствие названию металла.
- source_word: אֵת (повторяется перед каждым существительным)
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; структура перечисления передана порядком слов, запятыми и союзом «и».
