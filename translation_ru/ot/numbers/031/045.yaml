- source_word: שְׁלֹשִׁים אֶלֶף
  choice: тридцать тысяч
  rationale: Стандартное древнееврейское обозначение количества передано прямо и естественно.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: пятьсот
  rationale: Внутри цельного русского числительного 30 500 отдельный союз перед последним разрядом обычно не употребляется; значение древнееврейского сложения полностью передаётся формой «тридцать тысяч пятьсот».
