  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: ru
  text: Они пошли войной на Мадиан[a], как Яхве повелел Моисею, и убили всех, кто был мужского пола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступили в бой с Мадианом». Еврейский глагол может обозначать участие в военном походе или военных действиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: пошли войной
  rationale: Глагол צבא здесь обозначает участие в военном походе или ведение войны. Выражение «пошли войной» естественно для современного русского языка и передаёт направленное военное действие.
- source_word: עַל
  choice: на
  rationale: При выражении «пойти войной» предлог «на» естественно передаёт враждебную направленность еврейского עַל.
- source_word: מִדְיָן
  choice: Мадиан
  rationale: Использована устоявшаяся русская библейская форма имени собственного.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз передаёт соответствие действий ранее данному повелению; русское «как» выражает это ясно и без стилистического утяжеления.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» точно передаёт властное распоряжение и сохраняет достойный литературный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: 'Хотя אֶת отмечает прямое дополнение к глаголу «повелеть», русское управление требует дательного падежа: «повелел Моисею».'
- source_word: וַיַּהַרְגוּ
  choice: убили
  rationale: Прямой современный эквивалент глагола הרג без архаизации и эвфемизации.
- source_word: כָּל זָכָר
  choice: всех, кто был мужского пола
  rationale: זָכָר обозначает принадлежность к мужскому полу и не ограничивается взрослыми мужчинами. Формулировка сохраняет широту еврейского выражения, не сужая его до взрослых.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Объём значения זָכָר
  choice: всех, кто был мужского пола
  alternative: всех мужчин
  rationale: Еврейское слово указывает на пол и само по себе не ограничивает группу взрослыми мужчинами; перевод сохраняет эту трудную, но подлинную широту текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным регистром. Формулировка о лицах мужского пола намеренно сохраняет объём исходного текста, несмотря на её суровое звучание.
