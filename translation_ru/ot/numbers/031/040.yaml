  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: ru
  text: Людей[a] было шестнадцать тысяч, а отчисление для Яхве составило тридцать два человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душ человеческих»; здесь это выражение служит для счёта людей и отличает их от животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: людей
  rationale: В перечне добычи сочетание обозначает человеческих лиц в противопоставлении животным. Русское «людей» естественно передаёт счётное употребление נֶפֶשׁ и категориальное значение אָדָם.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: шестнадцать тысяч
  rationale: Прямая передача количественного числительного.
- source_word: מִכְסָם
  choice: доля из них
  rationale: Здесь מֶכֶס обозначает установленную часть добычи, выделенную для Яхве. «Доля из них» ясно связывает число тридцать два с предписанным отчислением от людей.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל обозначает предназначение или выделение, а יהוה передано личным именем «Яхве».
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: тридцать два человека
  rationale: נֶפֶשׁ повторно употреблено как счётное обозначение отдельных людей; по-русски после числительного естественно «человека».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и согласуется с предоставленным доктринальным решением.
- issue: Передача נֶפֶשׁ אָדָם
  choice: людей
  alternative: человеческих душ
  rationale: В данном административном перечне выражение считает человеческих лиц, а не даёт антропологического определения души; «людей» сохраняет контекстуальный смысл без ненужного метафизического оттенка.
translation_notes:
  register: Современный литературный русский язык; краткая форма сохраняет структуру перечня. «Доля из них» звучит естественнее, чем административно окрашенные «налог» или «сбор», и передаёт установленную часть добычи.
