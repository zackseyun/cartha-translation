base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: ru
  text: «Сосчитай всё захваченное — людей и скот[a] — вместе со священником Елеазаром и главами родов общины[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю захваченную добычу — как людей, так и животных». Еврейское выражение охватывает всё захваченное на войне; далее оно уточняется как люди и животные.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «главами отцовских домов общины», то есть руководителями родовых объединений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Сосчитайте
  rationale: Еврейская идиома буквально говорит о «поднятии головы», но здесь означает подсчитать и установить общее число. Множественное число по-русски естественно включает далее названных участников подсчёта, хотя исходный императив обращён к Моисею в единственном числе.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: всё захваченное
  rationale: Сочетание обозначает военную добычу, то есть захваченных людей и животных. Субстантивированная форма не ограничивает смысл неодушевлённым имуществом и естественно подготавливает последующее уточнение.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: и людей, и скот
  rationale: אָדָם здесь обозначает людей в противопоставлении животным; בְּהֵמָה в данном контексте — прежде всего домашний скот.
- source_word: אַתָּה
  choice: ты
  rationale: Явное местоимение сохраняет особое указание на участие Моисея.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священник Елеазар
  rationale: Естественный русский порядок титула и имени.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: главы родов общины
  rationale: Краткая современная передача руководителей отцовских, то есть родовых, объединений израильской общины без тяжеловесного буквализма.
