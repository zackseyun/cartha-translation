  source_fidelity: 'Текст точно передаёт еврейскую конструкцию: «взяли» (וַיִּקְחוּ), «всю добычу» (כָּל־הַשָּׁלָל), «всё захваченное» (כָּל־הַמַּלְקוֹחַ), с указанием на людей и скот (בָּאָדָם וּבַבְּהֵמָה). Различие двух близких терминов передачи добычи сохранено настолько, насколько это естественно по-русски. «Людей и скот» корректно передаёт собирательные категории источника, не смягчая исторически трудного содержания.'
