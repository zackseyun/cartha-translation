  text: וַ/יִּקְחוּ֙ אֶת כָּל הַ/שָּׁלָ֔ל וְ/אֵ֖ת כָּל הַ/מַּלְק֑וֹחַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/011.yaml
  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: ru
  text: Они взяли всю добычу и всё захваченное — людей и скот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: добыча
  rationale: Обычное обозначение военной добычи; естественно и точно передаёт смысл в данном контексте.
- source_word: מַלְקוֹחַ
  choice: захваченное
  rationale: Отглагольное существительное обозначает то, что было взято или захвачено; формулировка сохраняет отличие от שָׁלָל, не конкретизируя сверх источника.
- source_word: אָדָם
  choice: людей
  rationale: В сочетании с собирательным описанием захваченного означает людей; русское множественное число здесь естественнее буквального «человека».
- source_word: בְּהֵמָה
  choice: скот
  rationale: В контексте военной добычи слово обозначает домашних животных, то есть скот, а не животных вообще.
theological_decisions: []
