  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: ru
  text: Тогда Моисей, священник Елеазар и все вожди общины[a] вышли им навстречу за пределы стана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводители общины»; возможно также: «князья собрания».'
    reason: Лексема נְשִׂיאִים обозначает глав или признанных руководителей сообщества, а הָעֵדָה может быть передано как «община» или «собрание».
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Форма глагола יצא обозначает движение наружу; «вышли» естественно передаёт последовательное повествовательное действие и направленность движения.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священник Елеазар
  rationale: Такой порядок слов естественен для современного русского языка и ясно передаёт должность Елеазара.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: все вожди общины
  rationale: נְשִׂיאִים здесь означает признанных руководителей народа, а не царей; «вожди» сохраняет общественно-племенной оттенок. הָעֵדָה передано как «община», то есть собранное сообщество Израиля.
- source_word: לִקְרָאתָם
  choice: им навстречу
  rationale: Оборот выражает цель движения; русское «вышли им навстречу» точно и естественно передаёт этот смысл.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Выражение указывает на место вне границ лагеря; «за пределы стана» сохраняет направление, заданное אֶל, и соответствует повествовательному библейскому регистру.
