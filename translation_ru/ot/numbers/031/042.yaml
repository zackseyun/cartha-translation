  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: ru
  text: А из половины, принадлежавшей сынам Израиля, которую Моисей отделил от доли мужчин, ходивших на войну[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несших военную службу»; или: «участвовавших в походе».'
    reason: Лексическое значение причастия допускает описание как военной службы, так и участия в конкретном походе.
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: А из половины
  rationale: Переданы и соединительный союз, и предлог; «половина» естественно обозначает одну из двух долей добычи в данном контексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: принадлежавшей сынам Израиля
  rationale: Сохранено буквальное мужское обозначение «сыны Израиля», а причастный оборот ясно выражает принадлежность этой половины.
- source_word: אֲשֶׁר
  choice: которую
  rationale: Относительное местоимение согласовано с antecedent «половины» и вводит определительное придаточное.
- source_word: חָצָה
  choice: отделил
  rationale: В контексте раздела добычи глагол означает выделение одной доли из другой; «отделил» точно и естественно передаёт это действие.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени.
- source_word: מִן הָ/אֲנָשִׁים
  choice: от доли мужчин
  rationale: Слово אֲנָשִׁים буквально означает «мужчины». Добавление «доли» делает подразумеваемое в контексте сравнение двух половин ясным и не создаёт впечатления, будто людей физически отделяли друг от друга.
- source_word: הַ/צֹּבְאִים
  choice: ходивших на войну
  rationale: Причастие от צבא обозначает мужчин, участвовавших в военном походе; выражение сохраняет военный смысл и соответствует контексту главы.
