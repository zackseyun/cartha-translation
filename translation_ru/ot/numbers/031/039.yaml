lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Ослов было
  rationale: חֲמֹרִים — обычное множественное число слова «осёл». Начальный союз в перечислении естественно передан русской конструкцией, продолжающей перечень.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30 500
  rationale: Еврейская числовая формула означает тридцать тысяч пятьсот; цифры уместны в инвентарном перечне.
- source_word: וּ/מִכְסָ/ם
  choice: дань[a] с них
  rationale: מֶכֶס здесь обозначает установленную долю добычи, отделяемую для Яхве. «Дань» сохраняет значение обязательного отчисления, а оборот «с них» ясно связывает число 61 с поголовьем ослов.
- source_word: לַ/יהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому предназначена дань; личное имя יהוה передано как «Яхве».
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: Обратный для русского языка порядок еврейских числительных означает «один и шестьдесят», то есть 61; цифры согласованы со стилем перечня.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер отчисления Яхве
  choice: дань
  alternative: сбор / установленная доля
  rationale: Текст говорит об обязательной доле военной добычи, а не уточняет более широкое богословское значение дара; перевод сохраняет этот конкретный смысл.
translation_notes:
  register: Современный литературный русский язык; краткая инвентарная формула оригинала сохранена. Числа переданы цифрами для ясности. Маркер сноски поставлен при слове, к которому относится лексическая альтернатива.
