  source_fidelity: Русский текст точно передаёт общий итог золота, характер תרומה как посвящённого приношения, действие представления дара Яхве, число 16 750 шекелей и происхождение дара от военачальников тысяч и сотен. Добавочное «оно поступило» идиоматично эксплицирует значение מֵאֵת («от, из числа/со стороны»), не меняя смысла.
