  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: ru
  text: И всё золото приношения[a], которое они принесли Яхве, составило шестнадцать тысяч семьсот пятьдесят шекелей; оно поступило от тысяченачальников и сотников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взноса»; традиционно: «возношения». Еврейское слово означает дар, отделённый для Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: И всё золото… составило
  rationale: Такая конструкция естественно передаёт связность повествования и вводит итоговый вес золота без буквального «и было».
- source_word: הַתְּרוּמָה
  choice: приношения
  rationale: Термин обозначает вклад, отделённый для священной цели; «приношение» естественно в данном культовом контексте, а возможная более конкретная передача вынесена в примечание.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: которое они принесли
  rationale: Hiphil от רום здесь означает представить или отделить дар, а не обязательно физически поднять его.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, сохраняя направленность приношения посредством русского дательного падежа.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: шестнадцать тысяч семьсот пятьдесят шекелей
  rationale: Прямая передача числительного и древней единицы веса; форма множественного числа соответствует нормам русского языка.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: оно поступило от тысяченачальников и сотников
  rationale: מֵאֵת указывает на источник. «Тысяченачальники» и «сотники» кратко и понятно передают военную иерархию командиров тысяч и сотен.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя Бога; «Яхве» прямо передаёт заветное имя и не заменяет его титулом.
- issue: Характер תְּרוּמָה
  choice: приношение
  alternative: взнос; возношение
  rationale: «Приношение» сохраняет религиозный характер дара и остаётся понятным современному читателю, не навязывая представления о буквальном ритуальном поднятии.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Военные звания переданы традиционными и понятными словами «тысяченачальники» и «сотники»; точка с запятой помогает ясно связать итоговый вес с источником золота.
