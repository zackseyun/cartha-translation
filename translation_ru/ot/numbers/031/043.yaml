  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: ru
  text: Половина мелкого скота, выделенная общине, составляла 337 500 голов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: составляла
  rationale: В контексте числового итога форма היה обозначает получившееся количество; «составляла» естественно передаёт это в современном русском языке.
- source_word: מֶחֱצַת הָעֵדָה
  choice: половина, принадлежавшая общине
  rationale: Конструкция указывает на одну из двух распределённых долей — долю общины. Такая формулировка яснее буквального «половина общины», которое могло бы означать половину людей.
- source_word: הָעֵדָה
  choice: общине
  rationale: עֵדָה обозначает общество или общину Израиля; «община» сохраняет коллективный смысл и не привносит позднейшего церковного оттенка.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз. «Мелкий скот» точно передаёт категорию животных и в данном перечне яснее общего слова «стадо».
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337 500
  rationale: Еврейская последовательность чисел даёт сумму 300 000 + 30 000 + 7 000 + 500. Цифровая запись удобна и точна для перечня.
