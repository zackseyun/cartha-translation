- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: тридцать шесть тысяч
  rationale: Буквально порядок числительных — «шесть и тридцать тысяч», однако современный русский нормативно выражает это количество как «тридцать шесть тысяч».
