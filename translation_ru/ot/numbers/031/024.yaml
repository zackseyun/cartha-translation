  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: ru
  text: На седьмой день выстирайте свои одежды и будете чисты[a]. После этого войдёте в лагерь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очиститесь». Речь идёт о состоянии ритуальной чистоты после предписанного омовения.'
    reason: lexical_alternative
  - marker: b
    text: В контексте это означает, что после завершения очищения можно вернуться в лагерь.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְכִבַּסְתֶּם בִּגְדֵיכֶם
  choice: вымойте свою одежду
  rationale: Пиэль глагола כבס обозначает стирку или мытьё одежды. Повелительная форма естественно передаёт предписание в данном контексте; единственное число «одежду» употреблено собирательно и звучит по-русски естественно.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: на седьмой день
  rationale: Точное и идиоматичное соответствие еврейскому обозначению времени.
- source_word: וּטְהַרְתֶּם
  choice: и станете чисты
  rationale: 'Форма Qal имеет здесь результативное значение: после предписанного омовения люди обретают состояние ритуальной чистоты. Перевод не приписывает им дополнительного действия и не смешивает ритуальную чистоту с нравственной.'
- source_word: וְאַחַר
  choice: после этого
  rationale: 'Естественно передаёт последовательность: войти в лагерь можно по завершении очищения.'
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: можете войти в лагерь
  rationale: Буквально конструкция означает «войдёте в лагерь», но в обрядовом контексте указывает на разрешённое возвращение после восстановления чистоты.
theological_decisions:
- issue: Язык ритуальной чистоты
  choice: станете чисты
  alternative: очиститесь; будете очищены
  rationale: Так сохраняется обозначение результата — состояния ритуальной чистоты — без привнесения нравственного или духовного смысла и без излишнего уточнения того, кто совершает очищение.
- issue: Характер возвращения в лагерь
  choice: можете войти
  alternative: войдёте
  rationale: Контекст указывает на разрешение войти после завершения очищения, хотя еврейская глагольная форма сама по себе может быть передана будущим временем.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной формулировкой. «Лагерь» выбрано вместо более архаичного «стан»; ритуальная терминология сохранена без конфессиональных уточнений.
