  text: וַ/יָּבִ֡אוּ אֶל מֹשֶׁה֩ וְ/אֶל אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/אֶל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הַ/שְּׁבִ֧י וְ/אֶת הַ/מַּלְק֛וֹחַ וְ/אֶת הַ/שָּׁלָ֖ל אֶל הַֽ/מַּחֲנֶ֑ה אֶל עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל יַרְדֵּ֥ן יְרֵחֽוֹ־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: ru
  text: Они доставили пленных, захваченное имущество и военную добычу к Моисею, священнику Елеазару и общине сынов Израиля, в стан на равнинах Моава[a], у Иордана, близ Иерихона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в степях Моава».'
    reason: Лексема עֲרָבוֹת может обозначать равнинные степные пространства; оба русских варианта возможны.
  - marker: b
    text: 'Или: «у Иордана напротив Иерихона». Буквально: «у Иордана Иерихона».'
    reason: Краткая еврейская географическая конструкция связывает это место с Иорданом и Иерихоном; «напротив Иерихона» является возможным контекстуальным уточнением, но не должно навязываться основному тексту.
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: доставили
  rationale: Каузативная порода глагола בוא означает «привести, принести, доставить». Русское «доставили» естественно охватывает и пленных, и имущество.
- source_word: הַשְּׁבִי
  choice: пленных
  rationale: В военном контексте существительное обозначает взятых в плен людей, а не отвлечённое состояние плена.
- source_word: הַמַּלְקוֹחַ
  choice: захваченное имущество
  rationale: Слово обозначает захваченное, в том числе движимое имущество и скот. Такой перевод позволяет отличить его от следующего термина שׁלל.
- source_word: הַשָּׁלָל
  choice: военную добычу
  rationale: Обычный термин для добычи, взятой на войне. Уточнение «военную» передаёт контекст и сохраняет различие с מלקוח.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: общине сынов Израиля
  rationale: עֵדָה обозначает общину как собранный народ, а «сыны Израиля» прозрачно сохраняет еврейское родовое выражение.
- source_word: אֶל הַמַּחֲנֶה
  choice: в стан
  rationale: Предлог אֶל указывает направление. В данном контексте естественный русский оборот «в стан» не требует уточнять, вошли ли они внутрь лагеря.
- source_word: עַרְבֹת מוֹאָב
  choice: равнинах Моава
  rationale: Устойчивое и понятное географическое обозначение низменных равнин Моава; вариант «степях» отмечен в сноске.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: у Иордана напротив Иерихона
  rationale: Фраза локализует моавские равнины у Иордана со стороны, противоположной Иерихону. «Напротив» ясно передаёт географическое отношение, подразумеваемое контекстом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Стан» сохранён как понятное традиционное обозначение лагеря; синтаксис упрощён без устранения трёх отдельных категорий захваченного.
