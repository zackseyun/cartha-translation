  text: וְ/נֶ֣פֶשׁ אָדָ֔ם מִן הַ֨/נָּשִׁ֔ים אֲשֶׁ֥ר לֹֽא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר כָּל נֶ֕פֶשׁ שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: ru
  text: А женщин, которые не познали мужского ложа[a], — всего тридцать две тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не познали ложа мужчины»; это выражение означает, что они не вступали в половые отношения с мужчиной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: человек
  rationale: В контексте подсчёта добычи сочетание обозначает людей в отличие от скота; по-русски это естественно передаётся счётной формулой «человек».
- source_word: מִן הַנָּשִׁים
  choice: женщин
  rationale: Предлог указывает на выделяемую из числа женщин группу; русская конструкция после начального «А» естественно передаёт этот смысл без тяжеловесного «из женщин».
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: которые не познали
  rationale: Сохранён традиционно понятный библейский эвфемизм ידע «познать», здесь относящийся к половым отношениям.
- source_word: מִשְׁכַּב זָכָר
  choice: мужского ложа
  rationale: Формально передаёт еврейское выражение и сохраняет его эвфемистический характер; значение поясняется в сноске.
- source_word: כָּל נֶפֶשׁ
  choice: всего … человек
  rationale: Повторное נֶפֶשׁ вводит итоговое число; русская счётная формула естественнее буквального «всех душ» и точно выполняет ту же функцию.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: тридцать две тысячи
  rationale: Стандартная русская передача числительного; форма «две» согласуется с подразумеваемым исчислением женщин.
