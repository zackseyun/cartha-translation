lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: и ... ослов
  rationale: Союз וַ продолжает перечень добычи из предыдущих стихов, поэтому передан как «и». חֲמֹרִים — обычное множественное число существительного «осёл»; форма «ослов» естественна в современном русском языке.
- source_word: אֶחָד וְ/שִׁשִּׁים אָלֶף
  choice: 61 000
  rationale: Еврейская числовая конструкция буквально имеет порядок «одна и шестьдесят тысяч» и обозначает 61 000. Запись цифрами ясна и уместна в перечне добычи, точно сохраняя количество.
