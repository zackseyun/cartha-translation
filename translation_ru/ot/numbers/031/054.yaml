base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: ru
  text: Моисей и священник Елеазар взяли золото у командиров тысяч и сотен и внесли его в шатёр собрания как памятный знак для сынов Израиля[a] перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для израильтян». Буквально: «для сынов Израиля» — традиционное заветное наименование народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взяли
  rationale: Форма единственного числа стоит перед составным подлежащим «Моисей и Елеазар»; по нормам современного русского языка употреблено множественное число. Основное значение לקח — «брать»; контекстуально возможное «приняли» менее точно передаёт форму исходного текста.
- source_word: הַזָּהָב
  choice: золото
  rationale: Речь идёт о конкретном золоте, уже названном в контексте; в русском языке определённость выражается контекстом, без артикля.
- source_word: מֵאֵת
  choice: у
  rationale: Предлог обозначает источник получения. В сочетании «взяли золото у командиров» русское «у» естественнее буквального «от».
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: командиров тысяч и сотен
  rationale: שׂרים в данном военном контексте — командиры, а «тысячи» и «сотни» обозначают воинские подразделения. Формулировка сохраняет устройство исходного выражения и понятна современному читателю.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр собрания
  rationale: Передано устойчивое обозначение священного шатра, где происходила встреча с Богом. «Шатёр» прямо соответствует אֹהֶל, а «собрания» сохраняет узнаваемый библейский термин без замены на более специальное «скиния».
- source_word: זִכָּרוֹן
  choice: памятным знаком
  rationale: Существительное означает то, что служит напоминанием или памятованием. Конструкция «чтобы оно было памятным знаком» естественно выражает назначение принесённого золота.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохранено буквальное и заветное обозначение בני ישראל. Более идиоматичное «для израильтян» дано в сноске.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Краткое возвышенное «пред» естественно передаёт нахождение перед лицом или в присутствии Бога в культовом контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача בני ישראל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранена грамматическая и заветная форма исходного выражения, при этом идиоматичный русский эквивалент указан в сноске.
- issue: Связь выражения זִכָּרוֹן לִבְנֵי יִשְׂרָאֵל
  choice: памятный знак для сынов Израиля
  alternative: напоминание о сынах Израиля
  rationale: Предлог לְ прежде всего передан как «для», без богословского уточнения, кому именно этот знак должен напоминать об Израиле. Формулировка сохраняет возможную смысловую напряжённость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского языка, при этом сохранены военные наименования подразделений, культовый контекст и личное имя Яхве.
