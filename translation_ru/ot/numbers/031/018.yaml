  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: ru
  text: А всех девочек среди женщин, не познавших мужского ложа[a], оставьте в живых для себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «не имевших половых отношений с мужчиной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: А всех
  rationale: Союз וְ продолжает повеление, противопоставляя эту группу названным ранее; по-русски естественно «А». Собирательное הַטַּף в данном контексте передано формой множественного числа, поэтому כֹל — «всех».
- source_word: הַ/טַּף בַּ/נָּשִׁים
  choice: девочек среди женщин
  rationale: טַף обозначает детей или малых; сочетание с בַּנָּשִׁים и последующее уточнение ограничивают здесь круг лиц женским полом. «Девочек» выражает это естественно, а «среди женщин» сохраняет группирующее значение בְּ.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: которые не знали
  rationale: יָדַע в данном обороте служит эвфемизмом сексуальных отношений. Буквальное «не знали» сохраняет эвфемистический характер исходного текста.
- source_word: מִשְׁכַּב זָכָר
  choice: ложа мужчины
  rationale: Буквально речь идёт о «ложе/лежании мужчины (самца)» как идиоме половой связи. «Ложе мужчины» сохраняет образ и остаётся понятным в dignified современном русском; более явное значение вынесено в сноску.
- source_word: הַחֲיוּ לָ/כֶם
  choice: оставьте в живых для себя
  rationale: Каузативное повеление от חיה означает «сохраните/оставьте в живых». «Для себя» прямо сохраняет לָכֶם, не уточняя предполагаемую дальнейшую участь сверх сказанного в тексте.
theological_decisions:
- issue: Следует ли раскрывать сексуальный эвфемизм непосредственно в основном тексте
  choice: Сохранить выражение «не знали ложа мужчины».
  alternative: «не имели половых отношений с мужчиной» или «были девственницами»
  rationale: Еврейский текст употребляет эвфемистический оборот, а не отвлечённое обозначение девственности. Сохранение образа удерживает формулировку и напряжённость источника; ясное объяснение даётся в сноске.
- issue: Насколько явно обозначить женский пол при передаче טַף
  choice: Передать как «девочек».
  alternative: «детей» или «малых»
  rationale: Само טַף не обязательно указывает на пол, однако ближайшее определение «среди женщин» и дальнейшее сексуальное уточнение однозначно выделяют лиц женского пола. Русское «девочек» естественно выражает референт в контексте.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Оборот «ложе мужчины» намеренно сохраняет древнееврейский эвфемистический образ; синтаксис сделан естественным для русского языка. Маркер [a] помещён непосредственно после поясняемого выражения.
