    issue: «ходивших на войну»
    rationale: Оборот понятен, но הַיֹּצְאִים לַצָּבָא обозначает тех, кто выступил в военный поход; «выступавших в поход» точнее и стилистически уместнее.
  - severity: low
    issue: 'Формулировка сноски a: «Буквально: одну жизнь»'
