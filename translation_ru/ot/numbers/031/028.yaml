  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: ru
  text: 'И отдели для Яхве дань из доли воинов, выступавших в поход: по одному живому существу[a] из каждых пятисот — из людей[b], крупного скота, ослов и мелкого скота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по одной душе (нефеш) из пятисот». Еврейское слово здесь служит счётным обозначением отдельного живого существа — как человека, так и животного.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду человеческая часть захваченной добычи, в отличие от перечисленных далее животных.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: И отдели как дань
  rationale: Глагол в породе hифиль означает выделить или изъять определённую долю, а существительное מֶכֶס — обязательный сбор. Такое сочетание естественно передаёт оба элемента.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: из доли воинов, ходивших на войну
  rationale: Предлог מֵאֵת указывает, из чьей части добычи следует взять дань; «ходивших на войну» сохраняет смысл участников похода и избегает двусмысленного «вышедших к войску».
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: по одному живому существу из каждых пятисот
  rationale: נֶפֶשׁ здесь служит общим счётным обозначением отдельного живого существа и относится как к людям, так и к животным. «Из каждых пятисот» ясно выражает норму сбора.
- source_word: מִן הָאָדָם
  choice: из людей
  rationale: אָדָם обозначает человеческую часть добычи в противопоставлении последующему перечню животных.
- source_word: וּמִן הַבָּקָר
  choice: крупного скота
  rationale: בָּקָר обозначает крупный рогатый скот или стадо такого скота; конкретное русское обозначение отличает его от צֹאן.
- source_word: וּמִן הַחֲמֹרִים
  choice: ослов
  rationale: Прямое современное соответствие множественному числу חֲמֹרִים.
- source_word: וּמִן הַצֹּאן
  choice: мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; «мелкий скот» точно охватывает обе группы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон, поэтому личное имя сохраняется в принятой русской транслитерации без замены титулом.
- issue: Значение נֶפֶשׁ в норме дани
  choice: живое существо
  alternative: душа
  rationale: В данном перечне слово охватывает людей и животных; «душа» могла бы неоправданно придать выражению узкий метафизический смысл.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Повелительное «отдели» соответствует обращению к Моисею в ближайшем контексте; перечень сделан компактным и естественным для русского языка.
