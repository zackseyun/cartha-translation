  source_fidelity: В целом перевод верно передаёт обязательное выделение доли для Яхве, норму «один из пятисот» и охват людей и животных. «Из доли воинов» оправдано ближайшим контекстом раздела добычи, но причастный оборот точнее передать как участие в военном походе, а не разговорное «ходивших на войну».
  naturalness: Текст литературный и понятный. «Выступавших в поход» естественнее в законодательном и повествовательном регистре Пятикнижия; «для Яхве» яснее выражает назначение дани, чем несколько неоднозначное «как дань Яхве».
  terminology: '«Яхве», «дань», «живое существо», «крупный скот» и «мелкий скот» удачны. Примечания корректно объясняют широкое счётное употребление נֶפֶשׁ и значение אָדָם в данном перечне. Формулировку «буквально: одну жизнь» следует уточнить, поскольку в русском это может ошибочно звучать как буквальная калька, тогда как в контексте это счётное обозначение единицы живого существа.'
  issues:
