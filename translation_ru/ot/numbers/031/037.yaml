  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: ru
  text: И дань Яхве из мелкого скота составила шестьсот семьдесят пять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И … составила
  rationale: В данном повествовательном контексте форма היה вводит итоговое количество; русское «составила» естественно связывает названную долю с числом.
- source_word: הַמֶּכֶס
  choice: доля
  rationale: Здесь מֶכֶס обозначает установленную часть военной добычи, отделённую для Яхве. «Доля» ясно передаёт смысл в контексте и не вызывает современных налоговых ассоциаций.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל обозначает предназначение или посвящение этой части Яхве.
- source_word: יהוה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление имени в еврейском тексте.
- source_word: מִן הַצֹּאן
  choice: из мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; «мелкий скот» сохраняет широту значения, не сужая его до одних овец.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: шестьсот семьдесят пять
  rationale: Точная и естественная передача количественного числительного на современном русском языке.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как имя; «Яхве» сохраняет различие между личным именем и титулом, не добавляя отсутствующий в тексте титул.
- issue: Характер части, предназначенной Яхве
  choice: доля для Яхве
  alternative: дань Яхве
  rationale: Контекст говорит об установленной части добычи, посвящённой Яхве. «Доля» передаёт это без лишнего оттенка политического подчинения, возможного у слова «дань».
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формулировка сохраняет структуру итогового подсчёта. «Мелкий скот» употреблено как точный собирательный термин для овец и коз.
