  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: ru
  text: Моисей послал их на войну — по тысяче от каждого колена, — а вместе с ними послал на войну Финееса, сына священника Елеазара, со священными предметами[a] и трубами для подачи боевого сигнала[b] в руках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды святилища»; или: «священные принадлежности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трубы для подачи сигнала»; или: «трубы тревоги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח; современное и естественное русское соответствие без лишнего оттенка официального командирования.
- source_word: אֶלֶף לַמַּטֶּה
  choice: по тысяче от каждого колена
  rationale: Передаёт распределительное значение конструкции и ясно указывает, что каждое колено выставило тысячу человек.
- source_word: לַצָּבָא
  choice: на войну
  rationale: В данном контексте צבא обозначает военный поход или участие в войне, а не войско как учреждение; формулировка сохраняет направленность еврейской конструкции.
- source_word: אֹתָם ... אֹתָם
  choice: их ... их вместе с Финеесом
  rationale: Повторение местоимения сохранено, чтобы отразить возобновление и подчёркивание объекта в еврейском тексте, но оформлено приемлемо для русского синтаксиса.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Финеес, сын священника Елеазара
  rationale: Традиционные русские формы имён сочетаются с прямой передачей того, что Елеазар назван священником.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: священные принадлежности
  rationale: כְּלִי может обозначать сосуд, орудие, предмет или принадлежность; широкий вариант не уточняет вид предметов, которого исходный текст не называет. Альтернативы приведены в сноске.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: трубы для боевого сигнала
  rationale: תְּרוּעָה здесь обозначает громкий трубный сигнал в военном контексте. Перевод передаёт функцию труб, не отождествляя сигнал исключительно с криком или тревогой.
- source_word: בְּיָדוֹ
  choice: в руках у Финееса
  rationale: Единственное число местоименного суффикса естественнее всего относится к ближайшему лицу — Финеесу. Русское «в руках» идиоматично выражает, что предметы находились при нём и под его ответственностью.
theological_decisions:
- issue: Роль Финееса и священных предметов в военном походе
  choice: Финеес отправляется вместе с войском как священнический представитель; при нём находятся священные принадлежности и сигнальные трубы.
  alternative: Считать Финееса лишь наблюдателем либо отрицать связь священных предметов с его священнической ролью.
  rationale: Стих непосредственно связывает участие Финееса, священные принадлежности и трубы с походом. Перевод сохраняет эту культово-военную связь, не добавляя более широкой доктрины о священной войне.
- issue: Референт местоимения в בְּיָדוֹ
  choice: 'Явно назвать Финееса: «в руках у Финееса».'
  alternative: Сохранить неопределённое «в его руках» либо отнести выражение ко всему отряду.
  rationale: Ближайший грамматически подходящий антецедент в единственном числе — Финеес. Явное имя устраняет неестественную для русского языка местоименную неясность, не расширяя содержание.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упорядочен ради ясности: заключительное בְּיָדוֹ передано отдельным предложением, а Финеес назван прямо. Лексическая неопределённость כְּלֵי הַקֹּדֶשׁ и функциональный диапазон תְּרוּעָה сохранены через сноски.'
