revisions:
- from: Моисей послал их на войну — по тысяче от каждого колена, — их вместе с Финеесом, сыном священника Елеазара. В руках у Финееса были священные принадлежности[a] и трубы для боевого сигнала[b].
  to: Моисей послал их на войну — по тысяче от каждого колена, — а вместе с ними послал на войну Финееса, сына священника Елеазара, со священными предметами[a] и трубами для подачи боевого сигнала[b] в руках.
  rationale: Перевод перестроен, чтобы ясно передать, что Финеес отправлен вместе с военным отрядом и что священные предметы и трубы находятся у него. Сохранены распределительное «по тысяче от каждого колена», военная направленность обоих употреблений לַצָּבָא и лексическая широта כְּלֵי הַקֹּדֶשׁ через сноску. Оборот «в руках» оставляет буквальный образ בְּיָדוֹ, не добавляя сведений о конкретных предметах.
