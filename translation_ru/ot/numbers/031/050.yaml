source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: ru
  text: 'Итак, мы принесли Яхве приношение: каждый принёс то, что нашёл, — золотые изделия: обручи для рук[a], браслеты, кольца, серьги и подвески[b], — чтобы совершить искупление за нас самих[c] перед Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «ножные браслеты». Точное значение еврейского слова אֶצְעָדָה не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: Точный вид украшения, обозначенного словом כּוּמָז, неизвестен; возможны переводы «ожерелья», «украшения» или «носовые кольца».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «за наши жизни»; еврейское слово может также обозначать самих людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: мы принесли
  rationale: В породе хифиль глагол קרב означает «приблизить, принести». По-русски «принесли» естественно передаёт поднесение дара; «итак» отражает связующий וַ.
- source_word: קָרְבַּן יְהוָה
  choice: дар Яхве
  rationale: קָרְבָּן — то, что приносят или подносят; «дар» сохраняет широкое культовое значение, не уточняя без основания вид жертвы. Конструкция с именем Бога допускает понимание дара, предназначенного Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени от титула «Господь».
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: каждый — то, что нашёл
  rationale: אִישׁ употреблено дистрибутивно о мужчинах-воинах; русское «каждый» естественно выражает распределительное значение в данном контексте.
- source_word: כְלִי זָהָב
  choice: из золотых изделий
  rationale: כְלִי — широкий термин для предмета или изделия. Оборот связывает его с последующим перечнем украшений, не сводя значение к одному виду вещи.
- source_word: אֶצְעָדָה
  choice: ножные браслеты
  rationale: Редкое слово обозначает украшение конечности; связь с корнем צעד («шагать») и употребление в Ис 3:20 поддерживают значение украшения на ноге, хотя точная идентификация не бесспорна.
- source_word: צָמִיד
  choice: браслеты
  rationale: Обычное обозначение обруча или украшения, носимого на руке; «браслеты» ясно и естественно в современном русском.
- source_word: טַבַּעַת
  choice: кольца
  rationale: Слово означает кольцо, но само по себе не требует более узкого значения «перстень с печатью».
- source_word: עָגִיל
  choice: серьги
  rationale: В перечне личных украшений слово естественно обозначает серьгу; это также отличает предмет от טַבַּעַת.
- source_word: כוּמָז
  choice: украшения
  rationale: Точная разновидность предмета неизвестна. Обобщённое «украшения» избегает необоснованного уточнения; неопределённость отмечена в сноске.
- source_word: לְכַפֵּר
  choice: чтобы совершить искупление
  rationale: Глагол כפר в культовом контексте имеет смысл совершения искупления или очищения. Формулировка сохраняет богословский вес термина, не уточняя его механизм.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: за наши жизни
  rationale: נֶפֶשׁ здесь может обозначать жизнь или самого человека. Буквальное «за наши жизни» сохраняет образ исходного текста и не вносит позднейшего противопоставления души и тела.
theological_decisions:
- issue: Связь дара с כפר
  choice: Дар представлен как приношение, посредством которого перед Яхве совершается искупление за принесших его.
  alternative: Понимать дар только как благодарственное приношение либо переводить כפר некультовым выражением «отвести опасность».
  rationale: Сочетание קָרְבַּן, глагола כפר и выражения «перед Яхве» требует сохранить язык искупления. Перевод при этом не определяет точный механизм или характер искупления сверх сказанного в тексте.
- issue: Референт אִישׁ
  choice: Передать дистрибутивно как «каждый» в контексте мужчин-воинов.
  alternative: «Каждый человек» или «каждый мужчина».
  rationale: Контекст ясно указывает на мужчин, а русское «каждый» достаточно сохраняет грамматический род и звучит естественнее в эллиптической конструкции.
- issue: Значение עַל נַפְשֹׁתֵינוּ
  choice: «за наши жизни»
  alternative: «за нас самих» или «за наши души».
  rationale: Так сохраняется смысл נֶפֶשׁ как жизни/лица и подлинная смысловая широта выражения без навязывания антропологического учения о душе.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис слегка приподнят, но понятен обычному читателю. Редкие названия украшений не архаизированы; реальные лексические сомнения вынесены в сноски.
