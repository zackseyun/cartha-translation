base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Моисей передал Елеазару, священнику, установленную долю[a] — приношение для Яхве[b], как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сбор», «обязательная доля» — установленная часть военной добычи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приношение Яхве»; традиционно: «возношение Господу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן в данном контексте означает передачу назначенной доли Елеазару; «отдал» естественно передаёт завершённое повествовательное действие.
- source_word: מֶכֶס
  choice: дань
  rationale: Слово обозначает установленную долю, изъятую из военной добычи. «Дань» передаёт обязательный характер этой доли, не вызывая прямых ассоциаций с современной системой налогообложения.
- source_word: תְּרוּמַת יְהוָה
  choice: приношение для Яхве
  rationale: תְּרוּמָה — выделенное приношение или священный взнос. Предлоговое выражение «для Яхве» ясно показывает предназначение этой доли и не приписывает ей более узкого ритуального значения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: священнику Елеазару
  rationale: Естественный русский порядок слов точно передаёт адресата и его служение.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Формула указывает на точное исполнение ранее данного повеления; в русском совершенный вид естественно выражает его предшествование.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Связь תְּרוּמַת יְהוָה с מֶכֶס
  choice: «приношение для Яхве» поясняет, чем являлась дань
  alternative: понимать как второе, отдельное приношение
  rationale: Синтаксически выражение стоит в приложении к מֶכֶס и характеризует установленную долю добычи как предназначенную Яхве.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Тире выделяют пояснительное приложение и делают синтаксическую связь прозрачной. Все примечания поставлены непосредственно после соответствующих выражений.
