  variant: modern literary Russian
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: ru
  text: 'Вот они — эти женщины: по слову Валаама[a] они склонили сынов Израиля к неверности Яхве в деле Фегора, и мор постиг общину Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по совету Валаама», «по наставлению Валаама». Буквально: «по слову Валаама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Вот, именно эти женщины
  rationale: Удвоенная указательно-восклицательная конструкция подчёркивает, что речь идёт именно об упомянутых женщинах; женский род местоимения передан явно из контекста.
- source_word: בִּדְבַר בִּלְעָם
  choice: по слову Валаама
  rationale: Сохраняет буквальное значение דָּבָר («слово»), не исключая подразумеваемых совета или наставления; альтернативы отмечены в сноске.
- source_word: לִמְסָר מַעַל
  choice: склонили … изменить
  rationale: Инфинитив от מסר выражает посредническую причинность, а מעל — нарушение верности. «Склонили … изменить» естественно передаёт то, что женщины побудили Израиль к неверности, не утверждая принуждения.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет мужское множественное выражение исходного текста и его традиционное обозначение народа Израиля.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог при מעל обозначает того, против кого совершено нарушение верности; в русском управлении глагола «изменить» это выражается дательным падежом.
- source_word: עַל דְּבַר פְּעוֹר
  choice: в деле Фегора
  rationale: Передаёт отсылку к событию, связанному с Фегором, без добавления в основной текст имени Ваал-Фегора.
- source_word: וַתְּהִי הַמַּגֵּפָה בַּעֲדַת יְהוָה
  choice: и за это поражение постигло общину Яхве
  rationale: Последовательная форма указывает на последствие; «за это» естественно обозначает причинную связь. «Поражение» сохраняет библейский смысл массового бедствия/мора, а «община» передаёт עֵדָה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное заветное имя, без замены титулом.
- issue: Характер неверности, выраженной מעל
  choice: изменить Яхве
  alternative: поступить неверно против Яхве; совершить преступление против Яхве
  rationale: Формулировка сохраняет личностно-заветный оттенок нарушения верности и не сужает его до одного конкретного вида проступка.
- issue: Степень участия женщин
  choice: склонили сынов Израиля
  alternative: заставили сынов Израиля; стали причиной неверности сынов Израиля
  rationale: Текст приписывает женщинам посредническую причинность в поступке Израиля; «склонили» сохраняет ответственность обеих сторон и не предполагает физического принуждения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранены традиционные формы имён «Валаам» и «Фегор», а также формальное выражение «сыны Израиля». Маркер [a] помещён непосредственно после поясняемой фразы.
