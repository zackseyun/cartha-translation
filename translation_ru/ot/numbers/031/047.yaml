  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Из половины, причитавшейся сынам Израиля[a], Моисей взял по одному из каждых пятидесяти[b] — как из людей, так и из скота — и отдал их левитам, нёсшим службу при скинии Яхве, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля», то есть израильтянам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одного взятого из каждых пятидесяти».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Из половины, причитавшейся сынам Израиля
  rationale: Конструкция обозначает половину добычи, выделенную израильтянам. Добавление «причитавшейся» ясно передаёт отношение принадлежности, подразумеваемое сопряжённой конструкцией, а «сынам Израиля» сохраняет форму еврейского выражения.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: по одному из каждых пятидесяти
  rationale: В контексте установленного сбора выражение означает одну взятую долю на каждые пятьдесят. Русская распределительная конструкция естественно передаёт этот смысл, не превращая «одно» в абстрактный процент.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: как из людей, так и из скота
  rationale: אָדָם употреблено собирательно о людях, а בְּהֵמָה — о домашних животных. Парная конструкция «как… так и…» ясно показывает, что норма применялась к обеим категориям.
- source_word: וַיִּתֵּן אֹתָם
  choice: и отдал их
  rationale: Местоименный суффикс во множественном числе относится ко всем отобранным людям и животным; «их» сохраняет число исходного текста.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: левитам, исполнявшим обязанности при скинии Яхве
  rationale: Сочетание однокоренных слов שׁמר и מִשְׁמֶרֶת указывает на вверенное служение, надзор или охрану. «Исполнявшим обязанности при» передаёт служебную ответственность без неестественного для русского повтора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Яхве повелел Моисею
  rationale: Оборот выражает точное соответствие ранее данному повелению; русский совершенный вид естественно передаёт предшествующее действие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет буквальный родственный образ еврейского выражения; сноска поясняет его коллективное значение и не ограничивает группу только непосредственными сыновьями патриарха.
- issue: Характер обязанностей левитов при скинии
  choice: исполнявшим обязанности при скинии
  alternative: охранявшим скинию; нёсшим службу при скинии
  rationale: Еврейское выражение допускает оттенки несения вверенной службы, надзора и охраны. Выбранная формулировка сохраняет широту смысла и не сводит роль левитов лишь к физической охране.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским термином «скиния». Синтаксис упрощён для ясного чтения, но сохранены распределительная норма, смешанный объект «люди и скот», личное имя Яхве и смысл вверенного левитам служения.
