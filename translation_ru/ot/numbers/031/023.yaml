id: NUM.31.23
reference: Numbers 31:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: ru
  text: Всё, что выдерживает огонь, проведите через огонь, и оно станет чистым; однако его следует также очистить водой для очищения от нечистоты[a]. А всё, что не выдерживает огня, проведите через воду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «водой нечистоты»; традиционный перевод: «водой отделения» (ср. Числа 19).'
    reason: Лексическое значение נִדָּה допускает буквальную передачу «нечистота» и традиционное обозначение ритуального отделения; сноска сохраняет эту особенность выражения.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Всё
  rationale: В данном контексте выражение охватывает каждый предмет из военной добычи; русское «всё» естественно передаёт собирательно-распределительный смысл.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: что выдерживает огонь
  rationale: Речь идёт о предметах, пригодных для очищения огнём. Такая формулировка передаёт практический смысл оборота, а не просто факт попадания в огонь.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: проведите через огонь
  rationale: Каузатив глагола עבר означает «заставить пройти, провести»; перевод сохраняет образ ритуального пропускания через огонь.
- source_word: וְטָהֵר
  choice: и оно станет чистым
  rationale: Глагол обозначает достигнутое состояние чистоты; перевод не смешивает этот результат с последующим отдельным предписанием об очищении водой.
- source_word: אַךְ
  choice: однако
  rationale: Частица вводит существенную оговорку к утверждению о чистоте после обработки огнём.
- source_word: בְּמֵי נִדָּה
  choice: водой для очищения от нечистоты
  rationale: Выражение указывает на особую воду, применяемую при ритуальном очищении (ср. Числа 19). Основной текст ясно передаёт её назначение, а буквальная и традиционная передачи отмечены в сноске.
- source_word: יִתְחַטָּא
  choice: его следует также очистить
  rationale: В священническом контексте форма глагола חטא означает подвергнуть предмет ритуальному очищению, а не очистить его от нравственного греха. «Также» ясно показывает, что водное очищение требуется наряду с обработкой огнём.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: А всё, что не выдерживает огня
  rationale: Противопоставляются огнестойкие предметы и предметы, которые нельзя подвергать действию огня.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: проведите через воду
  rationale: Сохранён тот же каузативный глагол и параллелизм с предписанием провести предметы через огонь.
theological_decisions:
- issue: Характер очищения в священническом законе
  choice: Передать предписание как ритуальное очищение от нечистоты.
  alternative: Понять глагол חטא как очищение от нравственного греха.
  rationale: Контекст Чисел 31 и связанное с ним установление в Числах 19 касаются ритуальной нечистоты предметов, а не прощения нравственной вины.
- issue: Соотношение огненной обработки и очистительной воды
  choice: Сохранить требование обоих действий для предметов, выдерживающих огонь.
  alternative: Понять водное очищение как замену огненной обработке.
  rationale: 'Частица אַךְ вводит дополнительное условие: огонь делает предмет чистым, но предписание о специальной воде всё равно остаётся в силе.'
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формой законодательного предписания. Параллелизм «через огонь — через воду» сохранён; специализированная ритуальная лексика разъяснена без конфессиональных добавлений.
