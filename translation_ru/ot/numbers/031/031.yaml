source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: ru
  text: И Моисей и священник Елеазар сделали так, как повелел Моисею Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: Указывает написание Божьего имени в еврейском тексте и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделали
  rationale: Глагол עשה здесь обобщает исполнение предшествующего повеления; сочетание «сделали так, как повелел» естественно передаёт еврейскую конструкцию соответствия.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: וְאֶלְעָזָר
  choice: и Елеазар
  rationale: Переданы соединительный союз и общепринятая русская форма личного имени.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Аппозитивный титул Елеазара; выбран прямой и понятный современному читателю эквивалент.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Передаёт значение соответствия действия данному повелению и естественно звучит в современном русском языке.
- source_word: צִוָּה
  choice: повелел
  rationale: В данном торжественно-повествовательном контексте точно передаёт властное предписание; временная последовательность ясна из контекста и не требует отдельной грамматической маркировки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного Божьего имени, а не заменён титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: Еврейский показатель прямого дополнения не переводится; при русском глаголе «повелеть» адресат естественно ставится в дательном падеже.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; форма «Яхве» сохраняет личное имя и соответствует наиболее распространённой научной реконструкции произношения, тогда как «Господь» является традиционной заменой титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок «Моисей и священник Елеазар» сохраняет исходную последовательность участников; формула «сделали так, как повелел» ясна и естественна.
