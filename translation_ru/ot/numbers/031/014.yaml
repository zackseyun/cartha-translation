base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: ru
  text: И разгневался Моисей на начальников войска — тысяченачальников и сотников, возвращавшихся из военного похода.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приходивших с военной службы во время войны». Еврейское выражение включает значения войска, военной службы и войны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: И разгневался
  rationale: Глагол קצף выражает гнев; «разгневался» естественно передаёт повествовательную форму и силу исходного слова, не усиливая её до «пришёл в ярость».
- source_word: פְּקוּדֵי הֶחָיִל
  choice: на начальников войска
  rationale: Форма от פקד обозначает поставленных над войском должностных лиц; «начальники войска» сохраняет военно-административный смысл.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: тысяченачальников
  rationale: Традиционное и понятное русское обозначение командиров подразделений по тысяче человек, сохраняющее древнюю организационную структуру.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: и сотников
  rationale: Параллельное обозначение командиров сотен; «сотники» кратко и естественно передаёт военный термин.
- source_word: הַבָּאִים
  choice: возвращавшихся
  rationale: Буквально причастие означает «приходивших», но с исходной точкой, обозначенной מִן, контекстуально речь идёт о возвращении военачальников с войны. Продолженная форма передана русским причастием несовершенного вида.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: с войны
  rationale: Сочетание צבא и מלחמה объединяет значения военной службы, похода и войны. «С войны» естественно в данном контексте; более формальная лексическая полнота отражена в примечании.
