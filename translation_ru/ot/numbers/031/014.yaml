translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире показывает, что тысяченачальники и сотники поясняют, кто именно назван начальниками войска. Архаизм «сотники» сохранён как ясный военно-организационный термин; синтаксические кальки избегаются.
