reference: Numbers 31:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: ru
  text: А из половины, принадлежащей сынам Израиля, возьми по одному из каждых пятидесяти[a] — из людей, крупного скота, ослов и мелкого скота[b], из всякого скота, — и отдай их левитам, несущим службу при скинии Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одного взятого из пятидесяти».'
    reason: Сохраняет пассивный оттенок אָחֻז, тогда как основной текст естественно выражает норму сбора 1:50.
  - marker: b
    text: То есть овец и коз.
    reason: Еврейское צֹאן — собирательное название мелкого скота, включающее овец и коз.
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: А из половины, принадлежащей сынам Израиля
  rationale: Сохраняет значение מַחֲצִית как «половина, половинная доля» и формально передаёт בְּנֵי יִשְׂרָאֵל как «сыны Израиля», при этом явно выражая принадлежность доли.
- source_word: תִּקַּח
  choice: возьми
  rationale: Императив естественно передаёт предписание, обращённое к Моисею; русский будущий вид «возьмёшь» здесь менее прям.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: по одному из каждых пятидесяти
  rationale: Ясно выражает норму сбора 1:50. Значение אָחֻז как взятого или удержанного отражено самой конструкцией «возьми по одному» без тяжеловесного пассива.
- source_word: מִן הָאָדָם
  choice: из людей
  rationale: אָדָם употреблено собирательно и обозначает человеческую часть добычи; «из людей» естественно по-русски и не превращает собирательное существительное в одного отдельного мужчину.
- source_word: מִן הַבָּקָר
  choice: крупного скота
  rationale: בָּקָר обозначает крупный рогатый скот или стадо; «крупный скот» уместен в перечне категорий добычи.
- source_word: מִן הַחֲמֹרִים
  choice: ослов
  rationale: Прямой современный эквивалент названия животных.
- source_word: וּמִן הַצֹּאן
  choice: и мелкого скота
  rationale: צֹאן — собирательное обозначение стад овец и коз. «Мелкий скот» точнее по охвату, чем одно лишь «овцы».
- source_word: מִכָּל הַבְּהֵמָה
  choice: из всей скотины
  rationale: בְּהֵמָה здесь обобщает перечисленных домашних животных; «скотина» сохраняет коллективный характер и не расширяет значение до животных вообще.
- source_word: וְנָתַתָּה אֹתָם לַלְוִיִּם
  choice: и отдай их левитам
  rationale: Естественно передаёт последовательное предписание и сохраняет множественное местоимение, относящееся к отобранным людям и животным.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: несущим стражу при скинии
  rationale: Когнатная конструкция שׁמר משׁמרת подчёркивает охрану и исполнение вверенной обязанности; «нести стражу» сохраняет этот оттенок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как собственное заветное имя. «Яхве» прямо передаёт имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Синтаксис остаётся близким к еврейскому перечню, но избегает неестественных кальк. «Сыны Израиля» сохраняет традиционную формулу; «скиния» — общеупотребительный библейский термин.
