  source_fidelity: 'Основной смысл передан верно: предписание касается доли сынов Израиля, нормы один из пятидесяти, перечисленных категорий людей и скота и передачи отобранного левитам. Однако «из всей скотины» стилистически снижено и неудачно в данном законодательном контексте; кроме того, конструкция «несущим стражу» чрезмерно сужает שֹׁמְרֵי מִשְׁמֶרֶת до караульной функции, тогда как речь о хранении/исполнении порученного служения при скинии.'
