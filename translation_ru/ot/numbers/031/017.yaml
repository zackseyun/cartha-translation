  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: ru
  text: А теперь убейте всех мальчиков среди детей и убейте всякую женщину, познавшую мужчину, вступив с ним в близость.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально говорит о женщине, «познавшей мужчину через лежание с мужчиной»; это идиома, обозначающая половую близость.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак, теперь
  rationale: Передаёт и связующий выводный оттенок וְ, и указание на непосредственный момент в עַתָּה; по-русски звучит естественно и сохраняет переход к повелению.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: убейте
  rationale: Прямое и сильное повеление от הרג; эвфемистическое «предайте смерти» неоправданно смягчило бы еврейский текст.
- source_word: כָל זָכָר בַּטָּף
  choice: всех мальчиков среди детей
  rationale: זָכָר буквально обозначает лицо мужского пола, а בַּטָּף помещает его в группу малолетних детей; в современном русском «мальчиков» точно и естественно выражает это сочетание.
- source_word: כָל אִשָּׁה
  choice: всякую женщину
  rationale: אִשָּׁה здесь обозначает женщину вообще, а не обязательно жену; «всякую» сохраняет распределительное значение כָל.
- source_word: יֹדַעַת אִישׁ
  choice: которая познала мужчину
  rationale: Сохраняет обычную библейско-еврейскую идиому ידע в значении половой близости, не заменяя её толкованием в основном тексте.
- source_word: לְמִשְׁכַּב זָכָר
  choice: разделив с ним ложе
  rationale: Естественно по-русски уточняет сексуальный смысл глагола «познала» и передаёт образ лежания с мужчиной без неуклюжего буквализма.
theological_decisions:
- issue: Передача нравственно тяжёлого военного повеления без смягчения и поясняющего расширения
  choice: Сохранить прямое повеление «убейте» и явно назвать обе его группы объектов
  alternative: Использовать эвфемизм «предайте смерти» или внести историко-нравственное объяснение в основной текст
  rationale: Перевод не должен ни ослаблять суровость еврейского текста, ни добавлять отсутствующий в стихе комментарий.
- issue: Сексуальный смысл выражения יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: Сохранить идиому «познала мужчину», уточнив её словами «разделив с ним ложе»
  alternative: Эксплицировать как «имела половые отношения с мужчиной»
  rationale: Выбранный вариант сохраняет образность и сдержанность оригинала, при этом контекст и примечание делают смысл недвусмысленным.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой. Архаизм «отроки» и канцелярское «лица мужского пола» отвергнуты; тяжесть повеления не смягчена. Маркер примечания поставлен после всей идиомы, которую оно поясняет.
