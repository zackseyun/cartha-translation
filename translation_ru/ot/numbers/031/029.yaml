lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: Из их половины
  rationale: Передаёт сочетание предлога מִן с מַחֲצִית и притяжательным суффиксом; речь идёт о половине добычи, выделенной воинам в ближайшем контексте.
- source_word: תִּקָּחוּ
  choice: возьмите
  rationale: Форма 2-го лица множественного числа имеет предписывающую силу; русский повелительный вид естественно передаёт инструкцию.
- source_word: וְנָתַתָּה
  choice: и отдайте
  rationale: Форма продолжает последовательность предписаний. В еврейском здесь происходит переход от множественного числа к единственному; в основном тексте число согласовано ради естественного русского синтаксиса, как и в консультационном английском слое.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: священнику Елеазару
  rationale: Передаёт адресата и его должность естественным для русского языка порядком слов.
- source_word: תְּרוּמַת יְהוָה
  choice: приношение Яхве
  rationale: תְּרוּמָה обозначает долю, отделённую для священного употребления; «приношение» понятно современному читателю и сохраняет культовый смысл. Конструкция с именем Яхве не вынуждает выбирать только между значением принадлежности и предназначения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл תְּרוּמָה в контексте раздела добычи
  choice: приношение
  alternative: взнос; доля, посвящённая Яхве
  rationale: Выбранное слово сочетает идею отделённой доли с её священным назначением, не вводя архаический технический термин.
translation_notes:
  register: Современный литературный русский язык с ясной предписывающей формой. Формулировка сохраняет краткость оригинала и контекст раздела добычи; архаизмы и узкоконфессиональная терминология не используются.
