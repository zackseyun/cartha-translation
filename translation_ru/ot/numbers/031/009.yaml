  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: ru
  text: Сыны Израиля взяли в плен женщин Мадиана и их малых детей[a], а весь их скот, все их стада и всё их имущество разграбили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их детей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: взяли в плен
  rationale: Глагол שׁבה в породе qal обозначает захват людей в плен; этот русский оборот точно передаёт значение и естественно звучит.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохраняет форму еврейского выражения и его мужской род; в современном литературном русском это торжественный, но понятный библейский оборот.
- source_word: נְשֵׁי מִדְיָן
  choice: женщин Мадиана
  rationale: נָשִׁים здесь означает женщин вообще, а не обязательно жён; конструкция с родительным падежом близка к еврейскому сочетанию.
- source_word: טַפָּם
  choice: их малых детей
  rationale: טַף обозначает малолетних детей; «малых детей» сохраняет возрастной оттенок и звучит естественнее буквального «их малых».
- source_word: בְּהֶמְתָּם
  choice: весь их скот
  rationale: Собирательное בְּהֵמָה в данном контексте означает домашних животных; «скот» — точный и привычный русский эквивалент.
- source_word: מִקְנֵהֶם
  choice: все их стада
  rationale: מִקְנֶה может обозначать скот как хозяйственное достояние, стада и отары; «стада» позволяет сохранить отдельность от более общего בְּהֵמָה, не устраняя частичное смысловое наложение.
- source_word: חֵילָם
  choice: всё их имущество
  rationale: חַיִל здесь, после перечисления людей и животных, вероятнее всего обозначает материальные средства, добро или имущество, а не войско.
- source_word: בָּזָזוּ
  choice: разграбили
  rationale: בזז обозначает захват военной добычи; «разграбили» сохраняет военный контекст и управляет перечисленными прямыми дополнениями.
theological_decisions:
- issue: Передача этнонимного выражения בְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  alternative: Израильтяне; дети Израиля
  rationale: Сохранена формальная образность и грамматический мужской род исходного выражения без придания ему дополнительного богословского смысла.
- issue: Значение חֵילָם в контексте военного повествования
  choice: всё их имущество
  alternative: всё их добро; все их богатства; все их силы
  rationale: Контекст перечисления добычи поддерживает материальное значение слова, однако перевод не сужает его до денег или ценностей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «Сыны Израиля». Порядок второй части слегка перестроен ради естественного русского синтаксиса; повторяемое еврейское וְאֶת передано перечислением. Подлинное смысловое наложение между בְּהֵמָה и מִקְנֶה сохранено сочетанием «скот» и «стада».
