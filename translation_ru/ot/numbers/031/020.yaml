  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: ru
  text: И всякую одежду, и всякий кожаный предмет, и всякое изделие из козьей шерсти[a], и всякий деревянный предмет очистите[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изделие (работа) из коз»; вероятно, имеется в виду изделие из козьей шерсти.'
    reason: лексическая неоднозначность материала
  - marker: b
    text: Еврейский глагол стоит в возвратной форме и может передавать смысл «очищайтесь» или «совершайте очищение»; однако по построению фразы он относится к очищению перечисленных предметов.
    reason: грамматическая и контекстуальная неоднозначность
lexical_decisions:
- source_word: בֶּגֶד
  choice: одежда
  rationale: Обычное значение слова — предмет одежды; «одежда» естественно звучит в перечне и сохраняет собирательную широту еврейского термина.
- source_word: כְּלִי עוֹר
  choice: кожаная вещь
  rationale: כְּלִי обозначает не только сосуд, но и вещь, предмет или принадлежность. В перечне материалов широкое «вещь» точнее, чем более узкое «сосуд».
- source_word: מַעֲשֵׂה עִזִּים
  choice: изделие из козьей шерсти
  rationale: מַעֲשֵׂה здесь означает изготовленную вещь, а עִזִּים буквально указывает на коз. В подобных перечнях материалов наиболее вероятна козья шерсть, хотя сам материал в еврейском тексте прямо не назван; это отмечено в сноске.
- source_word: כְּלִי עֵץ
  choice: деревянная вещь
  rationale: Широкое значение כְּלִי и материальная классификация требуют обозначения любого деревянного предмета, а не только сосуда.
- source_word: תִּתְחַטָּאוּ
  choice: очистите
  rationale: В данном контексте глагол обозначает обрядовое очищение после соприкосновения со смертью. Вынесенные вперёд дополнения перечисляют вещи, которые надлежит очистить; русская переходная форма ясно передаёт этот смысл, а формальная неоднозначность еврейской формы отмечена в сноске.
theological_decisions:
- issue: Обрядовое очищение людей или перечисленных предметов
  choice: Перевести как повеление очистить перечисленные вещи.
  alternative: «очиститесь» / «совершите очищение»
  rationale: Хотя форма תִּתְחַטָּאוּ морфологически допускает возвратное понимание, четыре вынесенных вперёд дополнения с אֵת подразумевают действие над предметами. Контекст говорит об обрядовой чистоте после войны, а не о нравственном обращении или искуплении грехов.
- issue: Значение корня חטא в данном контексте
  choice: «очистите» без добавления «от греха».
  alternative: «очистите от греха»
  rationale: Связь глагола с корнем חטא сохраняет языковую ассоциацию с грехом, однако здесь конкретное употребление относится к обрядовому очищению. Добавление «от греха» могло бы ошибочно придать предметам нравственную вину.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного перечня. Повтор союза «и» сохраняет ритм и структуру еврейского текста; лексика остаётся понятной без узкоконфессиональных терминов.
