  text: 'И сказал Яхве Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И сказал Яхве Моисею, говоря». Это обычная еврейская формула, вводящая прямую речь.'
