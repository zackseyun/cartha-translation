lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным וַ־ продолжает последовательность событий. В русском библейском повествовании естественно и точно передать её сочетанием «И сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит содержание речи в следующем стихе. В современном русском эту функцию естественно выполняет двоеточие; буквальная конструкция отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейского повествования. Двоеточие вместо буквального «говоря» устраняет неестественную для современного русского избыточность, не теряя функции исходной конструкции.
