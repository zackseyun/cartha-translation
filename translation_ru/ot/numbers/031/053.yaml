- source_word: אַנְשֵׁי הַצָּבָא
  choice: воины
  rationale: Сочетание буквально означает «мужи войска» и в данном военном контексте естественно передаётся современным русским словом «воины».
- source_word: בָּזְזוּ
  choice: захватили добычу
  rationale: Глагол בזז означает «грабить, брать добычу»; дополнение в еврейском тексте подразумевается. Выражение «захватили добычу» ясно и естественно передаёт результат действия.
- source_word: אִישׁ לוֹ
  choice: каждый для себя
  rationale: Дистрибутивное выражение буквально означает «каждый мужчина для себя» и указывает, что каждый воин присвоил свою долю добычи.
