base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: ru
  text: А вы разбейте лагерь вне стана на семь дней. Все, кто убил человека или прикоснулся к убитому[a], очиститесь в третий и в седьмой день — и вы, и ваши пленники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к телу убитого». Еврейское слово обозначает убитого человека и в этом контексте подразумевает прикосновение к мёртвому телу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ מִחוּץ לַמַּחֲנֶה
  choice: разбейте лагерь вне стана
  rationale: Императив חֲנוּ предписывает расположиться лагерем, а пространственное выражение указывает на место за пределами основного стана. Формулировка естественна для военного контекста и сохраняет различие между временным лагерем и общим станом.
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Русский предлог «на» естественно передаёт длительность предписанного пребывания.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: все, кто убил человека
  rationale: נֶפֶשׁ здесь означает человека, а причастие в послебоевом контексте указывает на уже совершённое действие. Множественная конструкция согласуется с последующим повелением во множественном числе.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: или прикоснулся к убитому
  rationale: חָלָל обозначает убитого насильственной смертью и в данном ритуальном контексте подразумевает соприкосновение с мёртвым телом. Союз «или» естественно объединяет две категории лиц, к которым относится одно предписание.
- source_word: תִּתְחַטְּאוּ
  choice: очиститесь
  rationale: Форма хитпаэль от חטא в данном контексте означает совершить ритуальное очищение, а не получить нравственное прощение.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: в третий и в седьмой день
  rationale: Сохранены оба точных срока ритуального предписания; повтор предлога делает русскую фразу ясной.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: и вы, и ваши пленники
  rationale: שְׁבִי обозначает захваченных на войне людей. Повтор «и» передаёт заключительное эмфатическое уточнение круга участников.
theological_decisions:
- issue: Характер очищения после убийства или прикосновения к убитому
  choice: ритуальное очищение от нечистоты, связанной с мёртвым телом
  alternative: нравственное очищение от вины за пролитую кровь
  rationale: Указание на третий и седьмой дни связывает предписание с установленным обрядом очищения от осквернения через соприкосновение с мёртвым. Перевод «очиститесь» передаёт ритуальный смысл, не добавляя утверждения о прощении нравственной вины.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Стан» сохранён как понятное в контексте обозначение основного лагеря; синтаксис упрощён без устранения ритуальной точности и заключительного акцента на пленниках.
