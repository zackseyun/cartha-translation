  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: ru
  text: Добыча[a] — остаток захваченных воинами трофеев — составила 675 000 голов мелкого скота.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военные трофеи». В еврейском тексте употреблены два близких по значению слова, обозначающих захваченную на войне добычу (מַלְקוֹחַ и בָּז).'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово צֹאן обозначает мелкий скот — овец и коз; в данном контексте также возможно: «675 000 овец».'
    reason: lexical_scope
lexical_decisions:
- source_word: וַיְהִי
  choice: составила
  rationale: Глагольная форма вводит итоговую инвентарную запись; русское «составила» естественно выражает значение количества без добавления отсутствующего в оригинале временного наречия.
- source_word: הַמַּלְקוֹחַ
  choice: добыча
  rationale: Слово обозначает захваченное на войне; «добыча» ясно и естественно передаёт это значение.
- source_word: יֶתֶר הַבָּז
  choice: оставшаяся часть трофеев
  rationale: Передаёт значение остатка и сохраняет различие между двумя близкими еврейскими терминами военной добычи.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: захваченных
  rationale: Причастный оборот естественен по-русски и точно передаёт захват добычи в военном контексте.
- source_word: עַם הַצָּבָא
  choice: воинами
  rationale: Буквально «народ войска»; в данном контексте речь идёт о людях, участвовавших в походе, поэтому «воинами» понятно и стилистически естественно.
- source_word: צֹאן
  choice: голов мелкого скота
  rationale: Еврейское собирательное слово может охватывать овец и коз; в перечне поголовья «голов мелкого скота» точнее, чем сужающее значение «овец».
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 675 000
  rationale: Точная сумма 600 000 + 70 000 + 5 000; цифровая запись удобна для инвентарного перечня.
