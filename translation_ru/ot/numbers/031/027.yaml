  verdict: approve
  source_fidelity: «Раздели» точно передаёт форму повеления в последовательности распоряжений. «Захваченное на войне» адекватно отражает широкий объём הַמַּלְקוֹחַ, включающий не только вещи, а «между ... и ...» сохраняет двустороннее распределение. «Воинами, ходившими в поход» естественно передаёт участников военного похода, уточнённых הַיֹּצְאִים לַצָּבָא; «всей общиной» корректно передаёт כָּל־הָעֵדָה.
