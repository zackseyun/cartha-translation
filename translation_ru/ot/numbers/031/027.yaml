  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: ru
  text: Раздели захваченное на войне[a] между воинами, ходившими в поход, и всей общиной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военную добычу». Еврейское слово охватывает всё взятое на войне — как имущество, так и пленников.'
