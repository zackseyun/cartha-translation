lexical_decisions:
- source_word: וְחָצִיתָ
  choice: Раздели
  rationale: Форма с последовательным значением продолжает обращённые к Моисею повеления; русский императив естественно передаёт функцию высказывания.
- source_word: הַמַּלְקוֹחַ
  choice: захваченное на войне
  rationale: Существительное обозначает взятых в ходе войны людей и имущество. Субстантивированное «захваченное» сохраняет широту значения лучше, чем «добыча», которое может восприниматься преимущественно как имущество.
- source_word: בֵּין
  choice: между
  rationale: Предлог обозначает распределение между двумя названными группами.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: воинами
  rationale: Буквально это «держащие/ведущие войну» — идиоматическое обозначение непосредственных участников военных действий. «Воины» передаёт смысл кратко и естественно.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: ходившими в поход
  rationale: Причастный оборот уточняет воинов как тех, кто вышел на военную службу или в поход; в данном повествовательном контексте «ходившими в поход» звучит естественно и не сужает выражение до одного боя.
- source_word: וּבֵין כָּל הָעֵדָה
  choice: и всей общиной
  rationale: עֵדָה обозначает совокупное сообщество Израиля. «Община» понятно современному читателю и сохраняет корпоративный смысл.
