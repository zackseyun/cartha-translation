  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: ru
  text: 'Моисей сказал им: «Неужели вы оставили в живых всех женщин?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная повествовательная форма от אמר; простое прошедшее время естественно для русского повествования.
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Предлог אֶל с суффиксом 3-го лица множественного числа обозначает адресатов речи; по-русски естественно передаётся дательным падежом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: הַחִיִּיתֶם
  choice: неужели вы оставили в живых
  rationale: Каузативная форма от חיה означает «дать жить, сохранить жизнь, оставить в живых». Частица «неужели» естественно передаёт вопрос с оттенком резкого удивления и упрёка, очевидным из контекста.
- source_word: כָּל
  choice: всех
  rationale: Собирательно охватывает всю обозначенную группу; согласуется с естественным русским множественным числом.
- source_word: נְקֵבָה
  choice: женщин
  rationale: В данном контексте существительное обозначает лиц женского пола без возрастного ограничения. Русское «женщин» звучит естественнее субстантивированного «самок» или канцелярского «лиц женского пола», хотя в следующем стихе отдельно уточняется возрастно-половая категория.
theological_decisions:
- issue: Передача נְקֵבָה в контексте военного насилия
  choice: женщин
  alternative: всех лиц женского пола
  rationale: Еврейское слово охватывает женский пол без явного возрастного ограничения. В современном русском «женщин» может в широком контексте обозначать женскую часть пленных, тогда как буквальное «самок» применительно к людям неестественно и дегуманизирует сильнее, чем требует лексема. Возрастное различие не добавляется в сам стих.
- issue: Сила вопроса הַחִיִּיתֶם
  choice: Неужели вы оставили в живых
  alternative: Вы оставили в живых
  rationale: Контекст указывает не на нейтральный запрос сведений, а на возмущённый вопрос Моисея. «Неужели» передаёт прагматическую силу, не меняя предмета вопроса.
translation_notes:
  register: Современный литературный русский язык; краткая, резкая вопросительная реплика. Сохранены суровость военного контекста и широкий охват исходного обозначения, без добавления возрастных категорий.
