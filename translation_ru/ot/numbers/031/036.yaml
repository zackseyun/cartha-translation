lexical_decisions:
- source_word: וַתְּהִי
  choice: составила
  rationale: В данном контексте форма היה вводит итоговое количество; «составила» естественно передаёт результат подсчёта.
- source_word: הַמֶּחֱצָה
  choice: половина
  rationale: Речь идёт об одной из двух половин добычи, разделённой в предшествующем контексте.
- source_word: חֵלֶק
  choice: доля
  rationale: Слово стоит в приложении к «половина» и уточняет, кому она предназначалась.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: ходивших на войну
  rationale: Естественное современное выражение для участников военного похода, сохраняющее причастную конструкцию оригинала.
- source_word: מִסְפַּר הַצֹּאן
  choice: 337 500 овец
  rationale: Русская конструкция с глаголом «составила» не требует буквального воспроизведения слова «число»; значение точного количества сохранено.
- source_word: הַצֹּאן
  choice: овец
  rationale: В перечне добычи термин обозначает мелкий скот, представленный здесь овцами; конкретный перевод согласуется с контекстом.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337 500
  rationale: Аддитивное еврейское числительное точно равно 337 500; запись цифрами удобна для современного читателя.
