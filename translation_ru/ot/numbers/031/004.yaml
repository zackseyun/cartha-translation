lexical_decisions:
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: по тысяче от каждого колена, по тысяче от каждого колена
  rationale: Предлог לְ при повторённом числительном имеет распределительное значение. Повтор исходного текста сохранён ради его риторической силы и прозрачности перевода.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: от всех колен Израиля
  rationale: Оборот уточняет, что набор должен охватить все колена Израиля; «от» естественно передаёт источник набора по контексту.
- source_word: תִּשְׁלְחוּ
  choice: пошлите
  rationale: Форма 2-го лица множественного числа в данном контексте выражает прямое повеление; русский императив передаёт это ясно и естественно.
- source_word: לַצָּבָא
  choice: в войско
  rationale: צָבָא может обозначать войско, военную службу или военный поход. «В войско» кратко и естественно передаёт направление людей в состав военной силы, не сводя выражение лишь к месту назначения.
