  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: ru
  text: 'Тогда священник Елеазар сказал воинам, пришедшим на войну: «Вот установление закона[a], которое Яхве заповедал Моисею:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предписание закона»; или: «установление наставления».'
    reason: 'Сочетание חֻקַּת הַתּוֹרָה допускает разные оттенки: חֻקָּה — «установление, предписание», תּוֹרָה — «закон, наставление».'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священник Елеазар
  rationale: Сохраняется личное имя и определяющий его титул; такой порядок слов естественен для современного русского повествования.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: воинам
  rationale: Еврейское выражение буквально означает «мужи войска»; «воины» кратко и естественно передаёт мужской состав военного отряда.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: ходившим на войну
  rationale: Буквально — «приходящим/пришедшим на войну». В контексте речь обращена к участникам уже завершившегося похода; «ходившим на войну» сохраняет направление, выраженное предлогом לְ, и не добавляет прямо не названного «возвращения».
- source_word: חֻקַּת הַתּוֹרָה
  choice: установление закона
  rationale: חֻקָּה обозначает обязательное установление или предписание, а תּוֹרָה — авторитетный закон или наставление. Основной вариант сохраняет юридическую силу сочетания, не устраняя его смысловой диапазон.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: которое Яхве заповедал Моисею
  rationale: Показатель прямого дополнения אֶת отмечает Моисея как адресата повеления. Глагол «заповедал» передаёт обязательный характер צִוָּה, а имя Яхве непосредственно представляет тетраграмматон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит личное заветное имя יְהוָה. Форма «Яхве» сохраняет имя и соответствует наиболее распространённой научной реконструкции произношения, не заменяя его титулом.
- issue: Роль Моисея в выражении אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Яхве заповедал Моисею
  alternative: Яхве заповедал через Моисея
  rationale: Грамматика называет Моисея тем, кому дано повеление, а не посредником, через которого оно здесь передаётся; поэтому посредническая формулировка не внесена.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным, при этом сохранены юридическая формула, мужская референция военного отряда и открытое употребление имени Яхве.
