  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: ru
  text: Из тысяч Израиля[b] были выделены[a] по тысяче от каждого племени — двенадцать тысяч воинов, снаряжённых для войны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были предоставлены», «были переданы» либо «были собраны»; еврейский глагол может обозначать предоставление или назначение людей для службы.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «тысячи Израиля» может обозначать не только численность, но и крупные родовые или войсковые подразделения Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: было выделено
  rationale: 'Нифаль передаёт пассивное значение: людей предоставили или назначили для похода. «Было выделено» естественно звучит по-русски и сохраняет смысл отбора из состава Израиля.'
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: из тысяч Израиля
  rationale: אַלְפֵי буквально означает «тысячи», но в племенном и военном контексте может обозначать также крупные родовые или войсковые подразделения. Буквальная формулировка сохраняет эту многозначность.
- source_word: אֶלֶף לַמַּטֶּה
  choice: по тысяче от каждого племени
  rationale: Предлог לְ здесь имеет распределительное значение; такая формулировка ясно показывает вклад каждого племени.
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: двенадцать тысяч
  rationale: Прямое обозначение общей численности отряда.
- source_word: חֲלוּצֵי צָבָא
  choice: вооружённых для войны
  rationale: Выражение обозначает людей, снаряжённых и готовых к военным действиям; перевод краток и сохраняет военный оттенок.
