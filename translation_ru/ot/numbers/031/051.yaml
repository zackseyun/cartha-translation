  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: ru
  text: И Моисей и священник Елеазар взяли у них золото — все изготовленные изделия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все изделия работы (изготовления)»; то есть все изготовленные из золота предметы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взяли
  rationale: Форма единственного числа обычна для древнееврейского повествования перед составным подлежащим; по-русски требуется множественное число. «Взяли» сохраняет конкретный смысл לקח и соответствует действию в контексте.
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: Моисей со священником Елеазаром
  rationale: Такая конструкция естественно передаёт совместное действие, сохраняя имя и должность Елеазара.
- source_word: אֶת הַזָּהָב
  choice: золото
  rationale: Речь идёт о конкретном золоте, переданном в данном контексте; в русском определённость выражается контекстом.
- source_word: מֵאִתָּם
  choice: у них
  rationale: Предлог обозначает источник получения; «у них» естественно по-русски передаёт, от кого было взято золото.
- source_word: כֹּל כְּלִי מַעֲשֶׂה
  choice: все изготовленные изделия
  rationale: כְּלִי — широкий термин для предмета или изделия, а מַעֲשֶׂה указывает на сделанную, обработанную вещь. Формулировка отличает готовые золотые предметы от необработанного металла, не сужая их до сосудов.
