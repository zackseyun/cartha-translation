base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: ru
  text: 'И сказали они Моисею: «Твои слуги произвели подсчёт[a] воинов, находящихся под нашим командованием[b], и среди них не оказалось ни одного отсутствующего».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подняли голову воинов» — еврейская идиома, означающая произвести подсчёт или перепись.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые в нашей руке»; то есть вверенные нашей ответственности или власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: В речи военачальников перед Моисеем это формула почтительного самообозначения; буквальное «рабы» здесь неоправданно выдвинуло бы на первый план зависимый статус.
- source_word: נָשְׂאוּ אֶת רֹאשׁ
  choice: пересчитали
  rationale: Еврейская идиома, буквально «подняли голову», в данном военно-административном контексте означает произвести подсчёт личного состава.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воинов
  rationale: Передаёт конкретное значение мужчин, участвовавших в войне, естественно и кратко для современного русского текста.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: находящихся под нашим командованием
  rationale: Буквальное «которые в нашей руке» обозначает людей, вверенных власти и ответственности говорящих; военный контекст уточняет характер этой власти.
- source_word: נִפְקַד מִמֶּנּוּ אִישׁ
  choice: ни один из нас не пропал
  rationale: Нифаль глагола פקד здесь означает оказаться отсутствующим или недосчитанным после похода; «не пропал» естественно сообщает, что никто не был потерян.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Начальное «И» сохраняет повествовательную связь. Военная и административная идиоматика передана естественно, а буквальный образ «в нашей руке» отмечен в сноске.
