  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: ru
  text: «Отомсти мадианитянам за сынов Израиля[a]. После этого ты присоединишься к своему народу[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Соверши возмездие сынов Израиля над мадианитянами». Буквально: «Отомсти возмездием сынов Израиля над мадианитянами».'
    reason: lexical_alternative
  - marker: b
    text: «Присоединиться к своему народу» — еврейская идиома, означающая смерть.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Отомсти
  rationale: Повелительная форма и однокоренная конструкция буквально передают усиленное «отомсти отмщением». В современном русском естественный глагол «отомсти» сохраняет прямую силу повеления без тяжеловесного повтора.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально соответствует еврейскому выражению и сохраняет характерное для текста обозначение народа через происхождение от Израиля.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: мадианитянам
  rationale: При русском глаголе «отомстить» сторона, на которую направлено возмездие, естественно выражается дательным падежом. Это передаёт функцию еврейского оборота и не создаёт ложного смысла «получить от мадианитян».
- source_word: אַחַר
  choice: После этого
  rationale: Ясно и естественно обозначает последующее событие.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: ты будешь приобщён к своему народу
  rationale: Пассивная конструкция сохраняет форму еврейского глагола и образ присоединения к своему народу, не заменяя идиому прямым пояснением «умрёшь».
theological_decisions:
- issue: Идиома о предстоящей смерти Моисея
  choice: 'Сохранить образ: «ты будешь приобщён к своему народу»'
  alternative: «ты умрёшь»; «ты отойдёшь к своим предкам»
  rationale: Еврейское выражение является устойчивой идиомой смерти, однако его образность не следует устранять или истолковывать как точное утверждение о состоянии после смерти.
- issue: Направленность возмездия
  choice: «Отомсти мадианитянам за сынов Израиля»
  alternative: «Соверши возмездие сынов Израиля над мадианитянами»
  rationale: 'Выбранный вариант естественен по-русски и сохраняет обе стороны отношения: мадианитяне являются объектом возмездия, а сыны Израиля — теми, за кого оно совершается. Более буквальная конструкция допускается как примечание, поскольку еврейская формулировка компактна и неоднозначна по синтаксическому оформлению.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. «Мадианитяне» и «сыны Израиля» сохраняют библейскую историко-родовую лексику; архаическое «приложишься к народу твоему» заменено более современным «будешь приобщён к своему народу».
