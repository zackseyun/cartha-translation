  source_fidelity: 'Первая часть в целом точно передаёт императив נְקֹם и направленность возмездия: мадианитяне являются стороной, против которой оно совершается, а сыны Израиля — стороной, за которую оно совершается. «Отомсти мадианитянам за сынов Израиля» естественно и достаточно точно. Однако «будешь приобщён к своему народу» неудачно передаёт תֵּאָסֵף אֶל־עַמֶּיךָ: «приобщён» в современном русском обычно имеет оттенок приобщения к чему-либо (нередко религиозный или институциональный) и не сохраняет ясно образ присоединения к своему народу.'
  naturalness: '«Отомсти мадианитянам за сынов Израиля» — современная литературная и ясная формулировка с уместной библейской торжественностью. Для идиомы смерти более естественно «ты присоединишься к своему народу»: это сохраняет образ, не подменяя его прямым «умрёшь», и не звучит как искусственный пассив.'
