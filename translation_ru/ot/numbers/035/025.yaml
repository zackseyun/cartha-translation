  terminology: «Община», «мститель за кровь», «первосвященник» и «священное масло» удачны. «Город убежища» является наиболее узнаваемым и естественным термином для עִיר מִקְלָט. Активное «которого он помазал» формально отражает מָשַׁח אֹתוֹ, но намеренно оставляет не названным субъекта; сноска должна прямо предупредить, что русское «он» не отождествляется с лишившим жизни человеком.
