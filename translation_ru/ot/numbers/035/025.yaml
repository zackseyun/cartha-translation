  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: ru
  text: И община избавит того, кто лишил жизни другого, от руки мстителя за кровь[a], и община возвратит его в город убежища, куда он бежал. Там он будет жить[b] до смерти первосвященника, которого он помазал священным маслом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровного мстителя». Еврейское выражение обозначает человека, на которого возлагалась обязанность отомстить за пролитую кровь; обычно им был близкий родственник погибшего.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет оставаться там»; «будет обитать там».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «которого он помазал священным маслом». В еврейском тексте глагол стоит в активной форме, но субъект помазания прямо не назван; слово «он» не уточняет, кто именно совершил помазание. Возможный перевод по смыслу: «который был помазан священным маслом».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: избавит
  rationale: Порода hифиль глагола נצל обозначает освобождение человека из-под власти другого; «избавит» сохраняет юридически-защитный смысл и естественно сочетается с оборотом «от руки».
- source_word: הָעֵדָה
  choice: община
  rationale: В Числах слово обозначает общину Израиля, здесь выступающую в судебном качестве. «Община» передаёт коллективный и официальный характер субъекта.
- source_word: הָרֹצֵחַ
  choice: убившего
  rationale: В законодательстве о городах-убежищах слово охватывает человека, причинившего смерть, в том числе непреднамеренно. «Убивший» не приписывает ему заранее умысел, в отличие от «убийцы» в обычном русском употреблении.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён конкретный еврейский оборот, означающий избавление от власти или захвата другого лица; он понятен в данном контексте.
- source_word: גֹּאֵל הַדָּם
  choice: мстителя за кровь
  rationale: Выражение обозначает лицо, наделённое обязанностью отомстить за пролитую кровь, обычно близкого родственника. Родство подразумевается ролью גאל, но не добавлено в основной текст.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: возвратит его
  rationale: Hифиль שוב буквально выражает побуждение или обеспечение возвращения; краткий русский эквивалент сохраняет форму исходного текста.
- source_word: עִיר מִקְלָטוֹ
  choice: город-убежище
  rationale: Это установленное юридическое наименование места защиты в данной главе. Дефисное написание ясно передаёт тип города, а притяжательность контекстуально выражена возвращением именно в тот город, куда человек бежал.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: куда он бежал
  rationale: Наречие שָׁמָּה имеет направительное значение «туда»; «куда он бежал» точно и естественно связывает придаточное с городом-убежищем.
- source_word: וְיָשַׁב בָּהּ
  choice: там он будет жить
  rationale: ישב может означать жить, пребывать или оставаться. «Будет жить» естественно по-русски передаёт предписанное проживание, а «там» представляет местоименное בָּהּ без тяжеловесного «в нём».
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: до смерти первосвященника
  rationale: Сохранена именная конструкция оригинала; «первосвященник» — традиционный и понятный русский эквивалент титула.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: которого он помазал
  rationale: В масоретском тексте стоит активный глагол 3-го лица мужского рода единственного числа и прямое дополнение «его». Русский перевод сохраняет активную конструкцию и не называет невыраженного субъекта.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: священным маслом
  rationale: Выражение относится к маслу посвящения. «Священное масло» звучит современно и передаёт определение הַקֹּדֶשׁ без архаизации.
theological_decisions:
- issue: Правовой статус הָרֹצֵחַ в законодательстве о городах-убежищах
  choice: «убившего»
  alternative: «убийцу»
  rationale: Контекст различает умышленное убийство и непреднамеренное причинение смерти. Перевод не должен заранее приписывать человеку преступный умысел или окончательную виновность.
- issue: Неуказанный субъект מָשַׁח אֹתוֹ
  choice: 'Сохранена активная форма: «которого он помазал»'
  alternative: «который был помазан»
  rationale: Еврейский текст грамматически активен, но не называет совершающего помазание. Пассив был бы естественнее по-русски, однако молча разрешил бы реальную синтаксическую трудность и скрыл форму исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством законодательного библейского повествования. Избегаются как разговорность, так и ненужные архаизмы; юридические термины переданы ясно. Повтор «община» сохранён вслед за еврейским текстом. Необычная активная конструкция в конце оставлена ради подлинной синтаксической неоднозначности и разъяснена в сноске.
