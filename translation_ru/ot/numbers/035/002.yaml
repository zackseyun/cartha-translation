base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: ru
  text: Повели сынам Израиля[a], чтобы они дали левитам из своего наследственного владения города для жительства, а также дайте левитам пастбищные земли[b] вокруг этих городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Так названа незастроенная земля вокруг города, использовавшаяся прежде всего для выпаса скота и других общих хозяйственных нужд.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Повели
  rationale: Императив передаёт прямое и обязательное повеление Моисею; «повели» естественно для возвышенного повествовательного контекста и не ослабляет силу формы.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальную форму еврейского выражения и его традиционное корпоративное значение; более идиоматичный вариант «израильтянам» указан в примечании.
- source_word: וְנָתְנוּ
  choice: чтобы они дали
  rationale: После глагола повеления перфект с союзом имеет предписывающее значение; придаточное с «чтобы» естественно передаёт требуемое действие.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: 'Прямая передача дательного значения: левиты являются получателями городов и окружающих земель.'
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: из своего наследственного владения
  rationale: Сочетание передаёт земельный удел, полученный в наследственное владение. Русское выражение сохраняет юридически значимые идеи наследия и собственности без тяжеловесного буквального удвоения.
- source_word: עָרִים לָשָׁבֶת
  choice: города для жительства
  rationale: Инфинитив выражает цель; формулировка современна и ясно показывает, что города предназначены для проживания левитов.
- source_word: מִגְרָשׁ
  choice: пастбищные земли
  rationale: В данном контексте это незастроенная земля при городе, предназначенная прежде всего для выпаса и общего хозяйственного пользования; культурный объём термина пояснён в примечании.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: вокруг этих городов
  rationale: Ясно связывает окружающие земли с ранее названными городами и естественно передаёт пространственное отношение.
- source_word: תִּתְּנוּ
  choice: дайте
  rationale: Сохраняет переход от третьего лица «они дали» ко второму лицу множественного числа в еврейском тексте; русский императив передаёт продолжающееся предписание.
theological_decisions:
- issue: Смена грамматического лица в повелении
  choice: Сохранить переход от «они дали» к «дайте»
  alternative: 'Сгладить всё до третьего лица: «чтобы они дали… и дали»'
  rationale: Еврейский текст намеренно или по крайней мере явно переходит от וְנָתְנוּ, третьего лица множественного числа, к תִּתְּנוּ, второму лицу множественного числа. Сглаживание устранило бы реальную особенность исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сделан ясным, но сохранены буквальное «сынам Израиля» и заметная смена лица глаголов. «Наследственное владение» передаёт юридический земельный контекст без неестественного сочетания «наследие их владения».
