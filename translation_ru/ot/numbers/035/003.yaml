  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: ru
  text: Города будут для них местом жительства, а земли вокруг городов — для их скота, имущества и всех их животных.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пастбища вокруг городов». Еврейское слово обозначает открытую незастроенную землю вокруг городов; в данном контексте она использовалась в том числе для выпаса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: города
  rationale: עִיר обозначает город или поселение; «города» соответствует юридическому контексту распределения и повторяющейся терминологии отрывка.
- source_word: לָשָׁבֶת
  choice: для жительства
  rationale: 'Инфинитив от ישׁב выражает назначение: города предоставляются левитам, чтобы они в них жили. Формулировка естественна для современного русского юридико-повествовательного стиля.'
- source_word: מִגְרְשֵׁיהֶם
  choice: прилегающие к ним земли
  rationale: מִגְרָשׁ означает незастроенную открытую землю вокруг города; контекст указывает на её хозяйственное, в частности пастбищное, использование. Выбор сохраняет более широкое значение слова, не сводя его только к пастбищам.
- source_word: לִבְהֶמְתָּם
  choice: для их скота
  rationale: בְּהֵמָה здесь собирательно обозначает домашних сельскохозяйственных животных; «скот» — краткий и естественный русский эквивалент.
- source_word: לִרְכֻשָׁם
  choice: имущества
  rationale: רְכוּשׁ обозначает имущество или владения. «Имущество» сохраняет широкий хозяйственно-правовой смысл и не ограничивает его движимыми вещами.
- source_word: וּלְכֹל חַיָּתָם
  choice: и всех их животных
  rationale: חַיָּה буквально может означать живое существо или животное; после упоминания скота выражение, вероятно, расширяет охват до всех принадлежавших им животных. Перевод сохраняет эту естественную в контексте широту.
