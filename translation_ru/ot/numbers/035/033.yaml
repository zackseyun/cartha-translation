review_pass:
  verdict: revise
  source_fidelity: Начальное «в которой вы живёте» несколько сужает еврейское אֲשֶׁר אַתֶּם בָּהּ («в которой вы находитесь»). Кроме того, «земля не может быть очищена от ... крови» передаёт следствие, но сглаживает употреблённый здесь термин כפר — совершение искупления/очищения от вины за кровь. Более прямой русский синтаксис позволяет сохранить и землю как затронутую сторону, и искупительный смысл.
  naturalness: Исправленный текст остаётся современным литературным русским. Оборот «совершить искупление земли» несколько возвышен, но уместен для юридико-культового регистра этого предписания и пояснён сноской.
  terminology: «Осквернять» точно передаёт חנף в данном контексте. «Искупление» для כפר сохраняет ключевой термин и не сводит его к физическому очищению. «Кровью того, кто её пролил» корректно передаёт בְּדַם שֹׁפְכוֹ.
  issues:
  - severity: medium
    issue: «В которой вы живёте» вместо «в которой вы находитесь».
    rationale: Глагол «жить» добавляет идею постоянного проживания, которой в еврейском тексте нет; безопаснее сохранить нейтральное «находитесь».
  - severity: medium
    issue: «Земля не может быть очищена от ... крови» недостаточно явно передаёт כפר.
    rationale: Контекст говорит не просто об удалении крови как вещества, а об искупительном устранении вины/осквернения земли вследствие кровопролития. Следует сохранить термин «искупление» в основном тексте.
  revised_text: Не оскверняйте землю, в которой вы находитесь, потому что кровь оскверняет землю; и за пролитую на ней кровь невозможно совершить искупление земли[a] иначе как кровью того, кто её пролил.
