  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: ru
  text: Не оскверняйте землю, в которой вы находитесь, потому что кровь оскверняет землю; и за пролитую на ней кровь невозможно совершить искупление земли[a] иначе как кровью того, кто её пролил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля не может быть очищена от вины за пролитую на ней кровь». Еврейский глагол обозначает искупительное устранение вины или осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: осквернять
  rationale: В данном контексте глагол обозначает нравственно-сакральное осквернение земли кровопролитием. «Осквернять» естественно передаёт этот смысл и не сводит его к экологическому загрязнению.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Речь идёт о земле, в которой живёт Израиль; «земля» сохраняет территориальный и заветный оттенки.
- source_word: כִּי הַדָּם הוּא
  choice: потому что кровь
  rationale: Местоимение הוּא выделяет кровь как причину осквернения, но отдельное «сама» по-русски звучало бы избыточно; порядок и формулировка сохраняют смысловой акцент без усиления сверх оригинала.
- source_word: יְכֻפַּר
  choice: может быть очищена
  rationale: Пассивная форма כפר здесь означает устранение с земли вины за пролитую кровь. «Очищена» ясно и естественно передаёт результат искупительного действия, сохраняя связь с осквернением; культовый оттенок отмечен в сноске.
- source_word: שֻׁפַּךְ
  choice: пролитой
  rationale: Для крови в юридическом контексте «пролитая» — устойчивое и точное русское соответствие.
- source_word: כִּי אִם
  choice: иначе как
  rationale: Оборот вводит единственное исключение или средство и естественно передаётся по-русски как «иначе как».
- source_word: בְּדַם שֹׁפְכוֹ
  choice: кровью того, кто её пролил
  rationale: Суффикс отсылает к пролитой крови; формулировка ясно указывает на кровь самого кровопроливца, не используя неестественное буквальное выражение.
theological_decisions:
- issue: Осквернение земли кровопролитием
  choice: Кровопролитие представляет собой действительное нравственно-сакральное осквернение земли, которое снимается лишь кровью виновного в убийстве.
  alternative: Слова об осквернении — только метафора общественного беспорядка или исключительно формула гражданского правосудия.
  rationale: Повторение חנף и употребление כפר показывают, что речь идёт не только об общественном ущербе, но и о вине, затрагивающей землю. Перевод сохраняет это утверждение, не вводя более поздних доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык; повеление передано естественным множественным императивом. Сохранён повтор «осквернять — оскверняет» и юридически-сакральная напряжённость текста. Местоимение «её» однозначно относится к крови.
