base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: ru
  text: Эти города будут для вас убежищем от мстителя[a], чтобы тот, кто лишил другого жизни, не умер прежде, чем предстанет перед общиной на суд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мстителя за кровь», «родственника-мстителя». Еврейское гоэль — название родственника, который здесь выступает как мститель за пролитую кровь.'
    reason: Лексическая альтернатива и пояснение родственно-правового значения גֹּאֵל.
lexical_decisions:
- source_word: וְהָיוּ לָכֶם הֶעָרִים לְמִקְלָט
  choice: Эти города будут для вас убежищем
  rationale: Будущее время передаёт предписывающую силу правовой нормы; указательное «эти» естественно отсылает к названным в ближайшем контексте городам. מִקְלָט обозначает место защиты, поэтому выбрано общеупотребительное «убежище».
- source_word: מִגֹּאֵל
  choice: от мстителя
  rationale: В данном контексте גֹאֵל — родственник, мстящий за пролитую кровь. Краткое «мститель» естественно в основном тексте, а родственная и правовая специфика пояснена в сноске.
- source_word: וְלֹא יָמוּת
  choice: чтобы ... не умер
  rationale: Оборот передаёт цель предоставления убежища и не конкретизирует сверх текста непосредственного исполнителя смерти.
- source_word: הָרֹצֵחַ
  choice: убивший
  rationale: Причастие обозначает человека, лишившего другого жизни, но до суда не обязательно виновного в умышленном убийстве. Субстантивированное «убивший» сохраняет юридическую неопределённость лучше, чем «убийца».
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: прежде, чем предстанет перед общиной
  rationale: Инфинитивная конструкция после עַד имеет временное значение. «Предстанет перед» естественно описывает официальную явку, а «община» передаёт עֵדָה как сообщество, исполняющее здесь судебную функцию.
- source_word: לַמִּשְׁפָּט
  choice: на суд
  rationale: מִשְׁפָּט здесь относится к судебному разбирательству или решению; русское «предстать ... на суд» передаёт правовой смысл кратко и естественно.
theological_decisions:
- issue: Правовой статус הָרֹצֵחַ до разбирательства
  choice: «убивший» без заранее вынесенного нравственного или юридического приговора
  alternative: «убийца» или «преднамеренный убийца»
  rationale: Стих требует суда перед общиной, поэтому перевод не должен заранее определять степень вины или умысел человека.
- issue: Значение גֹאֵל в законе о лишении жизни
  choice: В основном тексте «мститель», в сноске — «мститель за кровь» и указание на родство
  alternative: «кровомститель» или «родственник-мститель» непосредственно в основном тексте
  rationale: Выбор сохраняет ясность современного русского текста, не утрачивая специального родственно-правового значения еврейского термина.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным правовым звучанием. Формулировка избегает архаичного «кровомститель» в основном тексте и не называет человека «убийцей» до судебного решения.
