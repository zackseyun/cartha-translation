  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: ru
  text: Всего городов, которые вы дадите левитам, должно быть сорок восемь — с прилегающими к ним пастбищными угодьями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открытыми землями»; речь идёт о земле вокруг городов, отведённой левитам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Всего городов
  rationale: В сочетании с последующим числом כָּל выражает общее количество; русская конструкция «всего городов... сорок восемь» естественно передаёт итоговый счёт.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: которые вы дадите
  rationale: Относительное предложение с имперфектом 2-го лица множественного числа передано будущим временем, уместным в данном предписании.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Стандартное русское обозначение потомков Левия и получателей городов.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: сорок восемь
  rationale: Еврейское «сорок и восемь город» передано нормативной русской формой составного числительного; слово «городов» уже стоит в начальной конструкции.
- source_word: אֶתְהֶן
  choice: — вместе с
  rationale: Возобновляющий объектный показатель с местоименным суффиксом подчёркивает сами перечисленные города. В русском это значение естественно включается в итоговую конструкцию и связь «вместе с»; отдельное «их» создало бы неясность.
- source_word: מִגְרְשֵׁיהֶן
  choice: прилегающими к ним землями
  rationale: מִגְרָשׁ обозначает незастроенную территорию вокруг города, употреблявшуюся, в частности, для выпаса; нейтральное выражение сохраняет более широкий пространственно-функциональный смысл.
