revisions:
- from: Из городов во владении сынов Израиля, которые вы отдадите левитам, у тех, у кого много, возьмите больше, а у тех, у кого мало, — меньше.[a] Каждое племя пусть отдаст левитам часть своих городов соразмерно полученному им уделу.[b]
  to: 'Города, которые вы отдадите из владений сынов Израиля: от многочисленных племён выделяйте больше, а от малочисленных — меньше.[a] Каждое племя, соразмерно своему наследственному уделу, который оно получит, отдаст левитам часть своих городов.[b]'
  rationale: Исправлены смысловой сдвиг «возьмите», преждевременное введение левитов и несоответствие сноски основному тексту. Сохранены пропорциональный характер распоряжения, традиционное «сыны Израиля» и грамматически отмеченное напряжение между распределительным единственным числом и множественным числом еврейского глагола.
