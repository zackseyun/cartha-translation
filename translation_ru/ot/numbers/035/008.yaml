base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: ru
  text: 'Города, которые вы отдадите из владений сынов Израиля: от многочисленных племён выделяйте больше, а от малочисленных — меньше.[a] Каждое племя, соразмерно своему наследственному уделу, который оно получит, отдаст левитам часть своих городов.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от многочисленного увеличьте, а от малочисленного уменьшите». Речь идёт о пропорциональном числе городов, выделяемых от больших и меньших племенных уделов.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «каждый, соразмерно своему уделу, который они получат». Множественное число «они» относится к племенам/сыновьям Израиля; в русском переводе оно передано единственным числом в соответствии с раскрытым выражением «каждое племя».'
    reason: source_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: города
  rationale: עִיר обозначает город или поселение; «города» соответствует устойчивому обозначению левитских городов в этой главе.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: во владении сынов Израиля
  rationale: אֲחֻזָּה означает земельное владение или наследственное держание; оборот передан естественно по-русски с сохранением формального выражения «сыны Израиля».
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: у тех, у кого много, возьмите больше, а у тех, у кого мало, — меньше
  rationale: 'Еврейский текст эллиптичен: буквально «от многого/многочисленного увеличьте, а от малого/малочисленного уменьшите». Русская формулировка сохраняет контраст и ясно выражает пропорциональное выделение городов, не фиксируя без необходимости, идёт ли речь о численности племени или размере его владения.'
- source_word: אִישׁ
  choice: каждое племя
  rationale: Единственное число имеет распределительное значение. В контексте города выделяют племенные группы, а не отдельные люди; явное «племя» делает русский текст понятным.
- source_word: כְּפִי נַחֲלָתוֹ
  choice: соразмерно полученному им уделу
  rationale: כְּפִי выражает меру или пропорцию; «соразмерно» точно передаёт правовой принцип распределения.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: пусть отдаст левитам часть своих городов
  rationale: Частичный מִן естественно передан словом «часть», а форма обязательства — конструкцией «пусть отдаст».
