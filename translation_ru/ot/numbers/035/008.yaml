  source_fidelity: 'Требуется исправление: «возьмите больше/меньше» передаёт действие взятия, которого в еврейском тексте нет; תַּרְבּוּ / תַּמְעִיטוּ предписывают увеличить или уменьшить число выделяемых городов. Кроме того, левиты названы только в заключительной части стиха, поэтому их не следует вводить в первое относительное предложение. Раскрытие אִישׁ как «каждое племя» оправдано ближайшим контекстом распределения городов между племенами. Множественное יִנְחָלוּ следует отразить в примечании, поскольку русское согласование при таком раскрытии требует единственного числа.'
  naturalness: Предлагаемая редакция сохраняет ясный современный литературный и законодательный стиль. «Выделяйте больше/меньше» естественно выражает пропорциональное назначение городов, не создавая ложного смысла изъятия.
  terminology: «Владения сынов Израиля», «наследственный удел» и «левиты» точны для данного контекста. Слово «племя» добавлено лишь для раскрытия контекстуально необходимого распределительного субъекта, а не как богословская интерпретация.
