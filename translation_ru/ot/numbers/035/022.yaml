  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: ru
  text: Но если он толкнул его внезапно, без вражды, или бросил в него какой-либо предмет, не подстерегая его[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не устраивая засады»; возможно также: «без заранее обдуманного намерения». Буквально речь идёт о том, что человек не подстерегал другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: В контексте вводит противопоставленный предыдущим случаям условный сценарий.
- source_word: בְּפֶתַע
  choice: внезапно
  rationale: Передаёт резкость и неожиданность действия естественным современным русским словом.
- source_word: בְּלֹא אֵיבָה
  choice: без вражды
  rationale: אֵיבָה обозначает личную вражду или неприязнь; «без вражды» кратко и точно сохраняет межличностный смысл.
- source_word: הֲדָפוֹ
  choice: толкнул его
  rationale: Глагол означает толкнуть или оттолкнуть; выбран наиболее ясный вариант для данного правового контекста.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: бросил в него
  rationale: Сочетание глагола «бросать» с עַל здесь указывает на направление брошенного предмета к человеку.
- source_word: כָּל כְּלִי
  choice: какой-либо предмет
  rationale: כְּלִי имеет широкий диапазон значений — предмет, орудие, вещь; общий термин не сужает смысл.
- source_word: בְּלֹא צְדִיָּה
  choice: не подстерегая его
  rationale: צְדִיָּה выражает идею подстерегания или засады; деепричастная конструкция естественна по-русски и сохраняет конкретный образ.
theological_decisions:
- issue: Степень умысла в выражении בְּלֹא צְדִיָּה
  choice: не подстерегая его
  alternative: без умысла
  rationale: Конкретный образ подстерегания сохранён, чтобы не расширять значение до всей современной юридической категории умысла.
translation_notes:
  register: Современный литературный русский язык; правовая формулировка ясная и сдержанная. Сохранена незавершённость условного предложения, продолжающегося в следующем стихе.
