source:
  edition: WLC
  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: ru
  text: 'Отмерьте за городом: с восточной стороны — две тысячи локтей, с южной стороны — две тысячи локтей, с западной стороны[a] — две тысячи локтей и с северной стороны — две тысячи локтей; город же пусть будет посередине. Это будут для них земли вокруг городов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со стороны моря»; в древнееврейском это обычное обозначение запада, где находится Средиземное море.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пастбищные земли городов», «открытые земли при городах». Древнееврейское слово обозначает незастроенную землю вокруг города, часто используемую для выпаса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Отмерьте
  rationale: Форма с союзом в законодательном контексте передаёт предписание; совершенный вид естественно выражает требуемое действие по размежеванию.
- source_word: מִחוּץ לָעִיר
  choice: за городом
  rationale: Передаёт измерение территории вне городской черты и звучит естественно по-русски.
- source_word: פְּאַת
  choice: со стороны
  rationale: В контексте межевания речь идёт о стороне участка, ориентированной по сторонам света, а не об угле.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: с восточной / южной / западной / северной стороны
  rationale: Переданы четыре направления. יָם буквально означает «море», но здесь служит обычным обозначением запада.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: две тысячи локтей
  rationale: Сохранена указанная в источнике древняя мера длины без неточного пересчёта в современные единицы.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: город же пусть будет посередине
  rationale: Передаёт пространственное расположение города внутри размечаемой территории и сохраняет предписывающий характер фразы.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: земли вокруг городов
  rationale: 'Широкая передача не сужает значение до одних пастбищ: термин обозначает незастроенную прилегающую к городу землю, нередко используемую для выпаса.'
