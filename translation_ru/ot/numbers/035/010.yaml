source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: ru
  text: '«Обратись к сынам Израиля и скажи им[a]: „Когда вы перейдёте Иордан и войдёте в землю Ханаанскую…“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к израильтянам»; также возможно: «к детям Израиля». Буквально: «к сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Обратись к
  rationale: Повелительная форма требует обратиться к адресатам; по-русски «обратись к» естественно передаёт конструкцию «говори к», не устраняя последующий отдельный глагол «скажи».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный родственный образ еврейского выражения; более идиоматичное «израильтянам» отмечено как допустимая альтернатива.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Сохраняет второй глагол исходной формулы и её риторическое построение.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Когда вы перейдёте
  rationale: כִּי здесь вводит предстоящее обстоятельство, а местоимение с причастием указывает на будущее пересечение; русское придаточное времени естественно требует совершенного будущего.
- source_word: אֶת הַיַּרְדֵּן
  choice: Иордан
  rationale: Обычное русское географическое название; слово «река» в еврейском тексте отсутствует и для ясности не требуется.
- source_word: אַרְצָה כְּנָעַן
  choice: и войдёте в землю Ханаанскую
  rationale: Направительный суффикс выражает движение в сторону земли Ханаана. Добавленное по смыслу «войдёте» естественно передаёт достижение территории после перехода через Иордан и избегает тяжеловесного «перейдёте Иордан в землю».
