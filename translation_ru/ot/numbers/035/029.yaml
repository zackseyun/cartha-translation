  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: ru
  text: Это будет для вас установлением о судопроизводстве из поколения в поколение во всех местах вашего проживания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всех ваших поселениях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: И пусть это будет
  rationale: В законодательном контексте форма выражает предписание; конструкция с «пусть» естественно передаёт нормативную силу по-русски.
- source_word: אֵלֶּה
  choice: это
  rationale: Указательное местоимение во множественном числе отсылает к предшествующим правовым нормам; русское собирательное «это» звучит естественнее буквального «эти».
- source_word: לָכֶם
  choice: для вас
  rationale: Предлог указывает на адресата и применимость установления к Израилю.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: судебным установлением
  rationale: Передаёт сочетание חֻקָּה — установленной нормы — и מִשְׁפָּט — суда, судебного порядка или решения, не сводя выражение лишь к абстрактной справедливости.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Естественная современная русская формула, передающая непрерывную обязательность нормы для последующих поколений.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: во всех местах вашего проживания
  rationale: Сохраняет всеобщую территориальную применимость и широкий смысл מוֹשָׁב как места жительства или поселения.
