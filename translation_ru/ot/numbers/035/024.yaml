  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: ru
  text: тогда община будет судить между тем, кто нанёс удар, и мстителем за кровь[a] по этим установлениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровным мстителем». Еврейское выражение обозначает человека, на которого возлагалась обязанность отомстить за кровь родственника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по этим судебным правилам». Еврейское слово может обозначать правовые установления или судебные решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: тогда … рассудит
  rationale: Перфект с союзом в последовательности правовых предписаний выражает последующее действие; «рассудит» естественно передаёт судебную функцию שׁפט.
- source_word: הָעֵדָה
  choice: общество
  rationale: עֵדָה обозначает общину Израиля как единое собрание; в данном юридическом контексте «общество» сохраняет коллективный смысл, не сужая его до отдельного суда.
- source_word: בֵּין ... וּבֵין
  choice: между … и
  rationale: Нормальная русская конструкция передаёт повтор предлога в еврейском без стилистической тяжеловесности.
- source_word: הַמַּכֶּה
  choice: тем, кто нанёс удар
  rationale: Субстантивированное причастие от נכה буквально обозначает ударившего. Формулировка не называет его заранее убийцей и тем самым сохраняет процессуальную нейтральность.
- source_word: גֹּאֵל הַדָּם
  choice: мстителем за кровь
  rationale: Передаёт устойчивую древнеизраильскую правовую роль גאל в связи с кровью, не добавляя отсутствующего в стихе явного указания на родство.
- source_word: עַל
  choice: по
  rationale: В правовом контексте выражает соответствие установленным нормам; русское «по» кратко и естественно передаёт смысл «согласно».
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: этим установлениям
  rationale: מִשְׁפָּטִים здесь означает правовые нормы или предписания, по которым выносится решение; «установления» сохраняет официальный регистр и не создаёт впечатления уже вынесенных приговоров.
theological_decisions:
- issue: Судебная роль общины при разбирательстве дела о причинении смерти
  choice: Общество выступает как сторона, рассуживающая между нанесшим удар и мстителем за кровь; нанесший удар не назван заранее убийцей.
  alternative: Понимать הָעֵדָה исключительно как узкую коллегию судей или обозначить הַמַּכֶּה словом «убийца».
  rationale: Еврейский текст возлагает разбирательство на общину и на этом этапе не предрешает, было ли причинение смерти умышленным; перевод сохраняет эту юридическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным юридическим регистром. Синтаксис близок к еврейскому, но естественен по-русски; сохранена процессуальная нейтральность.
