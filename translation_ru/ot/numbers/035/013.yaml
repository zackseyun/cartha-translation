  text: А из городов, которые вы дадите, шесть будут для вас городами-убежищами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: А городов
  rationale: Союз וְ перед определённым существительным вводит связанное с предыдущим контекстом установление; русское «А» естественно передаёт переход к уточнению о числе городов.
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение вводит определительное придаточное к слову «города».
- source_word: תִּתֵּנוּ
  choice: вы дадите
  rationale: Qal, имперфект, 2-е лицо множественного числа от נתן; будущее время естественно передаёт предписываемое действие в данном законодательном контексте.
- source_word: שֵׁשׁ
  choice: шесть
  rationale: Точная передача количественного числительного.
- source_word: עָרֵי מִקְלָט
  choice: городов-убежищ
  rationale: Сопряжённое сочетание означает города, служащие местом убежища; дефисная конструкция ясна и естественна в современном русском языке.
- source_word: תִּהְיֶינָה
  choice: пусть будет
  rationale: Qal, имперфект, 3-е лицо женского рода множественного числа от היה. В сочетании с родительным количества русская конструкция требует единственного числа «будет»; «пусть» передаёт предписывающую силу формы.
- source_word: לָ/כֶם
  choice: у вас
  rationale: В конструкции с היה предлог לְ может обозначать принадлежность или наличие; «у вас» идиоматично передаёт смысл того, что эти города должны быть предоставлены общине.
