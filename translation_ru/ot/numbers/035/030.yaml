revisions:
- from: Если кто убьёт человека, убийцу следует предать смерти по показаниям свидетелей[a]; но показания одного свидетеля недостаточно, чтобы осудить человека на смерть[b].
  to: Тот, кто убил человека, должен быть предан смерти по показаниям свидетелей[a]; но один свидетель не должен свидетельствовать против человека, чтобы тот был предан смерти[b].
  rationale: Редакция сохраняет сжатый правовой характер еврейского текста и различение между убийцей и судебным преданием смерти. Заключительная часть возвращена к прямому значению משפטного глагола «свидетельствовать», тогда как вывод о недопустимости смертного приговора на основании единственного свидетельства остаётся подразумеваемым контекстом, а не внесённым в перевод судебным перефразированием.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:21:04Z'
review_pass:
  verdict: revise
  source_fidelity: Первая часть в целом передаёт правовой смысл, однако «следует» несколько ослабляет законодательную формулу. Существеннее то, что заключительная часть еврейского текста говорит о свидетельстве одного свидетеля в деле, ведущем к смерти, а не прямо о недостаточности его показаний для вынесения приговора. Исправление сохраняет юридический смысл, не подменяя действие свидетеля судебным решением.
  naturalness: Предлагаемая редакция звучит естественно и ясно на современном литературном русском. Формула «должен быть предан смерти» сохраняет официальный юридический регистр исходного текста; «чтобы тот был предан смерти» ясно выражает исходную связь показания и смертного исхода.
  terminology: «Человек» удачно передаёт נֶפֶשׁ в данном правовом контексте. «Предан смерти» уместно отличает судебное наказание от преступного убийства. «Свидетельствовать» точно передаёт юридическое значение יַעֲנֶה; не следует заменять его формулой о достаточности доказательств, поскольку это уже интерпретация.
  issues:
  - severity: medium
    issue: Последняя часть заменяет свидетельствование одного свидетеля выводом о недостаточности доказательств для осуждения.
    rationale: В тексте сказано, что один свидетель не должен свидетельствовать против человека «для смерти»; хотя правовой вывод о недостаточности единственного свидетельства обоснован контекстом, его не следует ставить в основной текст вместо действия, названного в еврейском.
  - severity: low
    issue: «Следует предать смерти» менее категорично, чем законодательная форма исходного текста.
    rationale: В русском «должен быть предан смерти» точнее передаёт нормативную силу משפטной формулы, не добавляя толкования.
