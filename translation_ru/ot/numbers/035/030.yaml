base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: ru
  text: Тот, кто убил человека, должен быть предан смерти по показаниям свидетелей[a]; но один свидетель не должен свидетельствовать против человека, чтобы тот был предан смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам свидетелей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «один свидетель не должен отвечать (то есть давать показание) против человека для смерти».'
    reason: literal_rendering
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: убьёт человека
  rationale: Оборот буквально описывает того, кто поражает человека; в данном правовом контексте речь идёт о причинении смерти, что подтверждается последующим словом «убийца».
- source_word: נֶפֶשׁ
  choice: человек
  rationale: Здесь נֶפֶשׁ обозначает человеческое существо или жизнь, а не «душу» как отдельную от тела составляющую.
- source_word: לְפִי עֵדִים
  choice: по показаниям свидетелей
  rationale: 'Буквальное «по устам свидетелей» является юридической идиомой: решение основывается на свидетельских показаниях.'
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: убийцу следует предать смерти
  rationale: В еврейском тексте для убийцы и его умерщвления употреблён один корень רצח. Русское «убить убийцу» могло бы затушевать судебный характер действия, поэтому выбран ясный юридический оборот.
- source_word: וְעֵד אֶחָד לֹא יַעֲנֶה
  choice: но показания одного свидетеля недостаточно
  rationale: ענה в судебном контексте означает давать показания. Контраст показывает, что единственное свидетельство не может служить достаточным основанием для смертного приговора.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: чтобы осудить человека на смерть
  rationale: Сжатое еврейское выражение буквально связывает свидетельство против человека со смертью; по контексту имеется в виду вынесение смертного приговора.
theological_decisions:
- issue: Различение преступного убийства и судебного исполнения смертного приговора
  choice: «убийцу следует предать смерти»
  alternative: «пусть убьют убийцу»
  rationale: Так передаётся предписанная законом казнь без добавления конфессиональной оценки и без впечатления, будто суд совершает преступное убийство.
- issue: Юридическая сила показаний одного свидетеля
  choice: «показания одного свидетеля недостаточно»
  alternative: «один свидетель не должен свидетельствовать»
  rationale: Запрет относится не к самому выступлению свидетеля, а к использованию единственного свидетельства как основания для смертного приговора.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим звучанием. Синтаксис сделан естественным для широкого читателя; сжатые еврейские правовые обороты пояснены в сносках, без устранения их исходной образности.
