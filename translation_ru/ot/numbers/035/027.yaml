  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: ru
  text: Если мститель за кровь найдёт его вне пределов своего города-убежища и убьёт того, кто лишил жизни, то на мстителе за кровь не будет вины за пролитую кровь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет на нём крови», то есть ему не вменяется вина за пролитую кровь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: мститель за кровь
  rationale: Устойчиво и прозрачно передаёт юридическую роль человека, уполномоченного отомстить за пролитую кровь; родство, хотя оно предполагается институтом, в самом выражении здесь прямо не названо.
- source_word: מִחוּץ לִגְבוּל
  choice: за границей
  rationale: 'Передаёт пространственный и юридический смысл: вне пределов территории, на которой действовала защита города-убежища.'
- source_word: עִיר מִקְלָטוֹ
  choice: города-убежища, где тот укрылся
  rationale: Сохраняет установленное обозначение города-убежища и естественно раскрывает притяжательное отношение, не создавая в русском ошибочной привязки местоимения к мстителю.
- source_word: וְרָצַח
  choice: убьёт
  rationale: Нейтральный глагол соответствует контексту, поскольку следующая фраза прямо снимает с мстителя вину за кровь; «совершит убийство» могло бы ошибочно подразумевать преступность поступка.
- source_word: הָרֹצֵחַ
  choice: того, кто лишил человека жизни
  rationale: Контекст законодательства о городах-убежищах допускает непреднамеренное лишение жизни; формулировка не навязывает значения предумышленного убийства.
- source_word: אֵין לוֹ דָּם
  choice: на мстителе за кровь не будет вины за пролитую кровь
  rationale: Передаёт смысл еврейской юридической идиомы и явно обозначает референта местоимения, который в русском иначе мог бы быть неясен.
theological_decisions:
- issue: Морально-правовой смысл רצח применительно к действию, за которое не вменяется вина за кровь
  choice: 'Передать нейтрально: «убьёт»'
  alternative: «совершит убийство» или «убьёт как преступник»
  rationale: Заключительная оговорка прямо указывает, что это лишение жизни в данных обстоятельствах не влечёт кровной вины; перевод не должен создавать отсутствующее в еврейском тексте противоречие.
- issue: Правовой статус человека, укрывшегося в городе-убежище
  choice: «тот, кто лишил человека жизни»
  alternative: «убийца»
  rationale: Слово הָרֹצֵחַ здесь является юридическим обозначением человека, причинившего смерть, а ближайший контекст включает непреднамеренное причинение смерти; «убийца» в современном русском часто подразумевает преступный умысел.
translation_notes:
  register: Современный литературный русский с юридической ясностью. Синтаксис сохраняет связь с условной конструкцией предыдущего стиха; повтор «мститель за кровь» в заключении устраняет возможную двусмысленность русского местоимения.
