  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: ru
  text: Ведь он должен оставаться в своём городе-убежище до смерти первосвященника, а после смерти первосвященника тот, кто убил[a], может вернуться на принадлежащую ему землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «убивший». Еврейское слово здесь обозначает юридическую категорию в законах о городах-убежищах и не обязательно означает умышленного убийцу.
    reason: lexical_alternative
  - marker: b
    text: Или «в своё земельное владение» или «на землю, составляющую его собственность».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего правового предписания; «ведь» естественно передаёт пояснительную связь в современном русском языке.
- source_word: בְעִיר מִקְלָטוֹ
  choice: в своём городе-убежище
  rationale: Передаёт и принадлежность, выраженную суффиксом, и установленное юридическое обозначение города, предоставляющего убежище.
- source_word: יֵשֵׁב
  choice: должен оставаться
  rationale: В данном законодательном контексте глагол описывает не просто проживание, а обязательное пребывание в установленном месте.
- source_word: עַד מוֹת
  choice: до смерти
  rationale: Сохраняет именную конструкцию еврейского текста и естественно звучит по-русски.
- source_word: הַכֹּהֵן הַגָּדֹל
  choice: первосвященник
  rationale: Общепринятое и точное русское наименование этой должности.
- source_word: וְאַחֲרֵי מוֹת
  choice: а после смерти
  rationale: Сохраняет временную последовательность и повтор формулы; противительно-переходное «а» естественно отмечает изменение правового положения.
- source_word: הָרֹצֵחַ
  choice: тот, кто убил
  rationale: Передаёт юридическую категорию лица, лишившего человека жизни, не вынося заранее вердикта об умышленном убийстве.
- source_word: יָשׁוּב
  choice: может вернуться
  rationale: В контексте отмены прежнего ограничения форма выражает восстановленное право вернуться, а не только предсказание или приказ.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: в землю своего владения
  rationale: Сохраняет земельно-правовой смысл אֲחֻזָּה и связь владения с конкретной землёй, не добавляя идеи наследования, прямо не выраженной здесь.
theological_decisions:
- issue: Следует ли переводить הָרֹצֵחַ словом, заранее определяющим убийство как преступное и умышленное
  choice: тот, кто убил
  alternative: убийца
  rationale: Законы о городах-убежищах различают умышленное убийство и лишение жизни без умысла. Нейтральная описательная формулировка сохраняет юридическую и богословскую напряжённость текста, не приписывая человеку вины, которой этот стих сам по себе не устанавливает.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, уместным для законодательного текста. Повтор «смерти первосвященника» сохранён как значимый элемент еврейской правовой формулы; все сноски поставлены непосредственно при поясняемых выражениях.
