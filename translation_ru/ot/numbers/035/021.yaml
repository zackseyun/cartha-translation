  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: ru
  text: 'Или если он из вражды[a] ударил его рукой и тот умер, ударивший непременно должен быть предан смерти: он убийца. Мститель за кровь[b] предаст убийцу смерти, когда встретит его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ненависти», «по вражде».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть родственник, на котором лежала обязанность отомстить за кровь убитого; возможно также: «кровомститель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: из вражды
  rationale: Существительное אֵיבָה обозначает вражду, ненависть или неприязнь; «из вражды» естественно по-русски передаёт как состояние вражды, так и враждебный умысел в данном правовом контексте.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: ударил его своей рукой
  rationale: Сохраняется прямое значение נכה и явно названное средство действия — рука, что важно для разбираемого законом случая.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Союзная последовательность еврейского текста сохранена без усиления причинной связи; местоимение «тот» устраняет возможную русскую двусмысленность относительно умершего.
- source_word: מוֹת יוּמַת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня выражает эмфатическую обязательность смертного приговора; формулировка сохраняет торжественный правовой регистр.
- source_word: הַמַּכֶּה
  choice: ударивший
  rationale: Причастная форма кратко и естественно передаёт буквальное «тот, кто ударил», связывая приговор с уже описанным действием.
- source_word: רֹצֵחַ הוּא
  choice: он убийца
  rationale: Контекст прямо указывает на враждебный умысел, поэтому «убийца» передаёт категорию виновного намеренного лишения жизни, а не случайного причинения смерти.
- source_word: גֹּאֵל הַדָּם
  choice: мститель за кровь
  rationale: Формулировка сохраняет особый правовой титул и образ крови; родственная функция גֹּאֵל отмечена в сноске, но не добавлена в основной текст.
- source_word: יָמִית
  choice: предаст ... смерти
  rationale: Юридически окрашенное выражение соответствует контексту исполнения установленного смертного приговора и перекликается с предшествующей формулой.
- source_word: בְּפִגְעוֹ בוֹ
  choice: когда встретит его
  rationale: Передаёт обстоятельственное значение встречи или столкновения без добавления не выраженных в тексте подробностей.
theological_decisions:
- issue: Правовая категория намеренного лишения жизни
  choice: убийца
  alternative: человек, лишивший жизни
  rationale: Упоминание вражды обозначает умысел и отличает этот случай от нечаянного убийства, обсуждаемого в главе; «убийца» сохраняет правовую и нравственную определённость текста.
- issue: Передача גֹּאֵל הַדָּם
  choice: мститель за кровь
  alternative: родственник-мститель за кровь
  rationale: Основной текст сохраняет краткий древнеизраильский правовой титул, не превращая подразумеваемую родственную обязанность в явно высказанную; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным правовым регистром. Синтаксис следует последовательности еврейского текста, но местоименная отсылка уточнена ради естественности и однозначности по-русски.
