base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: ru
  text: Из городов, которые вы дадите левитам, шесть будут городами-убежищами[a], куда сможет бежать человек, лишивший кого-либо жизни; помимо них дайте ещё сорок два города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение означает города, служившие убежищем для человека, лишившего кого-либо жизни. Еврейское слово, обозначающее такого человека, само по себе здесь не уточняет, было ли лишение жизни умышленным или неумышленным.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: города
  rationale: עִיר обозначает город или селение; в контексте распределения левитских владений естественно и традиционно «города».
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Дательный падеж прямо передаёт получателей городов.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: шесть городов-убежищ
  rationale: מִקְלָט означает убежище или место укрытия; сложное наименование «города-убежища» ясно передаёт установленный юридический статус этих городов.
- source_word: לָנוּס שָׁמָּה
  choice: чтобы туда мог бежать
  rationale: Передаёт значение נוּס «бежать, спасаться бегством» и направительное שָׁמָּה «туда»; «мог» естественно выражает назначение городов.
- source_word: הָרֹצֵחַ
  choice: человек, лишивший кого-либо жизни
  rationale: В данном правовом контексте причастие רֹצֵחַ называет совершившего убийство человека, но само по себе здесь не определяет, было ли оно умышленным или неумышленным. Описательный перевод сохраняет эту неопределённость и звучит естественнее, чем узкие русские термины «убийца» или «неумышленный убийца».
- source_word: וַעֲלֵיהֶם
  choice: кроме них
  rationale: Идиома с על выражает добавление к уже названным шести городам, а не пространственное положение.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: сорок два города
  rationale: После числительного еврейский текст употребляет существительное в единственном числе, тогда как литературный русский требует формы «города».
theological_decisions:
- issue: Степень виновности הָרֹצֵחַ
  choice: Не уточнять, было ли лишение жизни умышленным или неумышленным
  alternative: «убийца» или «неумышленный убийца»
  rationale: Сам термин в этом стихе не разрешает вопрос о намерении; последующие правовые разграничения в главе не следует преждевременно вносить в перевод данного выражения.
translation_notes:
  register: 'Современный литературный русский с ясным юридико-повествовательным звучанием. Перестройка начальной конструкции устраняет тяжёлый буквальный синтаксис, сохраняя соотношение: из передаваемых левитам городов шесть имеют статус городов-убежищ, а сверх них даются ещё сорок два.'
