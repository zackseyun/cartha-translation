  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: ru
  text: Если же он ударил его камнем[a], который можно держать в руке и который способен причинить смерть, и тот умер, то он убийца; убийца непременно должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «камнем руки»; вероятно, речь о камне, который держат в руке или который пригоден для использования рукой как оружие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Или если
  rationale: Вводит ещё один случай в последовательности правовых условий; «или если» естественно передаёт разделительный характер связи.
- source_word: בְּאֶבֶן יָד
  choice: камнем, бывшим у него в руке
  rationale: Буквально «камнем руки»; формулировка сохраняет образ камня в руке и не утверждает точнее, чем позволяет еврейское выражение, его размер или специальное назначение.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: от которого можно умереть
  rationale: Относительное предложение указывает на смертоносную способность камня, а не только на исход данного случая.
- source_word: הִכָּהוּ
  choice: он ударил его
  rationale: Передаёт обычное значение נכה без преждевременного включения результата, который далее назван отдельно.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Сохраняет последовательность еврейского текста; указательное местоимение естественно различает погибшего и ударившего в русском предложении.
- source_word: רֹצֵחַ הוּא
  choice: то он убийца
  rationale: В данном правовом контексте רצח обозначает виновного в умышленном смертоубийстве, а не нейтрально всякого, кто причинил смерть.
- source_word: מוֹת יוּמַת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиленную и обязательную правовую санкцию.
- source_word: הָרֹצֵחַ
  choice: убийца
  rationale: Повтор существительного сохраняет юридическую определённость и эмфазу оригинала; в русском нулевой артикль не препятствует этому.
theological_decisions:
- issue: Правовая квалификация лишившего жизни в законодательстве о городах-убежищах
  choice: Передать רצח словом «убийца» как обозначением виновного в преступном убийстве.
  alternative: «лишивший жизни» или «человекоубийца»
  rationale: Ближайший контекст противопоставляет этот случай неумышленному причинению смерти. «Убийца» сохраняет правовую и нравственную оценку текста, не привнося более поздних доктринальных построений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридическим звучанием. Сохранены условная структура, повтор слова «убийца» и усилительный характер смертного приговора.
