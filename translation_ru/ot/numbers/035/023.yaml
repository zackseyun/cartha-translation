  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: ru
  text: или, не видя[a], уронил на человека какой-либо камень, способный причинить смерть, так что тот умер, хотя он не был ему врагом и не желал ему зла, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не видя». Это выражение указывает на отсутствие осознания происходящего, но не обязательно означает, что человек вообще ничего не видел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: или
  rationale: Простой разделительный союз продолжает ряд возможных случаев, начатый в предыдущем стихе.
- source_word: בְּכָל אֶבֶן
  choice: каким-либо камнем
  rationale: Предлог בְּ имеет здесь инструментальное значение, а כָל в таком отрицательно-неопределённом правовом контексте естественно передаётся как «каким-либо».
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: от которого можно умереть
  rationale: Оборот характеризует камень как способный причинить смерть; безличная русская конструкция сохраняет обобщённый смысл формы 3-го лица мужского рода.
- source_word: בְּלֹא רְאוֹת
  choice: не видя
  rationale: Сохранён конкретный еврейский образ без сведения его смысла лишь к абстрактному «неумышленно».
- source_word: וַיִּפֵּל עָלָיו
  choice: уронил его на человека
  rationale: Каузативная форма глагола נפל указывает, что действующее лицо заставило камень упасть. «Уронил» передаёт это естественнее, чем более намеренное «бросил»; существительное «человека» снимает неясность русской цепочки местоимений.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Союз сохраняет последовательность еврейского повествования, а указательное местоимение ясно обозначает погибшего.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: хотя он не был ему врагом
  rationale: '«Хотя» естественно выражает пояснительно-уступительное отношение: смертельный исход произошёл при отсутствии вражды.'
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: и не желал ему зла
  rationale: В данном правовом контексте רָעָה означает причинение вреда; русский устойчивый оборот передаёт отсутствие злого умысла, не добавляя конфессионального толкования.
