  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: ru
  text: то назначьте[a] себе города; они будут для вас городами-убежищами, и туда убежит тот, кто неумышленно лишил человека жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выделите» либо «определите».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «убивший, поражающий человека по неосторожности»; речь идёт о неумышленном лишении жизни, а не о преднамеренном убийстве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: назначьте
  rationale: Порода хифиль глагола קרה в данном законодательном контексте означает выделение или определение конкретных городов. «Назначьте» естественно передаёт официальный характер действия.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: города ... города-убежища
  rationale: Сохранены повтор слова «города» и юридически значимое название особой категории городов.
- source_word: מִקְלָט
  choice: убежище
  rationale: Слово обозначает защищённое место, куда можно скрыться от преследования; «убежище» точно и понятно передаёт эту функцию.
- source_word: וְנָס שָׁמָּה
  choice: и туда убежит
  rationale: Глагольная форма в последовательности законодательных предписаний имеет будущее и результативно-нормативное значение. «Убежит» сохраняет форму исходного текста без чрезмерного усиления до «должен бежать».
- source_word: רֹצֵחַ
  choice: тот, кто ... лишил человека жизни
  rationale: Русское «убийца» нередко подразумевает умышленное преступление, тогда как последующее בִּשְׁגָגָה прямо указывает на отсутствие умысла. Описательная передача избегает ложной юридической окраски.
- source_word: מַכֵּה נֶפֶשׁ
  choice: лишил человека жизни
  rationale: Буквально выражение означает «поражающий человека/жизнь», но в контексте речь идёт о смертельном исходе. Выбранная формулировка прямо и естественно выражает этот смысл.
- source_word: נֶפֶשׁ
  choice: человека
  rationale: Здесь נֶפֶשׁ обозначает человеческое лицо как жертву смертельного действия, а не нематериальную «душу».
- source_word: בִּשְׁגָגָה
  choice: неумышленно
  rationale: Термин указывает на действие без намерения и проводит юридическую границу между непреднамеренным лишением жизни и умышленным убийством.
theological_decisions:
- issue: Правовая характеристика лишившего жизни
  choice: Описательно передать как «тот, кто неумышленно лишил человека жизни».
  alternative: «убийца» или «человекоубийца»
  rationale: Такой перевод не приписывает человеку умысел или степень вины, которых стих не утверждает, и сохраняет установленное Торой различие между умышленным и неумышленным лишением жизни.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим оттенком. Конструкция «города-убежища» сохраняет традиционно узнаваемый библейский термин, не становясь архаичной; описательная передача виновника предотвращает неуместное подразумевание умысла.
