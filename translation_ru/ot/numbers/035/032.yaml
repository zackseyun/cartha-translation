base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: ru
  text: Не берите выкупа[a] с того, кто бежал в свой город-убежище[b], чтобы он мог вернуться и жить в земле прежде смерти священника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмещения», «платы». Еврейское כֹּפֶר означает выкупную цену или возмещающую плату.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская конструкция сжата; её можно также понимать как запрет брать плату, связанную с бегством в город-убежище, пребыванием в нём или возвращением из него прежде смерти священника.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: выкуп
  rationale: «Выкуп» передаёт установленную плату, принимаемую вместо предусмотренного законом последствия; «взятка» была бы излишне оценочной, а «плата» — слишком широкой.
- source_word: לָנוּס
  choice: с того, кто бежал
  rationale: Инфинитив נוּס буквально связан с бегством. В данном правовом контексте естественная русская формулировка обозначает уже бежавшего в город-убежище, не устраняя компактности и неоднозначности еврейского синтаксиса.
- source_word: עִיר מִקְלָטוֹ
  choice: свой город-убежище
  rationale: Сложное наименование «город-убежище» ясно обозначает установленное место защиты и передаёт притяжательный суффикс третьего лица.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: вернуться и жить в земле
  rationale: Два инфинитива выражают возвращение и последующее проживание; «жить» звучит современно и естественно, сохраняя смысл ישב.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: до смерти священника
  rationale: Формально передаёт временную границу, выраженную עַד, не подменяя её более истолковывающим «прежде смерти».
theological_decisions:
- issue: Правовая направленность запрета и связь выкупа с городом-убежищем и возвращением
  choice: Текст запрещает принимать выкуп, благодаря которому бежавший мог бы вернуться и жить в земле до смерти священника.
  alternative: Выкуп может пониматься как плата, связанная непосредственно с бегством в город-убежище либо с пребыванием там, а не только с досрочным возвращением.
  rationale: Еврейская конструкция с לָנוּס и последующими инфинитивами сжата. Основной текст передаёт наиболее связное правовое прочтение, а примечание сохраняет реальную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. «Город-убежище» последовательно передаёт специальный термин; синтаксическая неоднозначность оригинала вынесена в примечание, а не устранена догматическим толкованием.
