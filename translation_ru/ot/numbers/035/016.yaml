id: NUM.35.16
reference: Numbers 35:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: ru
  text: Если же он ударил его железным орудием и тот умер[a], то он убийца; убийца непременно должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «железным предметом». Еврейское слово имеет широкое значение и само по себе не указывает на конкретный вид оружия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Передаёт условие и одновременно переход к следующему, противопоставленному правовому случаю; естественно звучит в современном русском законодательном изложении.
- source_word: בִּכְלִי בַרְזֶל
  choice: железным орудием
  rationale: כְּלִי — широкое обозначение предмета или орудия; слово «орудие» не уточняет без достаточного основания, что это было специально изготовленное оружие.
- source_word: הִכָּהוּ
  choice: он ударил его
  rationale: Точно и естественно передаёт значение Hiphil глагола נכה в данном правовом контексте.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Сохраняет последовательность еврейского текста, не усиливая причинную связь; местоимение «тот» устраняет возможную для русского языка неясность, кто умер.
- source_word: רֹצֵחַ הוּא
  choice: то он убийца
  rationale: רֹצֵחַ здесь обозначает лицо, юридически признанное виновным в убийстве, в отличие от совершившего непреднамеренное человекоубийство.
- source_word: מוֹת יוּמַת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой подчёркивает обязательность смертного приговора; перевод сохраняет как усиление, так и пассивную конструкцию.
- source_word: הָרֹצֵחַ
  choice: убийца
  rationale: Определённая форма повторно называет правовой статус виновного; в русском повтор без местоименного дополнения звучит ясно и весомо.
theological_decisions:
- issue: Правовая квалификация רֹצֵחַ в данном стихе
  choice: убийца
  alternative: человекоубийца / тот, кто убил
  rationale: В контексте законодательства Чисел 35 стих относит виновного к категории умышленного и подлежащего смерти убийцы, противопоставленной совершившему убийство нечаянно. При этом перевод не добавляет мотивов сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством правового установления. Конструкция «если же… то» делает условную структуру прозрачной; «предан смерти» сохраняет формальность и пассивный характер еврейской формулы.
