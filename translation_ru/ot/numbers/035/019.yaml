  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: ru
  text: Мститель за кровь сам предаст убийцу смерти; встретив его, он сам предаст его смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: мститель за кровь
  rationale: Устойчивое юридическое выражение обозначает родственника, обязанного отомстить за пролитую кровь. Формулировка сохраняет правовой термин и не привносит несвойственный контексту смысл «искупителя».
- source_word: הוּא
  choice: сам / он сам
  rationale: Самостоятельное местоимение имеет усилительное значение и подчёркивает, что действие совершает именно мститель за кровь.
- source_word: יָמִית
  choice: должен предать ... смерти
  rationale: Каузативная форма глагола מות в данном законодательном контексте означает лишение жизни. «Предать смерти» сохраняет юридическую торжественность, а «должен» передаёт нормативную силу имперфекта.
- source_word: הָרֹצֵחַ
  choice: убийцу
  rationale: В контексте установленных ранее различий речь идёт о виновном в убийстве, подлежащем смерти; «убийца» естественно и точно передаёт этот смысл.
- source_word: בְּפִגְעוֹ בוֹ
  choice: встретив его
  rationale: Инфинитивная конструкция с предлогом обозначает момент встречи или столкновения; деепричастный оборот естественно передаёт временное отношение.
- source_word: הוּא יְמִיתֶנּוּ
  choice: он сам должен предать его смерти
  rationale: Повтор подлежащего и сказуемого намеренно сохранён, поскольку в еврейском тексте он подчёркивает как полномочного исполнителя, так и действие.
theological_decisions:
- issue: Правовой статус גֹּאֵל הַדָּם
  choice: Передать как человеческого родственника — «мстителя за кровь» — в рамках израильского законодательства об убийстве.
  alternative: «искупитель крови» или «родственник-искупитель»
  rationale: Здесь גֹּאֵל обозначает не богословское искупление, а установленную законом родственную обязанность в связи с незаконно пролитой кровью.
translation_notes:
  register: Современный литературный русский язык с достойным юридическим звучанием. Синтаксический повтор оригинала сохранён ради смыслового ударения; устаревшее «кровомститель» не использовано.
