  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: ru
  text: Или если он ударил его деревянным предметом, который он держал в руке[a] и которым можно убить, и тот умер, то ударивший — убийца; убийца непременно должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деревянным орудием в руке»; возможно также: «деревянным предметом, который можно держать в руке».'
    reason: Лексико-синтаксическое сочетание כְלִי עֵץ יָד допускает понимание как предмета, находящегося в руке, так и ручного деревянного орудия.
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: деревянным предметом, который был у него в руке
  rationale: כְּלִי — широкое обозначение предмета, орудия или инструмента; в данном законе оно не требует более узкого слова «оружие». יָד указывает на предмет, находящийся в руке или пригодный для удержания в руке. Основной текст сохраняет образ еврейского выражения, а сноска отмечает возможные более сжатые передачи.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: которым можно убить
  rationale: Оборот характеризует предмет как способный причинить смерть. По-русски «которым можно убить» естественно выражает его смертоносность и сохраняет безличный потенциал конструкции.
- source_word: הִכָּהוּ
  choice: он ударил его
  rationale: Глагол נכה означает «ударить, поразить». Выбрано нейтральное «ударил», не предвосхищающее сообщаемую далее смерть пострадавшего.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Союзная последовательность передана прямо; указательное «тот» устраняет в русском тексте неясность местоименных отсылок, не добавляя причинной связи сверх оригинала.
- source_word: רֹצֵחַ
  choice: убийца
  rationale: В контексте разграничения умышленного и неумышленного причинения смерти слово имеет юридически осуждающий смысл. Русское «убийца» соответствует этому значению, тогда как «тот, кто убил» было бы чрезмерно широким.
- source_word: מוֹת יוּמַת
  choice: непременно должен быть предан смерти
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает обязательность смертного приговора. «Непременно должен быть предан смерти» передаёт и эмфазу, и юридическую необходимость без архаического синтаксиса.
theological_decisions:
- issue: Юридическая квалификация רֹצֵחַ в законе об убийстве
  choice: убийца
  alternative: убивший; человекоубийца
  rationale: Ближайший контекст противопоставляет виновного убийцу тому, кто причинил смерть ненамеренно, и устанавливает смертную казнь. «Убийца» передаёт юридико-нравственную оценку текста, не вводя дополнительных конфессиональных выводов.
- issue: Характер смертной казни в выражении מוֹת יוּמַת
  choice: непременно должен быть предан смерти
  alternative: да будет предан смерти; непременно будет умерщвлён
  rationale: Формулировка сохраняет предписывающую силу закона и усиление еврейской конструкции, не уточняя не названного здесь исполнителя приговора.
translation_notes:
  register: Современный литературный русский язык с достоинством юридического текста. Синтаксис сделан ясным для обычного читателя; сохранены последовательность условий и усиленная формула наказания. Терминология не архаизирована и не привязана к конфессиональной традиции.
