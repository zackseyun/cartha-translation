  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: ru
  text: Три из городов выделите[a] за Иорданом[b], а три города — в земле Ханаана; они будут городами-убежищами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дайте»; здесь — «выделите», предназначив для этой цели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по ту сторону Иордана». Еврейское выражение обозначает сторону реки относительно принятой точки отсчёта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנוּ
  choice: выделите
  rationale: Глагол נתן буквально означает «дать», но здесь, в правовом контексте, речь идёт о выделении городов для особого назначения. «Выделите» естественно передаёт административно-целевой смысл, не добавляя идеи назначения должностных лиц.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: за Иорданом
  rationale: Краткое и естественное географическое выражение, сохраняющее относительный характер еврейского оборота; точная сторона реки определяется контекстом.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Передаёт как существительное אֶרֶץ «земля», так и территориальное имя כְּנָעַן, сохраняя достоинство библейского повествования и оставаясь понятным современному читателю.
- source_word: עָרֵי מִקְלָט
  choice: города-убежища
  rationale: 'Ясно и кратко передаёт установленный правовой термин: города, предназначенные служить местом укрытия.'
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: три из этих городов ... а три
  rationale: Определённая форма הֶעָרִים указывает на города из уже названной совокупности; «из этих городов» естественно выражает это по-русски, а во второй части существительное не повторяется ради плавности.
- source_word: תִּהְיֶינָה
  choice: они будут
  rationale: Форма глагола היה обозначает установленный для шести городов статус или назначение; будущее время естественно передаёт правовое предписание.
