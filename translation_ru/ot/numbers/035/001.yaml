  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею на равнинах Моава, у Иордана, напротив Иерихона:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Стандартная повествовательная формула, вводящая новое речевое событие; несовершенный вид естественен в традиционной русской формуле «И говорил…».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русское беспредложное управление глагола «говорить» дательным падежом естественно передаёт адресата.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עֲרָבוֹת обозначает равнинную степную местность; «равнины Моава» — ясное и привычное географическое выражение.
- source_word: עַל יַרְדֵּן
  choice: у Иордана
  rationale: В географическом контексте עַל выражает близость к реке; «у Иордана» естественно по-русски.
- source_word: יְרֵחוֹ
  choice: напротив Иерихона
  rationale: В сочетании עַל־יַרְדֵּן יְרֵחוֹ название Иерихона уточняет участок Иордана или расположение равнин; «напротив Иерихона» ясно передаёт подразумеваемую пространственную связь, не отождествляя место с самим городом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Русское двоеточие естественно вводит последующее содержание речи и избегает тяжеловесного буквального «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «И» сохраняет повествовательную связь. Двоеточие функционально передаёт לֵאמֹר; стих намеренно остаётся незавершённым введением к следующей речи.
