  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: ru
  text: Но если тот, кто убил человека, действительно выйдет за границу своего города-убежища, куда он бежал,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выйдет за пределы своего города-убежища, куда он бежал». В еврейском тексте абсолютный инфинитив сочетается с личной формой глагола (условно: «выйти выйдет»), усиливая значение действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: В данном правовом контексте союз вводит условие, противопоставленное установленному в предыдущих стихах порядку; «но если» естественно передаёт этот переход.
- source_word: יָצֹא יֵצֵא
  choice: всё же выйдет
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие. Частица «всё же» передаёт эмфазу естественно для современного русского языка.
- source_word: הָרֹצֵחַ
  choice: тот, кто убил человека
  rationale: В законе о городах-убежищах слово обозначает человека, причинившего смерть, но не обязательно виновного в умышленном убийстве. Описательная передача не предрешает степень его вины.
- source_word: אֶת גְּבוּל
  choice: за пределы
  rationale: При глаголе «выйти» выражение указывает на пересечение границы; «выйдет за пределы» ясно и естественно передаёт юридически значимый выход за установленную черту.
- source_word: עִיר מִקְלָטוֹ
  choice: своего города-убежища
  rationale: Сохраняется значение специального места убежища и местоименный суффикс; «своего» по-русски однозначно соотносится с подлежащим.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: куда он бежал
  rationale: Относительное придаточное определяет город как место, к которому направлялось его бегство; «куда» передаёт направительное значение שָׁמָּה.
theological_decisions:
- issue: Степень вины обозначенного лица
  choice: Нейтральное «тот, кто убил человека»
  alternative: «убийца»
  rationale: Контекст различает умышленное убийство и причинение смерти без умысла. Перевод не должен заранее приписывать этому лицу виновность в преднамеренном убийстве.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Сохранена незавершённость условной конструкции, продолжающейся в следующем стихе; термин передан нейтрально, без преждевременного вывода об умысле.
