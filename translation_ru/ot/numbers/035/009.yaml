  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Форма wayyiqtol от דבר вводит новый повествовательный шаг; в устойчивой русской библейской формуле «говорил…» естественно вводит последующую прямую речь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом; «Яхве» — общепринятая современная русская транслитерация.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Еврейская конструкция с предлогом אֶל обозначает адресата речи; русский дательный падеж передаёт её естественно и точно.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» служит формульным введением содержания речи. В современном русском двоеточие перед последующей прямой речью передаёт ту же функцию без тяжеловесного повтора «говорил… говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя YHWH. Передача «Яхве» сохраняет личное имя и не подменяет его титулом, при этом сноска сообщает традиционный вариант.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейского повествования. Формула сделана естественной для русского синтаксиса; двоеточие вводит речь, начинающуюся в следующем стихе.
