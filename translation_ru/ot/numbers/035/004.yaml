revisions:
- from: А земли вокруг городов, которые вы дадите левитам, пусть простираются от городской стены наружу на тысячу локтей со всех сторон[a][b].
  to: А земли вокруг городов, которые вы дадите левитам, должны простираться от городской стены наружу на тысячу локтей со всех сторон[a][b].
  rationale: Заменено «пусть простираются» на «должны простираться», чтобы передать законодательную силу высказывания без оттенка пожелания. Примечание о מִגְרָשׁ сокращено до лексически надёжного описания и не навязывает конкретный режим пользования. Смысл, мера и спорная возможность понимать «стену» как границу города сохранены.
