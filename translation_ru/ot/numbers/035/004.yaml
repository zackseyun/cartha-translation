  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: ru
  text: А земли вокруг городов, которые вы дадите левитам, должны простираться от городской стены наружу на тысячу локтей со всех сторон[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пастбища»; еврейское слово обозначает прилегающую к городу незастроенную землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от стены города»; некоторые понимают это шире — «от границы города».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: земли вокруг городов
  rationale: מִגְרָשׁ обозначает незастроенную землю при поселении, отведённую для пользования его жителям, в данном контексте — левитам. Нейтральное «земли вокруг городов» сохраняет широту значения, не сводя его исключительно к пастбищам.
- source_word: הֶעָרִים
  choice: городов
  rationale: עִיר означает город или поселение; «город» соответствует устойчивой терминологии данного отрывка.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: которые вы дадите
  rationale: Передаёт относительное придаточное и будущее предписывающее значение формы תִּתְּנוּ.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Прямо обозначает получателей городов и прилегающих земель.
- source_word: מִקִּיר הָעִיר
  choice: от городской стены
  rationale: קִיר обычно означает «стена»; перевод сохраняет конкретный образ исходного текста, тогда как более общее понимание границы города вынесено в примечание.
- source_word: וָחוּצָה
  choice: наружу
  rationale: Передаёт направительное значение формы — от стены во внешнюю сторону.
- source_word: אֶלֶף אַמָּה
  choice: на тысячу локтей
  rationale: Сохраняет древнюю меру длины и конкретное числовое значение исходного текста.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Ясно передаёт, что указанное расстояние относится ко всей окружности города.
