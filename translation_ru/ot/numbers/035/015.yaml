base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: ru
  text: Эти шесть городов будут убежищем для сынов Израиля[a], для пришельца и для поселенца, живущих среди них[b], чтобы всякий, кто неумышленно лишил человека жизни[c], мог бежать туда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; также возможно: «детей Израиля».'
    reason: lexical_alternative
  - marker: b
    text: «Пришелец» и «поселенец» передают два разных еврейских слова (גֵּר и תּוֹשָׁב), обозначающие лиц не израильского происхождения, проживавших среди израильтян.
    reason: cultural_note
  - marker: c
    text: 'Или: «всякий человекоубийца». Буквально: «всякий, поразивший человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохраняет форму устойчивого этноковенантного обозначения; более гладкий вариант «для израильтян» отмечен в сноске.
- source_word: גֵּר
  choice: пришелец
  rationale: Передаёт неурождённого жителя, проживающего внутри израильского общества и пользующегося его защитой; соответствует достоинству юридического контекста.
- source_word: תּוֹשָׁב
  choice: поселенец
  rationale: Отличает вторую категорию проживающего в земле неурождённого лица от גֵּר, не прибегая к тяжеловесной административной терминологии.
- source_word: בְּתוֹכָם
  choice: живущих среди них
  rationale: Естественно связывает выражение «среди них» с двумя названными категориями жителей и ясно передаёт их присутствие внутри общества Израиля.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: эти шесть городов будут убежищем
  rationale: Передаёт юридическое назначение городов ясным современным русским языком.
- source_word: לָנוּס שָׁמָּה
  choice: чтобы туда мог бежать
  rationale: Явно выражает целевое значение еврейского инфинитива.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: всякий, кто убил человека
  rationale: В контексте закона выражение означает причинение смерти человеку; такая передача яснее буквального «поразивший душу».
- source_word: בִּשְׁגָגָה
  choice: неумышленно
  rationale: Точно передаёт отсутствие намерения, составляющее ключевое юридическое различие в законе о городах-убежищах.
theological_decisions:
- issue: Родовая и заветная формула בְּנֵי יִשְׂרָאֵל
  choice: Сохранить в основном тексте «сыны Израиля»
  alternative: «израильтяне» или «дети Израиля»
  rationale: Формулировка сохраняет грамматическую и традиционную форму национально-заветного обозначения, не ограничивая смысл только непосредственными сыновьями патриарха; более идиоматичный этноним дан в сноске.
- issue: Правовой смысл неумышленного убийства
  choice: «кто убил человека неумышленно»
  alternative: «кто по ошибке поразил душу»
  rationale: Контекст говорит о причинении человеческой смерти без умысла. Перевод не вводит дополнительных условий виновности и сохраняет установленное текстом различие между умышленным и неумышленным деянием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридическим звучанием. Синтаксис упрощён ради ясности, но различие между двумя категориями неурождённых жителей и традиционная формула «сыны Израиля» сохранены.
