  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: ru
  text: Не принимайте выкуп за жизнь убийцы, подлежащего смертной казни,[a] ибо он непременно должен быть казнён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «убийцы, который виновен (или: признан нечестивым) для смерти». В данном судебном контексте речь идёт об убийце, подлежащем смертной казни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: берите
  rationale: В сочетании с כֹּפֶר глагол означает принятие платежа; русское «брать выкуп» естественно для правового предписания и сохраняет близость к форме оригинала.
- source_word: כֹּפֶר
  choice: выкуп
  rationale: Слово обозначает плату, предназначенную для отвращения наказания или освобождения; «выкуп» передаёт этот юридический смысл, не сводя платёж к взятке или обычному возмещению.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: за жизнь убийцы
  rationale: 'נֶפֶשׁ здесь относится к жизни человека: запрещено принимать плату, чтобы сохранить убийце жизнь.'
- source_word: רֹצֵחַ
  choice: убийца
  rationale: В контексте главы проводится различие между непреднамеренным лишением жизни и виновным убийством; последующая формула указывает на лицо, подлежащее смерти.
- source_word: רָשָׁע לָמוּת
  choice: повинного смерти
  rationale: 'Сочетание имеет судебный смысл: человек признан виновным и подлежит смертной казни. «Повинный смерти» сохраняет лаконичность и юридическую окраску оригинала.'
- source_word: כִּי מוֹת יוּמָת
  choice: он непременно должен быть предан смерти
  rationale: Инфинитив абсолютный при личной форме усиливает обязательность и определённость приговора; «непременно должен» передаёт эмфазу, а «предан смерти» — каузативно-пассивный смысл.
theological_decisions:
- issue: Обязательная сила смертного приговора
  choice: 'Стих содержит обязательное судебное предписание: смертный приговор виновному убийце нельзя заменять денежным выкупом.'
  alternative: Стих лишь описывает обычную практику, не устанавливая строгого требования.
  rationale: Запрет לֹא תִקְחוּ и усиленная конструкция מוֹת יוּמָת выражают категорическое правовое требование, а не простое описание.
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. «Не берите» звучит естественнее буквального «не принимайте» в сочетании с «выкупом»; традиционное «повинного смерти» сохраняет судебную сжатость, оставаясь понятным современному читателю.
