  source_fidelity: 'Смысл передан верно: запрещается принимать выкуп, который сохранил бы жизнь убийце, юридически подлежащему смерти; заключительная усиленная конструкция передаёт обязательность казни. Однако «повинного смерти» архаично и в современном русском недостаточно прозрачно.'
  naturalness: «Не берите выкупа» возможно, но «Не принимайте выкуп» естественнее в юридическом предписании. «Подлежащего смертной казни» ясно и современно передаёт משפטенный смысл. «Должен быть казнён» более естественно, чем «должен быть предан смерти», при сохранении пассивного и обязательного значения.
  terminology: «Выкуп» удачно передаёт כֹּפֶר в данном контексте. «Убийца» оправдан контекстом главы, где виновное убийство отличено от непреднамеренного лишения жизни. Формулировка с «смертной казнью» не добавляет доктринального толкования, а выражает юридическую ответственность, подразумеваемую רָשָׁע לָמוּת.
