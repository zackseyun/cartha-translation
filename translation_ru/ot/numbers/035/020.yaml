lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Вводит условный случай, противопоставленный описанному ранее непреднамеренному убийству; «но если» естественно передаёт контекстуальный контраст.
- source_word: בְּשִׂנְאָה
  choice: из ненависти
  rationale: Сочетание предлога с существительным обозначает мотив или характер действия; по-русски «из ненависти» ясно и естественно выражает побуждение.
- source_word: יֶהְדָּפֶנּוּ
  choice: он толкнул его
  rationale: Глагол означает толкнуть или оттолкнуть; выбран нейтральный вариант без необоснованного усиления до удара.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: бросил в него что-либо
  rationale: Объект броска в еврейском тексте не назван, но подразумевается; неопределённое «что-либо» необходимо для естественного русского синтаксиса.
- source_word: בִּצְדִיָּה
  choice: умышленно
  rationale: В данном юридическом контексте слово указывает на намеренное враждебное действие и может иметь более узкий оттенок засады; «умышленно» передаёт основную правовую силу, не перегружая текст.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Передаёт последовательность и результат без усиления причинной формулировки; «тот» устраняет возможную русскую двусмысленность между действующим лицом и пострадавшим.
theological_decisions:
- issue: Степень преднамеренности в בִּצְדִיָּה
  choice: умышленно
  alternative: из засады / с умыслом
  rationale: Сохранена юридическая идея намеренного враждебного действия, тогда как возможный оттенок выжидания или засады не возводится в единственно допустимое значение.
translation_notes:
  register: Современный литературный русский язык с ясной юридической формулировкой. Синтаксис сохранён как незавершённое условное предложение, поскольку стих продолжается в следующем стихе.
