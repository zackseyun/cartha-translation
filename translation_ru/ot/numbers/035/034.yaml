  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: ru
  text: И не оскверняй землю, на которой ты живёшь и посреди которой обитаю Я, потому что Я, Яхве, обитаю среди сынов Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более естественно по-русски: «среди израильтян» или «среди народа Израиля».'
    reason: Лексическая альтернатива к буквальному выражению «среди сынов Израиля».
lexical_decisions:
- source_word: תְטַמֵּא
  choice: оскверняйте
  rationale: Форма Piel от טמא означает делать нечистым в ритуальном или нравственном смысле. «Осквернять» сохраняет обе стороны значения и соответствует контексту пролития крови.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Здесь אֶרֶץ обозначает конкретную землю, где живёт Израиль, а не весь мир; русское «земля» естественно передаёт этот географический и заветный смысл.
- source_word: יֹשְׁבִים בָּהּ
  choice: на которой вы живёте
  rationale: Причастие от ישב выражает постоянное проживание. «Живёте» звучит естественно в современном русском, а предлог «на» обычно употребляется с землёй как территорией.
- source_word: שֹׁכֵן
  choice: обитаю
  rationale: שכן обозначает пребывание или обитание и применительно к Богу несёт оттенок Его присутствия среди народа. «Обитаю» сохраняет достоинство и богословскую насыщенность без добавления технического смысла скинии.
- source_word: בְּתוֹכָהּ
  choice: посреди которой
  rationale: תוך указывает на нахождение внутри или посреди. Формулировка сохраняет пространственную выразительность исходного текста.
- source_word: כִּי
  choice: потому что
  rationale: 'כִּי вводит основание запрета: землю нельзя осквернять, поскольку в ней пребывает Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Перевод сохраняет буквальный мужской образ выражения בני ישראל и одновременно остаётся понятным как обозначение народа Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача בני ישראל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Основной текст сохраняет буквальный родовой образ еврейского выражения, не сужая и не расширяя явно его референцию; более идиоматичный русский вариант дан в примечании.
- issue: Связь запрета с Божьим присутствием
  choice: потому что Я, Яхве, обитаю
  alternative: ибо Я, Яхве, обитаю; ведь Я, Яхве, обитаю
  rationale: 'Причинная связь, выраженная כִּי, сохранена явно: запрет осквернять землю обоснован присутствием Яхве среди Израиля.'
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Повтор глагола «обитаю» сохранён вслед за еврейским текстом, подчёркивающим Божье присутствие как в земле, так и среди народа.
