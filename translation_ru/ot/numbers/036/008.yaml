revisions:
- from: И всякая дочь, владеющая наследственным уделом среди колен сынов Израиля, должна выйти замуж за человека из рода колена своего отца[a], чтобы каждый из сынов Израиля сохранял наследственный удел своих отцов[b].
  to: И всякая дочь, владеющая наследственным уделом из колен сынов Израиля, должна выйти замуж за одного из рода колена своего отца[a], чтобы каждый из сынов Израиля владел наследственным уделом своих отцов[b].
  rationale: Заменены «среди колен» на «из колен» и «сохранял» на «владел», поскольку эти варианты ближе к еврейской формулировке. Сноска b приведена в соответствие с новым основным чтением и сохраняет альтернативу «наследовал».
  reviewer_model: gpt-5.6-terra
