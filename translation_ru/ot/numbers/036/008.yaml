id: NUM.36.8
reference: Numbers 36:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: ru
  text: И всякая дочь, владеющая наследственным уделом из колен сынов Израиля, должна выйти замуж за одного из рода колена своего отца[a], чтобы каждый из сынов Израиля владел наследственным уделом своих отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стала женой одного из рода колена своего отца».'
    reason: Сохраняется возможность увидеть более буквальную форму еврейского брачно-правового выражения.
  - marker: b
    text: 'Или: «чтобы каждый из сынов Израиля наследовал наследственный удел своих отцов». Глагол ירשׁ может обозначать как наследование, так и владение полученной землёй.'
    reason: Передаётся допустимый оттенок глагола ירשׁ без внесения в основной текст интерпретации о сохранении удела.
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: владеющая наследственным уделом
  rationale: Причастие ירשׁ здесь обозначает устойчивое положение наследницы, владеющей родовой землёй; сочетание избегает неестественного русского повтора «наследующая наследство».
- source_word: נַחֲלָה
  choice: наследственный удел
  rationale: В данном земельно-правовом контексте речь идёт об унаследованном земельном владении, закреплённом за племенем и родом.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: среди колен сынов Израиля
  rationale: מַטֶּה передано как «колено», а традиционная и соответствующая патрилинейному контексту формула בְּנֵי יִשְׂרָאֵל сохранена как «сыны Израиля».
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: из рода колена своего отца
  rationale: מִשְׁפָּחָה обозначает родовую группу внутри более крупного колена; «род» естественно передаёт этот уровень родства по-русски.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: должна выйти замуж
  rationale: Еврейская идиома буквально означает «стать женой»; в предписывающем правовом контексте естественное русское соответствие — «должна выйти замуж».
- source_word: יִירְשׁוּ ... אִישׁ
  choice: каждый ... сохранял
  rationale: Форма ירשׁ в контексте служит цели удержания родовой земли во владении соответствующего колена; «сохранял» ясно выражает этот результат, а אִישׁ передано распределительным «каждый».
- source_word: נַחֲלַת אֲבֹתָיו
  choice: наследственный удел своих отцов
  rationale: Формулировка сохраняет патрилинейную правовую структуру оригинала и естественно звучит по-русски.
theological_decisions:
- issue: Гендерно и патрилинейно маркированный язык закона
  choice: Сохранены выражения «сыны Израиля» и «своих отцов».
  alternative: «израильтяне» и «предки»
  rationale: Мужские и отцовские обозначения здесь являются частью конкретного патрилинейного устройства наследования, а не только общими формулами; их нейтрализация ослабила бы смысл закона.
- issue: Значение ירשׁ во второй части стиха
  choice: «сохранял наследственный удел»
  alternative: «наследовал наследство» или «владел уделом»
  rationale: Цель предписания — не первоначальное получение земли, а сохранение отцовского владения внутри колена. Перевод передаёт эту контекстуальную направленность, не превращая её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский с достоинством законодательного повествования. Термины «колено», «род» и «наследственный удел» различают уровни племенной структуры и земельного владения. Маркеры сносок размещены непосредственно в основном тексте.
