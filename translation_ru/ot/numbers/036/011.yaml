base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: ru
  text: Махла, Фирца, Хогла, Милка и Ноа, дочери Целофхада, стали жёнами сыновей своих дядей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сыновей братьев своего отца.
    reason: Уточняется более узкое значение родственного термина דֹדֵיהֶן в данном контексте.
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: стали жёнами
  rationale: Форма от היה в данном брачном контексте обозначает переход в новое состояние; русское «стали жёнами» естественно передаёт этот смысл.
- source_word: בְּנוֹת צְלָפְחָד
  choice: дочери Целофхада
  rationale: Прямое обозначение родства; имя передано в принятой русской библейской форме.
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: сыновей своих дядей
  rationale: Предлог ל при брачной формуле по-русски естественно выражается конструкцией «стали жёнами» с родительным дополнением; דֹדֵיהֶן здесь означает их дядей, а в контексте рода — братьев их отца.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Махла, Фирца, Хогла, Милка и Ноа
  rationale: Имена переданы в традиционных русских библейских формах и в порядке еврейского текста.
