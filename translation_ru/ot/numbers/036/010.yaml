source:
  edition: WLC
  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: ru
  text: Как повелел Яхве Моисею, так и поступили дочери Целофхада.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Как… так и
  rationale: Русская соотносительная конструкция естественно и точно передаёт соответствие между повелением и последующим действием.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол означает отдачу повеления; простое прошедшее время в русском ясно выражает предшествующее распоряжение без необходимости специально маркировать давнопрошедшее.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: 'Хотя אֶת обычно маркирует прямое дополнение, при צוה лицо, которому велят, выступает объектом глагола; по-русски нормативно и естественно: «повелел Моисею».'
- source_word: עָשׂוּ
  choice: поступили
  rationale: В сочетании с כֵּן означает, что дочери действовали согласно повелению; «поступили» звучит естественнее буквального «сделали».
- source_word: בְּנוֹת צְלָפְחָד
  choice: дочери Целофхада
  rationale: Прямая и ясная передача еврейской сопряжённой конструкции с традиционной русской формой имени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная соотносительная конструкция сохраняет торжественную простоту повествования.
