base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: ru
  text: И удел не будет переходить от одного колена к другому, потому что каждое из колен сынов Израиля будет держаться своего удела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «колена сынов Израиля будут держаться каждое своего удела».'
    reason: Сноска отражает необычное сочетание распределительного единственного числа אִישׁ с глаголом множественного числа и более буквально передаёт структуру еврейского текста.
lexical_decisions:
- source_word: תִסֹּב
  choice: будет переходить
  rationale: В данном правовом контексте глагол означает переход земельного удела из ведения одного колена в другое, а не буквальный поворот.
- source_word: נַחֲלָה
  choice: удел
  rationale: Здесь имеется в виду наследственное земельное владение, назначенное колену; «удел» естественно и точно передаёт этот смысл в библейско-правовом контексте.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: от одного колена к другому
  rationale: מַטֶּה здесь обозначает колено Израиля, а конструкция выражает переход между разными коленами.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание установленного запрета.
- source_word: אִישׁ ... יִדְבְּקוּ
  choice: каждое ... должно держаться
  rationale: Единственное число אִישׁ имеет распределительное значение, тогда как глагол во множественном числе согласуется по смыслу с «коленами»; русская конструкция сохраняет этот смысл без неестественного олицетворения.
- source_word: בְּנַחֲלָתוֹ
  choice: своего удела
  rationale: При דבק предлог выражает приверженность и неотделимость; русское управление «держаться своего удела» передаёт это естественно.
- source_word: יִדְבְּקוּ
  choice: должно держаться
  rationale: דבק означает крепко держаться, быть привязанным; модальная форма уместна для предписания в данном юридическом контексте.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: колена сынов Израиля
  rationale: Перевод сохраняет формально мужское и традиционное выражение בְּנֵי יִשְׂרָאֵל, которое совокупно обозначает народ Израиля.
theological_decisions:
- issue: Гендерно маркированное заветное выражение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян / народа Израиля
  rationale: Основной текст сохраняет грамматически мужскую и традиционную форму оригинала, не сужая её корпоративного значения до одних мужчин.
- issue: Распределительное אִישׁ при множественном יִדְבְּקוּ
  choice: каждое из колен ... должно держаться
  alternative: колена ... должны держаться / каждый должен держаться
  rationale: Выбранная форма сохраняет распределительный акцент и одновременно ясно относит предписание к каждому колену как целому.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-заветного предписания. Термин «удел» последовательно передаёт наследственное земельное владение; синтаксис сделан ясным без устранения распределительного оттенка оригинала.
