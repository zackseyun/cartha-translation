  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: ru
  text: Они вышли замуж за мужчин из родов потомков Манассии, сына Иосифа, и их наследственный удел остался за коленом, к которому принадлежал род их отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת בְּנֵי מְנַשֶּׁה
  choice: за мужчин из родов потомков Манассии
  rationale: Предлог מִן указывает на происхождение мужей из этих родов. По-русски сочетание הָיוּ לְנָשִׁים естественно передаётся как «вышли замуж», а добавление «за мужчин» ясно выражает подразумеваемый объект брака. «Роды» уместно обозначает внутренние подразделения колена.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: потомков Манассии, сына Иосифа
  rationale: В данном племенном контексте בְּנֵי обозначает потомков, а не только непосредственных сыновей; такое выражение естественно и точно для современного русского языка.
- source_word: נַחֲלָתָן
  choice: их наследственный удел
  rationale: Слово обозначает передаваемый по наследству земельный надел. «Наследственный удел» сохраняет и правовой, и территориальный смысл.
- source_word: וַתְּהִי
  choice: остался
  rationale: Хотя глагол буквально означает «был», контекст подчеркивает, что после брака удел не перешёл к другому колену; «остался» естественно передаёт этот смысл.
- source_word: עַל מַטֵּה מִשְׁפַּחַת אֲבִיהֶן
  choice: за коленом, к которому принадлежал род их отца
  rationale: עַל здесь выражает закреплённость удела за коленом. Развёрнутая формулировка устраняет неестественное русское сочетание «колено рода», сохраняя соотношение между коленом и отцовским родом.
