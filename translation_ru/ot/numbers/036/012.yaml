  source_fidelity: 'Русский текст точно передаёт основной смысл еврейского текста: женщины вышли замуж за мужчин из родов потомков Манассии, сына Иосифа; их наследственный земельный удел остался закреплён за надлежащим коленом. «Из родов» корректно отражает מִן, а «остался» уместно передаёт контекстуальный смысл וַתְּהִי. Добавление «за мужчин» эксплицирует естественно подразумеваемую сторону брака и не меняет смысла.'
  naturalness: Фраза написана естественным современным литературным русским языком. «Наследственный удел», «род» и «колено» ясно и последовательно передают правовую и родоплеменную лексику контекста. Оборот «за коленом, к которому принадлежал род их отца» несколько разъяснительный, но удачен и не создаёт неестественного буквального сочетания.
  terminology: «Манассия», «Иосиф», «род», «колено» и «наследственный удел» употреблены корректно. Выбор «потомков» для בְּנֵי естественен в данном генеалогическом и племенном контексте; он не исключает более буквального оттенка «сыновей». Отдельная сноска для возможного «семей/родов» не требуется, поскольку «роды» адекватно выражает מִשְׁפָּחוֹת.
