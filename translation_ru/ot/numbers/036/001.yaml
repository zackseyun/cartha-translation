base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: ru
  text: 'Тогда главы родовых домов[a] рода сыновей Галаада, сына Махира, сына Манассии, из родов сыновей Иосифа, подошли и сказали в присутствии Моисея и вождей — глав родовых домов сынов Израиля[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы родов». Буквально: «главы отцов»; это древнееврейское выражение обозначает признанных руководителей родовых домов в племенном устройстве Израиля.'
    reason: lexical_alternative
  - marker: b
    text: '«Сыновья Израиля» — буквальное древнееврейское выражение; по смыслу: «израильтяне».'
    reason: lexical_alternative
