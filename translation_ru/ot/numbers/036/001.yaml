  choice: перед Моисеем и перед вождями
  rationale: Повтор «перед» сохраняет структуру оригинала и официальный характер выступления в присутствии властей; «вожди» обозначает племенных руководителей.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: главами отцовских домов сыновей Израиля
  rationale: Передано как приложение, уточняющее, кто такие вожди; формальное родовое наименование «сыновья Израиля» сохранено.
