  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: ru
  text: И удел сынов Израиля не должен переходить от одного колена к другому[a], потому что каждый из сынов Израиля должен держаться удела колена своих отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из колена в колено».'
    reason: Более сжатая передача выражения «от одного колена к другому» (מִמַּטֶּה אֶל־מַטֶּה).
lexical_decisions:
- source_word: תִסֹּב
  choice: должен переходить
  rationale: В данном правовом контексте глагол означает переход земельного удела под власть другого колена, а не буквальный поворот.
- source_word: נַחֲלָה
  choice: удел
  rationale: В Числах 36 речь идёт о наследственно закреплённой земле; «удел» естественно передаёт как земельный, так и родовой смысл.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: от одного колена к другому
  rationale: מַטֶּה здесь обозначает колено Израиля; развёрнутая русская формулировка ясно выражает переход между коленами.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено формальное родословно-заветное выражение исходного текста.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание установленного запрета.
- source_word: אִישׁ ... יִדְבְּקוּ
  choice: должны держаться каждый
  rationale: 'Сочетание передаёт множественное число глагола и распределительное значение אִישׁ: обязанность относится к каждому из сынов Израиля.'
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: удела колена своих отцов
  rationale: Формулировка сохраняет связь земельного удела с коленом предков и мужской родословной исходного текста.
theological_decisions:
- issue: Родословная мужская терминология в общем правовом постановлении
  choice: сыны Израиля ... каждый ... своих отцов
  alternative: израильтяне ... каждый ... своих предков
  rationale: Еврейский текст последовательно использует мужские и родословные обозначения בני, איש и אבתיו. Перевод сохраняет их, не превращая в гендерно-нейтральную формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Синтаксис близок к еврейскому, но перестроен ради ясности; «держаться каждый» сохраняет распределительную конструкцию оригинала.
