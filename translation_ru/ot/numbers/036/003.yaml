base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: ru
  text: И если они станут жёнами одного из сыновей израильских колен, то их наследственный надел будет отнят от надела наших отцов и прибавлен к наделу того колена, к которому они будут принадлежать; и от доставшегося нам по жребию надела будет отнято.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и от жребия нашего надела будет отнято». Под «жребием» здесь понимается земельная доля, назначенная по жребию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: если они станут жёнами
  rationale: Буквально конструкция означает «и станут жёнами»; условное «если» естественно передаёт продолжающееся из контекста предположение.
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: кого-либо из сыновей других племён Израиля
  rationale: «Кого-либо» передаёт неопределённость אֶחָד в данном контексте. Слово «других» ясно выражает подразумеваемый контраст с племенем Манассии, не меняя сути довода; «сыновей племён Израиля» сохраняет родовую формулировку источника.
- source_word: נַחֲלָה
  choice: наследственный надел / надел
  rationale: В контексте распределения земли «наследственный надел» точнее одного слова «наследство» и сохраняет идею родового владения; далее употреблено краткое «надел» во избежание тяжеловесного повтора.
- source_word: וְנִגְרְעָה
  choice: будет отнят
  rationale: Нифаль от גרע обозначает убыль или изъятие из прежнего владения; пассивная форма сохранена.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: от надела наших отцов
  rationale: Формулировка сохраняет мужской род и родоплеменную преемственность исходного текста.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: и прибавлен к наделу того племени
  rationale: Передаёт переход земельной доли к наследственному владению другого племени и сохраняет пассивно-результативный смысл.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: к которому они примкнут
  rationale: Буквальная конструкция неоднозначна и указывает на новую принадлежность женщин через брак. «Примкнут» естественно передаёт племенную аффилиацию, не утверждая личной собственности мужей над ними.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ יִגָּרֵעַ
  choice: так от доставшегося нам по жребию надела будет отнята часть
  rationale: גּוֹרָל буквально означает «жребий», а метонимически — назначенную по жребию долю. Добавление «часть» делает по-русски явным подразумеваемый объект глагола «будет отнята».
