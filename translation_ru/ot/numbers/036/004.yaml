source:
  edition: WLC
  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: ru
  text: И если у сынов Израиля[a] наступит юбилейный год, их наследственный удел прибавится к уделу племени, к которому они будут принадлежать, а из удела племени наших отцов их удел будет вычтен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у израильтян»; традиционно: «у детей Израиля». В еврейском тексте: «у сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет явную условность еврейского אִם; контекст предполагает ожидаемое событие, но не требует заменять условное значение временным.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: наступит юбилей
  rationale: Естественно передаёт сочетание היה с названием календарного установления; «юбилей» — традиционное обозначение юбилейного года.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: у сынов Израиля
  rationale: Предлог ל при היה естественно передан конструкцией «у… наступит»; образное родовое обозначение בני ישראל сохранено, а современный эквивалент дан в сноске.
- source_word: נַחֲלָתָן
  choice: их наследственный удел
  rationale: נחלה здесь означает наследуемый земельный надел; «наследственный удел» точнее простого «наследства» в контексте племенного землевладения. Суффикс женского множественного числа относится к дочерям.
- source_word: וְנוֹסְפָה ... עַל
  choice: прибавится к
  rationale: 'Передаёт пассивно-результативный смысл нифаля יסף и направленность על: удел переходит в совокупность владений другого племени.'
- source_word: הַמַּטֶּה
  choice: племени
  rationale: В контексте распределения земли מטה обозначает племя Израиля.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: которому они будут принадлежать
  rationale: 'Сохраняет грамматически возможный и контекстуально естественный смысл: дочери после брака будут относиться к племени своих мужей. Местоимение мужского множественного числа буквально относится к мужчинам, что отражено в богословско-экзегетической заметке.'
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: а от удела племени наших отцов
  rationale: Сохраняет противопоставление принимающего племени родовому племени говорящих и прямо передаёт אבותינו как «наших отцов».
- source_word: יִגָּרַע
  choice: убавится
  rationale: Передаёт значение уменьшения или вычитания в нифале, не вводя внешнего действующего лица.
theological_decisions:
- issue: Референт местоимения в אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: «которому они будут принадлежать» — принадлежность дочерей племени мужей
  alternative: «которое будет принадлежать им» — будто речь о племени или уделе, принадлежащем мужчинам
  rationale: Женская форма תִּהְיֶינָה согласуется с дочерьми, тогда как לָהֶם имеет мужской референт — мужчин, за которых они выйдут замуж. Русская формулировка передаёт контекстуальный смысл, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-повествовательной речи. Термин «наследственный удел» подчёркивает земельный и племенной характер נחלה. Условное «если» сохранено ради подлинной неоднозначности וְאִם, хотя юбилей представлен как ожидаемое событие.
