revisions:
- from: И если у сынов Израиля[a] наступит юбилей, их наследственный удел прибавится к уделу того племени, которому они будут принадлежать, а от удела племени наших отцов их удел убавится.
  to: И если у сынов Израиля[a] наступит юбилейный год, их наследственный удел прибавится к уделу племени, к которому они будут принадлежать, а из удела племени наших отцов их удел будет вычтен.
  rationale: Исправление уточняет термин для יוֹבֵל и делает юридический итог יִגָּרַע ясным, не вводя внешнего действующего лица. Условное «если» сохранено как прямое отражение וְאִם; выражение «к которому они будут принадлежать» передаёт контекстуальную связь дочерей с племенем мужчин, не называя невыраженные в самом стихе детали.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:21:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: речь о том, что наследственный надел дочерей будет присоединён к наделу племени, к которому они будут относиться, и соответственно будет исключён из надела их отеческого племени. Однако «юбилей» без слова «год» в современном русском обычно означает годовщину, а не библейское земельно-правовое установление. Формулировку следует уточнить.'
  naturalness: Синтаксис понятен, но «наступит юбилей» неестественен и семантически двусмысленен в современном русском. «Их удел убавится» звучит разговорно и недостаточно точно для юридического контекста; «будет вычтен из…» яснее передаёт утрату надела из состава племенного владения.
  terminology: «Наследственный удел» удачно передаёт נחלה; «племя» уместно для מטה. Следует употребить устойчивый термин «юбилейный год». Сноску лучше формулировать как характеристику еврейского текста, а не как «буквально по-еврейски».
  issues:
  - severity: medium
    issue: «Наступит юбилей»
    rationale: В современном русском «юбилей» прежде всего означает памятную годовщину. Еврейское יוֹבֵל в этом контексте — юбилейный год; добавление «год» необходимо для точности и естественности.
  - severity: low
    issue: «Их удел убавится»
    rationale: Глагол «убавиться» менее точен и стилистически слабее в описании перехода земельного надела. Нифаль יִגָּרַע обозначает исключение/вычитание из наследственного владения; пассивная формулировка «будет вычтен из» сохраняет отсутствие названного деятеля.
  - severity: low
    issue: Формулировка сноски «буквально по-еврейски»
    rationale: 'Лучше назвать еврейский текст прямо: это естественнее по-русски и не создаёт впечатления, будто имеется в виду современный разговорный язык.'
