base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: ru
  text: 'Вот что повелел Яхве о дочерях Целофхада: «Пусть они выйдут замуж за тех, кто им по душе[a], но только за мужчин из рода в колене их отца[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за того, кто хорош в их глазах», то есть за того, кого они сами сочтут подходящим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из клана колена их отца». Еврейский текст употребляет рядом слова, обозначающие род (или клан) и колено, подчёркивая сохранение наследства в отцовской родоплеменной линии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Вот что
  rationale: Оборот вводит официальное постановление. «Вот что» естественно передаёт указательное выражение, не ослабляя его авторитетного характера.
- source_word: צִוָּה יְהוָה
  choice: повелел Яхве
  rationale: Глагол צוה обозначает властное повеление; форма прошедшего времени уместна для данного в контексте постановления. Личное имя יהוה передано как «Яхве».
- source_word: לִבְנוֹת צְלָפְחָד
  choice: о дочерях Целофхада
  rationale: Предлог ל здесь указывает, кого касается постановление; «о дочерях» по-русски точнее и естественнее, чем буквальное «дочерям».
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: за тех, кто им по душе
  rationale: Еврейская идиома буквально означает «за того, кто хорош в их глазах», то есть за избранных ими по собственному усмотрению.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: пусть они выйдут замуж
  rationale: Буквально «пусть будут жёнами». Русское «выйдут замуж» ясно и естественно выражает вступление женщин в брак.
- source_word: אַךְ
  choice: но только
  rationale: Частица вводит строгое ограничение предоставленной перед этим свободы выбора.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: за мужчин из рода колена своего отца
  rationale: Фраза сочетает понятия рода и колена и ограничивает выбор брака отцовской родоплеменной линией. Добавленное «мужчин» выражает подразумеваемых брачных партнёров.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Свобода выбора и родовое ограничение
  choice: сохранить одновременно разрешение личного выбора и обязательное ограничение отцовским коленом
  alternative: подчеркнуть только свободу выбора или только обязанность
  rationale: 'Текст намеренно удерживает оба положения: дочери сами выбирают мужей, но лишь в установленных родоплеменных пределах.'
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формула «выйдут замуж» выбрана вместо буквального «станут жёнами» как более естественная, а сочетание «род колена» сохранено ради точной передачи двух уровней родоплеменной структуры.
