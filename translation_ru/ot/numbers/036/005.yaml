  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: ru
  text: 'Моисей по слову Яхве[a] повелел сынам Израиля: «Племя сынов Иосифа право»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Племя сынов Иосифа говорит верно»; «Сыны Иосифа говорят правильно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Передаёт властный характер глагола צוה точнее, чем более мягкое «наставил».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет родовой образ еврейского выражения и остаётся понятным в русском библейском повествовании.
- source_word: עַל פִּי יְהוָה
  choice: по слову Яхве
  rationale: Естественно передаёт идиому «по устам Яхве», указывающую на источник и власть повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Формально сохраняет вводящую прямую речь конструкцию исходного текста.
- source_word: מַטֵּה
  choice: племя
  rationale: В контексте родоплеменного устройства Израиля слово означает «племя», а не буквальный «посох».
- source_word: בְנֵי יוֹסֵף
  choice: сынов Иосифа
  rationale: Сохраняет семейно-родовой способ обозначения потомков Иосифа.
- source_word: כֵּן ... דֹּבְרִים
  choice: говорит правильно
  rationale: Сохраняет значение речи в причастии דבר и утвердительное значение כֵּן; согласование в единственном числе обусловлено собирательным словом «племя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Характер одобрения слов племени Иосифа
  choice: говорит правильно
  alternative: право / справедливо говорит
  rationale: Фраза подтверждает правильность высказанного требования, не уточняя сверх исходного текста, идёт ли речь преимущественно о фактической, правовой или нравственной правоте.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским строем. Формы «сынам Израиля» и «сынов Иосифа» сохранены ради родовой образности оригинала; порядок слов и выражение «говорит правильно» остаются естественными для современного читателя.
