id: NUM.36.13
reference: Numbers 36:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: ru
  text: Вот заповеди и установления, которые Яхве повелел через Моисея сынам Израиля на равнинах Моава у Иордана, напротив Иерихона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Иордана, близ Иерихона».'
    reason: Еврейское географическое выражение допускает передачу как указание на местность напротив Иерихона либо рядом с Иерихоном у Иордана.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное множественное слово вводит заключительную итоговую формулу; русское «вот» естественно представляет перечисленное как итог.
- source_word: הַמִּצְוֺת
  choice: заповеди
  rationale: Сохраняет юридический и авторитетный характер מִצְוֹת и лексическую связь с глаголом «повелел».
- source_word: וְהַמִּשְׁפָּטִים
  choice: и установления
  rationale: В данном правовом контексте מִשְׁפָּטִים обозначает обязательные правовые нормы; «установления» звучит ясно и достойно, не создавая ошибочного впечатления о судебных приговорах.
- source_word: צִוָּה
  choice: повелел
  rationale: Передаёт властную силу глагола и сохраняет связь с существительным «заповеди» без тяжеловесного повтора «заповедал заповеди».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея»; русское «через Моисея» естественно выражает посредничество и не устраняет роль Моисея как передающего повеления.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально сохраняет заветное обозначение בְּנֵי יִשְׂרָאֵל и его грамматический образ; выражение относится к народу Израиля в целом.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עַרְבוֹת обозначает равнинную степную местность; традиционное географическое выражение ясно в современном русском.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: у Иордана, напротив Иерихона
  rationale: עַל указывает на расположение у реки, а сочетание с Иерихоном в данном транс-иорданском контексте естественно понимать как местность напротив города; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как личное заветное имя, не подменяя титулом.
- issue: Охват выражения בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; детям Израиля
  rationale: Сохранена форма исходного заветного обозначения; по контексту она относится ко всему народу, а не исключительно к взрослым мужчинам.
translation_notes:
  register: Современный литературный русский с достоинством заключительной правовой формулы. Синтаксис сделан естественным для русского языка, при этом сохранены парность терминов «заповеди и установления», посредническая роль Моисея и заветное наименование «сыны Израиля».
