base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: ru
  text: 'И они сказали: «Яхве повелел моему господину дать землю в наследие по жребию сынам Израиля[a], и Яхве повелел моему господину отдать наследие нашего брата Целофхада его дочерям».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детям Израиля» или «израильтянам». В еврейском тексте: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: господину моему / господин мой
  rationale: Уважительное обращение предводителей рода к Моисею; строчная буква показывает, что это человеческий титул, а не обозначение Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: לָתֵת אֶת הָאָרֶץ בְּנַחֲלָה
  choice: отдать землю в наследие
  rationale: Сохраняет значение Божьего дара и юридический смысл наследственного владения; «отдать» естественно сочетается с последующим указанием получателей.
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Естественное русское обозначение способа распределения земли, указанного в еврейском тексте.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный образ еврейского выражения и его торжественно-исторический оттенок; более идиоматические варианты приведены в сноске.
- source_word: צֻוָּה בַיהוָה
  choice: получил от Яхве повеление
  rationale: Естественно передаёт по-русски страдательную форму и источник повеления, избегая тяжеловесного оборота «ему было повелено Яхве».
- source_word: נַחֲלַת צְלָפְחָד
  choice: наследие нашего брата Селофхада
  rationale: Передаёт наследственный удел, принадлежавший линии Селофхада, и сохраняет буквальное родственное обозначение אָחִינוּ.
- source_word: לִבְנֹתָיו
  choice: его дочерям
  rationale: Прямо обозначает дочерей Селофхада как получательниц наследия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Родовое выражение לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; израильтянам
  rationale: Выбран буквальный мужской образ исходного выражения, хотя в данном контексте оно обозначает народ Израиля в целом; это пояснено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством юридико-повествовательной речи. Инверсия «господину моему» сохраняет почтительность обращения, не звуча чрезмерно архаично; повтор имени Яхве и слова «наследие» сохранён вслед за исходным текстом.
