- from: И будет у него и у его потомства после него завет вечного священства, потому что он возревновал о своём Боге[a] и совершил умилостивление за сынов Израиля[b].
  to: И ему, и его потомству после него будет завет вечного священства, потому что он проявил ревность за своего Бога[a] и совершил искупление за сынов Израиля[b].
  rationale: Исправлены синтаксическая связь в первой части стиха и неестественный архаический оборот при קִנֵּא לֵאלֹהָיו. Термин כפר передан более употребительным русским словом «искупление», без доктринального сужения значения. Сноски сохраняют существенную лексическую альтернативу и пояснение национального обозначения.
