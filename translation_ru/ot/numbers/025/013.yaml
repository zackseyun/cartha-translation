  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: ru
  text: И ему, и его потомству после него будет завет вечного священства, потому что он проявил ревность за своего Бога[a] и совершил искупление за сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявил рвение ради своего Бога». Еврейский глагол может выражать как ревность, так и ревностное рвение.'
    reason: lexical_alternative
  - marker: b
    text: «Сыны Израиля» — традиционное еврейское национальное обозначение народа Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И будет
  rationale: Женская форма глагола соотносится с последующим словом «завет»; союз וְ сохранён естественным русским «и».
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: у него и у его потомства после него
  rationale: «Потомство» передаёт собирательное единственное число זֶרַע, а «после него» сохраняет идею преемственности.
- source_word: בְּרִית
  choice: завет
  rationale: Устоявшийся русский эквивалент для божественно-человеческого обязательства или установления.
- source_word: כְּהֻנַּת עוֹלָם
  choice: вечного священства
  rationale: «Вечное» естественно передаёт длительный, непрекращающийся характер установления, не уточняя сверх контекста философский смысл вечности.
- source_word: תַּחַת אֲשֶׁר
  choice: потому что
  rationale: В данном контексте оборот указывает на основание дарования завета.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: возревновал о своём Боге
  rationale: Русское «возревновал» сохраняет двойной оттенок ревности и рвения в защиту исключительной верности Богу; альтернативный смысл пояснён в сноске.
- source_word: וַיְכַפֵּר
  choice: совершил умилостивление
  rationale: Культовый термин כפר передан традиционным и достаточно понятным русским выражением, обозначающим устранение вины и восстановление отношений с Богом.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: за сынов Израиля
  rationale: Сохраняется буквальная форма традиционного национального обозначения; его собирательное значение пояснено в сноске.
theological_decisions:
- issue: Значение קנא применительно к поступку Финееса
  choice: возревновал о своём Боге
  alternative: проявил рвение ради своего Бога
  rationale: Еврейский глагол объединяет оттенки ревности и ревностного рвения; основной вариант сохраняет эту напряжённость, а сноска предупреждает узкое понимание как зависти.
- issue: Сила עוֹלָם в обещании священства
  choice: вечного священства
  alternative: непреходящего священства
  rationale: «Вечное» — естественное и традиционное русское обозначение длительности установления; оно не требует разрешать вопрос о точных исторических или метафизических пределах обещания.
- issue: Референт выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: народ Израиля
  rationale: Основной текст сохраняет грамматическую и традиционную форму источника, а сноска разъясняет, что это национальное обозначение всего народа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис близок к еврейскому оригиналу, но остаётся естественным; сохранены богословски значимые «завет», «священство» и «умилостивление».
