review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: завет обещан Финеесу и его потомству, основанием названы его ревность за Бога и совершённое им действие כפר за сынов Израиля. Однако оборот «у него ... завет» в русском языке меняет естественную синтаксическую связь и может звучать так, будто завет просто находится у него, тогда как еврейский текст сообщает о даровании/принадлежности завета ему и его потомству. «Возревновал о своём Боге» архаично и не вполне естественно; конструкция с «за» лучше передаёт לְ в קִנֵּא לֵאלֹהָיו.'
  naturalness: 'Предлагаемая редакция сохраняет умеренно торжественный библейский регистр, но делает фразу современной и ясной: «будет завет» вместо «будет у него ... завет», «проявил ревность за» вместо малопонятного «возревновал о».'
  terminology: «Завет» и «вечное священство» уместны. Для וַיְכַפֵּר предпочтительно «совершил искупление», более обычное в современном русском библейском употреблении и достаточно широкое, чтобы не сводить כפר исключительно к умилостивлению. «Сыны Израиля» сохранено как традиционное национальное обозначение; сноска корректно поясняет его собирательный референт.
  issues:
  - severity: medium
    issue: «И будет у него и у его потомства после него завет...»
    rationale: 'Формально возможно, но по-русски неестественно и ослабляет смысл предоставления завета адресатам. Лучше: «И ему, и его потомству после него будет завет...».'
  - severity: medium
    issue: «возревновал о своём Боге»
    rationale: Оборот архаичен и в современном литературном русском недостаточно прозрачен. «Проявил ревность за своего Бога» естественнее и сохраняет лексическую двусмысленность ревности/рвения; альтернатива остаётся в сноске.
  - severity: low
    issue: «совершил умилостивление»
    rationale: Это допустимое, но более узкое богословское слово. «Совершил искупление» привычнее и лучше охватывает значение כפר в данном культовом контексте.
  revised_text: И ему, и его потомству после него будет завет вечного священства, потому что он проявил ревность за своего Бога[a] и совершил искупление за сынов Израиля[b].
  revised_footnotes:
