  register: 'Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис слегка перестроен ради ясности: вместо буквального «имя … было» употреблено естественное «звали», а Цур повторно назван, чтобы однозначно передать референт еврейского הוּא.'
