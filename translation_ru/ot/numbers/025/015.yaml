  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: ru
  text: А убитую мадианитянку звали Козби; она была дочерью Цура. Цур был главой родовых объединений[a] отцовского дома[b] в Мадиане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «народов». Еврейское слово может обозначать народы или, как здесь в контексте родства, родовые и племенные объединения.'
    reason: lexical_alternative
  - marker: b
    text: Буквально «дом отца» — древнееврейское обозначение большой семьи или рода, происходящего от общего предка.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  choice: А … звали
  rationale: Союз ו передан как «А», сохраняя связь с предыдущим повествованием. Естественная русская конструкция «звали» передаёт еврейское «имя … [было]» без тяжеловесности.
- source_word: הָאִשָּׁה הַמֻּכָּה הַמִּדְיָנִית
  choice: убитую мадианитянку
  rationale: Причастие от נכה буквально указывает на поражённую ударом женщину; из непосредственного контекста ясно, что она была убита. «Убитую» точно и естественно передаёт смысл в русском контексте, а этноним сохранён.
- source_word: כָּזְבִּי בַת צ֑וּר
  choice: Козби, дочерью Цура
  rationale: Имена транслитерированы в привычной для русской библейской традиции форме; конструкция בַת передаёт родство как «дочь Цура».
- source_word: רֹאשׁ
  choice: главой
  rationale: רֹאשׁ буквально означает «голова» и метафорически — руководитель или глава; «главой» естественно в данном описании положения Цура.
- source_word: אֻמּוֹת
  choice: родовых объединений
  rationale: Слово может обозначать народы или племенные группы. В сочетании с термином «отцовский дом» контекст указывает на группы родства; более широкая лексическая возможность отмечена в сноске.
- source_word: בֵּית אָב
  choice: одного отцовского дома
  rationale: Сохранён древнееврейский термин родственной организации. Слово «одного» естественно выражает неопределённость конструкции без артикля, а значение поясняется в сноске.
- source_word: בְּמִדְיָן הוּא
  choice: Цур был … в Мадиане
  rationale: Местоимение הוּא возобновляет Цура как подлежащее. Повтор имени по-русски устраняет возможную двусмысленность после упоминания Козби.
