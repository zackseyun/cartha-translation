base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: ru
  text: Когда Финеес, сын Елеазара, сына Аарона, священника, увидел это[a], он поднялся из среды общины[b] и взял в руку копьё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидел»; объект подразумевается из предыдущего контекста. Возможный перевод: «увидел происходящее».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из собрания»; также возможно: «из среды общества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел это
  rationale: Еврейский глагол означает «увидел» и не называет дополнения; местоимение «это» естественно восполняет подразумеваемый объект из предыдущего контекста, не уточняя его сверх сказанного.
- source_word: פִּינְחָס
  choice: Финеес
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: сын Елеазара, сына Аарона-священника
  rationale: Сохранена последовательность родословной; определение «священник» отнесено к Аарону. Слово «первосвященник» не добавлено, поскольку в еврейском тексте стоит только הַכֹּהֵן — «священник».
- source_word: וַיָּקָם
  choice: он поднялся
  rationale: Передаёт вставание и начало решительного действия без излишнего усиления.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: из среды общины
  rationale: Близко передаёт пространственное выражение «из середины/среды» и собирательное значение עֵדָה как общины Израиля.
- source_word: וַיִּקַּח
  choice: и взял
  rationale: Нейтральный и точный эквивалент обычного глагола «брать»; вариант «схватил» неоправданно усилил бы действие.
- source_word: רֹמַח
  choice: копьё
  rationale: Ясное современное обозначение древкового колющего оружия; не вводит более узкого значения «дротик».
- source_word: בְּיָדוֹ
  choice: в руку
  rationale: Естественный русский способ передать, что Финеес вооружился копьём; буквально выражение соответствует «в его руке».
theological_decisions:
- issue: Передача הָעֵדָה
  choice: община
  alternative: собрание; общество
  rationale: «Община» сохраняет смысл единого народа Израиля в повествовании Пятикнижия, не придавая слову позднейшего специально церковного значения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Родословная передана ясно и без добавления титула «первосвященник»; синтаксис сохраняет последовательное развитие повествования.
