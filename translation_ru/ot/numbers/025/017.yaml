  text: Harass the Midianites and strike them down,[a]
translation:
  language: ru
  text: Враждуйте с мадианитянами и поражайте их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обращайтесь с мадианитянами как с врагами и поражайте их». Еврейский глагол צָרוֹר может означать проявлять враждебность к кому-либо или обращаться с ним как с врагом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Враждуйте с
  rationale: Форма от צרר выражает повеление проявлять враждебность, обращаться как с врагом. «Враждуйте с» сохраняет общий, а не узко тактический смысл и передаёт краткость еврейского текста.
- source_word: הַמִּדְיָנִים
  choice: мадианитянами
  rationale: Традиционное и понятное русское название народа Мадиама; творительный падеж обусловлен управлением глагола «враждовать».
- source_word: וְהִכִּיתֶם
  choice: и поражайте
  rationale: Глагол נכה в породе hифиль может означать наносить удар, поражать или разбивать. «Поражайте» сохраняет насильственный военный смысл, не сужая его до обязательного убийства каждого человека.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к мадианитянам и естественно передаётся русским «их».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного русского соответствия.
theological_decisions:
- issue: Передача Божьего повеления о враждебности и насильственном действии без смягчения или расширения
  choice: Враждуйте с мадианитянами и поражайте их
  alternative: Считайте мадианитян врагами и наносите им удары
  rationale: Перевод сохраняет два прямых повеления и суровость исходного текста, не добавляя отсутствующего здесь богословского оправдания и не уточняя сверх меры характер или окончательный результат поражения.
translation_notes:
  register: Современный литературный русский язык с кратким, повелительным и суровым звучанием оригинала. «Враждуйте» несколько возвышенно, но понятно и точно сохраняет общий смысл длительной враждебности; примечание раскрывает возможную реляционную формулировку.
