id: NUM.25.18
reference: Numbers 25:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: ru
  text: ведь они враждебны вам своими коварными замыслами[b], которыми обманули вас в деле Пеора[a] и в деле Козби, дочери мадиамского вождя, своей соплеменницы[c], убитой в день мора из-за дела Пеора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пеор — указание на происшествие с Ваал-Пеором, описанное выше в этой главе.
    reason: cross_reference
  - marker: b
    text: 'Или: «своими кознями»; «своим вероломством».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «своей сестры»; вероятно, имеется в виду женщина из их народа или родственной группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: враждебны
  rationale: Причастие выражает продолжающуюся враждебность; предикативная форма естественно передаётся кратким прилагательным.
- source_word: בְּנִכְלֵיהֶם
  choice: своими коварными замыслами
  rationale: Предлог ב имеет инструментальное значение, а существительное обозначает хитрые, обманные происки.
- source_word: נִכְּלוּ
  choice: обманули
  rationale: Однокоренной с предыдущим существительным глагол описывает направленное против Израиля коварное действие; «обманули» ясно передаёт его результат.
- source_word: עַל דְּבַר פְּעוֹר
  choice: в деле Пеора / из-за дела Пеора
  rationale: 'Повторённый оборот допускает как тематический, так и причинный оттенок: первый контекст указывает на обстоятельства дела, второй — на причину мора.'
- source_word: כָּזְבִּי
  choice: Козби
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: дочери мадиамского вождя
  rationale: נשיא обозначает предводителя или главу; «вождь» естественно для племенного контекста и не привносит монархического смысла.
- source_word: אֲחֹתָם
  choice: своей соплеменницы
  rationale: Буквально «их сестры»; в данном контексте слово, вероятно, указывает на принадлежность к их народу или родственной группе. Основной текст передаёт этот смысл, а буквальная форма сохранена в примечании.
- source_word: הַמֻּכָּה
  choice: убитой
  rationale: Страдательное причастие от נכה буквально означает «поражённая»; контекст 25:8 однозначно подразумевает смерть, поэтому «убитой» ясно и естественно.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: в день мора
  rationale: Передаёт конкретное указание времени; «мор» соответствует массовому смертельному поражению в повествовании и сохраняет библейское достоинство без архаической неясности.
theological_decisions:
- issue: Значение имени «Пеор»
  choice: Сохранено краткое имя «Пеор», как в еврейском тексте.
  alternative: Раскрыть как «Ваал-Пеор».
  rationale: Источник содержит только פְּעוֹר. Связь с событием Ваал-Пеора поясняется в сноске, без расширения основного текста.
- issue: Оттенок повторённого оборота עַל דְּבַר פְּעוֹר
  choice: Первое вхождение передано «в деле Пеора», последнее — «из-за дела Пеора».
  alternative: Передать оба вхождения одинаково.
  rationale: Один и тот же еврейский оборот в первом случае обозначает сферу коварства, а в последнем причинно связан с мором; различие формулировок сохраняет оба контекстуальных оттенка.
- issue: Референт אֲחֹתָם
  choice: Передано «своей соплеменницы».
  alternative: 'Буквально: «своей сестры».'
  rationale: В контексте речь, вероятнее всего, идёт о женщине из их народа или родственной группы, а не о родной сестре всех мадианитян. Буквальная форма отмечена в сноске, чтобы сохранить неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет причинную связь с предыдущим повелением. «Мадиамский вождь» и «мор» выбраны как ясные, контекстуально точные формы; неоднозначность אֲחֹתָם документирована в сноске.
