  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма וַיְהִי служит краткой повествовательной переходной формулой. «И было» сохраняет лаконизм и синтаксическую незавершённость еврейского оборота, который связывает этот стих с последующим текстом.
- source_word: אַחֲרֵי
  choice: после
  rationale: Предлог прямо обозначает временную последовательность; «после» — естественный и точный русский эквивалент.
- source_word: הַמַּגֵּפָה
  choice: поражения
  rationale: מַגֵּפָה обозначает губительное бедствие или кару, нередко массовую смерть как Божий суд. В данном контексте «поражение» сохраняет связь с предшествующим повествованием и традиционную библейскую широту значения; возможен более конкретный перевод «мора».
theological_decisions:
- issue: Краткая повествовательная формула как отдельный стих
  choice: Передать как самостоятельную переходную фразу, сохранив её краткость.
  alternative: Синтаксически присоединить её к следующему стиху или развернуть как «После поражения случилось следующее».
  rationale: Масоретский текст содержит здесь лишь переходную формулу и отмечает конец раздела. Самостоятельное оформление уважает данное членение и не добавляет отсутствующего в оригинале содержания.
translation_notes:
  register: Современный литературный русский с сохранением краткой библейской переходной формулы. «И было» слегка возвышенно, но понятно; архаическое «и было по поражении» не использовано.
