  naturalness: '«И было после поражения» звучит неестественно для современного литературного русского: сочетание «было после» без продолжающего предложения воспринимается как калька. «После мора произошло следующее:» естественно передаёт функцию краткой переходной формулы и её направленность на следующий текст.'
