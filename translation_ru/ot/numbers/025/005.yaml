  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: ru
  text: 'И сказал Моисей судьям Израиля: «Пусть каждый из вас убьёт мужчин из числа своих людей, примкнувших к Ваал-Фегору[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Ваалу Фегорскому».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально с еврейского: «убейте — каждый своих людей», то есть каждый судья должен был убить мужчин, находившихся под его властью и примкнувших к Ваал-Фегору.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: судьям
  rationale: Существительное обозначает людей, наделённых судебной и управленческой властью; «судьи» прямо и естественно передаёт эту функцию.
- source_word: הִרְגוּ
  choice: пусть каждый из вас убьёт
  rationale: Повелительная форма множественного числа выражает прямой приказ. «Убьёт» сохраняет обычное значение глагола, не добавляя прямо не выраженного юридического оттенка слова «казнит».
- source_word: אִישׁ אֲנָשָׁיו
  choice: каждый из вас… тех из своих людей
  rationale: Распределительная конструкция поручает каждому судье умертвить подвластных ему виновных. Формулировка естественна по-русски и не создаёт впечатления, будто речь идёт обо всех его людях.
- source_word: הַנִּצְמָדִים
  choice: кто примкнул
  rationale: Причастие нифаля от צמד означает тесно присоединиться или привязаться. «Примкнул» передаёт сознательную приверженность без излишнего раскрытия метафоры.
- source_word: לְבַעַל פְּעוֹר
  choice: к Ваалу Фегорскому
  rationale: Так передаётся божество, связанное с местностью Фегор; формулировка прозрачна и соответствует сложившемуся русскому библейскому именованию. Слитное имя дано как вариант в примечании.
theological_decisions:
- issue: Характер повеления об убийстве
  choice: Передать прямой приказ Моисея судьям убить виновных мужчин, находящихся в их ведении, не добавляя отсутствующих в стихе юридических или ритуальных пояснений.
  alternative: Употребить «казнить», подчёркивая судебный характер наказания, либо пояснить его как заветный суд.
  rationale: Сам стих содержит суровый прямой приказ в ответ на отступничество, но не описывает здесь процедуру и богословскую квалификацию наказания.
- issue: Мужской референт в אִישׁ אֲנָשָׁיו
  choice: Сохранить указание на мужчин посредством выражения «тех из своих людей».
  alternative: Нейтрализовать выражение как «тех, кто вам подчинён».
  rationale: Еврейский текст употребляет явно мужские формы и в контексте говорит о мужчинах-нарушителях; перевод не должен устранять это значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка возвышенный, но понятный; прямота приказа и распределительный смысл еврейской конструкции сохранены.
