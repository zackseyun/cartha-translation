  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: ru
  text: И прилепился Израиль к Ваал-Фегору[a], и воспылал гнев Яхве на Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Ваалу Фегорскому»; также: «соединился с Ваал-Фегором» или «связал себя с Ваал-Фегором».'
    reason: 'Лексическая и ономастическая альтернатива: נִצְמַד означает тесно присоединиться или привязаться, а בַּעַל פְּעוֹר может пониматься как составное имя «Ваал-Фегор» либо как Ваал, связанный с Фегором.'
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: примкнул
  rationale: Нифаль глагола צמד выражает тесное присоединение или привязанность. «Примкнул» естественно передаёт активное участие Израиля, не устраняя возможный образ соединения или впрягания.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятое русское наименование народа; грамматическое единственное число сохраняет собирательный характер еврейского текста.
- source_word: לְבַעַל פְּעוֹר
  choice: к Ваалу Фегорскому
  rationale: Передаёт связь Ваала с местностью Фегор и соответствует укоренившейся русской форме топонима, не сливая два имени в одно.
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сохраняет еврейскую метафору жара и при этом звучит естественно в достойном современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: При выражении חרה אף предлог ב обозначает объект гнева; по-русски это естественно передаётся сочетанием «гнев ... на Израиль».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя без замены его титулом.
- issue: Характер связи Израиля с Ваалом
  choice: примкнул
  alternative: соединился; впрягся в одно ярмо
  rationale: Выбранное слово сохраняет мысль о тесной и сознательной идолопоклоннической привязанности, но не делает образ ярма обязательным там, где глагол допускает более общее значение присоединения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксический параллелизм двух еврейских предложений сохранён; архаизм «воспылал» оставлен как понятный и точный носитель метафоры горящего гнева.
