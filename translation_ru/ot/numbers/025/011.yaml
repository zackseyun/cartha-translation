base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: ru
  text: Финеес, сын Елеазара, сына Аарона, священника, отвратил Мой гнев от сынов Израиля, ревнуя Моей ревностью среди них[a], так что Я не истребил сынов Израиля в Моей ревности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревнуя Моим рвением среди них ... в Моём рвении». Еврейский текст использует родственные формы одного корня для действия Финееса и Божьего ответа; этот корень может обозначать как ревность, так и ревностное рвение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: отвратил
  rationale: В породе хифиль глагол שוב с объектом «гнев» означает заставить отступить, отвести или отвратить; «отвратил Мой гнев» естественно и точно передаёт причинный смысл.
- source_word: חֲמָתִי
  choice: Мой гнев
  rationale: חֵמָה обозначает сильный, пылающий гнев; русское «гнев» сохраняет интенсивность и уместно в возвышенном библейском контексте.
- source_word: מֵעַל
  choice: от сынов Израиля
  rationale: Сочетание מן + על выражает удаление того, что тяготеет над кем-либо. Буквальное «с сынов Израиля» неестественно по-русски, поэтому смысл образа передан нормативным «от».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Традиционное и понятное русское обозначение народа Израиля сохраняет форму еврейского выражения и его заветный оттенок.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: проявив среди них ревность Моей ревностью
  rationale: Еврейский текст намеренно соединяет глагольную и именную формы корня קנא. Формулировка сохраняет эту заметную, хотя и напряжённую, связь между действием Финееса и Божьей ревностью.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Естественно передаёт действие внутри общины.
- source_word: כִלִּיתִי
  choice: истребил
  rationale: Пиэль глагола כלה здесь означает полностью уничтожить или положить конец; «истребил» ясно выражает угрозу всеобщего уничтожения.
- source_word: בְּקִנְאָתִי
  choice: в Моей ревности
  rationale: Последовательное повторение «ревность» сохраняет лексическую связь с предыдущим употреблением корня קנא.
- source_word: הַכֹּהֵן
  choice: священника
  rationale: Определение синтаксически относится к Аарону; порядок «сына священника Аарона» по-русски ясно передаёт эту связь.
theological_decisions:
- issue: Передача קנא / קִנְאָה применительно к Финеесу и Богу
  choice: ревность / ревностью
  alternative: рвение / рвением
  rationale: «Ревность» сохраняет смысл исключительной заветной преданности и намеренный повтор одного корня. Вместе с тем «рвение» является возможным контекстуальным переводом и поэтому отмечено в сноске.
- issue: Причинно-следственная связь וְלֹא כִלִּיתִי
  choice: и потому Я не истребил
  alternative: и Я не истребил
  rationale: В контексте союз связывает отвращение гнева Финеесом с прекращением кары. «И потому» естественно выражает следствие, не добавляя отдельного богословского утверждения.
- issue: Объём угрозы в כִלִּיתִי
  choice: не истребил сынов Израиля
  alternative: не уничтожил сынов Израиля полностью
  rationale: Глагол допускает значение полного уничтожения; «истребил» передаёт его ёмко, не уточняя сверх текста механизм или степень кары.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены традиционные имена «Финеес», «Елеазар», «Аарон» и выражение «сыны Израиля». Необычный когнатный оборот о ревности удержан ради заметной структуры еврейского текста и разъяснён в сноске.
