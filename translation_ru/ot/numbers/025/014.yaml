  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: ru
  text: Имя убитого израильтянина, который был убит вместе с мадианитянкой[a], — Зимри, сын Салу, глава отеческого дома[b] среди симеонитян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст дважды повторяет глагол «убить»: буквально — «убитого израильтянина, который был убит вместе с мадианитянкой».'
    reason: lexical_alternative
  - marker: b
    text: «Отеческий дом» — патрилинейная семейно-родовая группа внутри племени.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם אִישׁ יִשְׂרָאֵל
  choice: Имя ... израильтянина
  rationale: Конструкция называет человека и связывает сообщение с предыдущим повествованием; в русском дополнительный начальный союз не требуется. Родительный «израильтянина» естественно передаёт איש ישראל.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: убитого ... который был убит
  rationale: Сохранён намеренный повтор двух форм נכה. В данном контексте речь идёт о смертельном поражении, поэтому «убит» точнее и естественнее, чем буквальное «поражён».
- source_word: אֶת הַמִּדְיָנִית
  choice: вместе с мадианитянкой
  rationale: 'После пассивной формы глагола выражение указывает на совместность: мужчина был убит вместе с женщиной из Мадиама. Женский род субстантивированного прилагательного естественно передан словом «мадианитянка».'
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Зимри, сын Салу
  rationale: Имена транслитерированы в привычной русской библейской форме; בֶּן передано как «сын».
- source_word: נְשִׂיא
  choice: глава
  rationale: Слово обозначает руководителя или начальника; «глава» естественно сочетается с родовой единицей и не вносит монархического оттенка слова «князь».
- source_word: בֵית אָב
  choice: отеческий дом
  rationale: Сохранён древнеизраильский термин для патрилинейной семейно-родовой группы; пояснение дано в сноске.
- source_word: לַשִּׁמְעֹנִי
  choice: среди симеонитян
  rationale: Предлог ל с обозначением племенной принадлежности передан как включённость в племя Симеона.
theological_decisions: []
