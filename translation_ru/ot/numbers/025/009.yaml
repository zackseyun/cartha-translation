lexical_decisions:
- source_word: וַיִּהְיוּ הַמֵּתִים
  choice: И умерших… было
  rationale: 'Такая конструкция естественно передаёт итоговый численный подсчёт: форма היה служит связкой, а причастие от מות обозначает умерших.'
- source_word: בַּמַּגֵּפָה
  choice: от мора
  rationale: מַגֵּפָה обозначает смертоносное поражение или эпидемическое бедствие. Русское «мор» кратко и уместно в библейском повествовании; предлог «от» ясно выражает причину смерти, допустимую по контексту.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: двадцать четыре тысячи
  rationale: Современная русская форма числительного точно передаёт еврейское «четыре и двадцать тысяч».
