  source_fidelity: 'Смысл передан: речь идёт об общем числе людей, умерших при моровом поражении, — двадцать четыре тысячи. Однако «от мора» несколько сильнее конкретизирует значение еврейского בַּ («при, во время»), чем требуется формой исходного текста.'
