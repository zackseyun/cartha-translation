lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма с последовательным וַ продолжает повествование; в стандартной русской формуле введения прямой речи глагол דבר естественно передаётся как «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста; традиционная замена титулом отмечена в сноске.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи, обозначенного предлогом אֶל; מֹשֶׁה передаётся в принятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание последующей прямой речи. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь было бы тяжеловесным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет это различие, а традиционная передача титулом указана в сноске.
translation_notes:
  register: Современный литературный русский язык; сохранена традиционная библейская формула речи без архаичного «говоря».
