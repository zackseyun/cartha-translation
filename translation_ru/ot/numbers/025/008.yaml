revisions:
- from: Он вошёл вслед за израильтянином во внутреннее помещение[a] и пронзил их обоих — израильтянина и женщину — в живот[b]. И прекратилось поражение среди сынов Израиля[c].
  to: Он вошёл вслед за израильтянином во внутреннее помещение[a] и пронзил их обоих — израильтянина и женщину — в её живот[b]. И мор прекратился среди сынов Израиля[c].
  rationale: 'Заменено неоднозначное «поражение» на «мор», что точнее передаёт מַגֵּפָה в контексте божественного бедствия и согласуется с английским audit trail. В выражение «в её живот» добавлен прямо выраженный в еврейском суффиксе женский референт. Примечание a слегка нормализовано: «шатровое помещение» естественнее современного русского, чем «шатровый покой», но по-прежнему отмечено лишь как вариант, а не как установленная реалия.'
  reviewer_model: gpt-5.6-terra
