  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: ru
  text: И они пригласили народ на жертвоприношения своим богам, и народ ел и кланялся их богам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялся их богам». Еврейский глагол буквально обозначает поклон или простирание ниц, нередко как акт поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: они приглашали
  rationale: Форма 3-го лица женского рода множественного числа указывает на моавитянок из предыдущего стиха; קרא с לְ в данном контексте естественно означает приглашение. Русский несовершенный вид передаёт последовательное вовлечение народа, не исключая повторяемости действия.
- source_word: לָעָם
  choice: народ
  rationale: Определённое существительное עָם буквально означает «народ»; из контекста ясно, что речь об Израиле, однако имя «Израиль» в этом стихе не повторяется.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: на жертвы своим богам
  rationale: זִבְחֵי — форма сопряжённого состояния во множественном числе. Оборот обозначает жертвоприношения и связанные с ними трапезы; «на жертвы своим богам» естественно передаёт приглашение участвовать в них и сохраняет принадлежность богов женщинам.
- source_word: וַיֹּאכַל
  choice: народ ел
  rationale: Еврейский текст употребляет глагол в единственном числе при собирательном הָעָם. По-русски согласование в единственном числе с «народ» естественно и сохраняет грамматическую форму источника.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонялся
  rationale: Глагол обозначает склонение или простирание перед кем-либо, часто как акт почитания. В современном русском «поклонялся» сохраняет и телесный образ поклона, и культовое значение контекста; буквальная альтернатива дана в сноске.
- source_word: לֵאלֹהֵיהֶן
  choice: их богам
  rationale: Предлог לְ после השתחוה отмечает объект, которому воздаётся поклонение. Местоимение «их» недвусмысленно относится к богам моавитянок.
theological_decisions:
- issue: Передача идолопоклоннического действия וַיִּשְׁתַּחֲווּ
  choice: поклонялся их богам
  alternative: склонился перед их богами / простёрся перед их богами
  rationale: «Поклонялся» в русском языке естественно сочетает конкретный жест поклона с культовым смыслом, не добавляя конфессиональной интерпретации. Сноска сохраняет телесную конкретность еврейского глагола.
translation_notes:
  register: Современный литературный русский язык с повествовательной простотой и умеренно возвышенным библейским регистром. Собирательное «народ» последовательно согласовано с глаголами в единственном числе. Точка с запятой ясно разделяет приглашение и последовавшие действия.
