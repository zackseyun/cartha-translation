  source_fidelity: 'Нужно исправить вид первого глагола: וַתִּקְרֶאןָ — повествовательная форма wayyiqtol, обозначающая завершённое действие в последовательности рассказа, поэтому «пригласили», а не «приглашали». Остальные основные соответствия переданы верно: «народ» сохраняет неопределение этнонима, «ел» естественно передаёт собирательное הָעָם, а «кланялся» сохраняет конкретное действие השתחוה без преждевременной подстановки более интерпретирующего «поклонялся».'
