  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: ru
  text: 'Поэтому скажи: «Вот, Я даю ему Мой завет мира».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим Божьим одобрением поступка Финееса.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет эмфатическую формулу непосредственного божественного заявления; в современном литературном русском «вот» звучит естественнее, чем архаичное «се».
- source_word: נֹתֵן
  choice: даю
  rationale: Настоящее время передаёт причастную форму и непосредственный характер дарования.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: Мой завет мира
  rationale: Сохраняет конструкцию сопряжения и её возможную смысловую ёмкость, не сводя её только к «мирному завету» или «обещанию благополучия».
theological_decisions:
- issue: Характер выражения «завет мира»
  choice: Мой завет мира
  alternative: Мой мирный завет / Мой завет благополучия
  rationale: 'Буквальная конструкция сохраняет богословскую и семантическую напряжённость слова שָׁלוֹם: мир, целостность, благополучие; контекст не требует выбирать лишь один оттенок.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Заглавные местоимения «Я», «Мой» обозначают речь Бога в соответствии с русской религиозно-издательской традицией.
