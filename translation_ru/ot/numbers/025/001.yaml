  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: ru
  text: Когда Израиль находился в Шиттиме, народ начал блудить[a] с дочерьми Моава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начал вступать в недозволенные половые связи с моавитянками»; буквально: «начал блудить с дочерьми Моава».'
    reason: Лексическая альтернатива поясняет значение древнееврейского глагола и даёт более естественную современную передачу выражения «дочери Моава».
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: Глагол יָשַׁב может означать «сидеть», «жить», «оставаться». Здесь речь идёт о пребывании Израиля на стоянке, и «жил» естественно передаёт этот смысл, не подразумевая окончательного поселения.
- source_word: בַּשִּׁטִּים
  choice: в Шиттиме
  rationale: Топоним передан транслитерацией с древнееврейского; предложное сочетание «в Шиттиме» естественно обозначает место пребывания.
- source_word: וַיָּחֶל
  choice: начал
  rationale: В данной конструкции глагольная форма имеет идиоматическое значение начала действия.
- source_word: הָעָם
  choice: народ
  rationale: Собирательное обозначение израильтян; русское «народ» сохраняет грамматическое единственное число и связь с предшествующим «Израиль».
- source_word: לִזְנוֹת
  choice: блудодействовать
  rationale: Глагол זנה обозначает недозволенные половые отношения и сохраняет резкий образ блуда; «блудодействовать» точнее и выразительнее, чем обобщённое «вести себя безнравственно».
- source_word: אֶל
  choice: с
  rationale: При глаголе זנה предлог указывает на участниц половых отношений; по-русски это естественно передаётся предлогом «с».
- source_word: בְּנוֹת מוֹאָב
  choice: дочерьми Моава
  rationale: Формально близкая передача древнееврейского выражения сохраняет образ «дочерей» народа/земли Моава и остаётся понятной современному читателю.
theological_decisions:
- issue: Характер греха Израиля
  choice: 'Сохранить прямую лексику блуда: «начал блудодействовать».'
  alternative: «начал вступать в недозволенные половые связи» или «начал предаваться разврату».
  rationale: Древнееврейский זנה выражает именно половую распущенность и несёт сильный образ блуда. Перевод не смягчает формулировку до общей безнравственности и вместе с тем не добавляет к этому стиху прямо не выраженного объяснения о культовой проституции или заветной неверности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Блудодействовать» несколько книжное, но понятное слово, уместное для нравственной резкости исходного текста. Маркер сноски поставлен после спорного выражения, к которому относится пояснение.
