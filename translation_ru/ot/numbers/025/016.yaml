  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится «Господь». Другие варианты передачи имени — «Яхве» и «Иегова».'
    reason: Пояснение передачи Божьего имени и указание традиционных вариантов.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с вау-последовательным вводит новое событие повествования. В русской библейской речи «сказал Моисею» естественно передаёт формулу обращения и вместе с לֵאמֹר избегает тяжеловесного «говорил… говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь» и соответствует наиболее распространённой современной научной реконструкции произношения.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи, обозначенного еврейским предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие после «сказал Моисею»
  rationale: Инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно передаёт двоеточие; буквальное «говоря» было бы избыточным и менее естественным.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, то есть личное имя, а не титул. «Яхве» сохраняет это различие; сноска сообщает традиционные варианты, не навязывая конфессионального прочтения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формульная еврейская конструкция передана естественной русской формулой введения прямой речи; двоеточие уместно, поскольку содержание речи следует в следующем стихе.
