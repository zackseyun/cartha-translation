  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: ru
  text: И вот, один из сынов Израиля пришёл и подвёл мадианитянку к своим братьям[a] на глазах у Моисея и на глазах у всей общины сынов Израиля, а те плакали у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своим родичам»; возможно также: «к своим соплеменникам». Буквально: «к своим братьям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапное переключение внимания и повествовательный оттенок потрясения естественным современным русским оборотом.
- source_word: אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: один из сынов Израиля
  rationale: Сохраняет единичность мужчины и родственный образ выражения בְּנֵי יִשְׂרָאֵל, не прибегая к архаическому «из сынов Израилевых».
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Каузатив глагола קרב означает «приблизил, подвёл». Русское «подвёл» естественно передаёт направленное приближение женщины к группе людей.
- source_word: אֶל אֶחָיו
  choice: к своим братьям
  rationale: Формально передаёт еврейское «к его братьям»; притяжательное «своим» естественно при совпадении субъекта действия и обладателя.
- source_word: הַמִּדְיָנִית
  choice: мадианитянку
  rationale: Фемининная субстантивированная форма обозначает женщину из Мадиама. Русское существительное ясно и лаконично выражает пол и происхождение; категория определённости в русском не маркируется артиклем.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: на глазах у ... и на глазах у
  rationale: Сохраняет повтор и подчёркивает открытый, вызывающий характер поступка, оставаясь естественным по-русски.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всей общины сынов Израиля
  rationale: «Община» уместно обозначает собранное сообщество, а «сыны Израиля» сохраняет родственную формулу оригинала.
- source_word: וְהֵמָּה בֹכִים
  choice: а те плакали
  rationale: Местоимение с причастием описывает продолжающееся фоновое действие. «А те плакали» естественно противопоставляет дерзкий поступок мужчины скорби собравшихся, не добавляя причинной связи.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Передаёт место у входа и культовое наименование אֹהֶל מוֹעֵד понятным, последовательным русским выражением.
theological_decisions:
- issue: Родственные обозначения בְּנֵי יִשְׂרָאֵל и אֶחָיו
  choice: Сохранить в основном тексте «сыны Израиля» и «братья»
  alternative: «израильтяне» и «соплеменники»
  rationale: Оригинал использует мужские родственные термины, несущие не только этнический, но и семейно-общинный оттенок. Более широкое контекстуальное понимание «братьев» отмечено в сноске, а не подменяет формулировку текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественного русского порядка слов, но повтор «на глазах у» и родственные формулы оригинала сохранены. «Шатёр встречи» выбран вместо более традиционного «скиния собрания» ради понятности без утраты культовой специфики.
