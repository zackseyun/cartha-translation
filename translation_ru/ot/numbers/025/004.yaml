  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]: «Возьми всех вождей народа и посади их на кол перед Яхве средь бела дня[b], чтобы пламенный гнев Яхве отвратился от Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возьми всех вождей народа, и пусть они казнят виновных перед Яхве средь бела дня». Еврейское местоимение «их» по синтаксису непосредственнее всего указывает на вождей, однако некоторые понимают их как тех, кому велено совершить казнь.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «перед солнцем». Выражение указывает на открытую публичную казнь при дневном свете. Слова «перед Яхве» можно также перевести «для Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: קַח
  choice: Возьми
  rationale: Прямое и естественное соответствие повелительной форме לקח в данном контексте.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: всех вождей народа
  rationale: Слово רָאשֵׁי буквально означает «главы», но современное русское «вожди» ясно обозначает руководителей и избегает ошибочного понимания как частей тела.
- source_word: וְהוֹקַע אֹתָם
  choice: и посади их на кол
  rationale: Порода Hiphil глагола יקע здесь обозначает жестокую публичную казнь с выставлением тела; «посади на кол» естественно передаёт вероятный способ казни, не сводя выражение к общему «казни».
- source_word: לַיהוָה
  choice: перед Яхве
  rationale: Предлог ל может выражать направленность, посвящение или отношение к Богу; «перед Яхве» передаёт судебно-сакральный характер действия, хотя возможно и «для Яхве».
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: средь бела дня
  rationale: Буквально «перед солнцем»; русская идиома естественно выражает открытую публичную казнь при дневном свете.
- source_word: וְיָשֹׁב
  choice: чтобы ... отвратился
  rationale: В контексте повеления форма выражает цель или ожидаемый результат — прекращение Божьего гнева.
- source_word: חֲרוֹן אַף יְהוָה
  choice: пламенный гнев Яхве
  rationale: Сохраняет образ жара в еврейском устойчивом выражении, обозначающем сильный гнев.
- source_word: מִיִּשְׂרָאֵל
  choice: от Израиля
  rationale: Предлог מן выражает удаление или отделение; оборот «гнев отвратился от Израиля» естественен для возвышенного современного русского языка.
theological_decisions:
- issue: К кому относится местоимение «их» в повелении о казни
  choice: В основном тексте местоимение относится к «вождям народа», ближайшему множественному антецеденту.
  alternative: Вожди должны сами казнить виновных в поклонении Ваал-Фегору.
  rationale: Синтаксис стиха естественнее всего связывает אֹתָם с непосредственно предшествующим כָּל רָאשֵׁי הָעָם. Однако следующий стих поручает судьям убить виновных, поэтому альтернативное понимание представляет подлинную контекстуальную возможность и сохранено в примечании.
- issue: Значение לַיהוָה при описании казни
  choice: перед Яхве
  alternative: для Яхве
  rationale: Предлог ל допускает значение посвящения («для Яхве»), однако судебно-сакральная формула может обозначать действие перед Богом. Неоднозначность отмечена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Имя Яхве сохранено; архаичные и двусмысленные для современного читателя «главы народа» заменены ясным «вожди народа». Идиома «средь бела дня» передаёт публичность действия, а примечания сохраняют грамматическую и лексическую неоднозначность исходного текста.
