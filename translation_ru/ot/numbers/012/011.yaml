source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: ru
  text: 'И сказал Аарон Моисею: «Прошу, господин мой, не возлагай на нас греха[a] за то, что мы поступили безрассудно и согрешили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не возлагай на нас вины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Прошу, господин мой
  rationale: בִּי выражает настойчивую вежливую просьбу, а אֲדֹנִי — почтительное обращение к Моисею, не божественный титул.
- source_word: אַל נָא
  choice: не возлагай
  rationale: Отрицательная просьба передана формой «не возлагай»; оттенок נָא уже выражен начальным «Прошу», что позволяет избежать стилистического повтора.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: не возлагай на нас греха
  rationale: Сохраняется исходная метафора возложения. חַטָּאת непосредственно означает «грех», но в контексте может подразумевать и вину за него.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: за то, что мы поступили безрассудно
  rationale: Нифаль глагола יאל обозначает безрассудное, глупое поведение. «Поступили безрассудно» естественно звучит по-русски и сохраняет нравственную оценку признания.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: и согрешили
  rationale: Вторая часть усиливает признание проступка. Общая конструкция «за то, что» распространяется на оба однородных сказуемых и естественно передаёт связь с просьбой.
theological_decisions:
- issue: Значение אֲדֹנִי в обращении к Моисею
  choice: господин мой
  alternative: государь мой; господин
  rationale: Здесь это почтительное обращение к человеку, а не имя или титул Бога. Формулировка сохраняет подчёркнутое смирение Аарона.
- issue: Значение חַטָּאת в просьбе Аарона
  choice: грех
  alternative: вина
  rationale: «Грех» — прямое и прозрачное соответствие, сохраняющее образ возложения; «вина» контекстуально возможна, поскольку речь может идти о вменении ответственности за проступок.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Инверсия «И сказал Аарон Моисею» уместно сохраняет повествовательный ритм; просьба звучит почтительно и ясно без архаизмов.
