  text: После этого народ отправился из Хацерота и расположился станом в пустыне Паран.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: После этого
  rationale: Передаёт временную последовательность после описанных ранее событий естественным современным русским выражением.
- source_word: נָסְעוּ
  choice: отправился
  rationale: В контексте странствования глагол נסע обозначает снятие со стоянки и дальнейшее движение; «отправился» передаёт это естественно, без архаизации.
- source_word: הָעָם
  choice: народ
  rationale: עָם обозначает здесь общину Израиля как единое целое; собирательное существительное «народ» требует глагола в единственном числе.
- source_word: מֵחֲצֵרוֹת
  choice: из Хацерота
  rationale: Географическое название передано транслитерацией в форме, согласующейся с русской библейской традицией; предлог מִן передан как «из».
- source_word: וַיַּחֲנוּ
  choice: и расположился станом
  rationale: Глагол חנה означает остановиться лагерем; выражение «расположился станом» ясно и уместно для повествования о переходах Израиля.
- source_word: בְּמִדְבַּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает необжитую пустынную местность; «пустыня» естественно сохраняет географический и повествовательный смысл.
- source_word: פָּארָן
  choice: Паран
  rationale: Географическое имя передано принятой русской транслитерацией.
