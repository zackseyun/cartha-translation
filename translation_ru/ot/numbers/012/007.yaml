  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: ru
  text: 'Но не так с Моисеем, Моим слугой: он верен во всём Моём доме.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всём Моём семействе». Еврейское слово «дом» может обозначать также семейство, домочадцев или принадлежащую кому-либо общность, а не только строение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Но не так
  rationale: Кратко и естественно передаёт резкое противопоставление предыдущему высказыванию.
- source_word: עַבְדִּי
  choice: Моим слугой
  rationale: Здесь עֶבֶד — почётное обозначение Моисея как служащего Богу, а не акцент на подневольном положении.
- source_word: מֹשֶׁה
  choice: Моисеем
  rationale: Использована традиционная русская форма имени с падежным согласованием.
- source_word: בְּכָל בֵּיתִי
  choice: во всём Моём доме
  rationale: Сохраняет образ дома и значение предлога ב, не сводя выражение однозначно к семье, народу или сфере управления.
- source_word: נֶאֱמָן הוּא
  choice: он верен
  rationale: נֶאֱמָן обозначает верность, надёжность и доверенность; «верен» естественно звучит в данном отношении к Богу.
theological_decisions:
- issue: Значение выражения «Мой дом» применительно к роли Моисея
  choice: Сохранить метафору «во всём Моём доме» в основном тексте.
  alternative: «во всём Моём семействе» / «среди всего Моего народа»
  rationale: Еврейское בַּיִת может означать дом, семейство или домочадцев и шире — принадлежащую кому-либо общность или владение. Сохранение образа не устраняет эту многозначность и удерживает межтекстовые связи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в притяжательном местоимении обозначают Бога согласно принятой русской библейской традиции; пунктуация подчёркивает противопоставление и последующее утверждение.
