  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: ru
  text: Моисей же был очень кротким человеком[a] — кротче любого человека на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смиренным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאִישׁ מֹשֶׁה
  choice: Моисей же был человеком
  rationale: Частица «же» естественно передаёт связь с предшествующим спором и выделяет Моисея; сочетание «был человеком» сохраняет явное הָאִישׁ, не создавая неестественного оборота «человек Моисей».
- source_word: ענו
  choice: кротким
  rationale: В данном контексте прилагательное описывает мягкость, незлобивость и отсутствие самонадеянности. «Кроткий» сохраняет традиционную и библейски узнаваемую формулировку; возможный оттенок «смиренный» отмечен в сноске.
- source_word: מְאֹד
  choice: очень
  rationale: Прямой и естественный русский усилитель.
- source_word: מִכֹּל הָאָדָם
  choice: кротче любого человека
  rationale: Сравнительная конструкция מן + כל передана естественной русской сравнительной степенью; הָאָדָם имеет здесь обобщённое значение «человек», то есть любой представитель человечества.
- source_word: אֲשֶׁר עַל־פְּנֵי הָאֲדָמָה
  choice: на земле
  rationale: Русское «на земле» ясно и естественно передаёт смысл еврейской идиомы «на лице земли» без ненужной буквальности.
theological_decisions:
- issue: Значение ענו как характеристики Моисея
  choice: кротким
  alternative: смиренным; тихим; униженным
  rationale: Контекст противопоставляет поведение Моисея нападкам Мариам и Аарона, поэтому наиболее вероятна характеристика нрава. При этом семантическая близость к смирению сохраняется в примечании, а значение «униженный/угнетённый» здесь менее вероятно.
- issue: Обобщённое הָאָדָם в сравнении
  choice: любого человека
  alternative: всех людей; всякого мужчины
  rationale: Здесь слово обозначает человека вообще, а не только мужчину; «любого человека» точно выражает универсальный сравнительный смысл и не сужает его по полу.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Тире подчёркивает сравнительное пояснение, а «же» связывает ремарку о характере Моисея с окружающим повествованием.
