  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: ru
  text: 'И они сказали[a]: «Разве Яхве говорил лишь через Моисея? Разве Он не говорил и через нас?» И Яхве услышал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве Яхве говорил только Моисею? Разве Он не говорил и нам?» Еврейский предлог может указывать либо на адресата речи Яхве, либо на того, через кого она передаётся.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Форма wayyiqtol продолжает повествовательную последовательность и вводит прямую речь; местоимение сохраняет множественное число подлежащего.
- source_word: הֲרַק אַךְ
  choice: Разве только
  rationale: Сочетание вопросительной частицы с двумя ограничительно-усилительными частицами выражает риторический вызов и исключительность; по-русски это естественно передаётся конструкцией «разве только».
- source_word: בְּמֹשֶׁה
  choice: через Моисея
  rationale: Предлог ב при דבר может обозначать как адресата, так и посредника. В контексте спора о пророческом авторитете основное чтение понимает Моисея как посредника Божьей речи.
- source_word: דִּבֶּר יְהוָה
  choice: говорил Яхве
  rationale: Глагол דבר обозначает речь, в данном контексте — Божье откровение; несовершенный вид «говорил» естественно передаёт неоднократное или характерное действие, подразумеваемое спором.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: Разве Он не говорил и через нас?
  rationale: Повтор той же предложной конструкции передан последовательно; контекст поддерживает притязание Мариам и Аарона на роль посредников Божьей речи.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: И Яхве услышал
  rationale: Еврейский текст не называет прямого дополнения; русский перевод сохраняет эту лаконичность, поскольку из контекста ясно, что Бог услышал их слова.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение предлога ב при глаголе דבר
  choice: через Моисея / через нас
  alternative: Моисею / нам
  rationale: Обе трактовки грамматически возможны. Контекст посвящён пророческому положению и посредничеству в откровении, поэтому в основном тексте выбрано «через»; альтернативное чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Риторические вопросы сохранены без поясняющей парафразы; подлинная неоднозначность предлога вынесена в сноску.
