base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: ru
  text: Мариам и Аарон говорили против Моисея из-за кушитянки[a], которую он взял[b], ибо он взял кушитянку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эфиоплянки». В еврейском тексте: «кушитянки», то есть женщины из Куша.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «взял» в таком контексте может означать «взял в жёны» или «женился на ней».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: стали говорить
  rationale: Глагол דבר означает «говорить»; множественное число естественно согласуется в русском языке с составным подлежащим «Мариам и Аарон». Отрицательная направленность высказывания передана сочетанием «против Моисея», а не внесена в сам глагол.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Мариам и Аарон
  rationale: Сохранены порядок имён в еврейском тексте и принятые русские библейские формы. Еврейский глагол стоит в единственном числе женского рода, что может указывать на ведущую роль Мариам, однако русский перевод не превращает этот грамматический штрих в явное толкование.
- source_word: בְּמֹשֶׁה
  choice: против Моисея
  rationale: Предлог ב при דבר в данном контексте выражает враждебную направленность речи; «против Моисея» естественно передаёт этот оттенок.
- source_word: עַל אֹדוֹת
  choice: из-за
  rationale: Оборот обозначает повод или причину речи. «Из-за» кратко и естественно передаёт причинное значение.
- source_word: הָאִשָּׁה
  choice: женщины
  rationale: אִשָּׁה может значить и «женщина», и «жена». Выбрано более формально соответствующее «женщина», тогда как брачный смысл возможного идиоматического употребления לקח пояснён в сноске.
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: кушитянка / женщину-кушитянку
  rationale: Обозначение указывает на происхождение из Куша. «Кушитянка» точнее и менее анахронично, чем традиционное «эфиоплянка».
- source_word: אֲשֶׁר לָקָח
  choice: которую он взял
  rationale: לקח буквально значит «взять», а в брачном контексте может означать «взять в жёны» или «жениться». Основной текст сохраняет еврейское выражение, а сноска разъясняет его возможный смысл.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит пояснительное повторение уже названной причины. «Потому что» сохраняет причинно-пояснительную связь.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: он взял женщину-кушитянку
  rationale: Повтор исходного текста сохранён ради его эмфатического эффекта, а не сглажен стилистически.
theological_decisions:
- issue: Происхождение и отождествление жены Моисея
  choice: Передать כֻשִׁית как «кушитянка», не отождествляя эту женщину прямо с Сепфорой и не согласовывая обозначение с мадианитянским происхождением.
  alternative: Перевести традиционно как «эфиоплянка» либо истолковать это слово как указание на Сепфору.
  rationale: Сам стих называет женщину кушитянкой. Перевод сохраняет это обозначение и не разрешает историко-гармонизационный вопрос, которого текст прямо не разрешает.
- issue: Брачный смысл глагола לקח
  choice: Сохранить в основном тексте буквальное «взял», пояснив в сноске возможный смысл «взял в жёны».
  alternative: Сразу перевести «женился на ней» или «взял её в жёны».
  rationale: Так сохраняются и форма еврейского выражения, и его вероятный идиоматический брачный смысл без устранения лексической многозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены причинная структура и намеренное повторение еврейского текста; географо-этническое обозначение передано источниково прозрачно.
