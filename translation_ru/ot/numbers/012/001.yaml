  source_fidelity: 'Смысловые отношения переданы верно: речь направлена против Моисея, её поводом названа кушитянка, а повтор в конце сохранён. Однако «стали говорить» вносит не выраженное еврейским текстом начинательное значение («начали»). Еврейская форма глагола формально единственного числа женского рода при составном подлежащем; русский не может воспроизвести это согласование без неестественного или интерпретативного решения, поэтому нейтральное множественное прошедшее время приемлемо.'
