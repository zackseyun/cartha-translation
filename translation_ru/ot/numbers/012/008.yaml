base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: ru
  text: Устами к устам говорю Я с ним[a], явно, а не загадками; и он созерцает образ Яхве[b]. Почему же вы не побоялись говорить против Моего раба, против Моисея?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицом к лицу». Буквально по-еврейски: «устами к устам»; выражение подчёркивает непосредственность речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово, переведённое как «образ», можно также передать: «подобие Яхве» или «облик Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: устами к устам
  rationale: Сохранён буквальный и выразительный образ еврейского текста, подчёркивающий непосредственность речи; более привычное «лицом к лицу» дано как возможный смысл в сноске.
- source_word: אֲדַבֶּר בּוֹ
  choice: говорю Я с ним
  rationale: Предлог ב при глаголе דבר здесь передаёт общение с собеседником, поэтому «с ним» точнее простого «ему».
- source_word: וּמַרְאֶה
  choice: явно
  rationale: В противопоставлении словам «не загадками» существительное указывает на ясный, явный способ откровения; наречная передача естественна по-русски.
- source_word: וְלֹא בְחִידֹת
  choice: а не загадками
  rationale: חִידוֹת обозначает загадки или иносказательные, неясные речи. Союз «а» естественно выражает противопоставление.
- source_word: וּתְמֻנַת יְהוָה
  choice: и образ Яхве
  rationale: תְּמוּנָה может означать образ, подобие или видимый облик. «Образ» сохраняет конкретность и не уточняет природу богоявления сверх сказанного в тексте.
- source_word: יַבִּיט
  choice: он созерцает
  rationale: Форма глагола נבט передаёт направленное, внимательное смотрение; «созерцает» сохраняет торжественный регистр.
- source_word: וּמַדּוּעַ
  choice: Почему же
  rationale: Частица «же» естественно передаёт вывод и укор, основанные на предшествующем утверждении.
- source_word: לֹא יְרֵאתֶם
  choice: вы не побоялись
  rationale: 'Так передана укоризненная сила глагола ירא: отсутствие должного страха перед дерзким поступком.'
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: говорить против Моего раба, против Моисея
  rationale: В контексте предлог ב обозначает объект враждебной речи. Повтор «против» отражает повторение предлога и сохраняет особое ударение на имени Моисея.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Описание данного Моисею откровения
  choice: образ Яхве
  alternative: подобие Яхве; облик Яхве; явление Яхве
  rationale: Формулировка сохраняет утверждение о необычайно непосредственном откровении Моисею, но не разрешает богословское напряжение и не определяет метафизическую природу увиденного.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «говорю Я» уместно выделяет Божественного говорящего; синтаксис остаётся ясным для современного читателя.
