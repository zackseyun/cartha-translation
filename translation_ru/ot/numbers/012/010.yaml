base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: ru
  text: Облако отошло от шатра, и вот, Мариам была поражена проказой[a] — белая, как снег. Аарон повернулся к Мариам, и вот, она поражена проказой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Переданное здесь словом «проказа» еврейское слово может обозначать различные кожные поражения или ритуальное состояние нечистоты, а не только болезнь, которую современная медицина называет лепрой (болезнью Хансена).
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённая форма указывает на известное из контекста облако, связанное с присутствием Господа.
- source_word: סָר מֵעַל הָאֹהֶל
  choice: отошло от шатра
  rationale: Глагол выражает удаление, а מֵעַל — движение от положения над чем-либо. В русском «отошло от шатра» естественно передаёт движение облака; буквальное пространственное «сверху от шатра» звучало бы неестественно.
- source_word: וְהִנֵּה
  choice: и вот / и увидел
  rationale: В первом случае «и вот» сохраняет внезапность и выразительность представления; во втором оборот естественно передан через зрительное восприятие Аарона, не устраняя акцента на обнаруженном состоянии.
- source_word: מְצֹרַעַת
  choice: покрылась проказой
  rationale: Традиционный русский термин кратко передаёт состояние, однако древнееврейское слово шире современного диагноза болезни Хансена; это уточнено в сноске.
- source_word: כַּשָּׁלֶג
  choice: словно снег
  rationale: Сохранено краткое сравнение исходного текста без добавления слова «белая», хотя белизна, вероятно, подразумевается.
- source_word: וַיִּפֶן אַהֲרֹן אֶל מִרְיָם
  choice: Аарон повернулся к Мариам
  rationale: Передаёт физический поворот в её сторону естественным современным русским выражением.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: 'и увидел: она покрыта проказой'
  rationale: Передаёт повторное וְהִנֵּה как внезапное зрительное обнаружение и сохраняет повтор указания на состояние Мариам.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением повествовательной выразительности оригинала. Традиционное «проказа» оставлено в тексте, а его более широкий древнееврейский смысл разъяснён в сноске.
