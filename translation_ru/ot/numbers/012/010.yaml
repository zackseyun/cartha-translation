  source_fidelity: 'Начальное «Облако отошло от шатра» в целом передаёт удаление облака от скинии, но в первой характеристике Мариам оборот «покрылась проказой, словно снег» синтаксически связывает сравнение со словом «проказа», хотя в еврейском тексте сравнение характеризует вид Мариам, поражённой צרעת. Второе וְהִנֵּה не следует заменять лишь глаголом «увидел»: оно повторяет эффект внезапного обнаружения и подчёркивает состояние Мариам.'
  naturalness: Предлагаемая формулировка «Мариам была поражена проказой — белая, как снег» ясна в современном литературном русском и естественно выражает подразумеваемую белизну, не превращая её в добавленное медицинское описание. Повтор «и вот» сохраняет намеренную повествовательную выразительность оригинала.
  terminology: Традиционное «проказа» допустимо при поясняющей сноске. Сноску следует сформулировать так, чтобы не отождествлять древний термин с конкретным современным диагнозом и не утверждать без необходимости, что во всех случаях речь идёт именно о тяжёлых поражениях кожи.
