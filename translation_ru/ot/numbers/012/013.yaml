  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: ru
  text: 'И воззвал Моисей к Яхве: «Боже, прошу, исцели её, прошу!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: воззвал
  rationale: Глагол צעק передаёт сильный крик или настойчивое обращение. «Воззвал» сохраняет напряжённость молитвенного заступничества и уместно в современном литературном библейском тексте.
- source_word: אֶל
  choice: к
  rationale: Предлог направления естественно передаётся русским «к» при глаголе «воззвал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула вводит содержание возгласа. В естественном русском языке её функцию здесь ясно и кратко выполняет двоеточие, без тяжеловесного «говоря».
- source_word: אֵל
  choice: Боже
  rationale: Форма «Боже» естественно передаёт прямое молитвенное обращение к Богу.
- source_word: נָא ... נָא
  choice: прошу … [не выражено отдельно второй раз]
  rationale: Первое «прошу» передаёт мольбу, а настойчивость повторения поддерживается восклицательной формой; буквальное повторение отмечено в сноске, поскольку «исцели её, прошу» в данном кратком русском возгласе звучит менее естественно.
- source_word: רְפָא
  choice: исцели
  rationale: Императив прямо обозначает исцеление Мариам; «исцели» точно и естественно для молитвенного обращения.
- source_word: לָהּ
  choice: её
  rationale: Местоименный суффикс женского рода относится к Мариам и выражен явно.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом, не внося конфессиональной замены.
- issue: Двукратное употребление частицы נָא
  choice: Одно «прошу» в основном тексте с пояснением в сноске
  alternative: «Боже, прошу, исцели её, прошу!»
  rationale: Повтор усиливает мольбу, но его точная стилистическая функция не обязана воспроизводиться механическим повтором в русском тексте. Сноска сохраняет доступ к форме оригинала и её выразительности.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным регистром. «Воззвал» сохраняет силу обращения, не переходя в разговорное «закричал», а двоеточие естественно заменяет еврейскую вводную формулу «говоря».
