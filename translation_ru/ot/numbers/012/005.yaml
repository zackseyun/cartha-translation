  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: ru
  text: Тогда Яхве сошёл в облачном столпе, остановился у входа в шатёр[a], позвал Аарона и Мариам, и они оба вышли вперёд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть шатёр встречи.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «оба вышли»; по контексту они выступили вперёд в ответ на призыв Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: сошёл
  rationale: Глагол ירד обозначает движение вниз. «Сошёл» естественно передаёт конкретный антропоморфный образ исходного текста, не заменяя его толкованием вроде «явился».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: בְּעַמּוּד עָנָן
  choice: в облачном столпе
  rationale: Предлог ב здесь обозначает образ или среду явления. «Облачный столп» — ясное и естественное по-русски соответствие сочетанию עמוד ענן.
- source_word: וַיַּעֲמֹד
  choice: остановился
  rationale: עמד буквально значит «встал, стоял». В последовательном повествовании после движения «остановился» естественно выражает то, что Яхве занял место у входа, не добавляя нового действия.
- source_word: פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: פתח — «вход, проём»; אהל — «шатёр». Основной текст не разворачивает краткое обозначение в полное «шатёр встречи», но контекст пояснён в сноске.
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: קרא в данном контексте означает «позвать, вызвать». «Позвал» близко к обычному значению и звучит естественно в современном повествовании.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: Аарона и Мариам
  rationale: Использованы устоявшиеся русские формы библейских имён; падежные окончания соответствуют управлению глагола «позвал».
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: они оба вышли вперёд
  rationale: יצא буквально означает «выйти», а שְׁנֵיהֶם подчёркивает обоих. Добавление «вперёд» естественно обозначает их выход к призвавшему Яхве, при этом буквальное направление глагола сохранено словом «вышли».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» передаёт личное имя в исходном тексте и не подменяет его титулом; форма «Иегова» основана на более позднем смешанном прочтении.
- issue: Антропоморфное описание нисхождения Бога
  choice: сохранить конкретное «сошёл»
  alternative: передать толковательно как «явился»
  rationale: Исходный текст прямо говорит о нисхождении. Перевод сохраняет образ и не пытается снять возможное богословское напряжение поясняющим пересказом.
- issue: Характер движения Аарона и Мариам
  choice: «вышли вперёд» с указанием буквального варианта в сноске
  alternative: «подошли»; «оба вышли»
  rationale: Контекст допускает понимание действия как выступления вперёд по зову, тогда как сам глагол буквально означает выход. Основной текст и сноска вместе сохраняют и контекстуальный смысл, и лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и ясный; сохранены конкретная образность нисхождения и личное имя Яхве. «Шатёр» предпочтён более бытовой «палатке», а неоднозначность יצא вынесена в сноску.
