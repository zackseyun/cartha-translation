base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Если бы её отец плюнул ей в лицо, разве не было бы ей стыдно семь дней[a]? Пусть её на семь дней изолируют за пределами стана, а затем её примут обратно[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве не была бы она опозорена семь дней?»'
    reason: Лексема כלם может обозначать как переживаемый стыд, так и объективное бесчестье.
  - marker: b
    text: 'Буквально: «а затем будет собрана (принята)».'
    reason: Страдательная форма אסף буквально связана с собиранием, а в данном контексте означает возвращение после удаления из стана.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом «Господь».
- source_word: יָרֹק יָרַק
  choice: плюнул
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает действие; в русском условная конструкция «если бы… плюнул» естественно передаёт гипотетический и выразительный характер фразы без буквального повтора.
- source_word: בְּפָנֶיהָ
  choice: ей в лицо
  rationale: В сочетании с глаголом «плевать» это естественное русское выражение, сохраняющее смысл тяжёлого публичного оскорбления.
- source_word: תִכָּלֵם
  choice: не была бы опозорена
  rationale: Страдательная форма обозначает подвергнуться позору или унижению; вариант сохраняет социальный характер бесчестья и риторический вопрос.
- source_word: תִּסָּגֵר
  choice: пусть её… изолируют
  rationale: В контексте удаления из стана форма означает заключение или изоляцию. Современное «изолируют» ясно передаёт практический смысл пассивной еврейской формы, не создавая образа тюремного заточения.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределами стана
  rationale: Естественная и точная передача места временного исключения; «стан» сохраняет библейско-исторический контекст, оставаясь понятным.
- source_word: תֵּאָסֵף
  choice: примут обратно
  rationale: Страдательная форма глагола «собирать» здесь означает возвращение в общину или стан после периода исключения. Перевод передаёт восстановление без излишнего уточнения того, кто именно принимает её.
theological_decisions:
- issue: Характер слов об отце, плюнувшем дочери в лицо
  choice: Гипотетическое сравнение, объясняющее срок позора и удаления
  alternative: Упоминание реально произошедшего события
  rationale: Условная конструкция и риторический вопрос представляют ситуацию как аналогию. Перевод сохраняет её гипотетический характер и не добавляет символического или доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским регистром. «Стан» сохранён как понятное историко-библейское обозначение лагеря Израиля; синтаксис сделан естественным для современного читателя. Все примечания привязаны к соответствующим словам текста.
