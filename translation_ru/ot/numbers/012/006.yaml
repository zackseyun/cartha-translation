  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: ru
  text: 'И Он сказал: «Послушайте же Мои слова. Если среди вас есть пророк[a], то Я, Яхве, открываюсь ему[b] в видении; во сне Я говорю с ним[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если кто-нибудь из вас пророк». Буквально по-еврейски: «если будет ваш пророк».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «даю ему познать Себя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «говорю ему». Еврейское выражение буквально содержит предлог, который может означать «с ним» или «ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И Он сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol; местоимение сохраняет подразумеваемого в контексте говорящего и естественно вводит прямую речь.
- source_word: שִׁמְעוּ נָא
  choice: Послушайте же
  rationale: Императив во множественном числе с частицей נָא выражает настойчивый, торжественный призыв; частица «же» естественно передаёт этот оттенок в современном русском языке.
- source_word: דְבָרָי
  choice: Мои слова
  rationale: Прямая передача формы множественного числа с суффиксом первого лица; соответствует торжественному характеру Божьей речи.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: Если среди вас есть пророк
  rationale: Естественная русская передача необычного еврейского выражения, буквально означающего «если будет ваш пророк»; условность и принадлежность к общине сохранены.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: בַּמַּרְאָה
  choice: в видении
  rationale: מַרְאָה здесь обозначает видение как способ пророческого откровения; предложная конструкция естественна по-русски.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: открываю ему Себя
  rationale: Возвратная форма глагола ידע указывает на то, что Яхве даёт пророку познать Себя; русский оборот сохраняет возвратный смысл и звучит естественно.
- source_word: בַּחֲלוֹם
  choice: во сне
  rationale: Прямая и идиоматичная передача способа или среды откровения.
- source_word: אֲדַבֶּר בּוֹ
  choice: Я говорю с ним
  rationale: Предлог ב при דבר допускает значение общения «с кем-либо»; эта передача близка к форме оригинала, а альтернативное «говорю ему» отмечено в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Способ пророческого откровения
  choice: Яхве открывает пророку Себя в видении и говорит с ним во сне
  alternative: Яхве является пророку в видении и говорит ему во сне
  rationale: Перевод сохраняет различие между двумя параллельными способами откровения и возвратный оттенок אֶתְוַדָּע, не добавляя учения о природе пророчества сверх сказанного в стихе.
- issue: Направленность речи в выражении אֲדַבֶּר בּוֹ
  choice: говорю с ним
  alternative: говорю ему
  rationale: Еврейский предлог допускает оба понимания. Основной текст ближе сохраняет предложную конструкцию, а сноска удерживает реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксис сохраняет параллелизм «в видении — во сне»; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным библейским регистром.
