base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: ru
  text: 'И Яхве внезапно сказал Моисею, Аарону и Мариам: «Выйдите[a] все трое[b] к шатру встречи». И все трое вышли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идите»; еврейский глагол обозначает выход или движение из места, где находятся адресаты.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «трое вас»; то есть «вы трое» или «все трое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Сохраняет оттенок неожиданности и резкости Божьего обращения; в современном русском звучит естественно.
- source_word: צְאוּ
  choice: выйдите
  rationale: Императив יצא обозначает движение наружу из того места, где находились адресаты; русское «выйдите» не требует искусственно выбирать между английскими come out и go out.
- source_word: שְׁלָשְׁתְּכֶם
  choice: все трое
  rationale: Ясно указывает на трёх названных адресатов и сохраняет подчёркнутую совместность призыва.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквально и понятно передаёт назначение шатра как места встречи, не сводя מוֹעֵד только к собранию людей.
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Прямо передаёт последовательное повествовательное действие и лексически перекликается с повелением.
- source_word: שְׁלָשְׁתָּם
  choice: все трое
  rationale: Сохраняет повторный акцент исходного текста на том, что повеление исполнили все трое.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Значение אֹהֶל מוֹעֵד
  choice: шатёр встречи
  alternative: шатёр собрания
  rationale: Фраза может традиционно передаваться как «шатёр собрания», однако «шатёр встречи» точнее выражает здесь идею назначенного места встречи с Богом и не вносит представление, будто речь прежде всего о собрании людей.
translation_notes:
  register: Современный литературный русский с кратким, торжественным повествовательным ритмом. Имена переданы в привычных русских формах; «Яхве» сохраняет личное Божье имя. Повтор «все трое» намеренно удерживает повтор исходного текста.
