  terminology: Имена и ключевые понятия переданы последовательно. «Мариам», «стан» и «народ» уместны в контексте повествования о странствиях. Сноска корректно отмечает буквальный образ «собирания» и объясняет его контекстуальное значение, не навязывая богословского толкования.
