  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: вынужденное пребывание Мариам вне стана в течение семи дней, задержку отправления народа и ожидание её принятия обратно. «Была изолирована» корректно выражает пассивное состояние נִסְגֶּרֶת в данном контексте, а «пока Мариам не приняли обратно» естественно передаёт контекстуальный смысл הֵאָסֵף — её возвращение в общину. Добавление «обратно» не является произвольным: оно ясно подразумевается предшествующим пребыванием вне стана и согласуется с английской аудиторской формулировкой.'
