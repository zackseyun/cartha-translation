  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: ru
  text: Мариам была изолирована за пределами стана на семь дней, и народ не трогался в путь, пока Мариам не приняли обратно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока Мариам не была собрана». Еврейский глагол «собирать» здесь означает, что после периода удаления её вновь приняли в стан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: была изолирована
  rationale: Нифаль глагола סגר обозначает состояние отделения или заключения. В данном контексте речь идёт об удалении Мариам из сообщества; «была изолирована» естественно передаёт это по-русски, не создавая обязательного образа тюремного заключения.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределами стана
  rationale: Прямое пространственное обозначение места вне лагеря Израиля. «Стан» сохраняет достойный библейский регистр и остаётся понятным современному читателю.
- source_word: שִׁבְעַת יָמִים
  choice: на семь дней
  rationale: Естественное русское выражение продолжительности установленного периода.
- source_word: הָעָם
  choice: народ
  rationale: В повествовании обозначает всё странствующее сообщество Израиля; «народ» — точный и естественный русский эквивалент.
- source_word: לֹא נָסַע
  choice: не трогался в путь
  rationale: Глагол נסע в повествовании о странствиях означает сняться со стоянки и отправиться дальше. Выражение «не трогался в путь» передаёт этот смысл естественно и конкретно.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: пока Мариам не приняли обратно
  rationale: Нифаль от אסף буквально связан с собиранием или принятием; здесь он обозначает возвращение Мариам в стан и общину после периода изоляции. Формулировка передаёт подразумеваемое восстановление, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Характер возвращения Мариам после семидневного удаления
  choice: «пока Мариам не приняли обратно»
  alternative: «пока Мариам не была собрана»
  rationale: Контекст указывает на её повторное принятие в стан, однако текст не развивает особой богословской формулы восстановления. Перевод сохраняет повествовательный смысл без добавления конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским регистром. «Стан» сохраняет традиционную точность, тогда как «была изолирована» и «не трогался в путь» обеспечивают ясность для обычного современного читателя.
