base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: ru
  text: Прошу, пусть она не будет как мёртвый[a], половина плоти которого при выходе из чрева матери истлела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как мертворождённый ребёнок, у которого при выходе из чрева матери истлела половина плоти». Еврейское выражение буквально означает «как мёртвый»; последующее описание может явно вызывать образ мертворождённого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Прошу, пусть… не
  rationale: אַל выражает запрет или отрицательное пожелание, а נָא придаёт словам характер настойчивой мольбы. «Прошу» естественно передаёт эту мольбу по-русски.
- source_word: תְהִי
  choice: пусть она не будет
  rationale: Форма 3-го лица женского рода после אַל выражает отрицательную просьбу; местоимение «она» относится к Мариам.
- source_word: כַּמֵּת
  choice: как мёртвый
  rationale: 'Буквально: «как мёртвый / как умерший». Формулировка сохраняет общность сравнения, не делая образ мертворождённого явным раньше поясняющей части стиха.'
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: при выходе из материнской утробы
  rationale: Инфинитив с בְּ имеет временное значение. Такая формулировка близка к буквальному образу еврейского текста и звучит естественно по-русски.
- source_word: וַיֵּאָכֵל
  choice: уже разложилась
  rationale: Буквально форма означает «была съедена / поглощена», однако в образе мёртвого при рождении описывает разрушение плоти. «Разложилась» естественно передаёт состояние, не создавая ошибочного впечатления буквального поедания.
- source_word: חֲצִי בְשָׂרוֹ
  choice: половина плоти
  rationale: בשר здесь обозначает физическую плоть. Слово «плоть» сохраняет резкость телесного образа оригинала.
theological_decisions:
- issue: К кому относится форма женского рода תְהִי
  choice: 'К Мариам: «она»'
  alternative: Оставить субъект подразумеваемым
  rationale: В ближайшем контексте Аарон просит за поражённую Мариам; явное местоимение требуется нормами русского синтаксиса и не добавляет богословского толкования.
- issue: Следует ли прямо назвать мертворождённого ребёнка
  choice: Оставить в основном тексте более буквальное «как мёртвый»
  alternative: «как мертворождённый ребёнок»
  rationale: כַּמֵּת само по себе значит «как мёртвый», тогда как образ смерти при рождении раскрывается последующей фразой. Неоднозначность сохраняется в тексте, а более явное толкование дано в сноске.
translation_notes:
  register: Современный литературный русский язык; тон срочной, почтительной мольбы. Сохранён резкий телесный образ оригинала без архаизмов и конфессионально окрашенной терминологии.
