  text: וַ/יִּֽחַר אַ֧ף יְהוָ֛ה בָּ֖/ם וַ/יֵּלַֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: ru
  text: И воспылал гнев Яхве на них[a], и Он удалился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нос Яхве разгорелся на них» — еврейский оборот, означающий, что гнев Яхве воспылал на них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сочетание חרה с אַף буквально связано с жаром и «носом», но идиоматически означает разгоревшийся гнев. «Воспылал гнев» естественно для литературного русского языка и сохраняет метафору огня.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בָּם
  choice: на них
  rationale: Предлог ב при обозначении гнева указывает на тех, на кого он направлен; оборот «гнев ... на них» нормативен и естествен по-русски.
- source_word: וַיֵּלַךְ
  choice: Он удалился
  rationale: В контексте הלך обозначает уход Яхве после речи. «Удалился» кратко и достойно передаёт это действие, не добавляя причины или способа ухода.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Антропоморфный язык выражения חרה אף
  choice: идиоматическое «воспылал гнев» с пояснением буквального образа в сноске
  alternative: буквальное «разгорелся нос»; нейтральное «Яхве разгневался»
  rationale: Так сохраняется метафора жара и сила высказывания, но русский текст остаётся понятным; буквальный образ отмечен без навязывания богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «И» сохраняет повествовательную последовательность двух еврейских форм с вау; местоимение «Он» написано с прописной буквы как издательская норма почтительного регистра.
