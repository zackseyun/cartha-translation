  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: ru
  text: Всякий, кто прикоснётся к умершему — к телу умершего человека — и не очистится, оскверняет скинию Яхве. Такой человек будет отсечён от Израиля. Поскольку его не окропили водой для очищения[a], он останется нечистым; его нечистота всё ещё на нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вода нечистоты»; то есть вода, предназначенная для удаления нечистоты, возникшей от соприкосновения с умершим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: кто прикоснётся к умершему
  rationale: Причастие от נגע обозначает физическое соприкосновение; «прикоснётся» прямо и естественно передаёт смысл. Следующая фраза уточняет, что речь о человеческом теле.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: к телу человека, который умер
  rationale: В контексте осквернения от мёртвого נֶפֶשׁ обозначает умершего человека, конкретно его тело; אָדָם употреблено в общем значении «человек».
- source_word: יִתְחַטָּא
  choice: очистится
  rationale: Hitpael глагола חטא здесь относится к обрядовому очищению, а не к нравственному покаянию.
- source_word: מִשְׁכַּן יְהוָה
  choice: скинию Яхве
  rationale: מִשְׁכָּן — священное жилище, скиния; личное имя יהוה передано как «Яхве».
- source_word: טִמֵּא
  choice: оскверняет
  rationale: Порода piel выражает причинение ритуального осквернения святилищу; русское настоящее время естественно передаёт правовое следствие поступка.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: Такой человек будет истреблён
  rationale: נֶפֶשׁ означает здесь отдельного человека. «Будет истреблён» сохраняет традиционную формулу санкции, не уточняя её спорный механизм.
- source_word: מִיִּשְׂרָאֵל
  choice: из среды Израиля
  rationale: Передаёт отделение человека от народа и естественно звучит в формуле санкции.
- source_word: מֵי נִדָּה
  choice: очистительная вода
  rationale: Буквально «вода нечистоты/для удаления нечистоты»; функциональное русское обозначение ясно указывает на воду, применяемую для очищения от трупной нечистоты. Буквальная форма отмечена в сноске.
- source_word: זֹרַק עָלָיו
  choice: не была окроплена на него
  rationale: Глагол обозначает ритуальное окропление; пассивная конструкция соответствует форме и смыслу еврейского текста.
- source_word: טָמֵא יִהְיֶה
  choice: он останется нечистым
  rationale: В данном контексте выражение описывает продолжающееся состояние ритуальной нечистоты, что подтверждает следующая фраза.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: его нечистота всё ещё на нём
  rationale: Сохранены значение продолжительности עוֹד и пространственная метафора предлога בְּ.
theological_decisions:
- issue: Смысл санкции וְנִכְרְתָה
  choice: Сохранить формулу «будет истреблён из среды Израиля», не определяя способ наказания.
  alternative: «будет предан смерти» или «будет исключён из общины»
  rationale: Еврейская формула имеет серьёзный заветно-правовой смысл, но этот стих не устанавливает однозначно, означает ли она непосредственную смерть, Божий суд или исключение.
- issue: Характер нечистоты
  choice: Передать חטא, טמא и טֻמְאָה как обрядовое очищение и нечистоту.
  alternative: Истолковать их как нравственный грех и прощение.
  rationale: Контекст главы и упоминание окропления специальной водой ясно относятся к ритуальному состоянию после прикосновения к мёртвому.
- issue: Связь личной нечистоты со скинией
  choice: Сохранить прямое утверждение, что неочистившийся человек оскверняет скинию Яхве.
  alternative: Смягчить до «может осквернить» или связать осквернение только с входом в скинию.
  rationale: В тексте нет условного оттенка и здесь не упоминается вход в святилище; добавлять такое ограничение не следует.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и культового контекста. Термины «скиния», «оскверняет», «нечистота» сохранены как понятные библейско-ритуальные обозначения; синтаксис упрощён умеренно, без устранения исходного уточняющего приложения и повторов.
