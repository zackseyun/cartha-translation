base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: ru
  text: Тот, кто сжигает её, должен выстирать свою одежду в воде и омыть своё тело водой[a]; он будет нечист до вечера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально оба раза: «в воде»; предлог также можно передать как «водой».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «нечист» означает ритуальную нечистоту, а не обязательно нравственную вину.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: тот, кто сжигал её
  rationale: Субстантивированное причастие обозначает исполнителя сожжения; прошедший вид естественно соотносит предписание с совершённым действием. Женское «её» сохраняет отсылку к тёлке.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: пусть выстирает свою одежду
  rationale: Имперфект в законодательном контексте передаёт предписание. «Выстирает» точно выражает стирку одежды и отличает כבס от омовения тела.
- source_word: בַּמַּיִם
  choice: в воде / водой
  rationale: Предлог ב допускает контекстуальную передачу местом или средством. По-русски «выстирать в воде» и «омыть водой» звучит естественно, при этом повтор воды сохранён.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: и омоет своё тело
  rationale: בשר в данном контексте означает тело человека, а רחץ — его ритуальное омовение; «омоет» сохраняет отличие от стирки одежды.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: он будет нечист до вечера
  rationale: Фраза сообщает о сохраняющемся статусе ритуальной нечистоты вплоть до вечера, не уточняя его как нравственную вину.
theological_decisions:
- issue: Значение טמא в священническом законодательстве
  choice: нечист
  alternative: ритуально нечист
  rationale: Краткое традиционное соответствие сохраняет терминологию оригинала; сноска поясняет, что речь идёт о ритуальном статусе, а не обязательно о нравственной виновности.
- issue: Соотношение предписания и последующего статуса
  choice: пусть выстирает… и омоет…; он будет нечист
  alternative: должен выстирать… и омыть… и останется нечист
  rationale: Такая конструкция различает обязательные действия и констатацию нечистоты до вечера, не добавляя к тексту явного «останется».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным оттенком, уместным для законодательного библейского текста. Формулировка сохраняет юридическую последовательность и лексическое различие между стиркой одежды и омовением тела.
