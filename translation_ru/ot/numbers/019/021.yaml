source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: ru
  text: 'И это будет для них постановлением на все времена: тот, кто кропит очистительной водой[a], должен выстирать свою одежду, а тот, кто прикоснётся к очистительной воде, будет нечист до вечера.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «водой нечистоты»; возможный перевод: «водой для очищения от нечистоты». Традиционно также: «водой отделения».'
    reason: Еврейское מֵי הַנִּדָּה допускает буквальную передачу «вода нечистоты», но в данном контексте обозначает воду, применяемую для очищения от ритуальной нечистоты.
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: И это будет для них постановлением на все времена
  rationale: Женская форма глагола соотносится с подразумеваемым постановлением; «на все времена» естественно передаёт длительную обязательность עוֹלָם в законодательном контексте, не внося отвлечённого понятия метафизической вечности.
- source_word: וּמַזֵּה
  choice: тот, кто кропит
  rationale: Причастие употреблено как существительное и обозначает совершающего ритуальное окропление. «Кропит» кратко и точно передаёт культовое действие.
- source_word: מֵי הַנִּדָּה
  choice: очистительная вода
  rationale: В контексте Чисел 19 это специально приготовленная вода для очищения от ритуальной нечистоты. Выражение передано понятно по-русски, а буквальная неоднозначность еврейского сочетания сохранена в сноске.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: Форма выражает предписание; «выстирать одежду» естественно передаёт обычное значение כּבס применительно к одежде.
- source_word: וְהַנֹּגֵעַ בְּמֵי הַנִּדָּה
  choice: а тот, кто прикоснётся к очистительной воде
  rationale: Причастная конструкция параллельна предыдущей; совершенный вид в русском естественно выражает отдельный случай прикосновения, предусмотренный постановлением.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: будет нечист до вечера
  rationale: «Нечист» сохраняет специальную категорию ритуальной, а не нравственной нечистоты; «до вечера» — естественное русское выражение временного предела.
theological_decisions:
- issue: Характер нечистоты
  choice: Передать יטמא словом «нечист» в ритуально-обрядовом смысле
  alternative: Истолковать как нравственную вину или греховность
  rationale: Контекст главы регулирует обрядовую нечистоту после соприкосновения со смертью; стих не утверждает нравственной виновности человека.
- issue: Значение מֵי הַנִּדָּה
  choice: В основном тексте — «очистительная вода», с буквальным значением в сноске
  alternative: «вода нечистоты» или традиционное «вода отделения»
  rationale: Контекст ясно указывает на назначение воды для обряда очищения, однако еврейское выражение буквально связано с нечистотой; сноска сохраняет эту лексическую напряжённость без затемнения основного текста.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной законодательной интонацией. Культовые термины переданы последовательно, без архаизации и без смешения ритуальной нечистоты с нравственной виной.
