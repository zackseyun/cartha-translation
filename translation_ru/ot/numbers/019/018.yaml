  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: ru
  text: Затем ритуально чистый мужчина пусть возьмёт иссоп, окунёт его в воду и окропит шатёр, всю утварь, всех, кто там был, а также того, кто прикоснулся к кости, к телу убитого[a], к умершему или к могиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово означает убитого, то есть погибшего насильственной смертью, в отличие от более общего слова «умерший» далее.
    reason: Сохраняет лексическое различие между חָלָל и מֵת.
lexical_decisions:
- source_word: אֵזוֹב
  choice: иссоп
  rationale: Традиционное и точное обозначение растения, применявшегося в обрядах очищения.
- source_word: בַּמַּיִם
  choice: в эту воду
  rationale: Определённая форма указывает на уже упомянутую воду для очищения; указательное «эту» естественно передаёт контекстуальную определённость по-русски.
- source_word: אִישׁ טָהוֹר
  choice: мужчина, который чист
  rationale: Сохраняется мужской род единственного числа и терминология ритуальной чистоты; придаточная конструкция звучит естественнее, чем «чистый мужчина», которое может быть понято как характеристика опрятности или нравственности.
- source_word: וְהִזָּה
  choice: окропит
  rationale: Устоявшийся русский глагол для ритуального нанесения жидкости каплями.
- source_word: הָאֹהֶל
  choice: шатёр
  rationale: В данном контексте речь идёт о шатре, где находился умерший, а не о скинии.
- source_word: הַכֵּלִים
  choice: всю утварь
  rationale: Собирательное «утварь» естественно охватывает сосуды, принадлежности и прочие предметы, обозначаемые широким словом כְּלִי.
- source_word: הַנְּפָשׁוֹת
  choice: всех, кто там был
  rationale: Здесь נֶפֶשׁ означает людей, а не «души»; контекстуальная передача избегает ложного антропологического оттенка.
- source_word: הַנֹּגֵעַ
  choice: того, кто прикоснулся
  rationale: Передаёт субстантивированное причастие как конкретного человека, ставшего нечистым от прикосновения.
- source_word: בָּעֶצֶם
  choice: к кости
  rationale: Сохраняется единственное число; по контексту подразумевается человеческая кость.
- source_word: בֶחָלָל
  choice: к телу убитого
  rationale: חָלָל обозначает человека, погибшего насильственной смертью; слово «тело» ясно показывает, что речь идёт об источнике трупной нечистоты.
- source_word: בַמֵּת
  choice: к умершему
  rationale: Общий термин для умершего сохранён отдельно от более узкого חָלָל — убитого.
- source_word: בַקָּבֶר
  choice: к могиле
  rationale: Прямой и естественный современный эквивалент места погребения.
theological_decisions:
- issue: Терминология ритуальной чистоты
  choice: чист
  alternative: чист ритуально; чистый
  rationale: Слово относится к обрядовому состоянию, а не к нравственной безупречности; это пояснено в сноске без внесения толкования в основной текст.
- issue: Мужской род в אִישׁ
  choice: мужчина
  alternative: человек
  rationale: Еврейский текст прямо употребляет существительное мужского рода единственного числа; перевод сохраняет эту грамматическую и лексическую особенность.
- issue: Различение חָלָל и מֵת
  choice: тело убитого / умерший
  alternative: убитый / мёртвый; труп / умерший
  rationale: Перевод сохраняет смысловое различие между погибшим насильственной смертью и умершим вообще, не превращая его в доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясного перечисления, однако порядок действий и все источники ритуальной нечистоты сохранены.
