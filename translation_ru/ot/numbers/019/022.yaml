  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: ru
  text: Всё, к чему прикоснётся нечистый человек, станет нечистым; и человек[a], который прикоснётся к нему, будет нечист до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа»; еврейское слово нефеш здесь означает человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Всё, к чему
  rationale: Сочетание כֹל с относительной частицей אֲשֶׁר выражает всеохватность; такая формулировка естественна по-русски и сохраняет относительную конструкцию.
- source_word: יִגַּע בּוֹ
  choice: прикоснётся
  rationale: Глагол נגע с предлогом ב обозначает прикосновение или вступление в контакт; «прикоснётся к» точно передаёт смысл в контексте обрядовой нечистоты.
- source_word: הַטָּמֵא
  choice: нечистый человек
  rationale: Прилагательное употреблено субстантивированно и обозначает человека, находящегося в состоянии обрядовой нечистоты; добавление «человек» делает смысл ясным.
- source_word: יִטְמָא
  choice: станет нечистым
  rationale: Глагольная форма указывает на наступление состояния нечистоты вследствие контакта.
- source_word: וְהַנֶּפֶשׁ
  choice: и тот
  rationale: נֶפֶשׁ в данном правовом контексте означает человека как целое, а не отделённую от тела «душу»; местоименная передача избегает тяжеловесного повтора.
- source_word: הַנֹּגַעַת
  choice: кто прикоснётся к этому
  rationale: Причастие согласовано с נֶפֶשׁ и характеризует человека через прикосновение. Объект во второй части подразумевается контекстом; «к этому» естественно отсылает к тому, что стало нечистым.
- source_word: תִּטְמָא עַד הָעָרֶב
  choice: будет нечист до вечера
  rationale: Передаёт состояние обрядовой нечистоты и его прямо указанную временную границу.
theological_decisions:
- issue: Характер нечистоты
  choice: Передать טמא словами «нечистый / нечист»
  alternative: «осквернённый» или формулировка, подразумевающая греховность
  rationale: Контекст говорит о передаваемой через соприкосновение обрядовой нечистоте, а не утверждает нравственную вину.
- issue: Значение נֶפֶשׁ
  choice: Понимать как обозначение человека в целом
  alternative: «душа»
  rationale: В правовых текстах נֶפֶשׁ часто означает человека или лицо; буквальное «душа» здесь могло бы внести не заявленное текстом противопоставление души и тела.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Терминология сохраняет правовой и обрядовый характер стиха без морализирующего оттенка; точка с запятой подчёркивает две последовательные ступени передачи нечистоты.
