base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: ru
  text: 'Вот закон: если человек умрёт в шатре, то всякий, кто войдёт в шатёр, и всё, что находится в шатре[a], будет нечисто семь дней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение может относиться прежде всего к людям, находящимся в шатре: оно стоит параллельно с «всякий, кто войдёт в шатёр», а глагол употреблён в единственном числе. Однако само выражение шире; об открытых сосудах отдельно говорится в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Вот закон
  rationale: Формула естественно вводит обязательное установление; «закон» передаёт юридико-обрядовый характер תּוֹרָה в данном контексте.
- source_word: אָדָם כִּי יָמוּת
  choice: если человек умрёт
  rationale: אָדָם употреблено обобщённо и обозначает человека независимо от пола; כִּי вводит типичный случай в правовом предписании, чему в русском соответствует «если».
- source_word: בְּאֹהֶל
  choice: в шатре
  rationale: Первое упоминание без определённого артикля вводит место действия; в русском отсутствие артикля передаётся контекстуально.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: всякий, кто войдёт в этот шатёр
  rationale: Субстантивированное причастие с כָּל имеет обобщающий смысл. Указательное «этот» естественно обозначает уже упомянутый шатёр и отражает определённый артикль.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: и всякий, кто находится в шатре
  rationale: Параллелизм с входящим и форма сказуемого допускают личное понимание, однако אֲשֶׁר само по себе может охватывать также предметы; неоднозначность отмечена в сноске.
- source_word: יִטְמָא
  choice: будет нечист
  rationale: Это ясная и традиционно понятная формулировка состояния ритуальной нечистоты; будущее время естественно выражает последствие в русском условном установлении.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое обозначение продолжительности состояния нечистоты.
theological_decisions:
- issue: Охватывает ли וְכָל אֲשֶׁר בָּאֹהֶל только людей или также вещи
  choice: В основном тексте — «всякий, кто находится в шатре»
  alternative: «всё, что находится в шатре»
  rationale: Непосредственный параллелизм с «всяким, кто войдёт» и форма יִטְמָא поддерживают отнесение к людям, но широкое значение אֲשֶׁר не позволяет исключить предметное прочтение; оно сохранено в сноске, тем более что сосуды отдельно рассматриваются в следующем стихе.
translation_notes:
  register: Современный литературный русский с ясным, сдержанным законодательным тоном. «Шатёр» выбран как естественное библейское обозначение אֹהֶל; синтаксис сохраняет структуру казуистического предписания без излишней архаизации.
