  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: ru
  text: Затем священник возьмёт кедровую древесину, иссоп и алую нить и бросит их в огонь, в котором сжигают корову[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телицу».'
    reason: Слово פָּרָה обозначает самку крупного рогатого скота; традиционный перевод этого места часто использует слово «телица».
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... возьмёт
  rationale: Сочетание waw с формой qatal продолжает последовательность предписанных обрядовых действий; русское будущее время естественно передаёт предписание.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Стандартное соответствие в контексте священнослужения; определённость понятна из контекста.
- source_word: עֵץ אֶרֶז
  choice: кедровую древесину
  rationale: Сочетание обозначает древесину кедра. Такой перевод точнее, чем «кедровое дерево», которое по-русски обычно понимается как целое растущее дерево.
- source_word: וְאֵזוֹב
  choice: иссоп
  rationale: Традиционное и общепринятое соответствие; точное ботаническое определение растения остаётся спорным.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: багряную нить
  rationale: Выражение обозначает материал, окрашенный стойкой багряной краской животного происхождения; «багряная нить» ясно называет ритуальный предмет и не буквализирует компонент «червь».
- source_word: וְהִשְׁלִיךְ
  choice: и бросит
  rationale: Форма Hiphil глагола שלך означает «бросить, кинуть»; выбран современный нейтральный глагол.
- source_word: אֶל תּוֹךְ
  choice: в самый огонь
  rationale: Передаёт направленность внутрь, в середину происходящего сожжения, естественным современным русским выражением.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: огонь, где сжигают корову
  rationale: Переформулировка естественно передаёт процесс сожжения коровы и избегает двусмысленного оборота «в середину горящей коровы», который мог бы означать внутрь тела животного.
theological_decisions:
- issue: Передача פָּרָה в обряде очищения с красной коровой
  choice: корова
  alternative: телица
  rationale: Еврейское слово обозначает самку крупного рогатого скота и само по себе не требует подчёркивать её возраст. «Корова» — ясное современное соответствие; знакомый по традиции вариант «телица» сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядового предписания. Будущее время передаёт нормативную последовательность; добавление «всё это» естественно объединяет перечисленные предметы как подразумеваемое дополнение глагола.
