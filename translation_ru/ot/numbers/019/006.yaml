revisions:
- from: Затем священник возьмёт кедровую древесину, иссоп и багряную нить и бросит всё это в самый огонь, где сжигают корову[a].
  to: Затем священник возьмёт кедровую древесину, иссоп и алую нить и бросит их в огонь, в котором сжигают корову[a].
  rationale: 'Уточнён образ места действия: предметы бросают в огонь, связанный со сожжением коровы, без добавления невыраженных деталей. «Их» прямо отсылает к трём перечисленным предметам. Заменено «багряную» на более обычное в современном русском «алую», соответствующее scarlet.'
