  terminology: «ГОСПОДЬ» с примечанием о יהוה приемлемо. «Безупречную, без всякого изъяна» хорошо сохраняет два близких, но самостоятельных определения תְּמִימָה и אֵין בָּהּ מוּם. «Ярмо» точно передаёт עֹל.
