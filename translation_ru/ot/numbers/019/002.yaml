  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: ru
  text: '«Вот установление закона, которое повелел ГОСПОДЬ[a]: „Скажи сынам Израиля: пусть приведут тебе красную телицу — безупречную, без всякого изъяна, на которую никогда не возлагали ярма“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит имя יהוה (ЙХВХ), обычно передаваемое как «ГОСПОДЬ».
    reason: Уточняет источник традиционной передачи Божьего имени.
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: установление закона
  rationale: Передаёт сочетание חֻקָּה («установление, обязательное предписание») и תּוֹרָה («закон, наставление») без сведения обоих слов к одному понятию.
- source_word: יְהוָה
  choice: ГОСПОДЬ[a]
  rationale: Традиционная и понятная русская передача тетраграмматона; примечание сохраняет сведения о личном имени в еврейском тексте.
- source_word: פָרָה אֲדֻמָּה
  choice: рыжую[b] корову
  rationale: פָרָה обозначает корову, а אֲדֻמָּה — красную или рыжую по масти; «рыжая» естественно звучит применительно к животному.
- source_word: תְּמִימָה אֲשֶׁר אֵין בָּהּ מוּם
  choice: безупречную, без всякого изъяна
  rationale: 'Сохраняется смысловое усиление двух еврейских характеристик: цельность/безупречность и отсутствие физического порока.'
- source_word: אֲשֶׁר לֹא עָלָה עָלֶיהָ עֹל
  choice: на которую никогда не возлагали ярма
  rationale: Естественная русская передача идиомы о животном, ещё не использовавшемся под ярмом.
theological_decisions:
- issue: Передача тетраграмматона
  choice: ГОСПОДЬ с примечанием о יהוה
  alternative: Яхве
  rationale: Основной текст сохраняет укоренившуюся русскую библейскую форму, а примечание не скрывает, что в оригинале стоит личное имя Бога.
- issue: Значение תְּמִימָה в ритуальном предписании
  choice: безупречную
  alternative: целую / совершенную
  rationale: «Безупречную» естественно для современного русского и не вносит идеи нравственного совершенства животного; последующая фраза сохраняет отдельное указание на отсутствие физического изъяна.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис упрощён до естественной прямой речи, при этом сохранены обязательность предписания, двойная характеристика пригодности животного и отсутствие прежнего ярма.
