  source_fidelity: 'В целом переданы все смысловые элементы стиха: установление/предписание закона, повеление, обращение к сынам Израиля, красная телица, её цельность, отсутствие порока и неиспользованность под ярмом. Однако פָרָה — самка крупного рогатого скота, обычно «телица» в данном ритуальном контексте; «корова» не исключено лексически, но менее точно и может подразумевать взрослое животное. «Рыжая» с примечанием допустимо, но основной текст «красную» точнее следует אֲדֻמָּה и традиционному обозначению животного.'
