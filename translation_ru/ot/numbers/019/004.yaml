  source_fidelity: 'В целом смысл передан верно: последовательное предписание, Елеазар как священник, частичное взятие крови пальцем, семикратное кропление и направленность к передней стороне шатра сохранены. Однако «покропит её кровью в сторону» синтаксически не вполне ясно связывает средство действия и его направление; более ясная конструкция лучше передаёт еврейское повторение «из её крови».'
