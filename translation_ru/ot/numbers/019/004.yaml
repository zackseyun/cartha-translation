base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: ru
  text: Затем священник Елеазар возьмёт пальцем часть её крови и семь раз покропит этой кровью по направлению к передней стороне шатра встречи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед шатром встречи». Еврейское выражение указывает на направление к передней стороне шатра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... возьмёт
  rationale: В последовательности обрядовых предписаний форма с וְ передаёт очередной шаг; «затем» естественно выражает эту связь по-русски.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священник Елеазар
  rationale: Имя передано принятой русской библейской формой, а титул — естественным русским приложением.
- source_word: מִדָּמָהּ
  choice: немного её крови / её кровью
  rationale: 'Предлог מִן при первом употреблении имеет частичное значение: берётся не вся кровь. Повтор слова «кровь» сохраняет акцент еврейского текста, а творительный падеж при «покропит» естественно передаёт вещество, используемое в действии.'
- source_word: בְּאֶצְבָּעוֹ
  choice: пальцем
  rationale: Предлог בְּ здесь имеет инструментальное значение; русское «пальцем» точно и естественно передаёт способ действия, не уточняя без необходимости, была ли кровь на пальце.
- source_word: וְהִזָּה
  choice: и ... покропит
  rationale: Глагол נזה обозначает ритуальное кропление; «покропит» сохраняет культовый оттенок и хорошо сочетается с семикратным действием.
- source_word: אֶל נֹכַח פְּנֵי
  choice: в сторону передней части
  rationale: Сочетание указывает на направленность к лицевой, передней стороне шатра, а не на действие внутри него.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквальная и понятная передача названия святилища; она точнее, чем более интерпретирующая «скиния».
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямая передача числового выражения.
