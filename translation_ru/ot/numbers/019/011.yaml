  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: ru
  text: Кто прикоснётся к телу любого умершего человека, тот будет нечист семь дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Кто прикоснётся
  rationale: Субстантивированное причастие с артиклем имеет обобщённое значение. Такая формулировка естественно передаёт общее условие правовой нормы.
- source_word: בְּמֵת
  choice: к телу умершего человека
  rationale: מֵת обозначает умершего человека или мёртвое тело. В данном контексте явное упоминание тела ясно передаёт физическое прикосновение и звучит по-русски естественно.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: человека
  rationale: Сочетание уточняет, что речь идёт о любом человеческом умершем, а не о мёртвом животном. Обобщённость конструкции передана формой условного предложения; примечание сохраняет более буквальное значение.
- source_word: וְטָמֵא
  choice: тот будет нечист
  rationale: Перфект с союзом выражает наступающее вследствие прикосновения состояние. Будущее время сохраняет нормативно-результативный смысл.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое и естественное обозначение продолжительности ритуальной нечистоты.
theological_decisions:
- issue: Значение אָדָם в обобщённом правовом контексте
  choice: человека
  alternative: мужчины
  rationale: Здесь אָדָם обозначает человека как представителя человечества, а не лицо мужского пола; перевод не должен искусственно сужать сферу действия предписания.
- issue: Характер нечистоты
  choice: будет нечист
  alternative: осквернится
  rationale: Текст констатирует состояние ритуальной нечистоты вследствие соприкосновения. «Будет нечист» не привносит оттенка нравственной вины, возможного у глагола «осквернится».
translation_notes:
  register: Современный литературный русский язык с краткой, ясной синтаксической формой правового предписания. Сохранена библейская категория «нечист», относящаяся здесь к ритуальному состоянию.
