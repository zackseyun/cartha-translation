base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: ru
  text: Пусть ритуально чистый человек соберёт пепел телицы и положит его вне стана, в чистом месте. Этот пепел следует хранить для общины сынов Израиля, для воды очищения[a]. Это — жертва за грех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для воды нечистоты»; возможно также: «для воды, удаляющей нечистоту».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Это — очистительная жертва». Еврейское חַטָּאת может означать жертву за грех, а в священнических текстах — жертву, совершаемую для очищения.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: человек, чистый по обряду
  rationale: Сохраняет единственное число אִישׁ и явно передаёт ритуальный смысл טָהוֹר, не подразумевая нравственную безупречность.
- source_word: וְאָסַף
  choice: пусть… соберёт
  rationale: Продолжает последовательность обрядовых предписаний; русская конструкция естественно передаёт предписывающую силу формы.
- source_word: אֵפֶר הַפָּרָה
  choice: пепел телицы
  rationale: אֵפֶר — собирательное «пепел», а פָּרָה обозначает самку крупного рогатого скота; в данном контексте уместно традиционное «телица».
- source_word: וְהִנִּיחַ
  choice: и положит
  rationale: Прямо и естественно передаёт значение «поместить, положить».
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: вне стана
  rationale: Фраза имеет локативный смысл; «стан» сохраняет достоинство и устойчивую лексику Пятикнижия.
- source_word: בְּמָקוֹם טָהוֹר
  choice: на чистом месте
  rationale: В контексте ясно, что речь идёт об обрядовой чистоте; краткая формулировка не перегружает текст.
- source_word: וְהָיְתָה … לְמִשְׁמֶרֶת
  choice: этот пепел следует хранить
  rationale: Женская форма глагола относится к собирательно понимаемому пеплу; русская перестройка ясно выражает назначение хранения.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: для общины сынов Израиля
  rationale: «Община» естественно передаёт עֲדָה в законодательном контексте, а «сыны Израиля» сохраняет форму исходного выражения.
- source_word: לְמֵי נִדָּה
  choice: чтобы приготовлять воду для очищения
  rationale: Функционально передаёт назначение воды в обряде удаления нечистоты. Буквальная связь с «нечистотой» сохранена в примечании.
- source_word: חַטָּאת הִוא
  choice: это — жертва за грех
  rationale: Передаёт традиционное и лексически обоснованное значение חַטָּאת; очистительное понимание отмечено отдельно.
theological_decisions:
- issue: Значение חַטָּאת в очистительном обряде
  choice: это — жертва за грех
  alternative: это — очистительная жертва
  rationale: חַטָּאת может обозначать как жертву за грех, так и жертву с очистительной функцией. Основной текст сохраняет традиционный эквивалент, а примечание — существенную для данного контекста альтернативу.
- issue: Значение לְמֵי נִדָּה
  choice: вода для очищения
  alternative: вода от нечистоты / вода для удаления нечистоты
  rationale: Оборот обозначает воду, применяемую в связи с ритуальной нечистотой. Плавный основной перевод выражает функцию, не скрывая буквальной образности, указанной в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («стан», «сыны Израиля»). Синтаксис упрощён для ясности, но обрядовая точность и неоднозначность ключевых терминов сохранены.
