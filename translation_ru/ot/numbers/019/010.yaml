  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: ru
  text: Тот, кто собирает пепел телицы, должен выстирать свою одежду и будет нечист до вечера. Это будет постановлением на все времена[b] для сынов Израиля[a] и для пришельца, живущего среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для израильтян»; буквально: «для сынов Израиля». Это выражение обозначает народ Израиля в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вечным постановлением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: тот, кто собирает
  rationale: Субстантивированное причастие qal обозначает человека, выполняющего действие; такой оборот естественен в современном русском и сохраняет причастное значение.
- source_word: אֵפֶר הַפָּרָה
  choice: пепел телицы
  rationale: אֵפֶר имеет собирательное значение «пепел», а פָּרָה обозначает самку крупного рогатого скота; «телица» уместно и точно в контексте данного обряда.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: должен выстирать свою одежду
  rationale: В предписаниях о ритуальной чистоте глагол означает стирку или омовение одежды. «Должен» ясно передаёт обязательную силу нормы без архаичного оборота.
- source_word: וְטָמֵא
  choice: и будет нечист
  rationale: Передаёт состояние ритуальной нечистоты, не придавая ему смысла нравственной порочности.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Естественный русский эквивалент временного предела, выраженного еврейским оборотом.
- source_word: וְהָיְתָה
  choice: это будет
  rationale: Форма женского рода указывает на подразумеваемое постановление или предписание; указательное «это» делает связь ясной по-русски.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохранена форма корпоративного заветного выражения בְּנֵי יִשְׂרָאֵל, не исключающего народ в целом.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: и для пришельца, живущего среди них
  rationale: גֵּר — не коренной житель, постоянно пребывающий в обществе Израиля. «Пришелец» сохраняет библейско-правовой оттенок, а «живущий» передаёт причастие הַגָּר без неестественного повтора.
- source_word: לְחֻקַּת עוֹלָם
  choice: постановлением на все времена
  rationale: חֻקָּה обозначает установленную норму, а עוֹלָם в правовой формуле — её непреходящую, постоянную силу. Выражение понятно современному читателю и сохраняет временную открытость формулы.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Буквальная корпоративная формула сохранена как «сыны Израиля»; примечание поясняет, что речь идёт о народе в целом, не сводя выражение лишь к мужчинам.
- issue: Характер нечистоты
  choice: нечист
  alternative: ритуально нечист; осквернён
  rationale: Краткое «нечист» соответствует языку священнического законодательства и не превращает ритуальный статус в нравственную оценку.
- issue: Продолжительность постановления в формуле עוֹלָם
  choice: на все времена
  alternative: вечным; постоянным
  rationale: Формулировка сохраняет сильное значение длительности, но не добавляет богословского уточнения о пределах действия постановления, отсутствующего в самом стихе.
translation_notes:
  register: Современный литературный русский с умеренно торжественным тоном, подходящим для правового текста Пятикнижия. Синтаксис сделан ясным без устранения повторов и смысловой напряжённости оригинала; традиционные слова «телица», «нечист» и «пришелец» сохранены там, где они точно передают ритуально-правовой контекст.
