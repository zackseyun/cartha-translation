  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: ru
  text: Отдайте её священнику Елеазару; он выведет её за пределы стана, и там её заколют в его присутствии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст не называет совершающего заклание прямо. Возможно также: «и он заколет её перед ним», если подразумеваемым подлежащим остаётся Елеазар.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם אֹתָהּ
  choice: Отдайте её
  rationale: Форма во множественном числе в контексте предписания передана естественным русским повелительным наклонением. Местоимение женского рода указывает на красную корову, названную ранее.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: священнику Елеазару
  rationale: Естественный русский порядок слов сохраняет имя и служебный титул.
- source_word: וְהוֹצִיא אֹתָהּ
  choice: он выведет её
  rationale: Hiphil глагола יצא имеет каузативное значение «вывести». Мужской род подлежащего естественно соотносится с Елеазаром.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Передаёт направленность движения наружу и сохраняет традиционно-библейское, но понятное современному читателю слово «стан».
- source_word: וְשָׁחַט אֹתָהּ
  choice: её заколют
  rationale: Неопределённо-личная конструкция не называет совершающего заклание и потому не устраняет неоднозначность подразумеваемого подлежащего еврейского глагола.
- source_word: לְפָנָיו
  choice: в его присутствии
  rationale: Естественно передаёт значение «перед ним, у него на глазах» и ясно обозначает присутствие Елеазара при заклании.
theological_decisions:
- issue: Кто совершает заклание в последней части стиха
  choice: 'Исполнитель не назван: «её заколют в его присутствии».'
  alternative: «Он заколет её перед ним», если подразумеваемым подлежащим считать Елеазара.
  rationale: В еврейском тексте глагол стоит в 3-м лице единственного числа без выраженного подлежащего. Связь с фразой «в его присутствии» допускает понимание, при котором Елеазар наблюдает за действием другого человека; однако грамматически возможно продолжение прежнего подлежащего. Основной текст не разрешает эту неоднозначность категорически.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. «Стан» сохранён как понятный термин Пятикнижия; синтаксис сделан плавным и предписывающим без излишней архаизации.
