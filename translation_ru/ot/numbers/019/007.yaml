base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: ru
  text: Затем священник должен выстирать свою одежду и омыть тело водой; после этого он может войти в стан, но будет нечист до вечера.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Нечист» здесь означает обрядовую нечистоту, а не обязательно личный грех или нравственную вину.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: пусть вымоет свою одежду
  rationale: Пиэль כבס обозначает стирку одежды; конструкция с «пусть» естественно передаёт предписание в русском языке, а собирательное «одежду» соответствует בגדיו.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: омоет своё тело водой
  rationale: בשר в данном обрядовом контексте означает тело человека, а не «плоть» в богословском смысле; «омоет» сохраняет формальный регистр и отличает действие от стирки одежды.
- source_word: וְאַחַר
  choice: после чего
  rationale: Передаёт последовательность действий без излишней буквальности.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: он может войти в стан
  rationale: Имперфект после предписанного омовения допускает понимание последующего разрешённого возвращения; «может войти» сохраняет эту модальную возможность.
- source_word: וְטָמֵא הַכֹּהֵן עַד־הָעָרֶב
  choice: но священник будет нечист до вечера
  rationale: «Будет нечист» ясно обозначает продолжающееся до вечера состояние; «но» передаёт смысловое противопоставление между разрешением войти и сохраняющейся нечистотой.
theological_decisions:
- issue: Характер нечистоты
  choice: обрядовая нечистота без указания на личный грех
  alternative: нравственная нечистота или виновность
  rationale: В контексте Чисел 19 טמא обозначает временный обрядовый статус. Основной текст сохраняет традиционный термин «нечист», а примечание предотвращает его ошибочное нравственное истолкование.
- issue: Модальность יָבֹא
  choice: разрешение войти после омовения
  alternative: простое будущее «войдёт» или предписание «пусть войдёт»
  rationale: В последовательности обрядовых требований форма естественно допускает разрешительное понимание, однако не отменяет сохраняющейся до вечера нечистоты.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром законодательного текста. «Стан» сохраняет уместный для повествования о странствующем Израиле историко-библейский оттенок; синтаксис остаётся ясным для современного читателя.
