base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: ru
  text: Для нечистого пусть возьмут немного праха от сожжения очистительной жертвы[a] и нальют на него живой воды[b] в сосуд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиционному переводу: «жертвы за грех». Еврейское слово חטאת в священнических текстах может обозначать жертву за грех или, по её ритуальной функции, очистительную жертву.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живой воды», то есть свежей воды из источника, в том числе проточной.'
    reason: lexical_clarification
lexical_decisions:
- source_word: לָקְחוּ
  choice: пусть возьмут
  rationale: Форма множественного числа в законодательном предписании передаёт обязательное действие; русская конструкция с «пусть» естественна и сохраняет число.
- source_word: לַטָּמֵא
  choice: для нечистого
  rationale: Субстантивированное прилагательное обозначает человека, находящегося в состоянии ритуальной нечистоты; контекст ясно задаёт ритуальное значение.
- source_word: מֵעֲפַר
  choice: немного праха
  rationale: עפר буквально означает «прах, пыль», а מן имеет частичное значение. «Немного праха» сохраняет лексику источника и естественно звучит по-русски.
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: от сожжения очистительной жертвы
  rationale: שׂרפה обозначает сожжение, а חטאת в священническом контексте может называть жертву, служащую очищению. Традиционный вариант отмечен в сноске.
- source_word: וְנָתַן
  choice: и нальют
  rationale: В еврейском тексте после множественного לָקְחוּ неожиданно стоит единственное число с неопределённым исполнителем. По-русски неопределённо-личное множественное «нальют» естественно связывает действия, не устанавливая личность исполнителя.
- source_word: עָלָיו
  choice: на него
  rationale: 'Местоимение мужского рода наиболее естественно относится к עפר («прах»): воду наливают на приготовленный материал.'
- source_word: מַיִם חַיִּים
  choice: живой воды
  rationale: Буквально «живая вода» — вода из свежего или проточного источника. Сохранена исходная образность и более широкая библейская перекличка; смысл пояснён в сноске.
- source_word: אֶל כֶּלִי
  choice: в сосуде
  rationale: Предлог אֶל обычно выражает направление, однако здесь сочетание описывает приготовление смеси в сосуде. Русское «в сосуде» передаёт место результирующего действия, не предполагая, что прах заранее находится вне сосуда.
theological_decisions:
- issue: Передача חטאת в контексте ритуального очищения
  choice: очистительная жертва
  alternative: жертва за грех
  rationale: В данном обряде жертва служит устранению ритуальной нечистоты, поэтому функциональное значение «очистительная жертва» уместно. Традиционное и лексически возможное «жертва за грех» сохранено в сноске.
- issue: Передача выражения מַיִם חַיִּים
  choice: живая вода
  alternative: свежая вода; проточная вода
  rationale: Дословное выражение понятно по-русски, сохраняет библейскую образность и не сужает референцию исключительно до проточной воды. Практический смысл поясняется в сноске.
- issue: Смена числа исполнителя между וְלָקְחוּ и וְנָתַן
  choice: неопределённо-личное множественное в обоих действиях
  alternative: «пусть возьмут… и он нальёт»
  rationale: Еврейская смена с множественного на единственное допускает неопределённого исполнителя. Буквальная смена числа в русском могла бы ошибочно внушить появление нового, конкретного мужчины; выбранная конструкция сохраняет неопределённость агента.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной ритуальной лексикой («прах», «жертва», «сосуд»). Синтаксис предписания сделан ясным для обычного читателя; подлинные лексические и агентные неоднозначности не превращены в конфессиональные толкования.
