revisions:
- from: Пусть он очистит себя ею в третий день и в седьмой день[a] — и будет чист. Если же он не очистит себя в третий день и в седьмой день[b], то не будет чист.
  to: Он должен очиститься ею в третий день и в седьмой день[a] — и будет чист. Если же он не очистится[b] в третий день и в седьмой день, то не будет чист.
  rationale: Исправление заменяет менее естественную и потенциально двусмысленную конструкцию «Пусть он очистит себя» на нормативное «должен очиститься», не внося богословского истолкования и сохраняя различие между обрядовым действием и итоговым статусом. Сноска [b] перенесена к объясняемому глаголу.
