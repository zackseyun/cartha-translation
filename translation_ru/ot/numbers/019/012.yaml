review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: מדובר о предписанном обрядовом очищении на третий и седьмой дни и о результате — состоянии ритуальной чистоты. Однако «Пусть он очистит себя» в современном русском звучит как побудительное обращение и несколько смещает значение хитпаэля; «должен очиститься» естественнее выражает законодательное предписание и прохождение обряда. В условной части сноску о глаголе следует поставить непосредственно у «очистится», а не у временного оборота.'
  naturalness: «Должен очиститься ею» и «не очистится» более естественны для современного литературного русского и для регистра законодательного текста, чем «пусть ... очистит себя». «Будет чист» удачно сохраняет различие между действием очищения и его результатом.
  terminology: Термины «очиститься» и «чист» допустимы при пояснении в сноске, которое прямо указывает на обрядовую, а не нравственную нечистоту. «Вода очищения» в пояснении уместна как обозначение ранее описанного средства обряда.
