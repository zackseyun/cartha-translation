base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: ru
  text: Он должен очиститься ею в третий день и в седьмой день[a] — и будет чист. Если же он не очистится[b] в третий день и в седьмой день, то не будет чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть водой очищения, приготовление которой описано выше в этой главе.
    reason: cross_reference
  - marker: b
    text: 'Или: «не пройдёт очищения». Еврейский глагол здесь означает обрядовое очищение от нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: очистит себя
  rationale: В породе хитпаэль глагол חטא в данном обрядовом контексте означает пройти очищение от ритуальной нечистоты, а не очищение от нравственного греха. Возвратная конструкция передаёт форму еврейского глагола.
- source_word: בּוֹ
  choice: ею
  rationale: Местоимение естественно относится к воде очищения, о которой говорится ранее; женский род русского местоимения ясно поддерживает эту связь, не добавляя пояснения в основной текст.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: в третий день
  rationale: Естественная русская передача временного оборота, сохраняющая установленную последовательность обряда.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: и в седьмой день
  rationale: Сохраняет еврейское соединение и оба требуемых срока очищения.
- source_word: יִטְהָר
  choice: будет чист
  rationale: טהר обозначает наступившее состояние ритуальной чистоты. Такая передача отличает результат от действия יתחטא и не смешивает два разных глагола.
- source_word: וְאִם לֹא
  choice: Если же … не
  rationale: Частица «же» естественно выражает противопоставление в условном предостережении.
- source_word: הוּא
  choice: он
  rationale: Сохраняет явно выраженное местоимение мужского рода; в контексте оно относится к ранее упомянутому нечистому человеку.
theological_decisions:
- issue: Характер очищения в Числах 19
  choice: Передать язык ритуального очищения и состояния чистоты, не вводя понятий нравственного прощения или внутреннего освящения.
  alternative: Использовать обобщённо-духовную формулировку «очистится», не различая обрядовое действие и его результат.
  rationale: Контекст посвящён нечистоте от прикосновения к мёртвому телу и предписанной воде очищения. Еврейские глаголы говорят об обрядовом статусе; более широкое духовное истолкование выходило бы за пределы текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. «Пусть … очистит» естественно передаёт предписывающую форму; «будет чист» сохраняет различие между обрядом очищения и его результатом. Тире подчёркивает следствие, не меняя синтаксической связи.
