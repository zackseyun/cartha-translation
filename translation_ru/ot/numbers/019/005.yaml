base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: ru
  text: 'И пусть он сожжёт корову у него на глазах: её шкуру, её мясо, её кровь вместе с её помётом — всё это пусть сожжёт.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: И пусть сожгут
  rationale: Форма waw + qatal в последовательности обрядовых предписаний передаёт требуемое действие. Неопределённо-личная форма естественна по-русски и согласуется с контекстом, где корову сжигают в присутствии священника.
- source_word: הַפָּרָה
  choice: корову
  rationale: פָּרָה обозначает самку крупного рогатого скота; слово «корова» ясно и современно, тогда как возраст животного здесь самим существительным не подчёркнут.
- source_word: לְעֵינָיו
  choice: у него на глазах
  rationale: Сохраняет наглядность еврейского выражения и естественно передаёт значение «в его присутствии, перед его взором».
- source_word: עֹרָהּ
  choice: её шкуру
  rationale: עוֹר в отношении туши животного естественно переводится как «шкура».
- source_word: בְּשָׂרָהּ
  choice: мясо
  rationale: בָּשָׂר означает плоть или мясо; в перечне частей туши «мясо» звучит естественно и точно.
- source_word: דָּמָהּ
  choice: кровь
  rationale: Прямое соответствие דָּם; принадлежность животному ясна из общего местоимения «её» перед рядом однородных членов.
- source_word: עַל פִּרְשָׁהּ
  choice: вместе с её помётом
  rationale: פֶּרֶשׁ обозначает помёт, испражнения, а עַל в данном перечне выражает присоединение того, что также подлежит сожжению.
- source_word: יִשְׂרֹף
  choice: всё это пусть сожгут
  rationale: Повтор глагола сохранён ради заключительного акцента еврейской фразы; «всё это» естественно подводит итог перечню.
theological_decisions:
- issue: Кто непосредственно сжигает корову
  choice: Неопределённо-личное «пусть сожгут»
  alternative: «пусть он сожжёт»
  rationale: В ближайшем контексте священник наблюдает за сожжением, тогда как исполнители прямо не названы. Русская неопределённо-личная конструкция сохраняет эту контекстуальную неопределённость и не утверждает без необходимости, что сжигает сам священник.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядового предписания. Двоеточие вводит подробный перечень, тире подчёркивает итоговый повтор действия. Архаизмы и конфессионально окрашенная терминология не используются.
