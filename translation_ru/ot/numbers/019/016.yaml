source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: ru
  text: И всякий, кто прикоснётся в открытом поле к убитому мечом, или к мёртвому телу[a], или к человеческой кости[b], или к могиле, будет нечист семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к умершему»; еврейское слово может обозначать умершего человека или мёртвое тело.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к кости человека»; здесь имеется в виду человеческая кость вообще, а не обязательно кость мужчины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: И всякий, кто прикоснётся
  rationale: Сочетание כֹל с относительным предложением имеет распределительно-условный смысл. «Всякий, кто» естественно передаёт универсальную сферу действия правовой нормы.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: в открытом поле
  rationale: Буквально «на поверхности поля»; это идиоматическое обозначение открытой местности. Выбран естественный русский эквивалент.
- source_word: בַּחֲלַל חֶרֶב
  choice: к убитому мечом
  rationale: חָלָל обозначает убитого или поражённого насмерть, а חֶרֶב указывает орудие. Формулировка сохраняет личный референт и лаконичность оригинала.
- source_word: אוֹ בְמֵת
  choice: или к мёртвому телу
  rationale: מֵת может обозначать умершего или труп. «Мёртвое тело» понятно современному читателю и уместно в контексте ритуальной нечистоты.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: или к человеческой кости
  rationale: אָדָם здесь имеет обобщённое значение «человек», без указания на мужской пол. «Человеческая кость» точно и естественно передаёт смысл.
- source_word: אוֹ בְקָבֶר
  choice: или к могиле
  rationale: קֶבֶר означает могилу, гробницу или место погребения. «Могила» — прямой и естественный эквивалент в данном законодательном контексте.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: будет нечист семь дней
  rationale: Глагол обозначает состояние ритуальной нечистоты. Будущее время по-русски естественно выражает следствие в правовой норме, не добавляя отсутствующего в тексте пояснения.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человеческой
  alternative: мужской / человека
  rationale: В законе речь идёт о человеческих останках вообще, а не исключительно об останках мужчины; поэтому родовое значение передано без неоправданного полового уточнения.
- issue: Характер нечистоты в יִטְמָא
  choice: будет нечист
  alternative: станет ритуально нечист
  rationale: Контекст главы ясно указывает на обрядовую нечистоту, однако самого уточняющего слова «ритуально» в данном стихе нет. Краткий вариант сохраняет формальную сдержанность и не смешивает нечистоту с нравственной виной.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным правовым звучанием. Синтаксис сохраняет последовательность перечисления оригинала; управление «прикоснётся к» распространено на все однородные дополнения. Идиома עַל פְּנֵי הַשָּׂדֶה передана смысловым соответствием без отдельной сноски, поскольку «в открытом поле» прозрачно и точно.
