  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма глагола דבר с последовательным ו вводит новое речевое событие. В современной русской библейской прозе «сказал» естественно передаёт формулу прямой речи; «говорил» здесь менее точно обозначало бы завершённое событие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно передаёт адресатов речи. Повтор еврейского предлога перед вторым именем не требует неестественного русского повтора.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартная еврейская формула введения последующей прямой речи функционально и естественно передаётся в русском двоеточием; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие связывает стих с речью, начинающейся в следующем стихе; лишняя архаизация формулой «говоря» устранена.
