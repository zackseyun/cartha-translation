revisions:
- from: И пусть чистый окропит нечистого этой водой в третий день и в седьмой день и очистит его[a] в седьмой день. Затем очищаемый пусть выстирает свою одежду, омоется водой и к вечеру станет чист.
  to: Пусть чистый окропит нечистого этой водой в третий день и в седьмой день и очистит его[a] в седьмой день. Затем пусть он выстирает свою одежду, омоется водой и к вечеру станет чист.
  rationale: 'Исправление заменяет интерпретирующее «очищаемый» на местоимение «он», как в контрольной английской версии, и тем самым не решает спорный вопрос о референте последующих глаголов. Остальной текст сохранён: он точно передаёт ритуальный характер очищения, временные указания и подразумеваемую очистительную воду.'
