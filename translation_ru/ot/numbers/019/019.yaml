source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: ru
  text: Пусть чистый окропит нечистого этой водой в третий день и в седьмой день и очистит его[a] в седьмой день. Затем пусть он выстирает свою одежду, омоется водой и к вечеру станет чист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снимет с него нечистоту». Употреблённый здесь еврейский глагол связан со словом «грех», но в данном контексте означает обрядовое очищение от нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: пусть окропит
  rationale: Порода hифиль глагола נזה в данном обрядовом контексте обозначает нанесение очистительной воды посредством окропления.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: чистый / нечистого
  rationale: Субстантивированные прилагательные обозначают ритуально чистого и ритуально нечистого человека; в русском языке существительное «человек» можно естественно не повторять.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: в третий день и в седьмой день
  rationale: Прямо передаёт установленное обрядом время и сохраняет повтор предлога.
- source_word: וְחִטְּאוֹ
  choice: и очистит его
  rationale: Пиэль глагола חטא здесь означает устранение ритуальной нечистоты, а не прощение нравственного греха.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: пусть выстирает свою одежду
  rationale: Глагол כבס означает стирку одежды; единственное собирательное «одежду» естественно в современном русском.
- source_word: וְרָחַץ בַּמַּיִם
  choice: омоется водой
  rationale: В этой обрядовой последовательности רחץ подразумевает омовение тела; возвратная форма ясно и кратко передаёт смысл.
- source_word: וְטָהֵר בָּעָרֶב
  choice: к вечеру станет чист
  rationale: Форма указывает на наступление состояния ритуальной чистоты вечером; «к вечеру» естественно выражает временную границу результата.
theological_decisions:
- issue: Характер очищения, выраженного глаголом חטא
  choice: Передать как ритуальное очищение
  alternative: «очистит от греха» или «искупит»
  rationale: Контекст посвящён нечистоте от прикосновения к мёртвому и очистительной воде; нравственное прощение или искупление в стихе прямо не выражено.
- issue: К кому относятся действия стирки и омовения
  choice: В основном тексте обозначить исполнителем очищаемого человека
  alternative: Отнести действия к чистому человеку, совершающему окропление, либо оставить местоимение без уточнения
  rationale: Все еврейские глаголы стоят в мужском роде единственного числа, поэтому грамматика сама по себе допускает смену или сохранение субъекта. Однако ближайший обрядовый контекст, особенно стих 12, связывает стирку и омовение с тем, кто очищается; явное «очищаемый» делает русский текст понятным, не превращая это в догматическое утверждение.
- issue: Род субстантивированных הַטָּהֹר и הַטָּמֵא
  choice: Использовать русские формы «чистый» и «нечистого» в обобщающем значении
  alternative: «чистый мужчина» и «нечистый мужчина»
  rationale: Мужской род в данном законодательном контексте имеет представительное значение и не требует ограничения обряда мужчинами.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным регистром обрядового предписания. «Этой водой» эксплицирует подразумеваемый объект окропления из непосредственного контекста. Термины «чистый» и «нечистый» употреблены в ритуальном, а не нравственном смысле.
