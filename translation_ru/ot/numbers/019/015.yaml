  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: ru
  text: И всякий открытый сосуд, на котором нет закреплённой крышки,[a] нечист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крышки, закреплённой обвязкой»; еврейское выражение обозначает покрытие, закреплённое на сосуде. Точный способ закрепления неясен.'
    reason: Лексическая альтернатива для редкого выражения צָמִיד פָּתִיל; сноска сохраняет возможную связь с обвязкой, не утверждая конкретный древний способ закрытия.
lexical_decisions:
- source_word: וְכֹל
  choice: И всякий
  rationale: 'וְ связывает предписание с предыдущим контекстом, а כֹל при существительном в единственном числе естественно передаётся распределительно: «всякий».'
- source_word: כְּלִי
  choice: сосуд
  rationale: В данном законе о чистоте широкое по значению כְּלִי обозначает вместилище; «сосуд» точно и уместно в русском библейском контексте.
- source_word: פָתוּחַ
  choice: открытый
  rationale: Прямо передаёт состояние сосуда; последующая часть стиха поясняет, что он не закрыт закреплённым покрытием.
- source_word: אֲשֶׁר אֵין ... עָלָיו
  choice: на котором нет
  rationale: Естественно передаёт относительную конструкцию и положение покрытия на сосуде, не добавляя отсутствующего в тексте глагола обладания.
- source_word: צָמִיד פָּתִיל
  choice: привязанной крышки
  rationale: Редкое сочетание указывает на покрытие, закреплённое посредством обвязывания. «Привязанная крышка» сохраняет конкретный образ, не утверждая более определённо, чем еврейский текст, что сосуд был герметично запечатан.
- source_word: טָמֵא הוּא
  choice: нечист
  rationale: Кратко и прямо передаёт установленный текстом статус нечистоты; ритуальный характер ясен из контекста главы.
theological_decisions:
- issue: Характер нечистоты
  choice: «нечист» без пояснения «ритуально»
  alternative: «ритуально нечист»
  rationale: Контекст относится к обрядовой чистоте, однако еврейский текст употребляет просто טָמֵא. Основной текст не должен добавлять поясняющую квалификацию.
- issue: Степень закрытия сосуда
  choice: Сохранить образ закреплённого покрытия, не заявляя о герметичном запечатывании
  alternative: «с герметичной/запечатанной крышкой»
  rationale: צָמִיד פָּתִיל допускает представление о плотно закреплённом или запечатанном покрытии, но точный древний способ закрытия не вполне определён.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис краток и близок к еврейскому; «сосуд» и «нечист» сохраняют устойчивую лексику законов о чистоте. Маркер сноски помещён непосредственно после спорного выражения.
