  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: ru
  text: Но человек, который станет нечист и не очистится, — тот будет отсечён из среды собрания[a], потому что он осквернил святилище ГОСПОДА. На него не была окроплена вода очищения[b]; он нечист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «та душа будет отсечена из среды собрания». В еврейской правовой формуле слово «душа» обозначает человека в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «вода нечистоты»; традиционно также: «вода отделения». Речь идёт о приготовленной согласно этой главе воде для очищения от нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: человек
  rationale: В данном правовом предписании грамматически мужская форма обозначает отдельного представителя общины; «человек» естественно и точно передаёт обобщённое значение.
- source_word: יִטְמָא
  choice: станет нечист
  rationale: Qal указывает на вхождение в состояние ритуальной нечистоты, а не обязательно на нравственное осквернение.
- source_word: יִתְחַטָּא
  choice: очистится
  rationale: Hitpael от חטא в данном очистительном контексте означает пройти очищение от нечистоты, а не совершить действие, связанное с грехом в обычном нравственном смысле.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: тот будет отсечён
  rationale: נפש в юридической формуле обозначает самого человека. «Будет отсечён» сохраняет намеренно неуточнённую заветно-правовую формулу.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: от собрания
  rationale: קהל означает собранную общину; русское «от собрания» кратко и естественно передаёт удаление из её среды.
- source_word: מִקְדַּשׁ יְהוָה
  choice: святилище ГОСПОДА
  rationale: מקדש — священное место или святилище. Тетраграмматон передан традиционным типографически выделенным «ГОСПОДА».
- source_word: טִמֵּא
  choice: осквернил
  rationale: Пиэль выражает причинение культовой нечистоты святилищу; «осквернил» передаёт серьёзность действия без сведения его только к нравственной вине.
- source_word: מֵי נִדָּה
  choice: вода очищения
  rationale: Сочетание обозначает приготовленную в этой главе воду, применяемую для устранения нечистоты. Функциональное русское выражение понятнее буквального «вода нечистоты»; буквальная возможность отмечена в сноске.
- source_word: זֹרַק עָלָיו
  choice: не была окроплена на него
  rationale: В ритуальном контексте זרק обозначает окропление или разбрызгивание жидкости; пассивная русская конструкция сохраняет синтаксический акцент еврейского текста.
- source_word: טָמֵא הוּא
  choice: он нечист
  rationale: Прямо передаёт заключительное безглагольное объявление его ритуального состояния.
theological_decisions:
- issue: Характер наказания, выраженного формулой «будет отсечён»
  choice: Сохранить формулу «будет отсечён», не уточняя способ наказания.
  alternative: «будет изгнан из общины» или «будет предан смерти»
  rationale: Еврейская формула здесь сама по себе не определяет, идёт ли речь об исключении, смерти либо непосредственном Божьем суде; перевод сохраняет эту богословскую и правовую неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным правовым звучанием. Сохранены культовые термины «нечист», «святилище», «окроплена» и неразрешённая формула наказания. Все сносочные маркеры присутствуют в основном тексте.
