id: NUM.6.9
reference: Numbers 6:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: ru
  text: Если же рядом с ним внезапно умрёт человек[a], так что его посвящённая голова[b] окажется осквернена, то в день своего очищения он должен обрить голову; на седьмой день он должен обрить её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если мёртвый умрёт рядом с ним — внезапно, неожиданно». Это еврейское выражение описывает неожиданную смерть в непосредственной близости от назорея.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голова его посвящения». Имеется в виду голова с необстриженными волосами как знак назорейского посвящения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если же
  rationale: Вводит условный случай в законодательстве о назорействе; «же» сохраняет связь и переход к исключительной ситуации.
- source_word: יָמוּת מֵת
  choice: умрёт человек
  rationale: Сочетание глагола «умереть» с однокоренным существительным идиоматически обозначает смерть человека; по-русски естественно передать без буквального повтора.
- source_word: עָלָיו
  choice: рядом с ним
  rationale: В контексте осквернения умершим указывает на непосредственную близость к назорею, а не обязательно на физическое падение тела на него.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: внезапно
  rationale: Парное выражение подчёркивает неожиданность и стремительность происшествия; русское «внезапно» естественно передаёт его совокупный смысл.
- source_word: וְטִמֵּא
  choice: так что … окажется осквернена
  rationale: Пассивная результативная конструкция ясно передаёт наступившее ритуальное осквернение и избегает впечатления, будто умерший намеренно совершает действие.
- source_word: רֹאשׁ נִזְרוֹ
  choice: его посвящённая голова
  rationale: Передаёт связь головы и волос с назорейским посвящением понятным современным языком, не сводя נזר исключительно к обету.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: он должен обрить голову
  rationale: Нормативная конструкция естественно выражает предписанное действие в русском законодательном повествовании.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: в день своего очищения
  rationale: Речь идёт о ритуальном очищении после осквернения; формулировка сохраняет культовый смысл и остаётся понятной.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: на седьмой день
  rationale: Прямо и ясно передаёт временное указание.
- source_word: יְגַלְּחֶנּוּ
  choice: он должен обрить её
  rationale: Местоимение отсылает к голове; повтор глагола сохранён в соответствии с еврейским текстом.
theological_decisions:
- issue: Характер осквернения назорейского посвящения
  choice: 'Передать נזר через ритуальное посвящение: «посвящённая голова».'
  alternative: «голова его назорейства»; «голова его обета»
  rationale: Стих говорит о ритуальном осквернении, прерывающем назорейское посвящение. Выбранная формулировка сохраняет культовое значение головы и волос, не добавляя отсутствующего здесь прямого упоминания обета.
- issue: Причинная связь между внезапной смертью и осквернением
  choice: «так что … окажется осквернена»
  alternative: «и он осквернит»
  rationale: Так сохраняется результат, выраженный переходным еврейским глаголом, но не создаётся ложного оттенка намеренного действия со стороны внезапно умершего человека.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного библейского стиля. Синтаксис сделан естественным для широкого читателя; повтор предписания об обривании сохранён, а специальные понятия разъяснены в сносках.
