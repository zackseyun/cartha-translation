  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: ru
  text: 'Вот закон о назорее: в день, когда истекут дни его отделения[a], его приведут[b] ко входу в шатёр встречи.'
  philosophy: optimal-equivalence
  footnotes:
