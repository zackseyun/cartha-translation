lexical_decisions:
- source_word: וְזֹאת תּוֹרַת הַנָּזִיר
  choice: Вот закон о назорее
  rationale: Формула вводит следующее ритуальное предписание. «Закон» сохраняет юридический оттенок תּוֹרָה, а «назорей» — традиционный русский технический термин для נָזִיר.
- source_word: בְּיוֹם מְלֹאת
  choice: в день, когда завершатся
  rationale: Сохраняется формальное временное выражение בְּיוֹם и значение полноты или завершения у מְלֹאת; придаточная конструкция звучит естественно по-русски.
- source_word: יְמֵי נִזְרוֹ
  choice: дни его посвящения
  rationale: נֵזֶר здесь обозначает период особого отделения и посвящения назорея. «Посвящение» понятно современному читателю и передаёт сакральную направленность этого отделения; допустимые варианты отмечены в сноске.
- source_word: יָבִיא אֹתוֹ
  choice: его приведут
  rationale: Еврейская форма активна — буквально «он приведёт его», однако субъект в самом стихе не назван ясно. Русская неопределённо-личная конструкция сохраняет процедурный смысл и не вводит неуказанного участника.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: «Вход» естественно передаёт פֶּתַח, а «шатёр встречи» буквально и понятно воспроизводит устойчивое название אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Значение терминов נָזִיר и נֵזֶר в Числах 6
  choice: Сохранить техническое слово «назорей», а период נִזְרוֹ передать как «его посвящение»
  alternative: «Отделение», «назорейский обет» или последовательное употребление описательного выражения «посвящённый Богу человек»
  rationale: Технический термин сохраняет особый израильский институт, тогда как «посвящение» передаёт состояние особой отделённости для Бога, не сводя слово только к акту принесения обета.
- issue: Залог и невыраженный субъект יָבִיא אֹתוֹ
  choice: 'Передать неопределённо-лично: «его приведут»'
  alternative: 'Формально: «он приведёт его»; либо пассивно: «он будет приведён»'
  rationale: В еврейском стоит активная форма 3-го лица мужского рода единственного числа, но её субъект в стихе не определён однозначно. Выбранная формулировка не устраняет самого события представления назорея и не приписывает действие конкретному лицу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, нормативным звучанием. Техническое слово «назорей» сохранено, а синтаксис сделан понятным без устранения неоднозначности еврейской активной конструкции.
