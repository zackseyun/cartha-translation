base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: ru
  text: Пусть он воздерживается от вина и крепкого напитка; пусть не пьёт ни винного уксуса, ни уксуса из крепкого напитка, ни какого-либо настоя из винограда[a] и не ест винограда — ни свежего, ни сушёного[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакой жидкости из вымоченного винограда»; еврейское слово обозначает жидкость, полученную настаиванием или замачиванием, и может охватывать различные напитки из винограда.'
    reason: lexical_alternative
  - marker: b
    text: 'Сушёный виноград — то есть изюм. Буквально: «винограда свежего и сушёного».'
    reason: lexical_clarification
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: пусть он воздерживается от вина и крепкого напитка
  rationale: Глагол נזר в породе Hiphil в данном законодательном контексте означает воздерживаться, держаться в стороне. «Крепкий напиток» сохраняет отличие שֵׁכָר от обычного вина, не уточняя без основания его состав.
- source_word: חֹמֶץ יַיִן
  choice: винного уксуса
  rationale: Кратко и естественно передаёт сочетание «уксус/скисшее питьё из вина»; в современном русском контексте ясно указывает на происхождение продукта.
- source_word: וְחֹמֶץ שֵׁכָר
  choice: уксуса из крепкого напитка
  rationale: Сохраняет параллелизм с винным уксусом и прямо передаёт исходное питьё, не вводя конкретного вида напитка.
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: ни какого-либо настоя из винограда
  rationale: מִשְׁרָה обозначает жидкость, полученную настаиванием или замачиванием; «настой из винограда» точнее сохраняет способ получения и более широкий смысл, чем просто «виноградный сок».
- source_word: וַעֲנָבִים לַחִים וִיבֵשִׁים
  choice: винограда — ни свежего, ни сушёного
  rationale: Передаёт буквальное противопоставление «влажный/свежий» и «сушёный». Слово «сушёный» сохраняет форму оригинала, а примечание поясняет обычное название продукта.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с законодательной, но доступной формой «пусть не…». Повтор отрицания и симметрия перечня сохранены. Термин «назирей» в самом стихе отсутствует и поэтому не добавлен.
