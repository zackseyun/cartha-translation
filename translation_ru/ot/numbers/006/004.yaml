  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: ru
  text: Во все дни своего назорейства[a] он не должен есть ничего из того, что делают из винограда, — от косточек до кожицы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в период назорейского посвящения; еврейское слово может также передавать мысль об отделении или посвящении.
    reason: Уточняется значение נִזְרוֹ без сведения его исключительно к акту принесения обета.
lexical_decisions:
- source_word: נִזְרוֹ
  choice: своего назорейства
  rationale: В данном установлении слово обозначает особое состояние посвящения назорея. «Назорейство» сохраняет технический смысл и не сводит его только к самому обету.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: ничего, что производится
  rationale: Сочетание с последующим отрицанием охватывает всё, что получают или изготавливают из виноградной лозы; такая формулировка естественно передаёт запрет по-русски.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: из виноградной лозы
  rationale: Буквально «из лозы вина»; речь идёт о виноградной лозе. Русское выражение ясно и идиоматично.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: от косточек до кожицы
  rationale: Передан диапазон, охватывающий части виноградной ягоды. «Косточки» и «кожица» — естественные русские названия предполагаемых референтов, хотя значения редких еврейских слов не вполне бесспорны.
- source_word: לֹא יֹאכֵל
  choice: он не должен есть
  rationale: Отрицательная форма глагола в законодательном контексте выражает запрет; «не должен есть» сохраняет нормативную силу и звучит современно.
- source_word: כֹּל יְמֵי
  choice: во все дни
  rationale: Формулировка передаёт полную продолжительность назорейства и близка структуре еврейского текста.
theological_decisions:
- issue: Значение נִזְרוֹ как состояния посвящения или обета
  choice: своего назорейства
  alternative: своего назорейского обета
  rationale: Еврейское слово может указывать на отделение или посвящение назорея, а не исключительно на акт принесения обета. Выбор сохраняет широту понятия в непосредственном контексте закона.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным оттенком. Техническое слово «назорейство» сохранено ради точности; редкие обозначения частей винограда переданы общеупотребительными словами.
