base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: ru
  text: Ни ради отца своего, ни ради матери, ни ради брата, ни ради сестры он не должен становиться ритуально нечистым при их смерти[a], потому что посвящение его Богу — на его голове[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не должен осквернять себя из-за них, когда они умрут». Речь идёт о ритуальной нечистоте, связанной с умершим.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово незер здесь означает посвящение, или отделение, Богу; его видимым знаком были волосы на голове назорея.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: Ни ради отца своего, ни ради матери, ни ради брата, ни ради сестры
  rationale: Вынесенный вперёд перечень родственников сохраняет эмфазу еврейского текста. Повтор «ни ради» естественно передаёт запрет даже в отношении ближайших родных.
- source_word: לֹא יִטַּמָּא
  choice: не должен осквернять себя
  rationale: Возвратная форма передаёт ритуальное осквернение, которое назорей навлекает на себя через соприкосновение со смертью; контекст исключает моральное понимание глагола.
- source_word: לָהֶם בְּמֹתָם
  choice: их смертью
  rationale: Творительный оборот кратко и естественно обозначает причину или обстоятельство ритуального осквернения. Возможное более буквальное прочтение вынесено в сноску.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета и ясно передаёт причинную связь.
- source_word: נֵזֶר
  choice: посвящение
  rationale: В законе о назорействе слово обозначает посвящённость или отделённость Богу, видимым знаком которой служат волосы; перевод «венец» здесь мог бы чрезмерно сузить образ.
- source_word: אֱלֹהָיו
  choice: его Богу
  rationale: 'Сохранён притяжательный суффикс: посвящение направлено его Богу. Такая синтаксическая связь естественнее по-русски, чем двусмысленное «посвящение его Бога».'
- source_word: עַל רֹאשׁוֹ
  choice: на его голове
  rationale: Сохранён конкретный образ еврейского текста, отсылающий к волосам назорея как видимому знаку посвящения.
theological_decisions:
- issue: Характер нечистоты в законе о назорействе
  choice: Передать запрет как относящийся к ритуальному осквернению из-за смерти.
  alternative: Понять «осквернять себя» как нравственную порочность или личный грех без ритуального контекста.
  rationale: Контекст Чис 6 говорит о нечистоте от умершего. Перевод не должен приписывать тексту дополнительное утверждение о нравственной вине.
- issue: Значение נֵזֶר на голове назорея
  choice: Сохранить одновременно отвлечённое значение посвящения и конкретный образ его пребывания на голове.
  alternative: Перевести только как «венец» либо прямо заменить слово выражением «длинные волосы».
  rationale: Текст связывает посвящённый статус с головой, но не сводит значение слова исключительно к волосам или физическому венцу.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Параллельный перечень близких родственников сохранён ради ритма и эмфазы; терминология избегает конфессионально окрашенных добавлений.
