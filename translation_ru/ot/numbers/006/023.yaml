base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: ru
  text: 'Скажи Аарону и его сыновьям: «Так благословляйте сынов Израиля, говоря им:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Скажи
  rationale: Пиэль, повелительное наклонение 2-го лица единственного числа, вводит прямое поручение Моисею; «скажи» естественно передаёт обращение к конкретным адресатам.
- source_word: אַהֲרֹן וְאֶל בָּנָיו
  choice: Аарону и его сыновьям
  rationale: בָּנָיו в данном контексте обозначает сыновей Аарона, участвующих в священническом служении.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив речи вводит прямую цитату; в современном русском его естественно передать двоеточием, не добавляя тяжеловесного «говоря».
- source_word: כֹּה תְבָרֲכוּ
  choice: Так благословляйте
  rationale: כֹּה указывает на предписанный способ или формулу, а имперфект 2-го лица множественного числа в данном наставлении имеет директивную силу.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняется буквальная семейно-заветная форма устойчивого еврейского обозначения народа; по-русски выражение понятно и звучит торжественно.
- source_word: אָמֹר לָהֶם
  choice: Говорите им
  rationale: Масоретская форма אָמוֹר формально является повелительным наклонением единственного числа, однако по смыслу продолжает обращение к Аарону и его сыновьям; русский множественный императив согласует указание с непосредственно названной группой служителей, не меняя содержания предписания.
theological_decisions:
- issue: Заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля / израильтяне
  rationale: Буквальная форма сохраняет семейно-заветный образ исходного текста и не исключает женщин из состава народа, поскольку здесь это общенациональное обозначение.
- issue: Предписывающий характер כֹּה תְבָרֲכוּ
  choice: Так благословляйте
  alternative: Вот как вы должны благословлять
  rationale: Краткая формулировка сохраняет авторитетный и литургический характер указания, не усиливая модальность сверх еврейского текста.
- issue: Число в אָמֹר לָהֶם после обращения к Аарону и его сыновьям
  choice: Говорите им
  alternative: Говори им
  rationale: Форма единственного числа допускает понимание Аарона как непосредственного адресата, но контекст предписывает благословение всей священнической группе. Множественное число в русском поддерживает ближайшее обращение и связь с תְבָרֲכוּ, не разрешая вопрос о ведущей роли Аарона доктринально.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, пригодным для богослужебного чтения звучанием. Синтаксис упрощён естественной русской пунктуацией; архаизмы вроде «рече» и «тако» исключены. Выражение «сыны Израиля» сохранено как понятная библейская формула.
