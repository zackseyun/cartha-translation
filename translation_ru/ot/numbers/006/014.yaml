  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: ru
  text: 'И пусть он принесёт свою жертву Яхве: одного годовалого ягнёнка без изъяна — во всесожжение, одну годовалую овцу без изъяна — в жертву за грех[a] и одного барана без изъяна — в мирную жертву[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское חַטָּאת может обозначать как грех, так и жертву, связанную с очищением от нечистоты или проступка.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в жертву благополучия» или «в жертву общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: и пусть он принесёт
  rationale: Каузативная форма глагола קרב в жертвенном контексте означает «принести, представить» жертву; конструкция с «пусть» естественно передаёт предписывающий оттенок древнееврейского имперфекта.
- source_word: קָרְבָּנוֹ
  choice: свою жертву
  rationale: קָרְבָּן обозначает приношение, подносимое Богу; в данном перечне жертвенных животных русское «жертва» звучит ясно и естественно.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не заменяющий его титул.
- source_word: כֶּבֶשׂ ... בֶּן־שְׁנָתוֹ
  choice: одного годовалого ягнёнка
  rationale: כֶּבֶשׂ обозначает ягнёнка мужского пола, а בֶּן־שְׁנָתוֹ — животное первого года жизни; род в русском слове «ягнёнок» сохраняет противопоставление следующей овечке.
- source_word: תָמִים
  choice: без изъяна
  rationale: В жертвенном законодательстве слово указывает на отсутствие физического порока; «без изъяна» точно и литературно передаёт культовый смысл.
- source_word: לְעֹלָה
  choice: во всесожжение
  rationale: עֹלָה — установленный вид жертвы, полностью сжигаемой на жертвеннике; традиционный русский термин «всесожжение» точен и узнаваем.
- source_word: וְכַבְשָׂה ... בַּת־שְׁנָתָהּ
  choice: одну годовалую овечку
  rationale: כַּבְשָׂה обозначает молодую овцу женского пола, а בַּת־שְׁנָתָהּ — животное первого года жизни; «овечка» естественно отличает её от ягнёнка мужского пола.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: חַטָּאת в жертвенном контексте обозначает особую категорию жертвы; основной вариант сохраняет её традиционную связь с грехом, а возможное функциональное понимание как очистительной жертвы отмечено в сноске.
- source_word: וְאַיִל אֶחָד
  choice: и одного барана
  rationale: אַיִל конкретно обозначает взрослого барана; числительное сохранено в соответствии со счётной структурой стиха.
- source_word: לִשְׁלָמִים
  choice: в мирную жертву
  rationale: שְׁלָמִים — название жертвенной категории, связанной с миром, благополучием и совместной трапезой; единственное число по-русски обозначает вид жертвы естественнее, чем буквальное множественное.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя Бога; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Значение חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может подчёркивать как грех, так и очищающую функцию жертвы. Основной текст использует традиционное и понятное название, не скрывая альтернативу в сноске.
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва благополучия; жертва общения
  rationale: Этимология и употребление допускают несколько смысловых акцентов. «Мирная жертва» сохраняет принятую категорию, а сноска сообщает другие возможные передачи.
translation_notes:
  register: Современный литературный русский язык с ясным предписывающим синтаксисом и сохранением традиционной жертвенной терминологии. Тире разграничивают три перечисленных вида жертв; начальное «и» сохраняет связь с предыдущим предписанием.
