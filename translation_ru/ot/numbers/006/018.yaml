  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: ru
  text: Затем назорей обреет свою посвящённую голову у входа в шатёр встречи, возьмёт волосы со своей посвящённой головы и положит их на огонь под мирной жертвой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвой общения»; или: «жертвой благополучия».'
    reason: Лексические варианты передачи обрядового термина שְׁלָמִים.
lexical_decisions:
- source_word: הַנָּזִיר
  choice: назорей
  rationale: Устоявшийся русский термин для человека, давшего особый обет, описанный в этой главе; он сохраняет специальный обрядовый смысл, не сводя его к общему понятию посвящённого человека.
- source_word: וְגִלַּח
  choice: обреет
  rationale: Глагол обозначает сбривание волос; форма будущего совершенного вида естественно передаёт последовательное предписание в русском законодательном повествовании.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Передаёт пространственное значение פֶּתַח и смысл אֹהֶל מוֹעֵד как священного шатра назначенной встречи, оставаясь понятным современному читателю.
- source_word: רֹאשׁ נִזְרוֹ
  choice: свою посвящённую голову
  rationale: Естественная русская формулировка сохраняет связь головы и волос с состоянием особого посвящения; буквальное «голову своего посвящения» было бы неясным и неестественным.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: волосы со своей посвящённой головы
  rationale: Сохраняет повторяющуюся связь волос с посвящением назорея, но выражает её современным русским языком.
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: огонь, который горит под
  rationale: Слово «горит» подразумевается самим понятием огня и делает пространственное отношение естественным по-русски, не меняя обрядового действия.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: мирная жертва
  rationale: Устоявшееся русское название данного вида жертвоприношения; оно сохраняет связь שְׁלָמִים с миром, целостностью и благополучием, не ограничивая смысл только совместной трапезой.
theological_decisions:
- issue: Передача обрядового термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин обозначает особую категорию жертвоприношений и допускает несколько смысловых акцентов. Основной вариант следует сложившейся русской терминологии, а примечание сохраняет возможные оттенки общения и благополучия, не превращая лексический выбор в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядового предписания. Специальный термин «назорей» сохранён, а синтаксически буквальное и неясное «голова его посвящения» передано естественным выражением «посвящённая голова». Маркер примечания поставлен непосредственно после термина, к которому относится.
