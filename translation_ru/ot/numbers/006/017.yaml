  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: ru
  text: И пусть он принесёт барана как мирную жертву[a] Яхве вместе с корзиной пресных хлебов; священник же пусть принесёт его хлебное приношение и его возлияние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву общения». Еврейское שְׁלָמִים может быть передано как «мирная жертва» или «жертва общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: барана
  rationale: В контексте жертвоприношения אַיִל обозначает взрослого самца овцы; естественный русский эквивалент — «баран».
- source_word: יַעֲשֶׂה זֶבַח
  choice: принесёт ... как жертву
  rationale: Хотя עשה буквально значит «делать», в культовом контексте оно обозначает совершение жертвоприношения; сочетание с זֶבַח естественно передаётся глаголом «принести» и словом «жертва».
- source_word: זֶבַח שְׁלָמִים
  choice: жертву мирную
  rationale: Передаёт как существительное זֶבַח, так и традиционное название жертвенной категории שְׁלָמִים, не сужая её значения до одного лишь общения или общей трапезы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», сохраняя явное употребление имени Бога в еврейском тексте.
- source_word: עַל סַל הַמַּצּוֹת
  choice: вместе с корзиной пресных хлебов
  rationale: В данном обрядовом контексте עַל выражает сопутствование; «вместе с» ясно и естественно передаёт совместное принесение. Множественное מַצּוֹת отражено как «пресные хлебы».
- source_word: מִנְחָתוֹ וְאֶת נִסְכּוֹ
  choice: полагающиеся при нём хлебное приношение и возлияние
  rationale: מִנְחָה здесь является установленным хлебным приношением, а נֶסֶךְ — возлиянием. Мужской суффикс может формально соотноситься с бараном или всем жертвоприношением; оборот «полагающиеся при нём» естественно обозначает сопутствующие дары, не приписывая их человеку.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Исходный текст употребляет имя יהוה; транслитерация «Яхве» сохраняет его как личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Передача שְׁלָמִים
  choice: жертва мирная
  alternative: жертва общения
  rationale: «Мирная жертва» — понятное и укоренившееся русское обозначение широкой жертвенной категории; вариант «жертва общения» возможен, но сильнее подчёркивает одну интерпретационную сторону термина.
translation_notes:
  register: Современный литературный русский с достоинством законодательного культового текста. Конструкция «пусть ... принесёт» естественно передаёт предписывающее значение еврейского имперфекта; «священник же» отмечает смену исполнителя. Термин «хлебное приношение» доступнее буквального «дар», а «возлияние» является стандартным и ясным культовым термином.
