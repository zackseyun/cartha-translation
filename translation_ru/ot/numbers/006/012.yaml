source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: ru
  text: Он заново посвятит Господу дни своего назорейства[a] и принесёт однолетнего барашка в жертву повинности. Прежние же дни не будут засчитаны[b], потому что его назорейство было осквернено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дни своего отделения» или «дни своего посвящения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «прежние дни падут», то есть дни назорейства до осквернения больше не идут в счёт.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִזִּיר לַיהוָה אֶת יְמֵי נִזְרוֹ
  choice: Он заново посвятит Господу дни своего назорейства
  rationale: Глагол в породе хифиль обозначает посвящение или отделение; контекст требует возобновления прерванного назорейского срока. «Заново посвятит» передаёт повторное начало, а «дни своего назорейства» сохраняет связь с установленным обетом периодом.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: однолетнего ягнёнка
  rationale: Обычное жертвенное обозначение ягнёнка первого года жизни; русская формулировка естественна и точно передаёт возраст животного.
- source_word: לְאָשָׁם
  choice: в жертву повинности
  rationale: אָשָׁם — установленная категория жертвы, связанной с виной и возмещением; «жертва повинности» сохраняет её отличие от жертвы за грех.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: Прежние же дни не будут засчитаны
  rationale: Буквально дни «падут», то есть ранее соблюдённый срок перестаёт учитываться. Перевод передаёт правовой результат, а буквальный образ сохранён в примечании.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: потому что его назорейство было осквернено
  rationale: Форма טָמֵא выражает ритуальное осквернение назорейского состояния. «Назорейство» последовательно передаёт техническое значение נזר в Числах 6.
theological_decisions:
- issue: Значение נזר в законе о назорее
  choice: назорейство
  alternative: посвящение; отделение; назорейский обет
  rationale: В данном контексте слово относится к установленному состоянию и сроку назорейства, однако сохраняет смысл посвящённого отделения; примечание указывает возможные смысловые передачи.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует укоренившейся русской библейской передаче тетраграмматона и сохраняет достойный современный регистр без внесения конфессионально частного толкования.
- issue: Последствие ритуального осквернения для уже прошедших дней
  choice: дни не будут засчитаны
  alternative: дни падут; дни будут утрачены
  rationale: Фраза означает, что прежний срок назорейства аннулируется и отсчёт начинается заново; буквальная метафора отмечена в сноске, чтобы не скрывать форму оригинала.
translation_notes:
  register: Современный литературный русский язык с ясной ритуально-правовой терминологией. «Назорейство» употреблено как понятный библейский технический термин; синтаксис остаётся торжественным, но не архаичным.
