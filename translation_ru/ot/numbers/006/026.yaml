  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: ru
  text: Да обратит Яхве к тебе Своё лицо и даст тебе мир[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «шалом» означает не только мир, но также целостность и благополучие.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: да обратит
  rationale: Глагол נשׂא буквально означает «поднимать, нести», однако сочетание «поднять лицо к кому-либо» здесь выражает благосклонное обращение лица и внимания. «Да обратит» естественно передаёт идиому по-русски, сохраняя образ лица.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: פָּנָיו
  choice: Своё лицо
  rationale: Сохраняется конкретный антропоморфный образ еврейского текста; варианты «взор» или «благоволение» были бы более истолковательными.
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: Предлог אֶל выражает направление — «к, по направлению к»; сочетание «обратить к тебе лицо» естественно в современном русском языке.
- source_word: וְיָשֵׂם
  choice: и даст
  rationale: שׂים буквально значит «положить, установить», но в сочетании с לְךָ שָׁלוֹם естественный русский эквивалент — «дать тебе мир».
- source_word: לְךָ
  choice: тебе
  rationale: Предлог לְ обозначает адресата или получателя; русский дательный падеж точно и естественно передаёт эту функцию.
- source_word: שָׁלוֹם
  choice: мир
  rationale: «Мир» — основной и уместный в формуле благословения эквивалент שָׁלוֹם, хотя еврейское слово также включает целостность, благополучие и полноту жизни; это отражено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Антропоморфный оборот «поднять лицо к тебе»
  choice: Сохранить образ лица в естественной русской идиоме «обратит к тебе Своё лицо»
  alternative: «Поднимет к тебе Своё лицо»; «окажет тебе благоволение»
  rationale: Буквальное «поднимет лицо» по-русски звучит неясно, а отвлечённое «окажет благоволение» устраняет образ исходного текста. Выбранный вариант сохраняет как образ, так и его благожелательный смысл.
translation_notes:
  register: Современный литературный русский язык с торжественной формой благословения «да…». Обращение передано в единственном числе, как в еврейском тексте. Заглавная буква в «Своё» служит уважительным обозначением Бога, не меняя смысла исходного текста.
