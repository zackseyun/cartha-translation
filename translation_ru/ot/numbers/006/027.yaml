  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: ru
  text: Так они возложат Моё имя на сынов Израиля[a][b], и Я Сам благословлю их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; «народ Израиля». Буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «возложить Моё имя на» по-видимому означает призвать над ними заветное имя Господа и обозначить их как принадлежащих Ему.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Так они возложат
  rationale: Глагол שׂוּם означает «класть, помещать, возлагать». «Так» передаёт итоговую связь с предшествующим священническим благословением, а форма «возложат» сохраняет предписывающе-будущее значение.
- source_word: אֶת שְׁמִי
  choice: Моё имя
  rationale: Слово «имя» сохранено буквально, поскольку оно несёт заветный и представительский смысл; замена на «власть» или «благословение» неоправданно сузила бы образ.
- source_word: עַל
  choice: на
  rationale: Предлог сохраняет конкретный образ возложения Божьего имени на народ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Это буквальное соответствие еврейскому выражению; оно сохраняет традиционное наименование народа завета, относящееся здесь ко всему сообществу Израиля.
- source_word: וַאֲנִי
  choice: и Я Сам
  rationale: Отдельно выраженное местоимение אֲנִי имеет эмфатическую силу, которую естественно передаёт «Я Сам».
- source_word: אֲבָרֲכֵם
  choice: благословлю их
  rationale: Форма от ברך означает «благословлять»; будущее время передаёт обещанное Божье действие, а «их» относится к сынам Израиля.
theological_decisions:
- issue: Смысл возложения Божьего имени на Израиль
  choice: Сохранить конкретное заветное выражение «возложат Моё имя на» без разъясняющей вставки.
  alternative: «призовут Моё имя над ними»; «отметят их как принадлежащих Мне»
  rationale: Оборот может включать призывание имени Господа, заветную принадлежность и сообщаемое благословение, однако сам текст выражает это через образ возложения имени. Буквальный образ сохраняет полноту и некоторую открытость смысла.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: «израильтян»; «народ Израиля»
  rationale: Еврейский текст буквально говорит «сыны Израиля». Эта форма сохранена как заветное этническое наименование, хотя по смыслу охватывает весь народ.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Слово «возложат» выбрано ради сохранения конкретного образа без тяжеловесной архаики. Заглавные буквы в «Моё» и «Я Сам» отражают принятое русское оформление речи Бога.
