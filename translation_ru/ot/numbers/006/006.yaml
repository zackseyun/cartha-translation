- source_word: לַיהוָה
  choice: Господу
  rationale: Предлог указывает на посвящение Господу; имя יהוה передано традиционным русским соответствием «Господь».
- source_word: עַל נֶפֶשׁ מֵת
  choice: к умершему
  rationale: В данном контексте сочетание означает умершего человека, к телу которого запрещено приближаться; русская формулировка сохраняет личностную референцию исходного выражения.
- source_word: לֹא יָבֹא
  choice: не должен приближаться
  rationale: Отрицательная форма глагола в предписании выражает запрет; выбранная формулировка естественна для современного русского нормативного текста.
theological_decisions:
- issue: Передача назорейской терминологии без чрезмерного уточнения
  choice: своего посвящения
  alternative: своего назорейства; своего назорейского обета; своего отделения
  rationale: Еврейское слово связано с назорейством, но здесь непосредственно обозначает состояние или период отделения. «Посвящение» сохраняет смысл принадлежности Богу, не вводя в основной текст существительное «обет», которого в стихе нет; сноска раскрывает возможные соответствия.
- issue: Передача имени יהוה
  choice: Господу
  alternative: Яхве
  rationale: Традиционное русское «Господь» уместно в основном тексте и соответствует принятой практике передачи тетраграмматона.
- issue: Значение נֶפֶשׁ מֵת в законе о ритуальной чистоте
  choice: к умершему
  alternative: к мёртвому телу; к трупу
  rationale: Выражение буквально содержит נֶפֶשׁ («душа; жизнь; человек») с определением «мёртвый», но в контексте означает человеческие останки. Основной текст передаёт смысл естественно, а сноска сохраняет буквальную особенность.
