revisions:
- from: Священник должен совершить ими пред Яхве обряд потрясания. Это святыня для священника, наряду с грудиной приношения потрясания и бедром, отделённым в приношение[a]. После этого назорей может пить вино[b].
  to: Священник совершит ими обряд потрясания перед Яхве. Это святыня, принадлежащая священнику, в дополнение к груди приношения потрясания и бедру приношения возношения[a]. После этого назорей может пить вино[b].
  rationale: Исправлены неточный анатомический термин и менее ясные формулировки, при сохранении ритуальной терминологии, синтаксической собирательности «это святыня» и разрешительного смысла заключительного несовершенного глагола.
