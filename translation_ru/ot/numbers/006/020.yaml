  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: ru
  text: Священник совершит ими обряд потрясания перед Яхве. Это святыня, принадлежащая священнику, в дополнение к груди приношения потрясания и бедру приношения возношения[a]. После этого назорей может пить вино[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедру приношения, отделённого для священника». Еврейское תְּרוּמָה обозначает долю, отделённую и представленную Богу; традиционное выражение «приношение возношения» передаёт этот культовый термин.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «после этого назорей будет пить вино». В данном контексте речь идёт о восстановленном разрешении после завершения обета.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: должен совершить ими… обряд потрясания
  rationale: Каузатив глагола נוּף и однокоренное תְּנוּפָה обозначают установленное ритуальное движение приношения. Формулировка сохраняет культовый смысл и еврейскую фигуру, но звучит понятнее современному читателю, чем буквальное «потрясёт их потрясанием».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי передаёт совершение обряда перед лицом Бога, а личное имя יהוה транслитерируется как «Яхве».
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Это святыня для священника
  rationale: Сохранено единственное число еврейской конструкции; «это» относится ко всему представленному священному уделу.
- source_word: עַל
  choice: наряду с
  rationale: Здесь предлог указывает, что названная святыня полагается священнику вместе с уже установленными долями, а не обозначает физическое положение.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: грудиной приношения потрясания
  rationale: Сохранён технический культовый термин и указана предназначенная священнику часть жертвы.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: бедром, отделённым в приношение
  rationale: שׁוֹק обозначает часть ноги, здесь бедро; תְּרוּמָה — выделенную и представленную Богу долю. Описательная формулировка яснее буквального, но непрозрачного «приношения возношения».
- source_word: וְאַחַר
  choice: После этого
  rationale: Выражает временную последовательность после завершения обряда.
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: назорей может пить вино
  rationale: Хотя форма глагола буквально допускает будущее «будет пить», контекст снятия запрета после окончания обета указывает на восстановленное разрешение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное заветное имя יהוה; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Модальность יִשְׁתֶּה
  choice: может пить
  alternative: будет пить
  rationale: Контекст завершения назорейского обета говорит о разрешении вновь пить вино, а не о предписании обязательно его выпить.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Культовые термины переданы последовательно и по возможности прозрачно; синтаксическая двусмысленность единственного числа в קֹדֶשׁ הוּא сохранена через «это святыня».
