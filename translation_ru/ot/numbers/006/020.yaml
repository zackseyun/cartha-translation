review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: священник совершает ритуальное потрясание перед Яхве; названная доля принадлежит священнику дополнительно к груди и бедру; после завершения обряда назорею вновь дозволено пить вино. Однако «грудина» обозначает прежде всего анатомическую кость и не годится для жертвенной мясной части חָזֶה, а «наряду с» недостаточно ясно выражает юридическое значение עַל — добавление к уже положенным священнику долям.'
  naturalness: «Совершить ими пред Яхве обряд потрясания» тяжеловесно из-за разрыва дополнения и обстоятельства. Более естественны порядок «совершит ими обряд потрясания перед Яхве» и «грудь» вместо «грудины».
  terminology: «Яхве», «назорей» и «приношение потрясания» приемлемы. Для תְּרוּמָה следует сохранить параллельную техническую конструкцию «приношение возношения» с пояснением в сноске, а не превращать её в свободное описание «отделённым в приношение».
  issues:
  - severity: medium
    issue: «Грудина» для חֲזֵה
    rationale: חָזֶה — грудь, то есть жертвенная часть туши; русское «грудина» обычно означает кость (sternum) и сужает либо искажает референт.
  - severity: low
    issue: «Наряду с» для עַל
    rationale: В распределительной формуле предлог обозначает добавление к другим священническим долям. «В дополнение к» передаёт это точнее.
  - severity: low
    issue: Описательная передача שׁוֹק הַתְּרוּמָה
    rationale: «Бедром, отделённым в приношение» менее параллельно выражению о груди и размывает технический статус תְּרוּמָה. Терминологическая передача с поясняющей сноской предпочтительнее.
  revised_text: Священник совершит ими обряд потрясания перед Яхве. Это святыня, принадлежащая священнику, в дополнение к груди приношения потрясания и бедру приношения возношения[a]. После этого назорей может пить вино[b].
