  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: ru
  text: Во все дни своего назорейства[a] он свят для Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего назорейского посвящения» или «своего отделения». Еврейское слово обозначает состояние и период, в течение которого назорей отделён для Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: во все дни
  rationale: Передаёт полный временной охват и естественно звучит по-русски.
- source_word: נִזְרוֹ
  choice: своего назорейства
  rationale: В данном законодательном контексте слово обозначает состояние и период отделения человека как назорея, а не только момент принесения обета.
- source_word: קָדֹשׁ הוּא
  choice: он свят
  rationale: Сохраняет прямое утверждение о святости, не сводя её лишь к функциональной отделённости.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל выражает здесь посвящённость и принадлежность; «для» естественно передаёт это отношение, а личное имя יהוה сохранено как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное заветное имя Бога; его транслитерация сохраняет отличие имени от титула.
- issue: Значение נִזְרוֹ в законе о назорее
  choice: своего назорейства
  alternative: своего посвящения; своего назорейского обета
  rationale: Форма указывает на состояние или период отделения назорея. Выбор не отождествляет этот период исключительно с формулой обета и сохраняет отличие между назорейством и следующим утверждением о святости.
translation_notes:
  register: Современный литературный русский язык; краткая структура стиха сохранена. Термин «назорейство» употреблён как понятный библейский термин, а сноска раскрывает его исходный смысл.
