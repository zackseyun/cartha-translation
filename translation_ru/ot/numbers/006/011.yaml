  to: И священник принесёт одну из птиц как жертву за грех[a], а другую — как всесожжение; он совершит за него искупление за то, что тот согрешил в связи с умершим[b], и в тот же день освятит его голову.
  rationale: Правка устраняет ошибочную соотнесённость возвратительного местоимения, не добавляет в основной текст подразумеваемое повторное посвящение и точнее отражает жреческое כפר как «совершить искупление». «В связи с умершим» передаёт намеренно широкий характер עַל הַנָּפֶשׁ, тогда как сноска сообщает контекстный смысл идиомы без ложной буквальности.
