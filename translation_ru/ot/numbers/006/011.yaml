  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: ru
  text: И священник принесёт одну из птиц как жертву за грех[a], а другую — как всесожжение; он совершит за него искупление за то, что тот согрешил в связи с умершим[b], и в тот же день освятит его голову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как очистительную жертву». Еврейское חַטָּאת может обозначать жертву за грех либо очистительную жертву, особенно в связи с ритуальной нечистотой.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально говорит: «согрешил по отношению к нефешу». В данном контексте נֶפֶשׁ обозначает умершего человека, то есть тело умершего, осквернившее назорея.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: священник принесёт
  rationale: Хотя עשה буквально означает «делать», в контексте названных жертв естественно передаётся культовым глаголом «принести».
- source_word: אֶחָד לְחַטָּאת
  choice: одну птицу в жертву за грех
  rationale: По контексту предыдущего стиха речь идёт об одной из двух птиц. חטאת обозначает установленный вид жертвы; традиционное русское «жертва за грех» сохраняет категорию, а возможность значения очистительной жертвы отмечена в сноске.
- source_word: וְאֶחָד לְעֹלָה
  choice: другую — во всесожжение
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике; «всесожжение» является точным и узнаваемым русским культовым термином.
- source_word: וְכִפֶּר עָלָיו
  choice: совершит очищение за него
  rationale: В данном обряде כפר относится к устранению ритуальной нечистоты посредством жертвы. Формулировка сохраняет культовый смысл и не связывает его с одной частной теорией искупления.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: поскольку тот согрешил из-за умершего
  rationale: Конструкция מֵאֲשֶׁר имеет причинный смысл, а נֶפֶשׁ в контексте ст. 6–12 обозначает умершего человека, соприкосновение с которым осквернило назорея.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: вновь освятит свою голову
  rationale: Глагол буквально означает «освятит». «Вновь» явно выражает восстановление прерванного посвящения, требуемое контекстом, не заменяя самого значения глагола.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот же день
  rationale: Так естественно передаётся указание на день совершения обряда и его непосредственность.
theological_decisions:
- issue: Значение חַטָּאת в контексте ритуальной нечистоты
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Оба значения лексически обоснованы. В основном тексте сохранён традиционный термин для вида жертвы, а ритуально-очистительный оттенок указан в сноске.
- issue: Смысл וְכִפֶּר עָלָיו
  choice: совершит очищение за него
  alternative: совершит искупление за него
  rationale: Контекст непосредственно связан с осквернением от умершего. «Очищение» передаёт здесь результат обряда, не отрицая более широкого диапазона значения כפר.
- issue: Характер «греха» назорея
  choice: согрешил из-за умершего
  alternative: осквернился из-за умершего
  rationale: Перевод сохраняет явный глагол חטא («согрешить»), не сводя его только к ритуальному осквернению, хотя именно смерть и вызванная ею нечистота образуют ближайший контекст.
- issue: Добавление значения повторного посвящения
  choice: вновь освятит
  alternative: освятит
  rationale: Предыдущие дни посвящения утрачены, и обет начинается заново (ст. 12); «вновь» делает этот контекстуальный смысл понятным, не вводя конфессионального толкования.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным регистром. Культовые термины «жертва за грех» и «всесожжение» сохранены ради точности и узнаваемости; синтаксис упрощён для ясного чтения. Местоимение «тот» устраняет возможную двусмысленность: очищение совершает священник, а согрешившим назван назорей.'
