source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: ru
  text: Во все дни своего назорейского обета[a] бритва не должна проходить по его голове[b]. Пока не завершатся дни, на которые он отделил себя для Яхве, он должен быть свят; пусть он отращивает нестриженые волосы на голове.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обета своего отделения (посвящения)». Еврейское слово, связанное с названием назорея, выражает идею отделения и посвящения.'
    reason: lexical_alternative
  - marker: b
    text: То есть он не должен брить голову.
    reason: idiom_clarification
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: своего назорейского обета
  rationale: «Назорейский обет» — ясное и принятое в русском библейском употреблении обозначение особого обета из данного контекста; сноска сохраняет заложенную в корне идею отделения и посвящения.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: он не должен касаться головы бритвой
  rationale: Естественно передаёт запрет брить голову и сохраняет образ бритвы, хотя буквально еврейский текст говорит, что бритва не должна «проходить по» голове.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: пока не завершатся дни
  rationale: Передаёт значение полноты и завершения установленного срока современным литературным русским языком.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: на которые он отделил себя для Яхве
  rationale: Сохраняет значение отделения или посвящения в породе hifil и связь с понятием назорейства, не сводя выражение лишь к общему посвящению.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל обозначает направленность отделения и посвящения Богу; «для» звучит естественно по-русски. Имя יהוה передано как «Яхве».
- source_word: קָדֹשׁ יִהְיֶה
  choice: он должен быть свят
  rationale: Сохраняет прямое и богословски значимое значение קָדֹשׁ, не заменяя его пояснительными словами «посвящён» или «отделён».
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: пусть он отращивает волосы на голове
  rationale: Естественно выражает требование оставлять волосы нестрижеными и позволять им расти; контекст запрета бритвы уточняет характер этого роста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено личное заветное имя יהוה; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Передача קָדֹשׁ в контексте назорейского обета
  choice: он должен быть свят
  alternative: он должен быть посвящён / отделён
  rationale: Еврейский текст использует именно богословски весомое слово קָדֹשׁ; контекст уже раскрывает, в чём проявляется отделённость назорея.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Технический термин «назорейский обет» сохранён, но пояснён в сноске. Буквальный древнееврейский образ бритвы вынесен в сноску, а основной текст сформулирован естественно и однозначно.
