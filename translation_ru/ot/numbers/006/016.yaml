  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: ru
  text: И священник представит их пред Яхве[a] и принесёт его жертву за грех[b] и его всесожжение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подведёт их пред Яхве». Еврейский глагол может подчёркивать приближение и представление жертв перед Богом до их принесения.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «жертва за грех» в священнической жертвенной терминологии можно также понимать как «очистительная жертва».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: представит
  rationale: Глагол קרב в породе хифиль означает «приблизить, подвести, представить». Здесь он обозначает представление жертв перед Богом и отличается от последующего действия וְעָשָׂה.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный русский эквивалент כֹּהֵן в контексте богослужения.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי указывает на нахождение или действие перед Богом, в Его присутствии; יהוה передано личным именем «Яхве».
- source_word: וְעָשָׂה
  choice: и принесёт
  rationale: Хотя עשה буквально значит «делать, совершать», с названиями жертв это глагол жертвоприношения; «принесёт» естественно звучит по-русски.
- source_word: אֶת חַטָּאתוֹ
  choice: его жертву за грех
  rationale: В жертвенном законодательстве חַטָּאת обозначает жертву, связанную с грехом и очищением. Традиционное «жертва за грех» оставлено в тексте, а возможное значение «очистительная жертва» отмечено в сноске.
- source_word: וְאֶת עֹלָתוֹ
  choice: и его всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» является точным и привычным библейским термином.
- source_word: implicit object of וְהִקְרִיב
  choice: их
  rationale: В еврейском тексте прямое дополнение не выражено и восстанавливается из предыдущего стиха. Местоимение «их» сохраняет эту контекстуальную связь, не уточняя предметы сверх оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Передача «Яхве» сохраняет различие между именем и титулом.
- issue: Значение חַטָּאת в священнической терминологии
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Оба перевода отражают стороны значения термина. В основном тексте использовано общепонятное традиционное обозначение, а очистительная функция сохранена как допустимая альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Форма «пред Яхве» сохраняет краткость и культовый характер выражения; местоимение «его» оставляет явную в оригинале принадлежность жертв назорею и не заменяется поясняющим существительным.
