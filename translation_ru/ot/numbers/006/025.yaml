  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: ru
  text: Да озарит тебя Яхве светом Своего лица и будет милостив к тебе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да даст Яхве сиять Своему лицу в твою сторону и окажет тебе благоволение».'
    reason: Передаёт каузативный оттенок יָאֵר, направленность אֵלֶיךָ и возможное значение חנן, не приписывая исходному тексту иной смысл.
lexical_decisions:
- source_word: יָאֵר
  choice: да озарит… светом
  rationale: Хифиль, юссив от אוֹר выражает пожелание в благословении и имеет каузативный оттенок. Русское «да озарит… светом» естественно передаёт и пожелание, и образ сияния.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: פָּנָיו
  choice: Своего лица
  rationale: Сохранён конкретный антропоморфный образ лица, выражающий благосклонное присутствие Бога; он не сведён к отвлечённому толкованию.
- source_word: אֵלֶיךָ
  choice: тебя
  rationale: Направленность действия к адресату естественно выражена русским винительным падежом при глаголе «озарить»; буквальное «к тебе» дано в сноске.
- source_word: וִיחֻנֶּךָּ
  choice: и будет милостив к тебе
  rationale: Глагол חנן означает проявить благосклонность или милость. Формулировка сохраняет молитвенно-благословляющий регистр и не сужает значение до жалости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Антропоморфный образ сияющего лица
  choice: Сохранить образ лица и света
  alternative: Да будет Яхве благосклонен к тебе
  rationale: Образ обозначает божественное благоволение и присутствие, но исходный поэтический язык не следует заменять одним лишь абстрактным толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем благословения. Частица «да» сохраняет значение пожелания; архаизмы вроде «лик» и «призрит» не используются.
