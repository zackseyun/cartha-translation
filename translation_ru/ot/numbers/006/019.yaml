base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: ru
  text: Затем священник возьмёт варёную лопатку барана, одну пресную лепёшку из корзины и одну тонкую пресную лепёшку и положит всё это на ладони назорея после того, как тот обреет свою посвящённую голову[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «после того, как он обреет своё посвящение». Здесь имеются в виду волосы или голова, служившие знаком назорейского посвящения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем … возьмёт
  rationale: В последовательности обрядовых предписаний waw с перфектом передаёт очередное действие; русское «затем» и будущее время естественно выражают эту последовательность.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: варёную лопатку
  rationale: זְרוֹעַ обозначает переднюю часть туши, плечо или лопатку, а בְּשֵׁלָה указывает, что она сварена. «Лопатка» точно и понятно называет мясную часть.
- source_word: חַלַּת מַצָּה אַחַת
  choice: один пресный хлеб
  rationale: חַלָּה здесь — отдельный хлеб или каравай, а מַצָּה указывает на отсутствие закваски. Формулировка отличает его от следующего тонкого хлебного изделия.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: одну тонкую пресную лепёшку
  rationale: רָקִיק обозначает тонкое хлебное изделие; добавление «тонкую» сохраняет смысловое отличие от חַלָּה.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: и положит всё это на ладони
  rationale: כַּפַּיִם означает именно ладони; «всё это» естественно объединяет перечисленные предметы, не меняя их состава.
- source_word: הַנָּזִיר
  choice: назорей
  rationale: Устоявшееся русское обозначение человека, связанного назорейским обетом.
- source_word: אַחַר הִתְגַּלְּחוֹ אֶת נִזְרוֹ
  choice: после того, как тот обреет посвящённую Богу голову
  rationale: Буквально объект бритья назван «его посвящением»; в данном обряде это метонимически относится к волосам или голове, служившим видимым знаком назорейского посвящения.
theological_decisions:
- issue: Значение נִזְרוֹ при описании бритья назорея
  choice: посвящённую Богу голову
  alternative: своё посвящение; волосы своего посвящения
  rationale: Еврейский текст сохраняет связь волос с посвящением, но буквальное «обреет своё посвящение» по-русски непонятно. Выбранный вариант передаёт телесную сторону обряда и его направленность к Богу, не вводя дополнительного догматического толкования; буквальная особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной обрядовой лексикой. Синтаксис сохраняет последовательность действий и конкретный образ ладоней; редкий термин «назорей» оставлен как устоявшийся библейский термин.
