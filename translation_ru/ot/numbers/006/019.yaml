revisions:
- from: Затем священник возьмёт варёную лопатку барана, один пресный хлеб из корзины и одну тонкую пресную лепёшку и положит всё это на ладони назорея после того, как тот обреет посвящённую Богу голову[a].
  to: Затем священник возьмёт варёную лопатку барана, одну пресную лепёшку из корзины и одну тонкую пресную лепёшку и положит всё это на ладони назорея после того, как тот обреет свою посвящённую голову[a].
