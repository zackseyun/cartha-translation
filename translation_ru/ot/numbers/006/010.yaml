lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: А на восьмой день
  rationale: Союз и временной оборот передают продолжение последовательных предписаний; «на восьмой день» естественно для современного русского языка.
- source_word: יָבִא
  choice: пусть он принесёт
  rationale: Каузативная форма глагола בוא в контексте предписания выражает обязанность; конструкция с «пусть» сохраняет нормативный тон без архаического «да принесёт».
- source_word: שְׁתֵּי תֹרִים
  choice: двух горлиц
  rationale: תֹר обозначает горлицу, а не голубя вообще; выбран точный и общеупотребительный русский эквивалент.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: двух молодых голубей
  rationale: Буквально «двух сыновей голубя» — это еврейское обозначение молодых голубей; смысл передан естественным русским выражением, а буквальная форма отмечена в сноске.
- source_word: אֶל הַכֹּהֵן
  choice: к священнику
  rationale: Предлог אֶל здесь обозначает направление принесения; «к священнику» естественно передаёт синтаксическую связь.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: פֶּתַח — «вход», а אֹהֶל מוֹעֵד — устойчивое название священного шатра. «Шатёр встречи» близко к строению и смыслу еврейского выражения и понятно современному читателю.
