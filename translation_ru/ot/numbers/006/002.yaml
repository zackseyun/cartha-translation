base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: ru
  text: '«Скажи сынам Израиля: если мужчина или женщина даст особый обет[a] — обет назорея, чтобы посвятить себя Яхве[b], —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отделит себя, дав назорейский обет».'
    reason: lexical_alternative
  - marker: b
    text: Назорей — человек, особо посвящавший себя Яхве по обету; назореем мог быть мужчина или женщина.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-родовой образ еврейского выражения; форма «сыны» уместна в современном литературном библейском регистре.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: мужчина или женщина
  rationale: Исходный текст прямо называет оба пола, поэтому это уточнение сохранено.
- source_word: כִּי
  choice: если
  rationale: В формулировке закона частица вводит условный случай; русское «если» естественно передаёт этот смысл.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: даст особый обет
  rationale: Hiphil יַפְלִא указывает на особый, исключительный акт, а сочетание инфинитива с однокоренным существительным обозначает принесение обета.
- source_word: נֶדֶר נָזִיר
  choice: обет назорея
  rationale: Сохраняет конструктивную связь и традиционный русский термин для установленного здесь вида посвящения.
- source_word: לְהַזִּיר
  choice: чтобы посвятить себя
  rationale: Передаёт целенаправленное отделение человека для Бога, не сводя значение лишь к внешнему воздержанию.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, непосредственно представленное тетраграмматоном יהוה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Связь назорейства с посвящением и отделением
  choice: посвятить себя Яхве
  alternative: отделить себя для Яхве
  rationale: «Посвятить» естественно по-русски выражает сакральную направленность действия, тогда как примечание сохраняет оттенок особого отделения.
- issue: Гендерная применимость предписания
  choice: мужчина или женщина; возвратное «себя»
  alternative: кто-либо; себя
  rationale: Прямое упоминание обоих полов сохранено, а нейтральное возвратное местоимение не вводит мужской род там, где закон относится и к женщине.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет незавершённость исходного стиха, поскольку последующие предписания продолжают условную конструкцию.
