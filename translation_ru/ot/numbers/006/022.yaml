lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным ו вводит новый шаг повествования. В русской формуле введения прямой речи «сказал» естественно передаёт דבר и позволяет без тяжеловесного «говоря» перейти к содержанию речи в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяется титулом.
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Предлог обозначает адресата речи; в современном русском это естественно выражается дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей / Моисею
  rationale: Используется устоявшаяся русская форма библейского имени, здесь в дательном падеже.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив «сказать» вводит последующую прямую речь. В современном русском его функцию естественно и точно передаёт двоеточие, без неидиоматичного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH. Форма «Яхве» сохраняет имя и наиболее общепринято отражает его вероятное произношение; традиционная замена «ГОСПОДЬ» отмечена в сноске.
translation_notes:
  register: Современный литературный русский, краткая и dignified повествовательная формула. Союз «И» сохраняет связь с предшествующим повествованием. Двоеточие подготавливает прямую речь следующего стиха.
