  terminology: «Закон», «назорей», «обет», «приношение» и «Яхве» уместны. «Назорейство» сохраняет техническую широту נֵזֶר; выражение «в связи со своим назорейством» точнее и естественнее передаёт עַל в данном контексте, не сводя его только к самому акту обета.
