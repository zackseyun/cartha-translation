  source_fidelity: В целом переданы правовой характер תּוֹרָה, технический термин «назорей», имя Яхве и указание на материальные возможности. Однако «какой обет он даст, так и должен поступить» неточно передаёт כְּפִי («согласно, в соответствии с»), а «за его назорейство» звучит неестественно и несколько неясно в связи с приношением.
