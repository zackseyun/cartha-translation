id: NUM.6.21
reference: Numbers 6:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: ru
  text: 'Вот закон о назорее, который даёт обет: его приношение Яхве в связи со своим назорейством — помимо того, что позволяют ему средства.[a] Согласно обету, который он даст, он должен поступить по закону о своём назорействе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кроме того, чего достигнет его рука»; то есть помимо того, что он может предоставить по своим средствам.'
    reason: Сохраняет еврейскую идиому и поясняет её значение в контексте материальных возможностей.
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: закон о назорее
  rationale: תּוֹרָה здесь обозначает установленное предписание, а «назорей» — укоренившийся русский библейский термин для человека, принявшего описанный в главе обет посвящения.
- source_word: אֲשֶׁר יִדֹּר
  choice: который даст обет
  rationale: Будущая форма в нормативном контексте естественно передаётся по-русски как «даст обет» и сохраняет глагольную связь с последующим נִדְרוֹ.
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: его приношение Яхве
  rationale: קָרְבָּן — общее культовое приношение; ל обозначает адресата или посвящение. Имя יהוה передано как «Яхве».
- source_word: עַל נִזְרוֹ
  choice: за его назорейство
  rationale: В данном контексте נֵזֶר обозначает состояние и срок особого назорейского посвящения. «За» естественно связывает требуемое приношение с этим посвящением, не сводя само слово только к акту обета.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: сверх того, что позволят ему средства
  rationale: Идиома буквально говорит о том, чего «достигнет его рука», то есть что доступно человеку по средствам. Основной текст передаёт смысл, а буквальный образ сохранён в примечании.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: какой обет он даст
  rationale: כְּפִי выражает соответствие содержанию обета. Русская конструкция сохраняет повтор корня «обет», не становясь тяжеловесной.
- source_word: כֵּן יַעֲשֶׂה
  choice: так и должен поступить
  rationale: Форма выражает нормативное обязательство; «должен» яснее передаёт юридическую силу, чем простое будущее «так и поступит».
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: по закону о своём назорействе
  rationale: Заключительная формула возвращает требование к установленному порядку назорейства; «по закону» естественно передаёт нормативную связь.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерационная форма «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Значение נִזְרוֹ / נִזְרֹו в стихе
  choice: назорейство
  alternative: назорейский обет; посвящение; отделение
  rationale: Слово охватывает не только произнесённый обет, но и обусловленное им состояние посвящения. «Назорейство» сохраняет технический характер и не устраняет эту смысловую широту.
- issue: Связь дополнительного приношения со средствами человека
  choice: сверх того, что позволят ему средства
  alternative: кроме того, что сможет предоставить его рука
  rationale: Фраза допускает идиоматическое понимание материальной возможности. Оно отражено в тексте, тогда как буквальная телесная метафора отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис упрощён лишь там, где буквальное воспроизведение затемняло бы связи; повтор слова «обет» и рамочное повторение «закона» сохранены. Технический термин «назорей» оставлен без конфессионального уточнения.
