    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма wayyiqtol продолжает повествование. В русской формуле введения прямой речи «сказал» естественно передаёт דבר при последующем לֵאמֹר, не утрачивая смысла речевого акта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан распространённой русской транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Предлог אֶל обозначает адресата речи; русский дательный падеж передаёт эту связь естественно и точно.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данной формуле инфинитив вводит содержание последующей речи. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH. «Яхве» сохраняет имя и не подменяет его титулом; вариант «Иегова» основан на более поздней традиционной форме.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула введения божественной речи. Двоеточие идиоматично вводит содержание речи, начинающееся в следующем стихе.
