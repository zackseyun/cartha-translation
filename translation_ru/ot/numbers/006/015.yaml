  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: ru
  text: 'и корзину с пресным хлебом: лепёшками из муки тонкого помола, смешанной с маслом[a], и тонкими пресными лепёшками, смазанными маслом[b], вместе с их хлебным приношением и возлияниями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пресными лепёшками» — при первом употреблении слова מַצּוֹת. Еврейское слово имеет широкое значение, а затем стих уточняет, что в эту категорию входят лепёшки и тонкие лепёшки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «помазанными маслом». В еврейском тексте употреблён обычный глагол со значением «помазывать», но здесь он описывает нанесение масла при приготовлении хлебных изделий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: корзина
  rationale: Обычное и точное обозначение сосуда, в котором находились пресные хлебные изделия.
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Первое употребление обозначает общую категорию пресных изделий, далее конкретизированную как лепёшки и пластинки.
- source_word: סֹלֶת
  choice: тонкая мука
  rationale: Устоявшееся в жертвенном контексте обозначение муки тонкого помола; выражение понятно современному читателю.
- source_word: חַלֹּת
  choice: лепёшки
  rationale: В данном обрядовом контексте речь идёт о сформованных хлебных изделиях, а не о больших современных буханках.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Причастие указывает на соединение муки с маслом; согласование с «мукой» естественно для русского языка и сохраняет смысл приготовления изделий.
- source_word: רְקִיקֵי מַצּוֹת
  choice: пресные пластинки
  rationale: רְקִיקִים обозначает тонкие плоские хлебные изделия; «пластинки» передаёт их форму без современного кондитерского оттенка слова «вафли».
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: помазанными маслом
  rationale: Сохраняется обычное значение глагола משׁח и его лексическая связь с помазанием, тогда как сноска поясняет бытовой смысл нанесения масла на изделия.
- source_word: מִנְחָתָם
  choice: их хлебное приношение
  rationale: В жертвенном законодательстве מִנְחָה обозначает приношение из зерновых продуктов; «хлебное приношение» — понятный и достаточно точный русский культовый термин. Местоименный суффикс сохранён.
- source_word: נִסְכֵּיהֶם
  choice: возлияниями
  rationale: Стандартный русский термин для жидких приношений, выливаемых при жертвоприношении; множественное число оригинала сохранено.
