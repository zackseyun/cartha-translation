  text: May Yahweh bless you and keep you[a].
translation:
  language: ru
  text: Да благословит тебя Яхве и сохранит тебя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится «Господь».'
    reason: Указывает еврейскую форму божественного имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Да благословит тебя
  rationale: Пиэль, юссив 3-го лица мужского рода единственного числа от ברך с суффиксом 2-го лица мужского рода единственного числа. Конструкция с «да» естественно передаёт в русском языке пожелание-благословение, а не простое будущее или повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление имени Бога в еврейском тексте; форма «Яхве» общепринята в современной русской библеистике.
- source_word: וְיִשְׁמְרֶךָ
  choice: и сохранит тебя
  rationale: Каль, юссив 3-го лица мужского рода единственного числа от שמר с суффиксом 2-го лица мужского рода единственного числа. «Сохранит тебя» кратко и естественно выражает защиту и оберегание, сохраняя поэтический параллелизм.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом; примечание сообщает читателю традиционный вариант перевода.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формула благословения. Двойное «тебя» сохранено ради соответствия двум еврейским местоименным суффиксам и ясного параллелизма.
