  - marker: b
    text: 'Буквально: «Вот слово, которое повелел Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда Моисей сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию, а «сказал» точно вводит обращённую речь.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: главам колен
  rationale: רָאשֵׁי буквально обозначает «глав» или руководителей, а מַטּוֹת здесь — племенные подразделения Израиля, то есть колена.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранён родственный и грамматически мужской образ исходного выражения; сочетание «колен сынов Израиля» понятно в современном литературном русском.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В русском языке функцию еврейского инфинитива, вводящего прямую речь, естественно выполняет двоеточие; отдельное «говоря» звучало бы тяжеловесно.
- source_word: זֶה הַדָּבָר
  choice: Вот слово
  rationale: דָּבָר допускает значения «слово», «дело» и «то, что сказано». «Вот слово» сохраняет формальную связь с авторитетным божественным изречением, не устраняя многозначность.
- source_word: צִוָּה
  choice: повелел
  rationale: Совершенный вид передаёт завершённое повеление, которое Моисей теперь сообщает народу; «повелел» соответствует торжественному контексту закона.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Родственное выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: В основном тексте форма поставлена в требуемый падеж — «сынов Израиля» — и сохраняет семейно-заветный образ оригинала; более идиоматичный этноним дан в примечании.
- issue: Многозначность דָּבָר в формуле повеления
  choice: слово
  alternative: то, что
  rationale: «Слово» сохраняет форму и смысл авторитетного изречения, тогда как «вот что» естественнее по-русски, но менее прозрачно отражает лексику оригинала.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён естественным для русского языка введением прямой речи, при этом ключевые образы «главы колен», «сыны Израиля» и «слово» сохранены.
