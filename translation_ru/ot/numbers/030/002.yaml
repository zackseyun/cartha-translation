  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: ru
  text: 'Моисей обратился к главам колен сынов Израиля[a]: «Вот что повелел Яхве[b]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «главам израильских колен». Буквально: «главам колен сынов Израиля».'
