base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: ru
  text: Если мужчина даст обет Яхве или поклянётся, приняв на себя обязательство[a], он не должен нарушать своё слово[b]; он должен исполнить всё, что исходит из его уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «связав себя обязательством».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не должен осквернять своё слово».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: мужчина
  rationale: Мужской род оригинала сохранён в правовом постановлении; дальнейший контекст главы отдельно говорит об обетах женщин.
- source_word: יִדֹּר נֶדֶר
  choice: даст обет
  rationale: Естественно передаёт однокоренную конструкцию «обещать обет» и её торжественно-правовой смысл.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: поклянётся
  rationale: Русский глагол естественно выражает еврейскую однокоренную конструкцию «поклясться клятвой».
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: возложив на себя обязательство
  rationale: Передаёт смысл добровольного самообязывания без неестественного русского повтора «связать себя связью».
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: не должен нарушать своё слово
  rationale: В данном контексте Hiphil от חלל означает сделать слово несвятым, то есть нарушить его; модальная конструкция ясно выражает запрет.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: пусть исполнит всё, что вышло из его уст
  rationale: Сохраняет конкретный образ исходящих из уст слов и передаёт обязательную силу формы יַעֲשֶׂה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте употреблено собственное covenantное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл לֹא יַחֵל דְּבָרוֹ
  choice: не должен нарушать своё слово
  alternative: не должен осквернять своё слово
  rationale: Основной текст передаёт контекстуальный смысл запрета, а буквальный сакральный оттенок сохранён в примечании, не устраняя его богословской значимости.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и сакрального контекста. Сохранены мужской субъект, личное имя Яхве и образ слов, выходящих из уст; громоздкие еврейские однокоренные повторы переданы естественными русскими формулами.
