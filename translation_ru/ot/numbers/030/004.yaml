    text: 'Буквально: «свяжет обязательство»; в еврейском употреблены однокоренные глагол и существительное, подчёркивающие обязательную силу принятого обещания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: Если женщина
  rationale: В контексте казуистического закона сочетание вводит условный случай; по-русски естественно начать с «Если женщина».
- source_word: תִדֹּר נֶדֶר
  choice: даст обет
  rationale: Однокоренная конструкция буквально означает «даст/произнесёт обет»; естественное русское юридико-религиозное выражение «дать обет» передаёт формальный акт без неуклюжего повтора.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное имя יהוה, непосредственно употреблённое в еврейском тексте.
- source_word: וְאָסְרָה אִסָּר
  choice: и возложит на себя обязательство
  rationale: Глагол с однокоренным существительным обозначает принятие на себя связывающего обязательства; перевод сохраняет возвратный смысл и отличает его от נֶדֶר, «обета».
- source_word: בְּבֵית אָבִיהָ
  choice: живя в доме своего отца
  rationale: Локативная фраза указывает на пребывание в отцовском доме; деепричастная форма естественно связывает это обстоятельство с условием.
- source_word: בִּנְעֻרֶיהָ
  choice: в юности
  rationale: Формально передаёт указание на период молодости, не добавляя прямо не выраженного в стихе толкования о брачном статусе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному актуальному решению проекта.
- issue: Соотношение נֶדֶר и אִסָּר
  choice: обет и обязательство как различимые понятия
  alternative: передать оба выражения словом «обет»
  rationale: Еврейский текст использует разные существительные. Их различение не снимает возможного смыслового пересечения и сохраняет юридическую напряжённость формулировки.
