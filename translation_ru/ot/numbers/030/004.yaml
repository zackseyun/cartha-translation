  text: Если женщина, находясь в доме своего отца в юности, даст обет Яхве[a] и примет на себя обязательство[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте употреблено имя Бога יהוה (Яхве).
