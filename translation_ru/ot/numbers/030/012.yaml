  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: ru
  text: Если же её муж услышит и промолчит, не отменив её обета[a], то все её обеты останутся в силе, и всякое обязательство, которым она связала себя, останется в силе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не воспрепятствовав ей» или «не отменив её». По контексту речь идёт о том, что муж не лишает силы её обет или принятое ею обязательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Если же ... услышит
  rationale: В казуистическом законодательном контексте форма продолжает условную конструкцию; русское «если» естественно выражает это условие, а «же» связывает стих с предшествующим случаем.
- source_word: אִישָׁהּ
  choice: её муж
  rationale: В данном брачно-правовом контексте אִישׁ с суффиксом обозначает мужа женщины, а не мужчину вообще.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: и промолчит
  rationale: Глагол обозначает молчание в ответ на услышанное. «Промолчит» кратко и естественно передаёт юридически значимое отсутствие возражения.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: не отменив её обета
  rationale: В контексте главы каузативная форма выражает воспрепятствование или лишение силы. Для ясности назван подразумеваемый обет, хотя непосредственным объектом в еврейском тексте является сама женщина; это отмечено в сноске.
- source_word: וְקָמוּ כָּל נְדָרֶיהָ
  choice: то все её обеты останутся в силе
  rationale: קום в правовом употреблении означает сохранение действительности и обязательной силы; русское «останутся в силе» ясно передаёт юридический смысл.
- source_word: וְכָל אִסָּר
  choice: и всякое обязательство
  rationale: אִסָּר здесь означает связывающее человека самоограничение или обязательство. «Обязательство» понятно современному читателю и сохраняет отличие от נֶדֶר, «обета».
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: которым она связала себя
  rationale: Перевод сохраняет еврейскую метафору связывания себя обязательством и одновременно звучит понятно по-русски.
- source_word: יָקוּם
  choice: останется в силе
  rationale: Повтор формулы сохраняет параллелизм оригинала и точно выражает юридическую действительность обязательства.
