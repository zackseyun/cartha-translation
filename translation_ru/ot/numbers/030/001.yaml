    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычное значение глагола — «сказал». В данном повествовательном резюме эта форма естественна по-русски и не превращает сообщение в прямую речь.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное устойчивое заветное обозначение народа; грамматический мужской род исходного выражения не нейтрализован.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё в соответствии с тем, что
  rationale: Предлог כְּ выражает соответствие сказанного Моисеем полученному повелению, а не только содержание речи.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» точно передаёт властный характер צוה и подходит к возвышенному, но современному литературному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: Русское управление глагола «повелеть» требует дательного падежа; повтор имени Моисея сохранён вслед за еврейским текстом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Основной текст сохраняет мужскую форму и традиционную структуру еврейского национально-заветного обозначения; примечание поясняет его смысл и возможную идиоматическую передачу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет выраженное предлогом כְּ соответствие Божьему повелению и повтор имени Моисея, не добавляя прямой речи.
