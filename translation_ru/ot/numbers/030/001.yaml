  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: ru
  text: Моисей сказал сынам Израиля согласно всему, что Яхве повелел Моисею[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
