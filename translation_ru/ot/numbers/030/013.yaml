base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: ru
  text: Но если муж действительно отменит их в тот день, когда услышит, то ни обеты, данные ею[a], ни обязательство, которым она связала себя[b], не останутся в силе. Муж отменил их, и Яхве[c] простит её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь исход её уст»; это юридическое выражение охватывает все произнесённые ею обязательства.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «связывающее её обязательство» или «обязательство, наложенное ею на себя».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте стоит יהוה (YHWH), личное имя Бога, традиционно также передаваемое как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условие и его контраст с предшествующим случаем.
- source_word: הָפֵר יָפֵר
  choice: действительно отменит
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол; «действительно» естественно передаёт это подчёркивание, не добавляя идеи иной степени или способа отмены.
- source_word: אִישָׁהּ
  choice: муж
  rationale: В данном брачно-правовом контексте слово обозначает мужа женщины.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: в тот день, когда услышит
  rationale: Сохраняет юридически значимое указание на день, в который муж узнаёт об обязательстве.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: всё исходящее из её уст
  rationale: Близко передаёт буквальный образ и вместе с последующим отрицанием охватывает все произнесённые ею обязательства.
- source_word: לִנְדָרֶיהָ
  choice: её обеты
  rationale: Обычное и точное обозначение религиозно-правовых обетов.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: обязательство, которым она связала себя
  rationale: Передаёт и обязательный характер, и возвратный смысл выражения, буквально говорящего о связывании себя.
- source_word: לֹא יָקוּם
  choice: не останется в силе
  rationale: Естественная русская юридическая формула для обязательства, которое более не действительно.
- source_word: הֲפֵרָם
  choice: отменил их
  rationale: Совершенный вид выражает завершённое и юридически действенное решение мужа.
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Передаёт личное имя Бога, записанное тетраграмматоном יהוה.
- source_word: יִסְלַח לָהּ
  choice: простит её
  rationale: Прямо передаёт глагол סלח, не уточняя сверх текста основание или предмет прощения.
theological_decisions:
- issue: Смысл прощения после отмены обетов
  choice: 'Сохранена последовательность текста: муж отменяет обязательства, они утрачивают силу, и Яхве прощает женщину.'
  alternative: Уточнить, что прощается неисполнение обета, либо необдуманность при его принесении.
  rationale: Сам стих не называет прямо, что именно требует прощения; перевод сохраняет эту богословскую недосказанность и не вводит дополнительного толкования.
