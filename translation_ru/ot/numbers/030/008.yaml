base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: ru
  text: Если же муж услышит об этом в тот день, когда он услышит об этом, и промолчит[a], то её обеты останутся в силе, и обязательства[b], которыми она связала себя, останутся в силе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет молчать ей». В данном законе молчание мужа означает, что он не возражает против обета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «самоограничения»; еврейское слово обозначает связывающие обязательства, которые человек возлагает на себя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Если же ... услышит
  rationale: В контексте казуистического закона форма продолжает условную конструкцию; по-русски это естественно передаётся условным «если же».
- source_word: אִישָׁהּ
  choice: муж
  rationale: В данном брачно-правовом контексте אִישׁ с суффиксом 3-го лица женского рода означает именно мужа.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: в тот день, когда узнает
  rationale: Сохраняет юридически значимое указание на день получения известия; «узнает» помогает естественно передать повтор глагола שׁמע в русском контексте.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: и промолчит, не возражая ей
  rationale: Глагол буквально обозначает молчание, а в этой правовой формуле — отсутствие возражения. Формулировка сохраняет образ и проясняет его функцию.
- source_word: וְקָמוּ / יָקֻמוּ
  choice: останутся в силе
  rationale: В юридическом контексте קום означает сохранение действительности обязательства. Одинаковый перевод обоих повторов воспроизводит структуру еврейского текста.
- source_word: נְדָרֶיהָ
  choice: её обеты
  rationale: Обычный и точный русский эквивалент נדרים в контексте религиозно-правовых обещаний.
- source_word: וֶאֱסָרֶהָ
  choice: обязательства
  rationale: Существительное обозначает связывающие человека самоограничения или обязательства; «обязательства» ясно передаёт их юридическую силу, а метафора связывания сохраняется в следующей части фразы.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: которыми она связала себя
  rationale: Передаёт еврейскую метафору самосвязывания и естественно звучит по-русски.
- source_word: נַפְשָׁהּ
  choice: себя
  rationale: Здесь נֶפֶשׁ употреблено возвратно и относится к самой женщине, а не отдельно к её душе.
theological_decisions: []
