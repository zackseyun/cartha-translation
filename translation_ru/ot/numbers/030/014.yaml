  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: ru
  text: Всякий обет и всякую клятву, обязывающие её изнурять себя[a], её муж может утвердить или отменить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изнурять душу»; возможно также: «отказывать себе» или «смирять себя». Выражение может подразумевать пост или другое добровольное самоограничение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: обет
  rationale: В религиозно-правовом контексте נֵדֶר обозначает торжественное обещание, данное Богу; «обет» — точный и привычный русский эквивалент.
- source_word: שְׁבֻעַת אִסָּר
  choice: клятва, связывающая обязательством
  rationale: Так переданы и формальный характер שְׁבֻעָה («клятва»), и ограничивающая, обязывающая сила אִסָּר. Развёрнутая формулировка естественнее по-русски, чем буквальное «клятва уз».
- source_word: לְעַנֹּת נָפֶשׁ
  choice: изнурять себя
  rationale: Еврейское выражение буквально говорит об «изнурении души», но обозначает добровольное самоограничение или смирение, нередко пост. Основной текст передаёт смысл естественно, а буквальный образ и иные оттенки сохранены в сноске.
- source_word: נָפֶשׁ
  choice: себя
  rationale: В составе устойчивого выражения נֶפֶשׁ относится ко всей личности, а не только к нематериальной «душе»; возвратное «себя» ясно передаёт это значение в современном русском языке.
- source_word: אִישָׁהּ
  choice: её муж
  rationale: В данном брачно-правовом контексте אִישׁ с суффиксом 3-го лица женского рода однозначно обозначает мужа женщины.
- source_word: יְקִימֶנּוּ
  choice: может утвердить
  rationale: Порода hифиль от קום здесь означает признать обет или клятву сохраняющими силу. «Утвердить» передаёт юридический смысл и сочетается с «отменить».
- source_word: יְפֵרֶנּוּ
  choice: может отменить
  rationale: Порода hифиль от פרר в законодательстве об обетах означает лишить обязательство силы. «Отменить» звучит естественно и точно по-русски.
- source_word: כָּל ... וְכָל
  choice: всякий ... и всякую ...
  rationale: Повтор כָּל подчёркивает полноту обеих категорий; русская конструкция сохраняет это распределительное значение.
theological_decisions:
- issue: Модальная сила יְקִימֶנּוּ и יְפֵרֶנּוּ
  choice: может утвердить или отменить
  alternative: утвердит и отменит
  rationale: В контексте правового установления формы выражают предоставленное мужу право выбрать одно из двух действий, а не утверждают, что он непременно совершит оба. Союз «или» естественно выявляет взаимоисключающую альтернативу, подразумеваемую контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, соответствующим правовому контексту. Синтаксис упрощён без устранения двух категорий обязательств; местоимение «её» сохраняет связь с женщиной, о которой говорится в ближайшем контексте.
