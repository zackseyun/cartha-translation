  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: ru
  text: Вот постановления, которые Яхве повелел Моисею о муже и его жене, об отце и его дочери, когда она ещё молода и живёт в доме своего отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в её молодости, в доме её отца».'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Вот постановления
  rationale: Указательное אֵלֶּה вводит заключительное резюме, а חֻקִּים обозначает установленные правовые предписания; «постановления» естественно передаёт юридический регистр.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: которые Яхве дал Моисею
  rationale: Глагол צוה означает «повелевать, предписывать». В сочетании с «постановлениями» русское «дал Моисею» избегает тяжеловесности, сохраняя смысл установления по Божьему повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: об отношениях между мужем и его женой
  rationale: בֵּין буквально значит «между», а в заключительном правовом резюме обозначает сферу отношений, регулируемую постановлениями. אִישׁ в паре с «его женой» контекстуально означает мужа.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: и между отцом и его дочерью
  rationale: Сохранена параллельная конструкция с בֵּין и конкретные родственные обозначения исходного текста.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: пока она молода и живёт в доме своего отца
  rationale: Фраза описывает период молодости дочери в отцовском доме. Глагол «живёт» контекстуально восполняет безглагольную связь и делает русский текст ясным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Значение אִישׁ в брачной паре
  choice: муж
  alternative: мужчина
  rationale: Притяжательное «его жена» однозначно задаёт супружеский контекст; «муж» естественнее по-русски и не устраняет гендерную конкретность текста.
- issue: Сфера власти или сфера отношений
  choice: об отношениях между
  alternative: между
  rationale: Стих подводит итог правилам об обетах в семейных отношениях. Формулировка не добавляет утверждения об абсолютной власти отца или мужа, но сохраняет правовую направленность предписаний.
translation_notes:
  register: Современный литературный русский с ясным юридическим оттенком. Синтаксис сглажен для естественности, при этом сохранены параллельные семейные пары и конкретные родственные термины.
