base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: ru
  text: И если её отец услышит о её обете и о принятом ею на себя обязательстве[a] и ничего ей не скажет[b], то все её обеты останутся в силе, и всякое обязательство, которое она приняла на себя, останется в силе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наложенном ею на себя запрете». Еврейское אִסָּר обозначает связывающее самоограничение или обязательство и отличается от слова «обет», хотя эти понятия близки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и её отец хранил молчание по отношению к ней». Его молчание означает отсутствие возражения, поэтому обеты сохраняют силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: её обет / её обеты
  rationale: נדר в данном правовом и культовом контексте обозначает обет, данный Богу; «обет» — ясный и традиционный русский эквивалент.
- source_word: אִסָּר / אֱסָרָהּ
  choice: обязательство
  rationale: אִסָּר обозначает принятое на себя связывающее ограничение или обязательство и отличается от נדר. Отдельный русский термин сохраняет это различие без архаизации.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: приняла на себя
  rationale: Еврейская идиома буквально говорит о том, что женщина «связала» себя; по-русски юридический и возвратный смысл естественно передаётся выражением «приняла на себя».
- source_word: וְהֶחֱרִישׁ לָהּ אָבִיהָ
  choice: и промолчит
  rationale: Глагол означает молчать, не возражать. Краткая формулировка сохраняет образ молчания; его правовое значение пояснено в сноске.
- source_word: וְקָמוּ ... יָקוּם
  choice: останутся / останется в силе
  rationale: В правовом контексте קום означает сохранять действительность. «Остаться в силе» естественно передаёт юридический смысл.
- source_word: כָּל
  choice: все / всякое
  rationale: «Все» естественно сочетается с множественным «обеты», а «всякое» передаёт распределительное значение при единственном числе «обязательство».
- source_word: וְ
  choice: И если
  rationale: Начальный союз продолжает условно-правовую конструкцию предыдущего стиха; «и если» явно и естественно передаёт эту дискурсивную функцию.
