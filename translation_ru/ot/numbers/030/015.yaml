  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: ru
  text: Если же её муж продолжает молчать изо дня в день, то он утверждает все её обеты или все её обязательства[a], лежащие на ней. Он утвердил их, потому что промолчал в тот день, когда услышал о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все данные ею обязательные обещания». Еврейское слово обозначает принятые человеком обязательства, которые связывают его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: продолжает молчать
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольную идею; в соединении с «изо дня в день» эта формулировка естественно передаёт подчёркнутое и продолжающееся отсутствие возражения.
- source_word: אִישָׁהּ
  choice: её муж
  rationale: В данном брачно-правовом контексте это точное и естественное значение существительного с суффиксом 3-го лица женского рода.
- source_word: מִיּוֹם אֶל יוֹם
  choice: изо дня в день
  rationale: Устойчивое русское выражение передаёт продолжающееся молчание на протяжении последующих дней и сохраняет образ еврейского оборота.
- source_word: וְהֵקִים
  choice: то он утверждает
  rationale: 'Порода хифиль глагола קום здесь имеет юридический смысл: оставить обет в силе, утвердить его. «То» ясно выражает следствие условия.'
- source_word: נְדָרֶיהָ
  choice: её обеты
  rationale: Обычный и точный русский эквивалент נדר в правовом и культовом контексте.
- source_word: אֱסָרֶיהָ
  choice: её обязательства
  rationale: Существительное связано с идеей связывания и обозначает принятые на себя обязательства; выбранный вариант понятен современному читателю, а более буквальная альтернатива дана в сноске.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: лежащие на ней
  rationale: Формулировка сохраняет еврейскую метафору обязательств, которые «на» человеке, и её юридический оттенок.
- source_word: הֵקִים אֹתָם
  choice: Он утвердил их
  rationale: Совершенный вид подводит итог юридическому последствию его молчания и соответствует перфекту исходного текста.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз имеет причинное значение: молчание мужа в установленный срок объясняет, почему обязательства считаются утверждёнными.'
- source_word: הֶחֱרִשׁ לָהּ
  choice: промолчал
  rationale: Русский глагол естественно передаёт намеренное отсутствие возражения со стороны мужа; направленность по отношению к жене ясна из контекста.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: в тот день, когда услышал о них
  rationale: Сохраняется повторяющаяся в главе юридически значимая временная формула; «о них» проясняет подразумеваемый объект слуха из ближайшего контекста.
