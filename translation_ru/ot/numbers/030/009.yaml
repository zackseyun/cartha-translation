  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: ru
  text: Но если в тот день, когда её муж услышит об этом, он воспротивится ей и отменит её обет, лежащий на ней, и необдуманное слово её уст[a], которым она связала себя, то Яхве простит её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово её уст»; возможно: «обязывающее слово её уст».'
    reason: Лексическое значение מִבְטָא в этом контексте допускает как нейтральное «высказывание», так и оттенок поспешного либо обязывающего обещания.
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условие противопоставлено предыдущему случаю; «но если» передаёт и условность, и контраст.
- source_word: בְּיוֹם שְׁמֹעַ אִישָׁהּ
  choice: в тот день, когда её муж услышит об этом
  rationale: Оборот с בְּיוֹם указывает на время, когда муж узнаёт об обете; подразумеваемое дополнение естественно выражено словами «об этом».
- source_word: יָנִיא אֹתָהּ
  choice: он воспротивится ей
  rationale: Hiphil глагола נוא здесь означает воспрепятствовать осуществлению обязательства или не допустить его силы. Формулировка сохраняет личное дополнение «ей» и не смешивает это действие с последующей юридической отменой.
- source_word: וְהֵפֵר
  choice: и отменит
  rationale: В правовом контексте обетов הפר означает лишить обязательство силы, отменить его.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: её обет, лежащий на ней
  rationale: Сохранён еврейский образ обязательства, лежащего на человеке; в русском он понятен и звучит достаточно естественно.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: необдуманное слово её уст
  rationale: מִבְטָא обозначает произнесённое слово или высказывание и в данном контексте может подразумевать поспешное самообязывающее обещание. Буквальный образ «уст» сохранён, а неопределённость оттенка отмечена в сноске.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: которым она связала себя
  rationale: Идиома означает возложить обязательство на саму себя; «связала себя» сохраняет юридическую метафору оригинала.
- source_word: וַיהוָה יִסְלַח לָהּ
  choice: то Яхве простит её
  rationale: Личное имя יהוה передано как «Яхве», а סלח — обычным для данного богословско-правового контекста глаголом «простит».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Оттенок выражения מִבְטָא שְׂפָתֶיהָ
  choice: необдуманное слово её уст
  alternative: слово её уст; обязывающее слово её уст
  rationale: Контекст допускает оттенок поспешного обещания, но само существительное не устанавливает его совершенно однозначно; поэтому альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского контекста. Синтаксис остаётся близким к оригиналу, но временное условие и подразумеваемое дополнение выражены естественно для русского читателя.
