id: NUM.30.6
reference: Numbers 30:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: ru
  text: Но если отец запретит ей в тот день, когда услышит об этом, то ни один из её обетов и ни одно из обязательств[a], которыми она связала себя, не останется в силе[b]; и ГОСПОДЬ простит её, потому что отец запретил ей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связывающих обещаний»; еврейское слово обозначает принятые на себя обязательства, связывающие человека, особенно в контексте обетов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не устоит»; то есть не сохранит обязательной силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условие противопоставлено предыдущему случаю; «но если» естественно передаёт эту связь.
- source_word: הֵנִיא
  choice: воспротивится ей
  rationale: Глагол обозначает противодействие, вследствие которого обет утрачивает силу. Выбор сохраняет необычную еврейскую конструкцию с дочерью как прямым объектом и не подменяет действие отца его юридическим результатом.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: в тот день, когда услышит об этом
  rationale: Сохранено существенное для правового условия указание именно на день, когда отец услышал об обете.
- source_word: כָּל נְדָרֶיהָ וֶאֱסָרֶיהָ
  choice: ни один из её обетов и ни одно из обязательств
  rationale: Отрицание естественно распределено по всему составному подлежащему; נדרים передано как «обеты», а אֱסָרִים — как связывающие человека обязательства.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: которыми она связала себя
  rationale: Сохраняется образ самостоятельно принятой на себя связывающей обязанности, без излишне буквального упоминания «души».
- source_word: לֹא יָקוּם
  choice: не останется в силе
  rationale: В данном правовом контексте глагол «стоять» означает сохранять обязательную силу; русское выражение передаёт этот смысл ясно и естественно.
- source_word: וַיהוָה
  choice: и ГОСПОДЬ
  rationale: Тетраграмматон передан традиционным русским эквивалентом «ГОСПОДЬ» с типографическим выделением.
- source_word: יִסְלַח לָהּ
  choice: простит её
  rationale: Прямо передаёт личный объект глагола סלח, не уточняя сверх текста характер прощения.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит названное в тексте основание прощения.
theological_decisions:
- issue: Смысл прощения после отмены обязательной силы обета
  choice: Сохранено прямое утверждение, что ГОСПОДЬ простит женщину вследствие своевременного противодействия отца.
  alternative: Уточнить, что речь идёт именно о прощении греха неисполненного обета, либо представить прощение только как юридическое освобождение.
  rationale: Еврейский текст говорит о прощении, но не разъясняет точную природу вины или соотношение нравственного и правового аспектов; перевод сохраняет эту богословскую напряжённость.
- issue: Действие отца по отношению к дочери и её обету
  choice: «воспротивится ей»
  alternative: «отменит её обет» или «запретит ей»
  rationale: Исходный текст грамматически направляет действие на женщину, а утрату силы обета выражает отдельно. Выбранная формулировка не сливает эти два положения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридическая структура стиха сохранена, но синтаксис сделан понятным для обычного читателя. Маркеры сносок поставлены непосредственно после соответствующих выражений.
