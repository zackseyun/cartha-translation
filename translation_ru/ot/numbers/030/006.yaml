- from: Но если отец воспротивится ей в тот день, когда услышит об этом, то ни один из её обетов и ни одно из обязательств[a], которыми она связала себя, не останется в силе[b]; и ГОСПОДЬ простит её, потому что отец воспротивился ей.
  to: Но если отец запретит ей в тот день, когда услышит об этом, то ни один из её обетов и ни одно из обязательств[a], которыми она связала себя, не останется в силе[b]; и ГОСПОДЬ простит её, потому что отец запретил ей.
  rationale: Исправлено только неестественное и семантически недостаточно определённое «воспротивится ей». «Запретит ей» сохраняет синтаксическое направление действия на женщину, как в еврейском тексте, и яснее выражает правовое противодействие отца; отмена обязательной силы по-прежнему названа отдельным следствием.
