base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: ru
  text: Но если он непременно отменит их[a] после того, как услышит о них, то понесёт её вину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действительно отменит их» или «полностью отменит их»; в еврейском тексте действие особо подчёркнуто сочетанием инфинитива абсолютного с личной формой глагола.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «понесёт её вину» может также означать, что он понесёт ответственность за её проступок или наказание, связанное с её виной.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: В контексте союз вводит условие, противопоставленное предыдущему предписанию; «но если» естественно передаёт этот оттенок.
- source_word: הָפֵר יָפֵר
  choice: всё же отменит
  rationale: Глагол הפר в данном правовом контексте означает отмену или признание недействительными обетов. Сочетание инфинитива абсолютного с личной формой усиливает действие; частица «всё же» передаёт это подчёркивание без неестественного буквализма.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение сохранено во множественном числе и относится к ранее упомянутым обетам и обязательствам женщины.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: после того, как услышал о них
  rationale: Конструкция обозначает, что отмена последовала уже после того, как мужчина узнал об обетах; дополнение «о них» естественно по-русски и ясно восстанавливает контекстуальный референт.
- source_word: וְנָשָׂא
  choice: то понесёт на себе
  rationale: В условном предложении «то» ясно выражает следствие, а «понесёт на себе» сохраняет образ и юридико-нравственный смысл идиомы.
- source_word: עֲוֺנָהּ
  choice: её вину
  rationale: Форма с местоименным суффиксом означает «её вина / беззаконие». «Вина» понятно современному читателю и не устраняет возможного значения ответственности либо последствий вины.
theological_decisions:
- issue: Смысл выражения «понести её вину» в правовом контексте
  choice: Сохранить идиому «понесёт на себе её вину», не уточняя, идёт ли речь преимущественно о виновности, ответственности или наказании.
  alternative: «Понесёт ответственность за её проступок» или «понесёт наказание за её вину».
  rationale: Оборот נשׂא עון может обозначать несение вины, ответственности за неё или её последствий. Более узкая формулировка преждевременно разрешила бы присущую древнееврейскому выражению смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, юридико-повествовательным регистром. Формулировка остаётся понятной без архаизмов; смысловая неоднозначность заключительной идиомы сохранена и пояснена в сноске.
