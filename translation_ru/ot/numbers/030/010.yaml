  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: ru
  text: А обет вдовы или разведённой женщины — всё, чем она связала себя, — остаётся для неё обязательным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵדֶר
  choice: обет
  rationale: В юридико-культовом контексте обозначает торжественное обязательство, данное Богу; «обет» — точный и устоявшийся русский эквивалент.
- source_word: אַלְמָנָה
  choice: вдова
  rationale: Прямой и естественный эквивалент обозначения женщины, муж которой умер.
- source_word: גְרוּשָׁה
  choice: разведённая женщина
  rationale: Страдательное причастие обозначает женщину, с которой развелись; этот вариант ясен и сохраняет юридический оттенок.
- source_word: כֹּל אֲשֶׁר
  choice: всё, чем
  rationale: Передаёт всеохватность выражения и естественно связывает его с последующим образом самообязывания.
- source_word: אָסְרָה עַל נַפְשָׁהּ
  choice: она связала себя
  rationale: Сохраняет метафору связывания и смысл добровольно принятого на себя обязательства; נֶפֶשׁ здесь имеет возвратное значение.
- source_word: יָקוּם עָלֶיהָ
  choice: остаётся для неё обязательным
  rationale: 'Передаёт юридический смысл: обязательство сохраняет силу и лежит на ней. Буквальное «стоит на ней/против неё» по-русски неестественно и может исказить смысл.'
