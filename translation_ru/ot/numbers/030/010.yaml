  source_fidelity: 'Текст точно передаёт משפטную формулу еврейского оригинала: נֵדֶר — «обет», статусы אַלְמָנָה и גְרוּשָׁה — «вдова» и «разведённая женщина», а כֹּל אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ — «всё, чем она связала себя». «Остаётся для неё обязательным» адекватно выражает юридическое значение יָקוּם עָלֶיהָ: обязательство сохраняет силу в отношении женщины. Смысл не сужен до одного лишь обета, поскольку сохранено «всё».'
  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет сдержанный законодательный регистр. Оборот «связала себя» в данном контексте понятен как принятие обязательства; заключительная формула «остаётся для неё обязательным» ясна и юридически уместна.
  terminology: «Обет» — устоявшийся точный термин для נֵדֶר в культово-правовом контексте. «Разведённая женщина» нейтрально и прозрачно передаёт גְרוּשָׁה. Терминология не вносит конфессиональных интерпретаций.
