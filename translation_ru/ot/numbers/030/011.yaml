  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: ru
  text: И если в доме своего мужа она дала обет или клятвой связала себя обязательством[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наложила на себя связывающее обязательство клятвой».'
    reason: Передаёт однокоренную усилительную конструкцию אָסְרָה אִסָּר и буквальное значение עַל נַפְשָׁהּ, не перегружая основной текст.
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сочетание союза с условной частицей вводит следующий случай в последовательности правовых установлений; «И если» сохраняет связь с контекстом.
- source_word: בֵּית אִישָׁהּ
  choice: в доме своего мужа
  rationale: Конструктивное сочетание буквально обозначает «дом её мужа»; выбранная формулировка естественна по-русски и сохраняет как пространственный, так и семейно-правовой контекст.
- source_word: נָדָרָה
  choice: дала обет
  rationale: Глагол נדר означает принятие обета; «дала обет» — ясное и устойчивое выражение в современном литературном русском языке.
- source_word: אוֹ
  choice: или
  rationale: Сохраняет простое разделительное отношение между двумя юридически значимыми действиями.
- source_word: אָסְרָה אִסָּר
  choice: связала себя обязательством
  rationale: Однокоренная глагольно-именная конструкция подчёркивает принятие связывающего ограничения; русская формулировка передаёт и обязательность, и направленность действия на саму женщину.
- source_word: עַל נַפְשָׁהּ
  choice: себя
  rationale: В данном правовом обороте נֶפֶשׁ обозначает саму личность, а не «душу» в узком смысле.
- source_word: בִּשְׁבֻעָה
  choice: клятвой
  rationale: Предлог בְּ указывает на средство или сопутствующее обстоятельство; творительный падеж естественно передаёт, что обязательство подтверждено клятвой.
