  language: ru
  text: Но если она выйдет замуж, а на ней будут лежать её обеты или изречение её уст, которым она связала себя[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «станет/будет для мужчины»; это брачная идиома: «выйдет замуж». Или: «изречение её уст». Вероятно, речь идёт о произнесённом поспешно самообязывании, отличном от формального обета.'
