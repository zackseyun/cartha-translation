lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз продолжает законодательное рассуждение и вводит новый, слегка противопоставленный случай.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: она выйдет замуж
  rationale: Конструкция היה לְאִישׁ обозначает вступление женщины в брак. Современное русское выражение естественно передаёт это значение, а буквальная формулировка «будет принадлежать мужу» создала бы неуместный оттенок собственности.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: когда на ней уже лежат её обеты
  rationale: Сохранён еврейский образ обязательств, лежащих на человеке; «уже» проясняет, что обеты существуют к моменту брака, не предрешая вопроса об их дальнейшем подтверждении.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: обязательство, которое она необдуманно возложила на себя своими устами
  rationale: מִבְטָא — произнесённое выражение; в данном контексте это отличное от формального обета словесное самообязывание. Наречие «необдуманно» передаёт вероятный оттенок импульсивности, а примечание сохраняет более нейтральную возможность.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: которое она ... возложила на себя
  rationale: אָסַר в законодательстве об обетах означает связать, обязать; естественная русская юридико-религиозная формулировка сохраняет смысл самообязывания. נֶפֶשׁ здесь имеет возвратное значение «себя».
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте обетов
  choice: себя
  alternative: свою душу; свою жизнь
  rationale: Речь идёт о принятом на себя обязательстве, а не об учении о составе человека; возвратное «себя» точнее передаёт функцию слова в данной идиоме.
- issue: Юридический статус обетов при вступлении в брак
  choice: на ней уже лежат её обеты
  alternative: её обеты остаются для неё обязательными
  rationale: Формулировка сохраняет образ и не утверждает заранее окончательную юридическую силу обетов, вопрос о которой рассматривается далее.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного библейского текста. Причастно-канцелярские обороты сведены к минимуму; сохранён незавершённый синтаксис стиха, поскольку условие продолжается в следующем стихе.
