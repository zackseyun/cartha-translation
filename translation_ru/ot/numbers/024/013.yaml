  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: ru
  text: «Если бы Валак отдал мне свой дом, полный серебра и золота, я не смог бы пойти против слова Яхве[a], чтобы по собственному почину сделать добро или зло. Что скажет Яхве, то я и скажу».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перейти уста Яхве». «Уста» здесь обозначают высказанное слово или повеление.'
    reason: Поясняется буквальный образ еврейского выражения при естественной передаче его основного смысла в тексте.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Даже если бы ... отдал
  rationale: Условная конструкция с имперфектом выражает гипотетическое допущение; сочетание «даже если бы» естественно передаёт и условность, и уступительный оттенок в контексте отказа от огромной награды.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: свой дом, полный серебра и золота
  rationale: Передаёт образ дома, наполненного драгоценностями, сохраняя смысл еврейской конструкции и звуча естественно по-русски.
- source_word: לֹא אוּכַל
  choice: я не смог бы
  rationale: Условное наклонение согласовано с гипотетическим началом высказывания.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: преступить слово Яхве
  rationale: Глагол עבר передаёт выход за установленную границу, а «слово» естественно выражает метонимическое употребление «уст» как повеления или высказанной воли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: сделать добро или зло
  rationale: Сохраняется прямая нравственная полярность исходного текста без сужения её до благословения и проклятия.
- source_word: מִלִּבִּי
  choice: по велению собственного сердца
  rationale: Сохраняется образ сердца как источника самостоятельного решения; формулировка понятна современному русскому читателю и подчёркивает противопоставление слову Яхве.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: Что скажет Яхве, то я и скажу
  rationale: Сохранена соотносительная структура «что — то» и повтор глагола речи, при этом фраза звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Характер ограничения Валаама
  choice: Валаам не может по собственной инициативе преступить слово Яхве и сделать добро или зло
  alternative: Валаам не может только изменить конкретное распоряжение о благословении или проклятии
  rationale: Перевод сохраняет широкую формулировку стиха и не сводит её к более узкому богословскому толкованию, хотя контекст допускает такое применение.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Условная конструкция передана естественно; образ сердца сохранён без тяжеловесного буквализма. Маркер сноски поставлен непосредственно после выражения, которое она поясняет.
