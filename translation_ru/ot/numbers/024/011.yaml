base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: ru
  text: 'А теперь беги к себе. Я сказал: «Я непременно окажу тебе почёт», но вот, Яхве не допустил тебя к почёту.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удержал тебя от почёта», «не дал тебе получить почёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и связующий союз, и временной переход, естественно вводя заключительные слова Валака.
- source_word: בְּרַח לְךָ אֶל־מְקוֹמֶךָ
  choice: беги к себе
  rationale: Императив ברח передаёт поспешное, резкое удаление; русское «к себе» естественно выражает буквальное «к твоему месту», не уточняя сверх текста, что речь именно о доме.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Я непременно окажу тебе почёт
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает обещание; «непременно» передаёт эту эмфазу, а «оказать почёт» соответствует контексту царского признания и вознаграждения.
- source_word: וְהִנֵּה
  choice: но вот
  rationale: «Но» передаёт контраст между обещанием и исходом, а «вот» сохраняет указательную и экспрессивную силу הִנֵּה в современном литературном русском.
- source_word: מְנָעֲךָ ... מִכָּבוֹד
  choice: лишил тебя почёта
  rationale: Конструкция מנע с מן означает не допустить к чему-либо, удержать от получения чего-либо. «Лишил тебя почёта» естественно передаёт результат, сохраняя намеренно обвинительный тон Валака.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Приписываемое Яхве действие
  choice: лишил тебя почёта
  alternative: не допустил тебя до почёта
  rationale: Сохранено прямое утверждение Валака о том, что Яхве воспрепятствовал получению Валаамом обещанного почёта; перевод не смягчает и не подтверждает богословскую оценку говорящего.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Резкий приказ Валака сохранён словом «беги»; тяжеловесное буквальное «беги себе к своему месту» заменено естественным «беги к себе». Единственный маркер [a] помещён в основной текст.
