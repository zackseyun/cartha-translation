  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: ru
  text: 'И воспылал гнев Валака на Валаама, и он ударил ладонью о ладонь. Валак сказал Валааму: «Я призвал тебя проклясть моих врагов, а ты, оказывается, уже трижды благословил их[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте личная форма глагола сочетается с инфинитивом абсолютным: «ты благословил — благословить». Это усилительная конструкция, подчёркивающая силу или повторность благословения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: воспылал гнев Валака на Валаама
  rationale: Сохраняет еврейский образ разгоревшегося гнева и в то же время естественно звучит в современном литературном русском.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: он ударил ладонью о ладонь
  rationale: Передаёт жест досады или гнева без возможной положительной ассоциации русского «захлопал в ладоши».
- source_word: לָקֹב אֹיְבַי
  choice: проклясть моих врагов
  rationale: Прямо и ясно передаёт цель, ради которой Валак призвал Валаама.
- source_word: קְרָאתִיךָ
  choice: Я призвал тебя
  rationale: «Призвал» здесь естественно передаёт вызов Валаама для определённой задачи и уместно для достойного повествовательного регистра.
- source_word: וְהִנֵּה
  choice: а ты, оказывается
  rationale: Передаёт контраст и возмущённое указание на неожиданный для Валака результат; буквальное «вот» в этой реплике звучало бы менее естественно.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: благословил их
  rationale: Основное действие передано без добавочного объекта в еврейском тексте; местоимение «их» ясно восстанавливается из «моих врагов». Эмфатическая конструкция отмечена сноской.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: уже трижды
  rationale: Естественно передаёт три повторных случая вплоть до настоящего момента и оттенок недовольства в речи Валака.
