base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: ru
  text: 'Они раскинулись, как долины,

    как сады у реки,

    как алоэвые деревья[a], посаженные Яхве,

    как кедры у вод.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деревья алоэ», «благовонные алоэ» или «алоевое дерево». Еврейское слово в этом контексте обычно понимают как обозначение благовонных деревьев или их древесины; оно созвучно слову «шатры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: долины
  rationale: Слово может обозначать долины, русла сезонных потоков или связанные с потоками ущелья. «Долины» естественно передаёт широкий поэтический образ, а связь с водой раскрывается в следующих строках.
- source_word: נִטָּיוּ
  choice: они раскинулись
  rationale: Форма от נטה выражает протяжённость, раскинутость. Возвратное «раскинулись» естественно описывает увиденный Валаамом стан Израиля.
- source_word: גַנֹּת
  choice: сады
  rationale: Прямой и естественный русский эквивалент, сохраняющий образ возделанного плодородия.
- source_word: עֲלֵי נָהָר
  choice: у реки
  rationale: В данном сочетании על указывает на близость; краткое «у реки» естественно в русском поэтическом параллелизме.
- source_word: אֲהָלִים
  choice: алойные деревья
  rationale: Здесь слово обозначает ароматические деревья или древесину алоэ, а не шатры. Уточнение «деревья» не позволяет современному читателю принять образ за травянистое лекарственное алоэ.
- source_word: נָטַע
  choice: посаженные
  rationale: Причастная конструкция по-русски плавно передаёт завершённое действие Яхве и согласуется с множественным числом «деревья».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲרָזִים
  choice: кедры
  rationale: Обычное значение слова; образ передаёт величие, крепость и долговечность.
- source_word: עֲלֵי מָיִם
  choice: у вод
  rationale: Сохранено множественное число еврейского מָיִם и лаконичный поэтический параллелизм.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: К кому относится образ «они раскинулись»
  choice: Местоимение «они» сохранено без явного пояснения
  alternative: Явно назвать шатры, жилища или Израиль
  rationale: Подлежащее подразумевается из предыдущего стиха; добавление конкретного существительного сняло бы присущую поэтическому тексту связь между жилищами Иакова и народом Израиля.
translation_notes:
  register: Современный литературный русский с сохранением четырёхчастного поэтического параллелизма. Лексика понятна обычному читателю; редкий ботанический образ пояснён сноской. Формы «у реки» и «у вод» поддерживают лаконичность и ритм.
