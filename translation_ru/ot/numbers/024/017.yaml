  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: ru
  text: Я вижу его[a], но не теперь; созерцаю его, но не вблизи. Из Иакова взойдёт звезда, из Израиля поднимется скипетр; он сокрушит края Моава[b] и разгромит всех сынов Шета[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская форма буквально содержит «его»; её можно также передать будущим временем: «я увижу его». Суффикс мужского рода допускает личного референта, который прямо не назван.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Буквально: «углы (или края) Моава». Это образное выражение может обозначать пределы Моава или его силу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всех сынов Сифа». Еврейское שֵׁת можно прочитать как имя Шет (Сиф); выражение также понимают шире — как поэтическое обозначение человечества или враждебного народа.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Я вижу его
  rationale: Форма содержит местоименный суффикс мужского рода единственного числа. Настоящее время естественно передаёт живость пророческого видения, не исключая направленности в будущее.
- source_word: אֲשׁוּרֶנּוּ
  choice: созерцаю его
  rationale: Глагол означает пристально видеть или созерцать; выбран возвышенный, но понятный русский эквивалент, сохраняющий параллелизм без простого повтора «вижу».
- source_word: וְלֹא קָרוֹב
  choice: но не близко
  rationale: Буквальное «не близко» сохраняет возможный временной и пространственный оттенок, тогда как «не скоро» устранило бы эту неоднозначность.
- source_word: דָּרַךְ כּוֹכָב
  choice: Звезда выступила
  rationale: דָּרַךְ буквально связано с шагом или поступью и здесь изображает появление и продвижение звезды. «Выступила» естественно передаёт образ, а прошедшее совершенного вида отражает пророческую совершенность действия.
- source_word: וְקָם שֵׁבֶט
  choice: и скипетр поднялся
  rationale: שֵׁבֶט может означать жезл, посох, скипетр или племя; параллель со звездой и последующая победа поддерживают царский образ скипетра. «Поднялся» сохраняет образ и пророческую совершенность.
- source_word: וּמָחַץ
  choice: он сокрушит
  rationale: Глагол означает «разбить, сокрушить». Будущее время передаёт предсказательный ход речи; местоимение «он» грамматически отсылает к ближайшему «скипетру», одновременно позволяя услышать за символом личного правителя.
- source_word: פַּאֲתֵי מוֹאָב
  choice: края Моава
  rationale: פֵּאָה означает край, сторону или угол. «Края» звучит естественно по-русски и сохраняет географически-телесную метафору без истолкования её как «князей» или «силы».
- source_word: וְקַרְקַר
  choice: и разгромит
  rationale: Редкий и спорный глагол в данном контексте обычно понимают как разрушение или опустошение. «Разгромит» соответствует военному контексту и не создаёт неестественного сочетания «разрушит людей».
- source_word: כָּל בְּנֵי שֵׁת
  choice: всех сынов Шета
  rationale: Согласные естественно допускают чтение имени Шет. Транслитерация сохраняет форму еврейского имени и не решает без пояснения, обозначает ли выражение потомков библейского Шета, человечество вообще или некий враждебный народ.
theological_decisions:
- issue: Мессианский смысл пророчества Валаама
  choice: Сохранены царские образы звезды и скипетра без прямого добавления слова «Мессия».
  alternative: Прямо назвать грядущего царя Мессией либо ограничить пророчество одним историческим царём, например Давидом.
  rationale: Еврейский текст даёт царскую символику и язык победы, но не называет личность прямо. Образный перевод сохраняет возможность мессианского прочтения, не превращая толкование в часть основного текста.
- issue: Личный или символический субъект
  choice: В начале употреблено личное «его», а далее сохранены символы; перед сказуемым поставлено «он», грамматически связанное со «скипетром».
  alternative: Последовательно использовать только личное «он» либо только безлично-символическое описание.
  rationale: Местоименные суффиксы в первых глаголах имеют мужской род единственного числа, тогда как далее субъект назван образами звезды и скипетра. Русская формулировка удерживает оба уровня текста.
- issue: Пророческие совершенные формы
  choice: «выступила», «поднялся», затем «сокрушит», «разгромит».
  alternative: 'Передать все действия будущим временем: «выступит», «поднимется», «сокрушит».'
  rationale: Прошедшие формы совершенного вида передают представленное как уже свершившееся пророческое событие, а будущие формы естественно выражают его дальнейший победный результат. Это сохраняет напряжение форм исходного текста.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Параллелизм полустиший сохранён; устаревшие формы и конфессионально окрашенные добавления не использованы. «Скипетр» оставлен как общеизвестный царский символ.
