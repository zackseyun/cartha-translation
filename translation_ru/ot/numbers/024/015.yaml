lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: И он произнёс своё изречение
  rationale: Сочетание נשׂא с מָשָׁל вводит торжественное поэтическое высказывание. Русское «произнёс своё изречение» естественно передаёт функцию оборота, не калькируя буквально «поднял».
- source_word: וַיֹּאמַר
  choice: двоеточие перед прямой речью
  rationale: Значение «и сказал» передано русской конструкцией введения прямой речи; отдельное «и сказал» после «произнёс» было бы тяжеловесным повтором.
- source_word: נְאֻם
  choice: слово
  rationale: В данном торжественном пророческом зачине «слово» обозначает авторитетное реченное высказывание и позволяет сохранить двукратный повтор оригинала без неестественного канцелярского оттенка.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Валаама, сына Веора
  rationale: Имена переданы в принятой русской библейской форме; патронимическая конструкция воспроизведена прямо.
- source_word: הַגֶּבֶר
  choice: мужа
  rationale: «Муж» сохраняет поэтический и торжественный регистр גֶּבֶר и здесь звучит естественнее, чем нейтральное «человека».
- source_word: שְׁתֻם הָעָיִן
  choice: чьё око открыто
  rationale: Контекст видения и параллель в следующем стихе поддерживают значение открытого для откровения зрения. Единственное число עַיִן сохранено как «око», а лексическая спорность отмечена в сноске.
theological_decisions:
- issue: Значение самоописания Валаама שְׁתֻם הָעָיִן
  choice: чьё око открыто
  alternative: чьё око закрыто / сомкнуто
  rationale: Ближайший контекст связывает слова Валаама с получением божественного видения и открытыми глазами, однако редкая еврейская форма допускает противоположное толкование. Основной текст следует контекстуальному прочтению, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной поэтической окраской. Параллелизм двух строк и повтор «слово» сохраняют форму пророческого изречения; «око» и «муж» уместны в этом возвышенном контексте и остаются понятными современному читателю.
