  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: ru
  text: Он припал к земле и лёг, как лев, как львица[a], — кто поднимет его? Благословляющие тебя благословенны[b], а проклинающие тебя прокляты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как могучий лев». Еврейское слово может обозначать сильного или зрелого льва; перевод «львица» сохраняет отличие от предыдущего слова «лев».'
    reason: lexical_alternative
  - marker: b
    text: Эта формула благословения и проклятия перекликается с Книгой Бытие 12:3 и 27:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: пригнулся
  rationale: Глагол обозначает сгибание или припадание к земле. В сочетании с שָׁכַב и образом льва речь идёт о позе зверя, а не о поклонении или подчинении.
- source_word: שָׁכַב
  choice: лёг
  rationale: Обычное обозначение того, что кто-либо ложится; вместе с предыдущим глаголом создаёт последовательный образ зверя, устраивающегося на отдых.
- source_word: כַּאֲרִי
  choice: как лев
  rationale: Прямо передаёт сравнение с אֲרִי и сохраняет поэтический образ.
- source_word: וּכְלָבִיא
  choice: и как львица
  rationale: לָבִיא может обозначать льва или львицу, нередко сильного либо зрелого льва. «Львица» естественно сохраняет отличие от предшествующего אֲרִי, не устраняя лексическую неоднозначность, которая отмечена в сноске.
- source_word: מִי יְקִימֶנּוּ
  choice: кто заставит его подняться?
  rationale: Каузативная форма от קום буквально выражает побуждение встать. В контексте лежащего льва русский оборот передаёт и действие, и подразумеваемую опасность разбудить или потревожить его.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: благословляющие тебя благословенны
  rationale: Причастие с суффиксом второго лица передано субстантивированным причастием; именная часть сказуемого сохраняет форму торжественного изречения о благословении.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: а проклинающие тебя прокляты
  rationale: Сохраняются прямое лексическое соответствие, параллелизм и противопоставление благословения проклятию; союз передан как «а» для естественного русского контраста.
theological_decisions:
- issue: К кому относится форма второго лица в словах о благословляющих и проклинающих
  choice: Сохранено обращение в единственном числе без уточняющего имени; в контексте оно относится к Израилю/Иакову как собирательному лицу в пророчестве Валаама.
  alternative: Понимать обращение более узко как относящееся к царю Израиля либо явно развернуть его как обращение ко всему народу.
  rationale: Еврейский текст использует мужской род единственного числа и допускает представительно-собирательный смысл. Русское «тебя» сохраняет эту форму и не сужает референт.
- issue: Отзвук патриархальной формулы благословения и проклятия
  choice: Формула передана прямо, а связь с Бытие 12:3 и 27:29 отмечена в сноске.
  alternative: Внести упоминание Авраамова или патриархального благословения непосредственно в основной текст.
  rationale: Аллюзия сильна, но её разъяснение внутри перевода было бы интерпретирующим расширением.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Начальная последовательность глаголов и параллелизм заключительной формулы сохранены; лексическая неоднозначность לָבִיא вынесена в сноску.
