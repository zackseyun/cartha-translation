  source_fidelity: В целом последовательность глаголов и параллельное сообщение об уходе Валака переданы верно. Однако «возвратился к себе» несколько сужает לִמְקֹמוֹ («на своё место», буквально — «к своему месту») до значения личного дома или пребывания. Более нейтральное «на своё место» сохраняет формулировку исходного текста.
