  text: И встал Валаам, пошёл и возвратился на своё место; и Валак также пошёл своей дорогой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма от קום в повествовательной последовательности обозначает вставание перед уходом; буквальное «встал» естественно и сохраняет движение исходного текста.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Традиционная и общепринятая русская передача библейского имени.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: הלך здесь прямо обозначает уход; «пошёл» естественно передаёт простую повествовательную последовательность.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: возвратился к себе
  rationale: שׁוב означает возвращение, а מָקוֹם буквально — «место». Русское «к себе» естественно передаёт идиоматический смысл, не уточняя, был ли это дом или иное место.
- source_word: וְגַם
  choice: и ... также
  rationale: Сочетание сохраняет присоединительное значение и проводит параллель между уходом Валаама и уходом Валака.
- source_word: בָּלָק
  choice: Валак
  rationale: Традиционная и общепринятая русская передача библейского имени.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: отправился своей дорогой
  rationale: Идиоматично передаёт буквальное «пошёл своим путём», сохраняя образ дороги и итоговый характер сообщения.
