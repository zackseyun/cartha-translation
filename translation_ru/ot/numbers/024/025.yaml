  register: Современный литературный русский язык с умеренно формальной библейской повествовательной интонацией. Полисиндетон еврейского текста частично сохранён, но фраза сделана естественной для русского чтения; двусмысленность לִמְקֹמוֹ не сведена прямо к «дому».
