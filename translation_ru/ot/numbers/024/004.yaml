  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: ru
  text: 'изречение[a] того, кто слышит слова Бога,

    кто видит видение Всемогущего,

    кто падает с открытыми глазами[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торжественное изречение». Еврейское נְאֻם — особый пророческий термин для торжественного, весомого высказывания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с непокрытыми глазами». Буквально: «с раскрытыми глазами». Этот образ сохраняет представление о незавуалированном зрении в откровении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: изречение
  rationale: Это торжественный пророческий термин, вводящий весомое, авторитетное высказывание. «Изречение» сохраняет формальность формулы и естественно звучит в поэтическом контексте.
- source_word: שֹׁמֵעַ
  choice: тот, кто слышит
  rationale: Субстантивированное причастие характеризует говорящего как слышащего Божьи слова; такая конструкция ясна и естественна в современном русском языке.
- source_word: אִמְרֵי אֵל
  choice: слова Бога
  rationale: Форма множественного числа אִמְרֵי означает «слова, речения»; אֵל здесь передаётся как общий божественный титул «Бог», а не как имя «Эль».
- source_word: מַחֲזֵה שַׁדַּי
  choice: видение Всемогущего
  rationale: מַחֲזֵה обозначает увиденное в откровении видение, а שַׁדַּי — божественный титул, традиционно и понятно передаваемый словом «Всемогущий».
- source_word: יֶחֱזֶה
  choice: видит
  rationale: Хотя глагол имеет форму имперфекта, в этом поэтическом самоописании он выражает характерное действие и параллелен «слышит».
- source_word: נֹפֵל
  choice: падает
  rationale: Причастие сохраняет словесную динамику исходного текста и не уточняет без достаточных оснований, означает ли оно падение ниц, состояние простёртости или иной телесный отклик на откровение.
- source_word: וּגְלוּי עֵינָיִם
  choice: но чьи глаза открыты
  rationale: Буквально речь идёт о «раскрытых» или «непокрытых» глазах. В русском «глаза открыты» естественно передаёт образ дарованного зрения; союз «но» выражает контраст между падением и сохранённой способностью видеть.
theological_decisions:
- issue: Передача שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: В контексте это божественный титул, а не личное имя; перевод передаёт его традиционный смысл, не навязывая более узкого догматического толкования.
- issue: Состояние прорицателя при откровении
  choice: падает
  alternative: лежит поверженный / падает ниц
  rationale: Еврейское נֹפֵל не называет прямо ни причину падения, ни точную позу. Выбранный перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Повтор «кто» передаёт параллелизм еврейской строки. Двоеточие сохраняет связь с продолжающимся изречением. Формулировки избегают архаизмов и не уточняют неоднозначную природу падения сверх того, что выражено в исходном тексте.
