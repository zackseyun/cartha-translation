base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: ru
  text: А теперь вот, я отправляюсь к своему народу. Подойди, я дам тебе совет о том, что этот народ сделает твоему народу[b] в последние дни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в грядущие дни». Еврейское выражение может обозначать будущее вообще, хотя перевод «в последние дни» сохраняет его пророческую весомость.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «против твоего народа». Буквально еврейский предлог означает «твоему народу», но в данном контексте может подразумеваться враждебное действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт как соединительную силу וְ, так и временной переход к следующему высказыванию Валаама.
- source_word: הִנְנִי
  choice: 'вот: я'
  rationale: Сохраняет указательное и эмфатическое значение частицы, подчёркивающей непосредственность намерения.
- source_word: הוֹלֵךְ לְעַמִּי
  choice: я отправляюсь к своему народу
  rationale: Причастная форма выражает предстоящее или уже начавшееся действие; «отправляюсь» естественно передаёт уход Валаама к своему народу.
- source_word: לְכָה
  choice: Подойди
  rationale: Повелительная форма служит призывом приблизиться и выслушать; «подойди» в данном контексте естественнее русского буквального «иди».
- source_word: אִיעָצְךָ
  choice: я дам тебе совет
  rationale: Сохраняет основное значение корня יעץ — «советовать», не подменяя его более свободным «поведаю» или «сообщу».
- source_word: אֲשֶׁר יַעֲשֶׂה הָעָם הַזֶּה
  choice: о том, что этот народ сделает
  rationale: Придаточное раскрывает содержание совета и сохраняет единственное собирательное значение עָם.
- source_word: לְעַמְּךָ
  choice: твоему народу
  rationale: Близко передаёт предлог לְ и оставляет контексту определить неблагоприятный характер действия; возможное значение «против» отмечено в сноске.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Сохраняет устойчивый пророческий оборот и его возможный эсхатологический вес, не сводя выражение только к неопределённому будущему.
theological_decisions:
- issue: Временное выражение בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  alternative: в грядущие дни
  rationale: Еврейское выражение может указывать вообще на будущее, но способно нести и более весомый пророческий оттенок. Основной перевод сохраняет эту напряжённость, а сноска указывает более широкое понимание.
- issue: Направленность действия в לְעַמְּךָ
  choice: твоему народу
  alternative: против твоего народа
  rationale: Предлог буквально обозначает направленность или затронутую сторону; в контексте действие, вероятно, враждебно, однако основной текст не делает эту подразумеваемую враждебность грамматически более явной, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сделан понятным для широкого читателя; отмеченные оригиналом смысловые неоднозначности сохранены в основном тексте и сносках.
