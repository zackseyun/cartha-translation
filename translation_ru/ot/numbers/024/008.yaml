  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: ru
  text: Бог выводит его из Египта; у него — рога дикого быка[a]. Он пожрёт враждебные ему народы, разгрызёт их кости[b] и сокрушит их своими стрелами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у него — сила дикого быка». Еврейское выражение כְּתוֹעֲפֹת רְאֵם трудно для точного истолкования: оно может указывать на возвышающиеся рога либо, шире, на могучую силу дикого быка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «раздробит их кости» либо «обнажит их кости». Редкий еврейский глагол יְגָרֵם имеет не вполне ясный оттенок значения.'
    reason: lexical_alternative
  - marker: c
    text: 'Евр. «его стрелы». Вероятно, это инструментальное употребление: «своими стрелами»; сжатый синтаксис допускает и иное истолкование отношения этого слова к глаголу.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: В данном контексте слово прямо обозначает Бога как совершающего исход; простое «Бог» естественно и не добавляет отсутствующего в тексте эпитета.
- source_word: מוֹצִיאוֹ
  choice: выводит его
  rationale: Причастие с местоименным суффиксом передаёт живое, продолжающее действовать представление о Боге как о выводящем его из Египта; настоящее время сохраняет поэтическую непосредственность.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Обычная русская передача исхода из страны.
- source_word: כְּתוֹעֲפֹת רְאֵם לוֹ
  choice: у него — рога дикого быка
  rationale: Трудное сочетание, вероятно, рисует возвышающиеся рога или мощь реэма. «Дикий бык» исторически и зоологически уместнее традиционного «единорога», а образ рогов сохраняет конкретность воинской метафоры.
- source_word: יֹאכַל
  choice: пожрёт
  rationale: Буквальное значение связано с едой, но здесь это воинская метафора полного уничтожения. «Пожрёт» сохраняет её силу и согласуется с последующим образом костей.
- source_word: גּוֹיִם צָרָיו
  choice: враждебные ему народы
  rationale: Передаёт как значение «народы», так и их характеристику в качестве его противников, не утяжеляя русскую фразу.
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: разгрызёт их кости
  rationale: Редкий глагол допускает разные толкования. «Разгрызёт» хорошо продолжает образ пожирания и естественно сочетается с костями; неопределённость отмечена в сноске.
- source_word: וְחִצָּיו יִמְחָץ
  choice: и сокрушит их своими стрелами
  rationale: Передача понимает «его стрелы» инструментально при подразумеваемом объекте — врагах. Глагол сохраняет сильное значение сокрушения; синтаксическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: К кому относятся местоимения единственного числа
  choice: Сохранены формы «его», «у него», «он», «ему» без уточнения референта.
  alternative: Назвать прямо Израиль, его царя либо мессианскую личность.
  rationale: Еврейский текст использует единственное число, которое в ближайшем контексте может обозначать Израиль как единое целое или его царственного представителя. Уточнение сняло бы сохранённое самим текстом богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом пророческой поэзии. Слова «пожрёт», «разгрызёт» и «сокрушит» намеренно сохраняют суровую образность оригинала; архаизмы и конфессионально окрашенные уточнения исключены.
