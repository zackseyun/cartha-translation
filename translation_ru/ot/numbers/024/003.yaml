  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: ru
  text: 'И произнёс он своё изречение и сказал:

    «Слово Валаама, сына Веора,

    слово мужа с закрытым глазом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с открытым глазом». Такое понимание опирается на контекст пророческого видения и древнюю традицию толкования, однако еврейская форма непосредственнее означает «закрытый» или «сомкнутый».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: И произнёс он своё изречение
  rationale: Идиома вводит торжественную поэтическую речь. «Произнёс своё изречение» естественно звучит по-русски и передаёт значение מָשָׁל, не смешивая его с последующим נְאֻם.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Прямое соответствие обычной повествовательной форме глагола אמר с сохранением ритма еврейского вступления.
- source_word: נְאֻם
  choice: слово
  rationale: В формуле торжественного пророческого высказывания русское «слово» звучит естественно и достойно; «речение» было бы архаичнее, а «пророчество» сильнее истолковывало бы жанр.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Валаама, сына Веора
  rationale: Традиционная русская передача имён и прямое выражение родства в сопряжённой конструкции.
- source_word: הַגֶּבֶר
  choice: мужа
  rationale: «Муж» сохраняет приподнятый поэтический регистр формулы и обозначает взрослого мужчину без добавления идеи силы, которая здесь не обязательна.
- source_word: שְׁתֻם הָעָיִן
  choice: с закрытым глазом
  rationale: Форма масоретского текста непосредственно указывает на закрытый или сомкнутый глаз. Буквальный образ сохранён, а контекстуально и традиционно засвидетельствованное понимание «с открытым глазом» вынесено в примечание.
theological_decisions:
- issue: Значение выражения שְׁתֻם הָעָיִן в описании Валаама
  choice: с закрытым глазом
  alternative: с открытым глазом
  rationale: Основной текст следует наиболее прямому смыслу еврейской формы и не согласует её молча с контекстом видения. Альтернативное древнее и контекстуальное понимание сохранено в примечании, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Параллелизм двух строк и повтор «слово» сохраняют формульную торжественность оригинала без излишней архаизации.
