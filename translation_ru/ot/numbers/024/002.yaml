  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: ru
  text: Валаам поднял глаза и увидел Израиль, стоявший станом по своим коленам[a], и Дух Божий был на нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расположившийся станом по своим коленам»; «расположившийся колено за коленом».'
