  - marker: b
    text: 'Или: «и на него сошёл дух Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: поднял глаза
  rationale: Естественно передаёт еврейское выражение «поднять свои глаза», сохраняя явно названный образ, но без ненужного в русском притяжательного местоимения.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямо обозначает зрительное восприятие того, что открылось Валааму.
- source_word: שֹׁכֵן
  choice: расположившийся станом
  rationale: Причастие описывает Израиль, находящийся в устроенном стане; перевод передаёт контекст стоянки, не придавая ей излишне военного характера.
- source_word: לִשְׁבָטָיו
  choice: по своим коленам
  rationale: Предлог выражает распределение или порядок расположения; «по своим коленам» естественно для библейского контекста и согласуется с собирательным единственным числом «Израиль».
- source_word: רוּחַ אֱלֹהִים
  choice: Дух Божий
  rationale: В контексте последующего пророческого изречения выражение наиболее естественно обозначает Божий Дух, дающий Валааму способность говорить.
- source_word: וַתְּהִי עָלָיו
  choice: на него сошёл
  rationale: Передаёт наступление состояния — Божий Дух оказался на Валааме, — естественным русским оборотом пророческого контекста.
theological_decisions:
- issue: Значение и оформление רוּחַ אֱלֹהִים в контексте пророческого вдохновения
  choice: Дух Божий
  alternative: дух Бога; Божий дух
  rationale: Основной перевод отражает наиболее вероятное указание на Божий Дух, действующий в пророке, но примечание сохраняет формально возможное менее определённое прочтение и не вносит в стих позднейшую догматическую конкретизацию.
- issue: Динамическое или статическое значение וַתְּהִי עָלָיו
  choice: на него сошёл
  alternative: был на нём
  rationale: Последовательность повествования допускает понимание как наступившего воздействия; при этом более буквальное статическое прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Использовано традиционное «колена» для племён Израиля и «Дух Божий» для естественного русского звучания; синтаксис остаётся ясным для современного читателя.
