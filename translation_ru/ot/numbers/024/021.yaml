base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: ru
  text: 'Затем он увидел кенеев, произнёс своё изречение[a] и сказал:


    «Прочно твоё жилище,

    и на скале устроено твоё гнездо[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произнёс свою притчу»; еврейское слово может обозначать притчу, поэтическое изречение или пророческую речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и устрой своё гнездо на скале». Еврейскую форму можно понять как повеление либо, в поэтическом контексте, как описание положения гнезда.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַקֵּינִי
  choice: кенеев
  rationale: Единственное число с артиклем обозначает здесь народ как единое целое. В современном русском множественное число «кенеев» яснее передаёт коллективное значение и не создаёт впечатления, будто Валаам увидел одного человека.
- source_word: מְשָׁלוֹ
  choice: своё изречение
  rationale: מָשָׁל может обозначать притчу, поэтическое изречение, насмешливую песнь или пророческую речь. В контексте речений Валаама «изречение» сохраняет широту значения и звучит естественно и возвышенно.
- source_word: אֵיתָן
  choice: прочно
  rationale: Слово выражает крепость, устойчивость и долговечность. Наречная конструкция «прочно твоё жилище» естественно передаёт краткость и поэтическую силу еврейской именной фразы.
- source_word: מוֹשָׁבֶךָ
  choice: твоё жилище
  rationale: Существительное означает место обитания или поселение. «Жилище» ясно и уместно в параллели с образом гнезда.
- source_word: וְשִׂים
  choice: устроено
  rationale: Масоретская огласовка допускает понимание как повеления «устрой», однако в поэтическом параллелизме форма может описывать надёжное расположение гнезда. Основной текст передаёт это состояние, а формальная альтернатива отмечена в сноске.
- source_word: בַּסֶּלַע
  choice: на скале
  rationale: סֶלַע обозначает скалу, утёс или каменную высоту. «На скале» естественно передаёт образ недоступного и защищённого места.
- source_word: קִנֶּךָ
  choice: твоё гнездо
  rationale: Сохранён буквальный образ птичьего гнезда, созвучный названию кенеев и подчёркивающий безопасность их поселения.
