  source_fidelity: Текст точно передаёт последовательность действий и поэтический образ оригинала. «Кенеев» естественно выражает собирательное значение формы единственного числа הַקֵּינִי. «Прочно твоё жилище» хорошо передаёт именную фразу אֵיתָן מוֹשָׁבֶךָ. Основное прочтение «устроено твоё гнездо» согласуется с возможным предикативным пониманием וְשִׂים; повелительное понимание добросовестно сохранено в сноске. «На скале» допустимо для בַּסֶּלַע и сохраняет образ защищённого гнезда.
