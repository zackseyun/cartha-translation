base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: ru
  text: 'Затем он увидел Амалика, произнёс своё изречение[a] и сказал:


    «Первый среди народов[b] — Амалик,

    но конец его — полная гибель[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возгласил своё пророчество»; еврейское слово может обозначать поэтическое изречение, притчу, насмешку или пророческое речение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «первейший среди народов»; еврейское выражение может указывать как на первенство по времени, так и на выдающееся положение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «но в конце он погибнет»; еврейское выражение кратко и подчёркивает окончательную гибель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: Затем он увидел Амалика
  rationale: Глагол ראה передан своим прямым значением «увидел», а последовательность повествования выражена естественным русским «затем».
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: произнёс своё изречение
  rationale: Оборот буквально означает «поднял/вознёс своё машаль». Слово מָשָׁל может обозначать притчу, поэтическое изречение, насмешку или пророческое речения; нейтральное «изречение» не сужает жанр чрезмерно.
- source_word: רֵאשִׁית גּוֹיִם
  choice: первый среди народов
  rationale: רֵאשִׁית допускает значение как первенства по времени, так и главенства. Русская формулировка сохраняет эту краткость и допускает оба оттенка, уточнённые в сноске.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Традиционная русская передача имени; в контексте имя обозначает одноимённый народ.
- source_word: וְאַחֲרִיתוֹ
  choice: но конец его
  rationale: אַחֲרִית означает конец, исход или последующую участь. Союз «но» естественно передаёт смысловое противопоставление первенства и гибели.
- source_word: עֲדֵי אֹבֵד
  choice: полное уничтожение
  rationale: Краткое эллиптическое выражение указывает на окончательную гибель. «Полное уничтожение» передаёт интенсивность и окончательность, не добавляя отсутствующего в еврейском тексте слова «навечно».
theological_decisions:
- issue: Смысл положения Амалика в выражении רֵאשִׁית גּוֹיִם
  choice: Сохранить неоднозначность между первенством по времени и выдающимся положением.
  alternative: «Древнейший из народов» либо «главнейший среди народов».
  rationale: Сам стих не уточняет, говорится ли о хронологическом первенстве или о превосходстве; перевод не должен навязывать историческое или богословское разрешение этой неоднозначности.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической интонацией. Синтаксический параллелизм пророческого изречения сохранён; архаизмы и конфессионально окрашенные термины по возможности исключены.
