  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: ru
  text: Валаам увидел, что Яхве угодно благословлять Израиль, и не пошёл, как прежде, искать гадательных знаков[a], а обратил лицо в сторону пустыни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встречать гадательные знаки»; возможно также: «прибегать к гаданию». Еврейское выражение указывает на прежнюю практику Валаама — поиск предзнаменований посредством гадания.'
    reason: Лексическая неоднозначность выражения לִקְרַאת נְחָשִׁים.
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Основное значение глагола ראה сохранено; в данном контексте «увидел» естественно передаёт также осознание Валаамом происходящего.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: что Яхве угодно
  rationale: Еврейская идиома «хорошо в глазах Яхве» означает, что нечто Ему угодно. Функциональный русский эквивалент звучит естественно и ясно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано принятой русской транслитерацией, а не заменено титулом.
- source_word: לְבָרֵךְ
  choice: благословлять
  rationale: Прямое и контекстуально точное соответствие инфинитиву ברך; несовершенный вид хорошо выражает намерение благословить Израиль в складывающейся ситуации.
- source_word: וְלֹא הָלַךְ
  choice: и не пошёл
  rationale: Прямой и естественный перевод обычного глагола движения הלך.
- source_word: כְּפַעַם בְּפַעַם
  choice: как прежде
  rationale: Идиоматически передаёт повторявшуюся ранее практику, выраженную буквальным оборотом «как раз за разом».
- source_word: לִקְרַאת נְחָשִׁים
  choice: искать знамений
  rationale: נְחָשִׁים обозначает гадательные знаки или предзнаменования, а сочетание с לִקְרַאת в контексте указывает на целенаправленный поиск таких знаков. В сноске сохранены более буквальные варианты.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: обратил лицо
  rationale: Сохраняет образ еврейской идиомы и ясно выражает намеренное направление взгляда и внимания.
- source_word: אֶל הַמִּדְבָּר
  choice: к пустыне
  rationale: מִדְבָּר здесь обозначает пустынную, необжитую местность; предлог «к» передаёт направленность действия.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Характер прежних действий Валаама
  choice: искать знамений
  alternative: встречать гадания; прибегать к гаданию
  rationale: Текст связывает действия Валаама с гадательной практикой, но не уточняет её способ. Поэтому основной текст передаёт поиск знамений, не конкретизируя ритуал, а возможные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Идиома «обратил лицо» сохранена как понятный торжественный оборот; менее естественное «хорошо в глазах» передано смысловым соответствием «угодно».
