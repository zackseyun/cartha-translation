  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: ru
  text: Как хороши твои шатры, Иаков, твои жилища, Израиль![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как прекрасны (приятны) твои шатры… твои жилища». Еврейское восклицание выражает восхищение.'
    reason: Лексическая широта טוֹב и восклицательная сила מַה.
lexical_decisions:
- source_word: מַה
  choice: Как
  rationale: В данном поэтическом восклицании מַה выражает восхищение, а не вводит вопрос; русское «как» естественно передаёт эту функцию.
- source_word: טֹּבוּ
  choice: хороши
  rationale: «Хороши» сохраняет широкое значение טוֹב — хорошие, приятные, прекрасные — и не сводит похвалу исключительно к внешней красоте.
- source_word: אֹהָלֶיךָ
  choice: твои шатры
  rationale: אֹהֶל здесь обозначает шатры израильского стана. «Шатры» естественно для поэтической речи и не вносит культового смысла слова «скиния».
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Имя передано в принятой русской библейской форме; здесь оно поэтически обозначает народ Израиля.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: твои жилища
  rationale: «Жилища» передаёт общее значение מִשְׁכָּן и сохраняет смысловой параллелизм с «шатрами», не отождествляя их со святилищем.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя передано в принятой русской форме; параллельно имени «Иаков» оно служит обращением к народу.
theological_decisions:
- issue: Следует ли передавать אֹהָלֶיךָ и מִשְׁכְּנֹתֶיךָ традиционными культовыми терминами
  choice: «шатры» и «жилища»
  alternative: «скинии» и/или «обители»
  rationale: Контекст говорит о расположенном станом Израиле, а не требует указания на святилище. Некультовые слова сохраняют исходный образ и не привносят лишней богословской конкретизации.
translation_notes:
  register: Современный литературный русский с кратким поэтическим параллелизмом. Обращения оставлены без междометия «о», которое в современном русском звучало бы излишне архаично; восклицательный знак передаёт восхищение оригинала.
