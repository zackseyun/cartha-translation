  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: ru
  text: 'Он произнёс своё изречение и сказал:


    «Увы! Кто останется в живых, когда Бог совершит это?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская заключительная фраза трудна для понимания. Возможен также перевод: «когда Бог установит это»; более буквально: «при установлении его Богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: И снова он произнёс своё изречение
  rationale: Сочетание נשׂא с מָשָׁל означает произнесение поэтического пророческого речения. «И снова» естественно передаёт продолжение ряда изречений Валаама, а «изречение» сохраняет широкий смысл מָשָׁל, не сводя его только к притче.
- source_word: אֹוי
  choice: Увы!
  rationale: Междометие выражает скорбь и ужас перед грядущим; «увы» соответствует возвышенному, но понятному современному регистру.
- source_word: מִי יִחְיֶה
  choice: Кто останется в живых
  rationale: Буквально «кто будет жить»; в контексте грядущих потрясений речь идёт о выживании. Русское выражение передаёт этот смысл естественно, без добавления модального «сможет».
- source_word: מִשֻּׂמוֹ אֵל
  choice: когда Бог совершит это
  rationale: Сжатая и трудная конструкция, вероятно, указывает на действие Бога при установлении или осуществлении предсказанного. Основной текст передаёт общий смысл, не уточняя сверх меры характер действия; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Толкование трудной заключительной фразы מִשֻּׂמוֹ אֵל
  choice: когда Бог совершит это
  alternative: когда Бог установит это; когда Он установит это, Бог
  rationale: אֵל принят как подлежащее «Бог», а выражение с שׂום — как временное указание на Божье действие. Поскольку еврейская фраза эллиптична и допускает иное синтаксическое понимание, альтернативы сохранены в сноске, без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческого изречения. «Изречение» выбрано вместо более узких «притча» и «оракул»; формулировка заключительной строки сохраняет её зловещий тон и отмечает подлинную текстовую неоднозначность.
