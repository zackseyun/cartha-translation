  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: ru
  text: 'изречение того, кто слышит слова Бога[a],

    кто знает знание Всевышнего,

    кто видит видение Всемогущего,

    кто падает[b] и остаётся с открытыми глазами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изречения Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «падающий, с открытыми глазами»; некоторые понимают эти слова как описание пророческого транса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: изречение
  rationale: Торжественная формула, вводящая пророческое высказывание; «изречение» сохраняет вес и функцию еврейского слова без излишней архаичности.
- source_word: שֹׁמֵעַ
  choice: тот, кто слышит
  rationale: Субстантивированное причастие обозначает характерное действие; такая передача естественна в современном русском языке.
- source_word: אִמְרֵי אֵל
  choice: слова Бога
  rationale: Сочетание обозначает произнесённые Богом слова; выбран ясный и естественный русский эквивалент.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: кто знает знание Всевышнего
  rationale: 'Сохранена компактность и неоднозначность конструкции: речь может идти о знании, принадлежащем Всевышнему, относящемся к Нему или сообщённом Им.'
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: кто видит видение Всемогущего
  rationale: Повтор корней в русском звучит заметно, но остаётся понятным и точно передаёт пророческое видение, исходящее от Всемогущего или относящееся к Нему.
- source_word: נֹפֵל
  choice: кто падает
  rationale: Передано буквальное значение причастия без внесения в основной текст толкования о трансе или экстатическом состоянии.
- source_word: וּגְלוּי עֵינָיִם
  choice: но глаза его открыты
  rationale: «Открыты» естественно передаёт образ буквально «обнажённых/открытых глаз», а союз «но» выражает вероятное противопоставление падению.
theological_decisions:
- issue: Передача божественных титулов אֵל, עֶלְיוֹן и שַׁדַּי
  choice: Бог / Всевышний / Всемогущий
  alternative: Эль / Эльон / Шаддай
  rationale: В данном контексте это обозначения и титулы Бога; их перевод раскрывает смысл для современного читателя и не превращает титулы в собственные имена.
- issue: Характер знания Всевышнего
  choice: знает знание Всевышнего
  alternative: обладает знанием от Всевышнего
  rationale: Родительная конструкция в еврейском допускает несколько смысловых отношений; основной текст не уточняет источник или принадлежность знания и тем самым сохраняет богословское напряжение.
- issue: Состояние падающего прорицателя
  choice: кто падает
  alternative: кто впадает в пророческий транс
  rationale: Еврейский текст прямо говорит о падении, тогда как понимание этого как транса является толкованием и вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Параллельные придаточные с «кто» воспроизводят цепочку еврейских причастных характеристик. Необычное сочетание «видит видение» сохранено ради близости к образности оригинала.
