source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: ru
  text: И корабли придут от берегов Киттима[a], и угнетут Ашшур[b], и угнетут Эвера[c]; и он тоже погибнет[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Киттим может обозначать собственно Кипр или, шире, западные морские народы.
    reason: alternative_reading
  - marker: b
    text: Ашшур можно также передать как «Ассирия».
    reason: lexical_alternative
  - marker: c
    text: Эвер может быть именем народа, обозначением евреев или народов, живущих «по ту сторону» какой-либо границы, например Евфрата.
    reason: alternative_reading
  - marker: d
    text: 'В еврейском тексте буквально: «и он тоже». Неясно, к кому относится местоимение; его могут понимать и собирательно — как указание на державу или на правителя, представляющего силу, пришедшую от Киттима.'
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: корабли
  rationale: Существительное обозначает морские суда и здесь употреблено собирательно; нейтральное «корабли» не добавляет значения военного флота.
- source_word: מִיַּד
  choice: от берегов
  rationale: Буквально «от руки», но в географическом обороте выражение указывает на сторону или область; при упоминании кораблей естественен морской смысл «от берегов».
- source_word: כִּתִּים
  choice: Киттим
  rationale: Сохранено собственное имя, поскольку оно может обозначать как Кипр, так и шире западные морские народы.
- source_word: וְעִנּוּ
  choice: и угнетут
  rationale: Порода пиэль глагола ענה здесь выражает причинение бедствия, притеснение или покорение; «угнетут» естественно передаёт направленное действие против народов.
- source_word: אַשּׁוּר
  choice: Ашшур
  rationale: Транслитерация сохраняет форму и неоднозначность еврейского названия, которое может относиться к народу, стране или державе; традиционный вариант «Ассирия» дан в примечании.
- source_word: עֵבֶר
  choice: Эвер
  rationale: Собственное имя сохранено без отождествления с евреями или народами по ту сторону определённой границы.
- source_word: וְגַם הוּא
  choice: и он тоже
  rationale: Передан мужской род единственного числа еврейского местоимения; его неясный антецедент намеренно не уточняется.
- source_word: עֲדֵי אֹבֵד
  choice: погибнет
  rationale: Краткое русское выражение естественно передаёт конечный исход — уничтожение или гибель, не добавляя идеи вечного наказания.
theological_decisions:
- issue: Отождествление Киттима, Ашшура, Эвера и референта заключительного местоимения
  choice: Сохранить еврейские имена Киттим, Ашшур и Эвер, а заключительное местоимение передать в мужском роде единственного числа — «он», не определяя исторического референта.
  alternative: Понимать Киттим как Кипр или западные морские державы, Ашшур как Ассирию, Эвера как евреев либо народы «по ту сторону», а «он» — как Киттим, его правителя или иную державу.
  rationale: Пророческий текст допускает несколько исторических отождествлений. Перевод сохраняет грамматику и подлинную неопределённость исходного текста, не разрешая спорный вопрос средствами перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм двух фраз «и угнетут» сохранён; спорные историко-географические отождествления вынесены в примечания.
