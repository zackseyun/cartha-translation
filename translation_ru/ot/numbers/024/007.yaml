base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: ru
  text: Вода польётся из его вёдер[a], и семя его — у обильных вод[b]; царь его возвысится над Агагом, и царство его вознесётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «из его ветвей», если понимать существительное метафорически, а не в его обычном значении «вёдра».
    reason: lexical_alternative
  - marker: b
    text: «Семя его» можно также понимать как «его потомство» или «его потомки»; еврейское слово способно одновременно вызывать образы продолжения рода и плодородия.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: польётся
  rationale: Глагол передаёт течение жидкости. «Польётся» естественно выражает обильное движение воды и не ослабляет образ до простого капания.
- source_word: מַיִם
  choice: вода
  rationale: Хотя еврейское слово имеет форму множественного числа, по-русски здесь естественно употребить собирательное единственное число.
- source_word: מִדָּלְיוֹ
  choice: из его вёдер
  rationale: Обычное значение דְּלִי — ведро или сосуд для черпания воды. Оно хорошо согласуется с непосредственным водным образом; менее вероятное метафорическое понимание отмечено в сноске.
- source_word: וְזַרְעוֹ
  choice: и семя его
  rationale: זֶרַע может означать как семя, так и потомство. Буквальное «семя» сохраняет возможное совмещение образов плодородия и многочисленных потомков.
- source_word: בְּמַיִם רַבִּים
  choice: среди обильных вод
  rationale: Предлог בְּ допускает пространственное значение «в/среди», а רַבִּים в данном поэтическом контексте указывает на изобилие. Формулировка сохраняет образ семени, окружённого множеством воды.
- source_word: וְיָרֹם מֵאֲגַג
  choice: возвысится над Агагом
  rationale: רוּם выражает высоту или возвышение, а сравнительный מִן естественно передаётся сочетанием «над Агагом». Это также отличает данный глагол от последующего תִּנַּשֵּׂא.
- source_word: מַלְכּוֹ
  choice: царь его
  rationale: מֶלֶךְ прямо означает «царь». Порядок слов сохраняет возвышенный поэтический регистр и не конкретизирует личность царя сверх текста.
- source_word: וְתִנַּשֵּׂא
  choice: вознесётся
  rationale: Форма передаёт поднятие и возвышение. «Вознесётся» уместно для царства и сохраняет отличие от «возвысится» в предыдущей строке.
- source_word: מַלְכֻתוֹ
  choice: царство его
  rationale: מַלְכוּת может обозначать царство, царскую власть или царствование. «Царство» естественно по-русски и сохраняет политико-общественный масштаб образа.
theological_decisions:
- issue: Значение выражения «семя его»
  choice: Сохранено «семя его» без уточнения, идёт ли речь о плодородии, потомстве или одновременно о том и другом.
  alternative: «его потомство» или «его потомки»
  rationale: Еврейское זֶרַע допускает буквальное и переносное значения, а поэтический контекст может намеренно соединять их.
- issue: Личность «его царя» и отношение к Агагу
  choice: Царь не отождествлён с какой-либо конкретной исторической или мессианской фигурой.
  alternative: Явное отнесение к Саулу, Давиду, будущей монархии Израиля или Мессии
  rationale: Сам стих говорит о возвышении царя, но не называет его; перевод не должен вносить более позднюю интерпретацию в основной текст.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим оттенком. Инверсия «царь его / царство его» поддерживает ритм пророческого изречения, оставаясь понятной современному читателю. Подлинная многозначность слова זֶרַע сохранена.
