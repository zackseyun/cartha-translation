lexical_decisions:
- source_word: וְהָיָה
  choice: станет
  rationale: В пророческом контексте форма передаёт будущее изменение состояния; «станет» естественно выражает этот переход.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Традиционная русская передача названия народа и территории.
- source_word: יְרֵשָׁה
  choice: владение
  rationale: Слово обозначает то, чем овладевают или что становится чьей-либо собственностью; в военном контексте «владение» уместнее, чем «наследие».
- source_word: שֵׂעִיר
  choice: Сеир
  rationale: Название местности, поставленное параллельно Эдому; слово «гора» в еврейском тексте отсутствует.
- source_word: אֹיְבָיו
  choice: его враги
  rationale: Суффикс буквально имеет форму мужского рода единственного числа — «его»; такая передача сохраняет возможную связь с единственным правителем из окружающего пророчества.
- source_word: עֹשֶׂה חָיִל
  choice: проявит доблесть
  rationale: Идиома выражает деятельное проявление силы, мощи или воинской доблести; выбранная формулировка сохраняет военный оттенок и звучит естественно по-русски.
theological_decisions:
- issue: К кому относится местоименный суффикс в אֹיְבָיו («его враги»)?
  choice: Сохранена форма «его враги», допускающая отнесение к единственному правителю, упомянутому в ближайшем контексте пророчества.
  alternative: Понимать выражение как относящееся к Сеиру или Эдому и передать смысл как «его/их враги» либо «Сеир станет владением врагов».
  rationale: Еврейский суффикс имеет форму мужского рода единственного числа, а стихи 17–19 говорят о единственном владыке. Вместе с тем синтаксическая связь неоднозначна, поэтому она не разрешается догматически и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм двух первых частей сохранён; тире перед «его враги» передаёт сжатое приложение еврейского текста, а сноска сохраняет его подлинную неоднозначность.
