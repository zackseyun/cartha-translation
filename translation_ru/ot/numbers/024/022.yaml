  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: ru
  text: Ведь если Каин[a] обречён на сожжение, то долго ли до того, как Ашшур[b] уведёт тебя в плен?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Каин», вероятно, обозначает кенитов, а не Каина как отдельного человека.
    reason: lexical_alternative
  - marker: b
    text: «Ашшур» в данном контексте может означать Ассирию, ассирийскую державу или ассирийца.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: ведь если
  rationale: Сочетание сохраняет связь с предшествующим изречением и условный оттенок, не устраняя неоднозначность еврейской конструкции.
- source_word: יִהְיֶה לְבָעֵר
  choice: обречён на сожжение
  rationale: Передаёт предсказательное значение конструкции «быть для…» и сохраняет образ огня, не уточняя, буквальное это сожжение или образ уничтожения.
- source_word: קָיִן
  choice: Каин
  rationale: Сохранено собственное имя в принятой русской библейской форме; вероятное обозначение кенейского народа пояснено в сноске.
- source_word: עַד מָה
  choice: долго ли до того, как
  rationale: Естественно передаёт временной вопрос «до каких пор / сколько времени до» в связи с последующим пленением.
- source_word: אַשּׁוּר
  choice: Ашшур
  rationale: Транслитерация сохраняет форму собственного имени и не предрешает, имеется ли в виду Ассирия как государство или ассирийская держава/правитель.
- source_word: תִּשְׁבֶּךָּ
  choice: уведёт тебя в плен
  rationale: Глагол שבה означает взятие и увод в плен; перевод выражает не только захват, но и последующее пленение.
