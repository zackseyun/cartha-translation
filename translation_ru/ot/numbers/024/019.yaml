  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: ru
  text: И будет править тот, кто из Иакова[a], и уничтожит уцелевшего из города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И будет владычествовать тот, кто из Иакова». Еврейский глагол означает «править, владычествовать»; субъект в этой строке прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остаток». Слово может обозначать отдельного уцелевшего или оставшихся в живых как целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: И восстанет Владыка
  rationale: Глагол, вероятнее всего, происходит от רדה — «владычествовать, господствовать». Субъект прямо не назван, но контекст царского пророчества указывает на будущего правителя; «Владыка» естественно передаёт эту подразумеваемую фигуру. Возможное понимание от ירד («сойдёт») менее вероятно.
- source_word: מִיַּעֲקֹב
  choice: из Иакова
  rationale: 'Предлог מן обозначает происхождение: правитель происходит из Иакова, то есть из Израиля.'
- source_word: וְהֶאֱבִיד
  choice: и уничтожит
  rationale: Форма породы hифиль от אבד означает «погубить, уничтожить», то есть стать причиной гибели.
- source_word: שָׂרִיד
  choice: уцелевшего
  rationale: Существительное обозначает того, кто остался в живых. Перевод сохраняет конкретный характер и единственное число еврейского слова; возможен также собирательный смысл.
- source_word: מֵעִיר
  choice: из города
  rationale: עִיר обычно означает «город»; добавлять значение «укреплённый» оснований в самом слове нет.
theological_decisions:
- issue: Царское и возможное мессианское значение пророчества Валаама
  choice: Передать образ будущего правителя царской лексикой, не называя его прямо Мессией.
  alternative: Понимать его исключительно как исторического царя либо прямо обозначить как Мессию.
  rationale: Контекст указывает на царственного правителя, однако сам стих не называет его Мессией. Такая формулировка сохраняет возможность мессианского прочтения, не превращая толкование в текст перевода.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксис краток и близок к параллелизму еврейского текста.
