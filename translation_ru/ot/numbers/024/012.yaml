lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר, вводящая прямую речь; по-русски естественно передаётся словом «сказал».
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Традиционная и общепринятая русская передача личного имени.
- source_word: אֶל בָּלָק
  choice: Валаку
  rationale: Предлог אֶל обозначает адресата речи; русский дательный падеж передаёт это естественно.
- source_word: הֲלֹא
  choice: Разве не
  rationale: Вопросительная конструкция с отрицанием предполагает утвердительный ответ; «разве не» точно и естественно передаёт её риторический характер.
- source_word: גַּם
  choice: и
  rationale: Частица добавляет посланников Валака к адресатам прежнего заявления Валаама; в данной русской конструкции союз «и» звучит естественнее буквального «также».
- source_word: מַלְאָכֶיךָ
  choice: твоим посланникам
  rationale: В этом дипломатическом контексте מַלְאָך означает людей-посланников, а не ангелов.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: которых ты присылал ко мне
  rationale: Относительное придаточное уточняет посланников. «Присылал» идиоматично для отправки людей к говорящему и согласуется с предшествующим повествованием о нескольких группах посланников.
- source_word: דִּבַּרְתִּי
  choice: говорил я
  rationale: 'Перфект имеет ретроспективное значение: Валаам напоминает о сказанном ранее. Инверсия после «разве не» естественна для литературной русской речи.'
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание прежней речи, которое следует в следующем стихе; в современном русском это естественно обозначить двоеточием, не добавляя тяжеловесного «говоря».
