lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: племена
  rationale: В контексте исчисления и расположения стана слово обозначает родственные подразделения, а не отдельные семьи; «племена» понятно передаёт коллективные группы потомков Каафа.
- source_word: בְּנֵי קְהָת
  choice: сыновей Каафа
  rationale: Буквально передаёт еврейское выражение и сохраняет его родословный характер; возможное значение «потомков Каафа» отмечено в сноске.
- source_word: יַחֲנוּ
  choice: должны расположиться станом
  rationale: Имперфект в данном распорядительном контексте выражает предписанное размещение; эта формулировка естественна по-русски и сохраняет нормативный оттенок.
- source_word: עַל יֶרֶךְ
  choice: с ... стороны
  rationale: Сочетание обозначает положение у определённой стороны или боковой части скинии; русская конструкция «с южной стороны» идиоматична.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: В книге Чисел слово обозначает священное шатровое жилище; «скиния» — устоявшийся и точный русский библейский термин.
- source_word: תֵּימָנָה
  choice: южной
  rationale: Направительная форма указывает на южную сторону; в сочетании с יֶרֶךְ естественно передаётся прилагательным «южной».
