  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: ru
  text: 'Сыновья Мерари, по их родам: Махли и Муши. Это роды левитов[a] по домам их отцов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Левия». В еврейском тексте стоит единственное число — буквально «левита»; оно может иметь собирательное значение или указывать на Левия как родоначальника племени.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: בני буквально означает «сыновья». В родословном перечне это естественное обозначение прямой линии родства; начальный союз ו отдельно не передан, поскольку стих продолжает список и по-русски не требует начального «и».
- source_word: מְרָרִי
  choice: Мерари
  rationale: Традиционная русская передача личного имени.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Предлог ל здесь выражает распределение по родовым подразделениям; «по их родам» кратко и естественно передаёт эту классификацию.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Махли и Муши
  rationale: Передача личных имён с сохранением соединительного союза.
- source_word: אֵלֶּה הֵם
  choice: Это
  rationale: Указательное слово с местоимением образует отождествительное предложение; русское «это» естественно передаёт его без ненужной связки «есть».
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В контексте племенного устройства слово обозначает родовые подразделения, поэтому «роды» точнее общего «семьи».
- source_word: הַלֵּוִי
  choice: левитов
  rationale: Хотя в еврейском стоит форма единственного числа с артиклем, контекст допускает её собирательное значение; русское множественное число согласуется с «роды» и ясно обозначает племя левитов. Формальная неоднозначность отмечена в сноске.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Устойчивое родовое выражение обозначает патрилинейные семейно-административные единицы. Такой порядок слов сохраняет образ исходного текста и остаётся понятным современному читателю.
theological_decisions:
- issue: Значение единственного הַלֵּוִי
  choice: В основном тексте передано собирательно как «левитов».
  alternative: «Левия» или буквально «левита».
  rationale: Существительное «роды» во множественном числе и контекст перечисления левитских родов поддерживают собирательное понимание, однако еврейская форма может указывать на Левия как родоначальника; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным регистром. Сохранены структура перечня и родовая терминология, но избегнуты менее естественные для современного читателя выражения вроде «отчие дома».
