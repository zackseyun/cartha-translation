lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: А главным над начальниками левитов
  rationale: Повтор корня נָשִׂיא передаёт высшее положение Елеазара по отношению к другим начальникам левитов. Формулировка «главным над начальниками» сохраняет иерархический смысл, не придавая слову монархического оттенка.
- source_word: אֶלְעָזָר בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: Елеазар, сын священника Аарона
  rationale: Естественный русский порядок слов ясно показывает, что определение «священник» относится к Аарону.
- source_word: פְּקֻדַּת
  choice: под его надзором были
  rationale: Существительное обозначает надзор, ответственность или руководство. Предикативная русская конструкция естественно выражает порученную Елеазару надзорную роль.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: те, кто нёс службу
  rationale: Сочетание однокоренных слов означает исполнение вверенной обязанности. «Нёс службу» сохраняет служебно-охранительный оттенок, не сводя роль левитов к обычной караульной службе.
- source_word: הַקֹּדֶשׁ
  choice: святилище
  rationale: В контексте устройства скинии слово может обозначать святилище как священную сферу, однако возможно и значение священных предметов; эта неоднозначность отмечена в сноске.
