  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: ru
  text: Вот имена сыновей Аарона — помазанных священников, руки которых он наполнил[a], чтобы они служили священниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он наполнил их руки». Это устойчивое выражение означает посвящение или поставление на священническое служение.'
    reason: Пояснение древнееврейского обряда и идиоматического выражения.
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Вот имена
  rationale: Естественная для современного русского языка формула представления перечня, точно передающая указательное выражение и существительное во множественном числе.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновей Аарона
  rationale: Сохраняет конструкцию принадлежности и мужской род, существенный в контексте священнического служения.
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: помазанных священников
  rationale: Передаёт оба определённых наименования в приложении к сыновьям Аарона; «помазанных» сохраняет конкретное ритуальное действие משׁח.
- source_word: אֲשֶׁר מִלֵּא יָדָם
  choice: руки которых он наполнил
  rationale: Сохраняет образный технический оборот исходного текста и активную форму глагола в 3-м лице единственного числа, не называя прямо подразумеваемого деятеля.
- source_word: לְכַהֵן
  choice: чтобы они служили священниками
  rationale: Ясно выражает цель посвящения и передаёт значение исполнения священнических обязанностей.
theological_decisions:
- issue: Передача обряда поставления в выражении מִלֵּא יָדָם
  choice: Сохранить в основном тексте буквальный образ «руки которых он наполнил», пояснив его значение в сноске.
  alternative: «которых он посвятил на священническое служение»
  rationale: Буквальная формулировка сохраняет заметную особенность еврейского священнического языка, а сноска делает понятным её специальное значение, не сводя образ к одному толкованию.
- issue: Не названный в стихе деятель при מִלֵּא
  choice: Передать грамматически выраженное «он», не подставляя имя.
  alternative: «руки которых были наполнены» или «которых Моисей посвятил»
  rationale: Еврейский глагол имеет форму 3-го лица единственного числа мужского рода, но имя деятеля в самом стихе отсутствует. Местоимение сохраняет и грамматику, и контекстуальную недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире ясно оформляет приложение «помазанных священников», а буквальный древнееврейский образ сохранён и разъяснён сноской.
