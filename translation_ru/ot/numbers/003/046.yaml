  language: ru
  text: А в качестве выкупа за двести семьдесят трёх первенцев из числа сынов Израиля, оказавшихся сверх числа левитов,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А выкупленных — двухсот семидесяти трёх…» Еврейскую форму можно понять более буквально как обозначение выкупленных людей, однако ближайший контекст говорит о плате за лишних первенцев (ст. 47–48), поэтому в тексте сказано «в качестве выкупа за».'
