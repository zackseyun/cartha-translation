lexical_decisions:
- source_word: פְּדוּיֵי
  choice: за выкуп
  rationale: Форма от פדה допускает буквальное понимание как обозначение выкупленных, однако ближайший контекст (ст. 47–48) говорит о денежном выкупе за лишних первенцев. «За выкуп» естественно передаёт этот смысл и сохраняет связь с продолжением предложения в следующем стихе.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: двухсот семидесяти трёх
  rationale: Аддитивно выраженное еврейское числительное передано обычной современной русской формой без изменения точного количества.
- source_word: הָעֹדְפִים
  choice: оказавшихся сверх числа
  rationale: Причастие обозначает людей, оставшихся в избытке по сравнению с числом левитов. Такая формулировка ясно и естественно выражает сравнительный смысл.
- source_word: עַל הַלְוִיִּם
  choice: сверх числа левитов
  rationale: При עֹדְפִים предлог עַל указывает, относительно какой группы имеется численный избыток; добавление слова «числа» проясняет, что речь идёт именно о количественном превышении.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: первенцев из числа сынов Израиля
  rationale: Оборот указывает группу, из которой происходят лишние 273 человека. «Сыны Израиля» сохраняет формальное библейское наименование, а «из числа» передаёт партитивное значение предлога מִן.
