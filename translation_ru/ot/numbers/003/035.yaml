base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: ru
  text: Главой[a] родового дома[b] кланов Мерари был Цуриил, сын Авихаила. Они должны были стоять станом у северной стороны скинии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводителем»; еврейское слово может обозначать признанного руководителя или князя.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дома отца» — родственная группа, ведущая происхождение по отцовской линии.'
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Главой
  rationale: נָשִׂיא обозначает признанного руководителя или главу. В контексте устройства левитских кланов «глава» естественно передаёт должность без монархического оттенка слова «князь»; союз ו передан связностью русского предложения, без отдельного «и».
- source_word: בֵית אָב
  choice: родового дома
  rationale: Буквально «дома отца»; это термин патрилинейной родственной организации. «Родовой дом» сохраняет историко-культурный смысл и звучит естественно по-русски.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: кланов Мерари
  rationale: מִשְׁפָּחוֹת здесь означает крупные родственные подразделения, а не отдельные семьи; ל выражает отношение главы к этим кланам.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Цуриил, сын Авихаила
  rationale: Имена переданы в традиционной русской библейской форме, а בֶּן — обычной генеалогической формулой «сын».
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: с северной стороны скинии
  rationale: יֶרֶךְ буквально означает «бок, сторона». Вместе с направительным צָפֹנָה выражение обозначает место стоянки у северной стороны скинии.
- source_word: יַחֲנוּ
  choice: Они должны были располагаться станом
  rationale: Имперфект в данном контексте описывает предписанное расположение лагеря. Такая формулировка сохраняет нормативный смысл и не превращает его в простое сообщение о прошлом.
- source_word: צָפֹנָה
  choice: с северной стороны
  rationale: Направительная форма указывает на север; по-русски естественно включить её в цельное обозначение расположения.
