  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: ru
  text: К Гирсону относились род Ливни и род Шимея; это роды гирсонитов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: К Гирсону принадлежали
  rationale: Предлог לְ выражает отношение или принадлежность в перечне родов; эта формулировка естественно передаёт данный смысл по-русски.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: род / роды
  rationale: В переписном и родословном контексте מִשְׁפָּחָה обозначает родовую группу внутри колена; русское «род» точнее здесь, чем слишком узкое «семья» или слишком широкое «племя».
- source_word: הַלִּבְנִי
  choice: род Ливни
  rationale: Форма принадлежности обозначает группу потомков Ливни. Передача через «род Ливни» ясна современному русскому читателю и сохраняет родословный смысл.
- source_word: הַשִּׁמְעִי
  choice: род Шимея
  rationale: Форма принадлежности обозначает потомков Шимея; параллельная конструкция сохраняет структуру еврейского текста.
- source_word: אֵלֶּה הֵם
  choice: это
  rationale: Стандартная формула отождествления естественно передаётся русским «это» без избыточного местоименного повтора.
- source_word: הַגֵּרְשֻׁנִּי
  choice: гирсонитов
  rationale: Субстантивированное родовое обозначение относится к потомкам Гирсона; традиционная русская форма «гирсониты» кратка и однозначна.
