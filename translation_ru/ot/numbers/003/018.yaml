  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹן לְ/מִשְׁפְּחֹתָ֑/ם לִבְנִ֖י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: ru
  text: 'И вот имена сыновей Гирсона по их родам: Ливни и Шимей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сохраняет соединительный ו и естественно вводит перечень в современном литературном русском.
- source_word: שְׁמוֹת
  choice: имена
  rationale: Форма сопряжённого состояния передана русской родительной конструкцией «имена сыновей».
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: сыновей Гирсона
  rationale: בְּנֵי буквально означает «сыновья»; далее названы два сына, поэтому более широкое «потомки» не требуется.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте исчисления מִשְׁפָּחָה обозначает родовую группу; «по их родам» естественно передаёт распределительное значение לְ.
- source_word: לִבְנִי
  choice: Ливни
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: וְשִׁמְעִי
  choice: и Шимей
  rationale: Традиционная русская передача личного имени с сохранением соединительного союза.
