  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя: «ЯХВЕ» (YHWH); также передаётся как «Иегова».'
    reason: Указывает исходную форму божественного имени и распространённый альтернативный вариант его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Повествовательная форма глагола דבר вводит очередное действие и стандартную формулу божественной речи. В современном русском «сказал Моисею» звучит естественнее, чем буквальное «говорил к Моисею».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом «Господь».
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: В сочетании с русским глаголом «сказать» адресат речи естественно выражается дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма личного имени; в данном контексте употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «сказать» вводит содержание последующей прямой речи. В современном русском эту функцию естественно передаёт двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; традиционная замена «Господь»
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет это имя и не превращает его в титул; примечание сообщает о другой распространённой передаче.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «И» сохранён как средство последовательного развития рассказа; содержание речи вводится двоеточием, поскольку оно следует в следующем стихе.
