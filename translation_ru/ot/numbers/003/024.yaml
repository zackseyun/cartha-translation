lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: А вождём
  rationale: נָשִׂיא обозначает главу или руководителя группы; «вождь» передаёт официальный статус главы рода без обязательного оттенка царской власти. Союз ו передан как «А», естественно продолжающее перечень.
- source_word: בֵית אָב
  choice: отцовского дома
  rationale: Буквально «дом отца»; это устойчивое израильское обозначение родственной группы по отцовской линии. Формулировка сохраняет образ исходного текста, а примечание поясняет его культурный смысл.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: гершонитян
  rationale: Форма указывает на принадлежность к потомкам Гершона; русский родительный множественного числа естественно передаёт коллективное значение.
- source_word: אֶלְיָסָף
  choice: Эльясаф
  rationale: Имя транслитерировано с еврейского с сохранением начального элемента Эль-.
- source_word: בֶּן
  choice: сын
  rationale: Обычная и точная передача родословной связи.
- source_word: לָאֵל
  choice: Лаэл
  rationale: Имя транслитерировано с еврейского; раздельное звучание гласных отражено сочетанием «аэ».
