  source_fidelity: 'Основной смысл передан точно: Надав и Авиуд умерли перед Яхве при принесении אֵשׁ זָרָה; место указано как Синайская пустыня; отсутствие сыновей и последующее священническое служение Елеазара и Ифамара сохранены. Передача «в присутствии» для עַל־פְּנֵי Аарона обоснованно не закрепляет спорный оттенок исключительно как подчинение или как указание на время жизни Аарона.'
