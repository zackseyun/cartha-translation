  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: ru
  text: Но Надав и Авиуд умерли пред Яхве, когда принесли пред Яхве чужой огонь[a] в Синайской пустыне. Сыновей у них не было, и Елеазар и Ифамар служили священниками в присутствии своего отца Аарона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недозволенный огонь». Еврейское выражение также можно передать как «посторонний огонь»; вероятно, имеется в виду огонь, не разрешённый для этого приношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед своим отцом Аароном»; выражение может также означать, что Елеазар и Ифамар служили священниками при жизни Аарона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умерли
  rationale: Форма глагола вводит повествовательное событие смерти; множественное число в русском согласовано с составным подлежащим «Надав и Авиуд».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет пространственно-реляционный образ «перед лицом / в присутствии» и звучит естественно в возвышенном повествовательном регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом «Господь».
- source_word: בְּהַקְרִבָם
  choice: когда принесли
  rationale: Инфинитив с предлогом обозначает обстоятельство времени; глагол «принесли» сохраняет жертвенный оттенок приближения дара к Богу.
- source_word: אֵשׁ זָרָה
  choice: чуждый огонь
  rationale: Близко передаёт זָרָה и сохраняет некоторую неопределённость выражения; вероятный смысл культовой недозволенности пояснён в сноске.
- source_word: בְּמִדְבַּר סִינַי
  choice: в Синайской пустыне
  rationale: Естественная современная русская передача географического сочетания.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: сыновей у них не было
  rationale: Сохраняет конкретное значение בָנִים «сыновья», важное в контексте священнического преемства.
- source_word: וַיְכַהֵן
  choice: служили священниками
  rationale: Передаёт функционирование в священническом служении; множественное число согласовано с двумя названными лицами.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: в присутствии своего отца Аарона
  rationale: Сохраняет образ присутствия и не сводит выражение однозначно ни к хронологии, ни к подчинённости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя.
- issue: Характер «чуждого огня»
  choice: чуждый огонь
  alternative: недозволенный огонь
  rationale: Исходное выражение не уточняет прямо, в чём состояла его неприемлемость; основной текст сохраняет эту напряжённость, а вероятный культовый смысл отмечен в сноске.
- issue: Смысл служения Елеазара и Ифамара עַל־פְּנֵי Аарона
  choice: в присутствии своего отца Аарона
  alternative: при жизни своего отца Аарона
  rationale: Выбранная передача сохраняет исходный образ и допускает хронологический оттенок, не делая его единственным смыслом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «пред Яхве» и «чуждый огонь» сохраняют достоинство и образность оригинала; синтаксис разделён на два предложения ради ясности для современного читателя.
