- from: Им были поручены ковчег, стол, светильник, жертвенники, священные принадлежности, которыми совершают служение, завеса[a] и все работы, связанные с ними.[b]
  to: Им были поручены ковчег, стол, светильник, жертвенники, священная утварь, которой совершают служение, полог[a] и всё служение, связанное с ним.[b]
  rationale: Исправлен заключительный оборот, чтобы не заменять еврейское местоимение единственного числа формой множественного числа и не устранять его неясную отсылку. «Священная утварь» и «полог» обеспечивают более точную и естественную передачу культовой лексики; примечания сохраняют необходимое пояснение и текстовую неоднозначность.
