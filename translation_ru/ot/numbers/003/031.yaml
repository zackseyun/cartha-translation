base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: ru
  text: Им были поручены ковчег, стол, светильник, жертвенники, священная утварь, которой совершают служение, полог[a] и всё служение, связанное с ним.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть входной полог, или завеса, а не внутренняя завеса перед Святым святых.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «и всё его служение (или всю работу при нём)»; к чему именно относится местоимение, не вполне ясно.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: Им были поручены
  rationale: Оборот естественно передаёт в современном русском значение возложенной ответственности или обязанности и вводит перечень предметов, находившихся в их ведении.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: В контексте скинии это общепринятое обозначение священного ковчега; дополнение «завета» или «свидетельства» в еврейском тексте стиха отсутствует.
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Исходный текст содержит простое «стол»; контекст однозначно указывает на предмет обстановки скинии.
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: Так обычно и понятно передаётся культовый многоламповый светильник без ненужной транслитерации.
- source_word: הַמִּזְבְּחֹת
  choice: жертвенники
  rationale: Сохраняется множественное число еврейской формы.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: священные принадлежности
  rationale: כְּלִים обозначает утварь, орудия или принадлежности, а הַקֹּדֶשׁ указывает на их священное назначение. Формулировка естественна и не сужает значение до сосудов.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: которыми совершают служение
  rationale: Инструментальное значение בָהֶם передано творительным оборотом, а культовый оттенок שׁרת — словом «служение».
- source_word: הַמָּסָךְ
  choice: завеса
  rationale: В данном контексте это входная завеса или полог; примечание отличает её от внутренней завесы, обозначаемой другим еврейским словом.
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: и все работы, связанные с ними
  rationale: עֲבֹדָה здесь охватывает необходимые работы или обслуживание. Мужской единственный суффикс допускает не вполне ясную отсылку; русский множественный оборот естественно связывает работы со всем перечисленным, а примечание сохраняет грамматическую неоднозначность.
theological_decisions:
- issue: Культовая терминология служения при скинии
  choice: «совершают служение»
  alternative: «служат» или «выполняют работу»
  rationale: Выбранная формулировка сохраняет сакрально-служебный оттенок שׁרת, не вводя более поздней церковной терминологии.
- issue: Отсылка местоименного суффикса в עֲבֹדָתוֹ
  choice: В тексте естественно связать работы со всеми перечисленными предметами и отметить неоднозначность
  alternative: Связать «всё служение» только с завесой либо с подразумеваемым святилищем
  rationale: Еврейский суффикс стоит в мужском единственном числе, но его антецедент не вполне очевиден. Перевод не должен догматически закреплять одну из возможных отсылок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. Перечень сохранён компактным; культовые термины переданы понятно для широкого читателя. Все маркеры примечаний присутствуют в основном тексте.
