  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: ru
  text: И Моисей сосчитал их по повелению Яхве[a], как ему и было велено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: пересчитал
  rationale: В контексте переписи глагол פקד означает произвести подсчёт людей. «Пересчитал» естественно передаёт действие Моисея по исчислению левитов.
- source_word: אֹתָם
  choice: их
  rationale: Прямое дополнение относится к упомянутым в ближайшем контексте левитам.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Буквально оборот означает «по устам Яхве», но идиоматически указывает на действие согласно Божьему повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: כַּאֲשֶׁר
  choice: как ... и
  rationale: Конструкция подчёркивает точное соответствие действия ранее данному повелению и естественно звучит по-русски.
- source_word: צֻוָּה
  choice: ему было велено
  rationale: Пуаль передаёт страдательное значение «был повелён / ему было велено»; подразумеваемый субъект — Моисей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык; формулировка проста и достойна, а буквальный образ еврейского оборота сохранён в сноске.
