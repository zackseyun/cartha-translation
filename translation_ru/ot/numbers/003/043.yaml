  - severity: low
    issue: Неестественное выражение «по их исчислению»
    rationale: Оборот понятен, но в современном литературном русском звучит тяжеловесно и не вполне идиоматично. «Согласно подсчёту» естественно передаёт переписное значение לִפְקֻדֵיהֶם.
  - severity: low
