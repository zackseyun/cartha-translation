base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: ru
  text: Всех первенцев мужского пола, по числу имён[a], от одного месяца и старше, согласно подсчёту[b], насчитывалось двадцать две тысячи триста семьдесят три.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по числу имён». Это выражение, связанное с переписью, означает, что каждого регистрировали или считали по имени.'
    reason: cultural_note
  - marker: b
    text: 'Или: «согласно их учёту». Еврейское выражение обозначает официальный подсчёт данной группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: насчитывалось
  rationale: В данном контексте форма глагола היה вводит итог переписи. Русское «насчитывалось» естественно связывает перечисленную группу с её общей численностью, не добавляя нового смысла.
- source_word: כָל בְּכוֹר זָכָר
  choice: всех первенцев мужского пола
  rationale: Передаёт совокупность учтённых первенцев и явно сохраняет указание на мужской пол.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Сохраняет формальную переписную идиому, указывающую на поимённый учёт, а не приблизительный подсчёт.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: от одного месяца и старше
  rationale: Естественно передаёт установленный возрастной порог и соответствует обычной русской формуле для возраста.
- source_word: לִפְקֻדֵיהֶם
  choice: по их исчислению
  rationale: Передаёт официальный учёт или перепись данной группы, сохраняя отличие этой формулы от самого итогового числа.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: двадцать две тысячи триста семьдесят три
  rationale: 'Число передано в нормативном для современного русского языка порядке: 22 373.'
