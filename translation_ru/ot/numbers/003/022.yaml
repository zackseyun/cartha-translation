revisions:
- from: Число исчисленных среди них[a] — всех лиц мужского пола от одного месяца и старше — составляло семь тысяч пятьсот.
  to: Учтённых у них — всех лиц мужского пола от одного месяца и старше — насчитывалось семь тысяч пятьсот.
  rationale: Исправлено добавленное «среди», устранена тавтология и уточнена сноска о повторе פְּקֻדֵיהֶם. Повтор не воспроизведён механически в основном тексте, поскольку это породило бы неестественную русскую конструкцию; он прозрачно отмечен в сноске. Смысл переписи, мужской состав, возрастной порог и численность сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:46:22Z'
review_pass:
  verdict: revise
  source_fidelity: Основной смысл, возрастной порог и число переданы верно. Однако פְּקֻדֵיהֶם означает «их учтённые/исчисленные», а не «исчисленные среди них»; «среди них» вносит не выраженное в еврейском тексте отношение. В основном тексте также лучше прямо передать переписной термин без искусственного сочетания «число исчисленных». Повтор פְּקֻדֵיהֶם допустимо не воспроизводить дословно ради естественного русского синтаксиса, но его следует точно отметить в сноске.
  naturalness: Фраза понятна, но «число исчисленных среди них» тавтологично и канцелярски тяжеловесно. «Учтённых у них» и «лиц мужского пола» сохраняют точность переписного регистра и звучат естественнее в современном литературном русском.
  terminology: '«Учтённые» удачно передаёт переписной смысл формы от פקד. Возрастная формула «от одного месяца и старше» точна. Сноску необходимо исправить: еврейское выражение не значит буквально «исчисленных среди них», а повторяется в значении «их учтённые/исчисленные».'
  issues:
  - severity: medium
    issue: Добавлено значение «среди них»
    rationale: Суффикс -הם в פְּקֻדֵיהֶם обозначает принадлежность («их»), но не предлог «среди». Формулировка «исчисленных среди них» создаёт иной оттенок.
  - severity: medium
    issue: Неточная формулировка сноски о буквальном смысле
    rationale: Сноска называет «исчисленных среди них» буквальным соответствием повторяемого еврейского выражения, хотя это не соответствует значению суффикса.
  - severity: low
    issue: Тавтологичная основная формулировка
    rationale: «Число исчисленных» формально понятно, но менее естественно и менее прямо, чем «Учтённых ... насчитывалось».
  revised_text: Учтённых у них — всех лиц мужского пола от одного месяца и старше — насчитывалось семь тысяч пятьсот.
  revised_footnotes:
  - marker: a
    text: 'Или: «состоявших у них на учёте». В еврейском тексте одно и то же переписное выражение повторено дважды: буквально «их учтённые… их учтённые — семь тысяч пятьсот».'
    reason: lexical_alternative
  revision_rationale: Исправлено добавленное «среди», устранена тавтология и уточнена сноска о повторе פְּקֻדֵיהֶם. Повтор не воспроизведён механически в основном тексте, поскольку это породило бы неестественную русскую конструкцию; он прозрачно отмечен в сноске. Смысл переписи, мужской состав, возрастной порог и численность сохранены.
