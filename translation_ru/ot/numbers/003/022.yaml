  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: ru
  text: Учтённых у них — всех лиц мужского пола от одного месяца и старше — насчитывалось семь тысяч пятьсот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных среди них
  rationale: Форма от פקד обозначает людей, учтённых при переписи. «Исчисленных среди них» передаёт как сам подсчёт, так и принадлежность к данной группе; повтор еврейского выражения пояснён в сноске.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: число … всех лиц мужского пола
  rationale: Оборот относится к числу учтённых мужчин. Такая перестройка естественна по-русски и сохраняет мужской пол как существенную характеристику переписи.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: от одного месяца и старше
  rationale: Естественная современная русская передача установленного возрастного порога, буквально «от сына месяца и выше».
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: семь тысяч пятьсот
  rationale: Числительное передано словами в соответствии с нормами связного библейского повествования.
