  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: ru
  text: И вот, Я взял левитов из среды сынов Израиля вместо каждого первенца из сынов Израиля, открывающего утробу; левиты будут Моими.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: А Я — вот
  rationale: Сохраняет союз, выраженное местоимением смысловое выделение говорящего и указательно-усилительную силу הִנֵּה; тире передаёт резкий акцент естественно для русского языка.
- source_word: לָקַחְתִּי
  choice: Я взял
  rationale: Русское прошедшее совершенного вида передаёт завершённое действие, результат которого сохраняет силу в момент провозглашения.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое русское название представителей колена Левия.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: из среды сынов Израиля
  rationale: Близко передаёт выбор изнутри данной общности и сохраняет формульное выражение בְּנֵי יִשְׂרָאֵל.
- source_word: תַּחַת
  choice: вместо
  rationale: Ясно выражает заместительное значение в культово-правовом контексте.
- source_word: כָּל בְּכוֹר
  choice: каждого первенца
  rationale: 'Родительный падеж после «вместо» естественно передаёт распределительное значение: речь идёт о каждом первенце.'
- source_word: פֶּטֶר רֶחֶם
  choice: открывающего утробу
  rationale: Сохраняет конкретный образ и установленную правовую категорию первого, кто выходит из материнской утробы.
- source_word: וְהָיוּ לִי הַלְוִיִּם
  choice: Левиты будут Моими
  rationale: Передаёт принадлежность Богу и результативно-будущее значение, не добавляя последующих богословских категорий.
theological_decisions:
- issue: Передача формулы בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Формальное выражение сохранено как значимая и понятная библейская формула; в данном контексте оно также согласуется с тем, что замещение касается первенцев мужского пола.
- issue: Характер отношения левитов к Богу во фразе וְהָיוּ לִי
  choice: Левиты будут Моими
  alternative: левиты будут принадлежать Мне
  rationale: Прямая формулировка сохраняет утверждение Божьего права на левитов и их посвящённой принадлежности, не уточняя сверх текста природу этой принадлежности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской тональностью. Сохранены эмфатическое «А Я — вот», формульное «сыны Израиля» и конкретный образ «открывающего утробу»; синтаксис разделён на два предложения для ясности без изменения смысловой связи.
