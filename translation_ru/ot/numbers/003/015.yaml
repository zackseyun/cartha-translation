  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: ru
  text: 'Сосчитай сынов Левия по их отеческим домам, по их родам: сосчитай всех лиц мужского пола от одного месяца и старше.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: пересчитай / пересчитай
  rationale: В данном административном контексте глагол означает учёт людей по числу. «Пересчитай» ясно передаёт повеление и повтор глагола, не внося военного оттенка.
- source_word: בְּנֵי לֵוִי
  choice: сынов Левия
  rationale: Буквальное выражение сохраняет генеалогическую направленность текста; здесь речь идёт о потомках Левия, распределённых по отеческим домам и родам.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отеческим домам
  rationale: «Отеческий дом» передаёт устойчивое родовое обозначение патрилинейной семейной единицы и позволяет отличить её от следующего термина «род».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: «Род» естественно обозначает более широкую или отдельную родственную группу и не смешивается в русском тексте с «отеческим домом».
- source_word: כָּל זָכָר
  choice: всех лиц мужского пола
  rationale: Формулировка указывает на пол, а не на взрослый возраст, что существенно, поскольку учитываются и младенцы.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: от одного месяца и старше
  rationale: Это естественная современная русская формулировка нижней возрастной границы, точно передающая смысл еврейской идиомы.
