  - marker: b
    text: 'Буквально: «дом отца»; родовое объединение, ведущее происхождение по отцовской линии.'
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: А начальником
  rationale: Союз ו передаёт продолжение перечня, а נָשִׂיא в данном контексте обозначает признанного главу или руководителя рода, не обязательно князя в монархическом смысле.
- source_word: בֵּית אָב
  choice: отчего дома
  rationale: Это устойчивое обозначение родового объединения, ведущего происхождение по отцовской линии. «Отчий дом» сохраняет образ исходного выражения и звучит естественнее буквального «дом отца».
- source_word: לְמִשְׁפְּחֹת
  choice: семейств
  rationale: מִשְׁפָּחוֹת обозначает родственные группы или кланы. «Семейства» позволяет сохранить представленную в еврейском тексте многоуровневую родовую структуру.
- source_word: הַקְּהָתִי
  choice: каафитян
  rationale: Форма единственного числа с артиклем употреблена собирательно и обозначает потомков Каафа как группу.
- source_word: אֶלִיצָפָן
  choice: Елицафан
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן עֻזִּיאֵל
  choice: сын Уззиила
  rationale: Стандартная родословная формула; имена переданы в традиционной русской библейской форме.
