  language: ru
  text: «Приведи племя Левия и поставь его перед священником Аароном, и они будут служить ему»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнять служение при нём». Еврейский глагол может обозначать служение в качестве помощников, в том числе в богослужебном контексте.'
    reason: лексическая_альтернатива
lexical_decisions:
- source_word: הַקְרֵב
  choice: Приведи
  rationale: Побудительная форма глагола קרב означает «приблизить, привести». «Приведи» естественно передаёт конкретное действие и сохраняет смысл приближения.
- source_word: מַטֵּה לֵוִי
  choice: племя Левия
  rationale: В данном контексте מַטֶּה обозначает не буквальный посох, а племя как общественную группу.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: и поставь его
  rationale: Побудительная форма עמד означает «поставить, расположить». Местоимение единственного числа согласуется с собирательным существительным «племя».
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: перед священником Аароном
  rationale: לִפְנֵי прямо означает «перед, в присутствии». Русский порядок слов звучит естественно и ясно обозначает статус Аарона.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: чтобы они служили ему
  rationale: שרת обозначает служение или исполнение обязанностей, в том числе при богослужении. Множественное число передаёт переход от собирательного «племя» к его членам, а «ему» сохраняет прямое дополнение, относящееся к Аарону.
theological_decisions:
- issue: Характер служения левитов Аарону
  choice: Левиты поставлены перед Аароном, чтобы служить ему в его священническом служении.
  alternative: Левиты служат вместе с Аароном.
  rationale: Прямое дополнение אֹתוֹ естественнее всего относится к Аарону и указывает на служение, оказываемое ему; перевод не заменяет это отношением совместного служения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-торжественный. Сохранён переход от единственного числа собирательного «племя» к множественному «они».
