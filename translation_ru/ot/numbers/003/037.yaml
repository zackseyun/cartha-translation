  yaml_path: translation/ot/numbers/003/037.yaml
  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: ru
  text: и столбы двора со всех сторон, и их основания[a], и их колья, и их шнуры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнёзда». Еврейское слово обозначает опорные детали, особенно в описаниях Скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верёвки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: столбы
  rationale: Речь идёт о вертикальных опорах ограды двора; «столбы» — естественный и точный термин в данном архитектурном контексте.
- source_word: הֶחָצֵר
  choice: двора
  rationale: Слово обозначает ограждённый двор при Скинии; «двор» ясно и соответствует контексту.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт расположение столбов по всему периметру двора и звучит естественно по-русски.
- source_word: אַדְנֵיהֶם
  choice: их основания
  rationale: В описаниях Скинии термин обозначает опорные детали, в которые устанавливались столбы; «основания» понятно широкому читателю, тогда как «гнёзда» технически конкретнее.
- source_word: יְתֵדֹתָם
  choice: их колья
  rationale: Имеются в виду колья, служившие для закрепления конструкции; «колья» точно и лаконично передаёт предмет.
- source_word: מֵיתְרֵיהֶם
  choice: их шнуры
  rationale: Термин обозначает шнуры или верёвки для закрепления конструкции; «шнуры» сохраняет предметное значение без лишнего пояснения.
- source_word: וְ
  choice: и
  rationale: Повтор союза сохранён, поскольку стих продолжает перечень и еврейский текст подчёркивает его перечислительный ритм.
