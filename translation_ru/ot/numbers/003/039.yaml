  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: ru
  text: Всех исчисленных левитов, которых Моисей и Аарон[b] исчислили по повелению Яхве[a], по их родам, — всех мужского пола от одного месяца и старше — было двадцать две тысячи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве»; это еврейское выражение означает «по повелению Яхве».'
    reason: lexical_alternative
  - marker: b
    text: В еврейской масоретской традиции над словами «и Аарон» стоят особые точки, вероятно указывающие, что переписчики считали эти слова требующими внимания или сомнительными. При этом они сохранены в основном тексте.
    reason: textual_variant
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: исчисленных / исчислили
  rationale: Оба слова относятся к проведению переписи. «Исчислить» сохраняет повтор корня в еврейском тексте и передаёт официальный характер подсчёта без добавочного военного оттенка.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Устоявшееся русское название потомков Левия.
- source_word: עַל־פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Буквально «по устам Яхве»; в данном контексте это идиома, обозначающая повеление или распоряжение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: «Роды» естественно обозначает здесь родственные подразделения левитов и точнее контексту переписи, чем современное узкое понимание слова «семьи».
- source_word: כָּל זָכָר
  choice: всех мужского пола
  rationale: Передаёт явное указание на мужской пол и применимо как к младенцам, так и ко взрослым.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: от одного месяца и старше
  rationale: Естественная современная русская формулировка возрастного порога, соответствующая еврейскому обороту.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: двадцать две тысячи
  rationale: Прямая передача количественного числительного.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Особые точки над словами וְאַהֲרֹן («и Аарон»)
  choice: Сохранить слова «и Аарон» в основном тексте и отметить масоретскую особенность в сноске
  alternative: Опустить «и Аарон» или оставить без пояснения
  rationale: Согласный текст прямо содержит имя Аарона, но масоретские особые точки требуют прозрачного упоминания, не позволяя уверенно устранять слова из текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет охват исходной фразы и её итоговую формулу переписи; тире помогают ясно отделить уточнение о составе исчисленных.
