  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: ru
  text: Возьми левитов вместо каждого первенца среди израильтян[a] и скот левитов — вместо их скота. Левиты будут принадлежать Мне. Я — Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди сынов Израиля». Буквально: «среди сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. ЙХВХ; традиционная передача: «ГОСПОДЬ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Возьми
  rationale: Прямое повеление Моисею; глагол לקח здесь означает взять или назначить левитов для замещения первенцев.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое русское обозначение членов колена Левия.
- source_word: תַּחַת
  choice: вместо
  rationale: В данном контексте слово выражает замещение, а не пространственное положение; краткое русское «вместо» естественно передаёт обе параллельные конструкции.
- source_word: כָּל בְּכוֹר
  choice: каждого первенца
  rationale: Сочетание כָּל с существительным в единственном числе имеет распределительное значение.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохраняет буквальный образ еврейского выражения и передаёт партитивное значение предлога בְּ; более свободный вариант — «среди израильтян».
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: скот левитов
  rationale: בְּהֵמָה обозначает здесь домашних животных как собирательную категорию; «скот» — естественный и точный русский эквивалент.
- source_word: בְּהֶמְתָּם
  choice: их скота
  rationale: Местоименный суффикс мужского рода множественного числа отсылает к сынам Израиля; повтор слова «скот» сохраняет параллелизм.
- source_word: וְהָיוּ לִי
  choice: будут принадлежать Мне
  rationale: Ясно выражает принадлежность Богу; несколько естественнее по-русски, чем буквальное «будут Моими».
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Передаёт формулу божественного самоотождествления и сохраняет личное имя, представленное тетраграмматоном.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст непосредственно содержит тетраграмматон; «Яхве» передаёт заветное имя, тогда как традиционное «ГОСПОДЬ» отмечено в сноске как возможная передача.
- issue: Характер замещения левитами первенцев
  choice: вместо каждого первенца
  alternative: за каждого первенца
  rationale: «Вместо» сохраняет прямое значение תַּחַת и идею установленного Богом замещения, не добавляя объяснения его богословского механизма.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм двух замещений сохранён; архаизмы и конфессионально окрашенные пояснения не вводятся.
