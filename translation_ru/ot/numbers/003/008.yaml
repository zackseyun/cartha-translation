  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: ru
  text: Они должны нести ответственность за всю утварь шатра встречи и исполнять обязанности сынов Израиля, чтобы совершать служение при скинии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нести стражу (исполнять поручение), связанную с сынами Израиля». Еврейское слово может означать стражу, поручение или обязанность.'
    reason: Передаёт варианты значения מִשְׁמֶרֶת, не уточняя односторонне, кому именно поручена эта обязанность.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: должны охранять … и исполнять
  rationale: В священническом контексте שׁמר обозначает как охрану вверенного, так и исполнение порученных обязанностей. Разные русские глаголы перед двумя дополнениями передают обе стороны значения без неестественного повтора.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: всю утварь шатра встречи
  rationale: כְּלִים охватывает принадлежности, предметы и сосуды святилища; «утварь» достаточно широко и естественно передаёт культовый контекст. «Шатёр встречи» сохраняет образ шатра и значение назначенной встречи.
- source_word: מִשְׁמֶרֶת
  choice: обязанности
  rationale: Существительное может означать стражу, поручение или вверенную обязанность. В сочетании с сынами Израиля «обязанности» даёт ясный современный русский текст, а смысловая широта отмечена в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранена выраженная в еврейском тексте мужская корпоративная формула, традиционно обозначающая народ Израиля.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: совершая служение при скинии
  rationale: Оборот с однокоренными עבד и עֲבֹדָה обозначает выполнение священного труда. «Совершая служение» естественно передаёт конструкцию, а «при скинии» по-русски яснее, чем буквальное «служение скинии», не превращая скинию в получателя служения.
theological_decisions:
- issue: Отношение обязанностей к сынам Израиля в выражении מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: исполнять обязанности сынов Израиля
  alternative: нести порученную сынам Израиля стражу
  rationale: Еврейская конструкция допускает оттенки обязанности, поручения и стражи. Основной текст не уточняет сверх источника, каким именно образом левиты исполняют это от имени или вместо Израиля; альтернативный оттенок сохранён в сноске.
- issue: Корпоративное мужское выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формальное выражение источника сохранено без превращения его в гендерно нейтральное национальное обозначение.
translation_notes:
  register: Современный литературный русский с достоинством культового контекста. Термины «шатёр встречи» и «скиния» различают אֹהֶל מוֹעֵד и מִשְׁכָּן; синтаксис сделан естественным, но смысловая неоднозначность מִשְׁמֶרֶת не устранена.
