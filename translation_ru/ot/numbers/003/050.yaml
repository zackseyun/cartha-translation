base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: ru
  text: От первенцев сынов Израиля он взял серебро — тысячу триста шестьдесят пять шекелей, по шекелю святилища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть по весовому стандарту, установленному для святилища.
    reason: Поясняет, что выражение «по шекелю святилища» обозначает применяемый стандарт веса.
lexical_decisions:
- source_word: מֵאֵת
  choice: у
  rationale: Предлог у естественно обозначает лиц, от которых было получено серебро, не добавляя значения посредничества.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: первенцев сынов Израиля
  rationale: Собирательное значение единственного числа передано множественным числом; выражение «сыны Израиля» сохраняет структуру еврейского текста и мужскую отнесённость контекста исчисления и выкупа.
- source_word: לָקַח
  choice: взял
  rationale: Прямое значение глагола сохранено; контекст ясно показывает получение выкупной платы.
- source_word: הַכָּסֶף
  choice: серебро
  rationale: Сохранено буквальное обозначение материала, которое в данном контексте также служит денежным средством.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: тысячу триста шестьдесят пять
  rationale: Число передано в обычном для современного русского языка порядке.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Формула естественно указывает на установленный при святилище весовой стандарт, сохраняя связь определения קֹדֶשׁ со святостью.
