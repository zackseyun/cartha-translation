lexical_decisions:
- source_word: וְנָתַתָּה
  choice: И отдай
  rationale: Форма qal с союзом в контексте последовательных предписаний передаёт повеление; русское совершенное повелительное естественно продолжает указание предыдущего стиха.
- source_word: הַכֶּסֶף
  choice: это серебро
  rationale: כֶּסֶף буквально означает «серебро» и здесь обозначает уже упомянутую выкупную плату; указательное «это» естественно передаёт определённость.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Аарону и его сыновьям
  rationale: Сохраняются оба адресата и конкретное указание на сыновей Аарона в священническом контексте.
- source_word: פְּדוּיֵי
  choice: как выкуп за
  rationale: Сжатая конструкция связана с передаваемым серебром и по смыслу указывает на выкупную плату; такой перевод ясно выражает функцию серебра, не меняя референтов.
- source_word: הָעֹדְפִים
  choice: тех … кто оказался сверх числа
  rationale: Причастие обозначает людей, оставшихся сверх соответствующего числа; выражение «сверх числа» сохраняет счётный контекст и звучит естественно по-русски.
- source_word: בָּהֶם
  choice: из них
  rationale: Предлог с местоименным суффиксом обозначает избыточных лиц внутри ранее названной группы; «из них» точно и идиоматично передаёт это отношение.
