lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: и возьми
  rationale: Форма с союзом в контексте предписания передана повелительным наклонением; союз «и» сохраняет связь с предыдущим указанием.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: по пять шекелей
  rationale: Повторение числительного выражает распределительное значение, которое естественно передаётся русской конструкцией с «по».
- source_word: לַגֻּלְגֹּלֶת
  choice: с человека
  rationale: Буквально «на голову»; в данном учётном контексте это идиома со значением «за каждого человека».
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по шекелю святилища
  rationale: Сохраняется культовая отсылка и значение установленного при святилище весового стандарта.
- source_word: תִּקָּח עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: в шекеле двадцать гер
  rationale: Хотя תִּקָּח формально означает «возьми», синтаксис поясняет величину только что названного шекеля; по-русски естественна эквивалентная формула меры.
- source_word: עֶשְׂרִים גֵּרָה
  choice: двадцать гер
  rationale: Сохраняется древнееврейское название малой единицы веса; после числительного «двадцать» употреблена нормативная русская форма родительного множественного числа.
