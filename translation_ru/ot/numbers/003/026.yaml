lexical_decisions:
- source_word: קַלְעֵי
  choice: завесы
  rationale: Речь идёт о тканевых полотнищах, образующих ограду двора; «завесы» естественно и достаточно точно передаёт их назначение.
- source_word: חָצֵר
  choice: двор
  rationale: Обозначает ограждённое пространство вокруг скинии; «двор» — ясный и устойчивый русский эквивалент в контексте святилища.
- source_word: מָסַךְ
  choice: полог
  rationale: Тканевая завеса, закрывающая вход; «полог» отличает её от завес, образующих ограду двора.
- source_word: פֶּתַח
  choice: вход
  rationale: Передаёт проём для входа, не создавая представления о жёстких воротах.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: во двор, окружающий скинию и жертвенник
  rationale: Относительное предложение естественно связывается с двором и передаёт его расположение вокруг скинии и жертвенника.
- source_word: מִשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское библейское обозначение священного шатрового жилища.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Стандартный русский эквивалент в культовом контексте.
- source_word: מֵיתָרָיו
  choice: его верёвки
  rationale: Конкретно и понятно передаёт верёвки или шнуры, служившие для закрепления конструкции; местоименный суффикс оригинала сохранён.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: для всех работ при нём
  rationale: Передаёт весь круг практических обязанностей, связанных с названным устройством, без неоправданного добавления предметов или действий.
