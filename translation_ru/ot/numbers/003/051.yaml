base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И Моисей отдал выкупные деньги[a] Аарону и его сыновьям по повелению Яхве, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро выкупленных», то есть плата, собранная за их выкуп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן в повествовательной форме означает передачу денег получателям; «отдал» естественно передаёт завершённое действие в данном контексте.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: выкупные деньги
  rationale: Буквально конструкция означает «серебро выкупленных»; по контексту это деньги, собранные как плата за выкуп. Выражение «выкупные деньги» кратко и понятно передаёт юридико-культовый смысл.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Аарону и его сыновьям
  rationale: Местоименный суффикс относится к Аарону; повтор предлога в русском естественно передаётся одним дательным управлением.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Буквально «по устам Яхве» — устойчивое обозначение действия согласно Божьему повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Яхве и повелел Моисею
  rationale: כַּאֲשֶׁר выражает точное соответствие ранее данному повелению; частица «и» естественно подчёркивает это соответствие по-русски.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
