id: NUM.3.13
reference: Numbers 3:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: ru
  text: Ибо всякий первенец принадлежит Мне[a]. В тот день, когда Я поразил всех первенцев в земле Египетской, Я освятил Себе всякого первенца в Израиле — от человека до скота[b]. Они будут принадлежать Мне. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мне». Это выражение принадлежности повторяется в стихе трижды: «Мне / Себе / будут принадлежать Мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от человека до скота» — устойчивое выражение, охватывающее людей и животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующего утверждения о левитах; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет торжественный регистр.
- source_word: לִי
  choice: принадлежит Мне / Себе / будут принадлежать Мне
  rationale: Троекратное לִי подчёркивает принадлежность Богу. В русском повтор передан формами с тем же значением, но с естественным синтаксисом.
- source_word: כָּל בְּכוֹר
  choice: всякий первенец / всех первенцев
  rationale: בְּכוֹר обозначает первородное потомство; указание на мужской пол в данном стихе отсутствует, поэтому оно не добавлено. Формы изменены по требованиям русского синтаксиса.
- source_word: בְּיוֹם
  choice: В тот день, когда
  rationale: Сохранена явная временная привязка к историческому событию, а не сведена к одному «когда».
- source_word: הַכֹּתִי
  choice: Я поразил
  rationale: В контексте казни египетских первенцев глагол נכה означает смертельное поражение; русский глагол «поразил» сохраняет и смысл, и библейскую торжественность.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохранено полное обозначение территории, явно присутствующее в еврейском тексте.
- source_word: הִקְדַּשְׁתִּי
  choice: Я освятил
  rationale: Каузативная форма קדשׁ означает отделить как святыню для Бога. «Освятил Себе» сохраняет культовый смысл и прямую связь с последующим утверждением о принадлежности.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Буквально и естественно обозначает среду, в которой первенцы были освящены.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: от человека до скота
  rationale: Сохранён еврейский меризм, охватывающий людей и домашних животных; «скот» точно соответствует בְּהֵמָה в данном контексте.
- source_word: יִהְיוּ
  choice: Они будут принадлежать
  rationale: Будущая форма выражает продолжающееся и установленное Богом право на первенцев; явный глагол принадлежности делает русскую фразу естественной.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Формула утверждает личность и власть говорящего; личное имя передано непосредственно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не привнося конфессионального толкования.
- issue: Характер освящения первенцев
  choice: освятил Себе
  alternative: посвятил Себе / отделил Себе как святыню
  rationale: Глагол הִקְדַּשְׁתִּי содержит идею придания священного статуса, а повтор לִי — принадлежности Богу. Выбранная формулировка удерживает оба аспекта, не сводя действие лишь к владению.
- issue: Объём выражения מֵאָדָם עַד בְּהֵמָה
  choice: от человека до скота
  alternative: от людей до животных
  rationale: Буквальный меризм сохраняет коллективное значение אָדָם и противопоставление человеческой и животной сфер, не уточняя сверх текста пол первенцев.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; повтор идеи принадлежности и формальная временная связь исходного текста сохранены.
