  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: ru
  text: Вот родословие Аарона и Моисея в то время, когда Яхве говорил с Моисеем на горе Синай[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки Аарона и Моисея». Еврейское слово, переведённое как «родословие», представляет собой обычную формулу, которая может вводить перечень потомков или повествование о том, что произошло от названного лица.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в день, когда»; это еврейский оборот со значением «в то время, когда» или просто «когда».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «говорил Моисею».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит новый раздел и передаёт указательную формулу; начальный союз в русском заголовочном обороте можно не выражать отдельно.
- source_word: תּוֹלְדֹת
  choice: родословие
  rationale: В данном контексте слово служит заголовком к семейной линии, далее перечисляющей сыновей Аарона. «Родословие» сохраняет формульный характер, не сводя значение только к слову «потомки».
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Аарона и Моисея
  rationale: Сохранены оба имени в том порядке, в каком они стоят в еврейском тексте, хотя далее речь сосредоточена на сыновьях Аарона.
- source_word: בְּיוֹם
  choice: в то время, когда
  rationale: Еврейское «в день» здесь имеет временное идиоматическое значение; выбран естественный современный русский эквивалент.
- source_word: דִּבֶּר ... אֶת־מֹשֶׁה
  choice: говорил с Моисеем
  rationale: Конструкция דבר את допускает значение «говорить с кем-либо»; перевод сохраняет возможный оттенок общения, а вариант «говорил Моисею» отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּהַר סִינָי
  choice: на горе Синай
  rationale: Нормативное и естественное русское обозначение места.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение תולדות в заголовке, называющем Аарона и Моисея
  choice: родословие Аарона и Моисея
  alternative: потомки Аарона и Моисея; история рода Аарона и Моисея
  rationale: Сохранены оба названных лица и напряжение между заголовком и последующим перечнем, сосредоточенным на сыновьях Аарона; перевод не исправляет и не сужает формулировку источника.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формульное תולדות передано словом «родословие», более естественным по-русски, чем буквальное «поколения»; неоднозначность раскрыта в сноске. Личное имя יהוה передано как «Яхве».
