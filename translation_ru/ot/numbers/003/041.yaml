id: NUM.3.41
reference: Numbers 3:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: ru
  text: И возьми левитов для Меня (Я — Яхве) вместо всех первенцев среди сынов Израиля[a], а скот левитов — вместо всех первенцев среди скота сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди израильтян». Буквально: «среди сынов Израиля».'
    reason: Лексическая альтернатива поясняет идиоматический национальный смысл, сохраняя в основном тексте форму еврейского выражения.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: И возьми
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, с союзом в данном предписании передаёт повеление Моисею; русское повелительное наклонение звучит естественно и сохраняет директивную силу.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Обычное русское обозначение потомков Левия; определённость ясно задаётся контекстом.
- source_word: לִי
  choice: для Меня
  rationale: Предлог выражает принадлежность и посвящение; «для Меня» естественно передаёт смысл отделения левитов Богу.
- source_word: אֲנִי יְהוָה
  choice: Я Яхве
  rationale: Сохранена краткая эмфатическая формула самоидентификации и личное имя, стоящее в еврейском тексте.
- source_word: תַּחַת
  choice: вместо
  rationale: В контексте замещения первенцев слово обозначает занятие их места, а не пространственное положение «под».
- source_word: כָּל בְּכֹר
  choice: всех первенцев
  rationale: Сочетание כָּל с существительным в единственном числе имеет собирательно-дистрибутивный смысл; в русском контексте естественно множественное число.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Передаёт буквальную родовую формулу «сыны Израиля», не устраняя её грамматически мужскую форму; более идиоматичный вариант отмечен в сноске.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: скот левитов
  rationale: בְּהֵמָה здесь собирательно обозначает домашних животных; «скот» — точный и естественный русский эквивалент.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: всех первенцев среди скота сынов Израиля
  rationale: Формулировка сохраняет параллелизм первой части стиха и ясно указывает на первородных животных, принадлежавших сынам Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное четырёхбуквенное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранная формулировка сохраняет родовую и грамматически мужскую форму оригинала. В сноске приведён естественный русский национальный эквивалент без изменения основного текста.
- issue: Характер замещения левитами первенцев
  choice: вместо
  alternative: за; взамен
  rationale: Текст прямо выражает заместительное отношение, но не уточняет его дальнейшую богословскую природу; перевод не добавляет такого уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, нормативным звучанием. Синтаксический параллелизм двух заместительных формул сохранён; тире выделяют вставную формулу божественной самоидентификации.
