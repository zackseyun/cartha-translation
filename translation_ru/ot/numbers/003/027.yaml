base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: ru
  text: 'У Каафа были: род амрамитян, род ицгаритян, род хевронитян и род уззиилитян — это роды каафитян.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: У Каафа были
  rationale: Предлог לְ вводит следующую генеалогическую группу; по-русски оборот «У Каафа были» естественно выражает принадлежность перечисленных родов, а союз не требуется в отдельном стихе.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: род / роды
  rationale: В переписном и родословном контексте מִשְׁפָּחָה обозначает родовую группу внутри более крупного объединения; «род» — ясный и традиционно понятный русский эквивалент.
- source_word: הַֽ/עַמְרָמִי
  choice: амрамитян
  rationale: Форма принадлежности обозначает потомков Амрама; русское множественное этнонимическое образование передаёт это значение.
- source_word: הַ/יִּצְהָרִי
  choice: ицгаритян
  rationale: Обозначает потомков Ицгара; написание имени согласовано с принятой русской библейской формой «Ицгар».
- source_word: הַֽ/חֶבְרֹנִי
  choice: хевронитян
  rationale: Обозначает потомков Хеврона; форма естественна для русского родового наименования.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: уззиилитян
  rationale: Обозначает потомков Уззиила; форма сохраняет связь с личным именем.
- source_word: אֵלֶּה הֵם
  choice: это
  rationale: В русском именное отождествляющее предложение естественно оформляется указательным словом «это» без выраженной связки настоящего времени.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: роды каафитян
  rationale: Передаёт итоговую классификацию перечисленных групп как потомков Каафа.
