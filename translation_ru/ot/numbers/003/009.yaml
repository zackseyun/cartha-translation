base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: ru
  text: 'Передай левитов Аарону и его сыновьям: они всецело отданы[a] ему из среды сынов Израиля.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отданы, отданы»; повтор слова «отданы» служит для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из среды израильтян». Буквально: «из среды сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Передай
  rationale: Форма совершенного вида с союзом в контексте предписания выражает повеление. «Передай» естественно обозначает поручение левитов Аарону для служения и сохраняет направленность действия.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Устоявшееся русское обозначение представителей колена Левия, выделенных для служения при святилище.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Аарону и его сыновьям
  rationale: Предлог לְ обозначает адресатов передачи; русский дательный падеж точно и естественно передаёт эту синтаксическую связь.
- source_word: נְתוּנִם נְתוּנִם
  choice: всецело отданы
  rationale: Повтор страдательного причастия усиливает мысль о полной и несомненной передаче. Наречие «всецело» передаёт эмфазу естественным современным русским языком, а буквальный повтор отмечен в сноске.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение выделяет левитов как подлежащее. В русском явное «они» сохраняет это лёгкое смысловое ударение.
- source_word: לוֹ
  choice: ему
  rationale: Местоимение относится к Аарону, названному непосредственно перед этим, и сохраняет образ передачи в его распоряжение для служения.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: из среды сынов Израиля
  rationale: מֵאֵת указывает на источник, а в данном контексте — на выделение левитов из более широкого народа. «Сыны Израиля» сохраняет родственно-заветную форму еврейского выражения; более обычный коллективный вариант приведён в сноске.
theological_decisions:
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Буквальное мужское множественное выражение имеет родственно-заветную окраску и здесь обозначает общность, из среды которой выделены левиты. Формулировка «сыны Израиля» сохраняет эту окраску, не добавляя конфессионального толкования; современный коллективный эквивалент указан в сноске.
- issue: Степень принадлежности левитов Аарону в נְתוּנִם נְתוּנִם
  choice: всецело отданы
  alternative: даны, даны; несомненно отданы
  rationale: Повтор подчёркивает полноту или решительность назначения, но сам по себе не определяет позднейшую богословскую модель власти или собственности. Перевод сохраняет усиление, не развивая его в доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Передай» яснее передаёт назначение для служения, чем потенциально двусмысленное «отдай». Выражение «сыны Израиля» сохранено как традиционное и близкое к форме оригинала; сноска предлагает более обычный современный эквивалент.
