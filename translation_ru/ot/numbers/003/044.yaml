lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в повествовательной формуле обозначает речевое обращение. «Сказал» естественно передаёт эту формулу по-русски; последующее לֵאמֹר выражено двоеточием, вводящим содержание речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: Моисею
  rationale: Предлог אֶל при глаголе речи естественно передаётся русским дательным падежом адресата.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма древнееврейского имени.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит содержание последующей речи; в современном литературном русском эту функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» сохраняет личное имя; примечание сообщает о традиционной замене титулом и другой транслитерации.
translation_notes:
  register: Современный литературный русский язык. Краткая формула с двоеточием звучит естественнее буквального «говоря» и сохраняет его функцию — введение прямой речи.
