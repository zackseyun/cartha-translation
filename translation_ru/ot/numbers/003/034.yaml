  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: ru
  text: А исчисленных среди них[a] — всех лиц мужского пола от одного месяца и старше — было шесть тысяч двести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «число учтённых у них»; еврейское выражение обозначает итог переписи этой группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных среди них
  rationale: Форма от פקד с местоименным суффиксом указывает на учтённых при переписи людей, принадлежащих к данной группе. «Исчисленных среди них» сохраняет конкретный смысл и естественно звучит в контексте переписи.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: всех лиц мужского пола
  rationale: Оборот обозначает совокупное число всех мужчин и мальчиков, подлежащих учёту. «Лиц мужского пола» точно охватывает весь возрастной диапазон, включая младенцев.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: от одного месяца и старше
  rationale: Устойчивая возрастная формула задаёт нижний предел учёта; современная русская формулировка передаёт его ясно и кратко.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: шесть тысяч двести
  rationale: Точное словесное воспроизведение итогового количества в литературном библейском тексте.
