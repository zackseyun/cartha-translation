  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: ru
  text: И пусть они исполняют порученное ему[a] и порученное всей общине перед шатром встречи, чтобы нести служение при скинии.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, по ближайшему контексту, порученное Аарону. Еврейское сочетание также может подразумевать несение или охрану вверенной обязанности.
    reason: lexical_alternative
  - marker: b
    text: Левиты исполняли при святилище обязанности, связанные как с Аароном, так и со всей общиной Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתּוֹ
  choice: пусть они исполняют порученное ему
  rationale: Сочетание שׁמר с מִשְׁמֶרֶת обозначает соблюдение, несение или охрану вверенной обязанности. «Исполняют порученное» естественно по-русски передаёт ответственность, не сводя смысл только к физической охране; местоименный суффикс сохранён.
- source_word: וְאֶת־מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: и порученное всей общине
  rationale: Повтор «порученное» сохраняет параллелизм двух употреблений מִשְׁמֶרֶת. Формулировка оставляет возможным как исполнение обязанностей общины, так и действие в её интересах или от её имени.
- source_word: הָעֵדָה
  choice: община
  rationale: В книге Чисел עֵדָה означает общину Израиля; «община» современно, понятно и уместно в культовом контексте.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: перед шатром встречи
  rationale: «Перед» сохраняет пространственное значение לִפְנֵי, а «шатёр встречи» прямо и понятно передаёт אֹהֶל מוֹעֵד.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת הַמִּשְׁכָּן
  choice: совершая служение при скинии
  rationale: Оборот передаёт цель или практическое осуществление поручения и сохраняет культовый смысл עֲבֹדָה. Предлог «при» естественно обозначает служение, связанное со скинией, не представляя саму скинию получателем служения.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: «Скиния» — укоренившееся и понятное русское обозначение переносного святилища; буквальное значение «обиталище» здесь не требуется выносить в основной текст.
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в מִשְׁמַרְתּוֹ
  choice: В основном тексте сохранено «ему», а примечание указывает на Аарона как наиболее вероятного предшествующего референта.
  alternative: Понимать выражение безлично как поручение святилища либо совокупную священническую обязанность.
  rationale: В непосредственном контексте левиты отданы Аарону и его сыновьям, поэтому Аарон — наиболее естественный референт. Однако еврейский стих выражает это местоимением, и перевод не должен заменять его именем без необходимости.
- issue: Отношение левитов к поручению всей общины
  choice: Сохранено неоднозначное «порученное всей общине».
  alternative: 'Уточнить: «обязанности от имени всей общины» или «обязанности перед всей общиной».'
  rationale: Конструкция с родительным сочетанием может обозначать обязанности, относящиеся ко всей общине и исполняемые левитами за неё; добавление «от имени» было бы правдоподобным, но более истолковывающим.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Пусть» передаёт предписывающую форму без архаического «да». Термины «шатёр встречи» и «скиния» различены согласно двум разным еврейским наименованиям. Все примечания отмечены в основном тексте.
