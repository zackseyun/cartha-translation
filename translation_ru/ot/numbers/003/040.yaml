base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Пересчитай всех первенцев мужского пола среди сынов Израиля от одного месяца и старше и составь их поимённый список[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и возьми число их имён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога YHWH как имя собственное, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет обычную для еврейского повествования последовательную связь; по-русски формула звучит естественно и достойно.
- source_word: פְּקֹד
  choice: Пересчитай
  rationale: В данном контексте повеление относится к учёту определённой группы; «пересчитай» ясно выражает действие без излишне административного оттенка слова «исчисли».
- source_word: כָּל בְּכֹר זָכָר
  choice: всех первенцев мужского пола
  rationale: Сохраняет как значение «первенец», так и явное уточнение пола, не сужая выражение до «сыновей».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: у сынов Израиля
  rationale: Сохраняет буквальный образ «сынов Израиля», а предлог «у» естественно обозначает принадлежность первенцев к этой общности.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: от одного месяца и старше
  rationale: Естественно передаёт нижнюю возрастную границу, выраженную еврейской формулой.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: и пересчитай их поимённо
  rationale: 'Передаёт идиоматический смысл буквального выражения «возьми число их имён»: произвести персональный, поимённый учёт.'
