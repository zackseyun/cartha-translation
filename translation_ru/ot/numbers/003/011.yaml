  footnotes:
  - marker: a
    text: 'Еврейская формула: «И сказал Яхве Моисею, говоря». Начальный союз можно также передать словом «и».'
    reason: Уточняет формальное соответствие еврейской речевой формуле без неуместного значения длительности; сохраняет допустимый вариант передачи начального וַ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Затем … сказал
  rationale: Форма с вау продвигает повествование; «затем» естественно передаёт последовательность событий. В сочетании с לֵאמֹר глагол «сказал» вводит последующую прямую речь без тяжеловесного повтора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל; имя מֹשֶׁה передано в принятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит речь, содержание которой следует в следующем стихе. В современном русском эту функцию естественно выполняет двоеточие; отдельное «говоря» создало бы неестественный повтор.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Форма «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» отражает более позднюю гибридную традицию произношения.
translation_notes:
  register: Современный литературный русский язык. Формула речи передана естественно и сдержанно; двоеточие вводит продолжение в следующем стихе. Имя «Яхве» сохранено как личное имя.
