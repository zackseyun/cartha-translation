  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве[a] Моисею в Синайской пустыне:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; традиционно передаётся как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма с вау-последовательным вводит очередное повествовательное событие речи; «говорил» сохраняет традиционную формулу и сочетается с последующим לֵאמֹר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Естественная русская конструкция с дательным падежом после глагола речи.
- source_word: בְּמִדְבַּר סִינַי
  choice: в Синайской пустыне
  rationale: Естественная русская передача сопряжённой конструкции; «пустыня» здесь обозначает малонаселённую дикую местность и не обязательно сплошные пески.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохраняет стандартную еврейскую формулу введения последующей прямой речи и её связь со следующим стихом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя, тогда как «Господь» представляет традиционную замену титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой. Причастная конструкция «говоря» намеренно сохраняет структуру исходного текста и указывает на продолжение речи в следующем стихе.
