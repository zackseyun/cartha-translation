  source_fidelity: 'В целом перечень передан полно и в исходном порядке: מִשְׁמֶרֶת обозначено как порученная ответственность, а различие между מִשְׁכָּן и אֹהֶל сохранено. Однако имя גֵּרְשׁוֹן следует передать ближе к еврейскому тексту как «Гершон», а не «Гирсон». Для בְּאֹהֶל מוֹעֵד предпочтительно сохранить прямую локативную связь «в шатре собрания»; «при шатре встречи» несколько смещает значение к месту службы и менее естественно как наименование святилища.'
