  terminology: «Скиния» и «шатёр» обоснованно оставлены разными словами для מִשְׁכָּן и אֹהֶל. «Завеса» приемлемо передаёт מָסָךְ в значении входного полотнища. Текстологических оснований для примечаний здесь нет; варианты «обязанность/поручение» и «завеса/занавес» не требуют сноски в основном переводе.
