  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: ru
  text: А на попечении сыновей Гершона в шатре собрания были скиния, шатёр, его покрытие и завеса у входа в шатёр собрания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: на попечении
  rationale: В данном контексте слово обозначает порученную левитам ответственность за перечисленные части святилища; «на попечении» естественно вводит перечень в современном русском языке.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: сыновей Гирсона
  rationale: Сохраняет родовое выражение оригинала, не заменяя его названием рода.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Предлог обозначает сферу служения; «при» по-русски естественнее, чем буквально-пространственное «в», поскольку далее перечисляются и наружные части сооружения.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшийся русский библейский термин для священного переносного жилища; он сохраняет различие со следующим אֹהֶל, «шатёр».
- source_word: וְהָאֹהֶל
  choice: шатёр
  rationale: Передаёт отдельный элемент перечня и сохраняет лексическое различие между מִשְׁכָּן и אֹהֶל.
- source_word: מִכְסֵהוּ
  choice: его покрытие
  rationale: Кратко и точно передаёт защитное покрытие шатра; местоименный суффикс сохранён.
- source_word: מָסַךְ
  choice: завеса
  rationale: В данном контексте это висящее полотнище, закрывающее вход; «завеса» является естественным и точным русским соответствием.
- source_word: פֶּתַח
  choice: у входа
  rationale: Передаёт расположение завесы у входного проёма естественной русской конструкцией.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Последовательно передаёт повторяющееся словосочетание и отражает назначение шатра как места встречи.
