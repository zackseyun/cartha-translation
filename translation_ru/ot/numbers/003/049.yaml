  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: ru
  text: И взял Моисей выкупные деньги[a] у тех, кто оказался сверх числа выкупленных левитами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деньги за выкуп». Древнееврейское выражение обозначает плату, вносимую при выкупе.'
    reason: lexical_alternative
  - marker: b
    text: То есть у тех израильских первенцев, которые остались сверх числа левитов, засчитанных вместо первенцев при выкупе.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Повествовательная форма глагола לקח имеет обычное значение «взял»; контекстуально возможно «получил», но прямое значение не требует уточнения.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: выкупные деньги
  rationale: Сочетание обозначает деньги, уплачиваемые за выкуп. Такой перевод естественен по-русски и сохраняет юридико-культовый смысл; буквальное «серебро выкупа» здесь звучало бы неестественно.
- source_word: מֵאֵת
  choice: у
  rationale: Предлог указывает на источник получения; русская конструкция «взял у» естественно передаёт этот смысл.
- source_word: הָעֹדְפִים
  choice: тех, кто оказался сверх числа
  rationale: Причастие от עודף обозначает людей, составивших численный остаток или превышение. Формулировка сохраняет сравнительный смысл и не вводит в основной текст слово «первенцы», подразумеваемое из контекста.
- source_word: עַל
  choice: сверх числа
  rationale: В данном контексте предлог выражает численное превышение относительно другой группы.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: выкупленных левитами
  rationale: Конструкция обозначает тех, кто был выкуплен посредством заместительного учёта левитов. Творительный падеж передаёт наиболее вероятное отношение, хотя краткая древнееврейская конструкция сама по себе шире.
theological_decisions:
- issue: Характер связи в выражении פְּדוּיֵי הַלְוִיִּם
  choice: выкупленных левитами
  alternative: выкупленных, соответствовавших левитам
  rationale: В ближайшем контексте левиты заменяют израильских первенцев при выкупе. Основной перевод передаёт это естественно, а примечание поясняет, что речь идёт о численном заместительном учёте, а не о личной выплате левитами.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским повествовательным строем. Формулировка стремится сохранить лаконичность древнееврейского текста, а необходимое контекстуальное пояснение вынесено в сноску.
