  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ru
  text: 'Сыновья Каафа по их родам: Амрам, Ицгар, Хеврон и Узиил.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: בְּנֵי — форма сопряжённого множественного числа от «сын». В данном перечне названы сыновья Каафа и основатели соответствующих родов. Начальный союз וּ не передан отдельно, поскольку по-русски при продолжении перечня он необязателен и утяжелил бы фразу.
- source_word: קְהָת
  choice: Каафа
  rationale: Личное имя передано в принятой русской библейской форме «Кааф» и поставлено в родительном падеже после слова «сыновья».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри племенной структуры Израиля. «По их родам» сохраняет распределительный смысл предлога לְ и естественно звучит в контексте переписи.
- source_word: עַמְרָם
  choice: Амрам
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וְיִצְהָר
  choice: Ицгар
  rationale: Личное имя передано в принятой русской библейской форме; соединительный союз выражен русской пунктуацией перечня.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Личное имя передано в принятой русской библейской форме. Контекст ясно указывает на человека, а не на одноимённый город.
- source_word: וְעֻזִּיאֵל
  choice: и Уззиил
  rationale: Личное имя передано в принятой русской библейской форме; союз וְ перед последним элементом сохранён как «и».
