  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: ru
  text: 'Вот имена сыновей Аарона: первенец Надав, Авиуд, Елеазар и Ифамар.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Сочетание союза с указательным местоимением естественно вводит перечень; «вот» передаёт дейктическую функцию без тяжеловесного начального «и».
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: имена сыновей Аарона
  rationale: Естественная русская передача еврейской сопряжённой конструкции с сохранением смысла.
- source_word: הַבְּכֹר
  choice: первенец
  rationale: Передаёт именно статус первого рождённого сына, а не только старшинство по возрасту; в соответствии с еврейским порядком слов определение поставлено перед именем Надава.
- source_word: נָדָב
  choice: Надав
  rationale: Общепринятая русская библейская форма имени, близкая к еврейскому звучанию.
- source_word: וַאֲבִיהוּא
  choice: затем Авиуд
  rationale: Имя дано в традиционной русской библейской форме; «затем» помогает ясно показать, что определение «первенец» относится только к Надаву, при этом союзная структура перечня передана естественно.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: וְאִיתָמָר
  choice: и Ифамар
  rationale: Устоявшаяся русская библейская форма имени; заключительный союз сохраняет структуру перечня.
