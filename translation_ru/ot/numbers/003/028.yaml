  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: ru
  text: Число всех лиц мужского пола от одного месяца и старше составляло восемь тысяч шестьсот; они исполняли обязанности по охране святилища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполняли возложенную на них обязанность по отношению к святыне (священным предметам)».'
    reason: Еврейское שֹׁמְרֵי מִשְׁמֶרֶת обозначает исполнение порученной обязанности, с оттенком охраны; הַקֹּדֶשׁ может пониматься как святилище, святыня или священные предметы.
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Всех лиц мужского пола … насчитывалось
  rationale: Передаёт переписную формулу естественным современным русским языком и сохраняет указание на мужской пол.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: от одного месяца и старше
  rationale: Обычная и ясная русская формулировка нижнего возрастного порога.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: восемь тысяч шестьсот
  rationale: Число передано словами в соответствии с литературным регистром текста.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: несли службу при
  rationale: Сочетание причастия и однокоренного существительного обозначает постоянное исполнение вверенной обязанности; русский оборот избегает тяжеловесного буквального повтора.
- source_word: הַקֹּדֶשׁ
  choice: святилище
  rationale: В данном культовом контексте слово обозначает священную сферу, находившуюся в ведении левитов; «святилище» естественно передаёт основное понимание.
theological_decisions:
- issue: Относится ли הַקֹּדֶשׁ к святилищу как месту или к святыне/священным предметам
  choice: святилище
  alternative: святыня или священные предметы
  rationale: Основной текст следует наиболее естественному контекстуальному пониманию, но примечание сохраняет лексическую широту еврейского выражения и не сужает его без оговорки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Переписная формула перестроена по нормам русского синтаксиса; точка с запятой ясно связывает численность группы с её служебной обязанностью.
