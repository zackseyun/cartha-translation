  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: ru
  text: У Мерари — род Махли и род Муши. Это роды Мерари.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: У Мерари
  rationale: Предлог ל в контексте перечня вводит группу потомков, относящуюся к Мерари. По-русски «у Мерари» естественно передаёт значение принадлежности в генеалогическом перечислении.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: род / роды
  rationale: В данном родословно-переписном контексте מִשְׁפָּחָה обозначает родовую группу внутри колена. «Род» точнее и естественнее, чем бытовое «семья», и не смешивает эту группу с целым коленом.
- source_word: הַמַּחְלִי
  choice: Махли
  rationale: Форма обозначает родовую группу, происходящую от Махли. В сочетании «род Махли» русский язык естественно выражает эту связь без искусственного образования этнонима.
- source_word: וּמִשְׁפַּחַת הַמּוּשִׁי
  choice: и род Муши
  rationale: Союз координирует вторую родовую группу с первой; повтор слова «род» сохраняет ясность и структуру еврейского перечня.
- source_word: אֵלֶּה הֵם
  choice: Это
  rationale: Сочетание указательного местоимения с личным местоимением служит отождествлению и подведению итога. В современном русском «Это» передаёт его естественно и без утраты смысла.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: роды Мерари
  rationale: Множественное число суммирует две только что названные родовые группы и последовательно передаёт מִשְׁפָּחָה словом «род».
