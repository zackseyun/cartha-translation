base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: ru
  text: 'Вот имена сыновей Левия: Гирсон, Кааф и Мерари.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: вот
  rationale: В формуле, вводящей перечень, сочетание прошедшей формы היה с указательным אֵלֶּה естественно передаётся по-русски словом «вот», без тяжеловесного «и были эти».
- source_word: בְנֵי לֵוִי
  choice: сыновей Левия
  rationale: Здесь названы три непосредственных сына Левия, поэтому «сыновья», а не более широкое «потомки».
- source_word: בִּשְׁמֹתָם
  choice: имена
  rationale: Буквально оборот означает «по их именам»; в современной русской формуле перечисления естественно сказать «вот имена…», сохраняя функцию исходного выражения.
- source_word: גֵּרְשׁוֹן
  choice: Гирсон
  rationale: Традиционная и узнаваемая русская библейская передача личного имени.
- source_word: קְהָת
  choice: Кааф
  rationale: Традиционная русская библейская форма имени, соответствующая принятому употреблению.
- source_word: מְרָרִי
  choice: Мерари
  rationale: Традиционная русская библейская передача личного имени.
