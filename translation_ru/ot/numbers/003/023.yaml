- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В контексте исчисления и устройства левитов слово обозначает родовые подразделения более широкой группы; «роды» точнее передаёт этот смысл, чем бытовое «семьи».
- source_word: הַגֵּרְשֻׁנִּי
  choice: гирсонитян
  rationale: Форма в единственном числе с артиклем имеет собирательное значение и обозначает потомков Гирсона; русская форма «гирсонитяне» естественно передаёт эту группу.
- source_word: אַחֲרֵי
  choice: позади
  rationale: Предлог здесь имеет пространственное, а не временное значение и указывает место относительно скинии.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: В данном контексте слово обозначает священное шатровое жилище; «скиния» — устоявшийся и понятный русский библейский термин.
- source_word: יַחֲנוּ
  choice: пусть расположатся станом
  rationale: Имперфект выражает установленный порядок расположения лагеря; эта конструкция естественно передаёт предписывающий оттенок.
- source_word: יָמָּה
  choice: с западной стороны
  rationale: Направительная форма от слова «море» является обычным древнееврейским обозначением запада; в описании расположения лагеря «с западной стороны» звучит естественно и ясно.
