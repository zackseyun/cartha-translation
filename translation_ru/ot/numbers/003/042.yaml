  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: ru
  text: И сосчитал Моисей всех первенцев среди сынов Израиля[a], как повелел ему Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля»; возможные варианты: «израильтян» или «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: сосчитал
  rationale: В контексте переписи глагол פקד означает подсчёт людей. «Сосчитал» ясно и естественно передаёт это значение в современном русском языке.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз указывает, что Моисей поступил в соответствии с данным ему повелением.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» естественно и достойно передаёт властное распоряжение; предшествование повеления действию ясно из контекста и не требует отдельной грамматической формы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֹתוֹ
  choice: ему
  rationale: Местоимение относится к Моисею как к получателю повеления.
- source_word: אֶת כָּל בְּכֹר
  choice: всех первенцев
  rationale: Передаёт совокупность всех учтённых первенцев. Слово «мужского пола» в самом стихе отсутствует и поэтому не добавлено.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохраняет родственное выражение оригинала и передаёт предлог בְּ как «среди» в контексте подсчёта.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале употреблено личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Основной текст сохраняет грамматически мужское родственное обозначение оригинала, тогда как более идиоматические варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «И» сохраняет повествовательную связь с предыдущим контекстом; порядок слов с постпозицией имени «Моисей» придаёт фразе достоинство, оставаясь понятным.
