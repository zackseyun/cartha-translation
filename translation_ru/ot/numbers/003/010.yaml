  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: ru
  text: Аарона и его сыновей назначь, и пусть они хранят своё священническое служение; а посторонний[a], который приблизится, будет предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неуполномоченный». Еврейское слово означает здесь человека, не допущенного к священническому служению, а не обязательно чужеземца по происхождению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: поставь
  rationale: Глагол פקד может означать назначение, поручение или исчисление. Здесь прямое дополнение «Аарона и его сыновей» и последующее указание хранить священническое служение требуют значения назначения на служение, а не пересчёта.
- source_word: וְשָׁמְרוּ
  choice: и пусть они хранят
  rationale: שׁמר передаёт не только исполнение, но и охрану вверенных обязанностей и установленных границ. Конструкция «пусть они хранят» естественно выражает предписание и сохраняет этот оттенок.
- source_word: כְּהֻנָּתָם
  choice: своё священническое служение
  rationale: Существительное обозначает священническое служение или должность, а не только отвлечённый статус. В современном русском «священство» может быть понято как совокупность священнослужителей, поэтому более ясна передача «священническое служение».
- source_word: הַזָּר
  choice: посторонний
  rationale: В данном контексте זָר — человек, не допущенный к священническому служению, а не обязательно иноплеменник. Слово «посторонний» сохраняет краткость и контекстуальный смысл; уточнение дано в сноске.
- source_word: הַקָּרֵב
  choice: который приблизится
  rationale: Причастие от קרב буквально обозначает приближение и здесь связано с доступом к священной сфере или служению. «Приблизится» сохраняет конкретность действия, не уточняя сверх текста его точных ритуальных границ.
- source_word: יוּמָת
  choice: будет предан смерти
  rationale: 'Хофаль глагола מות имеет каузативно-пассивное и юридически-карательное значение: речь не просто о том, что человек умрёт, а о том, что он подлежит смерти.'
theological_decisions:
- issue: Ограничение доступа к священническому служению
  choice: Текст поручает священническое служение Аарону и его сыновьям и предупреждает, что приблизившийся посторонний подлежит смерти.
  alternative: Можно понимать запрет шире — как относящийся ко всякому несвященнику, приближающемуся к святыне, однако точные ритуальные границы в этом стихе не определены.
  rationale: Перевод сохраняет исключительное поручение священнического служения и суровое последствие несанкционированного приближения, но не привносит отсутствующих в строке уточнений о конкретной зоне или действии.
translation_notes:
  register: Современный литературный русский с достоинством законодательного предписания. Инверсия «Аарона же и его сыновей поставь» сохраняет смысловое выделение объекта; выражения «пусть они хранят» и «будет предан смерти» передают соответственно предписание и юридически-пассивную форму оригинала.
