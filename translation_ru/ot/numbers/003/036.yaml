  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: ru
  text: В обязанности сыновей Мерари входили брусья скинии[a], её перекладины, столбы, основания[b], все её принадлежности и всё служение при ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доски скинии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гнёзда». Это опорные детали, в которые устанавливались столбы или брусья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: порученное попечению
  rationale: Сочетание обозначает официально вверенную обязанность и сферу ответственности. Формулировка сохраняет оба оттенка, не прибегая к тяжеловесному буквальному удвоению.
- source_word: בְּנֵי מְרָרִי
  choice: сыновей Мерари
  rationale: Передаёт явную древнееврейскую родовую формулу и естественно звучит по-русски.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: брусья скинии
  rationale: קֶרֶשׁ обозначает жёсткие конструктивные элементы скинии; «брусья» яснее передаёт их несущую функцию, чем общее «доски».
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшийся русский термин для переносного святилища; он точен в данном культовом контексте.
- source_word: בְרִיחָיו
  choice: её перекладины
  rationale: Речь идёт о горизонтальных элементах, скреплявших брусья; «перекладины» здесь точнее общего «шесты» или «засовы».
- source_word: עַמֻּדָיו
  choice: столбы
  rationale: Естественное современное обозначение вертикальных опор в описании конструкции скинии.
- source_word: אֲדָנָיו
  choice: основания
  rationale: Термин обозначает нижние опорные детали, в которые устанавливались элементы конструкции. «Основания» понятно широкому читателю; более техническое «гнёзда» отмечено в сноске.
- source_word: כָל כֵּלָיו
  choice: все её принадлежности
  rationale: כְּלִי — широкое обозначение предметов, приспособлений и оснащения. «Принадлежности» не сужает значение до сосудов или утвари.
- source_word: כֹל עֲבֹדָתוֹ
  choice: все работы, связанные с ними
  rationale: Суффикс мужского единственного числа формально допускает соотнесение со скинией или собирательным оснащением, но по смыслу фраза охватывает труд по обслуживанию перечисленных частей. Множественное «с ними» естественно связывает итоговую формулу со всем перечнем.
