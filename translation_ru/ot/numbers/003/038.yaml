  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: ru
  text: Перед скинией, с восточной стороны[a], перед шатром встречи, к восходу солнца, станом располагались Моисей, Аарон и его сыновья, исполняя обязанности по охране святилища от имени сынов Израиля. Но посторонний[b], который приблизится, должен быть предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «к востоку… с восточной стороны». В еврейском тексте два родственных обозначения восточного направления усиливают друг друга.'
    reason: lexical_alternative
  - marker: b
    text: «Посторонний» здесь — человек, не имеющий права приближаться к святилищу для служения, а не обязательно чужеземец по происхождению.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: стан разбивали
  rationale: Субстантивированное причастие описывает тех, кому было назначено располагаться здесь станом; прошедшее время естественно для повествовательного контекста.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: перед скинией
  rationale: Передаёт пространственное значение לִפְנֵי и сохраняет традиционное, понятное обозначение מִשְׁכָּן, отличая его от следующего «шатра встречи».
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: с восточной стороны ... к восходу солнца
  rationale: Сохраняет два родственных восточных ориентира и их эмфатическое сочетание, не сводя их к одному выражению.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прямой и современный эквивалент названия священного шатра; не смешивается со «скинией» в предшествующей фразе.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Моисей, Аарон и его сыновья
  rationale: Местоименный суффикс единственного числа естественнее всего относится к непосредственно названному Аарону.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: несли ответственность за святилище
  rationale: Естественно передаёт однокоренную конструкцию со значением исполнения порученной охранной и служебной обязанности.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: от имени сынов Израиля
  rationale: Передаёт представительское исполнение обязанности, относящейся к Израилю, без чрезмерно буквального и неясного оборота.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родовое обозначение народа завета, употреблённое в еврейском тексте.
- source_word: וְהַזָּר
  choice: посторонний
  rationale: В данном контексте обозначает не этнического чужеземца, а человека, не уполномоченного приближаться для священного служения.
- source_word: הַקָּרֵב
  choice: который приблизится
  rationale: Передаёт приближение к святилищу в контексте запрета доступа.
- source_word: יוּמָת
  choice: должен быть предан смерти
  rationale: Глагольная форма выражает не просто смерть, а назначенное умерщвление как наказание.
theological_decisions:
- issue: К кому относятся слова «его сыновья»
  choice: к сыновьям Аарона
  alternative: к семействам или потомкам Моисея и Аарона вместе
  rationale: Суффикс мужского рода единственного числа после имени Аарона грамматически естественно относится к Аарону; служение у святилища в контексте принадлежит Аарону и его сыновьям.
- issue: Значение זָר в законе о святилище
  choice: любой неуполномоченный посторонний по отношению к священному служению
  alternative: этнический чужеземец
  rationale: Ближайший контекст говорит о распределении обязанностей и доступе к святилищу, поэтому различие здесь служебно-культовое, а не этническое.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Скиния» сохранена как широко узнаваемый термин, тогда как אֹהֶל מוֹעֵד передано буквально как «шатёр встречи». Синтаксис разделён на два предложения ради ясности; повтор восточной ориентации сохранён.
