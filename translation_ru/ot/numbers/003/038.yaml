  to: Перед скинией, с восточной стороны[a], перед шатром встречи, к восходу солнца, станом располагались Моисей, Аарон и его сыновья, исполняя обязанности по охране святилища от имени сынов Израиля. Но посторонний[b], который приблизится, должен быть предан смерти.
