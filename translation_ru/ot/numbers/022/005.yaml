source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: ru
  text: 'И послал он вестников к Валааму, сыну Веора, в Пефор, который находится у Реки[a], в земле сынов его народа[b], чтобы позвать его, со словами: «Вот, народ вышел из Египта; вот, он покрыл лицо земли[c] и расположился напротив меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, вероятно, у Евфрата; в еврейском тексте сказано просто «у Реки».
    reason: cross_reference
  - marker: b
    text: 'Или: «в земле его народа». Еврейское выражение «земля сынов его народа» необычно, а к кому относится слово «его», не вполне ясно.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «покрыл глаз земли» — образное выражение, обозначающее видимую поверхность земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал он
  rationale: Повествовательная форма продолжает последовательность событий; простой союз «и» естественно сохраняет связь с предшествующим контекстом.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В дипломатическом контексте речь идёт о людях-посланцах, а не об ангелах.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Валааму, сыну Веора
  rationale: Использованы устойчивые русские формы библейских имён.
- source_word: פְּתוֹרָה
  choice: в Пефор
  rationale: Направительный суффикс указывает на движение к месту; русский предлог «в» естественно передаёт это значение.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: который находится у Реки
  rationale: Сохранено буквальное «Река» без внесения вероятного отождествления с Евфратом в основной текст.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: в земле сынов его народа
  rationale: Формулировка сохраняет необычное строение и неоднозначность еврейского текста, не подменяя их истолкованием.
- source_word: לִקְרֹא לוֹ
  choice: чтобы позвать его
  rationale: Инфинитив выражает цель; «позвать» не придаёт фразе более властного оттенка, свойственного слову «призвать».
- source_word: לֵאמֹר
  choice: Он велел сказать
  rationale: Еврейская формула вводит передаваемую через посланцев речь; русская конструкция ясно и естественно обозначает это поручение.
- source_word: הִנֵּה
  choice: вот
  rationale: Повтор частицы сохранён для передачи настойчивого привлечения внимания.
- source_word: עַם
  choice: народ
  rationale: Прямой и контекстуально подходящий эквивалент для большой этнической общности.
- source_word: יָצָא מִמִּצְרַיִם
  choice: вышел из Египта
  rationale: Совершенный вид естественно передаёт завершившееся событие с актуальными последствиями.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: покрыл лицо земли
  rationale: Сохранён образ поверхности земли, но избегнута непонятная для современного читателя буквальная калька «глаз земли».
- source_word: יֹשֵׁב מִמֻּלִי
  choice: расположился напротив меня
  rationale: Причастие описывает нынешнее пребывание народа; «расположился» естественно в контексте стоянки многочисленного народа, а «напротив меня» сохраняет пространственную неопределённость выражения.
