base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: ru
  text: Ослица увидела меня и трижды свернула в сторону передо мной. Если бы она не свернула от меня[a], то я уже убил бы тебя, а её оставил бы в живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «может быть, она уклонилась от меня». Явного отрицания в этой фразе нет; по контексту её обычно понимают как нереальное условие: «если бы она не свернула от меня», что согласуется со следующим утверждением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: увидела меня
  rationale: Глагол ראה в данном контексте обозначает обычное зрительное восприятие; это наиболее прямой и естественный русский эквивалент.
- source_word: הָאָתוֹן
  choice: ослица
  rationale: Существительное אָתוֹן обозначает самку осла; русское «ослица» естественно и точно передаёт род.
- source_word: וַתֵּט לְפָנַי
  choice: сворачивала с пути передо мной
  rationale: נטה здесь означает отклонение от направления движения. Добавление «с пути» естественно выражает действие по-русски, а «передо мной» сохраняет пространственное значение לְפָנַי.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: трижды
  rationale: Идиома обозначает три повторившихся случая; «трижды» ясно и литературно передаёт её смысл.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Если бы она не сворачивала от меня
  rationale: 'Хотя אוּלַי обычно значит «может быть», логика повествования требует контрфактического условия: уклонение ослицы предотвратило смерть Валаама. Неявное отрицание отмечено сноской.'
- source_word: כִּי עַתָּה גַּם אֹתְכָה הָרַגְתִּי
  choice: то к этому времени я уже убил бы тебя
  rationale: Перфект в результате нереального условия передан русским сослагательным наклонением; «к этому времени уже» выражает временную и усилительную функцию כִּי עַתָּה.
- source_word: וְאוֹתָהּ הֶחֱיֵיתִי
  choice: а её оставил бы в живых
  rationale: Порода Hiphil глагола חיה означает сохранить или оставить в живых. Противительный союз «а» естественно подчёркивает контраст между судьбой Валаама и ослицы.
theological_decisions:
- issue: Контрфактическая фраза при отсутствии явного отрицания после אוּלַי в масоретском тексте
  choice: «Если бы она не сворачивала от меня»
  alternative: «Может быть, она сворачивала от меня»
  rationale: 'Контекст требует нереального условия с отрицанием: именно уклонение ослицы спасло Валаама. Буквальное чтение без отрицания противоречило бы следующей фразе. Перевод передаёт контекстуальный смысл, а текстовая особенность открыто указана в сноске.'
translation_notes:
  register: Современный литературный русский язык, ясный для широкого круга читателей. Сохранены прямота речи ангела, пространственные образы и контрфактическое напряжение; сложность еврейской конструкции вынесена в сноску.
