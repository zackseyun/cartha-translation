base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: ru
  text: Но гнев Бога разгорелся из-за того, что он шёл, и ангел Яхве встал на дороге как его противник[a]. Валаам ехал на своей ослице[b], и с ним были двое его слуг[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שָׂטָן (сатан) здесь означает «противник» или «тот, кто противится», а не обязательно имя собственное Сатана.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово прямо указывает, что это была ослица, то есть самка осла.
    reason: lexical_clarification
  - marker: c
    text: 'Или: «двое его молодых людей»; еврейское נַעַר может обозначать молодого человека, слугу или сопровождающего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: гнев Бога разгорелся
  rationale: Сохраняет образ древнееврейской идиомы о «разгорающемся» гневе и при этом естественно звучит по-русски.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: из-за того, что он шёл
  rationale: Передаёт причинное значение כִּי и длительный характер причастия הוֹלֵךְ, не устраняя повествовательное напряжение между Божьим позволением и последующим гневом.
- source_word: וַיִּתְיַצֵּב
  choice: встал
  rationale: В контексте означает намеренно занять позицию; простое русское «встал» естественно передаёт действие, а противительный замысел выражен следующей фразой.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: «Ангел» соответствует небесному посланнику в данном повествовании, а личное имя יהוה передано как «Яхве».
- source_word: בַּדֶּרֶךְ
  choice: на дороге
  rationale: Конкретно обозначает место, где ангел занял позицию на пути Валаама.
- source_word: לְשָׂטָן לוֹ
  choice: как его противник
  rationale: Сохраняет именную форму שָׂטָן и её обычное здесь значение «противник», не превращая слово в имя собственное.
- source_word: וְהוּא רֹכֵב
  choice: Валаам ехал
  rationale: Имя повторено вместо местоимения для ясности современного русского повествования; причастная конструкция передана как фоновое продолжающееся действие.
- source_word: אֲתֹנוֹ
  choice: на своей ослице
  rationale: Еврейское слово прямо обозначает ослицу; по-русски это точно и естественно.
- source_word: שְׁנֵי נְעָרָיו
  choice: двое его слуг
  rationale: נַעַר может означать молодого человека, слугу или сопровождающего; притяжательная форма и дорожный контекст поддерживают значение «слуги», тогда как более буквальная альтернатива отмечена в сноске.
- source_word: עִמּוֹ
  choice: с ним были
  rationale: Добавление связки необходимо для естественного и полного русского предложения.
theological_decisions:
- issue: Значение שָׂטָן в данном контексте
  choice: нарицательное существительное «противник»
  alternative: имя или титул «Сатана»
  rationale: Слово описывает роль ангела Яхве, выступившего против Валаама. Синтаксис и контекст не требуют видеть здесь имя собственное.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача «Яхве» сохраняет в тексте личное заветное имя, представленное тетраграмматоном.
- issue: Причина Божьего гнева в כִּי הוֹלֵךְ הוּא
  choice: «из-за того, что он шёл» без поясняющего дополнения
  alternative: «из-за того, как/с каким намерением он шёл»
  rationale: Исходный текст прямо связывает гнев с тем, что Валаам шёл, но не поясняет здесь мотив или конкретное условие; перевод сохраняет эту напряжённость и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; необычная причинная связь в первой части намеренно не сглажена. Все сноски привязаны к соответствующим словам основного текста.
