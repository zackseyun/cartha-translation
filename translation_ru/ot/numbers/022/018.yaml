  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: ru
  text: 'Валаам ответил слугам Валака: «Даже если Валак даст мне свой дом, полный серебра и золота, я не смогу преступить слова Яхве, моего Бога, ни в малом, ни в великом».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перейти за пределы уст Яхве, моего Бога»; древнееврейская идиома означает выйти за пределы сказанного им или нарушить его слово.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Валаам ответил
  rationale: Обычная древнееврейская формула ответа; в современном русском «ответил» естественно передаёт оба глагола без тяжеловесного «ответил и сказал».
- source_word: עַבְדֵי בָלָק
  choice: слугам Валака
  rationale: «Слуги» достаточно широко обозначает посланников или придворных Валака и не усиливает значение до «рабов».
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Даже если Валак отдаст мне
  rationale: Условие имеет риторически-уступительный смысл; «даже если» естественно выражает невозможность изменить решение независимо от предложенной награды.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: свой дом, полный серебра и золота
  rationale: Сохраняется образ дома, наполненного огромным богатством; местоимение «свой» ясно соотносит дом с Валаком.
- source_word: לֹא אוּכַל
  choice: я не смогу
  rationale: Глагол יכל выражает неспособность, а не только нежелание; будущее время согласуется с гипотетическим условием.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה אֱלֹהָי
  choice: преступить слово Яхве, моего Бога
  rationale: Буквально «перейти через уста» — идиома нарушения сказанного или повеленного. «Преступить слово» сохраняет образ перехода установленной границы и понятно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: сделать что-либо малое или великое
  rationale: Сохраняется меризм «малое или великое», означающий любое действие без исключения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это различие.
- issue: Характер заявления Валаама
  choice: «не смогу преступить слово» — заявленная неспособность выйти за пределы сказанного Богом
  alternative: «не стану нарушать повеление» — волевой отказ
  rationale: Форма יכל прямо говорит о способности или возможности. Перевод не сводит высказывание к одному лишь добровольному отказу.
- issue: Значение идиомы «перейти уста Яхве»
  choice: преступить слово Яхве
  alternative: нарушить повеление Яхве
  rationale: «Слово» не сужает речь Бога исключительно до формального приказа, а «преступить» передаёт идею выхода за установленный предел.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прямой и доступный; древнееврейская идиома передана понятно, а её буквальный образ сохранён в сноске.
