base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: ru
  text: 'И сказал Валаам Богу: «Валак, сын Циппора, царь Моава, послал ко мне[a]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «послал ко мне». По контексту возможно: «послал ко мне посланников»; также: «послал за мной».'
    reason: Сохраняет отсутствие названного дополнения в еврейском тексте и отмечает контекстуально возможные способы понимания.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с имперфектом продвигает повествование; традиционная и естественная для русского библейского повествования связь — «И сказал».
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: אֶל הָאֱלֹהִים
  choice: Богу
  rationale: Артикль и ближайший контекст указывают на Бога, явившегося Валааму в предыдущем стихе; русская форма «Богу» естественно передаёт адресата.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Валак, сын Циппора
  rationale: Еврейская конструкция принадлежности естественно передаётся приложением; использованы устоявшиеся русские формы имён.
- source_word: מֶלֶךְ מוֹאָב
  choice: царь Моава
  rationale: Конструктивная цепь обозначает титул Валака; «царь Моава» — естественная и точная русская формулировка.
- source_word: שָׁלַח אֵלַי
  choice: прислал ко мне людей
  rationale: 'Глагол «послал» употреблён без выраженного дополнения, которое восстанавливается из контекста: Валак отправил к Валааму посланников. Добавление «людей» делает русскую фразу завершённой, а сноска сохраняет буквальную форму и её неоднозначность.'
theological_decisions:
- issue: Кого обозначает הָאֱלֹהִים
  choice: единого Бога, к Которому обращается Валаам
  alternative: божество или боги в общем смысле
  rationale: Непосредственный контекст описывает ответ Валаама Богу, пришедшему к нему в предыдущем стихе; перевод «Богу» передаёт это контекстуальное отождествление без дополнительных доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным строем. Начальное «И сказал» сохраняет еврейскую последовательность рассказа; двоеточие отражает продолжение речи в следующем стихе.
