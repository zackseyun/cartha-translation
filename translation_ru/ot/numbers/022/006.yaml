source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: ru
  text: 'Итак, приди же, прошу, и прокляни для меня этот народ, потому что он сильнее меня. Может быть, я смогу поразить его и изгнать из земли, ведь я знаю: кого ты благословишь, тот благословлён, а кого проклянёшь, тот проклят.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт связный переход к настоятельной просьбе; отдельное «теперь» по-русски здесь избыточно.
- source_word: לְכָה נָּא
  choice: приди же, прошу
  rationale: Сохраняет повелительное значение, частицу настойчивости и вежливую просьбу.
- source_word: אָרָה לִּי
  choice: прокляни для меня
  rationale: «Прокляни» прямо передаёт призыв навлечь проклятие, а «для меня» сохраняет личную заинтересованность Валака, выраженную לִּי.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет единственное число собирательного существительного и естественно звучит по-русски.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: потому что он сильнее меня
  rationale: Передаёт сравнительную военную силу без добавочного толкования; местоимение единственного числа согласовано с «народ».
- source_word: אוּלַי אוּכַל
  choice: Может быть, тогда я смогу
  rationale: Сохраняет неуверенность и способность; «тогда» естественно выражает подразумеваемую связь с ожидаемым проклятием.
- source_word: נַכֶּה בּוֹ
  choice: поразить его
  rationale: Сохраняет буквальное значение נכה и грамматическое обращение с народом как с единым целым, не сужая смысл до окончательной победы.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: и изгнать из этой земли
  rationale: «Изгнать» точно передаёт גרש; «эта земля» в контексте означает территорию Валака, хотя указательное местоимение в еврейском не выражено явно.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: кого ты благословишь, тот благословлён
  rationale: Сохраняет обобщённую относительную конструкцию, параллелизм и результативно-пассивный смысл причастия.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: а кого проклянёшь, тот проклят
  rationale: Сохраняет строгий параллелизм с благословением и пассивно-результативный смысл יוּאָר.
theological_decisions:
- issue: Действенность благословения и проклятия Валаама
  choice: Слова Валака переданы как его уверенное утверждение без редакционного подтверждения или опровержения.
  alternative: Пояснить, что это лишь вера Валака в магическую силу Валаама.
  rationale: Стих сообщает речь Валака; перевод не должен ни утверждать его представление как богословский факт, ни заранее обесценивать его.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены собирательное единственное число «народ — он — его» и риторический параллелизм заключительных слов.
