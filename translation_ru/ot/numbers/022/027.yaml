  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: ru
  text: Когда ослица увидела ангела Яхве[a], она легла под Валаамом. Тогда Валаам разгневался и ударил ослицу посохом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланника Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: ослица
  rationale: Существительное אָתוֹן обозначает самку осла; русское «ослица» точно передаёт значение и естественно звучит в повествовании.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может означать «посланник» или «ангел»; в данном контексте речь явно идёт о сверхъестественном посланнике, поэтому выбрано «ангел».
- source_word: וַתִּרְבַּץ
  choice: она легла
  rationale: Глагол רבץ означает «лечь, улечься, припасть к земле»; «легла» точно и без лишнего истолкования передаёт действие животного.
- source_word: תַּחַת בִּלְעָם
  choice: под Валаамом
  rationale: תַּחַת буквально означает «под»; Валаам сидел верхом, поэтому ослица легла под ним.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Валаам разгневался
  rationale: Буквально идиома говорит, что гнев Валаама «разгорелся»; «разгневался» естественно передаёт её смысл в современном литературном русском языке.
- source_word: וַיַּךְ
  choice: ударил
  rationale: נכה здесь обозначает нанесение удара; форма повествования указывает на одно действие, поэтому выбрано нейтральное и точное «ударил».
- source_word: בַּמַּקֵּל
  choice: посохом
  rationale: מַקֵּל означает палку или посох; в сцене путешествия «посох» уместен и естественен. Принадлежность предмета Валааму понятна из контекста и не добавляется явно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон יהוה. Передача «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Значение מַלְאָךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Слово допускает оба значения, однако повествовательный контекст изображает сверхъестественное существо. Возможная более общая передача сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Синтаксис следует последовательности еврейского текста, но избегает неестественной буквальности.
