  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: ru
  text: 'Тогда вельможи Моава встали, пришли к Валаку и сказали: «Валаам отказался идти с нами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: моавские князья
  rationale: שָׂרִים обозначает высокопоставленных представителей правителя; «князья» естественно передаёт их статус в данном древнем контексте.
- source_word: וַיָּקֻמוּ
  choice: встали
  rationale: Сохранено прямое значение глагола קום, обозначающего начало действия и отправление.
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: вернулись к Валаку
  rationale: Буквально «пришли к Валаку»; по контексту это возвращение посланников, поэтому «вернулись» ясно и естественно выражает подразумеваемое направление.
- source_word: מֵאֵן
  choice: отказался
  rationale: Точно передаёт решительный отказ Валаама.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: идти с нами
  rationale: Естественная русская передача инфинитивной конструкции со значением сопровождающего движения.
