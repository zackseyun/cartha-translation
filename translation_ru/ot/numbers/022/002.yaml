  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: ru
  text: И увидел Валак, сын Циппора, всё, что Израиль сделал амореям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «аморею»; в еврейском тексте этноним стоит в единственном числе и имеет собирательное значение, то есть речь идёт об амореях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: И увидел
  rationale: Форма с повествовательным וַ продолжает рассказ; «и увидел» прямо передаёт как связку, так и значение глагола ראה, не добавляя отдельного временного указания вроде «тогда».
- source_word: בָּלָק
  choice: Валак
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בֶּן צִפּוֹר
  choice: сын Циппора
  rationale: Конструкция сопряжённого состояния обозначает происхождение. Имя צִפּוֹר передано транслитерацией «Циппор», без превращения имени в притяжательное прилагательное.
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Естественная русская конструкция, передающая полноту прямого дополнения.
- source_word: עָשָׂה
  choice: сделал
  rationale: Совершенный вид естественно обозначает уже совершённые Израилем действия; отдельная форма предпрошедшего времени в русском языке не требуется.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма названия народа.
- source_word: לָאֱמֹרִי
  choice: амореям
  rationale: Предлог ל при עשה передаёт того, кому было нечто сделано; дательный падеж сохраняет широкое значение отношения, не усиливая его до более толковательного «против». Единственное число этнонима в еврейском употреблено собирательно, поэтому по-русски естественно множественное число.
