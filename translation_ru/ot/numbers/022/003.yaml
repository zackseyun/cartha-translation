  source_fidelity: 'Первая часть передана верно: וַיָּגָר מְאֹד означает, что Моав сильно испугался, а כִּי רַב הוּא — что народ был многочислен. Во второй части וַיָּקָץ не требует одновременного утверждения двух отдельных эмоций («ужас и отвращение»); глагол охватывает тревожное, тягостное смятение и может иметь оттенок отвращения. «Пришёл в смятение из-за» естественно передаёт эту широту без искусственной конкретизации.'
  naturalness: '«Испытывал ужас и отвращение перед сынами Израиля» не вполне естественно по-русски: «перед» сочетается с ужасом, но отвращение обычно испытывают «к» кому-либо. Кроме того, сочетание двух существительных чрезмерно расчленяет значение одного еврейского глагола. Предлагаемый вариант современен, литературен и сохраняет повтор «Моав».'
  terminology: «Моав» и «сыны Израиля» переданы корректно. «Сыны Израиля» сохраняет формальную прозрачность בְּנֵי יִשְׂרָאֵל; в примечании допустимо указать «израильтяне» как более свободный вариант.
