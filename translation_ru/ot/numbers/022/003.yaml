  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: ru
  text: И Моав сильно испугался этого народа, потому что он был многочислен; и Моав пришёл в смятение из-за сынов Израиля[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать тягостное смятение, тревогу, отвращение или болезненный ужас; здесь контекст связывает эту реакцию со страхом перед многочисленным Израилем.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Израиля»; возможно также: «израильтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: очень испугался
  rationale: Глагол גור в данном контексте выражает сильный страх; наречие מְאֹד передано словом «очень».
- source_word: מִפְּנֵי
  choice: перед / из-за
  rationale: Оборот буквально связан с нахождением «перед лицом» кого-либо, но по контексту обозначает причину страха; в первой части естественно передано конструкцией «испугался этого народа», а во второй — «перед».
- source_word: הָעָם
  choice: этого народа
  rationale: Собирательное существительное обозначает народ Израиля; указательное «этого» естественно связывает стих с предшествующим повествованием, не меняя референта.
- source_word: כִּי רַב הוּא
  choice: потому что тот был многочислен
  rationale: Сохранено грамматическое единственное число, согласованное с русским словом «народ»; רַב по контексту указывает на многочисленность.
- source_word: וַיָּקָץ
  choice: испытывал ужас и отвращение
  rationale: קוץ допускает оттенки отвращения, тягостного смятения и болезненного ужаса. Сочетание двух существительных сохраняет эмоциональную напряжённость и лексическую неоднозначность.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Формально передаёт мужское множественное сочетание בְּנֵי יִשְׂרָאֵל и сохраняет библейское родовое обозначение.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская форма имени; здесь она метонимически обозначает народ или жителей Моава.
theological_decisions:
- issue: Характер реакции Моава, выраженной глаголом קוץ
  choice: испытывал ужас и отвращение
  alternative: пришёл в ужас / почувствовал отвращение
  rationale: Контекст подчёркивает страх перед многочисленным Израилем, однако значение глагола включает также отвращение и тягостное неприятие; перевод не сводит его лишь к одной эмоции.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной библейской выразительностью. Повтор имени «Моав» сохранён по еврейскому тексту; местоимение «тот» устраняет тяжеловесное повторение слова «народ».
