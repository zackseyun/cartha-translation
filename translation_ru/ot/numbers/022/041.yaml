base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: ru
  text: Наутро Валак взял Валаама и поднял его на Бамот-Баал[a]. Оттуда открывался вид на край народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на высоты Баала», если это выражение понимать как описание места, а не как название Бамот-Баал.'
    reason: lexical_alternative
  - marker: b
    text: То есть оттуда была видна лишь крайняя часть Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Наутро
  rationale: Естественно передаёт переход к следующему утру в повествовании, не перегружая русский текст буквальной формулой «и было утром».
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение לקח; по контексту Валак берёт Валаама с собой.
- source_word: וַיַּעֲלֵהוּ
  choice: поднялся с ним
  rationale: Передаёт восхождение и участие Валаама. Русская формулировка звучит естественнее буквального «поднял его» и не подразумевает, будто Валак нёс его.
- source_word: בָּמוֹת בָּעַל
  choice: Бамот-Баал
  rationale: В данном контексте сочетание выступает как географическое название; транслитерация сохраняет это понимание, а сноска отмечает возможное описательное прочтение.
- source_word: וַיַּרְא
  choice: он увидел
  rationale: Прямое значение ראה. Местоимение сохраняет неявно выраженный в еврейском тексте субъект и возможную соотнесённость как с Валаком, так и, по контексту, с Валаамом.
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Точно и естественно обозначает точку обзора.
- source_word: קְצֵה הָעָם
  choice: край народа
  rationale: Близко передаёт קצה и не добавляет отсутствующее в оригинале слово «стан»; речь идёт о крайней, видимой части народа.
theological_decisions:
- issue: Кто является субъектом וַיַּרְא («увидел»)?
  choice: Сохранить местоимение «он» без уточнения имени
  alternative: «Валаам увидел» или «Валак увидел»
  rationale: Еврейский глагол не называет субъект явно. Ближайшая грамматическая последовательность может указывать на Валака, тогда как цель путешествия и дальнейший контекст позволяют соотнести взгляд с Валаамом. Уточнение имени преждевременно устранило бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Имена переданы в привычной русской библейской форме «Валак», «Валаам», а топоним — близкой к еврейскому звучанию формой «Бамот-Баал». Синтаксис сохраняет смысловую неоднозначность субъекта глагола «увидел».
