  source_fidelity: 'Форма «поднялся с ним» меняет каузативное וַיַּעֲלֵהוּ («поднял/повёл его наверх»): в ней Валак сам поднимается вместе с Валаамом, а не приводит Валаама наверх. Неявный субъект וַיַּרְא в русском варианте с «он» после имени Валака практически неизбежно читается как Валак, хотя еврейская форма не называет субъекта, а контекст обычно связывает видение с Валаамом. Безличная конструкция позволяет не навязывать решение спорной референции.'
