  terminology: Привычные русские библейские формы «Валак» и «Валаам» сохранены. «Бамот-Баал» допустимо передаёт топоним; сноска корректно отмечает описательное прочтение «высоты Баала». «Край народа» близко к קְצֵה הָעָם и не подменяет «народ» словом «стан».
