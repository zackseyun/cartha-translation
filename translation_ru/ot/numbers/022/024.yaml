  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: ru
  text: 'Тогда ангел[a] Яхве встал на узкой тропе между виноградниками: ограда была и с одной стороны, и с другой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве». Еврейское слово может означать как «вестник», так и «ангел», но здесь контекст указывает на сверхъестественное существо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Тогда ... встал
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность событий, а «встал» сохраняет основное значение עמד.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; в данном повествовательном контексте речь идёт о сверхъестественном существе. Имя יהוה передано как «Яхве».
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: на узкой тропе между виноградниками
  rationale: מִשְׁעוֹל обозначает узкую тропу или проход; стены по обеим сторонам указывают, что тропа проходит между виноградниками.
- source_word: גָּדֵר מִזֶּה וְגָדֵר מִזֶּה
  choice: ограда была и с одной стороны, и с другой
  rationale: גָּדֵר — ограда, стена или забор; материал в еврейском тексте не указан. Повтор конструкции מִזֶּה передаёт наличие ограды по обе стороны.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Значение מַלְאָךְ
  choice: ангел
  alternative: вестник
  rationale: Хотя слово допускает оба значения, сверхъестественный характер действующего лица ясно следует из ближайшего контекста; лексическая возможность «вестник» сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль с умеренно формальным, библейски достойным звучанием. «Ограда» сохраняет неопределённость גָּדֵר и не добавляет отсутствующее в оригинале указание на камень.
