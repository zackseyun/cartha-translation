  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: ru
  text: Затем ангел Яхве прошёл дальше[a] и встал в узком месте, где нельзя было свернуть ни направо, ни налево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжил идти» или «пошёл дальше»; еврейское выражение передаёт продолжение движения вперёд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: прошёл дальше
  rationale: Сочетание יסף с инфинитивом выражает продолжение действия; в данном повествовании ангел продвигается дальше и занимает новое место. Этот перевод естественно передаёт и продолжение, и движение вперёд.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел», но в этом сверхъестественном эпизоде уместно «ангел»; личное имя יהוה передано как «Яхве».
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Глагол עמד здесь означает, что ангел остановился и занял определённое место; «встал» кратко и точно передаёт повествовательное действие.
- source_word: בְּמָקוֹם צָר
  choice: в тесном месте
  rationale: Прилагательное צַר обозначает узкое, стеснённое пространство. «Тесное место» естественно по-русски и подчёркивает отсутствие пространства для объезда.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: где нельзя было уклониться
  rationale: Буквально говорится, что там не было пути свернуть. Русская безличная конструкция ясно передаёт невозможность отклониться в сторону, не создавая впечатления, будто дороги вообще не существовало.
- source_word: יָמִין וּשְׂמֹאול
  choice: ни вправо, ни влево
  rationale: Парная отрицательная конструкция естественно выражает невозможность движения в любом из двух боковых направлений.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет различие между этим именем и титулом «Господь».
translation_notes:
  register: Современный литературный русский язык; повествование изложено ясно и сдержанно. Конструкция «ни вправо, ни влево» сохраняет ритм и пространственный образ оригинала.
