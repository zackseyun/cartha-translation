  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: ru
  text: 'Тогда Бог пришёл к Валааму и спросил: «Кто эти люди с тобой?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא в повествовательной последовательности означает движение к Валааму; «пришёл» естественно передаёт его без лишнего уточнения.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число сказуемого и контекст указывают на Бога как на личного деятеля.
- source_word: אֶל בִּלְעָם
  choice: к Валааму
  rationale: Предлог אֶל выражает направленность, а имя передано в принятой русской библейской форме.
- source_word: וַיֹּאמֶר
  choice: спросил
  rationale: Буквально «сказал», но перед прямым вопросом русское «спросил» точнее и естественнее передаёт речевое действие.
- source_word: מִי הָאֲנָשִׁים הָאֵלֶּה
  choice: Кто эти люди
  rationale: מִי требует установления личности, указательное הָאֵלֶּה относится к присутствующим людям; «люди» в современном русском естественно обозначает мужчин-посланников без потери смысла.
- source_word: עִמָּךְ
  choice: у тебя
  rationale: В вопросе о находящихся при Валааме людях русское «у тебя» идиоматично передаёт сопровождение или пребывание вместе с ним.
- source_word: וַ
  choice: Тогда
  rationale: Начальный повествовательный союз продвигает последовательность событий; «тогда» естественно выражает эту функцию.
theological_decisions:
- issue: Референт אֱלֹהִים в повествовании о Валааме
  choice: Бог
  alternative: божество
  rationale: Хотя слово может иметь иные значения, здесь единственное число глагола и повествовательный контекст указывают на Бога, обращающегося к Валааму; перевод не добавляет уточнений о способе явления.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная фраза. Сохранена простота исходного вопроса, без пояснения того, почему Бог его задаёт.
