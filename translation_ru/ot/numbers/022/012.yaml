base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: ru
  text: 'И сказал Бог Валааму: «Не ходи с ними и не проклинай народ, потому что он благословен».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным waw продолжает последовательность событий; традиционная и естественная русская повествовательная формула.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте это прямое обозначение Бога, обращающегося к Валааму.
- source_word: לֹא תֵלֵךְ עִמָּהֶם
  choice: Не ходи с ними
  rationale: Сочетание לֹא с имперфектом в прямой речи выражает запрет. Русский отрицательный императив ясно и естественно передаёт его силу.
- source_word: לֹא תָאֹר
  choice: не проклинай
  rationale: Глагол אָרַר означает «проклинать»; форма здесь также имеет запретительное значение.
- source_word: אֶת הָעָם
  choice: этот народ
  rationale: הָעָם обозначает уже известный из контекста народ Израиля; русское «этот народ» естественно указывает на конкретный народ, о котором шла речь.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета.
- source_word: בָרוּךְ הוּא
  choice: он благословен
  rationale: Мужской род и единственное число согласуются с собирательным существительным «народ», поэтому русский язык позволяет точно и естественно сохранить грамматику еврейского текста.
theological_decisions:
- issue: Число и референт в словах בָרוּךְ הוּא
  choice: «он благословен» — речь о народе Израиля как едином целом
  alternative: «они благословенны» — множественное число по смыслу
  rationale: В еврейском тексте употреблены формы мужского рода единственного числа, согласованные с собирательным הָעָם. Русское «народ… он благословен» сохраняет эту особенность без неестественности и не превращает референт в отдельного человека.
translation_notes:
  register: 'Современный литературный русский язык с ясной, сдержанной библейской интонацией. Повтор двух запретов сохранён, но они соединены союзом «и» для естественности русской прямой речи. Сноска об единственном числе не требуется: в русском «народ» также имеет мужской род и единственное число, поэтому форма «он благословен» одновременно точна и понятна.'
