base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: ru
  text: Вот народ, вышедший из Египта, покрыл лицо земли[a]. Теперь приди, прокляни его для меня. Может быть, я смогу сразиться с ним и изгнать его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «око земли» — еврейское выражение, означающее видимую поверхность земли, её лицо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-восклицательную силу частицы и естественно привлекает внимание в современном русском языке.
- source_word: הָעָם
  choice: народ
  rationale: Сохраняет коллективное единственное число еврейского текста и обозначает Израиль как единую общность.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: вышедший из Египта
  rationale: Причастный оборот естественно передаёт определительное причастие и указывает на исход как отличительный признак народа.
- source_word: וַיְכַס
  choice: покрыл
  rationale: Согласовано с коллективным существительным «народ» в единственном числе и описывает возникшее вследствие прихода народа положение.
- source_word: עֵין הָאָרֶץ
  choice: лицо земли
  rationale: Передаёт смысл видимой поверхности земли и сохраняет образность исходной идиомы, не воспроизводя буквально неясное для русского читателя «око земли».
- source_word: עַתָּה
  choice: Теперь
  rationale: Обозначает срочный переход от описания положения к просьбе.
- source_word: לְכָה
  choice: приди
  rationale: Естественно передаёт побудительную формулу и призыв к действию.
- source_word: קָבָה
  choice: прокляни
  rationale: Прямо передаёт значение произнесения проклятия без смягчения.
- source_word: לִּי
  choice: ради меня
  rationale: 'Передаёт дательный заинтересованного лица: Валак просит совершить действие в его пользу; формулировка естественнее буквального «для меня».'
- source_word: אֹתוֹ
  choice: его
  rationale: Сохраняет грамматическое единственное число и соотносится с русским коллективным существительным «народ».
- source_word: אוּלַי אוּכַל
  choice: Может быть, я смогу
  rationale: Сохраняет выраженную в исходном тексте неуверенность и надежду на возможность действия.
- source_word: לְהִלָּחֶם בּוֹ
  choice: сразиться с ним
  rationale: Передаёт вступление в борьбу против народа; местоимение согласовано с коллективным «народ».
- source_word: וְגֵרַשְׁתִּיו
  choice: и изгнать его
  rationale: Передаёт намерение вытеснить народ; синтаксически зависит от «смогу» и сохраняет единого коллективного референта.
