  text: וַ/יָּבֹ֖אוּ אֶל בִּלְעָ֑ם וַ/יֹּ֣אמְרוּ ל֗/וֹ כֹּ֤ה אָמַר֙ בָּלָ֣ק בֶּן צִפּ֔וֹר אַל נָ֥א תִמָּנַ֖ע מֵ/הֲלֹ֥ךְ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: ru
  text: 'Они пришли к Валааму и сказали ему: «Так говорит Валак, сын Циппора: прошу, не отказывайся прийти ко мне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Они пришли
  rationale: Форма от בוא обозначает приход или прибытие; в данном повествовательном контексте естественно передаётся как «пришли».
- source_word: אֶל־בִּלְעָם
  choice: к Валааму
  rationale: Предлог אֶל выражает направленность к лицу; имя передано в принятой русской библейской форме.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: и сказали ему
  rationale: Сохраняет обычную формулу введения прямой речи и косвенное дополнение לוֹ.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Стандартная посланническая формула; настоящее время естественно передаёт слова отправителя как действующее послание.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: Валак, сын Циппора
  rationale: Сохраняется конструкция родства; имена переданы в традиционной русской библейской форме.
- source_word: אַל־נָא
  choice: прошу, не
  rationale: אַל выражает запрещение, а נָא придаёт просьбе настойчиво-вежливый оттенок; «прошу, не» естественно сохраняет оба компонента.
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: не отказывайся прийти
  rationale: מנע с מִן и инфинитивом означает удерживаться, уклоняться или отказываться от действия. В контексте приглашения русское «не отказывайся прийти» точно и естественно передаёт смысл.
- source_word: אֵלָי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица указывает направление к говорящему.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным оттенком. Посланническая формула сохранена как «Так говорит». Буквальное значение הלך «идти» контекстуально передано русским «прийти», поскольку движение направлено к говорящему; отдельная сноска не требуется, так как это нормальная смена дейктической перспективы в русском.
