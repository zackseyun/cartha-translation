  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: ru
  text: Увидев ангела Яхве[a], ослица прижалась к стене и прижала ногу Валаама к стене, и Валаам снова ударил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестника Яхве».'
    reason: Лексема מַלְאָךְ может обозначать как вестника вообще, так и ангела; контекст указывает на сверхъестественное существо.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: ослица
  rationale: Еврейское אָתוֹן обозначает самку осла; русское «ослица» естественно и точно передаёт это значение.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел»; в данном повествовании речь явно идёт о сверхъестественном существе, поэтому в основном тексте выбрано «ангел».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией «Яхве», соответствующей еврейскому тетраграмматону.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: прижалась к стене
  rationale: Форма глагола выражает движение ослицы вплотную к стене; «прижалась» естественно передаёт возвратно-направленное действие.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: прижала ногу Валаама к стене
  rationale: Повтор корня לחץ сохранён посредством однокоренных русских глаголов «прижалась / прижала»; нога оказалась зажата между ослицей и стеной.
- source_word: רֶגֶל
  choice: нога
  rationale: רֶגֶל может обозначать ступню или ногу; в русском контексте «прижала ногу к стене» звучит естественно и не вводит неоправданной анатомической точности.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: он снова ударил её
  rationale: Конструкция יסף с инфинитивом обозначает повтор действия; «снова ударил» кратко и точно передаёт смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно стоит личное имя Бога; транслитерация сохраняет различие между именем Яхве и титулом «Господь».
- issue: Значение מַלְאַךְ в сочетании מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Лексическая двузначность отмечена в сноске, однако сверхъестественный характер существа в контексте делает «ангел» наиболее ясным вариантом основного текста без дальнейшего богословского отождествления.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Повтор «к стене» сохранён вслед за еврейским текстом, как и словесная связь «прижалась / прижала».
