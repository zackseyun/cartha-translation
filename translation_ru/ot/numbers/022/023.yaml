language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: ru
  text: Ослица увидела ангела Яхве[a], стоявшего на дороге с обнажённым мечом в руке, свернула с дороги и пошла в поле. Тогда Валаам ударил ослицу, чтобы вернуть её на дорогу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестника Яхве».'
    reason: Лексема מַלְאָךְ может обозначать как ангела, так и вестника.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: ослица
  rationale: Существительное אָתוֹן обозначает самку осла; русское «ослица» точно и естественно передаёт род животного.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; в данном повествовательном контексте сверхъестественная фигура с обнажённым мечом естественно обозначается словом «ангел», при сохранении альтернативы в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: стоявшего посреди дороги
  rationale: Причастие נִצָּב описывает неподвижное положение, а בַּדֶּרֶךְ в контексте указывает на преграждение пути; «посреди дороги» естественно передаёт эту сцену.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: с обнажённым мечом в руке
  rationale: שְׁלוּפָה означает меч, вынутый из ножен; предложная конструкция сохраняет образ и звучит естественно по-русски.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: ослица свернула с дороги
  rationale: Глагол נָטָה здесь обозначает отклонение от пути; «свернула с дороги» точно и идиоматично передаёт движение.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: пошла в поле
  rationale: שָׂדֶה может означать поле или открытую местность; конкретное «поле» соответствует сцене и сохраняет краткость оригинала.
- source_word: וַיַּךְ
  choice: ударил
  rationale: Глагол נכה имеет широкое значение нанесения удара; форма сама по себе не требует значения многократного избиения.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: чтобы вернуть её на дорогу
  rationale: Инфинитив с суффиксом женского рода означает заставить ослицу повернуть к дороге; с учётом её предшествующего ухода естественное русское «вернуть» проясняет направление без добавления нового события.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Контекст сверхъестественного явления с обнажённым мечом поддерживает перевод «ангел», однако лексическая возможность значения «вестник» сохранена в сноске без догматического отождествления фигуры.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены конкретные образы исходного текста; синтаксис слегка перестроен для естественности русского предложения без устранения лексической неоднозначности.
