base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: ru
  text: Когда Валак услышал, что Валаам пришёл, он вышел, чтобы встретить его у города Моава[a], расположенного на границе Арнона, на самом краю границы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у города в Моаве». Еврейское выражение может обозначать как определённый, известный город Моава, так и в более общем смысле город, находившийся в Моаве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на краю территории». Еврейское слово, переведённое как «граница», может также означать «территория, область».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Обычное значение שׁמע; передаёт получение известия, не добавляя не указанного в тексте посредника.
- source_word: כִּי בָא בִלְעָם
  choice: что Валаам пришёл
  rationale: Придаточное передаёт содержание услышанного; совершенный вид естественно обозначает уже состоявшееся прибытие.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: вышел ему навстречу
  rationale: Сохраняет значение движения наружу у יצא и нейтральное значение встречи у לִקְרָאתוֹ.
- source_word: אֶל עִיר מוֹאָב
  choice: к городу Моава
  rationale: אֶל после глагола движения передано направительным «к»; сочетание עִיר מוֹאָב допускает понимание как известного города Моава, при сохранении альтернативы в примечании.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: расположенному у границы Арнона
  rationale: עַל גְּבוּל обозначает положение у или на границе; «Арнон» сохранён как географическое название.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: на самом краю границы
  rationale: Передаёт קצה как «край» и сохраняет повтор גבול («граница»), присутствующий в еврейском тексте.
