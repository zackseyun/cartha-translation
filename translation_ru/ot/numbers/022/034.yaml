source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: ru
  text: 'Тогда Валаам сказал ангелу Яхве[a]: «Я согрешил, потому что не знал, что ты стоишь на дороге, чтобы противостать мне. А теперь, если это зло в твоих глазах[b], я вернусь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестнику Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если [это] зло в твоих глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел»; в данном повествовании речь идёт о сверхъестественном существе с обнажённым мечом, поэтому «ангел» естественнее в основном тексте. Личное имя יְהוָה передано как «Яхве».
- source_word: חָטָאתִי
  choice: я согрешил
  rationale: Перфект выражает признание Валаамом совершённого греха; русская форма прошедшего времени естественно передаёт исповедальное признание.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: потому что не знал
  rationale: כִּי вводит основание сказанного; «потому что» ясно и естественно связывает признание с незнанием Валаама.
- source_word: נִצָּב לִקְרָאתִי
  choice: стоишь… чтобы противостать мне
  rationale: נִצָּב обозначает занятую устойчивую позицию, а לִקְרָאתִי — движение или направленность навстречу; контекст ангела с мечом придаёт встрече враждебный характер. «Противостать» сохраняет эту силу, не уточняя её сверх сказанного.
- source_word: בַּדָּרֶךְ
  choice: на дороге
  rationale: Прямое и естественное обозначение места встречи в контексте путешествия.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: если это зло в твоих глазах
  rationale: Сохранён образный древнееврейский оборот и его нравственная весомость; более гладкое «если это тебе неугодно» ослабило бы слово רַע («зло, дурное»).
- source_word: אָשׁוּבָה לִּי
  choice: я поверну назад
  rationale: Когортатив передаёт намерение или готовность Валаама вернуться. «Поверну назад» естественно выражает перемену направления; этический дательный לִּי отдельно не воспроизводится.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер фигуры מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Текст допускает оба словарных значения מַלְאַךְ, но повествовательный контекст указывает на сверхъестественного посланника. Вариант «вестник» сохранён в примечании, чтобы не скрывать лексическую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис прямой речи остаётся ясным; исходная идиома «зло в твоих глазах» намеренно сохранена, а её смысл пояснён в сноске.
