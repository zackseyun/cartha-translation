    issue: «Я поверну назад»
    rationale: אָשׁוּבָה — когортатив глагола «возвращаться»; в русском «я вернусь» передаёт результативное возвращение точнее, тогда как «поверну назад» может означать лишь смену направления.
  - severity: low
    issue: Интерпретирующая часть сноски b
    rationale: Фраза «то есть если ты считаешь это дурным или неугодным» выходит за пределы необходимой буквальной сноски и частично смягчает «зло». Лучше оставить буквальное пояснение.
