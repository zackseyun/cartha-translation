  to: 'И сказал Валак Валааму: «Разве я не посылал к тебе, чтобы позвать тебя?[a] Почему ты не пришёл ко мне?[b] Неужели я и вправду не могу почтить тебя?[c]»'
  rationale: 'Исправлены два места для большей близости к еврейскому тексту и естественности современного русского: «посылал к тебе» не добавляет смысл отправки людей «за» Валаамом, а «почтить тебя» прямо и широко передаёт כַּבְּדֶךָ. Вопросительная интонация, усиление הַאֻמְנָם («и вправду») и различие между буквальным «пошёл» и идиоматическим русским «пришёл» сохранены. Сноски обновлены в соответствии с изменённой формулировкой и привязаны к соответствующим словам.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:18:16Z'
