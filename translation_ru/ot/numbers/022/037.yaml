  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: ru
  text: 'И сказал Валак Валааму: «Разве я не посылал к тебе, чтобы позвать тебя?[a] Почему ты не пришёл ко мне?[b] Неужели я и вправду не могу почтить тебя?[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская конструкция с инфинитивом абсолютным усиливает глагол: «Разве я действительно не посылал к тебе?» В контексте её также можно понимать как указание на настойчивую или неоднократную посылку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Почему ты не пошёл ко мне?»'
    reason: lexical_alternative
  - marker: c
    text: «Почтить тебя» может подразумевать не только проявление уважения, но и награду или высокое положение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol, сохраняющая связность еврейского повествования.
- source_word: הֲלֹא שָׁלֹחַ שָׁלַחְתִּי אֵלֶיךָ לִקְרֹא לָךְ
  choice: Разве я не посылал за тобой, чтобы позвать тебя?
  rationale: Риторическое הֲלֹא предполагает утвердительный ответ. Русское «посылал за тобой» естественно передаёт посылку людей с целью вызвать Валаама; инфинитив абсолютный с личной формой усиливает глагол, а его точный оттенок оставлен в примечании.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Почему ты не пришёл ко мне?
  rationale: Хотя הָלַכְתָּ буквально означает «пошёл», при אֵלָי речь идёт о движении к говорящему, поэтому по-русски естественно «пришёл ко мне».
- source_word: הַאֻמְנָם
  choice: и вправду
  rationale: Передаёт усиленный, недоверчивый характер вопроса Валака современным литературным русским языком.
- source_word: כַּבְּדֶךָ
  choice: оказать тебе почесть
  rationale: 'Сохраняет широкий смысл глагола כבד в породе piel: почтить, наделить почётом или высоким положением; в контексте это может включать и награду, но не сводится к ней.'
