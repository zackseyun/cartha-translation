  source_fidelity: Первая фраза в целом верна, но «посылал за тобой» в русском может звучать как отправка людей за человеком и вместе с несовершенным видом может излишне предполагать многократность. Еврейское שָׁלֹחַ שָׁלַחְתִּי прежде всего усиленно утверждает факт посылки, не требуя значения повторности или срочности. «Почтить тебя» точнее и естественнее передаёт כַּבְּדֶךָ, сохраняя возможность как почёта, так и вознаграждения/возвышения.
  naturalness: «Оказать тебе почесть» понятно, но несколько тяжеловесно и архаично для современного литературного русского. «Почтить тебя» естественно, литературно и уместно в речи царя. «Посылал к тебе, чтобы позвать тебя» близко к оригиналу и не вносит подразумеваемого агента.
  terminology: Имена «Валак» и «Валаам» соответствуют привычной русской библейской передаче. Богословски нагруженных терминов нет. Маркеры сносок должны быть привязаны к поясняемым выражениям; порядок a, b, c сохранён.
