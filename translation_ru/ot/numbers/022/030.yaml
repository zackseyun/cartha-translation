base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: ru
  text: 'Тогда ослица сказала Валааму: «Не я ли твоя ослица, на которой ты ездил всю жизнь до нынешнего дня? Разве бывало когда-нибудь, чтобы я так с тобой поступала?» Он ответил: «Нет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: ослица / твоя ослица
  rationale: Еврейское אָתוֹן обозначает именно самку осла. Русское «ослица» естественно передаёт это значение прямо в основном тексте, поэтому отдельная сноска не требуется.
- source_word: הֲלוֹא אָנֹכִי
  choice: Не я ли
  rationale: Риторический вопрос предполагает утвердительный ответ; конструкция «Не я ли» сохраняет его силу и естественно звучит по-русски.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: на которой ты ездил
  rationale: Предлог עַל указывает на езду верхом на животном; русская конструкция точно и естественно передаёт этот смысл.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: всю жизнь до нынешнего дня
  rationale: Идиоматическая передача длительности от самого раннего времени жизни Валаама до настоящего момента.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Разве бывало когда-нибудь
  rationale: Сочетание инфинитива абсолютного с личной формой глагола подчёркивает вопрос о привычном или когда-либо повторявшемся поведении. Русская формулировка сохраняет риторическую силу без тяжеловесного «имела обыкновение».
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: чтобы я так с тобой поступала
  rationale: כֹּה отсылает к нынешнему необычному поведению ослицы; «так с тобой поступала» естественно передаёт и указательное значение, и направленность действия на Валаама.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Он ответил: «Нет»'
  rationale: В данном диалоге русское «ответил» яснее простого «сказал» обозначает краткую реакцию Валаама, не добавляя нового содержания.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Риторические вопросы сохранены; пол животного передан лексически словом «ослица». Формулировка избегает как архаического «до сего дня», так и разговорной сниженности.
