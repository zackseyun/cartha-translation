source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: ru
  text: Тогда Яхве открыл глаза Валааму[a], и тот увидел ангела Яхве[b], стоявшего на дороге с обнажённым мечом в руке. Валаам склонился и пал ниц[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «снял покров с глаз Валаама».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посланника Яхве».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на лицо своё»; то есть лицом к земле.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְגַל
  choice: открыл
  rationale: Глагол גלה буквально связан со снятием покрова, однако в русском сочетание «открыл глаза» естественно передаёт идиому и подразумевает устранение препятствия к видению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מַלְאַךְ יְהוָה
  choice: ангела Яхве
  rationale: מַלְאָךְ может означать «посланник», но в данном сверхъестественном явлении традиционное «ангел» уместно; лексическая альтернатива отмечена в сноске.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: стоявшего на дороге
  rationale: Причастие обозначает устойчивое положение стоя, а בַּדֶּרֶךְ — место на пути Валаама; по-русски естественно «на дороге».
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְּיָדוֹ
  choice: с обнажённым мечом в руке
  rationale: שְׁלֻפָה описывает меч, вынутый из ножен; конструкция с «с» естественно передаёт сопутствующее обстоятельство.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: склонился и пал ниц
  rationale: Сохраняет два последовательных глагола телесного действия и конкретный образ простирания лицом вниз, не вводя прямо значение «поклонился как Богу».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя; транслитерация сохраняет его отличие от титула.
- issue: Значение וַיִּשְׁתַּחוּ
  choice: телесное простирание («пал ниц»)
  alternative: поклонился; совершил поклонение
  rationale: Глагол способен обозначать поклонение, но контекст непосредственно описывает телесную реакцию Валаама. Выбор не разрешает богословскую неоднозначность сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты последовательности действий; архаизмы сведены к устойчивому и понятному выражению «пал ниц».
