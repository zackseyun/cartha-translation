base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: ru
  text: 'Тогда Яхве открыл рот ослицы[a], и она сказала Валааму: «Что я тебе сделала? Почему ты трижды ударил меня[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл рот ослицы». Еврейское слово обозначает ослицу, то есть животное женского пола.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вот три ноги»; это еврейское идиоматическое выражение означает «три раза» или «в трёх случаях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: отверз
  rationale: Глагол פתח в форме qal прямо означает «открыл». В сочетании «отверз уста» этот вариант естественен для возвышенного повествовательного регистра и сохраняет непосредственное действие Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: פִּי הָאָתוֹן
  choice: уста ослицы
  rationale: Сочетание буквально означает «рот/уста ослицы». Слово אָתוֹן обозначает ослицу, поэтому пол животного выражен прямо; «уста» уместно в устойчивом русском обороте «отверз уста».
- source_word: וַתֹּאמֶר
  choice: и она сказала
  rationale: Форма глагола женского рода согласуется с ослицей; местоимение делает смену говорящего ясной и звучит естественно по-русски.
- source_word: לְבִלְעָם
  choice: Валааму
  rationale: Использована традиционная русская форма имени; предлог ל передан дательным падежом.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Что я тебе сделала
  rationale: Естественная русская передача вопроса; женский род сказуемого соответствует ослице как говорящей.
- source_word: כִּי
  choice: что
  rationale: В данном вопросе כִּי вводит основание или следствие жалобы; русское «что» естественно связывает обе части, не устраняя возможный причинный оттенок.
- source_word: הִכִּיתַנִי
  choice: ты ударил меня
  rationale: נכה означает «ударить, поразить». Совершенный вид естественно передаёт уже совершённые удары без усиления до «избил».
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: уже три раза
  rationale: רְגָלִים буквально значит «ноги», но здесь входит в идиому со значением трёх случаев или раз. «Уже» естественно передаёт указательно-итоговый оттенок זֶה в контексте повторившегося действия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «отверз уста». Реплика ослицы передана просто и непосредственно; архаические формы вне устойчивого оборота не используются.
