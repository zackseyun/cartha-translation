  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: ru
  text: 'Утром Валаам встал и сказал сановникам Валака[a]: «Возвращайтесь в свою землю, потому что Яхве отказался позволить мне пойти с вами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князьям Валака»; «начальникам Валака».'
    reason: Лексема שָׂרִים допускает значения высокопоставленных должностных лиц, князей или руководителей.
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычный повествовательный глагол קום; в сочетании с указанием времени естественно передаёт начало следующего действия.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Стандартное и естественное русское соответствие временному выражению без добавления отсутствующего в еврейском тексте акцента на раннем времени.
- source_word: שָׂרֵי בָלָק
  choice: сановникам Валака
  rationale: שָׂרִים обозначает высокопоставленных представителей, начальников или князей. В данном контексте это посланники царя; «сановники» передаёт их официальный статус и сохраняет dignified narrative register.
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: возвращайтесь в свою землю
  rationale: 'Буквально: «идите в вашу землю». По контексту речь о возвращении посланников домой; русский глагол «возвращайтесь» естественно выражает подразумеваемое направление, а «в свою землю» сохраняет лексику אֶרֶץ.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину повеления и ясно передаётся причинной конструкцией.
- source_word: מֵאֵן
  choice: не позволил
  rationale: Piel глагола מאן означает решительный отказ. Вместе с конструкцией נתן + инфинитив русское «не позволил» естественно передаёт отказ дать разрешение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: לְתִתִּי לַהֲלֹךְ עִמָּכֶם
  choice: позволил мне пойти с вами
  rationale: Конструкция נתן с инфинитивом имеет разрешительное значение; буквальное «дать мне идти» по-русски неестественно. הלך с עִם здесь означает сопровождение делегации.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер Божьего ответа в словах Валаама
  choice: не позволил мне пойти
  alternative: отказался отпустить меня; не хочет, чтобы я пошёл
  rationale: Формулировка сохраняет заявленный Валаамом решительный отказ Яхве, но не добавляет объяснения Божьих мотивов и не снимает напряжения с последующим развитием повествования.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов слегка перестроен ради естественности: временное обстоятельство вынесено в начало. Реплика остаётся прямой и лаконичной.'
