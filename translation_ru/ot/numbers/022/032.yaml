  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: ru
  text: 'Ангел Яхве сказал ему: «Почему ты трижды ударил свою ослицу? Вот, я вышел тебе навстречу как противник[a], потому что твой путь безрассуден предо мною[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שָׂטָן здесь означает «противник» или «тот, кто препятствует», а не обязательно собственное имя «Сатана».
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол יָרַט редок и не вполне ясен. Его также понимают в значении «твой путь порочен предо мною» или «твой путь идёт наперекор мне».
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאַךְ в этом повествовании обозначает сверхъестественного посланника, поэтому передано словом «ангел»; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: עַל מָה
  choice: Почему
  rationale: Естественно передаёт краткий еврейский вопрос о причине.
- source_word: הִכִּיתָ אֶת־אֲתֹנְךָ
  choice: ты ударил свою ослицу
  rationale: נכה означает «ударять»; אֲתוֹן — именно ослица, что по-русски можно передать без стилистической тяжеловесности.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: трижды
  rationale: Еврейское идиоматическое выражение означает «три раза»; «трижды» кратко и естественно в прямой речи.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Вот, Я вышел
  rationale: «Вот» сохраняет функцию привлечения внимания у הִנֵּה, а «вышел» прямо передаёт יָצָאתִי.
- source_word: לְשָׂטָן
  choice: как противник
  rationale: שָׂטָן употреблено как нарицательное существительное «противник», а не обязательно как имя собственное; конструкция сохраняет именной образ исходного текста.
- source_word: הַדֶּרֶךְ
  choice: твой путь
  rationale: В еврейском буквально «путь», но по контексту речь идёт о пути и образе действий Валаама; притяжательное местоимение делает эту связь естественной по-русски.
- source_word: יָרַט ... לְנֶגְדִּי
  choice: идёт наперекор Мне
  rationale: Редкий и неясный глагол יָרַט в сочетании с לְנֶגְדִּי выражает отрицательную оценку пути как противного говорящему; перевод сохраняет направленность против Него, не сводя выражение только к нравственной «порочности» или только к «безрассудству».
theological_decisions:
- issue: Значение לְשָׂטָן
  choice: 'нарицательное: «как противник»'
  alternative: «как Сатана» или «чтобы воспрепятствовать тебе»
  rationale: Здесь ангел Яхве выступает против Валаама, а слово שָׂטָן описывает его роль. Передача именем «Сатана» внесла бы в текст не заявленное им отождествление; глагольный перевод был бы естественен, но скрыл бы форму существительного.
- issue: Значение редкого יָרַט
  choice: «идёт наперекор Мне»
  alternative: «безрассуден предо Мною» или «порочен предо Мною»
  rationale: Значение глагола спорно. Основной текст передаёт контекстуально ясную мысль о противонаправленности пути, а примечание сохраняет важные лексические альтернативы, не объявляя одну из них бесспорной.
translation_notes:
  register: Современный литературный русский с достоинством библейской прямой речи. «Ослица» точно передаёт пол животного и остаётся общеупотребительным словом. Заглавные местоимения в речи ангела отражают традиционную русскую типографическую почтительность к божественному говорящему, не устраняя повествовательной неоднозначности его представительства.
