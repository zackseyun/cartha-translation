  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: ru
  text: И пошёл Валаам с Валаком, и они пришли в Кириаф-Хуцот[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Кириаф-Хуцот», вероятно, означает «город улиц» или «город открытых мест».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Форма qal wayyiqtol от הלך продолжает последовательность повествовательных действий; «пошёл» естественно передаёт простое движение.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Традиционная и общепонятная русская передача личного имени.
- source_word: עִם
  choice: с
  rationale: Предлог прямо обозначает совместное действие или сопровождение.
- source_word: בָּלָק
  choice: Валак
  rationale: Традиционная русская передача личного имени.
- source_word: וַיָּבֹאוּ
  choice: пришли они
  rationale: Множественное число qal wayyiqtol от בוא обозначает следующее действие. «Пришли» сохраняет основное значение движения, не уточняя без необходимости, вошли ли они в город или достигли его окрестностей.
- source_word: קִרְיַת חֻצוֹת
  choice: Кириаф-Хуцоф
  rationale: Сочетание служит географическим названием, поэтому в основном тексте оно передано транслитерацией в форме, согласованной с распространённой русской библейской традицией; возможное значение раскрыто в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской интонацией. Начальное «И» сохраняет связь стиха с последовательностью древнееврейского повествования; перестановка «пришли они» делает смену числа ясной и звучит естественно.
