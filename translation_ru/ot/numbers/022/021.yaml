lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычное повествовательное значение формы Qal от קום; «встал» естественно передаёт начало действия без архаизации.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Традиционная и общепринятая русская передача библейского имени.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Точно передаёт стандартное указание времени; наречие «рано» в еврейском тексте отсутствует.
- source_word: וַיַּחֲבֹשׁ
  choice: оседлал
  rationale: В сочетании с ослицей глагол חבש означает подготовить животное для езды, то есть оседлать.
- source_word: אֶת אֲתֹנוֹ
  choice: свою ослицу
  rationale: Существительное אָתוֹן прямо обозначает самку осла; русское «ослица» естественно и сохраняет выраженную в источнике половую принадлежность без необходимости в примечании.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Прямой и естественный повествовательный эквивалент הלך; не добавляет значения начала пути сверх текста.
- source_word: עִם
  choice: с
  rationale: Непосредственно передаёт значение совместного движения.
- source_word: שָׂרֵי מוֹאָב
  choice: князьями Моава
  rationale: «Князья» сохраняет высокий общественно-политический статус שָׂרִים и соответствует достоинству библейского повествования.
