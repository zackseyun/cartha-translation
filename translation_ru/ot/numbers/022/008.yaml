base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: ru
  text: 'Он сказал им: «Останьтесь здесь на ночь, и я передам вам ответ согласно тому, что скажет мне Яхве[a]». И вельможи Моава остались у Валаама.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (YHWH) — личное имя Бога; традиционно переводится: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Останьтесь здесь на ночь
  rationale: Повелительная форма לִינוּ означает остаться или переночевать; сочетание «останьтесь здесь на ночь» естественно по-русски и сохраняет указания на место и время.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: я передам вам ответ
  rationale: Каузативная форма שוב в сочетании с דָּבָר выражает возвращение с сообщением или ответом. Русское «передам вам ответ» естественно передаёт смысл, не добавляя отсутствующего в тексте содержания.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: какой даст мне Яхве
  rationale: כַּאֲשֶׁר обозначает соответствие тому, что будет сказано; в связи со словом «ответ» придаточное «какой даст мне» звучит естественно и сохраняет зависимость ответа Валаама от речи Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וַיֵּשְׁבוּ
  choice: остались
  rationale: В данном контексте ישב означает, что посланники остались у Валаама после его приглашения переночевать.
- source_word: שָׂרֵי מוֹאָב
  choice: моавитские вельможи
  rationale: שָׂרִים может обозначать князей, начальников, сановников или высокопоставленных представителей. «Вельможи» уместно для царских посланников и не утверждает наследственный княжеский титул.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохранено в основном тексте. Сноска сообщает читателю о традиционной замене титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Реплика передана естественно и ясно; неоднозначность שָׂרֵי отражена выбором широкого по значению слова «вельможи».
