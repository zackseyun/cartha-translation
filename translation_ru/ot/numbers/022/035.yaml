id: NUM.22.35
reference: Numbers 22:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: ru
  text: 'Тогда ангел[a] Яхве сказал Валааму: «Иди с этими людьми, но говори только то слово[b], которое Я скажу тебе». И Валаам пошёл с сановниками[c] Валака.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «сообщение» или «дело».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «князьями»; то есть высокопоставленными людьми Валака, не обязательно его сыновьями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может обозначать посланника или ангела; в повествовании перед Валаамом предстаёт сверхъестественное существо, поэтому в основном тексте выбрано «ангел», а более широкое значение отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: иди с этими людьми
  rationale: Императив передан прямо; определённая группа мужчин уже известна из контекста, поэтому по-русски естественно «с этими людьми».
- source_word: וְאֶפֶס
  choice: но ... только
  rationale: Оборот вводит строгое ограничение к данному разрешению; сочетание «но ... только» ясно передаёт и противопоставление, и исключительность.
- source_word: הַדָּבָר
  choice: то слово
  rationale: В контексте речи דָּבָר естественно означает «слово» или «сообщение». «Слово» сохраняет единственное число и связь с глаголом דבר.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: которое Я скажу тебе
  rationale: Имперфект имеет будущее относительно момента повеления значение; русское «скажу» передаёт его естественно.
- source_word: אֹתוֹ תְדַבֵּר
  choice: говори только то слово
  rationale: Вынесенное вперёд местоименное дополнение подчёркивает, что Валаам должен произнести именно данное ему слово и никакое другое; русский ограничительный оборот передаёт этот акцент без тяжеловесного повтора.
- source_word: שָׂרֵי בָלָק
  choice: сановники Валака
  rationale: שָׂרִים обозначает высокопоставленных правителей или должностных лиц. «Сановники» соответствует дипломатическому окружению и не создаёт впечатления, будто речь непременно идёт о царских сыновьях.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Непосредственный контекст описывает сверхъестественного небесного участника, поэтому «ангел» уместно в основном тексте; лексическая возможность «посланник» сохранена в сноске без дополнительного догматического уточнения.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательного библейского стиля. Повеление сформулировано ясно и естественно; сохранены ограничительная сила оборота и повтор лексемы «слово». Имена переданы в привычной русской библейской форме: Валаам, Валак.'
