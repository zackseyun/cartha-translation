  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: ru
  text: А теперь и вы останьтесь здесь на эту ночь, пожалуйста, чтобы я узнал, что ещё скажет мне Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Связующий дискурсивный оборот вводит следующее указание Валаама; «А теперь» естественно передаёт и союз, и переход к новой реплике.
- source_word: שְׁבוּ נָא
  choice: останьтеcь, пожалуйста
  rationale: Глагол ישׁב здесь означает «оставаться, пребывать», а частица נָא придаёт просьбе вежливый оттенок.
- source_word: בָזֶה
  choice: здесь
  rationale: В контексте выражение имеет местное значение; краткое «здесь» естественно для современной русской речи.
- source_word: גַּם אַתֶּם
  choice: и вы
  rationale: Добавочное значение גם указывает, что новая делегация, как и прежняя, должна остаться; русское «и вы» сохраняет этот акцент.
- source_word: הַלָּיְלָה
  choice: на эту ночь
  rationale: Форма обозначает предстоящую ночь. «На эту ночь» хорошо сочетается с глаголом «останьтесь» и звучит естественно.
- source_word: וְאֵדְעָה
  choice: чтобы я узнал
  rationale: Когортатив выражает намерение или цель, связанную с просьбой остаться; целевая конструкция передаёт этот оттенок.
- source_word: מַה יֹּסֵף
  choice: что ещё
  rationale: Сочетание с יסף выражает добавочное или дальнейшее действие. «Что ещё» кратко и естественно сохраняет этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: דַּבֵּר עִמִּי
  choice: скажет мне
  rationale: Буквально возможно «будет говорить со мной», однако здесь внимание сосредоточено на дальнейшем сообщении; «скажет мне» естественно передаёт смысл без предположения о взаимном разговоре.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Ожидание Валаамом дальнейшего слова Бога
  choice: Сохранена формулировка «что ещё скажет мне Яхве» без пояснения мотивов Валаама
  alternative: Добавить оценочное пояснение, будто Валаам надеялся добиться иного решения
  rationale: Стих сообщает слова Валаама, но сам по себе не формулирует оценку его намерений; перевод не должен разрешать эту повествовательную напряжённость за текст.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным звучанием. Порядок слов сохраняет добавочный акцент «и вы», а вежливое «пожалуйста» передаёт נָא. Сноска помещена непосредственно после выражения, к которому относится.
