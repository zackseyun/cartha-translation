  terminology: Имена «Валаам» и «Валак» нормативны. «Бог» и образ «в уста» соответствуют контексту и исходному тексту. Соотносительная конструкция «Что ... то ...» адекватно выражает выделенное אֹתוֹ и его ограничительный акцент.
