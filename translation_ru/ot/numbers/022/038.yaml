base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: ru
  text: 'И сказал Валаам Валаку: «Вот, теперь я пришёл к тебе. Разве я могу сказать хоть что-нибудь? Что Бог вложит в мои уста, то я и скажу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую силу частицы и естественно звучит в современном литературном русском.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: теперь я пришёл к тебе
  rationale: Передаёт совершённость прибытия и подчёркнутую наречием עַתָּה актуальность момента.
- source_word: הֲיָכוֹל אוּכַל
  choice: разве я властен
  rationale: Риторический вопрос и конструкция с абсолютным инфинитивом подчёркивают реальную способность или полномочие; «властен» естественно выражает ограниченность Валаама, не сводя её лишь к физической возможности.
- source_word: דַּבֵּר מְאוּמָה
  choice: сказать хоть что-нибудь
  rationale: Передаёт значение מְאוּמָה — «что-либо, хоть что-нибудь» — и усиление риторического вопроса.
- source_word: הַדָּבָר
  choice: что
  rationale: В русской соотносительной конструкции «что... то» естественно передаёт определённый объект речи, не утрачивая смысла данного Богом слова.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: Бог вложит в мои уста
  rationale: Сохраняет конкретную древнееврейскую метафору сообщённой Богом речи в устойчивой и достойной русской формулировке.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: то я и скажу
  rationale: 'Соотносительное «то» и усилительная частица «и» передают вынесенный вперёд объект и ограничительный акцент: Валаам скажет именно данное Богом.'
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число глагола и контекст указывают на единого Бога, дающего Валааму слова.
theological_decisions:
- issue: Божественное ограничение речи Валаама
  choice: Валаам признаёт, что не властен говорить независимо и скажет именно то, что Бог вложит в его уста.
  alternative: Валаам способен говорить по своему усмотрению, но добровольно обещает ограничиться Божьим словом.
  rationale: Эмфатическое הֲיָכוֹל אוּכַל и вынесенное אֹתוֹ представляют речь Валаама как ограниченную, однако перевод не уточняет сверх текста механизм этого ограничения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Сохранена метафора «вложит в мои уста»; архаичные «се» и «изречь» не используются.
