base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: ru
  text: 'Ночью Бог пришёл к Валааму и сказал ему: «Если люди пришли позвать тебя[a], встань и иди с ними. Но делай только то, что Я скажу тебе[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если люди пришли вызвать тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «но только то слово (или: дело), которое Я скажу тебе, — то сделай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычное повествовательное значение בוא; перевод «явился» добавлял бы не указанную в тексте мысль о видении.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном стихе стоит אֱלֹהִים, а не имя יהוה, поэтому различие сохраняется.
- source_word: לַיְלָה
  choice: ночью
  rationale: Естественное и точное временное обозначение в современном русском языке.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Если эти люди пришли позвать тебя
  rationale: Передаёт условную конструкцию и контекстуальное значение קרא «позвать, вызвать»; указательное «эти» естественно отсылает к уже известным людям.
- source_word: קוּם לֵךְ אִתָּם
  choice: встань и иди с ними
  rationale: Сохраняет оба повеления и звучит естественно по-русски.
- source_word: וְאַךְ
  choice: Но ... только
  rationale: 'Передаёт ограничительно-противительное значение частицы: разрешение идти сопровождается строгим условием.'
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ אֹתוֹ תַעֲשֶׂה
  choice: делай только то, что Я скажу тебе
  rationale: Естественно передаёт вынесенный объект и повелительную силу конструкции; דָּבָר здесь может обозначать сказанное слово или предписанное дело.
theological_decisions:
- issue: Обозначение Бога в стихе
  choice: Бог
  alternative: Господь
  rationale: Исходный еврейский текст употребляет אֱלֹהִים, а не יהוה; перевод не гармонизирует это обозначение с соседними стихами.
- issue: Степень свободы Валаама
  choice: 'Разрешение идти передано вместе со строгим ограничением: делать лишь сказанное Богом'
  alternative: Передать слова как безусловное одобрение поездки
  rationale: Частица אַךְ прямо ограничивает разрешение и сохраняет повествовательное напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «встань и иди» сохраняет ритм двух еврейских императивов; заключительная фраза слегка перестроена ради естественного русского синтаксиса без утраты ограничения и акцента.
