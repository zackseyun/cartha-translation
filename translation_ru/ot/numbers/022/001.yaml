  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: ru
  text: И отправились сыны Израиля[a], и расположились станом на равнинах Моава, за Иорданом[b], напротив Иерихона[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля» — обычное обозначение всего народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по ту сторону Иордана». Это выражение зависит от географической точки отсчёта повествователя.'
    reason: lexical_alternative
  - marker: c
    text: 'Иерихон здесь служит ориентиром: равнины Моава находились к востоку от Иордана, напротив города.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в повествовании о странствиях означает сняться со стоянки и двинуться дальше. «Отправились» естественно передаёт начало перехода, не перегружая текст пояснением.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено буквальное национальное обозначение «сыны Израиля». В данном контексте оно относится ко всему народу, а не только к мужчинам.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה означает остановиться лагерем. Выражение «расположились станом» ясно и достойно передаёт смысл, сохраняя повествовательный регистр.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עַרְבוֹת обозначает равнинную степную местность. «Равнины Моава» — понятная и устоявшаяся географическая передача.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: за Иорданом
  rationale: Оборот обозначает сторону по ту сторону Иордана относительно принятой точки отсчёта. «За Иорданом» кратко и естественно сохраняет относительность выражения.
- source_word: יְרֵחוֹ
  choice: напротив Иерихона
  rationale: Иерихон служит ориентиром для местоположения стоянки на восточном берегу Иордана. «Напротив Иерихона» точнее раскрывает географическое соотношение, подразумеваемое краткой еврейской конструкцией.
