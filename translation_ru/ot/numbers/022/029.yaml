  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: ru
  text: 'И сказал Валаам ослице: «Потому что ты так надо мной издеваешься! Будь у меня в руке меч, я бы сейчас же тебя убил».[a]'
  philosophy: optimal-equivalence
  footnotes:
