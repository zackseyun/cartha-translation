    text: 'Возможный перевод: «я бы уже тебя убил». Еврейская конструкция выражает нереальное условие и действие, которое Валаам совершил бы немедленно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר בִּלְעָם
  choice: И сказал Валаам
  rationale: Стандартная передача повествовательного wayyiqtol сохраняет связность и возвышенно-нейтральный библейский строй русского повествования.
- source_word: לָאָתוֹן
  choice: ослице
  rationale: Существительное אָתוֹן прямо обозначает самку осла; русское «ослица» естественно и точно передаёт явно выраженный женский род.
- source_word: כִּי הִתְעַלַּלְתְּ בִּי
  choice: За то, что ты так надо мной издеваешься
  rationale: Hitpael глагола עלל может выражать издевательское, унизительное или жестокое обращение. «Издеваешься надо мной» естественно передаёт обвинение Валаама, а «так» усиливает эмоциональный оттенок реплики.
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: Будь у меня в руке меч
  rationale: לוּ вводит нереальное пожелание или условие. Такая русская конструкция сохраняет образ меча в руке и передаёт отсутствие меча в данный момент.
- source_word: כִּי עַתָּה
  choice: сейчас же
  rationale: В данном контексте оборот подчёркивает немедленность угрожаемого действия; «сейчас же» звучит естественно в гневной прямой речи.
- source_word: הֲרַגְתִּיךְ
  choice: я бы сейчас же тебя убил
  rationale: В сочетании с לוּ форма выражает нереализованное действие, которое Валаам совершил бы немедленно; условное наклонение по-русски передаёт это без излишне ретроспективного оттенка.
