base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: ru
  text: Тогда Валак снова послал сановников, более многочисленных и более знатных, чем прежние.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: снова послал
  rationale: Сочетание יָסַף с инфинитивом и עוֹד выражает повторение действия; по-русски естественно передаётся как «снова послал».
- source_word: בָּלָק
  choice: Валак
  rationale: Имя передано в принятой русской библейской форме.
- source_word: שָׂרִים
  choice: сановников
  rationale: В данном дипломатическом контексте слово обозначает высокопоставленных представителей правителя; «сановники» передаёт их официальный статус.
- source_word: רַבִּים
  choice: более многочисленных
  rationale: Предлог מִן в מֵאֵלֶּה задаёт сравнение, поэтому сравнительная степень выражена явно.
- source_word: וְנִכְבָּדִים
  choice: более знатных
  rationale: Причастное прилагательное от כבד указывает здесь на высокий общественный ранг и престиж; «знатных» естественно передаёт этот статусный оттенок.
- source_word: מֵאֵלֶּה
  choice: чем прежние
  rationale: Указательное местоимение отсылает к ранее посланным сановникам; «прежние» делает эту связь ясной и естественной по-русски.
