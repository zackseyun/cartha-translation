base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: ru
  text: И пошли старейшины Моава и старейшины Мадиама с платой за прорицание в руках[a]. Они пришли к Валааму и передали ему слова Валака.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с прорицаниями в руках». Еврейское слово может обозначать прорицания или связанное с ними; в данном контексте оно, вероятно, метонимически указывает на плату, принесённую прорицателю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: старейшины
  rationale: Слово обозначает признанных старших представителей или руководителей народа; «старейшины» точно передаёт общественно-политический статус.
- source_word: וּקְסָמִים בְּיָדָם
  choice: неся в руках плату за прорицание
  rationale: קְסָמִים буквально может относиться к прорицаниям, их средствам или знамениям, но в данном повествовательном контексте, вероятнее всего, метонимически обозначает вознаграждение прорицателю. Формулировка сохраняет образ «в руках» и сопровождается сноской об иной возможности.
- source_word: וַיָּבֹאוּ אֶל
  choice: они пришли к
  rationale: Глагол בוא с אֶל прямо означает прибытие к кому-либо; отдельное предложение естественно передаёт последовательность действий.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: передали ему
  rationale: Буквально — «говорили ему», однако в сочетании с «словами Валака» по-русски естественно означает передачу порученных слов. Содержание не превращено в косвенную речь.
- source_word: דִּבְרֵי בָלָק
  choice: слова Валака
  rationale: Формально передаёт конструкцию и сохраняет открытым вопрос, были ли это точные слова царя или его порученное послание.
- source_word: וַיֵּלְכוּ
  choice: И пошли
  rationale: Начальное וַ продолжает повествовательную цепь; традиционное и естественное русское «И» не добавляет явно выраженной причинности.
