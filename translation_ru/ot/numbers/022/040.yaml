  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: ru
  text: И Валак принёс в жертву крупный и мелкий скот[a] и послал Валааму и сановникам, которые были с ним, части от жертвенных животных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крупный скот и овец». Еврейское слово, переведённое как «мелкий скот», может обозначать овец и коз.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «послал». Из контекста следует, что были посланы части от принесённых в жертву животных.'
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: принёс в жертву
  rationale: Глагол זבח обозначает заклание в жертву; этот перевод ясно сохраняет культовый смысл, не сводя действие к обычному забою.
- source_word: בָּקָר
  choice: крупный скот
  rationale: Собирательное בקר обозначает крупный рогатый скот без указания только на самцов.
- source_word: צֹאן
  choice: мелкий скот
  rationale: Собирательное צאן может включать овец и коз; «мелкий скот» сохраняет более широкий смысл еврейского слова.
- source_word: וַיְשַׁלַּח
  choice: послал часть мяса
  rationale: Сам глагол означает просто «послал», но после упоминания жертвенного заклания подразумевается отправка мяса или жертвенных долей. Слово «часть» передаёт контекстуальный эллипсис, а сноска отмечает буквальную форму.
- source_word: לְבִלְעָם
  choice: Валааму
  rationale: Традиционная и понятная русская передача имени בִּלְעָם.
- source_word: לַשָּׂרִים
  choice: сановникам
  rationale: שׂרים здесь означает высокопоставленных людей при царе; «сановники» естественно для повествовательного регистра и не предполагает наследственного княжеского титула.
- source_word: אֲשֶׁר אִתּוֹ
  choice: которые были с ним
  rationale: Сохранено местоимение исходного текста; его ближайший естественный антецедент — Валаам.
