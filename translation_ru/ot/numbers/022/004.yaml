base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: ru
  text: 'И сказал Моав старейшинам Мадиама: «Теперь это собрание[a] вылижет всё вокруг нас, как бык вылизывает зелень поля[b]». В то время царём Моава был Валак, сын Циппора.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это множество». Еврейское слово обозначает собравшееся сообщество людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полевую траву». Еврейское слово имеет более широкое значение и может обозначать зелёную растительность вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: Моав
  rationale: Название страны и народа персонифицировано и выступает подлежащим в единственном числе, как и в еврейском тексте.
- source_word: זִקְנֵי מִדְיָן
  choice: старейшинам Мадиама
  rationale: Прямо передаёт конструкцию «старейшины Мадиама» и естественно звучит по-русски после глагола речи.
- source_word: יְלַחֲכוּ
  choice: объест
  rationale: Русское «объест» сохраняет образ поедания растительности быком и естественнее буквального «оближет»; повтор того же глагола в сравнении воспроизводит повтор корня לחך.
- source_word: הַקָּהָל
  choice: это собрание
  rationale: Передаёт собирательное значение и контекстуальную указательность, не сужая смысл до войска или толпы.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: всё вокруг нас
  rationale: Естественная русская передача буквального «всё наше окружение», обозначающего всё в окрестности.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: как бык объедает
  rationale: Сохраняет сельскохозяйственное сравнение и повтор глагольного образа.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: зелень в поле
  rationale: יֶרֶק обозначает зелёную растительность шире, чем только трава; «зелень» сохраняет эту широту, а «в поле» естественно передаёт зависимость от הַשָּׂדֶה.
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: Валак, сын Циппора
  rationale: Использованы традиционно узнаваемые русские формы имён с прозрачной передачей родства.
- source_word: מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: В то время царём Моава был
  rationale: Естественный русский порядок слов передаёт фоновую информацию о положении Валака в тот период.
