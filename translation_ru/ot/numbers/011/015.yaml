  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: ru
  text: Если Ты так поступаешь со мной, то, прошу, убей меня, убей, если я обрёл благоволение в Твоих глазах, и не дай мне увидеть моё бедствие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мою беду», «моё несчастье» или «мои мучения». Древнееврейское слово может обозначать бедствие и тяжёлое положение, а не только нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: Если … так
  rationale: Условное начало передано естественной русской конструкцией; начальное וְ не требует отдельного «и».
- source_word: אַתְּ עֹשֶׂה לִּי
  choice: Ты и дальше будешь так поступать со мной
  rationale: Сочетание עשה с ל описывает то, как Бог поступает с Моисеем. «И дальше будешь» естественно выражает предполагаемое продолжение тягостного положения, не превращая фразу в утверждение о далёком будущем.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: прошу, убей меня сразу
  rationale: נָא передаёт мольбу, а сочетание императива с абсолютным инфинитивом усиливает просьбу. «Сразу» естественно передаёт решительность и настоятельность выражения.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: если я обрёл благоволение в Твоих глазах
  rationale: Сохранён обычный древнееврейский образ благосклонного отношения; «благоволение» уместно в достойном современном регистре.
- source_word: וְאַל אֶרְאֶה
  choice: и не дай мне увидеть
  rationale: Отрицательная форма просьбы обращена к Богу; такой перевод естественнее буквального «и пусть я не увижу».
- source_word: בְּרָעָתִי
  choice: моё бедствие
  rationale: רָעָה здесь обозначает постигшее человека несчастье, беду или тяжёлое положение, а не обязательно нравственное зло. Предлог בְּ при глаголе зрения не воспроизводится отдельно в русском.
theological_decisions:
- issue: Смысл בְּרָעָתִי в просьбе Моисея
  choice: личное бедствие или несчастье
  alternative: моё зло; моя беда; мои мучения
  rationale: Контекст говорит об отчаянии Моисея под непосильным бременем, а не требует понимать его слова как исповедание собственной нравственной порочности. Формулировка сохраняет диапазон значения как постигшего его несчастья.
translation_notes:
  register: Современный литературный русский язык с уважительным обращением к Богу через прописную букву. Синтаксис сохраняет напряжённую условную просьбу Моисея, но избегает буквальных оборотов, неестественных для русского языка.
