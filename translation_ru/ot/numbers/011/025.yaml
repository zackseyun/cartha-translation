revisions:
- from: Тогда Яхве сошёл в облаке и говорил с Моисеем. Он взял от Духа, который был на нём, и возложил на семьдесят старейшин. Когда Дух почил на них, они стали пророчествовать, но больше не продолжали[a].
  to: Тогда Яхве сошёл в облаке и говорил с Моисеем. Он взял от Духа, который был на нём, и возложил на семьдесят старейшин. Когда Дух почил на них, они пророчествовали, но больше не пророчествовали[a].
  rationale: Исправлена только заключительная формулировка для ясности и естественности русского языка. Основной текст по-прежнему передаёт распространённое контекстуальное понимание, что пророческое действие не продолжалось, а противоположное традиционное понимание сохранено в примечании.
