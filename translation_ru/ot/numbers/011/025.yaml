source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: ru
  text: Тогда Яхве сошёл в облаке и говорил с Моисеем. Он взял от Духа, который был на нём, и возложил на семьдесят старейшин. Когда Дух почил на них, они пророчествовали, но больше не пророчествовали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не переставали». Краткое еврейское выражение допускает оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога общепринятой русской транслитерацией, а не замена его титулом «Господь».
- source_word: וַיֵּרֶד
  choice: сошёл
  rationale: Естественно передаёт движение вниз и сохраняет образ богоявления.
- source_word: בֶּעָנָן
  choice: в облаке
  rationale: Определённая форма указывает на известное из контекста облако Божьего присутствия.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: говорил с Моисеем
  rationale: Имя восстанавливает ясного референта местоимения из контекста; русское «говорил с» естественно для обращения Бога к Моисею.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: взял от Духа, который был на нём
  rationale: Редкий глагол אצל передан без утверждения, будто Дух уменьшился; конструкция с מן сохраняет образ взятия и распределения.
- source_word: רוּחַ
  choice: Дух
  rationale: Контекст Божьего наделения силой, ведущего к пророчеству, указывает на Божьего Духа; прописная буква отражает это контекстуальное понимание.
- source_word: וַיִּתֵּן עַל
  choice: возложил на
  rationale: Сохраняет направленность «на» и образ пребывания Духа на людях, оставаясь естественным в возвышенной русской прозе.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: семьдесят старейшин
  rationale: Идиоматично передаёт семьдесят мужей, принадлежавших к старейшинам, без тяжеловесного apposition «семьдесят мужей, старейшин».
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: когда Дух почил на них
  rationale: «Почил» точно сохраняет образ покоя или пребывания Духа и соответствует dignified biblical register.
- source_word: וַיִּתְנַבְּאוּ
  choice: стали пророчествовать
  rationale: Передаёт начавшуюся вследствие сошествия Духа пророческую деятельность.
- source_word: וְלֹא יָסָפוּ
  choice: но больше не продолжали
  rationale: Передаёт наиболее вероятный контекстуальный смысл прекращения пророчества после этого случая, сохраняя краткость спорного еврейского выражения; альтернативное понимание вынесено в примечание.
theological_decisions:
- issue: Относится ли רוּחַ к Божьему Духу или к безличному «духу»
  choice: Божий «Дух» с прописной буквы
  alternative: «дух» со строчной буквы
  rationale: Дух, бывший на Моисее и наделивший старейшин способностью пророчествовать, в контексте является Божьим действующим Духом. Прописная буква — издательское толкование, поскольку в древнееврейском такого различия нет.
- issue: Смысл выражения וְלֹא יָסָפוּ
  choice: они больше не продолжали пророчествовать
  alternative: они не переставали пророчествовать
  rationale: Краткое еврейское выражение допускает разные традиционные истолкования. В основном тексте дан вероятный смысл ограниченного случая, а противоположное понимание сохранено в примечании, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формы «сошёл», «возложил» и «почил» сохраняют достоинство и образность оригинала, не делая синтаксис архаичным. Местоименное «ему» раскрыто как «Моисеем» ради ясности.
