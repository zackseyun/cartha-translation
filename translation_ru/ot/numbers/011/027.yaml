  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: ru
  text: 'И юноша побежал, сообщил Моисею и сказал: «Элдад и Медад пророчествуют в лагере».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרָץ
  choice: прибежал
  rationale: Глагол רוץ прямо означает бег; «прибежал» естественно передаёт быстрое прибытие в повествовательном контексте.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נַעַר может обозначать мальчика, юношу или молодого человека. «Юноша» — краткое и уместное обозначение молодого вестника; определённый артикль отражён в примечании как возможная формальная альтернатива.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: сообщил Моисею
  rationale: Hiphil глагола נגד означает сообщать, извещать или рассказывать; «сообщил» точно соответствует характеру донесения.
- source_word: וַיֹּאמַר
  choice: двоеточие перед прямой речью
  rationale: Отдельное «и сказал» в современном русском после «сообщил» избыточно; содержание речи естественно вводится двоеточием без утраты смысла.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Элдад и Медад
  rationale: Имена переданы в традиционной русской библейской форме.
- source_word: מִתְנַבְּאִים
  choice: пророчествуют
  rationale: Причастная форма Hitpael обозначает продолжающуюся пророческую деятельность; настоящее время русского глагола сохраняет этот аспект.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: מַחֲנֶה означает лагерь или стан. «В стане» — понятная и достойная форма, соответствующая традиционному обозначению лагеря Израиля в пустыне.
