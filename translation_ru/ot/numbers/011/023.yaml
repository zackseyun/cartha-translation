  to: 'И сказал Яхве Моисею: «Разве рука Яхве стала слишком короткой?[a] Теперь ты увидишь, сбудется ли для тебя Моё слово[b] или нет».'
  rationale: Правка ограничена двумя стилистически безопасными уточнениями. «Слишком короткой» делает сохранённую еврейскую метафору понятной и естественной по-русски, а «сбудется» передаёт осуществление Божьего слова в данном контексте. Альтернативное, более буквальное понимание глагола קרה сохранено в примечании. Якоря примечаний сохранены и соответствуют их содержанию.
