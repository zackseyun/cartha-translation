base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Разве рука Яхве стала слишком короткой?[a] Теперь ты увидишь, сбудется ли для тебя Моё слово[b] или нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «рука Яхве коротка» — образное указание на ограниченность силы или способности.
    reason: cultural_note
  - marker: b
    text: 'Или: «случится ли с тобой то, что Я сказал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Разве рука Яхве стала коротка?
  rationale: Сохраняет еврейский антропоморфный образ руки и риторический вопрос о якобы ограничившейся силе Яхве.
- source_word: עַתָּה תִרְאֶה
  choice: Теперь ты увидишь
  rationale: Естественно передаёт непосредственное предстоящее подтверждение сказанного.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: исполнится ли для тебя Моё слово
  rationale: Глагол קרה означает случиться или произойти; в контексте речь идёт об осуществлении сказанного Богом. Оборот сохраняет местоименный суффикс второго лица, не устраняя возможный оттенок «случится с тобой».
- source_word: אִם לֹא
  choice: или нет
  rationale: Естественное русское завершение косвенного вопроса с частицей «ли».
theological_decisions:
- issue: Антропоморфный образ Божьей силы
  choice: 'Сохранить буквальный образ: «рука Яхве стала коротка»'
  alternative: «Неужели сила Яхве ограничена?»
  rationale: Исходный текст намеренно использует яркую телесную метафору; примечание разъясняет её смысл, не подменяя образ толкованием.
- issue: Значение выражения הֲיִקְרְךָ דְבָרִי
  choice: «исполнится ли для тебя Моё слово»
  alternative: «случится ли с тобой то, что Я сказал»
  rationale: Основной текст естественно обозначает осуществление Божьего слова, а примечание сохраняет более буквальную и потенциально неоднозначную связь действия с Моисеем.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «И сказал Яхве Моисею» сохраняет повествовательную связность, а прописная буква в «Моё» употреблена как уважительная издательская норма. Все примечания отмечены в основном тексте.
