source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: ru
  text: Мясо ещё было у них между зубами и ещё не было съедено[a], когда гнев Яхве воспылал на народ, и Яхве поразил народ чрезвычайно тяжёлым бедствием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прежде чем оно было отсечено». Вероятный смысл: прежде чем мясо было доедено или поглощено.'
    reason: Лексическая неоднозначность глагола יִכָּרֵת.
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: мясо
  rationale: В контексте поедания перепелов слово обозначает мясо животных как пищу; это естественный современный русский эквивалент.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: ещё было у них между зубами
  rationale: Передаёт продолженность действия и сохраняет яркий образ исходного текста.
- source_word: טֶרֶם יִכָּרֵת
  choice: ещё не было съедено
  rationale: Форма כרת буквально связана с отсечением, но в данном контексте, вероятно, означает, что мясо ещё не было закончено или поглощено; неоднозначность отмечена в сноске.
- source_word: וְאַף יְהוָה חָרָה
  choice: гнев Яхве воспылал
  rationale: Сохраняет древнееврейскую метафору пылающего гнева и звучит естественно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Обычный русский эквивалент נכה в контексте Божьего суда; сохраняет силу действия без архаизма.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: чрезвычайно тяжёлым бедствием
  rationale: מַכָּה может обозначать поражение, мор или бедствие; более широкое «бедствие» не конкретизирует способ поражения сверх того, что прямо сказано в стихе, а רַבָּה מְאֹד передано как исключительная тяжесть.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Антропопатическое описание Божьего гнева
  choice: гнев Яхве воспылал
  alternative: Яхве разгневался
  rationale: Выбранный вариант сохраняет образность идиомы חרה אף и не смягчает изображение суда.
- issue: Характер מַכָּה
  choice: бедствие
  alternative: мор / поражение / язва
  rationale: Еврейское слово допускает несколько оттенков; нейтрально-широкий вариант сохраняет смысл тяжёлого Божьего поражения, не навязывая конкретную медицинскую форму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Конструкция «как» естественно связывает ещё не завершившееся действие с внезапным наступлением суда; повтор имени «Яхве» сохранён вслед за древнееврейским текстом.
