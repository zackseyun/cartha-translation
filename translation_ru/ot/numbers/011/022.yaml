  - severity: low
    issue: Фраза «зарежут овец и крупный скот» стилистически неровна и частично сужает צֹאן.
    rationale: «Мелкий и крупный скот» передаёт традиционную парную категорию исходного текста и лучше сочетается с глаголом «зарежут».
