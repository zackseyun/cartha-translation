base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: ru
  text: Неужели, если для них зарежут мелкий и крупный скот, хватит ли им? Или, если для них соберут всех морских рыб, хватит ли им?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и найдётся для них»; здесь это выражение означает «им хватит», «будет для них достаточно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: неужели
  rationale: Вопросительная частица вводит риторический вопрос Моисея; «неужели» естественно передаёт сомнение и вызов, не превращая вопрос в простое сообщение о будущем.
- source_word: צֹאן וּבָקָר
  choice: овец и крупный скот
  rationale: צֹאן обозначает мелкий домашний скот, а בָקָר — крупный рогатый скот. В данном контексте «овец и крупный скот» звучит понятно и конкретно; упоминание коз, возможных в объёме צֹאן, текст прямо не выделяет.
- source_word: יִשָּׁחֵט
  choice: зарежут
  rationale: Нифаль от שׁחט обозначает заклание животных. Русская неопределённо-личная конструкция естественно передаёт еврейский пассив и сохраняет пищевой контекст.
- source_word: לָהֶם
  choice: для них
  rationale: Предлог выражает предоставление народу; «для них» естественно передаёт эту направленность.
- source_word: וּמָצָא לָהֶם
  choice: и им хватит
  rationale: В этом сочетании מצא означает достаточность, а не буквальное нахождение. Разговорно нейтральное «им хватит» ясно и точно передаёт смысл.
- source_word: אִם
  choice: или
  rationale: Частица вводит вторую ветвь риторической альтернативы; русское «или» ясно связывает оба вопроса.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: всю рыбу морскую
  rationale: Передаёт собирательный смысл «всех рыб моря» естественным литературным русским выражением и сохраняет всеохватность כָּל.
- source_word: יֵאָסֵף
  choice: соберут
  rationale: Нифаль от אסף значит «быть собранным». Неопределённо-личное «соберут» естественно по-русски и не добавляет более узкого значения «выловят».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Два параллельных риторических вопроса сохранены; повтор «им хватит» отражает повтор исходного текста. Неопределённо-личные формы «зарежут» и «соберут» естественно передают еврейские пассивные формы.
