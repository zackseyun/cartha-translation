  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: ru
  text: И назвал он то место Киврот-Гаттаава[a], потому что там похоронили людей, которые предавались страстному желанию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Киврот-Гаттаава», вероятно, означает «могилы страстного желания» или «могилы алчного желания».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם הַמָּקוֹם הַהוּא
  choice: И назвал он то место
  rationale: Еврейская формула буквально говорит о наречении имени места. В современном русском естественнее «назвал то место»; местоимение «он» передаёт подразумеваемое подлежащее формы единственного числа, не называя его прямо.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Киврот-Гаттаава
  rationale: Название места передано транслитерацией с еврейского; его смысл раскрыт в сноске, а не подставлен вместо собственного имени.
- source_word: כִּי שָׁם
  choice: потому что там
  rationale: כִּי вводит объяснение названия, а שָׁם обозначает место; выбран прямой и естественный причинный оборот.
- source_word: קָבְרוּ אֶת־הָעָם
  choice: похоронили людей
  rationale: Форма множественного числа не называет действующих лиц. В данном контексте הָעָם обозначает группу людей из народа, подвергшихся суду; русское «людей» избегает впечатления, будто был погребён весь народ.
- source_word: הַמִּתְאַוִּים
  choice: предававшихся ненасытному желанию
  rationale: Причастие обозначает людей, которыми владело сильное, чрезмерное желание. Формулировка сохраняет неодобрительный оттенок и не сужает значение до сексуальной похоти.
