source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: ru
  text: И назвал он то место Тавера[a], потому что среди них горел огонь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Тавера» созвучно еврейскому слову, означающему «горение».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: И назвал он то место
  rationale: Русское «назвал то место» естественно передаёт еврейскую формулу именования; буквальное «назвал имя того места» в современном русском звучит тяжеловесно.
- source_word: תַּבְעֵרָה
  choice: Тавера
  rationale: Название места передано транслитерацией; его связь с корнем בער («гореть») пояснена в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Ясно выражает причинную связь в современном русском языке.
- source_word: בָעֲרָה
  choice: горел
  rationale: Прямо передаёт значение בער и сохраняет словесную связь с названием Тавера.
- source_word: בָם
  choice: среди них
  rationale: Передаёт присутствие и действие огня внутри сообщества, не создавая впечатления, будто огонь горел внутри тел людей.
- source_word: אֵשׁ יְהוָה
  choice: огонь Яхве
  rationale: Сохраняет конструкцию принадлежности/связи и прямо передаёт личное имя יהוה.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет явное личное имя Бога, не заменяя его титулом.
- issue: Смысл конструкции אֵשׁ יְהוָה
  choice: огонь Яхве
  alternative: огонь от Яхве
  rationale: Формальная конструкция допускает связь, принадлежность или происхождение; перевод «огонь Яхве» сохраняет эту ёмкость и не сводит её только к указанию источника.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости повествовательной формулы. Инверсия «назвал он» придаёт фразе умеренно торжественное библейское звучание, оставаясь понятной современному читателю.
