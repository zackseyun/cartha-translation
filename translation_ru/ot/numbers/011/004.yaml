base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: ru
  text: 'Сброд, находившийся среди них, охватило сильное желание[a]. И сыны Израиля тоже снова заплакали[b] и сказали: «Кто накормит нас мясом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возжелал желание» — усилительное сочетание однокоренных слов. Редкое слово, переведённое как «сброд», можно также понять как «разношёрстная толпа»; точный состав этой группы не указан.'
    reason: Сохраняет усилительную форму оригинала и отмечает лексическую неопределённость редкого собирательного существительного.
  - marker: b
    text: 'Или: «вернулись и заплакали». В данном контексте это, вероятно, означает, что они снова стали плакать.'
    reason: Отмечает буквальный образ глагола שׁוב и его вероятное идиоматическое значение.
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: сброд
  rationale: Редкое собирательное слово имеет неодобрительную окраску и обозначает находившуюся внутри стана группу; «сброд» кратко и ясно передаёт как собирательность, так и отрицательную оценку, не уточняя происхождение этой группы.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: находившийся среди них
  rationale: Передаёт местонахождение этой группы внутри сообщества Израиля и естественно разрешает в русском языке контекстуальное согласование местоимения.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: охватила сильная тяга
  rationale: Естественно передаёт усилительную конструкцию из глагола и однокоренного существительного, сохраняя напряжённость желания без неуклюжей русской кальки.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: снова заплакали
  rationale: Здесь שׁוב, вероятнее всего, указывает на возобновление действия; «снова заплакали» ясно и естественно выражает этот смысл.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: и сыны Израиля тоже
  rationale: Сохраняет выраженный частицей גַּם смысл присоединения и буквально передаёт традиционное этническое обозначение «сыны Израиля».
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Кто накормит нас мясом?
  rationale: Порода Hiphil глагола אכל означает «дать есть, накормить», а בשר в данном контексте — мясо как пища.
