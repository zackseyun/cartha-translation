  text: וְ/הַ/מָּ֕ן כִּ/זְרַע גַּ֖ד ה֑וּא וְ/עֵינ֖/וֹ כְּ/עֵ֥ין הַ/בְּדֹֽלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: ru
  text: Манна была похожа на семя кориандра, а видом — на бдолах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бдолах — вероятно, ароматическая смола или камедь; точное значение еврейского слова неизвестно. Некоторые считают, что речь идёт о веществе, похожем на драгоценный камень, например на жемчуг или кристалл.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: манна
  rationale: Определённое существительное обозначает уже известную пищу в пустыне; в русском языке это название естественно употребляется без артикля.
- source_word: כִּזְרַע גַּד
  choice: похожа на семя кориандра
  rationale: Предлог כְּ выражает сравнение, а גַּד обычно отождествляется с кориандром. Такое название понятно современному читателю.
- source_word: וְעֵינוֹ
  choice: а видом
  rationale: עַיִן буквально значит «глаз», но здесь идиоматически обозначает внешний вид. Краткая конструкция естественна по-русски и сохраняет переход ко второму сравнению.
- source_word: כְּעֵין הַבְּדֹלַח
  choice: на бдолах
  rationale: Повтор слова עַיִן в еврейском выражении передаёт зрительное сходство; буквальное повторение «видом — на вид» по-русски тяжеловесно. Неясный термин בְּדֹלַח сохранён транслитерацией, а его возможные значения вынесены в сноску.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Союз וְ во второй части передан как «а», поскольку здесь естественно сопоставляются две характеристики манны. Неявное сказуемое восстановлено без добавления временного или дискурсивного маркера.
