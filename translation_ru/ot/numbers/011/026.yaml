id: NUM.11.26
reference: Numbers 11:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: ru
  text: Но двое мужчин остались в стане. Одного звали Елдадом, а второго — Медадом. Дух почил на них. Они были в числе записанных[a], но не вышли к шатру[b] и пророчествовали в стане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они были среди внесённых в список». Буквально еврейский текст говорит, что они были «среди записанных».'
    reason: lexical_alternative
  - marker: b
    text: То есть, судя по контексту этого эпизода, к шатру встречи.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: остались
  rationale: Глагол שׁאר передаёт значение «остаться». Такая формулировка естественна по-русски и не объясняет сверх текста, почему эти двое не вышли к шатру.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: מַחֲנֶה обозначает стан Израиля. «В стане» — краткий, понятный и уместный в библейском повествовании локативный эквивалент для обоих употреблений.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: двое мужчин
  rationale: Сочетание прямо указывает на двух лиц мужского пола; собирательное числительное звучит по-русски естественно.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Одного звали ... а второго — ...
  rationale: Естественная современная русская передача еврейской формулы называния, сохраняющая противопоставление «одного» и «второго».
- source_word: אֶלְדָּד / מֵידָד
  choice: Елдад / Медад
  rationale: Имена переданы в закрепившейся русской библейской форме.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: Дух почил на них
  rationale: נוח означает покоиться или пребывать на ком-либо. «Почил на них» сохраняет образ ниспосланного пророческого Духа и достоинство стиля, не заменяя его более общим «сошёл».
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: они были в числе записанных
  rationale: כְּתֻבִים буквально означает «записанные». Контекст указывает на включение этих людей в записанное число старейшин, но конкретный характер списка в основном тексте не уточняется.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: но не вышли к шатру
  rationale: Направительный суффикс в הָאֹהֱלָה выражает движение к шатру. Перевод не разворачивает простое «шатёр» в «шатёр встречи», оставляя контекстуальное отождествление для сноски.
- source_word: וַיִּתְנַבְּאוּ
  choice: и пророчествовали
  rationale: Форма от נבא обозначает пророческую речь или деятельность. Перевод не добавляет необязательного начинательного оттенка «стали пророчествовать».
theological_decisions:
- issue: Следует ли понимать הָרוּחַ как Божий Дух или как безличный дух
  choice: Дух
  alternative: дух
  rationale: В ближайшем контексте речь идёт о том же Духе, который был на Моисее и был дан старейшинам для пророческого служения. Заглавная буква отражает контекстуально определённого божественного референта, не добавляя отдельной доктринальной формулы.
- issue: Следует ли раскрыть הָאֹהֱלָה как «шатёр встречи»
  choice: шатёр
  alternative: шатёр встречи
  rationale: Контекст, вероятнее всего, указывает на шатёр встречи, однако сам стих говорит только «шатёр». Основной текст сохраняет эту меру явности, а вероятное отождествление отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Стан» и «почил» сохраняют достоинство повествования, оставаясь понятными; синтаксис упрощён до естественных русских фраз без утраты смысловых связей оригинала.
