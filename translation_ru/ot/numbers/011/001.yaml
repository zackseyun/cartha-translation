  to: Народ был подобен тем, кто ропщет о невзгодах, и это дошло до слуха Яхве[a]. Яхве услышал, и воспылал его гнев. Огонь Яхве[b] запылал среди них и пожрал окраину стана[c].
  rationale: Исправление возвращает в основной текст сравнительную конструкцию כְּמִתְאֹנְנִים, не выдавая один из спорных разборов за несомненный. Слуховая идиома передана естественным русским выражением «дошло до слуха», а повторное «Яхве услышал» сохранён. Последняя фраза не вводит людей как прямо названный объект и отмечает неполноту еврейской конструкции в сноске.
