base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: ru
  text: Народ был подобен тем, кто ропщет о невзгодах, и это дошло до слуха Яхве[a]. Яхве услышал, и воспылал его гнев. Огонь Яхве[b] запылал среди них и пожрал окраину стана[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкая и трудная еврейская форма может означать: «как ропщущие», «как те, кто ропщет», или, возможно, «словно бы роптали». «О невзгодах» передаёт слово, которое также можно понимать как характеристику самого ропота: «зло», «дурно». Буквально: «в ушах Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «огонь от Яхве».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «пожрал на краю (или: окраине) стана». В еврейском тексте не уточнено, что именно было пожрано огнём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים
  choice: Народ начал роптать
  rationale: Редкая и трудная конструкция буквально сопоставляет народ с ропщущими. В основном тексте передано начало продолжающегося ропота естественным современным русским языком, а сравнительный оттенок и неоднозначность отмечены в сноске.
- source_word: רַע
  choice: на свои невзгоды
  rationale: В данном контексте слово, вероятнее всего, обозначает беду, тяготы или неблагоприятные обстоятельства, на которые жаловался народ, а не нравственное зло.
- source_word: בְּאָזְנֵי יְהוָה
  choice: так, что Яхве слышал это
  rationale: Сохранён слуховой образ еврейского выражения «в ушах Яхве»; русская формулировка показывает, что ропот дошёл до его слуха.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Яхве услышал
  rationale: Сохранён намеренный повтор корня, связанный с предшествующим упоминанием слуха Яхве.
- source_word: וַיִּחַר אַפּוֹ
  choice: и воспылал его гнев
  rationale: Естественное русское выражение сохраняет метафору жара в еврейской идиоме, буквально связанной с разгоранием гнева.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: Огонь Яхве запылал среди них
  rationale: Сохранена форма генитивной связи «огонь Яхве» и прямое отнесение суда к Яхве без уточнения, означает ли она принадлежность или происхождение.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: и пожрал часть стана на его окраине
  rationale: Глагол огня передан энергичным «пожрал». Поскольку объект прямо не назван, «часть стана» делает русскую фразу грамматически полной, не утверждая определённо, были ли уничтожены люди, шатры или всё находившееся там.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменяющий его титул.
- issue: Связь огня с Яхве
  choice: Огонь Яхве
  alternative: огонь от Яхве
  rationale: Сохранена неоднозначная еврейская генитивная конструкция; вариант происхождения приведён в сноске, а прямая связь огня с Божьим судом не смягчена.
- issue: Божий гнев и суд
  choice: воспылал его гнев; огонь… пожрал
  alternative: он разгневался; огонь уничтожил
  rationale: Сохранены напряжённые образы жара и пожирающего огня, присутствующие в исходном тексте, без богословского смягчения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. «Стан» выбран как привычное библейское обозначение походного лагеря; «роптать» точно передаёт недовольную жалобу и остаётся понятным современному читателю. Короткие предложения сохраняют последовательность и резкость суда.
