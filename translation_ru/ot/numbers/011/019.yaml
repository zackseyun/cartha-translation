lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Повторяющееся отрицание сохранено перед каждым сроком, чтобы передать риторическое нарастание еврейского текста.
- source_word: יוֹם אֶחָד
  choice: один день
  rationale: Прямой перевод, естественный по-русски и сохраняющий счётную последовательность.
- source_word: תֹּאכְלוּ/ן
  choice: вы будете есть
  rationale: Форма Qal imperfect 2-го лица множественного числа в данном возвещении естественно передаётся будущим временем.
- source_word: יוֹמָיִם
  choice: два дня
  rationale: Двойственное число прямо обозначает два дня.
- source_word: חֲמִשָּׁה יָמִים
  choice: пять дней
  rationale: Прямой перевод сохраняет нарастающий числовой ряд.
- source_word: עֲשָׂרָה יָמִים
  choice: десять дней
  rationale: Прямой перевод сохраняет риторическое построение.
- source_word: עֶשְׂרִים יוֹם
  choice: двадцать дней
  rationale: После числительного в русском нормативно употребляется родительный падеж множественного числа.
- source_word: וְ
  choice: и
  rationale: Повторное וְ перед отрицательными членами ряда естественно передаётся русским «и»; это также сохраняет формальную структуру оригинала.
