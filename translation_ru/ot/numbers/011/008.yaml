  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: ru
  text: Народ ходил повсюду и собирал её, молол на жерновах или толок в ступе, варил в горшке и делал из неё лепёшки. На вкус она была как насыщенное масло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свежее масло». Еврейское выражение לְשַׁד הַשָּׁמֶן трудно для однозначного перевода; вероятно, оно указывает на насыщенность, сочность или свежесть масла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: расходился
  rationale: Глагол обозначает движение по местности туда и сюда; несовершенный вид в русском естественно передаёт обычное, повторяющееся действие народа при сборе манны.
- source_word: לָקְטוּ
  choice: собирал
  rationale: Обычный глагол собирания урожая или лежащих предметов; в контексте манны звучит ясно и естественно.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: молол на жерновах
  rationale: רֵחַיִם обозначает ручные жернова; русское выражение сохраняет конкретное орудие и инструментальное значение предлога.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: толок в ступе
  rationale: Устойчивое русское сочетание точно передаёт размельчение ударами в ступе.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: варил в горшке
  rationale: בשל может означать варить или готовить, а פָּרוּר — сосуд для приготовления пищи; выбран конкретный и контекстуально вероятный смысл без излишней детализации.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: делал из неё лепёшки
  rationale: עֻגוֹת — лепёшки, обычно округлой формы; выражение естественно передаёт превращение собранной манны в готовую пищу.
- source_word: טַעְמוֹ
  choice: вкус её
  rationale: Прямое и обычное соответствие существительному со значением вкуса.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: жирного масла
  rationale: Редкое לְשַׁד выражает сочность, насыщенность или жирность; перевод сохраняет образ насыщенного масла, а лексическая неуверенность отмечена в сноске.
