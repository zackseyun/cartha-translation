translation_notes:
  register: Современный литературный русский язык с конкретной бытовой лексикой. Единственное число «народ … собирал» сохраняет коллективный субъект. Цепочка несовершенных глаголов передаёт обычные повторявшиеся действия. Местоимение «её» относится к манне, грамматически подразумеваемой из контекста.
