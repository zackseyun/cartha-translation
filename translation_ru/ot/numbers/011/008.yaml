  source_fidelity: 'Основная последовательность действий передана точно: народ ходил по местности, собирал манну, молол её на жерновах или толок в ступе, варил в сосуде и делал лепёшки. Обычные повторявшиеся действия естественно выражены несовершенным видом. Формулировка «расходился» слабее передаёт שָׁטוּ («ходил туда и сюда, бродил»), а «жирное масло» в современном русском звучит тавтологично и стилистически неудачно для трудного לְשַׁד הַשָּׁמֶן.'
