source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: ru
  text: 'целый месяц — пока мясо не полезет у вас из ноздрей и не станет для вас отвратительным[a], потому что вы отвергли Яхве, который пребывает среди вас, и плакали перед Ним, говоря: «Зачем мы вышли из Египта?»»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не станет для вас мерзостью»; «станет вам омерзительным». Редкое еврейское слово передаёт сильное отвращение.'
    reason: 'Лексическая альтернатива для זָרָא: передаёт оттенки омерзения и отвращения, не конкретизируя их как тошноту.'
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: целый месяц
  rationale: Еврейское выражение буквально означает «до месяца дней» и обозначает полный месяц; выбран естественный русский эквивалент с сохранением усиления длительности.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: мясо не полезет у вас из ноздрей
  rationale: В контексте подразумевается мясо из предыдущих стихов. Глагол передан ярким разговорно-наглядным «полезет», а множественное אַפְּכֶם — словом «ноздрей», что сохраняет гротескный телесный образ.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: не станет вам отвратительно
  rationale: Редкое זָרָא выражает сильное отвращение; формулировка естественна по-русски и не устраняет лексическую неопределённость, отмеченную в сноске.
- source_word: יַעַן כִּי
  choice: Так будет за то, что
  rationale: Оборот вводит основание наказания. Самостоятельное русское предложение ясно передаёт причинно-возмездную связь и естественно соединяется с предыдущей фразой.
- source_word: מְאַסְתֶּם
  choice: вы отвергли
  rationale: Глагол означает отвергнуть, пренебречь или презреть; «отвергли» сохраняет смысл сознательного отказа без избыточного усиления эмоционального оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: который пребывает среди вас
  rationale: Фраза говорит о присутствии Яхве внутри общины; «среди вас» не создаёт ложного впечатления о внутреннем присутствии в каждом отдельном человеке.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: и плакали перед Ним
  rationale: Сохранены как значение плача, так и образ действия перед лицом Бога.
- source_word: לָמָּה זֶּה
  choice: Зачем
  rationale: В данном вопросе современное русское «зачем» естественно выражает сетование о самом исходе и передаёт усиленную недовольную интонацию без добавления отдельного наречия.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: мы вышли из Египта
  rationale: Буквально и естественно передаёт глагол исхода יצא и сохраняет связь с событием Исхода.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер отвержения Яхве
  choice: вы отвергли Яхве
  alternative: вы презрели Яхве
  rationale: «Отвергли» передаёт серьёзность отказа от присутствующего среди народа Бога, не усиливая текст до однозначного указания на чувство презрения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Начальная строчная буква отражает продолжение предложения из предыдущего стиха. Яркий образ «полезет из ноздрей» сохранён; подразумеваемое мясо названо для ясности. Местоимение «Ним» оформлено по принятой русской традиции благоговейного написания.
