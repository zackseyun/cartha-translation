- from: 'целый месяц — пока мясо не полезет у вас из ноздрей и не станет вам отвратительно[a]. Так будет за то, что вы отвергли Яхве, который пребывает среди вас, и плакали перед Ним, говоря: «Зачем мы вышли из Египта?»»'
  to: 'целый месяц — пока мясо не полезет у вас из ноздрей и не станет для вас отвратительным[a], потому что вы отвергли Яхве, который пребывает среди вас, и плакали перед Ним, говоря: «Зачем мы вышли из Египта?»»'
  rationale: Исправлена синтаксическая форма сказуемого и заменён несколько интерпретирующий причинный оборот на прямое «потому что». Сноска приведена в соответствие с возможными значениями редкого еврейского слова. Внешняя закрывающая кавычка сохранена, поскольку стих продолжает прямую речь, начатую в предшествующем контексте; внутренние кавычки оформляют цитируемую жалобу народа.
