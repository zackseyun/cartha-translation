  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: ru
  text: Мы помним рыбу, которую ели в Египте даром[a], огурцы, дыни, лук-порей, репчатый лук и чеснок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесплатно», «без платы». Говорящие вспоминают Египет с точки зрения своей нынешней жалобы, несмотря на то что там они были рабами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Мы помним
  rationale: Форма перфекта 1-го лица множественного числа в прямой речи передаёт актуальное воспоминание; настоящее время естественно по-русски в контексте жалобы.
- source_word: הַדָּגָה
  choice: рыбу
  rationale: Существительное имеет собирательное значение и обозначает рыбу как пищу; форма единственного числа естественна в русском.
- source_word: אֲשֶׁר נֹאכַל
  choice: которую ели
  rationale: Имперфект в контексте прошлого выражает повторявшееся действие; несовершенный вид «ели» естественно передаёт привычность.
- source_word: בְּמִצְרַיִם
  choice: в Египте
  rationale: Прямое и естественное соответствие обстоятельству места.
- source_word: חִנָּם
  choice: даром
  rationale: Передаёт значение «бесплатно, без платы» и сохраняет субъективную риторику жалобы, не устраняя иронию на фоне египетского рабства.
- source_word: הַקִּשֻּׁאִים
  choice: огурцы
  rationale: Общепринятое обозначение данного овоща.
- source_word: הָאֲבַטִּחִים
  choice: дыни
  rationale: Слово обозначает разновидность бахчевых; «дыни» сохраняет родовое значение без неоправданного уточнения вида.
- source_word: הֶחָצִיר
  choice: лук-порей
  rationale: В перечне продуктов слово правдоподобно обозначает огородную зелень, традиционно понимаемую как лук-порей, а не траву или сено.
- source_word: הַבְּצָלִים
  choice: репчатый лук
  rationale: Точное и понятное современному читателю название, позволяющее отличить его от упомянутого рядом лука-порея.
- source_word: הַשּׁוּמִים
  choice: чеснок
  rationale: Стандартное лексическое соответствие.
theological_decisions:
- issue: Передача חִנָּם с учётом рабства Израиля в Египте
  choice: даром
  alternative: бесплатно; без платы
  rationale: Стих воспроизводит жалобу народа с его собственной точки зрения, а не даёт объективной оценке жизни в Египте. Прямой перевод сохраняет риторическое напряжение и иронию, не добавляя толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык; перечисление сохранено компактным и ритмичным. «Даром» понятно и стилистически достойно, а сноска поясняет буквальный диапазон и контекстуальную иронию.
