base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: ru
  text: И вышел Моисей, и сказал народу слова Яхве. Он собрал семьдесят мужчин из числа старейшин народа и поставил[a] их вокруг шатра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «велел им встать». Еврейский глагол буквально означает «сделал так, чтобы они стояли».'
    reason: lexical_alternative
  - marker: b
    text: Евр. «шатёр»; по контексту, вероятно, имеется в виду шатёр встречи.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא обозначает выход из прежнего места; «вышел» прямо и естественно передаёт повествовательную форму.
- source_word: וַיְדַבֵּר אֶל הָעָם אֵת דִּבְרֵי יְהוָה
  choice: сказал народу слова Яхве
  rationale: Перевод сохраняет конкретное выражение «слова Яхве», не заменяя его более отвлечённым «весть» или «послание».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол אסף в данном контексте означает собрать людей вместе.
- source_word: שִׁבְעִים אִישׁ
  choice: семьдесят мужчин
  rationale: אִישׁ после числительного имеет собирательно-распределительное употребление и здесь относится к мужчинам из числа старейшин.
- source_word: מִזִּקְנֵי הָעָם
  choice: из числа старейшин народа
  rationale: Формулировка передаёт частичное значение предлога מִן и общественную роль זִקְנֵי, а не просто преклонный возраст.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: поставил их
  rationale: Каузативная порода глагола עמד буквально означает «заставил стоять» или «поставил»; русский вариант краток и естественен.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: вокруг шатра
  rationale: Перевод следует буквальному «вокруг шатра», не добавляя отсутствующее здесь определение «собрания».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Гендерная передача אִישׁ в выражении שִׁבְעִים אִישׁ
  choice: семьдесят мужчин
  alternative: семьдесят человек
  rationale: Контекст выбора из старейшин и мужской термин אִישׁ позволяют сохранить явное указание на мужчин, не нейтрализуя его.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «И» сохраняет связь с последовательным еврейским повествованием; дальнейшие союзы переданы естественно для русского синтаксиса.
