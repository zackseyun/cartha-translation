  footnotes:
  - marker: a
    text: 'Или, по смыслу в контексте пищи: «мы изголодались». Еврейское נֶפֶשׁ может означать «душа», «жизнь», а в контексте пищи — внутреннее желание или потребность в пище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сочетание союза с наречием времени вводит нынешнее положение в противопоставлении прежнему; «А теперь» естественно передаёт этот переход по-русски.
- source_word: נַפְשֵׁנוּ
  choice: наша душа
  rationale: Основное значение נֶפֶשׁ — «душа, жизнь, живое существо»; в контексте пищи слово может обозначать аппетит или внутреннее желание. Буквальный образ сохранён в тексте, а контекстуальное значение отмечено в сноске.
- source_word: יְבֵשָׁה
  choice: иссохла
  rationale: Прилагательное יָבֵשׁ описывает сухое, иссохшее состояние. «Иссохла» сохраняет образ и звучит естественнее, чем буквальное «суха» в сочетании со словом «душа».
- source_word: אֵין כֹּל
  choice: ничего нет
  rationale: Конструкция отрицания с כֹּל означает полное отсутствие. Русское «ничего нет» передаёт это категорическое утверждение без ненужного усиления.
- source_word: בִּלְתִּי אֶל
  choice: кроме
  rationale: 'Конструкция выражает исключение: им не остаётся ничего, кроме одного вида пищи.'
- source_word: הַמָּן
  choice: манны
  rationale: Определённый артикль указывает на уже известную манну; в русском контексте определённость ясна и без указательного «этой», которого в еврейском тексте нет.
- source_word: עֵינֵינוּ
  choice: перед нашими глазами
  rationale: Сохранён конкретный образ того, что постоянно находится у них на виду; оборот естественен для современного литературного русского языка.
theological_decisions:
- issue: Значение נֶפֶשׁ в жалобе о пище
  choice: «душа» в основном тексте с пояснением «аппетит» в сноске
  alternative: «аппетит» в основном тексте
  rationale: Еврейское слово сохраняет более широкий образ внутреннего существа человека, но в пищевом контексте допускает значение «аппетит». Перевод не должен без необходимости устранять эту смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного образного строя еврейского текста. «Иссохла» передаёт жалобный, несколько возвышенный тон, оставаясь понятным обычному читателю.
