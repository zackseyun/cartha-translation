  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: ru
  text: 'Но Моисей сказал: «Народ, среди которого я нахожусь, насчитывает шестьсот тысяч пеших[a], а Ты сказал: „Я дам им мяса, и они будут есть его целый месяц[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шестьсот тысяч пеших мужчин». Еврейское выражение может обозначать людей, передвигающихся пешком, либо пеших воинов.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «месяц дней» — еврейское выражение со значением «полный месяц».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Моисей сказал
  rationale: Последовательная форма продвигает повествование, а союз «но» естественно передаёт возражение Моисея в ответ на предшествующее обещание Бога.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: шестьсот тысяч
  rationale: Прямое соответствие еврейскому количественному выражению.
- source_word: רַגְלִי הָעָם
  choice: народа… шестьсот тысяч пеших
  rationale: «Пеших» сохраняет связь слова רַגְלִי с передвижением пешком и не вводит прямо отсутствующее в основном тексте уточнение «мужчин»; возможный военный или учётный оттенок отмечен в сноске.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: среди которого я нахожусь
  rationale: Естественно и точно передаёт значение «в его среде / среди него», сохраняя указание Моисея на своё пребывание среди народа.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: а Ты говоришь
  rationale: Явное местоимение אַתָּה имеет контрастное ударение. Настоящее время по-русски естественно передаёт только что прозвучавшие слова, сохраняющие силу в данный момент.
- source_word: בָּשָׂר
  choice: мяса
  rationale: В контексте речь идёт о мясе как пище; это современное и точное русское соответствие.
- source_word: אֶתֵּן לָהֶם
  choice: Я дам им
  rationale: Передаёт обещание или заявленное будущее действие от первого лица.
- source_word: וְאָכְלוּ
  choice: и они будут есть его
  rationale: Сочинённое будущее действие передано прямо; местоимение «его» естественно восполняет объект в русском языке.
- source_word: חֹדֶשׁ יָמִים
  choice: целый месяц
  rationale: Еврейская идиома буквально означает «месяц дней», то есть полный месяц. В основном тексте выбран естественный русский эквивалент, буквальная форма приведена в сноске.
theological_decisions:
- issue: Характер слов Моисея
  choice: Передать контраст союзами «но» и «а», не добавляя оценки веры или неверия Моисея
  alternative: Явно назвать его слова сомнением либо неверием
  rationale: Сам стих выражает недоумение или возражение через контекст и контраст, но не даёт здесь прямой богословской характеристики состояния Моисея.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Обращение к Богу оформлено с прописной буквы («Ты») по устойчивой русской библейской традиции; синтаксис сохраняет числовой акцент и контраст исходного текста, избегая неестественного буквального выражения «месяц дней» в основном тексте.
