  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: ru
  text: Я сойду и буду говорить с тобой там. Я возьму часть духа[a], пребывающего на тебе, и возложу её на них. Они будут вместе с тобой нести бремя народа, и тебе не придётся нести его одному.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «часть Духа». Еврейское слово ру́ах может означать «дух», «ветер» или «дыхание»; здесь речь идёт о дарованной Богом силе для руководства народом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: Я сойду
  rationale: Сохраняет буквальный пространственный и теофанический образ глагола ירד и естественно звучит в современной русской речи.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: и буду говорить с тобой там
  rationale: Передаёт обычное значение דבר с עם и сохраняет пространственно значимое «там».
- source_word: וְאָצַלְתִּי מִן הָרוּחַ
  choice: Я возьму от духа
  rationale: Редкий глагол אצל описывает передачу от того, что пребывает на Моисее; формулировка не утверждает ни уменьшения дара у Моисея, ни его отсутствия.
- source_word: הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: духа, который на тебе
  rationale: «Дух» по контексту обозначает дарованное Богом наделение силой для руководства. Строчная буква сохраняет грамматическую неопределённость древнееврейского текста; пояснение дано в сноске.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: и возложу на них
  rationale: «Возложу» естественно передаёт שׂים и сохраняет образ пребывания духа «на» людях.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: Они будут вместе с тобой нести бремя народа
  rationale: Сохраняет словесную связь между נשא («нести») и מַשָּׂא («бремя»), передавая совместную ответственность за народ.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: и тебе не придётся нести его одному
  rationale: Естественно выражает ожидаемый результат разделения бремени; местоимение «его» явно отсылает к бремени.
theological_decisions:
- issue: Обозначает ли רוּחַ Божий Дух или дух как дарованную свыше силу
  choice: дух
  alternative: Дух
  rationale: Контекст ясно указывает на исходящее от Бога наделение силой для руководства, однако в древнееврейском письме нет различия прописной и строчной букв. Строчная буква с пояснительной сноской сохраняет эту формальную неоднозначность и не сводит смысл к личному настрою Моисея.
- issue: Подразумевает ли וְאָצַלְתִּי уменьшение духа на Моисее
  choice: 'не уточнять: «возьму от духа»'
  alternative: «уделю часть духа» или «отниму часть духа»
  rationale: Текст говорит о передаче от духа, пребывающего на Моисее, но прямо не определяет, уменьшается ли вследствие этого дар Моисея.
translation_notes:
  register: Современный литературный русский язык; достоинство библейской речи сохранено без архаизмов. Повтор «нести — бремя — нести» намеренно воспроизводит корневую и смысловую связь исходного текста.
