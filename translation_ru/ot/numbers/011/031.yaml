source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: ru
  text: Тогда от Яхве поднялся ветер[a], пригнал от моря перепелов и рассеял их вокруг стана — примерно на день пути в одну сторону и на день пути в другую, по всей окружности стана, — примерно в двух локтях над поверхностью земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Яхве вышел дух». Здесь контекст убедительно указывает на ветер, поскольку он приносит перепелов от моря.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «примерно в двух локтях над лицом земли». Эти слова могут описывать высоту, на которой перепела летели или были рассеяны, а не толщину слоя птиц на земле.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: ветер
  rationale: רוּחַ может означать «ветер», «дыхание» или «дух»; здесь физическое перемещение перепелов от моря решительно поддерживает значение «ветер», при этом иной возможный смысл отмечен в сноске.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: от Яхве поднялся
  rationale: נָסַע выражает начало движения; сочетание «поднялся ветер» естественно по-русски и сохраняет указание на Яхве как источник ветра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: וַיָּגָז שַׂלְוִים
  choice: пригнал ... перепелов
  rationale: Редкий глагол גוז в данном контексте обозначает действие ветра, принесшего птиц; «пригнал» передаёт направленное и сильное движение, не вводя неясного буквального значения «отрезал».
- source_word: מִן הַיָּם
  choice: от моря
  rationale: Сохранено прямое географическое значение исходной фразы без замены моря указанием стороны света.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: рассеял их вокруг стана
  rationale: נטשׁ допускает значения «раскинуть», «оставить», «бросить». Контекст последующего описания пространства вокруг стана поддерживает распределение птиц по местности; «вокруг» не создаёт впечатления, будто они упали прямо на шатры.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: примерно на день пути в одну сторону и на день пути в другую
  rationale: Передана повторная структура еврейского выражения и приблизительная протяжённость от стана в противоположных направлениях.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: по всей окружности стана
  rationale: Фраза выражает всеохватное распространение вокруг лагеря и уточняет предшествующее описание его протяжённости.
- source_word: וּכְאַמָּתַיִם
  choice: примерно в двух локтях
  rationale: Сохранена древняя мера длины и приблизительная сила приставки כְּ.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: над поверхностью земли
  rationale: Фраза буквально относится к «лицу земли»; «над поверхностью земли» естественно выражает пространственное отношение, но не устраняет неоднозначность всей фразы о двух локтях, отмеченную в сноске.
theological_decisions:
- issue: Источник и действие ветра
  choice: Ветер исходит от Яхве и служит средством, которым перепела принесены от моря.
  alternative: 'Можно передать более динамично: Яхве послал ветер и посредством него принёс перепелов.'
  rationale: Еврейский текст прямо связывает происхождение ветра с Яхве, сохраняя одновременно Божье действие и природное средство без дальнейшего объяснения причинности.
- issue: Значение רוּחַ
  choice: В основном тексте — «ветер».
  alternative: «Дух».
  rationale: Контекст переноса перепелов от моря сильнее поддерживает физический ветер, однако лексическая многозначность не скрыта и указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Стан» выбран как краткое и привычное в библейском повествовании обозначение лагеря; синтаксис упрощён для ясности, но повтор и пространственная протяжённость оригинала сохранены. Оба маркера сносок [a] и [b] присутствуют в основном тексте.
