lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: Из Киброт-Гаттаавы
  rationale: В повествовании это название места, поэтому оно передано принятой в русской библейской традиции транслитерацией. Его прозрачное древнееврейское значение сохранено в сноске.
- source_word: נָסְע֥וּ
  choice: отправился
  rationale: В описаниях пути глагол означает сняться с места и двинуться дальше. «Отправился» естественно передаёт начало нового перехода.
- source_word: הָ/עָ֖ם
  choice: народ
  rationale: Слово обозначает израильскую общину как единое целое; поэтому сказуемое согласовано с собирательным существительным в единственном числе.
- source_word: חֲצֵר֑וֹת
  choice: Хацерот
  rationale: Название места передано транслитерацией, отражающей древнееврейское произношение.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: и остановился в Хацероте
  rationale: 'Буквально: «и были в Хацероте». В контексте перечня переходов эта конструкция обозначает остановку или пребывание на стоянке; выбран естественный русский эквивалент без уточнения длительности.'
