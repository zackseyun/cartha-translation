base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: ru
  text: 'Откуда мне взять мяса, чтобы дать всему этому народу? Ведь они плачут передо мной[a] и говорят: «Дай нам мяса, чтобы мы поели».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они плачут, обращаясь ко мне»; возможно также: «они своим плачем давят на меня». Буквально еврейское выражение означает: «они плачут на меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: Откуда мне взять
  rationale: Вопросительное выражение указывает на источник, а местоименная конструкция — на невозможность Моисея самому достать требуемое; по-русски это естественно передаётся оборотом «Откуда мне взять».
- source_word: בָּשָׂר
  choice: мяса
  rationale: В контексте пищи слово означает мясо животных, а не «плоть».
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: чтобы дать всему этому народу
  rationale: Инфинитив передаёт цель; עָם сохраняется как собирательное единственное «народ».
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание жалобы Моисея; «ведь» естественно выражает причинно-пояснительную связь.
- source_word: יִבְכּוּ עָלַי
  choice: они плачут передо мной
  rationale: Буквально предлог עַל означает «на/над», но здесь описывает плач, направленный на Моисея и оказывающий на него давление. Основной текст избегает неестественного буквального оборота, а неоднозначность отмечена в сноске.
- source_word: לֵאמֹר
  choice: и говорят
  rationale: Инфинитив вводит содержание повторяющегося требования; настоящее время согласуется с продолжающимся действием «плачут».
- source_word: תְּנָה לָּנוּ
  choice: Дай нам
  rationale: Прямое и естественное соответствие повелительной форме с местоименным дополнением.
- source_word: וְנֹאכֵלָה
  choice: чтобы мы поели
  rationale: Когортатив выражает желаемый результат просьбы. «Поели» естественно передаёт направленное желание совершить действие, не превращая его в простое будущее.
