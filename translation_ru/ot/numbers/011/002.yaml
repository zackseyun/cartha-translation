  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: ru
  text: Народ воззвал к Моисею, и Моисей помолился Яхве, и огонь утих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огонь пошёл на убыль»; букв. «огонь опустился». Еврейский глагол указывает на то, что огонь ослаб или утих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: воззвал
  rationale: Глагол צעק обозначает настойчивый крик о помощи или вопль в бедствии. «Воззвал» передаёт направленное к Моисею настоятельное обращение, сохраняя достойный повествовательный стиль.
- source_word: הָעָם
  choice: народ
  rationale: В данном повествовании עם собирательно обозначает израильский народ; «народ» — естественное и точное русское соответствие.
- source_word: אֶל מֹשֶׁה
  choice: к Моисею
  rationale: Предлог אֶל выражает направленность обращения к человеку; по-русски это естественно передаётся сочетанием «к Моисею».
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Форма хитпаэль глагола פלל обычно означает «молиться». Контекст подразумевает ходатайство, но прямое «помолился» не добавляет отсутствующей в самом глаголе конкретизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени «Яхве» сохраняет отличие имени от титула и следует непосредственно еврейскому тексту.
- source_word: וַתִּשְׁקַע
  choice: утих
  rationale: Глагол שקע буквально передаёт погружение или спад. В сочетании с огнём «утих» естественно выражает прекращение его действия, не утверждая прямо, что он был мгновенно потушен.
- source_word: הָאֵשׁ
  choice: огонь
  rationale: Существительное אֵשׁ прямо означает «огонь» и относится к огню, упомянутому в предыдущем стихе.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. «Яхве» передаёт его как имя, а не заменяет титулом; форма «Иегова» отражает более позднее смешение согласных тетраграмматона с гласными традиционного чтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Воззвал» сохраняет силу обращения в бедствии, а тире перед заключительной частью подчёркивает непосредственный результат молитвы. Маркер сноски поставлен при словах об огне, к которым относится лексическая альтернатива.
