  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: ru
  text: 'И Моисей сказал Яхве: «Почему Ты так плохо обошёлся со Своим рабом[a]? Почему я не обрёл благоволения в Твоих глазах[b], чтобы Ты возложил на меня бремя всего этого народа?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Почему Ты причинил зло Своему рабу?» Еврейский глагол резко выражает жалобу Моисея на постигшее его зло или бедствие.'
    reason: lexical_alternative
  - marker: b
    text: «Обрести благоволение в чьих-либо глазах» — еврейское выражение со значением «снискать чью-либо благосклонность».
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией Тетраграмматона, а не заменяет его титулом.
- source_word: הֲרֵעֹתָ
  choice: Ты так плохо обошёлся
  rationale: Естественно передаёт каузативную форму корня רעע и резкую жалобу Моисея, не устраняя более буквальный оттенок «причинил зло», указанный в сноске.
- source_word: לְעַבְדֶּךָ
  choice: со Своим рабом
  rationale: В данном обращении עבד — смиренное самообозначение Моисея перед Богом; «раб» сохраняет библейскую социальную и религиозную окраску.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: я не обрёл благоволения в Твоих глазах
  rationale: Сохраняет прозрачный для русского читателя еврейский образ и значение получения чьей-либо благосклонности.
- source_word: לָשׂוּם
  choice: раз Ты возложил
  rationale: Передаёт смысловую связь между отсутствием благоволения и возложением бремени; «раз» естественно выражает основание жалобы, не превращая инфинитив в отдельное действие.
- source_word: מַשָּׂא
  choice: бремя
  rationale: Сохраняет метафору тяжёлой ноши и эмоциональную силу жалобы Моисея.
- source_word: כָּל הָעָם הַזֶּה
  choice: всего этого народа
  rationale: Естественно сохраняет единственное число собирательного существительного «народ» и значение охвата всей общины.
- source_word: עָלָי
  choice: на меня
  rationale: Точно и естественно продолжает метафору возложенного бремени.
theological_decisions:
- issue: Может ли הֲרֵעֹתָ при Боге как субъекте означать причинение зла
  choice: «Ты так плохо обошёлся» с сохранением буквальной возможности в сноске
  alternative: «Ты причинил зло»
  rationale: Форма допускает буквальное понимание «сделал зло/плохое», однако в контексте это слова мучительной жалобы Моисея. Основной текст передаёт его переживание дурного обращения, а сноска сохраняет подлинную резкость и богословское напряжение оригинала.
- issue: Связь לָשׂוּם с предшествующим вопросом об отсутствии благоволения
  choice: «раз Ты возложил»
  alternative: «чтобы возложить» / «что Ты возложил»
  rationale: Еврейский инфинитив допускает оттенок результата или основания жалобы. Русское «раз» ясно показывает, что возложенное бремя служит для Моисея свидетельством отсутствия благоволения, не утверждая отдельной доктринальной причинности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Формулировка сохраняет эмоциональную резкость жалобы Моисея, но остаётся понятной обычному читателю.
