id: NUM.11.12
reference: Numbers 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: ru
  text: 'Разве я носил во чреве весь этот народ? Разве я родил его, чтобы Ты говорил мне: «Неси его у себя на груди, как воспитатель[a] несёт грудного младенца, в землю, которую Ты клятвенно обещал его предкам»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «няня», «попечитель»; еврейское слово обозначает человека, которому доверено заботиться о ребёнке и растить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיתִי
  choice: носил во чреве
  rationale: Глагол הרה обозначает зачатие или беременность. Русское «носил во чреве» естественно продолжает материнский образ и не создаёт мужского оттенка, возможного у слова «зачал».
- source_word: כָּל הָעָם הַזֶּה
  choice: весь этот народ
  rationale: Сохраняет собирательное единственное число עָם и звучит естественно по-русски.
- source_word: יְלִדְתִּיהוּ
  choice: я родил его
  rationale: Сохраняет образ рождения и местоимение единственного числа, относящееся к народу как к одному ребёнку.
- source_word: כִּי תֹאמַר אֵלַי
  choice: чтобы Ты говорил мне
  rationale: Передаёт связь между риторическим вопросом и последующим повелением без искусственного причинного уточнения.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: неси его у себя на груди
  rationale: Передаёт повеление нести ребёнка в חֵיק — у груди, на лоне; выражение понятно современному читателю и сохраняет телесную близость образа.
- source_word: הָאֹמֵן
  choice: воспитатель
  rationale: Причастие обозначает человека, которому доверено растить и носить ребёнка. «Воспитатель» сохраняет мужскую грамматическую форму и не сужает значение до кормящей женщины.
- source_word: הַיֹּנֵק
  choice: грудного младенца
  rationale: Обозначает ребёнка, который ещё питается грудным молоком; выбранное выражение ясно и современно.
- source_word: עַל הָאֲדָמָה
  choice: в землю
  rationale: В контексте движения предлог עַל указывает на землю как на цель пути.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: которую Ты клятвенно обещал его предкам
  rationale: Передаёт клятвенный характер обещания и сохраняет единственное число местоимения, согласованное с собирательным словом «народ».
theological_decisions:
- issue: Собирательное единственное число в обозначении Израиля
  choice: Сохранены формы единственного числа «его» и «его предкам»
  alternative: 'Употребить множественное число: «их», «их предкам»'
  rationale: Еврейский текст последовательно представляет народ как одного ребёнка. В русском языке слово «народ» также грамматически допускает и поддерживает такое согласование.
- issue: Образ лица, несущего младенца
  choice: воспитатель
  alternative: няня; кормилица; приёмный отец; опекун
  rationale: הָאֹמֵן обозначает попечителя ребёнка, но не уточняет однозначно его конкретную роль. Основной текст не должен неоправданно сводить образ к кормлению грудью или к юридической опеке.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выражение «носил во чреве» намеренно сохраняет материнский образ оригинала; обращение к Богу оформлено с прописной буквы.
