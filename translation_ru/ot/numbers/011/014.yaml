  text: לֹֽא אוּכַ֤ל אָנֹכִי֙ לְ/בַדִּ֔/י לָ/שֵׂ֖את אֶת כָּל הָ/עָ֣ם הַ/זֶּ֑ה כִּ֥י כָבֵ֖ד מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: ru
  text: 'Не могу я один нести весь этот народ: он слишком тяжёл для меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי לְבַדִּי
  choice: Не могу я один
  rationale: Сохраняет усиленное подлежащим אָנֹכִי и выражением לְבַדִּי значение личной неспособности Моисея справиться в одиночку; порядок слов звучит естественно и выразительно по-русски.
- source_word: לָשֵׂאת אֶת־כָּל־הָעָם הַזֶּה
  choice: нести весь этот народ
  rationale: Буквально передаёт метафору נשׂא «нести», не сводя её только к управлению или руководству.
- source_word: כִּי כָבֵד מִמֶּנִּי
  choice: он слишком тяжёл для меня
  rationale: Передаёт образ тяжести и сравнительную конструкцию «тяжелее моих сил» естественным русским оборотом, сохраняя метафорическую связь с «нести».
theological_decisions:
- issue: Характер признания Моисея
  choice: Сохранено прямое признание личной неспособности нести народ одному.
  alternative: «Мне одному не справиться с заботой обо всём этом народе».
  rationale: Исходный текст подчёркивает «я один» и использует метафору несения; перевод не добавляет оценки веры Моисея и не уточняет вид возложенного на него служения.
translation_notes:
  register: Современный литературный русский язык; краткая, эмоционально выразительная реплика. Двоеточие естественно передаёт причинную связь כִּי и подчёркивает повторяющийся образ тяжести.
