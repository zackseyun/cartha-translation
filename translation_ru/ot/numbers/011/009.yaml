lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Когда ... сходила
  rationale: Сочетание союза и предлога с инфинитивом образует придаточное времени. «Когда ... сходила» естественно передаёт эту конструкцию и обычное повторяющееся действие в прошлом.
- source_word: הַטַּל
  choice: роса
  rationale: Прямое соответствие еврейскому существительному; определённость в русском языке понятна из контекста и не требует отдельного показателя.
- source_word: עַל הַמַּחֲנֶה
  choice: на стан
  rationale: Предлог עַל здесь обозначает направленность или расположение сверху, а «стан» — уместное и понятное обозначение лагеря Израиля в повествовании Пятикнижия.
- source_word: לָיְלָה
  choice: ночью
  rationale: Наречная форма естественно передаёт еврейское обозначение времени «ночью».
- source_word: יֵרֵד
  choice: сходила
  rationale: Имперфект в повествовательном контексте описывает обычное повторяющееся действие. Выбор того же русского глагола, что и для росы, сохраняет лексический параллелизм оригинала.
- source_word: הַמָּן
  choice: манна
  rationale: Традиционное и общеупотребительное русское название известной пищи; определённость устанавливается контекстом.
- source_word: עָלָיו
  choice: на него
  rationale: Местоименный суффикс мужского рода естественно соотносится со словом «стан» и сохраняет местоименную, не уточнённую сверх текста формулировку оригинала.
