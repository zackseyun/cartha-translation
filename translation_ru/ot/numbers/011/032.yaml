base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: ru
  text: Народ поднялся и весь тот день, всю ночь и весь следующий день собирал перепелов. Тот, кто собрал меньше всех, собрал десять хомеров[a][b]. Они разложили их для себя повсюду вокруг стана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хомер — крупная древняя мера сыпучих тел. Её точный современный эквивалент не вполне определён; здесь подчёркивается, что даже собравший меньше всех набрал чрезвычайно много.
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «десять ослиных вьюков», если понимать חֳמָרִים не как название стандартной меры, а в связи с родственным словом «осёл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Народ поднялся
  rationale: Сохраняет образное значение קום и энергичное начало действия, не сводя выражение к нейтральному «начал».
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: весь тот день, всю ночь и весь следующий день
  rationale: Передаёт подчёркнутую непрерывность и трёхчастный ритм еврейского выражения естественным современным русским языком.
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: собирал перепелов
  rationale: «Собирать» прямо передаёт אָסף; единственное число сказуемого согласовано с собирательным «народ», а множественное «перепелов» естественно обозначает множество птиц.
- source_word: הַמַּמְעִיט
  choice: тот, кто собрал меньше всех
  rationale: 'Контекстуально раскрывает эллиптическое значение причастия: человек, собравший наименьшее количество.'
- source_word: עֲשָׂרָה חֳמָרִים
  choice: десять хомеров
  rationale: Сохраняет стандартное название древней крупной меры сыпучих тел и избегает ложной точности; возможное этимологическое прочтение вынесено в примечание.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: Они разложили их для себя
  rationale: Передаёт действие שטח и дательный оборот לָהֶם, не добавляя не названной в тексте цели — например, сушки или обработки.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: повсюду вокруг стана
  rationale: «Повсюду вокруг» передаёт охват окружающего пространства, а «стан» сохраняет достоинство библейского повествования и остаётся понятным в контексте странствующего народа.
