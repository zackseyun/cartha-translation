id: NUM.11.16
reference: Numbers 11:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Собери Мне[a] семьдесят мужчин из старейшин Израиля — тех, о ком ты знаешь, что они старейшины народа и его должностные лица[b]. Приведи их к шатру встречи[c], и пусть они предстанут там вместе с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Собери для Меня».'
    reason: Лексическая альтернатива для אֶסְפָה לִּי.
  - marker: b
    text: 'Или: «надзиратели», «служащие»; еврейское слово обозначает административных должностных лиц, исполнявших распоряжения.'
    reason: Уточнение диапазона значений שֹׁטְרָיו.
  - marker: c
    text: 'Традиционно: «скиния собрания».'
    reason: Указание традиционного русского соответствия выражению אֹהֶל מוֹעֵד.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: אֶסְפָה לִּי
  choice: Собери для Меня
  rationale: Сохраняет значение собирания избранных людей и оттенок еврейского לִּי — «для Меня».
- source_word: שִׁבְעִים אִישׁ
  choice: семьдесят мужчин
  rationale: אִישׁ после числительного употреблено распределительно и в данном контексте обозначает взрослых мужчин, избираемых из руководителей народа.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: из старейшин Израиля
  rationale: Предлог מִן указывает на выбор людей из более широкой группы старейшин.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: тех, о ком ты знаешь, что они
  rationale: Сохраняет явное указание на то, что Моисей уже знает их положение, не устраняя синтаксический акцент оригинала.
- source_word: וְשֹׁטְרָיו
  choice: и его управители
  rationale: שֹׁטֵר обозначает должностное лицо с административными полномочиями; местоименный суффикс относится к народу.
- source_word: וְלָקַחְתָּ אֹתָם
  choice: Приведи их
  rationale: В контексте движения к указанному месту русское «приведи» естественно передаёт значение לקח.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквально и понятно передаёт название священного шатра, не подменяя выражение более широким термином.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: пусть они предстанут там вместе с тобой
  rationale: Форма התיצב выражает не просто пребывание стоя, а явку и занятие своего места перед Яхве.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Смысл предстояния у шатра
  choice: предстанут там вместе с тобой
  alternative: станут там вместе с тобой
  rationale: «Предстанут» сохраняет официальный и сакральный оттенок התיצב, не уточняя сверх текста, перед кем именно они должны предстать.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис слегка приближен к еврейскому ради сохранения акцента на известных Моисею руководителях; архаизмы по возможности устранены.
