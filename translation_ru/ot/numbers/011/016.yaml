  to: 'Тогда Яхве сказал Моисею: «Собери Мне[a] семьдесят мужчин из старейшин Израиля — тех, о ком ты знаешь, что они старейшины народа и его должностные лица[b]. Приведи их к шатру встречи[c], и пусть они предстанут там вместе с тобой».'
