  verdict: revise
  source_fidelity: 'В целом смысл передан точно: Моисей слышит продолжающийся плач, Яхве сильно разгневан, а Моисей отрицательно оценивает происходящее. Однако «плачет по своим родам» в современном русском легко понимается как плач о родах/предках, а не как распределение плачущих по родственным группам. Требуется более ясная передача לְמִשְׁפְּחֹתָיו.'
