  terminology: «Яхве» последовательно передаёт тетраграмматон. «Шатёр» соответствует אָהֶל. «Семейные группы» сохраняет возможный диапазон מִשְׁפָּחָה («семьи», «роды», «кланы») и не навязывает более узкое значение.
  issues:
  - severity: medium
    issue: Двусмысленность оборота «плачет по своим родам».
    rationale: Русское «плакать по кому-либо/чему-либо» обычно означает оплакивать кого-либо или что-либо. Здесь לְמִשְׁפְּחֹתָיו описывает распределение народа по семейным группам, а не предмет плача.
  - severity: low
    issue: Калькированное «в глазах Моисея это было злом».
    rationale: Фраза понятна, но для современного литературного русского тяжеловесна. «Моисей счёл это злом» передаёт тот же отрицательный оценочный смысл; примечание сохраняет буквальную форму идиомы.
