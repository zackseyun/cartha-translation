source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: ru
  text: Моисей услышал, как народ плачет по своим семейным группам[a], каждый у входа в свой шатёр. Гнев Яхве сильно разгорелся, и Моисей счёл это злом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по своим семьям»; «по своим родам». Еврейское слово может обозначать семьи, роды или более широкие родственные группы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это было неугодно Моисею». Буквально: «в глазах Моисея — зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Глагол описывает восприятие Моисеем продолжающегося плача народа; «услышал» естественно передаёт значение формы.
- source_word: בֹּכֶה
  choice: плачет
  rationale: Причастие обозначает продолжающееся действие; настоящее время в придаточной конструкции естественно передаёт эту длительность по-русски.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: по своим родам
  rationale: מִשְׁפָּחָה обозначает родственную группу, семью или род; «по своим родам» сохраняет социальную организацию народа и допускает пояснение альтернативы.
- source_word: אִישׁ
  choice: каждый
  rationale: Дистрибутивное единственное число выделяет отдельных людей в составе народа; русское «каждый» точно и естественно передаёт эту функцию без ненужного сужения до взрослых мужчин.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: у входа в свой шатёр
  rationale: Передаёт пространственный образ входа или проёма шатра и согласует возвратное местоимение с дистрибутивным «каждый».
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: гнев Яхве сильно разгорелся
  rationale: Сохранена древнееврейская метафора горящего гнева и усилительное значение מְאֹד.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в древнееврейском тексте, а не заменяющий его титул.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: а в глазах Моисея это было злом
  rationale: Формулировка сохраняет буквальный оценочный оборот и не устраняет неявный в оригинале предмет оценки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» непосредственно передаёт его принятую научную реконструкцию.
- issue: Неявный предмет оценки во фразе וּבְעֵינֵי מֹשֶׁה רָע
  choice: в глазах Моисея это было злом
  alternative: это не понравилось Моисею; Моисей счёл это дурным
  rationale: Выбранная формулировка сохраняет напряжённую лексику «зла» и оставляет местоимение «это» контекстуально неоднозначным, как и древнееврейский текст.
- issue: Дистрибутивное אִישׁ
  choice: каждый
  alternative: каждый мужчина
  rationale: В данном обороте אִישׁ прежде всего выполняет дистрибутивную функцию («каждый у входа...»); перевод не утверждает без необходимости, что плакали исключительно взрослые мужчины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Сохранены метафоры «гнев разгорелся» и «в глазах Моисея», но синтаксис сделан понятным современному читателю.
