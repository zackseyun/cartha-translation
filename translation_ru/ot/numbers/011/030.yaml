lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: возвратился
  rationale: Нифаль глагола אסף буквально допускает значение «был собран», однако в данном контексте обозначает возвращение Моисея после предшествующего события. «Возвратился» естественно передаёт контекстуальный смысл, не превращая форму в необоснованно буквальный пассив.
- source_word: אֶל הַמַּחֲנֶה
  choice: в стан
  rationale: Предлог אֶל указывает направление движения, а מַחֲנֶה — стан Израиля. Традиционное и литературно уместное «в стан» ясно передаёт возвращение к месту расположения народа.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: он и старейшины Израиля
  rationale: Местоимение הוּא имеет уточняющую, аппозиционную функцию и подчёркивает, что вместе с Моисеем возвратились старейшины. Явное «он» сохраняет структуру и акцент еврейского текста.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшины Израиля
  rationale: Прямое и устоявшееся соответствие сопряжённой конструкции; выражение понятно современному читателю и сохраняет достоинство повествовательного регистра.
