source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: ru
  text: 'А народу скажи: «Освятите себя[a] к завтрашнему дню, и будете есть мясо, потому что вы плакали перед Яхве, говоря: „Кто накормит нас мясом? Ведь хорошо нам было в Египте!“ И Яхве даст вам мясо, и будете есть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посвятите себя». Еврейский глагол означает отделить себя и подготовиться к действию Яхве.'
    reason: Лексическая альтернатива поясняет сакральный смысл הִתְקַדְּשׁוּ.
lexical_decisions:
- source_word: תֹּאמַר
  choice: скажи
  rationale: Имперфект 2-го лица мужского рода единственного числа имеет здесь повелительную силу; русский императив естественно передаёт обращённое к Моисею предписание.
- source_word: הִתְקַדְּשׁוּ
  choice: освятите себя
  rationale: Hitpael-императив от קדשׁ обозначает отделение и посвящение себя в ожидании действия Бога; «освятите себя» сохраняет сакральную окраску, в отличие от более общего «приготовьтесь».
- source_word: לְמָחָר
  choice: к завтрашнему дню
  rationale: Предлог ל указывает на подготовку к наступающему дню; эта формулировка ясна и естественна по-русски.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: и будете есть мясо
  rationale: בָּשָׂר в данном контексте означает пищевое мясо, а следующая за императивом форма выражает предстоящий результат.
- source_word: בְּכִיתֶם בְּאָזְנֵי יְהוָה
  choice: вы плакали перед Яхве
  rationale: Буквальное «в уши Яхве» в современном русском неестественно; «перед Яхве» передаёт, что плач народа был обращён к Богу и услышан им, не превращая плач в нейтральную речь.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Кто накормит нас мясом?
  rationale: Hiphil от אכל имеет каузативное значение «дать есть, накормить»; выбранный вариант краток и естественен.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Ведь хорошо нам было в Египте!
  rationale: Сохранено непереводное сравнительной степенью утверждение טוֹב לָנוּ — «нам было хорошо»; «ведь» естественно передаёт объяснительное כִּי.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: И Яхве даст вам мясо
  rationale: Простой союз ו передан как «и», без добавления причинного «поэтому», хотя причинная связь ясна из контекста.
- source_word: וַאֲכַלְתֶּם
  choice: и будете есть
  rationale: Повтор исходного текста сохранён ради его emphатической и предвосхищающей силы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Характер повеления הִתְקַדְּשׁוּ
  choice: освятите себя
  alternative: приготовьтесь
  rationale: Выбранный вариант сохраняет религиозный смысл отделения себя перед действием Яхве; примечание поясняет его, не сводя к обычной практической подготовке.
- issue: Связь между жалобой народа и дарованием мяса
  choice: И Яхве даст вам мясо
  alternative: Поэтому Яхве даст вам мясо
  rationale: Контекст допускает причинное понимание ответа Яхве, однако в оригинале стоит обычный соединительный союз; перевод сохраняет эту формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан доступным для обычного читателя; повтор «и будете есть» и прямота жалобы народа сохранены. Имя Яхве передано последовательно.
