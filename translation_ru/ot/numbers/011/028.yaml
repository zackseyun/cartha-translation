lexical_decisions:
- source_word: וַיַּעַן
  choice: сказал
  rationale: В повествовательной формуле глагол ענה вводит реплику-ответ. По-русски в данном контексте естественнее «сказал», поскольку буквальное «ответил» без явно приведённого вопроса звучит тяжелее.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисус, сын Навин
  rationale: Использована укоренившаяся русская библейская форма имени; запятая делает сочетание естественным для современного русского языка.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: служитель Моисея
  rationale: מְשָׁרֵת обозначает человека, состоящего при другом и помогающего ему; «служитель» сохраняет достоинство роли и не предполагает рабства.
- source_word: מִבְּחֻרָיו
  choice: с юности
  rationale: Компактная форма допускает несколько разборов. В контексте служения Иисуса при Моисее «с юности» даёт естественный русский смысл, а подлинная неоднозначность отмечена в сноске.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Господин мой Моисей
  rationale: Уважительное обращение к человеку передано словом «господин»; порядок слов сохраняет торжественную настойчивость обращения и не придаёт ему божественного смысла.
- source_word: כְּלָאֵם
  choice: останови их
  rationale: Императив может означать удержать, воспрепятствовать или запретить. «Останови их» естественно передаёт требование прекратить происходящее, не уточняя способ.
