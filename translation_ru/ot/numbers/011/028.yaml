  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: ru
  text: 'Иисус Навин, служитель Моисея с юности[a], ответил: «Господин мой Моисей, останови их!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один из его молодых людей»; возможно также: «из числа его избранных». Еврейское выражение кратко и неоднозначно.'
