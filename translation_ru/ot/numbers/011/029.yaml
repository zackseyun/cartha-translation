  source_fidelity: 'Смысл передан в целом точно: вопрос Моисея сохраняет направленность לִי («за меня / в моих интересах»), а оба последующих глагола выражают единое пожелание. Однако «ниспослал на них» — более возвышенная интерпретация, чем еврейское «дал Свой Дух на них»; нейтральное «даровал им Свой Дух» точнее передаёт дарование, а исходный пространственный образ следует оставить в примечании.'
