  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: ru
  text: 'Но Моисей сказал ему: «Ты ревнуешь за меня[a]? О, если бы весь народ Яхве был пророками и Яхве даровал им Свой Дух[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты так ревностно отстаиваешь мои интересы?»'
    reason: Еврейский глагол קנא может обозначать ревность, зависть или ревностную защиту чьих-либо интересов; здесь речь идёт об отношении Иисуса Навина к Моисею.
  - marker: b
    text: 'Буквально: «дал Свой Дух на них»; еврейское выражение сохраняет образ Духа, данного людям для пророчества.'
    reason: Примечание передаёт пространственный образ נתן…על, который в естественном русском основном тексте передан как «даровал им».
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: Неужели ты ревнуешь за меня?
  rationale: Глагол קנא здесь передаёт ревностную, защитническую заботу Иисуса Навина об авторитете Моисея. Русское «ревнуешь за меня» сохраняет как личную направленность לִי, так и неоднозначность между ревностью и рвением.
- source_word: וּמִי יִתֵּן
  choice: О, если бы
  rationale: Устойчивое еврейское выражение вводит сильное пожелание, а не буквальный вопрос «кто даст?». «О, если бы» естественно передаёт оптативный смысл и эмоциональную силу.
- source_word: כָּל עַם יְהוָה
  choice: весь народ Яхве
  rationale: Сочетание обозначает весь народ, принадлежащий Яхве. Такая формулировка близка к структуре оригинала и понятна по-русски.
- source_word: נְבִיאִים
  choice: пророками
  rationale: Существительное прямо обозначает пророков; нет необходимости заменять его пояснительным оборотом «пророчествующими».
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: и Яхве ниспослал на них Свой Дух
  rationale: В контексте пожелания כִּי продолжает желательное содержание. «Ниспослал на них» естественно по-русски и сохраняет пространственный образ Духа, пребывающего на людях, не подменяя его образом излияния.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, присутствующее в еврейском тексте, а не заменяющий его титул.
- source_word: רוּחוֹ
  choice: Свой Дух
  rationale: Контекст пророческого наделения указывает на Дух Яхве. Возвратное «Свой» ясно соотносит Дух с подлежащим «Яхве», а прописная буква обозначает божественный референт.
theological_decisions:
- issue: Значение רוּחוֹ в контексте пророческого дара
  choice: Свой Дух
  alternative: свой дух
  rationale: Речь идёт о действии Духа Яхве, благодаря которому люди пророчествуют. Прописная буква делает референт ясным, не уточняя сверх текста способ или длительность этого действия.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал употребляет тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Связь заключительной части, введённой כִּי, с пожеланием
  choice: продолжение пожелания через союз «и»
  alternative: 'причина: «потому что Яхве ниспослал бы…»'
  rationale: В данном оптативном обороте заключительная часть естественно выражает связанное с первым пожеланием действие Яхве. Союз «и» сохраняет связь, не превращая неоднозначную частицу כִּי в жёстко причинную.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией. Междометие «О» сохраняет силу пожелания Моисея; синтаксис не перегружен архаизмами. Личное имя «Яхве» передано последовательно в обоих случаях.
