base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ru
  text: 'Сыновья Неффалима — по их родам, по их кланам, по домам их отцов, по числу имён, от двадцати лет и старше, — все выходящие на войну[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все выходящие на войну» или «все выходящие на военную службу»; это еврейское выражение относится к тем, кто подлежал военной службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: сыновья Неффалима
  rationale: Сохраняет буквальную мужскую и родословную направленность выражения; в контексте переписи речь идёт о мужчинах колена, происходящих от Неффалима.
- source_word: תּוֹלְדֹתָם
  choice: по их родам
  rationale: Передаёт родословные подразделения и естественно звучит в русской переписной формуле.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их кланам
  rationale: В племенном контексте обозначает более широкую родственную группу, чем современная отдельная семья.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Сохраняет патрилинейную структуру древнеизраильского выражения и его повторяющуюся формулу.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Формально передаёт индивидуальный подсчёт внесённых поимённо людей, не добавляя отсутствующего в тексте пояснения.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога, точно соответствующая еврейскому выражению.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все выходящие на войну
  rationale: Сохраняет буквальную форму и военный смысл идиомы, не внося прямо отсутствующие слова «способные» или «пригодные».
theological_decisions:
- issue: Следует ли выражать военную пригодность как способность или допуск к службе
  choice: все выходящие на войну
  alternative: все способные участвовать в войне; все пригодные к военной службе
  rationale: Еврейский текст буквально говорит о каждом выходящем к войску/на войну. Контекст подразумевает военнообязанных, но не уточняет критерий как физическую способность; поэтому неоднозначность сохраняется в основном тексте и разъясняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством переписной формулы. Повтор предлога «по» сохраняет структуру перечисления; двоеточие отражает незавершённость синтаксической конструкции, продолжающейся в следующем стихе.
