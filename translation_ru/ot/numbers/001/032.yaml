base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ru
  text: 'У сынов Иосифа — сынов Ефрема — по их родословиям, по их родам, по домам их отцов, по числу имён, от двадцати лет и старше — все мужчины, выходящие на войну[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все мужчины, годные к военной службе». Еврейское выражение буквально говорит о выходе на войну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף לִבְנֵי אֶפְרַיִם
  choice: Среди сынов Иосифа — среди сынов Ефрема
  rationale: Предлог לְ вводит раздел переписи, а повтор уточняет, что речь идёт о ветви Ефрема среди потомков Иосифа. «Сынов» сохраняет родословную форму оригинала; «среди» естественно передаёт функцию заголовка переписи по-русски.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: В контексте переписи слово указывает на происхождение и родословную принадлежность, не обязательно на письменные записи.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: «Роды» обозначают более широкие родственные объединения, а не современные малые семьи.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Сохранён технический термин патрилинейной структуры Израиля без замены его более общим выражением «семейства».
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: по числу имён
  rationale: Формула означает поимённый подсчёт; близкое к оригиналу выражение понятно в контексте переписи.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все мужчины, выходящие на войну
  rationale: Сохранены мужской референт военной переписи и конкретный еврейский образ выхода на войну; возможное значение военной службы разъяснено в сноске.
theological_decisions:
- issue: Гендерно маркированный язык военной переписи
  choice: все мужчины, выходящие на войну
  alternative: все, выходящие на войну
  rationale: Контекст и грамматическая форма מִבֶּן относятся к мужчинам призывного возраста; нейтральная передача могла бы скрыть эту особенность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством перечневой формулы. Синтаксическая незавершённость и двоеточие сохранены, поскольку численность колена сообщается в следующем стихе.
