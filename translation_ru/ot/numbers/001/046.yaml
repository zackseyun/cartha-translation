  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: ru
  text: Итак, всех исчисленных было шестьсот три тысячи пятьсот пятьдесят[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех учтённых»; еврейское слово означает зарегистрированных при переписи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Итак, ... было
  rationale: Форма с последовательным ו подводит итог переписи; «итак» естественно передаёт итоговое значение, а безличная числовая конструкция нормативна для современного русского языка.
- source_word: כָּל
  choice: всех
  rationale: Сохраняет всеохватное значение еврейского слова и естественно сочетается с субстантивированным причастием «исчисленных».
- source_word: הַפְּקֻדִים
  choice: исчисленных
  rationale: Пассивное причастие от פקד обозначает зарегистрированных при переписи. «Исчисленных» точно и кратко передаёт смысл, не добавляя прямо слова «мужчин», хотя контекст говорит о военнообязанных мужчинах.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: шестьсот три тысячи пятьсот пятьдесят
  rationale: Число 603 550 передано в соответствии с нормами современного русского языка без механического воспроизведения повторяющихся еврейских союзов.
