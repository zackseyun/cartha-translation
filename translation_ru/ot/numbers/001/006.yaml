  text: 'for Simeon: Shelumiel son of Zurishaddai;'
translation:
  language: ru
  text: от Симеона — Шелумиил, сын Цуришаддая;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: от Симеона
  rationale: Предлог לְ в перечне указывает, какой колено представляет названный человек. Русское «от Симеона» естественно передаёт представительство и сохраняет краткую структуру списка.
- source_word: שְׁלֻמִיאֵל
  choice: Шелумиил
  rationale: Личное имя передано принятой русской библейской транслитерацией, без перевода его этимологического значения.
- source_word: בֶּן
  choice: сын
  rationale: В формуле именования בֶּן непосредственно обозначает сына; более широкое «потомок» здесь не требуется.
- source_word: צוּרִישַׁדָּי
  choice: Цуришаддай
  rationale: Личное имя транслитерировано с передачей начального צ через «Ц» и удвоенного согласного в компоненте Шаддай.
