  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: ru
  text: 'Сыновья Рувима, первенца Израиля, по их родословиям, по их родам, по их отцовским домам, по числу имён, по головам[a], — все мужчины от двадцати лет и старше, все выходящие на войну:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по головам» (дословно — «по черепам»), то есть каждого считали отдельно.'
    reason: Поясняет конкретный образ еврейской идиомы и её значение в контексте переписи.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: Сыновья Рувима
  rationale: Глагол וַיִּהְיוּ входит в формулу переписи; в русском его естественно передать именной конструкцией. «Сыновья» сохраняет прозрачность еврейского בְנֵי в племенном контексте.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: первенца Израиля
  rationale: Приложение относится к Рувиму и прямо передаёт его положение как первенца Израиля.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: В контексте переписи слово указывает на происхождение и генеалогическое распределение; «родословия» точнее и естественнее русского буквального «поколения».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: «Роды» передаёт внутренние подразделения племени и отличает их от следующих «отцовских домов».
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохранён технический термин родоплеменной организации без замены более общим словом «семьи».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Формально передаёт исчисление названных по имени отдельных людей.
- source_word: לְגֻלְגְּלֹתָם
  choice: поголовно
  rationale: Русское «поголовно» естественно воспроизводит идиому индивидуального подсчёта, основанную на образе головы; буквальная основа отмечена в сноске.
- source_word: כָּל זָכָר
  choice: все мужчины
  rationale: В данном возрастном и военном контексте «мужчины» звучит естественнее, чем биологически маркированное «лица мужского пола», сохраняя указание на пол.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Современная и точная русская формула возрастного порога.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все выходящие на войну
  rationale: Причастная конструкция сохраняет буквальную форму и не добавляет отсутствующее в тексте понятие способности или пригодности, хотя контекст подразумевает военную службу.
