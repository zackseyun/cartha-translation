  verdict: revise
  source_fidelity: 'Основная структура и все существенные элементы еврейского текста переданы верно: Рувим назван первенцем Израиля; различены родословия, роды и отцовские дома; сохранены исчисление по именам, возрастной порог, мужской пол и формула о выходящих на войну. Конечное двоеточие оправдано тем, что итоговая численность следует в ст. 21. Однако «поголовно» в современном русском прежде всего может означать «все без исключения», тогда как לְגֻלְגְּלֹתָם конкретно обозначает счёт по отдельным головам/лицам. «По головам» точнее сохраняет этот способ исчисления.'
