  language: ru
  text: Исчисленных из колена Иуды было семьдесят четыре тысячи шестьсот[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внесённых в списки». Еврейская форма в этой формуле переписи допускает оба перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Страдательная форма от פקד в контексте переписи обозначает людей, которых сосчитали или внесли в списки. «Исчисленных» сохраняет устойчивую библейскую лексику переписи и не добавляет слова «мужчин», отсутствующего в данном стихе.
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание предлога ל с מַטֶּה здесь выражает принадлежность к племенной группе; «из колена» естественно для русского библейского регистра и соответствует формуле перечня.
- source_word: יְהוּדָה
  choice: Иуды
  rationale: Нормативная русская форма имени в родительном падеже после слова «колена».
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: семьдесят четыре тысячи шестьсот
  rationale: Число передано в обычном современном русском порядке; еврейская формула буквально складывает четыре и семьдесят тысяч и шесть сотен.
