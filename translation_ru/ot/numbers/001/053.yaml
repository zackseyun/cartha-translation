  revision_rationale: Исправлена передача заключительного предписания, чтобы выразить не только несение караула рядом со скинией, но и вверенную левитам обязанность по её охране. Уточнена форма предписывающего глагола в начале и приведена сноска к более точному буквальному соответствию. Смысл, терминология и неявно выраженный субъект гнева сохранены.
