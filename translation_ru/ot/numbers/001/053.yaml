revisions:
- from: Левиты же пусть располагаются станом вокруг скинии свидетельства, чтобы гнев не обрушился на общину сынов Израиля.[a] Левиты должны нести стражу при скинии свидетельства.
  to: Левиты же должны располагаться станом вокруг скинии свидетельства, чтобы гнев не обрушился на общину сынов Израиля. Левиты должны исполнять обязанности по охране скинии свидетельства.
  rationale: Исправлена передача заключительного предписания, чтобы выразить не только несение караула рядом со скинией, но и вверенную левитам обязанность по её охране. Уточнена форма предписывающего глагола в начале и приведена сноска к более точному буквальному соответствию. Смысл, терминология и неявно выраженный субъект гнева сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:45:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Первая часть верно передаёт предписывающий имперфект, расположение левитов вокруг скинии и предотвращение гнева, не добавляя его субъекта. Во второй части «нести стражу при скинии» ослабляет прямой объект еврейского выражения: левиты должны хранить/охранять вверенную им скинию и исполнять связанную с ней обязанность, а не просто находиться на страже при ней.'
  naturalness: «Пусть располагаются станом» допустимо, но «должны располагаться станом» несколько естественнее в современном литературном русском для нормативного предписания. «Исполнять обязанности по охране» ясно выражает порученную охранную функцию без архаизации.
  terminology: «Левиты», «скиния свидетельства», «община сынов Израиля» последовательно и точно передают культовые и этнические обозначения исходного текста. «Гнев» сохраняет силу קֶצֶף; субъект не назван, как и в еврейском тексте.
  issues:
  - severity: medium
    issue: Во второй клаузе ослаблен объект порученной левитам обязанности.
    rationale: וְשָׁמְרוּ ... אֶת־מִשְׁמֶרֶת מִשְׁכַּן הָעֵדוּת означает, что левиты должны соблюдать/охранять вверенную им обязанность, относящуюся к скинии свидетельства. Оборот «нести стражу при скинии» обозначает главным образом место службы и не вполне передаёт охрану и вверенное попечение о скинии.
  - severity: low
    issue: Формулировка сноски не вполне буквально передаёт форму глагола.
    rationale: '«И да не будет» вводит оттенок пожелания, тогда как וְלֹא יִהְיֶה — обычное отрицательное будущее/предписание: «и не будет гнева» или, в контексте, «чтобы не было гнева».'
  revised_text: Левиты же должны располагаться станом вокруг скинии свидетельства, чтобы гнев не обрушился на общину сынов Израиля. Левиты должны исполнять обязанности по охране скинии свидетельства.
