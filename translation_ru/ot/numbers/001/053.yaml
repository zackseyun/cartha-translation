  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: ru
  text: Левиты же должны располагаться станом вокруг скинии свидетельства, чтобы гнев не обрушился на общину сынов Израиля. Левиты должны исполнять обязанности по охране скинии свидетельства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Левиты же
  rationale: Частица «же» естественно передаёт соединительно-противительный переход от расположения остальных колен к особому месту левитов.
- source_word: יַחֲנוּ סָבִיב
  choice: пусть располагаются станом вокруг
  rationale: Имперфект в данном предписании имеет директивное значение; выражение сохраняет военный и походный контекст расположения стана.
- source_word: לְמִשְׁכַּן הָעֵדֻת
  choice: вокруг скинии свидетельства
  rationale: «Скиния» — укоренившийся русский эквивалент מִשְׁכָּן в контексте Пятикнижия, а «свидетельство» сохраняет широту значения הָעֵדֻת и не сводит его без пояснения к конкретному предмету или документу.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: чтобы гнев не обрушился
  rationale: В контексте охраны святилища קֶצֶף обозначает грозный, карающий гнев. Русский оборот естественно выражает предупредительную цель, не называя прямо субъекта гнева, поскольку он не назван в еврейском тексте.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: на общину сынов Израиля
  rationale: «Община» передаёт собирательное и заветное значение עֵדָה; «сыны Израиля» сохраняет форму בְּנֵי יִשְׂרָאֵל и подходит достоинству библейского регистра.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: должны нести стражу
  rationale: Сочетание однокоренных שׁמר и מִשְׁמֶרֶת означает исполнение вверенной охранной обязанности. «Нести стражу» передаёт одновременно ответственность и защиту священных границ.
- source_word: מִשְׁכַּן הָעֵדוּת
  choice: скинии свидетельства
  rationale: Повторяющееся культовое наименование переведено одинаково в обеих частях стиха.
theological_decisions:
- issue: Характер гнева (קֶצֶף)
  choice: Сохранён вес карающего гнева, подразумеваемого в контексте святилища, без прямого добавления слова «Божий».
  alternative: «ярость», «наказание» или явное «Божий гнев»
  rationale: Контекст указывает на Божий суд при нарушении священных границ, однако сам стих не называет обладателя гнева; перевод сохраняет эту имплицитность.
- issue: Значение הָעֵדוּת в названии скинии
  choice: свидетельство
  alternative: «откровение», «завет» или «скрижали завета»
  rationale: Более узкие варианты истолковывают референт термина. Буквально точное «свидетельство» сохраняет богословскую и предметную многозначность исходного названия.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: «израильтяне» или «народ Израиля»
  rationale: Выбран формально соответствующий и понятный в современном библейском регистре вариант, сохраняющий родословное обозначение народа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Термины «скиния», «свидетельство» и «сыны Израиля» сохранены как понятные и укоренившиеся; архаические глагольные формы и канцелярские обороты исключены.
