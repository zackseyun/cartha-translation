  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד в контексте переписи обозначает тех, кто был учтён или внесён в число. «Исчисленных» сохраняет связь с переписью и соответствует возвышенному, но понятному библейскому регистру.
- source_word: לְמַטֵּה
  choice: из колена
  rationale: В повторяющейся формуле переписи сочетание указывает на принадлежность к племенной группе. «Из колена» — естественная и устоявшаяся русская формулировка.
- source_word: זְבוּלֻן
  choice: Завулона
  rationale: Использована традиционная русская форма имени колена; родительный падеж обусловлен сочетанием «из колена».
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57 400
  rationale: Число точно передаёт еврейскую последовательность «пятьдесят семь тысяч и четыреста»; запись цифрами облегчает чтение.
