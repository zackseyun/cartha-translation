base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ru
  text: 'Сыновья Вениамина — по их родословиям, по их родам, по их отцовским домам, по числу имён, от двадцати лет и старше, — все пригодные к военной службе[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякий, выходящий в войско»; это выражение обозначает тех, кто был пригоден к военной службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Сыновья Вениамина
  rationale: Предлог ל вводит раздел переписи; формулировка сохраняет структуру перечня и родоплеменную терминологию исходного текста.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: В контексте переписи слово указывает на происхождение и генеалогическую принадлежность; «родословия» естественно и точно передаёт этот смысл.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה обозначает родовое подразделение племени; «роды» отличает его от следующего выражения «отцовские дома».
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохранён традиционный израильский термин родственной организации без замены более общим словом «семьи».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Близко передаёт формулу индивидуального поимённого подсчёта, не превращая её в современный канцелярский оборот.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула, точно выражающая нижний возрастной предел.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все способные участвовать в войне
  rationale: Буквальный оборот «всякий выходящий на войну/в войско» здесь обозначает пригодных или подлежащих военной службе; перевод передаёт функцию идиомы, сохраняя связь с войной.
