base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: ru
  text: Как повелел Яхве Моисею, так он и пересчитал их[a] в Синайской пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провёл их смотр», «внёс их в списки» или «исчислил их». Еврейский глагол может обозначать учёт людей, их внесение в списки или проведение переписи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: как… так и
  rationale: Парная конструкция естественно передаёт соответствие действия Моисея повелению Яхве и сохраняет связь с предшествующим контекстом.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол означает «приказывать, повелевать»; «повелел» соответствует возвышенному, но понятному повествовательному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: При русском глаголе «повелеть» адресат выражается дательным падежом; служебная частица אֶת отдельно не переводится.
- source_word: וַיִּפְקְדֵם
  choice: он и пересчитал их
  rationale: В контексте переписи פקד обозначает учёт или исчисление людей. «Пересчитал» ясно передаёт основной смысл, тогда как оттенок внесения в списки отмечен в сноске.
- source_word: בְּמִדְבַּר סִינָי
  choice: в Синайской пустыне
  rationale: Естественное современное географическое обозначение, передающее пустынную местность Синая.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Характер действия, выраженного פקד
  choice: пересчитал
  alternative: провёл смотр; внёс в списки; исчислил
  rationale: Контекст общенародной переписи поддерживает значение подсчёта, однако глагол может включать оттенок учёта или набора; эта смысловая широта сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «как… так и» подчёркивает точное исполнение повеления; местоимение «он» по контексту относится к Моисею.
