lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Пассивная форма от פקד обозначает людей, учтённых при переписи; «исчисленных» сохраняет повторяющуюся формулу главы и звучит достойно и понятно.
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание לְ с מַטֶּה в переписной формуле указывает на принадлежность к колену; по-русски естественно «из колена».
- source_word: נַפְתָּלִי
  choice: Неффалима
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж после слова «колена».
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: пятьдесят три тысячи четыреста
  rationale: Число передано в обычном для современного русского языка порядке без буквального воспроизведения порядка компонентов в древнееврейском.
