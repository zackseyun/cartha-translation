    rationale: Предлог עַל в данном контексте указывает расположение при/у соответствующего стана; «при своём стане» оставляет отношение менее специально локализованным и лучше сохраняет исходную формулировку.
  revised_text: 'Сыны Израиля должны становиться станом: каждый при своём стане и каждый под своим знаменем, по своим отрядам.'
