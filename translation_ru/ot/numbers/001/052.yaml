  text: 'Сыны Израиля должны становиться станом: каждый при своём стане и каждый под своим знаменем, по своим отрядам.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: должны располагаться станом
  rationale: Форма глагола חנה с союзом в контексте предписаний выражает требуемое последующее действие. Такая передача сохраняет предписывающий смысл и звучит естественно в современном русском языке.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохраняет буквальный образ исходного выражения и его торжественный библейский регистр, оставаясь понятным современному читателю.
- source_word: אִישׁ ... וְאִישׁ
  choice: каждый ... и каждый
  rationale: Повтор передаёт распределительное значение и подчёркивает упорядоченное размещение каждого мужчины, не утяжеляя русскую фразу повтором слова «мужчина».
- source_word: עַל מַחֲנֵהוּ
  choice: в своём стане
  rationale: Предлог עַל здесь обозначает принадлежность или размещение относительно назначенного стана. Русское «в своём стане» естественно передаёт эту связь, не утверждая более точного пространственного расположения.
- source_word: דִּגְלוֹ
  choice: под своим знаменем
  rationale: דֶּגֶל — знамя или штандарт племенной либо военной группы. «Под своим знаменем» — естественное русское выражение для принадлежности к такой группе.
- source_word: לְצִבְאֹתָם
  choice: по своим отрядам
  rationale: צָבָא здесь указывает на организованные группы Израиля с военным оттенком. «Отряды» передаёт организационную структуру, не создавая впечатления, будто речь обязательно идёт о непосредственном сражении.
