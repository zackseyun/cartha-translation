  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: ru
  text: «Проведите перепись всей общины сынов Израиля[a] по их родам, по их отеческим домам, по числу имён всех мужчин, поголовно[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей общины израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по их головам» (или «по их черепам»), то есть по одному человеку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: проведите перепись
  rationale: Буквально выражение означает «поднимите голову», но в данном административном контексте это идиома со значением подсчёта и внесения в перепись.
- source_word: כָּל עֲדַת
  choice: всей общины
  rationale: עֵדָה обозначает Израиль как единую организованную общину; «община» естественно и точно передаёт корпоративный смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено буквальное родственное обозначение, которое соответствует форме еврейского текста и уместно в контексте родословного учёта.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь означает крупное родственное подразделение племени, а не только современную нуклеарную семью.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отеческим домам
  rationale: Выражение обозначает группы, организованные по отцовской линии; «отеческие дома» сохраняет структуру и исторический смысл оригинала.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Сохранена административная формулировка, указывающая на поимённый учёт, без сведения её к общему глаголу «сосчитать».
- source_word: כָּל זָכָר
  choice: всех мужчин
  rationale: В контексте переписи זָכָר обозначает лиц мужского пола; по-русски «мужчин» звучит естественнее субстантивированного «самцов» и яснее, чем «мужей».
- source_word: לְגֻלְגְּלֹתָם
  choice: каждого отдельно
  rationale: Буквально «по их черепам/головам» — идиома индивидуального, поголовного подсчёта. Основной текст передаёт смысл естественным современным русским языком, а образ отмечен в сноске.
