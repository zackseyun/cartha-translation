  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: ru
  text: Сыны Израиля[a] сделали всё, что Яхве повелел Моисею; так они и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «израильтяне»; буквально «сыновья Израиля».
    reason: 'Лексическая альтернатива: בְּנֵי יִשְׂרָאֵל — устойчивое обозначение народа Израиля, дословно имеющее мужскую форму.'
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: И сделали
  rationale: Глагол עשה имеет широкое значение «делать, исполнять». Сохранён повтор этого глагола в начале и конце стиха, подчёркивающий полное послушание повелению.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт мужскую форму и традиционную образность еврейского выражения, оставаясь понятным в русском библейском повествовании; более нейтральный вариант отмечен в сноске.
- source_word: כְּכֹל אֲשֶׁר
  choice: согласно всему, что
  rationale: Передаёт как соответствие повелению, так и его полный объём, не добавляя отсутствующих в исходном тексте уточнений.
- source_word: צִוָּה
  choice: повелел
  rationale: В данном контексте צוה обозначает властное предписание. Русское совершенное прошедшее естественно показывает, что повеление предшествовало исполнению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: После русского глагола «повелеть» адресат естественно оформляется дательным падежом; это соответствует еврейской конструкции, где Моисей является объектом повеления.
- source_word: כֵּן עָשׂוּ
  choice: так они и сделали
  rationale: Сохраняет заключительное усиление и намеренный повтор глагола עשה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранный вариант сохраняет форму исходного выражения. При этом в данном контексте оно обозначает народ Израиля как общность, поэтому идиоматический вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Намеренный повтор «сделали» сохранён как композиционное усиление исходного текста; знак конца раздела פ отдельно не воспроизводится.
