    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה ... הֵם
  choice: Вот
  rationale: Начальное указательное местоимение и заключительное усилительное הֵם вместе образуют выразительное отождествление. Русское «вот» естественно передаёт эту конструкцию без ненужной связки прошедшего времени.
- source_word: קריאי הָעֵדָה
  choice: призванные из общины
  rationale: Страдательное причастие от קרא указывает на тех, кого позвали, созвали или назначили. «Призванные» сохраняет причастную форму и не сводит значение исключительно к избранию; «из общины» естественно обозначает их принадлежность к ней и выделение из её среды.
- source_word: נְשִׂיאֵי
  choice: вожди
  rationale: В данном племенном и управленческом контексте слово обозначает старших представителей и руководителей. «Вожди» передаёт их положение точнее, чем монархически окрашенное «князья».
- source_word: מַטּוֹת אֲבוֹתָם
  choice: колен своих отцов
  rationale: Сочетание обозначает колена, определяемые по отцовской принадлежности. Формулировка сохраняет явное упоминание отцов и патрилинейную структуру исходного текста.
- source_word: רָאשֵׁי
  choice: главы
  rationale: Сохранена обычная для древнееврейского языка метафора «головы» в значении руководителей.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: тысяч Израиля
  rationale: אֶלֶף может означать как буквальную тысячу, так и родовое либо военное подразделение. Буквальная передача сохраняет заложенную в исходном тексте неоднозначность.
