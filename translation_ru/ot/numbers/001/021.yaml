lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד обозначает людей, учтённых при переписи. Субстантивированное «исчисленных» кратко и естественно передаёт этот смысл в контексте итогового числа.
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание указывает на принадлежность к колену; по-русски в формуле переписи естественно сказать «из колена».
- source_word: רְאוּבֵן
  choice: Рувима
  rationale: Традиционная русская библейская форма имени, поставленная в родительном падеже после слова «колена».
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: сорок шесть тысяч пятьсот
  rationale: Точное числовое значение передано в обычном для современного русского языка порядке.
