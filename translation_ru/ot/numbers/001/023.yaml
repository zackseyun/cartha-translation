lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד в контексте переписи обозначает учтённых при исчислении людей. Русское «исчисленных» сохраняет традиционно-библейский оттенок и ясно связывает стих с переписью; местоименный суффикс естественно не выражен отдельно, поскольку по-русски «их исчисленных» здесь звучало бы неестественно.
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание ל с מַטֶּה в формуле переписи указывает на принадлежность к племенной группе. «Из колена» — естественное и устойчивое русское соответствие в данном контексте.
- source_word: שִׁמְעוֹן
  choice: Симеона
  rationale: Употреблена нормативная русская библейская форма имени в родительном падеже после слова «колена».
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: пятьдесят девять тысяч триста
  rationale: Точное числовое значение передано в обычном для современного русского языка порядке слов.
