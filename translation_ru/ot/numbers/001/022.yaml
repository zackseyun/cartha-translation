  source_fidelity: 'В черновике «их потомки» неоправданно превращает תּוֹלְדֹתָם в обозначение людей. В данной переписной формуле слово относится к родословной/генеалогической принадлежности. «Поголовно» двусмысленно: оно может означать «все без исключения», а не индивидуальный подсчёт. Исправленный текст сохраняет формульный характер, именной учёт и буквальное «выходящий на войну».'
  naturalness: «По их родословным, по их родам, по отеческим домам» естественно для современного литературного русского в намеренно формальном переписном регистре. «По головам» ясно передаёт счёт по отдельным лицам; «каждый, кто выходит на войну» более естественно, чем субстантивированное «каждый выходящий».
  terminology: '«Родословные» передаёт תּוֹלְדֹתָם без смешения с מִשְׁפָּחוֹת («роды»). «Отеческие дома» сохранены как устоявшееся прозрачное обозначение בית אבות. Сноска о פקד исправлена: «призванные ... на смотр» добавляет оттенок призыва, которого в слове нет; «поставленные на учёт / прошедшие смотр» точнее сохраняет альтернативу переписи и смотра.'
