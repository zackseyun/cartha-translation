base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: ru
  text: 'У сыновей Симеона — по их родословным, по их родам, по отеческим домам — исчисленные по числу имён, по головам: каждый мужчина от двадцати лет и старше, каждый, кто выходит на войну[c][a][b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «прошедшие смотр из них» или «поставленные на учёт из них». Еврейское слово от корня פקד в данном контексте может обозначать как перепись, так и воинский смотр.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по их черепам», то есть по головам, каждого в отдельности.'
    reason: cultural_note
  - marker: c
    text: 'Выражение означает тех, кто выступает в составе войска; возможный перевод: «каждый годный к военной службе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: у сыновей Симеона
  rationale: Сохраняет формальную связь членов колена с их родоначальником; конструкция с «у» естественно вводит соответствующий раздел переписи.
- source_word: תּוֹלְדֹתָם
  choice: их потомки
  rationale: В контексте переписи слово обозначает родовые линии и тех, кто к ним принадлежит; «потомки» здесь яснее буквального «поколения» и согласуется с последующим распределением по родам.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по родам
  rationale: מִשְׁפָּחָה обозначает родовую группу внутри колена; русское «род» передаёт этот уровень родства точнее, чем бытовое «семья».
- source_word: לְבֵית אֲבֹתָם
  choice: по отеческим домам
  rationale: Сохраняет древнеизраильский термин общественно-родовой организации и его патрилинейный характер, не сводя его к отдельному домашнему хозяйству.
- source_word: פְּקֻדָיו
  choice: исчисленные из них
  rationale: Передаёт пассивное значение от פקד в контексте переписи, не устраняя возможный оттенок воинского смотра.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Сохраняет формулу именного учёта и административную точность исходного выражения.
- source_word: לְגֻלְגְּלֹתָם
  choice: поголовно
  rationale: Естественная русская идиома для индивидуального подсчёта, соответствующая буквальному образу подсчёта «по головам».
- source_word: כָּל זָכָר
  choice: каждый мужчина
  rationale: В возрастном и военном контексте «мужчина» естественно передаёт זכר, которое прямо указывает на мужской пол.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Точно и естественно передаёт установленный возрастной порог.
- source_word: כֹּל יֹצֵא צָבָא
  choice: каждый выходящий на войну
  rationale: Сохраняет конкретную образность и грамматическую форму еврейского выражения, не заменяя её полностью толкованием «годный к военной службе».
