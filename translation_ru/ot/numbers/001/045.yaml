lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Итак, …
  rationale: Форма продолжает повествование и вводит итог переписи. Связка «было» по-русски синтаксически относится к числу в следующем стихе, поэтому данный стих оставлен незавершённым, как и в еврейском контексте.
- source_word: כָּל פְּקוּדֵי
  choice: всех исчисленных
  rationale: Передаёт охват всех внесённых в перепись и результативно-пассивный смысл формы от פקד.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет буквальное мужское обозначение, существенное в контексте военной переписи.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохраняет патрилинейную единицу общественного устройства, по которой велась перепись.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула точного возрастного порога.
- source_word: כָּל יֹצֵא צָבָא
  choice: всех способных выходить на войну
  rationale: Передаёт военную пригодность, подразумеваемую устойчивым оборотом, и одновременно удерживает образ «выходить».
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямо передаёт корпоративно-локативное выражение без лишнего уточнения.
