  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: ru
  text: Ты же назначь левитов ответственными за скинию свидетельства[a], за все её принадлежности и за всё, что к ней относится. Они должны переносить скинию и все её принадлежности, служить при ней[b] и располагаться станом вокруг скинии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитель свидетельства». Еврейское מִשְׁכָּן буквально обозначает место обитания, жилище; здесь это переносное святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обслуживать её» или «нести при ней служение». Еврейский глагол обозначает служение, в данном контексте связанное со святилищем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ты же
  rationale: Местоимение выражено явно и выделяет адресата; частица «же» естественно передаёт контраст с предшествующим распоряжением об остальных израильтянах.
- source_word: הַפְקֵד ... עַל
  choice: назначь левитов ответственными за
  rationale: Каузативная повелительная форма פקד в сочетании с עַל означает поручение определённой сферы ответственности. Такая формулировка точнее и естественнее по-русски, чем буквальное «поставь над».
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: скиния свидетельства
  rationale: «Скиния» — установившееся русское обозначение переносного святилища; конструкция «свидетельства» сохраняет формальную и смысловую открытость еврейского сочетания.
- source_word: כֵּלָיו
  choice: её принадлежности
  rationale: כֵּלִים охватывает утварь, предметы и приспособления скинии; «принадлежности» сохраняет эту широту без неоправданного сужения.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: всё, что к ней относится
  rationale: Естественно передаёт совокупность всего связанного со скинией и не утверждает более узкое значение «находится в ней».
- source_word: יִשְׂאוּ
  choice: должны переносить
  rationale: נשא здесь обозначает физическое несение при перемещении; модальная конструкция передаёт предписывающую силу имперфекта в данном контексте.
- source_word: יְשָׁרְתֻהוּ
  choice: служить при ней
  rationale: Пиэль שרת обозначает служение, особенно в священном контексте. «При ней» естественно передаёт направленность служения на скинию, не создавая впечатления поклонения самому сооружению.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: располагаться станом вокруг скинии
  rationale: Формулировка ясно передаёт устройство лагеря по периметру святилища и сохраняет предписывающий характер высказывания.
theological_decisions:
- issue: Культовое значение מִשְׁכָּן
  choice: скиния
  alternative: обитель; жилище
  rationale: В данном контексте речь идёт о переносном святилище. «Скиния» сохраняет техническое культовое значение, а сноска указывает на буквальную образность слова.
- issue: Значение הָעֵדֻת в составе названия
  choice: свидетельства
  alternative: откровения; завета
  rationale: Буквальное «свидетельства» не сводит выражение без пояснения к одному возможному референту и сохраняет заложенную в исходном тексте смысловую ёмкость.
- issue: Характер служения שרת
  choice: служить при ней
  alternative: обслуживать её; прислуживать ей
  rationale: Выбранный вариант сохраняет священно-служебный оттенок глагола, но не приписывает левитам более узкой священнической функции, чем прямо сказано в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для законодательного повествования. Синтаксис сделан ясным для широкого читателя; техническое слово «скиния» сохранено и кратко пояснено в сноске. Формы «должны переносить», «служить» и «располагаться» объединяют обязанности левитов без архаической тяжеловесности.
