source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею в Синайской пустыне, в шатре встречи[a], в первый день второго месяца, во второй год после того, как они вышли из земли Египта:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шатёр встречи»; традиционно: «скиния собрания».'
    reason: Указан традиционный русский эквивалент прозрачного перевода еврейского выражения אֹהֶל מוֹעֵד.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: обратился
  rationale: Глагол דבר вводит речь Яхве. «Обратился … со словами» естественно передаёт рамочную конструкцию וַיְדַבֵּר … לֵאמֹר и избегает тяжеловесного повтора «говорил … говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּמִדְבַּר סִינַי
  choice: в Синайской пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «Синайская пустыня» — ясное и устойчивое русское географическое выражение.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Буквально передаёт оба элемента выражения אֹהֶל מוֹעֵד и сохраняет функцию места встречи, не подменяя её традиционным специальным термином.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: в первый день второго месяца
  rationale: Естественная русская передача древнееврейской календарной формулы.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: во второй год
  rationale: Прямая и естественная передача временного указания.
- source_word: לְצֵאתָם
  choice: после того, как они вышли
  rationale: Инфинитив с местоименным суффиксом обозначает время относительно исхода; личная конструкция сохраняет множественное число исходного текста и звучит современно.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранено явно присутствующее в еврейском тексте слово אֶרֶץ «земля»; форма «земля Египетская» соответствует dignified literary biblical register.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Формула вводит содержание речи в следующем стихе. В сочетании с «обратился» двоеточие и оборот «со словами» передают её функцию естественным современным русским языком.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и отражает наиболее распространённую научную реконструкцию произношения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Рамочная формула речи передана цельной конструкцией «обратился … со словами», а последовательность указаний места и времени сохранена.
