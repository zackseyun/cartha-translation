base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ru
  text: 'Сыновья Асира — по их родословиям, по их родам, по их отцовским домам, по числу имён, от двадцати лет и старше, — все годные к военной службе[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все выходящие на войну»; это идиома для мужчин, годных к военной службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Сыновья Асира
  rationale: Предлог לְ вводит заголовок племени в переписной формуле. Буквальное родственное обозначение сохраняет язык оригинала и в данном контексте естественно означает потомков Асира.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: В контексте переписи слово обозначает линии происхождения; «родословия» передаёт этот смысл точнее, чем буквальное, но менее ясное «поколения», не предполагая непременно письменных записей.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовые подразделения внутри племени; «роды» естественно и достаточно точно передаёт эту социальную единицу.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохранено устойчивое израильское обозначение патрилинейных семейно-родовых объединений; формулировка остаётся понятной современному читателю.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: по числу имён
  rationale: Формула указывает на поимённый подсчёт, при этом перевод сохраняет образ и структуру еврейского выражения.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула точно выражает нижний возрастной порог.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все годные к военной службе
  rationale: Еврейская идиома буквально говорит обо всех «выходящих в войско» и в переписном контексте обозначает мужчин, подлежащих военной службе; основной текст передаёт функциональный смысл, а сноска сохраняет буквальный образ.
