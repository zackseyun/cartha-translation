  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: ru
  text: От двадцати лет и старше — всех мужчин в Израиле, выходящих на войну[a], — ты и Аарон должны пересчитать по их воинским подразделениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пригодных к военной службе». Еврейское выражение буквально говорит о выходящих на войну и служит военной идиомой для тех, кто подлежит службе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по их войсковым соединениям»; возможно также: «по их ополчениям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: От двадцати лет и старше
  rationale: Естественно передаёт нижнюю возрастную границу, выраженную еврейской идиомой.
- source_word: כָּל יֹצֵא צָבָא
  choice: всех мужчин… выходящих на войну
  rationale: Сохраняет конкретный военный образ исходного выражения; слово «мужчин» оправдано контекстом переписи лиц мужского пола в этой главе.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямое и естественное обозначение принадлежности к народу Израиля.
- source_word: תִּפְקְדוּ אֹתָם
  choice: должны пересчитать
  rationale: В контексте переписи глагол означает учесть или пересчитать для военной службы; эта формулировка ясна современному читателю.
- source_word: לְצִבְאֹתָם
  choice: по их воинским подразделениям
  rationale: Передаёт организованное распределение военнообязанных по войсковым группам, не используя архаичное «ополчения» или «воинства».
- source_word: אַתָּה וְאַהֲרֹן
  choice: ты и Аарон
  rationale: Сохраняет подчёркнуто названных исполнителей повеления.
theological_decisions:
- issue: Указание пола при определении подлежащих военной переписи
  choice: всех мужчин… выходящих на войну
  alternative: всех, выходящих на войну
  rationale: 'Мужской род здесь не следует нейтрализовать: ближайший контекст прямо ограничивает перепись мужчинами, а форма причастия согласуется с этим контекстом.'
- issue: Буквальное действие или пригодность к военной службе
  choice: выходящих на войну
  alternative: пригодных к военной службе
  rationale: Основной текст сохраняет образность еврейской военной идиомы, а её значение как категории военнообязанных поясняется в сноске, без устранения смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным, а тире выделяют объект переписи и названных исполнителей. Все сноски поставлены непосредственно после относящихся к ним выражений.
