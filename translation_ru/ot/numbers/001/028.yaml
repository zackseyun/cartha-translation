  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ru
  text: 'У сыновей Иссахара — по их родословиям, по их родам, по домам их отцов, по числу имён — все мужчины от двадцати лет и старше, годные к военной службе[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все выходящие на войну». Буквально: «каждый выходящий в войско»; в контексте переписи речь идёт о мужчинах, годных к военной службе.'
    reason: Лексическая альтернатива для כֹּל יֹצֵא צָבָא и пояснение его военно-переписного смысла.
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Сыновья Иссахара
  rationale: בְּנֵי буквально означает «сыновья», а в контексте переписи обозначает мужчин — потомков Иссахара и членов его колена. Дательный предлог לְ в заголовочной формуле естественно передан русской синтаксической конструкцией с добавленным по контексту сказуемым «были исчислены».
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: Здесь תּוֹלְדוֹת указывает на линии происхождения. «По их родословиям» передаёт генеалогический смысл точнее и естественнее русского «по поколениям» в данной формуле переписи.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по родам
  rationale: מִשְׁפָּחָה обозначает родственную группу внутри колена; русское «род» хорошо передаёт эту ступень племенной организации.
- source_word: לְבֵית אֲבֹתָם
  choice: по отеческим домам
  rationale: Сохранён традиционный образ патрилинейного «дома отцов»; форма «отеческие дома» звучит по-русски естественнее буквального «дома их отцов», не устраняя исторической структуры родства.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Близкая к форме оригинала передача сохраняет мысль о поимённом учёте отдельных людей.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Современная русская формула ясно передаёт включённый нижний возрастной предел.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все мужчины … способные идти на войну
  rationale: Буквально выражение говорит о каждом «выходящем в войско/на войну». В контексте переписи мужчин военного возраста оно обозначает пригодность к военной службе; слово «мужчины» делает явной контекстуально заданную мужскую референцию.
theological_decisions:
- issue: Гендерная определённость переписи
  choice: все мужчины … способные идти на войну
  alternative: все, способные идти на войну
  rationale: Грамматически мужская форма и контекст военной переписи указывают именно на мужчин, поэтому гендерно нейтральная передача могла бы неоправданно расширить референцию.
- issue: Военная пригодность или фактический выход на войну
  choice: способные идти на войну
  alternative: все выходящие на войну
  rationale: Контекст переписи поддерживает функциональное значение военной пригодности, но буквальная конструкция допускает описание тех, кто выходит на войну; эта напряжённость сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Для естественности завершённой русской фразы добавлено подразумеваемое контекстом сказуемое «были исчислены»; перечислительная структура еврейской переписной формулы сохранена.
