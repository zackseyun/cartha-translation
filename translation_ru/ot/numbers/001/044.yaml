base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: ru
  text: Вот исчисленные[a], которых исчислили Моисей, Аарон и вожди Израиля — двенадцать мужчин, по одному от каждого отцовского дома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внесённые в перепись». Еврейское выражение может обозначать как самих подсчитанных людей, так и их учёт при переписи.'
    reason: lexical_alternative
  - marker: b
    text: «Отцовский дом» — родовая группа, ведущая происхождение по мужской линии, в племенном устройстве Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: исчисленные
  rationale: Страдательное причастие в контексте переписи обозначает людей, внесённых в счёт; «исчисленные» сохраняет личное значение и перекличку с последующим глаголом.
- source_word: פָּקַד
  choice: исчислили
  rationale: В первой главе Чисел глагол означает проведение переписи, то есть подсчёт и регистрацию мужчин; «исчислили» точно передаёт это значение и повтор корня.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: вожди Израиля
  rationale: Речь идёт о поставленных представителях племён, а не о наследственных князьях; «вожди» передаёт их руководящее положение без монархического оттенка.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: двенадцать мужчин
  rationale: אִישׁ здесь прямо указывает на мужчин; современное «мужчин» сохраняет это значение без архаизма «мужей».
- source_word: אִישׁ אֶחָד לְבֵית אֲבֹתָיו
  choice: каждый от своего отцовского дома
  rationale: Распределительное выражение указывает на одного представителя от соответствующей патрилинейной родовой группы; «своего» сохраняет соотнесённость с каждым вождём.
- source_word: הָיוּ
  choice: было
  rationale: Финальный глагол связывает число двенадцать с вождями. Отдельное предложение естественно передаёт эту связь и устраняет возможное ошибочное отнесение числа к исчисленным.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским словом «исчисленные». Повтор «исчисленные — исчислили» намеренно сохраняет повтор еврейского корня. Для ясности длинная еврейская конструкция разделена на два предложения; число двенадцать отнесено к вождям, а сами вожди сохранены среди совершающих перепись.
