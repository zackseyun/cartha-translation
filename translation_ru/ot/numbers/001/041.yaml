  text: Исчисленных из колена Асира было сорок одна тысяча пятьсот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד с суффиксом 3-го лица множественного числа обозначает людей, учтённых при переписи. «Исчисленных» сохраняет переписной контекст и не добавляет отсутствующее в самом стихе слово «мужчин».
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание לְ с מַטֶּה в формуле переписи указывает на принадлежность к колену; «из колена» естественно передаёт это значение по-русски.
- source_word: אָשֵׁר
  choice: Асира
  rationale: Традиционная русская форма имени Ашер в родительном падеже после слова «колена».
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: сорок одна тысяча пятьсот
  rationale: Естественный для современного русского языка порядок числительного, точно передающий указанное количество.
