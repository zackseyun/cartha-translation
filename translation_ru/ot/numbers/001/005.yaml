  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: ru
  text: 'Вот имена мужчин, которые будут стоять вместе с вами: от Рувима[a] — Елицур, сын Шедеура.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Рувима». Еврейский предлог может указывать как на принадлежность к племени, так и на представительство от него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: Вот имена
  rationale: Естественная русская формула представления перечня; начальное וְ передаёт связь с предыдущим контекстом, но отдельное «и» по-русски здесь избыточно.
- source_word: הָאֲנָשִׁים
  choice: мужчин
  rationale: Речь идёт о конкретных мужчинах — представителях племён; перевод сохраняет родовое значение исходного текста.
- source_word: אֲשֶׁר יַעַמְדוּ אִתְּכֶם
  choice: которые будут стоять вместе с вами
  rationale: Сохраняется буквальный образ глагола עמד и одновременно естественно передаётся участие этих мужчин рядом с Моисеем и Аароном.
- source_word: לִרְאוּבֵן
  choice: от Рувима
  rationale: Предлог לְ здесь допускает понимание племенной принадлежности либо представительства; «от Рувима» естественно указывает на происхождение представителя из племени.
- source_word: אֱלִיצוּר
  choice: Елицур
  rationale: Традиционная и узнаваемая русская библейская передача личного имени.
- source_word: בֶּן שְׁדֵיאוּר
  choice: сын Шедеура
  rationale: Стандартная русская передача древнееврейской родословной формулы; имя транслитерировано в принятой русской библейской форме.
