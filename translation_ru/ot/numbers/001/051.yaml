  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: ru
  text: Когда скиния отправляется в путь, левиты должны разобрать её; когда же она останавливается на стоянке, левиты должны установить её. Посторонний[a], который приблизится, будет предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужой», «неуполномоченный». Здесь имеется в виду человек, которому не разрешено приближаться к святилищу для служения при нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: Когда ... отправляется в путь
  rationale: Предлог ב с инфинитивом נסע образует временную конструкцию; перевод естественно передаёт начало движения переносного святилища.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское обозначение переносного святилища; оно точно соответствует культовому контексту מִשְׁכָּן.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: должны разобрать её
  rationale: Каузативная форма ירד в данном контексте обозначает снятие и разборку скинии перед переноской; «разобрать» естественно описывает требуемое действие.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Стандартная передача названия уполномоченной группы служителей.
- source_word: וּבַחֲנֹת
  choice: когда ... останавливается на стоянку
  rationale: Инфинитив חנה вводит параллельную временную конструкцию и обозначает расположение лагерем; формулировка сохраняет образ передвижения и стоянки.
- source_word: יָקִימוּ אֹתוֹ
  choice: должны установить её
  rationale: Каузативная форма קום здесь означает поставить или воздвигнуть скинию; «установить» звучит современно и точно.
- source_word: וְהַזָּר
  choice: посторонний
  rationale: В контексте служения при святилище זָר означает человека, не уполномоченного приближаться или участвовать в священном служении, а не обязательно этнического чужеземца.
- source_word: הַקָּרֵב
  choice: который приблизится
  rationale: Причастие קרב выражает приближение к сфере святилища; русский перевод сохраняет лаконичность формулы предупреждения.
- source_word: יוּמָת
  choice: должен быть предан смерти
  rationale: Хофаль глагола מות указывает на причинённую смерть, то есть на смертную казнь, не уточняя исполнителя.
theological_decisions:
- issue: Характер наказания в יוּמָת
  choice: «должен быть предан смерти» — пассивная формула смертной казни
  alternative: «умрёт» — простое указание на последствие
  rationale: Форма хофаль обычно означает, что смерть будет причинена; пассивная формулировка сохраняет юридико-сакральный смысл и не определяет, кто исполняет приговор.
- issue: Значение זָר
  choice: человек, посторонний по отношению к разрешённому служению при святилище
  alternative: этнический чужеземец или, более узко, любой нелевит
  rationale: В священническом контексте слово указывает прежде всего на отсутствие полномочий. «Посторонний» сохраняет это значение без этнического или чрезмерно узкого уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён параллелизм двух временных придаточных; модальное «должны» передаёт предписывающую силу контекста. Местоимение «её» согласовано с русским словом «скиния».
