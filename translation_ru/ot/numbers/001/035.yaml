lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד в контексте переписи обозначает людей, прошедших подсчёт. Субстантивированное «исчисленных» естественно продолжает формулу перечня и не добавляет отсутствующего в данном стихе слова «мужчин».
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание לְ с מַטֶּה в повторяющейся формуле переписи указывает на принадлежность к племенной группе; традиционное и понятное русское соответствие — «из колена».
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж после слова «колена».
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: тридцать две тысячи двести
  rationale: Число передано в естественном для современного русского языка порядке с точным сохранением значения 32 200.
