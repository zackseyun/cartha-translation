lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Но левиты
  rationale: Союз וְ передаёт контраст с исчисленными ранее племенами; «левиты» — общепринятое русское наименование потомков Левия.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: по племени своих отцов
  rationale: מַטֶּה в контексте переписи означает «племя», а אֲבֹתָם буквально указывает на их отцов, то есть родовую принадлежность по отцовской линии. Формулировка сохраняет образ и структуру оригинала.
- source_word: לֹא הָתְפָּקְדוּ
  choice: не были исчислены
  rationale: Форма от פקד в контексте переписи обозначает внесение в официальный счёт. «Исчислены» точно передаёт смысл и соответствует достоинству библейского повествования.
- source_word: בְּתוֹכָם
  choice: вместе с ними
  rationale: Выражение буквально значит «среди них», но здесь обозначает включение левитов в общую перепись остальных племён; «вместе с ними» естественно передаёт эту связь.
