  text: от Иуды — Нахшон, сын Амминадава;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִיהוּדָה
  choice: от Иуды
  rationale: Предлог לְ в перечне указывает на племя, которое представляет названный человек; русское «от Иуды» естественно передаёт выбор представителя от колена, не добавляя отсутствующего в еврейском тексте слова «колено».
- source_word: נַחְשׁוֹן
  choice: Нахшон
  rationale: Имя транслитерировано с еврейского; буква שׁ передана как «ш», а ח — как «х».
- source_word: בֶּן
  choice: сын
  rationale: В именной конструкции с личным именем обозначает непосредственное сыновство; определённость естественно выражается по-русски без отдельного артикля.
- source_word: עַמִּינָדָב
  choice: Амминадава
  rationale: Имя транслитерировано с еврейского и поставлено в родительный падеж после слова «сын».
