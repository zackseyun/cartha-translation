lexical_decisions:
- source_word: וַיִּקַּח
  choice: взяли
  rationale: Форма повествовательного прошедшего времени от לקח имеет основное значение «взять». Контекст допускает смысл привлечения или созыва названных представителей, но «взяли» сохраняет прямое значение еврейского глагола и не добавляет невыраженного действия.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Моисей с Аароном
  rationale: Имена переданы в принятой русской библейской форме; конструкция с «с» естественно обозначает их совместное действие, не меняя равноправного соединения лиц в исходном тексте.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: этих мужчин
  rationale: Существительное אֲנָשִׁים здесь обозначает конкретных мужчин — представителей колен, перечисленных выше. «Мужчин» точно передаёт референцию, тогда как «руководителей» было бы контекстуальным истолкованием.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: указанных поимённо
  rationale: Нифаль глагола נקב в сочетании с בְּשֵׁמוֹת передаёт явное называние или обозначение каждого по имени. «Указанных поимённо» естественно звучит в современном русском языке и сохраняет официальный характер контекста переписи.
