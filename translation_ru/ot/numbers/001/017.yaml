  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: ru
  text: И Моисей и Аарон взяли этих людей, названных по имени[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «названных по именам», то есть конкретно обозначенных по имени.'
