base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: ru
  text: Они созвали всю общину в первый день второго месяца, и все внесли себя в родословные списки[a] по своим родам и отцовским домам, по числу имён, от двадцати лет и старше, считая каждого отдельно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «объявили свою родословную»; здесь употреблено редкое древнееврейское выражение, означающее регистрацию на основании происхождения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по головам» (или «по черепам»), то есть каждого человека считали по отдельности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: собрали
  rationale: Порода hифиль глагола קהל означает «созвать, собрать». Выбор передаёт намеренное собрание всей общины и естественно звучит по-русски.
- source_word: כָּל הָעֵדָה
  choice: всю общину
  rationale: עֵדָה обозначает организованное сообщество Израиля; «община» сохраняет коллективный смысл и привычно для контекста Пятикнижия.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: в первый день второго месяца
  rationale: Буквально «в один [день] второго месяца» — обычная древнееврейская календарная формула, означающая первый день месяца.
- source_word: וַיִּתְיַלְדוּ
  choice: записались по происхождению
  rationale: Редкая форма hitpael от ילד в данном контексте означает установление или заявление родословного происхождения при переписи. Формулировка передаёт как добровозвратный оттенок, так и генеалогическое основание регистрации.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: по своим родам
  rationale: מִשְׁפָּחָה в племенной структуре Израиля обозначает родовую группу, а не только ближайшую семью.
- source_word: לְבֵית אֲבֹתָם
  choice: по своим … отцовским домам
  rationale: Сохранён технический термин родовой организации «отцовский дом» без замены более общим словом «семья».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Формальное соответствие подчёркивает поимённый характер переписи и сохраняет образность исходного выражения.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога, точно передающая смысл древнееврейского текста.
- source_word: לְגֻלְגְּלֹתָם
  choice: каждый отдельно
  rationale: Буквально «по их черепам/головам»; это счётный оборот, указывающий на индивидуальный учёт каждого человека. Основной текст передаёт смысл, а буквальный образ сохранён в примечании.
