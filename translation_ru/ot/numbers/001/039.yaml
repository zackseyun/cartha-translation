  yaml_path: translation/ot/numbers/001/039.yaml
  text: Those counted from the tribe of Dan were sixty-two thousand seven hundred.
translation:
  language: ru
  text: Исчисленных из племени Дана было шестьдесят две тысячи семьсот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד с местоименным суффиксом указывает на людей, учтённых при переписи. «Исчисленных» сохраняет переписной смысл и не добавляет отсутствующее здесь слово «мужчин», поскольку состав исчисляемых определён ближайшим контекстом.
- source_word: לְמַטֵּה
  choice: из племени
  rationale: В повторяющейся формуле переписи сочетание לְ с מַטֶּה обозначает принадлежность к племени; «из племени» естественно передаёт это значение по-русски.
- source_word: דָן
  choice: Дана
  rationale: Традиционная русская форма имени Дан в родительном падеже после слова «племени».
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: шестьдесят две тысячи
  rationale: Еврейская числовая конструкция передана в обычном для современного русского языка порядке.
- source_word: וּשְׁבַע מֵאוֹת
  choice: семьсот
  rationale: Прямой и естественный русский эквивалент числительного.
