  choice: сын
  rationale: Обычное обозначение родства в именной формуле; русское «сын» точно и естественно передаёт смысл.
- source_word: עָכְרָן
  choice: Охрана
  rationale: Имя передано в принятой русской библейской форме; конечное -а отражает традиционную русскую передачу имени Охран в родительном падеже после слова «сын».
