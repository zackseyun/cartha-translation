base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: ru
  text: 'У сынов Иуды — по их родословиям, по их родам, по домам их отцов, по числу имён, от двадцати лет и старше, — все выходящие на войну[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все подлежащие военной службе». Буквально еврейское выражение означает «все выходящие на войну».'
    reason: Передаёт подразумеваемый в контексте смысл военной пригодности, одновременно отмечая буквальную форму идиомы.
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Среди сынов Иуды
  rationale: בני буквально означает «сыновья», но в формуле переписи обозначает членов колена, происходящих от Иуды. «Среди» естественно связывает этот стих-перечень с подсчётом, сообщаемым в следующем стихе.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: Слово может обозначать поколения, происхождение или генеалогические записи. В контексте переписи «родословия» передаёт распределение по происхождению, не утверждая прямо, что речь идёт именно о письменных документах.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: משפחה здесь обозначает родовое подразделение внутри колена; русское «роды» естественно передаёт эту социальную единицу и отличает её от отдельного домашнего хозяйства.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Сохранён конкретный древнееврейский образ «дома отцов», обозначающий группы, организованные по отцовской линии; более общее «семейства» сгладило бы патрилинейную структуру выражения.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Перевод сохраняет буквальную формулу подсчёта отдельных людей по имени; вариант «поимённо» был бы естественнее, но несколько сильнее сворачивал бы образ исходного текста.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Это ясная современная русская формула возрастного порога, точно соответствующая исходному выражению.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все выходящие на войну
  rationale: Сохранена еврейская военная идиома без добавления слова «способные», которого в тексте нет. В контексте переписи выражение относится к мужчинам, подлежавшим военной службе.
theological_decisions:
- issue: Гендерная отнесённость военной переписи
  choice: все выходящие на войну
  alternative: все мужчины, способные выступать на войну
  rationale: Грамматическая форма и контекст указывают на взрослых мужчин, однако отдельного существительного «мужчины» и слова «способные» в этой фразе нет. Выбранный вариант сохраняет формулировку источника, а подразумеваемая пригодность к военной службе поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством переписной формулы. Повтор предлога «по» сохраняет размеренность и структурный параллелизм оригинала; двоеточие оставлено, поскольку итоговое число следует в следующем стихе.
