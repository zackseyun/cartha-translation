  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: ru
  text: 'У сынов Манассии — по их родословиям, по их родам, по домам их отцов, по числу имён — все мужчины от двадцати лет и старше, годные к военной службе[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый выходящий в войско»; возможный перевод: «все выходящие на войну». Выражение обозначает мужчин, подлежавших военной службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: У сынов Манассии
  rationale: Предлог לְ вводит название колена в повторяющейся формуле переписи. «У сынов Манассии» сохраняет эллиптическое построение контекста и родословный смысл слова בנים.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: В формуле переписи תּוֹלְדוֹת указывает на происхождение и родословную принадлежность; «по их родословиям» передаёт это точнее и естественнее, чем буквальное «по их поколениям».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри колена. Русское «род» понятно современному читателю и не сужает значение до нуклеарной семьи.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Передана традиционная израильская единица родства בֵּית אָבוֹת без замены её более общим понятием «семейство».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Формулировка сохраняет образ поимённого подсчёта и повторяющийся язык переписи.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Это естественная современная русская передача еврейского оборота, устанавливающего нижнюю возрастную границу.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все мужчины, годные к военной службе
  rationale: В контексте переписи выражение обозначает мужчин, способных или обязанных выступать в составе войска. Слово «мужчины» эксплицирует контекстуально определённый мужской референт, а «годные к военной службе» ясно передаёт функцию выражения.
theological_decisions:
- issue: Гендерная определённость военной переписи
  choice: все мужчины, годные к военной службе
  alternative: все, годные к военной службе
  rationale: Перепись охватывает мужчин от двадцати лет, способных участвовать в войске; нейтральное «все» могло бы скрыть эту контекстуальную определённость.
- issue: Значение выражения יֹצֵא צָבָא
  choice: годные к военной службе
  alternative: выходящие на войну
  rationale: Основной текст передаёт контекстуальный смысл воинской пригодности, не утверждая, что каждый уже фактически отправлялся на войну. Более буквальная возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством переписной формулы. Тире помогают читателю распознать длинную цепочку рубрик в эллиптическом стихе; двоеточие сохраняет его синтаксическую связь с последующим сообщением о числе переписанных.
