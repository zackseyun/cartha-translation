  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: ru
  text: Только колено Левия не исчисляй и числа их не включай в число сынов Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: Частица вводит исключение из предшествующего повеления о переписи; ограничительное «только» передаёт это точнее простого «но».
- source_word: מַטֵּה לֵוִי
  choice: колено Левия
  rationale: В контексте переписи מַטֶּה означает племенную группу; «колено» — естественный и устойчивый русский библейский термин.
- source_word: תִפְקֹד
  choice: исчисляй
  rationale: Глагол פקד здесь обозначает проведение переписи. «Исчислять» сохраняет оттенок официального учёта и остаётся понятным в данном контексте.
- source_word: וְאֶת־רֹאשָׁם לֹא תִשָּׂא
  choice: и не пересчитывай их
  rationale: Буквально выражение связано с поднятием или подсчётом «голов», но в контексте переписи идиоматически означает определение общей численности. Русское «пересчитывай их» естественно передаёт этот смысл и сохраняет параллелизм с первым глаголом.
- source_word: בְּתוֹךְ
  choice: вместе с
  rationale: Предлог обозначает включение левитов в общую перепись Израиля; «вместе с» ясно выражает эту связь.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Формально передаёт мужское множественное בְּנֵי и сохраняет традиционное заветное наименование народа без нейтрализации.
theological_decisions:
- issue: Объём исключения левитов из переписи
  choice: не исчислять колено Левия и не включать его численность в общий подсчёт сынов Израиля
  alternative: понимать два запрета как указание на разные административные действия
  rationale: Еврейские выражения близки по смыслу и в контексте подчёркивают исключение левитов из проводимой переписи; перевод не уточняет сверх текста причины или дальнейший особый порядок их учёта.
- issue: Родовое обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Еврейское выражение грамматически мужского рода и служит общепринятым обозначением народа. Формальная передача сохраняет его образ и заветный характер.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. «Колено», «исчисляй» и «сыны Израиля» придают тексту достоинство и близость к форме оригинала, не делая синтаксис тяжеловесным.
