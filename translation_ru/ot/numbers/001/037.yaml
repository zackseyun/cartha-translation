lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד обозначает людей, учтённых при переписи. «Исчисленных» сохраняет характерную для библейской переписи лексику и не добавляет отсутствующее непосредственно в стихе слово «мужчин».
- source_word: לְמַטֵּה
  choice: из колена
  rationale: Сочетание לְ с מַטֶּה в формуле переписи указывает на принадлежность к колену; по-русски естественно передать это как «из колена».
- source_word: בִנְיָמִן
  choice: Вениамина
  rationale: Употреблена традиционная русская форма имени в родительном падеже после слова «колена».
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: тридцать пять тысяч четыреста
  rationale: 'Число передано в обычном современном русском порядке с точным сохранением значения еврейского выражения: 35 400.'
