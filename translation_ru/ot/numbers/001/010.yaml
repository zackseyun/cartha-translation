  variant: modern literary Russian
source:
  edition: WLC
  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: ru
  text: 'Из сыновей Иосифа: от Ефрема — Елишама, сын Аммиуда; от Манассии — Гамалиил, сын Педацура.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Из сыновей Иосифа
  rationale: В контексте перечня предлог לְ вводит представителей соответствующей родовой группы. Русское «из сыновей Иосифа» естественно обозначает две происходящие от Иосифа ветви — Ефрема и Манассию — и сохраняет образ «сыновей».
- source_word: לְאֶפְרַיִם
  choice: от Ефрема
  rationale: Здесь לְ указывает, какую ветвь представляет названный человек. «От Ефрема» лаконично и естественно для русского перечня; добавление «колена» было бы пояснительным.
- source_word: אֱלִישָׁמָע
  choice: Елишама
  rationale: Личное имя передано транслитерацией с еврейского; форма сохраняет конечную гласную имени.
- source_word: בֶּן
  choice: сын
  rationale: 'Конструктивная связь прямо обозначает происхождение: «сын Аммиуда».'
- source_word: עַמִּיהוּד
  choice: Аммиуд
  rationale: Личное имя передано в принятой русской библейской форме, близкой к еврейскому звучанию.
- source_word: לִמְנַשֶּׁה
  choice: от Манассии
  rationale: Передано параллельно выражению «от Ефрема», сохраняя симметрию еврейского перечня.
- source_word: גַּמְלִיאֵל
  choice: Гамалиил
  rationale: Использована узнаваемая русская библейская форма еврейского личного имени.
- source_word: פְּדָהצוּר
  choice: Педацур
  rationale: Имя транслитерировано с еврейского; צ передано как «ц», а צור — как «цур».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной лаконичностью списочного текста. Параллелизм двух ветвей Иосифа сохранён с помощью конструкции «от … — …»; имена переданы последовательно и без истолкования их значений.
