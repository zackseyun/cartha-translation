base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ru
  text: 'Для сынов Завулона: по их родам, по их кланам, по домам их отцов, по числу имён — все мужчины от двадцати лет и старше, годные к военной службе[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходящие в войско».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Для сынов Завулона
  rationale: Предлог ל вводит очередной раздел переписной формулы; «для сынов» сохраняет её административную повторяемость, а традиционная русская форма имени — «Завулон».
- source_word: תּוֹלְדֹתָם
  choice: по их родам
  rationale: В контексте переписи слово обозначает распределение по происхождению; «по их родам» естественно передаёт генеалогический смысл.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их кланам
  rationale: Термин обозначает крупные родственные подразделения племени; «кланы» позволяет отличить их от более узких домашних объединений.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Сохранено техническое выражение о патрилинейных родовых домах без замены более общим словом «семьи».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Формальное выражение указывает на поимённый подсчёт; буквальная образность сохранена.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Современная и точная русская формула возрастного порога.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все мужчины, способные выходить на войну
  rationale: Контекст определяет мужской состав военной переписи. Формулировка сохраняет исходную идиому «выходить на войну», одновременно ясно выражая пригодность к службе.
theological_decisions:
- issue: Мужской и военный охват переписи
  choice: все мужчины, способные выходить на войну
  alternative: все пригодные к военной службе
  rationale: Перепись охватывает взрослых мужчин, подлежащих военному выходу. Выбранный вариант не нейтрализует пол и не сводит образное еврейское выражение только к административной категории.
translation_notes:
  register: Современный литературный русский с сохранением размеренного административно-генеалогического строя стиха. Двоеточие после названия племени и тире перед итоговой группой делают длинное перечисление ясным, не устраняя синтаксическую формульность оригинала.
