  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «YHWH»; традиционно передаётся как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с последовательным וַ продвигает повествование. В русской библейской повествовательной речи естественно «И … сказал»; глагол דבר в формуле введения прямой речи здесь передаётся как «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет её титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи, обозначенного еврейским предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно и без смысловой потери выполняет двоеточие; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. «Яхве» сохраняет это различие; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формульное לֵאמֹר передано пунктуационно, чтобы избежать неестественного «говоря»; двоеточие предполагает продолжение прямой речи в следующем стихе.
