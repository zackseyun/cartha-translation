base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: ru
  text: 'Из сыновей Гада, по родам их, по кланам их, по отцовским домам их, по числу имён, от двадцати лет и старше, — всех, пригодных к военной службе:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Сыновья Гада
  rationale: Предлог ל вводит раздел переписной формулы; русская именная конструкция естественно служит заголовком, а «сыновья» сохраняет еврейскую идиому и мужской состав учитываемой группы.
- source_word: תּוֹלְדֹתָם
  choice: по их родам
  rationale: В данном контексте слово указывает на происхождение и родовую принадлежность, а не обязательно на письменные родословные.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их кланам
  rationale: «Кланы» обозначают подразделения племени точнее, чем современное «семьи», и отличают их от более крупного родового уровня.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохранён технический термин патрилинейной структуры древнего Израиля; формулировка прозрачна и не заменяет его более общим понятием.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Близко передаёт поимённый характер подсчёта, не добавляя отсутствующего в тексте «один за другим».
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога, точно передающая смысл еврейского выражения.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все выходящие на войну
  rationale: Формально передаёт причастную конструкцию и сохраняет возможность понимать צבא как войско, военный поход или службу, не вводя прямо отсутствующее слово «способные».
theological_decisions:
- issue: Означает ли כֹּל יֹצֵא צָבָא фактическое участие или пригодность к военной службе
  choice: все выходящие на войну
  alternative: все годные к военной службе
  rationale: Исходная причастная формула буквально говорит о выходящих в войско/на войну. В контексте переписи она подразумевает воинскую категорию, но прямое добавление «годные» сильнее устраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с сохранением торжественной и формульной структуры переписного списка. Двоеточие оставлено, поскольку стих синтаксически ведёт к числу в следующем стихе.
