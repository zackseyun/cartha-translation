    rationale: Переписная формула определяет мужчин воинского возраста, относящихся к военной службе; «пригодных к военной службе» передаёт контекстуальное значение точнее.
  - severity: low
    issue: Начальное «Сыновья Гада» стоит в именительном падеже.
    rationale: Стих синтаксически продолжается итоговым числом в следующем стихе; «Из сыновей Гада» лучше сохраняет зависимую конструкцию и естественнее читается по-русски.
