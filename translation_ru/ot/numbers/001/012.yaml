  yaml_path: translation/ot/numbers/001/012.yaml
  text: 'For Dan: Ahiezer son of Ammishaddai.'
translation:
  language: ru
  text: От Дана — Ахиезер, сын Аммишаддая.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָן
  choice: От Дана
  rationale: Предлог לְ в перечне указывает, какой коленнической группе принадлежит названный представитель. По-русски «От Дана» кратко и естественно сохраняет структуру списка, не добавляя отсутствующего в еврейском тексте слова «колено».
- source_word: אֲחִיעֶזֶר
  choice: Ахиезер
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: Существительное בֶּן в именной формуле прямо обозначает сыновнее происхождение; русское «сын» точно и естественно.
- source_word: עַמִּישַׁדָּי
  choice: Аммишаддай
  rationale: Личное имя передано транслитерацией с сохранением удвоенного согласного и элемента «Шаддай».
theological_decisions: []
translation_notes:
  register: Лаконичная, dignified формула перечня. Тире помогает естественно оформить бессказуемую конструкцию по-русски; слово «колено» не добавляется.
