  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ru
  text: 'Сыновья Дана — по их родословиям, по родам, по отцовским домам, по числу имён, от двадцати лет и старше, — все мужчины, способные выступить на войну[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все годные к военной службе». Буквально еврейское выражение говорит о выходе на войну.'
    reason: Лексическая альтернатива поясняет идиоматический смысл, сохраняя буквальный образ основного текста.
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Сыновья Дана
  rationale: Предлог ל вводит очередной раздел переписи; краткая конструкция сохраняет характер заголовка и прямо передаёт мужской состав военной переписи.
- source_word: תּוֹלְדֹתָם
  choice: по их родословиям
  rationale: В контексте переписи слово обозначает генеалогическую принадлежность, а не просто потомство.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по родам
  rationale: «Роды» естественно обозначает крупные родственные объединения и не смешивает их с отцовскими домами.
- source_word: לְבֵית אֲבֹתָם
  choice: по отцовским домам
  rationale: Сохранён технический термин родоплеменной организации Израиля; «отцовские» звучит в современном русском естественнее буквального «домам отцов».
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: по числу имён
  rationale: Формулировка близко передаёт поимённый подсчёт, не заменяя образ исходного текста пояснительным словом «поимённо».
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога точно передаёт смысл еврейского выражения.
- source_word: כֹּל יֹצֵא צָבָא
  choice: все мужчины, способные выходить на войну
  rationale: Передан функциональный смысл военной пригодности, при этом сохранён образ буквального выхода на войну; мужское указание ясно из формы возрастной формулы и контекста переписи.
theological_decisions:
- issue: Гендерная отнесённость участников военной переписи
  choice: все мужчины, способные выходить на войну
  alternative: все способные выходить на войну
  rationale: Контекст и мужская форма возрастного определения относятся к мужчинам, подлежащим военной переписи; нейтральная формулировка могла бы скрыть это ограничение.
- issue: Значение выражения יֹצֵא צָבָא
  choice: способные выходить на войну
  alternative: годные к военной службе
  rationale: Основной текст сохраняет конкретный еврейский образ, а более обобщённое понимание приводится в примечании без устранения смыслового оттенка.
translation_notes:
  register: Современный литературный русский язык с размеренным, формульным ритмом переписи. Повторяющиеся конструкции с «по» сохраняют структуру исходного текста; двоеточие указывает на продолжение и численный итог в следующем стихе.
