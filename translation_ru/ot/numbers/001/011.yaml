lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: От Вениамина
  rationale: Предлог לְ в контексте перечня вводит представителя колена. Русское «от Вениамина» естественно и лаконично передаёт принадлежность представителя, не добавляя отсутствующего в еврейском тексте слова «колено».
- source_word: אֲבִידָן
  choice: Авидан
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: Конструктивная форма обозначает сыновство; в именной формуле естественно русское «сын».
- source_word: גִּדְעֹנִי
  choice: Гидеони
  rationale: Личное имя передано принятой русской библейской транслитерацией, сохраняющей отличие от имени Гедеон.
theological_decisions: []
