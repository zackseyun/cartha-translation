lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד с местоименным суффиксом указывает на людей, учтённых при переписи. «Исчисленных» точно передаёт устойчивую формулу этой главы и сохраняет достоинство библейского повествования.
- source_word: לְמַטֵּה
  choice: из колена
  rationale: В переписной формуле сочетание לְ с מַטֶּה обозначает принадлежность к племенной группе. «Из колена» — естественная и традиционно понятная русская передача.
- source_word: אֶפְרָיִם
  choice: Ефрема
  rationale: Нормативная русская форма имени в родительном падеже после слова «колена».
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: сорок тысяч пятьсот
  rationale: Точная передача количественного числительного словами, уместная в связном библейском тексте.
