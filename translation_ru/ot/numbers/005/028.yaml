    issue: «то останется невредимой» для וְנִקְּתָה
    rationale: Формулировка выводит на первый план физическую сохранность, которой в самом глаголе нет. Нифаль נקה обозначает быть чистой от обвинения, свободной или оправданной; непосредственный перевод должен сохранить этот аспект.
  revised_text: Но если женщина не осквернилась и чиста, то будет оправдана и зачнёт ребёнка[a].
