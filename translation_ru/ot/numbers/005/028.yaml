  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: ru
  text: Но если женщина не осквернилась и чиста, то будет оправдана и зачнёт ребёнка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет засеяна семенем»; это еврейская идиома, означающая зачатие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условный союз вводит противоположный предыдущему стиху случай; «но если» естественно передаёт контраст в контексте.
- source_word: לֹא נִטְמְאָה
  choice: не осквернилась
  rationale: Нифаль глагола טמא может обозначать состояние или наступление нечистоты. Возвратная форма по-русски естественно выражает нравственно-половое осквернение, о котором идёт речь, не уточняя сверх текста способ действия.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Прямой современный эквивалент определённого существительного; определённость понятна из контекста.
- source_word: וּטְהֹרָה הִוא
  choice: и чиста
  rationale: Сохраняет лексику чистоты и краткую именную конструкцию еврейского текста, не усиливая её до абсолютной нравственной безупречности.
- source_word: וְנִקְּתָה
  choice: то останется невредимой
  rationale: Нифаль от נקה здесь указывает на освобождение от пагубного последствия проклятия. «Останется невредимой» естественно соответствует непосредственному контексту испытания, хотя слово допускает также оттенки оправдания или освобождения.
- source_word: וְנִזְרְעָה זָרַע
  choice: и зачнёт ребёнка
  rationale: Буквальное выражение «будет засеяна семенем» является идиомой зачатия. Русская формулировка передаёт именно зачатие, не расширяя его до рождения или общего обладания потомством.
theological_decisions:
- issue: Смысл результата для невиновной женщины
  choice: Она не пострадает от проклятия и зачнёт ребёнка.
  alternative: Она будет формально оправдана и сохранит способность к деторождению вообще.
  rationale: Контекст противопоставляет пагубное действие проклятия над виновной его отсутствию у чистой женщины. Последняя еврейская идиома прямо связана с зачатием; перевод не превращает её ни в обещание рождения, ни только в отвлечённое утверждение о фертильности.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Ритуально-нравственная лексика сохранена без архаизмов; непривычная буквальная идиома разъяснена в сноске.
