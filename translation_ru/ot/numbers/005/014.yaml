  - marker: b
    text: 'Буквально: «и она не осквернилась». Слово «хотя» передаёт подразумеваемое противопоставление во втором возможном случае.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: и им овладеет
  rationale: Сочетание עָבַר עַל с רוּחַ описывает сильный внутренний порыв, находящий на человека. «Им овладеет» естественно передаёт силу этого переживания, не сводя его к нейтральному состоянию.
- source_word: רוּחַ קִנְאָה
  choice: дух ревности
  rationale: Сохранено слово «дух», поскольку רוּחַ может обозначать дух или внутреннее побуждение; קִנְאָה в данном брачном контексте означает ревность.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: и он станет ревновать свою жену
  rationale: Порода пиэль выражает наступившую ревнивую реакцию мужа. Оборот «ревновать свою жену» соответствует современному русскому употреблению и сохраняет последовательность действий.
- source_word: נִטְמָאָה
  choice: осквернила себя
  rationale: Глагол употребляет язык нечистоты, однако в контексте закона речь идёт о предполагаемой половой неверности. Возвратное выражение передаёт участие самой женщины в поступке, не ограничивая смысл лишь обрядовой нечистотой.
- source_word: אוֹ
  choice: или
  rationale: Частица вводит второй, альтернативный случай в правовом установлении; русское «или» передаёт это непосредственно.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: хотя она не осквернила себя
  rationale: Еврейский союз буквально означает «и», но здесь по смыслу противопоставляет необоснованную ревность действительной невиновности жены. «Хотя» ясно выражает контраст, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Характер нечистоты в законе о подозрении в супружеской неверности
  choice: «осквернила себя»
  alternative: «стала нечиста» или «была осквернена»
  rationale: Контекст связывает нечистоту с предполагаемой супружеской неверностью, а не только с обрядовым состоянием. При этом сноска сохраняет более широкую лексику нечистоты исходного текста.
- issue: Обоснованная и необоснованная ревность мужа
  choice: Во втором случае передать контраст словом «хотя»
  alternative: Буквальное «и она не осквернила себя»
  rationale: 'Перевод не объявляет подозрение истинным: еврейский текст явно предусматривает обе возможности. «Хотя» выявляет заложенный в правовой конструкции контраст, не разрешая его заранее.'
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства правового библейского стиля. Повтор исходного текста сохранён; «дух ревности» оставлен как значимый и несколько неоднозначный образ, тогда как глагольное выражение сделано естественным для русского читателя.
