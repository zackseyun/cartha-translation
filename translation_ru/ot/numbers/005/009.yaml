source:
  edition: WLC
  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: ru
  text: И всякое приношение из всех святынь сынов Израиля[a], которое они приносят священнику, будет принадлежать ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: приношение
  rationale: Слово обозначает отделённый и передаваемый дар, нередко положенную священнику долю. «Приношение» естественно в русском библейском контексте и не вводит узкотехнического смысла.
- source_word: קָדְשֵׁי
  choice: святыни
  rationale: Форма множественного числа в сопряжённом состоянии обозначает посвящённые Богу предметы или дары. «Святыни» кратко и естественно передаёт эту категорию, не сводя её только к жертвам.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняется буквальный семейно-родовой образ еврейского выражения; более плавный вариант «израильтян» указан в примечании.
- source_word: יַקְרִיבוּ
  choice: приносят
  rationale: В породе хифиль глагол в культовом контексте значит «приближать, представлять, приносить». Русское «приносят» естественно передаёт культовое действие, тогда как буквальное «приближают» здесь звучало бы неясно.
- source_word: לַכֹּהֵן
  choice: священнику
  rationale: Предлог указывает на получателя священного дара; дательный падеж естественно передаёт это отношение по-русски.
- source_word: לוֹ יִהְיֶה
  choice: будет принадлежать ему
  rationale: Еврейская конструкция выражает установленное право владения. Такой перевод яснее по-русски, чем буквальное «будет его».
theological_decisions:
- issue: Обозначение общины завета בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Сохранён мужской родовой термин исходного текста без превращения его в нейтральное этническое обозначение; при этом в примечании дан естественный русский эквивалент.
translation_notes:
  register: Современный литературный русский с умеренно торжественным звучанием. Синтаксис сохраняет юридически-нормативный характер стиха, но избегает неестественной кальки «приближают к священнику».
