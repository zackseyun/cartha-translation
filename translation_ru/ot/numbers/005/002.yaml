base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: ru
  text: Вели сынам Израиля выслать из стана всякого, у кого кожное поражение[a], всякого, у кого телесное истечение, и всякого, кто нечист из-за мёртвого тела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякого прокажённого». Еврейское слово обозначает различные серьёзные поражения кожи в законах о ритуальной чистоте, а не обязательно современную лепру (болезнь Хансена).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «нечистого из-за человека (души)»; в данном контексте это выражение обозначает ритуальную нечистоту, связанную с мёртвым телом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Вели
  rationale: Форма повелительного наклонения в единственном числе обращена к Моисею; «вели» передаёт обязательную силу распоряжения и звучит естественно в русском повествовании.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет образ и грамматическую форму еврейского выражения «сыны Израиля», обозначающего народ завета как целое.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: выслать из стана
  rationale: Передаёт удаление за пределы лагеря без добавления карательного оттенка; «стан» соответствует библейскому контексту кочующего Израиля.
- source_word: כָּל צָרוּעַ
  choice: всякого, у кого кожное поражение
  rationale: צָרוּעַ обозначает человека с серьёзным кожным поражением в контексте ритуального закона и не обязательно больного современной проказой.
- source_word: וְכָל זָב
  choice: всякого, у кого истечение
  rationale: «Истечение» кратко и точно передаёт телесное выделение, подразумеваемое термином в законах о ритуальной чистоте.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: всякого, кто нечист из-за умершего
  rationale: Передаёт идиоматическое значение нечистоты, возникшей в связи с умершим человеком, сохраняя человеческую отнесённость נֶפֶשׁ и не сводя выражение только к явно названному прикосновению.
theological_decisions:
- issue: Значение ритуальной нечистоты
  choice: «нечист» как обозначение культового статуса
  alternative: «осквернён» или нравственно виновен
  rationale: В данном постановлении речь идёт о ритуальном состоянии и святости стана, а не о нравственной виновности человека.
- issue: Степень конкретизации טָמֵא לָנָפֶשׁ
  choice: «нечист из-за умершего»
  alternative: «осквернившийся прикосновением к мёртвому телу»
  rationale: Источник называет основание нечистоты, но в самом стихе не уточняет способ её возникновения; выбранный вариант не добавляет непременно прямого прикосновения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой («сыны Израиля», «стан»). Синтаксис сделан ясным и пригодным для публичного чтения; ритуально-правовые термины переданы без медицинской анахронизации и без нравственной окраски.
