  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В формуле введения прямой речи глагол דבר естественно передаётся по-русски словом «сказал»; повествовательная форма указывает на новое речевое событие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В современном русском двоеточие перед последующей прямой речью естественно выполняет функцию еврейской вводной формулы «говоря» и избегает тяжеловесного повтора «сказал… говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохраняется как имя, а не заменяется титулом; форма «Яхве» соответствует принятой современной научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная формула введения прямой речи. Двоеточие показывает, что содержание речи следует далее.
