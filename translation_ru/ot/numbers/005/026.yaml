base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: ru
  text: И пусть священник возьмёт из хлебного приношения горсть — его памятную часть — и сожжёт её на жертвеннике; после этого пусть даст женщине выпить воду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָמַץ
  choice: пусть возьмёт полную горсть
  rationale: В жертвенном контексте קמץ обозначает ритуальное взятие горсти из приношения. Такая передача естественна по-русски и сохраняет конкретное действие.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычный русский эквивалент термина כֹּהֵן в культовом и правовом контексте.
- source_word: מִן הַמִּנְחָה
  choice: из хлебного приношения
  rationale: В священническом жертвенном контексте מִנְחָה означает приношение из муки или зерна; «хлебное приношение» — понятный и устоявшийся русский термин.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: его памятную часть
  rationale: אַזְכָּרָה — часть хлебного приношения, сжигаемая на жертвеннике как памятная часть; местоимение женского рода в еврейском относится к מִנְחָה, но в русском согласуется с «приношением».
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: и сожжёт её на жертвеннике
  rationale: В жертвенном употреблении הקטיר означает сжечь приношение, вознеся его дым. Направительная форма הַמִּזְבֵּחָה естественно передаётся как «на жертвеннике»; объект восстановлен из предыдущего выражения.
- source_word: וְאַחַר
  choice: после этого
  rationale: Передаёт временную последовательность ритуальных действий без добавочного толкования.
- source_word: יַשְׁקֶה
  choice: пусть даст ... выпить
  rationale: Каузативная порода глагола שׁקה означает «дать пить, напоить». Формулировка сохраняет каузативность и звучит естественно в современном русском.
- source_word: אֶת הָאִשָּׁה
  choice: женщине
  rationale: При конструкции «дать выпить» прямой объект еврейского каузатива естественно передаётся русским дательным падежом.
- source_word: אֶת הַמָּיִם
  choice: воду
  rationale: В данном стихе стоит только הַמָּיִם, «воду», без определения «горькую»; контекстуальное определение не внесено в основной текст.
theological_decisions:
- issue: Следует ли назвать воду «горькой» на основании ближайшего контекста
  choice: Сохранить простое «воду»
  alternative: «горькую воду»
  rationale: В самом стихе употреблено только הַמָּיִם («воду»). Добавление определения из соседних стихов устранило бы различие между формулировкой данного стиха и более широким контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и ритуального предписания. Побудительно-нормативное «пусть» передаёт последовательные глагольные формы в законодательном контексте. Терминология остаётся понятной без конфессионально специфических добавлений.
