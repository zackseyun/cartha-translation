base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: ru
  text: и мужчина ляжет с ней с излиянием семени[a], и это будет скрыто от глаз её мужа, и она будет скрыта, и станет нечистой, и свидетеля о ней не будет[b], и она не будет застигнута[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лежание семени»; то есть половое сношение с излиянием семени.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свидетеля против неё не будет».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «она не будет схвачена». Некоторые понимают это как указание на то, что её не принудили силой.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: и другой мужчина ляжет с ней
  rationale: Глагол שׁכב с прямым дополнением в данном контексте обозначает половое сношение. Слово «другой» естественно передаёт подразумеваемое отличие этого мужчины от мужа, не меняя участников правовой ситуации.
- source_word: שִׁכְבַת זֶרַע
  choice: излив семя
  rationale: Передаёт телесный смысл выражения, буквально связанного с «лежанием семени», яснее и естественнее по-русски, чем калька, и сохраняет значимую для законов о чистоте конкретность.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: но это будет скрыто от глаз её мужа
  rationale: Сохранены пассивный оттенок נעלם и древнееврейский образ «от глаз»; союз «но» естественно выражает противопоставление обстоятельств, заложенное в последовательности предложений.
- source_word: וְנִסְתְּרָה
  choice: и она утаится
  rationale: 'Возвратная форма сохраняет возможный пассивно-рефлексивный смысл нифаля: женщина оказывается скрытой или действует тайно. Перевод не превращает это однозначно в активное сокрытие поступка.'
- source_word: וְהִיא נִטְמָאָה
  choice: и станет нечистой
  rationale: «Нечистой» сохраняет категорию чистоты в законодательном контексте и не усиливает выражение до эмоционально окрашенного «осквернится».
- source_word: וְעֵד אֵין בָּהּ
  choice: а свидетеля против неё не будет
  rationale: Передаёт юридический смысл отсутствия свидетельства, изобличающего женщину; возможное более нейтральное понимание отмечено в сноске.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: и она не будет застигнута
  rationale: В контексте отсутствия доказательств נתפשׂ вероятнее всего означает, что её не застали или не поймали. «Застигнута» допускает подразумеваемое «на месте» без добавления этих слов в текст.
theological_decisions:
- issue: Характер нечистоты в נִטְמָאָה
  choice: станет нечистой
  alternative: осквернится
  rationale: Основной вариант удерживает лексику чистоты, важную для данного законодательного раздела, и не сводит её без пояснения только к нравственной оценке.
- issue: Значение לֹא נִתְפָּשָׂה
  choice: не будет застигнута
  alternative: не будет схвачена; не подвергнется насилию
  rationale: Ближайший контекст говорит об отсутствии свидетеля и обнаружения, поэтому основным принято значение «не застигнута». Возможный смысл схватывания или принуждения сохранён в сноске, а не исключён.
- issue: Залог и субъект וְנִסְתְּרָה
  choice: она утаится
  alternative: она будет сокрыта; это останется в тайне
  rationale: Форма нифаля допускает пассивный либо возвратный оттенок. Выбранная формулировка сохраняет эту напряжённость лучше, чем однозначное «она скроет это».
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, юридически-библейским звучанием. Синтаксис сохраняет незавершённость условной части исходного предложения; поэтому стих оканчивается тире. Архаизмы и эвфемистическая разговорность исключены.
