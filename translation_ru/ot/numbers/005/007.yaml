id: NUM.5.7
reference: Numbers 5:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: ru
  text: тогда пусть они исповедуют совершённый ими грех. Виновный пусть полностью возместит причинённый им ущерб[a], прибавит к нему пятую часть и отдаст всё тому, перед кем провинился[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אָשָׁם здесь может обозначать вину, возникшую из неё задолженность или сумму возмещения. Речь идёт о полном возврате основной суммы, а не о жертве повинности.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально — «тому, перед кем он стал виновен»; по смыслу: «тому, кого он обидел» или «пострадавшему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: тогда пусть они исповедуют
  rationale: Форма хитпаэль от ידה означает открыто признать или исповедать вину. «Пусть… исповедуют» сохраняет предписывающую силу, а «тогда» передаёт последовательность действий в контексте.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: совершённый ими грех
  rationale: חַטָּאת обозначает грех или проступок; сочетание с עשה естественно передаётся по-русски как «совершить грех».
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ
  choice: Виновный пусть… возместит причинённый им ущерб
  rationale: В данном контексте שוב в породе хифиль означает возвратить или возместить, а אָשָׁם — возникшую вследствие вины имущественную ответственность либо подлежащую возмещению сумму. Слово «ущерб» ясно передаёт несакральный характер выплаты; оттенок виновности сохранён словом «виновный» и заключительной фразой.
- source_word: בְּרֹאשׁוֹ
  choice: полностью
  rationale: Буквально «в его начале/основной сумме»; здесь это идиома, означающая возврат всей основной суммы до прибавления одной пятой.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: прибавит к нему пятую часть
  rationale: Точно передаёт требование добавить к основной сумме ещё одну пятую, то есть двадцать процентов.
- source_word: וְנָתַן
  choice: и отдаст всё
  rationale: נתן означает «дать, передать». «Всё» естественно обозначает основную сумму вместе с добавленной пятой частью.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: тому, перед кем провинился
  rationale: Формулировка сохраняет необычную еврейскую конструкцию, связывающую получателя возмещения с виной нарушителя, и при этом звучит естественно по-русски.
theological_decisions:
- issue: Значение אָשָׁם в контексте возмещения
  choice: вина или имущественная ответственность, выраженная в возмещении ущерба
  alternative: жертва повинности
  rationale: Непосредственный контекст говорит о возврате основной суммы, прибавлении одной пятой и передаче денег пострадавшему. Поэтому здесь אָשָׁם относится к ответственности и возмещению, а не к самой жертве повинности.
- issue: Переход от множественного числа к единственному
  choice: 'сохранить: «они исповедуют», затем «виновный… возместит»'
  alternative: унифицировать всё предложение в единственном или множественном числе
  rationale: 'Такой переход присутствует в еврейском тексте: коллективное предписание выражено множественным числом, а обязанность конкретного виновного — единственным. Перевод не устраняет эту особенность.'
translation_notes:
  register: Современный литературный русский язык с ясной юридико-религиозной формулировкой. Синтаксис достоинственный, но доступный; сохранены предписывающая сила, смена числа и связь между виной и возмещением.
