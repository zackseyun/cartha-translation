base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: ru
  text: 'И священник приведёт женщину к присяге, сопровождаемой проклятием[a], и скажет ей: «Да сделает тебя Яхве проклятием и клятвой среди твоего народа, когда Яхве сделает твоё бедро иссохшим[b], а живот — вздутым[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение можно понимать идиоматически: женщина станет среди своего народа примером, на который будут ссылаться, произнося проклятия и клятвы.'
    reason: lexical_alternative
  - marker: b
    text: Буквально это трудное еврейское выражение содержит образ «падения» или «опадания» бедра. Оно может означать усыхание или разрушение этой части тела либо быть эвфемизмом, относящимся к репродуктивным органам.
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может означать «живот», «чрево», а в некоторых контекстах — «матку». Точный телесный или репродуктивный эффект проклятия остаётся спорным.
    reason: lexical_alternative
