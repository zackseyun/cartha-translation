- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: клятвой проклятия
  rationale: Сочетание сохраняет оба элемента еврейской конструкции — клятву и проклятие — и её торжественно-правовой характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: проклятием и клятвой
  rationale: Формально близкая передача сохраняет ритуальную формулу и не устраняет её неоднозначность; подразумеваемое употребление женщины как устрашающего примера разъяснено в сноске.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: среди твоего народа
  rationale: Естественная современная формулировка, сохраняющая общественный характер последствий.
- source_word: בְּתֵת
  choice: когда Яхве сделает так, что
  rationale: Предлог с инфинитивом передаёт обстоятельство осуществления проклятия; русская конструкция звучит естественно и сохраняет причинно-временную связь.
- source_word: יְרֵךְ ... נֹפֶלֶת
  choice: бедро усохнет
  rationale: יָרֵךְ буквально обозначает бедро, но может эвфемистически указывать на репродуктивные органы. Глагольный образ «падения» в данном контексте, вероятно, описывает увядание или разрушение; «усохнет» понятно по-русски, а буквальная трудность отмечена в сноске.
- source_word: בִּטְנֵךְ
  choice: живот
  rationale: בֶּטֶן может означать живот, чрево или матку. «Живот» сохраняет широкое телесное значение, не навязывая узкой медицинской интерпретации.
- source_word: צָבָה
  choice: вздуется
  rationale: Передаёт увеличение и болезненное раздувание живота естественным современным русским глаголом.
theological_decisions:
- issue: Степень конкретизации телесного проклятия
  choice: Сохранить образы бедра, которое усыхает, и живота, который вздувается, не называя это прямо выкидышем или бесплодием.
  alternative: Перевести как прямое указание на выкидыш, выпадение матки или утрату способности рожать.
  rationale: Еврейские выражения трудны и допускают репродуктивный смысл, но не устанавливают однозначного медицинского диагноза. Основной текст сохраняет телесную образность и напряжение оригинала, а возможный эвфемизм поясняется в сносках.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, уместным для юридико-обрядовой речи. Синтаксис остаётся ясным для обычного читателя; трудные и неоднозначные телесные выражения не получают чрезмерно конкретной медицинской интерпретации.
