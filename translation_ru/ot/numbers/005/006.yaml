base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: ru
  text: 'Скажи сынам Израиля: если мужчина или женщина совершит какой-либо из человеческих грехов[a], тем самым проявив неверность Господу, то этот человек виновен,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какой-либо из грехов человечества». Еврейское выражение также может пониматься как «какой-либо грех против человека».'
    reason: Сохраняет обобщённое значение אָדָם, отражённое в английской аудиторской версии, и отмечает контекстуально возможное альтернативное понимание спорной конструкции.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Скажи
  rationale: Форма повелительного наклонения в прямом Божьем обращении; «скажи» естественно вводит передаваемое народу постановление.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет семейно-заветный образ исходного выражения и звучит достойно в русском библейском повествовании.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: мужчина или женщина
  rationale: Прямо сохраняет указанную в еврейском тексте пару и показывает, что постановление относится к обоим полам.
- source_word: כִּי יַעֲשׂוּ
  choice: если ... совершит
  rationale: כִּי вводит правовой случай; множественное יַעֲשׂוּ после распределительного «мужчина или женщина» естественно передаётся по-русски единственным числом.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: какой-либо человеческий грех
  rationale: הָאָדָם имеет обобщённое значение — человек, человечество; выбранная формулировка передаёт любой грех, совершаемый людьми, без мужской спецификации.
- source_word: לִמְעֹל מַעַל
  choice: тем самым проявив неверность
  rationale: Сочетание инфинитива с однокоренным существительным обозначает серьёзное нарушение верности; по-русски смысл естественно выражается без буквального повтора.
- source_word: בַּיהוָה
  choice: Господу
  rationale: При מָעַל предлог указывает на того, против кого направлено нарушение верности; русское управление «неверность кому» требует дательного падежа.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: и этот человек окажется виновен
  rationale: נֶפֶשׁ здесь означает конкретного человека, а אָשֵׁם — состояние виновности и ответственности; будущий результат условия передан формой «окажется».
theological_decisions:
- issue: Передача יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача тетраграмматона сохраняет благоговейный регистр и не вводит спорную реконструкцию произношения.
- issue: Обобщённое значение הָאָדָם
  choice: человеческий грех
  alternative: грехи человека / грехи человечества
  rationale: Контекст не ограничивает проступки мужчинами; прилагательное «человеческий» ясно и естественно сохраняет родовое значение.
- issue: Связь проступка с неверностью Господу
  choice: тем самым проявив неверность Господу
  alternative: чтобы совершить преступление против Господа
  rationale: Формулировка сохраняет заветный оттенок מָעַל и показывает, что названный человеческий грех одновременно является неверностью Господу, не сужая его до отдельной категории культовых нарушений.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис оставлен незавершённым запятой, поскольку стих 6 образует условную предпосылку, продолжение которой следует в стихе 7. Архаичное «сынам Израиля» сохранено ради семейно-заветного образа; остальная лексика современна и общепонятна.
