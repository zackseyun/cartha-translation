base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: ru
  text: Затем священник возьмёт из руки женщины зерновое приношение ревности, совершит над ним обряд возношения перед Яхве и поднесёт его к жертвеннику.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... возьмёт
  rationale: Вав с перфектом продолжает последовательность предписанных обрядовых действий; будущее совершенного вида естественно передаёт инструктивное значение.
- source_word: מִיַּד הָאִשָּׁה
  choice: из рук женщины
  rationale: Естественный русский эквивалент еврейского оборота; множественное «из рук» идиоматично и обозначает непосредственную передачу.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: хлебное приношение ревности
  rationale: מִנְחָה в священническом контексте обозначает приношение из растительных продуктов, а определение הַקְּנָאֹת сохраняет связь обряда с ревностью.
- source_word: וְהֵנִיף
  choice: вознесёт
  rationale: Hифиль נוף обозначает особое ритуальное движение приношения пред Богом; «вознесёт» является кратким и традиционно понятным культовым термином.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет культовое значение «перед лицом / в присутствии» и передаёт тетраграмматон как личное имя.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: и поднесёт его к жертвеннику
  rationale: «Поднесёт ... к» передаёт каузативное значение קרב — приблизить, принести близко — без преждевременного отождествления с окончательным принесением жертвы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя Бога; «Яхве» прямо сохраняет это различие.
- issue: Значение обрядового глагола נוף
  choice: вознесёт
  alternative: поколеблет; совершит обряд возношения
  rationale: Точная форма ритуального движения не описана в самом стихе; «вознесёт» сохраняет специальный культовый смысл, не добавляя подробностей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной культовой лексикой. Синтаксис сохраняет последовательность трёх предписанных действий; «это приношение» устраняет возможную неясность повтора, не меняя референта.
