  to: Священник подведёт её и поставит её перед Яхве[a].
  rationale: Будущая форма «подведёт… поставит» сохраняет процедурно-предписывающий характер еврейского текста без дополнительного побудительного оттенка. Повторение местоимения после «поставит» ясно отражает суффикс 3-го лица женского рода при обоих глаголах. Сноска исправлена так, чтобы не называть основное чтение «Яхве» альтернативой самому себе и нейтрально отмечать традиционную передачу имени.
