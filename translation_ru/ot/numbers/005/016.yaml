  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: ru
  text: Священник подведёт её и поставит её перед Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH», четыре согласные Божественного имени. Традиционная передача в русских переводах: «ГОСПОДЬ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: подведёт её
  rationale: Глагол קרב в породе хифиль означает «приблизить, подвести». В данном контексте пространственное значение естественно передаётся глаголом «подвести», без добавления технического смысла принесения жертвы.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное соответствие для כֹּהֵן в культовом и правовом контексте.
- source_word: וְהֶעֱמִדָהּ
  choice: поставит
  rationale: Хифиль от עמד имеет каузативное значение «поставить, сделать так, чтобы стояла». Русское «поставит» естественно и сохраняет этот смысл.
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и точно обозначает положение в присутствии кого-либо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя; традиционная замена титулом отмечена в сноске.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, а традиционная передача титулом приводится в сноске без навязывания конфессионального прочтения.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным библейским регистром. Формула «пусть… подведёт… и поставит» естественно передаёт предписывающую функцию древнееврейских форм с союзом וְ в данном законодательном контексте.
