base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: ru
  text: Священник поставит женщину перед Яхве, распустит ей волосы[a] и положит ей на ладони хлебное приношение для напоминания — это хлебное приношение ревности. А в руке священника будет горькая вода, наводящая проклятие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обнажит голову женщины»; также возможно: «даст её волосам свободно свисать». Еврейский оборот буквально говорит об обнажении или распускании волос женщины и, вероятно, подразумевает распускание волос как часть обряда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «горькая вода, наводящая это проклятие». Еврейское причастие описывает воду как вызывающую или приводящую проклятие в действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: поставит
  rationale: Каузативная форма глагола עמד обозначает ритуальное поставление женщины перед Яхве; «поставит» естественно и сохраняет конкретность действия.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Культовое выражение означает пребывание в присутствии Бога; личное имя יהוה передано как «Яхве».
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: распустит ей волосы
  rationale: Оборот буквально связан с освобождением или обнажением головы, но, вероятно, обозначает распускание прежде связанных волос. Выбранный вариант ясен по-русски, а неоднозначность отмечена в сноске.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: положит ей на ладони
  rationale: Кַּף конкретно обозначает ладонь; здесь женщина держит приношение на обеих ладонях. Формулировка сохраняет телесную деталь обряда.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: хлебное приношение для напоминания
  rationale: В священническом контексте מִנְחָה — приношение из зерновых продуктов; традиционное русское «хлебное приношение» понятно и не предполагает только цельного зерна. Конструкция с זִכָּרוֹן передаёт функцию напоминания, не уточняя, кому именно оно адресовано.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: это хлебное приношение ревности
  rationale: Формально множественное קְנָאֹת имеет абстрактный смысл; единственное «ревности» естественно в русском. Повтор названия приношения сохраняет еврейское приложение.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: А в руке священника будет
  rationale: Сохранены конкретное единственное число «рука» и сопутствующее обстоятельство обряда. Русское сказуемое согласовано с собирательно воспринимаемым словом «вода».
- source_word: מֵי הַמָּרִים
  choice: горькая вода
  rationale: Еврейское מַיִם грамматически имеет форму множественного числа, но обычно обозначает воду как вещество; в современном русском естественно единственное число.
- source_word: הַמְאָרֲרִים
  choice: несущая проклятие
  rationale: Причастие от ארר характеризует воду как вызывающую или осуществляющую проклятие. Формулировка сохраняет эту действенность, не уточняя её механизм.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Смысл «приношения для напоминания»
  choice: сохранить неопределённость адресата и действия напоминания
  alternative: приношение, напоминающее Богу; памятное приношение
  rationale: Сам стих не разъясняет, кого или о чём должно напомнить это приношение. Функциональная конструкция не разрешает богословскую неоднозначность за текст.
- issue: Действенность проклятия в выражении הַמְאָרֲרִים
  choice: несущая проклятие
  alternative: проклятая вода; вода проклятия
  rationale: Причастие скорее описывает воду как средство, приводящее проклятие в действие, а не просто как объект уже произнесённого проклятия.
translation_notes:
  register: Современный литературный русский с достоинством ритуально-правового текста. Синтаксис сделан ясным для обычного читателя; сохранены повтор «хлебное приношение» и конкретная деталь «в руке». Слово «ревность» оставлено как ключевой термин контекста, без конфессионального истолкования.
