  source_fidelity: 'Основной смысл передан точно: муж приводит жену к священнику и приносит относящееся к ней приношение; указаны десятая часть эфы ячменной муки, отсутствие масла и ладана, а также двойное обозначение приношения. Однако союз «или» между запретами может создать неверное впечатление выбора между маслом и ладаном, тогда как в еврейском тексте оба компонента отдельно запрещены.'
