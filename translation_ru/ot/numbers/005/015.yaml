  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: ru
  text: 'Муж должен привести свою жену к священнику и принести за неё её приношение: десятую часть эфы ячменной муки. Он не должен возливать на него масла и не должен класть на него ладана, потому что это хлебное приношение ревности, памятное приношение[a], напоминающее о беззаконии[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношение напоминания»; еврейское выражение можно понять более буквально как приношение, служащее напоминанием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «напоминающее о вине». Еврейское עָוֹן может обозначать беззаконие, вину или ответственность, возникающую вследствие проступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: Пусть муж приведёт свою жену
  rationale: В предписывающем контексте форма передана побудительной конструкцией. Хотя הָאִישׁ буквально означает «мужчина», сочетание с «свою жену» естественно указывает на мужа.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: её приношение за неё
  rationale: Сохранены принадлежность приношения женщине и то, что муж приносит его от её имени или по её делу.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: десятую часть эфы
  rationale: Древняя мера объёма сохранена транслитерацией без приблизительного пересчёта.
- source_word: קֶמַח שְׂעֹרִים
  choice: ячменной муки
  rationale: קֶמַח обозначает муку, а конструкция уточняет, что она изготовлена из ячменя.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Современное и ясное обозначение масла в составе хлебного приношения; архаическое «елей» не требуется контекстом.
- source_word: לְבֹנָה
  choice: ладан
  rationale: Обычное русское название ароматической смолы, употреблявшейся в богослужении.
- source_word: מִנְחַת קְנָאֹת
  choice: хлебное приношение ревности
  rationale: מִנְחָה в жертвенном контексте передано устойчивым выражением «хлебное приношение»; קְנָאֹת сохранено как «ревность» без сведения смысла только к подозрению или обвинению.
- source_word: מִנְחַת זִכָּרוֹן
  choice: памятное приношение
  rationale: Передаёт назначение приношения как служащего напоминанием, не уточняя сверх текста, перед кем и каким именно образом.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: напоминающее о беззаконии
  rationale: Причастная конструкция передана определительным оборотом. «Беззаконие» сохраняет нравственно-судебный диапазон עָוֹן, а примечание отмечает возможный смысл «вина».
theological_decisions:
- issue: Предполагает ли приношение виновность женщины
  choice: Описать назначение обряда, не утверждая заранее виновность или невиновность женщины.
  alternative: Передать выражение так, будто вина женщины уже установлена.
  rationale: Стих называет приношение напоминающим о עָוֹן, но сам по себе ещё не выносит решения по делу; перевод сохраняет эту напряжённость.
- issue: Значение קְנָאֹת в названии приношения
  choice: приношение ревности
  alternative: приношение ревнивого подозрения
  rationale: Более буквальная формулировка сохраняет широту еврейского слова и не ограничивает его лишь субъективным подозрением мужа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром законодательного и культового текста. Синтаксис сделан ясным для широкого читателя; древние реалии и ключевая ритуальная терминология сохранены.
