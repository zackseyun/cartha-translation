lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Вот закон
  rationale: Естественная русская формула, вводящая итоговое установление; сохраняет юридический смысл תּוֹרָה.
- source_word: הַקְּנָאֹת
  choice: о ревности
  rationale: Еврейское множественное число обозначает связанную с ревностью правовую процедуру; в современном русском единственное число звучит естественнее, а особенность формы отмечена в сноске.
- source_word: אֲשֶׁר
  choice: если
