- source_word: תִּשְׂטֶה
  choice: уклонится
  rationale: Сохраняет метафору отклонения от супружеской верности, не подменяя её прямым утверждением о прелюбодеянии.
- source_word: אִשָּׁה
  choice: жена
  rationale: Супружеское значение определяется последующим אִישָׁהּ — «её муж».
- source_word: תַּחַת אִישָׁהּ
  choice: от своего мужа
  rationale: В данном контексте תַּחַת выражает уклонение женщины из-под супружеской связи с мужем; буквальный образ и возможный оттенок власти пояснены в сноске.
- source_word: וְנִטְמָאָה
  choice: и осквернится
  rationale: Передаёт язык осквернения, не сужая его до одной лишь обрядовой нечистоты и не заменяя прямым термином «прелюбодействовать».
theological_decisions:
- issue: Характер осквернения в законе об испытании жены
  choice: осквернится
  alternative: станет нечистой; совершит прелюбодеяние
  rationale: טמא здесь употреблено в контексте предполагаемой супружеской неверности, но само слово сохраняет категорию осквернения. Перевод не ограничивает её только ритуальной нечистотой и не делает обвинение более прямым, чем еврейский текст.
- issue: Степень определённости супружеской неверности
  choice: уклонится ... и осквернится
  alternative: изменит мужу
  rationale: Сохраняется метафорическая и категориальная формулировка оригинала без богословского или юридического уточнения сверх текста.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной юридической формулировкой. Неестественный русский оборот «под своим мужем» вынесен в сноску; основной текст передаёт его контекстуальный смысл. Все маркеры сносок присутствуют в основном тексте.
