    rationale: Оборот приписывает превращение в горечь воде. לְמָרִים после «воды войдут в неё» скорее обозначает следствие или действие воды по отношению к женщине («для/во вред, как горечь»), а не изменение субстанции воды.
  - severity: low
    issue: «вода, наводящая проклятие»
    rationale: Формально возможно, но в современном литературном русском «несущая проклятие» естественнее и лучше передаёт характеристику воды как носителя/средства проклятия.
