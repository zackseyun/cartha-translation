  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: ru
  text: Затем он даст женщине выпить горькую воду, несущую проклятие, и эта несущая проклятие вода войдёт в неё, причиняя ей горечь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «войдёт в неё для горечи». Заключительное выражение может указывать на результат или пагубное действие воды.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: Затем он даст женщине выпить
  rationale: Порода хифиль от שׁקה передаёт понудительное значение «дать/позволить выпить». Оборот «даст … выпить» естественен по-русски и сохраняет ритуально-правовой характер действия.
- source_word: מֵי הַמָּרִים
  choice: горькую воду
  rationale: Буквально «воды горечи»; множественное число у слова «вода» является обычной особенностью древнееврейского языка. Русское единственное число звучит естественно и сохраняет смысл.
- source_word: הַמְאָרֲרִים
  choice: наводящую проклятие
  rationale: Причастие от ארר описывает воду как средство, через которое осуществляется проклятие, а не обязательно как воду, которая сама проклята.
- source_word: וּבָאוּ בָהּ
  choice: войдёт в неё
  rationale: Глагол בוא с предлогом ב обозначает вхождение воды внутрь женщины; перевод сохраняет телесный образ исходного текста.
- source_word: לְמָרִים
  choice: обернётся горечью
  rationale: Необычное выражение с לְ допускает значение результата или последствия. Такой перевод естественен по-русски, не уточняя сверх текста характер воздействия.
theological_decisions:
- issue: Характер проклятия, связанного с водой
  choice: вода, наводящая проклятие
  alternative: проклятая вода
  rationale: Причастная форма вероятнее обозначает действие или функцию воды как носителя проклятия в испытании. Это сохраняет судебно-ритуальный смысл и не представляет воду как магически проклятый предмет.
- issue: Смысл заключительного לְמָרִים
  choice: обернётся горечью
  alternative: войдёт в неё для горечи / войдёт в неё горько
  rationale: 'Исходное выражение кратко и неоднозначно: оно может указывать на результат, состояние или пагубное действие. Основной перевод передаёт результат, а сноска сохраняет более формальные варианты.'
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным регистраом. Сохранены повтор выражения «вода, наводящая проклятие» и намеренная неопределённость последней фразы; архаичные и конфессионально окрашенные формулировки не использованы.
