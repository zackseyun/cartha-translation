revisions:
- from: Затем он даст женщине выпить горькую воду, наводящую проклятие, и вода, наводящая проклятие, войдёт в неё и обернётся горечью.[a]
  to: Затем он даст женщине выпить горькую воду, несущую проклятие, и эта несущая проклятие вода войдёт в неё, причиняя ей горечь.[a]
  rationale: Исправлена заключительная фраза, чтобы не утверждать, будто вода «превращается» в горечь. Повтор определения воды сохранён, как в еврейском тексте; «несущая проклятие» обеспечивает естественную русскую форму без богословского переосмысления. Сноска сохраняет краткость и неоднозначность еврейского לְמָרִים.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:47:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начальная часть передана близко к древнееврейскому тексту: хифиль וְהִשְׁקָה уместно передан как «даст ... выпить», а повторное обозначение воды и её функции сохранено. Однако «обернётся горечью» меняет синтаксическую и смысловую связь заключительного לְמָרִים: создаётся впечатление, что сама вода превратится в горечь. В оригинале именно воды входят в женщину с результатом/действием «для горечи».'
  naturalness: «Наводящая проклятие» понятно, но несколько тяжеловесно и менее естественно, чем «несущая проклятие». Формула «войдёт в неё, причиняя ей горечь» современна и ясна; она не предполагает конкретного физиологического механизма.
  terminology: «Проклятие» точно передаёт корень ארר. «Несущая проклятие» отражает причастную форму как характеристику действия или назначения воды, не утверждая, будто вода сама является проклятой. Сноска должна сохранять более формальную, синтаксически неоднозначную возможность заключительного выражения.
