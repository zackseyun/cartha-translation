- issue: Гендерно маркированное обращение к народу завета
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Основной текст сохраняет мужской родственный термин, присутствующий в еврейском тексте, а сноска предлагает обычное современное обозначение всего народа.
- issue: Характер проступка жены
  choice: нарушит верность мужу
  alternative: поступит с ним вероломно
  rationale: Выбранный вариант сохраняет реляционный смысл מָעַל, не сводя его преждевременно лишь к конкретному половому акту; подробности следуют в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формула «обратись… и скажи» передаёт два еврейских глагола речи без неестественного русского повтора; условная конструкция оставлена незавершённой запятой, поскольку предложение продолжается в следующем стихе.
