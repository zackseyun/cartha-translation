- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный мужской родственный образ еврейского выражения; более идиоматичный вариант дан в сноске.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямо и естественно передаёт продолжение формулы обращения.
- source_word: אִישׁ אִישׁ
  choice: чья-либо
  rationale: Повтор существительного имеет распределительное значение «какой-либо мужчина»; в сочетании с последующим «его жена» это естественно выражается по-русски как «чья-либо жена».
- source_word: כִּי
  choice: если
  rationale: В казуистической правовой формулировке союз вводит условный случай.
- source_word: תִשְׂטֶה
  choice: собьётся с пути
  rationale: Сохраняет метафору уклонения, не уточняя преждевременно характер проступка, который раскрывается далее.
- source_word: אִשְׁתּוֹ
  choice: жена
  rationale: Принадлежность выражена русским неопределённым местоимением в сочетании «чья-либо жена».
- source_word: וּמָעֲלָה ... מָעַל
  choice: нарушит верность
  rationale: Передаёт смысл однокоренной глагольно-именной конструкции — вероломное нарушение доверия и верности — естественным современным русским выражением; особенность еврейской конструкции отмечена в сноске.
- source_word: בּוֹ
  choice: мужу
  rationale: В данном контексте местоимение указывает на мужа как на того, чья верность была нарушена. Повтор существительного устраняет возможную неясность русского местоимения «ему».
