id: NUM.5.8
reference: Numbers 5:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: ru
  text: Если же у этого человека нет близкого родственника[a], которому можно было бы возвратить причитающееся за вину, то возмещение за вину, возвращаемое Господу, принадлежит священнику[b], помимо барана для искупления, посредством которого будет совершено искупление за этого человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственника-выкупщика». Еврейское слово גֹּאֵל обозначает члена рода, на которого возлагались юридические обязанности по выкупу, восстановлению прав или получению возмещения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово אָשָׁם здесь означает возмещение, причитающееся вследствие вины, а не самого жертвенного барана: баран упомянут далее отдельно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: близкий родственник
  rationale: В данном правовом контексте слово обозначает члена рода, уполномоченного принять возмещение за пострадавшего. Такой перевод естественен по-русски, а юридическая функция поясняется в сноске.
- source_word: הָאָשָׁם
  choice: возмещение за вину / причитающееся за вину
  rationale: 'Здесь речь идёт о возмещении причинённого ущерба, а не о жертвенном баране: баран назван далее как отдельное приношение.'
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: возмещение за вину, возвращаемое
  rationale: Причастие от שוב сохраняет смысл возврата или возмещения и подчёркивает восстановительный характер выплаты.
- source_word: לַיהוָה
  choice: Господу
  rationale: Передаёт имя יהוה принятой в русском библейском регистре формой и сохраняет мысль о посвящении возмещения Богу.
- source_word: לַכֹּהֵן
  choice: принадлежит священнику
  rationale: В еврейской именной конструкции сказуемое подразумевается; явное «принадлежит» естественно выражает законного получателя.
- source_word: מִלְּבַד
  choice: помимо
  rationale: Показывает, что баран приносится дополнительно к возмещению, а не является самим возмещением.
- source_word: אֵיל הַכִּפֻּרִים
  choice: баран для искупления
  rationale: Естественная русская формулировка, ясно указывающая на назначение жертвы.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: посредством которого будет совершено искупление за этого человека
  rationale: Пассивная конструкция не вводит в основной текст явно названного исполнителя там, где еврейский текст оставляет его подразумеваемым, и ясно указывает на барана как средство искупления.
- source_word: לָאִישׁ
  choice: у этого человека
  rationale: Сохраняет конкретную отсылку к виновному лицу и звучит естественно в русском юридическом контексте.
theological_decisions:
- issue: Соотношение возмещения и жертвы
  choice: Денежное или имущественное возмещение отделено от жертвенного барана; баран требуется дополнительно.
  alternative: Понять אָשָׁם как саму жертву за вину.
  rationale: Слово מִלְּבַד («помимо») и отдельное упоминание барана показывают, что возмещение и искупительная жертва здесь различаются.
- issue: Кому передаётся возмещение при отсутствии родственника
  choice: Оно возвращается Господу и потому принадлежит священнику.
  alternative: Считать слова «Господу» и «священнику» двумя независимыми адресатами.
  rationale: Еврейская последовательность выражает посвящение возмещения Господу с его фактической передачей священнику.
- issue: Исполнитель обряда искупления
  choice: Исполнитель не назван прямо в переводе; использована пассивная конструкция.
  alternative: 'Уточнить: «которым священник совершит искупление».'
  rationale: В контексте подразумевается священник, однако пассивный перевод сохраняет степень явности исходного текста и не устраняет её без необходимости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридический смысл передан ясно, без архаизмов; повтор «возмещение за вину» намеренно сохраняет связь частей еврейской фразы. Форма «Господь» употреблена для יהוה.
