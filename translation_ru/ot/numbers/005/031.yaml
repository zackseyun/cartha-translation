id: NUM.5.31
reference: Numbers 5:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נִקָּ֥ה הָ/אִ֖ישׁ מֵ/עָוֺ֑ן וְ/הָ/אִשָּׁ֣ה הַ/הִ֔וא תִּשָּׂ֖א אֶת עֲוֺנָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: ru
  text: И муж будет свободен от вины, а та женщина понесёт свою вину.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесёт ответственность за своё беззаконие»; еврейское выражение может подразумевать также последствия вины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: будет свободен
  rationale: Нифаль глагола נקה обозначает освобождение от виновности или ответственности; сочетание «свободен от вины» естественно по-русски и сохраняет конструкцию с מִן.
- source_word: הָאִישׁ
  choice: муж
  rationale: אִישׁ буквально означает «мужчина», но в данном контексте речь идёт именно о муже в обряде ревнования. Русское «муж» одновременно естественно и контекстуально точно.
- source_word: מֵעָוֺן
  choice: от вины
  rationale: עָוֹן может обозначать беззаконие, вину либо ответственность и последствия проступка. Здесь при נקה наиболее уместно «от вины», сохраняющее нравственно-правовой смысл.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: а та женщина
  rationale: Союз ו здесь связывает контрастные положения; «а» естественно передаёт этот контраст. Указательное הַהִוא отражено словом «та».
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: понесёт свою вину
  rationale: Сохраняется краткая еврейская идиома «нести вину», которая может включать как виновность, так и её последствия; возвратное «свою» естественно передаёт местоименный суффикс.
theological_decisions:
- issue: Значение עָוֹן в обеих частях стиха
  choice: «вина» в обоих случаях
  alternative: «беззаконие» или «наказание за беззаконие»
  rationale: Одинаковый перевод сохраняет нравственно-правовую параллель между освобождением мужа от вины и несением женщиной собственной вины, не сводя вторую часть исключительно к наказанию.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Муж» выбран вместо буквального «мужчина» по ясному контексту. Идиома «понесёт свою вину» сохранена, а её смысловой диапазон пояснён в сноске.
