revisions:
- from: или если мужчиной овладеет дух ревности[a] и он станет ревновать свою жену, то пусть он поставит женщину перед Яхве, а священник исполнит над ней всё это предписание[b].
  to: или если дух ревности[a] овладеет мужчиной и он будет ревновать свою жену, он представит женщину перед Яхве, а священник совершит над ней всё это предписание[b].
  rationale: Правка устраняет добавленную побудительную модальность и делает синтаксис естественнее, не меняя смысла. «Дух ревности» сохранён буквально, без решения вопроса, идёт ли речь о внутреннем побуждении или внешней силе. «Представит» передаёт обрядовое «поставит/представит перед», а «совершит над ней всё это предписание» сохраняет направленность процедуры на женщину и нормативное значение תורה.
  reviewer_model: gpt-5.6-terra
