base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: ru
  text: или если дух ревности[a] овладеет мужчиной и он будет ревновать свою жену, он представит женщину перед Яхве, а священник совершит над ней всё это предписание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пройдёт над ним»; возможный смысловой вариант: «найдёт на него» или «охватит его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весь этот закон», «всё это наставление» или «весь этот обряд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ אִ֗ישׁ אֲשֶׁר
  choice: или если мужчиной
  rationale: א֣וֹ вводит вторую возможность в продолжающемся предложении; условная формулировка естественно передаёт связь с предыдущим контекстом. אִישׁ сохранено как «мужчина», а супружеское отношение уточняется далее словами «свою жену».
- source_word: תַּעֲבֹ֥ר עָלָ֛יו ר֥וּחַ קִנְאָ֖ה
  choice: овладеет дух ревности
  rationale: Буквально дух ревности «пройдёт над ним/на него». Русское «овладеет» передаёт охватывающее человека состояние, сохраняя слово «дух» и не определяя, идёт ли речь только о внутреннем побуждении или о внешней силе.
- source_word: וְקִנֵּ֣א אֶת אִשְׁתּ֑וֹ
  choice: и он станет ревновать свою жену
  rationale: Глагол קנא однокоренной с существительным «ревность»; «станет ревновать» естественно продолжает условную конструкцию и сохраняет повтор мотива ревности.
- source_word: וְהֶעֱמִ֤יד אֶת הָֽאִשָּׁה֙ לִפְנֵ֣י יְהוָ֔ה
  choice: то пусть он поставит женщину перед Яхве
  rationale: Каузатив עמד означает «поставить, заставить встать, представить». «Поставит ... перед» близко к форме оригинала и подходит к обрядово-судебной обстановке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, без замены титулом.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: а священник исполнит над ней
  rationale: עָשָׂה здесь обозначает совершение предписанной процедуры. «Исполнит над ней» звучит естественнее буквального «сделает ей» и сохраняет направленность действия на женщину.
- source_word: אֵ֥ת כָּל הַתּוֹרָ֖ה הַזֹּֽאת
  choice: всё это предписание
  rationale: תּוֹרָה в данном контексте обозначает изложенный выше установленный порядок. «Предписание» сохраняет нормативный смысл, не сужая выражение исключительно до абстрактного закона или обряда.
theological_decisions:
- issue: Природа «духа ревности»
  choice: Сохранено буквальное выражение «дух ревности».
  alternative: «приступ ревности» или «ревнивое чувство»
  rationale: Еврейская формулировка допускает понимание как охватившего человека внутреннего состояния, так и действующей на него силы. Перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и обрядового контекста. Начальное «или» сохранено, поскольку стих продолжает синтаксическую конструкцию предыдущего стиха. Повторы «ревность — ревновать» намеренно отражают однокоренные еврейские слова.
