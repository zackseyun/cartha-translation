lexical_decisions:
- source_word: וְכָתַב
  choice: Затем ... запишет
  rationale: В последовательности обрядовых предписаний форма обозначает следующее предписанное действие; будущее совершенного вида естественно передаёт это по-русски.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: эти проклятия
  rationale: אָלָה здесь обозначает проклятия, произнесённые в контексте клятвы; ясное основное значение вынесено в текст, а клятвенный оттенок сохранён в сноске.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Обычное русское обозначение служителя, совершающего данный обряд.
- source_word: בַּסֵּפֶר
  choice: в свитке
  rationale: סֵפֶר в данном древнем контексте означает письменный документ, вероятнее всего свиток, а не современную переплетённую книгу.
- source_word: וּמָחָה
  choice: и смоет написанное
  rationale: Глагол означает стереть или удалить написанное; в данном обряде удаление производится водой, поэтому «смоет» естественно передаёт физическое действие, а «написанное» ясно указывает на удаляемые слова.
- source_word: אֶל
  choice: в
  rationale: Предлог выражает направление переноса стёртых слов в ритуальную воду.
- source_word: מֵי הַמָּרִים
  choice: горькую воду
  rationale: Естественная русская передача конструкции «воды горечи» с собирательным единственным числом.
