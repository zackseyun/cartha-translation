  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: ru
  text: 'Затем священник приведёт её к клятве и скажет женщине: «Если никакой мужчина не ложился с тобой и если ты, будучи замужем[a], не уклонилась к нечистоте, то будь свободна от этих горьких вод, навлекающих проклятие[b]» .'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под своим мужем» — древнееврейское выражение, обозначающее положение женщины в браке.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «горькие воды, навлекающие проклятие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: приведёт её к клятве
  rationale: Каузативная форма глагола שבע означает, что священник заставляет женщину поклясться или ставит её под клятву; выбранная формулировка естественна для русского юридико-обрядового контекста.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: если никакой мужчина не ложился с тобой
  rationale: Сохранён сдержанный древнееврейский эвфемизм половой связи; отрицательное איש в данном контексте естественно передаётся как «никакой мужчина».
- source_word: וְאִם לֹא שָׂטִית טֻמְאָה
  choice: и если ты ... не уклонилась и не осквернилась
  rationale: שׂטה передаёт уклонение с верного пути, а טֻמְאָה — нечистоту или осквернение. Сочинительная передача по-русски сохраняет оба смысловых компонента без неестественного выражения «уклонилась в нечистоту».
- source_word: תַּחַת אִישֵׁךְ
  choice: будучи замужем
  rationale: Буквально «под своим мужем»; это идиома, обозначающая состояние женщины в брачных отношениях. Русская формулировка передаёт смысл без ошибочного оттенка пространственного положения.
- source_word: הִנָּקִי
  choice: пусть ... не причинят тебе вреда
  rationale: Форма от נקה выражает освобождение, невиновность или неподверженность действию проклятия. В связи с водами естественная русская передача раскрывает практический смысл, не утверждая точный механизм испытания.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: эти горькие воды, навлекающие проклятие
  rationale: Сохранены множественное «воды», определение «горькие» и причинно-действенный оттенок причастия от ארר.
theological_decisions:
- issue: Характер предполагаемого проступка
  choice: Сохранить язык половой связи, уклонения и осквернения, не заменяя его одним словом «прелюбодействовала».
  alternative: 'Передать прямо: «не изменила мужу» или «не совершила прелюбодеяния».'
  rationale: Контекст касается подозрения в супружеской неверности, однако еврейский текст выражает это несколькими образами. Перевод не должен сужать или расширять их богословско-правовой смысл.
- issue: Действие горьких вод
  choice: Передать их как воды, навлекающие проклятие, которые не причинят невиновной вреда.
  alternative: «Будь невиновна перед этими горькими водами» или «будь свободна от этих вод».
  rationale: Так сохраняется связь вод с проклятием и смысл освобождения невиновной, но не уточняется не описанный здесь механизм их действия.
translation_notes:
  register: Современный литературный русский язык с достоинством обрядово-правовой речи. Избегается как архаизм «заклянёт», так и разговорная прямота; библейский эвфемизм «ложился с тобой» сохранён. Все сноски обозначены в основном тексте.
