revisions:
- from: 'Затем священник приведёт её к клятве и скажет женщине: «Если никакой мужчина не ложился с тобой и если ты, будучи замужем[a], не уклонилась и не осквернилась, то пусть эти горькие воды, навлекающие проклятие[b], не причинят тебе вреда[c].'
  to: 'Затем священник приведёт её к клятве и скажет женщине: «Если никакой мужчина не ложился с тобой и если ты, будучи замужем[a], не уклонилась к нечистоте, то будь свободна от этих горьких вод, навлекающих проклятие[b]» .'
  rationale: Исправлены синтаксическая передача «уклонилась к нечистоте», излишняя конкретизация значения הִנָּקִי и незакрытая прямая речь. Сноска к прежнему варианту «не причинят тебе вреда» больше не нужна, поскольку основной текст прямо передаёт значение освобождения от вод.
