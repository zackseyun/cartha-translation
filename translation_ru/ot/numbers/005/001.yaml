  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно переводится как «ГОСПОДЬ». Другие варианты передачи имени — «Яхве» и «Иегова».'
    reason: Указывает еврейскую форму Божьего имени и основные традиции его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным ו вводит новое речевое событие. В современной русской повествовательной формуле «сказал» звучит естественнее буквального «говорил» и ясно передаёт завершённое обращение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Направленность речи, выраженная предлогом אֶל, естественно передаётся в русском языке дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: 'Использована устоявшаяся русская форма библейского имени; в предложении она стоит в дательном падеже: «Моисею».'
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формульное «говоря» вводит последующую прямую речь. В современном русском это естественно и полноценно передаётся двоеточием, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте стоит собственное имя, тетраграмматон. Транслитерация «Яхве» сохраняет его как имя, тогда как «ГОСПОДЬ» отражает традицию почтительного замещения; форма «Иегова» также исторически употребительна, но менее точно отражает предполагаемое древнее произношение.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified повествовательной формулой. Союз «И» сохранён как связь с предшествующим повествованием; двоеточие естественно вводит речь следующего стиха.
