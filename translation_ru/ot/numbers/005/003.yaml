base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: ru
  text: Удаляйте — как мужчин, так и женщин — за пределы стана[a]; удаляйте их, чтобы они не оскверняли своих станов, среди которых Я обитаю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «за пределы стана»; слово «стан» стоит в единственном числе. Далее употреблено множественное число: «их станы», возможно обозначающее отдельные части или расположения общего стана Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно также понять в личном смысле: «среди них», то есть среди людей, связанных с этими станами.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: как мужчин, так и женщин
  rationale: Еврейская конструкция обозначает весь диапазон включительно. Такая формулировка естественно и точно передаёт, что повеление относится и к лицам мужского, и к лицам женского пола.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: удалите ... удалите их
  rationale: Повтор глагола שלח сохранён ради смыслового усиления. «Удалите» ясно выражает выведение за пределы стана, не придавая действию излишне карательного оттенка.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Естественная русская пространственная формулировка, точно передающая удаление за границу стана.
- source_word: יְטַמְּאוּ
  choice: не оскверняли
  rationale: В контексте священнических установлений טמא означает ритуальное осквернение; «осквернять» сохраняет этот культовый смысл.
- source_word: מַחֲנֵיהֶם
  choice: своих станов
  rationale: Сохранено множественное число еврейского существительного с суффиксом 3-го лица множественного числа; оно может подразумевать отдельные части или расположения общего стана Израиля.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: среди которых Я обитаю
  rationale: Переданы торжественный тон и реальность Божьего пребывания посреди стана народа. Сноска сохраняет возможность соотнести местоименный суффикс как со станами, так и с людьми.
theological_decisions:
- issue: К чему относится בְּתוֹכָם («среди них») в заключительной части стиха
  choice: 'В основном тексте относительное местоимение грамматически связано со «станами»: «среди которых Я обитаю».'
  alternative: «среди людей, которым принадлежат эти станы, Я обитаю» / «среди них Я обитаю».
  rationale: Мужской множественный суффикс допускает соотнесение со станами как пространством Божьего присутствия либо с народом, живущим в них. Основной текст следует ближайшему выраженному антецеденту, а сноска не устраняет богословски значимую двусмысленность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор «удалите» намеренно сохраняет риторическое усиление оригинала; «стан» и «осквернять» уместны для повествования о ритуальной чистоте и остаются понятными современному читателю.
