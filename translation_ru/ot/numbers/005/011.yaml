  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Вводит новую речь в повествовании. В современной русской библейской формуле «сказал Моисею» звучит естественнее, чем буквальное «говорил к Моисею», и вместе с двоеточием передаёт функцию всей конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Направленность речи по-русски естественно выражается дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени; после «сказал» употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Стандартный еврейский ввод содержания речи в современном русском естественно передаётся двоеточием; отдельное «говоря» здесь было бы тяжеловесным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения, тогда как «Господь» является традиционной заменой, а «Иегова» — поздней гибридной формой.
translation_notes:
  register: Современный литературный русский язык, краткая и достойная формула введения прямой речи. Союз «И» сохранён как повествовательная связь; לֵאמֹר передано пунктуационно, без неестественного деепричастия «говоря».
