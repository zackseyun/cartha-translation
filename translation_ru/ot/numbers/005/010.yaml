  text: וְ/אִ֥ישׁ אֶת קֳדָשָׁ֖י/ו ל֣/וֹ יִהְי֑וּ אִ֛ישׁ אֲשֶׁר יִתֵּ֥ן לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: ru
  text: И святые приношения каждого человека будут принадлежать ему[a]; что человек отдаст священнику, то будет принадлежать священнику[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его святыни». Речь о предметах, посвящённых как священные приношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «то будет принадлежать ему»; здесь «ему» относится к священнику.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: каждого человека / человек
  rationale: Существительное мужского рода в данном правовом контексте имеет распределительное значение. Современное русское «человек» сохраняет форму единственного числа и не сужает смысл до взрослых мужчин.
- source_word: קֳדָשָׁיו
  choice: его святые приношения
  rationale: Форма множественного числа обозначает посвящённые святыни, то есть предметы, отделённые для священного приношения. «Святые приношения» естественно передаёт культовый смысл; более буквальное «святыни» отмечено в сноске.
- source_word: לוֹ יִהְיוּ
  choice: будут принадлежать ему
  rationale: Оборот выражает принадлежность. Русская конструкция яснее буквального «будут его» и не добавляет идеи «останутся», которой глагол сам по себе не требует.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: что человек отдаст священнику
  rationale: Относительное предложение имеет обобщённо-правовой смысл. «Что… то…» естественно передаёт его открытый объём и сохраняет определённое единственное число «священнику».
- source_word: לוֹ יִהְיֶה
  choice: будет принадлежать священнику
  rationale: Вместо двусмысленного местоимения назван ближайший референт — священник. Это ясно передаёт синтаксически наиболее естественное прочтение контекста; буквальная местоименная форма отмечена в сноске.
theological_decisions:
- issue: Референт первого לוֹ в выражении «его святые приношения будут принадлежать ему»
  choice: Сохранено местоимение «ему» без устранения возможного напряжения между правом владельца распоряжаться святыней и последующей принадлежностью дара священнику.
  alternative: Понимать «ему» как указание непосредственно на священника.
  rationale: В первой половине стиха ближайший референт — каждый человек, тогда как во второй принадлежность уже отданного дара священнику выражена отдельно.
- issue: Референт заключительного לוֹ
  choice: В основном тексте раскрыт как «священнику».
  alternative: Буквально оставить «ему», сохранив местоименную неоднозначность.
  rationale: Ближайший и контекстуально наиболее вероятный референт — הַכֹּהֵן, «священник»; сноска сохраняет формальную особенность еврейского текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Правовая параллельность стиха сохранена; архаизмы и излишне церковнославянские формы не используются.
