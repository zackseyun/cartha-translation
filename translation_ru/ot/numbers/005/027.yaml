  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: ru
  text: 'Когда он даст ей выпить эту воду, то, если она осквернила себя и изменила мужу, вода, несущая проклятие, войдёт в неё, принося горечь[a]: её живот вздуется, а бедро иссохнет[b]. Женщина станет проклятием среди своего народа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вода, несущая проклятие, войдёт в неё как горькая вода». Еврейское выражение «для горечи» трудно для истолкования: оно может описывать либо действие воды, либо её качество.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её бедро упадёт». Вероятно, это эвфемизм, обозначающий тяжёлое телесное поражение, затрагивающее репродуктивные органы, однако точный смысл выражения неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Когда он даст ей выпить эту воду
  rationale: Каузативная форма глагола שׁקה означает «дать/заставить выпить». Временное придаточное естественно вводит последующее условие и сохраняет связь событий.
- source_word: נִטְמְאָה
  choice: она осквернила себя
  rationale: Форма от טמא обозначает состояние осквернения; возвратная передача соответствует контексту нравственной и ритуальной нечистоты.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: нарушила верность своему мужу
  rationale: Однокоренная конструкция מעל מעלה подчёркивает вероломное нарушение обязательства. Выражение передаёт супружескую неверность, не сводя значение лишь к техническому термину.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: вода, несущая проклятие
  rationale: Причастие от ארר характеризует воду как несущую или приводящую в действие проклятие.
- source_word: וּבָאוּ בָהּ ... לְמָרִים
  choice: войдёт в неё, принося горечь
  rationale: בוא с предлогом ב обозначает вхождение, а трудное לְמָרִים передано результативно, без окончательного решения, относится ли «горечь» к качеству воды или к её воздействию.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: её живот вздуется
  rationale: בטן прямо обозначает живот или брюшную область; перевод не уточняет орган сверх сказанного в еврейском тексте.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: бедро иссохнет
  rationale: Буквально נאפל означает «пасть», а ירך — «бедро», но всё выражение, вероятно, эвфемистически описывает тяжёлое поражение репродуктивной области. «Иссохнет» делает последствие понятным, сохраняя буквальный образ «бедра» и отмечая неясность в сноске.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: Эта женщина станет проклятием среди своего народа
  rationale: Она становится известным в общине примером или формулой проклятия; «среди своего народа» естественно передаёт общественный характер последствия.
theological_decisions:
- issue: Передача телесного поражения в формуле испытания без навязывания определённого медицинского или репродуктивного толкования
  choice: её живот вздуется, а бедро иссохнет
  alternative: у неё вздуется чрево и произойдёт выкидыш; её живот вздуется, а детородные органы сморщатся; её живот вздуется, а бедро упадёт
  rationale: Еврейский текст использует конкретные, но отчасти эвфемистические слова, точный физиологический смысл которых остаётся спорным. Основной текст сохраняет образы живота и бедра, а сноска сообщает о буквальном значении и вероятной эвфемистичности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; трудные еврейские образы сохранены без грубой анатомической конкретизации и без конфессионального истолкования.
