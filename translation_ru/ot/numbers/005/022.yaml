  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: ru
  text: 'Пусть эти воды, несущие проклятие, войдут в твои внутренности, чтобы у тебя распух живот и опало бедро[a]. И женщина скажет: «Аминь, аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «чтобы раздуть живот и заставить бедро опасть». Еврейское выражение трудно для понимания и, возможно, эвфемистически обозначает поражение детородных органов.'
    reason: Лексическая альтернатива и сохранение неоднозначности трудного еврейского оборота.
lexical_decisions:
- source_word: וּבָאוּ
  choice: пусть … войдут
  rationale: В контексте клятвы и проклятия форма передаёт пожелание-призыв, а не просто будущее действие.
- source_word: הַמַּיִם הַמְאָרְרִים
  choice: несущие проклятие воды
  rationale: 'Сохранены множественное число и действенный смысл причастия от ארר: воды несут или осуществляют проклятие.'
- source_word: בְּמֵעַיִךְ
  choice: в твои внутренности
  rationale: Передаёт телесный смысл слова מֵעֶה без излишне медицинского или архаического оттенка.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: чтобы у тебя распух живот
  rationale: Естественно по-русски выражает результат действия; בֶּטֶן здесь передано прямым соответствием «живот», не исключающим возможной связи с деторождением.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: и иссохло бедро
  rationale: Трудное идиоматическое выражение передано понятно, но без уточнения конкретного медицинского последствия; буквальный образ отмечен в сноске.
- source_word: אָמֵן אָמֵן
  choice: Аминь, аминь
  rationale: Сохранены удвоение, торжественный ответ и традиционная литургическая форма.
theological_decisions:
- issue: Характер телесного поражения, выраженного словами לַצְבּוֹת בֶּטֶן וְלַנְפִּל יָרֵךְ
  choice: «распух живот и иссохло бедро» без конкретизации медицинского исхода
  alternative: Уточнить как выкидыш, бесплодие либо поражение половых органов
  rationale: Еврейское выражение трудно и, вероятно, эвфемистично. Оно указывает на тяжёлое телесное, возможно репродуктивное поражение, но не позволяет однозначно назвать его точный характер.
translation_notes:
  register: Современный литературный русский язык с торжественным ритуально-правовым оттенком. Синтаксис остаётся ясным для широкого читателя; архаизмы и медицинская конкретизация избегаются.
