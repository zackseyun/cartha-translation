revisions:
- from: 'Пусть эти несущие проклятие воды войдут в твои внутренности, чтобы у тебя распух живот и иссохло бедро[a]. И женщина скажет: «Аминь, аминь».'
  to: 'Пусть эти воды, несущие проклятие, войдут в твои внутренности, чтобы у тебя распух живот и опало бедро[a]. И женщина скажет: «Аминь, аминь».'
  rationale: Исправление сохраняет импрекативную форму, множественное число «воды», ритуальный регистр и удвоенное «Аминь». «Опало бедро» ближе к образу еврейского נפל, чем «иссохло», и не навязывает определённого медицинского диагноза; необходимое пояснение вынесено в сноску.
