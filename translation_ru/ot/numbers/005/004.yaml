base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: ru
  text: Сыны Израиля сделали так[a] и выслали их за пределы стана. Как Яхве сказал Моисею, так и сделали сыны Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля»; выражение обозначает израильский народ в целом.'
    reason: Пояснение корпоративного значения родового еврейского выражения.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: И сделали так
  rationale: Прямо и естественно передаёт исполнение ранее данного повеления и сохраняет начальную формулу еврейского текста.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родовой образ еврейского выражения; в контексте оно обозначает народ Израиля в целом.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: выслали их
  rationale: Глагол «выслали» ясно выражает удаление названных людей из стана, не добавляя идеи наказания сверх контекста.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Естественная русская передача пространственного удаления наружу, при этом сохраняется традиционное и понятное библейское слово «стан».
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: Как ... повелел
  rationale: В данном контексте речь Яхве представляет собой предшествующее повеление; «повелел» естественно передаёт функцию высказывания, хотя буквально דִּבֶּר означает «говорил/сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כֵּן עָשׂוּ
  choice: так и сделали
  rationale: Сохраняет заключительное повторение исходного текста, подчёркивающее точное послушание Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула אֲדֹנָי.
- issue: Характер речи Яхве к Моисею
  choice: повелел
  alternative: сказал
  rationale: Ближайший контекст содержит повеление, поэтому функциональная передача уместна; богословское содержание при этом не расширяется.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Слово «стан» сохранено как устойчивое и понятное обозначение лагеря Израиля; синтаксис слегка упрощён для естественного чтения, а исходное заключительное повторение сохранено.
