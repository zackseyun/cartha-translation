  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: ru
  text: Но если ты, будучи замужем[a], сбилась с пути, осквернилась[b] и мужчина вступил с тобой в половую связь[c] помимо твоего мужа —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сбилась с пути под своим мужем». Еврейский оборот относится к положению женщины в брачном союзе и в данном контексте подразумевает нарушение супружеской верности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стала нечистой». Здесь имеется в виду осквернение в связи с половой неверностью.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «мужчина дал в тебе своё лежание» — еврейский эвфемизм, обозначающий половую связь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: уклонилась
  rationale: Глагол передаёт образ отклонения от должного пути; в данном брачном контексте подразумевается нарушение супружеской верности, но образ намеренно сохранён.
- source_word: תַּחַת אִישֵׁךְ
  choice: от своего мужа
  rationale: Буквально оборот означает «под своим мужем» и указывает на положение женщины в брачном союзе. В сочетании с שׂטה естественный русский перевод «уклонилась от своего мужа» сохраняет образ отклонения, не воспроизводя неясную для современного читателя кальку.
- source_word: נִטְמֵאת
  choice: осквернилась
  rationale: Форма глагола טמא обозначает наступившее осквернение в ритуально-правовом и половом контексте; «осквернилась» передаёт это точнее, чем более узкое «стала нечистой».
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: другой мужчина имел с тобой половую связь
  rationale: Еврейское эвфемистическое выражение буквально говорит, что мужчина «дал в тебе своё лежание». Ясный современный перевод передаёт обозначенный половой акт без грубости и без добавления идеи насилия или согласия.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: другой мужчина
  rationale: Оборот означает «помимо твоего мужа»; в русском смысл исключения естественно выражен словом «другой» при существительном «мужчина».
theological_decisions:
- issue: Передача супружеской неверности без чрезмерного истолкования
  choice: «уклонилась от своего мужа» с последующим прямым указанием на половую связь
  alternative: «изменила своему мужу»
  rationale: Вариант сохраняет метафору отклонения в первой части, тогда как следующая часть ясно показывает половое содержание проступка; так не стираются ни образность, ни юридическая определённость текста.
- issue: Характер осквернения
  choice: «осквернилась»
  alternative: «стала нечистой»
  rationale: Текст соединяет ритуально-правовую категорию нечистоты с нарушением супружеской верности. «Осквернилась» удерживает обе стороны и не сводит выражение лишь к физической нечистоте.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для правового и обрядового контекста. Начальное «Но» и конечное тире сохраняют связь с условной формулой соседних стихов. Эвфемизм раскрыт ясно, но без вульгарности; гендерно и юридически значимые формулировки не расширены предположениями о согласии.
