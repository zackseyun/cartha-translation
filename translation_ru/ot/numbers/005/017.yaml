  rationale: 'Заменено «прах» на «пыль» для точной и естественной передачи עָפָר. Предписание оформлено современной нормативной конструкцией. Сноска к «полу» уточнена так, чтобы альтернативное чтение сохраняло связь скинии. Маркеры в исправленном тексте: «священную воду[a] в глиняный сосуд[b] ... с пола скинии[c]».'
