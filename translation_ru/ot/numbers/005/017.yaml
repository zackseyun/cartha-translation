  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: ru
  text: Священник должен взять священную воду в глиняный сосуд, затем взять немного пыли с пола скинии и положить её в воду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: священной воды
  rationale: Сочетание означает воду, отделённую для священного обрядового употребления. «Священной воды» точно передаёт значение и в данном предложении звучит естественнее, чем выражение «святую воду», имеющее в русском языке более поздние церковные ассоциации.
- source_word: בִּכְלִי חָרֶשׂ
  choice: в глиняный сосуд
  rationale: כְּלִי обозначает сосуд или ёмкость, а חָרֶשׂ — глину и глиняную посуду. Направительное «в» естественно передаёт предписанное помещение воды в сосуд, не меняя материала сосуда.
- source_word: הֶעָפָר
  choice: прах
  rationale: עָפָר может обозначать пыль, сухую землю или рыхлый грунт. «Прах» сохраняет предметный и ритуальный оттенок контекста, оставаясь понятным в возвышенном повествовании.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: с пола скинии
  rationale: קַרְקַע обозначает нижнюю поверхность — пол или землю. Внутри скинии «пол» читается естественно, но возможное значение «земля» отмечено в сноске.
- source_word: מִן הֶעָפָר
  choice: немного праха
  rationale: 'Предлог מִן здесь имеет партитивный смысл: священник берёт часть праха, а не весь прах. «Немного праха» естественно выражает это по-русски.'
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: пусть ... возьмёт ... затем возьмёт ... и положит
  rationale: Последовательность глагольных форм выражает обязательные этапы обряда. Конструкция с «пусть» передаёт предписание современным литературным русским языком, а «затем» ясно показывает последовательность действий.
- source_word: הַמָּיִם
  choice: в воду
  rationale: Определённая форма указывает на уже упомянутую священную воду; повторное «в воду» естественно передаёт эту анафорическую отсылку.
