  register: Современный литературный русский язык с умеренно возвышенной обрядовой лексикой. Формула «пусть ... возьмёт» сохраняет предписывающий характер текста; синтаксис упрощён лишь настолько, чтобы последовательность действий была ясна обычному читателю.
