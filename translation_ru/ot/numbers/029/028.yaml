  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ru
  text: и одного козла в жертву за грех — сверх постоянного всесожжения с его хлебным приношением и возлиянием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: и одного козла
  rationale: שָׂעִיר обозначает козла-самца; в русском слове «козёл» пол уже выражен. Союз ו продолжает перечень и передан как «и».
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В данном жертвенном контексте חַטָּאת означает не отвлечённый грех, а установленную жертву за грех.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное явно указывает количество животного и сохраняется в переводе.
- source_word: מִ/לְּ/בַד
  choice: сверх
  rationale: Оборот указывает, что названная жертва приносится дополнительно к постоянному комплексу приношений.
- source_word: עֹלַת הַ/תָּמִיד
  choice: постоянного всесожжения
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике; תָּמִיד подчёркивает её регулярный, непрерывно установленный характер, не добавляя отсутствующего здесь слова «ежедневный».
- source_word: וּ/מִנְחָתָ/הּ
  choice: хлебного приношения при нём
  rationale: В священнических перечнях מִנְחָה обозначает сопровождающее хлебное приношение. Местоименный суффикс женского рода относится к עֹלָה; по-русски связь естественно выражена словами «при нём», согласованными с «всесожжением».
- source_word: וְ/נִסְכָּ/הּ
  choice: и возлияния при нём
  rationale: נֶסֶךְ — жидкое жертвенное возлияние. Суффикс также связывает его со всесожжением; формулировка «при нём» сохраняет эту связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционной, но понятной жертвенной терминологией. Синтаксис сохраняет форму продолжения перечня. Слово «козёл» точнее и естественнее, чем избыточное «козёл-самец». Различие между всесожжением, хлебным приношением и возлиянием сохранено.
