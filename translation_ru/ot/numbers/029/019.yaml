  terminology: «Козёл», «жертва за грех», «всесожжение», «хлебное приношение» и «возлияния» последовательно и точно передают культовую терминологию. Примечание a корректно даёт контекстуально возможное «ежедневного», не подменяя основной перевод. Примечание b надлежащим образом отмечает множественное число и не навязывает единственное объяснение его референции.
