language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/019.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: ru
  text: и одного козла в жертву за грех — сверх постоянного всесожжения[a], хлебного приношения при нём и возлияний при них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ежедневного всесожжения».'
    reason: Лексема הַתָּמִיד обозначает регулярно совершаемое, постоянно установленное приношение; в данном контексте оно приносилось ежедневно.
  - marker: b
    text: 'Буквально: «их возлияний». Множественная форма, вероятно, относится к возлияниям, сопровождавшим весь предписанный комплекс жертв.'
    reason: Сохраняет необычное множественное число еврейского текста и поясняет возможную отсылку, не заменяя её однозначным толкованием.
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: и одного козла
  rationale: Сочетание שׂעיר עזים — обычное обозначение козла-самца в жертвенном контексте; по-русски «козёл» уже выражает мужской пол, а אֶחָד указывает количество.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном законодательстве слово обозначает особый вид жертвы, а не просто абстрактный грех.
- source_word: מִ/לְּ/בַד
  choice: сверх
  rationale: Предлог указывает, что перечисленное приношение добавляется к установленному постоянному комплексу жертв.
- source_word: עֹלַת הַ/תָּמִיד
  choice: постоянного всесожжения
  rationale: «Всесожжение» точно передаёт жертвенный термин עֹלָה, а «постоянное» сохраняет идею регулярно и непрерывно установленного приношения в הַתָּמִיד.
- source_word: וּ/מִנְחָתָ/הּ
  choice: хлебного приношения при нём
  rationale: В данном культовом контексте מִנְחָה обозначает сопровождающее приношение из продуктов земли. Местоименная отсылка в еврейском грамматически относится к עֹלָה; по-русски мужское «при нём» согласуется с выбранным термином «всесожжение».
- source_word: וְ/נִסְכֵּי/הֶם
  choice: и возлияний при них
  rationale: Сохранены множественное число существительного и множественный суффикс еврейского текста. «При них» естественно указывает на принадлежность возлияний всему комплексу предписанных приношений, не устраняя формальную неоднозначность.
theological_decisions:
- issue: Значение חַטָּאת как названия жертвы или как абстрактного «греха»
  choice: жертва за грех
  alternative: жертва очищения
  rationale: Традиционное и понятное русское название сохраняет явную связь корня со грехом. Вариант «жертва очищения» подчёркивает ритуальную функцию, но более узко истолковывает термин.
translation_notes:
  register: Современный литературный русский с сохранением принятых библейско-жертвенных терминов. Синтаксис краток и продолжает перечень предыдущих стихов; формальная неоднозначность множественного וְנִסְכֵּיהֶם вынесена в примечание.
