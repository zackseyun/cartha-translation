  source_fidelity: 'Текст точно передаёт все элементы еврейского оригинала: одного козла-самца, жертву за грех, добавочный характер по отношению к постоянному всесожжению, его хлебному приношению и возлияниям во множественном числе. Синтаксическая зависимость «при нём / при них» адекватно отражает суффиксы единственного и множественного числа, не снимая последней неоднозначности.'
