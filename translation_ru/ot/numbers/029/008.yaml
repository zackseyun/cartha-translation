  terminology: «Яхве», «всесожжение», «молодой бык», «баран», «однолетние ягнята-самцы» и «без изъяна» точны для данного жертвенного контекста. «Приятное Ему» передаёт значение נִיחֹחַ без неоправданного догматического усиления.
