  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: ru
  text: 'И принесите Яхве всесожжение — благоухание, приятное Ему: одного молодого быка, одного барана и семь однолетних ягнят-самцов; они должны быть без изъяна.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: и принесите
  rationale: В породе hифиль глагол קרב в жертвенном контексте означает представить или принести жертву. «Принесите» естественно и ясно передаёт предписанное культовое действие.
- source_word: עֹלָה
  choice: в жертву всесожжения
  rationale: Термин обозначает жертву, целиком сжигаемую на жертвеннике. «Жертва всесожжения» — точный и понятный русский эквивалент.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому посвящена жертва; тетраграмматон передан как личное имя «Яхве».
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Ему
  rationale: Устойчивое жертвенное выражение передаёт угодность жертвы Богу. Формулировка сохраняет образ запаха и явно выражает его положительную оценку.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: одного молодого быка
  rationale: Выражение буквально описывает быка из крупного рогатого скота и в жертвенных перечнях естественно передаётся как «молодой бык».
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: Стандартное значение אַיִל в перечне жертвенных животных.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: семь однолетних ягнят-самцов
  rationale: כְּבָשִׂים обозначает ягнят мужского пола, а בְּנֵי שָׁנָה — животных годовалого возраста. Перевод сохраняет и пол, и возраст.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В жертвенном контексте слово означает отсутствие физического дефекта, делающего животное непригодным для жертвы.
- source_word: יִהְיוּ לָכֶם
  choice: пусть они будут у вас
  rationale: Формулировка сохраняет местоименный элемент לָכֶם и естественно связывает его с требуемым состоянием приготовленных животных.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл выражения רֵיחַ נִיחֹחַ
  choice: благоухание, приятное Ему
  alternative: успокоительное благоухание
  rationale: Перевод сохраняет жертвенную метафору и идею Божьего благоволения, не усиливая спорное представление о том, будто жертва буквально умиротворяет Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской окраской. Синтаксис предписания сохранён, но сделан естественным для русского читателя; пол и возраст ягнят выражены явно.
