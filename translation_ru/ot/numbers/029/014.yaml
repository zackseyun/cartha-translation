  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: ru
  text: 'И хлебное приношение для них — мука тонкого помола, смешанная с маслом: по три десятых меры[a] на каждого из тринадцати быков и по две десятых меры на каждого из двух баранов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Три десятых» и «две десятых» означают десятые доли меры, традиционно понимаемые как десятые доли ефы.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: И хлебное приношение при них
  rationale: В культовом контексте מִנְחָה обозначает хлебное, то есть мучное, приношение. Суффикс 3-го лица множественного числа соотносит его с перечисленными жертвенными животными; оборот «при них» естественно передаёт сопутствующее приношение.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Термин обозначает тщательно размолотую муку высокого качества для жертвоприношений; выбранный вариант ясен современному читателю и не добавляет отсутствующей в тексте сортовой характеристики.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанная с маслом
  rationale: Страдательное причастие с предлогом ב описывает приготовление муки посредством смешивания с маслом.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / שְׁנֵי עֶשְׂרֹנִים
  choice: три десятых меры / две десятых меры
  rationale: עִשָּׂרוֹן — единица, равная одной десятой более крупной меры, традиционно ефы. В основном тексте сохранена краткость еврейской формулировки, а подразумеваемая мера пояснена в сноске.
- source_word: לַפָּר הָאֶחָד / לָאַיִל הָאֶחָד
  choice: на каждого ... быка / на каждого ... барана
  rationale: Буквально «на одного быка/барана» здесь имеет распределительное значение; «на каждого» ясно передаёт норму для одного животного.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים / לִשְׁנֵי הָאֵילִם
  choice: из тринадцати быков / из двух баранов
  rationale: Числительные указывают общее число животных, к каждому из которых относится названная норма; конструкция объединена с распределительным оборотом ради естественного русского синтаксиса.
