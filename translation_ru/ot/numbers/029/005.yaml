  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: ru
  text: и одного козла в жертву за грех, чтобы совершить искупление за вас[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы совершить за вас очищение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: и одного козла
  rationale: Сочетание שְׂעִיר עִזִּים обозначает самца козы, а אֶחָד указывает количество. В русском языке «козёл» уже выражает пол животного; порядок слов естественно передаёт числительное.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В данном жертвенном контексте слово обозначает не абстрактный грех, а установленную жертву за грех.
- source_word: לְ/כַפֵּר
  choice: чтобы совершить искупление
  rationale: Инфинитив выражает цель жертвоприношения. «Совершить искупление» сохраняет культово-богословский смысл כפר, не сводя его к одной поздней теории.
- source_word: עֲלֵי/כֶם
  choice: за вас
  rationale: При כפר предлог עַל обозначает тех, ради кого или в пользу кого совершается искупление; «за вас» кратко и естественно передаёт этот смысл.
theological_decisions:
- issue: Передача жертвенного термина כפר
  choice: совершить за вас искупление
  alternative: совершить за вас очищение
  rationale: Еврейский текст говорит о священническом обряде искупления, не уточняя его механизм. Основной вариант сохраняет широту библейского понятия; сноска отмечает допустимый оттенок очищения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткого перечислительного строя жертвенного предписания. Конечное тире передаёт незавершённость синтаксической последовательности в контексте.
