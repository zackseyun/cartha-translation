  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: ru
  text: и одного козла в жертву за грех[a], помимо жертвы за грех для искупления и постоянного всесожжения с его хлебным приношением и их возлияниями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в жертву очищения»; так же во втором случае в этом стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: В жертвенном контексте сочетание обозначает козла-самца; русское «козла» ясно передаёт вид и пол животного без неестественного буквализма.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное сохранено, поскольку текст точно устанавливает количество жертвенных животных.
- source_word: חַטָּאת
  choice: жертву за грех
  rationale: В данном перечне существительное обозначает жертвоприношение, а не грех как отвлечённое понятие. Традиционный русский культовый термин понятен читателю; возможное функциональное значение «жертва очищения» отмечено в сноске.
- source_word: מִלְּבַד
  choice: помимо
  rationale: Слово показывает, что названный козёл приносится в дополнение к следующим обязательным приношениям.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: жертвы за грех, приносимой для искупления
  rationale: Так передана связь жертвы за грех с обрядом искупления без добавления в основной текст названия Дня искупления, которого в этой фразе прямо нет.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянного всесожжения
  rationale: תָּמִיד указывает на регулярно и неизменно совершаемое всесожжение; «постоянное всесожжение» — устоявшийся и точный русский культовый термин.
- source_word: מִנְחָתָהּ
  choice: хлебного приношения при нём
  rationale: В жертвенном перечне מִנְחָה означает сопровождающее всесожжение приношение из растительных продуктов. Местоименная связь женского рода в еврейском относится к עֹלָה; по-русски это естественно выражено словами «при нём».
- source_word: נִסְכֵּיהֶם
  choice: возлияний при них
  rationale: Сохранено множественное число как самого существительного, так и местоименного суффикса. Формулировка не сужает неоднозначную отсылку «их» к одному лишь ближайшему приношению.
theological_decisions:
- issue: Культовое значение חַטָּאת
  choice: жертва за грех
  alternative: жертва очищения
  rationale: 'Оба значения имеют лексическую опору: первое сохраняет привычное обозначение вида жертвы, второе подчёркивает её очистительную функцию. Основной текст использует традиционный термин, а сноска сохраняет значимую альтернативу.'
- issue: Связь חַטַּאת с הַכִּפֻּרִים
  choice: жертва за грех, приносимая для искупления
  alternative: искупительная жертва за грех; жертва очищения для искупления
  rationale: Выбранная передача сохраняет культовое понятие искупления и не вводит сверх текста специальное название праздника или более узкое богословское толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением понятной библейской культовой терминологии. Синтаксис перечня сделан естественным для русского, а местоименная неоднозначность множественного суффикса в «возлияний при них» намеренно не устранена.
