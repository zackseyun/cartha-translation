  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: ru
  text: В восьмой день у вас должно быть торжественное собрание[a]; никакой обычной работы не делайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключительное собрание». Еврейское עֲצֶרֶת может обозначать собрание, завершающее праздник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: В восьмой день
  rationale: Естественно передаёт обстоятельство времени и определённое порядковое числительное без добавления отсутствующего в стихе уточнения «праздника».
- source_word: עֲצֶרֶת
  choice: торжественное собрание
  rationale: Передаёт священный и праздничный характер собрания, не сводя значение только к заключительному дню; возможный оттенок завершения вынесен в сноску.
- source_word: תִּהְיֶה לָכֶם
  choice: пусть будет у вас
  rationale: Сохраняет близкую к еврейской конструкции формулировку «будет для вас/у вас» и естественно выражает предписание по-русски.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Сочетание обозначает повседневную трудовую деятельность, запрещённую в священный день, а не вообще всякое действие; «обычная работа» ясно и современно передаёт это различие.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Прямое повелительное выражение законодательного запрета во втором лице множественного числа.
theological_decisions:
- issue: Значение праздничного термина עֲצֶרֶת
  choice: «торжественное собрание» в основном тексте
  alternative: «заключительное собрание»
  rationale: Контекст указывает на священное собрание в восьмой день и допускает оттенок завершения праздника, но сам термин не требует делать этот оттенок единственным значением. Основной текст сохраняет ритуальный характер, а сноска — лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным законодательным звучанием. Формулировка понятна широкому читателю; архаизмы и конфессионально окрашенные термины не используются.
