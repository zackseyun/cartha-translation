  terminology: «Козёл», «жертва за грех», «всесожжение», «хлебное приношение» и «возлияние» — понятные и устойчивые библейские термины. Сноска к «козлу» корректно уточняет мужской род שָׂעִיר, а сноска к «постоянному» адекватно отмечает возможный перевод «ежедневное».
