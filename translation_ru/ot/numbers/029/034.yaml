  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: ru
  text: и одного козла[a] в жертву за грех, сверх постоянного всесожжения[b], с его хлебным приношением и возлиянием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает именно козла, то есть самца козы.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ежедневного всесожжения». Еврейское слово указывает на постоянно повторяющееся установленное приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: и одного козла
  rationale: שָׂעִיר в жертвенном контексте обозначает козла, то есть самца козы; אֶחָד прямо указывает количество, а וּ продолжает перечень.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В данном жертвенном контексте слово обозначает установленную жертву за грех, а не грех как отвлечённое понятие.
- source_word: מִ/לְּ/בַד
  choice: сверх
  rationale: Оборот указывает, что перечисленная жертва приносится дополнительно к постоянному всесожжению.
- source_word: עֹלַת הַ/תָּמִיד
  choice: постоянного всесожжения
  rationale: עֹלָה передано традиционным и понятным термином «всесожжение», а תָּמִיד характеризует регулярно и непрерывно совершаемое установленное приношение.
- source_word: מִנְחָתָ/הּ
  choice: с его хлебным приношением
  rationale: В культовом контексте מִנְחָה обозначает сопровождающее хлебное приношение; суффикс женского рода соотносится с עֹלָה и передан местоимением «его» по русскому роду слова «всесожжение».
- source_word: וְ/נִסְכָּ/הּ
  choice: и возлиянием
  rationale: נֶסֶךְ обозначает ритуальное возлияние. Принадлежность к тому же всесожжению естественно распространяется на второй однородный член без повторения местоимения.
