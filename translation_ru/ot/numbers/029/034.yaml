  source_fidelity: 'Текст точно передаёт все элементы еврейского оригинала: союзное продолжение перечня, одного козла (שְׂעִיר אֶחָד), жертву за грех, добавочный характер по отношению к постоянному всесожжению и сопровождающие его хлебное приношение и возлияние. Русское «с его хлебным приношением и возлиянием» верно соотносит суффиксы с «всесожжением».'
