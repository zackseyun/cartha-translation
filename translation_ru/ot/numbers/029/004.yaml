lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: и по одной десятой эфы
  rationale: עִשָּׂרוֹן обозначает меру в одну десятую эфы, особенно в предписаниях о хлебных приношениях. Добавление «эфы» делает меру понятной по-русски, а значение поясняется в сноске.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: на каждого
  rationale: Буквально «на одного ягнёнка»; в перечне приношений оборот имеет распределительное значение и естественно передаётся как «на каждого».
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: из семи ягнят
  rationale: Фраза указывает на определённую группу из семи ягнят, к каждому из которых относится названное количество.
