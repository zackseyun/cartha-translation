  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: ru
  text: Вот что вы должны совершать для Яхве в назначенные сроки, помимо ваших обетных и добровольных приношений — будь то всесожжения, хлебные приношения, возлияния или мирные жертвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения». Еврейский термин обозначает категорию жертв мира и благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: вот что
  rationale: Указательное местоимение во множественном числе отсылает к предписанным выше праздничным жертвам; русское «вот что» естественно вводит итоговое предписание.
- source_word: תַּעֲשׂוּ
  choice: вы должны приносить
  rationale: Буквально «делать», но в жертвенном контексте глагол обозначает совершение или принесение жертв; выбран ясный современный эквивалент.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог указывает, кому посвящаются приношения; личное имя יהוה передано как «Яхве».
- source_word: בְּמוֹעֲדֵיכֶם
  choice: в установленные для вас времена
  rationale: מוֹעֵד означает назначенное время или праздничное собрание; формулировка сохраняет временной смысл и не сужает его до одних праздников.
- source_word: לְבַד
  choice: помимо
  rationale: Указывает, что перечисленные добровольные и обетные жертвы совершаются сверх обязательных приношений установленного календаря.
- source_word: מִנִּדְרֵיכֶם
  choice: ваших жертв по обету
  rationale: Речь идёт не просто о произнесённых обетах, а о приношениях, обещанных обетом.
- source_word: וְנִדְבֹתֵיכֶם
  choice: добровольных приношений
  rationale: Передаёт жертвы, принесённые по свободному желанию, а не в силу обязательного предписания.
- source_word: לְעֹלֹתֵיכֶם
  choice: ваши всесожжения
  rationale: עֹלָה — установленный термин для жертвы, полностью сжигаемой на жертвеннике.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: хлебные приношения
  rationale: В священническом жертвенном контексте מִנְחָה обозначает приношение из муки или зерна; «хлебное приношение» — понятный и традиционный русский термин.
- source_word: וּלְנִסְכֵּיכֶם
  choice: возлияния
  rationale: נֶסֶךְ обозначает жидкость, ритуально выливаемую как приношение; «возлияние» точно и кратко передаёт культовый термин.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: мирные жертвы
  rationale: Сохраняет традиционное название категории и связь корня שלם с миром, благополучием и целостностью.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Передача שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; благодарно-мирные жертвы
  rationale: «Мирные жертвы» сохраняет укоренившееся название и смысловую связь с миром и благополучием; аспект совместной трапезы и общения отмечен в сноске, не подменяя многозначность термина.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён без утраты структуры перечня; культовые термины переданы последовательно и понятно.
