base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: ru
  text: И в седьмом месяце, в первый день месяца, у вас будет священное собрание. Никакой обычной работы не делайте. Это будет для вас днём трубного звука[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «день громких возгласов (ликования)». Еврейское слово теруа означает громкий звук и в зависимости от контекста может обозначать трубный сигнал, крик или ликующий возглас.'
    reason: Лексическая неоднозначность слова תְּרוּעָה.
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: И в седьмой месяц
  rationale: 'Союз ו сохраняет последовательный характер законодательного текста, а ב передаёт временное значение: «в седьмой месяц».'
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Буквально «в один [день] месяца» — обычное древнееврейское календарное обозначение первого дня месяца.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает официально созванное собрание, посвящённое Богу; этот вариант естественен и понятен в современном русском языке.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Выражение означает повседневную трудовую деятельность, запрещённую в праздничный день, а не вообще любое действие.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Прямой запрет во втором лице множественного числа передан в ясной законодательной форме.
- source_word: יוֹם תְּרוּעָה
  choice: день трубного звука
  rationale: תְּרוּעָה обозначает громкий сигнальный звук, который может быть трубным сигналом, криком или возгласом; в культовом календарном контексте «трубный звук» передаёт вероятный смысл, не называя прямо не упомянутый в еврейском тексте инструмент.
- source_word: יִהְיֶה לָכֶם
  choice: пусть это будет для вас
  rationale: Конструкция указывает, каким назначен этот день для народа; русский оборот сохраняет смысл и естественно звучит.
theological_decisions:
- issue: Значение названия дня יוֹם תְּרוּעָה
  choice: день трубного звука
  alternative: день громких возгласов / ликования
  rationale: Текст называет праздник по характерному громкому звуку и не использует более позднее традиционное название. Основной перевод отражает вероятный культовый трубный сигнал, а смысловая широта еврейского слова сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. Формы «пусть будет» и «не делайте» сохраняют предписывающий характер без архаичной тяжеловесности.
