  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: ru
  text: А в седьмой день — семь быков, два барана и четырнадцать однолетних ягнят без порока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: А в седьмой день
  rationale: Союз ו связывает предписание с предыдущим перечнем, а сочетание בַיּוֹם с порядковым числительным естественно передаётся по-русски как «в седьмой день».
- source_word: פָּרִים שִׁבְעָה
  choice: семь быков
  rationale: В контексте жертвоприношений פַּר обозначает быка; возраст животных здесь прямо не указан.
- source_word: אֵילִם שְׁנָיִם
  choice: два барана
  rationale: אַיִל — обычное обозначение барана в жертвенных перечнях.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: четырнадцать однолетних ягнят
  rationale: כֶּבֶשׂ обозначает ягнёнка, а идиома בֶּן־שָׁנָה — животное годовалого возраста; «однолетних» кратко и естественно передаёт этот смысл.
- source_word: תְּמִימִם
  choice: без порока
  rationale: В жертвенном контексте תָּמִים означает отсутствие телесного изъяна, делающего животное непригодным для жертвы; «без порока» сохраняет традиционный культовый оттенок.
