base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: ru
  text: 'И принесите всесожжение как приятное благоухание Яхве: одного молодого быка, одного барана и семь годовалых баранчиков без изъяна.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: и принесите
  rationale: В сочетании с עֹלָה глагол עשה имеет жертвенный смысл «совершить/принести жертву»; «принесите» естественно передаёт его по-русски.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Формула обозначает благоугодность жертвы; перевод сохраняет конкретный образ запаха, не сводя его лишь к абстрактному «угождению».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: одного молодого быка
  rationale: Контекстуально точный и естественный перевод жертвенной формулы; בֶּן־בָּקָר обозначает молодого быка из крупного рогатого скота.
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: Прямое соответствие названию взрослого самца овцы в жертвенном перечне.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: семь годовалых ягнят
  rationale: Сжато и естественно передаёт число животных и возрастную формулу «сыны года»; грамматическая форма и контекст указывают на самцов, что русское «ягнята» здесь не исключает.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В жертвенном контексте слово требует отсутствия физического порока; этот вариант точен и понятен современному читателю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Смысл формулы ריח ניחח
  choice: сохранить образ приятного благоухания
  alternative: перевести как «жертву, угодную Яхве»
  rationale: Образ запаха явно присутствует в древнееврейском тексте и не должен устраняться, хотя формула также выражает принятие жертвы Богом.
translation_notes:
  register: Современный литературный русский с сохранением традиционного термина «всесожжение». Повелительная форма естественно продолжает предписание контекста. Перечень передан компактно и торжественно, без архаизмов вроде «непорочных».
