  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: ru
  text: и одного козла в жертву за грех[a], помимо постоянного всесожжения с его хлебным приношением и возлиянием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание обозначает самца козы, предназначенного для жертвоприношения; русское «козёл» прямо выражает пол животного и естественно в данном контексте.
- source_word: אֶחָד
  choice: одного
  rationale: Количественное числительное указывает число жертвенных животных.
- source_word: חַטָּאת
  choice: жертву за грех
  rationale: В жертвенном контексте слово обозначает вид приношения, а не отвлечённое понятие греха. «Жертва за грех» — понятный и укоренившийся русский эквивалент; возможное функциональное понимание отражено в сноске.
- source_word: מִלְּבַד
  choice: сверх
  rationale: Предлог показывает, что названная жертва приносится дополнительно к установленному постоянному всесожжению.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянного всесожжения
  rationale: Выражение обозначает регулярно и неизменно совершаемое всесожжение. «Постоянное всесожжение» сохраняет культовый термин и идею установленной повторяемости.
- source_word: מִנְחָתָהּ
  choice: хлебного приношения при нём
  rationale: В культовом употреблении מִנְחָה — сопровождающее приношение из растительных продуктов. Местоименный суффикс женского рода относится к עֹלָה; оборот «при нём» естественно передаёт связь с всесожжением по смыслу, поскольку в русском «всесожжение» среднего рода.
- source_word: וְנִסְכָּהּ
  choice: и возлияния при нём
  rationale: נֶסֶךְ обозначает сопровождающее жидкое приношение, которое выливают. «Возлияние» — точный и понятный библейско-культовый термин; суффикс также отнесён к всесожжению через оборот «при нём».
theological_decisions:
- issue: Значение חַטָּאת как названия жертвы
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной вариант сохраняет традиционную и широко понятную связь с грехом, не исключая очистительной функции обряда; лексически допустимая альтернатива дана в сноске, чтобы не устранять смысловое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно традиционной жертвенной терминологией. Синтаксис сохраняет характер перечня и связь стиха с предыдущим контекстом; начальное «и» передаёт еврейский союз. Повтор «при нём» ясно соотносит оба сопровождающих приношения с постоянным всесожжением и избегает неестественных местоименных форм.
