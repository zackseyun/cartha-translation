base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: ru
  text: И в пятнадцатый день седьмого месяца будет у вас священное собрание. Никакой обычной работы не делайте и празднуйте праздник, посвящённый Яхве, в течение семи дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: В пятнадцатый день седьмого месяца
  rationale: Календарная формула естественно передаётся по-русски предложной конструкцией; начальное ו здесь продолжает последовательность предписаний и не требует отдельного «и».
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает созванное для священной цели собрание; этот вариант ясен современному читателю и сохраняет официальный характер.
- source_word: יִהְיֶה לָכֶם
  choice: пусть будет у вас
  rationale: Передаёт буквальную конструкцию «будет для вас» естественным русским предписанием.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Речь идёт о повседневном трудовом занятии, запрещённом в священный день, а не вообще о любом действии.
- source_word: וְחַגֹּתֶם חַג
  choice: празднуйте праздник
  rationale: Сохранена выразительная однокоренная конструкция глагола и существительного, естественная и понятная по-русски.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל указывает, что праздник посвящён Яхве; «в честь» естественно выражает эту направленность в русском языке.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое обозначение длительности праздника.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Характер запрещённой работы
  choice: обычная работа
  alternative: тяжёлая работа
  rationale: Выражение מְלֶאכֶת עֲבֹדָה допускает оттенки служебного или трудового занятия; «обычная работа» передаёт противопоставление праздничному священному времени, не сводя запрет только к физически тяжёлому труду.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. Синтаксис повелительных предписаний сделан ясным, без архаизмов; имя Яхве передано непосредственно.
