  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: ru
  text: 'В пятый день: девять быков[a], два барана и четырнадцать годовалых ягнят-самцов без порока,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И в пятый день — девять быков». В еврейском тексте стих начинается с союза «и».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַחֲמִישִׁי
  choice: В пятый день
  rationale: Естественная для русского перечня временная формула. Начальный союз וּ связывает стих с предшествующей последовательностью и отмечен в сноске.
- source_word: פָּרִים
  choice: быков
  rationale: В жертвенном контексте פָּר обозначает быка; само по себе слово здесь не требует уточнения «молодых».
- source_word: אֵילִם
  choice: барана
  rationale: Обычное русское соответствие אַיִל в перечнях жертвенных животных.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: годовалых ягнят-самцов
  rationale: כֶּבֶשׂ в данном жертвенном перечне обозначает ягнёнка мужского пола, а בְּנֵי שָׁנָה — животных первого года жизни; выбранная формулировка ясна современному читателю.
- source_word: תְּמִימִם
  choice: без порока
  rationale: В жертвенном контексте слово означает отсутствие телесного недостатка и передаётся устойчивой библейской формулой.
