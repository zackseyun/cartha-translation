base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ru
  text: и их хлебное приношение и их возлияния для быков, баранов и ягнят — по их числу, согласно установленному порядку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно предписанию». Еврейское слово обозначает установленное правило или предписанный порядок совершения этих приношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: хлебные приношения при них
  rationale: В жертвенном контексте מִנְחָה означает приношение из зерна или муки, сопровождающее жертвы. Русское «хлебные приношения» понятно и традиционно для данного культового термина; местоименный суффикс передан сочетанием «при них», то есть при перечисленных животных.
- source_word: נִסְכֵּיהֶם
  choice: возлияния при них
  rationale: נֶסֶךְ обозначает ритуально выливаемое жидкое приношение. «Возлияния» точно и естественно передаёт этот жертвенный термин, а «при них» сохраняет местоименный суффикс.
- source_word: לַפָּרִים
  choice: для быков
  rationale: פָּרִים в перечне жертвенных животных обозначает быков; уточнение «молодых» в еврейском тексте отсутствует.
- source_word: לָאֵילִם
  choice: для баранов
  rationale: אַיִל в жертвенной терминологии однозначно означает барана.
- source_word: וְלַכְּבָשִׂים
  choice: и ягнят
  rationale: כֶּבֶשׂ означает ягнёнка; указание пола здесь не выражено отдельно, поэтому оно не добавляется.
- source_word: בְּמִסְפָּרָם
  choice: по числу их
  rationale: Фраза указывает, что сопутствующие приношения должны соответствовать установленному числу животных каждой категории.
- source_word: כַּמִּשְׁפָּט
  choice: согласно установленному порядку
  rationale: מִשְׁפָּט здесь обозначает обязательное ритуальное установление или предписанный порядок совершения приношений. Перевод сохраняет одновременно нормативный и процедурный оттенки.
