  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וּ/נְסָכֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: ru
  text: и одного козла в жертву за грех — сверх постоянного всесожжения с его хлебным приношением и возлияниями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: козла
  rationale: В жертвенном контексте слово обозначает козла, то есть самца; русское «козла» естественно и точно.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: Здесь существительное обозначает не абстрактный грех, а жертвоприношение за грех; предложная конструкция ясна современному читателю.
- source_word: אֶחָד
  choice: одного
  rationale: Количественное числительное согласовано с существительным «козла».
- source_word: מִלְּבַד
  choice: сверх
  rationale: Передаёт добавочность перечисленной жертвы по отношению к установленному постоянному всесожжению.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянного всесожжения
  rationale: «Всесожжение» — точный традиционный термин для עֹלָה, а «постоянное» передаёт установленный регулярно повторяющийся характер תָּמִיד.
- source_word: מִנְחָתָהּ
  choice: с его хлебным приношением
  rationale: В данном жертвенном перечне מִנְחָה означает сопровождающее приношение из зерновых продуктов; местоимение по-русски согласуется со словом «всесожжение».
- source_word: וּנְסָכֶיהָ
  choice: и возлияниями
  rationale: נְסָכִים — жидкие приношения, которые выливали; «возлияния» точно и уместно в библейском жертвенном контексте. Множественное число оригинала сохранено.
