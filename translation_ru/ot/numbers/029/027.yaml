  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ru
  text: а также их хлебное приношение и их возлияния для быков, баранов и ягнят — в соответствии с их числом, по установленному порядку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно предписанию». Еврейское выражение указывает на установленную норму или порядок принесения этих жертв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: а также хлебное приношение
  rationale: Начальный союз связывает стих с предшествующим перечнем жертв, а מִנְחָה в данном культовом контексте обозначает сопровождающее хлебное приношение.
- source_word: וְנִסְכֵּיהֶם
  choice: и возлияния
  rationale: נֶסֶךְ означает жидкое жертвенное приношение, которое выливали; «возлияния» — точный и устоявшийся русский библейский термин.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: к быкам, баранам и ягнятам
  rationale: Предлог ל указывает, к каким видам жертвенных животных относятся сопровождающие приношения; «к» сохраняет эту соотнесённость без лишнего истолкования.
- source_word: בְּמִסְפָּרָם
  choice: в соответствии с их числом
  rationale: Фраза указывает, что количество сопровождающих приношений соотносится с числом животных.
- source_word: כַּמִּשְׁפָּט
  choice: по установленному порядку
  rationale: מִשְׁפָּט здесь означает установленную норму или предписанный порядок совершения жертв; выбранная формулировка естественна по-русски и сохраняет культово-правовой смысл.
