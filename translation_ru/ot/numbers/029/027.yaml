  source_fidelity: 'В целом переданы все основные элементы стиха: хлебное приношение, возлияния, три вида животных, пропорция по их числу и предписанный порядок. Однако суффиксы множественного числа в מִנְחָתָם и נִסְכֵיהֶם («их хлебное приношение и их возлияния») в черновике не выражены. Русское «к быкам» также менее точно и естественно, чем «для быков» в значении распределения сопутствующих приношений.'
