base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: ru
  text: И принесите всесожжение — жертву, сжигаемую огнём, благоухание, приятное для Яхве:[a] одного быка, одного барана и семь годовалых ягнят без порока.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «успокаивающее благоухание». Это устойчивое еврейское выражение о жертве, угодной Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: и принесите
  rationale: В породе хифиль глагол קרב в жертвенном контексте означает принести или представить жертву; «принесите» естественно и точно передаёт ритуальное действие.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: אִשֵּׁה
  choice: жертву, сжигаемую в огне
  rationale: Передаёт способ принесения жертвы и не вводит спорного толкования «пища».
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Сохраняет образ запаха и значение угодности Богу, свойственное устойчивой жертвенной формуле.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, а предлог ל выражен синтаксической связью «приятное Яхве».
- source_word: פַּר אֶחָד
  choice: одного быка
  rationale: Прямой эквивалент без необязательного уточнения возраста.
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: Точный и естественный эквивалент названия жертвенного животного.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: семь годовалых ягнят
  rationale: Естественно передаёт буквальное «семь ягнят, сынов года»; пол животных в переводе дополнительно не уточняется.
- source_word: תְּמִימִם
  choice: без порока
  rationale: В жертвенном контексте обозначает отсутствие физического изъяна и соответствует принятой русской терминологии.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Антропоморфный образ רֵיחַ נִיחֹחַ
  choice: сохранить выражение «благоухание, приятное Яхве»
  alternative: угодная Яхве жертва
  rationale: Образ запаха присутствует в еврейском тексте и не должен устраняться поясняющим пересказом; примечание указывает на формульное значение приемлемости жертвы.
translation_notes:
  register: Современный литературный русский с сохранением традиционной жертвенной терминологии. Синтаксис сделан ясным, но образность и формульный характер еврейского текста сохранены.
