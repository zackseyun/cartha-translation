  naturalness: Текст сохраняет библейский регистр, но сочетание «при нём ... и возлияний при них» и заключительное «огненная жертва Яхве» звучат неровно. Перестройка делает перечисление и заключительную культовую формулу яснее без утраты краткости.
  terminology: «Всесожжение», «хлебное приношение», «возлияния» и «Яхве» уместны. Для спорного технического אִשֶּׁה предпочтительнее прозрачное «жертва, приносимая на огне» с примечанием, фиксирующим альтернативное понимание.
