base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ru
  text: помимо всесожжения месяца и хлебного приношения при нём, постоянного всесожжения и хлебного приношения при нём, а также соответствующих им возлияний — по установленному для них порядку, — в приятное благоухание для Яхве, жертва, приносимая на огне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пищевое приношение». Еврейский технический термин традиционно передают также: «жертва, сжигаемая на огне» или «огненная жертва».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: помимо
  rationale: Естественно вводит приношения, совершаемые в дополнение к уже предписанным.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: всесожжение месяца
  rationale: Сохраняет буквальное «всесожжение месяца» и не подменяет его вероятным, но более конкретным толкованием «в новомесячие».[b]
- source_word: מִנְחָתָהּ
  choice: хлебное приношение при нём
  rationale: В жертвенном контексте מִנְחָה обозначает сопровождающее всесожжение приношение из зерновых продуктов; оборот «при нём» ясно передаёт связь с жертвой и избегает неестественного местоимения женского рода в русском.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянное всесожжение
  rationale: Передаёт регулярный, непрерывно соблюдаемый характер предписанного приношения без добавления отсутствующего здесь слова «ежедневное».
- source_word: וְנִסְכֵּיהֶם
  choice: и возлияний при них
  rationale: «Возлияние» — ясный и принятый русский термин для жидкой жертвы; множественное число суффикса соотносится с несколькими приношениями.
- source_word: כְּמִשְׁפָּטָם
  choice: по установленному для них порядку
  rationale: Передаёт культовое значение предписанной нормы или установленного способа совершения обряда.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: как благоухание, приятное Яхве
  rationale: Сохраняет образ запаха и смысл угодности Богу в естественной современной формулировке.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Технический жертвенный термин связан с приношением на огне; перевод сохраняет эту связь, не вводя спорное истолкование как «пищевой жертвы».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя יהוה транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу; Иегове
  rationale: Исходный текст употребляет тетраграмматон как собственное имя; «Яхве» непосредственно и прозрачно передаёт его, не заменяя титулом.
- issue: Значение אִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение; жертва, сжигаемая на огне
  rationale: Этимология и употребление термина допускают традиционную связь с огнём, тогда как понимание как пищи жертвенника является интерпретирующим. Краткий основной вариант сохраняет культовый характер и сопровождается примечанием.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской лексикой. Синтаксис сохраняет характер перечня. Термины «всесожжение», «хлебное приношение» и «возлияние» обеспечивают точность и узнаваемость без архаизации.
