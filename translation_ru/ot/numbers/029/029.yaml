  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: ru
  text: А в шестой день — восемь быков, два барана и четырнадцать годовалых ягнят мужского пола без порока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשִּׁשִּׁי
  choice: А в шестой день
  rationale: Союз ו продолжает последовательность предписаний, а сочетание с предлогом ב и порядковым числительным естественно передаётся как «А в шестой день».
- source_word: פָּרִים שְׁמֹנָה
  choice: восемь быков
  rationale: Пָּרִים в жертвенном контексте обозначает быков; возраст в еврейском тексте здесь не уточнён.
- source_word: אֵילִם שְׁנָיִם
  choice: два барана
  rationale: אֵילִם — обычное обозначение взрослых самцов овец, приносимых в жертву.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: четырнадцать годовалых ягнят
  rationale: כְּבָשִׂים — ягнята мужского пола; выражение בְּנֵי שָׁנָה указывает на возраст около одного года. В русском жертвенный контекст и грамматический мужской род слова «ягнята» позволяют избежать тяжеловесного «ягнят-самцов».
- source_word: תְּמִימִם
  choice: без порока
  rationale: В жертвенном законодательстве слово означает отсутствие телесного изъяна; «без порока» — точная и устоявшаяся русская формулировка.
