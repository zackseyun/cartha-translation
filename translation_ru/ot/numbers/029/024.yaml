lexical_decisions:
- source_word: מִנְחָתָם
  choice: хлебные приношения при них
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из зерна или муки, сопровождающее жертву животного. Традиционное и понятное выражение «хлебное приношение» сохраняет культовое значение; множественное число естественно передаёт распределение приношений между несколькими животными.
- source_word: וְנִסְכֵּיהֶם
  choice: и возлияния при них
  rationale: נֶסֶךְ — жидкое приношение, которое выливали при жертве. «Возлияния» — точный и устоявшийся русский термин; оборот «при них» показывает связь с перечисленными животными.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: для быков, баранов и ягнят
  rationale: Предлог לְ выражает соотнесённость сопровождающих приношений с каждым видом жертвенных животных. «Для» передаёт это распределительное значение естественно и без избыточного повторения.
- source_word: בְּמִסְפָּרָם
  choice: по их числу
  rationale: Фраза указывает, что количество сопровождающих приношений должно соответствовать числу жертвенных животных.
- source_word: כַּמִּשְׁפָּט
  choice: согласно установленному порядку
  rationale: В культовом законодательстве מִשְׁפָּט означает установленную норму или предписанный порядок совершения жертвы. Выбранная формулировка сохраняет юридико-обрядовый оттенок и понятна современному читателю.
