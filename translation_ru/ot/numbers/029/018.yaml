  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ru
  text: и их хлебное приношение и их возлияния — для быков, баранов и ягнят, по их числу, согласно установленному порядку;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: хлебное приношение к ним
  rationale: В контексте жертвоприношений מִנְחָה обозначает сопровождающее жертву приношение из зерна. Традиционный и понятный русский термин «хлебное приношение» точнее общего «приношение»; оборот «к ним» передаёт соотнесённость с перечисленными животными.
- source_word: נִסְכֵּיהֶם
  choice: возлияния к ним
  rationale: נֶסֶךְ — жидкое приношение, которое выливали при жертве. «Возлияния» — краткий и устоявшийся русский культовый термин; множественное число соответствует еврейской форме.
- source_word: לַפָּרִים
  choice: для быков
  rationale: Предлог ל выражает отнесённость сопровождающих приношений к каждому виду жертвенных животных. «Для быков» естественно передаёт это распределительное значение.
- source_word: לָאֵילִם
  choice: баранов
  rationale: Существительное אַיִל в данном жертвенном контексте означает взрослого барана; русский ряд продолжается без повторения предлога.
- source_word: וְלַכְּבָשִׂים
  choice: и ягнят
  rationale: כֶּבֶשׂ в жертвенном законодательстве обычно означает ягнёнка. Союз и форма перечисления сохранены.
- source_word: בְּמִסְפָּרָם
  choice: по числу их
  rationale: Фраза указывает, что количество сопровождающих приношений определяется числом жертвенных животных. Такой порядок слов сохраняет формальный характер предписания и остаётся понятным.
- source_word: כַמִּשְׁפָּט
  choice: согласно установленному порядку
  rationale: מִשְׁפָּט здесь означает не судебное решение, а установленную норму или предписанный порядок совершения жертв. Выбранная формулировка передаёт как нормативный, так и процедурный оттенок.
theological_decisions: []
