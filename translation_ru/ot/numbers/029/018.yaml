  register: Современный литературный русский язык с умеренно формальным звучанием, соответствующим культово-правовому контексту. Повтор «к ним» сохраняет две отдельные категории сопровождающих приношений и делает принадлежность ясной; точка с запятой учитывает продолжение законодательного перечня.
