  source_fidelity: 'В целом переданы все элементы еврейской формулы: хлебное приношение, возлияния, быки, бараны, ягнята, число и установленный порядок. Однако повтор «при них» звучит неестественно и размывает связь приношений с названными животными; «как им предписано» по-русски ошибочно создаёт впечатление, что предписание адресовано животным, а не устанавливает порядок жертвоприношений для них.'
  naturalness: 'Предлагаемая редакция сохраняет сжатый формульный характер культового перечня, но делает синтаксис современным и ясным: притяжательные местоимения относятся к приношениям, а заключительная формула — к порядку их принесения.'
  terminology: «Хлебное приношение» и «возлияния» — точные и понятные в данном контексте термины. «Быки», «бараны», «ягнята» соответствуют исходным словам. «Установленный для них порядок» адекватно передаёт כמשפטם, не приписывая животным способности получать предписания.
