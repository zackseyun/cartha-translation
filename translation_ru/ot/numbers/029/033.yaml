  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ru
  text: и их хлебное приношение, и их возлияния — для быков, баранов и ягнят, по их числу, согласно установленному для них порядку.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: хлебное приношение при них
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из зерна или муки. Традиционное и понятное выражение «хлебное приношение» сохраняет культовый смысл; суффикс передан словами «при них», то есть при перечисленных животных.
- source_word: נִסְכֵּיהֶם
  choice: возлияния при них
  rationale: נֶסֶךְ — жидкое приношение, которое возливали при жертве. Множественное число сохранено, а суффикс соотнесён с перечисленными жертвенными животными.
- source_word: לַפָּרִים
  choice: при быках
  rationale: פָּרִים в жертвенном перечне — быки. Предлог ל здесь естественно передан как указание на сопровождающие каждую жертву приношения.
- source_word: לָאֵילִם
  choice: баранах
  rationale: אַיִל в жертвенном контексте однозначно означает барана.
- source_word: וְלַכְּבָשִׂים
  choice: и ягнятах
  rationale: כֶּבֶשׂ означает ягнёнка; пол не уточняется, поскольку в данном стихе это не выражено отдельно.
- source_word: בְּמִסְפָּרָם
  choice: по числу их
  rationale: Фраза указывает на соответствие установленному количеству перечисленных животных и сохраняет структуру еврейского текста.
- source_word: כְּמִשְׁפָּטָם
  choice: как им предписано
  rationale: מִשְׁפָּט здесь означает установленный порядок или предписание. Такой перевод естественен по-русски и сохраняет культово-нормативный смысл и местоименный суффикс.
theological_decisions:
- issue: Референт местоименных суффиксов в מִנְחָתָם, נִסְכֵּיהֶם и כְּמִשְׁפָּטָם
  choice: Связать их с перечисленными жертвенными животными посредством «при них» и «как им предписано»
  alternative: 'Передать без явного референта: «их хлебное приношение… по их установлению» либо обобщить: «согласно предписанию»'
  rationale: Еврейский текст грамматически сохраняет суффиксы множественного числа, хотя смысл относится к сопровождающим животных приношениям и установленному для них порядку. Перевод не устраняет эту связь и не превращает выражение в богословское утверждение сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Формула сделана естественной для чтения, но сохранены перечисление, числовое соответствие и нормативный оттенок заключительной фразы.
