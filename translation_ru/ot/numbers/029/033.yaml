    rationale: Еврейское כמשפטם означает совершение приношений по установленному для соответствующих животных порядку. Русская формулировка может означать, будто быкам, баранам и ягнятам было дано предписание.
  revised_text: и их хлебное приношение, и их возлияния — для быков, баранов и ягнят, по их числу, согласно установленному для них порядку.
