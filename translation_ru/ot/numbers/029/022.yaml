lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: и одного козла в жертву за грех
  rationale: Сохраняются соединительный союз, явное числительное и культовое значение חַטָּאת. Русское «козёл» обозначает самца, поэтому дополнительное «самца» не требуется.
- source_word: מִ/לְּ/בַד
  choice: сверх
  rationale: Передаёт добавочный характер перечисляемой жертвы по отношению к установленному постоянному приношению.
- source_word: עֹלַת הַ/תָּמִיד
  choice: постоянного всесожжения
  rationale: «Всесожжение» — ясный и устоявшийся русский культовый термин для עֹלָה; תָּמִיד указывает на регулярно совершаемое, постоянное приношение.
- source_word: וּ/מִנְחָתָ/הּ
  choice: хлебного приношения при нём
  rationale: מִנְחָה в данном жертвенном контексте обозначает приношение из растительных продуктов. Выражение «при нём» естественно показывает, что суффикс женского рода соотносится со всесожжением.
- source_word: וְ/נִסְכָּ/הּ
  choice: и возлияния при нём
  rationale: נֶסֶךְ означает сопровождающее жидкое приношение; «возлияние» — точный и понятный русский культовый термин. Повтор «при нём» устраняет возможную ошибочную связь с ближайшим хлебным приношением.
