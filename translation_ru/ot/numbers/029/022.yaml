  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ru
  text: и одного козла в жертву за грех — сверх постоянного всесожжения, его хлебного приношения и его возлияния.[a]
  philosophy: optimal-equivalence
