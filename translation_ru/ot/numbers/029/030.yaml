  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ru
  text: И хлебное приношение и возлияния для быков, баранов и ягнят — при них, в соответствии с их числом, как предписано.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по установленному порядку». Еврейское выражение указывает на предписанный способ принесения этих приношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: при них — хлебное приношение
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из зерна или муки. Русское традиционное выражение «хлебное приношение» понятно в контексте культа; единственное число сохранено как собирательное. Местоименный суффикс передан оборотом «при них», относящим приношение к перечисленным жертвенным животным.
- source_word: נִסְכֵּיהֶם
  choice: возлияния
  rationale: נֶסֶךְ — сопровождающее жертву приношение напитка, который выливали; «возлияния» точно и естественно передаёт этот культовый термин. Связь с животными выражена общим оборотом «при них».
- source_word: לַפָּרִים
  choice: для быков
  rationale: פַּר в жертвенных перечнях означает быка. Возраст в данном слове здесь прямо не обозначен, поэтому уточнение «молодых» не добавлено.
- source_word: לָאֵילִם
  choice: баранов
  rationale: אַיִל в жертвенном контексте однозначно обозначает барана.
- source_word: וְלַכְּבָשִׂים
  choice: и ягнят
  rationale: כֶּבֶשׂ означает ягнёнка; грамматический род животного не вынесен в перевод отдельным уточнением, поскольку контекст не требует неестественного выражения «ягнят мужского пола».
- source_word: בְּמִסְפָּרָם
  choice: по числу их
  rationale: Оборот указывает, что количество сопутствующих приношений соответствует установленному числу перечисленных животных. Формулировка сохраняет формальную связь с местоименным суффиксом.
- source_word: כַּמִּשְׁפָּט
  choice: как предписано
  rationale: מִשְׁפָּט здесь означает установленное правило или порядок совершения жертв. «Как предписано» естественно передаёт юридико-обрядовый смысл без значения судебного решения.
