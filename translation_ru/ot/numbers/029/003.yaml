  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: ru
  text: 'А хлебное приношение к ним — мука тонкого помола, смешанная с маслом: три десятых эфы[a] на быка и две десятых эфы на барана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа — древняя израильская мера сыпучих тел; здесь указаны три десятых и две десятых эфы.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: А хлебное приношение при них
  rationale: В жертвенном контексте מִנְחָה обозначает хлебное приношение; суффикс связывает его с перечисленными прежде жертвенными животными. «При них» естественно передаёт сопутствующий характер приношения, не вводя отсутствующего в еврейском тексте личного обладателя.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת — высококачественная, тонко смолотая мука для жертвоприношений. «Лучшая мука» понятно современному читателю и сохраняет указание на качество.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанная с маслом
  rationale: Пассивное причастие описывает муку, приготовленную путём смешивания с маслом; это прямое и естественное русское соответствие.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: три десятых эфы
  rationale: עִשָּׂרוֹן обозначает десятую часть эфы. Единица названа прямо ради ясности, а историческая мера сохранена без приблизительного пересчёта.
- source_word: לַפָּר
  choice: на быка
  rationale: פַּר в жертвенном контексте — бык; предлог ל обозначает количество, полагающееся на данное животное.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: две десятых эфы
  rationale: Форма обозначает две десятые доли эфы; явное повторение единицы измерения делает русский текст однозначным.
- source_word: לָאָיִל
  choice: на барана
  rationale: אַיִל в данном жертвенном перечне означает барана; «на» естественно выражает норму для одного животного.
