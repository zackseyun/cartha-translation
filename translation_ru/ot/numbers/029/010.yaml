lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: по одной десятой ефы
  rationale: Повтор существительного выражает распределение нормы по отдельным животным. В контексте хлебных приношений подразумевается десятая часть ефы; единица меры добавлена для ясности и отмечена сноской как не названная здесь прямо.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: на каждого ягнёнка
  rationale: Буквально «на одного ягнёнка»; в перечне жертв конструкция имеет распределительный смысл, который естественно передаётся словом «каждого».
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: на семь ягнят
  rationale: Фраза указывает общее число ягнят, к каждому из которых относится названная мера. Русский язык здесь не требует отдельной передачи еврейского артикля.
