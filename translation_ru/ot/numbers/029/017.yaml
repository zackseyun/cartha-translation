  text: וּ/בַ/יּ֣וֹם הַ/שֵּׁנִ֗י פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנֵ֥ים עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: ru
  text: А во второй день — двенадцать быков из крупного скота[a], два барана и четырнадцать однолетних ягнят без порока.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быков, сынов крупного скота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: А во второй день
  rationale: Союз ו продолжает последовательный перечень приношений, а сочетание с предлогом ב и порядковым числительным естественно передаётся как «А во второй день».
- source_word: פָּרִים בְּנֵי בָקָר
  choice: быков из крупного скота
  rationale: פָּרִים в жертвенном контексте означает быков; идиома בְּנֵי בָקָר буквально обозначает их принадлежность к крупному рогатому скоту. Формулировка сохраняет классифицирующий смысл без неестественного буквализма.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Количественное числительное, относящееся к быкам.
- source_word: אֵילִם שְׁנָיִם
  choice: два барана
  rationale: אֵילִם — обычное обозначение взрослых самцов овец в жертвенных предписаниях.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: однолетних ягнят
  rationale: כְּבָשִׂים означает ягнят, а идиома בְּנֵי שָׁנָה указывает на возраст в один год.
- source_word: אַרְבָּעָה עָשָׂר
  choice: четырнадцать
  rationale: Количественное числительное, относящееся к ягнятам.
- source_word: תְּמִימִם
  choice: без порока
  rationale: В жертвенном законодательстве слово обозначает животных без телесного изъяна; «без порока» — точная и устоявшаяся русская формулировка.
