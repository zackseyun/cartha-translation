  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: ru
  text: 'и хлебное приношение к ним: тонко смолотая мука, смешанная с маслом, — три десятых эфы для быка и две десятых эфы для одного барана;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: и хлебное приношение при них
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из муки; суффикс 3-го лица множественного числа соотносит его с жертвенными животными, поэтому естественное русское «при них» точнее, чем буквальное «их».
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово обозначает высококачественную, тонко смолотую муку для приношений; «лучшая мука» ясно и достойно передаёт качество продукта.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанная с маслом
  rationale: Пассивное причастие описывает способ приготовления муки; перевод сохраняет форму и смысл оригинала.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: три десятых меры
  rationale: עִשָּׂרוֹן — единица объёма, равная одной десятой, традиционно понимаемой как десятая часть ефы; слово «меры» предотвращает ошибочное восприятие как отвлечённой дроби.
- source_word: לַפָּר
  choice: при быке
  rationale: Предлог לְ указывает, к какому жертвенному животному относится установленное количество хлебного приношения; «при быке» естественно для русского культового контекста.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: две десятых меры
  rationale: Сохранена выраженная в оригинале культовая единица объёма без внесения «ефы» непосредственно в основной текст.
- source_word: לָאַיִל הָאֶחָד
  choice: при одном баране
  rationale: Передаёт определённость и числовое уточнение הָאֶחָד в связи с перечисленным жертвенным животным.
theological_decisions: []
