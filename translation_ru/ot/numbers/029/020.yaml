  text: וּ/בַ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י פָּרִ֥ים עַשְׁתֵּי עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: ru
  text: А в третий день — одиннадцать быков, два барана и четырнадцать однолетних ягнят без изъяна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  choice: А в третий день
  rationale: Союз ו продолжает последовательное перечисление праздничных жертвоприношений; «а» естественно передаёт этот переход в современном русском, а порядковое числительное прямо соответствует הַשְּׁלִישִׁי.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: одиннадцать быков
  rationale: פָּרִים в контексте жертвоприношений обозначает быков; определение «молодых» в еврейском тексте отсутствует.
- source_word: אֵילִם שְׁנָיִם
  choice: два барана
  rationale: אֵילִם — обычное обозначение взрослых самцов овец, приносимых в жертву.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: четырнадцать однолетних ягнят
  rationale: Буквальное выражение «сыны года» является устойчивым указанием на возраст животных; «однолетних» кратко и естественно передаёт его по-русски.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В жертвенном законодательстве слово означает отсутствие физического дефекта, а не отвлечённое нравственное или абсолютное совершенство.
