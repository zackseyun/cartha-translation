lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: по одной десятой части
  rationale: Существительное обозначает меру в одну десятую; его повторение в еврейском тексте имеет распределительное значение. Оборот «по одной десятой части» естественно передаёт назначение этой меры каждому животному.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: на каждого ягнёнка
  rationale: Буквально «на одного ягнёнка»; в перечне приношений оборот имеет распределительный смысл и указывает количество для каждого животного.
- source_word: לְאַרְבָּעָה עָשָׂר כְבָשִׂים
  choice: на всех четырнадцать ягнят
  rationale: Фраза обозначает всю определённую контекстом группу из четырнадцати ягнят. Слово «всех» ясно связывает общее число с нормой для каждого ягнёнка.
