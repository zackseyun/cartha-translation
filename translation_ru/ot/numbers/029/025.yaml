  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: ru
  text: и одного козла в жертву за грех, сверх постоянного всесожжения с его хлебным приношением и возлиянием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: и одного козла
  rationale: Стандартное жертвенное обозначение самца козы; «козёл» естественно и точно передаёт выражение в современном русском языке.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте слово обозначает жертвоприношение, связанное с очищением от греха, а не абстрактный грех.
- source_word: מִלְּבַד
  choice: сверх
  rationale: Указывает, что названная жертва приносится в дополнение к установленному постоянному всесожжению.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянного всесожжения
  rationale: תמיד обозначает регулярно совершаемое, непрерывно установленное приношение; «постоянное» сохраняет это значение без неоправданного сужения до «ежедневного».
- source_word: מִנְחָתָהּ
  choice: с его хлебным приношением
  rationale: В данном священническом перечне מִנְחָה — сопровождающее приношение из муки или зерна; «хлебное приношение» является понятным и устойчивым русским жертвенным термином. Местоименный суффикс женского рода относится к עֹלָה и по-русски согласован со словом «всесожжение».
- source_word: וְנִסְכָּהּ
  choice: и возлиянием
  rationale: נסך обозначает ритуально изливаемое приношение напитка; «возлияние» точно и кратко передаёт культовый термин. Принадлежность к всесожжению выражена общим оборотом «с его».
