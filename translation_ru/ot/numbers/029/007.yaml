base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: ru
  text: В десятый день этого седьмого месяца пусть будет у вас священное собрание. Подвергайте себя лишениям[a] и никакой работы не делайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смиряйте себя», «изнуряйте себя». Буквально: «подвергайте лишениям ваши души». Это еврейское ритуальное выражение обозначает самоограничение; оно особенно связано с постом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: В десятый день
  rationale: Предлог с числительным обозначает календарную дату; слово «день» естественно восполняет подразумеваемое значение.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: этого седьмого месяца
  rationale: Сохранены порядковое обозначение месяца и указательное הַזֶּה.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает официально созванное собрание для богослужения; этот вариант естественен и сохраняет сакральный смысл.
- source_word: יִהְיֶה לָכֶם
  choice: пусть будет у вас
  rationale: Передаёт предписание и дательный оборот לָכֶם естественным русским языком.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Смиряйте себя
  rationale: Ритуальная идиома означает подвергать себя лишениям или самоумалению. «Смиряйте себя» сохраняет покаянно-ритуальный оттенок, а примечание раскрывает буквальную форму и возможное самоограничение, особенно пост.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: никакой работы не делайте
  rationale: Всеобъемлющий запрет передан прямой и естественной русской повелительной конструкцией.
theological_decisions:
- issue: Передача ритуальной идиомы וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Смиряйте себя
  alternative: изнуряйте себя; подвергайте себя лишениям; поститесь
  rationale: Выбранный вариант не сводит предписание исключительно к посту и не делает буквальное «изнурение душ» антропологическим утверждением. Примечание сохраняет семантическую широту и ритуальный контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. «Священное собрание» понятно современному читателю; синтаксис прямой, без архаических форм.
