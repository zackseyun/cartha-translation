  source_fidelity: Основной недостаток — «Смиряйте себя» сужает ритуальную идиому וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם до внутреннего смирения. В данном контексте речь о предписанном самоограничении/лишении; пост является обычной, но не единственно выраженной в самом стихе конкретизацией. «Подвергайте себя лишениям» точнее передаёт исходную формулу, не навязывая её исчерпывающего толкования. Остальные части стиха верно передают календарную дату, священный характер собрания и полный запрет работы.
  naturalness: «Подвергайте себя лишениям» — современный литературный и ясный вариант в предписывающем, богослужебно-правовом регистре. «Священное собрание» и «никакой работы не делайте» естественны; синтаксис краток и соответствует жанру.
  terminology: «Священное собрание» адекватно передаёт מִקְרָא קֹדֶשׁ без ненужной конфессиональной окраски. Для וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם выбран более широкий и контекстуально точный термин; в примечании сохранены альтернативы и буквальная образность еврейского выражения.
