  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ru
  text: Их приношение из зерна и их возлияния — для быка, для барана и для ягнят, по их числу, как предписано.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно установленному порядку». Еврейское слово означает правило или предписание, определяющее совершение этих приношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: приношение из зерна
  rationale: В жертвенном контексте מִנְחָה обозначает сопровождающее животные жертвы приношение из зерна. Эта формулировка точнее и понятнее современному читателю, чем более традиционное «хлебное приношение».
- source_word: וְנִסְכֵּיהֶם
  choice: и возлияния к ним
  rationale: נֶסֶךְ — жидкое приношение, которое выливали при жертве. «Возлияния» сохраняет культовый смысл, а «к ним» естественно передаёт принадлежность к перечисленным жертвенным животным.
- source_word: לַפָּר
  choice: для быка
  rationale: פַּר обозначает быка; сам по себе термин в данном стихе не требует уточнения возраста, поэтому не добавлено «молодого».
- source_word: לָאַיִל
  choice: для барана
  rationale: אַיִל в перечне жертвенных животных прямо означает барана.
- source_word: וְלַכְּבָשִׂים
  choice: и для ягнят
  rationale: כֶּבֶשׂ означает ягнёнка, нередко мужского пола в жертвенном употреблении; в данном перечне естественное русское «ягнят» достаточно и не перегружает текст.
- source_word: בְּמִסְפָּרָם
  choice: по их числу
  rationale: Оборот указывает, что количество сопровождающих приношений должно соответствовать числу жертвенных животных.
- source_word: כַּמִּשְׁפָּט
  choice: как предписано
  rationale: מִשְׁפָּט здесь означает установленное правило или нормативный порядок совершения жертв; «как предписано» естественно выражает этот процедурно-правовой смысл.
