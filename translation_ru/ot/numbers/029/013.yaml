source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: ru
  text: 'И принесите всесожжение — огненную жертву, приятное Яхве благоухание: тринадцать быков из стада, двух баранов и четырнадцать годовалых ягнят-самцов; все они должны быть без порока.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: и принесите
  rationale: В породе hифиль глагол קרב в жертвенном контексте означает представить или принести жертву; «принесите» естественно и точно передаёт культовое действие.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике; этимологическое «возношение» здесь менее ясно.
- source_word: אִשֵּׁה
  choice: огненная жертва
  rationale: Передаёт жертву, приносимую посредством огня, и сохраняет её приложение к всесожжению.
- source_word: רֵיחַ נִיחֹחַ
  choice: приятное благоухание
  rationale: Естественно передаёт еврейскую формулу о благоугодности и приемлемости жертвы, не сводя её смысл только к буквальному запаху.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל передаёт направленность и предназначение жертвы, а имя יהוה воспроизводится как «Яхве».
- source_word: פָּרִים בְּנֵי בָקָר
  choice: быков из крупного скота
  rationale: Сохраняет указание на вид скота, не добавляя отсутствующего в тексте точного определения возраста.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: годовалых ягнят-самцов
  rationale: Передаёт и возраст, и грамматически выраженный мужской пол животных.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В жертвенном контексте обозначает отсутствие физического порока, а не отвлечённое нравственное совершенство.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не смешивает его с титулом.
- issue: Смысл формулы רֵיחַ נִיחֹחַ
  choice: приятное благоухание
  alternative: успокоительное благоухание
  rationale: Выбранная формулировка выражает благоугодность жертвы Богу, сохраняя образ благоухания и не утверждая, что жертва буквально успокаивает Бога.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культовой речи. Перечень жертвенных животных передан ясно и без архаической инверсии; «ягнята-самцы» сохраняет значимую детализацию еврейского текста.
