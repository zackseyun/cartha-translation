  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: ru
  text: А в четвёртый день — десять быков, два барана и четырнадцать годовалых ягнят без порока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: А в четвёртый день
  rationale: Союз ו продолжает последовательный перечень, а сочетание предлога с порядковым числительным естественно передаётся по-русски как «в четвёртый день».
- source_word: פָּרִים עֲשָׂרָה
  choice: десять быков
  rationale: В контексте жертвоприношений פָּרִים обозначает быков; число перед существительным соответствует естественному русскому порядку слов.
- source_word: אֵילִם שְׁנָיִם
  choice: два барана
  rationale: אֵילִם — обычное обозначение взрослых самцов овец, приносимых в жертву.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: четырнадцать годовалых ягнят
  rationale: כְּבָשִׂים передано как «ягнята», а идиома בְּנֵי שָׁנָה — естественным русским определением «годовалые».
- source_word: תְּמִימִם
  choice: без порока
  rationale: В жертвенном законодательстве слово указывает на отсутствие физического изъяна; «без порока» сохраняет точный и традиционно понятный культовый смысл.
