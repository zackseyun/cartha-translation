  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ru
  text: и одного козла в жертву за грех, сверх постоянного всесожжения[a], его хлебного приношения и его возлияния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «регулярного всесожжения».'
    reason: Лексема תָּמִיד может подчёркивать как непрерывность, так и установленную регулярность приношения.
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: и одного козла
  rationale: В жертвенном контексте שָׂעִיר обозначает козла; русское слово «козёл» уже указывает на самца. Числительное אֶחָד естественно передано перед существительным.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В священническом жертвенном контексте חַטָּאת обозначает жертву за грех, а не грех как отвлечённое понятие.
- source_word: מִ/לְּ/בַד
  choice: сверх
  rationale: Оборот показывает, что названная жертва приносится дополнительно к установленному постоянному всесожжению и сопровождающим его приношениям.
- source_word: עֹלַת הַ/תָּמִיד
  choice: постоянного всесожжения
  rationale: עֹלָה — всесожжение, а תָּמִיד указывает на его регулярно продолжающийся, установленный характер. «Постоянное всесожжение» сохраняет традиционный жертвенный термин и исходную характеристику.
- source_word: וּ/מִנְחָתָ/הּ
  choice: и сопровождающих его хлебного приношения
  rationale: В данном культовом контексте מִנְחָה — приношение из зерновых продуктов. Местоименный суффикс относится к всесожжению; синтаксис по-русски перестроен для ясности.
- source_word: וְ/נִסְכָּ/הּ
  choice: и возлияния
  rationale: נֶסֶךְ обозначает сопровождающее жертву возлияние. Принадлежность к всесожжению выражена общим оборотом «сопровождающих его».
