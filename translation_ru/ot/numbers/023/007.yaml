base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: ru
  text: 'И он произнёс своё изречение[a]:


    «Из Арама привёл меня Валак, царь Моава,

    с восточных гор[b]:

    „Приди, прокляни для меня Иакова;

    приди, излей гнев на Израиля[c]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял своё машаль». Еврейское слово обозначает здесь торжественное поэтическое изречение; возможный перевод: «пророческую речь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с гор Востока». Здесь слово, которое может обозначать также древность, вероятнее всего употреблено в географическом смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Второй глагол отличается от переведённого словом «прокляни» и выражает гневное осуждение. Возможный перевод: «вознегодуй на Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: И он произнёс своё изречение
  rationale: Еврейская идиома буквально говорит, что он «поднял/понёс свой машаль», то есть начал торжественное поэтическое высказывание. «Произнёс своё изречение» естественно по-русски и не сужает значение до пословицы.
- source_word: מִן אֲרָם
  choice: Из Арама
  rationale: Сохранено древнее географическое название אֲרָם, без замены на более позднее «Сирия».
- source_word: יַנְחֵנִי
  choice: привёл меня
  rationale: Каузативная форма נחה означает направить, вести. В данном повествовательном контексте «привёл меня» естественно передаёт результат направленного движения, не подразумевая, что Валак лично сопровождал Валаама.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: с восточных гор
  rationale: קֶדֶם истолковано пространственно как «восток», что соответствует параллельному упоминанию Арама и происхождению Валаама.
- source_word: לְכָה
  choice: приди
  rationale: Императив передаёт призыв или приглашение действовать и естественно звучит по-русски как «приди».
- source_word: אָרָה
  choice: прокляни
  rationale: Прямое и общеупотребительное соответствие глаголу со значением наложения проклятия.
- source_word: לִּי
  choice: для меня
  rationale: Дательный элемент обозначает действие в интересах Валака; «для меня» сохраняет это значение кратко и естественно.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено личное и одновременно национальное имя в традиционной русской форме.
- source_word: זֹעֲמָה
  choice: навлеки гнев на
  rationale: Глагол זעם отличается от אָרַר и связан с гневом, негодованием и осуждением. Формулировка сохраняет лексическое различие и в контексте выражает призыв подвергнуть Израиль гневному осуждению.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Сохранено личное и национальное имя в традиционной русской форме.
theological_decisions:
- issue: Соотношение имён Иаков и Израиль в просьбе Валака
  choice: Сохранить оба имени как параллельные обозначения одного народа
  alternative: Объединить их в одно обозначение, например «израильтяне»
  rationale: Еврейская поэзия намеренно использует параллель «Иаков — Израиль». Сохранение обоих имён передаёт литературное и заветное звучание без добавочного богословского толкования.
- issue: Значение второго глагола проклятия זֹעֲמָה
  choice: Передать как «навлеки гнев на», отличая его от אָרָה «прокляни»
  alternative: Повторить «прокляни» или употребить «предай проклятию»
  rationale: Так сохраняется различие между двумя еврейскими глаголами и их напряжённый параллелизм; перевод не уточняет, чей именно гнев должен быть обращён на Израиль.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Стиховые строки отражают параллелизм оригинала. Имена переданы в традиционной русской библейской форме; неоднозначность второго глагола отмечена в сноске.
