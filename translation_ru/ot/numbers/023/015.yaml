  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: ru
  text: 'И сказал он Валаку: «Стой здесь, у своего всесожжения, а я встречусь там[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «а я буду встречен там». В древнееврейском тексте не названо, с кем или кем будет вызвана эта встреча; по контексту она может подразумевать Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: И сказал он Валаку
  rationale: Сохраняет обычное повествовательное продолжение древнееврейского текста и ясно обозначает адресата речи.
- source_word: הִתְיַצֵּב
  choice: Стой
  rationale: Императив породы хитпаэль означает занять место и оставаться там; краткое «стой» естественно передаёт это в данном контексте.
- source_word: כֹּה
  choice: здесь
  rationale: Первое כֹּה имеет пространственное, указательное значение и обозначает место, где должен остаться Валак.
- source_word: עַל עֹלָתֶךָ
  choice: при своём всесожжении
  rationale: Предлог עַל здесь указывает на положение рядом с жертвой, а עֹלָה — установленный термин для всесожжения. «При» звучит естественно и не создаёт ложного представления, будто Валак должен стоять на жертве.
- source_word: וְאָנֹכִי
  choice: а я
  rationale: 'Явно выраженное местоимение подчёркивает противопоставление: Валак остаётся у жертвы, а Валаам ожидает встречи в другом месте.'
- source_word: אִקָּרֶה
  choice: встречусь с Ним
  rationale: Краткая форма от קרה в нифале обозначает встречу или столкновение. Личный объект в стихе не назван, но из ближайшего контекста ожидается встреча с Богом; местоимение делает русскую фразу естественной, а сноска сохраняет исходную недосказанность.
- source_word: כֹּה
  choice: там
  rationale: Повторное כֹּה указывает на другое место и в русском естественно противопоставляется первому «здесь».
theological_decisions:
- issue: Не названный прямо участник ожидаемой встречи
  choice: Передать «встречусь с Ним», понимая местоимение по контексту как указание на Бога, но отметить его имплицитность сноской.
  alternative: «встречусь там» или «буду встречен там» без названного участника встречи.
  rationale: В древнееврейском стихе объект прямо не выражен, поэтому имя Бога не вводится в основной текст. Вместе с тем русское «встречусь с Ним» естественно передаёт подразумеваемую личную встречу; сноска не позволяет скрыть грамматическую краткость и неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским термином «всесожжение». Синтаксис краткий и достойный; пространственное противопоставление כֹּה…כֹּה передано как «здесь…там». Заглавная буква в «Ним» показывает контекстуальную отсылку к Богу, не вводя Его имени в сам стих.
