id: NUM.23.13
reference: Numbers 23:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: ru
  text: 'И сказал ему Валак: «Пойди, пожалуйста, со мной в другое место, откуда ты сможешь увидеть его. Ты увидишь лишь его край[a], но всего его не увидишь[b]. И прокляни его для меня оттуда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишь его крайнюю часть». Речь идёт о том, что с нового места будет видна только часть народа Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте Израиль как единый народ обозначен местоимениями мужского рода в единственном числе: «его», «всего его». По смыслу возможно также: «их», «всех их».'
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא
  choice: Пойди, пожалуйста
  rationale: Повелительная форма הלך с частицей נָא выражает вежливое побуждение. Русское «пойди, пожалуйста» сохраняет и форму обращения к одному лицу, и просьбу переместиться вместе с Валаком.
- source_word: אִתִּי
  choice: со мной
  rationale: Прямо передаёт совместность действия и приглашение Валака отправиться на новое место вместе.
- source_word: מָקוֹם אַחֵר
  choice: другое место
  rationale: Естественная и точная передача конкретной смены места наблюдения.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: откуда ты сможешь увидеть его
  rationale: Оборот обозначает новое место как точку обзора; «сможешь» естественно передаёт предполагаемую возможность увидеть Израиль оттуда.
- source_word: אֶפֶס קָצֵהוּ
  choice: лишь его край
  rationale: אֶפֶס имеет ограничительное значение, а קָצֶה обозначает край, конец или крайнюю часть. Формулировка сохраняет образ частичного обзора, не сводя его без пояснения просто к «части».
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: но всего его не увидишь
  rationale: Противительный союз естественно подчёркивает контраст между видимым краем и всем народом; единственное число исходного текста сохранено.
- source_word: וְקָבְנוֹ לִי
  choice: И прокляни его для меня
  rationale: Глагол קבב в повествовании о Валааме означает наложение проклятия. «Для меня» сохраняет заинтересованность и просьбу Валака, выраженную לִי.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: 'Сохраняет пространственную логику замысла Валака: проклятие должно быть произнесено с новой точки обзора.'
theological_decisions:
- issue: Единственное число местоименных суффиксов при обозначении Израиля
  choice: 'Сохранить мужское единственное число: «его», «всего его»'
  alternative: 'Передать собирательно во множественном числе: «их», «всех их»'
  rationale: В еврейском тексте Израиль представлен как единый народ посредством последовательных форм единственного числа. В русском это грамматически естественно, поскольку название «Израиль» мужского рода, и сохраняет риторическое единство народа.
- issue: Значение повелительной формы לך в контексте совместного перемещения
  choice: «Пойди, пожалуйста, со мной»
  alternative: «Пойдём со мной» или «Иди со мной»
  rationale: Выбранный вариант сохраняет повелительное обращение к Валааму и вежливую частицу נָא. «Пойдём» было бы естественным приглашением, но изменило бы грамматическое лицо и число исходной формы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным для широкого читателя; необычный образ «его край» сохранён из исходного текста и пояснён сноской.
