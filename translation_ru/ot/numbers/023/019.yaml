  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: ru
  text: 'Бог — не человек, чтобы Ему лгать,

    и не сын человеческий[a], чтобы Ему передумать[b].


    Неужели Он скажет — и не сделает?


    Неужели произнесёт — и не исполнит[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «сын человеческий» означает просто человека; это не мессианский титул.
    reason: cultural_note
  - marker: b
    text: 'Или: «отступиться от решения». Еврейский глагол может означать изменение намерения или отказ от намеченного; здесь речь о Божьей надёжности, а не о нравственном раскаянии.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не осуществит», «не утвердит». Буквально: «не сделает так, чтобы оно стояло», то есть не сделает сказанное действительным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: В контексте אֵל обозначает Бога Израиля; «Бог» естественно передаёт противопоставление человеку.
- source_word: אִישׁ
  choice: человек
  rationale: Сохраняет прямое противопоставление Бога человеку и естественно звучит по-русски.
- source_word: וִיכַזֵּב
  choice: чтобы Ему лгать
  rationale: כזב означает «лгать, оказаться ложным»; здесь речь о Божьей правдивости и надёжности.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Сохраняет еврейский поэтический параллелизм; примечание поясняет, что это обычное обозначение человека, а не титул.
- source_word: וְיִתְנֶחָם
  choice: чтобы Ему передумать
  rationale: Форма от נחם здесь обозначает изменение решения или намерения; «передумать» ясно передаёт смысл без оттенка нравственного покаяния.
- source_word: הַהוּא אָמַר וְלֹא יַעֲשֶׂה
  choice: Неужели Он скажет — и не сделает?
  rationale: Риторический вопрос естественно передаёт уверенность в том, что Бог осуществляет сказанное.
- source_word: וְדִבֶּר
  choice: Пообещает
  rationale: В данном параллелизме речь означает произнесённое обязательство; «пообещает» естественно выражает подразумеваемый смысл, хотя буквально стоит «скажет/изречёт».
- source_word: יְקִימֶנָּה
  choice: не исполнит
  rationale: Порода hифиль от קום буквально означает «поставить, утвердить», а применительно к слову — осуществить или исполнить его.
theological_decisions:
- issue: Смысл וְיִתְנֶחָם применительно к Богу
  choice: передумать
  alternative: отступиться; раскаяться
  rationale: Контекст утверждает Божью надёжность в отличие от человеческой переменчивости. Такой перевод не навязывает тексту более широкую философскую формулу и не предполагает нравственного покаяния Бога.
- issue: Статус выражения בֶן אָדָם
  choice: обычное поэтическое обозначение человека
  alternative: мессианский титул
  rationale: В этом контексте выражение параллельно слову אִישׁ и обозначает смертного человека вообще, а не особый титул.
- issue: Передача יְקִימֶנָּה
  choice: исполнит
  alternative: утвердит; осуществит
  rationale: «Исполнит» ясно передаёт осуществление сказанного Богом, сохраняя основной смысл образного еврейского выражения «поставить [слово]».
translation_notes:
  register: Современный литературный русский язык с достоинством и ясным поэтическим параллелизмом. Риторические вопросы сохранены. «Пообещает» выбрано как контекстуально естественная передача דִבֶּר, а буквальная образность יְקִימֶנָּה отражена в примечании.
