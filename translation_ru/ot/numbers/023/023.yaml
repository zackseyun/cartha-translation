source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: ru
  text: 'Ибо нет ворожбы против Иакова и гадания против Израиля; в это время будет сказано Иакову и Израилю: «Что совершил Бог!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нет ворожбы в Иакове и нет гадания в Израиле». Еврейский предлог допускает оба понимания; в контексте вероятнее значение «против». Также фразу «Что совершил Бог!» можно формально понять как вопрос: «Что совершил Бог?»'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: ворожба
  rationale: Обозначает практику истолкования знамений и магического предсказания; «ворожба» естественно передаёт оккультный характер слова и позволяет отличить его от קֶסֶם.
- source_word: קֶסֶם
  choice: гадание
  rationale: Обозначает оккультное предсказание или прорицание. В паре с «ворожбой» сохраняет смысловую близость двух терминов без полного их отождествления.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: против Иакова / против Израиля
  rationale: В контексте прорицаний Валаама предлог בְּ указывает на направленность оккультных действий против Израиля; речь идёт прежде всего об их бессилии причинить ему вред. Буквальное «в» остаётся возможным и отмечено в сноске.
- source_word: כָּעֵת
  choice: в своё время
  rationale: Передаёт мысль о надлежащем или наступившем времени, когда Божье деяние становится явным и о нём возвещают, не сужая выражение до простого «сейчас».
- source_word: יֵאָמֵר
  choice: будет сказано
  rationale: Безличная пассивная конструкция сохраняет форму нифаля и пророческую направленность высказывания.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: Иакову и Израилю
  rationale: Дательный падеж формально и естественно передаёт לְ, сохраняя возможность понимать Иакова и Израиль как адресатов возвещения.
- source_word: מַה פָּעַל אֵל
  choice: Вот что совершил Бог!
  rationale: מַה здесь понято как восклицательное указание на великое Божье деяние, а не как вопрос. «Вот что» ясно выражает эту силу по-русски; совершенный вид «совершил» соответствует перфекту פָּעַל.
- source_word: אֵל
  choice: Бог
  rationale: Обычный и контекстуально достаточный русский эквивалент общего божественного титула אֵל.
theological_decisions:
- issue: Отрицает ли стих наличие оккультных практик внутри Израиля или их действенность против Израиля
  choice: Ворожба и гадание не имеют силы против Иакова и Израиля.
  alternative: В Иакове и Израиле нет ворожбы и гадания.
  rationale: 'Контекст благословения Валаама и невозможности проклясть Израиль поддерживает значение направленности: оккультные средства бессильны против народа. Однако предлог допускает более буквальное пространственно-сферическое понимание, поэтому оно сохранено в сноске.'
- issue: Является ли מַה פָּעַל אֵל вопросом или восклицанием
  choice: 'Восклицание: «Вот что совершил Бог!»'
  alternative: 'Вопрос: «Что совершил Бог?»'
  rationale: Строка торжественно возвещает явившееся Божье действие ради Израиля; восклицание лучше соответствует кульминации пророческого изречения, хотя сама форма допускает внешне вопросительное прочтение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Термины «ворожба» и «гадание» сохраняют оккультную семантику и поэтический параллелизм; архаизм «соделал» не используется. Все сноски обозначены в основном тексте.
