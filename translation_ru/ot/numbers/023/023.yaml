  naturalness: Текст в целом литературный и ясный. «В это время будет сказано» сохраняет пророческую перспективу и звучит естественнее, чем «в своё время» в данном контексте. Удаление добавочного «вот» делает кульминационную фразу ближе к лаконичному еврейскому восклицанию.
  terminology: «Ворожба» для נַחַשׁ и «гадание» для קֶסֶם — приемлемая, понятная современному читателю пара. «Бог» адекватно передаёт אֵל. Сноска a корректно отмечает возможное понимание предлога; сноска b корректно фиксирует вопросительное прочтение.
