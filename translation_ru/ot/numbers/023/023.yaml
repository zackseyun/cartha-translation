  - severity: low
    issue: Добавочное «Вот» в заключительном восклицании
    rationale: «Вот что совершил Бог!» хорошо звучит по-русски, но указательное слово отсутствует в оригинале. «Что совершил Бог!» передаёт ту же восклицательную силу без добавления.
