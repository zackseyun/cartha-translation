  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: ru
  text: Как мне проклясть того, кого не проклял Бог? И как мне гневно осудить того, кого не осудил Яхве?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как мне негодовать на того, на кого не негодовал Яхве?» Еврейский глагол во второй строке может означать как негодование, так и выраженное в гневе осуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Как мне
  rationale: В риторическом вопросе выражает невозможность действия, а не запрос сведений; по-русски это естественно передаётся оборотом «Как мне…?»
- source_word: אֶקֹּב / קַבֹּה
  choice: проклясть / не проклял
  rationale: Обе формы обозначают проклятие; единый русский корень сохраняет их лексическую и поэтическую связь.
- source_word: אֵל
  choice: Бог
  rationale: Здесь אֵל естественно передаётся общим обозначением Бога, а не транслитерацией «Эль».
- source_word: אֶזְעֹם / זָעַם
  choice: гневно осудить / не осудил
  rationale: זעם сочетает оттенки гнева, негодования и выраженного осуждения. «Гневно осудить» сохраняет оба основных компонента, а повтор корня «осудить» отражает соответствие форм в параллельных частях строки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией и сохранено отличным от титула אֵל.
theological_decisions:
- issue: Различение божественных наименований אֵל и יְהוָה
  choice: Передать как «Бог» и «Яхве»
  alternative: Передать оба наименования словом «Бог» или заменить יְהוָה титулом «Господь»
  rationale: Еврейский параллелизм употребляет два разных наименования; перевод сохраняет как общий титул, так и личное имя, не отождествляя их на лексическом уровне.
- issue: Подразумеваемое дополнение при глаголах проклятия и осуждения
  choice: Добавить «того, кого»
  alternative: 'Оставить дополнение невыраженным: «Как мне проклясть? Ведь Бог не проклял»'
  rationale: В еврейской поэтической строке объект восстанавливается из контекста — речь идёт об Израиле. Русское «того, кого» делает синтаксис ясным, не называя объект точнее, чем исходный текст.
translation_notes:
  register: Современный литературный русский с кратким, торжественным риторическим параллелизмом. Формы «проклясть» и «гневно осудить» различают два еврейских глагола, не устраняя смысловой близости между ними.
