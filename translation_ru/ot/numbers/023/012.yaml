  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Степень обязательности и точности речи Валаама
  choice: Разве не должен я следить за тем, чтобы говорить…
  alternative: Разве не должен я говорить…
  rationale: Формулировка сохраняет и риторически выраженную обязанность, и оттенок внимательного соблюдения в אֶשְׁמֹר, не превращая Валаама в механически лишённого воли говорящего.
