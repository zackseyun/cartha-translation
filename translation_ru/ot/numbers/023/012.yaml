- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном, без замены титулом.
- source_word: בְּפִי
  choice: в мои уста
  rationale: Сохранён понятный русский библейский образ данного свыше слова.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: следить за тем, чтобы говорить
  rationale: Конструкция передаёт не просто произнесение, но внимательное соблюдение требования говорить именно данные слова.
theological_decisions:
