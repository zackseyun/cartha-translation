  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: ru
  text: И он вернулся к нему, и вот, тот стоял у своего всесожжения — он и все князья Моава.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: И он вернулся к нему
  rationale: 'Сохраняет местоименную неоднозначность еврейского текста: по контексту речь идёт о возвращении Валаама к Валаку, но имена в стихе не добавляются.'
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: стоял у своего всесожжения
  rationale: נצב передаёт устойчивое положение стоя; על в данном пространственном контексте естественно передано как «у», а עֹלָה — традиционным и точным термином «всесожжение».
- source_word: שָׂרֵי מוֹאָב
  choice: князья Моава
  rationale: שָׂרִים обозначает высокопоставленных правителей или вельмож; «князья» соответствует библейскому регистру и контексту.
theological_decisions:
- issue: Неявные участники действия
  choice: Сохранены местоимения «он» и «тот» без подстановки имён
  alternative: «Валаам вернулся к Валаку»
  rationale: Исходный стих обозначает участников местоимениями; контекст позволяет их определить, но перевод не должен устранять присущую формулировке референциальную неявность.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Частица «вот» сохраняет הִנֵּה, а тире естественно выделяет присоединённую группу «он и все князья Моава».
