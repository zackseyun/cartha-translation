  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ru
  text: 'И сказал Валаам Валаку: «Построй мне здесь семь жертвенников и приготовь мне здесь семь быков и семь баранов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательным имперфектом продолжает повествование; традиционная и естественная русская формула «И сказал» передаёт эту связь без излишнего уточнения последовательности.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: אֶל בָּלָק
  choice: Валаку
  rationale: Дательный падеж естественно передаёт адресата речи; имя дано в его устойчивой русской библейской форме.
- source_word: בְּנֵה
  choice: Построй
  rationale: Прямой и естественный эквивалент повелительной формы глагола בנה применительно к жертвенникам.
- source_word: לִי
  choice: мне
  rationale: Передаёт значение предназначения или пользы; местоимение сохранено в обоих случаях вслед за еврейским текстом.
- source_word: בָזֶה
  choice: здесь
  rationale: В контексте выражение указывает на место. Повтор «здесь» сохранён, чтобы передать повторный локативный акцент оригинала.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: семь жертвенников
  rationale: Прямая передача числительного и существительного в культовом контексте.
- source_word: וְהָכֵן
  choice: и приготовь
  rationale: Каузативная форма כון означает привести в готовность; «приготовь» естественно сочетается с животными, предназначенными для жертвоприношения.
- source_word: שִׁבְעָה פָרִים
  choice: семь быков
  rationale: פַּר обозначает быка, особенно в жертвенном контексте; возраст животного здесь отдельно не обозначен.
- source_word: וְשִׁבְעָה אֵילִים
  choice: и семь баранов
  rationale: אֵילִים точно обозначает взрослых самцов овец; «бараны» — обычный современный русский эквивалент.
