  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: ru
  text: Он не усмотрел беды в Иакове и не увидел страдания в Израиле.[a] Яхве, его Бог, с ним, и возглас царя — в нём.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он не усмотрел беззакония в Иакове и не увидел нечестия (или тяготы) в Израиле». Еврейские слова могут обозначать как нравственное зло, так и беду, страдание или несчастье.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в нём». Израиль представлен здесь как собирательное единство.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «возглас царя» может означать царское приветствие или ликование среди Израиля и, возможно, указывать на царское присутствие Яхве; еврейский текст не уточняет это прямо.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: не усмотрел
  rationale: Передаёт направленное, внимательное восприятие, выраженное глаголом נבט, и сохраняет отличие от следующего ראה.
- source_word: אָוֶן
  choice: беды
  rationale: Слово может обозначать как нравственное зло, так и беду или несчастье. В основном тексте выбран контекстуально уместный смысл бедствия, а нравственное прочтение сохранено в примечании.
- source_word: רָאָה
  choice: не увидел
  rationale: Прямой и естественный эквивалент ראה, сохраняющий зрительный образ и поэтический параллелизм.
- source_word: עָמָל
  choice: страдания
  rationale: Передаёт значение тяготы, мучения или бедствия и не дублирует дословно выбранное для אָוֶן слово «беда».
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: в Иакове / в Израиле
  rationale: Локативное значение предлога ב сохраняет параллельную структуру еврейского стиха; Иаков и Израиль обозначают народ как единое целое.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: его Бог, с ним
  rationale: Сохранены мужские формы единственного числа, поскольку Израиль представлен как собирательное единство.
- source_word: תְרוּעַת מֶלֶךְ
  choice: возглас царя
  rationale: «Возглас» допускает ликование, боевой клич или царское приветствие, не уточняя сверх текста характер звука и не отождествляя прямо царя с Яхве.
- source_word: בּוֹ
  choice: в нём
  rationale: Формально передан суффикс единственного числа, продолжающий олицетворение Израиля как одного лица.
theological_decisions:
- issue: Говорит ли стих о нравственной безгрешности Израиля или об отсутствии постигшего его бедствия
  choice: Основной текст говорит о беде и страдании, которых Бог не усмотрел в Иакове-Израиле.
  alternative: «Он не усмотрел беззакония в Иакове и не увидел нечестия (или тяготы) в Израиле».
  rationale: אָוֶן и עָמָל имеют как нравственные, так и связанные с бедствием значения. Контекст благословения поддерживает значение беды, однако лексически возможное нравственное прочтение нельзя устранять, поэтому оно отмечено в сноске.
- issue: Кого обозначает «царь» и что означает תְרוּעָה
  choice: Сохранено неопределённое выражение «возглас царя».
  alternative: «ликование перед Царём», «приветственный крик царю» или «боевой клич царя».
  rationale: Контекст присутствия Яхве может указывать на его царское присутствие, но сама еврейская конструкция не выражает это отождествление однозначно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Формы «в Иакове», «в Израиле» и «в нём» намеренно сохраняют параллелизм и собирательное олицетворение исходного текста; архаизмы избегаются.
