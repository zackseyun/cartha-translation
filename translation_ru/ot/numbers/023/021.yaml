  source_fidelity: 'Перевод точно передаёт еврейскую поэтическую структуру и формы совершенного вида: «не усмотрел / не увидел». Значения אָוֶן и עָמָל как бедствия и страдания контекстуально оправданны; нравственное прочтение сохранено в примечании. Единственное число в «его Бог, с ним» и «в нём» корректно сохраняет олицетворение Израиля как собирательного единства. Неопределённость выражения תְרוּעַת מֶלֶךְ не снимается.'
