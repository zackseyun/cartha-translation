base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: ru
  text: 'И сказал Валак Валааму: «Что ты со мной сделал? Я взял тебя, чтобы проклясть моих врагов, но вот, ты действительно благословил их!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейский текст: «благословил, благословил»; личная форма глагола сочетается с абсолютным инфинитивом для усиления. Возможный перевод: «и вот, ты поистине благословил их!»'
    reason: Пояснение древнееврейской эмфатической конструкции и возможного способа передать её по-русски.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с имперфектом продвигает повествование; традиционная русская повествовательная связка естественна и сохраняет последовательность.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Что ты со мной сделал?
  rationale: Предлог ל при глаголе в данном вопросе естественно передаётся по-русски конструкцией «сделать с кем-либо»; вопрос выражает возмущение результатом только что совершённого действия.
- source_word: לָקֹב
  choice: чтобы проклясть
  rationale: Глагол קבב здесь означает произнести проклятие на кого-либо; «проклясть» — ясный и прямой русский эквивалент.
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Прямая передача существительного во множественном числе с притяжательным суффиксом.
- source_word: לְקַחְתִּיךָ
  choice: Я взял тебя
  rationale: Сохраняет базовое значение לקח и не добавляет отсутствующую в стихе идею найма; в контексте означает, что Валак привёл или пригласил Валаама с определённой целью.
- source_word: וְהִנֵּה
  choice: а ты
  rationale: Противительное «а» естественно выражает неожиданное несоответствие; отдельное «вот» в этой реплике по-русски звучало бы тяжелее.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: благословил — да ещё как!
  rationale: Конечная форма с абсолютным инфинитивом эмфатически усиливает действие. Русская конструкция «да ещё как» передаёт это усиление естественно, не превращая его в указание на многократность или исключительность действия.
