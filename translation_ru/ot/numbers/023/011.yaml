  source_fidelity: 'Основной смысл передан точно: Валак возмущён тем, что вместо проклятия его врагов Валаам произнёс над ними благословение. Однако разговорное «да ещё как!» слишком экспрессивно и стилистически снижает библейскую прямую речь; кроме того, сноска неточно называет русское деепричастие буквальным воспроизведением древнееврейской формы.'
  naturalness: «Что ты со мной сделал?» и «Я взял тебя, чтобы проклясть моих врагов» естественны для современного литературного русского. «Но вот, ты действительно благословил их!» сохраняет неожиданность וְהִנֵּה и эмфатическое усиление инфинитива абсолюта без разговорной окраски.
