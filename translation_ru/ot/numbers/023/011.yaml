  rationale: 'Исправление сохраняет все смысловые компоненты оригинала: последовательность повествования, возмущённый вопрос, цель прихода Валаама, контраст «но вот» и усиленное утверждение о благословении. Нейтральное «действительно» лучше соответствует современному литературному регистру, а сноска точно описывает абсолютный инфинитив, не выдавая деепричастную русскую конструкцию за буквальную форму оригинала.'
