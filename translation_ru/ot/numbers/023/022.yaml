lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: Существительное выступает подлежащим; простое «Бог» точно и естественно передаёт его функцию, не добавляя отсутствующего в тексте определения «могучий».
- source_word: מוֹצִיאָם
  choice: выводит их
  rationale: Причастная форма породы хифиль с суффиксом 3-го лица множественного числа живо представляет Бога как Того, кто выводит их. Настоящее время сохраняет поэтическую актуализацию исхода, не отрицая его исторического характера.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: При глаголе движения это естественная русская передача исходного пункта и ясная отсылка к исходу.
- source_word: כְּתוֹעֲפֹת
  choice: словно рога
  rationale: 'Значение редкого слова спорно: оно может обозначать рога, возвышающиеся выступы или переносно мощь. Конкретный образ рогов хорошо согласуется с упоминанием дикого быка и сохраняет образность, а неопределённость отмечена в сноске.'
- source_word: רְאֵם
  choice: дикий бык
  rationale: Речь, вероятнее всего, о могучем диком быке, возможно туре, а не о мифическом единороге. «Дикий бык» понятно современному читателю и не требует специального зоологического знания.
- source_word: לוֹ
  choice: у него
  rationale: Сохранено местоимение 3-го лица единственного числа Масоретского текста. Оно, вероятно, относится к Израилю как к единому народу; перевод не заменяет его множественным числом и не устраняет возможную неоднозначность.
theological_decisions:
- issue: Образ רְאֵם
  choice: дикий бык
  alternative: тур; единорог
  rationale: Современные лексические данные указывают на крупное дикое бычье животное. Традиционное «единорог» отражает историю перевода, но, вероятнее всего, не исходный образ.
- issue: К кому относится לוֹ («у него»)
  choice: сохранить единственное число без явного уточнения референта
  alternative: «у них» или прямое пояснение «у Израиля»
  rationale: Еврейский текст переходит от множественного «их» к единственному «у него», вероятно представляя Израиль как единое целое. Сглаживание перехода устранило бы грамматическую и смысловую напряжённость оригинала.
