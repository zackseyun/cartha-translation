  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: ru
  text: 'И сказал Валак Валааму: «Не проклинай его вовсе и не благословляй его вовсе!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма с waw-consecutive; русский союз «и» естественно сохраняет последовательность повествования.
- source_word: בָּלָק ... בִּלְעָם
  choice: Валак ... Валааму
  rationale: Традиционная русская библейская передача личных имён; дательный падеж передаёт אֶל при глаголе речи.
- source_word: גַּם ... גַּם
  choice: ни ... но и не
  rationale: В параллельных отрицательных предписаниях повторение גַּם обозначает обе исключаемые возможности; такая конструкция естественна по-русски и сохраняет противопоставление проклятия и благословения.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: ни в коем случае не проклинай его
  rationale: Инфинитив абсолютный перед личной формой того же корня придаёт запрету сильное эмфатическое значение; «ни в коем случае» ясно передаёт эту силу.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: но и не благословляй
  rationale: Второй эмфатический запрет образует параллель первому. Общая конструкция «ни в коем случае ... но и не...» распространяет категоричность на обе части без неестественного русского повтора.
