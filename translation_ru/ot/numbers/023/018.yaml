  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: ru
  text: 'Он произнёс своё изречение[a]: «Встань, Валак, и слушай; внимай мне, сын Циппора!»'
  philosophy: optimal-equivalence
  footnotes:
