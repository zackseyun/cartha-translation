lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: произнёс он своё изречение
  rationale: Сочетание נשׂא с מָשָׁל идиоматически вводит торжественное поэтическое высказывание. «Произнёс» естественно передаёт функцию оборота, а «изречение» сохраняет возвышенный и несколько афористический характер מָשָׁל.
- source_word: וַיֹּאמַר
  choice: (передано двоеточием перед прямой речью)
  rationale: После русского глагола «произнёс» отдельное «и сказал» звучало бы тяжеловесно; начало прямой речи ясно передаёт функцию еврейского וַיֹּאמַר.
- source_word: קוּם
  choice: Встань
  rationale: Императив обращён к Валаку. «Встань» естественнее современного русского «восстань» и лучше соответствует торжественному контексту, чем разговорное «поднимись».
- source_word: וּשֲׁמָע
  choice: и слушай
  rationale: שׁמע здесь образует параллель с הַאֲזִינָה. «Слушай» выражает прямой призыв воспринимать речь.
- source_word: הַאֲזִינָה עָדַי
  choice: внимай мне
  rationale: Глагол אזן в породе Hiphil означает внимательное слушание. «Внимай мне» передаёт усиление относительно «слушай» и сохраняет поэтический регистр.
- source_word: בְּנוֹ צִפֹּר
  choice: сын Сепфора
  rationale: Сохранена патронимическая форма обращения. Традиционная русская библейская передача имени צִפֹּר — «Сепфор».
