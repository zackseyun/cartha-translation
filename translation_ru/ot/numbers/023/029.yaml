base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ru
  text: 'Тогда Валаам сказал Валаку: «Построй мне здесь семь жертвенников и приготовь мне здесь семь быков и семь баранов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; «тогда» естественно передаёт переход к следующему действию.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: אֶל בָּלָק
  choice: Валаку
  rationale: Русское управление глагола «сказать» естественно передаёт адресата дательным падежом; имя дано в традиционной форме «Валак».
- source_word: בְּנֵה
  choice: Построй
  rationale: Императив от בנה прямо обозначает сооружение жертвенников; «построй» точно и естественно.
- source_word: לִי
  choice: мне
  rationale: 'Дательный падеж передаёт значение предназначения или выгоды: жертвенники и животные подготавливаются для Валаама и совершаемого им обряда.'
- source_word: בָּזֶה
  choice: здесь
  rationale: Естественный русский эквивалент буквального «в этом [месте]»; повтор сохранён в обеих частях стиха.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: семь жертвенников
  rationale: Прямое соответствие числительного и существительного; «жертвенник» — установившееся точное обозначение культового сооружения.
- source_word: וְהָכֵן
  choice: и приготовь
  rationale: Императив породы hифиль от כון означает «подготовить, сделать готовым»; в контексте жертвенных животных естественно «приготовь».
- source_word: שִׁבְעָה פָרִים
  choice: семь быков
  rationale: פַּר в жертвенном контексте обозначает быка; возраст животного в тексте не уточнён, поэтому «молодых» не добавлено.
- source_word: וְשִׁבְעָה אֵילִים
  choice: и семь баранов
  rationale: אֵיל обозначает взрослого самца овцы; современный русский эквивалент — «баран».
theological_decisions: []
