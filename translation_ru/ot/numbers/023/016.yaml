  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: ru
  text: 'И встретил Яхве Валаама, и вложил слово в его уста, и сказал: «Вернись к Валаку и скажи так».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּר
  choice: встретился
  rationale: Глагол קָרָה здесь обозначает встречу или непосредственное столкновение; «встретился» естественно по-русски и не уточняет способ божественного явления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: вложил слово в его уста
  rationale: Сохранён древнееврейский образ дарованной свыше речи; единственное число דָּבָר передано словом «слово».
- source_word: שׁוּב
  choice: Вернись
  rationale: Императив велит Валааму возвратиться к Валаку; «вернись» ясно и естественно в прямой речи.
- source_word: וְכֹה תְדַבֵּר
  choice: и скажи так
  rationale: Кратко и естественно передаёт вводную формулу כֹה со значением последующей предписанной речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя без замены титулом.
- issue: Характер встречи Яхве с Валаамом
  choice: встретился
  alternative: явился; встретил
  rationale: Формулировка сохраняет широту значения קָרָה и не утверждает сверх текста, что речь шла именно о видимом явлении.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Образ «вложил слово в его уста» сохранён как понятная и значимая пророческая формула; архаичное «так говори» заменено естественным «скажи так».
