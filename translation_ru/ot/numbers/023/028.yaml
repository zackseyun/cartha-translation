  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: ru
  text: И Валак привёл Валаама на вершину Фегора, откуда открывается вид на пустыню[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на Иешимон». Еврейское слово можно понимать либо как обозначение пустыни, либо как название местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: И повёл
  rationale: В данном контексте לקח означает, что Валак отвёл или повёл Валаама в другое место; начальное וַ продвигает повествование, поэтому естественно передано союзом «и».
- source_word: בָּלָק
  choice: Валак
  rationale: Традиционная и узнаваемая русская форма личного имени.
- source_word: אֶת בִּלְעָם
  choice: Валаама
  rationale: Традиционная русская форма имени; винительный падеж передаёт функцию прямого дополнения, тогда как показатель אֶת отдельно не переводится.
- source_word: רֹאשׁ הַפְּעוֹר
  choice: на вершину Фегора
  rationale: В топографическом контексте רֹאשׁ обозначает вершину или верх возвышенности. Название Пеор передано традиционной русской библейской формой «Фегор».
- source_word: הַנִּשְׁקָף עַל־פְּנֵי
  choice: откуда открывается вид на
  rationale: Причастие Niphal от שׁקף описывает возвышенность, с которой просматривается лежащая внизу местность. Русская формулировка естественно передаёт топографический смысл, не сохраняя неестественную буквальную идиому «на лицо».
- source_word: הַיְשִׁימֹן
  choice: пустыню
  rationale: Слово может быть нарицательным обозначением пустынной, безлюдной местности либо топонимом Иешимон; в основном тексте выбран ясный нарицательный смысл, а неоднозначность сохранена в сноске.
