  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: ru
  text: 'И Бог встретился с Валаамом[a], и тот сказал Ему: «Я устроил семь жертвенников и принёс в жертву на жертвеннике быка и барана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог встретил Валаама»; еврейский глагол обозначает встречу и в некоторых контекстах может иметь оттенок неожиданности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: встретился
  rationale: Глагол от קרה обозначает встречу или столкновение; возвратная форма естественна по-русски и передаёт реальную встречу Бога с Валаамом, не придавая ей оттенка случайности.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: При глаголе в единственном числе форма обозначает единого Бога.
- source_word: בִּלְעָם
  choice: Валаам
  rationale: Использована традиционная и общепонятная русская форма имени.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: и тот сказал Ему
  rationale: Указательное местоимение ясно обозначает Валаама как говорящего, что подтверждается последующей речью от первого лица; «Ему» относится к Богу.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: семь жертвенников
  rationale: Определённость в русском языке понятна из контекста; артикль отдельного выражения не требует.
- source_word: עָרַכְתִּי
  choice: я приготовил
  rationale: ערך значит привести в порядок, устроить или приготовить; применительно к жертвенникам «приготовил» звучит естественно и точно.
- source_word: וָאַעַל
  choice: и вознёс
  rationale: В жертвенном контексте עלה означает вознести жертву на жертвеннике; формулировка сохраняет образ исходного глагола и понятна в библейском регистре.
- source_word: פָּר
  choice: быка
  rationale: Стандартное обозначение жертвенного животного; текст не требует уточнения возраста.
- source_word: וָאַיִל
  choice: и барана
  rationale: Прямое и стандартное соответствие названию жертвенного животного.
- source_word: בַּמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Сохранено единственное число еврейского текста без поясняющего добавления «на каждом».
theological_decisions:
- issue: Характер встречи Бога с Валаамом в וַיִּקָּר
  choice: Передать как действительную встречу без оттенка случайности
  alternative: «Бог повстречался Валааму» или «Бог встретил Валаама» с возможным оттенком неожиданного столкновения
  rationale: Корень может в иных контекстах иметь оттенок случайной встречи, однако здесь повествование описывает намеренное обращение Бога к Валааму; перевод не должен внушать мысль о случайности Божьего действия.
- issue: Распределительное понимание בַּמִּזְבֵּחַ
  choice: 'Сохранить буквальное единственное число: «на жертвеннике»'
  alternative: «на каждом жертвеннике»
  rationale: Контекст семи жертвенников допускает распределительное понимание, но слово «каждом» отсутствует в еврейском тексте; неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Вознёс» уместно передаёт жертвенный контекст, а конструкция «и тот сказал Ему» устраняет неясность говорящего, не перегружая фразу.
