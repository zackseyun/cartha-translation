  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: ru
  text: Вот, я получил поручение благословить[a]; он благословил[b], и я не могу этого отменить[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я получил — благословить»; что именно было получено, в еврейском тексте прямо не сказано.'
    reason: lexical_alternative
  - marker: b
    text: Субъект глагола в еврейском тексте не назван; из контекста следует, что речь идёт о Боге.
    reason: alternative_reading
  - marker: c
    text: 'Или: «обратить вспять», «отозвать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное для современного литературного русского языка указательно-вводное слово, сохраняющее призыв обратить внимание.
- source_word: בָרֵךְ לָקָחְתִּי
  choice: я получил поручение благословить
  rationale: Буквально конструкция близка к «я получил — благословить», причём объект глагола «получил» не выражен. «Получил поручение благословить» естественно передаёт подразумеваемое в пророческом контексте поручение, а примечание сохраняет формальную неявность объекта.
- source_word: וּבֵרֵךְ
  choice: он благословил
  rationale: Форма совершенного вида 3-го лица мужского рода передана кратко, без добавления имени Бога; из контекста ясно, кто имеется в виду.
- source_word: אֲשִׁיבֶנָּה
  choice: не могу этого отменить
  rationale: Каузативная форма от שוב здесь означает невозможность обратить назад, отозвать или сделать недействительным уже данное благословение. «Отменить» естественно выражает этот смысл по-русски.
theological_decisions:
- issue: Неявный субъект формы וּבֵרֵךְ
  choice: Сохранено местоимение «он» со строчной буквы; контекст указывает на Бога.
  alternative: 'Явно назвать Бога: «Бог благословил».'
  rationale: Еврейский текст не называет субъекта существительным. Местоимение сохраняет лаконичность и формальную неоднозначность оригинала, а примечание сообщает наиболее вероятную контекстуальную референцию.
- issue: Неявный объект при לָקָחְתִּי
  choice: В основном тексте добавлено контекстуально подразумеваемое «поручение».
  alternative: 'Передать формально: «я получил — благословить» или истолковать как «я принял благословение».'
  rationale: Дословная конструкция ненормативна и неясна по-русски. «Поручение» передаёт ситуацию получения пророческого указания, но примечание прямо отмечает, что соответствующее существительное в еврейском тексте отсутствует.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Синтаксис краток и соответствует пророческому высказыванию; добавление «поручение» вынесено на контроль примечанием, чтобы не скрывать эллиптичность оригинала.
