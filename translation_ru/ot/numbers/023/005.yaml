source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: ru
  text: 'И вложил Яхве слово в уста Валаама и сказал: «Вернись к Валаку и говори так».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: вложил
  rationale: Глагол שׂוּם означает «класть, помещать». В сочетании со словами «в уста» русский глагол «вложил» естественно сохраняет конкретный образ исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: דָּבָר
  choice: слово
  rationale: Единственное число соответствует еврейскому тексту; «слово» сохраняет и образ, и возможное значение данного Богом речения, не сужая его до «послания».
- source_word: בְּפִי בִלְעָם
  choice: в уста Валаама
  rationale: Так естественно по-русски передаётся буквальный образ «в рот/уста Валаама»; «уста» уместны в dignified библейском регистре и сочетаются с глаголом «вложил».
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Стандартная передача повествовательной формы; подразумеваемым субъектом остаётся Яхве.
- source_word: שׁוּב אֶל בָּלָק
  choice: Вернись к Валаку
  rationale: Императив שׁוּב обозначает возвращение, а אֶל — направление к лицу.
- source_word: וְכֹה תְדַבֵּר
  choice: и говори так
  rationale: כֹה означает «так, таким образом», а форма תְדַבֵּר в данном контексте имеет повелительную силу. Русская конструкция кратка, естественна и точно передаёт указание говорить данным образом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Характер вложенного в уста Валаама דָּבָר
  choice: слово
  alternative: весть; речь
  rationale: Выбор «слово» сохраняет число и образ оригинала, не разрешая сверх текста вопрос о точном объёме данного Валааму речения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «И вложил Яхве» передаёт повествовательную связность еврейского текста; «уста» сохраняет устойчивый образ без излишней архаизации.
