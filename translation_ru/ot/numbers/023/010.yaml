  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: ru
  text: Кто исчислит прах Иакова и сосчитает четверть Израиля?[a] Да умрёт моя душа смертью праведных[b], и да будет мой конец, как у него.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное смысловое раскрытие: «сосчитает хотя бы четверть Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «честных»; буквальный образ еврейского слова — «прямые».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте стоит единственное число: «как у него». Возможно, имеется в виду один праведный как представитель всех праведных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: Кто исчислит
  rationale: Риторический вопрос подразумевает невозможность сосчитать; «исчислит» сохраняет возвышенный поэтический строй, оставаясь понятным современному читателю.
- source_word: עֲפַר יַעֲקֹב
  choice: прах Иакова
  rationale: Сохранён образ праха, отсылающий к неисчислимому потомству; имя Иаков передано отдельно от параллельного имени Израиль.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: и сосчитает четверть Израиля
  rationale: Глагольная формулировка естественно передаёт поэтический параллелизм. «Четверть» сохраняет наиболее прямое значение רֹבַע и не устраняет неоднозначность выражения.
- source_word: תָּמֹת נַפְשִׁי
  choice: Да умрёт моя душа
  rationale: Сохранён явно названный в еврейском тексте субъект «моя душа», а желательное значение формы передано частицей «да».
- source_word: מוֹת יְשָׁרִים
  choice: смертью праведных
  rationale: В данном нравственно-религиозном контексте «праведных» естественно передаёт יְשָׁרִים — людей прямых и честных перед Богом; возможный более буквальный вариант отмечен в сноске.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: и да будет мой конец
  rationale: «Конец» кратко и естественно передаёт אַחֲרִית в параллели со смертью, не уточняя сверх текста, идёт ли речь о смерти или окончательном исходе жизни.
- source_word: כָּמֹהוּ
  choice: как у него
  rationale: Сохранено мужское единственное число суффикса; оно может указывать на типичного представителя собирательно названных праведных.
theological_decisions:
- issue: Значение יְשָׁרִים
  choice: праведных
  alternative: прямых; прямодушных
  rationale: «Праведных» в современном русском языке естественно выражает нравственно-религиозную силу слова, не вводя в стих специального конфессионального определения оправдания; лексическая альтернатива сохранена в сноске.
- issue: Толкование רֹבַע יִשְׂרָאֵל
  choice: четверть Израиля
  alternative: станы Израиля; множество Израиля; даже четверть Израиля
  rationale: Прямое значение «четверть» сохраняет необычный образ и подлинную неопределённость текста. Возможные контекстуальные толкования не внесены в основной текст.
- issue: Единственное число в כָּמֹהוּ после множественного יְשָׁרִים
  choice: как у него
  alternative: как у них
  rationale: Единственное число оригинала сохранено, хотя его соотнесение с собирательно понимаемыми «праведными» остаётся неоднозначным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Формулы «исчислит» и «да умрёт» поддерживают пророческий стиль, но синтаксис остаётся ясным. Сохранены образы «праха», «четверти» и «души», а спорные места пояснены без устранения их неоднозначности.
