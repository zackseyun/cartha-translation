lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: В сочетании עשה כאשר דבר глагол означает исполнить сказанное; «сделал так» естественно передаёт этот смысл по-русски.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: так, как сказал
  rationale: Оборот указывает, что Валак поступил в соответствии со словами Валаама; прошедшее время сохраняет последовательность действий без неестественного для русского плюсквамперфекта.
- source_word: וַיַּעַל
  choice: принесли в жертву
  rationale: Порода Hiphil глагола עלה при упоминании жертвенных животных и жертвенника обозначает вознесение жертвы; выбранный оборот ясно передаёт культовый смысл в современном русском языке.
- source_word: בָּלָק וּבִלְעָם
  choice: Валак с Валаамом
  rationale: Еврейская конструкция называет обоих участниками жертвоприношения. Русский оборот с «с» естественно согласуется с формой множественного числа «принесли».
- source_word: פָּר
  choice: быка
  rationale: В жертвенном контексте פָּר обозначает быка; возраст животного в данном стихе прямо не уточняется.
- source_word: וָאַיִל
  choice: и барана
  rationale: אַיִל — обычное обозначение барана; союз сохранён.
- source_word: בַּמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Предлог ב при жертвеннике в данном контексте естественно передаётся русским «на».
