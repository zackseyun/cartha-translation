base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: ru
  text: Ибо с вершины скал я вижу его, с холмов созерцаю его. Вот народ, который живёт обособленно и не причисляет себя к другим народам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не причисляется к другим народам»; возможно также: «и не будет причислен к другим народам». Еврейский глагол допускает как возвратное, так и страдательное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительно-связующую функцию частицы в контексте пророчества Валаама, не сводя её к узкой причинной связи.
- source_word: מֵרֹאשׁ צֻרִים
  choice: с вершины скал
  rationale: Передаёт топографический образ точки наблюдения; רֹאשׁ здесь означает вершину, а צֻרִים — скалы или скалистые высоты.
- source_word: אֶרְאֶנּוּ
  choice: я вижу его
  rationale: Сохраняет мужской род единственного числа местоименного объекта, которым еврейский текст обозначает собирательный народ Израиля.
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: с холмов созерцаю его
  rationale: «Холмы» естественно передаёт גְּבָעוֹת, а «созерцаю» различает поэтический глагол שׁור от предшествующего ראה и выражает внимательное наблюдение.
- source_word: הֶן
  choice: Вот
  rationale: Современное и естественное русское указательное слово, привлекающее внимание к следующему утверждению.
- source_word: עָם לְבָדָד יִשְׁכֹּן
  choice: народ, который живёт обособленно
  rationale: «Обособленно» передаёт не просто одиночество, а отдельность народа; настоящее время допускается несовершенным видом как характеристика, не исключая пророческой перспективы.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: и не причисляет себя к другим народам
  rationale: Передаёт возможное возвратное/среднее значение хитпаэля חשׁב. Добавление «другим» естественно по-русски выражает противопоставление Израиля окружающим народам, не отрицая того, что сам Израиль назван народом.
theological_decisions:
- issue: Возвратное или страдательное понимание יִתְחַשָּׁב
  choice: не причисляет себя к другим народам
  alternative: не причисляется к другим народам / не будет причислен к другим народам
  rationale: Порода хитпаэль допускает возвратное или среднее прочтение, но также может пониматься страдательно. Основной текст сохраняет возвратный оттенок, а сноска отмечает подлинную грамматическую неоднозначность без богословского усиления идеи исключительности.
- issue: Временное значение יִשְׁכֹּן
  choice: живёт
  alternative: будет жить / будет обитать
  rationale: Имперфект может описывать характерное состояние либо будущее. В контексте изречения естественное русское настоящее передаёт наблюдаемую и характерную обособленность, не устраняя пророческого оттенка контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Параллелизм «вижу — созерцаю» сохранён; архаичные «се» и «обитает» не использованы. Сноска поставлена после неоднозначной заключительной части стиха.
