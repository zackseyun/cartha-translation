  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: ru
  text: Вот, народ поднимается, как львица[a], и встаёт, как лев. Он не ляжет, пока не съест добычу и не выпьет кровь убитых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как лев». Еврейское לָבִיא может обозначать льва вообще; перевод «львица» сохраняет возможное отличие от следующего слова אֲרִי — «лев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Эмфатическое указательное междометие; «вот» естественно для возвышенной поэтической речи и не звучит чрезмерно архаично.
- source_word: עָם
  choice: народ
  rationale: Передаёт собирательное обозначение Израиля и лучше сохраняет поэтический образ, чем «нация».
- source_word: כְּלָבִיא
  choice: как львица
  rationale: לָבִיא может обозначать льва вообще, однако «львица» сохраняет возможное лексическое отличие от следующего אֲרִי.
- source_word: יָקוּם
  choice: поднимается
  rationale: Конкретно передаёт образ зверя, который поднимается, сохраняя поэтическое настоящее в пророческом изречении.
- source_word: וְכַאֲרִי
  choice: как лев
  rationale: אֲרִי — обычное обозначение льва; перевод сохраняет параллелизм без добавления сведений о возрасте или величине зверя.
- source_word: יִתְנַשָּׂא
  choice: встаёт
  rationale: Передаёт возвратное движение и величавую позу поднявшегося хищника; в русском избегает тяжеловесного «возносится».
- source_word: לֹא יִשְׁכַּב
  choice: он не ляжет
  rationale: Сохраняет конкретный образ зверя и естественно передаёт предстоящее, решительное действие.
- source_word: עַד יֹאכַל טֶרֶף
  choice: пока не съест добычу
  rationale: Близко соответствует глаголу «есть» и существительному «добыча», не усиливая текст словом «пожрёт».
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: и не выпьет кровь убитых
  rationale: Сохраняет резкий военный образ; חֲלָלִים в данном контексте естественно означает павших или убитых.
theological_decisions:
- issue: Образ насилия в пророчестве Валаама
  choice: Сохранить образы поедания добычи и питья крови убитых как метафору неодолимой силы и военной победы.
  alternative: Смягчить образ до общего утверждения о победе.
  rationale: Еврейский текст намеренно использует резкий образ хищника. Смягчение устранило бы присущую тексту напряжённость; при этом перевод не превращает метафору в предписание буквально пить кровь.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического пророчества. Короткие, энергичные глаголы сохраняют движение львиного образа; местоимение «он» согласовано с существительным «народ».
