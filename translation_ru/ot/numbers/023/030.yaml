lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: В сочетании с כַּאֲשֶׁר אָמַר глагол означает, что Валак поступил в соответствии со словами Валаама; конструкция «сделал так, как» естественна в современном русском языке.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Передаёт соответствие действия ранее данному указанию, не усиливая значение добавочными словами.
- source_word: אָמַר
  choice: сказал
  rationale: Русская последовательность повествования ясно показывает, что слова Валаама предшествовали действию Валака; форма «сказал» сохраняет лаконичность еврейского текста.
- source_word: וַיַּעַל
  choice: вознёс
  rationale: В жертвенном контексте עלה обозначает принесение жертвы на жертвеннике и сохраняет образ восхождения жертвы или дыма; «вознёс» передаёт этот культовый оттенок.
- source_word: פָּר
  choice: быка
  rationale: Точное и понятное современному читателю обозначение жертвенного животного.
- source_word: אַיִל
  choice: барана
  rationale: Стандартное русское соответствие для אַיִל в данном жертвенном контексте.
- source_word: בַּמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Предлог ב в данном контексте естественно обозначает место принесения жертвы — на жертвеннике.
- source_word: וַ
  choice: И
  rationale: Сохраняет простую повествовательную связь еврейского waw; причинно-следственный оттенок уже выражен исполнением сказанного и не требует усиления словом «итак».
