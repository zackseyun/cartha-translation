  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: ru
  text: 'Валаам ответил и сказал Валаку: «Разве я не говорил тебе: „Всё, что скажет Яхве, то я и сделаю“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил и сказал
  rationale: Сохраняет характерную для еврейского повествования двухглагольную формулу, оставаясь понятным по-русски.
- source_word: הֲלֹא
  choice: разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: דִּבַּרְתִּי אֵלֶיךָ לֵאמֹר
  choice: говорил тебе
  rationale: Естественно передаёт обращённую к собеседнику речь; последующая прямая цитата делает отдельную передачу לֵאמֹר избыточной в современном русском синтаксисе.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: всё, что скажет Яхве
  rationale: Сохраняет всеохватность כֹּל אֲשֶׁר; форма «скажет» естественно выражает неопределённое будущее высказывание Бога в данном контексте.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: то я и сделаю
  rationale: Корреляция «что ... то» передаёт возобновляющее местоимение אֹתוֹ, а частица «и» подчёркивает обязательность действия без добавления модального значения «должен».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским звучанием. Двухглагольная формула «ответил и сказал» сохранена ради близости к еврейскому повествованию; речь оформлена естественной для русского языка вложенной цитатой.
