base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: ru
  text: 'Тогда Валаам сказал Валаку: «Встань у своего всесожжения, а я пойду. Быть может, Яхве встретит меня, и всё, что Он мне покажет, я расскажу тебе». И он пошёл на голую возвышенность[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на открытую высоту»; редкое еврейское слово, вероятно, означает голое, не покрытое растительностью возвышенное место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Останься возле своего всесожжения
  rationale: Форма התיצב велит занять и сохранять место, а עַל в сочетании с жертвой имеет пространственный смысл «возле, у», а не буквальное «на». «Всесожжение» точно передаёт עֹלָה.
- source_word: וְאֵלְכָה
  choice: а я пойду
  rationale: Когортатив выражает намерение Валаама; союз «а» естественно передаёт сопоставление действий Валака и Валаама.
- source_word: אוּלַי
  choice: Быть может
  rationale: Сохраняет выраженную в еврейском тексте возможность и неуверенность.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Яхве встретит меня
  rationale: Nifal глагола קרה здесь обозначает встречу или явление навстречу. Формулировка передаёт ожидаемую встречу, а её негарантированный характер уже выражен словами «быть может».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: и всё, что Он мне покажет
  rationale: Сжатое еврейское выражение указывает на содержание откровения; перевод сохраняет неопределённость относительно того, что именно будет показано.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: я расскажу тебе
  rationale: 'Естественно передаёт значение Hifil глагола נגד: сообщить, рассказать.'
- source_word: שֶׁפִי
  choice: голую возвышенность
  rationale: Редкое слово, вероятно, обозначает открытую, лишённую растительности высоту; буквальная образность сохранена без излишней конкретизации.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер предполагаемой встречи Валаама с Богом
  choice: Быть может, Яхве встретит меня
  alternative: Быть может, Яхве явится мне
  rationale: Перевод не утверждает заранее, что встреча обязательно состоится, и сохраняет неопределённость אוּלַי, не объясняя богословски способ встречи.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Синтаксис реплики естественен для обычного читателя; редкий топографический термин пояснён сноской.
