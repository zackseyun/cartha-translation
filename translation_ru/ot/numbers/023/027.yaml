  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: ru
  text: 'И сказал Валак Валааму: «Прошу, пойдём: я отведу тебя в другое место. Может быть, Бог сочтёт это правильным[a], и оттуда ты проклянёшь его для меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это будет угодно Богу». Буквально: «это будет правильным в глазах Бога».'
    reason: Сохраняется лексическая широта еврейской идиомы, которая может обозначать как правильность, так и угодность в чьих-либо глазах.
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Прошу, пойдём со мной
  rationale: Императив הלך с частицей נָא выражает смягчённое приглашение или просьбу. В контексте Валак зовёт Валаама отправиться вместе с ним, поэтому эта формулировка естественна по-русски.
- source_word: אֶקָּחֲךָ
  choice: я отведу тебя
  rationale: Форма 1-го лица в данном контексте имеет волитивный оттенок и обозначает намерение Валака привести Валаама на новое место.
- source_word: מָקוֹם אַחֵר
  choice: другое место
  rationale: Прямо передаёт конкретную смену места, с которого Валаам должен произнести проклятие.
- source_word: אוּלַי
  choice: Может быть
  rationale: Сохраняет выраженную в исходном тексте надежду без утверждения определённости.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: Бог сочтёт это правильным
  rationale: Естественно передаёт идиому «быть правильным в глазах Бога», не устраняя подразумеваемый объект оценки — предложенное действие.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В ближайшем повествовательном контексте речь идёт о Боге, с которым говорит Валаам; русский перевод без артикля естественно передаёт этот референт.
- source_word: וְקַבֹּתוֹ לִי
  choice: и … ты проклянёшь его для меня
  rationale: Передаёт просьбу Валака проклясть Израиль, представленный собирательным местоимением мужского рода единственного числа.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Сохраняет пространственную связь проклятия с новым местом.
theological_decisions:
- issue: Кого обозначает הָאֱלֹהִים в речи Валака
  choice: Бог
  alternative: божество / этот бог
  rationale: Повествовательный контекст указывает на Бога, который говорит с Валаамом и определяет, что тот может произнести; перевод не вносит отсутствующую в контексте политеистическую неопределённость.
- issue: Неопределённый субъект יִישַׁר
  choice: Бог сочтёт это правильным
  alternative: это будет угодно Богу
  rationale: Местоимение «это» указывает на предполагаемую возможность проклясть Израиль с другого места, но не уточняет её сверх того, что позволяет контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Формула «Прошу, пойдём со мной» передаёт вежливую настойчивость Валака; идиома о Божьих глазах вынесена в примечание ради естественности основного текста.
