  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: ru
  text: Затем он повёл его на Поле Дозорных[a], на вершину Фасги, построил семь жертвенников и принёс в жертву на каждом жертвеннике по быку и по барану.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на поле Цофим». Еврейское выражение можно понимать либо как описание места — «поле дозорных», либо как сохранённое географическое название.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: И повёл он его
  rationale: Глагол לקח с местоименным суффиксом обозначает, что Валак отвёл Валаама в другое место; «повёл» естественно передаёт движение к названному пункту и продолжение повествования.
- source_word: שְׂדֵה צֹפִים
  choice: Поле наблюдателей
  rationale: Сочетание буквально означает «поле наблюдателей/дозорных», но может быть географическим названием; перевод смысла помещён в основной текст, а транслитерация сохранена в сноске.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: на вершину Фасги
  rationale: רֹאשׁ в географическом контексте означает «вершина», а הַפִּסְגָּה здесь передаётся как традиционное русское географическое название «Фасга».
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: построил семь жертвенников
  rationale: Прямой и естественный перевод слов בנה и שִׁבְעָה מִזְבְּחֹת.
- source_word: וַיַּעַל
  choice: принёс
  rationale: В жертвенном контексте עלה означает вознести или принести жертву; «принёс» естественно сочетается с названиями жертвенных животных.
- source_word: פָּר וָאַיִל
  choice: по быку и по барану
  rationale: 'Единственное число обоих существительных в сочетании с семью жертвенниками имеет распределительный смысл: на каждом было принесено по одному животному каждого вида.'
- source_word: בַּמִּזְבֵּחַ
  choice: на каждом жертвеннике
  rationale: Хотя в еврейском стоит единственное число, контекст семи жертвенников и параллельные стихи требуют распределительного понимания; «на каждом» делает его ясным.
