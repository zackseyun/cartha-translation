  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: ru
  text: 'Он пришёл к нему, и вот: тот стоял у своего всесожжения, а с ним были моавитские князья[a]. Валак спросил его: «Что сказал Яхве?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моавитскими сановниками».'
    reason: Еврейское שָׂרִים может обозначать как князей и правителей, так и высокопоставленных должностных лиц.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Он пришёл к нему
  rationale: Буквально передаёт обычное значение בוא («приходить»), не добавляя контекстуально возможного, но прямо не выраженного значения «вернулся».
- source_word: וְהִנּוֹ
  choice: 'и увидел: тот'
  rationale: Конструкция естественно передаёт в современном русском привлечение внимания к представшей картине; «тот» разграничивает пришедшего Валаама и ожидавшего его Валака.
- source_word: נִצָּב
  choice: стоял
  rationale: Передаёт продолжающееся положение, выраженное причастием.
- source_word: עַל עֹלָתוֹ
  choice: у своего всесожжения
  rationale: Предлог עַל здесь обозначает положение рядом с жертвой, а עֹלָה — жертву, целиком сжигаемую на жертвеннике.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: вместе с моавитскими князьями
  rationale: שָׂרִים может обозначать князей, правителей или сановников. «Князья» сохраняет придворно-политический оттенок; возможная более административная передача отмечена в сноске.
- source_word: מַה דִּבֶּר
  choice: Что сказал
  rationale: Естественная русская передача вопроса о только что произнесённом Божьем слове без излишне буквального «что изрёк».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога — тетраграмматон; форма «Яхве» сохраняет его как имя и отражает принятую научную реконструкцию произношения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Всесожжение» сохранено как точный и узнаваемый жертвенный термин; архаичные формы вроде «воззрел» и «изрёк» не используются.
