    rationale: В еврейском в этом месте стоит וְהִנּוֹ, указательная частица «и вот», а не глагол зрительного восприятия. Добавление «увидел» слегка меняет способ подачи сцены.
  - severity: low
    issue: Связь «с ним» с Валаком выражена не вполне явно
    rationale: «Вместе с моавитскими князьями» грамматически возможно, но отдельное «а с ним были...» точнее отражает второй член еврейской фразы и делает референт местоимения ясным.
