lexical_decisions:
- source_word: אֵלֶּה
  choice: Таковы
  rationale: Указательное множественного числа вводит итоговую формулу; «таковы» естественно связывает её с предшествующим перечнем.
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В контексте переписи слово обозначает крупные родственные подразделения колена, а не отдельные домашние семьи.
- source_word: נַפְתָּלִי
  choice: Неффалима
  rationale: Традиционная и узнаваемая русская форма имени, поставленная в родительном падеже по синтаксису предложения.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Предлог לְ здесь выражает распределение или классификацию; формулировка сохраняет повтор исходного текста и его переписную терминологию.
- source_word: וּפְקֻדֵיהֶם
  choice: Исчисленных среди них было
  rationale: Передаёт относящееся к переписи обозначение учтённых людей, не добавляя отсутствующее в этой фразе слово «мужчин»; «среди них» естественно выражает принадлежность к названной группе.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: сорок пять тысяч четыреста
  rationale: Прямое и нормативное русское выражение количественного числительного.
