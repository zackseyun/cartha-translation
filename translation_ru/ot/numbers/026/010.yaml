- from: И земля разверзла свои уста и поглотила их вместе с Кореем[a], когда погибло то сообщество и огонь пожрал двести пятьдесят человек; и они стали знамением[b].
  to: И земля разверзла свои уста и поглотила и их, и Корея[a], когда погибло сообщество, когда огонь пожрал двести пятьдесят человек; и они стали знаком[b].
  rationale: Убрано не имеющее соответствия в оригинале «то»; прямая координация «их и Корея» передана формой «и их, и Корея»; «знамение» заменено на более лексически нейтральное «знак». Два временных оборота сохранены, чтобы не решать спорное соотношение между «сообществом» и 250 людьми.
  reviewer_model: gpt-5.6-terra
