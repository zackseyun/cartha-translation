  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: ru
  text: И земля разверзла свои уста и поглотила и их, и Корея[a], когда погибло сообщество, когда огонь пожрал двести пятьдесят человек; и они стали знаком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поглотила их и Корея». Этот стих описывает суд именно так; подробности всего события см. в Числах 16.'
    reason: cross_reference
  - marker: b
    text: 'Или: «знамением». Еврейское слово может обозначать знак, сигнал или знамя; в данном контексте знак служит предостережением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: И земля разверзла свои уста
  rationale: «Земля» соответствует образу раскрывающейся почвы; «разверзла свои уста» сохраняет яркое олицетворение и подходит достоинству повествования.
- source_word: וַתִּבְלַע אֹתָם וְאֶת־קֹרַח
  choice: и поглотила их вместе с Кореем
  rationale: Перевод сохраняет прямое включение Корея в еврейскую конструкцию, не согласуя стих искусственно с иными деталями повествования.
- source_word: בְּמוֹת הָעֵדָה
  choice: когда погибло то сообщество
  rationale: Предлог ב с инфинитивом передан как временная конструкция. «Сообщество» обозначает данную группу, а указательное «то» помогает избежать ошибочного понимания, будто погибло всё общество Израиля.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: и огонь пожрал
  rationale: Глагол אכל буквально связан с поеданием; русское «огонь пожрал» естественно сохраняет конкретность и силу исходного образа.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: двести пятьдесят человек
  rationale: Прямая и естественная передача числительного и существительного איש в современном русском языке.
- source_word: וַיִּהְיוּ לְנֵס
  choice: и они стали знамением
  rationale: «Знамение» передаёт נֵס как заметный знак, не добавляя прямо отсутствующее в тексте определение «предостерегающее» и сохраняя неоднозначность функции.
theological_decisions:
- issue: К чему относится множественное число в выражении «они стали знамением»
  choice: Сохранено местоимение «они» без точного определения его референта.
  alternative: Уточнить, что знамением стали именно двести пятьдесят человек или всё событие суда.
  rationale: Еврейское множественное число допускает неоднозначность; перевод не сужает её без достаточного основания.
- issue: Отношение Корея к поглощённым землёй в этом стихе
  choice: 'Корей включён в объект глагола: «их вместе с Кореем».'
  alternative: Отделить участь Корея от участи поглощённых землёй ради согласования с другими стихами.
  rationale: Непосредственный синтаксис данного стиха прямо соединяет «их» и «Корея»; перевод сохраняет это напряжение и не вводит гармонизацию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Архаизирующее «разверзла уста» сохранено как понятное и выразительное; остальной синтаксис сделан естественным для современного читателя.
