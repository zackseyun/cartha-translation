  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: ru
  text: Но среди них не было ни одного мужчины из числа тех, кого Моисей и священник Аарон исчислили, — тех, кого они исчисляли из сынов Израиля в Синайской пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Но среди них
  rationale: Сочетание союза и предлога буквально допускает «и среди них», однако в связи с предыдущим стихом союз естественно передаёт противопоставление; «но среди них» ясно выражает этот смысл.
- source_word: לֹא הָיָה אִישׁ
  choice: не было ни одного человека
  rationale: Русская конструкция естественно передаёт отсутствие любого представителя прежнего поколения и сохраняет усилительный смысл единственного числа אִישׁ.
- source_word: מִפְּקוּדֵי
  choice: из тех, кого исчислили
  rationale: Форма указывает на людей, внесённых в прежнее исчисление, а не на абстрактные данные переписи.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: В еврейском тексте стоит «священник», без определения «первосвященник»; добавлять его не следует.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: исчислявшие
  rationale: Относительное предложение относится к Моисею и Аарону как к совершавшим исчисление; причастный оборот устраняет в русском двусмысленность местоимения «которые».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняется традиционное родовое обозначение народа; в данном контексте речь также идёт об исчисленных мужчинах.
- source_word: בְּמִדְבַּר סִינָי
  choice: в Синайской пустыне
  rationale: Это естественная современная русская передача конструктивного сочетания «пустыня Синая» без изменения географического смысла.
theological_decisions:
- issue: Родовая и гендерная конкретность выражений אִישׁ и בְּנֵי יִשְׂרָאֵל
  choice: Передать как «ни одного человека» и «сынов Израиля»
  alternative: «ни одного мужчины» и «израильтян»
  rationale: Контекст прежнего исчисления относится к мужчинам, но русское «ни одного человека» идиоматично передаёт отрицательную конструкцию с אִישׁ, тогда как «сынов Израиля» сохраняет родовое выражение исходного текста и его мужскую форму.
translation_notes:
  register: Современный литературный русский язык, с умеренно библейским достоинством. «Исчислили» сохраняет связь с контекстом переписи и повтор корня פקד; порядок «Моисей и священник Аарон» следует еврейскому синтаксису. Сноски не требуются, поскольку значимые нюансы переданы непосредственно в тексте.
