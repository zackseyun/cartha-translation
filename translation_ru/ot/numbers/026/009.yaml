revisions:
- from: 'Сыновья Елиава: Немуил, Дафан и Авирам. Это те самые Дафан и Авирам, избранники общины[a], которые вместе с сообществом Корея выступили против Моисея и Аарона, выступив против Яхве.'
  to: 'Сыновья Елиава: Немуил, Дафан и Авирам. Это те самые Дафан и Авирам, призванные представители общины[a], которые в сообществе Корея выступили против Моисея и Аарона, когда выступили против Яхве.'
  rationale: Перевод уточнён только там, где исходная формулировка сужала значение еврейского выражения или менее ясно передавала синтаксис. «Призванные представители общины» сохраняет вероятный статусный смысл в естественном русском языке, а сноска даёт буквальное чтение и альтернативное толкование. Обстоятельственная конструкция передана союзом «когда»; повтор глагола сохранён, как в еврейском тексте.
