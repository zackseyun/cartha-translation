source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: ru
  text: 'Сыновья Елиава: Немуил, Дафан и Авирам. Это те самые Дафан и Авирам, призванные представители общины[a], которые в сообществе Корея выступили против Моисея и Аарона, когда выступили против Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «призванные общины»; возможно также: «избранные представители общины».'
    reason: Еврейское קרואי העדה буквально называет призванных или созванных, связанных с общиной; в данном контексте оно может также обозначать признанных представителей. Сноска сохраняет эту лексическую и статусную неоднозначность.
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: Сыновья Елиава
  rationale: В родословно-переписном перечне בנים обозначает названных далее сыновей; союз естественно передан связью с контекстом, без обязательного начального «и» в отдельном русском стихе.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Это те самые Дафан и Авирам
  rationale: Формально единственное הוּא здесь выполняет указательно-идентифицирующую функцию; русское множественное согласование естественно, а «те самые» сохраняет эмфатическое узнавание ранее известных лиц.
- source_word: קרואי הָעֵדָה
  choice: избранники общины
  rationale: Пассивное причастие от קרא может обозначать призванных, созываемых или признанных представителей. «Избранники общины» естественно передаёт статус известных представителей, а более буквальная возможность сохранена в сноске.
- source_word: הִצּוּ ... בְּהַצֹּתָם
  choice: выступили против ... выступив против
  rationale: Обе формы происходят от נצה и выражают враждебное противостояние. Повтор глагола сохраняет лексическую связь оригинала; деепричастие естественно передаёт обстоятельственное ב с инфинитивом.
- source_word: בַּעֲדַת קֹרַח
  choice: вместе с сообществом Корея
  rationale: Фраза указывает на связь Дафана и Авирама с группой Корея. «Сообщество» не смешивает эту группу со всей общиной Израиля и не добавляет эмоционально окрашенного «сборище».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение קרואי העדה
  choice: избранники общины
  alternative: призванные общиной; созываемые представители общины
  rationale: Оборот допускает как статусное, так и более буквальное понимание. Основной текст использует ясную статусную формулировку, а сноска сохраняет лексическую неоднозначность.
- issue: Характер противостояния
  choice: выступили против
  alternative: вступили в распрю с
  rationale: Предлог עַל подчёркивает направленность против Моисея, Аарона и Яхве. Формулировка не ослабляет богословскую оценку события как противостояния Богу, но и не вводит отсутствующий здесь отдельный термин «восстали».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена даны в привычной русской библейской форме. Синтаксис упрощён без устранения эмфазы «те самые» и намеренного повтора глагольного корня.
