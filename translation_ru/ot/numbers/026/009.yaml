review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: названы сыновья Елиава, затем особо идентифицируются Дафан и Авирам; они противостояли Моисею и Аарону в сообществе Корея и противились Яхве. Однако «избранники общины» слишком уверенно интерпретирует קרואי העדה как избрание. Оборот буквально обозначает «призванных/созванных [из, от] общины» и в контексте может иметь статусный оттенок; это следует сохранить в основном тексте, а не только в сноске. «Вместе с сообществом Корея» допустимо, но «в сообществе Корея» точнее передаёт בַּעֲדַת — принадлежность или нахождение в кругу этой группы.'
  naturalness: Текст в целом современный и литературный. «Призванные представители общины» естественно по-русски и, при поясняющей сноске, не создаёт впечатления, будто речь обязательно идёт об избрании. «Когда они выступили против Яхве» яснее, чем деепричастный оборот «выступив против Яхве», который может читаться как простое сопутствующее действие, а не как временное обстоятельство.
  terminology: «Яхве» корректно передаёт יהוה. Имена «Елиав», «Немуил», «Дафан», «Авирам» и «Корей» приемлемы как ориентированные на еврейский текст русские формы. «Община» последовательно передаёт עֵדָה. Повтор «выступили против» отражает повторение корня נצה без богословского или конфессионального истолкования.
  issues:
  - severity: medium
    issue: «избранники общины» в основном тексте
    rationale: Это статусное, более узкое толкование קרואי העדה. Причастие קרואי прежде всего означает «призванные/созванные»; контекст допускает признанных представителей, но не требует понятия избрания.
  - severity: low
    issue: Деепричастие «выступив против Яхве»
    rationale: בְּהַצֹּתָם имеет временно-обстоятельственную функцию («когда они выступили/противились»). Личная форма с «когда» передаёт её прозрачнее.
  - severity: low
    issue: «вместе с сообществом Корея»
    rationale: Формулировка возможна, но может подчёркивать лишь совместность действий. «В сообществе Корея» ближе к בַּעֲדַת קֹרַח и сохраняет указание на группу, с которой они были связаны.
