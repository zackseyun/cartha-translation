  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: ru
  text: Более многочисленному увеличь его наследственный удел, а менее многочисленному уменьши его наследственный удел; каждому будет дан его наследственный удел соответственно числу исчисленных у него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждому — по его исчисленным». Краткое еврейское выражение связывает размер удела с числом людей, учтённых при переписи; «каждому» здесь, по контексту, относится к соответствующей родовой или племенной группе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: более многочисленному
  rationale: Субстантивированное прилагательное в контексте переписи обозначает более многочисленную родовую или племенную группу; сравнительная форма естественно передаёт противопоставление с לַמְעַט.
- source_word: תַּרְבֶּה
  choice: увеличь
  rationale: Побудительная порода глагола רבה означает «сделать большим, увеличить»; здесь речь о размере земельного удела.
- source_word: נַחֲלָתוֹ
  choice: его наследственный удел
  rationale: נַחֲלָה обозначает наследуемое владение, особенно землю, отведённую по праву; сочетание «наследственный удел» ясно передаёт оба смысловых компонента.
- source_word: וְלַמְעַט
  choice: а менее многочисленному
  rationale: Прилагательное употреблено субстантивированно и противопоставлено לָרַב; союз передан как «а», поскольку по-русски здесь естественно выражено сопоставление.
- source_word: תַּמְעִיט
  choice: уменьши
  rationale: Побудительная порода מעט означает «сделать меньшим, уменьшить» и формально соответствует параллельному «увеличь».
- source_word: אִישׁ
  choice: каждому
  rationale: Мужской род единственного числа употреблён распределительно. Русское «каждому» сохраняет распределительный смысл, не вынуждая понимать речь об отдельном мужчине, тогда как контекст касается исчисленных групп.
- source_word: לְפִי פְקֻדָיו
  choice: соответственно числу исчисленных у него
  rationale: לְפִי выражает соответствие или соразмерность, а פְקֻדָיו — тех, кто был учтён при переписи и относится к данной группе. Формулировка сохраняет сжатость и соотнесённость с переписью.
- source_word: יֻתַּן
  choice: должен быть дан
  rationale: Страдательная форма נתן буквально означает «будет дан»; модальная конструкция по-русски естественно передаёт предписание в данном контексте.
