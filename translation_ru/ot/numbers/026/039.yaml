  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: ru
  text: От Шефуфама[a] — род шуфамитов; от Хуфама — род хуфамитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В масоретском тексте личное имя имеет форму «Шефуфам», тогда как название рода далее в этом же стихе — «шуфамиты». В параллельных перечнях и некоторых переводческих традициях встречаются и другие написания.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: От Шефуфама
  rationale: 'Предлог לְ в формуле переписи обозначает происхождение рода и естественно передаётся по-русски предлогом «от». Имя передано по огласовке масоретского текста: שְׁפוּפָם — «Шефуфам».'
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В племенной переписи מִשְׁפָּחָה обозначает родовую группу внутри колена. «Род» точнее и естественнее в данном контексте, чем бытовое «семья».
- source_word: הַשּׁוּפָמִי
  choice: шефуфамитов
  rationale: Форма с суффиксом принадлежности обозначает совокупность потомков Шефуфама; русское множественное наименование рода сохраняет этот коллективный смысл.
- source_word: לְחוּפָם
  choice: от Хуфама
  rationale: Предлог לְ, как и в первой половине стиха, выражает происхождение рода; личное имя חוּפָם транслитерировано как «Хуфам».
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: Повтор ключевого термина сохранён для точной передачи параллельной структуры переписной формулы.
- source_word: הַחוּפָמִי
  choice: хуфамитов
  rationale: Этнонимическая форма обозначает род, происходящий от Хуфама; множественное «хуфамитов» ясно передаёт собирательное значение.
