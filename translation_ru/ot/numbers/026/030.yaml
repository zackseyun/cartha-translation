source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: ru
  text: 'Вот сыновья Галаада[a]: от Иезера — род иезеритян; от Хелека — род хелекитян.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «сыновья Галаада» может означать потомков Галаада по мужской линии или происходящие от него роды, а не только его непосредственных сыновей.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит перечень; «вот» естественно передаёт его в русском генеалогическом контексте без добавления отсутствующей в еврейском формы времени.
- source_word: בְּנֵי גִלְעָד
  choice: сыновья Галаада
  rationale: Сохранена формальная генеалогическая формула; примечание поясняет, что здесь речь может идти не только о непосредственных сыновьях.
- source_word: אִיעֶזֶר
  choice: Иезер
  rationale: Имя передано традиционной русской библейской формой, соответствующей еврейскому אִיעֶזֶר.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В контексте переписи слово обозначает родовое подразделение племени; «род» точнее и естественнее современного значения слова «семья».
- source_word: הָאִיעֶזְרִי
  choice: иезеритян
  rationale: Форма обозначает членов рода, происходящего от Иезера; русское образование на «-итяне» ясно передаёт родовую принадлежность.
- source_word: לְחֵלֶק
  choice: от Хелека
  rationale: Предлог לְ в повторяющейся переписной формуле вводит родоначальника; по-русски происхождение рода естественно выражается предлогом «от».
- source_word: הַחֶלְקִי
  choice: хелекитян
  rationale: Родовое наименование от имени Хелек передано параллельно форме «иезеритян».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой переписного перечня. Тире помогает ясно отделить имя родоначальника от названия рода; архаические формы вроде «семейство Иезерово» не используются.
