    rationale: «Обратились ... и сказали» передаёт один глагол речи и инфинитив לֵאמֹר двумя самостоятельными русскими глаголами. Более компактное «обратились ... со словами» точнее передаёт функцию формулы и естественно связывает стих со следующим.
  revised_text: 'Моисей и священник Елеазар обратились к ним на равнинах Моава, у Иордана близ Иерихона[a], со словами:'
