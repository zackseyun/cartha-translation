base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: ru
  text: 'Моисей и священник Елеазар обратились к ним на равнинах Моава, у Иордана близ Иерихона[a], со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Иордана, напротив Иерихона».'
    reason: Сочетание עַל־יַרְדֵּן יְרֵחוֹ допускает также понимание географического отношения как «напротив Иерихона»; примечание сохраняет эту лексико-синтаксическую возможность.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: обратились
  rationale: Глагол דבר с обозначением адресатов вводит обращённую к ним речь; «обратились» естественно по-русски и позволяет избежать тяжеловесного сочетания «говорили им, говоря».
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: Моисей и священник Елеазар
  rationale: Сохранены составное подлежащее и звание Елеазара; более полный титул «первосвященник» в еврейском тексте отсутствует.
- source_word: אֹתָם
  choice: к ним
  rationale: Местоименный показатель объекта здесь обозначает адресатов речи и естественно передаётся при глаголе «обратились» сочетанием «к ним».
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עַרְבוֹת обозначает равнинную степную местность; «равнины» — ясный и устойчивый русский географический эквивалент.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: у Иордана, напротив Иерихона
  rationale: Формула указывает местоположение у Иордана относительно Иерихона. «Напротив Иерихона» ясно передаёт географическое отношение и согласуется с употреблением этой формулы в контексте равнин Моава.
- source_word: לֵאמֹר
  choice: 'и сказали:'
  rationale: Инфинитив вводит содержание последующей речи. Русская конструкция с двоеточием естественно связывает стих со словами следующего стиха, не воспроизводя неидиоматичное «говоря».
