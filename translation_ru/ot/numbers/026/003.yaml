  to: 'Моисей и священник Елеазар обратились к ним на равнинах Моава, у Иордана близ Иерихона[a], со словами:'
  rationale: Основной текст выбирает нейтральную и естественную русскую передачу местоположения, не утверждая спорный оттенок как единственно возможный. Альтернативное «напротив Иерихона» вынесено в примечание по образцу английской аудиторской записи. «Со словами:» сохраняет вводную функцию לֵאמֹר без неестественного буквального «говоря» и без избыточного удвоения глаголов.
