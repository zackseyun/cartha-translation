    rationale: עַל־יַרְדֵּן יְרֵחוֹ допускает передачу «у/близ Иордана у Иерихона» и «у Иордана, напротив Иерихона». Английский audit trail избирает первый вариант и выносит второй в примечание; русскому тексту следует также сохранить альтернативу.
  - severity: low
