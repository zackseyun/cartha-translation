  rationale: Сохранена традиционная русская форма имени родоначальника колена.
- source_word: הַלִּבְנִי
  choice: ливниев
  rationale: Форма обозначает группу потомков Ливни; русское родовое наименование передаёт значение еврейского нисбета без тяжеловесной конструкции.
- source_word: הַחֶבְרֹנִי
  choice: хевронеев
  rationale: Передано как название рода потомков Хеврона, параллельно другим названиям в перечне.
- source_word: הַמַּחְלִי
  choice: махлиев
  rationale: Передано как название группы потомков Махли.
- source_word: הַמּוּשִׁי
  choice: мушиев
  rationale: Передано как название группы потомков Муши.
- source_word: הַקָּרְחִי
  choice: кореев
  rationale: Передано как название потомков Корея с сохранением традиционной русской формы имени.
- source_word: וּקְהָת
  choice: Кааф
  rationale: Союз учтён синтаксически переходом к следующему предложению; имя дано в принятой русской библейской форме.
- source_word: הוֹלִד
  choice: стал отцом
  rationale: Hiphil глагола ילד в родословной формуле означает «произвёл на свет, стал отцом». Выбран современный и естественный русский эквивалент без архаичного «родил» в отношении мужчины.
- source_word: אֶת עַמְרָם
  choice: Амрама
  rationale: Показатель прямого дополнения отдельно не переводится; имя передано в традиционной русской форме.
