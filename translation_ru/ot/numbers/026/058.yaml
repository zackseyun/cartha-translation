lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: В безглагольной перечислительной формуле естественно вводит указание на далее названные роды, не навязывая исходному тексту прошедшего или настоящего времени.
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: роды / род
  rationale: В переписном и племенном контексте слово обозначает родственную группу внутри колена. «Род» точнее современного узкого значения слова «семья» и естественно звучит в русском генеалогическом перечне.
- source_word: לֵוִי
