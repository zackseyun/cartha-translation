  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: ru
  text: Но Надав и Авиуд умерли, когда принесли пред Яхве недозволенный огонь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чуждый огонь», «чужой огонь». Еврейское выражение обозначает огонь, не дозволенный для приношения пред Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умерли
  rationale: Хотя сказуемое в еврейском тексте стоит в единственном числе перед составным подлежащим, по-русски при двух именах естественно множественное число.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Надав и Авиуд
  rationale: Использованы устоявшиеся русские библейские формы личных имён.
- source_word: בְּהַקְרִיבָם
  choice: когда принесли
  rationale: Предлог ב при инфинитиве со слитным местоименным суффиксом выражает здесь время; глагол «принесли» естественен в контексте культового приношения.
- source_word: אֵשׁ זָרָה
  choice: недозволенный огонь
  rationale: Прилагательное זָרָה буквально может означать «чужой, посторонний», а в данном культовом контексте указывает на огонь, не дозволенный для такого приношения. Формулировка сохраняет смысл и остаётся понятной современному читателю.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי передаёт пространственно-культовое «пред, перед лицом», а тетраграмматон воспроизводится личным именем «Яхве».
- source_word: וַ
  choice: Но
  rationale: Союз вводит контрастное замечание об исключительной судьбе двух названных лиц на фоне родословного перечисления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; личное имя сохраняется, а не заменяется титулом.
- issue: Характер огня אֵשׁ זָרָה
  choice: недозволенный огонь
  alternative: чуждый огонь; чужой огонь
  rationale: Перевод сообщает культовую непозволительность, не уточняя сверх текста, в чём именно состояло нарушение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Пред Яхве» сохраняет культовый оттенок выражения; «недозволенный» понятно передаёт контекстуальное значение без конфессионального уточнения.
