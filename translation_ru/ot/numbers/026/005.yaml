base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: ru
  text: 'Рувим, первенец Израиля: сыновья[a] Рувима: от Ханоха — род ханохитов; от Паллу — род паллуитов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «сыновья» означает также потомков по мужской линии, составляющих перечисленные роды.
    reason: Уточнение контекстуального объёма древнееврейского בְּנֵי в переписи.
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: первенец Израиля
  rationale: Сочетание прямо называет Рувима первенцем Израиля; форма с родительным падежом естественна в современном русском и сохраняет значение статуса в семье.
- source_word: בְּנֵי רְאוּבֵן
  choice: сыновья Рувима
  rationale: Буквальное значение בְּנֵי — «сыновья». В контексте переписи выражение охватывает потомков и основателей родов, но в основном тексте сохранена родственная формулировка оригинала.
- source_word: חֲנוֹךְ
  choice: Ханох
  rationale: Имя передано прямой транслитерацией с древнееврейского, без опоры на традиционную форму через иной язык.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В племенной переписи слово обозначает родственную группу внутри колена. Русское «род» здесь точнее и естественнее, чем бытовое «семья».
- source_word: הַחֲנֹכִי
  choice: ханохиты
  rationale: Адъективно-этнонимическая форма обозначает потомков Ханоха как отдельный род; множественное название «ханохиты» кратко передаёт это значение.
- source_word: לְפַלּוּא
  choice: от Паллу
  rationale: Префикс לְ в перечне вводит родоначальника следующего рода. «От Паллу» естественно выражает происхождение, не придавая предлогу направительного значения.
- source_word: הַפַּלֻּאִי
  choice: паллуиты
  rationale: Форма обозначает род, происходящий от Паллу; русское родовое наименование «паллуиты» сохраняет структуру оригинала.
