- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное אֵלֶּה вводит итог переписи; русское «вот» естественно представляет итоговое число.
- source_word: פְּקוּדֵי
  choice: число исчисленных
  rationale: Существительное от פקד в данном контексте обозначает людей, зарегистрированных при переписи; добавление слова «число» позволяет естественно связать выражение с последующим итогом, не превращая его лишь в отвлечённую статистику.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет родственное выражение еврейского текста и его мужскую форму, уместную в контексте данной переписи.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: шестьсот одна тысяча семьсот тридцать
  rationale: Передаёт составное числительное как сумму 600 000, 1 000, 700 и 30 в нормативной современной русской форме.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Буквальное родственное обозначение сохраняет образ и грамматический род оригинала, не сводя его без необходимости к этнониму.
- issue: Смысл פְּקוּדֵי в контексте переписи
  choice: число исчисленных
  alternative: сосчитанные; итог переписи
  rationale: Формулировка одновременно указывает на зарегистрированных людей и естественно вводит численный итог, сохраняя переписной контекст.
