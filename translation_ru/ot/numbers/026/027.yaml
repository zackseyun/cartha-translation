  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: ru
  text: 'Вот роды потомков Завулона по числу исчисленных среди них: шестьдесят тысяч пятьсот.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит итоговую формулу; русское «вот» естественно и сохраняет дейктическую функцию еврейского выражения.
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В племенном и переписном контексте речь идёт о крупных родственных подразделениях колена; «роды» точнее, чем бытовое «семьи».
- source_word: הַזְּבוּלֹנִי
  choice: потомков Завулона
  rationale: Субстантивированное обозначение принадлежности к Завулону употреблено собирательно; такой перевод ясен по-русски и не создаёт неестественного этнонима.
- source_word: לִפְקֻדֵיהֶם
  choice: по числу исчисленных среди них
  rationale: Форма от פקד относится к переписи и обозначает учтённых членов этих родов; «среди них» передаёт местоименный суффикс и связь общего числа с данной группой.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: шестьдесят тысяч пятьсот
  rationale: Число передано словами в естественной русской форме, соответствующей торжественно-деловому стилю переписи.
