  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: ru
  text: 'Сыновья Берии: от Хевера — род хеверитов; от Малхиила — род малхиилитов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי בְרִיעָה
  choice: Сыновья Берии
  rationale: Формула переписи вводит ветви, происходящие от сыновей Берии. «Сыновья» сохраняет явную генеалогическую структуру оригинала, а начальный ל передан естественной для русского перечня конструкцией.
- source_word: לְחֶבֶר
  choice: от Хевера
  rationale: В повторяющейся формуле переписи ל указывает на родоначальника соответствующей ветви; «от» ясно выражает происхождение.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В данном контексте слово обозначает родовую группу внутри колена. «Род» — понятный современному русскому читателю и уместный в генеалогическом перечне эквивалент.
- source_word: הַחֶבְרִי
  choice: хеверитов
  rationale: Патронимическая форма обозначает членов рода, происходящего от Хевера; русское образование на «-иты» кратко сохраняет эту связь.
- source_word: לְמַלְכִּיאֵל
  choice: от Малкиила
  rationale: Предлог «от» передаёт происхождение рода от названного предка; имя транслитерировано непосредственно с еврейской формы.
- source_word: הַמַּלְכִּיאֵלִי
  choice: малкиилитов
  rationale: Патронимическое наименование передано русским образованием от имени Малкиил, без замены его описательной формулировкой.
