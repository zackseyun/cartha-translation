base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: ru
  text: 'Вот исчисленные[a] из колена Левия по их родам: от Гирсона — род гирсонитов, от Каафа — род каафитов, от Мерари — род мераритов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учтённые при переписи». Еврейское слово обозначает людей, внесённых в перепись, а не просто действие подсчёта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: исчисленные
  rationale: Форма от פקד обозначает людей, учтённых при переписи, а не отвлечённое действие исчисления. Субстантивированное «исчисленные» сохраняет конкретный смысл оригинала.
- source_word: הַלֵּוִי
  choice: из колена Левия
  rationale: Единственное число с артиклем здесь служит обозначением племени через его родоначальника. Добавление «из колена» естественно для русского языка и устраняет ошибочное впечатление, будто речь идёт об одном человеке.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте переписи מִשְׁפָּחָה означает родовую группу внутри колена, а не современную отдельную семью.
- source_word: לְגֵרְשׁוֹן
  choice: от Гирсона
  rationale: Предлог לְ в данной родословной формуле указывает на принадлежность по происхождению; русское «от» ясно выражает происхождение рода.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: род гирсонитов
  rationale: Прилагательное происхождения обозначает группу потомков Гирсона; множественное «гирсониты» естественно передаёт коллективное значение.
- source_word: לִקְהָת
  choice: от Каафа
  rationale: Та же формула происхождения, что и при имени Гирсона; использована традиционная русская передача имени קְהָת.
- source_word: מִשְׁפַּחַת הַקְּהָתִי
  choice: род каафитов
  rationale: Обозначает родовую группу потомков Каафа; форма «каафиты» соответствует принятой русской библейской ономастике.
- source_word: לִמְרָרִי
  choice: от Мерари
  rationale: Предлог перед именем выражает происхождение и параллелен двум предыдущим конструкциям.
- source_word: מִשְׁפַּחַת הַמְּרָרִי
  choice: род мераритов
  rationale: Передаёт коллективное обозначение рода потомков Мерари.
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: В данном перечислении «Вот» естественно вводит новую группу учтённых лиц и сохраняет связь с контекстом без тяжеловесного буквального «И вот».
