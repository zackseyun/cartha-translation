base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: ru
  text: 'Ибо Яхве сказал им: «Они непременно умрут в пустыне»[a]. И никого из них не осталось, кроме Халева, сына Иефоннии, и Иисуса, сына Навина.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умирая, умрут» — еврейская усилительная конструкция, означающая, что они непременно умрут.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не осталось из них человека»; то есть не осталось ни одного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение результата переписи, связанного с предшествующим приговором; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אָמַר ... לָהֶם
  choice: сказал о них
  rationale: Хотя לָהֶם формально допускает «им», контекст позволяет понять оборот как высказывание об этих людях; русское «сказал о них» соответствует смыслу приговора.
- source_word: מוֹת יָמֻתוּ
  choice: они непременно умрут
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола выражает усиление; наречие «непременно» передаёт его естественно по-русски.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и контекстуально точное русское соответствие מִדְבָּר в повествовании о странствии Израиля.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: И никого из них не осталось
  rationale: Естественная русская передача дистрибутивного אִישׁ в отрицательной конструкции; сохраняет смысл, что не осталось ни одного человека из названной группы.
- source_word: כִּי אִם
  choice: кроме
  rationale: Оборот вводит единственные исключения из предыдущего отрицания.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Халев, сын Иефоннии
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён с ясной передачей патронима.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: и Иисус, сын Навина
  rationale: Употреблена узнаваемая русская библейская форма имени Иисуса Навина; конструкция с «сын» непосредственно передаёт патроним.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объём и категоричность божественного приговора
  choice: «Они непременно умрут в пустыне»
  alternative: «Умирая, умрут в пустыне»
  rationale: Русская формулировка сохраняет эмфатическую силу еврейской конструкции, не превращая её буквальную грамматическую форму в неестественный оборот.
