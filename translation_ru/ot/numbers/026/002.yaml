  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: ru
  text: «Проведите перепись всей общины сынов Израиля[a] — от двадцати лет и старше, по их отцовским домам, — всех сынов Израиля, выступающих в войско[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимите голову всей общины». Это еврейское выражение означает «пересчитайте» или «проведите перепись».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всех, годных к военной службе». Буквально: «всех, выходящих в войско».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Проведите перепись
  rationale: Буквально «поднимите голову»; в данном сочетании это устойчивое выражение со значением подсчёта или переписи. Смысл передан естественным современным русским оборотом.
- source_word: כָּל־עֲדַת
  choice: всего общества
  rationale: עֵדָה обозначает общину Израиля как единое собранное сообщество. «Общество» сохраняет традиционно-библейский оттенок и остаётся понятным современному читателю.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено буквальное родовое выражение; в контексте военной переписи его мужская форма существенна.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная русская передача формулы возрастного порога.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Формула указывает на учёт по патрилинейным родовым объединениям; буквальная передача сохраняет социальную структуру исходного текста.
- source_word: כָּל־יֹצֵא צָבָא
  choice: всех ... кто выходит на войну
  rationale: Передаёт причастную конструкцию без внесения прямо не выраженных понятий «способен» или «годен»; в контексте речь идёт о выступающих для военной службы.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохранена простая локативно-общественная формулировка исходного текста.
theological_decisions:
- issue: Родовая и гендерная форма בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Буквальная мужская родовая формула уместна в контексте переписи тех, кто выходит на войну; нейтрализация могла бы затушевать эту связь.
- issue: Военная пригодность в כָּל־יֹצֵא צָבָא
  choice: кто выходит на войну
  alternative: кто годен к военной службе; кто способен выйти на войну
  rationale: Исходный текст буквально говорит о «выходящем» в войско или на войну. Перевод не делает скрытое предположение о пригодности явным и сохраняет некоторую широту выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Общество» и «отцовские дома» сохраняют терминологию родовой организации Израиля; пунктуация ясно отделяет возрастной и родовой критерии от охвата военной переписи.
