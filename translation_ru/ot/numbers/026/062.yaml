revisions:
- from: Исчисленных из них было двадцать три тысячи — все лица мужского пола от одного месяца и старше. Они не были исчислены вместе с сынами Израиля, потому что им не был дан удел среди сынов Израиля.[a]
  to: 'Всего исчисленных среди них было двадцать три тысячи — все мужского пола, от одного месяца и старше, — потому что они не были исчислены среди сынов Израиля: ибо им не был дан удел среди сынов Израиля.[a]'
  rationale: Исправлены стилистически тяжёлая начальная конструкция, неоправданное различение двух одинаковых еврейских выражений и связанная с ним сноска. Сохранены численность, возрастной порог, мужской пол, переписная терминология, повтор выражения «сыны Израиля» и пассивное указание на отсутствие земельного удела.
