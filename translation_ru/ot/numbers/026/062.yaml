  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: ru
  text: 'Всего исчисленных среди них было двадцать три тысячи — все мужского пола, от одного месяца и старше, — потому что они не были исчислены среди сынов Израиля: ибо им не был дан удел среди сынов Израиля.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или в обоих случаях: «среди израильтян».'
    reason: Лексическая альтернатива для обоих случаев выражения «сыны Израиля».
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: исчисленных из них
  rationale: Передаёт существительное от פקד в контексте переписи и сохраняет связь с последующим глаголом того же корня.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: двадцать три тысячи
  rationale: Естественная русская передача еврейского количественного числительного.
- source_word: כָּל זָכָר
  choice: все лица мужского пола
  rationale: Точно охватывает как взрослых, так и младенцев, о которых говорит следующий оборот; слово «мужчины» здесь было бы возрастно неточным.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: от одного месяца и старше
  rationale: Естественно и точно выражает нижнюю возрастную границу.
- source_word: הָתְפָּקְדוּ
  choice: были исчислены
  rationale: Сохраняет переписной смысл корня פקד и лексическую связь с началом стиха.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: вместе с сынами Израиля / среди сынов Израиля
  rationale: Предлог בְּתוֹךְ допускает контекстуальные русские соответствия; в первом случае речь о включении в общую перепись, во втором — о получении удела внутри Израиля. Родственное выражение «сыны Израиля» сохранено.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: им не был дан удел
  rationale: Сохраняет пассивную конструкцию; «удел» естественно обозначает наследственное земельное владение в данном контексте.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранена семейно-заветная формулировка оригинала без сведения её к более общему этнониму; современный вариант отмечен в сноске.
- issue: Значение נַחֲלָה
  choice: удел
  alternative: наследие
  rationale: В контексте распределения земли «удел» яснее передаёт конкретное земельное владение, не исключая идеи наследования.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Исчислены» удерживает переписную терминологию и повтор корня; «лица мужского пола» выбрано ради точности при упоминании младенцев. Маркер сноски поставлен после последнего употребления выражения, к которому относится примечание.
