source:
  edition: WLC
  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: ru
  text: Только по жребию должна быть разделена земля; они получат надел по именам племён своих отцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: 'Частица здесь ограничивает способ раздела земли: он должен совершаться исключительно по жребию.'
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Предлог בְּ имеет инструментальное значение, а גּוֹרָל обозначает жребий, посредством которого определялось распределение.
- source_word: יֵחָלֵק
  choice: должна быть разделена
  rationale: Нифаль передаёт пассивное значение; модальная конструкция естественно выражает предписание в данном контексте.
- source_word: אֶת הָאָרֶץ
  choice: земля
  rationale: Речь идёт о земле, предназначенной Израилю в наследие; дополнительное уточнение в самом стихе не требуется.
- source_word: לִשְׁמוֹת
  choice: по именам
  rationale: Предлог לְ указывает на основание или ориентир распределения; формулировка сохраняет необычную, но понятную образность оригинала.
- source_word: מַטּוֹת
  choice: племён
  rationale: Хотя слово может означать «посохи», здесь оно обозначает племенные объединения.
- source_word: אֲבֹתָם
  choice: своих отцов
  rationale: Буквально «их отцов»; в контексте наследования имеются в виду отцовские родовые линии внутри племён.
- source_word: יִנְחָלוּ
  choice: они получат надел
  rationale: Глагол נחל означает получить или владеть чем-либо как наследственным уделом; «получат надел» ясно передаёт это значение по-русски.
theological_decisions:
- issue: Отцовская родовая принадлежность в אֲבֹתָם
  choice: своих отцов
  alternative: своих предков
  rationale: Еврейский текст употребляет мужской родственный термин и в данном контексте указывает на отцовские племенные линии; более общее «предков» ослабило бы эту особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён пассив оригинала и выражение «по именам племён», не устраняющее присущую тексту семитскую формулировку. Местоимение «своих» употреблено ради естественного русского согласования с подлежащим «они».
