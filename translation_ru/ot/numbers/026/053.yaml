  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: ru
  text: Этим должна быть разделена земля в наследие — по числу имён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по числу людей»; буквально: «по числу имён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: между ними
  rationale: Предлог לְ с указательным местоимением обозначает тех, кому предназначен раздел; в русском контексте распределения земли естественно «между ними», при этом сохраняется отсылка к перечисленным выше.
- source_word: תֵּחָלֵק
  choice: пусть будет разделена
  rationale: Нифаль, имперфект глагола חלק выражает пассивное действие и в контексте повеления передаёт предписание о разделе.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте наделов Израиля стандартное значение — обещанная земля как территория.
- source_word: בְּנַחֲלָה
  choice: в наследие
  rationale: נַחֲלָה обозначает наследственный земельный удел; выражение «в наследие» естественно и сохраняет юридический и заветный оттенок.
- source_word: בְּמִסְפַּר
  choice: по числу
  rationale: Предлог בְּ указывает здесь на меру или основание распределения; «по числу» кратко и точно передаёт этот смысл.
- source_word: שֵׁמוֹת
  choice: имён
  rationale: Буквальное «имён» сохраняет образ исходного текста; в контексте переписи речь идёт о людях, представленных в списке.
