  rationale: Обычное отрицание при глаголе.
- source_word: מֵתוּ
  choice: умерли
  rationale: Форма глагола מות означает «умереть»; прошедшее время множественного числа точно и естественно передаёт еврейский перфект в повествовательном контексте.
