base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: ru
  text: 'Сыновья Иуды[a], по их родам, были таковы: от Шелы — род шеланитов; от Переца[b] — род перецитов; от Зераха — род зерахитов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Иуды»; в контексте этой переписи выражение обозначает потомков Иуды по мужской линии, распределённых по родам.'
    reason: lexical_alternative
  - marker: b
    text: В старой русской библейской традиции имя Перец также передаётся как Фарес.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: В формуле переписи глагол היה вводит перечень и естественно передаётся простой связкой «были».
- source_word: בְנֵי יְהוּדָה
  choice: сыновья Иуды
  rationale: Сохраняет буквальную мужскую генеалогическую формулировку еврейского текста; в контексте переписи речь идёт также о потомках по мужской линии.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает подразделение племени, то есть род; предлог לְ имеет классифицирующее значение «по».
- source_word: לְשֵׁלָה
  choice: от Шелы
  rationale: Повторяющийся לְ вводит родоначальника соответствующего рода; по-русски происхождение естественно выражается предлогом «от».
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: род шеланитов
  rationale: Передаёт и существительное «род», и образованное от имени родоначальника обозначение членов рода.
- source_word: לְפֶרֶץ
  choice: от Переца
  rationale: «Перец» непосредственно передаёт еврейское פֶרֶץ и не заменяет его формой, пришедшей через греко-славянскую традицию.
- source_word: מִשְׁפַּחַת הַפַּרְצִי
  choice: род перецитов
  rationale: Русское родовое обозначение сохраняет явную связь с именем Перец и параллелизм перечня.
- source_word: לְזֶרַח
  choice: от Зераха
  rationale: «Зерах» непосредственно передаёт еврейское זֶרַח, включая конечный согласный.
- source_word: מִשְׁפַּחַת הַזַּרְחִי
  choice: род зерахитов
  rationale: Сохраняет производность названия рода от имени Зерах и единообразие формулы.
