source:
  edition: WLC
  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: ru
  text: Вот исчисленные Моисеем и священником Елеазаром, которые исчислили сынов Израиля[a] на равнинах Моава, у Иордана напротив Иерихона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян» или «потомков Израиля». Буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «у Иордана, близ Иерихона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: исчисленные
  rationale: Причастное значение формы от פקד в контексте переписи относится к людям, внесённым в счёт; «исчисленные» сохраняет личный референт и связь с последующим глаголом того же корня.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: В еврейском тексте стоит обычное обозначение «священник»; титул «первосвященник» здесь не выражен.
- source_word: פָּקְדוּ
  choice: исчислили
  rationale: Повтор глагола «исчислили» передаёт тот же корень פקד, что и в «исчисленные», и соответствует контексту переписи.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквальная родословно-заветная формула сохраняет грамматически мужской образ исходного текста; более обобщённый вариант указан в примечании.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: Географическое сочетание естественно передаётся как «равнины Моава»; предлог «на» нормативен по-русски при обозначении равнинной местности.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: у Иордана напротив Иерихона
  rationale: Передаёт расположение моавских равнин у Иордана по другую сторону от Иерихона; сжатая еврейская конструкция допускает и менее определённое указание на район Иерихона.
theological_decisions:
- issue: Родословно-заветное выражение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; потомков Израиля
  rationale: Сохранена мужская родословная формулировка оригинала без нейтрализации; примечание поясняет возможный общий смысл.
- issue: Должностное наименование Елеазара
  choice: священник
  alternative: первосвященник
  rationale: Перевод не добавляет более специальный титул, которого нет в данной еврейской формулировке.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Исчисленные / исчислили» сохраняет корневой повтор оригинала и звучит уместно в контексте переписи; порядок «священником Елеазаром» естественен для русского языка.
