  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: ru
  text: Имя жены Амрама — Иохаведа[a], дочь Левия, которая была рождена Левию в Египте[b]. Она родила Амраму Аарона, Моисея и их сестру Мариам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя Йохевед традиционно передаётся по-русски как Иохаведа. Буквально: «дочь Левия»; в генеалогическом контексте «дочь» иногда может обозначать женщину-потомка.'
    reason: transliteration
  - marker: b
    text: 'Буквально: «которую она родила Левию в Египте»; мать Иохаведы в еврейском тексте не названа.'
    reason: lexical_alternative
