review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Иохаведа названа дочерью Левия, матерью Аарона, Моисея и Мариам. Однако формулировка «она родилась у Левия» в современном русском может звучать разговорно и пространственно («у него дома»), а не как указание на рождение Левию. Более точна и ясна книжная пассивная конструкция «которая была рождена Левию в Египте», при этом она не называет подразумеваемую в еврейском тексте мать.'
  naturalness: «Имя жены Амрама — Иохаведа» и «родила Амраму» естественны для современного литературного библейского регистра. Перестройка первого предложения с придаточным определительным делает связь определений яснее и устраняет неудачное «родилась у Левия».
  terminology: Традиционные русские библейские формы «Иохаведа», «Аарон», «Моисей», «Мариам», «Амрам» и «Левий» уместны. «Дочь Левия» сохраняет буквальную генеалогическую формулировку и не подменяет её словом «потомок».
