base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: ru
  text: 'Сыновья Вениамина по их родам: от Белы — род белаитов; от Ашбела — род ашбелитов; от Ахирама[a] — род ахирамитов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В масоретском тексте здесь стоит «Ахирам»; в некоторых текстовых традициях и переводах встречается форма «Ахиам». Основной текст следует еврейскому чтению.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Сыновья Вениамина
  rationale: Сохраняет буквальную генеалогическую формулу «сыновья Вениамина»; в контексте переписи она охватывает его потомков.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовое подразделение племени. «Род» точнее для переписного и генеалогического контекста, чем современное «семья».
- source_word: לְבֶלַע
  choice: от Белы
  rationale: Предлог לְ в перечне вводит родоначальника; русское «от» естественно выражает происхождение рода.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: род белаитов
  rationale: Форма הַבַּלְעִי — родовое наименование, образованное от имени Бела; передано параллельно другим названиям родов.
- source_word: לְאַשְׁבֵּל
  choice: от Ашбела
  rationale: Передаёт родоначальника, вводимого предлогом לְ, в соответствии со структурой перечня.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: род ашбелитов
  rationale: Сохраняет различие между личным именем родоначальника и производным названием его рода.
- source_word: לַאֲחִירָם
  choice: от Ахирама
  rationale: Следует чтению масоретского текста אֲחִירָם и передаёт предлог לְ как указание на происхождение.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: род ахирамитов
  rationale: Передаёт производное родовое наименование и сохраняет синтаксический параллелизм стиха.
