  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: ru
  text: от Шемиды — род Шемидаев; от Хефера — род Хеферитов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: от Шемиды
  rationale: В краткой переписной формуле предлог «от» естественно передаёт подразумеваемое происхождение рода от названного предка; союз не воспроизводится отдельно, поскольку стих продолжает перечень.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В племенных и переписных списках слово обозначает родовую группу внутри колена; русское «род» здесь точнее и естественнее, чем бытовое «семья».
- source_word: הַ/שְּׁמִידָעִי
  choice: Шемидаев
  rationale: Форма передаёт название потомков Шемиды; конструкция «род Шемидаев» ясна современному русскому читателю и сохраняет родословный смысл.
- source_word: וְ/חֵפֶר
  choice: от Хефера
  rationale: Повторение «от» раскрывает эллиптическую переписную формулу и передаёт происхождение следующего рода; союз внутри перечисления естественно выражен точкой с запятой.
- source_word: הַֽ/חֶפְרִי
  choice: Хеферитов
  rationale: Этнонимическая форма означает потомков Хефера; «род Хеферитов» естественно передаёт соответствующую родовую группу.
