lexical_decisions:
- source_word: כָּל
  choice: всех
  rationale: Передаёт совокупность всех перечисляемых родовых групп; форма согласована с родительным оборотом «семейств шухамитян».
- source_word: מִשְׁפְּחֹת
  choice: семейств
  rationale: В контексте переписи слово обозначает родовые подразделения племени; «семейства» сохраняет традиционную и понятную генеалогическую лексику, а вариант «роды» отмечен в сноске.
- source_word: הַשּׁוּחָמִי
  choice: шухамитян
  rationale: Этноним указывает на потомков Шухама; русская форма во множественном числе естественно обозначает всю родовую группу.
- source_word: לִפְקֻדֵיהֶם
  choice: по числу исчисленных среди них
  rationale: Передаёт переписное значение корня פקד и показывает, что итог относится к людям, учтённым при исчислении.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: шестьдесят четыре тысячи четыреста
  rationale: Точное число передано в обычном порядке современного русского счёта.
