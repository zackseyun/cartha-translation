  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: ru
  text: 'Сыновья Белы — Ард и Нааман: от Арда — род ардитов, от Наамана — род наамитов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нааманитов». Еврейское родовое название образовано от имени Нааман; вариант «нааманиты» передаёт его более краткую форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: Форма היה с союзом продолжает генеалогическое перечисление; русская конструкция «сыновьями… были» естественно передаёт это без дополнительного смыслового оттенка.
- source_word: בְנֵי
  choice: сыновьями
  rationale: В данном родословном перечне слово прямо обозначает названных сыновей Белы; буквальное родственное обозначение уместнее более широкого «потомки».
- source_word: בֶלַע
  choice: Белы
  rationale: Личное имя בֶּלַע передано традиционной русской библейской формой «Бела» и поставлено в родительный падеж.
- source_word: אַרְדְּ
  choice: Ард
  rationale: Личное имя транслитерировано как «Ард».
- source_word: וְנַעֲמָן
  choice: и Нааман
  rationale: Личное имя נַעֲמָן передано как «Нааман»; соединительный союз сохранён.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В контексте переписи מִשְׁפָּחָה обозначает родовую группу внутри колена. Русское «род» точно и естественно для такого перечня.
- source_word: הָאַרְדִּי
  choice: ардитов
  rationale: Еврейская патронимическая форма указывает на род, происходящий от Арда; во множественном числе «ардиты» это ясно передаёт по-русски.
- source_word: לְנַעֲמָן
  choice: от Наамана
  rationale: Предлог לְ в данной генеалогической формуле обозначает принадлежность или происхождение; «от Наамана» естественно выражает родовую линию.
- source_word: הַנַּעֲמִי
  choice: наамитов
  rationale: Патронимическая форма образована от имени Нааман, но в еврейском имеет сокращённый вид; «наамиты» воспроизводит эту форму, а более прозрачный вариант отмечен в сноске.
