lexical_decisions:
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Передаёт распределение потомков Вениамина по родовым объединениям и сохраняет формулу переписи в книге Чисел.
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных среди них
  rationale: Страдательное причастие от פקד в контексте переписи обозначает учтённых при подсчёте; «среди них» естественно передаёт принадлежность исчисленных к названным родам.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: сорок пять тысяч шестьсот
  rationale: Нормальный русский порядок числительного точно передаёт общее число 45 600.
