- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В контексте переписи это родовые подразделения колена, а не отдельные семьи; «роды» естественно передаёт данный общественный уклад по-русски.
- source_word: הָרֻאוּבֵנִי
  choice: потомков Рувима
  rationale: Гентилий обозначает членов колена, происходящего от Рувима; этот вариант понятен современному читателю и не создаёт неестественного русского этнонима.
- source_word: פְקֻדֵיהֶם
  choice: исчисленных среди них
  rationale: Форма от פקד в контексте переписи обозначает учтённых, внесённых в число; формулировка сохраняет пассивный смысл и связь с данной группой.
- source_word: וַיִּהְיוּ
  choice: было
  rationale: Простая связочная конструкция естественно вводит итоговое число по-русски.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: сорок три тысячи семьсот тридцать
  rationale: Число передано словами и в том же нисходящем порядке разрядов, что и в еврейском тексте.
