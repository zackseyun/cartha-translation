  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: ru
  text: 'Сыновья Неффалима по их родам: от Иахцеила — род Иахцеилов; от Гуни — род Гуниев.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Сохраняет буквальную генеалогическую формулу «сыновья»; в данном контексте она также охватывает потомков, входящих в племя.
- source_word: נַפְתָּלִי
  choice: Неффалима
  rationale: Устоявшаяся русская библейская форма имени в родительном падеже после слова «сыновья».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Передаёт распределительное значение לְ и обозначает внутренние родовые подразделения племени; «род» естественен для русской библейской генеалогической лексики.
- source_word: לְיַחְצְאֵל
  choice: от Иахцеила
  rationale: Предлог «от» ясно выражает происхождение рода от названного предка и естественно звучит в русском перечне.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: род Иахцеилов
  rationale: Еврейское родовое обозначение передано русской коллективной формой, называющей потомков Иахцеила.
- source_word: לְגוּנִי
  choice: от Гуни
  rationale: Как и в первой части стиха, «от» передаёт происхождение соответствующего рода от предка.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: род Гуниев
  rationale: Коллективная русская форма передаёт родовую группу, происходящую от Гуни.
