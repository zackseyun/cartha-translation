  yaml_path: translation/ot/numbers/026/052.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма wayyiqtol продолжает повествование; в современной русской библейской прозе естественно передаётся союзом «и». Глагол «сказал» идиоматично вводит прямую речь, сохраняя смысл דבר в данной формуле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного еврейским предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В формуле введения прямой речи значение «говоря» естественно и без смысловой потери выражается в современном русском двоеточием; следующий стих содержит саму речь.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя YHWH. Форма «Яхве» прямо передаёт имя и не заменяет его титулом; примечание сообщает традиционный вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Буквальное причастное «говоря» не сохранено, поскольку перед началом прямой речи оно звучит по-русски тяжеловесно; его функцию выполняет двоеточие.
