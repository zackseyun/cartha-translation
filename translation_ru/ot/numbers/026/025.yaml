  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: ru
  text: Вот роды Иссахара; внесённых в перепись[a] — шестьдесят четыре тысячи триста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их числу» или «по их переписи». Еврейское выражение может обозначать как внесённых в перепись представителей этих родов, так и их переписное число.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественно вводит итоговое указание в русском именном предложении, не требуя искусственной связки.
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В контексте племенной переписи обозначает расширенные родственные группы внутри колена; «роды» точнее обычного «семьи».
- source_word: יִשָּׂשכָר
  choice: Иссахара
  rationale: Традиционная русская форма библейского имени, поставленная в родительном падеже по синтаксису фразы.
- source_word: לִפְקֻדֵיהֶם
  choice: по числу исчисленных у них
  rationale: Передаёт связь с переписью и сохраняет отнесённость учтённых лиц к названным родам, не сводя выражение только к абстрактному итогу.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: шестьдесят четыре тысячи триста
  rationale: Число 64 300 передано в нормативном для современного русского языка порядке.
