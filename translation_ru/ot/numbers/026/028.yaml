  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: ru
  text: 'Сыновья Иосифа по их родам: Манассия и Ефрем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן. В родословном и переписном контексте «сыновья» прямо и естественно сохраняет язык происхождения.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная русская форма библейского имени.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри племени, а предлог לְ выражает распределение или классификацию. «По их родам» естественно для переписного контекста и не сужает значение до современной семьи.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Традиционная русская форма библейского имени и названия племенной ветви.
- source_word: וְאֶפְרָיִם
  choice: и Ефрем
  rationale: Союз וְ передан как «и»; имя дано в традиционной русской библейской форме.
