base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: ru
  text: 'Вот сыновья Ефрема по их родам: от Шутелаха — род Шутелахитов; от Бехера — род Бехеритов; от Тахана — род Таханитов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Вот сыновья Ефрема
  rationale: Указательное אֵלֶּה естественно передано вводным «вот», а בְנֵי сохранено как «сыновья» в соответствии с формальным родословным языком.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте переписи מִשְׁפָּחָה обозначает родовое подразделение племени; «род» — естественный и традиционно понятный русский эквивалент.
- source_word: לְשׁוּתֶלַח
  choice: от Шутелаха
  rationale: Предлог לְ в этой родословной формуле указывает на соотнесение рода с названным предком; русское «от» ясно выражает происхождение.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: род Шутелахитов
  rationale: Относительное наименование обозначает потомков Шутелаха как родовую группу; множественная форма на «-иты» естественно передаёт такой этноним в русском библейском регистре.
- source_word: לְבֶכֶר ... מִשְׁפַּחַת הַבַּכְרִי
  choice: от Бехера — род Бехеритов
  rationale: Сохранена параллельная родословная формула; написание имени следует еврейской форме בֶכֶר, а название рода прозрачно образовано от имени предка.
- source_word: לְתַחַן ... מִשְׁפַּחַת הַתַּחֲנִי
  choice: от Тахана — род Таханитов
  rationale: Повторяющаяся еврейская конструкция передана единообразно, с ясным обозначением происхождения рода от Тахана.
