lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит итоговое сообщение о только что перечисленных родах; «вот» естественно передаёт эту функцию по-русски.
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В контексте переписи речь идёт о родовых подразделениях колена, а не о семьях в современном бытовом смысле.
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Использована традиционная русская библейская форма имени в родительном падеже.
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных в них
  rationale: Форма от פקד в переписной формуле обозначает учтённых при переписи; оборот сохраняет связь с перечисленными родами и не добавляет отсутствующее здесь существительное «мужчин».
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: пятьдесят две тысячи семьсот
  rationale: Естественная русская передача точного числа 52 700.
