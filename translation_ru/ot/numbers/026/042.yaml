base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: ru
  text: 'Вот сыны Дана[a] по их родам: от Шухама — род шухамитов. Вот роды Дана по их родам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Дана»; в родословной формуле переписи слово «сыны» может обозначать потомков или членов племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательная формула естественно вводит перечень переписи и сохраняет дейктическую силу еврейского выражения без добавления отсутствующей в оригинале связки.
- source_word: בְנֵי דָן
  choice: сыны Дана
  rationale: Буквальное и уместное для родословно-переписного стиля обозначение; в данном контексте может охватывать потомков и соплеменников Дана.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В переписи מִשְׁפָּחָה обозначает родовое подразделение племени; «по их родам» передаёт распределительное значение לְ и сохраняет повтор исходного текста.
- source_word: לְשׁוּחָם
  choice: от Шухама
  rationale: В родословной формуле предлог לְ указывает на родоначальника соответствующего рода; по-русски это естественно выражается предлогом «от».
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: род шухамитов
  rationale: Еврейское отымённое обозначение имеет собирательный смысл и называет род, происходящий от Шухама.
- source_word: מִשְׁפְּחֹת דָּן
  choice: роды Дана
  rationale: Сохраняется терминологическое соответствие слову מִשְׁפָּחָה и краткая итоговая формула оригинала.
