  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: ru
  text: У Аарона родились Надав, Авиуд, Елеазар и Ифамар.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «У Аарона родился Надав и Авиуд, Елеазар и Ифамар»; в родословной формуле перед перечнем нескольких сыновей употреблён глагол в единственном числе.'
    reason: лексико-грамматическая особенность
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: родились
  rationale: Нифаль глагола ילד передаёт пассивное значение рождения. Хотя в еврейском тексте глагол стоит в единственном числе как часть родословной формулы, в современном русском согласование с перечислением четырёх сынов требует множественного числа.
- source_word: לְאַהֲרֹן
  choice: у Аарона
  rationale: Предлог לְ обозначает родителя, которому родились сыновья. Русская конструкция «у Аарона родились» естественно и достаточно близко сохраняет еврейскую родословную формулу, не превращая её в активное «Аарон породил».
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: отдельно не переводится
  rationale: Повторяющаяся частица אֶת грамматически отмечает имена в перечислении и не имеет отдельного соответствия в русском переводе.
- source_word: נָדָב
  choice: Надав
  rationale: Транслитерация имени, близкая к еврейской форме и уже употребительная в русской библейской традиции.
- source_word: אֲבִיהוּא
  choice: Авиуд
  rationale: Устоявшаяся русская библейская форма имени; она выбрана ради узнаваемости, хотя точная транслитерация была бы ближе к «Авиху».
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אִיתָמָר
  choice: Ифамар
  rationale: Устоявшаяся русская библейская форма имени.
