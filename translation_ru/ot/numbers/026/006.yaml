translation:
  language: ru
  text: от Хецрона[a] — род хецронитов; от Карми — род кармитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Хецрону — род хецронитов; Карми — род кармитов». Еврейский предлог здесь указывает на родословную принадлежность или происхождение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: от Хецрона
  rationale: В переписной родословной формуле предлог לְ обозначает принадлежность к линии предка или происхождение от него; «от Хецрона» естественно передаёт этот смысл по-русски.
- source_word: מִשְׁפַּחַת
  choice: семейство
  rationale: В данном контексте слово обозначает крупную родственную группу внутри колена, а не отдельную домашнюю семью; «семейство» сохраняет родословный и переписной характер термина.
- source_word: הַֽ/חֶצְרוֹנִי
  choice: хецронитов
  rationale: Форма принадлежности называет совокупность потомков Хецрона; русский родительный множественного числа после «семейство» передаёт коллективный смысл.
- source_word: לְ/כַרְמִי
  choice: от Харми
  rationale: Как и в первой половине стиха, לְ выражает родословную принадлежность или происхождение; перевод сохраняет параллелизм.
- source_word: הַ/כַּרְמִי
  choice: хармитов
  rationale: Форма принадлежности обозначает потомков Харми; коллективное наименование естественно сочетается со словом «семейство».
