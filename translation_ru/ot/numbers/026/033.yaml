base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: ru
  text: 'У Цлофхада, сына Хефера, не было сыновей[a], а были только дочери; дочерей Цлофхада звали: Махла, Ноа[b], Хогла, Милка и Тирца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не было у него сыновей, кроме дочерей».'
    reason: lexical_alternative
  - marker: b
    text: Ноа — здесь имя одной из дочерей Цлофхада, а не Ной из повествования о потопе.
    reason: cultural_note
lexical_decisions:
- source_word: וּצְלָפְחָד בֶּן חֵפֶר
  choice: У Целофхада, сына Хефера
  rationale: Именная конструкция с בֶּן передана естественным русским приложением; начальный ו связывает стих с контекстом и не требует отдельного слова в русском предложении.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: не было сыновей
  rationale: Буквальная конструкция существования с לֹו естественно передаётся по-русски оборотом «у … не было»; «сыновей» сохраняет явное противопоставление дочерям.
- source_word: כִּי אִם בָּנוֹת
  choice: а только дочери
  rationale: 'Оборот כִּי אִם выражает исключение и контраст: сыновей не было, были лишь дочери.'
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Дочерей Целофхада звали
  rationale: Единственное שֵׁם при множественном зависимом слове имеет собирательный смысл; русский глагольный оборот ясно и естественно вводит перечень имён.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Махла, Ноа, Хогла, Милка и Тирца
  rationale: Личные имена переданы русской транслитерацией, ориентированной на еврейские формы; נֹעָה передано как «Ноа», чтобы сохранить отличие женского имени от имени Ной.
