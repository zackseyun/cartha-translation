  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: ru
  text: 'Сыновья Иуды: Ир и Онан[a]. Но Ир и Онан умерли в земле Ханаанской.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Ир и Онан умерли в земле Ханаанской». Еврейский союз может быть передан простым «и»; в основном тексте употреблено «но», чтобы выразить подразумеваемое контекстом противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן в родословном перечне; «сыновья» прямо и естественно передаёт мужскую родственную линию.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Устоявшаяся русская форма личного имени.
- source_word: עֵר
  choice: Ир
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: וְ/אוֹנָן
  choice: и Онан
  rationale: Союз וְ соединяет имена в перечне; «Онан» — устоявшаяся русская форма имени.
- source_word: וַ/יָּמָת
  choice: Но ... умерли
  rationale: Форма от מוּת обозначает совершившуюся в прошлом смерть; русское «но» естественно выражает контраст между включением в перечень сыновей и последующим сообщением об их смерти.
- source_word: בְּ/אֶרֶץ
  choice: в земле
  rationale: Сочетание предлога בְּ с אֶרֶץ в географическом выражении прямо передаётся как «в земле».
- source_word: כְּנָעַן
  choice: Ханаанской
  rationale: Устоявшаяся русская передача географического названия в согласованном сочетании «земля Ханаанская».
