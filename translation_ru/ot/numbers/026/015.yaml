  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: ru
  text: 'Сыновья Гада по их родам: от Цефона[a] — род цефонитян; от Хагги — род хаггитян; от Шуни — род шунитян.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых переводческих традициях здесь передают имя как «Цифон» (ср. Быт. 46:16), однако масоретский текст этого стиха читает «Цефон» (צפון); это чтение сохранено в основном тексте.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Сыновья Гада
  rationale: Сохранена формальная родословная формула «сыновья»; в данном контексте она обозначает потомков и остаётся естественной для русского библейского повествования.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте переписи מִשְׁפָּחָה обозначает родовое подразделение племени; «по их родам» точно и естественно передаёт распределительное значение.
- source_word: לִצְפוֹן
  choice: от Цефона
  rationale: Предлог לְ в повторяющейся родословной формуле указывает на происхождение или принадлежность к линии предка; русское «от» ясно выражает этот смысл.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: род цефонитян
  rationale: Форма הַצְּפוֹנִי является названием родовой группы, происходящей от Цефона; русское множественное «цефонитяне» естественно обозначает членов рода.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: от Хагги — род хаггитян
  rationale: Сохранены параллельная родословная конструкция и различие между именем предка и названием происходящего от него рода.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: от Шуни — род шунитян
  rationale: Сохранены синтаксический параллелизм еврейского перечня и прозрачная русская форма названия рода.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством переписного перечня. Повторяющаяся структура оригинала сохранена, но оформлена естественными для русского языка двоеточием и тире. Термин «род» выбран вместо более бытового «семья», поскольку речь идёт о внутриплеменных родовых объединениях.
