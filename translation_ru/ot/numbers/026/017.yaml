  text: לַ/אֲר֕וֹד מִשְׁפַּ֖חַת הָ/אֲרוֹדִ֑י לְ/אַ֨רְאֵלִ֔י מִשְׁפַּ֖חַת הָ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: ru
  text: От Арода — род ародитов; от Арели — род арелитов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Ароду — род ародитов; Арели — род арелитов». Еврейский предлог ל перед каждым именем родоначальника входит в формулу переписи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: от Арода
  rationale: В формуле переписи предлог ל при имени родоначальника указывает на происхождение рода; по-русски это естественно передаётся предлогом «от».
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В племенном и переписном контексте слово обозначает родственную группу внутри колена; «род» кратко и естественно передаёт эту единицу устройства Израиля.
- source_word: הָאֲרוֹדִי
  choice: ародитов
  rationale: Форма с определённым артиклем — название группы потомков Арода; русский родительный множественного числа согласуется с конструкцией «род ародитов».
- source_word: לְאַרְאֵלִי
  choice: от Арели
  rationale: Как и в первой части стиха, ל вводит имя родоначальника и в данной формуле обозначает происхождение.
- source_word: הָאַרְאֵלִי
  choice: арелитов
  rationale: Этноним обозначает группу потомков Арели и естественно передаётся формой «арелитов» после слова «род».
theological_decisions: []
