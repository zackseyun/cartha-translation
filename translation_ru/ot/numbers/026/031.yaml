  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: ru
  text: от Асриэла[a] — род асриэлитов; от Сихема — род сихемитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В традиционных русских переводах: «Асриил». Форма «Асриэл» ближе передаёт древнееврейское имя אַשְׂרִיאֵל.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Асриэл
  rationale: 'Имя передано непосредственно с древнееврейского: буква שׂ здесь обозначает звук «с», а окончание אֵל — «эл».'
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В переписном и родословном контексте слово обозначает родовую группу внутри колена; «род» естественно и точно передаёт эту единицу в современном русском языке.
- source_word: הָאַשְׂרִיאֵלִי
  choice: асриэлитов
  rationale: Форма обозначает совокупность потомков Асриэла; русский этноним во множественном числе передаёт коллективное значение.
- source_word: שֶׁכֶם
  choice: Сихем
  rationale: Использована укоренившаяся русская библейская форма имени; здесь это имя предка, а не название местности.
- source_word: הַשִּׁכְמִי
  choice: сихемитов
  rationale: Форма обозначает род потомков Сихема и передана коллективным названием группы.
- source_word: וְ
  choice: от
  rationale: Вместо буквального «и» восстановлена подразумеваемая эллиптическая связь с родоначальником, как того требует формула переписного списка; это делает русский текст ясным без изменения смысла.
