  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: ru
  text: 'Сыновья Переца: от Хецрона — род хецронитов; от Хамула — род хамулитов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 'Сыновья Фареса:'
  rationale: В данной переписной родословной формуле глагол היה служит связкой и вводит перечень. В русском естественнее передать его именной конструкцией с двоеточием, без отдельного «были».
- source_word: בְנֵי
  choice: сыновья
  rationale: Здесь названы непосредственные мужские потомки Фареса, ставшие родоначальниками родов; «сыновья» точно сохраняет форму и смысл еврейского текста.
- source_word: פֶרֶץ
  choice: Фарес
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая современному читателю соотнести этого человека с другими местами Писания.
- source_word: לְחֶצְרֹן
  choice: от Есрома
  rationale: Префикс ל в переписной формуле обозначает отнесение рода к его предку; русское «от Есрома» ясно выражает происхождение.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В контексте переписи слово обозначает родственную группу внутри колена. «Род» — естественный и точный русский эквивалент.
- source_word: הַחֶצְרֹנִי
  choice: Есромов
  rationale: Еврейское образование обозначает группу потомков Есрома. Притяжательное наименование «род Есромов» естественно передаёт этот смысл по-русски.
- source_word: לְחָמוּל
  choice: от Хамула
  rationale: Как и в первой части стиха, ל указывает на происхождение названного рода от его предка.
- source_word: הֶחָמוּלִי
  choice: Хамулов
  rationale: Форма обозначает потомков Хамула; сочетание «род Хамулов» передаёт групповое родовое наименование без тяжеловесной транслитерации.
