source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею и Елеазару, сыну священника Аарона[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказал… говоря».'
    reason: В переводе вводная формула לֵאמֹר естественно передана двоеточием.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Основное значение глагола — «сказал»; союз וַ передаёт продолжение повествования словом «И».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: אֶל מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: Моисею и Елеазару
  rationale: Русский дательный падеж естественно обозначает адресатов речи; повтор предлога перед вторым именем воспроизводить не требуется.
- source_word: בֶּן אַהֲרֹן הַכֹּהֵן
  choice: сыну священника Аарона
  rationale: Форма приложения в еврейском тексте связывает определение «священник» с Аароном; русская конструкция ясно и естественно сохраняет это отношение.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит последующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие; буквальное «сказал… говоря» звучит тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не подменяя его конфессионально привычным эквивалентом.
- issue: К кому относится определение הַכֹּהֵן («священник»)
  choice: 'к Аарону: «сыну священника Аарона»'
  alternative: 'к Елеазару: «Елеазару, сыну Аарона, священнику»'
  rationale: Порядок слов и обычное понимание конструкции בֶּן־אַהֲרֹן הַכֹּהֵן поддерживают приложение к имени Аарона. При этом Елеазар также был священником, но данная фраза грамматически именует священником Аарона.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранено начальное «И» как связь с предыдущим рассказом; архаичная конструкция «сказал… говоря» вынесена в примечание.
