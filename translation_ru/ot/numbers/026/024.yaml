base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: ru
  text: от Иашува — род Иашувитов; от Шимрона — род Шимронитов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: от Иашува
  rationale: В формуле переписи предлог לְ перед личным именем указывает на родоначальника; русское «от Иашува» естественно передаёт происхождение рода.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В племенной переписи слово обозначает родственную группу внутри колена; «род» точно и кратко передаёт этот уровень устройства.
- source_word: הַ/יָּשׁוּבִי
  choice: Иашувитов
  rationale: Форма нисбы обозначает потомков Иашува; в сочетании «род Иашувитов» это естественно передаётся русским родовым наименованием.
- source_word: לְ/שִׁמְרֹן
  choice: от Шимрона
  rationale: Как и в первой части стиха, לְ вводит имя родоначальника; перевод сохраняет параллельную структуру перечня.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: Повтор одинаково передан во второй формуле ради точности и ритмического параллелизма.
- source_word: הַ/שִּׁמְרֹנִי
  choice: Шимронитов
  rationale: Форма нисбы обозначает группу потомков Шимрона; «род Шимронитов» ясно выражает это значение.
