base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: ru
  text: 'Сыновья Симеона[a] по их родам[b]: от Немуила — род Немуилитов; от Иамина — род Иаминитов; от Иахина[c] — род Иахинитов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно передать и как «потомки Симеона», однако буквально сказано «сыновья Симеона»; это генеалогическая формула.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по их семействам». В контексте переписи еврейское слово обозначает родовые объединения внутри колена.'
    reason: lexical_alternative
  - marker: c
    text: Имя Иахин при более близкой к еврейскому произношению передаче может писаться «Яхин».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Сыновья Симеона
  rationale: Сохранена буквальная генеалогическая формула «сыновья», указывающая здесь на потомство по мужской линии; более широкое «потомки» возможно, но менее точно передаёт форму еврейского текста.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте переписи מִשְׁפָּחָה обозначает родовую группу внутри колена. «Род» естественно звучит в русской библейской генеалогии и точнее, чем бытовое «семья».
- source_word: לִנְמוּאֵל
  choice: от Немуила
  rationale: Предлог לְ в этой перечислительной формуле вводит родоначальника; русское «от» ясно выражает происхождение рода.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: род Немуилов
  rationale: Еврейское отымённое обозначение относится ко всей группе потомков Немуила. Русская конструкция «род Немуилов» кратко и естественно воспроизводит формулу переписи.
- source_word: לְיָמִין ... מִשְׁפַּחַת הַיָּמִינִי
  choice: от Иамина — род Иаминов
  rationale: Сохранены параллельная структура перечня и традиционная русская передача имени יָמִין.
- source_word: לְיָכִין ... מִשְׁפַּחַת הַיָּכִינִי
  choice: от Иахина — род Иахинов
  rationale: Сохранены параллельная структура и узнаваемая традиционная русская форма имени; произносительная транслитерация «Яхин» отмечена в сноске.
