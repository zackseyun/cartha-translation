  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: ru
  text: от Иецера — род Иецеритов; от Шиллема — род Шиллемитов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: от Иецера
  rationale: В повторяющейся формуле переписи предлог לְ вводит родоначальника; русское «от» естественно выражает происхождение рода. Имя передано транслитерацией.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В контексте племенной переписи слово обозначает родственную группу внутри колена. «Род» точнее и естественнее современного «семейство», которое может восприниматься как отдельная семья.
- source_word: הַ/יִּצְרִי
  choice: род Иецеритов
  rationale: Форма принадлежности обозначает потомков Иецера. Название «Иецериты» сохраняет явную связь с именем родоначальника и соответствует русскому способу образования названий родов.
- source_word: לְ/שִׁלֵּם
  choice: от Шиллема
  rationale: Как и в первой части стиха, предлог לְ в формуле переписи передан через «от», указывающее на происхождение; имя транслитерировано.
- source_word: הַ/שִּׁלֵּמִי
  choice: род Шиллемитов
  rationale: Форма принадлежности называет потомков Шиллема; «Шиллемиты» прозрачно связывает название рода с именем родоначальника.
