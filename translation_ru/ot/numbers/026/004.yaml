base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: ru
  text: От двадцати лет и старше[a], как Яхве[b] повелел Моисею и израильтянам, вышедшим из земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стих продолжает предыдущее распоряжение о переписи и не содержит самостоятельного сказуемого.
    reason: contextual_ellipsis
  - marker: b
    text: Яхве — личное имя Бога; традиционно передаётся словом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: От двадцати лет и старше
  rationale: Еврейская пороговая формула буквально говорит о возрасте «от двадцатилетнего и выше». Выбранный вариант естественен для современного русского языка и точно передаёт возрастную границу.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: כַּאֲשֶׁר вводит соответствие ранее данному повелению, а צִוָּה обозначает властное распоряжение; «как повелел» сохраняет и связь, и силу выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: и израильтянам
  rationale: Буквально «и сынам Израиля»; здесь это общепринятое обозначение народа, поэтому современное «израильтянам» ясно и естественно.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: вышедшим из земли Египетской
  rationale: Причастный оборот определяет поколение исхода. «Вышедшим» сохраняет форму и историческую отсылку исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: К кому относится определение הַיֹּצְאִים «вышедшие»
  choice: к израильтянам
  alternative: к Моисею и израильтянам вместе
  rationale: Согласование множественного числа допускает широкую грамматическую связь, однако ближайшим и смысловым определяемым является коллективное обозначение израильтян — поколения, вышедшего из Египта. Формулировка не добавляет отдельного уточнения о Моисее.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской окраской. Сохранена синтаксическая неполнота еврейского стиха и его связь с предыдущим контекстом; подразумеваемый глагол не внесён в основной текст.
