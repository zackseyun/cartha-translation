base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: ru
  text: 'Сыновья Манассии: от Махира — род махиритян; Махир родил Галаада; от Галаада — род галаадитян.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Сыновья Манассии
  rationale: Сохраняет формальный генеалогический оборот оригинала; в контексте переписи «сыновья» может охватывать и более широкое потомство.
- source_word: לְמָכִיר
  choice: от Махира
  rationale: Предлог לְ в данной переписной формуле обозначает родовую ветвь, происходящую от названного предка; по-русски это естественно передаётся словом «от».
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: род Махиритян
  rationale: מִשְׁפָּחָה здесь обозначает родовое подразделение племени, а форма הַמָּכִירִי — его членов; «род» соответствует русской библейской и генеалогической речи.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Махир родил Галаада
  rationale: Прямо передаёт каузативный генеалогический глагол הוֹלִיד и сохраняет сжатый стиль перечня без архаичного «породил».
- source_word: לְגִלְעָד
  choice: от Галаада
  rationale: Повторяет функцию לְ как указания на линию происхождения и сохраняет параллелизм с «от Махира».
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: род Галаадитян
  rationale: Передаёт родовое подразделение и коллективный смысл этнонимической формы естественным русским множественным названием.
