lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Сыновья Иссахара
  rationale: Формально передаёт родословно-переписную формулу; в данном контексте речь идёт также о потомках названных сыновей.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовое подразделение колена; «род» естественен для русского библейского переписного контекста.
- source_word: תּוֹלָע
  choice: Тола
  rationale: Личное имя транслитерировано; нарицательное значение слова в этом контексте неприменимо.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: род Толаитов
  rationale: Форма принадлежности обозначает потомков Толы как отдельный род; русское множественное родовое наименование сохраняет структуру перечня.
- source_word: לְפֻוָה
  choice: от Пувы
  rationale: Префикс לְ вводит родоначальника очередного рода; форма «от Пувы» ясно выражает происхождение. Написание פֻוָה передано как «Пува».
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: род Пунитов
  rationale: Прилагательная форма принадлежности обозначает род потомков Пувы; «Пуниты» передаёт еврейское родовое наименование.
