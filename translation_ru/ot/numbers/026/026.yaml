base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: ru
  text: 'Сыновья Завулона[a], по их родам: от Середа — род сардитов; от Елона — род елони́тов; от Иахлеила — род иахлеилитов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть потомки Завулона; в этой переписи выражение «сыновья Завулона» обозначает его племенных потомков.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Сыновья Завулона
  rationale: Сохранена буквальная генеалогическая формула «сыновья Завулона»; в контексте переписи она обозначает его племенных потомков.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовое подразделение внутри колена, а предлог לְ имеет распределительное значение.
- source_word: לְסֶרֶד
  choice: от Середа
  rationale: Предлог לְ в формуле перечня указывает на родоначальника; русское «от» ясно передаёт происхождение рода.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: род Середов
  rationale: Форма הַסַּרְדִּי — обозначение потомков Середа; конструкция «род Середов» естественно передаёт собирательный смысл.
- source_word: לְאֵלֹן ... מִשְׁפַּחַת הָאֵלֹנִי
  choice: от Елона — род Елонов
  rationale: 'Сохранена повторяющаяся переписная формула: родоначальник и происходящий от него род.'
- source_word: לְיַחְלְאֵל ... מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: от Иахлеила — род Иахлеилов
  rationale: Имя передано принятой русской библейской транслитерацией, а производная форма — как название рода.
theological_decisions:
- issue: Значение выражения «сыновья Завулона» в переписном контексте
  choice: Сохранить в основном тексте «сыновья Завулона» и пояснить широкое родовое значение в сноске.
  alternative: Перевести непосредственно как «потомки Завулона».
  rationale: 'Так сохраняется еврейская генеалогическая формула без утраты контекстуального смысла: речь идёт не только о непосредственных сыновьях, но и о племенных потомках.'
translation_notes:
  register: Современный литературный русский язык с достоинством переписного перечня. Повторяющаяся структура оригинала сохранена, а тире помогает ясно отделить имя родоначальника от названия происходящего от него рода.
