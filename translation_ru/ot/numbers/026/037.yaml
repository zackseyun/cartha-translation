- source_word: בְנֵי יוֹסֵף
  choice: сыновья Иосифа
  rationale: Сохранена повторяющаяся генеалогическая формула и связь Ефрема с Иосифом.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Заключительная формула последовательно передаёт распределение потомков Иосифа по родовым подразделениям.
