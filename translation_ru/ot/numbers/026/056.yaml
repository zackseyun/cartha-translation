  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: ru
  text: По жребию[a] его удел будет распределён между многочисленными и малочисленными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По решению жребия удел каждого будет распределён между более многочисленными и менее многочисленными». Еврейский текст буквально сохраняет форму единственного числа: «его удел».'
    reason: лексическая и грамматическая альтернатива
lexical_decisions:
- source_word: עַל פִּי הַגּוֹרָל
  choice: по жребию
  rationale: Еврейское выражение буквально означает «по устам жребия», то есть согласно решению, определённому жребием. Краткое «по жребию» естественно передаёт эту идиому по-русски.
- source_word: תֵּחָלֵק
  choice: будет распределён
  rationale: Нифаль глагола חלק имеет здесь пассивное значение разделения или распределения удела. «Будет распределён» точно соответствует контексту наделения землёй.
- source_word: נַחֲלָתוֹ
  choice: его удел
  rationale: Существительное снабжено суффиксом третьего лица мужского рода единственного числа. «Его удел» сохраняет грамматическую форму еврейского текста, хотя в контексте выражение может иметь распределительное значение — удел каждого.
- source_word: בֵּין רַב לִמְעָט
  choice: между многочисленными и малочисленными
  rationale: רַב и מְעָט противопоставляют более и менее многочисленные группы. Субстантивированные прилагательные сохраняют это противопоставление, не уточняя сверх текста, идёт ли речь о коленах, родах или иных группах.
