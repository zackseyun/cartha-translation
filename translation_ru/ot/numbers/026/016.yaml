  text: לְ/אָזְנִ֕י מִשְׁפַּ֖חַת הָ/אָזְנִ֑י לְ/עֵרִ֕י מִשְׁפַּ֖חַת הָ/עֵרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/016.yaml
  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: ru
  text: от Озни — род озниев; от Эри — род эриев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְאָזְנִי
  choice: от Озни
  rationale: В переписной родословной формуле предлог לְ указывает на происхождение рода от названного предка; по-русски это естественно передаётся предлогом «от».
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В данном племенном и переписном контексте מִשְׁפָּחָה обозначает крупную родственную группу внутри колена; русское «род» точнее естественного административно-генеалогического смысла, чем узкое «семья».
- source_word: הָאָזְנִי
  choice: озниев
  rationale: Форма с артиклем является обозначением потомков Озни. Русское родовое наименование «озниев» сохраняет связь с именем предка и согласуется с формулой «род …».
- source_word: לְעֵרִי
  choice: от Эри
  rationale: Как и в первой половине стиха, לְ вводит имя предка, от которого происходит перечисляемый род.
- source_word: הָעֵרִי
  choice: эриев
  rationale: Гентилическая форма обозначает потомков Эри; русское «эриев» естественно выступает определением при слове «род».
theological_decisions: []
translation_notes:
  register: Краткая переписная формула передана современным литературным русским языком с сохранением параллелизма оригинала. Имена транслитерированы как «Озни» и «Эри»; гентилические формы переданы традиционными русскими родовыми прилагательными во множественном родительном падеже.
