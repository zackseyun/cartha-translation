base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: ru
  text: 'Сыновья Ашера по их родам[a]: от Имны — род имнитов; от Ишви — род ишвитов; от Берии — род берийцев.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «род» означает родовое подразделение внутри колена, а не только отдельную семью.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Сыновья Ашера
  rationale: Буквально передаёт генеалогическую формулу «сыновья Ашера». В данном контексте перечисляются сыновья-родоначальники, поэтому расширительное «потомки» не требуется.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В материалах переписи מִשְׁפָּחָה обозначает подразделение колена, более широкое, чем современная малая семья. Русское «род» естественно передаёт этот уровень родовой организации.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  choice: от Имны / от Ишви / от Берии
  rationale: Предлог לְ в повторяющейся генеалогической формуле указывает, от какого родоначальника происходит названный далее род; по-русски это естественно выражается предлогом «от».
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: род имнитов
  rationale: Еврейская форма представляет собой родовое наименование, образованное от имени Имна. Форма «имниты» сохраняет эту функцию и отличает род от самого родоначальника.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: род ишвитов
  rationale: Родовое наименование передано русским производным от личного имени Ишви.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: род берийцев
  rationale: Еврейское родовое наименование образовано от имени Берия. Русская форма «берийцы» ясна и произносительно естественнее буквального «берииты».
