  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: ru
  text: 'И вот потомки Шутелаха: от Ерана — род еранитов.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И вот сыновья Шутелаха: от Ерана — род еранита». Выражение «сыновья Шутелаха» употреблено здесь в родословном смысле и может обозначать потомков или родовые ветви, а не только непосредственных сыновей. Форма «еранит» в оригинале — собирательное название рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: И вот
  rationale: Сочетание союза с указательным местоимением вводит следующий пункт переписного перечня; «И вот» естественно передаёт эту функцию по-русски.
- source_word: בְּנֵי
  choice: потомки
  rationale: В данном контексте речь идёт о генеалогической ветви, а не обязательно о нескольких непосредственных сыновьях; «потомки» ясно передаёт смысл, сохраняя родословную связь.
- source_word: שׁוּתָלַח
  choice: Шутелаха
  rationale: Имя передано русской транслитерацией с еврейского; падежная форма обусловлена словом «потомки».
- source_word: לְ/עֵרָן
  choice: от Эрана
  rationale: Префикс לְ в переписной формуле обозначает происхождение подразделения от названного предка; «от Эрана» естественно выражает эту связь.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В переписных списках Чисел слово обозначает родственное подразделение племени; русское «род» точно и естественно в генеалогическом контексте.
- source_word: הָ/עֵרָנִי
  choice: эранитян
  rationale: Патронимическая форма называет членов рода, происходящего от Эрана; множественное «эранитян» согласуется с русской формулой «род эранитян».
