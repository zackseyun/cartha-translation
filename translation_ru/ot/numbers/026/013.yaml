lexical_decisions:
- source_word: לְזֶרַח
  choice: от Зераха
  rationale: В переписной формуле предлог לְ вводит имя родоначальника; русское «от» естественно передаёт происхождение рода.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: В контексте племенной переписи слово обозначает родовую группу внутри колена; «род» точно и естественно передаёт эту социальную единицу.
- source_word: הַזַּרְחִי
  choice: Зерахитов
  rationale: Патронимическая форма обозначает потомков Зераха; форма «Зерахиты» сохраняет связь с именем родоначальника.
- source_word: לְשָׁאוּל
  choice: от Шаула
  rationale: Предлог לְ в параллельной переписной формуле указывает на происхождение от названного родоначальника.
- source_word: הַשָּׁאוּלִי
  choice: Шаулитов
  rationale: Патронимическая форма обозначает род, происходящий от Шаула; «Шаулиты» прозрачно воспроизводит еврейское образование.
