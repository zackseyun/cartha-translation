  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: ru
  text: Когда увидишь её, ты тоже будешь собран к своему народу[a], как был собран твой брат Аарон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское образное выражение о смерти: «быть собранным к своему народу». Оно не уточняет характера посмертного состояния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: Когда ты увидишь
  rationale: Форма Qal, 2-е лицо единственного числа, с союзом וְ. В контексте действие предшествует последующей смерти Моисея, поэтому временное «когда» естественно передаёт последовательность событий.
- source_word: אֹתָהּ
  choice: её
  rationale: Местоимение женского рода относится к земле, упомянутой в контексте; в русском языке «земля» также женского рода.
- source_word: וְנֶאֱסַפְתָּ
  choice: будешь приобщён
  rationale: Nifal глагола אסף имеет пассивное значение и входит в устойчивое выражение о смерти и присоединении к своему народу. «Будешь приобщён» сохраняет пассивность и смысл образа, не сводя его к простому «умрёшь».
- source_word: אֶל עַמֶּיךָ
  choice: к своему народу
  rationale: Прямо передаёт еврейское выражение и сохраняет его родственный и общинный оттенок, не заменяя «народ» более узким толкованием «предки».
- source_word: גַּם אָתָּה
  choice: ты тоже
  rationale: Передаёт подчёркнутое сопоставление участи Моисея с участью Аарона.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Естественно вводит прямое сравнение с тем, что произошло с Аароном.
- source_word: נֶאֱסַף
  choice: был приобщён
  rationale: Последовательно передаёт тот же глагол и тот же образ, что и ранее в стихе.
- source_word: אַהֲרֹן אָחִיךָ
  choice: твой брат Аарон
  rationale: Естественный для современного русского языка порядок слов сохраняет родственное обозначение и общепринятую форму имени.
theological_decisions:
- issue: Передача выражения אסף אל־עמיו о смерти
  choice: Сохранить образ в формулировке «быть приобщённым к своему народу».
  alternative: «умереть»; «отойти к предкам»; буквальное «быть собранным к своему народу»
  rationale: Еврейский текст использует не нейтральное обозначение смерти, а образное устойчивое выражение с семейно-общинным оттенком. Выбранная формулировка сохраняет этот смысл и пассивную конструкцию, не навязывая стиху более определённого учения о посмертном состоянии.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «её» сохраняет грамматическую связь с землёй из контекста; выражение о смерти передано образно, без конфессионального уточнения.
