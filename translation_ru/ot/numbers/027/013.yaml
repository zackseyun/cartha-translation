  naturalness: Фраза «будешь приобщён к своему народу» для современного литературного русского неестественна и способна вызвать ассоциации с приобщением к вере, таинствам или культуре. «Будешь собран к своему народу» намеренно сохраняет библейский образ; его смысл пояснён сноской.
  terminology: «Собран к своему народу» последовательно отражает повтор того же еврейского глагола в обеих частях стиха. Сноска не истолковывает выражение как обязательное указание на присоединение к предкам и не конкретизирует посмертное состояние сверх текста.
