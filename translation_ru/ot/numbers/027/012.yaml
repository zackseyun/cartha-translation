base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Поднимись на эту гору в горах Аварим[a] и посмотри на землю, которую Я дал сынам Израиля[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на эту гору Аварим». Еврейское выражение буквально: «гора Аварима»; Аварим — название горной области или горной цепи.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть израильтянам, народу Израиля. Буквально: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Повествовательная конструкция с waw продолжает последовательность событий; традиционное русское «И сказал» естественно для библейского повествования и не добавляет более сильного временного оттенка.
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Точно и естественно передаёт повелительную форму глагола עלה и направленное вверх движение.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: эту гору Аварим
  rationale: Сохраняет указательное «эту» и топоним Аварим; неоднозначность конструкции «гора/горная область Аварим» отмечена в сноске.
- source_word: וּרְאֵה
  choice: и посмотри
  rationale: В данном контексте повелительное ראה означает увидеть землю с высоты; «посмотри» звучит по-русски естественнее, чем изолированное «увидь».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте обетования אֶרֶץ обозначает дарованную Израилю землю.
- source_word: נָתַתִּי
  choice: Я дал
  rationale: Еврейский перфект представляет дарование как совершившийся и определённый факт; русское прошедшее время сохраняет эту завершённость без искусственной конструкции.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально передаёт בני ישראל и сохраняет родословно-народное обозначение; более идиоматические варианты приведены в сноске.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя в тексте и не подменяет его титулом; форма «Иегова» отражает более позднюю традицию чтения.
- issue: Значение завершённости в נָתַתִּי
  choice: которую Я дал
  alternative: которую Я даю
  rationale: Прошедшее время сохраняет форму еврейского перфекта и представляет дар как установленный факт, не устраняя напряжения между данным обещанием и ещё не состоявшимся владением.
- issue: Передача בני ישראל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Основной текст прозрачно сохраняет буквальную форму устойчивого этнонима, а сноска поясняет его коллективное значение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; имя Яхве и формула «сынам Израиля» сохраняют связь с формой оригинала. Все сноски отмечены в основном тексте.
