  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: ru
  text: И Моисей представил их дело перед Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передал их правовое дело на решение Яхве».'
    reason: 'Лексическая альтернатива: מִשְׁפָּט может обозначать судебное дело или правовое притязание, а וַיַּקְרֵב — официальное представление вопроса на решение.'
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: представил
  rationale: Порода хифиль глагола קרב означает «приблизить, поднести, представить». В юридическом контексте «представил» естественно передаёт официальную передачу дела на решение.
- source_word: מִשְׁפָּטָן
  choice: их дело
  rationale: מִשְׁפָּט может обозначать суд, решение, правовое притязание или судебное дело. Здесь речь идёт о деле дочерей Салпаада, поэтому сочетание «их дело» точно и естественно для современного русского языка.
- source_word: לִפְנֵי
  choice: Яхве (как адресат представления дела)
  rationale: Буквально предлог означает «перед, пред лицом». При русском глаголе «представить» смысл присутствия перед тем, кому передают дело на решение, естественно выражается дательным падежом без отдельного предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: וַ
  choice: Тогда
  rationale: Повествовательный союз продолжает рассказ и указывает на последовавшее действие Моисея после обращения дочерей Салпаада.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер обращения Моисея к Яхве
  choice: представил их дело Яхве
  alternative: передал их тяжбу на решение Яхве
  rationale: Основной текст сохраняет юридический оттенок מִשְׁפָּט, но не уточняет сверх оригинала способ и форму ожидаемого решения.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза с юридическим оттенком. «Яхве» употреблено как несклоняемое имя. Маркер сноски поставлен непосредственно после имени.
