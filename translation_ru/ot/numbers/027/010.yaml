  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם אֵ֥ין ל֖/וֹ אַחִ֑ים וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לַ/אֲחֵ֥י אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: ru
  text: Если же у него нет братьев, отдайте его наследство братьям его отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более естественно: «его дядьям по отцу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Сочетание союза с условной частицей вводит следующий случай в последовательности правовых предписаний; «если же» естественно передаёт и условие, и переход к новой ситуации.
- source_word: אֵין לוֹ
  choice: у него нет
  rationale: Еврейская конструкция отрицания существования с ל и местоименным суффиксом естественно передаётся по-русски конструкцией обладания «у него нет».
- source_word: אַחִים
  choice: братьев
  rationale: Форма мужского рода во множественном числе буквально обозначает братьев; в данном законе о наследовании речь идёт о мужчинах-наследниках.
- source_word: וּנְתַתֶּם
  choice: отдайте
  rationale: Форма обращена во втором лице множественного числа к тем, кто исполняет правовое предписание. Русский повелительный вид естественно и ясно передаёт обязательную норму в условной конструкции.
- source_word: נַחֲלָתוֹ
  choice: его наследство
  rationale: В данном правовом контексте נַחֲלָה означает наследуемое владение или имущество; «наследство» является точным и понятным соответствием.
- source_word: לַאֲחֵי אָבִיו
  choice: братьям его отца
  rationale: Так сохраняется буквальная структура родственного обозначения «братья его отца» без замены её более идиоматическим, но слегка истолковывающим словом «дяди».
