  text: אֲשֶׁר יֵצֵ֣א לִ/פְנֵי/הֶ֗ם וַ/אֲשֶׁ֤ר יָבֹא֙ לִ/פְנֵי/הֶ֔ם וַ/אֲשֶׁ֥ר יוֹצִיאֵ֖/ם וַ/אֲשֶׁ֣ר יְבִיאֵ֑/ם וְ/לֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהוָ֔ה כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: ru
  text: который будет выходить перед ними и входить перед ними[a], и который будет выводить их и вводить их[b], чтобы община Яхве[c] не была как овцы, у которых нет пастуха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впереди них» — в обоих случаях вместо «перед ними».'
    reason: lexical_alternative
  - marker: b
    text: Последовательность «выходить… входить… выводить… вводить» — еврейский способ описать всестороннее публичное руководство народом.
    reason: cultural_note
  - marker: c
    text: 'Или: «собрание Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение продолжает просьбу Моисея о человеке, поставленном над общиной; мужской род соответствует подразумеваемому личному антецеденту из предыдущего стиха.
- source_word: יֵצֵא ... יָבֹא
  choice: будет выходить ... и входить
  rationale: Формы имперфекта имеют здесь проспективное значение. Конкретная пара глаголов движения сохранена как еврейский меризм, относящийся ко всей публичной деятельности вождя.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Буквально выражение указывает на положение перед народом; оно сохраняет пространственный образ предводительства, не сводя его к отвлечённому «управлять».
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: будет выводить их и вводить их
  rationale: Каузативные формы глаголов יצא и בוא переданы симметрично и конкретно. Это сохраняет связь между движениями самого предводителя и народа, которого он ведёт.
- source_word: עֲדַת יְהוָה
  choice: община Яхве
  rationale: עֵדָה обозначает собранный народ как единое сообщество, а тетраграмматон передан личным именем «Яхве».
- source_word: כַצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: как овцы, у которых нет пастуха
  rationale: Сохранены прямое сравнение, собирательный смысл צֹאן и образ пастуха как предводителя; русский оборот естественен и не вводит более позднюю церковную терминологию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл последовательности «выходить… входить… выводить… вводить»
  choice: Сохранить конкретные глаголы движения как всеохватное описание предводительства
  alternative: Обобщить как «руководить ими» или «направлять их во всём»
  rationale: Буквальные образы движения намеренно ведут к сравнению с овцами и пастухом. Их сохранение не устраняет возможный военный, общественный и пастырский оттенок выражения.
- issue: Образ народа без пастуха
  choice: Сохранить как «овцы, у которых нет пастуха»
  alternative: Истолковать отвлечённо как «народ без руководителя»
  rationale: Сам текст выражает нужду в руководстве посредством пастушеской метафоры; отвлечённая передача ослабила бы её богословскую и литературную силу.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным библейским звучанием. Параллелизм еврейского текста сохранён; архаизмы и конфессионально окрашенные обозначения руководителя не использованы.
