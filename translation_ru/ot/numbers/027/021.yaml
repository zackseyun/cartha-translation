revisions:
- from: Он должен предстать перед священником Елеазаром, и тот будет вопрошать за него пред Яхве о решении урима[a]. По его слову они будут выходить и по его слову входить — он и все сыны Израиля с ним[b], вся община.
  to: Он должен предстать перед священником Елеазаром, и тот будет вопрошать за него пред Яхве, испрашивая решения через Урим[a]. По его слову будут выходить и по его слову входить он, и все сыны Израиля с ним[b], и вся община.
  rationale: 'Исправлена передача בְּמִשְׁפַּט הָאוּרִים: решение испрашивается через Урим, а не является темой вопроса. Прописная буква в «Урим» и явная координация заключительного ряда повышают терминологическую и синтаксическую точность. Неоднозначное «по его слову» намеренно сохранено без догматического или интерпретационного разрешения.'
