  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: ru
  text: Он должен предстать перед священником Елеазаром, и тот будет вопрошать за него пред Яхве, испрашивая решения через Урим[a]. По его слову будут выходить и по его слову входить он, и все сыны Израиля с ним[b], и вся община.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством решения Урима». Речь идёт о священническом вопрошании пред Яхве с помощью Урима.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны Израиля», то есть израильтяне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: пред
  rationale: 'Сохраняет пространственно-реляционный смысл: Иисус Навин должен предстать перед Елеазаром; форма «пред» поддерживает достойный библейский регистр.'
- source_word: יַעֲמֹד
  choice: должен предстать
  rationale: Имперфект в контексте поручения имеет предписывающую силу; «должен предстать» естественно передаёт и действие, и официальный характер сцены.
- source_word: וְשָׁאַל לוֹ
  choice: и тот будет вопрошать за него
  rationale: По контексту субъектом становится Елеазар, вопрошающий от имени Иисуса Навина. Местоимение «тот» проясняет русскую синтаксическую связь, не изменяя смысла.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: о решении урима
  rationale: מִשְׁפָּט здесь обозначает решение, получаемое в ходе священнического вопрошания; «урим» сохранён как технический культовый термин.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: עַל פִּיו
  choice: по его слову
  rationale: Еврейская идиома буквально связана с «устами» и означает действие по властному указанию. Формулировка сохраняет единственное местоимение и не устраняет неоднозначность его референта.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: будут выходить ... будут входить
  rationale: Сохранена характерная еврейская парная формула, обозначающая общественное, в том числе военное, движение под руководством вождя.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет явную форму исходного текста и торжественный коллективный смысл; современное пояснение дано в сноске.
- source_word: הָעֵדָה
  choice: община
  rationale: Передаёт собирательное обозначение всего сообщества Израиля в Пятикнижии естественным современным русским словом.
theological_decisions:
- issue: К кому относится местоимение в выражении עַל פִּיו («по его слову»)
  choice: Сохранено местоимение единственного числа без явного называния референта.
  alternative: Прямо отнести указание к Елеазару либо к Иисусу Навину.
  rationale: Еврейский текст выражен сжато и допускает понимание властного указания как решения, данного через вопрошание урима и переданного при посредстве Елеазара; явное называние лица необоснованно устранило бы эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Архаизирующее «пред» и устойчивое «вопрошать» уместны в культово-официальной сцене; остальной синтаксис сделан ясным и современным. Все сноски отмечены в основном тексте.
