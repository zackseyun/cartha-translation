  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: ru
  text: 'И сынам Израиля скажи: «Если человек умрёт, не оставив сына, передайте его наследство его дочери».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: А сынам Израиля
  rationale: Сохраняет буквальный родовой оборот «сыны Израиля» и вместе с тем естественно связывает повеление с предыдущей речью.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: скажи
  rationale: Стандартная древнееврейская формула введения речи передана естественным современным русским глаголом без тяжеловесного буквального «говори, говоря».
- source_word: אִישׁ כִּי יָמוּת
  choice: Если кто умрёт
  rationale: В казуистической правовой формуле אִישׁ обозначает участника случая; русское «кто» естественно вводит условие, не меняя его содержания.
- source_word: וּבֵן אֵין לוֹ
  choice: и не будет у него сына
  rationale: Передаёт буквальную конструкцию существования «сына нет у него» и ясно сохраняет отсутствие именно сына-наследника.
- source_word: וְהַעֲבַרְתֶּם
  choice: то передайте
  rationale: Порода hифиль выражает юридическую передачу наследственных прав; «передайте» точно и понятно передаёт это действие.
- source_word: נַחֲלָתוֹ
  choice: его наследство
  rationale: В данном правовом контексте נַחֲלָה означает наследственное владение или наследство; выбран общеупотребительный точный эквивалент.
- source_word: לְבִתּוֹ
  choice: его дочери
  rationale: Предлог לְ обозначает получателя передачи; дательный падеж естественен по-русски.
