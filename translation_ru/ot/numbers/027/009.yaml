  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: ru
  text: А если у него нет дочери, то отдайте его наследство его братьям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: А если
  rationale: Союз וְ вводит следующий условный случай в последовательности правовых постановлений; «А если» естественно передаёт связь с предыдущим условием.
- source_word: אֵין לוֹ בַּת
  choice: у него нет дочери
  rationale: Еврейская конструкция существования с לְ идиоматически выражает обладание; перевод сохраняет единственное число בַּת и звучит естественно по-русски.
- source_word: וּנְתַתֶּם
  choice: то отдайте
  rationale: Форма второго лица множественного числа выражает обязательное предписание. «То» ясно обозначает следствие условия, а повелительное «отдайте» естественно для современного русского правового текста.
- source_word: נַחֲלָתוֹ
  choice: его наследство
  rationale: В данном законе נַחֲלָה означает наследуемое владение или наследственную долю; «наследство» точно и понятно передаёт смысл.
- source_word: לְאֶחָיו
  choice: его братьям
  rationale: Мужской род и множественное число переданы прямо; в данном порядке наследования имеются в виду братья умершего.
