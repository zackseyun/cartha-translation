  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: ru
  text: И возложи на него часть своего величия[a], чтобы вся община сынов Израиля слушалась его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «часть своего достоинства», «великолепия» или «почёта». Еврейское слово может также обозначать величие и авторитет, связанные с должностью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «повиновалась ему»; еврейский глагол может означать «слышать», «слушать» и «слушаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: И передай
  rationale: נתן буквально означает «дать», а в сочетании с עַל и в контексте поставления на служение выражает передачу или возложение; «передай» естественно передаёт направленность действия.
- source_word: מֵהוֹדְךָ
  choice: часть своего достоинства
  rationale: הוֹד может означать великолепие, величие, достоинство или почёт. В данном контексте достоинство связано с положением и властью Моисея, но перевод не сводит многозначное слово только к «власти». Предлог מִן указывает на некоторую долю.
- source_word: עָלָיו
  choice: ему
  rationale: Русская конструкция «передать ему» естественно выражает еврейское נתן ... על; буквальное «возложить на него» возможно, но звучит менее обычно с «достоинством».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз вводит цель действия; «чтобы» точно и естественно передаёт эту функцию.
- source_word: יִשְׁמְעוּ
  choice: слушалась его
  rationale: שׁמע охватывает значения «слышать», «слушать» и «повиноваться». В контексте поставления Иисуса Навина выражение «слушалась его» сохраняет связь слушания с послушанием, не устраняя смысловой оттенок глагола.
- source_word: כָּל עֲדַת
  choice: вся община
  rationale: עֵדָה обозначает собранное сообщество Израиля; «вся община» — точный и понятный русский эквивалент.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранена родственная форма исходного выражения, а не заменена обобщающим «израильтян».
theological_decisions:
- issue: Характер передаваемого качества при поставлении Иисуса Навина
  choice: «часть своего достоинства» с примечанием о великолепии, величии, почёте и должностной власти
  alternative: «часть своей власти» или «часть своего величия»
  rationale: Контекст подразумевает полномочия руководителя, однако הוֹד прямо обозначает достоинство, величие или великолепие. Основной текст сохраняет образ и многозначность, а примечание раскрывает функциональный оттенок власти.
- issue: Значение שׁמע в целевой части
  choice: «слушалась его»
  alternative: «повиновалась ему» или «слушала его»
  rationale: Форма допускает как буквальное слушание, так и послушание. Русское «слушалась» естественно объединяет оба оттенка и соответствует контексту признания нового руководителя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; сохранены родственное обозначение «сыны Израиля» и смысловая неоднозначность ключевых еврейских слов.
