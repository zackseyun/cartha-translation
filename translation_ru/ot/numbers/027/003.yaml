base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: ru
  text: Наш отец умер в пустыне. Он не был среди тех, кто собрался против Яхве в общине Корея; он умер за свой грех[a], и сыновей у него не было.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умер в своём грехе»; еврейское выражение не уточняет, о каком именно грехе идёт речь.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: наш отец
  rationale: Прямое указание дочерей на своего отца; более широкое «предок» здесь неуместно.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Естественное и традиционное обозначение пустынной местности и периода странствий Израиля.
- source_word: בְּתוֹךְ הָעֵדָה הַנּוֹעָדִים עַל יְהוָה
  choice: среди тех, кто собрался против Яхве
  rationale: Передаёт нахождение внутри сообщества и враждебную направленность собрания; по-русски конструкция естественнее буквального «среди общины собравшихся».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בַּעֲדַת קֹרַח
  choice: вместе с Кореем
  rationale: По контексту речь о мятежной группе, связанной с Кореем; формулировка избегает тяжеловесного повтора слова «община».
- source_word: בְחֶטְאוֹ
  choice: за свой грех
  rationale: Контекст допускает причинное понимание предлога בְ; «свой» подчёркивает противопоставление участию в мятеже Корея, не уточняя природы греха.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: и сыновей у него не было
  rationale: Идиоматическая русская передача экзистенциальной конструкции; «сыновей» важно сохранить ввиду вопроса о наследстве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Личная вина в выражении בְחֶטְאוֹ
  choice: он умер за свой грех
  alternative: он умер в своём грехе
  rationale: Сохраняется противопоставление мятежу Корея, но конкретный грех не определяется. Причинное прочтение возможно по контексту, а более буквальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис разделён на два предложения ради естественного звучания; смысловые связи исходного текста сохранены.
