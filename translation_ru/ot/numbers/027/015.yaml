  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: ru
  text: 'Тогда Моисей обратился к Яхве[a] и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционно передаётся как «Господь».'
    reason: Указывает написание Божьего имени в еврейском оригинале и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда … обратился
  rationale: Форма wayyiqtol продвигает повествование, поэтому последовательность естественно передана словом «тогда». В сочетании с אֶל глагол речи по-русски идиоматично передаётся как «обратился к».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает адресата, к которому направлена речь Моисея.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Инфинитивная формула вводит последующую прямую речь. Русское «и сказал» звучит естественнее буквального «говоря» и сохраняет её функцию.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, то есть собственное имя, а не титул. Форма «Яхве» представляет его распространённую научную реконструкцию; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, а двоеточие естественно вводит прямую речь следующего стиха.
