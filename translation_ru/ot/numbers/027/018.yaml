base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Возьми Иисуса, сына Навина, человека, в котором есть дух[a], и возложи на него руку».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в котором пребывает Дух». Еврейское руа́х может обозначать дух; в данном контексте оно может относиться к Божьему Духу или к духовному дарованию, которым наделён Иисус.'
    reason: Сохранение лексической и богословской неоднозначности еврейского выражения אֲשֶׁר רוּחַ בּוֹ без неточного объяснения через отсутствие артикля.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: קַח לְךָ
  choice: Возьми
  rationale: В данном повелении сочетание с לְךָ естественно передаётся по-русски простым «возьми»; буквальное «возьми себе» могло бы ошибочно подразумевать личное владение.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисуса, сына Навина
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён; падеж обусловлен глаголом «возьми».
- source_word: אִישׁ אֲשֶׁר רוּחַ בּוֹ
  choice: человека, в котором есть дух
  rationale: 'Сохраняет структуру и неопределённость еврейского выражения: у רוּחַ нет артикля, поэтому основной текст не уточняет прямо, идёт ли речь о Божьем Духе или о духе как внутреннем даровании.'
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: и возложи на него руку
  rationale: «Возложить руку» — естественная русская передача обрядового действия; единственное число «руку» соответствует еврейскому тексту.
theological_decisions:
- issue: Относится ли רוּחַ к Божьему Духу или к духу/внутреннему дарованию Иисуса Навина
  choice: дух
  alternative: Дух; духовное дарование
  rationale: Еврейский текст допускает указание на Божье наделение, но не содержит артикля и не называет Бога при слове רוּחַ. Строчная буква в основном тексте сохраняет эту неоднозначность, а примечание сообщает вероятное богословское прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и понятен; традиционная формула «возложи на него руку» сохранена как естественная для контекста посвящения.
