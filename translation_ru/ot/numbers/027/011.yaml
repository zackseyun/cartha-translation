id: NUM.27.11
reference: Numbers 27:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: ru
  text: Если же у его отца нет братьев, отдайте его наследство ближайшему кровному родственнику из его рода[a], и тот унаследует его[b]. Это будет для сынов Израиля[c] правовым установлением[d], как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его кровному родственнику, ближайшему к нему, из его рода».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и тот вступит во владение им».'
    reason: lexical_alternative
  - marker: c
    text: «Сыны Израиля» — принятое в еврейском тексте обозначение народа Израиля в целом.
    reason: cultural_note
  - marker: d
    text: 'Или: «обязательным правовым постановлением»; еврейское выражение обозначает установленную юридическую норму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: братьев
  rationale: 'В последовательности правил наследования имеется в виду прямое семейное значение: братья отца умершего.'
- source_word: נַחֲלָתוֹ
  choice: его наследство
  rationale: Слово обозначает наследуемое владение; «наследство» ясно передаёт юридический контекст.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: ближайшему кровному родственнику
  rationale: שְׁאֵר указывает на родство по крови, а הַקָּרֹב אֵלָיו — на ближайшую степень родства; по-русски сочетание естественно передаётся одной именной группой.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: из его рода
  rationale: מִשְׁפָּחָה здесь означает расширенную родственную группу внутри племенной структуры Израиля; «род» точнее обычного «семья».
- source_word: וְיָרַשׁ אֹתָהּ
  choice: и тот унаследует его
  rationale: ירשׁ допускает значения «унаследовать» и «вступить во владение». В законе о наследовании «унаследует» наиболее прямо выражает юридический результат.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохранено буквальное и традиционное заветное обозначение народа Израиля; оно относится к народу в целом, а не только к отдельным мужчинам.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: правовым установлением
  rationale: Сочетание обозначает обязательную юридическую норму. Этот вариант сохраняет правовой смысл и избегает современного узкого значения выражения «судебное постановление».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Заветно-национальное выражение לִבְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Сохранена мужская форма исходного устойчивого обозначения всего народа, при этом примечание поясняет её собирательный смысл.
- issue: Юридический характер לְחֻקַּת מִשְׁפָּט
  choice: правовое установление
  alternative: судебное постановление; законное установление
  rationale: Фраза выражает обязательную норму наследственного права, а не разовое решение суда; перевод не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повелительное «отдайте» сохраняет обращение во множественном числе; «правовое установление» передаёт официальный характер нормы, не звуча как разовое решение современного суда.
