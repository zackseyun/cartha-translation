base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: ru
  text: Почему имя нашего отца должно исчезнуть из его рода потому, что у него не было сына? Дайте нам земельный надел среди братьев нашего отца[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть умалено» либо «быть устранено». Еврейский текст спрашивает, почему имя отца должно быть утрачено из его рода из-за отсутствия сына.'
    reason: lexical_alternative
  - marker: b
    text: «Земельный надел» — закреплённое наследственное владение землёй внутри рода.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Почему... должно
  rationale: Передаёт риторический вопрос и содержащийся в нём протест естественным современным русским языком.
- source_word: יִגָּרַע
  choice: исчезнуть
  rationale: В нифале глагол указывает на утрату или устранение имени из рода; «исчезнуть» естественно сочетается со словом «имя» и сохраняет итоговый смысл, не исключая оттенков «быть изъятым» или «умалиться».
- source_word: שֵׁם
  choice: имя
  rationale: Буквальный перевод сохраняет древнееврейский образ продолжения памяти, положения и линии отца в составе рода.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: из его рода
  rationale: В контексте племенного устройства מִשְׁפָּחָה обозначает родовую группу, а не современную нуклеарную семью.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: лишь потому, что у него не было сына
  rationale: Прошедшее время естественно в повествовательном контексте; «сына» сохраняет юридически значимое указание на наследника мужского пола. «Лишь» выявляет протестную силу довода, не меняя его содержания.
- source_word: תְּנָה לָּנוּ
  choice: Дайте нам
  rationale: Прямое и естественное выражение повелительной просьбы; множественное число соответствует обращению дочерей к Моисею и собранию в контексте.
- source_word: אֲחֻזָּה
  choice: земельный надел
  rationale: Термин обозначает закреплённое земельное владение в системе родового наследования; такой перевод точнее общего слова «владение».
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: среди братьев нашего отца
  rationale: Сохраняет буквальную и юридически значимую отсылку к братьям отца, не расширяя её до родственников вообще.
theological_decisions:
- issue: Гендерно-конкретная лексика наследования
  choice: сына / братьев нашего отца
  alternative: ребёнка / родственников
  rationale: Древнееврейский текст прямо употребляет мужские термины, поскольку рассматривается передача земельного владения при отсутствии сына; нейтрализация стёрла бы правовую постановку вопроса.
- issue: Значение исчезновения имени
  choice: сохранён образ исчезновения имени из рода
  alternative: истолковать как прекращение родословной или лишение наследства
  rationale: Текст связывает имя, родовую преемственность и землю, но не сводит «имя» только к одному из этих понятий; буквальный образ сохраняет богословскую и социальную многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой правовой просьбы. Синтаксис прост и понятен; древнееврейский образ «имени» сохранён, а значение אֲחֻזָּה выражено конкретным термином «земельный надел».
