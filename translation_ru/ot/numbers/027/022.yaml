base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: ru
  text: 'Моисей поступил так, как повелел ему Яхве: он взял Иисуса Навина и поставил его перед священником Елеазаром и перед всей общиной.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «велел ему встать перед»; еврейский глагол можно также понять как «представил его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычный глагол עשה здесь выражает исполнение ранее данного повеления; оборот «сделал, как повелел» естественен по-русски и близок к форме оригинала.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз непосредственно соотносит действие Моисея с повелением Яхве.
- source_word: צִוָּה
  choice: повелел
  rationale: Русская форма прошедшего времени естественно передаёт предшествующее повеление без необходимости вводить дополнительную временную конструкцию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וַיִּקַּח אֶת יְהוֹשֻׁעַ
  choice: взял Иисуса Навина
  rationale: לקח буквально означает «взять»; традиционная полная русская форма имени отличает Иисуса Навина от других носителей имени Иисус.
- source_word: וַיַּעֲמִדֵהוּ
  choice: поставил его
  rationale: Каузативная форма עמד означает «поставить, заставить стоять» и в данном обрядовом контексте может также подразумевать представление человека собранию.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог обозначает нахождение в присутствии Елеазара и всей общины; «перед» кратко сохраняет пространственный и публичный оттенки.
- source_word: הַכֹּהֵן
  choice: священником
  rationale: Прямое и современное обозначение служения Елеазара; творительный падеж обусловлен русским предлогом «перед».
- source_word: כָּל הָעֵדָה
  choice: всей общиной
  rationale: עֵדָה обозначает собранное общество Израиля; «община» понятно современному читателю и сохраняет коллективный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер действия над Иисусом Навином
  choice: поставил его перед
  alternative: представил его
  rationale: Выбрана менее интерпретирующая передача, сохраняющая буквальный физический смысл каузатива עמד и допускающая подразумеваемый церемониальный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис близок к еврейскому, но естественен по-русски; подлинная многозначность וַיַּעֲמִדֵהוּ отражена в примечании.
