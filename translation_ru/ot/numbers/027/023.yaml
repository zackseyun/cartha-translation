  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: ru
  text: И он возложил на него руки и повелел ему[a], как сказал Яхве через Моисея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поручил ему». Еврейский глагол обычно означает «повелевать, давать поручение»; здесь речь идёт об официальном поручении, данном Иисусу Навину.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея» — еврейский оборот со значением «через Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: возложил на него руки
  rationale: Глагол סמך в сочетании с руками и предлогом על обозначает возложение рук; множественное число יָדָיו передано как «руки».
- source_word: וַיְצַוֵּהוּ
  choice: дал ему повеление
  rationale: Глагол צוה прежде всего выражает приказание или поручение. Такая передача сохраняет его прямой смысл и вместе с тем допускает официальный характер поручения Иисусу Навину в данном контексте.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как и сказал
  rationale: Оборот передаёт соответствие поступка Моисея ранее сказанному Яхве; частица «и» естественно подчёркивает это соответствие по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея» — древнееврейский оборот, обозначающий Моисея как посредника, через которого были переданы слова Яхве.
theological_decisions:
- issue: Значение וַיְצַוֵּהוּ при поставлении Иисуса Навина
  choice: дал ему повеление
  alternative: поручил ему служение / поставил его
  rationale: Выбранная формулировка сохраняет основное значение глагола «повелевать, поручать» и не сводит его безоговорочно к техническому обряду поставления, хотя ближайший контекст придаёт действию официальный характер.
- issue: Посредничество Моисея в выражении בְּיַד מֹשֶׁה
  choice: через Моисея
  alternative: рукой Моисея
  rationale: Идиоматическая передача ясно выражает, что Яхве говорил через Моисея как своего посредника, не приписывая Моисею независимого авторства.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краток и близок к еврейскому оригиналу; не вполне естественная по-русски буквальная идиома «рукой Моисея» вынесена в примечание.
