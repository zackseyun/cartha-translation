  source_fidelity: 'Смысл передан в целом верно: כַּאֲשֶׁר имеет причинное значение; מְרִיתֶם פִּי — неповиновение Божьему повелению; מֵי מְרִיבַת קָדֵשׁ — именование вод/местности. Однако «воспротивились Моему повелению явить Мою святость» синтаксически делает «явить» содержанием самого повеления и передаёт לְהַקְדִּישֵׁנִי менее прямо. В еврейском речь идёт о том, что Моисей и Аарон не явили Бога святым перед глазами народа. Безопаснее выразить этот контекстуально подразумеваемый отрицательный результат деепричастным оборотом: «не явив Меня святым».'
  naturalness: «Во время распри в общине» понятно, но «распри общины» точнее отражает конструкцию «распря собрания/общины». «У воды» неоправданно заменяет еврейское множественное «у вод» и не нужно для естественности русского текста. Обновлённая формулировка остаётся современной литературной, ясной и умеренно возвышенной.
  terminology: «Цин» корректно отличает этот топоним от пустыни Син. «Кадес» и «Мерива-Кадес» допустимы как русская передача географического названия. Термин «святым» должен относиться непосредственно к Богу («явив Меня святым»), а не к отвлечённой «Моей святости», чтобы сохранить конструкцию оригинала. Сноску a следует поставить у соответствующего оборота, а не после «перед их глазами».
