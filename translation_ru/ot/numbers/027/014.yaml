base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: ru
  text: потому что в пустыне Цин, во время распри общины, вы воспротивились Моему повелению, не явив Меня святым[a] у вод перед их глазами. Это воды Меривы-Кадеса[b] в пустыне Цин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «явив Меня святым». Еврейский инфинитив имеет положительную форму, однако из контекста ясно, что Моисей и Аарон этого не сделали.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воды Меривы в Кадесе»; более буквально: «воды распри Кадеса». Название «Мерива» созвучно еврейскому слову «распря».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: потому что
  rationale: В данном контексте союз указывает на причину, по которой Моисею и Аарону не позволено войти в землю; причинное значение естественно передаётся по-русски.
- source_word: מְרִיתֶם פִּי
  choice: вы воспротивились Моему повелению
  rationale: Буквально פִּי означает «Моим устам», но здесь это устойчивое обозначение Божьего приказа; глагол מרה выражает неповиновение или противление власти.
- source_word: בְּמִדְבַּר צִן
  choice: в пустыне Цин
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; топоним צִן передан как «Цин», чтобы отличить его от названия пустыни Син (סִין).
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: во время распри в общине
  rationale: מְרִיבָה означает распрю, спор или пререкание, а עֵדָה — собравшуюся общину Израиля. Формулировка передаёт обстоятельства происшествия естественным современным русским языком.
- source_word: לְהַקְדִּישֵׁנִי
  choice: явить Мою святость
  rationale: Каузативная форма קדש здесь означает признать и публично показать Бога святым. Положительная форма инфинитива сохранена; её связь с «повелением» ясно показывает, чего именно ослушались Моисей и Аарон.
- source_word: בַמַּיִם
  choice: у воды
  rationale: Предлог указывает на место и обстоятельства события. Единственное число в русском естественно обозначает водный источник, хотя в еврейском слово имеет форму множественного числа.
- source_word: לְעֵינֵיהֶם
  choice: перед их глазами
  rationale: Сохранён наглядный еврейский оборот, подчёркивающий публичный характер происшествия.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: воды Меривы-Кадеса
  rationale: Сочетание передано как составной географический топоним; «Мерива» сохраняет связь с еврейским словом «распря», а «Кадес» уточняет место.
theological_decisions:
- issue: Смысл לְהַקְדִּישֵׁנִי в связи с неповиновением Моисея и Аарона
  choice: воспротивились Моему повелению явить Мою святость
  alternative: не явили Моей святости / не почтили Меня как святого
  rationale: Еврейский инфинитив имеет положительную форму «явить Меня святым». Связь его с «Моему повелению» сохраняет грамматическую форму оригинала и одновременно ясно передаёт, что требуемое действие не было совершено, не добавляя отрицания непосредственно в инфинитив.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы. Синтаксис сделан ясным без устранения смысловой связи между неповиновением и неявленной святостью Бога.
