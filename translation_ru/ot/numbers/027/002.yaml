  naturalness: «Предстали перед» и «и сказали:» естественны для современного литературного библейского повествования. «Шатёр встречи» возможно понять, но по-русски звучит менее устойчиво и менее естественно, чем традиционно-нейтральное «шатёр собрания».
  terminology: «Священник Елеазар», «вожди» и «вся община» приемлемы. Для אֹהֶל מוֹעֵד следует употребить устойчивое русское соответствие «шатёр собрания»; оно передаёт место священного собрания/встречи, не добавляя доктринальных толкований.
