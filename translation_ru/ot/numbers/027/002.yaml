base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: ru
  text: 'И они предстали перед Моисеем, перед священником Елеазаром, перед вождями, перед всей общиной у входа в шатёр собрания и сказали:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: И они предстали
  rationale: Форма 3-го лица женского рода множественного числа описывает дочерей, которые официально выступили перед собранием. «Предстали» естественно передаёт как действие עמד, так и публично-правовой контекст.
- source_word: לִפְנֵי
  choice: перед
  rationale: Повтор «перед» сохраняет формальную последовательность перечисления лиц и групп, к которым обращаются дочери.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священником Елеазаром
  rationale: Передан прямо указанный сан; слово «первосвященник» не добавляется, поскольку в еврейском тексте стоит только הַכֹּהֵן.
- source_word: הַנְּשִׂיאִם
  choice: вождями
  rationale: В данном контексте это официальные главы племён или общины. «Вожди» передаёт статус и не привносит монархического оттенка слова «князья».
- source_word: כָל הָעֵדָה
  choice: всей общиной
  rationale: עֵדָה в книге Чисел обозначает собранное сообщество Израиля; «община» сохраняет этот устойчивый общественно-религиозный смысл.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Переданы место у входа и назначение אֹהֶל מוֹעֵד как шатра, связанного со встречей; формулировка понятна современному читателю и не добавляет отсутствующего в тексте пояснения.
- source_word: לֵאמֹר
  choice: 'и сказали:'
  rationale: Хотя буквально это вводная конструкция «говоря», в современном русском повествовании конечный глагол естественнее вводит прямую речь следующего стиха и не меняет смысла.
theological_decisions:
- issue: Публично-правовой характер обращения дочерей
  choice: Сохранить полный перечень — Моисей, священник Елеазар, вожди и вся община — и повтор предлога «перед»
  alternative: Сжать перечень или передать его обобщённо как обращение к руководителям народа
  rationale: Структура еврейского текста подчёркивает открытый, официальный и общинный характер разбирательства; сокращение ослабило бы этот акцент.
- issue: Значение עֵדָה
  choice: община
  alternative: собрание
  rationale: «Община» лучше сохраняет характер Израиля как устойчивого сообщества, тогда как «собрание» может обозначать лишь разовый сход. Дополнительных конфессиональных смыслов термину не приписывается.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический повтор сохранён ради юридической и общественной весомости сцены; архаизмы и конфессионально маркированные добавления исключены.
