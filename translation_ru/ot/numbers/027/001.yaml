id: NUM.27.1
reference: Numbers 27:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: ru
  text: 'И подошли[a] дочери Салпаада, сына Хефера, сына Галаада, сына Махира, сына Манассии, из родов Манассии, сына Иосифа. Вот имена его дочерей: Махла, Ноа[b], Хогла, Милка и Тирца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приблизились»; возможно также: «выступили вперёд». Выражение может подразумевать, что женщины предстали с официальным прошением, о котором говорится в следующих стихах.'
    reason: lexical_alternative
  - marker: b
    text: Ноа здесь — имя одной из дочерей Салпаада, а не имя Ноя, мужчины, о котором повествуется в книге Бытие.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: И подошли
  rationale: Форма Qal wayyiqtol, 3-е лицо женского рода множественного числа, обозначает приближение; «подошли» естественно звучит по-русски и не уточняет сверх текста, к кому именно они подошли. Контекст следующих стихов раскрывает, что они выступили с официальным прошением.
- source_word: בְּנוֹת
  choice: дочери
  rationale: В сочетании с именем отца и последующим перечислением имён речь идёт о его родных дочерях.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: сына ... сына ... сына ... сына
  rationale: Полная генеалогическая цепочка сохранена, поскольку она обосновывает принадлежность женщин к роду и связана с последующим вопросом о наследстве.
- source_word: לְמִשְׁפְּחֹת
  choice: из родов
  rationale: מִשְׁפָּחָה здесь обозначает родовое подразделение племени, а предлог לְ выражает принадлежность. «Из родов» передаёт эту социально-родовую связь естественным русским языком.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Манассии, сына Иосифа
  rationale: Явное указание на происхождение Манассии от Иосифа сохранено без сокращения генеалогии.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Вот имена его дочерей
  rationale: Краткая русская формула естественно вводит перечень и сохраняет указательное значение וְאֵלֶּה.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Махла, Ноа, Хогла, Милка и Тирца
  rationale: Имена переданы русской транслитерацией с опорой на еврейские формы. «Тирца» непосредственно отражает תִרְצָה; «Ноа» сохранено как женское имя и не смешивается с именем Ной.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Генеалогическая повторность намеренно сохранена; синтаксис слегка упорядочен для ясности. Использованы узнаваемые русские формы основных библейских имён, при этом имена дочерей переданы близко к еврейскому звучанию.
