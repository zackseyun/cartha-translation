base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: ru
  text: Поставь его перед священником Елеазаром и перед всей общиной и у них на глазах возложи на него поручение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повели ему»; или: «дай ему наставление». Еврейский глагол обычно означает «повелевать», но здесь, вероятно, обозначает публичное поручение Иисусу Навину его обязанностей.'
    reason: Лексическая неоднозначность глагола צוה в контексте публичного поставления.
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Поставь
  rationale: 'Порода hифиль глагола עמד имеет каузативное значение: велеть кому-либо встать или поставить его перед кем-либо. «Поставь» естественно передаёт формальное представление Иисуса Навина.'
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог обозначает пространственное положение или официальное присутствие перед кем-либо; краткое «перед» подходит церемониальному контексту.
- source_word: אֶלְעָזָר
  choice: Елеазаром
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הַכֹּהֵן
  choice: священником
  rationale: Определённое наименование служения Елеазара; творительный падеж обусловлен предлогом «перед».
- source_word: כָּל הָעֵדָה
  choice: всей общиной
  rationale: עֵדָה обозначает собранное сообщество Израиля. «Община» передаёт коллективный смысл и остаётся понятной современному читателю.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: дай ему поручение
  rationale: Хотя צוה обычно значит «повелевать», в сцене публичного поставления выражение указывает на наделение Иисуса Навина ответственным поручением. Формулировка сохраняет властный и официальный характер действия, не уточняя содержание поручения сверх текста.
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Буквально «перед их глазами»; современная русская идиома подчёркивает публичность и засвидетельствованный характер действия.
theological_decisions:
- issue: Публичное вручение Иисусу Навину полномочий
  choice: Передать וְצִוִּיתָה אֹתוֹ как «дай ему поручение»
  alternative: «повели ему» или «дай ему наставления»
  rationale: Контекст описывает официальное действие перед Елеазаром и всей общиной. «Дай ему поручение» отражает публичное вверение ответственности, но не превращает его в более специальный богословский обряд, прямо не названный в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. Повелительные формы естественно продолжают Божье обращение к Моисею. Маркер сноски поставлен непосредственно после спорного выражения.
