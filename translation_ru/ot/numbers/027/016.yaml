  variant: modern literary Russian
source:
  edition: WLC
  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: ru
  text: Да поставит Яхве[a], Бог духов всякой плоти[b], человека над общиной[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В традиционном переводе: «Господь». В еврейском тексте стоит личное имя Бога — יהוה (Яхве).'
    reason: lexical_alternative
  - marker: b
    text: «Всякая плоть» — библейское выражение о живых существах в их телесности и смертности; здесь речь прежде всего о людях.
    reason: cultural_note
  - marker: c
    text: 'Или: «над собранием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: да поставит
  rationale: В сочетании с человеком как прямым дополнением и оборотом «над общиной» глагол פקד означает назначение на руководящее служение. Конструкция с «да» естественно передаёт молитвенное пожелание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепонятна в современной русской библейской речи.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: Бог духов
  rationale: Формально сохранён необычный божественный титул, встречающийся также в Числах 16:22; множественное число «духов» не сведено к нравам, характерам или дыханию.
- source_word: לְכָל בָּשָׂר
  choice: всякой плоти
  rationale: Сохранён библейский образ, обозначающий живых существ в их телесности и смертности; в данном контексте он прежде всего относится к людям.
- source_word: אִישׁ
  choice: человека
  rationale: Контекст требует одного конкретного руководителя-мужчины, однако русское «человека» здесь естественнее, чем стилистически двусмысленное «мужа», и не устраняет референта мужского пола.
- source_word: עַל הָעֵדָה
  choice: над общиной
  rationale: עֵדָה обозначает организованное собрание, то есть общину Израиля. «Община» звучит современно и сохраняет коллективный, заветный характер обозначения.
theological_decisions:
- issue: Передача личного имени יְהוָה в молитвенном пожелании
  choice: Да поставит Яхве...
  alternative: Пусть Господь... поставит...
  rationale: Исходный текст прямо употребляет тетраграмматон. Транслитерация сохраняет личное имя, а частица «да» передаёт просительный оттенок формы יִפְקֹד.
- issue: Смысл выражения «Бог духов всякой плоти»
  choice: Сохранить выражение буквально и не уточнять природу «духов» в основном тексте
  alternative: Бог, дающий дух всем людям
  rationale: Еврейская конструкция допускает богословски насыщенное понимание Божьей власти и знания о внутренней жизни созданий, но не формулирует явно действие «дающий». Добавление такого глагола неоправданно сняло бы смысловую напряжённость.
- issue: Родовая отнесённость אִישׁ
  choice: человека
  alternative: мужа
  rationale: Хотя אִישׁ имеет мужской род и далее речь идёт об Иисусе Навине, в современном русском «поставить человека над общиной» естественно обозначает назначение отдельного лица и не требует архаического «мужа».
translation_notes:
  register: Современный литературный русский с умеренно торжественной молитвенной конструкцией «да поставит». Сохранены характерные библейские выражения «Бог духов» и «всякая плоть», а их возможная непрозрачность пояснена в сносках. Запятая в конце показывает, что синтаксическая фраза продолжается в следующем стихе.
