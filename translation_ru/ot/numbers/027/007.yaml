base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: ru
  text: Дочери Салпаада говорят справедливо[a]. Непременно дай им[b] наследственный удел среди братьев их отца и передай им наследство их отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дочери Салпаада говорят верно». Здесь Бог признаёт их требование справедливым и обоснованным.'
    reason: lexical_alternative
  - marker: b
    text: В древнееврейском слове, переведённом здесь как «им», неожиданно употреблено окончание мужского рода во множественном числе, хотя по контексту речь идёт о дочерях Салпаада.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: говорят справедливо
  rationale: Сочетание наречия כֵּן с причастием דֹּבְרֹת буквально утверждает, что дочери говорят верно. В судебном контексте это означает признание обоснованности их требования; русский оборот сохраняет и речь, и юридическую оценку.
- source_word: נָתֹן תִּתֵּן
  choice: непременно дай
  rationale: Инфинитив абсолютный при личной форме того же глагола усиливает повеление. «Непременно дай» естественно передаёт его обязательность и эмфазу.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: наследственный удел
  rationale: Сочетание обозначает земельное владение, получаемое как наследство. «Наследственный удел» кратко и естественно выражает обе составляющие.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: среди братьев их отца
  rationale: Фраза помещает удел дочерей внутри родового надела братьев их отца. Формулировка следует структуре древнееврейского текста и остаётся понятной по-русски.
- source_word: וְהַעֲבַרְתָּ
  choice: и передай
  rationale: Порода hифиль глагола עבר здесь имеет юридический смысл перехода наследства к другому владельцу. «Передай» естественно выражает это административно-правовое действие.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: наследство их отца
  rationale: Речь идёт об уделе, принадлежавшем умершему отцу и переходящем его дочерям; формулировка точно сохраняет семейно-правовую связь.
