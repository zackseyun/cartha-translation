lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой глагола продолжает повествование; обычное русское «И сказал» естественно передаёт связь с предшествующим контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание последующей речи; в современном русском эту функцию естественно выполняет двоеточие, тогда как буквальное «говоря» здесь звучало бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя; транслитерация сохраняет его отличие от титула «Господь».
translation_notes:
  register: Современный литературный русский; краткая и достойная повествовательная формула. Синтаксическая функция לֵאמֹר передана двоеточием перед прямой речью следующего стиха.
