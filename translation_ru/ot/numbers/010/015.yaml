lexical_decisions:
- source_word: וְעַל
  choice: А над
  rationale: Союз וְ связывает стих с предшествующим перечнем, а עַל в этой формуле указывает на поставленного во главе подразделения. «А над» сохраняет и связь, и краткую именную конструкцию еврейского текста.
- source_word: צְבָא
  choice: отрядом
  rationale: В контексте порядка выступления речь идёт об организованном племенном подразделении. «Отряд» естественно передаёт эту функцию и не усиливает без необходимости собственно боевой оттенок слова.
- source_word: מַטֵּה
  choice: колена
  rationale: Здесь слово обозначает племя Израиля, а не буквальный жезл; «колено» соответствует принятой русской библейской терминологии.
- source_word: בְּנֵי יִשָׂשכָר
  choice: сынов Иссахара
  rationale: Передаёт буквальную родовую формулу «сыны Иссахара» и естественно сочетается с выражением «колено сынов Иссахара».
- source_word: נְתַנְאֵל
  choice: Нафанаил
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
- source_word: בֶּן צוּעָר
  choice: сын Цуара
  rationale: Прямо и естественно передаёт еврейскую патронимическую конструкцию.
