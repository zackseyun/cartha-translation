  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: ru
  text: И они впервые отправились в путь по повелению Яхве, переданному через Моисея[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея» — еврейское выражение, означающее посредничество или действие через уполномоченного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились в путь
  rationale: Глагол נסע в повествовании о переходах обозначает снятие с места и начало движения; это выражение естественно передаёт начальный характер действия.
- source_word: בָּרִאשֹׁנָה
  choice: впервые
  rationale: Наречная форма указывает на первый, начальный переход Израиля от Синая.
- source_word: עַל פִּי
  choice: по повелению
  rationale: Буквально «по устам»; устойчивое выражение означает действие согласно повелению или указанию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму, непосредственно присутствующую в еврейском тексте.
- source_word: בְּיַד מֹשֶׁה
  choice: переданному через Моисея
  rationale: Буквально «рукой Моисея»; оборот обозначает посредничество или действие через уполномоченного. Добавление «переданному» естественно связывает его с повелением, не устраняя посреднической роли Моисея.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Роль Моисея в выражении בְּיַד מֹשֶׁה
  choice: повеление передано через Моисея
  alternative: рукой Моисея; посредством Моисея
  rationale: Формулировка сохраняет посредническое значение идиомы, не утверждая сверх текста более точного способа передачи повеления.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Союз «И» сохранён как связь с предшествующим рассказом; буквальные семитские идиомы раскрыты в основном тексте и сноске.
