lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в формуле введения прямой речи означает речевое действие; по-русски «сказал» естественно вводит последующие слова и не требует тяжеловесного «говорил… говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив לאמר вводит содержание прямой речи; в современном русском перед последующей репликой эту функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет это имя и представляет наиболее принятую научную реконструкцию произношения; титул «Господь» скрыл бы различие между именем и титулом.
translation_notes:
  register: Современный литературный русский, краткая и достоинственная повествовательная формула. Еврейское «говорил… говоря» передано естественной русской конструкцией «сказал…:». Маркер сноски поставлен непосредственно после имени, к которому относится.
