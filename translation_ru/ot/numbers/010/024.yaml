lexical_decisions:
- source_word: וְעַל
  choice: А над
  rationale: Союз продолжает перечень порядка движения, а предлог указывает на руководство данным подразделением.
- source_word: צְבָא
  choice: войском
  rationale: Здесь слово обозначает организованное подразделение в походном строю; «войско» сохраняет военный оттенок, не сводя значение к участию в сражении.
- source_word: מַטֵּה
  choice: племени
  rationale: В данном контексте это название родоплеменной единицы Израиля, а не буквального посоха.
- source_word: בְּנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Формальный перевод сохраняет еврейскую родословную формулу и соответствует возвышенному повествовательному регистру.
- source_word: אֲבִידָן
  choice: Авидан
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בֶּן גִּדְעוֹנִי
  choice: сын Гидеония
  rationale: Естественная русская передача патронимической формулы с традиционной формой имени.
