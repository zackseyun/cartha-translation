source:
  edition: WLC
  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: ru
  text: 'Когда ковчег отправлялся в путь[a], Моисей говорил: «Восстань, Яхве[b], и да рассеются Твои враги, да бегут от Тебя ненавидящие Тебя!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «И было, когда ковчег отправлялся в путь». Здесь еврейский оборот, вероятно, описывает то, что происходило всякий раз при выступлении ковчега.'
    reason: lexical_alternative
  - marker: b
    text: «Восстань» — образный призыв к Яхве выступить и явить Свою силу, а не указание на то, что Бог буквально лежал или бездействовал.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Когда ... отправлялся в путь
  rationale: Конструкция вводит повторявшееся обстоятельство; несовершенный вид «отправлялся» естественно передаёт значение «всякий раз, когда», не перегружая русский текст.
- source_word: הָאָרֹן
  choice: ковчег
  rationale: В еврейском тексте стоит просто «ковчег»; уточнение «ковчег завета» было бы контекстуальным добавлением.
- source_word: קוּמָה
  choice: Восстань
  rationale: Императив сохраняет яркий образ призыва к Богу выступить и явить Свою силу; литературное «восстань» уместно в торжественной молитвенной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: וְיָפֻצוּ
  choice: и да рассеются
  rationale: Имперфект после повелительной формы имеет желательное значение; частица «да» передаёт молитвенное прошение.
- source_word: אֹיְבֶיךָ
  choice: Твои враги
  rationale: Прямое и естественное соответствие форме с местоименным суффиксом второго лица.
- source_word: וְיָנֻסוּ
  choice: да бегут
  rationale: Форма продолжает ряд волитивных просьб; «да бегут» сохраняет параллелизм и динамику оригинала.
- source_word: מְשַׂנְאֶיךָ
  choice: ненавидящие Тебя
  rationale: Причастная форма описывает людей по их устойчивому отношению к Яхве; русское причастие близко передаёт эту характеристику.
- source_word: מִפָּנֶיךָ
  choice: от Тебя
  rationale: В данном контексте выражение означает бегство прочь перед лицом Божьего наступления; «от Тебя» естественно по-русски и не требует буквального воспроизведения идиомы «от лица Твоего».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное Божье имя и не подменяет его титулом.
- issue: Смысл повеления קוּמָה, обращённого к Богу
  choice: Восстань
  alternative: Встань; поднимись
  rationale: Это образный призыв к Яхве начать могущественно действовать, а не утверждение о буквальной неподвижности или бездействии Бога.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным оттенком. Прописные местоимения в обращении к Богу использованы как принятая русская почтительная норма. Параллелизм двух пожеланий сохранён.
