  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: ru
  text: Затем двинулся стан сынов Ефрема под своим знаменем[a], по своим отрядам[b]; во главе его отряда стоял Елисама, сын Аммиуда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «знамя стана». Еврейское слово обозначает племенное знамя, под которым стан двигался в походном порядке.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по своим ополчениям». Имеются в виду организованные группы стана, выстроенные в походном порядке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Затем двинулся
  rationale: Форма продолжает последовательность событий; «затем» естественно передаёт повествовательную связь, а «двинулся» соответствует контексту выступления в путь.
- source_word: דֶּגֶל מַחֲנֵה
  choice: стан ... под своим знаменем
  rationale: Еврейское выражение буквально говорит о «знамени стана», выступающем в путь, но метонимически обозначает весь стан, объединённый под этим знаменем. Русская конструкция передаёт образ ясно и естественно.
- source_word: בְנֵי אֶפְרַיִם
  choice: сынов Ефрема
  rationale: Сохранена исходная форма обычного родоплеменного обозначения, без замены на более обобщённые «народ» или «потомки».
- source_word: לְצִבְאֹתָם
  choice: по своим отрядам
  rationale: צָבָא здесь обозначает организованные группы, составляющие походный порядок; «отряды» передают военную организованность, не утверждая, что речь непременно идёт о сражении.
- source_word: וְעַל צְבָאוֹ
  choice: во главе его отряда стоял
  rationale: Передана руководящая роль, выраженная предлогом עַל, и сохранено единственное число слова «отряд» с местоименной отсылкой к стану Ефрема.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Елисама, сын Аммиуда
  rationale: Имена переданы в принятой русской библейской форме; родственная связь выражена прямо.
