  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: ru
  text: И облако Яхве было над ними днём, когда они выступали из стана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «было на них днём».'
    reason: 'Лексическая альтернатива для עֲלֵיהֶם: предлог עַל может означать как положение «над», так и «на» ком-либо.'
lexical_decisions:
- source_word: וַעֲנַן
  choice: И облако
  rationale: Союз ו сохраняет связь с предыдущим повествованием; עָנָן означает «облако». Определённость естественно передана сочетанием с именем Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: עֲלֵיהֶם
  choice: было над ними
  rationale: Предлог עַל здесь обозначает положение сверху; «над ними» естественно передаёт пространственный смысл, не исключая защитного оттенка контекста.
- source_word: יוֹמָם
  choice: днём
  rationale: Наречная форма означает «днём, в дневное время»; краткое русское «днём» точно и естественно.
- source_word: בְּנָסְעָם
  choice: когда они выступали
  rationale: Инфинитив נסע с בְּ имеет временное значение и описывает снятие с места и начало движения; «выступали» уместно в контексте движения стана.
- source_word: מִן הַמַּחֲנֶה
  choice: из стана
  rationale: מַחֲנֶה означает «стан, лагерь»; «стан» сохраняет библейскую торжественность и при этом остаётся понятным современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон, тогда как «Господь» заменяет имя титулом.
- issue: Характер положения облака по отношению к народу
  choice: над ними
  alternative: на них
  rationale: Исходный предлог допускает значения «над» и «на». В данном пространственном контексте «над ними» звучит естественнее, но альтернативный вариант отмечен, чтобы не устранять лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Выступали из стана» передаёт начало пути и сохраняет лаконичность оригинала.
