  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: ru
  text: 'Он сказал: «Прошу, не оставляй нас, ведь ты знаешь, где нам становиться лагерем в пустыне, и будешь для нас глазами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть будешь нашим проводником благодаря знанию пустыни.
    reason: Поясняет сохранённую метафору «быть глазами», не заменяя её в основном тексте.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Стандартная повествовательная форма с подразумеваемым подлежащим; русский перевод сохраняет связь с контекстом, не добавляя имени, которого нет в стихе.
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: Прошу, не оставляй нас
  rationale: אַל выражает запрет, а נָא — настойчивую вежливую просьбу. «Не оставляй» естественно для ситуации совместного пути и не усиливает смысл до «не покидай навсегда».
- source_word: כִּי עַל כֵּן
  choice: ведь
  rationale: Оборот вводит основание просьбы. «Ведь» естественно передаёт причинно-пояснительную связь и просительный тон.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: ты знаешь, как нам располагаться станом в пустыне
  rationale: חֲנֹתֵנוּ буквально обозначает наше расположение станом/становление лагерем и допускает оттенок способа или мест стоянок. Формулировка передаёт практическое знание пустыни, не сводя его исключительно к выбору конкретных мест.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: и будешь для нас глазами
  rationale: Сохранена выразительная еврейская метафора «быть для нас глазами», подразумевающая наблюдение и руководство благодаря знанию местности.
