  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: ru
  text: 'Моисей сказал Ховаву, сыну Рагуила-мадианитянина, родственнику Моисея по браку[a]: «Мы отправляемся к тому месту, о котором Яхве сказал: „Я отдам его вам“. Иди с нами, и мы сделаем тебе добро, потому что Яхве сказал о благе для Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское חֹתֵן может обозначать родственника по браку вообще; здесь возможны также переводы «тесть Моисея» или «шурин Моисея».
    reason: Сохраняет лексическую и генеалогическую неоднозначность термина חֹתֵן, не навязывая точную степень родства.
lexical_decisions:
- source_word: חֹבָב
  choice: Ховав
  rationale: Принята близкая к древнееврейскому звучанию передача личного имени, соответствующая современной русской библейской традиции.
- source_word: רְעוּאֵל
  choice: Рагуил
  rationale: Использована укоренившаяся в русском библейском употреблении форма имени.
- source_word: הַמִּדְיָנִי
  choice: мадианитянина
  rationale: Определённая форма этнонима относится к Рагуилу и естественно включается в конструкцию «сын мадианитянина Рагуила».
- source_word: חֹתֵן מֹשֶׁה
  choice: родственнику Моисея по браку
  rationale: חֹתֵן обозначает свойственника и допускает более узкое значение «тесть». Нейтральная формулировка сохраняет неоднозначность родственной связи, не разрешая её вопреки тексту.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Мы отправляемся
  rationale: Причастие с местоимением выражает начавшееся или непосредственно предстоящее движение; эта формулировка естественна по-русски.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: 'о котором Яхве сказал: «Я отдам его вам»'
  rationale: Сохранены относительная конструкция, прямая речь и множественное число адресата; «его» соотнесено с местом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְכָה אִתָּנוּ
  choice: Иди с нами
  rationale: Глагол הלך буквально и контекстуально означает «иди»; приглашение звучит естественно в русском языке.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: и мы сделаем тебе добро
  rationale: Сохранена связь с повторяющимся в конце стиха словом טוֹב и выражена направленность действия на благо Ховава.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: Яхве обещал добро Израилю
  rationale: В контексте божественного обещания דִּבֶּר передаёт не просто благоприятную речь, а объявленное Израилю благо; «обещал» естественно выражает эту прагматику.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Точная родственная связь, выраженная חֹתֵן מֹשֶׁה
  choice: родственник Моисея по браку
  alternative: тесть Моисея; шурин Моисея
  rationale: Семантический диапазон חֹתֵן и повествовательный контекст не позволяют бесспорно установить более узкую связь. Основной текст сохраняет подлинную неоднозначность, а примечание сообщает традиционные варианты.
- issue: Характер благого слова Яхве об Израиле
  choice: обещал добро Израилю
  alternative: сказал добро об Израиле
  rationale: Формулировка понимается как действенное благоприятное обещание Бога, однако не уточняет его содержание и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; имя Яхве передано последовательно. Повтор слова «добро» намеренно сохраняет лексическую связь двух древнееврейских выражений.
