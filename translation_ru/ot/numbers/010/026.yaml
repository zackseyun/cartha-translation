    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Над
  rationale: Предлог עַל обозначает положение начальника «над» отрядом; союз וְ продолжает перечень, но в самостоятельном русском стихе не требует отдельного «и».
- source_word: צְבָא
  choice: отряд
  rationale: В контексте порядка движения стана слово обозначает организованное племенное подразделение; «отряд» естественно по-русски и не сужает значение до войска в бою.
- source_word: מַטֵּה
  choice: племя
  rationale: Здесь слово обозначает племенную общность, а не буквальный посох.
- source_word: בְּנֵי אָשֵׁר
  choice: сыновей Асира
  rationale: Сохранена буквальная форма племенного наименования «сыны Асира», естественно встроенная в родительный оборот.
- source_word: פַּגְעִיאֵל
  choice: Пагиил
  rationale: Имя передано традиционной русской библейской формой.
- source_word: בֶּן עָכְרָן
  choice: сын Охрана
  rationale: Еврейский патронимический оборот естественно передан словом «сын»; имя транслитерировано в принятой русской библейской форме.
