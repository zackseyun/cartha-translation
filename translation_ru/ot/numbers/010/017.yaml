  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: ru
  text: Затем скиния была снята, и выступили сыновья Гирсона и сыновья Мерари, несшие скинию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  choice: разобрали
  rationale: Хофал глагола ירד здесь описывает снятие скинии из установленного состояния перед переходом. «Разобрали» естественно по-русски передаёт действие в данном контексте, хотя буквально форма ближе к «была снята».
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское обозначение переносного святилища Израиля; сохраняет культовый смысл מִשְׁכָּן.
- source_word: וְנָסְעוּ
  choice: выступили
  rationale: В контексте передвижения стана נסע означает сняться с места и отправиться в путь; «выступили» кратко и естественно передаёт начало перехода.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: сыновья Гирсона
  rationale: Сохраняет буквальное родовое выражение «сыновья Гирсона», не заменяя его названием клана.
- source_word: וּבְנֵי מְרָרִי
  choice: сыновья Мерари
  rationale: Сохраняет параллельную исходную конструкцию и форму имени.
- source_word: נֹשְׂאֵי
  choice: нёсшие
  rationale: Причастие обозначает выполняемую ими обязанность — переносить скинию во время пути.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: Исходный текст повторяет существительное и не уточняет «части скинии», поэтому такое уточнение не добавлено.
