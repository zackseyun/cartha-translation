  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: ru
  text: 'А когда ковчег останавливался, Моисей говорил: «Вернись, Яхве[a], к мириадам тысяч Израиля[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит личное имя Бога יהוה (ЙХВХ), переданное здесь как «Яхве».
    reason: divine_name
  - marker: b
    text: 'Буквально: «к мириадам тысяч Израиля». Это усилительное выражение, подчёркивающее огромную численность народа.'
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: А когда ковчег останавливался
  rationale: Предлог ב с инфинитивом образует временную конструкцию «когда он останавливался». Подлежащее «ковчег» восстановлено из непосредственного контекста; несовершенный вид естественно передаёт повторяющееся действие во время переходов.
- source_word: יֹאמַר
  choice: Моисей говорил
  rationale: 'Имперфект здесь имеет повторительное значение: эти слова Моисей произносил всякий раз, когда ковчег останавливался. Имя говорящего восстановлено из предыдущего стиха во избежание неясного русского местоимения.'
- source_word: שׁוּבָה
  choice: Вернись
  rationale: Повелительная форма שוב с парагогическим ה выражает прямое обращение с просьбой возвратиться. Перевод не уточняет сверх текста, идёт ли речь о возвращении после шествия или об обращении к народу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» соответствует распространённой научной передаче тетраграмматона в современном русском языке.
- source_word: רִבְבוֹת אַלְפֵי יִשְׂרָאֵל
  choice: к бесчисленным тысячам Израиля
  rationale: Сочетание двух обозначений больших чисел имеет усилительный характер. Естественная русская формулировка передаёт огромную численность народа, а буквальное построение сохранено в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Его транслитерация сохраняет различие между именем и титулом, не вводя конфессиональной замены.
- issue: Смысл просьбы שׁוּבָה
  choice: Вернись
  alternative: Обратись; возвратись и пребывай
  rationale: Краткое «вернись» сохраняет прямой смысл глагола и напряжение текста, не добавляя толкования о характере или длительности Божьего присутствия.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Повторяющийся характер действий передан несовершенным видом; буквально тяжеловесное сочетание числительных вынесено в примечание.
