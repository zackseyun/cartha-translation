  text: А во главе войска племени сыновей Завулона был Елиав, сын Хелона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ополчения» или «подразделения»; еврейское צְבָא обозначает организованный племенной контингент в походном строю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: А во главе
  rationale: Союз וְ связывает этот пункт с предыдущим перечислением, а עַל при подразумеваемом глаголе власти указывает на руководство. По-русски формула «а во главе… был» естественно передаёт и связь, и начальственное положение.
- source_word: צְבָא
  choice: ополчение
  rationale: В контексте походного порядка слово обозначает организованный племенной контингент, способный выступить в поход. «Ополчение» сохраняет военный оттенок, не представляя его как постоянную профессиональную армию.
- source_word: מַטֵּה
  choice: племя
  rationale: Здесь слово употреблено в обычном социально-политическом значении «племя», а не в буквальном значении «посох».
- source_word: בְּנֵי זְבוּלֻן
  choice: сыновей Завулона
  rationale: Сохранено буквальное родовое выражение «сыны Завулона», которое в этой формуле обозначает членов и потомков племени; форма «сыновей» естественно входит в русское сочетание «племени сыновей Завулона».
- source_word: אֱלִיאָב
  choice: Елиав
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן חֵלֹן
  choice: сын Хелона
  rationale: Прямая и естественная передача еврейской патронимической конструкции.
