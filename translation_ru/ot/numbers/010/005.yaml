    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Когда вы протрубите
  rationale: Форма с союзом вводит условно-временную инструкцию; по-русски естественно передать её придаточным времени. Глагол תקע в контексте труб означает «трубить, подавать звук трубой».
- source_word: תְּרוּעָה
  choice: тревожный сигнал
  rationale: Здесь слово обозначает особый вид трубного сигнала, служивший командой к выступлению, а не просто громкий звук или человеческий крик.
- source_word: וְנָסְעוּ
  choice: пусть выступят
  rationale: Глагол נסע при описании движения стана означает сняться с места и отправиться в путь. «Пусть выступят» естественно передаёт предписывающий смысл контекста.
- source_word: הַמַּחֲנוֹת
  choice: станы
  rationale: Множественное число относится к организованным группам израильского лагеря; традиционно понятное русское «станы» сохраняет прямой образ исходного текста.
- source_word: הַחֹנִים
  choice: расположенные
  rationale: Причастие описывает занимаемое станами место. «Расположенные» ясно и без тяжеловесного повтора передаёт статическое значение.
- source_word: קֵדְמָה
  choice: с восточной стороны
  rationale: В данном контексте форма указывает не направление движения, а местоположение станов к востоку от святилища.
