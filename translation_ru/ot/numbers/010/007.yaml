  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: ru
  text: Когда же созываете общину, трубите, но не подавайте тревожного сигнала.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не трубите тревогу». Еврейский текст противопоставляет обычный трубный звук особому тревожному сигналу, который в ближайшем контексте служит знаком к выступлению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַקְהִיל
  choice: Когда же созываете
  rationale: 'Предлог בְּ с инфинитивом породы hифиль передаёт временное обстоятельство: «когда созываете». Частица «же» естественно выражает противопоставление сигналу к выступлению в предыдущем стихе.'
- source_word: הַקָּהָל
  choice: общину
  rationale: קָהָל здесь обозначает собранное сообщество Израиля. «Община» передаёт не только отдельное собрание, но и народ как созываемое целое.
- source_word: תִּתְקְעוּ
  choice: трубите
  rationale: В данном контексте תקע означает трубить в серебряные трубы. Русский глагол естественно подразумевает названный ранее инструмент, не добавляя отсутствующего в стихе существительного.
- source_word: וְלֹא תָרִיעוּ
  choice: но не подавайте тревожного сигнала
  rationale: Глагол הֵרִיעַ в контексте труб обозначает особый тревожный сигнал, служивший знаком к выступлению. Формулировка сохраняет противопоставление обычного трубного звука и отличительного сигнала тревоги.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой распорядительной формой. Сохранено различие между обычным трублением при созыве общины и особым тревожным сигналом; подразумеваемое слово «трубы» в основной текст не добавлено.
