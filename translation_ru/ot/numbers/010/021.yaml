  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: ru
  text: Затем каафиты отправились в путь, неся священные предметы[a], а скиния была установлена до их прибытия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «неся святилище» или «носители святилища»; здесь имеются в виду священные предметы и принадлежности, которые несли каафиты, в отличие от конструкции скинии, упомянутой далее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Затем ... отправились в путь
  rationale: Союз וַ/וְ продолжает последовательность событий походного повествования; «затем» естественно передаёт эту связь, а «отправились в путь» соответствует значению נסע в контексте движения стана.
- source_word: הַקְּהָתִים
  choice: каафиты
  rationale: Обычное русское обозначение рода потомков Каафа.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: неся священные предметы
  rationale: Буквально выражение означает «носители святилища», но в данном контексте метонимически указывает на священные принадлежности, порученные каафитам; саму конструкцию скинии несли другие левитские роды.
- source_word: הַמִּקְדָּשׁ
  choice: священные предметы
  rationale: מִקְדָּשׁ буквально может означать «святилище»; здесь контекст следующей части стиха указывает на предметы святилища. Сноска сохраняет буквальную форму и подлинную метонимию.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: Скиния должна была быть установлена
  rationale: Еврейский глагол имеет активную форму 3-го лица множественного числа без явно названного подлежащего. По контексту устанавливать скинию предстояло левитам, вышедшим прежде каафитов; безлично-пассивная русская конструкция не приписывает это действие самим каафитам и передаёт упреждающую цель порядка движения.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшийся и точный русский термин для переносного жилища-святилища в пустыне.
- source_word: עַד בֹּאָם
  choice: до их прибытия
  rationale: Буквально «до их прихода»; местоимение относится к каафитам, прибывавшим со священными предметами.
theological_decisions:
- issue: Кто устанавливает скинию
  choice: 'Не называть подлежащее и перевести: «Скиния должна была быть установлена»'
  alternative: «Они установили скинию»
  rationale: 'Форма וְהֵקִימוּ активна и множественна, но подлежащее не выражено. Ближайшие каафиты не могут быть автоматически приняты за исполнителей: согласно порядку движения в контексте, конструкцию несли и заранее устанавливали другие левиты. Выбранная формулировка сохраняет контекстуальный смысл, не вводя ошибочной агентности.'
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими терминами «каафиты» и «скиния». Формулировка сохраняет достоинство повествования, разъясняет контекстуальную метонимию и не создаёт ложного впечатления, будто каафиты устанавливали скинию.
