  text: וְ/תָקְע֖וּ בָּ/הֵ֑ן וְ/נֽוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: ru
  text: Когда затрубят в обе трубы[a], вся община соберётся к тебе у входа в Шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И затрубят в них, и вся община соберётся к тебе».'
    reason: 'Сохраняется формальная альтернатива: еврейское сочинение допускает более буквальную последовательность будущих действий, тогда как основной текст естественно передаёт временной смысл указания.'
lexical_decisions:
- source_word: וְתָקְעוּ בָּהֵן
  choice: Когда затрубят в обе трубы
  rationale: 'В контексте последовательных указаний форма передаёт временное условие: звук двух серебряных труб служит сигналом к собранию. Предлог с местоимением естественно раскрыт по-русски как «в обе трубы»; референт — две трубы из предыдущего стиха.'
- source_word: וְנוֹעֲדוּ
  choice: соберётся
  rationale: Нифаль глагола יעד здесь обозначает сбор общины по назначенному сигналу; единственное число согласуется с собирательным существительным «община».
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: Сохранено прямое пространственно-личное значение еврейского выражения без замены на более толковательное «перед тобой».
- source_word: כָּל הָעֵדָה
  choice: вся община
  rationale: «Община» естественно и устойчиво передаёт עֵדָה как совокупность народа Израиля; «вся» выражает כָּל.
- source_word: פֶּתַח
  choice: у входа
  rationale: Сочетание «у входа» естественно обозначает место собрания возле входа в шатёр.
- source_word: אֹהֶל מוֹעֵד
  choice: Шатёр встречи
  rationale: Передаёт традиционное культовое наименование и сохраняет смысл назначенной встречи, заложенный в מוֹעֵד; прописная буква отмечает уникальное священное сооружение.
