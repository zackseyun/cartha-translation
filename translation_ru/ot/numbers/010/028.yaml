lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное местоимение во вводной итоговой формуле; «вот» естественно передаёт предъявление перечисленного без добавления отсутствующей в еврейском связки.
- source_word: מַסְעֵי
  choice: переходы
  rationale: Форма множественного числа в сопряжённом состоянии от מַסָּע обозначает этапы пути или перемещения; «переходы» точно и естественно для контекста походного движения.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено буквальное родственное обозначение, которое здесь служит традиционным именованием народа; падеж обусловлен конструкцией «переходы сынов Израиля».
- source_word: לְצִבְאֹתָם
  choice: по их отрядам
  rationale: Слово צְבָאוֹת указывает на организованные походные подразделения; «отряды» передаёт упорядоченную структуру, не утверждая непосредственного участия в бою.
- source_word: וַיִּסָּעוּ
  choice: И они двинулись в путь
  rationale: Глагол נסע в повествовании означает сняться с места и отправиться дальше; выражение естественно передаёт начало движения.
