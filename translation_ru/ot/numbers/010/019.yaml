    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: А над
  rationale: В контексте порядка движения עַל указывает на начальника, поставленного над племенным подразделением; «а над» сохраняет повторяющуюся структуру соседних стихов.
- source_word: צְבָא
  choice: ополчением
  rationale: Здесь слово обозначает организованное племенное подразделение Израиля, способное выступать в поход; «ополчение» передаёт военную окраску, не подразумевая постоянной профессиональной армии.
- source_word: מַטֵּה
  choice: племени
  rationale: В контексте исчисления и расположения стана слово имеет обычное значение «племя».
- source_word: בְּנֵי שִׁמְעוֹן
  choice: сынов Симеона
  rationale: Сохранена буквальная и традиционно понятная формула племенной принадлежности.
- source_word: שְׁלֻמִיאֵל
  choice: Шелумиил
  rationale: Имя передано русской библейской транслитерацией, достаточно близкой к еврейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Прямое указание на отца естественно и точно передаётся словом «сын».
- source_word: צוּרִי שַׁדָּי
  choice: Цуришаддая
  rationale: Составное личное имя передано как единое имя в форме родительного падежа после слова «сын».
