  naturalness: Исходная конструкция «над ополчением племени сынов Симеона — Шелумиил» понятна, но звучит тяжеловесно и неполно как самостоятельное современное русское предложение. «Во главе войска потомков Симеона стоял...» литературно естественнее. Слово «ополчение» в современном употреблении может вызывать ненужную ассоциацию с нерегулярным народным формированием.
  terminology: «Войско» адекватно передаёт צָבָא как организованный племенной контингент, не навязывая более узкое значение профессиональной армии. «Потомки Симеона» — естественная русская передача устойчивого племенного обозначения «сыновья Симеона», без утверждения, что речь идёт только о мужчинах. Формы имён «Шелумиил» и «Цуришаддая» сохранены.
