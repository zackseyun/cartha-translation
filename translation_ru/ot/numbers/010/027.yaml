    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Над … стоял
  rationale: Союз וְ продолжает перечень, а עַל обозначает поставленного над подразделением начальника. Русская конструкция «над … стоял» естественно передаёт эту повторяющуюся формулу руководства.
- source_word: צְבָא
  choice: ополчением
  rationale: В данном контексте слово обозначает организованный племенной контингент в походном строю, а не обязательно постоянную общенациональную армию. «Ополчение» сохраняет военный оттенок и подходит к племенной организации Израиля.
- source_word: מַטֵּה
  choice: колена
  rationale: Здесь מַטֵּה означает племя как составную часть Израиля; традиционное русское библейское слово «колено» точно и понятно передаёт этот смысл.
- source_word: בְּנֵי נַפְתָּלִי
  choice: сынов Неффалима
  rationale: Сохранено буквальное родовое выражение «сыны Неффалима», которое в этой формуле обозначает его потомков и всё соответствующее колено.
- source_word: אֲחִירַע
  choice: Ахира
  rationale: Имя передано в принятой русской библейской форме.
- source_word: בֶּן עֵינָן
  choice: сын Енана
  rationale: Кратко и естественно передана обычная еврейская патронимическая конструкция.
