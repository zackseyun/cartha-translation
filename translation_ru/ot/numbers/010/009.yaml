source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: ru
  text: И когда в своей земле вы выйдете на войну против врага, который притесняет вас,[a] подайте трубами сигнал тревоги. Тогда вы будете вспомянуты перед Яхве, вашим Богом,[b][c] и будете спасены от своих врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И если в своей земле вы выйдете на войну». Еврейский союз может вводить как условие, так и описание ситуации.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и вы будете вспомянуты перед Яхве, вашим Богом»; по смыслу возможно: «Яхве, ваш Бог, вспомнит о вас».'
    reason: lexical_alternative
  - marker: c
    text: «Яхве» передаёт еврейское личное имя Бога — יהוה (ЙХВХ).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: И когда
  rationale: В данном наставлении сочетание может вводить как условие, так и будущую ситуацию. «И когда» естественно продолжает предыдущие предписания; условный оттенок отмечен в сноске.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: вы выйдете на войну
  rationale: Еврейское выражение означает вступление в военные действия. Русское «выйдете на войну» передаёт идиому естественно, не сводя её к отдельному сражению.
- source_word: בְּאַרְצְכֶם
  choice: в своей земле
  rationale: Слово אֶרֶץ обозначает принадлежащую Израилю землю или территорию; «земля» сохраняет территориальный и заветный оттенок.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: против врага, который притесняет вас
  rationale: Сочетание существительного צַר и причастия צֹרֵר представляет врага как активно враждующего и причиняющего бедствие. Придаточное сохраняет обе смысловые составляющие.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: подайте трубами сигнал тревоги
  rationale: Порода Hiphil глагола רוע в контексте труб означает тревожный сигнальный звук, а не просто громкое трубление.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: о вас вспомнят перед Яхве, вашим Богом
  rationale: Безличная русская конструкция естественно передаёт пассивную форму נזכרתם и не делает Бога явным грамматическим субъектом там, где еврейский текст его не называет.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וְנוֹשַׁעְתֶּם
  choice: вы будете спасены
  rationale: Пассивная форма от ישׁע означает спасение или избавление; «спасены» точно передаёт форму и сохраняет более широкий богословский смысл.
- source_word: מֵאֹיְבֵיכֶם
  choice: от своих врагов
  rationale: אֹיֵב — обычное обозначение врага; возвратное местоимение естественно соотносит врагов с подлежащим русского предложения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл пассивной формы וֲנִזְכַּרְתֶּם
  choice: о вас вспомнят перед Яхве, вашим Богом
  alternative: Яхве, ваш Бог, вспомнит о вас
  rationale: 'Основной текст сохраняет пассивность и присущую оригиналу напряжённость: Израиль оказывается в памяти перед Богом, но Бог не вводится в предложение как прямо названный субъект глагола.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис упрощён до двух предложений для ясности; сохранены военный контекст, образ трубного сигнала и намеренно пассивная формулировка о воспоминании перед Богом.
