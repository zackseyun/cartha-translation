  source_fidelity: 'Основной смысл передан точно: речь о военных действиях на собственной земле против притесняющего врага, тревожном трубном сигнале, воспоминании перед Яхве и избавлении от врагов. Однако «о вас вспомнят перед Яхве» в русском языке легко подразумевает неназванных людей, вспоминающих об израильтянах в присутствии Яхве, тогда как еврейская пассивная форма сохраняет самих адресатов как тех, кто будет приведён к памяти перед Богом.'
  naturalness: «В своей земле», «выйдете на войну» и «подайте трубами сигнал тревоги» естественны для современного литературного библейского регистра. Пассивное «вы будете вспомянуты» несколько книжно, но это оправдано точностью и лучше сохраняет синтаксическую неопределённость оригинала, чем безлично-активная конструкция черновика.
  terminology: '«Яхве» последовательно передаёт тетраграмматон. Сноска c требует исправления: еврейский текст содержит не слово «Яхве», а божественное имя יהוה; «Яхве» — русская передача этого имени.'
