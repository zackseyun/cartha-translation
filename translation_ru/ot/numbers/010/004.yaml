  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: ru
  text: Если же затрубят только в одну трубу, то к тебе соберутся вожди — главы тысяч Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «главы тысяч Израиля», вероятно, означает начальников подразделений Израиля, называвшихся «тысячами»; возможный перевод по смыслу: «главы родов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Если же
  rationale: Условная конструкция противопоставлена повелению предыдущего стиха; частица «же» естественно передаёт этот контраст.
- source_word: בְּ/אַחַת
  choice: только в одну трубу
  rationale: В еврейском тексте буквально сказано «в одну»; существительное «трубу» восстановлено из контекста, а «только» ясно передаёт противопоставление звучанию обеих труб.
- source_word: יִתְקָעוּ
  choice: затрубят
  rationale: Глагол תקע в данном контексте означает подать сигнал трубой; «затрубят» звучит естественно и точно.
- source_word: וְ/נוֹעֲדוּ
  choice: соберутся
  rationale: Нифаль глагола יעד здесь обозначает сбор по назначенному сигналу.
- source_word: אֵלֶי/ךָ
  choice: к тебе
  rationale: Предлог выражает направленность движения к Моисею.
- source_word: הַ/נְּשִׂיאִים
  choice: вожди
  rationale: נְשִׂיאִים — руководители народа или племён; «вожди» сохраняет достоинство и древний общественный контекст без монархического оттенка слова «князья».
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: главы тысяч Израиля
  rationale: Формулировка сохраняет еврейскую административно-военную терминологию и не снимает неоднозначность слова אֶלֶף, которое может обозначать тысячу как подразделение либо родовую группу.
