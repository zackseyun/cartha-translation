  text: А над ополчением[a] колена сыновей Гада — Елиасаф, сын Деуила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войском» или «подразделением». Еврейское צְבָא часто имеет военный оттенок, но здесь обозначает организованную племенную группу, двигавшуюся в установленном походном порядке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: А над
  rationale: Союз וְ связывает фразу с предыдущим перечислением, а עַל обозначает начальствование над племенным отрядом.
- source_word: צְבָא
  choice: ополчением
  rationale: Слово обозначает организованную группу, двигавшуюся в походном порядке, и сохраняет присущий еврейскому термину военный оттенок.
- source_word: מַטֵּה
  choice: колена
  rationale: В данном контексте слово обозначает племенную единицу Израиля; «колено» — устоявшееся и понятное русское соответствие.
- source_word: בְנֵי גָד
  choice: сынов Гада
  rationale: Сохранена буквальная форма еврейского племенного наименования, естественная для библейского русского языка.
- source_word: אֶלְיָסָף
  choice: Елиасаф
  rationale: Имя передано в принятой русской библейской форме.
- source_word: בֶּן דְּעוּאֵל
  choice: сын Деуила
  rationale: Прямо передаёт еврейскую патронимическую конструкцию и принятую русскую форму имени.
