- from: Сделай себе две серебряные трубы; выкуй их из серебра[a]. Они будут служить тебе, чтобы созывать общину и давать станам сигнал выступать в путь.
  to: Сделай себе две серебряные трубы; выкуй их[a]. Они будут служить тебе для созыва общины и для выступления станов в путь.
  rationale: Исправление устраняет невыраженное в оригинале «давать сигнал», сохраняет обе цели труб и переносит якорь сноски к передаче מִקְשָׁה. «Выкуй их» остаётся естественной современной передачей изготовления из кованого/чеканного металла, а материал уже ясно назван ранее.
