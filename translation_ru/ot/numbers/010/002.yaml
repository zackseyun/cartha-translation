    issue: Добавлено выражение «давать станам сигнал».
    rationale: Хотя трубы, несомненно, служили сигналом в контексте, в данном стихе еврейский текст формулирует назначение как «для выступления станов», не называя отдельно подачу сигнала. Добавление лучше убрать.
  - severity: low
    issue: Сноска о מִקְשָׁה привязана к слову «серебра», а не к обозначению способа изготовления.
    rationale: Материал уже передан словосочетанием «серебряные трубы»; сноска поясняет именно «выкуй их».
  revised_text: Сделай себе две серебряные трубы; выкуй их[a]. Они будут служить тебе для созыва общины и для выступления станов в путь.
