source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: ru
  text: Сделай себе две серебряные трубы; выкуй их[a]. Они будут служить тебе для созыва общины и для выступления станов в путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделай их чеканной работы».'
    reason: Слово מִקְשָׁה обозначает изделие, изготовленное ковкой или чеканкой; оно не обязательно утверждает, что каждая труба была сделана из единого куска серебра.
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Сделай себе
  rationale: 'Передаёт повелительное наклонение и значение לְךָ: трубы должны быть изготовлены для использования Моисеем.'
- source_word: שְׁתֵּי חֲצֽוֹצְרֹת כֶּסֶף
  choice: две серебряные трубы
  rationale: חֲצֹצְרָה обозначает прямую металлическую трубу, а не изогнутый рог; материал естественно выражен прилагательным «серебряные».
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: выкуй их из серебра
  rationale: מִקְשָׁה указывает на изготовление металла ковкой или чеканкой. Глагольная формулировка звучит естественно по-русски, а материал восстановлен из предыдущего словосочетания.
- source_word: וְהָיוּ לְךָ
  choice: Они будут служить тебе
  rationale: Передаёт не простое владение, а назначение труб для указанных далее целей.
- source_word: לְמִקְרָא הָעֵדָה
  choice: чтобы созывать общину
  rationale: מִקְרָא здесь означает созыв, а עֵדָה — общину Израиля. Инфинитивная конструкция ясно передаёт назначение труб.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: давать станам сигнал выступать в путь
  rationale: מַסַּע относится к выступлению в путь. Упоминание сигнала эксплицирует функцию труб, а «станы» сохраняет множественное число и походный контекст המקור.
