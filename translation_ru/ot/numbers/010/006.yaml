  register: Современный литературный русский с умеренно возвышенной походно-библейской лексикой. «Станы» выбрано ради точного различения лагерных объединений; синтаксис разделён на два предложения для ясности. Неясность подразумеваемого субъекта последнего глагола сохранена посредством конструкции «пусть трубят».
