lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: когда вы протрубите
  rationale: Глагол תקע в данном контексте означает трубить; форма второго лица множественного числа сохранена, а «когда» естественно передаёт последовательность предписанных действий.
- source_word: תְּרוּעָה
  choice: тревожный сигнал
  rationale: В контексте системы трубных команд это не просто звук, а особый резкий сигнал к движению; сочетание понятно современному читателю и сохраняет сигнальный характер слова.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Естественная русская передача наречного значения, относящегося к повторному сигналу.
- source_word: וְנָסְעוּ
  choice: выступят
  rationale: В походном контексте נסע означает сняться со стоянки и отправиться в путь; «выступят» кратко и уместно передаёт начало движения станов.
- source_word: הַמַּחֲנוֹת
  choice: станы
  rationale: Слово обозначает отдельные лагерные объединения Израиля; «станы» сохраняет библейско-походный колорит и остаётся понятным в контексте.
- source_word: הַחֹנִים תֵּימָנָה
  choice: расположившиеся с южной стороны
  rationale: Причастие חנה описывает стоянку, а תֵּימָנָה здесь указывает на южное расположение лагерных групп, а не направление их движения.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: пусть трубят тревожный сигнал
  rationale: Сохранена активная форма третьего лица множественного числа еврейского текста. Русская безлично-неопределённая конструкция не приписывает трубление самим станам и естественно выражает предписание.
- source_word: לְמַסְעֵיהֶם
  choice: при их выступлении
  rationale: מַסָּע здесь относится к снятию со стоянки и началу очередного перехода; предложная конструкция ясно связывает сигнал с выступлением станов.
