  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: ru
  text: Во главе отряда племени сынов Манассии стоял Гамалиил, сын Педацура[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское צְבָא можно также перевести как «войско», «ополчение» или «подразделение»; здесь имеется в виду организованный отряд племени.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Во главе … стоял
  rationale: В повторяющейся формуле порядка выступления וְעַל указывает на начальника, поставленного над племенным подразделением. Русская конструкция «во главе … стоял» естественно передаёт это отношение.
- source_word: צְבָא
  choice: отряд
  rationale: Здесь слово обозначает организованное племенное подразделение в походном строю; «отряд» понятно современному читателю и не сводит значение исключительно к боевому войску.
- source_word: מַטֵּה
  choice: племя
  rationale: В данном контексте книги Чисел слово обозначает одно из племён Израиля.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: сынов Манассии
  rationale: Сохранено буквальное родовое обозначение названного племени; форма «сынов Манассии» традиционна и понятна по-русски.
- source_word: גַּמְלִיאֵל
  choice: Гамалиил
  rationale: Имя передано в принятой русской библейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение родственной связи в именовании лица.
- source_word: פְּדָה צוּר
  choice: Педацур
  rationale: Два графических элемента исходного текста представляют одно личное имя; использована принятая русская библейская передача.
