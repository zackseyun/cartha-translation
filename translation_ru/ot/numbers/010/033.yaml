source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: ru
  text: И они отправились от горы Яхве в трёхдневный переход[a], а ковчег завета Яхве шёл перед ними в течение трёхдневного перехода, чтобы подыскать[b] для них место отдыха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «путь трёх дней». То же выражение повторено далее применительно к движению ковчега.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отыскать»; возможный оттенок: «высмотреть, разведать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в повествовании о переходах означает сняться с места и отправиться в путь; «отправились» естественно передаёт начало движения.
- source_word: מֵהַר יְהוָה
  choice: от горы Яхве
  rationale: הַר означает «гора», а личное имя יהוה передано транслитерацией «Яхве».
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: в трёхдневный путь / все эти три дня
  rationale: Сочетание דֶּרֶךְ с мерой времени обозначает путь, рассчитанный на три дня. Во втором употреблении оно передано естественной русской формой, не превращающей выражение однозначно в указание на расстояние между ковчегом и народом.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: а ковчег завета Яхве
  rationale: 'Сохранена конструкция принадлежности: это ковчег завета, связанного с Яхве. Союз «а» естественно вводит сопутствующее действие и не создаёт резкого противопоставления.'
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: шёл впереди них
  rationale: Причастие נֹסֵעַ описывает продолжающееся сопутствующее движение; «шёл впереди них» ясно передаёт как длительность, так и пространственное значение לִפְנֵיהֶם.
- source_word: לָתוּר
  choice: чтобы подыскать
  rationale: תור означает искать, исследовать или высматривать подходящее место. «Подыскать» естественно сочетается с местом отдыха и не придаёт фразе излишне военного оттенка.
- source_word: מְנוּחָה
  choice: место отдыха
  rationale: В контексте перехода существительное обозначает не только отвлечённый покой, но и конкретное место для остановки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано принятой в современной русской библеистике транслитерацией, а не заменено титулом.
- issue: Роль ковчега в поиске места отдыха
  choice: сохранена формулировка «ковчег… шёл… чтобы подыскать»
  alternative: пояснить, что место указывал сам Яхве посредством ковчега
  rationale: Грамматика прямо связывает цель с движением ковчега; перевод не добавляет отсутствующего в стихе объяснения механизма божественного водительства.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но повтор временного указания и неоднозначность глагола תור отмечены без догматического уточнения.
