  source_fidelity: 'Основной смысл передан верно: народ отправляется от горы Яхве, ковчег завета Яхве движется впереди, а цель выражена как поиск места отдыха. Однако «все эти три дня» несколько сглаживает повтор идиомы דֶּרֶךְ שְׁלֹשֶׁת יָמִים и добавляет указательное «эти», которого в оригинале нет. Более точное и естественное решение — сохранить образ трёхдневного перехода во втором члене.'
