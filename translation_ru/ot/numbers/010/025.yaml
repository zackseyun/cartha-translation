  - marker: b
    text: 'Буквально: «собирая позади»; то есть идя последним и замыкая общий походный строй.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может также означать «войска» или «ополчения»; здесь речь идёт об организованных племенных формированиях в походном порядке.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: И выступило
  rationale: Глагол נסע в последовательном повествовании обозначает начало движения; «выступило» естественно для организованного походного порядка и сохраняет связующее וְ.
- source_word: דֶּגֶל
  choice: знамя
  rationale: Слово обозначает племенное знамя и, по смысловому переносу, идущую под ним группу. Перевод сохраняет образ оригинала; возможный вариант «стяг» вынесен в примечание.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: стана сынов Дана
  rationale: «Стан» передаёт организованный лагерь племени, а «сыны Дана» сохраняет прозрачную родовую формулу בני דן.
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: замыкая шествие всех станов
  rationale: Причастие מְאַסֵּף описывает функцию последней группы походного строя. Формулировка передаёт положение в хвосте колонны, не добавляя явно не названной боевой функции охраны.
- source_word: לְצִבְאֹתָם
  choice: двигавшихся по своим подразделениям
  rationale: צבאות здесь обозначает организованные племенные формирования. Оборот с «по своим подразделениям» сохраняет распределительный смысл לְ и подходит контексту порядка движения.
- source_word: וְעַל צְבָאוֹ
  choice: во главе его войска стоял
  rationale: Конструкция על + צבא вводит начальника формирования. «Войско» сохраняет военный оттенок צבא, тогда как предшествующее множественное число передано как «подразделения» ради ясности.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ахиезер, сын Аммишаддая
  rationale: Имена транслитерированы в принятой русской библейской форме, а формула родства передана прямо.
