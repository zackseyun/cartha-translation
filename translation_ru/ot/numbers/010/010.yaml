  source_fidelity: 'Смысловой каркас передан верно: перечислены день радости, установленные времена, начала месяцев, трубление при жертвах, памятное значение перед Богом и формула самооткровения Яхве. Однако «первые дни ваших месяцев» несколько избыточно конкретизирует еврейское «начала месяцев» как именно дни; более точное и естественное русское выражение — «в начале каждого месяца».'
  naturalness: «Назначенные для вас времена» и особенно «жертвы мирных приношений» тяжеловесны для современного литературного русского. «Ваши установленные времена» и «ваши мирные жертвы» точны в данном культовом контексте и звучат нормативнее. Формула «будут служить вам напоминанием перед вашим Богом» синтаксически возможна, но «будут для вас памятным знаком перед вашим Богом» лучше передаёт לְזִכָּרוֹן.
  terminology: «Всесожжения», «мирные жертвы» и «Яхве» уместны и последовательны. «Мирные жертвы» — устоявшееся русское обозначение זִבְחֵי שְׁלָמִים; сноска может указать вариант «жертвы общения», не навязывая интерпретацию. Множественное «они» сохраняет неуточнённый референт еврейского וְהָיוּ.
