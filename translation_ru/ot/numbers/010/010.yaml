  to: И в день вашей радости, и в ваши установленные времена, и в начале каждого месяца[a] трубите в трубы над вашими всесожжениями и над вашими мирными жертвами[b]. Они будут для вас памятным знаком перед вашим Богом. Я — Яхве, ваш Бог.
