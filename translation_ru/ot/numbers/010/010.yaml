  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: ru
  text: И в день вашей радости, и в ваши установленные времена, и в начале каждого месяца[a] трубите в трубы над вашими всесожжениями и над вашими мирными жертвами[b]. Они будут для вас памятным знаком перед вашим Богом. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ваши новомесячья». Буквально: «в начала ваших месяцев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертвами приношений общения». Еврейский термин связан с миром, благополучием и совместной жертвенной трапезой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: вашей радости
  rationale: Существительное обозначает радость или ликование; «радости» естественно звучит в русском перечислении и не сужает значение.
- source_word: מוֹעֲדֵיכֶם
  choice: назначенные для вас времена
  rationale: מוֹעֵד может обозначать установленное время, собрание или праздник. Такой перевод сохраняет широту слова, хотя контекст имеет культовый характер.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: первые дни ваших месяцев
  rationale: Буквально выражение означает «начала/главы ваших месяцев»; в контексте речь идёт о начале каждого месяца, то есть новомесячье.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: трубите в трубы
  rationale: Обычное и ясное русское сочетание для повеления издавать трубный звук; серебро не добавлено, поскольку в этом стихе оно не названо.
- source_word: עַל עֹלֹתֵיכֶם
  choice: над вашими всесожжениями
  rationale: «Над» сохраняет основное значение עַל и ритуальный образ трубного звука, сопровождающего приношения.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: вашими жертвами мирных приношений
  rationale: Передаёт конструкцию «жертвы приношений шламим» и сохраняет связь термина с миром и благополучием.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: они будут служить вам напоминанием
  rationale: Передаёт культовую функцию знака, приводящего народ на память перед Богом; множественное число оставлено неоднозначным по отношению к трубным звукам и сопровождаемым ими действиям.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: перед вашим Богом
  rationale: Точно и естественно передаёт значение «перед лицом / в присутствии вашего Бога».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя; «Яхве» прямо передаёт общепринятую научную реконструкцию его произношения.
- issue: Передача שְׁלָמִים
  choice: мирные приношения
  alternative: жертвы общения; благодарственные жертвы
  rationale: «Мирные приношения» сохраняет связь с семантическим полем целостности, благополучия и мира, не сводя значение только к общению или благодарению.
- issue: Референт множественного וְהָיוּ
  choice: нейтральное «они»
  alternative: трубные звуки будут; приношения будут
  rationale: Форма множественного числа допускает отнесение к трубным звукам или ко всему ритуальному комплексу; перевод не устраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством нормативно-культового текста. Сохранены повторяющиеся союзы в начале перечня, но повеление передано естественным русским императивом. Термины «всесожжение» и «мирное приношение» оставлены как понятные устоявшиеся названия жертв.
