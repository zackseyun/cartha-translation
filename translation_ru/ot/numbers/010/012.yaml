  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: ru
  text: И сыновья Израиля[a] отправились по этапам своего пути из Синайской пустыни, и облако остановилось в пустыне Фаран.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтяне». Буквально по-древнееврейски: «сыновья Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в повествовании о странствии обозначает снятие с места и начало пути; «отправились» естественно передаёт это значение по-русски.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  rationale: Формально прозрачно передаёт древнееврейское родственное выражение и сохраняет грамматически мужскую форму оригинала; идиоматический коллективный вариант дан в сноске.
- source_word: לְמַסְעֵיהֶם
  choice: переходами
  rationale: Множественное число מַסָּע обозначает последовательные этапы или переходы пути; русский творительный передаёт распределительный смысл кратко и естественно.
- source_word: מִמִּדְבַּר סִינָי
  choice: из Синайской пустыни
  rationale: «Пустыня» — обычное русское обозначение מִדְבָּר в данном географическом контексте; конструкция с прилагательным звучит естественно.
- source_word: וַיִּשְׁכֹּן
  choice: остановилось
  rationale: Здесь שכן описывает прекращение движения облака и его пребывание на месте; «остановилось» ясно передаёт контекст, не добавляя идеи его опускания.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённая форма указывает на уже известное из повествования облако, ведущее народ.
- source_word: בְּמִדְבַּר פָּארָן
  choice: в пустыне Фаран
  rationale: Сохраняет географическое обозначение מִדְבָּר и традиционную русскую передачу топонима Фаран.
theological_decisions:
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  alternative: израильтяне
  rationale: Выбрана прозрачная передача мужского родственного выражения оригинала без превращения его в нейтральное коллективное название; более идиоматичный вариант отмечен в сноске. Особого вероучительного вывода формулировка не навязывает.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Слово «сыновья» предпочтено архаичному «сыны», а последовательность путешествия передана ёмким словом «переходами».
