  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: ru
  text: Затем выступил стан Рувима под своим знаменем, по своим подразделениям; во главе его подразделения стоял Елицур, сын Шедеура.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַע
  choice: Затем выступило
  rationale: Форма с וַו продвигает повествование, а глагол נסע в контексте передвижения стана означает отправление в путь. «Затем выступило» естественно передаёт последовательность и не добавляет значения сворачивания лагеря.
- source_word: דֶּגֶל
  choice: знамя
  rationale: דֶּגֶל обозначает племенное знамя, под которым двигался стан. «Знамя» сохраняет конкретный образ и соответствует достоинству контекста.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: стана Рувима
  rationale: Конструктивная цепочка передана естественным русским родительным оборотом.
- source_word: לְצִבְאֹתָם
  choice: по их воинствам
  rationale: צָבָא здесь обозначает организованные подразделения народа, выстроенные для похода, с военным оттенком, но не обязательно участвующие в сражении. Множественное число и местоименный суффикс сохранены.
- source_word: וְעַל צְבָאוֹ
  choice: во главе его воинства стоял
  rationale: Предлог עַל выражает руководство или начальствование. «Во главе ... стоял» естественно передаёт безглагольную еврейскую конструкцию и сохраняет тот же термин צָבָא в единственном числе.
- source_word: אֱלִיצוּר
  choice: Елицур
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן שְׁדֵיאוּר
  choice: сын Шедеура
  rationale: Патронимическая конструкция передана буквально; имя отца транслитерировано в принятой русской форме.
