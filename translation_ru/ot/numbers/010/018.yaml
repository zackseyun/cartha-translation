    rationale: צָבָא сохраняет организованно-военный оттенок, но в данном контексте относится к порядку подразделений. «По своим подразделениям» лучше соответствует современному литературному употреблению; оттенок пояснён в сноске.
  revised_text: Затем выступил стан Рувима под своим знаменем, по своим подразделениям; во главе его подразделения стоял Елицур, сын Шедеура.
