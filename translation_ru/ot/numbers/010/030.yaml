  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: ru
  text: 'Но он сказал ему: «Нет, я не пойду; я пойду в свою страну, к своей родне[a]».


    [a] Или: «на родину», «к месту своего рождения». Еврейское слово может обозначать родню (род) или место рождения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на родину», «к месту своего рождения». Еврейское слово может обозначать родню (род) или место рождения.'
    reason: Сохраняет неоднозначность еврейского מוֹלַדְתִּי, не меняя основного, контекстуально допустимого перевода «родне».
lexical_decisions:
- source_word: לֹא אֵלֵךְ
  choice: «Нет, я не пойду»
  rationale: Прямо и естественно передаёт категорический отказ в контексте приглашения.
- source_word: כִּי אִם
  choice: «Я отправлюсь»
  rationale: 'После отрицания оборот вводит противопоставление: не с Израилем, а в свою землю; в русском это естественно передаётся отдельным утвердительным предложением.'
- source_word: מוֹלַדְתִּי
  choice: «моя родня»
  rationale: Здесь слово указывает на родственные и родовые связи, а не просто на место рождения.
