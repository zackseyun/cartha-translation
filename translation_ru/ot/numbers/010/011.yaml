source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: ru
  text: Во второй год, во втором месяце, в двадцатый день месяца облако поднялось[a] от скинии свидетельства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознеслось»; еврейский глагол обозначает движение вверх.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жилище свидетельства». Возможный смысл: скиния, в которой хранилось свидетельство завета.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: нулевой переход в начале предложения
  rationale: Еврейская повествовательная формула вводит следующее событие. В современном русском её отдельная передача как «и случилось» была бы тяжеловесной; последовательность повествования естественно выражена началом нового предложения.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: во второй год
  rationale: Прямая и естественная передача обозначения года.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: во втором месяце
  rationale: Сохранено повторное указание порядкового номера месяца, присутствующее в еврейском тексте.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: в двадцатый день месяца
  rationale: Еврейское выражение буквально говорит «в двадцать [числа] месяца»; слово «день» добавлено для ясности по нормам русского языка.
- source_word: נַעֲלָה
  choice: поднялось
  rationale: Глагол описывает движение облака вверх и его удаление как знак к отправлению; «поднялось» естественно передаёт это движение, не уточняя его причины.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённая форма указывает на уже известное из контекста облако, сопровождавшее Израиль.
- source_word: מֵעַל
  choice: от
  rationale: Предлог обозначает удаление от положения над скинией. В сочетании с глаголом «поднялось» русское «от скинии» ясно выражает исходную пространственную точку без неестественной конструкции «из места над».
- source_word: מִשְׁכַּן
  choice: скиния
  rationale: Устоявшееся и точное русское обозначение переносного святилища; при этом буквальное значение «жилище» отмечено в сноске.
- source_word: הָעֵדֻת
  choice: свидетельства
  rationale: Сохранён ключевой термин Пятикнижия и его связь со свидетельством, помещённым в святилище; более истолковывающий вариант «завета» не внесён в основной текст.
theological_decisions:
- issue: Обозначение святилища מִשְׁכַּן הָעֵדֻת
  choice: скиния свидетельства
  alternative: жилище свидетельства; скиния завета
  rationale: Основной вариант близко следует еврейской культовой формуле и сохраняет межтекстовые связи. «Жилище» передаёт буквальную семантику מִשְׁכָּן, но хуже функционирует как название святилища; «завета» объясняет смысл עֵדוּת, однако лексически более интерпретативно.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской терминологией. Хронологическая формула сохранена полностью; синтаксис упрощён без архаического «и было». Слова «скиния» и «свидетельство» оставлены ради точности и канонической узнаваемости, а их смысл пояснён в сноске.
