  to: Первым выступил стан сынов Иуды под своим знаменем, по своим подразделениям; во главе его подразделения стоял Нахшон, сын Амминадава.
  rationale: Редакция устраняет неестественную русскую метонимию «знамя выступило», сохраняя указание на племенное знамя, и передаёт оба употребления צבא нейтральным термином «подразделение». Сохранены порядок движения, множественное число в первой части, единственное число во второй и именование Нахшона.
