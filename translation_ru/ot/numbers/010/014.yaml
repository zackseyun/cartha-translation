  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: ru
  text: Первым выступил стан сынов Иуды под своим знаменем, по своим подразделениям; во главе его подразделения стоял Нахшон, сын Амминадава.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: выступило
  rationale: В контексте передвижения по пустыне глагол נסע означает сняться с места и отправиться в путь; «выступило» естественно сочетается с организованным порядком движения стана.
- source_word: דֶּגֶל
  choice: знамя
  rationale: Слово обозначает племенное знамя и вместе с тем организованное под ним становое подразделение. Русское «знамя» сохраняет конкретный образ и военный оттенок.
- source_word: מַחֲנֵה בְנֵי יְהוּדָה
  choice: стана сынов Иуды
  rationale: «Стан» — краткий и традиционно понятный эквивалент лагеря кочующего народа; «сыны Иуды» сохраняет формальное родоплеменное обозначение בני יהודה.
- source_word: בָּרִאשֹׁנָה
  choice: первым
  rationale: Наречное выражение указывает на очередность движения; форма согласована со словом «знамя».
- source_word: לְצִבְאֹתָם
  choice: по их ополчениям
  rationale: צבאות здесь обозначает организованные родоплеменные военные подразделения. «Ополчения» передаёт одновременно организационный и военный смысл, не представляя их регулярными армиями.
- source_word: וְעַל צְבָאוֹ
  choice: во главе его ополчения стоял
  rationale: Предлог על выражает руководство подразделением. Идиоматическая русская конструкция ясно передаёт, что названный человек возглавлял ополчение Иуды.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Нахшон, сын Амминадава
  rationale: Имена переданы транслитерацией с еврейского; родственная связь выражена явно.
