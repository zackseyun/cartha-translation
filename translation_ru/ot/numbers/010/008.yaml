  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: ru
  text: Сыны Аарона, священники, будут трубить в трубы. И они будут для вас постоянным установлением[a] из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечным установлением»; «установлением навеки».'
    reason: Слово עוֹלָם может обозначать как непреходящую, постоянную силу установления, так и вечность; контекст допускает более буквальную передачу.
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Сыны Аарона
  rationale: Сохраняет буквальное родственное обозначение בְּנֵי и соответствует достойному литературному регистру; «сыновья Аарона» также возможно, но менее естественно в данном законодательном контексте.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Передаёт приложение, поясняющее, что сыны Аарона выступают здесь именно как священники.
- source_word: יִתְקְעוּ בַּחֲצֹצְרוֹת
  choice: будут трубить в трубы
  rationale: Глагол תקע при упоминании труб означает «трубить». Будущее время естественно выражает предписание в русском языке. Серебро не добавлено, поскольку в этом стихе оно прямо не названо.
- source_word: וְהָיוּ לָכֶם
  choice: Это будет для вас
  rationale: Единственное число «это» естественно обобщает всё предыдущее предписание. Формально еврейский глагол стоит во множественном числе, однако буквальное «они будут» в русском создало бы неясную и, вероятно, ложную связь с трубами.
- source_word: לְחֻקַּת עוֹלָם
  choice: постоянным установлением
  rationale: Передаёт устойчивую законодательную формулу и длительную обязательность, не навязывая слову עוֹלָם исключительно философский смысл абсолютной бесконечности.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Естественная современная русская формула, выражающая продолжение действия установления во всех последующих поколениях.
theological_decisions:
- issue: Смысл формулы חֻקַּת עוֹלָם
  choice: постоянным установлением
  alternative: вечным установлением; установлением навеки
  rationale: «Постоянным» сохраняет идею непрекращающейся нормативной силы в жизни Израиля, при этом не снимает присущую עוֹלָם контекстуальную напряжённость между длительностью и безусловной вечностью. Более буквальные варианты приведены в сноске.
- issue: Число в וְהָיוּ לָכֶם
  choice: Это будет для вас
  alternative: И они будут для вас
  rationale: Русское обобщающее «это» относит установление ко всему предписанию. Формальное множественное число оригинала не превращено в богословское утверждение о самих трубах как об установлении.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным законодательным звучанием. «Сыны Аарона» сохраняет библейское достоинство без архаизации остальной фразы; «из поколения в поколение» понятно современному читателю.
