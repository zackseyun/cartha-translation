  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: ru
  text: И если ты пойдёшь с нами, то добро, которое Яхве окажет нам, мы также окажем тебе добро.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «И будет: если ты пойдёшь с нами, то то добро, которое Яхве окажет нам, мы окажем тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И если
  rationale: Оборот вводит условие; современное русское «если» передаёт его естественно, не превращая условие в уверенное «когда».
- source_word: תֵלֵךְ עִמָּנוּ
  choice: ты пойдёшь с нами
  rationale: Глагол הלך с עִם обозначает совместное следование в пути; «пойдёшь с нами» прямо и естественно передаёт смысл.
- source_word: וְהָיָה
  choice: то
  rationale: Повторное וְהָיָה вводит следствие условия; русское «то» ясно обозначает аподосис.
- source_word: הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: тем добром, которое Яхве сделает для нас
  rationale: Сохраняется существительное «добро» и словесная связь с יטב; «сделает для нас» естественно передаёт благодеяние, не уточняя его вид.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: мы поделимся с тобой
  rationale: В данном контексте обещание означает распространить полученное благо на спутника. Такая формулировка естественна по-русски и сохраняет соотнесённость с предшествующим «добром», не добавляя слова «тем же».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет это различие.
- issue: Характер обещанного добра
  choice: не конкретизировать благо
  alternative: указать конкретное материальное или заветное благословение
  rationale: Стих говорит о «добре» обобщённо, поэтому перевод не ограничивает его одной разновидностью благословения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Основной текст избегает тяжеловесного буквального повтора глагола «делать добро», а сноска сохраняет форму и неоднозначность еврейской конструкции.
