  terminology: «Яхве» последовательно передаёт тетраграмматон. «Добро» сохраняет обобщённость הַטּוֹב; добавленное «также» естественно выражает связь обещания с благом, которое Яхве окажет Израилю, не утверждая буквально «то же самое добро».
