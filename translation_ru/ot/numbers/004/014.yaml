base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: ru
  text: 'Потом пусть положат на него все его принадлежности, которыми совершают при нём служение: совки для углей, вилки, лопатки и чаши — все принадлежности жертвенника. Пусть расстелют поверх него покрытие из кожи тахаша[a] и вставят его шесты.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Неизвестно, какое именно животное обозначает еврейское слово «тахаш». Возможные переводы: «козья кожа», «кожа морского животного» или, в более общем смысле, «прочная выделанная кожа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Потом пусть положат на него
  rationale: Последовательная форма глагола נתן продолжает порядок действий; «пусть положат» естественно передаёт предписание, а местоимение относится к жертвеннику.
- source_word: כָּל כֵּלָיו
  choice: все его принадлежности
  rationale: כְּלִי обозначает предметы и орудия оснащения; «принадлежности» достаточно широко и уместно для утвари жертвенника.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: которыми совершают при нём служение
  rationale: שרת в данном контексте означает культовое служение. «При нём» естественно указывает на служение у жертвенника, не сглаживая инструментальное בָּהֶם — «которыми».
- source_word: הַמַּחְתֹּת
  choice: совки для углей
  rationale: מַחְתָּה — орудие или сосуд для переноса горячих углей; этот перевод конкретнее неоднозначного «кадильницы» и подходит к служению у жертвенника.
- source_word: הַמִּזְלָגֹת
  choice: вилки
  rationale: Название обозначает вилкообразные культовые орудия; современное «вилки» ясно и не вводит неподтверждённое уточнение об их употреблении для мяса.
- source_word: הַיָּעִים
  choice: лопатки
  rationale: יעים — орудия для удаления золы; «лопатки» передаёт их форму и назначение в естественном русском языке.
- source_word: הַמִּזְרָקֹת
  choice: чаши
  rationale: מִזְרָק обозначает культовый сосуд, связанный, в частности, с кровью жертв; нейтральное «чаши» сохраняет широту значения.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: все принадлежности жертвенника
  rationale: Итоговое приложение повторяет широкое обозначение перечисленных предметов; единообразно передано словом «принадлежности».
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Пусть расстелют поверх него покрытие
  rationale: פרשׂ означает расстилать или распростирать; формулировка сохраняет отдельное действие и существительное כְּסוּי «покрытие».
- source_word: עוֹר תַּחַשׁ
  choice: из кожи тахаша
  rationale: Точное значение תַּחַשׁ неизвестно. Транслитерация сохраняет лексическую неопределённость исходного текста и не навязывает спорную зоологическую идентификацию.
- source_word: וְשָׂמוּ בַדָּיו
  choice: и вставят его шесты
  rationale: В контексте подготовки к переносу שׂים означает установить шесты на место; «вставят» естественно передаёт действие с шестами жертвенника.
