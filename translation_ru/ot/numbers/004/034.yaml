base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: ru
  text: И Моисей, Аарон и вожди общины сосчитали сынов Каафа по их родам и по их отцовским домам[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исчислили», «провели перепись». Здесь еврейский глагол означает подсчёт людей для служения; в других контекстах он также может означать «назначить».'
    reason: lexical_alternative
  - marker: b
    text: «Отцовский дом» — традиционное израильское обозначение родовой семьи или подразделения рода, ведущего происхождение по отцовской линии.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: пересчитали
  rationale: В контексте переписи и определения левитов на служение глагол פקד означает подсчёт или внесение в число; «пересчитали» естественно передаёт совершённое действие и не привносит значения назначения на должность.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: вожди общины
  rationale: נְשִׂיאִים обозначает признанных руководителей народа, а עֵדָה — собранную общину Израиля. «Вожди общины» сохраняет библейское достоинство и остаётся понятным современному читателю.
- source_word: בְּנֵי הַקְּהָתִי
  choice: сынов Каафа
  rationale: Так передаётся родовая формула «сыны каафитянина/Каафа», то есть мужские потомки Каафа, о которых идёт речь в переписи; форма согласуется с традиционным русским написанием имени Кааф.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри колена; «по родам» точно и естественно выражает распределительное значение предлога לְ.
- source_word: וּלְבֵית אֲבֹתָם
  choice: и по их отцовским домам
  rationale: «Отцовский дом» сохраняет особый израильский термин родства и не сводит его к общему слову «семья».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Начальное «И» сохраняет повествовательную связь וַ־. Термины «роды» и «отцовские дома» удерживают различие между двумя уровнями родовой организации.
