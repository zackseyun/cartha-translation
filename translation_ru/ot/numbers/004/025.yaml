base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: ru
  text: Они будут носить полотнища скинии, шатёр встречи с его покрытием, покрытие из тахаша[a], которое лежит поверх него, и завесу у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово תַּחַשׁ (тахаш) может обозначать материал или животное; его точное значение неизвестно. Традиционные переводы предлагают разные виды кожи.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Они будут носить
  rationale: В контексте обязанностей при переносе святилища глагол נשׂא означает «нести, переносить». Будущее время естественно передаёт предписанный порядок служения.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: полотнища скинии
  rationale: יְרִיעֹת — составные тканевые полотнища, а не обычные оконные занавеси; «скиния» сохраняет устойчивое русское обозначение מִשְׁכָּן.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Перевод сохраняет образ шатра и значение назначенной встречи, не смешивая אֹהֶל с ранее упомянутой скинией.
- source_word: מִכְסֵהוּ
  choice: его покрытием
  rationale: Местоименный суффикс соотнесён с шатром встречи; слово «покрытие» не уточняет материал, которого здесь нет в еврейском тексте.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: покрытие из кожи тахаша
  rationale: Значение תַּחַשׁ остаётся неясным, поэтому транслитерация не приписывает слову определённый вид животного; родовой термин «кожа» отражает вероятный характер материала.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: верхнее покрытие
  rationale: Компактно и естественно передаёт положение покрытия поверх шатра, выраженное словами «которое на нём сверху».
- source_word: מָסַךְ פֶּתַח
  choice: завесу у входа
  rationale: В данном устройстве מָסָךְ обозначает тканевую преграду; «у входа» естественно передаёт связь с проёмом шатра.
