base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: ru
  text: Вся служба потомков Гершона, связанная со всеми их грузами и всей их работой, должна совершаться по распоряжению Аарона и его сыновей[a]. Возложите на них обязанность[b] переносить все их грузы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Аарона и его сыновей»; еврейское выражение означает действие по их слову или распоряжению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как порученное им дело». Еврейское слово может обозначать возложенную ответственность или обязанность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: по распоряжению
  rationale: Еврейская идиома буквально означает «по устам» и здесь указывает на действие согласно приказанию или руководству; «по распоряжению» естественно передаёт административный и властный оттенок.
- source_word: תִּהְיֶה
  choice: должна совершаться
  rationale: Форма выражает предписанный порядок служения; конструкция с «должна» сохраняет директивный характер и естественна по-русски.
- source_word: עֲבֹדַת / עֲבֹדָתָם
  choice: служба / работа
  rationale: В контексте скинии עֲבֹדָה обозначает назначенное левитское служение и выполняемую работу. В первом употреблении «служба» называет всю сферу обязанностей, а во втором «работа» позволяет естественно передать охват отдельных задач без тяжёлого повтора.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: потомков Гершона
  rationale: Буквально выражение означает сынов или членов рода гершонитянина; «потомки Гершона» ясно и естественно обозначает родовую группу в современном русском языке.
- source_word: לְכָל מַשָּׂאָם
  choice: при переноске всех их грузов
  rationale: מַשָּׂא здесь относится к предметам, переносимым при транспортировке скинии. Формулировка сохраняет конкретный смысл и показывает сферу, в которой действует распоряжение Аарона и его сыновей.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: назначите им
  rationale: Глагол פקד в данной конструкции означает назначить или поручить ответственность. Русское «назначите им» сохраняет административный характер указания и сочетается с последующим «в обязанность».
- source_word: בְּמִשְׁמֶרֶת
  choice: в обязанность
  rationale: מִשְׁמֶרֶת может обозначать порученную ответственность, обязанность или то, что вверено попечению. Основной вариант передаёт обязательность назначения, а примечание сохраняет близкую альтернативу.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: всё, что они должны переносить
  rationale: Описательная формулировка естественнее буквального повторения «все их грузы» и однозначно сохраняет конкретный смысл переноски имущества скинии.
