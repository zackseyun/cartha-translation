  source_fidelity: 'Основной смысл передан верно: служение рода Гершона осуществляется по распоряжению Аарона и его сыновей, а ответственность за грузы возлагается на гершонитов. Однако «при переноске всех их грузов» несколько сужает מַשָּׂא («груз, ноша») до процесса переноски и синтаксически не вполне ясно передаёт сферу всеобъемлющего надзора. В заключительной фразе «всё, что они должны переносить» добавляет модальный оттенок, которого в еврейском тексте нет.'
