  text: 'И исчисленные из сыновей Гершона, по их родам и по их отеческим домам:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: А исчисленные
  rationale: Форма обозначает тех, кто был учтён при переписи; субстантивированное «исчисленные» сохраняет связь с контекстом подсчёта и незавершённую синтаксическую конструкцию стиха.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: из сыновей Гершона
  rationale: Предлог «из» естественно передаёт принадлежность перечисляемых к роду Гершона и соответствует подразумеваемой выборке исчисленных лиц.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри колена; «по родам» — ясная и традиционно понятная формулировка.
- source_word: וּלְבֵית אֲבֹתָם
  choice: и по их отеческим домам
  rationale: Буквально «по дому их отцов»; «отеческие дома» сохраняет древнеизраильский термин родственной организации, не сводя его к современному домашнему хозяйству.
