  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: ru
  text: от тридцати лет и старше — до пятидесяти лет — всех, кто приходит на службу[a], чтобы выполнять работу в шатре встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех, кто приходит исполнять обязанности». Еврейское «приходит» может передавать также вступление к исполнению порученной обязанности. Слово «служба» переводит еврейское צָבָא, которое может означать также «обязанность», «отряд» или «войско»; здесь речь идёт об организованной службе левитов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: от тридцати лет и старше
  rationale: Еврейская возрастная формула בֶּן + число + שָׁנָה передана естественным русским оборотом; וָמַעְלָה обозначает включение лиц старшего возраста в пределах далее указанной верхней границы.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: до пятидесяти лет
  rationale: Ясно передаёт верхнюю границу возрастного диапазона, не уточняя сверх еврейского текста вопрос включительности предела.
- source_word: כָּל בָּא לַצָּבָא
  choice: всякого, кто поступает на службу
  rationale: Причастие בָּא буквально означает «приходящий/входящий», а в сочетании с לַצָּבָא указывает на вступление в организованную левитскую службу.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: чтобы выполнять работу
  rationale: Инфинитив выражает цель, а מְלָאכָה — порученную работу; формулировка естественна и сохраняет практический характер обязанностей.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Прямая и понятная передача устойчивого названия אֹהֶל מוֹעֵד без внесения дополнительного конфессионального оттенка.
theological_decisions:
- issue: Характер צָבָא в данном контексте
  choice: служба
  alternative: войско; ополчение; отряд
  rationale: Хотя צָבָא часто имеет военное значение, здесь речь идёт об организованном исполнении обязанностей левитами при шатре встречи, а не о военных действиях.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет характер перечня и остаётся понятной без архаизмов. Тире помогают обозначить вложенный возрастной диапазон в составе неполного предложения стиха.
