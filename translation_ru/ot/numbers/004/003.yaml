  terminology: «Служба» удачно передаёт צָבָא в контексте упорядоченных левитских обязанностей, не навязывая военного значения. «Шатёр встречи» является прямой передачей אֹהֶל מוֹעֵד. Сноску следует привязать именно к слову «службу» и уточнить, что альтернативный перевод относится к выражению כָּל בָּא לַצָּבָא, а не выводится из одного צָבָא.
