  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: ru
  text: И учтённых среди них[a], по их родам, по домам их отцов, было две тысячи шестьсот тридцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исчисленных» или «зарегистрированных при переписи». Еврейское выражение обозначает людей, учтённых при переписи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: было
  rationale: В формуле переписи глагол היה выполняет связочную функцию; безличное «было» естественно вводит итоговое число по-русски.
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных из них
  rationale: Форма от פקד обозначает людей, учтённых при переписи. Этот вариант сохраняет отсылку к ранее названной группе и не добавляет отсутствующее здесь слово «мужчины».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте переписи מִשְׁפָּחָה обозначает родовую группу; «по» передаёт принцип распределения при подсчёте.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Буквально и достаточно ясно передаёт устойчивое обозначение патрилинейных родовых объединений Израиля.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: две тысячи шестьсот тридцать
  rationale: Стандартная современная русская передача указанного количественного числительного.
