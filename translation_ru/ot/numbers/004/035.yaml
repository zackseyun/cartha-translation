  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: ru
  text: от тридцати лет и старше, вплоть до пятидесяти лет, — всех, кто поступает на службу, для работы в шатре встречи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: от тридцати лет и старше
  rationale: Естественно передаёт древнееврейское обозначение нижней возрастной границы и сохраняет значение וָמַעְלָה («и выше/старше»).
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: вплоть до пятидесяти лет
  rationale: Ясно обозначает верхнюю границу возраста и передаёт усилительное значение עַד в данном диапазоне.
- source_word: כָּל הַבָּא
  choice: всех, кто приходит
  rationale: Причастие от בוא употреблено субстантивированно; перевод сохраняет образ прихода и согласуется с синтаксической зависимостью стиха от предшествующего контекста переписи.
- source_word: לַצָּבָא
  choice: на службу
  rationale: В контексте обязанностей левитов צָבָא обозначает организованную службу, а не обязательно военную службу; русское выражение естественно передаёт вступление в круг служебных обязанностей.
- source_word: לַעֲבֹדָה
  choice: чтобы выполнять работу
  rationale: Передаёт целевое значение и отличает конкретную работу עֲבֹדָה от организованной службы, обозначенной предыдущим словом.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: «Шатёр встречи» прозрачно передаёт название אֹהֶל מוֹעֵד, а предлог «при» обозначает место и сферу служения, не ограничивая работу внутренним пространством шатра.
theological_decisions:
- issue: Характер службы, обозначенной словом צָבָא
  choice: на службу
  alternative: в войско
  rationale: Контекст посвящён установленным обязанностям левитов при шатре встречи. Перевод не устраняет оттенок организованной, упорядоченной службы, но и не приписывает ей сугубо военный характер.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранена синтаксическая незавершённость стиха как продолжения предыдущего предложения; начальная строчная буква отражает эту связь. Термин «шатёр встречи» выбран как понятный и близкий к форме оригинала.
