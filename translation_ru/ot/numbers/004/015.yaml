source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: ru
  text: Когда Аарон и его сыновья закончат покрывать святыню и все принадлежности святыни, при отправлении стана после этого придут сыны Каафа, чтобы нести их. Но они не должны прикасаться к святыне[a], иначе умрут[b]. Вот ноша сынов Каафа[c] при шатре встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к священным предметам»; возможно также: «к святилищу». Еврейское слово может обозначать святыню собирательно, священные предметы или священное место.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и умрут».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть каафиты; буквально: «сыны Каафа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה
  choice: закончат
  rationale: Глагол выражает завершение действия; русское будущее совершенного вида естественно передаёт временную последовательность предписания.
- source_word: לְכַסֹּת
  choice: укрывать
  rationale: В сочетании с «закончат» обозначает полное покрытие священных предметов перед переноской.
- source_word: הַקֹּדֶשׁ
  choice: святилище / святыня
  rationale: Первое употребление в контексте покрывания передаётся как «святилище», а в запрете сохранено собирательное и неоднозначное «святыня».
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: все принадлежности святилища
  rationale: כְּלֵי обозначает предметы, утварь или принадлежности; выбран современный и достаточно широкий русский эквивалент.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: перед тем как стан отправится в путь
  rationale: Временная конструкция указывает на момент снятия стана и начала движения; включение «перед тем как» естественно связывает подготовительные действия с отправлением.
- source_word: בְנֵי קְהָת
  choice: сыны Каафа
  rationale: Сохранено буквальное родовое обозначение; традиционная русская форма имени «Кааф» обеспечивает узнаваемость.
- source_word: לָשֵׂאת
  choice: чтобы нести их
  rationale: Инфинитив обозначает назначенное действие; местоимение относится к ранее названным укрытым святыням и принадлежностям.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Но они не должны прикасаться к святыне
  rationale: «Святыня» сохраняет собирательность и возможную широту референта הַקֹּדֶשׁ, не сводя его безоговорочно только к предметам.
- source_word: וָמֵתוּ
  choice: иначе умрут
  rationale: Передаёт прямое последствие запретного прикосновения и его предупреждающую силу; более буквальный вариант отмечен в сноске.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Вот что должны носить сыны Каафа
  rationale: מַשָּׂא может обозначать как ношу, так и обязанность переноски; русская формулировка ясно передаёт конкретное назначение.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Предлог ב здесь допускает значение сферы служения; «при шатре встречи» естественно описывает обязанности, связанные с ним.
theological_decisions:
- issue: Референт הַקֹּדֶשׁ в запрете
  choice: святыня
  alternative: священные предметы; святилище
  rationale: 'Единственное собирательное «святыня» сохраняет неоднозначность еврейского выражения: в непосредственном контексте вероятны священные предметы, но более широкое отнесение к святилищу грамматически возможно.'
- issue: Характер последствия וָמֵתוּ
  choice: иначе умрут
  alternative: и умрут
  rationale: Выбрана естественная русская формулировка предупреждения без ослабления прямоты смертельного последствия; буквальная координация сохранена как альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного повествования. Сохранены традиционно узнаваемые «сыны Каафа», но архаичная синтаксическая тяжеловесность устранена. «Шатёр встречи» прозрачно передаёт אֹהֶל מוֹעֵד.
