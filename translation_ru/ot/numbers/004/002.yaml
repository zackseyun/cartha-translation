  text: Проведи перепись сынов Каафа[a] из числа сынов Левия, по их родам, по их отцовским домам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подними голову сынов Каафа» — древнееврейский оборот, означающий пересчитать людей или провести перепись.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Проведи перепись
  rationale: Буквально выражение означает «подними голову», но в административном контексте это устойчивый оборот со значением пересчёта или переписи. Русское «проведи перепись» ясно и естественно передаёт смысл повеления.
- source_word: בְּנֵי קְהָת
  choice: сынов Каафа
  rationale: Сохраняется генеалогическая форма исходного текста; она также соответствует параллельному выражению «сынов Левия».
- source_word: מִתּוֹךְ
  choice: из числа
  rationale: Передаёт выделение одной группы внутри более широкой и звучит естественно в контексте переписи.
- source_word: בְּנֵי לֵוִי
  choice: сынов Левия
  rationale: Формально и ясно сохраняет генеалогическое обозначение исходного текста, не заменяя его более общим «левитов».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте племенного устройства מִשְׁפָּחָה обозначает родовую группу; «роды» — традиционное и понятное русское соответствие.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохраняет особый термин древнеизраильской родовой организации и не смешивает его с предыдущим уровнем — «родами».
