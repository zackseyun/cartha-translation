  text: וַ/יִּהְי֥וּ פְקֻדֵי/הֶ֖ם לְ/מִשְׁפְּחֹתָ֑/ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: ru
  text: И исчисленных из них по их родам было три тысячи двести.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: И … было
  rationale: Последовательная форма с היה продолжает повествование и вводит итог исчисления; русская конструкция «И … было» естественно передаёт эту связь.
- source_word: פְקֻדֵיהֶם
  choice: исчисленных из них
  rationale: В контексте переписи форма от פקד обозначает людей, внесённых в счёт. «Исчисленных из них» сохраняет связь с ранее названной группой и не добавляет отсутствующее здесь слово «мужчин».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה обозначает родовую, семейно-клановую группу внутри колена; «по их родам» соответствует принятой русской библейской лексике и остаётся понятным современному читателю.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: три тысячи двести
  rationale: Прямое и естественное для современного русского языка выражение указанного общего числа.
