base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: ru
  text: И завесы двора, и полог у входа в ворота двора, окружающего скинию и жертвенник, и их верёвки[a], и все принадлежности для служения с ними, и всё, что надлежит делать с ними[b]; и будут совершать служение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шнуры».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё, что надлежит делать для них». Еврейское выражение может относиться либо к действиям с этими предметами, либо к работе, совершаемой для них при служении.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: завесы
  rationale: Обозначает полотнища, образующие ограду двора; «завесы» естественно и уместно в контексте скинии.
- source_word: חָצֵר
  choice: двор
  rationale: Здесь имеется в виду ограждённое внешнее пространство скинии; «двор» — ясный и традиционный русский термин.
- source_word: מָסַךְ
  choice: полог
  rationale: Слово обозначает тканевую завесу при входе; «полог» отличает её от завес, составляющих ограду двора.
- source_word: פֶּתַח שַׁעַר
  choice: у входа в ворота
  rationale: Передаёт конструкцию, указывающую на входной проём ворот, без неестественной для русского языка избыточности.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: который окружает скинию и жертвенник
  rationale: Относительное предложение естественнее всего связывается с двором; סָבִיב выражено глаголом «окружает».
- source_word: מֵיתְרֵיהֶם
  choice: их верёвки
  rationale: Обозначает верёвки или шнуры, связанные с завесами и пологом; основное значение передано общеупотребительным словом, а вариант отмечен в сноске.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: все принадлежности для служения при них
  rationale: כְּלֵי передано широким словом «принадлежности», а עֲבֹדָה — словом «служение», сохраняющим рабочий и культовый оттенки.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: всё, что надлежит делать с ними
  rationale: Сохраняет пассивно-долженствующий смысл и наиболее вероятное контекстуальное указание на действия с перечисленными предметами.
- source_word: וְעָבָדוּ
  choice: Так пусть они совершают служение
  rationale: Передаёт предписывающую силу формы в данном законодательном контексте и культовый оттенок корня עבד; «так» связывает итоговую обязанность с перечислением.
