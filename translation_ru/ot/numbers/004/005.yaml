  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: ru
  text: Когда стан будет сниматься с места, Аарон и его сыновья войдут, снимут разделяющую завесу и покроют ею ковчег свидетельства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: войдут
  rationale: Глагол формально стоит в единственном числе, однако при составном подлежащем «Аарон и его сыновья» и последующих глаголах во множественном числе имеет собирательно-инструктивный смысл. «Войдут» естественно обозначает их вход в святилище для подготовки святынь к переносу.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Когда стан будет сниматься с места
  rationale: Инфинитив с ב задаёт временное обстоятельство. Русское выражение «сниматься с места» ясно передаёт начало движения стана.
- source_word: וְהוֹרִדוּ
  choice: снимут
  rationale: В контексте сворачивания скинии глагол означает опустить и убрать завесу с занимаемого ею места; «снимут» передаёт это естественно и точно.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: разделяющую завесу
  rationale: פָּרֹכֶת обозначает внутреннюю завесу святилища, а הַמָּסָךְ характеризует её как преграду или экран. «Разделяющая завеса» сохраняет предметную и культовую специфику без неестественной кальки «завеса преграды».
- source_word: וְכִסּוּ בָהּ
  choice: и покроют ею
  rationale: כסה значит «покрывать», а местоименный суффикс женского рода отсылает к завесе и выражает орудийное значение.
- source_word: אֲרֹן הָעֵדֻת
  choice: ковчег свидетельства
  rationale: В еврейском тексте стоит עֵדוּת — «свидетельство», а не בְּרִית — «завет». Перевод сохраняет исходное выражение, не заменяя его традиционным «ковчег завета».
theological_decisions:
- issue: Передача אֲרֹן הָעֵדֻת
  choice: ковчег свидетельства
  alternative: ковчег завета
  rationale: Исходный текст прямо употребляет слово «свидетельство». Более привычное выражение «ковчег завета» здесь заменило бы одно еврейское понятие другим и сгладило бы значимое лексическое различие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для обычного читателя; традиционные термины «стан», «завеса», «ковчег свидетельства» сохранены там, где они точны и понятны.
