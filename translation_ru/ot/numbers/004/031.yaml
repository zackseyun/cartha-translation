base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: ru
  text: 'И вот в чём состоит их обязанность по переноске для всего их служения при шатре собрания: брусья скинии[a], её перекладины, столбы и основания[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доски скинии». Еврейское слово обозначает жёсткие деревянные элементы её конструкции.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гнёзда» — опорные детали, в которые устанавливались брусья или столбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: И вот что
  rationale: Сохраняет соединительную силу וְ и естественно вводит последующее перечисление.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: им поручено переносить
  rationale: Передаёт сочетание назначенной ответственности (מִשְׁמֶרֶת) и конкретного груза для переноски (מַשָּׂא), избегая неестественного буквального выражения «обязанность их ноши».
- source_word: לְכָל עֲבֹדָתָם
  choice: при всяком их служении
  rationale: Передаёт полный объём назначенной работы; «служение» уместно в контексте скинии и не сводит выражение к отвлечённому богослужению.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Прямое и понятное обозначение святилища; предлог «в» сохраняет еврейскую конструкцию и указывает на сферу служения.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: брусья скинии
  rationale: קֶרֶשׁ обозначает жёсткие конструктивные деревянные элементы; «брусья» естественнее в русском описании сборного сооружения, тогда как «доски» могут создавать впечатление тонких пиломатериалов.
- source_word: בְרִיחָיו
  choice: её перекладины
  rationale: В данном строительном контексте это горизонтальные скрепляющие элементы; «перекладины» точнее общего «засовы».
- source_word: עַמּוּדָיו
  choice: столбы
  rationale: Нейтрально и точно обозначает вертикальные опоры переносной конструкции.
- source_word: אֲדָנָיו
  choice: основания
  rationale: Понятно передаёт опорные детали, в которые устанавливались брусья или столбы; технически возможное «гнёзда» вынесено в примечание.
