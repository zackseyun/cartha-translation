base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ru
  text: Таково служение родов потомков Мерари во всех их обязанностях при Шатре Встречи, под руководством Итамара, сына Аарона, священника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою Итамара»; это выражение обозначает руководство или надзор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Вот служение
  rationale: Указательное местоимение вводит итоговое определение обязанностей; «вот служение» естественно передаёт именную конструкцию и сохраняет культово-служебный смысл עֲבֹדָה.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: родов сынов Мерари
  rationale: מִשְׁפְּחֹת обозначает родовые подразделения внутри племенной структуры, а בְּנֵי сохраняется как традиционное генеалогическое «сыны».
- source_word: לְכָל עֲבֹדָתָם
  choice: все их обязанности
  rationale: В данном перечне выражение охватывает весь круг порученного им служения. «Обязанности» по-русски избегает тяжёлого повтора слова «служение», сохраняя административный смысл.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Предлог בְּ здесь указывает на сферу и место служения; «при» естественно для обязанностей, исполняемых в связи со святилищем. «Шатёр встречи» прозрачно передаёт אֹהֶל מוֹעֵד без внесения позднейшей терминологии.
- source_word: בְּיַד
  choice: под началом
  rationale: Буквально «рукой», но в контексте распределения левитских обязанностей это идиома надзора и административного руководства.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Ифамара, сына священника Аарона
  rationale: Передаёт родство и однозначно связывает определение «священник» с Аароном, как требует еврейская конструкция.
