base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: ru
  text: Елеазар, сын Аарона-священника, будет надзирать за маслом для освещения[a], благовонным курением, постоянным хлебным приношением[b] и маслом для помазания; ему поручен надзор за всей скинией и всем, что в ней, — за святилищем[c] и его утварью[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «маслом для света». Возможен перевод: «маслом для светильников»; речь идёт о масле, предназначенном для освещения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «непрерывным хлебным приношением». Еврейское слово указывает на приношение, совершаемое постоянно или регулярно.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «священным местом». Еврейское בְּ в заключительной сжатой конструкции может иметь пространственный оттенок («в святилище»), но здесь передано в соответствии с управлением слова «надзор».'
    reason: ambiguity
  - marker: d
    text: 'Или: «сосудами» или «принадлежностями». Еврейское слово обозначает различные предметы и орудия, относящиеся к святилищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: поручен надзор
  rationale: Существительное обозначает вверенную обязанность или надзор. Русская предикативная конструкция естественно передаёт эллиптическое именное построение еврейского текста.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: масло для светильника
  rationale: Передаёт назначение масла для освещения, при этом конкретизация как масла для светильника естественна в контексте скинии.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: благовонное курение
  rationale: Идиоматично передаёт курение, составленное из ароматических веществ, и сохраняет культовый регистр.
- source_word: מִנְחַת הַתָּמִיד
  choice: постоянное хлебное приношение
  rationale: מִנְחָה здесь означает бескровное, хлебное приношение, а תָּמִיד — совершаемое постоянно или регулярно; перевод не сужает значение до слова «ежедневное».
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Прямой и понятный перевод устойчивого культового выражения.
- source_word: כָּל הַמִּשְׁכָּן
  choice: вся скиния
  rationale: «Скиния» — установившееся и понятное обозначение переносного святилища; כָּל передано словом «вся».
- source_word: בְּקֹדֶשׁ
  choice: за святилищем
  rationale: В данном культовом контексте קֹדֶשׁ обозначает священное место или область. Предлог בְּ в сжатой конструкции передан в соответствии с русским управлением слова «надзор».
- source_word: וּבְכֵלָיו
  choice: и всеми его принадлежностями
  rationale: כֵּלִים охватывает сосуды, орудия и прочее оснащение скинии; «принадлежности» сохраняет широкое значение.
theological_decisions:
- issue: Синтаксическая функция повторного פְּקֻדַּת
  choice: Первая часть называет предметы, вверенные Елеазару, а вторая расширяет и обобщает его надзор, включая всю скинию и находящееся в ней.
  alternative: 'Второе פְּקֻדַּת можно понимать как приложение или итоговый заголовок: «надзор за всей скинией…», сохранив более отрывистую именную конструкцию.'
  rationale: Еврейский текст представляет собой сжатую именную конструкцию. Формула «поручен надзор… а также…» делает связь ясной по-русски, не определяя точнее, чем источник, административный характер полномочий Елеазара.
- issue: Связь בְּקֹדֶשׁ וּבְכֵלָיו с предшествующим
  choice: 'Фраза понята как уточнение содержания надзора: «за святилищем и всеми его принадлежностями».'
  alternative: 'Возможен более буквальный пространственный перевод: «в святилище и среди его принадлежностей».'
  rationale: Конечная фраза допускает сжатое пространственное прочтение, однако в контексте перечня обязанностей естественнее понимать её как пояснение к тому, что находится под надзором. Альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Сохранены привычные культовые термины «скиния», «курение», «приношение» и «помазание», но синтаксис сделан ясным для обычного читателя. Все сноски привязаны к соответствующим словам основного текста.
