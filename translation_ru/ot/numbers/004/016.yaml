  naturalness: «Елеазару, сыну священника Аарона» звучит менее естественно и может на мгновение создать впечатление, что «священник» относится не к Аарону как титул в приложении, а является частью цепочки родства. «Елеазар, сын Аарона-священника» ясно и литературно. Разделение двух повторяющихся оборотов «надзор» точнее отражает текст и делает фразу легче для восприятия.
