  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: ru
  text: Пересчитай также сыновей Гершона[a] по их отеческим домам, по их родам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подними голову сыновей Гершона»; это еврейское выражение означает пересчитать их, провести исчисление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Пересчитай
  rationale: Буквально выражение означает «подними голову», но в данном административном контексте это идиома со значением «пересчитать, провести исчисление». Русский глагол сохраняет повелительную форму и естественно передаёт смысл.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: сыновей Гершона
  rationale: Сохранена формальная родословная конструкция оригинала; она согласуется с последующим распределением по отеческим домам и родам.
- source_word: גַּם הֵם
  choice: также
  rationale: Передаёт включение сыновей Гершона в исчисление наряду с ранее названной группой; отдельное местоимение в русском не требуется.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отеческим домам
  rationale: «Отеческий дом» обозначает родовую единицу по отцовской линии и сохраняет принятую в тексте социально-родословную структуру.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте исчисления מִשְׁפָּחָה означает расширенную родовую группу, а не современную нуклеарную семью.
