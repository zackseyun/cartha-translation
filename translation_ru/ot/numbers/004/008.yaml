  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: ru
  text: И пусть расстелют поверх них ткань алого цвета, накроют стол покрывалом из кожи тахаша[a] и установят его шесты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. тахаш; точное значение слова неизвестно. Традиционные переводы предлагают, среди прочего, барсучью или дельфинью кожу либо, в более общем смысле, выделанную кожу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: пусть расстелют поверх них
  rationale: Глагол обозначает расстилание покрытия над предметами, перечисленными в предыдущем стихе; множественное местоимение сохранено.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: ткань алого цвета
  rationale: בגד здесь означает не одежду, а покрывающую ткань. Выражение תולעת שני указывает на алый материал или окраску; перевод не добавляет прямо не названную в тексте пряжу.
- source_word: וְכִסּוּ אֹתוֹ
  choice: и накроют её
  rationale: Единственное число еврейского суффикса передано местоимением женского рода, которое по смыслу относится к столу из ближайшего контекста; в русском род согласуется со словом «ткань», из-за чего референция остаётся несколько неоднозначной, как и при изолированном чтении стиха.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: покрывалом из кожи тахаша
  rationale: מכסה передано как «покрывало», а неопределённое название תחש сохранено транслитерацией, чтобы не приписывать ему спорную зоологическую идентификацию.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: затем вставят её шесты
  rationale: בדים — шесты для переноски священной утвари. «Вставят» естественно выражает их установку на место для переноса, хотя буквально глагол шире и означает «положат/поместят».
