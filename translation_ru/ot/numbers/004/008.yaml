- from: И пусть расстелют поверх них ткань алого цвета и накроют её покрывалом из кожи тахаша[a], затем вставят её шесты.
  to: И пусть расстелют поверх них ткань алого цвета, накроют стол покрывалом из кожи тахаша[a] и установят его шесты.
  rationale: Явно назван «стол», поскольку именно он является объектом еврейского «его» и владельцем шестов; это необходимая в русском языке контекстуальная экспликация, предотвращающая ошибочное отнесение к ткани. Остальные решения сохраняются.
