  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'Затем Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится как «ГОСПОДЬ».'
    reason: Указывает исходную форму Божьего имени и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Затем … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «затем» естественно передаёт эту связь. Глагол דבר обозначает речевое обращение, а в данной вводной формуле по-русски естественно «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, вводимого предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В этой формуле инфинитив «говоря» вводит последующую прямую речь. В современном русском ту же функцию естественно выполняет двоеточие, без архаичного оборота «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте стоит личное имя יהוה. Форма «Яхве» представляет его как имя; традиционная замена «ГОСПОДЬ» отмечена в сноске, а «Иегова» является иной исторической формой передачи.
translation_notes:
  register: Современный литературный русский язык. Порядок слов естественный и торжественно-нейтральный; двоеточие вместо буквального «говоря» ясно вводит последующую речь.
