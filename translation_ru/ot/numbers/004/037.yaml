source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: ru
  text: Вот исчисленные из родов каафитян — все, кто нёс служение при Шатре встречи, кого Моисей и Аарон исчислили по повелению Яхве, данному через Моисея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою Моисея».'
    reason: Сохраняется формальный вариант передачи еврейской идиомы בְּיַד מֹשֶׁה, обозначающей посредничество или осуществление через кого-либо.
lexical_decisions:
- source_word: פְקוּדֵי
  choice: исчисленные
  rationale: Форма от פקד в контексте переписи обозначает людей, учтённых при исчислении; субстантивированное «исчисленные» естественно связывается с последующим уточнением.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: из родов каафитян
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу; «роды» уместнее бытового «семьи» в контексте левитских подразделений. Коллективное наименование передано как «каафитяне».
- source_word: כָּל הָעֹבֵד
  choice: все, кто нёс служение
  rationale: Причастие עֹבֵד обозначает занятых служением; прошедшее время по-русски естественно в итоговой формуле переписи и не меняет характера их обязанности.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при Шатре встречи
  rationale: Предлог ב может обозначать место или сферу деятельности. «При Шатре встречи» естественно описывает левитское служение, не утверждая, что вся работа совершалась исключительно внутри шатра.
- source_word: אֲשֶׁר פָּקַד
  choice: кого ... исчислили
  rationale: В данном контексте פקד означает пересчитать, провести учёт, а не назначить.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Идиома буквально означает «по устам Яхве» и выражает действие согласно Божьему повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя, представленное тетраграмматоном, не заменяя его титулом.
- source_word: בְּיַד מֹשֶׁה
  choice: данному через Моисея
  rationale: Идиома «рукою Моисея» здесь указывает на посредничество Моисея; «через Моисея» ясно и естественно передаёт эту функцию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Соотношение Божьего повеления и посредничества Моисея
  choice: «по повелению Яхве, данному через Моисея»
  alternative: «по повелению Яхве рукою Моисея»
  rationale: Формулировка сохраняет Яхве как источник повеления, а Моисея — как посредника, не превращая вторую фразу в указание на того, кто непосредственно проводил исчисление.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Исчисленные» и «нёс служение» сохраняют переписной и культовый контекст; «Шатёр встречи» дан как устойчивое наименование святилища.
