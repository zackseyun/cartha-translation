  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: ru
  text: от тридцати лет и старше, до пятидесяти лет включительно, — каждый, кто поступает на службу[a], чтобы выполнять работу в Шатре Встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый, кто приходит для служения». Употреблённое здесь слово «служба» может обозначать организованное исполнение обязанностей, иногда с военным оттенком; в данном контексте речь идёт о службе левитов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: от тридцати лет и старше
  rationale: Еврейская возрастная идиома передана естественным современным русским выражением; нижняя граница включена.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: до пятидесяти лет включительно
  rationale: Выражение задаёт верхнюю границу возрастного диапазона; «включительно» устраняет возможную для русского читателя неясность конструкции «до пятидесяти».
- source_word: כָּל הַבָּא לַצָּבָא
  choice: каждый, кто поступает на службу
  rationale: Причастие בוא обозначает входящих или являющихся для исполнения обязанностей, а צבא здесь относится к организованной левитской службе, а не к войску.
- source_word: לַעֲבֹדָה
  choice: чтобы выполнять работу
  rationale: Сохраняется отличие עֲבֹדָה («работа, труд») от предшествующего צָבָא («организованная служба»), без неестественного повтора слова «служба».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: «Шатёр встречи» передаёт устойчивое название; «при» естественно обозначает место исполнения обязанностей и не сужает их исключительно до внутреннего пространства шатра.
