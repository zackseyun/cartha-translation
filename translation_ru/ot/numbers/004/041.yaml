  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: ru
  text: Вот исчисленные из семейств сыновей Гирсона — все, кто нёс служение в шатре встречи и кого Моисей и Аарон исчислили по повелению Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Вот исчисленные
  rationale: Именная конструкция подводит итог переписи. «Вот исчисленные» естественно звучит по-русски и не навязывает отсутствующее в еврейском тексте различие между настоящим и прошедшим временем.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: из семейств сыновей Гирсона
  rationale: Сохраняется родственная формула оригинала; «семейства» указывает на внутренние родовые подразделения.
- source_word: כָּל הָעֹבֵד
  choice: все, кто нёс служение
  rationale: Причастие от עבד обозначает людей, исполнявших порученное священное служение; выражение передано естественной русской глагольной конструкцией.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Предлог ב может обозначать не только нахождение внутри, но и сферу служения. По контексту речь идёт о служении, связанном с шатром встречи; буквальная пространственная передача отмечена в сноске.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: кого Моисей и Аарон исчислили
  rationale: Относительное придаточное сохранено, а повтор корня פקד передан повтором «исчислили», что связывает действие переписи с её итогом.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Идиома «по устам» означает действие согласно распоряжению; «по повелению» ясно передаёт её смысл и источник власти.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит тетраграмматон, поэтому личное имя сохранено непосредственно.
- issue: Характер работы сыновей Гирсона
  choice: нёс служение
  alternative: работал
  rationale: Контекст описывает установленное Богом служение левитов при святилище; «служение» передаёт культовый контекст без добавления особого конфессионального смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Слово «исчисленные» сохраняет связь с переписью и намеренную повторяемость корня; порядок фразы остаётся близким к еврейскому, но тире делает итоговое перечисление ясным.
