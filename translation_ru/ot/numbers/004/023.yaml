base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: ru
  text: Всех от тридцати до пятидесяти лет пересчитай — всех, кто приходит нести службу[a] и выполнять работу в шатре встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнять обязанность»; в еврейском тексте употреблено выражение из языка организованной, в том числе военной, службы, здесь относящееся к служению при святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: от тридцати до пятидесяти лет
  rationale: Еврейская возрастная формула естественно передаётся по-русски диапазоном; буквальное «от тридцати лет и выше до пятидесяти лет» было бы тяжеловесным.
- source_word: תִּפְקֹד אוֹתָם
  choice: пересчитай
  rationale: В контексте переписи פקד означает сосчитать или учесть; «пересчитай» понятно современному читателю и сохраняет прямое повеление.
- source_word: כָּל הַבָּא
  choice: всех, кто приходит
  rationale: Субстантивированное причастие с כָּל обозначает каждого, кто входит в указанную категорию.
- source_word: לִצְבֹא צָבָא
  choice: нести службу
  rationale: Оборот использует лексику организованной, в том числе военной, службы; русское «нести службу» сохраняет этот оттенок, не создавая впечатления буквального участия в войне.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: выполнять работу
  rationale: Сочетание однокоренных глагола и существительного подчёркивает исполнение порученной работы; выбранная формулировка естественна по-русски.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Передаёт устойчивое название святилища и локативное значение предлога בְּ без дополнительного толкования.
theological_decisions:
- issue: Следует ли передавать צבא как буквальную военную службу
  choice: нести службу
  alternative: исполнять воинскую повинность; воевать
  rationale: В Числах 4 речь идёт о назначенной левитам работе при святилище, а не о боевых действиях. При этом выражение «нести службу» сохраняет организационно-военный оттенок исходной лексики.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён ради ясности, а повтор «всех» сохранён как смысловое разъяснение состава пересчитываемых.
