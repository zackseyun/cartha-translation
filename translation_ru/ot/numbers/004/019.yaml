  terminology: «Величайшие святыни» допустимо как контекстуальное обозначение самых священных предметов, хотя это несколько интерпретативная формулировка. Сноска корректно сохраняет варианты пространственного понимания. «Служение» и «ноша» удачно передают עֲבֹדָה и מַשָּׂא в контексте переноски.
