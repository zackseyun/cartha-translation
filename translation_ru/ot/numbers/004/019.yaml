  source_fidelity: 'Вторая половина стиха передана неточно: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ עַל עֲבֹדָתוֹ וְאֶל־מַשָּׂאוֹ означает, что Аарон и его сыновья индивидуально распределят каафитов, назначив каждому его служение и его ношу. «Поставят каждого на ... и к его ноше» по-русски неестественно и размывает синтаксическую связь. «Войдут» также неоправданно конкретизирует יָבֹאוּ («придут»).'
