  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: ru
  text: 'Но сделайте для них вот что, чтобы они жили и не умерли, приближаясь к величайшим святыням[a]: пусть Аарон и его сыновья придут и назначат каждому[b] его служение и его ношу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Святому святых», «к самому святому месту». В данном контексте выражение, вероятнее всего, обозначает наиболее священные предметы, предназначенные для переноски.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «мужчина за мужчиной»; еврейское повторение подчёркивает, что каждому мужчине назначались его собственные служение и ноша.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Но поступайте с ними так
  rationale: Передаёт переход к предписанию и естественно выражает действие ради каафитов; русское «с ними» здесь идиоматичнее буквального «для них».
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: чтобы они остались живы и не умерли
  rationale: Последовательность выражает цель или ожидаемый результат предписанного действия.
- source_word: בְּגִשְׁתָּם
  choice: приближаясь
  rationale: Сохраняет временное значение конструкции и культовый оттенок приближения к святыне.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: величайшим святыням
  rationale: В контексте переноски речь, вероятнее всего, идёт о наиболее священных предметах; множественное число передаёт контекстуальный собирательный смысл, не устраняя иной возможной трактовки.
- source_word: יָבֹאוּ
  choice: пусть ... войдут
  rationale: Передаёт предписывающую силу имперфекта и естественно сочетается с контекстом входа священников для распределения обязанностей.
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  choice: и поставят каждого
  rationale: Глагол в сочетании с дистрибутивным повтором означает индивидуально определить или поставить каждого на его дело.
- source_word: עַל עֲבֹדָתוֹ
  choice: на назначенное ему служение
  rationale: «Служение» сохраняет культово-служебный смысл; добавление «назначенное ему» ясно передаёт распределение обязанностей.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: и к его ноше
  rationale: «Ноша» конкретно обозначает предмет или груз, который надлежало нести, и сохраняет связь с переноской святыни.
theological_decisions:
- issue: Значение קֹדֶשׁ הַקֳּדָשִׁים
  choice: «величайшие святыни» — наиболее священные предметы
  alternative: «Святое святых» или «самое святое место»
  rationale: Ближайший контекст посвящён предметам святилища, которые каафиты должны переносить после того, как священники их покроют. Однако форма выражения допускает пространственное понимание, поэтому оно отмечено в сноске.
- issue: Дистрибутивное אִישׁ אִישׁ
  choice: «каждого»
  alternative: буквально «мужчину за мужчиной» / «каждого мужчину»
  rationale: Контекст однозначно говорит о мужчинах-левитах, но по-русски дистрибутивный смысл естественно и точно передаётся словом «каждого» без гендерной нейтрализации референта.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Формулировка сохраняет предписывающий характер стиха, конкретный смысл переноски и неоднозначность выражения о величайшей святыне.
