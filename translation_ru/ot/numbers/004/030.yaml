base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: ru
  text: От тридцати лет и старше до пятидесяти лет пересчитай их — всех, кто приступает к служению[a], чтобы исполнять работу шатра встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «служение», может также обозначать организованное войско или отряд; здесь оно относится к установленным обязанностям левитов.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: От тридцати лет и старше
  rationale: Еврейская возрастная идиома передана естественно по-русски с сохранением нижней возрастной границы.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: вплоть до пятидесяти лет
  rationale: Передаёт верхнюю границу диапазона и усилительное значение עַד без неестественного буквализма.
- source_word: תִּפְקְדֵם
  choice: пересчитай их
  rationale: В контексте переписи פקד означает пересчитать или учесть людей, пригодных к назначенному служению.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: всех, кто поступает на службу
  rationale: Передаёт распределительное значение כָּל с причастием и организованный характер левитского служения, не создавая ложного впечатления о военной службе.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: чтобы выполнять работы
  rationale: Естественно передаёт однокоренное сочетание глагола עבד и существительного עֲבֹדָה, избегая тяжеловесного повтора «служить служение».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Сохраняет предметное значение אֹהֶל и значение назначенной встречи в מוֹעֵד; выражение остаётся понятным современному читателю.
theological_decisions:
- issue: Возможный военный оттенок слова צָבָא применительно к левитам
  choice: служба
  alternative: войско; воинская служба; ополчение
  rationale: Здесь речь идёт об организованном исполнении обязанностей при святилище, а не о боевых действиях. «Служба» сохраняет идею упорядоченного назначения, не привнося военного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность исходного текста, но избегает архаизмов и неестественных однокоренных повторов.
