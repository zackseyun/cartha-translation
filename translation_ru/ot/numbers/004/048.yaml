lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Всего … было
  rationale: Форма היה вводит итоговую численность; русская конструкция «всего … было» естественно передаёт итог переписи.
- source_word: פְּקֻדֵיהֶם
  choice: исчисленных мужчин
  rationale: В контексте переписи существительное обозначает внесённых в счёт. Уточнение «мужчин» соответствует ближайшему контексту Чис 4, где учитываются мужчины-левиты установленного возраста, пригодные для служения.
- source_word: שְׁמֹנַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וּשְׁמֹנִים
  choice: восемь тысяч пятьсот восемьдесят
  rationale: Стандартная русская передача последовательного сложения разрядов еврейского числительного.
theological_decisions:
- issue: Родовое обозначение участников переписи
  choice: исчисленных мужчин
  alternative: исчисленных; тех, кто был исчислен
  rationale: Мужской род здесь отражает не обобщающий грамматический род, а реальный состав учитываемой группы согласно контексту служения левитов; при этом сноска сохраняет более буквальные лексические варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским термином «исчисленные». Начальное «Всего» ясно обозначает итог переписи и позволяет избежать тяжеловесной буквальной конструкции.
