base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: ru
  text: Поверх стола Присутствия[a] они расстелют голубую ткань и положат на неё блюда, чаши, сосуды и кувшины для возлияний; хлеб, который постоянно лежит на нём, будет на нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «стол хлебов предложения». Буквально по-еврейски: «стол Присутствия» (или «стол лица»).'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «постоянный хлеб». Имеется в виду хлеб, который по установленному порядку постоянно находился перед Господом на этом столе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: стол Присутствия
  rationale: Буквально сочетание связано с «лицом/присутствием». Такой перевод сохраняет культовый смысл еврейского выражения, не подменяя его традиционным толкованием «стол хлебов предложения».
- source_word: יִפְרְשׂוּ
  choice: расстелют
  rationale: Глагол обозначает расстилание или простирание ткани поверх предмета; «расстелют» естественно передаёт это действие по-русски.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: голубую ткань
  rationale: תְּכֵלֶת обозначает характерный сине-голубой, возможно сине-пурпурный цвет храмового текстиля. «Голубая ткань» понятно современному читателю и не создаёт ложной точности в оттенке.
- source_word: הַקְּעָרֹת
  choice: блюда
  rationale: Речь идёт о плоских столовых или культовых сосудах; «блюда» естественно в данном перечне.
- source_word: הַכַּפֹּת
  choice: чаши
  rationale: Название сосуда допускает разные конкретизации, включая ложкообразные ёмкости. «Чаши» сохраняет общий характер обозначения без уверенного приписывания точной формы.
- source_word: הַמְּנַקִּיֹּת
  choice: сосуды
  rationale: Точное устройство и назначение этого редкого культового предмета неясны. Общее слово «сосуды» сохраняет неопределённость оригинала и избегает архаичных либо чрезмерно конкретных вариантов.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: кувшины для возлияний
  rationale: Сочетание обозначает ёмкости, связанные с совершением возлияния. «Кувшины для возлияний» ясно передаёт предполагаемую функцию и естественно звучит по-русски.
- source_word: לֶחֶם הַתָּמִיד
  choice: хлеб же должен постоянно находиться на столе
  rationale: 'Вместо неестественного термина «постоянный хлеб» перевод раскрывает смысл: предписанный хлеб постоянно находится на столе. Упоминание стола восстанавливает явный референт местоимения עָלָיו.'
- source_word: עָלָיו יִהְיֶה
  choice: должен постоянно находиться на столе
  rationale: Конструкция выражает предписанное состояние хлеба на столе. «Должен находиться» естественно передаёт нормативный оттенок контекста; наречие «постоянно» соответствует הַתָּמִיד.
