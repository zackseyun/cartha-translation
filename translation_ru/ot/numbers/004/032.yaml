  terminology: «Основания», «колья» и «верёвки» уместны для устройства шатрового святилища. «Снаряжение» лучше избегает повторения «принадлежности» и соответствует широкому כְּלִים. «Работы/служение» сохраняет административно-культовый оттенок עֲבֹדָה, не превращая его в обслуживание конструкций.
