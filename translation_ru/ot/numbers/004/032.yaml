base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: ru
  text: и столбы по периметру двора, их основания, колья и верёвки — всё их снаряжение для всех связанных с ними работ; поимённо распределите предметы, вверенные им для переноски.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предметы обязанности их ноши». Смысл, вероятно: «назначьте каждому предметы, которые он должен нести».'
    reason: Еврейское выражение כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם необычно сжато; буквальная передача тяжеловесна, а контекст указывает на поимённое распределение ответственности за переносимые предметы.
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: столбы вокруг двора
  rationale: עַמּוּדִים обозначает несущие столбы или опоры, а סָבִיב указывает на их расположение по периметру двора. Такой порядок слов естественен для современного русского языка.
- source_word: אַדְנֵיהֶם
  choice: их основания
  rationale: В описаниях святилища אֶדֶן — основание или гнездо, в которое устанавливался столб. «Основания» понятно широкому читателю и не требует технического пояснения.
- source_word: יְתֵדֹתָם
  choice: колья
  rationale: יָתֵד здесь обозначает колья, которыми закрепляли шатровую конструкцию.
- source_word: מֵיתְרֵיהֶם
  choice: верёвки
  rationale: מֵיתָר — верёвка или шнур для закрепления шатровых конструкций; «верёвки» — ясное и естественное русское соответствие.
- source_word: לְכָל כְּלֵיהֶם
  choice: со всеми их принадлежностями
  rationale: 'כְּלִים имеет широкое значение: предметы, орудия, принадлежности. В данном контексте речь идёт о сопутствующем оснащении, а не только о священных сосудах.'
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: и всем необходимым для их обслуживания
  rationale: עֲבֹדָה может означать работу, служение или исполнение обязанностей. Здесь выражение относится к работе с перечисленными частями двора; перевод передаёт эту связь без тяжеловесного буквального оборота.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: поимённо распределите
  rationale: פקד с בְשֵׁמוֹת указывает на персональное назначение или распределение ответственности, а не просто на подсчёт.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: принадлежности, за переноску которых они отвечают
  rationale: Сжатое еврейское выражение соединяет понятия предметов, вверенной обязанности и ноши. Русский перевод передаёт ответственность за конкретные переносимые предметы, сохраняя административный оттенок מִשְׁמֶרֶת.
