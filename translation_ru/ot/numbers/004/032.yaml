  source_fidelity: 'Перечень деталей двора передан в целом точно: столбы, основания, колья и верёвки соответствуют еврейскому тексту. Однако «всем необходимым для их обслуживания» сужает עֲבֹדָתָם до технического обслуживания предметов, тогда как слово означает весь объём назначенной работы/служения. Заключительное выражение передаёт индивидуальное распределение переносимых предметов, но его можно сформулировать точнее и естественнее.'
