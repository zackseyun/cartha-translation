  text: 'Вот служение семейств гирсонитян: служить и носить грузы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для служения и ношения грузов».'
    reason: Передаёт заключительные формы как обозначение назначения; «ноша/груз» — возможные значения מַשָּׂא.
lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное слово открывает именное предложение; «вот» естественно представляет последующее определение обязанностей.
- source_word: עֲבֹדַת
  choice: служение
  rationale: Слово обозначает работу, службу или обязанность; «служение» уместно в контексте обязанностей левитов.
- source_word: מִשְׁפְּחֹת
  choice: семейств
  rationale: Форма множественного числа в сопряжённом состоянии обозначает родовые семейные группы.
- source_word: הַגֵּרְשֻׁנִּי
  choice: гирсонитян
  rationale: Коллективное обозначение потомков Гирсона естественно передаётся русским множественным этнонимом.
- source_word: לַעֲבֹד
  choice: служить
  rationale: Инфинитив с ל выражает назначение; русский инфинитив сохраняет связь со словом «служение».
- source_word: וּלְמַשָּׂא
  choice: и переносить тяжести
  rationale: מַשָּׂא означает груз, ношу или то, что переносят; выражение ясно передаёт практическую обязанность в данном контексте.
