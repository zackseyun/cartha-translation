  language: ru
  text: И исчисленных из них по их родам было две тысячи семьсот пятьдесят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: И … было
  rationale: Последовательная форма с וַ передаёт продолжение повествования и вводит итог подсчёта; русская конструкция «И … было» естественно сохраняет связочный смысл.
- source_word: פְקֻדֵיהֶם
  choice: исчисленных из них
  rationale: В контексте переписи слово обозначает тех, кто был учтён. Причастная форма сохраняет результативно-пассивный оттенок и не добавляет отсутствующее в данном стихе слово «мужчин».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовое подразделение внутри израильской племенной структуры; «по их родам» точно и естественно для языка переписи.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: две тысячи семьсот пятьдесят
  rationale: Числительное передано словами в обычной русской форме с точным сохранением количества.
