  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: ru
  text: А на золотой жертвенник пусть расстелют синюю ткань, покроют его покрывалом из кожи тахаша[a] и установят его шесты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное значение древнееврейского слова «тахаш» неизвестно. Возможно, это название животного или вида кожи; предлагаются переводы «прочная кожа», «кожа дюгоня» и другие.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: золотой жертвенник
  rationale: Естественная русская передача сочетания «жертвенник золота»; обозначает покрытый золотом жертвенник без ненужного уточнения.
- source_word: יִפְרְשׂוּ
  choice: пусть расстелют
  rationale: Передаёт предписывающую силу формы и обычное значение глагола פרשׂ — «расстилать, разворачивать».
- source_word: בֶּגֶד תְּכֵלֶת
  choice: синюю ткань
  rationale: בֶּגֶד здесь означает ткань или полотно, а תְּכֵלֶת — характерный синий либо сине-пурпурный цвет; краткая формулировка не создаёт ложной точности оттенка.
- source_word: וְכִסּוּ אֹתוֹ
  choice: покроют его
  rationale: Перфект с союзом продолжает последовательность предписаний; местоимение относится к жертвеннику.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: покрывалом из кожи тахаша[a]
  rationale: Сохраняет конкретное, но неустановленное название תָּחַשׁ и не выдаёт спорную идентификацию животного за достоверную.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: и вставят его шесты
  rationale: בַּדִּים — шесты для переноски священной утвари; «вставят» естественно передаёт их установку на место в данном ритуальном контексте.
