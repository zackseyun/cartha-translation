  rationale: Исправление устраняет невыраженное в оригинале «им поручены», непосредственно передаёт связь служения с קֹדֶשׁ הַקֳּדָשִׁים и заменяет неясную архаическую формулу на естественное современное обозначение предметов. Примечание сохраняет спорную возможность понимания выражения как названия внутреннего святилища.
