  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: ru
  text: Вот служение сыновей Каафа в шатре собрания, касающееся самых святых предметов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Святое святых» или «самое святое место». В данном контексте выражение, вероятно, относится к наиболее священным предметам, а не только к внутреннему помещению святилища.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное слово вводит определение порученного служения; «вот» естественно передаёт еврейскую конструкцию с подразумеваемой связкой.
- source_word: עֲבֹדַת
  choice: служение
  rationale: В данном контексте обозначает установленную священную обязанность, а не просто физическую работу.
- source_word: בְּנֵי קְהָת
  choice: сыновей Каафа
  rationale: Сохраняет родственное обозначение оригинала и соответствует традиционной русской передаче имени.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Предлог ב обозначает сферу и место служения; «при» звучит естественно применительно к обязанностям, включающим действия возле шатра и с его принадлежностями.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: святыни великие
  rationale: Русская библейская формула передаёт превосходную степень святости и в данном контексте может обозначать наиболее священные предметы, не ограничивая смысл внутренним помещением.
theological_decisions:
- issue: Значение קֹדֶשׁ הַקֳּדָשִׁים
  choice: Наиболее священные предметы, порученные сынам Каафа
  alternative: Святое святых как внутреннее помещение святилища
  rationale: Дальнейший контекст перечисляет предметы святилища, которые должны были переносить потомки Каафа. Однако сама идиома допускает пространственное понимание, поэтому оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский с умеренно библейским, торжественным оттенком. Формула «святыни великие» сохраняет привычную сакральную лексику и неоднозначность еврейского выражения; пояснение вынесено в сноску.
