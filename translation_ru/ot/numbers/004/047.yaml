    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: от тридцати лет и старше
  rationale: Естественно передаёт нижнюю возрастную границу, сохраняя направленность выражения וָמַעְלָה «и выше».
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: до пятидесяти лет
  rationale: Кратко и естественно обозначает верхнюю границу указанного возрастного диапазона.
- source_word: כָּל הַבָּא
  choice: всякий, кто приходит
  rationale: Сохраняет субстантивированное причастие глагола בוא и не вводит отсутствующих в тексте понятий назначения или допуска.
- source_word: לַעֲבֹד
  choice: исполнять
  rationale: Передаёт целевое значение инфинитива и позволяет отличить глагол от следующих существительных עֲבֹדָה.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: работу служения
  rationale: Сохраняет оба элемента еврейского сочетания и его служебный смысл, не делая русский текст чрезмерно тяжеловесным.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: и работу по переносу тяжестей
  rationale: מַשָּׂא обозначает ношу или груз; перевод конкретно передаёт обязанность переносить тяжести и сохраняет повтор עֲבֹדַת.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Буквально передаёт предлог בְ и устойчивое название אֹהֶל מוֹעֵד современным понятным русским языком.
