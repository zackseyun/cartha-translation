- from: Вот служение семейств потомков Гирсона при шатре встречи. За исполнением возложенных на них обязанностей[a] надзирает Ифамар[b], сын священника Аарона.
  to: Вот служение семейств потомков Гирсона при шатре встречи; их обязанности[a] находятся под надзором Ифамара[b], сына Аарона, священника.
