base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: ru
  text: Вот служение семейств потомков Гирсона при шатре встречи; их обязанности[a] находятся под надзором Ифамара[b], сына Аарона, священника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их поручение» или «их вверенная ответственность»; еврейское слово обозначает назначенную обязанность или порученное попечение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руке Ифамара» — то есть в его ведении, под его надзором или руководством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Вот служение
  rationale: Именная конструкция вводит описание назначенного служения; «вот» естественно передаёт указательное זֹאת, а «служение» соответствует труду при святилище.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: семейств потомков Гирсона
  rationale: «Семейства» сохраняет родовую структуру מִשְׁפְּחֹת, а «потомки Гирсона» естественно передаёт генеалогическое значение конструкции с בְּנֵי.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: «Шатёр встречи» непосредственно передаёт אֹהֶל מוֹעֵד; предлог «при» обозначает сферу служения и не создаёт впечатления, будто вся работа совершалась только внутри шатра.
- source_word: וּמִשְׁמַרְתָּם
  choice: за исполнением возложенных на них обязанностей
  rationale: מִשְׁמֶרֶת обозначает порученное дело, обязанность или ответственность; развёрнутая формулировка естественно связывается по-русски с последующим указанием на надзор.
- source_word: בְּיַד אִיתָמָר
  choice: надзирает Ифамар
  rationale: Идиома «в руке Ифамара» означает, что служение находится под его надзором или руководством; буквальная калька по-русски была бы неясна.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Ифамар, сын священника Аарона
  rationale: Сохраняется личное имя и родственная идентификация; определение «священник» грамматически относится к Аарону.
theological_decisions:
- issue: Характер власти Ифамара над служением гирсонитов
  choice: Передано как практический надзор без уточнения объёма власти
  alternative: Передать как полную власть или как личное исполнение обязанностей Ифамаром
  rationale: Идиома בְּיַד указывает на руководство или надзор, но сама по себе не определяет административные детали и не означает, что Ифамар выполнял порученную работу вместо гирсонитов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Выбрано понятное «шатёр встречи» вместо традиционного, но менее прозрачного «скиния собрания»; еврейская административная идиома передана естественной русской конструкцией, а буквальный образ сохранён в примечании.
