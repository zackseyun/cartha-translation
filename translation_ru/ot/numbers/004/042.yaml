lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: И исчисленные
  rationale: Причастно-субстантивированная форма передаёт людей, учтённых при исчислении; союз וּ сохранён как «И».
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: из родов сыновей Мерари
  rationale: מִשְׁפְּחֹת обозначает родовые подразделения; «сыны Мерари» сохраняет библейское обозначение потомков Мерари.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Предлог לְ здесь выражает распределение или классификацию при переписи.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Сохранён характерный для текста термин, обозначающий отцовские родовые дома, без сведения его к современному понятию семьи.
