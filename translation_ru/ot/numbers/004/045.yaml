source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: ru
  text: Вот исчисленные из родов сыновей Мерари, которых Моисей и Аарон исчислили по повелению Яхве[a], переданному через Моисея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве», то есть по повелению Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея», то есть через Моисея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Вот исчисленные
  rationale: Формула подводит итог переписи. «Исчисленные» передаёт значение פקד в данном контексте и сохраняет связь с последующим глаголом, а «вот» естественно выражает указательное אֵלֶּה.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: из родов сыновей Мерари
  rationale: «Роды» уместно обозначает подразделения левитского рода, а «сыновья Мерари» сохраняет еврейское выражение родства.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: которых Моисей и Аарон исчислили
  rationale: Относительное местоимение относится к людям; повтор «исчисленные — исчислили» отражает общий корень פקד и подчёркивает переписной контекст.
- source_word: עַל־פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Еврейская идиома буквально говорит «по устам Яхве», но в современном русском естественно означает действие по его повелению; буквальный образ сохранён в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся собственное Божье имя, представленное тетраграмматоном, а не заменяется титулом «Господь».
- source_word: בְּיַד מֹשֶׁה
  choice: переданному через Моисея
  rationale: 'Идиома «рукой Моисея» выражает посредничество: повеление Яхве было сообщено через Моисея. Такая формулировка естественна по-русски и не создаёт ложного впечатления физического действия рукой.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Связь Божьего повеления с посредничеством Моисея
  choice: «по повелению Яхве, переданному через Моисея»
  alternative: «по устам Яхве, рукой Моисея»
  rationale: Перевод сохраняет различие между источником повеления и посредником, не устраняя необычную для читателя деталь, что Моисей одновременно участвует в исчислении и передаёт повеление.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Слово «исчисленные» выбрано ради точности и лексической связи с глаголом, тогда как еврейские идиомы в основном тексте переданы естественно и раскрыты в примечаниях.
