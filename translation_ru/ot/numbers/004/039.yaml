lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: от тридцати лет и старше
  rationale: Естественно передаёт древнееврейский возрастной оборот и нижнюю границу диапазона.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: до пятидесяти лет
  rationale: Ясно обозначает верхнюю границу возраста.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: всех поступающих на службу
  rationale: В контексте исчисления левитов выражение означает вступление в организованное служение; перевод сохраняет динамику בוא и не придаёт צבא исключительно военного значения.
- source_word: לַעֲבֹדָה
  choice: чтобы исполнять работу
  rationale: Передаёт цель служения и различает עֲבֹדָה («работа, служение») и предшествующее צבא («организованная служба»).
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Предлог «при» естественно обозначает работу в шатре и при нём, не сужая её лишь до действий внутри сооружения; «шатёр встречи» прозрачно передаёт название святилища.
