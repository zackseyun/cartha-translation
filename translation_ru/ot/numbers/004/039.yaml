  verdict: revise
  source_fidelity: 'В черновике верно переданы возрастные пределы и различие между צבא («служба») и עבודה («работа»). Однако «всех поступающих» поставлено в винительном падеже без управляющего слова и тем самым создаёт не имеющуюся в еврейском тексте объектную конструкцию. Причастие כָּל־הַבָּא следует передать как подлежащее: «все, поступающие». Предлог בְ в данном случае точнее передать «в», а не «при».'
  naturalness: Предлагаемая правка устраняет синтаксически неудачное «— всех поступающих» и сохраняет намеренную незавершённость стиха, который продолжает перечень из предшествующего контекста. «Шатёр Встречи» читается как устойчивое название святилища; написание с прописных букв помогает этому.
  terminology: «Служба» для צבא и «работа» для עבודה сохраняют лексическое различие оригинала. «Шатёр Встречи» является прозрачной современной передачей אֹהֶל מוֹעֵד и не вносит конфессиональной интерпретации.
  issues:
  - severity: medium
    issue: Необоснованный винительный падеж в «всех поступающих».
    rationale: Еврейское כָּל הַבָּא — «все/каждый, кто приходит (поступает)»; в данном фрагменте это не прямое дополнение. Русское «всех» требует подразумеваемого управляющего глагола, которого в стихе нет.
  - severity: low
    issue: «При шатре встречи» менее точно передаёт בְ.
    rationale: Предлог בְ обозначает место служения; «в Шатре Встречи» ближе к исходному тексту. Контекст служебных обязанностей не требует расширять значение до действий около шатра.
  revised_text: От тридцати лет и старше, до пятидесяти лет, — все, поступающие на службу для работы в Шатре Встречи.
