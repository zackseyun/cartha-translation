  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: ru
  text: Не истребляйте из среды левитов племя каафитянских родов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не отсеките из среды левитов племя каафитянских родов». Еврейский глагол может означать «отсечь» или «истребить»; слово, переведённое как «роды», также может передаваться словом «семейства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: не дайте
  rationale: Отрицательная частица выражает запрет; вместе с каузативной формой следующего глагола естественно передаётся по-русски конструкцией «не дайте…».
- source_word: תַּכְרִיתוּ
  choice: исчезнуть
  rationale: Каузативная форма глагола כרת означает «истребить, отсечь, привести к исчезновению». Конструкция «не дайте… исчезнуть» ясно передаёт ответственность адресатов и не уточняет не названный в стихе механизм гибели.
- source_word: שֵׁבֶט
  choice: племени
  rationale: В генеалогическом контексте обозначает племенную группу; «племя» — обычное и понятное русское соответствие.
- source_word: מִשְׁפְּחֹת
  choice: семейств
  rationale: Форма множественного числа в сопряжённом состоянии обозначает семейные или родовые группы каафитян; основной текст сохраняет буквальное «семейств».
- source_word: הַקְּהָתִי
  choice: каафитян
  rationale: Еврейское собирательное обозначение потомков Каафа естественно передаётся русским множественным этнонимом.
- source_word: מִתּוֹךְ
  choice: из среды
  rationale: Передаёт удаление изнутри более широкой группы и сохраняет образную структуру еврейского выражения.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Традиционное и общепонятное русское наименование; каафитяне представлены как группа внутри левитов.
theological_decisions:
- issue: Характер угрозы каафитянам
  choice: Запрет не допустить исчезновения племенной группы каафитян из среды левитов.
  alternative: Прямой запрет истреблять род каафитян.
  rationale: Сам стих не называет способ, которым каафитяне могут погибнуть; контекст связывает опасность с обращением со святынями. Перевод сохраняет широкое значение и не вносит контекстуальное объяснение в основной текст.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Формулировка понятна широкому читателю; «из среды» сохраняет умеренно возвышенный регистр, а сноска отмечает реальные лексические альтернативы.
