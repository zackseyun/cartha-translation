base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: ru
  text: Пусть затем возьмут ткань голубого цвета[a] и покроют ею светильник для освещения, его лампады, щипцы, совки и все сосуды для масла, которыми служат при светильнике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ткань сине-пурпурного цвета». Еврейское תְּכֵלֶת обозначает характерный окрашенный материал, использовавшийся в убранстве святилища; точный оттенок определить трудно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ткань голубого цвета
  rationale: בֶּגֶד здесь обозначает не одежду, а покрывную ткань; תְּכֵלֶת — характерный для святилища окрашенный материал голубого или сине-пурпурного оттенка. Основной текст передаёт наиболее понятное обозначение цвета, а оттеночная неоднозначность отмечена в сноске.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: светильник для освещения
  rationale: מְנוֹרָה — светильник на подставке, а הַמָּאוֹר указывает на свет или освещение. Функциональное «для освещения» естественно по-русски и не смешивает этот предмет с отдельными лампадами.
- source_word: נֵרֹתֶיהָ
  choice: его лампады
  rationale: נֵרֹת — отдельные масляные лампы, установленные на светильнике. «Лампады» ясно отличает их от светильника как целого и соответствует культовому контексту.
- source_word: מַלְקָחֶיהָ
  choice: щипцы
  rationale: Слово обозначает инструмент для ухода за фитилями или огнём. «Щипцы» сохраняет общий смысл, не приписывая предмету более узкую функцию, которая прямо не названа.
- source_word: מַחְתֹּתֶיהָ
  choice: совки
  rationale: מַחְתָּה может обозначать совок, жаровню или сосуд для углей. В контексте ухода за лампадами «совки» естественно обозначает принадлежности для удаления нагара или остатков горения и не создаёт ошибочной ассоциации исключительно с курением благовоний.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: все сосуды для масла
  rationale: כְּלֵי — сосуды или принадлежности, связанные с маслом светильника. Выражение «сосуды для масла» кратко и понятно передаёт их назначение.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: которыми служат при светильнике
  rationale: בָּהֶם указывает на названные во множественном числе сосуды как орудия служения, а לָהּ — на светильник. Такая формулировка сохраняет культовый оттенок שׁרת и обе связи, избегая неестественного буквального «служат ему ими».
