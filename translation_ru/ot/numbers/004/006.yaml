base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: ru
  text: Они должны покрыть его покровом из кожи тахаша[a], а поверх него расстелить ткань сплошь синего цвета и установить его шесты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово תַּחַשׁ (тахаш) имеет неясное значение; возможно, оно обозначает кожу определённого животного. Среди традиционных вариантов перевода — козья кожа, кожа морской свиньи или дюгоня.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Пусть они накроют его
  rationale: В последовательности обрядовых предписаний форма передаёт повелительно-процедурный смысл. Глагол «накроют» естественно выражает помещение покрытия поверх ковчега.
- source_word: כְּסוּי
  choice: покрытием
  rationale: Существительное обозначает покров или покрытие; творительный падеж обусловлен русской конструкцией «накрыть чем».
- source_word: עוֹר תַּחַשׁ
  choice: из кожи тахаша
  rationale: Точное значение תַּחַשׁ неизвестно. Транслитерация сохраняет лексическую неопределённость исходного текста и не навязывает спорного определения животного; пояснение дано в сноске.
- source_word: וּפָרְשׂוּ
  choice: а сверху расстелют
  rationale: Глагол означает «расстилать, разворачивать». Союз «а» и наречие «сверху» естественно передают переход к следующему верхнему слою.
- source_word: בֶגֶד
  choice: ткань
  rationale: Хотя слово часто означает одежду, здесь речь идёт о материале, который расстилают как покрытие.
- source_word: כְּלִיל תְּכֵלֶת
  choice: целиком синюю
  rationale: כְּלִיל подчёркивает полноту окраски, а תְּכֵלֶת обозначает характерный синий или сине-пурпурный краситель скинии. Основной текст использует ясное традиционное «синий».
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: В данном контексте слово указывает, что синяя ткань образует верхний слой.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: и вставят его шесты
  rationale: Глагол означает «поместить, установить». С учётом назначения шестов и контекста переноски «вставят» ясно выражает возвращение шестов на предназначенное место без избыточного пояснения.
