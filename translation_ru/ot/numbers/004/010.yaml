  text: Пусть положат её и все её принадлежности в покрытие из кожи тахаша[a], а затем положат её на шест для переноски.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово תַּחַשׁ (тахаш) имеет неясное значение. Возможно, оно обозначает кожу определённого животного или особый вид прочной кожи; традиционные переводы предлагают разные отождествления.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ אֹתָהּ
  choice: пусть положат её
  rationale: В последовательности предписаний форма וְנָתְנוּ передаёт очередное требуемое действие. Местоимение женского рода отсылает к светильнику из предыдущего стиха.
- source_word: כָּל כֵּלֶיהָ
  choice: все её принадлежности
  rationale: כֵּלִים обозначает предметы, принадлежности или утварь; «принадлежности» естественно и достаточно широко передаёт значение в данном контексте.
- source_word: אֶל מִכְסֵה
  choice: в покрытие
  rationale: После נתן предлог אֶל здесь указывает на помещение предметов внутрь защитного покрытия.
- source_word: עוֹר תַּחַשׁ
  choice: кожа тахаша
  rationale: Точное значение תַּחַשׁ неизвестно. Транслитерация сохраняет неопределённость исходного текста и не навязывает спорного отождествления животного или типа кожи.
- source_word: עַל הַמּוֹט
  choice: на шест для переноски
  rationale: מוֹט в единственном числе означает шест или перекладину для переноски. Перевод сохраняет конкретный образ и выраженную в еврейском тексте форму единственного числа.
