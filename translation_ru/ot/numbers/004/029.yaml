  text: בְּנֵ֖י מְרָרִ֑י לְ/מִשְׁפְּחֹתָ֥/ם לְ/בֵית אֲבֹתָ֖/ם תִּפְקֹ֥ד אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: ru
  text: Сыновей Мерари[a] исчисли по их родам, по их отцовским домам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть потомков Мерари, мераритов.
    reason: lexical_alternative
  - marker: b
    text: «Отцовский дом» — родственная группа, принадлежность к которой определялась по отцовской линии.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: сыновей Мерари
  rationale: Буквально «сыновья Мерари»; в контексте переписи выражение охватывает его потомков. Перевод сохраняет родовой образ исходного текста, а примечание поясняет более широкое значение.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри колена; «роды» естественнее и точнее для данного устройства, чем современное узкое «семьи».
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским домам
  rationale: Сохранено устойчивое древнеизраильское генеалогическое выражение, обозначающее группы родства по отцовской линии; культурный смысл пояснён в примечании.
- source_word: תִּפְקֹד
  choice: исчисли
  rationale: В контексте переписи פקד означает пересчитать и учесть. «Исчисли» передаёт повелительную форму единственного числа и официальный характер действия без добавления военного оттенка.
- source_word: אֹתָם
  choice: сыновей Мерари (как прямое дополнение)
  rationale: Местоимение прямого дополнения относится к сынам Мерари; в русском синтаксисе объект выражен в начале предложения и не требует повторного «их».
