id: NUM.4.20
reference: Numbers 4:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: ru
  text: Но они не должны входить, чтобы посмотреть на святыни даже на мгновение[a], иначе умрут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даже на миг». Еврейское выражение неоднозначно: оно может означать очень краткий взгляд либо взгляд на святыни в то время, когда их покрывают.'
    reason: Лексическая неоднозначность выражения כְבַלַּע.
lexical_decisions:
- source_word: וְלֹא
  choice: Но ... не должны
  rationale: Союз продолжает предписание и вводит предостережение; «но» естественно передаёт контраст с предыдущим стихом, а конструкция «не должны» — запретительный смысл.
- source_word: יָבֹאוּ
  choice: входить
  rationale: В данном контексте глагол означает вход внутрь, к святыням; русский инфинитив после «не должны» ясно передаёт запрет.
- source_word: לִרְאוֹת
  choice: чтобы посмотреть на
  rationale: Передаёт целевую конструкцию и возможный оттенок намеренного взгляда, не усиливая его до пристального разглядывания.
- source_word: כְבַלַּע
  choice: даже на мгновение
  rationale: Трудное идиоматическое выражение может обозначать предельно краткий взгляд; иной возможный смысл — взгляд во время укрывания святынь — сохранён в сноске.
- source_word: אֶת הַקֹּדֶשׁ
  choice: на святыни
  rationale: Форма единственного числа здесь допускает собирательное понимание и в ближайшем контексте относится к священным предметам скинии.
- source_word: וָמֵתוּ
  choice: иначе умрут
  rationale: Естественно по-русски выражает смертельное последствие нарушения запрета.
theological_decisions:
- issue: Референт הַקֹּדֶשׁ
  choice: святыни, то есть священные предметы
  alternative: святилище; святыня в собирательном или отвлечённом смысле
  rationale: Контекст Чисел 4 посвящён покрытию и переносу предметов скинии; множественное «святыни» передаёт конкретный собирательный референт, не превращая его в обозначение места.
- issue: Смысл כְבַלַּע
  choice: даже на мгновение
  alternative: когда святыни покрывают
  rationale: Еврейское выражение неоднозначно. Основной текст передаёт традиционно засвидетельствованный временной смысл, а контекстуально возможное понимание, связанное с покрытием святынь, явно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и торжественно-сдержанная. «Святыни» понятно обозначает священные предметы, а «иначе умрут» сохраняет прямоту предупреждения.
