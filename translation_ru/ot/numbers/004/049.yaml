base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: ru
  text: 'По повелению Яхве[a] через Моисея[b] их учли: каждого — в соответствии с его служением и с тем, что он должен был нести. Их исчисление[c] было произведено так, как Яхве повелел Моисею.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея»; то есть через Моисея или при его посредстве.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово трудно для передачи и буквально может означать «его исчисленные (люди)» или «его исчисление». Оно происходит от того же корня, что и «учли» в начале стиха; в данном контексте речь идёт о переписи, связанной с распределением служения и переносимой ноши.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: По повелению Яхве
  rationale: Идиома буквально означает «по устам Яхве», но здесь обозначает действие по его повелению. Личное имя יְהוָה передано как «Яхве».
- source_word: פָּקַד אֹתָם
  choice: они были учтены
  rationale: В контексте переписи левитов פקד обозначает административный учёт, связанный с распределением обязанностей. «Учтены» сохраняет связь с переписью, не исключая назначения на служение.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея»; идиома указывает на посредничество или исполнителя действия. Естественное русское соответствие — «через Моисея».
- source_word: אִישׁ אִישׁ
  choice: каждый
  rationale: Повтор существительного имеет распределительное значение и подчёркивает, что служение и ноша определялись для каждого мужчины отдельно.
- source_word: עַל עֲבֹדָתוֹ
  choice: по своему служению
  rationale: עֲבֹדָה здесь означает порученное левиту служение при скинии; предлог עַל в распределительной конструкции естественно передаётся как «по».
- source_word: וְעַל מַשָּׂאוֹ
  choice: и по своей ноше
  rationale: מַשָּׂא обозначает то, что человек должен нести, в данном контексте — части и принадлежности скинии. «Ноша» передаёт конкретный смысл и сохраняет краткость.
- source_word: וּפְקֻדָיו
  choice: Так Моисей учёл их
  rationale: Форма трудна и буквально может относиться к «учтённым им». В связном русском предложении она передана как итоговое повторение действия учёта; местоименный суффикс соотнесён с Моисеем.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: как повелел ему Яхве
  rationale: 'В итоговой формуле אֲשֶׁר имеет значение соответствия: учёт был произведён так, как Яхве повелел Моисею.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие.
- issue: Связь учёта с назначением на служение
  choice: Сохранить основной смысл переписи, не исключая распределения обязанностей
  alternative: Перевести פקד исключительно как «назначил»
  rationale: Контекст Чисел 4 — перепись пригодных к служению левитов с указанием их обязанностей. Значение «учесть» лучше удерживает оба аспекта и не превращает многозначный глагол только в богословски или административно понимаемое назначение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён ради ясности, но итоговое повторение учёта сохранено. «Ноша» выбрана как понятное и конкретное обозначение предметов, которые левит должен был переносить.
