  naturalness: «По своему служению и по своей ноше» понятно, но конструкция с двукратным «по» менее естественна, чем «в соответствии с его служением и тем, что он должен был нести». «Так Моисей учёл их» звучит гладко, но именно эта гладкость достигается ценой излишней интерпретации. Предлагаемый текст сохраняет современный литературный регистр и яснее членит перечисление.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Учли/исчисление» соответствует переписному контексту פקד, не сводя его к назначению. Для מַשָּׂא описательное «то, что он должен был нести» точнее и современнее, чем потенциально абстрактная «ноша».
