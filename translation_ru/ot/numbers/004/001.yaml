  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); традиционная передача — «Господь».'
    reason: Уточнение формы Божьего имени и традиционного варианта передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма глагола דבר вводит повествовательную речь. По-русски «сказал» естественно открывает прямую речь; более буквальное «говорил» здесь звучало бы менее естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно передаёт адресатов речи; повтор предлога אֶל не требует механического воспроизведения.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартная еврейская формула введения последующей прямой речи в современном русском естественно передаётся двоеточием, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык, сжатая и естественная повествовательная формула. Двоеточие подготавливает прямую речь в следующем стихе.
