  text: Они должны удалить с жертвенника пепел и расстелить на нём пурпурную ткань[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистить жертвенник». Еврейский глагол в этом обрядовом контексте означает удаление с жертвенника золы; возможен также смысл «удалить жирную золу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: пусть они удалят пепел
  rationale: Пиэль глагола דשׁן в данном культовом контексте обозначает удаление с жертвенника пепла и жирных остатков жертвоприношений. Формулировка «удалят пепел» естественна в современном русском языке и точнее общего «очистят».
- source_word: הַמִּזְבֵּחַ
  choice: с жертвенника
  rationale: מִזְבֵּחַ — обычное обозначение жертвенника; русское управление передаёт удаление пепла с его поверхности.
- source_word: וּפָרְשׂוּ
  choice: и расстелют
  rationale: פרשׂ означает разворачивать или расстилать. «Расстелют» естественно описывает помещение ткани поверх жертвенника.
- source_word: עָלָיו
  choice: на нём
  rationale: Предлог עַל с местоименным суффиксом указывает, что покрывало помещают поверх жертвенника; «на нём» сохраняет это пространственное отношение.
- source_word: בֶּגֶד
  choice: покрывало
  rationale: Хотя בגד часто означает одежду или ткань, здесь это текстильное покрытие культового предмета. «Покрывало» ясно передаёт его функцию.
- source_word: אַרְגָּמָן
  choice: пурпурное
  rationale: אַרְגָּמָן обозначает материал, окрашенный пурпуром. При существительном «покрывало» прилагательное естественно передаёт цвет, не уточняя сверх текста вид ткани или красителя.
