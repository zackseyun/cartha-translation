  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: ru
  text: Пусть они возьмут все принадлежности служения, которыми служат в святилище, завернут их в синюю ткань, покроют покровом из кожи тахаша[a] и положат их на шест[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово תָּחַשׁ (тахаш) имеет неясное значение. Возможно, речь идёт о коже определённого животного либо об особом виде прочной кожи.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на перекладину». Еврейское слово стоит в единственном числе и может обозначать шест, жердь или часть приспособления для переноски.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Пусть они возьмут
  rationale: В последовательности предписаний форма передаёт очередное обязательное действие; конструкция с «пусть» естественно выражает это в современном русском языке.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: все принадлежности для служения
  rationale: כְּלִי обозначает предметы, сосуды или принадлежности, а הַשָּׁרֵת указывает на их назначение для священного служения.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: которыми совершают служение
  rationale: Предлог ב выражает средство, а שרת в данном культовом контексте означает исполнение священного служения.
- source_word: בַּקֹּדֶשׁ
  choice: в святилище
  rationale: Буквально «в святом [месте]»; по контексту речь идёт о священном пространстве скинии без обязательного ограничения внутренним отделением.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ткань из синей пряжи
  rationale: בֶּגֶד здесь означает полотнище или ткань, а תְּכֵלֶת — характерный синий краситель либо окрашенную им пряжу; формулировка подходит контексту упаковки.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: покрывало из кожи тахаша
  rationale: Точное значение תָּחַשׁ неизвестно. Транслитерация не выдаёт спорную идентификацию животного за установленную и сопровождается пояснением.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: и поместят на шест
  rationale: В еврейском тексте стоит единственное число הַמּוֹט — «шест, жердь, перекладина». Основной текст сохраняет это число и предметную неопределённость.
