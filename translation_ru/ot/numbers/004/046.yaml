base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: ru
  text: Все исчисленные левиты[a], которых исчислили Моисей, Аарон и вожди Израиля, по их родам и отеческим домам[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все учтённые», «все внесённые в список». В еврейском тексте употреблён глагол פקד, здесь относящийся к переписи.'
    reason: lexical_alternative
  - marker: b
    text: «Отеческие дома» — родовые домохозяйства, или семейные подразделения внутри родов.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Все исчисленные
  rationale: Передаёт совокупность учтённых при переписи людей и сохраняет повтор корня פקד в следующей части стиха.
- source_word: אֲשֶׁר פָּקַד
  choice: которых исчислили
  rationale: Относительное придаточное и официальное исчисление переданы естественно для современного литературного русского; повтор соответствует повтору еврейского корня.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: и вожди Израиля
  rationale: נשיאים обозначает глав, руководителей племён; «вожди» здесь ясно и не создаёт монархической ассоциации слова «князья».
- source_word: אֶת הַלְוִיִּם
  choice: из числа левитов
  rationale: Левиты являются группой, внутри которой были исчислены названные люди; формулировка устраняет неестественное русское удвоение объекта.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри племенной организации, а не только ближайшую семью.
- source_word: וּלְבֵית אֲבֹתָם
  choice: и отчим домам
  rationale: Сохраняет традиционный библейский термин для родовых домохозяйств, организованных по отцовской линии.
