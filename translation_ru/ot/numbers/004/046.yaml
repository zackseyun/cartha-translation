revisions:
- from: Все исчисленные[a], которых исчислили Моисей, Аарон и вожди Израиля из числа левитов, по их родам и отчим домам[b] —
  to: Все исчисленные левиты[a], которых исчислили Моисей, Аарон и вожди Израиля, по их родам и отеческим домам[b] —
  rationale: Исправлен термин, который в современном русском создаёт ложное значение «дома отчимов». «Отеческие дома» передаёт בית אבות как родовые единицы по отцовской линии; сохранены повтор переписной лексики, перечисление действующих лиц и незавершённый синтаксис, продолжающийся в следующем стихе.
