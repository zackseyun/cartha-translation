  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно передаётся как «Господь».'
    reason: Указывает форму божественного имени в исходном тексте и распространённый традиционный вариант передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма wayyiqtol продвигает повествование; союз «и» сохраняет последовательную связь с предыдущим текстом, а «сказал» естественно передаёт речевой акт в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно обозначает адресатов речи. Повтор еврейского предлога перед вторым именем не воспроизводится механически, поскольку по-русски оба имени однозначно относятся к глаголу «сказал».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула введения прямой речи естественно передаётся по-русски двоеточием, поскольку содержание высказывания следует далее.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не заменяя титулом; традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формула сохранена без архаизмов. Двоеточие естественно вводит речь, продолжающуюся в следующем стихе.
