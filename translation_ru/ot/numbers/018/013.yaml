review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь о первинках всего, что находится в земле народа и приносится ГОСПОДУ; эта доля принадлежит Аарону, и есть её может всякий ритуально чистый член его дома. Однако оборот «всего, что в их земле» в современном русском звучит неполно и несколько двусмысленно; «что есть в их земле» точнее и естественнее передаёт בְּאַרְצָם. В заключительной части единственное число еврейского суффикса лучше сохранить русским собирательным «это».'
  naturalness: «Всякий чистый в твоём доме» грамматически возможен, но воспринимается как характеристика человека, находящегося в доме, а не как обозначение члена дома. Формулировка «Каждый в твоём доме, кто чист» яснее и современнее. «Может есть это» естественно выражает разрешённое право в законодательном контексте.
  terminology: «Первые плоды» является приемлемой современной передачей בִּכּוּרֵי. «ГОСПОДУ» последовательно передаёт тетраграмматон в принятой стилистике. «Чист» в основном тексте сохраняет краткость оригинала, а сноска корректно уточняет ритуальный смысл без богословского навязывания.
  issues:
  - severity: low
    issue: Неполная и несколько неестественная конструкция «что в их земле».
    rationale: 'Еврейское בְּאַרְצָם означает «в их земле/стране», однако по-русски в данном относительном обороте требуется естественное сказуемое: «что есть в их земле».'
  - severity: low
    issue: Не вполне ясная привязка выражения «в твоём доме».
    rationale: Фраза «Всякий чистый в твоём доме» может означать всякого чистого человека, который физически находится в доме. Конструкция «Каждый в твоём доме, кто чист» лучше передаёт принадлежность к домашнему сообществу.
  - severity: low
    issue: Множественное «их» вместо собирательного единственного объекта.
    rationale: Русское согласование с «первые плоды» допустимо, но еврейский суффикс единственного числа относится к совокупной доле приношения. «Может есть это» сохраняет эту собирательность и устраняет стилистическую шероховатость.
  revised_text: Первые плоды всего, что есть в их земле и что они принесут ГОСПОДУ, будут твоими. Каждый в твоём доме, кто чист, может есть это[a].
  revised_footnotes:
