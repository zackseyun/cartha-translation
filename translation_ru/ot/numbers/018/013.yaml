  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: ru
  text: Первые плоды всего, что есть в их земле и что они принесут ГОСПОДУ, будут твоими. Каждый в твоём доме, кто чист, может есть это[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть каждый в твоём доме, кто ритуально чист.
    reason: Уточняет контекстуальное значение еврейского טָהוֹר в священническом законодательстве.
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: первые плоды
  rationale: Передаёт первые созревшие плоды урожая, приносимые как посвящённая доля; это естественный и устойчивый русский эквивалент.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: всего, что в их земле
  rationale: Близко сохраняет широкую формулировку еврейского текста, не сужая её до конкретного вида сельскохозяйственной продукции.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: что они принесут ГОСПОДУ
  rationale: Глагол буквально означает «принесут»; контекст приношения понятен без добавочного пояснения в основном тексте.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Традиционная русская передача тетраграмматона, типографически выделенная прописными буквами.
- source_word: לְךָ יִהְיֶה
  choice: будут твоими
  rationale: Естественно передаёт принадлежность этой доли Аарону; множественное согласование обусловлено русским выражением «первые плоды».
- source_word: כָּל טָהוֹר
  choice: всякий чистый
  rationale: Сохраняет краткость и допускает контекстуально обусловленное ритуальное значение; оно уточнено в сноске.
- source_word: בְּבֵיתְךָ
  choice: в твоём доме
  rationale: Формально близко к еврейскому выражению и в данном контексте обозначает членов домашнего сообщества Аарона.
- source_word: יֹאכֲלֶנּוּ
  choice: может есть их
  rationale: Имперфект в контексте выражает разрешённое право вкушать эту долю. Местоимение «их» согласовано с русским множественным «плоды», хотя в еврейском стоит суффикс единственного числа, отсылающий к собирательному предмету приношения.
theological_decisions:
- issue: Значение «чистый» в священническом законодательстве
  choice: ритуально чистый член дома Аарона может есть эту священническую долю
  alternative: нравственно чистый человек в общем смысле
  rationale: Контекст распределения священных приношений и правил чистоты указывает на обрядовую, а не обобщённо-нравственную чистоту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис сохраняет структуру исходного текста, но остаётся понятным обычному читателю; термин «ритуально чист» вынесен в сноску, чтобы не перегружать основной текст толкованием.
