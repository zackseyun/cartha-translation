revisions:
- from: Первые плоды всего, что в их земле и что они принесут ГОСПОДУ, будут твоими. Всякий чистый в твоём доме может есть их[a].
  to: Первые плоды всего, что есть в их земле и что они принесут ГОСПОДУ, будут твоими. Каждый в твоём доме, кто чист, может есть это[a].
  rationale: Правка не меняет смысла, но делает русский синтаксис более естественным, яснее обозначает членов дома Аарона и передаёт собирательное единственное число объекта вкушения. Сноска сохранена с приведением в соответствие с новой формулировкой текста.
