id: NUM.18.28
reference: Numbers 18:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: ru
  text: Так и вы отделяйте приношение Яхве из всех ваших десятин, которые вы получаете от сынов Израиля[a], и из них отдавайте приношение Яхве священнику Аарону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля».'
    reason: Лексическая альтернатива поясняет идиоматическое значение буквальной древнееврейской формулы.
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: 'Передаёт соответствие предшествующему повелению: левиты должны поступать так же, как израильтяне.'
- source_word: תָּרִימוּ
  choice: отделяйте
  rationale: В сочетании с תְּרוּמָה глагол означает выделение посвящённой доли; «отделяйте» естественно передаёт требуемое действие и не сводит его к жертвоприношению.
- source_word: גַם אַתֶּם
  choice: и вы
  rationale: Сохраняет акцент на том, что левиты также обязаны выделять долю из получаемого ими.
- source_word: תְּרוּמַת יְהוָה
  choice: приношение Яхве
  rationale: «Приношение» обозначает посвящённую Богу долю, не уточняя сверх текста способ её передачи; дательный оборот сохраняет возможный оттенок принадлежности или предназначения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: от всех ваших десятин
  rationale: «Десятина» — устоявшийся и точный русский эквивалент מַעֲשֵׂר; предлог «от» передаёт выделение части из целого.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: которые будете получать от сынов Израиля
  rationale: В данном установлении לקח описывает законное получение левитами десятин. Будущее время естественно выражает повторяющееся предписанное действие, а «сыны Израиля» сохраняет форму исходного выражения.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: и из полученного отдавайте
  rationale: 'Формулировка сохраняет партитивный смысл: Аарону передаётся доля из ранее полученных десятин; она также позволяет естественно передать единственное число местоименного суффикса при множественном «десятины».'
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: Аарону-священнику
  rationale: Передаёт Аарона как получателя и сохраняет его титул; дефисное приложение звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет буквальную родовую формулу и её мужскую форму; сноска сообщает естественный русский эквивалент без устранения особенности оригинала.
- issue: Характер תְּרוּמַת יְהוָה
  choice: приношение Яхве
  alternative: доля Яхве
  rationale: «Приношение» удерживает культовое посвящение доли Богу, но не утверждает, что речь обязательно идёт о жертве на алтаре.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Повелительные формы несовершенного вида передают постоянное установление; синтаксис упрощён без утраты последовательности действий.
