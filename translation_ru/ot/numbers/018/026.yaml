source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: ru
  text: 'Обратись к левитам и скажи им: «Когда вы будете брать у сынов Израиля десятину, которую Я дал вам от них как ваше наследие, возносите из неё приношение Яхве[a] — десятину от десятины[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношение для Яхве»; традиционно: «возношение Господу».'
    reason: Лексическая и синтаксическая альтернатива для תְּרוּמַת יְהוָה.
  - marker: b
    text: То есть десятую часть от десятины, полученной левитами.
    reason: Пояснение выражения «десятина от десятины».
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: левитам
  rationale: Общепринятое и естественное русское обозначение членов колена Левия.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: скажи так
  rationale: Два близких глагола образуют формулу введения прямой речи; по-русски её смысл естественно передаётся компактным «скажи так» без тяжеловесного повтора.
- source_word: כִּי תִקְחוּ
  choice: когда вы будете брать
  rationale: כִּי вводит предусмотренное законом обстоятельство, а не выражает сомнительное условие.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальную форму устойчивого древнееврейского обозначения народа Израиля; менее буквальные варианты — «израильтяне» и «народ Израиля».
- source_word: הַמַּעֲשֵׂר
  choice: десятина
  rationale: Точный и понятный традиционный термин для обязательной десятой доли.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם בְּנַחֲלַתְכֶם
  choice: которую Я дал вам от них как ваше наследие
  rationale: Сохраняет и речь Бога о даровании, и источник десятины, и её роль как удела левитов.
- source_word: וַהֲרֵמֹתֶם
  choice: возносите
  rationale: В культовом контексте Hiphil от רום означает отделить и представить долю как священное приношение; «возносите» сохраняет образ и остаётся узнаваемым в русском библейском языке.
- source_word: תְּרוּמַת יְהוָה
  choice: приношение Яхве
  rationale: Передаёт תְּרוּמָה как отделяемую и представляемую Богу долю, а конструкцию с יְהוָה — естественным русским целевым значением, не исключая оттенка принадлежности.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: десятину от десятины
  rationale: 'Сохраняет повтор исходного слова и партитивное значение מִן: десятую долю из полученной десятины.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: Значение תְּרוּמַת יְהוָה
  choice: приношение Яхве
  alternative: приношение для Яхве; приношение, принадлежащее Яхве
  rationale: Еврейская конструкция допускает оттенки назначения и принадлежности. Краткая русская форма сохраняет эту смысловую ёмкость, не закрепляя лишь один оттенок.
- issue: Обозначение covenantного народа בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранена грамматически мужская и родовая формула оригинала без вывода о составе всех фактических плательщиков десятины.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Прямая речь оформлена естественно; сохранены «сыны Израиля», имя «Яхве» и культовый глагол «возносите». Все маркеры сносок размещены непосредственно при соответствующих выражениях.
