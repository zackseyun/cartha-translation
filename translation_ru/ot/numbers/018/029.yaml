  verdict: revise
  source_fidelity: Добавление «полученных вами» не выражено в еврейском тексте, хотя и выводимо из широкого контекста. Кроме того, «каждое приношение» недостаточно ясно передаёт כָּל в формуле כָּל תְּרוּמַת יְהוָה; естественнее и ближе к тексту — «все приношения Яхве». Следует также сохранить заключительное מִמֶּנּוּ («из них/из него»), не поглощая его полностью предыдущим оборотом.
  naturalness: «Возносите» уместно в современном литературном русском и сохраняет культовый оттенок הֵרִים. Переработанный синтаксис делает связь между лучшей частью даров и отделяемой святыней яснее, не перегружая стих.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Приношения» и «священная часть» передают культовую лексику без конфессионального истолкования. Буквальный «тук» в сноске корректно объяснён как образ отборной части.
