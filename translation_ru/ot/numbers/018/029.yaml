  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: ru
  text: 'Из всех ваших даров возносите Яхве все приношения: из всего лучшего в них — священную часть, выделенную из них.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: из всех полученных вами даров
  rationale: 'מִן с כֹּל указывает на выделение части из всей совокупности даров. Добавленное «полученных» естественно передаёт контекст: речь идёт о дарах, переданных левитам, а не о дарах, принадлежащих им изначально.'
- source_word: תָּרִימוּ
  choice: возносите
  rationale: Форма Hiphil от רוּם сохраняет культовый образ поднятия и соответствует принятому русскому термину «возношение», не сводя действие к нейтральному «отдавайте».
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: каждое приношение Яхве
  rationale: תְּרוּמָה обозначает выделяемое и возносимое приношение. «Каждое» передаёт כָּל при существительном в единственном числе, а «Яхве» сохраняет личное имя יהוה.
- source_word: מִכָּל חֶלְבּוֹ
  choice: из всего лучшего в них
  rationale: חֵלֶב буквально означает «жир, тук», но применительно к совокупности даров обозначает самую отборную, лучшую часть. Местоимение во множественном числе естественно соотносит выражение с русским «дары».
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: освящённую часть
  rationale: В данном контексте מִקְדָּשׁ с суффиксом понимается как часть дара, отделённая в качестве святыни. Значение מִמֶּנּוּ — выделение из дара — уже ясно выражено оборотом «из всего лучшего в них», поэтому буквальное повторение «из него» по-русски избыточно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Связь «лучшей» и «освящённой» части
  choice: Освящённая часть выделяется из лучшего
  alternative: «Лучшее» и «освящённая часть» могут читаться как два названия одной и той же доли
  rationale: 'Двоеточие и тире сохраняют сжатую приложительную конструкцию еврейского текста: приношение следует брать из лучшей части, и эта выделенная доля становится освящённой. Формулировка не уточняет сверх текста точное логическое отношение между определениями.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной культовой лексикой. «Возносите» сохраняет библейский жертвенный образ, а синтаксис упрощён ровно настолько, чтобы стих был понятен без утраты смысловой плотности оригинала.
