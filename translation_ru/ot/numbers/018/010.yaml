  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: ru
  text: Ешь это в особо святом месте[a]; всякий мужчина может есть это. Это будет для тебя святыней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в святыне святынь» (традиционно: «во святом святых»). Здесь это выражение указывает на особо святую, предназначенную для такой пищи зону; оно не обязательно означает внутреннее помещение святилища — Святое святых.'
    reason: Сохраняет буквальную еврейскую идиому и поясняет, почему основной текст не отождествляет указанное место с внутренним Святым святых.
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: на особо святом месте
  rationale: Предлог בְּ сохраняет пространственное значение, а сочетание «святость святынь» передаёт превосходную степень. Такая формулировка естественна по-русски и не создаёт ошибочного впечатления, будто пищу следовало есть внутри храмового Святого святых.
- source_word: תֹּאכֲלֶנּוּ
  choice: ешь это
  rationale: Форма второго лица мужского рода единственного числа обращена к Аарону. Настоящее время повелительного наклонения естественно передаёт предписывающий характер древнееврейского имперфекта в русском законодательном наставлении.
- source_word: כָּל זָכָר
  choice: всякий мужчина
  rationale: Существительное זָכָר прямо обозначает лицо мужского пола; перевод сохраняет установленное текстом ограничение и не превращает его в обобщённое «каждый».
- source_word: יֹאכַל אֹתוֹ
  choice: может есть это
  rationale: В контексте форма выражает право допущенных мужчин есть святыню, а не обязательность того, чтобы каждый из них непременно ел её.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: для тебя это будет святыней
  rationale: «Святыня» естественно обозначает предмет, имеющий священный статус, и сохраняет связь с ключевым словом קֹדֶשׁ; единственное число «тебя» отражает обращение к Аарону.
theological_decisions:
- issue: К кому относится наставление и кому разрешено есть
  choice: Единственное число сохранено как обращение к Аарону, представляющему священство; следующая фраза распространяет разрешение на всякого мужчину из подразумеваемого контекстом круга священников.
  alternative: Понимать обращение как относящееся исключительно к Аарону лично.
  rationale: Ближайший контекст говорит о доле Аарона и его сыновей, а фраза «всякий мужчина» расширяет применение наставления, не отменяя формы единственного числа в прямом обращении.
- issue: Пространственное или классифицирующее значение בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: 'В основном тексте передано пространственно: «на особо святом месте».'
  alternative: «Ешь это как великую святыню», то есть понимать выражение прежде всего как указание на разряд приношения.
  rationale: Предлог בְּ допускает прямое пространственное прочтение, соответствующее правилам употребления священнической доли. Поскольку классифицирующее прочтение также возможно, неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified законодательным тоном. Обращение на «ты» соответствует древнееврейскому единственному числу и обычному библейскому регистру. Повтор «есть это» сохранён ради ясности и параллелизма исходного текста.
