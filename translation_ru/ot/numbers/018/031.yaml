base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: ru
  text: Вы и ваши домашние[b] можете есть это[a] в любом месте, потому что это ваша плата[c] за службу в Шатре Встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете есть это» или «должны есть это»; еврейская форма в данном правовом контексте может выражать предписание или разрешение, а не простое прошедшее время.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ваш дом»; здесь имеются в виду домашние, а не здание.'
    reason: cultural_note
  - marker: c
    text: 'Или: «вознаграждение», «оплата» или «возмещение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: можете есть это
  rationale: В данном правовом контексте еврейская форма выражает разрешённое действие, а не простое прошедшее время. Такая передача ясно показывает, что левитам разрешено употреблять эту долю в пищу.
- source_word: בְּכָל מָקוֹם
  choice: в любом месте
  rationale: Выражение снимает ограничение на употребление этой доли только в священном месте и естественно звучит по-русски.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: вы и ваши домашние
  rationale: Слово בַּיִת здесь обозначает домашних, то есть людей, составляющих семейно-домашнюю общину, а не здание.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного разрешения; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: שָׂכָר
  choice: плата
  rationale: Существительное обозначает вознаграждение за исполненный труд или службу. «Плата» кратко и естественно передаёт этот смысл.
- source_word: חֵלֶף
  choice: за
  rationale: В сочетании со словом «плата» русский предлог «за» естественно выражает возмещение за исполненную службу, не создавая избыточной конструкции.
- source_word: עֲבֹדַתְכֶם
  choice: службу
  rationale: В контексте обязанностей левитов слово означает установленное служение при святилище; «служба» сохраняет этот официальный оттенок.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в Шатре встречи
  rationale: Передача следует еврейскому предлогу и сохраняет устойчивое наименование святилища как Шатра встречи.
theological_decisions:
- issue: Характер доли левитов
  choice: Съедобная доля представлена как законная плата за службу левитов, которую разрешено есть в любом месте.
  alternative: Понимать эту долю как священную трапезу, которую можно совершать только в культовом пространстве.
  rationale: Прямое указание «в любом месте» отличает эту долю от святынь, употребление которых было пространственно ограничено. Перевод сохраняет это правовое и богословское различие.
translation_notes:
  register: Современный литературный русский язык с ясным правовым оттенком. Формулировка сохраняет достоинство библейской речи без архаизмов; «домашние» передаёт состав домашней общины, а «Шатёр встречи» используется как устойчивое наименование святилища.
