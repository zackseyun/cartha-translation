  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: ru
  text: 'Тех, кто подлежит выкупу, выкупай с месячного возраста по твоей оценке: пять сиклей серебра, по священному сиклю; он[a] равен двадцати герам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть священный сикль равен двадцати герам.
    reason: Еврейское местоимение буквально означает «он» и относится к священному сиклю как к установленной мере веса.
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: подлежащего выкупу
  rationale: Пассивная форма от פדה с суффиксом 3-го лица мужского рода единственного числа синтаксически трудна. В контексте речь идёт о первенце, которого следует выкупить; русское причастное выражение сохраняет пассивный смысл и единственное число еврейской формы.
- source_word: מִבֶּן חֹדֶשׁ
  choice: начиная с месячного возраста
  rationale: 'Оборот обозначает возрастной порог: выкуп совершается по достижении одного месяца.'
- source_word: תִּפְדֶּה
  choice: выкупай
  rationale: Имперфект 2-го лица мужского рода единственного числа в правовом предписании передан русским повелительным наклонением длительно-нормативного характера.
- source_word: בְּעֶרְכְּךָ
  choice: по твоей оценке
  rationale: Сохраняется юридический смысл установленной оценки и обращение во 2-м лице единственного числа.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: пять сиклей серебра
  rationale: Естественная русская форма для обозначения установленного веса серебра.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Фраза указывает на нормативный вес, связанный со святилищем; традиционное «священный сикль» кратко и ясно передаёт этот стандарт.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: он равен двадцати герам
  rationale: Местоимение сохранено, а русский мужской род естественно соотносит его со «сиклем». Глагол «равен» ясно выражает весовое соотношение.
