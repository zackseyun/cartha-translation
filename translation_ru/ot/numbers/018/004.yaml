base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: ru
  text: Они присоединятся к тебе и будут исполнять вверенную им обязанность при шатре встречи, выполняя всё служение при шатре; но никто посторонний[a] не должен приближаться к вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человек, не допущенный к этому служению; еврейское слово не обязательно означает иноплеменника.
    reason: Уточнение культового, а не этнического значения слова זָר.
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: присоединятся к тебе
  rationale: Нифаль глагола לוה с предлогом על выражает присоединение левитов к Аарону для совместного, вспомогательного служения.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: будут исполнять порученные обязанности
  rationale: Сочетание שׁמר с מִשְׁמֶרֶת в священническом контексте обозначает соблюдение и исполнение вверенной службы; формулировка передаёт как обязанность, так и факт поручения.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прямое и понятное обозначение святилища, сохраняющее значение встречи в слове מוֹעֵד.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: совершая всё служение в шатре
  rationale: עֲבֹדָה здесь относится к установленному служению при святилище, а не просто к обычной работе.
- source_word: וְזָר
  choice: но никто посторонний
  rationale: В данном культовом контексте זָר означает человека, не допущенного к соответствующему священному служению, а не обязательно иноплеменника.
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: не должен приближаться к вам
  rationale: קרב в законах о святилище означает приближение к священной сфере; множественное אֲלֵיכֶם передано формой «к вам», в отличие от предшествующего единственного «к тебе».
theological_decisions:
- issue: Значение זָר в законах о святилище
  choice: посторонний — человек вне круга допущенных к данному служению
  alternative: чужеземец; иноплеменник; чужой
  rationale: Контекст устанавливает границы доступа и служебных полномочий, а не этническое различие. Перевод не должен создавать впечатление, будто запрет основан на происхождении.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранена смена числа местоимений: сначала единственное «к тебе» (Аарон), затем множественное «к вам». Термины служения переданы ясно, без архаизмов и конфессионально специфической лексики.'
