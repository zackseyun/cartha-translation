  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: левиты присоединяются к Аарону, исполняют вверенную им обязанность, связанную с шатром встречи и всем служением при шатре; доступ посторонним запрещён. Однако «порученные обязанности» безлично меняет единственное מִשְׁמֶרֶת («обязанность/поручение, вверенная служба») на множественное число и добавляет характеристику, которая лишь подразумевается. Более прямое «вверенную им обязанность» точнее сохраняет конструкцию.'
  naturalness: 'Перевод литературный и понятный. Формулировка «выполняя всё служение при шатре» естественнее, чем «совершая всё служение в шатре»: предлог «при» лучше передаёт служебную деятельность, относящуюся к святилищу, не ограничивая её физическим нахождением внутри шатра.'
  terminology: «Шатёр встречи» последовательно передаёт אֹהֶל מוֹעֵד. «Посторонний» в основном тексте и пояснение в сноске удачно отражают культовое значение זָר как лица, не имеющего разрешённого статуса, а не этнического чужеземца. Смена «тебе» на «вам» сохранена.
