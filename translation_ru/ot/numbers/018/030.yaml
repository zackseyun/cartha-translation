  to: 'И скажи им: «Когда вы вознесёте от этой десятины её лучшую часть[a], она будет засчитана левитам как урожай с гумна и как урожай из виноградной давильни».'
  rationale: Уточнён контекстуальный референт суффикса — десятина — и устранено неудачное для современного русского сочетание «урожай из точила». Сохранены образ отделяемой лучшей доли, расчётно-правовой оттенок «будет засчитана» и параллелизм гумна и давильни.
