base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: ru
  text: 'И скажи им: «Когда вы вознесёте от этой десятины её лучшую часть[a], она будет засчитана левитам как урожай с гумна и как урожай из виноградной давильни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его жир»; здесь это выражение означает самую отборную, лучшую часть урожая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: И скажи им
  rationale: Естественно передаёт обращённое к Моисею повеление во втором лице единственного числа.
- source_word: בַּהֲרִימְכֶם
  choice: Когда вы вознесёте
  rationale: Форма Hiphil от רום обозначает поднятие или представление доли как приношения; «вознесёте» сохраняет культовый образ исходного выражения.
- source_word: חֶלְבּוֹ
  choice: лучшую часть
  rationale: Буквально «его жир»; применительно к плодам земли חֵלֶב идиоматически означает самую отборную, лучшую долю.
- source_word: מִמֶּנּוּ
  choice: из неё
  rationale: Местоимение относится к десятине, упомянутой в ближайшем контексте; согласование с русским словом «десятина» требует женского рода.
- source_word: וְנֶחְשַׁב
  choice: это зачтётся
  rationale: Передаёт пассивную форму и присущий חשׁב расчётно-правовой оттенок; нейтральное «это» не конкретизирует сверх текста точный объём того, что засчитывается.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Дательный падеж естественно передаёт отношение, выраженное предлогом לְ.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: как урожай с гумна
  rationale: Сохраняет сельскохозяйственный образ и значение תְּבוּאָה как урожая или полученного продукта.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: и как урожай из точила
  rationale: יֶקֶב обозначает точило или давильню; «точило» — краткий и уместный в библейском контексте русский эквивалент, параллельный «гумну».
