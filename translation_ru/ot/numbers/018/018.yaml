base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: ru
  text: А мясо их[a] будет принадлежать тебе, как грудь, приносимая обрядом потрясания[b], и правое бедро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плоть их»; здесь имеется в виду мясо жертвенных животных.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает ритуальное представление части жертвы перед Господом посредством особого движения; его также передают как «возношение» или «жертва потрясания».
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: А мясо их
  rationale: בָּשָׂר буквально обозначает «плоть», но применительно к жертвенному животному естественное русское «мясо» ясно указывает на съедобную часть; союз передан как «а», отмечая переход от крови и жира в предыдущем стихе.
- source_word: יִהְיֶה לָּךְ
  choice: будет твоим
  rationale: Оборот היה + ל выражает принадлежность или законно назначенную долю. Формула сохраняет обращение в единственном числе и характер установления.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: как грудь возношения
  rationale: חָזֶה — грудная часть жертвенного животного; תְּנוּפָה обозначает ритуальное представление дара перед Господом посредством особого движения. «Грудь возношения» кратко передаёт культовый термин, пояснённый в сноске.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: и правая голень
  rationale: שׁוֹק обозначает часть ноги жертвенного животного, точнее голень, а не неопределённое «плечо»; הַיָּמִין означает «правая».
- source_word: לְךָ יִהְיֶה
  choice: оно будет твоим
  rationale: Повтор формулы принадлежности сохранён, чтобы передать еврейское смысловое ударение; местоимение «оно» возвращает читателя к собирательному существительному «мясо».
theological_decisions:
- issue: Необычная смена формы местоименного суффикса второго лица
  choice: Обе формы переданы обращением в единственном числе «твоим», без уточнения имени адресата.
  alternative: Явно написать «твоим, Аарон» или заменить обращение множественным числом, относя его ко всем священникам.
  rationale: Контекст связывает установленную долю с Аароном как представителем священнического дома, однако сам стих имени не называет. Перевод сохраняет единственное число и не устраняет возможное напряжение грамматических форм добавленным толкованием.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой законодательного установления. Специальный жертвенный термин оставлен в тексте, но разъяснён в сноске; синтаксический повтор оригинала сохранён без искусственной архаизации.
