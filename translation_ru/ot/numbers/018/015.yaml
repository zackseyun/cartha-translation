  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: ru
  text: Всё первородное, открывающее утробу у всякого живого существа, что приносят Яхве, — из людей или животных, — будет твоим. Однако первенца человека ты непременно должен выкупить; первенца нечистого животного также должен выкупить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: то, что первым выходит из утробы
  rationale: Передаёт еврейскую идиому через понятный современному читателю образ первого потомства, выходящего из материнской утробы.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: всё ... у всякого живого существа
  rationale: Сохраняет всеохватность выражения и по контексту ясно относит его к людям и животным; буквальное «всякая плоть» в современном русском могло бы быть менее прозрачным.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: что приносят Яхве
  rationale: Глагол обозначает приближение или представление в качестве приношения. «Приносят» достаточно широко и не подразумевает, будто людей и нечистых животных обязательно приносят в жертву.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: будь то человек или животное
  rationale: 'Естественно передаёт две области применения установления: людей и животных.'
- source_word: יִהְיֶה לָּךְ
  choice: будет твоим
  rationale: Прямо выражает право священника на названных первенцев.
- source_word: אַךְ
  choice: однако
  rationale: Вводит существенное ограничение к предшествующему утверждению.
- source_word: פָּדֹה תִפְדֶּה
  choice: непременно должен выкупить
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает обязательность повеления.
- source_word: בְּכוֹר הָאָדָם
  choice: первенца человека
  rationale: Сохраняет противопоставление человеческого первенца первенцу животного без ненужного уточнения пола.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: первенца нечистого животного
  rationale: Точно обозначает первенца животного, ритуально непригодного для жертвоприношения и потому подлежащего выкупу.
theological_decisions:
- issue: Значение אָדָם в противопоставлении животному
  choice: человек
  alternative: мужчина; человечество
  rationale: Здесь слово обозначает представителя человеческого рода, а не взрослого мужчину и не человечество как абстрактное целое.
- issue: Характер права священника на первенцев
  choice: Первенцы принадлежат священнику, но человеческие первенцы и первенцы нечистых животных должны быть выкуплены.
  alternative: Понимать принесение Яхве как обязательное жертвенное заклание всех первенцев.
  rationale: Прямое предписание о выкупе в том же стихе исключает понимание, будто каждый названный первенец приносится в жертву.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис упрощён для ясности, но сохранены всеохватность первой части, образ выхода из утробы, личное имя Яхве и усиление повеления о выкупе человеческого первенца.
