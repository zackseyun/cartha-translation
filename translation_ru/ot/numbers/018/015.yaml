revisions:
- from: Всё, что первым выходит из утробы у всякого живого существа[a] и что приносят[b] Яхве, будь то человек или животное, будет твоим. Однако первенца человека ты непременно должен выкупить; также должен выкупить первенца нечистого животного.
  to: Всё первородное, открывающее утробу у всякого живого существа, что приносят Яхве, — из людей или животных, — будет твоим. Однако первенца человека ты непременно должен выкупить; первенца нечистого животного также должен выкупить.
  rationale: Переработано только первое предложение для ясного современного синтаксиса и более близкого воспроизведения образа «открывающего утробу». Сохранены всеохватность «всякой плоти», различение людей и животных, имя Яхве, право адресата и различная степень усиления двух предписаний о выкупе. Сноски сохранены по содержанию; первая слегка уточнена стилистически.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: речь о первородном, принадлежащем священнику, с оговоркой о выкупе первенцев людей и нечистых животных. Однако в первом предложении два однородных придаточных с союзным словом «что» создают ненужную синтаксическую двусмысленность: можно ошибочно прочесть «что первым выходит ... и что приносят» как два равноправных признака без ясной связи с «всяким живым существом».'
  naturalness: Формулировка «Всё первородное, открывающее утробу» естественнее для современного литературного русского в законодательном контексте и сохраняет образ оригинала. Тире и уточнение «из людей или животных» ясно показывают охват обеих категорий.
  terminology: «Яхве», «первородное», «первенец», «нечистое животное» и «выкупить» уместны и согласуются с еврейским текстом. «Выкупить» точно передаёт פּדה в данном культово-правовом контексте. Во второй части не следует добавлять усиление «непременно», поскольку оно выражено только при первом предписании.
  issues:
  - severity: medium
    issue: Неясная синтаксическая связь в первом предложении.
    rationale: Оборот «Всё, что первым выходит из утробы ... и что приносят Яхве» тяжеловесен и допускает неясное членение. Более прямое «Всё первородное, открывающее утробу ... что приносят Яхве» сохраняет оба относительных элемента оригинала без изменения смысла.
  revised_text: Всё первородное, открывающее утробу у всякого живого существа, что приносят Яхве, — из людей или животных, — будет твоим. Однако первенца человека ты непременно должен выкупить; первенца нечистого животного также должен выкупить.
