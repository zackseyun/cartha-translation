  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: ru
  text: И ваше приношение будет засчитано вам как зерно с гумна и как полный сбор из виноградного точила[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет вменено вам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как полнота из точила»; то есть как полный продукт, полученный из виноградного точила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: будет засчитано
  rationale: Нифаль глагола חשׁב выражает признание или зачёт одного как равноценного другому; «будет засчитано» естественно передаёт юридико-культовый оттенок.
- source_word: תְּרוּמַתְכֶם
  choice: ваше приношение
  rationale: תְּרוּמָה обозначает долю, отделённую для священного употребления. «Приношение» ясно и уместно в данном культовом контексте, не воспроизводя архаичное представление о буквальном возношении.
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  choice: как зерно с гумна
  rationale: Передаёт сравнительную конструкцию и обычный земледельческий образ продукта, поступающего с места молотьбы.
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  choice: и как всё произведённое точилом
  rationale: מְלֵאָה здесь означает полноту или полный продукт, а יֶקֶב — виноградное точило. Формулировка передаёт смысл полного выхода продукта и сохраняет параллелизм с зерном с гумна.
