  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: ru
  text: А Я — вот, взял ваших братьев, левитов, из среды сынов Израиля[a] и отдал их вам в дар; они отданы Яхве, чтобы исполнять служение при шатре встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из среды израильтян». Буквально: «из среды сынов Израиля».'
    reason: Лексическая альтернатива поясняет традиционную родовую формулу и предлагает естественное современное выражение.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: А Я — вот, Я
  rationale: Передаёт связь с предыдущей речью, подчёркнутое местоимение первого лица и указательно-эмфатическую силу הִנֵּה; тире сохраняет торжественное выделение, не делая фразу непонятной.
- source_word: לָקַחְתִּי
  choice: взял
  rationale: Сохраняет основное значение לקח без истолковывающего уточнения «избрал»; совершенный вид естественен для завершённого Божьего действия с продолжающимся результатом.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: ваших братьев, левитов
  rationale: Сохраняет родственный образ «братья» и передаёт «левитов» как уточняющее приложение.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: из среды сынов Израиля
  rationale: Формально передаёт מִתּוֹךְ и сохраняет мужскую родовую формулу בְּנֵי יִשְׂרָאֵל; более естественный вариант указан в сноске.
- source_word: לָכֶם מַתָּנָה נְתֻנִים
  choice: отдал их вам в дар
  rationale: Естественно выражает подразумеваемое предикативное отношение «данные вам как дар». Глагол во множественном числе соотнесён с левитами посредством местоимения «их».
- source_word: נְתֻנִים לַיהוָה
  choice: они отданы Яхве
  rationale: 'Отдельная конструкция сохраняет пассивное значение причастия и намеренное повторение корня נתן, а также двойную направленность дара: левиты даны священникам и посвящены Яхве.'
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: чтобы исполнять служение
  rationale: Передаёт целевое значение инфинитива и культовый смысл существительного עֲבֹדָה; по-русски избегает неестественного буквального повтора «служить служение».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прозрачно и буквально передаёт образ переносного святилища и назначенной встречи, оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное заветное имя, прямо присутствующее в еврейском тексте, без замены титулом.
- issue: Отношение левитов к Аарону и Яхве
  choice: «отдал их вам в дар; они отданы Яхве»
  alternative: «дал вам в дар для Яхве»
  rationale: 'Раздельные формулировки сохраняют напряжение исходного текста: левиты одновременно предоставлены Аарону и его сыновьям и принадлежат Яхве; вариант с «для» мог бы свести эти отношения к одной цели.'
- issue: Формула בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет родовую формулу оригинала; сноска предлагает естественный русский эквивалент без изменения референта.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Начальное удвоение «А Я — вот, Я» намеренно сохраняет эмфазу еврейского текста. «Шатёр встречи» понятнее современному читателю, чем традиционное «скиния собрания», при этом точнее отражает состав исходного выражения.
