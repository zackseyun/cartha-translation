  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: ru
  text: Также приблизь к себе своих братьев[a] — колено Левия, колено твоего отца, — чтобы они присоединились к тебе и служили тебе; а ты и твои сыновья с тобой будете перед шатром свидетельства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих соплеменников». Здесь «братья» — левиты, принадлежащие к тому же колену, что и Аарон.'
    reason: lexical_clarification
  - marker: b
    text: 'Буквально: «перед шатром свидетельства». Здесь в еврейском тексте стоит «свидетельство», а не более привычное «встреча» или «собрание».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Также
  rationale: Передаёт добавочное значение начального сочетания без тяжеловесного буквального «И также».
- source_word: אַחֶיךָ
  choice: своих братьев
  rationale: Сохраняет родственный язык еврейского текста; контекст уточняет, что речь идёт о соплеменниках Аарона из колена Левия.
- source_word: מַטֵּה לֵוִי
  choice: колено Левия
  rationale: מַטֶּה здесь обозначает племенное объединение, а не физический жезл.
- source_word: שֵׁבֶט אָבִיךָ
  choice: колено твоего отца
  rationale: Сохраняет приложение и формулировку оригинала, повторно отождествляя Левия с родовым коленом Аарона.
- source_word: הַקְרֵב אִתָּךְ
  choice: приблизь к себе
  rationale: Передаёт каузативное значение «привести/приблизить» и оттенок допуска к священному служению.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: чтобы они присоединились к тебе
  rationale: Передаёт значение присоединения или прикрепления; глагол также созвучен имени Левий, что отмечено в сноске.
- source_word: וִישָׁרְתוּךָ
  choice: и служили тебе
  rationale: Ясно и прямо передаёт служение левитов Аарону без излишне конфессиональной окраски.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: а ты и твои сыновья с тобой
  rationale: Союз «а» естественно выделяет Аарона и его сыновей как священническую сторону в сопоставлении с левитами.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: перед шатром свидетельства
  rationale: Следует непосредственно еврейскому עֵדֻת «свидетельство», не подменяя его привычным выражением «шатёр встречи».
theological_decisions:
- issue: Передача אֹהֶל הָעֵדֻת
  choice: шатёр свидетельства
  alternative: шатёр встречи / скиния собрания
  rationale: В данном стихе масоретский текст содержит עֵדֻת, «свидетельство», а не מוֹעֵד, «встреча/назначенное время»; отличительная формулировка сохранена без гармонизации с более привычным названием.
- issue: Отношение левитов к Аарону в וְיִלָּווּ עָלֶיךָ
  choice: присоединились к тебе
  alternative: сопровождали тебя / были прикреплены к тебе
  rationale: Формулировка сохраняет широкий смысл глагола לוה и не усиливает его до идеи полного подчинения или принадлежности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Шатёр» выбран как ясное соответствие אֹהֶל; синтаксис упрощён без устранения противопоставления левитов Аарону и его сыновьям. Все сноски обозначены в основном тексте.
