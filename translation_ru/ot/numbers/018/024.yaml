  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: ru
  text: 'Ведь десятину сынов Израиля, которую они возносят Господу как приношение, Я отдал левитам в наследие. Поэтому Я сказал им: «Среди сынов Израиля у них не будет наследия».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: десятина
  rationale: Прямой и общепонятный русский эквивалент культового термина.
- source_word: יָרִימוּ
  choice: возносят
  rationale: Сохраняет образное и ритуальное значение глагола רום в каузативной форме, не сводя его просто к общему «приносят».
- source_word: לַיהוָה
  choice: Господу
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой без введения спорной реконструкции произношения.
- source_word: תְּרוּמָה
  choice: приношение
  rationale: Естественный русский культовый термин; в сочетании с «возносят» сохраняется связь со значением отделённого и вознесённого дара.
- source_word: נַחֲלָה
  choice: наследие
  rationale: Последовательно воспроизводит ключевое повторяющееся понятие земельного или уделённого наследства и подчёркивает, что десятина заменяет левитам территориальный удел.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Достоинная и узнаваемая формула, достаточно близкая к древнееврейскому выражению и обозначающая народ Израиля.
theological_decisions:
- issue: Характер десятины как наследия левитов
  choice: «Я отдал левитам в наследие»
  alternative: «Я дал левитам вместо удела»
  rationale: Основной вариант сохраняет прямое значение נַחֲלָה и параллель с отсутствием у левитов наследия среди Израиля, не добавляя отсутствующего в первой части слова «вместо».
- issue: Субъект заключительного высказывания
  choice: «у них не будет наследия»
  alternative: «они не получат наследия»
  rationale: Формулировка сохраняет прямую речь Бога о левитах в третьем лице и не уточняет сверх текста способ получения наследия.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Синтаксис упрощён для ясности, но причинная связь, культовая терминология и повтор слова «наследие» сохранены.
