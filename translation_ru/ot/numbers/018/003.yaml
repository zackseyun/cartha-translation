base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: ru
  text: Они будут исполнять возложенные на тебя обязанности и обязанности, связанные со всем Шатром, но к утвари святилища[a] и к жертвеннику пусть не приближаются, чтобы не умерли ни они, ни вы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к священным предметам». Еврейское выражение может охватывать сосуды, орудия и другие предметы святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и они, и вы». В отрицательном контексте речь идёт о том, чтобы не умерли обе стороны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: будут исполнять порученное тебе
  rationale: Сочетание שׁמר с מִשְׁמֶרֶת обозначает соблюдение вверенной обязанности. По-русски «исполнять порученное» естественно передаёт и обязанность левитов, и личное обращение к Аарону.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: нести службу при всём Шатре
  rationale: Повтор מִשְׁמֶרֶת сохраняется смысловым повтором служебной обязанности, но без тяжеловесного буквального «хранить хранение». «Шатёр» прямо передаёт אֹהֶל; прописная буква показывает, что речь идёт о священном Шатре в данном контексте.
- source_word: אַךְ
  choice: но
  rationale: Союз вводит ограничение, противопоставленное порученной службе.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: к священным принадлежностям
  rationale: כְּלֵי может обозначать сосуды, орудия, утварь или иные предметы. Обобщающее «принадлежности» не сужает значение до сосудов, а הַקֹּדֶשׁ передано определением «священным».
- source_word: וְאֶל הַמִּזְבֵּחַ
  choice: и к жертвеннику
  rationale: Русская отрицательная конструкция естественно допускает повтор «и к», буквально отражая еврейский союз и запрещая приближение к обоим объектам.
- source_word: לֹא יִקְרָבוּ
  choice: пусть не приближаются
  rationale: קרב имеет пространственный смысл приближения к запретным святыням; форма с «пусть» естественно передаёт предписание.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: чтобы не умереть и им, и вам
  rationale: Так передаётся предупреждение о смерти обеих групп. Русское отрицание с парным «и… и…» сохраняет явное еврейское גַם…גַם и не исключает ни левитов, ни адресата с его священниками.
theological_decisions:
- issue: К кому обращено «тебе» и кто исполняет поручение
  choice: Местоимение единственного числа относится к Аарону, а исполнителями служения являются левиты, названные в контексте.
  alternative: Понимать обращение как обобщённо относящееся ко всем священникам.
  rationale: Суффикс 2-го лица мужского рода единственного числа в מִשְׁמַרְתְּךָ и ближайший контекст прямо указывают на Аарона, не устраняя участия священников.
- issue: Кто находится под угрозой смерти
  choice: 'Предупреждение охватывает обе стороны: левитов и Аарона со священниками.'
  alternative: Отнести угрозу смерти только к левитам.
  rationale: Конструкция גַם הֵם גַּם אַתֶּם буквально включает «и их, и вас», поэтому перевод сохраняет совместную ответственность, не уточняя сверх текста её механизм.
- issue: Характер связи запрета с предупреждением
  choice: «Чтобы не умереть» передаёт смерть как последствие, которого следует избежать соблюдением запрета.
  alternative: «И не умрут» как отдельное координированное утверждение либо «иначе умрёте» как более прямое условное следствие.
  rationale: Еврейский текст формально координирует отрицательные формы, но контекст ясно связывает смерть с нарушением священной границы. Выбранная формулировка сохраняет предостерегающую функцию без добавления явного условия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Избегаются архаические «дабы», «стража» и тяжеловесное «хранить порученное». «Шатёр» написан с прописной буквы как контекстуальное обозначение священного Шатра; термин «скиния» не внесён, поскольку в еврейском тексте стоит обычное אֹהֶל.
