- from: И несите стражу при святилище и стражу при жертвеннике, чтобы впредь не было гнева на сынов Израиля[a].
  to: И исполняйте обязанности по охране святилища и по охране жертвенника, чтобы впредь не было гнева на сынов Израиля[a].
  rationale: Заменено неоднозначное и менее естественное «несите стражу при…» на современное «исполняйте обязанности по охране…». Это передаёт שׁמר с מִשְׁמֶרֶת как порученную охранную обязанность, сохраняет повтор двух объектов и не уточняет сверх текста характер подразумеваемого гнева.
