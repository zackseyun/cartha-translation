base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: ru
  text: И исполняйте обязанности по охране святилища и по охране жертвенника, чтобы впредь не было гнева на сынов Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; «детей Израиля». Буквально по-еврейски: «сынов Израиля».'
    reason: Лексические варианты и пояснение формы исходного выражения.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: несите стражу
  rationale: Сочетание глагола שׁמר с существительным מִשְׁמֶרֶת обозначает порученную обязанность хранить и охранять. Русское «нести стражу» передаёт как действие охраны, так и официально возложенную ответственность.
- source_word: הַקֹּדֶשׁ
  choice: святилище
  rationale: В данном священническом контексте, особенно в паре с жертвенником, слово указывает на священное место, а не на отвлечённую святость.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент названия места жертвоприношений.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: чтобы впредь не было
  rationale: Передаёт целевое или результативное отношение к предшествующей обязанности, а עוֹד — словом «впредь».
- source_word: קֶצֶף
  choice: гнев
  rationale: Слово обозначает сильный, в контексте подразумеваемый Божий гнев и суд; «гнев» звучит естественно и сохраняет серьёзность выражения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет конкретную форму еврейского выражения; более идиоматические собирательные варианты указаны в примечании.
theological_decisions:
- issue: Связь заключительной части стиха с повелением охранять святилище и жертвенник
  choice: 'Целевое или результативное прочтение: «чтобы впредь не было»'
  alternative: 'Простое следствие или предсказание: «и впредь не будет»'
  rationale: Контекст связывает надлежащее исполнение священнических обязанностей с предотвращением нового гнева против Израиля. При этом перевод не уточняет механизм этой связи сверх сказанного в тексте.
- issue: Источник гнева
  choice: Оставить подразумеваемым
  alternative: Добавить «Божьего гнева»
  rationale: Контекст позволяет понять гнев как Божий, однако в еврейской фразе Бог прямо не назван, поэтому добавление устранено.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Повтор «стражу при… и стражу при…» намеренно сохраняет параллелизм и повтор מִשְׁמֶרֶת в еврейском тексте.
