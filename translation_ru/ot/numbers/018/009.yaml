  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: ru
  text: 'Вот что будет принадлежать тебе из святынь величайшей святости, из огненных жертв[a]: все их приношения, все их хлебные приношения, все их жертвы за грех[b] и все их жертвы повинности[c], которые они воздают Мне. Это — святыня величайшей святости для тебя и твоих сыновей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от огня». Еврейская конструкция не вполне прозрачна; в контексте она, вероятно, обозначает священнические доли от жертв, приносимых огнём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистительные жертвы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жертвы возмещения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: из величайших святынь
  rationale: Контекст указывает на высшую категорию святости жертвенных долей, а не на внутреннее помещение святилища.
- source_word: מִן הָאֵשׁ
  choice: не предаваемых огню
  rationale: Буквально «от огня»; в данном контексте речь о священнической доле, которая отделена от сжигаемой на жертвеннике части. Сноска сохраняет буквальную форму.
- source_word: קָרְבָּנָם
  choice: все их приношения
  rationale: Общий термин для того, что приносят и представляют Богу.
- source_word: מִנְחָתָם
  choice: всякое их хлебное приношение
  rationale: В священническом контексте מִנְחָה обозначает приношение из продуктов земледелия; традиционное русское «хлебное приношение» естественно и узнаваемо.
- source_word: חַטָּאתָם
  choice: всякая их жертва за грех
  rationale: Стандартное понятное обозначение данного вида жертвы; очистительный оттенок сохранён в сноске.
- source_word: אֲשָׁמָם
  choice: всякая их жертва повинности
  rationale: Передаёт жертву, связанную с виной и возмещением; альтернативное название приведено в сноске.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: которые они воздают Мне
  rationale: Hiphil от שוב буквально допускает значение «возвращают»; «воздают» естественно выражает передачу Богу должного, не сводя фразу только к материальному возврату.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: величайшая святыня
  rationale: Передаёт превосходную степень и жертвенную категорию святости без пространственной ассоциации со Святым святых.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: для тебя и твоих сыновей
  rationale: Сохранено прямое указание на Аарона и его сыновей-мужчин в контексте священнического служения.
theological_decisions:
- issue: Различение высшей категории священных приношений и внутреннего помещения святилища
  choice: величайшие святыни / величайшая святыня
  alternative: Святое святых / святыня святынь
  rationale: В этом стихе выражение классифицирует жертвенные доли и не обозначает часть скинии.
- issue: Указание на наследников священнического служения
  choice: сыновей
  alternative: детей / потомков
  rationale: Еврейский текст прямо говорит о сыновьях Аарона, и мужской род здесь обусловлен конкретным устройством священства.
- issue: Связь священнической доли с огнём жертвенника
  choice: не предаваемых огню
  alternative: от огня
  rationale: Основной текст делает понятным подразумеваемое отделение доли от сжигаемой части, а буквальная и синтаксически неоднозначная формулировка сохранена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Термины жертвоприношений сделаны понятными и последовательными; архаическое «Святое святых» не употреблено там, где оно могло бы ошибочно обозначить помещение святилища. Все маркеры сносок размещены непосредственно после соответствующих терминов.
