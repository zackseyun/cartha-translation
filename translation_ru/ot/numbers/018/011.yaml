  source_fidelity: 'Основной смысл передан верно: речь о долях приношений Израиля, предоставленных Аарону, его сыновьям и дочерям, с ограничением для ритуально чистых членов дома. Однако в текущей формулировке причастный оборот «возносимыми перед Господом» несколько неудачно превращает все приношения в описательно определяемую группу и добавляет «перед Господом» в основной текст, хотя это не выражено здесь прямо. Лучше сохранить технический характер תְּנוּפָה без такого добавления.'
  naturalness: «Каждый ... может есть это» грамматически возможно, но в современном русском «может» чаще обозначает возможность, тогда как еврейский юридический имперфект выражает разрешение. «Имеет право есть» точнее и естественнее в нормативной речи. Оборот «которые с тобой» также менее естественен, чем «живущим с тобой» в контексте дома.
  terminology: «Священная доля», «сыны Израиля», «вечное установление» и пояснение обрядовой чистоты приемлемы. Для תְּנוּפָה предпочтительно нейтральное описательное «приношения, совершаемые обрядом возношения»; сноска объясняет технический ритуал, не навязывая спорную конкретную реконструкцию движения.
