- from: 'А вот что принадлежит тебе: священная доля из их даров вместе со всеми приношениями сынов Израиля, возносимыми перед Господом[a]. Я отдал их тебе, а также твоим сыновьям и дочерям, которые с тобой, как вечное установление. Каждый в твоём доме, кто чист[b], может есть это.'
