source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: ru
  text: 'А вот что принадлежит тебе: священная доля из их даров вместе со всеми приношениями сынов Израиля, совершаемыми обрядом возношения[a]. Я отдал их тебе, а также твоим сыновьям и дочерям, живущим с тобой, в качестве вечного установления. Каждый в твоём доме, кто чист[b], имеет право есть это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально речь идёт об особом виде приношений, которые обрядовым движением представляли перед Господом.
    reason: Культурно-лексическое пояснение технического культового термина תְּנוּפָה; подробность, не выраженная прямо в стихе, вынесена из основного текста.
  - marker: b
    text: То есть обрядово чист; речь не просто о физической чистоте или нравственной безупречности.
    reason: Уточнение значения термина טָהוֹר в священническом законодательстве.
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: священная доля из их даров
  rationale: תְּרוּמָה обозначает отделённую для священного употребления долю или приношение, а מַתָּנָם — «их дары». Такой перевод передаёт культовый смысл без неясного архаического термина.
- source_word: תְּנוּפֹת
  choice: приношения …, возносимые перед Господом
  rationale: Технический термин обозначает приношения, которые особым обрядовым движением представлялись перед Богом. Описательный перевод понятнее современному русскому читателю.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранена традиционная форма собирательного обозначения, близкая к еврейскому выражению и уместная в торжественно-правовом контексте.
- source_word: נְתַתִּים
  choice: Я отдал их
  rationale: Перфект выражает уже совершённое предоставление названных священных приношений Аарону и его семье.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: а также твоим сыновьям и дочерям, которые с тобой
  rationale: Перевод сохраняет прямое упоминание и сыновей, и дочерей; оборот «которые с тобой» указывает на принадлежащих к дому Аарона.
- source_word: לְחָק עוֹלָם
  choice: как вечное установление
  rationale: חֹק передаёт обязательное установленное правило или положенную долю, а עוֹלָם — его непреходящий характер в рамках данного установления.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Каждый в твоём доме, кто чист
  rationale: В священническом контексте טָהוֹר означает состояние обрядовой чистоты. Формулировка сохраняет краткость оригинала, а смысл уточняется в сноске.
- source_word: יֹאכַל אֹתוֹ
  choice: может есть это
  rationale: Имперфект здесь выражает разрешённое право есть выделенную священную долю; местоимение единственного числа отражено словом «это».
theological_decisions:
- issue: Характер чистоты
  choice: Обрядовая чистота
  alternative: Нравственная или обычная физическая чистота
  rationale: Контекст регулирует право членов священнического дома есть святые приношения, поэтому טָהוֹר относится к установленному законом состоянию ритуальной чистоты.
- issue: Значение לְחָק עוֹלָם
  choice: вечное установление
  alternative: вечная причитающаяся доля
  rationale: חֹק допускает оттенок как постановления, так и положенной доли. Основной текст сохраняет юридическую формулировку и не сужает смысл только до имущественного права.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Культовые термины переданы понятно, без лишней архаизации; синтаксис сохраняет последовательность и смысловые акценты еврейского текста.
