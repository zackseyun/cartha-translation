lexical_decisions:
- source_word: יִקְרְבוּ
  choice: приближаются
  rationale: Глагол קרב означает «приближаться, подходить» и в данном контексте сохраняет культовый смысл приближения к священному месту.
- source_word: עוֹד
  choice: впредь ... не
  rationale: В сочетании с отрицанием לֹא слово עוֹד означает «больше не, впредь не»; выбран естественный для современного русского порядок слов.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально точно передаёт еврейское выражение и обозначает израильтян как совокупность, сохраняя форму исходного текста.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прозрачно передаёт оба элемента устойчивого названия святилища; слово «шатёр» естественнее современному читателю, чем архаичное «скиния».
- source_word: לָשֵׂאת חֵטְא
  choice: понести на себе грех
  rationale: Сохраняет конкретную еврейскую формулу «нести грех», которая в священническо-правовом контексте может означать принятие вины или ответственности за проступок.
- source_word: לָמוּת
  choice: не умереть
  rationale: Вторая инфинитивная конструкция передана параллельно первой как предупреждение о смертельном последствии запрещённого приближения.
theological_decisions:
- issue: Следует ли явно уточнить, что речь идёт о неразрешённом приближении и возникновении виновности
  choice: 'Сохранить краткую формулировку исходного текста: «не приближаются к шатру встречи, чтобы не понести на себе грех и не умереть»'
  alternative: «не подходят без разрешения к шатру встречи, иначе навлекут на себя вину и умрут»
  rationale: Ближайший контекст действительно ограничивает доступ обычных израильтян, однако сам стих не содержит слов «без разрешения». Перевод не добавляет это толкование и сохраняет богословски значимую формулу «нести грех».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Шатёр встречи» выбран вместо традиционной «скинии собрания» ради прозрачности исходного образа; «сыны Израиля» сохраняет формальную структуру еврейского обозначения.
