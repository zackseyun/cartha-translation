  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: ru
  text: Все возношения священных даров, которые сыны Израиля возносят ГОСПОДУ, Я отдал тебе, твоим сыновьям и дочерям вместе с тобой — как вечное установление. Это вечный завет соли[a] пред ГОСПОДОМ для тебя и твоих потомков вместе с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Завет соли» — древний образ прочного и обязательного завета; его точный культурный оттенок неясен.
    reason: Необычное выражение сохранено в переводе буквально; краткое пояснение отмечает вероятный смысл, не сводя образ к одному толкованию.
lexical_decisions:
- source_word: תְּרוּמֹת הַקֳּדָשִׁים
  choice: возношения из святынь
  rationale: «Возношения» передаёт культовый термин от корня רום («поднимать, возносить»), а «из святынь» сохраняет конструкцию и указывает на посвящённые Господу дары.
- source_word: יָרִימוּ
  choice: возносят
  rationale: Сохраняет словесную связь с תְּרוּמֹת и образ поднятия дара, не сводя выражение к более общему «приносят».
- source_word: חָק עוֹלָם
  choice: установление навеки
  rationale: Передаёт обязательный и длительный характер постановления естественным современным русским языком.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: завет соли навеки
  rationale: Сохраняет необычный древнееврейский образ, не подменяя его толкованием вроде «нерушимый завет».
- source_word: זַרְעֲךָ
  choice: твоих потомков
  rationale: В данном контексте собирательное «потомки» естественнее буквального «семя» и включает продолжение священнического рода.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой с прописным начертанием, отличающим имя от обычного титула.
theological_decisions:
- issue: Значение выражения «завет соли»
  choice: Сохранить образ буквально и пояснить его в сноске.
  alternative: 'Перевести истолковательно: «нерушимый завет» или «вечный завет».'
  rationale: Образ, вероятно, подчёркивает прочность и обязательность завета, но точный культурный оттенок выражения не вполне ясен; буквальная передача сохраняет подлинную неоднозначность.
- issue: Объём обещания потомкам Аарона
  choice: Не добавлять в стих условий участия, сформулированных в ближайшем контексте.
  alternative: 'Уточнить здесь: «ритуально чистым сыновьям и дочерям».'
  rationale: Сам стих говорит о сыновьях, дочерях и потомках «с тобой»; внесение пояснений из предыдущего стиха внутрь этого предложения изменило бы его формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён лишь настолько, чтобы длинное древнееврейское предложение оставалось ясным; культовые образы и повтор «возношения — возносят» намеренно сохранены.
