revisions:
- from: Все возношения из святынь, которые сыны Израиля возносят ГОСПОДУ, Я отдал тебе, а также твоим сыновьям и дочерям, которые с тобой, как установление навеки. Это завет соли навеки[a] пред ГОСПОДОМ — для тебя и твоих потомков, которые с тобой.
  to: Все возношения священных даров, которые сыны Израиля возносят ГОСПОДУ, Я отдал тебе, твоим сыновьям и дочерям вместе с тобой — как вечное установление. Это вечный завет соли[a] пред ГОСПОДОМ для тебя и твоих потомков вместе с тобой.
  rationale: Правка уточняет значение еврейской конструкции «возношения священных даров» и делает область определения «вечный» явной в выражении «вечный завет соли». Повторы «возносят», «вместе с тобой», а также обращение к потомству сохранены, поскольку они соответствуют тексту оригинала.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:17Z'
review_pass:
  verdict: revise
  source_fidelity: Требуется небольшая правка. Конструкция תְּרוּמֹת הַקֳּדָשִׁים обозначает возношения, относящиеся к посвящённым дарам; «возношения из святынь» способно создать более узкий смысл — как будто речь лишь о части уже имеющихся святынь. «Возношения священных даров» точнее передаёт конструкцию и понятно в современном русском. חָק עוֹלָם естественнее передать как «вечное установление». В выражении בְּרִית מֶלַח עוֹלָם слово עוֹלָם относится к завету; поэтому «вечный завет соли» яснее, чем «завет соли навеки».
  naturalness: Перевод в целом литературный и сохраняет уместно торжественный регистр. Уточнённые формулировки устраняют не вполне естественное «из святынь» и синтаксическую неясность в «завете соли навеки», не сглаживая древний образ.
  terminology: «Возношение», «священные дары», «вечное установление», «завет соли» и «ГОСПОДЬ» последовательно передают культовую и заветную лексику. Образ «завета соли» сохранён буквально; сноска поясняет его без догматического истолкования.
  issues:
  - severity: medium
    issue: «Возношения из святынь»
    rationale: Предлог «из» в русском предполагает извлечение или выделение из уже существующих святынь. Еврейская цепочка существительных говорит о возношениях священных/посвящённых даров в целом.
  - severity: low
    issue: «Завет соли навеки»
    rationale: Такая последовательность может быть понята как наречное определение, тогда как עוֹלָם в данном сочетании характеризует завет. «Вечный завет соли» передаёт связь слов яснее.
