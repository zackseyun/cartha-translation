  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: ru
  text: 'И сказал Яхве Аарону: «На их земле ты не получишь наследства, и не будет у тебя доли среди них. Я — твоя доля и твоё наследство среди сынов Израиля[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди народа Израиля»; «среди израильтян». Буквально: «среди сынов Израиля».'
    reason: 'Лексическая альтернатива: выражение בְּנֵי יִשְׂרָאֵל имеет форму «сыны Израиля», но обычно служит названием всего израильского народа.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּאַרְצָם
  choice: в их земле
  rationale: Слово обозначает землю Израиля как территориальное наследственное владение; буквальная формулировка естественна по-русски и сохраняет связь с темой наследства.
- source_word: תִנְחָל
  choice: ты не получишь наследства
  rationale: Глагол נחל здесь означает получить наследство или наследственный удел. Такая передача ясна по-русски и сохраняет связь с существительным נַחֲלָה далее.
- source_word: חֵלֶק
  choice: доля
  rationale: Слово означает выделенную кому-либо долю. Одинаковая передача в обеих частях стиха сохраняет намеренный смысловой повтор.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Фраза указывает на положение Аарона среди израильского народа, а не только на пространственное нахождение.
- source_word: אֲנִי חֶלְקְךָ
  choice: Я — твоя доля
  rationale: Сохранена краткая метафорическая формулировка и её связь с ранее упомянутой долей в земле.
- source_word: נַחֲלָתְךָ
  choice: твоё наследие
  rationale: «Наследие» передаёт юридико-заветный смысл נַחֲלָה и при этом естественно звучит в высказывании Бога о Себе.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Формально сохраняется еврейское выражение «сыны Израиля» и его родовая, заветная окраска; более привычные коллективные варианты указаны в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» передаёт тетраграмматон как имя, не подменяя его титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля; израильтяне
  rationale: Выбран формально точный вариант, сохраняющий семейно-заветный образ исходного выражения. Поскольку в данном контексте оно также обозначает народ в целом, естественные коллективные варианты приведены в сноске.
- issue: Бог как доля и наследие Аарона
  choice: Я — твоя доля и твоё наследие
  alternative: Я дам тебе долю и наследие
  rationale: 'Сохранено прямое отождествление из еврейского текста: Бог не просто обещает дать Аарону содержание, но Сам назван его долей и наследием. Богословское напряжение метафоры не ослаблено поясняющим пересказом.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повторы «доля» и «наследство/наследие» сохранены; местоимение «твоё» написано с «ё» для ясности произношения.
