  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: ru
  text: Всё, преданное заклятию в Израиле, будет принадлежать тебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё безвозвратно посвящённое Богу в Израиле». Еврейское חֵרֶם обозначает нечто безвозвратно посвящённое Богу и изъятое из обычного употребления; в некоторых контекстах — предназначенное для уничтожения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Всё
  rationale: Передаёт полноту категории и естественно сочетается в русском языке с субстантивированным определением «посвящённое».
- source_word: חֵרֶם
  choice: посвящённое Богу
  rationale: Термин обозначает нечто безвозвратно отданное Богу и изъятое из обычного употребления; в некоторых контекстах оно подлежит уничтожению. Основной текст сохраняет широкое культово-правовое значение, не навязывая оттенок уничтожения, которого сам стих не уточняет.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог בְּ обозначает сферу или место; «в Израиле» естественно передаёт правовую область действия постановления.
- source_word: לְךָ
  choice: тебе
  rationale: Сочетание לְ с местоименным суффиксом выражает назначение и принадлежность; вместе с глаголом «принадлежать» ясно указывает на право Аарона.
- source_word: יִהְיֶה
  choice: будет принадлежать
  rationale: Имперфект היה в законодательном контексте выражает установленное на будущее право. Развёрнутое «будет принадлежать» по-русски яснее передаёт юридическую принадлежность, чем буквальное «будет твоим».
theological_decisions:
- issue: Передача культово-правового термина חֵרֶם
  choice: посвящённое Богу
  alternative: преданное заклятию; подлежащее уничтожению
  rationale: חֵרֶם может обозначать безвозвратно посвящённое Богу имущество, а в ряде контекстов — то, что предано уничтожению. Здесь речь идёт о доле священника, поэтому основной перевод сохраняет более широкое значение, а более сильный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формулировка соответствует законодательному контексту. Добавление «Богу» эксплицирует подразумеваемую направленность посвящения, а сноска сохраняет смысловую широту древнееврейского термина.
