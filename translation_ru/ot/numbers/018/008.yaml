  source_fidelity: 'Основной смысл передан верно: Яхве поручает Аарону священные приношения Израиля и предоставляет их ему и его сыновьям на постоянном законном основании. Однако конструкция «попечение о Моих возношениях — обо всех святынях» неудачно передаёт связь между תְּרוּמֹתַי и לְכָל קָדְשֵׁי בְנֵי־יִשְׂרָאֵל: тире делает вторую группу неясным приложением. Формулировка «из всех святынь сынов Израиля» яснее отражает, что речь идёт о приношениях, относящихся к посвящённым дарам Израиля.'
  naturalness: Текст в целом литературен и пригоден для публичного чтения. «Попечение о ... — обо всех ...» звучит синтаксически тяжеловесно, а «как долю по помазанию» несколько канцелярски и может быть понято как доля, выделенная при обряде помазания. Уточнённая формулировка естественнее, сохраняя связь дара со священническим помазанием.
  terminology: «Яхве», «Аарон», «возношения», «сыны Израиля» и «вечное установление» уместны в данном регистре. «Возношения» сохраняет культово-технический оттенок תְּרוּמָה; сноска корректно даёт более широкую альтернативу. Для לְמָשְׁחָה требуется передать предоставленную Аарону долю как связанную с его помазанием, не утверждая, что здесь предписан новый ритуал.
