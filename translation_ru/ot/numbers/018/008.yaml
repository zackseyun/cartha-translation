  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: ru
  text: 'И сказал Яхве Аарону: «Вот, Я вверил тебе попечение о Моих возношениях[a] из всех святынь сынов Израиля[c]. Я отдал их тебе как твою долю, положенную по помазанию[b], а твоим сыновьям — по вечному установлению».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои приношения»; еврейское слово обозначает выделенные для Бога дары и традиционно также переводится как «возношения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для помазания». Вероятнее всего, имеются в виду дары, положенные Аарону в силу его помазания на священническое служение.'
    reason: lexical_alternative
  - marker: c
    text: «Сыны Израиля» — обычное заветное наименование народа Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַאֲנִי הִנֵּה
  choice: Вот, Я
  rationale: Естественно по-русски сохраняет привлекающее внимание הִנֵּה и подчёркнутое местоимение первого лица.
- source_word: נָתַתִּי לְךָ אֶת מִשְׁמֶרֶת
  choice: Я вверил тебе попечение
  rationale: Передаёт не только передачу даров, но и возложенную на Аарона обязанность хранить их и распоряжаться ими.
- source_word: תְּרוּמֹתַי
  choice: Мои возношения
  rationale: «Возношения» сохраняет специальное культовое значение תְּרוּמָה; притяжательная форма соответствует суффиксу первого лица.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: обо всех святынях сынов Израиля
  rationale: «Святыни» ёмко обозначают посвящённые Богу предметы и дары; «сыны Израиля» сохраняет обычное заветное наименование народа.
- source_word: לְמָשְׁחָה
  choice: как долю по помазанию
  rationale: Передаёт связь предоставленной Аарону доли с его помазанием на священническое служение, не превращая выражение в указание на новый обряд помазания.
- source_word: לְחָק עוֹלָם
  choice: по вечному установлению
  rationale: Сохраняет юридическую силу חֹק и длительный, непреходящий характер עוֹלָם в рамках данного постановления.
theological_decisions:
- issue: Значение לְמָשְׁחָה в отношении священнической доли
  choice: как долю по помазанию
  alternative: для помазания
  rationale: Контекст говорит о дарах, предоставленных Аарону в связи с его помазанным священническим служением. Формулировка сохраняет эту связь, не утверждая, будто сами дары предназначены для совершения помазания.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранено формальное заветное обозначение народа, имеющее в данном контексте коллективный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, пригодным для публичного чтения библейским регистром. Синтаксис проясняет приложение «все святыни», не устраняя смысловой связи между возношениями и священными дарами.
