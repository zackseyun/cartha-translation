review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: предписание адресовано Аарону и его сыновьям, охватывает жертвенник и область за завесой, а для неуполномоченного приблизившегося установлена смертная кара. Однако «храните ваше священство» звучит по-русски неестественно и несколько неясно: в данном контексте שׁמר обозначает несение/соблюдение ответственности за священническое служение. Форму יוּמָת точнее передаёт юридическое будущее «будет предан смерти», чем «должен быть предан смерти».'
  naturalness: Текст нуждается в небольшой стилистической правке. «Вы с сыновьями вашими» и «несите ответственность за священство» естественнее для современного литературного русского, чем «твои сыновья вместе с тобой храните ваше священство». Уточнение «пространства за завесой» устраняет впечатление, будто речь идёт лишь о неких предметах за завесой.
  terminology: «Священство», «жертвенник», «завеса» и «служение» уместны. «Посторонний» допустимо как доступное обозначение זָר при поясняющей сноске; оно не должно пониматься этнически. Сноску к עֲבֹדַת מַתָּנָה следует сформулировать так, чтобы оба возможных смысловых акцента были изложены ясно и без неудачной фразы «священство — служение как дар».
