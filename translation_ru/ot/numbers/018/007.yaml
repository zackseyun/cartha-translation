revisions:
- from: А ты и твои сыновья вместе с тобой храните ваше священство во всём, что касается жертвенника и того, что за завесой, и совершайте служение. Я даю вам священство как дар служения[a]. А посторонний[b], который приблизится, должен быть предан смерти.
  to: А ты и сыновья твои с тобою несите ответственность за ваше священство — во всём, что касается жертвенника и пространства за завесой, — и совершайте служение. Я даю вам священство как дар служения[a]. А посторонний[b], который приблизится, будет предан смерти.
  rationale: Правка заменяет буквальное, но неестественное «храните ваше священство» на ясное обозначение вверенной ответственности, точнее выражает пространственную отсылку к области за завесой и приводит юридическую формулу наказания к форме будущего времени. Сохранены сдержанный законодательный регистр, неоднозначность עֲבֹדַת מַתָּנָה и неэтническое значение זָר.
  reviewer_model: gpt-5.6-terra
