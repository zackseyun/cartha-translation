base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: ru
  text: А ты и сыновья твои с тобою несите ответственность за ваше священство — во всём, что касается жертвенника и пространства за завесой, — и совершайте служение. Я даю вам священство как дар служения[a]. А посторонний[b], который приблизится, будет предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я даю вам священство как дар для служения». Еврейское выражение может подчёркивать либо то, что служение является даром, либо то, что священство даровано для служения.'
    reason: lexical_alternative
  - marker: b
    text: То есть человек, не уполномоченный исполнять священнические обязанности; речь не обязательно идёт об иноплеменнике.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: храните
  rationale: В данном контексте глагол означает не просто исполнять, а оберегать вверенную священническую обязанность; «храните» передаёт эту ответственность естественно и сжато.
- source_word: כְּהֻנַּתְכֶם
  choice: ваше священство
  rationale: Слово обозначает священническое служение и статус как вверенное установление; «священство» сохраняет широту исходного понятия.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: во всём, что касается жертвенника
  rationale: דָּבָר здесь охватывает все дела и обязанности, связанные с жертвенником, без неоправданного сужения до отдельных обрядов.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: и того, что за завесой
  rationale: Выражение указывает на пространство с внутренней стороны завесы; «за завесой» естественно по-русски и сохраняет пространственную отсылку к святилищу.
- source_word: וַעֲבַדְתֶּם
  choice: и совершайте служение
  rationale: В культовом контексте עבד означает исполнять священное служение; существительное «служение» ясно передаёт эту функцию без поздней церковной терминологии.
- source_word: עֲבֹדַת מַתָּנָה אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Я даю вам священство как дар служения
  rationale: Сжатая еврейская конструкция связывает дар, служение и священство. Перевод сохраняет эту связь, а сноска отмечает возможное иное синтаксическое соотношение.
- source_word: הַזָּר
  choice: посторонний
  rationale: В священническом законодательстве это не обязательно иноплеменник, а человек, не уполномоченный исполнять данное священное служение.
- source_word: הַקָּרֵב
  choice: который приблизится
  rationale: Глагол передаёт приближение к запретной священной сфере и сохраняет характерную для текста пространственно-культовую формулировку.
- source_word: יוּמָת
  choice: должен быть предан смерти
  rationale: Каузативно-пассивная форма выражает установленное наказание, а не простое предсказание смерти.
theological_decisions:
- issue: Значение זָר в священническом законодательстве
  choice: посторонний
  alternative: чужеземец; мирянин; неуполномоченный человек
  rationale: Контекст определяет человека по отсутствию права на священнические обязанности, а не по этнической принадлежности. Сноска устраняет возможное недоразумение, не сужая термин до одной категории.
- issue: Синтаксическая сила עֲבֹדַת מַתָּנָה
  choice: священство дано как дар служения
  alternative: служение дано как дар
  rationale: 'Еврейская конструкция допускает различный акцент: даром может представляться либо само служение, либо священство, дарованное для служения. Основной текст естественен по-русски, а сноска сохраняет неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной библейской речи. Формы повелительного наклонения передают обращённое к Аарону и его сыновьям предписание; специализированные термины ограничены общеупотребительными «священство», «жертвенник», «завеса» и «служение».
