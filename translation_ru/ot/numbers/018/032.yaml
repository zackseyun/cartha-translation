    issue: «если вознесёте» передаёт обстоятельственную инфинитивную конструкцию как условие.
    rationale: בַּהֲרִימְכֶם буквально означает «при/когда вашем вознесении»; «когда вы вознесёте» точнее сохраняет временно-обстоятельственную связь.
  - severity: medium
    issue: «из неё» не имеет ясного антецедента в русском тексте самого стиха.
    rationale: Еврейские суффиксы отсылаются к десятине, известной из непосредственного контекста. В русском самостоятельном стихе лучше назвать десятину, не меняя смысла.
