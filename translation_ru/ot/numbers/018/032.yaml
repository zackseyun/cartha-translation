  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: ru
  text: И вы не понесёте за это греха, когда вознесёте от десятины её лучшую часть[a]. Не оскверняйте святынь сынов Израиля[b] — и не умрёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её жир». В языке приношений это выражение означает самую ценную, отборную часть.'
    reason: lexical_alternative
  - marker: b
    text: То есть народа Израиля; «сыны Израиля» — устойчивое библейское наименование израильтян.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: не понесёте ... греха
  rationale: Сочетание נשא с חטא означает нести грех или вину. Формулировка сохраняет образ и понятна в современном русском.
- source_word: עָלָיו
  choice: за это
  rationale: Местоимение отсылает к десятине и связанному с ней обязательству; «за это» естественно передаёт ответственность в отношении неё.
- source_word: בַּהֲרִימְכֶם
  choice: если вознесёте
  rationale: Инфинитив Hифиля от רום обозначает отделение и возношение доли как приношения. Условное «если» естественно связывает действие с отсутствием вины, не устраняя обстоятельственного оттенка еврейской конструкции.
- source_word: חֶלְבּוֹ
  choice: лучшую часть
  rationale: Буквально «жир», но применительно к приношениям слово обозначает наиболее ценную, отборную долю; здесь речь идёт о десятине, а не исключительно о животном жире.
- source_word: מִמֶּנּוּ
  choice: из неё
  rationale: Местоимение относится к десятине, существительному женского рода в русском контексте предыдущих стихов.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: святынь сынов Израиля
  rationale: «Святыни» ёмко передаёт посвящённые Богу предметы или дары, а «сыны Израиля» сохраняет форму традиционного этнонима.
- source_word: תְחַלְּלוּ
  choice: не оскверняйте
  rationale: Piel глагола חלל означает лишать священного статуса, осквернять; русский глагол ясно сохраняет противопоставление святого и осквернённого.
- source_word: וְלֹא תָמֻתוּ
  choice: и не умрёте
  rationale: Прямо сохраняет еврейское сочинение с וְלֹא и не добавляет явно целевого значения.
theological_decisions:
- issue: Значение חֶלֶב в контексте десятины
  choice: лучшую часть
  alternative: жир; отборную часть
  rationale: Контекст говорит об отделении лучшей доли от урожая или иных десятинных поступлений. Буквальное «жир» могло бы ошибочно сузить смысл до животной жертвы.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Это устойчивый заветный этноним; формальная передача сохраняет образ исходного текста и остаётся понятной русскому читателю.
- issue: Связь последнего запрета с угрозой смерти
  choice: и не умрёте
  alternative: чтобы вам не умереть; иначе умрёте
  rationale: Еврейский текст координирует придаток через וְלֹא; выбранный вариант сохраняет лаконичность и некоторую неоднозначность между следствием и предупреждением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Вознесёте» и «святыни» сохраняют культовый контекст, не делая фразу архаичной; тире перед заключительной клаузой подчёркивает серьёзность предупреждения.
