  to: И вы не понесёте за это греха, когда вознесёте от десятины её лучшую часть[a]. Не оскверняйте святынь сынов Израиля[b] — и не умрёте.
  rationale: Заменено условное «если» на обстоятельственное «когда» согласно בַּהֲרִימְכֶם. Неясное «из неё» уточнено как «от десятины», поскольку именно десятина является референтом еврейских местоименных суффиксов в контексте. Остальная терминология и обе сноски сохранены.
