  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: ru
  text: Сам левит будет исполнять служение при шатре встречи, и они будут нести свою вину.[a] Это постоянное установление для вас во все поколения. Среди сынов Израиля[b] они не унаследуют наследия.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нести ответственность за свою вину» либо «нести последствия своей вины». Еврейское выражение может обозначать вину, ответственность за неё или связанные с ней последствия.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть среди израильтян; буквально: «среди сынов Израиля».'
    reason: lexical_alternative
  - marker: c
    text: Сочетание «не унаследуют наследия» воспроизводит еврейские однокоренные глагол и существительное и подчёркивает, что левитам не будет дан племенной земельный надел.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: пусть совершает
  rationale: В данном предписывающем контексте форма имеет модально-юссивную силу. Такое выражение естественно передаёт обязательность, не превращая стих в простое предсказание.
- source_word: הַלֵּוִי הוּא
  choice: сам левит
  rationale: Самостоятельное местоимение הוּא подчёркивает подлежащее; «сам» передаёт это ударение, не добавляя значения исключительности.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: служение при шатре встречи
  rationale: עֲבֹדָה здесь обозначает установленное культовое служение. Предлог «при» естественно связывает служение с местом и сферой обязанностей, а «шатёр встречи» точно передаёт אֹהֶל מוֹעֵד.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: и они будут нести свою вину
  rationale: Сохранена многозначная юридико-культовая идиома נשא עון, которая может охватывать вину, ответственность за неё и её последствия. Множественное «они» следует явной смене числа в еврейском тексте.
- source_word: חֻקַּת עוֹלָם
  choice: вечное установление
  rationale: Устойчивое законодательное выражение указывает на непреходящую норму в рамках заветного устройства Израиля; «установление» звучит ясно и достойно.
- source_word: לְדֹרֹתֵיכֶם
  choice: для вас из поколения в поколение
  rationale: Передаёт продолжение действия нормы во всех последующих поколениях и сохраняет обращение второго лица множественного числа.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохранено буквальное мужское выражение בְּנֵי יִשְׂרָאֵל; «среди» естественно передаёт בְּתוֹךְ в данном контексте.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: не получат земельного надела
  rationale: Контекст говорит о племенном земельном владении. Русское «получить земельный надел» ясно передаёт смысл глагола и однокоренного существительного; буквальная конструкция «не унаследуют наследия» по-русски тяжеловесна, а её особенность отмечена в сноске.
theological_decisions:
- issue: Юридико-культовый смысл выражения נשא עון
  choice: нести свою вину
  alternative: нести ответственность за свой грех; понести наказание за свою вину
  rationale: Формулировка сохраняет богословскую напряжённость исходной идиомы и не решает без достаточных оснований, идёт ли речь прежде всего о виновности, ответственности или последствиях.
- issue: Смена единственного числа «левит» на множественное «они»
  choice: сохранить смену числа
  alternative: согласовать всё в единственном числе или явно заменить «они» на «левиты»
  rationale: Еврейский текст намеренно переходит от собирательного единственного к множественному. Сохранение этой формы не скрывает реальную грамматическую особенность источника.
- issue: Характер левитского наследия
  choice: земельный надел
  alternative: наследство; наследие
  rationale: В непосредственном контексте речь идёт об отсутствии у левитов племенного надела среди Израиля. Уточнение «земельный» раскрывает контекстуальный смысл, не затрагивая иных библейских утверждений о Господе как их уделе.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Культовые термины переданы последовательно и понятно; подлинная неоднозначность идиомы о несении вины сохранена и пояснена в сноске. Синтаксис разделён на два предложения ради естественной русской читабельности без изменения логики стиха.
