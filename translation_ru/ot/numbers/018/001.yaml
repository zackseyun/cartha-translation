base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: ru
  text: 'И сказал Яхве Аарону: «Ты, твои сыновья и отчий дом твой вместе с тобой будете нести вину святилища[a], а ты и твои сыновья вместе с тобой будете нести вину вашего священства[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете нести ответственность за проступки, связанные со святилищем». Еврейский оборот может обозначать как несение вины, так и ответственность за нарушения, связанные со святилищем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будете нести ответственность за проступки, связанные с вашим священством». Еврейский оборот может обозначать как несение вины, так и ответственность за нарушения, связанные со священническим служением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» устоялась в современной русской библеистике.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет последовательное повествовательное значение еврейской конструкции и естественно звучит в русском библейском повествовании.
- source_word: בֵית אָבִיךָ
  choice: дом твоего отца
  rationale: Сохраняет древнееврейское обозначение отцовского рода или большой родовой семьи, не сводя его к физическому жилищу.
- source_word: אִתָּךְ
  choice: вместе с тобой
  rationale: Передаёт сопровождение и сохраняет подчёркнутый повтор выражения в обеих частях стиха.
- source_word: תִּשְׂאוּ אֶת עֲוֹן
  choice: будете нести вину
  rationale: Сохраняет образный оборот, который может обозначать несение вины, наказания или ответственности за нарушения, не сужая смысл до одного толкования.
- source_word: הַמִּקְדָּשׁ
  choice: святилища
  rationale: Обозначает священную сферу и место служения; «святилище» является точным и естественным русским соответствием.
- source_word: כְּהֻנַּתְכֶם
  choice: вашего священства
  rationale: Передаёт принадлежащее Аарону и его сыновьям священническое служение и должность, сохраняя институциональный оттенок.
theological_decisions:
- issue: Смысл выражения «нести вину» в контексте святилища и священства
  choice: Сохранить оборот «будете нести вину», не уточняя в основном тексте, идёт ли речь прежде всего о виновности, наказании или ответственности за нарушения.
  alternative: «будете отвечать за нарушения, связанные со святилищем и священством»
  rationale: Еврейский оборот охватывает взаимосвязанные понятия виновности, ответственности и последствий проступка. Буквально-образная передача сохраняет заложенное в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм и повтор «вместе с тобой» сохранены. Архаизмы не используются; выражение «дом твоего отца» оставлено как значимый древнееврейский родовой термин.
