base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/025.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — YHWH (Яхве); традиционный перевод — «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с последовательным ו вводит следующий шаг повествования; в устойчивой русской формуле речи естественно употребить «сказал», не меняя смысла глагола דבר в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейская формула введения прямой речи естественно передаётся в современном русском языке двоеточием; последующие слова составляют прямую речь.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя YHWH. Форма «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык. Краткая формула введения речи передана естественно и торжественно; «сказал» и двоеточие избегают тяжеловесного буквального оборота «говоря».
