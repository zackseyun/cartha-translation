id: NUM.18.17
reference: Numbers 18:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: 'Но не выкупай первенца крупного скота, первенца овцы или первенца козы: они святы. Их кровью окропи жертвенник, а их жир сожги как жертву, сжигаемую в огне[a], — в благоухание, приятное Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненную жертву»; буквально: «жертву огня».'
    reason: Лексическая альтернатива для культового термина אִשֶּׁה; основной текст поясняет его функцию, не вводя дополнительного богословского смысла.
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица вводит исключение из предшествующего установления; «но» естественно передаёт противопоставление.
- source_word: בְּכוֹר שׁוֹר
  choice: первенца из крупного рогатого скота
  rationale: Сочетание обозначает первородное животное из категории крупного скота; такой перевод точнее родового значения, чем более узкое «первенца быка».
- source_word: בְכוֹר כֶּשֶׂב ... בְכוֹר עֵז
  choice: первенца из овец ... первенца из коз
  rationale: В данном перечне слова обозначают категории жертвенных животных, поэтому сохранено родовое значение.
- source_word: לֹא תִפְדֶּה
  choice: не выкупай
  rationale: В священническо-правовом контексте פדה означает освобождение посредством установленного выкупа или замены.
- source_word: קֹדֶשׁ הֵם
  choice: они святы
  rationale: Сохраняется культовое и богословское значение святости как принадлежности Богу.
- source_word: אֶת דָּמָם תִּזְרֹק עַל הַמִּזְבֵּחַ
  choice: их кровью кропи жертвенник
  rationale: זרק обозначает ритуальное нанесение крови на жертвенник; «кропи» — краткий и устойчивый русский глагол для этого действия, без излишне бытового оттенка «плескай».
- source_word: וְאֶת חֶלְבָּם תַּקְטִיר
  choice: а их жир сжигай на нём
  rationale: חלב здесь — предназначенные для жертвенника жировые части, а каузатив קטר обозначает их ритуальное сожжение. «На нём» ясно соотносится с названным жертвенником.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Термин обозначает жертву, предаваемую огню; перевод сохраняет культовый образ и допускает более буквальное разъяснение в сноске.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Передаёт устойчивую жертвенную формулу, сохраняя образ запаха и идею благоприятного принятия жертвы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Культовый термин אִשֶּׁה
  choice: огненная жертва
  alternative: жертва, приносимая на огне
  rationale: Основной текст сохраняет специальный жертвенный термин в понятной форме, а сноска показывает более развёрнутую формальную передачу, не уточняя сверх текста природу жертвы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным культовым регистром. Повелительные формы единственного числа сохраняют обращение закона к адресату. Термины «святы», «жертвенник», «огненная жертва» обеспечивают достоинство и межконфессиональную нейтральность текста.
