  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: ru
  text: Всё лучшее из масла[a], и всё лучшее из молодого вина и зерна — их начатки, которые они отдают Яхве, — Я отдал их тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь жир масла»; здесь «жир» — образное обозначение самой богатой, лучшей части. То же выражение относится далее к молодому вину и зерну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: лучшее
  rationale: Буквально «жир»; применительно к плодам земли это идиома, обозначающая самую богатую, отборную часть. «Лучшее» естественно передаёт смысл по-русски.
- source_word: יִצְהָר
  choice: масло
  rationale: Слово обозначает свежее растительное масло, обычно оливковое; конкретизация «оливковое» вероятна по контексту, но лексически не выражена.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Обозначает новый продукт винограда и сохраняет отличие от более общего слова «вино».
- source_word: דָגָן
  choice: зерно
  rationale: Широкое обозначение зерновых продуктов; «зерно» ясно и естественно в современном русском языке.
- source_word: רֵאשִׁיתָם
  choice: их начатки
  rationale: В контексте приношений רֵאשִׁית означает первую, посвящаемую часть урожая; «начатки» сохраняет культовый смысл и связь с предшествующим перечнем.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: которые отдают Яхве
  rationale: Глагол נתן буквально означает «давать»; «отдают» здесь естественно обозначает передачу посвящённой доли без добавления отсутствующего в тексте специального глагола «приносить».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, как в предоставленном аудированном английском слое, без замены титулом.
- source_word: לְךָ נְתַתִּים
  choice: Я отдал тебе
  rationale: Перфект נתתי с объектным суффиксом множественного числа представляет передачу перечисленных даров как установленное, совершившееся дарование; русский объект понятен из предыдущего перечисления.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя сохранено явно, в соответствии с исходным еврейским текстом и предоставленным английским POB; вариант «Господь» передаёт традиционную замену имени титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Слово «начатки» сохранено как понятный традиционный термин для первой посвящаемой части урожая; синтаксическое тире передаёт пояснительное приложение и акцент исходной конструкции.
