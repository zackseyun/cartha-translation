  to: А сынам Левия — вот, Я отдал всю десятину в Израиле в наследие, в обмен на их службу, которую они несут, — службу при Шатре Встречи.
  rationale: 'Добавлено русское соответствие הִנֵּה («вот»); устранена ненормативная конструкция «взамен за». «Их службу» точно передаёт суффикс во фразе עֲבֹדָתָם, а последующее пояснение сохранено как приложение: это служба при Шатре Встречи.'
