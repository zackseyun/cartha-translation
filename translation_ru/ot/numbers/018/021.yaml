  - severity: medium
    issue: Сочетание «взамен за службу» ненормативно и повтор «за службу» синтаксически неудачен.
    rationale: Хֵלֶף требует конструкции вроде «в обмен на» или «взамен [чего-либо]». Пояснительное повторение службы должно быть отделено от основной конструкции.
