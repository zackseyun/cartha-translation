base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: ru
  text: А сынам Левия — вот, Я отдал всю десятину в Израиле в наследие, в обмен на их службу, которую они несут, — службу при Шатре Встречи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: А сынам Левия
  rationale: Сохраняет родословное выражение еврейского текста; в данном контексте оно обозначает левитов.
- source_word: הִנֵּה
  choice: не передано отдельным словом
  rationale: Значение привлечения внимания выражено русской конструкцией с вынесенным дополнением; буквальное «вот» здесь звучало бы тяжеловесно.
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Перфект обозначает установленное дарование; «отдал» естественно передаёт завершённость и сохраняет первое лицо Божьей речи.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: всю десятину в Израиле
  rationale: מַעֲשֵׂר — установленная десятая доля; собирательное «всю десятину» естественно по-русски и допускается синтаксисом כָּל.
- source_word: לְנַחֲלָה
  choice: в наследие
  rationale: Передаёт выделенный удел или наследственное владение и сохраняет связь с темой удела левитов.
- source_word: חֵלֶף עֲבֹדָתָם
  choice: взамен за службу
  rationale: Сохраняет смысл обмена или возмещения, не сводя священные обязанности к коммерческой оплате.
- source_word: אֲשֶׁר הֵם עֹבְדִים
  choice: которую они несут
  rationale: «Нести службу» — естественное современное русское сочетание, передающее исполнение обязанностей без неуклюжего повтора однокоренных слов.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: за службу при шатре встречи
  rationale: Передаёт культовые обязанности, связанные с אֹהֶל מוֹעֵד; «при» естественнее по-русски, чем буквальное «служба шатра».
theological_decisions:
- issue: Соотношение десятины, наследия и левитской службы
  choice: Десятина дана левитам как наследственный удел взамен за исполняемую ими службу.
  alternative: Десятина лишь назначена левитам без акцента на возмещении; либо она прямо названа заменой земельного удела.
  rationale: Текст прямо соединяет לְנַחֲלָה с חֵלֶף עֲבֹדָתָם, но в самом стихе не утверждает прямо, что десятина заменяет именно земельный надел.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Родословное «сынам Левия» сохранено; архаичное «се» устранено. «Шатёр встречи» прозрачно передаёт название святилища и не подменяет его традиционным толкованием.
