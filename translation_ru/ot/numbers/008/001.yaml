lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … обратился
  rationale: Глагол דּבר с повествовательным וַ передаёт очередное речевое действие. «И … обратился» естественно вводит прямую речь по-русски и сохраняет значение говорения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: אֶל־מֹשֶׁה
  choice: к Моисею
  rationale: Предлог אֶל при глаголе речи обозначает адресата; русская конструкция «обратился к Моисею» передаёт её естественно.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Инфинитив לֵאמֹר вводит содержание последующей речи. Оборот «со словами» и двоеточие сохраняют его функцию без неестественного русского «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохранено в основном тексте; традиционная замена титулом указана в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула введения речи. Двоеточие указывает, что содержание речи следует далее.
