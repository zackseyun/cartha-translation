  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: ru
  text: И Я взял левитов вместо каждого первенца среди сынов Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди израильтян». Буквально: «среди сынов Израиля».'
    reason: Лексическая альтернатива поясняет идиоматический смысл и буквальную форму еврейского выражения.
lexical_decisions:
- source_word: וָאֶקַּח
  choice: И Я взял
  rationale: Форма Qal wayyiqtol, 1-е лицо ед. числа, от לקח продолжает повествование и буквально означает «и Я взял». Заглавная буква в местоимении указывает, что говорит Бог.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Определённое множественное число обозначает левитов; в русском после «взял» требуется винительный падеж.
- source_word: תַּחַת
  choice: вместо
  rationale: Здесь предлог выражает замещение, а не пространственное положение.
- source_word: כָּל בְּכוֹר
  choice: каждого первенца
  rationale: При существительном в единственном числе כָּל имеет распределительное значение «каждый». Слово «мужчину» не добавлено, поскольку в данном стихе его нет в еврейском тексте.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Передаёт буквальное «среди сынов Израиля» и сохраняет мужскую форму исходного выражения; предлог ב здесь имеет значение принадлежности к группе.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет явно мужское выражение оригинала, не устраняя его корпоративного значения и не заменяя более общим этнонимом.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской терминологией. Синтаксис краткий и близкий к еврейскому оригиналу; «левитов» пишется со строчной буквы как название группы.
