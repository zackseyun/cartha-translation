base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: ru
  text: После этого левиты придут служить при Шатре встречи. Ты очистишь их[a] и совершишь над ними обряд возношения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистишь ритуально». Еврейский глагол здесь обозначает обрядовое очищение.'
    reason: lexical_alternative
  - marker: b
    text: Ритуал, при котором самих левитов символически представляли как приношение.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Передаёт явную последовательность действий и естественно звучит в современном русском языке.
- source_word: יָבֹאוּ הַלְוִיִּם לַעֲבֹד
  choice: левиты приступят к служению
  rationale: Глагол בוא буквально означает «прийти/войти», но здесь обозначает допуск левитов к началу служения после совершённых обрядов; выбранная формулировка ясно передаёт эту функцию, не превращая их служение в священство.
- source_word: אֶת אֹהֶל מוֹעֵד
  choice: при Шатре встречи
  rationale: При עבד объектный показатель связывает служение с Шатром. Русское «служить при Шатре» естественно выражает и место, и назначение служения.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: Ты очистишь их
  rationale: טהר обозначает здесь ритуальное очищение. «Очистишь» понятно современному читателю, а сноска уточняет обрядовый смысл.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: и совершишь над ними обряд возношения
  rationale: Еврейское сочетание использует глагол и однокоренное существительное для особого ритуального действия над самими левитами. Формулировка сохраняет культовый образ, но избегает неестественного буквального «будешь качать их».
theological_decisions:
- issue: Ритуальный характер посвящения левитов
  choice: Сохранить термины «очистишь» и «обряд возношения»
  alternative: 'Передать обобщённо: «посвятишь их на служение»'
  rationale: В стихе названы конкретные обрядовые действия, а не только назначение на должность. Их сохранение передаёт культовый контекст, не привнося позднейших богословских категорий.
- issue: Левиты как объект обряда возношения
  choice: «совершишь над ними обряд возношения»
  alternative: «представишь их»
  rationale: Выбранный вариант сохраняет необычную образность оригинала, где непосредственным объектом действия выступают сами левиты, тогда как пояснение в сноске раскрывает смысл ритуала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Шатёр встречи» сохраняет традиционный сакральный образ, оставаясь понятным; прописная буква обозначает название святилища. Синтаксис разделён на два предложения для ясности последовательности действий.
