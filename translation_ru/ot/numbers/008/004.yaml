revisions:
- from: 'Вот как был сделан светильник: он был выкован из золота[a] — от основания до цветков весь он был кованым. Светильник сделали таким, каким его показал Моисею Яхве[b].'
  to: 'Таково было устройство светильника: чеканная работа из золота[a]; от основания до цветков — весь он был чеканной работы. В соответствии с тем, что Яхве показал Моисею[b], так светильник и сделали.'
  rationale: Перевод уточнён, чтобы заключительная фраза передавала соотнесение изготовления с тем, что было показано Моисею, не утверждая, что ему был показан уже изготовленный предмет. «Чеканная работа» лучше передаёт технический смысл מִקְשָׁה и его повтор, а примечания сохраняют существенные лексические альтернативы. Неопределённо-личная конструкция в финале оставлена как естественный русский способ не называть исполнителя.
  reviewer_model: gpt-5.6-terra
