  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: ru
  text: 'Таково было устройство светильника: чеканная работа из золота[a]; от основания до цветков — весь он был чеканной работы. В соответствии с тем, что Яхве показал Моисею[b], так светильник и сделали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выбитая работа»; еврейское слово подчёркивает изготовление металла ударами молота. Его также иногда понимают в значении «из одного куска».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «согласно виду, который Яхве показал Моисею»; также возможно: «согласно образцу» или «согласно видению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה הַמְּנֹרָה
  choice: как был сделан светильник
  rationale: Передаёт способ изготовления предмета естественным современным русским оборотом; «светильник» — ясное название культового предмета без ненужной транслитерации.
- source_word: מִקְשָׁה זָהָב
  choice: выкован из золота / кованым
  rationale: מִקְשָׁה обозначает изделие, сформированное ударами молота. Повтор корня сохранён посредством «выкован» и «кованым»; возможное понимание «из одного куска» вынесено в примечание.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: от основания до цветков
  rationale: Парная конструкция передаёт весь охват изделия. יָרֵךְ здесь означает нижнюю часть, основание; פֶּרַח — цветочное украшение, причём русский множественный «цветков» естественно соотносится с описанием украшений светильника.
- source_word: כַּמַּרְאֶה
  choice: таким, каким его показал
  rationale: Сохраняет зрительное значение מַרְאֶה и не сужает его без необходимости до технического «чертежа» или «образца»; возможные оттенки пояснены в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כֵּן עָשָׂה אֶת הַמְּנֹרָה
  choice: Светильник сделали таким
  rationale: Неопределённо-личная русская конструкция сохраняет невыраженность подлежащего в еврейском тексте и не вводит конкретного мастера; активный характер изготовления остаётся понятным.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, без конфессиональной подмены титулом.
- issue: Неявное подлежащее глагола עָשָׂה
  choice: неопределённо-личное «сделали»
  alternative: «он сделал» / «был сделан»
  rationale: В еврейском глагол стоит в мужском роде единственного числа, но деятель не назван. Русское «сделали» естественно не уточняет его; «он» могло бы необоснованно определить конкретного исполнителя, а пассив ослабил бы активную форму.
- issue: Значение כַּמַּרְאֶה
  choice: таким, каким его показал
  alternative: по образцу / по виду / по видению
  rationale: Формулировка сохраняет неоднозначность между показанным видом, образом и моделью, не превращая её в узко техническое или мистическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён ради ясности, но повтор указания на кованую работу и неоднозначность показанного Моисею вида сохранены. Все маркеры примечаний присутствуют в основном тексте.
