  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: ru
  text: И отдели левитов из среды сынов Израиля[a], и левиты будут Моими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из числа израильтян». Буквально: «из среды сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут принадлежать Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: И отдели
  rationale: Форма породы hифиль от בדל выражает действие отделения. В данном контексте русское повелительное «отдели» естественно передаёт значение древнееврейской формы с waw, продолжающей последовательность предписаний.
- source_word: אֶת הַלְוִיִּם
  choice: левитов
  rationale: Определённое существительное во множественном числе обозначает членов колена Левия; «левиты» — традиционное и прозрачное русское соответствие.
- source_word: מִתּוֹךְ
  choice: от среды
  rationale: Выражение указывает на выделение из состава более широкой группы. «От среды» сохраняет образ и возвышенный библейский регистр, оставаясь понятным современному читателю.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквально передаёт родственное выражение исходного текста, не заменяя его более общим «израильтян».
- source_word: וְהָיוּ לִי
  choice: и ... будут Моими
  rationale: 'Сочетание היה с לִי выражает принадлежность: «будут принадлежать Мне / будут Моими». Краткая формулировка сохраняет силу и структуру исходного текста.'
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Повтор существительного сохранён, поскольку он придаёт заключительной части фразы ясность и эмфазу.
theological_decisions:
- issue: Обозначает ли статус левитов простую принадлежность или культовое посвящение
  choice: левиты будут Моими
  alternative: левиты будут посвящены Мне
  rationale: В данном стихе конструкция לִי с היה прямо выражает принадлежность Богу, тогда как особого термина со значением «посвящать» здесь нет. Культовый смысл следует из контекста и не должен вноситься в саму формулировку стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор слова «левиты» и буквальное родственное выражение «сыны Израиля»; архаичные формы и лишнее культовое истолкование не вводятся.
