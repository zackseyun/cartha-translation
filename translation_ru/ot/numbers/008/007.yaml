  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: ru
  text: 'Вот как ты должен поступить с ними, чтобы очистить их: окропи их очистительной водой[a]; пусть они проведут бритвой по всему своему телу[b], выстирают свою одежду и очистятся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водой очищения»; буквально: «водой греха».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть проведут бритвой по всей своей плоти», то есть сбреют волосы на всём теле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: Вот что сделай с ними
  rationale: Передаёт ввод предписанной последовательности действий и сохраняет прямое обращение в единственном числе.
- source_word: לְטַהֲרָם
  choice: чтобы очистить их
  rationale: Глагол טהר здесь относится к обрядовому очищению; «очистить» понятно современному читателю и не сводит смысл только к нравственной сфере.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: окропи их
  rationale: В данном обрядовом контексте הַזֵּה обозначает окропление; русское выражение естественно передаёт действие и его направленность.
- source_word: מֵי חַטָּאת
  choice: очистительной водой
  rationale: Буквально сочетание означает «вода греха», однако здесь указывает на воду, применяемую для обрядового очищения. Краткий перевод сохраняет функцию, а буквальная неоднозначность отмечена в сноске.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: пусть они проведут бритвой по всему своему телу
  rationale: Сохраняет конкретный образ еврейской идиомы «провести бритвой»; בשר по-русски естественно передано как «тело».
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: выстирают свою одежду
  rationale: כבס обозначает стирку одежды; «выстирают» точнее обычного «вымоют» и естественно в современном русском.
- source_word: וְהִטֶּהָרוּ
  choice: и очистятся
  rationale: Возвратная форма передаёт результат совершённых ими обрядовых действий без добавления отсутствующего в тексте богословского объяснения.
theological_decisions:
- issue: Характер очищения при посвящении левитов
  choice: Передать лексику טהר как обрядовое «очищение», не ограничивая её нравственным очищением.
  alternative: Последовательно использовать более специальное «ритуально очистить» или истолковать действие исключительно как очищение от личного греха.
  rationale: Контекст описывает конкретный обряд над левитами. Формулировка должна сохранять культовый смысл, но не вносить более поздние doctrинальные категории.
- issue: Значение מֵי חַטָּאת
  choice: В основном тексте — «очистительная вода», с буквальным вариантом в сноске.
  alternative: «Вода для очищения от греха» или «вода жертвы за грех».
  rationale: Слово חטאת допускает связь с грехом, очищением и жертвой за грех, но существительное «жертва» в стихе прямо не названо. Перевод не должен преждевременно устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified тоном предписания. Синтаксис сохраняет последовательность обрядовых действий; технические особенности исходного выражения вынесены в сноски.
