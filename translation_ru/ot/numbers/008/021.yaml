  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: ru
  text: Левиты очистились и омыли свои одежды; Аарон представил их перед Яхве как приношение потрясания[a] и совершил за них искупление, чтобы очистить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил над ними обряд потрясания». В еврейском тексте употреблено обычное обрядовое выражение: Аарон совершил над левитами תְּנוּפָה — «приношение потрясания» — перед Яхве. Характер физического действия в применении к левитам не уточняется.'
    reason: Лексическая альтернатива для обрядового сочетания נוף с תְּנוּפָה; буквальный характер движения в применении к левитам не вполне ясен.
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: очистились
  rationale: Возвратная порода глагола חטא в данном священническом контексте обозначает прохождение обряда очищения. Перевод не добавляет слова «от греха», которого в еврейской формулировке прямо нет.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: выстирали свои одежды
  rationale: Передаёт намеренное ритуальное омовение одежды естественным современным русским языком; בִּגְדֵיהֶם означает принадлежащую им одежду.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: представил их ... как приношение возношения
  rationale: Сохраняет стандартную обрядовую формулу נוף с תְּנוּפָה и не создаёт впечатления, будто Аарон буквально размахивал людьми. Возможный более буквальный обрядовый вариант дан в сноске.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт пространственно-обрядовое выражение לִפְנֵי и сохраняет личное заветное имя יהוה.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: совершил за них искупление
  rationale: Устойчиво и понятно передаёт священническое значение כפר, не уточняя сверх текста механизм искупительного действия.
- source_word: לְטַהֲרָם
  choice: чтобы очистить их
  rationale: Инфинитив выражает цель или результат искупительного действия Аарона; формулировка сохраняет эту смысловую связь.
theological_decisions:
- issue: Соотношение обрядового очищения, искупления и последующего очищения
  choice: «очистились»; «совершил за них искупление»; «чтобы очистить их»
  alternative: «очистили себя от греха»; «совершил очищение за них»; «чтобы освятить их»
  rationale: Текст использует связанные, но не тождественные корни חטא, כפר и טהר. Выбранные выражения сохраняют священническую последовательность и напряжение между участием самих левитов и посредническим действием Аарона, не добавляя прямо не названного «греха» и не смешивая очищение с освящением.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано прямо как «Яхве».
- issue: Характер обряда תְּנוּפָה, применённого к левитам
  choice: «представил их ... как приношение возношения»
  alternative: «совершил над ними обряд возношения»; «потряс ими как приношением»
  rationale: Основной текст обозначает ритуальное представление левитов перед Яхве, не навязывая конкретную реконструкцию физического движения. Сноска сохраняет более буквальную обрядовую возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной обрядовой лексикой. Короткие предложения устраняют тяжёлую цепочку союзов, не меняя последовательности действий. Термины «приношение возношения» и «искупление» сохраняют культовый характер стиха; местоимение «свои» естественно обозначает принадлежность одежды левитам.
