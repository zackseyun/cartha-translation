base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: ru
  text: Но он может служить вместе со своими братьями в шатре встречи, исполняя порученные обязанности[a], но работы пусть не выполняет[b]. Так поступай с левитами при исполнении их обязанностей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «соблюдая обязанность [поручение]». Еврейское выражение означает исполнять вверенную обязанность и не обязательно относится только к охране.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но служебной работы пусть не совершает». Еврейский текст противопоставляет разрешённое служение работе, от которой левит освобождался по достижении установленного возраста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: Но он может помогать
  rationale: שרת обозначает служение, нередко священное. В данном контексте оно противопоставлено запрещённой далее עֲבֹדָה и указывает на разрешённое участие после прекращения регулярной службы. «Помогать» естественно передаёт вспомогательный характер этого участия, не смешивая его с обычной работой.
- source_word: אֶת־אֶחָיו
  choice: своим братьям
  rationale: После שרת конструкция указывает на участие вместе с другими левитами или помощь им. «Братьям» сохраняет буквальный родственный образ; из контекста ясно, что речь о собратьях-левитах.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: Устойчивое обозначение святилища. Предлог ב допускает локальное «в/при»; «при шатре» естественно охватывает служение в самом шатре и при нём.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: исполняя порученные обязанности
  rationale: Сочетание инфинитива с однокоренным существительным означает соблюдение вверенного поручения или несение установленной обязанности. Формулировка ясна современному читателю и не сужает смысл до охраны.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: а обычной работы пусть не выполняет
  rationale: 'Однокоренные существительное и глагол образуют усиленную конструкцию: левит не должен выполнять регулярную служебную работу, от которой освобождён по возрасту. «Обычной работы» отличает её от разрешённой помощи.'
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: Так поступай с левитами
  rationale: Естественная русская передача заключительного предписания, обращённого к Моисею во втором лице единственного числа.
- source_word: בְּמִשְׁמְרֹתָם
  choice: при исполнении их обязанностей
  rationale: מִשְׁמֶרֶת обозначает вверенные обязанности или установленный круг ответственности. Выражение связывает правило с порядком несения левитами их обязанностей.
theological_decisions:
- issue: Соотношение разрешённого участия пожилого левита и запрещённой ему работы
  choice: После установленного возраста левит может продолжать помогать собратьям в исполнении порученных обязанностей, но не должен выполнять обычную регулярную работу.
  alternative: После установленного возраста запрещено всякое участие; либо разрешена исключительно узкая сторожевая функция.
  rationale: Текст намеренно противопоставляет שרת и עֲבֹדָה...עבד, поэтому речь идёт не о полном прекращении всякой деятельности, а о различии между разрешённой помощью и запрещённой регулярной работой. Перевод сохраняет это различие, не определяя точный объём помощи сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Шатёр встречи» передаёт אֹהֶל מוֹעֵד буквально и понятно. Различие между «помогать» и «выполнять обычную работу» сохраняет лексическое и смысловое напряжение исходного текста; модальность разрешения выводится из контраста с предшествующим возрастным ограничением.
