  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: ru
  text: Пусть они возьмут молодого быка и хлебное приношение при нём — муку тонкого помола, смешанную с маслом; а ты возьми второго молодого быка в жертву за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское слово חַטָּאת в священнических обрядовых текстах может обозначать жертву за грех или очистительную жертву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Пусть они возьмут
  rationale: Форма с союзом продолжает последовательность обрядовых предписаний; конструкция с «пусть» естественно передаёт предписывающую силу и сохраняет третье лицо множественного числа.
- source_word: פַּר בֶּן בָּקָר
  choice: молодого быка
  rationale: Буквально «быка, сына крупного скота»; это еврейское сочетание обозначает молодого быка. Числительное не добавлено, поскольку далее он естественно противопоставлен «второму» быку.
- source_word: וּמִנְחָתוֹ
  choice: и хлебное приношение к нему
  rationale: В жертвенном контексте מִנְחָה обозначает приношение из муки или зерна; местоименный суффикс связывает его с первым быком как сопутствующее приношение.
- source_word: סֹלֶת
  choice: муку тонкого помола
  rationale: Культовый термин обозначает тщательно смолотую, тонкую муку; этот вариант точен и понятен современному читателю.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанную с маслом
  rationale: Передана обычная формула приготовления хлебного приношения без архаизации.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: а ты возьми второго молодого быка
  rationale: Сохранён значимый переход от третьего лица множественного числа к обращению во втором лице единственного числа; שֵׁנִי передано как «второго».
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Традиционное и лексически обоснованное обозначение жертвы חַטָּאת; её очистительная функция отражена в примечании как допустимый вариант.
theological_decisions:
- issue: Передача חַטָּאת в священническом жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Еврейское слово связано с грехом, но в обрядовом контексте также обозначает жертву, выполняющую очистительную функцию. Основной текст сохраняет привычное название, а примечание не даёт утратить функциональный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический переход от «они» к «ты» сохранён. Точка с запятой помогает ясно разделить два предписания.
