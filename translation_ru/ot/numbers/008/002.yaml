base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: ru
  text: 'Обратись к Аарону и скажи ему: «Когда будешь зажигать лампы[a], пусть семь ламп светят в сторону передней части светильника».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда будешь устанавливать лампы». Еврейский глагол буквально означает «поднимать, заставлять подниматься» и здесь может относиться как к зажиганию ламп, так и к их установке в таком положении, чтобы они светили к передней части светильника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֵלָיו
  choice: Скажи Аарону и передай ему
  rationale: Два глагола речи переданы раздельно, чтобы сохранить повтор исходного текста, но избежать неестественного русского «говори… и скажи».
- source_word: בְּהַעֲלֹתְךָ
  choice: Когда будешь зажигать
  rationale: В контексте ламп каузативная форма глагола עלה, буквально «поднимать; заставлять подниматься», естественно обозначает зажигание, при котором пламя поднимается. Возможная отсылка к установке или приведению ламп в надлежащее положение сохранена в сноске.
- source_word: הַנֵּרֹת
  choice: лампы
  rationale: נֵר обозначает конкретную масляную лампу, а не отвлечённый свет.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: вперёд, перед светильником
  rationale: Формулировка сохраняет направительное значение אֶל מוּל и пространственный образ פְּנֵי, оставаясь понятной по-русски.
- source_word: יָאִירוּ
  choice: пусть ... светят
  rationale: Русская побудительная конструкция естественно передаёт форму предписания; глагол «светить» выражает действие ламп без тяжеловесного «давать свет».
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: все семь ламп
  rationale: «Все» естественно подчёркивает совокупность семи ламп, не изменяя указанного в еврейском тексте количества.
- source_word: הַמְּנוֹרָה
  choice: светильник
  rationale: Предмет назван по его функции, без транслитерации «менора»; в данном контексте ясно, что речь идёт о храмовом светильнике с семью лампами.
