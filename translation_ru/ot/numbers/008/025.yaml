translation_notes:
  register: Современный литературный русский язык; формулировка ясная и dignified, без военного оттенка у צָבָא. Связка «служба при работах» сохраняет различие צָבָא и עֲבֹדָה, а сноска отражает буквальный образ глагола שוב.
