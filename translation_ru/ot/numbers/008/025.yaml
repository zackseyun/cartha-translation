  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: ru
  text: А с пятидесяти лет он должен отойти от служебных обязанностей и больше не служить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернуться от служебных обязанностей»; еврейский глагол буквально означает «вернуться, повернуть назад» и в этом контексте указывает на прекращение активной службы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: А с пятидесяти лет
  rationale: Еврейская возрастная формула обозначает порог, начиная с которого действует предписание; по-русски естественно «с пятидесяти лет».
- source_word: יָשׁוּב
  choice: должен оставить
  rationale: Глагол буквально означает «вернуться, повернуть назад», но с предлогом מן в данном административном контексте передаёт прекращение активной службы. «Оставить» ясно выражает этот смысл, а буквальное значение отмечено в сноске.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: службу при работах
  rationale: צָבָא здесь обозначает не воинство, а установленную службу левитов, а עֲבֹדָה — выполняемые ими работы. Перевод сохраняет различие двух близких понятий без тяжеловесного буквального оборота «служба работы».
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: и больше не служить
  rationale: עבד в контексте обязанностей левитов означает исполнять службу. Инфинитив после модального «должен» естественен в русском и точно передаёт прекращение дальнейшей активной службы.
