  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: Указание на форму оригинала и традиционный вариант передачи Божьего имени.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма wayyiqtol продолжает повествовательную последовательность. В современной русской библейской речи «И сказал» естественно передаёт формулу וַיְדַבֵּר ... לֵאמֹר без тяжеловесного буквального «говорил, говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно обозначает адресата речи и точно передаёт сочетание предлога אֶל с именем מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит прямую речь следующего стиха; в современном русском эту функцию естественно и без смысловой потери выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон как личное имя. «Яхве» передаёт его непосредственно, тогда как «Господь» заменяет имя титулом, а «Иегова» отражает более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Сочетание וַיְדַבֵּר ... לֵאמֹר передано естественной русской формулой «И сказал ...:», поскольку прямая речь следует в следующем стихе.
