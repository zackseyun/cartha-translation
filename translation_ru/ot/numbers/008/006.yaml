  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: ru
  text: «Возьми левитов из среды сынов Израиля и очисти их».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח
  choice: Возьми
  rationale: Императив от לקח прямо повелевает Моисею взять левитов; «возьми» естественно и точно передаёт формулировку исходного текста, не добавляя явно не выраженного значения «избери».
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Устоявшееся и точное обозначение потомков Левия, назначенных для служения при святилище.
- source_word: מִתּוֹךְ
  choice: из среды
  rationale: Передаёт отделение левитов из состава более широкой общности Израиля и сохраняет образную структуру еврейского выражения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквально сохраняет родовое и заветное обозначение народа; в данном контексте выражение относится к израильскому народу как общности.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: и очисти их
  rationale: Глагол טהר здесь обозначает обрядовое очищение; «очисти» ясно передаёт это значение и соответствует повелительной форме русского предложения.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народа Израиля
  rationale: Буквальная семейно-заветная формула сохранена без сведения её значения только к лицам мужского пола; контекст показывает корпоративное обозначение Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и повелительный; буквальная формула «сыны Израиля» сохранена в грамматически требуемом родительном падеже «сынов Израиля». Дополнительная сноска не требуется, поскольку основной текст непосредственно отражает еврейскую формулировку.
