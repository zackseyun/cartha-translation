base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: ru
  text: Поставь левитов перед Аароном и перед его сыновьями и представь их Яхве как приношение потрясания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потряси их как приношение потрясания для Яхве». В еврейском тексте употреблены однокоренные глагол и существительное, обозначающие ритуальное потрясание (представление) приношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Поставь
  rationale: 'Порода hифиль глагола עמד выражает побуждение занять место: «поставить», «расположить». Императив естественно продолжает обращённые к Моисею предписания контекста.'
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое русское обозначение представителей колена Левия; определённость передаётся контекстом.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог обозначает нахождение или официальное представление перед кем-либо; «перед» сохраняет пространственный и ритуальный оттенки.
- source_word: אַהֲרֹן
  choice: Аароном
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: בָנָיו
  choice: его сыновьями
  rationale: В данном священническом контексте בנים означает именно сыновей Аарона.
- source_word: וְהֵנַפְתָּ
  choice: и представь
  rationale: Hифиль глагола נוף обозначает ритуальное потрясание или представление приношения. «Представь» естественно звучит применительно к людям, а специальный ритуальный смысл сохраняется следующим существительным.
- source_word: אֹתָם
  choice: их
  rationale: Прямое дополнение относится к левитам.
- source_word: תְּנוּפָה
  choice: как приношение возношения
  rationale: Существительное обозначает особый вид ритуально представляемого приношения. Формулировка сохраняет культовую категорию и не создаёт впечатления, будто левитов буквально приносили в жертву.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата ритуального представления, а тетраграмматон передан как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу; Иегове
  rationale: Исходный текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует заданному решению консультационного слоя.
- issue: Характер ритуального действия над левитами
  choice: представь их Яхве как приношение возношения
  alternative: потряси их как приношение потрясания; принеси их как возношение
  rationale: Сочетание глагола נוף и существительного תְּנוּפָה намеренно повторяет один корень и указывает на формальный обряд. Основной текст передаёт его смысл естественно применительно к людям, а буквальная форма отмечена в сноске; слово «принеси» избегается, чтобы не подразумевать умерщвление левитов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритуальным регистром. Синтаксис краток и понятен; архаизмы исключены. Однокоренная конструкция оригинала пояснена в сноске, поскольку её буквальное воспроизведение в основном тексте звучало бы неестественно применительно к левитам.
