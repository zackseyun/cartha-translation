review_pass:
  verdict: revise
  source_fidelity: 'Основной синтаксис и участники действия переданы верно: левиты поставлены перед Аароном и его сыновьями, после чего над ними совершается ритуальное действие, направленное Яхве. Однако «приношение возношения» терминологически неточно: «возношение» в русской библейской традиции обычно соответствует другому виду приношения (תרומה), тогда как תנופה — приношение/обряд потрясания. Сочетание глагола נוף и существительного תנופה следует сохранить в основном тексте и/или ясно отразить в сноске.'
  naturalness: «Поставь левитов перед Аароном и перед его сыновьями» — естественная и ясная формулировка. «Представь их Яхве как приношение потрясания» сохраняет современный литературный строй и ритуальный регистр; специальный термин поясняется сноской.
  terminology: Форма «Яхве» последовательно передаёт יהוה. «Левиты», «Аарон», «сыновья» уместны. «Приношение потрясания» точнее передаёт תנופה, чем «приношение возношения».
  issues:
  - severity: high
    issue: Термин תנופה передан как «приношение возношения».
    rationale: «Возношение» в русской библейской терминологии связано прежде всего с иным еврейским термином; здесь נוף / תנופה обозначают ритуальное потрясание (wave offering). Подмена затушёвывает лексическое повторение оригинала.
  - severity: medium
    issue: Сноска, помеченная «Буквально», не является достаточно буквальным воспроизведением еврейской конструкции.
    rationale: В тексте стоит «потряси их [как] потрясание/приношение потрясания для Яхве», а не «соверши ими потрясание пред Яхве». Сноска должна либо дать действительно близкий перевод, либо быть обозначена как пояснение.
  revised_text: Поставь левитов перед Аароном и перед его сыновьями и представь их Яхве как приношение потрясания[a].
