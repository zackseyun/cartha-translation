- from: Поставь левитов перед Аароном и перед его сыновьями и представь их Яхве как приношение возношения[a].
  to: Поставь левитов перед Аароном и перед его сыновьями и представь их Яхве как приношение потрясания[a].
  rationale: Заменено «приношение возношения» на «приношение потрясания», чтобы точно передать תנופה и не смешивать его с термином «возношение». Сноска исправлена так, чтобы её буквальный вариант отражал объект действия, повтор корня и направленность действия Яхве. Остальная формулировка сохранена, поскольку она точна и естественна для современного литературного русского.
