  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: ru
  text: Ибо Мне принадлежит каждый первенец среди сынов Израиля — и у людей, и у скота. В тот день, когда Я поразил всех первенцев в земле Египта, Я посвятил их Себе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я освятил их для Себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего утверждения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: לִי כָל בְּכוֹר
  choice: Мне принадлежит каждый первенец
  rationale: לִי выражает принадлежность, а כָל בְּכוֹר — собирательное «каждый первенец» без добавления отсутствующего в тексте слова «мужского пола».
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохраняется родовое и заветное выражение בני ישראל; такая форма понятна и уместна в современном литературном русском.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: и у людей, и у скота
  rationale: Собирательные существительные обозначают две категории — людей и домашних животных. Русская парная конструкция ясно и естественно передаёт их противопоставление.
- source_word: בְּיוֹם הַכֹּתִי
  choice: В тот день, когда Я поразил
  rationale: Передаёт временную конструкцию и прямое значение נכה без архаичного «сразил» и без излишнего уточнения способа поражения.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохраняется полный географический оборот с אֶרֶץ; традиционная русская форма остаётся литературной и понятной.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: Я посвятил их Себе
  rationale: Глагол в породе hifil означает сделать священными, отделить для Бога; «посвятил» сохраняет сакральный смысл и звучит естественно.
theological_decisions:
- issue: Значение אָדָם в противопоставлении человеку и животному
  choice: у людей
  alternative: у человека / среди человечества
  rationale: Здесь אָדָם обозначает человеческую категорию в целом. Множественное «людей» недвусмысленно передаёт родовое значение и не ограничивает смысл одним мужчиной.
- issue: Сакральная сила הִקְדַּשְׁתִּי
  choice: Я посвятил их Себе
  alternative: Я отделил их для Себя
  rationale: «Посвятил» удерживает идею принадлежности Богу и святости, тогда как «отделил» само по себе может звучать лишь как обычное обособление.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены выражение «сыны Израиля», полный оборот «земля Египетская» и сакральный смысл посвящения; синтаксис при этом сделан естественным для современного читателя.
