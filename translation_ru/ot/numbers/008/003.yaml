base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: ru
  text: 'И Аарон так и сделал: он установил лампады светильника[b], обращёнными к его передней стороне[a], как Яхве повелел Моисею.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив передней стороны» или «лицом к передней стороне светильника».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зажёг лампады светильника». Еврейский глагол буквально означает: «поднял его лампады»; в данном контексте он может обозначать их установку или зажигание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: И Аарон так и сделал
  rationale: Устойчивое выражение сообщает, что Аарон в точности исполнил данное прежде указание; «так и сделал» естественно передаёт также подчёркнутое соответствие.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: обращёнными к передней стороне светильника
  rationale: Сочетание предлогов указывает на направленность относительно «лица», то есть передней стороны светильника. Формулировка передаёт ориентацию, не фиксируя точную пространственную схему.
- source_word: הַמְּנוֹרָה
  choice: светильник
  rationale: В контексте скинии это понятное русское название предмета; оно предпочтительнее заимствованного «менора».
- source_word: הֶעֱלָה
  choice: установил
  rationale: Порода hифиль глагола עלה буквально выражает побуждение к подъёму и применительно к лампадам может означать их установку либо зажигание. В непосредственном контексте указания об их направлении «установил» сохраняет предметный смысл, а возможное значение «зажёг» отмечено в сноске.
- source_word: נֵרֹתֶיהָ
  choice: его лампады
  rationale: נֵר обозначает отдельную лампаду или огонь светильника. «Лампады» ясно отличает их от всего светильника; местоимение согласовано с русским словом мужского рода «светильник».
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Яхве повелел Моисею
  rationale: Оборот подчёркивает соответствие Божьему повелению. Русский вид глагола естественно выражает предшествующее завершённое действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и представляет его принятую научную огласовку, не подменяя титулом.
- issue: Значение הֶעֱלָה применительно к лампадам
  choice: установил
  alternative: зажёг
  rationale: Контекст прежде всего говорит о расположении и направлении лампад, однако глагол способен обозначать их зажигание. Основной текст следует пространственному контексту, а сноска сохраняет смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для широкого читателя; техническое «менора» не используется. Неоднозначность пространственного выражения и глагола הֶעֱלָה сохранена в сносках.
