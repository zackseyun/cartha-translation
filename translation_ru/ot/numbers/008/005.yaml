  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; традиционно переводится как «Господь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в стандартной повествовательной формуле введения речи естественно передаётся по-русски глаголом «сказал»; буквальное «говорил» здесь звучало бы менее естественно и могло бы ошибочно указывать на длительность действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Направленность речи, выраженная предлогом אֶל, естественно передана русским дательным падежом; имя מֹשֶׁה дано в принятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит последующую прямую речь. В современном русском эту функцию естественно и точно выполняет двоеточие.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно сохранено в транслитерации; традиционная замена титулом отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык. Сохранена краткая библейская формула введения речи, но причастная конструкция «говоря» заменена нормативным русским двоеточием.
