  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: ru
  text: Приведи левитов пред Яхве, и сыны Израиля[a] возложат свои руки на левитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтяне». Буквально: «сыны Израиля» — обычное собирательное обозначение народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Приведи
  rationale: Порода hифиль глагола קרב означает «приблизить, подвести, представить». «Приведи» естественно передаёт действие в контексте ритуального предстояния, не добавляя идеи посвящения, которой нет в самом глаголе.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Обычное русское обозначение потомков Левия и установленной группы служителей.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает «перед, в присутствии». «Пред Яхве» сохраняет пространственно-ритуальный оттенок и соответствует dignified modern literary register.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: וְסָמְכוּ
  choice: пусть … возложат
  rationale: В ритуальной конструкции סמך с ידים и על означает возложение рук. Форма с «пусть» естественно продолжает предписание после повелительного «приведи».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт еврейское выражение «сыновья Израиля», употреблённое здесь как устойчивое коллективное обозначение народа; сноска поясняет естественный русский эквивалент.
- source_word: יְדֵיהֶם
  choice: свои руки
  rationale: Возвратное «свои» ясно соотносит руки с сынами Израиля и передаёт местоименный суффикс множественного числа.
- source_word: עַל הַלְוִיִּם
  choice: на левитов
  rationale: Предлог על в формуле возложения рук естественно передаётся русским «на».
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит Тетраграмматон; транслитерация сохраняет различие между личным именем и титулом, не привнося конфессионального толкования.
- issue: Коллективное значение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет мужскую форму исходного устойчивого выражения, не решая без необходимости вопрос о конкретном составе участвующих; сноска сообщает его обычное коллективное значение.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. «Пред» выбрано вместо разговорно-нейтрального «перед» ради краткости и ритуального контекста; синтаксис остаётся ясным для современного читателя.
