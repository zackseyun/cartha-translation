  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: ru
  text: Тогда левиты возложат руки на головы быков, а ты принеси одного как жертву за грех[a], а другого — как всесожжение Яхве, чтобы совершить искупление за левитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как очистительную жертву». Еврейское слово חַטָּאת может обозначать жертву, связанную как с грехом, так и с обрядовым очищением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: возложат руки
  rationale: В жертвенном контексте глагол סמך обозначает установленное обрядовое возложение рук на животное; формулировка естественна для современного русского языка.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: на головы быков
  rationale: Единственное число רֹאשׁ при множественном числе «быков» имеет распределительное значение; по-русски естественно употребить множественное число «головы».
- source_word: וַעֲשֵׂה
  choice: а ты принеси
  rationale: Форма обращена к одному служителю. В данном жертвенном контексте עשה означает совершить принесение жертвы, а не буквально «сделать».
- source_word: חַטָּאת
  choice: жертву за грех
  rationale: Это традиционное и понятное обозначение данного вида жертвы; возможный оттенок очищения сохранён в сноске.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано собственное имя יהוה, прямо употреблённое в еврейском тексте.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: чтобы совершить искупление за левитов
  rationale: Формулировка сохраняет культово-богословское значение כפר и не уточняет механизм искупления сверх сказанного в тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Значение חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Основной вариант узнаваем и естественен, а альтернативный отражает реальную лексическую многозначность термина в священническом контексте и потому вынесен в сноску.
- issue: Значение כפר
  choice: совершить искупление за левитов
  alternative: очистить левитов посредством обряда
  rationale: Выбранный вариант сохраняет богословскую ёмкость глагола и не сводит его значение исключительно к очищению.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства обрядового предписания. Единственное число адресата передано явным «ты»; синтаксис сделан естественным без устранения лексической неоднозначности חַטָּאת.
