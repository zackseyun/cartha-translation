  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: ru
  text: И после этого левиты пришли совершать своё служение в шатре встречи перед Аароном и его сыновьями. Как Яхве повелел Моисею о левитах, так с ними и поступили[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так и сделали для них». Еврейская фраза кратка; она может означать, что предписанные обряды были совершены по отношению к левитам.'
    reason: Лексико-синтаксическая неоднозначность выражения כֵּן עָשׂוּ לָהֶם.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: И после этого
  rationale: Передаёт как соединительный ו, так и временную последовательность после очищения и посвящения левитов.
- source_word: בָּאוּ
  choice: пришли
  rationale: Сохраняет обычное значение глагола движения, не уточняя сверх текста, что левиты именно вошли внутрь шатра.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: совершать своё служение
  rationale: Естественно передаёт культовое служение и избегает неуклюжего буквального повтора «служить своё служение».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Передаёт значение מוֹעֵד как назначенной встречи и сохраняет предлог «в», не ограничивая служение только внешней территорией.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: перед Аароном и его сыновьями
  rationale: Сохраняет пространственно-реляционное значение לִפְנֵי и не превращает возможный смысл надзора в явное толкование.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עַל הַלְוִיִּם
  choice: о левитах
  rationale: Кратко и естественно обозначает предмет данного Моисею повеления.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: так с ними и поступили
  rationale: Сохраняет невыраженный в еврейском тексте субъект множественного числа и отношение действия к левитам, не конкретизируя сам обряд.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя без замены титулом.
- issue: Кто совершил предписанное по отношению к левитам
  choice: 'Не называть субъект: «так с ними и поступили»'
  alternative: Аарон и его сыновья поступили с ними так; так было сделано для них
  rationale: В форме עָשׂוּ субъект прямо не назван. Контекст допускает его восстановление, но перевод сохраняет лаконичность и неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формы «сыновьями» и «своё» предпочтены архаизирующим вариантам; синтаксическая сдержанность оригинала сохранена.
