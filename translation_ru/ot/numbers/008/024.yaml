base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: ru
  text: 'Вот что касается левитов: с двадцатипятилетнего возраста и старше каждый из них должен являться для исполнения служебных обязанностей[a] при шатре встречи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский оборот можно также передать как «вступать на службу» или «нести службу»; в нём присутствует военный оттенок.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: Вот что касается левитов
  rationale: Оборот вводит предписание, относящееся к левитам; формулировка сохраняет его нормативный характер и естественно звучит по-русски.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: с двадцатипятилетнего возраста и старше
  rationale: Точно передаёт нижнюю возрастную границу и еврейский оборот «и выше» в современном литературном русском.
- source_word: יָבוֹא
  choice: должен приступать
  rationale: В контексте нормативного предписания глагол обозначает вступление в исполнение назначенной службы; модальная конструкция передаёт юридическую силу формы.
- source_word: לִצְבֹא צָבָא
  choice: к исполнению обязанностей
  rationale: Передаёт устойчивый оборот о несении организованной службы, не превращая храмовое служение в буквальную военную деятельность; военный оттенок отмечен в сноске.
- source_word: בַּעֲבֹדַת
  choice: при служении
  rationale: עֲבֹדָה здесь обозначает установленный труд или служение, связанное со святилищем.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Точное и понятное обозначение священного шатра, где происходит встреча с Богом.
theological_decisions:
- issue: Единственное число глагола при собирательном обозначении левитов
  choice: каждый из них должен приступать
  alternative: они должны приступать
  rationale: Формулировка «каждый из них» сохраняет единичную форму еврейского предписания и одновременно ясно связывает её со всеми левитами.
translation_notes:
  register: Современный литературный русский с умеренно официальным тоном, соответствующим нормативному предписанию. Повтор еврейских слов со значением службы передан без тяжеловесной русской тавтологии; его дополнительный оттенок сохранён в сноске.
