revisions:
- from: 'Вот что касается левитов: с двадцатипятилетнего возраста и старше каждый из них должен приступать к исполнению обязанностей[a] при служении в шатре встречи.'
  to: 'Вот что касается левитов: с двадцатипятилетнего возраста и старше каждый из них должен являться для исполнения служебных обязанностей[a] при шатре встречи.'
  rationale: Редакция устраняет неуклюжее «исполнение обязанностей при служении», сохраняя различие между идиомой о несении службы и служением при шатре. Сноска формулирует военный оттенок с необходимой осторожностью.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:48:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл возрастного порога, адресат и нормативный характер переданы верно. Однако «приступать к исполнению обязанностей при служении» неудачно воспроизводит два близких еврейских термина: конструкция тяжеловесна, а «при служении» синтаксически размыто. Глагол יָבוֹא уместно передать как обязанность являться/приходить для назначенной службы; לִצְבֹא צָבָא — как исполнение служебных обязанностей, а בַּעֲבֹדַת — как служение при шатре.'
  naturalness: Предлагаемая редакция звучит естественно в современном литературном русском и сохраняет официальный тон предписания. «Являться для исполнения служебных обязанностей» ясно выражает регулярную обязанность и не создаёт неуклюжего повтора «служение ... при служении».
  terminology: «Левиты» и «шатёр встречи» сохранены. «Служебные обязанности» передаёт идиому לִצְבֹא צָבָא без ложного утверждения о буквальной военной службе. Сноска сохраняет допустимые альтернативы и осторожно отмечает военный оттенок, не называя служение повинностью.
  issues:
  - severity: medium
    issue: Неестественная и неясная конструкция «приступать к исполнению обязанностей при служении».
    rationale: Она перегружена отвлечёнными существительными и не показывает ясно, что обязанности исполняются в служении при шатре. Более прямое «являться для исполнения служебных обязанностей при шатре встречи» естественнее и точнее соотносит элементы еврейской фразы.
  - severity: low
    issue: Сноска называет оттенок «подобной воинской повинностью».
    rationale: «Повинность» в русском имеет дополнительную окраску принудительной повинности, которой текст не утверждает. Достаточно отметить военный оттенок идиомы.
  revised_text: 'Вот что касается левитов: с двадцатипятилетнего возраста и старше каждый из них должен являться для исполнения служебных обязанностей[a] при шатре встречи.'
