source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: ru
  text: И Я отдал левитов как дар Аарону и его сыновьям из среды сынов Израиля[a], чтобы исполнять служение сынов Израиля в шатре встречи и совершать искупление за сынов Израиля[b], чтобы среди сынов Израиля не было поражения, когда сыны Израиля приближаются к святилищу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдал левитов отданными». Повтор корня «давать» подчёркивает, что левиты сами отданы Аарону и его сыновьям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершать очищение ради сынов Израиля». Еврейский глагол может обозначать как искупление, так и обрядовое очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־הַלְוִיִּם נְתֻנִים
  choice: И Я отдал левитов как дар
  rationale: Форма נתן передаёт совершённое действие в последовательности речи, а נְתֻנִים повторяет тот же корень для усиления. «Отдал… как дар» естественно по-русски сохраняет и результат действия, и акцент на том, что сами левиты даны Аарону и его сыновьям.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Аарону и его сыновьям
  rationale: Предлог לְ обозначает адресата или получателя; дательный падеж является естественным русским соответствием.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: из среды сынов Израиля
  rationale: מִתּוֹךְ указывает на избрание из состава более широкой группы. Формула «сыны Израиля» сохраняет конкретное выражение еврейского текста.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת
  choice: чтобы они совершали служение
  rationale: Инфинитив и однокоренное существительное подчёркивают исполнение порученного служения. Русское «совершали служение» передаёт эту связь без неестественного буквального повтора.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: при шатре встречи
  rationale: בְּ может обозначать место или сферу служения. «При шатре встречи» естественно охватывает служение как внутри шатра, так и в связи с ним, не сужая пространственный смысл.
- source_word: וּלְכַפֵּר עַל
  choice: и совершали искупление за
  rationale: В священническом контексте כפר обозначает обрядовое искупление или очищение. Формула «совершать искупление за» сохраняет культово-богословский смысл, не уточняя механизм сверх сказанного в тексте.
- source_word: נֶגֶף
  choice: поражение
  rationale: Слово может обозначать удар, бедствие или губительное поражение, в том числе мор. «Поражение» сохраняет широту значения и связь с наказанием за недозволенное приближение.
- source_word: בְּגֶשֶׁת
  choice: когда … приближаются
  rationale: Инфинитивная конструкция с בְּ передаёт временное обстоятельство; придаточное с «когда» естественно звучит по-русски.
- source_word: הַקֹּדֶשׁ
  choice: святилищу
  rationale: В контексте шатра слово обозначает священное место или святилище. «Святилище» является естественным конкретным обозначением, при этом возможна более буквальная передача «святое место».
theological_decisions:
- issue: Роль левитов по отношению к Израилю и священникам
  choice: Левиты даны Аарону и его сыновьям из среды Израиля, чтобы исполнять служение Израиля и совершать искупление за Израиля.
  alternative: Понимать их задачу только как практическую помощь, не связанную с искуплением.
  rationale: Текст прямо соединяет служение левитов при шатре встречи с выражением לְכַפֵּר עַל. Перевод сохраняет это богословское напряжение и не сводит их роль лишь к хозяйственным обязанностям.
- issue: Значение עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: служение сынов Израиля
  alternative: служение вместо сынов Израиля
  rationale: Родительная конструкция сама по себе допускает связь служения с Израилем, но не выражает замещение отдельным предлогом. Поэтому основной текст сохраняет формальную неоднозначность и не добавляет «вместо».
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Формальное выражение сохраняет повтор и мужскую множественную форму исходного текста, оставаясь понятным в современном литературном русском.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Повтор «сыны Израиля» сохранён как заметная риторическая черта стиха; устаревшие формы вроде «дабы» и чрезмерно церковнославянская лексика не используются. «Шатёр встречи» выбран как прозрачная передача אֹהֶל מוֹעֵד.
