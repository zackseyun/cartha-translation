  source_fidelity: 'Перевод точно передаёт структуру и смысл еврейского текста: совместное действие Моисея, Аарона и всей общины; его соответствие всему, что Яхве повелел Моисею относительно левитов; а также заключительное повторение действия сынов Израиля по отношению к левитам. «Поступили с левитами» сохраняет широкое, не уточнённое значение עשה и отношение, выраженное לְ.'
  naturalness: Текст звучит как современный литературный русский с уместным умеренно библейским регистром. Повтор «так поступили с ними сыны Израиля» несколько тяжеловесен, но оправдан прямым повтором и эмфазой оригинала.
  terminology: «Яхве», «левиты», «Моисей», «Аарон» и «сыны Израиля» переданы последовательно и корректно. «Всё общество сынов Израиля» адекватно передаёт כָּל־עֲדַת בְּנֵי יִשְׂרָאֵל. Сноска уместно поясняет допустимую более гладкую альтернативу «израильтяне».
