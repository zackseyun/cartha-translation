source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: ru
  text: И Моисей, и Аарон, и всё общество сынов Израиля поступили с левитами во всём так, как Яхве повелел Моисею о левитах; так поступили с ними сыны Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля» — обычное обозначение народа завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: поступили
  rationale: Глагол עשה имеет широкое значение «делать, совершать». В данном контексте «поступили» естественно передаёт исполнение предписанных действий по отношению к левитам, не уточняя сам обряд сверх исходного текста.
- source_word: עֲדַת
  choice: общество
  rationale: עֵדָה обозначает общину Израиля как собранное заветное сообщество. «Общество» сохраняет формальный коллективный смысл и звучит естественно в современной литературной русской речи.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён родственный образ еврейского выражения, обозначающего народ Израиля; форма «сыны» уместна в dignified библейском регистре и точнее передаёт мужской множественный компонент בְּנֵי, чем нейтральное «израильтяне».
- source_word: לַלְוִיִּם / לָהֶם
  choice: с левитами / с ними
  rationale: Предлог ל обозначает лиц, по отношению к которым совершаются предписанные действия. Русское «поступить с кем-либо» естественно выражает эту связь, не сводя её только к выгоде или тематике.
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём так, как
  rationale: Оборот выражает полное соответствие Божьему повелению; русская конструкция сохраняет всеохватность כֹל и звучит естественно.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» передаёт властное предписание צוה и соответствует возвышенному, но понятному современному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, без замены титулом «Господь».
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: Моисею о левитах
  rationale: Конструкция указывает, что повеление Моисею касалось левитов. «О левитах» кратко и естественно сохраняет эту смысловую связь.
- source_word: כֵּן
  choice: так
  rationale: Наречие подчёркивает точное соответствие совершённых действий ранее данному повелению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Корпоративное родственное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбор сохраняет родственную форму оригинала и её заветно-общинный оттенок. Сноска поясняет, что выражение обозначает весь народ, не устраняя форму исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Повтор исходного текста сохранён, поскольку он подчёркивает точное исполнение повеления. Маркер сноски поставлен после последнего употребления выражения «сыны Израиля», к которому относится пояснение.
