  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: ru
  text: Затем приведи левитов пред шатёр собрания и собери всю общину сынов Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю общину израильтян». Буквально: «сынов Израиля».'
    reason: Лексическая альтернатива поясняет, что буквальное мужское родственное выражение имеет собирательное значение и обозначает народ Израиля.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Затем приведи
  rationale: Порода hифиль глагола קרב означает «приблизить, привести». В последовательности обрядовых предписаний «затем» естественно передаёт присоединительный waw и ход действий.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Обычное русское обозначение членов колена Левия, выделенных для служения при святилище.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: к шатру встречи
  rationale: לִפְנֵי буквально указывает на положение перед чем-либо; вместе с глаголом движения по-русски естественно выражает приведение к месту перед шатром. «Шатёр встречи» точно и понятно передаёт устойчивое название святилища אֹהֶל מוֹעֵד.
- source_word: וְהִקְהַלְתָּ
  choice: и собери
  rationale: Hифиль от קהל означает созвать или собрать людей. «Собери» ясно и естественно передаёт официальное созывание общины.
- source_word: כָּל עֲדַת
  choice: всё общество
  rationale: עֵדָה обозначает общину Израиля как единое собранное сообщество; «всё» передаёт כָּל. Сочетание «всё общество» сохраняет библейский общественный смысл без узкоцерковной окраски слова «приход».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняется буквальный, грамматически мужской и родственный образ исходного выражения; более идиоматичный русский вариант указан в сноске.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Выражение относится ко всему народу завета, но по форме буквально означает «сыны Израиля». Основной текст сохраняет исходный родственный образ и мужскую форму, не отрицая корпоративного значения; более естественный собирательный вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным стилем обрядового предписания. Формы повелительного наклонения обращены к одному адресату, как и древнееврейские глаголы во 2-м лице единственного числа. Маркер сноски помещён непосредственно после выражения, которое он поясняет.
