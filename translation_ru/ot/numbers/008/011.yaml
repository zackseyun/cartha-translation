  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: ru
  text: И Аарон представит левитов перед Яхве как приношение потрясания от сынов Израиля[a][b], чтобы они совершали служение Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «совершит над левитами обряд потрясания как над приношением потрясания». Глагол и существительное в еврейском тексте однокоренные и обозначают обрядовое представление дара.'
    reason: lexical_alternative
  - marker: b
    text: '«От сынов Израиля» может также означать «от имени сынов Израиля»: левиты представляются как их представители в служении Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: представит ... как приношение возношения
  rationale: Глагол נוף и однокоренное существительное תְּנוּפָה обозначают обрядовое представление дара. «Представит» естественно звучит при прямом дополнении, обозначающем людей, а «приношение возношения» сохраняет культовый термин и связь однокоренных слов.[a]
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое русское обозначение членов колена Левия.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Устойчивое библейское выражение со значением ритуального действия в присутствии Бога; краткая форма «пред» соответствует возвышенному, но понятному регистру.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: от сынов Израиля
  rationale: Предлог מֵאֵת допускает указание как на источник, так и на представительство; основной текст сохраняет формальную конструкцию оригинала, а возможное значение «от имени» отмечено в сноске.[b]
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: чтобы они совершали служение Яхве
  rationale: По-русски целевая связь после обряда естественно передаётся союзом «чтобы». Сочетание «совершали служение» отражает этимологическую фигуру עבד / עֲבֹדָה без неестественного повтора «служили служение».
theological_decisions:
- issue: Левиты названы תְּנוּפָה, культовым приношением
  choice: «представит левитов ... как приношение возношения»
  alternative: «вознесёт левитов как приношение возношения»
  rationale: Перевод сохраняет культовую категорию, но не создаёт впечатления, будто Аарон физически размахивает левитами или приносит их в жертву с умерщвлением.
- issue: Значение מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: «от сынов Израиля»
  alternative: «от имени сынов Израиля»
  rationale: Формулировка может указывать на происхождение левитов как дара, взятого у Израиля, либо на их представительскую роль. Основной текст не устраняет эту неоднозначность; альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Пред Яхве» и «служение» поддерживают достоинство культового контекста; синтаксис упрощён ровно настолько, чтобы стих был естественно понятен современному читателю.
