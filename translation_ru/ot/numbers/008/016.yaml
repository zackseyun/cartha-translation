    text: 'Или: «несомненно отданы Мне» или «полностью отданы Мне»; в еврейском тексте слово «отданы» повторено для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отверзание каждой утробы»; это еврейское выражение обозначает первенца.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «народа Израиля» или «израильтян». Буквально: «сынов Израиля».'
