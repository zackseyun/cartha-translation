  source_fidelity: 'Основной смысл передан верно: левиты всецело отданы Богу из среды сынов Израиля и взяты вместо первенцев. Однако примечание b неточно воспроизводит еврейскую конструкцию: в тексте говорится не об «открывающем всякую утробу», а об «отверзании/открытии каждой утробы», то есть об идиоме для первенца. Кроме того, эмфатический повтор נְתֻנִים נְתֻנִים лучше снабдить примечанием у «всецело отданы», а не заменять его несоответствующим примечанием при заключительном глаголе.'
  naturalness: «Из среды сынов Израиля», «всецело отданы Мне» и «Я взял их Себе» соответствуют современному литературному русскому с умеренно возвышенным библейским регистром. «Среди сынов Израиля» несколько естественнее в приложении к «первенца».
