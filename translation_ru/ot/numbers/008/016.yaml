- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: каждого первенца из сынов Израиля
  rationale: Приложение поясняет предшествующую идиому. Единственное распределительное «каждого» естественно согласуется с כָּל и русским контекстом.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: Я взял их Себе
  rationale: Формулировка передаёт завершённое Божье присвоение и естественно звучит по-русски.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля; израильтяне
  rationale: Сохранён явный родственный образ еврейского выражения без сужения его корпоративного значения; примечание сообщает естественные смысловые варианты.
- issue: Заместительная роль левитов
  choice: вместо каждого… первенца
  alternative: в обмен на каждого первенца
  rationale: «Вместо» ясно выражает замещение, не добавляя оттенка коммерческого обмена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные местоимения «Мне» и «Себе» обозначают говорящего Бога. Порядок маркеров в тексте согласован с местами, к которым относятся примечания.
