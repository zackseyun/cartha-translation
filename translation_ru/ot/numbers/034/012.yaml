base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: ru
  text: Затем граница спустится к Иордану, и её конечные точки будут у Солёного моря[a]. Такова будет ваша земля в её границах со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её выходы». В описаниях территорий древнееврейское слово может обозначать конечные точки или края границы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Затем … спустится
  rationale: Глагол ירד означает «спускаться, идти вниз». Будущее время соответствует предписывающему описанию границ, а «затем» естественно передаёт последовательность маршрута.
- source_word: הַגְּבוּל
  choice: граница
  rationale: Слово גְּבוּל обозначает границу или рубеж территории; «граница» — ясный и естественный русский эквивалент.
- source_word: הַיַּרְדֵּנָה
  choice: к Иордану
  rationale: Направительный суффикс указывает движение к Иордану. Добавление слова «река» для понимания не требуется.
- source_word: תוֹצְאֹתָיו
  choice: закончится
  rationale: В описаниях границ форма תּוֹצָאוֹת указывает на место, где линия границы оканчивается или выходит к другому ориентиру. Глагольная передача звучит естественно по-русски; буквальный образ отмечен в сноске.
- source_word: יָם הַמֶּלַח
  choice: Солёное море
  rationale: Перевод сохраняет буквальное древнееврейское название, не подменяя его современным названием «Мёртвое море».
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Такова будет ваша земля
  rationale: Фраза подводит итог описанию выделенной территории; данная формулировка естественно передаёт указательное זֹאת и значение принадлежности в לָכֶם.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: в её границах со всех сторон
  rationale: Передаёт землю как очерченную окружающими её границами и сохраняет значение סָבִיב — «кругом, со всех сторон».
