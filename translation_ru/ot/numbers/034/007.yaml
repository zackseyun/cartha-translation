    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: А вот какой будет ваша
  rationale: Сохраняет связь с последовательным описанием границ и естественно передаёт предписывающий характер формулы на современном русском языке.
- source_word: גְּבוּל צָפוֹן
  choice: северная граница
  rationale: Естественное атрибутивное сочетание, точно обозначающее северный рубеж территории.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: от Великого моря
  rationale: Сохраняет буквальное древнее географическое наименование, не подменяя его современным названием в основном тексте.
- source_word: תְּתָא֥וּ לָ/כֶ֖ם
  choice: проведите её
  rationale: В контексте размежевания редкий глагол обозначает проведение или обозначение линии границы; местоимение «её» делает подразумеваемый объект ясным по-русски.
- source_word: הֹ֥ר הָ/הָֽר
  choice: гора Ор
  rationale: Передаёт топоним в принятой русской библейской форме; родовое обозначение «гора» соответствует функции названия.
