translation:
  language: ru
  text: 'И вот ваша северная граница: от Великого моря проведите границу к горе Ор[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «наметьте границу до горы Ор». Употреблённый здесь глагол в географическом контексте может означать проведение или обозначение линии границы.'
    reason: lexical_alternative
  - marker: b
