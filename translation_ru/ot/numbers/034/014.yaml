base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: ru
  text: Ибо колено потомков Рувима — по домам своих отцов[a], и колено потомков Гада — по домам своих отцов, и половина колена Манассии получили свой удел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дома отцов» — родовые подразделения внутри каждого колена.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение предшествующего указания о разделе земли и сохраняет причинно-пояснительную связь.
- source_word: לָקְחוּ
  choice: уже получили
  rationale: Форма перфекта указывает на состоявшееся обретение удела. В контексте распределения земли русское «получили» естественнее буквального «взяли», а «уже» передаёт завершённость и связь с контекстом.
- source_word: מַטֶּה
  choice: племя
  rationale: В контексте земельного надела слово обозначает племенную общность, а не жезл.
- source_word: בְנֵי הָרְאוּבֵנִי
  choice: потомки Рувима
  rationale: Передаёт генеалогический смысл выражения естественным современным русским языком, не сводя его к менее прозрачному этнониму.
- source_word: לְבֵית אֲבֹתָם
  choice: по домам их отцов
  rationale: Сохраняет древнееврейский общественно-родовой термин и показывает, что распределение совершалось согласно родовым подразделениям племени.
- source_word: בְנֵי הַגָּדִי
  choice: потомки Гада
  rationale: Параллельно выражению о Рувиме сохраняет генеалогическую форму оригинала в естественном русском изложении.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: половина племени Манассии
  rationale: Прямо и ясно передаёт, что речь идёт об одной половине племени Манассии.
- source_word: נַחֲלָתָם
  choice: свой удел
  rationale: В данном контексте это наследственное земельное владение; «удел» точно и лаконично передаёт территориальный надел.
