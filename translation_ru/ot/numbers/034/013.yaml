  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: ru
  text: 'И повелел Моисей сынам Израиля: «Вот земля, которую вы получите в удел по жребию и которую Господь повелел отдать девяти коленам и половине колена».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: И повелел
  rationale: Передаёт повествовательную форму и властный характер распоряжения Моисея.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет традиционный библейский оборот, остающийся понятным в современном литературном русском.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: которую вы получите в удел
  rationale: Глагол от корня נחל обозначает получение земли как наследственного владения; «получите в удел» естественно передаёт это значение без искусственного русского оборота.
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Точно передаёт способ распределения земли между коленами.
- source_word: יְהוָה
  choice: Господь
  rationale: Использовано принятое в русской библейской традиции замещение тетраграмматона.
- source_word: לָתֵת
  choice: отдать
  rationale: Сохраняет активный инфинитив «дать» при естественном русском управлении после «повелел».
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: девяти коленам и половине колена
  rationale: Передаёт מַטֶּה в его контекстуальном значении «колено» и сохраняет формулу о девяти с половиной коленах.
theological_decisions:
- issue: Субъект действия при לָתֵת
  choice: Господь повелел отдать
  alternative: Господь повелел, чтобы она была отдана
  rationale: Еврейский текст содержит активный инфинитив «дать» без явно названного исполнителя. Русское «повелел отдать» сохраняет неопределённость относительно непосредственных исполнителей и не превращает конструкцию в пассив.
translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским регистром. Опущено отдельное «говоря», поскольку двоеточие естественно выполняет ту же функцию; смысл לֵאמֹר сохранён прямой речью.
