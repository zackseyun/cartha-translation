base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: ru
  text: 'Вот имена мужей, которые наделят вас землёй в наследие: священник Елеазар и Иисус, сын Навина[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дадут вам землю в наследие»; возможно также: «распределят землю между вами в наследие» или «сделают так, что вы унаследуете землю». Еврейский глагол имеет каузативный смысл: названные здесь люди наделяют народ землёй как наследственным владением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: Вот имена мужей
  rationale: Естественно передаёт указательное начало безглагольного еврейского предложения; «мужей» указывает на конкретных названных далее мужчин и сохраняет достоинство повествовательного регистра.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת־הָאָרֶץ
  choice: которые распределят для вас землю как наследие
  rationale: Каузативная форма глагола נחל здесь обозначает не собственное наследование этими людьми, а их участие в назначении и распределении земли, благодаря которому Израиль получает её в наследие. Формулировка сохраняет и административный, и наследственный смысл.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священник Елеазар
  rationale: Естественный для русского языка порядок титула и имени; употреблена устоявшаяся русская библейская форма имени.
- source_word: וִיהוֹשֻׁעַ בִּן־נוּן
  choice: и Иисус, сын Навина
  rationale: Употреблена устоявшаяся русская библейская форма имени и естественно передано еврейское отчество.
