  language: ru
  text: а от колена сынов Иссахара — вождь Палтиил, сын Аззана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: а от колена
  rationale: מַטֶּה в контексте распределения земли обозначает племенное колено; сочетание союзного וּ и предлога לְ в перечне естественно передаётся как «а от».
- source_word: בְנֵי
  choice: сынов
  rationale: Сохраняется буквальное мужское обозначение в устойчивом библейском выражении «колено сынов Иссахара».
- source_word: יִשָׂשכָר
  choice: Иссахара
  rationale: Имя передано в принятой русской библейской форме.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В данном контексте слово обозначает главу и назначенного представителя колена; «вождь» кратко и естественно соответствует роли в перечне.
- source_word: פַּלְטִיאֵל
  choice: Палтиил
  rationale: Имя транслитерировано с учётом принятой русской библейской передачи теофорного окончания.
- source_word: בֶּן
  choice: сын
  rationale: Прямое и естественное обозначение отчества в родословной формуле.
- source_word: עַזָּן
  choice: Аззан
  rationale: Имя передано транслитерацией еврейского עַזָּן с удвоенной согласной.
