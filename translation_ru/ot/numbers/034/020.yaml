  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: ru
  text: А от племени сынов Симеона — Шемуэл, сын Аммихуда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Шемуэл»; традиционная русская форма этого имени — «Самуил».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: От племени
  rationale: В контексте перечня представителей מַטֶּה обозначает племя, а не буквальный жезл. Русская формула «от племени» естественно передаёт принадлежность назначенного человека; начальный союз וּ в продолжающемся списке отдельно не выражен.
- source_word: בְּנֵי
  choice: сынов
  rationale: Сохраняет форму еврейского родового наименования «сыны Симеона»; в сочетании «племя сынов Симеона» смысл понятен как обозначение потомков и племени.
- source_word: שִׁמְעוֹן
  choice: Симеона
  rationale: Общепринятая русская библейская форма имени שִׁמְעוֹן, поставленная в родительном падеже по синтаксису фразы.
- source_word: שְׁמוּאֵל
  choice: Шемуэл
  rationale: Транслитерация здесь позволяет отличить носителя имени от общеизвестного пророка Самуила и ближе передаёт еврейскую форму.
- source_word: בֶּן
  choice: сын
  rationale: Прямое и естественное обозначение родства в перечне племенных представителей.
- source_word: עַמִּיהוּד
  choice: Аммихуда
  rationale: Русская транслитерация личного имени с передачей удвоенного согласного; родительный падеж обусловлен словом «сын».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, dignified формой административного перечня. Тире перед именем передаёт именной характер эллиптической конструкции. Маркер сноски поставлен непосредственно после относящегося ко всему имени лица фрагмента.
