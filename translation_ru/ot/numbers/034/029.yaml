source:
  edition: WLC
  text: אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה לְ/נַחֵ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: ru
  text: Вот те, кому Яхве повелел наделить сынов Израиля наследственными владениями в Ханаанской земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот те, кому Яхве повелел распределить наследие между сынами Израиля в Ханаанской земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Вот те, кому
  rationale: Указательно-относительная конструкция подводит итог перечню назначенных людей; «вот те, кому» естественно передаёт её отсылочную и заключительную функцию.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол означает «повелевать, приказывать»; контекст назначения не требует заменять его более узким словом «назначил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: לְנַחֵל
  choice: наделить … наследственными владениями
  rationale: Порода hифиль глагола נחל здесь означает дать кому-либо получить землю в наследственное владение. Формулировка сохраняет идею наследия и звучит естественно по-русски.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранён буквальный родовой оборот, обозначающий народ Израиля; в русском он понятен и соответствует торжественному регистру текста.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в Ханаанской земле
  rationale: Переданы как существительное «земля», так и географическое название; традиционная русская конструкция остаётся ясной современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл לְנַחֵל в контексте раздела земли
  choice: наделить сынов Израиля наследственными владениями
  alternative: распределить наследие между сынами Израиля
  rationale: 'Основной вариант непосредственно передаёт каузативный смысл: назначенные люди должны обеспечить получение Израилем наследственного удела. Альтернатива подчёркивает практическое распределение земли; эта допустимая смысловая грань сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Оборот «сыны Израиля» сохранён как понятное историко-родовое обозначение; устаревшие синтаксические формы не используются.
