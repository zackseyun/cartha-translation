  text: 'Для сыновей Иосифа[a], для колена сыновей Манассии: глава Ханниил, сын Ефода.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомков Иосифа… потомков Манассии». В еврейском тексте в родоплеменном значении дважды употреблено выражение «сыны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: для сынов Иосифа
  rationale: Сочетание בְּנֵי буквально означает «сыновья», а в родоплеменном контексте охватывает потомков. Формулировка «сынов Иосифа» сохраняет образ и структуру еврейского текста; предлог לְ передан словом «для».
- source_word: לְמַטֵּה
  choice: для колена
  rationale: Хотя מַטֶּה может означать «посох», в контексте распределения земли это устойчивое обозначение колена; לְ передано словом «для».
- source_word: בְנֵי מְנַשֶּׁה
  choice: сынов Манассии
  rationale: Сохранена родоплеменная формула «сыны», при этом имя מְנַשֶּׁה передано в принятой русской библейской форме «Манассия».
- source_word: נָשִׂיא
  choice: вождь
  rationale: Здесь слово обозначает главу и представителя колена. «Вождь» ясно передаёт официальную племенную роль, не приписывая носителю царского достоинства.
- source_word: חַנִּיאֵל
  choice: Ханниил
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: בֶּן אֵפֹד
  choice: сын Ефода
  rationale: Обычная патронимическая конструкция. אֵפֹד здесь является личным именем, а не названием священнического облачения.
