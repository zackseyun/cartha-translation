lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: И для племени
  rationale: В контексте распределения земли מַטֶּה означает «племя», а не «посох»; союз и предлог переданы естественным сочетанием «И для».
- source_word: בְנֵי נַפְתָּלִי
  choice: сынов Неффалима
  rationale: Сохранено буквальное обозначение «сыны Неффалима», которое в данном контексте служит обычным названием его потомков как племени.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В административном перечне слово обозначает главу, представляющего племя; «вождь» кратко и естественно передаёт его положение без монархического оттенка слова «князь».
- source_word: פְּדַהְאֵל
  choice: Педаил
  rationale: Имя передано в принятой русской библейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Прямая и естественная передача стандартной патронимической формулы.
- source_word: עַמִּיהוּד
  choice: Аммиуд
  rationale: Имя передано в принятой русской библейской форме.
