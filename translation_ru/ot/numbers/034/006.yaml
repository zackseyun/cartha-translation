  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: ru
  text: На западе вашей границей будет Великое море; это будет ваша западная граница.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: граница
  rationale: Существительное обозначает территориальный рубеж или линию, ограничивающую землю; «граница» естественно звучит в современном русском описании пределов страны.
- source_word: יָם
  choice: западной
  rationale: В сочетании גְּבוּל יָם слово «море» указывает на сторону моря, то есть на запад; направленное значение передано естественным русским прилагательным.
- source_word: הַיָּם הַגָּדוֹל
  choice: Великое море
  rationale: Сохранено библейское географическое наименование Средиземного моря и форма исходного выражения.
- source_word: וְהָיָה לָכֶם
  choice: будет у вас
  rationale: Формула указывает, что названный объект будет служить границей Израиля; перевод сохраняет конструкцию принадлежности без излишнего уточнения.
- source_word: וּגְבוּל
  choice: как граница
  rationale: Слово после «Великое море» поясняет функцию моря как рубежа; «как граница» ясно передаёт это приложение.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: это будет ваша
  rationale: Итоговая формула естественно передана по-русски с сохранением указательного и притяжательного смысла.
- source_word: גְּבוּל יָם
  choice: западная граница
  rationale: В заключительной формуле сочетание снова означает границу со стороны моря, то есть западную границу.
