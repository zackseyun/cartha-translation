  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: ru
  text: А от племени сынов Ефрема[a] — вождь Кемуил, сын Шифтана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Ефрема», то есть потомков или членов племени Ефрема.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: а от племени
  rationale: מַטֶּה буквально может означать «посох, жезл», но в перечне представителей израильских племён обозначает «племя». Союз וּ и предлог לְ в контексте продолжающегося списка естественно переданы сочетанием «а от».
- source_word: בְנֵי אֶפְרַיִם
  choice: сынов Ефрема
  rationale: Сохранена буквальная древнееврейская конструкция «сыны Ефрема» в современной падежной форме после «племени»; она обозначает потомков и членов племени.
- source_word: נָשִׂיא
  choice: вождь
  rationale: Здесь слово обозначает главу и назначенного представителя племени. «Вождь» передаёт его статус без монархического оттенка слова «князь».
- source_word: קְמוּאֵל
  choice: Кемуил
  rationale: Имя передано по принятой русской библейской традиции, с учётом древнееврейской формы.
- source_word: בֶּן
  choice: сын
  rationale: Обычная патронимическая конструкция естественно передаётся словом «сын».
- source_word: שִׁפְטָן
  choice: Шифтан
  rationale: Имя транслитерировано с древнееврейского в форме, близкой к звучанию שִׁפְטָן.
