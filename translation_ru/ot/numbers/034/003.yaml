base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: ru
  text: Южная сторона вашей земли будет простираться от пустыни Цин вдоль Эдома, а южная граница будет идти от края Солёного моря к востоку[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционное название Солёного моря — Мёртвое море.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от края (оконечности) Солёного моря к востоку»; выражение может указывать на восточную оконечность моря или на его восточную сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: южная сторона
  rationale: В описании границ פֵּאָה обозначает сторону или край территории, а נֶגֶב здесь имеет направительное значение «южный», а не является названием области Негев.
- source_word: מִמִּדְבַּר צִן
  choice: от пустыни Цин
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «пустыня Цин» — естественное русское географическое наименование.
- source_word: עַל יְדֵי אֱדוֹם
  choice: вдоль Эдома
  rationale: Географический оборот означает «рядом с, вдоль»; перевод сохраняет пространственное значение, не уточняя его до формальной государственной границы.
- source_word: גְּבוּל נֶגֶב
  choice: южная граница
  rationale: גְּבוּל в контексте распределения земли означает территориальную границу.
- source_word: מִקְצֵה יָם הַמֶּלַח קֵדְמָה
  choice: у восточной оконечности Солёного моря
  rationale: קָצֶה указывает на крайнюю точку, а קֵדְמָה — на восточную ориентацию. Такая формулировка естественна по-русски и соответствует географическому контексту; более буквальная синтаксическая передача отмечена в сноске.
- source_word: יָם הַמֶּלַח
  choice: Солёное море
  rationale: Передано собственное название в его еврейской форме, без замены традиционным названием «Мёртвое море».
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: будет простираться ... начнётся
  rationale: В формулах описания границ повторяющийся глагол вводит расположение территории и исходную точку границы. Контекстуальные русские глаголы устраняют тяжеловесный повтор, не меняя содержания.
