  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: ru
  text: '«Повели израильтянам и скажи им: „Когда вы войдёте в землю Ханаан, вот земля, которая достанется вам как наследственный удел: земля Ханаан в пределах её границ“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַו
  choice: Повели
  rationale: Императив передаёт властное повеление; «повели» сохраняет силу исходного глагола и соответствует достоинству законодательной речи.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальное выражение исходного текста и его традиционный родовой смысл, оставаясь понятным в современном литературном русском.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямая и естественная передача последовательного повеления.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Когда вы войдёте в
  rationale: כִּי здесь вводит обстоятельство будущего вступления в страну; русское будущее время естественно передаёт контекстуальную направленность причастия.
- source_word: הָאָרֶץ כְּנָעַן
  choice: землю Ханаанскую
  rationale: Естественное русское библейско-литературное обозначение территории Ханаана без лишнего пояснения.
- source_word: זֹאת הָאָרֶץ
  choice: вот земля
  rationale: «Вот» сохраняет указательную силу זֹאת и вводит последующее официальное описание территории.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם בְּנַחֲלָה
  choice: которая достанется вам в удел
  rationale: נפל буквально означает «пасть», но при распределении земли является идиомой получения назначенного участка; «достанется в удел» естественно передаёт и распределение, и наследственное владение.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: земля Ханаанская в её границах
  rationale: Передаёт территорию в пределах далее описываемых рубежей; «в её границах» по-русски естественнее буквального «согласно её границам».
