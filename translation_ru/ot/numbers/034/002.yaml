  rationale: Исправлена передача заключительной формулы о границах земли; обновлён регистр этнонима и географического названия для современного литературного русского; сноска уточнена так, чтобы буквально отражать образ «падёт» и значение наследственного удела. Маркер сноски перенесён к словосочетанию, которое она поясняет.
