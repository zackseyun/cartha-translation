review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: повеление адресовано сынам Израиля, вступление в Ханаан дано как будущее обстоятельство, а земля названа наследственным уделом. Однако «в её границах» несколько меняет функцию לִגְבֻלֹתֶיהָ: это формула о границах/пределах территории, которые далее будут определены, а не просто утверждение, что земля находится внутри собственных границ.'
  naturalness: «Сынам Израиля» и «земля Ханаанская» понятны, но имеют заметно архаизирующий, синодальный оттенок. Для современного литературного русского естественнее «израильтянам» и «земля Ханаан». Формула «в пределах её границ» звучит естественно и сохраняет юридико-территориальный регистр.
  terminology: «Удел» удачно передаёт נחלה в контексте земельного надела. Сноска об идиоме «падёт» полезна, но выражение «падёт вам в наследие» не вполне соответствует синтаксису и естественной русской передаче בְּנַחֲלָה; лучше дать буквальное «падёт вам как наследственный удел» и пояснить идиоматическое значение. «Ханаан» предпочтительнее прилагательного «Ханаанская» в современном нейтрально-литературном регистре.
  issues:
  - severity: medium
    issue: Передача לִגְבֻלֹתֶיהָ как «в её границах»
    rationale: Оборот может читаться как тавтологичное пространственное уточнение. В исходном тексте он отсылает к пределам земли, которые будут очерчены далее; «в пределах её границ» сохраняет эту функцию яснее.
  - severity: low
    issue: Архаизирующие формы «сынам Израиля» и «земля Ханаанская»
    rationale: Они допустимы, но не вполне соответствуют заявленному современному литературному варианту. «Израильтянам» и «земля Ханаан» естественнее без утраты смысла.
  - severity: low
    issue: Формулировка буквального варианта в сноске
    rationale: «Падёт вам в наследие» стилистически и синтаксически менее точна для בְּנַחֲלָה, чем «падёт вам как наследственный удел».
  revised_text: '«Повели израильтянам и скажи им: „Когда вы войдёте в землю Ханаан, вот земля, которая достанется вам как наследственный удел: земля Ханаан в пределах её границ“».'
