lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: От колена
  rationale: Предлог לְ в этом перечне может обозначать как принадлежность представителя к колену, так и его назначение для колена. В основном тексте выбрано естественное по-русски «от колена», а подлинная неоднозначность отмечена в сноске.
- source_word: בִנְיָמִן
  choice: Вениамина
  rationale: Устоявшаяся русская библейская форма названия колена; родительный падеж обусловлен сочетанием «от колена».
- source_word: אֱלִידָד
  choice: Елидад
  rationale: Устоявшаяся русская передача еврейского личного имени.
- source_word: בֶּן
  choice: сын
  rationale: Прямо передаёт родственную связь в именной конструкции; запятая делает русскую фразу естественной и ясной.
- source_word: כִּסְלוֹן
  choice: Кислона
  rationale: Транслитерация еврейского личного имени с родительным падежом после слова «сын».
