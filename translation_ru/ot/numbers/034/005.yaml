  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: ru
  text: Затем граница повернёт от Ацмона к Египетскому потоку[a], и окончится у моря[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Египетскому вади». Еврейское נחל нередко означает сезонный водоток или его русло.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и её окончания будут у моря». В еврейском тексте слово «окончания» стоит во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Затем ... повернёт
  rationale: В описании границы глагол נסב обозначает изменение направления. Будущее время естественно передаёт последовательность предписанного проведения границы.
- source_word: הַגְּבוּל
  choice: граница
  rationale: В данном географическом контексте слово обозначает линию территориального разграничения.
- source_word: מֵעַצְמוֹן
  choice: от Ацмона
  rationale: Название места передано транслитерацией в форме, естественной для русского библейского текста.
- source_word: נַחְלָה מִצְרָיִם
  choice: к Египетскому потоку
  rationale: נחל обычно обозначает поток, русло или сезонный водоток, а не крупную постоянную реку; такой перевод также не создаёт ошибочного отождествления с Нилом.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: и окончится
  rationale: Идиоматически передаёт конечную точку границы. Еврейское существительное имеет форму множественного числа, что отмечено в сноске.
- source_word: הַיָּמָּה
  choice: у моря
  rationale: Направительная форма указывает на море как конечную точку границы. Конкретизация «Средиземное море» не внесена, поскольку в стихе сказано просто «море».
