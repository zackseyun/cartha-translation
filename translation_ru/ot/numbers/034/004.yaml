  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: ru
  text: Ваша граница повернёт к югу от подъёма Акраввим[a] и пройдёт через Цин; её край будет к югу от Кадеш-Барнеа. Затем она выйдет к Хацар-Аддару и пройдёт к Ацмону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Акраввим», вероятно, означает «скорпионы»; выражение можно перевести как «подъём Скорпионов» или «Скорпионий перевал».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: и повернёт
  rationale: В описаниях границ глагол обозначает поворот или изгиб пограничной линии; русский глагол сохраняет этот пространственный смысл.
- source_word: הַגְּבוּל
  choice: граница
  rationale: Естественное русское обозначение рубежа территории в данном контексте.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: к югу от подъёма Акраввим
  rationale: מִנֶּגֶב указывает на положение с южной стороны ориентира; מַעֲלֵה передано нарицательным «подъём», а топоним Акраввим транслитерирован.
- source_word: וְעָבַר צִנָה
  choice: и пройдёт к Цину
  rationale: עָבַר в маршруте границы означает её прохождение далее, а направительное ה у צִנָה обозначает движение к Цину.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: её край будет
  rationale: Форма תּוֹצְאֹתָיו морфологически множественная, но в описании одной пограничной линии обозначает её завершение или край; в естественном русском здесь уместно собирательное единственное число без излишней техническости.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: к югу от Кадес-Барнеа
  rationale: Оборот помещает край границы с южной стороны Кадес-Барнеа.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: затем она выйдет к Хацар-Аддару
  rationale: יָצָא в описании границы передаёт её дальнейшее протяжение к следующему пункту; русское управление требует дательного падежа.
- source_word: וְעָבַר עַצְמֹנָה
  choice: и пройдёт к Ацмону
  rationale: Направительное окончание топонима передано предлогом «к»; название транслитерировано.
