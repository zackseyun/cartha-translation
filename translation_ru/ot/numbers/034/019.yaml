  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הָ/אֲנָשִׁ֑ים לְ/מַטֵּ֣ה יְהוּדָ֔ה כָּלֵ֖ב בֶּן יְפֻנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: ru
  text: 'И вот имена этих людей: от колена Иуды — Халев, сын Иефуннии.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Союз וְ продолжает предыдущую речь, а указательное אֵלֶּה вводит перечень; «И вот» естественно передаёт оба элемента по-русски.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: имена этих людей
  rationale: Конструкция означает «имена людей»; указательное введение позволяет по-русски естественно сказать «этих людей», причём речь идёт о конкретных мужчинах-представителях.
- source_word: לְמַטֵּה יְהוּדָה
  choice: от колена Иуды
  rationale: В контексте распределения земли מַטֶּה означает «колено», а לְ указывает, какое колено представляет названный человек.
- source_word: כָּלֵב
  choice: Халев
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בֶּן יְפֻנֶּה
  choice: сын Иефуннии
  rationale: בֶּן вводит патроним; «Иефунния» — устоявшаяся русская библейская форма имени, поставленная в родительном падеже.
