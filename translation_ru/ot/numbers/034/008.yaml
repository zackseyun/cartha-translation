  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: ru
  text: От горы Ор проведите границу к Лево-Хамату[a], и конечные пункты границы будут у Цедада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ко входу в Хамат»; вероятно, это устойчивое географическое название — Лево-Хамат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: От горы Ор
  rationale: Устойчивое библейское географическое название с предлогом מִן («от»); по-русски естественно передаётся как «гора Ор».
- source_word: תְּתָאוּ
  choice: проведите границу
  rationale: В контексте установления рубежей глагол означает наметить или провести линию границы; повелительная форма естественно передаёт предписывающую силу древнееврейской формы.
- source_word: לְבֹא חֲמָת
  choice: к Лево-Хамату
  rationale: Выражение буквально означает «ко входу в Хамат», но, вероятно, функционирует как устойчивое географическое название; русская форма «Лево-Хамат» сохраняет топонимический характер.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: крайняя точка границы
  rationale: В описании территории сочетание обозначает предел или конечный пункт границы. Единственное число согласуется с названным пунктом Цедадом и естественно звучит по-русски.
- source_word: צְדָדָה
  choice: у Цедада
  rationale: Направительный суффикс у топонима указывает на Цедад как место, к которому приходит граница; «у Цедада» ясно выражает расположение её конечного пункта.
