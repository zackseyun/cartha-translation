lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: От племени
  rationale: В контексте назначения представителей племён מַטֶּה означает «племя». Русская формула «от племени» естественно передаёт принадлежность назначенного вождя; союз ו в данном перечне не нуждается в отдельном воспроизведении.
- source_word: בְנֵי דָן
  choice: сынов Дана
  rationale: Сохраняет буквальный древнееврейский родовой оборот и при этом ясно обозначает потомков Дана.
- source_word: נָשִׂיא
  choice: вождь
  rationale: Обозначает главу и уполномоченного представителя племени. «Вождь» соответствует контексту лучше, чем монархически окрашенное «князь».
- source_word: בֻּקִּי
  choice: Букки
  rationale: Передача личного имени по форме еврейского текста.
- source_word: בֶּן
  choice: сын
  rationale: Прямое обозначение сыновства в формуле идентификации.
- source_word: יָגְלִי
  choice: Иогли
  rationale: Традиционно узнаваемая русская передача библейского личного имени יָגְלִי.
