  text: 'И для колена сыновей Завулона — глава: Елицафан, сын Парнаха.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: И от колена
  rationale: В перечне назначенных представителей מַטֶּה означает «колено», а сочетание союза и предлога естественно передаётся как «и от колена».
- source_word: בְנֵי זְבוּלֻן
  choice: сыновей Завулона
  rationale: Сохранена буквальная генеалогическая формула «сыны/сыновья Завулона»; форма «сыновей» обусловлена русским управлением после «колена».
- source_word: נָשִׂיא
  choice: предводитель
  rationale: Слово обозначает признанного главу или представителя колена. «Предводитель» передаёт статус без монархических ассоциаций слова «князь».
- source_word: אֱלִיצָפָן
  choice: Елицафан
  rationale: Имя транслитерировано в форме, соответствующей русской библейской традиции и еврейскому звучанию.
- source_word: בֶּן פַּרְנָךְ
  choice: сын Парнаха
  rationale: Стандартная генеалогическая формула передана естественным русским сочетанием «сын Парнаха».
