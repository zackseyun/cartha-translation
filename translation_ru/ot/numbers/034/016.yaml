  text: Then Yahweh spoke to Moses, saying,
translation:
  language: ru
  text: 'Затем Яхве сказал Моисею:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Затем … сказал
  rationale: Форма с повествовательным וַ продолжает последовательность событий. «Затем» естественно передаёт продвижение повествования, а «сказал» в сочетании с לֵאמֹר образует ясную современную формулу введения прямой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל; имя מֹשֶׁה дано в принятой русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данной формуле инфинитив «говоря» вводит последующую прямую речь. В современном русском эту функцию естественно и полно выполняет двоеточие, без тяжеловесного повтора «сказал… говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. «Яхве» сохраняет его как имя и представляет собой наиболее распространённую научную реконструкцию произношения; вариант «Господь» заменяет имя титулом, а «Иегова» основан на более позднем смешанном чтении.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная формула введения прямой речи. Синтаксический гебраизм «говоря» не воспроизведён буквально, поскольку его функцию выполняет двоеточие.
