    text: 'Буквально: «и выходы её будут Хацар-Енан». В еврейском тексте окончание границы выражено существительным во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: пойдёт
  rationale: В описании рубежей глагол יצא обозначает прохождение или продолжение линии границы. «Пойдёт» естественно передаёт её направление, не подразумевая буквального движения.
- source_word: הַגְּבֻל
  choice: граница
  rationale: Слово גְּבוּל здесь означает территориальную границу; это обычный и ясный русский эквивалент.
- source_word: זִפְרֹנָה
  choice: к Цифрону
  rationale: Направительный суффикс -ה указывает движение в сторону названного места; предлог «к» сохраняет это значение.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: и её конечным пунктом будет
  rationale: В текстах о границах תוֹצָאוֹת обозначает место окончания линии. Русское единственное число естественно передаёт собирательный смысл формально множественного еврейского выражения; его форма отмечена в сноске.
- source_word: חֲצַר עֵינָן
  choice: Хацар-Энан
  rationale: Географическое название передано транслитерацией; дефис отражает составной характер названия.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: Это будет ваша
  rationale: Фраза подводит итог описанию и определяет данную линию как северную границу Израиля. Формулировка естественна для современного русского языка.
- source_word: גְּבֻל צָפוֹן
  choice: северная граница
  rationale: Сочетание обозначает границу с северной стороны; «северная граница» — точный и идиоматичный русский эквивалент.
