  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: ru
  text: Затем граница пойдёт к Цифрону, и её конечным пунктом будет Хацар-Енан[a]. Это будет ваша северная граница.
