base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: ru
  text: Два племени и половина племени взяли свой наследственный удел за Иорданом, у Иерихона[a], — к востоку[b], в сторону восхода солнца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по другую сторону Иордана, у Иерихона».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «к востоку, в сторону восхода солнца» — удвоенное выражение, подчёркивающее восточную сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: два племени
  rationale: В контексте распределения земли מַטֶּה означает не буквальный «посох», а племя. «Племя» понятно современному читателю и естественно передаёт значение.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: и половина племени
  rationale: Фраза обозначает половину племени как признанную группу; буквальная структура оригинала сохранена без добавления названия Манассии, которого в этом стихе нет.
- source_word: לָקְחוּ
  choice: взяли
  rationale: Форма qal perfect обозначает завершённое действие. «Взяли» непосредственно передаёт значение לקח, не заменяя его более толковательным «получили».
- source_word: נַחֲלָתָם
  choice: свой наследственный удел
  rationale: נַחֲלָה здесь означает земельный удел, передаваемый как наследие. Сочетание сохраняет и конкретный земельный, и наследственный оттенки.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: за Иорданом
  rationale: Идиома указывает на территорию по ту сторону Иордана относительно принятой точки отсчёта. «За Иорданом» кратко и естественно по-русски.
- source_word: יְרֵחוֹ
  choice: у Иерихона
  rationale: Название места наречно уточняет участок Иордана в районе Иерихона; «у Иерихона» не создаёт ложной точности.
- source_word: קֵדְמָה
  choice: к востоку
  rationale: Направительная форма обозначает движение или ориентацию на восток.
- source_word: מִזְרָחָה
  choice: в сторону восхода солнца
  rationale: Отдельный перевод второго восточного обозначения сохраняет образ восхода и усилительный параллелизм קֵדְמָה מִזְרָחָה, не сводя его к одному слову.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выбрано общеупотребительное «племя», а не традиционное, но менее прозрачное для части современных читателей «колено». Сохранены завершённость действия, земельно-наследственный смысл удела и двойное указание на восток.
