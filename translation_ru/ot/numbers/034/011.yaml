  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: ru
  text: Затем граница спустится от Шефама к Ривле, к востоку от Аина[a]. Далее граница спустится и достигнет восточного склона моря Киннерет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально указывает на местоположение к востоку от Аина; возможно также: «с восточной стороны Аина».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «коснётся плеча моря Киннерет к востоку». В географическом языке «плечо» означает бок или склон местности у моря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: спустится
  rationale: Глагол ירד буквально означает движение вниз; в описании границы он передаёт направление её прохождения и, вероятно, особенности рельефа.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: граница
  rationale: Обычное и точное русское обозначение территориального рубежа.
- source_word: מִשְּׁפָם
  choice: от Шефама
  rationale: Географическое название передано транслитерацией с исходного еврейского.
- source_word: הָרִבְלָה
  choice: к Ривле
  rationale: Направительная форма названия передана русским предлогом «к»; само название транслитерировано как «Ривла».
- source_word: מִקֶּדֶם לָעָיִן
  choice: к востоку от Аина
  rationale: Фраза указывает положение Ривлы относительно Аина; этот перевод естественно и достаточно буквально передаёт пространственное отношение.
- source_word: וּמָחָה
  choice: достигнет
  rationale: В описании рубежа глагол означает, что линия подходит к географическому объекту или соприкасается с ним; «достигнет» звучит естественно по-русски.
- source_word: עַל כֶּתֶף
  choice: склона у
  rationale: כֶּתֶף буквально значит «плечо», но в географическом употреблении обозначает бок, склон или выступ местности. «Склон» сохраняет образ рельефа без неясного буквального «плеча».
- source_word: יָם כִּנֶּרֶת
  choice: море Киннерет
  rationale: Сохранены исходное обозначение водоёма как «моря» и еврейское географическое название, без замены более поздним названием.
- source_word: קֵדְמָה
  choice: с восточной стороны
  rationale: Наречие обозначает восточную ориентацию или сторону; формулировка естественна в русском географическом описании.
