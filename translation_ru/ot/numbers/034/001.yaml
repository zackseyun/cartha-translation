lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; в устойчивой библейской формуле естественно и точно передаётся как «И говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени от титула «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском его функцию естественно выражает двоеточие без тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. «Яхве» передаёт его непосредственно, тогда как «Господь» заменяет имя титулом; вариант «Иегова» отражает более позднюю традиционную форму.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и краткости формулы введения божественной речи. Двоеточие функционально передаёт לֵאמֹר и подготавливает продолжение в следующем стихе.
