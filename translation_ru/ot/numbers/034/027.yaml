  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: ru
  text: А от колена сыновей Асира — предводитель Ахихуд, сын Шеломи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: а от колена
  rationale: В контексте распределения земли מַטֶּה означает «колено», а не буквально «посох». Предлог לְ указывает, от какого колена назначен представитель; по-русски это естественно передаётся сочетанием «от колена».
- source_word: בְנֵי אָשֵׁר
  choice: сыновей Асира
  rationale: Сохранена буквальная форма стандартного племенного обозначения «сыны/сыновья Асира»; после слова «колено» родительный падеж «сыновей» звучит ясно и соответствует еврейскому выражению.
- source_word: נָשִׂיא
  choice: вождь
  rationale: Слово обозначает официального главу или представителя колена. «Вождь» сохраняет социально-политический оттенок и не привносит монархического смысла слова «князь».
- source_word: אֲחִיהוּד
  choice: Ахиуд
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בֶּן שְׁלֹמִי
  choice: сын Шеломи
  rationale: Стандартная патронимическая конструкция передана прямо и естественно; имя שְׁלֹמִי транслитерировано как «Шеломи».
