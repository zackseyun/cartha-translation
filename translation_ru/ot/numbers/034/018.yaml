  text: וְ/נָשִׂ֥יא אֶחָ֛ד נָשִׂ֥יא אֶחָ֖ד מִ/מַּטֶּ֑ה תִּקְח֖וּ לִ/נְחֹ֥ל אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: ru
  text: И возьмите по одному предводителю от каждого племени, чтобы получить землю в наследие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы распределить землю как наследственное владение». В ближайшем контексте эти предводители названы среди тех, кто должен разделить землю между племенами; поэтому глагол может пониматься в связи с распределением земельных уделов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: вождь
  rationale: В данном контексте слово обозначает признанного главу племени. «Вождь» естественно передаёт древний племенной статус и не создаёт монархического оттенка слова «князь».
- source_word: אֶחָד ... אֶחָד
  choice: по одному
  rationale: 'Повторение имеет распределительное значение: от каждого племени берётся один представитель. Русская конструкция «по одному» передаёт это естественно и точно.'
- source_word: מִמַּטֶּה
  choice: от каждого племени
  rationale: מַטֶּה может буквально означать «посох», но здесь обозначает племя как административную единицу. Распределительный смысл повторённого אֶחָד позволяет ясно выразить подразумеваемое «каждого».
- source_word: תִּקְחוּ
  choice: возьмите
  rationale: Форма обращена к нескольким лицам и в контексте выражает предписание. Русское повелительное наклонение передаёт его прямо и естественно.
- source_word: לִנְחֹל
  choice: чтобы распределить ... в наследие
  rationale: В контексте назначения лиц для раздела земли глагол указывает на передачу или распределение наследственного владения. При этом возможный смысл получения земли в наследие сохранён в сноске.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Речь идёт о конкретной земле, предназначенной Израилю; в русском контексте определённость ясна без артикля.
theological_decisions:
- issue: Роль назначаемых вождей в отношении земли
  choice: Они участвуют в распределении земли как наследственного владения.
  alternative: Они сами получают землю в наследие.
  rationale: Ближайший контекст (Чис 34:17–29) называет этих людей назначенными для раздела земли между племенами, однако краткая еврейская конструкция допускает наследственное значение без явного уточнения роли; поэтому альтернатива не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной конструкцией. «Племя» предпочтено более архаичному «колено», а «вождь» — потенциально монархическому «князь». Формулировка сохраняет краткость стиха и отмечает смысловую неоднозначность инфинитива.
