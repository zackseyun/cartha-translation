  text: Восточную границу проведите[a] для себя от Хацар-Енана до Шефама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наметьте для себя восточную границу». Употреблённый здесь древнееврейский глагол необычен и в данном контексте означает проведение или обозначение линии границы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: проведите
  rationale: В контексте установления границ редкий глагол означает проведение или нанесение пограничной линии. Императив естественно передаёт предписывающую силу древнееврейской формы с последовательным значением.
- source_word: לָכֶם
  choice: для себя
  rationale: 'Сохраняет возвратно-бенефактивный оттенок дательного местоимения: израильтяне проводят границу для своей территории.'
- source_word: לִגְבוּל קֵדְמָה
  choice: восточную границу
  rationale: Передаёт территориальное значение גְּבוּל и направление קֵדְמָה естественным для русского языка сочетанием.
- source_word: מֵחֲצַר עֵינָן
  choice: от Хацар-Энана
  rationale: Название начального пункта границы транслитерировано с древнееврейского; предлог מִן передан как «от».
- source_word: שְׁפָמָה
  choice: до Шефама
  rationale: Направительная форма топонима обозначает конечный пункт данного отрезка; в паре с «от» естественно передаётся как «до».
