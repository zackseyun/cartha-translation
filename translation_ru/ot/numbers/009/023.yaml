  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: ru
  text: По повелению Яхве они становились лагерем и по повелению Яхве отправлялись в путь. Они соблюдали предписание Яхве по повелению Яхве, переданному через Моисея[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «рукой Моисея»; древнееврейский оборот со значением «через Моисея», то есть при его посредничестве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: по повелению
  rationale: Буквально оборот означает «по устам», но здесь выражает властное указание. «По повелению» естественно звучит по-русски и сохраняет повтор, подчёркивающий руководство Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: יַחֲנוּ
  choice: становились лагерем
  rationale: В контексте странствия речь идёт о расположении на стоянку; эта формулировка точна и понятна современному читателю.
- source_word: יִסָּעוּ
  choice: отправлялись в путь
  rationale: Глагол обозначает снятие со стоянки и начало дальнейшего движения; выбранный оборот естественно передаёт этот смысл.
- source_word: מִשְׁמֶרֶת
  choice: порученное
  rationale: Существительное обозначает вверенную обязанность, которую следует хранить или исполнять. Субстантивированное «порученное» сохраняет одновременно оттенки вверенного дела и обязательства.
- source_word: שָׁמָרוּ
  choice: исполняли
  rationale: В сочетании с מִשְׁמֶרֶת глагол означает соблюдение вверенной обязанности. «Исполняли» естественнее по-русски, чем буквальное «хранили».
- source_word: בְּיַד מֹשֶׁה
  choice: переданному через Моисея
  rationale: Буквальное «рукой Моисея» является древнееврейским оборотом, выражающим посредничество или передачу через действующее лицо. Основной текст передаёт смысл, а образ исходного выражения отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Характер исполнения מִשְׁמֶרֶת יְהוָה
  choice: исполняли порученное Яхве
  alternative: соблюдали предписание Яхве; несли стражу Яхве
  rationale: Фраза может подчёркивать и обязанность, и нечто вверенное для соблюдения. Выбранная формулировка не ограничивает её узко культовой стражей и сохраняет смысл послушного исполнения.
- issue: Роль Моисея в последнем повелении
  choice: повеление Яхве, переданное через Моисея
  alternative: повеление Яхве рукой Моисея
  rationale: Формулировка сохраняет Яхве как источник повеления, а Моисея — как посредника, не приписывая повеление самому Моисею.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Трёхкратный повтор «по повелению Яхве» сохранён как значимый риторический элемент. Синтаксис сделан ясным без устранения оттенка вверенной обязанности в מִשְׁמֶרֶת.
