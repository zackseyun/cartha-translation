  language: ru
  text: И пусть сыны Израиля[a] совершат Пасху в назначенное для неё время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтяне»; традиционно также «дети Израиля». Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: И пусть … совершат
  rationale: Глагол עשה буквально означает «делать, совершать», но с פֶּסַח обозначает соблюдение или совершение Пасхи. Сочетание וְ с формой имперфекта в данном контексте имеет побудительное значение; «И пусть … совершат» передаёт как начальный союз, так и силу повеления.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально соответствует древнееврейскому выражению «сыны Израиля», сохраняя его родовой и исторический образ; более естественное «израильтяне» указано в сноске.
- source_word: הַפָּסַח
  choice: Пасху
  rationale: פֶּסַח здесь может обозначать пасхальное установление в целом. «Пасху» сохраняет широту исходного выражения и не сводит его только к жертве или празднику.
- source_word: בְּמוֹעֲדוֹ
  choice: в назначенное для неё время
  rationale: מוֹעֵד обозначает установленное, назначенное время, а местоименный суффикс относится к Пасхе. Формулировка явно передаёт и календарную определённость, и притяжательное значение.
