id: NUM.9.16
reference: Numbers 9:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: ru
  text: 'Так было постоянно: облако покрывало скинию, а ночью было видно нечто подобное огню.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а ночью — вид огня».'
    reason: лексическая альтернатива для более формальной передачи וּמַרְאֵה אֵשׁ
lexical_decisions:
- source_word: כֵּן יִהְיֶה תָמִיד
  choice: Так было постоянно
  rationale: Несовершенный вид глагола в данном повествовательном контексте выражает обычное, неизменно повторявшееся положение дел; формулировка естественна для современного русского языка.
- source_word: הֶעָנָן
  choice: облако
  rationale: Определённое существительное указывает на уже известное из контекста облако над скинией.
- source_word: יְכַסֶּנּוּ
  choice: покрывало скинию
  rationale: Глагол означает «покрывать, укрывать». Местоименный суффикс мужского рода единственного числа по ближайшему контексту относится к жилищу/скинии; явное существительное устраняет неестественную для русского языка местоименную двусмысленность.
- source_word: וּמַרְאֵה אֵשׁ
  choice: а ночью было видно нечто подобное огню
  rationale: מַרְאֶה обозначает видимое явление или облик. Перевод сохраняет неопределённость относительно того, был ли это буквальный огонь или огнеподобное явление.
- source_word: לָיְלָה
  choice: ночью
  rationale: Естественное русское наречное выражение времени.
theological_decisions:
- issue: Референт местоименного суффикса в יְכַסֶּנּוּ
  choice: облако покрывало скинию
  alternative: облако покрывало его
  rationale: Хотя древнееврейский суффикс формально допускает перевод «его», непосредственный контекст говорит о скинии/жилище. Повтор существительного ясно передаёт наиболее вероятный референт без олицетворения.
- issue: Характер огненного явления
  choice: нечто подобное огню
  alternative: вид огня
  rationale: Текст говорит о מַרְאֵה אֵשׁ — видимом облике или явлении огня — и не требует однозначно утверждать, что это был буквальный огонь. Формулировка сохраняет эту смысловую осторожность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Скиния» сохранена как общеупотребительный библейский термин; конструкция фразы упрощена для ясности без устранения смысловой неопределённости выражения о видимом огне.
