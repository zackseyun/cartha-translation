base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: ru
  text: Были мужчины, нечистые из-за человеческого трупа[a], и потому они не могли совершить Пасху в тот день. В тот же день они подошли к Моисею и Аарону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нечистые для нефеша человека»; это древнееврейское выражение обозначает ритуальную нечистоту, вызванную человеческим трупом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Были люди
  rationale: Естественно вводит новое обстоятельство повествования, не добавляя отсутствующего в еврейском тексте явного наречия «теперь».
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: ставшие нечистыми из-за человеческого трупа
  rationale: В контексте законов о чистоте это идиома, обозначающая ритуальную нечистоту, связанную с телом умершего человека; «ставшие» естественно указывает на приобретённое состояние.
- source_word: וְלֹא יָכְלוּ
  choice: и потому они не могли
  rationale: Передаёт результирующую связь между ритуальной нечистотой и невозможностью участвовать в Пасхе, не превращая её в моральную оценку.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: совершить Пасху
  rationale: Устойчивое и достойное русское выражение для исполнения предписанного пасхального обряда; оно ближе к буквальному «делать Пасху», чем исключительно праздничное «праздновать».
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: предстали перед
  rationale: Естественно по-русски передаёт приближение к Моисею и Аарону и официальное явление перед ними, не уточняя сверх текста цель обращения.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: Моисей ... Аарон
  rationale: Традиционные и общеупотребительные русские формы библейских имён.
theological_decisions:
- issue: Характер нечистоты
  choice: Ритуальная нечистота, возникшая из-за человеческого трупа
  alternative: Буквальное «нечистые из-за души человека» либо понимание как нравственного осквернения
  rationale: В священническом законодательном контексте נֶפֶשׁ אָדָם обозначает умершего человека или его тело как источник обрядовой нечистоты, а не личный нравственный проступок.
- issue: Причинная связь с невозможностью совершить Пасху
  choice: Передать следствие словами «и потому»
  alternative: Сохранить простое соединение «и не могли»
  rationale: Контекст ясно связывает их состояние нечистоты с невозможностью совершить Пасху; формулировка выявляет эту связь без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного повествования. Формулировка избегает архаического «душа умершего» в основном тексте и не смешивает ритуальную нечистоту с нравственной виной. Повтор «в тот день» сохранён смыслово через «в тот же день», но без тяжеловесного дословного повторения.
