  source_fidelity: 'Нужно убрать «ставшие»: еврейское הָיוּ («были») описывает их состояние и не сообщает, что они стали нечистыми именно тогда. «Мужчины» точнее передаёт אֲנָשִׁים, чем гендерно нейтральные «люди». «Подошли к Моисею и Аарону» естественно передаёт וַיִּקְרְבוּ ... לִפְנֵי без дополнительного оттенка официального судебного предстояния.'
