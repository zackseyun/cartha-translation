  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: ru
  text: 'И сказал Яхве Моисею в пустыне Синая[a] в первом месяце второго года после их выхода из земли Египта:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также можно перевести: «в Синайской пустыне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма продолжает повествование и вводит новое речевое событие. «И сказал» естественно для современного русского библейского повествования; более буквальное «и говорил» здесь могло бы ошибочно восприниматься как длительное действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Предлог אֶל при глаголе речи обозначает адресата.
- source_word: בְּמִדְבַּר סִינַי
  choice: в Синайской пустыне[a]
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; русское сочетание «Синайская пустыня» естественно передаёт конструкцию с географическим названием.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: второго года
  rationale: Прямая передача временной датировки; выражение связано с последующим указанием отсчёта от исхода.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: после их выхода из земли Египетской
  rationale: Инфинитивная конструкция обозначает исход как точку отсчёта. Слово אֶרֶץ сохранено в традиционно понятном выражении «земля Египетская».
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: в первом месяце
  rationale: Сохранена точная календарная формулировка исходного текста без подстановки названия месяца.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском языке двоеточие естественно вводит содержание речи в следующем стихе и функционально передаёт לֵאמֹר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не заменяет имя титулом; «Иегова» основано на более позднем смешении согласных имени с огласовкой замещающего чтения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Порядок временных обстоятельств слегка перестроен ради ясности, но все элементы исходной датировки сохранены. Двоеточие связывает стих с последующей прямой речью.
