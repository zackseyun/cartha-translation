  naturalness: Предлагаемая редакция сохраняет сжатый библейский регистр, но избегает неоправданной архаизации. Порядок «в первом месяце второго года после их выхода» по-русски ясен и не изменяет исходной датировки.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Моисею», «первом месяце», «втором году» и «выходе» точны. Сноска должна предлагать действительно возможный русский вариант, а не называть буквальным не вполне естественное «в пустыне Синай».
