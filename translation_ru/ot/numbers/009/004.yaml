  text: И Моисей велел сынам Израиля совершить Пасху.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: велел
  rationale: В сочетании с אֶל и инфинитивной конструкцией לַעֲשֹׂת глагол передаёт не просто факт речи, а распоряжение совершить действие; «велел» естественно и точно выражает эту функцию.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет традиционное коллективное наименование народа и близость к еврейской форме.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: совершить Пасху
  rationale: Здесь עשה относится к соблюдению и совершению пасхального обряда; «совершить Пасху» передаёт ритуальный смысл естественнее, чем буквальное «сделать Пасху».
theological_decisions:
- issue: Характер слов Моисея
  choice: велел
  alternative: сказал ... чтобы они совершили
  rationale: Контекстуальная целевая конструкция указывает на предписание, однако перевод не добавляет содержания, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Краткость и синтаксическая прямота оригинала сохранены; «И» передаёт повествовательную связь וַ־.
