review_pass:
  verdict: revise
  source_fidelity: Передача даты, назначенного срока и повторного повеления в целом верна. Однако «между двумя вечерами» не является точной русской передачей еврейского устойчивого выражения בֵּין הָעַרְבַּיִם («между вечерами») и создаёт ненужное впечатление о двух отдельных вечерах. Добавленное «относящимся к ней» не требуется источником.
  naturalness: «Совершите её» уместно в обрядовом контексте и соответствует современному литературному, умеренно торжественному регистру. «Между вечерами» намеренно необычно, но это оправдано техническим характером выражения и должно поясняться сноской.
  terminology: «Установления» и «предписания» приемлемо передают различие חֻקּוֹת и מִשְׁפָּטִים. Формы женского рода в русском соотносятся с подразумеваемым словом «Пасха» и не навязывают толкования.
  issues:
  - severity: medium
    issue: «между двумя вечерами»
    rationale: В еврейском тексте стоит «между вечерами», а не «между двумя вечерами». Числительное «двумя» — излишняя конкретизация; традиционный технический оборот лучше сохранить без него и объяснить в сноске.
  - severity: low
    issue: «по всем относящимся к ней установлениям»
    rationale: Оборот тяжеловесен и добавляет эксплицитное уточнение, отсутствующее в оригинале. Притяжательное «её» достаточно передаёт суффикс в еврейском тексте.
