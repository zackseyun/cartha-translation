    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: В четырнадцатый день этого месяца
  rationale: Естественная русская передача еврейского календарного оборота с сохранением точной даты.
- source_word: בֵּין הָעַרְבַּיִם
  choice: между двумя вечерами
  rationale: Формально близкая передача устойчивого древнееврейского обозначения времени, сохраняющая его неоднозначность; пояснение дано в сноске.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: совершите её
  rationale: В контексте объектом является Пасха; глагол עשה здесь означает совершить обряд, а местоимение женского рода согласуется с русским словом «Пасха». Повтор выражения сохранён.
- source_word: בְּמוֹעֲדוֹ
  choice: в назначенное для неё время
  rationale: Передаёт значение установленного, календарно определённого срока и ясно связывает его с Пасхой.
- source_word: כְּכָל חֻקֹּתָיו
  choice: по всем относящимся к ней установлениям
  rationale: Сохраняет нормативно-обрядовый смысл חֻקּוֹת и проясняет принадлежность установлений к совершению Пасхи.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: и по всем её предписаниям
  rationale: «Предписания» естественно передаёт юридико-обрядовый смысл מִשְׁפָּטִים и позволяет отличить это слово от חֻקּוֹת.
