base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: ru
  text: По повелению Яхве[a] сыны Израиля отправлялись в путь, и по повелению Яхве становились станом. Во все дни, пока облако пребывало над скинией, они стояли станом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве»; это еврейская идиома со значением «по повелению Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Еврейское выражение буквально означает «по устам Яхве», но является идиомой, обозначающей действие по властному слову или повелению. Выбранный вариант естественен по-русски и сохраняет идею Божьего руководства.
- source_word: יִסְעוּ
  choice: отправлялись в путь
  rationale: В контексте странствования глагол נסע означает сняться со стоянки и двинуться дальше. Русская форма передаёт повторяющееся действие в повествовательном контексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён родственный образ еврейского выражения; формулировка понятна и соответствует dignified литературному регистру.
- source_word: יַחֲנוּ
  choice: располагались станом / оставались в стане
  rationale: Глагол חנה означает становиться или стоять станом. Первое выражение описывает устройство стоянки, второе — её продолжительность, заданную оборотом «все дни, пока».
- source_word: יִשְׁכֹּן
  choice: пребывало
  rationale: שכן означает обитать, находиться или пребывать. В отношении облака «пребывало» естественно передаёт его продолжающееся присутствие над скинией.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: מִשְׁכָּן обозначает священное жилище Бога. «Скиния» — устойчивый и точный русский библейский термин, не смешивающий его с אֹהֶל מוֹעֵד, «шатром встречи».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога — тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской лексикой. Формы «отправлялись», «располагались» и «оставались» передают повторяющийся и длительный характер действий в данном контексте.
