base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: ru
  text: Если среди вас живёт пришелец и совершает Пасху[a] в честь Яхве, пусть совершит её по установлению о Пасхе и по предписанному для неё порядку. Так он и должен поступить. Одно установление будет для вас, для пришельца[b] и для уроженца страны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделать Пасху» — древнееврейское выражение, означающее совершить или соблюдать пасхальный обряд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «живущего среди вас иноземца». Имеется в виду не случайный путник, а иноземец, поселившийся среди Израиля.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «коренного жителя страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Если же
  rationale: Передаёт условие и одновременно сохраняет связь с предшествующим законодательным контекстом.
- source_word: יָגוּר ... גֵּר
  choice: среди вас живёт переселенец
  rationale: Глагол и существительное обозначают не путника, а иноземца, постоянно или длительно живущего среди Израиля; «переселенец» естественно передаёт этот правовой статус без современных политических коннотаций.
- source_word: וְעָשָׂה פֶסַח
  choice: хочет совершить Пасху
  rationale: Буквальное «сделает Пасху» является древнееврейской идиомой соблюдения пасхального обряда. В условном контексте форма выражает намерение совершить его.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог указывает, кому посвящено совершение Пасхи; форма «в честь» естественна по-русски и не сводит выражение только к направлению действия.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: по установлению о Пасхе
  rationale: חֻקָּה обозначает обязательное установленное правило; выбранная формулировка сохраняет юридико-обрядовый оттенок.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: по предписанному для неё порядку
  rationale: מִשְׁפָּט здесь указывает на регулирующий обряд порядок или процедуру и отличается в переводе от חֻקָּה.
- source_word: כֵּן יַעֲשֶׂה
  choice: Так он и должен поступить
  rationale: Передаёт подчёркнутое требование соблюдать установленный порядок, не воспроизводя неестественное русское «так пусть сделает».
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Одно установление будет
  rationale: Сохраняет декларативную юридическую форму и подчёркивает единое правило.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: и для коренного жителя страны
  rationale: אֶזְרַח противопоставлен переселенцу и обозначает человека, принадлежащего к местному населению; перевод избегает анахроничного «гражданин».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует исходным данным задания.
- issue: Сфера единого установления для израильтянина и переселенца
  choice: Единое правило относится к совершению Пасхи
  alternative: Утверждение всеобщего равенства во всех областях закона
  rationale: Контекст прямо устанавливает одинаковый порядок Пасхи для переселенца и коренного жителя, но сам стих не требует распространять это утверждение за пределы данного обряда.
- issue: Условный оттенок וְעָשָׂה
  choice: и хочет совершить Пасху
  alternative: и совершит Пасху; и будет совершать Пасху
  rationale: В составе условной ситуации глагол естественно выражает намерение участвовать в Пасхе; перевод не утверждает, что любой живущий среди Израиля переселенец обязан делать это независимо от намерения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридико-обрядовым регистром. Синтаксис упрощён для ясности, но повтор единого установления и контраст между переселенцем и коренным жителем сохранены.
