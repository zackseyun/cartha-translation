revisions:
- from: Если же среди вас живёт переселенец и хочет совершить Пасху[a] в честь Яхве, пусть совершит её по установлению о Пасхе и по предписанному для неё порядку. Так он и должен поступить. Одно установление будет у вас и для переселенца[b], и для коренного жителя страны[c].
  to: Если среди вас живёт пришелец и совершает Пасху[a] в честь Яхве, пусть совершит её по установлению о Пасхе и по предписанному для неё порядку. Так он и должен поступить. Одно установление будет для вас, для пришельца[b] и для уроженца страны[c].
  rationale: Перевод уточнён там, где проект добавлял прямо не выраженное в исходном тексте желание совершить Пасху. Заключительная формула приведена к синтаксису и повтору предлогов еврейского текста; «уроженец страны» точнее передаёт противопоставление אֶזְרָח и גר. Сноски сохранены и приведены в соответствие с основным текстом.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:48:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан точно: גר — не случайный путник, Пасха совершается для Яхве, а соблюдение обряда подчиняется одному и тому же установлению. Однако «хочет совершить» вводит выраженное намерение, которого в еврейском тексте прямо нет; условная конструкция говорит о пришельце, который совершает/будет совершать Пасху.'
  naturalness: 'Текст литературный и понятный. В заключительной фразе «Одно установление будет у вас и для...» менее естественно и несколько размывает синтаксическую связь: установление должно быть «для вас». «Уроженец страны» точнее и нейтральнее, чем «коренной житель страны».'
  terminology: «Пришелец» с пояснением в сноске удачно передаёт правовой термин גר без современных ассоциаций слова «переселенец». «Установление» и «предписанный для неё порядок» удовлетворительно различают חקה и משפט. Имя «Яхве» передано последовательно.
  issues:
  - severity: medium
    issue: «хочет совершить Пасху»
    rationale: Еврейское וְעָשָׂה означает «и совершит/совершает», а не содержит отдельного глагола желания. Намерение может подразумеваться условием, но не должно вводиться как явно выраженный компонент смысла.
  - severity: low
    issue: «Одно установление будет у вас и для переселенца»
    rationale: В оригинале «одно установление будет для вас, для пришельца и для уроженца страны». Исправление предлога делает юридическую формулу естественнее и ближе к повтору לָכֶם וְלַגֵּר.
  - severity: low
    issue: «коренной житель страны»
    rationale: אֶזְרָח обозначает уроженца/местнорождённого в противопоставлении пришельцу. «Коренной» может вызывать дополнительные современные этносоциальные ассоциации; «уроженец» точнее.
