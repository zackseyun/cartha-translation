  source_fidelity: 'Требуется уточнить исходный пространственный пункт при הֵעָלֹת ... מֵעַל הָאֹהֶל: «поднималось над шатром» по-русски скорее означает, что облако поднималось, находясь над шатром, но не что оно удалялось с позиции над ним. «Поднималось от шатра» передаёт движение от шатра и не добавляет внешнего деятеля. Остальные соответствия верны: повторяемое условие, последовательность, «сыны Израиля», место остановки облака и разбивка стана сохранены.'
