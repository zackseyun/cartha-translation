  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: ru
  text: Всякий раз, когда облако поднималось от шатра[a], сыны Израиля после этого отправлялись в путь; и на том месте, где облако останавливалось, там сыны Израиля разбивали стан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от скинии», поскольку здесь под шатром подразумевается шатёр скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Всякий раз, когда облако поднималось
  rationale: Сочетание לְפִי с инфинитивом в данном контексте выражает повторяющееся временное условие. Русское «всякий раз, когда» передаёт этот процедурный смысл, а «поднималось» естественно описывает удаление облака с места над шатром, не уточняя внешнего деятеля.
- source_word: מֵעַל הָאֹהֶל
  choice: над шатром
  rationale: מֵעַל при глаголе удаления указывает на исходное положение облака над шатром. Слово אֹהֶל буквально означает «шатёр»; хотя речь идёт о шатре скинии, в основном тексте сохранено непосредственное обозначение оригинала.
- source_word: וְאַחֲרֵי כֵן
  choice: после этого
  rationale: 'Сохранена явно выраженная последовательность событий: сначала поднималось облако, затем народ выступал.'
- source_word: יִסְעוּ
  choice: отправлялись в путь
  rationale: Имперфект имеет здесь повторяющееся, обычное значение. Выражение передаёт начало перехода естественным современным русским языком.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено буквальное родовое наименование, обычное для библейского литературного регистра; оно обозначает народ Израиля как целое.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: и на том месте, где
  rationale: Формулировка сохраняет явную локативную конструкцию еврейского текста и звучит естественно по-русски.
- source_word: יִשְׁכָּן
  choice: останавливалось
  rationale: Для облака глагол שׁכן здесь означает установиться или пребывать на месте. «Останавливалось» ясно выражает прекращение движения, не внося излишней персонификации.
- source_word: שָׁם ... שָׁם
  choice: где ... там
  rationale: Сохранена соотносительная структура и второе שָׁם, подчёркивающее, что стан разбивали именно в месте остановки облака.
- source_word: יַחֲנוּ
  choice: разбивали стан
  rationale: Имперфект передаёт повторяющееся действие. «Разбивали стан» — современное и при этом достойное контекста обозначение устройства лагеря.
