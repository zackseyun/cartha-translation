  terminology: '«Шатёр», «сыны Израиля» и «разбивали стан» уместны. Сноска должна сохранять значение удаления: вариант «над скинией» сам по себе не передаёт מֵעַל при глаголе подъёма; следует дать «от скинии» и пояснить, что имеется в виду шатёр скинии.'
