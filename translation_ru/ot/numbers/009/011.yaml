base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: ru
  text: Во втором месяце, в четырнадцатый день, в сумерках[a] пусть совершают её; пусть едят её с пресным хлебом и горькими травами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами» — еврейское выражение, обозначающее время около захода солнца, то есть сумерки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Во второй месяц
  rationale: В календарном контексте חֹדֶשׁ означает «месяц»; сочетание с порядковым числительным естественно передаётся как «во второй месяц».
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: в четырнадцатый день
  rationale: Еврейская конструкция с количественным числительным обозначает календарную дату; по-русски естественно употребить порядковое числительное.
- source_word: בֵּין הָעַרְבַּיִם
  choice: в сумерках
  rationale: Идиома обозначает время около захода солнца. Ясный русский эквивалент дан в тексте, а буквальная форма сохранена в сноске.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: пусть совершают её
  rationale: В контексте Пасхи עשה означает обрядово совершать её, а не просто «делать». Местоимение сохраняет отсылку к Пасхе из контекста.
- source_word: עַל מַצּוֹת
  choice: с пресным хлебом
  rationale: В данном контексте עַל выражает сопровождение, а מַצּוֹת обозначает хлеб без закваски. Единственное число в русском языке естественно передаёт собирательное значение.
- source_word: וּמְרֹרִים
  choice: и горькими травами
  rationale: В пасхальной трапезе существительное во множественном числе обозначает употребляемую в пищу горькую зелень; «горькие травы» — ясная и точная передача.
- source_word: יֹאכְלֻהוּ
  choice: пусть едят её
  rationale: Форма выражает предписание, а местоименный суффикс отсылает к пасхальной жертве или трапезе; русский оборот сохраняет контекстуальную отсылку, не уточняя её искусственно.
theological_decisions:
- issue: Предмет местоимений в выражениях «совершают её» и «едят её»
  choice: Сохранить местоименную отсылку без добавления слов «праздник», «трапеза» или «агнец»
  alternative: Явно назвать Пасху, пасхальную жертву или агнца
  rationale: Еврейский текст употребляет местоименный суффикс, чей референт определяется предшествующим контекстом. Уточнение могло бы неоправданно сузить смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием законодательного предписания. Формы «пусть совершают» и «пусть едят» передают предписывающую силу еврейских имперфектов без архаичного «да».
