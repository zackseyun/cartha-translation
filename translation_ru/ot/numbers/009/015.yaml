base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: ru
  text: В день, когда была установлена скиния, облако покрыло скинию — шатёр свидетельства. А вечером оно оставалось над скинией и до самого утра выглядело как огонь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם הָקִים אֶת־הַמִּשְׁכָּן
  choice: В тот день, когда была установлена скиния
  rationale: Еврейская временная конструкция буквально означает «в день установления скинии». Придаточное предложение естественно звучит по-русски и сохраняет временной смысл; начальный союз וּ не требует отдельного «и» вне контекста.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся русское обозначение переносного святилища Израиля; оно точно передаёт культовый термин מִשְׁכָּן и остаётся узнаваемым для читателя.
- source_word: כִּסָּה הֶעָנָן
  choice: облако покрыло
  rationale: Прямо передаёт значение глагола כסה и определённость существительного «облако», известного из контекста странствия Израиля.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: шатёр свидетельства
  rationale: Фраза понята как приложение, уточняющее, что скиния является шатром свидетельства. «Свидетельство» ближе к значению עֵדוּת, чем традиционное, но семантически менее точное «откровение».
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: А вечером оно оставалось
  rationale: Имперфект в описательном контексте выражает продолжавшееся или обычное состояние. «Оставалось» естественно связывает вечер с облаком, не превращая видимость огня в утверждение, что облако было огнём.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: выглядело как огонь
  rationale: 'Сохраняется сравнение по внешнему виду: текст говорит о подобии огню, а не прямо отождествляет явление с огнём.'
- source_word: עַד־בֹּקֶר
  choice: до самого утра
  rationale: Естественное русское обозначение временного предела; частица «самого» подчёркивает непрерывность, уже заключённую в контексте.
theological_decisions:
- issue: Соотношение «скинии» и «шатра свидетельства»
  choice: Вторая фраза дана как приложение, отождествляющее шатёр свидетельства со скинией.
  alternative: 'Можно формально усмотреть в предлоге לְ локативный или направительный оттенок: «у/к шатру свидетельства».'
  rationale: 'В данном синтаксическом и культовом контексте приложение наиболее естественно: речь идёт не о двух сооружениях, а о двух обозначениях одного святилища.'
- issue: Природа ночного явления
  choice: 'Передано только зрительное подобие огню: «выглядело как огонь».'
  alternative: «Было огнём» или «стало огнём».
  rationale: Оборот כְּמַרְאֵה указывает на внешний вид и не позволяет безоговорочно отождествить облако с огнём.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемых библейских терминов «скиния» и «свидетельство». Два предложения облегчают чтение; тире ясно оформляет приложение. Формулировка о внешнем виде огня сохраняет осторожность оригинала.
