base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: ru
  text: 'И сказали ему те люди: «Мы нечисты из-за мёртвого тела[a]. Почему же нас должны лишить возможности принести приношение Яхве в назначенное для него время среди сынов Израиля[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нечисты из-за души (нефеш) человека»; в данном контексте это еврейское выражение означает нечистоту, связанную с человеческим трупом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «среди сынов Израиля»; «сыны Израиля» — обычное еврейское наименование израильского народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: И сказали ему те люди
  rationale: Сохраняется обычная повествовательная конструкция с וַיֹּאמְרוּ, указательное значение הָהֵמָּה и отсылка אֵלָיו к Моисею; порядок слов естественен для русского библейского повествования.
- source_word: טְמֵאִים
  choice: нечисты
  rationale: Речь идёт о ритуальной нечистоте; «нечисты» точнее и традиционно понятнее, чем более общее «нечистоплотны» или абстрактное «осквернены».
- source_word: לְנֶפֶשׁ אָדָם
  choice: из-за мёртвого тела
  rationale: В священническом контексте это устойчивое обозначение нечистоты, связанной с человеческим трупом. Перевод передаёт смысл идиомы, не воспроизводя непонятное буквальное «из-за души человека» и не добавляя прямо не выраженного в стихе слова «прикосновение».
- source_word: לָמָּה נִגָּרַע
  choice: Почему же нас должны лишить возможности
  rationale: Нифаль глагола גרע здесь выражает недопущение или исключение из участия. Русская формулировка сохраняет пассивный оттенок и естественно вводит последующий инфинитив.
- source_word: לְבִלְתִּי הַקְרִב
  choice: принести
  rationale: В сочетании с отрицательно направленным נִגָּרַע конструкция означает недопущение к совершению действия; הקריב в жертвенном контексте значит представить или принести приношение.
- source_word: קָרְבַּן יְהוָה
  choice: приношение Яхве
  rationale: קָרְבָּן обозначает дар или жертвенное приношение, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: בְּמֹעֲדוֹ
  choice: в назначенное для него время
  rationale: מוֹעֵד обозначает установленное, предписанное время; местоименный суффикс передан словами «для него», относящимися к приношению.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: вместе с сынами Израиля
  rationale: Буквальный образ «сыны Израиля» сохранён, а בְּתוֹךְ по смыслу участия в общем обряде естественно передано как «вместе с».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Характер нечистоты в выражении לְנֶפֶשׁ אָדָם
  choice: нечистота из-за мёртвого тела
  alternative: нечистота из-за прикосновения к умершему
  rationale: Контекст указывает на трупную нечистоту, однако данный стих сам по себе не называет прикосновение; основной текст не вводит эту дополнительную конкретизацию.
- issue: Значение נִגָּרַע
  choice: лишить возможности участвовать в принесении
  alternative: исключить из принесения
  rationale: Обе формулировки отражают недопущение к культовому участию; выбранный вариант звучит по-русски естественнее и не предполагает окончательного исключения из общины.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формулировки доступны обычному читателю; культовые понятия переданы точно, без конфессионально обусловленных уточнений. Синтаксическая напряжённость вопроса и его оттенок протеста сохранены.
