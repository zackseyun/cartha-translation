  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: ru
  text: Иногда облако оставалось над скинией несколько дней; по повелению Яхве народ стоял станом[a], и по повелению Яхве отправлялся в путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве» — то есть по повелению Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Иногда
  rationale: Оборот вводит один из повторяющихся вариантов длительности стоянки; «иногда» естественно и точно передаёт это значение.
- source_word: יִהְיֶה הֶעָנָן
  choice: облако оставалось
  rationale: В контексте речь идёт не просто о существовании облака, а о его продолжающемся пребывании над скинией.
- source_word: יָמִים מִסְפָּר
  choice: несколько дней
  rationale: Идиома обозначает ограниченное, исчислимое число дней, не уточняя его; русское «несколько дней» передаёт это естественно.
- source_word: עַל הַמִּשְׁכָּן
  choice: над скинией
  rationale: «Скиния» — устоявшееся и понятное название переносного святилища; предлог «над» точно выражает положение облака.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Буквально «по устам Яхве»; это идиома со значением властного указания или повеления.
- source_word: יַחֲנוּ
  choice: народ стоял станом
  rationale: Имперфект описывает повторявшееся действие. Явное «народ» естественно восполняет подразумеваемое множественное подлежащее и помогает избежать двусмысленности с облаком.
- source_word: יִסָּעוּ
  choice: отправлялся в путь
  rationale: В контексте странствования глагол означает сняться со стоянки и двинуться дальше.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер руководства при стоянке и выступлении
  choice: по повелению Яхве
  alternative: по устам Яхве
  rationale: Идиоматический перевод ясно выражает Божье властное руководство, не добавляя объяснений о способе передачи повеления.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («скиния», «стоять станом»). Синтаксис сохраняет параллелизм двух заключительных частей еврейского стиха.
