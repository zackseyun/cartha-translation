base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: ru
  text: И они совершили Пасху в первом месяце, в четырнадцатый день месяца, в сумерках[a], в Синайской пустыне; сыны Израиля сделали всё в точности так, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами» — еврейское выражение, обозначающее сумеречное время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: совершили Пасху
  rationale: Сочетание עשה с פֶּסַח означает соблюдение установленного пасхального обряда. «Совершили Пасху» естественно передаёт ритуальный смысл, не сужая его только до жертвы или только до праздника.
- source_word: בָּרִאשׁוֹן
  choice: в первом месяце
  rationale: Слово «месяце» подразумевается еврейской календарной формулой и добавлено для ясности по-русски.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: в четырнадцатый день месяца
  rationale: Точная и естественная передача стандартной еврейской формулы даты.
- source_word: בֵּין הָעַרְבַּיִם
  choice: в сумерках
  rationale: Буквально выражение означает «между вечерами» и обозначает сумеречное время; буквальная форма сохранена в примечании.
- source_word: בְּמִדְבַּר סִינָי
  choice: в Синайской пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «Синайская пустыня» — ясная и естественная русская географическая формулировка.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: сделали всё так, как … повелел
  rationale: Формулировка сохраняет значение полного соответствия повелению и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён явный сыновний и грамматически мужской образ исходного выражения, которое при этом обозначает народ как единое целое.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Выбранная передача сохраняет мужскую и сыновнюю форму еврейского выражения, не отрицая его собирательного значения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок фраз слегка перестроен ради естественности; повтор корня עשה отражён глаголами «совершили» и «сделали».
