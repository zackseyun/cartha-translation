  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: ru
  text: Будь то два дня, месяц или более долгий срок[a], пока облако оставалось над скинией, покоясь над нею, сыны Израиля стояли лагерем и не отправлялись в путь; когда же оно поднималось, они отправлялись в путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дни»; здесь, вероятно, имеется в виду продолжительный срок. Возможный перевод: «много дней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Будь то ... ... или ...
  rationale: Повторяющийся разделительный союз задаёт ряд возможных сроков; русская конструкция естественно передаёт этот диапазон.
- source_word: יֹמַיִם
  choice: два дня
  rationale: Двойственное число прямо обозначает два дня.
- source_word: חֹדֶשׁ
  choice: месяц
  rationale: Неопределённое значение соответствует перечислению возможных сроков.
- source_word: יָמִים
  choice: более долгий срок
  rationale: После «двух дней» и «месяца» слово «дни» по контексту обозначает продолжительное время; буквальная форма отмечена в сноске.
- source_word: בְּהַאֲרִיךְ
  choice: пока ... оставалось
  rationale: Форма выражает продолжительность пребывания облака; «пока оставалось» ясно и естественно вводит временное условие.
- source_word: הֶעָנָן
  choice: облако
  rationale: Обычное обозначение облака, направлявшего Израиль в пустыне.
- source_word: הַמִּשְׁכָּן
  choice: скиния
  rationale: Устоявшееся и узнаваемое русское название переносного святилища.
- source_word: לִשְׁכֹּן עָלָיו
  choice: пребывая над ней
  rationale: Передаёт устойчивое нахождение облака над скинией, не устраняя смысловой связи корня שכן с местом пребывания.
- source_word: יַחֲנוּ
  choice: стояли лагерем
  rationale: 'Имперфект описывает повторявшееся действие: пока облако оставалось, израильтяне продолжали стоять лагерем.'
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально соответствует еврейскому выражению и сохраняет традиционный библейский оборот, оставаясь понятным современному читателю.
- source_word: וְלֹא יִסָּעוּ
  choice: и не отправлялись в путь
  rationale: В походном контексте נסע означает сняться с места и выступить; выбранная формулировка естественна по-русски.
- source_word: וּבְהֵעָלֹתוֹ
  choice: когда же оно поднималось
  rationale: Суффикс относится к облаку; буквальное «поднималось» сохраняет формальную неоднозначность относительно действующего лица и соответствует контексту сигнала к выступлению.
