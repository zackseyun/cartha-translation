base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: ru
  text: 'И Моисей сказал им[a]: «Подождите, и я услышу, что повелит Яхве о вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Стойте» — более буквальная передача древнееврейского повеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И ... сказал
  rationale: Стандартное продолжение древнееврейского повествования; союз «и» сохраняет последовательность событий без лишней интерпретации.
- source_word: אֲלֵהֶם
  choice: им
  rationale: Естественная русская передача предлога с местоименным суффиксом третьего лица множественного числа.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени.
- source_word: עִמְדוּ
  choice: Подождите
  rationale: Буквально глагол означает «стойте», но здесь повеление требует оставаться на месте в ожидании ответа; «подождите» естественно передаёт контекстуальный смысл. Буквальная возможность отмечена в сноске.
- source_word: וְאֶשְׁמְעָה
  choice: а я услышу
  rationale: Форма первого лица выражает намерение Моисея получить ответ; «услышу» сохраняет образ исходного текста, не добавляя прямо не названных действий вроде обращения или вопрошания.
- source_word: מַה
  choice: что
  rationale: Вопросительное местоимение вводит содержание ожидаемого повеления.
- source_word: יְצַוֶּה
  choice: повелит
  rationale: Порода piel глагола צוה означает «повелевать, приказывать»; совершенный вид будущего времени естественно выражает ожидаемое конкретное распоряжение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: לָכֶם
  choice: о вас
  rationale: В данном контексте предлог ל с местоименным суффиксом указывает на распоряжение относительно положения этих людей; «о вас» естественно и не исключает смысла распоряжения, данного для них.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» прямо передаёт имя и не заменяет его титулом; форма «Иегова» менее точно отражает наиболее вероятное древнее произношение.
- issue: Направленность повеления в לָכֶם
  choice: о вас
  alternative: для вас; вам
  rationale: Контекст допускает оттенки повеления, касающегося этих людей, данного для них или обращённого к ним. «О вас» лучше передаёт непосредственный контекст разбирательства, не превращая эту фразу в строгое указание адресата.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Сохранён необычный, но значимый образ «услышу»; контекстуально идиоматичное «подождите» сопровождено буквальной альтернативой в сноске.
