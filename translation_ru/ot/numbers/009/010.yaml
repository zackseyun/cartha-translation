  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: ru
  text: 'Скажи сынам Израиля[a]: «Если кто-либо — среди вас или в поколениях ваших[b] — будет нечист от мёртвого тела[c] либо будет в дальнем пути[d], пусть совершит Пасху в честь Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля»; это выражение обозначает израильский народ как сообщество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у вас или в последующих поколениях». Выражение распространяет это установление на нынешних адресатов и будущие поколения.'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Буквально: «нечист для души (человека)». В данном правовом контексте это идиом ритуальной нечистоты, связанной с телом умершего.'
    reason: lexical_alternative
  - marker: d
    text: В масоретской традиции над последней буквой еврейского слова, переведённого «дальнем», стоит надстрочная точка. Её значение не вполне ясно и не требует изменения основного перевода.
    reason: textual_feature
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Скажи сынам Израиля
  rationale: Императив передан естественным русским «скажи»; буквальное выражение «сыны Израиля» сохранено как традиционное обозначение народа, а его собирательный смысл пояснён в сноске.
- source_word: אִישׁ אִישׁ
  choice: кто-либо
  rationale: Повтор существительного имеет дистрибутивное значение — любой отдельный человек. «Кто-либо» естественно передаёт условную формулировку закона, не превращая её в указание исключительно на взрослого мужчину.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: нечист из-за умершего
  rationale: В священническо-правовом контексте נֶפֶשׁ обозначает умершего человека как источник ритуальной нечистоты. Формулировка не добавляет отсутствующего в стихе уточнения о конкретном способе соприкосновения.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: в дальней дороге
  rationale: Идиоматично передаёт пребывание вдали вследствие пути, сохраняя образ дороги и не сводя выражение только к субъективной оценке расстояния.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: из вас или из ваших потомков
  rationale: 'Дательные предложные формы поняты как указание на тех, к кому относится постановление: нынешних адресатов и последующие поколения. Возможное обстоятельственное понимание отмечено в сноске.'
- source_word: וְעָשָׂה פֶסַח
  choice: пусть он празднует Пасху
  rationale: Сочетание עשה с פֶּסַח означает соблюдение или совершение Пасхи. Побудительная конструкция «пусть празднует» естественно выражает правовое предписание и не добавляет отсутствующего в еврейском тексте наречия «всё же».
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל обозначает направленность празднования Богу; «в честь» естественно по-русски передаёт этот смысл. Личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное заветное имя Бога; транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Круг адресатов выражения בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Основной текст сохраняет форму исходного заветного обращения, а сноска поясняет, что речь идёт об израильском сообществе в целом.
- issue: Обязательность совершения Пасхи при нечистоте или удалённости
  choice: пусть он празднует
  alternative: он всё же должен праздновать
  rationale: Еврейская форма выражает предписание, но наречие «всё же» прямо не представлено. Порядок совершения Пасхи в таких обстоятельствах раскрывается в следующем стихе, поэтому здесь не следует усиливать или разрешать напряжение сверх текста.
