base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: ru
  text: Бывало, облако оставалось с вечера до утра; когда утром облако поднималось[a], они отправлялись в путь. Или же оно оставалось в течение дня и ночи — и, когда облако поднималось, они отправлялись в путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально означает «восходило» или «поднималось». В этом контексте поднятие облака служило знаком к выступлению.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Бывало
  rationale: Естественно передаёт еврейский оборот, вводящий один из возможных, время от времени повторявшихся случаев.
- source_word: יִהְיֶה הֶעָנָן
  choice: облако оставалось
  rationale: Глагол היה буквально означает «быть», но при указании промежутка времени выражает продолжающееся пребывание; «оставалось» ясно передаёт этот длительный смысл.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: с вечера до утра
  rationale: Прямое и естественное русское обозначение временного промежутка.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: когда облако поднималось
  rationale: Форма глагола עלה буквально описывает движение облака вверх; в контексте это служило знаком к выступлению. Перевод сохраняет образ и не вводит явно действующего лица.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Краткий и естественный русский эквивалент обстоятельства времени.
- source_word: וְנָסָעוּ
  choice: они отправлялись в путь
  rationale: В повествовании о странствии נסע обозначает снятие с места и начало перехода; выбранная формулировка понятна современному читателю и не добавляет образа сворачивания лагеря.
- source_word: אוֹ
  choice: Или же
  rationale: Вводит второй случай, параллельный первому, и сохраняет связь с предшествующим описанием.
- source_word: יוֹמָם וָלַיְלָה
  choice: на день и ночь
  rationale: В данном контексте выражение указывает продолжительность пребывания облака. Формулировка сохраняет отдельное упоминание дня и ночи, не заменяя его толкующим «на сутки».
theological_decisions:
- issue: Передача поднятия облака как знака к выступлению
  choice: облако поднималось
  alternative: облако было поднято
  rationale: Еврейский глагол имеет активную форму и буквально означает, что облако поднялось. Такая передача сохраняет богословски значимую неопределённость относительно непосредственного деятеля и не ослабляет контекстуальную связь с Божьим водительством.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и достойно. Повтор формулы «когда облако поднималось, они отправлялись в путь» сохранён как значимый элемент устройства исходного текста.
