base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: ru
  text: Когда облако оставалось над скинией много дней, сыны Израиля[a] соблюдали предписание Яхве[b] и не отправлялись в путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поручение Яхве» или «обязанность, возложенную Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: Когда облако долго оставалось
  rationale: Конструкция ב с инфинитивом אָרַךְ вводит придаточное времени и указывает на продолжительное пребывание; такой перевод естественен по-русски и сохраняет значение длительности.
- source_word: עַל הַמִּשְׁכָּן
  choice: над скинией
  rationale: В данном контексте מִשְׁכָּן обозначает священную скинию, а עַל — положение облака над ней.
- source_word: יָמִים רַבִּים
  choice: долго
  rationale: Буквально «много дней»; наречие «долго» естественно передаёт длительность, не меняя смысла.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт мужскую множественную конструкцию и сохраняет родственно-заветный оттенок исходного выражения.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת יְהוָה
  choice: соблюдали установленное Яхве
  rationale: Однокоренная еврейская конструкция שׁמר מִשְׁמֶרֶת означает исполнять вверенное предписание или обязанность. Русское «соблюдали установленное» передаёт этот смысл без неестественной кальки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְלֹא יִסָּעוּ
  choice: и не отправлялись в путь
  rationale: В повествовании о странствии נסע означает сняться со стоянки и выступить; выбранная формулировка ясна и естественна в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя; транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Выбранный вариант сохраняет буквальную родственную форму исходного текста; сноска сообщает естественную русскую альтернативу.
- issue: Смысл מִשְׁמֶרֶת יְהוָה
  choice: установленное Яхве
  alternative: поручение Яхве; предписание Яхве
  rationale: Контекст говорит об обязанности оставаться на месте в соответствии с Божьим указанием. Формулировка сохраняет широту значения — предписание, поручение или возложенную обязанность — не сводя его к одному отдельному повелению.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Традиционное «скиния» сохранено как точный и узнаваемый термин; синтаксис сделан ясным для обычного читателя.
