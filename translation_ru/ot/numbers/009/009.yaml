base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (YHWH); традиционная русская передача: «Господь».'
    reason: Указывает еврейское написание Божьего имени и традиционную русскую замену титулом, не выдавая «Яхве» за огласованную форму исходного текста.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И ... сказал
  rationale: Форма с וַ־ продолжает повествовательную последовательность. В русской библейской речи естественно «И ... сказал»; глагол «сказал» вместе с לֵאמֹר передаёт введение последующей прямой речи без тяжеловесного повтора «говорил... говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание речи. В современном русском эту функцию естественно и точно выполняет двоеточие, поскольку сама речь следует в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет его как имя; традиционная замена «Господь» превращает имя в титул, а «Иегова» отражает более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формульное לֵאמֹר передано пунктуационно, чтобы избежать неестественного «сказал, говоря»; связь с последующей речью сохранена двоеточием.
