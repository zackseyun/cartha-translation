id: NUM.9.13
reference: Numbers 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: ru
  text: Но человек, который чист и не был в пути, а всё же не совершил Пасху, будет отсечён от своего народа[a], потому что не принёс приношение Яхве в назначенное время. Этот человек понесёт свой грех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «та душа будет отсечена». Здесь «душа» означает самого человека. Выражение может обозначать суровый суд в рамках завета, но этот стих не уточняет, как именно он осуществляется.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «понесёт свою вину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: чист
  rationale: В данном обрядовом контексте слово обозначает ритуальную чистоту, а не нравственную безупречность.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: не находится в пути
  rationale: Фраза указывает на отсутствие предусмотренной контекстом причины — поездки; русское выражение естественно передаёт это состояние.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: однако не совершит Пасху
  rationale: Сохраняется смысл намеренного или виновного несовершения пасхального установления без сужения значения только до празднования либо только до жертвы.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: он будет отсечён
  rationale: נפש здесь означает самого человека; образное юридико-заветное выражение «будет отсечён» сохранено без уточнения способа наказания.
- source_word: מֵעַמֶּיהָ
  choice: от своего народа
  rationale: Местоименный суффикс грамматически согласован с женским נפש, но относится к названному мужчине; по-русски естественно «от своего народа».
- source_word: קָרְבַּן יְהוָה
  choice: приношение Яхве
  rationale: קָרְבָּן — приношение, подносимое Богу; личное имя יהוה передано как «Яхве».
- source_word: בְּמֹעֲדוֹ
  choice: в назначенное для него время
  rationale: מוֹעֵד обозначает установленный, предписанный срок; местоимение соотнесено с приношением.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: понесёт свой грех
  rationale: Сохранена ёмкая древнееврейская идиома, включающая ответственность за грех и его последствия; перевод «понесёт вину» возможен, но несколько истолковывает её.
theological_decisions:
- issue: Значение наказания «будет отсечён»
  choice: Сохранить выражение «будет отсечён» без уточнения конкретной формы наказания.
  alternative: «будет исключён из общины» или «будет предан смерти»
  rationale: Сам стих не определяет однозначно, идёт ли речь о смерти, исключении из общины или ином Божьем суде; буквальный образ сохраняет юридическую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Формула «совершить Пасху» сохраняет связь как с пасхальным обрядом в целом, так и с жертвенным действием. Сноски поставлены непосредственно после выражений, к которым относятся.
