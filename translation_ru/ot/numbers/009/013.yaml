  source_fidelity: 'Основной смысл передан верно: речь о ритуально чистом мужчине, который не был в пути и не совершил Пасху; сохраняются неуточнённая формула отсечения, приношение Яхве и идиома несения греха. Однако формы «не находится» и особенно «не совершит» менее точно отражают ретроспективные формы в еврейском условном описании: человек не был в пути и всё же не совершил Пасху. «В назначенное для него время» стилистически тяжеловесно и неопределённо по соотнесению местоимения.'
