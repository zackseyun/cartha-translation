  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: ru
  text: Пусть ничего не оставляют от него до утра и не ломают ни одной его кости[a][b]. Пусть совершают Пасху, соблюдая все предписания о ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и кость не сломают в нём».'
    reason: lexical_alternative
  - marker: b
    text: Ср. Исх. 12:46, где дан тот же запрет при совершении Пасхи.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: не оставляют от него до утра
  rationale: Глагол в породе hифиль означает «оставлять, давать остаться»; сочетание с מן имеет партитивный смысл — нельзя оставлять какую-либо часть пасхальной жертвы до утра.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: и не ломают ни одной его кости
  rationale: Единственное число עֶצֶם употреблено дистрибутивно. Русское «ни одной его кости» естественно передаёт полный запрет, тогда как буквальное «не ломают в нём кости» менее ясно.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: во всём по установленному для неё правилу
  rationale: חֻקָּה — установленное предписание или правило; сочетание כָּל с единственным числом выражает всю полноту предписанного порядка. Формулировка сохраняет собирательное единственное число и остаётся естественной по-русски.
- source_word: הַפֶּסַח
  choice: Пасху
  rationale: В контексте слово обозначает пасхальное установление и его совершение, а не только животное или трапезу; «Пасха» сохраняет эту смысловую широту.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: Пусть совершают Пасху
  rationale: עשה применительно к обряду означает совершать или соблюдать его. Повтор существительного вместо местоимения устраняет в русском неясность и согласуется с обычным выражением «совершать Пасху».
theological_decisions:
- issue: Возможное межтекстовое значение запрета ломать кости
  choice: Передать слова как прямое предписание о Пасхе, не вводя в основной текст позднейшее христологическое истолкование.
  alternative: Сформулировать стих так, чтобы подчеркнуть его новозаветное применение.
  rationale: В непосредственном контексте это правило совершения Пасхи. Его дальнейшие канонические отголоски уместно учитывать, но не следует вносить их в перевод древнееврейского текста.
translation_notes:
  register: Современный литературный русский язык; повелительное значение древнееврейского имперфекта передано конструкцией «пусть». Сохранён торжественный, но понятный обычному читателю тон. Неестественная калька «по всему установлению Пасхи» заменена ясной формулировкой без изменения смысла.
