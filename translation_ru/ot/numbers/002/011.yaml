  language: ru
  text: И его отряд, то есть все исчисленные в нём, — сорок шесть тысяч пятьсот человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: его отряд
  rationale: В контексте переписи и расположения стана צָבָא обозначает организованное племенное подразделение. «Отряд» сохраняет военно-организационный оттенок, не подразумевая непременно участия в бою.
- source_word: פְקֻדָיו
  choice: все исчисленные в нём
  rationale: Форма от פקד относится к людям, учтённым при переписи. «Исчисленные» соответствует возвышенному повествовательному регистру, а «в нём» передаёт принадлежность к названному отряду.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: сорок шесть тысяч пятьсот
  rationale: Число передано в обычном для современного русского языка порядке.
