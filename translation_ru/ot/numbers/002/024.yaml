  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: ru
  text: Всех исчисленных в стане Ефрема было 108 100 — по их воинским подразделениям.[a] Они должны выступать третьими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их ополчениям»; еврейское слово может обозначать воинства, отряды или организованные воинские подразделения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: всех исчисленных
  rationale: Передаёт итог переписи и сохраняет оттенок учёта людей, пригодных к военной службе, не добавляя отсутствующего здесь слова «мужчин».
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: в стане Ефрема
  rationale: Естественно по-русски обозначает принадлежность исчисленных к стану, возглавляемому Ефремом.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 108 100
  rationale: Точно передаёт еврейское числовое выражение в современном русском цифровом оформлении.
- source_word: לְצִבְאֹתָם
  choice: по их воинским подразделениям
  rationale: Сохраняет военную организационную окраску צָבָא и в данном контексте яснее общего слова «ополчения».
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Они должны выступать третьими
  rationale: Передаёт установленный порядок движения; множественное «третьими» естественно согласуется с подразумеваемыми людьми и подразделениями.
