lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: И его воинский отряд
  rationale: В контексте переписи и расположения стана צָבָא обозначает организованное подразделение племени, способное нести военную службу. «Воинский отряд» передаёт этот смысл естественнее, чем архаичное «ополчение» или слишком широкое «войско».
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных в нём
  rationale: Форма от פקד относится к людям, учтённым при переписи для службы. Буквальное местоименное число — «их», однако по-русски «в нём» естественно соотносит исчисленных с названным отрядом; слово «мужчин» не добавлено, поскольку в данном кратком выражении оно прямо не названо.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: сорок тысяч пятьсот
  rationale: Обычная русская форма составного количественного числительного, точно передающая 40 500.
