  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (YHWH); традиционно переводится: «Господь».'
    reason: Пояснение передачи тетраграмматона и традиционного варианта.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в формуле божественной речи обозначает речевое обращение. «Сказал» естественно звучит в современном русском повествовании и вместе с двоеточием вводит содержание речи в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон יהוה как личное имя, а не заменяет его титулом; форма «Яхве» общепринята в современной русскоязычной библеистике.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно передаёт адресатов речи; союз и повтор предлога в еврейском тексте ясно указывают на двух равноправно названных адресатов.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формулу введения прямой речи «говоря» в современном русском естественно передаёт двоеточие; буквальное «говоря» здесь было бы тяжеловесным и избыточным.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет это отличие от титула «Господь», при этом примечание сообщает читателю о традиционной замене имени.
translation_notes:
  register: Современный литературный русский язык, краткая повествовательная формула с достоинством библейского стиля. Двоеточие естественно связывает стих с последующей прямой речью; подлинное имя Бога сохраняется в основном тексте.
