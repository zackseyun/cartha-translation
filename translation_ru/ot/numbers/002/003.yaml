  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: ru
  text: Те, кто расположатся лагерем с восточной стороны, к восходу солнца, будут под знаменем стана Иуды — по своим воинским подразделениям. Предводитель сынов Иуды — Нахшон, сын Амминадава.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: расположится стан
  rationale: Причастная конструкция обозначает тех, кто становится станом; по-русски естественно передать её через расположение стана, сохраняя связь с устройством лагеря.
- source_word: קֵדְמָה מִזְרָחָה
  choice: с восточной стороны, к восходу солнца
  rationale: 'Сохранены оба близких пространственных выражения оригинала: сторона света и направление восхода.'
- source_word: דֶּגֶל
  choice: знамя
  rationale: Слово обозначает крупное лагерное объединение, опознаваемое по знамени; перевод «под знаменем» естественно выражает устройство стана, не сводя термин лишь к предмету.
- source_word: לְצִבְאֹתָם
  choice: по своим воинским подразделениям
  rationale: צָבָא здесь относится к организованным отрядам исчисленного народа; «воинские подразделения» передаёт военную организацию и множественное число.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: Передаёт главу колена в данном контексте без позднейших политических ассоциаций слова «князь».
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Нахшон, сын Амминадава
  rationale: Имена транслитерированы непосредственно с еврейского текста с сохранением родословной формулы.
theological_decisions: []
