lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: и племя
  rationale: В контексте расположения стана מַטֶּה обозначает племя, а не буквальный посох; союз сохраняет структуру перечня.
- source_word: גָּד
  choice: Гада
  rationale: Традиционная русская передача названия племени; родительный падеж обусловлен синтаксисом.
- source_word: וְ/נָשִׂיא
  choice: вождь
  rationale: נָשִׂיא здесь означает признанного главу племени; «вождь» естественно передаёт административную роль без монархического оттенка слова «князь».
- source_word: לִ/בְנֵי גָד
  choice: сыновей Гада
  rationale: Сохранена прозрачная библейская формула, обозначающая членов и потомков племени Гада.
- source_word: אֶלְיָסָף
  choice: Элиасаф
  rationale: Традиционная русская библейская форма личного имени.
- source_word: בֶּן
  choice: сын
  rationale: Прямая передача обычной патронимической формулы.
- source_word: רְעוּאֵל
  choice: Реуила
  rationale: Основной текст WLC здесь читает רְעוּאֵל; отличие от имени Девуил в параллельном месте не гармонизируется и отмечается сноской.
