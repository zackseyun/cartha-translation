base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: ru
  text: Рядом с ним располагается колено Симеона[a], а предводитель сынов Симеона — Шелумиил, сын Цуришаддая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение означает расположение поблизости; местоимение может относиться к Рувиму или к его стану.
    reason: лексическая и референциальная неоднозначность
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: расположится
  rationale: Субстантивированное причастие от חנה обозначает тех, кто становится лагерем. В русском контексте устройства стана естественнее передать это сказуемым «расположится», согласованным с «колено».
- source_word: עָלָיו
  choice: рядом с ним
  rationale: В описании расположения стана עַל указывает на соседство, а не на положение сверху. Мужской суффикс сохранён местоимением «ним»; возможная соотнесённость с Рувимом или его станом отмечена в сноске.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: колено Симеона
  rationale: מַטֶּה в повествованиях о переписи и стане означает племенное подразделение Израиля; традиционное и ясное русское соответствие — «колено».
- source_word: וְנָשִׂיא
  choice: а предводитель
  rationale: נָשִׂיא здесь обозначает признанного главу колена. «Предводитель» передаёт функцию и не вносит монархического оттенка слова «князь».
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: сынов Симеона
  rationale: Сохранено выраженное в еврейском тексте родственное обозначение בְּנֵי, обычное для именования членов колена.
- source_word: שְׁלֻמִיאֵל
  choice: Шелумиил
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: сын Цуришаддая
  rationale: Патронимическая конструкция передана прямо; имя отца оформлено в соответствии с принятой русской библейской традицией.
theological_decisions:
- issue: Родовое обозначение לִבְנֵי שִׁמְעוֹן
  choice: сынов Симеона
  alternative: потомков Симеона
  rationale: Форма «сынов» сохраняет мужское родственное обозначение исходного текста и остаётся понятной в контексте родоплеменного списка.
- issue: Референт местоименного суффикса в עָלָיו
  choice: рядом с ним
  alternative: рядом с его станом
  rationale: Перевод не закрепляет однозначно референт как стан, сохраняя грамматическую форму и допустимую смысловую напряжённость; контекстуальная неоднозначность пояснена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Предводитель» и «колено» понятны современному читателю; форма «сынов Симеона» сохраняет родословный характер исходного текста без излишней архаизации.
