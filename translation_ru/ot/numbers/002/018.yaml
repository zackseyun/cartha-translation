  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: ru
  text: Знамя стана Ефрема, по своим подразделениям, располагается на западе; предводитель сынов Ефрема — Елишама, сын Аммиуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: знамя
  rationale: Обозначает опознавательное племенное или военное знамя, вокруг которого располагался стан; «знамя» естественно и точно в современном русском языке.
- source_word: מַחֲנֵה
  choice: стан
  rationale: В контексте расположения племён обозначает организованный лагерь; «стан» сохраняет торжественно-библейский оттенок, оставаясь понятным современному читателю.
- source_word: לְצִבְאֹתָם
  choice: по их ополчениям
  rationale: Передаёт упорядоченную военно-организационную структуру, не подразумевая непременно участия в боевых действиях.
- source_word: יָמָּה
  choice: на западной стороне
  rationale: Буквально направление к морю, в древнеизраильской ориентации — на запад; в формуле расположения стана естественно «на западной стороне».
- source_word: וְנָשִׂיא
  choice: предводитель
  rationale: Передаёт роль главы племени без династических ассоциаций, которые могло бы вызвать слово «князь».
- source_word: לִבְנֵי אֶפְרַיִם
  choice: сынов Ефрема
  rationale: Сохраняет еврейское обозначение племени через родство и соответствует возвышенному, но понятному русскому регистру.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Елишама, сын Аммиуда
  rationale: Имена переданы транслитерацией; בֶּן прямо переведено словом «сын».
