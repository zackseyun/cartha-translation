  text: 'И его отряд, и исчисленные из них: сорок одна тысяча пятьсот.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: И его отряд
  rationale: В контексте переписи и расположения стана צָבָא обозначает организованное племенное, в том числе военное, подразделение. «Отряд» естественно звучит по-русски и не усиливает оттенок непосредственного участия в войне.
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных в нём
  rationale: Форма от פקד в переписной формуле указывает на сосчитанных или внесённых в число. Местоимение во множественном числе буквально означает «их», но по-русски естественнее соотнести его с собирательным «отряд» как «в нём»; слово «мужчин» не добавлено, поскольку в этой части стиха оно прямо не выражено.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: сорок одна тысяча пятьсот
  rationale: Число передано в обычном порядке современного русского языка без изменения значения.
