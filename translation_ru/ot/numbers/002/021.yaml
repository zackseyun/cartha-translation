  text: и его отряд[a], число учтённых в нём — тридцать две тысячи двести человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войско»; еврейское צָבָא здесь обозначает племенной воинский отряд, располагавшийся и выступавший в установленном порядке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: и его отряд
  rationale: צָבָא может означать войско или воинское подразделение; в контексте устройства стана и порядка выступления в Числах 2 речь идёт о племенном отряде. «Отряд» естественно звучит по-русски и передаёт организационный смысл.
- source_word: וּפְקֻדֵיהֶם
  choice: насчитанных в нём
  rationale: Форма от פקד обозначает учтённых при переписи. Хотя еврейский суффикс имеет множественное число («в них/из них»), по-русски согласование с единственным числом «отряд» естественно передаёт тот же референт без изменения смысла.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: тридцать две тысячи двести человек
  rationale: Число передано в обычном современном русском порядке; «человек» добавлено для ясности как подразумеваемое исчисляемое существительное.
