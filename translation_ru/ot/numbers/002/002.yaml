base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: ru
  text: 'Сыны Израиля должны располагаться станом: каждый — у своего знамени, со знаками своих отчих домов; они должны располагаться станом вокруг шатра встречи, напротив него.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на некотором расстоянии от шатра встречи». Еврейское מִנֶּגֶד буквально означает «напротив»; в этом контексте оно может также подразумевать расстояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ עַל דִּגְלוֹ
  choice: каждый при своём знамени
  rationale: אִישׁ употреблено распределительно, а דֶּגֶל обозначает опознавательное племенное или военное знамя. Формулировка естественна по-русски и сохраняет структуру оригинала.
- source_word: בְאֹתֹת לְבֵית אֲבֹתָם
  choice: при знаках домов своих отцов
  rationale: אוֹתֹת — опознавательные знаки; ב передаёт сопутствие или ориентир. «Дома отцов» сохраняет родовую структуру, обозначенную еврейским выражением.
- source_word: יַחֲנוּ
  choice: должны располагаться станом / пусть располагаются станом
  rationale: Имперфект в предписывающем контексте имеет директивную силу. Варьирование форм избегает тяжеловесного повтора при сохранении повторения самого действия.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Буквальная родственная формула сохраняет образность и коллективную идентичность еврейского текста; современное «израильтяне» также возможно.
- source_word: מִנֶּגֶד סָבִיב לְאֹהֶל מוֹעֵד
  choice: вокруг шатра встречи, напротив него
  rationale: סָבִיב указывает на размещение кругом, а מִנֶּגֶד — на положение напротив, на некотором удалении. Порядок слов перестроен ради ясного русского синтаксиса без устранения пространственной напряжённости выражения.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прямо передаёт оба компонента еврейского словосочетания и не подменяет переносное святилище более традиционным, но менее прозрачным термином «скиния».
theological_decisions:
- issue: Родственная и грамматически мужская формулировка
  choice: сыны Израиля / каждый
  alternative: израильтяне / каждый из них
  rationale: Выбор сохраняет мужскую родственную формулу בְנֵי יִשְׂרָאֵל и распределительное אִישׁ, не расширяя и не сужая явно обозначенную группу.
- issue: Наименование святилища
  choice: шатёр встречи
  alternative: скиния собрания
  rationale: Буквальная передача אֹהֶל מוֹעֵד остаётся понятной современному читателю и не вносит традиционный специальный термин вместо образа исходного текста.
- issue: Пространственное отношение к шатру
  choice: вокруг шатра встречи, напротив него
  alternative: поодаль вокруг шатра встречи
  rationale: מִנֶּגֶד может выражать положение напротив и подразумевать дистанцию. Основной текст сохраняет значение «напротив», а возможный оттенок удаления отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены родовая формула «сыны Израиля» и «дома отцов»; устаревшие синтаксические обороты сведены к минимуму.
