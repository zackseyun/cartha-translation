lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: И его ополчение
  rationale: צָבָא обозначает организованное войско или воинское подразделение. В контексте расположения племён «ополчение» передаёт военную организацию народа, не подразумевая текущих боевых действий.
- source_word: וּפְקֻדֵיהֶם
  choice: все исчисленные у них
  rationale: Форма от פקד относится к людям, учтённым при переписи. Множественный суффикс сохранён выражением «у них», а «все» естественно передаёт пояснительное отношение к названному ополчению, не добавляя отсутствующего здесь слова «мужчины».
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: пятьдесят три тысячи четыреста
  rationale: Число передано в обычном для современного русского языка порядке с точным сохранением итога.
