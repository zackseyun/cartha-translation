  language: ru
  text: И его ополчение[a], и исчисленных в нём — пятьдесят три тысячи четыреста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войско»; еврейское слово обозначает организованное племенное подразделение и может иметь военный оттенок.'
