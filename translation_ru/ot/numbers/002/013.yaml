  text: 'and his division, those numbered from them: fifty-nine thousand three hundred.'
translation:
  language: ru
  text: и его отряд, и исчисленные в нём — пятьдесят девять тысяч триста.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: и его отряд
  rationale: צָבָא в контексте переписи и расположения стана обозначает организованное воинское подразделение племени. «Отряд» звучит естественно и современно, не создавая впечатления, будто речь идёт обо всей армии; союз וּ и местоименный суффикс 3-го лица мужского рода переданы как «и его».
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных
  rationale: Форма от פקד обозначает людей, учтённых при переписи. Субстантивированное «исчисленных» сохраняет значение подсчитанных лиц, а отнесённость к соответствующему племени ясна из контекста; буквальное «у них» по-русски было бы тяжеловесным.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: пятьдесят девять тысяч
  rationale: Еврейская последовательность буквально соответствует «девять и пятьдесят тысяч», но в современном русском числительное естественно передаётся как «пятьдесят девять тысяч» без изменения значения.
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: триста
  rationale: Заключительная часть общего числа передана обычной русской формой «триста»; отдельный союз внутри составного числительного в русском не требуется.
