  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: ru
  text: Знамя стана Рувима должно располагаться с южной стороны, в соответствии со своими воинскими подразделениями[a]; предводителем сынов Рувима будет Елицур, сын Шедеура.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их войскам»; еврейское выражение подчёркивает организованный военный порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: знамя
  rationale: Обозначает опознавательный знак племенного военного стана; «знамя» естественно и точно передаёт смысл в данном контексте.
- source_word: מַחֲנֵה
  choice: стан
  rationale: В контексте расположения Израиля обозначает организованный племенной лагерь; «стан» сохраняет достоинство библейского повествования и понятно современному читателю.
- source_word: תֵּימָנָה
  choice: с южной стороны
  rationale: Форма с направительно-локативным окончанием указывает на место расположения к югу, то есть на южной стороне общего стана.
- source_word: לְצִבְאֹתָם
  choice: по их воинским подразделениям
  rationale: צְבָאוֹת здесь несёт смысл организованных сил или групп, построенных для похода и стоянки; перевод сохраняет военную упорядоченность выражения.
- source_word: וְנָשִׂיא
  choice: предводитель
  rationale: В данном контексте это поставленный глава племени; «предводитель» не придаёт слову монархического оттенка.
- source_word: לִבְנֵי רְאוּבֵן
  choice: сынов Рувима
  rationale: Сохранено еврейское родовое обозначение племени как потомков Рувима.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Елицур, сын Шедеура
  rationale: Использованы традиционно узнаваемые русские формы имён с прямой передачей патронимической конструкции.
