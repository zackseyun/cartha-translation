base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: ru
  text: Рядом с ним станом располагается племя Иссахара, а глава сыновей Иссахара — Нафанаил, сын Цуара.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: расположится станом
  rationale: Субстантивированное причастие обозначает племя, занимающее отведённое ему место в стане; будущее время естественно в русском языке в контексте предписания о расположении лагеря.
- source_word: עָלָיו
  choice: рядом с ним
  rationale: В контексте устройства стана предлог выражает пространственную близость к ранее названному племени Иуды, а не буквальное нахождение «на нём».
- source_word: מַטֵּה
  choice: племя
  rationale: В данном контексте слово обозначает племя, а не жезл или посох.
- source_word: יִשָּׂשכָר
  choice: Иссахар
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: נָשִׂיא
  choice: вождь
  rationale: Слово обозначает признанного главу племени; «вождь» сохраняет общественно-племенной смысл без царских коннотаций слова «князь».
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: сынов Иссахара
  rationale: Сохранено еврейское родовое обозначение потомков Иссахара; сноска поясняет, что речь идёт обо всём племенном сообществе.
- source_word: נְתַנְאֵל
  choice: Нафанаил
  rationale: Использована закрепившаяся русская библейская форма имени.
- source_word: בֶּן צוּעָר
  choice: сын Цуара
  rationale: Стандартная патронимическая конструкция передана естественной русской формой.
