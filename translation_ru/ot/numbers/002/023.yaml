  text: and his company[a], even those numbered from them, was thirty-five thousand four hundred.
translation:
  language: ru
  text: А численность его войска[a], то есть исчисленных среди них, — тридцать пять тысяч четыреста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «ополчение» или «воинское подразделение»; еврейское слово обозначает войско или организованный воинский контингент и в контексте переписи и устройства стана относится к племенному подразделению.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: а его ополчение
  rationale: צָבָא обозначает войско или организованное воинское подразделение. В контексте устройства стана и переписи слово «ополчение» передаёт военную организацию племени, не подразумевая, что в данный момент оно ведёт бой.
- source_word: וּפְקֻדֵיהֶם
  choice: то есть исчисленных из них
  rationale: Форма от פקד относится к поставленным на учёт при переписи. Местоименный суффикс имеет множественное число («их/них»); пояснительный оборот естественно связывает эту группу с последующим итоговым числом.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: тридцать пять тысяч четыреста
  rationale: Точное числовое значение передано в обычном для современного русского языка порядке.
theological_decisions: []
