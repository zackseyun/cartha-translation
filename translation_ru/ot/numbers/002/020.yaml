base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ru
  text: Рядом с ним — племя Манассии[a], а вождь сынов Манассии — Гамалиил, сын Педацура.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возле него — племя Манассии». Еврейское выражение указывает на соседнее место в расположении стана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: Рядом с ним
  rationale: В контексте расположения стана предлог עַל с местоименным суффиксом обозначает соседнее положение, а не власть или нахождение сверху.
- source_word: מַטֵּה
  choice: племя
  rationale: В контексте исчисления и расположения стана слово обозначает колено или племенную единицу, а не буквальный посох.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Традиционная и узнаваемая русская форма личного имени и названия происходящего от него племени.
- source_word: וְנָשִׂיא
  choice: а вождь
  rationale: נָשִׂיא здесь обозначает официального главу племени; «вождь» естественно и ясно передаёт эту роль в повествовании Пятикнижия.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: сынов Манассии
  rationale: Сохранён явно выраженный образ родословного происхождения בְּנֵי; после слова «вождь» русский родительный падеж естественно передаёт принадлежность.
- source_word: גַּמְלִיאֵל
  choice: Гамалиил
  rationale: Устоявшаяся русская библейская передача имени.
- source_word: בֶּן
  choice: сын
  rationale: Обычная передача еврейской патронимической конструкции.
- source_word: פְּדָהצוּר
  choice: Педацур
  rationale: Русская транслитерация имени, отражающая согласный צ как «ц».
