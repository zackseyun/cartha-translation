  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: ru
  text: И колено Неффалима; предводитель сыновей Неффалима — Ахира, сын Енана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  choice: колено
  rationale: В контексте расположения стана в Числах слово обозначает племенное подразделение Израиля, а не буквальный посох; «колено» — закрепившийся и понятный русский библейский эквивалент.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: Здесь имеется в виду признанный глава колена. «Предводитель» передаёт административную роль и не вносит монархического оттенка слова «князь».
- source_word: לִבְנֵי
  choice: сыновей
  rationale: Сохраняет буквальную родовую формулу בני; предлог ל в данном перечне связывает предводителя с соответствующим племенным объединением.
- source_word: נַפְתָּלִי
  choice: Неффалим
  rationale: Традиционная русская форма имени и названия колена.
- source_word: אֲחִירַע
  choice: Ахира
  rationale: Транслитерация собственного имени в форме, принятой в русской библейской традиции.
- source_word: בֶּן
  choice: сын
  rationale: Прямой эквивалент стандартной еврейской патронимической формулы.
- source_word: עֵינָן
  choice: Енан
  rationale: Транслитерация собственного имени в форме, принятой в русской библейской традиции.
