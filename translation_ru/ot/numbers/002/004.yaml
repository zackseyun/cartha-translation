  text: и его ополчение[a], насчитывавшее[b] семьдесят четыре тысячи шестьсот человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войско»; еврейское слово צָבָא имеет военное значение, но здесь обозначает племенное подразделение в устроенном стане.'
