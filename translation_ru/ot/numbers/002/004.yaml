lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: и его ополчение
  rationale: צָבָא имеет военное значение «войско, ополчение», а в контексте расположения стана обозначает организованное племенное подразделение. «Ополчение» естественно передаёт как военный, так и собирательный смысл.
- source_word: וּפְקֻדֵיהֶם
  choice: насчитывавшее
  rationale: Форма от פקד относится к переписи и учёту зачисленных. Русское «насчитывавшее» кратко и естественно вводит итоговое число; различие между местоименным суффиксом множественного числа «их» и согласованием с собирательным «ополчение» пояснено в сноске.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: семьдесят четыре тысячи шестьсот
  rationale: Точное число передано в обычном для современного русского языка порядке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, согласована с характером перечня. Слово «человек» добавлено после числа для естественности русского выражения и ясно подразумевается контекстом военной переписи.
