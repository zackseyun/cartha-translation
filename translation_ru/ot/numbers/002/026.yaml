  text: и его ополчение[a], число исчисленных в нём[b] — шестьдесят две тысячи семьсот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его войско» или «его отряд»; еврейское צָבָא может обозначать войско либо организованное воинское подразделение.'
