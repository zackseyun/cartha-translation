lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: и его ополчение
  rationale: צָבָא обозначает войско или организованный военный отряд. В контексте переписи и расположения стана слово «ополчение» передаёт племенной воинский состав, не подразумевая постоянной профессиональной армии; суффикс 3-го лица мужского рода передан местоимением «его».
- source_word: וּפְקֻדֵיהֶם
  choice: исчисленных среди них
  rationale: Форма от פקד в данном контексте указывает на людей, учтённых при переписи. Родительный оборот связывает названную далее численность с соответствующим племенем; причастие «исчисленных» сохраняет формальную перекличку с языком переписи.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: шестьдесят две тысячи семьсот
  rationale: Точное количество передано в обычном для современного русского языка порядке числительных.
