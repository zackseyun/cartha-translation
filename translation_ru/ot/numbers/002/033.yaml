  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: ru
  text: Но левиты не были исчислены среди сынов Израиля[a], как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно: «детей Израиля». Буквально с еврейского: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Но левиты
  rationale: Союз ו здесь противопоставляет левитов перечисленным ранее итогам исчисления; «но» естественно передаёт этот контраст. «Левиты» — общепринятое русское наименование.
- source_word: לֹא הָתְפָּקְדוּ
  choice: не были исчислены
  rationale: Форма хитпаэль глагола פקד в контексте переписи означает, что левитов не включили в исчисление. Пассивная конструкция сохраняет форму и смысл еврейского текста; «исчислены» уместно в литературном повествовании о переписи.
- source_word: בְּ/תוֹךְ
  choice: среди
  rationale: Предлог указывает на включение в состав более широкой группы; «среди» кратко и естественно передаёт это значение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Так сохраняется буквальный образ еврейского выражения; более идиоматическое «израильтян» указано в сноске.
- source_word: כַּ/אֲשֶׁר
  choice: как
  rationale: Союз вводит соответствие ранее данному повелению и естественно передаётся словом «как».
- source_word: צִוָּה
  choice: повелел
  rationale: Перфект отсылает к уже данному повелению. В русском последовательность событий понятна без специальной формы предпрошедшего времени; «повелел» звучит достойно и естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: При русском управлении глагол «повелеть» адресат повеления ставится в дательном падеже.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет имя и соответствует принятой современной научной передаче, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Оборот «не были исчислены» сохраняет связь с контекстом переписи, а порядок слов «как Яхве повелел Моисею» естественен для русского повествования.
