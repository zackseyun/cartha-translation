translation:
  language: ru
  text: А численность его отряда[a] по переписи[b] — пятьдесят семь тысяч четыреста человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войска» или «подразделения». Еврейское צָבָא здесь может обозначать воинский отряд или организованное подразделение в стане.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди учтённых в нём»; буквально: «его учтённые». Речь идёт о тех, кто был официально учтён при переписи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: А в его отряде
  rationale: צָבָא в контексте переписи и расположения стана обозначает организованное племенное воинское подразделение. «Отряд» естественно звучит по-русски и не создаёт впечатления, будто речь идёт обо всём войске.
- source_word: וּפְקֻדָיו
  choice: по числу учтённых в нём
  rationale: Форма от פקד в формулах переписи указывает на мужчин, официально сосчитанных и внесённых в учёт. Такая передача сохраняет смысл переписи и связь местоименного суффикса с отрядом.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: пятьдесят семь тысяч четыреста человек
  rationale: Число передано в обычном современном русском порядке с сохранением точного значения; «человек» добавлено для естественности и ясно из контекста переписи.
