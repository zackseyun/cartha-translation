lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Всего исчисленных
  rationale: Передаёт итоговое число людей, учтённых при переписи, без добавления отсутствующего здесь слова «мужчин».
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: в стане Рувима
  rationale: Естественно передаёт принадлежность исчисленных к организованной лагерной группе Рувима.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151 450
  rationale: Точно передаёт сумму еврейских числительных; запись цифрами удобна в контексте переписи.
- source_word: לְצִבְאֹתָם
  choice: по их воинским подразделениям
  rationale: צְבָאוֹת здесь обозначает организованные войсковые формирования; вариант сохраняет военный оттенок и понятен современному читателю.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Они выступят вторыми
  rationale: Передаёт место стана в порядке движения; множественное «вторыми» естественно согласуется с подразумеваемыми людьми стана.
