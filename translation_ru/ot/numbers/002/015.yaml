lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: и в его отряде
  rationale: В контексте расположения стана צָבָא обозначает организованное племенное подразделение. «Отряд» передаёт эту организационную и военную окраску, не создавая впечатления, что речь непременно идёт о войске, уже ведущем бой.
- source_word: וּפְקֻדֵיהֶם
  choice: насчитывалось
  rationale: Форма от פקד указывает на прошедших учёт или перепись. Русская конструкция «в его отряде насчитывалось» естественно передаёт итог исчисления; буквальная структура и множественное местоименное окончание отражены в сноске.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: сорок пять тысяч шестьсот пятьдесят
  rationale: Прямое и нормативное русское выражение указанного числительного.
