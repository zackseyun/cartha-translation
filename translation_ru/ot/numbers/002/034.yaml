  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: ru
  text: 'Сыны Израиля исполнили всё, что Яхве повелел Моисею: так они располагались лагерем у своих знамён[a] и так выступали в путь — каждый по своим родам[b], по своему отцовскому дому[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под своими знамёнами».'
    reason: Возможна передача предлога לְ как указания на принадлежность лагерной группы соответствующему знамени.
  - marker: b
    text: 'Или: «по своим родовым группам».'
    reason: Еврейское מִשְׁפָּחָה здесь обозначает подразделение племени, более широкое, чем отдельная семья.
  - marker: c
    text: 'Или: «по дому своих отцов»; то есть по своему родовому дому.'
    reason: Выражение בֵּית אֲבֹתָיו обозначает патрилинейную родовую или хозяйственную единицу; буквальный образ допускает более пояснительный перевод.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: и сделали
  rationale: Глагол עשה подводит итог исполнению предшествующих повелений; «сделали» близко к форме оригинала и естественно по-русски.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальный образ исходного выражения и его традиционно-библейское достоинство; речь идёт о народе Израиля в целом.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё, что
  rationale: Передаёт полноту исполнения без тяжеловесного буквального оборота «согласно всему, что».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: повелел ... Моисею
  rationale: Русское управление с дательным падежом естественно передаёт адресата повеления.
- source_word: כֵּן ... וְכֵן
  choice: так ... и так
  rationale: Сохранён повтор, подчёркивающий точное соответствие действий Израиля Божьему повелению.
- source_word: חָנוּ
  choice: располагались станом
  rationale: Передаёт устройство лагеря и лучше соответствует возвратному, повторяющемуся порядку действий в контексте главы.
- source_word: לְדִגְלֵיהֶם
  choice: при своих знамёнах
  rationale: דגל обозначает знамя организованной лагерной группы; предлог «при» естественно выражает расположение относительно него.
- source_word: נָסָעוּ
  choice: отправлялись в путь
  rationale: Ясно передаёт выступление лагеря и сохраняет параллель с повторяющимся порядком стоянок.
- source_word: אִישׁ
  choice: каждый
  rationale: Передаёт распределительное значение формы без ненужного ограничения словом «мужчина».
- source_word: לְמִשְׁפְּחֹתָיו
  choice: по своему роду
  rationale: В племенной структуре מִשְׁפָּחָה обозначает родовую группу шире отдельной семьи; единственное число по-русски согласуется с распределительным «каждый».
- source_word: עַל בֵּית אֲבֹתָיו
  choice: по дому своих отцов
  rationale: Сохраняет патрилинейный образ еврейского выражения и его связь с родовым устройством Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения, не вводя конфессиональной замены титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксический повтор «так ... и так» сохранён ради акцента оригинала; архаизмы сведены к прозрачному выражению «сыны Израиля» и образу «дом отцов».
