  text: וּ/מַטֵּ֖ה בִּנְיָמִ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י בִנְיָמִ֔ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ru
  text: И колено Вениамина; предводителем сынов Вениамина[a] был Авидан, сын Гидеони.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводителем для сынов Вениамина». Еврейский предлог здесь допускает оба близких по смыслу варианта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: колено
  rationale: В контексте расположения стана в книге Чисел слово обозначает племенное подразделение Израиля, а не буквальный посох. «Колено» — устоявшееся и понятное обозначение израильского племени.
- source_word: בִּנְיָמִן
  choice: Вениамин
  rationale: Имя и название колена переданы в принятой русской библейской форме.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: Здесь имеется в виду признанный глава и представитель колена. «Предводитель» передаёт руководящую роль без царских оттенков слова «князь».
- source_word: לִבְנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Сохранён еврейский способ обозначения потомков и племенной общности. Связь, выраженная предлогом ל, естественно передана родительным падежом, а допустимый оттенок «для сынов» отмечен в сноске.
- source_word: אֲבִידָן
  choice: Авидан
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בֶּן גִּדְעֹנִי
  choice: сын Гидеони
  rationale: Обычная еврейская патронимическая конструкция передана прямо и естественно.
