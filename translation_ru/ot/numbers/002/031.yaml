lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Всего исчисленных
  rationale: Передаёт итоговую формулу переписи и пассивное значение причастия от פקד, не добавляя отсутствующее здесь слово «мужчин».
- source_word: לְמַחֲנֵה דָן
  choice: в стане Дана
  rationale: Естественно передаёт принадлежность исчисленных к лагерной группе колена Дана; «стан» сохраняет контекст походного расположения Израиля.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 157 600
  rationale: Точно передаёт суммарное число в принятой современной цифровой записи.
- source_word: לָאַחֲרֹנָה
  choice: последними
  rationale: Наречное выражение указывает на последнее место стана Дана в порядке движения.
- source_word: יִסְעוּ
  choice: выступят в путь
  rationale: В повествовании о странствии נסע обозначает снятие с места и начало очередного перехода; выбранное выражение ясно и естественно по-русски.
- source_word: לְדִגְלֵיהֶם
  choice: при своих знамёнах
  rationale: Сохраняет образ знамён, вокруг которых были организованы племенные лагерно-походные объединения, и не сводит значение только к предмету или только к группе.
