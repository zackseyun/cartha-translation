  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: ru
  text: Рядом с ним[a] станом располагается племя Асира, а предводитель сынов Асира — Пагиил, сын Охрана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
