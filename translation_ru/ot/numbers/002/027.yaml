lexical_decisions:
- source_word: הַחֹנִים
  choice: расположится станом
  rationale: Причастие от חנה в контексте устройства стана обозначает расположение племени в стане; по-русски форма единственного числа согласована с собирательным существительным «племя».
- source_word: עָלָיו
  choice: рядом с ним
  rationale: В описании расположения стана עַל с местоименным суффиксом указывает на соседнее положение, а не на нахождение сверху; местоимение отсылает к ранее названному стану или племени.
- source_word: מַטֵּה
  choice: племя
  rationale: В контексте переписи и порядка расположения מַטֶּה означает племенную единицу Израиля.
- source_word: אָשֵׁר
  choice: Асир
  rationale: Традиционная русская библейская передача имени и названия племени.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В книге Чисел נָשִׂיא обозначает признанного главу племени; «вождь» точно и понятно передаёт эту роль без династического оттенка слова «князь».
- source_word: לִבְנֵי אָשֵׁר
  choice: сынов Асира
  rationale: Сохранён древнееврейский родовой оборот «сыны Асира», здесь в форме родительного падежа после слова «вождь».
- source_word: פַּגְעִיאֵל
  choice: Пагиил
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בֶּן עָכְרָן
  choice: сын Охрана
  rationale: Прямая и естественная передача патронимической конструкции; имя передано в традиционной русской библейской форме.
