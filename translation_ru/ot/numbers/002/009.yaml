lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: всех исчисленных
  rationale: Передаёт совокупное число людей, учтённых при переписи; «исчисленных» сохраняет официальный оттенок контекста и остаётся понятным в библейском регистре.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: в стане Иуды
  rationale: Предлог выражает принадлежность к лагерному объединению, возглавляемому коленом Иуды; «стан» естественен для походного контекста Чисел.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 186 400
  rationale: Точно передаёт итоговое число; запись цифрами облегчает восприятие переписных данных.
- source_word: לְצִבְאֹתָם
  choice: по их воинским подразделениям
  rationale: צָבָא здесь обозначает организованные группы, построенные для похода и войны; перевод сохраняет военный оттенок, не отождествляя их с современными армейскими частями.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Они выступят первыми
  rationale: נסע в лагерно-походном контексте означает сняться с места и отправиться в путь; «выступят» кратко и естественно передаёт начало движения, а רִאשֹׁנָה — порядок выступления.
