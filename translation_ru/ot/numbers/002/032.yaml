base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: ru
  text: Вот исчисленные среди сынов Израиля по их отеческим домам[a]. Всех исчисленных в станах по их ополчениям[b] было шестьсот три тысячи пятьсот пятьдесят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по домам их предков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по их войскам»; возможны также переводы «по их отрядам» или «по их воинским подразделениям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: исчисленные
  rationale: Форма от פקד в контексте Чис 1–2 обозначает людей, учтённых при переписи для военной организации. «Исчисленные» сохраняет повторяющуюся формулу книги и не добавляет в первом предложении отдельного слова «мужчины», которого в данном стихе нет.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родовой и заветный образ еврейского выражения; в современном литературном русском форма «сыны» уместна в возвышенном библейском регистре.
- source_word: לְבֵית אֲבֹתָם
  choice: по их отеческим домам
  rationale: Передаёт патрилинейную родовую структуру, прямо выраженную в еврейском тексте, и соответствует устойчивой терминологии переписи.
- source_word: הַמַּחֲנֹת
  choice: станах
  rationale: Обозначает организованные племенные лагеря вокруг скинии; «стан» естественен для русского библейского повествования и сохраняет исторический колорит.
- source_word: לְצִבְאֹתָם
  choice: по их ополчениям
  rationale: צבאות здесь означает организованные военно-служебные формирования. «Ополчения» передаёт военную организацию, не создавая впечатления, будто речь обязательно идёт о ведущих бой армиях.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: шестьсот три тысячи пятьсот пятьдесят
  rationale: Число передано словами в той же торжественной форме итоговой переписи, что и в еврейском тексте.
theological_decisions:
- issue: Гендерная отнесённость участников переписи
  choice: В итоговой числовой формуле добавлено «человек», но не нейтрализован контекст военнообязанных мужчин.
  alternative: «мужчин» или безличное «всего насчитано»
  rationale: Сам стих не содержит отдельной лексемы «мужчины», однако непосредственный контекст Чис 1–2 определяет исчисляемых как взрослых мужчин, пригодных к военной службе. «Человек» делает русскую числовую конструкцию естественной, а контекст сохраняет точную референцию без избыточного добавления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Сыны», «отеческие дома», «станы» и «ополчения» сохраняют родовую и военно-организационную образность оригинала, оставаясь понятными из контекста.
