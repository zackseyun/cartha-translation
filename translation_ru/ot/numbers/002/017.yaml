  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: ru
  text: 'Затем среди станов выступит в путь шатёр встречи — стан левитов. Как они располагаются станом, так будут и выступать в путь: каждый на своём месте, по своим знамёнам[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно своим знамёнам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Затем … отправится в путь
  rationale: Глагол נָסַע в контексте передвижения стана означает сняться с места и отправиться дальше; «затем» передаёт последовательность походного порядка.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт конкретное значение אֹהֶל («шатёр») и назначение מוֹעֵד как места встречи, не подменяя исходное выражение позднейшим термином.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: стан левитов
  rationale: Естественно передаёт еврейскую сопряжённую конструкцию и сохраняет обозначение левитов.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: посреди станов
  rationale: בְּתוֹךְ указывает на центральное положение шатра и левитского стана среди остальных подразделений.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Как они располагаются станом, так пусть и выступают в путь
  rationale: Сохранено параллельное соответствие между порядком расположения на стоянке и порядком движения; «выступают в путь» естественно звучит в походном контексте.
- source_word: אִישׁ עַל יָדוֹ
  choice: каждый на своём месте
  rationale: אִישׁ имеет распределительное значение, а идиома עַל יָדוֹ обозначает место или назначенную позицию в строю.
- source_word: לְדִגְלֵיהֶם
  choice: при своих знамёнах
  rationale: דֶּגֶל — знамя, вокруг которого организовано соответствующее подразделение; предлог «при» передаёт принадлежность к походной группе под этим знаменем.
