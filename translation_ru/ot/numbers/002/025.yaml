base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: ru
  text: Знамя стана Дана — на северной стороне, по их ополчениям[a]; предводитель сынов Дана — Ахиезер, сын Аммишаддая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их подразделениям»; также возможно: «по их воинствам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: знамя
  rationale: Обозначает племенное знамя, вокруг которого располагался стан; «знамя» точно и естественно в данном контексте.
- source_word: מַחֲנֵה
  choice: стан
  rationale: В контексте расположения колен вокруг скинии «стан» передаёт организованный лагерь и сохраняет торжественный библейский регистр без архаической неясности.
- source_word: צָפֹנָה
  choice: с северной стороны
  rationale: Направительная форма здесь указывает на место расположения относительно скинии; выражение естественно передаёт пространственный смысл.
- source_word: לְצִבְאֹתָם
  choice: по их ополчениям
  rationale: צָבָא обозначает организованные, учтённые группы, имеющие военный характер. «По их ополчениям» сохраняет этот оттенок; возможен более нейтральный вариант «по их подразделениям».
- source_word: וְנָשִׂיא
  choice: предводитель
  rationale: נָשִׂיא здесь означает признанного главу колена, а не монархического князя; «предводитель» соответствует функции и контексту.
- source_word: לִבְנֵי דָן
  choice: сынов Дана
  rationale: Сохранено формальное родоплеменное обозначение בני דן, буквально «сыны Дана».
- source_word: אֲחִיעֶזֶר
  choice: Ахиезер
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: сын Аммишаддая
  rationale: Патронимическая конструкция передана прямо; имя дано в форме, естественной для русского склонения.
theological_decisions:
- issue: Родоплеменное обозначение בְנֵי דָן
  choice: сыны Дана
  alternative: потомки Дана; данитяне
  rationale: Основной текст сохраняет мужскую родословную формулу источника, не расширяя и не сужая её толкованием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Именная конструкция отражает краткую формульность еврейского текста; тире делает её ясной по-русски. Все маркеры сносок присутствуют в основном тексте.
