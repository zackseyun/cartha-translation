translation:
  language: ru
  text: и его отряд[a], и его исчисленные — пятьдесят четыре тысячи четыреста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и его войско».'
    reason: Слово צָבָא может обозначать организованное воинское подразделение либо войско в более общем смысле.
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: и его отряд
  rationale: צָבָא обозначает войско или организованное воинское подразделение; в контексте расположения племён вокруг стана слово «отряд» естественно передаёт отдельную племенную военную группу. Союз וּ передан как «и», суффикс 3-го лица мужского рода единственного числа — как «его».
- source_word: וּפְקֻדָיו
  choice: а исчисленных в нём
  rationale: Форма от פקד указывает на людей, учтённых при переписи. «Исчисленных» сохраняет связь с подсчётом, не усиливая значение до профессиональных воинов; «в нём» соотносит их с названным отрядом. Второй וּ передан союзом «а», естественно вводящим по-русски итоговое число без устранения соединительной связи.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: пятьдесят четыре тысячи четыреста
  rationale: Точное число передано в обычном для современного русского языка порядке.
