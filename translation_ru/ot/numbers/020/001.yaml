  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: приход сынов Израиля, всего общества, в пустыню Цин в первый месяц; пребывание народа в Кадеше; смерть и погребение Мариам. Повтор «там ... там» сохранён. Неопределённо-личное «её похоронили» семантически передаёт еврейскую пассивную форму, не называя деятеля.'
  naturalness: Перевод звучит естественно для современного литературного русского при уместной умеренной библейской окраске. «Остановился в Кадеше» ясно передаёт пребывание народа в ходе странствий и не утверждает постоянного поселения.
  terminology: «Сыны Израиля», «всё общество», «пустыня Цин», «Кадеш» и «Мариам» последовательны и приемлемы. Сноска к «сынам Израиля» корректно поясняет буквальность выражения и предлагает естественную альтернативу.
