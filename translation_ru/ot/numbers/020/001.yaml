source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: ru
  text: И пришли сыны Израиля[a], всё общество, в пустыню Цин в первом месяце, и народ остановился в Кадеше. Там умерла Мариам, и там её похоронили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальный семейно-национальный оборот еврейского текста; в современном литературном русском выражение понятно, хотя и имеет возвышенно-библейскую окраску.
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: עֵדָה обозначает собранную общину Израиля; «общество» передаёт корпоративный смысл и не добавляет специально культового оттенка.
- source_word: מִדְבַּר צִן
  choice: пустыню Цин
  rationale: «Пустыня» — естественный русский эквивалент מִדְבָּר в данном географическом контексте; название передано как «Цин», отличаясь от созвучного Син.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: в первом месяце
  rationale: Прямо передаёт временное выражение, не уточняя год или название месяца, которых в тексте нет.
- source_word: וַיֵּשֶׁב
  choice: остановился
  rationale: При подлежащем «народ» глагол указывает на пребывание в Кадеше; «остановился» естественно для повествования о пути и не предполагает постоянного поселения.
- source_word: בְּקָדֵשׁ
  choice: в Кадеше
  rationale: Нормальное русское управление для пребывания в населённом месте или местности с таким названием.
- source_word: מִרְיָם
  choice: Мариам
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: וַתָּמָת
  choice: умерла
  rationale: Прямо передаёт нейтральное утверждение еврейского текста без эвфемизма.
- source_word: וַתִּקָּבֵר
  choice: её похоронили
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейский пассив, не называя отсутствующего в тексте деятеля.
- source_word: שָׁם ... שָׁם
  choice: там ... там
  rationale: Повтор сохранён как заметная черта исходного текста.
