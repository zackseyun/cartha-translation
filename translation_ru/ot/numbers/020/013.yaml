  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: ru
  text: Это воды Меривы[a], где сыны Израиля вступили в спор с Яхве, и Он явил среди них Свою святость.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мерива» означает «спор» или «распря».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Он был явлен святым среди них»; возможно также: «и Он явил Свою святость через них».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Это
  rationale: Указательное местоимение вводит отождествление вод с названным местом; русское «Это воды…» естественно передаёт формулу именования.
- source_word: מֵי מְרִיבָה
  choice: воды Меривы
  rationale: מְרִיבָה здесь служит названием места, поэтому оно передано транслитерацией; смысл названия пояснён в сноске.
- source_word: רָבוּ
  choice: вступили в спор
  rationale: Глагол ריב обозначает спор или тяжбу. Это выражение ясно и достойно передаёт направленность спора против Яхве.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет мужскую форму исходного устойчивого этнонимического выражения и его библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַיִּקָּדֵשׁ
  choice: Он явил Свою святость
  rationale: 'Нифаль допускает пассивно-рефлексивный смысл: святость Яхве стала явной. Русская формулировка естественна и не создаёт впечатления, будто люди сделали Бога святым.'
- source_word: בָּם
  choice: среди них
  rationale: Предлог ב с местоименным суффиксом здесь естественно относится к проявлению святости Яхве среди сынов Израиля; возможные «в них» и «через них» сохранены в сноске.
theological_decisions:
- issue: Передача освящения Яхве в заключительной части стиха
  choice: и Он явил среди них Свою святость
  alternative: и Он был явлен святым среди них / и Он явил Свою святость через них
  rationale: Формулировка передаёт проявление или подтверждение Божьей святости в этом событии, не утверждая, что люди придали Богу святость, и сохраняет неоднозначность значения предлога в сноске.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Выбрано формально близкое устойчивое выражение, сохраняющее грамматически мужскую форму оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Сыны Израиля» сохраняет форму оригинала; остальная синтаксическая конструкция остаётся ясной для современного читателя.
