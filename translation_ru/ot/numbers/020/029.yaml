  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: ru
  text: И увидело всё общество, что Аарон умер,[a] и весь дом Израиля оплакивал Аарона тридцать дней.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поняло, что Аарон умер». Еврейское выражение буквально означает «увидело, что Аарон умер», однако глагол «видеть» здесь может включать осознание факта.'
    reason: lexical_alternative
  - marker: b
    text: «Весь дом Израиля» — собирательное выражение, обозначающее весь народ Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидело
  rationale: Сохраняет основное значение ראה и естественную для контекста возможность понимать его как осознание совершившегося факта.
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: עֵדָה обозначает общину народа Израиля; «общество» — традиционное, понятное и уместное в повествовании Пятикнижия соответствие.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что общество увидело или осознало.
- source_word: גָוַע
  choice: умер
  rationale: גוע означает умереть, скончаться; простое «умер» ясно передаёт событие без добавления отсутствующего в тексте образа.
- source_word: וַיִּבְכּוּ
  choice: оплакивал
  rationale: В сочетании с указанием умершего и длительностью בכה естественно передаётся как «оплакивать», сохраняя смысл плача и траура.
- source_word: אֶת אַהֲרֹן
  choice: Аарона
  rationale: При глаголе «оплакивать» имя естественно оформляется как прямое дополнение, соответствующее функции אֵת.
- source_word: שְׁלֹשִׁים יוֹם
  choice: тридцать дней
  rationale: Винительный длительности естественно передаётся без предлога.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: весь дом Израиля
  rationale: Сохраняет корпоративное библейское выражение בֵּית יִשְׂרָאֵל и не упрощает его до «весь Израиль».
