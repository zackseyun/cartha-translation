  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: ru
  text: И не было воды для общины[a], и они собрались против Моисея и Аарона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрания», «народа». Еврейское слово עֵדָה обозначает собранный вместе народ Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: И не было
  rationale: Сохраняет простой повествовательный союз וְ и естественно передаёт экзистенциальную конструкцию היה с отрицанием.
- source_word: מַיִם
  choice: воды
  rationale: Еврейская форма обозначает вещество; в русской отрицательной конструкции естествен родительный падеж единственного числа массового существительного.
- source_word: לָ/עֵדָה
  choice: для общины
  rationale: עֵדָה обозначает собранный народ Израиля как единое сообщество; «община» ясно и естественно передаёт этот корпоративный смысл.
- source_word: וַ/יִּקָּהֲלוּ
  choice: и они собрались
  rationale: Глагол קהל означает собраться вместе; русская формулировка сохраняет коллективное действие и повествовательную последовательность.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: против Моисея и Аарона
  rationale: В контексте последующего спора עַל выражает направленную против руководителей оппозицию. Один предлог при однородных членах естествен для русского языка и относится к обоим именам.
