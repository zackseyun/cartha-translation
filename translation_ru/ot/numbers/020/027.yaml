source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: ru
  text: Моисей поступил так, как повелел Яхве, и они поднялись на гору Ор на глазах у всего общества.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед глазами всего общества», то есть открыто, на виду у всего собравшегося народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: поступил
  rationale: В сочетании с כַּאֲשֶׁר צִוָּה глагол выражает исполнение Моисеем повеления; «поступил так, как» естественно передаёт еврейскую повествовательную формулу без добавления нового содержания.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Оборот прямо соотносит поступок Моисея с данным ему повелением и естественно звучит по-русски.
- source_word: צִוָּה
  choice: повелел
  rationale: Передаёт властный характер צוה и соответствует достоинству библейского повествования, не смягчая его до простого наставления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיַּעֲלוּ
  choice: они поднялись
  rationale: Сохраняет множественное число и обычное значение עלה — движение вверх, здесь на гору.
- source_word: אֶל הֹר הָהָר
  choice: на гору Ор
  rationale: Естественная русская форма географического названия; предлог «на» соответствует движению на гору.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Сохраняет образ зрения и ясно выражает, что действие происходило открыто перед собравшимися.
- source_word: כָּל הָעֵדָה
  choice: всего общества
  rationale: עֵדָה обозначает общину Израиля как собранный народ; «общество» — традиционно уместное и понятное обозначение этой общины в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Формула «поступил так, как повелел» естественна и близка структуре оригинала; местоимение «они» сохранено без поясняющей вставки, как в еврейском тексте.
