  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: ru
  text: Моисей снял с Аарона его одежды и одел в них Елеазара, сына Аарона[a]. Там, на вершине горы[b], умер Аарон. Затем Моисей и Елеазар спустились с горы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Речь идёт об официальных священнических одеждах Аарона: их передача Елеазару обозначала переход к нему первосвященнического служения, как видно из контекста.'
    reason: cultural_note
  - marker: b
    text: 'Или: «на самом верху горы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: снял с Аарона
  rationale: Гифиль глагола פשט означает снять одежду с кого-либо. Русская конструкция «снял с Аарона» точно и естественно передаёт направленность действия.
- source_word: בְּגָדָיו
  choice: его одежды
  rationale: בגד — общее обозначение одежды. Слово «одежды» сохраняет торжественный библейский регистр и не добавляет в основной текст определения «священнические», хотя оно ясно из контекста.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: надел их на его сына Елеазара
  rationale: Гифиль לבש означает одеть кого-либо, надеть на него одежду. Формулировка естественна по-русски и ясно соотносит местоимение «их» с одеждами Аарона.
- source_word: וַיָּמָת
  choice: умер
  rationale: Обычное и прямое соответствие глаголу מות без эвфемизма.
- source_word: שָׁם
  choice: там
  rationale: Наречие места сохранено явно, как в еврейском тексте.
- source_word: בְּרֹאשׁ הָהָר
  choice: на вершине горы
  rationale: רֹאשׁ буквально значит «голова», а применительно к горе — «вершина». Это точная и естественная русская передача.
- source_word: וַיֵּרֶד
  choice: спустились
  rationale: Форма единственного числа стоит перед составным подлежащим «Моисей и Елеазар», что обычно для библейского иврита; по нормам современного русского употреблено множественное число.
- source_word: מִן הָהָר
  choice: с горы
  rationale: Краткое и идиоматичное русское соответствие исходной предложной конструкции.
theological_decisions:
- issue: Характер одежд, переданных от Аарона Елеазару
  choice: В основном тексте — «его одежды» без добавления «священнические»
  alternative: «его священнические одежды» или «его облачения»
  rationale: Контекст указывает на официальные священнические одежды и передачу служения преемнику, однако сам стих употребляет общее слово בְּגָדָיו. Поэтому уточнение вынесено в примечание, чтобы не добавлять к основному тексту того, что не выражено лексически.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Сохранены повтор имени Аарон и явное «там»; синтаксис слегка адаптирован к нормам русского языка. Маркеры всех примечаний помещены в основной текст.
