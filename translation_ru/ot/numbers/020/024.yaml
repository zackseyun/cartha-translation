source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: ru
  text: Аарон будет присоединён к своему народу[a], потому что он не войдёт в землю, которую Я дал сынам Израиля[b], за то, что вы восстали против Моего повеления[c] у вод Меривы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейский оборот о смерти: Аарон умрёт, будучи присоединён к своему народу. Сам по себе он не уточняет подробностей посмертного состояния.'
    reason: Пояснение древнееврейской идиомы смерти без устранения её образности.
  - marker: b
    text: 'Или более привычно: «израильтянам» либо «народу Израиля». Буквально: «сынам Израиля».'
    reason: Пояснение формульного этнонима и его собирательного значения.
  - marker: c
    text: 'Буквально: «против Моих уст», то есть против высказанного Мною повеления.'
    reason: Сохранение буквального образа, переданного в основном тексте по смыслу.
lexical_decisions:
- source_word: יֵאָסֵף אֶל־עַמָּיו
  choice: будет приобщён к своему народу
  rationale: Сохранён древнееврейский пассивный оборот о смерти и принадлежности к своему народу. Формулировка передаёт торжественный тон, не сводя выражение к простому «умрёт» и не уточняя, кого именно подразумевает «народ».
- source_word: כִּי לֹא יָבֹא אֶל־הָאָרֶץ
  choice: потому что он не войдёт в землю
  rationale: «Войти в землю» естественно передаёт глагол движения с предлогом и сохраняет характерное обозначение данной Богом земли без добавления слова «обетованную».
- source_word: אֲשֶׁר נָתַתִּי
  choice: которую Я дал
  rationale: Перфект передан завершённым дарованием; это сохраняет уверенность в действительности Божьего дара, хотя Аарон в землю не войдёт.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранена буквальная и формульная структура древнееврейского этнонима; примечание поясняет его обычное собирательное значение.
- source_word: מְרִיתֶם
  choice: вы восстали
  rationale: Глагол מרה обозначает непокорность и мятеж против власти; «восстали» сохраняет нравственную серьёзность обвинения и форму множественного числа.
- source_word: אֶת־פִּי
  choice: против Моего повеления
  rationale: Буквально выражение означает «против Моих уст», но в данном контексте «уста» обозначают высказанное Богом повеление. Основной текст передаёт смысл, а буквальный образ сохранён в примечании.
- source_word: לְמֵי מְרִיבָה
  choice: у вод Меривы
  rationale: Сохранено собственное название места и события; предлог «у» естественно обозначает место совершённого проступка.
theological_decisions:
- issue: Оборот о смерти «быть приобщённым к своему народу»
  choice: Сохранить образный оборот, не заменяя его словом «умрёт»
  alternative: Аарон умрёт
  rationale: Древнееврейская формула выражает не только факт смерти, но и связь умершего с его народом. При этом перевод не развивает из неё определённого учения о посмертном состоянии.
- issue: Значение выражения «сыны Израиля»
  choice: Сохранить формулу «сынам Израиля» в основном тексте
  alternative: израильтянам; народу Израиля
  rationale: Так передаётся форма исходного текста, тогда как примечание поясняет, что речь идёт обо всём народе, а не исключительно о мужчинах.
- issue: Объект непокорности в выражении «против Моих уст»
  choice: Передать функциональный смысл как «против Моего повеления»
  alternative: против Моих уст; против Моего слова
  rationale: В контексте Божьи «уста» метонимически означают произнесённое повеление. Такой перевод ясен современному читателю, а примечание сохраняет буквальный образ.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Древнееврейский оборот о смерти сохранён в умеренно формальном виде; устаревшее «приложится» не использовано. Повтор причинных связей передан сочетанием «потому что» и «за то, что». Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы.
