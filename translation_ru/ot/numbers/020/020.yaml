  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: ru
  text: 'Но он ответил: «Ты не пройдёшь». И Эдом вышел навстречу Израилю[a] с многочисленным войском[b] и с сильной рукой[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Израиля». Само еврейское выражение означает движение навстречу; в данном контексте оно подразумевает враждебное противостояние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с тяжёлым народом», то есть с многочисленной или внушительной группой людей.'
    reason: lexical_alternative
  - marker: c
    text: 'То есть с большой силой и мощью; возможно также: «с могучей рукой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но он ответил
  rationale: Последовательный нарративный глагол вводит реплику Эдома; союз «но» естественно передаёт контекстуальное противопоставление просьбе Израиля, а «ответил» по-русски уместно в диалоге.
- source_word: לֹא תַעֲבֹר
  choice: Ты не пройдёшь
  rationale: Имперфект выражает твёрдый запрет или отказ. Эта формулировка сохраняет категоричность и прямоту речи.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: И Эдом выступил
  rationale: Глагол יצא означает «выйти». В данном военном контексте «выступил» естественно передаёт организованный выход навстречу, не уточняя сверх текста способ передвижения.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: Оборот сам по себе означает движение навстречу и лексически нейтрален, хотя контекст показывает враждебное противостояние.
- source_word: בְּעַם כָּבֵד
  choice: с многочисленным войском
  rationale: Буквально «с тяжёлым народом»; כבד здесь указывает на многочисленность или внушительность собранных людей. Военный контекст позволяет естественное «войско».
- source_word: וּבְיָד חֲזָקָה
  choice: и с сильной рукой
  rationale: Сохранён образный еврейский оборот, обозначающий силу и мощь, без сведения его только к оружию или численности.
