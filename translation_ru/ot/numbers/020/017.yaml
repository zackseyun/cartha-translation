source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: ru
  text: «Позволь нам пройти через твою землю. Мы не пойдём ни по полям, ни по виноградникам и не будем пить воду из колодцев. Мы пойдём царской дорогой[a] и не свернём ни вправо, ни влево, пока не выйдем за пределы твоей земли[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дорогой царя»; возможно также: «царским трактом».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пока не пройдём твою границу (или территорию)».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Позволь нам пройти
  rationale: Когортатив с частицей נָא выражает вежливую просьбу; выбранная формулировка естественно передаёт и просьбу, и желательное действие.
- source_word: בְאַרְצֶךָ
  choice: через твою землю
  rationale: При глаголе עבר предлог ב обозначает движение через территорию; «земля» прямо передаёт אֶרֶץ.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Мы не пойдём ни по полям, ни по виноградникам
  rationale: Еврейские существительные стоят в единственном числе с собирательным значением. Русское множественное число ясно передаёт обещание не заходить на возделываемые участки.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: и не будем пить воду из колодцев
  rationale: Буквально говорится о «воде колодца»; множественное число по-русски естественно передаёт общее обещание не пользоваться местными колодцами.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: царской дорогой
  rationale: Буквально «дорогой царя»; выражение обозначает признанный главный путь и не требует уточнения, какому именно царю он принадлежал.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: не свернём ни вправо, ни влево
  rationale: Сохраняется еврейская парная формула, означающая, что путники не будут отклоняться от дороги.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: пока не выйдем за пределы твоей земли
  rationale: В контексте речь идёт не просто о пересечении пограничной линии при входе, а о завершении прохода через владения адресата. «Пределы» передаёт территориальный оттенок גְּבוּל.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным тоном. Повтор обещаний сохранён; собирательные единственные числа переданы естественным для русского языка множественным числом.
