  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: ru
  text: 'Народ вступил в спор с Моисеем и сказал: «О, если бы мы погибли, когда погибли наши братья перед Яхве![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О, если бы мы погибли, как погибли наши братья перед Яхве!»'
    reason: Предлог בְּ при инфинитиве בִּגְוַע допускает временное («когда») и сравнительно-обстоятельственное («как») понимание.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: стал спорить
  rationale: Глагол ריב обозначает спор или тяжбу. «Стал спорить» естественно по-русски передаёт открытое противостояние, не ослабляя его до простой жалобы.
- source_word: הָעָם
  choice: народ
  rationale: עם здесь обозначает израильский народ в целом; это наиболее прямой и естественный русский эквивалент.
- source_word: עִם מֹשֶׁה
  choice: с Моисеем
  rationale: Предлог עִם обычно значит «с»; в сочетании «спорить с Моисеем» враждебная направленность ясна без усиления до «против».
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: и говорил
  rationale: Обычная древнееврейская формула введения прямой речи передана без буквального удвоения «сказали, говоря». Собирательное «народ» требует в русском единственного числа.
- source_word: וְלוּ
  choice: О, если бы и
  rationale: לו выражает сильное пожелание или скорбное сожаление. «О, если бы» сохраняет эмоциональность, а «и» передаёт присоединительный оттенок וְ и желание разделить участь погибших.
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: мы погибли ... погибли
  rationale: Повтор одного русского корня отражает повтор древнееврейского גוע. «Погибли» передаёт не просто факт смерти, но трагический тон сетования.
- source_word: אַחֵינוּ
  choice: наши братья
  rationale: Форма мужского рода множественного числа буквально означает «наши братья» и в контексте может обозначать соплеменников; гендерная форма источника сохранена.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии», а личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя יהוה. Транслитерация «Яхве» отличает его от титула «Господь» и не привносит конфессионального толкования.
- issue: Кого обозначает אַחֵינוּ
  choice: наши братья
  alternative: наши соплеменники
  rationale: Буквальная форма «братья» сохраняет грамматический род и родственную образность источника, не исключая контекстуального значения «соплеменники».
- issue: Характер смерти перед Яхве
  choice: погибли перед Яхве
  alternative: были умерщвлены Яхве
  rationale: Текст говорит, что смерть произошла «перед Яхве», но прямо не называет Яхве действующим лицом; перевод не уточняет причинность, сохраняя богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Повтор «погибли» намеренно сохраняет лексический повтор источника; «перед Яхве» звучит ясно и не архаично.
