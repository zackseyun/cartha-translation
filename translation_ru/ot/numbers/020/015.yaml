  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: ru
  text: Наши отцы сошли в Египет[a], и мы жили в Египте много дней[b]. Египтяне плохо обращались с нами и нашими отцами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши предки»; еврейское выражение в обоих случаях буквально означает «наши отцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «много дней» — то есть долгое время.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «причиняли нам и нашим отцам зло»; также возможно: «угнетали нас и наших отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: сошли
  rationale: Сохраняет обычное для еврейского текста представление о движении «вниз» в Египет и звучит естественно в библейском повествовании.
- source_word: אֲבֹתֵינוּ
  choice: наши отцы
  rationale: Буквально передаёт אָבוֹת и сохраняет семейно-исторический строй речи; по контексту речь идёт о предках.
- source_word: מִצְרַיְמָה
  choice: в Египет
  rationale: Направительный суффикс указывает на движение к месту; по-русски естественно «в Египет».
- source_word: וַנֵּשֶׁב
  choice: мы жили
  rationale: ישב здесь обозначает пребывание и проживание; это ясный современный эквивалент без архаизации.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Сохраняет буквальный образ еврейского выражения, которое идиоматически означает длительный период, не уточняя его как «годы».
- source_word: וַיָּרֵעוּ
  choice: причиняли зло
  rationale: Передаёт широкий нравственно-негативный смысл хифиля רעע — делать зло или причинять вред — и не сужает его до одного вида притеснения.
- source_word: מִצְרַיִם
  choice: египтяне
  rationale: Хотя форма буквально означает «Египет», множественное число сказуемого показывает, что имеются в виду жители Египта.
- source_word: לָנוּ
  choice: нам
  rationale: Сохраняет конструкцию с ל, обозначающую тех, кому причиняется зло.
- source_word: וְלַאֲבֹתֵינוּ
  choice: и нашим отцам
  rationale: Сохраняет повтор исходного существительного и подчёркивает, что зло было причинено как говорящему народу, так и его предкам.
