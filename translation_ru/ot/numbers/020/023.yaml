  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: ru
  text: 'И сказал Яхве[a] Моисею и Аарону на горе Ор, на границе земли Эдома:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); общепринятая научная передача — «Яхве», традиционная — «Господь».
    reason: Уточняет форму и традиционные способы передачи тетраграмматона.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычное значение глагола אמר; естественно вводит последующую прямую речь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, обозначенное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно передаёт адресатов речи; повтор предлога אֶל не требует неестественного дублирования в русском.
- source_word: בְּהֹר הָהָר
  choice: у горы Ор
  rationale: ב имеет локативное значение; «у горы Ор» естественно обозначает место события, не утверждая сверх текста, что собеседники уже находились на вершине или склоне.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: на границе земли Эдома
  rationale: Прямо и естественно передаёт географическое положение у рубежа территории Эдома.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русской повествовательной речи функцию еврейской формулы введения цитаты естественно выполняет двоеточие; буквальное «говоря» после «сказал» было бы тяжеловесным повтором.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. Форма «Яхве» сохраняет его как имя и не подменяет титулом; огласовка имени не вполне достоверна, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет связь стиха с предшествующим рассказом. Двоеточие естественно вводит речь, продолжающуюся в следующем стихе.
