  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: ru
  text: Моисей и Аарон отошли от собрания[a] ко входу в Шатёр встречи, пали ниц, и им явилась слава Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица собрания», то есть из присутствия собравшихся людей.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: отошли… ко входу
  rationale: בוא обозначает движение к указанному месту; в сочетании с מִפְּנֵי הַקָּהָל контекстуально речь идёт об уходе от собравшихся ко входу в шатёр.
- source_word: מִפְּנֵי הַקָּהָל
  choice: от собрания
  rationale: Буквально «от лица/из присутствия собрания»; современная русская формулировка естественно передаёт удаление от собравшегося народа, а буквальный образ отмечен в сноске.
- source_word: הַקָּהָל
  choice: собрание
  rationale: קהל означает собравшуюся общину; «собрание» сохраняет коллективный смысл и не вносит церковной окраски.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: вход в Шатёр встречи
  rationale: פתח — вход или проём; אהל מועד — установленное обозначение священного шатра, места встречи Бога с Израилем.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: пали ниц
  rationale: Краткое и достойное русское соответствие буквальному «пали на свои лица», передающее телесную позу смирения и мольбы.
- source_word: וַיֵּרָא
  choice: явилась
  rationale: Нифаль глагола ראה здесь обозначает видимое явление; согласование с существительным «слава» требует женской формы.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: כבוד здесь обозначает явленное Божье величие и присутствие; личное имя יהוה передано транслитерацией «Яхве».
- source_word: אֲלֵיהֶם
  choice: им
  rationale: Предлог אל направляет явление к Моисею и Аарону; «им явилась» естественно передаёт это по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Характер «славы»
  choice: слава Яхве явилась
  alternative: Яхве явился во славе
  rationale: Подлежащим в тексте является כְבוֹד («слава»). Выбранный вариант не отождествляет грамматически славу с иной формулировкой и сохраняет образ видимого богоявления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пали ниц» сохраняет достоинство и краткость исходного оборота; название «Шатёр встречи» оформлено как устойчивое обозначение святилища.
