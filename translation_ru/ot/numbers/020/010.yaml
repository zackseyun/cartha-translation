base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: ru
  text: 'Моисей и Аарон собрали общину перед скалой, и он сказал им: «Послушайте же, мятежники! Неужели мы извлечём[a] для вас воду из этой скалы?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «выведем».'
    reason: Глагол в каузативной форме буквально означает «вывести, заставить выйти»; в основном тексте употреблено более естественное применительно к воде «извлечём».
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: собрали
  rationale: Каузативная форма глагола קהל означает «сделали так, чтобы собрались»; «собрали» естественно передаёт это значение по-русски.
- source_word: הַקָּהָל
  choice: общину
  rationale: קָהָל обозначает собравшееся сообщество народа. «Община» естественнее буквального «собрание» в данном повествовательном контексте и не вносит специфически церковного смысла.
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: перед скалой
  rationale: Идиома означает нахождение непосредственно перед объектом; выбран краткий и естественный русский оборот.
- source_word: וַיֹּאמֶר
  choice: он сказал
  rationale: В еврейском тексте глагол стоит в единственном числе после составного подлежащего «Моисей и Аарон». Местоимение сохраняет форму источника, не подменяя её явным именем.
- source_word: שִׁמְעוּ נָא
  choice: Послушайте же
  rationale: Императив передан прямо, а частица נָא — усилительной русской частицей «же», уместной в резком призыве к вниманию.
- source_word: הַמֹּרִים
  choice: мятежники
  rationale: Субстантивированное причастие от מרה характеризует адресатов как противящихся и восстающих; «мятежники» сохраняет прямоту упрёка и достоинство регистра.
- source_word: נוֹצִיא
  choice: мы извлечём
  rationale: Каузатив от יצא буквально выражает выведение чего-либо наружу. «Извлечём» естественно описывает появление воды из скалы, сохраняя первое лицо множественного числа.
- source_word: מָיִם
  choice: воду
  rationale: Обычное русское соответствие существительному מַיִם; форма единственного числа требуется русской нормой.
theological_decisions:
- issue: Первое лицо множественного числа в вопросе Моисея
  choice: Неужели мы извлечём для вас воду
  alternative: Неужели Бог даст вам воду
  rationale: Форма נוֹצִיא прямо означает «мы выведем/извлечём». Перевод сохраняет напряжение между словами Моисея и Божьим действием, не снимая его поясняющим перефразированием.
- issue: Риторический характер вопроса
  choice: Неужели мы извлечём
  alternative: Должны ли мы извлечь
  rationale: Вопросительная частица הֲ не задаёт сама по себе модального значения обязанности. «Неужели» естественно передаёт эмоционально окрашенный риторический вопрос, не добавляя слова «должны».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика звучит резко и эмоционально, но без архаизмов; синтаксическая неоднозначность местоимения «он» и богословски значимое «мы» сохранены.
