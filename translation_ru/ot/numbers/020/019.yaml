base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: ru
  text: 'И сказали ему сыны Израиля[a]: «Мы пойдём[b] по большой дороге[c]. Если будем пить твою воду — я и мой скот, — я заплачу за неё. Только позволь мне пройти пешком[d] — и ничего больше».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднимемся». В данном контексте речь идёт о движении по дороге через землю Эдома.'
    reason: literal_rendering
  - marker: c
    text: 'Или: «по главной дороге». Еврейское слово может обозначать устроенную или приподнятую дорогу.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «своими ногами пройду» — выражение, обозначающее простой проход через землю.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет форму еврейского выражения и его торжественное звучание; более обычный современный эквивалент «израильтяне» указан в примечании.
- source_word: בַּמְסִלָּה
  choice: по большой дороге
  rationale: מְסִלָּה обозначает устроенную, заметную дорогу, нередко приподнятую или главную; русский предлог «по» естественно передаёт движение по её полотну.
- source_word: נַעֲלֶה
  choice: мы пойдём
  rationale: Буквально глагол означает «поднимемся», однако здесь описывает движение по дороге через территорию. Основной текст передаёт контекстуальный смысл, а буквальное значение сохранено в примечании.
- source_word: מֵימֶיךָ
  choice: твою воду
  rationale: Еврейское слово «вода» имеет форму множественного числа, но в русском языке здесь естественно единственное число.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: будем пить твою воду — я и мой скот
  rationale: Сохраняет форму первого лица множественного числа и последующее пояснение «я и мой скот», не сглаживая необычный переход от коллективной речи к речи представителя в единственном числе.
- source_word: וְנָתַתִּי מִכְרָם
  choice: я заплачу за неё
  rationale: מֶכֶר здесь означает цену или плату; местоименный суффикс по смыслу относится к выпитой воде.
- source_word: רַק אֵין דָּבָר
  choice: и ничего больше
  rationale: Идиоматическое выражение ограничивает просьбу простым проходом и подчёркивает отсутствие дополнительных требований.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: позволь мне пройти пешком
  rationale: Буквальное упоминание ног образует идиому обычного прохода; побудительно-желательная форма глагола естественно передана словом «позволь».
