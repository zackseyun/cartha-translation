  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: ru
  text: Но Эдом отказался пропустить Израиль через его территорию, и Израиль повернул прочь от него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: отказался
  rationale: Глагол מאן выражает отказ или нежелание; «отказался» естественно и точно передаёт решительное отрицание разрешения в повествовательном контексте.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Передано традиционной русской формой географического и национального имени.
- source_word: נְתֹן אֶת יִשְׂרָאֵל עֲבֹר
  choice: пропустить Израиль
  rationale: Сочетание נתן с последующим עבר в данном контексте означает позволить Израилю пройти; русский глагол «пропустить» кратко и естественно выражает разрешение на проход.
- source_word: בִּגְבֻלוֹ
  choice: через свои владения
  rationale: גְּבוּל может обозначать границу, область в её пределах или территорию. Здесь речь идёт о проходе по земле Эдома, поэтому «владения» передаёт контекстуальный смысл и сохраняет естественный русский стиль.
- source_word: וַיֵּט
  choice: свернул в сторону
  rationale: נטה означает отклониться, отвернуть или свернуть. Формулировка передаёт изменение маршрута Израиля, не добавляя идеи бегства или поражения.
- source_word: מֵעָלָיו
  choice: от него
  rationale: Идиоматическое сочетание указывает на удаление от Эдома; с глаголом «свернул в сторону» естественно передаётся как «от него».
