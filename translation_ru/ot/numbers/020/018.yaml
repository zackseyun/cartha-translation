source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑/י פֶּן בַּ/חֶ֖רֶב אֵצֵ֥א לִ/קְרָאתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: ru
  text: 'Но Эдом ответил ему: «Не проходи через мою землю[a], иначе я выступлю против тебя с мечом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через меня». Эдом говорит о себе как о народе и территории, то есть запрещает проход через свою землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выйду навстречу тебе с мечом». В этом контексте речь идёт о вооружённом противостоянии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ответил
  rationale: Глагол אמר буквально означает «сказал», но в данном диалоге естественное русское «ответил» точно передаёт повествовательную функцию реплики.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог אֶל с местоименным суффиксом указывает на адресата речи; в контексте это представитель Израиля.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Собственное имя народа и его земли передано принятой русской транслитерацией.
- source_word: לֹא תַעֲבֹר
  choice: не проходи
  rationale: Форма 2-го лица единственного числа выражает прямой запрет; по-русски повелительное «не проходи» звучит естественно и сохраняет категоричность отказа.
- source_word: בִּי
  choice: через мою землю
  rationale: Буквально «через меня»; поскольку Эдом олицетворённо говорит как народ и территория, речь идёт о проходе через его землю.
- source_word: פֶּן
  choice: иначе
  rationale: В данном предупреждении частица вводит угрожающее последствие; современное русское «иначе» передаёт эту функцию яснее, чем более книжное «как бы не».
- source_word: בַּחֶרֶב
  choice: с мечом
  rationale: Оборот обозначает вооружённое выступление; буквальный образ меча сохранён.
- source_word: אֵצֵא
  choice: я выступлю
  rationale: Глагол יצא буквально значит «выйду»; в контексте военной угрозы «выступлю» естественно передаёт выход навстречу противнику.
- source_word: לִקְרָאתֶךָ
  choice: против тебя
  rationale: Буквально «навстречу тебе», но контекст и упоминание меча придают встрече явно враждебный характер; этот оттенок вынесен в основной текст, а буквальное значение отмечено в сноске.
