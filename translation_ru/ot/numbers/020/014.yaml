  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: ru
  text: 'И послал Моисей из Кадеса послов к царю Эдома: «Так говорит твой брат Израиль[a]: ты знаешь все тяготы[b], постигшие нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой родич Израиль». Слова «твой брат» напоминают о родстве Эдома и Израиля, восходящих к Исаву и Иакову.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всю тяготу, которая нашла нас»; то есть все беды, постигшие нас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное и естественное русское «И послал» сохраняет связь с предшествующим контекстом.
- source_word: מַלְאָכִים
  choice: послов
  rationale: В дипломатическом контексте речь идёт о людях, направленных с посланием. «Послы» естественнее здесь, чем более общее «вестники», и не допускает значения небесных существ.
- source_word: מִקָּדֵשׁ
  choice: из Кадеса
  rationale: Передано именно краткое название места, стоящее в еврейском тексте, без добавления «Кадес-Варни».
- source_word: מֶלֶךְ אֱדוֹם
  choice: к царю Эдома
  rationale: Прямое и естественное соответствие еврейскому сопряжённому сочетанию.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула передачи послания; настоящее время соответствует словам, которые послы произносят от имени отправителя.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: твой брат Израиль
  rationale: Сохранён буквальный образ родства, намеренно связывающий Израиль и Эдом через их предков.
- source_word: אַתָּה יָדַעְתָּ
  choice: ты знаешь
  rationale: Перфект выражает наличное знание; отдельное местоимение передано для сохранения лёгкого смыслового акцента.
- source_word: כָּל הַתְּלָאָה
  choice: обо всех тяготах
  rationale: «Тяготы» естественно обозначают совокупность пережитых лишений и бедствий; множественное число по-русски идиоматично передаёт собирательное значение еврейского единственного числа.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: постигших нас
  rationale: Русский глагол «постигнуть» точно и естественно передаёт идиому, буквально говорящую о беде, которая «нашла» людей.
theological_decisions:
- issue: Родственный язык об Израиле и Эдоме
  choice: твой брат Израиль
  alternative: твой родич Израиль
  rationale: Прямое обозначение «брат» сохраняет заложенный в обращении призыв к родству народов и не ослабляет семейную метафору.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Дипломатическая формула сохранена, а тяжеловесная буквальность еврейской идиомы вынесена в примечание.
