base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: ru
  text: Тогда Моисей поднял руку и дважды ударил по скале своим посохом. Хлынуло много воды, и община, и их скот пили воду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם מֹשֶׁה אֶת־יָדוֹ
  choice: Моисей поднял руку
  rationale: Прямо передаёт физическое действие, сохраняя естественный для современного русского повествования порядок слов.
- source_word: וַיַּךְ אֶת־הַסֶּלַע
  choice: ударил по скале
  rationale: Глагол נכה означает «ударить», а русское управление «ударить по скале» звучит естественно и точно.
- source_word: בְּמַטֵּהוּ
  choice: своим посохом
  rationale: מַטֶּה здесь обозначает посох Моисея; «посох» современно, ясно и соответствует контексту.
- source_word: פַּעֲמָיִם
  choice: дважды
  rationale: Точная и идиоматичная передача двойственного наречного значения.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Хлынуло много воды
  rationale: Речь идёт о выходе большого количества воды. «Хлынуло» естественно передаёт обильный выход воды, не добавляя сверхъестественных подробностей сверх контекста.
- source_word: הָעֵדָה
  choice: община
  rationale: עֵדָה обозначает собравшееся общество Израиля; «община» понятно современному читателю и сохраняет коллективный смысл.
- source_word: וּבְעִירָם
  choice: вместе со своим скотом
  rationale: בְּעִירָם охватывает домашних животных общины. «Скот» достаточно широко и естественно в данном контексте.
theological_decisions:
- issue: Оценка поступка Моисея при ударе по скале
  choice: 'Оставить нейтральное повествовательное описание: «дважды ударил по скале своим посохом».'
  alternative: Внести в строку явное указание на непослушание Моисея.
  rationale: Сам стих описывает действие и его результат, тогда как его богословская оценка даётся ближайшим контекстом. Перевод не должен заранее встраивать эту оценку в формулировку стиха.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Краткие предложения передают последовательность действий и избегают архаизмов.
