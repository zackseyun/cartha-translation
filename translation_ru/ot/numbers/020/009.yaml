id: NUM.20.9
reference: Numbers 20:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: ru
  text: И Моисей взял посох[a], находившийся перед Яхве, как Он и повелел ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл».'
    reason: Лексема מַטֶּה допускает оба значения; «жезл» — традиционная и контекстуально возможная передача.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Форма Qal wayyiqtol от לקח обозначает последовательное повествовательное действие; «взял» точно и естественно передаёт её без добавочного оттенка.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени מֹשֶׁה.
- source_word: הַמַּטֶּה
  choice: посох
  rationale: מַטֶּה может означать «посох» или «жезл»; в данном контексте речь идёт о конкретном предмете, и «посох» наиболее понятен современному читателю.
- source_word: מִלִּפְנֵי
  choice: находившийся перед
  rationale: Оборот выражает исходное местонахождение предмета «перед Яхве». Причастная конструкция естественно передаёт пространственный смысл по-русски, не вводя абстрактного понятия присутствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כַּאֲשֶׁר
  choice: как … и
  rationale: Русская конструкция «как … и» естественно выражает точное соответствие ранее данному повелению.
- source_word: צִוָּהוּ
  choice: Он … повелел ему
  rationale: Глагол означает «повелел ему»; прописная буква в местоимении показывает, что подразумеваемый субъект — Яхве, без повторения имени, которого нет в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Субъект глагола צִוָּהוּ
  choice: Он (Яхве) повелел Моисею
  alternative: он повелел ему — без указания референта прописной буквой
  rationale: Грамматический субъект выражен только формой глагола и определяется из контекста как Яхве. Местоимение сохраняет эту неявность, а прописная буква помогает русскому читателю распознать референт.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет повествовательную связь wayyiqtol. Формулировка избегает архаичного «от лица Яхве» и излишне пояснительного «из присутствия Яхве».
