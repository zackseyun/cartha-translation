source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: ru
  text: «Возьми посох[a] и собери общину — ты и твой брат Аарон. На глазах у них скажите скале, и она даст свою воду. Выведи для них воду из скалы и напои общину и их скот».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: посох
  rationale: מַטֶּה обозначает посох или жезл; «посох» естественно звучит в современном русском и подходит к предмету, который должен взять Моисей.
- source_word: הָעֵדָה
  choice: община
  rationale: עֵדָה обозначает собранное сообщество Израиля; «община» сохраняет коллективный смысл и звучит современно.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: скажите скале
  rationale: Форма глагола во множественном числе обращена к Моисею и Аарону. Русское «скажите скале» естественно передаёт конструкцию דבר אל, не добавляя удара по скале.
- source_word: לְעֵינֵיהֶם
  choice: на глазах у них
  rationale: Идиома буквально указывает на действие перед глазами народа и подчёркивает публичный характер знамения.
- source_word: וְנָתַן מֵימָיו
  choice: чтобы она дала свою воду
  rationale: Скала остаётся подлежащим единственного числа, а «свою воду» сохраняет притяжательный суффикс. В данном контексте русское придаточное с «чтобы» естественно выражает ожидаемый результат обращения к скале.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: Так ты добудешь для них воду из скалы
  rationale: Единственное число возвращает обращение к Моисею. «Добудешь» естественно передаёт каузативное значение — вывести, извлечь воду наружу, — а «так» обозначает последовательный результат без чрезмерно жёсткого логического уточнения.
- source_word: וְהִשְׁקִיתָ
  choice: напоишь
  rationale: Русский каузативный глагол точно и кратко передаёт значение «дать пить».
- source_word: בְּעִירָם
  choice: их скот
  rationale: בְּעִיר обозначает домашних животных, включая тягловый скот; «скот» — широкий и понятный русский эквивалент.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: ты и твой брат Аарон
  rationale: Сохранено явное указание на обоих руководителей; русский порядок слов звучит естественно.
theological_decisions:
- issue: Публичный характер повеления о чуде
  choice: «На глазах у них» сохраняет указание на видимое всему народу действие.
  alternative: «Перед ними»
  rationale: לְעֵינֵיהֶם буквально акцентирует зрительное свидетельство, важное для дальнейшего повествования о поступке Моисея и Аарона.
- issue: Кто должен говорить скале
  choice: Множественное «скажите» включает Моисея и Аарона.
  alternative: Единственное «скажи», обращённое только к Моисею
  rationale: Масоретский текст содержит форму второго лица мужского рода множественного числа וְדִבַּרְתֶּם, поэтому грамматическое напряжение между совместной речью и последующими глаголами в единственном числе сохранено.
- issue: Характер слов, обращённых к скале
  choice: «скажите скале, чтобы она дала свою воду»
  alternative: «говорите к скале, и она даст свою воду»
  rationale: Перевод сохраняет обращение к скале и результат, не уточняя формулу речи и не внося отсутствующее в тексте повеление ударить скалу.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён лишь там, где буквальное нанизывание союзов звучало бы тяжело; переход от множественного «скажите» к единственному «ты добудешь… напоишь» сохранён по еврейскому тексту.
