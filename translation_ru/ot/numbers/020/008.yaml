  to: «Возьми посох[a] и собери общину — ты и твой брат Аарон. На глазах у них скажите скале, и она даст свою воду. Выведи для них воду из скалы и напои общину и их скот».
  rationale: 'Исправлена связь между обращением к скале и дарованием воды: результат передан сочинённой конструкцией, без добавления приказа скале. Последние два глагола переданы императивом, что точнее сохраняет побудительную силу еврейской последовательности и её намеренный переход к единственному числу, обращённому к Моисею. Смысл, терминология и единственная лексическая сноска сохранены.'
