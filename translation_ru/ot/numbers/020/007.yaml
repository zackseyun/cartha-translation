  yaml_path: translation/ot/numbers/020/007.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; также передаётся как «Иегова».'
    reason: Альтернативная передача тетраграмматона.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Повествовательная форма глагола דבר вводит прямую речь. В современном русском формула «сказал Моисею» естественнее, чем буквальное «говорил к Моисею», и вместе с двоеточием передаёт функцию последующего לֵאמֹר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данном контексте еврейская формула введения речи естественно передаётся в русском двоеточием; громоздкое «говоря» не требуется, поскольку содержание речи следует в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное имя и является распространённой научной реконструкцией произношения; вариант отмечен сноской без подмены имени титулом.
translation_notes:
  register: Современный литературный русский язык. Краткая формула сохраняет достоинство повествования; союз «И» передаёт начальное וַ, а двоеточие указывает, что прямая речь начинается в следующем стихе.
