lexical_decisions:
- source_word: קַח
  choice: Возьми
  rationale: Повелительная форма Qal от לקח прямо означает «возьми»; в данном контексте Моисею велено взять с собой Аарона и Елеазара.
- source_word: אַהֲרֹן
  choice: Аарона
  rationale: Традиционная русская форма библейского имени; винительный падеж обусловлен синтаксисом.
- source_word: אֶלְעָזָר
  choice: Елеазара
  rationale: Традиционная русская форма библейского имени; винительный падеж обусловлен синтаксисом.
- source_word: בְּנוֹ
  choice: его сына
  rationale: 'Местоименный суффикс 3-го лица мужского рода единственного числа естественно относится к Аарону: Елеазар назван его сыном.'
- source_word: וְהַעַל
  choice: и возведи
  rationale: Повелительная форма Hiphil от עלה выражает побуждение к подъёму — «заставь подняться», «возведи». «Возведи» сохраняет каузативный оттенок и соответствует возвышенному, но понятному регистру.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится совместно к Аарону и Елеазару.
- source_word: הֹר הָהָר
  choice: гора Ор
  rationale: Формально сочетание означает «Ор, гора»; по-русски естественная и традиционная форма топонима — «гора Ор».
