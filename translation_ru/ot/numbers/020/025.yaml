  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: ru
  text: Возьми Аарона и его сына Елеазара и возведи их на гору Ор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «Ор, гора»; традиционно: «гора Ор».'
