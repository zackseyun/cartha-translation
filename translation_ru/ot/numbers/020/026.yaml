base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: ru
  text: Сними с Аарона его одежды[a] и облачи в них его сына Елеазара. Аарон будет собран[b] и умрёт там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По контексту речь идёт о священнических одеждах; в еврейском тексте сказано просто «его одежды».
    reason: lexical_alternative
  - marker: b
    text: '«Будет собран» — еврейский оборот, употребляемый в связи со смертью. В других местах он приводится в более полной форме: «будет собран к своему народу»; здесь слова «к своему народу» отсутствуют.'
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: Сними с Аарона его одежды
  rationale: Порода hифиль глагола פשט здесь означает снять одежду с другого человека. «Сними с Аарона» естественно передаёт прямое повеление, а «одежды» сохраняет торжественный регистр и не добавляет отсутствующего в самом слове уточнения «священнические».
- source_word: וְהִלְבַּשְׁתָּם אֶת־אֶלְעָזָר בְּנוֹ
  choice: и облачи в них его сына Елеазара
  rationale: Глагол לבש в hифиле означает одеть кого-либо; местоименный суффикс «их» относится к одеждам. «Облачи в них» уместно в контексте священнического служения и ясно выражает передачу одежд Елеазару.
- source_word: יֵאָסֵף
  choice: будет приобщён
  rationale: Страдательная форма глагола אסף буквально выражает, что Аарон «будет собран/приобщён». В этом стихе дополнение «к своему народу» отсутствует, поэтому оно не внесено в основной текст; сохранена краткость и недосказанность еврейского оборота.
- source_word: וּמֵת שָׁם
  choice: и умрёт там
  rationale: Последовательность продолжает предсказание будущего события; простой русский оборот точно передаёт смерть Аарона в указанном месте.
theological_decisions:
- issue: Смертный идиом יֵאָסֵף без названного дополнения
  choice: 'Сохранить пассивный образ: «будет приобщён», объяснив его в сноске.'
  alternative: «отойдёт к своим предкам» или «приобщится к своему народу»
  rationale: Полная формула с указанием народа или предков встречается в других местах, однако здесь этих слов нет. Их добавление сделало бы смысл понятнее, но устранило бы намеренную краткость исходного текста. Буквальное «будет собран» по-русски звучит неестественно, тогда как «будет приобщён» сохраняет образ и богословскую недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно торжественной лексикой. «Облачи» соответствует священническому контексту, но остаётся понятным; необычный оборот «будет приобщён» намеренно сохраняет краткий пассивный идиом оригинала и сопровождается пояснением.
