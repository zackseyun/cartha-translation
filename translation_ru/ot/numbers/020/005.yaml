  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: ru
  text: 'И зачем вы вывели нас из Египта, чтобы привести в это плохое место? Это не место для посева: здесь нет ни инжира, ни винограда, ни гранатов, и нет воды, чтобы пить.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не место семени»; возможный смысл: место, непригодное для посева, или земля, не производящая зерна и других культур.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: И зачем
  rationale: Союз сохраняет связь с предшествующей жалобой, а «зачем» естественно передаёт вопрос о цели действия.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: вы вывели нас из Египта
  rationale: Каузатив глагола עלה буквально выражает «поднять/вывести»; по-русски «вывести из Египта» естественно сохраняет устойчивый мотив исхода.
- source_word: לְהָבִיא אֹתָנוּ
  choice: и привели
  rationale: Инфинитив обозначает цель или результат. Сочинительная конструкция по-русски ясно передаёт обвинительный смысл жалобы без тяжеловесного повтора «чтобы привести».
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: в это гиблое место
  rationale: רַע здесь характеризует место как вредное, бедственное и непригодное, а не обязательно нравственно злое. «Гиблое» сохраняет сильную отрицательную окраску и звучит естественно.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Здесь нельзя ни сеять
  rationale: Буквально «не место семени»; в контексте речь, вероятнее всего, о непригодности места для посева или земледелия. Глагольная формулировка понятна современному читателю, а неоднозначность отмечена в сноске.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: ни выращивать инжир, виноград и гранаты
  rationale: Названия могут обозначать растения либо их плоды. В связи с непригодностью земли естественная русская формулировка охватывает сельскохозяйственную продуктивность, не навязывая точного выбора между деревом и плодом.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: и нет воды для питья
  rationale: Точно и естественно передаёт конструкцию отсутствия אַיִן и инфинитив «пить».
