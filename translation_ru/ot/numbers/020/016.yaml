source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: ru
  text: Мы воззвали к Яхве, и Он услышал наш голос, послал ангела[a] и вывел нас из Египта. И вот, мы находимся в Кадесе, городе на краю твоих владений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «посланника». Еврейское слово может обозначать как человеческого, так и небесного посланника, хотя в этом контексте многие понимают его как ангела, посланного Богом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: мы воззвали
  rationale: Глагол צעק выражает настойчивый крик о помощи. «Воззвали» передаёт силу обращения и сохраняет достойный литературный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: Он услышал наш голос
  rationale: Сохранён явный образ исходного текста — «услышал наш голос»; по смыслу речь идёт о том, что Бог услышал их мольбу.
- source_word: מַלְאָךְ
  choice: ангела
  rationale: Слово может обозначать как человеческого посланника, так и небесного вестника. В данном контексте естественно «ангела», а более широкое значение отмечено в сноске.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: вывел нас из Египта
  rationale: Каузативная форма יצא означает «вывести». Этот вариант естественен по-русски и соответствует устойчивой лексике рассказа об исходе.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Частица הִנֵּה привлекает внимание к нынешнему положению говорящих; «и вот» естественно передаёт её функцию в современном литературном русском.
- source_word: בְקָדֵשׁ
  choice: в Кадесе
  rationale: Предлог ב здесь обозначает нахождение внутри или в пределах названного места.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: городе на краю твоих владений
  rationale: Фраза указывает на расположение Кадеса у крайней границы территории Эдома. «На краю твоих владений» ясно и естественно передаёт пространственный смысл.
theological_decisions:
- issue: Кого обозначает מַלְאָךְ в упоминании исхода
  choice: ангел
  alternative: посланник; особое божественное явление
  rationale: Сам стих не уточняет личность этого вестника. Перевод использует обычное для данного контекста значение «ангел», не отождествляя его с какой-либо конкретной фигурой; лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Последовательность действий сохранена без искусственной архаизации; местоимение «Он» оформлено по принятой русской издательской норме почтительного обозначения Бога.
