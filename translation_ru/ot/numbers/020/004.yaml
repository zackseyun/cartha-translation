  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: ru
  text: И зачем вы привели собрание Яхве в эту пустыню, чтобы там умерли и мы, и наш скот?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָמָה
  choice: И зачем
  rationale: Сохраняет соединительный союз и вопрос, продолжающий жалобу предыдущего стиха; «зачем» естественно передаёт вопрос о предполагаемой цели.
- source_word: הֲבֵאתֶם
  choice: вы привели
  rationale: Хифиль глагола בוא означает «привести»; русская форма прошедшего времени прямо передаёт завершённое действие.
- source_word: קְהַל יְהוָה
  choice: собрание Яхве
  rationale: קהל обозначает собранную общину или собрание; «собрание» сохраняет корпоративный смысл, не придавая выражению специфически церковного оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: в эту пустыню
  rationale: מִדְבָּר здесь обозначает безлюдную пустынную местность; «пустыня» — естественный и привычный русский эквивалент, а предлог «в» передаёт направленность движения.
- source_word: לָמוּת שָׁם
  choice: чтобы здесь умерли
  rationale: Инфинитив допускает оттенок цели или результата; конструкция с «чтобы» сохраняет эту напряжённость. В прямой речи שָׁם естественно передано словом «здесь», поскольку говорящие находятся в названной пустыне.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: и мы, и наш скот
  rationale: Подчёркнутое местоимение и существительное переданы парной конструкцией «и … и»; בְּעִיר обозначает домашний скот в собирательном смысле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Цель или результат в לָמוּת
  choice: чтобы здесь умерли
  alternative: так что здесь умрём
  rationale: Еврейский инфинитив может выражать как предполагаемую цель, так и результат. Русское «чтобы» сохраняет обвинительный смысл жалобы, не утверждая, что Моисей и Аарон действительно намеревались погубить народ.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет эмоциональный вопрос-жалобу, достоинство библейского регистра и ясный синтаксис. Местоимение «вы» оставлено со строчной буквы как обращение к Моисею и Аарону.
