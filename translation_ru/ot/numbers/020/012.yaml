source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: ru
  text: 'И Яхве сказал Моисею и Аарону: «За то, что вы не поверили Мне[a] и не почтили Меня как святого[b] перед глазами сынов Израиля[c], вы не введёте это собрание в землю, которую Я дал им».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не доверились Мне». Еврейский глагол может обозначать как веру, так и доверие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не освятили Меня». Или: «не явили Мою святость», «не утвердили Меня как святого».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть израильтян; традиционно: «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: не поверили Мне
  rationale: Порода hифиль глагола אמן с предлогом ב выражает веру или доверие к кому-либо; эта формулировка близка к еврейскому тексту и естественна по-русски.
- source_word: לְהַקְדִּישֵׁנִי
  choice: не явили Мою святость
  rationale: В данном публичном контексте каузативная форма קדש означает явить Бога святым, утвердить Его святость перед народом; формулировка сохраняет смысл, не предполагая, будто люди делают Бога святым.
- source_word: לְעֵינֵי
  choice: перед глазами
  rationale: Сохраняет образ еврейской идиомы и подчёркивает публичный характер проступка.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт устойчивое еврейское родовое обозначение; пояснение предлагает более обычный современный эквивалент.
- source_word: לָכֵן
  choice: за то ... вы не введёте
  rationale: Русская конструкция ясно связывает проступок с последующим судебным решением и естественно передаёт причинно-следственную связь יַעַן ... לָכֵן.
- source_word: תָבִיאוּ
  choice: введёте
  rationale: Каузатив от בוא означает «ввести, привести внутрь»; этот вариант точно выражает руководство народом при вступлении в землю.
- source_word: הַקָּהָל
  choice: это собрание
  rationale: Передаёт קהל как собранную общину народа без узкоцерковных ассоциаций.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: которую Я дал им
  rationale: Перфект сохранён как совершившееся дарование, подчёркивающее определённость Божьего обещания.
theological_decisions:
- issue: Сущность проступка Моисея и Аарона
  choice: 'Сохранены оба элемента обвинения: они не поверили Богу и не явили Его святость перед Израилем.'
  alternative: Истолковать проступок исключительно как недоверие, непослушание либо присвоение Божьей славы.
  rationale: Сам стих называет неверие и неявление Божьей святости, но не объясняет точнее их соотношение; перевод не устраняет эту напряжённость толкованием.
- issue: Значение לְהַקְדִּישֵׁנִי
  choice: не явили Мою святость
  alternative: не освятили Меня; не почтили Меня как святого
  rationale: Выбранный вариант передаёт публичное признание и обнаружение Божьей святости, не утверждая, что Богу сообщается отсутствовавшая у Него святость.
- issue: Объект Божьего дара
  choice: землю, которую Я дал им
  alternative: землю, которую Я даю им
  rationale: Сохраняется форма совершенного вида и заветная определённость дара, хотя фактическое вступление народа ещё впереди.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис причинно-следственной конструкции сделан естественным для русского языка; сохранены личное имя Яхве, публичный образ «перед глазами» и формальное выражение «сыны Израиля».
