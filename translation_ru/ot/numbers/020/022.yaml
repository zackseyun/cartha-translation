lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в повествовательной форме обозначает снятие с места и начало дальнейшего пути; «отправились» естественно передаёт это значение по-русски.
- source_word: מִקָּדֵשׁ
  choice: из Кадеша
  rationale: В еврейском тексте стоит краткое название «Кадеш»; добавление «Кадес-Варни» было бы контекстуальным уточнением, отсутствующим в данном стихе.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: בוא здесь обозначает прибытие к названному месту. «Пришли к» естественно сочетается с названием горы и не привносит значения вхождения внутрь.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Современное русское обозначение народа ясно передаёт смысл еврейского родового выражения «сыны Израиля»; буквальная форма сохранена в примечании.
- source_word: כָּל הָעֵדָה
  choice: вся община
  rationale: עֵדָה обозначает собранное сообщество народа, а כָּל подчёркивает его полноту. Обособленное приложение сохраняет структуру и акцент исходного текста.
- source_word: הֹר הָהָר
  choice: гора Ор
  rationale: Сочетание функционирует как географическое название и по-русски естественно передаётся в форме «гора Ор», а не механически как «Ор-гора».
