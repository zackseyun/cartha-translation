base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: ru
  text: И Моисей дал распоряжение относительно них[a] священнику Елеазару, Иисусу, сыну Навина, и главам родовых домов племён сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «им». В таком случае местоимение относится к перечисленным далее руководителям, а не к коленам, упомянутым выше.'
    reason: lexical_alternative
  - marker: b
    text: «Главы родовых домов племён сынов Израиля» — административное обозначение родовых и племенных руководителей Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: дал повеление
  rationale: Глагол צוה выражает властное распоряжение. Оборот «дал повеление» естественно сочетается с получателями в дательном падеже и сохраняет официальный характер контекста.
- source_word: לָהֶם
  choice: о них
  rationale: Местоименная форма, вероятнее всего, отсылает к коленам Рувима и Гада, о которых Моисей даёт распоряжение названным далее руководителям. Возможность понять её как «им» сохранена в сноске.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: священнику Елеазару
  rationale: При глаголе повеления прямой объект в еврейском обозначает адресата распоряжения; по-русски это естественно передаётся дательным падежом.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисусу, сыну Навина
  rationale: Использована закрепившаяся в русской библейской традиции форма имени и сохранено явное обозначение отцовства.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: главам родов племён
  rationale: 'Сжатое административно-родовое выражение передано понятно и без избыточного буквального калькирования: речь идёт о руководителях родовых подразделений племён.'
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формулировка сохраняет генеалогическую и племенную образность еврейского текста; в данном контексте она грамматически относится к племенам.
