  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: ru
  text: кроме Халева, сына Иефоннии, кенезея и Иисуса, сына Навина, потому что они всецело следовали за Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнили вслед за Яхве»; это еврейская идиома, обозначающая полную, безраздельную верность.'
    reason: Поясняет буквальную форму и значение еврейской идиомы מִלְאוּ אַחֲרֵי.
lexical_decisions:
- source_word: בִּלְתִּי
  choice: кроме
  rationale: Частица вводит исключения из суда, о котором говорится в предыдущем контексте; «кроме» естественно передаёт эту функцию по-русски.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Халева, сына Иефоннии, кенезея
  rationale: Имена и родовое обозначение переданы в привычной русской библейской форме; בֶּן выражено словом «сын», а הַקְּנִזִּי — приложением «кенезей».
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: и Иисуса, сына Навина
  rationale: Сохранена укоренившаяся русская библейская форма имени Иисус Навин, при этом конструкция «сын Навина» непосредственно передаёт בִּן נוּן.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Халев и Иисус Навин стали исключением.
- source_word: מִלְאוּ אַחֲרֵי
  choice: всем сердцем следовали за
  rationale: Необычная еврейская идиома, буквально «наполнили вслед за», означает полную и безраздельную верность; естественный русский эквивалент передаёт её смысл, не сводя его лишь к внешнему послушанию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл מִלְאוּ אַחֲרֵי יְהוָה
  choice: всем сердцем следовали за Яхве
  alternative: полностью следовали за Яхве
  rationale: Выбранный вариант естественно выражает полноту преданности, заложенную в идиоме, не добавляя конфессионально обусловленного толкования.
