  to: И вот, вы встали на место своих отцов — отродье грешников, — чтобы ещё прибавить к пылающему гневу Яхве против Израиля.[a]
  rationale: 'Исправление заменяет двусмысленное «племя» на собирательное «отродье», которое в данном обличительном контексте передаёт значение и тон תַּרְבּוּת, и восстанавливает в основной строке идею «прибавить к» из לִסְפּוֹת עוֹד עַל. Примечания переработаны так, чтобы буквально и понятно объяснять идиому гнева и сохранять лексическую неоднозначность תַּרְבּוּת. Якорь примечания о תַּרְבּוּת следует поставить после «отродье грешников», а якорь об идиоме — после «Израиля»; однако в поле текста использован один якорь, чтобы не разрывать тире-обособление. Требуется технически разместить оба якоря: «отродье грешников[b]» и «Израиля[a]».'
