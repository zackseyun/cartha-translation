  source_fidelity: 'Фраза «в безопасности от жителей этой земли» усиливает и эксплицирует защитный результат, которого в еврейском тексте нет: מִפְּנֵי выражает причину/угрозу («из-за, перед лицом жителей земли»). Остальная передача в целом верно отражает военный контекст, последовательность действий и объект «их».'
  naturalness: Текст в целом современный и плавный. «На их место» звучит по-русски несколько неестественно; «к месту, предназначенному для них» яснее в данном контексте и не меняет смысла. «Выступим впереди» естественно передаёт подразумеваемое военное движение.
  terminology: «Вооружимся», «сыны Израиля», «укреплённые города» и «дети» уместны. Сноска к «детям» корректно сохраняет более широкий охват טַף, хотя формулировку следует уточнить, чтобы не отождествлять слово с «семьями» вообще.
