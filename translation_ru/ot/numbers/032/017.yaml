  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: ru
  text: А мы быстро вооружимся и выступим впереди сынов Израиля[a], пока не приведём их к месту, предназначенному для них; а наши дети[b] останутся в укреплённых городах из-за жителей этой земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед сынами Израиля»; в данном военном контексте, вероятно, имеется в виду выступить впереди них.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «дети», может также включать других лиц, находящихся на попечении.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ חֻשִׁים
  choice: быстро вооружимся
  rationale: Форма נֵחָלֵץ в данном контексте имеет возвратно-среднее значение — «вооружимся», а חֻשִׁים естественно передаётся наречием «быстро», выражающим поспешность и готовность.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: пойдём впереди сынов Израиля
  rationale: Буквально предлог означает «перед», но в военном контексте речь, вероятнее всего, о движении в авангарде. Глагол «пойдём» добавлен для естественности русского выражения и проясняет подразумеваемое движение.
- source_word: עַד אֲשֶׁר אִם הֲבִיאֹנֻם
  choice: пока не приведём их
  rationale: Сочетание עַד אֲשֶׁר אִם отмечает предел действия, а каузативная форма בוא означает «привести, доставить».
- source_word: אֶל מְקוֹמָם
  choice: на их место
  rationale: Сохранено широкое значение «их место», которое в контексте может обозначать предназначенную им землю или место поселения.
- source_word: טַפֵּנוּ
  choice: наши дети
  rationale: Коллективное טַף обозначает малых детей, а шире — семьи и иждивенцев. В основном тексте выбрано естественное русское «дети», а более широкий смысл отмечен в сноске.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: в укреплённых городах
  rationale: Точное и естественное обозначение городов, защищённых укреплениями.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: в безопасности от жителей этой земли
  rationale: Предлог выражает угрозу, исходящую от жителей земли. Контекст укреплённых городов позволяет естественно передать защитную цель, не оставляя двусмысленного русского «из-за».
