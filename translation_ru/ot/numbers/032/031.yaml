  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: ru
  text: 'Сыны Гада и сыны Рувима ответили[a]: «Как Яхве сказал твоим слугам, так мы и сделаем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сыны Гада и сыны Рувима ответили: “То, что Яхве сказал твоим слугам, мы исполним”».'
    reason: 'Еврейское אֵת אֲשֶׁר … כֵּן допускает как сравнительно-соотносительное понимание «как… так», так и объектное: «то, что…».'
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ответили
  rationale: В повествовательном контексте глагол ענה вводит ответ на предшествующую речь; «ответили» — прямой и естественный русский эквивалент.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: сыны Гада и сыны Рувима
  rationale: Сохранена дважды употреблённая в еврейском тексте родственная формула בְּנֵי; слово «сыны» придаёт фразе уместное библейское достоинство и остаётся понятным современному читателю.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: После русского глагола «ответили» отдельное «сказав» было бы тяжеловесным; функцию еврейского вводного инфинитива естественно передаёт оформление прямой речи.
- source_word: אֵת אֲשֶׁר … כֵּן
  choice: как … так
  rationale: Коррелятивная конструкция «как … так» естественно передаёт связь между сказанным Яхве и обещанным исполнением, хотя синтаксис допускает также объектное понимание «то, что…».
- source_word: דִּבֶּר
  choice: сказал
  rationale: Перфект указывает на уже произнесённые слова Яхве; в русском повествовании простое прошедшее время звучит естественнее буквального «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул.
- source_word: אֶל עֲבָדֶיךָ
  choice: твоим слугам
  rationale: Говорящие почтительно называют себя слугами Моисея; «слуги» сохраняет смиренную форму самообозначения без неуместного акцента на рабском статусе.
- source_word: נַעֲשֶׂה
  choice: мы и сделаем
  rationale: Прямо передаёт широкий глагол עשה; частица «и» естественно подчёркивает соответствие формуле «как… так».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер обещания колен
  choice: «так мы и сделаем»
  alternative: «мы исполним всё»
  rationale: Перевод сохраняет простое обязательство поступить согласно сказанному, не усиливая его добавленным всеохватным оттенком; объектное прочтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формула «сыны Гада и сыны Рувима» сохраняет структуру оригинала; избыточное для русского «сказав» не воспроизводится отдельно.
