id: NUM.32.29
reference: Numbers 32:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: ru
  text: 'И Моисей сказал им: «Если потомки Гада и потомки Рувима перейдут вместе с вами Иордан — все, вооружённые для битвы пред Яхве, — и земля будет покорена перед вами, то вы отдадите им землю Галаада во владение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И ... сказал
  rationale: Обычная повествовательная форма; союз сохраняет связь с предшествующим контекстом без лишнего уточнения последовательности.
- source_word: אִם
  choice: если
  rationale: Передаёт реальное условие, от исполнения которого зависит предоставление земли.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: потомки Гада и потомки Рувима
  rationale: В данном племенном контексте בְּנֵי обозначает членов или потомков родоначальников; такой перевод естественнее современного буквального «сыновья» и сохраняет родовую идентичность.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: перейдут ... Иордан
  rationale: Нормальное русское выражение для перехода через реку; название реки употреблено как прямое дополнение в соответствии с естественным русским словоупотреблением.
- source_word: אִתְּכֶם
  choice: вместе с вами
  rationale: Ясно и без расширения передаёт значение совместного действия.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: все, вооружённые для битвы
  rationale: Передаёт распределительное כָּל и военное значение חָלוּץ; множественная конструкция естественно согласуется с названными племенами.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет пространственно-богословский образ действия в присутствии Бога и перед Ним; краткая форма «пред» соответствует возвышенному, но понятному регистру.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: и земля будет покорена
  rationale: Пассивная форма сохраняет значение земли, приведённой под власть, не усиливая его до полного уничтожения.
- source_word: לִפְנֵיכֶם
  choice: перед вами
  rationale: Сохраняет еврейский образ покорения земли перед наступающим Израилем, не сводя его лишь к абстрактной выгоде.
- source_word: וּנְתַתֶּם לָהֶם
  choice: то вы отдадите им
  rationale: Будущее время выражает установленное следствие условия; «то» естественно обозначает начало главной части условного предложения.
- source_word: אֶרֶץ הַגִּלְעָד לַאֲחֻזָּה
  choice: землю Галаада во владение
  rationale: Передаёт и географическое наименование, и устойчивое значение אֲחֻזָּה как закреплённого земельного владения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога, а не титул; транслитерация сохраняет это различие и не подменяет имя традиционным заместительным чтением.
- issue: Смысл выражения לִפְנֵי יְהוָה
  choice: пред Яхве
  alternative: в присутствии Яхве
  rationale: 'Краткая формулировка сохраняет многозначность образа: в Божьем присутствии, перед Его лицом и под Его властью, не сводя выражение к одному пояснению.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис условного периода сохранён, а вставное тире помогает ясно связать выражение «все, вооружённые для битвы» с потомками двух племён.
