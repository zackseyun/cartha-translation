  source_fidelity: Перевод точно передаёт условную конструкцию, совместный переход через Иордан, требование участия всех вооружённых в сражении пред Яхве, последующее покорение земли и предоставление Галаада как наследственного владения. Пассивное «земля будет покорена» соответствует נִכְבְּשָׁה и не добавляет деталей о характере завоевания.
