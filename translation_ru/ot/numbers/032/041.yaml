  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: ru
  text: И Иаир, сын Манассии, пошёл и захватил их селения, и назвал их Хаввот-Иаир[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Хаввот-Иаир» означает «селения Иаира» или «посёлки Иаира».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Иаир
  rationale: Традиционная и узнаваемая русская передача библейского личного имени.
- source_word: בֶּן מְנַשֶּׁה
  choice: сын Манассии
  rationale: Буквально передаёт конструкцию со значением «сын Манассии», не заменяя её более широким толкованием «потомок Манассии».
- source_word: הָלַךְ
  choice: пошёл
  rationale: Прямое и естественное повествовательное соответствие глаголу הלך без добавления направления или цели.
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד в контексте завоевания обозначает взятие или захват населённых мест.
- source_word: חַוֺּתֵיהֶם
  choice: их селения
  rationale: חַוּוֹת обозначает небольшие поселения; «селения» естественно по-русски и сохраняет более широкий смысл, чем строгое «деревни».
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: назвал их
  rationale: При прямом дополнении קרא здесь естественно означает присвоение названия; «назвал» яснее современному русскому читателю, чем буквальное «назвал их именем».
- source_word: חַוֺּת יָאִיר
  choice: Хаввот-Иаир
  rationale: Сочетание функционирует как географическое название, поэтому в основном тексте оно транслитерировано, а его смысл пояснён в сноске.
