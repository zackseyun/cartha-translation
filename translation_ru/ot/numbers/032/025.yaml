  text: וַ/יֹּ֤אמֶר בְּנֵי גָד֙ וּ/בְנֵ֣י רְאוּבֵ֔ן אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר עֲבָדֶ֣י/ךָ יַעֲשׂ֔וּ כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י מְצַוֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: ru
  text: 'И сказали сыны Гада и сыны Рувима Моисею: «Твои слуги сделают так, как повелевает мой господин».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: сыны Гада и сыны Рувима
  rationale: Сохраняется родовая формула исходного текста; «сыны» уместно в достоинном библейском повествовательном регистре и обозначает потомков/членов племён.
- source_word: לֵאמֹר
  choice: не передано отдельным словом
  rationale: После глагола речи еврейский инфинитив вводит прямую речь; в современном русском его естественно передаёт двоеточие, тогда как «сказав» здесь было бы тяжеловесно и избыточно.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: Передаёт самообозначение говорящих как подчинённых Моисею без усиления до социально более узкого «рабы».
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: 'Точно сохраняет сопоставительное значение: исполнение будет соответствовать повелению.'
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Форма единственного числа с суффиксом первого лица — почтительное обращение к Моисею, а не Божье имя.
- source_word: מְצַוֶּה
  choice: повелевает
  rationale: Настоящее время и властный характер указания переданы непосредственно.
theological_decisions:
- issue: К кому относится אֲדֹנִי
  choice: «мой господин» — Моисей
  alternative: «Господь» как обозначение Бога
  rationale: Непосредственный адресат речи — Моисей; форма אֲדֹנִי означает «мой господин» и не является тетраграмматоном.
- issue: Социальный оттенок עֲבָדֶיךָ
  choice: «твои слуги»
  alternative: «твои рабы»
  rationale: В данном почтительном обращении слово выражает подчинённость и готовность исполнить приказ; «рабы» могло бы неоправданно сузить смысл до юридического рабства.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формула «сыны Гада и сыны Рувима» сохраняет структуру оригинала; формальное «говоря» опущено как неестественное для русской прямой речи.
