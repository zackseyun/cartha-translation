  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: обе группы названы отдельно, адресат — Моисей, עבדיךָ передано как почтительное самоназвание, а אֲדֹנִי правильно относится к Моисею, а не к Богу. Будущее значение יַעֲשׂוּ и сопоставление כַּאֲשֶׁר сохранены. לֵאמֹר в русском естественно выражено двоеточием перед прямой речью; отдельное «говоря» не требуется.'
  naturalness: Фраза звучит литературно и понятно. «Сыны Гада и сыны Рувима» сохраняет библейский повествовательный регистр, не выходя за рамки современного литературного русского. «Мой господин» несколько формально, но уместно как сохранение почтительной формы единственного числа оригинала в коллективной реплике.
  terminology: Имена «Гад», «Рувим» и «Моисей» нормативны. «Твои слуги» удачно передаёт עבדיךָ без неоправданного сведения смысла к юридическому рабству. «Мой господин» верно передаёт אֲדֹנִי и не смешивает его с Божественным именем.
