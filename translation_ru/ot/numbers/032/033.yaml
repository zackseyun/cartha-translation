base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: ru
  text: И дал Моисей сынам Гада, сынам Рувима и половине колена Манассии, сына Иосифа, царство Сигона, царя аморреев, и царство Ога, царя Васана, — землю с её городами в их пределах, города окрестной земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и землю — её города с их пределами, города окрестной земли». Заключительная еврейская фраза синтаксически сжата и допускает несколько близких вариантов перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן здесь обозначает передачу территории во владение; «отдал» естественно передаёт завершённое действие в повествовании.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: сынам Гада, сынам Рувима
  rationale: Сохраняется родоплеменная формула בְּנֵי и привычная для русского библейского регистра конструкция без архаизации синтаксиса.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: и половине колена Манассии
  rationale: Прямо и естественно передаёт конструкцию «половина колена», не превращая её в отдельное именование «полуколено».
- source_word: בֶן יוֹסֵף
  choice: сына Иосифа
  rationale: Родительный падеж согласован с «Манассии» и сохраняет данное в еврейском тексте родословное уточнение.
- source_word: מַמְלֶכֶת
  choice: царство
  rationale: Обычное соответствие для ממלכה; в контексте включает бывшие владения названных царей.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Сигона, царя аморреев
  rationale: Сохраняется приложение и коллективное значение הָאֱמֹרִי; употреблена традиционная русская форма имени Сигон.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ога, царя Васанского
  rationale: Передаёт титул и географическую принадлежность; «Васанский» — устоявшаяся и понятная русская библейская форма.
- source_word: הָאָרֶץ לְעָרֶיהָ
  choice: землю с её городами
  rationale: Предлог לְ в сжатой конструкции понят как указание на землю вместе с относящимися к ней городами.
- source_word: בִּגְבֻלֹת
  choice: в их пределах
  rationale: גבול во множественном числе может обозначать границы или территории; формулировка сохраняет эту пространственную соотнесённость без чрезмерного уточнения.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: города окрестной земли
  rationale: Сохраняет сжатое, вероятно приложительное завершение фразы и значение окружающей территории.
