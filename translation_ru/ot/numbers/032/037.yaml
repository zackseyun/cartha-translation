base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: ru
  text: И сыны Рувима построили Хешбон[a], Елеале и Кириатаим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рувимляне построили Хешбон, Елеале и Кириатаим».'
    reason: 'Лексическая альтернатива: выражение «сыны Рувима» в племенном контексте можно естественно передать как «рувимляне».'
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: И сыны Рувима
  rationale: Буквальное «сыны Рувима» сохраняет родословно-племенную форму еврейского выражения; в данном контексте оно обозначает потомков Рувима, то есть рувимлян.
- source_word: בָּנוּ
  choice: построили
  rationale: Форма qal глагола בנה имеет основное значение «строить». Контекст может допускать восстановление или обустройство городов, но сам текст этого не уточняет.
- source_word: אֶת / וְאֶת / וְאֵת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения передан обычным русским синтаксисом и не требует отдельного соответствия.
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Передача топонима посредством транслитерации, достаточно близкой еврейской форме.
- source_word: אֶלְעָלֵא
  choice: Елеале
  rationale: Транслитерация топонима с учётом масоретской огласовки и сложившейся русской библейской формы.
- source_word: קִרְיָתָיִם
  choice: Кириафаим
  rationale: Традиционная русская библейская передача топонима, отражающая еврейскую форму и узнаваемая русскоязычному читателю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренным сохранением формальной структуры оригинала. «Сыны» выбрано для передачи родословно-племенного оттенка, а более обычное «рувимляне» вынесено в примечание. Названия мест переданы в узнаваемых русских библейских формах.
