  rationale: В данном условном предупреждении частица подчёркивает наступающий результат. Русское «то» естественно оформляет условно-следственную связь, не вводя архаичного «вот».
- source_word: חֲטָאתֶם
  choice: согрешите
  rationale: Перфект описывает результат невыполнения условия. В русском условном контексте будущее время передаёт его точнее, чем «согрешили».
- source_word: לַיהוָה
  choice: против Яхве
  rationale: При глаголе חטא предлог указывает, против кого совершается грех; тетраграмматон передан личным именем «Яхве».
- source_word: וּדְעוּ
  choice: И знайте
  rationale: Сохраняет соединительный союз и прямое повеление во множественном числе.
- source_word: חַטַּאתְכֶם
  choice: ваш грех
  rationale: Основное значение существительного сохраняет нравственный смысл предупреждения, не сужая его до чувства или состояния виновности.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: настигнет вас
  rationale: Буквально грех «найдёт» виновных; «настигнет» естественно передаёт неизбежность обнаружения и последствий, сохраняя олицетворение греха.
