- issue: Смысл образа «грех найдёт вас»
  choice: ваш грех настигнет вас
  alternative: ваш грех обнаружится
  rationale: Выбранная формулировка сохраняет олицетворение и допускает как разоблачение, так и неизбежные последствия, не ограничивая смысл одной богословской трактовкой.
