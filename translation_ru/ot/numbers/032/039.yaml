  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: ru
  text: Сыновья Махира, сына Манассии, пошли в Галаад, захватили его и изгнали[a] живших в нём аморреев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте после глаголов во множественном числе стоит глагол в единственном числе: буквально «и он изгнал». Возможно, род Махира представлен здесь как единое целое; не исключён также стилистический или текстовый сдвиг.'
    reason: textual_variant
  - marker: b
    text: 'В еврейском тексте буквально «аморрея»: название народа стоит в единственном числе, но имеет собирательное значение и обозначает аморрейских жителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Обычный повествовательный глагол движения; указания на подъём или особый военный марш в форме нет.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Сыновья Махира, сына Манассии
  rationale: Сохраняет еврейское обозначение родства; «сыновья» здесь может охватывать также потомков или членов рода.
- source_word: גִּלְעָדָה
  choice: в Галаад
  rationale: Направительное окончание указывает на движение к месту; по-русски естественно «в Галаад».
- source_word: וַיִּלְכְּדֻהָ
  choice: захватили его
  rationale: Глагол לכד обычно обозначает захват места; местоимение относится к Галааду.
- source_word: וַיּוֹרֶשׁ
  choice: изгнали
  rationale: В породе hifil глагол ירש означает лишить владения, вытеснить или изгнать. Множественное число делает русский текст связным, а формальное единственное число еврейского текста отмечено в сноске.
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Единственное по форме название народа употреблено собирательно; русское множественное число ясно обозначает его жителей.
- source_word: אֲשֶׁר בָּהּ
  choice: живших в нём
  rationale: Причастный оборот естественно передаёт относительное предложение о тех, кто находился в Галааде.
