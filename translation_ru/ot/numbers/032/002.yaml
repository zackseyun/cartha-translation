- source_word: נְשִׂיאֵי הָעֵדָה
  choice: вожди общины
  rationale: «Вожди» передаёт статус официальных глав, а «община» — собравшийся народ Израиля.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: 'сказали ... :'
  rationale: В русском языке формулу введения прямой речи естественно передать одним глаголом и двоеточием, не воспроизводя избыточное «говоря».
