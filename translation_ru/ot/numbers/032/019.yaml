base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: ru
  text: Ведь мы не будем получать удел вместе с ними за Иорданом и далее, потому что наш удел достался нам по эту сторону Иордана, к востоку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что наш удел выпал нам на восточной стороне Иордана».'
    reason: 'Лексическая альтернатива: בָאָה буквально означает «пришла», однако в контексте распределения земли мысль можно идиоматически передать как «выпал удел».'
lexical_decisions:
- source_word: נִנְחַל
  choice: не будем получать удел
  rationale: Глагол נחל обозначает получение наследственного земельного владения. Такой перевод естественен по-русски и сохраняет смысл распределения земли между племенами.
- source_word: אִתָּם
  choice: вместе с ними
  rationale: Передаёт совместное участие с остальными племенами в получении земельного удела.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: за Иорданом и далее
  rationale: Сохраняет пространственную формулировку исходного текста и значение וָהָלְאָה — «далее, дальше».
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: наш удел уже достался нам
  rationale: Естественно передаёт завершённость действия и идиому букв. «наш удел пришёл к нам», не вводя явного субъекта, назначившего удел.
- source_word: נַחֲלָתֵנוּ
  choice: наш удел
  rationale: В контексте раздела земли «удел» точнее и естественнее русского «наследства», сохраняя смысл закреплённого за племенем владения.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: здесь, на восточной стороне Иордана
  rationale: Уточняет относительную пространственную перспективу говорящих, находящихся к востоку от Иордана, и прямо передаёт מִזְרָחָה.
