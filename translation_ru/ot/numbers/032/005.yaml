base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: ru
  text: 'И сказали они: «Если мы обрели благоволение в твоих глазах, пусть эта земля будет отдана твоим слугам во владение. Не переводи нас через Иордан[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не заставляй нас переходить Иордан». Еврейский глагол стоит в каузативной форме и допускает оба близких по смыслу перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: если мы обрели благоволение в твоих глазах
  rationale: Сохраняет обычную древнееврейскую идиому о благосклонном отношении адресата; «обрели благоволение» звучит достойно и понятно в современном литературном русском.
- source_word: יֻתַּן
  choice: пусть ... будет отдана
  rationale: Передаёт пассивную форму и оттенок вежливой просьбы, не превращая её в более прямое «дай».
- source_word: הָאָרֶץ הַזֹּאת
  choice: эта земля
  rationale: Прямое и естественное обозначение данной территории в контексте расселения.
- source_word: לַעֲבָדֶיךָ
  choice: твоим рабам
  rationale: В данном обращении это почтительное самоназвание просителей перед Моисеем; «рабам» сохраняет библейскую социально-речевую формулу лучше, чем более служебное «слугам».
- source_word: לַאֲחֻזָּה
  choice: во владение
  rationale: Передаёт землю как устойчивое родовое земельное владение, не вводя более узкое понятие наследства.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: не переводи нас через Иордан
  rationale: Каузативная форма глагола עבר означает, что Моисей не должен побуждать или вести их к переправе; русское «переводи» естественно сохраняет эту каузативность.
