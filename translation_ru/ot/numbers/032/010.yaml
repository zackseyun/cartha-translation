lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: гнев … воспылал
  rationale: Сочетание חרה с אַף — устойчивый образ разгорающегося гнева. «Гнев воспылал» сохраняет метафору и естественно звучит в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямой и естественный русский эквивалент временного оборота в повествовательном контексте.
- source_word: וַיִּשָּׁבַע
  choice: Он поклялся
  rationale: Форма нифаль глагола שבע означает принесение клятвы; «поклялся» передаёт это кратко и точно.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Инфинитив вводит содержание клятвы в следующем стихе; «сказав» сохраняет формальную связь с последующей прямой речью.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом; вариант «Иегова» отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок слов сохраняет акцент на временной рамке и образе воспылавшего гнева; прописное «Он» служит ясности референции в данном контексте.
