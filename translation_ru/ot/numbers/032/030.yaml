  source_fidelity: 'Условная конструкция и контрастное «Но если» переданы точно. Однако деепричастие «вооружившись» несколько смещает значение חֲלוּצִים: в оригинале это характеристика людей как вооружённых/снаряжённых, а не указание на предварительное действие. «Надел» точнее передаёт земельное владение в контексте распределения земли, чем общее «владение».'
  naturalness: «Не перейдут с вами вооружёнными» — естественная литературная конструкция и яснее связывает вооружённость с подлежащим. «Получат надел среди вас, в земле Ханаанской» звучит по-русски ясно и сохраняет оба обстоятельства оригинала.
  terminology: «Надел» уместен для наследуемого земельного владения. Топоним «земля Ханаанская» традиционен и понятен; не требует замены. Сноска должна говорить о закреплении земельного владения, а не о расплывчатом «утверждении в нём».
