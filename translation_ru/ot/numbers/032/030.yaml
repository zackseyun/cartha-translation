  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: ru
  text: Но если они не перейдут с вами вооружёнными, то получат надел среди вас, в земле Ханаанской.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то будут поселены среди вас в земле Ханаанской». Еврейский глагол может обозначать не только получение надела, но и закрепление земельного владения за ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Но если
  rationale: В контексте союз вводит противоположное условие по отношению к предыдущему стиху; «Но если» естественно передаёт этот контраст.
- source_word: יַעַבְרוּ
  choice: не перейдут
  rationale: Глагол עבר обозначает переход через рубеж; здесь подразумевается переход через Иордан в Ханаан.
- source_word: חֲלוּצִים
  choice: вооружившись
  rationale: Форма указывает на воинов, снаряжённых для боя. Деепричастие естественно связывает их вооружённость с совместным переходом.
- source_word: אִתְּכֶם
  choice: вместе с вами
  rationale: Передаёт сопровождение остальных израильтян при переходе.
- source_word: וְנֹאחֲזוּ
  choice: то получат владение
  rationale: Нифаль от אחז в контексте распределения земли выражает обретение или закрепление земельного владения; формулировка сохраняет результирующий смысл, не приписывая им самовольного захвата.
- source_word: בְּתֹכְכֶם
  choice: среди вас
  rationale: Обозначает место внутри сообщества Израиля к западу от Иордана.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Традиционная и понятная русская географическая формулировка, сохраняющая полное выражение оригинала.
