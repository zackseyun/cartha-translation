  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: ru
  text: И зачем вы подрываете решимость[a] сынов Израиля[b] перейти в землю, которую дал им Яхве?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ослабляете сердце»; также возможно: «лишаете мужества».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израильтян»; буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: И зачем
  rationale: Сохраняет соединительный союз и вопросительную форму, связывающую реплику с предшествующим упрёком.
- source_word: תנואון אֶת לֵב
  choice: подрываете решимость
  rationale: Каузативный глагол в сочетании с «сердцем» означает ослабление внутренней готовности и отвращение от намеченного действия. По-русски «подрывать решимость» естественно передаёт смысл идиомы; буквальный образ отмечен в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет родственно-национальное выражение оригинала и его грамматическую мужскую форму; более плавный вариант «израильтян» указан в сноске.
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  choice: перейти в землю
  rationale: Предлог מִן при инфинитиве после глагола препятствования выражает действие, от которого удерживают; «перейти в землю» естественно передаёт движение через границу в обещанную землю.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: которую дал им
  rationale: Перфект נָתַן представляет дарование земли как совершившийся факт. Русское прошедшее время ясно и без лишнего истолкования передаёт эту форму.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: В основном тексте сохранено буквальное родственно-национальное обозначение без устранения его мужской формы; естественный собирательный эквивалент дан как допустимая альтернатива.
- issue: Смысл образа «сердце» в אֶת לֵב
  choice: решимость
  alternative: сердце; мужество
  rationale: Здесь «сердце» обозначает внутреннюю решимость народа. Основной текст передаёт идиоматический смысл, а сноска сохраняет буквальный образ и возможный оттенок мужества.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Идиома с «сердцем» передана естественным выражением «подрываете решимость», при этом буквальная образность сохранена в сноске. Союз «И» воспроизводит связь вопроса с предыдущей речью.
