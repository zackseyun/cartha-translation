source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: ru
  text: Мы сами перейдём вооружёнными перед Яхве в землю Ханаан, а наше наследственное владение будет у нас по эту сторону Иордана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Иорданом» или «по ту сторону Иордана». Еврейское выражение зависит от точки отсчёта; перевод «по эту сторону» отражает положение говорящих к востоку от реки.'
    reason: Лексическая альтернатива и перспективная неоднозначность выражения מֵעֵבֶר לַיַּרְדֵּן.
lexical_decisions:
- source_word: נַחְנוּ
  choice: мы сами
  rationale: Самостоятельное местоимение усиливает уже выраженное глаголом подлежащее; «мы сами» естественно передаёт это ударение.
- source_word: נַעֲבֹר
  choice: перейдём
  rationale: Форма Qal imperfect 1-го лица множественного числа в контексте обещания обозначает предстоящее пересечение Иордана.
- source_word: חֲלוּצִים
  choice: вооружёнными
  rationale: В военном контексте слово обозначает снаряжённых и готовых к бою людей; творительный падеж естественно выражает их состояние при переходе.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняется пространственно-реляционное значение «перед, пред» и непосредственно передаётся заветное имя יהוה.
- source_word: אֶרֶץ כְּנָעַן
  choice: в землю Ханаан
  rationale: При глаголе движения русское «в» ясно выражает направление, подразумеваемое еврейским синтаксисом.
- source_word: וְאִתָּנוּ
  choice: а … останется у нас
  rationale: 'Еврейская безглагольная конструкция требует естественного русского восполнения. «Останется у нас» передаёт противопоставление: сами говорящие перейдут реку, тогда как их удел будет закреплён на восточной стороне.'
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: наше наследственное владение
  rationale: Сочетание передаёт и юридически закреплённое владение, и наследственный удел, не утяжеляя русский текст буквальным повтором существительных.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: по эту сторону Иордана
  rationale: Выражение зависит от точки отсчёта; здесь говорящие находятся к востоку от Иордана и имеют в виду ту сторону, где они сейчас пребывают.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя без подмены титулом.
- issue: Смысл לִפְנֵי יְהוָה
  choice: пред Яхве
  alternative: перед ковчегом Яхве / в присутствии Яхве
  rationale: Более общий перевод сохраняет богословскую и пространственную многозначность выражения и не отождествляет его прямо с ковчегом, который в этом стихе не назван.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «пред Яхве». Синтаксис сделан естественным для устного обещания; юридически-удельная лексика сохранена без буквалистской тяжеловесности.
