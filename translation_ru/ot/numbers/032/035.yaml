  text: and Atroth-shophan[a], and Jazer, and Jogbehah.
translation:
  language: ru
  text: Атрот-Шофан[a], Язер и Йогбегу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «Атарот-Шофан». Это составное еврейское географическое название; варианты транслитерации различаются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: перечислительная связь; перед последним названием — «и»
  rationale: Союз וְ передаёт связь между однородными названиями, а אֶת служит показателем определённого прямого дополнения и отдельно по-русски не переводится. В естественном русском перечислении повторять «и» перед каждым названием не требуется.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Атрот-Шофан
  rationale: Составное географическое название передано транслитерацией. Форма «Атрот» естественно отражает краткое звучание масоретской огласовки עַטְרֹת и сохраняет связь с традиционными русскими формами этого топонима.
- source_word: יַעְזֵר
  choice: Язер
  rationale: Географическое название транслитерировано с учётом начального еврейского йода и масоретской огласовки.
- source_word: יָגְבֳּהָה
  choice: Йогбега
  rationale: Географическое название транслитерировано по масоретской форме; конечная ה передана как «а», а внутренний ה не обозначен отдельным согласным, что соответствует его звучанию в данной форме.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткое продолжение перечня географических названий. Начальное «и» из исходного фрагмента не вынесено в начало стиха, поскольку по-русски связь с предшествующим перечнем естественно выражается союзом перед последним элементом. Имена переданы транслитерацией, без перевода их предполагаемого значения.
