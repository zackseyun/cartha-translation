  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: ru
  text: и каждый из ваших вооружённых воинов перейдёт Иордан перед Яхве, пока Он не изгонит[a] Своих врагов из Своего присутствия[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока Он не лишит Своих врагов владения». Еврейский глагол может означать «изгнать» или «лишить владения».'
    reason: Лексическая альтернатива для הוֹרִישׁוֹ.
  - marker: b
    text: Местоимения «Он», «Своих» и «Своего» вероятнее всего относятся к Яхве, хотя их также можно понимать как относящиеся к Израилю или к его вооружённому войску.
    reason: Сохранение грамматически возможной неоднозначности референта местоимений.
lexical_decisions:
- source_word: וְעָבַר
  choice: и ... перейдёт
  rationale: В условной конструкции перфект с וְ имеет будущее значение и продолжает условие предыдущего стиха.
- source_word: לָכֶם כָּל חָלוּץ
  choice: каждый вооружённый у вас
  rationale: חָלוּץ обозначает человека, снаряжённого для боя; לָכֶם выражает его принадлежность к числу адресатов. Формулировка сохраняет распределительное значение כָּל.
- source_word: אֶת הַיַּרְדֵּן
  choice: Иордан
  rationale: Устоявшееся русское название реки; добавление слова «река» не требуется.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי передаёт пространственно-реляционное значение «перед, в присутствии», а יהוה — личное имя Бога.
- source_word: הוֹרִישׁוֹ
  choice: Он не прогонит
  rationale: Hiphil от ירשׁ в данном контексте означает изгнание либо лишение владения. Местоименный суффикс указывает на подлежащее мужского рода единственного числа, вероятнее всего на Яхве.
- source_word: אֹיְבָיו מִפָּנָיו
  choice: Своих врагов от Себя
  rationale: Возвратные формы естественно передают цепочку еврейских местоименных суффиксов с одним референтом и сохраняют смысл «из Своего присутствия / от Своего лица».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» непосредственно передаёт его, не заменяя титулом.
- issue: Референт местоимений в הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו
  choice: Местоимения относятся к Яхве
  alternative: Местоимения относятся к Израилю как собирательному целому или к вооружённому отряду
  rationale: Ближайший грамматический кандидат — Яхве в выражении לִפְנֵי יְהוָה; это также согласуется с характерным для повествования об овладении землёй представлением о том, что Яхве изгоняет врагов перед Израилем. Альтернативный референт грамматически возможен, поэтому отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Пред Яхве» выбрано вместо более разговорного «перед Яхве» для достоинства звучания; синтаксис сохраняет связь с условием предыдущего стиха.
