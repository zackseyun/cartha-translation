  source_fidelity: 'Основной смысл передан верно: условное будущее действие вооружённых людей, переход Иордана перед Яхве и предел действия «пока Он не изгонит». Однако «от Себя» неудачно передаёт מִפָּנָיו: по-русски это звучит так, будто враги удаляются лично от Бога, а не из Его присутствия. Нужна также более естественная передача כָּל חָלוּץ לָכֶם.'
  naturalness: «Каждый вооружённый у вас» не соответствует современному литературному употреблению; естественнее «каждый из ваших вооружённых воинов». «Перед Яхве» современнее и нейтральнее, чем архаизирующее «пред Яхве».
  terminology: «Яхве» точно передаёт יהוה. «Вооружённые воины» адекватно выражает военное значение חָלוּץ. «Изгонит» — естественная передача הוֹרִישׁ в данном контексте; вариант «лишит владения» следует сохранить в примечании. Заглавные местоимения допустимы в библейском регистре, но не должны скрывать отмеченную в примечании неоднозначность референта.
