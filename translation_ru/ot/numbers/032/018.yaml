  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: ru
  text: Мы не вернёмся в свои дома, пока каждый из сынов Израиля не вступит во владение своим наделом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока каждый израильтянин не вступит во владение своим наделом». Буквально: «сыны Израиля».'
    reason: Лексическая альтернатива поясняет еврейскую родственную формулу и предлагает естественный современный эквивалент.
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: мы не вернёмся
  rationale: Отрицание с формой Qal imperfect 1-го лица множественного числа выражает твёрдое намерение относительно будущего; естественно передано русским будущим временем.
- source_word: אֶל בָּתֵּינוּ
  choice: в свои дома
  rationale: При глаголе «вернуться» русский язык естественно употребляет направление «в дома»; возвратное «свои» яснее соотносит дома с говорящими, чем буквальное «наши».
- source_word: עַד
  choice: пока … не
  rationale: Русская конструкция «пока … не» естественно обозначает временной предел невозвращения и соответствует еврейскому עַד.
- source_word: הִתְנַחֵל
  choice: не получит … надел
  rationale: Hitpael от נחל в данном контексте означает вступление во владение выделенной наследственной землёй. «Получит надел» ясно передаёт земельный и распределительный смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется мужская родственная формула еврейского текста и её традиционно-библейское звучание; менее буквальное «израильтяне» отмечено в сноске.
- source_word: אִישׁ
  choice: каждый
  rationale: В распределительной конструкции אִישׁ означает «каждый»; такой перевод естественен по-русски и не создаёт лишнего повторения слова «мужчина».
- source_word: נַחֲלָתוֹ
  choice: свой надел
  rationale: Речь идёт о выделенном каждому земельном владении. «Надел» точнее раскрывает контекстуальный смысл, чем более широкое «наследие».
theological_decisions:
- issue: Гендерно маркированная заветная формула בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет родственную и грамматически мужскую форму оригинала, не нейтрализуя её; современный этноним дан как допустимый смысловой эквивалент в сноске.
- issue: Соотношение наследования и земельного распределения в הִתְנַחֵל … נַחֲלָתוֹ
  choice: получит свой надел
  alternative: вступит во владение своим наследием
  rationale: Выбранная формулировка сохраняет конкретный смысл обретения выделенной земли, не привнося дополнительных богословских выводов о способе её получения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «сыны Израиля». Синтаксис прост и понятен; «надел» конкретизирует земельный контекст.
