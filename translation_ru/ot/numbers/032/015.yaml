  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: ru
  text: Ведь если вы перестанете следовать за ним[a], он снова оставит его в пустыне[b], и вы навлечёте гибель на весь этот народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отступите от следования за ним»; это выражение означает перестать за ним следовать.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте — «оставит его в пустыне»: местоимение стоит в единственном числе и, вероятно, коллективно обозначает Израиль, то есть народ. Возможный смысловой перевод: «оставит их» или «оставит Израиль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь если
  rationale: Сочетание передаёт как пояснительную связь с предыдущим предостережением («ведь»), так и условный смысл в данном контексте («если»).
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: вы перестанете следовать за ним
  rationale: Буквально конструкция говорит о возвращении или отступлении «от следования за ним»; по-русски естественно выражает прекращение верности и следования.
- source_word: וְיָסַף עוֹד
  choice: он снова
  rationale: 'Сочетание יסף с עוד имеет повторительное значение: действие будет совершено ещё раз.'
- source_word: לְהַנִּיחוֹ
  choice: оставит его
  rationale: Порода хифиль глагола נוח здесь означает оставить или дать остаться. Сохранено единственное число местоименного суффикса, вероятно коллективно обозначающего Израиль или народ.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычный и естественный русский эквивалент מִדְבָּר в повествовании о странствиях Израиля.
- source_word: וְשִׁחַתֶּם לְכָל הָעָם הַזֶּה
  choice: и вы навлечёте гибель на весь этот народ
  rationale: Формулировка передаёт разрушительное, причинное значение שׁחת и конструкцию с לְ, не ограничивая смысл только непосредственным физическим истреблением.
theological_decisions:
- issue: К кому относится местоимение единственного числа в לְהַנִּיחוֹ
  choice: 'Сохранить форму единственного числа: «оставит его», понимая её как коллективное обозначение Израиля или народа.'
  alternative: «Оставит их в пустыне» либо «оставит Израиль в пустыне».
  rationale: В еврейском тексте стоит суффикс мужского рода единственного числа. Его сохранение не устраняет формальную неоднозначность источника; ближайший смысловой контекст позволяет понимать местоимение коллективно — как указание на народ.
- issue: Степень прямоты значения וְשִׁחַתֶּם
  choice: «Навлечёте гибель на»
  alternative: «Погубите» или «уничтожите».
  rationale: Выбранная формулировка сохраняет причинную ответственность адресатов и допускает гибель народа вследствие Божьего суда, не уточняя сверх текста способ или непосредственность уничтожения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы согласно нейтральной современной издательской норме; подлинная неоднозначность единственного местоимения сохранена и пояснена сноской.
