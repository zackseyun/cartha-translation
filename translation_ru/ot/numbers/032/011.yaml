  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: ru
  text: «Никто из мужчин, вышедших из Египта, в возрасте от двадцати лет и старше, не увидит землю, которую Я поклялся дать[a] Аврааму, Исааку и Иакову, потому что они не следовали за Мной всецело[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте глагол «дать» не выражен; содержание клятвы подразумевается контекстом.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская идиома: «не исполнили (полностью) за Мной»; то есть не следовали за Мной полностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: никто ... не увидит
  rationale: В контексте клятвы אִם вводит эллиптическую отрицательную формулу; по-русски её смысл естественно передаётся решительным отрицанием.
- source_word: יִרְאוּ
  choice: не увидит
  rationale: ראה здесь означает увидеть землю в смысле дожить до вступления в неё; глагол «увидит» сохраняет образ исходного текста.
- source_word: הָאֲנָשִׁים
  choice: мужчин
  rationale: Существительное имеет конкретное значение «мужчины», уместное в контексте исчисления лиц от двадцати лет.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: вышедших из Египта
  rationale: В повествовании об исходе עלה מן обозначает выход из Египта; русское «вышедших» звучит естественно и точно.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: в возрасте от двадцати лет и старше
  rationale: Естественная современная передача стандартной формулы возрастного порога.
- source_word: הָאֲדָמָה
  choice: землю
  rationale: В данном контексте אֲדָמָה обозначает обещанную территорию, а не почву как вещество.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся дать
  rationale: «Поклялся» передаёт формулу божественной клятвы; «дать» по-русски необходимо для естественного управления с адресатами клятвенного обещания и ясно подразумевается контекстом обещания земли.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Дательный падеж непосредственно передаёт повторяющийся еврейский предлог לְ; повторять русский предлог не требуется.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание вынесенного клятвенного приговора.
- source_word: לֹא מִלְאוּ אַחֲרָי
  choice: не следовали за Мной всем сердцем
  rationale: Идиома буквально говорит о полном следовании за Богом. Русское выражение «всем сердцем» естественно передаёт полноту преданности, сохраняя образ следования.
theological_decisions:
- issue: Клятвенная формула с אִם
  choice: Никто ... не увидит
  alternative: Если ... увидят землю
  rationale: Буквальное условное предложение в русском скрыло бы подразумеваемое клятвой решительное отрицание. Выбранная передача выражает силу формулы, не добавляя богословского толкования.
- issue: Смысл לֹא מִלְאוּ אַחֲרָי
  choice: не следовали за Мной всем сердцем
  alternative: не следовали за Мной полностью
  rationale: Выбранное выражение естественно для современного литературного русского и передаёт целостность преданности, однако буквальная структура идиомы отмечена в сноске.
- issue: Подразумеваемое содержание клятвы о земле
  choice: землю, которую Я поклялся дать
  alternative: землю, о которой Я поклялся
  rationale: В еврейском тексте после «поклялся» стоят имена адресатов без выраженного инфинитива. «Дать» естественно восполняет подразумеваемое обещание, не меняя его содержания; формальная особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной интонацией прямой божественной речи. Прописные местоимения в обращении к Богу соответствуют принятому русскому библейскому регистру. Маркеры [a] и [b] размещены непосредственно при поясняемых выражениях.
