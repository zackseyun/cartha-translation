  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: ru
  text: а также Бет-Нимру и Бет-Гаран — укреплённые города — и загоны для мелкого скота.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Бет-Нимру
  rationale: Географическое название передано транслитерацией и поставлено в винительный падеж согласно еврейскому показателю прямого дополнения אֶת; элемент בֵּית сохранён как часть топонима, а не переведён словом «дом».
- source_word: בֵּית הָרָן
  choice: Бет-Гаран
  rationale: Название города передано транслитерацией; начальное ה соответствует русскому «г» в принятой библейской традиции. Винительная форма обусловлена синтаксисом продолжающегося перечня.
- source_word: עָרֵי מִבְצָר
  choice: укреплённые города
  rationale: Естественно передаёт конструкцию «города укрепления/крепости» и сохраняет её оборонительный смысл.
- source_word: גִדְרֹת צֹאן
  choice: загоны для овец
  rationale: Передаёт ограждённые места для мелкого скота; в данном контексте конкретное «овец» соответствует צֹאן и звучит понятно в современном русском языке.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: а также ... и ... и
  rationale: Союзы продолжают перечень из предыдущего стиха; «а также» естественно отмечает это продолжение, тогда как непереводимый אֶת указывает на прямые дополнения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Тире показывают, что «укреплённые города» относится к двум названным городам; стих намеренно сохраняет синтаксическую зависимость от предыдущего стиха.
