  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: ru
  text: Они поднялись до долины Эшкол и увидели землю, и отвратили сердца сынов Израиля[a] от вступления в землю, которую дал им Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля» — обычное обозначение народа Израиля.'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Они дошли
  rationale: Глагол עלה буквально передаёт движение вверх, однако в данном сочетании с עַד естественное русское «дошли до» ясно выражает достижение места; географический оттенок подъёма не акцентируется контекстом.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: до долины Эшкол
  rationale: נחל обозначает долину сезонного потока или русло; «долина» понятно современному читателю и не добавляет отсутствующего в тексте пояснения. עַד передано как «до».
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: и осмотрели землю
  rationale: ראה обычно значит «видеть», но в контексте разведки «осмотрели» естественно передаёт целенаправленное наблюдение земли, не превращая его в подробное исследование.
- source_word: וַיָּנִיאוּ
  choice: но отвратили
  rationale: Форма hифиль выражает побуждение отступиться, отказаться или потерять решимость. «Отвратили сердца… от» сохраняет причинительный смысл и сочетается с образом сердца.
- source_word: אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: сердца сынов Израиля
  rationale: Еврейское לֵב формально стоит в единственном числе как собирательное обозначение внутренней решимости народа. Русское множественное «сердца» звучит естественнее при «сынов» и сохраняет образ, тогда как «мужество» чрезмерно сужало бы смысл.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: от того, чтобы войти в землю
  rationale: Конструкция לְבִלְתִּי с инфинитивом выражает недопущение или отказ от действия. Русская конструкция передаёт связь с «отвратили» и ясно обозначает вхождение в землю.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: которую дал им Яхве
  rationale: Перфект נָתַן передан простым прошедшим временем без навязывания аспектуального уточнения; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон, поэтому личное имя передано транслитерацией, а не титулом.
- issue: Характер воздействия разведчиков на Израиль
  choice: отвратили сердца … от того, чтобы войти
  alternative: лишили решимости войти / отговорили входить
  rationale: Выбранная формулировка сохраняет метафору сердца и широкий причинительный смысл וַיָּנִיאוּ, не сводя действие только к словесному убеждению или эмоциональному унынию.
- issue: Связь между осмотром земли и последующим действием
  choice: но
  alternative: и
  rationale: Еврейский ו допускает простое присоединение, однако по смыслу повествования русское «но» естественно обозначает контраст между увиденной землёй и тем, что они отвратили народ. Контраст не меняет причинной неопределённости исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены образ сердца, национальное обозначение «сыны Израиля» и личное имя Яхве; синтаксис сделан понятным обычному читателю.
