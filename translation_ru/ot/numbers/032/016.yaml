lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: они подошли к нему
  rationale: Глагол נגשׁ обозначает приближение; «подошли к нему» естественно передаёт физическое движение к Моисею.
- source_word: וַיֹּאמְרוּ
  choice: и сказали
  rationale: Обычная повествовательная формула, вводящая прямую речь.
- source_word: גִּדְרֹת צֹאן
  choice: загоны
  rationale: Сочетание буквально обозначает ограждённые места для мелкого скота; в русском контексте назначение ясно из последующего «для нашего скота».
- source_word: נִבְנֶה
  choice: мы построим
  rationale: Форма выражает намерение или предложение говорящих; будущее время естественно передаёт заявленный план.
- source_word: לְמִקְנֵנוּ
  choice: для нашего скота
  rationale: מִקְנֶה — общее обозначение домашнего скота, не только крупного рогатого.
- source_word: פֹּה
  choice: здесь
  rationale: Прямой и естественный эквивалент наречия места.
- source_word: וְעָרִים
  choice: и города
  rationale: Сохранено основное значение עָרִים; контекст не требует сужать его до «поселений».
- source_word: לְטַפֵּנוּ
  choice: для наших детей
  rationale: טַף обозначает малых детей или зависимых членов семей; «детей» звучит естественно в современном русском, а более широкий оттенок отмечен в сноске.
