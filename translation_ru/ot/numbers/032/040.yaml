source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ אֶת הַ/גִּלְעָ֔ד לְ/מָכִ֖יר בֶּן מְנַשֶּׁ֑ה וַ/יֵּ֖שֶׁב בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: ru
  text: И отдал Моисей Галаад Махиру, сыну Манассии, и тот поселился там.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал жить там».'
    reason: 'Лексическая альтернатива: ישב может обозначать как поселение, так и проживание или обитание.'
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: В данном повествовании נתן обозначает передачу земли во владение. «Отдал» естественно по-русски передаёт простое значение глагола, не добавляя административного оттенка слов «выделил» или «предоставил».
- source_word: הַגִּלְעָד
  choice: Галаад
  rationale: Это установленная русская форма географического названия. Еврейский артикль отдельно не передаётся, что соответствует русскому употреблению имён местности.
- source_word: לְמָכִיר
  choice: Махиру
  rationale: Предлог ל указывает на получателя; русский дательный падеж прямо и естественно передаёт эту функцию.
- source_word: בֶּן מְנַשֶּׁה
  choice: сыну Манассии
  rationale: בן непосредственно означает «сын». Хотя в родословном контексте слово иногда может указывать на потомка, данный стих не требует такого расширения.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: ישב может означать «сидеть», «жить», «обитать» или «селиться». В контексте передачи территории «поселился» естественно выражает обустройство на полученной земле.
- source_word: בָּהּ
  choice: там
  rationale: Местоименный суффикс женского рода отсылает к территории Галаада. По-русски наречие «там» звучит естественнее буквального «в нём» и не создаёт неясности относительно места.
theological_decisions:
- issue: К кому относится подлежащее формы וַיֵּשֶׁב («поселился»)
  choice: «тот поселился», то есть Махир
  alternative: «он поселился» с формально возможной отсылкой к Моисею
  rationale: Ближайший участник и смысл земельного наделения указывают на Махира. Указательное местоимение «тот» естественно снимает нежелательную русскую двусмысленность, не внося богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; традиционные формы имён «Галаад», «Махир» и «Манассия» сохранены. Маркер сноски поставлен после соответствующего высказывания.
