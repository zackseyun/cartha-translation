  source_fidelity: 'Текст точно передаёт еврейский оригинал: Моисей обращается к сынам/племенам Гада и Рувима; «ваши братья» сохранено без неоправданного толковательного уточнения; «пойдут на войну» естественно передаёт יָבֹאוּ לַמִּלְחָמָה; противопоставление «а вы останетесь здесь» соответствует וְאַתֶּם תֵּשְׁבוּ פֹה. Риторическое «Неужели» уместно передаёт укоризненный вопрос.'
