  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: ru
  text: 'Моисей сказал сынам Гада и сынам Рувима: «Неужели ваши братья пойдут на войну, а вы останетесь здесь?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а вы будете сидеть здесь?» Глагол может также означать «оставаться» или «жить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Моисей сказал
  rationale: Последовательный waw продвигает повествование; в естественном русском повторяющийся союз можно не передавать, сохранив ввод речи.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: сынам Гада и сынам Рувима
  rationale: Сохранена буквальная родовая формула בני; она понятна в библейском повествовании и обозначает племенные общины.
- source_word: הַאַחֵיכֶם
  choice: ваши братья
  rationale: Буквальное родственное обозначение сохранено; по контексту это остальные израильтяне.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: пойдут на войну
  rationale: Сочетание означает вступление в военный поход или участие в войне; «пойдут на войну» естественно передаёт идиому и риторический вопрос.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: а вы останетесь здесь
  rationale: ישב может означать «сидеть, жить, оставаться»; здесь речь о том, что они не пойдут вместе с другими. Союз «а» сохраняет резкое противопоставление.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. «Неужели» передаёт укоризненную силу еврейского риторического вопроса. Пояснение о том, что «братья» — прочие израильтяне, не вынесено в сноску, поскольку это ясно из ближайшего контекста; единственная сноска отмечает конкретный образ «сидеть».
