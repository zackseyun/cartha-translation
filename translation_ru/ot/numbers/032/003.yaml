  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: ru
  text: Атарот, Дивон, Язер, Нимра, Хешбон, Элеале, Севам[a], Нево и Беон[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Севам»; в других местах родственное название места передаётся как «Сивма» или «Шивма».
    reason: lexical_alternative
  - marker: b
    text: Евр. «Беон»; в других местах родственное название встречается в расширенной форме «Баал-Меон».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: Атарот
  rationale: Название места передано транслитерацией с еврейского, без перевода его возможного значения.
- source_word: דִיבֹן
  choice: Дивон
  rationale: Транслитерация топонима с учётом принятой русской передачи интервокального ב как «в» в этом имени.
- source_word: יַעְזֵר
  choice: Язер
  rationale: Форма непосредственно передаёт еврейский топоним и естественно звучит по-русски.
- source_word: נִמְרָה
  choice: Нимра
  rationale: Сохранена краткая форма названия именно этого стиха; она не заменена встречающимся в других местах расширенным названием Бет-Нимра.
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Транслитерация сохраняет начальный гортанный согласный ח как «х» и различает שׁ как «ш».
- source_word: אֶלְעָלֵה
  choice: Элеале
  rationale: Название передано транслитерацией в форме, соответствующей еврейскому написанию.
- source_word: שְׂבָם
  choice: Севам
  rationale: Передана засвидетельствованная здесь форма שׂבם, без унификации с родственными формами названия в других стихах.
- source_word: נְבוֹ
  choice: Нево
  rationale: Использована естественная для русской библейской традиции передача этого топонима.
- source_word: בְּעֹן
  choice: Беон
  rationale: Сохранена краткая форма, стоящая в данном стихе; она не расширена до Баал-Меон.
- source_word: וְ / וּ
  choice: запятые и заключительное «и»
  rationale: Русское перечисление естественно оформляется запятыми с союзом перед последним элементом; структура и все названия исходного списка сохранены.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Топонимы транслитерированы с еврейского; краткие формы Нимра и Беон не гармонизированы с расширенными вариантами из других контекстов. Повторяющиеся еврейские союзы переданы естественным русским перечислением. Конечное тире сохранено, поскольку перечень синтаксически продолжается в следующем стихе. Маркеры сносок поставлены непосредственно после тех названий, к которым относятся примечания.
