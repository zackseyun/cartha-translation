  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: ru
  text: а также Нево[a], Баал-Меон — с изменёнными названиями — и Сивму. Они дали названия городам, которые они построили.
  philosophy: optimal-equivalence
