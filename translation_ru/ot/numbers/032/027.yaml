base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: ru
  text: Но слуги твои перейдут — каждый, вооружённый для войны[a], — перед Яхве[b], на войну[c], как говорит господин мой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый, готовый к военной службе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед Яхве». Это выражение указывает, что они идут в поход в присутствии Яхве и под его властью.'
    reason: cultural_note
  - marker: c
    text: 'Или: «для сражения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Но рабы твои
  rationale: עֶבֶד здесь обозначает людей, почтительно говорящих о себе перед Моисеем. «Рабы твои» сохраняет форму учтивого самоуничижения и библейскую социальную окраску; союз ו передан как «но», поскольку ответ противопоставлен высказанному ранее опасению.
- source_word: יַעַבְרוּ
  choice: перейдут
  rationale: В данном контексте עבר означает переход через Иордан для участия в походе; объект перехода понятен из ближайшего контекста.
- source_word: כָּל חֲלוּץ צָבָא
  choice: каждый, снаряжённый для военной службы
  rationale: כָּל при форме единственного числа имеет распределительное значение «каждый», а חֲלוּץ צָבָא обозначает человека, экипированного и готового к военному участию. Такой перевод сохраняет более широкое значение צָבָא, не сводя выражение только к наличию оружия.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי буквально выражает нахождение или действие «перед, в присутствии»; «пред Яхве» кратко сохраняет пространственно-богословскую многозначность. Имя יהוה передано как «Яхве».
- source_word: לַמִּלְחָמָה
  choice: на войну
  rationale: Предлог לְ может указывать направление и цель. Русское «на войну» естественно передаёт движение к военному походу, не добавляя явного глагола «сражаться».
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: как говорит господин мой
  rationale: Причастие דֹּבֵר естественно передаётся настоящим временем «говорит». אֲדֹנִי — почтительное обращение к Моисею, а не божественный титул; порядок «господин мой» поддерживает достоинство и слегка формальный регистр.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. Транслитерация «Яхве» отличает его от обращения אֲדֹנִי к Моисею и сохраняет прямое именование.
- issue: Смысл выражения לִפְנֵי יְהוָה
  choice: пред Яхве
  alternative: в присутствии Яхве / под властью Яхве
  rationale: Буквальная формулировка сохраняет одновременно идею Божьего присутствия и совершения похода перед Ним, не превращая подразумеваемую власть Яхве в единственное явно выраженное значение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. Формы «рабы твои», «пред Яхве» и «господин мой» сохраняют почтительность и структуру исходной речи, оставаясь понятными современному читателю.
