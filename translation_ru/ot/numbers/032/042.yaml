  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: ru
  text: Новах пошёл, захватил Кенат и зависимые от него поселения[a] и назвал его Новахом — по своему имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его дочерей»; так обозначались меньшие поселения, зависевшие от главного города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Нобах
  rationale: Личное имя передано принятой русской библейской транслитерацией; та же форма сохранена в новом названии города.
- source_word: הָלַךְ
  choice: пошёл
  rationale: Простой глагол движения в повествовательной последовательности; естественно передаёт начало действия, не добавляя значения «выступил».
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: В контексте завоевания לכד означает овладеть городом, захватить его.
- source_word: קְנָת
  choice: Кенат
  rationale: Название города транслитерировано согласно принятой русской библейской традиции.
- source_word: בְּנֹתֶיהָ
  choice: зависимые от него поселения
  rationale: Буквально «её дочерей»; это идиома, обозначающая меньшие поселения, административно или территориально связанные с главным городом. Мужской род местоимения согласован в русском с названием «Кенат».
- source_word: וַיִּקְרָא לָהּ
  choice: назвал его
  rationale: Конструкция קרא + ל в данном контексте выражает наречение имени; «назвал» естественнее по-русски, чем буквальное «назвал ему».
- source_word: בִּשְׁמוֹ
  choice: по своему имени
  rationale: Передаёт смысл называния города именем завоевателя и ясно относит местоимение к Нобаху.
