base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: ru
  text: И земля будет покорена перед Яхве, а после этого вы возвратитесь и будете свободны от обязательств перед Яхве и перед Израилем[a]; и эта земля будет вашим владением перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете невиновны перед Яхве и перед Израилем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: и земля будет покорена
  rationale: Нифаль глагола כבש передаёт пассивное подчинение земли; «будет покорена» сохраняет военный контекст и результативный смысл.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает «перед, в присутствии»; краткое «пред Яхве» сохраняет пространственный и судебно-заветный оттенок. Имя יהוה передано как «Яхве».
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: а после этого вы возвратитесь
  rationale: 'Оборот обозначает временную последовательность: возвращение последует после исполнения поставленного условия. Будущее изъявительное не превращает форму в явно выраженное разрешение.'
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: и будете свободны от обязательств перед Яхве и перед Израилем
  rationale: נָקִי с מן может означать свободу от вины или ответственности. В контексте обещанной военной службы речь прежде всего об исполненном обязательстве, однако альтернативный смысл отмечен в сноске.
- source_word: וְהָיְתָה הָאָרֶץ הַזֹּאת לָכֶם לַאֲחֻזָּה
  choice: тогда эта земля станет вашим владением
  rationale: אֲחֻזָּה — закреплённое земельное владение. «Станет вашим владением» естественно передаёт итог исполнения условия без избыточного уточнения о наследовании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» сохраняет личное заветное имя и соответствует указанной политике проекта, не заменяя его титулом.
- issue: Смысл נְקִיִּים в контексте обязательства
  choice: свободны от обязательств
  alternative: невиновны; чисты
  rationale: Контекст касается выполнения обещанной обязанности перед Богом и общиной. При этом лексическая возможность значения невиновности сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Форма «пред Яхве» сохранена как краткая и достойная формула; синтаксис следует условно-временной последовательности предыдущего контекста.
