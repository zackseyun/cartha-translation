base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: ru
  text: Постройте себе города для ваших детей[a] и загоны для вашего мелкого скота[b] и исполните то, что вышло из ваших уст[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваших малых»; еврейское слово обычно обозначает маленьких детей, иногда шире — зависимых членов семьи.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть огороженные места для овец и коз; возможный перевод: «овечьи загоны».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исполните то, что обещали». Выражение «то, что вышло из ваших уст» означает данное вслух слово.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּנוּ
  choice: Постройте
  rationale: Форма повелительного наклонения множественного числа от בנה выражает прямое повеление строить.
- source_word: לָכֶם
  choice: себе
  rationale: 'Естественно передаёт практическое значение конструкции с предлогом ל и местоименным суффиксом: строительство предназначено для самих адресатов и их семей.'
- source_word: עָרִים
  choice: города
  rationale: עיר может обозначать город или поселение; «города» — прямой и уместный в данном контексте эквивалент.
- source_word: לְטַפְּכֶם
  choice: для ваших детей
  rationale: טף обозначает малых детей, а в некоторых контекстах — зависимых членов семьи; современное «детей» естественно и сохраняет основное значение.
- source_word: וּגְדֵרֹת
  choice: и загоны
  rationale: גדרות здесь обозначает огороженные места для содержания скота; «загоны» точно и понятно передаёт реалии пастушеского контекста.
- source_word: לְצֹנַאֲכֶם
  choice: для вашего мелкого скота
  rationale: צאן — собирательное обозначение овец и коз; «мелкий скот» точнее, чем одни лишь «овцы», и естественнее здесь, чем буквальное «стада».
- source_word: וְהַיֹּצֵא מִפִּיכֶם
  choice: а затем исполните то, что вышло из ваших уст
  rationale: Сохранён образ еврейской идиомы о сказанном вслух обязательстве; «исполните» ясно передаёт требование осуществить данное слово.
- source_word: תַּעֲשׂוּ
  choice: исполните
  rationale: Хотя עשה буквально значит «делать», в сочетании с выражением о вышедшем из уст русском контексте «исполните» естественно передаёт осуществление обещанного.
theological_decisions:
- issue: Характер сказанного обязательства
  choice: Сохранить образ «вышло из ваших уст», пояснив, что речь идёт об исполнении данного слова
  alternative: 'Перевести прямо: «сделайте то, что обещали»'
  rationale: Такой выбор не уточняет сверх текста юридическую или обрядовую природу обязательства и одновременно сохраняет выразительность еврейской идиомы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; архаичные инверсии и узкоконфессиональная терминология не используются.
