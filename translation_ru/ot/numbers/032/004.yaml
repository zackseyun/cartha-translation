  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: ru
  text: Земля, которую Яхве поразил на глазах у общины Израиля[a], — земля, пригодная для скота[b], и у твоих рабов есть скот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрания Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земля для скота»; еврейское слово обозначает домашний скот вообще, а не только крупный рогатый скот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Земля
  rationale: Существительное обозначает землю или территорию; здесь имеется в виду конкретная область, упомянутая в предыдущем стихе.
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить» и в военном контексте может подразумевать разгром; «поразил» сохраняет силу действия, не сводя его значение только к толкованию «победил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Буквально передаёт пространственно-свидетельское значение: действие совершилось перед общиной Израиля, у неё на виду.'
- source_word: עֲדַת יִשְׂרָאֵל
  choice: общиной Израиля
  rationale: עֵדָה обозначает собранное сообщество народа; «община» естественно и точно передаёт это значение в контексте Пятикнижия.
- source_word: אֶרֶץ מִקְנֶה
  choice: земля, пригодная для скота
  rationale: Сочетание характеризует территорию как подходящую для содержания скота; такая формулировка ясна по-русски и не сужает מִקְנֶה до крупного рогатого скота.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: а у твоих рабов есть скот
  rationale: Еврейская конструкция с ל выражает принадлежность; русская конструкция «у ... есть» передаёт её естественно, сохраняя самоуничижительное обращение говорящих к Моисею.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер действия Яхве над землёй
  choice: поразил
  alternative: разгромил
  rationale: «Поразил» сохраняет широкое значение נכה и не уточняет сверх текста, относится ли действие прежде всего к земле, её жителям или их военным силам.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический повтор слова «земля» сохранён как смысловой акцент оригинала; «рабы» оставлено ради формы почтительного обращения к Моисею.
