  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: ru
  text: Наши малые дети[a], наши жёны, наш скот и все наши домашние животные останутся там, в городах Галаада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши дети». Еврейское слово טַף часто обозначает прежде всего малых или зависимых детей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: наши малые дети
  rationale: טַף обозначает прежде всего малых или зависимых детей; «малые дети» передаёт возрастной оттенок, не расширяя значение до всех домочадцев.
- source_word: נָשֵׁינוּ
  choice: наши жёны
  rationale: В семейно-племенном контексте форма множественного числа с притяжательным суффиксом естественно означает жён говорящих.
- source_word: מִקְנֵנוּ
  choice: наш скот
  rationale: מִקְנֶה обозначает стада и другой скот как движимое имущество; «скот» — ясный и естественный русский эквивалент.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: и все наши домашние животные
  rationale: בְּהֵמָה — широкое обозначение животных, особенно домашних. Такой перевод сохраняет обобщающий характер выражения и отличает его от מִקְנֶה.
- source_word: יִהְיוּ שָׁם
  choice: останутся там
  rationale: Буквально глагол означает «будут», однако в контексте речь идёт о тех, кто остаётся на месте, пока мужчины отправляются в поход; «останутся» естественно передаёт этот контекстуальный смысл.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: в городах Галаада
  rationale: Прямой и привычный перевод географического сочетания; עָרִים здесь уместно передать словом «города».
