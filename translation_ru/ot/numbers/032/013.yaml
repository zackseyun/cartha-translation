base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: ru
  text: И гнев Яхве воспылал против Израиля[a], и Он заставил их скитаться по пустыне сорок лет[b], пока не исчезло всё поколение, делавшее зло в глазах Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве разгневался на Израиль». Буквально еврейская идиома говорит, что «нос (гнев) Яхве воспылал».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он заставил их странствовать по пустыне». Еврейская форма подчёркивает, что именно Он был причиной их странствий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: И воспылал гнев Яхве
  rationale: Сохраняет образ горящего гнева в еврейской идиоме и звучит естественно в современном литературном русском.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: 'При обозначении гнева предлог בְ указывает на его объект; по-русски естественно: «гнев на Израиль».'
- source_word: וַיְנִעֵם
  choice: Он заставлял их скитаться
  rationale: 'Порода hifil передаёт каузативность: Яхве был причиной их скитаний. Несовершенный вид уместен для продолжавшегося сорок лет действия.'
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: В контексте исхода מִדְבָּר обозначает пустынную, необжитую местность; с глаголом «скитаться» русский предлог «по» естественнее буквального «в».
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: пока не окончилось всё поколение
  rationale: תֹּם выражает полное завершение или исчезновение поколения; формулировка сохраняет коллективный образ исходника, не уточняя сверх текста способ его конца.
- source_word: הָעֹשֶׂה הָרַע
  choice: делавшее зло
  rationale: Причастная конструкция непосредственно характеризует поколение; несовершенный вид передаёт устойчивую практику.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет еврейскую оценочную метафору и остаётся понятным русскому читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передаётся личное имя, прямо стоящее в еврейском тексте, а не заменяющий его титул.
- issue: Образ божественного гнева
  choice: воспылал гнев Яхве
  alternative: Яхве разгневался
  rationale: Сохранён образ «горящего» гнева без смягчения и без добавочного богословского истолкования.
- issue: Роль Яхве в странствиях Израиля
  choice: Он заставлял их скитаться
  alternative: они скитались
  rationale: 'Сохранена каузативная форма еврейского глагола: странствия представлены как действие суда Яхве.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повтор имени «Яхве» сохранён вслед за исходником; местоимение «Он» делает середину фразы естественной и не затемняет референта.
