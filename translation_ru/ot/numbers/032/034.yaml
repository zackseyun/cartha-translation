lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: отстроили
  rationale: Глагол בנה буквально означает «строить». В контексте уже существовавших городов русское «отстроили» естественно допускает восстановление или обустройство, не утверждая более узкого значения «укрепили».
- source_word: בְנֵי גָד
  choice: сыны Гада
  rationale: Сохраняет еврейское родовое выражение и в данном племенном контексте обозначает представителей колена Гада; форма «сыны» уместна в современном литературном библейском регистре.
- source_word: אֶת
  choice: не передано отдельно
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция выражена синтаксисом.
- source_word: דִּיבֹן
  choice: Дивон
  rationale: Традиционная русская транслитерация географического названия.
- source_word: עֲטָרֹת
  choice: Атарот
  rationale: Транслитерация географического названия с сохранением формы еврейского имени.
- source_word: עֲרֹעֵר
  choice: Ароэр
  rationale: Традиционная русская транслитерация географического названия.
