base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: ru
  text: У сынов Рувима и сынов Гада было очень много скота[a]. Они увидели землю Иазера и землю Галаада — и вот, эта местность подходила для скота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у сынов Рувима и у сынов Гада был весьма многочисленный скот». «Сыны» здесь означает членов соответствующих колен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «эта местность была местностью для скота». Повтор слова «местность» в еврейском тексте придаёт выражению особое ударение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: очень много скота
  rationale: מִקְנֶה — широкое обозначение домашнего скота как имущества, а сочетание רַב с עָצוּם מְאֹד подчёркивает его чрезвычайное изобилие. Русское «очень много скота» естественно передаёт совокупный смысл усиленной конструкции.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: у сынов Рувима и сынов Гада
  rationale: Сохранено буквальное племенное обозначение «сыны» и его повторение при обоих именах; в данном контексте речь идёт о членах соответствующих колен.
- source_word: וַיִּרְאוּ
  choice: Они увидели
  rationale: Простой повествовательный глагол передан отдельным предложением без добавления причинного или временного отношения, отсутствующего в исходном тексте.
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: землю Иазера и землю Галаада
  rationale: אֶרֶץ прямо передано словом «земля», причём повтор исходной конструкции сохранён.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: '«И вот» — естественный современный русский указательный оборот, сохраняющий функцию הִנֵּה: привлечь внимание к обнаруженному обстоятельству.'
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: эта местность подходила для скота
  rationale: В контексте מָקוֹם обозначает местность, а именная конструкция сообщает о её пригодности для содержания скота. Основной текст передаёт смысл естественно; буквальный повтор отмечен в сноске.
