  source_fidelity: 'В целом смысл передан верно: כֹּה עָשׂוּ, «ваши отцы», временной оборот «когда Я послал их», исходный пункт и цель сохранены. Однако в еврейском стоит определённое «землю», без указательного местоимения; «эту землю» добавляет указательность, которой форма определённости сама по себе не требует. Глагол לִרְאוֹת буквально означает «увидеть/посмотреть», а «осмотреть» допустим как контекстуальное уточнение, но предпочтительнее сохранить буквальное выражение в основном тексте и пояснить контекст в сноске.'
