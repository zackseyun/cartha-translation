lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: Так поступили
  rationale: Передаёт указательно-сравнительное «так» и естественно выражает образ действий в современном русском языке.
- source_word: אֲבֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет буквальное обозначение предыдущего поколения и его связь с нынешними адресатами; «предки» было бы шире исходного выражения.
- source_word: בְּשָׁלְחִי אֹתָם
  choice: когда я послал их
  rationale: Предлог ב с инфинитивом и суффиксом первого лица здесь имеет естественное временное значение.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: из Кадес-Варни
  rationale: Использована традиционная и узнаваемая русская форма топонима с нормативным падежным оформлением.
- source_word: לִרְאוֹת אֶת הָאָרֶץ
  choice: осмотреть эту землю
  rationale: Хотя ראה буквально означает «видеть», в данном контексте речь идёт о целенаправленном обследовании земли; «осмотреть» естественно передаёт это значение без более узкого оттенка тайного шпионажа. Указательное «эту» по-русски ясно отсылает к уже известной земле, обозначенной в еврейском определённой формой.
