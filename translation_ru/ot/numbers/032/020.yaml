  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: ru
  text: 'И Моисей сказал им: «Если вы сделаете это, если вооружитесь[a] перед Яхве[b] на войну,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снарядитесь», «выступите вооружёнными» или «соберётесь в боевом строю». Еврейский глагол здесь означает готовность и снаряжение к войне.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед Яхве». Это выражение указывает, что они идут на войну в Его присутствии и под Его властью.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: И Моисей сказал им
  rationale: Сохраняет последовательное повествование еврейского wayyiqtol и естественный для русского языка порядок слов.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: Если вы сделаете это
  rationale: דָּבָר здесь обозначает ранее высказанное предложение или обязательство; русское «это» естественно отсылает ко всему сказанному ранее.
- source_word: אִם תֵּחָלְצוּ
  choice: если вооружитесь
  rationale: Форма нифаль глагола חלץ в военном контексте означает быть вооружёнными или снаряжёнными к бою. «Вооружитесь» кратко и ясно передаёт военный смысл.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי буквально обозначает нахождение «перед» кем-либо, то есть в его присутствии; имя יהוה передано как «Яхве».
- source_word: לַמִּלְחָמָה
  choice: для войны
  rationale: Сочетание предлога ל с מִלְחָמָה указывает на цель военного снаряжения. «Для войны» формально сохраняет значение существительного, не сужая его до отдельного сражения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя יהוה; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смысл выражения לִפְנֵי יְהוָה
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: Буквальное «перед Яхве» сохраняет и пространственный образ, и богословский смысл действия в Божьем присутствии и под Его властью, не делая подразумеваемое толкование частью основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис оставлен незавершённым и завершается запятой, поскольку условное высказывание продолжается в следующем стихе.
