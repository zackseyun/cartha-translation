  source_fidelity: 'Текст точно передаёт повелительное множественное число הִבָּדְלוּ («Отделитесь»), удаление от находящейся рядом группы, обозначенной הָעֵדָה הַזֹּאת («этой общины»), а также последующее намерение быстро уничтожить её членов. «В одно мгновение» адекватно передаёт כְּרָגַע. Множественное «их» уместно: существительное «община» единично по форме, но подразумевает составляющих её людей, как и еврейское עֵדָה с אֹתָם.'
