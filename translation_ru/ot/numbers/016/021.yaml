  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: ru
  text: «Отделитесь от этой общины[a], чтобы Я истребил их в одно мгновение[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из среды этого собрания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в один миг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Отделитесь
  rationale: Возвратно-пассивная форма нифаля, повелительное наклонение множественного числа; передаёт приказ адресатам обособиться и отойти от группы.
- source_word: מִתּוֹךְ
  choice: от
  rationale: В сочетании с глаголом «отделитесь» естественно выражает удаление из состава группы; более буквальное пространственное значение отражено в сноске.
- source_word: הָעֵדָה הַזֹּאת
  choice: этой общины
  rationale: עֵדָה обозначает собранную общину Израиля; «община» сохраняет корпоративный смысл и звучит естественно в современном литературном русском.
- source_word: וַאֲכַלֶּה
  choice: чтобы Я истребил
  rationale: Форма первого лица после повеления передаёт намерение или ожидаемый результат; «истребил» сохраняет сильное значение полного уничтожения, не смягчая угрозу суда.
- source_word: אֹתָם
  choice: их
  rationale: Прямое дополнение во множественном числе, относящееся к общине, которой угрожает суд.
- source_word: כְּרָגַע
  choice: в одно мгновение
  rationale: רֶגַע обозначает очень краткий промежуток времени; выражение передаёт быстроту и внезапность объявленного суда.
theological_decisions:
- issue: Характер объявленного Богом суда
  choice: Передать слова как действительное намерение быстро истребить общину.
  alternative: Смягчить до «покончить с ними», «удалить их» или представить как лишь риторическую угрозу.
  rationale: Глагол כלה в данном контексте имеет сильное значение доведения до конца, полного уничтожения. Перевод сохраняет суровость высказывания и не устраняет богословское напряжение.
- issue: Связь повеления с последующим намерением Бога
  choice: «чтобы Я истребил»
  alternative: «и Я истреблю»
  rationale: Так сохраняется целевая или волевая связь между приказом отделиться и объявленным действием, допускаемая еврейской конструкцией.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формулировка ясна для обычного читателя, не перегружена архаизмами и сохраняет краткость и суровость оригинала.
