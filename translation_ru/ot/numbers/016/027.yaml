  terminology: «Жилище» удачно отличает מִשְׁכָּן в этом контексте от скинии/святилища. Традиционные формы имён Корей, Дафан и Авирам нормативны. «Сыновья» и «малые дети» сохраняют различие между בָּנִים и טַף.
