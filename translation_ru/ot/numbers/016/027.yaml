  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: ru
  text: И они отошли — со всех сторон — от жилища[a] Корея, Дафана и Авирама. Дафан и Авирам вышли и стали у входа в свои шатры — вместе со своими жёнами, сыновьями и малыми детьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялись от жилища Корея, Дафана и Авирама со всех сторон». Здесь еврейский глагол, вероятно, означает, что люди отошли от этого места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: отошли со всех сторон от
  rationale: Глагол עלה буквально означает «поднялись», однако в сочетании с מֵעַל и מִסָּבִיב в данном контексте передаёт удаление людей из окружающего пространства. «Отошли» естественно выражает это движение, а буквальный вариант отмечен в сноске.
- source_word: מִשְׁכַּן
  choice: жилище
  rationale: Здесь слово обозначает место обитания или стоянки, связанное с Кореем, Дафаном и Авирамом, а не святилище Господа. Единственное число исходного текста сохранено.
- source_word: יָצְאוּ נִצָּבִים
  choice: вышли и встали
  rationale: Сочетание описывает их выход из шатров и положение стоя у входа. «Встали» сохраняет конкретный смысл, не добавляя явно оттенка вызывающего противостояния.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: у входа в свои шатры
  rationale: Современная русская конструкция естественно передаёт вход в шатры; множественное число «шатры» соответствует еврейскому тексту.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: вместе со своими жёнами, сыновьями и малыми детьми
  rationale: «Сыновья» сохраняет отличие בנים от следующего טף, обозначающего малых детей или малолетних иждивенцев. «Вместе с» естественно показывает присутствие семей рядом с ними.
theological_decisions:
- issue: Оттенок слова נִצָּבִים
  choice: встали
  alternative: стояли, заняв вызывающую позицию
  rationale: Контекст может подразумевать неповиновение, но само слово прежде всего описывает положение стоя; перевод не делает подразумеваемую мотивацию явной.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-повествовательным звучанием. Имена переданы в традиционной русской библейской форме. «Жилище» выбрано вместо «скинии», чтобы не создавать ложной ассоциации со святилищем Господа.
