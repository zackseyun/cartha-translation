base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: ru
  text: 'Они пали ниц и сказали: «Боже, Боже духов всякой плоти![a] Неужели один человек[b] согрешит, а Ты разгневаешься на всю общину?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Боже, Боже дыхания всякой плоти!» — с акцентом на Боге как подателе жизни всем живым существам.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «один человек» может иметь представительный смысл; суть мольбы в том, чтобы грех отдельного человека не навлёк гнев на всю общину.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: они пали ниц
  rationale: Естественное для современного литературного русского выражение, сохраняющее образ смиренного падения лицом вниз и подходящее контексту заступничества.
- source_word: אֵל אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Боже, Боже духов всякой плоти
  rationale: Форма обращения передана звательным «Боже»; сочетание «духов всякой плоти» сохраняет структуру и широкое антропологическое значение еврейского выражения.
- source_word: בָּשָׂר
  choice: плоть
  rationale: Сохраняет библейский образ и не сужает значение до «людей», хотя в данном контексте речь прежде всего о человеческом сообществе.
- source_word: הָאִישׁ אֶחָד
  choice: один человек
  rationale: Передаёт мужскую форму существительного и акцент числительного на одном отдельном человеке; по-русски «человек» естественнее, чем «мужчина», и не устраняет возможную представительную функцию выражения.
- source_word: יֶחֱטָא
  choice: согрешит
  rationale: Будущая форма в риторическом вопросе близко передаёт еврейский имперфект, не уточняя сверх текста, идёт ли речь о предположении или конкретном поступке.
- source_word: וְעַל כָּל־הָעֵדָה תִּקְצֹף
  choice: а Ты разгневаешься на всё общество
  rationale: «Разгневаться на» естественно передаёт קצף с עַל, а «общество» соответствует обозначению собравшейся общины Израиля.
theological_decisions:
- issue: Значение выражения «Бог духов всякой плоти»
  choice: Титул Бога, подчёркивающий Его отношение к внутренней жизни всех людей и способность различать их ответственность.
  alternative: Титул Бога как подателя дыхания и жизни всякому живому существу.
  rationale: Контекст мольбы о различении личной вины и участи всей общины поддерживает значение «духи», однако примечание сохраняет возможное значение «дыхание».
- issue: Соотношение личного греха и гнева на всю общину
  choice: Риторический вопрос оставлен без богословского разрешения и подчёркивает мольбу не распространять наказание за грех одного на всех.
  alternative: Понимать «одного человека» исключительно как представителя группы, вина которого непременно считается общей.
  rationale: Еврейский текст допускает представительный оттенок, но прямо его не объясняет; перевод сохраняет напряжение между личной и общей ответственностью.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Пали ниц» сохраняет конкретный образ без тяжеловесности; «всякая плоть» намеренно оставлено как понятное библейское выражение. Заглавные местоимения в обращении к Богу использованы в соответствии с традиционной русской издательской практикой.
