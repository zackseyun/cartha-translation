  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: ru
  text: И Корей собрал против них всю общину у входа в шатёр встречи, и слава Яхве[a] явилась всей общине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя: «Яхве»; традиционно переводится как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: собрал
  rationale: Каузативная порода глагола קהל указывает, что Корей созвал и собрал общину; «собрал» ясно передаёт его активную роль.
- source_word: עֲלֵיהֶם
  choice: против них
  rationale: В контексте мятежа предлог עַל имеет враждебно-направленное значение; местоимение относится к Моисею и Аарону.
- source_word: כָּל הָעֵדָה
  choice: всю общину
  rationale: עֵדָה обозначает собранное сообщество Израиля, а כָּל передано словом «всю».
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: Фраза обозначает место собрания. «У входа в» естественно звучит по-русски и точно передаёт расположение перед входом.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Буквально и понятно передаёт устойчивое название священного шатра, где Бог встречается с Израилем.
- source_word: וַיֵּרָא
  choice: явилась
  rationale: Нифаль глагола ראה здесь выражает видимое проявление; «явилась» сохраняет это значение без уточнения способа явления.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: כָּבוֹד обозначает явленное присутствие и величие Бога; конструкция передана естественным русским родительным оборотом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: אֶל כָּל הָעֵדָה
  choice: всей общине
  rationale: Предлог אֶל указывает, кому было явлено Божье присутствие; русский дательный падеж после «явилась» передаёт это естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит собственное имя Бога. Форма «Яхве» сохраняет его как имя, а традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому тексту, но не звучит искусственно; термин «община» последовательно передаёт עֵדָה.
