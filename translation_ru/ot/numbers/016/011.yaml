base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: ru
  text: Итак, ты и всё твоё сообщество собрались против Яхве[a]. А Аарон — кто он такой, что вы ропщете против него?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского имени Бога יהוה (ЙХВХ).
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Передаёт вывод из предшествующих слов Моисея и естественно звучит в современной русской речи.
- source_word: עֲדָתְךָ
  choice: всё твоё сообщество
  rationale: В данном контексте обозначает собравшуюся вокруг Корея группу; «сообщество» сохраняет коллективный смысл и не придаёт слову специально церковного оттенка.
- source_word: הַנֹּעָדִים
  choice: собрались
  rationale: Передаёт значение нифального причастия от יעד — собраться по уговору или назначению; прошедшее время естественно описывает уже сложившееся выступление.
- source_word: עַל יְהוָה
  choice: против Яхве
  rationale: В контексте мятежа предлог עַל имеет направленное, враждебное значение; личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: וְאַהֲרֹן מַה הוּא
  choice: А Аарон — кто он такой
  rationale: Риторический вопрос умаляет личную роль Аарона и подчёркивает, что выступление в конечном счёте направлено против Яхве.
- source_word: תלונו עָלָיו
  choice: вы поднимаете ропот против него
  rationale: «Ропот» сохраняет характерную для повествований о пустыне отрицательную окраску корня לון. Оборот «поднимаете ропот» позволяет отразить возможную каузативную силу породы хифиль, не делая русский текст неестественным.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно передано непосредственно, а не заменено титулом.
- issue: На кого направлен мятеж
  choice: Собравшиеся выступили против Яхве; Аарон представлен как вторичная человеческая мишень их ропота.
  alternative: Мятеж направлен в равной мере против Яхве и Аарона.
  rationale: Синтаксис сначала прямо говорит о собрании против Яхве, а затем отделяет Аарона риторическим вопросом «кто он такой?», сохраняя различие между истинной и непосредственной мишенью выступления.
- issue: Каузативность формы תלונו
  choice: «поднимаете ропот» — допускает как личный ропот участников, так и побуждение других к нему.
  alternative: «ропщете»; «заставляете роптать»
  rationale: Форма хифиль может иметь каузативный оттенок, однако в употреблении корня לון различие не всегда можно жёстко выразить. Выбранная формулировка сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической резкостью оригинала. Краткие фразы и тире сохраняют контраст между выступлением против Яхве и вторичной ролью Аарона; архаизм «ропот» оставлен как понятный библейский термин с выраженной отрицательной окраской.
