  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: ru
  text: Корах, сын Ицхара, сына Кехата, сына Левия, вместе с Датаном и Авирамом, сыновьями Элиава, и Оном, сыном Пелета, — из рода Рувима, — взял с собой людей[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и взял». В еврейском тексте не сказано, что именно он взял; слово «людей» добавлено для ясности из контекста следующего стиха.'
    reason: Уточнение эллиптической конструкции и обозначение добавленного по контексту дополнения.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял с собой людей
  rationale: Глагол буквально означает «взял», но дополнение в еврейском тексте не названо. «Людей» восполнено из следующего стиха, где упомянуты двести пятьдесят участников; «с собой» естественно передаёт вовлечение их в действие, не заменяя глагол более толковательным «восстал».
- source_word: קֹרַח בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: Корах, сын Ицхара, сына Кехата, сына Левия
  rationale: Сохранена последовательная родословная цепь и использована транслитерация, близкая к еврейскому звучанию.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: вместе с Датаном и Авирамом, сыновьями Элиава
  rationale: Оборот «вместе с» ясно связывает Датана и Авирама с действием Кораха; родственная связь передана прямо.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: и Оном, сыном Пелета
  rationale: Имена транслитерированы непосредственно с еврейского, а родословное определение сохранено.
- source_word: בְּנֵי רְאוּבֵן
  choice: все они из сыновей Рувима
  rationale: Формула «сыновья Рувима» здесь указывает на племенную принадлежность названных людей. Добавление «из» позволяет по-русски избежать ошибочного впечатления, будто они были непосредственными сыновьями Рувима, сохраняя библейский родовой образ.
theological_decisions:
- issue: 'Эллиптическое начало: у глагола וַיִּקַּח не выражено дополнение'
  choice: В основном тексте восполнить «людей», отметив это сноской
  alternative: Оставить «взял» без дополнения либо истолковать как «восстал»/«объединился»
  rationale: Контекст второго стиха делает людей наиболее вероятным подразумеваемым дополнением. Сноска сохраняет для читателя существенную неоднозначность исходной конструкции и не выдаёт восполнение за явно написанное в тексте.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Родословные связи сохранены; близкие к еврейскому звучанию формы имён не зависят от позднейших конфессиональных традиций. Тире выделяют общее указание на принадлежность к роду Рувима и помогают разобрать длинную синтаксическую цепь. Конечная запятая сохраняет незавершённость предложения, продолжающегося в стихе 2.
