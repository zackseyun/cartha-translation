  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: ru
  text: Ты даже не привёл нас в землю, где текут молоко и мёд, и не дал нам в наследие поля и виноградники. Неужели ты выколешь глаза этим людям?[a] Мы не пойдём!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели ты ослепишь этих людей?» Буквально: «выколешь глаза». Этот образ может также подразумевать, что с людьми обращаются так, словно они слепы к очевидному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: Более того, … не
  rationale: 'Сочетание продолжает и усиливает жалобу: Моисей не только вывел народ из прежней земли, но и не ввёл его в обещанную. «Более того» естественно передаёт присоединительно-усилительный оттенок אַף.'
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: в землю, где текут молоко и мёд
  rationale: Сохранён традиционный и понятный образ изобилия; придаточная конструкция звучит естественно в современном русском языке.
- source_word: הֲבִיאֹתָנוּ
  choice: ты не привёл нас
  rationale: Это форма каузативного глагола בוא со значением «привести»; отрицание לֹא относится к ней. Начальное הֲ здесь принадлежит глагольной форме, а не обязательно обозначает вопрос.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: и не дал нам в наследие поля и виноградники
  rationale: נַחֲלָה означает наследственный удел или владение. Еврейские формы единственного числа имеют собирательный смысл, поэтому русские множественные «поля и виноградники» естественно выражают содержание.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Неужели ты выколешь глаза этим людям?
  rationale: Глагол נקר в породе пиэль буквально означает «выколоть, лишить глаз». В основном тексте сохранён резкий конкретный образ и риторический вопрос; возможный переносный смысл отмечен в сноске.
- source_word: לֹא נַעֲלֶה
  choice: Мы не пойдём!
  rationale: עלה буквально значит «подниматься, идти вверх», но здесь речь об отказе явиться по вызову Моисея. «Не пойдём» ясно и естественно передаёт этот смысл по-русски.
theological_decisions:
- issue: Буквальный или переносный смысл образа с выкалыванием глаз
  choice: В основном тексте сохранён буквальный образ «выколешь глаза», без утверждения, что Моисей действительно намеревался физически ослепить людей.
  alternative: «Неужели ты ослепишь этих людей?» или переносное «Неужели ты считаешь этих людей слепыми?»
  rationale: Реплика допускает как угрозу ослепления, так и образ обвинения в обмане людей, будто они не видят очевидного. Перевод не должен устранять эту напряжённую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с резкой обвинительной интонацией прямой речи. Сохранены библейский образ земли изобилия и грубая телесная метафора; заключительный отказ передан кратко и решительно.
