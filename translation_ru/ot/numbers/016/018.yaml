  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: ru
  text: И каждый взял свою кадильницу[a], и они положили в них огонь, и положили на них благовония, и встали у входа в шатёр встречи вместе с Моисеем и Аароном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуд для углей». Еврейское слово обозначает сосуд, в котором переносили горящие угли для воскурения благовоний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: каждый свою кадильницу
  rationale: אִישׁ употреблено распределительно, а מַחְתָּה обозначает сосуд для горящих углей, на которых воскуряли благовоние. «Кадильница» — естественный и традиционный русский эквивалент; более предметный вариант отмечен в сноске.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: положили они в них огонь
  rationale: Хотя עַל буквально означает «на», применительно к сосудам по-русски естественно сказать, что огонь положили «в них».
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: возложили на него благовоние
  rationale: 'Местоимение передано как относящееся к огню: благовоние клали на горящие угли в кадильницах. Единственное число «него» согласовано с собирательно понимаемым словом «огонь» и сохраняет естественность русского выражения.'
- source_word: קְטֹרֶת
  choice: благовоние
  rationale: В данном обрядовом контексте слово обозначает ароматическое вещество для воскурения; «благовоние» точно передаёт предмет, не смешивая его с самим дымом.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: פֶּתַח — вход или проём; אֹהֶל מוֹעֵד передано устойчивым и прозрачным сочетанием «шатёр встречи».
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: вместе с Моисеем и Аароном
  rationale: Заключительное присоединение без отдельного сказуемого естественнее всего понимать как указание, что Моисей и Аарон также стояли там.
