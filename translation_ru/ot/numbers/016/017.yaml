revisions:
- from: Пусть каждый возьмёт свою жаровню[a], положит на неё благовоние и принесёт пред Яхве[b] свою жаровню — всего двести пятьдесят жаровен; также ты и Аарон — каждый свою жаровню.
  to: Пусть каждый возьмёт свою жаровню[a], положит на неё благовоние и принесёт перед Яхве[b] свою жаровню — двести пятьдесят жаровен; а ты и Аарон — каждый со своей жаровней.
