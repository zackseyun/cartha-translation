base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: ru
  text: Пусть каждый возьмёт свою жаровню[a], положит на неё благовоние и принесёт перед Яхве[b] свою жаровню — двести пятьдесят жаровен; а ты и Аарон — каждый со своей жаровней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кадильницу» — сосуд, в котором на углях воскуряли благовония.'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. יהוה (ЙХВХ); традиционно: «Господь», также передаётся как «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּקְחוּ אִישׁ
  choice: Пусть каждый возьмёт
  rationale: Императив множественного числа вместе с распределительным אִישׁ естественно передаётся по-русски конструкцией «пусть каждый».
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: свою жаровню / жаровен
  rationale: מַחְתָּה обозначает сосуд для углей и воскурения благовоний. «Жаровня» конкретно передаёт назначение сосуда; традиционное «кадильница» дано в примечании как допустимый вариант.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: положит на неё благовоние
  rationale: Сохранено буквальное значение предлога עַל — «на»; переход к единственному числу согласован с распределительным «каждый… свою жаровню».
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: и принесёт пред Яхве
  rationale: В культовом контексте Hiphil קרב означает принести или представить перед Богом. «Пред» сохраняет достоинство регистра и устойчиво передаёт לִפְנֵי.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: всего двести пятьдесят жаровен
  rationale: Число относится к жаровням группы Корея. «Всего» естественно поясняет итоговое количество, не меняя смысла.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: также ты и Аарон — каждый свою жаровню
  rationale: Сжатая безглагольная распределительная конструкция сохранена с помощью тире; «также» показывает присоединение Моисея и Аарона к предписанному действию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом; традиционные варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «пред Яхве». Повтор «жаровню» сохранён ради распределительной структуры и ритуальной конкретности исходного текста.
