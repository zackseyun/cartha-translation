base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: ru
  text: Если эти люди умрут той смертью, какой умирают все люди, и их постигнет участь, постигающая всех людей[a], то Яхве не посылал меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и посещение всех людей посетит их». В еврейском употреблены существительное и глагол от одного корня פקד; он может означать посещение, назначение или то, что кого-либо постигает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Простой условный союз естественно вводит условие, по которому Моисей предлагает судить о своём посланничестве.
- source_word: כְּמוֹת כָּל־הָאָדָם יְמֻתוּן אֵלֶּה
  choice: эти люди умрут такой же смертью, как все люди
  rationale: Передаёт сравнительную конструкцию с כְּמוֹת и собирательное значение הָאָדָם, сохраняя смысл обычной человеческой смерти без неестественного русского оборота «умрут смертью всех людей».
- source_word: וּפְקֻדַּת כָּל־הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: их постигнет обычная человеческая участь[a]
  rationale: Естественно передаёт то, что обычно выпадает на долю людей. Смысловой диапазон корня פקד шире, а повтор однокоренных слов в еврейском отмечен в сноске.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: не Яхве послал меня
  rationale: 'Сохраняет отрицание и возможное смысловое выделение подлежащего: при обычном исходе источником посланничества Моисея был бы не Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Обычная человеческая участь или определённое наказание
  choice: обычная человеческая участь
  alternative: наказание, постигающее всех людей; посещение всех людей
  rationale: Контекст противопоставляет обычный исход необычному суду, но само פְּקֻדָּה допускает значения посещения, назначения и того, что выпадает человеку. Перевод не сужает его до наказания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Повтор «люди» сохранён ради ясности коллективного значения; тяжеловесная этимологическая фигура с корнем פקד вынесена в сноску.
