  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: ru
  text: 'И сказал Моисей Корею: «Ты и вся твоя община будьте завтра перед Яхве — ты, они и Аарон[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будьте завтра в присутствии Яхве». В еврейском тексте стороны перечислены повторно и явно: «ты, они и Аарон».'
    reason: lexical_alternative; source_form
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל־קֹרַח
  choice: И сказал Моисей Корею
  rationale: Сохранено обычное для еврейского повествования соединение с предыдущим контекстом; адресат естественно передан дательным падежом.
- source_word: אַתָּה וְכָל־עֲדָתְךָ
  choice: ты и всё твоё общество
  rationale: עֵדָה обозначает собравшуюся общину или группу; «общество» здесь понятно современному читателю и не придаёт выражению специально церковного оттенка.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: будьте пред Яхве
  rationale: Императив היה буквально означает «будьте», а לִפְנֵי — «пред, в присутствии». Формулировка сохраняет лаконичность и торжественность оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, поскольку в еврейском тексте непосредственно стоит тетраграмматон.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: ты, они и Аарон
  rationale: Сохранено повторное и подчёркнутое перечисление всех сторон, которым надлежит явиться.
- source_word: מָחָר
  choice: завтра
  rationale: Обычное современное соответствие наречию времени; позиция в русском предложении обеспечивает естественный порядок слов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал употребляет собственное имя Бога. «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Характер пребывания перед Яхве
  choice: будьте пред Яхве
  alternative: предстаньте перед Яхве
  rationale: 'Буквальное «будьте» сохраняет открытость выражения: речь может идти как о присутствии, так и о явке для испытания. Более истолковывающее «предстаньте» не внесено в основной текст.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Форма «пред Яхве» выбрана как краткая и естественная в данном регистре; синтаксический повтор оригинала сохранён.
