  source_fidelity: 'Смысл и синтаксическое членение еврейского текста в целом переданы верно: Моисей обращается к Корею, велит ему и всей его общине быть перед Яхве на следующий день и затем повторно перечисляет стороны. Однако «общество» в этом контексте менее точно и менее естественно, чем «община», а «пред» имеет ощутимо архаическую окраску для заявленного современного литературного регистра.'
