  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וַ/יֵּ֖לֶךְ אֶל דָּתָ֣ן וַ/אֲבִירָ֑ם וַ/יֵּלְכ֥וּ אַחֲרָ֖י/ו זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: ru
  text: Тогда Моисей встал и пошёл к Дафану и Авирону, а старейшины Израиля пошли за ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «последовали за ним». Буквально: «пошли за ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: 'Форма глагола קום обозначает последовательное действие: Моисей поднялся, чтобы действовать. «Встал» естественно и точно передаёт это в русском повествовании.'
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Глагол הלך обычно означает движение — «идти, пойти». Здесь «пошёл» естественно передаёт новое действие в повествовательной последовательности, не уточняя способ движения.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает движение по направлению к людям; русский предлог «к» соответствует этому употреблению.
- source_word: דָּתָן וַאֲבִירָם
  choice: Дафан и Авирон
  rationale: Использованы закрепившиеся в русской библейской традиции формы личных имён, узнаваемые современным читателем.
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Повтор глагола הלך сохранён. В сочетании со словами אַחֲרָיו он буквально создаёт образ движения вслед за Моисеем.
- source_word: אַחֲרָיו
  choice: за ним
  rationale: Выражение обозначает движение вслед за Моисеем. «За ним» естественно по-русски и сохраняет конкретный образ исходного текста.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшины Израиля
  rationale: Сочетание обозначает признанных старших представителей или руководителей Израиля; «старейшины Израиля» — прозрачный и общепринятый русский эквивалент.
- source_word: וַ
  choice: Тогда
  rationale: Начальный союз продвигает последовательность повествования. «Тогда» передаёт переход к следующему действию естественнее, чем механическое «и».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Сохранён повтор глагола «пошёл/пошли» и образ движения «за ним»; союз «а» естественно связывает действия Моисея и старейшин без внесения противопоставления.
