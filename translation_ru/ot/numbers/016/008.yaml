  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: ru
  text: 'И сказал Моисей Корею: «Послушайте же, сыны Левия!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вайиктоль продолжает повествовательную последовательность; обычная русская библейская формула «И сказал» здесь естественна и сохраняет связь с предыдущим контекстом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: אֶל־קֹרַח
  choice: Корею
  rationale: Предлог אֶל обозначает адресата речи; в современном русском это естественно передаётся дательным падежом без отдельного предлога. «Корей» — традиционная русская форма имени קֹרַח.
- source_word: שִׁמְעוּ
  choice: Послушайте
  rationale: Императив множественного числа означает призыв внимательно выслушать говорящего; «послушайте» естественно передаёт направленное обращение.
- source_word: נָא
  choice: же
  rationale: Частица выражает настойчивое побуждение или смягчённый призыв. В данном обличительном контексте русское «же» передаёт усиление естественнее, чем вежливое «пожалуйста» или временное «теперь».
- source_word: בְּנֵי לֵוִי
  choice: сыны Левия
  rationale: Буквально «сыновья Левия»; форма «сыны Левия» сохраняет мужской род, родовую принадлежность и возвышенный тон прямого обращения.
theological_decisions:
- issue: Родовое обозначение в прямом обращении
  choice: сыны Левия
  alternative: левиты; потомки Левия
  rationale: Еврейский текст использует мужское בְּנֵי, буквально «сыновья/сыны». Перевод сохраняет родовой образ и мужскую форму, не заменяя их более общим этнонимом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Послушайте же» звучит настойчиво, но не разговорно; «сыны Левия» сохраняет образность оригинала и уместную торжественность.
