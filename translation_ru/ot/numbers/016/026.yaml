  source_fidelity: 'В целом перевод точно передаёт обращение к общине, повеление удалиться, запрет касаться имущества и предупреждение о гибели. Однако «вместе со всеми их грехами» в русском языке создаёт неестественный и смыслово неясный образ: люди могут быть сметены вместе с грехами как объектами. Еврейское בְּכָל־חַטֹּאתָם допускает связь с грехами как обстоятельство/основание, но не требует такого буквального «вместе».'
  naturalness: '«Он сказал общине» и «Прошу вас, отойдите» естественны в современном литературном библейском регистре. Следует заменить тяжёлую конструкцию «чтобы вам не быть сметёнными» на более прямую: «иначе вы будете сметены».'
  terminology: «Община», «шатры», «нечестивые люди» и «прикасайтесь» уместны и соответствуют регистру. «Сметены» хорошо передаёт пассивно-судебный оттенок נִסְפּוּ. Формулировка «за все их грехи» естественно выражает допустимый причинный смысл בְּ и не вносит конфессионального истолкования.
