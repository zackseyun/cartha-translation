base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: ru
  text: 'Он сказал общине: «Прошу вас, отойдите от шатров этих нечестивых людей и не прикасайтесь ни к чему, что им принадлежит, иначе вы будете сметены за все их грехи[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иначе вы будете сметены при всех их грехах». Еврейский предлог может указывать на связь с их грехами как на обстоятельство, а не только на причину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: общине
  rationale: Слово עֵדָה обозначает собравшееся общество Израиля; «община» естественно передаёт его собирательный смысл в повествовании Пятикнижия.
- source_word: סוּרוּ נָא
  choice: Прошу вас, отойдите
  rationale: Императив סוּרוּ требует удалиться, а частица נָא придаёт просьбе настойчивый, но вежливый оттенок; она не обязательно означает «сейчас».
- source_word: מֵעַל אָהֳלֵי
  choice: от шатров
  rationale: Предлог מֵעַל здесь идиоматически указывает на удаление от места возле шатров, а не буквально с их поверхности.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: этих нечестивых людей
  rationale: רְשָׁעִים имеет нравственно-судебный смысл «нечестивые, виновные»; «нечестивые» сохраняет библейскую весомость и понятно современному читателю.
- source_word: וְאַל תִּגְּעוּ
  choice: и не прикасайтесь
  rationale: Прямой запрет естественно передаёт основное значение глагола נגע — «касаться, вступать в соприкосновение».
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: ни к чему, что им принадлежит
  rationale: После отрицательного повеления эта конструкция естественно выражает полный запрет касаться любого их имущества.
- source_word: פֶּן תִּסָּפוּ
  choice: чтобы вам не быть сметёнными
  rationale: Нифаль глагола ספה означает быть сметённым или уничтоженным судом. Образ «сметёнными» сохраняет пассивность и опасность оказаться захваченными грядущей гибелью.
- source_word: בְּכָל חַטֹּאתָם
  choice: вместе со всеми их грехами
  rationale: Предлог ב допускает оттенок сопричастности или обстоятельства. Такой перевод сохраняет связь гибели с их грехами, не сводя её безоговорочно только к причинному значению.
theological_decisions:
- issue: Общая участь в суде из-за близости к нечестивым
  choice: Предупреждение требует отделиться от нечестивых и их имущества, чтобы не быть сметёнными вместе с тем, что связано с их грехами.
  alternative: «Чтобы вы не погибли из-за всех их грехов».
  rationale: Еврейский текст связывает опасность народа как с близостью и сопричастностью, так и с грехами мятежников как причиной суда. Основной текст сохраняет эту напряжённость, а сноска отмечает допустимый причинный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Шатры» и «нечестивые» сохраняют достоинство регистра, оставаясь понятными обычному читателю; синтаксис прямой и естественный.
