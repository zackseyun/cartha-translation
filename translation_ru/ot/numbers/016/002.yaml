base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: ru
  text: и выступили перед Моисеем вместе с двумястами пятьюдесятью мужами из сынов Израиля[a] — вождями общины, созываемыми на собрание[b], людьми именитыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из израильтян». Буквально: «из сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «призываемыми на назначенное собрание». Возможно, речь идёт о людях, которых официально созывали для участия в собрании общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ לִפְנֵי
  choice: выступили перед
  rationale: Передаёт действие קום и пространственно-отношенческое значение לִפְנֵי, позволяя контексту выразить противостояние, но не вкладывая значение «восстали против» непосредственно в глагол.
- source_word: וַאֲנָשִׁים
  choice: вместе с ... мужами
  rationale: Сглаживает эллиптическое еврейское построение и ясно связывает двести пятьдесят мужей с теми, кто выступил перед Моисеем.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: из сынов Израиля
  rationale: Сохраняет форму заветного обозначения בְּנֵי יִשְׂרָאֵל и прямо указывает, что речь идёт о мужчинах; более идиоматичный вариант дан в сноске.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: двумястами пятьюдесятью
  rationale: Нормативная современная русская форма составного числительного в творительном падеже после «с».
- source_word: נְשִׂיאֵי עֵדָה
  choice: вождями общины
  rationale: «Вожди» передаёт статус נְשִׂיאִים как признанных руководителей, а «община» естественно выражает собирательное עֵדָה.
- source_word: קְרִאֵי מוֹעֵד
  choice: созываемыми на собрание
  rationale: Передаёт пассивное значение קְרִאֵי и институциональный смысл מוֹעֵד, не уточняя сверх текста характер собрания.
- source_word: אַנְשֵׁי שֵׁם
  choice: людьми именитыми
  rationale: Естественный русский эквивалент еврейской идиомы «люди имени», обозначающей известных и уважаемых людей.
theological_decisions:
- issue: Имеет ли לִפְנֵי здесь прямое значение «против»?
  choice: выступили перед Моисеем
  alternative: восстали против Моисея
  rationale: Контекст предполагает конфронтацию, однако сама предложная конструкция буквально означает «перед, в присутствии». Перевод сохраняет эту смысловую напряжённость и не усиливает формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок приложений сохранён близким к еврейскому; тире помогает ясно связать последующие характеристики с двумястами пятьюдесятью мужами.
