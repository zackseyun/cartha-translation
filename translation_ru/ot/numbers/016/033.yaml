    rationale: Это естественный русский оборот, но он менее прямо отражает глагол אבד («исчезли, погибли») и предлог מִתּוֹךְ («из среды»). Замена сохраняет исходную неопределённость относительно точного оттенка глагола и делает пространственное удаление явнее.
