review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт движение вниз, состояние «живыми», широту выражения «они и всё, что им принадлежало», покрытие землёй и удаление из общины. Однако «не стало их среди собрания» несколько смягчает и переформулирует וַיֹּאבְדוּ («они погибли / исчезли») и менее явно передаёт направление מִתּוֹךְ («из среды»).
  naturalness: «Так они живыми сошли в шеол» понятно, но вставное уточнение «они и всё, что им принадлежало» естественнее выделить парными тире. «Исчезли из среды собрания» — современно-литературная и ясная формулировка.
  terminology: «Шеол» с малой буквы и сноска с вариантами «могила» и «царство мёртвых» уместны; транслитерация не навязывает позднейших богословских коннотаций. «Собрание» хорошо передаёт קָהָל.
