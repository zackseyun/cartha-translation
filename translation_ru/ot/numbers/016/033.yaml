base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: ru
  text: Так они — они и всё, что им принадлежало, — живыми сошли в шеол[a]; земля покрыла их, и они исчезли из среды собрания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу»; также возможно: «в царство мёртвых». Евр. шеол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: сошли
  rationale: Глагол ירד обозначает движение вниз; «сошли» естественно передаёт это направление и повествовательную последовательность.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: они и всё, что им принадлежало
  rationale: Формулировка сохраняет широту еврейского выражения, не ограничивая его только людьми или только имуществом.
- source_word: חַיִּים
  choice: живыми
  rationale: 'Творительный падеж естественно выражает предикативный смысл: они сошли туда, оставаясь живыми.'
- source_word: שְׁאֹלָה
  choice: в шеол
  rationale: Транслитерация сохраняет особое древнееврейское понятие, а предлог «в» передаёт направительный суффикс -ה.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: земля покрыла их
  rationale: Прямой и образный перевод конструкции с землёй в роли подлежащего; значение предлога עַל естественно включено в русское управление глагола «покрыла».
- source_word: וַיֹּאבְדוּ מִתּוֹךְ הַקָּהָל
  choice: не стало их среди собрания
  rationale: Естественный русский оборот передаёт одновременно гибель/исчезновение и удаление из среды общины, не превращая непереходный глагол в явно пассивное «были уничтожены».
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; царство мёртвых
  rationale: Транслитерация не сводит понятие к отдельной могиле и не привносит более позднее систематизированное представление об аде; основные смысловые варианты указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов упрощён ради ясности, а тире сохраняет пояснительное выделение подлежащих исходного текста.
