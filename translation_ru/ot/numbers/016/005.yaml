  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: ru
  text: 'Он сказал Корею и всей его общине: «Утром Яхве покажет, кто принадлежит ему, кто свят, и приблизит его к себе. Кого он изберёт, того и приблизит к себе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал он
  rationale: Глагол דבר означает речь или обращение; в русском повествовании формула «сказал…:» естественно вводит прямую речь и не утяжеляет фразу сочетанием «говорил, говоря».
- source_word: עֲדָתוֹ
  choice: всей его общине
  rationale: עֵדָה обозначает собравшееся сообщество. «Община» передаёт групповой характер обозначения без добавочной отрицательной окраски слова «сборище».
- source_word: בֹּקֶר
  choice: Утром
  rationale: Существительное употреблено обстоятельственно; краткое «утром» естественно передаёт временное значение.
- source_word: וְיֹדַע יְהוָה
  choice: Яхве даст узнать
  rationale: Формально ידע значит «знать, познать», однако здесь контекст ожидаемого испытания указывает на открытое обнаружение или явление того, кого признаёт Яхве. Формулировка сохраняет связь с глаголом знания, а буквальная возможность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: кто принадлежит Ему
  rationale: Передаёт буквально-посессивный смысл «кто Его» естественным современным русским языком.
- source_word: הַקָּדוֹשׁ
  choice: кто свят
  rationale: Субстантивированное прилагательное обозначает человека, отделённого для священного служения; перевод сохраняет параллелизм с «кто принадлежит Ему».
- source_word: וְהִקְרִיב אֵלָיו
  choice: и приблизит того к Себе
  rationale: Каузативная форма קרב означает допустить или привести ближе, особенно к священному присутствию. Повтор глагола сохранён.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Кого Он изберёт
  rationale: בחר обозначает выбор; «изберёт» сохраняет торжественный регистр и личный характер выбора.
- source_word: יַקְרִיב אֵלָיו
  choice: того и приблизит к Себе
  rationale: Повторяет культовую формулировку оригинала; частица «и» в конструкции «того и» естественно подчёркивает соответствие избрания и допуска.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Смысл וְיֹדַע применительно к выявлению избранного
  choice: даст узнать
  alternative: узнает / знает
  rationale: Контекст обещает публичное выявление того, кто принадлежит Яхве и допущен к Нему. При этом буквальное значение «узнает/познает» не исключено и сохранено в примечании как реальная смысловая возможность.
- issue: Значение приближения к Яхве
  choice: приблизит к Себе
  alternative: допустит к Себе для священного служения
  rationale: Оставлена образная и культовая формулировка оригинала без внесения в основной текст более узкого толкования; служебный смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для прямой речи, при этом сохранены параллелизм, повтор «приблизит» и неразрешённая полностью смысловая напряжённость глагола ידע.
