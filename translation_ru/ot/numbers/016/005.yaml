revisions:
- from: 'И сказал он Корею и всей его общине: «Утром Яхве даст узнать[a], кто принадлежит Ему и кто свят, и приблизит того к Себе[b]. Кого Он изберёт, того и приблизит к Себе».'
  to: 'Он сказал Корею и всей его общине: «Утром Яхве покажет, кто принадлежит ему, кто свят, и приблизит его к себе. Кого он изберёт, того и приблизит к себе».'
  rationale: 'Исправлены естественность русской фразы и согласованность сносок при сохранении структуры, повторов и культового смысла еврейского текста. Сноски сохраняются на тех же смысловых узлах: после «покажет» и после первого «приблизит».'
