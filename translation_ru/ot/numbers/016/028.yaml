  rationale: Исправлены незавершённая пунктуация и неестественное «это было не от моего сердца». «По этому знамению» ясно передаёт указательное «по этому» в контексте ожидаемого знамения. Союз «ибо» отражает возможную и наиболее естественную в данном русском контексте пояснительную функцию второго כִּי; сноска сохраняет буквальный образ еврейского текста и объясняет его без конфессионального истолкования.
