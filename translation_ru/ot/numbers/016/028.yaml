  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: ru
  text: 'И сказал Моисей: «По этому знамению вы узнаете, что Яхве послал меня совершить все эти дела, ибо я совершаю их не по собственному почину[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не от моего сердца»; то есть не по собственной инициативе и не по собственной воле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: И сказал Моисей
  rationale: Сохраняет обычное для еврейского повествования присоединительное начало и естественно звучит в русском библейском повествовании.
- source_word: בְּזֹאת
  choice: По этому
  rationale: Передаёт указание на предстоящее знамение или событие как основание, по которому слушатели узнают истинность слов Моисея.
- source_word: תֵּדְעוּן
  choice: вы узнаете
  rationale: Форма 2-го лица множественного числа имеет здесь естественное будущее значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно личное имя Бога, стоящее в еврейском тексте.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Простое прошедшее время естественно передаёт совершившееся поручение, актуальность которого раскрывается в контексте.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: совершить все эти дела
  rationale: «Совершить» и «дела» естественно и достаточно конкретно передают עשה и מַעֲשִׂים, не сужая их до чудес или иных специальных действий.
- source_word: כִּי לֹא מִלִּבִּי
  choice: и что это было не от моего сердца
  rationale: Второе כִּי понято как ещё одно изъяснительное содержание при «узнаете»; буквальный образ сердца сохранён, а его идиоматический смысл пояснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет это различие без замены титулом.
- issue: Синтаксическая роль второго כִּי
  choice: «и что» — второе содержание того, что слушатели узнают
  alternative: «ведь / ибо» — основание предшествующего утверждения
  rationale: 'Еврейская конструкция допускает оба понимания. Выбранное чтение связывает обе части с תֵּדְעוּן и естественно передаёт параллельные утверждения: Моисей послан Яхве, а действия исходят не от него самого.'
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Буквальный образ «не от моего сердца» сохранён ради близости к исходному тексту и снабжён ясным пояснением.
