base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: ru
  text: 'Они собрались против Моисея и Аарона и сказали им: «Вы зашли слишком далеко![a] Ведь вся община — все до одного — святы, и Яхве среди них. Почему же вы возвышаете себя над собранием Яхве?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Слишком много для вас!» или «Довольно вам!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: Они собрались против Моисея и Аарона
  rationale: Нифаль глагола קהל передаёт совместное, намеренное собрание, а עַל в данном конфликтном контексте — направленность против Моисея и Аарона.
- source_word: רַב לָכֶם
  choice: Полно вам!
  rationale: Краткая русская идиома сохраняет резкость упрёка и близка буквальному значению «довольно вам / слишком много для вас», не уточняя сверх текста, в чём именно они зашли слишком далеко.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: вся община — все до одного —
  rationale: Повтор сохраняет подчёркнутую всеобщность исходного выражения; тире естественно передают вставное усиление.
- source_word: קְדֹשִׁים
  choice: святы
  rationale: Обычный и богословски весомый эквивалент קדושׁ; утверждение передано прямо как речь мятежников, без добавленной оценки.
- source_word: וּבְתוֹכָם יְהוָה
  choice: и Яхве среди них
  rationale: «Среди них» ясно выражает пребывание Бога внутри общины; личное имя יהוה передано как «Яхве».
- source_word: וּמַדּוּעַ תִּתְנַשְּׂאוּ
  choice: Почему же вы возвышаете себя
  rationale: 'Частица «же» передаёт вывод из предшествующего довода, а возвратная форма сохраняет значение хитпаэля: самовозвышение.'
- source_word: עַל קְהַל יְהוָה
  choice: над собранием Яхве
  rationale: При глаголе самовозвышения עַל обозначает положение над кем-либо; «собрание» передаёт קהל и сохраняет его отличие от עֵדָה — «община».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Статус заявления «все... святы»
  choice: Передать без поясняющей оценки
  alternative: Добавить оговорку, ослабляющую или подтверждающую заявление
  rationale: Это прямая речь участников мятежа. Перевод сохраняет богословское напряжение и оставляет оценку заявления дальнейшему повествованию.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой библейской речи. «Полно вам!» звучит резко и естественно, но не вводит отсутствующего в оригинале уточнения. Различие между עֵדָה («община») и קהל («собрание») сохранено.
