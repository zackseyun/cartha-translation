  source_fidelity: 'Смысловой строй и все ключевые элементы еврейского текста переданы точно: намеренное выступление против Моисея и Аарона, усиленная всеобщность «вся община — все до одного», святость общины, присутствие Яхве среди неё и упрёк в самовозвышении над собранием Яхве. Различение עֵדָה («община») и קהל («собрание») удачно сохранено. «Полно вам!» передаёт רַב לָכֶם близко, однако для современного литературного русского это несколько архаичная формула.'
