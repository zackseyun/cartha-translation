  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: ru
  text: 'Моисей сильно разгневался и сказал Яхве: «Не обрати взора на их приношение.[a] Я не взял у них ни одного осла и никому из них не причинил зла».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не удостой вниманием их приношение»; по смыслу возможно: «Не прими их приношения». Буквально: «Не обратись к их приношению».'
    reason: 'Лексическая неоднозначность выражения פנה אל: оно буквально описывает обращение к чему-либо, но может означать благосклонное внимание или принятие.'
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Моисей сильно разгневался
  rationale: Естественно передаёт древнееврейскую идиому о воспламенившемся гневе и сохраняет усиление מְאֹד («сильно»).
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Не обрати взора на их приношение
  rationale: Сохраняет образ поворота к чему-либо, выраженный פנה אל, и вместе с тем естественно передаёт подразумеваемый смысл благосклонного внимания.
- source_word: מִנְחָתָם
  choice: их приношение
  rationale: «Приношение» сохраняет широкое значение מִנְחָה и не уточняет без необходимости, что речь идёт именно о хлебном приношении.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Я не взял у них ни одного осла
  rationale: Передаёт конкретное отрицание материального злоупотребления и эмфатическое אֶחָד («ни одного»).
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: и никому из них не причинил зла
  rationale: Точно передаёт каузативный смысл формы от רעע — причинить зло или вред — и сохраняет охват каждого человека.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет его, не подменяя титулом.
- issue: Смысл просьбы אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Не обрати взора на их приношение
  alternative: Не прими их приношения; не удостой вниманием их приношение
  rationale: Выбранный вариант сохраняет исходную метафору и не устраняет неоднозначность между вниманием к приношению и его благосклонным принятием.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан естественным, конкретные образы оригинала сохранены; богословская неоднозначность просьбы о приношении отмечена в сноске.
