  source_fidelity: 'Текст точно передаёт все основные элементы масоретского текста: сильный гнев Моисея, обращение к Яхве, просьбу не обратить благосклонного внимания на приношение противников, а также отрицание материального присвоения и причинения вреда кому-либо из них. «Не обрати взора на» удачно сохраняет образ פנה אל, не сводя его преждевременно к «не прими».'
