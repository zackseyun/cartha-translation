  text: זֹ֖את עֲשׂ֑וּ קְחוּ לָ/כֶ֣ם מַחְתּ֔וֹת קֹ֖רַח וְ/כָל עֲדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: ru
  text: 'Сделайте вот что: возьмите себе кадильницы[a], Корей и всё его собрание[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды для углей». Еврейское слово обозначает сосуды, в которых переносили горящие угли, особенно при воскурении благовоний.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и вся его община»; также возможно: «и все его сторонники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Сделайте вот что
  rationale: Указательное местоимение относится к последующему предписанию; эта русская конструкция естественно передаёт вводную формулу повеления.
- source_word: קְחוּ לָכֶם
  choice: возьмите себе
  rationale: 'Повелительное наклонение передано прямо, а дательный «себе» сохраняет возвратный оттенок לָכֶם: сосуды следует взять для собственного участия в предстоящем действии.'
- source_word: מַחְתּוֹת
  choice: кадильницы
  rationale: В данном культовом контексте речь идёт о сосудах для горящих углей и воскурения благовоний; «кадильницы» — понятный и точный русский эквивалент.
- source_word: קֹרַח
  choice: Корей
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וְכָל עֲדָתוֹ
  choice: и всё его собрание
  rationale: עֵדָה обозначает собравшуюся общину или группу; «собрание» сохраняет широту значения и естественно звучит по-русски.
