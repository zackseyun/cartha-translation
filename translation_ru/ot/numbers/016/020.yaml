  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: יהוה (YHWH); традиционно передаётся: «Господь».'
    reason: Уточняет еврейское написание Божьего имени и традиционную русскую передачу титулом.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в повествовательной форме вводит очередную речь. В русском языке формула «сказал…» естественнее буквального «говорил…» и при этом точно передаёт функцию формы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Дательный падеж естественно обозначает обоих адресатов речи; повтор предлога אֶל не требует неестественного повторения в русском.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Еврейская формула, дословно «говоря», вводит последующую прямую речь. В современном русском её функцию естественно передаёт двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом; примечание указывает еврейское написание.
translation_notes:
  register: Современный литературный русский, краткая и торжественная повествовательная формула. Причастная калька «говоря» устранена как неестественная; её функцию выполняет двоеточие.
