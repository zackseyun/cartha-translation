  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: ru
  text: Неужели вам мало того, что Бог Израиля отделил вас от общины Израиля, чтобы приблизить вас к Себе, чтобы вы совершали служение при скинии Яхве и стояли перед общиной, служа ей?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве это малость для вас…?» Еврейский риторический оборот также может передаваться: «Неужели вам недостаточно…?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: Неужели вам мало того
  rationale: 'Естественно передаёт риторический вопрос и упрёк: уже оказанная привилегия не должна казаться недостаточной. Формально возможное «разве это малость для вас» по-русски менее естественно.'
- source_word: כִּי
  choice: того, что
  rationale: Вводит содержание риторического вопроса после הַמְעַט, а не самостоятельную причинную придаточную часть.
- source_word: הִבְדִּיל
  choice: отделил
  rationale: Прямо передаёт каузативное значение глагола בדל и сохраняет контраст с остальной общиной Израиля, не усиливая культовый оттенок выражением «избрал».
- source_word: עֲדַת יִשְׂרָאֵל
  choice: общины Израиля
  rationale: «Община» естественно обозначает здесь народ как организованное собрание и подходит к обоим употреблениям עֵדָה в стихе.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: приблизил вас к Себе
  rationale: Сохраняет культово-пространственный и личный смысл קרב, не превращая левитов в явно названное жертвенное приношение.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: чтобы вы исполняли служение при скинии Яхве
  rationale: Передаёт сочетание однокоренных עבד и עֲבֹדָה естественным современным русским оборотом; «при скинии» ясно указывает на установленное культовое служение.
- source_word: מִשְׁכַּן
  choice: скиния
  rationale: Устоявшееся русское обозначение переносного святилища Израиля в пустыне.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: и стояли перед общиной
  rationale: Близко и естественно передаёт официальный характер служения левитов перед собранием народа.
- source_word: לְשָׁרְתָם
  choice: служа ей
  rationale: Сохраняет значение официального, вспомогательного служения. Местоимение во множественном числе в еврейском относится к членам общины; русское согласование с собирательным существительным «община» требует единственного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер приближения левитов к Богу
  choice: приблизил вас к Себе
  alternative: представил вас Себе; допустил вас к Себе
  rationale: Формулировка сохраняет культовую и пространственную образность корня קרב, не уточняя сверх текста, идёт ли речь прежде всего о посвящении, представительстве или доступе.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Риторический упрёк передан естественным оборотом «Неужели вам мало того». Синтаксис немного уплотнён: три инфинитивные цели еврейского текста выражены последовательными русскими глагольными формами. Термины «община», «служение», «скиния» сохраняют общественно-культовый контекст без архаизации.'
