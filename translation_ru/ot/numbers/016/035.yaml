  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: ru
  text: И вышел огонь от Яхве и поглотил двести пятьдесят человек, приносивших благовонное курение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: И… огонь
  rationale: אֵשׁ означает «огонь»; союз ו передаёт продолжение повествования и естественно переводится как «и».
- source_word: יָצְאָה
  choice: вышел
  rationale: Форма глагола יצא означает «выйти»; сочетание «вышел огонь» естественно передаёт движение огня от божественного присутствия.
- source_word: מֵ/אֵת יְהוָה
  choice: от Яхве
  rationale: Конструкция מֵאֵת указывает на источник или происхождение, а имя יהוה передано как «Яхве», сохраняя личное имя Бога.
- source_word: וַ/תֹּאכַל
  choice: и поглотил
  rationale: Глагол אכל буквально означает «есть», но при подлежащем «огонь» идиоматически значит «поглотить, истребить огнём».
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: двести пятьдесят человек
  rationale: Еврейское числительное обозначает точное число людей; современная русская форма звучит ясно и естественно.
- source_word: מַקְרִיבֵי
  choice: приносивших
  rationale: Причастие породы hифиль от קרב характеризует этих людей по совершаемому ими действию; русское действительное причастие сохраняет сжатость исходной конструкции.
- source_word: הַ/קְּטֹרֶת
  choice: благовоние
  rationale: קְטֹרֶת обозначает культовое ароматическое воскурение; «благовоние» — понятный и уместный библейский термин в данном контексте.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблено личное имя יהוה. Передача «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Образ действия огня
  choice: поглотил
  alternative: сжёг
  rationale: «Поглотил» сохраняет образность глагола אכל и не уточняет механизм гибели сверх сказанного в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Синтаксис близок к еврейскому оригиналу без неестественной буквальности.
