lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И ... сказал
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; союз «И» сохраняет обычное начало древнееврейской речевой формулы, а «сказал» естественно звучит по-русски перед прямой речью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В этой устойчивой формуле инфинитив вводит последующую прямую речь; в современном русском его функцию естественно передаёт двоеточие без избыточного «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Форма «Яхве» сохраняет имя и соответствует современной научной реконструкции произношения, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная повествовательная формула. Двоеточие естественно связывает стих с прямой речью следующего стиха.
