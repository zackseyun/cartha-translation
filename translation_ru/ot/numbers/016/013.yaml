  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: ru
  text: Разве мало того, что ты вывел нас из земли, где текут молоко и мёд, чтобы убить нас в пустыне,[a] — неужели ты ещё и властвовать над нами будешь?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Говорящие с горькой иронией называют Египет «землёй, где текут молоко и мёд» — словами, которыми обычно описывается обетованная земля.
    reason: cultural_note
  - marker: b
    text: 'Или: «неужели ты ещё и господствовать над нами будешь?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Разве мало того
  rationale: Естественно передаёт риторический вопрос, выражающий возмущение.
- source_word: הֶעֱלִיתָנוּ
  choice: ты вывел нас
  rationale: Каузативная форма עלה означает «поднять/вывести»; в контексте исхода по-русски естественно «вывел», при этом сохраняется ироническое переиначивание исхода из Египта.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: из земли, где текут молоко и мёд
  rationale: Сохраняет устойчивый библейский образ изобилия и его намеренно ироническое применение к Египту.
- source_word: לַהֲמִיתֵנוּ
  choice: чтобы умертвить нас
  rationale: Прямо передаёт инфинитив цели; «умертвить» соответствует достоинству регистра и обвинительному тону.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и понятное русское соответствие מִדְבָּר в повествовании о странствиях Израиля.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: властвовать над нами хочешь
  rationale: Глагол означает осуществлять власть или господствовать; сочетание личной формы с абсолютным инфинитивом усиливает обвинение. Русская конструкция с вынесенным инфинитивом передаёт эмфазу естественно.
- source_word: גַּם
  choice: так ты ещё и
  rationale: Ясно отмечает присоединение второго обвинения к первому.
theological_decisions:
- issue: Ироническое наименование Египта «землёй, где текут молоко и мёд»
  choice: Сохранить образ буквально в основном тексте
  alternative: 'Явно обозначить сарказм в тексте, например: «из земли, которую мы могли бы назвать землёй молока и мёда»'
  rationale: 'Ирония возникает из контекста: мятежники применяют к Египту описание обетованной земли. Явное пояснение в основном тексте сняло бы напряжение, которого нет в формулировке оригинала.'
- issue: Характер обвинения Моисея во второй части стиха
  choice: «властвовать над нами хочешь»
  alternative: «самовластно господствовать над нами»
  rationale: Выбранный вариант сохраняет обвинение в присвоении власти, не добавляя моральной характеристики, прямо не выраженной корнем שׂרר.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторический вопрос и нарастающее обвинение переданы одной фразой; тире обозначает переход ко второй, усиленной претензии. Все примечания отмечены в основном тексте.
