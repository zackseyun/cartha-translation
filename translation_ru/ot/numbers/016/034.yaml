lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: И все израильтяне
  rationale: Передаёт собирательное «весь Израиль» естественным современным русским языком и в данном контексте обозначает людей из народа Израиля.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: находившиеся вокруг них
  rationale: Точно определяет израильтян, бывших поблизости от тех, кого постиг суд, не создавая впечатления намеренного окружения.
- source_word: נָסוּ
  choice: побежали
  rationale: Глагол נוּס означает поспешно спасаться бегством; «побежали» естественно передаёт срочность реакции.
- source_word: לְקֹלָם
  choice: от их крика
  rationale: קוֹל допускает значения «голос», «крик», «звук» и «шум». В контексте гибели людей «крик» наиболее естественен, а предлог «от» передаёт повод к бегству; более широкое значение отмечено в сноске.
- source_word: כִּי אָמְרוּ
  choice: потому что говорили
  rationale: כִּי вводит причину бегства. Несовершенный по виду русский глагол естественно представляет слова, которые люди произносили, убегая.
- source_word: פֶּן תִּבְלָעֵנוּ הָאָרֶץ
  choice: Как бы земля не поглотила и нас!
  rationale: Оборот «как бы… не» естественно выражает опасение, заключённое в פֶּן. «Поглотила» сохраняет яркий образ земли, разверзшейся в предшествующем рассказе; «и нас» передаёт включённость суффикса первого лица множественного числа и подразумеваемое сопоставление с уже погибшими.
