  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: ru
  text: И земля раскрыла свои уста и поглотила их, их семьи[a], всех людей Корея[b] и всё их имущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их дома». Еврейское слово может обозначать как жилища, так и семьи или домочадцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякого человека, принадлежавшего Корею». В еврейском тексте слово «человек» стоит в единственном числе, но употреблено собирательно.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: раскрыла
  rationale: Глагол פתח означает «открывать, раскрывать». Этот вариант точно передаёт действие, не добавляя более сильного образа раскалывания.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В данном контексте אֶרֶץ обозначает землю, которая образно раскрывает уста и поглощает людей.
- source_word: אֶת־פִּיהָ
  choice: свои уста
  rationale: Сохранён буквальный образ «уста земли»; литературное слово «уста» естественнее сочетается с этой олицетворяющей метафорой, чем «рот».
- source_word: וַתִּבְלַע
  choice: поглотила
  rationale: בלע буквально означает «глотать, поглощать». «Поглотила» естественно звучит применительно к земле и сохраняет исходный образ.
- source_word: בָּתֵּיהֶם
  choice: их семьи
  rationale: Буквально «их дома», но בַּיִת может метонимически обозначать семью или домочадцев. По контексту речь, вероятно, идёт о людях, входивших в их домашние сообщества; буквальная возможность отмечена в сноске.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: всех людей Корея
  rationale: Единственное число אָדָם употреблено собирательно. Русское «всех людей Корея» передаёт коллективный смысл и отношение принадлежности или связи, не уточняя его сверх текста.
- source_word: כָּל־הָרֲכוּשׁ
  choice: всё их имущество
  rationale: רְכוּשׁ обозначает имущество или нажитое добро. «Всё их имущество» — ясный и широкий современный эквивалент.
theological_decisions:
- issue: Собирательное значение אָדָם в выражении כָּל־הָאָדָם
  choice: всех людей Корея
  alternative: всякого человека, принадлежавшего Корею
  rationale: Хотя אָדָם имеет форму мужского рода единственного числа, сочетание с כָּל здесь носит собирательный характер. Основной текст передаёт это естественным русским множественным числом, а более формальное прочтение указано в сноске.
- issue: Значение בָּתֵּיהֶם
  choice: их семьи
  alternative: их дома
  rationale: Еврейское слово допускает как буквальное понимание строений, так и метонимическое обозначение домашних сообществ. Контекст поддерживает второе, но неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Выражение «раскрыла свои уста» сохраняет олицетворение оригинала, не делая весь стих архаичным.
