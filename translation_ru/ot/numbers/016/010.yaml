  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: ru
  text: Он приблизил к Себе тебя и вместе с тобой — всех твоих братьев, сыновей Левия[a], — а вы ещё и добиваетесь священства?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех твоих братьев-левитов».'
    reason: 'Лексико-синтаксическая альтернатива: בְנֵי לֵוִי можно передать буквально как «сыновья Левия» либо как обозначение группы — «левиты».'
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Он приблизил к Себе
  rationale: Глагол קרב в породе hифиль означает «приблизить, допустить». Формулировка сохраняет как пространственный образ приближения, так и подразумеваемое в контексте допущение к священному служению; «к Себе» естественно передаёт подразумеваемую направленность действия Бога.
- source_word: אֹתְךָ
  choice: тебя
  rationale: Местоимение второго лица мужского рода единственного числа обращено лично к Корею.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: и ... всех твоих братьев, сынов Левия
  rationale: «Братьев» передаёт אַחֶיךָ, а «сынов Левия» сохраняет приложение בְנֵי לֵוִי и обозначает соплеменников Корея из колена Левия.
- source_word: אִתָּךְ
  choice: вместе с тобой
  rationale: 'Передаёт совместность: остальные левиты были приближены наряду с Кореем.'
- source_word: וּבִקַּשְׁתֶּם
  choice: а вы добиваетесь
  rationale: Форма второго лица множественного числа обращена уже к Корею и его сообщникам. «Добиваетесь» естественно выражает настойчивое стремление получить положение, а союз «а» передаёт контекстуальное противопоставление уже дарованной привилегии.
- source_word: גַּם
  choice: ещё и
  rationale: 'Выражает добавление: помимо уже предоставленного левитского положения они стремятся также к священству.'
- source_word: כְּהֻנָּה
  choice: священства
  rationale: Слово обозначает священнический статус или служение; «священство» сохраняет институциональное отличие священников от прочих левитов.
theological_decisions:
- issue: Различие между положением левитов и священством
  choice: священства
  alternative: священнического служения
  rationale: «Священство» яснее сохраняет центральное для эпизода различие между уже дарованным левитским служением и священническим положением, которого добивалась группа Корея.
- issue: Риторический характер заключительной части
  choice: а вы добиваетесь ещё и священства?
  alternative: а вы добиваетесь ещё и священства.
  rationale: Хотя отдельной вопросительной частицы в еврейском тексте нет, контекст упрёка и синтаксис естественно допускают риторический вопрос. Вопросительная форма сохраняет напряжённость обращения, не превращая его в нейтральное сообщение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранена смена единственного числа («тебя») на множественное («вы»), важная для перехода от личного обращения к Корею к упрёку всей его группе.
