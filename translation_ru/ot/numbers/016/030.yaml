  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: ru
  text: Но если Яхве сотворит нечто небывалое[a], и земля разверзнет свои уста, поглотит их и всё, что им принадлежит, и они живыми сойдут в Шеол[b], то вы узнаете, что эти люди презрели Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сотворит нечто новое»; буквально: «сотворит творение». В еврейском тексте употреблены однокоренные существительное и глагол, подчёркивающие необычайное действие Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Шеол — древнееврейское название мира мёртвых; в более конкретном смысле возможно: «могила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: сотворит нечто небывалое
  rationale: Сочетание однокоренных существительного и глагола подчёркивает необычайное творческое действие Бога. По-русски «сотворит нечто небывалое» естественно передаёт и идею творения, и исключительную новизну события; буквальное «сотворит творение» было бы неестественным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: земля разверзнет свои уста
  rationale: «Земля» уместно передаёт אֲדָמָה как почву под ногами, а традиционно-достоинственное «разверзнет свои уста» сохраняет олицетворённый образ оригинала.
- source_word: וּבָלְעָה
  choice: поглотит
  rationale: Глагол точно и естественно передаёт образ земли, проглатывающей людей и всё принадлежащее им.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: всё, что им принадлежит
  rationale: Сохраняет широкий охват выражения, не ограничивая его только имуществом или только людьми.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: они живыми сойдут в шеол
  rationale: «Живыми» сохраняет смысловое ударение, «сойдут» передаёт направленность вниз, а «шеол» оставляет широту древнееврейского понятия.
- source_word: וִידַעְתֶּם
  choice: то вы узнаете
  rationale: В условной конструкции «то» естественно выражает следствие, заложенное в еврейской связке.
- source_word: נִאֲצוּ
  choice: презрели
  rationale: Передаёт сильный смысл презрительного отвержения и прямую направленность проступка против Яхве.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: эти люди
  rationale: В современном русском «люди» естественно обозначает названную группу мужчин, не ослабляя и не расширяя референцию контекста.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; царство мёртвых
  rationale: Древнееврейское слово может обозначать не только отдельную могилу, но и область пребывания умерших. Транслитерация сохраняет эту смысловую широту и не разрешает неоднозначность в пользу одной концепции.
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией, а не заменено титулом, что сохраняет форму и функцию исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Оборот «разверзнет свои уста» сохраняет яркий образ оригинала, оставаясь понятным; синтаксис условного предложения сделан плавным и естественным.
