lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ
  choice: И как только он закончил
  rationale: Конструкция с כְּ и инфинитивом передаёт непосредственное следование события; «как только» естественно выражает это по-русски.
- source_word: וַתִּבָּקַע
  choice: разверзлась
  rationale: Глагол בקע означает «расколоться, разверзнуться»; «разверзлась» точно и уместно для внезапного раскрытия земли.
- source_word: הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם
  choice: земля под ними
  rationale: Передаёт смысл буквально, но без тяжеловесного относительного оборота «земля, которая была под ними».
