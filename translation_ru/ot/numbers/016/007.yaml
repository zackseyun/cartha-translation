review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка: «на него» меняет множественный референт עֲלֵיהֶן («на них», то есть на кадильницы) на единственное число и вводит невыраженную в тексте привязку к огню. «Будет святым» возможно, но несколько размывает определённое הוּא הַקָּדוֹשׁ; «он — святой» лучше передаёт обозначение избранного лица, не превращая его в позднейший титул.'
  naturalness: Исправленный текст сохраняет современный литературный русский и умеренную библейскую окраску. «Слишком много вы на себя берёте» — естественная современная форма резкого упрёка; сноска фиксирует более краткое, менее эксплицитное прочтение.
  terminology: «Яхве» точно передаёт тетраграмматон. «Благовония», «сыны Левия» и «пред Яхве» уместны по регистру. Множественное «на них» необходимо для соответствия кадильницам в предшествующем контексте и форме еврейского местоимения.
  issues:
  - severity: high
    issue: Единственное число «на него» вместо множественного «на них».
    rationale: Еврейское עֲלֵיהֶן — женский род, множественное число; его референтом служат кадильницы. Перевод «на него» переключает референт на огонь, который не назван дополнением этого предлога в исходном тексте.
  - severity: medium
    issue: «Будет святым» недостаточно отражает определённую конструкцию הוּא הַקָּדוֹשׁ.
    rationale: Хотя будущее время обусловлено предстоящим испытанием, конструкция буквально обозначает избранного как «святого». «Он — святой» сохраняет это обозначение без добавления смысла становления святым.
  - severity: low
    issue: Сноска [a] поставлена после всего предложения, а не у выражения, к которому относится.
    rationale: Якорь следует поставить непосредственно после «Слишком много вы на себя берёте», чтобы область примечания была однозначной.
