id: NUM.16.7
reference: Numbers 16:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: ru
  text: Положите в них огонь и на них благовония пред Яхве завтра. И тот, кого изберёт Яхве, — святой. Слишком много вы на себя берёте[a], сыны Левия!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Довольно вам, сыны Левия!»'
    reason: Выражение רַב לָכֶם буквально означает «много/слишком много для вас» и может передавать краткий упрёк без явного уточнения, в чём состоит их чрезмерность.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: и положите в них огонь
  rationale: Глагол נתן с предлогом ב и подразумеваемыми кадильницами естественно означает поместить огонь внутрь них.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: а на него — благовония
  rationale: Местоимение формально относится к кадильницам во множественном числе, однако по смыслу благовония кладут на находящийся в них огонь; эллиптическая русская конструкция естественно передаёт культовое действие без лишнего пояснения.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Краткий и dignified русский эквивалент устойчивого выражения, обозначающего действие в присутствии Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: מָחָר
  choice: завтра
  rationale: Прямое соответствие временному наречию.
- source_word: וְהָיָה
  choice: И ... будет
  rationale: Передаёт результат предстоящего испытания естественной русской будущей конструкцией.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: тот, кого изберёт Яхве
  rationale: Русское «тот» естественно передаёт определённого мужчину, которого выявит выбор Яхве, не делая фразу тяжеловесной.
- source_word: הוּא הַקָּדוֹשׁ
  choice: будет святым
  rationale: Определённость еврейского выражения здесь указывает на человека, признанного святым в результате испытания; русская именная конструкция сохраняет смысл, не превращая обозначение в особый титул.
- source_word: רַב לָכֶם
  choice: Полно вам
  rationale: Идиоматичное русское порицание сохраняет краткость и риторическую силу буквально количественного выражения «много для вас».
- source_word: בְּנֵי לֵוִי
  choice: сыны Левия
  rationale: Сохраняет родовое обращение и торжественную, но понятную библейскую окраску исходного выражения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя без подмены титулом.
- issue: Статус избранного в הוּא הַקָּדוֹשׁ
  choice: будет святым
  alternative: он — святой; он и есть святой
  rationale: Контекст говорит о выявлении того, кого Бог признаёт принадлежащим к святому служению. Выбранная формулировка сохраняет напряжение между Божьим выбором и святостью, не придавая слову значение позднейшего титула.
- issue: Сила упрёка רַב לָכֶם
  choice: Полно вам
  alternative: слишком много вы на себя берёте; довольно вам
  rationale: Краткое порицание не уточняет сверх текста, в чём именно состоит превышение границ; более истолковательное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренной библейской торжественностью. «Пред Яхве» и «сыны Левия» сохраняют достоинство и еврейскую образность; синтаксис остаётся понятным обычному читателю.
