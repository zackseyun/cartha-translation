  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּפֹּ֖ל עַל פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: ru
  text: Моисей услышал это и пал ниц.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пал на своё лицо»; то есть упал лицом к земле, простёрся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал это
  rationale: Глагол שׁמע в повествовательной последовательности естественно означает «услышал». Местоимение «это» передаёт подразумеваемый из контекста объект — сказанное в предыдущем стихе — и делает русскую фразу естественной.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: וַיִּפֹּל
  choice: пал
  rationale: Глагол נפל буквально означает «падать». «Пал» сохраняет конкретность действия и соответствует достоинству библейского повествовательного стиля.
- source_word: עַל פָּנָיו
  choice: ниц
  rationale: Русское наречие «ниц» естественно передаёт еврейскую идиому «на своё лицо», то есть положение лицом к земле, не уточняя мотив жеста.
theological_decisions:
- issue: Смысл позы Моисея
  choice: 'Передать только физическое действие: «пал ниц».'
  alternative: «простёрся в молитве»; «пал лицом вниз от скорби»
  rationale: Еврейский текст называет действие, но прямо не объясняет его как молитву, скорбь, смирение или ходатайство. Конкретный образ сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пал ниц» — краткая, понятная и устойчивая формула; сноска сохраняет буквальный образ еврейского выражения.
