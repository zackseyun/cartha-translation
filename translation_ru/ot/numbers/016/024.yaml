source:
  edition: WLC
  text: דַּבֵּ֥ר אֶל הָ/עֵדָ֖ה לֵ/אמֹ֑ר הֵֽעָלוּ֙ מִ/סָּבִ֔יב לְ/מִשְׁכַּן קֹ֖רַח דָּתָ֥ן וַ/אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: ru
  text: '«Скажи общине: „Отойдите от жилища Корея, Дафана и Авирона“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: общине
  rationale: Обычное для книги Чисел обозначение собравшегося сообщества Израиля; современное и достаточно точное русское слово.
- source_word: הֵעָלוּ מִסָּבִיב
  choice: отойдите от
  rationale: Глагол буквально связан с движением вверх, но в сочетании с מִסָּבִיב здесь выражает требование удалиться из окружающего пространства; буквальное «поднимитесь от окрестности» по-русски неестественно и затемняет смысл.
- source_word: לְמִשְׁכַּן
  choice: от жилища
  rationale: Сохранено единственное число еврейского текста. Здесь מִשְׁכָּן означает место обитания, а не священную Скинию.
- source_word: קֹרַח דָּתָן וַאֲבִירָם
  choice: Корея, Дафана и Авирона
  rationale: Употреблены традиционные русские формы библейских имён в требуемом родительном падеже.
theological_decisions:
- issue: Значение מִשְׁכָּן в данном контексте
  choice: жилище
  alternative: скиния
  rationale: Контекст говорит о месте проживания мятежников; перевод «скиния» мог бы ошибочно вызвать ассоциацию со святилищем и внести отсутствующий в стихе богословский смысл.
translation_notes:
  register: Современный литературный русский язык; повеление передано кратко и торжественно. Формула לֵאמֹר естественно выражена двоеточием и прямой речью без избыточного «говоря».
