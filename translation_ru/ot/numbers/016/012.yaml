  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: ru
  text: 'Моисей послал вызвать Дафана и Авирона, сыновей Елиава, но они сказали: «Мы не пойдём».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мы не поднимемся». Еврейский глагол может означать также «идти вверх»; здесь он, вероятно, относится к тому, чтобы подняться к месту, где находился Моисей, или явиться к нему по вызову.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Глагол שׁלח здесь указывает, что Моисей послал за ними, не уточняя личность посланника.
- source_word: לִקְרֹא
  choice: позвать
  rationale: В сочетании с предлогом ל и обозначением лица קרא означает вызвать или позвать кого-либо; «позвать» естественно передаёт смысл официального вызова без излишне административного оттенка.
- source_word: דָתָן וַאֲבִירָם
  choice: Дафана и Авирона
  rationale: Имена переданы в традиционной русской библейской форме и поставлены в винительный падеж по синтаксису предложения.
- source_word: בְּנֵי אֱלִיאָב
  choice: сыновей Елиава
  rationale: Сохранено прямое указание на происхождение обоих названных мужчин; форма родительного падежа естественна для русского приложения.
- source_word: וַיֹּאמְרוּ
  choice: но они сказали
  rationale: Союз «но» естественно выражает контраст между призывом Моисея и отказом Дафана и Авирона.
- source_word: לֹא נַעֲלֶה
  choice: Не пойдём к тебе
  rationale: עלה буквально означает «подниматься, идти вверх», но здесь идиоматически обозначает явку к Моисею по вызову. «Не пойдём» передаёт решительный отказ, а «к тебе» проясняет подразумеваемое направление; буквальный образ сохранён в сноске.
