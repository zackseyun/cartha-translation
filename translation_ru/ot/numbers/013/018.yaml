  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: ru
  text: 'Осмотрите, какова земля и каков народ, живущий на ней: силён он или слаб, малочислен или многочислен.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: осмотрите
  rationale: Форма от ראה в контексте поручения разведчикам означает не мимолётно увидеть, а внимательно обследовать; «осмотрите» естественно передаёт эту инструкцию.
- source_word: הָאָרֶץ מַה הִוא
  choice: 'землю: какова она'
  rationale: Буквально «землю — что она»; вопрос касается её свойств и состояния. «Какова она» сохраняет лаконичность и оценочный смысл оригинала.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: народ, живущий на ней
  rationale: Причастие יֹשֵׁב обозначает постоянное проживание, а עָלֶיהָ буквально значит «на ней». Такое сочетание естественно по-русски и сохраняет образ земли как территории.
- source_word: הֶחָזָק ... הֲרָפֶה
  choice: силён он или слаб
  rationale: Сохраняется прямая антитеза между חזק и רפה и вопросительный характер еврейской конструкции.
- source_word: הַמְעַט ... רָב
  choice: малочислен или многочислен
  rationale: Контраст относится к численности народа. Эти прилагательные яснее русского «мал или велик» и не допускают ошибочного понимания как оценки роста или значимости.
- source_word: אִם
  choice: или
  rationale: В парных косвенно-вопросительных противопоставлениях אִם связывает альтернативы; по-русски это естественно передаётся союзом «или».
