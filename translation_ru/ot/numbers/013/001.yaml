  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Вайиктоль вводит следующее событие повествования. Хотя דבר буквально допускает «говорил/обратился», в русской формуле введения прямой речи естественно «сказал»; содержание речи следует далее.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В данной формуле инфинитив вводит последующую прямую речь; в современном русском это естественно выражается двоеточием, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» сохраняет это различие и представляет наиболее принятую научную реконструкцию произношения; примечание указывает еврейскую форму.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формула. Двоеточие функционально передаёт לֵאמֹר и подготавливает прямую речь следующего стиха.
