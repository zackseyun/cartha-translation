  text: לְ/מַטֵּ֥ה אֶפְרָ֖יִם הוֹשֵׁ֥עַ בִּן נֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/008.yaml
  text: from the tribe of Ephraim[a], Hoshea son of Nun[b];
translation:
  language: ru
  text: от колена Ефрема — Осия[a], сын Навина;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Осия — прежнее имя человека, которого Моисей назвал Иисусом (см. Числа 13:16).
    reason: cross_reference
lexical_decisions:
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В перечне представителей сочетание לְ с מַטֶּה указывает на принадлежность человека к соответствующему колену; «от колена» естественно для русского перечня и сохраняет эту связь.
- source_word: אֶפְרָיִם
  choice: Ефрема
  rationale: Употреблена общепринятая русская библейская форма имени; родительный падеж обусловлен сочетанием «от колена».
- source_word: הוֹשֵׁעַ
  choice: Осия
  rationale: Традиционная русская передача имени הוֹשֵׁעַ. Примечание поясняет, что здесь назван человек, впоследствии получивший имя Иисус, а не пророк Осия.
- source_word: בִּן
  choice: сын
  rationale: Прямая и естественная передача еврейского родственного обозначения в именной формуле.
- source_word: נוּן
  choice: Навина
  rationale: Использована закрепившаяся в русской библейской традиции форма имени נוּן; родительный падеж требуется после слова «сын».
