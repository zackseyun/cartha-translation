base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: ru
  text: Они отправились и прибыли к Моисею, Аарону и всему обществу сынов Израиля[a] в пустыне Фаран, в Кадесе. Они принесли им и всему обществу весть и показали плоды земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всему обществу израильтян». Буквально: «всему обществу сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Они отправились и пришли
  rationale: Сохранены оба последовательных повествовательных глагола — движение и прибытие; формулировка остаётся понятной по-русски.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всему обществу сынов Израиля
  rationale: «Общество» передаёт עֵדָה как собравшуюся общину, а «сыны Израиля» сохраняет форму исходного выражения, не сводя её без пояснения к этнониму.
- source_word: מִדְבַּר פָּארָן
  choice: в пустыню Фаран
  rationale: «Пустыня» — естественный русский эквивалент מִדְבָּר в повествовании о странствиях Израиля.
- source_word: קָדֵשָׁה
  choice: в Кадес
  rationale: Окончание направления -ָה передано конструкцией с «в», обозначающей место назначения; название дано в принятой русской библейской форме.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Они принесли им ... весть
  rationale: Формулировка естественно передаёт возвращение разведчиков со словесным сообщением, сохраняя общее значение דָּבָר и не конкретизируя его как официальный «отчёт».
- source_word: וְאֶת כָּל הָעֵדָה
  choice: и всему обществу
  rationale: Подразумеваемое отношение адресата выражено дательным падежом; перевод עֵדָה выдержан последовательно.
- source_word: וַיַּרְאוּם
  choice: показали
  rationale: Каузативная форма глагола ראה здесь означает «дать увидеть, показать».
- source_word: פְּרִי הָאָרֶץ
  choice: плоды той земли
  rationale: «Плоды» сохраняет конкретный и наглядный смысл פְּרִי, а указательное «той» естественно отсылает к осмотренной земле.
