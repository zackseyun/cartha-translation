  rationale: Стандартная передача древнееврейской генеалогической конструкции; в данном перечне определённость не требует отдельного выражения.
- source_word: סוֹדִי
  choice: Содия
  rationale: Передача личного имени в принятой русской библейской форме; родительный падеж после слова «сын».
