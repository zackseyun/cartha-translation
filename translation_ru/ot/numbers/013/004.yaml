base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/004.yaml
  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: ru
  text: 'Вот их имена: от колена Рувима — Шаммуа, сын Заккура.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: В данном заголовке списка сочетание союза и указательного местоимения естественно передаётся русским вводным «вот», которое сохраняет связь с предшествующим повелением и указывает на следующий перечень.
- source_word: שְׁמוֹתָם
  choice: их имена
  rationale: Буквальное и естественное русское соответствие; связка настоящего времени не требуется.
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В контексте перечня предлог לְ обозначает принадлежность представителя к соответствующему колену; «от колена» ясно передаёт, что названный человек избран из него.
- source_word: רְאוּבֵן
  choice: Рувима
  rationale: Устоявшаяся русская библейская форма имени, поставленная в родительном падеже после слова «колена».
- source_word: שַׁמּוּעַ
  choice: Шаммуа
  rationale: Транслитерация личного имени с удвоением согласного, отражающим еврейскую форму.
- source_word: בֶּן
  choice: сын
  rationale: Стандартная и точная передача еврейского обозначения сыновства.
- source_word: זַכּוּר
  choice: Заккура
  rationale: Транслитерация личного имени в родительном падеже после слова «сын»; удвоение «к» отражает дагеш в исходной форме.
