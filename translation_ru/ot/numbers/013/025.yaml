  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: ru
  text: Через сорок дней они вернулись, осмотрев землю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разведав землю»; возможно также: «исследовав землю». Еврейский глагол означает осмотр и обследование земли в ходе разведывательного задания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: они вернулись
  rationale: Форма Qal wayyiqtol 3-го лица множественного числа от שׁוב продолжает повествовательную последовательность. В современном русском союз ו естественно передаётся порядком изложения, без обязательного «и».
- source_word: מִתּוּר
  choice: осмотрев
  rationale: Инфинитив תור с предлогом מִן обозначает возвращение после обследования земли. «Осмотрев» естественно передаёт разведывательное изучение местности, не придавая слову излишне отрицательного оттенка тайного шпионажа.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте речь идёт о конкретной земле, которую обследовали посланные, а не о земле как планете или почве.
- source_word: מִקֵּץ
  choice: через
  rationale: Сочетание מִן с קֵץ указывает на завершение периода. Русское «через сорок дней» естественно и точно обозначает момент возвращения по истечении этого срока.
- source_word: אַרְבָּעִים יוֹם
  choice: сорок дней
  rationale: Обычная русская передача древнееврейского выражения меры времени с числительным и существительным в единственном числе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза. Причастно-деепричастная конструкция сохраняет связь возвращения с завершённым обследованием земли. Формулировка избегает как архаизма, так и чрезмерно военной или отрицательной окраски.
