translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Имя места транслитерировано как «Эшкол»; техническое слово «вади» не вынесено в основной текст. Неоднозначность того, к чему относится местоименный суффикс при глаголе «нести», отмечена в сноске.
