  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: ru
  text: Они пришли в долину Эшкол[a] и срезали там виноградную ветвь с одной гроздью. Двое несли это на шесте[b]. Они взяли также гранаты и инжир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к руслу Эшкол» либо «в ущелье Эшкол». Еврейское נַחַל может обозначать долину, овраг или русло водотока, часто сезонного.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское местоимение при глаголе «нести» может относиться к срезанной ветви с гроздью как к единому предмету; его точный референт не указан.
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: долина Эшкол
  rationale: נַחַל обозначает долину, овраг или русло сезонного потока. «Долина» естественно звучит по-русски как часть географического названия, а более узкие варианты сохранены в сноске.
- source_word: זְמוֹרָה
  choice: виноградная ветвь
  rationale: Слово означает ветвь или побег виноградной лозы. Явное определение «виноградная» делает образ точным и естественным по-русски.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: одна гроздь
  rationale: Передаёт количественный акцент еврейского текста; в контексте виноградной ветви слово «винограда» можно не повторять.
- source_word: וַיִּשָּׂאֻהוּ בַמּוֹט בִּשְׁנָיִם
  choice: Эту ветвь двое несли на шесте
  rationale: Суффикс мужского рода может относиться к срезанному предмету как целому. «Двое» сохраняет лаконичность בִּשְׁנָיִם, а «на шесте» естественно передаёт способ переноски.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Они взяли также гранаты и инжир
  rationale: Глагол «взяли» подразумевается из повествования и добавлен ради ясного русского синтаксиса; частичное значение מִן естественно выражается отсутствием определённости.
