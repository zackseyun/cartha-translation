base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: ru
  text: И послал их Моисей из пустыни Паран по повелению Яхве[a]. Все они были мужчинами — главами сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по слову Яхве». Буквально: «по устам Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вождями израильтян». Буквально: «главами сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֹתָם מֹשֶׁה
  choice: И послал их Моисей
  rationale: Последовательная глагольная форма передаёт очередное событие повествования; порядок слов сохраняет естественный для русского библейского рассказа ритм.
- source_word: מִמִּדְבַּר פָּארָן
  choice: из пустыни Паран
  rationale: מִדְבָּר обозначает пустынную, необрабатываемую местность; «пустыня Паран» — ясное и привычное географическое наименование.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Идиома буквально означает «по устам Яхве» и в данном контексте указывает на действие согласно данному Богом распоряжению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, непосредственно присутствующее в еврейском тексте, без замены титулом.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Все они были мужами
  rationale: Сохраняется указание на всех выбранных мужчин; «мужами» выдерживает достоинство регистра и согласуется со сказуемой конструкцией.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: главами сынов Израиля
  rationale: Формулировка сохраняет образ «глав» и родовое выражение «сыны Израиля», не сводя его лишь к более общему «израильтяне».
- source_word: הֵמָּה
  choice: они были
  rationale: Самостоятельное местоимение поддерживает эмфатическое утверждение; вместе с כֻּלָּם естественно передаётся как «Все они были».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Гендерная и родовая формулировка אֲנָשִׁים / בְנֵי יִשְׂרָאֵל
  choice: мужами, главами сынов Израиля
  alternative: вождями израильтян; мужчинами, предводителями израильтян
  rationale: Контекст говорит о мужчинах — представителях колен; выбранная передача сохраняет как мужской референт, так и семейно-родовой образ исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным звучанием. Сохранены конкретные образы и родовая терминология еврейского текста; буквальная идиома пояснена в сноске.
