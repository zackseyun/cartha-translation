  naturalness: '«И послал их Моисей из пустыни Паран по повелению Яхве» естественно и соответствует умеренно возвышенному повествовательному регистру. Форму «Все они были мужчинами — главами сынов Израиля» следует предпочесть: она современна, сохраняет эмфатическое «все они» и ясно связывает оба определения.'
