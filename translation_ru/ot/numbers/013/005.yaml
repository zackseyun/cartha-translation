lexical_decisions:
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В перечне представителей מַטֶּה обозначает племя Израиля, то есть «колено»; предлог לְ в структуре списка естественно передаётся по-русски как «от».
- source_word: שִׁמְעוֹן
  choice: Симеона
  rationale: Традиционная и узнаваемая русская форма имени патриарха и названия колена; родительный падеж обусловлен сочетанием «от колена».
- source_word: שָׁפָט
  choice: Шафат
  rationale: Личное имя передано транслитерацией, близкой к еврейской форме и русской библейской традиции.
- source_word: בֶּן
  choice: сын
  rationale: Стандартное обозначение родства в именной формуле; русская конструкция не требует дополнительных слов.
- source_word: חוֹרִי
  choice: Хори
  rationale: Личное имя передано транслитерацией с сохранением начального еврейского согласного ח через традиционное русское «х».
