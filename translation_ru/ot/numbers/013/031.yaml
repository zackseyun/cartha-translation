  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: ru
  text: 'Но люди, ходившие с ним, сказали: «Мы не можем выступить против этого народа[a], потому что он сильнее нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подняться к этому народу»; в данном контексте имеется в виду военное выступление против него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Но люди
  rationale: Союз וְ в контексте вводит возражение словам Халева, поэтому передан противительным «но». Слово «люди» естественно обозначает участников разведки и сохраняет конкретность אֲנָשִׁים.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: ходившие с ним
  rationale: Буквально речь о тех, кто «поднялся с ним». В русском «ходившие с ним» естественно указывает на совместный разведывательный поход и не создаёт ложного акцента на физическом подъёме.
- source_word: לֹא נוּכַל
  choice: мы не можем
  rationale: Форма от יכל выражает неспособность или отсутствие сил; настоящее время естественно передаёт оценку говорящих перед предстоящим выступлением.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: выступить против этого народа
  rationale: Глагол עלה буквально означает «подняться, пойти вверх», но здесь вместе с אֶל описывает военное выступление против жителей земли. «Выступить против» ясно передаёт контекст, а указательное «этого» естественно отсылает к уже упомянутому народу.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: он сильнее нас
  rationale: Местоимение הוּא имеет единственное число и согласуется с собирательным הָעָם. Русское «народ — он» сохраняет это число и сравнительное значение конструкции מִן.
