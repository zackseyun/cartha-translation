base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: ru
  text: И там мы видели нефилимов — сынов Анака[a], происходивших от нефилимов. В наших глазах мы были словно кузнечики, и такими же были в их глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «исполины». Значение еврейского термина «нефилимы» не вполне ясно, поэтому в основном тексте он передан транслитерацией.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: нефилимов
  rationale: Термин транслитерирован, поскольку его точное значение и референт остаются спорными; перевод «исполины» был бы истолкованием.
- source_word: בְּנֵי עֲנָק
  choice: сынов Анака
  rationale: Формально близко передаёт еврейское родовое выражение и сохраняет имя собственное.
- source_word: מִן הַנְּפִלִים
  choice: происходящих от нефилимов
  rationale: Предлог מן здесь естественно указывает на происхождение; формулировка сохраняет связь с предыдущим приложением, не конкретизируя её сверх текста.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: В собственных глазах мы были
  rationale: Еврейская идиома выражает восприятие или самооценку; естественная русская конструкция сохраняет образ «в глазах» и параллелизм.
- source_word: כַּחֲגָבִים
  choice: словно кузнечики
  rationale: Передаёт сравнение с мелкими прыгающими насекомыми и традиционный в данном контексте образ ничтожной величины.
- source_word: וְכֵן הָיִינוּ בְּעֵינֵיהֶם
  choice: и такими же были в их глазах
  rationale: Сохраняет риторический параллелизм и не превращает утверждение разведчиков о чужом восприятии в объективный факт.
theological_decisions:
- issue: Передача נְפִילִים
  choice: нефилимы
  alternative: исполины; падшие
  rationale: Транслитерация сохраняет неопределённость древнееврейского термина и его связь с Быт. 6:4, не навязывая спорную этимологию или традиционное толкование.
translation_notes:
  register: Современный литературный русский язык; достоинство повествования сочетается с доступностью. Повтор «в глазах» сохранён ради образности и параллелизма оригинала.
