  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: ru
  text: 'Они рассказали ему: «Мы вошли в землю, в которую ты послал нас. Она действительно течёт молоком и мёдом[a], и вот её плод».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И к тому же она течёт молоком и мёдом». Еврейское וְגַם может выражать как усиленное подтверждение, так и присоединение ещё одного утверждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ לוֹ וַיֹּאמְרוּ
  choice: Они рассказали ему
  rationale: Глагол ספר в породе пиэль означает «рассказывать, сообщать». В русском ввод прямой речи с двоеточием естественно передаёт последующее וַיֹּאמְרוּ («и сказали»), не создавая тяжеловесного повтора «рассказали… и сказали».
- source_word: בָּאנוּ אֶל־הָאָרֶץ
  choice: Мы вошли в землю
  rationale: בוא может означать как прибытие, так и вхождение. По контексту разведчики действительно обследовали землю, поэтому «вошли в землю» точно передаёт смысл и сохраняет направленность אֶל.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: в которую ты послал нас
  rationale: Сохранены относительное предложение, местоимение второго лица и объектный суффикс первого лица множественного числа.
- source_word: וְגַם
  choice: действительно
  rationale: Сочетание здесь усиливает и подтверждает положительную оценку земли. «Действительно» естественно выражает эту утвердительную функцию, хотя возможно и присоединительное понимание.
- source_word: זָבַת חָלָב וּדְבַשׁ הִוא
  choice: Она действительно течёт молоком и мёдом
  rationale: Сохранён устойчивый древнееврейский образ исключительного плодородия; местоимение «она» относится к земле.
- source_word: וְזֶה פִּרְיָהּ
  choice: и вот её плод
  rationale: Единственное число פְּרִי сохранено как «плод». Частица «вот» естественно передаёт указательное זֶה и предполагаемый жест, показывающий принесённый образец.
