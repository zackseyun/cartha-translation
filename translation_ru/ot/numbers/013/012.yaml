lexical_decisions:
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В перечне представителей לְמַטֵּה обозначает племенную принадлежность названного человека. По-русски естественная формула списка — «от колена»; מַטֶּה здесь означает колено, а не буквальный посох.
- source_word: דָן
  choice: Дана
  rationale: Традиционная русская форма названия колена; родительный падеж обусловлен сочетанием «колено Дана».
- source_word: עַמִּיאֵל
  choice: Аммиил
  rationale: Передача личного имени в принятой русской библейской форме, отражающей компоненты еврейского имени.
- source_word: בֶּן
  choice: сын
  rationale: Обычная передача еврейской генеалогической конструкции; имя отца ставится в родительном падеже.
- source_word: גְּמַלִּי
  choice: Гемалли
  rationale: Транслитерация еврейского личного имени с сохранением удвоенного согласного, обозначенного дагешем.
