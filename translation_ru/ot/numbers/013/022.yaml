base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: ru
  text: Они поднялись в Негев, и он дошёл до Хеврона. Там были Ахиман, Шешай и Талмай, потомки Анака. Хеврон был построен на семь лет раньше египетского Цоана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: в Негев
  rationale: Здесь это географическое название южной области Ханаана; транслитерация точнее, чем обобщённое «на юг».
- source_word: יְלִידֵי הָעֲנָק
  choice: потомки Анака
  rationale: Выражение буквально обозначает рождённых от Анака; «потомки» естественно передаёт родовую принадлежность без добавления толкования.
- source_word: לִפְנֵי
  choice: раньше
  rationale: В хронологическом сопоставлении городов предлог означает «до, прежде».
- source_word: צֹעַן מִצְרָיִם
  choice: египетского Цоана
  rationale: Сохраняется топоним Цоан и явно выраженная в еврейском тексте его связь с Египтом.
theological_decisions:
- issue: 'Смена числа подлежащего: וַיַּעֲלוּ («они поднялись») и וַיָּבֹא («он пришёл»)'
  choice: Они поднялись в Негев, и он дошёл до Хеврона
  alternative: Они поднялись в Негев и дошли до Хеврона
  rationale: Сохранена заметная смена множественного числа на единственное в масоретском тексте, не устраняя возможную текстовую или повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; сдержанный повествовательный регистр. Имена переданы в привычной русской библейской форме, а синтаксическая неоднозначность оригинала сохранена.
