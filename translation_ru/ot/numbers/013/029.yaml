  variant: modern literary Russian
source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: ru
  text: Амаликитяне живут[a] в земле Негев[b]; хетты, иевусеи и аморреи живут в горной стране, а хананеи — у моря и вдоль Иордана[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «обитают»; так можно переводить соответствующее еврейское причастие во всём стихе, подчёркивающее постоянное проживание.
    reason: lexical_alternative
  - marker: b
    text: Название «Негев» может также означать «южная земля»; здесь, вероятно, имеется в виду определённая южная область Ханаана.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «у стороны Иордана»; то есть рядом с Иорданом или вдоль него.'
    reason: idiom_explanation
lexical_decisions:
- source_word: עֲמָלֵק
  choice: амаликитяне
  rationale: Название народа передано привычным русским этнонимом во множественном числе; в данном контексте עֲמָלֵק обозначает народ Амалика, населяющий определённую область.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: живут
  rationale: Причастие от ישב выражает постоянное или устойчивое проживание. «Живут» естественно в современном русском и сохраняет этот смысл.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: в земле Негев
  rationale: Сохраняется слово אֶרֶץ («земля») и географическое название Негев; при этом в сноске отмечено возможное нарицательное значение «южная земля».
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: хетты / иевусеи / аморреи / хананеи
  rationale: Еврейские формы морфологически единственного числа имеют собирательное значение; русские названия народов во множественном числе звучат естественно и точно передают референцию.
- source_word: בָּהָר
  choice: в горной стране
  rationale: הַר может означать гору или гористую местность. Здесь речь идёт об области расселения, поэтому «горная страна» точнее контекстуально, чем отдельные «горы».
- source_word: עַל הַיָּם
  choice: у моря
  rationale: Передаёт пространственное значение עַל без более узкого толкования «на побережье».
- source_word: עַל יַד הַיַּרְדֵּן
  choice: вдоль Иордана
  rationale: Буквально «у стороны (руки) Иордана»; это пространственная идиома, естественно передаваемая по-русски как «вдоль Иордана».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным географическим описанием. Повтор глагола сохранён в первых двух частях для соответствия структуре еврейского текста, а в последней части использована естественная русская эллиптическая конструкция. Точка с запятой разграничивает области расселения без изменения синтаксической логики оригинала.
