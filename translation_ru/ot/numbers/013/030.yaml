translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным регистром. Две усилительные еврейские конструкции переданы естественными русскими средствами без добавления временного значения «немедленно». Имя כָּלֵב передано в принятой русской библейской форме «Калев».
