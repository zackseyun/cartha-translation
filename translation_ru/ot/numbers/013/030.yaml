base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: ru
  text: 'Тогда Калев успокоил[a] народ перед Моисеем и сказал: «Непременно поднимемся[b] и овладеем этой землёй, ведь нам это вполне по силам[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставил народ умолкнуть». Еврейский глагол может означать «успокоить», «унять» или «заставить замолчать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взойти — мы непременно взойдём»; еврейская конструкция усиливает утверждение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ведь мы непременно сможем это сделать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: утихомирил
  rationale: Глагол означает, что Калев заставил собравшихся умолкнуть или успокоиться. «Утихомирил» естественно передаёт воздействие на взволнованный народ, не обязательно подразумевая суровое подавление.
- source_word: אֶת־הָעָם
  choice: народ
  rationale: Здесь עָם обозначает собравшуюся общину Израиля; «народ» — точный и естественный русский эквивалент.
- source_word: אֶל־מֹשֶׁה
  choice: в присутствии Моисея
  rationale: Буквально предлог אֶל обычно указывает направление («к Моисею»), но в данном сочетании смысл, вероятно, относится к происходящему перед Моисеем или в его присутствии. Выбранная формулировка ясна по-русски и не создаёт впечатления, будто народ был направлен к Моисею.
- source_word: עָלֹה נַעֲלֶה
  choice: непременно пойдём
  rationale: Инфинитив абсолютный перед личной формой усиливает утверждение. «Непременно» сохраняет эту эмфазу, а «пойдём» естественно передаёт движение в землю, не добавляя отсутствующего в тексте значения «немедленно».
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: и овладеем этой землёй
  rationale: В данном контексте ירשׁ означает вступить во владение землёй. Явное «этой землёй» естественно раскрывает женский местоименный суффикс, отсылающий к земле.
- source_word: כִּי יָכוֹל נוּכַל
  choice: ведь нам это вполне по силам
  rationale: Повторная конструкция с инфинитивом абсолютным выражает твёрдую уверенность в способности совершить задуманное. Русский оборот «вполне по силам» передаёт эту усиленность естественно и ясно.
- source_word: לָהּ
  choice: это
  rationale: Суффикс женского рода отсылает к земле, но после выражения способности по-русски естественно обозначить всё предстоящее действие словом «это», то есть овладение землёй.
