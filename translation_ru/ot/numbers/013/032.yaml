  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: ru
  text: 'И они распространили среди сынов Израиля дурную молву[a] о земле, которую исследовали[b], говоря: «Земля, по которой мы прошли, исследуя её, — это земля, пожирающая своих жителей[c], и весь народ, который мы видели в ней, — люди огромных размеров[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распустили худую молву»; более резко: «оклеветали землю».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разведали», «обследовали».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «истребляющая своих жителей». Образ допускает разные причины гибели и не объясняется в самом выражении.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «люди размеров (мер)», то есть люди необычайно крупных размеров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: распространили дурную молву
  rationale: Еврейское сочетание буквально передаёт вынесение дурного сообщения, но по-русски естественно выражается глаголом «распространили». «Дурная молва» сохраняет отрицательный и потенциально клеветнический оттенок דִּבָּה, не утверждая прямо, что всё сообщение было ложью.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Стандартное и контекстуально точное обозначение территории в повествовании о пути Израиля и обещанной земле.
- source_word: תָּרוּ / לָתוּר
  choice: исследовали / исследуя
  rationale: Глагол означает обследовать, разведывать местность. «Исследовать» понятно современному читателю и не сужает значение до тайного шпионажа.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохраняется буквальная заветная формула «сыны Израиля». Предлог «среди» естественно сочетается по-русски с распространением молвы и передаёт направленность сообщения к народу.
- source_word: עָבַרְנוּ בָהּ
  choice: по которой мы прошли
  rationale: Естественно передаёт движение через обследуемую землю, сохраняя образ непосредственного прохождения по ней.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: земля, пожирающая своих жителей
  rationale: «Пожирающая» сохраняет яркую и зловещую метафору еврейского причастия אֹכֶלֶת, не объясняя однозначно, относится ли она к войнам, бедствиям или иной опасности.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: люди огромного роста
  rationale: В данном контексте выражение указывает на внушительные физические размеры. «Огромного роста» ясно передаёт смысл и не создаёт возможной ассоциации с общественным положением.
theological_decisions:
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Сохранена явно мужская и традиционная заветная формула исходного текста, которая здесь обозначает народ как целое, без введения дополнительного конфессионального толкования.
- issue: Характер дурного сообщения דִּבָּה
  choice: дурная молва
  alternative: клевета
  rationale: Основной текст сохраняет отрицательную оценку сообщения, но не решает безоговорочно, что оно целиком являлось сознательной ложью; более сильное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет риторическую напряжённость прямой речи; яркая метафора «пожирающая своих жителей» оставлена без рационализирующего пояснения в основном тексте.
