base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: ru
  text: 'И какова земля, в которой живёт народ: хороша она или плоха? И каковы города, в которых он живёт: это лагеря или укреплённые места?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в станах … в укреплениях». Еврейский текст противопоставляет лагеря (в контексте, вероятно, неукреплённые поселения) укреплённым местам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: И какова земля
  rationale: Вопросительное וּמָה здесь касается характера и состояния земли; «какова земля» естественно и точно передаёт эту функцию по-русски.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: в которой живёт этот народ
  rationale: Местоимение мужского рода единственного числа употреблено собирательно об обитателях земли. Явное «этот народ» делает русский текст понятным, не меняя референта.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: хороша она или плоха
  rationale: Сохранена широкая оценочная противоположность טוב / רע без неоправданного сужения до плодородия или хозяйственной ценности.
- source_word: וּמָה הֶעָרִים
  choice: И каковы города
  rationale: עָרִים обычно означает города или населённые пункты; «города» соответствует контексту разведки и последующему вопросу об укреплённости.
- source_word: הַבְּמַחֲנִים
  choice: в открытых поселениях
  rationale: מַחֲנִים буквально означает «лагеря, стоянки»; в противопоставлении укреплённым местам речь идёт о неукреплённых, открытых поселениях. Выбор передаёт контекстуальный смысл, а буквальная возможность отмечена в сноске.
- source_word: בְּמִבְצָרִים
  choice: в укреплённых местах
  rationale: מִבְצָרִים обозначает укреплённые места или крепости; выбран нейтральный вариант, сохраняющий оборонительный смысл и параллель с типом поселений.
theological_decisions:
- issue: Собирательное единственное число הוּא
  choice: В первой части референт раскрыт как «этот народ», а далее сохранено единственное число «он».
  alternative: Буквально повторить «он» без названного референта либо перейти к множественному «они».
  rationale: Так сохраняется собирательная грамматика еврейского текста и одновременно устраняется неясность, кого обозначает «он»; богословского уточнения сверх текста не вносится.
translation_notes:
  register: Современный литературный русский язык; вопросительная структура и широкие оценочные значения оригинала сохранены. Формулировка «открытые поселения» выбрана ради ясности, а более буквальная передача приведена в сноске.
