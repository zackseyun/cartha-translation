  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: ru
  text: То место назвали долиной Эшкол[a][b] из-за грозди, которую сыны Израиля[c] срезали там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ущельем Эшкол» или «руслом Эшкол». Еврейское на́халь может обозначать сезонное русло либо долину или ущелье, по которому оно проходит.'
    reason: lexical_alternative
  - marker: b
    text: Имя «Эшкол» созвучно еврейскому слову, означающему «гроздь». Место получило это название из-за срезанной там грозди.
    reason: cultural_note
  - marker: c
    text: 'Или: «израильтяне» или «потомки Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: То место
  rationale: Естественно передаёт определённое указание на уже упомянутое место.
- source_word: קָרָא
  choice: назвали
  rationale: Активная форма с неопределённым субъектом в данном обороте выражает наименование; русская неопределённо-личная конструкция естественна и сохраняет смысл.
- source_word: נַחַל
  choice: долиной
  rationale: Слово может обозначать сезонное русло, овраг или связанную с ним долину; «долина» ясно и уместно в составе географического названия, а диапазон значения отмечен в сноске.
- source_word: אֶשְׁכּוֹל
  choice: Эшкол
  rationale: В сочетании נַחַל אֶשְׁכּוֹל слово выступает как имя места; транслитерация сохраняет топоним, а игра со значением «гроздь» пояснена в сноске.
- source_word: עַל אֹדוֹת
  choice: из-за
  rationale: Передаёт причинное значение оборота современно и кратко.
- source_word: הָאֶשְׁכּוֹל
  choice: грозди
  rationale: Контекст предыдущего стиха показывает, что речь о виноградной грозди; само существительное здесь означает «гроздь», поэтому уточнение «виноградной» в текст не добавлено.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: которую … срезали
  rationale: Глагол כרת означает отсечение; применительно к грозди естественное русское соответствие — «срезали».
- source_word: מִשָּׁם
  choice: там
  rationale: В русском выражение «срезали там» естественно передаёт указание на место происхождения грозди, тогда как буквальное «срезали оттуда» звучит неестественно.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-родовой образ еврейского выражения и остаётся понятным в современном литературном русском; более гладкие этнонимические варианты приведены в сноске.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; потомки Израиля
  rationale: Доктринального различия здесь нет, однако выбранный вариант сохраняет буквальный семейно-родовой образ стандартного библейского этнонима, не превращая его молча в обычное национальное обозначение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «сыны Израиля». Синтаксис простой и ясный; топоним транслитерирован, а значимая игра слов и семантический диапазон נַחַל вынесены в сноски.
