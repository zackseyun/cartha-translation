lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: от колена
  rationale: В перечне представителей сочетание לְ с מַטֶּה указывает, из какого колена происходит названный человек; «от колена» естественно передаёт эту связь по-русски.
- source_word: אָשֵׁר
  choice: Асира
  rationale: Традиционная русская форма имени в родительном падеже после слова «колена».
- source_word: סְתוּר
  choice: Сетур
  rationale: Передача еврейского личного имени средствами русской библейской ономастической традиции.
- source_word: בֶּן
  choice: сын
  rationale: Стандартное обозначение отчества или родства в генеалогической формуле; имя отца по-русски ставится в родительном падеже.
- source_word: מִיכָאֵל
  choice: Михаила
  rationale: Устоявшаяся русская форма имени, поставленная в родительном падеже после слова «сын».
