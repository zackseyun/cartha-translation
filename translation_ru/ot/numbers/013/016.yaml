base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: ru
  text: Вот имена мужчин, которых Моисей послал разведать землю[a]. Моисей назвал Осию, сына Нуна[b], Иисусом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осмотреть землю». Еврейский глагол может обозначать исследование местности или разведку.'
    reason: lexical_alternative
  - marker: b
    text: Нун — имя отца Осии; в русской библейской традиции Иисуса, сына Нуна, обычно называют Иисусом Навином.
    reason: cultural_note
  - marker: c
    text: Осия — прежняя форма имени этого человека; здесь Моисей называет его Иисусом, то есть Иисусом Навином.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Вот имена
  rationale: Естественная для современного русского языка формула, подводящая итог приведённому перечню и сохраняющая указательное значение אֵלֶּה.
- source_word: הָאֲנָשִׁים
  choice: людей
  rationale: В контексте речь идёт о названных мужчинах-представителях; русское «людей» естественно после «имена» и не меняет состава группы.
- source_word: לָתוּר
  choice: осмотреть
  rationale: Глагол תור здесь обозначает исследование местности с целью разведки. «Осмотреть» ясно передаёт основное действие, не усиливая значение до тайного шпионажа.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Стандартное контекстуальное обозначение земли Ханаана; определённость референта в русском передаётся контекстом.
- source_word: וַיִּקְרָא
  choice: назвал
  rationale: В конструкции с лицом и новым именем קרא означает дать или употребить имя. «Назвал … Иисусом» близко к еврейской форме и не добавляет явно выраженного в тексте объяснения причин переименования.
- source_word: הוֹשֵׁעַ
  choice: Осия
  rationale: Традиционная и понятная русская передача имени הוֹשֵׁעַ; примечание поясняет, что это прежняя форма имени данного человека.
- source_word: בִּן נוּן
  choice: сына Нуна
  rationale: 'Непосредственная передача еврейского патронима: נוּן — личное имя отца. Форма «Нун» прозрачнее исходного текста, чем традиционное русское «Навин».'
- source_word: יְהוֹשֻׁעַ
  choice: Иисус
  rationale: Устоявшаяся русская библейская форма имени Иисуса Навина; в данном стихе патроним уже назван, поэтому добавлять «Навин» после нового имени не требуется.
theological_decisions:
- issue: Передача смены имени Осии
  choice: «назвал Осию … Иисусом»
  alternative: «дал Осии … имя Иисус»
  rationale: Выбрана более близкая к וַיִּקְרָא конструкция. Она сообщает факт наречения новым именем, но не вводит отсутствующего в стихе толкования значения имени или богословской причины переименования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и доступен; имена переданы в узнаваемой русской традиции, а форма «Нун» сохраняет прозрачность еврейского патронима.
