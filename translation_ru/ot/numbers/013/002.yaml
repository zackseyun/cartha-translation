base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: ru
  text: «Пошли от себя людей, чтобы они разведали землю Ханаанскую[a], которую Я даю сынам Израиля[b]. Из каждого племени по отцовскому роду пошлите по одному человеку; каждый из них — предводитель среди них[c]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они осмотрели»; возможен также перевод: «высмотрели».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынам Израиля» — обычное родовое и заветное обозначение всего народа Израиля.'
    reason: cultural_note
  - marker: c
    text: 'Или: «вождь» или «князь» среди них; еврейское слово может обозначать племенного предводителя или князя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Пошли от себя
  rationale: Императив שְׁלַח передан прямо, а לְךָ сохранено как «от себя». Это естественнее по-русски, чем буквальное «для себя», и не устраняет возможный оттенок личного поручения или дозволения Моисею.
- source_word: אֲנָשִׁים
  choice: людей
  rationale: В контексте речь идёт о мужчинах — племенных представителях; русское «людей» после «пошли» звучит естественно, а дальнейшее «по одному человеку» ясно передаёт мужской род участников.
- source_word: וְיָתֻרוּ
  choice: чтобы они разведали
  rationale: Глагол תור обозначает обследование или разведку земли. «Разведали» соответствует контексту рекогносцировки, не сужая значение исключительно до тайного шпионажа.
- source_word: אֶרֶץ כְּנַעַן
  choice: землю Ханаанскую
  rationale: Традиционная и литературно естественная русская форма точно передаёт сочетание «земля Ханаана».
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: которую Я даю
  rationale: Причастная форма נֹתֵן представляет дарование земли как совершающееся или установленное действие; настоящее время сохраняет эту аспектуальную открытость.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранена родственная и заветная формула בני ישראל, относящаяся ко всему народу Израиля.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: по одному человеку от каждого
  rationale: Конструкция передаёт распределительное значение повтора и естественно звучит по-русски.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: от каждого отцовского племени
  rationale: מַטֶּה здесь означает «племя», а אֲבֹתָיו указывает на происхождение по отцовской, родовой линии.
- source_word: תִּשְׁלָחוּ
  choice: пошлите
  rationale: Множественная форма второго лица передана без сглаживания; в речи к Моисею она может включать его как действующего вместе с ответственными представителями общины.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: каждый из них должен быть вождём среди своих
  rationale: נָשִׂיא обозначает признанного племенного начальника или вождя. «Среди своих» естественно передаёт בָהֶם в значении положения внутри соответствующего племени.
theological_decisions:
- issue: Оттенок לְךָ в Божьем повелении
  choice: Сохранено в основном тексте как «от себя»
  alternative: Опустить как идиоматический элемент либо перевести «для себя»
  rationale: Так сохраняется выраженный в еврейском тексте элемент личной отнесённости к Моисею, но не фиксируется спорное толкование — дозволение это, личная заинтересованность или усиление повеления.
- issue: Заветно-родовая формула בני ישראל
  choice: сынам Израиля
  alternative: израильтянам; детям Израиля
  rationale: Перевод сохраняет родственную метафору исходного текста и при этом понимается как обозначение всего народа, а не только взрослых мужчин.
- issue: Единственное и множественное обращение в стихе
  choice: «Пошли» (ед. ч.) и затем «пошлите» (мн. ч.)
  alternative: 'Унифицировать обращение в единственном числе: «пошли» в обоих случаях'
  rationale: Еврейский текст действительно переходит от שְׁלַח, единственного числа, к תִּשְׁלָחוּ, множественному. Сохранение перехода не устраняет возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Сохранены заветная формула «сынам Израиля», божественное «Я» с прописной буквы и переход от единственного к множественному числу в повелении. Архаизмы и канцелярская тяжеловесность избегаются.
