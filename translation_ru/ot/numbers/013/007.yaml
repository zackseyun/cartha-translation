lexical_decisions:
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В перечне представителей сочетание לְ с מַטֶּה указывает на колено, которое представляет названный человек. Русское «от колена» естественно и точно передаёт эту принадлежность в данном контексте.
- source_word: יִשָּׂשכָר
  choice: Иссахара
  rationale: Традиционная и общепонятная русская форма библейского имени; родительный падеж обусловлен сочетанием «от колена».
- source_word: יִגְאָל
  choice: Игаль
  rationale: Форма близко передаёт еврейское имя и соответствует нормам современной русской библейской транслитерации.
- source_word: בֶּן
  choice: сын
  rationale: В данном родовом обозначении слово имеет обычное непосредственное значение «сын»; оснований расширять его до «потомок» нет.
- source_word: יוֹסֵף
  choice: Иосифа
  rationale: Традиционная русская форма имени; родительный падеж определяется словом «сын».
