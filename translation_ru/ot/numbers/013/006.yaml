- source_word: לְמַטֵּה
  choice: от колена
  rationale: В перечне представителей предлог לְ при מַטֶּה указывает на колено, которое представляет названный человек. Русское «от колена» естественно передаёт принадлежность и представительство.
- source_word: יְהוּדָה
  choice: Иуды
  rationale: Устоявшаяся русская библейская форма имени; родительный падеж обусловлен сочетанием «колено Иуды».
- source_word: כָּלֵב
  choice: Халев
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: בֶּן
  choice: сын
  rationale: Конструктивная связь обозначает ближайшее отцовское происхождение; краткое «сын» естественно для перечня.
- source_word: יְפֻנֶּה
  choice: Иефоннии
  rationale: Устоявшаяся русская библейская форма имени; родительный падеж после слова «сын».
