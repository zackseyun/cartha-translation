  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: ru
  text: И они поднялись и разведали землю от пустыни Цин до Рехова, у Лево-Хамата.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Рехова, у входа в Хамат». Еврейское выражение может пониматься описательно, а не как название местности Лево-Хамат.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: они поднялись
  rationale: Глагол עלה передаёт движение вверх; «поднялись» естественно звучит в повествовании и сохраняет направительный оттенок.
- source_word: וַיָּתֻרוּ
  choice: разведали
  rationale: В данном контексте תור означает обследование земли посланными людьми; «разведали» точно передаёт целенаправленную рекогносцировку без лишней шпионской окраски.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте главы речь идёт о земле Ханаана; обычное русское соответствие здесь — «земля».
- source_word: מִמִּדְבַּר צִן
  choice: от пустыни Цин
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «пустыня» — естественное русское географическое обозначение, а Цин передано как топоним.
- source_word: עַד רְחֹב
  choice: до Рехова
  rationale: עַד указывает предел обследованной территории; «до Рехова» кратко и точно выражает этот диапазон.
- source_word: לְבֹא חֲמָת
  choice: у входа в Хамат
  rationale: Конструкция допускает описательное понимание «вход в Хамат» и топонимическое прочтение «Лево-Хамат». В основном тексте выбрано прозрачное описательное значение, а альтернативное чтение сохранено в сноске.
