lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: от колена
  rationale: В перечне представителей конструкция с לְ и מַטֶּה указывает на принадлежность названного человека к колену; «от колена» естественно и кратко передаёт эту связь.
- source_word: נַפְתָּלִי
  choice: Неффалимова
  rationale: Традиционная и хорошо узнаваемая русская форма имени колена; форма прилагательного естественна после слова «колено».
- source_word: נַחְבִּי
  choice: Нахби
  rationale: Транслитерация еврейского личного имени נַחְבִּי с сохранением согласных и гласных исходного текста.
- source_word: בֶּן
  choice: сын
  rationale: Стандартная передача еврейской родословной конструкции; в русском перечне определённый артикль отдельно не выражается.
- source_word: וָפְסִי
  choice: Вофсия
  rationale: Транслитерация масоретской формы וָפְסִי; родительный падеж обусловлен словом «сын».
