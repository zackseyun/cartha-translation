  terminology: «Колено», «сын», «Неффалим» и «Нахби» уместны. Имя וָפְסִי следует передать как «Вафси»; оно не требует русского падежного окончания в конструкции «сын Вафси». Английское «Vophsi» и его примечание фиксируют английскую традицию, но не являются основанием сохранять её фонетически неточную форму в русском тексте.
