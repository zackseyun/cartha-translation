  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: ru
  text: И какова эта земля — плодородна она или скудна, есть ли на ней деревья[a] или нет. Будьте смелы и возьмите плодов этой земли». Стояла пора созревания раннего винограда.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть ли на ней древесина»; еврейское слово может означать и дерево, и древесину.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а дни были днями первых созревших виноградин», то есть начиналась пора созревания винограда.'
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: плодородна ... бедна
  rationale: Буквальное противопоставление «тучная — тощая» применительно к земле означает её плодородие или скудость; выбранная пара естественна для современного русского языка.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: есть ли на ней деревья или нет
  rationale: עֵץ может обозначать как дерево, так и древесину. В описании свойств земли наиболее прямое чтение — наличие деревьев; иной возможный смысл отмечен в сноске.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: будьте смелы
  rationale: Возвратная порода выражает призыв укрепиться, собраться с духом; «будьте смелы» кратко и естественно передаёт силу повеления.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: возьмите плодов этой земли
  rationale: 'Предлог מִן имеет частичное значение: следует взять некоторое количество плодов. Контекст подразумевает, что их принесут обратно, но сам глагол этого прямо не выражает.'
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: первый виноград
  rationale: Сочетание обозначает первые созревшие ягоды или гроздья винограда и тем самым начало виноградного сезона; здесь нет необходимости вводить культовый термин «первые плоды».
- source_word: וְהַיָּמִים יְמֵי
  choice: стояла пора
  rationale: Еврейский повествовательный оборот буквально повторяет слово «дни»; русское выражение «стояла пора» естественно вводит временное примечание, сохраняя его функцию.
