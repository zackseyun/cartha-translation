lexical_decisions:
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В контексте перечня разведчиков сочетание предлога לְ с מַטֶּה обозначает принадлежность представителя к колену; «от колена» естественно и точно передаёт эту связь по-русски.
- source_word: גָד
  choice: Гада
  rationale: Название колена передано традиционной русской библейской транслитерацией и поставлено в родительный падеж после слова «колена».
- source_word: גְּאוּאֵל
  choice: Геуэл
  rationale: Личное имя транслитерировано с еврейского; форма «Геуэл» сохраняет последовательность согласных и гласных исходного имени.
- source_word: בֶּן
  choice: сын
  rationale: Стандартная передача еврейской генеалогической конструкции; в русском приложении перед именем отца артикль не требуется.
- source_word: מָכִי
  choice: Махи
  rationale: Личное имя транслитерировано непосредственно с еврейского текста.
