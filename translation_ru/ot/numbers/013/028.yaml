  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: ru
  text: Однако народ, живущий в той земле, силён, а города укреплены и очень велики. К тому же мы видели там потомков Анака[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Анака». Еврейское выражение обозначает происходящих от Анака.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Однако
  rationale: Сочетание вводит резкое ограничение к положительному сообщению предыдущего стиха; «однако» естественно передаёт противительное значение.
- source_word: עַז
  choice: силён
  rationale: Слово характеризует народ как сильный и внушающий опасение, не добавляя оттенка свирепости.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: народ, живущий в той земле
  rationale: Причастный оборот передан естественным русским определительным оборотом; указательное «той» уместно в устном отчёте о разведанной земле.
- source_word: וְהֶעָרִים בְּצֻרוֹת גְּדֹלֹת מְאֹד
  choice: а города укреплены и очень велики
  rationale: «Укреплены» передаёт военное значение בְּצֻרוֹת, а союз «и» сохраняет координацию двух характеристик городов.
- source_word: וְגַם
  choice: К тому же
  rationale: Передаёт добавление ещё одного тревожного обстоятельства и обеспечивает естественный переход в русском повествовании.
- source_word: יְלִדֵי הָעֲנָק
  choice: потомков Анака
  rationale: Конструкция обозначает людей, происходящих от Анака; «потомки» ясно и естественно выражает родословную связь.
- source_word: רָאִינוּ שָׁם
  choice: мы видели там
  rationale: Совершенный вид в прошедшем времени естественно передаёт завершённое наблюдение разведчиков; указание места сохранено.
