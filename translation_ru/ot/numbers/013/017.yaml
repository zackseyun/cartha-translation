base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: ru
  text: 'Моисей послал их разведать Ханаанскую землю[a] и сказал им: «Идите этим путём через Негев[b], а затем поднимитесь в горную область[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осмотреть Ханаанскую землю».'
    reason: lexical_alternative
  - marker: b
    text: Негев — засушливая область на юге Ханаана.
    reason: cultural_note
  - marker: c
    text: 'Или: «в горы»; еврейское слово может обозначать горы, нагорье или гористую область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שׁלח; естественно передаёт действие Моисея.
- source_word: לָתוּר
  choice: разведать
  rationale: В данном контексте תור обозначает целенаправленное обследование земли. «Разведать» передаёт задачу посланников, не сводя её непременно к тайному шпионажу.
- source_word: אֶרֶץ כְּנָעַן
  choice: Ханаанскую землю
  rationale: Сохраняет полное значение сочетания «земля Ханаана» и звучит естественно в современном русском библейском повествовании.
- source_word: עֲלוּ זֶה
  choice: поднимайтесь этим путём
  rationale: עֲלוּ сохраняет топографическое направление вверх, а наречное זֶה указывает на предложенный путь.
- source_word: בַּנֶּגֶב
  choice: в Негев
  rationale: Негев здесь — географическое название южной засушливой области; предлог передаёт направленность движения в неё.
- source_word: וַעֲלִיתֶם
  choice: а затем поднимитесь
  rationale: Форма с союзом продолжает последовательность указаний после повелительного наклонения; «а затем» ясно выражает следующий этап пути.
- source_word: הָהָר
  choice: горную область
  rationale: С определённым артиклем הָהָר в этом географическом контексте обозначает нагорье или гористую область, а не обязательно одну гору.
