  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: ru
  text: 'от колена Иосифа[a], от колена Манассии: Гадди, сын Суси.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от колена Иосифа, от колена Манассии»; Манассия здесь назван как та ветвь Иосифа, о которой идёт речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: от колена
  rationale: В перечне предлог לְ при מַטֶּה обозначает принадлежность представителя к колену; «от колена» естественно передаёт эту функцию по-русски.
- source_word: יוֹסֵף
  choice: Иосифа
  rationale: Традиционная русская передача имени יוֹסֵף; родительный падеж обусловлен сочетанием «от колена».
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: от колена Манассии
  rationale: Повтор оборота сохранён, поскольку еврейский текст уточняет, что здесь имеется в виду именно колено Манассии как ветвь Иосифа.
- source_word: גַּדִּי
  choice: Гадди
  rationale: Транслитерация личного имени с сохранением удвоенного согласного.
- source_word: בֶּן
  choice: сын
  rationale: Обычная передача родственного обозначения в перечне имён.
- source_word: סוּסִי
  choice: Суси
  rationale: Транслитерация личного имени; в русском языке имя на -и оставлено несклоняемым.
