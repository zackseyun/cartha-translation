id: NUM.21.14
reference: Numbers 21:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: ru
  text: 'Поэтому в Книге войн Яхве говорится: «Вахев в Суфе[a] и долины Арнона»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «Вахев в буре», если слово «Суфа» понимать не как название места, а как нарицательное существительное.'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст этой цитаты неясен; некоторые иначе понимают и слово «Вахев», считая его не названием места, а частью глагольного высказывания.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связку, вводящую ссылку на письменный источник.
- source_word: יֵאָמַר
  choice: говорится
  rationale: Нифаль здесь употреблён безлично и естественно передаётся по-русски формой «говорится».
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: в Книге войн Яхве
  rationale: Сохраняет конструкцию названия известного письменного источника и множественное число «войн».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶת וָהֵב
  choice: Вахев
  rationale: В этом неясном поэтическом отрывке форма, вероятнее всего, является топонимом; транслитерация не навязывает спорного глагольного толкования.
- source_word: בְּסוּפָה
  choice: в Суфе
  rationale: Суфа принята за топоним; предложный падеж делает выражение естественным по-русски, а нарицательное значение отмечено в сноске.
- source_word: וְאֶת הַנְּחָלִים אַרְנוֹן
  choice: и долины Арнона
  rationale: נחלים может обозначать долины сезонных водотоков и ущелья. «Долины» понятно широкому читателю и не требует добавлять отсутствующее в тексте пояснение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохранено личное имя Бога, присутствующее в названии цитируемой книги; титульная замена не вводится.
- issue: Неясность древней поэтической цитаты
  choice: Сохранить Вахев и Суфу как топонимы, отметив альтернативы в сносках
  alternative: Перевести Суфу как «буря» и/или понять וָהֵב как часть глагольного высказывания
  rationale: Еврейская строка допускает разные разборы; основной текст следует вероятному географическому пониманию, не скрывая неопределённости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Неясность архаической поэтической строки сохранена; редкие топонимы не истолкованы предположительно в основном тексте.
