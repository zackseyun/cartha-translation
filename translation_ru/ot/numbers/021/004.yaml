id: NUM.21.4
reference: Numbers 21:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: ru
  text: Затем они отправились от горы Ор по дороге к Красному морю[a], чтобы обойти землю Эдома. В пути народ потерял терпение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по дороге к Тростниковому морю». Еврейское название — ям-суф.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народ пал духом» или «уныл в пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в описаниях переходов Израиля означает сняться с места и продолжить путь; «отправились» естественно передаёт начало очередного перехода.
- source_word: מֵהֹר הָהָר
  choice: от горы Ор
  rationale: הֹר הָהָר — географическое название; форма «гора Ор» соответствует русской библейской традиции и современному литературному употреблению.
- source_word: דֶּרֶךְ יַם סוּף
  choice: по дороге к Красному морю
  rationale: דֶּרֶךְ обозначает дорогу или направление пути. Традиционное соответствие יַם סוּף — «Красное море» сохранено в основном тексте, а буквальный вариант вынесен в сноску.
- source_word: לִסְבֹב
  choice: чтобы обойти
  rationale: Инфинитив передаёт цель избранного маршрута; «обойти» ясно и естественно выражает движение в обход территории Эдома.
- source_word: אֶת אֶרֶץ אֱדֹם
  choice: землю Эдома
  rationale: אֶרֶץ здесь обозначает землю или территорию Эдома; буквальное «землю Эдома» естественно для русского библейского повествования.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: народ потерял терпение
  rationale: Идиома קצר נפש буквально описывает «сокращение души» и в данном контексте выражает нетерпение и тягостную усталость. «Потерял терпение» сохраняет основной смысл, не устраняя возможного оттенка уныния, отмеченного в сноске.
- source_word: בַּדָּרֶךְ
  choice: в пути
  rationale: Предлог בְּ допускает локативное прочтение «в пути»; маршрут мог также быть причиной недовольства, но прямое локативное значение сохранено в тексте.
