  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: ru
  text: Мы обстреляли их[a]; Хешбон погиб до Дивона, и мы разорили до Нофаха[b], который простирается до Медевы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальная фраза в еврейском тексте трудна для понимания и допускает несколько переводов, в том числе: «мы ниспровергли их» или «их владычество погибло».'
    reason: textual_variant
  - marker: b
    text: Форма, переведённая как «мы разорили», также неясна; её понимают по-разному. Однако контекст этой победной песни говорит в пользу глагола со значением опустошения.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: Мы поразили их стрелами
  rationale: Трудная форма, вероятно связанная с глаголом ירה («стрелять»); такой перевод передаёт яркий военный образ победной песни, а существенная неопределённость отмечена в сноске.
- source_word: אָבַד
  choice: погиб
  rationale: Глагол означает гибель или уничтожение; краткое «погиб» соответствует поэтическому контексту и совершенному виду.
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Географическое название передано принятой русской транслитерацией.
- source_word: עַד דִּיבוֹן
  choice: до самого Дивона
  rationale: עַד обозначает предел распространения; «до самого» естественно подчёркивает территориальную протяжённость.
- source_word: וַנַּשִּׁים
  choice: и мы разорили всё
  rationale: Форма неясна, но в контексте победной песни наиболее вероятен глагольный смысл опустошения; «всё» делает по-русски естественным подразумеваемый объект, не устраняя отмеченную в сноске неопределённость.
- source_word: עַד נֹפַח
  choice: до Нофаха
  rationale: עַד указывает на предел, а Нофах передан как топоним.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: что простирается до Медевы
  rationale: Относительное אֲשֶׁר связывает предыдущую географическую точку с дальнейшим указанием границы; формулировка сохраняет неоднозначность референта среднего рода в русском.
- source_word: מֵידְבָא
  choice: Медева
  rationale: Использована традиционная русская форма библейского топонима.
