  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: ru
  text: И Яхве услышал голос Израиля и отдал ему хананеев. Израиль обрёк их и их города на уничтожение. Поэтому это место назвали Хорма[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Хорма» связано с еврейским словом, означающим «предание уничтожению» или «заклятие».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: внял голосу
  rationale: Сохраняет образ «голоса» и одновременно естественно передаёт смысл благосклонного ответа на просьбу Израиля.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: отдал ему хананеев
  rationale: Глагол נתן с враждебным объектом означает передачу в чью-либо власть. Единственное собирательное הַכְּנַעֲנִי естественно передано русским множественным числом; местоимение «ему» относится к Израилю.
- source_word: וַיַּחֲרֵם
  choice: обрёк ... на уничтожение
  rationale: Передаёт результативный и специальный смысл חרם — безвозвратно предназначить для уничтожения — ясным современным русским языком, не сводя выражение к нейтральному «победил».
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: их и их города
  rationale: Прямо сохраняет оба объекта действия.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: это место назвали
  rationale: Неопределённо-личная конструкция не уточняет невыраженного субъекта еврейского глагола и естественно передаёт результат наречения имени.
- source_word: חָרְמָה
  choice: Хорма
  rationale: Топоним транслитерирован; его созвучие с חרם поясняется в примечании.
theological_decisions:
- issue: Передача терминологии חרם в контексте войны
  choice: обрёк их и их города на уничтожение
  alternative: предал их и их города заклятию; полностью уничтожил их и их города
  rationale: Выбранная формулировка ясно сообщает об уничтожении и сохраняет оттенок безвозвратного предназначения, не вводя в основной текст малопонятный специальный термин и не добавляя конфессионального толкования.
- issue: Субъект действия וַיַּחֲרֵם
  choice: Израиль
  alternative: Яхве; неопределённый субъект
  rationale: Ближайший смысловой субъект — собирательное «Израиль», исполняющее обет из предыдущего стиха. Повтор существительного по-русски устраняет ошибочное отнесение местоимения «он» к Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Внял голосу» сохраняет исходный образ, оставаясь понятным; синтаксис разделён на короткие фразы для ясности.
