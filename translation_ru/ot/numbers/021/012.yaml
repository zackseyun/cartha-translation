  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: ru
  text: Оттуда они отправились в путь и разбили лагерь в долине Заред[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ущелье Заред», «в вади Заред» или «в русле Заред». Еврейское слово на́халь может означать долину, ущелье, вади или русло сезонного потока.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Точно и естественно передаёт указание на отправление из предыдущего места.
- source_word: נָסָעוּ
  choice: они отправились в путь
  rationale: В повествованиях о переходах глагол נסע обозначает снятие с места и начало следующего перехода; выбранная формулировка естественна в современном русском языке.
- source_word: וַיַּחֲנוּ
  choice: и разбили лагерь
  rationale: Передаёт значение глагола חנה — остановиться и расположиться лагерем — яснее и современнее, чем «стали станом».
- source_word: בְּנַחַל
  choice: у потока
  rationale: Предлог בְּ здесь естественно передаётся как «у» при обозначении места стоянки, а נַחַל может называть поток, долину, ущелье или сезонное русло; неоднозначность отмечена в сноске.
- source_word: זָרֶד
  choice: Заред
  rationale: Географическое название передано принятой русской транслитерацией.
