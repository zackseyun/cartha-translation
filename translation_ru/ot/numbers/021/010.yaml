  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: ru
  text: Затем сыны Израиля отправились в путь и расположились станом в Овофе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились в путь
  rationale: В описании странствий глагол נסע означает сняться со стоянки и двинуться дальше. Выражение «отправились в путь» естественно в современном русском и передаёт переход к следующему этапу пути.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Буквально «сыны Израиля»; это устойчивое собирательное обозначение народа. Формулировка сохраняет образность еврейского выражения и остаётся понятной в литературном русском.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה в повествовании о странствиях обозначает устройство лагеря на стоянке. «Расположились станом» передаёт это значение ясно и в достойном повествовательном регистре.
- source_word: בְּאֹבֹת
  choice: в Овофе
  rationale: אֹבֹת — географическое название, переданное традиционной русской формой «Овоф». Предлог בְ при глаголе стоянки естественно передаётся русским «в».
- source_word: וַ
  choice: Затем
  rationale: Начальный нарративный союз продвигает последовательность событий; «затем» естественно выражает очередной этап маршрута.
