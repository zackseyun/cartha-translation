  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор имени «Сихон» во втором предложении устраняет неестественную для русского языка неоднозначность местоимения при сохранении содержания оригинала; разделение на два предложения облегчает чтение.
