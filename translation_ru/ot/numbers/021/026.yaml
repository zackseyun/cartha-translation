base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: ru
  text: Ибо Хешбон был городом Сихона, царя аморреев. Сихон воевал с прежним царём Моава и отнял у него всю его землю[a] вплоть до Арнона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть отнял у него, лишив его власти над землёй; буквально: «из его руки».'
    reason: 'Поясняет еврейскую идиому מִיָּדוֹ: основной текст передаёт её естественным русским оборотом, а сноска сохраняет буквальный образ и значение утраты власти или владения.'
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предшествующему сообщению; «ведь» естественно передаёт эту пояснительную связь.
- source_word: עִיר סִיחֹן
  choice: городом Сихона
  rationale: Конструкция указывает, что Хешбон принадлежал Сихону и служил его царским городом; добавлять отсутствующее в тексте слово «столица» не следует.
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Традиционное и понятное русское обозначение народа; единственное число в еврейском употреблено как этническое наименование царя.
- source_word: נִלְחַם בְּ
  choice: воевал с
  rationale: Передаёт значение вступления в войну или ведения войны против другого царя без излишней конкретизации отдельного сражения.
- source_word: מֶלֶךְ מוֹאָב הָרִאשׁוֹן
  choice: прежним царём Моава
  rationale: В данном контексте הָרִאשׁוֹן естественнее обозначает более раннего, прежнего царя, а не обязательно первого царя Моава вообще.
- source_word: וַיִּקַּח
  choice: и отнял
  rationale: Глагол описывает захват территории в результате войны; «отнял» сохраняет связь с последующим образом руки и не перегружает текст.
- source_word: כָּל אַרְצוֹ
  choice: всю его землю
  rationale: Местоимение относится к царю Моава; формулировка сохраняет возможную референциальную напряжённость оригинала, хотя контекст делает смысл ясным.
- source_word: מִיָּדוֹ
  choice: из его рук
  rationale: Русское выражение сохраняет образ еврейской идиомы и одновременно понятно в значении утраты владения или власти.
- source_word: עַד אַרְנֹן
  choice: вплоть до Арнона
  rationale: Передаёт Арнон как предел захваченной территории.
