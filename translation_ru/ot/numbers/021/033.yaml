base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: ru
  text: Затем они повернули и пошли вверх по дороге в Башан. И Ог, царь Башана, выступил им навстречу[a] со всем своим народом, чтобы сразиться с ними при Едреи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение может само по себе означать просто «выйти навстречу»; здесь последующие слова «чтобы сразиться» ясно указывают на враждебную встречу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: они повернули
  rationale: Глагол פנה в повествовательной последовательности обозначает перемену направления; «повернули» передаёт это кратко и естественно.
- source_word: וַיַּעֲלוּ
  choice: пошли
  rationale: עלה буквально означает движение вверх, однако в данном маршрутом контексте русское «пошли» звучит естественно; топографическая направленность неясна и не требует искусственного «поднялись».
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: по дороге в Башан
  rationale: Сочетание דֶּרֶךְ с названием местности обозначает путь или дорогу, ведущую в эту область; такой перевод ясен современному читателю.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ог, царь Башана
  rationale: Имя передано в принятой русской библейской форме, а титул — как приложение.
- source_word: וַיֵּצֵא
  choice: выступил
  rationale: В военном контексте יצא означает выход навстречу противнику; «выступил» естественно передаёт действие, не добавляя прямого указания на организованный марш.
- source_word: לִקְרָאתָם
  choice: им навстречу
  rationale: Это близко к прямому значению выражения и сохраняет его формальную нейтральность; враждебный характер встречи раскрывается последующей целью битвы.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: со всем своим народом
  rationale: עם буквально означает «народ». Военный контекст не даёт основания без необходимости заменять его словами «войско» или «воины».
- source_word: לַמִּלְחָמָה
  choice: чтобы сразиться с ними
  rationale: Предлог ל выражает цель, а מִלְחָמָה здесь означает вооружённое столкновение; русский инфинитивный оборот естественно передаёт значение цели.
- source_word: אֶדְרֶעִי
  choice: при Едреи
  rationale: Название передано в традиционной русской форме; «при» идиоматично указывает место сражения, не превращая топоним в направление движения.
