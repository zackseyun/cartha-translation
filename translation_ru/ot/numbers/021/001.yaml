source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: ru
  text: Когда ханаанский царь Арада, живший в Негеве, услышал, что Израиль идёт по дороге Атарим[a], он вступил в бой с Израилем и взял некоторых из израильтян в плен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по дороге Атарим». Значение слова «Атарим» неясно: его можно понимать как название места, а некоторые древние переводы связывают его со значением «разведчики» или «соглядатаи».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: В повествовательном контексте שׁמע означает получение известия; «услышал» естественно передаёт смысл и последовательность событий.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: ханаанский царь Арада
  rationale: Определение הַכְּנַעֲנִי указывает на этническую принадлежность царя, а конструкция מֶלֶךְ עֲרָד — на его владение; такое сочетание естественно для современного русского языка.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: живший в Негеве
  rationale: Причастие יֹשֵׁב обозначает постоянное проживание, а הַנֶּגֶב здесь сохранено как название географической области.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: что Израиль идёт
  rationale: כִּי вводит содержание услышанного, а בָּא в данном контексте описывает приближение Израиля по определённому пути.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: по дороге Атарим
  rationale: דֶּרֶךְ означает дорогу или путь. Неясное הָאֲתָרִים консервативно передано как собственное название, а альтернативное понимание вынесено в примечание.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: он вступил в бой с Израилем
  rationale: Форма глагола לחם с предлогом ב обозначает враждебное военное столкновение; перевод не преувеличивает его масштаб.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: взял некоторых из израильтян в плен
  rationale: Глагол שׁבה и родственное существительное שֶׁבִי образуют выражение о захвате пленных. מִמֶּנּוּ имеет партитивный смысл по отношению к собирательному «Израиль».
theological_decisions: []
