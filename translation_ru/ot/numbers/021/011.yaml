  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: ru
  text: Они отправились из Овофа и разбили лагерь в Ийе-Авариме, в пустыне, которая находится напротив Моава, к востоку от него.[a]
  philosophy: optimal-equivalence
  footnotes:
