    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле описания переходов נסע означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт начало очередного перехода.
- source_word: מֵאֹבֹת
  choice: из Овофа
  rationale: Географическое название передано принятой русской библейской формой «Овоф» с соответствующим падежным окончанием.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: חנה означает разбить лагерь, стать станом; эта формулировка конкретна, понятна и сохраняет повествовательный регистр.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: в Ийе-Авариме
  rationale: Сочетание выступает как географическое название, поэтому в основном тексте оно транслитерировано; прозрачный буквальный смысл עִיֵּי отмечен в сноске.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר здесь обозначает пустынную, необжитую местность; «пустыня» — естественный русский эквивалент в контексте странствования.
- source_word: אֲשֶׁר עַל פְּנֵי מוֹאָב
  choice: напротив Моава
  rationale: В географическом описании עַל־פְּנֵי указывает на положение напротив или перед чем-либо; «напротив Моава» ясно передаёт пространственное отношение.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: к востоку
  rationale: Буквально выражение связано с восходом солнца, но в данном географическом контексте обозначает восточную сторону относительно Моава; «к востоку» естественно и точно передаёт ориентир.
