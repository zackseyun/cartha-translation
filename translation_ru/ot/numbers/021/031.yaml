  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: ru
  text: И поселился Израиль в земле аморреев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Глагол יָשַׁב может означать «сидеть, жить, обитать, селиться». В данном повествовательном итоге «поселился» естественно передаёт начало проживания Израиля на занятой территории, не утверждая непременно её окончательного и постоянного освоения.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма имени; здесь обозначает народ как единое целое, поэтому сказуемое дано в единственном числе.
- source_word: בְּאֶרֶץ
  choice: в земле
  rationale: אֶרֶץ здесь означает определённую территорию. «В земле» сохраняет библейскую образность и остаётся понятным в современном литературном русском.
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: 'Еврейская форма — собирательное название народа в единственном числе; по-русски принадлежность земли этому народу естественно выражается родительным множественного числа: «земля аморреев».'
