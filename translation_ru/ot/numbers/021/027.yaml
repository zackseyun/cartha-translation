  source_fidelity: 'Текст точно передаёт причинный ввод עַל־כֵּן, формулу יֹאמְרוּ в обобщённом настоящем, повелительное בֹּאוּ и волитивно-пассивный параллелизм «пусть будет построен / и ... утверждён». «Город Сигона» верно отражает конструкцию עִיר סִיחוֹן. Добавление «прочно» допустимо: оно эксплицирует семантику כון («быть твёрдо установленным»), не меняя смысла.'
