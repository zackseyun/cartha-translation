lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим повествованием естественным современным русским союзным словом.
- source_word: יֹאמְרוּ
  choice: говорят
  rationale: Имперфект в формуле цитирования имеет обычное, обобщённо-настоящее значение.
- source_word: הַמֹּשְׁלִים
  choice: слагатели притч
  rationale: В данном контексте причастие от משל обозначает сочинителей или исполнителей притчевого, песенного изречения; перевод сохраняет связь с притчами и не смешивает их с политическими правителями.
- source_word: בֹּאוּ
  choice: Приходите
  rationale: Передаёт повелительную форму второго лица множественного числа и направленность движения к Есевону.
- source_word: חֶשְׁבּוֹן
  choice: Есевон
  rationale: Использована укоренившаяся в русской библейской традиции форма топонима.
- source_word: תִּבָּנֶה
  choice: Пусть будет построен
  rationale: Передаёт страдательную форму и волитивный оттенок поэтического имперфекта без добавления значения повторного строительства.
- source_word: וְתִכּוֹנֵן
  choice: и прочно утверждён
  rationale: Передаёт значение прочного основания и установления города, сохраняя поэтический параллелизм с «построен».
- source_word: עִיר סִיחוֹן
  choice: город Сигона
  rationale: Естественно передаёт сопряжённую конструкцию принадлежности; имя дано в традиционной русской библейской форме.
