  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: ru
  text: 'Оттуда они отправились в Беэр[a]. Это тот колодец[b], о котором Яхве сказал Моисею: «Собери народ, и Я дам им воду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Беэр — название места; на еврейском оно созвучно слову «колодец».
    reason: cultural_note
  - marker: b
    text: 'Или: «Это колодец, о котором Яхве сказал Моисею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Оттуда
  rationale: Естественно продолжает описание пути; союз ו передан связностью русского повествования без обязательного отдельного «и».
- source_word: בְּאֵרָה
  choice: они отправились в Беэр
  rationale: Форма с направительным окончанием указывает на движение к месту Беэр. В еврейском глагол движения подразумевается, а в русском добавлен для ясности.
- source_word: הִוא הַבְּאֵר
  choice: Это тот колодец
  rationale: Опознавательная конструкция выделяет известный колодец и объясняет значение названия места.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: о котором Яхве сказал Моисею
  rationale: Относительное местоимение связывает колодец с последующими словами Яхве; возможное пространственное понимание сохранено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱסֹף אֶת הָעָם
  choice: Собери народ
  rationale: Прямой и естественный перевод повелительной формы и собирательного существительного עָם.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: и Я дам им воду
  rationale: Когортатив после повеления выражает намерение или обещанный результат; будущее время естественно передаёт это по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь колодца с речью Яхве
  choice: о котором Яхве сказал
  alternative: у которого Яхве сказал
  rationale: אֲשֶׁר допускает контекстуальную связь как с предметом речи, так и с местом события. Основной текст следует пониманию «о котором», а пространственная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и сдержанно возвышенным тоном. Подразумеваемое движение выражено явно ради естественности русского текста; игра слов в названии Беэр пояснена в сноске.
