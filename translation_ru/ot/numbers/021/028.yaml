base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: ru
  text: 'Ведь огонь вышел из Хешбона,

    пламя — из города Сихона;

    пламя пожрало Ар-Моав

    и владетелей[a] высот[b] Арнона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитателей». Еврейское слово буквально означает «владетели», «хозяева» или «обладатели», но в данном контексте может обозначать жителей этой местности.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «священных высот». Еврейское слово может обозначать как возвышенности вообще, так и культовые места на высотах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующей строкой песни и естественно звучит в современном русском языке.
- source_word: אֵשׁ יָצְאָה מֵחֶשְׁבּוֹן
  choice: огонь вышел из Хешбона
  rationale: Сохраняет конкретный поэтический образ и направление действия, выраженное предлогом מִן.
- source_word: לֶהָבָה מִקִּרְיַת סִיחֹן
  choice: пламя — из города Сихона
  rationale: Краткая эллиптическая конструкция воспроизводит параллелизм еврейской строки; קִרְיָה понято как нарицательное «город», а не как часть имени собственного.
- source_word: אָכְלָה
  choice: оно пожрало
  rationale: Глагол буквально описывает огонь как пожирающий; местоимение в русском относится к ближайшему слову «пламя» и сохраняет яркость поэтической метафоры.
- source_word: עָר מוֹאָב
  choice: Ар-Моав
  rationale: עָר понято как известное географическое название Ар, а не как нарицательное «город»; составная передача ясно связывает его с Моавом.
- source_word: בַּעֲלֵי
  choice: владык
  rationale: Передаёт основное значение «господа, хозяева, владетели» и сохраняет возвышенный поэтический регистр; возможное контекстуальное значение «обитатели» отмечено в сноске.
- source_word: בָּמוֹת אַרְנֹן
  choice: высот Арнона
  rationale: בָּמוֹת может обозначать как возвышенности, так и культовые высоты. Нейтральное «высоты» не навязывает культового истолкования и естественно сочетается с географическим названием Арнон.
