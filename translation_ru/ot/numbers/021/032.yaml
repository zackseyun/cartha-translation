base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: ru
  text: Тогда Моисей послал людей разведать Иазер. Они захватили зависевшие от него селения[a] и изгнали живших там аморреев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её дочерей» — древнееврейское обозначение зависимых от города поселений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שׁלח; естественно передаёт действие Моисея.
- source_word: לְרַגֵּל
  choice: разведать
  rationale: Порода пиэль здесь обозначает военную разведку местности; русский глагол сохраняет этот смысл без оттенка тайного шпионажа как единственно возможного.
- source_word: יַעְזֵר
  choice: Иазер
  rationale: Традиционная русская передача библейского топонима.
- source_word: וַיִּלְכְּדוּ
  choice: захватили
  rationale: לכד в военном контексте означает взять или захватить населённые пункты.
- source_word: בְּנֹתֶיהָ
  choice: зависевшие от него селения
  rationale: Буквально «её дочери»; это древнееврейское географическое выражение обозначает подчинённые городу поселения. Местоименная соотнесённость с Иазером естественно передана по-русски мужским родом.
- source_word: וַיִּירַשׁ
  choice: изгнали
  rationale: В контексте завоевания ירש указывает на лишение прежних жителей владения и овладение их землёй; «изгнали» ясно передаёт удаление аморреев, хотя оттенок вступления во владение остаётся контекстуальным.
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Собирательное единственное число этнонима естественно передаётся русским множественным числом.
- source_word: אֲשֶׁר שָׁם
  choice: живших там
  rationale: Причастный оборот естественно по-русски обозначает находившихся в этом месте аморреев.
