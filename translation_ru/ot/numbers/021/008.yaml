  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Сделай себе огненного змея[a] и помести его на шесте[b]. И всякий укушенный, взглянув на него, будет жить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жгучего змея»; еврейское слово означает «огненный, жгучий» и здесь обозначает смертоносного змея.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на знамени» или «на сигнальном шесте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: עֲשֵׂה לְךָ
  choice: сделай себе
  rationale: Сохраняет императив и дательный оборот с местоимением, естественно звучащий по-русски.
- source_word: שָׂרָף
  choice: огненного змея
  rationale: Сохраняет образ «жгучего/огненного» существа и в данном повествовательном контексте ясно указывает на змея; не вводит более позднюю ассоциацию слова «серафим» с небесным существом.
- source_word: נֵס
  choice: шесте
  rationale: В контексте обозначает высокий предмет, на котором выставляется изображение; «шест» ясно передаёт конкретный смысл, тогда как слово также может обозначать знамя или сигнальный знак.
- source_word: הַנָּשׁוּךְ
  choice: всякий укушенный
  rationale: Определённое страдательное причастие употреблено обобщённо; формулировка сохраняет краткость и универсальный охват.
- source_word: וְרָאָה אֹתוֹ
  choice: взглянув на него
  rationale: Передаёт целенаправленный взгляд на выставленного змея и естественно выражает условно-временную связь действий.
- source_word: וָחָי
  choice: будет жить
  rationale: Прямо передаёт обещанный результат, не уточняя без необходимости, идёт ли речь об исцелении или сохранении жизни.
theological_decisions:
- issue: Значение и образ שָׂרָף
  choice: 'В основном тексте: «огненный змей».'
  alternative: «жгучий змей», «ядовитый змей» или «сераф».
  rationale: Контекст требует змея, связанного с предшествующим нашествием; «огненный» сохраняет образ исходного слова, а «ядовитый» уже истолковывает причину смертельного действия укуса.
- issue: Характер обещания וָחָי
  choice: «будет жить».
  alternative: «останется жив» или «оживёт».
  rationale: Исходная формулировка допускает акцент как на сохранении жизни, так и на выздоровлении; нейтральное «будет жить» не снимает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Синтаксис близок к еврейскому, но естественен для обычного читателя; неоднозначные слова снабжены сносками.
