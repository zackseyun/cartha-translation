base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: ru
  text: Но Сигон не позволил Израилю пройти через свои владения[a]. Тогда Сигон собрал весь свой народ[b], вышел в пустыню навстречу Израилю, пришёл в Иаацу[c] и сразился с Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройти через его пределы»; еврейское слово может обозначать как границу, так и ограниченную ею территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь свой народ». Военный контекст подразумевает вооружённых людей, однако слово «войско» в еврейском тексте не употреблено.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское название можно также передать как «Яхац».
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: не позволил ... пройти
  rationale: В этой конструкции נָתַן выражает разрешение, а инфинитив עֲבֹר — проход через чужую землю; русский оборот естественно передаёт идиоматический смысл.
- source_word: בִּגְבֻלוֹ
  choice: через свои владения
  rationale: גְּבוּל может обозначать границу, пределы или территорию. Здесь речь идёт о проходе по земле Сигона, поэтому «владения» яснее буквальной «границы».
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: собрал весь свой народ
  rationale: Сохранено прямое значение עַם. Военный контекст предполагает вооружённое выступление, но слово «войско» в еврейском тексте отсутствует.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: навстречу Израилю
  rationale: Оборот буквально указывает на движение навстречу. Враждебность не внесена преждевременно, поскольку далее она прямо выражена глаголом «сразился».
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительный суффикс -ה указывает на движение к пустыне или в неё; «в пустыню» естественно передаёт это направление.
- source_word: יָהְצָה
  choice: к Иааце
  rationale: Направительная форма названия места передана с предлогом «к»; «Иааца» — укоренившаяся в русской библейской традиции форма топонима.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: сразился с Израилем
  rationale: Глагол לחם с предлогом ב обозначает враждебное военное столкновение; «сразился с» точно и естественно передаёт смысл.
- source_word: וְלֹא
  choice: Но ... не
  rationale: Союз вводит контраст с предшествующей просьбой Израиля разрешить проход, поэтому русское «но» уместнее механического «и».
