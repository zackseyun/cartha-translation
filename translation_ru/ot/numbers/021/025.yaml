  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: ru
  text: Израиль взял все эти города и поселился во всех городах аморреев — в Хешбоне и во всех зависимых от него поселениях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и во всех её дочерях» — то есть в небольших поселениях, зависимых от главного города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Глагол לקח буквально означает «брать, взять»; в военном контексте естественно подразумевает овладение городами, не усиливая смысл до «захватил» без необходимости.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: все эти города
  rationale: Сохраняются и значение עָרִים, и указательное הָאֵלֶּה; «города» уместно в контексте завоевания.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: В данном контексте ישב обозначает не только проживание, но и обоснование на занятой территории; «поселился» передаёт этот переход к постоянному обитанию.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: во всех городах аморреев
  rationale: Конструкция принадлежности передана естественным русским родительным падежом; собирательное обозначение народа выражено множественным числом.
- source_word: בְּחֶשְׁבּוֹן
  choice: в Хешбоне
  rationale: Название חֶשְׁבּוֹן передано принятой русской библейской формой «Хешбон».
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: и во всех зависимых от него поселениях
  rationale: Буквально «и во всех её дочерях» — древний оборот о небольших поселениях, административно зависимых от главного города. Ясный смысл вынесен в текст, а буквальный образ сохранён в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским звучанием. Повтор «Израиль» во второй части снят как необязательный для естественного русского синтаксиса; тире поясняет, какие именно города имеются в виду. Местоимение «него» относится к Хешбону и устраняет неестественное для русского грамматическое согласование буквального «её».
