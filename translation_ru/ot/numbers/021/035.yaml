  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: ru
  text: И они поразили его[a], его сыновей и весь его народ, не оставив ему ни одного уцелевшего, и овладели его землёй[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгромили»; в данном контексте также возможно: «убили».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «завладели его землёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: В военном контексте נכה обозначает нанесение поражения, нередко со смертельным исходом. «Поразили» сохраняет конкретную силу глагола, не уточняя сверх текста «убили» или «разгромили».
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Мужская форма множественного числа здесь естественно передаётся как «сыновей», без необоснованной нейтрализации до «детей».
- source_word: כָּל עַמּוֹ
  choice: весь его народ
  rationale: עַם обычно означает народ в широком смысле; контекст не требует сужать значение до одного лишь войска.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: не оставив ему ни одного уцелевшего
  rationale: 'Оборот выражает полное уничтожение: буквально — «пока не оставил ему уцелевшего». Деепричастная конструкция естественно связывает результат с предыдущим действием и сохраняет указание «ему».'
- source_word: שָׂרִיד
  choice: уцелевший
  rationale: В военном контексте «уцелевший» ясно передаёт שָׂרִיד и не привносит возможных богословских ассоциаций слова «остаток».
- source_word: וַיִּירְשׁוּ
  choice: овладели
  rationale: Здесь ירשׁ означает вступление во владение землёй после победы. «Овладели» естественно передаёт захват и последующее обладание, не создавая впечатления мирного наследования.
- source_word: אַרְצוֹ
  choice: его землёй
  rationale: אֶרֶץ обозначает подвластную Огу территорию; «земля» — широкое и традиционное соответствие.
