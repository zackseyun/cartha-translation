  source_fidelity: 'Русский текст точно передаёт последовательность еврейского оригинала: «они» поразили Ога, его сыновей и весь его народ; никого не оставили ему в живых; затем овладели его землёй. «Поразили» удачно сохраняет военную силу וַיַּכּוּ, не сводя её без необходимости к одному значению «убили» или «разгромили». Оборот «не оставив ему ни одного уцелевшего» естественно передаёт עַד־בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד, включая указание לוֹ («ему»).'
