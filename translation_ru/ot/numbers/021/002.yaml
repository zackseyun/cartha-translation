  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: ru
  text: 'Тогда Израиль дал обет Господу и сказал: «Если Ты действительно предашь этот народ в мои руки[a], то я обреку их города на полное уничтожение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская конструкция усиливает глагол; буквально: «если, отдавая, отдашь». Возможный перевод: «если Ты непременно предашь этот народ в мои руки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предам их города заклятию». Речь идёт о хереме — безвозвратном посвящении чего-либо уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: дал обет
  rationale: Однокоренная еврейская конструкция буквально означает «дал обет обетом»; естественный русский эквивалент «дал обет» сохраняет смысл торжественного обещания.
- source_word: לַיהוָה
  choice: Господу
  rationale: Имя יהוה передано традиционным русским библейским соответствием «Господь», уместным для современного литературного текста.
- source_word: אִם נָתֹן תִּתֵּן
  choice: Если Ты действительно предашь
  rationale: Сочетание абсолютного инфинитива со спрягаемой формой усиливает глагол; «действительно» ясно передаёт это усиление без буквальной тяжеловесности.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняется собирательное единственное число עָם и указательное определение.
- source_word: בְּיָדִי
  choice: в мои руки
  rationale: Русский оборот естественно сохраняет исходный образ передачи противника во власть Израиля.
- source_word: וְהַחֲרַמְתִּי
  choice: обреку ... на полное уничтожение
  rationale: Формулировка передаёт не просто военное поражение, а безвозвратное посвящение захваченного уничтожению в рамках херема; культовый оттенок дополнительно пояснён в сноске.
- source_word: עָרֵיהֶם
  choice: их города
  rationale: Прямое и контекстуально уместное соответствие множественному числу עִיר.
theological_decisions:
- issue: Передача חרם в военном обете
  choice: обреку их города на полное уничтожение
  alternative: предам их города заклятию
  rationale: Основной текст делает результат понятным современному читателю, одновременно сохраняя формальный характер действия. Сноска отмечает особое понятие херема и не сводит его к обычному разрушению.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Синтаксис остаётся ясным, а специальные культово-военные оттенки вынесены в сноску.
