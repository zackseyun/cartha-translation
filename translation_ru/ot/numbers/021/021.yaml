  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Затем послал
  rationale: Форма с последовательным вау продвигает повествование; «затем» естественно передаёт переход к следующему событию.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: В данном контексте имя обозначает народ Израиля; традиционная русская форма уместна.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В дипломатическом контексте речь идёт о людях, передающих послание, а не о небесных существах.
- source_word: אֶל
  choice: к
  rationale: Естественный русский эквивалент предлога направления при глаголе «послал».
- source_word: סִיחֹן
  choice: Сихону
  rationale: Использована традиционная русская библейская форма имени с требуемым дательным падежом.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: царю аморреев
  rationale: Конструктивное сочетание обозначает Сихона как царя аморейского народа; форма «аморреев» соответствует устоявшемуся русскому библейскому употреблению.
- source_word: לֵאמֹר
  choice: чтобы сказать
  rationale: Инфинитив вводит содержание последующего обращения; этот вариант естественно соединяет стих с прямой речью следующего стиха.
