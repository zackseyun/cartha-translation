lexical_decisions:
- source_word: וּמִמַּתָּנָה
  choice: И от Маттаны
  rationale: Союз וּ передан как «и», предлог מִן — как «от». מַתָּנָה в перечне стоянок является географическим названием и передано транслитерацией.
- source_word: נַחֲלִיאֵל
  choice: к Нахалиилу
  rationale: Хотя предлог направления в еврейском тексте не выражен, эллиптическая форма маршрута подразумевает переход от одной стоянки к другой; для ясности по-русски добавлено «к». Имя передано как топоним.
- source_word: וּמִנַּחֲלִיאֵל
  choice: а от Нахалиила
  rationale: Предлог מִן передан как «от»; союз וּ в параллельной второй части естественно передан русским «а», обозначающим следующий этап маршрута без противопоставления.
- source_word: בָּמוֹת
  choice: к Бамоту
  rationale: В данном перечне стоянок בָּמוֹת употреблено как название места. Форма с «к» восстанавливает подразумеваемое направление движения; нарицательное значение слова сохранено в примечании.
