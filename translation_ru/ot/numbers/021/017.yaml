lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной нарративный переход к следующему событию.
- source_word: יָשִׁיר
  choice: запел
  rationale: Хотя форма глагола формально имперфектная, после אָז в повествовании она имеет значение прошедшего времени; «запел» естественно вводит цитируемую песню.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Название народа употреблено как собирательное подлежащее в единственном числе.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: эту песню
  rationale: Прямое и естественное соответствие определённому существительному с указательным местоимением.
- source_word: עֲלִי
  choice: Поднимись
  rationale: Сохраняет основное пространственное значение повелительной формы женского рода, обращённой к колодцу, не уточняя без необходимости, идёт ли речь о подъёме воды или её появлении.
- source_word: בְאֵר
  choice: колодец
  rationale: Прямое соответствие еврейскому существительному; в русском обращение понятно без частицы «о».
- source_word: עֱנוּ לָהּ
  choice: Пойте ему в ответ
  rationale: Передаёт множественное повеление и значение ответного, вероятно антифонного исполнения; местоимение согласовано с русским словом «колодец».
