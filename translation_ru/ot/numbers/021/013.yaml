  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: ru
  text: Оттуда они отправились и разбили лагерь по ту сторону Арнона[a], в пустыне, простирающейся от границы амореев[b]. Ибо Арнон служит границей Моава, отделяя Моав от амореев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Арноном». Еврейское выражение обозначает противоположную сторону или область за естественной границей; точка отсчёта зависит от позиции говорящего.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выходящей от границы аморея». Слово «аморей» употреблено собирательно — об амореях как народе.'
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: מִשָּׁם נָסָעוּ
  choice: Оттуда они отправились дальше
  rationale: Передаёт последовательность переходов и характерное для походного повествования значение נסע — сняться с места и продолжить путь.
- source_word: וַיַּחֲנוּ
  choice: и разбили лагерь
  rationale: Естественное современное русское выражение для устройства стоянки.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: по ту сторону Арнона
  rationale: Сохраняет пространственную относительность עֵבֶר и не уточняет без достаточных оснований, с какой именно стороны находилась стоянка.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: в пустыне
  rationale: Передаёт расположение стоянки; относительная конструкция в русском упрощена ради ясности без изменения географического смысла.
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: простирающейся от границы амореев
  rationale: Причастие יצא буквально описывает выход или распространение от некоторой точки; «простирающейся» естественно выражает здесь географический смысл.
- source_word: כִּי
  choice: Ведь
  rationale: Вводит пояснение к указанному местоположению и естественно связывает две части русского предложения.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: Арнон служит границей Моава
  rationale: Именное предложение обозначает устойчивый географический факт; «служит границей» ясно показывает функцию реки.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: отделяя Моав от амореев
  rationale: Идиоматично передаёт повторённую конструкцию «между… и между…» и функцию границы; единственное הָאֱמֹרִי понимается собирательно.
