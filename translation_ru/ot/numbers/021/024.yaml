  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: ru
  text: Израиль поразил его остриём меча и овладел его землёй от Арнона до Иавока, вплоть до аммонитян, ибо граница аммонитян была крепкой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «граница аммонитян была сильна».'
    reason: Сохраняет буквальное значение עַז и не конкретизирует силу границы как искусственные укрепления.
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: поразил его
  rationale: Передаёт основное значение נכה, не уточняя без достаточных оснований, был ли Сихон лично убит.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Сохраняет образ еврейской идиомы («устами/лезвием меча») и естественно звучит по-русски.
- source_word: וַיִּירַשׁ
  choice: овладел
  rationale: В военном и территориальном контексте означает вступление во владение землёй, вероятно с вытеснением прежних жителей; «унаследовал» здесь вводило бы в заблуждение.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: от Арнона до Иавока
  rationale: Ясно обозначает территориальную протяжённость между двумя реками.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: вплоть до аммонитян
  rationale: בני עמון — букв. «сыновья Аммона», но в данном географическом контексте это обычное обозначение народа; этноним естественнее и точнее передаёт функцию выражения в современном русском языке.
- source_word: כִּי עַז גְּבוּל
  choice: потому что граница … была сильно укреплена
  rationale: עַז буквально означает «сильный». В сочетании с территориальной границей и как объяснение предела завоевания выражение указывает на её труднопреодолимость; сноска сохраняет более буквальную возможность.
theological_decisions:
- issue: Значение בְּנֵי עַמּוֹן
  choice: аммонитяне
  alternative: сыновья Аммона
  rationale: Это этническое обозначение, а не указание только на мужчин или непосредственных сыновей прародителя; перевод этнонимом не привносит конфессионального толкования.
- issue: Характер границы аммонитян
  choice: была сильно укреплена
  alternative: была сильна / была неприступна
  rationale: Контекст объясняет, почему завоевание остановилось у этой границы. Однако еврейское עַז само по себе не называет конкретный вид укреплений, поэтому буквальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Этноним «аммонитяне» выбран вместо буквального, но неестественного в данном контексте «сыновья Аммона». Маркер сноски поставлен непосредственно после относящегося к ней выражения.
