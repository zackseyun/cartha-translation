  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: ru
  text: 'Колодец, который выкопали князья,

    который вырыли знатные люди народа

    жезлом правителя[a], своими посохами.

    А из пустыни они отправились в Маттану[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законодателем». Еврейское слово может обозначать как правителя или законодателя, так и жезл — знак его власти.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «а из пустыни — Маттана»; по контексту это переход к следующему пункту пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: колодец
  rationale: Обычное значение слова; строка продолжает песнь о конкретном колодце из предыдущего стиха.
- source_word: חֲפָרוּהָ
  choice: который выкопали
  rationale: Форма от חפר означает «копать»; суффикс женского рода относится к בְּאֵר.
- source_word: שָׂרִים
  choice: князья
  rationale: Передаёт высокий общественно-политический статус и сохраняет возвышенный поэтический тон.
- source_word: כָּרוּהָ
  choice: который вырыли
  rationale: Глагол כרה также обозначает копание; иной русский глагол сохраняет поэтический параллелизм без полного лексического повтора.
- source_word: נְדִיבֵי הָעָם
  choice: знатные из народа
  rationale: В параллели с שָׂרִים слово נְדִיבֵי, вероятнее всего, обозначает людей высокого положения; оборот естественен для современного русского языка.
- source_word: בִּמְחֹקֵק
  choice: жезлом правителя
  rationale: В параллели с «своими посохами» наиболее вероятно инструментальное значение — знак или жезл власти.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: своими посохами
  rationale: מִשְׁעֵנָה означает посох или опору; «посохами» ясно передаёт конкретный предмет.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: А из пустыни они отправились в Маттану
  rationale: Контекст продолжает перечень стоянок. Глагол движения и предлог перед названием места подразумеваются и восполнены для естественного русского синтаксиса.
theological_decisions:
- issue: Значение בִּמְחֹקֵק
  choice: 'инструментальное: «жезлом правителя»'
  alternative: 'личное: «законодателем»; абстрактное: «по установлению»'
  rationale: Параллель с «своими посохами» склоняет к обозначению орудия, однако подлинная лексическая неоднозначность сохранена в примечании.
- issue: Смысл וּמִמִּדְבָּר מַתָּנָה
  choice: 'переход маршрута: «из пустыни… в Маттану»'
  alternative: 'буквально-фрагментарное: «а из пустыни — Маттана»'
  rationale: Стихи 18–20 перечисляют этапы пути, поэтому эллиптическая еврейская фраза естественно понимается как указание движения к следующей стоянке.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Параллельные строки сохранены; архаизм «князья» уместен как понятное обозначение родоплеменных вождей, а «знатные из народа» избегает неестественного «вельможи народа».
