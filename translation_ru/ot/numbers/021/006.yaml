  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: ru
  text: И Яхве послал среди народа огненных змей[a], и они кусали народ, и многие из израильтян умерли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «ядовитых змей» или «жгучих змей». Буквально по-еврейски: «змей, огненных».'
    reason: Определение הַשְּׂרָפִים связано с «горением» и может описывать жгучий эффект укуса; значение «ядовитые» контекстуально возможно, но интерпретирует исходный образ.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: послал
  rationale: Обычное повествовательное значение שׁלח; передаёт целенаправленное действие без добавочного оттенка «выпустил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: בָּעָם
  choice: на народ
  rationale: В данном контексте русская конструкция «послал на народ» естественно передаёт направление губительного нашествия; буквальное «среди народа» возможно, но менее естественно с глаголом «послал».
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: ядовитых змей
  rationale: Существительное означает змей, а определение שׂרפים буквально связано с «жгучими/огненными»; по контексту оно, вероятно, описывает жгучее действие укуса. Основной текст передаёт вероятный смысл, а буквальный образ сохраняется в сноске.
- source_word: וַיְנַשְּׁכוּ
  choice: кусали
  rationale: נשׁך прямо означает «кусать»; несовершенный вид по-русски естественно описывает повторяющиеся укусы множества змей.
- source_word: וַיָּמָת
  choice: умерли
  rationale: Прямая и нейтральная передача стандартного глагола מות «умирать».
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: многие из израильтян
  rationale: Идиоматичная русская передача смысла «много народа из Израиля», без неестественного буквального оборота.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение הַשְּׂרָפִים применительно к змеям
  choice: ядовитых змей с буквальной альтернативой в сноске
  alternative: огненных змей / жгучих змей
  rationale: Контекст допускает понимание как змей со жгучим, вероятно ядовитым укусом, тогда как буквальное определение сохраняет образ «огненных». Сноска не устраняет эту лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Союз «И» сохраняет последовательность еврейского повествования. Формулировка понятна широкому читателю, а сноска сохраняет буквальный образ и неоднозначность исходного текста.
