base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: ru
  text: и от Бамота — к долине в земле Моава, у вершины Фасги, откуда открывается вид на пустыню[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на Иешимон», если еврейское слово понимать как название области, а не как обозначение пустынной местности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на лицо пустыни» — еврейский оборот, обозначающий местность, лежащую перед наблюдателем.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: и от Бамота
  rationale: Предлоги и союз переданы прямо; בָּמוֹת в перечне стоянок понимается как географическое название. Форма «Бамот» следует современной передаче еврейского названия.
- source_word: הַגַּיְא
  choice: к долине
  rationale: גַּיְא означает долину или ущелье; нейтральное «долина» естественно в описании маршрута.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: в земле Моава
  rationale: שָׂדֶה буквально означает «поле», но в географическом контексте может обозначать открытую местность или территорию. «Земля Моава» ясно передаёт здесь территориальный смысл без неестественного буквального оборота.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: к вершине Фасги
  rationale: רֹאשׁ в топографическом контексте означает вершину. «Фасга» — укоренившаяся русская форма географического названия.
- source_word: וְנִשְׁקָפָה
  choice: откуда открывается вид
  rationale: Глагольная форма описывает вершину как место, обращённое к лежащей перед ним местности или возвышающееся над ней. Русский оборот естественно связывает описание с вершиной, не уточняя сверх текста направление взгляда вниз.
- source_word: עַל־פְּנֵי הַיְשִׁימֹן
  choice: на пустошь
  rationale: עַל־פְּנֵי буквально связано с «лицом, поверхностью» и здесь означает направление обзора. הַיְשִׁימֹן может быть нарицательным обозначением безлюдной, опустошённой местности; возможное понимание как названия области сохранено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Географические названия переданы в привычных русских формах там, где такая форма устоялась; буквальные еврейские образы сохранены в сносках, когда их прямое воспроизведение звучало бы неестественно.
