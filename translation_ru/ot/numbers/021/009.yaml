base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: ru
  text: И если змей жалил человека[c] и тот смотрел на медного[a] змея[d], он оставался в живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзового». Еврейское слово может обозначать медь или бронзу.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово стоит в единственном числе и здесь обозначает любого укушенного человека.
    reason: lexical_alternative
  - marker: d
    text: Ср. Ин 3:14–15, где это событие получает типологическое осмысление.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: змей
  rationale: Слово «змей» сохраняет мужской род еврейского существительного, возвышенный повествовательный тон и естественно обозначает как живого змея, так и его изготовленное изображение.
- source_word: נְחֹשֶׁת
  choice: медный
  rationale: Еврейское название металла может относиться к меди или бронзе. «Медный» соответствует устойчивому русскому библейскому словоупотреблению, а неоднозначность указана в сноске.
- source_word: הַנֵּס
  choice: шест
  rationale: В данном контексте имеется в виду поднятая вертикальная опора, на которой было помещено изображение; «шест» передаёт предметный смысл яснее, чем «знамя».
- source_word: וְהָיָה
  choice: И бывало
  rationale: Форма вводит повторявшуюся условную ситуацию. «И бывало» естественно связывает её с предшествующим повествованием и согласуется с последующим условием.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: если змей жалил человека
  rationale: Сохранены единственное число и обычный русский глагол для укуса ядовитого змея. «Человека» передаёт здесь обобщённое употребление אִישׁ без ненужного ограничения только мужчинами.
- source_word: וְהִבִּיט אֶל
  choice: тот смотрел на
  rationale: Нейтральное «смотрел на» передаёт непосредственное действие и не добавляет богословского оттенка упования, хотя позднее событие получает типологическое осмысление.
- source_word: וָחָי
  choice: и оставался жив
  rationale: Выражение ясно передаёт результат в повторяющейся условной ситуации. «Выживал» было бы несколько более интерпретирующим, а простое «жил» по-русски менее ясно.
theological_decisions:
- issue: Обобщённое употребление אִישׁ
  choice: человека
  alternative: мужчину; кого-нибудь
  rationale: В контексте существительное обозначает любого укушенного человека. Русское «человека» сохраняет единственное число исходного текста и естественно выражает обобщённый смысл.
- issue: Возможное типологическое переосмысление וְהִבִּיט אֶל
  choice: смотрел на
  alternative: взирал с надеждой; обращал взор к
  rationale: Основной текст передаёт непосредственный смысл еврейского выражения, не внося в него заранее позднейшее типологическое толкование из Ин 3:14–15. Каноническая связь отмечена отдельно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Формула «И бывало» сохраняет повествовательный переход и повторяющийся характер условной ситуации; тире подчёркивает результат, не добавляя причинного объяснения.
