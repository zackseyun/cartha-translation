lexical_decisions:
- source_word: אֶשֶׁד
  choice: склон
  rationale: Существительное обозначает склон или откос; в данном топографическом контексте краткое «склон» естественно и точно.
- source_word: הַנְּחָלִים
  choice: потоков
  rationale: נחל обозначает долину с руслом сезонного потока; «потоков» понятно современному читателю, а более точные топографические варианты указаны в сноске.
- source_word: אֲשֶׁר נָטָה
  choice: который простирается
  rationale: נטה может означать «простираться», «наклоняться» или «поворачивать»; здесь речь идёт о пространственном протяжении склона.
- source_word: לְשֶׁבֶת עָר
  choice: до местоположения Ара
  rationale: Трудная конструкция буквально связана с «сидением/обитанием» Ара, но в топографическом описании, вероятно, указывает на место, где расположен Ар; неоднозначность отмечена в сноске.
- source_word: עָר
  choice: Ар
  rationale: Географическое название передано традиционной русской транслитерацией.
- source_word: וְנִשְׁעַן
  choice: и примыкает
  rationale: Буквально глагол означает «опираться, прислоняться»; применительно к географической границе «примыкает» естественно передаёт смысл, не перегружая русский текст непривычной метафорой.
- source_word: לִגְבוּל מוֹאָב
  choice: к границе Моава
  rationale: גְּבוּל прямо обозначает границу или рубеж; форма с предлогом требует «к границе» при выбранном глаголе.
