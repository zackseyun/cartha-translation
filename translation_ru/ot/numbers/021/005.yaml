  text: וַ/יְדַבֵּ֣ר הָ/עָ֗ם בֵּֽ/אלֹהִים֮ וּ/בְ/מֹשֶׁה֒ לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לָ/מ֖וּת בַּ/מִּדְבָּ֑ר כִּ֣י אֵ֥ין לֶ֨חֶם֙ וְ/אֵ֣ין מַ֔יִם וְ/נַפְשֵׁ֣/נוּ קָ֔צָה בַּ/לֶּ֖חֶם הַ/קְּלֹקֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: ru
  text: 'И народ стал говорить против Бога и против Моисея: «Зачем ты вывел нас из Египта — чтобы мы умерли в пустыне? Ведь нет ни хлеба, ни воды, и нам опротивел этот негодный хлеб[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничтожный», «презренный» или «жалкий хлеб». Древнееврейское прилагательное — редкое слово, выражающее презрение к этой пище.'
    reason: Передаёт лексическую неопределённость редкого קְלֹקֵל и поясняет, что отрицательная оценка принадлежит говорящему народу.
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: И народ стал говорить против Бога и против Моисея
  rationale: Сочетание דבר с ב допускает буквальное «говорить с/о», однако обвинительное содержание прямой речи придаёт ему здесь враждебный смысл. «Говорить против» сохраняет эту силу, не усиливая её до «хулить».
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: вы вывели нас из Египта
  rationale: Порода hифиль глагола עלה означает «поднять, вывести». Русское «вывели из Египта» естественно передаёт исход; форма множественного числа сохраняет неоднозначность древнееврейского написания в обращении к Богу и Моисею.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: Чтобы мы умерли в пустыне?
  rationale: Инфинитив может обозначать цель или подразумеваемый результат. Отдельный риторический вопрос естественно передаёт обвинительный оттенок, не утверждая, что это действительно было намерением Бога и Моисея.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Ведь здесь нет ни хлеба, ни воды
  rationale: Повтор отрицания естественно передан конструкцией «ни… ни…». «Хлеб» сохраняет повтор лексемы לֶחֶם со следующим оборотом; «здесь» эксплицирует подразумеваемую ситуацию в пустыне.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: и нам опротивел
  rationale: Буквально речь идёт о сильном отвращении «нашей души». Безличная русская конструкция естественно и выразительно передаёт это состояние.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: этот негодный хлеб
  rationale: 'Редкое прилагательное קְלֹקֵל выражает презрение к пище: «ничтожный, негодный, жалкий». «Негодный» сохраняет оценочный голос ропщущего народа, а не объективную характеристику Божьего дара.'
theological_decisions:
- issue: Характер речи народа о Боге и Моисее
  choice: «говорить против Бога и против Моисея» — враждебная, обвинительная речь
  alternative: «говорить Богу и Моисею» или «говорить о Боге и Моисее»
  rationale: Сама реплика обвиняет адресатов в том, что они вывели народ на смерть; нейтральный перевод ослабил бы явный контекстуальный смысл.
- issue: Число адресатов в вопросе הֶעֱלִיתֻנוּ
  choice: «вы вывели нас»
  alternative: «ты вывел нас»
  rationale: Консонантная форма с суффиксом допускает понимание как 2-го лица мужского рода единственного числа или как дефективное написание множественного; в контексте непосредственно названы Бог и Моисей. Русское множественное число согласуется с обоими обвиняемыми, однако неоднозначность отмечена в сноске.
- issue: Оценка хлеба
  choice: Сохранена презрительная характеристика в устах народа
  alternative: Смягчить до «однообразный хлеб» или истолковать как объективно плохую пищу
  rationale: Текст передаёт отвращение говорящих к предоставленной им пище, но не подтверждает истинность их оценки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прямой речи. Синтаксис сделан ясным для обычного читателя; лексический повтор «хлеб» сохранён. Оскорбительная оценка пищи явно остаётся речью народа.
