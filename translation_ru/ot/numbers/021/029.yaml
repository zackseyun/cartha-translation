  rationale: 'Исправлена передача פְּלֵיטִם: «беглецами» отражает именную характеристику и сохраняет параллелизм с «пленницами». Сноска теперь ограничена действительной текстовой неоднозначностью — тем, относятся ли суффиксы к Кемошу или к Моаву, — не приписывая Моаву роль подразумеваемого субъекта.'
