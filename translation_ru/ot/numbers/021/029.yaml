base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: ru
  text: Горе тебе, Моав! Ты погиб, народ Кемоша! Он сделал своих сыновей беглецами, а дочерей — пленницами Сихона, царя амореев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сделал сыновей Моава беглецами, а дочерей Моава — пленницами Сихона»; местоименные суффиксы можно относить к Моаву, а не к Кемошу.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Горе
  rationale: Междометие выражает бедствие и плач; «горе» сохраняет сильное поэтическое звучание песни насмешки.
- source_word: אָבַדְתָּ
  choice: Ты погиб
  rationale: Форма обращена непосредственно к Моаву и обозначает его катастрофическое поражение; краткая формулировка соответствует еврейскому тексту.
- source_word: עַם כְּמוֹשׁ
  choice: народ Кемоша
  rationale: Сопряжённая конструкция указывает на народ, принадлежащий Кемошу или отождествляемый с ним.
- source_word: נָתַן
  choice: Он отдал
  rationale: Сохраняет основное значение глагола «дать, отдать» и естественно передаёт передачу людей победителю.
- source_word: בָּנָיו ... וּבְנֹתָיו
  choice: своих сыновей ... своих дочерей
  rationale: Местоименные суффиксы мужского рода единственного числа наиболее непосредственно соотносятся с Кемошем; возвратное «своих» естественно при подлежащем «он».
- source_word: פְּלֵיטִם
  choice: в бегство
  rationale: Передаёт состояние беглецов и мотив вынужденного бегства после поражения; синтаксически сочетается с «отдал», хотя еврейская конструкция допускает более буквальное «беглецами».
- source_word: בַּשְּׁבִית
  choice: в плен
  rationale: Естественно и точно передаёт состояние пленных и сохраняет параллелизм с «в бегство».
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: Сихону, царю амореев
  rationale: Ламед передан как указание на того, кому они отданы, а титул оформлен естественным русским приложением.
theological_decisions:
- issue: К кому относятся суффиксы в словах «его сыновья» и «его дочери»
  choice: 'К Кемошу: «своих сыновей» и «своих дочерей» при подлежащем «он»'
  alternative: 'К Моаву: «его сыновей» и «его дочерей», то есть сыновей и дочерей Моава'
  rationale: Ближайший грамматический антецедент — Кемош; такое прочтение также сохраняет поэтическое олицетворение божества и насмешку над его бессилием. Возможная отсылка к Моаву отмечена в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский с кратким, торжественно-поэтическим звучанием. Имя כְּמוֹשׁ передано как «Кемош», а אֱמֹרִי — традиционным русским «амореи». Маркер сноски помещён после всего спорного высказывания.
