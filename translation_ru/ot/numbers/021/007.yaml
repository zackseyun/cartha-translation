base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: ru
  text: 'Тогда народ пришёл к Моисею и сказал: «Мы согрешили, потому что говорили против Яхве и против тебя. Помолись Яхве, чтобы Он удалил от нас змею[a]». И Моисей помолился за народ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте существительное стоит в единственном числе и может собирательно обозначать нашествие змей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Тогда народ пришёл
  rationale: Последовательная форма с וַ передвигает повествование вперёд; «тогда» естественно передаёт очередность событий. Единственное число сказуемого согласовано с собирательным существительным «народ».
- source_word: חָטָאנוּ
  choice: Мы согрешили
  rationale: Перфект обозначает совершённый грех, который народ теперь признаёт; русская форма прошедшего времени естественна в исповедании.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит содержание и основание признания греха, прямо связывая его с речью против Яхве и Моисея.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: говорили против Яхве и против тебя
  rationale: Конструкция דבר с ב в данном контексте означает враждебную речь «против». Повтор предлога сохраняет параллелизм и исключает неясность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Помолись Яхве
  rationale: Hitpael глагола פלל означает «молиться», а контекст ясно выражает ходатайство; формулировка проста и естественна по-русски.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: чтобы Он удалил от нас
  rationale: После повеления молиться префиксальная форма выражает желаемое содержание просьбы. «Удалил от нас» передаёт избавление от бедствия.
- source_word: אֶת הַנָּחָשׁ
  choice: змею
  rationale: נָחָשׁ обозначает змею; единственное число исходного текста сохранено, хотя здесь оно, вероятно, собирательно обозначает нашествие змей.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: И Моисей помолился за народ
  rationale: בְּעַד выражает действие ради или от имени другого; «помолился за народ» естественно передаёт ходатайственный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет Тетраграмматон как личное имя; «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Единственное число הַנָּחָשׁ при множестве змей в контексте
  choice: змею с пояснением о возможном собирательном значении
  alternative: змей
  rationale: Основной текст сохраняет грамматическое единственное число и тем самым не устраняет подлинную неоднозначность; примечание сообщает вероятный коллективный смысл.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским достоинством. Синтаксис близок к еврейскому повествованию, но естественен для обычного русского читателя; архаизмы не используются.
