  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Не бойся его, потому что Я отдал в твои руки его, весь его народ и его землю. Ты поступишь с ним так же, как поступил с Сихоном, царём аморреев, жившим в Хешбоне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Не бойся его
  rationale: Прямая и естественная передача запрета с глаголом ירא в современном литературном русском языке.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: Я отдал в твои руки его самого
  rationale: Сохраняет образ еврейской идиомы передачи во власть; совершенный вид передаёт действие как уже решённое и гарантированное.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: весь его народ и его землю
  rationale: Точно сохраняет оба дополнительных объекта, перечисленных в исходном тексте.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: Поступи с ним
  rationale: В данном контексте естественно передаёт עשה с ל и повелительную силу высказывания, избегая неестественного буквального «сделай ему».
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: так же, как ты поступил
  rationale: Сохраняет прямое сопоставление с прежними действиями против Сихона.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: с Сихоном, царём аморреев
  rationale: Передаёт имя и титул близко к еврейской конструкции и естественно по-русски.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: жившим в Хешбоне
  rationale: Причастная форма отражает описательное употребление еврейского причастия יוֹשֵׁב и обозначает место проживания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как собственное имя; форма «Яхве» сохраняет это различие и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Завершённость обещанной победы
  choice: Я отдал
  alternative: Я отдаю; Я предам
  rationale: Еврейский перфект נָתַתִּי представляет передачу врага как совершившуюся с точки зрения Божьего твёрдого решения, не утверждая, что сражение уже произошло.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Сохранён образ «отдал в твои руки», понятный по контексту; синтаксис слегка сглажен для естественности. Местоимение «Я» написано с прописной буквы как реплика Бога, без чрезмерной архаизации.
