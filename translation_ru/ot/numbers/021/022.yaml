  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: ru
  text: Позволь мне пройти через твою землю. Мы не свернём ни в поле, ни в виноградник и не станем пить воду из колодца. Мы пойдём по царской дороге, пока не пересечём твою границу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Позволь мне пройти
  rationale: Когортатив 1-го лица ед. числа в дипломатическом обращении выражает вежливую просьбу о разрешении пройти.
- source_word: בְאַרְצְךָ
  choice: через твою землю
  rationale: אֶרֶץ здесь обозначает подвластную царю землю; предлог «через» естественно передаёт движение по ней.
- source_word: לֹא נִטֶּה
  choice: мы не свернём
  rationale: נטה в контексте пути означает отклониться или свернуть с дороги.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: ни в поле, ни в виноградник
  rationale: Парная конструкция с «ни... ни...» естественно передаёт отрицание применительно к обоим видам возделываемой земли.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: не станем пить воду из колодца
  rationale: Буквальное «воды колодца» по-русски естественно передаётся как «воду из колодца» и указывает на отказ пользоваться местными водными запасами.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: по царской дороге
  rationale: Буквально «по дороге царя»; «царская дорога» сохраняет образ официального главного пути и звучит естественно в современном русском.
- source_word: נֵלֵךְ
  choice: мы пойдём
  rationale: הלך — обычный глагол движения; простое будущее соответствует обещанию говорящего.
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: пока не минуем
  rationale: Оборот обозначает предел движения — до завершения прохода через подвластную область.
- source_word: גְּבֻלֶךָ
  choice: твои владения
  rationale: Хотя גְּבוּל буквально может означать «граница», здесь речь идёт о пространстве внутри границ, которое путники намерены полностью миновать; «владения» ясно и естественно выражает территориальный смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; дипломатическая просьба передана уважительно, но без избыточно архаичной или церковнославянской лексики. Обращение на «ты» соответствует единственному числу древнееврейского текста и библейскому повествовательному регистру.
