  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: ru
  text: И те, кто застал его за сбором дров, привели его к Моисею, Аарону и ко всей общине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за сбором веток». Еврейское עֵצִים может обозначать как древесину или дрова вообще, так и отдельные ветки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: привели его
  rationale: В каузативной породе глагол קרב означает «подвести, привести, представить». В данном повествовательном контексте естественное русское «привели его» точно передаёт перемещение человека к Моисею, Аарону и обществу, не добавляя судебной терминологии.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: те, кто застал его
  rationale: Субстантивированное причастие обозначает людей, обнаруживших его во время указанного занятия. «Застал его за…» по-русски естественно выражает эту одновременность и не предполагает, что он был потерян.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: за сбором дров
  rationale: Причастие קשש означает собирание, а עֵצִים может обозначать древесину, дрова или отдельные ветки. «Сбор дров» естественен в русском контексте и сохраняет общий смысл действия.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: к Моисею, Аарону и всему обществу
  rationale: Предлог אֶל передаёт направление «к». Повтор предлога в еврейском придаёт перечислению вес, но его механическое повторение по-русски здесь избыточно; однородный ряд сохраняет всех трёх адресатов.
- source_word: עֵדָה
  choice: общество
  rationale: В Пятикнижии слово обозначает собранное сообщество Израиля. «Общество» — понятное и достаточно торжественное обозначение всей общины в данном контексте.
