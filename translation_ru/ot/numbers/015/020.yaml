  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: ru
  text: Из первой части вашего теста[a] возносите лепёшку как приношение[b]; как приношение с гумна, так возносите её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать само замешиваемое тесто или, по метонимии, посуду для замешивания — квашню либо корыто.
    reason: lexical_alternative
  - marker: b
    text: Еврейский термин традиционно передают как «возношение»; он обозначает долю, которую отделяют и представляют как священный дар.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: из первой части
  rationale: Передаёт значение начала или первой доли и естественно выражает здесь часть теста, предназначенную для приношения.
- source_word: עֲרִסֹתֵיכֶם
  choice: вашего теста
  rationale: В данном контексте речь, вероятнее всего, идёт о замешиваемом тесте, из которого берут лепёшку; возможное обозначение ёмкости отмечено в сноске.
- source_word: חַלָּה
  choice: лепёшку
  rationale: Обозначает сформованный хлеб или хлебную лепёшку. Слово «хала» в современном русском вызвало бы более узкую и анахроничную ассоциацию с плетёным хлебом.
- source_word: תָּרִימוּ
  choice: возносите
  rationale: Сохраняет образ поднятия и культовое значение представления дара, оставаясь понятным в возвышенном повествовательном регистре.
- source_word: תְרוּמָה
  choice: приношение
  rationale: Передаёт дар, который отделяют и представляют Богу, без архаичного технического оборота «жертва возношения».
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: как приношение с гумна
  rationale: Сохраняет сравнение с долей урожая, отделяемой на месте обмолота, и естественно выражает исходную точку приношения.
- source_word: גֹּרֶן
  choice: гумно
  rationale: Точное и устойчивое русское обозначение места обмолота зерна; сохраняет земледельческий образ.
- source_word: כֵּן
  choice: так же
  rationale: Ясно вводит соответствие между приношением теста и приношением с гумна.
- source_word: אֹתָהּ
  choice: её
  rationale: Женское местоимение естественно соотносится с ближайшим существительным «лепёшку».
