lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Передаёт полноту охвата и естественно звучит в современном русском языке.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол обозначает данное Яхве обязательное повеление; совершенный вид уместен для уже сообщённого свода установлений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняется личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: אֲלֵיכֶם
  choice: вам
  rationale: Дательный падеж естественно передаёт адресатов повеления.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея»; здесь это устойчивое обозначение посредничества или передачи через кого-либо.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: начиная с того дня, когда
  rationale: Ясно обозначает исходную временную точку и естественно связывает придаточное предложение.
- source_word: צִוָּה
  choice: дал повеление
  rationale: Передаёт тот же еврейский глагол, избегая в русском тяжёлого повтора «повелел… повелел»; неопределённый объект сохраняет лаконичность оригинала.
- source_word: וָהָלְאָה
  choice: и впредь
  rationale: Передаёт продолжение действия от указанного момента в будущее.
- source_word: לְדֹרֹתֵיכֶם
  choice: во все ваши поколения
  rationale: Выражает непрерывную применимость установлений для последующих поколений народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Посредническая роль Моисея в בְּיַד מֹשֶׁה
  choice: через Моисея
  alternative: рукой Моисея
  rationale: Выражение указывает на Моисея как посредника передачи повелений; перевод не добавляет утверждений о природе его полномочий.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксическая незавершённость и конечное тире сохранены, поскольку стих продолжает условную конструкцию предыдущего контекста.
