  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: ru
  text: И будет прощено всему обществу сынов Израиля и пришельцу, живущему среди них[a], ибо весь народ совершил это по неведению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Пришелец» — чужеземец, постоянно живущий среди израильтян и находящийся под законами и защитой их общества.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «ибо у всего народа — по неведению». Краткое еврейское выражение можно также понять как «ведь весь народ был в заблуждении».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: И будет прощено
  rationale: 'Форма нифаля имеет безлично-пассивный смысл: прощение будет даровано названным далее людям. Русская безличная конструкция сохраняет и форму единственного числа, и направленность прощения.'
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всё общество сынов Израиля
  rationale: «Общество» естественно передаёт עֵדָה как организованную общину в законодательном и богослужебном контексте; «сыны Израиля» формально сохраняет структуру древнееврейского выражения.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: а также переселенец, живущий среди них
  rationale: גֵּר — не случайный путник, а иноплеменный постоянный житель, включённый в правовой уклад общины. «Переселенец» передаёт этот статус без современных отрицательных оттенков слова «чужеземец»; причастие הַגָּר естественно передано как «живущий».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для прощения и ясно передаёт причинную связь.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: весь народ согрешил по неведению
  rationale: Краткая именная конструкция буквально указывает, что для всего народа случившееся было שְׁגָגָה. В русском контексте требуется восполнить подразумеваемое действие; «согрешил по неведению» сохраняет юридико-жертвенное значение неумышленного проступка, не сводя его лишь к бытовой ошибке.
theological_decisions:
- issue: Общий охват прощения
  choice: Прощение относится ко всему обществу Израиля и к живущему среди него переселенцу.
  alternative: 'Можно перевести более обобщённо: «будет прощено всей общине израильтян и переселенцу».'
  rationale: Текст подчёркивает совместное участие коренного общества и переселенца в предусмотренном законом прощении, не добавляя условий сверх контекста.
- issue: Смысл заключительной краткой конструкции
  choice: «потому что весь народ согрешил по неведению»
  alternative: «потому что это произошло у всего народа по неведению» или «ведь весь народ был в заблуждении».
  rationale: Древнееврейское выражение эллиптично и допускает разные способы восполнения. Основной текст раскрывает подразумеваемый в жертвенно-правовом контексте проступок, а сноска сохраняет более буквальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного библейского текста. Синтаксис сделан понятным для широкого читателя; формула «сыны Израиля» сохранена как узнаваемое обозначение народа, а культурно-правовое значение גֵּר пояснено в сноске.
