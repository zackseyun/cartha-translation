  source_fidelity: 'Начальная конструкция требует дательного обозначения адресатов прощения: «будет прощено всему обществу … и пришельцу», а не конструкции, в которой «общество» выглядит прямым объектом. В заключительной клаузе еврейское выражение эллиптично; «весь народ согрешил» чрезмерно эксплицирует подразумеваемый проступок. Безопаснее сохранить отсылочное «это» и указать альтернативное понимание в сноске.'
  naturalness: «Будет прощено всему обществу сынов Израиля и пришельцу, живущему среди них» — естественная литературная русская фраза с уместно сдержанным законодательным регистром. «Пришелец» в библейском контексте точнее, чем «переселенец», который в современном русском не обязательно обозначает иностранного постоянного жителя.
  terminology: «Общество сынов Израиля» адекватно передаёт עֲדַת בְּנֵי יִשְׂרָאֵל. «Пришелец» с пояснительной сноской хорошо передаёт גֵּר как правовой статус. «По неведению» сохраняет юридический оттенок בִּשְׁגָגָה.
