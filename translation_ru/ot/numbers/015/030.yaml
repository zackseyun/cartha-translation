source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: ru
  text: Но человек, который поступает дерзко[a], будь то уроженец или пришелец, поносит Яхве; такой человек будет отсечён от своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с поднятой рукой»; то есть открыто, вызывающе или самонадеянно.'
    reason: Сохраняет буквальный образ еврейской идиомы и указывает её основные смысловые оттенки.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: человек
  rationale: В данном правовом контексте נֶפֶשׁ обозначает человека как целое, а не отдельно «душу»; «человек» естественно и точно передаёт юридический смысл.
- source_word: תַּעֲשֶׂה
  choice: поступает
  rationale: Глагол עשה имеет широкое значение «делать»; «поступает» сохраняет эту широту и естественно сочетается с характеристикой образа действия.
- source_word: בְּיָד רָמָה
  choice: дерзко[a]
  rationale: Буквально идиома означает «с поднятой рукой» и выражает открытое, вызывающее своеволие. В основном тексте выбран понятный русский эквивалент, а буквальный образ сохранён в сноске.
- source_word: הָאֶזְרָח
  choice: коренной житель
  rationale: Обозначает уроженца, принадлежащего к местному сообществу, в противопоставлении проживающему среди Израиля пришельцу.
- source_word: הַגֵּר
  choice: пришелец
  rationale: גֵּר — неуроженец, постоянно живущий среди Израиля и находящийся под защитой и законом общины; традиционное «пришелец» сохраняет этот правовой оттенок.
- source_word: אֶת־יְהוָה הוּא מְגַדֵּף
  choice: поносит Яхве
  rationale: גדף выражает оскорбительное поношение и презрение к Богу. «Поносит» прямо передаёт смысл, не ограничивая его только словесным богохульством.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога как «Яхве» соответствует форме тетраграмматона и принятому в проекте принципу.
- source_word: וְנִכְרְתָה
  choice: будет отсечён
  rationale: Формула כרת в нифале обозначает суровое исключение или суд. «Будет отсечён» сохраняет образ и не уточняет без основания, идёт ли речь о казни, изгнании или непосредственном Божьем наказании.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: от своего народа
  rationale: Выражение обозначает устранение из среды общины. Русская формулировка естественна и сохраняет коллективно-правовой смысл.
theological_decisions:
- issue: Характер проступка
  choice: «поступает дерзко»
  alternative: «поступает с поднятой рукой»; «поступает самонадеянно»
  rationale: Идиома указывает на открытое, сознательное неповиновение, но стих не называет отдельного конкретного преступления. Перевод сохраняет общий характер формулировки.
- issue: Характер наказания
  choice: «будет отсечён от своего народа»
  alternative: «будет казнён»; «будет изгнан из общины»; «будет истреблён»
  rationale: Еврейская правовая формула не уточняет в самом стихе, осуществляется ли наказание людьми, через исключение из общины или непосредственно Богом; перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и богословского контекста. «Пришелец», «поносит» и «отсечён» поддерживают библейский регистр, оставаясь понятными; синтаксис не перегружен архаизмами.
