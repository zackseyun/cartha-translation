  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится как «Господь».'
    reason: Указывает форму в еврейском тексте и традиционный вариант передачи Божьего имени.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным вау продвигает повествование и вводит новое Божье обращение. В современном русском «сказал» естественно передаёт завершённое речевое действие; буквальное «говорил» здесь звучало бы как длительное или повторявшееся действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: אֶל מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно обозначает адресата речи; имя מֹשֶׁה передано в закрепившейся русской форме «Моисей».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит последующее содержание речи. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» создало бы тяжеловесную формулу «сказал… говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя YHWH. Передача «Яхве» сохраняет его как имя, тогда как «Господь» заменяет его титулом; вариант «Иегова» основан на более позднем смешанном прочтении.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная повествовательная формула. Союз «И» сохраняет связь с предшествующим повествованием, а двоеточие естественно вводит речь, продолжающуюся в следующем стихе.
