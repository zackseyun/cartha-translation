  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: ru
  text: И для возлияния приготовь четверть гина вина вместе со всесожжением[a] или жертвой — на каждого ягнёнка[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на всесожжение». Еврейский предлог здесь, вероятно, указывает на сопровождение всесожжения в ходе жертвенного обряда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для одного ягнёнка»; выражение «на каждого ягнёнка» передаёт распределительный смысл предписания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: И … вина
  rationale: Союз וְ связывает предписание с предыдущим стихом; יַיִן — обычное обозначение вина. В русском языке естественнее поставить «вина» после указания назначения и меры.
- source_word: לַ/נֶּסֶךְ
  choice: для возлияния
  rationale: В жертвенном контексте נֶסֶךְ обозначает жидкое приношение, которое выливали; «возлияние» — точный и устоявшийся русский термин.
- source_word: רְבִיעִית הַ/הִין
  choice: четверть гина
  rationale: Сохранена древняя мера объёма без приблизительного пересчёта; «четверть» естественно передаёт רְבִיעִית.
- source_word: תַּעֲשֶׂה
  choice: приготовь
  rationale: Глагол עָשָׂה буквально означает «делать», но в данном ритуальном предписании и применительно к вину естественно означает его приготовление для обряда.
- source_word: עַל הָ/עֹלָה
  choice: вместе со всесожжением
  rationale: Предлог עַל буквально может означать «на», однако здесь, вероятнее всего, выражает ритуальное сопровождение всесожжения. «Вместе со» ясно передаёт эту связь, не утверждая физического выливания непосредственно на жертву.
- source_word: א֣וֹ לַ/זָּבַח
  choice: или жертвой
  rationale: זֶבַח — общее обозначение закланной жертвы, отличаемой здесь от всесожжения. Русское «жертва» сохраняет обобщённость исходного слова.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: на каждого ягнёнка
  rationale: 'Буквально — «для одного ягнёнка» или «для этого одного ягнёнка»; в серии нормативных указаний форма имеет распределительный смысл: указанное количество требуется для каждого отдельного ягнёнка.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных библейских терминов «возлияние», «гин» и «всесожжение». Повелительное единственное число соответствует еврейской форме второго лица. Формулировка остаётся ясной для обычного читателя и сохраняет лексическую неоднозначность предлога עַל в сноске.
