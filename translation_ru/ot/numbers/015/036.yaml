base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И вся община вывела его за пределы стана и побила его камнями; и он умер, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: вся община
  rationale: עֵדָה обозначает собравшуюся общину Израиля; «вся община» естественно передаёт также כָּל и сохраняет корпоративный смысл.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: вывела его
  rationale: Форма породы hифиль от יצא означает «вывести»; русская форма единственного числа согласована с собирательным существительным «община».
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: за пределы стана
  rationale: Оборот выражает направленное движение наружу, в место вне стана; «за пределы стана» ясно передаёт это значение.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: забросала камнями
  rationale: רגם означает казнить или поражать бросаемыми камнями, а בָּאֲבָנִים прямо называет орудие; выбранная формулировка естественна по-русски и сохраняет оба элемента.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: מות — обычный глагол «умереть»; прямой перевод не подменяет исходную формулировку пояснением о казни.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: כַּאֲשֶׁר выражает соответствие ранее данному повелению; «повелел» уместно передаёт צִוָּה, а имя יְהוָה передано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога — тетраграмматон; транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Слово «стан» сохранено как понятное традиционное обозначение лагеря Израиля; синтаксис следует последовательности действий в еврейском тексте.
