  source_fidelity: 'Смысл в целом передан верно: вся община выводит человека за пределы стана, совершает побиение камнями, он умирает; заключительная формула верно соотнесена с повелением Яхве Моисею. Однако «забросала камнями» в современном русском не обязательно обозначает смертное побиение камнями и может означать просто закидывание предметами.'
