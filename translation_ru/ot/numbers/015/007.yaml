  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: ru
  text: И вина для возлияния[a] — треть гина[b] — принеси в приятное благоухание[c] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в качестве возлияния»; еврейское слово обозначает жидкое приношение, которое выливали при жертве.'
    reason: lexical_alternative
  - marker: b
    text: Гин — древняя мера объёма жидкостей.
    reason: cultural_note
  - marker: c
    text: 'Или: «успокаивающее благоухание» или «сладкое благоухание». Еврейское выражение обозначает благоухание жертвы, благоприятной Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: И вина
  rationale: יַיִן — обычное обозначение вина; союз וְ связывает предписание с предыдущим стихом.
- source_word: לַנֶּסֶךְ
  choice: для возлияния
  rationale: נֶסֶךְ обозначает жидкое приношение, которое выливали при жертве. «Возлияние» — краткий и установившийся русский эквивалент.
- source_word: שְׁלִשִׁית הַהִין
  choice: треть гина
  rationale: Сохранена древняя мера объёма без приблизительного пересчёта, отсутствующего в исходном тексте.
- source_word: תַּקְרִיב
  choice: принеси
  rationale: Порода hифиль глагола קרב в жертвенном контексте означает «принести, представить как приношение». «Принеси» естественно передаёт предписание в единственном числе.
- source_word: רֵיחַ נִיחֹחַ
  choice: как благоухание, приятное
  rationale: Формула передаёт образ благоухания и принятия жертвы Богом. Формулировка сохраняет образ, не устраняя его культового смысла.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а предлог ל выражен в сочетании «приятное Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Смысл жертвенной формулы רֵיחַ נִיחֹחַ
  choice: как благоухание, приятное Яхве
  alternative: как благоухание успокоения для Яхве
  rationale: Выбран естественный русский оборот, сохраняющий образ запаха и идею благоприятного принятия, но не разрешающий антропоморфное напряжение дополнительным толкованием.
translation_notes:
  register: Современный литературный русский язык с краткой ритуально-правовой формулировкой. Тире отделяют указанное количество вина и делают инверсию исходного текста понятной. Термин «возлияние» сохранён как общеупотребительный библейский культовый термин и пояснён в сноске.
