  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: ru
  text: Или для барана приготовь приношение из двух десятых эфы[a] муки тонкого помола, смешанной с третью гина масла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «две десятых»; единица меры не названа. Здесь подразумеваются две десятых эфы, как видно из более полных выражений в других предписаниях о жертвах.'
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Или
  rationale: Передаёт разделительный союз, связывающий это предписание с предыдущими вариантами жертвоприношения, не добавляя отсутствующего в еврейском условного оборота.
- source_word: לָ/אַ֨יִל֙
  choice: для барана
  rationale: אַיִל означает взрослого самца овцы, а предлог ל здесь указывает, к какой жертве относится сопровождающее приношение.
- source_word: תַּעֲשֶׂ֣ה
  choice: приготовь
  rationale: В контексте ритуального предписания עשה естественно означает приготовление требуемого приношения; русское единственное число сохраняет форму обращения еврейского текста.
- source_word: מִנְחָ֔ה
  choice: хлебное приношение
  rationale: В священническом жертвенном контексте מִנְחָה обозначает приношение из муки или зерна, а не приношение вообще; «хлебное приношение» — понятный и традиционно узнаваемый русский термин.
- source_word: סֹ֖לֶת
  choice: лучшей муки
  rationale: סֹלֶת — высококачественная тонкая мука; «лучшая мука» звучит естественно и не вводит прямо не указанное здесь зерно.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: две десятых эфы
  rationale: Буквально сказано «две десятых», но единица объёма подразумевается системой жертвенных мер. Её явное восполнение необходимо для ясного современного русского текста и отмечено сноской.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: смешанной с ... масла
  rationale: Причастие согласуется с «мукой» и обозначает смешивание муки с маслом; родительный падеж после меры естественен в русском.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: третью гина
  rationale: Сохраняется древняя мера объёма без неточного пересчёта в современные единицы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, предписывающим строем. Сохранены древние единицы измерения «эфа» и «гин»; эллиптическая мера пояснена сноской. Термин «хлебное приношение» выбран как понятное обозначение жертвенного дара из муки.
