source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: ru
  text: И священник совершит перед Яхве искупление за человека, согрешившего по неведению, когда он согрешил по неведению, чтобы совершить за него искупление, и ему будет прощено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: совершит искупление
  rationale: Порода пиэль глагола כפר в священническом контексте обозначает совершение обряда искупления. Такая формулировка естественна по-русски и не навязывает определённой теории искупления.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямое обозначение служителя, совершающего обряд.
- source_word: עַל הַנֶּפֶשׁ
  choice: за человека
  rationale: נֶפֶשׁ здесь означает отдельного человека, а не нематериальную «душу».
- source_word: הַשֹּׁגֶגֶת
  choice: который заблудился
  rationale: Причастие от שׁגג указывает на ошибочное, непреднамеренное действие. Глагольная передача звучит естественно и сохраняет отличие от следующего выражения о грехе по неведению.
- source_word: בְּחֶטְאָה בִשְׁגָגָה
  choice: согрешив по неведению
  rationale: Формулировка сохраняет прямое упоминание греха и подчёркивает его непреднамеренный характер, не устраняя смысловой повтор с предыдущим причастием.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт пространственно-реляционное значение לִפְנֵי и сохраняет личное имя יהוה в форме «Яхве».
- source_word: לְכַפֵּר עָלָיו
  choice: совершит за него искупление
  rationale: Повторно передаёт корень כפר, как в еврейском тексте. В русском предложении цель и итог естественно выражены сочинённой конструкцией.
- source_word: וְנִסְלַח לוֹ
  choice: и тот будет прощён
  rationale: Сохраняет пассивную форму и обозначает прощение как результат совершённого искупления; «тот» однозначно отсылает к человеку, а не к священнику.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон. Форма «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Характер проступка
  choice: заблудился, согрешив по неведению
  alternative: ненамеренно согрешил
  rationale: Избранная формулировка сохраняет два соотнесённых элемента еврейского выражения הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה и не превращает непреднамеренность в отсутствие самого греха.
- issue: Значение искупления
  choice: совершить искупление
  alternative: очистить; загладить вину
  rationale: Более широкая культовая формулировка не сужает כפר до одной богословской модели и сохраняет связь между священническим действием и последующим прощением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены повтор искупительной формулы и смысловой двойной оборот о непреднамеренном грехе; местоименная двусмысленность устранена естественным словом «тот».
