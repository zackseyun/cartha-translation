revisions:
- from: И священник совершит перед Яхве искупление за человека, который заблудился, согрешив по неведению; совершит за него искупление — и тот будет прощён.
  to: И священник совершит перед Яхве искупление за человека, согрешившего по неведению, когда он согрешил по неведению, чтобы совершить за него искупление, и ему будет прощено.
  rationale: Заменено вводящее в заблуждение «заблудился» на прямое обозначение непреднамеренного согрешения. Повтор «согрешившего по неведению … согрешил по неведению» сохранён, поскольку соответствует повторению שׁגג в הַשֹּׁגֶגֶת … בְּחֶטְאָה בִשְׁגָגָה. Целевой инфинитив לְכַפֵּר передан через «чтобы совершить», а וְנִסְלַח לוֹ — безлично-пассивной формой «ему будет прощено».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'В черновике верно переданы священник, Яхве, культовое «искупление» и итог прощения. Однако «который заблудился» не является точной передачей שֹׁגֶגֶת в данном контексте: речь о непреднамеренном проступке, а не о том, что человек сбился с пути. Исправленный текст сохраняет намеренно повторённое указание на согрешение по неведению и повтор כפר.'
  naturalness: Фраза «заблудился, согрешив по неведению» звучит по-русски как физическое или нравственное блуждание и создаёт неуместное смысловое различие. «Согрешившего по неведению, когда он согрешил по неведению» намеренно повторно, но понятно; повтор отражает еврейский текст. «Ему будет прощено» естественно и сохраняет безлично-пассивный характер וְנִסְלַח לוֹ.
  terminology: «Яхве», «священник» и «искупление» уместны. «За человека» корректно передаёт עַל־הַנֶּפֶשׁ как обозначение человека, а не нематериальной души.
  issues:
  - severity: medium
    issue: «который заблудился» для הַשֹּׁגֶגֶת
    rationale: Глагол שׁגג здесь характеризует неумышленное совершение проступка. Русское «заблудился» обычно означает потерять дорогу либо сбиться с верного пути и потому не передаёт достаточно ясно юридико-культовый смысл непреднамеренного греха.
  - severity: low
    issue: Сочинённая конструкция ослабляет целевую связь לְכַפֵּר
    rationale: В черновике второе «совершит за него искупление» оформлено как самостоятельное сказуемое после точки с запятой. Инфинитив לְכַפֵּר естественнее передать целевым оборотом «чтобы совершить…», сохранив связь с действием священника.
  revised_text: И священник совершит перед Яхве искупление за человека, согрешившего по неведению, когда он согрешил по неведению, чтобы совершить за него искупление, и ему будет прощено.
