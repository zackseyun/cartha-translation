source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: ru
  text: и принесёте Яхве из крупного или мелкого скота[c] огненную жертву[a] — всесожжение или жертву, — чтобы исполнить обет, или как добровольное приношение, или в назначенные для вас времена[b], чтобы вознести Яхве приятное благоухание,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву, сжигаемую на огне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в установленные для вас праздники». Еврейское слово может обозначать как назначенное время вообще, так и установленный праздник.'
    reason: lexical_alternative
  - marker: c
    text: Под мелким скотом подразумеваются овцы и козы.
    reason: clarification
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: и принесёте ... огненную жертву
  rationale: В жертвенном контексте עשה с אִשֶּׁה означает совершить или принести приносимую на огне жертву. «Принесёте» естественно передаёт действие, а «огненная жертва» сохраняет специальный смысл термина.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Традиционный и точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: זֶבַח
  choice: закланная жертва
  rationale: Так сохраняется отличие от всесожжения и выражается связь существительного с закланием животного; одно лишь «жертва» было бы слишком общим.
- source_word: לְפַלֵּא נֶדֶר
  choice: чтобы исполнить обет
  rationale: Сочетание обозначает совершение обещанного по обету приношения; русский оборот ясен и идиоматичен.
- source_word: בִנְדָבָה
  choice: как добровольное приношение
  rationale: Передаёт техническое значение приношения, совершаемого добровольно, а не во исполнение обета.
- source_word: בְּמֹעֲדֵיכֶם
  choice: в назначенные для вас времена
  rationale: Сохраняет широкий смысл מוֹעֵד — установленное время, которое в данном контексте может конкретно обозначать праздник.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: чтобы вознести Яхве приятное благоухание
  rationale: Естественно передаёт культовый образ благоухания, угодного Богу, не устраняя его метафорического характера.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: из крупного или мелкого скота
  rationale: Кратко и точно передаёт противопоставление крупного рогатого скота и стад овец либо коз; оборот перенесён ближе к слову «жертву», чтобы избежать двусмысленной связи с «благоуханием».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передаётся личное имя Завета, прямо стоящее в еврейском тексте, а не заменяющий его титул.
- issue: Антропоморфный жертвенный образ רֵיחַ נִיחֹחַ
  choice: приятное благоухание
  alternative: благоухание умиротворения; благоухание, угодное Яхве
  rationale: Формулировка сохраняет образ угодного Богу запаха жертвы, но не добавляет к тексту учения о механическом умилостивлении.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной культовой лексикой. Начальное «и» и конечная запятая сохранены, поскольку стих синтаксически продолжает условную конструкцию соседних стихов. Обстоятельство «из крупного или мелкого скота» переставлено перед названием жертвы ради ясной синтаксической связи.
