  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: ru
  text: '«Обратись к сынам Израиля[a] и скажи им: когда вы войдёте в землю, в которую Я ввожу вас,»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народу Израиля»; букв.: «сынам Израиля».'
    reason: Еврейское выражение буквально имеет родственную форму «сыны Израиля», но в данном обращении обозначает израильский народ.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Интенсивный императив глагола דבר вводит поручение Моисею передать народу прямое Божье наставление. «Обратись» естественно сочетается с последующим «скажи им» и не создаёт тяжеловесного повтора.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное родственное выражение «сыны Израиля», характерное для формульного заветного обращения; возможное более обобщённое значение указано в сноске.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Передаёт обычную последовательную формулу повеления и сохраняет прямую структуру еврейского текста.
- source_word: בְּבֹאֲכֶם
  choice: когда вы войдёте
  rationale: Предлог ב при инфинитиве образует временное придаточное; с упоминанием земли глагол «войдёте» естественно выражает вступление в неё.
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: Сочетание בוא с אֶל обозначает направленное движение с вхождением; по-русски это естественно передаётся как «войти в землю».
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: в которую Я ввожу вас
  rationale: Причастная форма מֵבִיא представляет Божье действие как совершающееся и направленное к будущему вступлению. «Ввожу» сохраняет каузативный смысл, а указательное שָׁמָּה естественно включено в относительную конструкцию.
