  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: ru
  text: И принеси для возлияния половину гина вина — огненную жертву[a], благоухание, приятное Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву, приносимую огнём»; «жертву, сжигаемую на огне».'
    reason: Термин אִשֶּׁה в жертвенной лексике традиционно связывают с огнём; его точная этимология и объём значения обсуждаются.
lexical_decisions:
- source_word: וְ/יַיִן
  choice: И вина
  rationale: יַיִן означает «вино»; союз וְ передан как «и». Родительный формы «вина» естественно связан с повелительным «принеси» в значении количества вещества.
- source_word: תַּקְרִיב
  choice: принеси
  rationale: Каузативная форма глагола קרב в жертвенном контексте означает «поднести, принести, представить». «Принеси» естественно и сохраняет культовый контекст.
- source_word: לַ/נֶּסֶךְ
  choice: для возлияния
  rationale: נֶסֶךְ обозначает жидкую жертву, которую выливали; «возлияние» — точный и устоявшийся русский эквивалент.
- source_word: חֲצִי הַ/הִין
  choice: половину гина
  rationale: Сохранена древняя мера объёма הִין без приблизительной замены современной мерой.
- source_word: אִשֵּׁה
  choice: огненную жертву
  rationale: Термин священнической лексики связан с жертвой, предаваемой огню. Формулировка сохраняет эту связь и не сужает значение до пищи.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Устойчивое жертвенное выражение передаёт принятие жертвы Богом. Такая формулировка сохраняет существительное רֵיחַ и определительное значение נִיחֹחַ.
- source_word: לַ/יהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве»; предлог ל выражен синтаксической связью в обороте «приятное Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Транслитерация сохраняет личное имя Бога, явно присутствующее в древнееврейском тексте, и соответствует указанной проектной практике.
- issue: Значение אִשֵּׁה
  choice: огненная жертва
  alternative: пища-жертва / жертва, сжигаемая на огне
  rationale: Слово допускает обсуждаемую связь как с жертвенной пищей, так и с огнём. В данном стихе выбрана традиционная огневая передача, а возможный более функциональный смысл не утверждается как единственный.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксические тире отделяют меру возлияния и поясняющее жертвенное определение; архаизмы сведены к необходимым культовым терминам «возлияние» и «гин».
