- from: И вина принеси для возлияния — половину гина, — как огненную жертву, благоухание, приятное Яхве.
  to: И принеси для возлияния половину гина вина — огненную жертву[a], благоухание, приятное Яхве.
  rationale: Убран не выраженный в оригинале сравнительный союз «как»; перестроен порядок слов для естественного русского синтаксиса. Все смысловые компоненты еврейского текста сохранены, а спорный жертвенный термин снабжён сноской без догматического уточнения.
