    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: закон
  rationale: В данном юридическом контексте слово обозначает обязательное предписание; «закон» естественно передаёт этот смысл и сохраняет отличие от מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: установление
  rationale: Здесь имеется в виду установленная правовая норма. «Установление» сохраняет юридический оттенок и не создаёт ложного впечатления о судебном приговоре.
- source_word: אַחַת / אֶחָד
  choice: один / одно
  rationale: Повтор числительного подчёркивает единство нормы и её равное применение; русский перевод сохраняет этот повтор с необходимым согласованием по роду.
- source_word: יִהְיֶה
  choice: будет
  rationale: Имперфект в законодательной формуле имеет предписывающую силу. В современном русском «будет» естественно выражает установленный порядок без архаичного канцелярита.
- source_word: גֵּר
  choice: переселенец
  rationale: Слово обозначает неуроженца, постоянно живущего в среде Израиля и включённого в его общественный порядок. «Переселенец» передаёт статус проживающего чужеземца без современных негативных коннотаций слова «пришелец».
- source_word: הַגָּר
  choice: живущего
  rationale: Причастие буквально описывает того, кто пребывает или проживает с общиной. Русское «живущего» звучит естественно; буквальный этимологический повтор с «переселенцем» был бы тяжеловесен.
- source_word: אִתְּכֶם
  choice: среди вас
  rationale: Буквально — «с вами», однако в сочетании с глаголом проживания выражение «среди вас» точнее и естественнее передаёт социально-пространственный смысл.
theological_decisions:
- issue: Равенство правовой нормы для Израиля и живущего среди него переселенца
  choice: Формулировка утверждает, что для адресатов и переселенца действует единый закон и единое установление.
  alternative: Можно понимать это равенство уже — только применительно к непосредственно окружающим предписаниям о жертвоприношениях.
  rationale: Стих сформулирован широко, но находится внутри конкретного законодательного раздела. Перевод сохраняет широту формулы, не определяя за текстом пределы её применения.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной формулы. Сохранён повтор «один… одно», а различие между תּוֹרָה и מִשְׁפָּט передано словами «закон» и «установление».
