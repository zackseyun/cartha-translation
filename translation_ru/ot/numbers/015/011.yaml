  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: ru
  text: Так следует делать для каждого быка, для каждого барана или для животного мелкого скота[a] — овцы или козы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское שֶׂה обозначает отдельную голову мелкого скота и может относиться не только к ягнёнку, но и к козлёнку; далее уточняется: овца или коза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: Так
  rationale: Кратко и естественно вводит предписанный порядок действий в законодательном контексте.
- source_word: יֵעָשֶׂה
  choice: следует делать
  rationale: Передаёт безличную пассивно-предписывающую силу нифаля, не уточняя сверх текста подразумеваемое действие.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: для каждого быка
  rationale: Сочетание определённого артикля с числительным указывает на отдельное животное в каждом случае; по-русски «каждого» естественно передаёт распределительный смысл.
- source_word: לָאַיִל הָאֶחָד
  choice: для каждого барана
  rationale: «Баран» — обычное соответствие אַיִל; «каждого» сохраняет применение предписания к одному животному за раз.
- source_word: שֶׂה
  choice: животного из мелкого скота
  rationale: Слово обозначает отдельную голову мелкого скота и может относиться как к овце, так и к козе; нейтральная формулировка сохраняет широту значения.
- source_word: בַכְּבָשִׂים ... בָעִזִּים
  choice: из овец или из коз
  rationale: Предлог ב здесь выражает принадлежность к категории; русский оборот ясно сохраняет различение овечьего и козьего мелкого скота.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: или ... или ... или
  rationale: Повторяющийся разделительный союз передан настолько полно, насколько это естественно в русском синтаксисе; последнее противопоставление сохранено в обороте «из овец или из коз».
