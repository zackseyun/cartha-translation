revisions:
- from: И если переселенец живёт у вас или кто-либо находится среди вас во все ваши поколения и приносит жертву, сжигаемую в огне[a], — благоухание, приятное Яхве, — то он должен поступать так же, как поступаете вы.
  to: И если переселенец живёт у вас или кто-либо находится среди вас из поколения в поколение и приносит огненную жертву — благоухание, приятное Яхве, — то он должен поступать так же, как поступаете вы.
  rationale: Заменено чрезмерно конкретное «жертву, сжигаемую в огне» на «огненную жертву» и соответственно уточнена сноска. Также «из поколения в поколение» яснее связывает לְדֹרֹתֵיכֶם с длительным действием нормы. Остальные элементы сохранены по смыслу и регистру.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:32Z'
review_pass:
  verdict: revise
  source_fidelity: В целом условная конструкция, различение «у вас» и «среди вас», длительность «из поколения в поколение» и заключительная формула равенства практики переданы верно. Однако «жертва, сжигаемая в огне» способна утверждать, что вся жертва сжигается; אִשֶּׁה обозначает приношение посредством огня и не требует такого уточнения. Уместнее сохранить более широкий термин «огненная жертва».
  naturalness: Исходная фраза понятна, но сочетание «жертву, сжигаемую в огне, — благоухание» стилистически тяжеловесно и создаёт не вполне ясную связь между жертвой и «благоуханием». Более компактное «огненную жертву — благоухание, приятное Яхве» сохраняет библейскую образность и естественно читается в современном литературном русском.
  terminology: «Переселенец» приемлемо передаёт גֵּר как юридико-социальную категорию без архаизации. «Яхве» последовательно передаёт тетраграмматон. «Огненная жертва» точнее соответствует אִשֶּׁה, чем формулировка, предполагающая полное сожжение жертвы.
  issues:
  - severity: medium
    issue: Фраза «жертву, сжигаемую в огне» чрезмерно конкретизирует אִשֶּׁה.
    rationale: Термин означает приношение, совершаемое посредством огня; сам по себе он не говорит, что жертва целиком сжигается. Следует избежать этой дополнительной импликации.
  revised_text: И если переселенец живёт у вас или кто-либо находится среди вас из поколения в поколение и приносит огненную жертву — благоухание, приятное Яхве, — то он должен поступать так же, как поступаете вы.
  revised_footnotes:
  - marker: a
    text: 'Или: «жертву, совершаемую посредством огня».'
    reason: Существительное אִשֶּׁה обозначает приношение посредством огня; вариант поясняет термин, не предполагая, что вся жертва обязательно сжигается.
  revision_rationale: Заменено чрезмерно конкретное «жертву, сжигаемую в огне» на «огненную жертву» и соответственно уточнена сноска. Также «из поколения в поколение» яснее связывает לְדֹרֹתֵיכֶם с длительным действием нормы. Остальные элементы сохранены по смыслу и регистру.
