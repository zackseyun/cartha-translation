  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: ru
  text: И если переселенец живёт у вас или кто-либо находится среди вас из поколения в поколение и приносит огненную жертву — благоухание, приятное Яхве, — то он должен поступать так же, как поступаете вы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: И если
  rationale: Сохраняет как соединительное значение ו, связывающее этот случай с предыдущим законом, так и условный характер כי.
- source_word: יָגוּר ... גֵּר
  choice: переселенец живёт
  rationale: 'Передаёт сочетание глагола גור и существительного גֵּר: речь идёт о человеке не из местного населения, который проживает вместе с общиной. «Переселенец» звучит современнее и нейтральнее, чем «пришелец».'
- source_word: אִתְּכֶם
  choice: у вас
  rationale: Естественно передаёт проживание вместе с адресатами, не смешивая эту фразу со следующим בְּתוֹכְכֶם — «среди вас».
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: или кто-либо находится среди вас
  rationale: Сохраняет широкую и несколько неопределённую относительную конструкцию оригинала, не ограничивая её дополнительным толкованием.
- source_word: לְדֹרֹתֵיכֶם
  choice: во все ваши поколения
  rationale: Передаёт постоянную применимость установления к последующим поколениям.
- source_word: וְעָשָׂה
  choice: и приносит
  rationale: В контексте жертвоприношения עשה естественно передаётся глаголом «приносить», хотя буквально означает «делать» или «совершать».
- source_word: אִשֵּׁה
  choice: жертву, сжигаемую в огне
  rationale: Передаёт связь термина с огнём и жертвенным сожжением, не вводя представление о буквальной пище для Бога. Краткий традиционный вариант дан в сноске.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Сохраняет жертвенную метафору и смысл угодности Богу в естественной для русского библейского стиля форме.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, в соответствии с консультационным текстом, не заменяя его титулом.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: он должен поступать так же, как поступаете вы
  rationale: Сохраняет сравнительную правовую формулу и её предписывающую силу в естественном современном русском порядке слов.
theological_decisions:
- issue: Положение неурождённого участника жертвенного служения
  choice: В описанном случае переселенец или иной находящийся среди Израиля человек должен соблюдать тот же порядок жертвоприношения, что и адресаты закона.
  alternative: Считать предписание относящимся только к переселенцу, уже полностью включённому в заветную жизнь Израиля.
  rationale: Формула «так же, как поступаете вы» прямо устанавливает одинаковый порядок действий в данном случае, но стих сам по себе не определяет все стороны заветного статуса такого человека.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Правовая обязательность выражена конструкцией «должен поступать», а параллелизм заключительной формулы сохранён без архаизмов.
