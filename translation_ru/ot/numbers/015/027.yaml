  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: ru
  text: Если же один человек согрешит неумышленно, пусть принесёт годовалую козу в жертву за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское слово חַטָּאת может обозначать жертву, связанную с грехом или ритуальной нечистотой, а не только сам грех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если же
  rationale: Вводит частный случай, противопоставленный предшествующему установлению; русская конструкция «если же» естественно передаёт условный и мягко контрастный оттенок.
- source_word: נֶפֶשׁ אַחַת
  choice: один человек
  rationale: В юридическом контексте נֶפֶשׁ обозначает отдельного человека, а не «душу» как часть человеческого существа; «один человек» сохраняет подчёркнутую единичность.
- source_word: תֶּחֱטָא
  choice: согрешит
  rationale: Форма глагола в условном правовом установлении естественно передаётся русским будущим временем.
- source_word: בִשְׁגָגָה
  choice: неумышленно
  rationale: Обозначает грех, совершённый по ошибке или без намерения, в отличие от сознательного, дерзкого нарушения.
- source_word: וְהִקְרִיבָה
  choice: пусть принесёт
  rationale: В жертвенном контексте глагол означает принесение и представление дара; повелительная конструкция ясно выражает предписанное следствие условия.
- source_word: עֵז
  choice: козу
  rationale: Еврейское существительное здесь обозначает именно самку козы; русское «козу» сохраняет это указание.
- source_word: בַּת שְׁנָתָהּ
  choice: годовалую
  rationale: Устойчивое и понятное обозначение животного первого года жизни или возрастом около года.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном законодательстве חַטָּאת обозначает особый вид жертвы, связанной с устранением последствий греха или нечистоты; традиционное выражение понятно читателю, а ритуальная альтернатива отмечена в сноске.
theological_decisions:
- issue: Грамматический род согрешившего человека
  choice: Передано нейтральной по смыслу конструкцией «один человек ... согрешит ... принесёт»
  alternative: «Одна душа ... согрешит ... принесёт», с буквальным сохранением женского рода
  rationale: Женский род еврейских глаголов обусловлен согласованием с существительным נֶפֶשׁ женского рода и не ограничивает действие закона женщинами. Русская формулировка относится к любому отдельному человеку, не вводя отсутствующего в тексте ограничения.
- issue: Значение חַטָּאת в жертвенном законодательстве
  choice: «жертва за грех» в основном тексте
  alternative: «очистительная жертва»
  rationale: Традиционное выражение остаётся ясным и широко понятным, однако термин может подчёркивать очистительную функцию обряда, поэтому эта возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной юридико-культовой формулировкой. «Если же» передаёт связь с предыдущим установлением; «пусть принесёт» звучит нормативно, но не архаично. Сноска поставлена непосредственно после выражения, к которому относится.
