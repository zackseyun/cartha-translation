source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: ru
  text: Если же ты приготовишь быка как всесожжение или как жертву — во исполнение обета либо как мирную жертву — для Яхве,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: Если же
  rationale: В законодательном контексте сочетание вводит очередной условный случай; «если же» естественно связывает его с предыдущими предписаниями.
- source_word: תַעֲשֶׂה
  choice: приготовишь
  rationale: Глагол עשה имеет общее значение «делать»; применительно к жертве «приготовишь» сохраняет эту широту и звучит естественнее буквального «сделаешь».
- source_word: בֶן בָּקָר
  choice: быка
  rationale: Буквально «сын крупного скота» — идиоматическое обозначение животного из стада; в данном контексте краткое «быка» передаёт смысл без необязательного уточнения возраста.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшееся и точное русское обозначение жертвы, целиком сжигаемой на жертвеннике.
- source_word: זָבַח
  choice: жертвы
  rationale: Общий термин для закалываемой жертвы; перевод не сужает его до одного конкретного вида.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: во исполнение обета
  rationale: В культовом употреблении выражение обозначает совершение обещанного по обету приношения; русская формула передаёт идиому ясно и сдержанно.
- source_word: שְׁלָמִים
  choice: мирную жертву
  rationale: Традиционное русское название этой категории жертв; единственное число согласовано с приносимым быком, тогда как еврейская форма обозначает категорию приношений.
- source_word: לַ/יהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» сохраняет различие между именем и титулом.
- issue: Передача שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Традиционный термин сохраняет отдельную жертвенную категорию и не сводит её значение лишь к общению или благополучию.
- issue: Синтаксическая связь לְפַלֵּא נֶדֶר и שְׁלָמִים
  choice: 'два возможных назначения жертвы: во исполнение обета либо как мирная жертва'
  alternative: «жертва для исполнения обета» как единое сочетание, после которого отдельно упоминаются мирные жертвы
  rationale: Пунктуация с тире отражает наиболее естественное смысловое членение, но не вводит дополнительной богословской классификации; оба назначения остаются координированными союзом «либо».
translation_notes:
  register: Современный литературный русский с достоинством, уместным для богослужебно-законодательного текста. Синтаксис оставлен незавершённым запятой, поскольку стих составляет условную часть предложения, продолжающегося в следующем стихе.
