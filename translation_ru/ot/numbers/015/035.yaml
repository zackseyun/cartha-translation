  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Этот человек непременно должен быть предан смерти[a]. Пусть всё общество побьёт его камнями[b] за пределами стана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское сочетание абсолютного инфинитива с личной формой глагола усиливает смысл: «он непременно должен быть предан смерти».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально говорит о побивании камнями и обозначает судебную казнь через побивание камнями.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Естественно продолжает последовательное повествование, сохраняя соединительное значение формы с waw.
- source_word: מוֹת יוּמַת
  choice: непременно должен быть предан смерти
  rationale: Сохраняет страдательное значение и усиление, создаваемое сочетанием абсолютного инфинитива с личной формой глагола, без архаической буквальности.
- source_word: הָאִישׁ
  choice: этот человек
  rationale: Определённая форма указывает на уже названного нарушителя; указательное выражение естественно передаёт эту отсылку по-русски.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: побьёт его камнями
  rationale: Передаёт установленную судебную казнь через побивание камнями и сохраняет образ исходного выражения.
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: Обозначает всю собранную общину Израиля как единое целое; «общество» соответствует принятой библейско-правовой лексике и остаётся понятным современному читателю.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределами стана
  rationale: Точно обозначает место совершения казни вне лагеря; «стан» сохраняет исторический контекст странствующего Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Субъект исполнения приговора
  choice: всё общество
  alternative: представители общества
  rationale: Текст прямо называет כָּל הָעֵדָה, поэтому перевод не сужает участие общины до её представителей и не снимает напряжения исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Слово «стан» сохраняет историческую обстановку, а синтаксис остаётся ясным и естественным.
