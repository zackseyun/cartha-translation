  source_fidelity: 'Требуется небольшая правка. «Всего» в «для всего общества» не имеет отдельного соответствия в הַקָּהָל и излишне усиливает исходное понятие «собрание/община». Заключительный параллелизм в черновике передан синтаксически неполно: русское «Как вы, так и пришелец будет пред Яхве» оставляет невыраженным необходимый соотносительный член. Формула «Как вы, таков будет и пришелец пред Яхве» точно передаёт сравнительную конструкцию כָּכֶם כַּגֵּר יִהְיֶה, включая глагол «будет».'
