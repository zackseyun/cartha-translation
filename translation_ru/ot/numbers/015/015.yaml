  terminology: «Устав», «пришелец» и «Яхве» уместны. «Пришелец, живущий у вас» отражает статус גֵּר и причастие הַגָּר без расширения утверждения о его правах за рамки данного постановления. «Вечный устав» допустим для חֻקַּת עוֹלָם; сноска сохраняет альтернативные оттенки длительной обязательности.
