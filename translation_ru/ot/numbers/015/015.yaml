base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: ru
  text: Для собрания один устав — для вас и для пришельца[a], живущего у вас; это вечный устав[b] на все ваши поколения. Как вы, таков будет и пришелец пред Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземца, поселившегося среди вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неизменный устав»; «устав на все времена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: всего общества
  rationale: קָהָל обозначает собранную общину Израиля. «Общество» в данном правовом и богослужебном контексте звучит современно и не привносит исключительно церковного оттенка; добавление «всего» естественно передаёт вынесенное в начало собирательное понятие.
- source_word: חֻקָּה אַחַת
  choice: один устав
  rationale: חֻקָּה — обязательное установленное предписание. «Один устав» сохраняет юридическую силу выражения и подчёркнутое единство нормы.
- source_word: לָכֶם וְלַגֵּר
  choice: для вас и для пришельца
  rationale: גֵּר здесь означает не случайного незнакомца, а иноплеменника, постоянно живущего среди Израиля и подпадающего под его правовые установления. Традиционное русское «пришелец» кратко и уместно в библейском правовом контексте.
- source_word: הַגָּר
  choice: живущего у вас
  rationale: Причастие от גור повторяет корень существительного גֵּר и указывает на проживание среди адресатов. Дословную игру однокоренных слов по-русски естественно не воспроизвести; оборот поясняет устойчивый статус пришельца.
- source_word: חֻקַּת עוֹלָם
  choice: вечный устав
  rationale: В правовой формуле עוֹלָם выражает непреходящую, длительную обязательность установления. «Вечный устав» сохраняет традиционную силу формулы, а сноска отмечает возможный смысловой оттенок постоянства.
- source_word: לְדֹרֹתֵיכֶם
  choice: на все ваши поколения
  rationale: Выражение указывает на действие нормы в череде последующих поколений. Такой перевод ясен в современном русском и сохраняет временной охват оригинала.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: Как вы, так и пришелец будет
  rationale: Сопоставительная конструкция כ...כ подчёркивает равное положение обеих сторон. Формулировка сохраняет её симметрию, не превращая утверждение в более широкое толкование о равенстве во всех отношениях.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает «перед, в присутствии». «Пред Яхве» кратко сохраняет богослужебно-правовой регистр и направленность нормы на Божье присутствие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой научной транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Правовое положение живущего среди Израиля пришельца в данном установлении
  choice: Перевод подчёркивает единство устава и одинаковое положение израильтян и пришельца пред Яхве в рассматриваемом деле.
  alternative: Можно было сформулировать это как общее и безусловное равенство пришельца и коренного израильтянина во всех сферах.
  rationale: Ближайший контекст относится к жертвенным постановлениям. Поэтому перевод сохраняет ясно выраженное равенство перед данным уставом, но не расширяет его за пределы того, что утверждает стих.
- issue: Временная сила выражения חֻקַּת עוֹלָם
  choice: «вечный устав» с поясняющей сноской
  alternative: «неизменный устав» или «устав на все времена»
  rationale: Слово עוֹלָם допускает оттенки вечности, бессрочности и постоянной силы. Основной текст сохраняет сильную традиционную формулу, а сноска не позволяет безоговорочно свести её к одному философскому пониманию вечности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сохраняет юридическую торжественность и параллелизм еврейского текста, оставаясь понятным современному читателю. Все сноски привязаны к тем словам, которые они поясняют.
