  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: ru
  text: 'Обратись к сынам Израиля и скажи им[a]: «Когда вы войдёте в землю, где будете жить[b], которую Я даю вам,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в землю ваших жилищ»; возможно также: «в землю ваших поселений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Пиэльный императив דבר вводит повеление передать народу Божье наставление. «Обратись к» естественно передаёт формулу речи в современном русском языке.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранён буквальный родственный и грамматически мужской образ еврейского выражения; более идиоматичный вариант «израильтянам» указан в сноске.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Формульное последовательное повеление передано прямо и естественно.
- source_word: כִּי
  choice: Когда
  rationale: Здесь союз вводит ожидаемое обстоятельство последующего законодательства — вхождение в землю, а не выражает причину.
- source_word: תָבֹאוּ
  choice: вы войдёте
  rationale: В данном контексте בוא с направлением в землю естественно означает вхождение; будущее время соответствует ожидаемому событию.
- source_word: אֶרֶץ
  choice: землю
  rationale: «Земля» — традиционное и контекстуально значимое обозначение даруемой территории.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: где будете жить
  rationale: Функционально и ясно передаёт необычное сочетание «земля ваших мест жительства», не создавая в русском тяжеловесной конструкции.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: которую Я даю вам
  rationale: Настоящее время сохраняет аспект причастия נֹתֵן и выражает актуальность и определённость Божьего дара без добавления исключительно будущего оттенка.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; детям Израиля
  rationale: Основной текст сохраняет родственный образ и мужскую форму оригинала, не сужая при этом подразумеваемый адресат — общину Израиля; естественная обобщающая передача отмечена в сноске.
- issue: Временной аспект Божьего дара в נֹתֵן
  choice: которую Я даю вам
  alternative: которую Я дам вам
  rationale: Причастная форма представляет дарение как актуальное и несомненное действие. Будущее время возможно по контексту, но несколько сильнее уточняет временную отнесённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула обращения передана естественно, буквальный родственный образ сохранён, а необычная конструкция о местах жительства разъяснена без устранения её возможных смыслов.
