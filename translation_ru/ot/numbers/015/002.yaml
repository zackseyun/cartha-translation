  verdict: approve
  source_fidelity: Текст точно передаёт повеление говорить с בני ישראל, последующее «скажи им», обстоятельственное «когда», вхождение в землю и определительное придаточное о земле, которую Бог даёт адресатам. «Где будете жить» является допустимой естественной передачей неоднозначного выражения אֶרֶץ מוֹשְׁבֹתֵיכֶם; буквальная конструкция и вариант «поселений» надлежащим образом отражены в сноске.
  naturalness: Современный литературный русский звучит ясно и сдержанно-библейски. «Обратись к сынам Израиля и скажи им» естественно передаёт двухчастную формулу повеления, не создавая неоправданной разговорности. Незавершённость кавычек соответствует тому, что стих составляет начало продолжающейся прямой речи.
  terminology: «Сынам Израиля» сохраняет родственный образ оригинала и согласуется с выбранной переводческой стратегией; естественный обобщающий вариант указан в сноске. «Земля» и «Я даю вам» точны и терминологически уместны. Местоимение «Я» оправдано как речь Бога.
