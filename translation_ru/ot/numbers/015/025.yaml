    rationale: Формулировка добавляет глагольное описание («совершили»), которого в עַל שִׁגְגָתָם нет; безопаснее назвать непреднамеренную ошибку/нарушение как таковое.
  - severity: low
    issue: «Свой дар»
    rationale: Для קָרְבָּנָם в данном жертвенном перечислении «своё приношение» точнее и лучше сочетается с последующими специальными жертвами.
  - severity: low
    issue: Расположение сноски [a]
    rationale: Сноска поясняет исключительно «жертву за грех», поэтому якорь должен стоять непосредственно после этого выражения.
