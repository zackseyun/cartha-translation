  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: ru
  text: И священник совершит искупление за всю общину сынов Израиля, и им будет прощено, потому что это была непреднамеренная ошибка и они принесли своё приношение — огненную жертву Яхве — и свою жертву за грех[a] пред Яхве за свою непреднамеренную ошибку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Жертву за грех» можно также перевести как «очистительную жертву». Еврейское слово в жертвенном контексте может подчёркивать очищение от осквернения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: совершит искупление
  rationale: Пиэль глагола כפר в жертвенном контексте обозначает совершение искупления; эта формулировка сохраняет культовое и богословское содержание.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: за всю общину сынов Израиля
  rationale: Предлог עַל при כפר передан как «за»; עֲדָה — «община», а בְּנֵי יִשְׂרָאֵל формально и понятно передаётся как «сыны Израиля».
- source_word: וְנִסְלַח לָהֶם
  choice: и им будет прощено
  rationale: Безличная русская конструкция сохраняет пассивный смысл нифаля и не вводит прямо не названного в еврейском тексте деятеля.
- source_word: כִּי שְׁגָגָה הִוא
  choice: потому что это произошло по неведению
  rationale: שְׁגָגָה обозначает непреднамеренное нарушение или ошибку; «по неведению» естественно для русского языка жертвенного законодательства и не снимает нравственной стороны проступка.
- source_word: אֶת קָרְבָּנָם
  choice: свой дар
  rationale: קָרְבָּן — приносимый Богу дар или приношение; «дар» позволяет избежать неуклюжего повтора слова «жертва» перед последующим пояснением.
- source_word: אִשֶּׁה לַיהוָה
  choice: огненную жертву Яхве
  rationale: אִשֶּׁה связано с жертвой, предаваемой огню; «огненная жертва» кратко и точно сохраняет культовый образ, не истолковывая термин как пищу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, представленное тетраграмматоном, передано транслитерацией, а не заменено титулом.
- source_word: וְחַטָּאתָם
  choice: и свою жертву за грех
  rationale: В данном синтаксисе חַטָּאת обозначает приносимую жертву, связанную с грехом, а не сам грех; традиционное выражение остаётся понятным современному читателю.
- source_word: עַל שִׁגְגָתָם
  choice: за то, что совершили по неведению
  rationale: Передаёт причинно-целевую связь и повтор корня שׁגג, избегая тяжёлого буквального выражения «за их ошибку по неведению».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Слово обозначает здесь то, что община приносит пред Яхве. «Жертва за грех» сохраняет привычную связь с грехом, тогда как возможный очистительный оттенок отмечен в сноске.
- issue: Характер שְׁגָגָה
  choice: по неведению
  alternative: непреднамеренно / по ошибке
  rationale: Формулировка сохраняет юридико-жертвенное различие между намеренным и ненамеренным нарушением, не сводя проступок к безобидной ошибке.
translation_notes:
  register: Современный литературный русский с достоинством законодательного и богослужебного контекста. Синтаксис остаётся близким к еврейскому, но повторы и связи оформлены естественно для русского читателя; подлинная неоднозначность термина חַטָּאת вынесена в сноску.
