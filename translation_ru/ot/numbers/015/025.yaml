  source_fidelity: 'В целом перевод верно передаёт жертвенно-правовой смысл: כפר — «совершит искупление», עַל — «за», пассивное «им будет прощено», имя Яхве и жертвенное значение חַטָּאת. Однако «за то, что совершили по неведению» несколько сужает שִׁגְגָתָם: в оригинале названо само непреднамеренное нарушение/ошибка, а не конкретно действие, выраженное глаголом «совершили».'
  naturalness: «Свой дар» рядом с двумя специальными видами жертв менее точно и стилистически менее единообразно, чем «своё приношение». Повтор «по неведению» можно сохранить более ясно как «непреднамеренная ошибка».
  terminology: «Огненная жертва Яхве» допустима для אִשֶּׁה לַיהוָה; «жертва за грех» — естественный традиционный эквивалент חַטָּאת. Сноску об альтернативе «очистительная жертва» следует поставить непосредственно после этого термина, а не в конце стиха.
  issues:
  - severity: medium
