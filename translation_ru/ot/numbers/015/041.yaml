base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: ru
  text: Я — Яхве, ваш Бог, который вывел вас из земли Египта, чтобы быть вашим Богом. Я — Яхве, ваш Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Несмотря на форму множественного числа, при единственном референте и притяжательном суффиксе выражение обозначает единого Бога Израиля.
- source_word: אֲשֶׁר
  choice: который
  rationale: Естественно вводит определительное придаточное с личным предшествующим «Яхве, ваш Бог».
- source_word: הוֹצֵאתִי
  choice: вывел
  rationale: Каузативная порода глагола יצא означает «вывести»; это обычная формула исхода.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет слово אֶרֶץ и торжественную форму формулы исхода, оставаясь понятным в современном русском языке.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: чтобы быть вашим Богом
  rationale: Передаёт цель исхода и заветный характер отношений; русская притяжательная конструкция естественно выражает буквальное «быть Богом для вас».
- source_word: אֲנִי
  choice: Я —
  rationale: В именном предложении тире естественно передаёт отсутствующую в еврейском связку и сохраняет эмфатическое звучание обоих повторов.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Заветная формула לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: чтобы быть вашим Богом
  alternative: чтобы быть Богом для вас
  rationale: Выбранная формулировка естественна по-русски и сохраняет смысл заветной принадлежности и отношений, не сводя выражение к отвлечённому указанию на божество.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным ритмом. Повтор заключительной формулы сохранён полностью; «земля Египетская» поддерживает библейскую торжественность без потери ясности.
