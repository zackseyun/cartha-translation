revisions:
- from: Для коренного из сынов Израиля и для переселенца[a], живущего среди них, у вас будет один закон — для того, кто совершит что-либо непреднамеренно.
  to: Для коренного израильтянина и для переселенца[a], живущего среди них, у вас будет один закон — для всякого, кто поступит по неведению.
  rationale: 'Исправлены две безопасные языковые неточности: калькированное «коренного из сынов Израиля» заменено на естественное «коренного израильтянина», а тяжеловесное описание неумышленного действия — на формулу, ближе соответствующую обобщённому еврейскому выражению. Сохранены различие между «среди них» и прямым обращением «у вас», единый закон для обеих групп и культурное пояснение к термину גֵּר.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: один и тот же правовой порядок распространяется на коренного израильтянина и на גֵּר, постоянно живущего в общине, в случае неумышленного действия. Однако «коренного из сынов Израиля» неестественно по-русски; более точное и ясное «коренного израильтянина» передаёт הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל без потери смысла. «Поступит по неведению» передаёт בִּשְׁגָגָה, не добавляя подразумеваемый объект действия.'
  naturalness: Предлагаемая редакция сохраняет современный литературный и умеренно библейский регистр. Формула «у вас будет один закон» естественна в законодательном контексте, а «для всякого, кто поступит по неведению» яснее и плавнее, чем «для того, кто совершит что-либо непреднамеренно».
  terminology: «Коренной израильтянин» — естественное обозначение туземного/полноправного местного члена Израиля в данном контексте. «Переселенец» допустим при пояснении в примечании, поскольку речь идёт не о случайном чужеземце, а о постоянно проживающем некоренном члене общества. «Один закон» адекватно передаёт תּוֹרָה אַחַת и не расширяет сферу утверждения за пределы непосредственного правового случая.
  issues:
  - severity: medium
    issue: Неестественная формулировка «коренного из сынов Израиля».
    rationale: Сочетание звучит как буквальная калька и может восприниматься как «коренного, происходящего от сынов Израиля», хотя еврейская конструкция обозначает коренного члена израильской общины. «Коренного израильтянина» сохраняет это значение естественно.
  - severity: low
    issue: «Совершит что-либо непреднамеренно» стилистически тяжеловесно и вводит неопределённый объект.
    rationale: Лָעֹשֶׂה обозначает того, кто действует/поступает, а בִּשְׁגָגָה — по ошибке, по неведению. «Поступит по неведению» передаёт обобщённость оригинала без лишнего восполнения.
  revised_text: Для коренного израильтянина и для переселенца[a], живущего среди них, у вас будет один закон — для всякого, кто поступит по неведению.
  revised_footnotes:
