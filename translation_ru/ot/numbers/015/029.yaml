  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: ru
  text: Для коренного израильтянина и для переселенца[a], живущего среди них, у вас будет один закон — для всякого, кто поступит по неведению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Переселенец» — некоренной житель, постоянно проживающий в общине Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: коренного из сынов Израиля
  rationale: Передаёт принадлежность коренного жителя к общине Израиля, сохраняя явное выражение בִּבְנֵי יִשְׂרָאֵל и естественную для русского библейского текста формулировку.
- source_word: וְלַגֵּר
  choice: и для переселенца
  rationale: В данном правовом контексте גֵּר обозначает некоренного человека, постоянно живущего внутри общины, а не случайного путника.
- source_word: הַגָּר בְּתוֹכָם
  choice: живущего среди них
  rationale: Причастная конструкция описывает постоянное проживание; местоимение «них» соответствует масоретскому בְּתוֹכָם.
- source_word: תּוֹרָה אַחַת
  choice: один закон
  rationale: Сохраняет буквальный образ единого установления и подчёркивает одинаковую правовую норму для обеих названных групп.
- source_word: יִהְיֶה לָכֶם
  choice: у вас будет
  rationale: Естественно передаёт еврейскую конструкцию существования с адресованным общине לָכֶם, не устраняя прямое обращение.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: для того, кто совершит что-либо непреднамеренно
  rationale: Сохраняет обобщённое единственное число причастия и правовое значение שְׁגָגָה — действие по неведению или без умысла; «что-либо» естественно восполняет подразумеваемый объект действия.
theological_decisions:
- issue: Равное применение закона к коренному израильтянину и переселенцу при непреднамеренном поступке
  choice: Один и тот же закон относится к представителю любой из двух групп.
  alternative: Передать תּוֹרָה как «наставление» и сформулировать более обобщённо.
  rationale: Контекст главы имеет правовой и жертвенный характер; «один закон» сохраняет смысл равного применения конкретного предписания, не распространяя утверждение за пределы данного случая.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранено колебание текста между третьим лицом («среди них») и прямым обращением («у вас»), присутствующее в масоретском тексте.
