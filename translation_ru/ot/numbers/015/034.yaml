  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: ru
  text: И поместили его под стражу, потому что ещё не было определено, что с ним следует сделать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: оставили
  rationale: В породе хифиль глагол נוח может означать «поместить» или «оставить». Здесь «оставили» естественно передаёт содержание человека под стражей до решения дела.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение мужского рода единственного числа в функции прямого дополнения относится к человеку, собиравшему дрова в предшествующем контексте.
- source_word: בַּמִּשְׁמָר
  choice: под стражей
  rationale: מִשְׁמָר обозначает охрану, содержание под стражей или место заключения. Этот вариант передаёт временное задержание, не представляя его уже вынесенным приговором к тюремному заключению.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой человека оставили под стражей.
- source_word: לֹא פֹרַשׁ
  choice: ещё не было ясно определено
  rationale: Пассивная форма פרש указывает, что требуемое решение не было ясно изложено или конкретно установлено. Слово «ещё» естественно выражает предшествующее состояние относительно повествовательного момента, не добавляя нового содержания.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: что с ним сделать
  rationale: Оборот передаёт вопрос о том, какое действие надлежало предпринять в отношении задержанного; русская неопределённая форма естественно сохраняет юридически-совещательный смысл.
theological_decisions:
- issue: Характер неопределённости в судебном разбирательстве
  choice: Текст сообщает, что ещё не было ясно определено, как поступить с человеком.
  alternative: 'Можно понимать это уже: ещё не была конкретно установлена мера наказания.'
  rationale: Пассивное לֹא פֹרַשׁ указывает на отсутствие ясного определения, но само по себе не уточняет, касалась ли неопределённость только меры наказания или требуемого действия вообще. Перевод сохраняет эту широту.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательно-юридическая. «Под стражей» точнее, чем «в тюрьме», поскольку не предполагает уже вынесенного приговора.
