lexical_decisions:
- source_word: וְהִקְרִיב
  choice: и пусть принесёт
  rationale: Гифиль глагола קרב в жертвенном контексте означает «принести, представить как приношение»; конструкция с «пусть» естественно передаёт предписание.
- source_word: עַל בֶּן הַבָּקָר
  choice: вместе с быком
  rationale: Здесь עַל указывает на сопутствующее приношение, а בֶּן הַבָּקָר — обычное обозначение быка из крупного рогатого скота.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В священническом законодательстве слово обозначает бескровное приношение из муки или зерна; традиционное русское «хлебное приношение» понятно и сохраняет культовую специфику.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово означает тонкую, высококачественную муку, предназначенную для приношений; «лучшая мука» звучит естественно в современном русском.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: три десятых эфы
  rationale: Буквально сказано «три десятых»; по контексту мер приношений подразумеваются три десятых эфы. Единица меры восполнена в тексте и отмечена сноской.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: смешанной с ... масла
  rationale: Причастие описывает муку, смешанную с указанным количеством масла; родительный падеж после обозначения меры естественен по-русски.
- source_word: חֲצִי הַהִין
  choice: половина гина
  rationale: Древняя жидкая мера сохранена транслитерацией без приблизительного пересчёта в современные единицы.
