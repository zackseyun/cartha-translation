  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: ru
  text: Если же вы по неведению[a] не исполните всех этих заповедей, которые Яхве изрёк Моисею,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по ошибке»; возможно также: «непреднамеренно согрешите». Еврейский глагол означает ошибиться или сбиться с пути; здесь он относится к непреднамеренному неисполнению заповедей.'
    reason: Лексическая альтернатива и пояснение правового оттенка.
lexical_decisions:
- source_word: וְכִי
  choice: Если же
  rationale: Сочетание вводит условный случай, продолжающий предшествующее законоположение; частица «же» естественно передаёт лёгкий переход и противопоставление.
- source_word: תִשְׁגּוּ
  choice: вы непреднамеренно уклонитесь
  rationale: Глагол שׁגה обозначает уклонение или ошибку; в данном законническом контексте речь идёт о непреднамеренном нарушении, противопоставленном сознательному неповиновению далее в главе.
- source_word: וְלֹא תַעֲשׂוּ
  choice: и не исполните
  rationale: При заповедях русское «исполнить» естественно передаёт עשה в значении выполнения предписанного и сохраняет связь между ошибочным уклонением и невыполнением.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: всех этих заповедей
  rationale: Перевод сохраняет полноту, выраженную כָּל, указательное значение הָאֵלֶּה и принятое в заветно-правовом контексте соответствие מִצְוָה — «заповедь».
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: которые Яхве изрёк Моисею
  rationale: Относительное предложение прямо связывает заповеди с завершённой речью Яхве, обращённой к Моисею; «изрёк» сохраняет торжественный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя Бога без замены титулом.
- issue: Смысл שׁגה в жертвенно-правовом контексте
  choice: непреднамеренное уклонение
  alternative: ошибка; непреднамеренный грех
  rationale: Ближайший контекст говорит о непреднамеренных нарушениях и позднее противопоставляет им дерзкое действие. Формулировка сохраняет как образ уклонения, так и правовое различие, не сводя глагол прямо к более узкому слову «согрешить».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Конечная запятая сохранена, поскольку синтаксическое условие продолжается в следующем стихе. Маркер сноски поставлен непосредственно после спорного выражения.
