revisions:
- from: Ибо он презрел слово Яхве и нарушил Его заповедь. Такой человек непременно будет истреблён[a]; его вина остаётся на нём[b].
  to: Ибо он презрел слово Яхве и нарушил Его заповедь; такой человек непременно будет отсечён[a], и его вина — на нём[b].
  rationale: 'Заменено «истреблён» на «отсечён», чтобы сохранить юридическую идиому оригинала и не предрешать спорный характер наказания. Убрано добавочное «остаётся», а заключительная еврейская именная конструкция передана прямо: «его вина — на нём».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: כִּי имеет причинное значение; «презрел» точно выражает בָּזָה; единственное число «заповедь» сохранено; «такой человек» корректно передаёт הַנֶּפֶשׁ הַהִוא. Однако «будет истреблён» обычно означает уничтожение и тем самым чрезмерно конкретизирует намеренно неуточнённую формулу הִכָּרֵת תִּכָּרֵת. «Остаётся» в последней фразе добавляет аспект продолжения, которого в еврейской именной конструкции нет.'
  naturalness: Исправленный вариант сохраняет современный литературный и торжественно-правовой регистр. «Будет отсечён» несколько книжно, но в данном контексте это оправданная устойчивая формула; сноска делает её смысловую неопределённость прозрачной.
  terminology: «Яхве», «слово», «заповедь» и «вина» употреблены последовательно и уместно. Личное местоимение «Его» допустимо писать с прописной буквы в выбранной библейской издательской традиции. Формула «вина — на нём» передаёт עֲוֺנָהּ בָּהּ без богословского или юридического уточнения её точного характера.
