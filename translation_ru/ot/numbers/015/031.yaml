id: NUM.15.31
reference: Numbers 15:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: ru
  text: Ибо он презрел слово Яхве и нарушил Его заповедь; такой человек непременно будет отсечён[a], и его вина — на нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «непременно будет отсечён». Точная форма этого наказания в данном стихе не уточняется.'
    reason: cultural_note
  - marker: b
    text: 'Или: «его беззаконие — на нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего приговора; «ибо» сохраняет причинно-пояснительную связь и торжественный регистр.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: דָּבָר здесь обозначает данное Богом слово или повеление; личное имя יהוה передано как «Яхве».
- source_word: בָּזָה
  choice: презрел
  rationale: Глагол выражает сознательное пренебрежение и презрение, а не простую небрежность.
- source_word: מִצְוָתוֹ
  choice: Его заповедь
  rationale: Сохранено единственное число и юридико-заветный вес существительного מִצְוָה.
- source_word: הֵפַר
  choice: нарушил
  rationale: В сочетании с заповедью русский глагол естественно передаёт нарушение обязательного предписания; буквальное «отменил» здесь звучало бы чрезмерно технически.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: непременно будет истреблён
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает категоричность приговора. «Истреблён» сохраняет традиционную библейско-юридическую формулу, не уточняя способ наказания.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: такой человек
  rationale: נֶפֶשׁ в данном правовом контексте обозначает отдельного человека, а не нематериальную «душу».
- source_word: עֲוֺנָהּ בָּהּ
  choice: его вина остаётся на нём
  rationale: Фраза указывает на вменённую самому виновнику ответственность. Добавленное по смыслу «остаётся» делает бессвязочную еврейскую фразу естественной по-русски, не превращая её в новый будущий приговор.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Точное значение наказания, выраженного הִכָּרֵת תִּכָּרֵת
  choice: Сохранить формулу «непременно будет истреблён», не определяя механизм наказания
  alternative: будет казнён; будет исключён из общины
  rationale: Стих не уточняет, означает ли формула смерть, Божий суд или исключение из общины; перевод не должен разрешать эту подлинную неоднозначность.
- issue: Смысл עָוֹן в заключительной фразе
  choice: вина
  alternative: беззаконие; наказание за вину
  rationale: Слово может охватывать проступок, виновность и её последствия. «Вина» лучше всего передаёт здесь личную ответственность, не исключая судебных последствий.
translation_notes:
  register: Современный литературный русский с достоинством и умеренно торжественным звучанием. Синтаксис разделён на два предложения ради ясности. Местоимение «Его» написано с прописной буквы по принятой русской библейской издательской традиции; мужской род соответствует контексту намеренного нарушителя в ст. 30–31.
