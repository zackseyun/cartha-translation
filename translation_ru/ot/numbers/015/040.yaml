    rationale: В современном русском «для» обычно означает цель, назначение или адресата пользы и потому звучит семантически неудачно. לֵאלֹהֵיכֶם обозначает отношение святости к Богу; «перед вашим Богом» естественно передаёт это отношение.
  - severity: low
    issue: Прописная буква в «Мои»
    rationale: Это издательская традиция, а не свойство исходного текста. В нейтральной современной литературной передаче предпочтительно «мои».
  - severity: low
    issue: Расположение маркера сноски
    rationale: Альтернатива относится к «святы»/предикату святости, поэтому маркер должен стоять непосредственно после «святы».
