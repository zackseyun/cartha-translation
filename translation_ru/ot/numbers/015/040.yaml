  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: ru
  text: чтобы вы помнили и исполняли все мои заповеди и были святы[a] перед вашим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящены вашему Богу».'
    reason: Лексическая альтернатива поясняет оттенок посвящённости в קְדֹשִׁים лֵאלֹהֵיכֶם, не заменяя основное более широкое «святы».
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз естественно передаёт целевое значение еврейской конструкции и связывает стих с предшествующим наставлением.
- source_word: תִּזְכְּרוּ
  choice: вы помнили
  rationale: Имперфект в целевом придаточном выражает предполагаемый результат; «помнили» естественно и сохраняет ключевой для контекста смысл памятования.
- source_word: וַעֲשִׂיתֶם
  choice: и исполняли
  rationale: Глагол עשה означает делать, осуществлять; в сочетании с заповедями современное русское «исполнять» идиоматично и не привносит отдельного значения глагола שמר.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: все Мои заповеди
  rationale: Переданы как כָּל («все»), так и суффикс первого лица («Мои»); «заповеди» соответствует заветно-правовому контексту.
- source_word: וִהְיִיתֶם
  choice: и были
  rationale: Глагол היה со сказуемым-прилагательным обозначает состояние или результат; «были» сохраняет эту широту, не усиливая значение до «стали».
- source_word: קְדֹשִׁים
  choice: святы
  rationale: «Святы» сохраняет полный смысловой диапазон קדוש — нравственный, заветный и культовый — без сведения его только к отделённости или посвящению.
- source_word: לֵאלֹהֵיכֶם
  choice: для вашего Бога
  rationale: Предлог ל обозначает направленность или отношение к Богу. «Для вашего Бога» звучит естественно по-русски и не подменяет ל значением «перед», хотя допускает оттенок принадлежности и посвящённости.
theological_decisions:
- issue: Смысл святости в контексте завета
  choice: святы для вашего Бога
  alternative: посвящены вашему Богу
  rationale: Основной текст сохраняет богословски ёмкое «святы», охватывающее нравственную, заветную и культовую стороны. Альтернатива поясняет оттенок отделённости и принадлежности, но не заменяет им весь смысл קדוש.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным и близким к последовательности еврейского текста; местоимение «Мои» написано с прописной буквы по принятой русской библейской издательской традиции.
