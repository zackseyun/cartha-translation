review_pass:
  verdict: revise
  source_fidelity: Союз «чтобы», «помнили», «исполняли все мои заповеди» точно передают целевую конструкцию לְמַעַן, два глагола и объект с суффиксом 1-го лица. «Святы» удачно сохраняет широкий смысл קְדֹשִׁים. Однако «святы для вашего Бога» придаёт предлогу ל неуместный в русском целевой/выгодоприобретательный оттенок («для Бога»), тогда как здесь выражена принадлежность и отношение к Богу.
  naturalness: Фраза в целом ясна и соответствует современному литературному регистру, но сочетание «святы для вашего Бога» неестественно. «Святы перед вашим Богом» — устойчивое, понятное и литературное выражение, передающее требуемое отношение к Богу без смыслового сдвига.
  terminology: '«Заповеди» и «святы» — подходящие традиционные, но живые современные соответствия. Строчная буква в «мои» предпочтительна в нейтральном современном литературном наборе: еврейский текст не кодирует почтительную прописную букву. Сноску следует привязать к слову «святы», которое она поясняет.'
  issues:
