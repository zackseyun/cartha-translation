review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы распределительное «каждый», предписывающая сила имперфекта, указание на предписанный порядок и имя Яхве. Однако «жертва, сжигаемая на огне» чрезмерно конкретизирует אִשֶּׁה: термин относится к приношению, связанному с огнём, но данная формулировка может создавать впечатление, будто вся жертва непременно сжигалась. Кроме того, конструкция «так, совершая всё это, чтобы принести» синтаксически тяжеловесна и менее точно показывает связь «делать всё это таким образом, чтобы/для того чтобы принести».'
  naturalness: «Каждый коренной житель» и «Яхве» уместны в современном литературном русском. Переработка делает фразу более плавной и устраняет неудачное приложение «жертву ... — благоухание», при котором жертва может восприниматься как тождественная благоуханию.
  terminology: «Огненное приношение» сохраняет техническую связь אִשֶּׁה с огнём, не решая спорный этимологический вопрос чрезмерно категорично. Сноска фиксирует допустимые альтернативы. «Благоухание, приятное Яхве» хорошо передаёт רֵיחַ נִיחֹחַ без богословских добавлений.
