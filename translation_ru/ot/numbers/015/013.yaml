    rationale: Технический термин обычно обозначает приношение, совершаемое огнём; в контексте жертвенных правил такая формулировка может неосновательно подразумевать полное сожжение самой жертвы.
  - severity: low
    issue: Тяжеловесная конструкция «поступать так, совершая всё это, чтобы принести».
    rationale: 'Два почти дублирующих обстоятельства осложняют фразу. «Делать всё это так, чтобы принести» яснее сохраняет порядок: исполнение установленных действий ради принесения приношения.'
