  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ru
  text: Каждый коренной житель должен делать всё это так, чтобы принести Яхве огненное приношение — благоухание, приятное Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвенное приношение»; традиционно также: «жертва, сжигаемая на огне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: каждый коренной житель
  rationale: כָּל при существительном в единственном числе имеет распределительное значение «каждый». הָאֶזְרָח обозначает коренного члена израильской общины в противопоставлении пришельцу; русское «житель» естественно передаёт это без утверждения, что речь идёт исключительно о мужчинах.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: должен поступать так, совершая всё это
  rationale: Имперфект имеет предписывающую силу в правовом тексте. כָּכָה указывает на установленный порядок, а אֵלֶּה отсылает к перечисленным ранее действиям и приношениям без их дополнительного уточнения.
- source_word: לְהַקְרִיב
  choice: чтобы принести
  rationale: В жертвенном контексте קרב в породе hифиль означает поднести или принести жертву; целевая конструкция с «чтобы» естественно передаёт לְ с инфинитивом.
- source_word: אִשֵּׁה
  choice: жертву, сжигаемую на огне
  rationale: Это специальный жертвенный термин, вероятнее всего обозначающий приношение, предаваемое огню. Формулировка сохраняет связь с огнём и понятна современному читателю; альтернативное понимание отмечено в сноске.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Устойчивое жертвенное выражение обозначает благоухание, угодное Богу. Такая передача сохраняет образ и ясно выражает идею принятия жертвы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не заменяющий его титул; форма «Яхве» является принятой современной русской транслитерацией.
theological_decisions:
- issue: Родовая отнесённость הָאֶזְרָח
  choice: каждый коренной житель
  alternative: каждый коренной мужчина
  rationale: Мужской род единственного числа в еврейском правовом предписании имеет представительное значение и сам по себе не ограничивает норму мужчинами; русский «житель» сохраняет грамматическую форму и общий смысл.
- issue: Значение жертвенного термина אִשֵּׁה
  choice: жертва, сжигаемая на огне
  alternative: пища, приносимая в жертву
  rationale: Точная этимология и оттенок термина спорны. Основной текст передаёт наиболее прозрачное контекстуальное значение, а возможное понимание как жертвенной пищи сохранено в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; его транслитерация сохраняет отличие имени от титула.
translation_notes:
  register: Современный литературный русский с умеренно торжественным тоном правового и культового предписания. Синтаксис упрощён для ясности, но указательные слова и целевая связь исходного текста сохранены.
