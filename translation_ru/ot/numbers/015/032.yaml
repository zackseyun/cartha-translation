  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: ru
  text: Когда сыны Израиля находились в пустыне, они нашли мужчину, собиравшего дрова[a] в субботний день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветки»; возможно, «хворост».'
    reason: Лексическое сочетание מְקֹשֵׁשׁ עֵצִים обозначает собирание кусков древесины; в зависимости от контекста это могут быть ветки или хворост.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: Форма задаёт обстоятельственный фон повествования; «были» естественно передаёт состояние, не подчёркивая наступление нового положения.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет форму еврейского обозначения народа и остаётся понятным в современном литературном русском языке.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В данном контексте слово обозначает незаселённую пустынную местность странствий Израиля; русское «пустыня» является естественным библейским соответствием.
- source_word: וַיִּמְצְאוּ
  choice: они нашли
  rationale: Прямо и естественно передаёт глагол מצא в повествовательном контексте.
- source_word: אִישׁ
  choice: человека
  rationale: В контексте речь идёт об одном мужчине; русское «человека» естественно передаёт это без неопределённого местоимения.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: собиравшего дрова
  rationale: Причастный оборот сохраняет одновременность действия, а «дрова» идиоматично обозначает собираемые куски дерева; возможное более буквальное «ветки» отмечено в сноске.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Передаёт явно выраженное יוֹם («день») и сохраняет простой временной смысл исходной фразы.
theological_decisions:
- issue: Обозначение народа завета בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранный вариант сохраняет форму исходного выражения, не добавляя толкования и не сводя его к более свободному коллективному обозначению.
- issue: Терминология субботы
  choice: в субботний день
  alternative: в субботу
  rationale: Перевод сохраняет существительное «день», явно присутствующее в еврейском тексте, и не добавляет богословского объяснения закона о субботе.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным для повествования; формула «сыны Израиля» сохранена как прозрачное традиционное соответствие исходной форме.
