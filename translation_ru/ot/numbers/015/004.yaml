  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: ru
  text: 'то пусть приносящий своё приношение Яхве принесёт хлебное приношение: одну десятую эфы[a] тонкой муки, смешанной с четвертью гина масла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одну десятую»; в предписаниях о жертвоприношениях подразумевается одна десятая эфы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: то пусть ... принесёт
  rationale: Союз с перфектом продолжает предписание предыдущего стиха; конструкция «то пусть» естественно передаёт последовательность и нормативную силу.
- source_word: הַמַּקְרִיב
  choice: приносящий
  rationale: Причастие породы hифиль обозначает человека, который представляет жертву; субстантивированное причастие сохраняет форму и звучит понятно по-русски.
- source_word: קָרְבָּנוֹ
  choice: своё приношение
  rationale: קָרְבָּן — общее обозначение дара, приносимого Богу; «приношение» точно и уместно в культовом контексте.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не заменяющий его титул; русская форма «Яхве» ясна современному читателю.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В жертвенном законодательстве термин обозначает приношение из муки или зерна; традиционное русское «хлебное приношение» здесь естественнее буквального «зерновое».
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово обозначает высококачественную, тонко смолотую муку; «лучшая мука» передаёт качество без неестественного технического оборота.
- source_word: עִשָּׂרוֹן
  choice: одна десятая эфы
  rationale: Буквально «одна десятая»; в данных предписаниях подразумевается десятая часть эфы. Единица уточнена в тексте и отмечена сноской.
- source_word: בָּלוּל
  choice: смешанной
  rationale: Страдательное причастие описывает муку, смешанную с маслом; согласование с «муки» сохраняет синтаксическую связь.
- source_word: בִּרְבִעִית הַהִין
  choice: с четвертью гина
  rationale: Точно передаёт количество масла и сохраняет древнюю единицу меры.
- source_word: שָׁמֶן
  choice: масло
  rationale: Еврейский текст не уточняет вид масла, поэтому «оливковое» не добавлено.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного культового текста. Сохранены древние меры; синтаксис сделан ясным без устранения процедурного характера стиха.
