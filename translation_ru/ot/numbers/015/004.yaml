  source_fidelity: 'Смысл и структура предписания переданы верно: лицо, приносящее жертву Яхве, должно принести хлебное приношение в указанном количестве, с маслом. «Одна десятая эфы» корректно раскрывает культовое значение עִשָּׂרוֹן, а сноска добросовестно отмечает буквальный текст. Однако סֹלֶת означает тонко смолотую, высококачественную муку; «лучшая мука» смещает значение в сторону оценочного превосходства, тогда как признак помола остаётся невыраженным.'
