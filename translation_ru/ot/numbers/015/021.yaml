  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: ru
  text: От начатка вашего теста отдавайте Яхве приношение[a] из поколения в поколение.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар»; традиционно также: «возношение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вашей квашни» или «вашего сосуда для замешивания»; еврейское слово может означать тесто либо, по смежности, сосуд, в котором его замешивают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: От начатка
  rationale: Слово обозначает первую, начальную долю; в данном обрядовом контексте «начаток» естественно передаёт часть, первой отделяемую от теста.
- source_word: עֲרִסֹתֵיכֶם
  choice: вашего теста
  rationale: Существительное может обозначать тесто или, по смежности, сосуд для замешивания; поскольку отдаётся часть содержимого, в основном тексте выбрано «тесто».
- source_word: תִּתְּנוּ
  choice: отдавайте
  rationale: Обычное значение נתן — «давать». Русский несовершенный вид уместно выражает постоянно действующее предписание, а «отдавайте» естественно сочетается с посвящаемой Яхве долей.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», без замены титулом.
- source_word: תְּרוּמָה
  choice: приношение
  rationale: Термин обозначает отделяемый и посвящаемый Богу дар. «Приношение» ясно передаёт культовый смысл и не вводит технического образа «возношения», не выраженного однозначно в контексте.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Формула указывает на непрерывное действие предписания во всех последующих поколениях; выбран естественный современный русский оборот.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Характер תְּרוּמָה
  choice: приношение
  alternative: возношение
  rationale: Выбран широкий культовый термин, сохраняющий идею посвящённого дара и не утверждающий конкретный жест, который само слово в этом стихе не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно сакральной лексикой. Повеление передано естественно и достойно; подлинная неоднозначность עֲרִסָה учтена в лексическом решении, однако отдельная сноска не добавлена, чтобы не перегружать краткий стих маловероятным в данном контексте значением «квашня».
