base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: ru
  text: Она будет для вас кистью[a]. Глядя на неё, вспоминайте все заповеди Яхве и исполняйте их. Не устремляйтесь вслед за своим сердцем и своими глазами — вслед за которыми вы предаётесь блуду[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бахромой». Еврейское слово обозначает кисть или подобную бахроме связку нитей на краю одежды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не ходите вслед за своим сердцем и вслед за своими глазами». Глагол может означать разведывать, искать или устремляться вслед за чем-либо.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «вслед за которыми вы блудодействуете». Это образ супружеской неверности, обозначающий неверность завету; возможен более мягкий перевод: «вслед за которыми вы уклоняетесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: кисть
  rationale: В контексте речь о кисти из нитей, прикреплённой к краю одежды; «кисть» — ясное и естественное обозначение этого предмета по-русски.
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: Она будет служить вам кистью
  rationale: Передаёт предикативную конструкцию и подразумеваемый в предыдущем стихе предмет, сохраняя назначение кисти.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Глядя на неё
  rationale: 'Естественно выражает последовательную и обстоятельственную связь: вид кисти должен побуждать к воспоминанию.'
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Сохраняет юридический и заветный смысл слова в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно присутствующее в еврейском тексте.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: исполнять их
  rationale: В сочетании с заповедями עשה означает осуществлять или соблюдать их; «исполнять» естественно для русского библейского регистра.
- source_word: תָתֻרוּ
  choice: следуйте
  rationale: В нравственном контексте глагол обозначает движение или устремление вслед за чем-либо; «следовать» сохраняет образ преследования и звучит естественно.
- source_word: לְבַבְכֶם
  choice: прихотям своего сердца
  rationale: «Сердце» сохраняет еврейскую антропологическую образность, а «прихотям» поясняет, что запрещены не внутренние способности как таковые, а самовольные влечения.
- source_word: עֵינֵיכֶם
  choice: тому, что видят ваши глаза
  rationale: Сохраняет телесный образ и делает понятным подразумеваемое следование за тем, что привлекает взгляд.
- source_word: זֹנִים
  choice: изменяя
  rationale: Передаёт образ неверности в отношениях завета без неестественного для современного русского буквального оборота «блудодействовать вслед».
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: изменяя вслед за ними
  rationale: Сохраняет связь относительного оборота с сердцем и глазами, а также метафору неверности и повторяющееся значение «вслед за».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Сила метафоры זנה применительно к неверности завету
  choice: изменяя
  alternative: блудодействуя; уклоняясь
  rationale: «Изменяя» удерживает образ супружеской неверности как метафору нарушения верности завету; «уклоняясь» чрезмерно смягчает образ, а «блудодействуя» здесь звучит тяжеловесно и может быть понято только буквально.
- issue: Объект предостережения в выражении «сердце и глаза»
  choice: прихоти своего сердца и то, что видят глаза
  alternative: своё сердце и свои глаза
  rationale: Формулировка не объявляет сердце и зрение злом сами по себе, но передаёт предупреждение против самовольных внутренних и зрительных влечений.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Синтаксис разбит на три предложения ради ясности. Сохранены личное имя Яхве, образ сердца и глаз и метафора неверности; буквальные и более мягкие варианты вынесены в сноски.
