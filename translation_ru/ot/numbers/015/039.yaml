  verdict: revise
  source_fidelity: 'Черновик верно передаёт кисть, имя Яхве, заповеди и общий образ предостережения. Однако «прихотям» и «тому, что видят ваши глаза» добавляют толкование и заменяют два прямых образа — «сердце» и «глаза». Оборот «изменяя вслед за ними» неясен по-русски: можно понять, будто изменяют самим сердцу и глазам, и он ослабляет прямо выраженный образ блуда.'
  naturalness: Текст в целом литературный, но «изменяя вслед за ними» синтаксически и семантически неудачен. «Не устремляйтесь вслед за своим сердцем и своими глазами» сохраняет образ оригинала и естественно звучит в современном высоком библейском регистре. «Предаётесь блуду вслед за которыми» ясно удерживает метафору, не приписывая конкретный объект неверности, отсутствующий в стихе.
  terminology: «Яхве», «заповеди», «исполняйте» и «кисть» уместны. Следует сохранить «сердце» и «глаза» без поясняющих замен в основном тексте. Метафору זנים следует передать явно; «предаётесь блуду» передаёт её сильнее и точнее, чем общее «изменяя».
