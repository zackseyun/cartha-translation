lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма с последовательным вау вводит новое речевое событие; в современной русской библейской прозе «сказал» естественно передаёт формулу обращения и не требует тяжеловесного «говорил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно выражает адресата речи без отдельного предлога.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание последующей речи; в современном русском эту функцию естественно и без смысловой потери выполняет двоеточие, тогда как буквальное «говоря» звучит менее естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; «Яхве» передаёт наиболее распространённую научную реконструкцию произношения, при этом традиционная замена отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и dignified повествовательная формула. Союз «И» сохраняет связь с предшествующим повествованием, а двоеточие естественно вводит речь следующего стиха.
