  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: ru
  text: По числу жертв, которые вы приносите, так поступайте с каждой из них, сообразно их числу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По числу того, что вы совершаете, так совершайте для каждого, сообразно их числу». Еврейский глагол עשה обычно означает «делать, совершать»; в данном жертвенном контексте основное чтение передаёт его более конкретно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר אֲשֶׁר תַּעֲשׂוּ
  choice: Сколько бы вы ни приготовили
  rationale: Сочетание сравнительного כַּ־ с מִסְפָּר и относительной конструкцией передано естественным русским оборотом, сохраняющим зависимость предписания от числа приготовляемых жертв.
- source_word: תַּעֲשׂוּ
  choice: приготовили / приготовьте
  rationale: Глагол עשה буквально значит «делать, совершать», но в непосредственном контексте жертвоприношений обозначает приготовление требуемых приношений; выбранный вариант делает предмет действия понятным, не меняя его смысла.
- source_word: כָּכָה
  choice: всё это
  rationale: Указательное наречие отсылает к предписанному в предыдущих стихах составу сопутствующих приношений. «Всё это» естественно выражает такую анафорическую отсылку по-русски.
- source_word: לָאֶחָד
  choice: для каждого
  rationale: Буквально «для одного»; в данном счётном контексте форма имеет распределительное значение и относится к каждой отдельной жертве.
- source_word: כְמִסְפָּרָם
  choice: соответственно их числу
  rationale: Сохранены сравнительный смысл предлога כְּ и множественный суффикс «их»; выражение указывает, что предписанные количества повторяются по числу жертв.
