  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: ru
  text: Если это было сделано непреднамеренно и осталось незамеченным общиной, то вся община должна принести одного быка из стада в жертву всесожжения — в благоухание, приятное Яхве, — вместе с положенными при нём хлебным приношением и возлиянием, по установленному порядку, а также одного козла в жертву за грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское חַטָּאת может обозначать жертву, связанную с грехом и ритуальным очищением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: осталось незамеченным общиной
  rationale: Еврейская идиома буквально означает «от глаз общины» и указывает на то, что случившееся ускользнуло от внимания общины.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: это было сделано непреднамеренно
  rationale: שְׁגָגָה обозначает неумышленную ошибку или проступок по неведению, в отличие от сознательного, дерзкого нарушения в ближайшем контексте.
- source_word: כָל הָעֵדָה
  choice: вся община
  rationale: עֵדָה здесь обозначает собранное сообщество Израиля; «община» естественно и точно передаёт это значение.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: одного быка из стада
  rationale: Фраза указывает на быка из крупного скота; перевод сохраняет принадлежность к стаду, не добавляя неявного в тексте точного возраста.
- source_word: לְעֹלָה
  choice: в жертву всесожжения
  rationale: עֹלָה — устойчивое обозначение жертвы, полностью сжигаемой на жертвеннике.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: в благоухание, приятное Яхве
  rationale: Сохранён культовый образ благоухания как выражения угодности приношения Богу.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное заветное имя Бога, а не заменён титулом.
- source_word: וּמִנְחָתוֹ
  choice: вместе с положенным при нём хлебным приношением
  rationale: В жертвенном контексте מִנְחָה означает сопровождающее зерновое, традиционно называемое хлебным, приношение; местоименный суффикс связывает его со всесожжением.
- source_word: וְנִסְכּוֹ
  choice: и возлиянием
  rationale: נֶסֶךְ обозначает сопровождающее жертву жидкое приношение; «возлияние» — точный и устоявшийся русский термин.
- source_word: כַּמִּשְׁפָּט
  choice: по установленному порядку
  rationale: מִשְׁפָּט здесь означает предписанную ритуальную норму или процедуру, а не судебное решение.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: одного козла
  rationale: שְׂעִיר עִזִּים обозначает самца козы; русское «козёл» уже выражает мужской пол.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: Традиционный термин сохраняет явную связь חַטָּאת с грехом, тогда как очистительный аспект отмечен в сноске.
theological_decisions:
- issue: Значение חַטָּאת в священническом жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может обозначать жертву в связи с грехом и одновременно подчёркивать её ритуально-очистительное действие. Основной текст использует понятное традиционное название, а значимая альтернатива сохранена в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передача «Яхве» сохраняет личное заветное имя, непосредственно стоящее в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного и богослужебного контекста. Синтаксис сделан естественным для русского читателя; культовые термины сохранены без конфессионально окрашенных пояснений. Маркер сноски помещён непосредственно после спорного термина.
