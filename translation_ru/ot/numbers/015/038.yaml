base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: ru
  text: Обратись к сынам Израиля и скажи им, чтобы они из поколения в поколение делали себе кисти[a] на углах своих одежд и прикрепляли к кисти на каждом углу синий шнур[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бахрому» (евр. צִיצִת).'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово תְּכֵלֶת обозначает синий или сине-пурпурный краситель и соответствующий цвет, использовавшийся также для священных предметов Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный мужской термин родства в еврейском тексте и при этом соответствует dignified современному библейскому русскому.
- source_word: וְעָשׂוּ לָהֶם
  choice: чтобы они… делали себе
  rationale: Передаёт продолжение повеления после «скажи им» и сохраняет значение לָהֶם — предмет предназначен для самих израильтян.
- source_word: צִיצִת
  choice: кисти
  rationale: В данном контексте слово обозначает свисающие пучки нитей, прикреплённые к одежде. «Кисти» ясно и естественно называет этот предмет; вариант «бахрома» отмечен в сноске.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: на углах своих одежд
  rationale: כָּנָף буквально может означать «крыло», но применительно к одежде обозначает её край или угол. Здесь «углы» наиболее точно соответствует месту прикрепления кистей.
- source_word: לְדֹרֹתָם
  choice: из поколения в поколение
  rationale: Естественно передаёт длительное действие предписания на протяжении последующих поколений.
- source_word: עַל צִיצִת הַכָּנָף
  choice: к кисти на каждом углу
  rationale: Единственное число в еврейском имеет распределительное значение; «на каждом углу» ясно передаёт применение предписания к отдельным кистям.
- source_word: פְּתִיל
  choice: шнур
  rationale: Слово обозначает скрученную нить или шнур; «шнур» передаёт заметную прикреплённую часть кисти.
- source_word: תְּכֵלֶת
  choice: голубой
  rationale: Обозначает цвет красителя, находящийся в синей или сине-пурпурной части спектра. «Голубой» — доступное и традиционно узнаваемое русское обозначение; диапазон оттенка пояснён в сноске.
