  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: ru
  text: И когда будете есть хлеб этой земли, возносите Яхве приношение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отделяйте приношение для Яхве». Буквально еврейское выражение означает «возносите возношение» и относится к дару, отделяемому и посвящаемому Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: И когда будете есть
  rationale: Сочетание וְהָיָה с инфинитивной конструкцией בַּאֲכָלְכֶם вводит будущее временное обстоятельство; по-русски естественно передаётся придаточным с «когда».
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: хлеб этой земли
  rationale: מן здесь имеет партитивный оттенок, который в русском при глаголе «есть» естественно остаётся невыраженным; «этой земли» указывает на землю, о которой говорится в ближайшем контексте.
- source_word: תָּרִימוּ תְרוּמָה
  choice: возносите приношение
  rationale: Однокоренное сочетание רום и תְּרוּמָה относится к культовому представлению отделённого дара. «Возносите приношение» сохраняет образ и звучит достойно, не прибегая к архаичному техническому выражению.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата посвящения, а тетраграмматон передан личным именем «Яхве»; русское управление глагола позволяет обойтись без отдельного предлога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Культовый смысл תָּרִימוּ תְרוּמָה
  choice: возносите приношение
  alternative: представляйте дар
  rationale: Выбранный вариант сохраняет образ «вознесения» дара и его культовый характер, не уточняя способ обряда сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Императив будущего предписания передан формой «возносите»; устранён неестественный для русского партитив «от хлеба».
