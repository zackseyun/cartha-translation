lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: быка из крупного скота
  rationale: פַּר обозначает быка, нередко молодого; בֶּן־בָּקָר буквально «сын крупного скота» и служит идиоматическим уточнением рода животного. Формулировка сохраняет это уточнение без неестественного буквализма.
- source_word: אַיִל
  choice: барана
  rationale: Обычный жертвенный термин для взрослого самца овцы; «баран» — точное и естественное соответствие.
- source_word: כֶּבֶשׂ
  choice: ягнёнка
  rationale: Существительное мужского рода обозначает ягнёнка; в русском слове грамматический род уже передаёт указание на самца без громоздкого «ягнёнка мужского пола».
- source_word: בֶּן שְׁנָתוֹ
  choice: годовалого
  rationale: Еврейское возрастное выражение означает животное одного года или находящееся на первом году жизни; «годовалого» естественно в русском перечне.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» сохраняет традиционный и точный жертвенный термин.
- source_word: אֶחָד
  choice: одного
  rationale: Повторяемое числительное указывает количество каждого животного и последовательно передано в перечне.
