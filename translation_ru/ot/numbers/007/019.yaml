source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: ru
  text: 'Он принёс своё приношение: одно серебряное блюдо[a] весом в сто тридцать сиклей и одну серебряную чашу[b] весом в семьдесят сиклей — по священному сиклю[c]. Оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряная чаша».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «серебряный таз».'
    reason: lexical_alternative
  - marker: c
    text: То есть по принятой при святилище норме веса.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב אֶת קָרְבָּנוֹ
  choice: принёс своё приношение
  rationale: В данном обрядовом контексте форма глагола קרב означает принесение или представление дара перед святилищем. «Принёс своё приношение» естественно по-русски и сохраняет культовый смысл существительного קָרְבָּן.
- source_word: קַעֲרַת כֶּסֶף
  choice: серебряное блюдо
  rationale: קְעָרָה обозначает сравнительно широкий сосуд; «блюдо» уместно в перечне храмовой утвари, при этом возможный вариант «блюдо/чаша» отмечен в сноске.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать сиклей
  rationale: Передаёт явное указание веса и женский суффикс, относящийся к блюду, естественной русской конструкцией.
- source_word: מִזְרָק
  choice: чаша
  rationale: Слово обозначает культовый сосуд, чашу или таз; «чаша» звучит естественно и достойно в контексте священной утвари, а более широкий вариант указан в сноске.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Фраза указывает на установленную при святилище норму веса. Краткая формулировка сохраняет специальный термин без неверного впечатления, будто речь идёт о другом предмете.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Явно передаёт отсылку к двум названным сосудам и устраняет возможную неясность рода в русском языке.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Передаёт значение тщательно размолотой, качественной муки, предназначенной для приношений, понятным современным русским выражением.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Точно и естественно описывает приготовление муки; «масло» в данном древнеизраильском контексте означает оливковое масло, но исходный текст не уточняет это здесь.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает установленное бескровное приношение из муки, а не приношение вообще. Традиционное русское выражение «хлебное приношение» сохраняет эту обрядовую специфику.
