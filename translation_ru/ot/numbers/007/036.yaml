translation_notes:
  register: Современный литературный русский с сохранением достоинства и формальной структуры перечня. Глагол не добавлен, поскольку в еврейском тексте его нет; тире помогает естественно оформить безглагольную конструкцию. Конечная запятая сохраняет незавершённость фразы, продолжающейся описанием приношения в следующем стихе.
