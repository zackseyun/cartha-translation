lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: В пятый день
  rationale: Естественная русская передача обстоятельства времени с порядковым числительным; уточнение «посвящения» отсутствует в еврейском тексте и потому не добавляется.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: В данном контексте слово обозначает признанного главу колена. «Предводитель» ясно передаёт эту функцию и не создаёт монархических ассоциаций слова «князь».
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: сынов Симеона
  rationale: Сохраняет прозрачную связь с буквальной еврейской конструкцией и выражает принадлежность или представительство; более гладкий вариант «симионитян» вынесен в примечание.
- source_word: שְׁלֻמִיאֵל
  choice: Шелумиил
  rationale: Личное имя передано транслитерацией в форме, укоренённой в русской библейской традиции.
- source_word: בֶּן
  choice: сын
  rationale: Стандартная передача еврейской патронимической конструкции.
- source_word: צוּרִישַׁדָּי
  choice: Цуришаддай
  rationale: Личное имя передано транслитерацией в традиционной русской библейской форме; в родительном падеже — «Цуришаддая».
