base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: ru
  text: 'Всего животных для всесожжения: двенадцать быков, двенадцать баранов, двенадцать годовалых ягнят и хлебное приношение к ним; а также двенадцать козлов для жертвы за грех[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для очистительной жертвы». Еврейское слово חַטָּאת может подчёркивать очищение от нечистоты, а также связь жертвы с грехом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: весь скот
  rationale: Передаёт итоговый, собирательный характер перечня. Русское «скот» в данном контексте естественно охватывает перечисленных жертвенных животных, тогда как более узкое «крупный рогатый скот» не соответствовало бы последующему упоминанию баранов и ягнят.
- source_word: לָעֹלָה
  choice: для всесожжения
  rationale: Сохраняет традиционный и понятный русский термин для жертвы, полностью сжигаемой на жертвеннике; предлог передаёт назначение животных.
- source_word: פָּרִים
  choice: быков
  rationale: Обычное обозначение взрослых самцов крупного рогатого скота в жертвенном контексте.
- source_word: אֵילִם
  choice: баранов
  rationale: Прямое и современное соответствие названию жертвенных животных.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: годовалых ягнят
  rationale: Естественно по-русски передаёт указание возраста — ягнята первого года жизни.
- source_word: וּמִנְחָתָם
  choice: и хлебное приношение при них
  rationale: В жертвенном законодательстве מִנְחָה обозначает приношение из зерновых продуктов; местоименный суффикс связывает его с перечисленными животными. Единственное число исходного текста сохранено.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: а также двенадцать козлов
  rationale: Фраза прямо обозначает козлов, то есть самцов коз; «а также» ясно отделяет их от животных для всесожжения.
- source_word: לְחַטָּאת
  choice: для жертвы за грех
  rationale: Это узнаваемый русский термин для данного вида жертвы; возможный оттенок очищения сохранён в сноске.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Еврейское слово может связывать жертву как с грехом, так и с очищением от ритуальной нечистоты. В основном тексте выбран общепринятый и понятный термин, а смысловая альтернатива указана в сноске без устранения напряжения между двумя оттенками.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской жертвенной терминологии. Синтаксис краткий и перечислительный, соответствующий итоговому характеру стиха; архаизмы избегаются.
