  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: ru
  text: И взял Моисей повозки и крупный рогатый скот и отдал их левитам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово собирательно обозначает крупный рогатый скот; в ст. 3 говорится о волах.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение Qal от לקח — «брать, взять»; здесь Моисей принимает переданные для служения предметы.
- source_word: הָעֲגָלֹת
  choice: повозки
  rationale: Существительное עֲגָלוֹת обозначает транспортные повозки; это естественный современный русский эквивалент в данном контексте.
- source_word: הַבָּקָר
  choice: скот
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота. Более узкое «волы» следует из контекста главы, но не выражено самим словом в этом стихе.
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Форма Qal от נתן означает передачу; «отдал» естественно передаёт переход уже принятых Моисеем даров к левитам, не добавляя смысла административного назначения.
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение мужского рода во множественном числе совокупно отсылает к повозкам и скоту.
- source_word: אֶל הַלְוִיִּם
  choice: левитам
  rationale: Русский дательный падеж естественно передаёт направление и получателя при глаголе «отдал».
