  register: Современный литературный русский язык с лаконичным библейским синтаксисом. Начальное «И» сохраняет повествовательную связь еврейской формы wayyiqtol. Более точное собирательное «скот» оставлено в основном тексте, а контекстуальное уточнение «волы» вынесено в примечание.
