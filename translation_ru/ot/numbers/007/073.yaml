  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша весом в семьдесят шекелей — по священному шекелю[b]; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для зернового приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тарелка». Еврейское слово обозначает неглубокий сосуд из храмовой утвари.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по шекелю святилища», то есть по принятому при святилище весовому стандарту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: В культовом контексте קָרְבָּן означает дар, приносимый Богу; «приношение» точно передаёт смысл и сохраняет достоинство стиля.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо[a]
  rationale: קַעֲרָה обозначает неглубокий сосуд; «блюдо» естественно по-русски и подходит к перечню священной утвари. Возможный вариант отмечен в сноске.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Передаёт указанную в еврейском тексте массу сосуда естественной русской конструкцией.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק — храмовый сосуд, связанный с ритуальным употреблением жидкостей; «чаша» здесь понятно и не придаёт предмету бытового оттенка.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: Явно показывает, что число относится к весу чаши, как требует контекст параллельного перечня.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю[b]
  rationale: Фраза указывает на установленный священный весовой стандарт; краткая формулировка естественна в современном русском. Буквальная альтернатива дана в сноске.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Уточнение «сосуда» ясно обозначает референты местоимения и сохраняет смысл еврейской предикативной конструкции.
- source_word: סֹלֶת
  choice: пшеничной мукой тонкого помола
  rationale: סֹלֶת — качественная тонкая мука, обычно пшеничная, предназначенная для приношений; формулировка ясна современному читателю.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: 'Точно и современно передаёт пассивное причастие: мука была перемешана с маслом.'
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает установленное приношение из муки; «хлебное приношение» — понятный традиционный русский культовый термин, не подразумевающий, что здесь уже испечён хлеб.
