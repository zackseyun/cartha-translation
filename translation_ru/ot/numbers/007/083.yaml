  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: ru
  text: А для мирной жертвы[a] — две головы крупного скота, пять баранов, пять козлов и пять годовалых ягнят. Таково было приношение Ахиры, сына Енана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также: «жертва общения» или «жертва благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: а в жертву примирения
  rationale: Союз и предлог продолжают перечень, а זֶבַח сохраняется как «жертва». Традиционное «жертва примирения» передаёт название культовой категории, не сводя его к одному возможному оттенку значения.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; выражение не уточняет пол животных. Счётная конструкция «две головы» естественна по-русски и сохраняет эту неопределённость.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם конкретно обозначает взрослых самцов овец; «бараны» точно и естественно передаёт значение.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, то есть самцов коз; русский термин передаёт пол без громоздкого пояснения.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: כְּבָשִׂים здесь обозначает ягнят мужского пола, а בְּנֵי שָׁנָה указывает на возраст около года. В данном перечне «годовалые ягнята» звучит естественно; грамматический мужской род существительного соответствует исходному обозначению.
- source_word: זֶה קָרְבַּן
  choice: Таково было приношение
  rationale: Формула завершает описание дара. Прошедшее время согласуется с повествовательным контекстом, а «приношение» отличает קָרְבָּן от уже названной жертвы זֶבַח.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Ахиры, сына Енана
  rationale: Имена переданы транслитерацией, а патронимическая конструкция — обычным русским оборотом «сына Енана».
theological_decisions:
- issue: Значение культового термина שְׁלָמִים
  choice: жертва примирения
  alternative: мирная жертва; жертва общения; жертва благополучия
  rationale: Еврейский термин допускает смысловые связи с миром, благополучием и общением. В основном тексте сохранён узнаваемый русский культовый термин, а другие реальные оттенки вынесены в сноску без догматического сужения значения.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для культового перечня. Синтаксис краток и ритмичен; архаизмы исключены. Маркер [a] поставлен непосредственно после связанного с ним выражения.
