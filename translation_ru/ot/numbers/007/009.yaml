  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: ru
  text: 'А сынам Каафа он ничего не дал[a], ведь их обязанностью было служение, связанное со священными предметами: переносить их на плечах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть им не дали ни повозок, ни волов (см. предыдущий стих). Буквально: «ибо служение святыни было на них; на плечах они должны были носить». В этом контексте выражение, вероятно, относится к священным предметам, порученным сынам Каафа.'
    reason: Уточняет подразумеваемое дополнение «ничего» и передаёт лексическую неоднозначность выражения עֲבֹדַת הַקֹּדֶשׁ, не смешивая святыню как место со священными предметами, которые переносили.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: А сынам Каафа
  rationale: Предлог לְ обозначает косвенное дополнение, а בְּנֵי קְהָת — родовую группу. Союз וְ передаёт противопоставление предыдущему распределению даров; по-русски естественно «А».
- source_word: לֹא נָתָן
  choice: он ничего не дал
  rationale: Прямое дополнение подразумевается из контекста предыдущего стиха — повозки и волы. «Ничего не дал» естественно восполняет его, не перегружая текст повтором.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой сынам Каафа не дали повозок и волов.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: служение при святыне
  rationale: עֲבֹדָה означает служение или работу, а הַקֹּדֶשׁ допускает понимание как святыни либо священных предметов. Формулировка сохраняет эту смысловую связь без чрезмерной конкретизации в основном тексте.
- source_word: עֲלֵיהֶם
  choice: на них лежало
  rationale: Сохраняет образную конструкцию еврейского текста и естественно выражает возложенную обязанность по-русски.
- source_word: בַּכָּתֵף
  choice: на плечах
  rationale: Еврейское единственное число имеет распределительное значение; русское множественное число звучит естественно при множественном субъекте.
- source_word: יִשָּׂאוּ
  choice: они должны были носить её
  rationale: Имперфект в контексте выражает установленную обязанность. Местоимение «её» восполняет подразумеваемое дополнение и соотносится со «святыней».
theological_decisions:
- issue: Значение עֲבֹדַת הַקֹּדֶשׁ и подразумеваемого дополнения при יִשָּׂאוּ
  choice: '«служение при святыне: они должны были носить её»'
  alternative: '«служение, связанное со священными предметами: их они должны были носить»'
  rationale: В контексте речь, вероятнее всего, о священных предметах, порученных каафитам, однако выражение הַקֹּדֶשׁ само по себе допускает более широкое обозначение святыни. Основной текст сохраняет компактность и неоднозначность, а примечание поясняет вероятный контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. «Сыны Каафа» сохраняет традиционное родовое обозначение; образ «на них лежало» передаёт еврейскую конструкцию естественно. Местоимение «её» грамматически соотнесено со «святыней», а сноска уточняет вероятную предметную референцию.
