  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: ru
  text: «Возьми их у них, и пусть они будут предназначены для служения при шатре встречи; передай их левитам — каждому сообразно его служению[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждому согласно его служению», то есть предметы следовало распределить между левитами в соответствии с порученным каждому служением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Возьми это у них
  rationale: Императив לקח передаёт прямое повеление Моисею принять принесённые предметы от вождей. Местоимение во множественном числе естественно передано собирательным «это», поскольку из контекста речь идёт о повозках и быках.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: чтобы использовать при служении
  rationale: Буквальная конструкция «и пусть они будут для совершения служения» указывает на назначение неодушевлённых предметов. Инфинитивная конструкция с «использовать» естественно выражает это назначение по-русски, не представляя предметы самостоятельными служителями.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устойчивое и прозрачное обозначение святилища в пустыне; «встреча» сохраняет смысл מוֹעֵד в данном словосочетании.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: и передай левитам
  rationale: נתן означает «дать», но в данном административном контексте «передать» естественно выражает предоставление предметов левитам для исполнения их обязанностей.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: каждому сообразно его служению
  rationale: אִישׁ употреблено дистрибутивно — «каждому»; идиома כְּפִי указывает на соответствие мере и характеру порученной службы. «Сообразно» сохраняет эту связь без чрезмерного истолкования.
