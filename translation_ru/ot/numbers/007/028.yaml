lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: В жертвенном контексте сочетание обозначает самца козы. Русское «козёл» естественно и точно передаёт как вид животного, так и его пол, не требуя буквального и неестественного воспроизведения конструкции «из коз».
- source_word: אֶחָד
  choice: одного
  rationale: Числительное явно присутствует в еврейском тексте и важно в перечне приношений; форма «одного» согласована с винительным падежом слова «козла».
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В перечне жертв חַטָּאת обозначает установленный вид жертвоприношения, а не просто грех как отвлечённое понятие. Оборот «в жертву за грех» ясен и привычен в современном литературном русском.
theological_decisions:
- issue: Значение חַטָּאת в культовом контексте
  choice: жертва за грех
  alternative: за грех; очистительная жертва
  rationale: Непосредственный контекст перечисляет жертвенных животных, поэтому здесь требуется название жертвоприношения. Выражение «жертва за грех» сохраняет связь с грехом, присутствующую в традиционном понимании термина, и не навязывает более узкого толкования функции этой жертвы.
translation_notes:
  register: Краткая формула выдержана в современном литературном и богослужебно уместном регистре. Тире естественно отделяет животное от указания на назначение жертвы.
