lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: одного быка из крупного скота
  rationale: Передаёт единицу в перечне и еврейскую классифицирующую идиому «сын крупного скота» естественным современным русским языком, не добавляя прямо не указанного определения «молодой».
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: אַיִל — обычное обозначение взрослого самца овцы; повтор числительного сохранён в структуре перечня.
- source_word: כֶּבֶשׂ אֶחָד
  choice: одного ягнёнка-самца
