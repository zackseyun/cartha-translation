- source_word: בֶּן שְׁנָתוֹ
  choice: годовалого
  rationale: Естественно передаёт возрастную формулу, буквально «сына своего года»; допустимо также понимание «первого года».
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; предлог לְ передан как указание назначения.
theological_decisions:
- issue: Значение жертвенного термина עֹלָה
  choice: всесожжение
  alternative: жертва всесожжения
  rationale: Краткая форма соответствует перечислительному синтаксису и традиционна в русском библейском языке, при этом не привносит дополнительного толкования.
