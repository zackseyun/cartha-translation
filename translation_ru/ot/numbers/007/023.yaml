  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: ru
  text: а для мирной жертвы — две головы крупного скота[a], пять баранов, пять козлов и пять годовалых ягнят. Это было приношение Нафанаила, сына Цуара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «мирная жертва» можно также передать как «жертва общения» или «жертва благополучия»; таковы возможные смысловые оттенки еврейского слова שְׁלָמִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: а в жертву мирную
  rationale: Предлоги и союз вводят следующий вид приношения в перечне. «Мирная жертва» — традиционный и понятный русский термин для שְׁלָמִים; конструкция сохраняет связь со словом זֶבַח.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота без явного указания пола. Счётное выражение «две головы» естественно по-русски и не добавляет значения «волы».
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם точно обозначает взрослых самцов овец.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתּוּדִים обозначает самцов коз; «козлы» — точный современный русский эквивалент.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: כְּבָשִׂים — ягнята мужского пола, но русское «ягнята» обычно не выражает пол; контекст жертвенного перечня не требует тяжеловесного «ягнят-самцов». בְּנֵי שָׁנָה передано естественным словом «годовалых».
- source_word: זֶה קָרְבַּן
  choice: Это было приношение
  rationale: Формула завершает описание дара. Прошедшее время соответствует повествовательному контексту, а «приношение» отличает общее קָרְבָּן от конкретной жертвы זֶבַח.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Нафанаила, сына Цуара
  rationale: Имена переданы в принятой русской библейской форме; патроним выражен обычной конструкцией «сына Цуара».
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Еврейский термин может связываться с миром, общением и благополучием. В основном тексте сохранён устоявшийся русский культовый термин, а смысловые альтернативы указаны в сноске без догматического сужения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и ритма культового перечня. Использованы понятные традиционные библейские термины без архаической инверсии; подлинная многозначность שְׁלָמִים отражена в сноске.
