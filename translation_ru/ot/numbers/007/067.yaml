  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей, по священному шекелю[c]; оба сосуда были наполнены тонкой мукой, смешанной с маслом, для мучного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тарелка»; еврейское слово обозначает неглубокий сосуд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чаша для кропления»; еврейское слово обозначает ритуальный сосуд.'
    reason: lexical_alternative
  - marker: c
    text: То есть по весовому стандарту, принятому при святилище.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן обозначает дар, приносимый Богу в культовом контексте; «приношение» точно и естественно передаёт термин, не сужая его до конкретного вида жертвы.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קְעָרָה — неглубокий сосуд; «блюдо» естественно для перечня храмовой утвари и сохраняет отличие от следующего сосуда.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Передаёт буквальное указание веса («вес его — сто тридцать») естественной русской конструкцией.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק обозначает ритуальный сосуд; «чаша» ясно и литературно, а примечание отмечает возможную более специальную передачу.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: В контексте параллельного описания сосудов числовая величина обозначает вес; повтор делает это прозрачным по-русски.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Формально сохраняет культовое определение הַקֹּדֶשׁ и означает измерение по принятому при святилище весовому стандарту.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Явно указывает на два ранее названных сосуда и естественно передаёт их состояние.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת — высококачественная, тонко приготовленная мука для приношений; «лучшая мука» понятно современному читателю и не навязывает спорную технологическую детализацию.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно передаёт пассивное причастие от בלל и согласуется с существительным «мука».
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה — бескровное приношение из муки или зерна; традиционно понятное «хлебное приношение» точнее русского общего «дар».
