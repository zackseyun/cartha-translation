  to: И вожди Израиля, главы их родовых домов[a], принесли приношения. Это были вожди колен — те, кто надзирал за исчисленными[b].
  rationale: Исправлена незавершённая русская конструкция с «принесли» путём явного обозначения контекстуально подразумеваемых приношений. Родовая терминология сделана естественнее, а административное значение выражения «стоящие над» передано идиоматичным причастным оборотом. Сноски перенесены к соответствующим выражениям и сохраняют буквальную альтернативу.
