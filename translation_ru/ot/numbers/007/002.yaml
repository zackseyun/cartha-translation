base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: ru
  text: И вожди Израиля, главы их родовых домов[a], принесли приношения. Это были вожди колен — те, кто надзирал за исчисленными[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Родовые дома» — семейно-родовые объединения, ведущие происхождение от общего предка.
    reason: cultural_note
  - marker: b
    text: 'Или: «те, кто стоял над исчисленными». Речь идёт о тех, кто осуществлял надзор за людьми, учтёнными при переписи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: принесли
  rationale: В породе хифиль глагол קרב означает «поднести, представить, принести». В контексте посвящения жертвенника подразумеваются дары, однако дополнение в самом стихе не выражено; поэтому «принесли» сохраняет естественность и не добавляет объект прямо в основной текст.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: вожди Израиля
  rationale: נָשִׂיא обозначает главу или руководителя общины. «Вожди» ясно указывает на племенных руководителей и не создаёт монархической ассоциации слова «князья».
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: главы домов своих отцов
  rationale: Формулировка сохраняет традиционное родовое понятие «дом отца» — патрилинейную семейно-родовую единицу; культурный смысл пояснён в сноске.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Это были вожди колен
  rationale: מַטּוֹת буквально может означать «посохи», но здесь это устойчивое обозначение колен Израиля.
- source_word: הֵם הָעֹמְדִים עַל
  choice: те, кто стоял над
  rationale: Сохранён конкретный образ причастия עמד с предлогом על; в данном контексте выражение передаёт положение надзора или руководства.
- source_word: הַפְּקֻדִים
  choice: исчисленными
  rationale: Форма от פקד обозначает учтённых при переписи. «Исчисленные» сохраняет связь с проведённым учётом, не усиливая без необходимости военный оттенок.
