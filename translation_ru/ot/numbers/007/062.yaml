  rationale: В перечне приношений это небольшая ёмкость для благовоний; «чаша» естественно и достойно передаёт предмет, не прибегая к буквальному «ладонь» или архаичному «ложка».
- source_word: אַחַת
  choice: одна
  rationale: Прямое обозначение количества, согласованное с существительным женского рода «чаша».
- source_word: עֲשָׂרָה זָהָב
  choice: весом в десять шекелей
  rationale: Слово «шекелей» в данной сокращённой строке подразумевается по повторяющейся полной формуле главы; оборот с «весом» ясно показывает, что речь идёт о массе золотого сосуда.
- source_word: זָהָב
  choice: золотая
  rationale: Прилагательное естественно передаёт материал сосуда в русском языке.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Передаёт состояние сосуда и сохраняет согласование формы женского рода.
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В богослужебном контексте обозначает ароматическое вещество для воскурения; множественное число в русском языке идиоматично для вещества такого рода.
