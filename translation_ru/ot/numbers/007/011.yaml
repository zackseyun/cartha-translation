  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Один вождь в день, один вождь в день пусть приносят своё приношение для посвящения жертвенника».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один вождь в день, один вождь в день». Повтор подчёркивает установленную последовательность: вожди колен приносят приношения по одному в день.'
    reason: Сохранение заметного еврейского повтора и пояснение его распределительного смысла.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вайиктоль продолжает повествовательную последовательность; традиционное и естественное русское «И сказал» точно передаёт связь с предыдущим контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В данном контексте это главы колен Израиля; «вождь» обозначает руководителя общины и не привносит монархического смысла слова «князь».
- source_word: אֶחָד לַיּוֹם
  choice: каждый день один; один ... в день
  rationale: Формулировка передаёт распределительное значение и сохраняет подчёркнутый повтор, задающий последовательность приношений.
- source_word: יַקְרִיבוּ
  choice: пусть ... приносит
  rationale: Хифиль от קרב в культовом контексте означает представить или принести приношение. Русское единственное число согласовано с распределительным «один из вождей», хотя в еврейском стоит множественное число, относящееся ко всем вождям.
- source_word: קָרְבָּנָם
  choice: своё приношение
  rationale: Существительное обозначает дар, приносимый Богу; «приношение» сохраняет культовый смысл и естественно сочетается с глаголом «приносить».
- source_word: לַחֲנֻכַּת
  choice: для посвящения
  rationale: Предлог ל выражает цель или связь с событием, а חֲנֻכָּה обозначает торжественное введение в священное употребление.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенника
  rationale: Стандартное русское соответствие обозначению культового алтаря.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное имя и не заменяет его титулом; форма «Иегова» менее соответствует принятой научной реконструкции произношения.
- issue: Число при глаголе יַקְרִיבוּ
  choice: 'Распределительная конструкция в единственном числе: «пусть ... один ... приносит»'
  alternative: 'Буквальное множественное число: «пусть они приносят»'
  rationale: Еврейское множественное число охватывает всех вождей, однако повтор «один вождь в день» требует, чтобы каждый приносил отдельно. Русская конструкция делает этот распределительный смысл ясным, не меняя содержания.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Повтор оригинала частично сохранён, но встроен в естественную русскую синтаксическую конструкцию. Маркер сноски помещён после всей прямой речи.
