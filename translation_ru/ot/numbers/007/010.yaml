  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: ru
  text: И вожди принесли приношение для посвящения жертвенника в день его помазания[a]; вожди принесли своё приношение перед жертвенником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «посвящение жертвенника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: принесли
  rationale: В породе хифиль глагол קרב в культовом контексте означает «поднести, представить, принести». «Принесли» естественно по-русски и подходит к дарам и приношениям.
- source_word: הַנְּשִׂאִים / הַנְּשִׂיאִם
  choice: вожди
  rationale: В книге Чисел נָשִׂיא обозначает глав колен. «Вожди» передаёт их положение без монархического оттенка слова «князья».
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: дары для посвящения жертвенника
  rationale: Буквально выражение означает «посвящение жертвенника», однако объект глагола «принесли» в данном контексте подразумевает дары, связанные с посвящением. Это уточнение делает фразу естественной, а буквальная форма сохранена в сноске.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: в день его помазания
  rationale: Инфинитивная конструкция с בְּ имеет временное значение; русская именная конструкция точно и кратко передаёт указание на день, когда жертвенник был помазан.
- source_word: קָרְבָּנָם
  choice: свои приношения
  rationale: קָרְבָּן — общий термин для дара, подносимого Богу. «Приношения» сохраняет культовый смысл и избегает неясности более широкого слова «дары» во второй части.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: к жертвеннику
  rationale: Буквально לִפְנֵי означает «перед лицом, перед». С глаголом движения русское «к жертвеннику» естественно обозначает принесение и размещение перед ним; пространственное значение не меняется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор слова «вожди» сохранён вслед за еврейским текстом; смысловое различие между дарами посвящения и приношениями передано без добавления конфессиональной терминологии.
