  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ru
  text: одного быка из крупного скота, одного барана, одного годовалого ягнёнка — для всесожжения;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: быка из крупного скота
  rationale: פַּר обозначает быка, а идиоматическое בֶּן־בָּקָר уточняет, что это животное из крупного скота. Такой перевод сохраняет оба элемента еврейского выражения и естественно звучит в перечне приношений.
- source_word: אַיִל
  choice: барана
  rationale: Обычное обозначение взрослого самца овцы, в том числе в жертвенном контексте.
- source_word: כֶּבֶשׂ
  choice: ягнёнка
  rationale: Слово обозначает ягнёнка, обычно мужского пола; в русском языке грамматически мужская форма «ягнёнок» естественно передаёт это значение без избыточного уточнения «самца».
- source_word: בֶּן־שְׁנָתוֹ
  choice: годовалого
  rationale: Еврейская идиома указывает на возраст животного — один год; «годовалого» кратко и естественно для современного русского перечня.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» точно и традиционно передаёт эту жертвенную категорию.
- source_word: אֶחָד
  choice: одного
  rationale: Повторяющееся числительное указывает количество каждого животного и последовательно сохранено в переводе.
