lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: В четвёртый день
  rationale: Предлог בְּ при слове «день» имеет здесь временное значение; порядковое числительное передано естественным русским оборотом.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В книге Чисел слово обозначает официально признанного главу колена; «вождь» сохраняет племенной контекст и не создаёт монархической ассоциации слова «князь».
- source_word: לִבְנֵי רְאוּבֵן
  choice: сынов Рувима
  rationale: Предлог לְ выражает принадлежность или представительство; контекстуально подразумевается вождь сынов Рувима. Формулировка сохраняет семейно-племенной образ еврейского текста.
- source_word: אֱלִיצוּר
  choice: Елицур
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: Стандартная формула отчества в еврейском тексте.
- source_word: שְׁדֵיאוּר
  choice: Шедеур
  rationale: Личное имя передано принятой русской библейской транслитерацией.
