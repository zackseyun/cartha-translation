  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ru
  text: одного быка из стада, одного барана, одного годовалого ягнёнка-самца — для всесожжения;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: быка из крупного скота
  rationale: פַּר обозначает быка, а בֶּן־בָּקָר уточняет его принадлежность к крупному рогатому скоту. Такая передача сохраняет оба элемента и естественно звучит в перечне жертв.
- source_word: אֶחָד
  choice: одного
  rationale: Повтор числительного организует перечень и подчёркивает количество каждого жертвенного животного.
- source_word: אַיִל
  choice: барана
  rationale: Обычное обозначение взрослого самца овцы в жертвенном контексте.
- source_word: כֶּבֶשׂ
  choice: ягнёнка-самца
  rationale: Слово обозначает молодого самца овцы; уточнение пола сохраняет смысл исходного термина.
- source_word: בֶּן שְׁנָתוֹ
  choice: годовалого
  rationale: Еврейское выражение указывает на животное первого года жизни; «годовалого» кратко и естественно передаёт возрастное требование.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленный термин для жертвы, полностью сжигаемой на жертвеннике; «всесожжение» сохраняет традиционную и точную русскую жертвенную лексику.
