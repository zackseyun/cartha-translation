base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ru
  text: А четыре повозки и восемь волов он отдал сынам Мерари — сообразно их служению, под надзором Ифамара, сына Аарона — священника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: повозки
  rationale: Слово обозначает колёсные транспортные средства; «повозки» естественно и уместно в контексте перевозки скинии.
- source_word: הַבָּקָר
  choice: волов
  rationale: В данном контексте речь идёт о тягловых животных для повозок; «волы» точнее общего «скот».
- source_word: נָתַן
  choice: отдал
  rationale: Сохраняет прямое значение глагола «дать», тогда как «распределил» было бы более истолковательным.
- source_word: לִבְנֵי מְרָרִי
  choice: сынам Мерари
  rationale: Сохраняет родовое выражение оригинала и остаётся понятным по-русски.
- source_word: כְּפִי עֲבֹדָתָם
  choice: сообразно их служению
  rationale: Передаёт идиоматическое «в соответствии с» и культово-служебный смысл עֲבֹדָה.
- source_word: בְּיַד אִיתָמָר
  choice: под надзором Ифамара
  rationale: Буквально «рукою Ифамара»; в административном контексте оборот указывает на руководство или надзор.
- source_word: הַכֹּהֵן
  choice: священника
  rationale: Титул синтаксически относится к Аарону в сочетании «Ифамара, сына Аарона, священника»; русская перестановка «сына священника Аарона» ясно передаёт эту связь.
