  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: Его приношением было одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей, по шекелю святилища; оба сосуда были наполнены тонкой мукой, смешанной с маслом, для зернового приношения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряная тарелка»; еврейское слово обозначает широкий неглубокий сосуд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «серебряный таз»; еврейское слово обозначает ритуальный сосуд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן в данном культовом контексте означает дар, приносимый Богу; «приношение» точно передаёт термин и естественно вводит перечень. Союз ו выражен связью с предыдущим контекстом и не требует отдельного «и» в русском стихе.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קַעֲרָה обозначает широкий неглубокий сосуд; «блюдо» естественно и сохраняет отличие от следующей чаши.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Причастная конструкция по-русски ясно и компактно передаёт указанную в еврейском тексте массу сосуда.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק — культовый сосуд, однако его специальная функция в стихе не названа; нейтральное «чаша» не вносит лишнего уточнения.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Фраза указывает на установленный при святилище весовой стандарт. Краткая формулировка сохраняет культовый смысл и привычна для русского библейского регистра.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת означает высококачественную тонкую муку, предназначенную для приношений; «лучшая мука» понятно современному читателю и не создаёт неуместного представления о конкретном современном помоле.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно передаёт пассивное причастие и способ приготовления муки.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает бескровное приношение из муки или зерна; «хлебное приношение» передаёт установленную жертвенную категорию, не подразумевая, что здесь уже был готовый хлеб.
