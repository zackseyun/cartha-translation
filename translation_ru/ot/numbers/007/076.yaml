lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Еврейское сочетание обозначает самца козы. Русское «козёл» естественно, точно и сохраняет вид и пол жертвенного животного.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное передано явно, чтобы сохранить перечислительный, инвентарный строй главы.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает не отвлечённый грех, а жертвоприношение, связанное с очищением от греха и ритуальной нечистоты. Традиционное русское выражение понятно и уместно в данном перечне.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Здесь слово обозначает вид жертвы. Основной вариант сохраняет узнаваемую библейскую терминологию, а примечание отмечает обоснованный перевод «очистительная жертва», не устраняя смысловую широту еврейского термина.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой перечислительной формы жертвенного списка. Форма «одного козла» предполагает синтаксическую зависимость от вводной части полного стиха.
