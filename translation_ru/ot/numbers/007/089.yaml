    issue: Пространственная конструкция «сверху, над ... между двумя херувимами»
    rationale: 'В еврейском тексте источник голоса обозначен двумя последовательными предлогами: «сверху/над крышкой» и «из между двух херувимов». Русское «между» без «из» передаёт лишь положение и ослабляет значение источника; «сверху, над» дублирует один предлог.'
  - severity: medium
    issue: Видо-временное оформление «входил ... слышал»
    rationale: Формы могут выражать повторяемость, но исходный вав-конструктив в данном стихе повествует о входе и последовавшем слышании. «Когда Моисей вошёл ... он услышал» передаёт текст точнее, не добавляя явно «всякий раз».
  - severity: low
    issue: «И он говорил с ним» создаёт нежелательную русскую референциальную двусмысленность
    rationale: Хотя еврейский субъект последнего глагола прямо не назван, ближайший мужской персонаж русского текста — Моисей. Указательное «тот» естественно отсылает к источнику голоса и не требует назвать Господа.
  - severity: low
