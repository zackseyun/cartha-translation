base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: ru
  text: Когда Моисей вошёл в шатёр встречи, чтобы говорить с ним, он услышал голос, говоривший с ним сверху над искупительной крышкой[a] ковчега свидетельства, из среды двух херувимов. И тот говорил с ним.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Искупительная крышка» — особая крышка ковчега; еврейское слово обозначает этот культовый предмет.
    reason: cultural_note
  - marker: b
    text: 'Субъект последней фразы в еврейском тексте прямо не назван. По контексту речь идёт о Господе; грамматически субъектом можно также считать упомянутый голос: «и голос говорил с ним».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Когда Моисей входил
  rationale: Предлог ב с инфинитивом בוא образует временное придаточное. Несовершенный вид «входил» естественно передаёт повторяющуюся ситуацию, подразумеваемую контекстом, не превращая её в явно сформулированное «всякий раз».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Понятное современному читателю обозначение святилища; «встреча» сохраняет смысл назначенного места встречи, а «шатёр» — характер переносного святилища.
- source_word: לְדַבֵּר אִתּוֹ
  choice: чтобы говорить с ним
  rationale: Сохраняется местоимение исходного текста и оттенок общения, выраженный предлогом אֵת; имя собеседника не подставляется в основной текст.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: он слышал голос
  rationale: קוֹל может означать звук или голос, но причастие «говорящий» и контекст откровения указывают здесь на голос.
- source_word: מִדַּבֵּר אֵלָיו
  choice: обращавшийся к нему
  rationale: Так по-русски естественно передаётся голос, который говорит адресату. Формулировка сохраняет направленность речи к Моисею, не называя говорящего прямо.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: сверху, над искупительной крышкой
  rationale: מֵעַל обозначает источник голоса над предметом; כַּפֹּרֶת — особая крышка ковчега, связанная с обрядом очищения и искупления. Выражение понятно без архаического «очистилище».
- source_word: אֲרֹן הָעֵדֻת
  choice: ковчег свидетельства
  rationale: Сохраняется устойчивое библейское обозначение ковчега, связанного со скрижалями свидетельства.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: между двумя херувимами
  rationale: «Херувимы» — закрепившаяся в русском языке передача названия этих небесных существ; исходное מִן выражает место, откуда исходил голос.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: И он говорил с ним
  rationale: Мужской род местоимения позволяет не определять явно, является ли грамматическим субъектом Бог или «голос», и сохраняет местоименную форму и некоторую неоднозначность еврейского текста.
theological_decisions:
- issue: К кому Моисей входил говорить и кто говорит в заключительной фразе
  choice: Сохранены местоимения «с ним» и «он говорил с ним» без замены на имена Бога и Моисея.
  alternative: 'Можно пояснить: «чтобы говорить с Господом… и Господь говорил с Моисеем»; либо понять субъект последней фразы как «голос».'
  rationale: Контекст ясно связывает речь с Божьим присутствием над ковчегом, однако еврейский текст употребляет местоимения и не называет субъект последнего глагола. Эксплицитная подстановка имён устранила бы подлинную синтаксическую неоднозначность.
- issue: Значение כַּפֹּרֶת
  choice: искупительная крышка
  alternative: крышка очищения; крышка примирения; традиционное «очистилище»
  rationale: Предмет является крышкой ковчега и связан с обрядом искупления/очищения. Выбранная форма одновременно обозначает предмет и его культовое значение, не создавая впечатления отдельного сиденья или помещения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегаются архаизмы «скиния» и «очистилище», но сохраняются общеупотребительные библейские термины «ковчег», «свидетельство» и «херувимы». Строчные местоимения помогают не вносить в текст толкование посредством редакционной капитализации.
