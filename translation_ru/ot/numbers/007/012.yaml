  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: ru
  text: В первый день приношение принёс Нахшон, сын Амминадава, от колена Иуды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В первый день представлял своё приношение Нахшон, сын Амминадава, за колено Иуды». Еврейское причастие и предлог перед словами «колено Иуды» допускают оттенки принадлежности и представительства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В первый день … принёс
  rationale: Повествовательная конструкция с וַיְהִי естественно передана русским порядком слов и личной глагольной формой без архаического «и было».
- source_word: הַמַּקְרִיב
  choice: принёс
  rationale: Причастие породы хифиль от קרב обозначает того, кто подносит или представляет приношение; в данном повествовательном контексте совершенный вид звучит естественно.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: в первый день
  rationale: Обычная русская передача еврейского временного оборота с בְּ.
- source_word: אֶת קָרְבָּנוֹ
  choice: приношение
  rationale: קָרְבָּן — культовое приношение; это слово сохраняет религиозный контекст и не сужает значение до одного вида жертвы.
- source_word: נַחְשׁוֹן
  choice: Нахшон
  rationale: Имя транслитерировано с еврейского, с сохранением согласного ח через «х».
- source_word: בֶּן עַמִּינָדָב
  choice: сын Амминадава
  rationale: Естественная и точная русская передача еврейского патронима.
- source_word: לְמַטֵּה יְהוּדָה
  choice: от колена Иуды
  rationale: מַטֶּה здесь означает племенное объединение, традиционно называемое по-русски «коленом»; לְ допускает оттенок принадлежности или представительства, который кратко передаёт «от».
