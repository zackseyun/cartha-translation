  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: ru
  text: В одиннадцатый день — предводитель сынов Асира Пагиил, сын Охрана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: В одиннадцатый день
  rationale: Повтор слова «день» входит в устойчивую повествовательную формулу этой главы; по-русски она естественно передаётся без повтора.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: одиннадцатый
  rationale: В последовательности дней количественная форма еврейского числительного выполняет функцию порядкового числительного.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: Здесь слово обозначает признанного главу колена; «предводитель» понятно современному читателю и не несёт монархического оттенка слова «князь».
- source_word: לִ/בְנֵי אָשֵׁר
  choice: сынов Асира
  rationale: Сохранено еврейское обозначение племенной общности через родство; предлог ל выражает принадлежность или представительство и естественно передаётся русским родительным падежом.
- source_word: פַּגְעִיאֵל
  choice: Пагиил
  rationale: Использована укоренившаяся русская библейская форма личного имени.
- source_word: בֶּן עָכְרָן
  choice: сын Охрана
  rationale: Обычная русская передача еврейского патронима; имя дано в принятой русской библейской форме.
theological_decisions:
- issue: Именная конструкция без выраженного сказуемого
  choice: Сохранить перечислительную конструкцию с тире
  alternative: «В одиннадцатый день предводителем сынов Асира был Пагиил, сын Охрана»
  rationale: В еврейском тексте нет глагола «был»; конструкция продолжает формульный перечень участников посвящения. Тире делает её понятной по-русски, не добавляя утверждения, отсутствующего в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Родовое выражение «сыны Асира» передано как «сынов Асира», а традиционные русские формы имён сохранены.
