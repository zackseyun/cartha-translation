    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне культовых приношений слово обозначает небольшой сосуд для благовоний, а не ладонь. «Чаша» естественно передаёт назначение предмета и не вызывает бытовых ассоциаций, возможных у слова «ложка».
- source_word: אַחַת
  choice: одна
  rationale: Простое количественное числительное, согласованное с существительным женского рода כַּף.
- source_word: עֲשָׂרָה
  choice: весом в десять шекелей
  rationale: В еврейском тексте буквально стоит только «десять», но единица веса подразумевается по повторяющейся формуле приношений в ближайшем контексте. Добавление «шекелей» и слова «весом» естественно раскрывает эллипсис.
- source_word: זָהָב
  choice: золотая
  rationale: Прилагательное естественно и кратко указывает материал сосуда в современном русском языке.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно передаёт признак сосуда и согласуется с «чаша».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В культовом контексте обозначает ароматическое вещество для воскурения; «благовония» — понятный и уместный русский эквивалент.
