base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать сиклей и одна серебряная чаша[b] весом в семьдесят сиклей, по священному сиклю[c]; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряная тарель».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «серебряный таз». Точная форма сосуда неясна.'
    reason: lexical_alternative
  - marker: c
    text: То есть согласно весовому стандарту святилища.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן обозначает подносимое Богу культовое приношение; «приношение» точно и естественно передаёт смысл в данном перечне.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קְעָרָה — сравнительно неглубокий сосуд, блюдо; вариант «блюдо» естественен по-русски, а возможное «блюдо/тарель» отмечено без архаизации.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать сиклей
  rationale: Передаёт еврейскую конструкцию «вес его — сто тридцать» современным русским оборотом и сохраняет единицу веса.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק обозначает культовый сосуд, чашу или таз; «чаша» звучит естественно и достаточно широко, не уточняя форму сверх источника.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят сиклей
  rationale: Явно передаёт подразумеваемый вес второго сосуда и создаёт параллель с первым.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Фраза указывает на установленный при святилище весовой стандарт; краткая формулировка сохраняет культовый термин и поясняется в сноске.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Эксплицитное «сосуда» устраняет неясность местоименной отсылки и естественно передаёт еврейское именное сказуемое.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת — высококачественная тонкая мука для жертвоприношений; «лучшая мука» понятно современному читателю и не навязывает конкретный способ помола.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно передаёт пассивное причастие בלל и звучит естественно в современном русском.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה — бескровное приношение из муки или зерна; традиционно понятное «хлебное приношение» точнее общего «дар» и не предполагает готовый хлеб.
