  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: ru
  text: В двенадцатый день предводителем сынов Неффалима был Ахира, сын Енана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: В двенадцатый день
  rationale: Сочетание предлога ב с יוֹם имеет временное значение, а количественное выражение שְׁנֵים עָשָׂר в этой формуле передаётся по-русски порядковым числительным.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: В контексте израильского колена слово обозначает признанного главу или руководителя; «предводитель» ясно передаёт функцию без монархического оттенка слова «князь».
- source_word: לִבְנֵי נַפְתָּלִי
  choice: сынов Неффалима
  rationale: Предлог ל обозначает здесь отношение предводителя к колену; בְּנֵי сохранено как «сынов», в соответствии с формой еврейского племенного обозначения.
- source_word: אֲחִירַע
  choice: Ахира
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן עֵינָן
  choice: сын Енана
  rationale: Обычная еврейская патронимическая конструкция естественно передаётся по-русски сочетанием «сын Енана».
theological_decisions:
- issue: Родовое обозначение בְּנֵי
  choice: сынов Неффалима
  alternative: потомков Неффалима
  rationale: Мужской множественный термин сохранён буквально как традиционное обозначение колена; контекст не требует нейтрализации рода.
- issue: Синтаксис именной фразы без явной связки
  choice: тире после временного оборота; связка не добавлена
  alternative: «предводителем … был Ахира»
  rationale: Еврейский текст представляет краткую формулу без глагола. Русская конструкция с тире сохраняет её лаконичность и не вводит дополнительного глагольного утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью, соответствующей повторяющейся формуле перечня приношений. Использованы традиционные русские формы библейских имён.
