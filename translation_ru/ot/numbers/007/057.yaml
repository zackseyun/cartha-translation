  language: ru
  text: одного быка из стада[a], одного барана, одного годовалого ягнёнка — для всесожжения;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одного быка, сына крупного скота». Это еврейское выражение указывает на быка из стада крупного рогатого скота; возможный перевод: «одного молодого быка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: одного быка из крупного скота
  rationale: פַּר обозначает быка, а идиоматическое בֶּן בָּקָר уточняет его принадлежность к крупному скоту. Такой перевод сохраняет оба элемента еврейского выражения без буквального «сына стада».
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: אַיִל — обычное обозначение взрослого самца овцы, в том числе в перечнях жертвенных животных.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: одного годовалого ягнёнка
  rationale: כֶּבֶשׂ обозначает ягнёнка, а בֶּן שְׁנָתוֹ — животное первого года жизни, что естественно передаётся словом «годовалый».
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленный жертвенный термин для жертвы, целиком сжигаемой на жертвеннике; предлог לְ указывает назначение перечисленных животных.
