translation_notes:
  register: Современный литературный русский язык с традиционным и понятным библейским термином «всесожжение». Винительный падеж сохраняет синтаксическую связь с окружающим перечнем приношений. Повтор «одного» перед каждым животным отражает структуру еврейского текста.
