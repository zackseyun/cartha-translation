  text: одна золотая чаша весом в десять шекелей[a], наполненная благовониями;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «одна чаша, десять, золото, наполненная благовониями»; слово «шекелей» добавлено по повторяющейся формуле приношений в ближайшем контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне приношений это слово обозначает небольшой сосуд для благовоний, а не ладонь. «Чаша» естественно и достаточно конкретно передаёт культовый сосуд.
- source_word: אַחַת
  choice: одна
  rationale: Количественное числительное согласовано с существительным женского рода «чаша».
- source_word: עֲשָׂרָה
  choice: весом в десять шекелей
  rationale: В еврейском тексте буквально стоит только «десять», однако единица веса подразумевается из повторяющейся формулы и ближайшего контекста. Добавление «весом в… шекелей» делает эллипсис понятным по-русски.
- source_word: זָהָב
  choice: золотая
  rationale: Слово указывает на материал сосуда; в современном русском определение «золотая» звучит естественнее буквального сочетания «чаша из золота» в этом кратком перечне.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Форма описывает содержимое сосуда; причастие сохраняет структуру перечисления и естественно сочетается с творительным падежом.
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В священническом контексте это ароматическое вещество для воскурения. «Благовония» — традиционное и понятное русское соответствие.
