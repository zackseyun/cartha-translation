translation:
  language: ru
  text: одна золотая чаша весом в десять шекелей[a], наполненная благовониями;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одна золотая чаша, десять [шекелей], наполненная благовониями». В еврейском тексте единица веса здесь не названа, но в повторяющейся формуле приношений подразумеваются десять шекелей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне приношений это небольшой сосуд для благовоний, а не буквальная «ладонь». «Чаша» естественно обозначает сосуд и не создаёт ассоциации со столовой ложкой.
- source_word: אַחַת
  choice: одна
  rationale: Простое количественное числительное, согласованное с существительным женского рода «чаша».
- source_word: עֲשָׂרָה
  choice: десять шекелей
  rationale: В еврейском тексте единица веса подразумевается; из повторяющейся формулы этой главы ясно, что речь идёт о десяти шекелях. Единица добавлена для ясности и отмечена сноской.
- source_word: זָהָב
  choice: золотая
  rationale: Передаёт материал, из которого сделан сосуд, в естественной для русского языка форме прилагательного.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Точно и естественно передаёт состояние сосуда; причастная конструкция хорошо сочетается с перечнем приношений.
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В культовом контексте обозначает ароматическое вещество для воскурения; «благовония» — понятный и традиционно уместный русский эквивалент.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, соответствует синтаксису перечня. Слово «шекелей» добавлено для ясности с сохранением формальной неоднозначности в сноске.
