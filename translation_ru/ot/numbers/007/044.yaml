  rationale: Количественное числительное согласовано с существительным женского рода כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: весом в десять сиклей
  rationale: Число при указании золота выражает вес сосуда; единица веса подразумевается и ясна из повторяющейся формулы этой главы.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно передаёт состояние сосуда и согласуется с «чаша».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: Слово обозначает ароматическую смесь для воскурения; множественное число в русском языке идиоматично передаёт вещество собирательно.
