lexical_decisions:
- source_word: פַּר
  choice: бык
  rationale: В жертвенном перечне פַּר обозначает быка или молодого быка; «бык» — точный и естественный русский эквивалент.
- source_word: אֶחָד
  choice: один / одного
  rationale: Повтор числительного сохранён, чтобы передать ритм и точность перечня; падеж обусловлен синтаксическим контекстом списка.
- source_word: בֶּן בָּקָר
  choice: из крупного скота
  rationale: Буквально «сын крупного скота»; это древнееврейское обозначение животного из стада крупного рогатого скота. Перевод передаёт смысл идиомы без неестественного буквализма.
- source_word: אַיִל
  choice: баран
  rationale: Обычное обозначение взрослого самца овцы, в том числе в жертвенных перечнях.
- source_word: כֶּבֶשׂ
  choice: ягнёнок
  rationale: Слово обозначает ягнёнка; грамматический мужской род русского существительного естественно соответствует форме исходного текста, поэтому добавление «самец» избыточно.
- source_word: בֶּן שְׁנָתוֹ
  choice: годовалый
  rationale: Древнееврейская возрастная формула буквально связана с «его годом» и может пониматься как возраст в один год либо пребывание на первом году жизни; краткое «годовалый» естественно для русского жертвенного перечня, а альтернатива отмечена в сноске.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, полностью сжигаемой на жертвеннике; предлог לְ естественно передан словом «для».
