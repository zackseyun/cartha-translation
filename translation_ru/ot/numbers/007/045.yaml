lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: один бык из крупного скота
  rationale: פַּר обозначает быка, особенно в жертвенном контексте; בֶּן בָּקָר уточняет, что это животное из крупного скота. Такой перевод сохраняет и вид животного, и структуру перечня.
- source_word: אַיִל אֶחָד
  choice: один баран
  rationale: אַיִל — обычное обозначение взрослого самца овцы; повторение «один» передаёт повторяющееся אֶחָד.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: один годовалый ягнёнок
  rationale: כֶּבֶשׂ обозначает ягнёнка мужского пола, что в русском обычно естественно выражается словом «ягнёнок»; идиома בֶּן שְׁנָתוֹ указывает на возраст животного — один год.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленный термин для жертвы, целиком сжигаемой на жертвеннике; «для всесожжения» естественно вписывается в перечень приношений.
