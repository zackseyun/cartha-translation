lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: повозки
  rationale: Слово עֲגָלָה обозначает повозку для перевозки грузов; этот вариант естественен по-русски и соответствует контексту перевозки частей скинии.
- source_word: הַבָּקָר
  choice: головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота. Счётная конструкция «четыре головы крупного скота» передаёт число, не уточняя пол и не вводя более узкое значение «волы» в основной текст.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: сынам Гирсона
  rationale: Сохранена буквальная родовая формула «сынам Гирсона»; в русском библейском контексте она понятна и не требует замены на этноним.
- source_word: כְּפִי עֲבֹדָתָם
  choice: в соответствии с их служением
  rationale: Идиома כְּפִי передаёт соответствие порученной работе, а עֲבֹדָה здесь означает служение или обязанность при скинии.
- source_word: נָתַן
  choice: он отдал
  rationale: Глагол נתן имеет простое значение «дать». «Отдал» естественно описывает передачу выделенных повозок и животных, не добавляя смысла официального назначения.
