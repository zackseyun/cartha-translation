  source_fidelity: Текст точно передаёт итоговый характер וְכֹל, собирательное בָּקָר с последующим перечнем быков, все числительные и виды животных, а также указание на ягнят годовалого возраста. «После его помазания» корректно сохраняет временную конструкцию אַחֲרֵי הִמָּשַׁח אֹתוֹ и не добавляет невыраженного деятеля; «его» естественно соотносится с жертвенником.
