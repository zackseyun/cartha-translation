id: NUM.7.88
reference: Numbers 7:88
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: ru
  text: 'А всего скота для мирной жертвы[a] было: двадцать четыре быка, шестьдесят баранов, шестьдесят козлов и шестьдесят годовалых ягнят. Таково было посвящение жертвенника после его помазания.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; или: «жертвы благополучия».'
    reason: Лексема שְׁלָמִים допускает оттенки мира, общения и благополучия, которые невозможно одновременно выразить одним кратким русским термином.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: А всего скота
  rationale: Передаёт соединительное וְ, итоговый характер כֹל и собирательное значение בְּקַר; по-русски естественно вводит суммарный перечень.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: для мирной жертвы
  rationale: «Мирная жертва» — узнаваемое и достаточно буквальное русское наименование данной жертвенной категории; возможные смысловые оттенки отмечены в сноске.
- source_word: פָּרִים
  choice: быка
  rationale: В жертвенном контексте обозначает быков; еврейский текст не требует добавления «молодых».
- source_word: אֵילִם
  choice: баранов
  rationale: Обычное современное русское соответствие для взрослых самцов овец.
- source_word: עַתֻּדִים
  choice: козлов
  rationale: Точно передаёт указание на самцов коз и звучит естественно по-русски.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: годовалых ягнят
  rationale: Кратко и естественно сохраняет указание на возраст жертвенных животных.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: посвящение жертвенника
  rationale: Не добавляет отсутствующего в еврейском тексте слова «приношение» и сохраняет возможную отнесённость выражения как к обряду, так и к перечисленным дарам.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: после его помазания
  rationale: Естественно передаёт временное отношение и не вводит не названного в исходном тексте деятеля.
theological_decisions:
- issue: Передача названия жертвенной категории שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Традиционное русское выражение сохраняет связь с корнем, несущим оттенки мира, целостности и благополучия, но не исчерпывает их; поэтому допустимые альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Итоговый перечень оформлен двоеточием для ясности; числительные даны словами. Формула «Таково было» естественно подводит итог, не усиливая смысл сверх оригинала.
