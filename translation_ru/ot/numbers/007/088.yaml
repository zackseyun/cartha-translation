  terminology: «Мирная жертва» — устойчивое и понятное русское обозначение זֶבַח הַשְּׁלָמִים. Сноска с альтернативами уместно отражает лексические оттенки, не навязывая богословского истолкования. «Жертвенник», «бараны», «козлы» и «годовалые ягнята» употреблены точно и последовательно.
