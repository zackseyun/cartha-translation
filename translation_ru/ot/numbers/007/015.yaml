  text: один бык из крупного скота, один баран, один годовалый ягнёнок — для всесожжения;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: бык из крупного скота
  rationale: פַּר обозначает быка, а בֶּן־בָּקָר уточняет его принадлежность к крупному рогатому скоту. Такой перевод сохраняет оба элемента еврейского выражения без буквального и неестественного «сын стада».
- source_word: אַיִל
  choice: баран
  rationale: Обычное обозначение взрослого самца овцы, естественное в перечне жертвенных животных.
- source_word: כֶּבֶשׂ
  choice: ягнёнок
  rationale: Слово обозначает ягнёнка и в данном жертвенном контексте относится к самцу; грамматический род русского существительного и контекст позволяют не добавлять тяжеловесное «самец».
- source_word: בֶּן שְׁנָתוֹ
  choice: годовалый
  rationale: Еврейская идиома указывает на животное первого года жизни; «годовалый» — краткое и естественное русское соответствие.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» сохраняет традиционный и понятный библейский термин.
- source_word: אֶחָד
  choice: один
  rationale: Повторяющееся числительное перед каждым животным сохранено, чтобы передать точный перечень и ритм исходного текста.
