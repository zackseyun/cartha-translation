lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне приношений это слово обозначает небольшой сосуд, а не ладонь. «Чаша» естественно звучит по-русски и подходит для вместилища благовоний.
- source_word: אַחַת
  choice: одна
  rationale: Простое количественное числительное, согласованное с существительным женского рода «чаша».
- source_word: עֲשָׂרָה זָהָב
  choice: весом в десять шекелей
  rationale: Слово «шекелей» в еврейском тексте опущено, однако единица веса подразумевается формулой перечня в соседних стихах. Указание «весом» ясно передаёт функцию числительного и не создаёт впечатления количества сосудов.
- source_word: זָהָב
  choice: золотая
  rationale: Передаёт материал сосуда; русское относительное прилагательное здесь естественнее конструкции «из золота».
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно описывает содержимое сосуда и сохраняет значение «полная».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В культовом контексте означает ароматическое вещество для воскурения. «Благовония» — понятное и традиционно уместное русское обозначение.
