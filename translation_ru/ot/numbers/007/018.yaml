  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: ru
  text: На второй день своё приношение представил Нафанаил, сын Цуара, вождь Иссахара.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «представил»; слова «своё приношение» добавлены по повторяющемуся контексту Чисел 7, где каждый вождь колена представляет приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: На второй день
  rationale: Предлог ב с существительным יוֹם и порядковым числительным естественно передаётся временным оборотом «на второй день»; дополнение «посвящения» в самом стихе отсутствует.
- source_word: הִקְרִיב
  choice: своё приношение представил
  rationale: Форма хифиль от קרב в культовом контексте означает «представить, принести»; подразумеваемое прямое дополнение восстановлено из повторяющейся формулы главы и отмечено сноской. Порядок слов позволяет ясно связать действие с Нафанаилом.
- source_word: נְתַנְאֵל
  choice: Нафанаил
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶּן צוּעָר
  choice: сын Цуара
  rationale: Естественная русская передача стандартной конструкции родства без лишнего предлога.
- source_word: נְשִׂיא
  choice: вождь
  rationale: В контексте колен Израиля слово обозначает официального главу колена. «Вождь» точно и кратко передаёт статус, не создавая монархических ассоциаций слова «князь».
- source_word: יִשָּׂשכָר
  choice: Иссахар
  rationale: Использована устоявшаяся русская библейская форма названия колена.
