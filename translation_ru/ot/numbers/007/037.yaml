  variant: modern literary Russian
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей, по шекелю святилища[c]; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «широкая чаша»; еврейское קְעָרָה обозначает неглубокий сосуд — блюдо или чашу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чаша для кропления»; еврейское מִזְרָק в других местах обозначает культовый сосуд, использовавшийся при кроплении.'
    reason: lexical_alternative
  - marker: c
    text: То есть согласно норме веса, принятой при святилище.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן обозначает дар, приносимый Богу в контексте богослужения; «приношение» точно и естественно передаёт смысл без ненужного уточнения вида жертвы.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קְעָרָה может обозначать блюдо, широкую чашу или неглубокий сосуд; «блюдо» уместно для перечня предметов святилища, а неоднозначность отмечена в сноске.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Естественная русская конструкция ясно передаёт еврейское «вес его — тридцать и сто».
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק — культовый сосуд, чаша или таз, в иных контекстах употребляемый для кропления; нейтральное «чаша» не навязывает здесь конкретную функцию.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: Контекст указывает на вес чаши; явное выражение этого отношения естественно по-русски.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Фраза указывает на нормативную меру веса, принятую при святилище; традиционная формулировка сохраняет культовую окраску, а смысл пояснён в сноске.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: שְׁנֵיהֶם относится к двум названным сосудам; добавление «сосуда» делает связь однозначной и естественной для русского текста.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת обозначает высококачественную тонко смолотую муку, употреблявшуюся в приношениях; «лучшая мука» понятно современному читателю и передаёт качественный оттенок термина.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно и естественно передаёт приготовление муки путём смешивания с маслом.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает приношение из муки или зерна; «хлебное приношение» — понятный русский библейский термин, не предполагающий, что содержимое уже было выпеченным хлебом.
