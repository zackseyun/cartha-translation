lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Еврейское сочетание обозначает самца козы. В современном русском «козёл» ясно и естественно передаёт пол и вид жертвенного животного.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное непосредственно указывает количество и сохраняет повторяющийся перечневый стиль главы.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В данном жертвенном перечне חַטָּאת обозначает жертву за грех, а предлог לְ выражает назначение приношения. Такая формулировка естественна по-русски и точно передаёт культовый смысл.
theological_decisions:
- issue: Передача חַטָּאת в контексте жертвоприношения
  choice: жертва за грех
  alternative: за грех
  rationale: Контекст перечня приношений требует названия вида жертвы, а не отвлечённого обозначения греха. При этом перевод не уточняет сверх текста характер действия этой жертвы.
translation_notes:
  register: Современный литературный русский; краткая именная конструкция сохраняет форму перечня и торжественно-деловой ритм главы.
