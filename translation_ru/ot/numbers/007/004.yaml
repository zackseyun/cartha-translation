lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма глагола אמר вводит очередное событие повествования; союз ו передан естественным русским «И».
- source_word: יְהוָה
  choice: Господь
  rationale: Тетраграмматон передан традиционным русским соответствием «Господь», узнаваемым и уместным в современном литературном библейском тексте.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русское управление глагола «сказать» требует дательного падежа и естественно передаёт еврейскую конструкцию с אֶל.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В этой формуле инфинитив «говоря» вводит последующую прямую речь; в современном русском ту же функцию естественно и точно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана традиционная русская передача, не утверждающая спорную реконструкцию произношения и согласующаяся с общеупотребительным библейским регистром.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Краткая формула сохранена; буквальное «говоря» функционально передано двоеточием как естественным введением следующей речи.
