base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: ru
  text: А для мирной жертвы[а] — две головы крупного рогатого скота, пять баранов, пять козлов и пять годовалых ягнят. Таково приношение Ахиезера, сына Аммишаддая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «жертва общения»; «жертва благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: а для мирной жертвы
  rationale: Сочетание וּלְ вводит заключительный вид приношения в перечне. «Мирная жертва» — традиционный и понятный русский культовый термин для זֶבַח שְׁלָמִים; форма единственного числа передаёт еврейское название вида жертвы.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного рогатого скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота без указания пола. Счётная конструкция «две головы» естественна по-русски и не вносит отсутствующего в оригинале уточнения.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם однозначно обозначает взрослых самцов овец в жертвенном перечне.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, то есть самцов коз; «козлов» — точный и естественный современный русский эквивалент.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: Буквально «пять ягнят, сынов года»; «годовалых ягнят» естественно передаёт установленный возраст животных, не утяжеляя фразу.
- source_word: זֶה קָרְבַּן
  choice: Таково приношение
  rationale: Именная формула буквально означает «это приношение». Настоящее время в русском не требует связки; «таково» естественно завершает повторяющийся перечень и сохраняет указательный характер формулы.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ахиезера, сына Аммишаддая
  rationale: Имена переданы русской библейской транслитерацией; בֶּן прямо передано словом «сына».
theological_decisions:
- issue: Значение жертвенного термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин допускает смысловые ассоциации с миром, благополучием и совместной трапезой, однако в русском библейском употреблении «мирная жертва» является узнаваемым названием данного вида жертвоприношения. Стих не требует выбора одной богословской интерпретации назначения жертвы.
translation_notes:
  register: Современный литературный русский с достоинством культового контекста. Синтаксис краток и следует структуре еврейского перечня; архаизмы и необоснованное уточнение пола крупного рогатого скота исключены.
