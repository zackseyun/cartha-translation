base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: ru
  text: и для мирной жертвы[a] — две головы крупного скота[b], пять баранов, пять козлов и пять годовалых ягнят. Таково было приношение Елишамы, сына Аммиуда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский термин можно также передать как «жертва общения» или «жертва благополучия»; такая жертва обычно включала совместную священную трапезу и выражала мир, благополучие или целостность.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает крупный рогатый скот; иногда его переводят более конкретно: «два быка» или «два вола».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: и в мирную жертву
  rationale: Предлоги и союз вводят следующий вид приношения. «Мирная жертва» — краткий и узнаваемый русский термин для שְׁלָמִים; примечание сохраняет более широкие смысловые оттенки общения, благополучия и целостности.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; формулировка не уточняет пол животных сверх еврейского текста и естественно передаёт счёт в русском языке.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם в жертвенном перечне однозначно обозначает баранов.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает самцов коз и требует сохранения указания на пол.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: בְּנֵי שָׁנָה — идиоматическое обозначение возраста «годовалые». Слово כְּבָשִׂים передано нейтральным «ягнята», без добавочного уточнения пола, которое в данной форме перечня не следует делать обязательным.
- source_word: זֶה קָרְבַּן
  choice: Таково было приношение
  rationale: Безглагольная конструкция подводит итог перечислению. Прошедшее время естественно для повествовательного контекста, а «приношение» точно передаёт קָרְבַּן.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Елишамы, сына Аммиуда
  rationale: Имена переданы принятой русской библейской транслитерацией; патроним выражен естественной конструкцией «сына Аммиуда».
theological_decisions:
- issue: Смысл термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения / жертва благополучия
  rationale: Основной текст сохраняет привычный культовый термин, а примечание сообщает о реальной широте еврейского понятия, не сводя его к одной богословской трактовке.
translation_notes:
  register: Современный литературный русский с достоинством культового перечня. Синтаксис сделан плавным и ясным; тире отделяет перечень. Все смысловые уточнения, не обязательные по еврейскому тексту, вынесены в примечания.
