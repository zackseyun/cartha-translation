  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей по священному шекелю; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряная миска». Еврейское слово קַעֲרָה обозначает сосуд, точная форма которого не вполне ясна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «серебряная кропильная чаша». Еврейское слово מִזְרָק может указывать на ритуальное назначение сосуда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: его приношение
  rationale: קָרְבָּן обозначает дар, приносимый Богу; «приношение» естественно и точно передаёт жертвенный контекст.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קַעֲרָה обозначает сосуд, вероятно неглубокий; «блюдо» сохраняет вероятную форму, не приписывая ему более узкой ритуальной функции.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Передаёт буквальное указание на вес сосуда и звучит естественно по-русски.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק — ритуальный сосуд, в том числе связанный с использованием крови; нейтральное «чаша» не конкретизирует функцию сверх сказанного в стихе.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: Явно показывает, что число обозначает вес второго сосуда.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Это краткая и понятная передача установленного при святилище весового стандарта.
- source_word: שְׁנֵיהֶם
  choice: оба сосуда
  rationale: Явно относит описание содержимого к двум названным предметам, как и еврейское местоимение.
- source_word: מְלֵאִים
  choice: были наполнены
  rationale: Естественно передаёт состояние обоих сосудов и согласуется с последующим обозначением содержимого.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Слово обозначает высококачественную мелко смолотую муку для жертвоприношений; этот вариант понятнее современному читателю, чем архаическое «лучшая мука».
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно передаёт пассивное причастие и способ приготовления муки.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает установленный вид приношения из муки или зерна; «хлебное приношение» сохраняет название жертвенной категории.
