  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: ru
  text: И для мирной жертвы[a] — две головы крупного рогатого скота[b], пять баранов, пять козлов и пять годовалых ягнят. Вот приношение[c] Гамлиэля, сына Педацура.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «жертва общения» или «жертва благополучия».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «две [головы] крупного скота»; традиционный вариант: «два вола».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «это приношение»; в еврейском глагол отсутствует.'
    reason: source_structure
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: И для мирной жертвы
  rationale: Сочетание וּלְ продолжает перечень даров, а זֶבַח обозначает закланную жертву. Традиционный русский термин «мирная жертва» узнаваем и сохраняет связь שְׁלָמִים с миром и благополучием, не сводя значение только к общению участников трапезы.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного рогатого скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; такая передача не сужает значение до волов как рабочих или кастрированных животных.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם прямо обозначает взрослых самцов овец.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, то есть самцов коз; «козлы» — точная и естественная современная русская передача.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: Выражение «сыны года» указывает возраст животных; «годовалые ягнята» естественно и кратко передаёт это требование.
- source_word: זֶה קָרְבַּן
  choice: Вот приношение
  rationale: В еврейском это безглагольная указательная формула. «Вот приношение» сохраняет её номинальный характер и не навязывает настоящего или прошедшего времени.
- source_word: גַּמְלִיאֵל
  choice: Гамлиил
  rationale: Имя передано непосредственно с еврейской формы Гамлиэль с русской именной адаптацией, без опоры на греческую форму «Гамалиил».
- source_word: בֶּן פְּדָה־צוּר
  choice: сына Педацура
  rationale: בֶּן передано обычным родственным обозначением «сын», а פְּדָה־צוּר транслитерировано как «Педацур».
theological_decisions:
- issue: Смысл термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Еврейский термин допускает смысловые оттенки мира, благополучия и совместной жертвенной трапезы. Основной текст использует традиционный широкий термин, а примечание сохраняет существенные альтернативы.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Перечневая структура оригинала сохранена; громоздкость точного обозначения בָּקָר оправдана необходимостью не сужать вид и пол животных. Формула «Вот приношение» естественно передаёт еврейское безглагольное предложение.
