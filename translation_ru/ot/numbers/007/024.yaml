  rationale: Обычная для современного русского языка передача временной формулы с предлогом בְּ и порядковым числительным.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В контексте Чисел слово обозначает официального главу племени; «вождь» передаёт этот статус без монархического оттенка слова «князь».
- source_word: לִבְנֵי זְבוּלֻן
  choice: сынов Завулона
  rationale: Предлог לְ здесь выражает принадлежность или представительство, а בְּנֵי сохраняет родословно-племенное обозначение; по-русски конструкция естественно зависит от слова «вождь».
- source_word: אֱלִיאָב
  choice: Елиав
  rationale: Традиционная и узнаваемая русская библейская передача личного имени.
- source_word: בֶּן חֵלֹן
  choice: сын Хелона
  rationale: Естественная русская передача еврейской патронимической формулы.
