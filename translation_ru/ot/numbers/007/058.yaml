translation:
  language: ru
  text: одного козла в жертву за грех;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское слово חַטָּאת может обозначать жертву, связанную с очищением от греха и ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание буквально обозначает самца из коз; русское «козёл» естественно и точно передаёт пол жертвенного животного.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное сохранено явно, что соответствует повторяющемуся перечислительному строю Чисел 7.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает особый вид приношения; предлог לְ выражает назначение. Традиционное и понятное выражение «в жертву за грех» сохраняет культовый смысл, а возможный очистительный оттенок отмечен в сноске.
theological_decisions:
- issue: Передача жертвенного термина חַטָּאת
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин может связывать приношение как с грехом, так и с устранением ритуальной нечистоты. В перечне несомненно имеется в виду жертва; основной перевод использует узнаваемое выражение, не устраняя альтернативный оттенок, вынесенный в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая именная формула сохраняет структуру жертвенного перечня и его повторяемость.
