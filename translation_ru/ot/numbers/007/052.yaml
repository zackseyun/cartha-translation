lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание обозначает самца козы. Русское «козёл» естественно передаёт и вид животного, и его пол; буквальное воспроизведение множественного עִזִּים было бы неестественным.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное явно указывает количество в перечне приношений; форма «одного» сохраняет инвентарный характер текста.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В данном жертвенном контексте חַטָּאת обозначает установленную жертву за грех, а не грех как абстрактное понятие. Предлог לְ передан естественной русской конструкцией назначения.
