    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В контексте приношений это небольшой ритуальный сосуд для благовоний. «Чаша» естественно звучит по-русски и, в отличие от буквального «ложка», не создаёт образ обычного столового прибора.
- source_word: אַחַת
  choice: одна
  rationale: Количественное числительное согласовано с существительным женского рода «чаша».
- source_word: עֲשָׂרָה זָהָב
  choice: золотая… весом в десять шекелей
  rationale: В еврейском тексте единица веса опущена, но подразумевается устойчивой формулой приношений в Числах 7. Слово «золотая» передаёт материал сосуда, а добавление «весом в… шекелей» ясно выражает эллиптическую конструкцию.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно передаёт состояние сосуда и согласуется с «чаша».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В культовом контексте обозначает ароматическое вещество для воскурения; «благовония» — ясный и традиционный русский эквивалент.
