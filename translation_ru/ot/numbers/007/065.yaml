  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: ru
  text: а для мирной жертвы[a] — две головы крупного рогатого скота, пять баранов, пять козлов и пять годовалых ягнят. Это приношение Авидана, сына Гидеони.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва общения»; возможно также: «жертва благополучия».'
    reason: Лексема שְׁלָמִים имеет широкое смысловое поле, связанное с миром, целостностью, благополучием и общением.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: а в мирную жертву
  rationale: Союз и предлог связывают перечень с предыдущим стихом, а זֶבַח обозначает жертвоприношение. «Мирная жертва» — краткий и узнаваемый русский культовый термин; смысловое поле שְׁלָמִים отмечено в сноске.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота без явного указания пола. Такая передача сохраняет эту неопределённость и естественно звучит в перечне животных.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם точно обозначает взрослых самцов овец; «бараны» — обычный современный русский эквивалент.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает самцов коз; «козлы» точно и естественно передаёт значение.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: Выражение בְּנֵי שָׁנָה указывает на возраст около одного года; «годовалые ягнята» естественно передаёт эту характеристику. Грамматический мужской род כְּבָשִׂים не требует неестественного уточнения пола по-русски.
- source_word: זֶה קָרְבַּן
  choice: Это приношение
  rationale: Именная формула не выражает времени явно. Настоящая констатирующая формула «Это приношение» сохраняет структуру еврейского текста без добавления прошедшего времени.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Авидана, сына Гидеони
  rationale: Имена переданы в принятой русской библейской форме, а патронимическая конструкция בֶּן — словом «сын».
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин допускает акценты на мире, благополучии и общении при жертвенной трапезе. Основной текст использует традиционно узнаваемое обозначение, а сноска сохраняет смысловую широту и не закрепляет единственное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством культового перечня. Синтаксис краток и ритмичен; тире вводит состав жертвы. Устаревшие формы вроде «овны» и чрезмерно специальные формулировки исключены.
