lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: В седьмой день
  rationale: Предлог בְּ с существительным יוֹם и порядковым числительным образует обычное обстоятельство времени; этот перевод естественен и точен по-русски.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: В Числах 7 слово обозначает главу племени, приносящего дар. «Предводитель» передаёт руководящую и представительскую роль, не вызывая монархических ассоциаций слова «князь».
- source_word: לִבְנֵי אֶפְרָיִם
  choice: сынов Ефрема
  rationale: Предлог לְ выражает отношение либо представительство при נָשִׂיא. Формулировка сохраняет родовое обозначение בני и привычно звучит в библейском повествовании.
- source_word: אֱלִישָׁמָע
  choice: Елисама
  rationale: Имя передано в форме, принятой в русской библейской традиции.
- source_word: בֶּן עַמִּיהוּד
  choice: сын Аммиуда
  rationale: Стандартная еврейская патронимическая конструкция передана естественным русским соответствием.
