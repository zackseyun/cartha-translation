  source_fidelity: 'Основной смысл передан верно: названы два серебряных сосуда, их масса указана по стандарту святилища, и оба наполнены мукой с маслом для хлебного приношения. Однако סֹלֶת означает тонкую, тщательно просеянную муку, а не просто «лучшую»; это различие следует отразить в основном тексте. Формулу בְּשֶׁקֶל הַקֹּדֶשׁ точнее передать как «по шекелю святилища», не превращая определение в потенциально двусмысленное «священный шекель».'
