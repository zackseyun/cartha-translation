base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей, по шекелю святилища[c]; оба были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тарелка»; еврейское слово קַעֲרָה обозначает блюдо или плоскую ёмкость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «таз»; מִזְרָק — ритуальный сосуд.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «по шекелю святилища», то есть по весовому стандарту, принятому при святилище.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: В культовом контексте קָרְבָּן обозначает приношение, которое подносят Богу; «приношение» точно и естественно передаёт этот смысл.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קַעֲרָה обозначает широкую посуду типа блюда; «блюдо» естественно для храмовой утвари и не уточняет форму сверх текста.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Передаёт явно указанную массу сосуда естественной современной русской конструкцией.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק — ритуальный сосуд, вероятно чаша или таз; «чаша» сохраняет общий предметный смысл без добавления предполагаемого назначения.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: В контексте перечня сосудов фраза указывает массу второй ёмкости.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Устойчивая формула означает измерение по принятому при святилище стандарту; краткий перевод сохраняет формулировку источника, а сноска поясняет её.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Явно сохраняет указание на оба предмета и естественно связывает их с содержимым.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת — высококачественная тонкая мука для приношений; «лучшая мука» — ясный и традиционно понятный русский эквивалент.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Прямо передаёт пассивное причастие и способ приготовления муки.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает бескровное приношение из зерновых продуктов; «хлебное приношение» является понятным русским культовым термином, хотя речь идёт здесь о муке.
