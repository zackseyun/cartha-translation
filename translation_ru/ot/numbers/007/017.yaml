base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: ru
  text: 'и для мирной жертвы[a]: две головы крупного рогатого скота, пять баранов, пять козлов и пять годовалых ягнят. Таково приношение Нахшона, сына Амминадава.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва общения» или «жертва благополучия». Еврейский термин обозначает жертву, часть которой обычно съедали на общей жертвенной трапезе.'
    reason: Лексические альтернативы передают оттенки культового термина שְׁלָמִים, не сводимого только к современному смыслу слова «мир».
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: и в жертву мирную
  rationale: Предлоги и конструкция вводят следующий вид жертвы в перечне. «Мирная жертва» — традиционный и понятный русский культовый термин, сохраняющий связь שְׁלָמִים с миром и благополучием.
- source_word: בָּקָר שְׁנַיִם
  choice: два быка
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота. В русском перечне жертвенных животных «два быка» звучит естественно; грамматически мужская форма числительного в еврейском согласуется с подразумеваемыми отдельными животными, хотя сам термин не уточняет пол строго лексически.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם однозначно обозначает взрослых самцов овец.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתּוּדִים обозначает козлов; это точный и естественный современный русский эквивалент.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: כְּבָשִׂים здесь передано нейтральным «ягнят», а בְּנֵי שָׁנָה — естественным русским определением «годовалых». Пол в переводе не уточняется сверх необходимого.
- source_word: זֶה קָרְבַּן
  choice: Это приношение
  rationale: Именное предложение в еврейском допускает настоящее или контекстуальное прошедшее значение. Русское безглагольное «Это приношение» сохраняет форму и не навязывает времени.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Нахшона, сына Амминадава
  rationale: Имена транслитерированы в привычной русской библейской форме; патроним передан стандартной конструкцией «сына».
theological_decisions:
- issue: Значение הַשְּׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин связан с жертвенной трапезой, общением и состоянием мира/благополучия. Основной текст использует устойчивое русское обозначение, а примечание сохраняет широту возможного смысла.
