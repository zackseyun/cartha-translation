lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание буквально означает самца из коз; в современном русском «козёл» ясно и естественно передаёт пол и вид жертвенного животного.
- source_word: אֶחָד
  choice: одного
  rationale: Явно выраженное числительное сохранено в форме «одного», соответствующей винительному падежу и повторяющемуся перечню даров в Числах 7.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает особый вид жертвы, а не только абстрактный грех; традиционное и понятное русское выражение «жертва за грех» точно передаёт культовый смысл.
