lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Еврейское сочетание буквально означает самца из коз; современное русское «козёл» ясно и естественно передаёт пол и вид жертвенного животного.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное передано явно, чтобы сохранить перечислительный и повторяющийся строй главы.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В данном культовом перечне חַטָּאת обозначает вид жертвы, а не отвлечённое понятие греха; предлог לְ естественно выражен конструкцией «в жертву».
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: грех
  rationale: Контекст перечисляет жертвенные приношения вождей колен, поэтому существительное обозначает категорию жертвы. Такой перевод сохраняет прямой культовый смысл и не привносит позднейших богословских уточнений.
translation_notes:
  register: Современный литературный русский язык; краткая инвентарная формулировка сохраняет структуру еврейского перечня. Точка уместна для отдельного стиха; при публикации внутри продолжающегося списка возможна точка с запятой.
