  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей — по шекелю святилища[c]; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «блюдо» в более широком смысле; еврейское слово обозначает неглубокий серебряный сосуд.
    reason: lexical_alternative
  - marker: b
    text: Или «чаша для кропления»; еврейское слово обозначает ритуальный сосуд, употреблявшийся при служении в святилище.
    reason: lexical_alternative
  - marker: c
    text: То есть по стандарту веса, принятому при святилище.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן обозначает подносимое Богу культовое приношение; «приношение» естественно и точно передаёт термин в данном перечне.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קַעֲרָה — сравнительно неглубокий сосуд; «блюдо» сохраняет предметный смысл без излишней бытовой конкретизации.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Естественная русская передача буквально выраженного веса сосуда.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק обозначает сосуд храмового служения; «чаша» подходит для ритуального сосуда и противопоставляет его более плоскому блюду.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: Контекст ясно указывает, что речь идёт о весе второго сосуда; явное повторение делает русский текст недвусмысленным.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Краткая формальная передача стандарта веса, связанного со святилищем; пояснение вынесено в сноску.
- source_word: שְׁנֵיהֶם
  choice: оба сосуда
  rationale: Явно обозначает два упомянутых предмета и естественнее по-русски, чем буквальное «оба они».
- source_word: מְלֵאִים
  choice: были наполнены
  rationale: Передаёт именную предикацию оригинала в естественной русской форме.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת — высококачественная тонкая мука для приношений; традиционное «лучшая мука» понятно современному читателю.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно и современно передаёт пассивное причастие, указывающее на соединение муки с маслом.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает бескровное приношение из муки или зерна; «хлебное приношение» сохраняет его особый культовый смысл.
