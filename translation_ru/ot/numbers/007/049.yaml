base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша весом в семьдесят шекелей, по священному шекелю; оба сосуда были наполнены тонкой мукой, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряная тарель»; слово קַעֲרָה обозначает широкое блюдо или чашу. Следующее слово, מִזְרָק, также можно перевести как «таз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן обозначает дар, подносимый Богу в культовом контексте; «приношение» точно и естественно передаёт этот смысл.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קְעָרָה — широкий сосуд; «блюдо» подходит к контексту перечня священной утвари и сохраняет отличие от следующей чаши.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Естественно передаёт еврейскую конструкцию, в которой после сосуда указан его вес.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק обозначает чашу или таз, употреблявшиеся в жертвенном служении; «чаша» здесь ясно обозначает сосуд и хорошо отличается от блюда.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: Ясно показывает, что числовая величина относится к весу второго сосуда.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Фраза указывает на установленный при святилище эталон веса; традиционная краткая формулировка сохраняет культовую окраску.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Явное «сосуда» устраняет возможную неясность местоимения и естественно звучит по-русски.
- source_word: סֹלֶת
  choice: тонкой мукой
  rationale: Слово обозначает муку тонкого помола, предназначенную для приношений.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Точно и современно передаёт способ приготовления муки.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает особое бескровное приношение из муки; «хлебное приношение» сохраняет его культовую специфику.
