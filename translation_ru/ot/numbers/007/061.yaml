  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей, по шекелю святилища[c]; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряная тарелка» (קְעָרָה).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «серебряный таз»; מִזְרָק — сосуд, использовавшийся при служении в святилище.'
    reason: lexical_alternative
  - marker: c
    text: «По шекелю святилища» — по установленному при святилище весовому стандарту.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן обозначает принесённый Богу дар в культовом контексте; «приношение» точно и естественно передаёт этот смысл.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קְעָרָה — широкий или сравнительно неглубокий сосуд; «блюдо» сохраняет общий характер обозначения, не уточняя форму сверх источника.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Идиоматичная русская передача буквального «его вес — сто тридцать», сохраняющая единицу веса.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק — сосуд, употреблявшийся при служении в святилище; «чаша» естественна по-русски и не привносит бытовой оттенок слова «миска».
- source_word: שִׁבְעִים שֶׁקֶל
  choice: весом в семьдесят шекелей
  rationale: Второе указание веса развёрнуто для ясности и симметрии русского перечисления.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Фраза указывает на установленный при святилище весовой стандарт; краткая формулировка сохраняет культовую окраску оригинала.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Явное «оба сосуда» устраняет возможную неясность рода в русском и точно отсылает к двум названным предметам.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת означает высококачественную, тщательно очищенную муку; «лучшая мука» понятно современному читателю и не вводит спорной технической детализации.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Прямая современная передача пассивного причастия от בּלל.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает бескровное приношение из муки; традиционно понятное «хлебное приношение» отличает его от общего קָרְבָּן.
