  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: ru
  text: В девятый день — предводитель сынов Вениамина Авидан, сын Гидеони.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: В девятый день
  rationale: Предлог בְּ в сочетании с יוֹם образует обычное временное выражение; по-русски естественно «в девятый день».
- source_word: נָשִׂיא
  choice: вождь
  rationale: В Числах 7 слово обозначает признанного главу племени, приносящего дар; «вождь» передаёт племенной статус без обязательного царского оттенка слова «князь».
- source_word: לִבְנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Предлог לְ выражает связь вождя с племенной группой. Родительный оборот после «вождь» естественно передаёт эту связь и сохраняет родословное обозначение בְּנֵי.
- source_word: אֲבִידָן
  choice: Авидан
  rationale: Традиционно и фонетически обоснованно переданное на русском личное имя.
- source_word: בֶּן
  choice: сын
  rationale: Стандартная древнееврейская патронимическая конструкция; в русском приложении естественно «Авидан, сын Гидеони».
- source_word: גִּדְעֹנִי
  choice: Гидеони
  rationale: Транслитерация личного имени с сохранением отличия от имени Гедеон.
theological_decisions:
- issue: Родовое обозначение בְנֵי
  choice: сыны Вениамина
  alternative: потомки Вениамина; вениамитяне
  rationale: Буквальное родословное обозначение сохраняет образ племени как сынов общего предка и не нейтрализует грамматически мужскую форму.
- issue: Синтаксис именной фразы без глагола
  choice: 'Сохранено перечислительное построение: «вождь… Авидан»'
  alternative: Добавить «был» или «принёс дар»
  rationale: В еврейском тексте глагола нет; добавление действия внесло бы сведения из контекста, а «был» могло бы превратить формулу представления участника в самостоятельное утверждение.
translation_notes:
  register: Современный литературный русский с торжественной лаконичностью перечня. Сохранён родословный оборот «сыны Вениамина»; имена переданы в привычной библейской форме. Тире обозначает естественную паузу в безглагольной формуле.
