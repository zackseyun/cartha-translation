  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: ru
  text: 'Его приношение: одно серебряное блюдо[a] весом в сто тридцать шекелей и одна серебряная чаша[b] весом в семьдесят шекелей — по священному шекелю[c]; оба сосуда были наполнены мукой тонкого помола, смешанной с маслом, для хлебного приношения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большое блюдо». Еврейское слово обозначает ритуальный сосуд, вероятно неглубокий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кропильная чаша»; еврейское слово обозначает сосуд, употреблявшийся при жертвоприношениях.'
    reason: lexical_alternative
  - marker: c
    text: То есть по весовому стандарту, принятому при святилище.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Его приношение
  rationale: קָרְבָּן обозначает дар, приносимый Богу в культовом контексте; «приношение» точно передаёт смысл и естественно звучит по-русски.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: одно серебряное блюдо
  rationale: קַעֲרָה — сравнительно неглубокий сосуд; «блюдо» сохраняет вероятную форму предмета и допускает указанную в примечании альтернативу.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: весом в сто тридцать шекелей
  rationale: Идиоматично передаёт буквальное «вес его — сто тридцать», не добавляя единицы веса там, где далее назван стандарт шекеля.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: одна серебряная чаша
  rationale: מִזְרָק обозначает сосуд, связанный с жертвенным служением; нейтральное «чаша» естественно в русском и не навязывает чрезмерно точную форму.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Устойчивая формула указывает на установленный при святилище весовой стандарт; буквальная связь со святостью сохранена, а культурное значение пояснено в сноске.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: оба сосуда были наполнены
  rationale: Явное «оба» относится к двум названным сосудам; добавление «сосуда» устраняет неестественную для русского двусмысленность рода.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת — высококачественная тонкая мука для приношений; «лучшая мука» понятно современному читателю и не вводит технически спорного способа помола.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанная с маслом
  rationale: Точно и естественно передаёт пассивное причастие, обозначающее соединение муки с маслом.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом контексте מִנְחָה обозначает бескровное приношение из продуктов земли; традиционно понятное «хлебное приношение» точнее общего «дар».
theological_decisions:
- issue: Значение מִנְחָה в жертвенном контексте
  choice: хлебное приношение
  alternative: приношение / зерновое приношение
  rationale: Контекст уточняет состав из муки и масла. «Хлебное приношение» является понятным культовым обозначением и не предполагает, что здесь уже присутствует испечённый хлеб.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис исходного перечня сохранён, но веса оформлены естественными русскими оборотами; терминология понятна неспециалисту.
