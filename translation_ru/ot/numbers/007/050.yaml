translation:
  language: ru
  text: одна золотая чаша[a] весом в десять шекелей, наполненная благовониями;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «блюдо», «сосуд». Традиционный перевод «ложка» здесь может ввести в заблуждение: еврейское слово имеет более широкое значение и обозначает небольшой обрядовый сосуд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне священных принадлежностей это слово обозначает небольшой сосуд. «Чаша» естественно передаёт его форму и назначение, не создавая бытовой ассоциации с ложкой.
- source_word: אַחַת
  choice: одна
  rationale: Количественное числительное женского рода, согласованное со словом כַּף.
- source_word: עֲשָׂרָה
  choice: весом в десять шекелей
  rationale: В еврейском тексте буквально стоит «десять», однако в повторяющейся формуле этой главы подразумевается вес в шекелях. Уточнение делает эллиптическую конструкцию понятной по-русски.
- source_word: זָהָב
  choice: золотая
  rationale: Слово указывает на материал сосуда; по-русски естественно передаётся относительным прилагательным.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно передаёт состояние сосуда и согласуется со словом «чаша».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В культовом контексте обозначает ароматическую смесь для воскурения; «благовония» — ясный и устоявшийся русский эквивалент.
