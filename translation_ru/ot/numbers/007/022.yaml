  rationale: Сохраняет точное количество и перечислительный характер списка приношений.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В данном культовом перечне חַטָּאת обозначает установленный вид жертвы, а не абстрактный грех; предлог לְ передан естественной русской конструкцией.
theological_decisions:
- issue: Передача культового термина חַטָּאת
  choice: жертва за грех
  alternative: за грех
  rationale: Контекст перечисления жертв требует обозначить категорию приношения. Формулировка сохраняет ритуальный смысл и не сводит термин к абстрактному понятию греха.
translation_notes:
  register: Краткая, современная и dignified формулировка в винительном падеже, синтаксически продолжающая перечень предыдущего стиха; точка с запятой сохраняет его структуру.
