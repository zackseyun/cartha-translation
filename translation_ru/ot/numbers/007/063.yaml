  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ru
  text: одного быка из стада[a], одного барана, одного годовалого ягнёнка — для всесожжения;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одного молодого быка, одного барана, одного ягнёнка первого года жизни — для всесожжения». Еврейское выражение, буквально означающее «сын крупного скота», указывает на животное из стада крупного рогатого скота, а выражение «сын своего года» — на животное первого года жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: быка из стада
  rationale: פַּר обозначает быка, особенно в контексте жертвоприношений; идиоматическое בֶּן־בָּקָר указывает на животное из крупного рогатого скота. Формулировка сохраняет оба элемента без неестественного буквализма.
- source_word: אַיִל
  choice: барана
  rationale: Обычное обозначение взрослого самца овцы, в том числе как жертвенного животного.
- source_word: כֶּבֶשׂ
  choice: ягнёнка
  rationale: Слово обозначает ягнёнка и в данном перечне относится к жертвенному животному мужского пола; грамматический мужской род русского слова естественно передаёт это без громоздкого уточнения.
- source_word: בֶּן־שְׁנָתוֹ
  choice: годовалого
  rationale: Еврейская идиома буквально означает «сына своего года» и указывает на животное первого года жизни; «годовалого» — краткая и естественная формулировка в русском перечне.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, полностью сжигаемой на жертвеннике; предлог לְ естественно передан словом «для».
- source_word: אֶחָד
  choice: одного
  rationale: Повтор числительного при каждом животном сохранён, чтобы передать структуру и точный счёт еврейского перечня.
