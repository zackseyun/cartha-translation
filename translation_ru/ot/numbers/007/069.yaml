  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: одного быка из крупного скота
  rationale: Передаёт жертвенную формулу и классифицирующий оборот «сын крупного скота» естественным современным русским языком, не смешивая его с указанием возраста.
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: אַיִל — обычное обозначение взрослого самца овцы; повтор числительного сохраняет структуру перечня.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: одного годовалого ягнёнка
  rationale: כֶּבֶשׂ в данном жертвенном контексте обозначает ягнёнка мужского пола, что в русском обычно достаточно передаётся формой «ягнёнок»; возрастной оборот естественно выражен словом «годовалого».
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленный термин для жертвы, полностью сжигаемой на жертвеннике; «для всесожжения» естественно вписывается в перечень приношений.
