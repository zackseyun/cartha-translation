- source_word: אֶחָד
  choice: одного
  rationale: Числительное передано прямо и согласовано с винительным падежом, сохраняя перечислительный характер списка приношений.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает жертву за грех, а не абстрактный грех; предлог לְ естественно выражен конструкцией «в жертву».
