lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Устойчивое еврейское сочетание обозначает самца козы; русское «козёл» ясно и естественно передаёт пол жертвенного животного.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное сохранено в соответствии с перечислительным характером главы и согласовано с винительным падежом.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает жертву за грех, а не только грех как отвлечённое понятие; предлог לְ передан естественной русской конструкцией «в жертву».
theological_decisions:
- issue: Предметное или отвлечённое значение חַטָּאת
  choice: жертва за грех
  alternative: за грех
  rationale: Культовый контекст требует обозначения вида жертвоприношения; полный термин устраняет ненужную неясность, не добавляя конфессионального толкования.
translation_notes:
  register: Краткая, современная и достойная формулировка, сохраняющая инвентарный стиль перечня. Конечная точка употреблена как завершение самостоятельного стиха.
