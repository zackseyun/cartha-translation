  yaml_path: translation/ot/numbers/007/066.yaml
  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: ru
  text: 'В десятый день предводителем сыновей Дана был Ахиезер, сын Аммишаддая:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: В десятый день
  rationale: Предлог בְּ с יוֹם выражает время; по-русски естественно «в десятый день». Порядковое числительное передано прямо.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: В данном перечне слово обозначает признанного главу и представителя колена. «Предводитель» ясно передаёт эту роль и не вносит монархического оттенка слова «князь».
- source_word: לִבְנֵי דָן
  choice: сынов Дана
  rationale: Сохранён родовой способ обозначения племенной общности в еврейском тексте; לְ в этой конструкции указывает, чьим представителем является предводитель.
- source_word: אֲחִיעֶזֶר
  choice: Ахиезер
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: Обычная патронимическая формула; в русском естественно «сын Аммишаддая».
- source_word: עַמִּישַׁדָּי
  choice: Аммишаддай
  rationale: Личное имя транслитерировано с учётом принятой русской библейской формы; в родительном падеже в тексте — «Аммишаддая».
