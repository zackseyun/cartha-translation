base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: ru
  text: а в жертву мирную — две головы крупного скота, пять баранов, пять козлов и пять годовалых агнцев. Таково было приношение Элицура, сына Шедеура.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: а в жертву мирную
  rationale: Предлог ל вводит очередную категорию в перечне даров; «мирная жертва» — традиционный и понятный русский эквивалент специального культового термина שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; счётное выражение «две головы» естественно по-русски и не уточняет пол животных сверх еврейского текста.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם однозначно обозначает взрослых самцов овец.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, то есть самцов коз; русское слово сохраняет указание на пол.
- source_word: כְּבָשִׂים בְּנֵי־שָׁנָה חֲמִשָּׁה
  choice: пять однолетних ягнят
  rationale: כְּבָשִׂים — ягнята, а идиома בְּנֵי־שָׁנָה указывает на возраст около года; «однолетних» естественно и точно передаёт возрастную характеристику.
- source_word: זֶה קָרְבַּן
  choice: Таково было приношение
  rationale: Указательная формула подводит итог перечню. Прошедшее время естественно в русском повествовании, а «приношение» точно передаёт общее культовое понятие קָרְבָּן.
- source_word: אֱלִיצוּר בֶּן־שְׁדֵיאוּר
  choice: Элицура, сына Шедеура
  rationale: Имена переданы транслитерацией; патронимическая конструкция בֶּן передана обычным русским оборотом «сына».
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин допускает смысловые оттенки мира, благополучия и совместной трапезы, однако «мирная жертва» является устойчивым русским библейским наименованием и не требует навязывать один из спорных оттенков.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культового перечня. Синтаксис сделан естественным для русского текста; двоеточие заменено тире, а итоговая формула передана повествовательным прошедшим временем.
