source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/075.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ru
  text: одного быка из крупного скота, одного барана, одного годовалого ягнёнка — для всесожжения;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  choice: бык
  rationale: Обозначает быка или молодого быка; «бык» — естественный и точный термин в перечне жертвенных животных.
- source_word: בֶּן בָּקָר
  choice: из крупного скота
  rationale: Буквально «сын крупного скота»; идиоматический перевод указывает, что бык взят из стада крупного скота, не воспроизводя неестественный семитизм.
- source_word: אַיִל
  choice: баран
  rationale: Стандартное обозначение взрослого самца овцы в жертвенном контексте.
- source_word: כֶּבֶשׂ
  choice: ягнёнок
  rationale: Обозначает ягнёнка, в данной грамматической форме мужского рода; по-русски слово «ягнёнок» естественно передаёт это без избыточного добавления «самец».
- source_word: בֶּן שְׁנָתוֹ
  choice: годовалый
  rationale: Идиома указывает на животное первого года жизни или возрастом около года; «годовалый» кратко и естественно передаёт возрастную характеристику.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, полностью сжигаемой на жертвеннике; предлог לְ передан словом «для».
- source_word: אֶחָד
  choice: одного
  rationale: Повтор числительного при каждом животном сохранён, как в еврейском перечне.
