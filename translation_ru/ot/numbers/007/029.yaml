    issue: Имя «Элиава» передано неточно.
    rationale: 'Еврейское אֱלִיאָב оканчивается на -ав; в современной транслитерации это «Элиав». В косвенном падеже: «Элиава».'
  - severity: medium
    issue: «Ягнята» не отражает значение כְּבָשִׂים.
    rationale: В данном жертвенном перечне כְּבָשִׂים — барашки, то есть самцы овцы; нейтральное «ягнята» утрачивает это различие.
  - severity: low
    issue: «В жертву мирную» несколько архаично для заданного современного литературного варианта.
    rationale: «Для мирной жертвы» точнее передаёт לְ и естественнее вводит очередную категорию приношения.
