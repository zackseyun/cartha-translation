  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: ru
  text: а для мирной жертвы[a] — две головы крупного рогатого скота, пять баранов, пять козлов и пять годовалых барашков. Таково приношение Элиава, сына Хелона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; также возможно: «жертвы благополучия».'
    reason: Шеламим — специальный термин; традиционное «мирная жертва» сохранено в тексте, а основные смысловые альтернативы отмечены без сужения значения.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: а в жертву мирную
  rationale: Союз и предлог продолжают перечень предыдущего стиха, а זֶבַח שְׁלָמִים обозначает установленный вид жертвы. Традиционное русское «мирная жертва» кратко и узнаваемо; инверсия естественна для структуры перечня.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного рогатого скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота без указания пола. Счётное выражение «две головы» по-русски ясно и не добавляет отсутствующего в еврейском тексте указания на быков.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם прямо обозначает взрослых самцов овец.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, поэтому пол животных сохранён.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: 'בְּנֵי שָׁנָה — обычное обозначение возраста «одного года»; «годовалые ягнята» естественно передаёт его по-русски. Отдельное «самцов» не добавлено: грамматический мужской род множественного числа сам по себе не требует уточнения пола.'
- source_word: זֶה קָרְבַּן
  choice: Таково приношение
  rationale: Указательная именная конструкция буквально имеет настоящее значение; «таково приношение» естественно подводит итог перечню, не вводя прошедшего времени.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Элиава, сына Хелона
  rationale: Имена переданы русской библейской транслитерацией; патроним выражен обычной конструкцией «сына Хелона».
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения / жертва благополучия
  rationale: Термин допускает смысловые оттенки мира, благополучия и совместной трапезы. В основном тексте сохранён традиционный общеупотребительный русский культовый термин без сведения значения к одной богословской трактовке.
translation_notes:
  register: Современный литературный русский с достоинством культового перечня. Формулировки ясны обычному читателю; традиционная терминология сохранена там, где она остаётся понятной. Поскольку сносок нет, маркеры в основном тексте не требуются.
