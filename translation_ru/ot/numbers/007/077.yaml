base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: ru
  text: 'и для мирной жертвы: две головы крупного скота, пять баранов, пять козлов и пять годовалых барашков. Таково было приношение Пагиила, сына Охрана.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: и в жертву мирную
  rationale: Предлог לְ вводит следующий пункт перечня приношений, а זֶבַח שְׁלָמִים обозначает установленный вид жертвы. Традиционное русское «мирная жертва» узнаваемо и сохраняет культовый термин.
- source_word: בָּקָר שְׁנַיִם
  choice: два быка
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота, грамматически не уточняющее пол. Однако в контексте перечня жертвенных животных естественное русское соответствие — «два быка»; более буквальная возможность отмечена в сноске.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם прямо обозначает взрослых самцов овец; «бараны» точно и естественно передаёт это значение.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, то есть самцов коз; русское «козлы» точно сохраняет половое различие.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: כְּבָשִׂים — ягнята мужского пола, а בְּנֵי שָׁנָה буквально указывает на возраст в один год. В русском «ягнята» обычно не маркирует пол, но в данном перечне звучит естественно; «годовалые» точно передаёт возраст.
- source_word: זֶה קָרְבַּן
  choice: Таково было приношение
  rationale: Формула завершает описание дара данного вождя. Прошедшее время соответствует русскому повествовательному контексту, а «приношение» различает общее קָרְבָּן и конкретную жертву זֶבַח.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Пагиила, сына Охрана
  rationale: Имена переданы принятой русской библейской транслитерацией; родительный падеж обусловлен словом «приношение».
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения / жертва благополучия
  rationale: Еврейский термин допускает смысловые связи с миром, благополучием и совместной трапезой, но в данном инвентарном перечне обозначает прежде всего культовую категорию. Традиционное выражение сохраняет термин без навязывания одного из возможных богословских объяснений.
translation_notes:
  register: Современный литературный русский с сохранением достоинства культового перечня. Синтаксис сделан компактным и естественным; традиционный термин «мирная жертва» сохранён, а лексическая неопределённость בָּקָר вынесена в сноску.
