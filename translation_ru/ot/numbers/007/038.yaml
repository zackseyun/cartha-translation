lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне приношений это слово обозначает небольшой сосуд, а не ладонь или обычную ложку. «Чаша» естественно звучит по-русски и не уточняет форму сосуда сверх того, что позволяет контекст.
- source_word: אַחַת
  choice: одна
  rationale: Количественное числительное согласовано с существительным женского рода כַּף.
- source_word: זָהָב
  choice: золотая
  rationale: Передаёт материал сосуда естественным для русского языка определением.
- source_word: עֲשָׂרָה זָהָב
  choice: весом в десять шекелей
  rationale: В данном повторяющемся перечне сочетание числительного с названием металла представляет собой сокращённое указание веса; единица «шекель» восстанавливается из непосредственного контекста. Формулировка ясно показывает, что речь идёт о весе сосуда.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно передаёт согласованное с כַּף определение «полная».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: Обозначает ароматическое вещество, употребляемое при богослужении; «благовония» в данном контексте понятно современному читателю и не предполагает лишь дым.
