    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: одного быка из крупного скота
  rationale: Сочетание буквально означает «один бык, сын крупного скота»; по-русски естественно передать принадлежность животного к крупному рогатому скоту без воспроизведения семитской идиомы.
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: אַיִל — обычное обозначение взрослого самца овцы, в том числе в перечнях жертвенных животных.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: одного годовалого ягнёнка
  rationale: כֶּבֶשׂ в данном жертвенном перечне обозначает ягнёнка мужского пола, что в русском обычно подразумевается грамматическим мужским родом слова «ягнёнок»; בֶּן שְׁנָתוֹ — идиома возраста, означающая «годовалый» или «в первый год жизни».
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленный термин для жертвы, целиком сжигаемой на жертвеннике; предлог לְ указывает её назначение.
- source_word: אֶחָד
  choice: одного
  rationale: Повторение числительного при каждом животном сохраняется, поскольку оно подчёркивает отдельное количество каждого вида в перечне.
