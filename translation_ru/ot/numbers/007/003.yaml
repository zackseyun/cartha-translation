  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: ru
  text: 'И принесли они своё приношение перед Яхве: шесть крытых повозок[a] и двенадцать волов — по одной повозке на каждых двух вождей и по одному волу на каждого. И представили их перед скинией.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шесть повозок с навесом». Значение редкого еврейского выражения עֶגְלֹת צָב не вполне ясно; традиционно его понимают как крытые транспортные повозки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: своё приношение
  rationale: Слово קָרְבָּן обозначает дар, который приносят и представляют Богу; «приношение» естественно передаёт культовый контекст, не ограничивая смысл жертвой, предназначенной для заклания.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי имеет пространственно-реляционный смысл «перед, в присутствии»; краткая форма «пред» уместна в возвышенном библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עֶגְלֹת צָב
  choice: крытых повозок
  rationale: עֲגָלוֹת — повозки; редкое צָב традиционно понимается как указание на крытые или снабжённые навесом транспортные повозки. Неопределённость отмечена в сноске.
- source_word: בָּקָר
  choice: волов
  rationale: Хотя בָּקָר может обозначать крупный рогатый скот вообще, транспортный контекст и последующее שׁוֹר указывают здесь на тягловых волов.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: по одной повозке от каждых двух вождей
  rationale: 'Передана распределительная конструкция: каждая пара вождей предоставила одну повозку. Предлог «от» естественно выражает вклад участников.'
- source_word: הַנְּשִׂאִים
  choice: вождей
  rationale: В данном контексте נָשִׂיא означает главу колена; «вождь» точно передаёт статус, не придавая ему монархического смысла слова «князь».
- source_word: וְשׁוֹר לְאֶחָד
  choice: и по одному волу от каждого
  rationale: Распределительная фраза означает одного вола от каждого из ранее названных вождей.
- source_word: וַיַּקְרִיבוּ אוֹתָם
  choice: Они представили их
  rationale: הקריב здесь означает поднести или представить Богу. «Представили» сохраняет культовый оттенок, но не предполагает, будто повозки и волы были принесены в жертву посредством заклания.
- source_word: הַמִּשְׁכָּן
  choice: скинией
  rationale: מִשְׁכָּן — священное жилище, скиния; этот термин отличен от более специального אֹהֶל מוֹעֵד, «шатёр встречи».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יְהוָה. Форма «Яхве» сохраняет его как личное заветное имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер представления повозок и волов
  choice: представили их
  alternative: принесли их в жертву
  rationale: Глагол הקריב допускает культовое значение «принести», но характер перечисленных даров и дальнейший контекст не требуют понимания всех животных как жертв для заклания; поэтому перевод не вносит такого уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «пред Яхве» и «скиния» сохраняют достоинство и терминологическую точность; синтаксис упрощён делением длинного еврейского предложения на два русских.
