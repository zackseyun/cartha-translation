  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: ru
  text: В восьмой день предводителем сынов Манассии[a] был Гамалиил, сын Педацура.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Манассии»; это родовое обозначение потомков Манассии, то есть его колена.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: В восьмой день
  rationale: Предлог ב при слове «день» и порядковом числительном образует временное выражение. Перевод естественен по-русски и не добавляет отсутствующего в стихе уточнения.
- source_word: נָשִׂיא
  choice: предводитель
  rationale: В данном контексте слово обозначает признанного главу колена. «Предводитель» передаёт руководящее положение без монархического оттенка слова «князь».
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: сынов Манассии
  rationale: Сочетание называет племенную общность, которую представляет предводитель. Формулировка сохраняет еврейский родовой образ, а примечание поясняет его значение.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Имя передано в традиционной русской библейской форме; в родительном падеже — «Манассии».
- source_word: גַּמְלִיאֵל
  choice: Гамалиил
  rationale: Имя передано в устойчивой русской библейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Обычная передача древнееврейской патронимической конструкции.
- source_word: פְּדָה צוּר
  choice: Педацур
  rationale: Составное имя передано слитно в соответствии с принятой русской библейской традицией; после слова «сын» употреблён родительный падеж «Педацура».
