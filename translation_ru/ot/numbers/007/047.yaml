base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: ru
  text: 'и для мирной жертвы: две головы крупного скота[a], пять баранов, пять козлов и пять годовалых ягнят. Это было приношение Элиасафа, сына Деуила.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва общения»; или: «жертва благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: и в жертву мирную
  rationale: Союз и предлог продолжают перечень приношений, а זֶבַח שְׁלָמִים передаётся традиционным и понятным русским культовым выражением «мирная жертва».
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота без указания пола; счётное выражение «две головы» естественно по-русски и не вносит отсутствующей в тексте конкретизации.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִם однозначно обозначает взрослых самцов овец.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, сохраняя указанное в еврейском тексте различие пола.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых ягнят
  rationale: Выражение буквально означает ягнят «сынов года»; «годовалые ягнята» естественно передаёт возрастное требование.
- source_word: זֶה קָרְבַּן
  choice: Это приношение
  rationale: Именная формула без явно выраженной связки по-русски естественно передаётся настоящим временем; «приношение» хорошо соответствует широкому культовому значению קָרְבָּן.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Элиасафа, сына Деуила
  rationale: Имена переданы принятой русской библейской транслитерацией, а патронимическая конструкция — родительным оборотом.
theological_decisions:
- issue: Значение שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Термин допускает смысловые оттенки мира, целостности, благополучия и общения. В основном тексте сохранено узнаваемое русское культовое наименование, а альтернативы отмечены в сноске без устранения семантической широты.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. Сохранён краткий инвентарный строй стиха; союз «и» перед последним элементом делает перечень естественным по-русски.
