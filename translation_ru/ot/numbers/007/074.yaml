    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: чаша
  rationale: В перечне приношений слово обозначает небольшой сосуд. «Чаша» естественно звучит по-русски и, в отличие от «ложки», не создаёт впечатления столового прибора.
- source_word: אַחַת
  choice: одна
  rationale: Количественное числительное согласовано с существительным женского рода «чаша».
- source_word: עֲשָׂרָה זָהָב
  choice: весом в десять шекелей
  rationale: В еврейском тексте единица веса не названа явно, но подразумевается повторяющейся формулой приношений в контексте. Указание веса ясно передаёт смысл краткой исходной конструкции.
- source_word: זָהָב
  choice: золотая
  rationale: Прилагательное естественно указывает, что сосуд сделан из золота; количество золота уточняется через вес.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Передаёт состояние сосуда и его содержимое в естественной русской форме.
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В культовом контексте обозначает ароматическое вещество для воскурения; «благовония» — понятный и традиционно уместный русский эквивалент.
