lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Еврейское сочетание идиоматически обозначает самца козы. Русское «козёл» ясно передаёт пол жертвенного животного; в винительном падеже после подразумеваемого перечисления — «козла».
- source_word: אֶחָד
  choice: одного
  rationale: Числительное сохранено явно, что соответствует формальному, повторяющемуся перечню приношений в Числах 7.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает особый вид жертвы, связанной с очищением от греха, а не грех как абстрактное понятие. Традиционное и понятное русское выражение сохраняет культовое значение.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: «Жертва за грех» узнаваема и естественна для широкого русского читателя, тогда как «очистительная жертва» подчёркивает важный аспект обряда, но несколько уже истолковывает многозначный термин.
translation_notes:
  register: Краткий, ритмичный оборот в форме перечисления; современный литературный русский с сохранением традиционной библейской жертвенной терминологии.
