- source_word: כַּף
  choice: чаша
  rationale: В перечне принадлежностей святилища слово обозначает небольшой сосуд для благовоний, а не ладонь. «Чаша» естественно и конкретно передаёт эту функцию.
- source_word: אַחַת
  choice: одна
  rationale: Количественное числительное согласовано с существительным женского рода «чаша».
- source_word: עֲשָׂרָה
  choice: весом в десять шекелей
  rationale: В еврейском тексте буквально стоит «десять», но единица веса подразумевается по повторяющейся формуле ближайшего контекста. Уточнение делает эллиптическое выражение понятным по-русски.
- source_word: זָהָב
  choice: золотая
  rationale: Слово указывает на материал сосуда; по-русски это естественно передаётся относительным прилагательным.
- source_word: מְלֵאָה
  choice: наполненная
  rationale: Причастная конструкция естественно передаёт состояние сосуда и согласуется с «чаша».
- source_word: קְטֹרֶת
  choice: благовониями
  rationale: В контексте служения святилища это ароматическое вещество для воскурения; «благовония» — понятный и традиционно уместный русский эквивалент.
