  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: ru
  text: И для мирной жертвы[a] — две головы крупного скота[b], пять баранов, пять козлов и пять годовалых баранчиков. Это — приношение Шелумиила, сына Цуришаддая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертва общения»; возможен также смысл «жертва благополучия».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает крупный рогатый скот в целом; некоторые переводы говорят здесь о двух волах или быках.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: и для мирной жертвы
  rationale: Предлоги и союз вводят следующий пункт перечня. «Мирная жертва» — устоявшийся русский термин для данного вида жертвоприношения; примечание сохраняет другие смысловые оттенки שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: две головы крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота и само по себе не ограничивает значение волами или быками. Счётное выражение «две головы» естественно по-русски.
- source_word: אֵילִם חֲמִשָּׁה
  choice: пять баранов
  rationale: אֵילִים в жертвенном контексте обозначает взрослых баранов.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: пять козлов
  rationale: עַתֻּדִים обозначает козлов, поэтому мужской пол животных передан прямо.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: пять годовалых барашков
  rationale: «Барашки» передаёт мужской пол כְּבָשִׂים, а «годовалые» — идиому בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Это приношение
  rationale: Краткая именная формула естественна в русском перечислении и сохраняет обобщённое значение קָרְבַּן.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Шелумиила, сына Цуришаддая
  rationale: Имена переданы в принятой русской библейской форме, а родственная формула בֶּן — словом «сын».
theological_decisions:
- issue: Смысл термина שְׁלָמִים
  choice: мирная жертва
  alternative: жертва общения; жертва благополучия
  rationale: Традиционный термин узнаваем и уместен в культовом контексте, но не исчерпывает возможные оттенки корня; поэтому альтернативы приведены в примечании без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культового перечня. Синтаксис краток и ритмичен; специальные термины разъяснены в примечаниях. Все маркеры примечаний размещены непосредственно после соответствующих выражений.
