base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: ru
  text: 'Вот приношение при освящении жертвенника[a], в день его помазания: от вождей Израиля — двенадцать серебряных блюд, двенадцать серебряных чаш и двенадцать золотых чашечек[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот освящение жертвенника». Еврейское выражение формально называет само освящение; в этом итоговом перечне оно относится к дарам, принесённым при освящении.'
    reason: lexical_alternative
  - marker: b
    text: 'Названия сосудов допускают и другие переводы: «серебряные блюда (или тарели)», «серебряные чаши (или кропильницы)» и «золотые ложки (или небольшие чаши)». Согласно предыдущему перечню, золотые сосуды были наполнены благовониями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Вот приношение на освящение жертвенника
  rationale: Указательное זֹאת передаётся естественным русским «вот». Существительное חֲנֻכָּה означает посвящение или освящение; по контексту перечисления предметов подразумевается приношение, сделанное при освящении жертвенника.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: в день его помазания
  rationale: Формальная именная конструкция сохраняет связь местоимения с жертвенником и естественно звучит по-русски.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: от вождей Израиля
  rationale: מֵאֵת указывает на источник приношения, а נְשִׂיאִים в книге Чисел обозначает признанных глав колен; «вожди» передаёт общественное положение без монархического оттенка слова «князья».
- source_word: קַעֲרֹת כֶּסֶף
  choice: серебряные блюда
  rationale: קְעָרָה обозначает широкую посуду типа блюда; этот выбор также отличает её от следующих ритуальных сосудов.
- source_word: מִזְרְקֵי כֶסֶף
  choice: серебряные чаши
  rationale: מִזְרָק — чаша или таз, употреблявшийся в культовом обиходе; «чаши» понятно современному читателю и не создаёт бытового оттенка слова «тазы».
- source_word: כַּפּוֹת זָהָב
  choice: золотые кадильницы
  rationale: В непосредственном контексте (Чис 7:14 и параллели) эти сосуды наполнены благовониями, поэтому традиционно и функционально точно названы кадильницами, хотя само כַּף обозначает небольшой сосуд, чашу или ложку.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Прямое соответствие количественному числительному; различие грамматического рода в еврейском не требует отдельной передачи.
