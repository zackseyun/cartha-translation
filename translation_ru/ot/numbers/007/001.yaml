base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: ru
  text: В тот день, когда Моисей завершил установку скинии[a], он помазал и освятил её и все её предметы, а также жертвенник и все его предметы; он помазал и освятил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Моисей завершил установку скинии». Еврейский временной оборот может передаваться более естественно без указания на конкретный день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Повествовательная формула вводит новый эпизод; этот вариант сохраняет функцию еврейского оборота и остаётся понятным в современном литературном русском.
- source_word: בְּיוֹם כַּלּוֹת
  choice: в тот день, когда ... закончил
  rationale: Предлог с יוֹם и инфинитивной конструкцией задаёт временные рамки; перевод сохраняет образ «дня», не делая русскую фразу неестественной.
- source_word: לְהָקִים
  choice: устанавливать
  rationale: В породе хифиль глагол קום здесь означает поставить, воздвигнуть сооружение; «устанавливать скинию» ясно передаёт физическое действие.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: Устоявшийся и узнаваемый русский библейский термин для переносного святилища; он точнее контекстуально, чем буквальное «жилище».
- source_word: וַיִּמְשַׁח
  choice: помазал
  rationale: Стандартное обозначение ритуального нанесения масла при посвящении; сохраняет культовый смысл исходного глагола.
- source_word: וַיְקַדֵּשׁ
  choice: освятил
  rationale: В данном культовом контексте означает отделение предметов для священного употребления, а не нравственное преобразование.
- source_word: כָּל כֵּלָיו
  choice: всеми её принадлежностями
  rationale: При скинии כֵּלִים охватывает совокупность предметов и оснащения святилища; «принадлежности» естественно и достаточно широко.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшийся точный русский эквивалент названия культового сооружения.
- source_word: כָּל כֵּלָיו
  choice: всеми его принадлежностями
  rationale: При жертвеннике слово обозначает относящиеся к нему предметы и орудия. «Принадлежности» сохраняет широту исходного слова и лексическую связь с первым употреблением.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: он помазал и освятил их
  rationale: Множественные местоименные суффиксы сохранены прямо; итоговая фраза воспроизводит подчёркнутый повтор исходного текста, не сужая намеренно возможный охват местоимения.
theological_decisions:
- issue: Культовая терминология святости
  choice: освятил
  alternative: посвятил; сделал святыми
  rationale: «Освятил» в русском библейском регистре естественно означает отделение скинии и предметов для священного служения. Контекст препятствует пониманию этого слова как нравственного преобразования неодушевлённых предметов.
- issue: Охват итогового местоимения «их»
  choice: сохранить множественное местоимение без поясняющего расширения
  alternative: явно отнести только к жертвеннику и его принадлежностям либо ко всем перечисленным предметам
  rationale: Еврейское אֹתָם формально возобновляет перечисление во множественном числе, но точный охват может восприниматься шире ближайшей группы. Перевод сохраняет эту структурную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой («скиния», «жертвенник», «помазал», «освятил»). Синтаксический повтор конца стиха сохранён как значимый элемент еврейского текста; архаичные формы и чрезмерно техническая культовая терминология избегаются.
