  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: ru
  text: каждое серебряное блюдо — сто тридцать сиклей, и каждая чаша — семьдесят; общий вес всех серебряных сосудов — две тысячи четыреста сиклей, по священному сиклю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по сиклю святилища».'
    reason: 'Лексико-синтаксическая альтернатива: הַקֹּדֶשׁ может обозначать весовой стандарт, связанный со святилищем.'
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: сто тридцать
  rationale: Еврейское составное числительное буквально имеет порядок «тридцать и сто», но по-русски естественно передаётся как «сто тридцать».
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: каждое серебряное блюдо
  rationale: 'В контексте итоговой описи определённая форма единственного числа с אֶחָד имеет распределительное значение: речь идёт о весе каждого из ранее перечисленных блюд. כֶּסֶף обозначает материал — серебро.'
- source_word: הַמִּזְרָק הָאֶחָד
  choice: каждая чаша
  rationale: מִזְרָק — культовый сосуд, чаша или глубокая миска; «чаша» естественно и понятно в данном контексте. Сочетание с אֶחָד передано распределительно.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: всего серебра в этих сосудах
  rationale: Передаёт итоговое значение כֹּל и показывает, что подсчитывается серебро, из которого сделаны сосуды; указательное «этих» естественно связывает итог с только что названными предметами.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: две тысячи четыреста
  rationale: Нормальный современный русский порядок составного числительного.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному сиклю
  rationale: Предлог בְּ здесь указывает на применяемый эталон веса. «Священный сикль» сохраняет буквальную связь הַקֹּדֶשׁ со святостью и звучит по-русски естественнее, чем «сикль святилища» в основном тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством инвентарного итога. Эллиптическое отсутствие слова «весом» в еврейском сохранено посредством тире; единица «сиклей» добавлена после обоих чисел там, где это необходимо для ясности, причём после второго числа она подразумевается синтаксически из первого.
