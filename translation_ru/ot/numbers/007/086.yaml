base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: ru
  text: двенадцать золотых блюд, наполненных курением[a], — по десять шекелей каждое, по шекелю святилища; всего золота, пошедшего на блюда, — сто двадцать шекелей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чашами», «сосудами»; традиционно: «ложками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: блюд
  rationale: В данном контексте слово обозначает небольшие сосуды для благовоний. «Блюда» естественно звучит по-русски, согласуется с тем, что сосуды были наполнены благовониями, и не создаёт ложного представления об обычных ложках.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: наполненных благовониями
  rationale: Передаёт состояние сосудов и культовое ароматическое вещество ясным современным языком.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: по десять шекелей каждое
  rationale: 'Повторение числительного имеет распределительное значение: вес каждого отдельного блюда составлял десять шекелей.'
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: по священному шекелю
  rationale: Сохраняет техническую формулу, указывающую на установленный при святилище эталон веса.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: всего золота в блюдах
  rationale: Естественно передаёт итоговый вес золота, из которого состояли перечисленные сосуды.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: сто двадцать шекелей
  rationale: Единица веса восполнена из непосредственно предшествующей формулы и необходима для ясности по-русски.
