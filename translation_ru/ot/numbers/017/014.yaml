  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: ru
  text: Во время мора умерло четырнадцать тысяч семьсот человек, не считая умерших в связи с делом Корея[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также перевести: «из-за Корея» или «по делу Корея». Речь идёт о тех, кто ранее умер в связи с восстанием Корея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַמֵּתִים
  choice: умерло … человек
  rationale: Субстантивированное причастие «умершие» вместе с числом естественно передаётся по-русски безличной конструкцией; повествовательный וַ не требует отдельного вводного слова.
- source_word: בַּמַּגֵּפָה
  choice: во время мора
  rationale: מַגֵּפָה обозначает губительное массовое поражение или мор; такой перевод сохраняет обстоятельственное значение предлога בְּ и понятен современному читателю.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: четырнадцать тысяч семьсот человек
  rationale: Точная передача количества; слово «человек» добавлено согласно нормам естественной русской речи.
- source_word: מִלְּבַד
  choice: не считая
  rationale: Выражение ясно показывает, что ранее умершие не входят в названное число.
- source_word: עַל דְּבַר קֹרַח
  choice: в связи с делом Корея
  rationale: 'Формулировка сохраняет широту еврейского выражения: оно может указывать как на причинную связь, так и на принадлежность к делу Корея, не возлагая на Корея более прямую причинность, чем требует текст.'
theological_decisions:
- issue: Соотношение жертв мора и умерших в связи с Кореем
  choice: Названные 14 700 отделены от тех, кто умер ранее в связи с делом Корея.
  alternative: «умерших из-за Корея»
  rationale: Текст различает две группы, но не уточняет здесь состав более ранней группы; нейтральная формулировка не вводит дополнительных категорий и сохраняет смысловую широту עַל דְּבַר.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным библейским звучанием. «Мор» передаёт смертельное бедствие без излишне медицинской конкретизации; «в связи с делом Корея» сохраняет неоднозначность исходного выражения.
