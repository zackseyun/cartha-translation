  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: ru
  text: И когда община собралась против Моисея и Аарона, они повернулись к шатру встречи — и вот, облако покрыло его[a], и явилась слава Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «его», вероятнее всего, относится к шатру встречи.
    reason: Уточняет референт местоименного суффикса в כִסָּהוּ, не устраняя полностью формальную неоднозначность.
lexical_decisions:
- source_word: וַיְהִי
  choice: И когда
  rationale: В сочетании с последующим временным оборотом вводит очередное событие рассказа; русская конструкция естественно передаёт повествовательный переход без архаизма «и было».
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: когда община собралась
  rationale: Предлог ב при инфинитиве обозначает время, а Niphal глагола קהל — собирание; עֵדָה передано корпоративным словом «община».
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: против Моисея и Аарона
  rationale: В данном конфликтном контексте עַל выражает враждебную направленность, а не просто местоположение.
- source_word: וַיִּפְנוּ
  choice: они повернулись
  rationale: Глагол פנה обозначает физический поворот в сторону шатра; местоимение естественно указывает на собравшуюся общину.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Переданы оба компонента еврейского выражения; это понятно современному читателю и менее интерпретативно, чем традиционное «скиния собрания».
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и драматическую силу частицы הִנֵּה в естественной русской форме.
- source_word: כִסָּהוּ הֶעָנָן
  choice: облако покрыло его
  rationale: Глагол означает «покрыло», а местоименный суффикс мужского рода передан словом «его»; его наиболее естественный референт — ближайшее существительное мужского рода «шатёр».
- source_word: וַיֵּרָא
  choice: явилась
  rationale: Niphal глагола ראה здесь обозначает видимое проявление; «явилась» соответствует торжественному контексту богоявления.
- source_word: כְּבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сохраняет вес библейского понятия «слава» как зримого проявления Божьего присутствия и передаёт тетраграмматон личным именем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Русская форма транслитерации тетраграмматона сохраняет личное Божье имя, не заменяя его титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» передаёт его прямо и не подменяет титулом.
- issue: Референт местоименного суффикса в כִסָּהוּ
  choice: облако покрыло шатёр встречи
  alternative: облако покрыло общину или всё место действия
  rationale: Суффикс мужского рода и единственного числа наиболее естественно относится к ближайшему согласующемуся слову אֹהֶל («шатёр»), хотя краткая местоименная форма не называет референт повторно.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан плавным и понятным; архаические формулы избегаются. Тире подчёркивает внезапность открывшегося общине зрелища.
