  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: ru
  text: 'И будет так: жезл того человека, которого Я изберу, пустит почки, и Я сниму с Себя жалобы сынов Израиля[a], с которыми они выступают против вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтян»; или «народа Израиля». Буквально: «сынов Израиля».'
    reason: Лексическая альтернатива и пояснение еврейского родового выражения.
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Передаёт вводную формулу с будущим значением естественным и вместе с тем торжественным русским оборотом.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: того человека, которого Я изберу
  rationale: Сохраняет мужской род и смысл Божьего выбора; предложная конструкция בּוֹ естественно передана русским прямым дополнением.
- source_word: מַטֵּהוּ
  choice: жезл того человека
  rationale: «Жезл» подходит к знаку власти главы колена и к контексту Чисел; раскрытие местоименного суффикса устраняет возможную неясность.
- source_word: יִפְרָח
  choice: пустит почки
  rationale: Глагол обозначает появление почек или цветение. Здесь выбрана начальная стадия оживания жезла, поскольку дальнейшее развитие знамения подробно описано в следующем стихе.
- source_word: וַהֲשִׁכֹּתִי מֵעָלַי
  choice: и Я сниму с Себя
  rationale: Сохраняет образ жалоб как бремени, находящегося «на» Боге, и передаёт каузативный смысл прекращения, не сводя выражение лишь к указанию, против кого направлен ропот.
- source_word: תְּלֻנּוֹת
  choice: ропот
  rationale: «Ропот» точно передаёт повторяющиеся недовольные жалобы и хорошо сочетается с родственным глаголом далее в стихе.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет формальное родовое выражение еврейского текста; более естественные собирательные варианты приведены в примечании.
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: которым они ропщут на вас
  rationale: Передаёт продолжающееся действие причастия и враждебную направленность עַל на Моисея и Аарона, сохраняя связь относительного оборота с существительным «ропот».
theological_decisions:
- issue: Связь Божьего избрания с жезлом представителя
  choice: «жезл того человека, которого Я изберу»
  alternative: «жезл избранного Мною человека»
  rationale: Развёрнутая относительная конструкция сохраняет акцент исходного текста на личном Божьем выборе, не уточняя сверх текста природу или основание избрания.
- issue: Значение מֵעָלַי при прекращении ропота
  choice: «сниму с Себя ропот»
  alternative: «положу конец ропоту против Меня»
  rationale: Еврейское выражение буквально изображает удаление ропота «с» Бога. Выбранный вариант сохраняет этот образ и не отождествляет без оговорки מֵעָלַי с направленностью «против Меня», тогда как последняя часть стиха прямо говорит о ропоте на Моисея и Аарона.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: '«сыны Израиля» в косвенном падеже: «сынов Израиля»'
  alternative: «израильтяне» или «народ Израиля»
  rationale: Основной текст сохраняет родовую форму оригинала, а примечание разъясняет её корпоративный смысл без введения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Жезл» и «ропот» сохраняют достоинство и контекстуальную точность, а синтаксис остаётся понятным современному читателю. Образное «сниму с Себя» намеренно удерживает формулировку исходного текста и его возможную напряжённость.
