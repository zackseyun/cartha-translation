  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: ru
  text: «Скажи сынам Израиля[a] и возьми у всех их вождей, по их отцовским родам, по одному посоху — всего двенадцать посохов[b]. Имя каждого напиши на его посохе».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жезлов». Древнееврейское слово מַטֶּה может означать посох или жезл; здесь имеется в виду физический предмет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный образ древнееврейского выражения и обращение к представителям народа; более обобщённый вариант — «израильтянам».
- source_word: מַטֶּה
  choice: посох
  rationale: В данном контексте обозначает физический предмет, на котором пишут имя и который позднее даст ростки. «Посох» естественнее современного русского «жезл», хотя последнее также возможно.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: по одному посоху от каждого отцовского рода
  rationale: Оборот «по одному» передаёт распределительное повторение существительного, а «отцовский род» обозначает родовую группу по отцовской линии, не сводя её к отдельной семье или зданию.
- source_word: נְשִׂיאֵיהֶם
  choice: их вождей
  rationale: Речь идёт о главах племенных объединений. «Вожди» передаёт общественное положение без монархического оттенка слова «князья».
- source_word: לְבֵית אֲבֹתָם
  choice: по их отцовским родам
  rationale: Передаёт принцип распределения вождей и посохов по патрилинейным родовым группам.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: двенадцать посохов
  rationale: Прямо передаёт число и сохраняет выбранный эквивалент מַטֶּה.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Имя каждого напиши
  rationale: «Каждого» сохраняет распределительное значение אִישׁ, а порядок слов подчёркивает соответствие одного имени одному посоху и остаётся естественным по-русски.
- source_word: עַל מַטֵּהוּ
  choice: на его посохе
  rationale: Сохраняет прямую связь имени каждого вождя с принадлежащим ему посохом.
