  yaml_path: translation/ot/numbers/017/016.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве сказал Моисею:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с повествовательным וַ продолжает последовательность событий. В современной русской библейской прозе «И … сказал» естественно передаёт формулу речи; отдельная передача לֵאמֹר сделала бы её тяжеловесной и избыточной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного сочетанием предлога אֶל с именем מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит последующую прямую речь. В современном русском эту функцию естественнее передать двоеточием, не добавляя неуклюжее «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יְהוָה. «Яхве» прямо передаёт его как имя; «Господь» заменяет имя титулом, а «Иегова» отражает более позднюю смешанную форму.
translation_notes:
  register: Современный литературный русский язык с краткой и dignified библейской формулой. Двоеточие показывает, что стих вводит речь, продолжающуюся в следующем стихе.
