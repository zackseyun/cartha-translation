base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: ru
  text: 'На следующий день Моисей вошёл в шатёр свидетельства, и вот: жезл Аарона, представлявший дом Левия[a], пустил почки, выпустил цветы, и на нём созрели миндальные плоды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для дома Левия», то есть жезл представлял дом (род, колено) Левия.'
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Естественно передаёт временную последовательность исходного выражения в современном русском языке.
- source_word: אֹהֶל הָעֵדוּת
  choice: шатёр свидетельства
  rationale: Формально и понятно передаёт устойчивое обозначение святилища и сохраняет юридико-заветный оттенок עֵדוּת.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет повествовательный указатель, привлекающий внимание к неожиданному чуду.
- source_word: מַטֵּה
  choice: жезл
  rationale: В данном контексте речь идёт о знаке власти главы колена; «жезл» естественнее отражает эту функцию, чем бытовое «посох».
- source_word: פָּרַח
  choice: расцвёл
  rationale: Передаёт общее чудесное оживление жезла, после чего текст подробно перечисляет стадии цветения и плодоношения.
- source_word: לְבֵית לֵוִי
  choice: представлявший дом Левия
  rationale: Явно выражает функцию жезла как знака дома Левия, не подменяя образное древнееврейское обозначение словом «колено».
- source_word: וַיֹּצֵא פֶרַח
  choice: на нём появились бутоны
  rationale: Передаёт начальную стадию последовательности развития растения и отличает פֶרַח от последующего раскрытия цветков.
- source_word: וַיָּצֵץ צִיץ
  choice: распустились цветы
  rationale: Естественно передаёт следующую стадию — цветение — при сохранении последовательности исходного текста.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: созрел миндаль
  rationale: Глагол обозначает достижение зрелости; собирательное «миндаль» звучит естественно и сохраняет кульминацию чуда.
theological_decisions:
- issue: Функция жезла Аарона по отношению к дому Левия
  choice: «представлявший дом Левия»
  alternative: «для дома Левия»
  rationale: Предыдущий контекст показывает представительскую функцию жезлов; формулировка проясняет синтаксическую связь, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выражение «и вот» сохраняет живость еврейского рассказа; ботаническая последовательность передана естественными русскими словами без устранения образной напряжённости исходного текста.
