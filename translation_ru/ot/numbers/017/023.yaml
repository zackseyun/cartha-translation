  to: 'На следующий день Моисей вошёл в шатёр свидетельства, и вот: жезл Аарона, представлявший дом Левия[a], пустил почки, выпустил цветы, и на нём созрели миндальные плоды.'
  rationale: 'Исправлена последовательность образов роста: почки, цветы, зрелые плоды. Неестественная лексическая сноска к «шатру свидетельства» удалена вместе с её якорем. Сноска к «дому Левия» сохранена и слегка уточнена, чтобы отделить буквальную форму еврейского текста от необходимого для русского синтаксиса контекстуального пояснения.'
