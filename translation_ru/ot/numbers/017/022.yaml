  source_fidelity: 'Текст точно передаёт еврейский оригинал: וַיַּנַּח передано как «положил», הַמַּטֹּת — как конкретные предметы «посохи», а пространственно-культовые выражения «перед Яхве» и «в шатре свидетельства» сохранены без смыслового расширения. Начальное «И» уместно передаёт повествовательную связь формы waw-consecutive.'
