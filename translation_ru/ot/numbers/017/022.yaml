  terminology: «Яхве» последовательно передаёт יהוה как личное имя. «Посохи» — удачный основной вариант для מַטּוֹת в данном контексте; сноска корректно фиксирует допустимое «жезлы». «Шатёр свидетельства» буквально и точно передаёт אֹהֶל הָעֵדֻת; альтернативная «скиния свидетельства» надлежащим образом вынесена в сноску.
