  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: ru
  text: И положил Моисей посохи[a] перед Яхве в шатре свидетельства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезлы». Здесь имеются в виду посохи, представлявшие колена Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в скинии свидетельства». Буквально: «в шатре свидетельства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: положил
  rationale: Каузативная форма глагола נוח здесь означает «поместить, положить». «Положил» естественно передаёт конкретное действие в повествовании.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: הַמַּטֹּת
  choice: посохи
  rationale: מַטֶּה может обозначать посох, жезл или колено. В данном контексте речь идёт о физических посохах, представляющих колена Израиля; «посохи» ясно передаёт предметное значение.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохраняет пространственный смысл выражения и одновременно допускает значение нахождения в присутствии Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула.
- source_word: בְּאֹהֶל
  choice: в шатре
  rationale: אֹהֶל буквально означает переносное жилище, шатёр. Этот вариант сохраняет исходный образ и звучит естественно в современном русском языке.
- source_word: הָעֵדֻת
  choice: свидетельства
  rationale: עֵדוּת обозначает свидетельство, связанное с заветом и хранившимися в святилище скрижалями. Родительный оборот непосредственно воспроизводит еврейское наименование святилища.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя יהוה, а не титул; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Значение выражения אֹהֶל הָעֵדֻת
  choice: шатёр свидетельства
  alternative: скиния свидетельства
  rationale: Буквальный оборот сохраняет образ шатра и связь святилища со свидетельством завета; традиционное «скиния» возможно, но менее прозрачно для современного читателя.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь еврейской формы וַיַּנַּח с предыдущим контекстом; лексика остаётся понятной без устранения культовой формулы «шатёр свидетельства».
