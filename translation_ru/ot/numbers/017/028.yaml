  text: Всякий, кто подходит — кто подходит к скинии Яхве, — умрёт. Неужели мы все погибнем?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели мы все умрём?» Здесь употреблён иной еврейский глагол, чем в выражении «умрёт»; он может передавать смысл гибели, а не просто повторять слово «умереть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: всякий, кто
  rationale: 'Передаёт универсальный смысл: речь идёт о любом человеке, который приблизится.'
- source_word: הַקָּרֵב הַקָּרֵב
  choice: приближается, приближается
  rationale: Повтор причастия сохранён как выразительная особенность еврейской речи, передающая страх и настойчивость говорящих.
- source_word: מִשְׁכַּן
  choice: скиния
  rationale: Устоявшееся и точное обозначение переносного святилища Израиля в пустыне.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: יָמוּת
  choice: умрёт
  rationale: Прямо выражает неизбежное следствие приближения к скинии.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: всем нам суждено погибнуть
  rationale: Естественно передаёт риторический вопрос о полной гибели народа; глагол גוע отличён от предшествующего מות.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Объём угрозы в заключительном вопросе
  choice: всем нам суждено погибнуть
  alternative: неужели мы все умрём
  rationale: Формулировка сохраняет коллективный страх полной гибели и не сводит отличающийся еврейский глагол גוע к простому повтору «умрём».
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского термина «скиния». Повтор «приближается, приближается» намеренно не сглажен, чтобы передать напряжённость еврейского оригинала.
