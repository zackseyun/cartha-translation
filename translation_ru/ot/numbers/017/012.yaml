  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: ru
  text: И взял Аарон кадильницу, как сказал Моисей, и побежал в середину собрания. И вот, среди народа уже начался мор. Тогда он положил курение на огонь и совершил искупление за народ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил очищение за народ». Еврейский культовый глагол обозначает ритуальное действие, посредством которого устраняются вина или осквернение и отвращается суд.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: В еврейском тексте прямое дополнение не выражено; русский язык допускает такое употребление в контексте предыдущего стиха, поэтому подразумеваемый предмет не добавлен.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: как сказал Моисей
  rationale: דבר означает «говорить, сказать»; перевод не усиливает выражение до «повелел», хотя слова Моисея по контексту имели побудительную силу.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: побежал в самую середину собрания
  rationale: רוץ прямо обозначает бег, а תוך הקהל — внутреннюю, срединную часть собравшегося сообщества.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет функцию הִנֵּה как маркера внезапного и наглядного привлечения внимания, оставаясь естественным в современном русском.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: поражение уже началось среди народа
  rationale: נֶגֶף обозначает смертоносное бедствие или поражение; «поражение» сохраняет связь с Божьим карающим ударом и не уточняет без необходимости характер бедствия как болезни. «Уже» передаёт результативность формы в данной сцене.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: он возложил благовоние
  rationale: נתן буквально значит «дал, положил»; в ритуальном контексте «возложил» естественно передаёт помещение курения на огонь, не подменяя конкретное действие более истолковывающим «принёс в жертву».
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: совершил очищение за народ
  rationale: В священническом контексте כפר обозначает обрядовое действие, устраняющее вину или осквернение и отвращающее суд. «Совершил очищение» понятно современному читателю; предлог «за» сохраняет направленность действия на благо народа.
theological_decisions:
- issue: Передача культового глагола כפר
  choice: совершил очищение за народ
  alternative: совершил искупление за народ
  rationale: «Искупление» — традиционный и возможный вариант, но в современном русском легко вызывает более узкое представление о выкупе или позднейшем богословском учении. «Очищение» передаёт священническое устранение вины и осквернения, не фиксируя спорный механизм действия; альтернативу следует сохранить в примечании.
- issue: Передача נֶגֶף как действия Божьего суда
  choice: поражение
  alternative: моровая язва
  rationale: Контекст указывает на смертоносный Божий суд, однако само слово не требует именно эпидемического заболевания. «Поражение» сохраняет более широкий диапазон значения и серьёзность происходящего.
- issue: Передача קָהָל
  choice: собрание
  alternative: община
  rationale: «Собрание» естественно обозначает собравшийся народ Израиля и не привносит специально церковных ассоциаций.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохраняет стремительность повествования и самостоятельную силу «И вот». Термины выбраны так, чтобы ритуально-богословский вес текста сохранялся без конфессионального уточнения механизма очищения.
