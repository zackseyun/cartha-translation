lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в повествовательной формуле обозначает речевое действие. По-русски естественное введение прямой речи — «сказал»; вариант «говорил» здесь менее идиоматичен и может ошибочно передавать длительность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: אֶל
  choice: Моисею (дательный падеж)
  rationale: Направленность речи, выраженная предлогом אֶל, естественно передаётся в русском языке дательным падежом без отдельного предлога.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени; в предложении употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Формульное לֵאמֹר вводит последующую прямую речь. В современном русском переводе его функцию естественно и точно передаёт двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» является принятой научной реконструкцией произношения; примечание сохраняет сведения о самом написании и альтернативной традиционной передаче.
translation_notes:
  register: Современный литературный русский язык, краткая и торжественная повествовательная формула. Двоеточие передаёт функцию לֵאמֹר и указывает, что прямая речь следует далее.
