base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: ru
  text: 'На следующий день вся община сынов Израиля возроптала на Моисея и на Аарона, говоря: «Вы умертвили народ Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ Господа». В еврейском тексте стоит личное имя Бога — יהוה (YHWH), здесь переданное как «Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: стало роптать
  rationale: Глагол לון в этой породе обозначает недовольный, обвиняющий ропот общины; «роптать» естественно в библейском повествовании и сохраняет отрицательную окраску.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всё общество сынов Израиля
  rationale: «Общество» передаёт корпоративный смысл עֵדָה, а «сыны Израиля» сохраняет грамматически мужскую и традиционную форму בְּנֵי יִשְׂרָאֵל.
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Точное и естественное современное соответствие временному выражению.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: на Моисея и на Аарона
  rationale: Повтор предлога сохраняет еврейское акцентирование каждого из двух вождей как объекта ропота.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Формально передаёт инфинитив, вводящий прямую речь, без изменения синтаксической связи.
- source_word: אַתֶּם הֲמִתֶּם
  choice: вы умертвили
  rationale: 'Каузативная форма от מות выражает обвинение: адресаты стали причиной смерти. «Умертвили» сохраняет прямоту обвинения и каузативный оттенок.'
- source_word: עַם יְהוָה
  choice: народ Яхве
  rationale: Сохраняет генитивное отношение и заветное обозначение народа, принадлежащего Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя YHWH транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому основное чтение сохраняет личное заветное имя; традиционное замещение титулом указано в сноске.
- issue: Выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Формулировка сохраняет образ и грамматическую форму оригинала, оставаясь понятной в современном русском библейском регистре.
- issue: Каузативность הֲמִתֶּם
  choice: умертвили
  alternative: погубили / стали причиной смерти
  rationale: Выбрана прямая обвинительная формулировка, не уточняющая сверх текста, каким именно образом Моисей и Аарон причинили смерть.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским регистром. Синтаксический повтор «на… и на…» и причастная конструкция «говоря» намеренно сохраняют форму и обвинительный нажим еврейского текста.
