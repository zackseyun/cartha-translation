  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: Указание формы оригинала и традиционного варианта передачи Божьего имени.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с последовательным וַ продолжает повествование. В русском библейском повествовании «И … сказал» естественно передаёт речевой глагол דּבר вместе с последующим לֵאמֹר, не создавая тяжеловесного сочетания «говорил… говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, обозначенного предлогом אֶל; имя מֹשֶׁה дано в принятой русской форме.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Эта формула вводит содержание последующей прямой речи; в современном русском её функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя YHWH. Форма «Яхве» непосредственно передаёт его как имя, тогда как «Господь» является традиционной заменой титулом; «Иегова» основано на более позднем смешении согласных имени с указательными гласными.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Формула речи передана идиоматически, без буквального и неестественного «говорил… говоря».
