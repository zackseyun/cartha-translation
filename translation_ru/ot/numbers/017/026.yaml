source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: ru
  text: И Моисей сделал так, как повелел ему Яхве; так он и сделал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; здесь речь идёт об исполнении повеления, а повтор «сделал» сохраняет композиционный акцент оригинала.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Оборот выражает соответствие действия данному повелению; «так, как» естественно звучит по-русски и связывается с последующим повтором.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол צוה обозначает властное предписание. «Повелел» передаёт его силу и соответствует возвышенному, но понятному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֹתוֹ
  choice: ему
  rationale: В русском языке при глаголе «повелеть» адресат нормативно выражается дательным падежом, хотя в еврейском он оформлен показателем прямого дополнения.
- source_word: כֵּן
  choice: так
  rationale: Слово возобновляет и подтверждает предыдущее утверждение, подчёркивая точное исполнение повеления.
- source_word: עָשָׂה
  choice: он и сделал
  rationale: 'Повтор того же глагола сохранён, а частица «и» естественно передаёт русское усилительное подтверждение: именно так он поступил.'
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» передаёт имя непосредственно, не заменяя его титулом и не принимая позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический и лексический повтор оригинала намеренно сохранён для передачи подчёркнутого послушания Моисея.
