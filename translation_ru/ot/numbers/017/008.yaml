lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришли
  rationale: Форма wayyiqtol продвигает повествование и передаётся прошедшим временем. Хотя еврейский глагол стоит в единственном числе, в русском при составном подлежащем «Моисей и Аарон» естественно множественное число. Значение «вошли» было бы неоправданно конкретным.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: וְאַהֲרֹן
  choice: и Аарон
  rationale: Союз и традиционная русская форма имени.
- source_word: אֶל־פְּנֵי
  choice: к
  rationale: В данном контексте идиома обозначает приближение к месту перед Шатром. Русское «к» естественно передаёт направление, не утверждая, что Моисей и Аарон вошли внутрь.
- source_word: אֹהֶל מוֹעֵד
  choice: Шатёр Встречи
  rationale: Передаёт конструкцию и культовое значение названия святилища; прописные буквы отмечают конкретное священное сооружение.
