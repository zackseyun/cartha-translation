  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: ru
  text: И он встал между мёртвыми и живыми, и мор прекратился.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: И он встал
  rationale: Глагол עמד означает «стоять, встать, занять место». «Встал» естественно передаёт конкретное действие Аарона в повествовании, не добавляя военного или иного оттенка.
- source_word: בֵּין ... וּבֵין
  choice: между ... и
  rationale: Парная конструкция прямо обозначает положение между двумя группами; русский оборот сохраняет пространственный смысл и параллелизм.
- source_word: הַמֵּתִים
  choice: мёртвыми
  rationale: Субстантивированная форма обозначает умерших; «мёртвые» естественно и резко контрастирует с «живыми».
- source_word: הַחַיִּים
  choice: живыми
  rationale: Субстантивированное прилагательное обозначает тех, кто ещё жив; «живые» сохраняет лаконичный контраст исходного текста.
- source_word: וַתֵּעָצַר
  choice: прекратился
  rationale: Пассивная форма от עצר указывает, что распространение бедствия было остановлено. По-русски сочетание «мор прекратился» ясно и естественно выражает результат, не называя действующего лица, как и исходный текст.
- source_word: הַמַּגֵּפָה
  choice: мор
  rationale: מַגֵּפָה здесь означает смертоносное массовое бедствие, поразившее народ. «Мор» — ёмкое и уместное в библейском повествовании русское соответствие; оно передаёт смертельный характер происходящего лучше, чем общее «бедствие».
theological_decisions:
- issue: Характер מַגֵּפָה в контексте суда
  choice: мор
  alternative: язва; эпидемия; поражение
  rationale: Контекст описывает посланное Богом смертельное поражение народа. «Мор» сохраняет тяжесть и традиционный библейский оттенок, но не уточняет медицинскую природу бедствия и не добавляет богословского объяснения сверх текста.
- issue: Кто остановил мор в форме וַתֵּעָצַר
  choice: 'сохранена безлично-пассивная направленность: «мор прекратился»'
  alternative: «мор был остановлен»
  rationale: Исходная форма сообщает об остановке мора, не называя прямо действующего лица. Русская формулировка сохраняет эту сдержанность и не снимает напряжение между непосредственным служением Аарона и Божьим действием в контексте.
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified повествовательным строем. Сохранён параллелизм «между мёртвыми и живыми». Слово «мор» слегка возвышенное, но общепонятное и уместное для библейского контекста; архаическая синтаксическая тяжеловесность исключена.
