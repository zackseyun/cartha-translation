  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: ru
  text: 'Тогда Моисей сказал Аарону: «Возьми кадильницу[a], положи в неё огонь с жертвенника и насыпь благовоний. Поспеши к общине и соверши искупление за них, ибо от Яхве[b] уже вышел гнев — мор уже начался».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совок для углей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица Яхве», то есть из его присутствия.'
    reason: lexical_clarification
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: кадильницу
  rationale: Обозначает сосуд для переноски углей и воскурения благовоний при священническом служении; «кадильница» естественно передаёт его назначение в данном контексте.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: положи в неё огонь с жертвенника
  rationale: Передаёт источник огня и естественно описывает помещение горящих углей в сосуд; «огонь» сохранён вслед за еврейским текстом.
- source_word: קְטֹרֶת
  choice: благовоний
  rationale: В культовом контексте это ароматическое вещество для воскурения; множественное число естественно для современного русского употребления.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: Скорее иди
  rationale: Сохраняет и повеление идти, и выраженную наречием срочность.
- source_word: הָעֵדָה
  choice: общине
  rationale: Обозначает собранное сообщество Израиля; «община» понятно современному читателю и сохраняет коллективный смысл.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: соверши за них искупление
  rationale: Сохраняет специальное священническое значение כפר, не сводя его к общей просьбе о прощении и не навязывая узкую теорию искупления.
- source_word: הַקֶּצֶף
  choice: гнев
  rationale: Передаёт вспышку Божьего гнева и суда с подобающей контексту серьёзностью.
- source_word: מִלִּפְנֵי יְהוָה
  choice: от лица Яхве
  rationale: Сохраняет еврейский образ исходящего из Божьего присутствия гнева; пояснение дано в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: הֵחֵל הַנָּגֶף
  choice: мор уже начался
  rationale: В данном контексте נֶגֶף означает начавшееся среди народа смертоносное массовое поражение; «мор» кратко и выразительно передаёт это, не предполагая конкретной естественной причины.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не смешивает с титулом.
- issue: Значение כפר в священническом контексте
  choice: соверши за них искупление
  alternative: очисти их; умилостиви за них
  rationale: Формулировка сохраняет широкий культово-богословский смысл глагола и связь ритуального действия с прекращением суда, не уточняя сверх текста механизм искупления.
- issue: Источник исходящего гнева
  choice: от лица Яхве вышел гнев
  alternative: от Яхве исходит гнев
  rationale: Более формальная передача сохраняет пространственный образ מִלִּפְנֵי и завершённый аспект глагола, оставляя пояснение образа сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной и культовой речи. Императивы переданы ясно и срочно; ключевые священнические термины сохранены без излишней архаизации. Слово «мор» употреблено в его литературном значении массового смертоносного бедствия.
