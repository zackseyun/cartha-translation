  naturalness: Предлагаемая формулировка остаётся современной и литературной. «Оттуда, где они находились перед Яхве» естественно передаёт пространственный смысл без архаичного «из пред Яхве».
  terminology: «Посохи», «Яхве» и «сыны Израиля» передают контекстуальное значение מַטּוֹת, тетраграмматон и традиционное национальное обозначение. «Каждый взял свой посох» точно передаёт дистрибутивную конструкцию אִישׁ מַטֵּהוּ.
