base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: ru
  text: Моисей вынес все посохи оттуда, где они находились перед Яхве, ко всем сынам Израиля[a]. Они увидели[b], и каждый взял свой посох.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всем израильтянам». Буквально: «ко всем сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте дополнение не выражено: буквально «они увидели».'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: вынес
  rationale: Форма хифиль от יצא имеет каузативное значение «вынести, вывести». В данном пространственном контексте естественно русское «вынес».
- source_word: הַמַּטֹּת
  choice: все посохи
  rationale: מַטֶּה может означать «посох», «жезл» или «колено», но здесь речь о физических предметах, ранее положенных перед Яхве. «Посохи» ясно передаёт значение и сохраняет связь с контекстом.
- source_word: מִלִּפְנֵי יְהוָה
  choice: находившиеся перед Яхве
  rationale: 'Буквально: «из-перед Яхве». Причастный оборот естественно выражает по-русски исходное местонахождение посохов, не превращая оборот в отвлечённое «из присутствия».'
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ко всем сынам Израиля
  rationale: Сохраняется формально прозрачное национальное обозначение «сыны Израиля»; предложный оборот с «ко» естественен при движении к собравшимся людям.
- source_word: וַיִּרְאוּ
  choice: они увидели их
  rationale: Обычное значение ראה — «видеть, увидеть». Местоимение «их» проясняет подразумеваемое дополнение — посохи — без добавления идеи осмотра, которой глагол сам по себе не требует.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: каждый взял свой посох
  rationale: 'אִישׁ употреблено дистрибутивно: буквально «муж — свой посох», то есть каждый из представителей взял принадлежавший ему посох. Русское «каждый» естественно и точно передаёт конструкцию.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон, поэтому личное заветное имя передано как «Яхве», без замены титулом.
- issue: Кто обозначен выражением בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формальная передача сохраняет образное и национально-родовое выражение оригинала; сноска предлагает более обычный современный эквивалент.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён настолько, чтобы последовательность действий оставалась ясной, но повтор союза в заключительной части сохраняет повествовательный ритм древнееврейского текста.
