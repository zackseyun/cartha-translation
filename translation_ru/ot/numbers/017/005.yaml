id: NUM.17.5
reference: Numbers 17:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: ru
  text: как напоминание для сынов Израиля[a], чтобы никто посторонний[b], не из потомства Аарона, не приближался воскурять благовония пред Яхве и не стал подобен Корею и его общине, как Яхве сказал ему[d] через Моисея[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в памятный знак»; возможен также смысл «для памятования».'
    reason: lexical_alternative
  - marker: b
    text: «Посторонний» здесь — человек, не уполномоченный на священническое служение, а не обязательно чужеземец.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «рукой Моисея» — еврейское выражение со значением «через Моисея».'
    reason: lexical_alternative
  - marker: d
    text: Слово «ему», вероятнее всего, относится к Аарону.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: в напоминание
  rationale: Передаёт назначение предмета как постоянного напоминания; оборот естественен по-русски и сохраняет связь с предыдущим контекстом.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет семейно-заветную форму еврейского выражения в понятном библейском регистре.
- source_word: אִישׁ זָר
  choice: никто посторонний
  rationale: В священническом контексте речь идёт о человеке, не уполномоченном на это служение, а не обязательно об иноплеменнике.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: не из потомства Аарона
  rationale: Естественно и точно передаёт принадлежность к родовой линии Аарона.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: воскурять благовония
  rationale: Передаёт храмовое действие понятным современным выражением без излишне архаичного слова «курение».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Сохраняет пространственно-культовый смысл выражения и прямо передаёт личное имя יְהוָה.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: и не стал подобен Корею и его общине
  rationale: Сохраняет сравнение как с Кореем, так и с его группой, не уточняя сверх текста, имеется ли в виду поступок, положение или участь.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה בְּיַד מֹשֶׁה לוֹ
  choice: как Яхве сказал ему через Моисея
  rationale: Идиома «рукой Моисея» естественно передана как посредничество Моисея; местоимение «ему» сохранено без внесения имени в основной текст.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя и согласуется с предоставленным консультационным текстом.
- issue: Значение זָר в священническом контексте
  choice: посторонний
  alternative: чужеземец
  rationale: Ограничение связано с правом на священническое служение и происхождением от Аарона, а не с этнической принадлежностью.
- issue: Смысл сравнения с Кореем и его общиной
  choice: не стал подобен Корею и его общине
  alternative: не разделил участь Корея и его общины
  rationale: Более буквальная формулировка сохраняет открытым, относится ли предупреждение к их мятежному примеру, положению или постигшей их участи.
- issue: Референт местоимения לוֹ
  choice: ему
  alternative: Аарону
  rationale: Наиболее вероятен Аарон, однако сам еврейский текст оставляет имя невыраженным, поэтому неоднозначность сохранена в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формы «сынам Израиля» и «пред Яхве» сохраняют достоинство и структуру культового контекста; архаичные или неясные кальки избегаются. Стих начинается как продолжение предыдущего предложения, что отражено начальной строчной буквой.
