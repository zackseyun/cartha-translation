  source_fidelity: 'Смысловые компоненты еврейского текста переданы верно: памятное назначение, запрет для неааронова лица приближаться для воскурения перед Яхве, сравнение с Кореем и его общиной, а также посредничество Моисея. Местоимение «ему» обоснованно оставлено неоднозначным, с примечанием о вероятной отсылке к Аарону. Однако «в напоминание сынам Израиля» в современном литературном русском звучит как неполная и несколько тяжеловесная калька; более ясное «как напоминание для сынов Израиля» сохраняет конструкцию и смысл.'
  naturalness: '«Никто посторонний» и «не из потомства Аарона» естественны. «Воскурять благовония» уместно в умеренно библейском регистре. Замена начального оборота улучшает читаемость, не снижая торжественности. «Не стал подобен» сохраняется: оно не уточняет, в чём именно состоит сходство — в мятеже, положении или участи.'
