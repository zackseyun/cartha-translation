  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: ru
  text: 'И сказали израильтяне Моисею: «Вот, мы умираем! Мы погибаем! Все мы погибаем!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте подряд употреблены два разных глагола — «умираем» и «погибаем», после чего второй повторяется; так передаётся нарастающая паника народа.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Естественное современное обозначение народа; оно точно передаёт смысл еврейского выражения «сыны Израиля», не внося архаичной буквальности.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: 'И сказали ...:'
  rationale: Обычная русская формула введения прямой речи. Отдельное «говоря» было бы избыточным и неестественным.
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и здесь передаёт внезапную тревогу; «вот» сохраняет восклицательную непосредственность без архаизма.
- source_word: גָּוַעְנוּ
  choice: мы умираем
  rationale: Глагол означает умирание, угасание жизни. Настоящее время естественно передаёт испуганный возглас о грозящей гибели.
- source_word: אָבַדְנוּ
  choice: мы погибаем
  rationale: Глагол выражает гибель или уничтожение. «Погибаем» отличается от предшествующего «умираем» и сохраняет нарастание паники.
- source_word: כֻּלָּנוּ אָבָדְנוּ
  choice: Все мы погибаем
  rationale: Сохраняются и подчёркнутая всеобщность, и повтор глагола, создающий риторический напор.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткими, повторяющимися восклицаниями, которые сохраняют тревогу и риторическую напряжённость оригинала. Архаичные «сыны Израиля», «се» и избыточное «говоря» не использованы.
