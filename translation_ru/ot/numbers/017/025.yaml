  - severity: low
    issue: Сноска a неточно и тяжеловесно описывает референт «Свидетельства».
    rationale: Фраза «свидетельство, находившееся при ковчеге» может создать ложное впечатление, будто Свидетельство непременно располагалось рядом с ковчегом. Еврейский текст краток и, вероятно, отсылает к свидетельству завета в связи с ковчегом, но прямо ковчег не называет.
