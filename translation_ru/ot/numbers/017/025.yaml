revisions:
- from: 'И сказал Яхве Моисею: «Положи жезл Аарона обратно перед Свидетельством[a], чтобы он хранился как знак для сынов мятежа[b]. Так ты положишь конец их ропоту против Меня, и они не умрут».'
  to: 'И сказал Яхве Моисею: «Снова положи жезл Аарона перед Свидетельством[a], на хранение, как знак для мятежников[b], чтобы положить конец их ропоту против Меня и чтобы они не умерли».'
  rationale: Перевод исправлен только там, где буквальная калька и формулировка сноски ухудшали естественность либо могли неточно описать референт. «Мятежники» передаёт идиоматическое значение בני מרי, а буквальный образ сохранён в сноске. Сохранены личное имя «Яхве», культовый термин «Свидетельство», образ жезла как знака и целевая связь прекращения ропота с предотвращением смерти.
