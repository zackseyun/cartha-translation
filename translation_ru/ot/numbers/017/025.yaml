  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Снова положи жезл Аарона перед Свидетельством[a], на хранение, как знак для мятежников[b], чтобы положить конец их ропоту против Меня и чтобы они не умерли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Свидетельством», вероятно, подразумевается свидетельство завета, связанное с ковчегом; еврейский текст не уточняет этого подробнее.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «для сынов мятежа»; также возможно: «для непокорных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, посредством принятой русской транслитерации, а не заменяет его титулом.
- source_word: הָשֵׁב
  choice: Положи ... обратно
  rationale: Побудительная форма глагола שוב требует вернуть жезл на прежнее место; эта формулировка естественна по-русски и сохраняет значение возвращения.
- source_word: מַטֵּה
  choice: жезл
  rationale: В данном повествовании это посох, служащий знаком власти и священнического избрания; «жезл» передаёт обе стороны образа и соответствует возвышенному повествовательному регистру.
- source_word: לִפְנֵי הָעֵדוּת
  choice: перед Свидетельством
  rationale: Сохраняет краткость и предметную неоднозначность еврейского выражения, не добавляя прямо ни ковчег, ни скрижали. Заглавная буква обозначает специальное культовое наименование.
- source_word: לְמִשְׁמֶרֶת
  choice: чтобы он хранился
  rationale: Передаёт назначение жезла — оставаться на хранении, — естественной русской целевой конструкцией.
- source_word: לְאוֹת
  choice: как знак
  rationale: אוֹת обозначает видимый знак или свидетельствующее знамение; «знак» здесь ясно и без лишней архаики.
- source_word: לִבְנֵי מֶרִי
  choice: для сынов мятежа
  rationale: Сохраняет выразительную еврейскую конструкцию «сыны мятежа» и её мужской множественный образ, а более гладкое смысловое соответствие дано в сноске.
- source_word: וּתְכַל
  choice: Так ты положишь конец
  rationale: Hiphil от כלה означает довести до конца или прекратить. Формулировка сохраняет обращение именно к Моисею и передаёт целевой либо ожидаемый результат без чрезмерного уточнения логической связи.
- source_word: תְּלוּנֹּתָם מֵעָלַי
  choice: их ропоту против Меня
  rationale: «Ропот» естественно передаёт повторяющиеся недовольные жалобы Израиля, а «против Меня» выражает их направленность на Яхве.
- source_word: וְלֹא יָמֻתוּ
  choice: и они не умрут
  rationale: Сохраняет еврейское сочинение и связь прекращения ропота с предотвращением смерти, не усиливая модальность сверх текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит личное имя Бога; транслитерация сохраняет это отличие от титула אֲדֹנָי.
- issue: Референт הָעֵדוּת
  choice: Свидетельство
  alternative: ковчег Свидетельства / скрижали Свидетельства
  rationale: Контекст скинии допускает связь со свидетельством завета и ковчегом, однако сам стих называет лишь «Свидетельство»; перевод не устраняет эту метонимическую неоднозначность.
- issue: Образное выражение לִבְנֵי מֶרִי
  choice: сыны мятежа
  alternative: мятежники / непокорные
  rationale: Буквальный образ намеренно сохранён как заметная характеристика людей, без превращения его в специальную богословскую категорию; смысл поясняется в сноске.
- issue: Связь וּתְכַל ... וְלֹא יָמֻתוּ
  choice: Так ты положишь конец ... и они не умрут
  alternative: чтобы ты прекратил ... и чтобы они не умерли
  rationale: Еврейская последовательность может выражать цель или результат. Выбранная формулировка сохраняет тесную связь событий, но не делает синтаксическую цель более однозначной, чем позволяет оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; при этом сохранены личное имя «Яхве», техническое «Свидетельство» и намеренно заметный семитский образ «сыны мятежа».
