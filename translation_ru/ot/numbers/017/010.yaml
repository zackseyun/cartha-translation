  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: ru
  text: «Отделитесь от этой общины[a], и Я истреблю их в одно мгновение[b]». И они пали ниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Поднимитесь из среды этой общины»; возможно также: «Отойдите от этой общины».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я покончу с ними в один миг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Отделитесь
  rationale: Нифаль повелительного наклонения множественного числа от רום буквально передаёт идею поднятия или удаления, но в данном контексте служит настоятельным призывом выйти из среды общины. «Отделитесь» естественно выражает этот контекстуальный смысл.
- source_word: מִתּוֹךְ
  choice: от
  rationale: В сочетании с глаголом «отделитесь» предлог естественно передаёт удаление из среды группы; более буквальное «из среды» сохранено в сноске.
- source_word: הָעֵדָה הַזֹּאת
  choice: этой общины
  rationale: עֵדָה обозначает собранное сообщество Израиля. «Община» сохраняет коллективный смысл и не сводит слово лишь к отдельному собранию.
- source_word: וַאֲכַלֶּה
  choice: и Я истреблю
  rationale: Пиэль от כלה означает довести до конца, полностью уничтожить. «Истреблю» сохраняет суровость угрозы и хорошо сочетается с указанием на мгновенность.
- source_word: כְּרָגַע
  choice: в одно мгновение
  rationale: Оборот обозначает предельно краткое время; русское выражение «в одно мгновение» точно и естественно передаёт эту мысль.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: И они пали ниц
  rationale: Устойчивое русское библейское выражение точно передаёт падение лицом к земле как жест страха, поклонения или ходатайства, не уточняя мотив.
theological_decisions:
- issue: Характер Божьего повеления Моисею и Аарону
  choice: Повеление передано как требование отделиться от общины перед неминуемым судом.
  alternative: «Отойдите из среды этой общины» или более буквально «Поднимитесь из среды этой общины».
  rationale: Контекстуальное значение императива указывает на срочное удаление, а последующая фраза прямо выражает намерение Бога истребить общину; угроза не смягчается.
- issue: Связь между повелением и намерением Бога
  choice: Сочинительное «и Я истреблю» сохраняет последовательность еврейских формулировок.
  alternative: 'Целевое прочтение: «чтобы Я истребил их».'
  rationale: Еврейский וַאֲכַלֶּה допускает понимание как последующего намерения или цели. Русское «и Я истреблю» естественно передаёт непосредственную последовательность, не вводя более выраженную целевую конструкцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пали ниц» сохранено как понятное устойчивое выражение; синтаксис краток и передаёт срочность происходящего.
