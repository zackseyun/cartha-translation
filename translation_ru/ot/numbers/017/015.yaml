- from: Тогда Аарон вернулся к Моисею, ко входу в шатёр встречи, и мор прекратился.[a]
  to: Тогда Аарон вернулся к Моисею у входа в шатёр встречи, и мор был остановлен.[a]
  rationale: Исправление сохраняет последовательность и все смысловые компоненты еврейского текста, но точнее передаёт пассивную форму נֶעֱצָרָה. Перестановка обстоятельства снимает синтаксическую двусмысленность, а сноска перенесена к слову, к которому относится. Явный божественный деятель не добавляется.
