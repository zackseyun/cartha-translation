  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: ru
  text: Тогда Аарон вернулся к Моисею у входа в шатёр встречи, и мор был остановлен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прекратился»; «был сдержан»; «был удержан».'
    reason: 'Лексические варианты для נֶעֱצָרָה: нифаль глагола עצר обозначает прекращение или сдерживание мора и не называет действующего лица.'
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Тогда Аарон вернулся
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт очередность событий, а שׁוּב — возвращение.
- source_word: אֶל מֹשֶׁה
  choice: к Моисею
  rationale: Предлог אֶל обозначает движение к лицу; повторное «назад» не требуется, поскольку это уже выражено глаголом «вернулся».
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ко входу в шатёр встречи
  rationale: Пֶתַח означает вход или проём. «Шатёр встречи» прозрачно передаёт אֹהֶל מוֹעֵד и сохраняет образ временного святилища.
- source_word: הַמַּגֵּפָה
  choice: мор
  rationale: מַגֵּפָה обозначает смертоносное бедствие или поражение, особенно в контексте суда. «Мор» кратко и естественно называет массовую гибель от бедствия, не сводя её к медицински определённой эпидемии.
- source_word: נֶעֱצָרָה
  choice: прекратился
  rationale: Нифаль от עצר указывает, что мор был остановлен и больше не продолжался. Русское «прекратился» естественно выражает результат, не называя действующее лицо, которого еврейская фраза прямо не указывает.
theological_decisions:
- issue: Подразумеваемое Божье действие в прекращении мора
  choice: 'Не называть Бога явным действующим лицом: «мор прекратился»'
  alternative: «Господь остановил мор»; «мор был остановлен»
  rationale: Контекст подразумевает Божье действие, однако в самом предложении употреблена пассивная форма без названного деятеля. Перевод сохраняет эту сдержанность и не делает подразумеваемое явным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Шатёр встречи» понятен и ближе к образу исходного текста, чем традиционно-конфессиональные термины. Запятая перед обстоятельством места помогает показать, что оно относится к местонахождению Моисея, а не вводит второй пункт назначения.
