    rationale: «Мор прекратился» сообщает результат, но не передаёт столь отчётливо, что мор был остановлен/сдержан; нифаль в еврейском тексте допускает и поддерживает безличный пассив без называния деятеля.
  - severity: low
    issue: Неудачное присоединение обстоятельства места
    rationale: Форма «к Моисею, ко входу в шатёр» способна восприниматься как движение к двум пунктам. «К Моисею у входа» естественнее выражает связь Моисея с указанным местом.
  - severity: low
    issue: Сноска поставлена после всего предложения, а не у переводимого слова
    rationale: Сноска относится к נֶעֱצָרָה и должна быть привязана к «был остановлен», а не к финальной точке предложения.
