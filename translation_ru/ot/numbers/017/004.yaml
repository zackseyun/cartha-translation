  source_fidelity: 'Основные соответствия исходному тексту сохранены: Елеазар назван священником, נְחֹשֶׁת уместно передано как «бронза», מַחְתּוֹת — как «кадильницы», а страдательное הַשְּׂרֻפִים не превращено в интерпретирующее именование. Однако «расковали в обкладку» неточно передаёт רקע («расплющить/выбить металл») и неудачно выражает результат צִפּוּי.'
