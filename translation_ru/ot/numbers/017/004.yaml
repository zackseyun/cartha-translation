base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: ru
  text: И священник Елеазар взял бронзовые кадильницы[a], которые принесли те, кто был сожжён[b], и их расплющили, сделав из них покрытие[c] для жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жаровни».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сожжённые»; имеются в виду люди, поражённые огнём в предшествующем рассказе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «облицовку» или «накладку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: кадильницы
  rationale: Обозначает сосуды для горящих углей и благовоний; «кадильницы» ясно передаёт их культовое назначение. Возможное более буквальное обозначение дано в сноске.
- source_word: הַנְּחֹשֶׁת
  choice: бронзовые
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в описаниях принадлежностей святилища уместен традиционный русский эквивалент «бронзовые».
- source_word: הִקְרִיבוּ
  choice: принесли
  rationale: В породе hифиль глагол имеет культовое значение «принести, поднести как приношение». Здесь «принесли» естественно по-русски и не уточняет сверх текста, было ли это принято как жертва.
- source_word: הַשְּׂרֻפִים
  choice: сожжённые
  rationale: Субстантивированное страдательное причастие от שׂרף сохранено конкретно и кратко; оно отсылает к людям, поражённым огнём в предшествующем рассказе.
- source_word: וַיְרַקְּעוּם
  choice: и их расковали
  rationale: רקע означает расплющивать или расковывать металл. Неопределённо-личная русская конструкция сохраняет множественное число глагола и объект, не назначая названного в тексте исполнителя.
- source_word: צִפּוּי
  choice: обкладку
  rationale: Существительное обозначает покрытие или металлическую облицовку; «обкладка» точно подходит к раскованному металлу на жертвеннике.
- source_word: לַמִּזְבֵּחַ
  choice: для жертвенника
  rationale: 'Предлог ל выражает назначение или результат: металл был превращён в обкладку, предназначенную для жертвенника.'
theological_decisions:
- issue: Статус действий погибших с кадильницами
  choice: «которые принесли»
  alternative: «которые принесли как приношение» / «которые поднесли»
  rationale: Формулировка сохраняет культовый оттенок הִקְרִיבוּ, но не вводит дополнительного богословского суждения о принятии их действия Богом.
- issue: Обозначение погибших
  choice: «сожжённые»
  alternative: «те, кто был сожжён» / «те, кого поглотил огонь»
  rationale: Выбор сохраняет резкую и конкретную форму еврейского страдательного причастия, не разворачивая её в толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейской последовательности действий; неопределённо-личное «их расковали» сохраняет невыраженного исполнителя. Термины понятны широкому читателю, а менее очевидные варианты вынесены в сноски.
