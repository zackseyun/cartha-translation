base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: ru
  text: 'Моисей обратился к сынам Израиля[a], и все их вожди дали ему по посоху: по одному посоху от каждого вождя, согласно их родовым домам, — двенадцать посохов; посох Аарона был среди их посохов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля» — обычное обозначение народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В повествовательном введении глагол דבר естественно передаётся русским «сказал»; это ясно выражает обращение Моисея к народу.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранено буквальное и традиционное заветное обозначение народа; современная обобщающая альтернатива указана в сноске.
- source_word: נְשִׂיאֵיהֶם
  choice: их вожди
  rationale: В данном контексте נָשִׂיא обозначает признанных глав колен. «Вожди» передаёт общественное положение без монархического оттенка слова «князья».
- source_word: מַטֶּה
  choice: посох
  rationale: Речь идёт о физическом предмете, служащем знаком представительства; «посох» естественнее в современном русском, чем «жезл», и сохраняет конкретность образа.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: по одному от каждого вождя
  rationale: 'Сжатая русская формулировка сохраняет распределительное значение еврейского повтора: каждому вождю соответствует один посох.'
- source_word: לְבֵית אֲבֹתָם
  choice: по их родовым домам
  rationale: Фраза указывает на представительство патрилинейных родовых объединений; «родовые дома» понятно передаёт древнеизраильскую структуру родства.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: всего двенадцать посохов
  rationale: Добавленное «всего» естественно вводит итоговый счёт, не меняя содержания исходного текста.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: посох Аарона был среди их посохов
  rationale: Именное предложение передано со связкой «был»; «среди» сохраняет смысл включённости посоха Аарона в собранную группу.
