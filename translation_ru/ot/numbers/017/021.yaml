  to: 'Моисей обратился к сынам Израиля[a], и все их вожди дали ему по посоху: по одному посоху от каждого вождя, согласно их родовым домам, — двенадцать посохов; посох Аарона был среди их посохов.'
  rationale: Правка уточняет управление глагола речи и синтаксически привязывает «родовые дома» к представительству вождей, не добавляя исторических или богословских выводов. Убрано слово «всего» как не обязательное для передачи исходного текста; числовой итог сохранён.
