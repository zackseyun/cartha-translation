  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: ru
  text: Имя Аарона напиши на посохе Левия, ибо один посох — для каждого главы их отцовского дома.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо один посох — для главы их отцовского дома». Еврейскую фразу можно понимать как общее правило: каждый глава отцовского дома представлен одним посохом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: '[не передано отдельно]'
  rationale: Союз продолжает предыдущее повеление, но в русском отдельное «и» здесь не обязательно; показатель прямого дополнения אֵת не переводится.
- source_word: שֵׁם אַהֲרֹן
  choice: имя Аарона
  rationale: Естественная русская конструкция, обозначающая имя, которое следует начертать на посохе.
- source_word: תִּכְתֹּב
  choice: напиши
  rationale: Имперфект 2-го лица мужского рода единственного числа в контексте прямого наставления естественно передаётся русским повелительным наклонением.
- source_word: עַל מַטֵּה לֵוִי
  choice: на посохе Левия
  rationale: «Посох» передаёт конкретный предмет и его представительскую функцию; «Левия» сохраняет форму исходного текста, подразумевающую колено Левия.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного указания.
- source_word: מַטֶּה אֶחָד
  choice: один посох
  rationale: Сохраняется акцент на единственном представительном посохе.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: для каждого главы рода
  rationale: 'רֹאשׁ обозначает главу или руководителя, а בֵּית אָבוֹת — родовую, отцовскую семейную группу. Дистрибутивное «каждого» естественно выражает правило: одному главе соответствует один посох, хотя формально возможен и недистрибутивный разбор.'
