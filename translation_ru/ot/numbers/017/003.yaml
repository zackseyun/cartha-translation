base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: ru
  text: Кадильницы этих людей, согрешивших ценой собственной жизни[a], пусть раскуют в тонкие металлические пластины[b] для покрытия жертвенника, потому что их принесли перед Яхве и они стали святыми[c]; и будут они знамением для сынов Израиля[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «согрешивших своей жизнью» или «против своей жизни»; то есть их грех стоил им жизни. Возможно также: «этих грешников».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в кованые листы»; речь идёт о металле, расплющенном ударами.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «были освящены». Наиболее естественно понимать, что речь идёт о кадильницах.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «для израильтян». Буквально: «для сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: кадильницы
  rationale: В данном культовом контексте речь идёт о сосудах для воскурения благовоний; «кадильницы» — ясный и устойчивый русский эквивалент.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: этих людей, согрешивших ценой собственной жизни
  rationale: Причастие передано событийно, а идиома בְּנַפְשֹׁתָם выражает гибельное для них самих последствие греха. Формулировка сохраняет связь греха с утратой жизни, не вводя учения о «душе» как отдельной субстанции.
- source_word: וְעָשׂוּ אֹתָם רִקֻּעֵי פַחִים
  choice: пусть раскуют в тонкие металлические пластины
  rationale: Контекст продолжает повеление предыдущего стиха. «Раскуют» естественно передаёт изготовление тонких листов ударами, а указание на металл делает предметный смысл פַחִים ясным.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: для покрытия жертвенника
  rationale: Передаёт назначение раскованных пластин как облицовки или покрытия жертвенника без лишней технической конкретизации.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: потому что их принесли пред Яхве
  rationale: Глагол имеет культовый смысл «приблизить, представить, принести». «Принесли» естественно по-русски и подходит к кадильницам; «пред» поддерживает торжественный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: וַיִּקְדָּשׁוּ
  choice: они стали святыми
  rationale: Ближайший и наиболее естественный субъект множественного числа — кадильницы. Формулировка сохраняет результативное значение и не уточняет агент действия сверх текста.
- source_word: וְיִהְיוּ לְאוֹת
  choice: пусть они будут знамением
  rationale: Форма продолжает директивный смысл; «знамение» передаёт памятно-предупредительную функцию, не раскрывая её толковательно.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Формальная корпоративная формула сохраняет образный язык исходного текста; предлог естественно передан как «для».
theological_decisions:
- issue: К чему относится утверждение «стали святыми»
  choice: Кадильницы стали святыми после того, как их принесли пред Яхве.
  alternative: Святыми в некотором культовом смысле стали принесшие их люди; либо сосуды были лишь обрядово посвящены.
  rationale: 'Грамматически ближайший субъект множественного числа — кадильницы, а дальнейшее использование металла для жертвенника объясняется их приобретённой святостью. Сохраняется напряжение текста: предметы мятежников получили священный статус.'
- issue: Смысл בְּנַפְשֹׁתָם
  choice: Их грех обошёлся им собственной жизнью.
  alternative: Они согрешили против своей жизни; они согрешили своими душами.
  rationale: В повествовательном контексте выражение указывает на саморазрушительный мятеж, завершившийся смертью, а не формулирует особую антропологию души.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён для ясности, но сохранены культовые термины, личное имя Яхве и формула «сыны Израиля». Все смысловые альтернативы, существенные для неоднозначности исходного текста, вынесены в примечания.
