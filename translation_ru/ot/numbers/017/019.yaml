base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: ru
  text: И положи их в шатре собрания перед свидетельством[a], где Я буду встречаться с вами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед свидетельством завета». Под «свидетельством», вероятно, подразумевается свидетельство завета, связанное со скрижалями в святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «где Я являю Себя вам»; возможен также смысл: «где Я назначаю встречу с вами».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: И положи их
  rationale: Хифиль глагола נוח/ניח во 2-м лице мужского рода единственного числа с суффиксом 3-го лица множественного числа выражает побуждение к размещению предметов. Русское «положи» естественно передаёт повелительную силу формы в данном контексте.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Устойчивое обозначение святилища передано прозрачно и без превращения описательного названия в имя собственное.
- source_word: לִפְנֵי הָעֵדוּת
  choice: перед свидетельством
  rationale: לִפְנֵי означает «перед, пред лицом», а הָעֵדוּת — буквально «свидетельство». Буквальная формулировка сохраняет неуточнённость того, подразумеваются ли скрижали, ковчег или свидетельство завета в более широком смысле.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: где Я встречаюсь
  rationale: Нифаль глагола יעד в контексте святилища обозначает назначенную встречу. Сочетание אֲשֶׁר со שָׁמָּה естественно передаётся русским относительным наречием «где».
- source_word: לָכֶם
  choice: с вами
  rationale: Хотя предлог буквально имеет значение «к/для вас», в сочетании с יעד по-русски естественно говорить «встречаться с вами».
- source_word: שָׁמָּה
  choice: выражено словом «где»
  rationale: Значение наречия «там» включено в русское «где», что устраняет неестественное удвоение «где… там» без смысловой потери.
theological_decisions:
- issue: К чему относится «свидетельство»
  choice: Сохранить буквальное «свидетельство», не уточняя референт.
  alternative: «скрижали свидетельства», «ковчег свидетельства» или «свидетельство завета»
  rationale: Еврейский текст здесь не называет прямо ни скрижали, ни ковчег. Более конкретный вариант снял бы сохраняющуюся в оригинале смысловую открытость.
- issue: Значение формы אִוָּעֵד
  choice: «Я встречаюсь»
  alternative: «Я являю Себя вам» или «Я назначаю встречу с вами»
  rationale: Основное контекстуальное значение связано с назначенной встречей Бога с народом у святилища; при этом иные оттенки отмечены в сноске, а не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Я», относящееся к Богу, написано с прописной буквы по устойчивой русской издательской традиции. Формулировка остаётся ясной для широкого читателя и не конкретизирует сверх текста предмет, названный «свидетельством».
