  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: ru
  text: Скажи Елеазару, сыну священника Аарона, чтобы он поднял кадильницы из огня[a], а огонь разбросал подальше, потому что кадильницы стали святыми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из места сожжения»; возможны также значения «из горения» или «из обгоревших остатков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что они святы». Еврейская форма может подчёркивать состояние, возникшее в результате: «стали святыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Скажи
  rationale: Императив глагола אמר естественно передаётся русским повелительным «скажи» и вводит поручение, которое Моисей должен передать Елеазару.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Елеазару, сыну священника Аарона
  rationale: Порядок слов в еврейской именной цепочке естественнее всего связывает определение «священник» с Аароном. Русская формулировка устраняет синтаксическую неясность без добавления чуждой тексту информации.
- source_word: וְיָרֵם
  choice: чтобы он поднял
  rationale: Юссив после императива выражает содержание поручения; конструкция «скажи... чтобы он» естественна для современного русского языка.
- source_word: הַמַּחְתֹּת
  choice: кадильницы
  rationale: מחתה обозначает сосуд для горящих углей и благовоний. В данном культовом контексте традиционное и понятное русское «кадильницы» точнее функционального «жаровни».
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: из пожарища
  rationale: שׂרפה может обозначать горение, место огня или обгоревшие остатки. «Из пожарища» кратко передаёт место недавнего губительного огня, не сводя значение только к пламени или останкам.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: а огонь разбросал подальше
  rationale: זרה означает разбрасывать или рассеивать, а הָלְאָה — дальше, прочь. Сочетание сохраняет конкретный образ рассеивания огня, вероятно горящих углей.
- source_word: כִּי קָדֵשׁוּ
  choice: потому что кадильницы стали святыми
  rationale: Перфект קדשו передаёт возникшее состояние святости. Повтор существительного вместо местоимения нужен по-русски для ясности, поскольку ближайшее слово «огонь» стоит в единственном числе, а глагол в источнике — во множественном.
theological_decisions:
- issue: К чему относится множественное число в כִּי קָדֵשׁוּ
  choice: К кадильницам
  alternative: К совокупности предметов, связанных с приношением, включая огонь
  rationale: Ближайший подходящий антецедент во множественном числе — הַמַּחְתֹּת, «кадильницы». Это согласуется с дальнейшим изготовлением из них покрытия для жертвенника, тогда как огонь велено рассеять.
- issue: Значение перфекта קָדֵשׁוּ
  choice: «стали святыми» как достигнутое результирующее состояние
  alternative: «святы» как простое обозначение состояния
  rationale: Перфект допускает акцент как на наступлении, так и на наличии состояния. Основной текст передаёт результат предшествующего принесения кадильниц, а примечание сохраняет более статическое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сделан ясным и естественным; культовый термин «кадильницы» сохранён как общеупотребительный. Повтор «кадильницы» в последней части предотвращает ошибочное отнесение святости к огню.
