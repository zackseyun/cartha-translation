  text: Они отправились из Макхелота и расположились станом в Тахате.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало пути в современном русском языке.
- source_word: מִמַּקְהֵלֹת
  choice: из Макгелофа
  rationale: Предлог מִן передан как «из», а название стоянки מַקְהֵלֹת транслитерировано в форме «Макгелоф» с русским падежным окончанием.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает остановку и устройство лагеря; традиционное, но понятное выражение «расположились станом» точно подходит к формуле маршрута.
- source_word: בְּתָחַת
  choice: в Тахафе
  rationale: Предлог בְּ при названии места естественно передаётся русским «в»; топоним תָחַת транслитерирован как «Тахаф» и поставлен в предложный падеж.
