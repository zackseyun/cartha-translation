  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: ru
  text: Они отправились из Овофа и расположились станом в Ийе-Авариме[a], на границе Моава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иййе-Аварим»; еврейское название, возможно, связано со словами «развалины» и «Аварим» (или «области по ту сторону»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле описания странствий глагол נסע означает сняться с места и двинуться дальше; «отправились» естественно передаёт начало следующего перехода.
- source_word: מֵאֹבֹת
  choice: из Овофа
  rationale: Предлог מֵ указывает на исходный пункт, а אֹבֹת является названием места; использована традиционная русская форма топонима.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря; формула «расположились станом» сохраняет конкретный смысл и соответствует возвышенному, но понятному повествовательному регистру.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: в Ийе-Авариме
  rationale: Сочетание функционирует как топоним. Транслитерация сохраняет название и не превращает возможную этимологию в однозначный перевод.
- source_word: בִּגְבוּל
  choice: на границе
  rationale: גְּבוּל может означать границу, пограничную область или территорию; здесь «на границе» наиболее прямо передаёт местонахождение, не утверждая, что стоянка находилась в глубине моавитской земли.
- source_word: מוֹאָב
  choice: Моава
  rationale: Употреблена общепринятая русская форма названия Моав в родительном падеже после слова «граница».
