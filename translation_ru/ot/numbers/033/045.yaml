  text: וַ/יִּסְע֖וּ מֵ/עִיִּ֑ים וַֽ/יַּחֲנ֖וּ בְּ/דִיבֹ֥ן גָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: ru
  text: Они отправились из Ийима и разбили лагерь в Дивон-Гаде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формулах перечня стоянок обозначает выступление с прежнего места; «отправились» естественно передаёт начало пути.
- source_word: מֵעִיִּים
  choice: из Ийима
  rationale: Предлог מֵ передан как «из», а топоним עִיִּים транслитерирован в форме «Ийим», отражающей два йода и удобной для русского чтения.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в путевых сообщениях означает остановиться и разбить лагерь; традиционно понятное выражение «расположились станом» точно передаёт эту формулу.
- source_word: בְּדִיבֹן גָּד
  choice: в Дивон-Гаде
  rationale: Предлог בְּ при месте стоянки естественно передаётся русским «в»; сочетание сохранено как составной топоним «Дивон-Гад».
