  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: ru
  text: Они отправились из Алуша и разбили лагерь в Рефидиме, но там не было воды для питья.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Отправившись
  rationale: Глагол נסע в формуле описания переходов означает сняться со стоянки и двинуться дальше. Деепричастная конструкция естественно передаёт последовательность тесно связанных действий.
- source_word: מֵאָלוּשׁ
  choice: из Алуша
  rationale: Географическое название передано транслитерацией; предлог מִן обозначает исходную точку пути.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה обозначает остановку и устройство лагеря. Выражение сохраняет характер повествования о странствиях и звучит достойно и понятно.
- source_word: בִּרְפִידִם
  choice: в Рефидиме
  rationale: Географическое название передано принятой русской библейской формой; предлог ב обозначает место стоянки.
- source_word: וְלֹא הָיָה שָׁם
  choice: но там не было
  rationale: Союз ו здесь вводит неблагоприятное обстоятельство, поэтому русское «но» естественно выражает контраст, не меняя смысла.
- source_word: מַיִם
  choice: воды
  rationale: В отрицательной конструкции русский родительный падеж «не было воды» является нормативным соответствием еврейскому מַיִם.
- source_word: לָעָם
  choice: народу
  rationale: עָם обозначает израильский народ как единое целое; дательный падеж сохраняет конструкцию предназначения.
- source_word: לִשְׁתּוֹת
  choice: чтобы … пить
  rationale: 'Инфинитив выражает назначение: вода, предназначенная для питья народом.'
