  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: ru
  text: Они отправились из пустыни Син и расположились станом в Дофке.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле путевого перечня означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт это значение в современном русском языке.
- source_word: מִמִּדְבַּר
  choice: из пустыни
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «пустыня» — ясное и традиционное русское соответствие в данном географическом названии.
- source_word: סִין
  choice: Син
  rationale: Это топоним, поэтому он передан транслитерацией; в русском языке слово не вызывает смыслового смешения с понятием греха, как в английском.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает остановиться лагерем. Выражение «расположились станом» сохраняет характер путевого перечня и остаётся понятным в современном литературном русском языке.
- source_word: בְּדָפְקָה
  choice: в Дофке
  rationale: Предлог בְּ указывает место стоянки. Название דָּפְקָה передано русской библейской формой «Дофка» и поставлено в предложный падеж.
theological_decisions: []
