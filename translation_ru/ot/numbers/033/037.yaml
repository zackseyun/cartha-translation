base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: ru
  text: Они отправились из Кадеша[a] и расположились станом у горы Ор[b], на краю земли Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит «Кадеш»; в некоторых переводах название уточняется как «Кадес-Варни» на основании более широкого контекста.
    reason: alternative_reading
  - marker: b
    text: 'Буквально по-еврейски: «у Ора, горы»; традиционная передача названия — «у горы Ор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с прежнего места и отправиться дальше; этот вариант естественен для современного русского языка.
- source_word: מִקָּדֵשׁ
  choice: из Кадеша
  rationale: В еврейском тексте употреблено краткое название קָדֵשׁ, поэтому оно не расширено до «Кадес-Варни».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство стоянки. Выражение сохраняет конкретный образ лагеря и достойный повествовательный регистр.
- source_word: בְּהֹר הָהָר
  choice: у горы Ор
  rationale: Буквальная конструкция «у Ора, горы» передана общепринятой русской формой географического названия «гора Ор».
- source_word: בִּקְצֵה
  choice: на краю
  rationale: Слово קצה обозначает край или оконечность; перевод не уточняет без необходимости, шла ли речь именно о политической границе.
- source_word: אֶרֶץ אֱדוֹם
  choice: земли Эдома
  rationale: Прямой и естественный перевод названия территории; сохраняет обычное библейское значение אֶרֶץ.
