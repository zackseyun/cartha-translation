  text: 'И Яхве сказал Моисею на равнинах Моава[a], у Иордана, напротив Иерихона:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в степях Моава».'
    reason: Лексическая альтернатива для עַרְבֹת; соответствует английской аудиторской сноске.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И говорил
  rationale: Форма с последовательным waw продолжает повествование; «говорил» передаёт דבר и не дублирует вводное לאמר отдельным русским деепричастием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: ערבות обозначает равнинную степную местность; «равнины Моава» — естественное и устоявшееся географическое выражение.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: у Иордана, напротив Иерихона
  rationale: В данном географическом обороте על указывает на расположение у Иордана, а Иерихон уточняет участок реки — напротив города.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Русское двоеточие естественно вводит прямую речь следующего стиха и функционально передаёт еврейское לאמר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это, не заменяя имя титулом.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранена формула продолжения рассказа; ввод прямой речи оформлен естественным для русского языка двоеточием.
