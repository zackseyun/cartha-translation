lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: Аарону
  rationale: Соединительный ו продолжает повествование и по-русски не требует обязательной передачи союзом «и» в начале отдельного стиха; имя אַהֲרֹן передано в принятой русской библейской форме «Аарон».
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: было сто двадцать три года
  rationale: Еврейская возрастная формула «сын … лет» естественно передаётся русской конструкцией с дательным падежом и глаголом «было»; числительное соответствует 123.
- source_word: בְּ/מֹת/וֹ
  choice: когда он умер
  rationale: Предлог בְּ при отглагольном имени «смерть» с местоименным суффиксом имеет временное значение; придаточное предложение ясно и естественно передаёт смысл.
- source_word: בְּ/הֹר הָ/הָר
  choice: на горе Ор
  rationale: הֹר הָהָר — географическое название горы; русская традиционная форма — «гора Ор», а предлог «на» соответствует месту смерти на горе.
