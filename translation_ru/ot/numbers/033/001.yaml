source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: ru
  text: Вот этапы пути[a] сынов Израиля[b], вышедших из земли Египта по своим отрядам[c] под руководством[d] Моисея и Аарона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переходы», «странствия» либо «выступления». Еврейское слово обозначает последовательные этапы маршрута.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть израильтян; буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по своим войскам», «по своим подразделениям». Еврейское слово может иметь организованный, в том числе военный, смысл.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «рукою Моисея и Аарона» — еврейский оборот, указывающий на их посредничество или руководство.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественно вводит следующий далее перечень и передаёт указательное значение еврейской формы без необходимости добавлять связку.
- source_word: מַסְעֵי
  choice: этапы пути
  rationale: Существительное обозначает последовательные переходы или стоянки на маршруте; этот вариант ясно передаёт структуру путевого перечня.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранён буквальный родовой образ исходного выражения, хорошо понятный в русском библейском контексте.
- source_word: אֲשֶׁר יָצְאוּ
  choice: вышедших
  rationale: Причастный оборот естественно по-русски передаёт определительное придаточное и сохраняет значение выхода из Египта.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египта
  rationale: Сохранено явно присутствующее в еврейском тексте слово «земля», но использована современная русская конструкция.
- source_word: לְצִבְאֹתָם
  choice: по своим отрядам
  rationale: Передаёт организованное распределение народа по подразделениям, не утверждая однозначно, что речь идёт о войсках в боевом смысле.
- source_word: בְּיַד
  choice: под руководством
  rationale: Передано идиоматическое значение действия через посредство или под началом Моисея и Аарона; буквальный образ отмечен в сноске.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Моисея и Аарона
  rationale: Употреблены традиционные и общепринятые русские формы имён в требуемом падеже.
