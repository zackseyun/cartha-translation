  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: ru
  text: Они отправились из Риммон-Переца и расположились станом в Ливне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало следующего перехода.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: из Риммон-Переца
  rationale: Предлог מִן передаёт исходную точку движения. Составной топоним רִמֹּן פָּרֶץ передан транслитерацией и склоняется в русском предложении.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в описании пути означает остановиться и разбить лагерь; устойчивое русское выражение «расположились станом» сохраняет образ стоянки и соответствует достойному повествовательному регистру.
- source_word: בְּלִבְנָה
  choice: в Ливне
  rationale: Предлог בְּ обозначает место стоянки. Топоним לִבְנָה передан традиционной русской библейской формой «Ливна» и поставлен в предложный падеж.
