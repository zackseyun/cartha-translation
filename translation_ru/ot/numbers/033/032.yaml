lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало следующего перехода.
- source_word: מִבְּנֵי יַעֲקָן
  choice: из Бене-Яакана
  rationale: В данном перечне בְּנֵי יַעֲקָן функционирует как географическое название; транслитерация сохраняет это значение, а предлог מִ передан словом «из».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря или стоянки. Выражение «расположились станом» ясно и достойно передаёт устойчивую маршрутную формулу.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: в Хор-Гаггидгаде
  rationale: Это географическое название, поэтому оно транслитерировано; предлог בְּ обозначает место, а русское окончание передаёт предложный падеж.
