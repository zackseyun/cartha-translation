  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: ru
  text: Они отправились из Ефама, повернули назад к Пи-Гахирофу[a], что напротив Баал-Цефона, и расположились станом перед Мигдолом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернулись». Еврейский глагол может обозначать как возвращение, так и поворот в обратном направлении; здесь, вероятно, имеется в виду изменение маршрута.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: Они отправились из Ефама
  rationale: Глагол נסע в формулах перечня стоянок означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт начало перехода. Название места транслитерировано.
- source_word: וַיָּשָׁב
  choice: повернули назад
  rationale: שׁוב может означать возвращение либо поворот в обратном направлении; в описании маршрута выражение «повернули назад» сохраняет оба смысловых компонента и не утверждает, что они вернулись в уже названное место.
- source_word: עַל־פִּי הַחִירֹת
  choice: к Пи-Гахирофу
  rationale: Предлог עַל при топониме здесь обозначает направление или достижение места в маршруте. «К» звучит естественно и не создаёт ложного буквального образа. Топоним передан транслитерацией.
- source_word: אֲשֶׁר עַל־פְּנֵי בַּעַל צְפֹן
  choice: что напротив Баал-Цефона
  rationale: עַל־פְּנֵי выражает пространственное положение перед чем-либо или напротив него; «напротив» уместно для географического ориентира и согласуется с контекстом.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: חנה означает разбить лагерь, остановиться станом. Формулировка современна, ясна и сохраняет характер повествования о переходах Израиля.
- source_word: לִפְנֵי מִגְדֹּל
  choice: перед Мигдолом
  rationale: לִפְנֵי обозначает положение перед объектом или местом. Мигдол здесь функционирует как топоним, поэтому не переводится словом «башня».
