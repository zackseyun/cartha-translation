  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: ru
  text: Возьмите землю во владение и поселитесь на ней, потому что Я дал вам эту землю, чтобы вы владели ею[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы получили её в наследие». Еврейский глагол ירשׁ может означать как овладение, так и получение в наследие, особенно когда речь идёт об обещанной Богом земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: возьмите во владение
  rationale: Форма от ירשׁ в данном контексте выражает повеление овладеть землёй. Поскольку прямое дополнение — «земля», перевод «возьмите землю во владение» естественнее, чем буквальное «лишите землю владения» или добавление не названных здесь жителей.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Обычное и контекстуально точное обозначение обещанной территории.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: и поселитесь на ней
  rationale: ישׁב здесь означает устойчивое проживание на земле; «поселитесь» передаёт не просто пребывание, а заселение и обитание.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание повеления: земля должна быть занята, поскольку Бог уже дал её Израилю.'
- source_word: לָכֶם נָתַתִּי
  choice: Я дал вам
  rationale: Перфект נָתַתִּי представляет дар как совершившийся и служащий основанием последующего действия; русское прошедшее время естественно передаёт эту функцию.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: чтобы вы владели ею
  rationale: Инфинитив выражает цель дарования земли. «Владели ею» сохраняет смысл обладания и избегает тяжеловесного повтора «взять её во владение».
theological_decisions:
- issue: Значение ירשׁ в контексте обещанной земли
  choice: взять во владение / владеть
  alternative: получить в наследие / унаследовать
  rationale: Ближайший контекст говорит о фактическом овладении землёй и заселении её, однако у ירשׁ в контексте заветного обещания возможен также оттенок наследования. Основной текст передаёт непосредственный смысл владения, а допустимая альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной формой и умеренно торжественным библейским регистром. Местоимение «Я» написано с прописной буквы как прямая речь Бога.
