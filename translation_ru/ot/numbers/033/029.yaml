  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: ru
  text: Они отправились из Митки и расположились станом в Хашмоне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало дальнейшего пути.
- source_word: מִמִּתְקָה
  choice: из Митки
  rationale: Предлог מִן передаёт исходную точку («из»), а топоним מִתְקָה транслитерирован как «Митка» и поставлен в требуемый русской грамматикой родительный падеж.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря или стоянки; традиционное и понятное выражение «расположились станом» соответствует стилю перечня переходов.
- source_word: בְּחַשְׁמֹנָה
  choice: в Хашмоне
  rationale: Предлог בְּ при месте стоянки естественно передан русским «в», а топоним חַשְׁמֹנָה транслитерирован как «Хашмона» и поставлен в предложный падеж.
