  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: ru
  text: Они отправились из Мосерота и расположились станом в Бене-Яакане[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское Бене-Яакан буквально означает «сыновья Яакана», но здесь это название места.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле описания переходов глагол נסע означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт это в современном русском языке.
- source_word: מִמֹּסֵרֹות
  choice: из Мосерота
  rationale: Предлог מִן передан как «из», а топоним מֹסֵרוֹת транслитерирован с учётом его еврейского звучания и русской падежной формы.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в перечне стоянок означает разбить лагерь; выражение «расположились станом» сохраняет достоинство библейского повествования и остаётся понятным современному читателю.
- source_word: בִּבְנֵי יַעֲקָן
  choice: в Бене-Яакане
  rationale: Сочетание буквально означает «сыновья Яакана», однако здесь служит названием места; предлог ב естественно передан русским «в».
