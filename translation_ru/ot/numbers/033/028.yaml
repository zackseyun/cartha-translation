lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с места и отправиться в путь; «отправились» естественно передаёт начало перехода.
- source_word: מִתָּרַח
  choice: от Тараха
  rationale: Предлог מִן указывает исходный пункт, а תָּרַח передаётся как название места «Тарах» с нормативным русским склонением после «от».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает остановиться и разбить лагерь; традиционно понятное выражение «расположились станом» сохраняет конкретный образ стоянки и подходит к достоинству библейского повествования.
- source_word: בְּמִתְקָה
  choice: в Митке
  rationale: Предлог בְּ обозначает место стоянки. Название מִתְקָה передано как «Митка» и поставлено в предложный падеж после «в».
