lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле перечисления стоянок глагол נסע означает выступление в путь. «Отправились» естественно звучит по-русски и точно передаёт начало перехода.
- source_word: מִמִּדְבַּר סִינָי
  choice: из Синайской пустыни
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; географическое сочетание естественно передаётся устоявшимся русским названием «Синайская пустыня».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в маршруте означает остановиться и разбить лагерь. «Расположились станом» сохраняет значение стоянки и достойный повествовательный регистр.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: в Киврот-Гаттааве
  rationale: Это географическое название, поэтому оно транслитерировано; предлог בְּ при пункте стоянки естественно передан как «в». Значение названия вынесено в сноску.
