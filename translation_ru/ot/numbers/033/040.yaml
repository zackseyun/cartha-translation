- from: И ханаанский царь Арада, живший в Негеве[a], в земле Ханаанской, услышал, что пришли сыны Израиля[b].
  to: И ханаанский царь Арада, живший в Негеве[a], в земле Ханаана, услышал о приходе сынов Израиля[b].
  rationale: Правка восстанавливает временно-событийный смысл בְּבֹא посредством естественного русского оборота «о приходе», не уточняя, что именно царь услышал и не добавляя богословских либо исторических интерпретаций. Название земли приведено к современному нейтральному русскому оформлению. Якоря примечаний сохранены у соответствующих слов.
