base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: ru
  text: И ханаанский царь Арада, живший в Негеве[a], в земле Ханаана, услышал о приходе сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Негев» можно также перевести как «юг» или «южная область».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Прямое соответствие глаголу שׁמע; содержание услышанного естественно выражено последующим придаточным предложением.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: ханаанский царь Арада
  rationale: Передаёт этническую принадлежность правителя и конструкцию «царь Арада» естественным русским словосочетанием.
- source_word: וְהוּא יֹשֵׁב
  choice: живший
  rationale: Причастный оборот естественно передаёт фоновое описание, выраженное местоимением с еврейским причастием.
- source_word: בַּנֶּגֶב
  choice: в Негеве
  rationale: Контекст указывает на известную южную область; транслитерация сохраняет географическое название, не исключая значения «юг».
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохраняет явное упоминание земли и передаёт географическое название естественной литературной формой.
- source_word: בְּבֹא
  choice: что пришли
  rationale: Предлог ב с инфинитивом בוא обозначает обстоятельство времени; русское придаточное естественно связывает приход Израиля с тем, что услышал царь, без добавления невыраженного объекта.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет образ и форму исходного выражения; более гладкий вариант «израильтяне» вынесен в примечание.
