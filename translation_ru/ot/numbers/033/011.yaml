  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: ru
  text: Они отправились от Красного моря[a] и разбили лагерь в пустыне Син[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Тростникового моря». Еврейское название ям-суф традиционно переводится как «Красное море», однако более буквальная передача — «Тростниковое море».'
    reason: lexical_alternative
  - marker: b
    text: Син — название пустынной области.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В маршрутной формуле Чисел 33 глагол נסע означает выступление с прежнего места стоянки. «Отправились» естественно звучит по-русски и ясно передаёт начало следующего этапа пути.
- source_word: מִיַּם סוּף
  choice: от Красного моря
  rationale: Традиционное и наиболее узнаваемое русское географическое название. Более буквальная и лексически возможная передача «от Тростникового моря» сохранена в сноске.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря или стоянки. Формулировка сохраняет конкретный смысл и соответствует повествованию о переходах Израиля.
- source_word: בְּמִדְבַּר סִין
  choice: в пустыне Син
  rationale: מִדְבָּר здесь обозначает пустынную, необжитую местность, а סִין — географическое имя, которое передаётся транслитерацией.
