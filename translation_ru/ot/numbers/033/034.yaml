  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: ru
  text: Они отправились из Иотвафы и разбили лагерь в Авроне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле описания переходов означает сняться с прежнего места и отправиться в путь; «отправились» естественно передаёт это значение в современном русском языке.
- source_word: מִיָּטְבָתָה
  choice: из Иотвафы
  rationale: Предлог מִן передан как «из». Название יָטְבָתָה воспроизведено в традиционной русской библейской форме «Иотвафа» и поставлено в родительный падеж.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в перечне стоянок означает разбить лагерь. Выражение «расположились станом» ясно и достойно передаёт смысл, сохраняя характер повествования о переходах Израиля.
- source_word: בְּעַבְרֹנָה
  choice: в Авроне
  rationale: Предлог בְּ имеет локативное значение и естественно передаётся как «в». Топоним עַבְרֹנָה воспроизведён традиционной русской формой «Аврона» и склонён по нормам русского языка.
