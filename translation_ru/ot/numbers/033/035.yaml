lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с прежнего места и отправиться дальше; «отправились» естественно передаёт начало пути.
- source_word: מֵעַבְרֹנָה
  choice: из Авроны
  rationale: Предлог מִן передан как «из», а название места עַבְרֹנָה транслитерировано в традиционной русской форме «Аврона».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает остановиться лагерем; выражение «расположились станом» сохраняет значение стоянки и соответствует достоинству библейского повествования.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: в Ецион-Гавере
  rationale: Предлог בְּ обозначает место стоянки и передан как «в»; составной топоним עֶצְיוֹן גָּבֶר транслитерирован через дефис в принятой русской форме.
