  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: ru
  text: Моисей записал их отправные пункты в соответствии с их переходами по повелению Яхве[a], и вот их переходы в соответствии с их отправными пунктами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве» — еврейское выражение со значением «по повелению Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'В стихе намеренно переставлены те же понятия: «их отправные пункты в соответствии с их переходами» — и затем «их переходы в соответствии с их отправными пунктами».'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: записал
  rationale: Передаёт завершённое повествовательное действие и смысл письменной фиксации маршрута.
- source_word: מוֹצָאֵיהֶם
  choice: места, откуда они выходили
  rationale: В контексте перечня стоянок מוֹצָא обозначает исходные пункты; описательная формулировка ясна по-русски и сохраняет связь с идеей выхода.
- source_word: לְמַסְעֵיהֶם
  choice: по их переходам
  rationale: מַסָּע здесь обозначает отдельный этап пути после снятия со стоянки; предлог ל передан в соотносительном значении «по».
- source_word: עַל־פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Еврейская идиома буквально означает «по устам», но в данном контексте выражает повеление или распоряжение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном.
- source_word: וְאֵלֶּה
  choice: и вот
  rationale: Естественно вводит следующий перечень и не требует добавлять отсутствующую в еврейском связку времени.
- source_word: מַסְעֵיהֶם
  choice: их переходы
  rationale: Слово обозначает этапы странствия; «переходы» естественно для маршрутного перечня и сохраняет повтор исходного термина.
- source_word: לְמוֹצָאֵיהֶם
  choice: по местам, откуда они выходили
  rationale: Зеркально повторяет первое выражение и сохраняет намеренную перестановку понятий в двух половинах стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смысл עַל־פִּי
  choice: по повелению
  alternative: по устам
  rationale: Буквальный образ по-русски был бы неясен; идиома указывает, что запись совершена по Божьему распоряжению.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет параллелизм и обратный порядок ключевых понятий. «Переходы» предпочтены более техническим «этапам пути», а развернутое «места, откуда они выходили» сохраняет конкретный маршрутный смысл и лексическую связь с выходом.
