  yaml_path: translation/ot/numbers/033/021.yaml
  text: They set out from Libnah and camped at Rissah.
translation:
  language: ru
  text: Они отправились из Ливны и расположились станом в Риссе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с прежнего места и продолжить путь. «Отправились» естественно передаёт начало движения.
- source_word: מִלִּבְנָה
  choice: из Ливны
  rationale: Предлог מִן обозначает исходную точку, а לִבְנָה — географическое название; использована традиционная русская передача имени.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает остановиться и разбить лагерь. Выражение «расположились станом» сохраняет маршрутный характер повествования и звучит достойно и понятно.
- source_word: בְּרִסָּה
  choice: в Риссе
  rationale: Предлог ב обозначает место стоянки; название רִסָּה передано в форме, соответствующей русской библейской топонимической традиции.
