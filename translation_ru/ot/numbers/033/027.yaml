  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: ru
  text: Они отправились из Тахата и расположились станом в Терахе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле описания переходов глагол נסע означает сняться с места и двинуться дальше. «Отправились» естественно передаёт начало очередного перехода.
- source_word: מִתָּחַת
  choice: из Тахата
  rationale: Предлог מִן передан как «из», а топоним תָּחַת — принятой русской библейской формой «Тахат» с требуемым родительным падежом.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в перечне стоянок означает разбить или устроить лагерь. Выражение «расположились станом» ясно и уместно для повествования о пути Израиля.
- source_word: בְּתָרַח
  choice: в Терахе
  rationale: Предлог בְּ обозначает место стоянки и по-русски естественно передаётся предлогом «в»; תָּרַח транслитерировано как «Терах» и поставлено в предложный падеж.
