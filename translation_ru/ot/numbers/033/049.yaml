base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: ru
  text: И они расположились станом у Иордана, от Бет-Йешимота до Авел-Шиттима, на равнинах Моава[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в степях Моава». Древнееврейское слово обозначает ровную степную местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: И они расположились станом
  rationale: Форма wayyiqtol продолжает последовательное повествование о переходах Израиля. «Расположились станом» естественно для современного русского языка и передаёт устройство лагеря, не прибегая к архаичному «станом стали».
- source_word: עַל הַיַּרְדֵּן
  choice: у Иордана
  rationale: Предлог עַל при названии реки обозначает расположение возле неё, а не буквально «на» её поверхности. Русское «у Иордана» ясно и идиоматично.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: от Бет-Йешимота
  rationale: Префикс מִן обозначает начальную точку протяжённости стоянки. Топоним передан транслитерацией, близкой к древнееврейской форме, и склоняется по нормам русского языка.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: до Авел-Шиттима
  rationale: עַד указывает конечную точку указанного пространства. Топоним передан транслитерацией без попытки переводить его составные части.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: Существительное עֲרָבוֹת обозначает равнинную степную область. «На равнинах Моава» понятно современному читателю и естественно сочетается с русским обозначением открытой местности; более буквальный оттенок «степи» сохранён в сноске.
