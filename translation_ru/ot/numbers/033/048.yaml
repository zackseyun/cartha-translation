  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: ru
  text: Они отправились от гор Аварим и расположились станом на равнинах Моава, у Иордана близ Иерихона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «на степных равнинах Моава». Еврейское слово עֲרָבוֹת может обозначать как равнины, так и степную местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В маршрутных перечнях глагол נסע означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт начало следующего этапа пути.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: от гор Аварим
  rationale: הָרֵי — сопряжённая форма множественного числа от «гора»; название Аварим передано транслитерацией.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в формулах перечня стоянок означает разбить лагерь; этот вариант сохраняет походный контекст и звучит литературно.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עֲרָבוֹת обозначает открытые равнинные или степные земли; «равнины» понятно современному читателю, а возможный вариант отмечен в сноске.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: у Иордана, напротив Иерихона
  rationale: עַל при названии реки указывает на расположение у неё. Эллиптическое сочетание יַרְדֵּן יְרֵחוֹ традиционно и географически понимается как участок Иордана напротив Иерихона; неоднозначность отражена в сноске.
