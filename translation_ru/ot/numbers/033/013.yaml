  yaml_path: translation/ot/numbers/033/013.yaml
  text: They set out from Dophkah and camped at Alush.
translation:
  language: ru
  text: Они отправились из Дофки и расположились станом в Алуше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с места и продолжить путь. «Отправились» естественно передаёт начало движения.
- source_word: מִדָּפְקָה
  choice: из Дофки
  rationale: Предлог מִן указывает исходный пункт («из»), а название דָּפְקָה передано транслитерацией с учётом русской падежной формы.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה означает остановиться и разбить лагерь. Традиционное, но понятное выражение «расположились станом» уместно в библейском маршруте.
- source_word: בְּאָלוּשׁ
  choice: в Алуше
  rationale: Предлог בְּ обозначает место стоянки; топоним אָלוּשׁ передан как «Алуш» и поставлен в предложный падеж.
