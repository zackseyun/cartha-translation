  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: ru
  text: Они отправились из Харады и разбили лагерь в Макхелоте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле перечисления стоянок глагол נסע обозначает снятие со стоянки и начало пути; «отправились» естественно передаёт это значение в современном русском языке.
- source_word: מֵחֲרָדָה
  choice: из Харады
  rationale: Предлог מִן указывает на исходный пункт движения. Географическое название передано транслитерацией с формой родительного падежа.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в описании маршрута означает остановиться и разбить лагерь; традиционное, но понятное выражение «расположились станом» сохраняет оттенок устройства стоянки.
- source_word: בְּמַקְהֵלֹת
  choice: в Макхелоте
  rationale: Предлог בְ обозначает место стоянки. Название מַקְהֵלֹת передано как «Макхелот» и поставлено в предложный падеж после «в».
