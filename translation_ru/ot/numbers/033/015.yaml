base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: ru
  text: Они отправились из Рефидима и расположились станом в Синайской пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с места и отправиться в путь. «Отправились» естественно передаёт начало следующего этапа движения.
- source_word: מֵרְפִידִם
  choice: из Рефидима
  rationale: Предлог מ указывает на исходный пункт. Географическое название רְפִידִים передано принятой русской библейской формой «Рефидим» в родительном падеже после «из».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает разбить лагерь, стать станом. Выражение «расположились станом» сохраняет конкретный образ стоянки и звучит достойно и понятно в повествовании о странствиях.
- source_word: בְּמִדְבַּר סִינָי
  choice: в Синайской пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность, а сочетание с סִינָי называет Синайскую пустыню. Устоявшаяся русская форма естественно передаёт еврейскую конструкцию.
