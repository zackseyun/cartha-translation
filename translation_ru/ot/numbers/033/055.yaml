language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: ru
  text: Но если вы не прогоните от себя жителей этой земли, то те из них, кого вы оставите, станут колючками[a] в ваших глазах и шипами[b] в ваших боках и будут притеснять[c] вас на земле, где вы будете жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остриями». Редкое еврейское слово обозначает нечто острое, что колет или пронзает.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «колючками» или «крючьями». Оба парных образа говорят о постоянном и мучительном бедствии, которое причинят оставшиеся жители.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будут враждовать с вами» или «будут угнетать вас». Еврейский глагол охватывает разные виды враждебного причинения бедствий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: прогоните
  rationale: Каузативная форма ירשׁ здесь означает удалить жителей и лишить их владения землёй. «Прогоните» естественно передаёт принудительное изгнание, не придавая глаголу излишне технического оттенка.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жителей этой земли
  rationale: Причастная конструкция обозначает людей, населяющих землю. Указательное «этой» естественно в русском контексте и относится к уже названной земле.
- source_word: מִפְּנֵיכֶם
  choice: от себя
  rationale: Буквально «от вашего лица / прочь перед вами». Русское «от себя» сохраняет пространственную идею удаления и звучит естественнее буквального «из-пред вас».
- source_word: תּוֹתִירוּ
  choice: кого вы оставите
  rationale: Hiphil от יתר означает оставить кого-либо в остатке. Формулировка не добавляет значения милосердного пощажения, которого сам глагол прямо не выражает.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: колючками в ваших глазах
  rationale: Редкое существительное שׂכים обозначает нечто острое и колющее. «Колючки» сохраняет болезненный телесный образ и отличается от следующего образа шипов.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: шипами в ваших боках
  rationale: צנינים обозначает острые, колющие предметы; «шипы» хорошо сохраняют параллельную метафору постоянной мучительной боли. «Бока» непосредственно передают צדים в данном телесном образе.
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: будут притеснять вас
  rationale: צרר выражает враждебное причинение бедствий, стеснение или преследование. «Притеснять» передаёт длительное враждебное воздействие, согласующееся с предшествующими метафорами.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: на земле, где вы будете жить
  rationale: «На земле» отражает עַל, а будущее время естественно передаёт смысл предупреждения о предстоящем поселении Израиля, хотя еврейская конструкция буквально использует причастие «живущие».
