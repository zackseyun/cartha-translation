  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: ru
  text: Они отправились из Дивон-Гада и расположились станом в Алмон-Дивлатаиме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле перечисления стоянок глагол נסע означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт это значение в современном русском языке.
- source_word: מִדִּיבֹן גָּד
  choice: из Дивон-Гада
  rationale: Составной топоним передан транслитерацией, а предлог מ — русским «из»; дефис сохраняет восприятие названия как единого топонима.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в маршруте означает остановиться и разбить лагерь. «Расположились станом» сохраняет библейское достоинство слога, оставаясь понятным современному читателю.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: в Алмон-Дивлатаиме
  rationale: Название места транслитерировано как единый составной топоним; направительная форма на -ה в контексте движения к следующей стоянке естественно передана предлогом «в».
