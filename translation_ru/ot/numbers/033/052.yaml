id: NUM.33.52
reference: Numbers 33:52
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: ru
  text: и прогоните от себя всех жителей этой земли, и уничтожьте все их камни с изображениями[a], и уничтожьте все их литые изваяния[b], и разрушьте все их святилища на высотах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все их резные изображения». Еврейское слово מַשְׂכִּיּוֹת обозначает изображения или украшенные предметы; их точный вид и материал остаются спорными.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все их изваяния, отлитые из металла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: и прогоните
  rationale: Порода hифиль глагола ירשׁ здесь означает лишить нынешних жителей владения и удалить их с земли. «Прогоните» естественно передаёт активное изгнание, не ослабляя повеления.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: всех жителей этой земли
  rationale: Причастная конструкция обозначает людей, живущих в данной земле; указательное «этой» естественно передаёт определённость контекстуально названной земли.
- source_word: מִפְּנֵיכֶם
  choice: от себя
  rationale: Еврейская идиома буквально означает «от вашего лица / от вас». Русское «от себя» ясно и естественно выражает удаление из их присутствия.
- source_word: וְאִבַּדְתֶּם
  choice: и уничтожьте
  rationale: Пиэль אבד выражает уничтожение культовых предметов. Императивная форма по-русски естественно передаёт значение еврейского перфекта с союзом в последовательности повелений.
- source_word: מַשְׂכִּיֹּתָם
  choice: их камни с изображениями
  rationale: מַשְׂכִּיּוֹת обозначает фигурные или украшенные изображения; вероятна связь с резными либо гравированными каменными предметами, хотя точная форма и материал спорны. Перевод сохраняет конкретный вероятный смысл, а сноска отмечает неопределённость.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: все их литые изваяния
  rationale: צֶלֶם означает изображение или изваяние, а מַסֵּכָה указывает на изготовление литьём, обычно из металла. «Литые изваяния» звучит современно и отличает их от предыдущей категории.
- source_word: תְּאַבֵּדוּ
  choice: уничтожьте
  rationale: Повтор «уничтожьте» сохраняет повторение корня אבד и риторическую силу оригинала.
- source_word: בָּמֹתָם
  choice: их святилища на высотах
  rationale: בָּמוֹת — культовые места, часто расположенные на возвышенностях. «Святилища на высотах» понятнее современному русскому читателю, чем буквальное «высоты», и не ограничивает их только вершинами холмов.
- source_word: תַּשְׁמִידוּ
  choice: разрушьте
  rationale: Hифиль שׁמד здесь относится к культовым местам и требует их полного уничтожения; «разрушьте» естественно сочетается со святилищами.
theological_decisions:
- issue: Повеления о жителях Ханаана и их культе
  choice: Прямо передать приказ прогнать жителей и уничтожить конкретные культовые предметы и места.
  alternative: Ослабить первый глагол до чисто имущественного «лишите владения» или обобщить культовые термины как «языческие обычаи».
  rationale: Еврейский текст говорит как об удалении жителей, так и об уничтожении определённых культовых объектов. Перевод не смягчает суровость приказа, но и не добавляет отсутствующего в стихе богословского обоснования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повелительные формы передают последовательность предписаний; лексика конкретна и понятна без архаизмов. Повтор «уничтожьте» намеренно сохранён.
