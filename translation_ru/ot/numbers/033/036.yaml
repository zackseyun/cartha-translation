  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: ru
  text: Они отправились из Эцион-Гевера и разбили лагерь в пустыне Цин — то есть[a] Кадес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая есть Кадес». Еврейское местоимение отождествляет названное место с Кадесом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В перечне стоянок глагол נסע означает сняться с места и двинуться дальше; «отправились» естественно передаёт эту формулу по-русски.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: из Эцион-Гевера
  rationale: Географическое название передано принятой русской библейской транслитерацией; исходный предлог מִן обозначает отправную точку.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря или стоянки; выражение сохраняет конкретный смысл и достойный повествовательный регистр.
- source_word: בְמִדְבַּר צִן
  choice: в пустыне Цин
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «пустыня Цин» — ясное и традиционно узнаваемое русское географическое наименование.
- source_word: הִוא
  choice: это
  rationale: Местоимение вводит отождествление названного места с Кадесом. «Это» передаёт его кратко, сохраняя возможность более буквального понимания «которая есть» в сноске.
- source_word: קָדֵשׁ
  choice: Кадес
  rationale: Топоним передан принятой русской библейской формой.
