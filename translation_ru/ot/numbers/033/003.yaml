base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: ru
  text: Сыны Израиля[a] отправились из Раамсеса в первом месяце, в пятнадцатый день первого месяца. На следующий день после Пасхи они вышли с высоко поднятой рукой[b] на глазах у всех египтян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «с высоко поднятой рукой» означает, что они вышли открыто и смело, у всех на виду.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: В перечне стоянок глагол נסע означает сняться с места и отправиться в путь; «отправились» естественно передаёт эту маршрутную формулу.
- source_word: מֵרַעְמְסֵס
  choice: из Раамсеса
  rationale: «Раамсес» — узнаваемая русская форма библейского топонима; предлог передаёт исходный пункт пути.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: в первом месяце
  rationale: Прямое и ясное обозначение месяца по порядку.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: в пятнадцатый день первого месяца
  rationale: Естественная русская форма древнееврейского обозначения даты.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: на следующий день после Пасхи
  rationale: מָחֳרַת обозначает следующий день; «Пасха» сохраняет название праздника Песах в привычной русской библейской форме.
- source_word: יָצְאוּ
  choice: вышли
  rationale: Прямое значение יצא сохраняет мотив исхода и соответствует повествовательной перспективе.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формулировка прозрачно сохраняет буквальный образ еврейского выражения, а сноска поясняет его собирательное значение.
- source_word: בְּיָד רָמָה
  choice: с высоко поднятой рукой
  rationale: Конкретный древнееврейский образ сохранён без сведения его к одному оттенку — смелости, открытости, торжеству или непокорности; значение поясняется в сноске.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: на глазах у всех египтян
  rationale: Современное и ясное русское выражение, близко передающее буквальный образ публично видимого действия.
theological_decisions:
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет форму исходного выражения, не ограничивая при этом его собирательного смысла; сноска предотвращает ошибочное понимание как указания исключительно на непосредственных сыновей патриарха.
- issue: Передача идиомы בְיָד רָמָה
  choice: с высоко поднятой рукой
  alternative: смело; открыто; торжественно; дерзновенно
  rationale: Буквальный образ допускает несколько взаимосвязанных оттенков. Его сохранение не навязывает тексту единственную эмоциональную или богословскую трактовку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным; повтор «первого месяца» сохранён вслед за еврейским текстом. Маркеры сносок поставлены непосредственно после поясняемых выражений.
