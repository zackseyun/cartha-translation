lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле перечисления стоянок глагол נסע обозначает выступление с прежнего места; «отправились» естественно передаёт начало следующего перехода.
- source_word: מֵהַר שָׁפֶר
  choice: от горы Шефер
  rationale: Сочетание מן с הַר указывает на исходный пункт — гору; топоним שָׁפֶר передан русской транслитерацией «Шефер» согласно масоретской огласовке.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в описании странствий означает остановиться и разбить лагерь; традиционно понятное выражение «расположились станом» сохраняет контраст с выступлением в путь.
- source_word: בַּחֲרָדָה
  choice: в Хараде
  rationale: Предлог ב обозначает место стоянки, а חֲרָדָה здесь является топонимом; форма «в Хараде» естественна для русского языка.
