lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с места и выступить в путь; «отправились» естественно передаёт движение без архаического оттенка.
- source_word: מֵחֲצֵרֹת
  choice: из Хацерота
  rationale: Предлог מִן передаёт исходную точку («из»); название חֲצֵרֹת транслитерировано в принятой русской библейской форме «Хацерот» и поставлено в родительный падеж.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה обозначает устройство лагеря на очередной стоянке; традиционное и понятное выражение «расположились станом» сохраняет походный контекст.
- source_word: בְּרִתְמָה
  choice: в Ритме
  rationale: Предлог בְּ обозначает место стоянки; название רִתְמָה передано как «Ритма» и естественно склоняется после «в».
