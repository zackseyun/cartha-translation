  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: ru
  text: Они отправились из Ритмы и расположились станом в Риммон-Переце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле перечисления стоянок глагол נסע означает сняться с места и продолжить путь. «Отправились» естественно передаёт это значение в современном русском языке.
- source_word: מֵרִתְמָה
  choice: из Ритмы
  rationale: Предлог מִן указывает на исходный пункт, поэтому передан как «из». Название места транслитерировано; после предлога употреблён нормативный родительный падеж.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в описании пути означает остановиться и разбить лагерь. «Расположились станом» звучит достойно и ясно, сохраняя характер повествования о переходах.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: в Риммон-Переце
  rationale: Предлог בְּ здесь обозначает место стоянки и естественно передаётся русским «в». Составное географическое название транслитерировано через дефис и склоняется по второй части.
