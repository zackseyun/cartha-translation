lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В перечне переходов глагол נסע обозначает снятие со стоянки и отправление в путь; «отправились» естественно передаёт эту маршрутную формулу.
- source_word: מֵהֹר הָהָר
  choice: от горы Ор
  rationale: הֹר הָהָר — устойчивое географическое название; форма «гора Ор» соответствует современному русскому употреблению.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает разбить лагерь или остановиться станом; выбранная формулировка сохраняет смысл стоянки и достойный библейский регистр.
- source_word: בְּצַלְמֹנָה
  choice: в Цалмоне
  rationale: Предлог בְּ здесь имеет местное значение, а название צַלְמֹנָה передано русской транслитерацией «Цалмона» с требуемой предложным управлением формой.
