  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: И отправились они
  rationale: Глагол נסע в формуле перечисления стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало следующего перехода.
- source_word: מֵחַשְׁמֹנָה
  choice: из Хашмоны
  rationale: Предлог מִן передан как «из», а название חַשְׁמֹנָה транслитерировано в традиционной русской библейской форме «Хашмона» и поставлено в родительный падеж.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря на очередной стоянке; выражение «расположились станом» сохраняет конкретный образ и выдержанный повествовательный регистр.
- source_word: בְּמֹסֵרוֹת
  choice: в Мосероте
  rationale: Предлог בְ при месте стоянки естественно передаётся как «в»; топоним מֹסֵרוֹת транслитерирован в принятой русской форме «Мосерот» и поставлен в предложный падеж.
