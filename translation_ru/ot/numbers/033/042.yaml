  text: They set out from Zalmonah and camped at Punon.
translation:
  language: ru
  text: Они отправились из Цалмоны и расположились станом в Пуноне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле описания пути Израиля означает сняться со стоянки и двинуться дальше. «Отправились» естественно передаёт начало следующего перехода.
- source_word: מִצַּלְמֹנָה
  choice: из Цалмоны
  rationale: Предлог מִן передан как «из», а топоним צַלְמֹנָה транслитерирован в принятой русской библейской форме «Цалмона».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в маршрутной формуле обозначает остановку лагерем. «Расположились станом» звучит достойно и ясно, сохраняя отличие от простого временного пребывания.
- source_word: בְּפוּנֹן
  choice: в Пуноне
  rationale: Предлог בְּ при названии места стоянки естественно передаётся по-русски как «в»; топоним פּוּנֹן дан в традиционной форме «Пунон».
