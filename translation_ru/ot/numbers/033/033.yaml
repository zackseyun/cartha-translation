  text: Они отправились от Хор-Гидгада и разбили лагерь в Йотвате.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечня стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало следующего перехода.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: от Хор-Гидгада
  rationale: Предлог מִן передаёт исходную точку («от»), а географическое название транслитерируется и оформляется через дефис как составное.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает остановку для стоянки лагерем. Формулировка сохраняет образ стана и звучит достойно и понятно в повествовании о странствиях.
- source_word: בְּיָטְבָתָה
  choice: в Иотвафе
  rationale: Предлог בְּ обозначает место стоянки; русское «в» с предложным падежом естественно для данного географического названия.
