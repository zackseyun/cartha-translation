  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: ru
  text: Они отправились из Алмон-Дивлафаима и расположились станом в горах Аварим[a], перед Нево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив Нево». Еврейский предлог указывает на пространственное положение, но не уточняет его точнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В перечне стоянок глагол נסע означает сняться с места и двинуться дальше; «отправились» естественно передаёт этот повторяющийся маршрутный оборот.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: из Алмон-Дивлафаима
  rationale: Географическое название передано транслитерацией; дефис показывает, что это единый составной топоним.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство стоянки; этот вариант сохраняет маршрутный стиль и звучит понятно в современном литературном русском.
- source_word: בְּהָרֵי
  choice: в горах
  rationale: Форма множественного числа в сопряжённом состоянии буквально указывает на горы; предлог «в» естественно обозначает стоянку в горной области.
- source_word: הָעֲבָרִים
  choice: Аварим
  rationale: Здесь слово служит географическим названием и поэтому транслитерируется, а не переводится по его этимологическому значению.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог выражает пространственное отношение «перед, напротив», не уточняя точную ориентацию; «перед» сохраняет эту неопределённость.
- source_word: נְבוֹ
  choice: Нево
  rationale: Собственное географическое название передано принятой русской библейской формой.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранена краткая формула маршрута; топонимы переданы привычной русской библейской транслитерацией. Маркер [a] помещён непосредственно после названия гор, к которому относится примечание о положении перед Нево.
