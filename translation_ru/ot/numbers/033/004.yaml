source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: ru
  text: в то время как египтяне хоронили тех, кого Яхве поразил среди них, — всех первенцев. И над их богами[a] Яхве совершил суды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против их богов».'
    reason: Предлог ב в этом обороте допускает передачу как «над», так и «против».
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: в то время как египтяне хоронили
  rationale: Сочетание союза, подлежащего и причастия вводит фоновое обстоятельство времени; русская конструкция передаёт продолжающееся действие в прошлом.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם כָּל בְּכוֹר
  choice: тех, кого Яхве поразил среди них, — всех первенцев
  rationale: 'Сохранена последовательность еврейского текста: относительная конструкция получает последующее уточнение «всех первенцев». Тире естественно оформляет это пояснение по-русски и не вводит отсутствующего в источнике притяжательного отношения.'
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה обозначает нанесение удара и в данном контексте — смертельное поражение первенцев; «поразил» сохраняет образ и его контекстуальный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, непосредственно представленное тетраграмматоном, а не заменено титулом.
- source_word: בָּהֶם
  choice: среди них
  rationale: Предлог с местоименным суффиксом указывает на египтян как на группу, среди которой произошло поражение.
- source_word: וּבֵאלֹהֵיהֶם
  choice: И над их богами
  rationale: Предлог ב при выражении עשה שפטים естественно передаётся как «над»; буквальная отнесённость к богам Египта сохранена без переосмысления как правителей или идолов.
- source_word: עָשָׂה יְהוָה שְׁפָטִים
  choice: Яхве совершил суд
  rationale: Еврейская идиома означает осуществить судебное воздаяние. Единственное число «суд» звучит по-русски естественно и сохраняет весомость выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Источник употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Кого обозначают «их боги»
  choice: боги египтян
  alternative: правители; идолы
  rationale: אֱלֹהֵיהֶם непосредственно означает «их боги». Перевод не сводит утверждение к человеческим властителям и не добавляет оценочного пояснения, которого нет в тексте.
- issue: Характер действий Яхве над богами Египта
  choice: совершил суд
  alternative: совершил суды; произвёл расправу
  rationale: Формулировка сохраняет богословски значимое утверждение о суде над египетскими богами, не уточняя сверх текста ни их онтологический статус, ни конкретный способ суда.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Начальная строчная буква отражает синтаксическую связь стиха с предыдущим контекстом; пояснительное тире сохраняет структуру еврейской фразы без тяжеловесной буквальности.
