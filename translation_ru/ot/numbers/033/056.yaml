  yaml_path: translation/ot/numbers/033/056.yaml
  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: ru
  text: Тогда Я поступлю с вами так, как намеревался поступить с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Тогда
  rationale: Оборот вводит следствие предшествующего предостережения; «тогда» естественно передаёт эту связь в современном русском языке.
- source_word: כַּאֲשֶׁר
  choice: так, как
  rationale: Соотносительная конструкция «так, как» сохраняет смысловое соответствие между задуманным действием против прежних жителей земли и действием по отношению к Израилю.
- source_word: דִּמִּיתִי
  choice: намеревался
  rationale: В данном контексте форма породы пиэль обозначает намерение или замысел; «намеревался» передаёт это точнее, чем более слабое «думал».
- source_word: לַעֲשׂוֹת ... אֶעֱשֶׂה
  choice: поступить ... поступлю
  rationale: Русское «поступить с кем-либо» естественно передаёт действие по отношению к людям и сохраняет лексический повтор исходного текста.
- source_word: לָהֶם ... לָכֶם
  choice: с ними ... с вами
  rationale: При русском глаголе «поступить» предложная конструкция с творительным падежом идиоматично передаёт еврейские косвенные объекты, не добавляя характера наказания сверх контекста.
theological_decisions:
- issue: Сила формулы предостережения
  choice: 'Прямое Божье предупреждение: если Израиль не исполнит повеления, Бог поступит с ним так, как намеревался поступить с жителями земли.'
  alternative: Безличное или смягчённое указание лишь на естественные последствия.
  rationale: Форма первого лица и параллелизм исходного текста представляют это как действие самого Бога; перевод сохраняет строгость угрозы, не конкретизируя наказание сверх сказанного.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формулировка без архаизма «и будет». Перестановка частей предложения делает фразу естественной по-русски, сохраняя причинно-следственную связь и параллелизм.
