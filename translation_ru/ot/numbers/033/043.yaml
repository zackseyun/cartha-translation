  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: ru
  text: Они отправились из Пунона и расположились станом в Овофе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле описания пути означает сняться со стоянки и двинуться дальше. «Отправились» естественно передаёт это значение в современном русском языке.
- source_word: מִפּוּנֹן
  choice: из Пунона
  rationale: Предлог מִן указывает на исходный пункт движения; название места передано принятой русской библейской транслитерацией «Пунон».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в маршрутах означает разбить лагерь, остановиться станом. Эта формулировка точна, естественна и сохраняет возвышенный повествовательный регистр.
- source_word: בְּאֹבֹת
  choice: в Овофе
  rationale: Предлог בְּ обозначает место стоянки. «В Овофе» соответствует русскому управлению и принятой русской библейской форме этого топонима.
