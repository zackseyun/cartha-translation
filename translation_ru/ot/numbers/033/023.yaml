lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В перечне стоянок форма глагола נסע обозначает снятие с места и продолжение пути; «отправились» естественно передаёт эту повторяющуюся формулу.
- source_word: מִקְּהֵלָתָה
  choice: из Кегелаты
  rationale: Предлог מִן передан как «из», а название места קְהֵלָתָה транслитерировано с учётом принятой русской библейской формы.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в маршрутах означает остановиться и разбить лагерь; «расположились станом» сохраняет смысл и достоинство повествовательной формулы.
- source_word: בְּהַר
  choice: у горы
  rationale: הַר означает гору, а ב в обозначении места стоянки естественно передаётся русским «у».
- source_word: שָׁפֶר
  choice: Шефер
  rationale: Название транслитерировано в соответствии с масоретской огласовкой; вариант «Шафер» отмечен в сноске как традиционная передача.
