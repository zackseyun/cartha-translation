  naturalness: Текст в целом ясен и соответствует современному литературному русскому. «По племенам ваших отцов» естественнее и однозначнее, чем «по отцовским племенам», которое может восприниматься как характеристика племён, а не как указание на родословную.
  terminology: «Род», «племя», «жребий» и «надел» уместны в контексте. Добавление «во владение» в последней строке точнее выражает характер надела как наследственного владения, не вводя конфессиональной терминологии.
