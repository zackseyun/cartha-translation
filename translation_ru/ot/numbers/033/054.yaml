base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: ru
  text: Разделите землю по жребию между вашими родами. Более многочисленному роду дайте больший надел, а менее многочисленному — меньший. Где кому выпадет жребий, там и будет его надел. Получите свои наделы во владение по племенам ваших отцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם אֶת־הָאָרֶץ
  choice: Разделите землю
  rationale: Хитпаэль נחל в контексте распределения Ханаана обозначает получение и распределение земли как наследственного владения. «Разделите землю» естественно передаёт предписанное межродовое распределение, тогда как тема наследственного надела сохраняется далее.
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Обычный и точный русский эквивалент способа распределения посредством жребия.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: между вашими родами
  rationale: מִשְׁפָּחָה здесь — родовая группа внутри племени, а не современная отдельная семья.
- source_word: לָרַב ... וְלַמְעַט
  choice: более многочисленному роду ... менее многочисленному
  rationale: В контексте распределения земли противопоставлены группы с большей и меньшей численностью; добавление «роду» проясняет подразумеваемый референт.
- source_word: נַחֲלָתוֹ
  choice: надел
  rationale: В данном земельно-правовом контексте נַחֲלָה означает наследственно получаемую территорию. «Надел» звучит естественно и сохраняет конкретный земельный смысл.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: Где кому выпадет жребий
  rationale: Передаёт пространственную направленность אֶל אֲשֶׁר ... שָׁמָּה и еврейскую идиому «жребий выйдет» естественным русским выражением.
- source_word: לוֹ יִהְיֶה
  choice: там и будет его надел
  rationale: Местоименное «его» в оригинале относится к назначенной жребием доле; явное «надел» устраняет неестественную для русского языка недосказанность.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: по отцовским племенам
  rationale: Сохраняет указание на племенную принадлежность по линии отцов и не сглаживает патрилинейную формулировку источника.
- source_word: תִּתְנֶחָלוּ
  choice: Получайте наделы
  rationale: Заключительный хитпаэль נחל выражает вступление в наследственные владения; множественное «наделы» соответствует распределению между племенами.
