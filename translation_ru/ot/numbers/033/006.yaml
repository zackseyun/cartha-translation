  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: ru
  text: Они отправились из Суккота и разбили лагерь в Этаме, который был на краю пустыни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на границе пустыни».'
    reason: Лексема קָצֶה может обозначать как край местности, так и её границу.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в перечне переходов означает сняться с места и отправиться в путь; современное «отправились» естественно передаёт начало следующего этапа пути.
- source_word: מִסֻּכֹּת
  choice: из Суккота
  rationale: Топоним передан транслитерацией; предлог מ־ обозначает исходный пункт движения.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה означает разбить лагерь, стать станом. Формулировка сохраняет походный контекст и звучит естественно в литературном русском.
- source_word: בְאֵתָם
  choice: в Этаме
  rationale: Топоним передан транслитерацией; предлог ב־ здесь указывает место стоянки.
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит уточняющее описание местонахождения Этама.
- source_word: בִּקְצֵה
  choice: на краю
  rationale: Существительное קָצֶה обозначает край, оконечность или границу. «На краю» естественно передаёт географический смысл, не предполагая непременно установленной административной границы.
- source_word: הַמִּדְבָּר
  choice: пустыни
  rationale: מִדְבָּר означает необжитую, невозделанную местность и в данном контексте традиционно и понятно передаётся словом «пустыня», не обязательно подразумевающим песчаную пустыню.
