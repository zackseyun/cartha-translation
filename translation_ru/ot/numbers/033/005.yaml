  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: ru
  text: Сыны Израиля отправились из Рамсеса и расположились станом в Суккоте.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыновья Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в маршрутом перечне обозначает снятие со стоянки и начало пути; «отправились» естественно передаёт движение к следующему месту.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт еврейское выражение «сыновья Израиля» и сохраняет его традиционно-библейский коллективный смысл; форма «сыны» звучит достойно и узнаваемо.
- source_word: מֵרַעְמְסֵס
  choice: из Рамсеса
  rationale: Предлог מִן указывает исходный пункт; «Рамсес» — привычная русская передача топонима.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה означает остановиться и разбить лагерь; выражение естественно для повествования о переходах и стоянках.
- source_word: בְּסֻכֹּת
  choice: в Суккоте
  rationale: Предлог ב обозначает место стоянки; название передано принятой русской транслитерацией и не переводится по значению.
