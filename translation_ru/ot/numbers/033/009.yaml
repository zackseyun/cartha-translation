  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: ru
  text: Они отправились из Мары и пришли в Элим. В Элиме было двенадцать источников воды и семьдесят пальм, и там они расположились станом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в формуле путевого перечня означает сняться с места и двинуться дальше; «отправились» естественно передаёт начало следующего этапа пути.
- source_word: מִמָּרָה
  choice: из Мары
  rationale: Название места передано принятой русской библейской транслитерацией; предлог מִן обозначает исходный пункт.
- source_word: וַיָּבֹאוּ
  choice: и пришли
  rationale: בוא здесь обозначает прибытие к месту; «пришли» сохраняет простоту и последовательность повествования.
- source_word: אֵילִמָה / בְאֵילִם
  choice: в Элим / в Элиме
  rationale: Направительная форма обозначает движение в Элим, а конструкция с בְּ — нахождение в этом месте; падежные формы естественны для русского языка.
- source_word: עֵינֹת מַיִם
  choice: источников воды
  rationale: עַיִן в данном контексте означает естественный водный источник, а не вырытый колодец.
- source_word: תְּמָרִים
  choice: пальм
  rationale: Слово обозначает пальмы, вероятно финиковые; общий вариант «пальмы» не вносит отсутствующей в тексте дополнительной конкретизации.
- source_word: וַיַּחֲנוּ שָׁם
  choice: и там они расположились станом
  rationale: חנה в описании странствий означает разбить лагерь; «расположились станом» ясно передаёт временную стоянку и сохраняет достоинство библейского путевого повествования.
