lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает выступление с прежнего места; «отправились» естественно передаёт начало следующего перехода.
- source_word: מֵאֵילִם
  choice: из Елима
  rationale: Предлог מִן указывает на исходный пункт, а название אֵילִם передано принятой русской формой «Елим».
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря; выражение «расположились станом» сохраняет конкретный смысл и соответствует достоинству библейского повествования.
- source_word: עַל
  choice: у
  rationale: В контексте стоянки возле водоёма עַל обозначает расположение рядом с ним, а не на его поверхности.
- source_word: יַם סוּף
  choice: Красного моря
  rationale: Традиционное русское географическое наименование — «Красное море»; буквальная и лексически возможная передача «море Тростников» сохранена в сноске.
