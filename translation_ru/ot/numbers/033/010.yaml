  text: Они отправились из Елима и разбили лагерь у Красного моря[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тростниковое море». Еврейское название Ям-Суф традиционно переводится как «Красное море».'
