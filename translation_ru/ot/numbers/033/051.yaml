  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: ru
  text: 'Обратись к израильтянам[a] и скажи им: когда вы перейдёте[b] через Иордан в землю Ханаанскую,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вы переходите»; форма еврейского глагола может указывать на предстоящее в ближайшем будущем действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Обратись
  rationale: Повелительная форма глагола דבר требует начать обращение; «обратись» естественно по-русски сочетается с последующим «скажи им» и сохраняет оба еврейских глагола.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтянам
  rationale: Идиоматическое современное обозначение народа Израиля; буквальная родственная формула «сыны Израиля» приведена в сноске.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: и скажи им
  rationale: Прямо передаёт второй глагол речи אמר и его косвенное дополнение.
- source_word: כִּי
  choice: Когда
  rationale: В данном контексте вводит обстоятельство, при наступлении которого должны быть исполнены дальнейшие повеления; временная конструкция естественна по-русски.
- source_word: אַתֶּם עֹבְרִים
  choice: вы перейдёте
  rationale: Местоимение с причастием обозначает предстоящее, близкое действие; русское будущее время после «когда» ясно передаёт перспективный смысл.
- source_word: אֶת הַיַּרְדֵּן
  choice: через Иордан
  rationale: При русском глаголе «перейти» конструкция «через Иордан» естественно обозначает пересечение реки; название реки не требует добавления слова «река».
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: в землю Ханаанскую
  rationale: Сохраняет направление движения и существительное אֶרֶץ; традиционная русская форма остаётся ясной и литературной.
theological_decisions:
- issue: Значение כִּי при причастной конструкции
  choice: временное «когда вы перейдёте»
  alternative: утвердительное «ведь вы переходите» или «вот, вы переходите»
  rationale: Последующие наставления относятся к вступлению в Ханаан; временное прочтение хорошо соответствует функции всей придаточной конструкции, тогда как близость действия отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Израильтянам» предпочтено архаизирующему «сынам Израиля», а буквальная форма сохранена в сноске. Конечная запятая показывает, что речь и синтаксическая конструкция продолжаются в следующем стихе.
