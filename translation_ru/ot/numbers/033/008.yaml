    rationale: В тексте стоит מִפְּנֵי הַחִירֹת, буквально «от перед/передней стороны Хахирота»; существительное «место» в русском основном тексте является идиоматическим пояснением.
  - severity: low
    issue: «Три дня шли» передаёт лишь длительность и менее отчётливо отражает идиому «путь трёх дней».
