base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: ru
  text: Они отправились от места напротив Хахирота[a], прошли посреди моря в пустыню, затем совершили трёхдневный переход по пустыне Этам[b] и разбили лагерь в Маре.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально означает: «от перед Хахиротом», то есть от места перед или напротив Хахирота. В Исходе это место обычно названо Пи-Хахиротом, но здесь в еврейском тексте элемент «Пи-» отсутствует.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «шли путь трёх дней»; возможно также: «шли три дня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: В описании переходов נסע означает сняться со стоянки и двинуться дальше; «отправились» естественно передаёт это в современном русском языке.
- source_word: מִפְּנֵי הַחִירֹת
  choice: от места напротив Хахирота
  rationale: Оборот מִפְּנֵי буквально указывает на отправление «от лица/передней стороны», то есть от места перед или напротив названного пункта. Такая передача сохраняет пространственный смысл и не добавляет отсутствующий здесь элемент «Пи-».
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: прошли посреди моря
  rationale: עבר обозначает прохождение или переход, а בְתוֹךְ подчёркивает движение в самой середине моря; перевод не сводит маршрут к движению лишь возле моря.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительное окончание -ה выражает движение к пустыне или внутрь неё; русский винительный падеж естественно передаёт это направление.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: три дня шли
  rationale: Естественная русская передача пути, определённого тремя днями. Сжатый перевод сохраняет возможность понимать выражение как продолжительность пути, а буквальная конструкция отмечена в сноске.
- source_word: בְּמִדְבַּר אֵתָם
  choice: по пустыне Этам
  rationale: Сопряжённое сочетание означает пустыню, называемую Этам; предлог «по» соответствует движению через эту местность.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: расположились станом в Маре
  rationale: חנה в перечне переходов означает разбить лагерь. «Расположились станом» сохраняет достоинство библейского повествования и остаётся понятным современному читателю.
