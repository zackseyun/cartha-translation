  text: Они отправились из Киврот-Гаттаавы[a] и разбили лагерь в Хацероте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Киврот-Гаттаава», вероятно, означает «могилы страстного желания» или «могилы вожделения».
