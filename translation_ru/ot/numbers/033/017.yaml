lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: В формуле перечисления стоянок глагол נסע обозначает выступление с прежнего места; «отправились» естественно передаёт это значение в современном русском языке.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: из Киврот-Гаттаавы
  rationale: Топоним передан транслитерацией, а предлог מִן — русским «из». Значение названия вынесено в сноску.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה в контексте пути означает остановиться и разбить лагерь; «расположились станом» сохраняет походный оттенок и звучит достойно и понятно.
- source_word: בַּחֲצֵרֹת
  choice: в Хацероте
  rationale: Топоним передан транслитерацией; предлог ב в данном сообщении о стоянке естественно передаётся русским «в».
