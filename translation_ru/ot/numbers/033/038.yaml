source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: ru
  text: И Аарон, священник, взошёл на гору Ор по повелению Яхве[a] и умер там — в сороковом году после исхода сынов Израиля из земли Египта, в пятый месяц, в первый день месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по слову Яхве»; буквально: «по устам Яхве».'
    reason: Лексическая альтернатива и буквальное значение древнееврейской идиомы עַל פִּי.
lexical_decisions:
- source_word: וַיַּעַל
  choice: взошёл
  rationale: Глагол עלה передаёт движение вверх; «взошёл на гору» естественно и точно в русском контексте.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямо передаёт титул Аарона; приложение обособлено запятыми по нормам русского языка.
- source_word: אֶל הֹר הָהָר
  choice: на гору Ор
  rationale: Передаёт принятое географическое наименование и направление движения.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Идиома буквально означает «по устам Яхве», а по смыслу указывает на действие согласно его слову или повелению; буквальный образ сохранён в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: וַיָּמָת שָׁם
  choice: и умер там
  rationale: Прямая и естественная передача действия и указания места.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: в сороковой год
  rationale: Естественная русская форма древнееврейской датировочной формулы.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: после выхода сынов Израиля
  rationale: Инфинитивная конструкция задаёт исходную точку летосчисления; «выход» сохраняет её событийный и исторический характер.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Традиционное, понятное и близкое к форме оригинала обозначение народа Израиля; в данном контексте относится ко всему народу.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет существительное «земля» и естественно звучит в достойном русском библейском регистре.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: в пятый месяц
  rationale: Прямая передача календарного указания.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Ясно передаёт древнееврейскую формулу даты.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение עַל פִּי יְהוָה
  choice: по повелению Яхве
  alternative: 'по слову Яхве; буквально: по устам Яхве'
  rationale: Основной текст передаёт идиоматический смысл божественного распоряжения, а примечание сохраняет буквальный образ и допустимую альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён для ясности, однако сохранены последовательность событий, датировочная формула и образность значимой идиомы в примечании.
