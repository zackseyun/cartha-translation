  source_fidelity: 'Смысл и порядок исходного текста в целом переданы верно: восхождение Аарона на гору Ор, повеление Яхве, смерть и датировка сохранены. Однако «в сороковой год после выхода» менее точно передаёт древнееврейскую формулу датировки и по-русски может восприниматься как конкретный год, следующий за выходом; требуется форма «в сороковом году после исхода».'
  naturalness: Текст в целом понятен, но «из земли Египетской» стилистически архаично для целевого современного литературного русского. «Из земли Египта» сохраняет лексему «земля» и звучит современнее. Формула «в сороковом году после исхода» также естественнее.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «По повелению Яхве» — точная идиоматическая передача עַל־פִּי יהוה; примечание уместно сохраняет альтернативу и буквальный образ. «Сыны Израиля» допустимо как близкое оригиналу наименование народа.
