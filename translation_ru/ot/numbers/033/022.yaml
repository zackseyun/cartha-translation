  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: ru
  text: Они отправились из Риссы и расположились станом в Кегелате.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Они отправились
  rationale: Глагол נסע в формуле перечисления стоянок означает сняться с места и отправиться к следующей стоянке. «Отправились» естественно звучит по-русски и сохраняет последовательность пути.
- source_word: מֵרִסָּה
  choice: из Риссы
  rationale: Предлог מִן/מֵ передаёт исходную точку движения; географическое название רִסָּה транслитерировано в традиционной русской форме «Рисса» и поставлено в родительный падеж.
- source_word: וַיַּחֲנוּ
  choice: и расположились станом
  rationale: Глагол חנה обозначает устройство лагеря на очередной стоянке. Выражение «расположились станом» понятно современному читателю и сохраняет конкретный смысл походного лагеря.
- source_word: בִּקְהֵלָתָה
  choice: в Кегелате
  rationale: Предлог בְּ обозначает место стоянки. Название קְהֵלָתָה передано как «Кегелата» в соответствии с принятой русской библейской формой; после «в» употреблён предложный падеж.
