  source_fidelity: 'Текст точно передаёт обе глагольные формы маршрутной формулы: וַיִּסְעוּ — «отправились», וַיַּחֲנוּ — «расположились станом», а также исходный и конечный пункты («из Риссы», «в Кегелате»). Прямое соответствие еврейскому ת в названии «Кегелата» обоснованно; вариант с «ф» отражал бы иную традицию передачи имени, а не форму WLC.'
