  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: ru
  text: Тогда Моисей и Аарон пали ниц перед всем собранием общины сынов Израиля[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; также возможно: «детей Израиля». Буквально по-еврейски: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение «собрание общины» соединяет два близких обозначения сообщества, придавая фразе особую торжественность и выразительность.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: пали
  rationale: Форма от נפל буквально обозначает падение; множественное число по-русски согласуется с составным подлежащим «Моисей и Аарон». В сочетании с «ниц» передаёт телесное простирание без дополнительного толкования его мотива.
- source_word: עַל פְּנֵיהֶם
  choice: ниц
  rationale: Устойчивое современное русское соответствие еврейскому выражению «на свои лица»; естественно и достойно передаёт позу полного простирания.
- source_word: לִפְנֵי
  choice: перед
  rationale: Передаёт нахождение в публичном присутствии всей собравшейся общины.
- source_word: כָּל
  choice: всем
  rationale: Согласование с собирательным существительным сохраняет значение полноты.
- source_word: קְהַל
  choice: собранием
  rationale: Обозначает собравшееся множество и сохраняет первый из двух близких общинных терминов.
- source_word: עֲדַת
  choice: общины
  rationale: Передаёт организованное сообщество и позволяет сохранить двойное выражение קְהַל עֲדַת.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет грамматически мужское и родовое выражение оригинала; более естественный вариант «израильтян» указан в примечании.
theological_decisions:
- issue: Сглаживать ли двойное коллективное выражение קְהַל עֲדַת до одного русского существительного
  choice: 'сохранить оба термина: «собранием общины»'
  alternative: «всей общиной» или «всем собранием»
  rationale: В еврейском тексте стоят два близких существительных, вероятно придающих сцене публичную и торжественную силу. Их сохранение не устраняет возможный смысловой оттенок конструкции.
- issue: Передавать ли בְּנֵי יִשְׂרָאֵל нейтральным этнонимом
  choice: «сынов Израиля»
  alternative: «израильтян» или «детей Израиля»
  rationale: Основной текст сохраняет формальную структуру и мужскую форму оригинала, не превращая её в дополнительное богословское утверждение; естественные лексические варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Пали ниц» — понятная устойчивая формула; конструкция «собрание общины» намеренно сохраняет формальную плотность еврейского текста.
