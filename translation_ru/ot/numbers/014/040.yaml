base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: ru
  text: 'Рано утром они встали и поднялись на вершину горы. Они сказали: «Вот мы; мы поднимемся к тому месту, о котором сказал Яхве, потому что мы согрешили».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Рано утром они встали
  rationale: Сочетание глагола שׁכם в породе хифиль с בַבֹּקֶר подчёркивает раннее начало действия; этот перевод естественно передаёт оба элемента без тяжеловесного повтора.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: поднялись на вершину горы
  rationale: עלה означает движение вверх, а רֹאשׁ הָהָר — верх или вершину горы. Русское выражение точно и естественно передаёт пространственный образ.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит прямую речь; деепричастие сохраняет структуру исходного текста и приемлемо в литературном русском.
- source_word: הִנֶּנּוּ
  choice: Вот мы
  rationale: Формула самопредставления передана буквально и естественно, без добавления толкования «мы готовы».
- source_word: וְעָלִינוּ
  choice: мы пойдём
  rationale: Перфект с союзом в данном контексте выражает намерение совершить последующее действие. Будущее время передаёт это значение; движение вверх уже ясно из контекста восхождения, поэтому по-русски допустимо «пойдём».
- source_word: אֶל הַמָּקוֹם
  choice: к тому месту
  rationale: מָקוֹם — обычное слово «место»; указательное «тому» естественно связывает его с последующим определительным оборотом.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: о котором сказал Яхве
  rationale: Глагол אָמַר буквально означает «сказал». Оборот «о котором сказал» естественно обозначает ранее названное Богом место, не усиливая смысл до «обещал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: כִּי חָטָאנוּ
  choice: потому что мы согрешили
  rationale: כִּי вводит основание заявления, а חטא сохраняет нравственно-богословский смысл греха; прошедшее совершенное естественно для прямого признания по-русски.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, а не титул. «Яхве» сохраняет это и соответствует наиболее принятой научной реконструкции произношения.
- issue: Смысл признания חָטָאנוּ
  choice: мы согрешили
  alternative: мы были неправы
  rationale: Более слабое «были неправы» устранило бы выраженную исходным глаголом нравственную и богословскую вину.
translation_notes:
  register: Современный литературный русский с умеренно формальной библейской тональностью. Сохранены краткость признания и некоторая резкость перехода от «Вот мы» к заявлению о намерении; неоднозначность формы וְעָלִינוּ передана как твёрдое намерение, без добавления слова «готовы».
