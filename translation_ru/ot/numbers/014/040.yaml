  to: 'Рано утром они встали и поднялись на вершину горы. Они сказали: «Вот мы; мы поднимемся к тому месту, о котором сказал Яхве, потому что мы согрешили».'
  rationale: 'Исправлено только безопасное смысловое упущение: «пойдём» заменено на «поднимемся», чтобы передать עלה. Форму введения речи сделана более естественной для современного русского. Сноска удалена как необязательная и поскольку её вариант «указал» вносит интерпретирующий оттенок, отсутствующий в исходном אָמַר («сказал»).'
