  terminology: '«Яхве» последовательно передаёт тетраграмматон как личное имя. «Народ» правильно сохраняет собирательное единственное число עָם. Сноску следует исправить: «о которой поклялся им» не является точной передачей синтаксиса; относительное местоимение относится к земле как к подразумеваемому объекту клятвы, а לָהֶם означает адресатов клятвы.'
