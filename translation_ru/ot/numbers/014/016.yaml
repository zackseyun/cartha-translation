base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: ru
  text: Поскольку Яхве не смог привести этот народ в землю, которую он поклялся дать им[a], он перебил их в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в землю, которую он поклялся им [дать]». Глагол «дать» в еврейском тексте не выражен, но подразумевается по смыслу клятвы.'
    reason: В еврейском тексте содержание клятвы выражено эллиптически; основной текст восполняет подразумеваемый глагол ради естественного русского синтаксиса.
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: Поскольку … не смог
  rationale: Оборот обозначает причиной предполагаемую неспособность Яхве. Такая конструкция естественна по-русски и сохраняет логику обвинения, которое, согласно контексту, могут высказать народы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: לְהָבִיא
  choice: привести … в землю
  rationale: Каузативная форма глагола בוא означает «ввести, привести»; сочетание с направлением естественно передаётся по-русски как «привести в землю».
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняется собирательное значение единственного числа עָם и его указательная выразительность.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: которую поклялся дать им
  rationale: В еврейском обороте объект клятвы выражен эллиптически. Добавление «дать» делает фразу грамматически и смыслово ясной по-русски, не меняя подразумеваемого обещания земли.
- source_word: וַיִּשְׁחָטֵם
  choice: он зарезал их
  rationale: שׁחט — сильный глагол со значением заклания или убоя. «Зарезал» сохраняет резкость предполагаемого обвинения и не смягчает его до общего «убил».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В данном повествовательном контексте מִדְבָּר обозначает пустынную местность, где находился Израиль.
theological_decisions:
- issue: Утверждение о неспособности Яхве
  choice: Поскольку Яхве не смог привести этот народ…
  alternative: Из-за недостатка силы у Яхве привести этот народ…
  rationale: Текст сохраняет предполагаемое обвинение других народов в адрес Яхве и не смягчает его богословским пояснением. Контекст показывает, что это не авторское утверждение о природе Бога, а содержание возможной молвы.
- issue: Суровость глагола שׁחט
  choice: зарезал их
  alternative: погубил их
  rationale: Более сильная формулировка передаёт намеренно резкий характер обвинения, не истолковывая и не ослабляя его.
translation_notes:
  register: Современный литературный русский язык с простой, торжественно-сдержанной фразой. Резкое «зарезал» намеренно сохраняет силу еврейского שׁחט и характер обвинения. Местоимение «он» написано со строчной буквы в соответствии с обычной современной орфографией.
