  verdict: revise
  source_fidelity: 'Основная причинно-следственная конструкция точно передаёт מִבִּלְתִּי יְכֹלֶת: это предполагаемая народами причина, а не утверждение переводчика о действительной неспособности Яхве. «Привести этот народ в землю» соответствует לְהָבִיא אֶת־הָעָם ... אֶל־הָאָרֶץ. Восполнение «дать» в отношении клятвы допустимо: объект обещания эллиптически подразумевается контекстом. Для שׁחט предпочтительнее «перебил», чем «зарезал»: оно сохраняет суровость массового истребления, но не навязывает конкретный способ умерщвления.'
