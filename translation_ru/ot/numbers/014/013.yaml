  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: ru
  text: 'Но Моисей сказал Яхве: «Тогда об этом услышат египтяне[a], ведь Ты Своей силой вывел этот народ из их среды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «И египтяне уже слышали, что Ты Своей силой вывел этот народ из их среды». Еврейскую глагольную форму можно понять как прошедшее время либо как будущее следствие в доводе Моисея; основной текст следует второму пониманию, которое лучше согласуется с контекстом.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Моисей сказал
  rationale: Последовательная повествовательная форма продолжает рассказ, а союз «но» естественно передаёт противопоставление между намерением Яхве, высказанным в предыдущем стихе, и возражением Моисея.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: Тогда об этом услышат египтяне
  rationale: Форма глагола понята как будущее следствие в ходе заступнической речи Моисея. «Египтяне» передаёт название страны как обозначение её жителей; «об этом» естественно восполняет подразумеваемый объект — объявленное уничтожение Израиля.
- source_word: כִּי
  choice: ведь
  rationale: В основном тексте союз вводит основание того, почему египтяне узнают о случившемся; «ведь» сохраняет объяснительную связь и естественно звучит по-русски.
- source_word: הֶעֱלִיתָ
  choice: вывел
  rationale: Каузатив глагола עלה буквально означает «поднять, вывести». В контексте исхода «вывел» точно и естественно передаёт избавление народа из Египта.
- source_word: בְכֹחֲךָ
  choice: Своей силой
  rationale: Предлог ב выражает средство действия; творительный падеж естественно передаёт это значение по-русски. Прописная буква согласуется с уважительным обращением к Богу.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохранены единственное число собирательного существительного и указательное значение.
- source_word: מִקִּרְבּוֹ
  choice: из их среды
  rationale: Местоименный суффикс единственного числа относится к Египту как единому целому, но по-русски множественное «их» ясно соотносится с египтянами и сохраняет смысл происхождения из их окружения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Временное и логическое значение וְשָׁמְעוּ и כִּי
  choice: 'будущее следствие: «Тогда… услышат…, ведь…»'
  alternative: 'прошедшее сообщение: «И египтяне уже слышали, что…»'
  rationale: В контексте Моисей говорит о последствиях возможного уничтожения народа, поэтому перспективное прочтение лучше связывает стих с дальнейшим доводом. Однако еврейская форма допускает прошедшее значение, а כִּי — значение изъяснительного «что»; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; подлинная неоднозначность времени глагола и функции כִּי не устранена, а вынесена в сноску.
