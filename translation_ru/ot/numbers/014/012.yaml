  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: ru
  text: Я поражу его мором и лишу его наследственного удела[a], а из тебя сделаю народ больше и сильнее его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишу его владения». Еврейский глагол может означать лишение наследственного удела или владения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Я поражу его
  rationale: Форма от נכה означает «поразить, ударить». Местоимение мужского рода единственного числа сохраняет еврейское представление об Израиле как о едином народе.
- source_word: בַדֶּבֶר
  choice: мором
  rationale: דֶּבֶר обозначает губительную эпидемию, особенно как Божий суд. «Мор» — краткий и укоренённый в русском библейском стиле эквивалент.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: и лишу его наследия
  rationale: Hифиль от ירשׁ допускает значения лишения владения или наследия. В данном контексте формулировка передаёт угрозу отстранить Израиль от обещанного ему удела, не сводя смысл лишь к физическому изгнанию.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: а от тебя произведу народ
  rationale: Оборот עשה + объект + לְ означает сделать кого-либо чем-либо. По-русски «от тебя произведу народ» естественно выражает создание нового народа из потомков Моисея.
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: больше и сильнее его
  rationale: Сочетание прилагательных с מִן имеет сравнительный смысл. עָצוּם может указывать на силу или многочисленность; «сильнее» сохраняет широкое значение могущества, а «больше» — величины или численности.
theological_decisions:
- issue: Референт местоименных суффиксов единственного числа
  choice: Сохранить формы «его» и «его», представляющие Израиль как единый народ.
  alternative: 'Передать во множественном числе: «их» и «их».'
  rationale: В еврейском тексте стоят суффиксы 3-го лица мужского рода единственного числа. Русское «народ» также допускает последовательное согласование в единственном числе, поэтому корпоративная образность сохраняется без неестественности.
- issue: Смысл глагола ירשׁ в угрозе Израилю
  choice: «лишу его наследия»
  alternative: «лишу его владения» или «изгоню его»
  rationale: Глагол объединяет оттенки лишения наследственного удела и удаления из владения. Основной текст сохраняет тему наследия; альтернативный пространственно-имущественный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с торжественной библейской сжатостью. Синтаксис естественен для прямой Божьей речи; корпоративное единственное число оригинала сохранено.
