base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: ru
  text: Но Моего слугу Халева — за то, что с ним был иной дух[a] и он всецело следовал за Мной[b], — Я введу в землю, куда он ходил, и его потомки овладеют ею[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у него был иной настрой». Слово «дух» здесь может обозначать внутреннее расположение Халева, отличавшее его от остальных израильтян.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наполнил вслед за Мной» — еврейская идиома со значением «следовал за Мной полностью, всем сердцем».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «унаследуют её»; употреблённый еврейский глагол может означать наследование земли или вступление во владение ею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: Но раба Моего Халева
  rationale: Союз передаёт противопоставление Халева неверующему поколению из предшествующего контекста. «Раб» — уместное и традиционное обозначение верного Божьего служителя; винительный падеж обусловлен последующим «введу его» и естественно передаёт еврейскую вынесенную вперёд конструкцию.
- source_word: עֵקֶב
  choice: за то, что
  rationale: Передаёт причинное основание обещанного Халеву благоволения и естественно сочетается с вынесенным вперёд дополнением.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: с ним был иной дух
  rationale: 'Близко сохраняет еврейскую конструкцию и многозначность רוּחַ: речь может идти о духе, внутреннем настрое или расположении, без преждевременного отождествления со Святым Духом.'
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: и он во всём следовал за Мной
  rationale: Еврейская идиома буквально говорит о «наполнении вслед за» и означает полное, безраздельное следование. Русская формулировка ясна и сохраняет идею полноты.
- source_word: וַהֲבִיאֹתִיו
  choice: Я введу
  rationale: Форма выражает твёрдо обещанное будущее действие Бога. Объект уже назван в начале фразы, поэтому местоимение «его» по-русски можно не повторять.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: в землю, куда он ходил
  rationale: Передаёт конкретное предшествующее путешествие Халева в Ханаан как разведчика и близко отражает сочетание בוא со שמה, не уточняя сверх текста способ его входа.
- source_word: וְזַרְעוֹ
  choice: и его потомки
  rationale: Коллективное זֶרַע в данном контексте естественно обозначает потомков; буквальное «семя» в современном русском звучало бы менее прозрачно.
- source_word: יוֹרִשֶׁנָּה
  choice: овладеют ею
  rationale: Глагол ירשׁ применительно к земле включает вступление во владение. Множественное число согласовано с русским коллективным существительным «потомки».
theological_decisions:
- issue: Значение выражения «иной дух» у Халева
  choice: Сохранено широкое выражение «с ним был иной дух».
  alternative: «У него был иной настрой» или прямое указание на особое присутствие Духа Божьего.
  rationale: Слово רוּחַ может обозначать дух, внутренний настрой или расположение. Сам текст не уточняет, что здесь непосредственно назван Святой Дух, поэтому перевод сохраняет богословскую открытость.
- issue: Характер следования Халева за Богом
  choice: «Во всём следовал за Мной».
  alternative: «Всем сердцем следовал за Мной» или «до конца следовал за Мной».
  rationale: Выбранная формулировка передаёт полноту верности, не сводя её исключительно к эмоциональной искренности или временной стойкости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксическое обособление причинного оборота сохраняет вынесение Халева на первый план и делает длинную фразу ясной. Прописные местоимения при обращении Бога к Себе использованы в соответствии с распространённой русской библейской традицией.
