source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: ru
  text: 'Скажи им: «Жив Я, — возвещает ГОСПОДЬ, — как вы говорили при Мне, так Я с вами и поступлю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: Жив Я
  rationale: Сохраняет краткую древнееврейскую формулу божественной клятвы и её торжественный характер.
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: Передаёт пророческую формулу נְאֻם как авторитетное провозглашение; тетраграмматон представлен традиционным «ГОСПОДЬ».
- source_word: בְּאָזְנָי
  choice: при Мне
  rationale: Естественно по-русски передаёт идиому «в Мои уши / в Моём слухе», то есть сказанное так, что Бог это слышал.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: как ... так
  rationale: Сохраняет точное соответствие между словами народа и предстоящим Божьим действием.
theological_decisions:
- issue: Клятвенная конструкция אִם־לֹא после «Жив Я»
  choice: Передать утвердительную силу всей формулой «Жив Я… как… так…» без отдельного «непременно»
  alternative: '«Жив Я… непременно: как… так…»'
  rationale: В данном контексте אִם־לֹא является частью еврейской формулы клятвы и усиливает уверенность высказывания; русская формула «Жив Я» уже выражает эту силу, а дополнительное наречие утяжеляет фразу.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной клятвенной формулой. Синтаксический параллелизм оригинала сохранён; архаичное буквальное «в уши Мои» заменено естественным «при Мне».
