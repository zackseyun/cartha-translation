translation:
  language: ru
  text: Тогда вся община подняла голос и громко закричала[a], и народ плакал в ту ночь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вся община подняла [голос] и дала свой голос»; это древнееврейский оборот, означающий громкий общий крик.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: подняла
  rationale: Глагол נָשָׂא буквально означает «поднимать, нести»; в сочетании с последующим упоминанием голоса передаёт начало громкого общего крика.
- source_word: כָּל הָעֵדָה
  choice: вся община
  rationale: עֵדָה обозначает собравшееся общество Израиля. «Община» точно и естественно передаёт коллективный смысл, а «вся» сохраняет כָּל.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: громко закричала
  rationale: 'Буквально: «дали свой голос». Это древнееврейский оборот, обозначающий громкий возглас или общий крик; выбранный перевод естественен по-русски и в сочетании с «подняла голос» сохраняет выразительность оригинала.'
- source_word: הָעָם
  choice: народ
  rationale: Прямое соответствие עָם. Сохранена смена обозначения с «общины» на «народ», присутствующая в еврейском тексте.
- source_word: וַיִּבְכּוּ
  choice: плакал
  rationale: בכה означает «плакать, рыдать». «Плакал» отличает продолжительный плач народа от предшествующего громкого общего крика.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Естественный русский эквивалент обстоятельственного выражения «в ту ночь».
