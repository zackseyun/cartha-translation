base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: ru
  text: Тогда амаликитяне и хананеи, жившие в той горной области, спустились, поразили их и сокрушили их до самой Хормы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хорма — название места; в еврейском языке оно связано со словом, означающим «уничтожение» или «предание уничтожению».
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: спустились
  rationale: Глагол перед составным подлежащим стоит в единственном числе по обычной еврейской конструкции, но по-русски требует множественного; сохраняется направленное движение вниз из горной области.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: амаликитяне и хананеи
  rationale: Обе формы морфологически единственного числа употреблены собирательно; последующие глаголы множественного числа подтверждают значение групп народов.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: жившие в той горной области
  rationale: יֹשֵׁב означает проживание, а הָר здесь обозначает гористую местность, откуда войско спускается, а не обязательно отдельную гору.
- source_word: וַיַּכּוּם
  choice: напали на них
  rationale: נכה допускает значения «поразить», «ударить», «разбить». В военном контексте «напали на них» естественно передаёт первый удар, не дублируя усилительный следующий глагол.
- source_word: וַיַּכְּתוּם
  choice: громили их
  rationale: Редкий глагол передаёт сокрушительное избиение или разгром; «громили» сохраняет интенсивность и допускает продолженное преследование без утверждения о полном уничтожении.
- source_word: עַד הַחָרְמָה
  choice: до самой Хормы
  rationale: עַד обозначает предел движения или разгрома; частица «самой» естественно подчёркивает пространственный предел. Название места передано транслитерацией.
