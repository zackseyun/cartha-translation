    issue: «Напали на них» недостаточно точно передаёт וַיַּכּוּם.
    rationale: Глагол נכה означает нанесение удара/поражение; «напали» обозначает начало враждебного действия, но не выражает самого удара, который явно назван в оригинале.
  - severity: low
    issue: «Громили» стоит в несовершенном виде.
    rationale: Еврейская повествовательная форма описывает последовавшее действие как событие; совершенный вид «сокрушили» точнее и яснее передаёт его результативную силу.
  - severity: low
    issue: Формулировка сноски «по-еврейски» менее точна по регистру.
    rationale: «В еврейском языке» — нейтральная современная формулировка для пояснения еврейской этимологической связи.
