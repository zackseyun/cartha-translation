  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: ru
  text: А ваши сыновья сорок лет будут пастухами в пустыне[a] и понесут на себе последствия вашего блуда[b], пока в пустыне не исчезнут ваши трупы.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут скитальцами в пустыне». Еврейское слово буквально связано с пастьбой и пастушеской жизнью, но здесь его иногда понимают как указание на кочевые странствия.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «блуд», буквально относится к сексуальной неверности и в данном контексте может образно обозначать неверность Богу.
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «пока не придут к концу ваши трупы в пустыне».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: А ваши сыновья
  rationale: בנים в форме мужского множественного числа обычно означает «сыновья»; контекст не требует расширять значение до общего «дети».
- source_word: רֹעִים
  choice: будут пастухами
  rationale: Причастие от רעה прямо связано с выпасом и пастушеством. Буквальное значение сохранено, а возможный смысл кочевой жизни указан в сноске.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность, пригодную также для выпаса; «пустыня» естественно и традиционно передаёт здесь место странствий Израиля.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямое обозначение продолжительности.
- source_word: וְנָשְׂאוּ
  choice: понесут на себе последствия
  rationale: נשא буквально значит «нести»; в данном контексте речь идёт о несении последствий чужой неверности. Добавление «последствия» делает русский оборот понятным, не приписывая сыновьям вину отцов.
- source_word: אֶת זְנוּתֵיכֶם
  choice: вашего распутства
  rationale: זְנוּת выражает блуд, распутство или неверность посредством полового образа. «Распутство» сохраняет резкость метафоры и допускает её переносный, заветный смысл.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: пока ваши мёртвые тела не истлеют
  rationale: תֹּם указывает на окончание или полное исчезновение, а פגר — на труп, мёртвое тело. В контексте естественный русский оборот передаёт окончательную гибель осуждённого поколения, не вводя внешнего деятеля.
theological_decisions:
- issue: Следует ли понимать זְנוּתֵיכֶם как буквальную половую распущенность или как образ заветной неверности
  choice: «вашего распутства» с пояснением в сноске о переносном смысле неверности Богу
  alternative: «вашей неверности»
  rationale: Контекст говорит о мятеже Израиля против Господа, поэтому только буквальное половое понимание слишком узко; однако нейтральное «неверность» устранило бы намеренно резкий половой образ исходного слова.
- issue: Следует ли передавать רֹעִים как «странниками»
  choice: Сохранено буквальное «пастухами»
  alternative: «скитальцами» или «странниками»
  rationale: Еврейское слово лексически связано с пастушеством. Странствия являются контекстуальным следствием приговора, но не бесспорным прямым значением формы.
- issue: Несут ли сыновья вину родителей
  choice: «понесут на себе последствия»
  alternative: «понесут ваше распутство»
  rationale: 'Оборот сохраняет образ несения, но не разрешает богословское напряжение в сторону переноса личной виновности: дети переживают последствия неверности поколения родителей.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Пастухами» сохраняет конкретный образ оригинала; «распутство» передаёт его резкость, а сноска раскрывает заветный переносный смысл. Формулировка «мёртвые тела не истлеют» естественнее буквальной кальки и сохраняет мрачную окончательность приговора.
