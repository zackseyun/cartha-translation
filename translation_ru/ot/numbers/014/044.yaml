  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: ru
  text: Но они самонадеянно решились подняться[a] на вершину горы, а ковчег завета Яхве[b] и Моисей не покинули стана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дерзко пошли вверх»; еврейский глагол обозначает своевольный, самонадеянный поступок.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское собственное имя Бога; традиционно также переводится как «Господь».
    reason: divine_name
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: самонадеянно решились
  rationale: Редкий глагол передаёт не просто движение вверх, а своевольный, дерзкий поступок вопреки предупреждению. Сочетание сохраняет нравственную окраску и естественно звучит по-русски.
- source_word: לַעֲלוֹת
  choice: подняться
  rationale: Обычный русский глагол направленного движения вверх, соответствующий контексту восхождения.
- source_word: אֶל רֹאשׁ הָהָר
  choice: на вершину горы
  rationale: רֹאשׁ буквально означает «голова», а здесь идиоматически — «вершина»; הָהָר имеет форму единственного числа.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: а ковчег завета Яхве
  rationale: Сохраняется еврейская конструкция принадлежности и противопоставление между самовольным выступлением народа и оставшимися в стане ковчегом и Моисеем.
- source_word: לֹא מָשׁוּ מִקֶּרֶב הַמַּחֲנֶה
  choice: не покинули стана
  rationale: Глагол מוש означает удаляться или отходить. Русское выражение точно передаёт, что ковчег и Моисей не вышли из лагеря, без неестественного буквального оборота «не сдвинулись из среды».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, тетраграмматон. Форма «Яхве» передаёт его как личное имя, не заменяя титулом.
- issue: Нравственная окраска действия וַיַּעְפִּלוּ
  choice: самонадеянно решились подняться
  alternative: дерзко пошли вверх; своевольно поднялись
  rationale: Контекст указывает на сознательное выступление вопреки слову Яхве. Перевод сохраняет виновную самоуверенность, не сводя глагол к нейтральному восхождению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Стан» выбран как понятное традиционное обозначение лагеря; синтаксис сделан плавным, при этом сохранены противопоставление и богословски значимая окраска самовольного поступка.
