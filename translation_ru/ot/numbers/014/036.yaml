  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Роптать» сохраняет характерный для повествований о странствиях мотив недовольства и мятежного сетования, а «дурная молва» передаёт отрицательный и порочащий оттенок דִבָּה.
