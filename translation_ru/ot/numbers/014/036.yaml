source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: ru
  text: Люди, которых Моисей послал разведать землю[a], вернулись и побудили всю общину роптать против него, распространив дурную молву о земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исследовать землю».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вынеся дурную молву о земле»; возможно также: «принеся дурной отзыв о земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Люди
  rationale: Начальное וְ связывает стих с контекстом, но в естественном русском повествовании отдельное «и» здесь необязательно.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: которых Моисей послал
  rationale: Прямая и ясная передача определительного придаточного, где местоимение является дополнением к глаголу «послал».
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: разведать землю
  rationale: В данном контексте תור обозначает осмотр и разведку Ханаана; «разведать» естественно по-русски и не сужает смысл до тайного шпионажа.
- source_word: וַיָּשֻׁבוּ
  choice: вернулись
  rationale: Обычная повествовательная передача глагола שוב.
- source_word: וילונו עָלָיו
  choice: побудили ... роптать против него
  rationale: 'Форма и наличие прямого дополнения «всю общину» указывают на каузативный смысл: эти люди вызвали ропот общины против Моисея.'
- source_word: אֶת כָּל־הָעֵדָה
  choice: всю общину
  rationale: עֵדָה обозначает собранное сообщество Израиля; «община» понятно современному читателю и сохраняет коллективный смысл.
- source_word: לְהוֹצִיא דִבָּה
  choice: распространив дурную молву
  rationale: דִבָּה — порочащая, дурная весть или молва; сочетание с הוציא допускает представление о вынесении или распространении такого сообщения. Деепричастие естественно выражает средство, которым был вызван ропот.
- source_word: עַל־הָאָרֶץ
  choice: о земле
  rationale: Предлог עַל здесь вводит предмет дурной молвы; русское «о» наиболее естественно.
theological_decisions: []
