id: NUM.14.2
reference: Numbers 14:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: ru
  text: 'И все сыны Израиля[a] стали роптать[b] на Моисея и Аарона, и вся община сказала им: «О, если бы мы умерли в земле Египта! Или если бы мы умерли в этой пустыне!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все израильтяне». Буквально: «все сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стали жаловаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: стали роптать
  rationale: Глагол выражает недовольные, мятежные жалобы общины на её вождей. «Стали роптать» ясно и естественно передаёт это значение в современном литературном русском языке.
- source_word: עַל
  choice: на
  rationale: При глаголе «роптать» русский предлог «на» естественно обозначает тех, против кого направлено недовольство.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: все сыны Израиля
  rationale: Так сохраняется буквальный образ еврейского выражения «все сыновья Израиля», которое здесь служит национальным обозначением всего народа.
- source_word: כָּל הָעֵדָה
  choice: вся община
  rationale: Слово עֵדָה в Числах обозначает собранное сообщество Израиля; «община» передаёт корпоративный смысл точнее, чем современное «общество».
- source_word: לוּ
  choice: О, если бы / если бы
  rationale: Частица вводит неосуществившееся пожелание. Такая конструкция сохраняет эмоциональную силу жалобы без добавления идеи, прямо не выраженной в исходном тексте.
- source_word: מַתְנוּ / מָתְנוּ
  choice: мы умерли
  rationale: После לוּ русское прошедшее время в условно-желательной конструкции естественно выражает контрфактическое желание, относящееся к прошлому.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египта
  rationale: Формулировка сохраняет полное географическое выражение исходного текста, оставаясь понятной современному читателю.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: в этой пустыне
  rationale: «Пустыня» — естественный русский эквивалент מִדְבָּר в контексте странствования Израиля и сохраняет указательное «этой».
theological_decisions:
- issue: Гендерно маркированное национальное обозначение בְּנֵי יִשְׂרָאֵל
  choice: все сыны Израиля
  alternative: все израильтяне
  rationale: Основной текст сохраняет мужскую форму и родовой образ исходного выражения, хотя в данном контексте оно обозначает народ в целом; более идиоматичный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Сыны Израиля» сознательно сохраняет форму исходного национального обозначения; «вся община» и «стали роптать» понятны обычному современному читателю. Повтор пожелания сохранён ради риторического напряжения еврейского текста.
