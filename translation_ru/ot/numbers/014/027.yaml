  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: ru
  text: Долго ли ещё эта злая община[a] будет роптать против Меня? Я слышал жалобы сынов Израиля[b], которые они обращают против Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрание» или «сообщество».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израильтян» или «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Долго ли ещё
  rationale: Естественно передаёт временной вопрос с оттенком негодования; буквальное «до каких пор» также возможно, но здесь звучит менее естественно.
- source_word: לָעֵדָה
  choice: община
  rationale: עֵדָה обозначает собранное сообщество Израиля; «община» сохраняет коллективный смысл и уместна в современном литературном русском.
- source_word: הָרָעָה הַזֹּאת
  choice: эта злая
  rationale: Прилагательное выражает нравственную оценку общины, а не просто неодобрение или неблагоприятное качество.
- source_word: מַלִּינִים
  choice: роптать / ропщут
  rationale: В повествованиях о странствиях Израиля глагол обозначает упорное, мятежное недовольство; «роптать» сохраняет этот оттенок и повтор корня.
- source_word: עָלַי
  choice: против Меня
  rationale: Предлог в данном контексте выражает направленность жалоб против Бога, а не просто речь о Нём.
- source_word: תְּלֻנּוֹת
  choice: ропот
  rationale: Существительное означает выражаемые жалобы; «ропот» сохраняет лексическую связь с повторяющимся глаголом и торжественный, но понятный регистр.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет мужскую форму древнееврейского выражения и его традиционную образность; более идиоматическое «израильтян» отмечено в сноске.
- source_word: שָׁמָעְתִּי
  choice: Я слышал
  rationale: 'Русское прошедшее время естественно передаёт перфект: Бог уже услышал продолжающийся ропот и теперь отвечает.'
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Основной текст сохраняет грамматически мужскую и образную форму оригинала, не исключая того, что выражение может обозначать народ Израиля в целом.
- issue: Направленность ропота עָלַי
  choice: против Меня
  alternative: на Меня / обо Мне
  rationale: Контекст подчёркивает противление Богу; нейтральное «обо Мне» ослабило бы это значение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Роптать» и «ропот» понятны современному читателю и сохраняют настойчивый повтор оригинала. Необычная относительная конструкция «которым они ропщут» намеренно сохраняет синтаксическую напряжённость еврейского текста, не превращая её в отдельное истолкование.
