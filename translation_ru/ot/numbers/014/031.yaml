base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: ru
  text: Но ваших малых детей, о которых вы говорили, что они станут добычей[a], Я введу их туда, и они узнают[b] землю, которую вы отвергли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станут жертвой» или «станут трофеем».'
    reason: lexical_alternative
  - marker: b
    text: То есть узнают её на собственном опыте.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которую вы презрели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: ваших малых детей
  rationale: טַף обозначает малых детей и подчёркивает их уязвимость; «малые дети» точнее широкого «дети» и выдержаннее разговорного «малыши».
- source_word: לָבַז
  choice: станут добычей
  rationale: בַּז — военная добыча, захватываемая врагом. Русское «станут добычей» естественно передаёт опасение родителей.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: Я приведу туда
  rationale: Каузативная форма בוא означает «ввести, привести»; направление ясно из последующего упоминания земли, поэтому естественное русское «туда» передаёт подразумеваемое место назначения.
- source_word: וְיָדְעוּ
  choice: они познают
  rationale: ידע буквально значит «знать, познать» и здесь допускает опытный смысл — дети лично узнают эту землю и будут жить в ней. «Познают» сохраняет образность исходного текста.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте речь идёт о конкретной земле, обещанной Израилю; добавлять в текст «обетованную» или «Ханаан» нет необходимости.
- source_word: מְאַסְתֶּם בָּהּ
  choice: которую вы отвергли
  rationale: מאס может означать «отвергать, презирать». «Отвергли» точно выражает отказ войти в землю, не усиливая без необходимости эмоциональную окраску.
theological_decisions:
- issue: Следует ли прямо назвать землю обетованной землёй или Ханааном
  choice: Сохранить просто «землю»
  alternative: «обетованную землю» или «землю Ханаана»
  rationale: В еврейском тексте стоит только הָאָרֶץ, а конкретный референт понятен из контекста; уточнение внесло бы отсутствующий в стихе пояснительный материал.
- issue: Опытный смысл глагола ידע
  choice: «познают» с пояснением в сноске
  alternative: «узнают на собственном опыте» или «войдут во владение землёй»
  rationale: Буквальное значение и возможная опытная глубина сохраняются без сведения выражения исключительно к владению землёй.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Малые дети» сохраняет точность и уязвимость טַף; «познают» удерживает намеренную смысловую широту ידע. Все пояснения, отсутствующие непосредственно в еврейском тексте, вынесены в сноски.
