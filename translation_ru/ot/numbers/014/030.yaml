  source_fidelity: 'Начальная частица אִם верно передана как формула решительного отрицания с клятвенной силой: «Клянусь: вы не войдёте». Переданы направление «в землю», исключение כִּי אִם и оба патронима. Однако в основном тексте оборот «о которой Я, подняв руку, поклялся поселить вас в ней» синтаксически перегружен: «о которой» и «в ней» относятся к земле разными способами, а деепричастный оборот разрывает связь между «поклялся» и инфинитивом.'
  naturalness: 'Предлагаемая правка делает фразу естественной для современного литературного русского: «в которой Я поклялся поселить вас, подняв руку». Она сохраняет торжественный регистр и образ клятвенно поднятой руки, не создавая неясного сочетания «о которой ... в ней».'
  terminology: Традиционные русские библейские формы «Халев», «Иефонния» и «Иисус, сын Навина» допустимы и узнаваемы. «Поселить» точно передаёт каузативное значение לְשַׁכֵּן. Не следует заменять «Иисус» на интерпретирующее или нетрадиционное именование.
