base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: ru
  text: 'Клянусь: вы не войдёте в землю, в которой Я поклялся поселить вас, подняв руку[a], — кроме Халева, сына Иефоннии, и Иисуса, сына Навина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «землю, в которой Я поднял Свою руку, чтобы поселить вас в ней». Поднятая рука была жестом клятвы.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: 'Клянусь: вы не войдёте'
  rationale: В формуле божественной клятвы начальное אִם выражает усиленное отрицание, а не обычное условие. Вводное «Клянусь» естественно передаёт эллиптическую клятвенную формулу и сохраняет силу судебного приговора.
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: При глаголе движения בוא предлог אֶל здесь обозначает вступление внутрь территории; по-русски естественно «войти в землю».
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: о которой Я, подняв руку, поклялся
  rationale: Сохранён образ поднятой руки как жеста клятвы, но его значение выражено явно, чтобы русскому читателю не пришлось угадывать смысл идиомы.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: поселить вас в ней
  rationale: Каузативная форма שׁכן означает «дать поселиться, поселить»; местоимение «в ней» сохраняет присутствующее в еврейском тексте בָּהּ.
- source_word: כִּי אִם
  choice: кроме
  rationale: Оборот вводит единственные исключения из предшествующего отрицания.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Халев, сын Иефоннии
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён; патроним передан прямо.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: и Иисус, сын Навина
  rationale: Использованы узнаваемые традиционные русские формы имени и патронима, позволяющие отличить этого Иисуса по имени отца.
theological_decisions:
- issue: Передача клятвенной формулы и божественного суда
  choice: 'Клянусь: вы не войдёте'
  alternative: Если вы войдёте… / вы непременно не войдёте
  rationale: Формально условное אִם в данном контексте является сокращённой клятвенной формулой с отрицательным смыслом. Выбранный перевод ясно передаёт и клятву, и вынесенный Богом приговор, не превращая стих в незавершённое условие.
- issue: Обещание поселить народ и объявлённые исключения
  choice: поклялся поселить вас в ней — кроме Халева… и Иисуса…
  alternative: поднял руку, чтобы поселить вас… но только Халев… и Иисус…
  rationale: Текст сохраняет напряжение между прежней клятвой о земле и нынешним осуждением поколения, не добавляя объяснения о пределах обещания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Синтаксис сохраняет силу прямой божественной речи; традиционные формы библейских имён поддерживают узнаваемость. Маркер [a] размещён непосредственно после относящегося к нему оборота.
