  source_fidelity: 'Основной смысл передан точно: просьба о прощении вины народа соразмерно великой хесед Бога и ссылка на Его прежнее отношение к народу от Египта до настоящего времени. Однако «прощал этому народу» в русском языке требует названного объекта прощения и потому неудачно передаёт еврейскую конструкцию; безопаснее и естественнее «прощал этот народ». Лексическая двусмысленность נָשָׂאתָה надлежащим образом сохранена в сноске.'
  naturalness: «Прости, прошу» и «доныне» соответствуют современному литературному русскому с умеренно библейским регистром. «По великой неизменной любви Твоей» понятно, хотя несколько стилистически нагружено; оно допустимо. Исправление управления в последней части существенно улучшает естественность фразы.
  terminology: «Беззаконие» адекватно передаёт עָוֹן в возвышенном библейском регистре. «Неизменная любовь» приемлемо выражает устойчивый аспект חֶסֶד, а «великая» передаёт גֹדֶל. Прописное «Твоей» соответствует заявленной издательской норме. В сноске «терпел этот народ» удачно передаёт альтернативу «нести/сносить» без искусственной буквальности.
