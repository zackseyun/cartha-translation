base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: ru
  text: Прости, прошу, беззаконие этого народа по великой неизменной любви Твоей, как Ты прощал этот народ с самого Египта и доныне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Ты терпел этот народ с самого Египта и доныне». Еврейский глагол может означать «нести, выносить», а применительно к вине — «прощать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Прости, прошу
  rationale: Императив с частицей נָא передаёт настойчивую, почтительную просьбу; такой порядок слов естественен для современного русского языка.
- source_word: לַעֲוֺן
  choice: беззаконие
  rationale: עָוֹן может обозначать проступок, вину или её последствия. «Беззаконие» сохраняет нравственную весомость слова, не сужая его до одного оттенка.
- source_word: הָעָם הַזֶּה
  choice: этого народа / этому народу
  rationale: עַם — собирательное существительное в единственном числе; «народ» сохраняет эту форму и смысл общины.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: по великой неизменной любви Твоей
  rationale: חֶסֶד обозначает верную, стойкую любовь и милость. «Неизменная любовь» передаёт устойчивость Божьего благоволения, а конструкция с прилагательным звучит по-русски естественнее буквального «по величию».
- source_word: וְכַאֲשֶׁר נָשָׂאתָה לָעָם הַזֶּה
  choice: как Ты прощал этому народу
  rationale: В контексте просьбы о прощении נשא естественно понимать как «прощать»; дательный оборот отражает предлог ל. Вместе с тем буквальный образ несения допускает смысл терпеливого вынесения, отмеченный в сноске.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: с самого Египта и доныне
  rationale: Формулировка сохраняет краткое исходное указание на непрерывность Божьего отношения к народу от Египта до настоящего момента, не добавляя прямо не названного «исхода».
theological_decisions:
- issue: Значение נָשָׂאתָה в обращении Моисея
  choice: Основной текст передаёт глагол как «прощал».
  alternative: «терпел / выносил этот народ», с сохранением образа несения и долготерпения.
  rationale: Контекст прямо связан с просьбой простить беззаконие, а конструкция с ל допускает понимание «простить народу». Однако широкий смысл נשא — «нести, выносить» — создаёт реальную смысловую напряжённость между прощением и долготерпением, поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение, обращённое к Богу, дано с прописной буквы по принятой русской издательской традиции. «Доныне» сохраняет достоинство стиля и остаётся понятным современному читателю.
