base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: ru
  text: 'И теперь пусть сила Владыки[a] будет велика, прошу, как Ты сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да возвеличится сила Владыки».'
    reason: Лексическая альтернатива для юссива יִגְדַּל; основной текст ближе сохраняет значение «да будет велика».
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительное וְ, так и временно-дискурсивное עַתָּה, вводя просьбу Моисея.
- source_word: יִגְדַּל נָא כֹּחַ
  choice: пусть, прошу, явится величие силы
  rationale: Юссив выражает почтительную просьбу; такая формулировка естественно передаёт пожелание, чтобы сила Владыки явила своё величие, не предполагая, будто сама Божья сила должна количественно возрасти.
- source_word: אֲדֹנָי
  choice: Владыки
  rationale: Передаёт божественный титул אֲדֹנָי, а не тетраграмматон, и уместно звучит в возвышенной молитвенной речи.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Передаёт соответствие просьбы ранее произнесённым словам Бога.
- source_word: דִּבַּרְתָּ
  choice: Ты и сказал
  rationale: В русском контексте глагол «сказал» естественно отсылает к предшествующему Божьему заявлению; частица «и» подчёркивает апелляцию именно к Его словам.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно выполняет функцию еврейского вводного оборота перед прямой цитатой, продолжающейся в следующем стихе.
theological_decisions:
- issue: Смысл просьбы יִגְדַּל ... כֹּחַ
  choice: пусть явится величие силы
  alternative: да возвеличится сила / пусть сила станет великой
  rationale: Выбранный вариант сохраняет идею величия Божьей силы, но не разрешает богословское напряжение через предположение о буквальном увеличении присущей Богу силы; речь может идти о её явлении в действии.
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь
  rationale: В еврейском тексте стоит титул אֲדֹנָי, а не имя יהוה. «Владыка» различает их и сохраняет значение господства, не вводя конфессиональной особенности.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Инверсия умеренная; «прошу» передаёт частицу мольбы נָא без архаического «молю». Двоеточие показывает, что следующая фраза вводит цитату, продолжающуюся в ст. 18.
