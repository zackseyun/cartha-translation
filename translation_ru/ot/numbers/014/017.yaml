  naturalness: «И теперь пусть сила Владыки будет велика, прошу, как Ты сказал:» — естественная для современного литературного русского фраза с умеренно возвышенным молитвенным регистром. Двоеточие корректно вводит продолжающуюся в следующем стихе цитату.
