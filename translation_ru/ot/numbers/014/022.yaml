source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: ru
  text: Ибо все мужчины, которые видели Мою славу и Мои знамения, совершённые Мною в Египте и в пустыне, и испытывали Меня уже десять раз и не слушали Моего голоса[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не слушали Моего голоса». Еврейское выражение может также означать: «не повиновались Мне».'
    reason: Сохраняет буквальный образ исходного выражения и отмечает его идиоматическое значение повиновения.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей клятвы и приговора; «ибо» естественно передаёт пояснительно-причинную связь.
- source_word: כָל הָאֲנָשִׁים
  choice: все эти люди
  rationale: אֲנָשִׁים обозначает людей, в данном контексте — мужчин осуждаемого поколения; указательное «эти» естественно выделяет конкретную группу, не расширяя её до всего народа.
- source_word: הָרֹאִים
  choice: которые видели
  rationale: Причастие описывает людей через пережитое ими свидетельство; русское прошедшее время естественно выражает этот смысл.
- source_word: כְּבֹדִי
  choice: Мою славу
  rationale: В контексте Божьего явления כָּבוֹד означает явленную славу; это устойчивый и содержательно точный русский эквивалент.
- source_word: אֹתֹתַי
  choice: Мои знамения
  rationale: אוֹת подчёркивает значение чудесных деяний как знаков; «знамения» сохраняет эту функцию точнее, чем общее «чудеса».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: совершённые Мною
  rationale: Передаёт действие Бога естественной для русского языка причастной конструкцией без добавочного толкования.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: в Египте и в пустыне
  rationale: «Пустыня» — обычный современный русский эквивалент מִדְבָּר в повествовании об исходе.
- source_word: וַיְנַסּוּ אֹתִי
  choice: но испытывали Меня
  rationale: נסה означает подвергать испытанию, проверять; противительный союз естественно выражает смысловое столкновение с тем, что люди видели Божью славу, хотя отдельного противительного слова в еврейском нет.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: уже десять раз
  rationale: Конструкция подчёркивает достигшее полноты повторение; «уже десять раз» естественно передаёт дейктико-итоговый оттенок זֶה.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: и не слушались Моего голоса
  rationale: Идиома שׁמע בקול означает слушать с готовностью повиноваться; «не слушались Моего голоса» сохраняет образ голоса и ясно передаёт неповиновение.
theological_decisions:
- issue: Божественная речь от первого лица
  choice: Сохранить «Мою славу», «Мои знамения», «Меня», «Моего голоса» без пояснительных расширений.
  alternative: Заменить прямое самообозначение толкующими формулами.
  rationale: Еврейский текст представляет непосредственную речь Бога; перевод сохраняет её вес и не вносит дополнительной доктринальной интерпретации.
- issue: Референт הָאֲנָשִׁים
  choice: «все эти люди»
  alternative: «все мужчины»
  rationale: В контексте речь идёт о мужчинах исчисленного поколения, однако русское «люди» в конкретной указательной конструкции звучит естественнее и не утверждает, будто слово само по себе во всех случаях означает исключительно мужчин.
- issue: Связь между виденными знамениями и испытанием Бога
  choice: Передать контраст союзом «но».
  alternative: Сохранить простое соединение «и».
  rationale: Смысловой контраст присутствует в последовательности обвинения, хотя формально выражен союзом וְ; «но» делает русскую фразу ясной, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Длинная синтаксическая конструкция и завершающее тире сохранены, поскольку предложение продолжается в следующем стихе. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
