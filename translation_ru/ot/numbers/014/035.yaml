revisions:
- from: 'Я — Яхве, Я сказал: непременно поступлю так со всем этим злым обществом[a], собравшимся против Меня. В этой пустыне они погибнут[b] и здесь умрут.'
  to: 'Я, Яхве, сказал: непременно поступлю так со всей этой злой общиной[a], собравшейся против Меня. В этой пустыне им придёт конец, и там они умрут.'
  rationale: 'Исправлено «здесь» на «там» в соответствии с שָׁם. Выражение «им придёт конец» передаёт יִתַּמּוּ без преждевременного отождествления с יָמֻתוּ («умрут»). «Община» точнее обозначает עֵדָה в данном контексте и естественнее в современном литературном русском. Сноска о буквальном значении прежнего варианта b не нужна: основной текст уже прямо передаёт смысл «придёт конец».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:22Z'
review_pass:
  verdict: revise
  source_fidelity: Требуется небольшая правка. הַנּוֹעָדִים — единственное число в согласовании с עֵדָה, поэтому «общиной, собравшейся» точнее, чем «обществом, собравшимся». Главное, שָׁם означает «там», а не «здесь»; указательное противопоставление «в этой пустыне ... там» следует сохранить. Для יִתַּמּוּ предпочтительно выражение «им придёт конец», поскольку оно не сливает этот глагол с последующим прямым «умрут».
  naturalness: «Злое общество» возможно, но в современном русском может звучать как характеристика социального окружения. «Злая община» яснее передаёт обозначение собравшегося сообщества и сохраняет судебный тон. Формула «Я, Яхве, сказал» естественна в торжественном библейском регистре и лучше отражает начальное emphatic אֲנִי.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Община» — нейтральное современное соответствие עֵדָה; сноска сохраняет допустимые альтернативы. Клятвенная формула אִם־לֹא адекватно передана словом «непременно».
  issues:
  - severity: medium
    issue: Наречие שָׁם переведено как «здесь».
    rationale: Еврейский текст говорит «в этой пустыне ... и там умрут». Хотя «там» отсылает к названной пустыне, замена на «здесь» меняет пространственную перспективу оригинала.
  - severity: medium
    issue: יִתַּמּוּ передано словом «погибнут».
    rationale: В непосредственном соседстве с «умрут» это русское слово почти полностью дублирует последующий глагол. Более нейтральное «им придёт конец» сохраняет отдельность двух еврейских сказуемых.
  - severity: low
    issue: «Злое общество» менее точно и естественно для עֵדָה.
    rationale: '«Община» яснее обозначает корпоративное собрание народа; также с ним естественно согласуется причастие в единственном числе: «общиной, собравшейся».'
