source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: ru
  text: 'Я, Яхве, сказал: непременно поступлю так со всей этой злой общиной[a], собравшейся против Меня. В этой пустыне им придёт конец, и там они умрут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обществом»; также возможно: «собранием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: דִּבַּרְתִּי
  choice: Я сказал
  rationale: Совершенный вид передаёт завершённость и непреложность торжественного Божьего заявления; по-русски естественнее, чем «Я говорил».
- source_word: אִם לֹא
  choice: непременно
  rationale: В формуле клятвенного заверения выражение означает не условие, а решительную уверенность.
- source_word: הָעֵדָה הָרָעָה הַזֹּאת
  choice: всё это злое общество
  rationale: «Общество» обозначает собранную общину Израиля без позднейших церковных ассоциаций; «злое» сохраняет нравственную оценку.
- source_word: הַנּוֹעָדִים עָלָי
  choice: собравшимся против Меня
  rationale: Передаёт как совместное собрание, так и направленность мятежа против Бога.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: в этой пустыне
  rationale: Обычное и понятное русское соответствие для מִדְבָּר в данном географическом контексте.
- source_word: יִתַּמּוּ
  choice: они погибнут
  rationale: В контексте суда глагол означает, что они придут к своему концу; русский глагол сохраняет отличие от следующего прямого «умрут», хотя частично усиливает его смертельный смысл.
- source_word: וְשָׁם יָמֻתוּ
  choice: и здесь умрут
  rationale: שָׁם указывает на уже названное место; при прямой речи Бога о «этой пустыне» естественное русское указание — «здесь».
theological_decisions:
- issue: Клятвенная формула אִם לֹא
  choice: Утвердительное «непременно поступлю»
  alternative: Буквальное «если не поступлю»
  rationale: В еврейском это эллиптическая клятвенная формула сильной уверенности, а не незавершённое условие.
- issue: Значение יִתַּמּוּ рядом с יָמֻתוּ
  choice: «погибнут и здесь умрут»
  alternative: «придут к концу и там умрут»
  rationale: Контекст ясно говорит об окончательной гибели поколения, но отдельный глагол «умрут» сохранён, чтобы не слить два параллельных утверждения.
- issue: Корпоративное обозначение עֵדָה
  choice: «общество»
  alternative: «община» или «собрание»
  rationale: Передаёт коллектив, против которого произнесён приговор, не привнося специфически церковного значения.
translation_notes:
  register: Современный литературный русский язык с торжественным, судебным тоном. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
