base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: ru
  text: И зачем Яхве ведёт нас в эту землю, чтобы мы пали от меча? Наши жёны и малые дети станут добычей[a]. Не лучше ли нам вернуться в Египет?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станут лёгкой добычей», «станут жертвой врагов». Еврейское слово может обозначать военную добычу, захваченную неприятелем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: И зачем
  rationale: Союз וְ сохраняет связь с предыдущей жалобой, а вопросительное לָמָה здесь естественно передаётся как «зачем», поскольку речь идёт о предполагаемой цели действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: ведёт нас в эту землю
  rationale: Причастие выражает продолжающееся действие; «ведёт» естественно по-русски передаёт движение к цели и сохраняет настоящее время.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: Чтобы мы пали от меча?
  rationale: Сохранён образный военный оборот «пасть от меча». Отдельный вопрос естественно выражает обвинительный смысл слов народа, не устраняя возможного целевого оттенка לִ-.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: наши жёны и малые дети
  rationale: נָשִׁים в семейном контексте означает жён, а טַף обозначает прежде всего маленьких детей и подчёркивает их уязвимость.
- source_word: יִהְיוּ לָבַז
  choice: достанутся врагам как добыча
  rationale: בַּז — захваченная врагом добыча. Развёрнутая формулировка яснее для современного русского читателя и сохраняет военный контекст.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: Не лучше ли нам вернуться в Египет?
  rationale: Естественно передаёт отрицательный риторический вопрос и инфинитив שׁוּב со значением возвращения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Осмысление לִנְפֹּל как предполагаемой цели
  choice: 'Отдельный вопрос: «Чтобы мы пали от меча?»'
  alternative: «...в эту землю, чтобы пасть от меча?»
  rationale: Так сохраняется целевой оттенок конструкции и одновременно естественно передаётся возмущённое обвинение народа без утверждения, что это действительно Божья цель.
translation_notes:
  register: Современный литературный русский язык; речь эмоциональна, но сохраняет достоинство библейского повествования. Последовательность коротких риторических вопросов передаёт нарастающую жалобу народа.
