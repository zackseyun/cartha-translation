  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: ru
  text: Те люди, которые распространили дурное известие о земле, умерли от язвы перед Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: И умерли
  rationale: Форма Qal wayyiqtol от מות продолжает повествовательную последовательность; союз «и» естественно связывает стих с предыдущим контекстом.
- source_word: הָאֲנָשִׁים
  choice: те люди
  rationale: Определённая форма указывает на ранее названных разведчиков; русское «те люди» сохраняет эту анафорическую отсылку.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: которые распустили худую молву о земле
  rationale: Причастный оборот характеризует людей по их прежнему поступку. דִבָּה обозначает дурную, порочащую молву или сообщение; «распустили худую молву» естественно передаёт отрицательную и распространяемую в народе весть, не ослабляя её нравственного оттенка.
- source_word: בַּמַּגֵּפָה
  choice: от мора
  rationale: מַגֵּפָה означает губительное поражение, эпидемическую кару. «Умерли от мора» по-русски естественно выражает причину смерти и сохраняет характер Божьего суда.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי буквально выражает нахождение перед лицом или в присутствии; «перед» сохраняет лаконичность и торжественность оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» передаёт личное имя Бога, не заменяя его титулом.
- issue: Смысл выражения לִפְנֵי יְהוָה
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: 'Более буквальное «перед Яхве» сохраняет возможную смысловую широту: событие произошло в Божьем присутствии и под Его судом, не превращая подразумеваемую причинность в прямое утверждение.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Худая молва» понятно передаёт порочащую весть; «мор» сохраняет краткость и судебно-губительный оттенок מַגֵּפָה.
