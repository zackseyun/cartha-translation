  - marker: b
    text: 'Или: «молву о Тебе»; возможно также: «о Твоей славе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: И если Ты умертвишь
  rationale: Порода hифиль от מות означает «умертвить, причинить смерть». Условное «если» естественно следует из контекста продолжающейся речи Моисея, хотя וְ само по себе является союзом.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: עָם обозначает здесь Израиль как единое сообщество; «этот народ» сохраняет указательное значение и естественно звучит по-русски.
- source_word: כְּאִישׁ אֶחָד
  choice: как одного человека
  rationale: Сохранён образ еврейского выражения, передающий гибель всего народа как единого целого; падеж согласован с русским управлением глагола «умертвишь».
- source_word: הַגּוֹיִם
  choice: народы
  rationale: גּוֹיִם означает окружающие народы в противопоставлении Израилю; перевод «язычники» добавлял бы необязательную религиозную окраску.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: которые слышали молву о Тебе
  rationale: שֵׁמַע допускает значения «весть, молва, слава». Формулировка сохраняет направленную на Бога репутационную составляющую и двусмысленность между вестью и известностью.
- source_word: לֵאמֹר
  choice: 'скажут:'
  rationale: Инфинитив вводит содержание речи народов в следующем стихе; в русском это естественно передаётся личной формой и двоеточием.
theological_decisions:
- issue: Передача идиомы с существительным мужского рода אִישׁ
  choice: как одного человека
  alternative: всех разом
  rationale: Сохранён конкретный образ исходного текста, но слово «человек» здесь относится ко всему народу и не утверждает, что речь идёт только о мужчинах.
- issue: Значение שִׁמְעֲךָ как вести или славы о Боге
  choice: молву о Тебе
  alternative: весть о Тебе; Твою славу
  rationale: Источник допускает смысл вести, известности или славы. «Молва о Тебе» не сводит выражение исключительно ни к сообщению, ни к прославлению.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимение «Ты» в обращении к Богу написано с прописной буквы. Двоеточие показывает, что прямая речь продолжается в следующем стихе.
