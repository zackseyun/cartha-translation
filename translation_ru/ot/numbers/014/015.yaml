  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: ru
  text: 'И если Ты умертвишь этот народ, как одного человека[a], то народы, которые слышали весть о Тебе[b], скажут:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как одного человека»; то есть весь народ целиком, всех разом.'
