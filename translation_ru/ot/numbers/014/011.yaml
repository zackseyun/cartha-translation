  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Доколе этот народ будет презирать Меня?[a] Доколе они не будут верить Мне[b], несмотря на все знамения, которые Я совершил среди них?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет отвергать Меня с презрением?»'
    reason: Лексическая альтернатива для יְנַאֲצֻנִי; глагол может обозначать презрительное отвержение или пренебрежение.
  - marker: b
    text: 'Или: «не будут доверять Мне».'
    reason: Сохраняет оттенок доверия, присущий форме אמן с предлогом ב.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: עַד אָנָה
  choice: доколе
  rationale: Естественно для возвышенной современной русской речи и сохраняет повторяющийся риторический вопрос.
- source_word: יְנַאֲצֻנִי
  choice: будет отвергать Меня с презрением
  rationale: Глагол выражает не просто неуважение, а презрительное отвержение; сочетание передаёт обе стороны значения.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет собирательное единственное число и отчуждённо-укоризненный оттенок.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: не будут верить Мне
  rationale: Конструкция выражает веру в Бога и доверие Ему. В русском контексте «верить Мне» естественно охватывает доверие к Божьим словам и свидетельству Его дел, не внося новозаветную формулу «верить в Меня».
- source_word: בְּכֹל הָאֹתוֹת
  choice: несмотря на все знамения
  rationale: 'Предлог контекстуально имеет уступительный смысл: неверие сохраняется вопреки уже совершённым знамениям.'
- source_word: הָאֹתוֹת
  choice: знамения
  rationale: Передаёт אוֹת как значимые свидетельствующие действия, не добавляя отсутствующее в тексте определение «чудесные».
- source_word: עָשִׂיתִי
  choice: Я совершил
  rationale: Глагол «совершил» естественно сочетается со «знамениями» и передаёт завершённые действия, значимые для настоящего упрёка.
- source_word: בְּקִרְבּוֹ
  choice: среди них
  rationale: Единственное число местоименного суффикса относится к собирательному «народ»; русское множественное число естественно раскрывает этот смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Значение לֹא יַאֲמִינוּ בִי
  choice: не будут верить Мне
  alternative: не будут доверять Мне; не уверуют в Меня
  rationale: Еврейская конструкция допускает оттенки веры и доверия. Основной текст использует естественное русское выражение, а близкий оттенок доверия сохраняется в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Доколе» сохраняет торжественную силу и анафорический повтор оригинала, оставаясь понятным. Синтаксис не перегружен архаизмами; прописные местоимения при обращении к Богу следуют принятой русской религиозно-издательской норме.
