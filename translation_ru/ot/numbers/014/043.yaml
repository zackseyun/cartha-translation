source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: ru
  text: Ведь амаликитяне и хананеи — там, перед вами, и вы падёте от меча, потому что вы отступили, перестав следовать за Яхве, и Яхве не будет с вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Начальная частица вводит основание предшествующего предостережения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: амаликитяне и хананеи
  rationale: Обе формы морфологически единственного числа употреблены собирательно; в современном русском названия народов естественно передать множественным числом.
- source_word: שָׁם לִפְנֵיכֶם
  choice: там, перед вами
  rationale: Сохранены и указание места «там», и пространственное значение «перед вами».
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: и вы падёте от меча
  rationale: Буквальный образ падения в бою сохранён, а «от меча» ясно обозначает насильственную гибель.
- source_word: כִּי עַל כֵּן
  choice: потому что
  rationale: Устойчивое сочетание вводит причину грядущего поражения; русский причинный союз передаёт её без неестественной избыточности.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: отступили от следования за Яхве
  rationale: Переданы как значение поворота назад/отступления, так и образ следования за Яхве, присутствующий в מֵאַחֲרֵי.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя в тетраграмматоне передано транслитерацией, а не заменено титулом.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: и Яхве не будет с вами
  rationale: Прямо сохранены будущее значение и мотив Божьего присутствия с народом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное заветное имя; «Яхве» непосредственно передаёт его и не подменяет титулом.
- issue: Смысл שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: отступили от следования за Яхве
  alternative: отвернулись от Яхве
  rationale: Выбранная формулировка сохраняет образ прекращённого следования и не сводит выражение к более общему внутреннему отвержению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет причинные связи и повтор имени Яхве; архаизмы устранены.
