source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: ru
  text: 'Но Моисей сказал: «Зачем вы нарушаете повеление Яхве? Это не удастся».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Моисей сказал
  rationale: 'Последовательный вав продолжает повествование, а союз «но» естественно передаёт контекстуальное противопоставление: Моисей возражает против намерения народа.'
- source_word: לָמָה זֶּה
  choice: Зачем
  rationale: Сочетание имеет усилительный оттенок, но буквальное воспроизведение было бы неестественно по-русски; «зачем» ясно выражает вопрос о неразумном и предосудительном поступке.
- source_word: אַתֶּם עֹבְרִים אֶת פִּי יְהוָה
  choice: вы преступаете повеление Яхве
  rationale: Глагол עבר с выражением «уста Яхве» означает нарушение или преступление сказанного Богом, а не буквальный переход. «Повеление» естественно раскрывает еврейскую идиому.
- source_word: וְהִוא לֹא תִצְלָח
  choice: Это не увенчается успехом
  rationale: Местоимение женского рода указывает на подразумеваемое предприятие или попытку. Русское «это» сохраняет некоторую неопределённость референта, а צלח передаёт успех задуманного дела.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Референт וְהִוא
  choice: Это — задуманное народом предприятие
  alternative: Вы не добьётесь успеха
  rationale: Безличное «это» сохраняет грамматически подразумеваемую отсылку к попытке выступить в поход и не добавляет в текст явно не названного субъекта.
translation_notes:
  register: Современный литературный русский язык; речь Моисея звучит прямо и предостерегающе. Еврейская идиома «уста Яхве» раскрыта как «повеление Яхве», а неопределённость местоименной отсылки в заключительной фразе сохранена.
