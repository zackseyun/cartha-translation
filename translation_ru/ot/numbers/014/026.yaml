  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ru
  text: 'И Яхве[a] сказал Моисею и Аарону:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (тетраграмматон); традиционно передаётся как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Глагол דבר в повествовательной формуле вводит новое обращение. По-русски «сказал» естественно связывает вводную формулу с прямой речью следующего стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Русский дательный падеж естественно обозначает адресатов речи; повтор еврейского предлога перед вторым именем не требует буквального воспроизведения.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Стандартный еврейский показатель последующей прямой речи естественно передаётся в современном русском пунктуацией, поскольку сама речь начинается в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет это имя и не подменяет его титулом; традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формульное לֵאמֹר передано двоеточием, что естественно вводит продолжающуюся в следующем стихе прямую речь.
