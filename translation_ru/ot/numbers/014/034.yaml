  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: ru
  text: По числу дней, в течение которых вы разведывали землю, — сорок дней, день за год, день за год, — сорок лет будете нести свои беззакония и познаете Моё противление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё отчуждение», «Мою неприязнь» или «Моё неблаговоление». Это редкое еврейское слово может обозначать противодействие или отчуждение Господа по отношению к мятежному поколению. Традиционный перевод: «нарушение Моего обещания»; такое понимание менее вероятно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: По числу дней
  rationale: 'Предлог ב при מִסְפָּר выражает соответствие: срок наказания соразмерен числу дней разведки.'
- source_word: תַּרְתֶּם
  choice: вы разведывали
  rationale: В данном контексте תור обозначает разведывательное обследование Ханаана; этот перевод точнее нейтрального «осматривали» и естественнее для современного русского, чем «высматривали».
- source_word: הָאָרֶץ
  choice: землю
  rationale: Определённое существительное указывает на уже известную из контекста землю; добавлять в основной текст «обетованную» не требуется.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: день за год, день за год
  rationale: Сохранён emphатический повтор исходного текста и выраженное им соответствие между сорока днями и сорока годами.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: вы будете нести на себе свои беззакония
  rationale: Сохранён образный смысл устойчивого сочетания נשא עון — нести вину и её последствия; формулировка не сводит выражение только к наказанию.
- source_word: וִידַעְתֶּם
  choice: и познаете
  rationale: «Познаете» сохраняет как смысл осознания, так и смысл пережитого на опыте знания.
- source_word: תְּנוּאָתִי
  choice: Моё противление
  rationale: Редкое существительное указывает на противодействие, отчуждение или неблаговоление Бога к мятежному поколению. «Противление» сохраняет суровость судебного контекста и не подразумевает неверности Бога обещанию.
theological_decisions:
- issue: Смысл редкого слова תְּנוּאָתִי в контексте Божьего суда
  choice: Моё противление
  alternative: Моё отчуждение; Моя неприязнь; Моё неблаговоление; нарушение Моего обещания
  rationale: Еврейское слово допускает оттенки противодействия и отчуждения. Перевод не должен внушать, будто Бог нарушил обещание; вместе с тем неоднозначность редкого слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Параллелизм и emphатический повтор «день за год, день за год» сохранены; синтаксис слегка упорядочен тире для ясного чтения.
