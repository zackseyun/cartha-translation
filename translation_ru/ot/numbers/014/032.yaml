  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: ru
  text: А ваши трупы падут в этой пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: А ваши трупы
  rationale: פֶּגֶר обозначает мёртвое тело, труп. «Трупы» прямо и кратко передаёт суровый, конкретный образ суда; союз וּ вместе с отдельным местоимением אַתֶּם выражен противопоставлением «А ваши…».
- source_word: אַתֶּם
  choice: А ваши
  rationale: Отдельное местоимение имеет контрастно-эмфатическую силу. По-русски она естественно передаётся вынесенным в начало сочетанием «А ваши трупы», без тяжеловесного «вы же сами».
- source_word: יִפְּלוּ
  choice: падут
  rationale: Глагол נפל буквально означает «падать»; здесь речь о смерти. «Падут» сохраняет образ и уместную торжественную строгость, а значение смерти уже ясно из слова «трупы».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר в данном повествовании означает пустынную, необжитую местность; «пустыня» — обычный и понятный русский библейский эквивалент.
- source_word: הַזֶּה
  choice: этой
  rationale: Указательное местоимение обозначает конкретную пустыню, где находится Израиль; «этой» точно передаёт указание без добавочной эмфазы.
theological_decisions:
- issue: Суровость и телесная конкретность образа פִגְרֵיכֶם
  choice: ваши трупы
  alternative: ваши мёртвые тела
  rationale: «Трупы» сохраняет прямую физическую конкретность и резкость приговора. Более мягкое «мёртвые тела» возможно, но несколько ослабляет лаконичную силу еврейского פֶּגֶר.
translation_notes:
  register: Современный литературный русский язык с достоинством и библейской серьёзностью. Форма «падут» слегка возвышенна, но общеупотребительна и точно сохраняет исходный образ. Синтаксис лаконичен, контраст передан начальным «А».
