  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: ru
  text: 'И сказал Яхве: «Я простил[a] по твоему слову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я помиловал».'
    reason: Глагол סלח допускает передачу как «простил» и как «помиловал»; второй вариант несколько сильнее подчёркивает отмену заслуженного наказания.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с последовательным waw продолжает повествование; «И сказал» естественно передаёт ход рассказа, не уточняя временную или причинную связь сверх сказанного в еврейском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: סָלַחְתִּי
  choice: Я простил
  rationale: Глагол סלח означает простить или помиловать; прошедшее совершенного вида естественно передаёт совершённое действие еврейского перфекта.
- source_word: כִּדְבָרֶךָ
  choice: по твоему слову
  rationale: Выражение буквально означает «согласно твоему слову»; выбранный вариант краток, естественен по-русски и сохраняет связь ответа Яхве с ходатайством Моисея.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объём объявленного прощения
  choice: Не уточнять, что именно и в какой мере прощено
  alternative: Добавить объект прощения или истолковать его как полную отмену всех последствий
  rationale: Еврейский текст не называет объекта и не устраняет напряжения с последующим наказанием народа; перевод сохраняет эту лаконичность и богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством и лаконичностью исходной реплики. Оборот «по твоему слову» слегка возвышен, но понятен и близок к форме еврейского текста.
