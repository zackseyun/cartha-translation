lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Ваййиктольная форма продолжает повествовательную последовательность; простой союз «и» не привносит дополнительного причинного или временного оттенка.
- source_word: אִישׁ אֶל אָחִיו
  choice: друг другу
  rationale: Буквально «каждый своему брату»; здесь это взаимное выражение, естественно передаваемое по-русски как «друг другу».
- source_word: נִתְּנָה
  choice: Поставим себе
  rationale: Когортатив первого лица множественного числа от נתן выражает совместное побуждение. В сочетании с «главой» глагол означает поставить кого-либо над собой; «себе» естественно раскрывает подразумеваемое отношение к общине.
- source_word: רֹאשׁ
  choice: вождя
  rationale: Буквально «главу»; в данном контексте речь о человеке, который возглавит группу. «Вождь» сохраняет образ властного предводителя и соответствует повествовательному регистру.
- source_word: וְנָשׁוּבָה
  choice: и вернёмся
  rationale: Когортатив согласован с предыдущим побуждением; русская форма будущего совершенного вида в таком призыве естественно передаёт значение «давайте вернёмся».
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс обозначает движение к Египту; идея возвращения уже выражена глаголом «вернёмся».
