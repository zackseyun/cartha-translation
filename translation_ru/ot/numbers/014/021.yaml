  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: ru
  text: Но, как Я жив, слава Яхве наполнит всю землю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю страну», если еврейское אֶרֶץ понимается здесь в более локальном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אוּלָם
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущему высказыванию естественным и современным русским союзом.
- source_word: חַי אָ֑נִי
  choice: жив Я
  rationale: Сохраняет краткую и торжественную форму божественной клятвы; инверсия и прописная буква у местоимения подчёркивают, что говорит Бог, не добавляя отсутствующих в оригинале слов.
- source_word: וְ/יִמָּלֵ֥א
  choice: наполнит
  rationale: Передаёт результативный смысл формы от מלא и сохраняет славу Яхве как смысловой субъект; по-русски эта конструкция звучит ясно и естественно.
- source_word: כְבוֹד
  choice: слава
  rationale: Обычный и контекстуально точный русский эквивалент כָּבוֹד применительно к Богу, охватывающий проявление его величия, присутствия и чести.
- source_word: יְהוָ֖ה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте, не заменяя его титулом.
- source_word: אֶת כָּל הָ/אָֽרֶץ
  choice: всю землю
  rationale: Сохраняет наиболее вероятный здесь всеобщий охват высказывания, а возможное локальное значение אֶרֶץ отмечено в сноске.
theological_decisions:
- issue: Масштаб значения הָאָרֶץ
  choice: «всю землю» — всеобщий масштаб
  alternative: «всю страну» или «всю эту землю» — локальный масштаб
  rationale: Существительное אֶרֶץ допускает оба значения. Торжественная клятва и утверждение о славе Яхве благоприятствуют всеобщему пониманию, однако локальная возможность сохранена в сноске, а не устранена.
- issue: Форма божественной клятвы חַי אָ֑נִי
  choice: «жив Я»
  alternative: «клянусь Моей жизнью» или «как верно то, что Я жив»
  rationale: Буквально близкая формула сохраняет напряжённую лаконичность исходного текста и его клятвенную силу, не вводя пояснительную формулировку в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Тире после «жив Я» помогает передать переход от клятвенной формулы к её содержанию. Личное имя передано как «Яхве» в соответствии с еврейским источником.
