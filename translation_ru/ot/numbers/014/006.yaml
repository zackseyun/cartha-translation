  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: ru
  text: И Иисус, сын Навина, и Халев, сын Иефоннии, из числа осматривавших землю[a], разорвали на себе одежды[b].
  philosophy: optimal-equivalence
  footnotes:
