lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: И Иисус, сын Навина
  rationale: Союз ו передаёт продолжение повествования. Формы «Иисус» и «Навин» соответствуют устойчивой русской библейской традиции и ясно обозначают сына Нуна.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: и Халев, сын Иефоннии
  rationale: Союз соединяет Халева с Иисусом как совместных деятелей; имена переданы в привычной русской библейской форме.
- source_word: מִן הַתָּרִים
  choice: из числа осматривавших
  rationale: 'Предлог מִן понят партитивно: Иисус и Халев принадлежали к большей группе разведчиков. Причастие передано естественным русским оборотом без добавления отсутствующего в тексте существительного.'
- source_word: אֶת הָאָרֶץ
  choice: землю
  rationale: Показатель прямого дополнения אֶת не переводится; הָאָרֶץ означает обсуждаемую землю, без внесения более конкретного названия.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: разорвали на себе одежды
  rationale: Глагол означает разрывать одежду. Выражение «на себе» естественно обозначает обрядовый жест скорби или потрясения, а «одежды» сохраняет достоинство библейского регистра.
