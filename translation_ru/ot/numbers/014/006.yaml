    text: 'Или: «из тех, кто осматривал землю». Еврейский предлог указывает здесь на принадлежность к более многочисленной группе разведчиков.'
    reason: lexical_alternative
  - marker: b
    text: Разрывать на себе одежды было принятым знаком скорби, ужаса или глубокого потрясения.
