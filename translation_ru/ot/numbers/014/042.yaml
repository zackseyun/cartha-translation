source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: ru
  text: Не поднимайтесь, потому что Яхве не среди вас, иначе вы будете поражены перед вашими врагами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Не поднимайтесь
  rationale: Запретительная частица אַל с глаголом עלה передана естественным русским запретом; «подниматься» сохраняет пространственно-военный образ движения вверх.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего запрета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: בְּקִרְבְּכֶם
  choice: среди вас
  rationale: Сохраняет буквальный пространственно-общинный смысл «в вашей среде» и звучит естественно по-русски.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: иначе ... разобьют вас
  rationale: В контексте предостережения сочетание выражает нежелательное последствие; форма נִגַּף обозначает поражение в бою, а русская активная конструкция естественно называет подразумеваемых деятелей из следующей фразы.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: враги ... вас
  rationale: Буквально «перед вашими врагами»; в военном контексте оборот означает потерпеть от них поражение и естественно включён в русскую конструкцию «враги разобьют вас».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Характер присутствия в בְּקִרְבְּכֶם
  choice: не среди вас
  alternative: не с вами; не посреди вас
  rationale: Формулировка сохраняет образ присутствия внутри общины, не уточняя сверх текста его богословский характер.
- issue: Значение תִּנָּגְפוּ
  choice: разобьют вас
  alternative: вы будете поражены; потерпите поражение
  rationale: В данном военном контексте глагол допускает как образ нанесённого удара, так и итоговое поражение; выбран живой современный военный оборот.
translation_notes:
  register: Современный литературный русский язык; краткое, настойчивое предостережение. Сохранён глагол движения «подниматься», связанный с рельефом и военным выступлением; архаические «дабы», «не восходите» и «пред врагами» исключены.
