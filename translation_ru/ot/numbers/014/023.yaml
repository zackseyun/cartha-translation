    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: не увидят они
  rationale: אִם в формуле клятвы выражает решительное отрицание, а не обычное условие. Инверсия в русском сохраняет торжественную и категорическую силу приговора.
- source_word: הָאָרֶץ
  choice: земли
  rationale: В данном контексте речь идёт об обещанной Израилю земле; определённость ясна из придаточного предложения.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לַאֲבֹתָם
  choice: которую Я поклялся отдать их отцам
  rationale: Глагол שבע означает принесение клятвы. Добавленное «отдать» естественно раскрывает подразумеваемое содержание клятвы и делает фразу понятной по-русски.
- source_word: לַאֲבֹתָם
  choice: их отцам
  rationale: Сохраняется конкретное мужское родственное обозначение исходного текста; вариант «предкам» отмечен в сноске.
- source_word: מְנַאֲצַי
  choice: презирающих Меня
  rationale: Причастие от נאץ обозначает сознательное презрение и пренебрежение Богом; «презирающих» передаёт прямоту и тяжесть выражения.
- source_word: לֹא יִרְאוּהָ
  choice: не увидит её
  rationale: Местоимение относится к земле. Повтор глагола «увидеть» сохранён как значимый элемент судебного провозглашения.
theological_decisions:
- issue: Смысл начальной формулы אִם יִרְאוּ
  choice: 'Передать как категорическое отрицание: «не увидят они»'
  alternative: 'Буквально: «если они увидят»'
  rationale: После формулы божественной клятвы אִם вводит эллиптическое самопроклятие и идиоматически означает решительное «не увидят». Буквальное условие исказило бы смысл суда.
- issue: Передача אָבוֹת
  choice: «их отцам» в основном тексте
  alternative: «их предкам»
  rationale: «Отцам» точнее сохраняет патриархальную лексику еврейского текста, тогда как более широкое «предкам» допустимо как смысловой вариант.
translation_notes:
  register: Современный литературный русский язык с торжественной инверсией, соответствующей божественному приговору. Заглавные местоимения при обращении Бога к Себе применены последовательно; синтаксис остаётся ясным для обычного читателя.
