  text: Они[a] не увидят земли, которую Я под клятвой обещал их отцам[b], и никто из презирающих Меня не увидит её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «если они увидят»; в формуле клятвы это означает решительное отрицание: «они ни за что не увидят».'
