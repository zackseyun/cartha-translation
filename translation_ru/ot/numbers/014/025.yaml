  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: ru
  text: Амаликитяне и хананеи живут в долине. Завтра поверните и отправляйтесь в пустыню по дороге к Красному морю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Тростниковое море»; традиционно — «Красное море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי
  choice: Амаликитяне
  rationale: Единственное число с артиклем обозначает народ как целое; по-русски естественно употребить множественное число. Начальный союз отдельно не передан, поскольку здесь он связывает высказывание с контекстом и не требует обязательного русского «и».
- source_word: וְהַכְּנַעֲנִי
  choice: и хананеи
  rationale: Форма единственного числа с артиклем имеет собирательное значение и естественно передаётся названием народа во множественном числе.
- source_word: יוֹשֵׁב
  choice: живут
  rationale: Причастие выражает продолжающееся пребывание; «живут» звучит современно и сохраняет этот смысл.
- source_word: בָּעֵמֶק
  choice: в долине
  rationale: עֵמֶק обозначает долину или низменность; нейтральное «долина» точно и понятно.
- source_word: מָחָר
  choice: Завтра
  rationale: Прямое и естественное соответствие указанию на следующий день.
- source_word: פְּנוּ
  choice: поверните
  rationale: Императив требует перемены направления; глагол сам по себе не уточняет «назад», поэтому это не добавлено.
- source_word: וּסְעוּ
  choice: и отправляйтесь
  rationale: В контексте передвижения נסע означает сняться с места и двинуться в путь; «отправляйтесь» естественно передаёт приказ.
- source_word: לָכֶם
  choice: не выражено отдельно
  rationale: Этический или усилительный датив обращён к самим адресатам. В русском отдельное «себе» здесь было бы неестественным, а направленность приказа уже выражена формой второго лица множественного числа.
- source_word: הַמִּדְבָּר
  choice: в пустыню
  rationale: מִדְבָּר — необитаемая пустынная местность, не обязательно песчаная; русское «пустыня» является обычным библейско-географическим соответствием и понятно современному читателю.
- source_word: דֶּרֶךְ יַם סוּף
  choice: по дороге к Красному морю
  rationale: דֶּרֶךְ указывает на путь или направление. Традиционное географическое название «Красное море» сохранено в тексте, а буквальное значение יַם סוּף приведено в сноске.
