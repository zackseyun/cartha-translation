  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: ru
  text: Но Иисус, сын Навина, и Халев, сын Иефоннии, остались в живых из числа тех людей, которые отправились осмотреть землю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разведывать землю»; или: «исследовать землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Но Иисус
  rationale: Союз ו передаёт контраст с гибелью остальных разведчиков в предыдущем контексте. Для имени выбран традиционный русский библейский экзоним «Иисус».
- source_word: בִּן נוּן
  choice: сын Навина
  rationale: Филиационная конструкция передана естественно по-русски; «Навин» — традиционная русская форма имени отца Иисуса.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: и Халев, сын Иефоннии
  rationale: Союз соединяет имена двух оставшихся в живых; использованы традиционные русские библейские формы имён.
- source_word: חָיוּ
  choice: остались в живых
  rationale: Передаёт значение «жили, сохранили жизнь» и контраст с теми, кто умер, не усиливая его до более интерпретирующего «уцелели».
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: из числа тех людей
  rationale: Предлог מִן обозначает выделение этих двоих из данной группы; формулировка естественна в современном литературном русском.
- source_word: הַהֹלְכִים
  choice: которые ходили
  rationale: Субстантивированное причастие описывает людей по их завершённому походу; русский глагол сохраняет связь с буквальным значением «идти».
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: осматривать землю
  rationale: תור здесь означает разведывательное обследование земли. «Осматривать» сохраняет нейтральность исходного слова и не сводит миссию исключительно к тайному шпионажу.
