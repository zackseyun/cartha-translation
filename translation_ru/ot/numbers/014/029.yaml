base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: ru
  text: В этой пустыне падут ваши мёртвые тела[a] — все вы, внесённые в переписные списки в полном составе, от двадцати лет и старше, роптавшие на Меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «падут ваши трупы». Еврейское выражение намеренно конкретно и подчёркивает телесную смерть в пустыне.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «возроптавшие против Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: В этой пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «пустыня» естественно для русского библейского повествования и сохраняет географический контекст.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: падут ваши мёртвые тела
  rationale: 'Сохраняется буквальный и суровый образ: נפל — «пасть», а פגר — «мёртвое тело, труп». Перевод не сглаживает выражение до простого «вы умрёте».'
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: все вы, вошедшие в число учтённых
  rationale: Фраза относится к людям, учтённым при переписи; русская формулировка передаёт и охват всех перечисленных, и связь с исчислением, не воспроизводя тяжеловесно два однокоренных оборота.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская передача стандартной возрастной формулы «от двадцатилетнего и выше».
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: роптавшие на Меня
  rationale: В повествовании о пустыне לון обозначает недовольный, мятежный ропот. «Роптать» точно передаёт оттенок и остаётся понятным в современном литературном русском.
theological_decisions:
- issue: Конкретность языка суда
  choice: «падут ваши мёртвые тела»
  alternative: «вы умрёте»
  rationale: Еврейский текст подчёркивает телесную смерть в пустыне как суд; конкретный образ сохранён, а не заменён обобщающим пересказом.
- issue: Круг тех, кого касается приговор
  choice: Связать приговор со всеми учтёнными от двадцати лет и старше, роптавшими на Бога
  alternative: Понять возрастную и переписную формулы как отдельные, не полностью совпадающие группы
  rationale: Синтаксическая цепочка естественно описывает одну охватываемую приговором группу, при этом перевод не добавляет дальнейших богословских уточнений из контекста.
translation_notes:
  register: Современный литературный русский с достоинством и сохранением суровой конкретности оригинала. «Мёртвые тела» менее натуралистично, чем «трупы», но не ослабляет образ; «роптавшие» сохраняет характерный для повествования оттенок упорного недовольства. Местоимение «Меня» написано с прописной буквы по принятой русской издательской норме для прямой речи Бога.
