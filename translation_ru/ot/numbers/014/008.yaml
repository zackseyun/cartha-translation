  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: ru
  text: Если Яхве благоволит к нам[a], то Он введёт нас в эту землю и отдаст её нам — землю, где текут молоко и мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расположен к нам», «доволен нами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт реальное условие, выраженное אִם, не превращая его в утверждение времени («когда»).
- source_word: חָפֵץ בָּנוּ
  choice: благоволит к нам
  rationale: Естественно по-русски передаёт благосклонность и расположение, заключённые в חפץ; альтернативный оттенок личного удовольствия сохранён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: то Он введёт нас в эту землю
  rationale: «Введёт» точно выражает не просто приближение к земле, а вступление в неё; «то» естественно обозначает следствие условия.
- source_word: וּנְתָנָהּ לָנוּ
  choice: и отдаст её нам
  rationale: Передаёт נתן и явно соотносит местоимение с землёй; «отдаст» здесь естественно выражает передачу во владение.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: землю, где текут молоко и мёд
  rationale: Сохраняет повтор слова «земля» и образный древнееврейский оборот, описывающий плодородие и изобилие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Условность благоволения Яхве
  choice: Если Яхве благоволит к нам
  alternative: Когда Яхве благоволит к нам
  rationale: Союз אִם формулирует условие. Перевод не устраняет содержащуюся в речи богословскую напряжённость и не превращает условие в заранее установленный факт.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской религиозной издательской практикой; синтаксис остаётся ясным для широкого читателя.
