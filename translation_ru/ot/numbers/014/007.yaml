  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: ru
  text: 'И они сказали всей общине сынов Израиля[a]: «Земля, по которой мы прошли, чтобы разведать её[b], — очень, очень хорошая земля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей общине израильтян».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исследовать её»; или: «осмотреть её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Стандартная повествовательная форма глагола אמר вводит прямую речь; инверсия сохраняет библейское достоинство слога, оставаясь понятной современному читателю.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всему обществу сынов Израиля
  rationale: עֵדָה обозначает собравшуюся общину или общество, а «сыны Израиля» прозрачно передаёт традиционное обозначение всего народа, не ограничивая его только мужчинами.
- source_word: לֵאמֹר
  choice: не передано отдельным словом
  rationale: Еврейский инфинитив, вводящий содержание речи, в естественном русском избыточен перед прямой цитатой.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Речь идёт о земле Ханаана; «земля» — обычное и контекстуально точное соответствие.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: по которой мы прошли
  rationale: Предлог ב при עבר указывает на движение по территории или через неё; выбранная формулировка естественна по-русски и сохраняет пространственный смысл.
- source_word: לָתוּר אֹתָהּ
  choice: чтобы разведать её
  rationale: В повествовании Чисел תור означает обследование земли с целью получить сведения; «разведать» передаёт этот оттенок без излишне узкого акцента на шпионаже.
- source_word: טוֹבָה
  choice: хорошая
  rationale: Сохранено основное значение прилагательного; усиление выражено следующим повтором наречия.
- source_word: מְאֹד מְאֹד
  choice: очень, очень
  rationale: Повтор в оригинале имеет сильное эмфатическое значение; его сохранение передаёт риторическую выразительность речи.
