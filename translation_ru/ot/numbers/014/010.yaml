  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: ru
  text: 'Но вся община сказала: «Побить их камнями!» И слава Яхве явилась в шатре собрания перед всеми израильтянами[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед всеми сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: עֵדָה обозначает собравшееся сообщество Израиля; «всё общество» естественно передаёт коллективный смысл и полноту выражения.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: «Побить их камнями!»
  rationale: Инфинитивная конструкция после «сказало» передаёт призыв общества. «Побить камнями» точно выражает רגם и не добавляет прямо не указанного «до смерти».
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: כָּבוֹד здесь означает видимое явление Божьего величия и присутствия; личное имя יְהוָה передано как «Яхве».
- source_word: נִרְאָה
  choice: явилась
  rationale: Нифаль глагола ראה в данном контексте обозначает видимое проявление; «явилась» естественно сочетается со словом «слава».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Буквально передаёт предлог בְּ и устойчивое название места встречи Бога с Израилем, не заменяя его более конфессионально окрашенным термином.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: всем сынам Израиля
  rationale: Сохранена форма традиционного национального обозначения «сыны Израиля»; более идиоматичный русский вариант дан в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Национальное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет грамматическую и заветную форму исходного выражения, а естественный собирательный эквивалент отмечен в сноске.
- issue: Место явления славы при בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  alternative: у шатра встречи
  rationale: Предлог בְּ прежде всего допускает значение «в»; вариант «у» возможен по контексту святилища, но текст не требует заменять прямое пространственное значение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прямая речь кратко сохраняет резкость призыва толпы; архаизмы и конфессионально специфические термины не используются.
