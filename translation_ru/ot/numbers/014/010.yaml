revisions:
- from: 'Но всё общество сказало: «Побить их камнями!» И слава Яхве явилась в шатре встречи всем сынам Израиля[a].'
  to: 'Но вся община сказала: «Побить их камнями!» И слава Яхве явилась в шатре собрания перед всеми израильтянами[a].'
  rationale: Исправлены термин для אֹהֶל מוֹעֵד и синтаксическая передача אֶל כָּל בְּנֵי יִשְׂרָאֵל. Перевод сохраняет неопределённость местоимения «их», не добавляет «до смерти» к побиению камнями и передаёт божественное имя транслитерацией.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: вся община намеревается побить Иисуса Навина и Халева камнями, после чего слава Яхве становится зримой в шатре собрания для всего Израиля. Однако «шатёр встречи» не является естественным русским названием אֹהֶל מוֹעֵד, а дательный оборот после «явилась в шатре» не вполне ясно передаёт אֶל («перед/для»).'
  naturalness: «Всё общество» возможно, но в данном библейском контексте «вся община» точнее и естественнее. «В шатре встречи всем сынам Израиля» тяжеловесно и синтаксически неясно. «В шатре собрания перед всеми израильтянами» — современно-литературное и ясное решение.
  terminology: «Яхве» корректно передаёт тетраграмматон. «Слава Яхве» и «побить их камнями» сохраняют исходный смысл без добавления цели «до смерти». «Шатёр собрания» — устоявшийся и семантически точный эквивалент אֹהֶל מוֹעֵד; «израильтяне» естественно передаёт устойчивое национальное обозначение בְּנֵי יִשְׂרָאֵל. Буквальную форму можно сохранить в сноске.
  issues:
  - severity: medium
    issue: «шатре встречи»
    rationale: Такое сочетание неустойчиво в современном русском и менее удачно передаёт техническое название אֹהֶל מוֹעֵד. «Шатёр собрания» является естественным, точным и не требует конфессиональной интерпретации.
  - severity: medium
    issue: «явилась в шатре встречи всем сынам Израиля»
    rationale: Дательный оборот после локатива может неясно связываться с местом явления. Предлог אֶל здесь естественно передать как «перед всеми израильтянами», сохраняя публичный характер явления.
  - severity: low
    issue: «всё общество» / «сынам Израиля»
    rationale: Оба выражения понятны, но «вся община» и «израильтяне» более естественны для современного литературного русского. Буквальное «сыны Израиля» уместно дать в сноске как альтернативу.
