  variant: modern literary Russian
source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: ru
  text: Яхве не скор на гнев и богат неизменной любовью[a]; Он прощает беззаконие и преступление[b], но виновного ни в коем случае не оставляет без наказания[c], взыскивая с детей за беззаконие отцов до третьего и до четвёртого поколения[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «велик в верности завету», «богат милостью» или «изобилует преданной любовью».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «прощает», буквально означает также «несёт» или «уносит» беззаконие и преступление.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «очищая, не очистит»; также возможно: «никого не оставляет без наказания» или «не оправдывает». Слово «виновного» подразумевается, но прямо в еврейском тексте не выражено.'
    reason: lexical_alternative
  - marker: d
    text: В еврейском тексте буквально сказано «до третьих и до четвёртых»; речь идёт о поколениях.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом «Господь».
- source_word: אֶרֶךְ אַפַּיִם
  choice: не скор на гнев
  rationale: Естественный русский эквивалент еврейской идиомы, буквально связанной с «долгими ноздрями» и обозначающей медленное возгорание гнева.
- source_word: רַב חֶסֶד
  choice: богат неизменной любовью
  rationale: Сочетание передаёт изобилие, устойчивость и верность отношений, заключённые в חֶסֶד, не сводя слово только к милосердию.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: прощает беззаконие и преступление
  rationale: נשא с обозначениями греха может означать несение или снятие вины и потому в данном исповедальном контексте естественно передаётся как «прощает»; различие между двумя терминами сохранено.
- source_word: עָוֺן
  choice: беззаконие
  rationale: Слово сохраняет нравственную тяжесть עָוֺן и допускает заложенные в нём оттенки порочности поступка и вины.
- source_word: פָשַׁע
  choice: преступление
  rationale: Передаёт нарушение установленной границы и оттенок мятежа, оставаясь ясным современному читателю.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: но виновного ни в коем случае не оставляет без наказания
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает отрицание. «Виновного» — подразумеваемое дополнение, необходимое для ясного русского судебного оборота.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: взыскивая с детей за беззаконие отцов
  rationale: פקד здесь выражает привлечение к ответу или наведение последствий; «взыскивая» сохраняет судебный смысл, не сводя формулу лишь к естественным последствиям.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: до третьего и до четвёртого поколения
  rationale: В еврейском тексте поколения подразумеваются эллиптически; повтор «до» отражает повтор предлога עַל.
theological_decisions:
- issue: Божественное прощение и суд над последующими поколениями
  choice: 'Сохранить напряжение текста: Яхве прощает, но виновного не оставляет без наказания и взыскивает с детей за беззаконие отцов.'
  alternative: Истолковать фразу только как естественные последствия поступков либо смягчить её в согласовании с текстами об индивидуальной ответственности.
  rationale: Еврейский текст непосредственно ставит милость и суд рядом; перевод не должен заранее разрешать это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского исповедального изречения. Идиомы переданы естественно, а повтор «до третьего и до четвёртого» сохранён. Заглавное «Он» после точки с запятой подчёркивает продолжение высказывания о Яхве, не добавляя нового содержания.
