    rationale: Еврейское וְאָמְרוּ אֶל означает «и скажут жителям/обитателям», а последующая придаточная цепь передаёт содержание речи. «Об этом» не имеет отдельного соответствия в исходном тексте и создаёт ненужную отсылку к предыдущему стиху.
  - severity: low
    issue: Архаизующая инверсия «в столпе облачном».
    rationale: Она допустима, но «в облачном столпе» более естественно для заявленного современного литературного варианта и столь же точно передаёт עַמּוּד עָנָן.
