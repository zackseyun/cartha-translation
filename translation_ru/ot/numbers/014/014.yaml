  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: ru
  text: И они расскажут жителям этой земли, которые уже слышали, что Ты, Яхве, пребываешь среди этого народа, что Тебя, Яхве, видят лицом к лицу[a], что Твоё облако стоит над ними и что Ты идёшь перед ними днём в облачном столпе, а ночью — в огненном столпе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаз в глаз Ты, Яхве, видим». Глагол может также передавать смысл «Ты являешься» или «предстаёшь».'
    reason: Сохраняет буквальный образ עַיִן בְּעַיִן и отмечает неоднозначность формы נִרְאָה, не навязывая конкретного толкования.
lexical_decisions:
- source_word: וְאָמְרוּ אֶל יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: И они расскажут об этом жителям этой земли
  rationale: Единственное причастие יוֹשֵׁב имеет собирательное значение; множественное «жителям» естественно по-русски. «Об этом» передаёт подразумеваемое содержание сообщения, связывая стих с предшествующим контекстом.
- source_word: שָׁמְעוּ
  choice: которые уже слышали
  rationale: Форма указывает на ранее полученное и сохраняющееся знание; «уже» ясно передаёт этот временной оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּקֶרֶב הָעָם הַזֶּה
  choice: пребываешь среди этого народа
  rationale: «Среди» естественно передаёт пространственное и соприсутствующее значение בְּקֶרֶב; «пребываешь» подчёркивает продолжающееся присутствие без добавления конфессионального толкования.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: Тебя ... видят лицом к лицу
  rationale: Неопределённо-личная конструкция сохраняет пассивную направленность נִרְאָה и звучит естественно по-русски. Идиома передана понятным выражением, а буквальный образ и возможное иное прочтение отмечены в сноске.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: Твоё облако стоит над ними
  rationale: Сохранён конкретный образ облака, стоящего над народом.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: идёшь перед ними
  rationale: Близко передаёт глагол движения и не заменяет его более толковательным «ведёшь».
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: в столпе облачном ... в столпе огненном
  rationale: Предлог «в» передаёт видимую форму Божьего присутствия; устойчивые библейские сочетания остаются понятными современному читателю.
- source_word: יוֹמָם ... לָיְלָה
  choice: днём ... ночью
  rationale: Естественные современные русские наречные соответствия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды стоит личное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение עַיִן בְּעַיִן נִרְאָה
  choice: Тебя, Яхве, видят лицом к лицу
  alternative: Ты, Яхве, являешься лицом к лицу; Тебя видят глаз в глаз
  rationale: Основной текст остаётся понятным и сохраняет мотив непосредственной видимости, тогда как сноска удерживает буквальную образность и лексическую неоднозначность формы נִרְאָה.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным звучанием. Синтаксическая цепь с повтором «что» сохраняет нарастание свидетельств в еврейском тексте; традиционные образы столпов оставлены без упрощения.
