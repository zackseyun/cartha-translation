revisions:
- from: И они расскажут об этом жителям этой земли, которые уже слышали, что Ты, Яхве, пребываешь среди этого народа, что Тебя, Яхве, видят лицом к лицу[a], что Твоё облако стоит над ними и что Ты идёшь перед ними днём в столпе облачном, а ночью — в столпе огненном.
  to: И они расскажут жителям этой земли, которые уже слышали, что Ты, Яхве, пребываешь среди этого народа, что Тебя, Яхве, видят лицом к лицу[a], что Твоё облако стоит над ними и что Ты идёшь перед ними днём в облачном столпе, а ночью — в огненном столпе.
  rationale: Убрано не выраженное в оригинале «об этом». Порядок слов в обозначениях столпов приведён к более естественному современному русскому употреблению. Сноска уточнена для точного и ясного отражения буквального образа и возможного значения глагола.
