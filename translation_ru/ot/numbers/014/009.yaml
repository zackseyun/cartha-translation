id: NUM.14.9
reference: Numbers 14:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: ru
  text: Только не восставайте против Яхве и не бойтесь народа этой земли, ведь они — наш хлеб[a]. Их защита покинула их[b], а Яхве с нами. Не бойтесь их!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они — наш хлеб»; образ может означать, что они станут лёгкой добычей, словно пища.'
    reason: Пояснение сохранённой древнееврейской метафоры.
  - marker: b
    text: 'Буквально: «их тень отошла от них». Здесь «тень», вероятно, означает защиту или покровительство.'
    reason: Буквальная форма образного выражения и его вероятный смысл.
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: 'Частица вводит настойчивое ограничение: главное условие — не восставать против Яхве. «Только» кратко и естественно передаёт эту силу.'
- source_word: בַּיהוָה אַל־תִּמְרֹדוּ
  choice: не восставайте против Яхве
  rationale: При глаголе מרד предлог ב указывает на того, против кого направлен мятеж. «Восставать против» естественно передаёт открытое неповиновение власти.
- source_word: עַם הָאָרֶץ
  choice: народ этой земли
  rationale: Сохраняется конкретная связь с землёй, о которой идёт речь; указательное «этой» делает выражение естественным по-русски без смыслового расширения.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: ведь они — наш хлеб
  rationale: Сохранена краткая и яркая древнееврейская метафора лёгкой добычи, без истолковывающего добавления в основном тексте.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: их защита покинула их
  rationale: Буквально צֵל означает «тень», но здесь образ обозначает покровительство или укрытие. Перевод передаёт функцию метафоры, а буквальный образ отмечен в сноске.
- source_word: וַיהוָה אִתָּנוּ
  choice: а Яхве с нами
  rationale: Русское «а» естественно выражает контраст между утратой ими защиты и присутствием Яхве с Израилем, не добавляя нового утверждения.
- source_word: אַל־תִּירָאֻם
  choice: Не бойтесь их!
  rationale: Заключительный повтор запрета сохранён как самостоятельный настойчивый призыв.
- source_word: יהוה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, что отличает тетраграмматон от нарицательного титула «Господь».
theological_decisions:
- issue: Образ завоевания в выражении כִּי לַחְמֵנוּ הֵם
  choice: Сохранить в основном тексте метафору «они — наш хлеб»
  alternative: «они будут нам пищей» или «мы поглотим их»
  rationale: Исходный текст не раскрывает метафору прямо. Её сохранение не предрешает, означает ли она лёгкую добычу, полное поражение или образ поглощения.
- issue: Значение צִלָּם в контексте
  choice: Передать смысл как «их защита»
  alternative: Буквальное «их тень» или образное «их покров»
  rationale: В данном контексте «тень» обозначает защиту или покровительство. Смысловая передача понятна современному читателю, а буквальная форма сохранена в сноске.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, явно присутствующее в древнееврейском тексте, и не смешивает его с титулом אֲדֹנָי.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Повтор «не бойтесь» сохранён ради риторического нажима оригинала; метафора хлеба оставлена в основном тексте, а идиома тени передана по смыслу и раскрыта в сноске.
