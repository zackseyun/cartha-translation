base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: ru
  text: Кроме постоянного всесожжения и сопровождающего его хлебного приношения совершайте их; они должны быть без изъяна, и их возлияния[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть винные приношения, сопровождающие жертвы.
    reason: lexical_clarification
lexical_decisions:
- source_word: מִלְּבַד
  choice: кроме
  rationale: Обозначает, что перечисленные ранее праздничные жертвы приносятся дополнительно к установленному постоянному всесожжению.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянное всесожжение
  rationale: Традиционно и точно передаёт предписанное регулярно совершаемое всесожжение; значение ежедневного совершения раскрыто в примечании.
- source_word: וּמִנְחָתוֹ
  choice: и хлебное приношение при нём
  rationale: В священническом контексте מִנְחָה означает приношение из зерновых продуктов, сопровождающее всесожжение. Оборот «при нём» естественно выражает принадлежность этого приношения постоянному всесожжению.
- source_word: תַּעֲשׂוּ
  choice: принесите
  rationale: В контексте жертвоприношений עשה означает совершить или принести жертву; русский глагол «принесите» ясно выражает требуемое действие.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В жертвенном законодательстве слово характеризует животных, не имеющих физического порока.
- source_word: יִהְיוּ לָכֶם
  choice: должны быть
  rationale: Передаёт обязательность требования. Еврейское לָכֶם, буквально «у вас/для вас», отражено оборотом «животные должны быть», а его буквальная форма отмечена в сноске.
- source_word: וְנִסְכֵּיהֶם
  choice: а вместе с ними — возлияния
  rationale: נֶסֶךְ — сопровождающее жертву винное возлияние; местоименный суффикс связывает возлияния с перечисленными жертвами.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением принятой лексики жертвенного законодательства. Эллиптический объект еврейского глагола раскрыт как «эти жертвы» по ближайшему контексту, а мужской род תְּמִימִם — как указание на жертвенных животных. Синтаксис сделан ясным без устранения связи возлияний со всеми ранее перечисленными жертвами.
