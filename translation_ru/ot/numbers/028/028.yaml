base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: ru
  text: 'И хлебное приношение при них: лучшая мука, смешанная с маслом, — по три десятых меры[a] на одного быка и по две десятых меры на одного барана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три десятых» и «две десятых»; в предписаниях о жертвоприношениях обычно имеются в виду десятые доли ефы.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: и хлебное приношение при них
  rationale: В контексте жертвоприношений מִנְחָה означает приношение из муки или зерна; местоименный суффикс соотносит его с перечисленными жертвенными животными. Оборот «при них» естественно передаёт эту связь по-русски.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: סֹלֶת обозначает муку высокого качества, предназначенную для жертвоприношений; «лучшая мука» понятно современному читателю и не навязывает спорной технической характеристики помола.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанная с маслом
  rationale: Страдательное причастие описывает муку, приготовленную путём смешивания с маслом; форма согласована с русским словом «мука».
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: по три десятых меры
  rationale: עִשָּׂרוֹן — десятая доля меры, в данном законодательном контексте обычно ефы. Слово «меры» сохраняет форму исходного текста, а конкретная единица поясняется в сноске.
- source_word: לַפָּר הָאֶחָד
  choice: на каждого быка
  rationale: Сочетание определённого существительного с אֶחָד в распределительном предписании естественно передаётся как «на каждого быка», то есть указанное количество полагается отдельно для каждого животного.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: по две десятых меры
  rationale: Передано параллельно предыдущему количеству как две десятые доли меры.
- source_word: לָאַיִל הָאֶחָד
  choice: на каждого барана
  rationale: אַיִל означает взрослого барана; распределительная формулировка «на каждого» ясно передаёт норму для каждого из перечисленных животных.
