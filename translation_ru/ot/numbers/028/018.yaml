  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/018.yaml
  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: ru
  text: В первый день пусть будет священное собрание[a]; никакой обычной работы не делайте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое собрание».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «никакой работы труда (или службы)»; то есть обычной трудовой деятельности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: В первый день
  rationale: Прямо передаёт обстоятельство времени с определённым порядковым числительным; слова «праздника» не добавлены, поскольку в самом стихе их нет.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает созванное для священной цели собрание. Этот вариант естественен по-русски и сохраняет обе смысловые стороны выражения.
- source_word: כָּל ... לֹא
  choice: никакой ... не
  rationale: Естественная русская отрицательная конструкция сохраняет всеохватный характер запрета.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: обычной работы
  rationale: Речь идёт не о полном запрете любых действий, а об обычном трудовом или служебном занятии; буквальная структура выражения пояснена в сноске.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Форма второго лица множественного числа в предписании естественно передаётся категорическим отрицательным повелением, обращённым ко всему народу.
theological_decisions:
- issue: Объём запрета на работу
  choice: никакой обычной работы не делайте
  alternative: никакой тяжёлой работы не делайте
  rationale: Еврейское выражение скорее указывает на обычный труд или служебное занятие, чем только на физически тяжёлую работу; перевод не расширяет запрет до любых действий и не сужает его до тяжёлого труда.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным звучанием законодательного предписания. Формулировка избегает архаизма «торжественное собрание» и неоднозначного выражения «тяжёлая работа».
