    issue: Не вполне удачная синтаксическая связь жертвы и животных
    rationale: 'Еврейское עֹלָה стоит как название приносимой жертвы перед перечнем животных. Вариант «приносите Яхве во всесожжение двух быков» может восприниматься как описание способа обращения именно с быками, а не как название всей жертвы. «Приносите Яхве жертву всесожжения: ...» воспроизводит структуру и смысл яснее.'
  - severity: low
    issue: Тяжеловесное сочетание «каждого вашего месяца»
    rationale: Оно формально понятно, но для современного литературного русского естественнее «каждого из ваших месяцев», без смысловой потери.
  - severity: low
    issue: Сноска излишне категорично описывает связь с новолунием
    rationale: Еврейская идиома означает начала месяцев и в культовом контексте относится к новомесячному времени. Лучше пояснить это как обычное значение, не создавая впечатления, будто в самом выражении прямо употреблено слово «новолуние».
