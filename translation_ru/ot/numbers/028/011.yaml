  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: ru
  text: 'В начале каждого из ваших месяцев[a] приносите Яхве жертву всесожжения: двух быков, одного барана и семь годовалых ягнят-самцов, всех без изъяна.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при началах ваших месяцев»; то есть во время новомесячного празднования.'
    reason: Пояснение еврейской идиомы и её обрядового значения.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: В начале каждого вашего месяца
  rationale: Еврейская идиома буквально говорит о «началах ваших месяцев» и обозначает наступление каждого месяца, связанное с новолунием. Русская формулировка передаёт смысл естественно, а буквальный образ и обрядовый контекст отмечены в сноске.
- source_word: תַּקְרִיבוּ
  choice: приносите
  rationale: В породе хифиль глагол קרב в жертвенном контексте означает представить или принести жертву; «приносите» естественно и точно передаёт культовое действие.
- source_word: עֹלָה
  choice: во всесожжение
  rationale: עֹלָה обозначает жертву, целиком сжигаемую на жертвеннике. «Всесожжение» — точный и узнаваемый русский термин для этой категории жертв.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а предлог ל — дательным управлением при глаголе «приносите».
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: двух быков
  rationale: Фраза называет двух быков из крупного рогатого скота. В русском слово «быки» уже выражает эту принадлежность, поэтому добавление «из стада» было бы избыточным.
- source_word: וְאַיִל אֶחָד
  choice: одного барана
  rationale: Прямое соответствие названию жертвенного животного и числительному.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: семь годовалых ягнят-самцов
  rationale: כְּבָשִׂים обозначает ягнят мужского пола, а идиома «сыны года» — животных примерно годовалого возраста или первого года жизни. Формулировка сохраняет обе характеристики.
- source_word: תְּמִימִם
  choice: все они должны быть без изъяна
  rationale: В требованиях к жертвам прилагательное означает отсутствие телесного дефекта. Развёрнутая русская конструкция ясно показывает, что требование относится ко всем перечисленным животным.
theological_decisions:
- issue: Передача времени ежемесячного жертвоприношения
  choice: В начале каждого вашего месяца
  alternative: В ваши новолуния
  rationale: Исходная идиома указывает на начало месяца и тем самым на новолуние, однако не употребляет отдельного существительного «новолуние». Основной текст сохраняет прямой временной смысл, а обрядовое значение поясняется в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога. Транслитерация сохраняет различие между этим именем и титулом «Господь».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для широкого читателя; специальный жертвенный термин «всесожжение» сохранён ради точности.
