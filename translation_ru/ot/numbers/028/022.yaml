  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: ru
  text: и одного козла в жертву за грех[a], чтобы совершить искупление за вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в очистительную жертву». Еврейское слово, переведённое как «жертва за грех», в жертвенном контексте может также пониматься как «очистительная жертва».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂעִיר
  choice: и одного козла
  rationale: שָׂעִיר обозначает козла, то есть самца; союз ו передан как «и». Числительное אֶחָד естественно включено в ту же именную группу.
- source_word: חַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает не просто грех, а приношение, связанное с устранением греха. Формулировка «жертва за грех» ясна современному читателю и сохраняет традиционный культовый смысл.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное прямо указывает количество жертвенных животных и потому сохранено.
- source_word: לְכַפֵּר
  choice: чтобы совершить искупление
  rationale: В священническом жертвенном контексте כפר выражает совершение обряда искупления. Такой перевод сохраняет богословскую весомость термина, не уточняя сверх текста механизм искупления.
- source_word: עֲלֵיכֶם
  choice: за вас
  rationale: Предлог עַל с местоименным суффиксом здесь выражает действие в пользу народа, от его имени; «за вас» естественно сочетается по-русски с «совершить искупление».
theological_decisions:
- issue: Передача жертвенного термина כפר
  choice: совершить за вас искупление
  alternative: искупить вас; совершить за вас очищение
  rationale: Основной вариант сохраняет широкий культово-богословский смысл еврейского выражения и не сводит его к одной теории искупления.
- issue: Передача חַטָּאת как названия жертвы
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: «Жертва за грех» — ясное и устойчивое обозначение данного вида приношения; при этом возможный очистительный оттенок термина отмечен в сноске, чтобы не устранять реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культовой формулы. Синтаксис следует краткости еврейского текста; терминологическая неоднозначность חַטָּאת сохранена посредством сноски.
