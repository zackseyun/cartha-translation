  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ru
  text: Одного ягнёнка приноси утром, а второго ягнёнка приноси между вечерами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами» — традиционное древнееврейское выражение, обозначающее время около сумерек или поздний послеполуденный час.'
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: ягнёнка
  rationale: Слово כֶּבֶשׂ обозначает ягнёнка, обычно молодого самца овцы в контексте жертвоприношений. Русское «ягнёнок» естественно передаёт значение, не добавляя отсутствующее здесь явное указание на пол.
- source_word: אֶחָד
  choice: одного
  rationale: Сохранено прямое значение количественного числительного «один», а не заменено порядковым «первый».
- source_word: תַּעֲשֶׂה
  choice: приноси
  rationale: Хотя עשה буквально значит «делать», в предписаниях о жертвах глагол обозначает совершение, приготовление или принесение жертвы. «Приноси» ясно и естественно передаёт культовый смысл.
- source_word: בַבֹּקֶר
  choice: утром
  rationale: Естественное современное русское соответствие предложному обороту со значением времени.
- source_word: הַשֵּׁנִי
  choice: второго
  rationale: Прямо передаёт порядковое числительное שֵׁנִי и последовательность двух жертв.
- source_word: בֵּין הָעַרְבָּיִם
  choice: между вечерами
  rationale: Буквальная форма устойчивого древнееврейского выражения сохранена в основном тексте, поскольку его точное временное значение обсуждается; пояснение вынесено в сноску.
