  text: שְׂעִ֥יר עִזִּ֖ים אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/030.yaml
  text: and one male goat to make atonement for you[a].
translation:
  language: ru
  text: и одного козла, чтобы совершить за вас искупление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст выражен кратко: «и одного козла, чтобы совершить за вас искупление». Из ближайшего контекста подразумевается, что козёл приносится в жертву за грех.'
    reason: Поясняет эллиптическую формулировку и контекстуально подразумеваемую жертвенную функцию, не добавляя её в основной текст.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание обозначает козла-самца; русское «козёл» уже выражает мужской пол, поэтому дополнительное «самца» не требуется.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное прямо указывает на одно животное и согласовано с формой «козла».
- source_word: לְכַפֵּר
  choice: чтобы совершить искупление
  rationale: В священническом жертвенном контексте глагол כפר обозначает совершение искупления; формулировка сохраняет культовый смысл, не навязывая определённой теории искупления.
- source_word: עֲלֵיכֶם
  choice: за вас
  rationale: При כפר предлог עַל указывает на тех, ради кого совершается искупление; «за вас» естественно передаёт значение представительства и пользы.
theological_decisions:
- issue: Следует ли вводить не выраженную в еврейском тексте категорию жертвы
  choice: Не добавлять в основной текст слова «в жертву за грех», а пояснить подразумеваемую функцию в сноске
  alternative: Включить «в жертву за грех» непосредственно в стих
  rationale: 'Еврейская фраза эллиптична: она называет одного козла и цель — совершить искупление. Ближайший контекст позволяет понять его как жертву за грех, однако сохранение эллипсиса в основном тексте точнее отражает формулировку источника и не скрывает разницу между сказанным и подразумеваемым.'
translation_notes:
  register: Современный литературный русский язык с dignified сакральным регистром. Начальный союз «и» сохранён, поскольку стих продолжает перечень предыдущих приношений; синтаксическая краткость оригинала также сохранена.
