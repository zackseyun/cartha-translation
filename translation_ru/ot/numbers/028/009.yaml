source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: ru
  text: А в субботний день — двух годовалых ягнят без изъяна, две десятых эфы[a] муки тонкого помола, смешанной с маслом, в качестве хлебного приношения и соответствующее возлияние[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «две десятых»; в законах о жертвоприношениях имеются в виду две десятых эфы.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «и его возлияние», то есть возлияние, сопровождающее эту жертву.'
    reason: textual_clarity
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: А в субботний день
  rationale: Сохраняет соединительный союз и временное указание; формулировка естественна для современного литературного русского языка.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: два годовалых ягнёнка-самца
  rationale: כְבָשִׂים обозначает молодых овец мужского пола, а идиома בְּנֵי שָׁנָה указывает на возраст в один год. Уточнение «самца» сохраняет значимую для жертвенного предписания характеристику.
- source_word: תְמִימִם
  choice: без изъяна
  rationale: В жертвенном контексте слово означает отсутствие телесного дефекта; выражение точно и понятно современному читателю.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: две десятых эфы
  rationale: В тексте буквально названы «две десятых»; в жертвенном законодательстве единицей подразумевается эфа. Единица вынесена в основной текст ради ясности, а буквальная форма отмечена в сноске.
- source_word: סֹלֶת
  choice: мука тонкого помола
  rationale: Передаёт особо тонко измельчённую муку для приношений, не добавляя отсутствующего в стихе указания на конкретный вид зерна.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В священническом жертвенном контексте это установленное приношение из муки или зерна, а не приношение вообще; традиционный русский термин остаётся понятным в данном окружении.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Естественно передаёт состояние муки, соединённой с маслом.
- source_word: וְנִסְכּוֹ
  choice: и соответствующее возлияние
  rationale: נֶסֶךְ — жидкое приношение, которое выливали при жертве. Формулировка передаёт его роль как установленного сопровождения субботней жертвы, не создавая в русском ложного и неясного местоименного отнесения.
theological_decisions:
- issue: К чему относится местоименный суффикс в וְנִסְכּוֹ
  choice: соответствующее возлияние
  alternative: его возлияние
  rationale: В еврейском стоит мужской суффикс единственного числа, тогда как ближайшее מִנְחָה — женского рода; вероятнее всего, имеется в виду возлияние, сопровождающее всю предписанную жертву. Русское «его» имело бы неясный или ошибочный антецедент, поэтому буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Синтаксическая конструкция с тире сохраняет перечислительный характер еврейского предписания без добавления отсутствующего глагола. Термины жертвенного культа переданы понятно, но без конфессионально окрашенных уточнений.
