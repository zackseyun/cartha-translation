id: NUM.28.26
reference: Numbers 28:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: ru
  text: И в день первых плодов, когда вы приносите Яхве новое хлебное приношение на вашем празднике Недель, пусть будет у вас священное собрание[a]. Никакой обычной работы[b] не делайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священный созыв». Еврейское выражение — специальное обозначение собрания, созванного для поклонения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «никакой тяжёлой работы» или «никакой повседневной трудовой работы». Речь идёт об обычном труде, связанном с повседневными занятиями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: И в день первых плодов
  rationale: Сохраняет временную связь с контекстом и культовое обозначение дня, связанного с первыми плодами урожая.
- source_word: בְּהַקְרִיבְכֶם
  choice: когда вы приносите
  rationale: Предложная инфинитивная конструкция обозначает одновременность; в жертвенном контексте קרב означает принесение Богу.
- source_word: מִנְחָה חֲדָשָׁה
  choice: новое хлебное приношение
  rationale: В священническом контексте מִנְחָה обозначает приношение из зерна или муки; «хлебное приношение» — понятный русский культовый термин, а «новое» указывает на новый урожай.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, не заменяя его титулом.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: на вашем празднике Недель
  rationale: Форма указывает не просто на последовательность недель, а на установленный праздник Недель; слово «праздник» делает это значение явным по-русски.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Естественно передаёт техническое выражение о созванном для богослужения святом собрании.
- source_word: יִהְיֶה לָכֶם
  choice: пусть будет у вас
  rationale: Передаёт конструкцию היה + ל и её предписывающую силу без неестественной буквальности.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: Выражение относится к повседневному трудовому занятию, запрещённому в праздничный день, а не непременно ко всякому действию вообще.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Прямой запрет во втором лице множественного числа естественно передан русским повелительным оборотом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер запрета на работу
  choice: никакой обычной работы
  alternative: никакой тяжёлой работы; никакой служебной работы
  rationale: Фраза מְלֶאכֶת עֲבֹדָה допускает оттенки обычного, профессионального или трудоёмкого труда; перевод не расширяет запрет до абсолютно всякой деятельности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, предписывающим звучанием. Культовые термины переданы понятно, но без устранения смысловых оттенков оригинала.
