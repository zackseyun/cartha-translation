  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: ru
  text: А в пятнадцатый день этого месяца — праздник[a]; семь дней следует есть пресный хлеб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничное торжество». Еврейское חָג может обозначать священный праздник, в том числе связанный с паломничеством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר י֛וֹם
  choice: А в пятнадцатый день
  rationale: Сочетание союза и предлога вводит временное указание; порядковое числительное естественно передаёт еврейское выражение «в день пятнадцать».
- source_word: לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה
  choice: этого месяца
  rationale: В данном календарном контексте חֹדֶשׁ означает «месяц».
- source_word: חָ֑ג
  choice: праздник
  rationale: חָג обозначает священное праздничное торжество, нередко связанное с паломничеством; «праздник» — естественный и достаточно широкий русский эквивалент.
- source_word: שִׁבְעַ֣ת יָמִ֔ים
  choice: семь дней
  rationale: Фраза указывает продолжительность предписанного употребления пресного хлеба.
- source_word: מַצּ֖וֹת
  choice: пресный хлеб
  rationale: Множественная форма מַצּוֹת здесь обозначает хлеб, приготовленный без закваски; собирательное русское выражение «пресный хлеб» понятно и традиционно.
- source_word: יֵאָכֵֽל
  choice: следует есть
  rationale: Нифаль imperfect имеет пассивную форму «будет/должен быть съеден», но русская безличная конструкция естественно передаёт предписание, не вводя конкретного субъекта.
