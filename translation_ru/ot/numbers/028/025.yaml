  text: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: ru
  text: В седьмой день пусть у вас будет священное собрание[a]. Никакой обычной работы[b] не делайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое собрание»; выражение также содержит оттенок официального созыва.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «никакой работы служения»; имеется в виду обычная трудовая или профессиональная работа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: В седьмой день
  rationale: Передаёт временное значение сочетания союза, предлога и существительного с порядковым числительным. Начальное וּ естественно не выражать отдельно по-русски, поскольку стих продолжает последовательность предписаний.
- source_word: מִקְרָא קֹדֶשׁ
  choice: священное собрание
  rationale: Устойчивое культовое выражение обозначает созванное для священной цели собрание. Такой перевод естественен в современном русском языке и сохраняет как идею собрания, так и его священный характер.
- source_word: יִהְיֶה לָכֶם
  choice: пусть у вас будет
  rationale: 'Буквально: «будет для вас». В законодательном контексте конструкция имеет предписывающую силу; «пусть у вас будет» передаёт её яснее, чем простое будущее время.'
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: никакой обычной работы
  rationale: При отрицании כָּל естественно передаётся словом «никакой». Сочетание מְלֶאכֶת עֲבֹדָה относится к обычной трудовой или профессиональной работе, запрещённой в священный день, а не безусловно ко всякому действию.
- source_word: לֹא תַעֲשׂוּ
  choice: не делайте
  rationale: Отрицательная форма глагола в правовом контексте выражает прямой запрет. Русский императив сохраняет ясность и нормативную силу.
