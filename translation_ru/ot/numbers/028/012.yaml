  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: ru
  text: и три десятых ефы[a] тонкой муки для хлебного приношения, смешанной с маслом, для одного быка, и две десятых ефы тонкой муки для хлебного приношения, смешанной с маслом[b], для одного барана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три десятых»; имеются в виду десятые доли ефы.'
    reason: cultural_note
  - marker: b
    text: 'Или: «перемешанной с маслом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: и три десятых ефы
  rationale: В жертвенном законодательстве עֶשְׂרוֹן обозначает десятую долю ефы. Явное указание единицы меры делает смысл понятным, а сноска отмечает буквальную форму еврейского текста.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Культовый термин обозначает высококачественную, тщательно приготовленную муку. «Лучшая мука» естественнее в современном русском и не навязывает технически спорную степень помола.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В данном жертвенном контексте слово обозначает приношение из муки, а не дар вообще. Традиционно понятное русское выражение «хлебное приношение» точно передаёт его функцию.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Причастный оборот описывает приготовление муки; «смешанной с маслом» — точная и естественная современная формулировка.
- source_word: לַפָּר הָאֶחָד
  choice: на каждого быка
  rationale: Сочетание определённого артикля с אֶחָד здесь имеет индивидуализирующую, распределительную силу. «На каждого быка» ясно выражает норму для одного животного и не превращает אֶחָד в порядковое «первого».
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: и две десятых ефы
  rationale: Как и в первой половине стиха, указана мера в десятых долях ефы; единица меры восполнена из контекста жертвенного законодательства.
- source_word: לָאַיִל הָאֶחָד
  choice: на каждого барана
  rationale: Параллельно предписанию о быках выражение передаёт количество приношения, приходящееся на одно животное, без необоснованного порядкового значения.
