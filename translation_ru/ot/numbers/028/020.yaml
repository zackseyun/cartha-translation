base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: ru
  text: А хлебное приношение, сопровождающее эти жертвы, — мука тонкого помола, смешанная с маслом. Приготовьте три десятых эфы[a] для быка и две десятых эфы для барана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа — древняя мера сыпучих тел; здесь речь идёт о десятых долях эфы, как принято в предписаниях о жертвоприношениях.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: А хлебное приношение при них
  rationale: В жертвенном контексте מִנְחָה обозначает хлебное, то есть мучное, приношение. Суффикс 3-го лица множественного числа соотносит его с перечисленными ранее жертвенными животными; оборот «при них» естественно передаёт эту связь по-русски.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово обозначает муку высокого качества, тонкого помола, предназначенную для приношений; «лучшая мука» звучит естественно и сохраняет качественную характеристику.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: смешанная с маслом
  rationale: Пассивное причастие с предлогом указывает на муку, приготовленную смешиванием с маслом.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: три десятых эфы
  rationale: עִשָּׂרוֹן — десятая часть эфы. В основном тексте мера названа явно, чтобы русскому читателю не приходилось восстанавливать подразумеваемую единицу.
- source_word: לַפָּר
  choice: для быка
  rationale: Определённая форма единственного числа указывает на быка, названного в предшествующем предписании.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: и две десятых эфы
  rationale: Сохраняется параллель с «три десятых эфы» и явно обозначается подразумеваемая мера.
- source_word: לָאַיִל
  choice: для барана
  rationale: Определённая форма единственного числа относится к барану из предшествующего перечня.
- source_word: תַּעֲשׂוּ
  choice: приготовьте
  rationale: В данном предписании עשה означает совершить требуемое приготовление приношения; «приготовьте» естественно и не добавляет более узкого значения «принесите».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. «Хлебное приношение» сохраняет узнаваемый культовый термин, а синтаксис упрощён для ясности. Маркер сноски поставлен после первого упоминания полной меры.
