  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: ru
  text: 'И скажи им: «Вот приношение, совершаемое огнем, которое вы должны приносить Яхве: по два годовалых ягненка-самца без порока в день — в качестве постоянного всесожжения».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: огненная жертва
  rationale: Передаёт специальный жертвенный термин как приношение, связанное с огнём. В русском выражение «пищевое приношение» могло бы создать неуместное впечатление, будто Богу буквально нужна пища.
- source_word: תַּקְרִיבוּ
  choice: вы должны приносить
  rationale: В породе hифиль глагол קרב в жертвенном контексте означает ритуально представлять или приносить жертву; выбранная формулировка естественна по-русски и сохраняет предписывающую силу.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя Бога, а не заменяет его титулом.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: годовалых ягнят-самцов
  rationale: Сохраняет указание как на возраст животных, так и на мужской пол, выраженные в еврейском тексте.
- source_word: תְמִימִם
  choice: без порока
  rationale: В жертвенном законодательстве обозначает животных без физического изъяна; это точная и традиционно понятная русская формулировка.
- source_word: לַיּוֹם
  choice: каждый день
  rationale: 'При числительном имеет распределительное значение: двух животных на каждый день.'
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: תָמִיד
  choice: постоянное
  rationale: Указывает на регулярно совершаемый, неизменно повторяющийся обряд, не обязательно на непрерывный процесс горения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл הָאִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Термин обозначает жертву, приносимую посредством огня. Перевод не утверждает, что жертва буквально служит пищей Богу, но альтернативный культовый оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с ясной синтаксической структурой и сохранением жертвенной терминологии. Тире после «каждый день» подчёркивает распределительное значение нормы, не превращая её в отдельное пояснение.
