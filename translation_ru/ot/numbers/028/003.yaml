  source_fidelity: 'Содержание передано в целом точно: הָאִשֶּׁה обозначено как жертвенное приношение, имя יהוה передано «Яхве», сохранены два самца ягнят годовалого возраста, отсутствие порока, ежедневная периодичность и характер постоянного всесожжения. Однако сочетание «каждый день — двух ...» синтаксически неудачно: после обстоятельства требуется естественная распределительная конструкция «по два ... в день».'
