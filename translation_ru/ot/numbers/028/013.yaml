  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: ru
  text: и по одной десятой эфы[a] муки тонкого помола, смешанной с маслом, в качестве хлебного приношения к каждому ягнёнку; это всесожжение — благоухание, приятное Яхве, огненная жертва Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа — мера объёма; её точная величина неизвестна, приблизительно 20–22 литра.
    reason: Пояснение древней меры для современного читателя.
  - marker: b
    text: 'Или: «жертвенная пища». Значение еврейского культового термина допускает разные толкования.'
    reason: Сохранение лексической неоднозначности אִשֶּׁה.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: и по одной десятой эфы
  rationale: Повтор существительного меры имеет распределительное значение; в данном жертвенном контексте подразумевается десятая часть эфы для каждого ягнёнка. «По одной» естественно передаёт распределительность.
- source_word: סֹלֶת
  choice: муки тонкого помола
  rationale: Устойчивое обозначение высококачественной муки для жертвоприношений; формулировка понятна современному русскому читателю.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте это приношение из муки или зерна, а не дар вообще. Традиционное русское выражение сохраняет категорию жертвы, не ограничивая её цельным зерном.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: смешанной с маслом
  rationale: Причастная конструкция описывает муку, соединённую с маслом; перевод прямой и современный.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: на каждого ягнёнка
  rationale: В последовательности предписаний выражение указывает количество приношения для каждого отдельного ягнёнка.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Технический термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Устойчивое жертвенное выражение говорит о благоприятном принятии жертвы Богом; перевод сохраняет образ запаха без грубого антропоморфизма.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Редкий культовый термин обозначает жертву, связанную с огнём жертвенника. Такой перевод прозрачен по контексту; возможное понимание как жертвенной пищи отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет различие между личным именем и титулом.
- issue: Значение культового термина אִשֶּׁה
  choice: огненная жертва
  alternative: жертвенная пища
  rationale: Связь с огнём наиболее ясна в данном контексте и не требует вводить спорную этимологию в основной текст. Пищевое понимание остаётся возможным и указано в сноске.
- issue: Связь выражений עֹלָה רֵיחַ נִיחֹחַ אִשֶּׁה לַיהוָה
  choice: Это всесожжение — благоухание, приятное Яхве, огненная жертва
  alternative: как всесожжение, приятное благоухание, пища-жертва Яхве
  rationale: Пунктуация делает плотную именную цепочку понятной по-русски, не устраняя её аппозиционный характер и не превращая образ благоухания в отдельное действие.
translation_notes:
  register: Современный литературный русский с достоинством культового предписания. Синтаксис упрощён ровно настолько, чтобы плотная еврейская именная последовательность оставалась понятной; технические термины «хлебное приношение» и «всесожжение» сохранены.
