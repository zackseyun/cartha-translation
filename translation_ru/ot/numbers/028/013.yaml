- from: и по одной десятой эфы[a] муки тонкого помола, смешанной с маслом, в хлебное приношение на каждого ягнёнка. Это всесожжение — благоухание, приятное Яхве, огненная жертва[b].
  to: и по одной десятой эфы[a] муки тонкого помола, смешанной с маслом, в качестве хлебного приношения к каждому ягнёнку; это всесожжение — благоухание, приятное Яхве, огненная жертва Яхве[b].
  rationale: Уточнены синтаксическая связь предписанной меры с каждым ягнёнком и принадлежность огненной жертвы Яхве. Терминология и обе сноски сохранены; правка не устраняет лексическую неоднозначность אִשֶּׁה.
