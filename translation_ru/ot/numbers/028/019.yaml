base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: ru
  text: 'И принесите огненную жертву[a] — всесожжение для Яхве: двух быков, одного барана и семь годовалых ягнят-самцов; пусть будут без изъяна.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву, сжигаемую на огне». Еврейское слово — специальный жертвенный термин для приношения, предаваемого огню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: и принесите
  rationale: Порода hифиль корня קרב в жертвенном контексте означает представить или принести жертву; повелительная форма естественно передаёт предписывающую силу еврейского перфекта с ו.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Это специальный жертвенный термин для приношения, предаваемого огню; перевод сохраняет связь с огнём, не утверждая спорную этимологию «пища».
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает посвящение жертвы, а тетраграмматон передан как личное заветное имя.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: двух быков
  rationale: Еврейское выражение обозначает двух животных крупного рогатого скота мужского пола; «быков» передаёт смысл естественно и без избыточной кальки.
- source_word: וְאַיִל אֶחָד
  choice: одного барана
  rationale: Прямой и общепринятый эквивалент в жертвенном перечне.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: и семь однолетних ягнят-самцов
  rationale: כְבָשִׂים обозначает ягнят мужского пола, а идиома בְּנֵי שָׁנָה — животных годовалого возраста.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: они должны быть у вас без изъяна
  rationale: В жертвенном контексте תמים означает отсутствие физического дефекта; לָכֶם сохранено как «у вас», а конструкция передана как обязательное требование.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Соотношение אִשֶּׁה и עֹלָה
  choice: «огненная жертва, всесожжение» — общий жертвенный термин с последующим уточнением
  alternative: считать двумя отдельными жертвами
  rationale: Приложение עֹלָה уточняет вид огненной жертвы; перевод не создаёт впечатления двух разных приношений.
translation_notes:
  register: Современный литературный русский с достоинством законодательного культового текста. Синтаксис сделан ясным для обычного читателя; сохранены технические жертвенные термины и местоименное выражение «у вас».
