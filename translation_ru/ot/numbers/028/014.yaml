  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: ru
  text: 'И возлияния к ним должны быть из вина: полгина на быка, треть гина на барана и четверть гина на ягнёнка. Это всесожжение месяца, совершаемое в свой месяц, во все месяцы года.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это всесожжение новолуния в его месяц, для месяцев года». Еврейское слово חֹדֶשׁ может означать как «месяц», так и «новолуние»; в основном тексте оно передано как «месяц».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: возлияния при них
  rationale: נֶסֶךְ обозначает жидкое приношение, которое выливали у жертвенника; «возлияние» — точный и принятый русский термин. Местоименный суффикс соотнесён с перечисленными жертвами.
- source_word: חֲצִי הַהִין
  choice: полгина
  rationale: Сохранена древняя мера объёма без приблизительного пересчёта; слитная дробная форма естественна по-русски.
- source_word: לַפָּר
  choice: на быка
  rationale: Предлог לְ указывает норму возлияния для данного жертвенного животного; в русском предписании естественно «на быка».
- source_word: וּשְׁלִישִׁת הַהִין
  choice: треть гина
  rationale: Прямо передаёт дробное количество древней меры.
- source_word: לָאַיִל
  choice: на барана
  rationale: Сохраняет единственное число и конкретную категорию жертвенного животного.
- source_word: וּרְבִיעִת הַהִין
  choice: четверть гина
  rationale: Естественный русский эквивалент еврейского дробного выражения.
- source_word: לַכֶּבֶשׂ
  choice: на ягнёнка
  rationale: Точно передаёт название жертвенного животного и норму для него.
- source_word: יָיִן
  choice: из вина
  rationale: Стоящее после перечня יָיִן определяет состав всех названных возлияний; в русском его естественно вынести перед перечнем, не меняя смысла.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Это ежемесячное всесожжение
  rationale: חֹדֶשׁ может означать «месяц» или «новолуние». Основной текст передаёт повторяемость обряда каждый месяц, а альтернативное культовое прочтение сохранено в сноске.
- source_word: בְּחָדְשׁוֹ
  choice: совершаемое каждый месяц
  rationale: Буквально «в свой месяц»; контекстуальный распределительный смысл передан ясным современным русским оборотом.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: во все месяцы года
  rationale: Передаёт регулярность предписания на протяжении годового цикла без излишней буквальности.
theological_decisions:
- issue: Значение חֹדֶשׁ в обозначении жертвы
  choice: В основном тексте — «ежемесячное всесожжение»
  alternative: «всесожжение в новолуние»
  rationale: Оба значения лексически возможны. Контекст предписания относится к началу месяца, однако продолжение стиха подчёркивает повторение по месяцам года; поэтому основной текст сохраняет временную регулярность, а культовая конкретизация дана в сноске.
translation_notes:
  register: Современный литературный русский с умеренно сакральной лексикой. Термины «возлияние», «гин» и «всесожжение» сохранены ради точности культового контекста; синтаксис упрощён для ясного чтения.
