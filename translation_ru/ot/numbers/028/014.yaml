- from: 'И возлияния при них должны быть из вина: полгина на быка, треть гина на барана и четверть гина на ягнёнка. Это ежемесячное всесожжение, совершаемое каждый месяц во все месяцы года.[a]'
  to: 'И возлияния к ним должны быть из вина: полгина на быка, треть гина на барана и четверть гина на ягнёнка. Это всесожжение месяца, совершаемое в свой месяц, во все месяцы года.[a]'
  rationale: Исправление делает заключительную формулу ближе к еврейскому тексту, сохраняя повторяемость жертвы и не устраняя выражение «в свой месяц». Сноска переработана так, чтобы лексическая альтернатива «новолуние» не сопровождалась дополнительным толкованием.
