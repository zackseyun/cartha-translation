  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: ru
  text: По одной десятой части эфы[a] приготовляй для каждого из семи ягнят[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «десятую часть, десятую часть». Подразумевается десятая часть эфы — принятая здесь мера хлебного приношения.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «для одного ягнёнка, для семи ягнят». Повтор «десятую часть, десятую часть» придаёт выражению распределительный смысл: по одной десятой части для каждого ягнёнка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: по одной десятой части эфы
  rationale: 'Повтор существительного имеет распределительное значение: по одной десятой части на каждое животное. «Эфы» добавлено для ясности как подразумеваемая стандартная мера хлебного приношения в данном контексте.'
- source_word: תַּעֲשֶׂה
  choice: приготовляй
  rationale: Буквально глагол означает «делать»; в предписании о хлебном приношении «приготовляй» естественно передаёт действие, не сужая его до самого принесения.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: для каждого ... ягнёнка
  rationale: Сочетание с распределительным повтором указывает на долю, назначенную каждому отдельному ягнёнку.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: из семи ягнят
  rationale: Формулировка ясно связывает распределение меры со всеми семью ягнятами и естественно звучит по-русски.
