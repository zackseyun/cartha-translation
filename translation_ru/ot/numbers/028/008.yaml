  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ru
  text: А второго ягнёнка приноси между вечерами[a]; приноси его с таким же хлебным приношением, как утром, и с таким же возлиянием — как огненную жертву, благоухание, приятное Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами»; традиционное выражение, которое часто понимают как «в сумерках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: второго ягнёнка
  rationale: В контексте жертвоприношений כֶּבֶשׂ обычно обозначает ягнёнка; «второго» сохраняет последовательность ежедневных жертв.
- source_word: תַּעֲשֶׂה
  choice: приноси
  rationale: Буквально глагол означает «делать», но при жертвенном животном естественное русское соответствие — «приносить».
- source_word: בֵּין הָעַרְבָּיִם
  choice: между вечерами
  rationale: Формальное соответствие сохраняет неоднозначность древнееврейского обозначения времени; более привычное толкование дано в сноске.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: с таким же хлебным приношением, как утром
  rationale: מִנְחָה в данном священническом контексте — сопровождающее хлебное приношение; сравнительная конструкция передана естественно по-русски.
- source_word: וּכְנִסְכּוֹ
  choice: и с таким же возлиянием
  rationale: נֶסֶךְ обозначает сопровождающее приношение жидкости, выливаемой перед Богом; «возлияние» — точный и устоявшийся русский термин.
- source_word: אִשֵּׁה
  choice: огненную жертву
  rationale: Слово обозначает жертву, предаваемую огню. Такой перевод сохраняет лексически значимый образ огня и не вводит спорное значение «пища» в основной текст.
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Сохраняется жертвенная метафора приятного запаха и формульный характер выражения без явного истолкования как божественного принятия.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано как «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует представленной проектной установке.
- issue: Временное выражение בֵּין הָעַרְבָּיִם
  choice: между вечерами
  alternative: в сумерках
  rationale: Точное временное значение выражения обсуждается; буквальная передача в основном тексте сохраняет неоднозначность, а привычное понимание указано в сноске.
- issue: Значение אִשֵּׁה
  choice: огненная жертва
  alternative: пища, приносимая в жертву; жертва, сжигаемая на огне
  rationale: Выбранный вариант не утверждает, что жертва буквально служит пищей Богу, и сохраняет явную связь слова с огнём.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Императив единственного числа передан последовательным «приноси». Формула רֵיחַ נִיחֹחַ сохранена образно и без конфессионального истолкования.
