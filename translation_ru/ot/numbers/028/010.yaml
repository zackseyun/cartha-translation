  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: ru
  text: Всесожжение субботы — в каждую субботу, сверх постоянного всесожжения и возлияния при нём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы עֹלָה, полностью сжигавшейся на жертвеннике.
- source_word: שַׁבַּת
  choice: суббота
  rationale: В календаре жертвоприношений слово обозначает именно субботний день.
- source_word: בְּשַׁבַּתּוֹ
  choice: в каждую субботу
  rationale: Буквально форма содержит местоименный суффикс («в свою/её субботу»), но в данном предписании имеет распределительное значение; современное русское выражение ясно передаёт регулярность.
- source_word: עַל
  choice: сверх
  rationale: В культовом контексте предлог указывает, что субботняя жертва добавляется к постоянной, а не заменяет её.
- source_word: הַתָּמִיד
  choice: постоянного
  rationale: Слово תָּמִיד выражает непрерывно соблюдаемый, регулярно предписанный характер ежедневного всесожжения.
- source_word: וְנִסְכָּהּ
  choice: и возлияния при нём
  rationale: נֶסֶךְ — сопровождающее жертву возлияние; женский суффикс отсылает к עֹלָה. Оборот «при нём» естественно согласуется в русском с существительным «всесожжение», не искажая референцию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением устоявшейся культовой терминологии. Эллиптическая структура еврейского предписания сохранена без добавления «это» или отдельного сказуемого; тире делает фразу понятной. Формулировка «в каждую субботу» естественно передаёт повторяемость.
