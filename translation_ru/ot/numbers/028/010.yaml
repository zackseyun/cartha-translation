  source_fidelity: 'Текст точно передаёт еврейскую конструкцию: «всесожжение субботы» (עֹלַת שַׁבַּת), его совершение «в каждую субботу» (בְּשַׁבַּתּוֹ) и добавочный характер по отношению к постоянному всесожжению и сопровождающему его возлиянию (עַל ... וְנִסְכָּהּ). Распределительное «в каждую субботу» уместно и не снимает повтор еврейского оригинала.'
