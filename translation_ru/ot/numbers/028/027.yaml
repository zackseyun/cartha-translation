base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: ru
  text: 'И принесите всесожжение для благоухания, приятного Яхве: двух быков из стада, одного барана и семь годовалых ягнят-самцов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для благоухания успокоения». Еврейская жертвенная формула לְרֵיחַ נִיחֹחַ также может передаваться как «для приятного» или «для успокоительного благоухания»; она выражает приемлемость жертвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: и принесите
  rationale: Каузативная форма глагола קרב в жертвенном контексте означает «представить, принести в жертву»; «принесите» естественно и точно передаёт ритуальное действие.
- source_word: עוֹלָה
  choice: всесожжение
  rationale: Устоявшееся русское обозначение жертвы, целиком сжигаемой на жертвеннике; оно яснее буквального этимологического варианта «возношение».
- source_word: לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Формула описывает благоухание, вызывающее благоволение и свидетельствующее о приемлемости жертвы; перевод сохраняет образ запаха, не сводя его лишь к физическому обонянию.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его непосредственное употребление в еврейском тексте.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: двух быков из крупного скота
  rationale: Сохраняет указание на вид скота, не добавляя не выраженного прямо возрастного значения «молодых».
- source_word: אַיִל אֶחָד
  choice: одного барана
  rationale: Прямое и естественное соответствие названию взрослого самца овцы.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: семь ягнят-самцов
  rationale: Мужской род еврейского существительного здесь обозначает именно ягнят мужского пола; это различие существенно в перечне жертвенных животных.
- source_word: בְּנֵי שָׁנָה
  choice: годовалых
  rationale: Краткое естественное обозначение требуемого возраста жертвенных ягнят.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя Бога; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Смысл формулы לְרֵיחַ נִיחֹחַ
  choice: благоухание, приятное Яхве
  alternative: успокоительное благоухание для Яхве
  rationale: Выбранная формулировка выражает божественное благоволение к жертве и сохраняет культовый образ, не утверждая, что речь только о буквальном обонянии.
translation_notes:
  register: Современный литературный русский с сохранением торжественного культового регистра. Императив «принесите» естественно передаёт предписывающую форму в контексте закона; перечень животных сформулирован ясно и без добавления неявных возрастных характеристик.
