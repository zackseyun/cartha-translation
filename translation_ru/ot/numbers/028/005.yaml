    rationale: Для современного читателя «мучное приношение» точнее обозначает приношение из муки и лучше соответствует סֹלֶת.
  revised_text: и одну десятую эфы[a] тонкой муки для мучного приношения, смешанной с четвертью гина[a] масла, полученного толчением.[b]
