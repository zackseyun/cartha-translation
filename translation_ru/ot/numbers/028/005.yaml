  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: ru
  text: и одну десятую эфы[a] тонкой муки для мучного приношения, смешанной с четвертью гина[a] масла, полученного толчением.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа и гин — древние израильские меры объёма.
    reason: cultural_note
  - marker: b
    text: 'Или: «масла, полученного прессованием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: и одну десятую эфы
  rationale: Союз связывает предписание с предыдущим стихом; дробная мера передана естественно по-русски, а древняя единица сохранена транслитерацией.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово обозначает высококачественную тонко смолотую муку для жертвоприношений; этот вариант естественнее буквального «тонкая мука» и не вводит дополнительного продукта.
- source_word: לְמִנְחָה
  choice: для хлебного приношения
  rationale: В священническом законодательстве מִנְחָה обозначает особый вид бескровного приношения из муки или зерна; традиционное русское сочетание ясно указывает на культовую категорию.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: смешанной с ... маслом
  rationale: Причастие согласовано с мукой и описывает её смешивание с маслом; творительно-предложная конструкция естественна в современном русском.
- source_word: כָּתִית
  choice: масло из толчёных оливок
  rationale: Прилагательное характеризует способ получения масла путём толчения или дробления оливок. Развёрнутая передача понятнее, чем неестественное «толчёное масло».
- source_word: רְבִיעִת הַהִין
  choice: с четвертью гина
  rationale: Дробь передана идиоматично, а древняя мера сохранена без приблизительного пересчёта.
