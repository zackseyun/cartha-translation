lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: В первый месяц
  rationale: Начальный союз וּ естественно не выражен отдельно по-русски; предложная конструкция сохраняет временное указание.
- source_word: בְּ/אַרְבָּעָה עָשָׂר י֖וֹם לַ/חֹדֶשׁ
  choice: в четырнадцатый день месяца
  rationale: Это точная и естественная передача стандартной древнееврейской формулы даты.
- source_word: פֶּסַח
  choice: Пасха
  rationale: Устоявшееся русское соответствие в календарном и культовом контексте; добавление слова «жертва» неоправданно сужало бы значение.
- source_word: לַ/יהוָה
  choice: Господу
  rationale: Дательный падеж кратко передаёт לְ как направленность или посвящённость и сохраняет неоднозначность отношения; имя יהוה по принятой русской библейской традиции передано как «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господу
  alternative: Яхве
  rationale: В современном литературном русском тексте избрана укоренённая библейская передача «Господь», без введения конфессионально маркированной транслитерации.
- issue: Смысл לַיהוָה
  choice: Господу
  alternative: Господня
  rationale: Дательный сохраняет возможные оттенки посвящения и принадлежности, не превращая неоднозначную предложную связь в однозначное притяжательное определение.
