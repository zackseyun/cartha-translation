  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: ru
  text: 'Повели сынам Израиля[a] и скажи им: «Моё приношение, Мою пищу для Моих огненных жертв[b], благоухание, приятное Мне[c], тщательно приносите Мне в установленное время».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает жертвы, сжигаемые на жертвеннике; возможный перевод: «жертвы, приносимые в огне».'
    reason: lexical_alternative
  - marker: c
    text: «Благоухание, приятное Мне» — устойчивое жертвенное выражение, указывающее на то, что Бог принимает приношение.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Повели
  rationale: Сильная форма повеления, обращённая к Моисею; «повели» точнее сохраняет властный характер глагола, чем более мягкое «наставь».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет формально мужское корпоративное обозначение народа в исходном тексте; для ясности добавлено примечание.
- source_word: קָרְבָּנִי
  choice: Моё приношение
  rationale: קָרְבָּן — общее обозначение дара, приносимого Богу; «приношение» ясно и уместно в культовом контексте.
- source_word: לַחְמִי
  choice: Мою пищу
  rationale: Хотя לֶחֶם буквально означает «хлеб», здесь слово шире обозначает пищу в жертвенном контексте. Конкретная метафора оригинала сохранена.
- source_word: לְאִשַּׁי
  choice: Мои огненные жертвы
  rationale: אִשֶּׁה обозначает жертву, сжигаемую на жертвеннике. «Огненные жертвы» сохраняет жертвенный и огненный компоненты без излишнего толкования.
- source_word: רֵיחַ נִיחֹחִי
  choice: благоухание, приятное Мне
  rationale: Передаёт устойчивое жертвенное выражение и сохраняет конкретный образ запаха, угодного Богу.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב
  choice: тщательно приносите
  rationale: שׁמר с инфинитивом выражает заботливое, точное соблюдение предписания; наречие «тщательно» естественно передаёт эту силу по-русски.
- source_word: בְּמוֹעֲדוֹ
  choice: в назначенное для него время
  rationale: Суффикс единственного числа соотносится с приношением как совокупным установлением; перевод сохраняет это число и значение установленного срока.
theological_decisions:
- issue: 'Антропоморфный язык жертвоприношения: «Моя пища» и «благоухание, приятное Мне»'
  choice: Сохранить конкретный жертвенный язык оригинала
  alternative: 'Передать отвлечённо: «жертвы, угодные Мне»'
  rationale: Еврейский текст намеренно использует конкретные культовые образы. Их сохранение не утверждает, что Бог буквально нуждается в пище, и не устраняет присущую тексту образность.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Основной текст сохраняет грамматически мужскую и традиционную родовую формулировку источника, а примечание поясняет её корпоративное значение.
- issue: Связь существительных קָרְבָּנִי לַחְמִי לְאִשַּׁי רֵיחַ נִיחֹחִי
  choice: Передать как ряд поясняющих наименований одного предписанного жертвенного приношения
  alternative: Жёстко подчинить все элементы одному синтаксическому толкованию, например «Мою пищу для Моих огненных жертв»
  rationale: Краткая нанизанная конструкция допускает оттенки приложения и принадлежности. Русская пунктуация сохраняет плотный ряд образов, не сводя его к одной спорной синтаксической схеме.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис сделан ясным посредством тире и ряда приложений, при этом сохранены конкретные культовые образы и повторение притяжательного местоимения первого лица. Формула «сыны Израиля» слегка возвышенна, но понятна и соответствует исходной форме.
