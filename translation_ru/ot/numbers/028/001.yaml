  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: יהוה (YHWH); также передаётся как «Иегова».'
    reason: Указывает форму божественного имени в оригинале и распространённый альтернативный вариант его передачи.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма וַיִּדַבֵּר вводит повествовательное сообщение о речи. По-русски «сказал» естественно сочетается с последующим прямым высказыванием и не требует буквального дублирования «говорил… говоря».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: אֶל
  choice: Моисею
  rationale: Направленность речи, выраженная אֶל, естественно передаётся русским дательным падежом.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени; в данном синтаксисе — «Моисею».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит содержание последующей прямой речи. В современном литературном русском эту функцию естественно и точно выполняет двоеточие, без тяжеловесного «сказал… говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» непосредственно передаёт его и сохраняет отличие имени от титула; вариант отмечен сноской.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского повествования. Формула речи передана естественно: вместо буквального «говорил… говоря» употреблены «сказал» и двоеточие.'
