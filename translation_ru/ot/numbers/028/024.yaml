source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: ru
  text: По этому образцу каждый день в течение семи дней приносите пищу[a] — огненную жертву, приятное Яхве благоухание. Приносите её сверх постоянного всесожжения и его возлияния[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пища огненной жертвы». Здесь «пища» означает жертвенное приношение, а не только хлеб.'
    reason: cultural_note
  - marker: b
    text: 'Или: «помимо постоянного всесожжения и его возлияния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: такие приношения
  rationale: Предлог כְּ выражает сопоставление с только что перечисленными жертвами. Добавление слова «приношения» ясно передаёт подразумеваемый объект и естественно звучит по-русски.
- source_word: תַּעֲשׂוּ
  choice: совершайте
  rationale: Глагол עשה буквально означает «делать, совершать»; в жертвенном контексте «совершайте» передаёт культовое действие без излишнего уточнения его вида.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: каждый день в течение семи дней
  rationale: 'Так передан распределительный смысл: предписанное действие повторяется в каждый из семи дней.'
- source_word: לֶחֶם אִשֵּׁה
  choice: пища — огненная жертва
  rationale: 'Сохранены оба элемента выражения: לֶחֶם здесь обозначает пищу или жертвенную долю, а אִשֶּׁה — жертву, предаваемую огню.'
- source_word: רֵיחַ נִיחֹחַ
  choice: благоухание, приятное
  rationale: Формула передаёт образ запаха жертвы, угодного Богу; перевод сохраняет метафору и не превращает её в отвлечённое утверждение о принятии жертвы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано распространённой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: עַל עֹלַת הַתָּמִיד
  choice: сверх постоянного всесожжения
  rationale: В данном предписании עַל указывает на добавление праздничной жертвы к регулярному всесожжению.
- source_word: וְנִסְכּוֹ
  choice: и возлияния при нём
  rationale: Суффикс единственного числа относится к постоянному всесожжению; оборот «при нём» естественно обозначает сопровождающее его возлияние.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Образ жертвы как пищи и благоухания
  choice: сохранить образные выражения «пища» и «благоухание, приятное Яхве»
  alternative: истолковать как «жертва, угодная Яхве»
  rationale: Исходный текст использует конкретный жертвенный образ. Его сохранение не утверждает, что Бог буквально нуждается в пище, и не устраняет богословское напряжение метафоры.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Термины «огненная жертва», «всесожжение» и «возлияние» сохранены ради точности культовой лексики; синтаксис упрощён для ясного чтения.
