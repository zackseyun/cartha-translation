  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: ru
  text: Помимо постоянного утреннего всесожжения приносите и эти жертвы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: Помимо
  rationale: Предлог ясно показывает, что перечисленные праздничные жертвы приносятся дополнительно к установленному утреннему всесожжению.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: постоянного утреннего всесожжения
  rationale: Относительная конструкция отождествляет утреннее всесожжение с постоянным приношением, а не говорит, что одна жертва предназначена для другой.
- source_word: תַּעֲשׂוּ
  choice: приносите
  rationale: В контексте предписаний о жертвоприношениях это естественный русский эквивалент глагола «делать».
- source_word: אֶת אֵלֶּה
  choice: и эти жертвы
  rationale: Указательное местоимение отсылает к жертвам, перечисленным выше; слово «жертвы» делает эту связь ясной по-русски, а частица «и» естественно передаёт добавочный характер предписания.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и сохраняет характер культового предписания. Термин «всесожжение» употреблён как устоявшееся библейское обозначение жертвы, сжигаемой целиком.
