base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: ru
  text: Это постоянное всесожжение[a], совершённое на горе Синай[b] в приятное благоухание, — огненная жертва[c] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «регулярное всесожжение». Здесь имеется в виду всесожжение, приносимое ежедневно по установленному порядку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установленное на горе Синай». Еврейское причастие буквально означает «сделанное, совершённое», но в данном контексте может указывать на то, что порядок этого приношения был установлен там.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «приношение Яхве»; традиционный перевод — «жертва, сжигаемая в огне». Точное происхождение и оттенок еврейского культового термина не вполне ясны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: постоянное всесожжение
  rationale: «Всесожжение» — общепонятный и устоявшийся русский эквивалент жертвы, сжигавшейся целиком; «постоянное» передаёт установленную регулярность ежедневного приношения.
- source_word: הָעֲשֻׂיָה
  choice: совершённое
  rationale: Пассивное причастие буквально означает «сделанное, совершённое». Такой перевод сохраняет форму источника и не превращает возможный смысл учреждения жертвы в единственно допустимый.
- source_word: בְּהַר סִינַי
  choice: у горы Синай
  rationale: Предлог בְּ допускает локативный смысл; по-русски «у горы Синай» естественно обозначает место событий у Синая и не утверждает, что жертва была принесена на вершине.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: в приятное благоухание
  rationale: Сохранён жертвенный образ благоухания, выражающего угодность и принятие, без устранения присущей оригиналу образности.
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Передаёт традиционно понимаемую связь термина с огнём и подходит к контексту всесожжения; возможное более общее понимание отмечено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное заветное имя יהוה передано транслитерацией «Яхве»; направление приношения выражено русским дательным падежом.
theological_decisions:
- issue: Значение הָעֲשֻׂיָה применительно к Синаю
  choice: совершённое у горы Синай
  alternative: установленное у горы Синай
  rationale: Буквальное значение причастия связано с совершением или приготовлением. Контекст может подразумевать установление постоянной жертвы у Синая, однако текст прямо этого не уточняет, поэтому толкование вынесено в сноску.
- issue: Жертвенная формула רֵיחַ נִיחֹחַ
  choice: в приятное благоухание
  alternative: в благоухание, угодное Богу
  rationale: Выбранный вариант сохраняет антропоморфный жертвенный образ и идею благоприятного принятия, не вводя дополнительного учения о механическом умилостивлении.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передача личного имени отличает его от титула «Господь» и непосредственно отражает форму исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства культовой речи. Синтаксис слегка приподнят, но понятен обычному читателю; традиционные термины «всесожжение» и «благоухание» сохранены как точные и узнаваемые.
