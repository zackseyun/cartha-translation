revisions:
- from: Возлияние при нём — четверть гина на каждого ягнёнка.[a] На святом месте[b] выливай для Яхве возлияние хмельного напитка.[c]
  to: На каждого ягнёнка приходится возлияние — четверть гина.[a] В святом месте[b] совершай возлияние хмельного напитка для Яхве.[c]
  rationale: Первое предложение перестроено, чтобы ясно передать положенную на каждого ягнёнка долю возлияния без неясного «при нём». «На» исправлено на «в» в соответствии с בַּקֹּדֶשׁ. «Совершай возлияние» сохраняет предписывающий характер הַסֵּךְ и повтор существительного נֶסֶךְ, оставаясь естественным в современном литературном русском.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:19:18Z'
review_pass:
  verdict: revise
  source_fidelity: Смысл меры, распределения по ягнёнку, места совершения обряда, возлияния и адресата передан верно. Однако «при нём» неясно обозначает референт суффикса в וְנִסְכּוֹ и звучит по-русски как пространственное «рядом с ним». Предлог בְּ в בַּקֹּדֶשׁ следует передать как «в», а не «на».
  naturalness: «На святом месте» в современном литературном русском неестественно для обозначения пребывания/совершения действия внутри священного пространства. «На каждого ягнёнка приходится возлияние» ясно и естественно выражает норму, а «в святом месте» сохраняет буквальную пространственную формулировку.
  terminology: «Возлияние» — точный и уместный культовый термин. «Хмельной напиток» допустимо передаёт שֵׁכָר без неоправданного уточнения вида напитка или указания на дистиллят. «Яхве» последовательно передаёт יהוה. Сноски сохраняют уместные альтернативы и пояснение культурного термина.
  issues:
  - severity: medium
    issue: Неясный оборот «Возлияние при нём».
    rationale: Русское «при нём» обычно означает местонахождение рядом с кем-либо/чем-либо и неясно отсылает к ягнёнку или к предшествующему контексту. Распределительную связь, которую выражают суффикс и לַכֶּבֶשׂ הָאֶחָד, лучше выразить непосредственно.
  - severity: medium
    issue: «На святом месте» вместо «в святом месте».
    rationale: בַּקֹּדֶשׁ — пространственное «в святом месте/святилище». В русском «на святом месте» меняет пространственный образ и менее естественно.
