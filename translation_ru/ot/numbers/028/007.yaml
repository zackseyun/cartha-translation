base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: ru
  text: На каждого ягнёнка приходится возлияние — четверть гина.[a] В святом месте[b] совершай возлияние хмельного напитка для Яхве.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на одного ягнёнка»; буквально: «на того одного ягнёнка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в святилище».'
    reason: lexical_alternative
  - marker: c
    text: «Хмельной напиток» — опьяняющий напиток, отличный от вина; его точный вид не указан.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Возлияние при нём
  rationale: Существительное обозначает сопровождающее жертву жидкое приношение; местоименный суффикс передан оборотом «при нём», связывающим возлияние с ягнёнком и не создающим неестественного выражения «его возлияние».
- source_word: רְבִיעִת הַהִין
  choice: четверть гина
  rationale: Сохранена точная древняя мера без приблизительного пересчёта в современные единицы.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: на каждого ягнёнка
  rationale: В данном предписании сочетание указывает норму для отдельного ягнёнка; распределительное значение естественно передано словом «каждого», а буквальная форма отмечена в сноске.
- source_word: בַּקֹּדֶשׁ
  choice: На святом месте
  rationale: В жертвенном контексте выражение, вероятнее всего, обозначает освящённое место; перевод сохраняет прозрачность исходной формулировки, не сужая её обязательно до здания святилища.
- source_word: הַסֵּךְ
  choice: выливай
  rationale: Повелительная форма передаёт предписание совершить возлияние; несовершенный вид естественен для повторяющегося ритуального действия.
- source_word: נֶסֶךְ
  choice: возлияние
  rationale: Традиционный и понятный в культовом контексте русский термин точно обозначает жидкое приношение и сохраняет повтор существительного в еврейском тексте.
- source_word: שֵׁכָר
  choice: хмельного напитка
  rationale: Слово обозначает опьяняющий напиток, отличный от вина, но не обязательно крепкий в современном смысле; «хмельной напиток» не предполагает дистилляции и не уточняет неизвестный вид напитка.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог передаёт адресата и предназначение приношения; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение בַּקֹּדֶשׁ
  choice: на святом месте
  alternative: в святилище
  rationale: Формулировка сохраняет возможную широту пространственного значения и не утверждает более узкое толкование как единственно возможное.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термин «возлияние» сохранён как точный и широко узнаваемый культовый термин; устаревшее «сикера» не использовано. Повеление передано прямо и естественно.
