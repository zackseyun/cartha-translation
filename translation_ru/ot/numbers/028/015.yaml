lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание обозначает самца козы; русское «козёл» ясно передаёт пол животного и естественно звучит в жертвенном предписании.
- source_word: אֶחָד
  choice: одного
  rationale: Числительное сохранено как существенная часть точного предписания о количестве жертв.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В жертвенном законодательстве термин обозначает жертву, связанную с устранением греха или нечистоты. Традиционное и понятное выражение вынесено в основной текст, а допустимая альтернатива отмечена в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте; дательный смысл посвящения выражен конструкцией «жертву ... Яхве».
- source_word: עַל
  choice: сверх
  rationale: В данном контексте предлог указывает на добавление этой жертвы к постоянному всесожжению, а не на пространственное положение.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянного всесожжения
  rationale: «Всесожжение» точно передаёт вид жертвы, а «постоянное» сохраняет идею регулярно совершаемого установленного приношения, не добавляя отсутствующего здесь слова «ежедневное».
- source_word: יֵעָשֶׂה
  choice: следует принести
  rationale: Буквально форма означает «будет сделан», но в русском языке применительно к жертве естественно и точно сказать «принести»; модальное «следует» передаёт предписывающую силу формы.
- source_word: וְנִסְכּוֹ
  choice: и возлияния при нём
  rationale: Суффикс относится к постоянному всесожжению. Формулировка «при нём» естественно показывает, что возлияние сопровождает именно это всесожжение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: очистительная жертва
  rationale: Термин допускает акцент как на грехе, так и на очищении от нечистоты. В основном тексте оставлена узнаваемая традиционная передача, а реальная смысловая альтернатива сохранена в сноске.
