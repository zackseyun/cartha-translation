review_pass:
  verdict: revise
  source_fidelity: Начальная привязка подразумеваемого подлежащего к Иисусу Навину оправдана контекстом и формой глагола 3-го лица единственного числа. «Повесил на дереве», «до вечера», «при заходе солнца», «труп», «большая груда камней» и формула «до сего дня» в целом точно передают еврейский текст. Однако אֶל в описании бросания выражает направленность к входу в ворота, а не просто местонахождение у него; это следует передать в русском тексте.
  naturalness: 'Текст в целом литературный и ясный. Сочетание «насыпали над ним большую груду камней» менее естественно и несколько меняет характер действия: еврейский текст говорит, что над ним воздвигли/соорудили груду камней, не обязательно именно насыпали её. «Которая остаётся там» добавляет указательное «там», отсутствующее в оригинале; лучше прямо сказать, что груда сохраняется до сего дня.'
  terminology: «Иисус Навин» и «Гай» соответствуют традиционной русской библейской ономастике. «Труп» уместно передаёт נִבְלָה без смягчения. Сноска к «повесил» корректно сохраняет неопределённость относительно способа смерти; сноска к заходу солнца также корректна.
  issues:
  - severity: medium
    issue: «Его бросили у входа в городские ворота»
    rationale: Предлог אֶל («к, в направлении, к месту») после וַיַּשְׁלִיכוּ требует обозначить направление действия. «У входа» описывает лишь место, где тело оказалось; «к входу» точнее передаёт исходную конструкцию.
  - severity: low
    issue: «насыпали над ним большую груду камней, которая остаётся там»
    rationale: וַיָּקִימוּ означает «воздвигли/соорудили», а не обязательно «насыпали». Слово «там» не имеет соответствия в еврейском тексте и излишне конкретизирует формулу «до сего дня».
  revised_text: Царя Гая Иисус Навин повесил на дереве до вечера[a]. При заходе солнца[b] Иисус Навин приказал снять его труп с дерева. Его бросили к входу в городские ворота и воздвигли над ним большую груду камней, сохранившуюся до сего дня.
