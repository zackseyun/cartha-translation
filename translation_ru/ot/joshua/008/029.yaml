  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: ru
  text: Царя Гая Иисус Навин повесил на дереве до вечера[a]. При заходе солнца[b] Иисус Навин приказал снять его труп с дерева. Его бросили к входу в городские ворота и воздвигли над ним большую груду камней, сохранившуюся до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвесил». Еврейский глагол означает «вешать, подвешивать» и не уточняет, был ли царь умерщвлён таким способом или его тело было выставлено после смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда зашло солнце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: повесил
  rationale: Глагол означает «вешать, подвешивать» и сам по себе не уточняет способ смерти; «повесил» сохраняет эту неопределённость.
- source_word: הָעֵץ
  choice: на дереве
  rationale: עֵץ обычно означает «дерево» или «древесина»; буквальное «дерево» не навязывает более конкретного представления о конструкции.
- source_word: עַד עֵת הָעָרֶב
  choice: до вечера
  rationale: Естественная современная передача временного выражения без потери смысла.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: при заходе солнца
  rationale: Еврейская идиома обозначает заход солнца; выбранная формулировка естественна и сохраняет образ исходного текста.
- source_word: נִבְלָתוֹ
  choice: его труп
  rationale: נְבֵלָה обозначает мёртвое тело; «труп» передаёт прямоту и резкость слова точнее, чем нейтральное «тело».
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: у входа в городские ворота
  rationale: Фраза указывает на место у входа или проёма городских ворот; такой перевод точен и естественен по-русски.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: большую груду камней
  rationale: גַּל — груда или насыпь; «груда камней» понятно широкому кругу читателей.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и уместное для возвышенного повествовательного регистра соответствие еврейской формуле.
theological_decisions:
- issue: Подразумеваемое подлежащее начального предложения
  choice: Иисус Навин повесил царя Гая
  alternative: Царя Гая повесили
  rationale: В еврейском тексте стоит глагол 3-го лица единственного числа мужского рода без явно названного подлежащего; контекст естественно указывает на Иисуса Навина. Перестройка порядка слов устраняет в русском двусмысленность имени «Иисус».
- issue: Означает ли תָּלָה казнь через повешение или выставление тела
  choice: Сохранено общее «повесил» без уточнения момента смерти
  alternative: казнил через повешение; посадил на кол; подвесил тело
  rationale: Сам глагол означает подвешивание и не определяет ни устройство, ни то, был ли царь уже мёртв; конкретизация разрешила бы сохранённую исходным текстом неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Имя «Иисус Навин» повторено для ясности. Цепочка еврейских предложений разделена на русские фразы ради естественной читаемости; повествовательная последовательность сохранена.
