  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: ru
  text: Иисус Навин и всё войско поднялись, чтобы идти на Гай[a]. Иисус Навин отобрал тридцать тысяч человек — доблестных воинов — и отправил их ночью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь народ войны»; возможно также: «все способные сражаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялись
  rationale: Форма от קום обозначает начало действия в повествовательной последовательности. Множественное число естественно согласуется с составным подлежащим «Иисус Навин и всё войско».
- source_word: כָל עַם הַמִּלְחָמָה
  choice: всё войско
  rationale: Буквально выражение означает «весь народ войны». «Всё войско» естественно передаёт собирательное военное значение, не ограничивая его только отдельными бойцами.
- source_word: לַעֲלוֹת הָעָי
  choice: чтобы идти на Гай
  rationale: В военном контексте עלה выражает направленное движение к городу с враждебной целью. Русское «идти на Гай» сохраняет движение и ясно передаёт военный смысл, не превращая его непосредственно в глагол «атаковать».
- source_word: הָעָי
  choice: Гай
  rationale: Традиционная и узнаваемая русская форма названия города Ай.
- source_word: וַיִּבְחַר
  choice: отобрал
  rationale: בחר значит «выбрать, отобрать»; в контексте формирования военного отряда «отобрал» звучит естественно и точно.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: тридцать тысяч человек
  rationale: Прямо передаёт числительное и существительное אִישׁ, не заменяя его более толковательным «воинов».
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: доблестных воинов
  rationale: Устойчивое военное выражение обозначает сильных, способных и храбрых бойцов. «Доблестные воины» передаёт оба компонента ясно и без архаической тяжеловесности.
- source_word: וַיִּשְׁלָחֵם
  choice: отправил их
  rationale: Точно передаёт שלח с местоименным суффиксом; военный контекст не требует добавочного уточнения.
- source_word: לָיְלָה
  choice: ночью
  rationale: Наречное употребление указывает на время отправки; «ночью» кратко и естественно по-русски.
