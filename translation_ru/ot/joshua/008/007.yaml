source:
  edition: WLC
  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: ru
  text: 'А вы поднимитесь из засады и овладейте городом[a]: Яхве, ваш Бог, отдаст его в ваши руки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «захватите город». Еврейский глагол может обозначать как военное овладение, так и вступление во владение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: поднимитесь
  rationale: Форма קום обозначает конкретное действие воинов, которые должны выйти из укрытия; повелительное значение несовершенного вида естественно передаётся русским повелительным наклонением.
- source_word: מֵהָאוֹרֵב
  choice: из засады
  rationale: Кратко и естественно передаёт место, где отряд скрытно ожидает момента нападения.
- source_word: וְהוֹרַשְׁתֶּם
  choice: овладейте
  rationale: Глагол ירשׁ в породе Hiphil здесь имеет оттенок вступления во владение городом в результате военного действия. «Овладейте» сохраняет как военный, так и посессивный смысл.
- source_word: וּנְתָנָהּ
  choice: отдаст его
  rationale: Перфект с союзом в последовательности указаний выражает гарантированный будущий результат; «отдаст» передаёт переход города под власть израильтян.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямая передача формы со вторым лицом множественного числа.
- source_word: בְּיֶדְכֶם
  choice: в ваши руки
  rationale: Еврейская идиома означает отдать во власть или распоряжение; русское выражение «отдать в руки» сохраняет образ и остаётся понятным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер обещания וּנְתָנָהּ
  choice: отдаст его
  alternative: отдал его; отдаёт его
  rationale: В контексте военного наставления форма указывает на обещанный и несомненный будущий результат, не утверждая, что передача уже завершилась.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. «Из засады» и «в ваши руки» сохраняют ясные образы оригинала; «овладейте» передаёт смысл без архаизации и без сужения только до момента штурма.
