translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Архаизмы устранены; неоднозначности слов מוֹעֵד и עֲרָבָה не разрешены без оговорки. Для плавности исходная цепочка глаголов разделена на два предложения, а местоимение הוּא раскрыто как «царь».
