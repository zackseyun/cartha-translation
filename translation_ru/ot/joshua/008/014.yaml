  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: ru
  text: Когда царь Гая увидел это, мужчины города — он и весь его народ — поспешили, поднялись рано и вышли навстречу Израилю на битву, к назначенному месту[a] перед Аравой[b]. Но он не знал, что за городом его подстерегала засада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к назначенному времени». Еврейское слово может обозначать как назначенное место, так и назначенное время.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Или: «перед равниной». Еврейское слово может обозначать Араву — определённую географическую область — либо, в более общем смысле, засушливую равнину или степь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Когда ... увидел это
  rationale: Начальное וַיְהִי служит повествовательной связкой и в естественном русском не требует отдельного «и случилось». Конструкция с כִּ и инфинитивом передана временным придаточным; подразумеваемое дополнение выражено словом «это».
- source_word: מֶלֶךְ הָעַי
  choice: царь Гая
  rationale: Передаёт конструкцию принадлежности; «Гай» — укоренившаяся русская форма топонима Ай.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ וַיֵּצְאוּ אַנְשֵׁי הָעִיר
  choice: жители города поспешили, встали рано и вышли
  rationale: Все три глагола имеют множественное число, а выраженный далее субъект — «люди/мужчины города». «Жители города» естественно по-русски и в данном военном контексте обозначает вышедших на бой горожан.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: навстречу Израилю, чтобы сразиться с ним
  rationale: Сохраняется буквальный образ движения навстречу, а цель движения, выраженная לַמִּלְחָמָה, передана ясной целевой конструкцией.
- source_word: הוּא וְכָל עַמּוֹ
  choice: царь и весь его народ
  rationale: Местоимение раскрыто существительным «царь» для ясности русского синтаксиса. עַם передано широким словом «народ», без сужения значения до «войска».
- source_word: לַמּוֹעֵד
  choice: к назначенному месту
  rationale: В контексте выхода и последующего географического ориентира вероятнее пространственное значение מוֹעֵד, однако возможное временное понимание отмечено в сноске.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: перед Аравой
  rationale: לִפְנֵי передано пространственным «перед», а הָעֲרָבָה сохранено как географическое название; более общее значение термина отмечено в сноске.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: позади города его ждёт засада
  rationale: Естественная русская формулировка сохраняет скрытую угрозу, направленную против царя, и расположение засады за городом.
