  to: Когда царь Гая увидел это, мужчины города — он и весь его народ — поспешили, поднялись рано и вышли навстречу Израилю на битву, к назначенному месту[a] перед Аравой[b]. Но он не знал, что за городом его подстерегала засада.
  rationale: 'Устранено добавленное действие «пришли»: царь и весь его народ представлены как участники выхода мужчин города. «Жители» заменено на «мужчины» ради лексической точности. Оборот о засаде уточнён так, чтобы передать её положение за городом и её выжидательный характер, не превращая её в будущее событие. Сноски и их якоря сохранены.'
