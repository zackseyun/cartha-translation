  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: ru
  text: И народ расположил весь стан, находившийся к северу от города, а его тыл[a] — к западу от города[b]. Иисус Навин той ночью пошёл в середину долины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его арьергард».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «от моря к городу»; слово «море» здесь служит обозначением запада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ הָעָם
  choice: народ расположил
  rationale: שׂים означает «помещать, ставить, располагать»; в военном контексте «расположил» естественно передаёт намеренное размещение сил. Сохраняется буквальное הָעָם «народ», а не более узкое «войско».
- source_word: כָּל הַמַּחֲנֶה
  choice: весь стан
  rationale: מַחֲנֶה обозначает стан или лагерь; «весь стан» кратко и естественно передаёт сочетание с כָּל.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: к северу от города
  rationale: Передаёт пространственное положение стана ясным современным русским выражением.
- source_word: עֲקֵבוֹ
  choice: его тыл
  rationale: Слово связано со значением «пята» и может обозначать заднюю часть; «тыл» сохраняет образ расположения, не уточняя без необходимости «арьергард».
- source_word: מִיָּם לָעִיר
  choice: к западу от города
  rationale: יָם буквально означает «море», но регулярно служит обозначением западного направления; в данном географическом контексте требуется «запад».
- source_word: וַיֵּלֶךְ יְהוֹשֻׁעַ
  choice: Иисус Навин вошёл
  rationale: הלך — обычный глагол движения. С учётом последующего בְּתוֹךְ форма «вошёл» естественно выражает направленное движение внутрь долины; имя передано в принятой русской библейской форме.
- source_word: בַּלַּיְלָה הַהוּא
  choice: той ночью
  rationale: Прямое и идиоматичное соответствие еврейскому выражению.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: в середину долины
  rationale: בְּתוֹךְ означает «внутри, посреди»; после глагола движения русская конструкция «вошёл в середину» ясно передаёт направление.
