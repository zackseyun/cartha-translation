  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: ru
  text: Сидевшие в засаде быстро поднялись со своего места и побежали, как только он простёр руку[a]. Они вошли в город, захватили его и поспешно подожгли город.
  philosophy: optimal-equivalence
  footnotes:
