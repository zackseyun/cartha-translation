    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: сидевшие в засаде
  rationale: Причастие обозначает собирательно воинов, находившихся в засаде. Русская форма во множественном числе естественно согласуется с последующими глаголами во множественном числе.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: быстро поднялись со своего места
  rationale: Передаёт стремительное начало действий из места укрытия; единственное число еврейского глагола связано с собирательным обозначением отряда, тогда как по-русски естественно множественное число.
- source_word: וַיָּר֨וּצוּ֙
  choice: и побежали
  rationale: Сохраняет прямое значение глагола רוץ и быстрый темп повествования без дополнительного истолкования.
- source_word: כִּנְטוֹת יָדוֹ
  choice: как только он простёр руку
  rationale: Конструкция с כ и инфинитивом обозначает момент сигнала и допускает оттенок непосредственного следования. Местоимение сохранено без добавления имени, отсутствующего в стихе.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: они вошли в город
  rationale: Естественная русская передача движения внутрь города.
- source_word: וַיִּלְכְּדוּהָ
  choice: захватили его
  rationale: Глагол לכד в военном повествовании означает взятие или захват города.
- source_word: וַיְמַהֲרוּ
  choice: поспешно
  rationale: Наречная передача естественна по-русски и сохраняет подчёркнутую быстроту следующего действия.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: подожгли город
  rationale: Глагол в породе хифиль выражает причинение возгорания; «подожгли» кратко и точно передаёт это значение, а отдельное «огнём» по-русски избыточно.
