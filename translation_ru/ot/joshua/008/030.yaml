base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: ru
  text: Тогда Иисус Навин построил на горе Гевал жертвенник для Яхве[a], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (Яхве) — личное имя Бога.
    reason: Поясняет передачу тетраграмматона в тексте оригинала.
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временное наречие обозначает следующий эпизод повествования; «тогда» естественно передаёт последовательность событий.
- source_word: יִבְנֶה
  choice: построил
  rationale: Хотя форма морфологически представляет собой имперфект, после אָז в повествовании она имеет значение завершённого прошедшего действия.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся в русской библейской традиции форма имени, позволяющая отличить этого персонажа от других носителей имени Иисус.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Точный и понятный русский термин для сооружения, предназначенного для жертвоприношений.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог ל обозначает посвящение или адресата: жертвенник построен Яхве. В русском глагол «построить» допускает беспредложное обозначение адресата; личное имя передаёт тетраграмматон непосредственно.'
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Конструктивная цепь отождествляет Яхве с Богом Израиля; дательный падеж сохраняет приложение к имени после «построил жертвенник».
- source_word: בְּהַר עֵיבָל
  choice: на горе Гевал
  rationale: Предлог בְּ здесь указывает место действия; «на горе» — естественная русская передача. «Гевал» — укоренившаяся русская библейская форма топонима.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога — тетраграмматон. «Яхве» непосредственно передаёт его и не заменяет титулом; примечание сообщает читателю исходную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Синтаксис простой и повествовательный; сохранено приложение «Богу Израиля».
