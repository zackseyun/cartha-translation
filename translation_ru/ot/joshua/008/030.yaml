  source_fidelity: 'Смысл в целом передан верно: אָז отражено как «Тогда», повествовательный имперфект יִבְנֶה — прошедшим «построил», а место и топоним — «на горе Гевал». Однако в исходном варианте связь жертвенника с Яхве выражена неудачно: «построил ... жертвенник Яхве, Богу Израиля» грамматически и семантически не передаёт ясно לַיהוָה («для/Яхве»), а дательный «Богу» не согласован с конструкцией.'
