revisions:
- from: Только скот и добычу[a] из того города израильтяне взяли себе — согласно слову Яхве, как Он повелел Иисусу Навину.
  to: Только скот и добычу, взятые в том городе, израильтяне забрали себе — согласно слову Яхве, повелению, данному Им Иисусу Навину.
  rationale: Добавлено согласованное определение «взятые в том городе», чтобы оно недвусмысленно относилось и к скоту, и к добыче. Заключительная часть перестроена как пояснительное приложение к «слову Яхве», отражая, что это слово было повелением, данным Иисусу Навину. Сноска сохранена; её якорь остаётся после слова «добычу».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:11:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начальное «Только» точно передаёт רַק; «скот» и «добыча» адекватно соответствуют הַבְּהֵמָה и שָׁלָל. Однако «из того города» в исходной фразе синтаксически в первую очередь относится к «добычу», тогда как в еврейском определение «того города» относится к обоим объектам. Оборот «как Он повелел Иисусу Навину» также передаёт относительное אֲשֶׁר менее точно: речь о слове/повелении, данном Иисусу Навину, а не о способе, которым израильтяне взяли добычу.'
  naturalness: «Согласно слову Яхве, как Он повелел Иисусу Навину» звучит по-русски несколько неясно из-за связи союза «как». Приложение «повелению, данному Им Иисусу Навину» естественно, ясно и сохраняет сдержанный библейский регистр.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Добыча» уместна для שָׁלָל; сноска с вариантом «военные трофеи» полезна. «Израильтяне» — приемлемое естественное обозначение коллективного Израиля.
  issues:
  - severity: medium
    issue: Неоднозначная область определения «из того города»
    rationale: В оригинале הָעִיר הַהִיא находится в генитивной связи и с «скотом», и с «добычей». Русское «скот и добычу из того города» может ограничивать лишь второе существительное.
  - severity: medium
    issue: Неясная передача относительной конструкции
    rationale: «Как Он повелел Иисусу Навину» может быть прочитано как обстоятельство образа действия при «взяли», тогда как אֲשֶׁר צִוָּה относится к «слову Яхве» и указывает на повеление, данное Иисусу Навину.
  revised_text: Только скот и добычу, взятые в том городе, израильтяне забрали себе — согласно слову Яхве, повелению, данному Им Иисусу Навину.
  revised_footnotes:
