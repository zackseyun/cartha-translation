base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: ru
  text: Только скот и добычу, взятые в том городе, израильтяне забрали себе — согласно слову Яхве, повелению, данному Им Иисусу Навину.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: 'Передаёт ограничение на фоне предшествующего рассказа об уничтожении города: исключением были скот и военная добыча.'
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В данном контексте речь идёт о домашних животных, взятых после сражения; «скот» — естественное русское собирательное обозначение.
- source_word: וּשְׁלַל
  choice: и добычу
  rationale: שָׁלָל обозначает имущество, захваченное на войне; «добыча» ясно и естественно передаёт военный контекст.
- source_word: הָעִיר הַהִיא
  choice: из того города
  rationale: Указательное местоимение придаёт городу определённость; предложное выражение естественно связывает добычу с её источником.
- source_word: בָּזְזוּ לָהֶם
  choice: взяли себе
  rationale: Глагол указывает на захват добычи, а לָהֶם — на присвоение в свою пользу. Поскольку существительное «добыча» уже выражает военный захват, такой перевод избегает тяжёлого повтора «добычу разграбили».
- source_word: יִשְׂרָאֵל
  choice: израильтяне
  rationale: Название народа употреблено как коллективный субъект; множественное «израильтяне» согласуется с формой еврейского глагола и естественно звучит по-русски.
- source_word: כִּדְבַר יְהוָה
  choice: согласно слову Яхве
  rationale: Сохраняет понятие «слова» и выражает соответствие ранее данному повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: как Он повелел Иисусу Навину
  rationale: Естественно по-русски передаёт относительную конструкцию, связывая исполненное слово с повелением, данным Иисусу Навину.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
- issue: Связь «слова» Яхве с повелением Иисусу Навину
  choice: согласно слову Яхве, как Он повелел Иисусу Навину
  alternative: согласно слову Яхве, которое Он заповедал Иисусу Навину
  rationale: Выбранный вариант сохраняет и «слово», и характер повеления, не вводя дополнительного богословского истолкования; местоимение «Он» однозначно относится к Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов сохраняет начальное ограничительное ударение «Только», но остаётся понятным для обычного читателя.
