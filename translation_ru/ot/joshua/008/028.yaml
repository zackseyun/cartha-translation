lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: сжёг
  rationale: Глагол שׂרף прямо обозначает уничтожение огнём; «сжёг» естественно передаёт завершённое действие в повествовании.
- source_word: הָעָי
  choice: Гай
  rationale: Использована устоявшаяся в русской библейской традиции форма названия города, понятная современному читателю.
- source_word: וַיְשִׂימֶהָ
  choice: превратил его
  rationale: Конструкция с שׂים выражает достигнутый результат; в русском языке «превратил его в» естественно связывается с последующим состоянием города.
- source_word: תֵּל
  choice: холм развалин
  rationale: תֵּל обозначает насыпь или холм, образованный остатками разрушенного поселения; «холм развалин» яснее простого «холм» передаёт это значение.
- source_word: עוֹלָם
  choice: вечный
  rationale: Слово עוֹלָם указывает на неопределённо долгое, непреходящее состояние и допускает традиционное «вечный»; возможное ограничение длительности отмечено в сноске.
- source_word: שְׁמָמָה
  choice: запустение
  rationale: Существительное обозначает опустошённое, необитаемое состояние; отдельная предложная группа сохраняет присоединительный характер еврейского текста.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивая и достойная русская библейская формула, указывающая, что описанное состояние сохранялось до времени повествователя.
