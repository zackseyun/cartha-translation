base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: ru
  text: А те вышли из города им навстречу, так что жители Гая оказались среди израильтян, стоявших с одной и с другой стороны; и израильтяне поражали их, пока у него не осталось ни уцелевшего, ни беглеца[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти — с этой стороны, а те — с той»; имеется в виду, что израильтяне зажали жителей Гая с двух сторон.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь неожиданно употреблены формы единственного числа — буквально: «пока он не оставил ему уцелевшего и беглеца». Кто именно подразумевается под «он» и «ему», прямо не сказано; общий смысл в том, что никто не уцелел и не смог бежать.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: А те
  rationale: Указательное местоимение отсылает к ранее упомянутому отряду из засады; «те» сохраняет эту отсылку естественнее, чем простое «они».
- source_word: יָצְאוּ מִן־הָעִיר
  choice: вышли из города
  rationale: Обычное значение יצא; формулировка естественно описывает выход из уже захваченного города к месту сражения.
- source_word: לִקְרָאתָם
  choice: им навстречу
  rationale: Сохраняет базовое значение выражения; в данном военном контексте враждебный характер встречи понятен из дальнейшего повествования.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: жители Гая оказались посреди израильтян
  rationale: Явное обозначение жителей Гая устраняет неясность цепочки русских местоимений, а «оказались посреди» передаёт тактический результат, не заменяя образ прямым толкованием «были окружены».
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: одни были с одной стороны, другие — с другой
  rationale: Естественно передаёт двустороннее расположение израильских сил и сохраняет параллельное построение еврейского текста.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Израильтяне поражали их
  rationale: נכה в контексте битвы означает наносить поражение, часто со смертельным исходом; «поражали» сохраняет военную силу глагола без ненужного уточнения каждого удара.
- source_word: עַד בִּלְתִּי
  choice: до тех пор, пока ... не
  rationale: Передаёт предел продолжавшегося действия и естественно выражает последующее отрицание по-русски.
- source_word: הִשְׁאִיר לוֹ
  choice: у него не осталось
  rationale: Безличная русская конструкция передаёт итоговый смысл и сохраняет местоимение единственного числа, тогда как буквальное «он не оставил ему» было бы резко неестественным и имело бы неясные референты.
- source_word: שָׂרִיד וּפָלִיט
  choice: ни уцелевшего, ни беглеца
  rationale: 'Сохраняет два отдельных понятия: того, кто пережил разгром, и того, кому удалось бежать.'
theological_decisions:
- issue: Необычный переход к единственному числу в הִשְׁאִיר לוֹ
  choice: Сохранить местоимение единственного числа в обороте «у него не осталось» и пояснить форму в сноске.
  alternative: 'Истолковать оба местоименных элемента как коллективные и написать: «пока они не оставили никого в живых и не дали никому бежать».'
  rationale: Еврейская конструкция допускает коллективное или безличное понимание, но её необычная форма не позволяет уверенно назвать референты. Перевод не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; необычная местоименная конструкция оригинала не воспроизводится неестественной калькой, но её реальная неоднозначность сохранена в сноске.
