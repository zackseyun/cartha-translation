base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: ru
  text: Иисус Навин не отвёл назад руки, протянутой с копьём, пока не предал заклятию всех жителей Гая[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью истребил всех жителей Гая». Еврейский глагол означает «предать заклятию», то есть посвятить уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Иисус
  rationale: Традиционная и общеупотребительная русская форма имени Иисус Навин; соединительный союз передан естественной русской связью без обязательного начального «и» в отдельно цитируемом стихе.
- source_word: הֵשִׁיב יָדוֹ
  choice: не отводил назад руку
  rationale: Каузативная форма שׁוב буквально выражает возвращение руки назад; в боевой сцене эта формулировка естественно передаёт продолжительное удерживание руки вытянутой, не подменяя движение глаголом «опускать».
- source_word: אֲשֶׁר נָטָה
  choice: которую протянул
  rationale: נטה здесь означает протянуть или вытянуть; относительное придаточное сохраняет структуру и временное соотношение еврейского текста.
- source_word: בַּכִּידוֹן
  choice: с копьём
  rationale: כידון обозначает копьё или метательное копьё. «Копьё» понятно современному читателю и не создаёт излишней уверенности в более узкой классификации оружия.
- source_word: הֶחֱרִים
  choice: предал заклятию
  rationale: Передаёт специальный смысл חרם — сделать объект заклятым, предназначенным для уничтожения, — а не сводит выражение к обычному военному истреблению.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: всех жителей Гая
  rationale: 'Прямой и естественный перевод: יֹשְׁבֵי — «жители», הָעָי — традиционно «Гай» в русской библейской топонимии.'
theological_decisions:
- issue: Передача חרם в контексте военного суда
  choice: предал заклятию всех жителей Гая
  alternative: полностью истребил всех жителей Гая
  rationale: Основной вариант сохраняет религиозно-правовой оттенок посвящения уничтожению и не сглаживает богословское напряжение текста; сноска поясняет смысл и приводит более прямую лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому, но остаётся ясным; техническое «предал заклятию» сохранено и пояснено сноской.
