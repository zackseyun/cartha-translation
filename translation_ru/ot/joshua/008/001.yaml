source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: ru
  text: 'И сказал Яхве Иисусу Навину: «Не бойся и не падай духом. Возьми с собой всех воинов[a], встань и иди к Гаю. Смотри: Я отдал в твои руки царя Гая, его народ, его город и его землю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь народ войны»; то есть всё боеспособное войско. Возможный перевод: «всё войско».'
    reason: Лексическая альтернатива и пояснение еврейского выражения.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Не бойся и не падай духом
  rationale: Первый запрет прямо относится к страху; второй передаёт состояние внутренней сломленности и утраты мужества естественным современным русским выражением.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: всех воинов
  rationale: Буквально «весь народ войны»; в данном контексте выражение обозначает боеспособное войско. «Всех воинов» ясно, естественно и не расширяет значение до всего населения.
- source_word: וְקוּם עֲלֵה
  choice: встань и иди
  rationale: Сохранены оба повелительных глагола. Направление движения к Гаю передано естественно по-русски без неуместного буквального «поднимись».
- source_word: הָעָי
  choice: Гай
  rationale: Использована устоявшаяся русская библейская форма географического названия.
- source_word: רְאֵה
  choice: Смотри
  rationale: Повелительная форма вводит Божье заверение; «Смотри» сохраняет указательную силу и звучит современно.
- source_word: נָתַתִּי בְיָדְךָ
  choice: Я отдал в твои руки
  rationale: Перфект выражает представленную как уже совершившуюся и потому несомненную передачу власти над врагом; сохранён образ «в руки».
- source_word: מֶלֶךְ הָעַי וְאֶת עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: царя Гая, его народ, его город и его землю
  rationale: Сохранена последовательность объектов и местоименная соотнесённость с царём.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Видо-временная сила נָתַתִּי в Божьей речи
  choice: Я отдал
  alternative: Я отдаю; Я предал
  rationale: Прошедшее время сохраняет форму еврейского перфекта и подчёркивает несомненность обещанного исхода, не превращая утверждение в простое будущее.
- issue: Объём выражения כָּל עַם הַמִּלְחָמָה
  choice: всех воинов
  alternative: всё войско; весь народ войны
  rationale: Контекст указывает на боевые силы, а не на весь народ. Выбранная формулировка передаёт военный смысл, не навязывая более узкой организационной категории «армия».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой и ясный; сохранены повторения и последовательность повелений исходного текста. Имя יהושע передано традиционной русской библейской формой «Иисус Навин», чтобы избежать смешения с Иисусом Христом и сохранить узнаваемость персонажа.
