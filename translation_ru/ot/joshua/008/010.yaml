lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: встал рано утром
  rationale: Порода hифиль глагола שׁכם обычно означает ранний подъём; сочетание с בַּבֹּקֶר естественно передаётся по-русски как «встал рано утром».
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: собрал народ
  rationale: В данном военном контексте פקד указывает на сбор и смотр людей перед выступлением. «Собрал» звучит естественно и не сводит действие лишь к подсчёту.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено широкое значение исходного слова; вариант «войско» неоправданно сузил бы его до воинов.
- source_word: וַיַּעַל
  choice: пошёл
  rationale: עלה обозначает движение вверх или выступление к месту назначения. В русском «пошёл» естественно передаёт движение к Гаю, не навязывая явно не указанной топографической детали.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: он вместе со старейшинами Израиля
  rationale: Переданы и усилительное местоимение, выделяющее самого Иисуса Навина, и совместное участие старейшин.
- source_word: לִפְנֵי הָעָם
  choice: впереди народа
  rationale: Передаёт пространственное значение «перед народом, во главе народа», не делая руководящую функцию более явной, чем в еврейском тексте.
- source_word: הָעָי
  choice: Гай
  rationale: Использована традиционная русская форма названия города; еврейский артикль отдельно не воспроизводится.
