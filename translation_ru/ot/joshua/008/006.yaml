  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: ru
  text: 'И они выйдут вслед за нами, пока мы не отведём их от города[a], потому что они скажут[b]: «Они убегают от нас, как и в первый раз». А мы будем убегать от них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на военную хитрость: «пока мы не выманим их из города». Еврейский глагол означает «оттянуть, отвести, удалить».'
    reason: lexical_alternative
  - marker: b
    text: «Как и в первый раз» — то есть как во время прежнего отступления израильтян перед Гаем (см. Иисус Навин 7:4–5).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: И они выйдут за нами и будут преследовать нас
  rationale: Форма וְיָצְאוּ в контексте изложения плана имеет будущее значение. Буквальное «выйдут за нами» сохранено, а смысл преследования, заложенный в אַחֲרֵינוּ в военном контексте, выражен явно и естественно по-русски.
- source_word: עַד הַתִּיקֵנוּ אֹתָם מִן־הָעִיר
  choice: пока мы не отведём их от города
  rationale: Hiphil глагола נתק означает «оттянуть, отвести, удалить». «Отведём» передаёт намеренное удаление защитников от города, не усиливая текст до более интерпретирующего «заманим».
- source_word: כִּי יֹאמְרוּ
  choice: потому что они скажут
  rationale: כִּי вводит основание, на котором строится расчёт израильтян; причинное «потому что» ясно выражает эту связь.
- source_word: נָסִים לְפָנֵינוּ
  choice: Они убегают от нас
  rationale: Причастие נָסִים обозначает продолжающееся бегство. В этом контексте לְפָנֵינוּ означает отступление перед противником; современное русское «от нас» естественнее буквального «перед нами».
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: как и в первый раз
  rationale: Выражение указывает на прежнее отступление Израиля перед Гаем и сохраняет конкретное сопоставление с первым столкновением.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: Так мы будем убегать от них
  rationale: В контексте запланированного действия перфект с союзом передан будущим временем. «Убегать от них» естественно выражает военное отступление и сохраняет лексическую перекличку с репликой противника.
