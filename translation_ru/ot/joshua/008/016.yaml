  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: ru
  text: И все люди, находившиеся в городе, были созваны, чтобы преследовать их[a]. Они преследовали Иисуса Навина и были увлечены прочь от города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закричали». Еврейский глагол может означать крик, но в данном военном контексте, вероятно, указывает на созыв или мобилизацию для преследования.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были оторваны от города» или «оказались отделены от города». Еврейское слово указывает на удаление, вследствие которого преследователи отделились от города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: был созван
  rationale: Форма нифаль глагола זעק может обозначать созыв или мобилизацию. В военном контексте речь, вероятнее всего, идёт о том, что находившихся в городе подняли для преследования; пассивная формулировка сохраняет форму еврейского глагола.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: весь народ, находившийся в городе
  rationale: עָם означает «народ», «люди» или в данном контексте население/воины. Перевод «народ» не сужает значение до одних мужчин, а причастный оборот естественно передаёт определительное придаточное.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: чтобы преследовать их
  rationale: רדף с אחרי — обычное выражение со значением преследования. Местоимение во множественном числе сохранено без уточнения подразумеваемой группы.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: они погнались за Иисусом Навином
  rationale: Перевод сохраняет переход от множественного объекта «их» к названному по имени Иисусу Навину. «Погнались за» естественно звучит в русском повествовании и передаёт начавшееся активное преследование.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: были оттянуты от города
  rationale: Нифаль от נתק выражает отделение, отрыв или удаление. «Были оттянуты» передаёт как удаление преследователей из города, так и тактический результат приманки, не превращая его прямо в утверждение об их полном окружении или отсечении.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличить Иисуса Навина от других носителей имени Иисус.
