revisions:
- from: Из всего, что повелел Моисей, не было ни одного слова, которого Иисус Навин не прочитал бы перед всем собранием Израиля — перед женщинами, малыми детьми и жившими среди них переселенцами[a].
  to: Не было ни одного слова из всего, что повелел Моисей, которого Иисус Навин не прочитал в присутствии всего собрания Израиля, женщин, детей и переселенцев, живших среди них[a].
  rationale: 'Исправлен синтаксис перечисления: названные в еврейском тексте женщины, дети и переселенцы переданы как явно присоединённые группы, без пояснительного тире. Форма глагола изменена на естественное русское изъявительное прошедшее время. «Дети» выбраны как современное литературное соответствие טַף; контекст перечисления сохраняет указание на зависимых/малолетних членов общины без неестественного оборота «малые дети».'
