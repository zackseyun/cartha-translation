source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: ru
  text: Не было ни одного слова из всего, что повелел Моисей, которого Иисус Навин не прочитал в присутствии всего собрания Израиля, женщин, детей и переселенцев, живших среди них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Переселенцы» — выходцы из других народов, постоянно жившие среди израильтян.
    reason: cultural_note
lexical_decisions:
- source_word: דָבָר
  choice: слово
  rationale: В сочетании с глаголом «прочитал» слово דָבָר естественно означает отдельное слово или предписание; перевод сохраняет связь с публичным чтением закона.
- source_word: צִוָּה
  choice: повелел
  rationale: «Повелел» передаёт властный характер наставлений Моисея и соответствует торжественному, но современному регистру.
- source_word: קָרָא
  choice: прочитал
  rationale: Контекст публичного чтения закона делает значение «прочитал» наиболее точным; более широкое значение «провозгласил» здесь менее конкретно.
- source_word: נֶגֶד
  choice: перед
  rationale: «Перед всем собранием» естественно передаёт чтение в присутствии собравшегося народа.
- source_word: קְהַל
  choice: собрание
  rationale: «Собрание» обозначает официально собравшуюся общину Израиля, не внося поздней церковной терминологии.
- source_word: הַטַּף
  choice: малые дети
  rationale: טַף обозначает маленьких детей или малолетних иждивенцев; «малые дети» сохраняет возрастной оттенок исходного слова.
- source_word: הַגֵּר
  choice: переселенцы
  rationale: В данном перечислении единственное число с определённым артиклем имеет собирательный смысл. «Переселенцы» понятно обозначает постоянно живущих среди Израиля выходцев из другого народа.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: жившими среди них
  rationale: Буквально причастие связано с «хождением», но в этом контексте идиоматически описывает пребывание и жизнь внутри общины; буквальное «ходившими среди них» по-русски могло бы ошибочно обозначать физическое передвижение.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: не было ни одного слова, которого ... не прочитал бы
  rationale: Русская двойная отрицательная конструкция сохраняет структуру и усиленное утверждение полноты публичного чтения.
theological_decisions:
- issue: Круг слушателей заветного наставления
  choice: Женщины, малые дети и переселенцы названы явно как присутствовавшие при чтении всему собранию Израиля.
  alternative: Считать, что выражение «всё собрание Израиля» само по себе достаточно и не подчёркивать отдельно перечисленные группы.
  rationale: Еврейский текст прямо перечисляет эти группы после упоминания всего собрания; перевод сохраняет их явное включение, не сужая состав слушателей.
- issue: Соотношение «собрания Израиля» и перечисленных групп
  choice: Тире и повтор предлога «перед» передают перечисление как уточнение состава присутствующих.
  alternative: 'Передать союз ו буквально как простое присоединение: «и перед женщинами, и перед малыми детьми…».'
  rationale: Такой синтаксис естественен по-русски и не создаёт ложного впечатления, будто женщины и дети не относились к собранию Израиля, при этом все названные в оригинале группы остаются явными.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Сохранена подчёркнутая полнота чтения через двойное отрицание; традиционное имя «Иисус Навин» обеспечивает узнаваемость. Уточняющее тире делает длинное перечисление ясным без устранения явного включения женщин, детей и переселенцев.
