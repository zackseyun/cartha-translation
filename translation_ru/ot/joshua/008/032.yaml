base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: ru
  text: И там, на камнях, он написал копию[a] закона Моисея, которую Моисей написал перед сынами Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повторение закона Моисея»; возможно также: «дубликат закона Моисея». Еврейское слово может обозначать копию или повторно воспроизведённый текст.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в присутствии сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: он написал
  rationale: Обычное значение Qal от כתב; поверхность из камня не требует более узкого «высек» или «начертал».
- source_word: שָׁם
  choice: там
  rationale: Естественная передача наречия места в русском повествовании.
- source_word: עַל הָאֲבָנִים
  choice: на камнях
  rationale: Предлог עַל обозначает поверхность, на которой было сделано написание.
- source_word: אֵת מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: копию закона Моисея
  rationale: מִשְׁנֵה может означать копию, повторение или дубликат; «копию» лучше всего согласуется с написанием на камнях, не уточняя объём текста.
- source_word: תּוֹרַת מֹשֶׁה
  choice: закона Моисея
  rationale: В данном заветно-правовом контексте «закон Моисея» естественнее и узнаваемее, чем «наставление Моисея».
- source_word: אֲשֶׁר כָּתַב
  choice: которую тот написал
  rationale: Местоимение «тот» естественно относит действие к Моисею и устраняет возможное русское прочтение, будто речь снова идёт об Иисусе Навине, при этом не добавляя нового содержания.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед сынами Израиля
  rationale: Сохраняет краткость и пространственно-публичный оттенок לִפְנֵי; выражение также может означать «в присутствии».
theological_decisions:
- issue: Объём מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: «копию закона Моисея» без уточнения объёма написанного
  alternative: «повторение закона Моисея» или «дубликат закона Моисея»; понимание как всего Закона либо отдельной его части
  rationale: Стих не определяет объём надписи, поэтому перевод не разрешает этот вопрос посредством добавленного толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Сыны Израиля» сохраняет формальную прозрачность древнееврейского выражения בְּנֵי יִשְׂרָאֵל; синтаксис слегка прояснён местоимением «тот», указывающим на Моисея.
