base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: ru
  text: Тогда люди из Гая обернулись и посмотрели назад — и вот, дым от города поднимался к небу[a]. У них не было сил бежать ни туда, ни сюда[b]. А народ, бежавший к пустыне, развернулся против преследователя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимался ввысь». Древнееврейская форма буквально указывает направление: «к небу, в небо».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не было у них рук» — древнееврейская идиома, означающая отсутствие силы или возможности спастись.'
    reason: cultural_note
  - marker: c
    text: 'В древнееврейском тексте стоит единственное число: «преследователь»; вероятно, оно обозначает преследовавшее войско как одно целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: люди из Гая обернулись и посмотрели назад
  rationale: 'Раздельно переданы два последовательных действия: изменение направления и взгляд назад. «Люди из Гая» естественно по-русски обозначает участников сражения, не добавляя отсутствующего в тексте уточнения «воины».'
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет функцию маркера внезапно открывшегося зрелища и звучит естественно в современном русском повествовании.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: дым от города поднимался к небу
  rationale: «Поднимался» передаёт наблюдаемое продолжающееся движение дыма; «к небу» сохраняет направительное значение формы הַשָּׁמַיְמָה без богословского переосмысления.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: у них не было сил
  rationale: Естественно передаёт древнееврейскую идиому о полном отсутствии способности или возможности действовать.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: бежать ни туда ни сюда
  rationale: Русская парная конструкция передаёт невозможность бегства в любом из двух направлений и сохраняет образность оригинала.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: народ, бежавший к пустыне
  rationale: Причастный оборот отражает определённую группу, до этого отступавшую в направлении пустыни.
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: повернул против преследователя
  rationale: «Повернул против» передаёт одновременно смену направления и переход к нападению; единственное число «преследователя» сохранено как в масоретском тексте.
