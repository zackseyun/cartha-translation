base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: ru
  text: А я и весь народ, который со мной, подойдём к городу[a]. Когда они выйдут нам навстречу, как в первый раз[b], мы побежим от них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приблизимся к городу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как прежде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: подойдём
  rationale: Форма Qal обозначает запланированное приближение к городу; «подойдём» естественно звучит по-русски и не уточняет цель движения сверх еврейского текста.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено основное значение עם без сужения до «войска» или «воинов», хотя в контексте речь идёт о людях, сопровождающих Иисуса Навина.
- source_word: אֲשֶׁר אִתִּי
  choice: который со мной
  rationale: Относительное придаточное определяет сопровождающий Иисуса Навина народ; единственное число согласуется с собирательным существительным «народ».
- source_word: וְהָיָה כִּי
  choice: Когда
  rationale: Распространённая повествовательно-временная конструкция передана естественным русским союзом без буквального и тяжеловесного «и будет, когда».
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: они выйдут нам навстречу
  rationale: Сочетание יצא с לקראת описывает выход навстречу; перевод сохраняет пространственное движение и не добавляет прямо не выраженного «против нас».
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: как в первый раз
  rationale: Выражение отсылает к прежнему столкновению у Гая; «как в первый раз» близко к форме оригинала и ясно в современном русском.
- source_word: וְנַסְנוּ
  choice: мы побежим
  rationale: В данном ряду перфект с waw обозначает запланированное будущее действие. «Побежим» сохраняет силу глагола נוס и образ притворного бегства, не смягчая его до «отступим».
- source_word: לִפְנֵיהֶם
  choice: от них
  rationale: При глаголе נוס выражение означает бегство перед кем-либо, то есть от преследователей; по-русски естественно «побежим от них».
- source_word: וַאֲנִי וְכָל הָעָם
  choice: А я и весь народ
  rationale: Начальное waw связывает указание с предыдущим ходом речи; «А» естественно обозначает переход к роли Иисуса Навина и сопровождающих его людей.
