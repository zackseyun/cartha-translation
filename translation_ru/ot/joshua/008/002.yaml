base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: ru
  text: И поступи с Гаем и его царём так же, как поступил с Иерихоном и его царём. Только добычу и скот этого города можете взять себе[a]. Устрой засаду[b] за городом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «заберёте себе» или «возьмите себе как добычу». Еврейская форма допускает оттенок будущего действия или уполномочивающего указания; основной текст подчёркивает разрешение в отличие от запрета брать добычу в Иерихоне.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поставь за городом засадный отряд». Еврейское слово может обозначать и засаду как таковую, и находящихся в засаде воинов как единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И поступи
  rationale: Форма с союзом в данном контексте передаёт обращённое к Иисусу Навину повеление; русский императив выражает его прямо и естественно.
- source_word: לָעַי
  choice: с Гаем
  rationale: Название הָעַי передано в принятой русской библейской форме «Гай»; управление «поступить с» естественно передаёт еврейскую конструкцию.
- source_word: וּלְמַלְכָּהּ
  choice: и его царём
  rationale: Местоимение соотнесено с городом Гаем; повтор предлога по-русски не требуется.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: так же, как поступил
  rationale: Сравнительная конструкция ясно указывает на Иерихон как образец предстоящего действия.
- source_word: לִירִיחוֹ וּלְמַלְכָּהּ
  choice: с Иерихоном и его царём
  rationale: Сохраняется параллель с Гаем и его царём в естественной русской форме.
- source_word: רַק
  choice: Только
  rationale: Слово вводит существенное исключение из сопоставления с Иерихоном.
- source_word: שְׁלָלָהּ
  choice: добычу
  rationale: «Добыча» — современное и нейтральное обозначение имущества, захваченного на войне.
- source_word: וּבְהֶמְתָּהּ
  choice: и скот его
  rationale: בְּהֵמָה здесь обозначает принадлежащих городу домашних животных; «скот» точно и естественно передаёт хозяйственный смысл.
- source_word: תָּבֹזּוּ לָכֶם
  choice: можете забрать себе
  rationale: Форма обращена ко всему войску. В контексте она выражает разрешение взять добычу, в отличие от запрета при Иерихоне; «себе» сохраняет значение לָכֶם.
- source_word: שִׂים לְךָ
  choice: Устрой
  rationale: Императив обращён к Иисусу Навину. Глагол «устрой» естественно сочетается с «засадой»; дательный интереса לְךָ подразумевается самой военной инструкцией.
- source_word: אֹרֵב
  choice: засаду
  rationale: Субстантивированное причастие может обозначать как засаду, так и находящийся в засаде отряд; основной текст сохраняет краткую собирательную формулировку.
- source_word: מֵאַחֲרֶיהָ
  choice: за городом
  rationale: В данном пространственном контексте выражение означает расположение с тыльной стороны города; по-русски это естественно передаётся словами «за городом».
theological_decisions:
- issue: Разрешение взять добычу после сравнения с Иерихоном
  choice: можете забрать себе
  alternative: заберёте себе / возьмите себе как добычу
  rationale: Контекст противопоставляет эту кампанию Иерихону, где присвоение добычи было запрещено. Перевод передаёт разрешение, не превращая его без необходимости ни в простое предсказание, ни в отдельный категорический приказ.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествовательным регистром. Сохранена традиционная русская форма топонима «Гай». Маркеры сносок поставлены непосредственно после слов, к которым относятся варианты.
