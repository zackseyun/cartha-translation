base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: ru
  text: А весь Израиль — его старейшины, должностные лица и судьи — стоял по обе стороны ковчега, напротив священников-левитов, несущих ковчег завета Яхве, — как пришлые жители, так и уроженцы[a]. Одна половина народа стояла напротив горы Гаризим, а другая — напротив горы Гевал, как прежде[b] повелел Моисей, слуга Яхве, чтобы благословить народ Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как пришелец, так и уроженец»; речь о пришлом жителе, живущем среди Израиля, и об уроженце страны.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вначале» или «прежде». Возможно также: «первым делом»; выражение может отсылать и к данному ранее повелению Моисея о благословении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: А весь Израиль — его старейшины, распорядители и судьи
  rationale: Сохраняется корпоративное значение «весь Израиль», а тире естественно вводит названных представителей народа. שֹׁטְרִים здесь обозначает должностных лиц, ведавших порядком и исполнением решений; «распорядители» не придаёт слову современного полицейского или военного оттенка.
- source_word: עֹמְדִים מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: стоял по обе стороны ковчега
  rationale: Русское сказуемое согласовано с собирательным субъектом «Израиль» в единственном числе. «По обе стороны» естественно и точно передаёт пространственное מִזֶּה וּמִזֶּה.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священников-левитов
  rationale: 'Передаёт возможную атрибутивно-аппозитивную связь: речь идёт о левитских священниках, без утверждения, будто все левиты были священниками.'
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: несущих ковчег завета Яхве
  rationale: Причастие сохраняет одновременное действие исходного причастия; «ковчег завета Яхве» передаёт конструкцию принадлежности без добавления отсутствующих слов.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: там были и переселенцы, и уроженцы
  rationale: Гер — живущий среди Израиля пришелец, а эзрах — коренной член общества. «Переселенцы» и «уроженцы» понятно передают социальное различие и равное участие обеих групп; добавленное «там были» проясняет синтаксическую связь, не меняя смысла.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: Одна половина народа ... а другая
  rationale: Явно указывается референт местоименного суффикса и естественно выражается разделение собрания на две части.
- source_word: בָּרִאשֹׁנָה
  choice: прежде
  rationale: Краткое русское соответствие сохраняет временную неопределённость выражения; сноска отмечает возможные оттенки.
- source_word: לְבָרֵךְ אֶת הָעָם יִשְׂרָאֵל
  choice: чтобы благословить народ Израиля
  rationale: Инфинитив цели передан придаточным цели, при этом не уточняется сверх текста, кто именно должен произнести благословение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому используется его распространённая научная транслитерация, а не замена титулом.
- issue: Социальные категории גֵּר и אֶזְרָח
  choice: переселенцы и уроженцы
  alternative: пришельцы и коренные жители; чужеземцы и уроженцы
  rationale: Формулировка показывает равное присутствие некоренных постоянных жителей и уроженцев, не привнося позднейших конфессиональных категорий.
- issue: Связь לְבָרֵךְ с повелением Моисея
  choice: как прежде повелел Моисей ... чтобы благословить народ
  alternative: как Моисей прежде повелел благословить народ; чтобы прежде всего благословить народ
  rationale: 'Сохранена исходная синтаксическая напряжённость: инфинитив выражает цель повеления, а בָּרִאשֹׁנָה не истолковано однозначно как «первым действием» или как ссылка на более раннее распоряжение.'
translation_notes:
  register: 'Современный литературный русский с достоинством повествовательной прозы. Синтаксис упрощён ровно настолько, чтобы длинное древнееврейское предложение оставалось понятным: первая часть оформлена через пояснительное тире и точку с запятой, а деление народа вынесено в отдельное предложение. Географические имена переданы в привычных русских библейских формах «Гаризим» и «Гевал».'
