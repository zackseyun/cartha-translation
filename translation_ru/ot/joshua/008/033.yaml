  source_fidelity: 'В целом переданы состав собрания, его расположение по обе стороны ковчега, священники-левиты, несущие ковчег завета Яхве, разделение народа между Гаризимом и Гевалом и связь с повелением Моисея. Однако «там были» ослабляет и несколько разрывает синтаксическую связь כַּגֵּר כָּאֶזְרָח с общим описанием стоящих у ковчега: в оригинале пришлые жители и уроженцы включены в описываемое собрание. «Распорядители» для שֹׁטְרִים чрезмерно сужает и может создавать бытовую ассоциацию; нейтральное «должностные лица» точнее в административно-судебном контексте.'
  naturalness: Синтаксис в целом литературный и понятный. Замена «там были и переселенцы, и уроженцы» на «как пришлые жители, так и уроженцы» делает фразу более непосредственно связанной с основным сказуемым. «Пришлые жители» яснее, чем «переселенцы», поскольку не предполагает именно переселения как события и передаёт статус גֵּר как живущего среди Израиля неуроженца.
  terminology: «Священники-левиты», «ковчег завета», «Яхве», «Гаризим» и «Гевал» приемлемы. Для גֵּר предпочтено «пришлые жители», а для אֶזְרָח сохранено «уроженцы». Неоднозначность בָּרִאשֹׁנָה сохранена в основном тексте («прежде») и раскрыта сноской.
