  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: ru
  text: И не осталось ни одного человека[a] в Гае и Вефиле, который не вышел бы вслед за Израилем. Они оставили город открытым[b] и стали преследовать Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אִישׁ — существительное мужского рода в единственном числе; в таком отрицательном обороте оно может употребляться обобщённо в значении «ни одного человека».
    reason: lexical_alternative
  - marker: b
    text: 'Или, по смыслу: «оставили город без защиты». Буквально в еврейском тексте: «оставили город открытым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: не осталось ни одного мужчины
  rationale: Передаёт пассивно-результативный смысл שׁאר и сохраняет мужскую форму единственного числа אִישׁ; в контексте речь идёт о способных участвовать в преследовании мужчинах, хотя форма может функционировать обобщённо.
- source_word: בָּעַי וּבֵית אֵל
  choice: в Гае и Вефиле
  rationale: Еврейский союз ו соединяет два места; после отрицания русская конструкция «ни одного… в Гае и Вефиле» естественно сообщает, что никто не остался ни в одном из них.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: который не вышел бы вслед за Израилем
  rationale: Сохраняет относительную конструкцию и направительный образ אַחֲרֵי; частица «бы» естественно оформляет по-русски следствие отрицательного оборота «не осталось ни одного».
- source_word: וַיַּעַזְבוּ
  choice: они оставили
  rationale: Нейтрально и точно передаёт עזב в повествовательном контексте, не усиливая значение до «бросили» или «покинули».
- source_word: הָעִיר פְּתוּחָה
  choice: город открытым
  rationale: Сохраняет конкретный образ еврейского текста; по контексту это означает, что город остался незащищённым.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: и погнались за Израилем
  rationale: Естественная современная русская передача военного преследования, выраженного רדף אַחֲרֵי.
