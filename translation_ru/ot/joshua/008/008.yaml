base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: ru
  text: 'Когда вы возьмёте город, подожгите его. Поступите по слову Яхве[a]. Смотрите: я повелел вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сделайте так, как повелел Яхве». Буквально: «по слову Яхве сделайте».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Когда вы возьмёте
  rationale: Сочетание וְהָיָה с כְּ и глагольной формой вводит будущее временное обстоятельство; естественный русский эквивалент — «когда вы возьмёте».
- source_word: אֶת הָעִיר
  choice: город
  rationale: Обычное значение עִיר в контексте военного захвата.
- source_word: תַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: подожгите его
  rationale: Hiphil от יצת выражает причинение возгорания — «поджечь, предать огню». Местоимение устраняет неестественный для русского повтор слова «город», не меняя референта.
- source_word: כִּדְבַר יְהוָה תַּעֲשׂוּ
  choice: Поступите по слову Яхве
  rationale: Сохраняется буквальный образ «по слову Яхве», тогда как «поступите» естественно передаёт здесь общее תעשו без добавления конкретного объекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: רְאוּ
  choice: Смотрите
  rationale: Прямой повелительный призыв обратить внимание; сохраняет образ еврейского глагола и множественное число.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: я повелел вам
  rationale: Еврейский перфект указывает на уже данное распоряжение; в русском прошедшее время звучит естественно и точно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение דְבַר в выражении כִּדְבַר יְהוָה
  choice: по слову Яхве
  alternative: по повелению Яхве
  rationale: «Слово» сохраняет лексическую широту דָּבָר и не сводит выражение исключительно к техническому обозначению приказа, хотя в данном контексте слово имеет повелительную силу.
translation_notes:
  register: Современный литературный русский язык с краткими повелительными формами, соответствующими военному наставлению. Двоеточие после «Смотрите» передаёт функцию призыва обратить внимание на последующее утверждение.
