  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: ru
  text: А царя Гая взяли живым и привели к Иисусу Навину[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И царя Гая взяли живым и привели к Иисусу Навину».'
    reason: 'Лексико-дискурсивная альтернатива: союз ו может быть передан как нейтральное «и», тогда как «а» подчёркивает лёгкое противопоставление предшествующему истреблению.'
lexical_decisions:
- source_word: וְ/אֶת
  choice: А
  rationale: Союз ו продолжает повествование, но на фоне истребления жителей города выделяет иную участь царя. Русское «а» естественно передаёт и последовательность, и лёгкое противопоставление; возможно также более формальное «и».
- source_word: מֶלֶךְ הָעַי
  choice: царя Гая
  rationale: Сопряжённая конструкция означает «царь Гая». Топоним הָעַי передан в принятой русской библейской форме «Гай».
- source_word: תָּפְשׂוּ
  choice: взяли
  rationale: В военном контексте глагол означает схватить или захватить. Сочетание «взяли живым» естественно и точно передаёт пленение.
- source_word: חָי
  choice: живым
  rationale: Предикативное прилагательное указывает, что царь был захвачен, а не убит; русская творительная форма соответствует обороту «взяли живым».
- source_word: וַיַּקְרִבוּ אֹתוֹ אֶל
  choice: привели к
  rationale: Каузативная форма קרב означает приблизить, подвести или привести. «Привели к» сохраняет направленность к Иисусу Навину и звучит естественно по-русски, не добавляя явно не выраженного судебного оттенка «представили».
- source_word: יְהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличить Иисуса Навина от других носителей имени Иисус.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Порядок слов сохраняет вынесение царя Гая как выделенного объекта; подлежащее не выражено, как и в древнееврейском тексте, но подразумевается формой множественного числа глаголов.
