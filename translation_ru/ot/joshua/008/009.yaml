base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: ru
  text: Иисус Навин послал их, и они пошли к месту засады[a] и расположились между Вефилем и Гаем, к западу от Гая. В ту ночь Иисус Навин ночевал среди народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к засаде». Еврейское слово может обозначать засадный отряд либо место, где он расположился; здесь контекст скорее указывает на место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: послал их
  rationale: Глагол שׁלח здесь прямо обозначает отправление людей; «послал их» естественно и точно передаёт еврейскую форму.
- source_word: הַמַּאְרָב
  choice: к месту засады
  rationale: Существительное может обозначать как засаду или засадный отряд, так и место его расположения. В данном контексте движение людей к назначенной позиции делает пространственное значение наиболее естественным; неоднозначность отмечена в сноске.
- source_word: וַיֵּשְׁבוּ
  choice: расположились
  rationale: Глагол יׁשב буквально связан с сидением или пребыванием, а в военном контексте естественно означает занятие и удержание позиции. «Расположились» передаёт это без лишней детализации.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: между Вефилем и Гаем
  rationale: Прямое географическое указание; использованы традиционные русские формы библейских топонимов.
- source_word: מִיָּם לָעָי
  choice: к западу от Гая
  rationale: יָם буквально означает «море», но в географическом употреблении указывает на запад; перевод передаёт значение естественным русским оборотом.
- source_word: וַיָּלֶן
  choice: ночевал
  rationale: Глагол לון означает провести ночь или остаться на ночь. «Ночевал» кратко и естественно передаёт действие.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Естественная русская передача временного выражения.
- source_word: בְּתוֹךְ הָעָם
  choice: среди народа
  rationale: Предлог בְּתוֹךְ обозначает нахождение внутри группы, в её среде; «среди народа» ясно и современно.
