  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: ru
  text: Когда израильтяне закончили убивать всех жителей Гая в поле, в пустынной местности, где они преследовали их, и все они пали от меча до полного их уничтожения[a], весь Израиль возвратился в Гай и поразил его мечом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до их полного конца».'
    reason: Сноска отмечает буквальный завершительный образ выражения עַד תֻּמָּם; основной текст передаёт его естественным русским оборотом.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Когда … закончили
  rationale: Еврейская повествовательная формула вместе с временной конструкцией вводит завершившееся действие, предшествующее возвращению в город. В русском отдельное «и было» здесь звучало бы тяжеловесно.
- source_word: יִשְׂרָאֵל
  choice: израильтяне / весь Израиль
  rationale: В первой части множественное «израильтяне» естественно согласуется с действиями преследования и убийства; во второй сохранено собирательное выражение «весь Израиль».
- source_word: לַהֲרֹג
  choice: убивать
  rationale: Прямо передаёт значение «убить, умертвить», не смягчая жестокости повествования и не добавляя богословской оценки.
- source_word: יֹשְׁבֵי הָעַי
  choice: жителей Гая
  rationale: Субстантивированное причастие от ישב обозначает людей, живущих в городе; «жители» — точный и современный русский эквивалент.
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: в поле, в пустынной местности
  rationale: Сохранены оба топографических обозначения. «Пустынная местность» не предполагает непременно песчаную пустыню и соответствует незаселённой, невозделанной земле.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: куда они их преследовали
  rationale: Относительная конструкция связывает место с преследованием. «Куда» естественно передаёт движение преследуемых в данную местность, не устраняя возможной локативной связи.
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: и все те пали от меча
  rationale: «Пали» сохраняет обычную военную идиому נפל, а «от меча» естественно передаёт еврейское выражение «устами меча» без буквального калькирования.
- source_word: עַד תֻּמָּם
  choice: все до единого[a]
  rationale: Передаёт завершённость и тотальность гибели преследуемой группы. Смысл корня завершения отмечен в сноске, поскольку буквальная передача по-русски неестественна.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: весь Израиль возвратился в Гай
  rationale: שוב с указанием пункта назначения означает возвращение; порядок событий ясно выражен русской временной конструкцией.
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: и поразил его мечом
  rationale: Сохранено широкое значение נכה «поразить». Местоимение относится к городу; мужской род обусловлен русской формой названия «Гай».
theological_decisions:
- issue: Передача повествования о полном уничтожении в войне
  choice: Сохранить прямые слова об убийстве и гибели всех преследуемых, не смягчая их
  alternative: Передать действия более мягкими словами «победили» или «разгромили» либо пояснить их как Божий суд
  rationale: Стих прямо описывает массовое убийство, но сам по себе не формулирует его богословскую оценку. Перевод сохраняет суровость текста и не привносит дополнительного оправдания или осуждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Военная формула «пали от меча» сохранена как понятная и уместная в библейском историческом повествовании; архаические кальки вроде «устами меча» исключены.
