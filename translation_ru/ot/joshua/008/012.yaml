  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: ru
  text: Он взял около пяти тысяч человек и поставил их в засаду между Бет-Элем и Гаем, к западу от города.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от моря по отношению к городу»; слово «море» здесь употреблено в значении «запад».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Он взял
  rationale: Обычное повествовательное значение לקח — «взять»; военный контекст допускает оттенок отбора из общего войска, но не требует выражать его явно.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: около пяти тысяч человек
  rationale: Префикс כ перед числительным указывает на приблизительность; אִישׁ после числительного имеет собирательное значение.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: поставил их в засаду
  rationale: שׂים означает «ставить, помещать», а אֹרֵב здесь обозначает засаду или отряд, находящийся в засаде. Русское выражение естественно передаёт военное действие без излишнего уточнения.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: между Бет-Элем и Гаем
  rationale: Прямая передача пространственного оборота; формы названий согласованы с современной русской библейской традицией.
- source_word: מִיָּם לָעִיר
  choice: к западу от города
  rationale: יָם буквально означает «море», но в древнееврейской географической ориентации обычно обозначает запад; по смыслу оборот указывает на западную сторону города.
