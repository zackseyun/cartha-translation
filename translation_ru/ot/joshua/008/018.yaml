base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: ru
  text: 'Тогда Яхве сказал Иисусу Навину: «Протяни в сторону Гая копьё[a], которое у тебя в руке, потому что Я отдам город в твою власть». И Иисус Навин протянул копьё, которое было у него в руке, в сторону города.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «метательное копьё». Еврейское слово כִּידוֹן может обозначать копьё, дротик или другое подобное древковое оружие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: протяни / протянул
  rationale: Сохраняет буквальный образ вытянутого оружия и параллель между повелением и его исполнением, не сводя жест только к указанию направления.
- source_word: כִּידוֹן
  choice: копьё
  rationale: Естественное и понятное русское обозначение древкового оружия; точный его тип в данном контексте не вполне определён, поэтому возможная альтернатива вынесена в сноску.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: которое у тебя в руке / которое было у него в руке
  rationale: Сохраняет обе относительные конструкции еврейского текста; в повествовательной части употреблено естественное русское прошедшее время.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: в сторону Гая / в сторону города
  rationale: Передаёт направленность жеста и сохраняет смену наименования с топонима на слово «город».
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: потому что Я отдам город в твою власть
  rationale: Русский фразеологический эквивалент древнееврейской идиомы «дать в руку»; явное «город» проясняет референт местоименного суффикса женского рода.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Идиома «дать в руку»
  choice: отдать город в твою власть
  alternative: дать его в твою руку
  rationale: Передаёт смысл обещания победы и власти над городом естественно по-русски, не добавляя идеи, отсутствующей в исходном тексте.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный без архаизмов. Имя יְהוֹשֻׁעַ передано в укоренившейся русской библейской форме «Иисус Навин», чтобы избежать смешения с Иисусом Христом. Повтор исходного текста сохранён.
