  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: ru
  text: 'Всех павших в тот день — мужчин и женщин — было двенадцать тысяч: всё население Гая[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все мужи (или люди) Гая»; этот оборот может обобщённо обозначать всё население города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: Форма глагола היה подводит итог сообщению; по-русски связка «было» естественно передаёт итоговое значение без архаичного «и было».
- source_word: כָל הַנֹּפְלִים
  choice: всех павших
  rationale: Причастие от נפל буквально обозначает «павших»; в контексте сражения речь идёт о погибших. Русское «павших» сохраняет образ исходного текста.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Обычное и точное соответствие еврейскому временному обороту.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: мужчин и женщин
  rationale: 'Буквально: «от мужчины и до женщины». В современном русском парное выражение «мужчин и женщин» естественно передаёт охват обеих групп и избегает неидиоматичного оборота.'
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: двенадцать тысяч
  rationale: Прямое соответствие количественному числительному.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: всё население Гая
  rationale: Словосочетание буквально допускает передачу «все мужи/люди Гая», но после прямого упоминания мужчин и женщин оно, вероятнее всего, обобщённо обозначает жителей города. Лексическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Гендерно маркированное обозначение погибших и обобщающий оборот אַנְשֵׁי הָעָי
  choice: Сохранить явное упоминание мужчин и женщин, а заключительный оборот передать как «всё население Гая»
  alternative: «от мужчины до женщины… все мужи Гая» или «все жители Гая»
  rationale: Так перевод не скрывает гендерную форму первой части и одновременно учитывает, что заключительное выражение относится ко всей названной группе, включая женщин. Буквальная форма заключительного оборота приведена в сноске, чтобы не устранять подлинную лексическую напряжённость.
translation_notes:
  register: Современный литературный русский язык. Инверсия «Всех павших… было» сохраняет итоговый характер стиха; тире ясно выделяют уточнение, а двоеточие вводит заключительное обобщение.
