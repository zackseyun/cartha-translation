  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: ru
  text: Иисус Навин и весь Израиль были разбиты перед ними[a] и бежали по дороге к пустыне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделали вид, что разбиты перед ними»; в контексте речь, вероятно, идёт о тактическом манёвре.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по дороге через пустыню».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: сделали вид, будто разбиты
  rationale: Форма нифаль в данном военном контексте обозначает поражение перед противником, однако дальнейшее повествование ясно показывает, что отступление было частью засады. Такая передача выражает тактическую видимость поражения, не утверждая, что израильтяне действительно потерпели поражение.
- source_word: לִפְנֵיהֶם
  choice: ими
  rationale: В сочетании с глаголом поражения לִפְנֵי естественно передаёт, перед кем или от чьих рук войско оказывается разбито; по-русски здесь идиоматично «разбиты ими».
- source_word: וַיָּנֻסוּ
  choice: побежали
  rationale: נוּס обычно означает «бежать, спасаться бегством». «Побежали» сохраняет видимое бегство, не превращая его явно в организованное отступление.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: по дороге к пустыне
  rationale: דֶּרֶךְ означает дорогу или путь; в контексте наиболее естественно направление по дороге, ведущей к пустыне. Возможность понимать выражение как путь через пустыню отмечена в сноске.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: Иисус Навин и весь Израиль
  rationale: Сохранено коллективное обозначение народа «весь Израиль» и традиционная русская форма имени Иисус Навин.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной русской формы имени «Иисус Навин» и коллективного библейского выражения «весь Израиль». Формулировка передаёт военную уловку, очевидную из контекста главы, но не добавляет подробностей сверх текста.
