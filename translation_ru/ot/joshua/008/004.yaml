  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: ru
  text: 'Он приказал им: «Смотрите: вы должны расположиться в засаде против города, позади города. Не удаляйтесь от города слишком далеко и будьте все наготове».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו אֹתָם לֵאמֹר
  choice: Он приказал им
  rationale: Естественно передаёт повествовательную формулу со значением прямого распоряжения; отдельное «сказав» в современном русском избыточно.
- source_word: רְאוּ
  choice: Смотрите
  rationale: Сохраняет императив, вводящий важное указание и призывающий к вниманию.
- source_word: אֹרְבִים לָעִיר מֵאַחֲרֵי הָעִיר
  choice: устроить засаду позади города
  rationale: Передаёт назначение отряда как засады против города и его положение с тыльной стороны; по-русски объект «против города» можно не повторять, поскольку цель ясна из контекста.
- source_word: אַל תַּרְחִיקוּ מִן הָעִיר מְאֹד
  choice: Не удаляйтесь от города слишком далеко
  rationale: Точно сохраняет отрицательное распоряжение, исходную точку и усиление מְאֹד.
- source_word: וִהְיִיתֶם כֻּלְּכֶם נְכֹנִים
  choice: и будьте все наготове
  rationale: נְכֹנִים здесь означает готовность к действию; «наготове» естественно для военного контекста.
