base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: ru
  text: Когда Иисус Навин и весь Израиль увидели, что засадный отряд захватил город[a] и что поднялся дым города, они повернули обратно и поразили мужчин Гая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «засада захватила город». Еврейское причастие обозначает тех, кто находился в засаде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: увидели
  rationale: Передаёт обычное значение глагола зрения и восприятия; последующие придаточные раскрывают содержание увиденного.
- source_word: כִּי ... וְכִי
  choice: что ... и что
  rationale: Оба союза вводят содержание того, что увидели Иисус Навин и Израиль.
- source_word: לָכַד
  choice: захватил
  rationale: Глагол обозначает взятие или овладение городом; русский совершенный вид естественно показывает, что захват уже состоялся к моменту наблюдения.
- source_word: הָאֹרֵב
  choice: засадный отряд
  rationale: Субстантивированное причастие обозначает людей, находившихся в засаде; коллективное «отряд» естественно в русском военном повествовании.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: над городом поднялся дым
  rationale: Сохраняет образ поднимающегося дыма, но выражает принадлежность дыма городу более естественной русской конструкцией.
- source_word: וַיָּשֻׁבוּ
  choice: они повернули назад
  rationale: В боевом контексте речь идёт о перемене направления и возвращении к противнику.
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: Военный смысл נכה передан сильным, но не более конкретным, чем исходный текст, глаголом.
- source_word: אַנְשֵׁי הָעָי
  choice: мужчин из Гая
  rationale: Сохраняет прямое указание на мужчин и не сужает значение до «воинов», чего само сочетание не требует.
