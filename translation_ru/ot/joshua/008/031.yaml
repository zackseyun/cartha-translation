source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: ru
  text: как повелел Моисей, слуга Яхве, сынам Израиля, — как написано в книге Закона Моисея, — жертвенник из цельных камней[a], над которыми не поднимали железа; и вознесли на нём всесожжения Яхве и принесли мирные жертвы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из необтёсанных камней». Буквально еврейский текст говорит о «цельных камнях», то есть оставленных нетронутыми и не обработанных железом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертвы общения» или «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲש׶ר
  choice: как
  rationale: Передаёт соответствие прежде данному повелению без избыточного усиления.
- source_word: צִוָּה
  choice: повелел
  rationale: Естественный русский глагол для авторитетного предписания; предшествование ясно из контекста.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: Сохраняет почётное обозначение Моисея; «раб» здесь могло бы неоправданно выдвинуть на первый план подневольный статус.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет семейно-корпоративную форму исходного выражения.
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Естественная формула ссылки на авторитетный письменный текст.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: в книге Закона Моисея
  rationale: Сохраняет и понятие книги, и традиционно узнаваемое обозначение Торы как Закона Моисея.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: жертвенник из цельных камней
  rationale: «Цельных» близко передаёт значение камней, оставленных целыми и не обработанных железом.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: которых не касалось железное орудие
  rationale: Естественно передаёт идиому о неприменении железного инструмента к камням, не утверждая буквально, что железо лишь «поднимали» над ними.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: вознесли на нём всесожжения
  rationale: Сохраняет оттенок восхождения и специальный вид полностью сжигаемой жертвы.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: принесли мирные жертвы
  rationale: Устоявшийся русский эквивалент культового термина; прочие смысловые оттенки отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это отличие.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Выбрана формально близкая семейно-корпоративная формулировка без нейтрализации образа.
- issue: Значение שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Традиционный эквивалент сохраняет преемственность терминологии, а сноска показывает более широкий смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прояснён тире вокруг вставной ссылки на книгу Закона; специальная жертвенная терминология сохранена, а неоднозначность שְׁלָמִים вынесена в сноску.
