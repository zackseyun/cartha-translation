revisions:
- from: И всё войско, бывшее с ним, поднялось и приблизилось; они подошли к городу и расположились станом к северу от Гая, так что долина была между ним[a] и Гаем.
  to: И всё войско, бывшее с ним, поднялось и приблизилось; они подошли к городу, расположились станом напротив него, к северу от Гая, а долина была между ним[a] и Гаем.
  rationale: Правка восстанавливает значение נֶגֶד («напротив него») и заменяет невыраженную в оригинале следственную связь нейтральным описанием местности. Сингулярное местоимение и примечание сохранены, чтобы не устранять спорную особенность масоретского текста.
