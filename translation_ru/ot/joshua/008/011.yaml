  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: ru
  text: И всё войско, бывшее с ним, поднялось и приблизилось; они подошли к городу, расположились станом напротив него, к северу от Гая, а долина была между ним[a] и Гаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «между ним и Гаем». Местоимение в единственном числе, вероятнее всего, относится к Иисусу Навину, хотя некоторые понимают выражение собирательно: «между ними и Гаем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: всё войско
  rationale: Буквально — «весь народ войны». Контекст обозначает совокупность участвующих в сражении людей, а «всё войско» естественно передаёт коллективный военный смысл, не добавляя отсутствующего в еврейском тексте указания исключительно на мужчин.
- source_word: אֲשֶׁר אִתּוֹ
  choice: бывшее с ним
  rationale: Относительный оборот указывает на войско, сопровождавшее Иисуса Навина; краткая форма сохраняет связь с предшествующим собирательным существительным.
- source_word: עָלוּ
  choice: поднялось
  rationale: Глагол עלה имеет основное значение движения вверх; перевод сохраняет это направление без излишнего военного уточнения.
- source_word: וַיִּגְּשׁוּ
  choice: приблизилось
  rationale: נגשׁ означает «приблизиться, подойти»; выбран нейтральный современный эквивалент.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: они подошли к городу
  rationale: נֶגֶד указывает на положение перед городом или напротив него. В данном контексте русский оборот естественно выражает прибытие к городу, не подразумевая входа в него.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: חנה обозначает устройство лагеря. Выражение «расположились станом» сохраняет библейское достоинство и остаётся понятным современному читателю.
- source_word: מִצְּפוֹן לָעַי
  choice: к северу от Гая
  rationale: Точно и естественно передаёт местоположение относительно города Гая.
- source_word: הַגַּי
  choice: долина
  rationale: גַּי может обозначать долину или ущелье; «долина» — более широкое значение, не вносящее неподтверждённой топографической конкретизации.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: между ним и Гаем
  rationale: Масоретский текст содержит суффикс третьего лица мужского рода единственного числа. Трудное чтение сохранено, а не заменено коллективным «между ними».
