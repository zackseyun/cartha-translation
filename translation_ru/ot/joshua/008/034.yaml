- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: благословение и проклятие
  rationale: Сингулярные существительные переданы буквально и естественно как обобщённые разделы или категории условий завета.
- source_word: כְּכָל הַכָּתוּב
  choice: в точности так, как написано
  rationale: Передаёт соответствие чтения всему записанному; «в точности» естественно выражает охват כְּכָל.
- source_word: בְּסֵפֶר הַתּוֹרָה
  choice: в книге Закона
  rationale: סֵפֶר здесь означает письменный документ; «книга Закона» — ясное и традиционно узнаваемое обозначение без обязательного указания на физическую форму свитка.
