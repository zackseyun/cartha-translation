base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: ru
  text: 'И было так: когда Иисус Навин и сыны Израиля[a] закончили наносить им чрезвычайно тяжёлый удар, вплоть до полного их истребления, уцелевшие из них уцелели[b] и вошли в укреплённые города,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и уцелевшие из них уцелели»; в еврейском тексте существительное и глагол повторяют один корень для усиления.'
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי
  choice: И было так
  rationale: Традиционная повествовательная формула передана современно и без архаического «и случилось».
- source_word: כְּכַלּוֹת
  choice: когда … закончили
  rationale: Инфинитив с כְּ имеет временное значение и обозначает завершение предшествующего действия.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён образный древнееврейский способ обозначения народа; более естественный вариант «израильтяне» указан в сноске.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: громить их, нанеся им чрезвычайно тяжёлое поражение
  rationale: Сочетание глагола נכה с однокоренным по смыслу существительным מכה описывает сокрушительное военное поражение; формулировка передаёт силу выражения естественно по-русски.
- source_word: עַד תֻּמָּם
  choice: до полного их истребления
  rationale: Выражение указывает на доведение уничтожения до конца. Категоричность сохранена, несмотря на последующее упоминание уцелевших.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: уцелевшие из них
  rationale: В основном тексте тяжеловесный повтор существительного и глагола сглажен, а его буквальная форма отмечена в сноске. מֵהֶם показывает, что уцелевшие принадлежали к разбитому войску.
- source_word: עָרֵי הַמִּבְצָר
  choice: укреплённые города
  rationale: מבצר обозначает укрепление или защищённое место; сочетание «укреплённые города» естественно для военного контекста.
theological_decisions:
- issue: Соотношение полного истребления и упоминания уцелевших
  choice: Сохранить рядом формулировки «до полного их истребления» и «уцелевшие из них»
  alternative: 'Смягчить первую формулировку: «истребив почти всех»'
  rationale: Еврейский текст сам сохраняет это напряжение. Добавление «почти» истолковало бы и согласовало высказывания вместо перевода исходной формулировки.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис сохраняет незавершённость стиха и завершающую запятую, поскольку предложение продолжается в следующем стихе. Архаизмы сведены к узнаваемому библейскому выражению «сыны Израиля», снабжённому пояснением.
