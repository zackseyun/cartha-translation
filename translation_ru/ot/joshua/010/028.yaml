source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: ru
  text: В тот день Иисус Навин взял Маккеду и поразил её остриём меча. Её царя и всех, кто был в ней, он предал уничтожению[a], не оставив никого в живых. С царём Маккеды он поступил так же, как поступил с царём Иерихона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал заклятию». Еврейский глагол означает безвозвратно предназначить кого-либо или что-либо для уничтожения.'
    reason: Лексическая альтернатива и сохранение особого значения еврейского חרם.
lexical_decisions:
- source_word: לָכַד
  choice: взял
  rationale: Обычное русское обозначение захвата города в военном контексте; оно естественнее, чем «захватил», и сохраняет смысл исходного глагола.
- source_word: וַיַּכֶּהָ
  choice: поразил её
  rationale: Сохраняет конкретную силу глагола נכה и не сводит его значение к более истолковывающему «победил».
- source_word: לְפִי חֶרֶב
  choice: остриём меча
  rationale: Передаёт образное еврейское выражение, буквально связанное с «устами/лезвием меча», в понятной и литературной русской форме.
- source_word: הֶחֱרִם
  choice: предал уничтожению
  rationale: Передаёт направленность חרם на уничтожение, но не перегружает основной текст малопонятным для современного читателя словом «заклятие»; особый сакрально-судебный оттенок отмечен в сноске.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: всех, кто был в ней
  rationale: נפש здесь обозначает людей, а не нематериальные души; выбранная формулировка ясна и естественна по-русски.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: не оставив никого в живых
  rationale: Естественно передаёт отсутствие уцелевших, не ослабляя категоричности еврейского выражения.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: С царём Маккеды он поступил так же, как поступил с царём Иерихона
  rationale: Сохраняет краткое повествовательное сравнение и не уточняет сверх текста, что именно было сделано.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: Маккеда / Иерихон / Иисус Навин
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, понятные современному читателю.
theological_decisions:
- issue: Передача חרם в повествовании о завоевании
  choice: предал уничтожению
  alternative: предал заклятию; полностью истребил
  rationale: Глагол обозначает не просто убийство, а безвозвратное предание уничтожению в особом сакрально-судебном контексте. Основной вариант сохраняет результат действия, а сноска сообщает его дополнительный оттенок, не навязывая конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис сделан ясным для обычного читателя; сохранены краткость повествования, образ «острия меча» и напряжённый смысл полного уничтожения.
