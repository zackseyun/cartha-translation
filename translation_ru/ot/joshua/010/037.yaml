base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: ru
  text: Они захватили его и поразили мечом, а также его царя, все его города и всех людей, находившихся в нём. Иисус не оставил никого в живых, так же как поступил с Еглоном. Он предал его уничтожению[a] вместе со всеми людьми, находившимися в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал его заклятию». Еврейский глагол означает предать херему, то есть посвятить уничтожению.'
    reason: Лексическая альтернатива и пояснение специального значения חרם.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: они захватили его
  rationale: Глагол לכד обозначает захват города; местоимение мужского рода согласовано с русским словом «город», подразумеваемым в контексте.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: поразили остриём меча
  rationale: Сохраняется конкретный военный смысл נכה и образность устойчивого еврейского выражения «устами/остриём меча» без архаичного русского оборота.
- source_word: כָּל עָרֶיהָ
  choice: все его города
  rationale: עיר может обозначать город или поселение; «города» ближе к обычному значению слова и передаёт зависимые населённые пункты главного города.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: каждого человека, находившегося в нём
  rationale: נפש здесь означает человека, а не отдельную нематериальную «душу»; перевод ясен современному читателю.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Иисус не оставил никого в живых
  rationale: שָׂרִיד означает уцелевшего. Имя «Иисус» естественно обозначает подразумеваемое подлежащее единственного числа и проясняет переход от множественного числа к единственному.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: как поступил с Еглоном
  rationale: Оборот вводит сопоставление с ранее описанным обращением с Еглоном.
- source_word: וַיַּחֲרֵם אוֹתָהּ
  choice: Он предал город уничтожению
  rationale: חרם в породе хифиль имеет специальный смысл посвящения на уничтожение. Формулировка сохраняет отличие от простого убийства, а дополнение «город» устраняет неестественную для русского языка цепочку местоимений.
theological_decisions:
- issue: Передача חרם в контексте военного суда
  choice: предал город уничтожению
  alternative: наложил на него заклятие; полностью уничтожил его
  rationale: Выбранный вариант передаёт как фактическое уничтожение, так и особый характер действия, не сводя термин лишь к военной победе. Сакрально-правовой оттенок пояснён в сноске без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной повествовательной интонацией. Повтор исходного текста сохранён. Сноска помещена при передаче חרם, к которой она непосредственно относится.
