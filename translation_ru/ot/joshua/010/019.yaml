source:
  edition: WLC
  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: ru
  text: 'А вы не стойте на месте: преследуйте своих врагов и бейте их с тыла[a]. Не дайте им войти в их города, потому что Яхве, ваш Бог, отдал их в ваши руки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нападайте на отставших». Еврейский глагол буквально связан с «хвостом» и означает удар по задней части отступающего войска.'
    reason: Лексическая образность допускает передачу как удара с тыла, так и нападения на тех, кто оказался позади основной части войска.
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Самостоятельное местоимение с союзом подчёркивает смену адресата и контраст с предыдущим действием; по-русски это естественно передаётся сочетанием «А вы».
- source_word: אַל תַּעֲמֹדוּ
  choice: не стойте на месте
  rationale: Глагол буквально означает «стоять», а в данном военном контексте запрещает прекращать преследование. Выражение сохраняет исходный образ и ясно передаёт смысл.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: преследуйте своих врагов
  rationale: Устойчивое сочетание со значением погони; «преследуйте» точно и естественно звучит в военном контексте. Возвратное «своих» нормативно для русского языка при совпадении обладателя с подлежащим.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: и бейте их с тыла
  rationale: Глагол связан со словом «хвост» и обозначает удар по задней части отступающего войска. Перевод сохраняет направление атаки, не вводя более узкого понятия специально организованного арьергарда.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Не дайте им войти
  rationale: Конструкция נתן с инфинитивом выражает разрешение или возможность; русское «не дайте» естественно передаёт запрет позволить им войти.
- source_word: אֶל עָרֵיהֶם
  choice: в свои города
  rationale: עיר означает город или поселение, часто укреплённое. «Свои» естественно указывает на города преследуемых врагов.
- source_word: כִּי נְתָנָם
  choice: потому что … отдал их
  rationale: Перфект представляет передачу врагов во власть Израиля как уже совершившееся действие. «Отдал» сохраняет основное значение נתן и хорошо сочетается с образом рук.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямая передача формы с суффиксом второго лица множественного числа.
- source_word: בְּיֶדְכֶם
  choice: в ваши руки
  rationale: Еврейское единственное число «в вашу руку» является идиомой власти и контроля. Русское множественное число сохраняет тот же образ и звучит естественнее.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» сохраняет личное имя Бога и представляет общепринятую научную реконструкцию его произношения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествовательным регистром. Военная команда передана энергично, без архаизмов; сохранены образ «стоять на месте» и идиома «в ваши руки».
