lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: подошёл к ним
  rationale: Глагол בוא с предлогом אֶל буквально обозначает прибытие или движение к кому-либо. В военном контексте выражение подразумевает внезапное приближение к противнику, но перевод не добавляет прямо не выраженного значения нападения.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Прямо передаёт неожиданность и резкость прибытия.
- source_word: כָּל הַלַּיְלָה
  choice: всю ночь
  rationale: Естественное русское обозначение продолжительности действия.
- source_word: עָלָה
  choice: поднимаясь
  rationale: Сохраняет буквальный смысл движения вверх и одновременно естественно описывает путь войска из Галгала; деепричастие передаёт обстоятельственный характер формы относительно главного глагола.
- source_word: מִן הַגִּלְגָּל
  choice: от Галгала
  rationale: Точно передаёт исходную точку движения; форма «от» естественна при обозначении отправления из местности или от стоянки.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся в русской библейской традиции форма имени, позволяющая отличать этого персонажа от Иисуса Христа.
