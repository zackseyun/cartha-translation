  source_fidelity: 'В целом перевод верно передаёт последовательность действий Яхве, военное значение глаголов и топонимы. Однако повторный глагол וַיַּכֵּם — повествовательная форма совершенного действия — лучше не передавать несовершенным видом «поражал»: тот создаёт оттенок длительности, которого форма сама по себе не выражает. Повтор предлога עַד перед обоими топонимами желательно сохранить.'
  naturalness: «По дороге, ведущей на подъём к Беф-Хорону» несколько тяжеловесно и не вполне естественно по-русски. «По дороге, поднимающейся к Беф-Хорону» передаёт топографическую деталь яснее. Повтор «нанёс им тяжёлое поражение» допустим, но для второго действия естественнее «разил их».
  terminology: «Яхве» корректно передаёт יהוה. «Тяжёлое поражение» — естественная русская передача военного смысла מַכָּה גְדוֹלָה; она не вынуждает выбирать между значениями «удар», «поражение» и «побоище». Формы Гаваон, Беф-Хорон, Азeка и Маккеда согласованы с еврейскими топонимами и современным русским употреблением.
