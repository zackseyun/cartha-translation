base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: ru
  text: И Яхве привёл их в замешательство перед Израилем[a], и нанёс им тяжёлое поражение у Гаваона, и преследовал их по дороге, поднимающейся к Беф-Хорону, и разил их до Азеки и до Маккеды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поверг их в панику». Еврейский глагол означает привести противника в смятение или панику во время боя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: привёл их в замешательство
  rationale: Порода המם обозначает вызванные в бою смятение, замешательство или панику. Перевод сохраняет причиняющее действие Яхве и не сводит значение лишь к итоговому разгрому.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: перед Израилем
  rationale: Сохраняет краткий древнееврейский оборот, допускающий пространственный смысл и смысл действия на глазах у Израиля либо в его пользу.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: нанёс им тяжёлое поражение
  rationale: В военном контексте נכה и מַכָּה обозначают поражение противника, сопровождаемое массовой гибелью. Русское выражение естественно передаёт результат, не превращая существительное в отвлечённый «удар».
- source_word: בְּגִבְעוֹן
  choice: у Гаваона
  rationale: Естественное русское обозначение места сражения; использована традиционная русская форма топонима.
- source_word: וַיִּרְדְּפֵם
  choice: преследовал их
  rationale: Прямое соответствие обычному военному значению רדף.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: по дороге, ведущей на подъём к Беф-Хорону
  rationale: Сохраняет и дорогу, и топографическую деталь подъёма, при этом оставаясь понятным по-русски.
- source_word: וַיַּכֵּם עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: поражал их до Азеки и Маккеды
  rationale: Повторное נכה передано глаголом «поражал», а עַד — как указание на географический предел действия. Несовершенный вид естественно описывает продолжающееся поражение врага в ходе преследования.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Субъект преследования и поражения
  choice: Яхве остаётся грамматическим субъектом всей цепочки действий
  alternative: Израиль преследовал и поражал врагов
  rationale: В древнееврейском тексте после названного субъекта יהוה следуют согласованные глагольные формы без явной смены субъекта; перевод не вводит её предположительно.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксический повтор союза «и» частично сохранён для передачи стремительного ряда древнееврейских действий. Топонимы даны в привычных русских библейских формах.
