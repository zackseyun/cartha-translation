base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: ru
  text: 'Тогда Иисус Навин обратился к Яхве в тот день, когда Яхве предал аморреев сынам Израиля[a], и сказал перед всем Израилем:


    «Солнце, остановись[b] над Гаваоном!

    И луна — в долине Аиалона[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед сынами Израиля». Здесь выражение означает, что Яхве отдал аморреев во власть израильтян.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «замри», «будь неподвижно»; еврейский глагол может обозначать неподвижность, прекращение действия или молчание.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте: «и луна — в долине Аиалона»; повеление «остановись» подразумевается из предыдущей строки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: обратился
  rationale: Порода пиэль глагола דבר означает «говорить». В контексте с לַיהוָה естественное русское «обратился к Яхве» сохраняет направленность речи и отличает этот глагол от последующего וַיֹּאמֶר — «сказал».
- source_word: לַיהוָה
  choice: к Яхве
  rationale: Предлог ל указывает адресата речи. Тетраграмматон передан личным именем «Яхве», а не титулом.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: в тот день, когда Яхве предал
  rationale: Инфинитивная конструкция при בְּיוֹם имеет временное значение; формулировка естественна по-русски и сохраняет указание на конкретный день.
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Форма грамматически единственного числа употреблена собирательно и обозначает народ, поэтому в русском уместно множественное число.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: В сочетании с נתן выражение передаёт вручение противника во власть Израиля. «Сынам Израиля» сохраняет родственную формулу исходного текста; русское управление не требует буквального воспроизведения לִפְנֵי как «перед».
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: и сказал перед всем Израилем
  rationale: Буквально «сказал в глазах Израиля» означает публичное высказывание. «Перед всем Израилем» ясно и естественно передаёт это значение; «всем» эксплицирует коллективный смысл, не меняя референта.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Солнце, остановись
  rationale: דום допускает значения прекращения действия, неподвижности или молчания. В космическом обращении «остановись» естественно передаёт прекращение движения, а неоднозначность отмечена в сноске.
- source_word: בְּגִבְעוֹן
  choice: над Гаваоном
  rationale: Предлог ב допускает пространственные оттенки «в», «у», «над». Для положения небесного светила по отношению к местности русское «над» наиболее естественно, не задавая физического объяснения события.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: И луна — над долиной Аиалон
  rationale: Во второй поэтической строке глагол отсутствует и подразумевается из первой. Тире сохраняет эллипсис, не вставляя глагол непосредственно в основной текст.
- source_word: אַיָּלוֹן
  choice: Аиалон
  rationale: «Аиалон» — традиционная и узнаваемая русская форма данного топонима.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон — личное имя Бога. Передача «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Характер обращения к небесным светилам
  choice: Сохранено прямое поэтическое повеление солнцу и луне
  alternative: Разъяснительный пересказ как просьба Богу остановить светила
  rationale: Текст сначала сообщает об обращении Иисуса Навина к Яхве, а затем приводит публичные слова, грамматически обращённые к солнцу и луне. Перевод не устраняет это напряжение и не предлагает механизма чуда.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Поэтическая речь оформлена отдельными строками. Имя יְהוָה передано как «Яхве»; имя יְהוֹשֻׁעַ — в принятой русской библейской форме «Иисус Навин». Эллипсис второй строки и смысловая широта דום сохранены и пояснены сносками.
