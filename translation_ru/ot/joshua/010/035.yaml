base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: ru
  text: И они взяли его в тот день и поразили его остриём меча[a]. А всех людей, которые были в нём, Иисус в тот день предал заклятию[b] — так же, как он поступил с Лахисом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча»; это еврейское выражение означает поражение мечом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полностью уничтожил». Еврейский глагол означает предать кого-либо или что-либо заклятию, которое в данном контексте предполагало уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: взяли они его
  rationale: Глагол לכד в военном контексте означает взятие города. Местоимение мужского рода соотносится с подразумеваемым городом Еглоном.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача временного оборота, сохраняющая акцент на совершении действия в тот же день.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: поразили остриём меча
  rationale: Сохраняет образ еврейской идиомы «устами/остриём меча» и остаётся понятным в современном литературном русском.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: всех людей, которые были в нём
  rationale: נֶפֶשׁ здесь обозначает людей, находившихся в городе, а не нематериальную душу.
- source_word: הֶחֱרִים
  choice: предал заклятию
  rationale: Глагол חרם в хифиле имеет специальный смысл посвящения под заклятие, в данном контексте влекущего уничтожение; «предал заклятию» сохраняет сакрально-военный оттенок лучше, чем простое «уничтожил».
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: так же, как он поступил с Лахисом
  rationale: Передаёт полное соответствие предыдущему обращению с Лахисом и сохраняет единственное число еврейского עָשָׂה.
theological_decisions:
- issue: Передача חרם в контексте завоевания
  choice: предал заклятию
  alternative: полностью уничтожил
  rationale: Выбранный вариант сохраняет особый сакрально-правовой смысл действия, не сводя его к обычному военному уничтожению; пояснение раскрывает его контекстуальное следствие.
- issue: Передача נֶפֶשׁ применительно к населению города
  choice: людей
  alternative: души
  rationale: В данном контексте слово обозначает живых людей. «Души» могло бы внести не выраженное здесь антропологическое или богословское утверждение.
- issue: Смена множественного числа на единственное в еврейских глаголах
  choice: «они» при взятии города, затем «Иисус/он» при заклятии и сравнении с Лахисом
  alternative: сохранить множественное число во всех частях стиха
  rationale: וַיִּלְכְּדוּ и וַיַּכּוּ стоят во множественном числе, тогда как הֶחֱרִים и עָשָׂה — в третьем лице мужского рода единственного числа. Явное имя «Иисус» естественно обозначает смену грамматического субъекта и не устраняет её.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сделан ясным для обычного читателя; повтор «в тот день» и переход от множественного субъекта к единственному сохранены по еврейскому тексту. Название города передано в традиционной русской форме «Лахис».
