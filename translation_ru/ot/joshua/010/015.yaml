lexical_decisions:
- source_word: וַיָּשָׁב
  choice: И возвратился
  rationale: Форма wayyiqtol от שׁוב продолжает последовательное повествование; «возвратился» естественно передаёт движение обратно к прежнему месту, а союз «и» сохраняет еврейскую повествовательную связь.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся русская библейская форма имени, однозначно обозначающая Иисуса Навина.
- source_word: וְכָל יִשְׂרָאֵל
  choice: и весь Израиль
  rationale: Сохраняет коллективное обозначение исходного текста и не уточняет без достаточных оснований, идёт ли речь обо всём народе или о войске.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Прямое соответствие предлогу עִם с местоименным суффиксом третьего лица мужского рода единственного числа.
- source_word: אֶל הַמַּחֲנֶה
  choice: в стан
  rationale: מַחֲנֶה обозначает лагерь, особенно военный; «стан» здесь кратко и уместно в литературном библейском повествовании.
- source_word: הַגִּלְגָּלָה
  choice: при Галгале
  rationale: Направительный суффикс выражает движение к Галгалу; сочетание «в стан при Галгале» естественно показывает, что Галгал — место расположения стана.
theological_decisions:
- issue: Положение стиха в повествовании и возможное повторение Иисуса Навина 10:43
  choice: Перевести масоретский текст в его нынешнем виде, не опуская и не переставляя стих.
  alternative: Считать сообщение предвосхищающим дальнейшие события либо текстуально перемещённым из-за сходства с Иисуса Навина 10:43.
  rationale: Перевод должен прямо представлять полученный еврейский текст и не разрешать в основном тексте спорный литературно-текстологический вопрос.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Устоявшиеся формы «Иисус Навин» и «Галгал» сохранены; конструкция остаётся простой и близкой к еврейскому повествованию.
