  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: ru
  text: Затем Иисус и весь Израиль вместе с ним двинулись из Маккеды к Ливне и вступили в бой с Ливной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: двинулись
  rationale: В данном описании военного похода глагол עבר обозначает дальнейшее перемещение из одного места в другое; «двинулись» естественно передаёт продолжение пути, не подразумевая переправы.
- source_word: עִמּוֹ
  choice: вместе с ним
  rationale: Предлог с местоименным суффиксом прямо выражает сопровождение Иисуса всем Израилем.
- source_word: מִמַּקֵּדָה
  choice: из Маккеды
  rationale: Предлог מן указывает исходный пункт движения; название места передано в традиционной русской форме.
- source_word: לִבְנָה
  choice: к Ливне
  rationale: В контексте движения название обозначает цель пути; предлог «к» естественен по-русски и не утверждает, что войско вошло в город.
- source_word: וַיִּלָּחֶם
  choice: вступили в бой
  rationale: Глагол לחם в нифале означает сражаться, вести бой; выбранное выражение естественно передаёт начало военного столкновения в последовательном повествовании.
- source_word: עִם לִבְנָה
  choice: с Ливной
  rationale: После глагола со значением борьбы עִם обозначает противника. Русское «вступить в бой с» ясно и идиоматично передаёт эту функцию.
