  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: ru
  text: И они сильно испугались, потому что Гаваон был большим городом, подобным одному из царских городов, и потому что он был больше Гая, а все его мужчины были могучими воинами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучими людьми».'
    reason: Еврейское גִּבֹּרִים может обозначать могучих, сильных людей вообще либо, в данном военном контексте, могучих воинов.
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: они сильно испугались
  rationale: Глагол ירא с усилителем מְאֹד передаёт сильный страх; совершенный вид естественно продолжает русское повествование.
- source_word: עִיר גְּדוֹלָה
  choice: великий город
  rationale: Слово גָּדוֹלָה может указывать как на величину, так и на значение города; «великий» сохраняет обе стороны смысла.
- source_word: גִּבְעוֹן
  choice: Гаваон
  rationale: Использована закрепившаяся в русской библейской традиции форма географического названия.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: подобным одному из царских городов
  rationale: Формулировка естественно передаёт сравнение с городами царского статуса, не сводя выражение лишь к принадлежности определённому царству.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: он был больше Гая
  rationale: В данном сравнении «больше» естественно передаёт превосходство по величине, при этом контекст допускает также представление о большей значимости.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: и все его мужчины
  rationale: В военном контексте אֲנָשִׁים обозначает мужчин города, а не всех его жителей без различия.
- source_word: גִּבֹּרִים
  choice: могучими воинами
  rationale: Гִּבֹּרִים нередко обозначает сильных, доблестных воинов; такой перевод ясно выражает военный оттенок контекста.
