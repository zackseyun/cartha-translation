  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: ru
  text: Иисус Навин, а с ним весь Израиль, поднялся из Еглона к Хеврону, и они вступили в бой против него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «против неё»; местоимение женского рода относится к городу Хеврону.'
    reason: 'Сноска сохраняет грамматическую особенность еврейского текста: город обозначен местоимением женского рода, тогда как в русском переводе употреблён мужской род, согласованный со словом «город».'
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה обозначает движение вверх; форма «поднялся» сохраняет направление и естественно звучит в повествовании.
- source_word: וְכָל יִשְׂרָאֵל
  choice: а с ним и весь Израиль
  rationale: Собирательное обозначение израильского войска сохранено; перестановка вместе с עִמּוֹ делает русскую фразу ясной и естественной.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Местоименный суффикс мужского рода относится к Иисусу Навину.
- source_word: מֵעֶגְלוֹנָה
  choice: из Еглона
  rationale: Предлог מן указывает исходный пункт движения; русское «из» естественно употребляется с названием города.
- source_word: חֶבְרוֹנָה
  choice: к Хеврону
  rationale: Направительный суффикс ה выражает движение к Хеврону; «к» сохраняет направленность, не утверждая отдельно факт входа в город.
- source_word: וַיִּלָּחֲמוּ
  choice: и они сразились
  rationale: Nifal глагола לחם здесь означает вступление в сражение; «сразились» уместно в современном литературном военном повествовании.
- source_word: עָלֶיהָ
  choice: с ним
  rationale: Предлог על имеет в данном контексте значение «против», а суффикс женского рода относится к городу Хеврону; в русском слово «город» мужского рода, поэтому употреблено «с ним» после глагола «сразились».
