base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: ru
  text: «Поднимитесь ко мне и помогите мне; давайте нападём на Гаваон, потому что он заключил мир[a] с Иисусом Навином и сынами Израиля[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключил союз с». Еврейский глагол может обозначать установление мирных отношений или договорного мира.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израильтянами» или «народом Израиля». Буквально: «сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: Поднимитесь ко мне
  rationale: Множественное повелительное наклонение глагола עלה сохраняет идею движения вверх, а אֵלַי — направленность к говорящему.
- source_word: וְעִזְרֻנִי
  choice: и помогите мне
  rationale: Прямая и естественная передача повелительной формы множественного числа с объектным суффиксом первого лица.
- source_word: וְנַכֶּה
  choice: нападём
  rationale: Форма первого лица множественного числа выражает побуждение к совместному военному действию. «Нападём» естественно передаёт контекстуальный смысл נכה; более буквальное «поразим» возможно, но менее естественно применительно к городу.
- source_word: אֶת גִּבְעוֹן
  choice: на Гаваон
  rationale: Название города передано в принятой русской библейской форме; предлог «на» обусловлен глаголом «нападём».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину призыва и ясно передаётся современным русским причинным оборотом.
- source_word: הִשְׁלִימָה
  choice: заключил мир
  rationale: В дипломатическом контексте Hiphil от שלם обозначает установление мирных, вероятно договорных, отношений. Формулировка не сужает смысл до формального союза.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: с Иисусом Навином и сынами Израиля
  rationale: Идиоматическое управление при הִשְׁלִימָה требует русского «с». «Сыны Израиля» сохраняет образ исходного выражения, оставаясь узнаваемым в литературном библейском регистре.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формулировка сохраняет родственный образ еврейского выражения и его корпоративное обозначение народа, не вводя дополнительного толкования.
- issue: Характер мира, выраженный הִשְׁלִימָה
  choice: заключил мир
  alternative: заключил союз; покорился
  rationale: Исходный глагол допускает договорно-политический оттенок, но сам по себе не требует ни более узкого «союза», ни более сильного «покорился».
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Императивная речь сохранена прямой и энергичной; традиционные имена «Гаваон» и «Иисус Навин» обеспечивают узнаваемость.
