translation_notes:
  register: Современный литературный русский язык, ясный повествовательный стиль и прямой повелительный тон. Образное еврейское выражение «уста пещеры» передано обычным русским «вход в пещеру»; смысловой неоднозначности или богословского напряжения в стихе нет.
