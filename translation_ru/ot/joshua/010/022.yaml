  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: ru
  text: 'Тогда Иисус Навин сказал: «Откройте вход в пещеру и выведите ко мне из неё этих пятерых царей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт очередность событий.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Традиционная и однозначно узнаваемая русская форма имени библейского персонажа.
- source_word: פִּתְחוּ
  choice: Откройте
  rationale: Форма множественного числа повелительного наклонения; прямое и естественное соответствие.
- source_word: פִּי הַמְּעָרָה
  choice: вход в пещеру
  rationale: Буквально «уста пещеры», но в современном русском это естественно означает её вход; буквальная калька звучала бы неясно и неестественно.
- source_word: וְהוֹצִיאוּ
  choice: и выведите
  rationale: Каузативная форма глагола יצא означает заставить выйти, вывести; речь идёт о людях, поэтому «выведите» точно и естественно.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица обозначает движение по направлению к говорящему.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: этих пятерых царей
  rationale: Указательное הָאֵלֶּה непосредственно соответствует «эти»; одушевлённая собирательно-числовая форма «пятерых» естественна в винительном падеже.
- source_word: מִן הַמְּעָרָה
  choice: из неё
  rationale: Предлог מִן выражает движение изнутри; местоимение устраняет тяжеловесное повторение слова «пещера», не теряя референта.
