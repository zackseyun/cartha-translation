  source_fidelity: Русский текст точно передаёт оба повеления во множественном числе, направление «ко мне», указательное «этих» и извлечение царей из пещеры. «Вход в пещеру» — естественная современная передача еврейского образного выражения «уста пещеры» без смысловой потери.
