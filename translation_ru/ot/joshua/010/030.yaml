  terminology: '«Господь», «отдал в руки Израиля», «остриём меча», «никого в живых» и «царь Иерихона» уместны. «Иисус» корректен в книжном контексте как Иисус Навин; это эксплицирует подразумеваемого повествовательного субъекта, не меняя события. Примечание верно поясняет, что נֶפֶשׁ здесь обозначает человека, но буквальная форма должна быть согласована с формой исходного существительного: «всякую душу».'
