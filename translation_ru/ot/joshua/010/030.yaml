  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: ru
  text: И отдал Господь также этот город и его царя в руки Израиля. Иисус поразил остриём меча город и всех людей, которые были в нём[a]. Он не оставил в нём никого в живых, а с его царём поступил так же, как поступил с царём Иерихона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякую душу, которая была в нём»; здесь «душа» означает человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском употреблении передаёт тетраграмматон естественно и достойно; выбор не вносит спорной реконструкции произношения имени.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: отдал ... в руки Израиля
  rationale: Сохраняет еврейский образ передачи во власть и при этом звучит естественно по-русски.
- source_word: גַּם
  choice: также
  rationale: Обозначает продолжение ряда завоеваний, связывая стих с предыдущим повествованием.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: этот город и его царя
  rationale: Женское местоимение относится к ранее названной Ливне; явное «город» устраняет неестественную для русского языка неопределённость без добавления нового смысла.
- source_word: וַיַּכֶּהָ
  choice: поразил ... город
  rationale: «Поразил» сохраняет широкий смысл נכה и традиционно, но понятно передаёт военное действие.
- source_word: לְפִי חֶרֶב
  choice: остриём меча
  rationale: Передаёт устойчивый еврейский образ «устами/лезвием меча» в понятной русской форме.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: всех людей, которые были в нём
  rationale: נפש здесь означает живых людей, а не утверждение о нематериальной душе; множественная форма естественно выражает собирательное значение.
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: не оставил ... никого в живых
  rationale: Естественная русская передача смысла «не оставил уцелевшего».
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: с его царём поступил так же, как поступил с царём Иерихона
  rationale: Сохраняет сравнительную конструкцию и повтор глагола עשה в естественной русской формулировке.
theological_decisions:
- issue: Значение נֶפֶשׁ в повествовании о войне
  choice: всех людей
  alternative: всякую душу
  rationale: В данном контексте слово обозначает людей, находившихся в городе, и не формулирует учение о природе души.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует укоренившейся русской библейской традиции и сохраняет благоговейный литературный регистр, не делая спорную вокализацию частью основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис умеренно сохраняет последовательность еврейских предложений; местоименный объект уточнён словом «город» ради ясности. Имя Иисус определяется контекстом книги как Иисус Навин.
