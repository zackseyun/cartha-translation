source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: ru
  text: 'Когда этих царей вывели к Иисусу Навину, Иисус Навин созвал всех мужчин Израиля[a] и сказал начальникам воинов[b], выступившим вместе с ним: «Подойдите и поставьте ноги на шеи этих царей». Они подошли и поставили ноги на их шеи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждого мужчину Израиля»; в данном военном контексте имеются в виду мужчины, собравшиеся при войске.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «военачальникам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Когда … вывели
  rationale: Конструкция וַיְהִי с כְּ и инфинитивом образует временную придаточную конструкцию. Русское «Когда … вывели» естественно передаёт последовательность событий без тяжеловесного «И было, когда».
- source_word: וַיִּקְרָא ... אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: Иисус Навин созвал всех мужчин Израиля
  rationale: Кָּל אִישׁ יִשְׂרָאֵל буквально означает «каждого мужчину Израиля». В данном военном контексте множественное «всех мужчин Израиля» сохраняет мужской референт и звучит понятнее, чем архаичное «всех мужей Израиля».
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: начальникам воинов
  rationale: קְצִינֵי обозначает начальников или предводителей, а אַנְשֵׁי הַמִּלְחָמָה — людей войны, то есть воинов. Выражение сохраняет структуру и военный смысл оригинала, оставаясь естественным по-русски.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: ходившим с ним
  rationale: Определительная форма характеризует этих начальников как сопровождавших Иисуса Навина в походе. «Ходившим с ним» сохраняет повторяющийся или походный оттенок глагола הלך и не уточняет сверх текста продолжительность сопровождения.
- source_word: קִרְבוּ
  choice: Подойдите
  rationale: Императив выражает требование физически приблизиться. «Подойдите» — прямой и современный русский эквивалент.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: поставьте ноги на шеи
  rationale: Перевод сохраняет конкретный жест подчинения и не смягчает его образностью или пересказом.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Они подошли и поставили
  rationale: Два последовательных глагола повествования переданы простыми формами прошедшего времени, отражающими немедленное исполнение приказа.
theological_decisions:
- issue: Гендерно маркированное выражение כָּל אִישׁ יִשְׂרָאֵל
  choice: всех мужчин Израиля
  alternative: всех израильтян / весь Израиль
  rationale: В военной сцене мужская форма имеет контекстуальное значение. Перевод не нейтрализует её, но сноска поясняет, что речь идёт о собравшихся при войске людях, а не обязательно обо всём мужском населении страны.
- issue: Жест военного господства
  choice: поставьте ноги на шеи этих царей
  alternative: покажите своё превосходство над этими царями
  rationale: Оригинал описывает конкретное телесное действие, одновременно имеющее символический смысл. Перевод сохраняет его резкость и не заменяет толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Имя יְהוֹשֻׁעַ передано в принятой русской библейской форме «Иисус Навин». Конкретность военной сцены сохранена без архаизации и смягчения.
