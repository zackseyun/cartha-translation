base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: ru
  text: И поразил их Иисус от Кадес-Варни до Газы[a], и всю землю Гошен — до Гаваона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгромил их». Еврейский глагол может обозначать нанесение удара или военное поражение, не всегда уточняя его точный характер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: поразил их
  rationale: Форма глагола נכה с суффиксом 3-го лица множественного числа обозначает нанесение военного поражения, не уточняя непременно, что все были убиты; «поразил их» сохраняет конкретность и широту исходного выражения.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: от Кадес-Варни
  rationale: Топоним обозначает южную границу описываемого похода; форма «Кадес-Варни» соответствует укоренившейся русской библейской передаче названия.
- source_word: וְעַד עַזָּה
  choice: до Газы
  rationale: Предлог עַד указывает на предел территориального охвата; русское «до» естественно передаёт это значение.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: и всю землю Гошен
  rationale: Показатель прямого дополнения אֵת вводит ещё одну область, охваченную действиями Иисуса; конструкция передана близко к форме еврейского текста.
- source_word: וְעַד גִּבְעוֹן
  choice: до Гаваона
  rationale: עַד вновь обозначает географический предел; «до Гаваона» сохраняет параллелизм границ в стихе.
