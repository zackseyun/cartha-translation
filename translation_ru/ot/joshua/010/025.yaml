  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: ru
  text: 'И сказал им Иисус Навин: «Не бойтесь и не падайте духом[a]. Будьте сильны и мужественны, потому что так поступит Яхве со всеми вашими врагами, с которыми вы сражаетесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ужасайтесь»; буквальный образ может подразумевать: «не будьте сломлены».'
    reason: Глагол חתת допускает оттенки ужаса, смятения и внутренней сломленности, которые невозможно полностью совместить в одном кратком русском выражении.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: И сказал им Иисус Навин
  rationale: Вав с последовательным имперфектом продолжает повествование; русский союз «и» естественно передает эту связь. Имя יְהוֹשֻׁעַ дано в принятой русской библейской форме «Иисус Навин».
- source_word: אַל תִּירְאוּ
  choice: Не бойтесь
  rationale: Прямо и естественно передает запретительную форму глагола ירא во множественном числе.
- source_word: וְאַל תֵּחָתּוּ
  choice: и не падайте духом
  rationale: Nifal глагола חתת обозначает состояние внутренней сломленности, смятения или ужаса. Выражение «не падайте духом» понятно современному читателю и не дублирует полностью предыдущее «не бойтесь».
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Будьте тверды и мужественны
  rationale: 'Сохраняет два элемента устойчивой формулы: внутреннюю стойкость и смелую решимость. Формулировка звучит естественно и достойно по-русски.'
- source_word: כִּי כָכָה
  choice: потому что так
  rationale: כִּי вводит основание увещания, а כָכָה указывает на только что показанный способ действия; «потому что так» сохраняет обе функции без тяжеловесности.
- source_word: יַעֲשֶׂה יְהוָה
  choice: поступит Яхве
  rationale: Имперфект имеет здесь будущее значение. «Так поступит» естественно передает עשה в сочетании с указательным כָכָה.
- source_word: לְכָל אֹיְבֵיכֶם
  choice: со всеми вашими врагами
  rationale: После русского «поступить» управление с предлогом «с» естественно выражает тех, по отношению к кому будет совершено действие.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: с которыми вы сражаетесь
  rationale: Сглаживает обычную для древнееврейского языка конструкцию с возобновляющим местоимением и точно передает продолжающуюся борьбу против этих врагов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное covenantное имя Бога, тетраграмматон. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Устойчивые библейские формулы переданы без архаизмов; различие между страхом, упадком духа, твердостью и мужеством сохранено.
