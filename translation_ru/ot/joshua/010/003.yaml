base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: ru
  text: 'И Адони-Цедек, царь Иерусалима, послал к Гогаму, царю Хеврона, к Пираму, царю Иармута, к Иафии, царю Лахиша, и к Девиру, царю Эглона, со словами:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Форма wayyiqtol продвигает повествование; союз «и» естественно связывает стих с предшествующим контекстом и сохраняет форму еврейского текста.
- source_word: אֲדֹנִי צֶדֶק
  choice: Адони-Цедек
  rationale: Личное имя передано транслитерацией; дефис отражает составной характер имени.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: царь Иерусалима
  rationale: Сопряжённое сочетание передано обычной русской конструкцией с родительным падежом; использовано традиционное русское название города.
- source_word: הוֹהָם
  choice: Гогам
  rationale: Имя транслитерировано с учётом традиционной русской библейской передачи начального ה как «г» в данном имени.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Использована устоявшаяся русская форма географического названия.
- source_word: פִּרְאָם
  choice: Пирам
  rationale: Личное имя передано близкой транслитерацией еврейской формы.
- source_word: יַרְמוּת
  choice: Иармут
  rationale: Географическое название передано традиционной русской библейской формой.
- source_word: יָפִיעַ
  choice: Иафия
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: לָכִישׁ
  choice: Лахиш
  rationale: Использована устоявшаяся современная русская форма названия города.
- source_word: דְּבִיר
  choice: Девир
  rationale: Контекст указывает на личное имя царя, а не на нарицательное значение слова; имя транслитерировано.
- source_word: עֶגְלוֹן
  choice: Эглон
  rationale: Название города передано распространённой русской библейской формой.
- source_word: לֵאמֹר
  choice: 'сказать:'
  rationale: Формула вводит содержание послания, продолжающееся в следующем стихе; двоеточие естественно передаёт эту функцию по-русски.
