base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: ru
  text: После этого Иисус Навин поразил их, предал их смерти и повесил их[a] на пяти деревьях; они оставались висеть на деревьях до вечера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвесил их». Еврейский глагол обозначает подвешивание тел на дереве или деревянной конструкции; перевод «посадил на кол» возможен, но менее достоверен.'
    reason: Лексическая альтернатива для תלה; сноска перенесена к слову «повесил», которое она поясняет, без уточнения способа сверх текста.
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: поразил их
  rationale: Глагол נכה в породе хифиль с суффиксом 3-го лица множественного числа обозначает нанесение удара или поражение. «Поразил их» сохраняет действие отдельно от следующего וַיְמִיתֵם и звучит естественно в повествовании.
- source_word: אַחֲרֵי כֵן
  choice: После этого
  rationale: Обычное временное выражение, последовательно связывающее события.
- source_word: וַיְמִיתֵם
  choice: предал смерти
  rationale: Хифиль от מות имеет каузативное значение. «Предал смерти» передаёт официальный характер казни и не сливается по смыслу с предшествующим «поразил».
- source_word: וַיִּתְלֵם
  choice: повесил их
  rationale: תלה обозначает подвешивание человека или тела на дереве либо деревянном сооружении для публичного выставления. «Повесил» не уточняет способ казни сверх того, что сообщает текст.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: на пяти деревьях
  rationale: עֵץ прежде всего означает «дерево» или «древесина». Контекст не требует более конкретного обозначения столбов или виселиц.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: оставались висеть
  rationale: Сочетание היה с пассивным причастием выражает продолжающееся состояние; «оставались висеть» ясно передаёт длительность.
- source_word: עַד הָעָרֶב
  choice: до вечера
  rationale: Точное и естественное обозначение конечного момента; перевод «до заката» был бы более конкретным, чем еврейский текст.
theological_decisions:
- issue: Значение עֵץ в контексте казни и публичного выставления тел
  choice: деревья
  alternative: деревянные столбы; виселицы
  rationale: Еврейское слово прямо допускает значение «дерево», а повествование не определяет особое устройство. Такой перевод не привносит более поздние или конфессионально окрашенные образы.
- issue: Соотношение смерти и последующего повешения
  choice: 'сохранена последовательность: сначала предал смерти, затем повесил'
  alternative: понимать повешение как способ умерщвления
  rationale: В тексте וַיְמִיתֵם стоит перед וַיִּתְלֵם, поэтому наиболее прямое чтение описывает выставление уже умерших тел. Сноска отмечает допустимую лексическую альтернативу, не перестраивая последовательность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «Иисус Навин» употреблена для привычной русской идентификации персонажа; синтаксис слегка разделён на два предложения ради ясности, при сохранении последовательности еврейских форм.
