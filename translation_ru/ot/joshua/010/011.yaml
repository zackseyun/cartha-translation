source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: ru
  text: Когда они бежали от Израиля[a] и находились на спуске Бет-Хорона, Яхве бросил на них с неба большие камни — вплоть до самой Азеки, — и они погибли. От градин погибло больше людей, чем сыны Израиля убили мечом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть от израильтян.
    reason: Поясняет собирательное употребление имени «Израиль» в значении израильского войска или народа.
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: когда они бежали от Израиля
  rationale: Инфинитивная конструкция с בְּ передаёт одновременное обстоятельство времени, а מִפְּנֵי в военном контексте — бегство от наступающего противника. Сохранено собирательное имя «Израиль»; смысл пояснён в сноске.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: на спуске от Бет-Хорона
  rationale: מוֹרָד обозначает спуск или нисходящий склон. Формулировка сохраняет топографическую конкретность и естественно звучит по-русски.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном יהוה.
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: бросил на них
  rationale: Глагол означает «бросать, метать». Выбрано прямое соответствие без добавления отсутствующего в самом глаголе наречия направления.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: большие камни
  rationale: Первое обозначение передано буквально и обобщённо, чтобы сохранить последующее уточнение, что это были камни града.
- source_word: מִן הַשָּׁמַיִם
  choice: с неба
  rationale: Естественное русское обозначение исходящей сверху небесной силы, сохраняющее и пространственный, и богословский оттенок.
- source_word: עַד עֲזֵקָה
  choice: вплоть до самой Азеки
  rationale: עַד указывает на пространственный предел происходящего вдоль пути бегства.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: от камней града
  rationale: Более формальное выражение, чем «градины», сохраняет лексическую связь с ранее названными «большими камнями» и последовательность описания в еврейском тексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранена традиционная этнонимическая форма исходного текста; в современном русском она остаётся понятной и уместной в торжественном повествовательном регистре.
- source_word: בֶּחָרֶב
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное значение предлога בְּ; единственное число сохраняет собирательное обозначение оружия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Природа небесных камней
  choice: Сначала «большие камни», затем «камни града»
  alternative: Сразу назвать их крупными градинами
  rationale: 'Так сохраняется последовательность еврейского повествования: сначала предметы описаны как камни с неба, а затем уточнены как камни града. Перевод не устраняет эту смысловую динамику.'
- issue: Сравнение числа погибших
  choice: «погибло больше людей, чем сыны Израиля убили мечом»
  alternative: «многие умерли от камней града, больше тех, кого сыны Израиля убили мечом»
  rationale: Русская формулировка ясно передаёт сравнительную конструкцию רַבִּים ... מֵאֲשֶׁר, не приписывая тексту точного числа и сохраняя противопоставление Божьего действия человеческому.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён для ясности, но сохранены топографические детали, личное имя Яхве и последовательное описание небесных камней. Все сноски отмечены в основном тексте.
