base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: ru
  text: 'И люди из Гаваона послали к Иисусу Навину в стан в Галгале сказать: «Не оставляй твоих слуг без поддержки[a]. Скорее поднимись к нам, спаси нас и помоги нам, потому что все цари амореев, живущие в нагорье, собрались против нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Не ослабляй руки твоей от твоих слуг». Это еврейская идиома со значением «не переставай поддерживать нас» или «не бросай нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: послали
  rationale: Обычный повествовательный глагол от שלח, обозначающий отправку вестников или сообщения и продолжающий последовательность событий.
- source_word: אַנְשֵׁי גִבְעוֹן
  choice: люди из Гаваона
  rationale: Передаёт мужскую форму אַנְשֵׁי без архаичного для современного русского оборота «мужи Гаваона»; в контексте речь, вероятно, идёт о представителях города.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: к Иисусу Навину, в стан при Галгале
  rationale: Повтор אֶל отмечает адресата и место назначения; русская формулировка сохраняет оба элемента. Традиционная русская форма имени уточняет, что речь об Иисусе Навине.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Естественно вводит прямую речь после глагола «послали» и сохраняет структуру еврейского текста.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Не оставляй рабов твоих без поддержки
  rationale: Еврейская идиома буквально говорит об ослаблении или отведении руки; смысл — не прекращать поддержку и не бросать просителей. Образ руки отмечен в сноске, поскольку буквальный русский оборот был бы неестественным и неясным.
- source_word: עֲבָדֶיךָ
  choice: рабов твоих
  rationale: Здесь עבד служит почтительным политико-договорным самоназванием перед Иисусом Навином; «рабы» сохраняет выраженную зависимость и принятую библейскую образность.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Скорее поднимись к нам
  rationale: עלה обозначает подъём из Галгала в нагорье, а מְהֵרָה выражает срочность. Порядок слов звучит естественно по-русски.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: спаси нас и помоги нам
  rationale: 'Сохраняет два отдельных призыва: избавить от военной опасности и оказать помощь, не сводя их к одному понятию.'
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: потому что ... собрались против нас
  rationale: В данном враждебном контексте אֶל выражает направленность действий против гаваонитян, а не просто приближение к ним.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: все цари амореев, живущие в нагорье
  rationale: Передаёт принадлежность царей к аморейской группе и определение יֹשְׁבֵי הָהָר как обитателей горной области.
