base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: ru
  text: Когда солнце стало заходить[a], Иисус Навин приказал; их сняли с деревьев и бросили в пещеру, где они скрывались[b], а у входа в пещеру положили большие камни, которые остаются там по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «На закате».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «где они скрывались там»; слово «там» в еврейском тексте выражено явно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: Когда солнце стало заходить
  rationale: Передаёт временное значение и образ буквального «вхождения» солнца естественным современным русским выражением; более сжатый вариант отмечен в сноске.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: Иисус Навин приказал
  rationale: Прямо передаёт значение глагола «приказывать»; традиционная русская форма имени однозначно обозначает Иисуса Навина.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: снять их с деревьев; их сняли
  rationale: Русское «снять с деревьев» естественно описывает удаление повешенных тел и сохраняет направленность действия вниз.
- source_word: וַיַּשְׁלִכֻם
  choice: бросили их
  rationale: Прямой и выразительный современный эквивалент глагола со значением «бросать».
- source_word: אֶל הַמְּעָרָה
  choice: в ту пещеру
  rationale: Указательное «ту» естественно связывает пещеру с уже известным местом укрытия царей.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: где они прежде укрылись
  rationale: «Где» в русском уже включает локальное значение שָׁם, поэтому отдельное «там» создало бы неестественную тавтологию; «прежде» ясно обозначает предшествующее действие.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: положили большие камни
  rationale: Ясно передаёт размещение крупных камней для закрытия пещеры без архаизации.
- source_word: עַל פִּי הַמְּעָרָה
  choice: ко входу в пещеру
  rationale: Функционально и естественно передаёт идиому «уста пещеры»; буквальный образ приведён в сноске.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: и по сей день
  rationale: Устойчивое русское выражение передаёт продолжающееся состояние и усилительный оттенок исходной идиомы.
