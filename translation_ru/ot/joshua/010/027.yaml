revisions:
- from: Когда солнце стало заходить[a], Иисус Навин приказал снять их с деревьев. Их сняли и бросили в ту пещеру, где они прежде укрылись[b], а ко входу в пещеру положили большие камни, которые лежат там и по сей день.
  to: Когда солнце стало заходить[a], Иисус Навин приказал; их сняли с деревьев и бросили в пещеру, где они скрывались[b], а у входа в пещеру положили большие камни, которые остаются там по сей день.
  rationale: Исправлена последовательность приказа и последовавших действий без повторения «снять». Заключительный оборот передан естественной русской конструкцией, которая ясно связывает «по сей день» с камнями и их продолжающимся нахождением у входа, сохраняя смысл еврейской формулы. Сноска b удерживает явное наречие «там» исходного текста, хотя его отдельное воспроизведение в основном русском тексте было бы неестественной тавтологией.
