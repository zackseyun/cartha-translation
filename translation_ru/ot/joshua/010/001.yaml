source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: ru
  text: И когда Адони-Цедек, царь Иерусалима, услышал, что Иисус Навин захватил Гай и предал его заклятию[a], поступив с Гаем и его царём так же, как поступил с Иерихоном и его царём, и что жители Гаваона заключили мир[b] с Израилем и находятся среди израильтян,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью уничтожил его». Еврейский глагол חרם означает предать что-либо заклятию, предназначив уничтожению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заключили мирный договор».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: И когда ... услышал
  rationale: Сочетание וַיְהִי с временной конструкцией כִשְׁמֹעַ вводит новую сцену и образует придаточную часть, продолжение которой следует в ст. 2. «И когда ... услышал» естественно передаёт повествовательную связь и сохраняет синтаксическую незавершённость стиха.
- source_word: אֲדֹנִי צֶדֶק
  choice: Адони-Цедек
  rationale: Составное личное имя передано транслитерацией с дефисом, отражающим его структуру.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: царь Иерусалима
  rationale: Обычная русская передача титула и традиционная форма топонима.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская форма имени предводителя Израиля; добавление «Навин» служит общепринятым различением и не меняет референта.
- source_word: לָכַד אֶת הָעַי
  choice: захватил Гай
  rationale: לכד обозначает военный захват города; «Гай» — традиционная русская форма названия הָעַי.
- source_word: וַיַּחֲרִימָהּ
  choice: предал его уничтожению как заклятое
  rationale: 'Формулировка сохраняет как фактическое уничтожение, так и особый сакрально-судебный смысл חרם: объект отделяется как заклятый и предназначенный уничтожению.'
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: так же, как
  rationale: Естественная русская сравнительная конструкция сохраняет подчёркнутую параллель между участью Иерихона и Гая.
- source_word: עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ ... עָשָׂה לָעַי וּלְמַלְכָּהּ
  choice: поступив с Гаем и его царём так же, как поступил с Иерихоном и его царём
  rationale: Глагол עשה с ל передан как «поступить с»; повтор «поступил» сохраняет риторический параллелизм оригинала.
- source_word: הִשְׁלִימוּ ... אֶת יִשְׂרָאֵל
  choice: заключили мир с Израилем
  rationale: Hiphil שלם здесь означает установление мирных отношений или заключение мирного соглашения.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: жители Гаваона
  rationale: Субстантивированное причастие обозначает население города; «Гаваон» — традиционная русская форма топонима.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: и теперь находятся среди израильтян
  rationale: בקרבם означает пребывание среди них. Явное «израильтян» устраняет неестественную для русского местоименную двусмысленность, а «теперь» передаёт возникшее вследствие договора новое положение, не вводя отдельного временного утверждения.
theological_decisions:
- issue: Передача חרם в повествовании о завоевании
  choice: предал его уничтожению как заклятое
  alternative: полностью уничтожил его; предал его заклятию
  rationale: Одно лишь «уничтожил» теряет культово-судебный оттенок, а одно лишь «предал заклятию» для современного читателя может быть неясным. Выбранная формулировка удерживает оба аспекта и не объясняет богословский смысл сверх того, что выражено лексемой.
translation_notes:
  register: 'Современный литературный русский язык с традиционными русскими формами библейских имён и топонимов. Стих намеренно заканчивается запятой: временная конструкция получает главное предложение в следующем стихе. Маркеры сносок поставлены непосредственно после выражений, к которым относятся.'
