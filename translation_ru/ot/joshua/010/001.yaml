  naturalness: '«Предал его уничтожению как заклятое» звучит по-русски неестественно: субстантивированное «заклятое» не имеет ясной опоры. «Предал его заклятию» — традиционная и понятная в библейском регистре передача; сноска поясняет, что это подразумевает уничтожение. «Находятся среди израильтян» естественно передаёт финальную конструкцию без добавления «теперь».'
