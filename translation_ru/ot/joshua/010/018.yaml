  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: ru
  text: 'Иисус Навин сказал: «Привалите большие камни ко входу в пещеру и поставьте там людей сторожить их[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте — «сторожить их»: местоимение стоит во множественном числе и, вероятно, относится к царям, запертым в пещере.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; в русском связка «и» здесь необязательна и без неё рассказ звучит естественно.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Употреблена традиционная и общеупотребительная русская форма библейского имени, позволяющая отличить этого героя от Иисуса Христа.
- source_word: גֹּלּוּ
  choice: привалите
  rationale: Императив множественного числа от גלל обозначает перекатывание камней; «привалите ... ко входу» естественно передаёт действие заграждения пещеры камнями.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: большие камни
  rationale: Прямо и естественно передаёт размер камней.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: ко входу в пещеру
  rationale: Буквально «к устам пещеры»; русский идиоматический эквивалент «ко входу в пещеру» ясно передаёт пространственное значение без неестественной кальки.
- source_word: וְהַפְקִידוּ עָלֶיהָ אֲנָשִׁים
  choice: и поставьте там людей
  rationale: Каузатив פקד означает назначить или поставить для исполнения задачи; «там» естественно обозначает место у пещеры, выраженное עָלֶיהָ.
- source_word: לְשָׁמְרָם
  choice: сторожить их
  rationale: Местоименный суффикс имеет мужской род и множественное число и наиболее вероятно относится к пяти царям, находящимся в пещере, а не к пещере женского рода в единственном числе.
