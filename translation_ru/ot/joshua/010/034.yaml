  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: ru
  text: Иисус Навин и весь Израиль с ним двинулись от Лахиса к Эглону, разбили лагерь против него и сражались против него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: двинулись
  rationale: В контексте последовательного военного продвижения глагол עבר обозначает переход от одного города к другому; «двинулись» естественно передаёт движение, не добавляя отсутствующей в тексте идеи пересечения преграды.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: и весь Израиль с ним
  rationale: Сохранено собирательное обозначение Израиля и простое комитативное выражение, указывающее, что народ сопровождал Иисуса Навина.
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: от Лахиса к Эглону
  rationale: Предлог מִן обозначает исходный пункт, а направительный суффикс -ה при עֶגְלוֹן — движение к месту назначения.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: расположились станом против него
  rationale: חנה — обычный глагол расположения лагерем, а עַל в осадном контексте передаёт враждебное расположение против города.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: вступили с ним в бой
  rationale: Форма от לחם обозначает ведение боя; русское выражение естественно передаёт начало военных действий против Эглона.
