base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: ru
  text: 'Они так и сделали: вывели к нему из пещеры этих пятерых царей — царя Иерусалима, царя Хеврона, царя Иармута, царя Лахиса и царя Еглона.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Они так и сделали
  rationale: Естественная русская передача повествовательной формулы, обозначающей исполнение предыдущего повеления.
- source_word: וַיֹּצִיאוּ
  choice: вывели
  rationale: Каузативная форма глагола יצא означает «заставить выйти, вывести»; в данном контексте речь идёт о людях, которых вывели из пещеры.
- source_word: אֵלָיו
  choice: к нему
  rationale: Прямо передаёт предлог אֶל с местоименным суффиксом, не добавляя отсутствующего в тексте уточнения «к Иисусу Навину» или «пред него».
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: этих пятерых царей
  rationale: Сочетание «пятерых» естественно в современном русском при обозначении группы лиц и точно передаёт числительное с существительным и указательным словом.
- source_word: מִן הַמְּעָרָה
  choice: из пещеры
  rationale: Точная и естественная передача исходного пространственного значения.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Стандартный точный эквивалент названия правителя в данном древневосточном контексте.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма топонима.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Устоявшаяся русская библейская форма топонима.
- source_word: יַרְמוּת
  choice: Иармут
  rationale: Устоявшаяся русская библейская передача топонима.
- source_word: לָכִישׁ
  choice: Лахис
  rationale: Устоявшаяся русская библейская форма топонима.
- source_word: עֶגְלוֹן
  choice: Еглон
  rationale: Устоявшаяся русская библейская форма; здесь это название города.
