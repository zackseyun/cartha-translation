translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие и тире ясно вводят перечень, не меняя смысловой структуры древнееврейского текста. Местоимение «к нему» сохраняет анафорическую отсылку оригинала без поясняющего добавления имени.
