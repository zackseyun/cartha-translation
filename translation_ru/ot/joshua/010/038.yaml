lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулись
  rationale: Глагол שׁוב в повествовательной форме здесь обозначает возвращение или движение обратно. Множественное число естественно в русском языке при составном подлежащем «Иисус Навин и весь Израиль».
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, позволяющая отличить этого персонажа от других носителей имени Иисус.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: и весь Израиль с ним
  rationale: Сохранены собирательное выражение «весь Израиль» и явно выраженное עִמּוֹ «с ним»; речь в контексте идёт о сопровождавшем Иисуса Навина народе или войске.
- source_word: דְּבִרָה
  choice: к Давиру
  rationale: Направительное окончание -ה указывает на движение к городу; «к Давиру» естественно передаёт это значение после глагола «вернулись».
- source_word: וַיִּלָּחֶם
  choice: сразились
  rationale: Глагол לחם означает вступление в бой или ведение войны. «Сразились» кратко и естественно передаёт действие в данном повествовательном контексте.
- source_word: עָלֶיהָ
  choice: с этим городом
  rationale: Местоименный суффикс женского рода относится к городу Давиру. В русском название «Давир» имеет мужской род, а буквальное местоименное соответствие могло бы звучать неясно; явное «этим городом» сохраняет референт без искусственной грамматической кальки.
