translation_notes:
  register: Современный литературный русский язык с сохранением традиционных русских форм библейских имён. Синтаксис сделан естественным для повествования; древнееврейское согласование сказуемого с первым членом составного подлежащего не воспроизводится, поскольку по-русски здесь нормативно множественное число.
