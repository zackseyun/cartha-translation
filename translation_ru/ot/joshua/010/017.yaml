  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: ru
  text: 'И Иисусу Навину сообщили: «Пять царей были найдены скрывающимися в пещере в Маккеде».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: Безличная форма сохраняет отсутствие названного деятеля в еврейском пассиве и естественно звучит в русском повествовании как сообщение военного донесения.
- source_word: לִיהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: Использовано традиционное и общеупотребительное русское именование библейского Иисуса Навина, позволяющее отличить его от других носителей имени Иисус.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский показатель цитирования естественно передаётся в современном русском оформлением прямой речи, без буквального и тяжеловесного «говоря».
- source_word: נִמְצְאוּ
  choice: найдены
  rationale: Краткое страдательное причастие непосредственно передаёт пассивную форму глагола מצא и состояние только что обнаруженных царей.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: пять царей
  rationale: Определённость ясна из предшествующего контекста; в русском языке числительное с существительным не требует отдельного показателя определённости.
- source_word: נֶחְבְּאִים
  choice: скрывающимися
  rationale: Возвратное причастие естественно передаёт состояние и продолжающееся действие царей, которых обнаружили укрывшимися; возможное статальное понимание отмечено в сноске.
- source_word: בַּמְּעָרָה
  choice: в пещере
  rationale: Прямо передаёт определённое обозначение места; конкретность пещеры понятна из ситуации.
- source_word: בְּמַקֵּדָה
  choice: у Маккеды
  rationale: Предлог «у» естественно связывает пещеру с названным поселением или местностью, не утверждая непременно, что она находилась внутри города.
theological_decisions: []
translation_notes:
  register: Современный литературный повествовательный стиль. Начальное «И» сохраняет связь с последовательным древнееврейским рассказом; буквальное לֵאמֹר передано русской пунктуацией. Формулировка несколько формальна, но остаётся ясной и сохраняет пассивность נִמְצְאוּ и смысловую неоднозначность נֶחְבְּאִים.
