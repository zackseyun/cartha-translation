  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: ru
  text: Иисус Навин захватил всех этих царей и их землю за один раз[a], потому что Яхве, Бог Израиля, сражался за Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за один поход». Буквально: «за один раз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: взял
  rationale: В военном повествовании «взял» естественно передаёт захват царей и принадлежавшей им земли, не усиливая значение до полного покорения.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: всех этих царей
  rationale: Прямая и естественная передача определённого дополнения с указательным местоимением.
- source_word: וְאֶת אַרְצָם
  choice: и их землю
  rationale: «Землю» сохраняет широту значения אֶרֶץ и здесь обозначает владения названных царей.
- source_word: פַּעַם אֶחָת
  choice: за один раз
  rationale: Передаёт буквальное «один раз» и в данном контексте допускает смысл единого военного похода, не внося его прямо в основной текст.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно выражает причинную связь: успех Иисуса Навина объясняется тем, что Бог сражался за Израиль.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и идиоматичная передача сопряжённой конструкции.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: сражался за Израиль
  rationale: Естественно передаёт форму глагола לחם с ל в значении ведения битвы ради Израиля; совершенный вид соответствует итоговому характеру стиха.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Передача «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имя יְהוָה передано как «Яхве»; неоднозначность выражения פַּעַם אֶחָת сохранена посредством сноски.
