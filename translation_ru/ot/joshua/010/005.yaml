  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: ru
  text: И собрались пять царей аморреев — царь Иерусалима, царь Хеврона, царь Иармута, царь Лахиша и царь Еглона. Они поднялись со всеми своими войсками[a], расположились станом против Гаваона и сражались с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они и все их станы».'
    reason: Сноска сохраняет конкретный образ множественного מַחֲנֵיהֶם, которое в контексте означает расположенные станом войска.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: собрались
  rationale: Форма нифаль передаёт совместное собирание; русский возвратный глагол естественно сохраняет коллективный смысл.
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Сохраняет основное значение עלה и возможный топографический оттенок, не заменяя его более интерпретирующим «выступили в поход».
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: пять царей аморреев
  rationale: Передаёт конструкцию принадлежности и этническое обозначение; форма «аморреев» привычна в русском библейском регистре.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: царь Иерусалима, царь Хеврона, царь Иармута, царь Лахиша и царь Еглона
  rationale: Повтор слова «царь» сохранён в соответствии с намеренно подробным еврейским перечислением.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: со всеми своими войсками
  rationale: В данном военном контексте מַחֲנֶה обозначает не только место стоянки, но и расположенное станом войско. Русское «войска» ясно передаёт смысл, а конкретный образ оригинала отмечен в сноске.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: расположились станом против Гаваона
  rationale: «Расположились станом» сохраняет образ лагеря, а «против» передаёт враждебное значение עַל, подтверждённое последующим сражением.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: стали сражаться с ним
  rationale: Глагол обозначает ведение войны или боя. Местоимение мужского рода согласовано с русским названием города «Гаваон», тогда как женский суффикс в еврейском относится к подразумеваемому слову «город».
