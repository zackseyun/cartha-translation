base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: ru
  text: Тогда Горам, царь Газера, поднялся на помощь Лахису, и Иисус Навин поразил его и его народ, не оставив ему ни одного уцелевшего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого из оставшихся в живых»; еврейское слово שָׂרִיד может обозначать уцелевшего либо того, кто остался.'
    reason: 'Лексическая альтернатива: слово допускает оттенки «уцелевший», «оставшийся» и «остаток».'
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Наречие вводит следующее событие повествования; «тогда» естественно передаёт последовательность действий.
- source_word: עָלָה
  choice: поднялся
  rationale: Сохранено основное пространственное значение глагола «подниматься, идти вверх»; в данном военном контексте речь идёт о выступлении на помощь, но перевод не уточняет направление сверх сказанного в еврейском тексте.
- source_word: הֹרָם
  choice: Горам
  rationale: Имя передано традиционной русской библейской транслитерацией.
- source_word: מֶלֶךְ גֶּזֶר
  choice: царь Газера
  rationale: Конструкция прямо обозначает царский титул Горама и город, которым он правил.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: на помощь Лахису
  rationale: Инфинитив עזר означает оказание помощи; русское выражение «поднялся на помощь» естественно для военного контекста.
- source_word: וַיַּכֵּהוּ
  choice: но Иисус Навин поразил его
  rationale: נכה может означать «поразить» или «разгромить». «Поразил» сохраняет образность исходного глагола, а союз «но» естественно выражает контраст между намерением Горама помочь и исходом похода.
- source_word: וְאֶת עַמּוֹ
  choice: и его народ
  rationale: עַם буквально обозначает народ или людей. Хотя контекст может подразумевать войско, исходный текст не ограничивает значение только воинами.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: не оставив ему ни одного
  rationale: 'Причастный оборот естественно по-русски передаёт достигнутый результат: поражение было полным, и никого не осталось.'
- source_word: שָׂרִיד
  choice: уцелевшего
  rationale: Слово обозначает выжившего или оставшегося. Субстантивированное «уцелевший» ясно и естественно в контексте полного разгрома.
