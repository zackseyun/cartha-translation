base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: ru
  text: И остановилось солнце, и луна замерла, пока народ не отомстил своим врагам.[a] Не об этом ли написано в Книге Яшара?[b] Солнце стояло посреди неба и не спешило заходить примерно целый день.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока народ не взыскал с врагов». Еврейский оборот может выражать как отмщение, так и восстановление справедливости.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское название: «Книга Яшара»; возможно также смысловое понимание: «Книга Праведного» или «Книга праведных».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «как целый день»; возможно также: «почти целый день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: И остановилось солнце
  rationale: דמם может означать молчание или неподвижность; в параллели с остановившейся луной и в астрономическом контексте естественно передать прекращение движения.
- source_word: וְיָרֵחַ עָמָד
  choice: и луна замерла
  rationale: עמד буквально означает «стала/стояла», но применительно к небесному телу здесь выражает остановку; «замерла» естественно и избегает тяжеловесного повтора.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: пока народ не отомстил своим врагам
  rationale: В данном сочетании נקם выражает возмездие или отмщение; גוי здесь обозначает Израиль как единый народ, а суффикс передан коллективным «своим».
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: Не об этом ли написано
  rationale: Женское местоимение, вероятно, отсылает к предшествующему рассказу или изречению; такая формулировка естественна по-русски и сохраняет риторический вопрос.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Книга Праведного
  rationale: הַיָּשָׁר допускает понимание как титульного обозначения «Праведный/Прямой»; перевод сохраняет смысл еврейского названия, а альтернативная транслитерация отмечена в сноске.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: посреди неба
  rationale: Передаёт пространственный смысл выражения буквально и естественно для современного русского языка.
- source_word: וְלֹא אָץ לָבוֹא
  choice: и не спешило заходить
  rationale: אוץ означает «спешить», а בוא применительно к солнцу контекстуально относится к его заходу.
- source_word: כְּיוֹם תָּמִים
  choice: около целого дня
  rationale: תמים означает полный или целый, а сравнительная частица כ допускает приблизительное «около», не навязывая чрезмерной хронологической точности.
theological_decisions:
- issue: Характер астрономического чуда
  choice: Прямо передать повествование об остановке солнца и луны.
  alternative: Истолковать слова исключительно как описание наблюдаемого явления либо только как поэтическую цитату.
  rationale: Текст представляет событие как необычайное и ссылается на письменный источник; перевод не должен ни натурализовать, ни демифологизировать утверждение повествования.
- issue: Смысл возмездия народа врагам
  choice: «пока народ не отомстил своим врагам»
  alternative: «пока народ не взыскал со своих врагов» или «не был оправдан перед своими врагами»
  rationale: Еврейский оборот допускает оттенки отмщения и восстановления справедливости; основной текст выбирает наиболее ясное контекстуальное значение, а неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен для обычного читателя; сохранены повторное упоминание солнца, риторический вопрос и необычайный характер события.
