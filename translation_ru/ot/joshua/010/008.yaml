  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: ru
  text: 'И сказал Яхве Иисусу Навину: «Не бойся их, потому что Я отдал их в твои руки. Ни один из них не устоит перед тобой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» нормативна и понятна в современной русской библейской речи.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная формула введения прямой речи; союз сохраняет последовательность еврейского рассказа.
- source_word: אַל תִּירָא מֵהֶם
  choice: Не бойся их
  rationale: Естественно передаёт запрет с ירא и объект страха, обозначенный предлогом מן.
- source_word: כִּי
  choice: потому что
  rationale: Ясно выражает основание повеления не бояться; в современном русском звучит естественнее неоднозначного «ибо».
- source_word: בְיָדְךָ נְתַתִּים
  choice: Я отдал их в твои руки
  rationale: Сохраняет образ передачи в руки, то есть во власть победителя. Прошедшее совершенного вида передаёт представленное как уже совершившееся и непреложное действие Бога.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Ни один из них не устоит
  rationale: Передаёт отрицательную конструкцию с אִישׁ и её смысл в отношении мужского военного противника, не создавая в русском неестественного оборота «ни один мужчина».
- source_word: בְפָנֶיךָ
  choice: перед тобой
  rationale: Сохраняет еврейский образ и в военном контексте естественно означает неспособность противостоять Иисусу Навину.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет это отличие и не подменяет имя титулом.
- issue: Передача אִישׁ в отрицательной конструкции
  choice: Ни один из них
  alternative: Ни один человек из них; ни один мужчина из них
  rationale: Хотя контекст относится к мужчинам-воинам, русское «ни один из них» точно сохраняет единично-исчерпывающий смысл конструкции и звучит естественно, не превращая грамматический род в избыточное уточнение.
- issue: Временная перспектива נְתַתִּים
  choice: Я отдал их
  alternative: Я отдаю их; Я предал их
  rationale: Перфект в божественном обещании представляет победу как уже решённую. Совершенный вид прошедшего времени сохраняет эту уверенность, не добавляя отдельного богословского объяснения в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены имя «Яхве», образ «в твои руки» и военная идиома «не устоит перед тобой»; устаревшие «ибо» и «предал» не использованы.
