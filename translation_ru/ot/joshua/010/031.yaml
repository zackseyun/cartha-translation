  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: ru
  text: Иисус Навин со всем Израилем, который был с ним, выступил из Ливны к Лахису, разбил стан против него и воевал с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: двинулись
  rationale: Глагол עבר обозначает переход или дальнейшее движение; в данном рассказе речь идёт о передвижении войска от одного города к другому, без указания на переправу.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: и весь Израиль с ним
  rationale: Формулировка сохраняет собирательное обозначение сопровождавшего Иисуса Навина народа или войска и естественно звучит по-русски.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: от Ливны к Лахису
  rationale: Направительное окончание в לָכִישָׁה передаёт движение к Лахису; предлог «к» сохраняет направленность, не добавляя лишнего уточнения о прибытии.
- source_word: וַיִּחַן עָלֶיהָ
  choice: расположились станом против него
  rationale: חנה означает разбить или расположить стан, а עַל в военном контексте указывает на враждебное расположение против города.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: вступили с ним в бой
  rationale: Нифаль глагола לחם означает сражаться или вести войну; выбранная формулировка естественно передаёт начало боевых действий против города.
