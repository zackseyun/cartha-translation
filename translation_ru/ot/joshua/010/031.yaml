revisions:
- from: Иисус Навин и весь Израиль с ним двинулись от Ливны к Лахису, расположились станом против него и вступили с ним в бой.
  to: Иисус Навин со всем Израилем, который был с ним, выступил из Ливны к Лахису, разбил стан против него и воевал с ним.
  rationale: 'Исправлено число сказуемых в соответствии с еврейской морфологией; при этом «со всем Израилем, который был с ним» сохраняет смысл сопровождавшего Иисуса Навина Израиля. Военные действия переданы без усиления или доктринальных интерпретаций. Сноски не требуются: в русском тексте нет необходимой для читателя неразрешённой двусмысленности.'
