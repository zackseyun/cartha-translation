lexical_decisions:
- source_word: וַיַּעַל
  choice: выступил
  rationale: Глагол עלה буквально означает «подняться, пойти вверх», но в данном военном повествовании описывает выход Иисуса Навина из Галгала в поход. «Выступил» естественно передаёт движение войска, не добавляя деталей о способе передвижения.
- source_word: מִן הַגִּלְגָּל
  choice: из Галгала
  rationale: Предлог מן обозначает исходный пункт движения; традиционная русская форма топонима — «Галгал».
- source_word: הוּא
  choice: а с ним
  rationale: Самостоятельное местоимение подчёркивает, что Иисус Навин шёл лично вместе с перечисленными силами. В русском это естественно выражено конструкцией «а с ним».
- source_word: כָל עַם הַמִּלְחָמָה
  choice: все воины
  rationale: Буквально «весь народ войны». В контексте выражение обозначает всех участвующих в бою людей; «все воины» ясно и естественно передаёт военный смысл.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Прямое соответствие предлогу עם с местоименным суффиксом.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: все доблестные бойцы
  rationale: Устойчивое выражение обозначает сильных, испытанных и способных воинов. «Доблестные бойцы» сохраняет оттенок воинской отваги и отличает эту группу от общего обозначения «воины».
