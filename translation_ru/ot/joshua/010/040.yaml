  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: ru
  text: Так Иисус Навин поразил всю землю — горную страну, Негев, низменность и склоны — и всех их царей. Он не оставил никого в живых и предал заклятию всё дышащее[a], как повелел Яхве, Бог Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякое дыхание»; возможный перевод: «всё, что дышит».'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога Израиля, представленное в еврейском тексте четырьмя согласными יהוה.
    reason: divine_name
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: поразил
  rationale: Глагол נכה обозначает нанесение поражения или поражающий удар в военном контексте; «поразил» сохраняет силу исходного выражения, не уточняя способ действия.
- source_word: כָּל הָאָרֶץ
  choice: всю эту землю
  rationale: Здесь אֶרֶץ означает охваченную походом территорию, а не всю землю вообще; указательное «эту» естественно связывает итоговое обобщение с предшествующим повествованием.
- source_word: הָהָר
  choice: горную страну
  rationale: В книге Иисуса Навина это региональный топографический термин, обозначающий гористую область, а не отдельную гору.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: В данном перечне נֶגֶב служит географическим названием южной засушливой области; транслитерация сохраняет это значение.
- source_word: הַשְּׁפֵלָה
  choice: низменность
  rationale: שְׁפֵלָה обозначает низменную холмистую область между нагорьем и приморской равниной; «низменность» понятно современному читателю и сохраняет топографический характер названия.
- source_word: הָאֲשֵׁדוֹת
  choice: склоны
  rationale: אֲשֵׁדוֹת означает склоны или спуски и здесь входит в перечень природно-географических областей.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: не оставил никого в живых
  rationale: Идиоматический русский эквивалент военного выражения со שָׂרִיד «уцелевший, оставшийся».
- source_word: כָּל הַנְּשָׁמָה
  choice: всё дышащее
  rationale: Передаёт буквально-образное значение «всякое дыхание / всё, что дышит», не сужая его без достаточных оснований до слова «люди».
- source_word: הֶחֱרִים
  choice: предал заклятию
  rationale: Глагол חרם в породе hифиль означает безвозвратно посвятить уничтожению; «предал заклятию» сохраняет сакрально-военную окраску, которой нет у простого «уничтожил».
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: Кратко и естественно выражает соответствие действий ранее данному повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача военного термина חרם
  choice: предал заклятию
  alternative: полностью уничтожил
  rationale: Выбранный вариант сохраняет одновременно идею уничтожения и особую сакральную категорию безвозвратного посвящения, не сводя выражение лишь к военному результату.
- issue: Объём выражения כָּל הַנְּשָׁמָה
  choice: всё дышащее
  alternative: всех людей
  rationale: Исходная формулировка шире слова «люди» и сохраняет суровость и возможную широту утверждения; перевод не должен молча сужать её референцию.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация показывает, что в еврейском тексте стоит личное имя Бога, и позволяет сохранить различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Географический перечень сохранён как ряд региональных обозначений; синтаксис слегка упорядочен для ясности. Формулировки о насилии не смягчены, а культово-военный термин передан без конфессионального истолкования.
