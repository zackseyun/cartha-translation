lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: бежали
  rationale: Глагол נוּס обозначает бегство от опасности; «бежали» естественно передаёт поспешное отступление.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: эти пять царей
  rationale: Сохранено указательное הָאֵלֶּה, а порядок слов соответствует нормам современного русского языка.
- source_word: וַיֵּחָבְאוּ
  choice: спрятались
  rationale: Форма от חבא имеет возвратное значение; «спрятались» ясно и естественно передаёт его по-русски.
- source_word: בַמְּעָרָה
  choice: в пещере
  rationale: Определённая форма существительного передана как контекстуально определённая пещера.
- source_word: בְּמַקֵּדָה
  choice: у Маккеды
  rationale: Предлог בְּ имеет локативное значение; «у Маккеды» естественно указывает на расположение пещеры возле названного места, не утверждая, что она находилась внутри города.
- source_word: וַ
  choice: А
  rationale: Союз продолжает повествование и одновременно отмечает переход к действиям царей; русское «А» передаёт этот дискурсивный поворот без чрезмерно сильного противопоставления.
