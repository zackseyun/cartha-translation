base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: ru
  text: И весь народ благополучно возвратился в стан к Иисусу Навину, находившемуся в Маккеде. Никто не сказал ни слова против кого-либо из сынов Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Никто не заострил своего языка против кого-либо из сынов Израиля»; то есть никто не произнёс против них ни слова.'
    reason: Сноска сохраняет яркий еврейский образ идиомы חָרַץ ... לָשׁוֹן и поясняет её смысл.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: И весь народ… возвратился
  rationale: שׁוּב обозначает возвращение после преследования; עָם сохранено как «народ», хотя в данном военном контексте речь идёт о воинах.
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: в стан к Иисусу Навину в Маккеде
  rationale: Сжатая еврейская конструкция передаёт возвращение в стан, к Иисусу Навину, находившемуся в Маккеде. Русский порядок слов делает эти отношения ясными без изменения смысла.
- source_word: בְּשָׁלוֹם
  choice: благополучно
  rationale: В контексте возвращения שָׁלוֹם означает безопасность и невредимость. «Благополучно» естественно передаёт этот смысл по-русски.
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: Никто не посмел и слова сказать против
  rationale: Выражение буквально связано с языком и означает отсутствие враждебного или дерзкого высказывания. Русская идиома сохраняет речевой смысл и оттенок полного отсутствия противодействия; буквальный образ указан в сноске.
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: против кого-либо из сынов Израиля
  rationale: Отрицание с אִישׁ передано как «кого-либо», а בני ישראל — формально точным традиционным обозначением «сыны Израиля».
theological_decisions:
- issue: Передача национально-заветного обозначения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: «Сыны Израиля» сохраняет мужскую множественную форму и традиционное библейское звучание, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Стан» и «сыны Израиля» сохраняют традиционный регистр; основная фраза об отсутствии враждебной речи передана естественной русской идиомой, а буквальный образ вынесен в сноску.
