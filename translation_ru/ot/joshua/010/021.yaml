  source_fidelity: 'Основной смысл передан верно: народ возвратился в стан к Иисусу Навину, находившемуся в Маккеде, невредимым; далее подчёркнуто отсутствие враждебных слов против сынов Израиля. Однако «не посмел» добавляет отсутствующий в еврейском тексте смысл робости или запрета. Идиома לֹא חָרַץ ... אֶת־לְשֹׁנוֹ сообщает, что никто не произнёс ничего против них, а не обязательно что кто-то не решился это сделать.'
  naturalness: «Благополучно возвратился» и «стан» естественны в современном литературном библейском регистре. «Никто не сказал ни слова против кого-либо из сынов Израиля» — естественная русская передача без добавочного модального оттенка. Уточнение «находившемуся в Маккеде» снимает возможную синтаксическую неясность.
