source:
  edition: WLC
  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: ru
  text: И не было такого дня ни прежде, ни после, когда Яхве услышал голос человека[a], потому что Яхве сражался за Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внял просьбе человека». Буквально: «слушать голос человека».'
    reason: Лексическая альтернатива поясняет идиому, не устраняя её из основного текста; буквальная помета точнее отражает еврейский инфинитив.
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  choice: И не было такого дня
  rationale: Естественная русская конструкция сохраняет отрицательное бытийное высказывание и подчёркивает несравненность этого дня.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: ни прежде, ни после
  rationale: Сжатая идиоматическая передача временного сравнения; местоименные суффиксы относятся к упомянутому дню.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: когда Яхве услышал голос человека
  rationale: Сохраняет еврейский образ «слушать голос» и не усиливает его до богословски нагруженного «повиновался человеку»; инфинитив передан как обстоятельство, определяющее уникальность дня.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: כִּי יְהוָה נִלְחָם לְיִשְׂרָאֵל
  choice: потому что Яхве сражался за Израиль
  rationale: כִּי понято как вводящее объяснение, а נִלְחָם לְ — как действие в защиту и на стороне Израиля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя в соответствии с исходным текстом и не вносит конфессионально обусловленной замены.
- issue: Смысл לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: Яхве услышал голос человека
  alternative: Яхве внял просьбе человека; Яхве послушался человека
  rationale: Основной текст сохраняет конкретную еврейскую формулировку и её напряжение, не создавая впечатления подчинения Бога человеку. Смысл отклика на просьбу отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Повтор имени «Яхве» сохранён вслед за еврейским текстом; формулировка остаётся ясной для широкого читателя.
