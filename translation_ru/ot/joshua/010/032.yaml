base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: ru
  text: Яхве предал Лахиш в руки Израиля, и Израиль захватил его на второй день. Он поразил мечом город вместе со всеми людьми, находившимися в нём[a], — так же, как поступил с Ливной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякую душу, которая была в нём»; здесь это древнееврейское выражение означает всех людей в городе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога как имя собственное и соответствует форме исходного текста, не заменяя её титулом.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: предал ... в руки
  rationale: Естественная русская передача древнееврейской идиомы со значением передачи под чью-либо власть; образ «рук» сохранён.
- source_word: לָכִישׁ
  choice: Лахиш
  rationale: Транслитерация еврейского географического названия с шипящим согласным שׁ.
- source_word: וַיִּלְכְּדָהּ
  choice: захватил его
  rationale: Военный глагол обозначает овладение городом; местоимение относится к Лахишу.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: на второй день
  rationale: Прямая передача временного указания без превращения его в менее точное «на следующий день».
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: поразил мечом город
  rationale: Идиома буквально упоминает «остриё/уста меча», но по-русски естественно означает поражение мечом. Слово «город» проясняет объект женского местоименного суффикса, относящегося к Лахишу.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: всех людей, находившихся в нём
  rationale: נֶפֶשׁ здесь обозначает людей как живых существ, а не «души» в противопоставлении телам; коллективное выражение естественно передано множественным числом.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: так же, как поступил с Ливной
  rationale: Сохраняет единственное число еврейского глагола и ясно выражает сопоставление с предшествующим завоеванием Ливны.
theological_decisions:
- issue: Формула завоевания и уничтожения жителей
  choice: поразил мечом город и всех людей, находившихся в нём
  alternative: поразил остриём меча его и всякую душу, которая была в нём
  rationale: Перевод не смягчает насилие повествования, но и не вносит отсутствующее в контексте противопоставление души и тела.
- issue: Неявный субъект глаголов единственного числа
  choice: Иисус Навин захватил ... Он поразил ... поступил
  alternative: Израиль захватил ... поразил ... поступил
  rationale: В еврейском тексте после «Израиля» стоят глаголы мужского рода единственного числа. По контексту их субъектом выступает Иисус Навин как предводитель войска; явное имя в русском исключает ошибочное отнесение местоимения «он» к Яхве и сохраняет единственное число исходного текста.
translation_notes:
  register: Современный литературный русский язык с сдержанным повествовательным тоном. Синтаксис разделён на два предложения для ясности; военная терминология и суровость сообщения сохранены без архаизации и эвфемизмов.
