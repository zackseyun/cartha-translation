  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: ru
  text: Он взял его вместе с его царём и всеми его городами; они поразили их остриём меча и предали уничтожению[a] всех, кто был в нём. Он не оставил ни одного уцелевшего. Как он поступил с Хевроном, так поступил и с Девиром и его царём, и как поступил с Ливной и её царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергли заклятию». Еврейский глагол обозначает предание херему — полному уничтожению.'
    reason: Лексическое пояснение к וַיַּחֲרִימוּ; сноска перенесена с «взял» на термин חרם, к которому она относится.
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Они взяли его
  rationale: לכד в военном контексте означает «взять, захватить». Местоимение относится к Девиру; мужской род обусловлен русским названием города. Множественное число передаёт коллективное действие Израиля в ближайшем контексте, хотя еврейская глагольная форма формально стоит в единственном числе.
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: вместе с его царём и всеми его городами
  rationale: Суффиксы относятся к главному городу Девиру. עָרֶיהָ обозначает зависимые от него города или поселения; «города» сохраняет обычное значение עיר и естественно звучит по-русски.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: поразили их остриём меча
  rationale: Сохранён древнееврейский образ «уста/остриё меча» без неестественной буквальности выражения «устами меча».
- source_word: וַיַּחֲרִימוּ
  choice: предали уничтожению
  rationale: Глагол חרם обозначает не просто убийство, а предание под херем, то есть полному уничтожению. Формулировка сохраняет технический оттенок, не перегружая основной текст транслитерацией.
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: всех, кто был в нём
  rationale: נפש здесь означает людей, находившихся в городе, а не нематериальную «душу». Русское собирательное выражение естественно передаёт смысл.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: он не оставил ни одного уцелевшего
  rationale: Сохранено единственное число еврейского глагола, вероятно указывающее на Иисуса Навина как предводителя и представителя народа; שָׂרִיד передано как «уцелевший».
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: Как он поступил с Хевроном, так поступил и с Девиром
  rationale: Сравнительная конструкция сохранена; русское «поступил с» естественно передаёт идиому עשה ל־.
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: и как поступил с Ливной и её царём
  rationale: Сохранена вторая параллель с ранее покорёнными Ливной и её царём; женское местоимение согласовано с русским названием «Ливна».
theological_decisions:
- issue: Передача терминологии חרם в повествовании о войне
  choice: предали уничтожению
  alternative: полностью уничтожили; подвергли заклятию
  rationale: Выражение сохраняет особый религиозно-судебный оттенок חרם, но не сводит его к обычному глаголу «уничтожить» и не вводит в основной текст малопонятное «заклятие».
- issue: Чередование множественного и единственного числа субъекта
  choice: сохранить множественное число в коллективных действиях и единственное в выражении «он не оставил» и сравнительных оборотах
  alternative: унифицировать все глаголы во множественном или единственном числе
  rationale: Еврейский текст переходит от действий войска к Иисусу Навину как его предводителю и представителю. Сохранение перехода не устраняет подлинную неоднозначность повествовательного субъекта.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Сохранены образ «остриём меча», технический оттенок херема и намеренное чередование коллективного и единственного субъекта. Топонимы переданы в привычных русских библейских формах: Хеврон, Девир, Ливна.'
