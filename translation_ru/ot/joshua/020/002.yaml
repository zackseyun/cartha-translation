  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: ru
  text: 'Скажи сынам Израиля: «Назначьте себе города-убежища, о которых Я говорил вам через Моисея[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея»; еврейская идиома со значением «через Моисея».'
