lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Скажи сынам Израиля
  rationale: Повелительная форма передана прямо; стандартная вводная конструкция לֵאמֹר естественно выражена в русском двоеточием перед прямой речью, без тяжеловесного «говоря».
- source_word: תְּנוּ לָכֶם
  choice: Назначьте себе
  rationale: Глагол נתן буквально означает «дать», но здесь обозначает официальное определение городов для особого назначения; «назначьте» ясно и естественно передаёт этот административный смысл.
- source_word: עָרֵי הַמִּקְלָט
  choice: города-убежища
  rationale: Краткое и устоявшееся обозначение городов, предназначенных для защиты человека, совершившего непреднамеренное убийство.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: о которых Я говорил вам
  rationale: Предлог «о» естественно выражает в русском предмет речи, подразумеваемый еврейской конструкцией.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Еврейская идиома «рукой Моисея» обозначает посредничество; «через Моисея» передаёт её смысл в современном русском языке, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Обозначение народа בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля
  rationale: Сохранён семейно-родовой образ исходного выражения без сведения его к нейтральному этнониму.
- issue: Посредничество в выражении בְּיַד מֹשֶׁה
  choice: через Моисея
  alternative: рукой Моисея
  rationale: Основной текст ясно сохраняет Моисея как посредника ранее данного Божьего повеления; буквальная идиома приведена в сноске и не получает дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой Божьей речи. Двоеточие вместо буквального воспроизведения לֵאמֹר устраняет неестественное русское «говоря», а прописное «Я» соответствует принятому благоговейному оформлению речи Бога.
