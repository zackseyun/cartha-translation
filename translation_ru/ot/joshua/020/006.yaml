  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: ru
  text: Он должен жить в том городе до тех пор, пока не предстанет перед общиной на суд[a], и до смерти первосвященника, который будет в те дни. Тогда убивший человека[b] может вернуться в свой город, в свой дом — в город, из которого он бежал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед собранием для суда». Еврейское слово обозначает собравшуюся общину, которая здесь действует как судебное сообщество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убивший», «лишивший жизни». Еврейское слово в законах о городах-убежищах не обязательно означает человека, совершившего умышленное убийство; обстоятельства дела подлежат судебному рассмотрению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: пусть он живёт
  rationale: В данном правовом контексте ישב обозначает продолжительное проживание в городе-убежище; форма с «пусть» естественно передаёт предписание.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: пока не предстанет перед общиной на суд
  rationale: Оборот עמד לפני означает явиться или предстать перед обладающим полномочиями собранием; למשפט указывает на судебное разбирательство.
- source_word: הָעֵדָה
  choice: община
  rationale: עדה здесь означает собравшееся сообщество, выступающее в судебной роли; «община» понятно современному русскому читателю и не сужает значение до отдельного учреждения.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Устоявшееся и точное русское наименование должности, буквально «великий священник».
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: который будет служить в те дни
  rationale: Глагол «служить» естественно поясняет, что речь идёт о первосвященнике, занимающем должность в рассматриваемое время, не добавляя конфессиональной специфики.
- source_word: הָרֹצֵחַ
  choice: совершивший убийство
  rationale: רצח называет человека по факту причинения смерти, однако в законах о городах-убежищах не обязательно предполагает уже установленное умышленное убийство. Описательный вариант сохраняет эту юридическую открытость.
- source_word: אָז יָשׁוּב וּבָא
  choice: тогда ... сможет вернуться
  rationale: В правовом контексте возвращение становится разрешённым после выполнения названных условий; «сможет» передаёт снятие ограничения, не превращая возвращение в обязательное действие.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: в свой город и в свой дом
  rationale: 'Сохранена двойная формулировка исходного текста: возвращение и в прежнее городское сообщество, и в собственный дом.'
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: в город, из которого он бежал
  rationale: Прямая и естественная передача заключительного уточнения места возвращения.
theological_decisions:
- issue: Юридический статус הָרֹצֵחַ
  choice: совершивший убийство
  alternative: убийца
  rationale: Слово не переведено как «убийца» без пояснения, поскольку в современном русском это часто подразумевает умышленное преступление и установленную виновность, тогда как контекст городов-убежищ включает неумышленное причинение смерти и судебное рассмотрение.
- issue: Характер возвращения после смерти первосвященника
  choice: сможет вернуться
  alternative: вернётся
  rationale: Формулировка передаёт юридически разрешённую возможность возвращения и не утверждает, что человек непременно ею воспользуется.
- issue: Соотношение суда общины и смерти первосвященника
  choice: сохранены обе временные границы без их логического согласования
  alternative: перестроить фразу так, будто смерть первосвященника следует только после судебного решения
  rationale: Еврейский текст ставит рядом два оборота с עַד. Перевод сохраняет эту напряжённую структуру и не вводит отсутствующего в стихе объяснения их соотношения.
translation_notes:
  register: Современный литературный русский язык с dignified правовым звучанием. Синтаксис в основном следует еврейской последовательности, но сглажен для ясности. Термин «совершивший убийство» выбран вместо архаичного «человекоубийца» и юридически более обвинительного «убийца».
