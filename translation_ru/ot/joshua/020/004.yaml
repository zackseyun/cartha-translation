  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: ru
  text: Пусть он убежит в один из этих городов, станет у входа в ворота города и изложит своё дело[a] старейшинам того города. Тогда они примут[b] его к себе в город, дадут ему место, и он будет жить с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои слова» или «свои обстоятельства»; еврейское выражение может обозначать как произнесённые им слова, так и изложенное им дело.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «введут его в город к себе»; еврейский глагол может означать «собрать», «ввести» или «принять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: Пусть он убежит
  rationale: В последовательности правовых предписаний форма выражает предписанное действие; конструкция с «пусть» естественно передаёт это значение по-русски.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: станет у входа в городские ворота
  rationale: Передаёт одновременно פֶּתַח «вход» и שַׁעַר «ворота», сохраняя образ публичного появления у места городского суда.
- source_word: וְדִבֶּר בְּאָזְנֵי זִקְנֵי הָעִיר הַהִיא אֶת דְּבָרָיו
  choice: изложит своё дело старейшинам того города
  rationale: Идиома «говорить в уши» означает говорить так, чтобы адресаты услышали; «изложит ... старейшинам» звучит естественно. דְּבָרָיו в судебном контексте может обозначать его слова или обстоятельства его дела.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: они примут его к себе в город
  rationale: אָסַף здесь обозначает официальное принятие или введение внутрь; перевод сохраняет и направленность в город, и значение אֲלֵיהֶם «к себе».
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: дадут ему место
  rationale: Буквально и достаточно широко передаёт מָקוֹם, не уточняя без основания, идёт ли речь о жилище или об ином предоставленном месте.
- source_word: וְיָשַׁב עִמָּם
  choice: он будет жить с ними
  rationale: В контексте поселения יָשַׁב означает проживать, а не буквально сидеть.
