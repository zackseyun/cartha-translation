source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: ru
  text: Это были города, назначенные для всех сынов Израиля[a] и для переселенца, живущего среди них[b], чтобы всякий, кто непреднамеренно убил человека, мог бежать туда и не погиб от руки мстителя за кровь, пока не предстанет перед общиной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «для всех израильтян». Буквально: «для всех сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: «Переселенец» — некоренной житель, живший среди израильтян и находившийся под установленным в их общине порядком.
    reason: cultural_note
  - marker: c
    text: 'Или: «перед собранием». В данном контексте община выступает как собранный орган, рассматривающий дело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: города, назначенные
  rationale: Сохраняет значение назначенных или определённых городов, не добавляя отсутствующего в самой фразе слова «убежище».
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: для всех сынов Израиля
  rationale: Передаёт формальное древнееврейское выражение, тогда как более идиоматичный вариант «для всех израильтян» указан в сноске.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: и для переселенца, живущего среди них
  rationale: «Переселенец» передаёт статус некоренного постоянного жителя в израильском обществе; причастный оборот переведён естественно по-русски.
- source_word: לָנוּס שָׁמָּה
  choice: мог бежать туда
  rationale: Передаёт конкретное значение глагола נוּס и цель назначения городов.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: всякий, кто ... убил человека
  rationale: Древнееврейский оборот буквально говорит о поражении человека; в данном правовом контексте результатом является смерть, поэтому по-русски ясно и естественно «убил человека».
- source_word: בִּשְׁגָגָה
  choice: непреднамеренно
  rationale: Слово обозначает отсутствие умысла; этот вариант сохраняет правовой оттенок и не обязательно предполагает небрежность.
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: и не погиб от руки мстителя за кровь
  rationale: «Мститель за кровь» сохраняет особое правовое обозначение родственника, мстящего за убитого, а «от руки» прозрачно передаёт способ выражения действующего лица.
- source_word: עַד עָמְדוֹ
  choice: пока не предстанет
  rationale: Русская форма совершенного будущего естественно обозначает предел, до которого действует защита.
- source_word: לִפְנֵי הָעֵדָה
  choice: перед общиной
  rationale: עֵדָה здесь обозначает общину, выступающую в собранном общественно-судебном качестве; возможное «собранием» сохранено в сноске.
theological_decisions:
- issue: Родовое выражение בְּנֵי יִשְׂרָאֵל
  choice: для всех сынов Израиля
  alternative: для всех израильтян
  rationale: Основной текст сохраняет грамматически мужское национально-родовое выражение оригинала, не отрицая того, что речь идёт об израильском народе в целом.
- issue: Правовой статус גֵּר
  choice: переселенец, живущий среди них
  alternative: пришлый житель, живущий среди них
  rationale: Формулировка показывает, что защита распространялась не только на коренных израильтян, но и на некоренного жителя, находившегося внутри общественного порядка Израиля, без переноса современных миграционных категорий.
- issue: Роль גֹּאֵל הַדָּם
  choice: мститель за кровь
  alternative: кровный мститель
  rationale: Выбранный вариант сохраняет древний правовой институт и родственную обязанность отмщения, не превращая выражение просто в обозначение частного убийцы.
translation_notes:
  register: Современный литературный русский язык с достоинством правового повествования. Синтаксис остаётся близким к структуре древнееврейского стиха, но временные формы и целевая конструкция приведены к естественной русской норме. Специальные понятия «переселенец» и «мститель за кровь» сохранены как историко-правовые термины.
