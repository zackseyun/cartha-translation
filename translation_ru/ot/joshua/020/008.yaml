base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: ru
  text: А за Иорданом, к востоку от Иерихона, они назначили Бецер в пустыне, на плоскогорье, в пределах колена Рувима; Рамот в Галааде[a] — в пределах колена Гада; и Голан в Васане — в пределах колена Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционное название — «Рамоф Галаадский».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן
  choice: А за Иорданом
  rationale: Передаёт пространственное указание относительно Ханаана; по-русски название реки естественно употребляется без слова «река».
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: к востоку от Иерихона
  rationale: Естественно передаёт направительную форму и связывает её с положением городов за Иорданом.
- source_word: נָתְנוּ
  choice: они выделили
  rationale: В контексте городов-убежищ глагол обозначает официальное предоставление и назначение; «выделили» сохраняет связь с базовым значением «дали».
- source_word: בֶּצֶר
  choice: Бецер
  rationale: Современная русская транслитерация топонима, близкая к еврейскому звучанию.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Широкий и привычный русский эквивалент для незаселённой или степной местности.
- source_word: בַּמִּישֹׁר
  choice: на плоскогорье
  rationale: Передаёт значение ровной возвышенной области восточнее Иордана точнее, чем потенциально двусмысленное «на равнине».
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: из удела колена Рувима
  rationale: Контекстуально поясняет, что город находился на территории, отведённой этому колену, не перегружая фразу.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: Рамот в Галааде
  rationale: 'Сохраняет буквальную структуру еврейского текста: название города и указание области.'
- source_word: מִמַּטֵּה גָד
  choice: из удела колена Гада
  rationale: Последовательно передаёт формулу территориальной принадлежности.
- source_word: גלון
  choice: Голан
  rationale: Принятая русская форма известного топонима; консонантный текст соответствует названию Голан.
- source_word: בַּבָּשָׁן
  choice: в Васане
  rationale: Традиционная русская библейская форма названия области Башан.
- source_word: מִמַּטֵּה מְנַשֶּׁה
  choice: из удела колена Манассии
  rationale: Передаёт принадлежность города территории колена Манассии и сохраняет параллелизм перечня.
