translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Географический термин «нагорье» последовательно передаёт региональное значение הַר. Имена в основном транслитерированы с древнееврейского источника; традиционные русские формы сохранены для Галилеи, Неффалима, Ефрема, Хеврона и Иуды.
