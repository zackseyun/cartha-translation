  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: ru
  text: И они выделили Кедеш в Галилее, в нагорье Неффалима, Шехем в нагорье Ефрема и Кирьят-Арбу[a] (то есть Хеврон) в нагорье Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «Кирьят-Арба — это Хеврон»; Кирьят-Арба — другое название Хеврона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: выделили
  rationale: В контексте учреждения городов-убежищ глагол обозначает официальное отведение городов для особого назначения. «Выделили» естественно передаёт юридико-общественный смысл, не внося излишне культового оттенка слов «освятили» или «посвятили».
- source_word: קֶדֶשׁ
  choice: Кедеш
  rationale: Название передано транслитерацией непосредственно с древнееврейского, с сохранением конечного согласного שׁ.
- source_word: בַּגָּלִיל
  choice: в Галилее
  rationale: Употреблено общепринятое русское название географической области.
- source_word: בְּהַר נַפְתָּלִי
  choice: в нагорье Неффалима
  rationale: В территориальном описании הַר обозначает гористую область, а не отдельную гору; «нагорье» кратко и точно передаёт этот смысл.
- source_word: שְׁכֶם
  choice: Шехем
  rationale: Название транслитерировано с древнееврейского; форма передаёт начальный שׁ как «ш» и средний ח как «х».
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: Фраза обозначает гористую область, связанную с Ефремом, а не одиночную вершину.
- source_word: קִרְיַת אַרְבַּע
  choice: Кирьят-Арбу
  rationale: Составное географическое название транслитерировано, а не переведено как «город Арбы»; винительный падеж естественно включён в русское предложение.
- source_word: הִיא חֶבְרוֹן
  choice: (то есть Хеврон)
  rationale: Местоименная конструкция отождествляет Кирьят-Арбу с Хевроном; скобки и «то есть» ясно передают пояснительное приложение.
- source_word: בְּהַר יְהוּדָה
  choice: в нагорье Иуды
  rationale: הַר здесь означает гористую область Иуды; «нагорье» сохраняет топографический смысл без представления об одной горе.
