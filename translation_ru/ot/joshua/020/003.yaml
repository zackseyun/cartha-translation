  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: ru
  text: чтобы туда мог бежать тот, кто непреднамеренно лишил человека жизни[a], не сознавая этого, а эти города были для вас убежищем от мстителя за кровь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по ошибке», «неумышленно». Речь идёт не об умышленном убийстве, а о причинении смерти без намерения.'
    reason: lexical_alternative
  - marker: b
    text: «Мститель за кровь» — человек, на которого в древнеизраильской родовой правовой системе возлагалась обязанность отомстить за смерть родственника.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: чтобы туда мог бежать
  rationale: Инфинитив с ל выражает цель в связи с предшествующим повелением; направительное שָׁמָּה естественно передаётся словом «туда».
- source_word: רוֹצֵחַ
  choice: тот, кто лишил человека жизни
  rationale: В данном правовом контексте слово обозначает виновника смерти, но уточнения исключают намеренное убийство; описательный перевод не приписывает ему умысла.
- source_word: מַכֵּה נֶפֶשׁ
  choice: кто лишил человека жизни
  rationale: Еврейское выражение буквально связано с нанесением смертельного удара и идиоматически означает причинение смерти человеку; русский перевод ясно передаёт итог действия.
- source_word: בִּשְׁגָגָה
  choice: по неосторожности
  rationale: В правовом контексте выражение указывает на непреднамеренное причинение смерти. «По неосторожности» звучит естественно и сохраняет юридический оттенок.
- source_word: בִּבְלִי דָעַת
  choice: не сознавая этого
  rationale: Фраза буквально означает отсутствие знания или осознания и дополняет указание на непреднамеренность, не сливаясь с ним полностью.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: и чтобы эти города служили вам убежищем
  rationale: Множественное число глагола отсылает к ранее названным городам; явное «эти города» устраняет неясность русского местоимения и передаёт назначение городов.
- source_word: מִגֹּאֵל הַדָּם
  choice: от мстителя за кровь
  rationale: Устойчивое библейско-правовое выражение обозначает человека, обязанного отомстить за смерть в рамках родовой системы; основной текст сохраняет образ крови.
theological_decisions:
- issue: Правовая характеристика виновника смерти
  choice: Человек причинил смерть по неосторожности и без осознания, а не совершил умышленное убийство.
  alternative: Передать רוֹצֵחַ общим словом «убийца», способным в современном русском подразумевать умысел.
  rationale: 'Сочетание בִּשְׁגָגָה и בִּבְלִי דָעַת прямо ограничивает значение существительного: речь идёт о непреднамеренном лишении жизни. Перевод не должен вносить отсутствующую в тексте злонамеренность.'
translation_notes:
  register: Современный литературный русский язык с умеренно формальным правовым оттенком. Описательное «лишил человека жизни» позволяет избежать ложного значения умышленного убийства. Синтаксис передаёт целевую связь с предыдущим стихом; архаизмы не используются.
