- from: И если мститель за кровь погонится за ним, они не должны выдавать убившего в его руки, потому что тот неумышленно нанёс удар своему ближнему и до этого не питал к нему ненависти[a].
  to: И если мститель за кровь будет преследовать его, они не должны выдавать убившего в его руки, потому что тот неумышленно нанёс удар своему ближнему и прежде[a] не питал к нему ненависти.
