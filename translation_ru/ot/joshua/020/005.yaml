base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: ru
  text: И если мститель за кровь будет преследовать его, они не должны выдавать убившего в его руки, потому что тот неумышленно нанёс удар своему ближнему и прежде[a] не питал к нему ненависти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со вчерашнего дня и третьего дня назад»; еврейская идиома означает «прежде», «ранее».'
    reason: Поясняет временную идиому מִתְּמוֹל שִׁלְשׁוֹם, сохраняя её буквальную образность без неясной русской формулировки.
lexical_decisions:
- source_word: וְכִי יִרְדֹּף
  choice: И если … погонится
  rationale: Сочетание вводит возможный случай в составе правового предписания; совершенный вид будущего времени естественно передаёт предполагаемое действие.
- source_word: גֹּאֵל הַדָּם
  choice: мститель за кровь
  rationale: Это обозначение родственника, на которого в данном правовом контексте возлагалось возмездие за пролитую кровь. Формулировка сохраняет связь с кровью и понятна без конфессионального истолкования.
- source_word: וְלֹא יַסְגִּרוּ … בְּיָדוֹ
  choice: они не должны выдавать … в его руки
  rationale: Глагол означает передачу человека во власть другого; модальная конструкция передаёт обязательную силу предписания, а образ «в руки» сохраняет еврейскую юридическую выразительность.
- source_word: הָרֹצֵחַ
  choice: убившего
  rationale: Нейтральное обозначение человека, причинившего смерть, не называет его убийцей в смысле виновного в умышленном убийстве, которое данный стих как раз отличает от неумышленного лишения жизни.
- source_word: בִּבְלִי דַעַת
  choice: неумышленно
  rationale: В контексте закона об убежище выражение указывает на отсутствие намерения; русский юридически понятный эквивалент передаёт это без тяжеловесного буквального «без знания».
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: нанёс удар своему ближнему
  rationale: Сохранено собственное значение глагола «ударить», без подмены его глаголом «убить»; רֵעַ передано традиционным и понятным словом «ближний».
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ מִתְּמוֹל שִׁלְשׁוֹם
  choice: и до этого не питал к нему ненависти
  rationale: Передаёт отсутствие прежней вражды естественным современным русским языком. Временная идиома разъяснена в сноске, чтобы не создавать впечатления, будто речь лишь о двух конкретных днях.
theological_decisions:
- issue: Правовой статус הָרֹצֵחַ
  choice: убившего
  alternative: убийцу
  rationale: Стих говорит о неумышленном причинении смерти и отсутствии прежней ненависти. «Убийца» в современном русском часто подразумевает преступный умысел, поэтому нейтральное причастие сохраняет правовую и богословскую напряжённость текста, не предрешая вину.
- issue: Характер действия בִּבְלִי דַעַת
  choice: неумышленно
  alternative: по неведению / без знания
  rationale: Выбрана формулировка, ясно выражающая отсутствие умысла, но не добавляющая утверждения о полной невиновности или отсутствии всякой ответственности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Правовая сила нормы выражена конструкцией «не должны», а архаизмы сведены к минимуму; слово «ближний» сохранено как общеупотребительное библейское понятие.
