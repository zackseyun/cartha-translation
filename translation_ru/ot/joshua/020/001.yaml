  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: ru
  text: 'Тогда[a] Яхве сказал Иисусу Навину:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Яхве сказал Иисусу Навину». Еврейская повествовательная форма допускает передачу как через «и», так и через «тогда».'
    reason: Лексическая альтернатива при передаче וַ־.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда … сказал
  rationale: Форма с וַ־ продолжает и продвигает повествование. «Тогда» естественно передаёт последовательность событий, а «сказал» в сочетании с двоеточием ясно вводит последующую прямую речь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое именование Бога в еврейском тексте, не заменяя его титулом.
- source_word: אֶל
  choice: Иисусу Навину
  rationale: Предлог обозначает адресата речи и естественно выражается русским дательным падежом.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличить этого персонажа от других носителей имени Иисус.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формульное введение последующей речи естественно передано двоеточием; буквальное «говоря» в современном русском здесь было бы тяжеловесным и избыточным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная повествовательная формула. Традиционная форма имени «Иисус Навин» сохранена ради ясности и узнаваемости.
