lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт коллективное обозначение народа, сохраняя библейскую торжественность и оставаясь понятным современному читателю.
- source_word: הוֹרִישׁוּ
  choice: изгнали
  rationale: В данной каузативной форме и контексте распределения земли глагол означает изгнание прежних жителей.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: гешурцев и маахатян
  rationale: Естественные русские этниконы для названных групп населения.
- source_word: וַיֵּשֶׁב
  choice: живут
  rationale: Еврейская форма повествовательного прошедшего описывает начавшееся тогда и продолжающееся до времени автора состояние; настоящее время естественно согласуется с «до сего дня».
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: среди Израиля
  rationale: Сохраняет коллективное значение имени Израиль и буквально передаёт проживание внутри его сообщества.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и ясное русское выражение, сохраняющее историографическую формулу оригинала.
