  source_fidelity: 'Переданы все основные элементы еврейского текста: связь с ранее названной половиной колена через «с ним», собирательные названия рувимлян и гадитян, получение земельного удела, дарование Моисеем, положение по восточную сторону Иордана и титул «слуга Яхве». Однако «к востоку» после «за Иорданом» несколько неопределённо: оно может быть понято как движение дальше на восток, а не как обозначение восточной стороны Иордана.'
