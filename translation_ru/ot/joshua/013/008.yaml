base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: ru
  text: Вместе с ним рувимляне и гадитяне получили свой удел, который дал им Моисей за Иорданом, на восточной стороне[a], как дал им Моисей, слуга Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на восточной стороне Иордана.
    reason: Географическое пояснение выражения «за Иорданом, на восточной стороне».
lexical_decisions:
- source_word: עִמּוֹ
  choice: Вместе с ним
  rationale: Местоименный суффикс мужского рода, вероятнее всего, отсылает к упомянутой ранее половине колена Манассии, представленной как коллективное лицо. Формулировка сохраняет связь с предыдущим контекстом.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: рувимляне и гадитяне
  rationale: Обе формы морфологически единственного числа, но обозначают колена собирательно; русские названия племенных групп во множественном числе естественно передают эту функцию.
- source_word: לָקְחוּ
  choice: получили
  rationale: Глагол допускает значения «взяли» и «получили». При существительном «удел» и в контексте дарования земли Моисеем вариант «получили» естественнее и не предполагает самовольного захвата.
- source_word: נַחֲלָתָם
  choice: свой удел
  rationale: נחלה обозначает наследственное земельное владение, выделенное колену. «Удел» сохраняет смысл распределённой земли и звучит естественно в данном повествовании.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: за Иорданом, к востоку
  rationale: Передаёт как выражение «по ту сторону Иордана», так и уточняющее направление на восток; примечание поясняет точную географическую перспективу.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Сохраняет сравнительно-подтверждающую связь и намеренный повтор сообщения о даровании удела Моисеем.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: «Слуга» естественно передаёт почётное обозначение Моисея, а личное имя Яхве непосредственно представляет тетраграмматон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано принятой современной русской транслитерацией «Яхве», а не заменено титулом.
- issue: Повтор слов о даровании удела Моисеем
  choice: сохранить повтор
  alternative: устранить повтор как стилистически избыточный
  rationale: Повтор присутствует в еврейском тексте и связывает владение землёй с дарованием Моисея как слуги Яхве; его устранение ослабило бы смысловой акцент оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Использованы понятные названия племенных групп и естественное сочетание «получили свой удел»; синтаксический повтор оригинала намеренно сохранён.
