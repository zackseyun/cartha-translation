lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Вот земли, которые
  rationale: Еврейское сочетание вводит итоговое указание на ранее перечисленные земельные владения. Добавление «земли» делает подразумеваемый референт ясным и естественным по-русски.
- source_word: נִחַל
  choice: распределил в наследие
  rationale: Каузативная форма глагола נחל в контексте раздела земли обозначает наделение наследственным владением; перевод сохраняет и идею распределения, и тему наследия.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עֲרָבוֹת обозначает равнинную степную местность; «равнины Моава» — понятная и устоявшаяся географическая формулировка.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: за Иорданом
  rationale: Стандартная географическая формула; «за Иорданом» естественно передаёт её по-русски, не устраняя присущую выражению зависимость от точки отсчёта.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: к востоку от Иерихона
  rationale: Передаёт направление и уточняет, о какой стороне Иордана идёт речь.
