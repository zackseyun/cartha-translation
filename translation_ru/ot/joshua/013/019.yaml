  yaml_path: translation/ot/joshua/013/019.yaml
  text: and Kiriathaim[a], and Sibmah, and Zereth-shahar on the hill of the valley,
translation:
  language: ru
  text: Кирьятаим, Сивма и Церет-Шахар[a] на горе в долине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если передать значение второй части названия: «Церет рассвета».'
    reason: 'Лексическая альтернатива: הַשַּׁחַר означает «рассвет», но в перечне городов всё сочетание, вероятнее всего, является топонимом.'
lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Кирьятаим
  rationale: Географическое название передано транслитерацией; форма отражает древнееврейское двойственное окончание и соответствует употребительной русской библейской традиции.
- source_word: שִׂבְמָה
  choice: Сивма
  rationale: Топоним передан транслитерацией; שׂ соответствует русскому «с», а ב без дагеша — «в».
- source_word: צֶרֶת הַשַּׁחַר
  choice: Церет-ха-Шахар
  rationale: Сочетание рассматривается как составной топоним и транслитерируется, поскольку стоит в перечне городов; дефисы показывают единство названия.
- source_word: בְּהַר הָעֵמֶק
  choice: на горе у долины
  rationale: Предлог ב передан локативно как «на»; הַר означает «гора/возвышенность», а конструкция с הָעֵמֶק допускает буквальное «гора долины». Естественное «у долины» сохраняет топографическую связь, не создавая неясного русского сочетания.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая структура перечня сохранена. Союз перед первым названием опущен как зависимый от предыдущего стиха, но внутренний союз перед последним элементом передан. Топонимы транслитерированы без архаизации.
