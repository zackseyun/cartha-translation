  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: ru
  text: Теперь раздели эту землю в удел девяти племенам и половине племени Манассии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Вводит следующую по ходу повествования повелительную речь. «Теперь» естественно передает переход; союз וְ отдельно не выражен, поскольку по-русски это утяжелило бы фразу.
- source_word: חַלֵּק
  choice: раздели
  rationale: Императив, обращенный к Иисусу Навину. «Раздели» прямо передает значение глагола, а распределение между получателями ясно из дальнейшей конструкции.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: Прямое дополнение, обозначающее обсуждаемую землю; «земля» сохраняет обычный для книги Иисуса Навина широкий смысл.
- source_word: בְּנַחֲלָה
  choice: в удел
  rationale: נַחֲלָה обозначает наследственный земельный удел. Устойчивое русское выражение «разделить в удел» сохраняет смысл распределяемого наследственного владения без лишней громоздкости.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: девяти племенам
  rationale: Предлог לְ указывает на получателей распределяемой земли; дательный падеж естественно передает это отношение по-русски.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: и половине племени
  rationale: Буквально конструкция означает «и половине племени». Такой вариант точен и естествен по-русски; термин «полуплемя» менее общеупотребителен.
- source_word: הַמְנַשֶּׁה
  choice: Манассии
  rationale: Название племени передано традиционной русской формой имени; родительный падеж зависит от слова «племени».
