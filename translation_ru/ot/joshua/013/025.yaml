base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: ru
  text: Их владение включало Иазер, все города Галаада и половину земли аммонитян — до Ароера, который находится напротив Раввы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который перед Раввой»; возможный перевод: «который обращён к Равве».'
    reason: Лексическая и пространственная неоднозначность еврейского оборота עַל־פְּנֵי.
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Их владение включало
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию. Поскольку далее перечисляются входящие в удел места, «владение включало» естественно передаёт территориальный смысл конструкции.
- source_word: יַעְזֵר
  choice: Иазер
  rationale: Традиционная русская библейская передача географического названия.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: все города Галаада
  rationale: עָרֵי допускает значения «города» и «селения»; «города» соответствует стилю перечня территорий, а «Галаад» — закрепившаяся русская форма названия.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: и половину земли аммонитян
  rationale: בְּנֵי עַמּוֹן здесь является этногеографическим обозначением аммонитян; буквальное «сынов Аммона» в современном русском менее естественно.
- source_word: עַד עֲרוֹעֵר
  choice: до Ароера
  rationale: עַד отмечает предел территории; «до» кратко и точно передаёт географическую границу. «Ароер» — традиционная русская форма топонима.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: что напротив Раввы
  rationale: Идиома עַל־פְּנֵי выражает положение перед чем-либо, лицом к нему или напротив него. «Напротив» сохраняет пространственную неопределённость и не вводит отсутствующего в тексте направления.
