lexical_decisions:
- source_word: וַיִּתֵּן
  choice: дал надел
  rationale: В контексте распределения земли נתן обозначает передачу удела. В еврейском объект не назван, но по контексту подразумевается земля; добавление «надел» делает русскую фразу естественной и не меняет смысла.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: לְמַטֵּה גָד
  choice: племени Гада
  rationale: מַטֶּה здесь означает не посох, а племя как территориально-родовую общность.
- source_word: לִבְנֵי גָד
  choice: потомкам Гада
  rationale: Буквально «сынам Гада», но в племенной формуле выражение обозначает членов или потомков рода; «потомкам» естественно передаёт это значение по-русски.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה в контексте раздела земли означает родовое подразделение племени; предлог לְ имеет распределительное значение.
