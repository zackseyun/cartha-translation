  terminology: «Иисус Навин» соответствует устойчивой русской библейской ономастике; «Яхве» последовательно передаёт тетраграмматон. «Овладеть» уместно для ירשׁ в данном контексте, а примечание корректно сохраняет возможный наследственный оттенок.
