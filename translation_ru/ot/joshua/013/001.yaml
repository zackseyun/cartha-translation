  source_fidelity: Перевод точно передаёт повторяющееся описание преклонного возраста Иисуса Навина, личное имя יהוה («Яхве»), а также мысль о значительной части земли, которой ещё надлежит овладеть. Конструкция «которой предстоит овладеть» естественно передаёт инфинитив לְרִשְׁתָּהּ, не называя действующее лицо и не сужая значение до одного лишь военного завоевания.
