source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: ru
  text: 'Иисус Навин был стар и достиг преклонных лет. Яхве сказал ему: «Ты состарился и достиг преклонных лет, а земли, которой предстоит овладеть[a], осталось ещё очень много».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получить в наследие». Еврейский глагол может обозначать вступление во владение землёй как наследием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использовано укоренившееся в русской библейской традиции имя, однозначно обозначающее сына Навина и естественно воспринимаемое русским читателем.
- source_word: זָקֵן
  choice: был стар
  rationale: Предикативное прилагательное прямо описывает возраст Иисуса Навина; перевод сохраняет простоту исходной формулировки.
- source_word: בָּא בַּיָּמִים
  choice: достиг преклонных лет
  rationale: Еврейская идиома буквально означает «вошёл в дни» и указывает на преклонный возраст; выбран современный и достойный русский эквивалент.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים
  choice: Ты состарился и достиг преклонных лет
  rationale: Сохранено намеренное повторение повествовательного описания в прямой речи; форма «состарился» отражает перфект זקנתה.
- source_word: הָאָרֶץ
  choice: земли
  rationale: Контекст говорит о земле, которой Израилю ещё предстояло овладеть; русская форма естественно включена в количественную конструкцию «много земли».
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: осталось ещё очень много
  rationale: Передаёт состояние оставшейся земли и усиление, выраженное сочетанием הרבה מאד.
- source_word: לְרִשְׁתָּהּ
  choice: которой предстоит овладеть
  rationale: Глагол ירשׁ здесь обозначает вступление во владение землёй; конструкция сохраняет неопределённого коллективного деятеля и не приписывает задачу одному Иисусу Навину.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл ירשׁ применительно к земле
  choice: овладеть
  alternative: получить в наследие
  rationale: Непосредственный контекст подчёркивает ещё не занятую землю, поэтому основной текст передаёт вступление во владение, а присущий слову оттенок наследования сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены повтор описания возраста и усиление «ещё очень много»; буквальная еврейская идиома «вошёл в дни» заменена ясным русским выражением.
