translation:
  language: ru
  text: Границей потомков Рувима служили Иордан и его граница[a]. Это удел потомков Рувима по их родам — города и их селения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «границей потомков Рувима был Иордан». Еврейское выражение «Иордан и граница» кратко и может означать, что Иордан служил пограничной линией.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: был
  rationale: В формуле описания границ глагол היה констатирует, что служило границей, а не подчёркивает её возникновение.
- source_word: גְּבוּל
  choice: границей
  rationale: В данном географическом контексте слово обозначает рубеж, ограничивающий племенной удел.
- source_word: בְּנֵי רְאוּבֵן
  choice: потомков Рувима
  rationale: Естественная современная передача родоплеменного выражения «сыновья Рувима», не создающая впечатления, будто речь идёт лишь о непосредственных сыновьях.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: Иордан с его берегами
  rationale: Компактное еврейское выражение буквально соединяет Иордан и «границу/край». В контексте оно, вероятно, указывает на реку вместе с её прибрежной линией; возможное понимание Иордана как самой границы отмечено в сноске.
- source_word: נַחֲלַת
  choice: удел
  rationale: «Удел» естественно и точно обозначает земельное наследственное владение, распределённое между племенами.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת здесь обозначает внутренние родовые подразделения племени; русское «роды» сохраняет этот смысл и подходит к контексту распределения земли.
- source_word: הֶעָרִים
  choice: города
  rationale: Стандартное соответствие עָרִים в перечнях земельных уделов.
- source_word: וְחַצְרֵיהֶן
  choice: и окружающие их селения
  rationale: חֲצֵרִים обозначает зависимые неукреплённые поселения при названных городах; добавление «окружающие» ясно выражает их территориальную связь, не превращая их в части самих городов.
