base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: ru
  text: 'Моисей дал удел половине племени Манассии, и он достался половине племени потомков Манассии, по их родам:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: дал
  rationale: Передаёт обычное значение נתן в повествовании о распределении земли; подразумеваемый объект «удел» выражен по-русски для ясности.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: половине племени Манассии
  rationale: חֲצִי означает «половина», а שֵׁבֶט здесь обозначает племя как территориально-родовую общность.
- source_word: וַיְהִי
  choice: вот что досталось
  rationale: В формуле распределения земли глагол היה вводит описание удела, полученного названной группой. Формулировка естественно связывает стих с последующим перечнем и не уточняет содержание удела сверх контекста.
- source_word: מַטֵּה
  choice: племя
  rationale: В данном административно-родовом контексте מַטֶּה означает «племя», а не буквальный «посох».
- source_word: בְנֵי מְנַשֶּׁה
  choice: потомков Манассии
  rationale: Буквально «сыновей Манассии»; здесь выражение обозначает его племенных потомков, поэтому «потомков» ясно передаёт смысл по-русски.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת здесь — родовые подразделения племени, а предлог לְ имеет распределительное значение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Племя» предпочтено более архаичному «колено», а «роды» сохраняет структуру родовых подразделений. Двоеточие оставлено, поскольку следующий стих раскрывает состав удела.
