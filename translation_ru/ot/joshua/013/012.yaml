  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: ru
  text: всё царство Ога в Васане, который царствовал в Астарофе и Едрее, — он был одним из оставшихся рефаимов[a]. Моисей поразил их и лишил их владений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великанов». Еврейское слово «рефаимы», вероятно, является названием древнего народа.'
    reason: 'Лексическая альтернатива: традиционное толкование термина наряду с сохранённым названием группы.'
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: всё царство Ога в Васане
  rationale: Сочетание כָּל с существительным в единственном числе обозначает всю совокупность владений; предлог בְּ перед Васаном имеет прямое пространственное значение.
- source_word: אֲשֶׁר מָלַךְ
  choice: царствовавшего
  rationale: Причастный оборот естественно связывает относительное предложение с Огом и сохраняет царский оттенок глагола מלך.
- source_word: בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: в Астарофе и Едрее
  rationale: Оба названия переданы как географические имена с сохранением локативного значения предлогов.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: Он оставался из остатка рефаимов
  rationale: 'Формулировка сохраняет несколько необычную конструкцию оригинала: Ог принадлежал к тому, что ещё оставалось от рефаимов; слово «один» не добавляется, поскольку его нет в еврейском тексте.'
- source_word: הָרְפָאִים
  choice: рефаимов
  rationale: Термин сохранён как название древней группы, а не истолкован непосредственно как «великаны».
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: Моисей поразил их
  rationale: Глагол נכה в военном контексте означает нанести поражение или поразить; множественный суффикс сохранён.
- source_word: וַיֹּרִשֵׁם
  choice: и лишил их владений
  rationale: Каузативная форма ירשׁ здесь означает лишить прежних жителей их владения; перевод передаёт результат завоевания без неуместного значения «унаследовать».
theological_decisions:
- issue: Передача רְפָאִים
  choice: рефаимы
  alternative: великаны
  rationale: Транслитерация сохраняет этнографическую неопределённость термина и связь с другими местами Писания, не навязывая теорию о природе этой группы.
translation_notes:
  register: 'Современный литературный русский язык с умеренно высоким библейским регистром. Названия переданы в привычных русских формах: Ог, Васан, Астароф, Едрей. Синтаксис слегка упрощён для ясности, но референциальная неоднозначность множественного «их» сохранена.'
