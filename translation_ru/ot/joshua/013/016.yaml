base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: ru
  text: Их граница простиралась от Ароэра, расположенного на краю долины Арнона[a], включая город посреди долины, и по всему плоскогорью[b] до Медевы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נַחַל может обозначать поток, пересыхающее русло, долину или ущелье.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «равнине»; здесь имеется в виду ровная возвышенная местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Их граница шла
  rationale: Естественная для русского языка формула описания территориальной границы, сохраняющая значение הַגְּבוּל без превращения его в более широкое понятие «удел».
- source_word: מֵעֲרוֹעֵר
  choice: от Ароэра
  rationale: Предлог מִן обозначает исходную точку границы; название передано традиционной русской транслитерацией.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: расположенного на краю ущелья Арнон
  rationale: שְׂפַת буквально указывает на край или берег, а נַחַל здесь обозначает русло-ущелье Арнона; «ущелье» ясно передаёт местный рельеф, при этом лексическая широта слова отмечена в сноске.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: мимо города посреди ущелья
  rationale: בְּתוֹךְ передаёт положение внутри, в середине ущелья. «Мимо» естественно связывает этот ориентир с русским выражением «граница шла», не утверждая сверх текста, что город был отдельной конечной точкой.
- source_word: וְכָל הַמִּישֹׁר
  choice: и по всему плоскогорью
  rationale: מִישֹׁר в данном заиорданском контексте означает ровную возвышенную местность; «плоскогорье» точнее простого «равнина».
- source_word: עַל מֵידְבָא
  choice: до Медевы
  rationale: В описании границ עַל указывает на протяжённость вплоть до названного места; «до» кратко и естественно выражает этот смысл.
