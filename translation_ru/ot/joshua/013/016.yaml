revisions:
- from: Их граница шла от Ароэра, расположенного на краю ущелья Арнон[a], мимо города посреди ущелья и по всему плоскогорью[b] до Медевы.
  to: Их граница простиралась от Ароэра, расположенного на краю долины Арнона[a], включая город посреди долины, и по всему плоскогорью[b] до Медевы.
  rationale: Исправлено только добавленное черновиком «мимо», которое меняло пространственное отношение к городу. «Ущелье Арнон» заменено на более нейтральное «долина Арнона», без утраты географического смысла и при сохранении лексической альтернативы в сноске. Смысл, перечислительная структура и все сносковые якоря сохранены.
