  yaml_path: translation/ot/joshua/013/015.yaml
  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
translation:
  language: ru
  text: И дал Моисей колену сынов Рувима по их родам:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колену Рувимову». Буквально с древнееврейского: «колену сынов Рувима».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: И дал
  rationale: Форма wayyiqtol от נתן продолжает последовательное повествование; «И дал» естественно передаёт этот переход, не привнося дополнительного временного оттенка.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: לְמַטֵּה
  choice: колену
  rationale: В контексте распределения земли מַטֶּה означает «колено», а предлог לְ обозначает получателя.
- source_word: בְנֵי רְאוּבֵן
  choice: сынов Рувима
  rationale: Сохраняет буквальный древнееврейский оборот родства и при этом соответствует традиционному, понятному русскому библейскому словоупотреблению.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה обозначает родовые подразделения внутри колена; конструкция с לְ здесь имеет распределительный смысл, естественно передаваемый как «по их родам».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Формула «колено сынов Рувима» сохраняет структуру оригинала; «по их родам» кратко и естественно передаёт распределение удела по родовым подразделениям.
