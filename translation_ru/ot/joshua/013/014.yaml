lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничительно-исключительное значение частицы в контексте распределения земли.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: колену Левия
  rationale: Естественная русская передача дательного отношения при глаголе «дал»; традиционное библейское обозначение племени сохранено.
- source_word: לֹא נָתַן נַחֲלָה
  choice: он не дал удела
  rationale: «Удел» точно и естественно обозначает наследственную долю земли в данном контексте.
- source_word: אִשֵּׁי יְהוָה
  choice: приношения, сжигаемые в огне для Яхве
  rationale: Передаёт связь אִשֵּׁי с огнём и жертвоприношением, не подменяя её более общим понятием пищи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Естественно передаёт еврейскую сопряжённую конструкцию и приложение к имени Яхве.
- source_word: הוּא נַחֲלָתוֹ
  choice: вот его удел
  rationale: Сохраняет грамматическое единственное число הוּא и допускает собирательное понимание предшествующих приношений, не устраняя синтаксическое напряжение.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: как Он сказал ему
  rationale: Сохраняет буквальное значение глагола «говорить», не усиливая его до «обещал»; местоимение «ему» оставляет корпоративное указание на Левия/его колено.
theological_decisions:
- issue: Что является уделом Левия
  choice: приношения, сжигаемые в огне для Яхве, — вот его удел
  alternative: Сам Яхве, Бог Израиля, — его удел
  rationale: Ближайшим предшествующим выражением в данном стихе являются огненные приношения; основной текст следует непосредственному синтаксису, а распространённое прочтение в свете соседних мест сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Термин «удел» сохранён как понятный и контекстуально точный; личное имя Бога передано как «Яхве». Заглавное «Он» в заключительной фразе помогает обозначить Бога как наиболее вероятного говорящего, не разворачивая подразумеваемый субъект в отдельное толкование.
