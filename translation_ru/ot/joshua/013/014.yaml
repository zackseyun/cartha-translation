    rationale: Термин обозначает огненные приношения как культовую категорию. Формулировка о сжигании сообщает процессуальное значение, которое не следует навязывать каждому виду приношения, и ослабляет компактную конструкцию оригинала.
  - severity: low
    issue: «вот его удел» добавляет указательную окраску
    rationale: Еврейское הוּא в этой именной конструкции не требует русского «вот»; простое тире точнее и естественнее.
  - severity: low
