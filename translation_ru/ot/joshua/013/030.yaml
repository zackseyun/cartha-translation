translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Конструкция «простирались от… и включали…» устраняет возможное ложное восприятие последующих географических единиц как несвязного перечня, сохраняя исходную последовательность. Имена переданы в традиционных русских формах: Маханаим, Васан, Ог, Иаир.'
