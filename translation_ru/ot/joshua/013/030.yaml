  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: ru
  text: Их владения простирались от Маханаима и включали весь Васан, всё царство Ога, царя Васана, и все селения Иаира[a] в Васане, которых насчитывалось шестьдесят городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хаввот-Иаир» — традиционная передача еврейского названия этих поселений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: их владения
  rationale: В контексте распределения земли גְּבוּל обозначает не только линию границы, но и ограниченную ею территорию; «владения» естественно передаёт выделенную племени область.
- source_word: מִמַּחֲנַיִם
  choice: простирались от Маханаима
  rationale: Предлог מִן указывает на исходный пункт территориального описания. Добавление «простирались» делает синтаксическую связь ясной по-русски, не меняя пространственного смысла.
- source_word: כָּל הַבָּשָׁן
  choice: весь Васан
  rationale: Передаёт полный охват, выраженный כָּל, и использует традиционную русскую форму географического названия.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: всё царство Ога, царя Васана
  rationale: מַמְלְכוּת означает царство или царскую область; приложение «царя Васана» сохранено без конфессиональной интерпретации.
- source_word: חַוֹּת יָאִיר
  choice: селения Иаира
  rationale: חַוּוֹת здесь обозначает поселения, связанные с Иаиром. «Селения» понятно современному читателю и не преувеличивает их размеры; традиционная транслитерация дана в сноске.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: в Васане
  rationale: Местоположение поселений естественно и без потери смысла передаётся по-русски предложным оборотом; относительное местоимение можно не выражать отдельно.
- source_word: שִׁשִּׁים עִיר
  choice: шестьдесят городов
  rationale: עִיר может означать город или укреплённое поселение; «города» соответствует форме исходного текста и обычной лексике территориальных перечней, не обязательно подразумевая современные крупные города.
