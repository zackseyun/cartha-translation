source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: ru
  text: и все города Сигона, царя аморреев, который царствовал в Есевоне, вплоть до границы сынов Аммона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «аммонитян». Буквально: «сынов Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: и все
  rationale: Союз וְ связывает фразу с предшествующим перечислением земель, а כֹל выражает полноту охвата.
- source_word: עָרֵי
  choice: города
  rationale: Форма сопряжённого множественного числа от עִיר в перечне владений естественно передаётся словом «города».
- source_word: סִיחוֹן
  choice: Сигон
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: царя аморреев
  rationale: Передаёт сопряжённую конструкцию и естественно обозначает Сигона как царя народа аморреев.
- source_word: אֲשֶׁר מָלַךְ
  choice: который царствовал
  rationale: Глагол מָלַךְ обозначает царствование; относительная конструкция сохранена без смыслового расширения.
- source_word: בְּ/חֶשְׁבּוֹן
  choice: в Есевоне
  rationale: Предлог בְ указывает на место царствования; «Есевон» — устоявшаяся русская библейская форма топонима.
- source_word: עַד גְּבוּל
  choice: вплоть до границы
  rationale: עַד обозначает предел территориального охвата; «вплоть до» ясно и естественно выражает этот оттенок.
- source_word: בְּנֵי עַמּוֹן
  choice: сынов Аммона
  rationale: Сохранена буквальная филиальная форма еврейского этнонима; более гладкий этнический эквивалент дан в сноске.
