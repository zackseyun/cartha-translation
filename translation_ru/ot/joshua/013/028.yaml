lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное местоимение женского рода подводит итог только что описанному уделу. Русское «вот» естественно для итоговой формулы и не требует вносить отсутствующую в древнееврейском тексте временную связку «было/есть».
- source_word: נַחֲלַת
  choice: наследие
  rationale: Слово обозначает наследственный земельный удел; «наследие» сохраняет связь с дарованной и полученной во владение землёй, не сводя значение лишь к административному распределению.
- source_word: בְּנֵי גָד
  choice: сынов Гада
  rationale: Сохранено традиционное родословное обозначение племени, достаточно ясное в библейском контексте.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Предлог לְ выражает распределение по группам, а מִשְׁפָּחוֹת — родовые подразделения внутри племени. «По их родам» точно и естественно в контексте раздела земли.
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное обозначение укреплённых или иных постоянных населённых пунктов в перечнях земельных уделов.
- source_word: וְחַצְרֵיהֶם
  choice: и селения при них
  rationale: חֲצֵרִים в формуле земельного перечня обозначает зависимые сельские поселения, относившиеся к названным городам. «Селения при них» яснее передаёт эту связь, чем просто «их селения».
