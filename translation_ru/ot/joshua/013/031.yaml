  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: ru
  text: а также половина Галаада, Аштарот и Едрея — города царства Ога в Васане — достались потомкам Махира, сына Манассии, — половине потомков Махира, по их родам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: а также половина Галаада
  rationale: Союз ו продолжает перечень удела из предыдущего стиха; «а также» естественно передаёт это присоединение. חֲצִי обозначает половину территории, а Галаад — закрепившееся русское название.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: Аштарот и Едреи
  rationale: Использованы традиционные русские формы географических названий; множественная по форме Аштарот здесь является названием города.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: города царства Ога в Васане
  rationale: Прямо сохранена конструкция «города царства», без сужения смысла до столичных или царских городов. «В Васане» относится к царству Ога.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: достались потомкам Махира, сына Манассии
  rationale: Предлог ל обозначает назначение удела; добавленное сказуемое «достались» естественно выражает смысл безглагольной еврейской фразы. בנים в родословно-племенном контексте шире непосредственных сыновей, поэтому по-русски ясно передано как «потомки».
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: а именно половине потомков Махира
  rationale: Повторное ל уточняет получателей предыдущего выражения. «А именно» естественно обозначает пояснение; слово «колено» не добавляется, поскольку его нет в оригинале.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: В контексте распределения земли מִשְׁפָּחוֹת обозначает родовые подразделения племени; «роды» точнее современного бытового «семьи».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксическое пояснение «а именно» делает ясным, что половина потомков Махира уточняет более широкое обозначение получателей. Тире выделяют приложение о городах царства Ога.
