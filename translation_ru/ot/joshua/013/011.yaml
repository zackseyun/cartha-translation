  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: ru
  text: и Галаад, и территория гешуритян и маахитян, и всю гору Ермон[a], и весь Васан до Салхи —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «всю гору Ермон»; речь может идти обо всём горном массиве Ермон, а не только об одной вершине.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Галаад
  rationale: Устоявшееся русское название области; еврейский определённый артикль перед географическим именем отдельно не передаётся.
- source_word: גְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: владения гешурцев и маахатян
  rationale: גְּבוּל может обозначать как границу, так и территорию. В перечне земель естественнее территориальное значение; собирательные формы названий народов переданы русским множественным числом.
- source_word: כֹל הַר חֶרְמוֹן
  choice: всю гору Ермон
  rationale: Сохраняет прямую форму еврейского текста; сочетание может охватывать весь горный массив, что отмечено в сноске.
- source_word: כָל הַבָּשָׁן
  choice: весь Васан
  rationale: Устоявшееся русское географическое имя с сохранением значения полноты у כָּל.
- source_word: עַד סַלְכָה
  choice: до Салхи
  rationale: עַד обозначает предел территории; форма «Салхи» естественно склоняет традиционное русское название Салха.
