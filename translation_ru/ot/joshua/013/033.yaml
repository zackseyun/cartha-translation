  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: ru
  text: 'Но колену Левия Моисей не дал наследия: Яхве, Бог Израиля, — их наследие, как Он сказал им.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Но колену Левия
  rationale: Союз ו в контексте противопоставляет левитов другим коленам, получившим земельные уделы; «колено Левия» естественно обозначает весь родовой коллектив.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: Моисей не дал наследия
  rationale: Прямая конструкция сохраняет простое прошедшее действие и отрицание. «Наследие» передаёт как земельный удел, так и богословскую связь со вторым употреблением слова в стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в древнееврейском тексте и не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная русская передача сопряжённой конструкции, сохраняющая заветное отождествление.
- source_word: הוּא נַחֲלָתָם
  choice: — их наследие
  rationale: Именное сказуемое с тире естественно по-русски; явное הוּא отражено конструктивным выделением. Повтор «наследие» сохраняет намеренную лексическую связь.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: как Он и говорил им
  rationale: «Говорил» близко к דבר и не усиливает высказывание до «обещал»; частица «и» естественно передаёт подтверждающий оттенок כַּאֲשֶׁר.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Характер наследия колена Левия
  choice: Сохранено буквальное утверждение, что Сам Яхве — их наследие
  alternative: Яхве — их удел
  rationale: Текст не сводит наследие левитов к служебным правам или материальному обеспечению. Повтор одного русского слова сохраняет богословское напряжение между отсутствием земельного наследия и Самим Богом как наследием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен для обычного читателя; двоеточие раскрывает причину отсутствия земельного наследия, а тире оформляет именное сказуемое.
