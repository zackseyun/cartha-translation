  text: וּ/מֵ/חֶשְׁבּ֛וֹן עַד רָמַ֥ת הַ/מִּצְפֶּ֖ה וּ/בְטֹנִ֑ים וּ/מִֽ/מַּחֲנַ֖יִם עַד גְּב֥וּל לִדְבִֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: ru
  text: и от Хешбона до Рамат-Мицпы и Бетонима, и от Маханаима до границы Девира.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до границы по направлению к Девиру». Еврейская конструкция допускает значение направления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: и от Хешбона
  rationale: 'Союз ו и предлог מִן передают начало нового отрезка границы: «и от». Название места транслитерировано в принятой русской библейской форме.'
- source_word: עַד
  choice: до
  rationale: В описании границ עַד обозначает предел или протяжённость; естественный русский эквивалент — «до».
- source_word: רָמַת הַ/מִּצְפֶּה
  choice: Рамат-Мицпы
  rationale: Сочетание функционирует как топоним. Сохранена транслитерация составного названия; падежная форма обусловлена предлогом «до».
- source_word: וּ/בְטֹנִים
  choice: и Бетонима
  rationale: Географическое название передано транслитерацией, а форма родительного падежа согласована с продолжающим действовать предлогом «до».
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: и от Маханаима
  rationale: 'Союз, предлог и топоним переданы прямо: «и от Маханаима».'
- source_word: גְּב֥וּל
  choice: границы
  rationale: В контексте распределения земель גְּבוּל обозначает территориальную границу; после «до» употреблён родительный падеж.
- source_word: לִדְבִר
  choice: Девира
  rationale: После גְּבוּל предлог ל с топонимом допускает понимание принадлежности или направленности. В основном тексте выбрана естественная для русского территориального перечня конструкция «граница Девира».
