lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: земля гевалитов
  rationale: Сочетание обозначает территорию народа, связанного с Гевалом; «земля гевалитов» естественно передаёт и географический, и этнический смысл.
- source_word: וְכָל הַלְּבָנוֹן
  choice: и весь Ливан
  rationale: Сохраняет всеохватность כָל и обычное русское географическое название.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: к востоку
  rationale: Еврейское выражение буквально связано с восходом солнца, но в данном описании границ естественно обозначает восточное направление; перевод сохраняет географический смысл без неестественного буквализма.
- source_word: מִבַּעַל גָּד
  choice: от Баал-Гада
  rationale: Топоним передан транслитерацией и поставлен в требуемую русским управлением форму.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: у подножия горы Ермон
  rationale: В географическом контексте תַּחַת указывает на положение ниже горы; «у подножия» звучит естественно и ясно, не меняя функции ориентира.
- source_word: עַד לְבוֹא חֲמָת
  choice: до Лево-Хамата
  rationale: В основном тексте выражение принято как составной топоним, поскольку здесь оно служит обозначением пограничного пункта; возможное описательное прочтение сохранено в сноске.
