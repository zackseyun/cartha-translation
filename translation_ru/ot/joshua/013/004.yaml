  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: ru
  text: С юга — вся земля хананеев и Меара[a], принадлежащая сидонянам, до Афека, до границы амореев.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пещера, принадлежащая сидонянам», если מְעָרָה понимать как нарицательное существительное, а не как название места.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте этнонимы «хананеянин» и «аморей» стоят в единственном числе, но имеют собирательное значение.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: с юга
  rationale: תֵּימָן обычно обозначает юг или южную сторону; в перечне территориальных пределов естественнее всего направительно-географическое значение, а не топоним Феман.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: вся земля хананеев
  rationale: Еврейская форма буквально стоит в единственном числе — «хананеянин», но имеет собирательное значение. Русское множественное число естественно передаёт этническую совокупность и сохраняет отличие от выражения «земля Ханаанская».
- source_word: וּמְעָרָה
  choice: и Меара
  rationale: Форму вероятнее понимать как название места в ряду географических ориентиров. Транслитерация не навязывает значение нарицательного מְעָרָה «пещера»; эта подлинная лексическая неоднозначность отражена в примечании.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: принадлежащая сидонянам
  rationale: Предлог ל выражает принадлежность или отношение; причастный оборот звучит естественно в современном литературном русском языке.
- source_word: עַד אֲפֵקָה
  choice: до Афека
  rationale: עַד указывает предел, а направительный суффикс в אֲפֵקָה согласуется с передачей конечной точки посредством «до».
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: до границы амореев
  rationale: גְּבוּל в описании земель означает границу или предел. Единственное этническое наименование הָאֱמֹרִי имеет собирательную силу, естественно передаваемую русским множественным числом.
