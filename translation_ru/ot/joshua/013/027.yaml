base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: ru
  text: 'и в долине: Бет-Харам, Бет-Нимра, Суккот и Цафон — остальная часть царства Сихона, царя Хешбона, с Иорданом как границей до края моря Киннерет, за Иорданом к востоку.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָעֵמֶק
  choice: и в долине
  rationale: עֵמֶק обозначает долину или низменность; здесь это географическая область, в которой расположены перечисленные города.
- source_word: בֵּית הָרָם וּבֵית נִמְרָה וְסֻכּוֹת וְצָפוֹן
  choice: Бет-Харам, Бет-Нимра, Суккот и Цафон
  rationale: Все четыре слова в данном перечне являются географическими названиями. Формы переданы транслитерацией с еврейского; צָפוֹן здесь название города, а не указание «север».
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: остальная часть царства Сихона, царя Хешбона
  rationale: יֶתֶר означает остаток или оставшуюся часть, а מַמְלָכוּת в контексте естественно передаётся словом «царство».
- source_word: הַיַּרְדֵּן וּגְבֻל
  choice: границей служил Иордан
  rationale: Сжатая еврейская конструкция указывает, что Иордан являлся границей описываемой территории; русская формулировка делает эту связь явной без изменения смысла.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: вплоть до нижнего края моря Киннерет
  rationale: קְצֵה означает край, конец или оконечность. В географическом описании Иорданской долины «нижний край» ясно передаёт вероятный южный конец озера, при этом буквальная возможность отмечена в сноске.
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: на восточной стороне Иордана
  rationale: Устойчивая территориальная формула обозначает область за Иорданом с восточной стороны; выбранная русская форма однозначно передаёт направление.
