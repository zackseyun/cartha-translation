lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: וְכָל עָרֶיהָ
  choice: и все его города
  rationale: Местоименный суффикс женского рода относится к городу Хешбону; в современном русском названию города соответствует местоимение мужского рода.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: на плоскогорье
  rationale: В данном географическом контексте מִישׁוֹר обозначает ровную возвышенную область Заиорданья, а не низменную равнину.
- source_word: דִּיבוֹן
  choice: Дивон
  rationale: Географическое название передано традиционной русской библейской формой.
- source_word: וּבָמוֹת בַּעַל
  choice: Бамот-Баал
  rationale: В контексте перечня городов это единое географическое название, поэтому оно транслитерировано, а не переведено как нарицательное сочетание.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: Бет-Баал-Меон
  rationale: Составное географическое название транслитерировано целиком; בֵּית здесь является частью топонима и не переводится словом «дом».
