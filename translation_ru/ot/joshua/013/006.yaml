  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: ru
  text: Всех жителей горной страны от Ливана до Мисрефот-Маима[a], всех сидонян, Я Сам изгоню перед сынами Израиля[b]. Только распредели эту землю Израилю в наследие[c], как Я повелел тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мисрефот-Маим — название местности; возможно, оно означает нечто вроде «горения вод», но точный смысл неизвестен.
    reason: cultural_note
  - marker: b
    text: 'Или: «лишу их владений перед сынами Израиля».'
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол относится к распределению земли, обычно посредством жребия.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: жителей горной страны
  rationale: В территориальном контексте הָהָר обозначает горную область, а не одну отдельную гору; выбран естественный русский географический оборот.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: от Ливана до Мисрефот-Маима
  rationale: Оба выражения выступают как географические названия; второе передано транслитерацией без предположительного перевода его неясной этимологии.
- source_word: כָּל צִידֹנִים
  choice: всех сидонян
  rationale: Форма обозначает совокупность жителей Сидона и сохраняет охват, выраженный כָּל.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: Я Сам изгоню
  rationale: Самостоятельное местоимение אָנֹכִי придаёт субъекту эмфазу, а Hiphil ירשׁ в данном контексте означает изгнать или лишить владения.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед сынами Израиля
  rationale: Сохранён пространственно-реляционный образ еврейского оборота и буквальная филиальная форма בְּנֵי יִשְׂרָאֵל.
- source_word: הַפִּלֶהָ
  choice: распредели эту землю
  rationale: Каузатив от נפל относится к распределению земли посредством жребия. Явное «эту землю» естественно передаёт женский объектный суффикс, отсылающий к земле.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: Израилю в наследие
  rationale: נַחֲלָה означает наследственный удел или владение; «в наследие» сохраняет земельно-правовой и богословский оттенок.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: как Я повелел тебе
  rationale: Совершенная форма указывает на уже данное Иисусу Навину повеление; прошедшее время естественно передаёт это по-русски.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранена выраженная в исходном тексте филиальная, мужская форма без нейтрализации; оборот остаётся понятным в современном литературном русском.
- issue: Передача נַחֲלָה в контексте распределения земли
  choice: наследие
  alternative: владение; удел
  rationale: «Наследие» сохраняет представление о дарованной земле как наследственном достоянии, не добавляя конфессионально обусловленного толкования.
- issue: Соотношение Божьего обещания и повеления Иисусу Навину
  choice: сохранены оба утверждения без устранения напряжения
  alternative: переформулировать так, будто изгнание уже завершено или полностью возложено на Израиль
  rationale: Текст одновременно обещает Божье изгнание народов и требует от Иисуса Навина распределить землю; перевод не сглаживает это сочетание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Эмфаза אָנֹכִי передана формой «Я Сам»; синтаксис упрощён ровно настолько, чтобы длинное перечисление оставалось ясным.
