base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/020.yaml
  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: ru
  text: и Бейт-Пеор, и склоны Писги[a], и Бейт-Иешимот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «источники Писги» либо «предгорья Писги». Значение еврейского топографического термина допускает несколько толкований.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Бейт-Пеор
  rationale: Географическое название передано транслитерацией с еврейского, а не буквальным переводом «дом Пеора».
- source_word: אַשְׁדּוֹת
  choice: склоны
  rationale: В данном топографическом перечне слово, вероятнее всего, обозначает склоны или уступы у Писги; при этом лексическая неоднозначность сохранена в сноске.
- source_word: הַפִּסְגָּה
  choice: Писги
  rationale: Слово употреблено как географическое имя; форма родительного падежа естественна после слова «склоны». Еврейский артикль отдельно не воспроизводится, как обычно бывает с именами собственными в русском языке.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Бейт-Иешимот
  rationale: Географическое название передано транслитерацией; буквальное значение компонентов не выдвигается на первый план в перечне городов.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Повтор союза «и» сохраняет перечислительную структуру еврейского текста; топонимы переданы непосредственно с древнееврейского. Маркер сноски поставлен при слове «склоны», к которому относится отмеченная неоднозначность.
