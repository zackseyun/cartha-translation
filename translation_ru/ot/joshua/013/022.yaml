lexical_decisions:
- source_word: וְ/אֶת
  choice: И
  rationale: Союз וְ добавляет Валаама к перечню побеждённых; אֶת служит показателем прямого дополнения и отдельно не переводится.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Валаама, сына Веорова
  rationale: Имя передано в принятой русской библейской форме; патроним сохранён естественной для литературного русского конструкцией.
- source_word: הַקּוֹסֵם
  choice: прорицателя
  rationale: קֹסֵם обозначает человека, занимающегося гаданием или прорицанием. «Прорицатель» кратко передаёт значение и сохраняет отрицательно окрашенную характеристику, не вводя дополнительных толкований.
- source_word: הָרְגוּ
  choice: убили
  rationale: Прямое и современное соответствие обычному глаголу со значением лишения жизни.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется конкретная форма древнееврейского выражения «сыновья Израиля»; «сыны Израиля» естественно звучит в dignified библейском повествовании и не сводит выражение к более общему «израильтяне».
- source_word: בַּחֶרֶב
  choice: мечом
  rationale: Инструментальный предлог בְ естественно передаётся русским творительным падежом; выражение указывает на насильственную смерть в ходе сражения.
- source_word: אֶל חַלְלֵיהֶם
  choice: среди прочих убитых ими
  rationale: Необычное сочетание אֶל с «убитыми» выражает связь или присоединение Валаама к числу павших от рук Израиля. Слово «прочих» делает этот смысл ясным по-русски, а альтернативная передача отмечена в сноске.
