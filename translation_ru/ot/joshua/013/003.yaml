  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: ru
  text: 'область от Шихора, что напротив Египта[a], до северной границы Экрона считается ханаанской: область пяти филистимских правителей — правителя Газы, Ашдода, Ашкелона, Гата и Экрона, а также аввеев.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед Египтом». Возможный географический смысл выражения обсуждается.'
    reason: Сохраняет буквальную форму и отмечает, что выражение не следует безоговорочно конкретизировать как «к востоку от Египта».
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: Шихор
  rationale: Название водоёма передано транслитерацией, поскольку его точное отождествление остаётся спорным.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: к востоку от Египта
  rationale: Буквально выражение означает «перед Египтом»; в данном географическом контексте оно указывает на местоположение восточнее Египта. Буквальный вариант сохранён в примечании.
- source_word: סַרְנֵי
  choice: правителей
  rationale: Особый филистимский титул передан нейтральным современным словом, не приравнивающим его без достаточных оснований к царю или князю.
- source_word: הָעַזָּתִי וְהָאַשְׁדּוֹדִי הָאֶשְׁקְלוֹנִי הַגִּתִּי וְהָעֶקְרוֹנִי
  choice: правителей Газы, Ашдода, Ашкелона, Гата и Экрона
  rationale: Еврейские определительные формы обозначают правителей соответствующих пяти филистимских городов; развёрнутая передача естественна и устраняет неясность русских прилагательных.
- source_word: הָעַוִּים
  choice: аввеев
  rationale: Этноним передан транслитерацией без попытки уточнить происхождение или статус народа.
theological_decisions:
- issue: Принадлежность перечисленной области
  choice: «эта земля считается ханаанской»
  alternative: «это считается принадлежащим ханаанеям»
  rationale: Женская форма לַכְּנַעֲנִי допускает подразумеваемое обозначение земли или области; выбран естественный русский вариант без изменения смысла.
- issue: Синтаксическая связь упоминания аввеев
  choice: «а также аввеев» в составе перечня данного стиха
  alternative: связать «аввеев» с указанием «на юге» в следующем стихе
  rationale: Масоретическое деление относит слово к завершению Нав 13:3, однако его точная синтаксическая связь с окружающим перечислением остаётся сжатой; перевод не добавляет им отдельного правителя.
translation_notes:
  register: Современный литературный русский язык с dignified библейским ритмом. Географические названия переданы близко к еврейской форме; синтаксис слегка развёрнут для ясности длинного перечня. Маркер [a] присутствует в основном тексте.
