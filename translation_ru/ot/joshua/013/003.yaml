revisions:
- from: 'от Шихора, расположенного к востоку от Египта[a], до границы Экрона на севере, — эта земля считается ханаанской, — владения пяти филистимских правителей: правителей Газы, Ашдода, Ашкелона, Гата и Экрона, а также аввеев.'
  to: 'область от Шихора, что напротив Египта[a], до северной границы Экрона считается ханаанской: область пяти филистимских правителей — правителя Газы, Ашдода, Ашкелона, Гата и Экрона, а также аввеев.'
