  text: 'Вот земля, которая остаётся: все области филистимлян[a] и вся земля гешурян[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все округа филистимлян». Еврейское גְּלִילוֹת обозначает территориальные области.'
