  - marker: b
    text: 'Еврейское הַגְּשׁוּרִי формально имеет форму единственного числа: «гешурит». Здесь это собирательное обозначение; в географическом перечне подразумевается земля или область гешурян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Вот земля
  rationale: Указательное זֹאת вводит перечень; русское «вот» естественно передаёт эту представительную функцию, а הָאָרֶץ — «земля» в территориальном смысле.
- source_word: הַנִּשְׁאָרֶת
  choice: которая ещё остаётся
  rationale: Причастие нифаля от שׁאר обозначает землю, остающуюся незанятой; «ещё» естественно выражает контекстуальный смысл, не добавляя указания на субъект действия.
- source_word: כָּל גְּלִילוֹת
  choice: все области
  rationale: גְּלִילוֹת означает территориальные области или округа; «области» понятно современному читателю и не предполагает строго определённого административного устройства.
- source_word: הַפְּלִשְׁתִּים
  choice: филистимлян
  rationale: 'Еврейский текст называет народ, поэтому сохранена конструкция принадлежности: «области филистимлян».'
- source_word: וְכָל הַגְּשׁוּרִי
  choice: и вся земля гешурян
  rationale: Форма הַגְּשׁוּרִי морфологически единственного числа, но употреблена собирательно. В географическом перечне дополнение «земля» делает русский текст ясным, при этом собирательный этноним передан множественным числом.
