  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: ru
  text: от Ароэра, расположенного на краю долины Арнона, и город, находящийся посреди долины, а также всё плоскогорье от Медевы до Дивона,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל שְׂפַת נַחַל אַרְנוֹן
  choice: на краю долины Арнона
  rationale: Буквально выражение означает «на краю/берегу потока (или долины) Арнона». Здесь сохранено пространственное «на краю», а נחל передано как «долина» с учётом географического контекста ущелья Арнона.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: посреди долины
  rationale: Передаёт буквальное пространственное значение «в середине/посреди нахаля» и сохраняет лексическую связь с предыдущим упоминанием долины.
- source_word: הַמִּישֹׁר
  choice: плоскогорье
  rationale: В данном географическом контексте обозначает ровное возвышенное плато, а не просто любую равнину.
- source_word: מֵידְבָא
  choice: Медева
  rationale: Традиционная и узнаваемая русская форма топонима Медева.
- source_word: דִּיבוֹן
  choice: Дивон
  rationale: Устоявшаяся русская библейская передача топонима.
