source:
  edition: WLC
  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: ru
  text: и все города на плоскогорье[a], и всё царство Сигона, царя амореев, который царствовал в Хешбоне. Моисей поразил[b] его и вождей Мидьяна — Эви, Рекема, Цура, Хура и Реву, князей Сигона[c], живших в той земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на равнине»; речь идёт о ровной возвышенной области, плато.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ударил»; в военном контексте — решительно поразил или разгромил.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте употреблены два разных обозначения положения этих людей: «вожди Мидьяна» (נְשִׂיאֵי) и «князья Сигона» (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: города на плоскогорье
  rationale: מִישׁוֹר обозначает ровную возвышенную область Заиорданья; «плоскогорье» передаёт и ровный характер местности, и её региональную топографию.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: царство Сигона
  rationale: מַמְלְכוּת означает царство или владение; «царство» здесь естественно и непосредственно.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: царь амореев
  rationale: Еврейское определение принадлежности передано обычной русской конструкцией; единственное число gentilic в контексте имеет собирательное значение.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: который царствовал в Хешбоне
  rationale: מָלַךְ значит именно «быть царём, царствовать», а не просто управлять.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: Моисей поразил его
  rationale: «Поразил» сохраняет образность נכה и допускает подразумеваемое в военном контексте решительное поражение, не превращая перевод безоговорочно в «убил».
- source_word: נְשִׂיאֵי מִדְיָן
  choice: вожди Мидьяна
  rationale: נָשִׂיא может означать вождя, главу или князя; «вожди» отличает этот титул от следующего נְסִיכֵי.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Эви, Рекем, Цур, Хур и Рева
  rationale: Имена переданы транслитерацией, близкой к еврейскому звучанию и понятной современному русскому читателю.
- source_word: נְסִיכֵי סִיחוֹן
  choice: князья Сигона
  rationale: נָסִיךְ обозначает князя или правителя; отдельный русский термин сохраняет отличие от נְשִׂיאֵי «вожди».
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жившие в той земле
  rationale: Причастие от ישׁב передано естественным русским определительным оборотом; «той» указывает на уже названную территорию без добавления новой географической конкретизации.
theological_decisions:
- issue: Степень конкретизации глагола נכה
  choice: поразил
  alternative: разгромил / убил
  rationale: Контекст военной победы допускает значения решительного поражения и смерти, однако сам глагол не требует в переводе устранять эту смысловую широту.
- issue: Связь титула נְסִיכֵי סִיחוֹן с вождями Мидьяна
  choice: приложение «князей Сигона» к пяти названным вождям
  alternative: понимать как отдельную группу князей
  rationale: Грамматика и последовательность фразы естественно представляют второй титул как дополнительную характеристику тех же пяти лиц; перевод сохраняет это приложение.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис длинного еврейского перечисления разделён на два предложения для ясности, но все логические связи сохранены. Географические и личные имена переданы близко к масоретскому тексту.
