  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: ru
  text: И Финеес, сын Елеазара, священника, и предводители возвратились от сыновей Рувима и сыновей Гада, из земли Галаада в землю Ханаана, к сынам Израиля[b], и принесли им весть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и сообщили им об этом». Еврейское דָּבָר может означать «слово», «дело», «весть» или «сообщение» — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к сынам Израиля», то есть к израильтянам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: возвратились
  rationale: Глагол שׁוב обозначает завершённое возвращение. В еврейском стоит единственное число при первом члене составного подлежащего; по нормам современного русского при нескольких действующих лицах употреблено множественное число.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Финеес, сын священника Елеазара
  rationale: Традиционные русские формы имён сохранены. Порядок слов ясно связывает определение «священник» с Елеазаром, как допускает ближайшее синтаксическое присоединение в еврейском.
- source_word: וְהַנְּשִׂיאִים
  choice: и предводители
  rationale: נְשִׂיאִים здесь обозначает представителей, возглавляющих племена; «предводители» понятно современному читателю и не подразумевает царского достоинства.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: от сынов Рувима и сынов Гада
  rationale: Сохранена повторяющаяся родоплеменная формула בְּנֵי; в данном контексте речь идёт о племенах Рувима и Гада.
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: из земли Галаадской в землю Ханаанскую
  rationale: Повтор существительного אֶרֶץ сохранён, чтобы передать географическое противопоставление двух областей.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: к сынам Израиля
  rationale: Передана явная еврейская формула «сыны Израиля»; примечание поясняет её коллективное значение.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: и принесли им весть
  rationale: Русская идиома естественно передаёт сообщение, доставленное возвратившимися посланниками. דָּבָר допускает значения «слово», «дело», «весть/сообщение», поэтому смысловая широта отмечена в примечании.
