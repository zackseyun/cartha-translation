source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: ru
  text: 'И он сказал им: «Возвращайтесь в свои шатры с большим богатством, с весьма многочисленным скотом, с серебром и золотом, с медью[a] и железом и с великим множеством одежд. Разделите добычу, взятую у ваших врагов, со своими братьями[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзой».'
    reason: lexical_alternative
  - marker: b
    text: То есть со своими собратьями-израильтянами.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: И он сказал им
  rationale: Естественно передаёт древнееврейскую вводную формулу; отдельное «говоря» в современном русском избыточно.
- source_word: בִּנְכָסִים רַבִּים
  choice: с большим богатством
  rationale: נְכָסִים обозначает имущество, состояние или богатство; следующий перечень раскрывает его состав.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Возвращайтесь в свои шатры
  rationale: Сохраняет конкретное значение «шатры» и исторический колорит, не заменяя его толкованием «дома».
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: с весьма многочисленным скотом
  rationale: מִקְנֶה — собирательное обозначение домашнего скота; «весьма многочисленным» передаёт רַב מְאֹד.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: с серебром и золотом
  rationale: Прямое и естественное соответствие названиям драгоценных металлов.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: с медью и железом
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в основном тексте выбрано более широкое традиционное русское «медь», а вариант отмечен в сноске.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: и с великим множеством одежд
  rationale: שְׂלָמוֹת — одежды или одеяния; выражение сохраняет усиленное указание на их количество.
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: Разделите добычу, взятую у ваших врагов
  rationale: Передаёт повелительное наклонение и военное значение שָׁלָל; добавление «взятую» естественно выражает отношение к врагам.
- source_word: עִם אֲחֵיכֶם
  choice: со своими братьями
  rationale: Сохраняет мужской термин родства אָחִים и его значение соплеменников в данном контексте.
theological_decisions:
- issue: Объём значения אֲחֵיכֶם
  choice: со своими братьями
  alternative: со своими соплеменниками / с другими израильтянами
  rationale: Основной текст сохраняет буквальный термин родства и его заветно-общинный оттенок; сноска поясняет, что имеются в виду собратья-израильтяне.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского языка, при этом сохранены перечень богатств, историческое «шатры» и прямой характер повеления.
