base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: ru
  text: 'Они пришли к сыновьям Рувима, к сыновьям Гада и к половине племени Манассии, в землю Галаада[a], и обратились к ним со словами[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в земле Галаада». Еврейский предлог обычно указывает направление, но здесь это выражение можно понимать как обозначение места, где они встретились с восточными племенами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и говорили с ними». Еврейская конструкция может означать как обращение к ним, так и разговор с ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Обычная повествовательная форма глагола בוא передаёт прибытие; «пришли» естественно продолжает русское повествование.
- source_word: בְּנֵי
  choice: сынам
  rationale: В племенной формуле буквально обозначает «сынов» и служит традиционным названием представителей соответствующего колена.
- source_word: חֲצִי שֵׁבֶט
  choice: половине колена
  rationale: Естественный и точный русский эквивалент устойчивого обозначения одной из двух частей колена Манассии.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: в землю Галаадскую
  rationale: Предлог אֶל обычно указывает направление. Здесь выражение называет место назначения и одновременно область проживания восточных колен; русский винительный падеж сохраняет направительное значение.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: говорили с ними
  rationale: Сочетание דבר с אֵת допускает взаимно-направленное «говорить с кем-либо»; этот вариант ближе к еврейской конструкции, хотя контекст может подразумевать обращение к ним.
- source_word: לֵאמֹר
  choice: 'так:'
  rationale: Формула вводит прямую речь следующего стиха. В современном русском «так:» передаёт эту функцию естественнее буквального «говоря».
