lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: вожди / вождь
  rationale: В данном племенном и представительном контексте слово обозначает официальных глав общин. «Вождь» сохраняет высокий статус и звучит естественнее, чем монархически окрашенное «князь».
- source_word: עִמּוֹ
  choice: с ним
  rationale: Предлог с местоименным суффиксом относится к Финеесу, названному в предыдущем стихе.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: по одному вождю
  rationale: Повтор имеет распределительное значение; русское «по одному» передаёт его естественно и точно.
- source_word: לְבֵית אָב
  choice: от каждого отчего дома
  rationale: «Отчий дом» передаёт устойчивую родовую и административную единицу בית אב, не сводя её к отдельной семье.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: от всех колен Израиля
  rationale: 'Предлог здесь указывает на представительство: вожди были избраны от израильских колен.'
- source_word: וְאִישׁ
  choice: каждый из них
  rationale: אישׁ употреблено распределительно применительно к десяти представителям; такой перевод естественен по-русски.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: главой своего отчего дома
  rationale: Сохраняются и руководящая роль ראשׁ, и родовая структура выражения בית אבות.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: среди тысяч Израиля
  rationale: Формальная передача сохраняет подлинную неоднозначность אלפים, которое может означать как «тысячи», так и родовые либо военно-административные подразделения.
