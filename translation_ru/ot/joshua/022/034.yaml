base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: ru
  text: И назвали сыновья Рувима и сыновья Гада жертвенник «Свидетель»[a], ибо он — свидетель между нами о том, что Яхве — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен и более развёрнутый перевод: «Они назвали жертвенник „Свидетель между нами, что Яхве — Бог“», если считать последующие слова частью названия, а не объяснением причины этого названия.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: назвали
  rationale: В сочетании с לַמִּזְבֵּחַ глагол קרא имеет смысл наречения имени; русское «назвали» ясно и естественно передаёт эту функцию.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: потомки Рувима и потомки Гада
  rationale: В данном племенном контексте בְּנֵי обозначает не непосредственных сыновей, а членов родов, происходящих от Рувима и Гада. «Потомки» точно передаёт смысл и остаётся прозрачным для современного читателя.
- source_word: לַמִּזְבֵּחַ
  choice: этот жертвенник
  rationale: מִזְבֵּחַ означает «жертвенник»; указательное «этот» естественно связывает его с жертвенником, о котором шла речь выше, не добавляя нового референта.
- source_word: עֵד
  choice: «Свидетель»
  rationale: Существительное עֵד значит «свидетель». Кавычки и прописная буква показывают, что слово понимается как имя жертвенника, при сохранении его обычного лексического значения.
- source_word: כִּי עֵד הוּא
  choice: потому что он свидетель
  rationale: Первое כִּי естественно понимать как вводящее основание для названия, а הוּא соотносится с жертвенником; русский мужской род соответствует слову «жертвенник».
- source_word: בֵּינֹתֵינוּ
  choice: между нами
  rationale: Выражение обозначает свидетельство, связывающее представленные сторонами сообщества; «между нами» является прямым и естественным соответствием.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: что Яхве — Бог
  rationale: Второе כִּי вводит содержание свидетельства. Именная конструкция передана русским тире; определённый артикль при אֱלֹהִים не требует неестественного «этот Бог». Личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Следует ли считать всю заключительную фразу полным именем жертвенника
  choice: В основном тексте дано краткое имя «Свидетель», а последующая фраза понята как его объяснение.
  alternative: '«Они назвали жертвенник: “Свидетель между нами, что Яхве — Бог”», то есть включить пояснительную фразу в состав имени.'
  rationale: 'В еврейском тексте после слова «жертвенник» нет отдельного явно обозначенного имени, а далее буквально следует: «ибо/что свидетель он между нами, что Яхве — Бог». Синтаксис допускает как краткое подразумеваемое имя «Свидетель» с объяснением, так и понимание всей фразы как названия. Основной текст следует традиционно наиболее понятному разбору, а примечание сохраняет реальную неоднозначность.'
- issue: Передача יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога, стоящее в исходном тексте, и не заменяет его титулом.
translation_notes:
  register: 'Современный литературный русский язык с ясным, достойным повествовательным строем. «Потомки» избегает ошибочного впечатления, будто речь идёт о непосредственных сыновьях патриархов; повтор сохраняет параллелизм еврейской фразы. Формулировка не сглаживает синтаксическую неоднозначность конца стиха: альтернативный разбор вынесен в примечание.'
