revisions:
- from: И назвали потомки Рувима и потомки Гада этот жертвенник «Свидетель»[a], потому что он свидетель между нами, что Яхве — Бог.
  to: И назвали сыновья Рувима и сыновья Гада жертвенник «Свидетель»[a], ибо он — свидетель между нами о том, что Яхве — Бог.
  rationale: Убрано невыраженное в оригинале «этот»; племенная формула передана ближе к еврейскому тексту; добавлены русские служебные слова «—» и «о том» для естественной и ясной передачи смысла. Примечание сохраняет синтаксическую возможность понимать поясняющую фразу как развёрнутое имя жертвенника, не утверждая этот спорный разбор в основном тексте.
