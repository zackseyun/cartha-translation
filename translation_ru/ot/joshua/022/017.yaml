base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: ru
  text: Разве нам мало беззакония Пеора[a][b], от которого мы не очистились до сего дня, и в общине Яхве был мор?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вины Пеора». Еврейское עָוֹן может означать беззаконие, вину или последствие вины.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «Пеор»; в связанных с этим событием местах встречается более полное название «Ваал-Пеор».'
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: Разве мало нам
  rationale: Риторический вопрос передан естественной русской конструкцией с «разве», сохраняющей укоряющую силу еврейского выражения.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Слово может обозначать беззаконие, вину или последствие вины. «Беззаконие» сохраняет нравственную тяжесть проступка, не сводя значение только к чувству или состоянию виновности.
- source_word: פְּעוֹר
  choice: Пеор
  rationale: В еврейском тексте стоит краткая форма «Пеор», без добавления «Ваал»; она сохранена и передана близкой к исходному звучанию транслитерацией.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: от которого мы не очистились
  rationale: Возвратная форма глагола טהר передаёт то, что община до сих пор не освободилась от осквернения, связанного с этим беззаконием.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до этого дня
  rationale: Устойчивое выражение передано буквально и естественно для современного русского языка.
- source_word: וַיְהִי הַנֶּגֶף
  choice: и ... постигло поражение
  rationale: Союз ו передан нейтральным «и», без добавления не выраженного прямо противопоставления. «Поражение» сохраняет возможность понимать נֶגֶף как губительный удар или моровую кару.
- source_word: בַּעֲדַת יְהוָה
  choice: общину Яхве
  rationale: עֵדָה обозначает собранную общину народа завета; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Связь беззакония, неочищенности и поражения
  choice: 'Сохранена простая сочинительная связь: «и»'
  alternative: «хотя»; «несмотря на то что»; «и всё же»
  rationale: Еврейский текст не выражает уступку явно. Нейтральное соединение сохраняет богословское напряжение, не уточняя сверх текста, как именно прежнее поражение соотносится с продолжающейся нечистотой.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой публичной речи. Риторический вопрос сохранён; синтаксис слегка упорядочен ради ясности, но причинные и уступительные связи, отсутствующие в еврейском тексте, не добавлены.
