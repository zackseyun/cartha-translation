  - severity: medium
    issue: «беззакония у Пеора»
    rationale: Русская конструкция с «у» преимущественно локативна и неадекватно передаёт связь עֲוֺן פְּעוֹר («беззаконие/вина Пеора», то есть связанное с Пеором).
