base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: ru
  text: 'Так говорит всё общество Яхве: «Что это за вероломство[a], которое вы совершили против Бога Израиля, отступив сегодня от следования за Яхве, построив себе жертвенник и восстав сегодня против Яхве?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неверность» либо «нарушение верности». Еврейское слово обозначает измену заветным обязательствам или установленному Богом порядку поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: Так говорит
  rationale: Формула передачи речи естественно звучит по-русски в настоящем времени; единственное число согласуется с собирательным подлежащим «общество».
- source_word: כֹּל עֲדַת יְהוָה
  choice: всё общество Яхве
  rationale: עֵדָה обозначает собранную общину Израиля; «общество» сохраняет коллективный смысл и звучит достойно в данном контексте.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Что это за вероломство, которое вы совершили
  rationale: מַעַל выражает тяжёлую неверность обязательствам, особенно заветную или культовую; сочетание существительного с однокоренным глаголом передано естественной русской конструкцией.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: против Бога Израиля
  rationale: При מעל предлог ב обозначает того, против кого направлена неверность.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: отвернувшись сегодня от Яхве
  rationale: Передаёт прекращение следования за Яхве; деепричастная конструкция связывает это действие с обвинением, не утяжеляя русскую фразу.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: построив себе жертвенник
  rationale: Инфинитив с ב указывает на обстоятельство или средство отступления, а לָכֶם передано возвратным «себе».
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: и восстав сегодня против Яхве
  rationale: מרד означает мятеж или открытое неповиновение; «восстав против» естественно передаёт направленность действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога транслитерировано, а не заменено титулом, что соответствует прямому употреблению тетраграмматона в исходном тексте.
theological_decisions:
- issue: Передача заветного проступка מַעַל
  choice: вероломство
  alternative: нарушение верности; неверность
  rationale: «Вероломство» выражает сознательное нарушение верности Богу и сохраняет тяжесть заветно-культового обвинения, не сводя его к общему понятию греха.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет его отличие от титула אֲדֹנָי.
- issue: Связь строительства жертвенника с отступлением и мятежом
  choice: сохранена как обвинительная причинно-обстоятельственная цепь
  alternative: истолковать строительство как уже доказанное идолопоклонство
  rationale: Стих передаёт обвинение посланников; перевод не добавляет мотивов или назначения жертвенника, которых эта строка прямо не называет.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Повтор «сегодня» сохранён ради риторической настойчивости исходного текста; имя «Яхве» последовательно передаёт тетраграмматон.
