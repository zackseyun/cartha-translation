revisions:
- from: Одной половине колена Манассии Моисей дал землю в Васане, а другой его половине Иисус Навин дал землю вместе с их братьями[a] по ту сторону Иордана, к западу. Когда Иисус Навин отпустил их к своим шатрам, он благословил их.
  to: Одной половине колена Манассии Моисей дал землю в Васане, а другой половине этого колена Иисус Навин дал землю вместе с их братьями[a] на западной стороне Иордана. Когда Иисус Навин отпустил их к своим шатрам, он благословил их.
  rationale: Исправлено географическое выражение, чтобы недвусмысленно передать западную сторону Иордана, и слегка сглажена русская синтаксическая связь во втором члене противопоставления. Остальные решения, включая буквальное «братьями» со сноской и «шатры», сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:53:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: противопоставлены две половины колена Манассии, указаны Васан и западная сторона Иордана, а также отпущение к шатрам и благословение. Однако русское «по ту сторону Иордана, к западу» двусмысленно: без точки отсчёта оно может пониматься как восточная сторона реки. Еврейское מֵעֵבֶר הַיַּרְדֵּן יָמָּה однозначно уточняет западную сторону.'
  naturalness: Текст в целом литературен и понятен. «Другой его половине» грамматически возможно, но несколько тяжеловесно; «другой половине этого колена» яснее. «Вместе с их братьями» сохраняет формулировку оригинала и может быть оставлено при поясняющей сноске.
  terminology: Традиционные формы «Манассия», «Моисей», «Васан» и «Иисус Навин» уместны. «Благословил» точно передаёт וַיְבָרֲכֵם. Сноска корректно поясняет, что «братья» — соплеменники из других колен; якорь стоит непосредственно после этого слова.
  issues:
  - severity: medium
    issue: Двусмысленное обозначение стороны Иордана
    rationale: 'Оборот «по ту сторону Иордана, к западу» не закрепляет, от какой стороны ведётся отсчёт. Для точной передачи יָמָּה следует прямо сказать «на западной стороне Иордана» или «за Иорданом, на западе». '
  - severity: low
    issue: Не вполне естественная связь в выражении «а другой его половине»
    rationale: Местоимение «его» формально относится к колену, но в современном русском создаёт лишнюю тяжесть. «Другой половине этого колена» яснее и не меняет смысла.
  revised_text: Одной половине колена Манассии Моисей дал землю в Васане, а другой половине этого колена Иисус Навин дал землю вместе с их братьями[a] на западной стороне Иордана. Когда Иисус Навин отпустил их к своим шатрам, он благословил их.
