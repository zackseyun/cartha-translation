base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: ru
  text: Одной половине колена Манассии Моисей дал землю в Васане, а другой половине этого колена Иисус Навин дал землю вместе с их братьями[a] на западной стороне Иордана. Когда Иисус Навин отпустил их к своим шатрам, он благословил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с их братьями»; имеются в виду их собратья-израильтяне из других колен.'
    reason: Уточняется референт буквального родственного термина, не заменяя его в основном тексте.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: Одной половине колена Манассии
  rationale: Передаёт одну из двух частей колена и ясно подготавливает противопоставление «другой его половине».
- source_word: נָתַן מֹשֶׁה בַּבָּשָׁן
  choice: Моисей дал землю в Васане
  rationale: Глагол переведён обычным прошедшим временем; подразумеваемое по контексту дополнение «землю» делает русскую фразу ясной.
- source_word: וּלְחֶצְיוֹ
  choice: а другой его половине
  rationale: Местоименный суффикс соотнесён с коленом Манассии; сохранено противопоставление двух половин.
- source_word: עִם אֲחֵיהֶם
  choice: вместе с их братьями
  rationale: Сохранено буквальное родственное обозначение; в контексте оно относится к соплеменникам-израильтянам из остальных колен.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: по ту сторону Иордана, к западу
  rationale: Сохранены как относительное выражение «по ту сторону», так и явное западное направление, буквально связанное со стороной моря.
- source_word: שִׁלְּחָם ... אֶל אָהֳלֵיהֶם
  choice: отпустил их к своим шатрам
  rationale: Порода пиэль указывает на отправление или отпуск; «шатры» сохраняют конкретный образ исходного текста.
- source_word: וַיְבָרֲכֵם
  choice: он благословил их
  rationale: Прямой и естественный перевод глагола ברך в данном контексте.
