source:
  edition: WLC
  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: ru
  text: Да не будет с нами такого, чтобы мы восстали против Яхве и сегодня перестали следовать за Яхве[a], построив жертвенник для всесожжения, хлебного приношения или жертвы, помимо жертвенника Яхве, нашего Бога, который находится перед его скинией!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отступить сегодня от следования за Яхве».'
    reason: Более буквальная передача еврейского пространственного оборота מֵאַחֲרֵי, описывающего прекращение следования за Яхве; инфинитивная форма оригинала сохранена.
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Да не будет с нами такого
  rationale: Устойчивое русское выражение передаёт решительное отвержение самой мысли о таком поступке, сохраняя торжественный тон.
- source_word: לִמְרֹד בַּיהוָה
  choice: чтобы мы восстали против Яхве
  rationale: Глагол מרד обозначает мятеж или сознательное неповиновение; предлог ב при нём имеет значение направленности против кого-либо.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: и сегодня перестали следовать за Яхве
  rationale: Еврейский оборот буквально описывает отход от следования за Яхве. Выбран естественный современный русский эквивалент без устранения образа следования; более буквальный вариант отмечен в сноске.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: построив жертвенник
  rationale: Деепричастный оборот естественно передаёт средство или конкретное проявление названного отступничества.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленный термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: לְמִנְחָה
  choice: хлебного приношения
  rationale: В культовом контексте מִנְחָה обозначает приношение из зерна или муки; традиционный русский термин «хлебное приношение» точен и понятен.
- source_word: וּלְזָבַח
  choice: или жертвы
  rationale: זֶבַח здесь является общим обозначением закалываемой жертвы; перевод не уточняет её вид без основания в тексте.
- source_word: מִלְּבַד
  choice: помимо
  rationale: Передаёт противопоставление самовольно устроенного жертвенника единственному признанному жертвеннику у святилища.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: жертвенника Яхве, нашего Бога
  rationale: Сохраняются конструкция принадлежности, имя Бога и исповедальное выражение «нашего Бога».
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: который находится перед его скинией
  rationale: Относительное предложение относится к жертвеннику; «скиния» передаёт משכן в данном святилищном контексте, а местоимение сохраняет суффикс третьего лица.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте трижды употреблён тетраграмматон. Форма «Яхве» прямо передаёт личное заветное имя и согласуется с предоставленным редакционным решением.
- issue: Характер постройки второго жертвенника
  choice: помимо жертвенника Яхве
  alternative: вместо жертвенника Яхве
  rationale: מִלְּבַד допускает смысл отдельности или добавления, но прямо не утверждает замену законного жертвенника; «помимо» сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет силу решительного отрицания и связь постройки жертвенника с предполагаемым мятежом; архаизмы сведены к устойчивым культовым терминам «жертвенник», «всесожжение» и «скиния».
