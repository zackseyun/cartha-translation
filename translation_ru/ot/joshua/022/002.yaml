  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: ru
  text: 'И сказал им: «Вы соблюдали всё, что повелел вам Моисей, служитель Яхве, и повиновались мне во всём, что я вам повелел».[a]'
  philosophy: optimal-equivalence
  footnotes:
