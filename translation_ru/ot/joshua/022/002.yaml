    text: 'Буквально: «и слушались моего голоса во всём, что я вам повелел». Еврейское выражение «слушать голос» часто подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: И сказал им
  rationale: Последовательный вав продолжает повествование; в русском библейском повествовании естественно звучит «И сказал им».
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר צִוָּה
  choice: Вы исполнили всё, что повелел
  rationale: В контексте заповедей שׁמר означает соблюдать, исполнять; «исполнили» ясно передаёт деятельное послушание и естественно сочетается с придаточным предложением.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Моисей, служитель Яхве
  rationale: עֶבֶד здесь является почётным обозначением Моисея как человека, состоящего на служении Богу; «служитель» передаёт эту функцию без неуместного акцента на рабском положении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: и слушались моего голоса
  rationale: Оборот שׁמע בקול означает не только слышать, но внимать и повиноваться. «Слушались моего голоса» сохраняет образ голоса и выражает послушание.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: во всём, что я повелевал вам
  rationale: «Во всём» передаёт полноту לְכֹל, а несовершенный вид «повелевал» естественно обозначает совокупность данных ранее распоряжений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его лексический статус и не заменяет именем-титулом.
- issue: Передача עֶבֶד применительно к Моисею
  choice: служитель
  alternative: раб
  rationale: Здесь слово служит почётным титулом Моисея и подчёркивает его верное служение и поручение от Бога; социально-правовой смысл рабства в данном контексте не выдвинут на первый план.
- issue: Смысл идиомы שׁמע בקול
  choice: слушались моего голоса
  alternative: повиновались мне
  rationale: Выбранный вариант одновременно сохраняет еврейский образ голоса и передаёт подразумеваемое деятельное послушание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; лексические повторы корня צוה сохранены посредством форм «повелел / повелевал».
