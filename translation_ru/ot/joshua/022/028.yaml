source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: ru
  text: 'И потому мы сказали: «Если в будущем они скажут нам или нашим потомкам, то мы ответим: „Посмотрите на подобие[a] жертвенника Яхве, которое сделали наши отцы: не для всесожжений и не для жертв, но оно — свидетель между нами и вами“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образец», «копию» либо «изображение». Еврейское слово обозначает форму или подобие: этот жертвенник воспроизводил вид жертвенника Яхве и служил свидетельством, а не местом жертвоприношений.'
    reason: Лексическая многозначность תַּבְנִית и важное для контекста различие между подобием жертвенника и жертвенником для жертвоприношений.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: И потому мы сказали
  rationale: Последовательная форма продолжает повествование, а контекст придаёт высказыванию объяснительно-следственный оттенок.
- source_word: וְהָיָה כִּי
  choice: Если
  rationale: Оборот вводит возможную ситуацию в будущем; условная конструкция естественна по-русски.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: в будущем они скажут нам или нашим потомкам
  rationale: מָחָר здесь означает последующее время, а דֹּרֹתֵינוּ — грядущие поколения; «потомкам» передаёт смысл естественным русским языком. Союз перед второй группой по смыслу допускает разделительное «или».
- source_word: וְאָמַרְנוּ
  choice: то мы ответим
  rationale: Форма обозначает будущую реплику в условной ситуации; «ответим» естественно отражает речевую реакцию.
- source_word: רְאוּ
  choice: Посмотрите на
  rationale: Современная и ясная передача повелительного призыва обратить внимание.
- source_word: תַּבְנִית
  choice: подобие
  rationale: Слово обозначает форму, образец или воспроизведение; «подобие» показывает, что сооружение изображало жертвенник и само не предназначалось для жертвоприношений.
- source_word: מִזְבַּח יְהוָה
  choice: жертвенника Яхве
  rationale: Конструкция принадлежности передана русским родительным падежом, личное имя יְהוָה — как «Яхве».
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: которое сделали наши отцы
  rationale: Местоимение согласовано со словом «подобие»; мужское родственное обозначение אֲבוֹתֵינוּ сохранено буквально.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: не для всесожжений и не для жертв
  rationale: Повтор отрицания сохранён ради исходного акцента; עֹלָה передано специальным термином «всесожжение», а זֶבַח — более общим «жертва».
- source_word: כִּי עֵד הוּא
  choice: но оно — свидетель
  rationale: כִּי после двух отрицаний указывает на истинное назначение сооружения; самостоятельная именная фраза и местоимение сохранены.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: между нами и вами
  rationale: Прямая и естественная передача взаимного свидетельства двух сторон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное четырёхбуквенное имя Бога; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Назначение сооружённого жертвенника
  choice: подобие и свидетель, не место жертвоприношения
  alternative: полноценный жертвенник для совершения жертв
  rationale: Сам стих прямо отрицает использование сооружения для всесожжений и жертв и называет его свидетельством.
- issue: Передача אֲבוֹתֵינוּ
  choice: наши отцы
  alternative: наши предки
  rationale: Сохранено конкретное мужское родственное обозначение исходного текста без нейтрализации.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Повтор «не… и не…» сохраняет риторическую структуру еврейского текста; тире в именной части подчёркивает назначение сооружения.
