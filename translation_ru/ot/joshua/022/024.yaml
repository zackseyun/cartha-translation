  terminology: «Господь, Бог Израиля» — устойчивая, понятная русская передача יהוה אֱלֹהֵי יִשְׂרָאֵל. «Какое вам дело до Господа?» удачно сохраняет риторическую широту еврейской идиомы מַה־לָּכֶם וְלַיהוָה и не навязывает узкого толкования.
