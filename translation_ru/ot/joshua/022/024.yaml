base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: ru
  text: 'Нет, напротив, мы сделали это из тревоги — из опасения, что в будущем ваши сыновья скажут нашим сыновьям: «Какое вам дело до Господа, Бога Израиля?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: из тревоги, из опасения
  rationale: Сочетание выражает мотив, вызванный беспокойством о возможном будущем обстоятельстве. Повтор с двумя близкими русскими существительными сохраняет усиление еврейского текста естественнее, чем буквальное «из тревоги о деле».
- source_word: מָחָר
  choice: со временем
  rationale: Буквально «завтра», но здесь слово обозначает последующее время или будущее поколение, а не обязательно следующий календарный день.
- source_word: מַה לָּכֶם וְלַיהוָה
  choice: Какое вам дело до Господа
  rationale: Еврейская идиома означает отрицание связи, участия или общности; русский оборот передаёт её прямой риторический характер, не уточняя сверх текста, в чём именно состоит эта связь.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и общепонятная русская передача тетраграмматона в библейском тексте.
theological_decisions:
- issue: Характер предполагаемого разрыва с Господом
  choice: Сохранить широкую формулировку «Какое вам дело до Господа»
  alternative: «Что общего у вас с Господом?»
  rationale: Исходная идиома допускает оттенки принадлежности, участия и отношений. Выбранный вариант не сводит её к одной конкретной богословской категории.
- issue: Начальное וְאִם־לֹא
  choice: Передать как решительное «Нет»
  alternative: «Но поистине» / «Если не…»
  rationale: В контексте клятвенного отрицания предыдущего стиха оборот служит энергичным исправлением возможного обвинения; отдельное «Нет» естественно передаёт эту функцию по-русски.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис упрощён лишь настолько, чтобы длинная причинно-целевая конструкция оставалась ясной; вложенная прямая речь и напряжённый характер опасения сохранены.
