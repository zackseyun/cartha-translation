  source_fidelity: 'В целом смысл передан верно: действие совершено из беспокойства о возможной будущей реплике потомков; сохранены адресаты («ваши сыновья» — «нашим сыновьям») и широкая идиома «что вам [до] Господа». Однако начальное וְאִם־לֹא в данном контексте имеет поправочно-противительный оттенок («Нет, напротив/но»), который в проекте ослаблен одним «Нет».'
