base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: ru
  text: 'И услышали сыны Израиля, что говорят[a]: «Вот, сыны Рувима, сыны Гада и половина колена Манассии построили жертвенник напротив земли Ханаанской[b], в областях Иордана[c], на стороне сынов Израиля[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское лемор — формула, вводящая содержание услышанного сообщения; буквальная передача «говоря» в русском здесь неестественна.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед землёй Ханаанской» либо «лицом к земле Ханаанской».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в областях Иордана»; точный географический смысл этого выражения неясен.'
    reason: cultural_note
  - marker: d
    text: 'Или: «по ту сторону от сынов Израиля» либо «на стороне, обращённой к сынам Израиля». Заключительная географическая фраза трудна: она может обозначать как сторону Иордана, занятую Израилем, так и место напротив израильтян.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: И услышали сыны Израиля такой рассказ
  rationale: Сохраняет повествовательное «услышали» и функцию לֵאמֹר как введения содержания сообщения, но выражает формулу естественно по-русски. «Сыны Израиля» удерживает повторяющуюся в стихе родственно-национальную формулировку.
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и достойный русский указательный возглас, привлекающий внимание к сообщению без архаического оттенка «се».
- source_word: בָנוּ
  choice: построили
  rationale: Передаёт завершённое действие перфекта; русское прошедшее совершенного вида естественно выражает результат, значимый в момент сообщения.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Определённость еврейской формы в русском контексте передаётся конкретностью упоминаемого предмета; отдельное указательное слово не требуется.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: напротив земли Ханаанской
  rationale: «Напротив» сохраняет пространственное соотношение, не уточняя спорное направление; традиционная форма «земля Ханаанская» ясна современному читателю.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: в областях Иордана
  rationale: Множественное число «областях» отражает גְּלִילוֹת точнее, чем обобщённое единственное число, при сохранении неопределённости географического термина.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: на стороне сынов Израиля
  rationale: Близко передаёт трудную пространственную формулу, не добавляя принадлежность и не решая, означает ли она сторону, занятую Израилем, или положение напротив него.
