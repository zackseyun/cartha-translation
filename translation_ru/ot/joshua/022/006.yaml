  text: וַֽ/יְבָרְכֵ֖/ם יְהוֹשֻׁ֑עַ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אָהֳלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: ru
  text: Иисус Навин благословил их и отпустил, и они пошли к своим шатрам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по домам»; буквально: «к своим шатрам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: благословил их
  rationale: Порода пиэль глагола ברך здесь обозначает преподанное Иисусом Навином благословение; краткий прямой перевод естественен по-русски и сохраняет характер действия.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличить этого персонажа от других носителей имени Иисус.
- source_word: וַיְשַׁלְּחֵם
  choice: отпустил
  rationale: В данном контексте שלח означает позволить людям отправиться в путь после завершения поручения; «отпустил» передаёт это лаконично и естественно, без нежелательного оттенка изгнания.
- source_word: וַיֵּלְכוּ
  choice: они пошли
  rationale: Обычное значение הלך — «идти». Перевод не добавляет идеи возвращения, прямо не выраженной глаголом.
- source_word: אֶל אָהֳלֵיהֶם
  choice: к своим шатрам
  rationale: Предлог אֶל указывает направление, а אָהֳלֵיהֶם буквально означает «их шатры». Возвратное «своим» естественно для русского языка при совпадении владельцев с подлежащим.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена простая последовательность еврейских глагольных форм; начальное וַ передано без избыточного «тогда», поскольку стих естественно продолжает предшествующий рассказ. Маркер сноски поставлен непосредственно после относящегося к ней выражения.
