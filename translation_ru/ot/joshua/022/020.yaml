  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: ru
  text: Разве Ахан, сын Зераха, не проявил неверность в отношении заклятого, так что гнев постиг всё общество Израиля? И не он один погиб из-за своего беззакония.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: проявил неверность
  rationale: Передаёт усиленную конструкцию с глаголом и однокоренным существительным как серьёзное нарушение верности и доверия, не перегружая русский текст повтором.
- source_word: בַּחֵרֶם
  choice: взяв из заклятого
  rationale: В контексте Ахана речь идёт о присвоении имущества, преданного уничтожению; формулировка сохраняет традиционный библейский термин «заклятое» и делает характер проступка понятным.
- source_word: קָצֶף
  choice: гнев
  rationale: Прямое соответствие существительному, обозначающему гнев; контекст подразумевает Божий гнев, но имя Бога в этом стихе не добавляется.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: общество Израиля
  rationale: «Общество» естественно передаёт собранную общину народа и соответствует устойчивой библейской лексике.
- source_word: גָוַע
  choice: погиб
  rationale: В данном контексте обозначает смерть вследствие суда; «погиб» естественнее русского «скончался» и сохраняет причинный оттенок.
- source_word: בַּעֲוֹנוֹ
  choice: за своё беззаконие
  rationale: Предлог допускает смысл смерти вследствие или за вину; «за» ясно передаёт связь гибели с проступком, а «беззаконие» сохраняет нравственно-судебный характер עָוֹן.
theological_decisions:
- issue: Кто подвергся последствиям греха Ахана
  choice: «не он один погиб» сохраняет утверждение о гибели других вместе с Аханом
  alternative: «он не погиб один из-за своего беззакония»
  rationale: Еврейское וְהוּא אִישׁ אֶחָד לֹא גָוַע подчёркивает, что последствия не ограничились одним человеком; перевод не уточняет сверх текста, кого именно включает это утверждение.
- issue: Источник гнева
  choice: «гнев постиг» без добавления «Божий»
  alternative: «Божий гнев постиг»
  rationale: В контексте гнев является Божьим судом, однако в еврейском тексте субъект прямо не назван, поэтому экспликация не внесена.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Риторический вопрос и переход ко второй части сохранены; «И ведь» естественно передаёт присоединительно-усилительный характер заключительного утверждения.
