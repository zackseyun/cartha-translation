  variant: modern literary Russian
source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: ru
  text: 'Только будьте особенно внимательны, чтобы исполнять заповедь и закон[a], которые заповедал вам Моисей, раб Яхве: любить Яхве, Бога вашего, ходить всеми Его путями, соблюдать Его заповеди, держаться Его и служить Ему всем сердцем и всей душой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление» (евр. тора).'
    reason: Слово תּוֹרָה может обозначать как закон, так и наставление; в основном тексте выбран уместный для Моисеева заветного контекста вариант «закон».
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничительно-усилительный характер частицы в заключительном наставлении.
- source_word: שִׁמְרוּ מְאֹד
  choice: будьте особенно внимательны
  rationale: Естественно передаёт усиленную идиому со значением крайней тщательности, а не буквальное «храните весьма».
- source_word: לַעֲשׂוֹת
  choice: чтобы исполнять
  rationale: 'Инфинитив раскрывает содержание требуемой внимательности: заповедь и закон необходимо осуществлять на деле.'
- source_word: הַמִּצְוָה
  choice: заповедь
  rationale: Сохраняет единственное число и заветный оттенок исходного слова.
- source_word: הַתּוֹרָה
  choice: закон
  rationale: В данном контексте речь идёт о данном через Моисея заветном законе; возможное значение «наставление» сохранено в сноске.
- source_word: עֶבֶד יְהוָה
  choice: раб Яхве
  rationale: «Раб» в современном литературном русском сохраняет смысл принадлежности и преданного служения, выступая здесь как почётное обозначение Моисея.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: ходить всеми Его путями
  rationale: Сохраняет понятную в русском языке библейскую этическую метафору и полный охват, выраженный כָל.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: соблюдать Его заповеди
  rationale: Естественное русское сочетание, точно выражающее верность предписаниям.
- source_word: וּלְדָבְקָה בּוֹ
  choice: быть крепко привязанными к Нему
  rationale: Передаёт тесную, постоянную приверженность без архаичного или неясного оборота.
- source_word: וּלְעָבְדוֹ
  choice: служить Ему
  rationale: Сохраняет широкий смысл посвящённого служения, который может включать поклонение, не сводясь только к нему.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: всем сердцем и всей душой
  rationale: Естественный русский эквивалент, сохраняющий повтор всеохватности и внутреннюю цельность служения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Заветные метафоры поведения и приверженности
  choice: ходить всеми Его путями; быть крепко привязанными к Нему
  alternative: жить согласно Его воле; держаться Его
  rationale: Сохранены образы исходного текста и их богословская насыщенность, но второй образ выражен естественным современным русским языком.
- issue: Связь перечня инфинитивов с заповедью и законом
  choice: двоеточие перед перечнем
  alternative: точка с последующим независимым призывом
  rationale: Двоеточие сохраняет возможное понимание последующего перечня как содержания или пояснения того, что заповедал Моисей, не превращая его в отдельное высказывание.
translation_notes:
  register: Современный литературный русский с достоинством библейского наставления. Синтаксический параллелизм перечня сохранён; местоимения, относящиеся к Богу, написаны с прописной буквы по русской благоговейной издательской традиции.
