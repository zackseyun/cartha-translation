  source_fidelity: 'Русский текст точно передаёт повествовательную последовательность еврейского текста: בני ישראל услышали, всё общество сынов Израиля собралось в Силоме с намерением выступить против них для военных действий. Добавление «об этом» оправдано подразумеваемым объектом из ближайшего контекста и не меняет смысла. «Выступить против них войной» адекватно передаёт военный смысл לעלות עליהם לצבא, не утверждая уже совершившееся нападение.'
