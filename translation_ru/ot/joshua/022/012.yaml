  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: ru
  text: Когда сыны Израиля услышали об этом, всё общество сынов Израиля собралось в Силоме, чтобы выступить против них войной.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подняться против них на войну» — древнееврейский оборот, означающий выступление для военных действий.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали об этом
  rationale: Глагол שׁמע в повествовательной последовательности означает «услышали»; добавленное по-русски «об этом» естественно передаёт подразумеваемый объект из предыдущего контекста.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальный образ исходного выражения и его повтор в стихе; «сыны» уместно в достоинственном библейском регистре современного литературного русского.
- source_word: וַיִּקָּהֲלוּ
  choice: собралось
  rationale: קהל обозначает совместное собрание; форма единственного числа согласуется в русском с собирательным существительным «общество».
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: всё общество сынов Израиля
  rationale: עֵדָה обозначает общину как единое целое; «всё общество» естественно передаёт כָּל и корпоративный смысл.
- source_word: שִׁלֹה
  choice: Силом
  rationale: Традиционная и узнаваемая русская форма библейского топонима.
- source_word: לַעֲלוֹת עֲלֵיהֶם
  choice: выступить против них
  rationale: В военном контексте сочетание עלה с על означает направиться против противника; «выступить» сохраняет идею движения и звучит естественно по-русски.
- source_word: לַצָּבָא
  choice: войной
  rationale: צָבָא здесь означает военное действие; сочетание «выступить против них войной» сохраняет исходный военный оборот без преждевременного уточнения «напасть».
