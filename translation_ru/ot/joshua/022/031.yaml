  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: ru
  text: 'И сказал Финеес, сын священника Елеазара, сынам Рувима, сынам Гада и сынам Манассии: «Сегодня мы знаем, что Яхве среди нас, потому что вы не совершили против Яхве этого вероломства.[a] Тем самым вы избавили сынов Израиля от руки Яхве».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы не поступили вероломно против Яхве этим вероломством»; однокоренные слова указывают на нарушение верности, особенно верности завету.'
    reason: lexical_alternative
  - marker: b
    text: «От руки Яхве» — древнееврейский образ избавления от действия Его силы, в данном контексте — от грозившего суда.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет обычное повествовательное продолжение, выраженное waw-консекутивом, без излишнего уточнения временной последовательности.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Финеес, сын священника Елеазара
  rationale: Естественно передаёт по-русски то, что Елеазар назван священником, и исключает возможную синтаксическую двусмысленность тяжеловесной конструкции.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: потомкам Рувима, Гада и Манассии
  rationale: В данном контексте בְּנֵי обозначает членов соответствующих колен; «потомкам» звучит естественно и сохраняет родовую основу наименований.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Сегодня мы узнали
  rationale: Перфект יָדַעְנוּ здесь выражает достигнутое вследствие объяснения знание; «узнали» естественнее передаёт новое удостоверение, чем статичное «знаем».
- source_word: בְּתוֹכֵנוּ
  choice: среди нас
  rationale: Идиоматично передаёт присутствие Яхве в общине, не подразумевая пребывания внутри отдельных людей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога принятой современной русской транслитерацией.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: вы не совершили этого вероломства против Яхве
  rationale: Корень מעל обозначает измену доверию и нарушение верности, особенно в отношениях завета. «Вероломство» сохраняет серьёзность обвинения; повтор однокоренных глагола и существительного раскрыт естественной русской конструкцией.
- source_word: אָז
  choice: Тем самым
  rationale: 'В контексте частица обозначает результат: доказав отсутствие отступничества, восточные колена отвели угрозу суда от всего Израиля.'
- source_word: הִצַּלְתֶּם אֶת בְּנֵי יִשְׂרָאֵל
  choice: вы избавили сынов Израиля
  rationale: «Избавили» точно передаёт каузативное значение глагола נצל; традиционное выражение «сыны Израиля» уместно для обозначения всего народа.
- source_word: מִיַּד יְהוָה
  choice: от руки Яхве
  rationale: Сохранён прозрачный древнееврейский образ руки как силы, здесь — силы карающего суда.
theological_decisions:
- issue: Присутствие Яхве среди народа
  choice: Яхве среди нас
  alternative: Яхве посреди нас
  rationale: Формулировка утверждает присутствие Бога в общине в свете доказанной верности колен, не привнося более поздних богословских категорий.
- issue: Смысл корня מעל
  choice: не совершили этого вероломства против Яхве
  alternative: не нарушили этим верности Яхве
  rationale: Выбор сохраняет идею серьёзного нарушения отношений верности, а не просто формального проступка.
- issue: Избавление от руки Яхве
  choice: буквальный образ сохранён
  alternative: избавили от суда Яхве
  rationale: Контекст подразумевает угрозу Божьего суда над Израилем, однако сам текст говорит шире — о «руке Яхве»; буквальный образ сохраняет эту напряжённость и не сужает значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Племенные обозначения переданы понятно для обычного читателя; собственное имя Яхве и значимый образ «руки» сохранены. Синтаксис прямой речи слегка сглажен, но причинно-следственная связь и богословская напряжённость оригинала не устранены.
