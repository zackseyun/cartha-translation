  - severity: medium
    issue: Неестественная сегментация «Могущественный, Бог, Яхве».
    rationale: Субстантивированное прилагательное перед последующими существительными звучит как механический список и не образует ясного русского обращения. Объединение первых двух слов в «Могущественный Бог» сохраняет оба титульных элемента и даёт естественный синтаксис.
