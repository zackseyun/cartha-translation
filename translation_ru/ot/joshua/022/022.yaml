  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: ru
  text: 'Могущественный Бог, Яхве![a] Могущественный Бог, Яхве! Он знает, и сам Израиль узнает: если мы сделали это из мятежа или из неверности по отношению к Яхве[b], не спасай нас в этот день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст дважды повторяет торжественное обращение: «Могущественный Бог, Яхве! Могущественный Бог, Яхве!» — как усиленную, близкую к клятве апелляцию к Богу. Сочетание первых двух божественных наименований также может пониматься как «Бог богов».'
    reason: cultural_note
  - marker: b
    text: 'Или: «из вероломства по отношению к Яхве»; еврейское слово обозначает нарушение верности или доверия, особенно верности завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Могущественный, Бог, Яхве
  rationale: Три божественных наименования переданы раздельно и вся последовательность повторена, чтобы сохранить торжественную, клятвенную силу еврейского обращения. אֵל передано субстантивированным «Могущественный», а имя יהוה — «Яхве».
- source_word: הוּא יֹדֵעַ
  choice: Он знает
  rationale: Прямая и естественная передача значения настоящего знания.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: и сам Израиль узнает
  rationale: «Сам» передаёт усилительную функцию הוּא, а форма יֵדָע в контексте указывает на последующее узнавание.
- source_word: אִם בְּמֶרֶד
  choice: если мы поступили так из мятежа
  rationale: מֶרֶד означает мятеж или открытое неповиновение. Слова «мы поступили так» естественно восполняют эллипсис из ближайшего контекста, не меняя предмета условной клятвы.
- source_word: וְאִם בְּמַעַל
  choice: или из неверности
  rationale: מַעַל обозначает нарушение верности и доверия, нередко в отношениях завета; «неверность» сохраняет этот оттенок и звучит естественно по-русски.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: 'При существительном «неверность» отношение, выраженное предлогом ב, естественно передаётся русским дательным падежом: «неверность Яхве».'
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: не спасай нас
  rationale: Отрицательная форма обращена к Богу во втором лице единственного числа; русский императив сохраняет прямое и торжественное самоосуждение.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Современная и точная русская передача указания на данный день без излишней архаизации.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан личным именем «Яхве», чтобы сохранить различие между именем Бога и титулами אֵל и אֱלֹהִים.
- issue: Сила повторённого ряда божественных наименований
  choice: Полностью сохранить оба обращения
  alternative: Объединить в одно обращение или истолковать как «Бог богов — Яхве»
  rationale: Дословное повторение несёт торжественную, близкую к клятве эмфазу; его сохранение не навязывает спорного синтаксического истолкования сочетания.
- issue: Условное самоосуждение в конце стиха
  choice: 'Прямое обращение к Богу: «не спасай нас»'
  alternative: 'Третье лицо: «пусть Он не спасёт нас»'
  rationale: Форма תּוֹשִׁיעֵנוּ грамматически является вторым лицом единственного числа, поэтому внезапный переход к прямому обращению сохранён.
translation_notes:
  register: Современный литературный русский с торжественным ритмом. Повтор обращения и резкий переход от третьего лица («Он знает») ко второму («не спасай») сохранены как значимые особенности еврейской речи. Эллиптическое условие умеренно раскрыто словами «мы поступили так», понятными из контекста сооружения жертвенника.
