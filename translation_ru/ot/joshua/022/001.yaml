lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временной повествовательный маркер вводит следующее событие и естественно передаёт последовательность действий.
- source_word: יִקְרָא
  choice: призвал
  rationale: Форма Qal обозначает, что Иисус Навин позвал эти группы к себе. «Призвал» сохраняет оттенок официального обращения, не усиливая его до приказного «созвал».
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Традиционная и общепонятная русская библейская форма имени, позволяющая отличить этого персонажа от других носителей имени Иисус.
- source_word: לָרֽאוּבֵנִי
  choice: потомков Рувима
  rationale: Этноним в единственном числе употреблён собирательно. «Потомки Рувима» ясно и естественно обозначает соответствующую племенную группу.
- source_word: וְלַגָּדִי
  choice: потомков Гада
  rationale: Этноним в единственном числе имеет собирательное значение; перевод передаёт принадлежность к племенной группе Гада.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: половину колена Манассии
  rationale: מַטֶּה здесь означает племя, или колено, Израиля. Устойчивое русское библейское выражение «половина колена Манассии» точно передаёт конструкцию.
