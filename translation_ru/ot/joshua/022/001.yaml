  source_fidelity: 'В целом смысл передан верно: אָז обозначено как «Тогда», יִקְרָא — как «призвал», а «половину колена Манассии» точно соответствует וְלַחֲצִי מַטֵּה מְנַשֶּׁה. Однако «потомков Рувима/Гада» несколько расширяет значение: в контексте речь о членах конкретных племенных групп, а не о потомках в общем генеалогическом смысле.'
