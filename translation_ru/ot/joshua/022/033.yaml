  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: ru
  text: Это дело понравилось сынам Израиля[a], и сыны Израиля благословили Бога[b]. Они не стали говорить о том, чтобы выступить против них войной[c] и разорить землю, где жили сыны Рувима и сыны Гада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это дело было хорошо в глазах сынов Израиля»; иначе: «израильтянам».'
    reason: lexical_alternative
  - marker: b
    text: 'В данном контексте также возможно: «восхвалили Бога». Еврейский глагол буквально означает «благословлять».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не сказали подняться против них на войну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: это дело понравилось
  rationale: Еврейская конструкция буквально означает, что дело «было хорошо в глазах» израильтян, то есть получило их одобрение. Русское «понравилось» естественно передаёт положительную оценку, а образ исходного текста отмечен в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется буквальное обозначение общины в исходном тексте и его торжественный библейский оттенок; возможный более обычный эквивалент — «израильтяне».
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: благословили Бога
  rationale: Прямо передаётся глагол ברך. В данном сочетании выражение может означать также хвалу Богу, но это смысловое пояснение не подменяет формулировку оригинала.
- source_word: וְלֹא אָמְרוּ לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: не стали говорить о том, чтобы выступить против них войной
  rationale: Формулировка сохраняет речевой глагол אמר и военный образ «подняться/выступить против», оставаясь естественной для современного русского языка.
- source_word: לְשַׁחֵת
  choice: разорить
  rationale: В контексте военного похода глагол означает привести землю к гибели или опустошению. «Разорить» естественнее по-русски применительно к земле, чем буквальное «уничтожить».
- source_word: יֹשְׁבִים בָּהּ
  choice: где жили
  rationale: Передаёт продолжающееся проживание сынов Рувима и Гада на этой земле без тяжеловесного «обитали в ней».
