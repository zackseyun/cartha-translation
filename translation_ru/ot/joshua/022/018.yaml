base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: ru
  text: А вы сегодня отступаете от Господа[a]! И если вы сегодня восстанете против Господа, то завтра Он разгневается на всё общество Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от следования за Господом». Еврейское выражение означает перестать следовать за Господом, то есть отступить от Него.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте подлежащее не названо прямо: буквально «разгневается». Из контекста ясно, что речь идёт о Господе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֻׁבוּ מֵאַחֲרֵי
  choice: отступаете от
  rationale: Сочетание глагола שוב с מֵאַחֲרֵי здесь означает прекращение следования Господу, то есть неверное отступление, а не простое возвращение. Настоящее время передаёт обвинение в уже совершающемся действии.
- source_word: יְהוָה
  choice: Господь
  rationale: В русской библейской традиции тетраграмматон естественно и благоговейно передаётся как «Господь»; это понятно современному читателю.
- source_word: וְהָיָה אַתֶּם תִּמְרְדוּ
  choice: Если вы… восстанете
  rationale: Формула וְהָיָה с последующим действием вводит условное развитие предостережения. מרד обозначает открытый мятеж или неповиновение законной власти.
- source_word: בַּיהוָה
  choice: против Господа
  rationale: 'При глаголе מרד предлог ב имеет направленно-враждебный смысл: восстать против кого-либо.'
- source_word: יִקְצֹף
  choice: Он разгневается
  rationale: Глагол קצף выражает сильный гнев. Заглавное «Он» проясняет подразумеваемого из контекста Господа, не добавляя нового референта.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: всё общество Израиля
  rationale: עֵדָה обозначает собранную общину народа. «Общество Израиля» сохраняет корпоративный смысл и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Подразумеваемое подлежащее при יִקְצֹף
  choice: 'Господь подразумевается как субъект: «Он разгневается»'
  alternative: 'Безличное понимание: «на Израиль падёт гнев»'
  rationale: Непосредственно перед этим Господь назван Тем, от Кого отступают и против Кого восстают; поэтому именно Он естественно понимается субъектом грядущего гнева.
- issue: Корпоративное последствие восстания
  choice: Гнев обращён на всё общество Израиля
  alternative: Ограничить последствие самими восставшими
  rationale: Текст прямо говорит אֶל כָּל עֲדַת יִשְׂרָאֵל и сохраняет напряжённую мысль о последствиях поступка части народа для всей общины.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Синтаксис сделан ясным, но сохранены резкость обвинения, условный характер предупреждения и корпоративная направленность последствия.
