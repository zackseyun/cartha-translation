source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: ru
  text: Когда они пришли в окрестности Иордана[a], находящиеся в земле Ханаан, сыны Рувима, сыны Гада и половина колена Манассии построили там, у Иордана, жертвенник — большой и заметный жертвенник[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «области»; возможно также: «пределы Иордана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «большой жертвенник, бросающийся в глаза»; еврейское выражение описывает его заметный внешний вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: окрестности
  rationale: Слово обозначает окружающую местность или область. «Окрестности» естественно передаёт географический смысл, не превращая слово в имя собственное.
- source_word: וַיָּבֹאוּ אֶל
  choice: Когда они пришли в
  rationale: Такая передача естественно связывает прибытие с последующим действием и соответствует повествовательной последовательности контекста.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: находящиеся в земле Ханаан
  rationale: Сохранено явное географическое уточнение еврейского относительного придаточного.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: сыны Рувима, сыны Гада
  rationale: Сохранена родоплеменная формула оригинала; слово «сыны» уместно в возвышенном повествовательном регистре и понятно современному читателю.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: половина колена Манассии
  rationale: Точная и привычная русская передача обозначения половины племени Манассии.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Стандартное русское обозначение культового сооружения, соответствующее контексту.
- source_word: עַל הַיַּרְדֵּן
  choice: у Иордана
  rationale: В географическом контексте предлог указывает на расположение рядом с рекой, а не обязательно непосредственно на ней.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: жертвенник, большой на вид
  rationale: Передача сохраняет описание внешнего вида и не уточняет сверх текста, было ли сооружение огромным, внушительным или особенно заметным.
theological_decisions:
- issue: Возможный намёк на соперничающий культовый жертвенник
  choice: 'Описать строительство нейтрально: «построили… жертвенник — жертвенник, большой на вид»'
  alternative: «воздвигли внушительный жертвенник»
  rationale: Сам стих ещё не объясняет назначение жертвенника и не выносит оценки намерениям строителей. Нейтральная формулировка сохраняет повествовательное и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формулы «сыны» и «колено» сохраняют родоплеменной характер повествования; синтаксис упрощён настолько, чтобы стих оставался ясным обычному читателю.
