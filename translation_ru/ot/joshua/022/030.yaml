  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: ru
  text: Когда священник Финеес и бывшие с ним вожди общины и главы тысяч Израиля[a] услышали слова, которые сказали потомки Рувима, потомки Гада и потомки Манассии, это показалось им хорошим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы тысяч Израиля». Слово «тысячи» здесь, вероятно, обозначает родовые, племенные или иные общественные подразделения, а не обязательно группы ровно по тысяче человек.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «это было хорошо в их глазах». Или: «это понравилось им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышали
  rationale: В повествовательной последовательности שׁמע означает прежде всего восприятие сказанного; «услышали» не добавляет отсутствующего в форме оттенка внимательного выслушивания.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: священник Финеес
  rationale: Сохраняется определяющий титул при имени; порядок слов естественен для современного русского повествования.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: вожди общины
  rationale: נשיאים обозначает признанных руководителей, а עֵדָה — общину или собрание Израиля. «Вожди общины» передаёт официальный статус без монархического оттенка слова «князья».
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: главы тысяч Израиля
  rationale: Формулировка близко передаёт буквальный образ исходного текста. Здесь «тысячи» могут обозначать общественно-военные подразделения, а не строгое число людей; неоднозначность пояснена в сноске.
- source_word: אֲשֶׁר אִתּוֹ
  choice: бывшие с ним
  rationale: Оборот относится к перечисленным руководителям, сопровождавшим Финееса; его расположение в русском предложении устраняет нежелательную синтаксическую двусмысленность.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: слова, которые сказали
  rationale: Сохраняется связь существительного «слова» с глаголом речи, но избегается неестественное русское сочетание «слова, которые говорили».
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: потомки Рувима, потомки Гада и потомки Манассии
  rationale: בני в данном племенном контексте обозначает потомков и членов соответствующих колен. «Потомки» ясно и современно передаёт смысл, сохраняя трёхчастный повтор исходного текста.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: это было хорошо в их глазах
  rationale: Сохранена прозрачная древнееврейская идиома и её оценочный оттенок; более обычное русское значение приведено в сноске.
