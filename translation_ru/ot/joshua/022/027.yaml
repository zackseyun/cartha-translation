base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: ru
  text: 'Ибо он — свидетель между нами и вами и между нашими поколениями после нас, чтобы мы могли совершать служение ГОСПОДУ[a] пред Ним, принося наши всесожжения, жертвы и мирные жертвы, чтобы впоследствии ваши сыновья не сказали нашим сыновьям: «Нет у вас доли в ГОСПОДЕ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь стоит личное имя Бога — יהוה (ЙХВХ), традиционно передаваемое словом «ГОСПОДЬ».
    reason: Поясняет передачу тетраграмматона и отличает это имя от обычного титула «Господь».
lexical_decisions:
- source_word: כִּי
  choice: «Напротив»
  rationale: 'В контексте частица вводит противопоставление отвергнутой мысли: жертвенник создан не для самостоятельных жертвоприношений, а как свидетельство.'
- source_word: עֵד
  choice: «свидетельство»
  rationale: Жертвенник выступает как вещественный свидетель; русское «свидетельство» естественно передаёт эту функцию.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: «что мы вправе совершать служение ГОСПОДУ»
  rationale: Инфинитив выражает цель или подтверждаемое право потомков служить у святилища; «вправе» делает связь с последующим отрицанием доли понятной, не сводя служение только к обряду.
- source_word: בְּעֹלוֹתֵינוּ וּבִזְבָחֵינוּ וּבִשְׁלָמֵינוּ
  choice: «принося наши всесожжения, жертвы и мирные жертвы»
  rationale: Сохранены три культовые категории; предлог ב здесь передаёт средство или способ служения.
- source_word: מָחָר
  choice: «в будущем»
  rationale: В данном контексте слово означает не буквально следующий день, а последующее время.
- source_word: חֵלֶק בַּיהוָה
  choice: «доли в ГОСПОДЕ»
  rationale: Сохранена ёмкая метафора принадлежности и права участвовать в поклонении, без сужения до одной из этих сторон.
theological_decisions:
- issue: Значение служения «пред Ним»
  choice: Сохранено «пред Ним» как указание на служение в присутствии Бога, связанное с установленным святилищем.
  alternative: Передать как «у Его святилища».
  rationale: Исходный текст буквально говорит «пред Ним»; конкретизация святилищем была бы контекстуально вероятной, но уже истолковывающей.
- issue: Право заиорданских колен на участие в поклонении
  choice: Фраза передана как подтверждение права совершать служение и иметь «долю в ГОСПОДЕ».
  alternative: Понимать только как общее утверждение духовной принадлежности Богу.
  rationale: Упоминание жертв показывает культовое измерение, однако выражение «доля в ГОСПОДЕ» шире одного лишь доступа к обрядам.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён для ясности, но сохранены повтор «между» и ключевая метафора «доля в ГОСПОДЕ».
