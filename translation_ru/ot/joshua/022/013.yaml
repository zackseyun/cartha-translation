  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: ru
  text: Тогда израильтяне послали в землю Галаад к рувимлянам, гадитянам и к половине колена Манассии Финееса, сына священника Елеазара.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Тогда ... послали
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет образное выражение оригинала и при этом соответствует традиционному возвышенному библейскому регистру русского языка.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: сыны Рувима / сыны Гада
  rationale: Прозрачно передаёт еврейские сочетания со словом בְּנֵי; более идиоматичный вариант «потомки» указан в примечании.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: половина колена Манассии
  rationale: Естественный русский эквивалент, ясно обозначающий одну из двух частей колена Манассии.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: находившимся в земле Галаадской
  rationale: Второе אֶל уточняет местонахождение адресатов миссии. Добавленное причастие устраняет в русском синтаксическую двусмысленность, не меняя смысла.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Финееса, сына священника Елеазара
  rationale: Объектный показатель אֶת не переводится. Порядок слов естественен для русского языка; определённый артикль при כֹּהֵן указывает на известное священническое служение Елеазара.
