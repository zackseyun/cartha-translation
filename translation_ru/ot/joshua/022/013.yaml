revisions:
- from: Тогда сыны Израиля послали к сынам Рувима[a], сынам Гада и половине колена Манассии, находившимся в земле Галаадской, Финееса, сына священника Елеазара.
  to: Тогда израильтяне послали в землю Галаад к рувимлянам, гадитянам и к половине колена Манассии Финееса, сына священника Елеазара.
  rationale: Текст приведен к современному литературному русскому и сохраняет последовательность повествования, адресатов, место миссии, имя посланника, его происхождение и указание на священническое служение Елеазара. «В землю Галаад» сохраняет направленность второго אֶל, а названия племен устраняют неуместную в русском буквальную семейную коннотацию.
