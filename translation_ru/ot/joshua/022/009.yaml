  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: ru
  text: И сыны Рувима, сыны Гада и половина колена Манассии повернули обратно и отправились от сынов Израиля из Силома, что в земле Ханаанской, чтобы идти в землю Галаад, в землю своего владения, которую они получили во владение[a] по повелению Яхве через Моисея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которой они овладели». Еврейский глагол может подчёркивать как получение и удержание земли во владении, так и вступление во владение ею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: повернули обратно и отправились
  rationale: Сохраняет два последовательных еврейских глагола, но избегает неестественного для современного русского сочетания «возвратились и пошли».
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: сыны Рувима, сыны Гада и половина колена Манассии
  rationale: Передаёт племенные обозначения близко к еврейской форме и сохраняет торжественный, но понятный библейский регистр.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: от сынов Израиля
  rationale: Сохраняет выраженную в тексте идею удаления от основного собрания Израиля, не добавляя отсутствующего в оригинале слова «остальных».
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: из Силома, что в земле Ханаанской
  rationale: Явно передаёт относительное придаточное и географическое уточнение оригинала.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: в землю Галаад
  rationale: Сохраняет территориальный акцент существительного אֶרֶץ.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: в землю своего владения
  rationale: אֲחֻזָּה обозначает наследственное или законно закреплённое земельное владение; формулировка сохраняет юридико-территориальный оттенок.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: которую они получили во владение
  rationale: Передаёт результативно-пассивный оттенок нифаля от אחז и согласуется с последующим указанием на повеление Яхве, не исключая оттенка вступления во владение.
- source_word: עַל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Идиома עַל־פִּי здесь означает действие согласно повелению; личное имя Яхве передаёт тетраграмматон непосредственно.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Еврейская идиома «рукой Моисея» обозначает посредничество; «через Моисея» ясно и естественно выражает эту функцию по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В оригинале стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессионального истолкования.
- issue: Характер получения земли
  choice: получили во владение
  alternative: овладели ею
  rationale: Форма נֹאחֲזוּ допускает акцент как на получении и закреплении владения, так и на вступлении во владение. Основной текст отражает первый оттенок, а примечание сохраняет второй.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксическая последовательность и территориально-правовая лексика оригинала сохранены, но тяжёлые буквальные обороты смягчены ради ясности.
