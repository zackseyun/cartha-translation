source:
  edition: WLC
  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: ru
  text: Если мы построили себе жертвенник, чтобы отступить от Яхве, или чтобы возносить на нём всесожжение и хлебное приношение, или чтобы приносить на нём мирные жертвы[b], — пусть сам Яхве взыщет с нас за это.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сам Яхве взыщет с нас за это». Еврейскую форму можно понять и как утверждение о будущем взыскании.'
    reason: alternative_reading
  - marker: b
    text: «Мирные жертвы» можно также перевести как «жертвы общения».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: если мы построили себе жертвенник
  rationale: Инфинитив с ל в продолжающейся формуле клятвы передан условным придаточным; לָנוּ сохранено словом «себе».
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: чтобы отступить от Яхве
  rationale: Сочетание שׁוּב מֵאַחֲרֵי обозначает прекращение следования за кем-либо, то есть отступничество; по-русски «отступить от» естественно передаёт этот смысл.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: возносить на нём всесожжение и хлебное приношение
  rationale: העלה в жертвенном контексте передано как «возносить», עוֹלָה — традиционным и точным термином «всесожжение», а מִנְחָה — «хлебное приношение». Союз וּ перед מִנְחָה сохранён как «и».
- source_word: לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: приносить на нём мирные жертвы
  rationale: עָשָׂה при жертвоприношениях идиоматически означает совершать или приносить жертву. «Мирные жертвы» сохраняет традиционную связь שְׁלָמִים с миром и благополучием; возможный смысл общения отмечен в сноске.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: пусть Сам Яхве взыщет с нас за это
  rationale: В контексте самообязывающей клятвы יְבַקֵּשׁ выражает призыв к Божьему взысканию и привлечению к ответу; הוּא передано усилительным «Сам». Дополнения «с нас» и «за это» естественно восполняют подразумеваемый объект в русском.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Модальность заключительной формулы клятвы
  choice: пусть Сам Яхве взыщет с нас за это
  alternative: Сам Яхве взыщет с нас за это
  rationale: Контекст допускает самообязывающее пожелание о наказании, но форма также может читаться как утверждение о будущем взыскании; основное прочтение сохраняет клятвенную силу, а альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, уместным для клятвы звучанием. Синтаксис условного периода сохранён, но сделан естественным для русского читателя; культовые термины переданы ясно и последовательно.
