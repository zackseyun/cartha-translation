  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: ru
  text: «Ведь Яхве сделал Иордан границей между нами и вами, потомками Рувима и Гада[a]. Нет у вас доли в Яхве, и ваши сыновья могли бы заставить наших сыновей перестать бояться Яхве».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынами Рувима и сынами Гада».'
    reason: Сохраняет прозрачность исходного племенного обозначения при более естественной формулировке основного текста.
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: сделал … границей
  rationale: Сочетание נתן с גְּבוּל означает установление границы; по-русски «сделал … границей» ясно передаёт результат действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶת הַיַּרְדֵּן
  choice: Иордан
  rationale: Обычная русская форма названия реки; добавление слова «река» не требуется.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: потомками Рувима и Гада
  rationale: В контексте это названия племенных групп. «Потомки» естественнее в современном русском, чем буквальное «сыновья», и не создаёт впечатления, будто речь только о непосредственных детях.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Нет у вас доли в Яхве
  rationale: «Доля» сохраняет значение חֵלֶק и намеренно не уточняет, идёт ли речь об участии, принадлежности или наследии.
- source_word: וְהִשְׁבִּיתוּ
  choice: могли бы сделать так, что … перестали бы
  rationale: Каузативная форма означает «заставить прекратить». Условное наклонение естественно выражает опасавшееся последствие предполагаемых будущих слов потомков.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: перестали бы бояться Яхве
  rationale: Передаёт прекращение благоговейного страха перед Богом, не смягчая ירא до одного лишь «почитать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет это различие.
- issue: Смысл выражения חֵלֶק בַּיהוָה
  choice: доля в Яхве
  alternative: участие в Яхве / наследие у Яхве
  rationale: Более буквальная формулировка сохраняет ёмкость и богословское напряжение исходного выражения, не сводя его только к наследию или культовому участию.
- issue: Модальность опасаемого последствия וְהִשְׁבִּיתוּ
  choice: могли бы сделать так
  alternative: сделают так
  rationale: Контекст передаёт предполагаемый довод будущих поколений и опасение восточных колен; условная форма естественна по-русски, хотя сама еврейская глагольная форма может звучать определённее.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Кавычками выделена предполагаемая будущая реплика; заключительное предложение объясняет опасавшееся последствие. Архаизмы вроде «сыны» не используются.
