  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: ru
  text: Вы не оставляли своих братьев всё это долгое время[a], вплоть до сегодняшнего дня, и исполняли возложенную на вас обязанность соблюдать заповедь Яхве, вашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих соплеменников»; буквально: «своих братьев». Здесь это слово обозначает других израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: не оставляли
  rationale: Глагол עזב означает «оставлять, покидать». В данном контексте «не оставляли» естественно передаёт длительную верность своим соплеменникам без излишне архаичного оттенка.
- source_word: אֲחֵיכֶם
  choice: своих братьев
  rationale: Сохранён мужской множественный термин родства «братья»; здесь он обозначает собратьев по народу Израиля. Более широкое значение пояснено в сноске.
- source_word: זֶה יָמִים רַבִּים
  choice: всё это долгое время
  rationale: Еврейский оборот указывает на продолжительный период вплоть до момента речи. Русское выражение естественно и сохраняет указательный компонент זֶה.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: вплоть до сегодняшнего дня
  rationale: Передаёт непрерывность действия от прошлого до дня, в который произносится похвала.
- source_word: וּשְׁמַרְתֶּם
  choice: и исполняли
  rationale: שׁמר здесь означает верно соблюдать возложенную обязанность. В сочетании с повелением русское «исполняли» звучит естественнее буквального «хранили».
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: вверенное вам повеление
  rationale: Сочетание обозначает обязанность или поручение, которое надлежало соблюдать. Такая передача сохраняет идею вверенной ответственности, избегая тяжеловесного «хранили хранение заповеди».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Прямо передаёт заветное обозначение Бога, принадлежащего в отношениях завета к адресатам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» сохраняет его как имя и является современной научно обоснованной передачей.
- issue: Объём значения אֲחֵיכֶם
  choice: своих братьев
  alternative: своих соплеменников; остальных израильтян
  rationale: Основной текст сохраняет конкретный родственный образ оригинала, а сноска сообщает, что в контексте он шире кровного родства.
- issue: Связь מִשְׁמֶרֶת מִצְוַת
  choice: вверенное вам повеление
  alternative: обязанность соблюдать повеление; поручение, данное повелением
  rationale: Конструкция допускает формально более буквальную передачу, но выбранный вариант сохраняет одновременно смысл порученной обязанности и божественного повеления, не превращая неоднозначную связь слов в отдельное конфессиональное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого круга читателей; образ «братьев» и личное имя Яхве сохранены. Длительные действия переданы несовершенным видом.
