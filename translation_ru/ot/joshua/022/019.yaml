id: JOS.22.19
reference: Joshua 22:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: ru
  text: Но если земля вашего владения[b] нечиста[a], перейдите в землю владения Яхве, где пребывает скиния Яхве[c], и поселитесь среди нас[d]. Только не восставайте ни против Яхве, ни против нас, воздвигая себе жертвенник помимо жертвенника Яхве, нашего Бога[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Не уточняется, в каком смысле земля считается нечистой: культовом, географическом или риторическом.'
    reason: preserved_ambiguity
  - marker: b
    text: 'Или: «земля вашего наследственного удела». Еврейское слово обозначает владение или земельный удел, нередко наследственный.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «где обитает скиния Яхве». В еврейском слова «обитает» и «скиния» образованы от одного корня.'
    reason: source_form
  - marker: d
    text: 'Или: «получите владение среди нас». Еврейский глагол может обозначать обретение земельного держания и поселение на нём.'
    reason: lexical_alternative
  - marker: e
    text: «Помимо» может означать также «отдельно от» или «в дополнение к».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Но если
  rationale: Сочетание вводит сильную оговорку; «но» естественно передаёт противительный оттенок, а ограничительное усиление далее выражено словом «только».
- source_word: טְמֵאָה
  choice: нечиста
  rationale: Сохраняет возможный культовый смысл нечистоты, не уточняя её природу.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם / אֶרֶץ אֲחֻזַּת יְהוָה
  choice: земля вашего владения / земля владения Яхве
  rationale: Сохраняет повтор одного и того же земельно-правового термина и противопоставление двух территорий; «владение» допускает также смысл наследственного удела.
- source_word: עִבְרוּ לָכֶם
  choice: перейдите
  rationale: Глагол указывает на переход, вероятно через Иордан. Бенефактивное לָכֶם отдельно не выражено, поскольку «перейдите для себя» в современном русском звучало бы неестественно; его смысл раскрывается последующим «поселитесь».
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: где пребывает скиния Яхве
  rationale: Передаёт словесную связь между שָׁכַן и מִשְׁכָּן и сохраняет скинию как субъект придаточного предложения.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: и поселитесь среди нас
  rationale: Естественно передаёт обретение места и земельного держания среди западных колен; имущественный оттенок отмечен в сноске.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: не восставайте ни против Яхве, ни против нас
  rationale: Конструкция «ни… ни…» естественно передаёт две параллельные направленности одного запрета, не ослабляя повторённое в еврейском отрицание.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: воздвигая себе жертвенник
  rationale: Деепричастный оборот выражает средство или обстоятельство восстания; «себе» передаёт לָכֶם.
- source_word: מִבַּלְעֲדֵי
  choice: помимо
  rationale: Слово сохраняет допустимые оттенки «вне», «кроме» и «в дополнение к», не решая заранее, каким именно образом второй жертвенник противопоставлен законному.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Природа нечистоты заиорданской земли
  choice: «земля… нечиста» без уточнения вида нечистоты
  alternative: «осквернена» в строго культовом смысле или непригодна из-за удалённости от святилища
  rationale: Еврейский текст не объясняет, является ли нечистота культовой, географической или риторически предполагаемой; перевод сохраняет эту неопределённость.
- issue: Статус дополнительного жертвенника
  choice: «жертвенник помимо жертвенника Яхве»
  alternative: запрет любого второго жертвенника либо конкретно соперничающего жертвенника для жертвоприношений
  rationale: Формулировка запрещает жертвенник вне признанного жертвенника Яхве, но сама по себе не излагает исчерпывающую теорию централизации культа.
- issue: Земля как владение Яхве
  choice: сохранить параллель «ваше владение / владение Яхве»
  alternative: сгладить до «ваша земля / земля, принадлежащая Яхве»
  rationale: 'Лексический повтор значим: предложение переселиться строится на противопоставлении нынешнего владения колен и территории, обозначенной как владение Яхве.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («скиния», «жертвенник», «воздвигая»). Синтаксис сделан ясным для обычного читателя; смысловые повторы и богословская неоднозначность оригинала сохранены.
