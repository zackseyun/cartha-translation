  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: ru
  text: 'Тогда потомки Рувима, потомки Гада и половина колена Манассии ответили и сказали главам подразделений Израиля[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главам тысяч Израиля»; вероятно, имеются в виду главы родовых, племенных или иных общественных подразделений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ответили
  rationale: Глагол ענה в породе каль с последовательным вау вводит ответ на предшествующее обвинение; «ответили» естественно сохраняет эту повествовательную связь.
- source_word: בְּנֵי רְאוּבֵן
  choice: потомки Рувима
  rationale: Буквально «сыновья Рувима»; в данном племенном контексте современное русское «потомки Рувима» передаёт родовую принадлежность яснее, чем буквальная формула.
- source_word: וּבְנֵי גָד
  choice: потомки Гада
  rationale: Выбор согласован с передачей בְּנֵי רְאוּבֵן и естественно обозначает племенную общность.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: половина колена Манассии
  rationale: Точная и привычная для русского библейского регистра передача конструктивного сочетания.
- source_word: וַיְדַבְּרוּ
  choice: 'ответили … :'
  rationale: Еврейская двухглагольная формула буквально означает «ответили и говорили». В русском двоеточие после «ответили» естественно вводит последующую прямую речь и позволяет избежать тяжеловесного «ответили и сказали».
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: главам родов Израиля
  rationale: רָאשֵׁי означает «главы, начальники», а אַלְפֵי буквально «тысячи», но здесь, вероятно, обозначает родовые либо административно-племенные подразделения. «Главы родов» ясно передаёт функцию, а буквальное значение отмечено в сноске.
