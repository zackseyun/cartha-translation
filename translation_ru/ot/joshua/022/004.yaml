source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: ru
  text: Теперь Яхве, ваш Бог, даровал покой вашим братьям[a], как и сказал им. Поэтому теперь повернитесь и идите к своим шатрам[b], в землю, которой вы владеете, которую дал вам Моисей, слуга Яхве, за Иорданом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть остальным израильтянам.
    reason: Уточняет контекстуальный смысл слова «братья».
  - marker: b
    text: 'Или: «к своим домам». Буквально: «к своим шатрам».'
    reason: Отмечает возможное идиоматическое значение при сохранении буквального образа в тексте.
  - marker: c
    text: 'Или: «по ту сторону Иордана».'
    reason: Сохраняет пространственную относительность еврейского выражения.
lexical_decisions:
- source_word: הֵנִיחַ
  choice: даровал покой
  rationale: Порода hифиль глагола נוח здесь означает дать покой, избавив от войны; «даровал покой» естественно и сохраняет причинительный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לַאֲחֵיכֶם
  choice: вашим братьям
  rationale: Сохраняет мужскую форму множественного числа и выраженную в контексте общность с остальными израильтянами.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: как и говорил им
  rationale: Сохраняет буквальное значение דבר «говорить», не превращая его без необходимости в более истолковывающее «обещал».
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: повернитесь и идите
  rationale: Передаёт оба повеления; этический дательный לָכֶם отдельно не выражен, поскольку по-русски он был бы неестественен.
- source_word: לְאָהֳלֵיכֶם
  choice: к своим шатрам
  rationale: Сохраняет конкретный исторический образ шатров, хотя выражение может обозначать возвращение домой.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: в землю, которой вы владеете
  rationale: Передаёт אֲחֻזָּה как земельное владение без внесения более богословски нагруженного понятия наследия.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: В почётном наименовании Моисея «слуга» уместнее русского «раб», не выдвигая на первый план несвободный статус.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Кратко и естественно обозначает сторону Иордана, находящуюся по ту сторону относительно говорящего.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога; «Яхве» сохраняет его как имя и отражает принятую научную реконструкцию произношения.
- issue: Характер Божьего высказывания
  choice: как и говорил им
  alternative: как и обещал им
  rationale: «Обещал» контекстуально возможно, но глагол דבר сам по себе означает «говорил»; основной текст сохраняет эту более широкую формулировку.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; конкретные образы и повтор «теперь» сохранены. Все маркеры сносок размещены непосредственно в основном тексте.
