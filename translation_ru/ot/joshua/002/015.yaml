lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Тогда она спустила их
  rationale: Каузативная форма глагола ירד означает «заставить спуститься, спустить»; повествовательная конструкция передана словом «тогда».
- source_word: בַּחֶבֶל
  choice: на верёвке
  rationale: חֶבֶל означает «верёвка, канат»; предлог указывает на средство спуска. В современном русском естественно сказать «спустить на верёвке».
- source_word: בְּעַד הַחַלּוֹן
  choice: через окно
  rationale: בְּעַד здесь обозначает движение через проём; «через окно» точно и естественно передаёт смысл.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему спуск через окно был возможен.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: её дом находился в городской стене
  rationale: Буквально дом расположен «в стене стены»; по контексту הַחוֹמָה — городская крепостная стена. Формулировка сохраняет пространственную неоднозначность предлога בְּ, не уточняя без необходимости архитектурное устройство.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: и жила она в стене
  rationale: Причастие יוֹשָׁבֶת выражает постоянное проживание; необычный порядок слов отражает усилительное повторение места жительства. «В стене» близко следует еврейскому тексту.
