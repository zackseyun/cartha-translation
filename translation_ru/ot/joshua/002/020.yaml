base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: ru
  text: Но если ты расскажешь об этом нашем деле[a], то мы будем свободны от твоей клятвы[b], которой ты обязала нас поклясться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об этом нашем деле»; также возможно: «об этом нашем слове» или «об этом нашем обстоятельстве». Еврейское слово может означать слово, дело или обстоятельство; здесь речь идёт о тайном деле разведчиков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будем невиновны (не будем виновны) в отношении твоей клятвы». Еврейское выражение означает, что, если тайна будет разглашена, разведчики более не будут связаны этой клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Сочетание союза с условной частицей вводит условие, противопоставленное предшествующему обещанию; «Но если» естественно передаёт этот поворот.
- source_word: תַּגִּידִי
  choice: ты расскажешь
  rationale: Каузативная форма נגד означает «сообщить, объявить, сделать известным»; в данном контексте речь идёт о разглашении тайного дела.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: об этом нашем деле
  rationale: דבר может обозначать слово, дело или обстоятельство. Здесь оно указывает на тайное дело разведчиков; перевод сохраняет указательное и притяжательное значения, не сужая смысл до одних только слов.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: то мы будем свободны
  rationale: Сочетание היה с נקי выражает освобождение от обязательства или ответственности; «будем свободны» ясно передаёт прекращение обязательной силы клятвы.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: от клятвы
  rationale: Предлог מן обозначает освобождение от обязательства. Принадлежность клятвы Раав естественно раскрывается последующим придаточным, поэтому в основном тексте достаточно «от клятвы».
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: которой ты нас связала
  rationale: Каузатив שׁבע означает, что Раав взяла с разведчиков клятву. Русское «связала клятвой» естественно передаёт как каузативность, так и обязательную силу присяги.
theological_decisions:
- issue: Значение נְקִיִּם в связи с клятвой
  choice: свободны от клятвы
  alternative: невиновны перед клятвой / чисты от клятвы
  rationale: Контекст говорит не о нравственной безгрешности разведчиков вообще, а об отсутствии ответственности за нарушение обещания при условии разглашения тайны.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной прямой речью. Женский род форм обращён к Раав. Формулировка сохраняет условный характер обещания и смысл освобождения от обязательства.
