  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: ru
  text: 'Они сказали Иисусу Навину: «Воистину, Господь отдал нам в руки всю землю, и все жители земли пали духом перед нами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: «воистину»
  rationale: В данном контексте частица вводит уверенный вывод разведчиков; «воистину» естественно передаёт усилительное значение, не превращая его в причинное «потому что».
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: «отдал нам в руки»
  rationale: Сохраняет образ передачи земли под власть Израиля и совершенный вид еврейского глагола.
- source_word: נָמֹגוּ
  choice: «пали духом»
  rationale: Буквально слово описывает таяние; здесь это образ утраты мужества от страха. Русское выражение передаёт смысл естественно и сохраняет эмоциональную силу.
- source_word: מִפָּנֵינוּ
  choice: «перед нами»
  rationale: Передаёт пространственно-причинный образ исходного выражения без избыточного уточнения «из-за нас».
- source_word: יְהוָה
  choice: «Господь»
  rationale: Традиционное и понятное русское представление тетраграмматона, уместное в основном тексте.
theological_decisions:
- issue: Уверенность разведчиков в уже совершённой передаче земли
  choice: «Господь отдал нам в руки»
  alternative: «Господь отдаст нам в руки»
  rationale: 'Сохранён совершенный вид נָתַן: обещанная победа представлена как уже решённая, без замены её будущим временем.'
- issue: Объём утверждения о страхе жителей
  choice: «все жители этой земли пали духом»
  alternative: «жители этой земли боятся»
  rationale: Сохранены всеобщность כָּל и сильная метафорическая семантика נָמֹגוּ, а не ослабленное общее обозначение страха.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским регистром. Имя יְהוֹשֻׁעַ передано общепринятой русской библейской формой «Иисус Навин», чтобы не смешивать его с Иисусом Христом. Синтаксический параллелизм двух утверждений сохранён.
