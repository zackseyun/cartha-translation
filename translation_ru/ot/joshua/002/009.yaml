source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: ru
  text: 'Она сказала этим людям: «Я знаю, что Яхве отдал вам эту землю, что нас охватил страх перед вами[a] и что все жители этой земли растаяли перед вами[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нас объял ужас перед вами».'
    reason: lexical_alternative
  - marker: b
    text: То есть пали духом из-за вас. Еврейский глагол буквально означает «растаяли».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: Она сказала этим людям
  rationale: Последовательная форма с וַ־ продолжает повествование; в русском отдельное «и» здесь необязательно. Указательное «этим» естественно передаёт определённость и отсылает к уже названным разведчикам.
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект стативного глагола выражает установившееся знание, актуальное в момент речи.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: Яхве отдал вам эту землю
  rationale: Перфект представляет дарование земли как уже решённое и совершившееся с точки зрения Раав, хотя завоевание ещё продолжается. «Эту землю» естественно обозначает конкретную страну, о которой идёт речь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: нас охватил страх перед вами
  rationale: Еврейский оборот буквально изображает страх, павший на людей. Русское «охватил страх» естественно передаёт внезапно овладевший ими ужас, а «перед вами» ясно указывает источник страха.
- source_word: נָמֹגוּ
  choice: растаяли
  rationale: Сохранён яркий образ еврейского глагола «таять, растворяться», метафорически обозначающий утрату мужества.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: все жители этой земли
  rationale: Причастная конструкция обозначает всех живущих в данной стране; «жители» кратко и естественно передаёт её по-русски.
- source_word: מִפְּנֵיכֶם
  choice: перед вами
  rationale: 'Сохранена пространственно-причинная неоднозначность идиомы: жители теряют мужество при приближении и из-за присутствия Израиля.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога. Форма «Яхве» передаёт тетраграмматон и не подменяет имя титулом.
- issue: Дарование земли как уже совершившийся факт
  choice: отдал вам эту землю
  alternative: даёт вам эту землю
  rationale: Перфект נָתַן представляет Божье решение как совершившееся и действенное, не отрицая того, что фактическое завоевание ещё продолжается.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены достоинство речи и образ «растаяли», а менее прозрачный смысл пояснён в сноске. Маркеры сносок размещены при тех выражениях, к которым относятся.
