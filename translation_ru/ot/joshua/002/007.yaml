base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: ru
  text: И люди преследовали их по дороге к Иордану, до переправ[a]. Ворота закрыли за ними, как только преследователи вышли вслед за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до мест перехода»; имеются в виду мелководные места Иордана, где реку можно было перейти вброд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: И люди
  rationale: Определённое множественное число отсылает к посланным царём людям из ближайшего контекста; союз сохраняет последовательность еврейского повествования.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: погнались за ними
  rationale: Естественно передаёт преследование в данном повествовательном контексте без избыточного русского сочетания «преследовали за ними».
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: по дороге к Иордану
  rationale: דֶּרֶךְ обозначает дорогу или путь; контекст указывает на маршрут в сторону Иордана.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: до переправ
  rationale: מַעְבָּרוֹת — места перехода через реку, вероятнее всего броды; עַל в контексте движения естественно передаётся как предел маршрута.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: Ворота закрыли
  rationale: Безлично-неопределённая русская конструкция сохраняет невыраженный в тексте конкретный субъект глагола; «ворота» — обычное русское обозначение городских ворот.
- source_word: אַחֲרֵי
  choice: за ними
  rationale: В сочетании с закрытием ворот указывает, что ворота закрыли вслед за вышедшими преследователями.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: как только ... вышли
  rationale: Передаёт временную последовательность и вероятную непосредственность закрытия ворот после выхода людей.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: преследователи вышли в погоню
  rationale: Субстантивированное причастие передано существительным; выражение «вышли в погоню» естественно передаёт повторное указание на преследование лазутчиков.
