  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: ru
  text: 'Она сказала им: «Идите в горы[a], чтобы преследователи не наткнулись на вас[b], и прячьтесь там три дня, пока преследователи не вернутся. После этого пойдёте своей дорогой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на гору»; еврейское слово может обозначать как определённую гору, так и окружающую гористую местность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не встретили вас» или «не застали вас»; глагол обозначает встречу или столкновение, здесь — в условиях преследования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: в горы
  rationale: Существительное הַר может обозначать как отдельную гору, так и гористую местность. В контексте укрытия естественное русское «в горы» передаёт направление и допускает региональное понимание.
- source_word: לֵּכוּ
  choice: идите
  rationale: Прямой императив естественно и точно передаёт повелительную форму глагола הלך.
- source_word: פֶּן
  choice: чтобы … не
  rationale: Конструкция естественно передаёт предостережение и отрицательную цель, выраженные частицей פֶּן.
- source_word: יִפְגְּעוּ בָכֶם
  choice: не наткнулись на вас
  rationale: פגע с предлогом ב обозначает встречу или столкновение. «Наткнулись на вас» естественно передаёт нежелательную встречу с преследователями, не усиливая значение до обязательного «настигли».
- source_word: הָרֹדְפִים
  choice: преследователи
  rationale: Причастие от רדף употреблено субстантивно и обозначает тех, кто ведёт погоню.
- source_word: וְנַחְבֵּתֶם
  choice: и прячьтесь
  rationale: Форма нифаля имеет здесь возвратно-пассивный смысл; русское «прячьтесь» прямо и естественно выражает требование скрыться.
- source_word: שָׁמָּה
  choice: там
  rationale: Наречие указывает на названное место укрытия; «там» сохраняет эту локальную отсылку.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: три дня
  rationale: Винительный длительности естественно передаётся по-русски без дополнительного предлога.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: пока преследователи не вернутся
  rationale: В русском языке после «пока» нормативная отрицательная конструкция естественно обозначает предел ожидания и не меняет положительного смысла возвращения.
- source_word: וְאַחַר
  choice: после этого
  rationale: Выражение ясно обозначает следующую стадию после трёхдневного ожидания.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: пойдёте своей дорогой
  rationale: Идиоматическое русское выражение передаёт последующее разрешённое действие без излишне формального оттенка.
