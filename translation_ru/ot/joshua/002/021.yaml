lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: по вашим словам
  rationale: Сохраняет множественное число דְּבָרִים и передаёт согласие Раав с изложенными разведчиками условиями.
- source_word: כֵּן הוּא
  choice: Пусть будет
  rationale: Естественно передаёт формулу согласия и подтверждения, не превращая её в более буквальное, но менее идиоматичное «так оно».
- source_word: וַתְּשַׁלְּחֵם
  choice: она отпустила их
  rationale: В данном контексте שׁלח обозначает, что Раав позволила разведчикам уйти; «отпустила» естественно сочетается с последующим «они ушли».
- source_word: וַיֵּלֵכוּ
  choice: они ушли
  rationale: Прямо передаёт повествовательную форму глагола הלך и движение прочь из дома Раав.
- source_word: וַתִּקְשֹׁר
  choice: она привязала
  rationale: Глагол קשר означает связывать или привязывать; здесь речь идёт о закреплении опознавательного знака у окна.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: алую нить
  rationale: В этом сочетании תִּקְוָה обозначает не «надежду», а нить, шнур или верёвку; «алая нить» — естественное и узнаваемое обозначение видимого знака.
- source_word: בַּחַלּוֹן
  choice: к окну
  rationale: Предлог בְּ указывает на место закрепления. По-русски с глаголом «привязала» естественно требуется конструкция «к окну», хотя формально возможны «в окне» или «у окна».
