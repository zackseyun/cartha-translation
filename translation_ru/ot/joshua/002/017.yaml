  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: ru
  text: 'И эти люди сказали ей: «Мы будем свободны от этой твоей клятвы, которой ты заставила нас поклясться».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: И сказали ей
  rationale: Форма wayyiqtol продолжает повествование; «и сказали ей» естественно передаёт последовательность и адресата речи.
- source_word: הָאֲנָשִׁים
  choice: мужчины
  rationale: Еврейский текст употребляет общее обозначение «мужчины», не называя их здесь разведчиками.
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: мы будем свободны
  rationale: נָקִי в контексте клятвы означает свободу от обязательства или ответственности. Будущее время отражает контекст последующего условия, хотя форма сама по себе допускает буквальное «мы свободны».
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: от этой твоей клятвы
  rationale: Сохранены значение отделения у מִן, указательное «этой» и обращённое к Раав притяжательное «твоей».
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: которой ты нас связала
  rationale: 'Hiphil глагола שׁבע имеет каузативный смысл: Раав заставила мужчин поклясться, тем самым связав их клятвой. Русская формулировка избегает тяжеловесного повтора «клятвы, которой ты заставила нас поклясться».'
theological_decisions:
- issue: Временное значение נְקִיִּם אֲנַחְנוּ
  choice: мы будем свободны
  alternative: мы свободны
  rationale: Именное предложение буквально не маркирует время, но следующие стихи устанавливают условия, при которых мужчины не будут связаны клятвой. Будущее лучше выражает контекст, не превращая заявление в утверждение о немедленном отказе от обязательства.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохраняет прямоту оригинала; юридико-заветный оттенок слова נָקִי передан выражением «свободны от… клятвы».
