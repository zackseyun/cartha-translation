  verdict: revise
  source_fidelity: 'Смысл נְקִיִּם в данном контексте — освобождение от обязательства/ответственности по клятве — в целом передан верно, как и контекстуально обусловленное будущее значение. Однако «которой ты нас связала» лишь косвенно выражает каузатив הִשְׁבַּעְתָּנוּ («заставила нас поклясться») и допускает иной оттенок: будто Раав сама связала их своей клятвой.'
