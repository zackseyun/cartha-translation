  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: ru
  text: Когда с наступлением темноты[a] должны были закрыть ворота, эти люди вышли. Я не знаю, куда они пошли. Скорее, гонитесь за ними — вы их настигнете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда уже стемнело»; еврейское выражение указывает на время закрытия ворот при наступлении темноты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда
  rationale: Формула вводит временную обстановку следующего события; современное «когда» передаёт эту функцию без архаического «и было».
- source_word: הַשַּׁעַר
  choice: ворота
  rationale: В контексте речь идёт о городских воротах Иерихона; множественное «ворота» является обычным русским соответствием и не требует поясняющего добавления «городские».
- source_word: לִסְגֹּר
  choice: уже должны были закрыть
  rationale: Инфинитив с ל после וַיְהִי указывает на близкое, ожидаемое закрытие ворот. Такая формулировка естественно передаёт момент непосредственно перед закрытием, не утверждая, что оно уже завершилось.
- source_word: בַּחֹשֶׁךְ
  choice: при наступлении темноты
  rationale: Оборот обозначает время закрытия ворот, связанное с наступлением темноты. В сноске сохранено также возможное понимание «когда уже стемнело».
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: эти люди вышли
  rationale: יצא означает конкретное движение наружу. Указательное «эти» естественно отсылает к уже упомянутым людям, не называя их разведчиками сверх формулировки стиха.
- source_word: לֹא יָדַעְתִּי
  choice: Я не знаю
  rationale: Хотя глагол имеет перфектную форму, в прямой речи он выражает заявляемое Раав нынешнее незнание; русский презенс передаёт это естественно.
- source_word: אָנָה הָלְכוּ
  choice: куда они пошли
  rationale: אָנָה спрашивает о направлении или месте назначения; «куда» точнее русского «где» и сохраняет движение.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: Скорее гонитесь за ними
  rationale: Императив требует немедленного преследования. «Гонитесь за ними» ясно передаёт רדף и אַחֲרֵיהֶם, а «скорее» естественно выражает наречное מַהֵר.
- source_word: כִּי תַשִּׂיגֻם
  choice: вы их настигнете
  rationale: 'Hiphil נשׂג означает догнать или настичь. Бессоюзное присоединение после тире естественно передаёт мотивирующее כי: преследователи, по словам Раав, настигнут этих людей.'
