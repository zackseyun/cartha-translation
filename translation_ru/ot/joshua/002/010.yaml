  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: причинное כִּי («Ведь»), перфект «мы слышали», каузативное действие Яхве над водами, временной оборот исхода из Египта, неопределённо-широкое «что вы сделали», локализацию царей за Иорданом и חרם по отношению к Сихону и Огу. «Предали заклятию» — устоявшаяся русская передача חרם и сохраняет специальный характер действия, не сводя его к обычной победе или убийству.'
