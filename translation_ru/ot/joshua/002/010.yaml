  terminology: «Яхве» верно передаёт тетраграмматон как личное имя. «Тростниковое море» обоснованно представляет буквальное значение Ям-Суф, а сноска надлежащим образом отмечает традиционное «Красное море», не выдавая спорную географическую идентификацию за несомненную. Имена «Сихон» и «Ог», этноним «аморреи» и термин «заклятие» переданы последовательно.
