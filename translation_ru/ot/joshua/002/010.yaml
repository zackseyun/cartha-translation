source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: ru
  text: Ведь мы слышали, как Яхве иссушил перед вами воды Тростникового моря[a], когда вы вышли из Египта, и что вы сделали с двумя царями аморреев за Иорданом — Сихоном и Огом, — которых вы предали заклятию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. Ям-Суф — буквально «Тростниковое море»; традиционно: «Красное море».'
    reason: Лексическая и традиционная альтернативы названия водоёма.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание страха жителей страны, продолжая мысль контекста; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: שָׁמַעְנוּ
  choice: мы слышали
  rationale: Еврейский перфект обозначает уже состоявшееся получение вести с сохраняющимся результатом; в русском контексте естественно простое прошедшее время.
- source_word: הוֹבִישׁ
  choice: иссушил
  rationale: Hiphil от יבש означает «сделать сухим, высушить»; «иссушил» точно и возвышенно, но понятно передаёт действие над водами.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно представленное тетраграмматоном, а не заменяет его титулом.
- source_word: מֵי יַם סוּף
  choice: воды Тростникового моря
  rationale: מֵי — множественное «воды», а יַם סוּף буквально означает «Тростниковое море». Традиционное отождествление с Красным морем сохранено в примечании.
- source_word: מִפְּנֵיכֶם
  choice: перед вами
  rationale: Передаёт пространственное значение удаления вод с пути израильтян и естественно звучит по-русски.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: когда вы вышли из Египта
  rationale: Предлог ב при инфинитивной конструкции имеет временное значение «когда»; формулировка сохраняет аспект исхода и естественна в современном русском.
- source_word: עֲשִׂיתֶם לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: что вы сделали с двумя царями аморреев
  rationale: Сохраняет широкий смысл עשה и не предваряет более конкретное описание, данное далее глаголом חרם.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Обычная русская географическая формула, обозначающая противоположную сторону Иордана с точки зрения говорящей.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: Сихоном и Огом
  rationale: Имена стоят в приложении и уточняют, о каких двух царях идёт речь; русское управление согласовано с оборотом «сделали с».
- source_word: הֶחֱרַמְתֶּם אֹתָם
  choice: которых вы предали заклятию
  rationale: Hiphil חרם обозначает посвящение под херем, влекущее уничтожение. «Предали заклятию» сохраняет особый сакрально-военный смысл и не сводит его к нейтральному «победили».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Передача понятия חרם
  choice: предали заклятию
  alternative: полностью уничтожили
  rationale: Выбранная формулировка сохраняет специфическую идею херема — посвящения по заклятию, обычно ведущего к уничтожению, — не устраняя богословскую напряжённость термина.
- issue: Идентификация יַם סוּף
  choice: Тростниковое море в основном тексте
  alternative: Красное море
  rationale: Буквальное лексическое значение названия сохранено в тексте, а традиционное географическое наименование дано в примечании без принудительного разрешения вопроса идентификации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся близким к еврейскому, но читается естественно; специальное понятие херема передано традиционным и понятным в контексте словом «заклятие».
