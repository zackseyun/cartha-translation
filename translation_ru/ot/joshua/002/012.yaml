  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: ru
  text: А теперь, прошу, поклянитесь мне именем Яхве, что, подобно тому как я оказала вам милость, так и вы окажете милость дому моего отца и дадите мне надёжный знак[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «знак истины»; также возможно: «верный знак», «достоверный знак» или «надёжный залог».'
    reason: Сочетание אוֹת אֱמֶת допускает оттенки подлинности, достоверности и обязательного заверения.
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и соединительный элемент וְ, и переход к настоятельной просьбе, выраженный עַתָּה.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: прошу, поклянитесь мне
  rationale: Множественное повелительное הִשָּׁבְעוּ передано глаголом «поклянитесь», а частица נָא — вежливым и настойчивым «прошу».
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог בְּ обозначает Того, чьим именем клянутся; личное имя יהוה передано как «Яхве».
- source_word: כִּי ... וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: что, как я оказала ... так и вы окажете
  rationale: כִּי вводит содержание требуемой клятвы, а корреляция «как ... так и» естественно передаёт взаимность, подчёркнутую גַּם אַתֶּם.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד ... עִם בֵּית אָבִי חֶסֶד
  choice: я оказала вам милость ... вы окажете милость дому моего отца
  rationale: Повтор слова חֶסֶד сохранён. «Милость» передаёт благожелательное и верное отношение, не сужая значение до формального договора.
- source_word: בֵּית אָבִי
  choice: дом моего отца
  rationale: Сохранён древнееврейский семейно-родовой оборот, понятный по-русски как обозначение отцовской семьи и всего его домочадства.
- source_word: אוֹת אֱמֶת
  choice: надёжный знак
  rationale: Сочетание буквально связывает знак с истинностью и достоверностью; «надёжный знак» естественно выражает знак или заверение, на которое можно положиться, не устраняя возможный оттенок залога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл חֶסֶד в просьбе Раав
  choice: милость
  alternative: доброта; верность; преданная любовь
  rationale: Контекст говорит о взаимном благодеянии и обязательстве верно поступить с семьёй Раав. «Милость» сохраняет широкий нравственный смысл слова, не превращая действие в явно сформулированный завет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «милость» и выражение «дом моего отца» намеренно сохранены для отражения структуры и образности еврейского текста; инверсия избегается ради ясности.
