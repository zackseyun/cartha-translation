base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: ru
  text: И возвратились оба человека, спустились с гор, переправились и пришли к Иисусу, сыну Навина. Они рассказали ему обо всём, что с ними произошло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обо всём, что встретило их»; возможный перевод: «обо всём, что с ними случилось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: возвратились
  rationale: Глагол שוב в последовательности повествования обозначает возвращение двух посланных после выполнения поручения; «возвратились» естественно и соответствует достойному литературному регистру.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: оба человека
  rationale: Передаёт буквальное обозначение персонажей как «двух мужчин/людей», не добавляя из контекста слово «разведчики»; в данном контексте русское «оба человека» естественно отсылает к уже известной паре.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: спустились с гор
  rationale: Слово הָהָר может обозначать как отдельную гору, так и горную местность. Контекст допускает региональное значение; «с гор» сохраняет эту географическую широту и звучит естественно по-русски.
- source_word: וַיַּעַבְרוּ
  choice: переправились
  rationale: Глагол עבר означает переход или переправу. Дополнение в еврейском тексте не названо, поэтому перевод также не уточняет, через что именно они переправились.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: пришли к Иисусу, сыну Навина
  rationale: Сохраняется обычная русская библейская форма имени יהושע — «Иисус» — и отчество-идентификация «сын Навина»; управление «пришли к» непосредственно передаёт בוא אל.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: они рассказали ему
  rationale: Пиэль от ספר здесь означает подробно рассказать или поведать; «рассказали ему» ясно и естественно передаёт сообщение о пережитом.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: обо всём, что с ними произошло
  rationale: Буквально выражение говорит обо «всём находившем/постигавшем их», то есть обо всём, что им встретилось или случилось с ними. Выбранная формулировка передаёт идиоматический смысл и сохраняет всеохватность כָּל.
