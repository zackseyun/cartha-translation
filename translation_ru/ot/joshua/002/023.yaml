translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис сохраняет последовательность еврейских действий, но разделение на два предложения предотвращает тяжеловесность. Слово «разведчики» не добавлено, поскольку в данном стихе исходный текст называет их «людьми».
