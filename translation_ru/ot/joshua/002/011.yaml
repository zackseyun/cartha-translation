  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: ru
  text: Когда мы услышали об этом, наши сердца растаяли, и ни у кого уже не осталось духа[a] из-за вас, потому что Яхве, ваш Бог[b], — Бог на небесах вверху и на земле внизу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни у кого уже не осталось мужества». Буквально по-еврейски: «ни в ком уже не поднялся дух».'
    reason: lexical_alternative
  - marker: b
    text: Имя «Яхве» передаёт еврейское божественное имя, записываемое четырьмя согласными YHWH и традиционно заменяемое в некоторых переводах словом «Господь».
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Когда мы услышали об этом
  rationale: Последовательная форма с וַ в данном контексте вводит временную связь с последовавшей реакцией. «Об этом» естественно отсылает к рассказанному в предыдущих стихах.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: наши сердца растаяли
  rationale: Сохранён еврейский образ тающего сердца, передающий страх и утрату мужества; русская форма во множественном числе естественно соотносится с «мы».
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: ни у кого уже не осталось духа
  rationale: רוּחַ здесь означает внутреннюю силу и мужество. Перевод сохраняет метафору оригинала, а «ни у кого» естественно передаёт обобщённое בְּאִישׁ без неоправданного ограничения только мужчинами.
- source_word: מִפְּנֵיכֶם
  choice: из-за вас
  rationale: Буквально выражение связано с нахождением «перед лицом» кого-либо, но здесь обозначает причину страха жителей земли.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание только что описанного страха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном YHWH, без замены его титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Фраза относится к Богу Израиля и стоит при личном имени Яхве.
- source_word: הוּא אֱלֹהִים
  choice: — Бог
  rationale: Именная конструкция прямо утверждает, что Яхве есть Бог; тире позволяет естественно передать её по-русски без добавления отсутствующих в тексте слов «единый» или «истинный».
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: на небесах вверху
  rationale: Сохранены множественное שָׁמַיִם и пространственное противопоставление верхнего и нижнего мира.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: и на земле внизу
  rationale: Фраза завершает меризм «небеса — земля», выражающий всеохватную власть Бога.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон YHWH. Транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Объём исповедания Раав
  choice: Яхве, ваш Бог, — Бог на небесах вверху и на земле внизу
  alternative: Яхве один есть Бог; Яхве — истинный Бог
  rationale: Текст утверждает божественность и вселенское владычество Яхве посредством пары «небеса — земля», но не содержит отдельного слова «один» или «истинный»; поэтому они не добавлены.
- issue: Значение רוּחַ в описании хананеев
  choice: духа
  alternative: мужества
  rationale: В контексте речь идёт о внутренней стойкости, а не о Святом Духе. Слово «духа» сохраняет образ и некоторую смысловую широту оригинала, тогда как сноска поясняет подразумеваемое мужество.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образы «сердца растаяли» и «не осталось духа», но синтаксис сделан естественным для широкого круга читателей; архаизмы и конфессионально маркированные добавления исключены.
