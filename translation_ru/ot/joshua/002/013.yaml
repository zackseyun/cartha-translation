  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: ru
  text: и сохраните в живых моего отца и мою мать, моих братьев и моих сестёр, и всех, кто у них есть[a], и избавьте нас от смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё, что им принадлежит». Выражение может охватывать не только домочадцев и зависимых от семьи людей, но и всё их имущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: сохраните в живых
  rationale: Порода хифиль глагола חיה выражает причинение или сохранение жизни. В контексте просьбы формулировка «сохраните в живых» точно передаёт каузативный смысл и звучит естественно и торжественно.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: моего отца и мою мать, моих братьев и моих сестёр
  rationale: Родственные обозначения переданы по отдельности в соответствии с последовательностью и акцентом еврейского текста. Форму אחותי контекстуально передаём множественным числом «моих сестёр».
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: всех, кто у них есть
  rationale: Буквально выражение допускает как личное, так и более широкое имущественное понимание. В контексте сохранения жизни наиболее вероятны домочадцы и зависимые лица; оборот «всех, кто у них есть» сохраняет личную направленность, а примечание отмечает более широкую возможность.
- source_word: וְהִצַּלְתֶּם
  choice: избавьте
  rationale: Хифиль глагола נצל означает избавить или вызволить из опасности. «Избавьте» соответствует сочетанию «от смерти» и сохраняет серьёзный регистр.
- source_word: נַפְשֹׁתֵינוּ
  choice: нас
  rationale: Здесь נֶפֶשׁ обозначает самих людей, находящихся под угрозой смерти, а не нематериальные «души». Русское «нас» естественно передаёт этот конкретный личный смысл.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Прямое соответствие еврейскому предложному обороту, сохраняющее его лаконичность и весомость.
theological_decisions:
- issue: Значение נַפְשֹׁתֵינוּ
  choice: нас
  alternative: наши души / наши жизни
  rationale: В данном контексте слово относится к людям, которым грозит физическая смерть. Перевод «души» мог бы внести несвойственное этому месту противопоставление души и тела, а «наши жизни» возможно, но менее естественно в сочетании «избавьте ... от смерти».
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Повтор союзов частично сохранён для передачи настойчивого перечисления, но без неестественной для русского перегруженности.
