- from: А она отвела их на крышу и спрятала среди стеблей льна, разложенных у неё на крыше.
  to: Но она уже подняла их на крышу и спрятала среди разложенных там для неё стеблей льна.
  rationale: «Уже» передаёт предварительный характер действий в повествовательном контексте; «подняла» сохраняет каузативное значение еврейского глагола. «Разложенных там для неё» естественно связывает причастный оборот с крышей и передаёт לָהּ без ненужного толкования того, кем именно были разложены стебли.
