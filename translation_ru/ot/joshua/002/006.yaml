  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: ru
  text: Но она уже подняла их на крышу и спрятала среди разложенных там для неё стеблей льна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעֱלָתַם
  choice: отвела их на крышу
  rationale: Глагол עלה в каузативной породе означает «поднять/отвести наверх»; по-русски в данном повествовательном контексте естественно «отвела ... на крышу».
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: среди стеблей льна
  rationale: Выражение буквально обозначает древесные части льна, то есть льняные стебли; «среди» естественно передаёт укрытие внутри разложенного материала.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: разложенных у неё
  rationale: Причастие передаёт состояние уложенных или разложенных стеблей; לָהּ сохранено без чрезмерного уточнения как «у неё», что может указывать на принадлежность или нахождение в её распоряжении.
