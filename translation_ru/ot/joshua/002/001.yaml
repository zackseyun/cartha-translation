source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: ru
  text: 'Иисус Навин, сын Нуна, тайно послал из Шиттима двух мужчин на разведку и сказал: «Пойдите, осмотрите землю и Иерихон».[a] Они пошли, пришли в дом проститутки по имени Раав[b] и легли там.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «землю и Иерихон». Иерихон может быть назван особо как главный объект разведки в пределах этой земли.'
    reason: Сохраняется формальная координация еврейского текста и отмечается возможное смысловое отношение между двумя объектами.
  - marker: b
    text: 'Иногда переводят: «дом хозяйки постоялого двора», однако еврейское слово обычно означает «проститутка».'
    reason: Фиксируется известное альтернативное толкование без ослабления основного лексического значения.
  - marker: c
    text: 'Возможно: «остались там на ночлег». Буквально: «легли там».'
    reason: Поясняется вероятный контекстуальный смысл при сохранении буквальной формулировки и её неоднозначности.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח, естественное и точное в современном русском языке.
- source_word: מִן הַשִּׁטִּים
  choice: из Шиттима
  rationale: Шиттим передан как географическое название, а не переведён как «Акациевая роща».
- source_word: שְׁנַיִם אֲנָשִׁים מְרַגְּלִים
  choice: двух мужчин разведчиками
  rationale: Сохраняется указание на двух мужчин и их функцию; «разведчики» в данном контексте естественно передаёт смысл тайного сбора сведений.
- source_word: חֶרֶשׁ
  choice: тайно
  rationale: Наречное употребление указывает на скрытый характер поручения.
- source_word: לְכוּ רְאוּ
  choice: пойдите, осмотрите
  rationale: «Осмотрите» передаёт не простое зрительное восприятие, а целенаправленное обследование местности.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: землю и Иерихон
  rationale: Сохранено явное еврейское соединение «и», без истолкования Иерихона как пояснения или особенно важной части земли.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: в дом женщины-блудницы
  rationale: זוֹנָה обычно означает женщину, занимающуюся проституцией; «блудница» здесь является ясным, литературным и библейски уместным русским обозначением без эвфемистического переосмысления.
- source_word: וּשְׁמָהּ רָחָב
  choice: по имени Раав
  rationale: Естественная русская конструкция, точно сообщающая имя женщины.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: легли там
  rationale: Сохраняется буквальный смысл שכב и неоднозначность контекста; перевод не утверждает ни половой связи, ни формального постоя.
theological_decisions:
- issue: Занятие Раав (זוֹנָה)
  choice: блудница
  alternative: содержательница постоялого двора
  rationale: Основное лексическое значение זוֹנָה — «проститутка, блудница». Альтернатива основана на контекстуальном смягчении, а не на обычном значении еврейского слова.
- issue: Смысл выражения וַיִּשְׁכְּבוּ שָׁמָּה
  choice: легли там
  alternative: остановились там на ночлег
  rationale: Буквальный перевод сохраняет повествовательную неоднозначность и не вводит ни сексуального смысла, ни более конкретного устройства ночлега, которых текст прямо не утверждает.
- issue: Соотношение «земли» и «Иерихона»
  choice: землю и Иерихон
  alternative: землю, особенно Иерихон
  rationale: Союз וְ непосредственно соответствует «и»; вариант «особенно» правдоподобно объясняет отношение объектов, но делает его более определённым, чем исходный текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской тональностью. Синтаксис сделан ясным для обычного читателя; имена переданы в привычной русской библейской форме. Слово «блудница» выбрано как dignified и понятное, хотя слегка традиционное; оно избегает как грубости, так и эвфемизма.
