  naturalness: '«Сам будет отвечать за свою кровь» по-русски звучит не вполне естественно: обычно отвечают за смерть или кровопролитие, а не «за кровь». Более гладкая современная юридически окрашенная передача возможна без потери смысла.'
  terminology: Юридическая формула о крови на голове в сноске объяснена точно. В основном тексте следует последовательно передать ответственность за смерть; это соответствует функции еврейской идиомы, не выдавая толкование за особую доктрину.
