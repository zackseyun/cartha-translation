revisions:
- from: Всякий, кто выйдет за двери твоего дома, сам будет отвечать за свою кровь, а мы будем невиновны. Но если кто-нибудь поднимет руку на того, кто будет с тобой в доме, то за его кровь будем отвечать мы.[a]
  to: Всякий, кто выйдет через двери твоего дома, сам будет виновен в своей смерти, а мы будем невиновны. Но за смерть всякого, кто будет с тобой в доме, будем виновны мы, если на него поднимут руку.[a]
  rationale: 'Исправлен способ выражения движения через двери и заменён неестественный оборот «отвечать за свою кровь» на понятное современному читателю выражение юридической ответственности за смерть. Второе условие возвращено к порядку исходного текста: сначала назван находящийся в доме человек, затем — случай насилия над ним. Сноска сохраняет буквальный еврейский образ и объясняет, что русская смысловая передача относится к ответственности за кровопролитие или смерть.'
