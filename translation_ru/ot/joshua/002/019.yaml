  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: ru
  text: Всякий, кто выйдет через двери твоего дома, сам будет виновен в своей смерти, а мы будем невиновны. Но за смерть всякого, кто будет с тобой в доме, будем виновны мы, если на него поднимут руку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его кровь будет на его голове» и «его кровь будет на наших головах». Это юридические выражения, указывающие, на ком лежит ответственность за кровопролитие или смерть.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: не передано отдельно
  rationale: Форма вводит следующее условие соглашения; по-русски естественно сразу сформулировать это условие.
- source_word: כֹּל אֲשֶׁר
  choice: всякий, кто / тот, кто
  rationale: Оборот имеет распределительное значение и относится к каждому отдельному человеку.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: выйдет за двери твоего дома
  rationale: Передаёт движение наружу без неестественного дублирования «выйдет наружу из дверей».
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: сам будет отвечать за свою кровь
  rationale: Еврейский юридический образ означает личную ответственность за последующее кровопролитие или смерть. По-русски буквальное «его кровь на его голове» малопонятно и звучит ненормативно, поэтому смысл передан прямо.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: а мы будем невиновны
  rationale: В контексте клятвенного соглашения речь идёт об отсутствии вины и ответственности.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: тот, кто будет с тобой в доме
  rationale: Сохраняется противопоставление между вышедшим из дома и оставшимся под его защитой.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: за его кровь будем отвечать мы
  rationale: Передаёт тот же юридический оборот, что и в первой половине стиха, и сохраняет параллелизм ответственности.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: если кто-нибудь поднимет руку на него
  rationale: Идиома обозначает насильственное действие против человека; неопределённый субъект не уточняется.
theological_decisions:
- issue: Передача формулы ответственности за кровь
  choice: 'Передать значение прямо: «отвечать за свою/его кровь»'
  alternative: 'Сохранить буквальный образ: «его кровь будет на его/наших головах»'
  rationale: Это юридико-этическая формула распределения ответственности, а не утверждение особой доктрины. Прямая русская передача ясна обычному читателю и сохраняет правовой смысл и параллелизм.
- issue: Неопределённое лицо и грамматический род
  choice: Использовать формы «всякий, кто», «тот, кто», «его»
  alternative: Использовать множественное число или гендерно нейтрализовать конструкцию
  rationale: В еврейском тексте употреблено распределительное единственное число; русская конструкция с грамматическим мужским родом естественна и относится к человеку любого пола.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Юридическая строгость соглашения сохранена; архаические и калькированные обороты устранены. Маркер сноски поставлен после обеих соотнесённых формул ответственности.
