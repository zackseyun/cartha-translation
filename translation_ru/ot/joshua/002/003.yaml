    rationale: В данном контексте разведывательный смысл возможен и вероятен, но сам глагол допускает более нейтральное «обследовать/исследовать». Английская аудиторская запись также ставит нейтральное «search out» в основной текст, а «spy out» — в сноску.
  - severity: medium
    issue: Сноска предлагает «обследовать», хотя основной текст уже содержит более узкое «разведать».
    rationale: Для последовательного отражения лексической альтернативы нейтральное значение следует дать в основном тексте, а разведывательное — как вариант.
  - severity: low
    issue: «Людей» не выражает мужской референт столь ясно, как оригинал.
    rationale: В контексте референт понятен, но «тех мужчин» сохраняет значение אֲנָשִׁים без неестественности.
