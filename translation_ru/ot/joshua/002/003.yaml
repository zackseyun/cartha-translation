base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: ru
  text: 'И царь Иерихона послал к Раав сказать: «Выведи тех мужчин, которые пришли к тебе и вошли в твой дом, потому что они пришли обследовать всю землю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разведать всю землю». Еврейский глагол в этом контексте может обозначать разведывательное обследование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная глагольная форма от שׁלח обозначает отправление; в данном контексте подразумевается посылка людей или приказа, но способ передачи прямо не указан.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: царь Иерихона
  rationale: Сопряжённая конструкция естественно передаётся родительным падежом; определённость правителя ясна из контекста.
- source_word: אֶל רָחָב
  choice: к Раав
  rationale: Предлог אֶל при глаголе посылания указывает адресата или направление; «к Раав» сохраняет возможность того, что царь послал к ней посланников.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Стандартная формула введения прямой речи; инфинитив по-русски естественно сочетается с «послал».
- source_word: הוֹצִיאִי
  choice: Выведи
  rationale: Женская форма повелительного Hiphil от יצא означает побудить выйти; «выведи» точно и естественно передаёт приказ.
- source_word: הָאֲנָשִׁים
  choice: людей
  rationale: В контексте речь идёт о мужчинах, однако после «выведи» современное русское «людей» звучит естественно и не меняет референтов.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: которые пришли к тебе
  rationale: Причастная конструкция описывает уже прибывших людей; относительное предложение естественно для русского повествования.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: которые вошли в твой дом
  rationale: בוא с направлением к дому допускает «пришли в твой дом»; «вошли» передаёт движение внутрь и избегает тяжёлого повтора глагола, не меняя смысла в контексте.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание приказа и обвинения.
- source_word: לַחְפֹּר
  choice: разведать
  rationale: חפר здесь обозначает обследование территории с целью получения сведений. «Разведать» сохраняет контекстуальный оттенок разведки, не утверждая сверх текста формальный статус лазутчиков.
- source_word: אֶת כָּל הָאָרֶץ
  choice: всю землю
  rationale: Речь идёт о всей рассматриваемой земле или области, а не о планете; русский контекст делает это значение понятным.
- source_word: בָּאוּ
  choice: они пришли
  rationale: Перфект констатирует состоявшееся прибытие; русское прошедшее время естественно и сохраняет связь с текущей ситуацией.
