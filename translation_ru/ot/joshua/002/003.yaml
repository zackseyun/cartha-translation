  source_fidelity: 'Основной смысл передан верно: царь Иерихона направляет распоряжение Раав выдать мужчин, пришедших к ней, поскольку они прибыли для обследования земли. Однако «разведать» в основном тексте несколько сильнее конкретизирует цель как военную разведку, тогда как חפר прежде всего обозначает тщательное обследование/разыскание; этот оттенок лучше вынести в вариант перевода.'
  naturalness: Фраза «послал к Раав сказать» допустима в библейско-литературном регистре, но «послал к Раав сказать» с более ясным объектом приказа и соединёнными относительными придаточными звучит естественнее. «Тех мужчин» ясно передаёт мужской референт אֲנָשִׁים.
  terminology: Раав и Иерихон переданы нормативно. «Вся земля» сохраняет намеренно широкий, контекстуально определяемый смысл הָאָרֶץ. Лексическую неопределённость חפר следует отразить так, чтобы «разведать» было альтернативой, а не единственным смыслом основного текста.
  issues:
