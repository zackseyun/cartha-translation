revisions:
- from: 'И послал царь Иерихона к Раав сказать: «Выведи людей, которые пришли к тебе, которые вошли в твой дом, потому что они пришли разведать всю землю[a]».'
  to: 'И царь Иерихона послал к Раав сказать: «Выведи тех мужчин, которые пришли к тебе и вошли в твой дом, потому что они пришли обследовать всю землю[a]».'
  rationale: Перевод לַחְפֹּר изменён на более нейтральное «обследовать», а разведывательный оттенок сохранён в сноске. Уточнение «тех мужчин» передаёт мужской референт оригинала. Объединение двух относительных придаточных делает фразу более плавной, не устраняя ни одного из двух исходных признаков мужчин.
