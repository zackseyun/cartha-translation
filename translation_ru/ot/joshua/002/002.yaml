  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: ru
  text: 'Царю Иерихона сообщили: «Вот, этой ночью сюда пришли мужчины из народа Израиля, чтобы исследовать землю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разведать землю». Еврейский глагол может означать тщательное исследование; здесь речь идёт о разведке местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: сообщили
  rationale: Неопределённо-личная форма естественно передаёт сообщение с неуказанным действующим лицом, не вводя его в текст.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: царю Иерихона
  rationale: Прямо и естественно передаёт титул и зависимое название города.
- source_word: לֵאמֹר
  choice: двоеточие и прямая речь
  rationale: Инфинитив вводит содержание сообщения; в современном русском это естественно передаётся оформлением прямой речи.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет функцию частицы, привлекающей внимание к срочному сообщению, без архаизации.
- source_word: אֲנָשִׁים
  choice: мужчины
  rationale: В данном контексте речь идёт о лицах мужского пола; выбор избегает неоднозначного более общего слова «люди».
- source_word: בָּאוּ הֵנָּה
  choice: сюда пришли
  rationale: Передаёт завершённое прибытие и указание на место естественным русским выражением.
- source_word: הַלַּיְלָה
  choice: этой ночью
  rationale: Обозначает текущую ночь и соответствует контексту сообщения о недавнем прибытии.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: из народа Израиля
  rationale: Передаёт принадлежность к народу Израиля без буквального, но в современном русском менее естественного выражения «из сынов Израиля».
- source_word: לַחְפֹּר
  choice: исследовать
  rationale: Передаёт основную идею тщательного выяснения сведений о земле, не закрепляя в основном тексте более узкое контекстуальное толкование «разведать».
- source_word: אֶת הָאָרֶץ
  choice: землю
  rationale: Стандартно передаёт территорию, о которой идёт речь, без добавления отсутствующего в стихе названия.
