  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: ru
  text: Вот, когда мы войдём в землю, привяжи этот алый шнур[a] к окну, через которое ты спустила нас, и собери к себе в дом своего отца, свою мать, своих братьев и всех домашних твоего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «этот шнур из алой нити».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная для современного литературного русского частица, привлекающая внимание и сохраняющая указательно-эмфатическую силу еврейского הִנֵּה.
- source_word: בָאִים בָּאָרֶץ
  choice: когда мы войдём в эту землю
  rationale: Причастие в данном контексте выражает предстоящее вступление; придаточное с «когда» естественно передаёт условно-временную рамку договорённости.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: этот алый шнур
  rationale: Контекст требует видимого опознавательного шнура. Краткое выражение звучит естественно, а необычная буквальная конструкция сохранена в сноске.
- source_word: תִּקְשְׁרִי
  choice: привяжи
  rationale: Форма второго лица женского рода передаёт прямое предписание Раав; русский повелительный вид естественнее будущего времени и сохраняет обязательность указания.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: к окну, через которое ты спустила нас
  rationale: «Спустила нас» точно передаёт каузатив הוֹרַדְתֵּנוּ, а «через которое» ясно связывает окно с побегом разведчиков.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: собери к себе в дом
  rationale: Формулировка сохраняет и собирание людей к Раав, выраженное אֵלַיִךְ, и направленность внутрь дома, выраженную הַבָּיְתָה.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: своего отца, свою мать, своих братьев
  rationale: Возвратные притяжательные местоимения естественны по-русски; «братьев» сохраняет грамматически мужскую форму еврейского אַחַיִךְ.
- source_word: כָּל בֵּית אָבִיךְ
  choice: весь дом своего отца
  rationale: «Дом» сохраняет библейское обозначение семейно-родового сообщества и его связь с отцом, не сводя выражение к зданию.
