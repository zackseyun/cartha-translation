  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: ru
  text: 'Мужчины сказали ей: «Мы отвечаем за ваши жизни своими, даже ценой смерти, если вы не разгласите этого нашего дела.[a] Когда Яхве отдаст нам землю, мы проявим к тебе милость и верность[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В словах «ваши» и «вы» еврейский текст употребляет множественное число, хотя мужчины говорят с Раав; возможно, подразумеваются также её домашние.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Или: «мы поступим с тобой с преданной любовью и надёжностью». Сочетание חֶסֶד וֶאֱמֶת выражает милостивую, неизменную и надёжную верность принятому обязательству.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: мужчины
  rationale: Передаёт обычное значение אֲנָשִׁים, не добавляя в основной текст подразумеваемое из контекста уточнение «разведчики».
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Наши жизни — за ваши, вплоть до смерти
  rationale: נֶפֶשׁ здесь означает «жизнь», תַּחַת выражает замену или поручительство, а לָמוּת усиливает смертельную серьёзность обещания. Краткая формула сохраняет клятвенный характер еврейского выражения.
- source_word: אִם לֹא תַגִּידוּ אֶת דְּבָרֵנוּ זֶה
  choice: если вы не расскажете об этом нашем деле
  rationale: נגד в породе хифиль означает «рассказать, сообщить», а דָּבָר в данном контексте — «дело, обстоятельство», а не только «слово».
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Когда Яхве отдаст нам эту землю
  rationale: Инфинитивная конструкция с בְּ имеет временное значение «когда», а определённая «земля» — обещанная в контексте территория.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: мы проявим к тебе
  rationale: Конструкция עשה עם описывает то, как поступят с человеком; с последующими существительными по-русски естественно «проявим к тебе».
- source_word: חֶסֶד וֶאֱמֶת
  choice: милость и верность
  rationale: «Милость» передаёт благожелательную, преданную заботу חֶסֶד, а «верность» — надёжность и истинность אֱמֶת. Сочетание сохраняет оба понятия, не вводя в основной текст отсутствующее существительное «завет».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Смысл сочетания חֶסֶד וֶאֱמֶת
  choice: милость и верность
  alternative: преданная любовь и надёжность; верность завету и истина
  rationale: Фраза обозначает милостивое и надёжное исполнение торжественного обязательства. Перевод сохраняет различие двух слов и их богословскую насыщенность, но не делает контекстуальный заветный оттенок явно выраженным там, где слова «завет» в еврейском тексте нет.
- issue: Переход от множественного обращения к единственному
  choice: сохранить «ваши/вы», затем «к тебе»
  alternative: везде единственное число; везде множественное число
  rationale: Еврейский текст сначала употребляет формы второго лица множественного числа, а затем обращается к Раав в единственном числе. Перевод не устраняет эту реальную грамматическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Клятвенная формула оставлена краткой и напряжённой; синтаксис и примечание сохраняют необычную смену числа в обращении. Имя Яхве передано явно.
