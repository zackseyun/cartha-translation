base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: ru
  text: Они пошли в горы[a] и пробыли там три дня, пока преследователи не возвратились. Преследователи искали их по всей дороге, но не нашли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на гору»; возможно также: «в холмистую местность». Вероятно, имеется в виду горная местность к западу от Иерихона, а не отдельная вершина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Они пошли
  rationale: В еврейском тексте стоят два последовательных глагола «пошли и пришли». В естественном русском движению к указанному месту достаточно соответствуют «пошли в горы»; буквальное «пошли и пришли» звучало бы тяжеловесно.
- source_word: הָהָרָה
  choice: в горы
  rationale: Форма с направительным ה указывает на движение к горной местности. Контекст, вероятно, подразумевает холмистую или горную область к западу от Иерихона, а не обязательно одну гору.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: пробыли там
  rationale: ישב здесь обозначает временное пребывание, поэтому «пробыли» естественнее, чем «жили» или «сидели».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: три дня
  rationale: Прямое соответствие еврейскому выражению.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: пока преследователи не возвратились
  rationale: Русская конструкция «пока не» естественно выражает предел пребывания; отрицание здесь формально и не меняет утвердительного смысла возвращения.
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים
  choice: Преследователи искали их
  rationale: בקש в контексте погони означает поиск. Местоимение «их» восполняет понятный из контекста объект и необходимо для естественного русского.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: по всей дороге
  rationale: Передаёт поиск на всём протяжении пути, не уточняя сверх текста способ или направление поисков.
- source_word: וְלֹא מָצָאוּ
  choice: но не нашли
  rationale: Союз «но» естественно передаёт контраст между поиском и его безуспешностью; объект понятен из предыдущей части.
