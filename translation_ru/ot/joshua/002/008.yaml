  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: ru
  text: Прежде чем они легли[a], она поднялась к ним на крышу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Прежде чем они уснули». Еврейский глагол буквально означает «лечь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: прежде чем
  rationale: Временной союз обозначает, что действие главной части произошло до действия следующего глагола; «прежде чем» естественно передаёт эту связь по-русски.
- source_word: יִשְׁכָּבוּן
  choice: они легли
  rationale: Глагол שׁכב буквально означает «лечь». В данном контексте, вероятно, подразумевается отход ко сну, однако перевод сохраняет выраженное в еврейском тексте физическое действие.
- source_word: עָלְתָה
  choice: она поднялась
  rationale: Форма qal глагола עלה обозначает движение вверх; «поднялась» естественно описывает выход на крышу.
- source_word: עֲלֵיהֶם
  choice: к ним
  rationale: Предлог при глаголе движения и обозначении лиц указывает направление к ним; буквальное «на них» по-русски было бы неверно понято.
- source_word: עַל הַגָּג
  choice: на крышу
  rationale: С учётом глагола движения русское винительное направление «на крышу» естественно передаёт подъём туда, где находились мужчины.
- source_word: וְהֵמָּה ... וְהִיא
  choice: они ... она
  rationale: Явные местоимения противопоставляют участников; русская конструкция «они… она…» сохраняет этот контраст.
