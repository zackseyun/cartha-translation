base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: ru
  text: 'Но женщина взяла обоих мужчин и спрятала их[a]. Она сказала: «Да, эти мужчины пришли ко мне, но я не знала, откуда они».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В древнееврейском тексте местоименный суффикс стоит в единственном числе: «спрятала его», однако по контексту речь идёт об обоих мужчинах, поэтому в переводе: «спрятала их».'
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: взяла
  rationale: Глагол означает, что женщина приняла мужчин и распорядилась укрыть их; простое прошедшее время естественно передаёт древнееврейское повествование, а предшествование речи ясно из порядка действий.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: В контексте слово обозначает Раав как женщину, а не жену.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: обоих мужчин
  rationale: Передаёт определённую пару мужчин и естественно сочетается с переходным глаголом «взяла».
- source_word: וַתִּצְפְּנוֹ
  choice: спрятала их
  rationale: Хотя древнееврейский суффикс имеет форму единственного числа («его»), контекст однозначно указывает на двух мужчин; множественное число делает этот контекст понятным, а формальная особенность отмечена в сноске.
- source_word: כֵּן
  choice: Да
  rationale: Здесь слово прямо подтверждает, что мужчины действительно приходили к Раав.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: эти мужчины приходили ко мне
  rationale: «Приходили ко мне» естественно звучит в русской прямой речи, а указательное «эти» связывает слова Раав с мужчинами, о которых спрашивали посланные.
- source_word: וְלֹא יָדַעְתִּי
  choice: но я не знала
  rationale: Союз «но» уместно передаёт смысловое противопоставление между признанием их прихода и отрицанием знания об их происхождении.
- source_word: מֵאַיִן הֵמָּה
  choice: откуда они
  rationale: Кратко и естественно передаёт вопрос о происхождении мужчин, сохраняя некоторую широту выражения.
