  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: ru
  text: И Яхве, ваш Бог, Сам прогонит их от вас и лишит их владения землёй перед вами; вы же овладеете их землёй[a], как Яхве, ваш Бог, сказал вам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унаследуете их землю». Еврейский глагол может означать как получение наследства, так и вступление во владение; здесь выбран второй смысл ввиду контекста завоевания земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как Яхве, ваш Бог, сказал вам». В данном контексте сказанное имеет силу обещания, поэтому по смыслу возможно: «как Яхве, ваш Бог, обещал вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, и сохраняет заветный характер обращения.
- source_word: הוּא
  choice: Сам
  rationale: Самостоятельное местоимение имеет усилительное значение и подчёркивает, что действовать будет именно Яхве.
- source_word: יֶהְדֳּפֵם
  choice: оттеснит их
  rationale: Глагол הדף обозначает силой оттеснить или обратить вспять; этот вариант сохраняет образ принудительного удаления и не сливается со следующим глаголом.
- source_word: מִפְּנֵיכֶם
  choice: от вас
  rationale: Естественно передаёт пространственную идиому «от вашего лица / из вашего присутствия» в современном русском языке.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: и изгонит их
  rationale: В породе hifil глагол ירש здесь означает лишить прежних обитателей владения, удалив их с земли. «Изгонит» естественно выражает результат, сохраняя отличие от «оттеснит».
- source_word: וִירִשְׁתֶּם
  choice: и вы овладеете
  rationale: В данном контексте форма qal означает вступить во владение землёй; «овладеете» передаёт активное приобретение владения, не исключая оттенка наследования.
- source_word: אֶת אַרְצָם
  choice: их землёй
  rationale: Прямо указывает на землю, которой до этого владели упомянутые народы.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как ... сказал
  rationale: Сохраняет обычное значение глагола דבר — «говорить, сказать», не устраняя заложенного контекстом смысла обещания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Разные значения корня ירש в соседних фразах
  choice: «изгонит их» / «вы овладеете их землёй»
  alternative: Передать обе формы одинаково либо перевести вторую как «унаследуете»
  rationale: 'Разные породы одного корня описывают две стороны перехода земли: прежние жители утрачивают владение, а Израиль вступает во владение. Различные русские глаголы сохраняют этот смысловой контраст.'
- issue: Высказывание Бога как обещание
  choice: «сказал вам»
  alternative: «обещал вам»
  rationale: Контекст имеет характер обещания, однако еврейский глагол буквально означает «сказал/говорил». Основной текст сохраняет эту формальную открытость, а смысл обещания отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «от вас» сохраняет заметный параллелизм еврейского текста, а глаголы «оттеснит» и «изгонит» различают два близких действия без тяжеловесной буквальности.
