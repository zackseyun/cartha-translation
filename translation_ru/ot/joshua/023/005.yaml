  source_fidelity: Первая глагольная форма יֶהְדֳּפֵם обозначает не просто оттеснение, а принудительное удаление/прогон. Вторая, וְהוֹרִישׁ אֹתָם, означает лишение прежних жителей владения; «изгонит» передаёт возможный результат, но несколько сглаживает именно имущественный аспект. Независимое הוּא уместно передано усилительным «Сам». «Овладеете их землёй» точно передаёт וִירִשְׁתֶּם אֶת־אַרְצָם.
  naturalness: «Оттеснит их от вас» звучит несколько слабее и уже по смыслу, чем еврейский глагол в данном контексте. «Прогонит их от вас» естественно для современного литературного русского. Для второго действия естественнее прямо назвать лишение владения землёй, чем повторить «изгонит».
  terminology: «Яхве, ваш Бог» последовательно передаёт יהוה אֱלֹהֵיכֶם. Различение «лишит их владения землёй» и «вы овладеете их землёй» сохраняет контраст форм корня ירש, не навязывая конфессионального толкования. Сноски привязаны к соответствующим местам текста и содержательно корректны.
