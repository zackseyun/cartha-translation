base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: ru
  text: Поэтому будьте очень тверды, чтобы соблюдать и исполнять всё, что написано в Книге Закона Моисея[a], и не уклоняться от него ни вправо, ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Книге наставления Моисея». Еврейское слово тора может означать не только «закон», но и «наставление»; здесь оно обозначает письменный свод предписаний, связанных с Моисеем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: будьте очень тверды
  rationale: Форма обращена ко множеству и в данном контексте выражает настойчивое побуждение к стойкости и решимости. «Очень тверды» передаёт усиление מְאֹד и не сужает значение до одной лишь храбрости.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: чтобы соблюдать и исполнять
  rationale: В контексте предписаний שׁמר означает верно соблюдать, а עשה — осуществлять на деле. Эта пара естественна по-русски и сохраняет два взаимодополняющих глагола исходного текста.
- source_word: כָּל הַכָּתוּב
  choice: всё написанное
  rationale: Передаёт собирательное и всеохватное значение конструкции кратко и естественно.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: в Книге Закона Моисея
  rationale: סֵפֶר может обозначать книгу или свиток, однако «Книга» здесь ясно и привычно обозначает письменный корпус. תּוֹרָה в данной формуле относится к данному через Моисея заветному закону, при сохранении в сноске более широкого значения слова.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: не уклоняясь от него
  rationale: Передаёт цель или требуемый результат — отсутствие отступления. Местоимение оставлено в единственном числе и соотнесено с Законом как единым целым.
- source_word: יָמִין וּשְׂמֹאול
  choice: ни вправо, ни влево
  rationale: Естественная русская передача образного выражения об уклонении в любую сторону; отрицательная парная конструкция соответствует смыслу контекста.
theological_decisions:
- issue: Передача תּוֹרָה в контексте Моисеева завета
  choice: Закон в выражении «Книга Закона Моисея»
  alternative: «Книга наставления Моисея»
  rationale: Хотя תּוֹרָה может означать «наставление», здесь устойчивое выражение указывает на письменный корпус предписаний, связанных с Моисеем. «Закон» точно обозначает референт, а сноска сохраняет более широкий смысловой диапазон слова.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка обращена к множеству; избегнуты архаизмы, а пара «соблюдать и исполнять» сохраняет структуру и практическую направленность еврейского текста.
