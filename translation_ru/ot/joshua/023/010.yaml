  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: ru
  text: Один человек из вас будет преследовать тысячу[a], потому что Яхве[b], ваш Бог, — Тот, Кто сражается за вас, как Он и сказал вам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погонит тысячу».'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога; в еврейском тексте יהוה (ЙХВХ).
    reason: lexical_alternative
  - marker: c
    text: 'По смыслу возможно: «как Он и обещал вам»; буквально: «как Он сказал вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: Один человек из вас
  rationale: Сохраняет мужской род и единственное число исходного выражения, а также его представительный смысл; по-русски звучит ясно и естественно.
- source_word: יִרְדָּף
  choice: погонит
  rationale: Глагол רדף означает «гнаться, преследовать». «Погонит» передаёт здесь яркий военный образ и результат превосходства над противником, не заменяя его более толковательным «обратит в бегство».
- source_word: אָלֶף
  choice: тысячу
  rationale: Числительное передано буквально, чтобы сохранить выразительную силу утверждения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, почему один из израильтян способен преследовать тысячу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, обозначенное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: Тот, Кто сражается за вас
  rationale: Сохраняет подчёркивающее местоимение הוּא и субстантивированное причастие, представляющее Бога как Того, Кто действует на стороне Израиля.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: как Он и говорил вам
  rationale: Следует буквальному значению «говорил вам», сохраняя возможность понимать эти слова в контексте как обещание.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Форма «Яхве» прямо обозначает его как имя и не подменяет титулом.
- issue: Представительное выражение אִישׁ אֶחָד
  choice: Один человек
  alternative: Один из вас
  rationale: Слово אִישׁ выражено явно и имеет мужскую форму; перевод сохраняет эту форму, не добавляя утверждения, что речь исключительно о мужчинах.
- issue: Значение דִּבֶּר в контексте Божьего обещания
  choice: говорил вам
  alternative: обещал вам
  rationale: Контекст допускает и подразумевает обещание, однако сам глагол означает «говорил». Более буквальная формулировка сохраняет смысловую открытость исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «Тот, Кто сражается за вас» сохраняет акцент еврейского местоимения и причастия; прописные местоимения по отношению к Богу использованы последовательно в пределах стиха.
