base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: ru
  text: Вот, я распределил между вашими племенами в удел эти оставшиеся народы — вместе со всеми народами, которых я истребил, — от Иордана до Великого моря на западе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к заходу солнца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Смотрите
  rationale: Повелительная форма множественного числа привлекает внимание слушателей; «Смотрите» естественно и сохраняет указательно-эмфатическую силу.
- source_word: הִפַּלְתִּי
  choice: я отдал по жребию
  rationale: Hiphil от נפל здесь обозначает распределение земель посредством жребия. Формулировка передаёт и действие распределения, и стоящий за идиомой обычай.
- source_word: בְּנַחֲלָה לְשִׁבְטֵיכֶם
  choice: в наследие вашим племенам
  rationale: נחלה обозначает наследственное земельное владение, а לְ отмечает получателей удела.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: эти оставшиеся народы
  rationale: Причастие נִשְׁאָרִים описывает народы, которые всё ещё остаются; русский порядок слов звучит естественно и сохраняет смысл.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: вместе со всеми народами, которых я истребил
  rationale: כרת в данном контексте означает уничтожение народов. «Истребил» ясно передаёт контекстуальный смысл; «вместе со» связывает уже покорённые народы с распределяемой территорией.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: от Иордана ... и до Великого моря
  rationale: Сочетание обозначает пространственные пределы территории; по-русски конструкция «от… и до…» ясно выражает этот диапазон, хотя в еврейском перед морем стоит союз וְ.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: где заходит солнце
  rationale: Буквальный образ захода солнца сохраняется в понятной современной форме и одновременно указывает на запад.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. «Отдал по жребию» сохраняет конкретный способ распределения, а не сводит выражение к общему «выделил». Образ заходящего солнца оставлен в тексте и пояснён в сноске.
