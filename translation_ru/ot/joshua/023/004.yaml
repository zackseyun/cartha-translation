revisions:
- from: 'Смотрите: я отдал по жребию в наследие вашим племенам эти оставшиеся народы — от Иордана вместе со всеми народами, которых я истребил, и до Великого моря, где заходит солнце.[a]'
  to: Вот, я распределил между вашими племенами в удел эти оставшиеся народы — вместе со всеми народами, которых я истребил, — от Иордана до Великого моря на западе[a].
  rationale: Перестроено предложение так, чтобы «все народы, которых я истребил» были присоединены к объекту распределения, а не к формуле географических границ. «Распределил ... в удел» передаёт идиоматический смысл הִפַּלְתִּי и נחלה; образ западного направления отмечен сноской.
  reviewer_model: gpt-5.6-terra
