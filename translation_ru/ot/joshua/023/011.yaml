  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: ru
  text: Поэтому особенно тщательно следите за собой, чтобы любить Яхве, вашего Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: Поэтому… следите за собой
  rationale: Форма выражает призыв к бдительному самоконтролю; союз וְ в данном увещевательном контексте естественно передаётся как вывод «поэтому».
- source_word: מְאֹד
  choice: особенно тщательно
  rationale: Наречие усиливает требование бдительности; это сочетание естественно и весомо звучит по-русски.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: за собой
  rationale: Здесь נֶפֶשׁ обозначает самих людей в целом и придаёт глаголу возвратный смысл, не выделяя отдельно «душу» как нематериальную часть человека.
- source_word: לְאַהֲבָה
  choice: чтобы любить
  rationale: Инфинитив с לְ передаёт цель или требуемый результат бдительного отношения к себе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем и титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Суффикс второго лица множественного числа прямо указывает на заветные отношения адресатов с Богом.
theological_decisions:
- issue: Значение נֶפֶשׁ в заветном увещевании
  choice: возвратное «за собой», относящееся ко всему человеку
  alternative: «за своими душами» или «за своими жизнями»
  rationale: Оборот призывает израильтян внимательно следить за собой, чтобы сохранять любовь и верность Яхве. Перевод «душами» неоправданно вводил бы антропологическое разделение, которого данный контекст не требует.
- issue: Связь между самоконтролем и любовью к Богу
  choice: целевая конструкция «чтобы любить»
  alternative: «в любви к»
  rationale: 'Так сохраняется направленность еврейского инфинитива: бдительность должна вести к продолжающейся любви к Яхве, без уточнения, является ли здесь оттенок исключительно целью или также результатом.'
translation_notes:
  register: Современный литературный русский язык; повелительное увещевание передано ясно и торжественно. Местоимение «вашего» сохранено для естественного русского согласования и подчёркивания обращения ко всему Израилю.
