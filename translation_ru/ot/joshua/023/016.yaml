  source_fidelity: 'В основной строке добавлено «соблюдать» к אֲשֶׁר צִוָּה אֶתְכֶם. Хотя это подразумевается контекстом завета, в еврейском тексте такого дополнения нет; его можно безопасно убрать, заменив глаголом «заповедал», естественным с прямым дополнением «завет». Остальные ключевые соответствия сохранены: условное «если», «завет», имя «Яхве», служение и поклонение и предупреждение об исчезновении с земли.'
  naturalness: «Завет ..., который Он заповедал вам» — естественная литературно-библейская русская формулировка и точнее, чем «повелел вам соблюдать». «Против вас» несколько естественнее передаёт направленность гнева, чем «на вас».
  terminology: '«Яхве», «завет», «другие боги», «служить» и «поклоняться» выбраны последовательно. «Исчезнете с доброй земли» допустимо: оно не сужает אבד до одного лишь изгнания или одной лишь физической гибели и сохраняет связь угрозы с утратой земли.'
