source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: ru
  text: Если вы нарушите завет Яхве, вашего Бога, который Он заповедал вам[a], пойдёте служить другим богам и станете поклоняться им, то гнев Яхве воспылает против вас, и вы вскоре исчезнете с доброй земли, которую Он дал вам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда вы нарушите завет Яхве, вашего Бога». Начальную еврейскую конструкцию можно понять и как условную («если»), и как временную («когда»).'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «с поверхности доброй земли»; выражение подчёркивает удаление с земли, которую Яхве дал народу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Если вы нарушите
  rationale: Предлог ב с инфинитивом может вводить условное или временное обстоятельство; в контексте предостережения условное «если» естественно передаёт смысл, а עבר ברית означает нарушение завета.
- source_word: בְּרִית
  choice: завет
  rationale: Устойчивый библейский термин, сохраняющий правовой и богословский вес отношений Израиля с Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: который Он повелел вам соблюдать
  rationale: В русском языке объект при «повелел» требует дополнения; «соблюдать» ясно выражает подразумеваемое отношение к завету, не меняя смысла.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: пойдёте служить
  rationale: Естественно передаёт последовательность ухода к религиозному служению и сохраняет отдельное значение עבד.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: станете поклоняться им
  rationale: Глагол обозначает земной поклон или простирание перед кем-либо; «поклоняться» в данном контексте понятно и сохраняет отличие от «служить».
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: гнев Яхве воспылает на вас
  rationale: Сохраняет образ разгорающегося гнева, выраженный еврейской идиомой חרה אף.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ
  choice: вы скоро исчезнете с ... земли
  rationale: אבד допускает значение исчезновения или гибели; сочетание с מֵעַל подчёркивает удаление народа с земли.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: доброй земли
  rationale: Буквально и естественно передаёт положительную оценку дарованной земли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет его как имя заветного Бога.
- issue: Условное или временное значение начальной конструкции
  choice: Если вы нарушите
  alternative: Когда вы нарушите
  rationale: Обе трактовки грамматически возможны, но условная формулировка лучше соответствует характеру предостережения и не представляет отступничество как неизбежное.
- issue: Значение אבד в связи с землёй
  choice: исчезнете с земли
  alternative: погибнете на земле / будете истреблены с земли
  rationale: Выбранная формулировка сохраняет возможность гибели и одновременно подчёркивает утрату данной Богом земли, не уточняя способ исполнения угрозы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предостережения. Синтаксис сделан естественным для широкой аудитории; сохранены образ воспылавшего гнева, личное имя Яхве и неоднозначность условно-временной конструкции.
