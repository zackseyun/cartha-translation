  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: ru
  text: чтобы вы не входили в среду этих народов, которые ещё остаются среди вас, не упоминали имени их богов[a], не заставляли никого клясться ими[b], не служили им и не поклонялись им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не призывали имени их богов». Еврейский глагол может означать как «упоминать», так и, в данном контексте, «призывать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не заставляли клясться». В еврейском тексте объект не назван; речь может идти о том, чтобы побуждать других клясться именем этих богов.'
    reason: lexical_clarification
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: чтобы вы не сближались с этими народами
  rationale: Конструкция לְבִלְתִּי с инфинитивом выражает предотвращение или отрицательную цель. В данном контексте בוא с предлогом ב указывает не просто на географическое вхождение, а на вступление в близкое общение с оставшимися народами; «не сближались» естественно передаёт этот смысл по-русски.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: которые ещё остаются среди вас
  rationale: Причастие от שׁאר обозначает тех, кто остался, а אִתְּכֶם — их продолжающееся соседство с Израилем. «Среди вас» в современном русском звучит естественнее буквального «с вами» применительно к народам.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: не упоминали имени их богов
  rationale: Hiphil глагола זכר может означать «упоминать», «напоминать» или в культовом контексте «призывать». Основной текст сохраняет прямое значение «упоминать», а контекстуальная возможность «призывать» отмечена в сноске.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: не заставляли никого клясться ими
  rationale: Hiphil от שׁבע имеет каузативный смысл «заставлять/побуждать клясться». Объект действия в еврейском тексте не выражен; «никого» добавлено для ясности без указания конкретного лица.
- source_word: וְלֹא תַעַבְדוּם
  choice: не служили им
  rationale: עבד означает «служить», в том числе совершать религиозное служение. Перевод сохраняет отличие этого действия от следующего глагола поклонения.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: не поклонялись им
  rationale: Форма от שׁחה обозначает простирание или низкий поклон. «Поклоняться» здесь естественно выражает религиозный характер действия, при этом не сливая его с предшествующим «служить».
theological_decisions:
- issue: Перечень действий, связанных с чужими богами
  choice: 'Сохранить отдельные запреты: упоминать, заставлять клясться, служить и поклоняться.'
  alternative: Обобщить весь ряд одним запретом поклоняться чужим богам.
  rationale: Еврейский текст намеренно перечисляет различные проявления признания и почитания чужих богов. Сохранение каждого глагола удерживает конкретность и богословское напряжение текста.
- issue: Характер запрета на употребление имени богов
  choice: В основном тексте — «упоминать», с указанием варианта «призывать» в сноске.
  alternative: Однозначно перевести как культовое «призывать».
  rationale: Глагол допускает оба оттенка. Контекст благоприятствует культовому пониманию, однако лексическая широта не позволяет безоговорочно устранить более буквальный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Начальное «чтобы» сохраняет синтаксическую зависимость стиха от предыдущего контекста. Повтор отрицания перед каждым действием передаёт структуру и риторическую силу еврейского перечня.
