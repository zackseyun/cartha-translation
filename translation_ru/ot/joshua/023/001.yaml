revisions:
- from: 'И было: много времени спустя[a], после того как Яхве даровал Израилю покой от всех врагов, окружавших его, Иисус Навин был уже стар и достиг преклонных лет[b].'
  to: Спустя долгое время после того, как Яхве даровал Израилю покой от всех его врагов вокруг, Иисус Навин состарился и достиг преклонных лет[b].
  rationale: 'Временной оборот естественно объединяет וַיְהִי, מִיָּמִים רַבִּים и אַחֲרֵי אֲשֶׁר, не добавляя нового смыслового содержания. «Состарился и достиг преклонных лет» сохраняет два близких, намеренно повторных описания возраста. Сноска a не нужна: в исправленном тексте «спустя долгое время» уже является естественной смысловой передачей выражения, а не переводом, требующим альтернативы; удаление якоря и сноски согласовано.'
