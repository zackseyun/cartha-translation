base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: ru
  text: Спустя долгое время после того, как Яхве даровал Израилю покой от всех его врагов вокруг, Иисус Навин состарился и достиг преклонных лет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Еврейская идиома; буквально: «пришёл в дни».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Еврейская повествовательная формула вводит новую сцену; краткое «И было» сохраняет её функцию и торжественный, но не архаически тяжёлый тон.
- source_word: מִיָּמִים רַבִּים
  choice: много времени спустя
  rationale: Выражение буквально связано со «многими днями», но идиоматически указывает на значительный промежуток времени; выбран естественный современный русский эквивалент.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: после того как
  rationale: Составное временное выражение вводит обстоятельство, предшествующее описываемому состоянию Иисуса Навина.
- source_word: הֵנִיחַ
  choice: даровал ... покой
  rationale: В породе hifil глагол означает дать покой или избавление от вражеского давления; «даровал покой» передаёт причинное значение и контекст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: לְיִשְׂרָאֵל
  choice: Израилю
  rationale: Название народа передано в общепринятой русской форме.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: от всех врагов, окружавших его
  rationale: Формулировка сохраняет как полноту избавления («от всех»), так и пространственный смысл מִסָּבִיב — враги находились вокруг Израиля.
- source_word: וִיהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени, ясно отличающая этого персонажа от Иисуса Христа.
- source_word: זָקֵן
  choice: был уже стар
  rationale: Прямо передаёт состояние преклонного возраста; «уже» естественно связывает его с прошедшим длительным временем.
- source_word: בָּא בַּיָּמִים
  choice: достиг преклонных лет
  rationale: Естественная русская передача еврейской идиомы «вошёл в дни»; сохранена смысловая параллель с предшествующим זָקֵן.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя-тетраграмматон; транслитерация «Яхве» сохраняет различие между именем и титулом и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксическая протяжённость исходного временного вступления сохранена, но выражения сделаны естественными для современного читателя.
