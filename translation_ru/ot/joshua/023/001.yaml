    rationale: בָּא בַּיָּמִים буквально означает «пришёл/вошёл в дни»; для глагола בוא базовое соответствие в этой конструкции — «пришёл». Это не меняет смысла, но повышает точность примечания.
  revised_text: Спустя долгое время после того, как Яхве даровал Израилю покой от всех его врагов вокруг, Иисус Навин состарился и достиг преклонных лет[b].
