source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: ru
  text: И вот, сегодня я ухожу путём всей земли[a]. Вы знаете всем сердцем и всей душой, что из всех добрых слов, которые Яхве, ваш Бог, сказал о вас, ни одно не осталось неисполненным. Все они сбылись для вас; ни одно из них не осталось неисполненным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Путь всей земли» — еврейское образное выражение, обозначающее общую участь всех людей, особенно смерть.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «не пало ни одного слова». Здесь это значит, что ни одно слово не оказалось тщетным и не осталось неисполненным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт соединительную и торжественно-привлекающую внимание функцию еврейского оборота естественным современным русским выражением.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: сегодня я ухожу путём всей земли
  rationale: Сохраняет образный еврейский оборот об общей участи людей, не заменяя его непосредственно словами «я умираю».
- source_word: וִידַעְתֶּם
  choice: вы знаете
  rationale: Перфект обозначает твёрдое знание, приобретённое на опыте; настоящее время естественно передаёт его функцию в контексте.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: всем сердцем и всей душой
  rationale: Сохраняет традиционную антропологическую пару «сердце — душа» и передаёт полноту внутренней убеждённости.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ни одно не осталось неисполненным
  rationale: Еврейский образ буквально говорит, что ни одно слово «не пало»; по-русски смысл надёжности и осуществления сказанного естественно выражается через «не осталось неисполненным», а буквальный образ отмечен в сноске.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: из всех добрых слов
  rationale: «Слов» сохраняет связь דְּבָרִים с последующим глаголом «говорил» и не сужает значение до явно сформулированных обещаний.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: которые Яхве, ваш Бог, говорил о вас
  rationale: «О вас» передаёт значение предлога עַל — «о, относительно» — без замены его более ожидаемым «вам».
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: все они исполнились для вас
  rationale: Передаёт осуществление всех упомянутых слов; «для вас» сохраняет направленность לָכֶם, тогда как буквальное «пришли к вам» в русском здесь было бы неясно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; форма «Яхве» сохраняет его как имя, не превращая в титул.
- issue: Характер «добрых слов» Бога
  choice: добрые слова
  alternative: добрые обещания
  rationale: Контекст подразумевает обещанное Богом благо, однако דְּבָרִים шире слова «обещания»; перевод не устраняет эту лексическую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, торжественным звучанием. Сохранён библейский образ «пути всей земли», а неестественный для русского буквальный оборот «слово не пало» разъяснён в сноске. Синтаксис перестроен так, чтобы длинная еврейская фраза читалась ясно, при сохранении смыслового повторения в конце стиха.
