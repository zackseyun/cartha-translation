  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: ru
  text: Ибо если вы и вправду отвернётесь и прилепитесь[a] к остатку этих народов — к тем, что ещё остаются среди вас, — станете вступать с ними в браки и общаться с ними, а они — с вами[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете крепко держаться за них».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будете входить к ним, а они — к вам»; еврейское выражение может обозначать также взаимное сближение, общение или отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: Сочетание вводит условное предостережение и одновременно связывает его с предыдущей мыслью; «ибо если» сохраняет обе функции.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: вы и вправду отвернётесь
  rationale: Инфинитив абсолютный при личной форме усиливает действие. «И вправду» передаёт эмфазу, а «отвернётесь» выражает отрицательный поворот от прежней верности в данном контексте.
- source_word: וּדְבַקְתֶּם
  choice: и прилепитесь
  rationale: Глагол דבק обозначает тесную, устойчивую привязанность. «Прилепитесь» сохраняет силу образа и его созвучие языку верности завету.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: к остатку этих народов
  rationale: יֶתֶר означает оставшуюся часть. «Остаток» здесь кратко обозначает уцелевшие народы и сам по себе не наделяется положительным богословским смыслом.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: к тем, что ещё остаются среди вас
  rationale: Фраза повторно уточняет, что речь идёт о народах, продолжающих жить рядом с Израилем; тире делает это повторение естественным по-русски.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: станете вступать с ними в браки
  rationale: Возвратная порода глагола חתן обозначает установление взаимных родственных связей посредством брака. Выбранная формулировка ясна современному читателю.
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: и общаться с ними, а они — с вами
  rationale: Взаимная эллиптическая конструкция описывает двустороннее сближение или вхождение в отношения. «Общаться» сохраняет более широкий социальный смысл и не сводит выражение к физическому движению либо сексуальному эвфемизму.
theological_decisions:
- issue: Заветный смысл שׁוֹב תָּשׁוּבוּ
  choice: отвернётесь
  alternative: вернётесь / снова обратитесь
  rationale: В контексте это предостережение об отходе от верности Господу, поэтому отрицательно окрашенное «отвернётесь» точнее нейтрального «вернётесь», не добавляя конкретного конфессионального толкования.
- issue: Возможная богословская перегрузка слова יֶתֶר
  choice: остаток
  alternative: оставшаяся часть / прочие
  rationale: Здесь слово просто обозначает то, что осталось от народов. Контекст не даёт оснований приписывать ему положительную тему спасённого остатка.
- issue: Объём значения וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: общаться с ними, а они — с вами
  alternative: входить к ним, а они — к вам
  rationale: После прямого упоминания смешанных браков выражение естественно понимать шире — как взаимное социальное сближение. Перевод не закрепляет без необходимости узкое сексуальное прочтение, но сноска сохраняет буквальный образ и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксическая незавершённость в конце сохранена, поскольку условное предложение продолжается в следующем стихе. Повтор указательных конструкций передан через пояснительный оборот, а взаимность последней фразы — посредством эллипсиса «а они — с вами».
