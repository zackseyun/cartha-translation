  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: ru
  text: Вы сами видели всё, что сделал Яхве, ваш Бог, со всеми этими народами на ваших глазах[a], ибо Сам Яхве, ваш Бог, сражался за вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-перед вас». В данном контексте выражение может относиться к удалению этих народов из присутствия Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם רְאִיתֶם
  choice: Вы сами видели
  rationale: Самостоятельное местоимение אַתֶּם подчёркивает личное свидетельство слушателей; «сами» естественно передаёт это ударение. Начальное וְ здесь продолжает речь, но отдельное «и» в русском не требуется.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: всё, что сделал
  rationale: Сохраняет полноту охвата и широкое значение глагола עשה, не конкретизируя действие сверх текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, обозначенное тетраграмматоном, транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Точно передаёт форму со суффиксом второго лица множественного числа и естественно звучит в обращении к Израилю.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: со всеми этими народами
  rationale: Русская конструкция «сделал с кем-либо» естественно передаёт затронутый действием объект и сохраняет широкое значение עשה.
- source_word: מִפְּנֵיכֶם
  choice: прогоняя их от вас
  rationale: Буквально «из-перед вас»; в контексте завоевания это обозначает удаление народов из присутствия Израиля. Добавленное местоимение «их» имеет ясный антецедент.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание предыдущего утверждения; причинная связь в русском выражена ясно и естественно.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: Сам сражался за вас
  rationale: «Сам» передаёт эмфатическое הוּא, а прошедшее несовершенное «сражался» естественно отражает субстантивированное причастие в ретроспективном контексте, не сводя действие к одному моменту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер Божьего участия в войне
  choice: Сам сражался за вас
  alternative: Он — сражающийся за вас; Сам воюет за вас
  rationale: Формулировка сохраняет акцент на Яхве как действующем за Израиль и ретроспективную направленность речи, не исключая того, что это характеризует Его действие шире одного эпизода.
translation_notes:
  register: Современный литературный русский, понятный широкой аудитории. Синтаксис торжественный, но не архаичный; эмфаза еврейских местоимений передана словом «сами/Сам».
