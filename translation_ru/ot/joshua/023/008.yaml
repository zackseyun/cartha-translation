  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: ru
  text: Но держитесь Яхве, вашего Бога[a], как до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будьте крепко привязаны к Яхве»; еврейский глагол выражает тесную, стойкую привязанность, в данном контексте — заветную верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: Сочетание частиц здесь выражает резкое противопоставление предшествующему предостережению, а не условие.
- source_word: בַּיהוָה
  choice: держитесь Яхве
  rationale: При глаголе דבק предлог ב обозначает того, к кому прилепляются или кого крепко держатся; русское управление передано без отдельного предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: При обозначении Яхве форма אֱלֹהִים имеет единственное значение; суффикс второго лица множественного числа выражает заветные отношения.
- source_word: תִּדְבָּקוּ
  choice: крепко держитесь
  rationale: В данном увещевательном контексте форма передана русским повелительным наклонением. Выражение сохраняет образ стойкой, тесной привязанности и звучит естественно по-русски.
- source_word: כַּאֲשֶׁר עֲשִׂיתֶם
  choice: как делали
  rationale: Оборот сопоставляет требуемую верность с поведением слушателей вплоть до настоящего времени.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и понятное русское выражение передаёт продолжение действия до момента речи и сохраняет достоинство библейского регистра.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как личное имя, не подменяя титулом.
- issue: Смысл דבק в заветном контексте
  choice: крепко держитесь
  alternative: прилепитесь; оставайтесь верны
  rationale: Выбранный вариант сохраняет конкретный образ тесной и стойкой привязанности, не сводя его только к абстрактной верности и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «До сего дня» сохраняет достоинство регистра и остаётся общеупотребительным; местоимение «вы» подчёркивает контраст с предыдущим предостережением.
