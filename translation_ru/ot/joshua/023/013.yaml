  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: ru
  text: 'то знайте твёрдо: Яхве, ваш Бог, больше не будет изгонять эти народы от вас. Они станут для вас западнёй и ловушкой, бичом на ваших боках[a] и шипами в ваших глазах, пока вы не погибнете, лишившись этой доброй земли, которую дал вам Яхве, ваш Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово трудно для точного истолкования; возможно также: «плетью на ваших боках» или «бедствием для ваших боков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: то твёрдо знайте
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает призыв; «твёрдо знайте» естественно передаёт эмфатическое значение.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: больше не будет изгонять
  rationale: Конструкция с יסף указывает на прекращение дальнейшего действия; «больше не будет» передаёт это без стилистической избыточности.
- source_word: מִלִּפְנֵיכֶם
  choice: от вас
  rationale: Русское «изгонять от вас» естественно передаёт пространственную идиому, не воспроизводя неестественное «от вашего лица».
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: западнёй и ловушкой
  rationale: Два близких существительных сохранены раздельно, чтобы передать риторическое удвоение еврейского текста.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: бичом на ваших боках
  rationale: Редкое и трудное слово, по контексту обозначающее причиняющее боль орудие или бедствие; «бич» сохраняет телесную метафору и её суровый тон.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: колючками в ваших глазах
  rationale: Передаёт образ острых, мучительных раздражителей; «колючки» в современном русском яснее, чем архаичные варианты.
- source_word: עַד אֲבָדְכֶם
  choice: пока вы не исчезнете
  rationale: Глагол אבד здесь описывает гибель или исчезновение народа с земли; формулировка сохраняет связь со следующим оборотом.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: с этой доброй земли
  rationale: «Земля» здесь означает дарованную Богом территорию; предлог «с» естественно передаёт удаление с неё.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя; транслитерация сохраняет это различие.
- issue: Характер предупреждения
  choice: Бог прекратит изгонять народы, и они станут причиной бедствий вплоть до исчезновения Израиля с дарованной земли
  alternative: Чисто военное предсказание без связи с даром земли
  rationale: Синтаксис прямо связывает прекращение Божьего действия, последующие бедствия и утрату дарованной земли; перевод не добавляет объяснений сверх текста.
- issue: Неясность שֹׁטֵט
  choice: бичом на ваших боках с примечанием
  alternative: плетью на ваших боках; бедствием для ваших боков
  rationale: Лексема трудна и допускает несколько близких образов болезненного поражения, поэтому неопределённость отмечена, а не устранена.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Телесные образы и суровый тон предупреждения сохранены; архаизмы вроде «от лица вашего» не использованы.
