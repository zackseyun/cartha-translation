source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: ru
  text: 'Иисус Навин созвал[a] весь Израиль — его старейшин, предводителей[b], судей и распорядителей — и сказал им: «Я состарился и достиг преклонных лет[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал»; здесь имеется в виду, что Иисус Навин собрал руководителей к себе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «глав». То есть ведущих людей, предводителей народа.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «вошёл в дни» — еврейское выражение, означающее преклонный возраст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: созвал
  rationale: Глагол קרא с предлогом לְ здесь означает призвать людей к себе, собрать их; «созвал» естественно передаёт этот смысл по-русски без излишне властного оттенка слова «призвал».
- source_word: לְכָל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохраняет явное собирательное обозначение всего народа; следующий перечень показывает, что народ представлен своими руководителями, но перевод не подменяет исходную формулировку толкованием.
- source_word: לִזְקֵנָיו
  choice: его старейшин
  rationale: Суффикс третьего лица относится к Израилю как собирательному целому; русское «его» грамматически и стилистически естественно.
- source_word: וּלְרָאשָׁיו
  choice: предводителей
  rationale: Буквально «голов»; в административном перечне слово обозначает глав или ведущих людей. «Предводители» сохраняет отличие этой группы от старейшин, судей и распорядителей.
- source_word: וּלְשֹׁפְטָיו
  choice: судей
  rationale: В данном общественно-административном контексте форма от שׁפט прямо обозначает лиц, исполняющих судебные обязанности.
- source_word: וּלְשֹׁטְרָיו
  choice: распорядителей
  rationale: שֹׁטְרִים обозначает подчинённых административных должностных лиц. «Распорядители» достаточно ясно передаёт их служебную функцию и не сужает значение до писцов.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: и сказал им
  rationale: Простая и точная формула введения прямой речи, соответствующая достоинству повествования.
- source_word: אֲנִי זָקַנְתִּי
  choice: Я состарился
  rationale: Перфект выражает наступившее состояние как результат процесса; «состарился» точнее сохраняет глагольную форму, чем статическое «я стар».
- source_word: בָּאתִי בַּיָּמִים
  choice: достиг преклонных лет
  rationale: Это еврейская идиома, буквально «вошёл в дни»; выбранная формулировка естественна в современном русском и сохраняет отдельную вторую часть высказывания.
theological_decisions:
- issue: Кого обозначает выражение «весь Израиль» при последующем перечислении руководителей
  choice: Сохранено «весь Израиль», а перечень после тире представлен как уточнение его представителей.
  alternative: 'Перевести истолковательно: «созвал всех руководителей Израиля».'
  rationale: В еврейском тексте прямо назван «весь Израиль», после чего перечислены старейшины, предводители, судьи и распорядители. Сохранение обеих частей не устраняет возможного напряжения между всем народом и его представительными руководителями.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формулировка доступна широкому читателю; административные группы разграничены, а образное «главы» вынесено в примечание. Тире ясно показывает, что перечень поясняет собирательное выражение «весь Израиль».
