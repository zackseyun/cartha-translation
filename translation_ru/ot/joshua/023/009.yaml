base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: ru
  text: Ибо Яхве изгнал от вас великие и могучие народы[a], а перед вами никто не устоял[b] до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишил владений» или «вытеснил». Еврейский глагол может подчёркивать удаление народов с земли, чтобы Израиль мог овладеть ею.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ни один человек не устоял перед вами» — то есть никто не смог вам противостоять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: изгнал
  rationale: В породе хифиль глагол ירשׁ здесь означает устранить прежних жителей, лишив их владения землёй. «Изгнал» естественно передаёт военный контекст, тогда как оттенок лишения владения отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: מִפְּנֵיכֶם
  choice: от вас
  rationale: В данном контексте еврейское сочетание означает удаление народов с пути и из присутствия Израиля; буквальное «от лица вашего» в современном русском неестественно.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: великие и могучие народы
  rationale: 'Сохраняются оба определения: גְּדֹלִים указывает на величину или значительность, а עֲצוּמִים — на силу и мощь.'
- source_word: וְאַתֶּם
  choice: а перед вами
  rationale: 'Союз «а» вместе с дальнейшим построением фразы естественно выражает подчёркнутое противопоставление: могущественные народы были изгнаны, и Израилю никто не смог противостоять.'
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: перед вами никто не устоял
  rationale: Так естественно по-русски передаётся военная идиома «стоять перед кем-либо» в значении успешного сопротивления; буквальная форма приведена в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и понятное русское соответствие, указывающее на продолжение положения до момента речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Выражение «до сего дня» сохраняет достоинство стиля, оставаясь общеупотребительным и понятным; синтаксис сделан естественным для русского языка без устранения контраста исходного текста.
