source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: ru
  text: 'И будет так: как исполнилось для вас всякое доброе слово, которое Яхве, ваш Бог, сказал вам, так Яхве наведёт на вас всякое бедствие[a], пока не истребит вас с этой доброй земли, которую дал вам Яхве, ваш Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое злое (пагубное) слово» или «всякое злое (пагубное) дело». В еврейском тексте употреблено то же слово, что и в выражении «всякое доброе слово» в первой части стиха; в данном контексте оно может обозначать бедствие.'
    reason: Передаёт лексическую широту דָּבָר и רָע, а также сохраняет для читателя намеренный параллелизм с «добрым словом».
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Передаёт торжественное введение будущего обстоятельства без архаического оборота «и будет, когда».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: как ... так
  rationale: 'Сохраняет явную сопоставительную конструкцию: уже исполнившееся благословение служит мерой грядущего суда.'
- source_word: בָּא עֲלֵיכֶם
  choice: исполнилось для вас
  rationale: В контексте сказанного Богом глагол указывает на осуществление Его слов; такой оборот естественен по-русски, хотя пространственный образ «пришло на вас» становится менее явным.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: каждое доброе слово
  rationale: Сохраняет דָּבָר как «слово» и его намеренный параллелизм с последующим «бедственным словом», не сужая значение до одних обещаний.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно стоящее в еврейском тексте личное имя Бога, тетраграмматон.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: наведёт на вас
  rationale: Передаёт каузативную форму глагола בוא и обычный русский оборот для ниспосылаемого бедствия или суда.
- source_word: כָּל הַדָּבָר הָרָע
  choice: каждое бедственное слово
  rationale: Сохраняет повтор существительного «слово», но передаёт רָע здесь как бедственное последствие суда, а не как нравственное зло в действии Бога.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: пока не истребит вас
  rationale: Выражает конечный предел грядущего суда и сохраняет сильное значение השׁמיד.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: с этой доброй земли
  rationale: Естественно передаёт удаление с поверхности данной Богом земли и сохраняет характеристику земли как доброй.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Значение רָע применительно к суду, который наводит Бог
  choice: бедственное
  alternative: злое; плохое; губительное
  rationale: В данном контексте слово обозначает пагубное, неблагоприятное событие covenantного суда, не утверждая нравственного зла в Боге. Сноска сохраняет более буквальные варианты и смысловую широту.
- issue: Сохранение параллели между благословением и судом
  choice: «доброе слово» / «бедственное слово»
  alternative: «доброе обещание» / «бедствие»
  rationale: Повтор דָּבָר связывает исполнение благих слов Бога с исполнением Его предупреждений; перевод сохраняет эту богословски значимую симметрию.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаическим звучанием. Конструкция «как ... так» удерживает риторическую симметрию оригинала; повтор «слово» намеренно сохранён, хотя сочетание «бедственное слово» менее обычно в разговорной речи.
