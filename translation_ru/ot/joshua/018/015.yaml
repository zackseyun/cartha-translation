  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: ru
  text: Южная сторона начиналась от края Кириаф-Иарима. Граница шла на запад[a] и выходила к источнику вод Нефтоаха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к морю»; в данном географическом контексте — на запад.'
    reason: lexical_alternative
  - marker: b
    text: 'Или более свободно: «к источнику Нефтоаха». Основной текст сохраняет буквальное выражение «источник вод Нефтоаха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: Южная сторона
  rationale: פֵאָה обозначает сторону или край, а נֶגְבָּה здесь указывает на южное направление. Сочетание «южная сторона» естественно для описания границ.
- source_word: מִקְצֵה
  choice: от края
  rationale: קָצֶה означает конец, край или оконечность; в описании территории «от края» точно передаёт пространственный смысл.
- source_word: קִרְיַת יְעָרִים
  choice: Кириаф-Иарима
  rationale: Географическое название передано традиционной русской транслитерацией; родительный падеж обусловлен предлогом «от».
- source_word: וְיָצָא הַגְּבוּל
  choice: Граница шла … и выходила
  rationale: В формулах описания границ יָצָא указывает на прохождение или продолжение пограничной линии. Русское «шла» естественно в первом употреблении, а «выходила» сохраняет образ второго.
- source_word: יָמָּה
  choice: на запад
  rationale: Буквально форма связана с морем («к морю»), но в географии Израиля регулярно обозначает западное направление.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: к источнику вод Нефтоаха
  rationale: 'Перевод сохраняет составную древнееврейскую конструкцию: מַעְיַן — «источник», מֵי — «воды» в сопряжённой форме, Нефтоах — топоним.'
theological_decisions: []
