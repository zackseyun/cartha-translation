base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: ru
  text: Тогда Иисус Навин бросил для них жребий в Силоме перед Яхве, и там Иисус Навин разделил землю между сынами Израиля по их уделам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ גּוֹרָל
  choice: бросил жребий
  rationale: Устойчиво и естественно передаёт древнееврейскую идиому о совершении жеребьёвки; единственное число «жребий» соответствует форме גּוֹרָל.
- source_word: בְּשִׁלֹה
  choice: в Силоме
  rationale: Нормальное русское обозначение совершения действия внутри названного поселения.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Передаёт действие в присутствии Яхве, вероятно у святилища, не добавляя этого пояснения в основной текст.
- source_word: וַיְחַלֵּק
  choice: разделил
  rationale: Прямо передаёт распределение земли; оттенок получения по жребию уже выражен предыдущей частью стиха.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте книги Иисуса Навина речь идёт о конкретной земле, распределяемой среди Израиля.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: между сынами Израиля
  rationale: Сохраняет буквальный образ древнееврейского выражения и при этом с предлогом «между» естественно сочетается с глаголом «разделил».
- source_word: כְּמַחְלְקֹתָם
  choice: по их подразделениям
  rationale: Сохраняет значение распределительных групп или частей, не сводя выражение без достаточного основания только к уделам либо коленам.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное заветное имя יהוה; форма «Яхве» передаёт его как имя и не заменяет титулом.
- issue: Корпоративный смысл выражения לִבְנֵי יִשְׂרָאֵל
  choice: сыны Израиля с пояснением в сноске
  alternative: израильтяне; народ Израиля
  rationale: Основной текст сохраняет образ исходного выражения, а сноска поясняет, что оно обозначает народ в целом, а не только взрослых мужчин.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без утраты повторного указания на место действия; повтор имени Иисуса Навина во второй части, присутствующий в еврейском тексте, опущен как естественно подразумеваемый в русском сложносочинённом предложении.
