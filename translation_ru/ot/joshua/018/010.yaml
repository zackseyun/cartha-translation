  - severity: medium
    issue: «По их подразделениям» неточно по регистру и смысловому контексту.
    rationale: כְּמַחְלְקֹתָם относится к распределению/долям при наделении землёй; «подразделения» в современном русском обычно обозначают организационные единицы. «По их уделам» лучше передаёт контекст, не уточняя без основания конкретные племенные единицы.
  - severity: low
