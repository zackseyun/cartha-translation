  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: ru
  text: А вы опишите землю, разделив её на семь частей, и принесите описание сюда ко мне; тогда я брошу для вас здесь жребий пред Господом, нашим Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: опишите землю
  rationale: Буквально «запишите землю»; по контексту речь идёт о составлении письменного описания земли. Русское «опишите» естественно передаёт этот смысл, не уточняя сверх текста способ описания.
- source_word: שִׁבְעָה חֲלָקִים
  choice: разделив её на семь частей
  rationale: Передаёт распределительное значение выражения «[на] семь частей» и ясно связывает деление с землёй.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: я брошу для вас… жребий
  rationale: Сохранён конкретный единственный «жребий» (גּוֹרָל) и традиционное русское сочетание «бросить жребий».
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: пред Господом, нашим Богом
  rationale: «Пред» сохраняет торжественный библейский регистр без архаической непонятности; тетраграмматон передан принятой русской формой «Господь».
theological_decisions:
- issue: Характер жеребьёвки перед Господом
  choice: «брошу… жребий пред Господом»
  alternative: «распределю… по жребию перед Господом»
  rationale: Более формальная передача сохраняет образ бросания жребия и богословски значимое указание на совершение действия в присутствии Господа, не объясняя механизм результата.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Союз «тогда» естественно обозначает последовательность действий, выраженную древнееврейской цепью форм. Местоимение «её» и слово «описание» добавлены для ясности референции без изменения содержания.
