  source_fidelity: 'В целом переданы все основные элементы: дальнейший ход и поворот границы, западное и южное направление, гора по отношению к Беф-Хорону, конечный пункт Кириаф-Ваал / Кириаф-Иарим и итоговая формула о западной стороне. Однако «по западной стороне» может означать движение вдоль уже заданной западной стороны, тогда как לִפְאַת־יָם выражает поворот к западу. Перестановка делает направление точнее.'
