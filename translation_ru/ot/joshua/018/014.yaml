  to: Затем граница тянулась дальше, поворачивала к западу, на юг от горы, расположенной напротив Беф-Хорона с южной стороны, и заканчивалась у Кириаф-Ваала (то есть Кириаф-Иарима), города потомков Иуды[a]. Это была западная сторона.
