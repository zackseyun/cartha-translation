  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: ru
  text: Затем граница тянулась дальше, поворачивала к западу, на юг от горы, расположенной напротив Беф-Хорона с южной стороны, и заканчивалась у Кириаф-Ваала (то есть Кириаф-Иарима), города потомков Иуды[a]. Это была западная сторона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Иуды»; это племенное обозначение потомков, или народа, Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל
  choice: граница тянулась дальше
  rationale: В описании рубежей глагол обозначает дальнейший ход или проведение границы. Такой перевод естественно передаёт продолжение линии, не превращая действие в пассивное «была размечена».
- source_word: וְנָסַב לִפְאַת־יָם נֶגְבָּה
  choice: и поворачивала по западной стороне на юг
  rationale: נָסַב передаёт изменение направления, יָם в географической формуле означает запад, а נֶגְבָּה указывает движение на юг.
- source_word: מִן־הָהָר אֲשֶׁר עַל־פְּנֵי בֵית־חֹרוֹן נֶגְבָּה
  choice: от горы, расположенной к югу напротив Беф-Хорона
  rationale: Фраза עַל־פְּנֵי имеет пространственный смысл «напротив», а второе נֶגְבָּה указывает, что гора находится с южной стороны Беф-Хорона. Формулировка сохраняет обе пространственные характеристики.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: и заканчивалась
  rationale: Устойчивое выражение в описании границ указывает на конечную точку рубежа; глагольная передача ясна и естественна по-русски.
- source_word: אֶל־קִרְיַת בַּעַל הִיא קִרְיַת יְעָרִים
  choice: у Кириаф-Баала (то есть Кириаф-Иарима)
  rationale: Первое название обозначает конечный пункт, а местоимение הִיא отождествляет его с городом, известным под вторым названием.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: города потомков Иуды
  rationale: Буквально «город сынов Иуды»; здесь выражение обозначает племенную общность, поэтому «потомки Иуды» передаёт смысл без ошибочного ограничения только мужчинами.
- source_word: זֹאת פְּאַת־יָם
  choice: Это была западная сторона
  rationale: Краткая формула подводит итог описанию западного участка границы; יָם в данном контексте означает запад.
