lexical_decisions:
- source_word: הָעַוִּים
  choice: Аввим
  rationale: В перечне земельного удела форма понимается как название города и передаётся транслитерацией. Определённый артикль отдельно не воспроизводится.
- source_word: הַפָּרָה
  choice: Пара
  rationale: Топоним в уделе Вениамина; еврейский определённый артикль в русском названии отдельно не передаётся.
- source_word: עָפְרָה
  choice: Офра
  rationale: Название города передано принятой русской библейской транслитерацией, а не переведено как имя нарицательное.
- source_word: וְ
  choice: и
  rationale: Повторяющийся союз связывает названия в простом перечне; по нормам русского языка ставится только перед последним элементом.
