base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: ru
  text: Цела, Хаэлеф, Иевусей[a] (то есть Иерусалим), Гивеат[b], Кириат[c] — четырнадцать городов с их селениями. Это удел сынов Вениамина по их родам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «иевусей — это Иерусалим». Этноним «иевусей» здесь употреблён как обозначение города.'
    reason: lexical_alternative
  - marker: b
    text: Название «Гивеат» иногда передают как «Гива».
    reason: alternative_reading
  - marker: c
    text: В еврейском тексте этого стиха стоит «Кириат», а не «Кириат-Иеарим».
    reason: textual_variant
lexical_decisions:
- source_word: וְצֵלַע
  choice: Цела
  rationale: Название места передано транслитерацией; конечная буква ע не воспроизводится отдельным звуком в естественной русской форме.
- source_word: הָאֶלֶף
  choice: Хаэлеф
  rationale: Транслитерация сохраняет начальный определённый артикль הָ, представленный в еврейском тексте как часть формы топонима.
- source_word: וְהַיְבוּסִי הִיא יְרוּשָׁלִַם
  choice: Иевусей — это Иерусалим
  rationale: Формально יְבוּסִי — этноним «иевусей», но в перечне он служит обозначением места; формула «это Иерусалим» сохраняет пояснительную силу הִיא и необычность исходной формы.
- source_word: גִּבְעַת
  choice: Гивеат
  rationale: Транслитерация отражает данную в масоретском тексте форму названия и не заменяет её более привычным топонимом «Гива».
- source_word: קִרְיַת
  choice: Кириат
  rationale: Передано только название, действительно присутствующее в стихе; отсутствующий компонент «Иеарим» не добавляется.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: четырнадцать городов
  rationale: Прямой и естественный перевод итогового счёта населённых пунктов.
- source_word: וְחַצְרֵיהֶן
  choice: с их селениями
  rationale: חָצֵר в списках земельных уделов обозначает зависимые небольшие или неукреплённые поселения; «селения» естественно передаёт это значение.
- source_word: זֹאת נַחֲלַת
  choice: Это удел
  rationale: Краткая именная формула сохраняет настоящее указательное значение и обычную русскую библейскую терминологию распределения земли.
- source_word: בְּנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Сохраняется родоплеменная семейная образность еврейского выражения, естественная и понятная по-русски.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте племенного устройства מִשְׁפָּחָה означает родовую группу; «по их родам» точно и традиционно передаёт распределительный смысл.
