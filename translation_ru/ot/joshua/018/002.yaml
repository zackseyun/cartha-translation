  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: ru
  text: А среди сынов Израиля оставалось ещё семь племён, не разделивших своего наследия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которым ещё не было распределено их наследие»; возможно также: «которые ещё не получили своего наследия по жребию». Еврейский глагол может указывать как на участие племён в разделе земли, так и на то, что их уделы ещё не были им назначены.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: оставалось
  rationale: Нифаль от יתר выражает состояние тех, кто оставался; безлично-экзистенциальная конструкция естественна по-русски.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Сохраняет родственное выражение еврейского текста; форма «сынов» соответствует современной литературной норме родительного множественного числа.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: которые ещё не разделили между собой
  rationale: חלק в контексте распределения земли означает «делить, распределять». «Ещё» естественно передаёт контекст незавершённого распределения, а «между собой» показывает, что речь идёт о разделе наследственной земли племенами, не устраняя возможную смысловую неоднозначность.
- source_word: אֶת נַחֲלָתָם
  choice: своё наследие
  rationale: נחלה обозначает наследственный земельный удел; «наследие» сохраняет стандартную библейскую и богословски значимую лексику.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: семь племён
  rationale: Прямой и естественный перевод обозначения семи племён Израиля.
theological_decisions:
- issue: Направленность действия חָלְקוּ при распределении уделов
  choice: не разделили между собой своё наследие
  alternative: им ещё не было распределено их наследие / они ещё не получили наследие по жребию
  rationale: Грамматически племена являются подлежащим глагола, поэтому основной текст сохраняет активную конструкцию. Контекст допускает понимание результата — уделы ещё не были назначены или получены, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским регистром. Союз «А» передаёт переход к оставшимся племенам. Буквальное «сыны Израиля» сохранено ради прозрачности исходного родственного выражения; архаичные обороты избегаются.
