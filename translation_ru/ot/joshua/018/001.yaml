  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: ru
  text: Тогда всё общество сынов Израиля[a] собралось в Силоме и поставило там шатёр встречи. Земля же была покорена перед ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно: «детей Израиля». Буквально: «сынов Израиля».'
    reason: Лексическая альтернатива для בְּנֵי יִשְׂרָאֵל.
  - marker: b
    text: 'Или: «земля была подчинена им» или «земля была завоёвана ими».'
    reason: Варианты передачи נִכְבְּשָׁה לִפְנֵיהֶם и степени выраженного подчинения.
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: собралось
  rationale: Нифаль глагола קהל обозначает совместное собрание общины; «собралось» естественно передаёт это значение в современном русском языке.
- source_word: כָּל עֲדַת
  choice: всё общество
  rationale: עֵדָה — организованная община, а כָּל указывает на её полноту. «Всё общество» сохраняет коллективный и несколько официальный оттенок.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквально сохраняет мужскую форму исходного выражения и его значение как наименования народа; более свободное «израильтян» вынесено в примечание.
- source_word: שִׁלֹה
  choice: в Силоме
  rationale: Использована устоявшаяся русская библейская форма географического названия с нормативным склонением.
- source_word: וַיַּשְׁכִּינוּ
  choice: поставило
  rationale: В породе хифиль глагол буквально означает «поселило, дало пребывать»; применительно к шатру естественное русское соответствие — «поставило».
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прозрачно передаёт оба компонента еврейского словосочетания и не заменяет их более толковательным традиционным термином «скиния».
- source_word: נִכְבְּשָׁה
  choice: была покорена
  rationale: Пассивная форма указывает на приведённость земли под власть Израиля. «Покорена» сохраняет результативность, не утверждая непременно полного завершения всех завоеваний.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Сохранён образный еврейский оборот «перед ними», выражающий подчинённое положение земли по отношению к Израилю.
theological_decisions:
- issue: Общее наименование народа Израиля
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Формулировка сохраняет грамматически мужское и заветное наименование исходного текста, тогда как более естественная русская альтернатива указана в примечании.
- issue: Степень завершённости завоевания
  choice: земля была покорена перед ними
  alternative: земля была завоёвана ими; земля была подчинена им
  rationale: Еврейский пассив говорит о подчинении земли, хотя дальнейшее повествование упоминает ещё не занятые территории. Выбранный вариант не усиливает утверждение до безусловно полного завоевания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Коллективное «общество» согласовано с глаголами в единственном числе по нормам русского языка. Точка между предложениями делает длинную еврейскую координацию яснее, не меняя логической связи.
