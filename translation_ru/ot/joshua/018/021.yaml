  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: ru
  text: 'Города, принадлежавшие колену сынов Вениамина, по их родам, были: Иерихон, Бет-Хогла и Эмек-Кециц.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «долина Кециц», если это название понимать как описательное сочетание, а не как единый топоним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 'Города ... [были]:'
  rationale: Связка вводит перечень городов; в естественном русском настоящая связка опускается, а двоеточие ясно вводит список.
- source_word: הֶעָרִים
  choice: Города
  rationale: Определённое множественное число обозначает города в составе удела; контекст обеспечивает определённость без обязательного указательного слова.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: принадлежавшие колену сынов Вениамина
  rationale: Передаёт значение принадлежности или назначения удела и сохраняет еврейское родовое выражение «сыны Вениамина».
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: по их родам
  rationale: В контексте племенного устройства מִשְׁפָּחָה обозначает подразделение колена; «род» здесь естественнее и точнее современного бытового «семья».
- source_word: יְרִיחוֹ
  choice: Иерихон
  rationale: Устоявшаяся русская форма географического названия.
- source_word: בֵית חָגְלָה
  choice: Бет-Хогла
  rationale: Транслитерация составного топонима с сохранением элемента בֵּית в форме «Бет».
- source_word: עֵמֶק קְצִיץ
  choice: Эмек-Кецис
  rationale: Сочетание принято как единый топоним и транслитерировано; при описательном понимании возможно перевести первый компонент как «долина».
