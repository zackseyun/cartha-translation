  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: ru
  text: 'И сказал Иисус Навин сынам Израиля[a]: «Долго ли вы будете медлить, чтобы войти и овладеть землёй, которую дал вам Яхве, Бог ваших отцов?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: 'Лексическая альтернатива: примечание поясняет буквальный родственный оборот и предлагает естественный русский эквивалент.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol, сохраняющая последовательное движение еврейского рассказа.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Традиционная и однозначно узнаваемая русская форма имени библейского персонажа.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный родственный образ еврейского выражения и его форму мужского рода; более гладкий вариант «израильтянам» указан в примечании.
- source_word: עַד אָנָה
  choice: Долго ли
  rationale: Естественная русская форма временного упрёка «до каких пор?»; в данном вопросе звучит современно и выразительно.
- source_word: מִתְרַפִּים
  choice: будете медлить
  rationale: Передаёт порицаемую нерешительность и бездействие, выраженные формой от רפה, не усиливая их до прямого обвинения в лени.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: не идя овладеть
  rationale: Передаёт как направленное вступление в землю, так и цель — вступить во владение ею. Отрицательная деепричастная конструкция естественно связывается с русским «медлить».
- source_word: הָאָרֶץ
  choice: землёй
  rationale: Определённое обозначение обещанной земли; творительный падеж обусловлен глаголом «овладеть».
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: которую дал вам
  rationale: Совершенный вид сохраняет представление о земле как уже дарованной Богом, хотя фактическое овладение ею ещё не завершено.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога, непосредственно представленного тетраграмматоном в исходном тексте.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Бог ваших отцов
  rationale: Сохраняет буквальную и традиционную формулу, а также её межпоколенческий заветный оттенок.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя YHWH, поэтому транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Соотношение Божьего дара и ещё не совершившегося овладения землёй
  choice: «которую дал вам» при последующем призыве «овладеть»
  alternative: «которую даёт вам»
  rationale: 'Сохраняется напряжение исходного текста: Бог уже даровал землю, однако Израилю ещё предстоит войти и овладеть ею.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Долго ли» и «медлить» понятны современному читателю; «сынам Израиля» намеренно сохраняет исходный образ и сопровождается примечанием.
