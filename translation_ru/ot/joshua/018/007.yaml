source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: ru
  text: Ибо у левитов нет доли среди вас, потому что священство Яхве — их наследие[a]. А Гад, Рувим и половина колена Манассии получили своё наследие за Иорданом, к востоку, — то, которое дал им Моисей, слуга Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его наследие». Единственное число, вероятно, относится к Левию как к собирательному обозначению левитов.'
    reason: Сохраняет грамматическую особенность еврейского текста и отмечает вероятное собирательное значение, не выдавая его за несомненное.
lexical_decisions:
- source_word: חֵלֶק
  choice: доля
  rationale: Передаёт часть при распределении земли и позволяет отличить это слово от נַחֲלָה («наследие») далее в стихе.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Обычное русское обозначение членов колена Левия; дательный падеж естественно обусловлен конструкцией «не полагается доля».
- source_word: בְּקִרְבְּכֶם
  choice: среди вас
  rationale: Естественно передаёт значение «в вашей среде» применительно к распределению уделов между коленами.
- source_word: כְהֻנַּת יְהוָה
  choice: священство Яхве
  rationale: Сохраняет институциональное значение כְהֻנָּה и прямую связь священства с Яхве; возможный оттенок священнического служения не исключается.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: נַחֲלָתוֹ
  choice: их наследие
  rationale: Местоименный суффикс в еврейском стоит в мужском роде единственного числа, но относится к Левию как собирательному обозначению левитов; русский множественный род делает смысл ясным.
- source_word: לָקְחוּ
  choice: уже получили
  rationale: В контексте законного земельного наделения «получили» точнее по-русски, чем буквальное «взяли»; «уже» передаёт завершённость и контраст с предстоящим распределением.
- source_word: נַחֲלָתָם
  choice: своё наследие
  rationale: Естественная русская передача наследственного земельного удела; возвратное местоимение согласуется с субъектом предложения.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: за Иорданом, на востоке
  rationale: Ясно обозначает восточную сторону Иордана с точки зрения повествования и звучит естественно в современном русском.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: В почётном заветном титуле עֶבֶד естественно передаётся словом «слуга», без неуместного здесь акцента на рабском статусе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Собирательное единственное число в נַחֲלָתוֹ
  choice: их наследие
  alternative: его наследие
  rationale: Еврейская форма буквально означает «его наследие» и грамматически соотносится с собирательным Левием; по-русски местоимение множественного числа ясно указывает на левитов, а примечание сохраняет формальную особенность оригинала.
- issue: Смысл כְהֻנַּת יְהוָה как наследия левитов
  choice: священство Яхве — их наследие
  alternative: священническое служение Яхве — их наследие
  rationale: «Священство» сохраняет институциональную широту выражения и не сужает его лишь до исполнения отдельных обязанностей.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранено различие между «долей» (חֵלֶק) и «наследием» (נַחֲלָה); географическое выражение передано идиоматически. Имя Яхве транслитерировано последовательно.
