  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: ru
  text: И разделите её на семь уделов. Иуда пусть остаётся у своей границы на юге[a], а дом Иосифа — у своих границ на севере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть стоит у своей границы»; далее: «пусть стоят у своих границ». Здесь «стоять», вероятно, означает оставаться в пределах уже установленных границ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: И разделите её
  rationale: Форма הִתְחַלְּקוּ здесь естественно понимается как повелительное наклонение множественного числа в контексте поручения землемерам; местоимение «её» сохраняет отсылку к земле из контекста.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: на семь уделов
  rationale: «Уделы» ясно передаёт части земли, предназначенные для распределения между коленами, и соответствует контексту наделения землёй.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: пусть остаётся у своей границы
  rationale: Глагол עמד буквально означает «стоять», но здесь указывает на сохранение уже установленного территориального положения; «пусть остаётся» естественно передаёт это значение, не превращая границу во внутреннюю территорию.
- source_word: מִנֶּגֶב
  choice: с юга
  rationale: В параллели с מִצָּפוֹן слово обозначает южную сторону расположения, а не обязательно область Негев.
- source_word: וּבֵית יוֹסֵף
  choice: а племена дома Иосифа
  rationale: «Дом Иосифа» сохраняет устойчивое собирательное обозначение потомков Иосифа, а добавление «племена» естественно согласует русский текст с последующими еврейскими формами множественного числа.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: у своих границ
  rationale: Множественные формы глагола и местоименного суффикса показывают, что дом Иосифа рассматривается как совокупность племён; значение «остаются» восполняется из параллельной первой части.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: Передаёт северную сторону в симметрии с выражением «с юга».
