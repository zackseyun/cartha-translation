base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: ru
  text: Затем граница повернула к северу, вышла к Эн-Шемешу[a], вышла к Гелилоту[b], что напротив подъёма Адуммим[c], и спустилась к камню Богана, сына Рувима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Эн-Шемеш» означает «Источник солнца».
    reason: lexical_alternative
  - marker: b
    text: Название «Гелилот» можно также понять буквально как «круги» или «округа», но здесь оно обозначает место.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «перевала Адуммим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: граница повернула
  rationale: В описании рубежей глагол обозначает изменение направления или проведение линии границы; явное «граница» естественно передаёт подразумеваемое подлежащее.
- source_word: מִצָּפוֹן
  choice: к северу
  rationale: В последовательности глаголов движения выражение лучше понимать как указание направления.
- source_word: וְיָצָא
  choice: вышла; далее — к
  rationale: Формула описывает прохождение границы к очередному ориентиру. Первое употребление передано близко к еврейской пространственной идиоме, второе слегка варьировано ради естественного русского синтаксиса без изменения смысла.
- source_word: עֵין שֶׁמֶשׁ
  choice: Эн-Шемеш
  rationale: Топоним транслитерирован, а его прозрачное лексическое значение указано в примечании.
- source_word: גְּלִילוֹת
  choice: Гелилот
  rationale: В данном контексте форма функционирует как название места, поэтому передана транслитерацией.
- source_word: נֹכַח
  choice: напротив
  rationale: Ясно выражает пространственное расположение ориентира.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: подъём Адуммим
  rationale: מַעֲלֵה обозначает подъём или ведущий вверх проход; топоним Адуммим сохранён транслитерацией.
- source_word: וְיָרַד
  choice: спустилась
  rationale: Передаёт движение границы вниз по рельефу и естественно звучит по-русски.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: камень Богана, сына Рувима
  rationale: Сочетание понято как ориентир, названный по Богану, который определён как сын или потомок Рувима; формальная неоднозначность родства не расширяется в основном тексте.
