source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: ru
  text: Затем граница спускалась к краю горы, обращённому к долине Бен-Гинном[a], которая находится у северной оконечности долины Рефаим. Оттуда она спускалась по долине Гинном к южному склону Иевусея[b], а затем — к Эн-Рогелу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «долина сына Гиннома»; здесь Бен-Гинном передано как географическое название.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к южной стороне Иевусея». Слово, переведённое как «склон», буквально означает «плечо». Под Иевусеем, вероятно, подразумевается иевусейское поселение — Иерусалим, однако слова «город» в еврейском тексте нет.'
    reason: lexical_alternative
  - marker: c
    text: 'Эн-Рогел — географическое название; буквально: «источник Рогела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Затем граница спускалась
  rationale: Глагол ירד передаёт движение вниз; несовершенный вид естественен для последовательного описания прохождения границы и сохраняет топографический смысл.
- source_word: קְצֵה הָהָר
  choice: к краю горы
  rationale: קצה означает край или оконечность; «край горы» близок к еврейскому и естественен в географическом описании.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: обращённому к долине Бен-Гинном
  rationale: Оборот על־פני здесь выражает пространственное положение напротив или лицом к долине; «обращённому к» сохраняет образ исходного текста.
- source_word: גֵּי בֶן־הִנֹּם
  choice: долине Бен-Гинном
  rationale: Сочетание функционирует как географическое название; транслитерация сохраняет форму имени, а буквальное значение вынесено в примечание.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: которая находится у северной оконечности долины Рефаим
  rationale: צפונה задаёт северное направление или положение. Формулировка ясно передаёт географическую связь, не превращая её в более точное указание, чем допускает контекст.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: Оттуда она спускалась по долине Гинном
  rationale: В контексте подлежащим остаётся граница; «по долине» естественно передаёт маршрут её нисхождения через долину.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: к южному склону Иевусея
  rationale: כתף буквально означает «плечо», а в топографии — бок или склон. היבוסי передано буквально как обозначение Иевусея, без добавления отсутствующего в источнике слова «город».
- source_word: עֵין רֹגֵל
  choice: Эн-Рогелу
  rationale: Это географическое название; оно транслитерировано, а буквальный смысл первого элемента указан в примечании.
