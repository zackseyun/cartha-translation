base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: ru
  text: Выберите себе по три человека от каждого племени[a], и я пошлю их. Пусть они отправятся, пройдут по земле и опишут её в соответствии с их наследственными уделами[b], а затем придут ко мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Назначьте себе по три человека от каждого племени».'
    reason: lexical_alternative
  - marker: b
    text: То есть они должны были описать землю с учётом её разделения на наследственные уделы.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Выберите себе
  rationale: Императив в данном контексте требует предоставить или назначить представителей. «Выберите себе» естественно по-русски передаёт практический смысл выражения, не предполагая буквальной передачи «дайте».
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: по три человека от каждого племени
  rationale: Единственное число «племя» имеет распределительное значение; «по три… от каждого племени» ясно передаёт это. Русское «человека» здесь естественно обозначает мужчин-представителей.
- source_word: וְאֶשְׁלָחֵם
  choice: Я пошлю их
  rationale: Прямая и естественная передача глагола שלח без добавления не выраженной в тексте цели.
- source_word: וְיָקֻמוּ וְיִתְהַלְּכוּ בָאָרֶץ
  choice: пусть они отправятся, обойдут землю
  rationale: קום здесь вводит начало порученного действия, поэтому «отправятся» естественнее буквального «встанут»; форма התהלך обозначает передвижение по всей местности, что передано глаголом «обойдут».
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: и опишут её
  rationale: Местоимение женского рода относится к земле. В контексте обследования территории «опишут её» передаёт запись сведений о земле и звучит естественнее буквального «запишут её».
- source_word: לְפִי נַחֲלָתָם
  choice: сообразно их наследственным уделам
  rationale: Идиома לְפִי означает соответствие или соотнесённость; נַחֲלָה здесь относится к земельным наследственным уделам. Формулировка сохраняет местоимение множественного числа и связь описания земли с будущим распределением.
- source_word: וְיָבֹאוּ אֵלָי
  choice: а затем придут ко мне
  rationale: Сохраняется прямое значение «придут ко мне»; «затем» естественно выражает последовательность, уже заданную цепью форм с וְ.
