  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: ru
  text: Затем граница проходила к северному склону Бет-Хоглы и заканчивалась у северного языка[a] Солёного моря[b], у южного конца Иордана. Это южная граница.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «язык» — географическое обозначение языкообразного залива или выступа берега.
    reason: lexical_alternative
  - marker: b
    text: То есть Мёртвого моря; в еврейском тексте — «Солёное море».
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: Затем граница проходила
  rationale: В описании границ глагол обозначает дальнейшее прохождение линии рубежа; «проходила» естественно передаёт последовательность маршрута.
- source_word: כֶּתֶף
  choice: склон
  rationale: Буквально «плечо»; в географическом употреблении — боковая сторона или склон. «Склон» сохраняет топографический смысл и звучит естественно по-русски.
- source_word: בֵּית חָגְלָה
  choice: Бет-Хогла
  rationale: Географическое название передано транслитерацией в форме, понятной современному русскому читателю.
- source_word: צָפוֹנָה
  choice: северному / северного
  rationale: В обоих случаях форма указывает на северную сторону соответствующего ориентира; русская adjectival construction is natural in boundary description.
- source_word: תצאותיו
  choice: заканчивалась
  rationale: В формулах описания границ слово указывает на окончание или конечную точку рубежа.
- source_word: לְשׁוֹן
  choice: языка
  rationale: Сохранён конкретный древнееврейский географический образ «язык»; сноска поясняет, что имеется в виду языкообразный залив или выступ берега.
- source_word: יָם הַמֶּלַח
  choice: Солёного моря
  rationale: Передано собственное наименование исходного текста, а не заменено современным названием «Мёртвое море».
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: у южного конца Иордана
  rationale: Кָצֶה обозначает конец или крайнюю точку, а נֶגְבָּה указывает на южную сторону.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Это южная граница
  rationale: Здесь נֶגֶב имеет направительное значение и подводит итог описанию южной стороны удела, а не называет область Негев.
