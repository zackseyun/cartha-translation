base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: ru
  text: С северной стороны их граница шла от Иордана, затем поднималась к северному склону[a] Иерихона, оттуда поднималась по горной местности на запад, а заканчивалась[b] у пустыни Бет-Авен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к плечу Иерихона с севера»; слово «плечо» здесь является географическим обозначением стороны или склона.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её выходы»; в еврейском тексте употреблён топографический термин во множественном числе, который может обозначать конечную точку или крайние пределы границы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: с северной стороны
  rationale: Передаёт פאה как сторону или край территории и естественно вводит описание северной границы.
- source_word: הַגְּבוּל
  choice: граница
  rationale: В описании земельного надела גְּבוּל обозначает территориальную границу или её линию.
- source_word: מִן הַיַּרְדֵּן
  choice: от Иордана
  rationale: Название реки по-русски обычно употребляется без добавления слова «река»; предлог сохраняет исходную точку границы.
- source_word: וְעָלָה
  choice: поднималась
  rationale: Сохраняет топографическое значение עלה — движение вверх по рельефу — и согласуется с существительным «граница».
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: к северному склону Иерихона
  rationale: כֶּתֶף буквально означает «плечо», но в географическом употреблении обозначает бок или склон; מִצָּפוֹן уточняет северное положение.
- source_word: בָהָר יָמָּה
  choice: по горной местности на запад
  rationale: הָר здесь допускает собирательное топографическое понимание как горная местность, а יָמָּה — направление на запад.
- source_word: תֹּצְאֹתָיו
  choice: заканчивалась
  rationale: В формулах описания границ слово обозначает конечный участок или предел границы; глагольная передача естественна по-русски, а формальная множественность отмечена в сноске.
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: у пустыни Бет-Авен
  rationale: Направительная форма на -ה в сочетании с формулой конечной точки указывает на пустыню Бет-Авен как место завершения границы.
