  to: Эти люди отправились, прошли по земле и внесли в письменный документ[b] её описание по городам[a], в семи частях. Затем они пришли к Иисусу в стан, что в Силоме.
  rationale: 'Правка снимает неоправданную конкретизацию носителя записи в основном тексте, делает обозначение группы более естественным для современного литературного русского и уточняет сноску к выражению לֶעָרִים. Формула «в семи частях» сохраняет компактность и не навязывает спорный синтаксический анализ: она может характеризовать как организованное описание, так и его деление для последующего распределения.'
