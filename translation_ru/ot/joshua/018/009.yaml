  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: ru
  text: Эти люди отправились, прошли по земле и внесли в письменный документ[b] её описание по городам[a], в семи частях. Затем они пришли к Иисусу в стан, что в Силоме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по/согласно городам»; вероятно, описание земли было организовано по отдельным городам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на книге»; еврейское слово סֵפֶר здесь обозначает письменный документ, в древности обычно свиток.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: Мужчины отправились
  rationale: Передаёт начало последовательности действий и определённую группу мужчин, ранее получивших поручение; «отправились» естественно в данном контексте, не добавляя направления.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: прошли по земле
  rationale: Глагол עבר с предлогом ב здесь означает пересечение и обследование территории; русский оборот краток и естественен.
- source_word: וַיִּכְתְּבוּהָ
  choice: составили … её описание
  rationale: Суффикс женского рода отсылает к «земле». Такая формулировка ясно передаёт письменную фиксацию сведений о территории, не создавая неестественного оборота «записали её».
- source_word: לֶעָרִים
  choice: по городам
  rationale: Вероятно, обозначает принцип организации описания — город за городом; возможная смысловая неоднозначность отмечена в сноске.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: в семи частях
  rationale: Сохраняет формальное значение חֲלָקִים и не уточняет без необходимости, были ли это уже окончательные уделы.
- source_word: עַל סֵפֶר
  choice: на свитке
  rationale: В древнем контексте סֵפֶר обозначает письменный документ, обычно свиток; русский предлог «на» соответствует еврейскому выражению и естественен со словом «свиток».
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: они пришли к Иисусу
  rationale: Передаёт простое значение глагола «пришли», не добавляя явно подразумеваемое, но не выраженное значение «вернулись».
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: в стан в Силоме
  rationale: Естественно указывает место, где находился Иисус; «стан» сохраняет историко-повествовательный регистр.
