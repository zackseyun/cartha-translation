  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: ru
  text: И выпал жребий колену сыновей Вениамина, по их родам, и граница их удела проходила между владениями сынов Иуды и сынов Иосифа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны Иосифа» — собирательное обозначение колен, происходивших от Иосифа, прежде всего Ефрема и Манассии.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: выпал
  rationale: В контексте жеребьёвки глагол עלה описывает появление жребия; русское «выпал жребий» естественно передаёт образ и не превращает его в пассивное «был вынут».
- source_word: גּוֹרָל
  choice: жребий
  rationale: Прямое обозначение средства, посредством которого распределялась земля.
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: колену сынов Вениамина
  rationale: מַטֵּה здесь означает племенное колено; выражение «сыны Вениамина» сохраняет родословную форму оригинала.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת обозначает родовые объединения внутри колена; «роды» точно и естественно для русского библейского повествования.
- source_word: וַיֵּצֵא גְּבוּל גּוֹרָלָם
  choice: доставшийся им по жребию удел оказался
  rationale: Буквально сочетание говорит, что «граница их жребия вышла». По смыслу здесь назван определённый границами земельный удел; формулировка передаёт результат жеребьёвки естественным современным русским языком.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Прямо передаёт пространственное положение удела.
- source_word: בְנֵי יְהוּדָה וּבֵין בְנֵי יוֹסֵף
  choice: между землями сынов Иуды и сынов Иосифа
  rationale: Добавленное «землями» проясняет пространственный смысл без изменения референтов; родословные обозначения оригинала сохранены.
theological_decisions:
- issue: Кого обозначают «сыны Иосифа»
  choice: Сохранено собирательное выражение «сыны Иосифа» с пояснением в сноске.
  alternative: Назвать непосредственно колена Ефрема и Манассии.
  rationale: Оригинал употребляет בְנֵי יוֹסֵף; раскрытие подразумеваемых колен в основном тексте устранило бы его родословную формулировку.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Идиома «выпал жребий» и слово «удел» делают стих понятным, а выражения «колено», «роды» и «сыны» сохраняют историко-родословный строй оригинала. Сноска отмечена в основном тексте.
