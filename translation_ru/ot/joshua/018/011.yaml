  terminology: «Жребий», «колено», «роды» и «удел» уместны. «Сыны Иосифа» сохранены как исходное собирательное обозначение; сноска корректно поясняет его референт. Для пространственной ясности оправдано «владения сынов Иуды и сынов Иосифа», поскольку в еврейском тексте этнонимы употреблены в территориальном смысле.
