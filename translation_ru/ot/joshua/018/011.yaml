- from: И выпал жребий колену сынов Вениамина, по их родам, и доставшийся им по жребию удел оказался между землями сынов Иуды и сынов Иосифа.[a]
  to: И выпал жребий колену сыновей Вениамина, по их родам, и граница их удела проходила между владениями сынов Иуды и сынов Иосифа.[a]
  rationale: Исправление восстанавливает в основном тексте значение גְּבוּל как «граница», не отрицая связи этой границы с выделенным по жребию уделом. Заменено лишь стилистически тяжёлое «сынов Вениамина» на естественное «сыновей Вениамина». Сноска и её якорь сохранены.
