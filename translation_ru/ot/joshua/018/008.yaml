base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: ru
  text: 'Итак, эти мужчины встали и отправились. Иисус Навин повелел тем, кто отправлялся описывать землю[a]: «Идите, пройдите по земле, опишите её и возвратитесь ко мне. А здесь, в Силоме, я брошу для вас жребий перед Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «записать землю»; имеется в виду составить её письменное описание для распределения земли по жребию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: эти мужчины встали и отправились
  rationale: Последовательность форм повествования передаёт начало и продолжение действия; «встали и отправились» естественно сохраняет оба глагола. Указательное «эти» уместно для определённой группы представителей из контекста.
- source_word: וַיְצַו יְהוֹשֻׁעַ
  choice: Иисус Навин повелел
  rationale: צוה обозначает властное распоряжение. Традиционная русская форма имени «Иисус Навин» остаётся наиболее узнаваемой и литературной.
- source_word: לִכְתֹּב אֶת הָאָרֶץ
  choice: описать землю
  rationale: Буквально оборот означает «записать землю», но в контексте речь идёт о письменном обследовании и описании территории для раздела. «Описать землю» ясно выражает функцию, не добавляя современного технического понятия картографирования.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: обойдите землю
  rationale: Hitpael глагола הלך выражает передвижение по территории, её последовательный обход; русский глагол «обойдите» здесь естественнее буквального «ходите по земле».
- source_word: וְשׁוּבוּ אֵלַי
  choice: возвратитесь ко мне
  rationale: Сохраняет прямой смысл שוב и достойный тон распоряжения.
- source_word: וּפֹה אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: Здесь ... я брошу для вас жребий
  rationale: «Бросить жребий» — устойчивое русское соответствие древнему способу распределения; единственное число соответствует еврейскому גּוֹרָל.
- source_word: בְּשִׁלֹה
  choice: в Силоме
  rationale: Использована закрепившаяся в русской библейской традиции форма топонима, понятная современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, тетраграмматон. «Яхве» сохраняет его характер как имени и не подменяет титулом.
- issue: Грамматический род הָאֲנָשִׁים
  choice: мужчины
  alternative: люди
  rationale: Существительное обозначает конкретную группу мужчин-представителей; родовая конкретность источника сохранена.
- issue: Характер жребия перед Яхве
  choice: брошу для вас жребий пред Яхве
  alternative: распределю между вами землю по жребию перед Господом
  rationale: Выбранная формулировка не разворачивает сжатую исходную идиому и сохраняет религиозное измерение действия, совершаемого в присутствии Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественных русских фраз без утраты последовательности действий; «пред Яхве» сохраняет достойный сакральный регистр.
