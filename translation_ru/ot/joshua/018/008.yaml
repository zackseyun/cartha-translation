  to: 'Итак, эти мужчины встали и отправились. Иисус Навин повелел тем, кто отправлялся описывать землю[a]: «Идите, пройдите по земле, опишите её и возвратитесь ко мне. А здесь, в Силоме, я брошу для вас жребий перед Яхве».'
  rationale: Правка уточняет способ обследования земли и делает русскую конструкцию с участниками поручения естественной, не добавляя технического понятия картографирования или богословских выводов. Порядок «здесь, в Силоме» отражает контекст и сохраняет связь совершения жребия с Силомом.
