lexical_decisions:
- source_word: רֶקֶם
  choice: Рекем
  rationale: Название города передано транслитерацией; форма «Рекем» естественно отражает еврейское רֶקֶם в русской библейской традиции.
- source_word: יִרְפְּאֵל
  choice: Ирпеэл
  rationale: Название города передано близкой к еврейскому звучанию транслитерацией; начальный йод здесь естественно передаётся русским «И», а сочетание гласных сохраняет строение имени.
- source_word: תַרְאֲלָה
  choice: Тарала
  rationale: Название города транслитерировано без попытки истолковать его значение; форма передаёт еврейское произношение и остаётся удобочитаемой по-русски.
- source_word: וְ
  choice: и
  rationale: Повторяющийся союз связывает названия в перечне; по нормам русского языка запятые ставятся между первыми элементами, а «и» — перед последним.
