    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: И Иордан
  rationale: Собственное название реки обычно употребляется по-русски без добавления слова «река»; союз сохраняет связь с предшествующим описанием границы.
- source_word: יִגְבֹּל אֹתוֹ
  choice: служил ему границей
  rationale: Глагол גבל в территориальном контексте указывает, что Иордан образовывал границу описываемого удела; местоимение оставлено в мужском роде в соответствии с подразумеваемым уделом.
- source_word: לִפְאַת קֵדְמָה
  choice: с восточной стороны
  rationale: Естественно передаёт обозначение восточной стороны или края территории.
- source_word: נַחֲלַת
  choice: удел
  rationale: В контексте Иисуса Навина речь идёт о земельной доле, распределённой колену; «удел» точно и естественно передаёт этот смысл.
- source_word: בְּנֵי בִנְיָמִן
  choice: потомков Вениамина
  rationale: В данном племенном обозначении «сыны Вениамина» означает его потомков; современная формулировка ясно передаёт референт без изменения смысла.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: по его границам со всех сторон
  rationale: Фраза подводит итог описанию всего периметра удела. Русское местоимение согласовано со словом «удел», хотя еврейский суффикс женского рода соотносится с נַחֲלָה.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת обозначает родовые группы внутри колена; «роды» соответствует библейскому контексту распределения земли и остаётся понятным современному читателю.
