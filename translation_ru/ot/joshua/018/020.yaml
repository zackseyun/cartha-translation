  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: ru
  text: И Иордан был его границей на востоке[a]. Вот удел потомков Вениамина, с границами со всех сторон, по их родам.
  philosophy: optimal-equivalence
