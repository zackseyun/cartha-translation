  text: וּ/כְפַ֧ר העמני וְ/הָֽ/עָפְנִ֖י וָ/גָ֑בַע עָרִ֥ים שְׁתֵּים עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: ru
  text: и Кефар-Аммони[a], Офни и Гева — двенадцать городов с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможна также передача: «Кефар-Гааммони» или сходная транслитерация.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Кефар-Аммони
  rationale: Название поселения передано транслитерацией, а не переводом предполагаемого значения. Начальное וּ־ передано союзом «и».
- source_word: הָעָפְנִי
  choice: Офни
  rationale: Топоним передан естественной русской транслитерацией; начальный артикль отдельно не воспроизводится.
- source_word: גָבַע
  choice: Гева
  rationale: В перечне поселений это имя собственное, поэтому оно передано традиционной русской библейской формой «Гева», а не переведено как нарицательное.
- source_word: עָרִים
  choice: городов
  rationale: Формальное и привычное обозначение населённых пунктов в списках земельного удела.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: двенадцать
  rationale: Количественное числительное, относящееся к городам.
- source_word: חַצְרֵיהֶן
  choice: с их селениями
  rationale: Обозначает зависимые небольшие поселения при перечисленных городах; «селения» сохраняет отличие от городов и звучит естественно по-русски.
