base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: ru
  text: Оттуда граница проходила к Лузу[a], к южному склону Луза[b] (это Бет-Эль), затем спускалась к Атрот-Аддару[c], к горе, которая находится к югу от Нижнего Бет-Хорона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь Луз отождествляется с Бет-Элем.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «к плечу Луза на юге»; еврейское слово «плечо» может обозначать бок или склон возвышенности.'
    reason: lexical_alternative
  - marker: c
    text: Встречается также передача названия «Атарот-Аддар».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר ... הַגְּבוּל
  choice: граница проходила
  rationale: Естественная для русского языка формула описания линии границы, сохраняющая значение движения в повествовании о межевании.
- source_word: לוּזָה
  choice: к Лузу
  rationale: Направительный суффикс передан русским предлогом «к»; географическое название транслитерировано.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: к южному склону Луза
  rationale: כֶּתֶף буквально означает «плечо», но в топографическом контексте обозначает бок или склон возвышенности; נֶגְבָּה указывает на южную сторону.
- source_word: הִיא בֵּית אֵל
  choice: это Бет-Эль
  rationale: Сохраняет краткое пояснительное отождествление в еврейском тексте, не уточняя сверх источника, относится ли местоимение к Лузу или к названной местности.
- source_word: וְיָרַד הַגְּבוּל
  choice: затем спускалась
  rationale: Передаёт топографическое движение границы вниз; подлежащее «граница» естественно восстанавливается из предыдущей части предложения.
- source_word: עַטְרוֹת אַדָּר
  choice: Атрот-Аддар
  rationale: Близкая к еврейской форме транслитерация составного географического названия.
- source_word: עַל הָהָר
  choice: на гору
  rationale: Еврейский предлог עַל при глаголе движения допускает направительное понимание; винительный падеж по-русски согласуется со «спускалась к ... на гору», хотя топография остаётся несколько необычной.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: которая находится к югу от Нижнего Бет-Хорона
  rationale: Передаёт пространственное значение מִנֶּגֶב и рассматривает תַּחְתּוֹן как различительное определение названия Бет-Хорон.
