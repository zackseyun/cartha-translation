lexical_decisions:
- source_word: וְעָבַר
  choice: Затем граница прошла
  rationale: В описании границ глагол обозначает продолжение линии от одного ориентира к другому. Явно добавленное слово «граница» естественно восстанавливает подразумеваемое подлежащее.
- source_word: אֶל
  choice: к
  rationale: Передаёт направленность движения к следующему географическому ориентиру.
- source_word: כֶּתֶף
  choice: склону
  rationale: Буквально «плечо»; в топографическом употреблении слово обозначает бок, склон или отрог. «Склон» ясно передаёт смысл в современном русском, а образ отмечен в сноске.
- source_word: מוּל
  choice: напротив
  rationale: Точно выражает пространственное положение одного ориентира относительно другого.
- source_word: הָעֲרָבָה
  choice: Аравы
  rationale: Сохранено географическое название «Арава», не сводя многозначный топографический термин к более общему «равнина».
- source_word: צָפֹנָה
  choice: к северу
  rationale: В данном сочетании форма указывает на северное положение склона, а не обязательно на направление движения границы.
- source_word: וְיָרַד
  choice: и спустилась
  rationale: Передаёт движение вниз по рельефу; согласование с восстановленным словом «граница» делает фразу естественной по-русски.
- source_word: הָעֲרָבָתָה
  choice: в Араву
  rationale: Направительный суффикс указывает на движение к Араве; «в» естественно описывает спуск в низменную область, не исключая более буквального понимания «к Араве».
