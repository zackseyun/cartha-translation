  text: Beth-arabah[a], Zemaraim, and Bethel.
translation:
  language: ru
  text: Беф-Арава[a], Цемараим и Вефиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские географические названия: «Беф-Арава» буквально можно передать как «дом Аравы», а «Вефиль» — как «дом Бога»; в основном тексте они сохранены как традиционные названия мест.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: Бет-Арава
  rationale: Название города в перечне населённых пунктов передано транслитерацией, а не буквальным переводом компонентов. Форма «Бет-Арава» сохраняет узнаваемую структуру еврейского топонима и соответствует современному русскому написанию через дефис.
- source_word: צְמָרַיִם
  choice: Цемараим
  rationale: Собственное географическое название передано транслитерацией; окончание «-аим» отражает еврейскую форму -ַיִם.
- source_word: בֵית אֵל
  choice: Вефиль
  rationale: Выбрана закрепившаяся в русской библейской традиции форма топонима; буквальное значение «дом Бога» не переносится в основной текст.
- source_word: וּ
  choice: и
  rationale: Префиксальный союз связывает названия в перечне; по нормам русского языка союз явно передан перед последним элементом, а остальные разделены запятыми.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая форма перечня сохранена. Для топонимов использованы понятные и традиционные русские формы, без добавления отсутствующих в еврейском тексте пояснений.
