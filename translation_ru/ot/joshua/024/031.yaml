source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: ru
  text: Израиль служил Яхве во все дни Иисуса Навина и во все дни старейшин, переживших Иисуса Навина и знавших всё, что Яхве совершил для Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все деяния Яхве, которые Он совершил для Израиля».'
    reason: Лексема מַעֲשֶׂה может быть передана как «дело», «деяние» или «свершение». Альтернативный вариант сохраняет существительное исходного текста и относительное придаточное אֲשֶׁר עָשָׂה.
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: служил
  rationale: Глагол עבד с Яхве в качестве объекта обозначает служение и верность Богу в рамках завета; значение шире одного лишь богослужения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כֹּל יְמֵי
  choice: во все дни
  rationale: Передаёт повторяющуюся еврейскую временную формулу и остаётся понятным в современном литературном русском языке.
- source_word: הַזְּקֵנִים
  choice: старейшин
  rationale: В данном общественном контексте слово обозначает признанных старших представителей народа, а не просто пожилых мужчин.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: переживших Иисуса Навина
  rationale: Еврейская идиома буквально говорит о тех, кто продолжил свои дни после Иисуса Навина; русский глагол кратко и естественно передаёт этот смысл.
- source_word: יָדְעוּ
  choice: знавших
  rationale: Сохраняет указание на личное знание старейшинами совершённого Яхве, не усиливая его до прямо не выраженного значения «были свидетелями».
- source_word: כָּל מַעֲשֵׂה יְהוָה אֲשֶׁר עָשָׂה
  choice: всё, что Яхве совершил
  rationale: Естественно передаёт сочетание однокоренных в контексте существительного и глагола, избегая тяжеловесного русского повтора «все деяния, которые совершил»; предметный вариант сохранён в сноске.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Предлог ל в контексте указывает на действие в пользу Израиля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Формула «во все дни» сохранена ради связи с еврейской структурой; причастные обороты делают длинное предложение плавным и не устраняют смысловых связей оригинала.
