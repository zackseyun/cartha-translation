  naturalness: Текст в целом естественен для современного литературного русского. «Вот» уместно. Формула «которые Он говорил нам» менее точна и несколько тяжеловесна; «которые Он произнёс при нас» естественна и не создаёт ложного впечатления, будто камень участвовал в разговоре.
  terminology: «Иисус Навин», «Яхве», «свидетель» и «Бог» употреблены последовательно. «Отречётесь от вашего Бога» передаёт возможный смысл כחש, хотя глагол также допускает оттенки лживого/вероломного поступка, что отражено в сноске.
