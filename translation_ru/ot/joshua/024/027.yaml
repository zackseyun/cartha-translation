revisions:
- from: 'И сказал Иисус Навин всему народу: «Вот, этот камень будет свидетелем против нас[a], потому что он слышал все слова Яхве, которые Он говорил нам. Он будет свидетелем против вас, чтобы вы не отреклись от вашего Бога[b]».'
  to: 'И сказал Иисус Навин всему народу: «Вот, этот камень будет свидетелем против нас[a], потому что он слышал все слова Яхве, которые Он произнёс при нас. Он будет свидетелем против вас, чтобы вы не отреклись от вашего Бога[b]».'
  rationale: Исправлено только «говорил нам» на «произнёс при нас», чтобы передать עִמָּנוּ («с нами») без неестественного предположения, что камень был участником диалога. Сноска a уточнена, чтобы яснее сохранить лексическую неоднозначность предлога при контекстуально обоснованном основном переводе.
