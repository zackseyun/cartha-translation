source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: ru
  text: 'И сказал Иисус Навин всему народу: «Вот, этот камень будет свидетелем против нас[a], потому что он слышал все слова Яхве, которые Он произнёс при нас. Он будет свидетелем против вас, чтобы вы не отреклись от вашего Бога[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетелем для нас» либо «свидетелем нам». Еврейский предлог допускает более нейтральное понимание; «против нас» передаёт смысл в контексте предупреждения о неверности завету.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не поступили вероломно по отношению к вашему Богу» или «не оказались неверны вашему Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно и без архаизации привлекает внимание к камню как видимому знаку завета.
- source_word: הָאֶבֶן הַזֹּאת
  choice: этот камень
  rationale: Прямое и обычное соответствие; «скала» здесь было бы менее точно.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: будет свидетелем
  rationale: Сохраняет юридико-заветный образ свидетельства и олицетворение камня.
- source_word: בָּנוּ / בָכֶם
  choice: против нас / против вас
  rationale: В контексте предостережения предлог ב передаёт направленность свидетельства против нарушителей завета, хотя грамматически возможно более нейтральное понимание.
- source_word: שָׁמְעָה
  choice: слышал
  rationale: Буквально сохраняет олицетворение камня; прошедшее время естественно передаёт еврейский перфект в русском повествовании.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: все слова Яхве
  rationale: «Слова» естественно передаёт אִמְרֵי в контексте речи завета; личное имя передано как «Яхве».
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: которые Он говорил нам
  rationale: Русское «говорил нам» естественно передаёт обращённую к народу речь; буквальное «говорил с нами» могло бы неоправданно подразумевать диалог.
- source_word: פֶּן תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: чтобы вы не отреклись от вашего Бога
  rationale: Передаёт предупредительную силу פֶּן и значение כחש как отрицания или неверности Богу; «отреклись» звучит естественно и сохраняет серьёзность нарушения завета.
theological_decisions:
- issue: Олицетворение камня, который слышит и свидетельствует
  choice: 'Сохранить буквально: камень «слышал» и будет «свидетелем»'
  alternative: Передать камень только как символический памятник завета
  rationale: Исходный текст прямо приписывает камню слух и роль свидетеля; буквальная передача сохраняет риторику церемонии завета.
- issue: Направленность свидетельства камня
  choice: «против нас / против вас»
  alternative: «для нас / для вас» или «нам / вам»
  rationale: Контекст предупреждения о возможном отречении поддерживает обвинительный оттенок, однако неоднозначность предлога отмечена в сноске.
- issue: Значение תְּכַחֲשׁוּן по отношению к Богу
  choice: «отреклись от вашего Бога»
  alternative: «поступили вероломно по отношению к вашему Богу»
  rationale: Выбранная формулировка ясно выражает отказ признавать верность Богу, не сводя глагол исключительно к отвлечённой лжи; альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным библейским звучанием. Повтор слова «свидетель» и олицетворение камня сохранены. Имя יהוה передано как «Яхве» в соответствии с исходной формой и предоставленным консультационным слоем.
