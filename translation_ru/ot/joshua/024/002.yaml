reference: Joshua 24:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: ru
  text: 'И сказал Иисус Навин всему народу: «Так говорит Яхве, Бог Израиля: издавна ваши отцы[b] жили за Рекой[a] — Фарра, отец Авраама и отец Нахора, — и служили иным богам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по ту сторону Реки»; вероятно, имеется в виду Евфрат.'
    reason: cultural_note
  - marker: b
    text: То есть ваши праотцы, или предки.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל כָּל הָעָם
  choice: И сказал Иисус Навин всему народу
  rationale: Сохраняет последовательность еврейского повествования и традиционную русскую форму имени יְהוֹשֻׁעַ; עָם обозначает собравшийся народ Израиля.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная и узнаваемая передача древнееврейской формулы посланнической речи; настоящее время уместно внутри цитируемого Божьего обращения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: за Рекой
  rationale: Сохраняет географическое выражение оригинала без подстановки названия Евфрата в основной текст; прописная буква показывает, что имеется в виду известная река.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: В данном историческом контексте глагол означает постоянное проживание, а не буквальное сидение.
- source_word: אֲבוֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет мужскую форму оригинала и допускает её широкий родовой смысл — праотцы, предки.
- source_word: מֵעוֹלָם
  choice: издавна
  rationale: Передаёт указание на отдалённое прошлое, не придавая слову метафизического значения вечности.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: Фарра, отец Авраама и отец Нахора
  rationale: Сохраняет повтор слова «отец» и традиционные русские формы библейских имён.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: и служили иным богам
  rationale: «Служили» формально соответствует עבד и сохраняет культовый смысл поклонения; «иным» естественно передаёт противопоставление другим богам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит личное имя Бога. Его транслитерация сохраняет различие между именем и титулом, не вводя конфессиональной замены.
- issue: Кого охватывает אֲבוֹתֵיכֶם
  choice: ваши отцы
  alternative: ваши предки; ваши праотцы
  rationale: Основной текст сохраняет грамматически мужское обозначение оригинала, а сноска поясняет его родовой, предковый смысл.
- issue: Служение другим богам
  choice: служили иным богам
  alternative: поклонялись другим богам
  rationale: Выбранная формулировка сохраняет широкий смысл עבד — религиозное служение и поклонение — без его сужения до одного обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «Так говорит» и синтаксический повтор «отец… и отец…» сохраняют структуру оригинала; архаизмы вроде «обитали» и «от века» не используются. Маркеры сносок поставлены при тех выражениях, которые они поясняют.
