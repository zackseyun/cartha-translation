  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: ru
  text: 'Но народ сказал Иисусу Навину: «Нет, мы будем служить Яхве».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная повествовательная форма глагола אמר, вводящая прямую речь; в современном русском естественно передаётся глаголом «сказал».
- source_word: הָעָם
  choice: народ
  rationale: Здесь עם обозначает собравшийся народ Израиля как общину завета.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: Предлог אֶל указывает адресата речи; имя передано в принятой русской библейской форме, позволяющей отличить Иисуса Навина от Иисуса Христа.
- source_word: לֹא
  choice: Нет
  rationale: Самостоятельное emphатическое отрицание отвергает предшествующее утверждение Иисуса Навина; русское «Нет» естественно передаёт эту силу.
- source_word: כִּי
  choice: не выражено отдельным словом
  rationale: После самостоятельного לֹא союз כִּי вводит противопоставленное утверждение со значением «напротив / но». В русском контраст уже ясно выражен конструкцией «Нет, мы будем…»; добавление «но» звучало бы тяжелее, а «ведь» неверно смещало бы связь к причинной.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: אֵת является непереводимым показателем прямого дополнения, а יהוה — личное имя Бога; оно передано как «Яхве», без замены титулом.
- source_word: נַעֲבֹד
  choice: мы будем служить
  rationale: Форма Qal imperfect 1-го лица множественного числа выражает решимость и дальнейшее действие. «Служить» сохраняет широкий смысл верности и поклонения в рамках завета, не сужая его до богослужебного обряда.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; форма «Яхве» сохраняет это различие.
- issue: Значение עבד в контексте завета
  choice: служить
  alternative: поклоняться
  rationale: «Служить» сохраняет одновременно оттенки поклонения, послушания и верности, тогда как «поклоняться» неоправданно сужает значение.
translation_notes:
  register: Современный литературный русский язык; краткая, решительная реплика передана естественно и достойно. Сохранена лаконичность еврейского текста без архаизмов и конфессионально маркированных добавлений.
