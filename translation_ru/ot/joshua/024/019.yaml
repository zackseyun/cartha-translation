  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: ru
  text: 'Иисус Навин сказал народу: «Вы не в силах служить Яхве, потому что Он — святой Бог[a]; Он — Бог-ревнитель. Он не простит ваших преступлений и грехов[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте слова, переданные как «Бог» и «святой», имеют формы множественного числа, но относятся к одному Богу; местоимение «Он» стоит в единственном числе.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он не понесёт (не унесёт) ваших преступлений и грехов». Этот еврейский оборот обычно означает прощение.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: не в силах
  rationale: Глагол יכל выражает способность или возможность. Оборот «не в силах» ясно передаёт утверждение о неспособности и естественно звучит по-русски.
- source_word: לַעֲבֹד
  choice: служить
  rationale: עבד означает «служить» и в контексте завета включает поклонение и верность; «служить» не сужает смысл до одного лишь богослужебного действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: Он — святой Бог
  rationale: Хотя слова אֱלֹהִים и קְדֹשִׁים имеют форму множественного числа, местоимение הוּא стоит в единственном числе и указывает на единого Бога Израиля. Русский перевод передаёт смысл в единственном числе, а необычная морфология отмечена в сноске.
- source_word: אֵל קַנּוֹא
  choice: Бог-ревнитель
  rationale: קַנּוֹא обозначает исключительное право Бога на верность народа и Его неприятие соперничающих объектов поклонения. «Бог-ревнитель» сохраняет этот заветный смысл и избегает оттенка мелочной человеческой ревности.
- source_word: לֹא יִשָּׂא
  choice: не простит
  rationale: נשא в сочетании с обозначениями греха идиоматически может означать прощение — снятие или унесение вины. Основной текст передаёт этот смысл ясно, а буквальный образ сохранён в сноске.
- source_word: פִשְׁעֲכֶם
  choice: ваших преступлений
  rationale: פשע обозначает преступление, нарушение установленной власти, нередко с оттенком мятежа. «Преступлений» отличает это слово от следующего общего обозначения грехов.
- source_word: חַטֹּאותֵיכֶם
  choice: грехов
  rationale: חטאת — обычное обозначение греха; «грехов» является прямым и естественным русским соответствием.
theological_decisions:
- issue: Формы множественного числа אֱלֹהִים קְדֹשִׁים при местоимении единственного числа
  choice: 'Передать в единственном числе: «Он — святой Бог»'
  alternative: 'Буквально воспроизвести множественное число: «святые Боги»'
  rationale: Единственное число местоимения הוּא и контекст однозначно указывают на одного Бога Израиля. Буквальное множественное число по-русски ошибочно создало бы политеистический смысл; морфологическая особенность отмечается в сноске.
- issue: Значение выражения לֹא יִשָּׂא с преступлениями и грехами
  choice: 'Передать идиоматически: «не простит»'
  alternative: 'Передать образ буквально: «не понесёт / не унесёт»'
  rationale: Сочетание נשא с лексикой греха обычно выражает прощение или снятие вины. При этом образ несения допускает буквальное пояснение и потому сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Иисус Навин» употреблено как закрепившееся русское имя. Параллельные именные высказывания и точка с запятой сохраняют риторическую весомость еврейского текста; местоимение «Он» написано с прописной буквы согласно устойчивой русской религиозной норме.
