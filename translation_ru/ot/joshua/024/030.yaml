  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: ru
  text: И похоронили его в пределах его наследственного удела[a], в Тимнат-Серахе, что в горной области Ефрема, к северу от горы Гааш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на границе его удела». Древнееврейское слово может обозначать как границу, так и находящуюся в её пределах территорию; здесь, вероятно, имеется в виду земля, выделенная Иисусу Навину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: И похоронили его
  rationale: Последовательная форма повествования обозначает следующее событие; союз ו передан естественным русским «и», а אֹתוֹ — местоимением «его», относящимся к Иисусу Навину.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: в пределах его наследственного удела
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию. В описании места погребения естественнее понимать его как территорию; נַחֲלָה передано сочетанием «наследственный удел», сохраняющим смысл полученной по жребию земельной доли.
- source_word: בְּתִמְנַת סֶרַח
  choice: в Тимнат-Серахе
  rationale: Название места передано современной транслитерацией с древнееврейского; предлог ב здесь указывает на место погребения.
- source_word: בְּהַר אֶפְרָיִם
  choice: в горной области Ефрема
  rationale: הַר в данном географическом сочетании обозначает не отдельную гору, а гористую область, связанную с Ефремом.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: к северу от горы Гааш
  rationale: Сочетание предлогов выражает положение одного ориентира относительно другого; современная русская формулировка точно передаёт направление.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Географические названия переданы непосредственно с древнееврейского; архаичное «на горе Ефремовой» заменено более точным и понятным выражением «в горной области Ефрема».
