  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: ru
  text: Но Я не захотел слушать Валаама, и он действительно благословил вас; так Я избавил вас от его руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבִיתִי
  choice: не захотел
  rationale: Глагол выражает волю или согласие, а не неспособность; «не захотел» естественно передаёт эту оттенённую волевую семантику в прямой речи Бога.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: слушать Валаама
  rationale: שׁמע с ל обозначает слушание с готовностью принять сказанное или исполнить просьбу; русский оборот сохраняет близость к форме оригинала, не уточняя сверх текста, в чём именно состояло обращение Валаама.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: и он благословил вас — да, благословил
  rationale: Личный глагол с однокоренным абсолютным инфинитивом усиливает действие. Повтор с «да» передаёт эмфазу, не истолковывая конструкцию обязательно как многократность.
- source_word: וָאַצִּל
  choice: избавил
  rationale: נצל означает вырвать из опасности, избавить или спасти; «избавил» уместно в повествовании о спасении от чужой власти и не перегружает фразу дополнительными богословскими оттенками.
- source_word: מִיָּדוֹ
  choice: от его руки
  rationale: Сохранён прозрачный древнееврейский образ руки как власти или контроля; он понятен в возвышенном современном русском библейском регистре.
theological_decisions:
- issue: Кто совершает действие в словах וַיְבָרֶךְ בָּרוֹךְ
  choice: 'Подлежащее — Валаам: «он благословил вас».'
  alternative: 'Понимать подразумеваемым подлежащим Бога: «Я благословил вас».'
  rationale: Форма глагола стоит в третьем лице мужского рода единственного числа, а ближайшее названное лицо — Валаам. Контекст показывает Божье верховенство над исходом, но грамматика непосредственно приписывает произнесение благословения Валааму.
- issue: Характер усиления в конструкции с абсолютным инфинитивом
  choice: 'Передать несомненность и выразительность действия: «благословил — да, благословил».'
  alternative: «Не раз благословил», понимая усиление как указание на повторяемость.
  rationale: Контекст Чис 23–24 допускает многократность, однако сама конструкция прежде всего эмфатическая и не требует значения повторения. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и образ «от его руки» сохранены; неестественная для русского калька «благословляя, благословил» заменена ясным эмфатическим повтором.
