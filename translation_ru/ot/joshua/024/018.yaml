  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: ru
  text: И Яхве изгнал перед нами все народы и амореев, живших в земле[a]. Мы тоже будем служить Яхве, потому что Он — наш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все народы, в том числе амореев, живших в земле».'
    reason: Союз וְ может просто присоединять амореев как второй объект либо выделять их как часть ранее упомянутых народов.
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: прогнал
  rationale: Глагол גרש обозначает изгнание или удаление силой. «Прогнал» естественно звучит по-русски и сохраняет образ вытеснения, не уточняя способ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: כָּל הָעַמִּים
  choice: все народы
  rationale: Множественное число עַמִּים указывает на разные этнические и национальные группы; «народы» сохраняет этот смысл.
- source_word: וְאֶת הָאֱמֹרִי
  choice: и амореев
  rationale: Союз וְ перед вторым прямым дополнением непосредственно соответствует «и». Аморей назван в древнееврейском собирательно в единственном числе, что по-русски естественно передать множественным «амореи».
- source_word: יֹשֵׁב הָאָרֶץ
  choice: живших в этой земле
  rationale: Причастный оборот характеризует амореев как жителей данной земли. «Живших» — естественный современный эквивалент, а указательное «этой» передаёт определённость контекстуально известной земли.
- source_word: מִפָּנֵינוּ
  choice: от нас
  rationale: Еврейская идиома буквально означает удаление «от нашего лица» или «из нашего присутствия». Русское «прогнал от нас» сохраняет направленность удаления и звучит естественно.
- source_word: גַּם אֲנַחְנוּ
  choice: мы тоже
  rationale: Сочетание подчёркивает ответное обязательство народа и естественно передаётся словами «мы тоже».
- source_word: נַעֲבֹד
  choice: будем служить
  rationale: עבד применительно к Богу включает поклонение, верность и заветное служение; «служить» сохраняет эту широту.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: потому что он — наш Бог
  rationale: כִּי вводит основание обещания. «Потому что» ясно выражает причинную связь; именное сказуемое выделено тире по нормам русского языка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: В тексте стоит личное заветное имя Бога; транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Объём значения עבד в заветном контексте
  choice: служить
  alternative: поклоняться
  rationale: Значение включает поклонение, но не ограничивается обрядовым действием; «служить» также передаёт верность и подчинение Богу.
- issue: Связь амореев со «всеми народами»
  choice: и амореев
  alternative: в том числе амореев
  rationale: Форма וְאֶת допускает простое присоединение второго объекта, тогда как по смыслу амореи могут пониматься как особо названная часть перечисленных народов. Основной текст сохраняет явный союз, а смысл включения отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и доступен; сохранены личное имя «Яхве», широкое заветное значение слова «служить» и неоднозначность связи амореев со всеми народами.
