base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: ru
  text: Я дал Исааку Иакова и Исава. Исаву Я отдал горную область Сеира во владение, а Иаков и его сыновья сошли в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Я дал / Я отдал
  rationale: נתן означает «давать, отдавать». В первой части естественно «дал» о сыновьях, во второй — «отдал» о территории; различие стилистическое, повторяемое Божье действие сохранено.
- source_word: לְיִצְחָק
  choice: Исааку
  rationale: Традиционная и общепонятная русская форма библейского имени в дательном падеже.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: Иакова и Исава
  rationale: Имена переданы в традиционной русской форме; показатели прямого дополнения отдельно не переводятся.
- source_word: הַר שֵׂעִיר
  choice: горную область Сеир
  rationale: הַר здесь обозначает не обязательно отдельную вершину, а гористую территорию, данную Исаву; «горная область» ясно передаёт территориальный смысл.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: во владение
  rationale: Инфинитив ירש выражает вступление во владение землёй. Русское «во владение» кратко и естественно передаёт цель дара, а объект понятен из контекста.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: а Иаков и его сыновья
  rationale: Союз ו формально означает «и», однако в данном сопоставлении русский «а» естественно выражает контраст, не усиливая его до резкого «но».
- source_word: יָרְדוּ מִצְרָיִם
  choice: сошли в Египет
  rationale: Сохранён пространственный образ ירד «сходить, спускаться», традиционный для повествования о пути в Египет.
theological_decisions:
- issue: Смысл заключительного союза ו
  choice: «а Иаков и его сыновья»
  alternative: «и Иаков и его сыновья»
  rationale: Еврейский союз сам по себе допускает простое соединение, но контекст сопоставляет удел Исава с уходом семьи Иакова в Египет. Русский «а» передаёт это сопоставление, не превращая его в более сильное противопоставление.
- issue: Характер дара Исааку
  choice: «дал Исааку Иакова и Исава»
  alternative: «даровал Исааку Иакова и Исава»
  rationale: Прямое «дал» сохраняет повтор глагола נתן и не добавляет особого богословского оттенка сверх утверждения текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка разгружен делением первой длинной цепочки на два предложения. Имена даны в традиционных русских формах. Необязательные сноски не добавлены: неоднозначность הַר передана непосредственно выражением «горная область», а оттенок союза ו — умеренным русским «а».'
