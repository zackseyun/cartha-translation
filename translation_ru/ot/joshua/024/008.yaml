base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: ru
  text: Затем Я привёл вас в землю аморреев, живших за Иорданом. Они сражались против вас[a], и Я отдал их в ваши руки. Вы овладели их землёй, и Я истребил их перед вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сражались с вами»; по контексту речь идёт о сражении против Израиля, а не на его стороне.'
    reason: Сноска сохраняет формальную особенность еврейского оборота וַיִּלָּחֲמוּ אִתְּכֶם и устраняет возможную двусмысленность русского выражения «сражались с вами».
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: Затем Я привёл вас
  rationale: Глагол בוא в породе hифиль означает «привести». Последовательный союз ו передаёт развитие повествования; «затем» естественно выражает эту последовательность по-русски.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: в землю аморреев
  rationale: Предлог אֶל при глаголе движения допускает значение «в». Форма הָאֱמֹרִי собирательно обозначает аморрейский народ, поэтому по-русски уместно множественное число.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: живших за Иорданом
  rationale: Причастие יֹשֵׁב атрибутивно характеризует аморреев. «За Иорданом» сохраняет пространственное выражение, не уточняя восток или запад сверх текста.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: Они сражались против вас
  rationale: לחם с אֵת здесь описывает враждебное военное столкновение. Русское «против вас» ясно передаёт смысл контекста; буквальная конструкция отмечена в сноске.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: но Я отдал их в ваши руки
  rationale: Оборот נתן ביד означает отдать кого-либо во власть другого. «В ваши руки» сохраняет понятный русский библейский образ. Союз «но» естественно подчёркивает противопоставление нападения аморреев и исхода, определённого Богом, не изменяя отношений между частями высказывания.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: Вы овладели их землёй
  rationale: ירשׁ в данном контексте означает вступить во владение территорией после победы. «Овладели» передаёт результат, не вводя явно отсутствующее здесь понятие наследования.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: и Я истребил их перед вами
  rationale: שׁמד — сильный глагол уничтожения, поэтому «истребил» сохраняет тяжесть завоевательной лексики. «Перед вами» передаёт מִפְּנֵיכֶם как устранение врагов с пути и из присутствия Израиля.
theological_decisions:
- issue: Передача речи Бога о завоевании и уничтожении
  choice: 'Сохранены прямое первое лицо и сильные выражения: «Я отдал их в ваши руки… Я истребил их».'
  alternative: Смягчить формулировки до «помог вам победить» или «удалил их».
  rationale: Еврейский текст прямо приписывает Богу передачу аморреев Израилю и их уничтожение. Перевод не должен ни смягчать эту богословскую напряжённость, ни усиливать её сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разбит на несколько предложений для ясности; прописная буква в местоимении «Я» отмечает говорящего Бога в принятой русской издательской практике, не добавляя нового содержания.
