  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: ru
  text: 'Но если вам представляется злом служить Яхве[a], то выберите себе сегодня, кому вы будете служить: богам ли, которым служили ваши отцы за Рекой[b], или богам аморреев, в земле которых вы живёте. Что до меня и моего дома[c], мы будем служить Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если вам кажется неправильным» или «если вам неугодно»; буквально: «если это зло в ваших глазах».'
    reason: lexical_alternative
  - marker: b
    text: Под «Рекой» имеется в виду Евфрат.
    reason: cultural_note
  - marker: c
    text: 'Или: «мои домашние», «моя семья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם רַע בְּעֵינֵיכֶם
  choice: Но если в ваших глазах плохо
  rationale: Сохраняет условно-противительный переход и образность еврейской идиомы «плохо/зло в ваших глазах», оставаясь понятным по-русски; более буквальное «зло» здесь звучало бы неестественно.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / עָבְדוּ / נַעֲבֹד
  choice: служить
  rationale: Единообразно передаёт повтор корня עבד и сохраняет широкий смысл религиозного служения и верности, не сужая его до одного лишь поклонения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: выберите себе сегодня
  rationale: Сохраняет повеление, оттенок личного выбора לָכֶם и временное ударение «сегодня».
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: которым служили ваши отцы
  rationale: Сохраняет мужское родовое обозначение אָבוֹת и естественно связывает относительное предложение со словом «боги».
- source_word: בְּעֵבֶר הַנָּהָר
  choice: за Рекой
  rationale: Кратко и естественно передаёт устойчивое географическое выражение; прописная буква указывает на известную в контексте реку.
- source_word: אֱלֹהֵי הָאֱמֹרִי
  choice: богам аморреев
  rationale: Собирательное единственное הָאֱמֹרִי по-русски естественно передаётся названием народа во множественном числе.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: А я и мой дом
  rationale: Сохраняет эмфатический контраст и библейский образ «дома» как семьи или домочадцев.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя; транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Смысл религиозного עבד
  choice: служить
  alternative: поклоняться
  rationale: «Служить» сохраняет повтор ключевого глагола и более широкий смысл верности и религиозного служения; «поклоняться» неоправданно сужает значение.
- issue: Обозначение предков אָבוֹתֵיכֶם
  choice: ваши отцы
  alternative: ваши предки
  rationale: Выбранное чтение формально соответствует еврейскому слову, тогда как более широкий родовой смысл остаётся доступен из контекста.
- issue: Дом Иисуса Навина בֵיתִי
  choice: мой дом
  alternative: мои домашние; моя семья
  rationale: Сохраняется образная и несколько широкая формулировка оригинала, которая может охватывать семью и всё домашнее сообщество.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан ясным для широкого читателя, при этом сохранены повтор «служить», идиома «в ваших глазах», географическое «за Рекой» и образ «мой дом».
