  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: ru
  text: И послал Я Моисея и Аарона, и поразил Египет тем, что Я совершил в нём[a], а затем вывел вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как (согласно тому, что) Я совершил в нём». Еврейская конструкция сжата; речь идёт о Божьих действиях в Египте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: послал Я
  rationale: Обычное значение Qal глагола שׁלח — «посылать»; инверсия естественно сохраняет торжественное продолжение речи Бога.
- source_word: וָאֶגֹּף
  choice: поразил
  rationale: Глагол נגף означает «ударить, поразить, подвергнуть бедствию». «Поразил» сохраняет прямоту еврейского выражения и не ограничивает его заранее термином «казни».
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Название может обозначать страну и её народ как единое целое; здесь естественно «Египет».
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: тем, что совершил среди него
  rationale: Сжатая конструкция указывает на действия Бога внутри Египта. Такой перевод связывает способ поражения с совершённым там и сохраняет местоимение единственного числа, относящееся к Египту как целому.
- source_word: וְאַחַר
  choice: а после
  rationale: Передаёт временную последовательность и естественно звучит в современном русском повествовании.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: вывел вас
  rationale: Hiphil глагола יצא означает «вывести, заставить выйти»; прямое «вас» сохраняет корпоративное обращение исходного текста.
theological_decisions:
- issue: К кому относится местоимение второго лица множественного числа «вас»
  choice: Сохранено прямое «вывел вас», обращённое к Израилю как к единому народу.
  alternative: Пояснительно перевести «вывел ваших предков».
  rationale: В еврейском тексте прямо стоит «вас». Это выражает заветную солидарность нынешнего поколения с поколением исхода; перевод не должен устранять эту риторическую и богословскую напряжённость.
- issue: Характер Божьего поражения Египта
  choice: «поразил Египет»
  alternative: «навёл казни на Египет» или «подверг Египет бедствиям»
  rationale: Более широкое значение נגף сохраняет связь с египетскими казнями, но не вводит в основной текст уточнение, которого сам глагол формально не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок «послал Я» поддерживает речь Бога от первого лица; архаизмы избегаются.
