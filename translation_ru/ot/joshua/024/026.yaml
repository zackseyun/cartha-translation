  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: ru
  text: Иисус Навин записал эти слова в книгу Божьего Закона. Затем он взял большой камень и поставил его там, под теревинфом[a], который находился в святилище Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под дубом». Еврейское название дерева может обозначать теревинф либо дерево, традиционно называемое дубом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у святилища Яхве». Еврейский предлог в этом контексте может обозначать расположение рядом со святилищем.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: записал
  rationale: Глагол כתב означает «писать». В данном контексте «записал» естественно передаёт внесение слов в книгу, не ослабляя буквального смысла.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: דברים допускает значения «слова», «дела» или «вопросы»; поскольку речь идёт о внесении сказанного в книгу, «слова» лучше сохраняет документальный смысл.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: в книгу Божьего Закона
  rationale: ספר передано как «книга», а תורה — как «Закон» в данном контексте завета. Русская конструкция «книга Божьего Закона» естественно передаёт еврейскую сопряжённую цепь.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: взял большой камень
  rationale: Прямое и естественное обозначение физически крупного камня.
- source_word: וַיְקִימֶהָ
  choice: поставил его
  rationale: Каузативная форма קום означает привести камень в стоячее положение; «поставил» ясно передаёт установку памятного камня.
- source_word: תַּחַת הָאַלָּה
  choice: под теревинфом
  rationale: אַלָּה обычно обозначает теревинф или сходное крупное дерево. «Теревинф» точнее отражает наиболее вероятную ботаническую идентификацию; традиционное «дуб» сохранено в примечании как допустимая альтернатива.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: в святилище Яхве
  rationale: מקדש означает святое место или святилище, а предлог בְּ в первую очередь означает «в». Личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Расположение дерева относительно святилища
  choice: дерево находилось в святилище Яхве
  alternative: дерево находилось у святилища Яхве
  rationale: Основной текст следует обычному пространственному значению предлога בְּ — «в». Более свободное контекстуальное понимание «у, при» оставлено в примечании, поскольку дерево внутри святилища может подразумевать священную территорию, а не здание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Два еврейских повествовательных предложения разделены точкой для естественного русского ритма; повтор местоимения «он» проясняет смену действия. Термин «теревинф» несколько специальный, но точный и пояснён примечанием.
