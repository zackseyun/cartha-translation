  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: ru
  text: Тогда они воззвали к Яхве, и Он навёл тьму между вами и египтянами, навёл на него море и покрыл его[a]. Ваши глаза видели, что Я сделал в Египте. И много дней вы жили в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь стоят местоимения мужского рода единственного числа: «на него» и «покрыл его». Они могут иметь собирательное значение и относиться к Египту или египетскому войску; во многих переводах употреблено множественное число: «на них» и «покрыл их».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: воззвали
  rationale: Глагол צעק обозначает настойчивый крик о помощи. «Воззвали к Яхве» естественно передаёт и бедственное положение, и обращённость мольбы к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепонятна в современном русском библейском контексте.
- source_word: מַאֲפֵל
  choice: тьму
  rationale: Существительное означает тьму или глубокий мрак. «Тьму» точно и без излишнего усиления передаёт образ.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: между вами и египтянами
  rationale: Сохранено обращение во втором лице множественного числа, отождествляющее слушателей с поколением предков в рамках заветной речи.
- source_word: וַיָּבֵא עָלָיו אֶת הַיָּם
  choice: навёл на него море
  rationale: «Навёл» естественно выражает направленное Богом наступление моря; мужской род местоимения сохраняет единственное число еврейского суффикса.
- source_word: וַיְכַסֵּהוּ
  choice: покрыл его
  rationale: Сохранены основное значение כסה («покрывать») и мужской род единственного числа, не заменённый поясняющим множественным числом.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Ваши глаза видели
  rationale: Явное упоминание глаз сохранено ради присущей оригиналу выразительности и темы непосредственного свидетельства.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: что Я сделал в Египте
  rationale: Предлог ב передан нейтральным «в», без сужения смысла до действий исключительно против Египта.
- source_word: וַתֵּשְׁבוּ
  choice: вы жили
  rationale: В данном контексте ישב означает длительное пребывание; «жили» современно и естественно, в отличие от архаического «обитали».
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Сохранён буквальный временной образ оригинала, а не обобщающее «долгое время».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Единственное число местоименных суффиксов при описании гибели египетской стороны
  choice: сохранить «на него» и «его» в основном тексте
  alternative: сгладить до «на них» и «их» либо уточнить «египтян/египетское войско»
  rationale: В עָלָיו и וַיְכַסֵּהוּ стоят суффиксы мужского рода единственного числа. Их возможное собирательное отнесение к Египту или египетскому войску отмечено, но не разрешено внутри перевода.
- issue: Смена лица говорящего
  choice: сохранить переход от «Он» к «Я»
  alternative: унифицировать повествование в третьем лице
  rationale: Такой переход присутствует в еврейском тексте речи Яхве и важен для её непосредственного характера.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но не архаическим библейским звучанием. Личные местоимения, относящиеся к Богу, написаны с прописной буквы для ясности смены говорящего; синтаксис сохраняет напряжённый ряд действий оригинала.
