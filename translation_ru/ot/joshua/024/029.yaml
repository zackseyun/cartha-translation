  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: ru
  text: После этих событий Иисус, сын Навина, слуга Яхве[a], умер в возрасте ста десяти лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «раб»; здесь оно служит почётным обозначением того, кто преданно служит Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Естественно передаёт еврейскую повествовательную формулу и временное выражение; «событий» в данном контексте яснее и современнее буквального «вещей».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисус, сын Навина
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, понятные современному читателю.
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо передаёт значение глагола מות, не смягчая его эвфемизмом.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: В данном контексте עֶבֶד является почётным обозначением верного служения Богу; «слуга» сохраняет смысл лучше, чем социально окрашенное «раб».
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: в возрасте ста десяти лет
  rationale: Естественная русская передача еврейской идиомы указания возраста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано общепринятой русской транслитерацией, а не заменено титулом.
- issue: Значение עֶבֶד в титуле Иисуса Навина
  choice: слуга
  alternative: раб
  rationale: Лексема допускает оба значения, но здесь титул подчёркивает почётное и верное служение Яхве, а не подневольный общественный статус.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное, без архаической формулы «и было». Сохранены прямота сообщения о смерти и личное имя Яхве.
