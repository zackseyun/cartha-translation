  source_fidelity: 'Основной текст в целом точно передаёт еврейский текст: сохранены повеления, повтор «служите», имя Яхве, «ваши отцы» и географическая неопределённость выражения «по ту сторону Реки». «Всецело и верно» адекватно передаёт תמים וּבֶאֱמֶת, не навязывая значения безгрешности. Однако «Удалите богов» в современном русском звучит как физическое удаление предметов и менее естественно передаёт призыв избавиться от соперничающих божеств.'
