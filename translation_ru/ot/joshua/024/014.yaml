  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: ru
  text: Итак, бойтесь Яхве и служите Ему всецело и верно[a]. Избавьтесь от богов, которым служили ваши отцы по ту сторону Реки[b] и в Египте, и служите Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в целостности и истине». Еврейские слова выражают цельность и искренность, а также истину, надёжность и верность.'
    reason: lexical_alternative
  - marker: b
    text: То есть по ту сторону реки Евфрат.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Связующий вывод из предшествующего рассказа и переход к призыву; в современном русском «итак» естественно передаёт эту дискурсивную функцию.
- source_word: יְרָאוּ
  choice: бойтесь
  rationale: Сохраняет прямое значение глагола и библейское напряжение между страхом, почтением и послушанием, не ослабляя его до одного лишь «почитайте».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, стоящее в еврейском тексте.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: служите Ему
  rationale: Глагол עבד обозначает служение и верность господину, включая поклонение, но шире по смыслу, чем только культовое действие.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: всецело и верно
  rationale: «Всецело» передаёт цельность и неразделённость תמים, а «верно» — истину, надёжность и верность אמת; сноска сохраняет возможные оттенки.
- source_word: וְהָסִירוּ
  choice: удалите
  rationale: Прямой повелительный призыв устранить богов; нейтральнее и точнее, чем добавляющее эмоциональный оттенок «отвергните».
- source_word: אֱלֹהִים
  choice: богов
  rationale: В оригинале нет определения «чужих», поэтому оно не добавлено.
- source_word: אֲבוֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет конкретную мужскую родовую форму исходного текста; речь идёт о праотцах народа.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: по ту сторону Реки
  rationale: Передаёт традиционное географическое выражение, не вставляя в основной текст уточнение «Евфрат», которое дано в сноске.
- source_word: וּבְמִצְרַיִם
  choice: и в Египте
  rationale: Прямая передача указания места.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: и служите Яхве
  rationale: Сохраняет повтор повеления и соединительный союз; контраст с иными богами очевиден без добавления «но».
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смягчать ли ירא до одного лишь почтения
  choice: бойтесь Яхве
  alternative: почитайте Яхве
  rationale: «Бойтесь» сохраняет обычное значение еврейского глагола и богословскую многозначность богобоязненности, включающей благоговение и послушание.
- issue: Передача אבותיכם
  choice: ваши отцы
  alternative: ваши предки
  rationale: Выбрана форма, соответствующая мужскому родовому обозначению оригинала, без нейтрализации.
- issue: Характер требуемого служения
  choice: всецело и верно
  alternative: в непорочности и истине
  rationale: Основной текст выражает цельную, неразделённую и надёжную преданность, не превращая תמים в утверждение о безгрешном совершенстве; более буквальные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский с кратким, торжественным библейским ритмом. Повтор «служите» и имени «Яхве» сохранён как риторическое обрамление. Местоимение «Ему» написано с прописной буквы согласно распространённой русской религиозной издательской норме.
