  terminology: '«Яхве», «бойтесь», «служите», «ваши отцы» и «Река» употреблены последовательно и уместно. Сноски в русском черновике привязаны содержательно верно: [a] поясняет качество служения, [b] — Реку. В английском аудиторском следе тексты сносок, по-видимому, переставлены относительно их маркеров, но это не следует воспроизводить в русском тексте.'
