base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: ru
  text: Затем вы перешли Иордан и пришли к Иерихону. Жители Иерихона[a] сражались против вас — амореи, ферезеи, хананеи, хеттеи, гергесеи, евеи и иевусеи, — и Я отдал их в ваши руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господа Иерихона» или «правители Иерихона». Буквально: «владельцы Иерихона»; выражение может обозначать правителей или влиятельных людей города.'
    reason: Лексическая неоднозначность выражения בַּעֲלֵי יְרִיחוֹ.
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: вы перешли Иордан
  rationale: Глагол עבר в породе qal обозначает конкретное пересечение реки; «перешли Иордан» естественно и точно передаёт действие.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: пришли к Иерихону
  rationale: בוא с אֶל означает прибытие к месту и не требует уточнять, что израильтяне вошли внутрь города.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: владетели Иерихона
  rationale: בעל во множественном числе буквально означает «владельцы, господа» и в городском контексте может обозначать полноправных представителей, знатных людей или правителей города. Необычное, но понятное слово «владетели» сохраняет эту неоднозначность лучше, чем более узкие «правители» или более общие «жители».
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: сражались против вас
  rationale: לחם с предлогом ב выражает враждебное военное действие; «против вас» ясно передаёт направленность.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: амореи, ферезеи, хананеи, хеттеи, гергесеи, евеи и иевусеи
  rationale: Еврейские формы стоят в собирательном единственном числе; по-русски названия перечисляемых народов естественно передаются множественным числом. Использованы закрепившиеся русские библейские этнонимы.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: но Я отдал их в ваши руки
  rationale: Оборот נתן ביד означает передачу во власть; традиционный русский образ «отдал в ваши руки» сохраняет исходную метафору и остаётся понятным. Союз «но» естественно подчёркивает противопоставление нападения и Божьего вмешательства, допустимое в контексте еврейского ו.
theological_decisions:
- issue: Божественная роль в победе Израиля
  choice: «Я отдал их в ваши руки»
  alternative: «Я позволил вам одержать над ними победу»
  rationale: Сохранена прямая речь Бога и явно выраженная в еврейском тексте Его решающая роль; перевод не ослабляет действие до простого позволения.
- issue: Соотношение «владетелей Иерихона» и последующего перечня народов
  choice: Сохранить синтаксическое приложение без поясняющей интерпретации
  alternative: Понимать перечень как отдельные войска, не связанные с Иерихоном
  rationale: Еврейский синтаксис допускает восприятие перечня как уточнения противников, но не объясняет их отношение к Иерихону исчерпывающе; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Слово «владетели» выбрано намеренно как менее узкое, чем «правители», и сопровождено сноской. Заглавная «Я» обозначает говорящего Бога согласно русской издательской традиции.
