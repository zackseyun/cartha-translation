  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: ru
  text: Тогда поднялся[a] Балак, сын Циппора, царь Моава, и воевал против Израиля[b]. Он послал за Валаамом, сыном Беора, и призвал его, чтобы тот проклял вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выступил». Еврейский глагол может обозначать начало решительных действий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пошёл войной на Израиль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: восстал
  rationale: В повествовании קום может обозначать начало решительных действий, а не только физическое вставание. «Восстал» сохраняет движение исходного текста и не уточняет его сверх необходимого.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: вступил в войну с Израилем
  rationale: Глагол לחם с предлогом ב выражает враждебное военное действие. Этот перевод естественен по-русски и сохраняет прямое утверждение текста о войне против Израиля.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: послал за … и призвал его
  rationale: Переданы оба последовательных глагола — «послал» и «призвал». Добавление «за» и местоимения «его» делает сочетание естественным в современном русском языке, не устраняя двухчастную структуру оригинала.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: Валаамом, сыном Веора
  rationale: Имена переданы в традиционной русской библейской форме; падеж обусловлен русским синтаксисом.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: чтобы тот проклял вас
  rationale: קלל здесь означает навлечь или произнести проклятие. Указательное местоимение «тот» ясно обозначает Валаама как исполнителя, не расширяя содержания.
theological_decisions:
- issue: Утверждение, что Валак воевал с Израилем, при том что в книге Чисел особенно подчёркнута попытка проклясть Израиль через Валаама
  choice: 'Сохранено прямое утверждение: «вступил в войну с Израилем».'
  alternative: 'Передать более расплывчато: «враждовал с Израилем», «выступил против Израиля» или «готовился воевать».'
  rationale: Еврейское וַיִּלָּחֶם בְּיִשְׂרָאֵל прямо говорит о военном действии. Перевод не должен сглаживать возможное межтекстовое напряжение ради гармонизации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксис сделан естественным для широкого читателя, при этом сохранены последовательность действий и неоднозначность глагола קום.
