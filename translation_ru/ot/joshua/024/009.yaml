  rationale: Требуется безопасная правка ради устранения ложного оттенка мятежа в «восстал» и для нормализации передачи имён в современном литературном русском. Смысл высказывания, последовательность еврейских глаголов и прямое утверждение о военном действии против Израиля сохранены.
