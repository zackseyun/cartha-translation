  source_fidelity: 'Глагол וַיָּקָם не следует передавать словом «восстал»: в современном русском оно обычно означает мятеж или бунт, чего в еврейском тексте нет. «Поднялся» сохраняет формальное повествовательное движение и допускаемую семантическую широту. וַיִּלָּחֶם בְּיִשְׂרָאֵל прямо передано как «воевал против Израиля», без гармонизации с рассказом Чисел. Два глагола וַיִּשְׁלַח וַיִּקְרָא сохранены в сочетании «послал за ... и призвал».'
  naturalness: Исправленный текст звучит как современное литературное библейское повествование. «Послал за Валаамом и призвал его» естественно по-русски и не устраняет последовательности действий. «Поднялся» имеет умеренно возвышенный повествовательный оттенок, уместный в данном жанре.
  terminology: 'Имена приведены к обычной русской передаче, близкой к еврейской форме: «Балак, сын Циппора» и «Валаам, сын Беора». Формы «Валак», «Сепфор» и особенно «Веор» в исходном варианте менее соответствуют современной русской передаче библейских имён и создают неоправданное смешение традиций.'
