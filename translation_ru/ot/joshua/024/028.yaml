translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Тире помогает ясно связать распределительный оборот с народом; форма «Иисус» соответствует устойчивой русской библейской традиции, а контекст книги устраняет неоднозначность.
