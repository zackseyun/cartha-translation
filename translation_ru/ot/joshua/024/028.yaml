  text: И отпустил Иисус Навин народ, каждого — в свой удел.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждого к его уделу». Еврейское אִישׁ («мужчина; человек») употреблено здесь в распределительном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: отпустил
  rationale: Пиэль глагола שׁלח здесь означает, что Иисус Навин распустил собравшийся народ. «Отпустил» естественно передаёт завершение собрания и не требует добавления слов.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус
  rationale: Использована укоренившаяся русская библейская форма имени в контексте книги Иисуса Навина.
- source_word: הָעָם
  choice: народ
  rationale: עָם обозначает собравшийся народ Израиля; «народ» точно передаёт коллективное значение без излишнего уточнения.
- source_word: אִישׁ
  choice: каждого
  rationale: Существительное אִישׁ употреблено дистрибутивно. Русское «каждого» сохраняет значение распределения по отдельным людям и естественно согласуется с «в свой удел».
- source_word: לְנַחֲלָתוֹ
  choice: в свой удел
  rationale: В книге Иисуса Навина נַחֲלָה обычно означает полученную в наследственное владение землю. Традиционное и понятное выражение «свой удел» сохраняет земельный контекст и звучит естественнее буквального «к своему наследию».
