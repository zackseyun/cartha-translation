  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: ru
  text: И Я взял вашего отца Авраама с той стороны Реки[a], провёл его по всей земле Ханаана, умножил его потомство[b] и дал ему Исаака.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Рекой», вероятно, подразумевается Евфрат.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «его семя»; еврейское слово имеет собирательное значение и может обозначать потомство или потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: И Я взял
  rationale: Форма wayyiqtol продолжает повествовательную последовательность. Союз «и» сохраняет связь с предшествующей речью и не добавляет более узкого временного оттенка.
- source_word: אֲבִיכֶם אֶת־אַבְרָהָם
  choice: вашего отца Авраама
  rationale: «Отец» прямо передаёт אָב и сохраняет родовой и заветный язык обращения к Израилю; «предок» было бы естественнее хронологически, но менее точно.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: из-за Реки
  rationale: Выражение обозначает область по ту сторону известной Реки. Написание с прописной буквы отражает устойчивое географическое обозначение, не подставляя в основной текст название «Евфрат».
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: провёл его
  rationale: Каузативная форма глагола הלך передаёт действие Бога, который направлял Авраама. «Провёл» естественно сочетается с дальнейшим указанием пути по земле.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: по всей земле Ханаанской
  rationale: Предлог ב в контексте движения естественно передаётся русским «по»; традиционное географическое сочетание «земля Ханаанская» остаётся понятным в современном литературном русском.
- source_word: וָאַרְבֶּה אֶת־זַרְעוֹ
  choice: умножил его потомство
  rationale: Каузатив רבה означает «сделать многочисленным, умножить», а זֶרַע здесь — собирательное обозначение потомства.
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: и дал ему Исаака
  rationale: Синтаксис прямо представляет Исаака как дар Аврааму и естественно воспроизводится этим порядком слов.
theological_decisions:
- issue: Родовое обозначение Авраама
  choice: вашего отца Авраама
  alternative: вашего предка Авраама
  rationale: Исходный текст прямо называет Авраама «отцом». Сохранение этой формулировки передаёт родовую и заветную риторику, не сводя её к нейтральному указанию на далёкого предка.
- issue: Отождествление «Реки»
  choice: Реки
  alternative: Евфрата
  rationale: В еврейском тексте стоит определённое нарицательное существительное, а не собственное имя. Вероятное отождествление с Евфратом вынесено в примечание, чтобы не делать основной текст более определённым, чем источник.
- issue: Собирательное значение זֶרַע
  choice: потомство
  alternative: потомки; семя
  rationale: «Потомство» сохраняет собирательное единственное число и не вводит дополнительных богословских уточнений; буквальное «семя» в современном русском здесь звучало бы неестественно.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис остаётся ясным и последовательным; прописная буква в местоимении «Я» уместна в прямой речи Бога, а «Река» оформлена как устойчивое географическое обозначение.
