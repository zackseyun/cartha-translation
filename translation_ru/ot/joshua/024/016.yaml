lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: Народ ответил
  rationale: В еврейском повествовании сочетание «ответил и сказал» вводит прямую речь; по-русски естественное «ответил» передаёт обе глагольные формы без тяжеловесного повтора.
- source_word: חָלִילָה לָּנוּ
  choice: Ни за что не… мы
  rationale: Современное русское выражение передаёт решительное отвержение такой возможности и включает значение местоименного элемента «нам», не добавляя отсутствующего в еврейском тексте упоминания Бога.
- source_word: מֵעֲזֹב
  choice: не оставим
  rationale: В контексте заветной верности глагол означает отказ от верности, оставление; «оставить» понятно современному читателю и сохраняет необходимую смысловую весомость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее непосредственно в еврейском тексте, а не заменяющий его титул.
- source_word: לַעֲבֹד
  choice: не станем служить
  rationale: Глагол охватывает религиозное служение, поклонение и верность; «служить» сохраняет эту широту. В русском отрицание повторено для ясной координации двух действий.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямое и контекстуально естественное соответствие; определение не обязательно означает именно «чужеземных» богов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Источник содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл идиомы חָלִילָה לָּנוּ
  choice: Ни за что не оставим мы
  alternative: Боже упаси нас оставить
  rationale: Выбранный вариант сохраняет категорическое отвержение, не вводя прямого обращения к Богу, которого в еврейской идиоме нет.
- issue: Связь между оставлением Яхве и служением другим богам
  choice: не оставим… и не станем служить
  alternative: не оставим Яхве, чтобы служить другим богам
  rationale: Еврейская конструкция допускает тесную смысловую связь действий, но русский координированный вариант естественно представляет их как взаимосвязанные поступки, не сужая связь до однозначно целевой.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Формульное еврейское «ответил и сказал» передано естественным русским «ответил»; категоричность ответа подчёркнута восклицанием.
