  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: ru
  text: В тот день Иисус Навин заключил с народом завет[a] и установил для него в Сихеме устав и судебный порядок.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрезал завет»; древнееврейская идиома со значением «заключил завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «постановление и судебное решение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: заключил завет
  rationale: Устойчивое русское соответствие еврейской идиоме «резать завет»; передаёт совершение обязывающего заветного акта без неясного буквализма.
- source_word: לָעָם
  choice: с народом
  rationale: При כרת ברית предлог ל выражает вовлечённость народа в завет; по-русски естественно «заключить завет с народом».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное временное выражение.
- source_word: וַיָּשֶׂם
  choice: установил
  rationale: В сочетании с правовыми существительными שׂים означает введение или установление обязательной нормы.
- source_word: לוֹ
  choice: для него
  rationale: Местоимение в еврейском тексте стоит в единственном числе и относится к собирательному עָם «народ»; русский язык позволяет сохранить это согласование.
- source_word: חֹק
  choice: постановление
  rationale: Передаёт предписанный, обязательный порядок или установление и сохраняет юридический оттенок.
- source_word: וּמִשְׁפָּט
  choice: закон
  rationale: В данном юридическом контексте обозначает правовую норму или установленный порядок; «закон» понятно современному читателю и образует естественную пару с «постановлением».
- source_word: בִּשְׁכֶם
  choice: в Сихеме
  rationale: Точно сохраняет указанное место действия без добавления отсутствующего в еврейском тексте наречия «там».
theological_decisions:
- issue: Характер совершённого Иисусом Навином заветного действия
  choice: Иисус Навин заключил завет с народом
  alternative: Иисус Навин возобновил завет для народа / от имени народа
  rationale: Стих прямо называет Иисуса Навина действующим лицом и не уточняет здесь другую сторону завета. Перевод сохраняет поверхностную формулировку текста и не вносит пояснение из более широкого контекста.
- issue: Соотношение חֹק и מִשְׁפָּט
  choice: постановление и закон
  alternative: устав и судебное решение
  rationale: Оба слова сохраняются как отдельные правовые понятия, но их точное разграничение в контексте не навязывается читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис прост и ясен; юридическая и заветная терминология сохранена без конфессиональных уточнений.
