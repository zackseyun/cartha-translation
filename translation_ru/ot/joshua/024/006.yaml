    rationale: Еврейское פָּרָשִׁים обозначает конных воинов, всадников или конницу; русское «кони» называет животных и утрачивает человеческий, военный компонент.
  - severity: low
    issue: Неестественное «до Красного моря»
    rationale: «Погнались ... до» может означать погоню вплоть до конечного пункта и звучит тяжеловесно. «К Красному морю» естественно связывает прибытие и преследование с местом действия, не добавляя лишней конкретизации.
