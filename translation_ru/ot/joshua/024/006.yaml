base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: ru
  text: Я вывел ваших отцов из Египта, и вы пришли к морю. Египтяне погнались за вашими отцами на колесницах и с конницей к Красному морю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, букв.: «Море тростников». Евр. ям-суф.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Я вывел
  rationale: Порода hифиль глагола יצא означает «вывести». Союз ו продолжает повествовательную последовательность; в русском связность не требует обязательного «тогда».
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: ваших отцов
  rationale: Буквально «ваших отцов»; сохраняется мужской родовой термин и связь с поколением исхода.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Естественная русская передача исходного предлога מן при глаголе движения.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: и вы пришли к морю
  rationale: Сохраняется второе лицо множественного числа и направительное значение формы הַיָּמָּה — движение к морю.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Египтяне погнались
  rationale: Название страны употреблено в еврейском метонимически, при этом сказуемое стоит во множественном числе; «египтяне» точно и естественно передаёт действующих преследователей.
- source_word: בְּרֶכֶב וּבְפָרָשִׁים
  choice: на колесницах и конях
  rationale: רֶכֶב обозначает колесницы или колесничное войско, а פָּרָשִׁים — конных воинов. В данном контексте естественная русская формулировка передаёт средства и состав преследующего войска без тяжеловесности.
- source_word: יַם סוּף
  choice: Красное море
  rationale: Традиционное и широко узнаваемое название события; более буквальное «Тростниковое море» отмечено в сноске.
theological_decisions:
- issue: Обращение ко всему Израилю во втором лице, хотя речь идёт о поколении исхода
  choice: «вы пришли к морю»
  alternative: «они пришли к морю»
  rationale: Второе лицо намеренно отождествляет слушателей Иисуса Навина с их отцами в общей истории завета; оно прямо соответствует еврейскому тексту.
- issue: Передача יַם סוּף
  choice: «Красное море» в основном тексте
  alternative: «Тростниковое море»
  rationale: Традиционная форма сохраняет узнаваемость библейского события, а буквальная лексическая возможность приводится в сноске, без решения географического вопроса средствами перевода.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и достойным звучанием. Сохранено прямое «вы» исходного текста; синтаксис разделён на два предложения для естественного русского ритма.
