  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: ru
  text: 'Тогда Иисус Навин сказал народу: «Вы — свидетели против самих себя[a]: вы выбрали себе Яхве, чтобы служить Ему». Они ответили: «Мы свидетели».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы — свидетели самим себе», то есть ваши собственные слова свидетельствуют о сделанном вами выборе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующей реплике.
- source_word: הָעָם
  choice: народу
  rationale: עָם обозначает собравшийся народ; дательный падеж естественно обусловлен русским глаголом «сказал».
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Вы сами свидетели против себя
  rationale: Предлог בְּ в этом юридически окрашенном обороте допускает смысл свидетельства, обращённого против самих говорящих; «сами» также передаёт возвратный акцент.
- source_word: כִּי
  choice: в том, что
  rationale: Союз вводит содержание свидетельства; русское «в том, что» ясно связывает его с предыдущим утверждением.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: выбрали себе
  rationale: Сочетание בחר с לָכֶם подчёркивает собственный, сознательный выбор народа; «себе» кратко сохраняет этот оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: לַעֲבֹד אֹתוֹ
  choice: чтобы служить Ему
  rationale: עבד охватывает служение, верность и поклонение; «служить» сохраняет широкое значение исходного слова.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: 'Они ответили: «Мы свидетели»'
  rationale: В еврейском ответ эллиптичен — буквально «свидетели»; в русском для естественности восполнено подразумеваемое «мы», а «ответили» точно выражает функцию реплики.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное заветное имя; «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Юридическая направленность עֵדִים אַתֶּם בָּכֶם
  choice: свидетели против себя
  alternative: свидетели самим себе
  rationale: Контекст заветного обязательства придаёт словам силу свидетельства, которое позднее может быть обращено против произнёсших его; при этом перевод не добавляет идеи осуждения сверх юридического оттенка фразы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Имя יְהוֹשֻׁעַ передано традиционной русской библейской формой «Иисус Навин» во избежание неясности. Заглавная буква в местоимении «Ему» следует устойчивой русской религиозной издательской практике.
