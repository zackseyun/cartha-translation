  rationale: Исправлены грамматическое согласование и необоснованное снятие исходной неоднозначности. «Холм его сына, Финееса» передаёт גִּבְעַת־פִּינְחָס בְּנוֹ; «ему» оставлено без уточнения адресата. Сноска кратко фиксирует альтернативное понимание. Смысловых добавлений нет.
