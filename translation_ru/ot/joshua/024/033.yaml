base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: ru
  text: И умер Елеазар, сын Аарона, и похоронили его в Гивеат-Финеесе, на холме его сына, Финееса, который был дан ему в нагорье Ефрема.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на холме Финееса, его сына». В еврейском тексте местоимение «ему» может относиться либо к Финеесу, либо к Елеазару.'
    reason: Сноска сохраняет спорную синтаксическую отнесённость לוֹ, не навязывая один из возможных референтов.
lexical_decisions:
- source_word: בְּגִבְעַת פִּינְחָס
  choice: в Гивеат-Финеесе
  rationale: Сочетание понимается как название места («холм Финееса»); транслитерация сохраняет его функцию как топонима и соответствует контексту погребения.
- source_word: בְּהַר אֶפְרָיִם
  choice: в горной области Ефрема
  rationale: הַר здесь обозначает не одну гору, а гористую местность, традиционно связанную с уделом Ефрема.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: и похоронили его
  rationale: Неопределённое множественное число исходного текста сохранено без добавления явного субъекта.
theological_decisions:
- issue: К кому относится местоимение в אֲשֶׁר נִתַּן לוֹ
  choice: «который был дан его сыну» — Финеесу
  alternative: «который был дан ему» — Елеазару
  rationale: Ближайший референт суффикса בְּנוֹ — Финеес, сын Елеазара; однако еврейская конструкция допускает соотнесение לוֹ с Елеазаром. Неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным синтаксисом. Союзное начало и последовательность событий сохранены; неопределённый субъект погребения не конкретизирован.
