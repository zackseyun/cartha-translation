  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: ru
  text: И Я послал впереди вас шершня[a], и он прогнал их от вас — двух царей аморреев, — не твоим мечом и не твоим луком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно также образное выражение, обозначающее панику или ужас, посланные Богом, а не буквального шершня или шершней.
    reason: Лексическое значение слова конкретно, но допускается его метафорическое понимание; сноска сохраняет эту неоднозначность.
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: И Я послал
  rationale: Форма Qal wayyiqtol, 1-е лицо единственного числа, продолжает повествовательную последовательность и обозначает совершённое действие Господа.
- source_word: לִפְנֵיכֶם
  choice: перед вами
  rationale: Буквально «перед вашим лицом»; по контексту означает, что посланное Богом шло впереди народа.
- source_word: הַצִּרְעָה
  choice: шершня[a]
  rationale: Основное словарное значение — «шершень». Сохранено единственное число с определённым значением; оно может иметь собирательный смысл. Возможное образное понимание вынесено в сноску.
- source_word: וַתְּגָרֶשׁ
  choice: и он прогнал
  rationale: Глагол גרשׁ означает «прогнать, изгнать». В русском род местоимения согласован со словом «шершень», тогда как в еврейском глагол женского рода согласован с существительным женского рода.
- source_word: מִפְּנֵיכֶם
  choice: от вас
  rationale: Естественно передаёт удаление врагов из присутствия Израиля и значение сочетания с גרשׁ.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: двух царей аморреев
  rationale: Точно передаёт конструкцию «два царя аморреев» и сохраняет пояснительное отношение к местоимению «их».
- source_word: לֹא בְחַרְבְּךָ
  choice: не твоим мечом
  rationale: Предлог ב имеет инструментальное значение. Сохранено обращение во 2-м лице единственного числа, отличное от предшествующего множественного «вами».
- source_word: וְלֹא בְקַשְׁתֶּךָ
  choice: и не твоим луком
  rationale: Сохранены параллелизм, инструментальное значение и форма 2-го лица единственного числа.
theological_decisions:
- issue: Следует ли понимать הַצִּרְעָה буквально или как образ посланного Богом ужаса
  choice: В основном тексте дано буквальное «шершня»
  alternative: «ужас», «панику» или «страх»
  rationale: Лексическое значение конкретного существительного не следует заменять толкованием, поскольку контекст не вынуждает к этому. Сноска сохраняет образную возможность, не устраняя акцент на Божьем действии.
- issue: Переход от обращения во множественном числе к единственному
  choice: Сохранены «вами / вас», затем «твоим / твоим»
  alternative: Унифицировать всё обращение во множественном числе ради гладкости
  rationale: Еврейский текст действительно переходит от суффиксов 2-го лица множественного числа к суффиксам 2-го лица единственного числа. Унификация скрыла бы особенность исходного текста, вероятно представляющую Израиль как единое целое.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавное «Я» обозначает говорящего Бога. Необычный переход от множественного обращения к единственному намеренно сохранён; тире помогают ясно связать «их» с пояснением «двух царей аморреев».
