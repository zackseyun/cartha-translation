  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: ru
  text: Итак, уберите[a] чужих богов, находящихся среди вас, и обратите своё сердце[b] к Яхве, Богу Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалите».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «склоните своё сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак, теперь
  rationale: Сочетание передаёт как связующую силу וְ, так и непосредственность עַתָּה, вводя вытекающий из предыдущей речи призыв.
- source_word: הָסִירוּ
  choice: уберите
  rationale: Побудительная форма каузатива означает «удалите, устраните». «Уберите» ясно и естественно передаёт требование отказаться от присутствующих среди народа чужих богов.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: чужих богов
  rationale: Выражение обозначает богов чужих народов и чужого культа, а не просто необычных богов. «Чужие боги» сохраняет также оттенок их несовместимости с верностью Богу Израиля.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: которые находятся среди вас
  rationale: בְּקִרְבְּכֶם здесь указывает на присутствие среди народа. Формулировка не навязывает спорного понимания о том, были ли это физические идолы или почитаемые божества.
- source_word: וְהַטּוּ
  choice: и обратите
  rationale: נטה буквально значит «наклонить, направить». В сочетании с «сердцем» и предлогом אֶל речь идёт о сознательном направлении внутренней верности к Яхве; «обратите» естественно передаёт эту метафору.
- source_word: לְבַבְכֶם
  choice: своё сердце
  rationale: Еврейский текст использует существительное в единственном числе с суффиксом второго лица множественного числа. Русское «своё сердце» сохраняет собирательное единственное число и обращение ко всему народу.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: אֶל выражает направленность, а тетраграмматон передан личным именем «Яхве», что сохраняет прямое употребление имени Бога в исходном тексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Прозрачно передаёт конструкцию принадлежности и определяет Яхве как Бога Израиля.
theological_decisions:
- issue: Значение присутствия чужих богов «среди вас»
  choice: Сохранить пространственно-социальную формулировку без уточнения природы этого присутствия
  alternative: Истолковать слова как указание исключительно на идолов либо исключительно на внутреннюю приверженность иным богам
  rationale: Исходный текст не уточняет, идёт ли речь о материальных культовых предметах, тайном почитании или обоих явлениях; перевод сохраняет эту напряжённость.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем יְהוָה и титулом אֲדֹנָי.
- issue: Собирательное единственное число «сердце»
  choice: своё сердце
  alternative: свои сердца
  rationale: Единственное число сохраняет грамматическую форму и подчёркивает общую верность народа, не исключая личной ответственности каждого слушателя.
translation_notes:
  register: Современный литературный русский язык с достоинством прямого призыва. «Итак, теперь» передаёт связь с предшествующей речью; «уберите» и «обратите» понятны широкому читателю без архаизации. Личное имя «Яхве» сохранено, а буквальный образ склонения сердца отмечен в сноске.
