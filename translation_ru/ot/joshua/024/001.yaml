  terminology: «Иисус Навин», «колена Израиля», «старейшины», «судьи» и «перед Богом» уместны по регистру и точны. «Главы» сохранено как близкое к исходному образу обозначение руководителей; «должностные лица» предпочтительнее «распорядителей» для שֹׁטְרִים.
