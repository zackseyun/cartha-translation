  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: ru
  text: Иисус Навин собрал все колена Израиля в Сихем[a] и созвал старейшин, глав, судей и должностных лиц Израиля[b]. Они предстали перед Богом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Сихеме». Еврейская форма указывает на направление, буквально — «к Сихему».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «руководителей» (буквально: «глав»).'
    reason: lexical_alternative
  - marker: c
    text: Выражение «перед Богом» может подразумевать, что собрание состоялось у святилища или в другом священном месте, связанном с заветом.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: собрал
  rationale: В данном повествовательном контексте глагол означает собрать людей вместе; «собрал» естественно и точно передаёт это действие.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: все колена Израиля
  rationale: «Колена Израиля» — устоявшееся и понятное обозначение племенных объединений Израиля; определение כָּל передано словом «все».
- source_word: שְׁכֶמָה
  choice: в Сихем
  rationale: Направительное окончание у названия места указывает на движение к Сихему. Русская конструкция «в Сихем» естественно передаёт это направление.
- source_word: וַיִּקְרָא לְ
  choice: созвал
  rationale: В контексте официального собрания сочетание означает призвать или созвать названных представителей; «созвал» звучит естественно и сохраняет официальный оттенок.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшин Израиля
  rationale: Точное и традиционно понятное обозначение признанной группы руководителей народа.
- source_word: רָאשָׁיו
  choice: его глав
  rationale: Сохранён образный смысл «главы» и местоименный суффикс единственного числа, относящийся к Израилю как к единому народу. Более разъяснительное «руководителей» дано в сноске.
- source_word: שֹׁפְטָיו
  choice: судей
  rationale: Прямое обозначение носителей судебной и общественной власти; принадлежность Израилю ясна из общего ряда и местоимения «его».
- source_word: שֹׁטְרָיו
  choice: распорядителей
  rationale: Термин обозначает административных должностных лиц или исполнителей распоряжений. «Распорядители» сохраняет служебно-административный характер должности, не уточняя её функции сверх текста.
- source_word: וַיִּתְיַצְּבוּ
  choice: предстали
  rationale: Возвратная порода выражает занятие своего места или официальное явление перед кем-либо. «Предстали» кратко передаёт церемониальный оттенок.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: перед Богом
  rationale: Еврейский текст прямо называет Бога, а не употребляет имя יהוה и не называет святилище; поэтому буквальный смысл сохранён в основном тексте.
theological_decisions:
- issue: Смысл לִפְנֵי הָאֱלֹהִים в контексте собрания при заключении завета
  choice: перед Богом
  alternative: перед святилищем Бога; перед Господом
  rationale: В исходном тексте стоит הָאֱלֹהִים, а не имя יהוה, поэтому замена на «перед Господом» была бы неоправданной. Выражение может подразумевать явление в священном месте, но эта контекстуальная возможность отмечена в сноске, а не внесена в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Устоявшиеся библейские общественные термины («колена», «старейшины») сохранены ради точности и узнаваемости; синтаксис упрощён до двух предложений для ясности.
