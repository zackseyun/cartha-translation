  source_fidelity: 'Основной смысл передан верно: Иисус Навин собирает все колена к Сихему, призывает четыре категории израильских представителей, и они предстают перед Богом. Направление, выраженное ה־локативом в שְׁכֶמָה, корректно передано как «в Сихем», а «перед Богом» точно отражает לִפְנֵי הָאֱלֹהִים без подмены божественным именем.'
