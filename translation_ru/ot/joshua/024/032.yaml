  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: ru
  text: А кости Иосифа, которые сыны Израиля вынесли из Египта, похоронили в Сихеме, на участке поля[a], который Иаков купил у сыновей Еммора, отца Сихема[b], за сто кесит[c]; и этот участок стал наследственным владением сыновей Иосифа[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на доле поля»; еврейское слово обозначает отдельный участок земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «основателя (или родоначальника) Сихема», если слово «отец» употреблено в более широком смысле.'
    reason: lexical_alternative
  - marker: c
    text: Кесита — древняя единица стоимости или денежного расчёта; её точный эквивалент неизвестен.
    reason: cultural_note
  - marker: d
    text: 'В еврейском тексте здесь глагол стоит во множественном числе: буквально «и они стали». По контексту он, вероятно, относится к участку (или к участку и полю); точный референт формы не вполне ясен.'
    reason: textual_grammar_note
lexical_decisions:
- source_word: עַצְמוֹת
  choice: кости
  rationale: Конкретно передаёт еврейское слово и сохраняет связь с повествованием о погребении Иосифа.
- source_word: הֶעֱלוּ
  choice: вынесли
  rationale: Hiphil глагола עלה означает «поднять/вывести наверх»; в данном контексте естественное русское «вынесли из Египта» передаёт доставку останков в Ханаан без ненужной пространственной буквальности.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родственный и заветный образ оригинала; форма «сыны» уместна в современном литературном библейском регистре.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: на участке поля
  rationale: חֶלְקָה обозначает участок или долю земли; выражение естественно по-русски и точно указывает место погребения.
- source_word: בְּנֵי חֲמוֹר
  choice: сыновей Еммора
  rationale: Прямо передаёт еврейское «сыновья Хамора»; традиционная русская форма имени «Еммор» обеспечивает узнаваемость.
- source_word: אֲבִי שְׁכֶם
  choice: отца Сихема
  rationale: Формально сохраняет неоднозначное «отец Сихема», не решая в основном тексте, назван ли человек, город или родоначальник.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: за сто кесит
  rationale: Транслитерация древней единицы стоимости избегает ложной точности; после числительного «сто» употреблена естественная русская форма родительного множественного числа.
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: и он стал наследственным владением сыновей Иосифа
  rationale: Мужское местоимение естественно соотносится с ближайшим смысловым референтом «участок»; «наследственное владение» передаёт земельно-наследственный смысл נַחֲלָה.
theological_decisions:
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Родственная формула оригинала сохранена там, где она понятна современному читателю и несёт оттенок общей заветной принадлежности.
- issue: Референт множественного וַיִּהְיוּ
  choice: участок стал наследственным владением
  alternative: кости стали наследием
  rationale: Грамматическое множественное число допускает связь с «костями», однако контекст земельной покупки и выражение לְנַחֲלָה вероятнее указывают на участок как наследственное владение. Русское местоимение делает этот смысл ясным, не добавляя доктринального вывода.
- issue: Значение אֲבִי שְׁכֶם
  choice: отец Сихема
  alternative: основатель или родоначальник Сихема
  rationale: Основной текст сохраняет буквальную неоднозначность; более широкий возможный смысл слова «отец» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис близок к еврейскому, но не тяжеловесен; повтор местоимения «они» сохраняет эмфатическое возобновление подлежащего после длинной относительной конструкции. Все сноски расположены непосредственно после соответствующих выражений.
