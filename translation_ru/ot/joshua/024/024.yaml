source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: ru
  text: 'И народ сказал Иисусу Навину: «Мы будем служить[a] Яхве, нашему Богу, и слушаться его голоса[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняться». Еврейский глагол может обозначать служение Богу как поклонение, однако здесь «служить» полнее передаёт смысл заветной верности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слушать его голос»; это выражение подразумевает послушание сказанному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם
  choice: И народ сказал
  rationale: Обычная повествовательная формула; собирательное «народ» естественно сочетается в русском с глаголом в единственном числе.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: Устоявшаяся русская библейская форма имени יְהוֹשֻׁעַ в данном контексте.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Яхве, нашему Богу
  rationale: Передаёт личное имя יהוה и форму с суффиксом первого лица множественного числа «нашему Богу».
- source_word: נַעֲבֹד
  choice: будем служить
  rationale: Глагол עבד здесь выражает не только поклонение, но и более широкое заветное служение и верность.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: и слушаться его голоса
  rationale: Сохраняет образ еврейского выражения «слушать голос», одновременно ясно передавая его смысл — послушание.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное заветное имя Бога; транслитерация «Яхве» сохраняет различие между именем יהוה и титулом «Господь».
- issue: Смысл עבד в заветном контексте
  choice: служить
  alternative: поклоняться
  rationale: «Служить» охватывает как почитание Бога, так и деятельную верность Ему, не сужая смысл до собственно богослужения.
- issue: Идиома שמע בקול
  choice: слушаться его голоса
  alternative: повиноваться ему; слушать его голос
  rationale: Выбранный вариант сохраняет исходный образ и передаёт подразумеваемое послушание, не устраняя семантическую связь между слушанием и исполнением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис прост и понятен; сохранены заветное имя Бога и образное выражение исходного текста.
