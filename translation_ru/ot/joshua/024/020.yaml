base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: ru
  text: Если вы оставите Яхве и станете служить чужим богам, Он обратится против вас, навлечёт на вас беду[a] и истребит вас[b] — после того как Он оказал вам благодеяния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причинит вам зло». Еврейский глагол здесь означает причинить вред или бедствие, а не совершить нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «положит вам конец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В контексте предостережения вводит условие; русское «если» ясно передаёт связь между отступничеством и последующим судом.
- source_word: תַעַזְבוּ אֶת־יְהוָה
  choice: вы оставите Яхве
  rationale: Глагол עזב обозначает оставление, здесь — разрыв верности Яхве. «Оставите» естественно по-русски и сохраняет смысл отношений завета; личное имя передано как «Яхве».
- source_word: וַעֲבַדְתֶּם אֱלֹהֵי נֵכָר
  choice: и станете служить чужим богам
  rationale: עבד при наименовании богов означает религиозное служение и поклонение. «Чужие боги» передаёт их чуждость Израилю и верности Яхве.
- source_word: וְשָׁב
  choice: Он обратится против вас
  rationale: שוב указывает на поворот, то есть перемену прежнего благого отношения к Израилю. Добавление «против вас» естественно выражает направленность следующего действия, не устраняя образ поворота.
- source_word: וְהֵרַע לָכֶם
  choice: навлечёт на вас беду
  rationale: Hiphil от רעע здесь означает причинение вреда или бедствия, а не нравственное зло со стороны Бога. Формулировка ясно передаёт судебное бедствие.
- source_word: וְכִלָּה אֶתְכֶם
  choice: и истребит вас
  rationale: כלה означает довести до конца, уничтожить. «Истребит» сохраняет суровость предупреждения и звучит естественнее буквального «поглотит».
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: после того как делал вам добро
  rationale: היטיב означает делать добро, благодетельствовать. Несовершенный русский вид уместно описывает прежние благие дела Яхве и подчёркивает резкий контраст с судом.
theological_decisions:
- issue: Божий суд после прежних благодеяний
  choice: Яхве прямо представлен Тем, кто в ответ на отступничество обратится против Израиля, наведёт бедствие и истребит его.
  alternative: Представить бедствие лишь естественным последствием идолопоклонства.
  rationale: Еврейский текст непосредственно приписывает действия Яхве. Перевод сохраняет напряжение между Его прежней благостью и последующим судом, не смягчая божественную действенность.
- issue: Значение וְשָׁב как перемены в действиях Яхве
  choice: «Он обратится против вас»
  alternative: «Он снова…» или «Он переменится».
  rationale: Контекст указывает на обращение от благодеяния к суду. Выбранная формулировка сохраняет образ поворота и не предполагает перемены в нравственном характере Бога.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. «Яхве» сохраняет личное имя Бога; «чужие боги», «навлечёт беду» и «истребит» понятны широкому читателю. Тире перед заключительной фразой подчёркивает контраст между прежним благодеянием и грядущим судом.
