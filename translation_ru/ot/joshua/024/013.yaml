source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: ru
  text: Я дал вам землю, над которой вы не трудились, и города, которые вы не строили; вы живёте в них. Вы едите плоды виноградников и оливковых деревьев — виноградников и деревьев, которых вы не насаждали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Я дал
  rationale: Форма wayyiqtol от נתן повествует о завершённом действии Бога; в русском естественно простое прошедшее время. Союз ו в начале не обязательно передавать отдельным «и», поскольку стих продолжает прямую речь и бессоюзное начало звучит естественнее.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: землю, над которой вы не трудились
  rationale: יגע обозначает тяжёлый труд, усилие; сочетание с בָּהּ применительно к земле естественно передаётся по-русски как «трудиться над землёй». Единственное число в еврейской форме относится к Израилю как к единому народу, тогда как русское «вы» сохраняет обращение ко всему народу без искусственной маркировки.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: и города, которых вы не строили
  rationale: עָרִים прямо означает «города». Прошедшее несовершенного вида естественно выражает отсутствие участия Израиля в их строительстве.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: вы живёте в них
  rationale: ישב здесь означает проживание в полученных городах. Настоящее время передаёт сохраняющийся результат прежнего дара и соответствует контексту речи Иисуса Навина.
- source_word: כְּרָמִים וְזֵיתִים
  choice: плоды виноградников и оливковых деревьев
  rationale: כְּרָמִים — «виноградники», а זֵיתִים буквально может обозначать оливы или оливковые деревья. Добавление «плоды» делает по-русски ясным подразумеваемый объект глагола «есть», не превращая זֵיתִים в менее буквальное «оливковые рощи».
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם
  choice: которых вы не сажали
  rationale: נטע означает «сажать, насаждать»; относительное местоимение соотносится с виноградниками и оливковыми деревьями.
- source_word: אַתֶּם אֹכְלִים
  choice: Вы едите
  rationale: Самостоятельное местоимение с причастием подчёркивает действующего субъекта и обозначает продолжающееся настоящее. Русское явное «вы» сохраняет это ударение без обязательного прогрессива.
theological_decisions:
- issue: Чередование единственного и множественного числа во втором лице
  choice: Передать все формы обращением «вы» к Израилю как народу
  alternative: Отметить единственное число в первой части как «ты»
  rationale: Еврейский текст обращается к Израилю корпоративно и допускает переход между грамматическим единственным и множественным. Русское чередование «ты/вы» могло бы создать ложное впечатление смены адресата.
- issue: Дар земли и продолжающееся пользование им
  choice: Сохранить переход от прошедшего «дал» к настоящим «живёте» и «едите»
  alternative: Унифицировать времена как прошедшие
  rationale: Так сохраняется напряжение самого текста между совершённым Божьим даром и нынешним положением адресатов, без дополнительного богословского истолкования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи, но без архаизмов «обитаете» или «вкушаете». Пунктуация сохраняет две смысловые части: дар земли и городов, затем продолжающееся пользование их плодами.'
