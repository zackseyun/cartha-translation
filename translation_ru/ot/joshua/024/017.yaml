source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: ru
  text: Ведь Яхве, наш Бог, — Тот, кто вывел нас и наших отцов из земли Египта, из дома рабов[a], кто совершил у нас на глазах эти великие знамения и хранил нас на всём пути, которым мы шли, среди всех народов, среди которых мы проходили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из дома рабства». Буквально по-еврейски: «из дома рабов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание для решения народа, выраженного в предыдущем стихе; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: הוּא הַמַּעֲלֶה
  choice: Тот, кто вывел
  rationale: Самостоятельное местоимение הוּא подчёркивает действующее лицо; в контексте исхода естественное русское «вывел» передаёт каузативный смысл причастия от עלה, хотя буквально образ связан с движением вверх.
- source_word: וְאֶת אֲבוֹתֵינוּ
  choice: и наших отцов
  rationale: Сохраняет конкретную родовую и историческую формулировку еврейского текста.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет явно присутствующее в оригинале слово «земля» в естественной для литературного русского форме.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабов
  rationale: Буквально сохраняет конкретное множественное существительное עֲבָדִים «рабы», не подменяя его абстрактным понятием «рабство».
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: эти великие знамения
  rationale: «Знамения» сохраняет смысл אוֹת как знака, в данном контексте чудесного, не сводя его только к общему понятию чуда.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: хранил нас
  rationale: Передаёт защитное значение שׁמר во время пути и звучит естественно и достойно по-русски.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: на всём пути, которым мы шли
  rationale: Естественно передаёт пространственно-продолжительное значение предлога בְּ и сохраняет образ пути.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: среди всех народов, через которые мы проходили
  rationale: 'Сохраняет оба пространственных элемента: пребывание среди народов и прохождение через них.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» прямо передаёт тетраграмматон и сохраняет его заветное значение.
- issue: Передача עֲבָדִים в формуле исхода
  choice: рабы
  alternative: рабство; слуги
  rationale: В еврейском тексте употреблено конкретное существительное во множественном числе. «Рабы» сохраняет обозначение подневольного положения, тогда как «слуги» его смягчает, а «рабство» делает выражение абстрактным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис упрощён до естественного русского периода, при этом сохранены повторные относительные конструкции и историко-заветная лексика.
