lexical_decisions:
- source_word: וַיְהִי
  choice: И когда
  rationale: В повествовательной последовательности וַיְהִי вместе с последующим כַּאֲשֶׁר вводит временное придаточное. Русское «И когда» естественно передаёт связь с предыдущим рассказом без архаичного «И было».
- source_word: כַּאֲשֶׁר
  choice: когда
  rationale: Союз вводит временное придаточное, предшествующее главному сообщению о речи Яхве.
- source_word: תַּמּוּ
  choice: закончил
  rationale: Глагол תמם обозначает завершение действия; форма единственного числа согласуется в русском с собирательным подлежащим «весь народ».
- source_word: כָל הַגּוֹי
  choice: весь народ[a]
  rationale: Гּוֹי здесь обозначает Израиль как единое сообщество. «Весь народ» естественнее по-русски, чем «вся нация», а сноска сохраняет указание на единственное собирательное выражение оригинала.
- source_word: לַעֲבוֹר אֶת הַיַּרְדֵּן
  choice: переходить через Иордан
  rationale: Инфинитив с ל дополняет глагол завершения; сочетание «закончил переходить» точно и понятно передаёт завершённую переправу. Название реки по-русски обычно употребляется без слова «река».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וַיֹּאמֶר ... אֶל ... לֵאמֹר
  choice: 'сказал Иисусу Навину:'
  rationale: Обычная древнееврейская формула введения прямой речи передана естественной русской конструкцией; двоеточие указывает на продолжение речи в следующем стихе.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся русская библейская форма имени Joshua, позволяющая отличить этого персонажа от Иисуса Христа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, а не титул. «Яхве» сохраняет его как имя и представляет принятую научную реконструкцию произношения, не подменяя его конфессионально закреплённым титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранена повествовательная связь с предыдущим стихом через начальное «И»; архаичные обороты устранены. Двоеточие отражает незавершённую формулу введения речи.
