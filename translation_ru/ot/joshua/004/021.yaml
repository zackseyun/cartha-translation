- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: Когда … спросят
  rationale: אֲשֶׁר здесь вводит будущее обстоятельство, а שאל имеет обычное значение «спрашивать».
- source_word: בְּנֵיכֶם
  choice: ваши сыновья
  rationale: Передаёт формально мужское множественное число оригинала; возможный более широкий смысл «дети, потомки» отмечен в сноске.
- source_word: מָחָר
  choice: в будущем
  rationale: Буквально «завтра», но в данном контексте слово идиоматически указывает на последующее время или грядущее поколение.
- source_word: אֶת אֲבוֹתָם
  choice: своих отцов
  rationale: Возвратное «своих» естественно выражает по-русски принадлежность к подлежащему «сыновья» и сохраняет непосредственную семейную сцену.
- source_word: לֵאמֹר
  choice: двоеточие и вложенная прямая речь
  rationale: Второе לֵאמֹר вводит содержание вопроса; русская пунктуация передаёт эту функцию без тяжеловесного «говоря».
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: Что это за камни?
  rationale: Естественная русская идентификационная формулировка, близкая буквальному «Что эти камни?»; значение или назначение камней не вносится в основной текст.
