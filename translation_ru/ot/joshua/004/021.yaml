- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Последовательная повествовательная форма wayyiqtol передана обычной русской библейско-повествовательной конструкцией без добавления лишнего временного оттенка.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет семейно-заветное выражение оригинала и при этом естественно звучит в русском библейском повествовании.
- source_word: לֵאמֹר
