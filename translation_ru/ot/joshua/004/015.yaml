  text: И сказал Яхве Иисусу Навину:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говоря»; это слово вводит прямую речь в следующем стихе.'
    reason: 'Лексическое уточнение: явное לֵאמֹר в основном тексте передано двоеточием.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой продвигает повествование; обычная русская библейская повествовательная связь «И сказал» близко передаёт структуру оригинала и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֶל
  choice: Иисусу Навину
  rationale: Предлог אֶל при глаголе речи обозначает адресата; в русском это естественно выражается дательным падежом без отдельного предлога.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: 'Использована устоявшаяся русская форма имени библейского персонажа; в данном контексте поставлена в дательный падеж: «Иисусу Навину».'
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь следующего стиха; по-русски его функцию естественно передаёт двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал содержит собственное имя Бога. «Яхве» сохраняет его как имя и представляет наиболее распространённую научную реконструкцию произношения, не подменяя имя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена краткость исходной фразы; двоеточие показывает, что высказывание продолжается в следующем стихе.
