base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: ru
  text: Народ вышел из Иордана[a] в десятый день первого месяца и расположился станом в Гилгале, у восточной границы Иерихона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялись от Иордана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к востоку от Иерихона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ מִן הַיַּרְדֵּן
  choice: вышел из Иордана
  rationale: Сочетание עלה с מן обозначает движение вверх и прочь от реки. В данном контексте естественное русское «вышел из Иордана» ясно передаёт выход народа из русла, тогда как буквальное «поднялся» сохранено в примечании.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: в десятый день первого месяца
  rationale: Календарная формула обозначает десятый день месяца; слово «день» естественно восполняется по-русски.
- source_word: וַיַּחֲנוּ
  choice: расположился станом
  rationale: Глагол חנה означает разбить лагерь или расположиться станом. Единственное число согласовано с собирательным существительным «народ».
- source_word: בַּגִּלְגָּל
  choice: в Гилгале
  rationale: Название места передано транслитерацией с древнееврейского; предлог «в» естественен при обозначении стоянки в данной местности.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: у восточной границы Иерихона
  rationale: קצה обозначает край, предел или границу, а מזרח — восток или восточную сторону. Формулировка сохраняет географический образ исходного текста, не уточняя без основания, идёт ли речь о городской окраине или границе прилегающей территории.
