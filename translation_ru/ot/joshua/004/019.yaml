translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Собирательное «народ» последовательно сочетается с глаголами в единственном числе; архаичное «расположился станом» здесь сохраняет ясное значение лагерной стоянки и соответствует библейскому повествовательному регистру.
