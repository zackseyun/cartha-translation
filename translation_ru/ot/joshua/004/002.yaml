lexical_decisions:
- source_word: קְחוּ
  choice: возьмите
  rationale: Повелительная форма множественного числа от לקח имеет основное значение «взять». В данном контексте речь идёт о назначении или выборе людей, но «возьмите» сохраняет прямую силу исходного глагола.
- source_word: לָכֶם
  choice: себе
  rationale: Предлог ל с суффиксом 2-го лица множественного числа передаёт возвратно-бенефактивный оттенок; по-русски он естественно выражается словом «себе».
- source_word: מִן הָעָם
  choice: из народа
  rationale: עם в повествовательном контексте обозначает народ Израиля; «из народа» кратко и естественно передаёт исходную конструкцию.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: двенадцать мужчин
  rationale: Сочетание прямо обозначает двенадцать лиц мужского пола; «мужчин» точнее, чем нейтральное «человек».
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: по одному мужчине от каждого
  rationale: Повтор имеет распределительное значение. Русская конструкция с «по одному» передаёт его ясно и естественно, а буквальный повтор отмечен в сноске.
- source_word: מִשָּׁבֶט
  choice: от каждого колена
  rationale: שבט здесь означает одно из колен Израиля. В русском библейском употреблении точным и узнаваемым соответствием является «колено».
