source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: ru
  text: 'Иисус Навин сказал им: «Пройдите перед ковчегом Яхве, вашего Бога, в середину Иордана, и пусть каждый из вас поднимет себе на плечо по одному камню — по числу колен сынов Израиля[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля». Это формальное родовое и заветное обозначение народа Израиля; в переводах также встречается «израильтян» или «народа Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычное продолжение древнееврейского повествования; русский вид и порядок слов естественно передают последовательность событий без обязательного добавления союза «и».
- source_word: עִבְרוּ
  choice: пройдите
  rationale: Императив עבר обозначает переход; здесь движение направлено к месту перед ковчегом и в середину русла. «Пройдите» звучит естественнее, чем буквальное «перейдите», которое могло бы ошибочно подразумевать переход на другой берег.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохранено пространственное отношение избранных людей к ковчегу.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: ковчегом Яхве, вашего Бога
  rationale: Прямо передана конструкция принадлежности; приложение «вашего Бога» в русском отделено запятой для ясности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, а не заменяющий его титул.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: в середину Иордана
  rationale: תּוֹךְ указывает на внутреннюю, срединную часть; формулировка сохраняет образ середины речного русла.
- source_word: וְהָרִימוּ לָכֶם
  choice: и пусть ... поднимет себе
  rationale: Передаёт повеление, каузативное значение поднятия и заинтересованность адресатов, выраженную לָכֶם.
- source_word: אִישׁ אֶבֶן אַחַת
  choice: каждый из вас ... по одному камню
  rationale: 'Дистрибутивная конструкция естественно передана по-русски: каждый представитель должен взять один камень.'
- source_word: עַל שִׁכְמוֹ
  choice: на плечо
  rationale: Сохраняет конкретный способ переноса и согласуется с дистрибутивным единственным числом.
- source_word: לְמִסְפַּר
  choice: по числу
  rationale: Кратко и точно выражает соответствие числа камней числу колен.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: колен сынов Израиля
  rationale: Сохранены и племенное значение שֵׁבֶט, традиционно передаваемое как «колено», и формальное обозначение «сыны Израиля».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранено формальное родовое и заветное выражение оригинала; оно не сведено к более общему этнониму.
- issue: Дистрибутивное אִישׁ в контексте представителей колен
  choice: каждый из вас
  alternative: каждый мужчина; каждый человек
  rationale: Контекст уже определяет адресатов как избранных представителей колен. Формулировка точно сохраняет индивидуальное распределение поручения и по-русски не звучит тяжеловесно.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис сделан ясным для обычного читателя, при этом сохранены конкретные пространственные детали, личное имя Яхве и формула «сыны Израиля».
