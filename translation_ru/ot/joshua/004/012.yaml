base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: ru
  text: Сыны Рувима, сыны Гада и половина колена Манассии перешли вооружёнными[a] впереди сынов Израиля, как сказал им Моисей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в боевом строю»; древнееврейское слово может обозначать вооружённость или боевое построение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: перешли
  rationale: В данном повествовательном контексте глагол עבר обозначает переход через Иордан; «перешли» естественно и ясно передаёт это действие.
- source_word: בְּנֵי רְאוּבֵן ... וּבְנֵי גָד
  choice: сыны Рувима, сыны Гада
  rationale: Сохранён буквальный древнееврейский оборот «сыны», указывающий здесь на племенные группы и поддерживающий торжественный повествовательный регистр.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: половина колена Манассии
  rationale: Устойчивое и понятное русское обозначение половины племени Манассии.
- source_word: חֲמֻשִׁים
  choice: вооружёнными
  rationale: В контексте слово обозначает военную готовность или боевое снаряжение; «вооружёнными» кратко и естественно передаёт наиболее вероятный смысл.
- source_word: לִפְנֵי
  choice: впереди
  rationale: Предлог указывает на положение этих воинов перед остальными израильтянами при переходе.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено буквальное родоплеменное выражение исходного текста; в данном контексте оно обозначает израильский народ.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: как и говорил им Моисей
  rationale: Оборот передаёт соответствие ранее данным Моисеем указаниям, не усиливая глагол דבר до явно выраженного «приказал».
