  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: ru
  text: Когда весь народ завершил переправу, ковчег Яхве и священники перешли перед народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии народа». Еврейское выражение может означать как положение впереди народа, так и действие в его присутствии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Сочетание вводит временное придаточное и продвигает повествование; по-русски естественно передаётся союзом «когда» без буквального «и было».
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: весь народ завершил переправу
  rationale: תמם обозначает завершение, а עבר в данном контексте — переправу через Иордан. Такая формулировка ясно передаёт законченность действия и звучит естественно по-русски.
- source_word: וַיַּעֲבֹר
  choice: перешли
  rationale: Глагол עבר повторяет корень из предыдущей части стиха и обозначает переход на другой берег; «перешли» сохраняет эту связь без тяжеловесного повтора слова «переправа».
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Конструкция означает ковчег, принадлежащий Яхве или связанный с Ним; личное имя יהוה передано транслитерацией «Яхве».
- source_word: וְהַכֹּהֲנִים
  choice: и священники
  rationale: Союз координирует священников с ковчегом как участников перехода; русское «и» сохраняет синтаксическую форму исходного текста.
- source_word: לִפְנֵי הָעָם
  choice: перед народом
  rationale: Выражение может указывать как на положение впереди, так и на присутствие перед кем-либо. Основной перевод сохраняет краткую русскую формулировку с близкой пространственно-реляционной неоднозначностью.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Отношение ковчега и священников к народу при переходе
  choice: перед народом
  alternative: в присутствии народа
  rationale: לִפְנֵי допускает пространственное значение «впереди/перед» и значение присутствия. Основной текст не уточняет сверх необходимого, а альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза лаконична и достойна по тону. Слово «ковчег» сохраняет привычную библейскую лексику, а синтаксис остаётся понятным современному читателю.
