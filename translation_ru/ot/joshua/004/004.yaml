    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: позвал
  rationale: Сочетание קרא с אֶל означает, что Иисус Навин позвал выбранных людей к себе; «позвал» естественно передаёт действие, не усиливая его до «призвал» или «созвал».
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: двенадцать человек
  rationale: Речь идёт об уже определённой по контексту группе; русская форма без отдельного показателя определённости передаёт это естественно.
- source_word: אֲשֶׁר הֵכִין
  choice: которых он назначил
  rationale: В данном контексте הכין указывает на предварительное определение или назначение представителей; буквальное «подготовил» могло бы ошибочно подразумевать обучение или снаряжение.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: из сынов Израиля
  rationale: Сохранена образная и родовая форма еврейского выражения; более идиоматичный вариант «израильтян» указан в сноске.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: по одному человеку от каждого племени
  rationale: Повтор אִישׁ אֶחָד имеет распределительное значение, которое естественно выражается по-русски конструкцией «по одному… от каждого».
