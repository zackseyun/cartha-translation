  text: И эти двенадцать камней, которые они взяли из Иордана, Иисус Навин установил в Галгале.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: И
  rationale: Союз связывает стих с предшествующим повествованием; показатель прямого дополнения אֵת отдельно не переводится.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: эти двенадцать камней
  rationale: Передаёт числительное, существительное и указательное местоимение в естественном русском порядке слов.
- source_word: אֲשֶׁר לָקְחוּ
  choice: которые они взяли
  rationale: Относительное придаточное определяет камни; совершенный вид естественно обозначает предшествующее действие без обязательного добавления «ранее».
- source_word: מִן הַיַּרְדֵּן
  choice: из Иордана
  rationale: Предлог מִן обозначает источник удаления; традиционное название реки по-русски не требует добавления слова «река».
- source_word: הֵקִים
  choice: установил
  rationale: В контексте памятных камней глагол означает поставить или воздвигнуть; «установил» звучит современно и сохраняет предметный смысл.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использовано общепринятое русское библейское имя, позволяющее отличить персонажа от Иисуса Христа.
- source_word: בַּגִּלְגָּל
  choice: в Галгале
  rationale: Предлог בְּ обозначает место, а название передано в закрепившейся русской форме с нормативным склонением.
