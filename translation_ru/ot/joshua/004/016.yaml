  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: ru
  text: «Прикажи священникам, несущим ковчег свидетельства, выйти из Иордана[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подняться из Иордана». Еврейский глагол буквально означает «подняться, взойти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Прикажи
  rationale: Императив второго лица единственного числа передаёт прямое и достаточно сильное повеление, обращённое к Иисусу Навину.
- source_word: הַכֹּהֲנִים
  choice: священникам
  rationale: Обычный современный русский эквивалент; определённость понятна из контекста и конструкции с дополнением.
- source_word: נֹשְׂאֵי
  choice: несущим
  rationale: Причастие настоящего времени естественно передаёт еврейское действительное причастие, характеризующее этих священников.
- source_word: אֲרוֹן הָעֵדוּת
  choice: ковчег свидетельства
  rationale: Сохраняет именно слово עֵדוּת («свидетельство»), не подменяя его более привычным в других местах выражением «ковчег завета».
- source_word: וְיַעֲלוּ
  choice: выйти
  rationale: В контексте подъёма со дна реки русское «выйти из» естественно передаёт направленное движение наружу; буквальнее возможно «подняться».
- source_word: מִן הַיַּרְדֵּן
  choice: из Иордана
  rationale: Предлог מן обозначает движение откуда-либо; здесь «из Иордана» ясно указывает на выход из русла реки.
