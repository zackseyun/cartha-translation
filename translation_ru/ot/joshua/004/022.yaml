lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: тогда расскажите
  rationale: 'Порода hифиль глагола ידע выражает побуждение к знанию: «дать знать, сообщить». В данном наставлении естественное русское «расскажите» ясно передаёт повелительный смысл формы с וְ и связь с предыдущим контекстом.'
- source_word: בְּנֵיכֶם
  choice: своим детям
  rationale: בנים может обозначать как сыновей, так и детей вообще. В контексте передачи памяти следующему поколению более широкое «детям» уместно, при этом более узкое значение отмечено в сноске.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив «говоря» вводит содержание сообщения. В современном русском его естественно передать пунктуационно, без тяжеловесного «говоря».
- source_word: בַּיַּבָּשָׁה
  choice: по суше
  rationale: Слово обозначает сухую землю или сушу. «По суше» естественно описывает переход там, где прежде была вода, и сохраняет акцент на чудесном переходе.
- source_word: עָבַר
  choice: перешёл
  rationale: Глагол עבר с прямым дополнением обозначает пересечение или переход через преграду; «перешёл» — ясный современный эквивалент.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя здесь обозначает народ; сохраняется традиционная русская форма.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: этот Иордан
  rationale: 'Указательное местоимение при названии реки создаёт непосредственную привязку к видимому месту: «этот Иордан». Добавление слова «река» не требуется.'
