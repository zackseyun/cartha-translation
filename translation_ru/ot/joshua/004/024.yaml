  - marker: b
    text: Здесь «бояться» подразумевает также благоговение, трепет и почтение перед Яхве, а не только ужас.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: чтобы … узнали
  rationale: Целевая конструкция передана естественным русским придаточным с «чтобы»; совершенный вид «узнали» выражает предполагаемый итог явленного Божьего деяния.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: все народы земли
  rationale: עַמִּים обозначает народы, а הָאָרֶץ в данном контексте предпочтительно понимается в широком смысле — «земля»; возможное местное значение отмечено в сноске.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранён ясный и значимый древнееврейский образ руки как проявленной силы, без замены его толкованием «могущество».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано транслитерацией, а не заменено титулом.
- source_word: כִּי חֲזָקָה הִיא
  choice: что рука Яхве сильна
  rationale: Прямо передано именное сказуемое; женский род прилагательного соответствует слову «рука».
- source_word: לְמַעַן יְרָאתֶם
  choice: чтобы вы боялись
  rationale: Сохранено основное значение ירא и его богословское напряжение; оттенки благоговения и трепета пояснены в сноске.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: В сочетании с именем Яхве форма обозначает единственного Бога Израиля; притяжательный суффикс передан местоимением «вашего».
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Сохранён формально близкий библейский оборот, обозначающий постоянство на протяжении всей жизни.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и соответствует указанной проектной норме.
- issue: Смысл ירא по отношению к Богу
  choice: боялись
  alternative: почитали; благоговели перед
  rationale: Глагол включает страх, трепет и благоговейное почтение. Прямой перевод не устраняет заложенное в тексте напряжение, а пояснение предотвращает понимание слова лишь как ужаса.
- issue: Масштаб выражения הָאָרֶץ
  choice: земли
  alternative: страны
  rationale: Контекст допускает широкое, общеземное понимание, однако древнееврейское слово может иметь и местное значение; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Параллельная конструкция «чтобы… и чтобы…» сохраняет строение еврейского стиха; антропоморфный образ «рука Яхве» оставлен без сглаживания.
