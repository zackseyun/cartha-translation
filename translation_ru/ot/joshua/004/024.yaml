translation:
  language: ru
  text: чтобы все народы земли[a] узнали, что рука Яхве сильна, и чтобы вы боялись[b] Яхве, вашего Бога, всю жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все народы страны», если הָאָרֶץ здесь имеет местное, а не всеобщее значение.'
