translation:
  language: ru
  text: 'И повелел Иисус Навин священникам: «Выйдите из Иордана».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: И повелел
  rationale: Глагол צוה выражает властное распоряжение; «повелел» сохраняет эту силу, а союз «И» естественно продолжает древнееврейское повествование.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся русская библейская форма имени, позволяющая отличить этого персонажа от Иисуса Христа.
- source_word: אֶת הַכֹּהֲנִים
  choice: священникам
  rationale: При русском глаголе «повелеть» адресат естественно ставится в дательном падеже, хотя в древнееврейском он оформлен как прямое дополнение.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском оборот «сказав» здесь избыточен; функцию לֵאמֹר естественно передаёт пунктуационное введение прямой речи.
- source_word: עֲלוּ
  choice: Выйдите
  rationale: Буквально глагол означает движение вверх, но в контексте речь идёт о выходе священников с русла реки на берег; «выйдите» ясно и естественно передаёт направленное движение.
- source_word: מִן הַיַּרְדֵּן
  choice: из Иордана
  rationale: Предлог מן указывает на движение из того места, где находились священники; название реки по-русски традиционно употребляется без добавления слова «река».
