base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: ru
  text: Ибо Яхве, ваш Бог, осушил перед вами воды Иордана, пока вы не перешли его, подобно тому, как Яхве, ваш Бог, осушил перед нами Тростниковое море[a], пока мы не перешли его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Красное море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: осушил
  rationale: Каузативная форма глагола יבש означает, что Бог сделал воды сухими, обеспечив переход; «осушил» естественно передаёт это по-русски и сохраняет повтор глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В сочетании с именем Яхве слово имеет единственное число и обозначает Бога Израиля.
- source_word: מֵי הַיַּרְדֵּן
  choice: воды Иордана
  rationale: Сохраняется конкретный образ речных вод и еврейская конструкция принадлежности.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: перед вами / перед нами
  rationale: Пространственная идиома естественно передаётся по-русски словом «перед» и сохраняет параллелизм двух событий.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: пока вы не перешли его / пока мы не перешли его
  rationale: Конструкция обозначает продолжительность до завершения перехода; местоимение «его» естественно уточняет объект в русском контексте.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: как ... сделал
  rationale: Ясно выражает сопоставление перехода через Иордан с прежним переходом через море.
- source_word: יַם סוּף
  choice: Тростниковое море
  rationale: Слово סוּף непосредственно означает тростник; традиционное название дано в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Основной текст сохраняет личное имя, непосредственно присутствующее в еврейском источнике, не подменяя его титулом.
- issue: Передача יַם סוּף
  choice: Тростниковое море
  alternative: Красное море
  rationale: Выбран буквальный смысл еврейского названия, а традиционный эквивалент сохранён для ориентации читателя в сноске.
- issue: Соотнесение говорящего с поколением исхода
  choice: перед нами, пока мы не перешли
  alternative: перед ними, пока они не перешли
  rationale: Первое лицо множественного числа в еврейском тексте сохранено без исторического сглаживания, несмотря на создаваемое им повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор «осушил», смена второго лица на первое и прямое сопоставление двух переходов.
