base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: ru
  text: Иисус Навин поставил двенадцать камней посреди Иордана, под тем местом, где стояли священники, несшие ковчег завета[a]. Камни остаются там до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под местом стояния ног священников». Древнееврейское выражение указывает на место, где стояли священники, неся ковчег.'
    reason: Сохраняет необычную буквальную пространственную формулировку и поясняет её без устранения её значения.
lexical_decisions:
- source_word: הֵקִים
  choice: поставил
  rationale: Каузативная форма глагола קום означает «поставить, установить». «Поставил» естественно звучит по-русски и соответствует установке памятных камней.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: посреди Иордана
  rationale: תּוֹךְ указывает на внутреннюю или срединную часть; «посреди Иордана» сохраняет пространственный смысл и торжественный повествовательный тон.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: там, где стояли священники
  rationale: Буквальное «под местом стояния ног» неестественно для современного русского языка. Контекстуальная передача обозначает именно то место в русле, которое занимали священники, а буквальная форма сохранена в примечании.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: несшие ковчег завета
  rationale: Причастие נֹשְׂאֵי описывает священников как несущих ковчег; «несшие» ясно передаёт одновременное обстоятельство в русском повествовании.
- source_word: וַיִּהְיוּ שָׁם
  choice: камни остаются там
  rationale: В сочетании с формулой «до сего дня» выражение обозначает продолжающееся состояние с точки зрения повествователя. Повтор существительного устраняет неясность местоимения.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивый литературный эквивалент древнееврейской формулы, обозначающей сохранение положения до времени повествователя.
theological_decisions:
- issue: Соотношение этих двенадцати камней с двенадцатью камнями, поставленными в Галгале
  choice: Стих прямо описывает отдельную установку Иисусом Навином двенадцати камней посреди Иордана.
  alternative: Истолковать стих как повторное упоминание камней, вынесенных из Иордана, или согласовать повествование посредством исправления текста.
  rationale: Масоретский текст ясно помещает действие «посреди Иордана». Перевод сохраняет напряжение контекста и не вносит гармонизирующего толкования.
- issue: Временная перспектива формулы עַד הַיּוֹם הַזֶּה
  choice: «камни остаются там до сего дня» — продолжающееся состояние с точки зрения повествователя.
  alternative: «они были там до сего дня».
  rationale: Настоящее время по-русски передаёт актуальность памятника для времени повествователя, не утверждая, что камни сохраняются во время современного читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «До сего дня» сохранено как понятная устойчивая формула; синтаксис разделён на два предложения для ясности.
