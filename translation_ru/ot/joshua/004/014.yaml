  source_fidelity: Текст точно передаёт временной оборот, действие Яхве по возвышению Иисуса Навина в глазах всего Израиля, последующую реакцию народа и сопоставление с Моисеем. Повтор «боялись» обоснованно сохраняет лексическую и литературную параллель ירא ... ירא. Оборот «во все дни его жизни» в данном контексте относится к Моисею и не вносит небезопасного толкования.
