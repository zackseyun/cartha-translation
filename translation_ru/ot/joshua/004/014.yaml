  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: ru
  text: В тот день Яхве возвеличил Иисуса Навина в глазах всего Израиля, и они боялись его[a], как боялись Моисея во все дни его жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговели перед ним», «относились к нему с почтительным трепетом»; еврейский глагол может обозначать страх, благоговение или почтительный трепет — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная для современного русского повествования передача временного оборота с בְּ.
- source_word: גִּדַּל
  choice: возвеличил
  rationale: Порода пиэль выражает то, что Яхве сделал Иисуса Навина великим и возвысил его положение в восприятии народа; «возвеличил» кратко сохраняет эту каузативную направленность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: в глазах всего Израиля
  rationale: Сохраняет еврейский образ и естественно обозначает оценку Иисуса Навина всем народом.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: и они боялись его
  rationale: Глагол ירא охватывает страх, благоговение и почтительный трепет. Основной текст сохраняет прямое значение, а примечание отмечает контекстуальные оттенки.
- source_word: כַּאֲשֶׁר יָרְאוּ אֶת מֹשֶׁה
  choice: как боялись Моисея
  rationale: Передаёт прямое сопоставление отношения народа к Иисусу Навину и Моисею без ненужного уточнения степени.
- source_word: כָּל יְמֵי חַיָּיו
  choice: во все дни его жизни
  rationale: Сохраняет традиционный еврейский оборот и его полный временной охват; местоимение по ближайшему и наиболее естественному контексту относится к Моисею.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Оттенок ירא по отношению к Иисусу Навину
  choice: боялись его
  alternative: благоговели перед ним; относились к нему с почтительным трепетом
  rationale: «Боялись» сохраняет лексическую силу и параллель с отношением к Моисею, не сводя реакцию лишь к уважению; контекст допускает благоговейный, а не только устрашающий оттенок.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис близок к еврейскому оригиналу, но естественен по-русски; повтор «боялись» сохраняет намеренную литературную параллель между Иисусом Навином и Моисеем.
