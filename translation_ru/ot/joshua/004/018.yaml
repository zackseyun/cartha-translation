source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: ru
  text: И вот, когда священники, нёсшие ковчег завета Яхве, вышли из середины Иордана и подошвы ног священников были подняты на сушу[b], воды Иордана вернулись на своё место и, как прежде[a], разлились по всем его берегам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как вчера и третьего дня» — древнееврейское выражение со значением «как прежде», «как раньше».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «подошвы ног священников были подняты (или оторваны) к суше».'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Передаёт вводную повествовательную формулу естественно для современного русского языка, без архаичного «и было».
- source_word: בעלות
  choice: когда ... поднялись
  rationale: Временная конструкция с инфинитивом עלה описывает выход священников вверх из русла реки.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: нёсшие ковчег завета Яхве
  rationale: Причастная конструкция сохранена; цепочка сопряжённого состояния передана прозрачно, а тетраграмматон — личным именем «Яхве».
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: из середины Иордана
  rationale: תוך указывает на внутреннюю часть, середину реки, а не только на её берег.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: стопы священников поднялись на сушу
  rationale: Передаёт отделение стоп от русла и движение на сухую землю; русская формулировка сохраняет образ исходного текста без механистичного «отсоединились».
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: воды Иордана вернулись на своё место
  rationale: Прямо сохраняет образ возвращающихся вод и единственное число русского устойчивого выражения «на своё место».
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: как прежде
  rationale: Естественная передача древнееврейской идиомы «как вчера и третьего дня», то есть «как раньше».
- source_word: וַיֵּלְכוּ ... עַל כָּל גְּדוֹתָיו
  choice: разлились по всем его берегам
  rationale: Контекстуально передаёт движение вод поверх берегов; «разлились» в современном русском яснее буквального «пошли».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным повествовательным звучанием. Повтор слова «священники» сохранён вслед за еврейским текстом ради ясности субъекта; синтаксис слегка сглажен, а образ возвращающихся и разливающихся вод сохранён.
