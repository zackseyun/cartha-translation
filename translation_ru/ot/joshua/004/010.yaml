  to: Священники, нёсшие ковчег, стояли посреди Иордана, пока не было завершено всё, что Яхве повелел Иисусу Навину сказать народу[a], — согласно всему, что Моисей повелел Иисусу Навину. Народ поспешно перешёл реку.
