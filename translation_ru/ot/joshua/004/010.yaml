reference: Joshua 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: ru
  text: Священники, нёсшие ковчег, стояли посреди Иордана, пока не было завершено всё, что Яхве повелел Иисусу Навину сказать народу[a], — согласно всему, что Моисей повелел Иисусу Навину. Народ поспешно перешёл реку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до завершения всего дела (или: всего слова)»; выражение обобщает всё, что Яхве повелел Иисусу Навину сказать народу.'
    reason: Слово דָּבָר может означать «слово», «дело» или «то, о чём идёт речь»; сноска сохраняет широту исходного выражения и точнее отражает конструкцию עַד תֹּם.
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: Священники, нёсшие ковчег
  rationale: Причастная конструкция описывает продолжавшееся действие священников; «нёсшие» естественно и точно передаёт נשׂא в повествовательном контексте.
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  choice: стояли посреди Иордана
  rationale: Причастие выражает длительное положение, а בְּתוֹךְ — нахождение в середине русла; название реки по-русски допускает такое употребление без добавления слова «река».
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: пока не было исполнено всё
  rationale: Буквально выражение означает «до завершения всего дела/слова». Выбранная формулировка сохраняет идею полного исполнения и не ограничивает דָּבָר только речью.
- source_word: צִוָּה יְהוָה אֶת יְהוֹשֻׁעַ לְדַבֵּר אֶל הָעָם
  choice: что Яхве повелел Иисусу Навину сказать народу
  rationale: «Повелел… сказать» естественно передаёт конструкцию צוה + לדבר אל, сохраняя направленность речи к народу.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: согласно всему, что Моисей повелел Иисусу Навину
  rationale: כְּכֹל выражает полное соответствие ранее данному повелению; «согласно всему» сохраняет эту полноту.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: Народ поспешно перешёл реку
  rationale: Наречие «поспешно» передаёт отдельный глагол מהר, не создавая неестественного русского сочетания «поспешили и перешли». «Реку» добавлено для ясности объекта перехода, однозначного из контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерационная форма сохраняет это различие и соответствует предоставленному решению.
- issue: Связь повеления Яхве с повелением Моисея
  choice: сохранена последовательность двух формулировок без дополнительного толкования
  alternative: явно отождествить содержание обоих повелений
  rationale: Текст утверждает соответствие, но не поясняет здесь его точный механизм; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Устаревшие обороты избегаются; традиционные имена «Иисус Навин», «Моисей», «Иордан» сохранены. Конструкция разбита на два предложения для ясности, без изменения последовательности событий.
