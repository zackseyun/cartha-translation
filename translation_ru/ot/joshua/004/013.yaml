  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: ru
  text: Около сорока тысяч вооружённых воинов переправились перед Яхве для битвы на равнины Иерихона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Около сорока тысяч вооружённых для войны переправились перед Яхве для битвы на равнины Иерихона».'
    reason: Показывает более буквальную передачу еврейского выражения «вооружённые для войны» и порядок основных словосочетаний.
lexical_decisions:
- source_word: כְּאַרְבָּעִים אֶלֶף
  choice: Около сорока тысяч
  rationale: Префикс כְּ при числительном выражает приблизительность; «около» ясно и естественно передаёт этот оттенок.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: вооружённых воинов
  rationale: Сочетание обозначает людей, снаряжённых и готовых к военным действиям. Перевод сохраняет военный смысл, не уточняя без достаточных оснований, что это был именно передовой отряд.
- source_word: עָבְרוּ
  choice: переправились
  rationale: В контексте Нав 3–4 глагол относится к переходу через Иордан; «переправились» естественно выражает этот подразумеваемый контекст.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии». Формулировка сохраняет пространственно-богословскую многозначность и не сводит её только к движению впереди ковчега.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном, а не заменено титулом.
- source_word: לַמִּלְחָמָה
  choice: готовые к битве
  rationale: Предлог לְ выражает направленность или цель. В русском контексте такая формулировка естественно передаёт назначение вооружённого войска, хотя буквально возможно «для битвы».
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: на равнины Иерихона
  rationale: עַרְבוֹת обозначает равнинную область Иорданской впадины; «равнины Иерихона» понятно современному читателю и не добавляет отсутствующего в тексте «около».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет отличие имени завета от титула «Господь».
- issue: Значение לִפְנֵי יְהוָה
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: «Перед Яхве» сохраняет возможные оттенки нахождения в Божьем присутствии и движения перед символом Его присутствия, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясной, торжественной повествовательной интонацией. Порядок слов слегка перестроен ради естественности; буквальная структура приведена в сноске.
