source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: ru
  text: 'Сыны Израиля сделали так, как повелел Иисус Навин: взяли двенадцать камней из середины Иордана, как Яхве сказал Иисусу Навину, — по числу колен сынов Израиля, — перенесли их с собой к месту ночлега[a] и положили там.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к стоянке»; еврейское слово обозначает место, где останавливаются на ночлег.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт родственное выражение еврейского текста и сохраняет его повтор во фразе о коленах; в современном русском остаётся понятным в библейском повествовании.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: сделали так
  rationale: Естественно передаёт исполнение данного повеления.
- source_word: צִוָּה
  choice: повелел
  rationale: Сохраняет значение властного распоряжения и соответствует возвышенному повествовательному регистру.
- source_word: וַיִּשְׂאוּ
  choice: взяли
  rationale: В контексте камней включает поднятие и последующее несение; дальнейший глагол «перенесли» ясно выражает перемещение.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: из середины Иордана
  rationale: Сохраняет пространственное значение תּוֹךְ и естественно указывает на участок русла реки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: דִּבֶּר ... אֶל יְהוֹשֻׁעַ
  choice: сказал Иисусу Навину
  rationale: Естественная русская передача речи, при этом сохраняющая отличие от более властного «повелел» в первой части стиха.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: по числу колен сынов Израиля
  rationale: Точно передаёт соответствие числа камней числу колен и сохраняет полную родственную формулу оригинала.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: перенесли их с собой
  rationale: Передаёт каузативную форму עבר и идею переноса камней вместе с участниками через Иордан.
- source_word: הַמָּלוֹן
  choice: место ночлега
  rationale: Сохраняет конкретное значение временной стоянки для ночлега, не сводя его к более общему «лагерь».
- source_word: וַיַּנִּחוּם שָׁם
  choice: положили там
  rationale: Прямо и естественно передаёт размещение принесённых камней в указанном месте.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие, не подменяя имя титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис слегка упорядочен двоеточием и тире, чтобы длинная цепочка еврейского повествования оставалась ясной без утраты её смысловых связей.
