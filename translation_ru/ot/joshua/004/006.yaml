  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: ru
  text: 'чтобы это было знаком среди вас. Когда в будущем ваши дети[a] спросят: «Что значат для вас эти камни?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваши сыновья»; здесь имеются в виду дети как следующее поколение.'
    reason: lexical_alternative
  - marker: b
    text: 'Более буквально: «Что для вас эти камни?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּהְיֶה
  choice: чтобы это было
  rationale: Сочетание вводит цель или предполагаемый результат; русская конструкция с «чтобы» естественно передаёт эту силу.
- source_word: אוֹת
  choice: знамением
  rationale: Слово обозначает видимый знак с символическим значением. «Знамение» сохраняет библейское достоинство стиля, не добавляя прямо значения «памятник».
- source_word: בְּקִרְבְּכֶם
  choice: среди вас
  rationale: Фраза указывает на присутствие знака внутри сообщества; «среди вас» ясно и естественно по-русски.
- source_word: כִּי יִשְׁאָלוּן
  choice: когда ... спросят
  rationale: В данном контексте כִּי вводит ожидаемое будущее обстоятельство, а שאל означает обычный вопрос.
- source_word: בְּנֵיכֶם
  choice: ваши дети
  rationale: Буквально «ваши сыновья», но здесь мужская форма представляет следующее поколение в целом; «дети» передаёт контекстуальный референт без необоснованного ограничения.
- source_word: מָחָר
  choice: в будущем
  rationale: Буквально «завтра»; здесь слово идиоматически указывает на последующее время, когда новое поколение станет спрашивать о камнях.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартный еврейский вводитель цитаты естественно передаётся в современном русском пунктуацией, без тяжеловесного «говоря».
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: Что значат для вас эти камни?
  rationale: 'Буквально: «Что [такое] эти камни для вас?» Русская формулировка ясно передаёт вопрос об их значении, сохраняя компонент «для вас».'
theological_decisions:
- issue: Охват выражения בְּנֵיכֶם
  choice: ваши дети
  alternative: ваши сыновья
  rationale: В повествовании речь идёт о передаче памяти следующему поколению, поэтому грамматически мужское существительное употреблено репрезентативно; перевод не вводит ограничения только сыновьями.
- issue: Характер אוֹת
  choice: знамение
  alternative: памятный знак
  rationale: Контекст действительно придаёт камням мемориальную функцию, однако само слово означает «знак/знамение»; эту смысловую широту лучше не сужать внутри стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским словом «знамение». Стих разделён на два предложения ради естественного чтения. Идиома מָחָר передана как «в будущем», а לֵאמֹר — средствами русской пунктуации.
