  text: וְ/צַוּ֣וּ אוֹתָ/ם֮ לֵ/אמֹר֒ שְׂאֽוּ לָ/כֶ֨ם מִ/זֶּ֜ה מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן מִ/מַּצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים הָכִ֖ין שְׁתֵּים עֶשְׂרֵ֣ה אֲבָנִ֑ים וְ/הַעֲבַרְתֶּ֤ם אוֹתָ/ם֙ עִמָּ/כֶ֔ם וְ/הִנַּחְתֶּ֣ם אוֹתָ֔/ם בַּ/מָּל֕וֹן אֲשֶׁר תָּלִ֥ינוּ ב֖/וֹ הַ/לָּֽיְלָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: ru
  text: 'и прикажите им: «Возьмите себе отсюда, из самой середины Иордана, с того места, где ноги священников были твёрдо поставлены[a], двенадцать камней; перенесите их с собой и положите на месте ночлега[b], где вы остановитесь этой ночью».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «с места стояния ног священников, твёрдо поставленных».'
    reason: lexical_alternative
  - marker: b
    text: «Место ночлега» — место, где израильтяне остановятся на ночь после перехода; это не обязательно постоянное поселение.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: и прикажите
  rationale: Пиэль, повелительное наклонение множественного числа от צוה, выражает прямое распоряжение; «прикажите» естественно и достаточно точно передаёт его силу.
- source_word: שְׂאוּ לָכֶם
  choice: возьмите
  rationale: В данном контексте נשׂא обозначает поднятие и взятие камней из русла. Отдельная передача לָכֶם как «для себя» могла бы ошибочно намекнуть на личное владение; личная вовлечённость понятна из формы повеления.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: отсюда, с середины Иордана
  rationale: 'Сохранено двойное указание: камни следует взять именно отсюда, из находящегося посреди Иордана места.'
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: с того места, где твёрдо стояли ноги священников
  rationale: מַצָּב указывает на место или положение стояния, а הָכִין подчёркивает устойчивость; русская конструкция передаёт смысл без тяжеловесной буквальности.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: двенадцать камней
  rationale: Прямое соответствие еврейскому числительному и существительному.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: перенесите их с собой
  rationale: Каузативная форма עבר в контексте означает перенести камни на другую сторону; «с собой» прямо передаёт עִמָּכֶם.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: и положите
  rationale: Хифиль от נוח здесь означает оставить или поместить принесённые камни; «положите» конкретно и естественно для данного предмета.
- source_word: בַּמָּלוֹן
  choice: на месте ночлега
  rationale: מָלוֹן обозначает место остановки на ночь, не обязательно постоянное поселение или специально устроенный лагерь.
- source_word: אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: где вы остановитесь этой ночью
  rationale: Имперфект указывает на предстоящую ночёвку, а הַלָּיְלָה — на эту ночь; формулировка естественна для современного русского языка.
