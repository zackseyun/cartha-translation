  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: ru
  text: 'тогда скажите им: «Воды Иордана были отсечены перед ковчегом завета Яхве. Когда ковчег переходил Иордан, воды Иордана были отсечены». И эти камни будут служить памятным знаком для сынов Израиля[a] навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для детей Израиля»; «для израильтян». Буквально: «для сынов Израиля».'
    reason: Лексическая альтернатива для לִבְנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: были отсечены
  rationale: Страдательная форма глагола כרת буквально передаёт резкое прекращение потока; повтор в еврейском тексте сохранён.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: воды Иордана
  rationale: Сохраняет множественное число и естественно обозначает воды или поток реки.
- source_word: מִפְּנֵי
  choice: перед
  rationale: 'Передаёт пространственное значение: воды остановились перед ковчегом, в его присутствии.'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохраняет полное наименование ковчега и личное имя Бога.
- source_word: בְּעָבְרוֹ
  choice: когда он переходил
  rationale: Суффикс третьего лица мужского рода относится к слову «ковчег», которое и в русском имеет мужской род; неоднозначность между носимым ковчегом и связанным с ним шествием не устраняется пояснением.
- source_word: לְזִכָּרוֹן
  choice: памятным знаком
  rationale: Обозначает долговечный предмет, служащий напоминанием; это естественнее в современном русском, чем отвлечённое «в воспоминание».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Формально сохраняет древнееврейское выражение; более привычные русские соответствия вынесены в примечание.
- source_word: עַד עוֹלָם
  choice: вечным
  rationale: В сочетании с «памятным знаком» естественно передаёт идею непреходящего назначения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога, поэтому используется его распространённая научная транслитерация без замены титулом.
- issue: Передача לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  alternative: для детей Израиля; для израильтян
  rationale: Основной текст сохраняет мужскую форму исходного выражения, а естественные собирательные варианты отмечены в сноске.
- issue: Референт суффикса в בְּעָבְרוֹ
  choice: когда он переходил
  alternative: когда ковчег переходил; при его переходе
  rationale: Местоименная передача сохраняет грамматическую отсылку к ковчегу и не добавляет отсутствующего в исходнике существительного.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический повтор исходника сохранён ради риторического акцента; устаревшие формы и излишняя церковнославянизация исключены.
