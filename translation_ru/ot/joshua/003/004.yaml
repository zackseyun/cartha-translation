base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: ru
  text: Только пусть между вами и ним будет расстояние примерно в две тысячи локтей[a]. Не приближайтесь к нему, чтобы вы знали путь, по которому пойдёте, ведь прежде вы этим путём не проходили[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, приблизительно равная длине предплечья.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «со вчерашнего и позавчерашнего дня» — древнееврейское выражение со значением «прежде, раньше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: Частица вводит ограничивающее уточнение к предыдущему повелению; «только» естественно передаёт эту функцию по-русски.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: пусть между вами и им будет расстояние
  rationale: Сохраняет выраженную в еврейском существовательную конструкцию и соотносит местоимение с ковчегом — существительным мужского рода в русском языке.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: около двух тысяч локтей по мере
  rationale: «Около» передаёт приблизительное значение כְּ; древняя единица сохранена, а בַּמִּדָּה передано формально как «по мере».
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Не приближайтесь к нему
  rationale: Прямое и современное выражение пространственного запрета.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: чтобы вам знать
  rationale: Передаёт цель без добавления не выраженной в источнике модальности.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: путь, по которому вы пойдёте
  rationale: Естественно передаёт образ движения по пути и форму несовершенного вида без усиления до «должны идти».
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: ведь прежде вы этим путём не проходили
  rationale: «Ведь» указывает на основание, а «проходили этим путём» идиоматично передаёт עָבַר с בַּדֶּרֶךְ.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: прежде
  rationale: Это устойчивое выражение буквально отсылает ко вчерашнему и позавчерашнему дню, но в контексте означает «раньше, прежде».
