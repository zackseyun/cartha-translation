reference: Joshua 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: ru
  text: Священники, нёсшие ковчег завета Яхве, твёрдо стояли на суше посреди Иордана[a], а весь Израиль переходил по суше, пока весь народ не закончил переход через Иордан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в русле Иордана».'
    reason: Выражение «посреди Иордана» указывает на внутреннюю часть реки; поскольку вода отступила, по контексту речь идёт об обнажившемся русле.
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... הָכֵן
  choice: твёрдо стояли
  rationale: Глагол עמד в сочетании с הָכֵן передаёт устойчивое, неподвижное положение священников; «твёрдо стояли» естественно выражает этот смысл по-русски.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: священники, нёсшие
  rationale: Причастие обозначает продолжавшееся действие священников во время перехода; форма прошедшего времени согласуется с русским повествованием.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохраняется последовательность еврейской сопряжённой конструкции и личное имя Бога.
- source_word: בֶּחָרָבָה
  choice: на сухом месте / по сухому месту
  rationale: Существительное обозначает осушенное место, прежде покрытое водой. Разные предлоги естественно отражают неподвижное положение священников и движение Израиля.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: посреди Иордана
  rationale: Краткий и естественный русский эквивалент, ясно указывающий на положение внутри русла реки.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: а весь Израиль переходил
  rationale: Причастие выражает одновременное продолжающееся действие; союз «а» естественно сопоставляет неподвижность священников с движением народа.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: пока ... не закончил
  rationale: Оборот обозначает предел продолжавшегося действия и в современном русском естественно передаётся конструкцией «пока не».
- source_word: כָּל הַגּוֹי
  choice: весь народ
  rationale: В данном контексте גוי — собирательное обозначение Израиля. «Весь народ» звучит естественнее, чем «вся нация», не устраняя собирательного смысла.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: переход через Иордан
  rationale: Номинальная конструкция после «закончил» естественна в литературном русском и точно передаёт завершение переправы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Связь слов בְּרִית יְהוָה
  choice: завет Яхве
  alternative: завет с Яхве
  rationale: Сопряжённая конструкция буквально допускает родительную связь без явного указания её вида. Формулировка «завет Яхве» сохраняет эту сжатость и не уточняет сверх текста, является ли это прежде всего заветом, установленным Яхве, или заветом с ним.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан плавным, но сохранены повтор сухого места, одновременность действий и собирательное обозначение Израиля.
