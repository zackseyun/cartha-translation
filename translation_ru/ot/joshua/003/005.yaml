  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: ru
  text: 'И сказал Иисус Навин народу: «Освятитесь, потому что завтра Господь совершит среди вас чудеса».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Освятите себя
  rationale: Возвратная форма повеления передаёт призыв самим подготовить себя как посвящённых Богу; формулировка сохраняет культово-богословский оттенок исходного глагола.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая консультационному тексту и общепринятому библейскому регистру.
- source_word: בְּקִרְבְּכֶם
  choice: среди вас
  rationale: 'Естественно передаёт пространственно-общинный смысл: Господь совершит чудеса в среде народа.'
- source_word: נִפְלָאוֹת
  choice: чудеса
  rationale: Передаёт необычайные, дивные деяния Бога без добавочного истолкования.
- source_word: כִּי
  choice: потому что
  rationale: Сохраняет причинную связь между повелением освятиться и предстоящими деяниями Господа.
theological_decisions:
- issue: Характер освящения народа
  choice: «Освятите себя»
  alternative: «Приготовьтесь» / «очиститесь»
  rationale: Исходный текст прямо использует корень קדש, связанный со святостью и посвящением; более общие варианты ослабили бы богословский смысл, а «очиститесь» неоправданно сузило бы его до ритуального очищения.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским достоинством. Имя יְהוֹשֻׁעַ передано устойчивой русской библейской формой «Иисус Навин», чтобы не смешивать персонажа с Иисусом Христом. Порядок начальной фразы сохраняет повествовательный ритм оригинала.
