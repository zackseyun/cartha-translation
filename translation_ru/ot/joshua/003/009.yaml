  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: ru
  text: 'Иисус Навин сказал сынам Израиля[a]: «Подойдите сюда и выслушайте слова Яхве, вашего Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детям Израиля»; или: «израильтянам». Буквально по-еврейски: «сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר, вводящая прямую речь; «сказал» естественно и точно передаёт её функцию.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся русская библейская форма имени, позволяющая отличить этого персонажа от Иисуса Христа.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально передаёт еврейское выражение «сыны Израиля» и сохраняет его мужскую форму; возможное идиоматическое значение — «израильтянам».
- source_word: גֹּשׁוּ הֵנָּה
  choice: Подойдите сюда
  rationale: Передаёт призыв приблизиться к говорящему; по-русски это естественнее буквального «приблизьтесь сюда».
- source_word: וְשִׁמְעוּ
  choice: и выслушайте
  rationale: В данном призыве שׁמע означает внимательное слушание. «Выслушайте» естественно выражает направленное внимание к следующим словам.
- source_word: אֵת דִּבְרֵי
  choice: слова
  rationale: Сохраняет конкретное множественное число דִּבְרֵי и не заменяет его более толковательным словом «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога, представленного тетраграмматоном, без замены его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Суффикс второго лица множественного числа передан притяжательной конструкцией; אֱלֹהִים здесь обозначает единого Бога Израиля и поэтому переводится в единственном числе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет имя, тогда как «Господь» заменяет его титулом; «Иегова» отражает более позднюю гибридную форму чтения.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; израильтянам
  rationale: Основной текст сохраняет буквальную мужскую форму традиционного этнического обозначения, а сноска указывает более идиоматичные варианты без сужения или расширения референции.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Форма «Иисус Навин» следует устойчивой русской традиции; «сынам Израиля» сохраняет структуру оригинала, а сноска даёт естественные коллективные соответствия.
