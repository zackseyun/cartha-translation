  text: Вот ковчег завета Владыки всей земли переходит Иордан впереди вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Иордане». Еврейский предлог может указывать на местонахождение; в данном контексте при глаголе «переходит» он также допускает передачу «через Иордан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к происходящему; «вот» естественно и выразительно звучит в современном русском библейском повествовании.
- source_word: אֲרוֹן הַבְּרִית
  choice: ковчег завета
  rationale: Прямо передаёт сочетание существительных и сохраняет общепринятое библейское обозначение священного ковчега.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Владыки всей земли
  rationale: В данном контексте титул выражает верховную власть Бога. «Владыка» сохраняет торжественный регистр и в форме родительного падежа естественно связывается с «ковчегом завета».
- source_word: עֹבֵר
  choice: идёт
  rationale: Причастие изображает действие как совершающееся или непосредственно предстоящее. В сочетании с «впереди вас» глагол «идёт» звучит естественнее буквального «переходит», поскольку народ ещё приближается к реке.
- source_word: לִפְנֵיכֶם
  choice: впереди вас
  rationale: Передаёт пространственное значение и подчёркивает, что ковчег движется перед народом.
- source_word: בַּיַּרְדֵּן
  choice: в Иордан
  rationale: Хотя предлог формально может обозначать местонахождение «в Иордане», при глаголе движения контекст допускает направительное понимание — вступление в реку.
theological_decisions:
- issue: Связь титула אֲדוֹן כָּל הָאָרֶץ с выражением «ковчег завета»
  choice: ковчег завета Владыки всей земли
  alternative: ковчег завета — Владыка всей земли
  rationale: По смыслу повествования титул обозначает Бога, которому принадлежит ковчег завета; он не отождествляет сам ковчег с Владыкой. Родительный оборот ясно передаёт эту связь, не добавляя иных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов сохраняет внимание на ковчеге и его движении впереди народа.
