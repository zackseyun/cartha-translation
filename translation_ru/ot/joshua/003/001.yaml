base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: ru
  text: Иисус Навин встал рано утром, и они выступили из Ситтима. Он и все сыны Израиля[a] пришли к Иордану и переночевали там, прежде чем переправиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все израильтяне».'
    reason: 'Лексическая альтернатива: более идиоматичное русское обозначение народа Израиля в целом.'
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: встал рано утром
  rationale: Передаёт обычное значение породы hифиль глагола שׁכם и временное уточнение בַּבֹּקֶר естественным современным русским выражением.
- source_word: וַיִּסְעוּ
  choice: они выступили
  rationale: В повествовании о пути נסע часто обозначает снятие с места и начало перехода; «выступили» кратко и естественно передаёт это значение.
- source_word: מֵהַשִּׁטִּים
  choice: из Ситтима
  rationale: Топоним транслитерирован, а не переведён как указание на акации; форма «Ситтим» сохраняет узнаваемое библейское название, а падеж оформлен по нормам русского языка.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: пришли к Иордану
  rationale: Конструкция обозначает достижение реки; «пришли к Иордану» естественно передаёт как движение, так и предел пути.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: он и все сыны Израиля
  rationale: Сохранены возобновляющее подлежащее местоимение הוּא и формальный образ родственно-национального выражения בְּנֵי יִשְׂרָאֵל. Более идиоматичный коллективный вариант указан в сноске.
- source_word: וַיָּלִנוּ שָׁם
  choice: переночевали там
  rationale: Глагол לון здесь означает провести ночь; «переночевали» ясно и компактно передаёт смысл.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: прежде чем переправиться
  rationale: טֶרֶם выражает предшествование, а עבר в непосредственном контексте Иордана означает переправу. Возвратный глагол естественен по-русски и не добавляет способа переправы.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использовано традиционное и общепонятное русское именование библейского Иисуса Навина, позволяющее избежать смешения с Иисусом Христом.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формулировка «сыны Израиля» сохраняет мужскую форму и родственный образ древнееврейского национального обозначения, не сужая его референт только до взрослых мужчин. Идиоматичный русский эквивалент дан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Традиционные имена и топонимы сохранены; синтаксис разделён на два предложения ради ясности без изменения последовательности событий.
