  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: ru
  text: 'А ты прикажи священникам, несущим ковчег завета: «Когда подойдёте к краю вод Иордана[a], остановитесь в Иордане».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к самой кромке вод Иордана».'
    reason: Лексема קָצֶה может обозначать край, границу или самую кромку воды.
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Союз продолжает повествование, а самостоятельное местоимение подчёркивает, что повеление обращено именно к Иисусу Навину.
- source_word: תְּצַוֶּה
  choice: прикажи
  rationale: Форма выражает поручение Иисусу Навину отдать распоряжение; русский императив естественно передаёт директивную силу.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: священникам, несущим
  rationale: Причастный оборот точно и естественно передаёт определительное причастие при слове «священники».
- source_word: אֲרוֹן הַבְּרִית
  choice: ковчег завета
  rationale: Устоявшееся и точное соответствие еврейской сочетательной конструкции, сохраняющее значение завета.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Специальное соответствие слову «говоря» в русском избыточно; функция вводной формулы естественно передаётся оформлением прямой речи.
- source_word: כְּבֹאֲכֶם
  choice: Когда подойдёте
  rationale: Временная конструкция описывает достижение указанного места; «подойдёте» естественно сочетается с последующим «к краю».
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: к краю вод Иордана
  rationale: Передаёт достижение предела или края воды, сохраняя образ множественного «воды Иордана».
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  choice: остановитесь в Иордане
  rationale: Глагол עמד здесь означает занять положение и оставаться на месте; «остановитесь» яснее русского «стойте» передаёт требуемое действие, а местное значение предлога сохранено.
