  source_fidelity: 'Текст точно передаёт обращённое к Иисусу Навину повеление, священников как носителей ковчега завета, достижение края вод Иордана и приказ остановиться/занять место в Иордане. Русское «остановитесь в Иордане» в данном контексте адекватно передаёт תעמדוּ: священники должны остановиться и оставаться в реке.'
