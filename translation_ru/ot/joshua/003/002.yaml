source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קְצֵ֖ה שְׁלֹ֣שֶׁת יָמִ֑ים וַ/יַּעַבְר֥וּ הַ/שֹּׁטְרִ֖ים בְּ/קֶ֥רֶב הַֽ/מַּחֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/002.yaml
  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: ru
  text: По прошествии трёх дней распорядители прошли по стану[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошли через стан».'
    reason: Лексически допустимый вариант передачи сочетания глагола עבר с выражением בְּקֶרֶב; основной текст подчёркивает движение внутри стана, вариант — прохождение через него.
lexical_decisions:
- source_word: וַיְהִי
  choice: По прошествии…
  rationale: Повествовательная форма служит переходом к следующему событию; в современном русском отдельная формула «и было» здесь не требуется.
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: По прошествии трёх дней
  rationale: Передаёт временную границу — завершение трёхдневного периода — естественным современным русским выражением.
- source_word: וַיַּעַבְרוּ
  choice: прошли
  rationale: Глагол обозначает движение через пространство; контекст не предполагает здесь переправы через рубеж или реку.
- source_word: הַשֹּׁטְרִים
  choice: распорядители
  rationale: Речь идёт о назначенных представителях, передающих распоряжения и следящих за их исполнением; «распорядители» ясно передаёт эту функцию без современных военных коннотаций слова «офицеры».
- source_word: בְּקֶרֶב הַמַּחֲנֶה
  choice: по стану
  rationale: В сочетании с глаголом движения выражение указывает на передвижение внутри стана, среди расположившегося там народа. «Стан» сохраняет достойный повествовательный регистр и остаётся понятным.
theological_decisions: []
