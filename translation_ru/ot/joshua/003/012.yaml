translation:
  language: ru
  text: Итак, возьмите себе двенадцать человек из племён Израиля — по одному человеку от каждого племени.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один человек, один человек для племени»; повтор является распределительным выражением и означает одного представителя от каждого племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к следующему повелению в последовательности речи; в современном русском здесь звучит естественнее буквального «и теперь».
- source_word: קְחוּ לָכֶם
  choice: возьмите себе
  rationale: Сохраняет значение повелительного наклонения לקח и оттенок заинтересованности адресатов, выраженный לָכֶם; в данном контексте речь идёт об отборе представителей.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: двенадцать человек
  rationale: Русское «человек» после числительного естественно и обозначает здесь мужчин, избираемых представителями племён.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: из племён Израиля
  rationale: Прямо и естественно передаёт происхождение выбираемых людей из племён Израиля.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: по одному человеку от каждого племени
  rationale: Передаёт распределительное значение повторения «один человек, один человек» и смысл представительства каждого племени.
