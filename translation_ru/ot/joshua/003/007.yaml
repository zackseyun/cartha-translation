source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: ru
  text: 'И сказал Яхве Иисусу Навину: «Сегодня Я начну возвеличивать тебя в глазах всего Израиля[a], чтобы они узнали: как Я был с Моисеем, так буду и с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвышать тебя перед всем Израилем».'
    reason: Лексико-идиоматический вариант передачи גַּדֶּלְךָ בְּעֵינֵי כָּל יִשְׂרָאֵל.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое именование Бога в еврейском тексте и не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная и естественная передача повествовательной формы глагола אמר.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественный современный эквивалент буквального выражения «в этот день», сохраняющий временной акцент.
- source_word: אָחֵל
  choice: начну
  rationale: В данной конструкции глагол выражает начало действия; форма первого лица уместно передаётся будущим временем.
- source_word: גַּדֶּלְךָ
  choice: возвеличивать тебя
  rationale: Порода piel глагола גדל означает сделать великим, возвысить чей-либо статус; «возвеличивать» сохраняет каузативный и публичный оттенок.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: в глазах всего Израиля
  rationale: Сохранён прозрачный и понятный по-русски образ общественного восприятия и признания.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: чтобы они узнали
  rationale: Передаёт целевой или результативный смысл придаточного, не устраняя допустимую смысловую близость цели и результата.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה אֶהְיֶה עִמָּךְ
  choice: как Я был с Моисеем, так буду и с тобой
  rationale: Русская парная конструкция «как… так…» ясно воспроизводит сопоставление и обещание Божьего присутствия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Форма «Яхве» сохраняет его как имя и отражает принятую научную реконструкцию произношения, не подменяя имя титулом.
- issue: Смысл возвеличивания Иисуса Навина
  choice: возвеличивать тебя в глазах всего Израиля
  alternative: возвысить тебя перед всем Израилем
  rationale: Формулировка передаёт публичное утверждение авторитета Иисуса Навина, не уточняя сверх текста, каким именно образом или до какой степени он будет возвеличен.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; образ «в глазах всего Израиля» сохранён как естественный русский библейский идиом.
