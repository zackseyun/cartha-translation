source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: ru
  text: 'Они повелели народу: «Когда вы увидите ковчег завета Яхве, вашего Бога, и священников-левитов[a], несущих его, трогайтесь со своего места и следуйте за ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священников, левитов».'
    reason: Еврейское הַכֹּהֲנִים הַלְוִיִּם допускает как определительное понимание «священники-левиты», так и аппозиционное «священники, левиты».
lexical_decisions:
- source_word: וַיְצַוּוּ אֶת־הָעָם לֵאמֹר
  choice: Они повелели народу
  rationale: Глагол צוה в породе пиэль выражает властное повеление. В русском двоеточие естественно вводит прямую речь и позволяет не воспроизводить формульное לֵאמֹר отдельным словом «говоря».
- source_word: כִּרְאוֹתְכֶם
  choice: Когда вы увидите
  rationale: Конструкция с инфинитивом имеет временное значение; перевод не добавляет отсутствующего в тексте оттенка немедленности.
- source_word: אֲרוֹן בְּרִית
  choice: ковчег завета
  rationale: Это точное и прочно укоренившееся русское обозначение священного ковчега.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, вашего Бога
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а приложение «вашего Бога» сохраняет заветную формулу исходного текста.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священников-левитов
  rationale: Такой перевод естественно обозначает священников как левитов и не создаёт впечатления двух отдельных групп; возможная аппозиционная трактовка сохранена в сноске.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: несущих его
  rationale: Причастный оборот точно передаёт действие נשא и ясно соотносит местоимение с ковчегом.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: трогайтесь со своего места
  rationale: נסע означает отправляться в путь; формулировка сохраняет упоминание места, не добавляя более конкретного «снимайтесь с лагеря».
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: и следуйте за ним
  rationale: הלך אחרי в данном пространственном контексте естественно передаётся русским «следовать за».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Связь слов הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  alternative: священники, левиты
  rationale: Дефисная конструкция ясно представляет одну группу, сохраняя при этом реальную возможность прочитать еврейское сочетание как приложение, указанную в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис прямой и понятный; традиционный библейский термин «ковчег завета» сохранён, тогда как архаичные обороты вроде «говоря» и «идите вслед него» устранены.
