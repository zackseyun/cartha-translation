  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: ru
  text: 'И сказал Иисус Навин: «По этому вы узнаете, что среди вас — живой Бог и что Он непременно прогонит с вашего пути хананеев, хеттов, хиввеев, ферезеев, гергесеев, амореев и иевусеев[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно лишит их владения». Еврейский глагол подчёркивает несомненное удаление этих народов с их земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ
  choice: И сказал Иисус Навин
  rationale: Стандартная повествовательная формула; союз «и» сохраняет течение еврейского рассказа, а традиционная русская форма имени ясно обозначает Иисуса Навина.
- source_word: בְּזֹאת
  choice: По этому
  rationale: Передаёт указание на последующее знамение как основание, по которому народ узнает о Божьем присутствии и действии.
- source_word: תֵּדְעוּן
  choice: вы узнаете
  rationale: Имперфект во 2-м лице множественного числа имеет здесь будущее значение; «узнаете» естественно передаёт приобретение уверенного знания по знамению.
- source_word: אֵל חַי
  choice: живой Бог
  rationale: 'Сохраняет качественное и контрастное значение выражения: Бог действительно жив и действует, в отличие от бессильных божеств.'
- source_word: בְּקִרְבְּכֶם
  choice: среди вас
  rationale: Ясно обозначает присутствие Бога посреди народа и не создаёт ошибочного впечатления о внутреннем пребывании в отдельных людях.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: Он непременно прогонит
  rationale: Сочетание инфинитива абсолютного с личной формой того же глагола подчёркивает несомненность действия; «непременно» передаёт усиление, а «прогонит» — решительное удаление народов.
- source_word: מִפְּנֵיכֶם
  choice: от вас
  rationale: Естественная современная русская передача удаления народов с пути и из присутствия Израиля; буквальное «от лица вашего» было бы архаичным.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: хананеев, хеттов, хиввеев, ферезеев, гергесеев, амореев и иевусеев
  rationale: Еврейские формы грамматически единственного числа имеют собирательное значение; русские множественные этнонимы естественно передают перечень народов.
theological_decisions:
- issue: Передача אֵל חַי без внесения отсутствующего в стихе имени יהוה
  choice: живой Бог
  alternative: живой Сильный
  rationale: В тексте стоит אֵל, а не тетраграмматон. Обычная передача «Бог» сохраняет утверждение о Его живом и действенном присутствии, не подменяя употреблённое обозначение заветным именем.
- issue: Передача глагола завоевания без смягчения его смысла
  choice: Он непременно прогонит
  alternative: Он непременно лишит владения
  rationale: Еврейская конструкция выражает решительное и несомненное удаление перечисленных народов. Основной вариант естественен по-русски, а сноска сохраняет земельно-правовой оттенок возможной передачи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому, но избегает искусственных оборотов вроде «от лица вашего». Этнонимы даны в привычных русских библейских формах.
