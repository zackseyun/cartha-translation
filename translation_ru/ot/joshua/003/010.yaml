    rationale: Передача понятна, но менее точно сохраняет образ удаления народов перед Израилем. «С вашего пути» естественно выражает направление действия без архаизма «от лица вашего».
  - severity: low
    issue: Не вполне явный объект в сноске «лишит владения»
    rationale: Русский глагол «лишить» обычно требует явно выраженного дополнения; «лишит их владения» яснее и сохраняет альтернативу «dispossess».
