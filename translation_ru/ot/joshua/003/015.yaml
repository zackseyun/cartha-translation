  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/כְ/ב֞וֹא נֹשְׂאֵ֤י הָֽ/אָרוֹן֙ עַד הַ/יַּרְדֵּ֔ן וְ/רַגְלֵ֤י הַ/כֹּֽהֲנִים֙ נֹשְׂאֵ֣י הָֽ/אָר֔וֹן נִטְבְּל֖וּ בִּ/קְצֵ֣ה הַ/מָּ֑יִם וְ/הַ/יַּרְדֵּ֗ן מָלֵא֙ עַל כָּל גְּדוֹתָ֔י/ו כֹּ֖ל יְמֵ֥י קָצִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: ru
  text: Когда несущие ковчег подошли к Иордану и ноги священников, несущих ковчег, погрузились у края воды[a] (а Иордан во все дни жатвы выходил из берегов[b]),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на краю воды»; ноги священников вошли в воду у самой её кромки.'
    reason: lexical_alternative
  - marker: b
    text: То есть во время жатвы Иордан был в разливе.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבֹוא
  choice: Когда ... подошли
  rationale: Сочетание союза, временного предлога и инфинитива вводит придаточное времени; «когда» естественно передаёт последовательность событий, а «подошли» — достижение реки.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: несущие ковчег
  rationale: Причастие обозначает людей, которые несли ковчег; повтор сохранён и применительно к священникам, как в еврейском тексте.
- source_word: עַד הַיַּרְדֵּן
  choice: подошли к Иордану
  rationale: עַד указывает на достижение предела движения. Русская формулировка естественно передаёт прибытие к реке, не утверждая, что носильщики уже пересекли её.
- source_word: נִטְבְּלוּ
  choice: погрузились
  rationale: Нифаль глагола טבל означает погружение или обмакивание; применительно к ногам «погрузились» точнее слабого «коснулись» и не требует полного погружения.
- source_word: בִּקְצֵה הַמָּיִם
  choice: у края воды
  rationale: Буквально выражение указывает на край или оконечность воды; в сочетании с «погрузились» ясно, что ноги вошли в воду у самой кромки.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: а Иордан ... выходил из берегов
  rationale: В контексте разлива идиома естественно передаёт реку, полную сверх своих берегов. Скобки сохраняют пояснительный характер фразы.
- source_word: כֹּל יְמֵי קָצִיר
  choice: во все дни жатвы
  rationale: Формулировка близко сохраняет временной оборот оригинала и остаётся понятной в современном литературном русском.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Повтор «несущие ковчег» сохранён вслед за еврейским текстом; предложение намеренно остаётся незавершённым, поскольку стих образует временную часть синтаксической конструкции, продолжающейся в следующем стихе.
