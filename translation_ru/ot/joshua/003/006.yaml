base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: ru
  text: 'Тогда Иисус Навин сказал священникам: «Поднимите ковчег завета и переходите впереди народа». Они подняли ковчег завета и пошли впереди народа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма с последовательным waw продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся русская библейская форма имени Иехошуа; добавление «Навин» позволяет обычному читателю безошибочно отличить этого героя от Иисуса Христа.
- source_word: הַכֹּהֲנִים
  choice: священникам
  rationale: Прямой и общепонятный эквивалент определённого существительного во множественном числе.
- source_word: שְׂאוּ
  choice: Поднимите
  rationale: Глагол נשׂא здесь обозначает поднятие ковчега для последующего несения. «Поднимите» сохраняет конкретность действия, не сводя его лишь к длительному несению.
- source_word: אֲרוֹן הַבְּרִית
  choice: ковчег завета
  rationale: Традиционная, прозрачная и точная передача сочетания, обозначающего священный ковчег, связанный с заветом.
- source_word: וְעִבְרוּ
  choice: и переходите
  rationale: עבר означает переход или пересечение. В контексте перехода через Иордан русское «переходите» сохраняет эту смысловую связь, не добавляя отсутствующего здесь прямого дополнения «Иордан».
- source_word: לִפְנֵי הָעָם
  choice: впереди народа
  rationale: 'Естественно передаёт пространственное значение לִפְנֵי: священники должны двигаться перед народом, возглавляя шествие.'
- source_word: וַיִּשְׂאוּ
  choice: Они подняли
  rationale: Повтор того же русского глагола, что и в повелении, сохраняет словесную связь между приказом и его исполнением.
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Естественный повествовательный эквивалент обычного глагола движения הלך.
theological_decisions:
- issue: Передача терминологии завета в священном контексте
  choice: ковчег завета
  alternative: ковчег Завета
  rationale: Строчная буква сохраняет значение нарицательного богословского термина и не превращает его без необходимости в собственное имя; выражение точно передаёт еврейскую конструкцию без дополнительного истолкования.
- issue: Направление движения священников относительно народа
  choice: переходите впереди народа
  alternative: идите впереди народа
  rationale: Выбранный вариант удерживает и значение пересечения в עבר, важное в контексте перехода через Иордан, и указанное текстом положение священников перед народом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и доступен; традиционные выражения «Иисус Навин» и «ковчег завета» сохранены ради узнаваемости и точности.
