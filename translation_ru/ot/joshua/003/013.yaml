  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: ru
  text: И когда стопы священников, несущих ковчег Яхве — Владыки всей земли, — опустятся в воды Иордана, воды Иордана, текущие сверху, будут отсечены и встанут единым валом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: И когда… коснутся
  rationale: Оборот вводит будущее обстоятельство; נוח буквально указывает на опускание или остановку, а в данном контексте естественно передаётся как соприкосновение стоп с водой.
- source_word: כַּפּוֹת רַגְלֵי
  choice: стопы
  rationale: כף в сочетании с רגל обозначает нижнюю поверхность ступни; русское «стопы» точно и не создаёт тяжеловесного выражения «подошвы ног».
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: священников, несущих ковчег
  rationale: Причастие נשׂא прямо описывает священников как носителей ковчега.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Владыки всей земли
  rationale: «Владыка» естественно передаёт титул אדון и отличает его от личного имени Яхве.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: вод Иордана
  rationale: Предлог ב здесь описывает соприкосновение стоп с водами реки.
- source_word: יִכָּרֵתוּן
  choice: будут отсечены
  rationale: Нифаль глагола כרת передаёт прекращение потока через яркий образ отсечения.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: воды Иордана, текущие сверху
  rationale: Сохраняется буквальный образ вод, спускающихся «сверху»; контекстуальное значение «с верховья» отмечено в сноске.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: и встанут одной стеной
  rationale: נֵד обозначает вставшую, нагромождённую массу воды; «стеной» даёт понятный по контексту образ, не устраняя идею единой массы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация сохраняет различие между именем и следующим титулом אדון.
- issue: Синтаксическая связь אֲדוֹן כָּל הָאָרֶץ
  choice: 'Приложение к имени Яхве: «Яхве, Владыки всей земли»'
  alternative: «ковчег Владыки всей земли»
  rationale: Основной текст понимает титул как приложение, называющее Яхве Владыкой всей земли, но еврейская последовательность допускает более тесную связь титула со словом «ковчег»; неоднозначность отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Сохранены повтор «воды Иордана» и образ чудесно остановившейся воды; неоднозначная связь титула вынесена в сноску.
