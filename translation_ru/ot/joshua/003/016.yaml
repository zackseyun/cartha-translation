  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: ru
  text: Воды, текущие сверху, остановились[a] и поднялись единым валом очень далеко, у Адама, города близ Цартана. А воды, текущие к морю Аравы, Солёному морю[b], полностью иссякли, были отсечены, и народ перешёл напротив Иерихона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встали». Древнееврейский образ показывает, как воды остановились и собрались в единый поднявшийся вал.'
    reason: lexical_alternative
  - marker: b
    text: Солёное море — водоём, позднее получивший широко известное название Мёртвое море.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: остановились
  rationale: Глагол עמד буквально описывает стояние, а в данном контексте — прекращение обычного течения реки; «остановились» естественно передаёт контекстуальный смысл.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: воды, текущие сверху
  rationale: Причастие с מִלְמַעְלָה обозначает воды, спускающиеся с более высокой стороны, то есть выше по течению; формулировка сохраняет пространственный образ оригинала.
- source_word: קָמוּ נֵד אֶחָד
  choice: поднялись единой громадой
  rationale: Сочетание קום и נֵד изображает воду, поднявшуюся и собравшуюся в одну массивную преграду. «Единой громадой» сохраняет конкретный образ, не уточняя без достаточного основания её форму как стену или вал.
- source_word: הַרְחֵק מְאֹד
  choice: далеко-далеко
  rationale: Повторная разговорно-литературная форма естественно передаёт усиленное указание на весьма большое расстояние.
- source_word: בְאָדָם הָעִיר
  choice: у города Адама
  rationale: אָדָם здесь является названием города, а предлог בְ обозначает место, где воды собрались.
- source_word: אֲשֶׁר מִצַּד צָרְתָן
  choice: находящегося рядом с Цартаном
  rationale: מִצַּד выражает близость или соседнее положение; русская формулировка ясно связывает определение с городом Адамом.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: А воды, текущие к морю Аравы
  rationale: Повторное причастие обозначает воды ниже по течению, а עַל при названии водоёма имеет здесь направительное значение.
- source_word: יָם הַמֶּלַח
  choice: Солёному морю
  rationale: Сохранено прямое древнееврейское название водоёма, известного позднее как Мёртвое море.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: были полностью отсечены
  rationale: Два глагола вместе усиливают представление о полном прекращении нижнего потока; «полностью отсечены» кратко и естественно передаёт их совокупную силу.
- source_word: וְהָעָם עָבְרוּ
  choice: и народ перешёл
  rationale: В повествовательном контексте עבר означает переход через Иордан; дополнение восстанавливается из ближайшего контекста главы.
- source_word: נֶגֶד יְרִיחוֹ
  choice: напротив Иерихона
  rationale: נֶגֶד обозначает положение прямо перед или напротив указанного места.
