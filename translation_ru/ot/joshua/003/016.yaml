  source_fidelity: 'Смысловой ход и географические указания переданы верно: верхние воды останавливаются и поднимаются, нижние воды, направлявшиеся к морю Аравы (Солёному морю), полностью прекращаются, а народ переходит напротив Иерихона. Однако «далеко-далеко» имеет разговорный оттенок, а «единой громадой» менее точно и менее естественно передаёт конкретный образ נֵד — единого водного вала/нагромождения.'
  naturalness: Текст в целом понятен, но для современного литературного русского предпочтительны «очень далеко» вместо разговорного «далеко-далеко» и более ясное «единым валом» вместо «единой громадой». Оборот «у Адама, города близ Цартана» естественно поясняет, что Адам — название города.
  terminology: Названия «Адам», «Цартан», «море Аравы» и «Солёное море» сохранены. «Солёное море» обоснованно оставлено в основном тексте, а его отождествление с позднейшим названием дано в сноске. Богословски нагруженных терминов в стихе нет.
