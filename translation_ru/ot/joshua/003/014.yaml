  source_fidelity: 'Основной смысл передан верно: народ отправляется от шатров, чтобы перейти Иордан; священники, несущие ковчег завета, находятся перед народом. Однако «шли впереди» несколько конкретизирует еврейскую именную конструкцию, которая прямо обозначает их положение «перед народом», а не обязательно отдельно выраженное действие движения.'
