  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: ru
  text: И вот, когда народ выступил из своих шатров, чтобы перейти Иордан, священники, несущие ковчег завета, были впереди народа[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед народом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было так
  rationale: Еврейская повествовательная формула вводит новое событие; этот вариант сохраняет её функцию и торжественный тон, не прибегая к архаичному «и случилось».
- source_word: בִּנְסֹעַ הָעָם
  choice: когда народ выступил
  rationale: Предлог ב с инфинитивом выражает временное обстоятельство, а נסע здесь означает сняться с места и отправиться в путь.
- source_word: מֵאָהֳלֵיהֶם
  choice: из своих шатров
  rationale: Сохраняется конкретное значение אהל — «шатёр»; местоимение «своих» естественно передаёт принадлежность шатров народу.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: чтобы перейти Иордан
  rationale: Инфинитив выражает цель; «перейти Иордан» — естественное русское обозначение переправы через реку.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: священники, несущие
  rationale: Причастный оборот прямо передаёт еврейскую именную конструкцию «священники — носители» без лишнего перефразирования.
- source_word: הָאָרוֹן הַבְּרִית
  choice: ковчег завета
  rationale: Устоявшееся и точное библейское соответствие, сохраняющее культовый и богословский смысл выражения.
- source_word: לִפְנֵי הָעָם
  choice: впереди народа
  rationale: Передаёт пространственное положение священников перед движущимся народом; возможный более буквальный вариант отмечен в сноске.
