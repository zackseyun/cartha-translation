  text: the king of Shimron-meron[a], one; the king of Achshaph, one.
translation:
  language: ru
  text: царь Шимрон-Мерона[a] — один; царь Ахшафа — один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также понимание как двух отдельных названий: «Шимрон» и «Мерон». Однако здесь еврейское сочетание обычно принимают за составное название «Шимрон-Мерон», что согласуется с указанным в стихе числом — два царя.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: В формуле перечня מֶלֶךְ обозначает правителя города-государства; русская конструкция с родительным падежом естественно передаёт «царь такого-то места».
- source_word: שִׁמְרוֹן מְראוֹן
  choice: Шимрон-Мерон
  rationale: 'Масоретское чтение и структура стиха позволяют понимать сочетание как составное географическое название. В конструкции после слова «царь» название поставлено в родительный падеж: «Шимрон-Мерона».'
- source_word: אֶחָד
  choice: один
  rationale: Числительное эллиптически подводит счёт каждому царю и сохраняет повторяющийся ритм перечня.
- source_word: אַכְשָׁף
  choice: Ахшаф
  rationale: Географическое название передано транслитерацией, с формой родительного падежа «Ахшафа» после слова «царь».
