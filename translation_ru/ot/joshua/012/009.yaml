  text: царь Иерихона — один; царь Гая, что рядом с Вефилем, — один.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Обычное русское соответствие существительному со значением правителя; форма без отдельного артикля естественна для перечня побеждённых царей.
- source_word: יְרִיחוֹ
  choice: Иерихон
  rationale: Устоявшаяся русская форма географического названия.
- source_word: אֶחָד
  choice: один
  rationale: В повторяющейся счётной формуле главы слово подводит итог по каждой позиции перечня. Сохранена лаконичная форма оригинала без добавления слова «царь».
- source_word: הָעַי
  choice: Гай
  rationale: Устоявшаяся русская библейская форма названия города; еврейский определённый артикль отдельно не передаётся.
- source_word: אֲשֶׁר
  choice: что
  rationale: Естественно вводит в современном русском языке определительное придаточное, относящееся к названию города.
- source_word: מִצַּד
  choice: рядом с
  rationale: Передаёт пространственное значение близости к Вефилю естественным современным выражением.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Устоявшаяся русская форма географического названия.
