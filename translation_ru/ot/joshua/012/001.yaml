  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: ru
  text: Вот цари земли, которых разбили сыны Израиля[a] и землёй которых они овладели за Иорданом, к востоку[b], от потока Арнон[c] до горы Хермон и всю Араву[d] на востоке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к восходу солнца», то есть к востоку.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может обозначать сезонный поток, а также его русло или долину.
    reason: cultural_note
  - marker: d
    text: 'Или: «всю равнину». Арава — название области Иорданской рифтовой долины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит новый перечень и передаёт указательное значение אֵלֶּה без добавления временного «теперь».
- source_word: מַלְכֵי הָאָרֶץ
  choice: цари той земли
  rationale: Сохраняет конструкцию оригинала; указательное «той» естественно связывает землю с последующим географическим описанием.
- source_word: אֲשֶׁר הִכּוּ
  choice: которых разбили
  rationale: В военном контексте נכה означает нанесение поражения; «разбили» передаёт это, не утверждая непременно личную гибель каждого царя.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт еврейское выражение и сохраняет традиционную библейскую формулу; в сноске дан естественный современный эквивалент.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: и землёй которых они овладели
  rationale: В контексте завоевания ירשׁ обозначает вступление во владение; перестройка относительной конструкции естественна по-русски.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Краткое и традиционное русское обозначение территории по другую сторону Иордана; следующий оборот уточняет восточную сторону.
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  choice: к востоку
  rationale: Передаёт идиоматическое значение буквального выражения «к восходу солнца»; образ оригинала отмечен в сноске.
- source_word: מִנַּחַל אַרְנוֹן
  choice: от потока Арнон
  rationale: נחל может обозначать сезонный поток и его русло-долину; «поток» понятно современному читателю, а географическая специфика пояснена в сноске.
- source_word: עַד הַר חֶרְמוֹן
  choice: до горы Ермон
  rationale: Прямо и естественно обозначает предел территории.
- source_word: וְכָל הָעֲרָבָה
  choice: включая всю Араву
  rationale: «Включая» ясно присоединяет названную область к территориальному охвату; «Арава» сохраняет специальное географическое название.
- source_word: מִזְרָחָה
  choice: на востоке
  rationale: Естественно по-русски определяет восточную часть Аравы в заключительном географическом уточнении.
