  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: ru
  text: И вот цари той земли, которых поразили Иисус Навин и сыны Израиля за Иорданом, к западу[a], от Баал-Гада в долине Ливана до горы Халак, поднимающейся к Сеиру[b]; Иисус Навин отдал эту землю коленам Израиля в наследие, по их уделам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за Иорданом, к морю», то есть к западу.'
    reason: Лексема יָמָּה буквально указывает в сторону моря и в данном географическом контексте означает запад.
  - marker: b
    text: 'Или: «ведущей вверх к Сеиру».'
    reason: Причастие הָעֹלֶה может описывать как подъём рельефа, так и направление пути к Сеиру.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сохраняет связь с предыдущим изложением и естественно вводит следующий перечень.
- source_word: מַלְכֵי הָאָרֶץ
  choice: цари той земли
  rationale: Передаёт территориальный смысл הָאָרֶץ без ассоциации с современным государством.
- source_word: אֲשֶׁר הִכָּה
  choice: которых поразили
  rationale: Глагол נכה в контексте завоевания означает нанесение поражения, часто со смертельным исходом; «поразили» сохраняет силу выражения.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: и сыны Израиля
  rationale: Формально передаёт еврейское выражение и сохраняет его традиционно-библейский, но понятный современному читателю облик.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: за Иорданом, к западу
  rationale: Передаёт как относительное местоположение, так и направление יָמָּה; запятая делает географическую формулу ясной по-русски.
- source_word: מִבַּעַל גָּד
  choice: от Баал-Гада
  rationale: Топоним транслитерирован и поставлен в требуемый русской грамматикой родительный падеж.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: в долине Ливана
  rationale: בִּקְעָה обозначает широкую долину или равнину; «долина» естественно и не чрезмерно уточняет рельеф.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: до горы Халак
  rationale: В контексте выражение понято как географическое название; транслитерация не подменяет топоним описательным переводом «гладкая гора».
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: поднимающейся к Сеиру
  rationale: Сохраняет причастную конструкцию и возможный топографически-направительный смысл, не утверждая, что гора непосредственно достигает Сеира.
- source_word: וַיִּתְּנָהּ
  choice: Иисус Навин отдал эту землю
  rationale: Женский суффикс относится к земле; явное повторение имени устраняет двусмысленность, а «эту землю» естественнее русского местоименного «её» после упоминания горы.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל יְרֻשָּׁה
  choice: коленам Израиля в наследие
  rationale: Сохраняет установленную лексику племенного раздела и земельного наследия.
- source_word: כְּמַחְלְקֹתָם
  choice: разделив её между ними
  rationale: Передаёт распределение земли по соответствующим долям естественной русской конструкцией, не предполагая деталей, которых стих не называет.
