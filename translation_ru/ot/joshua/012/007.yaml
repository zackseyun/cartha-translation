  source_fidelity: В целом перевод верно передаёт участников, географические пределы, топонимы и женский суффикс в וַיִּתְּנָהּ, относящийся к земле. Однако כְּמַחְלְקֹתָם означает «согласно их разделам/уделам», а не отдельное деепричастное действие «разделив её между ними». Последняя формулировка несколько перестраивает синтаксис и может создавать впечатление, что речь идёт о распределении между отдельными лицами, а не об уделах колен.
