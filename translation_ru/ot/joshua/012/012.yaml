  text: the king of Eglon[a], one; the king of Gezer, one.
translation:
  language: ru
  text: царь Эглона — один; царь Гезера — один.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно более развёрнуто: «царь Эглона — один царь; царь Гезера — один царь». В еврейском тексте в этом перечне просто повторяется слово «один» при подсчёте царей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Обычный русский эквивалент еврейского מֶלֶךְ. В сочетании с названием города естественно передаётся конструкцией «царь Эглона/Гезера» без артикля, которого в русском языке нет.
- source_word: עֶגְלוֹן
  choice: Эглон
  rationale: Название города передано традиционной русской библейской транслитерацией.
- source_word: אֶחָד
  choice: один
  rationale: В перечне אֶחָד служит счётной формулой. Краткое «один» сохраняет лаконизм и повтор исходного текста; добавление слова «царь» было бы пояснительным расширением.
- source_word: גֶּזֶר
  choice: Гезер
  rationale: Название города передано традиционной русской библейской транслитерацией.
