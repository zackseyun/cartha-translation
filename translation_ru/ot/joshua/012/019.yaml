lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Существительное в сопряжённой конструкции обозначает правителя названного города-государства; родительный падеж передаёт значение «царь такого-то города».
- source_word: מָדוֹן
  choice: Мадона
  rationale: Название города передано традиционной русской транслитерацией «Мадон» и поставлено в родительный падеж после слова «царь».
- source_word: אֶחָד
  choice: один
  rationale: Числительное употреблено эллиптически для подсчёта побеждённых царей; сохранено ради краткого и повторяющегося характера перечня.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Повтор конструкции сохранён во второй позиции, чтобы воспроизвести параллелизм и счётный ритм еврейского перечня.
- source_word: חָצוֹר
  choice: Хацора
  rationale: Название города передано принятой русской формой «Хацор» и поставлено в родительный падеж после слова «царь».
- source_word: אֶחָד
  choice: один
  rationale: Повторное числительное сохранено, а не опущено и не заменено цифрой, чтобы точно передать формулу подсчёта.
