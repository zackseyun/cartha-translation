base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: ru
  text: в горной местности, в низменной области[a], в Араве[b], на склонах, в пустыне и в Негеве[c] — хеттеи, аморреи, хананеи, ферезеи, хивеи и иевусеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Шефеле» — так называлась западная низменная область с предгорьями.'
    reason: lexical_alternative
  - marker: b
    text: 'Арава — название рифтовой долины и пустынной равнины; возможный перевод: «на пустынной равнине».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в южной области»; еврейское слово «Негев» может обозначать как южную область, так и юг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: в горной стране
  rationale: הַר здесь обозначает не отдельную гору, а горную область; «горная страна» естественно передаёт региональный смысл.
- source_word: וּבַשְּׁפֵלָה
  choice: на низменности
  rationale: שְׁפֵלָה — западная низменная область и предгорья Иудеи; в основном тексте выбран понятный географический эквивалент, а название «Шефела» вынесено в сноску.
- source_word: וּבָעֲרָבָה
  choice: в Араве
  rationale: עֲרָבָה в данном перечне выступает как название области рифтовой долины; транслитерация сохраняет топонимический характер.
- source_word: וּבָאֲשֵׁדוֹת
  choice: на склонах
  rationale: אֲשֵׁדוֹת обозначает склоны или горные откосы; это прямой и естественный русский эквивалент.
- source_word: וּבַמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «пустыня» в современном русском ясно передаёт смысл без излишнего уточнения типа ландшафта.
- source_word: וּבַנֶּגֶב
  choice: в Негеве
  rationale: נֶגֶב может значить «юг» либо обозначать южную область; в географическом перечне предпочтительно региональное название «Негев».
- source_word: הַחִתִּי
  choice: хеттеи
  rationale: Формально единственное число имеет собирательное значение; по-русски название народа естественно передаётся множественным числом.
- source_word: הָאֱמֹרִי
  choice: аморреи
  rationale: Собирательный этноним передан обычной русской формой множественного числа.
- source_word: וְהַכְּנַעֲנִי
  choice: хананеи
  rationale: Собирательный этноним передан обычной русской формой множественного числа.
- source_word: הַפְּרִזִּי
  choice: ферезеи
  rationale: Собирательный этноним передан традиционной и узнаваемой русской библейской формой множественного числа.
- source_word: הַחִוִּי
  choice: хивеи
  rationale: Собирательный этноним передан традиционной русской формой множественного числа.
- source_word: וְהַיְבוּסִי
  choice: иевусеи
  rationale: Собирательный этноним передан традиционной русской формой множественного числа.
