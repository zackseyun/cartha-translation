review_pass:
  verdict: revise
  source_fidelity: В целом переданы Сигон, его резиденция, территориальный охват и граница с аммонитянами. Однако «берег долины» по-русски топографически неудачно передаёт שְׂפַת נַחַל («край/борт русла, долины»), а управление «владевший землями от … и от …, а также половиной» синтаксически смешивает разные конструкции. Пересмотр сохраняет перечислительную и несколько сжатую географическую конструкцию еврейского текста, не превращая נחל однозначно в реку.
  naturalness: Исправленный вариант использует естественные для современного литературного русского «правивший», «на краю долины», «включая середину этой долины и половину Галаада». Тире перед конечным рубежом помогает читабельности длинного территориального перечня.
  terminology: «Царь амореев», «Есевон», «Ароэр», «Галаад», «Иавок» и «аммонитяне» уместны. «Правивший» точнее отражает מֹשֵׁל, чем «владевший землями», не добавляя оттенка собственности. Примечание сохраняет лексическую неоднозначность נחל.
  issues:
  - severity: medium
    issue: Неестественная топографическая формулировка «на берегу долины Арнона».
    rationale: «Берег» обычно относится к водоёму или водотоку, тогда как «долина» имеет края/борта. שְׂפַת נַחַל обозначает край, берег или кромку русла/вади; «на краю долины Арнона» сохраняет допустимую неоднозначность נחל и естественнее по-русски.
  - severity: medium
    issue: Синтаксически несогласованный перечень в обороте «владевший землями от … и от …, а также половиной Галаада».
    rationale: После «землями от» форма «половиной» меняет модель управления и затрудняет понимание. Перестройка с «включая» ясно представляет середину долины и половину Галаада как части территории правления.
  - severity: low
    issue: «Владевший землями» несколько сужает מֹשֵׁל до владения.
    rationale: Причастие מֹשֵׁל говорит о политическом господстве/правлении. «Правивший» передаёт это значение непосредственно.
  revised_text: Сигон, царь амореев, живший в Есевоне и правивший землями от Ароэра, расположенного на краю долины Арнона, включая середину этой долины и половину Галаада, — до долины Иавока[a], границы аммонитян.
  revised_footnotes:
