  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: ru
  text: Сигон, царь амореев, живший в Есевоне и правивший землями от Ароэра, расположенного на краю долины Арнона, включая середину этой долины и половину Галаада, — до долины Иавока[a], границы аммонитян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское נחל может означать долину, русло сезонного водотока или сам водоток; здесь долины Арнона и Иавока служат территориальными рубежами.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֱמֹרִי
  choice: царь амореев
  rationale: Хотя форма единственного числа буквально означает «аморей», в сочетании со словом «царь» речь идёт о народе; «царь амореев» естественно передаёт смысл.
- source_word: הַיּוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: живший в Есевоне
  rationale: Причастие от ישב здесь обозначает постоянное проживание; современное «живший» точно и естественно в данном контексте.
- source_word: מֹשֵׁל
  choice: владевший землями
  rationale: Глагол обозначает власть и господство над перечисленной территорией. Добавление «землями» делает географическую конструкцию ясной по-русски, не меняя её смысла.
- source_word: מֵעֲרוֹעֵר
  choice: от Ароэра
  rationale: Предлог מ־ указывает исходную точку территориальной протяжённости.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: на берегу долины Арнона
  rationale: שפה означает край или берег, а נחל может обозначать долину сезонного водотока; «берег долины» сохраняет топографическую неоднозначность лучше, чем безоговорочное «река».
- source_word: וְתוֹךְ הַנַּחַל
  choice: и от середины этой долины
  rationale: תוך означает «середина, внутренность». Предлог «от» восполнен из предыдущего מ־ согласно эллиптическому построению перечня; указательное «этой» ясно связывает фразу с долиной Арнона.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: а также половиной Галаада
  rationale: חצי прямо обозначает половину территории; союз передан так, чтобы сохранить её как ещё одну область под властью Сигона.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: вплоть до долины Иавока
  rationale: עד обозначает конечную границу, а נחל допускает значения долины, русла или водотока.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: границы аммонитян
  rationale: Буквальное «сынов Аммона» является древнееврейским этнонимом; современное «аммонитян» передаёт его значение без ненужной буквальности.
