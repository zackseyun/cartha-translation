lexical_decisions:
- source_word: מֶלֶךְ תִּרְצָה
  choice: царь Тирцы
  rationale: Сопряжённая конструкция с последующим названием города естественно передаётся родительным падежом; название תִּרְצָה транслитерировано в принятой русской библейской форме «Тирца».
- source_word: אֶחָד
  choice: один
  rationale: Количественное числительное завершает очередной пункт перечня побеждённых царей.
- source_word: כָּל מְלָכִים
  choice: всего царей
  rationale: В заключительной итоговой формуле כָּל имеет суммирующее значение; по-русски естественно передать его словом «всего», не меняя смысла.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: тридцать один
  rationale: Нормальная русская форма составного количественного числительного, соответствующая буквальному «тридцать и один».
