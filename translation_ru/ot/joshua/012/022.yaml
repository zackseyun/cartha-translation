  yaml_path: translation/ot/joshua/012/022.yaml
  text: the king of Kedesh[a], one; the king of Jokneam by Carmel, one.
translation:
  language: ru
  text: царь Кедеша — один; царь Иокнеама у Кармила[a] — один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царь Иокнеама в Кармиле». Еврейское выражение может указывать на местонахождение или на принадлежность к области.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: В перечне побеждённых правителей слово обозначает царя соответствующего города-государства; русская конструкция естественно передаёт отношение родительным падежом без предлога.
- source_word: קֶדֶשׁ
  choice: Кедеш
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: אֶחָד
  choice: один
  rationale: Сохранён повторяющийся счётный рефрен главы; тире делает эллиптическую конструкцию ясной без добавления слова «царь».
- source_word: יָקְנֳעָם
  choice: Иокнеам
  rationale: Географическое название передано традиционной русской библейской формой.
- source_word: לַ/כַּרְמֶל
  choice: у Кармила
  rationale: Предлог ל здесь допускает пространственное или регионально-ассоциативное понимание; «у Кармила» естественно обозначает близость и не уточняет сверх текста, идёт ли речь именно о горе или области.
