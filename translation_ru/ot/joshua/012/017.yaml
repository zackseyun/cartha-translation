  text: царь Таппуаха — один[a], царь Хефера — один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть каждый из названных царей считается отдельно; более развёрнуто: «один царь Таппуаха, один царь Хефера».'
    reason: лексическое пояснение эллиптической формулы подсчёта
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь …
  rationale: Сопряжённая форма обозначает правителя названного города. В русском перечислении естественно передать её существительным «царь» с последующим названием в родительном падеже.
- source_word: תַּפּוּחַ
  choice: Таппуаха
  rationale: Географическое название транслитерировано с еврейского и поставлено в родительный падеж после слова «царь».
- source_word: אֶחָד
  choice: один
  rationale: Числительное употреблено эллиптически и отдельно подсчитывает каждого побеждённого царя; краткая передача сохраняет ритм еврейского списка.
- source_word: חֵפֶר
  choice: Хефера
  rationale: Географическое название транслитерировано с еврейского и поставлено в родительный падеж после слова «царь».
