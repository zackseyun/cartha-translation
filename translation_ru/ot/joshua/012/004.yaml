  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: ru
  text: и владения Ога, царя Башана, который был из остатка рефаимов и жил в Аштароте и Эдреи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: и владения
  rationale: גְּבוּל может означать границу, область или территорию. В перечне завоёванных царств речь идёт о подвластной Огу территории; множественное «владения» естественно передаёт этот смысл по-русски.
- source_word: ע֚וֹג
  choice: Ога
  rationale: Личное имя передано традиционной русской библейской формой; родительный падеж обусловлен сочетанием «владения Ога».
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: царя Башана
  rationale: Конструкция прямо называет царский статус Ога и область его правления; топоним передан традиционной формой «Башан».
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: одного из последних рефаимов
  rationale: Буквально выражение означает принадлежность Ога к остатку рефаимов. Такая формулировка естественна по-русски и сохраняет смысл того, что Ог был одним из уцелевших представителей народа.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: жившего
  rationale: Причастие от ישב обозначает проживание. Единственное число соотносит определение с Огом, а не с рефаимами в целом.
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: в Аштароте и Эдреи
  rationale: Оба названия переданы как топонимы в предложном падеже; повтор предлога по-русски не требуется.
