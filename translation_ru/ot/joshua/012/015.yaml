lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Сопряжённая форма обозначает правителя названного города-государства; в русском принадлежность естественно передаётся родительным падежом названия города.
- source_word: לִבְנָה
  choice: Ливны
  rationale: Географическое название передано традиционной русской библейской формой «Ливна», здесь в родительном падеже после слова «царь».
- source_word: אֶחָד
  choice: один
  rationale: Количественное числительное служит формулой подсчёта каждого побеждённого царя; краткая передача сохраняет строй и ритм еврейского перечня.
- source_word: עֲדֻלָּם
  choice: Адуллама
  rationale: Географическое название передано традиционной русской библейской формой «Адуллам», здесь в родительном падеже после слова «царь».
