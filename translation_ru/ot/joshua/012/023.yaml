    text: 'Еврейское слово גּוֹיִם обычно означает «народы»; здесь оно, возможно, употреблено как географическое или территориальное название. Поэтому возможен перевод: «царь народов в Гилгале».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: В перечне побеждённых правителей слово вводит каждую позицию; зависимое географическое название передано родительным падежом.
- source_word: דּוֹר
  choice: Дор
  rationale: Географическое название передано принятой русской транслитерацией.
- source_word: לְנָפַת דּוֹר
  choice: в области Дора
  rationale: נָפָה здесь обозначает относящуюся к Дору местность или округ. Такое прочтение естественно по-русски и не превращает сочетание без необходимости в отдельное имя собственное; возможный топографический оттенок отмечен в сноске.
- source_word: אֶחָד
  choice: один
  rationale: Повторяющееся слово служит счётной формулой списка; краткое «один» сохраняет рубленый перечислительный стиль еврейского текста.
- source_word: גּוֹיִם
  choice: Гоим
  rationale: Хотя обычно слово означает «народы», в данном перечне оно может быть географическим или территориальным названием. Транслитерация в основном тексте сохраняет эту неопределённость.
- source_word: לְגִלְגָּל
  choice: в Гилгале
  rationale: Предлог לְ выражает связь правителя с местностью; «в Гилгале» естественно передаёт её как место его владения.
