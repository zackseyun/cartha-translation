  text: царь Дора в области Дора[a] — один; царь Гоима[b] в Гилгале — один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на возвышенностях Дора». Еврейское выражение может обозначать область, округ или возвышенную местность Дора.'
