lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: В перечне побеждённых правителей слово вводит каждого царя; по-русски нулевой артикль естественен, а принадлежность передаётся родительным падежом названия места.
- source_word: אֲפֵק
  choice: Афек
  rationale: Собственное географическое название передано традиционной русской библейской формой.
- source_word: אֶחָד
  choice: один
  rationale: Это единица подсчёта в перечне; краткое «один» сохраняет лаконичный ритм еврейского текста.
- source_word: לַשָּׁרוֹן
  choice: Шарона
  rationale: Предлог ל с определённым артиклем обозначает область Шарон. В конструкции «царь Шарона» русское географическое имя естественно ставится в родительном падеже; артикль отдельно не выражается.
