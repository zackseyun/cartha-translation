  text: царь Хормы — один; царь Арада — один.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Сопряжённая форма перед названием города обозначает правителя соответствующего города; в русском языке конструкция «царь Хормы / Арада» естественна без артикля.
- source_word: חָרְמָה
  choice: Хорма
  rationale: Географическое название передано принятой русской библейской транслитерацией; в тексте употреблён родительный падеж «Хормы».
- source_word: אֶחָד
  choice: один
  rationale: Числительное употреблено эллиптически для подсчёта побеждённых царей; отдельное «один» сохраняет структуру и ритм еврейского перечня.
- source_word: עֲרָד
  choice: Арад
  rationale: Географическое название передано принятой русской библейской транслитерацией; в тексте употреблён родительный падеж «Арада».
