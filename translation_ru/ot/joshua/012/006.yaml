base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: ru
  text: Моисей, слуга Яхве, и сыны Израиля[a] разбили их; и Моисей, слуга Яхве, отдал её в наследственное владение рубенитам, гадитам и половине колена Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «израильтяне». Буквально по-еврейски: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: слуга
  rationale: В устойчивом почётном наименовании Моисея слово обозначает преданное служение Яхве и исполнение Его поручения; «слуга» естественнее и точнее по контексту, чем «раб».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул «Господь».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формулировка сохраняет явно выраженный в еврейском тексте образ потомков-сыновей Израиля и при этом узнаваема в литературном русском; более идиоматический вариант указан в сноске.
- source_word: הִכּוּם
  choice: разбили их
  rationale: В военном контексте נכה означает нанесение поражения. «Разбили» естественно передаёт итог военного действия, не уточняя без необходимости, были ли все противники убиты.
- source_word: וַיִּתְּנָהּ
  choice: отдал эту землю
  rationale: Женский местоименный суффикс отсылает к подразумеваемой земле или территории. Явное «эту землю» устраняет неясность русского местоимения и соответствует контексту.
- source_word: יְרֻשָּׁה
  choice: в наследственное владение
  rationale: Сочетание передаёт и наследственный характер дара, и значение земли как постоянного владения.
- source_word: לָרֻאוּבֵנִי
  choice: рубенитам
  rationale: Гентилик в единственном числе употреблён собирательно и обозначает членов колена Рувима.
- source_word: לַגָּדִי
  choice: гадитам
  rationale: Гентилик в единственном числе имеет собирательное значение и обозначает членов колена Гада.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: половине колена Манассии
  rationale: Фраза обозначает ту половину колена Манассии, которая получила территорию к востоку от Иордана.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
- issue: Корпоративное выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранный вариант сохраняет грамматически мужскую и родословную форму оригинала. Сноска сообщает естественный собирательный смысл, не утверждая, будто речь обязательно ограничена только взрослыми мужчинами.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён до ясного повествовательного строя; повтор титула Моисея сохранён по оригиналу. Точка с запятой отделяет победу от передачи земли во владение.
