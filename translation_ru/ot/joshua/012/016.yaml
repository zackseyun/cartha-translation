  text: the king of Makkedah[a], one; the king of Bethel, one.
translation:
  language: ru
  text: царь Маккеды — один; царь Вефиля — один.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте сохранён краткий стиль перечня: «царь Маккеды — один; царь Вефиля — один»; слово «один» указывает число побеждённых царей от каждого города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Форма сопряжённого состояния называет правителя соответствующего города-государства; в русском перечне принадлежность естественно выражается родительным падежом названия города.
- source_word: מַקֵּדָה
  choice: Маккеда
  rationale: Собственное географическое название передано традиционной русской библейской формой, а не переведено.
- source_word: אֶחָד
  choice: один
  rationale: 'В перечне побеждённых царей это итоговое числительное: по одному царю от каждого названного города. Сохранена краткая повторяющаяся структура еврейского текста.'
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Здесь это топоним; использована устоявшаяся русская библейская форма, без этимологического перевода «дом Бога».
