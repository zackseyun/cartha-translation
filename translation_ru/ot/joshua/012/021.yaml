  text: the king of Taanach[a], one; the king of Megiddo, one.
translation:
  language: ru
  text: царь Таанаха — один[a]; царь Мегиддо — один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более свободно: «один царь Таанаха; один царь Мегиддо». В еврейском тексте слово «один» повторяется как формула подсчёта в перечне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Сопряжённая форма обозначает правителя названного города-государства; в русском языке принадлежность передана родительным падежом названия города.
- source_word: תַּעְנַךְ
  choice: Таанах
  rationale: Название города передано традиционной русской транслитерацией; в сочетании «царь Таанаха» употреблён родительный падеж.
- source_word: אֶחָד
  choice: один
  rationale: Слово служит элементом подсчёта в перечне побеждённых царей. Сохранено без добавления существительного, чтобы передать краткую повторяющуюся формулу еврейского текста.
- source_word: מְגִדּוֹ
  choice: Мегиддо
  rationale: Название города передано принятой русской формой; несклоняемое имя сохраняется в сочетании «царь Мегиддо».
theological_decisions: []
