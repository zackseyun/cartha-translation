  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: ru
  text: и Араву[a] до моря Киннерот к востоку, и до моря Аравы — Солёного моря[b] — к востоку, в сторону Бейт-Йешимота, и с юга — ниже склонов Писги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «равнину». Здесь, вероятно, имеется в виду Арава — область Иорданской рифтовой долины, а не равнина вообще.
    reason: lexical_alternative
  - marker: b
    text: «Море Аравы — Солёное море» — водоём, позднее получивший широко распространённое название Мёртвое море.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Арава
  rationale: Передано как географическое название Иорданской рифтовой долины, а не как общее слово «равнина».
- source_word: יָם כִּנְרוֹת
  choice: море Киннерот
  rationale: Сохранено древнееврейское название водоёма; форма «Киннерот» непосредственно отражает написание источника.
- source_word: מִזְרָחָה
  choice: на востоке
  rationale: Направительная форма допускает значение «к востоку» или «с восточной стороны»; в перечне владений естественно звучит «на востоке».
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: море Аравы — Солёное море
  rationale: Сохранена пояснительная аппозиция еврейского текста; современное название «Мёртвое море» вынесено в примечание.
- source_word: דֶּרֶךְ בֵּית הַיְשִׁמוֹת
  choice: в сторону Бейт-Йешимота
  rationale: В описании границы דֶּרֶךְ обозначает направление; такой перевод естественнее буквального «путём».
- source_word: וּמִתֵּימָן
  choice: а с юга
  rationale: Сохранён предлог מִן («с, от») и южная ориентация фразы без сведения её к однозначному «к югу».
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: ниже склонов Писги
  rationale: 'Передаёт топографический смысл: местность расположена ниже горных склонов Писги.'
