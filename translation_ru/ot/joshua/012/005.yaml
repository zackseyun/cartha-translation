lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: и властвовавший
  rationale: Причастие сохраняет связь с описанием Ога и его владений в предыдущем стихе и передаёт продолжительное осуществление власти.
- source_word: בְּהַר חֶרְמוֹן
  choice: над горой Ермон
  rationale: При глаголе משל предлог ב обозначает область владычества; «над» естественно выражает власть над территорией.
- source_word: וּבְסַלְכָה
  choice: Салхой
  rationale: Название города передано традиционной русской библейской формой и поставлено в творительном падеже после «властвовавший над».
- source_word: וּבְכָל הַבָּשָׁן
  choice: и всем Васаном
  rationale: Фраза обозначает всю область, находившуюся под властью Ога; «Васан» — устоявшаяся русская библейская форма.
- source_word: עַד גְּבוּל
  choice: до границы
  rationale: Сочетание обозначает предел территории.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: гессурян и маахитян
  rationale: Формально единственные этниконы обозначают соответствующие народы или их земли; русское множественное число естественно в сочетании с границей.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: а также над половиной Галаада
  rationale: Обозначена половина территориальной области; «а также» ясно продолжает перечень владений без изменения смысла.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: до границы владений Сигона, царя Есевонского
  rationale: Добавление «владений» раскрывает территориальное значение גְּבוּל и устраняет неестественное представление о личной границе; имена переданы традиционными русскими библейскими формами.
