base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: ru
  text: 'Иисус Навин поступил с ними так, как сказал ему Яхве: он подрезал сухожилия у их коней[a], а их колесницы сжёг огнём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искалечил их коней»; еврейский глагол точнее указывает на перерезание сухожилий, чтобы вывести коней из строя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: И поступил с ними
  rationale: Передаёт действие по отношению к ним в военном контексте и звучит естественнее по-русски, чем буквальное «сделал им».
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: так, как повелел ему
  rationale: כַּאֲשֶׁר выражает точное соответствие, а אָמַר в контексте ранее данного Божьего распоряжения естественно передаётся глаголом «повелел».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: סוּסֵיהֶם
  choice: их коней
  rationale: Стандартное контекстуальное соответствие; «кони» естественно для военного повествования.
- source_word: עִקֵּר
  choice: перерезал сухожилия
  rationale: Точно и понятно передаёт намеренное выведение коней из строя посредством повреждения сухожилий; примечание сохраняет более общий возможный перевод.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: их колесницы
  rationale: Прямое и общепринятое соответствие.
- source_word: שָׂרַף בָּאֵשׁ
  choice: сжёг огнём
  rationale: Сохраняет явно выраженное в еврейском тексте בָּאֵשׁ «огнём», хотя по-русски это сочетание несколько избыточно.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис достаточно близок к еврейскому оригиналу, но идиоматичен; техническое действие над конями выражено ясно и без архаизма «подрезал жилы».
