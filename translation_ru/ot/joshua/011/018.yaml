lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Буквально «многие дни»; выражение обозначает продолжительный период. «Много дней» сохраняет образ оригинала и естественно звучит по-русски.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: вёл войну
  rationale: Буквально сочетание означает «делал войну», но его обычный смысл — «вести войну, воевать». Русское «вёл войну» точно передаёт идиому в современном литературном языке.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличить Иисуса Навина от других носителей того же имени.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: со всеми этими царями
  rationale: При русском сочетании «вести войну» противник естественно вводится предлогом «с»; контекст однозначно выражает враждебное противостояние.
