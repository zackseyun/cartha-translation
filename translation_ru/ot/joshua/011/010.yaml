base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: ru
  text: В то время Иисус Навин повернул назад[a], захватил Хацор и поразил его царя мечом[b], потому что прежде Хацор был главой[c] всех этих царств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернулся». Древнееврейский глагол допускает оба варианта; «повернул назад» яснее передаёт направление движения в ходе похода.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «поразил… мечом» буквально передаёт древнееврейский текст. В данном контексте оно, вероятно, означает, что царь был убит, однако сам глагол буквально значит «поразил».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «был главным среди всех этих царств». Буквально: «был головой всех этих царств» — это образное обозначение первенства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: повернул обратно
  rationale: Глагол שוב обозначает возвращение или движение назад. «Повернул обратно» естественно передаёт направленность передвижения в ходе военного похода, не сводя выражение к нейтральному «вернулся».
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Обычное временное выражение; русский вариант не сужает его значения до одного мгновения.
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד часто употребляется о взятии города; «захватил» ясно и естественно звучит в военном контексте.
- source_word: חָצוֹר
  choice: Хацор
  rationale: Название передано транслитерацией непосредственно с древнееврейского, а не через традиционную форму, восходящую к языкам-посредникам.
- source_word: מַלְכָּהּ
  choice: его царя
  rationale: Местоименный суффикс относится к городу Хацору. В современном русском название города обычно соотносится с мужским родом, поэтому выбрано «его».
- source_word: הִכָּה בֶחָרֶב
  choice: поразил его царя мечом
  rationale: נכה буквально означает «поразить, ударить». Контекст, вероятно, подразумевает убийство, однако перевод сохраняет сдержанную формулировку исходного текста и не заменяет её прямо глаголом «убил».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение особого положения Хацора; «потому что» ясно выражает причинно-пояснительную связь.
- source_word: לְפָנִים
  choice: прежде
  rationale: Слово указывает на прежнее положение дел; «прежде» кратко и естественно передаёт это временное значение.
- source_word: רֹאשׁ
  choice: главой
  rationale: Буквально «голова»; здесь это метафора первенства. «Главой» сохраняет образ исходного текста, хотя по-русски возможно и разъясняющее «главным».
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: всех этих царств
  rationale: Прямо передаёт значение всеохватности и указательное местоимение древнееврейского словосочетания.
