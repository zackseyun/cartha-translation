  register: Современный литературный русский язык с достоинством повествовательного исторического текста. Сохранены метафора «глава» и семантическая сдержанность выражения «поразил мечом»; неоднозначности вынесены в примечания. Имя Хацор передано непосредственно с древнееврейского; для יְהוֹשֻׁעַ использована общеупотребительная русская библейская форма «Иисус Навин» для ясной идентификации персонажа.
