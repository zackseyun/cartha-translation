  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: ru
  text: Иисус Навин и всё войско, бывшее с ним, внезапно подошли к ним у вод Мерома и напали на них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: подошли
  rationale: Глагол בוא обозначает прибытие или движение к месту. В данном военном контексте «подошли» естественно передаёт продвижение к противнику, не добавляя смысла самого нападения.
- source_word: עַם הַמִּלְחָמָה
  choice: всё войско
  rationale: Буквально «весь народ войны/битвы». Русское «всё войско» ясно и естественно передаёт собирательное обозначение участвующих в сражении людей, не внося отсутствующего в еврейском тексте уточнения по полу.
- source_word: עִמּוֹ
  choice: бывшее с ним
  rationale: Передаёт значение сопровождения; оборот согласован со словом «войско» и сохраняет отдельное указание исходного текста на присутствие войска вместе с Иисусом Навином.
- source_word: עֲלֵיהֶם
  choice: к ним
  rationale: После глагола движения предлог עַל в контексте враждебного сближения допускает значение движения к противнику; военный характер действия далее прямо выражен глаголом «напали».
- source_word: עַל מֵי מֵרוֹם
  choice: у вод Мерома
  rationale: Передаёт местонахождение возле водоёма Мером и сохраняет традиционный образ «вод» во множественном числе.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Прямой эквивалент наречия, сохраняющий неожиданность и стремительность появления войска.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: и напали на них
  rationale: Сочетание נפל с предлогом ב обозначает нападение. Русское «напали на них» точно и естественно передаёт военную идиому; буквальное «обрушились на них» возможно, но заметно экспрессивнее.
- source_word: וְ
  choice: Тогда
  rationale: Начальный waw продолжает последовательность повествования. «Тогда» естественно связывает стих с предшествующими событиями.
