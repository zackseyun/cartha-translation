  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: ru
  text: В земле сынов Израиля не осталось ни одного анакима; только в Газе, Гефе и Азоте некоторые из них остались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נוֹתַר עֲנָקִים
  choice: не осталось ни одного анакита
  rationale: Отрицание с формой единственного числа נוֹתַר и групповым названием עֲנָקִים естественно передаётся по-русски как полное отсутствие представителей народа; «анакит» сохраняет этноним, оставаясь понятной русской формой.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: в земле сынов Израиля
  rationale: Сохранена образная и родовая формулировка еврейского текста «сынов Израиля», а не обобщено до «израильтян».
- source_word: רַק
  choice: только
  rationale: Передаёт ограничение и контраст между землёй сынов Израиля и перечисленными городами.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: в Газе, Гефе и Азоте
  rationale: Использованы укоренившиеся в русской библейской традиции формы топонимов; повтор предлога естественно свёрнут в однородном ряду.
- source_word: נִשְׁאָרוּ
  choice: некоторые ещё оставались
  rationale: Множественный глагол возвращается к анакитам как подразумеваемому субъекту; «некоторые» ясно выражает остаток группы, а «ещё» естественно передаёт сохранявшееся положение после походов.
