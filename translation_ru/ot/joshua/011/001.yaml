  text: וַ/יְהִ֕י כִּ/שְׁמֹ֖עַ יָבִ֣ין מֶֽלֶךְ חָצ֑וֹר וַ/יִּשְׁלַ֗ח אֶל יוֹבָב֙ מֶ֣לֶךְ מָד֔וֹן וְ/אֶל מֶ֥לֶךְ שִׁמְר֖וֹן וְ/אֶל מֶ֥לֶךְ אַכְשָֽׁף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: ru
  text: Когда Иавин, царь Хацора, услышал об этом[a], он послал к Иоваву, царю Мадона, к царю Шимрона[b] и к царю Ахшафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «И было, когда Иавин, царь Хацора, услышал». В еврейском тексте не сказано прямо, что именно он услышал; «об этом» подразумевается из предшествующего повествования.'
    reason: lexical_alternative
  - marker: b
    text: Некоторые отождествляют Шимрон с Шимрон-Мероном, упомянутым в Нав 12:20.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда … услышал об этом
  rationale: Сочетание וַיְהִי с כִּי и инфинитивной конструкцией вводит временное обстоятельство в повествовании. Русское «когда» естественно передаёт эту функцию; «об этом» восполняет подразумеваемый из предшествующего контекста объект глагола «услышал».
- source_word: יָבִין
  choice: Иавин
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
- source_word: מֶלֶךְ חָצוֹר
  choice: царь Хацора
  rationale: Сопряжённая конструкция прямо обозначает царя данного города. Форма «Хацор» близко передаёт еврейское חָצוֹר и остаётся понятной как географическое название.
- source_word: וַיִּשְׁלַח אֶל
  choice: он послал к
  rationale: Перевод сохраняет простую формулировку оригинала. Посланники или весть подразумеваются, но прямо не названы, поэтому в основной текст они не добавлены.
- source_word: יוֹבָב
  choice: Иовав
  rationale: Использована традиционная русская передача личного имени.
- source_word: מֶלֶךְ מָדוֹן
  choice: царь Мадона
  rationale: Сопряжённая конструкция передана единообразно как титул и название города.
- source_word: שִׁמְרוֹן
  choice: Шимрон
  rationale: Основной текст следует форме масоретского текста именно в этом стихе, не заменяя её более длинным названием «Шимрон-Мерон» из Нав 12:20.
- source_word: אַכְשָׁף
  choice: Ахшаф
  rationale: Транслитерация отражает согласные еврейского названия и подходит нормам современного русского языка.
theological_decisions: []
