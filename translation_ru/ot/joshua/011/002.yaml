base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: ru
  text: 'и к царям, жившим на севере: в горной области, в Араве к югу от Киннерота, в Шефеле и в области Дора[a] на западе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в округах Дора», «в окрестностях Дора», «на возвышенностях Дора» или «на склонах Дора». Редкое еврейское слово имеет спорное топографическое значение.
    reason: lexical_alternative
  - marker: b
    text: Буквально «от моря»; в древнееврейском географическом употреблении это обычно означает «на западе».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל הַמְּלָכִים
  choice: и к царям
  rationale: Союз и предлог продолжают перечень адресатов из предыдущего стиха; מֶלֶךְ точно передано словом «царь».
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: жившим на севере
  rationale: В еврейском тексте сказуемое подразумевается; добавление «жившим» естественно оформляет относительную конструкцию по-русски, не меняя её географического смысла.
- source_word: בָּהָר
  choice: в горной области
  rationale: הַר здесь обозначает не отдельную гору, а гористую местность как географический район.
- source_word: וּבָעֲרָבָה
  choice: в Араве
  rationale: עֲרָבָה употреблено как географическое название Иорданской рифтовой долины; транслитерация сохраняет этот региональный смысл.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: к югу от Киннерота
  rationale: נֶגֶב здесь имеет направительное значение «юг, к югу», поскольку относится к северной местности Киннерот, а не к области Негев.
- source_word: וּבַשְּׁפֵלָה
  choice: в Шефеле
  rationale: שְׁפֵלָה — название определённой низменной, холмистой области; географическое имя точнее общего слова «низменность».
- source_word: וּבְנָפוֹת דּוֹר
  choice: в области Дора
  rationale: Редкое נָפוֹת по параллельным употреблениям может обозначать район или округ Дора. Перевод избегает чрезмерно уверенного выбора спорного топографического значения; альтернативы отмечены в сноске.
- source_word: מִיָּם
  choice: на западе
  rationale: Буквально «со стороны моря»; в древнееврейском географическом употреблении ים, Средиземное море, регулярно указывает западное направление.
