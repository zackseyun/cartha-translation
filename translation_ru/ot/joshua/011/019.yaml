  terminology: «Сыны Израиля», «хиввеи» и «Гаваон» соответствуют библейской традиции и исходному тексту. Примечание к «сынам Израиля» уместно предлагает более разговорно-национальный вариант «израильтяне». «Все остальные города» обоснованно раскрывает подразумеваемый контекстом объект הַכֹּל, не меняя объёма утверждения.
