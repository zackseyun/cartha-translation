  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: ru
  text: Не было ни одного города, который заключил бы мир с сынами Израиля[a], кроме хиввеев, живших в Гаваоне. Все остальные города израильтяне взяли в бою[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с израильтянами». Буквально: «с сынами Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Всех остальных они взяли войной». В древнееврейском тексте буквально: «всё (или: всех) они взяли в войне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: заключил бы мир с
  rationale: Порода хифиль глагола שׁלם с предлогом אֶל здесь означает вступить в мирные отношения. Русское «заключить мир с» естественно передаёт дипломатический смысл, не уточняя его как сдачу или подчинение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Сохраняет образное национально-родовое выражение древнееврейского текста; более обычное «израильтянами» вынесено в примечание.
- source_word: בִּלְתִּי
  choice: кроме
  rationale: Ясно вводит единственное исключение из предшествующего отрицания.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: хиввеев, живших в Гаваоне
  rationale: Причастная конструкция передана естественным русским оборотом; множественное «хиввеев» согласуется с יֹשְׁבֵי.
- source_word: אֶת הַכֹּל
  choice: все остальные города
  rationale: Буквально «всё/всех». Контекст говорит о городах, а «остальные» естественно выражает исключение Гаваона, не меняя объёма утверждения.
- source_word: לָקְחוּ
  choice: взяли
  rationale: Сохраняет широкое значение לקח; в сочетании с городами русское «взяли» естественно имеет военный смысл.
- source_word: בַמִּלְחָמָה
  choice: в бою
  rationale: Передаёт военное обстоятельство идиоматично; возможное более широкое «войной» отмечено в примечании.
theological_decisions: []
translation_notes:
  register: 'Современный литературный и сдержанно торжественный русский язык. Синтаксис слегка перестроен во втором предложении для устранения неясности местоимения «они»: субъект «израильтяне» выражен явно. Топоним передан в традиционной русской библейской форме «Гаваон», этноним — «хиввеи».'
