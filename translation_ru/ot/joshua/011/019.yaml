  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского оригинала: все города, за исключением хиввеев — жителей Гаваона, не заключили мира с сынами Израиля; остальных израильтяне взяли военным путём. «Заключил бы мир» в отрицательной относительной конструкции корректно передаёт совершенное действие исходного текста, не добавляя идеи подчинения или сдачи.'
