  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: ru
  text: Иисус Навин захватил все города этих царей и всех их царей, поразил их остриём меча и предал заклятию[a], как повелел Моисей, раб Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью уничтожил». Еврейский глагол обозначает предание людей или вещей заклятию — их безвозвратное посвящение, которое в данном случае влекло уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: города этих царей
  rationale: Конструктивная цепочка буквально обозначает «города этих царей»; такой перевод сохраняет связь с ранее названными царями и не уточняет сверх текста, что речь идёт о «царских городах».
- source_word: לָכַד
  choice: захватил
  rationale: В контексте военного завоевания глагол естественно передаётся как «захватил» и применим как к городам, так и к царям.
- source_word: וַיַּכֵּם
  choice: поразил их
  rationale: Глагол נכה имеет широкий диапазон значений, но сочетание с формулой «остриём меча» указывает здесь на смертоносное поражение; «поразил» сохраняет образность и не архаизирует фразу чрезмерно.
- source_word: לְפִי חֶרֶב
  choice: остриём меча
  rationale: Еврейская идиома буквально говорит об «устах меча». Русское «остриём меча» ясно передаёт орудие смертоносного поражения и частично сохраняет конкретный образ.
- source_word: הֶחֱרִים
  choice: предал заклятию
  rationale: Форма Hiphil от חרם обозначает не просто уничтожение, а безвозвратное посвящение под заклятие, ведущее в данном контексте к уничтожению. Технический оборот сохранён, а его смысл пояснён в сноске.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: Сочетание выражает точное соответствие ранее данному повелению. Русский вид глагола естественно показывает, что повеление предшествовало действиям Иисуса Навина.
- source_word: עֶבֶד יְהוָה
  choice: раб Яхве
  rationale: עבד здесь является почётным обозначением Моисея как принадлежащего Богу и исполняющего его волю. «Раб Яхве» сохраняет традиционную библейскую формулу и не сводит её к бытовому рабству.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом «Господь».
theological_decisions:
- issue: Передача חרם в повествовании о завоевании
  choice: предал заклятию
  alternative: полностью уничтожил; обрёк на уничтожение
  rationale: В еврейском тексте употреблён специальный термин, обозначающий безвозвратное посвящение под заклятие, а не только общее действие уничтожения. Выбранная формулировка сохраняет религиозно-правовой оттенок и сопровождается пояснением.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Значение עֶבֶד в титуле Моисея
  choice: раб Яхве
  alternative: слуга Яхве; служитель Яхве
  rationale: «Раб» сохраняет сильное отношение принадлежности и верного служения, присущее почётному библейскому титулу, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Имя יְהוָה передано как «Яхве»; технический термин חרם сохранён как «предал заклятию» и разъяснён в сноске. Повтор «царей» оставлен ради точности исходной синтаксической связи.
