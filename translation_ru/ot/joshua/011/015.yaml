revisions:
- from: Как Яхве повелел Моисею, Своему слуге, так Моисей повелел Иисусу Навину, и так Иисус Навин и сделал. Он ничего не упустил из всего, что Яхве повелел Моисею.[a]
  to: Как Яхве повелел Моисею, Своему слуге, так Моисей повелел Иисусу Навину; так и поступил Иисус Навин. Он ничего не упустил из всего, что Яхве повелел Моисею.[a]
  rationale: Правка делает построение первой части более естественным для современного русского и уточняет сноску, сохраняя как основной смысл — Иисус Навин ничего не упустил из данных Моисею повелений, — так и возможность более буквального понимания еврейского идиоматического оборота.
