base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: ru
  text: Как Яхве повелел Моисею, Своему слуге, так Моисей повелел Иисусу Навину; так и поступил Иисус Навин. Он ничего не упустил из всего, что Яхве повелел Моисею.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он ни в чём не отступил от того, что Яхве повелел Моисею». Буквально еврейский оборот означает: «он не удалил ничего из всего, что Яхве повелел Моисею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Как
  rationale: Естественно вводит точное соответствие между повелением Яхве Моисею и повелением Моисея Иисусу Навину.
- source_word: צִוָּה
  choice: повелел
  rationale: Передаёт властный характер указания и сохраняет повтор, подчёркивающий последовательную передачу повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עַבְדּוֹ
  choice: Своему слуге
  rationale: В данном почётном контексте по отношению к Моисею «слуга» естественнее, чем «раб»; местоимение отнесено к Яхве.
- source_word: כֵּן
  choice: так
  rationale: Сохраняет краткость и повтор исходного текста, выражая соответствие повеления и исполнения.
- source_word: עָשָׂה
  choice: и сделал
  rationale: Передаёт широкий и лаконичный смысл глагола; последующее предложение раскрывает полноту исполнения.
- source_word: לֹא הֵסִיר דָּבָר
  choice: Он ничего не упустил
  rationale: Естественно передаёт смысл еврейского оборота о полном исполнении, не воспроизводя буквально неясное по-русски «не удалил ни слова/дела».
- source_word: מִכֹּל אֲשֶׁר
  choice: из всего, что
  rationale: Сохраняет идею полной совокупности данных Моисею повелений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Полнота послушания Иисуса Навина
  choice: Он ничего не упустил из всего, что Яхве повелел Моисею
  alternative: Он не отступил ни от чего, что Яхве повелел Моисею
  rationale: Формулировка передаёт полноту исполнения, не уточняя сверх текста, означал ли оборот прежде всего отсутствие пропусков или отсутствие отклонений.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Повторы «повелел» и «так» сохранены как значимые элементы структуры стиха; имя Иисус Навин дано в принятой русской библейской форме.
