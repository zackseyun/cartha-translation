  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: ru
  text: от горы Халак[a], простирающейся в сторону Сеира, до Ваал-Гада в долине Ливана[b], ниже горы Ермон. Он захватил всех их царей, поразил их и убил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гладкой горы». Еврейское выражение можно понять описательно, однако здесь оно, вероятно, является названием «гора Халак».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на равнине Ливана». Еврейское слово может обозначать широкую долину или равнину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: гора Халак
  rationale: В контексте перечня географических границ сочетание, вероятнее всего, служит названием; возможное описательное значение сохранено в сноске.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: поднимающаяся к Сеиру
  rationale: Причастие עלה передаёт топографический подъём или простирание в сторону Сеира; формулировка сохраняет образ исходного текста.
- source_word: וְעַד בַּעַל גָּד
  choice: до Баал-Гада
  rationale: וְעַד обозначает предел территории, а Баал-Гад передан как географическое название.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: в долине Ливана
  rationale: בִּקְעָה может означать широкую долину или равнину; «долина» естественно звучит по-русски, а альтернатива отмечена в сноске.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: у подножия горы Ермон
  rationale: В географическом описании תַּחַת указывает на положение ниже горы; «у подножия» естественно и точно передаёт эту пространственную связь.
- source_word: לָכַד
  choice: захватил
  rationale: Военный глагол здесь относится к царям как пленённым лицам.
- source_word: וַיַּכֵּם
  choice: поразил их
  rationale: Сохраняет отдельное насильственное действие נכה и не смешивает его со следующим явным указанием на умерщвление.
- source_word: וַיְמִיתֵם
  choice: предал смерти
  rationale: Каузативная форма מות прямо означает причинение смерти; формулировка сохраняет смысловую окончательность и возвышенный повествовательный регистр.
