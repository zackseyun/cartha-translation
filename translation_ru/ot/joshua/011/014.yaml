  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: ru
  text: И всю добычу из этих городов и скот сыны Израиля взяли себе; только всех людей они поразили остриём меча, пока не истребили их. Они не оставили никого в живых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не оставили никакого дыхания»; то есть не оставили никого дышащего.'
    reason: Сохраняет конкретный еврейский образ נְשָׁמָה и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: שְׁלַל הֶעָרִים הָאֵלֶּה
  choice: добычу из этих городов
  rationale: שְׁלַל обозначает военную добычу; конструкция с городами естественно передаётся по-русски как добыча, взятая из них.
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В контексте военной добычи слово обозначает домашних животных; «скот» точно и естественно.
- source_word: בָּזְזוּ לָהֶם
  choice: взяли себе
  rationale: Передаёт завладение добычей и значение выгоды/присвоения в לָהֶם; повтор «добычу разграбили» по-русски был бы тяжеловесным.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет родственное обозначение исходного текста и остаётся узнаваемой библейской формулой в современном литературном русском.
- source_word: כָּל הָאָדָם
  choice: всех людей
  rationale: Коллективное אָדָם противопоставляет человеческое население скоту и включает людей независимо от пола и возраста.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: поражали остриём меча
  rationale: Передаёт устойчивый образ «устами/лезвием меча» без буквального и неестественного русского выражения «устами меча».
- source_word: עַד הִשְׁמִדָם אוֹתָם
  choice: пока не истребили их
  rationale: Hiphil שׁמד выражает доведение уничтожения до конца; «истребили» соответствует военному контексту и не вносит отсутствующую здесь терминологию заклятия.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: не оставили никого в живых
  rationale: Естественно передаёт идиоматический смысл выражения о полном отсутствии выживших; буквальный образ дыхания отмечен в сноске.
theological_decisions:
- issue: Объём значения כָּל הָאָדָם
  choice: всех людей
  alternative: каждого человека / всех мужчин
  rationale: Здесь אָדָם обозначает всё человеческое население в противопоставлении скоту; перевод «всех мужчин» мог бы ошибочно сузить смысл.
- issue: Смысл לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: не оставили никого в живых
  alternative: не оставили ничего дышащего
  rationale: Контекст после כָּל הָאָדָם указывает на отсутствие выживших среди людей; сноска сохраняет конкретный образ дыхания и возможную более буквальную формулировку.
- issue: Связь שׁמד с терминологией заклятия
  choice: истребили
  alternative: предали заклятию и уничтожили
  rationale: В этой части стиха употреблён שׁמד, а не חרם, поэтому специальная богословско-ритуальная терминология заклятия не добавляется.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формула «сыны Израиля» сохранена как ясное родственное обозначение; синтаксис упрощён для естественного чтения. Единственный знак сноски [a] помещён непосредственно после относящейся к нему фразы.
