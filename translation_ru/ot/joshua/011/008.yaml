    issue: Второе וַיַּכֻּם передано как «поражали».
    rationale: Это wayyiqtol в цепочке завершённых повествовательных действий, как и первое וַיַּכּוּם. Несовершенный вид вводит не выраженную оригиналом длительность.
  - severity: low
    issue: Сноска b неточно описывает грамматику.
    rationale: הִשְׁאִיר — инфинитивная форма, не выражающая субъекта явно; лучше прямо назвать это, сохранив возможность понимать субъект как Израиль коллективно или израильтян.
