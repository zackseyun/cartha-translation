  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: ru
  text: И Яхве отдал их в руки Израиля. Израильтяне поразили их и преследовали до Великого Сидона, до Мисрефот-Маима[a] и до долины Мицпы к востоку. Они поразили их, не оставив им ни одного уцелевшего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Мисрефот-Маим» по-еврейски может означать «горения вод».
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь инфинитив без явно выраженного субъекта; по контексту речь может идти об Израиле как едином целом или об израильтянах.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: отдал их в руки Израиля
  rationale: Военный оборот נתן ביד означает отдать противника во власть другого; русский оборот «отдать в руки» сохраняет исходный образ и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: поразили их / поражали их
  rationale: נכה в военном контексте означает наносить поражение, поражать, нередко с гибелью противника. Повтор корня сохранён, а видовые формы по-русски передают сначала событие, затем продолжавшееся истребление бегущих.
- source_word: וַיִּרְדְּפוּם
  choice: преследовали
  rationale: Прямое и естественное обозначение погони за отступающим врагом.
- source_word: צִידוֹן רַבָּה
  choice: Великий Сидон
  rationale: Прилагательное характеризует название города; «Великий Сидон» ясно и близко к форме оригинала.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Мисрефот-Маим
  rationale: Сочетание принято как географическое название и потому транслитерировано; возможное нарицательное значение отмечено в сноске.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: долина Мицпы на востоке
  rationale: בִּקְעָה обозначает широкую долину или долинную равнину; מִזְרָחָה указывает восточное направление или местоположение.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: не оставив у них никого в живых
  rationale: Русская конструкция естественно передаёт отсутствие какого-либо уцелевшего. Она не вводит отдельного явно названного деятеля там, где еврейский инфинитив сам по себе не выражает лица и числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, а не титул; форма «Яхве» непосредственно передаёт тетраграмматон без конфессиональной замены титулом.
- issue: Кто не оставил уцелевших в заключительной фразе
  choice: Связать деепричастный оборот с израильтянами, сохранив возможную коллективность субъекта
  alternative: «пока он не оставил у них никого в живых»; безличное «пока у них никого не осталось в живых»
  rationale: הִשְׁאִיר здесь является инфинитивом и не маркирует единственное либо множественное число. Контекст связывает действие с Израилем как коллективом; сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на ясные предложения без утраты последовательности действий; сохранены военная образность «в руки» и повтор глагола נכה. Топонимы переданы транслитерацией, а не истолкованы в основном тексте.
