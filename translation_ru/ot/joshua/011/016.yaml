source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: ru
  text: 'И взял Иисус всю эту землю: горную область, весь Негев, всю землю Гошен[a], Шефелу[b], Араву[c], горную область Израиля и её низменность.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гошен здесь — область в Ханаане, не обязательно одноимённая область в Египте.
    reason: cultural_note
  - marker: b
    text: 'Шефела — область невысоких холмов между центральным нагорьем и прибрежной равниной; возможный перевод: «низменность».'
    reason: lexical_alternative
  - marker: c
    text: Арава — географическое название долины; его также передают как «Иорданская долина» или «пустынная равнина».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое соответствие глаголу לקח; в контексте завоевания подразумевает овладение землёй, не уточняя сверх текста способ владения.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: всю эту землю
  rationale: Сохраняет широкий смысл אֶרֶץ и указательное הַזֹּאת.
- source_word: הָהָר
  choice: горную область
  rationale: Здесь слово обозначает географический регион возвышенностей, а не отдельную гору.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: В перечне областей это название конкретного южного региона; транслитерация точнее общего слова «юг».
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: землю Гошен
  rationale: Буквально передаёт конструкцию и не отождествляет эту область с египетским Гошеном.
- source_word: הַשְּׁפֵלָה
  choice: Шефелу
  rationale: Передано как название определённой географической области; значение разъяснено в сноске.
- source_word: הָעֲרָבָה
  choice: Араву
  rationale: Сохранено региональное географическое название без чрезмерно узкого отождествления с Иорданской долиной.
- source_word: הַר יִשְׂרָאֵל
  choice: горную область Израиля
  rationale: Сохраняет региональный смысл הַר и конструкцию принадлежности.
- source_word: וּשְׁפֵלָתוֹ
  choice: и её низменность
  rationale: Местоименный суффикс мужского рода в еврейском относится к הַר; в русском согласование по смыслу и грамматике — с «горной областью». Нарицательное «низменность» сохраняет связь с предшествующей областью и топографический контраст.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Географические названия Негев, Шефела и Арава сохранены как региональные термины; менее знакомые из них пояснены. Начальное «И» отражает повествовательную связь формы וַיִּקַּח с предыдущим контекстом.
