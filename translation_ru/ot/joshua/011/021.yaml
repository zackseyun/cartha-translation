base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: ru
  text: В то время Иисус Навин пришёл и искоренил анакимов из нагорья — из Хеврона, Давира, Анава, из всего нагорья Иудеи и из всего нагорья Израиля. Иисус Навин предал их уничтожению[a] вместе с их городами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «предал их заклятию». Еврейский глагол означает посвящение людей или вещей безвозвратному уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא в повествовательной форме обозначает прибытие или движение к месту действия; «пришёл» естественно передаёт развитие рассказа, не уточняя исходную точку.
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Устойчивое современное соответствие еврейскому временному обороту, сохраняющее связь с предшествующим повествованием.
- source_word: וַיַּכְרֵת אֶת הָעֲנָקִים
  choice: искоренил анакимов
  rationale: כרת буквально значит «отсекать», а здесь говорит об устранении народа из данной области. «Искоренил» сохраняет образ решительного удаления и позволяет отличить этот глагол от последующего החרים.
- source_word: מִן הָהָר
  choice: из нагорья
  rationale: В книге Иисуса Навина הָהָר обычно обозначает горную область, а не одну гору; «нагорье» точно и лаконично передаёт географический смысл.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: из Хеврона, Давира, Анава
  rationale: Названия мест переданы в формах, укоренившихся в русской библейской традиции; повтор предлога сохранён в структуре перечисления.
- source_word: וּמִכֹּל הַר יְהוּדָה וּמִכֹּל הַר יִשְׂרָאֵל
  choice: из всего нагорья Иудеи и из всего нагорья Израиля
  rationale: Передаёт обе параллельные региональные характеристики без попытки дополнительно истолковать историко-географическое соотношение Иудеи и Израиля.
- source_word: עִם עָרֵיהֶם
  choice: вместе с их городами
  rationale: Прямо передаёт значение сопровождения у עִם; «города» соответствует обычному значению עָרִים в повествованиях о завоевании.
- source_word: הֶחֱרִימָם
  choice: предал их уничтожению
  rationale: Формулировка понятна современному читателю и передаёт итоговое уничтожение, при этом глагол «предал» сохраняет оттенок особого посвящения; технический смысл заклятия пояснён в сноске.
theological_decisions:
- issue: Передача терминологии חרם в контексте войны
  choice: предал их уничтожению
  alternative: предал их заклятию; полностью уничтожил их
  rationale: חרם обозначает не просто убийство, а предание людей или вещей особому заклятию, ведущему к уничтожению. Основной текст должен оставаться понятным, а сноска сохраняет технический религиозно-ритуальный смысл. Отличие от предшествующего כרת также сохранено.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Географический термин «нагорье» и традиционные формы имён обеспечивают точность без архаизации; синтаксический параллелизм исходного перечисления в основном сохранён.
