  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: ru
  text: ханаанеям на востоке и на западе[a], амореям, хеттам, ферезеям и иевусеям, жившим в горной стране, и евеям у подножия Ермона, в земле Мицпы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и со стороны моря»; море здесь, вероятно, служит географическим обозначением запада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: ханаанеев
  rationale: Единственное число с артиклем имеет собирательное значение; в современном русском перечень народов естественно передаётся множественным числом.
- source_word: מִמִּזְרָח וּמִיָּם
  choice: на востоке и на западе
  rationale: Предлоги в географическом перечне обозначают расположение; יָם буквально значит «море», но здесь, вероятнее всего, служит обозначением запада.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: амореев, хеттов, ферезеев и иевусеев
  rationale: Собирательные этнонимы переданы нормативными русскими формами во множественном числе и поставлены в винительный падеж как продолжение управления из предыдущего стиха.
- source_word: בָּהָר
  choice: живших в горной стране
  rationale: הָר в географии книги Иисуса Навина обозначает гористую возвышенность или нагорье; добавление «живших» делает связь определения с перечнем народов ясной по-русски.
- source_word: הַחִוִּי
  choice: евеев
  rationale: Собирательный этноним передан принятой русской библейской формой во множественном числе.
- source_word: תַּחַת חֶרְמוֹן
  choice: у подножия Ермона
  rationale: Пространственное תַּחַת указывает на местность ниже горы; «у подножия» естественно и точно выражает это отношение.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: в земле Мицпы
  rationale: אֶרֶץ обозначает территорию, а מִצְפָּה рассматривается как географическое имя; формулировка сохраняет территориальный оттенок оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских этнонимов и топонимов. Стих представляет собой продолжение предложения из предыдущего стиха, поэтому названия народов стоят в винительном падеже. Синтаксис слегка сглажен для ясности без устранения географической неоднозначности слова «море».
