  source_fidelity: 'В исходном тексте перечень этнонимов продолжает адресатов глагола «послал» из предыдущего стиха: первый ряд и ханаанеи, и амореи, хетты, ферезеи, иевусеи, и евеи относятся к посланным адресатам. Поэтому в русском продолжении нужны формы дательного падежа, а не винительного. Географические определения переданы точно: восток/запад (с примечанием к буквальному «море»), горная страна, местность у подножия Ермона и земля Мицпы.'
  naturalness: 'Предложенная правка сохраняет характер стиха как продолжения предыдущего предложения и делает синтаксическую связь нормативной для современного литературного русского: «ханаанеям ..., амореям...»; определение «жившим в горной стране» также согласовано в дательном падеже.'
  terminology: Формы «ханаанеи», «амореи», «хетты», «ферезеи», «иевусеи», «евеи», а также топонимы «Ермон» и «Мицпа» допустимы и последовательны. «У подножия Ермона» точно передаёт пространственное значение תחת в данном контексте.
