lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: собрались по уговору
  rationale: Нифаль глагола יעד обозначает согласованное, заранее условленное собрание; формулировка передаёт координацию действий, не сводя значение лишь к соглашению или случайной встрече.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: все эти цари
  rationale: Сохраняет всеобщность и указательное значение еврейского выражения.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Простая повествовательная передача обычного значения глагола בוא.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Передаёт значение חנה — разбить лагерь — в военном контексте и звучит естественно в dignified современном русском повествовании.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Сохраняет акцент на совместном действии союзных царей.
- source_word: אֶל מֵי מֵרוֹם
  choice: у вод Меромских
  rationale: Предлог передан локативно по смыслу глагола стоянки; множественное מֵי сохранено словом «вод», а название естественно оформлено традиционным русским прилагательным.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: чтобы сразиться с Израилем
  rationale: Целевая конструкция с инфинитивом передана придаточным цели; «сразиться с» естественно выражает военное противостояние, заключённое в לחם с עִם.
