  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: ru
  text: Итак, Иисус Навин взял всю землю[a], согласно всему, что Яхве сказал Моисею, и отдал её Израилю в наследие, в соответствии с разделением по коленам. И земля успокоилась от войны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вся земля» подводит итог завоеванию той земли, о которой идёт речь в данном повествовании.
    reason: Уточнение контекстуального объёма выражения без ограничения его смысла в основном тексте.
  - marker: b
    text: 'Или: «земля обрела покой после войны». Еврейское выражение означает покой и тишину после военных действий.'
    reason: Лексическая альтернатива для שָׁקְטָה מִמִּלְחָמָה.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Основное значение לקח — «брать, взять». В итоговом описании «взял» сохраняет краткость еврейского текста и не сужает смысл до одного лишь военного захвата.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: Сочетание относится к земле, о которой идёт речь в повествовании, а не ко всей земле как миру; буквальная широта формулировки сохранена без истолковывающего ограничения в основном тексте.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: как и говорил
  rationale: Оборот выражает соответствие ранее сказанному. Русская формулировка естественно передаёт исполнение всего, что было возвещено, без тяжеловесного буквального оборота.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיִּתְּנָהּ
  choice: отдал её
  rationale: Форма נתן с местоименным суффиксом указывает на землю. «Отдал её» естественно сочетается с последующим выражением о наследии.
- source_word: לְנַחֲלָה
  choice: в наследие
  rationale: נחלה обозначает наследственное владение и сохраняет здесь как правовой, так и богословский смысл дарованной Израилю земли.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: разделив по уделам между коленами
  rationale: Фраза передаёт распределение земли по подразделениям Израиля и его племенам. «Колена» — укоренившееся и понятное обозначение племён Израиля, а «уделы» отражают контекст земельного раздела.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: успокоилась от войны
  rationale: שקט выражает покой и тишину после конфликта. Формулировка сохраняет образ земли как субъекта и не утверждает больше, чем прекращение войны в данном повествовательном итоге.
theological_decisions:
- issue: Объём итогового утверждения «всю землю»
  choice: Сохранить итоговую формулировку о взятии всей земли без уточняющего ограничения.
  alternative: Истолковать её как немедленное и исчерпывающее занятие каждой части страны либо прямо обозначить как гиперболу.
  rationale: Еврейский текст даёт повествовательный итог, но сам не разрешает напряжение с последующими сообщениями об остававшихся областях. Перевод не должен устранять это напряжение.
- issue: Характер покоя земли
  choice: Передать прекращение войны как покой земли.
  alternative: Передать выражение как абсолютный и всеобщий мир.
  rationale: שקט обозначает спокойствие после конфликта, но не требует вывода об окончательном отсутствии любых будущих столкновений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имена и реалии переданы общепонятно; синтаксис упрощён до естественных русских предложений, при этом повтор имени Иисуса Навина и образ «земля успокоилась» сохраняют особенности исходного текста.
