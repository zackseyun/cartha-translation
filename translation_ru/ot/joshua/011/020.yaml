base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Ибо Господь ожесточил[a] их сердца, чтобы они вступили в сражение с Израилем, дабы они были преданы заклятию[b], чтобы за них не было мольбы о пощаде[c], но были истреблены, как Господь повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквально: «укрепил их сердца», то есть сделал их непреклонными в противостоянии.'
    reason: lexical_alternative
  - marker: b
    text: '«Предать заклятию» передаёт технический термин, означающий безвозвратно предать уничтожению; также: «полностью уничтожить их».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы им не было пощады». Еврейское слово означает «мольба, просьба о милости»; этот оборот может указывать на отсутствие мольбы либо на отказ в милости.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: это Господь
  rationale: Оборот указывает на источник действия. Русская конструкция ясно и естественно сохраняет прямую Божественную инициативу; имя יהוה передано традиционным литературным «Господь».
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: ожесточил их сердца
  rationale: Буквально глагол חזק означает «укреплять», но в данном контексте речь о придании непреклонной решимости противиться Израилю. «Ожесточил» передаёт контекстуальный смысл, не ослабляя прямой роли Господа.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: чтобы они выступили против Израиля на войну
  rationale: Сочетание לקראת с военной лексикой обозначает движение навстречу для враждебного столкновения. Формулировка естественна по-русски и сохраняет военный смысл.
- source_word: לְמַעַן הַחֲרִימָם
  choice: дабы предать их заклятию
  rationale: חרם — специальный термин, обозначающий безвозвратное посвящение суду и уничтожению. «Предать заклятию» сохраняет его особую библейскую окраску, а сноска разъясняет смысл.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: чтобы не было им пощады
  rationale: תְּחִנָּה может обозначать мольбу о милости либо дарованную милость. Основной текст передаёт вероятный контекстуальный результат, а сноска сохраняет лексическую неоднозначность.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: но чтобы истребить их
  rationale: שמד выражает полное уничтожение. «Истребить» достаточно сильно и уместно для возвышенного исторического повествования.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как Господь повелел Моисею
  rationale: Фраза прямо соотносит событие с ранее данным Моисею повелением; русский совершенный вид естественно выражает его предшествование.
theological_decisions:
- issue: Божественное действие в ожесточении сердец хананейских царей
  choice: «это Господь ожесточил их сердца»
  alternative: «Господь допустил, чтобы их сердца ожесточились»
  rationale: Еврейский текст прямо связывает ожесточение с Господом как его источником. Перевод не сводит это к простому допущению и сохраняет напряжение между Божьим верховенством и человеческим противлением.
- issue: Смысл חרם
  choice: «предать их заклятию» с пояснительной сноской
  alternative: «полностью уничтожить их»
  rationale: Выбранный вариант сохраняет специальную категорию посвящения Божьему суду, не сводя её к общему обозначению военного уничтожения.
- issue: Неопределённый исполнитель при инфинитивах הַחֲרִימָם и הַשְׁמִידָם
  choice: безличные инфинитивные конструкции «предать их… истребить их»
  alternative: «чтобы Он предал их… чтобы Он истребил их»
  rationale: В еврейском при этих инфинитивах исполнитель прямо не назван. Русская конструкция сохраняет эту синтаксическую открытость и не навязывает более узкое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор целевых конструкций, суровость судебной лексики и неоднозначность трудных еврейских выражений.
