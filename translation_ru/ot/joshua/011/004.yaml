base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: ru
  text: Выступили они — вместе со всеми своими войсками[a], — народ многочисленный, как песок на берегу моря[b]; коней и колесниц было чрезвычайно много.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «станы» или «лагеря»; еврейское слово может также обозначать расположенные в них войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как песок, который на берегу моря, по множеству».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: И выступили они
  rationale: В контексте объединённого военного похода «выступили» естественно передаёт исход и движение войск, не уточняя направление сверх того, что выражено еврейским глаголом.
- source_word: מַחֲנֵיהֶם
  choice: все их войска
  rationale: מַחֲנֶה может означать лагерь, стан или находящееся в нём войско. Здесь речь идёт о силах, выступивших вместе с царями, поэтому «войска» яснее для современного читателя; буквальный образ отмечен в сноске.
- source_word: עַם רָב
  choice: великое множество
  rationale: Хотя עַם буквально означает «народ», здесь сочетание описывает огромную численность собравшихся воинов. «Великое множество» естественно передаёт количественный смысл без предположения об одном этническом народе.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: многочисленное, как песок на берегу моря
  rationale: Формулировка сохраняет образ морского песка и явно передаёт функцию לָרֹב — указание на неисчислимую многочисленность.
- source_word: סוּס
  choice: коней
  rationale: Единственное число употреблено собирательно; русский множественный родительный после конструкции «было много» звучит естественно.
- source_word: רֶכֶב
  choice: колесниц
  rationale: В данном военном контексте רֶכֶב обозначает колесницы или колесничное войско; «колесниц» — ясный и конкретный эквивалент.
- source_word: רַב מְאֹד
  choice: было чрезвычайно много
  rationale: Передаёт усиленную степень количества и естественно относится одновременно к коням и колесницам.
