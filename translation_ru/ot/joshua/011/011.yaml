  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: ru
  text: Они поразили остриём меча всех, кто был в нём, предав их заклятию[a]. Не осталось ни одного живого существа[b], а Хацор он сжёг в огне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский термин חרם означает предать кого-либо или что-либо заклятию, то есть безвозвратно посвятить уничтожению.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не осталось никакого дыхания»; смысл выражения — не осталось ни одного уцелевшего живого существа.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте сначала стоит множественное число («они поразили»), а здесь — единственное («он сжёг»). Вероятно, в последней части подразумевается Иисус Навин.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: они поразили
  rationale: Форма глагола נכה в военном контексте означает поражение и умерщвление противника; «поразили» сохраняет военную окраску исходного выражения.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: всех, кто был в нём
  rationale: נֶפֶשׁ здесь обозначает людей, находившихся в городе, а не нематериальную «душу»; русское выражение естественно передаёт собирательное значение.
- source_word: לְפִי חֶרֶב
  choice: остриём меча
  rationale: Устойчивый еврейский оборот буквально говорит об «устах меча»; «остриём меча» сохраняет образность и понятно передаёт способ убийства.
- source_word: הַחֲרֵם
  choice: предав их заклятию
  rationale: חרם обозначает посвящение людей или предметов безвозвратному уничтожению. Традиционный русский оборот сохраняет особое сакрально-судебное значение, не сводя его к простому «истребили».
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: не осталось ни одного дышащего
  rationale: נְשָׁמָה связано с дыханием; формулировка сохраняет конкретный образ исходного текста и его смысл — не осталось ни одного уцелевшего живого существа.
- source_word: חָצוֹר
  choice: Хацор
  rationale: Название города передано принятой русской транслитерацией еврейского топонима.
- source_word: שָׂרַף בָּאֵשׁ
  choice: сжёг огнём
  rationale: Сохранено явное упоминание огня в еврейском тексте; единственное число глагола также сохранено.
theological_decisions:
- issue: Передача חרם в повествовании о завоевании
  choice: предав их заклятию
  alternative: полностью истребив их; подвергнув их заклятию
  rationale: Выбранный вариант сохраняет присущий חרם смысл безвозвратного посвящения уничтожению и не устраняет богословскую напряжённость текста, но сноска поясняет значение непривычного современному читателю термина.
- issue: Переход от множественного числа к единственному
  choice: они поразили… а Хацор он сжёг
  alternative: они поразили… и сожгли Хацор
  rationale: Еврейский текст переходит от וַיַּכּוּ во множественном числе к שָׂרַף в единственном. Этот переход сохранён, не утверждая категорически, кто именно подразумевается, хотя по контексту это, вероятно, Иисус Навин.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Редкий термин «заклятие» сохранён ради смысловой точности и разъяснён в сноске; намеренный переход к «он сжёг» отражает грамматику оригинала.
