  text: רַ֣ק כָּל הֶ/עָרִ֗ים הָ/עֹֽמְדוֹת֙ עַל תִּלָּ֔/ם לֹ֥א שְׂרָפָ֖/ם יִשְׂרָאֵ֑ל זוּלָתִ֛י אֶת חָצ֥וֹר לְ/בַדָּ֖/הּ שָׂרַ֥ף יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: ru
  text: Но ни одного из городов, стоявших на своих холмах[a], Израиль не сжёг; один лишь Хацор сжёг Иисус Навин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоявших на своих теллях», то есть на поселенческих холмах, образовавшихся из сменявших друг друга слоёв застройки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: В начале стиха частица вводит противопоставление предшествующему рассказу; русское «но» естественно передаёт эту функцию.
- source_word: כָּל הֶעָרִים ... לֹא שְׂרָפָם
  choice: ни одного из городов ... не сжёг
  rationale: При отрицании такая конструкция естественно передаёт охват всей группы, не создавая двусмысленности русского «не все города».
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: стоявших на своих холмах
  rationale: Сохраняется образ городов, стоящих на возвышениях; примечание уточняет археологический смысл תֵּל как поселенческого холма.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: один лишь Хацор
  rationale: Кратко и естественно выражает единственное исключение, сохраняя усиление לְבַדָּהּ.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: сжёг Иисус Навин
  rationale: Повтор глагола сохранён, как в еврейском тексте; традиционная русская форма имени обеспечивает узнаваемость.
- source_word: חָצוֹר
  choice: Хацор
  rationale: Передача имени соответствует его еврейскому звучанию и современной русской библейской транслитерации.
