base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: ru
  text: 'И сказал Яхве Иисусу Навину: «Не бойся их, ибо завтра в это время Я предам всех их Израилю — убитыми. Коням их перережь жилы на ногах, а колесницы их сожги огнём».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: Не бойся их
  rationale: Естественно и точно передаёт запрет и причинный смысл сочетания с מִפְּנֵיהֶם.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: завтра примерно в это же время
  rationale: כָּעֵת допускает значение приблизительного совпадения по времени; формулировка сохраняет эту нюансировку.
- source_word: אָנֹכִי נֹתֵן
  choice: Я предам
  rationale: В контексте обещания о ближайшем будущем русский будущий вид звучит естественно; «предам» выражает передачу врагов во власть Израиля.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: Я предам их всех Израилю, и они падут убитыми
  rationale: Передаёт военное значение חֲלָלִים и смысл отдачи врагов на поражение, не создавая в русском неясной конструкции «предам убитыми».
- source_word: אֶת סוּסֵיהֶם תְּעַקֵּר
  choice: Коням их перережь поджилки
  rationale: Точно обозначает предписанное выведение коней из строя посредством повреждения сухожилий и сохраняет повелительную силу формы.
- source_word: וְאֶת מַרְכְּבֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ
  choice: а колесницы их сожги огнём
  rationale: Сохраняет явное упоминание огня и естественно противопоставляет действие над колесницами действию над конями.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Кто совершает поражение врагов
  choice: «Я предам их всех Израилю, и они падут убитыми»
  alternative: «Я убью их всех перед Израилем»; «Я предам их всех Израилю на поражение»
  rationale: Формулировка сохраняет инициативу Яхве и одновременно не устраняет заложенную в образе передачи роль Израиля как участника битвы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «коням их», «колесницы их» придаёт речи достоинство, оставаясь понятной; архаичные формы и конфессионально маркированная терминология не используются.
