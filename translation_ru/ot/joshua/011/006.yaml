revisions:
- from: 'И сказал Яхве Иисусу Навину: «Не бойся их, потому что завтра примерно в это же время[a] Я предам их всех Израилю, и они падут убитыми[b]. Коням их перережь поджилки, а колесницы их сожги огнём».'
  to: 'И сказал Яхве Иисусу Навину: «Не бойся их, ибо завтра в это время Я предам всех их Израилю — убитыми. Коням их перережь жилы на ногах, а колесницы их сожги огнём».'
  rationale: 'Исправленное чтение сохраняет образ исходного текста: Яхве предаёт врагов Израилю как уже обречённых быть убитыми, не добавляя глагол «падут». Временное выражение сделано нейтральным в основном тексте, а возможная приблизительность отражена сноской. Сноска b сохранена и привязана к «убитыми», где она объясняет еврейскую конструкцию.'
