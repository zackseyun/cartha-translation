source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: ru
  text: Как повелел Яхве Моисею, так поступили сыны Израиля[a] и разделили землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «израильтяне». Еврейский текст буквально говорит «сыны Израиля» — это обычное собирательное обозначение народа Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: как… так
  rationale: Парная русская конструкция естественно передаёт точное соответствие между повелением Яхве и действиями Израиля.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол обозначает властное приказание; «повелел» уместно в возвышенном, но понятном современном библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: При русском глаголе «повелеть» лицо, которому даётся повеление, естественно ставится в дательном падеже.
- source_word: עָשׂוּ
  choice: поступили
  rationale: В данном контексте передаёт действие в соответствии с повелением и сохраняет отсутствие явно названного дополнения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет форму еврейского корпоративного выражения; в контексте оно обозначает народ Израиля в целом.
- source_word: וַיַּחְלְקוּ
  choice: и разделили
  rationale: Прямо передаёт последовательный глагол со значением разделения или распределения земли.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте книги Иисуса Навина речь идёт о земле, распределяемой между израильскими коленами; русское «землю» естественно и не требует поясняющего добавления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Буквальная форма сохраняет образ исходного выражения, при этом сноска разъясняет его корпоративное значение и не ограничивает референт только мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «как… так» сохраняет соответствие частей еврейской фразы; «сыны Израиля» оставлено как узнаваемое корпоративное выражение и пояснено в сноске.
