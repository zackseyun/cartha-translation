source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: ru
  text: 'Тогда сыны Иуды подошли к Иисусу Навину в Галгале, и Халев, сын Иефоннии, кенезеянин, сказал ему: «Ты знаешь, что[a] Яхве сказал Моисею, человеку Божьему, обо мне и о тебе в Кадес-Варни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слово, которое»; возможны также значения «дело» или «то, что».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: подошли
  rationale: Глагол נגשׁ обозначает приближение; «подошли» естественно передаёт движение участников к Иисусу Навину.
- source_word: בְנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Сохранено буквальное родоплеменное выражение «сыны Иуды», понятное в возвышенном библейском повествовании.
- source_word: בַּגִּלְגָּל
  choice: в Галгале
  rationale: Русская предложная форма естественно обозначает место действия.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Халев, сын Иефоннии, кенезеянин
  rationale: Использованы укоренившиеся русские библейские формы имён и обозначение принадлежности к кенезеянам.
- source_word: אַתָּה יָדַעְתָּ
  choice: Ты знаешь
  rationale: Перфект выражает сохраняющееся состояние знания; настоящее время естественно для прямой речи.
- source_word: הַדָּבָר אֲשֶׁר דִּבֶּר
  choice: что … сказал
  rationale: Русская конструкция с придаточным изъяснительным естественно передаёт содержание известного Божьего высказывания; многозначность הַדָּבָר отмечена сноской.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Моисею, человеку Божьему
  rationale: Сохранён устойчивый библейский титул אִישׁ הָאֱלֹהִים.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: обо мне и о тебе
  rationale: Краткая и точная русская передача значения «относительно меня и относительно тебя».
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: в Кадес-Варни
  rationale: Использована традиционная русская форма географического названия и естественный локатив.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя יהוה; транслитерация сохраняет различие между именем и титулом.
- issue: Родоплеменное обозначение בְנֵי יְהוּדָה
  choice: сыны Иуды
  alternative: представители племени Иуды
  rationale: Формальная передача сохраняет образ родства и мужскую форму исходного выражения, не сужая его до более конкретной группы без текстового основания.
- issue: Значение הַדָּבָר
  choice: что Яхве сказал
  alternative: слово, которое Яхве изрёк
  rationale: Контекст указывает на конкретное Божье высказывание, но существительное допускает значения «слово», «дело» и «обстоятельство»; сноска сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Традиционные формы имён обеспечивают узнаваемость; синтаксис прямой речи остаётся естественным и ясным.
