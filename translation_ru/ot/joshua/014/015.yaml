  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: ru
  text: Прежде Хеврон назывался Кириат-Арба[a]. Арба был великим человеком среди анакимов[b]. И земля успокоилась от войны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Кириат-Арба», вероятно, означает «город Арбы».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Арба был величайшим человеком среди анакимов»; еврейское выражение может обозначать Арбу как наиболее выдающуюся фигуру, связанную с анакимами.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «И земля была спокойна, свободна от войны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: Прежде Хеврон назывался
  rationale: 'Идиоматично передаёт буквальное «а имя Хеврона прежде было»: сохраняет указание на прежнее название без неестественной для современного русского конструкции.'
- source_word: קִרְיַת אַרְבַּע
  choice: Кириат-Арба
  rationale: Составное географическое имя транслитерировано; его вероятное значение поясняется в сноске.
- source_word: הָאָדָם הַגָּדוֹל
  choice: величайшим человеком
  rationale: В контексте выражение указывает на выдающееся, вероятно первенствующее положение Арбы; возможное несуперлативное понимание сохранено в сноске.
- source_word: בָּעֲנָקִים
  choice: среди анакимов
  rationale: Сохраняется еврейское название народа во множественном числе; предлог ב здесь выражает принадлежность к группе или положение среди неё.
- source_word: וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה
  choice: И земля успокоилась от войны
  rationale: Передаёт прекращение военных действий и наступивший покой, сохраняя соединительный союз и образное обозначение страны как «земли».
theological_decisions:
- issue: Степень превосходства Арбы среди анакимов
  choice: Арба был величайшим человеком среди анакимов
  alternative: Арба был великим человеком среди анакимов
  rationale: Определённая форма הַגָּדוֹל в данном контексте допускает понимание Арбы как наиболее выдающейся фигуры, однако еврейская конструкция не требует однозначно грамматической превосходной степени; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис упрощён ради ясности, но союз «И» в заключительной фразе сохранён. Все имена переданы последовательно и без конфессионально обусловленных толкований.
