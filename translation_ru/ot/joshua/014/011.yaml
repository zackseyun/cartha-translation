base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: ru
  text: 'Я и сегодня так же силён, как в тот день, когда Моисей послал меня. Сил у меня теперь столько же, сколько было тогда: и для битвы, и чтобы выходить и входить[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходить и входить». Это еврейское парное выражение может обозначать способность полноценно действовать, в том числе участвовать в военных походах или исполнять обязанности предводителя.'
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: Я и сегодня… силён
  rationale: Передаёт продолжающееся состояние и временной акцент עוֹדֶנִּי הַיּוֹם естественным современным русским выражением.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: как в тот день, когда Моисей послал меня
  rationale: Сохраняет прямое сравнение и временную конструкцию с инфинитивом, не утяжеляя русский синтаксис.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: Сил у меня теперь столько же, сколько было тогда
  rationale: Естественно воспроизводит эллиптическое еврейское сопоставление прежней и нынешней силы.
- source_word: לַמִּלְחָמָה
  choice: для битвы
  rationale: В контексте личной боевой готовности מִלְחָמָה обозначает участие в сражении; «битва» здесь конкретнее общего слова «война».
- source_word: וְלָצֵאת וְלָבוֹא
  choice: и чтобы выходить и входить
  rationale: Сохраняет образность и порядок еврейского парного выражения; его идиоматический смысл пояснён в сноске.
