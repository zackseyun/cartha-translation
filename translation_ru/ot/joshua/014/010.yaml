source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: ru
  text: И вот, Яхве сохранил мне жизнь[a], как и сказал, вот уже сорок пять лет — с тех пор как Яхве сказал Моисею это слово[b], когда Израиль шёл по пустыне[c]. И вот, сегодня мне восемьдесят пять лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставлял меня в живых».'
    reason: lexical_alternative
  - marker: b
    text: «Это слово» можно также перевести как «это дело», а по смыслу — «это обещание».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «во время странствий Израиля по пустыне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: сохранял мне жизнь
  rationale: Форма породы хифиль от חיה здесь означает поддержание или сохранение жизни на протяжении минувших лет, а не первоначальное дарование жизни.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: как Он и сказал
  rationale: Естественно передаёт соответствие прежним словам Яхве, не усиливая значение до более истолковательного «как обещал».
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: все эти сорок пять лет
  rationale: Передаёт протяжённость периода до настоящего момента и указательную силу זֶה.
- source_word: הַדָּבָר הַזֶּה
  choice: это слово
  rationale: Сохраняет широкое значение דָּבָר и прямую связь с тем, что Яхве сказал Моисею; «обещание» было бы более истолковательным.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: когда Израиль шёл по пустыне
  rationale: Сохраняет образ движения, выраженный הלך, и естественно обозначает время странствий Израиля.
- source_word: הִנֵּה
  choice: и вот
  rationale: Передаёт риторическое привлечение внимания в современном литературном русском без излишней архаичности.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: мне восемьдесят пять лет
  rationale: Естественный русский эквивалент древнееврейской возрастной формулы «сын восьмидесяти пяти лет».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер прежних слов Бога
  choice: сказал / это слово
  alternative: обещал / это обещание
  rationale: Контекст допускает понимание слов как обещания, однако исходные דִּבֵּר и דָּבָר сами по себе означают «сказал» и «слово/дело»; перевод не должен устранять эту лексическую широту.
translation_notes:
  register: Современный литературный и dignified русский регистр. Повтор «И вот» сохранён как риторическая особенность оригинала. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской норме; синтаксис при этом остаётся ясным и общедоступным.
