source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: ru
  text: Ведь Моисей дал наследие двум коленам и половине колена по ту сторону Иордана[a], а левитам не дал наследия среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Иорданом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит поясняющее основание к предшествующему контексту; «ведь» естественно передаёт эту дискурсивную функцию по-русски.
- source_word: נָתַן
  choice: дал
  rationale: Русский совершенный вид естественно обозначает предшествующее завершённое действие без обязательного отдельного плюсквамперфекта.
- source_word: נַחֲלַת
  choice: наследие
  rationale: Слово обозначает наследственное земельное владение, полученное при разделе; «наследие» сохраняет ключевую лексику стиха.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: двум коленам
  rationale: В контексте раздела земли מַטֶּה означает племенное колено, а дательный падеж естественно соответствует конструкции с נתן.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: и половине колена
  rationale: Точно передаёт принятую формулу о половине колена Манассии, не добавляя его названия в данный стих.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: по ту сторону Иордана
  rationale: Сохраняет пространственную идиому и её зависимость от точки отсчёта, не уточняя направление сверх исходного текста.
- source_word: וְלַלְוִיִּם
  choice: а левитам
  rationale: Формальный союз «и» здесь вводит контраст; русское «а» передаёт его естественно и без усиления до резкого противопоставления.
- source_word: לֹא נָתַן נַחֲלָה
  choice: не дал наследия
  rationale: Прямо передаёт отрицательную конструкцию и повторяет термин «наследие», как в еврейском тексте.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Сохраняет указание на отсутствие у левитов обычного земельного наследия среди названных племенных групп.
theological_decisions:
- issue: Характер отсутствия наследия у левитов
  choice: 'Сохранено: «не дал наследия среди них», то есть левитам не выделено обычное племенное земельное владение среди остальных колен.'
  alternative: 'Передать абсолютно: «левиты не получили никакого наследия».'
  rationale: Контекст Иисуса Навина и Пятикнижия различает отсутствие стандартного земельного надела и иные формы обеспечения левитов. Оборот «среди них» сохраняет эту смысловую границу без добавочного толкования.
translation_notes:
  register: Современный литературный русский, с традиционной и общепонятной библейской лексикой «колено», «левиты», «наследие». Синтаксис близок к оригиналу, но естественен для русского чтения; географическая формула намеренно не уточняет восточную или западную сторону.
