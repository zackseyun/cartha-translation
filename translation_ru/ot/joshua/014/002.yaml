  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: ru
  text: Наследие для девяти колен и половины колена было распределено по жребию, как Яхве повелел через Моисея[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея»; это древнееврейское выражение означает посредничество или действие через кого-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Предлог בְּ обозначает способ распределения; «по жребию» естественно передаёт установленную процедуру определения земельных уделов.
- source_word: נַחֲלָתָם
  choice: их наследие
  rationale: נַחֲלָה здесь означает наследственное земельное владение, данное Израилю; единственное число сохранено как собирательное.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как … повелел
  rationale: כַּאֲשֶׁר вводит соответствие ранее данному повелению, а совершенная форма צִוָּה указывает на предшествующий приказ; в русском это ясно из контекста без отдельной формы давнопрошедшего времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Буквально «рукой Моисея»; это древнееврейская идиома посредничества или передачи повеления.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: для девяти колен и половины колена
  rationale: לְ отмечает получателей наследия; מַטֶּה в данном контексте означает «колено», а не буквальный посох.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Посредничество Моисея в выражении בְּיַד מֹשֶׁה
  choice: через Моисея
  alternative: рукой Моисея; посредством Моисея
  rationale: Выражение указывает, что повеление Яхве было дано при посредничестве Моисея, не определяя подробнее характер этого посредничества.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным синтаксисом. Пассивная конструкция восполняет подразумеваемое в еврейском контексте распределение наследия, не называя дополнительного действующего лица. Маркер сноски поставлен при выражении, к которому относится пояснение.
