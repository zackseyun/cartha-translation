  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: ru
  text: Но мои братья, пошедшие со мной, лишили народ мужества, а я всецело следовал за ГОСПОДОМ, моим Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: мои братья
  rationale: Буквально передаёт родственное обозначение; в контексте речь о соплеменниках-разведчиках, но текст называет их «братьями».
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: лишили народ мужества
  rationale: Еврейская идиома буквально означает «растопили сердце народа»; естественный русский эквивалент ясно передаёт вызванные страх и утрату решимости.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: во всём следовал за
  rationale: Идиома выражает полную, неуклонную верность и следование; «во всём следовал» сохраняет полноту действия без неестественной кальки.
- source_word: יהוה
  choice: ГОСПОДОМ
  rationale: Передача тетраграмматона традиционным русским титулом прописными буквами, позволяющим отличить его от обычного אֲדֹנָי.
theological_decisions:
- issue: Характер верности Халева в выражении מִלֵּאתִי אַחֲרֵי יהוה
  choice: я во всём следовал за ГОСПОДОМ
  alternative: я в точности исполнил волю ГОСПОДА
  rationale: Сохранён образ следования за Богом и утверждение полноты верности; перевод не превращает его слова в более широкое заявление о безгрешности или совершенном исполнении всей Божьей воли.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Союз «а» естественно передаёт контраст וְאָנֹכִי. Идиома о таянии сердца передана смысловым русским выражением, чтобы избежать неясной кальки.
