revisions:
- from: Ведь потомки Иосифа составляли два колена — Манассиино и Ефремово. Левитам не дали удела в этой земле, а только города, чтобы жить в них, и пастбища вокруг этих городов[a] — для их скота и имущества.
  to: Ведь потомки Иосифа составляли два колена — Манассия и Ефрем. Левитам не дали удела в земле, а только города, чтобы жить в них, и пастбища вокруг этих городов[a] — для их скота и имущества.
  rationale: Исправлены формы названий колен на естественные для современного русского «Манассия и Ефрем» и снята не обусловленная оригиналом указательность в выражении «в этой земле». Остальные решения сохраняют смысл и регистр оригинала.
