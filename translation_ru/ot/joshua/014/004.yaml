base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: ru
  text: Ведь потомки Иосифа составляли два колена — Манассия и Ефрем. Левитам не дали удела в земле, а только города, чтобы жить в них, и пастбища вокруг этих городов[a] — для их скота и имущества.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть незастроенные земли при левитских городах, использовавшиеся прежде всего для выпаса скота.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит пояснение к предыдущему утверждению; «ведь» естественно передаёт эту связь по-русски.
- source_word: בְנֵי יוֹסֵף
  choice: потомки Иосифа
  rationale: В данном контексте речь идёт не только о непосредственных сыновьях Иосифа, но о произошедших от них племенных группах.
- source_word: שְׁנֵי מַטּוֹת
  choice: два колена
  rationale: מַטֶּה здесь обозначает племенное подразделение Израиля; «колено» — укоренившийся и понятный русский библейский термин.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: Манассиино и Ефремово
  rationale: Прилагательные ясно показывают, что названы два колена, происходящие от Манассии и Ефрема.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: Левитам не дали удела
  rationale: Сохранена активная форма неопределённо-личного предложения; «удел» передаёт долю земли при распределении.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Определённая форма указывает на землю, которую распределяли в данном повествовательном контексте.
- source_word: כִּי אִם
  choice: а только
  rationale: Оборот вводит единственное исключение из отрицания и естественно звучит по-русски.
- source_word: עָרִים לָשֶׁבֶת
  choice: города, чтобы жить в них
  rationale: Передано целевое значение инфинитива и сохранён простой современный синтаксис.
- source_word: מִגְרְשֵׁיהֶם
  choice: пастбища вокруг этих городов
  rationale: Термин обозначает незастроенные земли при левитских городах, предназначенные прежде всего для выпаса; явное указание на расположение предотвращает понимание слова как отдалённых пастбищ.
- source_word: לְמִקְנֵיהֶם וּלְקִנְיָנָם
  choice: для их скота и имущества
  rationale: Различены скот и более широкое имущество; формулировка сохраняет обобщённость последнего слова.
