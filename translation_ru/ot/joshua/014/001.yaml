  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: ru
  text: Вот уделы, которые сыны Израиля[a] получили в наследие в земле Ханаан и которыми их наделили[b] священник Елеазар, Иисус, сын Навина, и главы отцовских домов[c] племён сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально по-еврейски: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые священник Елеазар, Иисус, сын Навина, и главы отцовских домов племён сынов Израиля передали им в наследие». В еврейском тексте в обеих частях стиха повторяется один и тот же корень со значением наследования и наделения наследством.'
    reason: lexical_alternative
  - marker: c
    text: Отцовские дома — семейно-родовые объединения внутри племён, основанные на общем происхождении.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот уделы
  rationale: Сочетание союза с указательным местоимением вводит новый раздел, сохраняя связь с предыдущим повествованием. Русское «вот» естественно выполняет эту указательную функцию без добавления временного значения.
- source_word: נָחֲלוּ
  choice: получили в наследие
  rationale: Форма Qal обозначает получение Израилем назначенной ему земли. Такое выражение передаёт значение наследственного удела и не сводит его к наследованию имущества после смерти.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено буквальное родственное обозначение народа; более идиоматичное «израильтяне» дано в примечании.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Слово «земля» сохранено, поскольку в контексте распределения уделов оно несёт важный территориальный смысл.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: которые распределили между ними
  rationale: Форма Niphal при названных распорядителях обозначает официальное наделение уделами. «Распределили между ними» ясно и естественно передаёт административное действие.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священник Елеазар
  rationale: Принятая русская библейская форма имени и естественное расположение титула перед именем.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисус, сын Навина
  rationale: Использованы устоявшиеся в русской библейской традиции формы имени и отчества-патронима.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: главы родов племён
  rationale: «Главы» передаёт רָאשֵׁי, а «роды» естественно обозначает основанные на происхождении группы внутри племён, не перегружая русский текст буквальным выражением «отцовские дома».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: племён сынов Израиля
  rationale: Оборот отнесён к слову «племён», как того требует наиболее естественное понимание еврейской синтаксической связи.
theological_decisions:
- issue: Родственное заветное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Буквальное родственное обозначение сохраняет форму исходного текста и его заветно-родовую окраску; идиоматический этноним отмечен как допустимая альтернатива.
- issue: Социально-родовая терминология אֲבוֹת
  choice: роды
  alternative: отцовские дома
  rationale: «Роды» понятно современному русскому читателю и сохраняет представление о группах, связанных общим происхождением. Более буквальное выражение могло бы быть ошибочно понято как жилые дома.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Устоявшиеся формы имён «Елеазар» и «Иисус Навин» сохранены, но патроним передан синтаксически прозрачно: «Иисус, сын Навина». Плотная еврейская родовая формула передана понятно, а её буквальная форма вынесена в примечание.'
