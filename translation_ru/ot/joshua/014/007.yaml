- from: Мне было сорок лет, когда Моисей, раб Яхве, послал меня из Кадес-Варни разведать землю, и я принёс ему ответ, какой был у меня на сердце.[a]
  to: Мне было сорок лет, когда Моисей, раб Яхве, послал меня из Кадес-Варни разведать землю, и я передал ему то, что было у меня на сердце.[a]
