  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: ru
  text: Мне было сорок лет, когда Моисей, раб Яхве, послал меня из Кадес-Варни разведать землю, и я передал ему то, что было у меня на сердце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я принёс ему сообщение согласно тому, что было у меня на сердце».'
    reason: Лексико-синтаксическая альтернатива для וָאָשֵׁב אֹתוֹ דָּבָר כַּאֲשֶׁר עִם לְבָבִי; сохраняет буквальнее образ принесённого сообщения и соответствие внутреннему убеждению, не уточняя характер этого убеждения.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: Мне было сорок лет
  rationale: Естественная русская передача древнееврейского возрастного оборота, буквально «я — сын сорока лет».
- source_word: בִּשְׁלֹחַ
  choice: когда ... послал меня
  rationale: Инфинитивная конструкция с בְּ обозначает временное обстоятельство; по-русски естественно придаточное времени.
- source_word: עֶבֶד יְהוָה
  choice: раб Яхве
  rationale: «Раб» сохраняет традиционный библейский почётный титул Моисея и выражает его принадлежность и служение Богу, не сводясь здесь к бытовому обозначению порабощённого человека.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное Божье имя, стоящее в еврейском тексте.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: из Кадес-Варни
  rationale: Устоявшаяся в русской библейской традиции форма сложного топонима с нормативным управлением предлога «из».
- source_word: לְרַגֵּל אֶת הָאָרֶץ
  choice: разведать землю
  rationale: Глагол обозначает целенаправленную разведку территории; «разведать» естественно и точно передаёт смысл, не добавляя отрицательной окраски слова «шпионить».
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: и я принёс ему ответ
  rationale: Идиоматически передаёт возвращение к пославшему с сообщением; «ответ» сохраняет единственное число דָּבָר и естественнее по-русски, чем буквальное «вернул ему слово».
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: какой был у меня на сердце
  rationale: 'Сохраняет образ сердца и намеренную смысловую открытость фразы: речь может идти об искреннем убеждении, внутренней оценке или честном сообщении.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем Яхве и титулом «Господь».
- issue: Смысл כַּאֲשֶׁר עִם לְבָבִי
  choice: какой был у меня на сердце
  alternative: согласно моему убеждению / от чистого сердца
  rationale: Выбранная формулировка не решает однозначно, подчёркивает ли Халев своё внутреннее убеждение, искренность или верность сообщённой оценке, и потому сохраняет богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок слов сглажен для естественности, а метафора сердца сохранена. Маркер сноски поставлен непосредственно после относящейся к ней фразы.
