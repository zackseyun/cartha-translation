  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: ru
  text: 'И Моисей поклялся в тот день, говоря: «Непременно[a] земля, по которой ступала твоя нога, будет наследием тебе и твоим сыновьям[b] навеки, потому что ты всецело следовал за Яхве, моим Богом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская формула буквально: «если не»; в контексте клятвы она выражает усиленное утверждение: «непременно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и твоим потомкам». Буквально по-еврейски: «сыновьям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Точно и естественно передаёт глагол שׁבע в нифале, обозначающий принесение клятвы.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое соответствие еврейскому обстоятельству времени.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохраняет стандартную формулу введения прямой речи и торжественный библейский регистр.
- source_word: אִם לֹא
  choice: непременно
  rationale: В контексте клятвы это не буквальное условие, а усилительная клятвенная формула; «непременно» передаёт её утвердительную силу.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: земля, по которой ступала твоя нога
  rationale: Сохраняет конкретный образ ноги, ступавшей по земле, и единственное число исходного текста.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: будет наследием тебе
  rationale: Передаёт будущее значение и смысл נַחֲלָה как наследственного владения или удела.
- source_word: וּלְבָנֶיךָ
  choice: и твоим сыновьям
  rationale: Формально сохраняет явно выраженное в еврейском тексте слово «сыновья»; возможное контекстуальное значение «потомки» отмечено в сноске.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Естественно и торжественно передаёт продолжительность עַד עוֹלָם.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: потому что ты во всём следовал за
  rationale: Еврейская идиома означает полное, безоговорочное следование; оборот «во всём следовал за» сохраняет значение полноты и образ следования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהָי
  choice: моим Богом
  rationale: Сохраняет явно выраженный суффикс первого лица единственного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» наиболее прямо сохраняет это, не подменяя имя титулом.
- issue: Значение וּלְבָנֶיךָ
  choice: и твоим сыновьям
  alternative: и твоим потомкам
  rationale: Основной текст сохраняет формально мужское множественное число, а более широкое династическое значение не исключается и указано в сноске.
- issue: Сила выражения עַד עוֹלָם
  choice: навеки
  alternative: навсегда; на все времена
  rationale: «Навеки» сохраняет сильную формулировку текста, не уточняя сверх контекста характер или условия длительности наследственного владения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому оригиналу, но не становится неестественным; конкретный образ «ступала твоя нога» и клятвенная сила выражения сохранены.
