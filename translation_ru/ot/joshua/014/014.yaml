base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: ru
  text: Поэтому Хеврон стал наследственным владением Халева, сына Иефоннии, кенезея, и остаётся им до сегодняшнего дня, потому что Халев всем сердцем следовал за Яхве, Богом Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская идиома буквально использует образ «исполнить вслед за Яхве» и означает следовать за Ним полностью, с безраздельной верностью. Возможный перевод: «неуклонно следовал за Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим пожалованием земли.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: стал наследственным владением
  rationale: Глагольная конструкция обозначает переход Хеврона во владение Халева как назначенного ему удела.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Устоявшаяся русская форма названия города.
- source_word: כָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Халев, сын Иефоннии, кенезей
  rationale: Использованы традиционные русские формы имён и естественная передача этнического определения.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и понятное выражение, указывающее на продолжение положения до времени повествователя.
- source_word: יַעַן אֲשֶׁר
  choice: потому что
  rationale: Прямо и естественно вводит основание пожалования.
- source_word: מִלֵּא אַחֲרֵי
  choice: всем сердцем следовал за
  rationale: Передаёт смысл еврейской идиомы — полную, безраздельную верность — без буквального и неясного «наполнил вслед».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет заветное определение Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер верности Халева в идиоме מִלֵּא אַחֲרֵי
  choice: всем сердцем следовал за
  alternative: полностью следовал за
  rationale: Выбранная формулировка выражает целостную, безраздельную преданность, не сводя её лишь к внешнему послушанию.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Наследственное владение» уточняет земельно-удельный смысл נַחֲלָה; оборот «до сего дня» сохранён как привычный и понятный библейский идиом.
