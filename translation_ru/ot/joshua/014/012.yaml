source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: ru
  text: Итак, дай мне эту горную область[a], о которой Яхве говорил в тот день. Ведь ты сам слышал в тот день, что там живут анакимы и стоят большие укреплённые города. Может быть, Яхве будет со мной[b], и я изгоню их, как сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эту гору». Еврейское הָהָר может обозначать как отдельную гору, так и гористую область; в данном контексте вероятнее второе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Может быть, Яхве — со мной». В еврейском тексте нет глагола; по контексту речь идёт о надежде на присутствие и помощь Яхве в предстоящей борьбе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Связный дискурсивный переход к просьбе Халева; передаёт сочетание соединительного וְ и временно-логического עַתָּה естественным современным русским оборотом.
- source_word: תְּנָה לִּי
  choice: дай мне
  rationale: Прямо передаёт императив נתן и косвенное дополнение, сохраняя решительность просьбы.
- source_word: אֶת־הָהָר הַזֶּה
  choice: эту горную область
  rationale: הַר может обозначать как отдельную гору, так и гористую местность; в контексте земельного удела вероятнее региональное значение.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: о которой Яхве говорил
  rationale: Сохраняет основное значение глагола דִּבֶּר — «говорил», не подменяя его более истолковывающим «обещал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: Ведь ты сам слышал
  rationale: כִּי вводит обоснование, а явное местоимение אַתָּה придаёт подлежащему эмфатический оттенок, переданный словом «сам».
- source_word: כִּי עֲנָקִים שָׁם
  choice: что там живут анакиты
  rationale: Этноним передан традиционно понятной русской формой; добавление «живут» естественно раскрывает безглагольное предложение, не меняя его смысла.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: и стоят большие укреплённые города
  rationale: Глагол «стоят» естественно связывает вторую безглагольную конструкцию с местностью; оба определения сохранены.
- source_word: אוּלַי
  choice: Может быть
  rationale: Сохраняет выраженную в еврейском тексте возможность и сдержанную надежду, не превращая её в уверенное утверждение.
- source_word: יְהוָה אוֹתִי
  choice: Яхве будет со мной
  rationale: Будущее время естественно восстанавливает пропущенную связку в контексте предстоящего завоевания, сохраняя образ божественного присутствия, а не заменяя его толкованием «поможет».
- source_word: וְהוֹרַשְׁתִּים
  choice: и я изгоню их
  rationale: Порода hифиль глагола ירשׁ здесь обозначает удаление жителей с земли; «изгоню» ясно и сжато передаёт это значение.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как сказал Яхве
  rationale: Буквально и естественно передаёт заключительную ссылку на слово Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте трижды употреблено личное имя, поэтому транслитерация сохраняет его отличие от титула.
- issue: Смысл אוּלַי יְהוָה אוֹתִי
  choice: Может быть, Яхве будет со мной
  alternative: Возможно, Яхве поможет мне
  rationale: Выбранная формулировка сохраняет и модальную неуверенность אוּלַי, и буквальный образ присутствия Бога, не сводя богословское напряжение к однозначному обещанию помощи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; повтор «в тот день» сохранён вслед за оригиналом. Этноним «анакиты» употреблён без поясняющей перифразы, а неоднозначность הָהָר и эллипсис יְהוָה אוֹתִי отмечены в сносках.
