  text: И благословил его Иисус Навин, и отдал Хеврон Халеву, сыну Иефоннии, в наследие.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: благословил его
  rationale: Форма глагола ברך с суффиксом 3-го лица мужского рода единственного числа буквально означает «благословил его». Местоимение естественно сохраняется по-русски; из контекста ясно, что речь идёт о Халеве.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Устоявшаяся русская библейская форма имени позволяет отличить этого Иисуса от других носителей того же имени и понятна современному читателю.
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן означает «дать». В контексте распределения земли «отдал» естественно передаёт совершённую передачу удела, не добавляя юридических оттенков.
- source_word: אֶת חֶבְרוֹן
  choice: Хеврон
  rationale: אֶת — непереводимый показатель прямого дополнения; חֶבְרוֹן передано традиционной русской формой географического названия.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Халеву, сыну Иефоннии
  rationale: Предлог לְ обозначает получателя. Имена переданы в устойчивых русских библейских формах; приложение «сыну Иефоннии» сохраняет родословное обозначение.
- source_word: לְנַחֲלָה
  choice: в наследие
  rationale: נַחֲלָה здесь обозначает наследственный земельный удел. Русское «в наследие» кратко и естественно сохраняет этот смысл.
