base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: ru
  text: 'Иисус Навин сказал им: «Если ты — многочисленный народ, поднимись в лес и расчисти там себе землю[a] в краю ферезеев и рефаимов, поскольку нагорье Ефрема[b] для тебя слишком тесно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимись в лес и расчисти его там для себя». Еврейский глагол означает расчистку покрытой лесом земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гора Ефрема». Здесь это название горной области, отведённой Ефрему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: многочисленный народ
  rationale: Сочетание обозначает прежде всего численность народа; этот вариант естественно передаёт смысл, не усиливая качественное значение слова רַב как «великий».
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: поднимись в лес
  rationale: Глагол выражает движение вверх или в нагорную местность, а направительная форма существительного указывает на движение в лес. Единственное число сохранено как коллективное обращение к народу.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: расчисти там себе землю
  rationale: Пиэль глагола ברא здесь означает расчистку лесистой земли. Слово «землю» восполняет подразумеваемый объект, а «себе» передаёт значение לְךָ.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: в краю ферезеев и рефаимов
  rationale: Этнонимы переданы традиционными русскими формами без истолкования природы рефаимов; «край» естественно выражает территориальный смысл אֶרֶץ.
- source_word: כִּי אָץ לְךָ
  choice: поскольку ... для тебя слишком тесно
  rationale: Форма передаёт стеснённость или недостаток пространства; «слишком тесно» ясно связывает это с многочисленностью народа.
- source_word: הַר אֶפְרָיִם
  choice: нагорье Ефрема
  rationale: В территориальном контексте הַר обозначает не отдельную гору, а горную или холмистую область.
theological_decisions:
- issue: Число обращения к потомкам Иосифа
  choice: 'Сохранено единственное число: «ты… поднимись… расчисти… для тебя»'
  alternative: 'Множественное число: «вы… поднимитесь… расчистите… для вас»'
  rationale: В еврейском тексте после «сказал им» стоит последовательное единственное число, поскольку адресаты рассматриваются как один многочисленный народ. Русское коллективное обращение к «народу» позволяет сохранить эту особенность без неясности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Коллективное обращение в единственном числе сохранено по еврейскому тексту; этнонимы даны в устоявшихся русских формах.
