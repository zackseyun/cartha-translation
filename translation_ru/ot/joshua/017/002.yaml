base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: ru
  text: 'И получили удел остальные потомки Манассии, по их родам: потомки Авиезера, потомки Хелека, потомки Асриила, потомки Сихема, потомки Хефера и потомки Шемиды. Это были потомки мужского пола Манассии, сына Иосифа,[a] по их родам.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Манассии, сына Иосифа, мужского пола». Уточнение подчёркивает мужские родовые линии в отличие от дочерей Целофхада, упомянутых в ближайшем контексте.'
    reason: lexical_and_contextual_note
  - marker: b
    text: 'Или: «по их семействам». Еврейское слово обозначает родовую группу внутри колена.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: И получили удел остальные потомки Манассии
  rationale: В контексте распределения земли конструкция וַיְהִי לְ указывает на то, что перечисленным родовым линиям достался удел. Явное «получили удел» естественно по-русски и передаёт контекстуально подразумеваемое отношение, тогда как буквальное «и было для» звучало бы неясно. בנים здесь охватывает потомков и родовые линии, а не только непосредственных сыновей.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה в контексте племенного устройства обозначает родовую группу внутри колена. Русское «род» точнее современного «семья» и соответствует достоинству юридико-генеалогического перечня.
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: потомки Авиезера ... потомки Шемиды
  rationale: Повтор בְּנֵי обозначает происходящие от названных предков родовые линии. «Потомки» сохраняет генеалогический смысл и избегает ошибочного впечатления, будто речь только о непосредственных сыновьях.
- source_word: אֵלֶּה בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף הַזְּכָרִים
  choice: Это были потомки мужского пола Манассии, сына Иосифа
  rationale: הַזְּכָרִים прямо выделяет мужских потомков на фоне дочерей Салпаада в ближайшем контексте. Формулировка сохраняет это противопоставление без неестественного русского сочетания «сыновья мужского пола».
- source_word: אַשְׂרִיאֵל; שֶׁכֶם; חֵפֶר; שְׁמִידָע
  choice: Асриил; Сихем; Хефер; Шемида
  rationale: Использованы узнаваемые русские библейские формы имён с последовательной передачей соответствующих еврейских имён.
theological_decisions:
- issue: Противопоставление мужских родовых линий дочерям Салпаада
  choice: Сохранить явное уточнение «мужского пола»
  alternative: Опустить הַזְּכָרִים как подразумеваемое или перевести просто «сыновья»
  rationale: Уточнение присутствует в еврейском тексте и существенно для ближайшего контекста наследования; его сохранение не вводит внешнего толкования.
translation_notes:
  register: Современный литературный русский с достоинством повествовательно-юридического перечня. Повтор «потомки» сохраняет упорядоченность исходной родовой формулы, но союз оставлен только перед последним элементом по нормам естественного русского перечисления.
