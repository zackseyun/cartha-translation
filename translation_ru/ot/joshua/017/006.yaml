  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: ru
  text: Ибо дочери Манассии получили наследственный удел среди его сыновей[a], а земля Галаада досталась остальным сыновьям Манассии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «унаследовали наследство среди его сыновей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земля Галаада была у остальных сыновей Манассии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит пояснение к предшествующему распределению уделов; «ибо» сохраняет объяснительную связь и соответствует dignified современному повествовательному регистру.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: дочери Манассии
  rationale: Прямая передача сопряжённой конструкции; слово «дочери» сохраняется, поскольку далее они явно противопоставлены сыновьям.
- source_word: נָחֲלוּ נַחֲלָה
  choice: получили наследственный удел
  rationale: Однокоренная глагольно-именная конструкция обозначает получение земли по наследственному праву. Такая передача естественна по-русски и сохраняет земельно-юридический смысл.
- source_word: בְּתוֹךְ בָּנָיו
  choice: среди его сыновей
  rationale: Сохраняется буквальное указание на сыновей, а не обобщённое «детей», поскольку противопоставление дочерей и сыновей существенно для смысла стиха; местоимение относится к Манассии.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: а земля Галаадская
  rationale: Естественная русская передача географического названия и территории; противительно-сопоставительное «а» ясно связывает две части распределения.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: досталась остальным сыновьям Манассии
  rationale: Конструкция с היה ל выражает принадлежность или результат распределения. «Досталась» естественно передаёт получение территории как удела, а «остальным» отделяет эту группу от упомянутых дочерей.
theological_decisions:
- issue: Гендерно выраженное наследственное распределение
  choice: Явно сохранить «дочери» и «сыновья»
  alternative: Обобщить как «дети» или «потомки»
  rationale: Еврейский текст намеренно различает בְּנוֹת и בָּנִים; устранение различия скрыло бы юридическое и повествовательное напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Наследственный удел» точно и понятно обозначает полученную землю; синтаксис сохраняет сопоставление дочерей и остальных сыновей без конфессионального истолкования.
