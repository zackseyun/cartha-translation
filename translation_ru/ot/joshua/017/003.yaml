  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: ru
  text: 'У Салпаада, сына Хефера, сына Галаада, сына Махира, сына Манассии, не было сыновей, а только дочери. Вот имена его дочерей: Махла, Ноа, Хогла, Милка и Фирца.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: У Салпаада
  rationale: Сочетание וְ с לְ вводит случай Салпаада и вместе с последующим לוֹ естественно передаётся русской конструкцией обладания «у Салпаада… не было». Союз וְ не требует отдельного «и» вне контекста данного стиха.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: сына Хефера, сына Галаада, сына Махира, сына Манассии
  rationale: Повторение «сына» сохраняет явно выраженную в еврейском тексте родословную цепь, важную для контекста наследования.
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: не было сыновей, а только дочери
  rationale: 'Передана противопоставленная конструкция: בָּנִים здесь означает именно сыновей, а כִּי אִם подчёркивает исключение — были только дочери.'
- source_word: וְ/אֵלֶּה שְׁמוֹת בְּנֹתָי/ו
  choice: Вот имена его дочерей
  rationale: Естественная современная русская формула представления перечня; «его» точно передаёт притяжательный суффикс.
- source_word: צְלָפְחָד; חֵפֶר; גִּלְעָד; מָכִיר; מְנַשֶּׁה
  choice: Салпаад; Хефер; Галаад; Махир; Манассия
  rationale: Использованы узнаваемые русские библейские формы личных имён, соотнесённые с еврейским текстом.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Махла, Ноа, Хогла, Милка и Фирца
  rationale: Имена переданы в традиционных русских библейских формах. Форма «Ноа» в русском языке ясно отличается от имени Ной, поэтому отдельное пояснение о поле носителя не требуется.
