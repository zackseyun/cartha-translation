base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: ru
  text: У Манассии были на землях Иссахара и Асира Беф-Сан и зависимые от него селения[a], Ивлеам и зависимые от него селения, жители Дора и зависимые от него селения, жители Аин-Дора и зависимые от него селения, жители Фаанаха и зависимые от него селения и жители Мегиддо и зависимые от него селения — три области[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с его дочерьми». Так назывались селения, зависевшие от главного города.'
    reason: cultural_note
  - marker: b
    text: 'Или: «три округа»; значение древнееврейского выражения не вполне ясно. Возможно также топографическое понимание: «три возвышенности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: У Манассии были
  rationale: Еврейская конструкция выражает принадлежность Манассии; такая передача естественна по-русски и не уточняет сверх текста, шла ли речь о владении или уделе.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: на землях Иссахара и Асира
  rationale: Предлог указывает на расположение городов внутри племенных территорий; добавление «землях» делает территориальный смысл ясным.
- source_word: בֵּית שְׁאָן
  choice: Беф-Сан
  rationale: Использована укоренившаяся русская библейская форма топонима.
- source_word: בְנוֹתֶיהָ
  choice: зависимые от него селения
  rationale: Буквально «его дочери» — древнееврейское обозначение поселений, зависевших от главного города; смысл передан ясно и без неестественной для русского языка кальки.
- source_word: יִבְלְעָם
  choice: Ивлеам
  rationale: Транслитерация топонима в форме, близкой к принятой русской библейской традиции.
- source_word: אֶת יֹשְׁבֵי דֹאר
  choice: жители Дора
  rationale: Причастная конструкция означает жителей или обитателей города; выбран краткий современный эквивалент.
- source_word: עֵין דֹּר
  choice: Аин-Дор
  rationale: Транслитерация сохраняет составной характер древнееврейского названия.
- source_word: תַעְנַךְ
  choice: Фаанах
  rationale: Использована узнаваемая русская библейская форма топонима.
- source_word: מְגִדּוֹ
  choice: Мегиддо
  rationale: Общепринятая современная русская форма топонима.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: три области
  rationale: Редкое и трудное выражение, вероятно, обозначает три географические или административные территории; нейтральное «области» сохраняет эту неопределённость лучше, чем топографическое «возвышенности».
theological_decisions: []
