  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: ru
  text: И когда сыны Израиля[a] окрепли, они заставили хананеев отбывать трудовую повинность[b], но полностью их так и не изгнали[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть израильтяне; буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подчинили хананеев принудительным работам»; возможное значение: «обложили хананеев данью».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте глагол усилен сочетанием инфинитива с личной формой того же корня: они так и не изгнали их полностью.'
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: И когда
  rationale: Сочетание вводит новое развитие повествования и обстоятельство времени. Естественное русское «И когда» передаёт эту функцию без архаичного «и было».
- source_word: חָזְקוּ
  choice: окрепли
  rationale: Глагол обозначает приобретение силы или могущества; «окрепли» кратко и естественно передаёт становление сильными.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён образный родственный оборот древнееврейского текста, который здесь служит общепринятым названием народа.
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: они заставили хананеев отбывать трудовую повинность
  rationale: מַס в данном контексте обозначает принудительную службу или трудовую повинность. Формулировка ясно передаёт подневольный характер труда, а собирательное единственное число «хананей» естественно выражено множественным числом.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: но полностью их так и не изгнали
  rationale: Инфинитив абсолютный при личной форме того же корня усиливает выражение. Сочетание «полностью» и «так и не» передаёт подчёркнутую незавершённость изгнания; местоимение во множественном числе относится к собирательно названным хананеям.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; потомки Израиля
  rationale: Буквальный родственный образ сохранён как традиционное национальное обозначение; сноска поясняет, что речь идёт об израильтянах в целом.
- issue: Значение מַס
  choice: трудовая повинность
  alternative: дань; принудительные работы
  rationale: Контекст говорит о подчинении оставшихся хананеев. Выбранный вариант сохраняет вероятное значение обязательного труда, не исключая засвидетельствованного значения дани, указанного в сноске.
- issue: Усилительная конструкция הוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: полностью их так и не изгнали
  alternative: не лишили их владений; вовсе не изгнали их
  rationale: Перевод сохраняет усиление и подчёркивает, что изгнание не было доведено до конца, не превращая конструкцию в утверждение о полном отсутствии попыток изгнания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Устранены ненужные архаизмы, но сохранён традиционный оборот «сыны Израиля». Формулировка о трудовой повинности доступна широкому читателю и не смягчает принудительный характер подчинения.
