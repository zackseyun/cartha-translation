  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: ru
  text: 'Но нагорная страна будет твоей[a]: ведь это лесная местность, и ты расчистишь её; её крайние пределы будут твоими[b]. Ты вытеснишь хананеев[c], хотя у них железные колесницы и хотя они сильны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гора будет твоей». Еврейское הַר может означать как отдельную гору, так и нагорную страну; здесь, вероятно, имеется в виду возвышенная область, отведённая потомкам Иосифа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её крайние части будут твоими»; речь идёт о внешних пределах или окраинах лесистой нагорной области.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте буквально: «хананея… у него… он силён»; формы единственного числа употреблены собирательно, обозначая народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: нагорная страна
  rationale: В контексте раздела земли слово обозначает не отдельную гору, а возвышенную область; этот вариант естественно передаёт территориальный смысл.
- source_word: יִהְיֶה לָּךְ
  choice: будет твоей
  rationale: Оборот היה + ל выражает принадлежность или предоставление во владение.
- source_word: כִּי
  choice: но / ведь / хотя
  rationale: 'Повторяющийся союз выполняет разные функции: в начале связывает утверждение с противопоставлением предыдущему контексту, далее вводит основание, а в последних двух случаях имеет уступительный смысл.'
- source_word: יַעַר
  choice: лесная местность
  rationale: Так сохраняется значение покрытой лесом территории и естественная связь с «нагорной страной».
- source_word: וּבֵרֵאתוֹ
  choice: ты расчистишь её
  rationale: Пиэль глагола ברא здесь означает расчистку лесистой земли для освоения, а не «создание».
- source_word: וְהָיָה לְךָ תֹּצְאֹתָיו
  choice: вся она до самых своих пределов будет твоей
  rationale: תֹּצְאוֹת обозначает крайние части или внешние пределы территории; перестройка делает этот смысл ясным по-русски.
- source_word: תוֹרִישׁ
  choice: ты вытеснишь
  rationale: Хифиль ירש означает лишить прежних жителей владения, изгнать их с земли; «вытеснишь» сохраняет военный и территориальный смысл.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Единственное число в еврейском употреблено собирательно для народа; по-русски естественно множественное число.
- source_word: רֶכֶב בַּרְזֶל
  choice: железные колесницы
  rationale: Краткий и традиционно понятный эквивалент выражения о колесницах, оснащённых железом.
- source_word: חָזָק הוּא
  choice: они сильны
  rationale: Формально единственное число согласуется с собирательным названием народа; русское множественное число ясно передаёт референт.
theological_decisions:
- issue: Собирательное единственное число в обозначении хананеев
  choice: 'Передать множественным числом: «хананеев… у них… они сильны»'
  alternative: 'Формально сохранить единственное число: «хананея… у него… он силён»'
  rationale: Еврейский этноним в единственном числе обозначает народ в целом. Множественное число в современном русском яснее и не меняет смысла.
- issue: Оттенки повторяющегося כִּי
  choice: Передать контекстуально как «но», «ведь» и «хотя»
  alternative: Во всех случаях повторить один и тот же союз «ибо/потому что»
  rationale: У союза здесь различаются дискурсивная, причинная и уступительная функции; механическое единообразие исказило бы связь частей стиха.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис умеренно формальный; сохранены причинная связь и уступительное напряжение исходного текста без искусственного разрешения.
