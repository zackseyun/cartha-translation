  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: ru
  text: И выпало Манассии десять уделов[a], кроме земли Галаада и Васана, что за Иорданом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Манассии досталось десять наделов»; еврейский текст буквально говорит, что уделы «выпали», то есть были определены по жребию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: выпало
  rationale: Сохраняет еврейскую идиому נפל в контексте распределения земли по жребию; форма единственного числа естественно согласуется в русском с количественной группой «десять уделов».
- source_word: חַבְלֵי
  choice: уделов
  rationale: В данном контексте חבל обозначает отмеренную и отведённую часть земли; «удел» точно и естественно передаёт земельное владение, полученное при распределении.
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Принятая русская библейская форма имени; дательный падеж передаёт לְ в конструкции получения уделов.
- source_word: עֲשָׂרָה
  choice: десять
  rationale: Прямое соответствие количественному числительному.
- source_word: לְבַד מֵאֶרֶץ
  choice: кроме земли
  rationale: Идиоматически передаёт то, что заиорданская земля не входит в число упомянутых десяти уделов.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Галаада и Васана
  rationale: Использованы устоявшиеся русские библейские формы географических названий.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: что за Иорданом
  rationale: Кратко и естественно передаёт относительное придаточное и географическое указание «по ту сторону Иордана», сохраняя зависимость от собирательного «земли».
