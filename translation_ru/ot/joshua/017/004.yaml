  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: ru
  text: 'И они предстали перед священником Елеазаром, перед Иисусом, сыном Навина, и перед вождями и сказали: «Яхве повелел Моисею дать нам наследственный удел среди наших братьев».[a] И он дал им, по повелению Яхве,[b] наследственный удел среди братьев их отца.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть среди мужчин их рода, которым выделялась родовая земля.
    reason: Культурно-правовое пояснение выражения «среди наших братьев».
  - marker: b
    text: 'Буквально: «по устам Яхве».'
    reason: Указание на буквальную форму еврейской идиомы אֶל־פִּי יְהוָה.
  - marker: c
    text: То есть внутри рода их отца, среди родственников по отцовской линии.
    reason: Пояснение родственной и наследственно-правовой функции выражения «среди братьев их отца».
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: они предстали
  rationale: Форма 3-го лица женского рода множественного числа относится к дочерям Салпаада. В официальной обстановке «предстали» естественно передаёт приближение к уполномоченным лицам.
- source_word: לִפְנֵי
  choice: перед
  rationale: Троекратный предлог сохраняет публично-юридическую структуру обращения к священнику, Иисусу Навину и вождям.
- source_word: הַנְּשִׂיאִים
  choice: вождями
  rationale: נְשִׂיאִים обозначает глав племён или общины; «вожди» сохраняет древнеизраильский общественный контекст и не создаёт монархического оттенка слова «князья».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: дать нам наследственный удел
  rationale: נַחֲלָה здесь означает наследуемую долю земли; сочетание «наследственный удел» яснее одного слова «наследство» выражает земельный характер дара.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: среди наших братьев
  rationale: Сохраняется мужская форма родственного обозначения и юридическая конкретность просьбы дочерей о доле среди мужчин их рода.
- source_word: וַיִּתֵּן
  choice: он дал
  rationale: Сохранено единственное число еврейского глагола; ближайшим действующим лицом, вероятно, является Иисус Навин, однако текст прямо его здесь не называет.
- source_word: אֶל־פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Еврейская идиома буквально означает «по устам Яхве»; выбран естественный русский эквивалент, передающий обязательную силу сказанного Богом.
- source_word: אֲחֵי אֲבִיהֶן
  choice: братьев их отца
  rationale: Буквально сохранено указание на братьев отца, то есть на родственников по отцовской линии, внутри удела которых дочери получили землю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Родственное обозначение אַחֵינוּ
  choice: наших братьев
  alternative: наших родственников
  rationale: Более конкретная формулировка сохраняет гендерную и правовую специфику древнего текста, не расширяя значение без необходимости.
- issue: Неявный субъект וַיִּתֵּן
  choice: он дал
  alternative: им дали
  rationale: Единственное число исходного глагола сохранено, а вероятная отсылка к Иисусу Навину не превращена в явно названного субъекта.
- issue: Значение אֲחֵי אֲבִיהֶן
  choice: братьев их отца
  alternative: родственников по отцовской линии
  rationale: Буквальная родственная формула сохраняет устройство наследования, тогда как более общее выражение было бы пояснением.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского регистра. Повтор «перед» сохранён ради торжественно-официальной структуры еврейской фразы; инфинитив לֵאמֹר естественно передан личной формой «и сказали». Все маркеры сносок размещены непосредственно после соответствующих фрагментов.
