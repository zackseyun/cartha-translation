base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: ru
  text: 'Иисус сказал дому Иосифа — Ефрему и Манассии: «Ты — многочисленный народ[a], и велика твоя сила; у тебя будет не один лишь удел[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий народ». Еврейское выражение может указывать как на многочисленность, так и на величие; в контексте распределения земли вероятнее речь идёт о численности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жребий». В книге Иисуса Навина это слово часто обозначает наследственный земельный удел, назначенный по жребию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: дому Иосифа
  rationale: Сохраняет родоплеменной библейский оборот; последующие имена Ефрема и Манассии поясняют, кого он обозначает.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: Ефрему и Манассии
  rationale: Передаёт пояснительное приложение к выражению «дому Иосифа» и явно называет оба племени.
- source_word: עַם רַב
  choice: народ многочисленный
  rationale: В контексте спора о земельном уделе רַב прежде всего указывает на численность, но примечание сохраняет возможное значение величия.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: и сила у тебя велика
  rationale: Естественно и с умеренной торжественностью передаёт именную конструкцию с притяжательным לָךְ.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: не один только удел будет у тебя
  rationale: «Удел» ясно передаёт земельную долю, назначенную по жребию; «только» выражает подразумеваемое контекстом ограничительное значение «одного».
- source_word: לֵאמֹר
  choice: опущено как отдельное слово перед прямой речью
  rationale: В современном русском конструкция «сказал…:» естественно выполняет функцию еврейского вводного инфинитива; буквальное «говоря» было бы тяжеловесно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Единственное число «ты / у тебя» сохранено вслед за еврейским текстом, который обращается к дому Иосифа как к единому народу. Пунктуация показывает, что Ефрем и Манассия поясняют выражение «дом Иосифа».
