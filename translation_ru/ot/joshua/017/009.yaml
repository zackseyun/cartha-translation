  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: ru
  text: Затем граница спустилась к потоку Кана[a] и шла южнее потока. Эти города принадлежали Ефрему и находились среди городов Манассии[b]. Граница Манассии проходила севернее потока и заканчивалась у моря[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к вади Кана». Еврейское слово נחל может означать также сезонное русло или овраг.'
    reason: lexical_alternative
  - marker: b
    text: То есть города Ефрема находились внутри территории, отведённой Манассии.
    reason: cultural_note
  - marker: c
    text: Здесь имеется в виду Средиземное море.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Затем граница спускалась
  rationale: В описаниях границ ירד обозначает движение линии вниз по рельефу или направлению; несовершенный вид естественно передаёт последовательное прохождение границы.
- source_word: נַחַל קָנָה
  choice: поток Кана
  rationale: נחל может обозначать поток, сезонное русло или овраг. «Поток» остаётся понятным и не утверждает постоянный характер водотока; географическое имя передано как «Кана».
- source_word: נֶגְבָּה לַנַּחַל
  choice: шла южнее потока
  rationale: Фраза указывает положение границы с южной стороны потока. Добавлен глагол «шла» для естественного русского синтаксиса без изменения пространственного смысла.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: Эти города принадлежали Ефрему
  rationale: Безглагольная конструкция выражает принадлежность или удел; «принадлежали» ясно передаёт территориальный смысл.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: хотя находились среди городов Манассии
  rationale: בְּתוֹךְ выражает нахождение внутри или среди владений Манассии. «Хотя» естественно выявляет подразумеваемое территориальное несоответствие, дополнительно пояснённое в сноске.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: Граница Манассии проходила севернее потока
  rationale: מִצְּפוֹן указывает на расположение с северной стороны; «проходила севернее» идиоматично для описания линии границы.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: и заканчивалась у моря
  rationale: תֹצְאוֹתָיו в формулах описания границ обозначает её конечный пункт. «У моря» сохраняет формулировку оригинала, а конкретное море названо в сноске.
