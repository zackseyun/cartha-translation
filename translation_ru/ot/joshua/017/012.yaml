  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: ru
  text: Но потомки Манассии не смогли вытеснить жителей этих городов, и хананеи упорно продолжали жить на этой земле.[a]
  philosophy: optimal-equivalence
  footnotes:
