    text: 'Или: «хананеи твёрдо решили жить на этой земле». В еврейском тексте стоит собирательное существительное в единственном числе и глагол, который может выражать готовность или решимость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: не смогли
  rationale: Передаёт неспособность или отсутствие возможности, выраженные глаголом יכל, без добавления мотивации.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: потомки Манассии
  rationale: Естественно передаёт буквальное «сыновья Манассии» как обозначение племенной группы и избегает ошибочного впечатления, будто речь лишь о непосредственных сыновьях.
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: вытеснить жителей этих городов
  rationale: В контексте завоевания Hiphil ירש означает лишить прежних обитателей владения, изгнать их. По-русски города сами по себе нельзя «вытеснить», поэтому подразумеваемый объект выражен естественно.
- source_word: וַיּוֹאֶל
  choice: упорно продолжали
  rationale: В сочетании с «жить» передаёт волю, решимость и устойчивое продолжение пребывания, не сводя значение лишь к повторяемости действия.
- source_word: הַכְּנַעֲנִי
  choice: хананеи
  rationale: Единственное число в еврейском употреблено собирательно; русское множественное число естественно обозначает народность.
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: Передаёт постоянное проживание или пребывание на данной территории.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: на этой земле
  rationale: Обозначает конкретную обсуждаемую территорию; русское управление «жить на земле» здесь естественнее буквального «в земле».
