  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: ru
  text: Жребий выпал колену Манассии, потому что он был первенцем Иосифа. Махиру, первенцу Манассии, отцу Галаада[a], поскольку он был воином, достались Галаад и Васан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предку Галаада» либо «основателю Галаада». Еврейское выражение «отец» может обозначать не только непосредственного родителя, но также предка или основателя рода либо поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: жребий выпал
  rationale: Передаёт результат распределения земли по жребию естественным современным русским выражением, не добавляя отсутствующего в исходнике временного наречия.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: колену Манассии
  rationale: מַטֶּה здесь обозначает племенную общность Израиля; традиционное русское «колено» ясно и уместно в библейском повествовании.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: потому что он был первенцем Иосифа
  rationale: Сохраняет объяснительную силу כִּי и относит местоимение к Манассии.
- source_word: לְמָכִיר
  choice: Махиру
  rationale: Дательный падеж передаёт распределительное значение לְ и указывает, какой ветви внутри колена досталась земля.
- source_word: בְּכוֹר מְנַשֶּׁה
  choice: первенцу Манассии
  rationale: Прямо сохраняет генеалогическое обозначение и значение первородства.
- source_word: אֲבִי הַגִּלְעָד
  choice: отцу Галаада
  rationale: Сохраняет образное и генеалогическое выражение исходного текста; более широкий смысл слова אָב пояснён в сноске.
- source_word: אִישׁ מִלְחָמָה
  choice: воином
  rationale: Естественно для современного русского языка передаёт человека, способного и опытного в военном деле, без архаичного буквального оборота «муж войны».
- source_word: וַיְהִי לוֹ
  choice: достались
  rationale: В контексте земельного удела выражает получение территории во владение.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Галаад и Васан
  rationale: Использованы закрепившиеся в русской библейской традиции формы географических названий.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Два предложения делают сложную еврейскую конструкцию понятной, сохраняя последовательность: удел колена, затем удел линии Махира. Маркер сноски поставлен непосредственно после выражения «отцу Галаада», к которому относится пояснение.'
