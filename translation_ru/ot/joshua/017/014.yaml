base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: ru
  text: 'Потомки Иосифа обратились к Иисусу Навину и сказали: «Почему ты дал мне в наследие один жребий и один земельный надел[a]? Ведь я — многочисленный народ, потому что Яхве доныне благословлял меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один участок земли». Еврейское слово может обозначать отмеренную часть земли или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת־יְהוֹשֻׁעַ
  choice: Потомки Иосифа обратились к Иисусу Навину
  rationale: בְּנֵי יוֹסֵף — корпоративное обозначение племён, происходящих от Иосифа; «потомки» яснее современному читателю, чем буквальное «сыновья». Оборот с דבר и прямым дополнением естественно передан как «обратились к».
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: ты дал мне в наследие
  rationale: Сохранено единственное число «мне», поскольку всё сообщество говорит о себе как об одном лице; נַחֲלָה обозначает наследственное земельное владение.
- source_word: גּוֹרָל אֶחָד
  choice: лишь один жребий
  rationale: גּוֹרָל может обозначать как сам жребий, так и определённый им удел. «Лишь» естественно выражает смысл жалобы, заключённый в вопросе и противопоставлении многочисленности народа.
- source_word: וְחֶבֶל אֶחָד
  choice: и один земельный надел
  rationale: חֶבֶל здесь означает отмеренную часть земли или территорию. «Земельный надел» ясно передаёт территориальный смысл, не отождествляя слово полностью с предшествующим גּוֹרָל.
- source_word: וַאֲנִי עַם רָב
  choice: Ведь я — многочисленный народ
  rationale: Сохранено примечательное сочетание корпоративного единственного числа «я» с существительным «народ». עַם רָב в данном контексте указывает прежде всего на многочисленность.
- source_word: עַד אֲשֶׁר עַד־כֹּה בֵּרְכַנִי
  choice: потому что ... доныне благословлял меня
  rationale: Сжатый древнееврейский оборот связывает многочисленность с благословением, продолжавшимся до настоящего момента. «Доныне» непосредственно отражает עַד־כֹּה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Корпоративное единственное число в речи племён Иосифа
  choice: «мне», «я», «меня»
  alternative: «нам», «мы», «нас»
  rationale: Хотя говорит группа потомков Иосифа, древнееврейский текст последовательно представляет её как единое лицо. Эта значимая грамматическая особенность сохранена.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис прямой речи сделан естественным, но корпоративное единственное число и различие между «жребием» и земельным наделом сохранены. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
