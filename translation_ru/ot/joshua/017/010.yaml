  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: ru
  text: К югу земля принадлежала Ефрему, а к северу — Манассии; море было её границей. На севере их земли граничили[a] с Асиром, а на востоке — с Иссахаром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соприкасались». Еврейский глагол в описаниях территорий может означать «встречаться», «касаться» или «граничить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם וְצָפוֹנָה לִמְנַשֶּׁה
  choice: К югу земля принадлежала Ефрему, а к северу — Манассии
  rationale: Направительные формы переданы как обозначения сторон света, а подразумеваемые в эллиптической еврейской конструкции земля и принадлежность выражены явно для естественности русского текста.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: море было её границей
  rationale: גְּבוּל в описании земельного удела естественно передаётся словом «граница»; местоимение соотнесено с явно названной в переводе землёй.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: они соприкасались с Асиром
  rationale: В территориальном описании פגע указывает на соприкосновение земель или границ. Множественное число глагола сохранено местоимением «они», без искусственного уточнения его не вполне явного референта.
- source_word: מִצָּפוֹן וּבְיִשָּׂשכָר מִמִּזְרָח
  choice: на севере ... с Асиром, а на востоке — с Иссахаром
  rationale: Предлог מִן в данной пограничной формуле обозначает сторону примыкания; повтор сказуемого во второй части естественно опущен, как и в еврейском тексте.
