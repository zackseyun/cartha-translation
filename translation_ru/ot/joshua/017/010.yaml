  terminology: Имена «Ефрем», «Манассия», «Асир» и «Иссахар» соответствуют принятой русской библейской передаче. «Граница» уместно для גְּבוּל. Глагол «граничили» точно передаёт территориальное употребление פגע; примечание корректно сохраняет лексические альтернативы.
