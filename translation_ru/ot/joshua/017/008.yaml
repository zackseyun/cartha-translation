  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: ru
  text: Земля Таппуаха принадлежала Манассии[a], а Таппуах на границе Манассии принадлежал сынам Ефрема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «У Манассии была земля Таппуаха»; или: «Манассии досталась земля Таппуаха».'
    reason: 'Лексическая альтернатива: более формальная передача конструкции принадлежности לִמְנַשֶּׁה הָיְתָה.'
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: принадлежала Манассии
  rationale: Конструкция с ל и глаголом היה выражает принадлежность или назначение удела; в данном контексте это естественно передаётся глаголом «принадлежала».
- source_word: אֶרֶץ
  choice: земля
  rationale: В контексте распределения уделов слово обозначает территорию; «земля» сохраняет широту и конкретность исходного слова.
- source_word: תַּפּוּחַ
  choice: Таппуах
  rationale: Географическое название передано транслитерацией, без перевода его нарицательного значения.
- source_word: וְתַפּוּחַ
  choice: а сам Таппуах
  rationale: 'Союз ו здесь имеет сопоставительно-противительный оттенок: земля вокруг Таппуаха относится к Манассии, тогда как сам город — к сынам Ефрема. Слово «сам» ясно выражает это подразумеваемое различие, не устраняя его из текста.'
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: на границе Манассии
  rationale: Предлог אֶל при обозначении границы допускает локативное понимание; русское «на границе» естественно описывает положение города.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: сынам Ефрема
  rationale: Сохранено древнееврейское родовое выражение «сыны Ефрема», обозначающее племенное сообщество и получателей города.
