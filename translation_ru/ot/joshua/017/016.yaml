base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: ru
  text: 'И сказали потомки Иосифа: «Нагорной земли нам недостаточно, а у всех хананеев, живущих в долине, — железные колесницы[a]: и у тех, кто живёт в Беф-Сане и зависимых от него поселениях[b], и у тех, кто живёт в Изреельской долине».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колесницы из железа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «её дочерях» — то есть в небольших поселениях, зависимых от Беф-Сана.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: потомки Иосифа
  rationale: В данном повествовании речь идёт не о непосредственных сыновьях Иосифа, а о племенах, происходящих от него; «потомки» естественно передаёт смысл.
- source_word: לֹא יִמָּצֵא לָנוּ הָהָר
  choice: нагорной земли нам недостаточно
  rationale: Буквально конструкция близка к «гора/нагорье не находится для нас», но в контексте жалобы на размер удела выражает недостаточность территории. «Нагорная земля» сохраняет географическое противопоставление долине.
- source_word: רֶכֶב בַּרְזֶל
  choice: железные колесницы
  rationale: Естественное русское соответствие еврейскому сочетанию «колесницы железа»; оно не уточняет сверх текста, были ли колесницы целиком железными или снабжёнными железными деталями.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: хананеи, живущие
  rationale: Единственное число в еврейском имеет собирательное значение; русское множественное число ясно передаёт население региона.
- source_word: אֶרֶץ הָעֵמֶק
  choice: долина
  rationale: Обозначает низменную долинную область в противопоставлении нагорью; краткое «в долине» естественно по-русски.
- source_word: בֵית שְׁאָן
  choice: Беф-Сан
  rationale: Употреблена традиционная и узнаваемая русская библейская передача топонима.
- source_word: וּבְנוֹתֶיהָ
  choice: зависимые от него поселения
  rationale: Буквально «её дочери» — семитский образ для небольших поселений, административно связанных с главным городом. Смысл передан прямо, без неясного буквального калькирования.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: Изреельская долина
  rationale: Естественное русское географическое наименование, близко передающее еврейскую конструкцию.
