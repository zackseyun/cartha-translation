  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: ru
  text: Граница Манассии шла от Асира к Михметату, расположенному напротив Сихема[a]; затем граница шла вправо[b], к жителям Ен-Таппуаха[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «перед Сихемом» или «лицом к Сихему».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к правой стороне»; в описаниях границ это может означать направление на юг.'
    reason: lexical_alternative
  - marker: c
    text: Название «Ен-Таппуах» означает «источник Таппуаха».
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: граница
  rationale: В описании земельного надела слово обозначает пограничную линию, а не всю территорию; «граница» естественно передаёт оба употребления в стихе.
- source_word: מֵאָשֵׁר
  choice: от Асира
  rationale: Предлог מִן указывает исходную точку описания границы; Асир здесь служит племенным или географическим ориентиром.
- source_word: הַמִּכְמְתָת
  choice: к Михмефафу
  rationale: Географическое название передано принятой русской библейской транслитерацией; предлог «к» ясно выражает направление прохождения границы от Асира.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: расположенному напротив Сихема
  rationale: Оборот עַל־פְּנֵי указывает на пространственное положение «перед» или «напротив», но сам по себе не требует уточнения стороны света.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: затем граница шла
  rationale: Глагол הלך в описаниях рубежей обозначает прохождение линии границы; «затем» естественно передаёт последовательность.
- source_word: אֶל־הַיָּמִין
  choice: вправо
  rationale: Основное значение выражения — «к правой стороне». Возможное географическое значение «на юг» не внесено в основной текст, чтобы сохранить неоднозначность оригинала.
- source_word: יֹשְׁבֵי
  choice: к жителям
  rationale: Причастная форма обозначает людей, живущих в данном месте; «жители» звучит естественно и точно.
- source_word: עֵין תַּפּוּחַ
  choice: Ен-Таппуах
  rationale: Топоним транслитерирован, а его буквальное значение пояснено в сноске.
