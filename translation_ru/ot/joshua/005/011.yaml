  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: ru
  text: 'И на следующий день после Пасхи они ели кое-что из произведений земли[a]: пресный хлеб и обжаренное зерно[b] — в этот самый день.'
  philosophy: optimal-equivalence
  footnotes:
