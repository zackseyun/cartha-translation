  - marker: b
    text: 'Или: «поджаренное зерно». Еврейское слово обозначает зерно, приготовленное обжариванием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: И ... они ели
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «И» сохраняет еврейский нарративный ход.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: от произведений этой земли
  rationale: עֲבוּר обозначает произведения, урожай земли. Предлог מִן передаётся как «от»; определённость выражена указательным «этой» в соответствии с контекстом уже названной земли. Возможное понимание как запасов прежнего урожая вынесено в примечание.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: на другой день после Пасхи
  rationale: 'Естественная современная передача временного оборота: речь идёт о дне, следующем за Пасхой.'
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Общепонятный и традиционно точный русский эквивалент в пасхальном контексте.
- source_word: וְקָלוּי
  choice: и жареное зерно
  rationale: קָלוּי означает зерно, приготовленное обжариванием; «жареное зерно» понятно современному читателю и сохраняет способ приготовления.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Русский идиоматический оборот передаёт усиленное указание на точный день; «тот» естественно соответствует ретроспективной перспективе повествования, тогда как акцент עצם сохранён словом «самый».
