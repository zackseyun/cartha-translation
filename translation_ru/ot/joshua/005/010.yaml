  terminology: «Пасха», «Сыны Израиля», «Галгал» и «Иерихон» употреблены последовательно. Сноска должна содержать оба альтернативных варианта, отмеченных в английском аудиторском следе, и не называть основной текст «буквальным» без уточнения языка источника.
