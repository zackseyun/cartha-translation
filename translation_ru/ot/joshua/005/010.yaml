base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: ru
  text: Сыны Израиля расположились станом в Галгале[a] и на равнинах Иерихона отпраздновали Пасху вечером четырнадцатого дня месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне» или «дети Израиля». В еврейском тексте: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה обозначает остановку и размещение лагерем; этот вариант точно передаёт действие и естественно звучит в повествовании.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохраняет семейно-родовое выражение и мужскую форму еврейского оригинала; более идиоматичный вариант — «израильтяне».
- source_word: בַּגִּלְגָּל
  choice: в Галгале
  rationale: Обычная русская передача предлога בְּ при названии места.
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: совершили Пасху
  rationale: Сочетание עשה с הַפֶּסַח обозначает совершение установленного пасхального обряда; буквальное «сделали Пасху» по-русски неестественно.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: четырнадцатого дня месяца
  rationale: Точная и естественная передача календарной формулы.
- source_word: בָּעֶרֶב
  choice: вечером
  rationale: Краткая и современная передача указания времени.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: на равнинах Иерихона
  rationale: עֲרָבוֹת обозначает равнинную, степную местность; «равнины» естественно передаёт географический смысл.
theological_decisions:
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Доктринального разногласия здесь нет. Выбранный вариант прозрачно сохраняет мужскую множественную и родовую форму оригинала, хотя «израильтяне» звучит более обычно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис сохранён ясным и плавным; архаизмы сведены к минимуму, а выражение «Сыны Израиля» оставлено ради точности к форме оригинала.
