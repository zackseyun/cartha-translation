  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: ru
  text: 'В то время Яхве сказал Иисусу Навину: «Сделай себе кремнёвые ножи[a] и снова обрежь сынов Израиля[b] — во второй раз[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ножи из кремня»; речь идёт о режущих орудиях, изготовленных из кремня и предназначенных здесь для обрезания.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст буквально говорит «сынов Израиля»; возможный более общий перевод — «израильтян».
    reason: lexical_alternative
  - marker: c
    text: «Во второй раз» означает, что обрезание вновь совершается среди Израиля как народа, а не обязательно то, что одних и тех же людей обрезают повторно.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Устойчивое повествовательное обозначение времени; естественно и точно передаёт еврейское выражение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Общепринятая в русской библейской традиции форма имени Иисуса Навина; она позволяет отличить его от Иисуса Христа.
- source_word: עֲשֵׂה לְךָ
  choice: Сделай себе
  rationale: Сохраняет повелительное наклонение и значение дательного местоимения, естественно звуча по-русски.
- source_word: חַרְבוֹת צֻרִים
  choice: кремнёвые ножи
  rationale: В данном контексте חַרְבוֹת обозначает режущие орудия, а צֻרִים указывает на материал — кремень.
- source_word: וְשׁוּב
  choice: и снова
  rationale: При следующем повелительном глаголе форма שׁוּב имеет наречное значение повторного действия.
- source_word: מֹל
  choice: обрежь
  rationale: Прямая и общепонятная передача глагола «совершить обрезание» в заветном контексте.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет грамматически мужское выражение оригинала, особенно уместное здесь, поскольку обрезанию подлежат мужчины.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Явно передаёт указание на второе совершение действия и не сливает его с отдельным וְשׁוּב «снова».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет личное имя Бога. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
- issue: Значение повторного обрезания
  choice: снова обрежь сынов Израиля — во второй раз
  alternative: обрежь тех же людей повторно
  rationale: Фраза относится к возобновлению обрезания в Израиле как народе; контекст не требует понимать её как повторное обрезание одних и тех же людей.
- issue: Мужской референт выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Буквальная мужская форма здесь смыслово значима из-за непосредственного упоминания обрезания и потому сохранена.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и естественным; тире сохраняет отдельный акцент שֵׁנִית «во второй раз», не устраняя напряжение между «снова» и «во второй раз».
