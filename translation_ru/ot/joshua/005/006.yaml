revisions:
- from: Ведь сыны Израиля сорок лет шли по пустыне, пока не пришёл конец всему народу — воинам, вышедшим из Египта, — потому что они не слушались голоса Яхве. Поэтому Яхве поклялся им, что не даст им увидеть землю, которую Яхве поклялся их отцам дать нам[a], — землю, текущую молоком и мёдом.
  to: Ибо сыны Израиля сорок лет шли по пустыне, пока не перевелись все воины, вышедшие из Египта, потому что они не слушались голоса Яхве. Яхве поклялся им, что не даст им увидеть землю, которую Яхве поклялся их отцам дать нам[a], — землю, текущую молоком и мёдом.
  rationale: Убрана невыраженная в оригинале связка «Поэтому», улучшена естественность описания группы вышедших из Египта воинов и сохранены все значимые особенности источника, включая первое лицо «нам» с привязанной сноской.
