  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: ru
  text: Ибо сыны Израиля сорок лет шли по пустыне, пока не перевелись все воины, вышедшие из Египта, потому что они не слушались голоса Яхве. Яхве поклялся им, что не даст им увидеть землю, которую Яхве поклялся их отцам дать нам[a], — землю, текущую молоком и мёдом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому масоретскому тексту: «дать нам»; в некоторых древних версиях и переводах: «дать им».'
    reason: Масоретский текст содержит неожиданное местоимение первого лица множественного числа; некоторые древние свидетельства и переводы отражают чтение «дать им».
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предыдущего стиха; «ведь» естественно передаёт пояснительную связь.
- source_word: הָלְכוּ
  choice: шли
  rationale: Сохраняет конкретный образ движения, не сводя его к более отвлечённому «странствовали».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально прозрачно передаёт еврейское выражение и в данном контексте сохраняет связь с народом Израиля.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: Обычное и понятное русское обозначение пространства странствий Израиля; предлог «по» естественен с глаголом движения.
- source_word: עַד תֹּם
  choice: пока не пришёл конец
  rationale: Передаёт завершение существования данной группы, не уточняя сверх текста способ её гибели.
- source_word: כָּל הַגּוֹי
  choice: всему народу
  rationale: Сохраняет основное значение גוי «народ»; последующее приложение уточняет, что речь идёт о вышедших из Египта воинах.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воинам
  rationale: Кратко и естественно передаёт «мужи войны», сохраняя военное значение и согласуясь с приложением.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: не слушались голоса Яхве
  rationale: Сохраняет образ слушания голоса и одновременно естественно выражает подразумеваемое неповиновение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: поклялся им, что не даст им увидеть
  rationale: Естественно передаёт содержание клятвы и каузативную форму глагола «видеть».
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: землю, текущую молоком и мёдом
  rationale: Сохраняет устойчивый библейский образ плодородной и изобильной земли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Местоимение первого лица в לָנוּ
  choice: дать нам
  alternative: дать им
  rationale: Масоретский текст недвусмысленно содержит первое лицо множественного числа. Неожиданное «нам» сохранено в основном тексте, а известное вариантное чтение отмечено в сноске.
- issue: Связь непослушания с клятвой Яхве
  choice: Поэтому Яхве поклялся им
  alternative: Яхве, который поклялся им
  rationale: Контекст и синтаксис связывают отказ допустить воинов в землю с тем, что они не слушались. «Поэтому» ясно выражает эту связь, не изменяя содержания клятвы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены образ «голоса Яхве», формула «текущая молоком и мёдом» и неожиданное местоимение «нам». Маркер сноски помещён непосредственно после слова, к которому относится.
