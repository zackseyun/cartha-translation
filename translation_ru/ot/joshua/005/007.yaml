  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: ru
  text: 'А их сыновей, которые пришли им на смену[a], Иисус Навин обрезал, потому что они были необрезанны: в пути их не обрезали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на их месте»; еврейское выражение указывает, что эти сыновья сменили прежнее поколение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: А их сыновей
  rationale: Союз связывает стих с предшествующим повествованием, а בְּנֵיהֶם в контексте обрезания обозначает именно сыновей, а не детей вообще.
- source_word: הֵקִים תַּחְתָּם
  choice: которых он поставил на их место
  rationale: Форма породы хифиль от קום выражает поставление или воздвижение преемников, а תַּחְתָּם — замещение прежнего поколения. Строчная форма «он» сохраняет формальную неоднозначность невыраженного в еврейском тексте подлежащего и не вносит дополнительного толкования.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: Иисус Навин обрезал
  rationale: מוּל — обычный глагол физического обрезания; русское предложение естественно называет объект один раз в начале конструкции.
- source_word: כִּי עֲרֵלִים הָיוּ
  choice: потому что они были необрезанными
  rationale: Передаёт причинную связь и буквальное физическое состояние в контексте знака завета.
- source_word: כִּי לֹא מָלוּ אוֹתָם
  choice: ведь ... их не обрезали
  rationale: Неопределённо-личная русская конструкция естественно сохраняет отсутствие названного субъекта у еврейского глагола множественного числа.
- source_word: בַּדָּרֶךְ
  choice: в пути
  rationale: Кратко и естественно обозначает время странствия, не добавляя отсутствующих в стихе географических уточнений.
theological_decisions:
- issue: Физическое состояние в контексте завета
  choice: необрезанными
  alternative: с необрезанной крайней плотью
  rationale: Стандартный библейский термин точно обозначает буквальное состояние и сохраняет связь с обрезанием как знаком завета без излишне анатомического разъяснения.
- issue: Кто поставил сыновей на место прежнего поколения
  choice: он — без прописной буквы и без замены местоимения именем
  alternative: Бог / Господь поставил
  rationale: В форме הֵקִים субъект прямо не назван. Контекст позволяет видеть в нём Господа, но перевод не должен устранять грамматическую неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор причинных союзов слегка сглажен сочетанием «потому что ... ведь», а неопределённый деятель во второй причине сохранён естественной русской конструкцией.
