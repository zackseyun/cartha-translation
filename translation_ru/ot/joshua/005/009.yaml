base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: ru
  text: 'И сказал Яхве Иисусу Навину: «Сегодня Я скатил с вас позор Египта[a]». Поэтому то место назвали Галгалом[b], и так оно называется до сего дня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесчестье Египта», «поношение Египта». Речь может идти о позоре, связанном с прошлым Израиля в Египте, о поношении со стороны Египта или о бесчестье, которое теперь устранено; еврейское выражение не уточняет этого.'
    reason: lexical_alternative
  - marker: b
    text: Название «Галгал» созвучно еврейскому глаголу со значением «катить, скатывать»; в словах «Я скатил» передана игра слов.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: גַּלּוֹתִי
  choice: Я снял
  rationale: Естественно передаёт удаление того, что словно лежало на народе; буквальный образ скатывания и связь с названием места пояснены в сноске.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: позор Египта
  rationale: Сохраняет широкий смысл חֶרְפָּה — позор, бесчестье, поношение — и намеренно не уточняет неоднозначное отношение родительного оборота.
- source_word: מֵעֲלֵיכֶם
  choice: с вас
  rationale: Естественный русский эквивалент буквально-пространственного выражения «с вас, прочь с вас».
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: Поэтому то место назвали Галгалом
  rationale: Безличная конструкция по-русски естественно передаёт результат именования при невыраженном в контексте субъекте; «поэтому» показывает связь названия с предыдущими словами.
- source_word: גִּלְגָּל
  choice: Галгал
  rationale: Традиционная русская библейская передача топонима; созвучие с еврейским глаголом раскрыто в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и так оно называется до сего дня
  rationale: Передаёт устойчивую повествовательную формулу и ясно связывает её с названием места.
theological_decisions:
- issue: Смысл выражения «позор Египта»
  choice: Сохранено широкое, неоднозначное выражение без уточнения его исторического или заветного смысла.
  alternative: Позор египетского рабства; поношение со стороны египтян; бесчестье, связанное с необрезанностью Израиля.
  rationale: Еврейский текст не определяет однозначно ни содержание позора, ни точное отношение «Египта» к нему, поэтому перевод не должен разрешать эту напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для обычного читателя; архаическая формула сохранена только в привычном выражении «до сего дня».
