  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: ru
  text: И вот, когда все цари аморреев, жившие по ту сторону Иордана, к западу, и все цари хананеев, жившие у моря[a], услышали, что Яхве осушил воды Иордана перед сынами Израиля, пока мы не перешли через него[b], сердце их растаяло и не осталось в них больше духа[c] из-за сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жившие на побережье»; выражение «у моря» обозначает прибрежную область.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях и древних переводах: «пока они не перешли через него».'
    reason: textual_variant
  - marker: c
    text: Слово «дух» здесь может означать мужество, внутреннюю силу или решимость.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Естественно вводит новый эпизод повествования и передаёт дискурсивную функцию формы, не прибегая к архаичному «и было».
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: по ту сторону Иордана, к западу
  rationale: Передаёт как положение по другую сторону Иордана, так и западное направление יָמָּה.
- source_word: אֲשֶׁר עַל הַיָּם
  choice: жившие у моря
  rationale: Близко сохраняет еврейское выражение; его прибрежное географическое значение пояснено в сноске.
- source_word: הוֹבִישׁ
  choice: осушил
  rationale: Каузативная форма означает «сделал сухими, осушил»; русский глагол естественно сочетается с водами реки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено родственно-национальное выражение оригинала; форма «сыны» уместна в современном возвышенном библейском регистре.
- source_word: עַד עברנו
  choice: пока мы не перешли через него
  rationale: Сохранено первое лицо множественного числа в масоретском согласном тексте; местоимение «него» естественно указывает на Иордан.
- source_word: וַיִּמַּס לְבָבָם
  choice: сердце их растаяло
  rationale: Сохранены единственное число собирательного «сердце» и метафора таяния как образ утраты мужества.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: не осталось в них больше духа
  rationale: Сохраняет многозначный образ רוּחַ — «дух, дыхание, мужество», не сводя его в основном тексте только к одному значению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал содержит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Национальное обозначение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Выбор сохраняет семейно-национальный образ исходного выражения без нейтрализации.
- issue: Лицо глагола в עַד עברנו
  choice: пока мы не перешли через него
  alternative: пока они не перешли через него
  rationale: Основной текст следует чтению первого лица в масоретской форме, не устраняя неожиданную смену повествовательной перспективы; широко засвидетельствованная третьеличная форма дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис следует развернутой структуре оригинала, но остаётся понятным; подлинная смена лица и многозначность слова רוּחַ сохранены и пояснены сносками.
