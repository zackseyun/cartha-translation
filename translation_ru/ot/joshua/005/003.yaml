  text: Иисус Навин сделал себе кремнёвые ножи и обрезал сынов Израиля у Холма Крайних Плотей[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кремнёвые клинки». Слово, переведённое как «ножи», часто означает «мечи», но здесь речь идёт об орудиях для обрезания.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское название означает «Холм Крайних Плотей»; возможна передача названием «Гиват-ха-Аралот».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: сделал себе
  rationale: Глагол עשה означает «делать, изготовлять», а לוֹ в данном контексте естественно передаётся возвратным «себе».
- source_word: חַרְבוֹת צֻרִים
  choice: кремнёвые ножи
  rationale: חֶרֶב обычно обозначает меч или клинок, однако контекст обрезания требует функционального соответствия «ножи»; צֻרִים указывает на камень, точнее кремень.
- source_word: וַיָּמָל
  choice: обрезал
  rationale: Глагол מול однозначно обозначает совершение обрезания.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально передаёт мужскую конструкцию исходного текста и в данном контексте указывает на мужчин, подлежавших обрезанию.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: у Холма Крайней Плоти
  rationale: אֶל при обозначении места действия естественно передаётся как «у»; прозрачное описательное название места переведено по смыслу.
