  verdict: approve
  source_fidelity: «Когда весь народ был обрезан» адекватно передаёт завершённость действия в конструкции כַּאֲשֶׁר תַּמּוּ ... לְהִמּוֹל. Коллективное «весь народ» и последующее множественное «они» отражают переход от собирательного כָּל־הַגּוֹי к глаголу во множественном числе. «Оставались на своих местах в стане» верно передаёт וַיֵּשְׁבוּ תַחְתָּם בַּמַּחֲנֶה, а «пока не оправились» — контекстуальный смысл עַד חֲיוֹתָם.
