  text: וַ/יְהִ֛י כַּ/אֲשֶׁר תַּ֥מּוּ כָל הַ/גּ֖וֹי לְ/הִמּ֑וֹל וַ/יֵּשְׁב֥וּ תַחְתָּ֛/ם בַּֽ/מַּחֲנֶ֖ה עַ֥ד חֲיוֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: ru
  text: Когда весь народ был обрезан, они оставались на своих местах в стане, пока не оправились.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока не исцелились»; возможно также: «пока не восстановили силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Еврейская повествовательная формула вводит придаточное времени; в современном русском простое «Когда» естественно передаёт связь событий без тяжеловесного буквализма.
- source_word: תַּמּוּ כָל הַגּוֹי לְהִמּוֹל
  choice: весь народ был обрезан
  rationale: Фраза выражает завершение обрезания всего народа. Пассивная конструкция естественна по-русски и сохраняет значение нифаля לְהִמּוֹל.
- source_word: כָל הַגּוֹי
  choice: весь народ
  rationale: «Народ» сохраняет собирательное единственное число и в данном контексте естественно обозначает Израиль.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: они оставались на своих местах
  rationale: Контекстуальное идиоматическое значение — оставаться там, где находились, а не буквально «сидеть под собой».
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: «Стан» — понятное традиционное библейское обозначение лагеря, уместное в достойном литературном регистре.
- source_word: עַד חֲיוֹתָם
  choice: пока не оправились
  rationale: Форма от חיה здесь указывает на восстановление сил и здоровья после обрезания; «оправились» естественно передаёт этот смысл, не сводя его исключительно к заживлению раны.
