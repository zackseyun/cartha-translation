base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: ru
  text: 'И было, когда Иисус Навин находился у Иерихона[a], он поднял глаза и увидел — и вот, напротив него стоял человек с обнажённым мечом в руке. Иисус Навин подошёл к нему и спросил: «Ты за нас или за наших врагов?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Иерихоне». Еврейский предлог допускает более широкое обозначение местонахождения и не обязательно указывает на место внутри города.'
    reason: Лексико-пространственная неоднозначность предлога בְּ.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Сохраняет древнееврейский повествовательный переход и при этом звучит достойно и понятно в современном литературном русском.
- source_word: בִּהְיוֹת יְהוֹשֻׁעַ בִּירִיחוֹ
  choice: когда Иисус Навин находился у Иерихона
  rationale: Инфинитивная конструкция передаёт временное обстоятельство; «у Иерихона» сохраняет широкое пространственное значение предлога ב и не утверждает, что Иисус Навин уже был внутри города.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: он поднял глаза и увидел
  rationale: Передаёт оба глагола естественной русской формулой, сохраняя последовательность зрительного действия.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Выражает внезапное привлечение внимания и живость представления без архаичного «се».
- source_word: אִישׁ
  choice: человек
  rationale: Не уточняет личность фигуры сверх сказанного в данном стихе.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: напротив него стоит
  rationale: Передаёт пространственный и потенциально конфронтационный оттенок לְנֶגֶד.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: с обнажённым мечом в руке
  rationale: «Обнажённый меч» — естественное русское обозначение меча, вынутого из ножен; упоминание руки сохранено.
- source_word: וַיֵּלֶךְ יְהוֹשֻׁעַ אֵלָיו
  choice: Иисус Навин подошёл к нему
  rationale: В данном контексте естественно передаёт направленное движение к стоящему человеку.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Ты за нас или за наших врагов?
  rationale: Предлог ל выражает принадлежность или сторону в противостоянии; формулировка ясна в военном контексте.
theological_decisions:
- issue: Личность человека, встретившего Иисуса Навина
  choice: В основном тексте оставлено нейтральное «человек».
  alternative: Ангел, Ангел Господень либо богоявление/явление Христа до воплощения.
  rationale: Сам стих называет фигуру только словом אִישׁ. Её дальнейшее раскрытие и богословское истолкование не следует преждевременно вносить в перевод этого стиха.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Имя «Иисус Навин» дано в принятой русской библейской форме. Архаизм «се» заменён на ясное «вот»; личность встреченного человека намеренно не уточняется.
