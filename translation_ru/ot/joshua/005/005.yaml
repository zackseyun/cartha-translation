  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: ru
  text: Ведь весь народ, вышедший из Египта, был обрезан, а весь народ, родившийся в пустыне во время пути после выхода из Египта, обрезан не был.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предыдущему стиху; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: מֻלִים הָיוּ
  choice: был обрезан
  rationale: Причастие с היה описывает состояние поколения, вышедшего из Египта; русская конструкция передаёт результат ранее совершённого обрезания.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Сохраняет собирательное значение עָם и не сужает его в самом тексте до слова «мужчины».
- source_word: הַיֹּצְאִים
  choice: вышедший из Египта
  rationale: Субстантивированное причастие обозначает поколение исхода; дополнение «из Египта» ясно из последующей части еврейского предложения и естественно по-русски.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: а весь народ, родившийся
  rationale: В данном контексте וְ противопоставляет два поколения; русское «а» выражает этот контраст без излишнего усиления.
- source_word: בַּמִּדְבָּר בַּדֶּרֶךְ
  choice: в пустыне во время пути
  rationale: Передаёт как место рождения, так и обстоятельство странствия, избегая неестественного буквального «в пустыне на пути».
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: после выхода из Египта
  rationale: В контексте речь идёт о пути, начавшемся с исхода; такая формулировка естественно обозначает период странствия, не приписывая новорождённым участие в самом выходе.
- source_word: לֹא מָלוּ
  choice: обрезан не был
  rationale: Хотя в еврейском стоит активная форма «не обрезали», объект подразумевается из контекста; русская пассивная конструкция сохраняет смысл и фокус на состоянии поколения.
