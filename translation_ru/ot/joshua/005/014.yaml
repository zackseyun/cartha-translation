  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: ru
  text: 'Он сказал[a]: «Нет: я — предводитель воинства Яхве и теперь пришёл». Тогда Иисус Навин пал лицом на землю и поклонился[b]. Он спросил его: «Что господин мой говорит своему слуге?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ни за тех, ни за других; я теперь пришёл как предводитель воинства Яхве».'
    reason: Лаконичное לֹא отвечает на предшествующий вопрос с двумя вариантами; по смыслу оно может отрицать обе предложенные стороны.
  - marker: b
    text: Еврейский глагол может также означать «поклоняться» в культовом смысле. Здесь «поклонился» передаёт само действие, не предрешая на основании одного этого стиха, кем был явившийся Иисусу Навину.
    reason: Сохранение лексической и богословской неоднозначности שׁחה.
lexical_decisions:
- source_word: לֹא כִּי
  choice: Нет; но
  rationale: לֹא прямо отрицает предложенную альтернативу, а כִּי вводит противопоставленное уточнение. Такая формулировка сохраняет резкость ответа, не превращая подразумеваемое «ни то ни другое» в основной текст.
- source_word: שַׂר
  choice: предводитель
  rationale: В сочетании с воинством обозначает военачальника; «предводитель» звучит естественно и достойно, не сужая значение до конкретного современного звания.
- source_word: צְבָא יְהוָה
  choice: воинство Яхве
  rationale: «Воинство» сохраняет широкий военно-собирательный смысл צָבָא, не уточняя без основания, о каком именно войске идёт речь; личное имя יהוה передано как «Яхве».
- source_word: עַתָּה בָאתִי
  choice: я пришёл теперь
  rationale: Русское прошедшее совершенного вида естественно передаёт состоявшееся прибытие, а «теперь» сохраняет עַתָּה.
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: пал лицом на землю
  rationale: Передаёт физическую позу простёртого ниц Иисуса Навина близко к еврейскому выражению и естественно по-русски.
- source_word: וַיִּשְׁתָּחוּ
  choice: поклонился
  rationale: Глагол может обозначать как почтительное земное поклонение, так и религиозное поклонение. Русское «поклонился» сохраняет действие и не решает вопрос о природе этого лица.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Уважительное обращение с суффиксом первого лица; строчная буква не навязывает отождествления собеседника с Богом.
- source_word: מָה אֲדֹנִי מְדַבֵּר אֶל־עַבְדּוֹ
  choice: Что господин мой скажет своему слуге?
  rationale: Вопрос в контексте выражает готовность услышать повеление. «Скажет» естественно по-русски передаёт направленную к слуге речь, а третье лицо сохраняет почтительную форму оригинала.
theological_decisions:
- issue: Следует ли явно называть действие Иисуса Навина богопоклонением
  choice: Передать וַיִּשְׁתָּחוּ как «поклонился»
  alternative: «совершил поклонение» или «поклонился ему как Богу»
  rationale: שׁחה допускает почтительное и культовое значение; один этот стих не требует определить точный богословский характер действия.
- issue: Следует ли отождествлять предводителя воинства с ангелом, теофанией или иной определённой фигурой
  choice: Сохранить только данное в тексте обозначение «предводитель воинства Яхве»
  alternative: Назвать его ангелом либо явлением Бога или Христа
  rationale: Стих сообщает титул говорящего, но не даёт прямого онтологического определения; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Иисус Навин» употреблено как закрепившаяся русская форма имени персонажа; «Яхве» передаёт личное имя יהוה. Инверсия «господин мой» сохраняет почтительность обращения без излишней архаизации.
