  register: Современный литературный русский язык с достоинством библейского повествования. Идиоматическое начало раскрывает пояснительную функцию еврейской конструкции, не меняя причинной связи. Тире помогают показать, что «все мужчины, все воины» уточняет состав вышедшего из Египта народа.
