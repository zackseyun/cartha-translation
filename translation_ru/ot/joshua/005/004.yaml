base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: ru
  text: 'И вот почему Иисус Навин совершил обрезание: весь народ, вышедший из Египта, — все мужчины, все воины[a] — умерли в пустыне, в пути после того, как они вышли из Египта.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «все мужи войны»; возможный перевод: «все способные сражаться мужчины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: И вот почему Иисус Навин совершил обрезание
  rationale: Буквально конструкция близка к «и вот дело, по которому обрезал Иисус Навин», но в данном контексте она вводит объяснение его действия. Русское «вот почему» естественно передаёт эту функцию, а «совершил обрезание» позволяет не вводить местоименный объект раньше его пояснения.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם
  choice: весь народ, вышедший из Египта
  rationale: Причастный оборот прямо и естественно передаёт еврейское определение; совершенный вид указывает на предшествовавший исход.
- source_word: הַזְּכָרִים
  choice: все мужчины
  rationale: Еврейское слово прямо обозначает лиц мужского пола. В повествовании о взрослом поколении «мужчины» звучит естественнее биологического «самцы» и сохраняет смысл.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: все воины
  rationale: Краткое и современное соответствие военному обозначению; буквальное «мужи войны» в современном русском звучит архаично.
- source_word: מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ
  choice: умерли в пустыне по пути
  rationale: Сохраняются место смерти и обстоятельство пути; «пустыня» является естественным русским библейским эквивалентом מִדְבָּר.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: после выхода из Египта
  rationale: Инфинитивная конструкция обозначает временную связь с исходом. «После выхода» ясно показывает, что смерть происходила в последовавшем странствии.
