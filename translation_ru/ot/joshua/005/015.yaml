  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: ru
  text: 'Военачальник войска Яхве сказал Иисусу Навину[a]: «Сними с ноги свою сандалию[b], потому что место, на котором ты стоишь, свято». Иисус Навин так и сделал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Иисусу»; здесь и далее имеется в виду Иисус Навин.'
    reason: name_clarification
  - marker: b
    text: 'В еврейском тексте единственное число: «свою сандалию… с ноги». Сравните более привычную формулировку во множественном числе в Исходе 3:5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: военачальник
  rationale: В сочетании с צְבָא обозначает начальника войска; «военачальник» естественно и ясно передаёт военное руководство, не вводя конкретного современного звания.
- source_word: צְבָא יְהוָה
  choice: войско Яхве
  rationale: צָבָא здесь имеет военное значение «войско»; личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: שַׁל נַעַלְךָ מֵעַל רַגְלְךָ
  choice: сними с ноги свою сандалию
  rationale: 'Сохранено число оригинала: и «сандалия», и «нога» стоят в единственном числе; «сними» естественно передаёт повеление удалить обувь.'
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: место, на котором ты стоишь
  rationale: Передаёт определённый артикль, относительную конструкцию и явное עָלָיו «на нём», оставаясь естественным по-русски.
- source_word: קֹדֶשׁ הוּא
  choice: свято
  rationale: Краткое именное высказывание естественно передано русским сказуемым «свято», сохраняющим библейское значение святости.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: Иисус Навин так и сделал
  rationale: Формула исполнения повеления передана современно и естественно, с оттенком точного послушания.
theological_decisions:
- issue: Личность и статус שַׂר צְבָא יְהוָה
  choice: Описательный титул «военачальник войска Яхве» без уточнения природы говорящего.
  alternative: Ангельский военачальник; явление Яхве; до-воплощённое явление Христа.
  rationale: Стих называет говорящего только данным титулом и не определяет прямо, кем он является; перевод сохраняет эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис прямой и доступный; личное имя Бога передано как «Яхве». В основном тексте сохранено единственное число у слов «сандалия» и «нога».
