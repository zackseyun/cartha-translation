base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: ru
  text: На следующий день, после того как они поели урожая земли[a], манна перестала появляться. У сынов Израиля[b] больше не было манны, и в тот год они ели урожай земли Ханаана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «прошлогодних припасов земли». Еврейское слово может обозначать хранившиеся запасы урожая предыдущего года.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Израиля»; так в еврейском тексте назван народ Израиля в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: перестала выпадать
  rationale: Глагол שׁבת означает здесь прекращение, а не соблюдение субботы. Добавление «выпадать» естественно передаёт прекращение появления манны в русском контексте.
- source_word: הַמָּן / מָן
  choice: манна
  rationale: Традиционное и общепонятное русское обозначение пищи, которую Израиль получал в пустыне.
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: В данном повествовательном контексте выражение указывает на день после описанной в предыдущем стихе трапезы.
- source_word: בְּאָכְלָם
  choice: после того как они поели
  rationale: Инфинитивная конструкция с ב допускает временное значение; контекст подчёркивает последовательность событий.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: плодов той земли
  rationale: עֲבוּר обозначает съестные припасы или произведения земли, вероятно зерновые. «Плоды земли» здесь звучит естественно и сохраняет достаточную широту значения.
- source_word: וְלֹא הָיָה עוֹד
  choice: больше не было
  rationale: Естественная русская передача отрицательной бытийной конструкции с עוֹד.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: у сынов Израиля
  rationale: Формально передаёт мужское существительное בנים и устойчивое библейское наименование народа.
- source_word: וַיֹּאכְלוּ
  choice: они питались
  rationale: Передаёт продолжавшееся употребление урожая в пищу на протяжении указанного года и избегает неестественного повтора «поели».
- source_word: מִתְּבוּאַת
  choice: урожаем
  rationale: תְּבוּאָה обозначает сельскохозяйственную продукцию, урожай; творительный падеж естественен при глаголе «питались».
- source_word: אֶרֶץ כְּנַעַן
  choice: земли Ханаанской
  rationale: Сохраняет полное обозначение территории и соответствует литературной русской библейской речи.
- source_word: בַּשָּׁנָה הַהִיא
  choice: в тот год
  rationale: Точная и естественная передача временного выражения.
