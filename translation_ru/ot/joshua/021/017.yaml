lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה בִנְיָמִן
  choice: а от колена Вениамина
  rationale: В контексте распределения городов מַטֶּה означает «колено»; сочетание וּמִ־ продолжает перечень и передано как «а от».
- source_word: גִּבְעוֹן
  choice: Гаваон
  rationale: Устоявшаяся русская библейская форма названия города.
- source_word: מִגְרָשֶׁהָ
  choice: с его/её пастбищными землями
  rationale: מִגְרָשׁ обозначает открытую общинную землю вокруг города, в том числе предназначенную для выпаса. Местоимения согласованы с грамматическим родом русских названий городов.
- source_word: גֶּבַע
  choice: Гева
  rationale: Русская передача еврейского географического названия גֶּבַע, позволяющая отличить его от Гаваона.
