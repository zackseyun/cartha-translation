base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: ru
  text: И сыны Израиля отдали левитам эти города с их пастбищными угодьями, как Яхве повелел через Моисея[a], по жребию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою Моисея» — еврейское выражение, означающее действие через посредничество Моисея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: отдали
  rationale: Форма נתן обозначает передачу городов левитам; «отдали» естественно передаёт совершённое действие в повествовании.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет формальное выражение исходного текста и соответствует возвышенному, но понятному библейскому регистру.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Прямая передача названия группы и дательного отношения.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: Сохраняет указательное значение и связь с перечисленными ранее городами.
- source_word: מִגְרְשֵׁיהֶן
  choice: их пастбищные земли
  rationale: מִגְרָשׁ обозначает открытые земли вокруг города, использовавшиеся, в частности, для выпаса; выражение не сужено до одних пастбищ.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: Передаёт соответствие ранее данному повелению без необходимости явно выражать предпрошедшее время, отсутствующее в русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Естественно передаёт еврейскую идиому посреднического действия; буквальная образность отмечена в сноске.
- source_word: בַּגּוֹרָל
  choice: по жребию
  rationale: Указывает на распределение посредством жребия и сохраняет конечную позицию оборота с помощью присоединительной пунктуации.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь оборота בַּגּוֹרָל
  choice: по жребию — как способ распределения городов
  alternative: понимать как часть содержания повеления
  rationale: Конечное положение оборота допускает некоторую синтаксическую напряжённость, однако контекст распределения левитских городов указывает на способ их передачи; порядок компонентов по возможности сохранён.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Выражение «сыны Израиля» сохранено формально; идиома בְּיַד передана понятно для современного читателя, а буквальная форма вынесена в сноску.
