  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: ru
  text: А из колена Рувима[a] — Бецер с его пастбищными угодьями и Яхац[b] с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых еврейских рукописях и древних свидетельствах стихи 36–37 отсутствуют; перечисленные здесь города соответствуют списку в 1 Паралипоменон 6:78–79.
    reason: textual_variant
  - marker: b
    text: Название «Яхац» также передаётся как «Яхаца» или «Яац».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: А из колена
  rationale: Сочетание מִן + מַטֶּה в перечне уделов указывает на принадлежность к колену или происхождение из него; «из колена» естественно для современного русского библейского повествования. Союз ו передан как «А», поскольку стих продолжает список.
- source_word: רְאוּבֵן
  choice: Рувима
  rationale: Традиционная и общепринятая русская форма имени в родительном падеже после «из колена».
- source_word: אֶת בֶּצֶר
  choice: Бецер
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; географическое название передано принятой русской транслитерацией.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными угодьями
  rationale: מִגְרָשׁ обозначает открытые земли вокруг левитского города, использовавшиеся в том числе как пастбища. «Пастбищные угодья» ясно передаёт назначение земель, а местоимение мужского рода согласуется в русском с существительным «город», подразумеваемым названием.
- source_word: יַהְצָה
  choice: Яхац
  rationale: Название города передано традиционной русской формой; конечный элемент еврейской формы не требуется отдельно отражать в русском написании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и лаконичности древнего перечня. Двоеточие английского консультационного текста заменено тире как более естественным русским способом ввести продолжение списка. Маркеры примечаний размещены при соответствующих словам и утверждениях.
