  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: ru
  text: Аин с его пастбищными угодьями[a], Иутта с её пастбищными угодьями и Беф-Шемеш с его пастбищными угодьями — девять городов от этих двух племён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинными землями» или «прилегающими землями»; речь идёт о землях, принадлежавших каждому городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Аин
  rationale: Название города передано принятой русской библейской транслитерацией, без перевода его возможного лексического значения.
- source_word: מִגְרָשֶׁיהָ
  choice: его/её пастбищные земли
  rationale: Слово обозначает открытые земли, закреплённые за городом и использовавшиеся, в частности, для выпаса; выбран естественный современный эквивалент с примечанием о более широком значении.
- source_word: יֻטָּה
  choice: Иутта
  rationale: Название города передано в форме, укоренённой в русской библейской традиции.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Беф-Шемеш
  rationale: Составное название города транслитерировано, а не переведено как «дом солнца».
- source_word: עָרִים תֵּשַׁע
  choice: девять городов
  rationale: Сохранены порядок смысла и обычный административный термин данного перечня.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: от этих двух племён
  rationale: Передано происхождение данного надела из территорий двух упомянутых племён без добавочного толкования.
