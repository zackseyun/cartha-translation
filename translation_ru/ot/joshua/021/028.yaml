  yaml_path: translation/ot/joshua/021/028.yaml
  text: 'And from the tribe of Issachar: Kishion with its pasturelands, and Dabrath with its pasturelands.'
translation:
  language: ru
  text: А из колена Иссахара — Кишион с его пастбищами и Даврат с его пастбищами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה יִשָּׂשכָר
  choice: колена Иссахара
  rationale: מַטֶּה в перечне земельных уделов естественно означает «колено»; имя передано в принятой русской библейской форме.
- source_word: קִשְׁיוֹן
  choice: Кишион
  rationale: Транслитерация древнееврейского топонима с сохранением согласного состава и традиционно понятным русским оформлением.
- source_word: דָּבְרַת
  choice: Даврат
  rationale: Форма следует масоретской огласовке דָּבְרַת (Dāḇrat); буква ב без дагеша передана как «в».
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищами
  rationale: מִגְרָשׁ обозначает прилегающие к городу открытые земли, прежде всего для выпаса; местоименный суффикс женского рода относится к городу, но по-русски согласуется с мужским родом названия.
