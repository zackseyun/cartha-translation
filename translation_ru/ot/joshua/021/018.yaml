    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Анафоф
  rationale: Топоним передан в традиционной русской библейской форме, соответствующей еврейскому названию.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытую землю, принадлежавшую городу и, в частности, использовавшуюся для выпаса; местоимение мужского рода естественно согласовано с русским словом «город».
- source_word: עַלְמוֹן
  choice: Алмон
  rationale: Еврейский топоним транслитерирован в естественной для русского языка форме.
- source_word: עָרִים אַרְבַּע
  choice: всего четыре города
  rationale: Числовое резюме списка передано естественным русским оборотом; «всего» явно выражает итоговую функцию фразы, не изменяя её содержания.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: перечислительная конструкция с союзом «и»
  rationale: Повторяющийся показатель прямого дополнения אֶת не имеет отдельного русского соответствия; его синтаксическая функция отражена структурой перечисления.
