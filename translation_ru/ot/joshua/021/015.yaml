  text: וְ/אֶת חֹלֹן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת דְּבִ֖ר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/015.yaml
  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: ru
  text: Холон с его пастбищными угодьями[a] и Девир с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном перечне в 1 Паралипоменон 6:58 этот город назван «Хилен»; здесь, в книге Иисуса Навина, стоит «Холон».
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: Холон
  rationale: Название города передано принятой русской транслитерацией; в данном месте масоретский текст читает חֹלֹן.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными угодьями
  rationale: מִגְרָשׁ обозначает принадлежавшую городу открытую землю, в частности для выпаса и общего пользования. Выражение «пастбищные угодья» естественно и уместно в контексте левитских городов; суффикс женского рода относится к каждому городу.
- source_word: דְּבִר
  choice: Девир
  rationale: Топоним транслитерирован, а не переведён.
- source_word: וְאֶת
  choice: и / с
  rationale: Повторяющийся союз וְ передан как «и» между элементами перечня, тогда как непереводимый показатель прямого дополнения אֶת и связь города с его угодьями естественно выражены конструкцией «с его…».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая форма перечня сохранена. «Пастбищные угодья» точнее передаёт назначение מִגְרָשׁ, чем устаревшее «предместья», не исключая более широкого общинного использования этих земель.
