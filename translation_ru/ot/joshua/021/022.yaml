    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Кивцаим
  rationale: Собственное географическое название передано транслитерацией в форме, соответствующей современному русскому библейскому употреблению.
- source_word: מִגְרָשֶׁהָ
  choice: с прилегающими к нему угодьями
  rationale: מִגְרָשׁ обозначает открытую землю, принадлежавшую городу и использовавшуюся, в частности, как пастбище; «угодья» сохраняет более широкий смысл, а местоименная конструкция естественно передаёт суффикс 3-го лица женского рода.
- source_word: בֵּית חוֹרֹן
  choice: Бет-Хорон
  rationale: Устоявшееся транслитерированное географическое название; буквальное значение составных частей имени не переводится.
- source_word: עָרִים אַרְבַּע
  choice: четыре города
  rationale: Прямо передаёт итоговую формулу перечня.
- source_word: וְאֶת ... וְאֶת
  choice: и ... и
  rationale: Повтор союза сохранён как структура перечня; служебный показатель прямого дополнения אֵת отдельно не переводится.
