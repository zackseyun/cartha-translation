base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: ru
  text: 'И из колена Гада: Рамот в Галааде[a], город-убежище для человека, лишившего жизни другого[b], и его пастбищные угодья[c]; Маханаим и его пастбищные угодья.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рамот-Галаад»; еврейское выражение можно понимать как «Рамот в Галааде» либо передавать как составное географическое имя.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «для убившего». В данном правовом контексте речь идёт о человеке, причинившем смерть; это обозначение само по себе не указывает, было ли убийство предумышленным.'
    reason: lexical_alternative
  - marker: c
    text: Имеются в виду земли вокруг города, выделенные для пользования вместе с ним, в том числе для выпаса скота.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה גָד
  choice: И из колена Гада
  rationale: В контексте распределения городов מַטֶּה означает «колено»; союз и предлог естественно переданы как «и из».
- source_word: עִיר מִקְלַט
  choice: город-убежище
  rationale: Устойчивое обозначение специально назначенного города, где совершивший убийство мог искать защиты до законного разбирательства.
- source_word: הָרֹצֵחַ
  choice: убившего человека
  rationale: Причастие обозначает человека, причинившего смерть, но в правовом контексте городов-убежищ само по себе не требует понимать его как виновного в предумышленном убийстве.
- source_word: רָמֹת בַּגִּלְעָד
  choice: Рамот в Галааде
  rationale: Название города передано транслитерацией, а географическое уточнение — естественной русской предложной конструкцией.
- source_word: מִגְרָשֶׁהָ
  choice: прилегающими к нему пастбищными землями
  rationale: מִגְרָשׁ обозначает выделенные вместе с левитским городом земли вокруг него, в частности используемые как пастбища; местоименный суффикс относится к городу.
- source_word: מַחֲנַיִם
  choice: Маханаим
  rationale: Собственное географическое название передано транслитерацией.
theological_decisions:
- issue: Правовой статус הָרֹצֵחַ
  choice: убившего человека
  alternative: убийцы
  rationale: 'Слово не следует переводить так, чтобы заранее приписать человеку предумышленное убийство: убежище предназначалось для того, чья вина и характер деяния подлежали разбирательству.'
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Сохранена структура перечня и приложительное пояснение «город-убежище». Транслитерация «Рамот» отражает еврейскую форму без замены конечного ת на традиционное «ф»; «Маханаим» соответствует укоренившейся русской передаче.
