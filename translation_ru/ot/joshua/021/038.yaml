  source_fidelity: 'Смысл исходного текста передан точно: названы города из удела Гада, Рамот в Галааде обозначен как город-убежище для רֹצֵחַ, а каждому городу приданы его מִגְרָשִׁים. Формулировка о человеке, лишившем другого жизни, не предрешает, было ли деяние умышленным, что существенно в контексте городов-убежищ.'
