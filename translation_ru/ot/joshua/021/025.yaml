  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת תַּעְנַךְ֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: ru
  text: 'И от половины колена Манассии: Таанах с его пастбищными землями[a] и Гат-Риммон с его пастбищными землями — два города.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых еврейских рукописях и в параллельном месте, 1 Паралипоменон 6:70, названия городов, выделенных из колена Манассии, отличаются.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה
  choice: И от половины колена
  rationale: Сочетание מִן с מַחֲצִית обозначает источник выделения городов, а מַטֶּה в контексте земельного распределения означает «колено». Формулировка сохраняет структуру еврейского текста и естественна для русского библейского повествования.
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Традиционная русская форма имени в родительном падеже после слова «колена».
- source_word: תַּעְנַךְ
  choice: Таанах
  rationale: Устоявшаяся русская передача географического названия.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые угодья вокруг города, используемые, в частности, для выпаса. Притяжательное местоимение согласовано в русском с существительным «город», к которому относятся эти земли.
- source_word: גַּת רִמּוֹן
  choice: Гат-Риммон
  rationale: Составное географическое название передано в традиционной русской транслитерации через дефис.
- source_word: עָרִים שְׁתָּיִם
  choice: два города
  rationale: Итоговая формула прямо указывает число перечисленных поселений; «города» соответствует עָרִים в контексте списков уделов.
