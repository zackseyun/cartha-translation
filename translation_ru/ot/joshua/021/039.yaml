- source_word: כָּל עָרִים אַרְבַּע
  choice: всего четыре города
  rationale: Краткая итоговая формула естественно передаёт еврейское «все города — четыре».
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: координация перечисления без отдельного соответствия
  rationale: Повторяющийся показатель прямого дополнения не имеет отдельного лексического эквивалента в русском; его синтаксическая функция выражена построением перечня.
