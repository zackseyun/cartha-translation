  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: ru
  text: И израильтяне[a] дали левитам из своего наследственного удела, по повелению Яхве[b], эти города и прилегающие к ним пастбищные земли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по устам Яхве».'
    reason: lexical_alternative
  - marker: c
    text: То есть открытые земли при городах, использовавшиеся, в частности, как пастбища.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: дали
  rationale: Основное повествовательное значение נתן; в контексте распределения земли возможно «выделили», но «дали» точнее сохраняет форму исходного текста.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Естественный современный русский эквивалент устойчивого древнееврейского обозначения народа; буквальная форма отмечена в сноске.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Прямое обозначение получателей, соответствующее древнееврейской форме.
- source_word: מִנַּחֲלָתָם
  choice: из своего наследственного удела
  rationale: נחלה обозначает наследственное земельное владение, полученное при распределении земли; «удел» передаёт этот контекст точнее, чем одно лишь «наследство».
- source_word: אֶל פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Естественно передаёт идиому «по устам Яхве», то есть согласно его словесному распоряжению; буквальный образ сохранён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: Прямой эквивалент существительного с указательным определением без добавления толкования «следующие».
- source_word: מִגְרְשֵׁיהֶן
  choice: принадлежавшие им пастбищные земли
  rationale: В данном контексте слово обозначает открытые земли при городах, предназначенные, в частности, для выпаса; местоименная связь относится к городам.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не вводя конфессиональной интерпретации.
- issue: Передача выражения בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  alternative: сыны Израиля; народ Израиля
  rationale: Здесь это устойчивое этническое обозначение народа. Современный коллективный эквивалент естественен по-русски, а буквальная родственная форма приведена в сноске, чтобы не скрывать устройство исходного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Союз «И» сохраняет повествовательную связь с предыдущим стихом; «наследственный удел» передаёт земельно-распределительный контекст, а сноски сохраняют буквальные древнееврейские образы.
