base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: ru
  text: Сынам Мерари[a], по их родам, — от колена Рувима, от колена Гада и от колена Завулона — двенадцать городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потомкам Мерари».'
    reason: 'Лексическая альтернатива: בְּנֵי буквально означает «сыны», но в родословно-племенном контексте охватывает потомков соответствующей ветви.'
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Сынам Мерари
  rationale: Предлог ל в контексте распределения указывает, кому назначены города; «сынам» сохраняет родовой язык еврейского текста и естественно обозначает потомков Мерари.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри левитской ветви. «По их родам» передаёт распределительный смысл и соответствует русскому библейскому стилю.
- source_word: מִמַּטֵּה
  choice: от колена
  rationale: В контексте земельного распределения מַטֶּה означает племя Израиля; традиционное и ясное русское соответствие — «колено».
- source_word: רְאוּבֵן
  choice: Рувима
  rationale: Устоявшаяся русская форма имени в родительном падеже после «от колена».
- source_word: גָד
  choice: Гада
  rationale: Устоявшаяся русская форма имени в родительном падеже.
- source_word: זְבוּלֻן
  choice: Завулона
  rationale: Устоявшаяся русская библейская форма имени в родительном падеже.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: двенадцать городов
  rationale: Естественный русский порядок числительного и существительного; עִיר в перечне уделов передано как «город».
theological_decisions: []
