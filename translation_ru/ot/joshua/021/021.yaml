base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: ru
  text: Они отдали им Сихем с его пастбищами в нагорье Ефрема[a] — город-убежище для человека, лишившего жизни другого[b], — и Гезер с его пастбищами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на горе Ефрема», то есть в гористой области Ефрема.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для убийцы». В данном правовом контексте еврейское слово обозначает человека, причинившего смерть, который мог бежать в город-убежище до разбирательства; оно не обязательно означает осуждённого за умышленное убийство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: Они отдали им
  rationale: Форма וַיִּתְּנוּ продолжает повествование и обозначает завершённое действие; союз ו в современном русском естественно не выражать. «Отдали» уместно для передачи городов левитам по уделу.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: город-убежище для убившего человека
  rationale: Сочетание обозначает установленное законом место убежища для человека, причинившего смерть. Такая формулировка не предрешает, было ли убийство умышленным, и не называет человека уже осуждённым преступником.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Традиционная и узнаваемая русская форма библейского топонима.
- source_word: מִגְרָשֶׁיהָ
  choice: его пастбищами
  rationale: מִגְרָשׁ обозначает прилегающую к городу открытую землю, предназначенную, в частности, для выпаса скота; «пастбища» ясно и естественно передаёт смысл в перечне левитских городов.
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: Здесь הַר обозначает гористую область удела Ефрема, а не одну отдельную гору. «Нагорье» сохраняет географический смысл и звучит естественно по-русски.
- source_word: גֶּזֶר
  choice: Гезер
  rationale: Устоявшаяся русская передача названия города.
theological_decisions:
- issue: Правовой статус названного הָרֹצֵחַ человека
  choice: убивший человек
  alternative: убийца; невольный убийца
  rationale: «Убийца» в современном русском может подразумевать доказанную преступную вину, а «невольный убийца» заранее определяет смерть как непреднамеренную. Исходное правовое обозначение само по себе здесь не снимает вопроса о виновности, поэтому выбрана нейтральная формулировка.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Аппозиционная конструкция с тире ясно отождествляет город-убежище с Сихемом. Формулировка сохраняет правовую неоднозначность исходного текста; маркеры сносок размещены рядом с соответствующими выражениями.
