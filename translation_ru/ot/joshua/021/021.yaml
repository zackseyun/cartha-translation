- from: Они отдали им город-убежище для убившего человека[a] — Сихем с его пастбищами в нагорье Ефрема[b], — а также Гезер с его пастбищами.
  to: Они отдали им Сихем с его пастбищами в нагорье Ефрема[a] — город-убежище для человека, лишившего жизни другого[b], — и Гезер с его пастбищами.
  rationale: 'Перестроено приложение в порядке, близком к русской естественной подаче перечня: сначала назван Сихем, затем уточнено, что это город-убежище. «Убившего человека» заменено на недвусмысленное «человека, лишившего жизни другого», которое сохраняет правовую и фактическую неоднозначность еврейского הָרֹצֵחַ. Маркеры сносок перенесены к соответствующим выражениям.'
