base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: ru
  text: Сыновьям священника Аарона дали Хеврон — город-убежище для того, кто убил человека[a], — с его пастбищными землями, а также Ливну с её пастбищными землями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для убившего» или «для убийцы». Здесь употреблён юридический термин, обозначающий человека, причинившего смерть и имеющего право бежать в город-убежище; само это слово в данном выражении не указывает однозначно, было ли убийство преднамеренным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Сыновьям священника Аарона
  rationale: Предлог לְ обозначает получателей, а בְּנֵי в данном родословном контексте относится к сыновьям или потомкам Аарона. Формулировка сохраняет структуру еврейского текста и естественно звучит по-русски.
- source_word: נָתְנוּ
  choice: дали
  rationale: Прямое значение глагола נתן — «давать». В контексте распределения городов возможно «выделили», но «дали» точнее сохраняет форму исходного текста и остаётся ясным.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: город-убежище для того, кто убил человека
  rationale: עִיר מִקְלָט — юридическое обозначение города, где мог укрыться причинивший смерть. Описательный перевод רֹצֵחַ не предполагает заранее ни умысла, ни его отсутствия и потому сохраняет правовую широту выражения.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Традиционная и общепринятая русская передача библейского топонима.
- source_word: מִגְרָשֶׁיהָ
  choice: её/его пастбищные земли
  rationale: מִגְרָשׁ обозначает открытую землю вокруг города, использовавшуюся, в частности, для выпаса. Местоимения согласованы в русском с названиями соответствующих городов.
- source_word: לִבְנָה
  choice: Ливна
  rationale: Традиционная русская передача библейского топонима.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Конструкция с тире ясно показывает, что городом-убежищем назван Хеврон. Выражение «пастбищные земли» передаёт назначение прилегающей к левитскому городу открытой территории без архаизма «предместья».
