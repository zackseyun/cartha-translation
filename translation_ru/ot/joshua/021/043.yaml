  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: ru
  text: Так Яхве отдал Израилю всю землю, которую Он поклялся дать их отцам; они вступили во владение ею[a] и поселились в ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладели ею»; еврейский глагол может также иметь значение «унаследовали её», особенно в контексте заветного обещания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן здесь обозначает передачу земли Израилю; «отдал» естественно передаёт завершённое действие и не добавляет отсутствующих в тексте оттенков.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога принятой в современном русском языке транслитерацией сохраняет отличие имени יהוה от титула «Господь».
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: В данном контексте אֶרֶץ — обещанная Израилю земля, а כָּל подчёркивает её полноту; речь не обо всей земле как мире.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: которую поклялся отдать
  rationale: Форма שׁבע выражает клятву, а русский совершенный вид естественно указывает на данное прежде обязательство.
- source_word: לַאֲבוֹתָם
  choice: их отцам
  rationale: Буквально сохраняет мужской род и семейно-заветное обозначение праотцов Израиля.
- source_word: וַיִּרָשׁוּהָ
  choice: они овладели ею
  rationale: ירשׁ здесь описывает вступление во владение обещанной землёй. «Овладели» передаёт конкретный смысл, не устраняя возможного заветного оттенка наследования, отмеченного в сноске.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: и поселились на ней
  rationale: ישׁב с предлогом ב в контексте земли означает поселиться и жить в ней; «поселились на ней» естественно отражает результат заселения.
- source_word: וַ
  choice: Так
  rationale: Начальный повествовательный союз вводит итог предшествующего рассказа; «Так» естественно передаёт его итогово-результативную функцию.
theological_decisions:
- issue: Полнота исполнения обещания о земле
  choice: Сохранить прямое утверждение, что Яхве отдал Израилю всю обещанную землю и что Израиль овладел ею и поселился на ней.
  alternative: Ослабить «всю» до частичного исполнения либо истолковать утверждение как исчерпывающее разрешение напряжения с другими повествованиями о завоевании.
  rationale: Еврейский текст подчёркивает полноту словом כָּל и представляет стих как итог исполнения обещания. Перевод сохраняет эту силу, но не привносит богословской гармонизации с другими текстами.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; точка с запятой отделяет дарование земли от последовавших вступления во владение и заселения.
