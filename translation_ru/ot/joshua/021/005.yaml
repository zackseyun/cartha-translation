base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: ru
  text: А остальным потомкам Каафа[a] из родов колена Ефрема, из колена Дана и из половины колена Манассии по жребию досталось десять городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остальным каафитам».'
    reason: 'Лексическая альтернатива: выражение בְנֵי־קְהָת может обозначать как потомков Каафа, так и названную по нему родовую группу — каафитов.'
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: А остальным потомкам Каафа
  rationale: Предлог לְ вводит следующую группу получателей, а הַנּוֹתָרִים указывает на ту часть потомков Каафа, которая не была названа в предыдущем стихе. «Потомкам» естественно передаёт родовое значение בְּנֵי в данном перечне.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: из родов
  rationale: В контексте племенного устройства מִשְׁפָּחוֹת обозначает подразделения колена; русское «роды» здесь точнее и естественнее, чем бытовое «семьи».
- source_word: מַטֵּה אֶפְרַיִם ... מַטֵּה דָן
  choice: колена Ефрема, колена Дана
  rationale: מַטֶּה в распределительных списках означает племя/колено, а не буквальный посох; «колено» соответствует принятому библейскому словоупотреблению и остаётся понятным.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: и половины колена Манассии
  rationale: Сохраняется конструкция источника, обозначающая одну из двух территориальных частей колена Манассии.
- source_word: בַּ/גּוֹרָל
  choice: по жребию
  rationale: Устойчивое русское выражение передаёт способ распределения городов.
- source_word: עָרִים עָשֶׂר
  choice: десять городов
  rationale: Прямое и естественное соответствие числительному обороту источника.
- source_word: implicit verbless clause
  choice: досталось
  rationale: В еврейском тексте глагол опущен в характерном для перечня именном предложении. «Досталось» естественно восполняет связь и ясно выражает распределение по жребию, не добавляя идеи личного действия получателей.
