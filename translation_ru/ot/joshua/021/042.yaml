  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: ru
  text: У каждого из этих городов были расположенные вокруг него пастбищные угодья[a]; так было у всех этих городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «город за городом и его пастбищные угодья вокруг него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: были
  rationale: Имперфект qal 3-го лица женского рода множественного числа от היה здесь описывает положение дел в итоговом повествовательном контексте; по-русски естественно прошедшее время «были».
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: עיר означает «город» или «поселение»; в контексте распределения левитских городов уместно традиционное и ясное «города».
- source_word: עִיר עִיר
  choice: у каждого
  rationale: Повтор существительного выражает дистрибутивность — «город за городом», то есть каждый отдельный город. Русское «у каждого» естественно передаёт эту функцию.
- source_word: וּמִגְרָשֶׁיהָ
  choice: пастбищные земли
  rationale: מִגְרָשׁ обозначает открытые угодья при городе, в том числе предназначенные для выпаса; «пастбищные земли» понятно современному читателю и не смешивает их с городскими предместьями.
- source_word: סְבִיבֹתֶיהָ
  choice: вокруг него
  rationale: Форма обозначает расположение вокруг соответствующего города. Отдельный оборот сохраняет явную пространственную характеристику еврейского текста.
- source_word: כֵּן
  choice: так было
  rationale: Слово подводит итог и распространяет описанный порядок на весь перечень; «так было» естественно для ретроспективного повествования.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: со всеми этими городами
  rationale: Предлог לְ здесь вводит совокупность, к которой относится описанный порядок. Русское «со всеми этими городами» идиоматично передаёт обобщение.
