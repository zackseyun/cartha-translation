  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: ru
  text: Всего — десять городов[a] с их пастбищными землями[b] — для родов остальных сыновей Каафа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всего десять городов». В еврейском тексте это итоговая формула, завершающая перечень.'
    reason: lexical_alternative
  - marker: b
    text: «Пастбищные земли» — открытая земля при городах, предназначенная прежде всего для выпаса скота и других хозяйственных нужд.
    reason: cultural_note
  - marker: c
    text: То есть остальных потомков Каафа, или остальных каафитян.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: Всего — десять городов
  rationale: Передаёт итоговую формулу еврейского текста, завершающую перечень, и сохраняет акцент на общем числе городов.
- source_word: מִגְרְשֵׁיהֶן
  choice: с их пастбищными землями
  rationale: Обозначает открытые земли, принадлежавшие городам и использовавшиеся, в частности, для выпаса; этот вариант ясен современному читателю и точнее устаревшего «предместья».
- source_word: לְמִשְׁפְּחוֹת
  choice: для родов
  rationale: מִשְׁפָּחוֹת — родовые подразделения племени; «роды» здесь точнее, чем современное бытовое «семьи», а לְ выражает предназначение или распределение.
- source_word: בְּנֵי קְהָת
  choice: сыновей Каафа
  rationale: Сохраняет буквальную генеалогическую формулу еврейского текста, не исключая её значения «потомки Каафа».
- source_word: הַנּוֹתָרִים
  choice: остальных
  rationale: Указывает на ту часть потомков Каафа, которая ещё не была охвачена предыдущим распределением городов; атрибутивная краткость оригинала сохранена.
theological_decisions: []
