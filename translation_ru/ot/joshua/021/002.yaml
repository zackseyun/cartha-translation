  verdict: approve
  source_fidelity: 'Текст верно передаёт все основные элементы еврейского оригинала: обращение левитов к адресатам, место действия (Силом в земле Ханаана), содержание повеления Яхве, посредническую формулу «через Моисея», города для проживания и связанные с ними земли для скота. «Обратились к ним ... и сказали» несколько разворачивает еврейское «говорили ... говоря», но не меняет смысла и естественно для русского повествования.'
