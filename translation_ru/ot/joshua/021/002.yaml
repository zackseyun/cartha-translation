  terminology: «Яхве» последовательно передаёт тетраграмматон. «Через Моисея» точно раскрывает идиоматическое בְּיַד מֹשֶׁה без внесения дополнительной интерпретации. «Пастбища при них для нашего скота» допустимо передаёт מִגְרָשִׁים в данном контексте; примечание корректно сохраняет более широкое значение незастроенных земель вокруг городов.
