source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: ru
  text: 'Они обратились к ним в Силоме, в земле Ханаанской, и сказали: «Яхве повелел через Моисея[a] дать нам города, чтобы жить в них, и пастбища[b] при них для нашего скота».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Моисея»; это еврейский оборот со значением «через Моисея».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «открытые земли» либо «общинные угодья»; еврейское слово обозначает незастроенную землю вокруг городов, в том числе использовавшуюся для выпаса скота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: они обратились к ним
  rationale: Сочетание глагола «говорить» с אֶל обозначает речь, направленную к адресатам. «Обратились к ним» естественно передаёт это по-русски, а последующее «и сказали» вводит содержание речи.
- source_word: בְּשִׁלֹה
  choice: в Силоме
  rationale: Нормальная русская предложная форма географического названия Силом.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: в земле Ханаанской
  rationale: Сохраняется явно выраженное существительное אֶרֶץ, «земля», и употребляется традиционная, но понятная современному читателю русская форма.
- source_word: לֵאמֹר
  choice: и сказали
  rationale: Еврейский инфинитив вводит прямую речь; буквальное «говоря» по-русски здесь тяжеловесно, поэтому выбран естественный повествовательный оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: צִוָּה בְיַד מֹשֶׁה
  choice: повелел через Моисея
  rationale: Идиома «рукой Моисея» обозначает посредничество или передачу повеления через него; современный русский эквивалент сохраняет этот смысл.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: дать нам города, чтобы жить в них
  rationale: Передаёт прямое значение נתן и целевое значение инфинитива ישׁב естественным современным русским синтаксисом.
- source_word: וּמִגְרְשֵׁיהֶן לִבְהֶמְתֵּנוּ
  choice: и пастбища при них для нашего скота
  rationale: מִגְרָשׁ обозначает незастроенную землю вокруг города, в данном контексте предназначенную для скота. «При них» сохраняет связь этих земель с городами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет отличие имени от титула и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Избегаются архаические «говоря» и «обитать», но сохраняются достоинство повествования, географическое обозначение «земля Ханаанская» и личное имя «Яхве».
