base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: ru
  text: А семьям сыновей Каафа — левитов, оставшихся из числа сыновей Каафа, — по жребию достались города из племени Ефрема.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «города их жребия были из племени Ефрема».'
    reason: Еврейское выражение «города их жребия» означает города, назначенные им по жребию.
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: семьям
  rationale: Предлог לְ в контексте распределения обозначает получателей; дательный падеж естественно передаёт это значение по-русски.
- source_word: בְּנֵי קְהָת
  choice: сыновей Каафа
  rationale: Сохранена традиционная генеалогическая формула; в данном контексте речь идёт о потомках Каафа, что пояснено в сноске.
- source_word: הַלְוִיִּם הַנּוֹתָרִים מִבְּנֵי קְהָת
  choice: остальных сыновей Каафа, левитов
  rationale: הַנּוֹתָרִים указывает на оставшуюся после предыдущего распределения часть каафитских левитов. Перестройка порядка слов устраняет тяжеловесное повторение, не меняя состава группы.
- source_word: עָרֵי גוֹרָלָם
  choice: по жребию достались города
  rationale: Еврейское выражение буквально означает «города их жребия»; русская формулировка ясно и естественно передаёт распределение городов посредством жребия.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: от племени Ефрема
  rationale: מַטֶּה здесь означает племя, а מִן указывает, от какого племени были выделены города.
