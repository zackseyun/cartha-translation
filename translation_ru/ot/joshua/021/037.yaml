    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Кедемоф
  rationale: Географическое название передано традиционной русской библейской формой, соответствующей еврейскому названию.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает принадлежавшую городу открытую землю, обычно использовавшуюся как общее пастбище; местоимение «его» соотнесено с каждым городом.
- source_word: מֵיפָעַת
  choice: Мефааф
  rationale: Географическое название передано традиционной русской библейской формой.
- source_word: עָרִים אַרְבַּע
  choice: четыре города
  rationale: Прямо передаёт числовой итог перечня и сохраняет обычный для списков наделов перевод עָרִים.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: с ... и ... с ...
  rationale: Повторяющийся показатель прямого дополнения организует перечень; по-русски связь каждого города с принадлежащей ему землёй естественно выражается предлогом «с».
