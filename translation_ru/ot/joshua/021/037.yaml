  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: ru
  text: Кедемоф с его пастбищными землями[a] и Мефааф с его пастбищными землями — четыре города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
