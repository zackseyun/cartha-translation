  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: ru
  text: Но поля, принадлежавшие городу, и окрестные селения[a] отдали Халеву, сыну Иефунне, во владение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посёлки»; еврейское слово может обозначать небольшие зависимые поселения, связанные с городом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: поля, принадлежавшие городу
  rationale: Существительное стоит в единственном числе, но имеет собирательное значение и обозначает сельскохозяйственные земли города. Множественное «поля» естественно передаёт этот смысл по-русски.
- source_word: חֲצֵרֶיהָ
  choice: окрестные селения
  rationale: В данном контексте слово обозначает зависимые от города небольшие поселения или расположенные вокруг него населённые места, а не пастбища.
- source_word: נָתְנוּ
  choice: отдали
  rationale: Передаёт обычное значение глагола נתן и естественно выражает передачу земель во владение.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Халеву, сыну Иефунне
  rationale: Дательный падеж передаёт косвенное дополнение с לְ; имена переданы в принятой русской библейской форме и с близкой к еврейской передачей имени Иефунне.
- source_word: בַּאֲחֻזָּתוֹ
  choice: во владение
  rationale: אֲחֻזָּה обозначает земельное владение, закреплённое за человеком; перевод сохраняет юридико-имущественный оттенок без добавления идеи наследования.
- source_word: וְאֶת
  choice: Но
  rationale: 'Начальный союз связывает стих с предыдущим и выражает смысловое противопоставление: сам город с прилегающей землёй был отдан левитам, а его поля и окрестные селения — Халеву.'
