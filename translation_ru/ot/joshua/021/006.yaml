  register: Современный литературный русский с умеренно традиционными формами библейских имён. Эллиптическая именная конструкция еврейского перечня раскрыта глаголом «досталось», подразумеваемым контекстом распределения; повтор «из племени» сохранён ради ясности и ритма списка.
