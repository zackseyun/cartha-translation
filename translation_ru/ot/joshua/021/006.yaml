  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: ru
  text: А сынам Гирсона из родов[a] племени Иссахара, из племени Асира, из племени Неффалима и из половины племени Манассии в Васане по жребию были выделены тринадцать городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из семейных групп племени Иссахара».'
    reason: Еврейское מִשְׁפָּחוֹת может обозначать родовые или расширенные семейные группы.
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹן
  choice: А сынам Гирсона
  rationale: Форма «сынам» сохраняет генеалогическое обозначение еврейского текста и в данном контексте означает потомков Гирсона; начальное «А» естественно продолжает перечень распределений.
- source_word: מִמִּשְׁפְּחוֹת מַטֵּה יִשָּׂשכָר
  choice: из родов племени Иссахара
  rationale: מִשְׁפָּחוֹת обозначает крупные семейно-родовые группы; «роды» здесь естественнее современного узкого значения слова «семьи» и не смешивается с מַטֶּה, переданным как «племя».
- source_word: מַטֵּה
  choice: племя
  rationale: В контексте территориального распределения слово обозначает племенную общность, а не буквальный посох.
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: и из половины племени Манассии
  rationale: Передаёт חֲצִי מַטֶּה буквально и ясно, без менее естественного по-русски сложного обозначения «полуплемя».
- source_word: בַבָּשָׁן
  choice: в Васане
  rationale: Сохраняется стандартная русская библейская форма географического названия; оборот относится к половине племени Манассии.
- source_word: בַּגּוֹרָל
  choice: по жребию
  rationale: Устойчивое русское выражение точно передаёт способ распределения.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: тринадцать городов
  rationale: Сохраняет значение и счётную конструкцию исходного текста.
theological_decisions: []
