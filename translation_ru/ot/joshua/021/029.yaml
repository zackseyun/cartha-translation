  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: ru
  text: Иармуф с его пастбищными землями и Ен-Ганним[a] с его пастбищными землями — четыре города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное написание: «Эйн-Ганним».'
    reason: В русской транслитерации первый компонент топонима עֵין может передаваться как «Ен» или более фонетически как «Эйн».
lexical_decisions:
- source_word: יַרְמוּת
  choice: Иармуф
  rationale: Географическое название передано в традиционной русской библейской форме, близкой к древнееврейскому звучанию.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными землями
  rationale: В перечнях левитских городов מִגְרָשׁ обозначает окружающую город открытую землю, предназначенную прежде всего для выпаса; местоимение «его» относится к каждому городу.
- source_word: עֵין גַּנִּים
  choice: Ен-Ганним
  rationale: Топоним транслитерирован, а не переведён как «источник садов»; написание отражает древнееврейскую форму и сохраняет название как имя собственное.
- source_word: עָרִים אַרְבַּע
  choice: четыре города
  rationale: Естественная русская передача стандартной итоговой формулы в списке городов.
