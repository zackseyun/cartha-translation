  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: ru
  text: 'и от колена Асира: Мишал с его пастбищными угодьями[a] и Авдон с его пастбищными угодьями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Пастбищные угодья» — открытая земля, принадлежавшая городу и использовавшаяся прежде всего для выпаса скота и других общинных нужд.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: и от колена
  rationale: В контексте распределения городов מַטֶּה означает «колено»; приставки וּמִ־ переданы как «и от».
- source_word: אָשֵׁר
  choice: Асира
  rationale: Традиционная русская форма имени колена; родительный падеж обусловлен сочетанием «от колена».
- source_word: מִשְׁאָל
  choice: Мишал
  rationale: Транслитерация топонима, близкая к масоретской форме מִשְׁאָל.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными угодьями
  rationale: מִגְרָשׁ обозначает закреплённую за городом открытую землю, в частности для выпаса и общинного пользования; местоименный суффикс женского рода относится к городу, что по-русски передано местоимением мужского рода.
- source_word: עַבְדּוֹן
  choice: Авдон
  rationale: Устоявшаяся русская библейская передача топонима.
- source_word: אֶת / וְאֶת
  choice: — / и
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; союз וְ передан словом «и».
