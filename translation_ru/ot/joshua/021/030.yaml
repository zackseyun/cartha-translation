  terminology: «Колено» — нормативное библейское обозначение племени Израиля. Формы «Асира», «Мишал» и «Авдон» приемлемы и последовательно транслитерируют имена. Сноска корректно разъясняет культурно-историческое значение מִגְרָשׁ без догматических добавлений.
