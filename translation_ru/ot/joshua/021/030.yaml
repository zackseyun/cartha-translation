  source_fidelity: 'Текст точно передаёт все смысловые элементы масоретского текста: союз и предлог («и от»), указание на колено Асира, два топонима и принадлежащие каждому городу мիգрашные земли. Перевод не добавляет отсутствующих в источнике сведений и сохраняет перечислительную структуру.'
