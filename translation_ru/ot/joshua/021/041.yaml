  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: ru
  text: Всего городов левитов среди владений сынов Израиля[a] было сорок восемь, вместе с их пастбищными угодьями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «открытыми землями» или «общинными угодьями»; речь идёт о землях вокруг городов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַלְוִיִּם
  choice: Всего городов левитов
  rationale: Передаёт итоговый характер фразы и охватывает все перечисленные города; по-русски такая конструкция естественнее буквального «все города… были сорок восемь городов».
- source_word: בְּתוֹךְ אֲחֻזַּת
  choice: среди владений
  rationale: בְּתוֹךְ обозначает нахождение внутри территории, а אֲחֻזָּה — земельное владение; множественное число по-русски естественно отражает совокупные уделы Израиля.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально сохраняет мужское национально-родовое обозначение исходного текста, не заменяя его более обобщающим «израильтян».
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: было сорок восемь
  rationale: Точно передаёт итоговое число, устраняя ненужный для русского языка повтор слова «города».
- source_word: וּמִגְרְשֵׁיהֶן
  choice: вместе с их пастбищными угодьями
  rationale: מִגְרָשׁ здесь обозначает прилегающую к городам открытую землю, предназначенную, в частности, для выпаса; «пастбищные угодья» ясно и естественно передаёт контекст.
theological_decisions:
- issue: Мужское обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян / детей Израиля
  rationale: Сохранена грамматически мужская и формально прозрачная конструкция еврейского текста; при этом она обозначает народ Израиля в целом.
- issue: Характер земель מִגְרָשׁ
  choice: пастбищные угодья
  alternative: открытые земли / общинные земли
  rationale: Контекст городских наделов допускает оттенки открытой или общей земли; основной текст выбирает наиболее понятное контекстуальное обозначение, а альтернативы сохраняются в примечании.
translation_notes:
  register: Современный литературный русский язык, сдержанный и ясный. Итоговая конструкция «Всего… было» естественно передаёт еврейское бессоюзное именное резюме; формула «сынов Израиля» сохранена ради близости к исходному обозначению.
