base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: ru
  text: 'И от колена Неффалима: Кедес в Галилее — город-убежище для человека, лишившего жизни другого человека, — с пастбищными угодьями вокруг него[a]; Хаммот-Дор с пастбищными угодьями вокруг него[b] и Картан с пастбищными угодьями вокруг него — три города.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для убившего». Еврейское слово обозначает человека, лишившего другого жизни, особенно в правовом контексте предоставления убежища, и не обязательно подразумевает преднамеренное убийство.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте — «Хаммот-Дор»; в некоторых традициях этот город отождествляется с Хамматом.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: От колена Неффалима
  rationale: В контексте распределения городов מַטֶּה означает «колено»; начальный союз естественно не выражать отдельно после предыдущего перечня.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: город-убежище для убившего человека
  rationale: עִיר מִקְלַט — юридическое обозначение города убежища. Причастие הָרֹצֵחַ указывает на того, кто лишил человека жизни, но само по себе здесь не уточняет умысел; формулировка не вводит отсутствующего в стихе уточнения «неумышленно» и не использует более обвинительное слово «убийца».
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Кедес в Галилее
  rationale: Передана традиционная русская форма топонима קֶדֶשׁ и региональное уточнение «в Галилее».
- source_word: מִגְרָשֶׁיהָ
  choice: прилегающие к нему пастбищные земли
  rationale: מִגְרָשׁ обозначает принадлежащую городу открытую землю вокруг него, в том числе используемую для выпаса; перевод передаёт и назначение, и связь с городом.
- source_word: חַמֹּת דֹּאר
  choice: Хаммот-Дор
  rationale: Масоретский текст содержит составное название; дефис делает его структуру ясной в русском тексте.
- source_word: קַרְתָּן
  choice: Картан
  rationale: Топоним транслитерирован непосредственно по масоретской форме.
- source_word: עָרִים שָׁלֹשׁ
  choice: всего три города
  rationale: Итоговая формула передана естественным русским порядком слов; «всего» ясно обозначает суммарный характер фразы.
theological_decisions:
- issue: Степень вины лица, ищущего убежища
  choice: убивший человека
  alternative: неумышленный убийца / убийца
  rationale: В данном стихе הָרֹצֵחַ называет того, кто убил, но не содержит отдельного уточнения о намеренности. Выбранная формулировка сохраняет юридическую открытость выражения и не усиливает моральную квалификацию.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского перечня. Повторяющаяся формула воспроизведена полностью ради структуры оригинала; юридическая неоднозначность הָרֹצֵחַ сохранена.
