  text: Helkath with its pasturelands, and Rehob with its pasturelands—four cities.
translation:
  language: ru
  text: Хелкат с его пастбищными угодьями и Рехов с его пастбищными угодьями — четыре города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: Хелкат
  rationale: Название места передано транслитерацией в форме, естественной для русской библейской ономастики.
- source_word: מִגְרָשֶׁהָ
  choice: с его пастбищными угодьями
  rationale: Слово обозначает закреплённую за городом прилегающую землю, в том числе для выпаса скота; «пастбищные угодья» ясно передаёт смысл в контексте левитских городов. Местоимение относится к каждому городу.
- source_word: רְחֹב
  choice: Рехов
  rationale: Название места передано транслитерацией с сохранением еврейского согласного ח через русское «х».
- source_word: עָרִים אַרְבַּע
  choice: четыре города
  rationale: Прямое соответствие итоговой числовой формуле перечня, охватывающей города данного и предыдущего стиха.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: с ... и ... с ...
  rationale: Повторяющийся показатель прямого дополнения отдельно не переводится; предлог «с» естественно выражает принадлежность угодий названным городам.
