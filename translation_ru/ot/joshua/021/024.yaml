lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Аялон
  rationale: Передача еврейского топонима в форме, принятой в современной русской библейской традиции и близкой к исходному произношению.
- source_word: מִגְרָשֶׁהָ
  choice: его пастбищные земли
  rationale: מִגְרָשׁ обозначает принадлежавшую городу землю вокруг него, в данном контексте предназначенную прежде всего для выпаса; выражение сохраняет и территориальный, и функциональный смысл.
- source_word: גַּת רִמּוֹן
  choice: Гат-Риммон
  rationale: Составной топоним передан транслитерацией; дефис показывает, что это название одного города.
- source_word: עָרִים אַרְבַּע
  choice: четыре города
  rationale: Прямой перевод итоговой формулы перечня; «города» соответствует административному контексту распределения поселений.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: перечислительная конструкция с союзом «и»
  rationale: Повторяющийся показатель прямого дополнения אֶת не имеет отдельного соответствия в русском; структура естественно передаётся перечислением.
