  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: ru
  text: 'Из колена сынов Иуды и из колена сынов Симеона они дали следующие города[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти города, которые названы по имени»; возможно также: «названия которых указаны». Еврейское выражение означает, что далее города перечислены по названиям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: они отдали
  rationale: Глагол נתן прямо означает «дать»; в контексте распределения городов речь идёт об их передаче левитам. «Отдали» естественно передаёт завершённое действие, не заменяя его более узким «назначили».
- source_word: מִמַּטֵּה
  choice: из колена
  rationale: В контексте территориального распределения מַטֶּה обозначает племя Израиля; традиционное и ясное русское соответствие — «колено».
- source_word: בְּנֵי יְהוּדָה
  choice: сынов Иуды
  rationale: Сохраняется родовая формула בני יהודה и её функция как обозначения потомков Иуды.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: и из колена сынов Симеона
  rationale: Формулировка сохраняет синтаксический параллелизм еврейского текста и родовое обозначение «сыны Симеона».
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: следующие города
  rationale: Буквально — «эти города», однако далее непосредственно следует их перечень, поэтому «следующие города» естественно выражает указательную функцию фразы по-русски.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: следующие города[a]
  rationale: Идиома указывает, что города далее перечисляются по названиям. Основной текст передаёт эту функцию естественным русским оборотом, а более буквальные варианты сохранены в примечании.
