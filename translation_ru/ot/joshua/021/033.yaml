  text: Всех городов гершонитян по их родам — тринадцать городов с их пастбищными угодьями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: всех городов
  rationale: Сочетание вводит итоговое число городов; русская конструкция «всех городов… было тринадцать» естественно передаёт еврейскую счётную формулу.
- source_word: הַגֵּרְשֻׁנִּי
  choice: гершонитян
  rationale: Форма с артиклем употреблена собирательно и обозначает потомков Гершона; традиционное русское родовое наименование здесь ясно и лаконично.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Предлог לְ указывает на распределение или классификацию по родовым группам; «по их родам» сохраняет структуру распределения и соответствует библейскому контексту.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: было тринадцать
  rationale: Число и существительное естественно включены в русскую итоговую конструкцию; слово «городов» уже названо в начале и не требует повтора.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: вместе с их пастбищными угодьями
  rationale: מִגְרָשׁ обозначает открытые земли при городе, использовавшиеся, в частности, как пастбища. «Пастбищные угодья» понятно современному читателю, а «вместе с» естественно передаёт присоединённый элемент итоговой формулы.
