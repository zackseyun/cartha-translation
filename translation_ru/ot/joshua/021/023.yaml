  text: וּ/מִ/מַּ֨טֵּה דָ֔ן אֶֽת אֶלְתְּקֵ֖א וְ/אֶת מִגְרָשֶׁ֑/הָ אֶֽת גִּבְּת֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: ru
  text: 'И от колена Дана: Элтеке с её пастбищными угодьями[a] и Гиббетон с его пастбищными угодьями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с прилегающей к нему землёй для выпаса»; также возможно: «с его общинной землёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה דָן
  choice: И от колена Дана
  rationale: В контексте распределения городов מַטֶּה означает «колено»; сочетание союза и предлога передано естественным русским оборотом «И от».
- source_word: אֵת
  choice: не передано отдельно
  rationale: Показатель определённого прямого дополнения в русском языке отдельного соответствия не имеет.
- source_word: אֶלְתְּקֵא
  choice: Элтеке
  rationale: Географическое название транслитерировано с еврейского; конечная ה здесь отражается как «е».
- source_word: מִגְרָשֶׁהָ
  choice: с её пастбищными землями
  rationale: מִגְרָשׁ обозначает земли вокруг города, предназначенные для выпаса или общего пользования; местоимение женского рода относится к Элтеке.
- source_word: גִּבְּתוֹן
  choice: Гиббетон
  rationale: Географическое название транслитерировано с еврейского.
- source_word: וְאֶת
  choice: и
  rationale: Союз передан как «и», а показатель прямого дополнения отдельно не переводится.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной структуры перечня. Формула «пастбищные земли» ясно передаёт назначение מִגְרָשׁ, а сноска сохраняет его более широкое значение прилегающей общинной земли. Для второго города употреблено «его», поскольку название «Гиббетон» грамматически соотносится со словом «город».
