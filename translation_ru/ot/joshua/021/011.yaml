base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: ru
  text: И дали им Кириаф-Арбу (Арба был отцом Анака)[a], то есть Хеврон, в нагорье Иуды, и пастбищные земли вокруг города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Арба был предком Анака». Еврейское выражение может обозначать как непосредственного отца, так и более далёкого предка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: И дали
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» естественно передаёт связь с предыдущим контекстом.
- source_word: לָהֶם
  choice: им
  rationale: Сохранено местоимение 3-го лица множественного числа без поясняющей подстановки «левитам».
- source_word: קִרְיַת אַרְבַּע
  choice: Кириаф-Арбу
  rationale: Название передано в принятой русской библейской форме; винительный падеж обусловлен глаголом «дали».
- source_word: אֲבִי הָעֲנֹוק
  choice: Арба был отцом Анака
  rationale: Аппозиция раскрыта в скобках для естественного русского синтаксиса. «Отец» сохраняет прямое значение, а возможное более широкое значение отмечено в сноске.
- source_word: הִיא חֶבְרוֹן
  choice: то есть Хеврон
  rationale: Местоимение с топонимом поясняет, что Кириаф-Арба — это Хеврон.
- source_word: בְּהַר יְהוּדָה
  choice: в нагорье Иуды
  rationale: В данном географическом выражении הַר обозначает гористую область, а не одну гору.
- source_word: מִגְרָשֶׁיהָ
  choice: пастбищные земли
  rationale: מִגְרָשׁ обозначает открытые угодья при городе, в частности используемые для выпаса.
- source_word: סְבִיבֹתֶיהָ
  choice: вокруг города
  rationale: Женский суффикс относится к названному городу; явное «города» по-русски устраняет неестественную или двусмысленную местоименную отсылку.
