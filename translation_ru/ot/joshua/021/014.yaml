lexical_decisions:
- source_word: יַתִּר
  choice: Иаттир
  rationale: Название города передано транслитерацией с учётом начального йода и принятой русской библейской формы.
- source_word: מִגְרָשֶׁהָ
  choice: с его/её пастбищами
  rationale: מִגְרָשׁ обозначает открытую общинную землю вокруг города, используемую, в частности, для выпаса скота. Множественное «пастбищами» естественно передаёт собирательный смысл; род притяжательного местоимения согласован с русской формой каждого топонима.
- source_word: אֶשְׁתְּמֹעַ
  choice: Эштемоа
  rationale: Название города передано транслитерацией, отражающей согласный состав древнееврейской формы и естественной для русского языка.
- source_word: וְאֶת
  choice: и
  rationale: Непереводимый объектный показатель אֵת в русском не выражается, а союз וְ передан словом «и», связывающим пункты перечня.
