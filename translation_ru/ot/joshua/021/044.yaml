base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: ru
  text: И Яхве даровал им покой со всех сторон, в полном соответствии со всем, в чём Он поклялся их отцам. Ни один человек из всех их врагов не мог устоять перед ними[a]. Всех их врагов Яхве отдал в их руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не стоял перед ними». Это еврейское выражение означает, что никто не мог успешно противостоять им.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в еврейском тексте: «отдал в их руку» — обычное выражение со значением «отдал под их власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: даровал им покой
  rationale: Порода hифиль глагола נוח выражает причинение покоя. «Даровал им покой» естественно передаёт действие Яхве и тему исполнения обещания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Выражение обозначает всестороннюю безопасность от окружавших угроз и естественно звучит по-русски.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: как и клялся
  rationale: Передаёт соответствие совершённого всему содержанию прежней клятвы; полнота исполнения также поддерживается контекстом.
- source_word: לַאֲבוֹתָם
  choice: их отцам
  rationale: Сохраняет конкретное мужское родственное обозначение исходного текста и отсылку к праотцам Израиля.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: Ни один человек ... не мог устоять перед ними
  rationale: Передаёт отрицательную распределительную конструкцию и военную идиому «стоять перед кем-либо» в понятной современной форме, не теряя исходного образа.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: из всех их врагов
  rationale: 'Передаёт партитивное значение מן: ни один из всей совокупности врагов.'
- source_word: נָתַן ... בְּיָדָם
  choice: отдал ... в их руки
  rationale: Естественная русская библейская идиома выражает передачу врагов под власть Израиля и сохраняет образ руки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; форма «Яхве» сохраняет его как имя и является принятой современной транслитерацией.
- issue: Мужские обозначения לַאֲבוֹתָם и אִישׁ
  choice: их отцам; ни один человек
  alternative: их предкам; никто
  rationale: Выбор сохраняет мужскую форму и конкретику еврейского текста, оставаясь понятным по-русски.
- issue: Характер обещанного покоя
  choice: даровал им покой со всех сторон
  alternative: поселил их; дал им облегчение
  rationale: Формулировка сохраняет утверждение о данном Богом покое и безопасности, не расширяя его до абсолютного отсутствия любых будущих конфликтов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «И» в начале сохраняет повествовательную связь с предыдущим стихом. Формулировки ясны для широкого читателя; идиомы исходного текста сохранены там, где они естественны по-русски, и пояснены сносками.
