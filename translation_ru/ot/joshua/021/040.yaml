base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: ru
  text: Сынам Мерари[a], по их родам, — оставшимся из левитских родов[b] — по жребию досталось всего двенадцать городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомкам Мерари»; или: «мераритам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остальным из родов левитов»; или: «оставшимся левитским родам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: всего … двенадцать городов
  rationale: כָּל в сочетании с итоговым числом естественно передано по-русски словом «всего»; עִיר здесь обозначает поселения, перечисленные как города в распределении уделов.
- source_word: לִבְנֵי מְרָרִי
  choice: сынам Мерари
  rationale: Сохранена буквальная родословная формула בְּנֵי; в данном контексте она обозначает потомков Мерари.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה в племенном и левитском устройстве точнее передаётся как «род», а предлог ל выражает распределение согласно родовым подразделениям.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: остальным из родов левитов
  rationale: 'Субстантивированное причастие הַנּוֹתָרִים передано словом «остальным»: речь идёт о последней из перечисляемых групп левитов. Формулировка сохраняет связь с более широким кругом левитских родов.'
- source_word: וַיְהִי גּוֹרָלָם
  choice: по жребию досталось
  rationale: Естественная русская формула передачи буквального «и был их жребий», сохраняющая способ распределения и не превращающая жребий в сам предмет удела.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: двенадцать городов
  rationale: Порядок слов приведён в соответствие с нормой современного русского языка.
theological_decisions: []
