  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: ru
  text: А сынам Гирсона, из левитских родов, дали из владений половины колена Манассии Голан в Васане — город-убежище для совершившего убийство, с его пастбищными землями, и Беэштеру[a] с её пастбищными землями — два города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Беэштера»; ср. 1 Пар. 6:71, где стоит «Аштароф».
    reason: alternative_reading
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹן
  choice: А сынам Гирсона
  rationale: Сохраняется буквальная родословная формула «сынам», естественная для контекста распределения городов; союз связывает стих с предыдущим перечнем.
- source_word: מִמִּשְׁפְּחֹת הַלְוִיִּם
  choice: из левитских родов
  rationale: מִשְׁפָּחוֹת обозначает родовые подразделения; «роды» здесь точнее и естественнее общего «семьи».
- source_word: מֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: от половины колена Манассии
  rationale: מַטֶּה в контексте раздела земли означает «колено»; формулировка передаёт, что города выделены из владений половины колена.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: город-убежище для совершившего убийство
  rationale: «Город-убежище» передаёт устойчивый юридический термин, а описательная формулировка не приписывает заранее умышленного убийства тому, чьё дело ещё подлежит разбирательству.
- source_word: גלון בַּבָּשָׁן
  choice: Голан в Васане
  rationale: Географические названия переданы в закрепившихся русских библейских формах.
- source_word: מִגְרָשֶׁהָ
  choice: с его/её пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые земли при левитском городе, служившие, в частности, для выпаса; местоимение согласовано в русском с названием города.
- source_word: בְּעֶשְׁתְּרָה
  choice: Беэштеру
  rationale: Основной текст следует масоретскому чтению и не заменяет название формой из параллельного места.
- source_word: עָרִים שְׁתָּיִם
  choice: два города
  rationale: Сохранён заключительный итоговый подсчёт городов.
- source_word: implicit verbal sense in allotment list
  choice: дали
  rationale: В самом стихе личная форма глагола отсутствует, но действие ясно восполняется из формулы распределения в ближайшем контексте; активная форма делает русское предложение завершённым.
theological_decisions:
- issue: Юридический смысл הָרֹצֵחַ
  choice: для совершившего убийство
  alternative: для убийцы
  rationale: Выбранная передача сохраняет правовую напряжённость установления о городе-убежище и не предполагает умысел или уже вынесенный обвинительный приговор.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («колено», «левитские роды», «город-убежище»). Синтаксис перечня сохранён, но выстроен естественно для русского; вставленное из контекста «дали» не выдаётся за явно присутствующий в стихе глагол.
