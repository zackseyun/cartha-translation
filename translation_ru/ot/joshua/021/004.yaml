base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: ru
  text: И выпал жребий семействам каафитов, и сыновьям священника Аарона из числа левитов по жребию досталось тринадцать городов от колена Иуды, от колена Симеона и от колена Вениамина.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: И выпал жребий
  rationale: Естественная русская передача древнееврейской идиомы с сохранением образа жребия; буквальное «вышел жребий» в современном русском звучит неестественно.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: семействам каафитов
  rationale: מִשְׁפְּחֹת обозначает родовые семейные подразделения; «семейства» сохраняет структуру оригинала, а «каафиты» естественно передаёт коллективное наименование потомков Каафа.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: и сыновьям священника Аарона ... досталось
  rationale: Еврейская конструкция эллиптична; «досталось» ясно выражает получение удела и связано с последующим בַּגּוֹרָל, не превращая сыновей Аарона в действующих распределителей.
- source_word: מִן הַלְוִיִּם
  choice: из числа левитов
  rationale: 'Передаёт партитивный смысл: сыновья Аарона принадлежат к более широкой группе левитов.'
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: от колена Иуды, от колена Симеона и от колена Вениамина
  rationale: מַטֶּה здесь означает племенное колено. Повторение «от колена» отражает синтаксический параллелизм еврейского текста.
- source_word: בַּגּוֹרָל
  choice: по жребию
  rationale: Стандартная и естественная русская формула распределения посредством жребия.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: тринадцать городов
  rationale: «Города» — последовательная передача עָרִים в контексте территориального распределения.
theological_decisions: []
