base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: ru
  text: Из всего доброго, что Яхве сказал дому Израиля[a], ни одно слово не осталось неисполненным; всё сбылось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ни одно из добрых обещаний, которые Яхве сказал дому Израиля, не осталось неисполненным».'
    reason: Лексически возможное контекстуальное понимание слова דָּבָר как «обещание».
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: ни одно слово… не осталось неисполненным
  rationale: Буквально глагол נָפַל означает «упасть», но здесь это идиома о слове, которое не оказалось тщетным и исполнилось. Русское «не осталось неисполненным» естественно передаёт смысл и сохраняет противопоставление заключительному «всё сбылось».
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: из всего доброго
  rationale: Еврейское выражение буквально говорит обо «всём добром слове» как о совокупности благих речений. Субстантивированное «всё доброе» сохраняет собирательность и позволяет избежать неестественного русского оборота «из всего доброго слова».
- source_word: דָּבָר
  choice: слово
  rationale: «Слово» сохраняет связь с последующим דִּבֶּר («сказал») и не вводит в основной текст более узкое толкование «обещание».
- source_word: אֲשֶׁר דִּבֶּר
  choice: что… сказал
  rationale: Относительная конструкция указывает на ранее произнесённые слова Яхве. В русском контексте простое прошедшее время звучит естественно и точно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: дому Израиля
  rationale: Сохранено формальное корпоративное и заветное обозначение «дом Израиля».
- source_word: הַכֹּל בָּא
  choice: всё сбылось
  rationale: Буквально «всё пришло»; в данном контексте это идиома осуществления сказанного. «Всё сбылось» ясно и естественно передаёт её смысл без добавления объекта.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Значение דָּבָר в контексте исполнения Божьей речи
  choice: слово
  alternative: обещание
  rationale: «Слово» сохраняет лексическую широту и связь с глаголом «сказал». Контекст допускает понимание как обещания, но основной текст не должен молча сужать значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис перестроен ради естественности, при этом сохранены все смысловые компоненты, собирательность высказывания и итоговый акцент на полном исполнении.
