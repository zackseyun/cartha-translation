  text: וּ/לְ/מִשְׁפְּח֣וֹת בְּנֵֽי מְרָרִי֮ הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים֒ מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן אֶֽת יָקְנְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת קַרְתָּ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: ru
  text: А семействам сыновей Мерари, остальным левитам, от колена Завулона дали Иокнеам с его пастбищными землями и Карту с её пастбищными землями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחוֹת
  choice: А семействам
  rationale: Союз и предлог продолжают перечень распределения городов; «семействам» естественно передаёт родовые подразделения.
- source_word: בְּנֵי מְרָרִי
  choice: сыновей Мерари
  rationale: Сохранена обычная для библейских родословий форма, обозначающая потомков Мерари.
- source_word: הַ/לְוִיִּם הַ/נּוֹתָרִים
  choice: остальным левитам
  rationale: Речь о той части левитов, которая ещё не была названа в предшествующем распределении.
- source_word: מֵ/אֵת מַטֵּה זְבוּלֻן
  choice: от колена Завулона
  rationale: В контексте земельного распределения מַטֶּה означает «колено», а מֵאֵת указывает, от какого колена выделены города.
- source_word: יָקְנְעָם
  choice: Иокнеам
  rationale: Традиционная и узнаваемая русская передача данного топонима.
- source_word: מִגְרָשֶׁהָ
  choice: с его/её пастбищными землями
  rationale: מִגְרָשׁ обозначает прилегающую к городу открытую землю, в том числе используемую под выпас; формулировка точна и понятна современному читателю.
- source_word: קַרְתָּה
  choice: Карта
  rationale: Русская транслитерация еврейского топонима קַרְתָּה с передачей конечного гласного.
theological_decisions: []
