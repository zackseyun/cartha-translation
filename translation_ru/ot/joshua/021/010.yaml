base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: ru
  text: Первый жребий выпал сыновьям Аарона — из родов каафитян, из сыновей Левия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן
  choice: Он достался сынам Аарона
  rationale: Безлично-посессивная еврейская конструкция в контексте распределения городов естественно передана глаголом «достался»; местоимение «он» отсылает к предшествующему перечню городов или уделу.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: из родов каафитян
  rationale: מִשְׁפָּחוֹת обозначает родовые подразделения; «роды» уместно в племенном контексте и не требует примечания. Гентилий передан традиционным русским названием «каафитяне».
- source_word: מִבְּנֵי לֵוִי
  choice: из сынов Левия
  rationale: Сохранена генеалогическая форма исходного текста, а не обобщающее «из левитов».
- source_word: כִּי
  choice: потому что
  rationale: Передана наиболее вероятная причинная связь с последующим сообщением о первом жребии.
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: им выпал первый жребий
  rationale: Русская идиома «выпал жребий» точно и естественно выражает распределение по жребию; רִאשֹׁנָה указывает на первенство в последовательности.
