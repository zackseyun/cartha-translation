base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: ru
  text: Тогда главы левитских родов подошли к священнику Елеазару, к Иисусу, сыну Навина, и к главам родов племён сынов Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к главам родов израильских племён». Буквально: «к главам родов племён сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: пришли к
  rationale: В данном повествовательно-административном контексте נגשׁ обозначает приближение к упомянутым руководителям; русское «пришли к» естественно передаёт направленное обращение без излишней архаичности.
- source_word: רָאשֵׁי אֲבוֹת
  choice: главы родов
  rationale: Еврейское выражение буквально связано с «отцами», но идиоматически обозначает руководителей родовых объединений. «Главы родов» сохраняет патрилинейную общественную структуру и звучит естественно по-русски.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое русское обозначение потомков Левия.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: священнику Елеазару
  rationale: כֹּהֵן прямо означает «священник»; русский порядок слов естественно связывает должность с именем.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисусу, сыну Навина
  rationale: Использована устоявшаяся русская библейская форма имени и патронима, обеспечивающая узнаваемость персонажа.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: главам родов племён
  rationale: 'Передаёт вложенную общественную структуру: главы родовых объединений, относящихся к племенам Израиля.'
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет буквальный семейно-корпоративный образ בני ישראל и его связь с племенами, не сводя выражение просто к этнониму.
theological_decisions:
- issue: Гендерно маркированный язык родства в племенном устройстве Израиля
  choice: Сохранить выражение «сынов Израиля», а רָאשֵׁי אֲבוֹת передать как естественное русское «главы родов»
  alternative: «израильтян»; «народа Израиля»; буквально «главы отцов»
  rationale: «Сыны Израиля» сохраняет явный образ общего происхождения и корпоративной принадлежности. Буквальное «главы отцов» в современном русском не выражает нужного общественного института, тогда как «главы родов» точно передаёт его смысл, не устраняя патрилинейный характер структуры.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; устоявшиеся имена «Иисус Навин» и «Елеазар» сохранены. Единственная сноска поясняет буквальный родовой оборот, не перегружая основной текст.
