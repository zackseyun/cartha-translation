  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: ru
  text: Разве Я не повелел тебе? Будь силён и мужественен. Не ужасайся и не падай духом, ведь Яхве[a], твой Бог, с тобой, куда бы ты ни пошёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя יהוה (YHWH) традиционно передаётся в переводах словом «Господь»; здесь передано как «Яхве».
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: Разве Я не повелел тебе?
  rationale: Сохраняет отрицательный риторический вопрос как настойчивое напоминание о ранее данном повелении.
- source_word: חֲזַק וֶאֱמָץ
  choice: Будь силён и мужественен
  rationale: 'Передаёт устойчивую пару понятий: внутреннюю силу и мужество, не сводя их к одному качеству.'
- source_word: אַל תַּעֲרֹץ
  choice: Не ужасайся
  rationale: Глагол выражает сильный страх или ужас; этот перевод сохраняет более интенсивный оттенок, чем общее «не бойся».
- source_word: וְאַל תֵּחָת
  choice: и не падай духом
  rationale: Естественно по-русски передаёт состояние подавленности и утраты решимости, обозначаемое формой глагола חתת.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для повеления и естественно связывает увещание с обещанием Божьего присутствия.
- source_word: עִמְּךָ
  choice: с тобой
  rationale: Прямо и идиоматично выражает Божье присутствие рядом с Иисусом Навином.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Точно передаёт существительное с притяжательным суффиксом второго лица мужского рода единственного числа.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: куда бы ты ни пошёл
  rationale: Естественная русская формулировка, сохраняющая всеохватное значение выражения.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя YHWH. Транслитерация «Яхве» делает это явным; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом увещания. Обращение последовательно передано формами мужского рода единственного числа, поскольку адресат — Иисус Навин. Сильный оттенок страха в ערץ сохранён словом «ужасайся», а חתת передано естественным выражением «падать духом».
