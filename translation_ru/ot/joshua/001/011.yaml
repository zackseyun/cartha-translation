  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: ru
  text: 'Пройдите по стану и прикажите народу: «Приготовьте себе припасы, потому что ещё три дня[a] — и вы перейдёте через этот Иордан, чтобы войти и овладеть землёй, которую Яхве, ваш Бог, даёт вам во владение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «в течение трёх дней» или «по прошествии трёх дней». Еврейский оборот указывает на короткий оставшийся срок до переправы.'
    reason: Лексико-временная неоднозначность выражения בְּעוֹד שְׁלֹשֶׁת יָמִים.
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Пройдите по стану
  rationale: Императив עבר обозначает движение через пространство стана; формулировка естественна по-русски и передаёт, что начальники должны пройти среди расположившегося народа.
- source_word: וְצַוּוּ אֶת־הָעָם
  choice: и прикажите народу
  rationale: צוה выражает властное распоряжение; «прикажите» сохраняет его силу без излишней архаизации.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Приготовьте себе припасы
  rationale: צֵידָה — пищевые и иные припасы для предстоящего пути; «припасы» точнее общего «еду» и соответствует военному контексту.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: потому что ещё три дня — и
  rationale: Оборот передаёт краткий оставшийся срок до переправы. Русская конструкция естественно выражает близость события, не превращая указание в жёсткое хронологическое вычисление.
- source_word: אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן הַזֶּה
  choice: вы перейдёте через этот Иордан
  rationale: Причастная форма обозначает предстоящее и уже близкое действие; русский видо-временной эквивалент «перейдёте» звучит естественно. Указательное «этот» сохранено.
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: чтобы войти и овладеть землёй
  rationale: 'Два инфинитива передают цель перехода: войти в землю и вступить во владение ею. «Овладеть» сохраняет завоевательно-наследственный оттенок ירשׁ.'
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, ваш Бог
  rationale: Личное имя יהוה передано как «Яхве», а приложение отделено запятой в соответствии с нормами современного русского языка.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: даёт вам во владение
  rationale: Причастие נֹתֵן представляет дарование земли как уже совершающееся и несомненное; оборот также сохраняет повтор корня ירשׁ, насколько это допускает естественный русский язык.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Соотношение Божьего дара и овладения землёй Израилем
  choice: «овладеть землёй, которую Яхве… даёт вам во владение»
  alternative: Устранить повтор и сказать только «получить землю»
  rationale: 'Текст удерживает оба аспекта: Израиль должен войти и овладеть землёй, и одновременно земля является даром Бога. Перевод не сглаживает это напряжение.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой и понятный; избегаются церковнославянизмы, при этом сохраняются повтор владения, указательное «этот» и близость предстоящей переправы.
