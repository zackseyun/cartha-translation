  text: 'Тогда Иисус Навин повелел распорядителям народа:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Тогда ... повелел
  rationale: Форма wayyiqtol продвигает повествование вперёд; «тогда» естественно передаёт последовательность действий, а «повелел» сохраняет силу распоряжения.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Употреблено традиционное и общепонятное русское библейское имя, позволяющее отличить этого персонажа от Иисуса Христа.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его синтаксическая функция передана винительным падежом слова «распорядителям» при глаголе управления.
- source_word: שֹׁטְרֵי
  choice: распорядителям
  rationale: Слово обозначает административных должностных лиц или надзирателей, а не военачальников. «Распорядители» передаёт их функцию и не создаёт современного полицейского оттенка, возможного у слова «офицеры».
- source_word: הָעָם
  choice: народа
  rationale: עָם обозначает здесь собранный народ Израиля; прямое и естественное русское соответствие — «народ».
- source_word: לֵאמֹר
  choice: передано двоеточием
  rationale: Формула вводит прямую речь, следующую в следующем стихе. В современном русском двоеточие выполняет эту функцию естественнее, чем буквальное «говоря».
