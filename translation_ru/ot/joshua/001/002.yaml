  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: ru
  text: Моисей, раб Мой, умер. А теперь встань, перейди через этот Иордан — ты и весь этот народ — в землю, которую Я даю им, сынам Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам» или «детям Израиля»; букв. «сынам Израиля». Выражение обозначает народ Израиля в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: раб Мой
  rationale: В отношении Моисея слово עֶבֶד служит почётным обозначением его принадлежности Богу и верного служения Ему. «Раб Мой» сохраняет традиционную библейскую формулу и в современном русском звучит естественнее и весомее, чем «слуга Мой» в данном контексте.
- source_word: מֵת
  choice: умер
  rationale: Перфект констатирует смерть Моисея как свершившийся факт, определяющий нынешнее поручение Иисусу Навину. Русское «умер» передаёт краткость и прямоту еврейской фразы.
- source_word: וְעַתָּה
  choice: Итак, теперь
  rationale: Сочетание союза с наречием обозначает переход к поручению и его следствие из предыдущего факта. «Итак, теперь» передаёт и связь, и временной поворот.
- source_word: קוּם
  choice: встань
  rationale: Императив призывает перейти к решительному действию. «Встань» точно и естественно передаёт его без излишней архаизации.
- source_word: עֲבֹר
  choice: перейди через
  rationale: При прямом дополнении «Иордан» глагол означает пересечение водной преграды. Русская конструкция «перейди через» ясна и идиоматична.
- source_word: אֶת־הַיַּרְדֵּן הַזֶּה
  choice: через этот Иордан
  rationale: Указательное местоимение הַזֶּה явно присутствует в исходном тексте и сохранено. Название «Иордан» не требует добавления слова «река».
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: ты и весь этот народ
  rationale: Перевод сохраняет личное выделение Иисуса Навина, собирательное единственное «народ» и указательное значение הַזֶּה.
- source_word: אֶל־הָאָרֶץ
  choice: в землю
  rationale: После глагола движения предлог אֶל обозначает направленное вступление в страну; русское «в землю» естественно выражает это движение.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: которую Я даю им
  rationale: Причастие נֹתֵן представляет дарование как совершающееся или непосредственно предстоящее действие. Настоящее время «даю» сохраняет этот аспект и торжественную непосредственность Божьей речи.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально передаёт мужское множественное בְּנֵי и сохраняет прозрачную связь с именем праотца Израиля; более естественное корпоративное значение пояснено в сноске.
theological_decisions:
- issue: Мужское корпоративное обозначение לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; детям Израиля
  rationale: Еврейский текст буквально говорит «сынам Израиля», хотя выражение обозначает народ Израиля в целом. Основной текст сохраняет форму оригинала, а сноска сообщает естественные смысловые соответствия, не сужая круг референтов только до взрослых мужчин.
translation_notes:
  register: Современный литературный русский с достоинством прямой Божьей речи. Синтаксис остаётся ясным для обычного читателя; «раб Мой» и «сынам Израиля» сохраняют значимые формулы оригинала, а тире передаёт подчёркнутое добавление «ты и весь этот народ».
