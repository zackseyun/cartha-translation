  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: ru
  text: 'Только будь силён и очень мужествен: тщательно соблюдай и исполняй весь закон, который заповедал тебе Моисей, раб Мой. Не уклоняйся от него ни вправо, ни влево, чтобы ты поступал мудро[a], куда бы ни пошёл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы преуспевать» или «иметь успех» — во всём, что ты делаешь, куда бы ни шёл.'
    reason: Лексическое значение תַּשְׂכִּיל допускает как идею благоразумного действия, так и достигаемого благодаря ему успеха.
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: 'Передаёт ограничительно-усилительный характер частицы: далее выделяется главное условие для Иисуса Навина.'
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: будь твёрд и очень мужествен
  rationale: 'Сохраняет парные повеления: חזק указывает на твёрдость и силу, אמץ — на решимость и мужество; מְאֹד передано естественным усилителем «очень».'
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: тщательно исполняй
  rationale: Сочетает идею внимательного соблюдения с практическим исполнением; двоеточие естественно связывает это наставление с предшествующим призывом.
- source_word: כְּכָל הַתּוֹרָה
  choice: весь закон
  rationale: В данном контексте תּוֹרָה обозначает совокупность заповеданного через Моисея наставления с явным заветно-правовым смыслом.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: который заповедал тебе Моисей, раб Мой
  rationale: Прямо передаёт относительное предложение и сохраняет данное Богом обозначение Моисея.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Не уклоняйся от него ни вправо, ни влево
  rationale: «Уклоняться» ясно передаёт метафору отклонения от предписанного пути; конструкция «ни… ни…» естественна для русского языка.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно выражает цель или ожидаемый результат.
- source_word: תַּשְׂכִּיל
  choice: поступать мудро
  rationale: Передаёт основную идею разумного, благоразумного действия, не сводя значение исключительно к внешнему успеху.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: куда бы ты ни пошёл
  rationale: Сохраняет глагол הלך («идти, ходить») и передаёт всеохватность выражения естественным русским оборотом.
theological_decisions:
- issue: Значение תּוֹרָה в контексте завета
  choice: закон
  alternative: наставление
  rationale: Упоминание заповеданного Моисеем указывает здесь прежде всего на заветный закон, хотя более широкое значение «наставление» лексически возможно.
- issue: Значение תַּשְׂכִּיל
  choice: поступать мудро
  alternative: преуспевать; иметь успех
  rationale: Форма от שׂכל может обозначать благоразумное действие и связанный с ним успех. Основной текст сохраняет смысл мудрого поведения, а возможный оттенок успеха отмечен в сноске, чтобы не превращать стих в однозначное обещание процветания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка упрощён ради естественного чтения, при этом сохранены повелительный характер, образ пути и смысловая неоднозначность заключительного глагола.
