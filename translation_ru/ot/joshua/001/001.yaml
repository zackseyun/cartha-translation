base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: ru
  text: 'После смерти Моисея, слуги Яхве, Яхве сказал Иисусу, сыну Навина, помощнику Моисея[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переданное как «помощнику», можно также перевести: «служителю Моисея» или «слуге Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: После смерти
  rationale: Формула וַיְהִי вводит повествовательную ситуацию, а אַחֲרֵי מוֹת задаёт время. В современном русском естественное начало «После смерти» передаёт эту функцию без архаичного «И было» и без добавления отсутствующего в еврейском наречия «теперь».
- source_word: עֶבֶד יְהוָה
  choice: слуги Яхве
  rationale: В почётном титуле Моисея עֶבֶד обозначает человека, преданно служащего Богу; «слуга» здесь точнее по регистру, чем «раб», которое выдвинуло бы на первый план зависимый статус.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом «Господь».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисусу, сыну Навина
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; патроним передан явно, в соответствии с еврейским בִּן.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: помощнику Моисея
  rationale: מְשָׁרֵת обозначает того, кто состоит при другом и служит ему. «Помощник» естественно выражает роль Иисуса при Моисее и не смешивает это обозначение с почётным титулом עֶבֶד יְהוָה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит следующую прямую речь. В современном русском эту функцию естественно и полно выполняет двоеточие после глагола «сказал».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Передача עֶבֶד в титуле Моисея
  choice: слуга
  alternative: раб
  rationale: Оба значения лексически возможны, но сочетание עֶבֶד יְהוָה здесь является почётным обозначением верного служения Моисея, поэтому «слуга» лучше сохраняет контекстуальный смысл и достоинство титула.
- issue: Различение עֶבֶד и מְשָׁרֵת
  choice: слуга Яхве; помощник Моисея
  alternative: раб Яхве; служитель Моисея
  rationale: Разные русские слова отражают различие между почётным отношением Моисея к Яхве и служебной ролью Иисуса при Моисее, не превращая это различие в жёсткое богословское противопоставление.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Опущено буквальное «И было», поскольку в данном месте это повествовательная формула. Повтор имени «Моисей» сохранён ради ясности и соответствия оригиналу; לֵאמֹר передано нормативным знаком введения прямой речи.
