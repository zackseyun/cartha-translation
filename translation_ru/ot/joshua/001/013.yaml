source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: ru
  text: 'Помните повеление, данное вам Моисеем, слугой Яхве: «Яхве, ваш Бог, дарует вам покой и дал вам эту землю»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и даст вам эту землю». Еврейская глагольная форма может обозначать как уже совершённое действие, так и несомненное будущее; восточноиорданские племена к этому времени уже получили свой удел.'
    reason: Сохраняет аспектуально-временную неоднозначность וְנָתַן и поясняет контекст основного перевода.
lexical_decisions:
- source_word: זָכוֹר
  choice: Помните
  rationale: Форма — повелительное наклонение единственного числа, грамматически обращённое к собирательному адресату; по-русски естественно множественное число, поскольку далее стоят формы «вам» и речь обращена к нескольким племенам.
- source_word: הַדָּבָר
  choice: слово
  rationale: דבר может означать «слово», «дело» или «повеление». «Слово» сохраняет широту значения, тогда как властный характер сказанного уже выражен глаголом «заповедал».
- source_word: צִוָּה
  choice: заповедал
  rationale: Передаёт авторитетное предписание Моисея и соответствует приподнятому, но понятному библейскому регистру.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: В данном почётном титуле עבד обозначает человека, состоящего на служении Богу; «слуга» уместнее русского «раб», которое здесь могло бы неоправданно выдвинуть на первый план подневольный статус.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом «Господь».
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная формула введения цитаты естественно передаётся по-русски пунктуационно, без тяжеловесного «говоря».
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямо передаёт конструкцию со вторым лицом множественного числа.
- source_word: מֵנִיחַ
  choice: дарует вам покой
  rationale: Причастие породы hифиль выражает причинение или предоставление покоя. Настоящее время сохраняет актуальный, разворачивающийся характер действия; «дарует покой» естественно включает безопасность и обретение места для мирной жизни.
- source_word: וְנָתַן
  choice: и дал вам
  rationale: Форма qatal допускает понимание как уже совершённого и сохраняющего силу действия; это согласуется с контекстом восточноиорданских племён, которым земля уже была предоставлена. Подлинная аспектуально-временная неоднозначность отмечена в сноске.
- source_word: הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: Естественный русский эквивалент указательной конструкции, обозначающей конкретную уже упомянутую территорию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» сохраняет эту функцию и не подменяет имя титулом.
- issue: Временное значение וְנָתַן
  choice: дал вам эту землю
  alternative: даст вам эту землю
  rationale: Еврейская форма допускает как совершённое действие, так и уверенное будущее. В непосредственном повествовательном контексте земля к востоку от Иордана уже была выделена адресатам, поэтому в основном тексте выбран прошедший вид, а возможное будущее прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой и понятный; формула לֵאמֹר передана двоеточием. Местоименная форма «Помните» согласована с фактическим множественным адресатом, хотя в еврейском употреблён собирательный императив единственного числа.
