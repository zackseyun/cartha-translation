base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: ru
  text: Будь силён и мужествен, потому что ты дашь этому народу землю в наследие[a] — землю, которую Я поклялся дать их отцам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты наделишь этот народ землёй». Буквально: «ты сделаешь этот народ наследником». Еврейский глагол имеет каузативную форму: Иисус Навин даст народу землю как наследие.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть праотцам Израиля, прежде всего патриархам; возможный перевод: «их предкам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק
  choice: Будь твёрд
  rationale: Повелительная форма призывает Иисуса Навина проявить внутреннюю стойкость. «Будь твёрд» естественно сочетается в современном русском языке с последующим «и мужествен».
- source_word: וֶאֱמָץ
  choice: и мужествен
  rationale: В устойчивом сочетании с חזק глагол выражает мужество и решимость; выбранная формулировка сохраняет торжественный, но понятный регистр.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для повеления и ясно передаёт причинную связь.
- source_word: תַּנְחִיל
  choice: ты передашь … в наследие
  rationale: Каузативная форма от נחל означает, что Иисус Навин обеспечит получение народом земли как наследия. Русская идиома «передать в наследие» передаёт смысл естественнее буквальной каузативной конструкции; буквальная особенность отмечена в сноске.
- source_word: הָעָם הַזֶּה
  choice: этому народу
  rationale: Сохранены собирательное единственное число и указательное значение еврейского выражения.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте речь идёт об обещанной Израилю земле; «земля» является точным и традиционно понятным соответствием.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся
  rationale: Форма обозначает ранее данную Богом клятву; совершенный вид естественно передаёт завершённость этого обещания.
- source_word: לַאֲבוֹתָם
  choice: их отцам
  rationale: Буквально речь идёт об «их отцах», то есть о праотцах Израиля, прежде всего патриархах. Основной текст сохраняет явно мужское обозначение исходника.
- source_word: לָתֵת לָהֶם
  choice: дать их отцам
  rationale: Инфинитив раскрывает содержание клятвы. В русском языке местоимение при «дать» естественно объединено с предшествующим выражением «их отцам».
theological_decisions:
- issue: Передача каузативного значения תַּנְחִיל
  choice: ты передашь этому народу в наследие
  alternative: ты сделаешь этот народ наследником
  rationale: Основной вариант сохраняет представление о земле как данном Богом наследии и звучит естественно по-русски, не приписывая Иисусу Навину роль первоначального дарителя. Каузативный оттенок исходного глагола раскрыт в сноске.
- issue: Обозначение праотцов לַאֲבוֹתָם
  choice: их отцам
  alternative: их предкам
  rationale: Еврейское слово имеет мужскую форму и в данном контексте указывает на праотцов Израиля, особенно патриархов. Вариант «отцам» сохраняет форму и богословскую связь с обетованиями патриархам, а более широкое «предкам» отмечено как возможное пояснение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой и доступный; местоимение «Я» написано с прописной буквы как обозначение говорящего Бога.
