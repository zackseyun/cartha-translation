  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: ru
  text: Ваши жёны, дети и скот останутся в земле, которую Моисей дал вам за Иорданом. Вы же, все храбрые воины, перейдите вооружёнными[a] впереди ваших братьев[b] и помогите им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в боевом строю»; точный оттенок еврейского слова не вполне ясен.'
    reason: alternative_reading
  - marker: b
    text: 'То есть впереди остальных израильтян; в еврейском тексте буквально: «ваших братьев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: ваши жёны
  rationale: В семейно-военном контексте речь идёт именно о жёнах мужчин, которым адресовано повеление.
- source_word: טַפְּכֶם
  choice: дети
  rationale: טַף обозначает малых детей или зависимых членов семьи; «дети» естественно и ясно передаёт смысл по-русски без неуместной архаичности.
- source_word: וּמִקְנֵיכֶם
  choice: и скот
  rationale: מִקְנֶה здесь означает домашних стадных животных; «скот» — точное и естественное русское соответствие.
- source_word: יֵשְׁבוּ
  choice: останутся
  rationale: В данном контексте ישב указывает на пребывание семей на уже полученной земле, пока воины переходят Иордан.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Сохраняет относительную пространственную формулировку еврейского текста и звучит естественно в русском библейском повествовании.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: вы же ... перейдите
  rationale: «Же» ясно передаёт контраст между остающимися семьями и мужчинами, которым надлежит перейти реку.
- source_word: חֲמֻשִׁים
  choice: вооружёнными
  rationale: В военном контексте наиболее вероятен смысл готовности и оснащённости к сражению; точный оттенок остаётся спорным и отмечен в сноске.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: впереди ваших братьев
  rationale: Передаёт пространственный и военный смысл выхода перед остальными израильтянами.
- source_word: אֲחֵיכֶם
  choice: ваших братьев
  rationale: Сохраняет мужской термин родства исходного текста, употреблённый здесь применительно к соплеменникам-израильтянам.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: все храбрые воины
  rationale: Естественно передаёт обозначение способных, доблестных бойцов, не прибегая к тяжеловесному буквализму.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: и помогите им
  rationale: Последовательное повелительное значение в контексте ясно выражено русским императивом.
theological_decisions:
- issue: Мужской термин родства אֲחֵיכֶם
  choice: ваших братьев
  alternative: ваших соплеменников / остальных израильтян
  rationale: Основной текст сохраняет образ родства и грамматический род оригинала; сноска поясняет более широкий контекстуальный референт, не подменяя исходную формулировку.
- issue: Военный термин חֲמֻשִׁים
  choice: вооружёнными
  alternative: в боевом строю / готовыми к бою
  rationale: Значение вооружённости наиболее вероятно в контексте, однако еврейское слово допускает оттенок организованного боевого построения, поэтому альтернатива вынесена в сноску.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис перестроен естественно для русского: определение «все храбрые воины» поставлено при подлежащем, а «вооружёнными» — при глаголе движения. Все маркеры сносок присутствуют в основном тексте.'
