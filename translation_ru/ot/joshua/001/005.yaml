source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: ru
  text: Ни один человек[a] не устоит перед тобой[b] во все дни твоей жизни. Как Я был с Моисеем, так буду и с тобой. Я не оставлю тебя без поддержки[c] и не покину тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово стоит в форме мужского рода единственного числа, но употреблено обобщённо: речь идёт о любом человеческом противнике.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не сможет устоять против тебя». Еврейское выражение может означать успешное сопротивление.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не отпущу тебя». Первый глагол может передавать мысль о том, чтобы не ослабить хватку и не перестать поддерживать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: не устоит
  rationale: Возвратная форма глагола יצב здесь обозначает противостояние перед Иисусом Навином; русский глагол «устоять» естественно передаёт как образ стояния, так и смысл успешного сопротивления.
- source_word: אִישׁ
  choice: ни один человек
  rationale: Существительное мужского рода в единственном числе имеет обобщающее значение. «Ни один человек» сохраняет указание на человеческого противника и естественно звучит по-русски.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Буквальное пространственное выражение в военном контексте означает противостояние; сочетание «устоять перед тобой» сохраняет еврейский образ и ясно передаёт смысл.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: во все дни твоей жизни
  rationale: Прозрачно передаёт стандартное еврейское выражение, охватывающее всю продолжительность жизни Иисуса Навина.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: Как Я был с Моисеем
  rationale: Союз כַּאֲשֶׁר вводит прямое сравнение между Божьим присутствием с Моисеем и обещанным присутствием с Иисусом Навином.
- source_word: אֶהְיֶה עִמָּךְ
  choice: так буду и с тобой
  rationale: Передаёт обещание Божьего присутствия и одновременно естественно завершает русскую сравнительную конструкцию «как… так…».
- source_word: אַרְפְּךָ
  choice: не оставлю тебя без поддержки
  rationale: В породе хифиль глагол רפה может означать ослабить хватку, отпустить или перестать поддерживать. Выбранная формулировка сохраняет отличие от следующего глагола «покинуть» и остаётся понятной современному читателю.
- source_word: אֶעֶזְבֶךָּ
  choice: не покину тебя
  rationale: Глагол עזב означает оставить или покинуть. «Не покину тебя» передаёт торжественное обещание верности, не дублируя полностью предыдущую часть.
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: Ни один человек
  alternative: Никто; ни один мужчина
  rationale: Форма мужского рода обозначает здесь любого человеческого противника, а не только мужчин как отдельную группу. Формулировка сохраняет слово «человек» и не сужает обещание.
- issue: Смысл обещания לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  choice: Я не оставлю тебя без поддержки и не покину тебя
  alternative: Я не отпущу тебя и не оставлю тебя
  rationale: 'Два разных глагола выражают взаимодополняющие стороны Божьей верности: Он не прекратит поддерживать Иисуса Навина и не покинет его. Перевод сохраняет это различие, не вводя дополнительного богословского толкования.'
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной торжественностью. Сравнительная конструкция «как… так…» естественна для русского синтаксиса. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской практике.
