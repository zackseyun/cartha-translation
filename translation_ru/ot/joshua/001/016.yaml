  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: ru
  text: 'И они ответили Иисусу Навину: «Всё, что ты повелел нам, исполним, и куда бы ты ни послал нас, пойдём».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: И они ответили
  rationale: Порода qal и форма wayyiqtol вводят ответ в повествовании; «ответили» точно и естественно передаёт значение.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: При глаголе «ответили» лицо, к которому обращаются, естественно выражается в русском дательным падежом. Традиционная русская форма имени обеспечивает узнаваемость.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейская формула «говоря» вводит прямую речь; в современном русском её естественно передать пунктуационно, без тяжеловесного «сказав».
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: Всё, что ты повелел нам
  rationale: «Всё, что» передаёт полноту обещанного послушания, а «повелел» сохраняет властный оттенок צוה.
- source_word: נַעֲשֶׂה
  choice: исполним
  rationale: В отношении повеления русский глагол «исполним» естественно передаёт смысл «сделаем, осуществим».
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: и куда бы ты ни послал нас
  rationale: Сочетание אֶל с контекстом глаголов «послать» и «идти» имеет локативный смысл; конструкция «куда бы… ни» естественно выражает неограниченность места назначения.
- source_word: נֵלֵךְ
  choice: пойдём
  rationale: Прямое и идиоматичное соответствие глаголу הלך в данном обещании.
