base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: ru
  text: От пустыни и от этого Ливана до великой реки — реки Евфрат, — вся земля хеттеев — и до Великого моря[a], в сторону захода солнца[b], будет вашей границей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Средиземного моря.
    reason: cross_reference
  - marker: b
    text: 'Или: «на западе»; буквально: «в сторону захода солнца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: От пустыни
  rationale: Слово מִדְבָּר обозначает пустынную, необжитую местность. «Пустыня» естественно передаёт здесь географический ориентир, не уточняя его сверх текста.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: и этого Ливана
  rationale: Сохранены как название «Ливан», так и явно выраженное указательное местоимение הַזֶּה — «этот».
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: до великой реки, реки Евфрат
  rationale: 'Сохранена еврейская аппозиция: сначала «великая река», затем её уточнение — «река Евфрат».'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: вся земля хеттеев
  rationale: Прямо переданы כֹּל («вся») и этногеографическое обозначение «земля хеттеев».
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: и до Великого моря
  rationale: В основном тексте сохранено буквальное древнее географическое наименование; отождествление со Средиземным морем вынесено в примечание.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: к заходу солнца
  rationale: Передан образ еврейского выражения, которое буквально говорит о заходе солнца и обозначает западное направление.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: будет ваша граница
  rationale: Единственное число соответствует форме יִהְיֶה и существительному גְּבוּל; будущее время передаёт обещание и установление границы.
