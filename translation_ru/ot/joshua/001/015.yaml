  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: ru
  text: до тех пор, пока Яхве не даст покой вашим братьям[a], как уже дал вам, и пока они также не овладеют землёй, которую Яхве, ваш Бог, даёт им. Тогда вы вернётесь в землю, данную вам во владение, и овладеете ею — землёй, которую Моисей, слуга Яхве, дал вам за Иорданом, к восходу солнца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим соплеменникам»; буквально: «вашим братьям». Здесь имеются в виду остальные колена Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или просто: «на востоке»; буквально: «к восходу солнца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: даст покоя
  rationale: Hiphil от נוח в данном контексте означает даровать покой и устроенность после военных действий; выражение естественно по-русски и сохраняет образ покоя.
- source_word: לַאֲחֵיכֶם
  choice: вашим братьям
  rationale: Сохранена грамматически мужская форма еврейского текста; контекстуальное указание на остальные колена Израиля вынесено в примечание.
- source_word: כָּכֶם
  choice: как и вам
  rationale: Еврейское сравнение эллиптично; русский оборот сохраняет краткость, а подразумеваемое «дал покой» ясно из контекста.
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם
  choice: овладеют / овладеете
  rationale: ירשׁ здесь обозначает вступление во владение уделом; «овладеть» передаёт активный аспект освоения земли и позволяет сохранить повтор корня.
- source_word: נֹתֵן
  choice: даёт
  rationale: Настоящее время передаёт причастную форму и представляет дарование земли как совершающееся действие Бога.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: землю, данную вам во владение
  rationale: Так передаётся значение наследственного владения без тяжеловесного буквального оборота «земля вашего владения».
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: В почётном титуле Моисея עבד означает служителя или слугу, а не подчёркивает подневольный статус.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Краткий естественный русский географический оборот, сохраняющий относительную точку отсчёта оригинала.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: к восходу солнца
  rationale: Сохранён конкретный образ еврейского выражения; его обычное географическое значение пояснено в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя Бога, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Гендерная форма אֲחֵיכֶם
  choice: вашим братьям
  alternative: вашим соплеменникам; остальным израильтянам
  rationale: Основной текст сохраняет мужское множественное число оригинала, а контекстуальный референт уточняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор глагола ירשׁ, образ восхода солнца и личное имя Яхве; синтаксис слегка перестроен ради ясности и естественности.
