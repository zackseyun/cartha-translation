  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: ru
  text: Всякий, кто воспротивится твоему повелению[a] и не послушает твоих слов во всём, что ты ему повелишь, будет предан смерти. Только будь твёрд и мужествен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воспротивится твоим устам». В еврейском языке «уста» здесь означают властное слово или повеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Всякий, кто
  rationale: Передаёт распределительное значение «каждый человек, который» естественной русской конструкцией; грамматический мужской род сохраняется без тяжеловесного «всякий мужчина».
- source_word: יַמְרֶה
  choice: воспротивится
  rationale: Глагол выражает мятежное неповиновение законной власти, а не просто случайное неисполнение.
- source_word: אֶת פִּיךָ
  choice: твоему повелению
  rationale: Буквально «твоим устам»; здесь это еврейская метонимия властного слова или приказа. Выбор передаёт смысл естественно, а буквальная форма отмечена в сноске.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: и не послушает твоих слов
  rationale: Сохраняет образ слушания с подразумеваемым повиновением и не сливает его полностью с предшествующим глаголом противления.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: во всём, что ты ему повелишь
  rationale: Точно обозначает полный объём требуемого послушания и естественно звучит по-русски.
- source_word: יוּמָת
  choice: будет предан смерти
  rationale: Пассивная форма обозначает назначенную и приведённую в исполнение смертную казнь, а не просто смерть.
- source_word: רַק
  choice: Только
  rationale: Передаёт краткий ограничительно-усилительный переход к заключительному призыву.
- source_word: חֲזַק וֶאֱמָץ
  choice: будь твёрд и мужествен
  rationale: Естественная и достойная русская формула, передающая стойкость, силу духа и смелость.
theological_decisions:
- issue: Род в распределительном выражении
  choice: Всякий, кто
  alternative: Каждый человек, который; всякий мужчина
  rationale: Еврейское אִישׁ стоит в мужском роде, но конструкция имеет обобщающе-распределительное значение. Русское «всякий, кто» естественно сохраняет это значение и грамматический мужской род, не утверждая сверх контекста, что специально противопоставляются мужчины и женщины.
- issue: Характер смертной кары
  choice: будет предан смерти
  alternative: умрёт; должен быть казнён
  rationale: Форма יוּמָת указывает на причинённую, юридически назначенную смерть. Перевод сохраняет судебную силу, не добавляя неуказанных подробностей процедуры.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис остаётся ясным для обычного читателя; традиционная формула «будь твёрд и мужествен» поддерживает повторяющийся призыв книги Иисуса Навина.
