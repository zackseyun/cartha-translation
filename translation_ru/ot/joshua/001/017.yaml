source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: ru
  text: Как мы во всём слушали Моисея[a], так будем слушать и тебя. Только пусть Яхве, твой Бог, будет с тобой, как Он был с Моисеем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повиновались Моисею… будем повиноваться тебе». Еврейский глагол שׁמע в зависимости от контекста может означать как «слушать», так и «повиноваться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: слушали / будем слушать
  rationale: Глагол שׁמע с אֶל означает слушать кого-либо, часто подразумевая послушание. Выбор «слушали / будем слушать» сохраняет лексическую широту оригинала; значение повиновения отмечено в сноске.
- source_word: כְּכֹל אֲשֶׁר
  choice: как мы во всём ... так
  rationale: 'Оборот передаёт и сопоставление, и полноту: отношение народа к Иисусу Навину должно соответствовать его отношению к Моисею во всём.'
- source_word: רַק
  choice: только
  rationale: Слово вводит ограничение или оговорку к обещанию народа.
- source_word: יִהְיֶה
  choice: пусть ... будет
  rationale: После רַק форма выражает пожелание, а не простое предсказание будущего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма содержит суффикс второго лица мужского рода единственного числа.
- source_word: עִמָּךְ / עִם
  choice: с тобой / с Моисеем
  rationale: Предлог выражает присутствие и сопровождение; естественный русский эквивалент — «с».
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз прямо сопоставляет присутствие Яхве с Иисусом Навином и Его прежнее присутствие с Моисеем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В стихе употреблено личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Оттенок שׁמע в обещании народа
  choice: слушали / будем слушать
  alternative: повиновались / будем повиноваться
  rationale: Контекст предполагает верность и послушание руководителю, однако еврейский глагол сохраняет смысл слушания; основной текст не устраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным синтаксисом. Частица «пусть» естественно передаёт пожелание; местоимение «Он» написано с прописной буквы в соответствии с традицией почтительного библейского русского стиля.
