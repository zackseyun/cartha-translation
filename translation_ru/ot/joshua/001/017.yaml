  source_fidelity: 'Текст точно передаёт еврейскую конструкцию כְּכֹל אֲשֶׁר ... כֵּן: сопоставление («Как ... так») и всеохватность («во всём») сохранены. «Слушали / будем слушать» корректно отражает שׁמע с אֶל, не устраняя подразумеваемого в контексте оттенка послушания. «Только пусть» удачно передаёт רַק и пожелательно-волитивный оттенок יִהְיֶה. Присутствие Яхве «с тобой», сопоставленное с Его присутствием «с Моисеем», передано без добавлений.'
