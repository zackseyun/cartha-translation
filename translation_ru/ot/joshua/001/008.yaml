  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: ru
  text: Пусть эта книга Закона не сходит с твоих уст. Размышляй[a] над ней день и ночь, чтобы в точности исполнять всё, что в ней написано. Тогда ты сделаешь свой путь успешным и будешь поступать мудро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол, переведённый как «размышляй», может также означать «тихо повторяй» или «произноси вполголоса»; размышление здесь может включать негромкое устное повторение.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: не сходит
  rationale: Глагол означает удаляться, отходить. Русское «не сходит с уст» естественно сохраняет конкретный образ постоянного произнесения.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: эта книга Закона
  rationale: סֵפֶר обозначает книгу или свиток, а תּוֹרָה в данном контексте — записанный заветный Закон, которому Иисус Навин должен повиноваться.
- source_word: מִפִּיךָ
  choice: с твоих уст
  rationale: Передаёт буквальный образ «из твоих уст» литературным русским выражением и подразумевает постоянное чтение или повторение вслух.
- source_word: וְהָגִיתָ בּוֹ
  choice: размышляй над ней
  rationale: הגה охватывает размышление и тихое проговаривание. Основной текст передаёт осмысленное сосредоточение, а устный оттенок отмечен в сноске.
- source_word: יוֹמָם וָלַיְלָה
  choice: день и ночь
  rationale: Сохранён естественный меризм, выражающий постоянство.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: чтобы в точности исполнять
  rationale: תשמר выражает внимательное соблюдение; «в точности исполнять» естественно соединяет осмотрительность и послушание.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: всё, что в ней написано
  rationale: Сохраняет всеобъемлющую силу כְּכָל и письменный характер нормы.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: ты сделаешь свой путь успешным
  rationale: 'Причинная порода глагола сохранена: субъект содействует успешности своего пути, а не только испытывает успех.'
- source_word: תַּשְׂכִּיל
  choice: будешь поступать мудро
  rationale: Глагол в породе хифиль указывает на разумное, благоразумное действие, иногда ведущее к успеху. Такой перевод не смешивает его с предшествующим צלח.
theological_decisions:
- issue: Значение תּוֹרָה в контексте завета
  choice: Закон
  alternative: наставление; Тора
  rationale: Здесь слово обозначает записанный заветный корпус, обязательный для исполнения. «Закон» ясно передаёт эту функцию, не исключая наставительного характера תּוֹרָה.
- issue: Устное проговаривание или внутреннее размышление в וְהָגִיתָ
  choice: размышляй над ней
  alternative: тихо повторяй её; произноси её вполголоса
  rationale: 'Стих сочетает устный и мыслительный аспекты: книга остаётся на устах, а הגה может означать как тихое произнесение, так и размышление. Основной текст остаётся естественным, а подлинная лексическая широта сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Выражение «не сходит с твоих уст» сохраняет исходный образ без архаизма; обращения стоят в единственном числе, как в еврейском тексте.
