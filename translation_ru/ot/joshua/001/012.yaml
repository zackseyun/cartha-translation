  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: ru
  text: 'И к потомкам Рувима, и к потомкам Гада, и к половине колена Манассии Иисус Навин сказал[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говоря». Это слово вводит речь Иисуса Навина, которая начинается в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: А к потомкам Рувима
  rationale: Форма этнонима в единственном числе имеет собирательное значение. «Потомкам Рувима» естественно передаёт обращение ко всей группе; начальное וְ в русском связном повествовании передано союзом «А».
- source_word: וְ/לַ/גָּדִי
  choice: потомкам Гада
  rationale: Этноним в единственном числе употреблён собирательно; множественное «потомкам Гада» ясно обозначает группу.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַ/מְנַשֶּׁה
  choice: и половине колена Манассии
  rationale: Сочетание буквально означает половину колена Манассии; эта формулировка точна и привычна для русского библейского языка.
- source_word: אָמַר
  choice: сказал
  rationale: Обычное и прямое соответствие глаголу אמר в данном контексте.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использовано закрепившееся в русской библейской традиции имя, позволяющее отличить Иисуса Навина от других носителей имени Иисус.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Инфинитив «говоря» вводит прямую речь, продолжающуюся в следующем стихе; в современном русском его функцию естественно передаёт двоеточие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской терминологией. Собирательные этнонимы переданы как «потомки Рувима» и «потомки Гада», а не менее прозрачными формами «рувимляне» и «гадитяне». Двоеточие сохраняет функцию לֵאמֹר и подготавливает прямую речь следующего стиха.
