  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: ru
  text: Всякое место, на которое ступит подошва вашей ноги[a], Я отдал его вам, как Я сказал Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое место, где ступит подошва вашей ноги».'
    reason: Лексико-синтаксический вариант передачи относительной конструкции אֲשֶׁר ... בּוֹ.
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Всякое место
  rationale: 'Сочетание имеет распределительное значение: речь идёт о каждом месте, на которое ступит Израиль.'
- source_word: אֲשֶׁר ... בּוֹ
  choice: на которое
  rationale: Относительная конструкция относится к «месту»; предлог בּ в контексте ступания естественно передаётся русским «на».
- source_word: תִּדְרֹךְ
  choice: ступит
  rationale: Глагол выражает конкретное действие — наступить, ступить; будущее время естественно передаёт значение древнееврейского имперфекта в обещании.
- source_word: כַּף רַגְלְכֶם
  choice: стопа вашей ноги
  rationale: Сохраняется телесный образ подошвы/стопы ноги; суффикс второго лица множественного числа передан формой «вашей» как собирательным обращением к народу.
- source_word: לָכֶם נְתַתִּיו
  choice: Я отдал вам
  rationale: Перфект представляет дар как уже установленный и обеспеченный Божьим решением; «отдал» естественнее по-русски, чем тяжеловесное «дал его вам», и сохраняет завершённость.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Передаёт соответствие прежним словам Бога Моисею без излишнего усиления.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: говорил Моисею
  rationale: Не уточняет содержание речи словом «обещал» и тем самым не выходит за пределы исходного текста.
theological_decisions:
- issue: Вид и временная перспектива Божьего дара
  choice: «Я отдал вам»
  alternative: «Я даю вам» / «Я отдам вам»
  rationale: Перфект נְתַתִּיו изображает землю как уже дарованную по твёрдому Божьему решению, хотя её фактическое занятие ещё предстоит. Прошедшее совершенного вида сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Стопа вашей ноги» намеренно сохраняет конкретный образ оригинала; обращение «вашей» относится к народу во множественном числе. Местоимение «Я» написано с прописной буквы согласно принятой русской библейской традиции.
