  naturalness: «Стопа вашей ноги» понятна, но для современного литературного русского несколько тяжеловесна. «Подошва вашей ноги» точнее передаёт כַּף и естественнее в данном конкретном образе. «Как Я говорил Моисею» допустимо, но «как Я сказал Моисею» яснее передаёт завершённое предшествующее обращение.
  terminology: Имя «Моисей» передано нормативно. «Подошва» сохраняет телесный образ исходного текста без богословской интерпретации. Прописное «Я» допустимо в принятом библейском регистре.
