lexical_decisions:
- source_word: קֶדֶשׁ
  choice: Кедес
  rationale: Название города передано принятой русской библейской транслитерацией; конечная еврейская согласная ש здесь передаётся как «с» в соответствии с традиционной формой имени.
- source_word: אֶדְרֶעִי
  choice: Едреи
  rationale: Топоним транслитерирован в естественной для русского читателя форме без попытки передать гортанную ע отдельным знаком.
- source_word: עֵין חָצוֹר
  choice: Эн-Хацор
  rationale: Составной топоним сохранён как название, а не переведён этимологически; עֵין в географических именах передано как «Эн», חָצוֹר — как «Хацор».
- source_word: וְ
  choice: и
  rationale: Повторяющийся союз связывает названия в перечне. В русском естественно поставить один союз «и» перед последним элементом, не меняя смысловой связи.
