  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: ru
  text: Алламмелех, Амад и Мишал; затем граница доходила до Кармила к западу[a] и до Шихор-Ливната.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к морю»; в данном географическом контексте это означает «к западу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: Алламмелех
  rationale: Название места передано транслитерацией, близкой к еврейской форме.
- source_word: עַמְעָד
  choice: Амад
  rationale: Название места передано в краткой и удобочитаемой русской форме; внутренняя гортанная согласная отдельно не обозначена.
- source_word: מִשְׁאָל
  choice: Мишал
  rationale: Топоним передан транслитерацией без перевода.
- source_word: וּפָגַע
  choice: затем граница доходила
  rationale: В описаниях границ глагол означает достижение или соприкосновение с ориентиром. Слово «граница» добавлено как подразумеваемое подлежащее для ясности по-русски.
- source_word: בְּכַרְמֶל
  choice: до Кармила
  rationale: Предлог при глаголе движения к пограничному ориентиру естественно передаётся русской конструкцией «до» с родительным падежом.
- source_word: הַיָּמָּה
  choice: на западе
  rationale: Буквально выражение указывает направление к морю, а в географическом употреблении — на запад; основной текст передаёт значение, буквальный образ сохранён в примечании.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: и до Шихор-Ливната
  rationale: Сочетание понято как составной топоним и передано через дефис; падежное окончание обеспечивает естественную русскую синтаксическую связь.
