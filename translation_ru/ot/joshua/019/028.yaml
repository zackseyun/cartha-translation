base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/028.yaml
  text: Ebron[a], Rehob, Hammon, and Kanah, as far as Great Sidon.
translation:
  language: ru
  text: Еврон[a], Рехов, Хаммон и Кана — до Великого Сидона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Еврон»; в некоторых текстовых традициях и переводах — «Авдон».
    reason: textual_variant
lexical_decisions:
- source_word: עֶבְרֹן
  choice: Еврон
  rationale: Масоретская форма передана как топоним «Еврон»; вариант «Авдон» отражён в сноске как текстовое разночтение.
- source_word: רְחֹב
  choice: Рехов
  rationale: Транслитерация топонима с передачей ח через «х» и конечной ב как «в» в соответствии с принятой русской библейской традицией произношения имён.
- source_word: חַמּוֹן
  choice: Хаммон
  rationale: Топоним передан транслитерацией; удвоенное «м» отражает дагеш в מ.
- source_word: קָנָה
  choice: Кана
  rationale: Транслитерация топонима в естественной для русского читателя форме.
- source_word: עַד
  choice: до
  rationale: Предлог обозначает предел территории; русское «до» кратко и естественно передаёт это значение.
- source_word: צִידוֹן רַבָּה
  choice: Великого Сидона
  rationale: Сочетание передано как название выдающегося или главного города; падеж обусловлен предлогом «до».
