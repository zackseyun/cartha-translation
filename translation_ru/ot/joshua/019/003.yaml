  - marker: a
    text: Еврейское название «Хацар-Шуал» состоит из двух слов и буквально означает «поселение лисицы» или «селение лисицы».
    reason: lexical_alternative
  - marker: b
    text: В некоторых переводах встречаются формы «Баала» вместо «Бала» и «Ацем» вместо «Эцем». Они отражают иные способы транслитерации или согласование с родственными формами этих географических названий.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Хацар-Шуал
  rationale: Составное географическое название передано транслитерацией с масоретской огласовки; дефис сохраняет его составной характер.
- source_word: בָלָה
  choice: Бала
  rationale: Географическое название транслитерировано в соответствии с формой и огласовкой непосредственно в данном стихе.
- source_word: עָצֶם
  choice: Эцем
  rationale: Географическое название транслитерировано с учётом масоретской огласовки и обычной русской передачи начальной буквы айн без отдельного знака.
- source_word: וּ / וָ
  choice: перечисление посредством запятых и союза «и»
  rationale: Префиксальный союз связывает названия в перечне; по нормам русского языка перед последним элементом употреблён союз «и».
