base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: ru
  text: Затем граница повернула на запад, к Азноф-Фавору, а оттуда шла к Хуккоку. На юге она соприкасалась с Завулоном, на западе — с Асиром, а с Иудой — у Иордана, на востоке, где восходит солнце[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте упомянута Иуда у Иордана, на востоке. География здесь неясна, поскольку удел Неффалима в обычном понимании не граничил непосредственно с уделом Иуды. Фразу толкуют по-разному, а иногда предполагают повреждение текста; здесь сохранено масоретское чтение.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Затем граница поворачивала
  rationale: В описаниях границ שׁוב указывает на изменение направления. Несовершенный вид естественен для последовательного описания прохождения границы.
- source_word: יָמָּה
  choice: на запад
  rationale: Буквально «к морю»; в географическом языке это устойчивое указание на запад.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Азноф-Фавор
  rationale: Географическое название передано в традиционной русской библейской форме.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  choice: а оттуда шла к Хуккоку
  rationale: В формулах описания границ יצא означает дальнейшее прохождение линии; направительный суффикс в חוּקֹקָה передан предлогом «к».
- source_word: וּפָגַע בִּזְבֻלוּן מִנֶּגֶב
  choice: На юге она соприкасалась с Завулоном
  rationale: פגע в территориальном контексте обозначает соприкосновение границ, а מִנֶּגֶב — южную сторону.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: на западе — с Асиром
  rationale: Повторяемый глагол «соприкасалась» естественно опущен по-русски; מִיָּם передано как указание на западную сторону.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  choice: а с Иудой — у Иордана, на востоке, где восходит солнце
  rationale: Формулировка сохраняет упоминание Иуды и Иордана без географического сглаживания или предположительной эмендации; образ «где восходит солнце» сохранён.
theological_decisions:
- issue: Географически трудная фраза об Иуде у Иордана
  choice: Сохранить масоретское чтение в основном тексте и отметить трудность в сноске.
  alternative: Исправить название «Иуда» по догадке либо перефразировать так, чтобы исключить непосредственное соседство уделов Неффалима и Иуды.
  rationale: Еврейский текст прямо упоминает Иуду, хотя обычное представление о границах уделов делает фразу трудной. Перевод не должен молча устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным синтаксисом географического описания. Традиционные русские формы библейских имён сочетаются с точной передачей повторяющейся формулы границы; трудное чтение не гармонизировано.
