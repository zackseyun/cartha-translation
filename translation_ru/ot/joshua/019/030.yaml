translation_notes:
  register: Современный литературный русский язык; лаконичный синтаксис перечня сохранён. Тире вводит итоговое число. Формулировка «зависевшими от них селениями» делает явной смысловую связь, заключённую в еврейской форме с местоименным суффиксом.
