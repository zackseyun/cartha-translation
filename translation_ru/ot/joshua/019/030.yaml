translation:
  language: ru
  text: Умма, Афек и Рехов — двадцать два города с их селениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с их деревнями» или «с их небольшими поселениями»; еврейское слово обозначает сельские поселения, связанные с перечисленными городами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: Умма
  rationale: Топоним передан транслитерацией с еврейского; удвоенная «м» естественно отражает написание имени и отличает его как имя собственное.
- source_word: אֲפֵק
  choice: Афек
  rationale: Традиционная и фонетически обоснованная русская передача еврейского топонима.
- source_word: רְחֹב
  choice: Рехов
  rationale: Транслитерация еврейского топонима с передачей конечного ב как «в» в соответствии с масоретским произношением.
- source_word: עָרִים
  choice: города
  rationale: Обычное значение слова в перечнях земельных уделов; размеры отдельных населённых пунктов могли различаться, но «города» сохраняет принятую библейскую категорию.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: двадцать два
  rationale: Точная передача общего числа городов в данном разделе списка.
- source_word: חַצְרֵיהֶן
  choice: зависевшими от них селениями
  rationale: Слово обозначает связанные с перечисленными городами сельские, вероятно неукреплённые поселения; выражение явно передаёт зависимый характер этих мест.
