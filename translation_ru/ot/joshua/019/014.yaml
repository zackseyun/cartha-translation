  text: וְ/נָסַ֤ב אֹת/וֹ֙ הַ/גְּב֔וּל מִ/צְּפ֖וֹן חַנָּתֹ֑ן וְ/הָיוּ֙ תֹּֽצְאֹתָ֔י/ו גֵּ֖י יִפְתַּח אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: ru
  text: Затем граница огибала его с севера, у Ханнатона[a], а её конечные точки[b] находились у долины Ифтах-Эл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «к северу от Ханнатона». Еврейское выражение допускает как позиционное, так и направительное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выходы её» — термин, обозначающий крайние или конечные точки границы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Затем … огибала
  rationale: В описаниях границ глагол נָסַב обозначает поворот или прохождение линии вокруг ориентира. «Огибала» естественно передаёт это движение.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоименный объект отсылает к ранее названному ориентиру. Перевод сохраняет эту отсылку, не уточняя её сверх еврейского текста.
- source_word: הַגְּבוּל
  choice: граница
  rationale: В повествовании о земельных уделах גְּבוּל обозначает линию территориальной границы.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: с северной стороны Ханнатона
  rationale: Формула מן + צפון может указывать положение границы относительно населённого пункта. Основной перевод передаёт прохождение границы у северной стороны Ханнатона, а допустимое направительное понимание отмечено в сноске.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: а её конечные точки находились
  rationale: תֹּצְאוֹת — форма множественного числа, употребляемая в описаниях границ для их крайних или конечных точек. Множественное число сохранено, хотя по-русски возможен и собирательный перевод «конец».
- source_word: גֵּי
  choice: долины
  rationale: גֵּי означает долину или ущелье; в данном сочетании это часть географического наименования.
- source_word: יִפְתַּח אֵל
  choice: Ифтах-Эл
  rationale: Топоним передан транслитерацией с еврейского и не переводится по предполагаемому значению его частей.
