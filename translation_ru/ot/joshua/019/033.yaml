base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: ru
  text: Их граница шла от Хелефа, от дуба в Цаананниме[a], через Адами-Некев и Иавнеил до Лаккума; её крайние точки достигали Иордана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от Элон-Бецааннаннима»; еврейское выражение можно понимать как название местности либо как «дуб в Цаананниме».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «её выходы — Иордан»; это оборот, обозначающий, что крайние точки границы достигали Иордана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: их граница
  rationale: Гְּבוּל в перечне земельных рубежей обозначает границу; суффикс 3-го лица множественного числа относится к колену Неффалима.
- source_word: מֵחֵלֶף
  choice: от Хелефа
  rationale: Географическое название передано русской транслитерацией; предлог מִן указывает исходную точку.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: от дуба в Цаананниме
  rationale: אֵלוֹן может обозначать крупное дерево, в том числе дуб или теревинф; синтаксис допускает понимание как нарицательного слова при названии Цаананним. Топонимическая трактовка сохранена в сноске.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: через Адами-Некев
  rationale: В контексте перечня рубежей сочетание принято за составное географическое название. «Через» естественно связывает промежуточные пункты прохождения границы.
- source_word: וְיַבְנְאֵל
  choice: и Иавнеил
  rationale: Собственное географическое название передано в традиционной русской библейской форме.
- source_word: עַד לַקּוּם
  choice: до Лаккума
  rationale: עַד выражает предел движения или протяжённости — «до».
- source_word: תֹצְאֹתָיו הַיַּרְדֵּן
  choice: выходила к Иордану
  rationale: В описаниях границ תֹּצְאוֹת обозначает выходы или конечные точки рубежа. Русское «выходила к» сохраняет пространственный образ и звучит естественно.
