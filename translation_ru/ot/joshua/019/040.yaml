lexical_decisions:
- source_word: לְמַטֵּה
  choice: колену
  rationale: В контексте распределения земли מַטֶּה означает «колено»; предлог לְ передан русским дательным падежом при глаголе «выпал».
- source_word: בְנֵי דָן
  choice: сынов Дана
  rationale: Формально прозрачная передача еврейского обозначения потомков Дана; она сохраняет родовой характер выражения.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В данном контексте מִשְׁפָּחוֹת обозначает подразделения колена; «роды» естественно передаёт эту общественно-родственную структуру и согласуется с библейским регистром.
- source_word: יָצָא
  choice: выпал
  rationale: Хотя основное значение глагола — «вышел», применительно к жребию современное русское «выпал» точно и естественно передаёт смысл.
- source_word: הַגּוֹרָל
  choice: жребий
  rationale: Стандартное русское соответствие גוֹרָל в повествовании о распределении земли по жребию.
- source_word: הַשְּׁבִיעִי
  choice: седьмой
  rationale: Порядковое числительное передано прямо и относится к жребию, указывая очерёдность распределения.
