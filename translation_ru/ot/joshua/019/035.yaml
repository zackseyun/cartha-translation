  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: ru
  text: 'А укреплённые города[a]: Циддим, Цер, Хаммат, Раккат и Киннерет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города-крепости».'
    reason: Лексически сочетание עָרֵי מִבְצָר допускает как качественное понимание «укреплённые города», так и более буквальное «города-крепости».
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: А укреплённые города
  rationale: Союз וְ продолжает перечень и естественно передаётся как «А». Сочетание עָרֵי מִבְצָר означает города, имеющие укрепления; современное и точное русское соответствие — «укреплённые города».
- source_word: הַ/צִּדִּים
  choice: Циддим
  rationale: Топоним передан транслитерацией; еврейский артикль при названии города отдельно не переводится.
- source_word: צֵר
  choice: Цер
  rationale: Топоним передан близкой к еврейскому звучанию русской транслитерацией.
- source_word: וְ/חַמַּת
  choice: Хаммат
  rationale: Удвоенная согласная отражает дагеш в מ и помогает отличить этот город от более известного Хамата.
- source_word: רַקַּת
  choice: Раккат
  rationale: Транслитерация сохраняет удвоение средней согласной и конечную ת как «т».
- source_word: וְ/כִנָּרֶת
  choice: Киннерет
  rationale: Топоним передан в естественной русской форме, близкой к еврейскому произношению.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая именная конструкция с двоеточием естественно оформляет продолжение географического перечня. Топонимы последовательно транслитерированы с еврейского.
