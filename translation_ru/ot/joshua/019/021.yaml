  text: Ремет[a], Эйн-Ганним, Эйн-Хадда и Бейт-Паццец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские географические названия: «Эйн-Ганним», вероятно, означает «источник садов»; «Эйн-Хадда» начинается со слова «источник», а «Бейт-Паццец» — со слова «дом». В основном тексте они переданы транслитерацией, поскольку здесь служат названиями городов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: Ремет
  rationale: Название города в перечне владений; передано транслитерацией. Конечная согласная ת отражена как «т» согласно еврейской форме.
- source_word: עֵין גַּנִּים
  choice: Эн-Ганним
  rationale: 'Составной топоним: עֵין означает «источник», а גַּנִּים — «сады». Поскольку здесь это название города, в основном тексте сохранена транслитерация.'
- source_word: עֵין חַדָּה
  choice: Эн-Хадда
  rationale: Составной топоним, первый элемент которого означает «источник». Значение второго элемента в составе названия не вполне ясно, поэтому всё название передано транслитерацией.
- source_word: בֵית פַּצֵּץ
  choice: Бет-Паццец
  rationale: Составной топоним с בֵית («дом [кого-либо/чего-либо]»). Как название города передан транслитерацией, без предположительного смыслового перевода.
- source_word: וְ
  choice: и; перечислительная связь
  rationale: Повторяющийся союз связывает географические названия. В естественном русском перечислении он передан запятыми и союзом «и» перед последним названием.
