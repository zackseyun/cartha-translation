  variant: modern literary Russian
source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: ru
  text: Из участка сыновей Иуды[a] было выделено наследие сыновей Симеона[b], потому что доля сыновей Иуды была для них слишком велика; поэтому сыновья Симеона получили своё наследие внутри наследия Иуды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из территории сыновей Иуды». Древнееврейское חֶבֶל может обозначать отмеренный земельный участок или область.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновей Иуды» и «сыновей Симеона». Это родоплеменные обозначения, которые по смыслу можно передать как «колено Иуды» и «колено Симеона».'
    reason: lexical_alternative
  - marker: c
    text: 'В древнееврейском тексте буквально: «внутри их наследия»; по контексту местоимение относится к сынам Иуды.'
    reason: textual_clarity
lexical_decisions:
- source_word: מֵחֶבֶל
  choice: из участка
  rationale: חֶבֶל в контексте раздела земли обозначает отмеренный участок или территорию. «Участок» естественно передаёт конкретную часть земли и не смешивается с נַחֲלָה — наследием.
- source_word: נַחֲלַת
  choice: наследие
  rationale: נַחֲלָה в книге Иисуса Навина означает полученную по уделу землю; «наследие» сохраняет как земельный, так и заветный оттенок слова.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: сыновья Иуды / сыновья Симеона
  rationale: Сохранена буквальная форма древнееврейских родоплеменных обозначений; в данном контексте они относятся к соответствующим коленам.
- source_word: חֵלֶק
  choice: доля
  rationale: «Доля» передаёт выделенную Иуде часть земли и позволяет сохранить лексическое различие между חֵלֶק, חֶבֶל и נַחֲלָה.
- source_word: רַב מֵהֶם
  choice: была для них слишком велика
  rationale: Сравнительная конструкция указывает, что доля Иуды превышала необходимое для него; русская формулировка ясно и естественно передаёт этот смысл.
- source_word: וַיִּנְחֲלוּ
  choice: получили своё наследие
  rationale: Глагол נחל здесь означает вступить во владение выделенным земельным наследием.
- source_word: בְּתוֹךְ נַחֲלָתָם
  choice: внутри наследия Иуды
  rationale: בְּתוֹךְ обозначает нахождение внутри территории, а местоименный суффикс по контексту относится к сынам Иуды. Явное повторение названия устраняет неестественную для русского двусмысленность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет исходное движение от участка Иуды к наследию Симеона, а терминологическое различие между «участком», «наследием» и «долей» отражает три разных древнееврейских слова.
