  text: וְ/שָׁ֣ב מִ/שָּׂרִ֗יד קֵ֚דְמָ/ה מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ עַל גְּב֥וּל כִּסְלֹ֖ת תָּבֹ֑ר וְ/יָצָ֥א אֶל הַ/דָּֽבְרַ֖ת וְ/עָלָ֥ה יָפִֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: ru
  text: От Сарида граница повернула на восток[a], к восходу солнца, доходила до границы Кислот-Тавора, затем шла к Даверату и поднималась к Иафии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на восток, восход солнца»; возможно также: «на восток, в сторону востока».'
    reason: Сочетание двух еврейских указаний направления допускает понимание как образного усиления либо как повторного обозначения востока.
lexical_decisions:
- source_word: וְשָׁב מִשָּׂרִיד
  choice: От Сарида граница поворачивала
  rationale: В описании рубежей שוב обозначает изменение направления пограничной линии. Явно названное «граница» делает русский текст естественным и не меняет референта.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: на восток, к восходу солнца
  rationale: Сохраняются оба обозначения восточного направления, включая образ восходящего солнца, без сведения их к одному выражению.
- source_word: עַל גְּבוּל כִּסְלֹת תָּבֹר
  choice: доходила до границы Кислот-Тавора
  rationale: В данном контексте על גבול указывает на достижение границы указанной местности; глагол «доходила» естественно передаёт движение рубежа.
- source_word: וְיָצָא אֶל הַדָּבְרַת
  choice: затем шла к Даверату
  rationale: יצא в пограничных описаниях означает дальнейшее прохождение или простирание линии. «Шла» звучит естественно по-русски и сохраняет пространственный смысл.
- source_word: וְעָלָה יָפִיעַ
  choice: и поднималась к Иафии
  rationale: עלה передаёт движение вверх по рельефу; «поднималась к» сохраняет топографический оттенок.
- source_word: כִּסְלֹת תָּבֹר / הַדָּבְרַת / יָפִיעַ
  choice: Кислот-Тавор / Даверат / Иафия
  rationale: Географические названия переданы русской библейской транслитерацией, близкой к еврейским формам; определённый артикль перед Давератом отдельно не воспроизводится.
