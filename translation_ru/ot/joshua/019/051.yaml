  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: ru
  text: Вот уделы, которые священник Елеазар, Иисус, сын Навина, и главы родов племён сынов Израиля распределили по жребию в Силоме перед Яхве, у входа в шатёр собрания. Так они закончили раздел земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: уделы
  rationale: В данном контексте נַחֲלָה обозначает земельное наследственное владение, выделенное племени; русское «уделы» естественно передаёт и участок, и результат распределения.
- source_word: נִחֲלוּ
  choice: распределили
  rationale: Форма глагола נחל здесь описывает наделение племён их уделами; «распределили» ясно выражает административное действие названных руководителей.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: главы родов
  rationale: Краткое современное выражение передаёт руководителей отцовских, то есть родовых объединений, не вводя неестественное русское «главы домов отцов».
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: племён сынов Израиля
  rationale: «Племена» точно передаёт מַטּוֹת, а «сыны Израиля» сохраняет традиционную и формально близкую исходнику родовую формулу.
- source_word: בְּגוֹרָל
  choice: по жребию
  rationale: Устойчивое русское выражение для распределения посредством жребия.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Передаёт идею совершения действия в присутствии Бога и сохраняет личное заветное имя יהוה.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: «Вход» точно передаёт פֶּתַח; «шатёр встречи» прозрачно и буквально передаёт אֹהֶל מוֹעֵד современным русским языком.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: Так они закончили раздел земли
  rationale: Передаёт завершение процесса распределения земли и естественно связывает заключительное предложение с предшествующим описанием.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формула сохраняет родовую образность древнееврейского выражения; более идиоматичное «израильтяне» возможно, но устраняет эту особенность.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Имена переданы в привычной русской библейской форме: Елеазар, Иисус Навин, Силом. Архаизмы сведены к минимуму; «пред Яхве» сохранено как краткая, достойная формула присутствия перед Богом.'
