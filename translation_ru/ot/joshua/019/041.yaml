  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: ru
  text: И границей их удела были Цора, Эштаол и Ир-Шемеш[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ир-Шемеш означает «город солнца».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И … были
  rationale: Вав с последовательной формой глагола היה продолжает повествование. Русское «И … были» естественно передаёт связь с предыдущим контекстом; множественное число согласовано с последующим перечнем городов.
- source_word: גְּבוּל
  choice: границей
  rationale: В описании земельных уделов слово обозначает границу или рубеж. «Граница» точно сохраняет основной пространственный смысл, хотя следующий перечень называет города, определяющие эту границу.
- source_word: נַחֲלָתָם
  choice: их удела
  rationale: В книге Иисуса Навина נַחֲלָה означает землю, доставшуюся племени как наследственное владение. «Удел» — естественный и точный русский эквивалент в контексте распределения земли; суффикс 3-го лица множественного числа передан словом «их».
- source_word: צָרְעָה
  choice: Цора
  rationale: Традиционная и узнаваемая русская передача библейского топонима.
- source_word: אֶשְׁתָּאוֹל
  choice: Эштаол
  rationale: Транслитерация еврейского топонима средствами современного русского языка.
- source_word: עִיר שָׁמֶשׁ
  choice: Ир-Шемеш
  rationale: Составной топоним передан транслитерацией, а его прозрачное значение пояснено в сноске.
