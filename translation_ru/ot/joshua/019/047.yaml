  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: ru
  text: Но граница владений сынов Дана вышла за их пределы[a]. Тогда сыны Дана выступили против Лешема, сразились с ним, захватили его и предали мечу. Они овладели им, поселились в нём и назвали Лешем Даном[b] — по имени Дана, их отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «граница сынов Дана простиралась дальше их». Некоторые переводы истолковывают эту фразу как «владение сынов Дана было для них слишком тесным», опираясь на более широкий контекст, однако еврейская формулировка буквально выражает пространственное движение границы.'
    reason: alternative_reading
  - marker: b
    text: Лешем связывают с городом Лаисом, упомянутым в Судей 18:7, 14, 27, 29.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: граница владений сынов Дана вышла за их пределы
  rationale: Слово גְבוּל обозначает границу, предел или ограниченную территорию. Русское «граница владений» сохраняет связь с земельным уделом, а пространственная формулировка передаёт трудное מֵהֶם без контекстуального истолкования как «удел был слишком мал».
- source_word: בְּנֵי דָן
  choice: сыны Дана
  rationale: Сохраняет родоплеменной образ еврейского выражения и остаётся понятным в возвышенном современном русском библейском повествовании.
- source_word: וַיַּעֲלוּ
  choice: выступили
  rationale: Глагол עלה буквально означает «поднялись, пошли вверх», но здесь обозначает военный поход; «выступили» естественно передаёт движение войска, не уточняя недостоверно направление рельефа.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: сразились с Лешемом
  rationale: Передаёт военное значение глагола לחם и естественное русское управление с названием города.
- source_word: לֶשֶׁם
  choice: Лешем
  rationale: Сохраняет форму масоретского текста; связь с Лаисом отмечена отдельно, а не подменяет данное чтение.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: захватили его
  rationale: לכד в военном контексте означает взятие города. В русском местоимение согласовано с подразумеваемым городом Лешемом.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: поразили остриём меча
  rationale: Сохраняет образ идиомы «устами/лезвием меча» и не смягчает описываемое военное насилие.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: овладели им
  rationale: ירשׁ здесь означает вступить во владение захваченным местом; краткая русская формулировка естественно выражает результат.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: поселились в нём
  rationale: В данном повествовательном контексте ישׁב описывает постоянное обоснование в городе, поэтому «поселились» точнее простого «жили».
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: назвали Лешем Даном
  rationale: Естественно передаёт присвоение городу нового имени и близко следует еврейской конструкции.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: по имени Дана, своего отца
  rationale: Сохраняет библейскую родоплеменную речь, в которой прародитель называется отцом; замена на «предка» была бы пояснительным истолкованием.
