lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: сынам Неффалима
  rationale: Сохраняет традиционную библейскую форму обозначения племени и передаёт ל как указание на получателя удела.
- source_word: יָצָא
  choice: выпал
  rationale: В контексте бросания жребия это естественный русский эквивалент буквального «вышел»; буквальный образ отмечен в сноске.
- source_word: הַגּוֹרָל הַשִּׁשִּׁי
  choice: шестой жребий
  rationale: Прямо передаёт существительное с порядковым определением.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте распределения земли מִשְׁפָּחוֹת обозначает родовые подразделения племени; «роды» точнее современного «семьи».
