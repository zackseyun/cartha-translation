  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: ru
  text: Пятый жребий выпал племени сыновей Асира[a] — по их родам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пятый жребий был вытянут для племени сыновей Асира — по их родам».'
    reason: Лексически возможный контекстуальный перевод וַיֵּצֵא; основной текст ближе сохраняет образ «вышедшего» жребия и естественнее звучит по-русски.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: выпал
  rationale: В сочетании со словом «жребий» русский глагол «выпал» естественно передаёт буквальный образ еврейского יצא («вышел») и не уточняет сверх текста способ жеребьёвки.
- source_word: הַגּוֹרָל
  choice: жребий
  rationale: Слово גורל обозначает жребий или определённый им удел; здесь формула распределения земель и глагол יצא поддерживают основное значение «жребий».
- source_word: הַחֲמִישִׁי
  choice: пятый
  rationale: Прямое соответствие порядковому числительному, согласованному со словом «жребий».
- source_word: לְמַטֵּה
  choice: племени
  rationale: В контексте раздела земли מַטֶּה обозначает племя Израиля, а не буквальный посох или жезл. «Племя» позволяет естественно сохранить следующую конструкцию «сыновей Асира».
- source_word: בְנֵי אָשֵׁר
  choice: сыновей Асира
  rationale: Перевод сохраняет генеалогическую форму еврейского выражения и его функцию как обозначения племени, не заменяя её более толковательным словом «потомки».
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת обозначает родовые подразделения внутри племени; «по их родам» передаёт также распределительное значение предлога לְ и звучит естественно в данном перечне уделов.
