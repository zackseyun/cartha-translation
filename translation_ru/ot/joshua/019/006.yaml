  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: ru
  text: Бет-Леваот и Шарухен[a] — тринадцать городов с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь: «Шарухен»; в параллельном перечне в Иисусе Навине 15:32 стоит вариант названия «Шилхим».'
    reason: textual_variant
lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Бет-Леваот
  rationale: Название места передано транслитерацией; буквальное значение составного топонима («дом львиц») не вводится в текст, чтобы не придавать перечню излишне толковательный характер.
- source_word: שָׁרוּחֶן
  choice: Шарухен
  rationale: Передана форма масоретского текста WLC; отличающееся название в параллельном перечне отмечено в сноске.
- source_word: עָרִים
  choice: города
  rationale: Обычный эквивалент עִיר в перечнях территориальных владений; сохраняет официальный характер списка, даже если отдельные населённые пункты были невелики.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: тринадцать
  rationale: Прямая и естественная передача количественного числительного.
- source_word: חַצְרֵיהֶן
  choice: их селениями
  rationale: В формулах земельного раздела חָצֵר обозначает зависимые неукреплённые поселения при названных городах; «селения» естественно передаёт этот смысл в литературном русском языке.
theological_decisions: []
