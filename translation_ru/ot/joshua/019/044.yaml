lexical_decisions:
- source_word: אֶלְתְּקֵה
  choice: Елтеке
  rationale: Название города передано транслитерацией с еврейского; конечное ה отражено буквой «е» в соответствии с произношением топонима.
- source_word: גִבְּתוֹן
  choice: Гиббетон
  rationale: Топоним транслитерирован; удвоенное «б» отражает усиление согласного, обозначенное дагешем.
- source_word: בַעֲלָת
  choice: Баалат
  rationale: Здесь слово служит названием города, поэтому оно транслитерировано, а не переведено; конечная ת передана как «т».
- source_word: וְ / וּ
  choice: и
  rationale: Еврейский союз соединяет названия в перечне; по нормам современного русского языка он явно передан перед последним элементом, а предыдущая связь выражена запятой.
theological_decisions: []
translation_notes:
  register: Краткий перечень географических названий передан в нейтральном, современном литературном русском стиле. Традиционное для ряда русских переводов окончание «-аф» не использовано, поскольку оно менее непосредственно отражает еврейскую форму בַעֲלָת.
