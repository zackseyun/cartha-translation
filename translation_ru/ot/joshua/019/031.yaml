lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное местоимение открывает итоговую именную конструкцию и отсылает к только что перечисленной территории. Русское «вот» естественно передаёт такой подытоживающий оборот без необходимости добавлять отсутствующую в еврейском связку настоящего или прошедшего времени.
- source_word: נַחֲלַת
  choice: наследие
  rationale: В контексте распределения земли слово обозначает наследственный территориальный удел; «наследие» сохраняет семейный и заветный оттенок лучше, чем более административное «удел».
- source_word: מַטֵּה
  choice: племени
  rationale: Здесь это устойчивое обозначение племенной единицы, а не буквального посоха.
- source_word: בְנֵי אָשֵׁר
  choice: сыновей Асира
  rationale: Формально близкая и понятная по-русски передача сохраняет еврейский способ обозначения племени через происхождение от предка.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте раздела земли מִשְׁפָּחָה обозначает родовые подразделения племени, а предлог לְ имеет распределительное значение. «По их родам» естественно воспроизводит формулу.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: Прямая и обычная передача названия населённых мест, перечисленных выше.
- source_word: וְחַצְרֵיהֶן
  choice: и их селения
  rationale: חָצֵר здесь обозначает зависимые от городов сельские или неукреплённые поселения. «Селения» достаточно широко передаёт значение и звучит естественно в контексте перечня земель.
