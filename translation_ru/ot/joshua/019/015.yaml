base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: ru
  text: Каттат, Нахалал, Шимрон, Идъала и Вифлеем[a] — двенадцать городов с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вифлеем» здесь — название города, а не перевод словосочетания со значением «дом хлеба».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: Каттат
  rationale: Географическое название передано транслитерацией с еврейского; удвоенное «т» отражает сильный дагеш.
- source_word: נַהֲלָל
  choice: Нахалал
  rationale: Географическое название транслитерировано с учётом еврейской согласной ה и гласных масоретского текста.
- source_word: שִׁמְרוֹן
  choice: Шимрон
  rationale: Географическое название передано близкой к еврейскому звучанию русской транслитерацией.
- source_word: יִדְאֲלָה
  choice: Идъала
  rationale: Транслитерация сохраняет начальное «и» и отмечает раздельное произнесение согласных ד и א, не добавляя отсутствующего в тексте гласного.
- source_word: בֵית לָחֶם
  choice: Вифлеем
  rationale: Использована укоренившаяся в русском языке форма названия города; выражение здесь является топонимом и потому не переводится буквально.
- source_word: עָרִים
  choice: города
  rationale: Обычное значение слова в перечнях населённых пунктов; соответствует административно-географическому контексту.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: двенадцать
  rationale: Числительное передано прямо, без попытки согласовать его с числом названий, перечисленных непосредственно в этом стихе.
- source_word: חַצְרֵיהֶן
  choice: их селениями
  rationale: В территориальных перечнях слово обозначает зависимые от городов небольшие или неукреплённые поселения; «селения» естественно передаёт широкий смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая структура географического перечня сохранена. Топонимы, кроме укоренившейся русской формы «Вифлеем», переданы непосредственно с еврейского. Число «двенадцать» сохранено как в масоретском тексте, несмотря на то что в данном стихе названы только пять городов.
