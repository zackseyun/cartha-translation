  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: ru
  text: Затем граница повернула к Раме, до укреплённого города Тира; затем граница повернула к Хосе, и её выходы были к морю, от области Ахзива.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к морю, от области в сторону Ахзива». Направительная форма названия «Ахзив» допускает такое пространственное понимание.'
    reason: Сочетание מֵחֶבֶל с направительной формой אַכְזִיבָה допускает несколько способов пространственного истолкования.
lexical_decisions:
- source_word: וְשָׁב
  choice: затем граница поворачивала
  rationale: В описаниях границ глагол שׁוב часто обозначает изменение направления. Несовершенный вид естественно передаёт последовательное прохождение линии границы.
- source_word: הַגְּבוּל
  choice: граница
  rationale: В повествовании о земельных уделах слово обозначает линию территориальной границы.
- source_word: הָרָמָה
  choice: Рама
  rationale: Передача географического названия в принятой русской библейской форме.
- source_word: עִיר מִבְצַר צֹר
  choice: укреплённый город Тир
  rationale: Сочетание עִיר מִבְצַר характеризует Тир как укреплённый город; перевод сохраняет определительную силу конструкции и естественно звучит по-русски.
- source_word: חֹסָה
  choice: Хоса
  rationale: Транслитерация географического названия.
- source_word: וִיהְיוּ תֹצְאֹתָיו
  choice: её конечные точки находились
  rationale: В формулах описания границ תֹצָאוֹת обозначает крайние или конечные точки линии. Сохранено множественное число древнееврейского текста.
- source_word: הַיָּמָּה
  choice: у моря
  rationale: Форма с направительным окончанием буквально указывает в сторону моря; в данном контексте она описывает выход границы к морю. Перевод сохраняет конкретный географический образ, не заменяя его словом «на запад».
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: со стороны области Ахзива
  rationale: חֶבֶל может означать область или территориальный участок, а направительная форма אַכְזִיבָה допускает пространственное понимание «по направлению к Ахзиву». Выбранная формулировка передаёт общий географический смысл, не придавая обороту излишне точного административного значения.
