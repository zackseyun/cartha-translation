base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: ru
  text: Второй жребий выпал Симеону[a] — племени потомков Симеона, по их родам[b]. Их удел находился внутри удела потомков Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «второй жребий вышел Симеону». Здесь глагол «вышел» описывает результат бросания жребия.'
    reason: lexical_alternative
  - marker: b
    text: '«Потомки Симеона» и «потомки Иуды» — племенные обозначения: имеются в виду члены племён, происходивших от этих родоначальников.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: жребий выпал
  rationale: В контексте распределения земли по жребию это естественное русское выражение; оно передаёт результат бросания жребия, хотя глагол יצא буквально означает «вышел».
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Прямое соответствие порядковому числительному, определяющему жребий.
- source_word: לְשִׁמְעוֹן
  choice: Симеону
  rationale: Дательный падеж естественно передаёт получателя жребия, обозначенного предлогом לְ.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: племени потомков Симеона
  rationale: מַטֶּה в данном контексте означает «племя», а בְּנֵי — членов или потомков родоначальника; «потомки» звучит по-русски естественнее буквального «сыновья» и не сужает обозначение до мужчин.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת обозначает внутриплеменные родовые объединения, а не современные нуклеарные семьи; «роды» уместно в контексте древнего Израиля.
- source_word: נַחֲלָתָם
  choice: их удел
  rationale: В книге Иисуса Навина נַחֲלָה обозначает наследственное земельное владение. «Удел» сохраняет связь с распределением земли и звучит естественно в русском библейском повествовании.
- source_word: בְּתוֹךְ
  choice: внутри
  rationale: Точно выражает расположение территории Симеона в пределах территории Иуды.
- source_word: נַחֲלַת בְּנֵי יְהוּדָה
  choice: удела потомков Иуды
  rationale: Повтор «удел» сохраняет лексическую связь с тем же еврейским словом נַחֲלָה; «потомки Иуды» ясно передаёт племенное обозначение.
