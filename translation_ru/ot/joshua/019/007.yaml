base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: ru
  text: Аин[a], Риммон, Этер и Ашан — четыре города с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте перечислены четыре названия: Аин, Риммон, Этер и Ашан. Однако в 1 Пар. 4:32 слова «Аин-Риммон» могут пониматься как одно составное название, что влияет на подсчёт городов.'
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: Аин
  rationale: Название места передано транслитерацией; нарицательные значения «глаз» и «источник» здесь неуместны, поскольку слово входит в перечень городов.
- source_word: רִמּוֹן
  choice: Риммон
  rationale: Топоним передан транслитерацией, а не переведён как «гранат».
- source_word: וָעֶתֶר
  choice: Этер
  rationale: Союз передан перечислительной конструкцией, а топоним — естественной русской транслитерацией.
- source_word: וְעָשָׁן
  choice: и Ашан
  rationale: Сохранён союз перед последним элементом списка; название передано транслитерацией.
- source_word: עָרִים אַרְבַּע
  choice: четыре города
  rationale: Прямо переданы существительное и количественное числительное; порядок слов приведён к естественному русскому.
- source_word: וְחַצְרֵיהֶן
  choice: с их селениями
  rationale: В территориальной формуле חָצֵר обозначает зависимые небольшие поселения при названных городах; «селения» звучит естественно и сохраняет административно-географический смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая географическая формула сохранена. Тире естественно вводит итоговое пояснение. Неоднозначность соотношения Аина и Риммона не устранена в основном тексте и отмечена в сноске.
