  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: ru
  text: 'Вот удел сыновей Завулона по их родам[a]: эти города и их селения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это был удел сыновей Завулона по их родам». В еврейском тексте здесь именное предложение без глагола, поэтому время прямо не указано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת נַחֲלַת
  choice: Вот удел
  rationale: Еврейская именная конструкция без связочного глагола указывает на перечисленную выше территорию. «Вот удел» естественно звучит по-русски и не навязывает отсутствующего в оригинале времени.
- source_word: בְּנֵי זְבוּלֻן
  choice: сыновей Завулона
  rationale: Сохранено буквальное родовое обозначение «сыновья Завулона», которое здесь относится ко всему племени.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: Предлог ל выражает распределение по племенным подразделениям; «по их родам» соответствует библейскому контексту и понятно современному читателю.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: Фраза подытоживает перечисленные выше города; двоеточие передаёт пояснительное приложение.
- source_word: וְחַצְרֵיהֶן
  choice: и их селения
  rationale: חָצֵר в перечнях земель обозначает зависимые от городов небольшие поселения; «селения» точно и естественно передаёт этот смысл.
