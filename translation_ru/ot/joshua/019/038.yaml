  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: ru
  text: И Иреон, Мигдал-Эль[a], Хорем, Бет-Анат[b] и Бет-Шемеш[c] — девятнадцать городов с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Мигдал-Эль» буквально означает «башня Бога (Эля)».
    reason: lexical_alternative
  - marker: b
    text: Название «Бет-Анат» буквально означает «дом Анат».
    reason: lexical_alternative
  - marker: c
    text: Название «Бет-Шемеш» буквально означает «дом солнца».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: Иреон
  rationale: Название места передано транслитерацией; начальный союз ו естественно выражен связью с предшествующим перечнем и отдельно не воспроизводится.
- source_word: וּ/מִגְדַּל אֵל
  choice: Мигдал-Эль
  rationale: Составной топоним транслитерирован, а не переведён; дефис сохраняет его составную структуру.
- source_word: חֳרֵם
  choice: Хорем
  rationale: Топоним передан прямой транслитерацией.
- source_word: וּ/בֵית עֲנָת
  choice: Бет-Анат
  rationale: Составной топоним транслитерирован; союз перед последним элементом перечня передан по нормам русского синтаксиса.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: Бет-Шемеш
  rationale: Составной топоним транслитерирован, а его буквальное значение вынесено в примечание.
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: девятнадцать городов
  rationale: Числительное и существительное переставлены в естественный для современного русского языка порядок; «города» соответствует принятому обозначению поселений в территориальных списках.
- source_word: וְ/חַצְרֵי/הֶן
  choice: с их селениями
  rationale: В формуле земельных списков חֲצֵרִים обозначает зависимые поселения, вероятно неукреплённые; «селения» не навязывает им современный административный статус.
