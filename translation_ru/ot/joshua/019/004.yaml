lexical_decisions:
- source_word: אֶלְתּוֹלַד
  choice: Элтолад
  rationale: Название города передано транслитерацией в форме, естественной для русской библейской традиции.
- source_word: בְתוּל
  choice: Бетул
  rationale: Топоним передан непосредственно с еврейского как «Бетул»; согласная ת обозначена буквой «т», без опоры на английское написание Bethul.
- source_word: חָרְמָה
  choice: Хорма
  rationale: Топоним транслитерирован с еврейского; начальная ח передана русской «х», а конечная ה отражена окончанием «а».
- source_word: וְ / וּ
  choice: и
  rationale: Повторяющийся союз связывает названия в перечне; по нормам современного русского языка достаточно запятых и союза «и» перед последним названием.
