  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: ru
  text: Их границей были Хелкат, Хали, Бетен и Ахшаф.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי גְּבוּלָם
  choice: И граница их проходила
  rationale: Формула продолжает описание удела. Буквальное «и была граница их» по-русски звучит неестественно; «проходила» ясно передаёт линию границы, не превращая גְּבוּל в обозначение всей территории.
- source_word: חֶלְקַת
  choice: Хелкат
  rationale: Географическое название передано транслитерацией; конечная ת отражена как «т».
- source_word: וַחֲלִי
  choice: Хали
  rationale: Союз וַ отделён от имени, а ח передана принятой в русской библейской традиции буквой «х».
- source_word: וָבֶטֶן
  choice: Бетен
  rationale: Географическое название передано близко к масоретскому звучанию.
- source_word: וְאַכְשָׁף
  choice: Ахшаф
  rationale: Передача «Ахшаф» непосредственно отражает согласные א־כ־שׁ־ף и соответствует привычному русскому способу транслитерации древнееврейских имён.
