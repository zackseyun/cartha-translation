base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: ru
  text: Граница касалась Фавора[a], Шахацумы и Бет-Шемеша, а её пределом был Иордан[b] — шестнадцать городов с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доходила до Фавора» или «подходила к Фавору»; еврейский глагол может обозначать соприкосновение линии границы с местом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пределы их границы — Иордан»; это обычная формула, обозначающая конечный пункт или предел границы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: Граница доходила
  rationale: В описаниях границ פגע обозначает соприкосновение линии границы с местом или достижение его. «Доходила до» естественно передаёт пространственный смысл, не уточняя сверх текста, проходила ли граница через сам город.
- source_word: בְּתָבוֹר
  choice: до Фавора
  rationale: Топоним передан в традиционной русской библейской форме; предлог ב при глаголе движения естественно выражен конструкцией «до».
- source_word: וְשַׁחֲצוּמָה
  choice: Шахацу́мы
  rationale: Редкий топоним транслитерирован с еврейского; падежное окончание обусловлено русским управлением.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Бет-Шеме́ша
  rationale: Топоним транслитерирован, а не переведён как «Дом солнца»; дефис делает составное имя ясным для русского читателя.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: а заканчивалась у Иордана
  rationale: Буквально «выходы/края их границы были Иорданом» — формула, указывающая на конечный пункт или предел границы. Русская формулировка передаёт её географическую функцию.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: Всего было шестнадцать городов
  rationale: Отдельное предложение естественно передаёт итоговый подсчёт городов в современном русском тексте.
- source_word: וְחַצְרֵיהֶן
  choice: с их селениями
  rationale: חָצֵר в перечнях населённых пунктов обозначает зависимые небольшие поселения, часто неукреплённые. «Селения» достаточно широко сохраняет этот смысл.
