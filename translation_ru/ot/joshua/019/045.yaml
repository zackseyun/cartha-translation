lexical_decisions:
- source_word: וִיהֻד
  choice: Йегуд
  rationale: Название города передано современной русской транслитерацией, близкой к еврейскому произношению; начальный союз не воспроизведён, поскольку стих продолжает перечень городов и в русском тексте перечисление естественно оформляется пунктуацией.
- source_word: וּבְנֵי בְרַק
  choice: Бене-Берак
  rationale: В данном перечне это единое географическое название, а не переводимое словосочетание «сыновья Берака»; дефис подчёркивает цельность топонима.
- source_word: וְגַת רִמּוֹן
  choice: Гат-Риммон
  rationale: Составное название одного города передано транслитерацией; дефис помогает не принять его за два отдельных населённых пункта.
