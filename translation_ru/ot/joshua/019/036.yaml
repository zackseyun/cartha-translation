  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדָמָה
  choice: Адама
  rationale: В перечне городов это географическое название, поэтому оно передано транслитерацией, а не переведено как нарицательное «земля» или «почва».
- source_word: הָרָמָה
  choice: Рама
  rationale: Топоним передан в принятой русской библейской форме. Еврейский артикль не воспроизводится отдельно, поскольку при названии места он здесь не требует русского «эта» или «та».
- source_word: חָצוֹר
  choice: Хацор
  rationale: Географическое название передано транслитерацией с учётом еврейского произношения; возможное лексическое значение имени в перечне городов не переводится.
- source_word: וְ
  choice: и
  rationale: Союз связывает названия в простом перечислении; по нормам русского языка он явно передан перед последним элементом.
