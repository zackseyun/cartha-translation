base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: ru
  text: Затем граница поворачивала на восток, к восходу солнца, к Бет-Дагону; она доходила до Завулона и долины Ифтах-Эл, шла на север к Бет-Эмеку и Неиэлу и выходила к Кавулу слева[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с левой стороны». В описаниях границ «слева» может означать «с северной стороны», если наблюдатель ориентирован лицом на восток.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Затем граница поворачивала
  rationale: В описании рубежей глагол указывает на изменение направления границы; явное «граница» делает русский текст понятным и естественным.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: к востоку, к восходу солнца
  rationale: Передаёт как географическое направление, так и буквальный образ еврейского выражения «восход солнца».
- source_word: בֵּית דָּגֹן
  choice: Бет-Дагон
  rationale: Топоним передан транслитерацией, а не переведён.
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: доходила до Завулона
  rationale: В пограничной формуле פגע обозначает соприкосновение границы с территорией; «доходила до» естественно передаёт этот смысл.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: и долины Ифтах-Эл
  rationale: Союзная конструкция продолжает ряд объектов, которых достигает граница; имя места транслитерировано.
- source_word: צָפוֹנָה
  choice: шла на север
  rationale: Сохраняет направительное значение наречия и ясно связывает его с дальнейшим движением границы.
- source_word: בֵּית הָעֵמֶק
  choice: Бет-Эмек
  rationale: Топоним транслитерирован без буквального перевода.
- source_word: וּנְעִיאֵל
  choice: и Неиэлу
  rationale: Имя места транслитерировано и поставлено в требуемую русским управлением форму.
- source_word: וְיָצָא אֶל כָּבוּל
  choice: и выходила к Кавулу
  rationale: יצא в описаниях границ означает дальнейшее простирание линии; «выходила к» сохраняет формулу и звучит естественно.
- source_word: מִשְּׂמֹאל
  choice: слева
  rationale: Основной текст сохраняет буквальное и допускающее разные пространственные интерпретации указание «слева».
