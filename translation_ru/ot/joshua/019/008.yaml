  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: ru
  text: а также все селения вокруг этих городов, вплоть до Баалат-Беэра, Рамат-Негева[a]. Это был удел колена сынов Симеона по их родам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «до Баалат-Беэра, то есть Рамат-Негева», если второе название поясняет первое.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: а также все селения
  rationale: Союз связывает стих с предшествующим перечнем городов, а חֲצֵרִים в данном контексте обозначает зависимые неукреплённые поселения.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: вокруг этих городов
  rationale: Краткая естественная формулировка сохраняет пространственное значение и указательное «этих».
- source_word: עַד
  choice: вплоть до
  rationale: Передаёт предел территориального охвата.
- source_word: בַּעֲלַת בְּאֵר
  choice: Баалат-Беэр
  rationale: Топоним транслитерирован непосредственно с еврейского; дефис отражает составное название.
- source_word: רָאמַת נֶגֶב
  choice: Рамат-Негев
  rationale: Транслитерация сохраняет топоним и не навязывает перевод вроде «южная Рама»; в основном тексте название поставлено в требуемый русским управлением родительный падеж.
- source_word: נַחֲלַת
  choice: удел
  rationale: В рассказе о разделе земли слово обозначает наследственно полученную территорию; «удел» естественно передаёт это значение в русском библейском контексте.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: колена сынов Симеона
  rationale: מַטֵּה здесь означает племенное колено, а буквальная генеалогическая формула בְנֵי שִׁמְעוֹן сохранена.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Передаёт распределение по внутренним родовым группам колена и звучит естественно в контексте земельного удела.
