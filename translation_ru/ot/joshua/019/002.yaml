  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «Беэр-Шева и Шева». Некоторые понимают это как одно название («Беэр-Шева»), а второе «Шева» считают текстовой или стилистической особенностью, а не указанием на два разных города.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: И были у них
  rationale: Оборот היה + ל выражает наличие или принадлежность. В контексте перечня городов естественный русский эквивалент — «были у них», сохраняющий также формальную связь со следующим множественным перечислением.
- source_word: בְּנַחֲלָתָם
  choice: в уделе
  rationale: נחלה здесь обозначает земельный удел, доставшийся колену. «В уделе» кратко и естественно передаёт местное значение предлога ב и соответствует контексту распределения земли.
- source_word: בְּאֵר שֶׁבַע
  choice: Беэр-Шева
  rationale: Географическое название передано транслитерацией; дефис отражает составное строение еврейского имени.
- source_word: וְשֶׁבַע
  choice: Шева
  rationale: Масоретский текст формально называет ещё один пункт — «и Шева». Необычное соседство с Беэр-Шевой не устранено из основного текста, а возможное иное понимание отмечено в сноске.
- source_word: וּמוֹלָדָה
  choice: и Молада
  rationale: Название передано транслитерацией, а союз сохранён как соединяющий последний элемент перечня.
