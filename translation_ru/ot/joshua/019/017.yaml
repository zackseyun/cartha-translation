  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: ru
  text: Для Иссахара вышел четвёртый жребий — для сынов Иссахара[a], по их родам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для потомков Иссахара». Еврейское выражение буквально означает «для сынов Иссахара» и обычно указывает на племенное происхождение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по их семействам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Для Иссахара
  rationale: Предлог ל обозначает племя, которому назначается удел; «для Иссахара» естественно передаёт распределительное значение.
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: вышел четвёртый жребий
  rationale: «Вышел» близко передаёт יָצָא и сохраняет образ извлечения жребия, а «четвёртый» обозначает порядок распределения.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: для сынов Иссахара
  rationale: Сохранено буквальное родоплеменное выражение «сыны Иссахара», обозначающее его потомков и членов племени.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: В контексте раздела земли מִשְׁפָּחוֹת обозначает внутренние родовые подразделения племени; «роды» точнее современного широкого слова «семьи».
