  - marker: b
    text: Название «Хацар-Суса», вероятно, означает «поселение коней» или «загон для коней».
    reason: lexical_alternative
lexical_decisions:
- source_word: צִקְלַג
  choice: Циклаг
  rationale: Собственное название города передано принятой в русской библейской традиции формой.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: Бет-Маркавот
  rationale: Составной топоним передан транслитерацией с древнееврейского; его буквальное значение сохранено в сноске.
- source_word: חֲצַר סוּסָה
  choice: Хацар-Суса
  rationale: Составной топоним передан транслитерацией, поскольку стих представляет перечень городов; возможные значения составляющих указаны в сноске.
- source_word: וְ / וּ / וַ
  choice: и
  rationale: Различные формы древнееврейского соединительного союза естественно переданы русским союзом «и».
