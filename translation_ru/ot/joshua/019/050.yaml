base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: ru
  text: По повелению Яхве они дали ему город, который он попросил, — Тимнат-Серах в нагорье Ефрема. Он построил[a] город и поселился в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отстроил» или «восстановил»; еврейский глагол обычно означает «построил», но в контексте уже названного города может подразумевать его восстановление.'
    reason: лексическая_альтернатива
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: По повелению Яхве
  rationale: Оборот עַל־פִּי буквально связан с «устами», но здесь выражает властное указание; «по повелению» естественно передаёт этот смысл. Имя יהוה передано транслитерацией «Яхве».
- source_word: נָתְנוּ לוֹ
  choice: они дали ему
  rationale: Прямо и естественно передаёт נתן с косвенным дополнением, не добавляя оттенка официального пожалования.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: город, который он просил
  rationale: שׁאל означает «просить»; по-русски объект просьбы в данном контексте понятен без добавления отсутствующего в еврейском тексте слова.
- source_word: תִּמְנַת סֶרַח
  choice: Тимнат-Серах
  rationale: Название города транслитерировано и оформлено через дефис как составной топоним.
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: הַר здесь обозначает гористую область, а не одну гору; «нагорье» точно и лаконично передаёт географический смысл.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: Он отстроил город
  rationale: Основное значение בנה — «строить», однако применительно к уже существующему названному городу «отстроил» естественно допускает строительство, восстановление или обустройство, не утверждая однозначно полного разрушения прежде.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: и поселился в нём
  rationale: ישׁב в повествовательной последовательности после получения и отстройки города естественно означает, что Иисус Навин обосновался там.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохранено в принятой современной русской транслитерации, а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык; синтаксис повествовательный и ясный. Сохранены личное имя Яхве, географический характер выражения «нагорье Ефрема» и лексическая неоднозначность בנה посредством сноски.
