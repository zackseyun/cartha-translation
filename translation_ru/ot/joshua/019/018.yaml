lexical_decisions:
- source_word: וַיְהִי גְּבוּלָם
  choice: Их граница проходила
  rationale: Формула וַיְהִי с существительным продолжает описание удела; «проходила» естественно по-русски передаёт расположение пограничной линии, а суффикс 3-го лица множественного числа выражен местоимением «их».
- source_word: יִזְרְעֶאלָה
  choice: к Изреелю
  rationale: Конечное направительное -ה указывает на ориентацию в сторону Изрееля. Предлог «к» кратко сохраняет этот оттенок, не уточняя, достигала ли граница самого города.
- source_word: הַכְּסוּלֹת
  choice: Кесуллофу
  rationale: Название места передано традиционной русской транслитерацией «Кесуллоф»; артикль הַ־ отдельно не воспроизводится, поскольку воспринимается как часть топонимической формы.
- source_word: שׁוּנֵם
  choice: Сунему
  rationale: Топоним передан принятой русской формой «Сунем»; дательный падеж согласован с конструкцией перечисления после «к».
