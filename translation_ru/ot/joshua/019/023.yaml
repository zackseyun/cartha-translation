  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: ru
  text: 'Вот наследие племени сыновей Иссахара[a] по их родам: города и принадлежавшие им селения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот наследие племени потомков Иссахара».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное местоимение открывает итоговую безглагольную формулу и отсылает к только что описанной территории; русское «вот» естественно передаёт предъявление итога, не навязывая отсутствующего в еврейском тексте времени связки.
- source_word: נַחֲלַת
  choice: наследие
  rationale: Слово обозначает наследственное земельное владение; «наследие» сохраняет связанный с землёй заветный оттенок лучше, чем административное «надел».
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: племени сыновей Иссахара
  rationale: «Племя» соответствует значению מַטֶּה в контексте распределения земли, а «сыны Иссахара» сохраняет родословное выражение оригинала и звучит уместно в библейском повествовании.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחוֹת здесь — родовые подразделения племени, а предлог לְ имеет распределительное значение; формула «по их родам» точна и естественна по-русски.
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное обозначение населённых центров в перечнях земель Иисуса Навина; «города» сохраняет традиционную и контекстуально точную формулировку.
- source_word: וְחַצְרֵיהֶן
  choice: и принадлежавшие им селения
  rationale: חֲצֵרִים в этой формуле означает зависимые сельские поселения, связанные с названными городами. Добавление «принадлежавшие» ясно передаёт местоименный суффикс и отношение зависимости.
theological_decisions:
- issue: Время подразумеваемой связки в безглагольном предложении
  choice: 'Не выражать время связки: «Вот наследие…»'
  alternative: «Это было наследие…» или «Это наследие…»
  rationale: В еврейском тексте связка отсутствует, поэтому формулировка с «вот» сохраняет временную неопределённость и одновременно естественно звучит как итог предыдущего описания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис краткий и формульный; двоеточие естественно вводит пояснение о городах и селениях.
