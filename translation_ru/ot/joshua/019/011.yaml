base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: ru
  text: И поднялась их граница к западу, к Марале, и коснулась Даббешета, и дошла до потока, что напротив Иокнеама.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: И поднялась
  rationale: Сохранён обычный для описания границ глагол движения вверх; в контексте подразумевается граница колена Завулона.
- source_word: לַיָּמָּה
  choice: к западу
  rationale: Буквально «к морю»; здесь это устойчивое обозначение западного направления.
- source_word: וּפָגַע
  choice: коснулась / дошла
  rationale: Глагол означает достижение, соприкосновение или примыкание. При городе естественно «коснулась», а при водотоке — «дошла до»; повтор исходного глагола отражён смыслово, без искусственной русской монотонности.
- source_word: הַנַּחַל
  choice: потока
  rationale: נחל может обозначать как русло или долину, так и текущий по ней поток; точная географическая идентификация здесь неясна, поэтому выбран нейтральный традиционный эквивалент.
- source_word: עַל־פְּנֵי
  choice: напротив
  rationale: В географическом описании выражение указывает на положение перед или напротив другого места.
