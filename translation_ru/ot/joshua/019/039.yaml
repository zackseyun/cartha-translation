    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Таков был
  rationale: Указательное местоимение вводит именную итоговую формулу и отсылает к только что приведённому перечню владений. Прошедшее время естественно для русского повествовательного контекста, хотя в древнееврейском времени связки нет.
- source_word: נַחֲלַת
  choice: наследственный удел
  rationale: В контексте раздела земли слово обозначает территориальную долю, передаваемую как наследственное владение. Сочетание сохраняет и земельный, и наследственный оттенки.
- source_word: מַטֵּה
  choice: колена
  rationale: Здесь слово употреблено в устойчивом значении племенного объединения Израиля; традиционное и понятное русское соответствие — «колено».
- source_word: בְנֵי נַפְתָּלִי
  choice: потомков Неффалима
  rationale: Буквально «сынов Неффалима», но в данной родоплеменной формуле имеются в виду все принадлежащие к его потомству и колену; «потомков» естественно передаёт этот смысл без ограничения только мужчинами.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте распределения земли מִשְׁפָּחָה означает родовую группу внутри колена, а предлог לְ указывает на распределение или классификацию.
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное соответствие עִיר в формуле перечня населённых пунктов, даже если некоторые из них по современным меркам были небольшими.
- source_word: וְחַצְרֵיהֶן
  choice: и их селения
  rationale: חָצֵר здесь обозначает зависимые или окрестные сельские поселения, связанные с перечисленными городами; «селения» ясно и нейтрально передаёт значение.
