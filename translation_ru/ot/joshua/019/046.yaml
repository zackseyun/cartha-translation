  text: וּ/מֵ֥י הַיַּרְק֖וֹן וְ/הָֽ/רַקּ֑וֹן עִֽם הַ/גְּב֖וּל מ֥וּל יָפֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/046.yaml
  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: ru
  text: и воды Яркона[a], и Раккон, вместе с областью[b] напротив Иоппии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст можно также понимать как название места «Ме-Яркон», а не как выражение «воды Яркона».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с границей» или «с пограничной полосой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵי הַיַּרְקוֹן
  choice: и воды Яркона
  rationale: Масоретская огласовка понимает מֵי как сопряжённую форму множественного числа от מַיִם («воды»). Географическое название передано в привычной для русского языка форме родительного падежа; возможное прочтение всего сочетания как названия места вынесено в примечание.
- source_word: וְהָרַקּוֹן
  choice: и Раккон
  rationale: Собственное географическое имя транслитерировано; еврейский артикль отдельно в русском не воспроизводится.
- source_word: עִם
  choice: вместе с
  rationale: Так естественно передаётся значение совместности и связь следующего территориального обозначения с перечисленными местами.
- source_word: הַגְּבוּל
  choice: область
  rationale: גְּבוּל может обозначать границу, пограничную полосу или территорию. В перечне владений «область» звучит естественно, а значение «граница» сохранено в примечании.
- source_word: מוּל
  choice: напротив
  rationale: Сохраняет пространственное значение расположения лицом к лицу или по другую сторону от ориентира.
- source_word: יָפוֹ
  choice: Иоппия
  rationale: Использована устоявшаяся русская библейская форма названия города, известного также как Яффа.
