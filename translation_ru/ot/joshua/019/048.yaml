  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: ru
  text: 'Вот удел племени сынов Дана[a] по их родам: эти города с их селениями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наследственный удел». Еврейское слово может подчёркивать как назначенную долю земли, так и её характер наследственного владения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательная формула подводит итог предшествующему перечню; русское «вот» естественно передаёт её без добавления отсутствующей в еврейском тексте временной связки.
- source_word: נַחֲלַת
  choice: удел
  rationale: В контексте распределения земли обозначает закреплённую за племенем наследственную территорию; «удел» сохраняет и распределительный, и наследственный оттенки.
- source_word: מַטֵּה בְנֵי דָן
  choice: племени сынов Дана
  rationale: «Племя» является контекстуальным значением מַטֶּה, а «сынов Дана» формально и понятно передаёт еврейскую конструкцию.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: Здесь מִשְׁפָּחוֹת означает родовые подразделения племени, а не отдельные нуклеарные семьи.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: Прямо передаёт указательное выражение, обобщающее предшествующий список.
- source_word: וְחַצְרֵיהֶן
  choice: с их селениями
  rationale: חָצֵר в земельных списках обозначает зависимые или окрестные поселения при городах; «селения» не навязывает точный размер таких населённых пунктов.
