  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: ru
  text: Третий жребий выпал[a] сынам Завулона, по их родам. Граница их удела простиралась до Сарида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся» или «вышел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: выпал
  rationale: В контексте жеребьёвки естественное русское выражение «жребий выпал» точно передаёт смысл, хотя еврейский глагол буквально означает «поднялся / вышел».
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: третий жребий
  rationale: Сохраняет порядковое обозначение и конкретный жребий, определявший племенной удел.
- source_word: לִבְנֵי זְבוּלֻן
  choice: сынам Завулона
  rationale: Передаёт буквально-родовой характер выражения בני и традиционную форму имени племени, не сводя его просто к населению.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте племенного устройства משפחה обозначает родовые подразделения; «по их родам» естественно передаёт распределительное значение предлога ל.
- source_word: גְּבוּל נַחֲלָתָם
  choice: граница их удела
  rationale: גבול обозначает границу, а נחלה — полученную по наследственному распределению землю; русское «удел» ёмко передаёт этот контекст.
- source_word: עַד שָׂרִיד
  choice: до Сарида
  rationale: В описании границ עַד указывает на предел их протяжённости; שָׂרִיד передано как географическое имя «Сарид».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Сынам Завулона» сохраняет родоплеменную формулу оригинала, а «по их родам» понятно передаёт внутреннее деление племени. Разделение на два предложения облегчает чтение без изменения синтаксической связи исходного текста.
