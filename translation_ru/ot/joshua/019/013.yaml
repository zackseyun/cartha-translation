  text: וּ/מִ/שָּׁ֤ם עָבַר֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה גִּתָּ֥/ה חֵ֖פֶר עִתָּ֣ה קָצִ֑ין וְ/יָצָ֛א רִמּ֥וֹן הַ/מְּתֹאָ֖ר הַ/נֵּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: ru
  text: Оттуда граница шла на восток[a], к восходу солнца, к Гат-Хеферу и Итта-Кацину[b], а затем выходила к Риммону[c] и тянулась к Нее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на восток, к восходу»; в еврейском тексте употреблены два обозначения восточного направления, вероятно для усиления.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское название можно также передать как «Эт-Кацин».
    reason: alternative_reading
  - marker: c
    text: 'Еврейский текст этой части стиха неясен; буквально получается нечто вроде: «Риммон, размеченный в сторону Неи». Обычно это понимают как указание на то, что граница тянулась от Риммона к Нее.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Оттуда
  rationale: Передаёт последовательный переход к следующему участку границы; начальный союз естественно опущен в русском описании маршрута.
- source_word: עָבַר
  choice: граница шла
  rationale: В формулах описания владений глагол обозначает прохождение пограничной линии; явное «граница» восполняет подразумеваемое подлежащее и делает русский текст ясным.
- source_word: קֵדְמָה מִזְרָחָה
  choice: на восток, к восходу солнца
  rationale: Сохранены оба еврейских указания направления, вероятно усиливающие друг друга.
- source_word: גִּתָּה חֵפֶר
  choice: Гат-Хефер
  rationale: Топоним передан современной транслитерацией как составное название.
- source_word: עִתָּה קָצִין
  choice: Итта-Кацин
  rationale: Масоретскую форму уместно понимать как единый топоним; удвоение в «Итта» отражает согласный состав формы עִתָּה.
- source_word: וְיָצָא
  choice: а затем выходила
  rationale: В описаниях границ глагол изображает линию, выходящую к очередному пункту; «затем» естественно выражает последовательность.
- source_word: רִמּוֹן
  choice: Риммон
  rationale: Передача географического названия транслитерацией.
- source_word: הַמְּתֹאָר
  choice: тянулась
  rationale: Контекстуально передаёт вероятный смысл продолжения или проведения границы, не выдавая неясную форму за бесспорную.
- source_word: הַנֵּעָה
  choice: к Нее
  rationale: Форма понята как топоним Нея с направительным окончанием, то есть движение в сторону Неи.
