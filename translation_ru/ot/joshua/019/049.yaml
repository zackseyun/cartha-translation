base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: ru
  text: Когда они закончили распределять землю по её границам[a], сыны Израиля[b] дали Иисусу, сыну Навина, удел среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по её областям». Древнееврейское слово может указывать как на пограничные линии, так и на ограниченные ими территории.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть израильтяне. Буквально: «сыны Израиля» — традиционное обозначение народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: Когда они закончили распределять … на уделы
  rationale: Последовательная глагольная форма обозначает завершённое действие, после которого следует новое; נחל в контексте Иисуса Навина 13–19 относится к распределению земли как наследственных уделов.
- source_word: אֶת הָאָרֶץ
  choice: землю
  rationale: В данном контексте имеется в виду распределяемая земля Ханаана, а не земля как мир или почва.
- source_word: לִגְבוּלֹתֶיהָ
  choice: по её областям
  rationale: Множественное גְּבוּל может обозначать как границы, так и ограниченные ими территории; «по её областям» естественно передаёт территориальное деление, не устраняя альтернативный акцент на границах.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено формальное национальное наименование исходного текста; в русском библейском повествовании оно понятно и сохраняет образную форму древнееврейского выражения.
- source_word: נַחֲלָה
  choice: наследственный удел
  rationale: Сочетание передаёт одновременно значение наследия и конкретной земельной доли, официально выделенной Иисусу Навину.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: Иисусу, сыну Навина
  rationale: Использована устоявшаяся русская форма имени Иисуса Навина; приложение оформлено естественно для современного русского синтаксиса.
- source_word: בְּתוֹכָם
  choice: среди себя
  rationale: Формулировка сохраняет указание на то, что удел Иисуса Навина был дан внутри земли и сообщества Израиля, а не отдельно от них.
theological_decisions:
- issue: Земля как נַחֲלָה
  choice: наследственный удел
  alternative: владение; наследие
  rationale: Выбранное выражение сохраняет юридический и богословский оттенок земли, полученной как назначенная доля, не сводя её к простому имуществу.
- issue: Наименование בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формальная родовая формула сохранена без превращения её в утверждение только о мужчинах; примечание разъясняет её функцию как названия народа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формула «сыны Израиля» сохранена как прозрачное обозначение народа; «наследственный удел» передаёт ключевую земельно-правовую лексику книги. Все примечания отмечены в основном тексте.
