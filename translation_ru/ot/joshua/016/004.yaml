lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: получили свой удел
  rationale: Глагол נחל в данном контексте означает получение отведённого наследственного земельного удела. Эта формулировка естественна по-русски и не придаёт глаголу излишнего оттенка военного овладения.
- source_word: בְנֵי יוֹסֵף
  choice: сыновья Иосифа
  rationale: Сохранён буквальный генеалогический оборот, который здесь обозначает также происходящие от Иосифа колена; последующее перечисление Манассии и Ефрема делает смысл ясным.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Использована традиционная русская библейская форма имени.
- source_word: וְאֶפְרָיִם
  choice: и Ефрем
  rationale: Использована традиционная русская библейская форма имени с сохранением союза.
- source_word: וַ
  choice: И
  rationale: Союз передаёт последовательное продолжение повествования и непосредственно отражает еврейский повествовательный waw.
