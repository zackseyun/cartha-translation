  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: ru
  text: Оттуда граница спускалась от Яноаха к Атароту и к Нааре[a], доходила до Иерихона[b] и выходила к Иордану[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Наара»; ср. «Наарат» в Иисуса Навина 16:8.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «касалась Иерихона»; еврейский глагол может обозначать, что линия границы достигает какого-либо места или соприкасается с ним.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «заканчивалась у Иордана»; еврейская формула может описывать как направление границы, так и её конечную точку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: граница спускалась
  rationale: В описании границ глагол ירד обозначает движение линии границы вниз по рельефу или в соответствующем направлении. Слово «граница» добавлено из контекста для естественности и ясности по-русски.
- source_word: מִיָּנוֹחָה
  choice: от Яноаха
  rationale: Предлог מִן передан как «от», а топоним יָנוֹחַ — принятой русской транслитерацией «Яноах».
- source_word: עֲטָרוֹת
  choice: к Атароту
  rationale: Топоним передан транслитерацией, а направление, подразумеваемое формулой прохождения границы, выражено предлогом «к».
- source_word: וְנַעֲרָתָה
  choice: и Нааре
  rationale: Масоретская форма указывает направление к месту Наара; окончание -ָה имеет направительное значение. Возможная связь с вариантом «Наарат» отмечена в сноске.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: доходила до Иерихона
  rationale: В территориальных описаниях פגע может означать соприкосновение линии границы с местом или достижение его. «Доходила до» естественно передаёт пространственный смысл, не уточняя характер соприкосновения сверх исходного текста.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: и выходила к Иордану
  rationale: Глагол יצא в формулах описания границ обозначает выход линии к следующему пункту или конечному рубежу. Буквальное и естественное «выходила к» сохраняет некоторую неоднозначность между ходом линии и её конечной точкой.
- source_word: הַיַּרְדֵּן
  choice: Иордану
  rationale: Название реки передано традиционной русской формой «Иордан»; слово «река» в данном контексте не требуется.
