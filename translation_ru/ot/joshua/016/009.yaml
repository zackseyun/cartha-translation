  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: ru
  text: И города, отделённые для сынов Ефрема в пределах удела сынов Манассии, — все города с их селениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города, обособленные для сынов Ефрема». Еврейское причастие подчёркивает, что эти города были выделены для Ефрема, хотя находились в пределах удела Манассии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: города
  rationale: עִיר обозначает город или поселение; «города» соответствует языку перечней земельных уделов в книге Иисуса Навина.
- source_word: הַמִּבְדָּלוֹת
  choice: отделённые
  rationale: Причастие от בדל выражает отделение или выделение. В данном контексте речь идёт о городах, выделенных Ефрему в пределах удела Манассии.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: для сынов Ефрема
  rationale: Сохранена буквальная племенная формула בני; здесь она обозначает потомков Ефрема как колено.
- source_word: בְּתוֹךְ נַחֲלַת
  choice: внутри удела
  rationale: בְּתוֹךְ указывает на расположение в пределах территории, а נַחֲלָה в земельных списках означает наследственно полученный удел.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: сынов Манассии
  rationale: Сохранена параллельная племенная формула, соответствующая выражению «сынов Ефрема».
- source_word: כָּל הֶעָרִים
  choice: все эти города
  rationale: Указательное «эти» естественно передаёт итоговое, обобщающее возвращение к только что упомянутым городам, хотя в еврейском оно подразумевается контекстом.
- source_word: וְחַצְרֵיהֶן
  choice: с их селениями
  rationale: חָצֵר в территориальных перечнях обозначает зависимые от города небольшие или неукреплённые поселения; «селения» ясно передаёт это значение.
