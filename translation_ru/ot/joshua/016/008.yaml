source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: ru
  text: От Таппуаха граница идёт на запад к потоку Кана[a] и оканчивается у моря. Это удел колена сынов Ефрема по их родам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к руслу Кана»; еврейское слово может обозначать поток, русло сезонного потока или вади.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Ефрема» — обычное родовое обозначение племени, происходящего от Ефрема.'
    reason: lexical_clarification
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: От Таппуаха
  rationale: Предлог מִן указывает исходную точку границы; географическое название передано принятой русской библейской транслитерацией.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: граница идёт
  rationale: Сочетание הלך с גְּבוּל описывает прохождение линии границы; настоящее время сохраняет форму еврейского текста и естественно звучит в географическом описании.
- source_word: יָמָּה
  choice: на запад
  rationale: Направительная форма от יָם буквально связана с морем, но в описаниях границ обычно обозначает западное направление.
- source_word: נַחַל קָנָה
  choice: к потоку Кана
  rationale: נַחַל может обозначать поток, русло или вади. «Поток» понятен широкому читателю и сохраняет географическую неоднозначность термина.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: и оканчивается у моря
  rationale: Пограничная формула сообщает о конечной точке линии. Идиоматическое русское выражение передаёт смысл без неестественного буквального «выходы его были».
- source_word: זֹאת נַחֲלַת מַטֵּה
  choice: Это удел колена
  rationale: נַחֲלָה здесь означает наследственный земельный удел, а מַטֶּה — племенное колено.
- source_word: בְנֵי אֶפְרַיִם
  choice: сынов Ефрема
  rationale: Сохранено буквальное мужское родовое обозначение, которое в контексте служит стандартным названием потомков Ефрема.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте распределения земли מִשְׁפָּחוֹת обозначает родовые подразделения колена; «роды» точнее, чем современное бытовое «семьи».
theological_decisions:
- issue: Родовое обозначение בְנֵי אֶפְרַיִם
  choice: сынов Ефрема
  alternative: потомков Ефрема / ефремлян
  rationale: Буквальная форма сохраняет выраженную в исходном тексте связь колена с праотцом Ефремом, не превращая её в нейтральное собирательное название.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён до естественного описания границы; сохранены различие между западным направлением и морем как конечной точкой, а также родовое выражение «сыны Ефрема» в зависимой форме.
