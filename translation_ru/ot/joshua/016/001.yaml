base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: ru
  text: 'И жребий выпал[a] сыновьям Иосифа: от Иордана у Иерихона — к водам Иерихона[b] на востоке; далее через пустыню, поднимающуюся от Иерихона в нагорье Вефиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел жребий». В контексте распределения по жребию еврейский глагол обозначает результат жеребьёвки; по-русски обычно говорят: «жребий выпал».'
    reason: lexical_alternative
  - marker: b
    text: «Воды Иерихона» могут означать источник или источники воды, снабжавшие Иерихон.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: И вышел жребий
  rationale: Сохраняет конкретный образ еврейского глагола יצא («выйти»), относящийся к результату жеребьёвки. Более обычное русское «выпал жребий» отмечено в сноске.
- source_word: לִבְנֵי יוֹסֵף
  choice: сынам Иосифа
  rationale: Передаёт корпоративное родовое обозначение буквально и в привычной для библейского повествования русской форме; речь идёт о племенных потомках Иосифа.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: от Иордана у Иерихона
  rationale: Обозначает исходную точку на Иордане в районе Иерихона, не уточняя расстояние или административную принадлежность.
- source_word: לְמֵי יְרִיחוֹ מִזְרָחָה
  choice: к водам Иерихона с восточной стороны
  rationale: Сохраняет собирательно-множественное «воды» и восточную ориентацию, не сводя выражение без достаточных оснований к одному конкретному источнику.
- source_word: הַמִּדְבָּר
  choice: через пустыню
  rationale: В данном описании местности מדבר означает пустынную, необжитую область; предлог «через» естественно выражает прохождение описываемой линии, хотя в еврейском он подразумевается синтаксически.
- source_word: עֹלֶה מִירִיחוֹ
  choice: поднимающуюся от Иерихона
  rationale: Причастие согласовано с «пустыней» и передаёт реальный подъём от Иорданской долины к возвышенности.
- source_word: בָּהָר בֵּית אֵל
  choice: к Вефильскому нагорью
  rationale: הר в географическом описании может обозначать не отдельную гору, а горную страну или нагорье; русское прилагательное естественно передаёт связь с Вефилем.
