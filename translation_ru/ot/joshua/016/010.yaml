  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: ru
  text: Но они не изгнали хананеев, живших в Газере, и хананеи живут среди ефремлян до сего дня и стали обязаны нести трудовую повинность.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и стали подневольными работниками».'
    reason: Еврейское לְמַס עֹבֵד обозначает принудительную трудовую повинность; альтернативный вариант передаёт тот же статус более кратко, но менее точно.
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: изгнали
  rationale: В каузативной породе глагол здесь означает изгнать или лишить владения; «изгнали» естественно передаёт смысл в контексте овладения землёй.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: среди ефремлян
  rationale: Название Ефрем обозначает здесь племенную общность, а не только территорию; такая передача естественна по-русски и сохраняет смысл пребывания внутри сообщества.
- source_word: לְמַס עֹבֵד
  choice: подневольными работниками
  rationale: Сочетание обозначает людей, обязанных нести принудительную трудовую повинность; формулировка передаёт принуждение, не сводя выражение однозначно к полному рабству.
theological_decisions:
- issue: Связь между неизгнанием хананеев и их дальнейшим проживанием среди Ефрема
  choice: Поэтому
  alternative: и
  rationale: Вав допускает контекстуальное следственное прочтение; «поэтому» ясно выражает повествовательную связь, не добавляя богословской оценки.
- issue: Временная соотнесённость וַיְהִי с выражением «до сего дня»
  choice: стали
  alternative: были / являются
  rationale: 'Форма повествовательного прошедшего естественно передаётся как наступившее состояние: хананеи «стали» подневольными работниками. Текст не уточняет точный момент начала повинности.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «До сего дня» сохранено как устойчивое и понятное библейское выражение; синтаксис разделён на два предложения ради ясности.
