  text: От Вефиля она шла к Лузу и далее — к границе архитян, к Атарофу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: граница шла
  rationale: Подлежащее восстанавливается из контекста описания земельного удела; по-русски явное «граница» делает географический маршрут понятным без изменения смысла.
- source_word: מִבֵּית אֵל
  choice: от Вефиля
  rationale: Устоявшаяся русская передача названия בֵּית אֵל; предлог מִן выражает исходную точку.
- source_word: לוּזָה
  choice: к Лузу
  rationale: Конечная ה указывает направление движения; «к Лузу» естественно передаёт эту форму.
- source_word: וְעָבַר
  choice: а затем проходила
  rationale: В описании границы глагол обозначает дальнейшее прохождение линии; перевод избегает неуместного здесь оттенка физической переправы.
- source_word: אֶל גְּבוּל
  choice: к границе
  rationale: גְּבוּל в данном контексте означает рубеж или границу территории.
- source_word: הָאַרְכִּי
  choice: архитян
  rationale: Субстантивированное обозначение принадлежности передано русским названием народа или рода во множественном числе.
- source_word: עֲטָרוֹת
  choice: Атарофа
  rationale: Использована укоренившаяся в русской библейской традиции передача топонима; форма родительного падежа обусловлена предлогом «у».
