base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: ru
  text: Вот владения потомков Ефрема по их родам; восточная граница их удела шла от Атарот-Аддара[a] до Верхнего Бет-Хорона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «граница их удела к востоку начиналась у Атарот-Аддара». Синтаксис еврейской фразы допускает такое прочтение; общее географическое указание остаётся тем же.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: владения / граница
  rationale: Первое употребление обозначает территорию колена в целом, поэтому естественно передано как «владения»; второе относится к линии земельного рубежа и передано как «граница».
- source_word: בְּנֵי אֶפְרַיִם
  choice: потомки Ефрема
  rationale: В родоплеменном контексте еврейское «сыны Ефрема» обозначает его потомков; выбран современный и ясный русский эквивалент без утраты генеалогического смысла.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь означает родовое подразделение внутри колена; «по их родам» сохраняет социальную структуру и звучит естественно по-русски.
- source_word: נַחֲלָתָם
  choice: их удела
  rationale: В книге Иисуса Навина נַחֲלָה обозначает землю, полученную по наследственному распределению; «удел» точно и кратко передаёт этот смысл.
- source_word: מִזְרָחָה
  choice: на востоке
  rationale: Направительная форма указывает на восточную сторону описываемой территории; «на востоке» естественно вводит описание границы.
- source_word: עַטְרוֹת אַדָּר
  choice: Атарот-Аддар
  rationale: Географическое название передано транслитерацией; дефис отражает составной характер топонима.
- source_word: עַד
  choice: до
  rationale: В описании границ предлог обозначает конечный пункт протяжённости линии.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: Верхний Бет-Хорон
  rationale: Прилагательное отличает это место от Нижнего Бет-Хорона; порядок слов соответствует естественной русской форме топонима.
