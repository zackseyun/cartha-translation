  text: וְ/יָצָ֨א הַ/גְּב֜וּל הַ/יָּ֗מָּ/ה הַֽ/מִּכְמְתָת֙ מִ/צָּפ֔וֹן וְ/נָסַ֧ב הַ/גְּב֛וּל מִזְרָ֖חָ/ה תַּאֲנַ֣ת שִׁלֹ֑ה וְ/עָבַ֣ר אוֹת֔/וֹ מִ/מִּזְרַ֖ח יָנֽוֹחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: ru
  text: Затем граница шла на запад[a], к Михметату, расположенному с северной стороны; далее она поворачивала на восток, к Таанат-Шило, проходила восточнее его и шла к Яноаху.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к морю»; в древнееврейском это обычное обозначение запада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Затем граница шла
  rationale: В описаниях границ глагол יָצָא обозначает дальнейшее прохождение линии. Русское «шла» естественно передаёт движение границы, а «затем» плавно выражает последовательность, заданную союзом וְ.
- source_word: הַגְּבוּל
  choice: граница
  rationale: Здесь имеется в виду разграничительная линия племенного удела, а не сама территория.
- source_word: הַיָּמָּה
  choice: на запад[a]
  rationale: Буквально выражение означает «к морю» и служит обычным древнееврейским обозначением западного направления. В тексте дано понятное направление, а буквальный образ сохранён в сноске.
- source_word: הַמִּכְמְתָת
  choice: к Михметату
  rationale: Название места передано транслитерацией непосредственно с древнееврейской формы.
- source_word: מִצָּפוֹן
  choice: расположенному с северной стороны
  rationale: Фраза, вероятнее всего, указывает положение Михметата относительно описываемой границы. Формулировка сохраняет топографический смысл, не превращая её в указание движения на север.
- source_word: וְנָסַב
  choice: поворачивала
  rationale: В перечнях границ נָסַב обозначает изменение направления линии.
- source_word: מִזְרָחָה
  choice: на восток
  rationale: Направительное окончание указывает движение в восточном направлении.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Таанат-Шило
  rationale: Составное географическое название транслитерировано с древнееврейского и соединено дефисом для ясности.
- source_word: וְעָבַר אֹתוֹ
  choice: проходила … его
  rationale: В описании границы עָבַר означает, что линия продолжалась мимо названного места; местоимение относится к Таанат-Шило.
- source_word: מִמִּזְרַח
  choice: восточнее
  rationale: Передаёт положение границы с восточной стороны от Таанат-Шило. Это естественная русская формулировка пространственного отношения.
- source_word: יָנוֹחָה
  choice: к Яноаху
  rationale: Географическое название передано транслитерацией; направительная форма в древнееврейском выражена русским предлогом «к».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор слова «граница» во второй части заменён местоимением ради естественности; топографическая последовательность и неоднозначность кратких пространственных выражений исходного текста сохранены настолько, насколько позволяет ясный русский синтаксис.
