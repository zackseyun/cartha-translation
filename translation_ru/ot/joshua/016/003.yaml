  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: ru
  text: Затем граница спускалась на запад к границе иафлетян, до границы Нижнего Беф-Хорона и до Газера; её конечные точки были у моря.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַד
  choice: Затем граница спускалась
  rationale: Глагол ירד в описании рубежей обозначает движение вниз по местности; явное «граница» естественно восстанавливает подразумеваемый субъект из контекста.
- source_word: יָמָּה
  choice: на запад
  rationale: Направительная форма от слова «море» в географическом контексте обычно означает движение на запад, к Средиземному морю.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: к пределам иафлетян
  rationale: Гентилик הַיַּפְלֵטִי передан как название группы людей; множественное «пределы» естественно по-русски обозначает территорию этой группы.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: далее к границе Нижнего Беф-Хорона
  rationale: עַד указывает протяжённость маршрута границы, а תַּחְתּוֹן отличает Нижний Беф-Хорон от Верхнего.
- source_word: וְעַד גָּזֶר
  choice: и до Газера
  rationale: Повтор עַד продолжает перечисление точек, до которых доходит граница.
- source_word: וְהָיוּ תֹצְאֹתָיו יָמָּה
  choice: у моря она заканчивалась
  rationale: 'תֹצְאֹתָיו — формула описания конечной точки границы. Русское «заканчивалась» ясно и естественно передаёт её смысл, а финальное יָמָּה здесь понято конкретно: у моря.'
