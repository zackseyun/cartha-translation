  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: ru
  text: 'Иерихон был наглухо закрыт из-за сынов Израиля[a]: никто не выходил и никто не входил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля» — обычное обозначение народа Израиля как единого целого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: Иерихон
  rationale: Название города передано в принятой русской библейской форме; начальный союз не требует отдельного временного слова и естественно опускается при описании обстановки.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: был наглухо закрыт
  rationale: Сочетание активной и пассивной форм корня סגר усиливает значение полной закрытости города. «Наглухо закрыт» естественно передаёт эту эмфазу по-русски.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Предлог указывает на причину закрытия города — присутствие сынов Израиля; перевод не добавляет прямо не выраженного указания на страх.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранено еврейское родовое обозначение народа; сноска поясняет его корпоративный смысл.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: никто не выходил и никто не входил
  rationale: Естественная русская передача формулы, обозначающей полное прекращение движения из города и в город; несовершенный вид соответствует описанию продолжающегося положения.
