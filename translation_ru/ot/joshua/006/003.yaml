lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: обойдите город кругом
  rationale: Форма 2-го лица множественного числа от סבב передаёт предписание участникам похода совершить обход города. «Обойдите… кругом» естественно выражает движение вокруг объекта и сохраняет военный контекст без добавления отсутствующего в еврейском тексте указания на строй или марш.
- source_word: הָעִיר
  choice: город
  rationale: Обычное существительное עִיר с артиклем; хотя из контекста ясно, что речь об Иерихоне, исходный текст здесь называет его просто городом.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: все воины
  rationale: Сочетание буквально означает «все мужи войны». Современное русское «все воины» точно и естественно обозначает участвующих в сражении мужчин, не привнося архаического оборота «мужи войны».
- source_word: הַקֵּיף אֶת הָעִיר
  choice: Один раз обойдите город
  rationale: Повторное указание на обход передано отдельным кратким предложением, чтобы сохранить возобновляющий акцент еврейского текста. Императивное чтение согласуется с масоретской формой и контекстом предписания.
- source_word: פַּעַם אֶחָת
  choice: один раз
  rationale: Прямое и естественное соответствие идиоме, обозначающей однократное действие.
- source_word: כֹּה תַעֲשֶׂה
  choice: Так делай
  rationale: כֹּה указывает на предписанный способ действия, а תַעֲשֶׂה имеет форму 2-го лица единственного числа. Русское единственное число сохраняет переход от обращения к воинам во множественном числе к обращению к Иисусу Навину как ответственному руководителю.
- source_word: שֵׁשֶׁת יָמִים
  choice: шесть дней
  rationale: В сочетании с «так делай» винительный времени естественно выражает продолжительность и повторение действия в течение шести дней.
theological_decisions:
- issue: Передача כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: все воины
  alternative: все мужи войны; все способные сражаться мужчины
  rationale: Исходное выражение относится к мужчинам-воинам. Слово «воины» в данном повествовательном контексте сохраняет военное и мужское значение, оставаясь современным и понятным.
- issue: Смена числа адресата
  choice: множественное «обойдите» и единственное «делай»
  alternative: унифицировать обе формы как множественные либо как единственные
  rationale: Еврейский текст действительно переходит от 2-го лица множественного числа וְסַבֹּתֶם к 2-му лицу единственного числа תַעֲשֶׂה. Перевод сохраняет эту смену, не устраняя возможный переход от воинов к Иисусу Навину как руководителю.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-повествовательным строем. Избегается излишне архаическое «мужи войны». Повтор глагола обхода сохраняет настойчивость и структуру еврейского предписания; смена числа адресата передана явно.
