  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: ru
  text: Пусть семь священников несут перед ковчегом семь труб из бараньих рогов[a]. В седьмой день обойдите город семь раз, а священники пусть трубят в трубы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь бараньих рогов» или «семь шофаров из бараньего рога». Древнееврейское выражение обозначает роговые духовые инструменты, вероятно изготовленные из бараньих рогов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: пусть несут
  rationale: Глагол נשׂא означает «нести». В контексте последовательных повелений форма с «пусть» естественно передаёт предписывающий оттенок древнееврейского имперфекта.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: трубы из бараньих рогов
  rationale: שׁוֹפָר — духовой сигнальный инструмент из рога; определение הַיּוֹבְלִים здесь, вероятнее всего, указывает на бараньи рога. Перевод передаёт и вид инструмента, и материал, не используя малознакомую транслитерацию без необходимости.
- source_word: לִפְנֵי הָאָרוֹן
  choice: перед ковчегом
  rationale: לִפְנֵי выражает пространственное положение «перед, впереди». Уточнение «ковчег завета» в данном стихе отсутствует и поэтому не добавлено.
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: обойдите город
  rationale: סבב означает двигаться вокруг, обходить. Русское «обойдите город» кратко и естественно передаёт процессуально-военное действие и силу повеления в контексте.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: При повторяющемся действии פְּעָמִים естественно переводится словом «раз».
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: пусть трубят в эти трубы
  rationale: תקע с בְּ и названием рога — обычное выражение со значением «трубить в рог». Указательное «эти» ясно отсылает к уже названным семи трубам и избегает ненужного повтора полного определения.
