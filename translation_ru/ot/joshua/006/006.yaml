  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: ru
  text: 'Иисус, сын Навина, созвал священников и сказал им: «Несите ковчег завета, а семь священников пусть несут перед ковчегом Яхве[b] семь труб из бараньих рогов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Евр. יהוה (YHWH), личное имя Бога; традиционно передаётся как «Господь».
    reason: divine_name
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: созвал
  rationale: Глагол קרא здесь обозначает обращение Иисуса Навина к священникам, которых он призывает к себе для передачи распоряжения. «Созвал» естественно передаёт это значение и не усиливает его до официального вызова.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисус, сын Навин
  rationale: Использована укоренившаяся в русской библейской традиции форма имени; постановка приложения через запятые делает выражение естественным для современного русского языка.
- source_word: שְׂאוּ אֶת אֲרוֹן הַבְּרִית
  choice: Несите ковчег завета
  rationale: В данном контексте נשׂא означает не просто поднять, а нести ковчег в шествии. Сочетание «ковчег завета» точно и общеупотребительно передаёт אֲרוֹן הַבְּרִית.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: а семь священников пусть несут
  rationale: Имперфект после повеления имеет распорядительное значение. Конструкция «пусть несут» сохраняет директивную силу, а союз «а» естественно присоединяет второе распоряжение.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: семь труб из бараньих рогов
  rationale: שׁוֹפָר — сигнальная труба из рога, а יוֹבְלִים здесь, вероятнее всего, уточняет материал или происхождение рогов. Развёрнутая формулировка понятна современному читателю и не смешивает эти трубы с позднейшим техническим понятием юбилейного года.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог передаёт пространственное положение священников впереди ковчега в процессии.
- source_word: אֲרוֹן יְהוָה
  choice: ковчегом Яхве
  rationale: Конструкция непосредственно связывает ковчег с личным именем Бога. Форма «Яхве» передаёт тетраграмматон как имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Основной текст сохраняет его как «Яхве»; традиционная замена «Господь» указана в примечании, чтобы отразить широко распространённую практику чтения, не подменяя исходную форму.
- issue: Связь выражений אֲרוֹן הַבְּרִית и אֲרוֹן יְהוָה
  choice: сохранены как «ковчег завета» и «ковчег Яхве»
  alternative: унифицировать оба выражения как «ковчег Господа» или «ковчег завета»
  rationale: Исходный текст намеренно использует два разных определения одного ковчега. Их различие сохранено, чтобы не сглаживать богословскую связь между заветом и именем Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Прямая речь оформлена естественно; синтаксический параллелизм двух распоряжений сохранён без тяжеловесной буквальности.
