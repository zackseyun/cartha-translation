base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: ru
  text: И народ закричал, и затрубили в рога[a]. Когда народ услышал звук рога, он поднял громкий крик, и стена рухнула под собой[b]. Народ поднялся в город, и каждый шёл прямо перед собой, и захватил город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «шофар» обозначает рог, служивший сигнальным духовым инструментом; возможен перевод «труба».
    reason: cultural_note
  - marker: b
    text: 'Буквально: «стена упала под собой». Необычное еврейское выражение, вероятно, описывает стену, обрушившуюся прямо вниз, на своём месте; возможен перевод «стена рухнула до основания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: закричал / поднял громкий крик
  rationale: Корень רוע и существительное תְּרוּעָה обозначают громкий возглас, нередко боевой или обрядовый. Перевод сохраняет повторение корня по смыслу, не уточняя без необходимости, что это был именно боевой клич.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: рога / рог
  rationale: שׁוֹפָר — сигнальный духовой инструмент из рога. «Рог» точнее передаёт предмет и остаётся понятным по контексту; культурное пояснение дано в сноске.
- source_word: קוֹל הַשּׁוֹפָר
  choice: звук рога
  rationale: קוֹל означает «голос, звук»; применительно к инструменту естественно русское «звук», не добавляющее оттенка продолжительного трубного сигнала.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: стена рухнула под собой
  rationale: Необычное еврейское выражение буквально описывает стену как упавшую «под собой». Формулировка сохраняет образ и его трудность, а более идиоматическое понимание отмечено в сноске.
- source_word: וַיַּעַל ... הָעִירָה
  choice: народ поднялся в город
  rationale: עלה означает «подниматься», а направительный суффикс при עִיר указывает движение к городу и внутрь него. Перевод сохраняет оба элемента, не усиливая глагол до «ворвался».
- source_word: אִישׁ נֶגְדּוֹ
  choice: каждый прямо перед собой
  rationale: אִישׁ употреблено распределительно, а נֶגְדּוֹ указывает направление непосредственно перед каждым участником. Русское «каждый» естественно сохраняет мужскую форму и индивидуальный характер продвижения.
- source_word: וַיִּלְכְּדוּ
  choice: захватили
  rationale: לכד в повествовании о войне обычно означает взятие или захват города; «захватили» — ясный современный эквивалент.
theological_decisions:
- issue: Распределительное выражение мужского рода אִישׁ נֶגְדּוֹ
  choice: каждый прямо перед собой
  alternative: все двинулись прямо вперёд
  rationale: Еврейский текст представляет продвижение распределительно и использует форму мужского рода. «Каждый» сохраняет это без тяжеловесного «каждый мужчина» и без нейтрализации образа.
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью. Синтаксический повтор передаёт стремительность еврейского рассказа, но чрезмерное нанизывание союзов устранено там, где оно звучало бы неестественно. Необычный образ падения стены сохранён в основном тексте и пояснён в сноске.
