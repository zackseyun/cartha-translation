  text: Иисус Навин встал рано утром, и священники понесли ковчег Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: встал рано
  rationale: Порода hифиль глагола שׁכם здесь означает раннее начало действия, обычно — «встать рано»; это естественная современная формулировка.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличить этого персонажа от Иисуса Христа.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Буквально «утром»; в сочетании с «встал рано» естественно передаёт временной акцент еврейского текста.
- source_word: וַיִּשְׂאוּ
  choice: понесли
  rationale: נשא может означать «поднять», «нести» или «переносить». В контексте движения с ковчегом совершенный вид «понесли» естественно обозначает начало переноски в последовательности повествования.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямое соответствие определённой форме множественного числа; русское словоупотребление не требует отдельного артикля.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Сопряжённая конструкция передана как принадлежность; אֲרוֹן в данном контексте традиционно и точно передаётся словом «ковчег».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, в соответствии с указанным проектным решением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное Божье имя. «Яхве» сохраняет это различие и соответствует заданному доктринальному решению, не подменяя имя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («Иисус Навин», «священники», «ковчег»). Синтаксис сохраняет краткость и последовательность еврейского повествования.
