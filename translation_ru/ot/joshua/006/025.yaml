  terminology: «Проститутка» — точное современное соответствие זּוֹנָה; вариант «блудница» корректно дан в примечании. «Семью её отца» адекватно передаёт בֵּית אָבִיהָ в данном контексте. «Посланцев» сохраняет лексический выбор מַלְאָכִים, а «разведать» уточняет их миссию через לְרַגֵּל. Примечание b обоснованно отмечает широту כָּל אֲשֶׁר לָהּ.
