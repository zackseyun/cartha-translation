  text: וְֽ/אֶת רָחָ֣ב הַ֠/זּוֹנָה וְ/אֶת בֵּ֨ית אָבִ֤י/הָ וְ/אֶת כָּל אֲשֶׁר לָ/הּ֙ הֶחֱיָ֣ה יְהוֹשֻׁ֔עַ וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י הֶחְבִּ֨יאָה֙ אֶת הַ/מַּלְאָכִ֔ים אֲשֶׁר שָׁלַ֥ח יְהוֹשֻׁ֖עַ לְ/רַגֵּ֥ל אֶת יְרִיחֽוֹ־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: ru
  text: А проститутку Раав[a], семью её отца и всё, что ей принадлежало[b], Иисус Навин оставил в живых. Она живёт среди Израиля до сего дня, потому что укрыла посланцев, которых Иисус Навин послал разведать Иерихон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «блудницу».'
    reason: lexical_alternative
  - marker: b
    text: Древнееврейское выражение широкое и может охватывать как имущество Раав, так и принадлежавших к её дому людей.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: проститутку
  rationale: Слово обозначает женщину, занимающуюся проституцией. «Проститутка» — ясное современное обозначение; традиционное «блудница» сегодня может восприниматься шире, как указание на половую распущенность вообще.
- source_word: בֵּית אָבִיהָ
  choice: семью её отца
  rationale: Буквально «дом её отца», но в данном контексте имеется в виду отцовское семейство, а не здание.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: всё, что ей принадлежало
  rationale: Широкая древнееврейская формулировка не уточняет, идёт ли речь только об имуществе или также о зависимых от неё людях; перевод сохраняет эту широту, а примечание делает её явной.
- source_word: הֶחֱיָה
  choice: оставил в живых
  rationale: Каузативная форма глагола חיה означает «сохранить жизнь, позволить жить»; русское выражение прямо и естественно передаёт этот смысл.
- source_word: וַתֵּשֶׁב ... עַד הַיּוֹם הַזֶּה
  choice: Она живёт ... до сего дня
  rationale: Фраза описывает проживание, продолжающееся до времени повествователя; настоящее время по-русски естественно передаёт эту продолжающуюся ситуацию.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: среди Израиля
  rationale: Сохраняет коллективное обозначение народа и утверждение о пребывании Раав внутри сообщества, не добавляя более поздних богословских выводов.
- source_word: הַמַּלְאָכִים
  choice: посланцев
  rationale: מַלְאָכִים здесь означает посланных людей; их разведывательная задача прямо названа далее.
- source_word: לְרַגֵּל
  choice: разведать
  rationale: В данном военном контексте глагол означает тайно обследовать местность и получить сведения; «разведать» ясно и естественно передаёт функцию посланцев.
theological_decisions:
- issue: Включение Раав в среду Израиля
  choice: Она живёт среди Израиля до сего дня
  alternative: Она поселилась среди израильтян и живёт там до сего дня
  rationale: Выбранная формулировка сохраняет прямое утверждение текста о продолжающемся пребывании Раав внутри Израиля и не уточняет сверх сказанного характер её включения в народ.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «До сего дня» сохранено как понятная устойчивая библейская формула; синтаксис разделён на два предложения ради ясности.
