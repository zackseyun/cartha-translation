  source_fidelity: 'Перевод точно передаёт синтаксические и смысловые элементы еврейского текста: Раав, дом/семья её отца, всё принадлежащее ей, сохранение жизни, пребывание среди Израиля «до сего дня», сокрытие посланцев и их задача разведать Иерихон. «Оставил в живых» корректно передаёт каузатив הֶחֱיָה. Настоящее «живёт» уместно воспроизводит состояние, продолжающееся до времени повествователя.'
