base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: ru
  text: 'Иисус Навин приказал народу: «Не кричите[a], и пусть не будет слышно вашего голоса; и пусть ни одно слово не выйдет из ваших уст[b] до того дня, когда я скажу вам: „Кричите!“ Тогда кричите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, конкретнее в данном контексте: «Не издавайте боевого клича» или «Не поднимайте боевого крика».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и ни одно слово да не выйдет из ваших уст».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: приказал
  rationale: Глагол выражает властное повеление, а не просто наставление; «приказал» естественно передаёт эту силу.
- source_word: הָעָם
  choice: народу
  rationale: Хотя контекст военный, употреблено обычное слово «народ»; перевод не сужает его значения до «войска».
- source_word: לֹא תָרִיעוּ
  choice: Не кричите
  rationale: В породе хифиль корень רוע обозначает громкий крик, нередко боевой или победный. «Не кричите» сохраняет широту значения, а контекстуальный оттенок отмечен в сноске.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: и пусть не будет слышно вашего голоса
  rationale: Хифиль от שׁמע имеет каузативный смысл «делать слышимым»; выбранная формулировка близка к еврейскому выражению и естественна по-русски.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: ни одно слово да не выйдет из ваших уст
  rationale: Сохранены образ выходящего из уст слова и единственное число דָּבָר. Частица «да» придаёт фразе характер строгого запрета.
- source_word: עַד יוֹם
  choice: до того дня
  rationale: Передано конкретное временное обозначение «до дня», без замены более общим «до тех пор».
- source_word: אָמְרִי אֲלֵיכֶם
  choice: когда я скажу вам
  rationale: Инфинитивная конструкция с суффиксом первого лица имеет временную функцию; такая передача естественна в русском языке.
- source_word: הָרִיעוּ
  choice: Кричите!
  rationale: Повелительная форма переведена тем же глаголом, что и предшествующий запрет, чтобы сохранить повтор корня רוע.
- source_word: וַהֲרִיעֹתֶם
  choice: Тогда кричите
  rationale: Союз после прямого повеления имеет последовательный оттенок; «тогда» ясно передаёт требуемую очередность и сохраняет повтор глагола.
