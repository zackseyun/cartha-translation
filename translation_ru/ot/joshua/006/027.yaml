  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: ru
  text: И Яхве был с Иисусом Навином, и молва о нём[a] шла по всей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «известие о нём», «слава о нём». Еврейское слово может означать известие, молву или репутацию; здесь, вероятно, имеется в виду растущая известность Иисуса Навина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיְהִי
  choice: был; шла
  rationale: В первой части глагол היה естественно передан простой связкой «был». Во второй именная конструкция со словом «молва» по-русски идиоматично выражена как «молва… шла», без изменения основного смысла.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: с Иисусом Навином
  rationale: 'При היה предлог אֶת обозначает присутствие или сопровождение: «был с». Имя передано в принятой русской библейской форме «Иисус Навин».'
- source_word: שָׁמְעוֹ
  choice: молва о нём
  rationale: Слово שֵׁמַע может означать слух, известие, молву или славу. «Молва о нём» естественно передаёт распространение сведений и растущую известность Иисуса Навина, не сужая значение только до прославления.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: В контексте речь идёт о земле, в которой разворачиваются события, а не обязательно обо всём мире. Русское «по всей земле» сохраняет краткость и контекстуальный охват.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Форма «Яхве» сохраняет личное имя Бога и не подменяет его титулом; при этом не вводится конфессионально окрашенная традиционная вокализация.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «И» сохраняет повествовательную связь стиха; оборот «молва… шла» понятен современному читателю и удерживает смысловую широту еврейского выражения.
