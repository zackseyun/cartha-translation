base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: ru
  text: Так он обвёл ковчег Яхве вокруг города один раз. Затем они пришли в стан и провели ночь в стане.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: обошёл
  rationale: Глагол описывает движение вокруг города. Форма допускает каузативный оттенок, поскольку ковчег несли священники, однако в еврейском предложении ковчег представлен как грамматический субъект; «обошёл» сохраняет эту особенность повествования.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Сочетание передано как конструкция принадлежности; имя יְהוָה сохранено как личное имя «Яхве».
- source_word: אֶת הָעִיר
  choice: город
  rationale: Определённое существительное указывает на Иерихон, но перевод сохраняет формулировку оригинала и не подставляет название города.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: сделав один круг
  rationale: Оборот уточняет, что город обошли один раз. Такой перевод естественен по-русски и передаёт уточняющее повторение еврейского текста.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: они пришли в стан
  rationale: בוא означает «приходить, входить»; «пришли в стан» передаёт направление движения, не добавляя отсутствующего в самом глаголе значения «вернулись».
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: провели ночь в стане
  rationale: לון означает оставаться или располагаться на ночь. «Провели ночь» ясно и естественно передаёт смысл, а повтор слова «стан» сохранён вслед за еврейским текстом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит личное имя Бога — тетраграмматон יְהוָה. Передача «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Ковчег как субъект действия
  choice: ковчег Яхве обошёл город
  alternative: ковчег Яхве обнесли вокруг города
  rationale: Хотя ковчег фактически несли священники и форма глагола может восприниматься каузативно, еврейская формулировка выдвигает ковчег как грамматический субъект. Основной текст сохраняет этот образ, а буквальная особенность поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским словом «стан». Синтаксис сделан ясным и естественным, при этом сохранены повтор «стан» и необычное представление ковчега как действующего субъекта.
