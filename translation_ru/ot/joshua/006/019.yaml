base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: ru
  text: Но всё серебро и золото, а также изделия из бронзы и железа — святыня Яхве; всё это поступит в сокровищницу Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте слова «святыня» и «поступит» стоят в единственном числе: всё перечисленное рассматривается как единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Но всё
  rationale: Союз ו связывает стих с предыдущим предписанием и в данном контексте имеет естественный противительный оттенок; כֹּל передано как «всё».
- source_word: כֶּסֶף וְ/זָהָב
  choice: серебро и золото
  rationale: כֶּסֶף здесь обозначает металл, а не деньги, поскольку стоит в ряду с золотом и металлическими изделиями.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: а также изделия из бронзы и железа
  rationale: כְּלִי — широкое обозначение предметов, сосудов или орудий; «изделия» сохраняет широту значения. נְחֹשֶׁת в данном материальном контексте естественно передаётся как «бронза».
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: святыня Яхве
  rationale: Формула обозначает не просто нравственную святость, а посвящённость Яхве. Именная конструкция «святыня Яхве» кратко и естественно передаёт эту принадлежность, не устраняя сакрального смысла.
- source_word: אוֹצַר יְהוָה
  choice: сокровищницу Яхве
  rationale: אוֹצָר означает хранилище или сокровищницу; в контексте драгоценных металлов «сокровищница» наиболее точно и естественно.
- source_word: יָבֽוֹא
  choice: поступит
  rationale: Глагол буквально означает «войдёт/придёт», но применительно к вещам, предназначенным для сокровищницы, русское «поступит» естественно выражает движение в неё без добавления явно не названного исполнителя.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, тетраграмматон יהוה. Форма «Яхве» сохраняет его как имя и соответствует исходному языковому свидетельству.
- issue: Смысл выражения קֹדֶשׁ ... לַיהוָה
  choice: «святыня Яхве» — посвящённое и принадлежащее Яхве
  alternative: «свято для Яхве»; «отделено для Яхве»
  rationale: Выбранная формулировка сохраняет одновременно сакральный статус и принадлежность, не сводя выражение только к ритуальному отделению или к абстрактному качеству святости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Коллективная конструкция «всё… всё это» позволяет естественно сохранить единственное число еврейского текста; «изделия» не сужает широкое значение כְּלִי до одних сосудов.
