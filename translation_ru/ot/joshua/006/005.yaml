base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: ru
  text: И когда в бараний рог протрубят протяжно[a], когда вы услышите звук рога, весь народ пусть издаст громкий крик. Тогда стена города рухнет прямо вниз[b], и народ пойдёт вверх — каждый прямо вперёд[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда бараний рог зазвучит протяжно». Буквальный оборот указывает на продолжительный звук рога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стена города упадёт под собой»; вероятно, имеется в виду, что она обрушится прямо вниз.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «каждый прямо перед собой» или «каждый прямо впереди себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ בְּקֶרֶן הַיּוֹבֵל
  choice: когда протрубят долгим звуком в бараний рог
  rationale: Оборот обозначает продолжительный звук рога. Русское выражение естественно передаёт идиому, сохраняя и длительность звучания, и упоминание бараньего рога.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: бараний рог
  rationale: В данном контексте יוֹבֵל обозначает барана либо сделанный из его рога сигнальный инструмент, а не юбилейный год.
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: звук рога
  rationale: שׁוֹפָר — сигнальный рог. Перевод «рог» точнее передаёт древний инструмент и избегает впечатления о современной металлической трубе.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: пусть издаст громкий крик
  rationale: Сочетание глагола и однокоренного существительного означает поднять сильный общий крик. Единственное число «народ ... издаст» естественно в русском.
- source_word: וְנָפְלָה ... תַּחְתֶּיהָ
  choice: обрушится прямо под собой
  rationale: Так передаётся буквальный пространственный образ «упадёт под собой», вероятно указывающий на обрушение стены вертикально вниз, без превращения вероятного смысла в основной текст.
- source_word: וְעָלוּ
  choice: пойдёт вверх
  rationale: עלה буквально означает движение вверх. В контексте это наступление в город, однако нейтральный перевод не добавляет отсутствующего в тексте военного оттенка.
- source_word: אִישׁ נֶגְדּוֹ
  choice: каждый прямо перед собой
  rationale: 'Оборот имеет распределительное значение: каждый движется прямо вперёд со своего места. «Каждый» в современном русском естественнее, чем избыточное «каждый мужчина», при сохранении контекста народа-войска.'
