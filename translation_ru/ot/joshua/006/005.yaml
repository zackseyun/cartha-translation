revisions:
- from: И когда протрубят долгим звуком в бараний рог[a], услышав звук рога, весь народ пусть издаст громкий крик. Тогда городская стена обрушится прямо под собой[b], и народ пойдёт вверх — каждый прямо перед собой[c].
  to: И когда в бараний рог протрубят протяжно[a], когда вы услышите звук рога, весь народ пусть издаст громкий крик. Тогда стена города рухнет прямо вниз[b], и народ пойдёт вверх — каждый прямо вперёд[c].
  rationale: Исправлена условная конструкция согласно еврейскому обращению во 2-м лице множественного числа; сглажены неестественные русские обороты. «Рухнет прямо вниз» передаёт наиболее вероятный смысл древнееврейского образа, а буквальная, спорная формулировка оставлена в сноске. Сохранены различение между бараньим рогом и шофаром («рог»), повелительная/предписывающая функция «пусть издаст» и нейтральное «пойдёт вверх».
