base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: ru
  text: Весь город со всем, что в нём, будет предан Господу на уничтожение[a]. Только проститутка Раав останется в живых — она и все, кто с нею в доме, — потому что она спрятала посланников[b], которых мы послали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет под заклятием». Еврейское слово обозначает нечто безвозвратно посвящённое Господу — здесь посредством уничтожения.'
    reason: lexical_alternative
  - marker: b
    text: 'Евр.: «посланников»; по контексту это люди, которых Иисус Навин послал разведать землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: предано ... на уничтожение
  rationale: В повествованиях о завоевании это слово обозначает не просто проклятие, а безвозвратное посвящение Богу, осуществляемое здесь через уничтожение. Формулировка сохраняет как посвятительный, так и разрушительный смысл.
- source_word: לַיהוָה
  choice: Господу
  rationale: Предлог указывает, кому посвящён город; дательный падеж естественно передаёт это отношение по-русски. Имя יהוה передано принятой в литературном библейском регистре формой «Господь».
- source_word: רַק
  choice: Только
  rationale: Слово вводит единственное исключение из участи города и сохраняет необходимое смысловое ударение.
- source_word: הַזּוֹנָה
  choice: блудница
  rationale: Существительное указывает на занятие или общественный статус Раав. «Блудница» понятно современному читателю и сохраняет достоинство библейского регистра; более специальное «проститутка» здесь звучало бы стилистически резко.
- source_word: תִּחְיֶה
  choice: останется в живых
  rationale: В данном противопоставлении уничтожению русское выражение ясно передаёт смысл «будет жить, уцелеет», не добавляя причины её спасения.
- source_word: אִתָּהּ בַּבַּיִת
  choice: с нею в доме
  rationale: Фраза указывает на людей, физически находящихся вместе с Раав в доме, а не на домочадцев вообще.
- source_word: הֶחְבְּאַתָה
  choice: она спрятала
  rationale: Прямо передаёт каузативную форму глагола חבא — «скрыть, спрятать», не добавляя оттенка покровительства.
- source_word: הַמַּלְאָכִים
  choice: посланников
  rationale: מַלְאָךְ означает посланника. В контексте это люди, отправленные Иисусом Навином; «разведчики» было бы допустимым контекстуальным уточнением, но менее буквально передавало бы данное слово.
- source_word: שָׁלָחְנוּ
  choice: мы послали
  rationale: Форма первого лица множественного числа указывает на совершённую ранее отправку; русский совершенный вид естественно выражает это без обязательного добавления «ранее».
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: А город и всё, что в нём, будет предано
  rationale: Русская конструкция естественно объединяет город со всем его содержимым. Отдельное воспроизведение возобновляющего местоимения הִיא сделало бы фразу тяжеловесной, тогда как смысловой охват полностью сохранён.
theological_decisions:
- issue: Передача завоевательного термина חֵרֶם
  choice: предано Господу на уничтожение
  alternative: будет под заклятием; будет безвозвратно посвящено Господу
  rationale: Выбранная формулировка не смягчает суровый характер суда, но и не сводит понятие к обычному проклятию. Она сохраняет напряжение между посвящением Господу и уничтожением.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Форма «Господь» соответствует укоренившемуся русскому библейскому регистру и не вносит конфессионально специфического прочтения; при этом дательный «Господу» точно выражает направленность посвящения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён по сравнению с еврейской конструкцией с возобновляющим местоимением, но её смысловой акцент сохранён. Тире выделяют Раав и находящихся с нею как единственное исключение.
