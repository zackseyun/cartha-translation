  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: ru
  text: 'Когда в седьмой раз священники затрубили в шофары[a], Иисус Навин сказал народу: «Воскликните, потому что Яхве отдал вам этот город!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шофар — сигнальный инструмент из рога животного, традиционно барана.
    reason: Пояснение малоизвестного древнееврейского названия инструмента.
lexical_decisions:
- source_word: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית
  choice: Когда в седьмой раз
  rationale: Оборот вводит очередное событие повествования и указывает на седьмой повтор действия. Русская придаточная конструкция естественно передаёт связь с последующим «сказал», не воспроизводя тяжеловесно еврейское «и было».
- source_word: תָּקְעוּ
  choice: затрубили
  rationale: Глагол תקע при названии духового сигнального инструмента означает дуть или трубить; «затрубили» естественно передаёт начало звучания.
- source_word: שּׁוֹפָרוֹת
  choice: шофары
  rationale: Транслитерация сохраняет конкретное название древнееврейского рогового сигнального инструмента; пояснение дано в сноске.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычный и нейтральный русский эквивалент глагола אמר при введении прямой речи.
- source_word: הָרִיעוּ
  choice: Воскликните
  rationale: Повелительная форма обозначает громкий общий возглас, способный быть боевым или торжественным. «Воскликните» сохраняет эту широту и не уточняет без необходимости «боевой клич».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание повеления и ясно передаёт причинную связь на современном русском языке.
- source_word: נָתַן
  choice: отдал
  rationale: Перфект представляет передачу города как совершившийся и несомненный факт. Прошедшее совершенного вида сохраняет эту силу в речи Иисуса Навина.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: הָעִיר
  choice: этот город
  rationale: Определённое существительное относится к находящемуся перед народом Иерихону; указательное «этот» естественно выражает контекстуальную определённость по-русски.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя יהוה. «Яхве» сохраняет имя и представляет принятую научную реконструкцию его произношения, не подменяя его титулом.
- issue: Совершённость передачи города до его фактического падения
  choice: «отдал» — как уже совершившийся факт
  alternative: «отдаст» — как будущее событие
  rationale: Форма נָתַן является перфектом. Речь представляет обещанное Богом действие как уже совершённое и несомненное; перевод будущим временем сгладил бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественной прямой речью. Архаические формулы вроде «и было» не используются; специфический культурный термин «шофар» сохранён и кратко объяснён.
