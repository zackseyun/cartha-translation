base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: ru
  text: 'И они предали заклятию[a] всё, что было в городе: от мужчины до женщины, от юноши до старика, вплоть до быка, овцы и осла, — истребив всё мечом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью уничтожили»; еврейский глагол означает безвозвратно предать под заклятие (херем), то есть на уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: предали заклятию
  rationale: Форма породы hифиль от חרם обозначает не просто убийство или уничтожение, а безвозвратное предание людей и имущества под херем, то есть на уничтожение. «Предали заклятию» сохраняет технический смысл, а сноска поясняет его современному читателю.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: всё, что было в городе
  rationale: Передаёт всеохватность еврейского выражения и естественно вводит последующее перечисление жителей и скота.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: от мужчины до женщины
  rationale: 'Сохраняет форму еврейского меризма и его всеохватный смысл: речь идёт и о мужчинах, и о женщинах.'
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: от юноши до старика
  rationale: Передаёт возрастной меризм от младших к старшим, сохраняя конкретность существительных исходного текста.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: вплоть до быка, овцы и осла
  rationale: «Вплоть до» естественно по-русски продолжает охватывающий ряд и показывает, что под уничтожение подпал также домашний скот.
- source_word: לְפִי חָרֶב
  choice: поразив остриём меча
  rationale: Сохраняет образ «острия меча» и одновременно ясно выражает инструментальный смысл идиомы — умерщвление мечом.
theological_decisions:
- issue: Передача חרם в контексте военного суда
  choice: предали заклятию
  alternative: полностью уничтожили; обрекли на уничтожение
  rationale: В исходном тексте употреблён специальный термин херема, а не общий глагол уничтожения. Выбор сохраняет идею безвозвратного предания на уничтожение, не смягчая жестокости описанного и не добавляя в основной текст конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Техническое «предали заклятию» оставлено ради смысловой точности и разъяснено сноской; синтаксис сохраняет нарастающий охват еврейских меризмов.
