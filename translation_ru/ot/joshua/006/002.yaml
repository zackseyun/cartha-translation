base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: ru
  text: 'И сказал Господь Иисусу Навину: «Смотри, Я отдал в твои руки Иерихон, его царя и могучих воинов[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доблестных воинов»; еврейское выражение соединяет значения силы, воинской доблести и боеспособности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона в библейском тексте; сохраняет достоинство стиля без спорной реконструкции произношения в основном тексте.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет последовательное повествовательное движение еврейской конструкции с waw-consecutive.
- source_word: רְאֵה
  choice: Смотри
  rationale: Передаёт императив как непосредственное привлечение внимания; звучит естественнее в современной русской прямой речи, чем архаическое «вот» или «узри».
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Совершенный вид сохраняет представленность действия как уже совершённого с точки зрения Говорящего и подчёркивает несомненность обещанной победы.
- source_word: בְיָדְךָ
  choice: в твои руки
  rationale: Сохраняет прозрачный для русского читателя древнееврейский образ передачи во власть адресата.
- source_word: יְרִיחוֹ
  choice: Иерихон
  rationale: Устоявшаяся русская форма географического названия.
- source_word: מַלְכָּהּ
  choice: его царя
  rationale: Местоимение относится к городу Иерихону; русский грамматический род требует формы «его».
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: могучих воинов
  rationale: 'Передаёт оба смысловых компонента выражения: силу и воинскую доблесть, оставаясь естественным в современном русском языке.'
theological_decisions:
- issue: Значение перфекта נָתַתִּי до начала сражения
  choice: «Я отдал» — заявление о действии как уже совершённом
  alternative: «Я отдаю» или «Я отдам»
  rationale: Еврейский перфект представляет дарование победы как свершившийся факт с позиции Бога. Совершенный вид сохраняет напряжение между заявленным свершением и ещё предстоящей битвой, не превращая его в простое будущее обещание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому оригиналу, но естественен для обычного читателя. Имя Иисус Навин дано в традиционной русской форме.
