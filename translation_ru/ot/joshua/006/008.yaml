source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: ru
  text: И когда Иисус Навин сказал народу, семь священников, несших перед Яхве[b] семь труб из бараньих рогов[a], двинулись вперёд и затрубили в трубы. Ковчег завета Яхве следовал за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семь шофаров юбеля». Вероятнее всего, имеются в виду трубы из бараньих рогов; возможен также перевод «семь юбилейных труб».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «перед Яхве» можно также перевести: «в присутствии Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: И когда… сказал
  rationale: וַיְהִי вводит очередное событие повествования, а כֶּאֱמֹר имеет временной смысл «когда/после того как сказал». По-русски единая конструкция «И когда…» естественно передаёт последовательность без архаического «и было».
- source_word: הָעָם
  choice: народу
  rationale: Речь идёт о собравшемся израильском народе, к которому обращался Иисус Навин.
- source_word: נֹשְׂאִים
  choice: несших
  rationale: Причастие характеризует священников как несущих трубы; форма прошедшего времени согласуется с русским повествованием.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: семь труб из бараньих рогов
  rationale: שׁוֹפָר обозначает рог как сигнальный инструмент, а יוֹבֵל здесь, вероятнее всего, указывает на бараний рог. Формулировка передаёт и происхождение, и назначение предметов.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי может обозначать как пространственное положение «перед», так и пребывание «в присутствии». В контексте процессии основной текст сохраняет пространственный образ.
- source_word: עָבְרוּ
  choice: двинулись вперёд
  rationale: עבר здесь описывает продвижение участников процессии, а не переход через определённую границу.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: и затрубили в трубы
  rationale: תקע с שׁוֹפָר означает трубить в рог; это естественная русская формулировка.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Прямо и компактно передаёт еврейскую сопряжённую конструкцию, сохраняя связь ковчега с заветом Яхве.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: следовал за ними
  rationale: Причастие описывает продолжающееся движение ковчега позади священников; «следовал за ними» естественно передаёт этот процесс.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Положение священников לִפְנֵי יְהוָה
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: Основной вариант сохраняет пространственный смысл процессии, однако выражение также допускает смысл пребывания в Божьем присутствии; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Избегнут архаизм «и было», но сохранено начальное «И» как знак связи с предшествующим повествованием. Сноска [b] поставлена после всего предложения, хотя относится к выражению «перед Яхве»; для максимальной ясности в публикационной вёрстке её предпочтительно расположить непосредственно после этого выражения.
