  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: ru
  text: Они сожгли город и всё, что в нём было. Только серебро и золото, а также изделия[a] из бронзы и железа они поместили в сокровищницу дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды». Еврейское слово может широко обозначать предметы, утварь, орудия или сосуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: сожгли
  rationale: Глагол שׂרף означает «сжигать»; сочетание с בָאֵשׁ указывает на огонь как средство. Русское «сожгли» естественно и уже включает эту смысловую составляющую.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: и всё, что в нём было
  rationale: Оборот охватывает всё содержимое города; местоимение согласовано с русским словом «город».
- source_word: רַק
  choice: только
  rationale: Частица вводит исключение из только что описанного полного уничтожения.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: серебро и золото
  rationale: Названия металлов переданы без артиклей, что естественно для русского перечисления и не меняет определённости исходного текста.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: а также изделия из бронзы и железа
  rationale: כְּלֵי — широкое обозначение предметов, сосудов или принадлежностей; «изделия» сохраняет эту широту. נְחֹשֶׁת в данном контексте наиболее вероятно обозначает бронзу.
- source_word: נָתְנוּ
  choice: поместили
  rationale: נתן буквально имеет широкое значение «дать, положить»; при передаче ценностей в хранилище «поместили» точно и естественно.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: сокровищницу дома Яхве
  rationale: אוֹצָר здесь обозначает хранилище посвящённых ценностей, а בֵּית יְהוָה — святилище как «дом Яхве»; перевод не вводит анахроничное уточнение «храм».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; форма «Яхве» прямо передаёт тетраграмматон, не заменяя его титулом.
- issue: Назначение сохранённых металлов
  choice: в сокровищницу дома Яхве
  alternative: в сокровищницу, принадлежавшую дому Яхве
  rationale: Еврейская конструкция указывает на хранилище при доме Яхве. Краткая формулировка сохраняет культовое назначение ценностей без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис следует последовательности еврейского текста, но избегает неестественного для русского выражения «сожгли огнём». Маркер сноски поставлен непосредственно после слова, к которому относится примечание.
