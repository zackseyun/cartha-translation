revisions:
- from: Семь священников несли перед ковчегом Яхве семь труб из бараньих рогов[a] и шли, непрестанно трубя. Вооружённый отряд шёл впереди них, а замыкающий отряд — позади ковчега Яхве; шествие продолжалось под звуки труб.
  to: Семь священников несли перед ковчегом Яхве семь труб из бараньих рогов[a]; они шли и трубили в трубы. Вооружённые шли впереди них, а замыкающий отряд — позади ковчега Яхве; шли и трубили в трубы.
  rationale: Заменены усилительное «непрестанно» и описательное «шествие продолжалось под звуки труб» на прямое, современное и процессуально-длительное «шли и трубили в трубы». Нулевая множественная форма в заключительной части воспроизводит продолжение процессии и трубления, не навязывая спорное отнесение действия исключительно замыкающему отряду.
