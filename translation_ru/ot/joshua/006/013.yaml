base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: ru
  text: Семь священников несли перед ковчегом Яхве семь труб из бараньих рогов[a]; они шли и трубили в трубы. Вооружённые шли впереди них, а замыкающий отряд — позади ковчега Яхве; шли и трубили в трубы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «семь юбилейных труб» или «семь бараньих рогов». Еврейское выражение обозначает шофары — сигнальные трубы, сделанные из бараньих рогов или связанные с ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: труб из бараньих рогов
  rationale: שׁוֹפָר обозначает рог, используемый как сигнальный инструмент, а הַיֹּבְלִים связывает эти трубы с бараньими рогами. Формулировка передаёт и происхождение инструмента, и его функцию, оставаясь понятной современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: הֹלְכִים הָלוֹךְ
  choice: шли, непрестанно трубя
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом придаёт действию продолжительный характер; по-русски это естественно выражено через непрерывность движения и трубного звука.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: трубя
  rationale: Глагол תקע в сочетании с שׁוֹפָר означает трубить в рог; деепричастие передаёт одновременность и длительность действия.
- source_word: הֶחָלוּץ
  choice: вооружённый отряд
  rationale: Слово обозначает снаряжённых для боя людей, идущих в передней части процессии; собирательное «отряд» соответствует контексту.
- source_word: לִפְנֵיהֶם
  choice: впереди них
  rationale: Сохранено пространственное значение выражения; местоимение естественно относится к названным перед этим священникам.
- source_word: הַמְאַסֵּף
  choice: замыкающий отряд
  rationale: В военном и процессионном контексте причастие обозначает тех, кто замыкает шествие.
- source_word: אַחֲרֵי אֲרוֹן יְהוָה
  choice: позади ковчега Яхве
  rationale: Пространственное «позади» ясно передаёт расположение частей процессии.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: шествие продолжалось под звуки труб
  rationale: Фраза описывает продолжающиеся движение и трубление. Безличная по смыслу русская конструкция избегает неестественного повтора и не приписывает трубление исключительно замыкающему отряду, хотя ближайшее грамматическое согласование допускает такое прочтение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Кто трубит в заключительной части стиха
  choice: шествие продолжалось под звуки труб
  alternative: замыкающий отряд шёл и трубил
  rationale: Ближайшая грамматическая форма единственного числа может относиться к собирательному הַמְאַסֵּף, однако контекст называет трубящими священников. Выбранная формулировка сохраняет продолжающийся характер действия, не разрешая эту напряжённость в пользу одного исполнителя.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Военная и культовая лексика передана общеупотребительными словами; длительность процессии выражена естественно, без тяжеловесного буквального повтора.
