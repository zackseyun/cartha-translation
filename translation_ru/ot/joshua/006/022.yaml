base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: ru
  text: 'А двум мужчинам, разведавшим землю, Иисус Навин сказал: «Войдите в дом проститутки и выведите оттуда женщину и всё, что у неё, как вы ей поклялись».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: А двум мужчинам
  rationale: Сочетание וְ с לְ вводит адресатов речи и продолжает повествование; «А двум мужчинам» естественно передаёт переход и косвенное дополнение.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: высматривавшим землю
  rationale: Причастие от רגל обозначает разведывательное обследование местности; «высматривать» сохраняет смысл разведки без современного политического оттенка слова «шпионить».
- source_word: בֹּאוּ בֵּית
  choice: Войдите в дом
  rationale: Императив בוא в сочетании с בֵּית естественно передаётся по-русски как приказ войти в дом.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: женщины-блудницы
  rationale: זוֹנָה прямо обозначает женщину, занимающуюся проституцией; сложное наименование сохраняет оба элемента еврейского выражения и звучит достойно в библейском повествовании.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: и выведите оттуда
  rationale: Порода Hiphil глагола יצא имеет каузативное значение «вывести», а מִשָּׁם — «оттуда».
- source_word: אֶת הָאִשָּׁה
  choice: эту женщину
  rationale: Перевод сохраняет повтор существительного из еврейского текста; указательное «эту» естественно связывает его с уже названной женщиной.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: и всех, кто у неё
  rationale: Контекст клятвы в Нав 2:12–13 указывает прежде всего на людей её семьи; при этом буквальная конструкция остаётся широкой, что отмечено в сноске.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: как вы ей поклялись
  rationale: Сравнительный оборот связывает повеление с данной женщине клятвой; русский порядок слов естественен и сохраняет адресата.
theological_decisions:
- issue: Значение זוֹנָה применительно к Раав
  choice: блудница
  alternative: проститутка
  rationale: Еврейское слово прямо указывает на проституцию. «Блудница» точно и понятно в библейском регистре, тогда как «проститутка» звучит более резко и разговорно-современно; эвфемистическое толкование не вводится.
- issue: Объём выражения כָּל אֲשֶׁר לָהּ
  choice: всех, кто у неё
  alternative: всё, что у неё
  rationale: Ближайший контекст данной Раав клятвы перечисляет её родных, поэтому личная форма уместна; сноска сохраняет грамматически возможное более широкое прочтение, включающее всё ей принадлежащее.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис слегка формальный, но понятный; сохранены повтор «женщина» и прямое обозначение рода занятий Раав.
