revisions:
- from: 'А двум мужчинам, высматривавшим землю, Иисус Навин сказал: «Войдите в дом женщины-блудницы и выведите оттуда эту женщину и всех, кто у неё[a], как вы ей поклялись».'
  to: 'А двум мужчинам, разведавшим землю, Иисус Навин сказал: «Войдите в дом проститутки и выведите оттуда женщину и всё, что у неё, как вы ей поклялись».'
  rationale: Основной текст исправлен так, чтобы сохранить широкий объём כָּל אֲשֶׁר לָהּ без контекстуального сужения до родственников. Сноска больше не нужна, поскольку «всё, что у неё» прямо и естественно передаёт широту еврейского выражения. «Проститутки» точно передаёт זוֹנָה в современном литературном русском, а повторное «женщину» отражает повтор הָאִשָּׁה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:10:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка: וְאֶת כָּל אֲשֶׁר לָהּ означает «и всё, что у неё / принадлежит ей» и грамматически не ограничено людьми. Формулировка «и всех, кто у неё» сужает исходный текст, а сноска не может компенсировать такое сужение основного текста.'
  naturalness: «Высматривавшим землю» менее естественно для уже завершённой разведки; «разведавшим землю» ясно и литературно. «Женщины-блудницы» звучит неестественно и тавтологично в современном русском. «Дом проститутки» — естественное, ясное и неэвфемистическое обозначение.
  terminology: זוֹנָה следует передать как «проститутка». Это современное литературное слово, прямо называющее значение оригинала. Повтор הָאִשָּׁה во второй части предложения сохранён словом «женщину».
  issues:
  - severity: medium
    issue: Сужение כָּל אֲשֶׁר לָהּ до людей
    rationale: «Всех, кто у неё» исключает имущество и иные референты, тогда как еврейское «всё, что у неё» намеренно широко. Контекст не даёт основания менять грамматический объём выражения в основном тексте.
  - severity: low
    issue: Неудачная формулировка «женщины-блудницы»
    rationale: Она стилистически тяжеловесна и избыточно повторяет женский род; при этом «блудница» менее нейтрально и современно, чем прямое «проститутка».
  - severity: low
    issue: «Высматривавшим землю»
    rationale: Глагол «высматривать» обычно означает выискивать взглядом, а не проводить разведку территории; контекст требует обозначения ранее выполненной разведки.
  revised_text: 'А двум мужчинам, разведавшим землю, Иисус Навин сказал: «Войдите в дом проститутки и выведите оттуда женщину и всё, что у неё, как вы ей поклялись».'
