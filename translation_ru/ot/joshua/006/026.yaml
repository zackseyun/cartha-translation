base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: ru
  text: 'В то время Иисус Навин взял с народа клятву[a], сказав: «Проклят перед Яхве тот, кто встанет и отстроит этот город — Иерихон! Ценой своего первенца он заложит его основание[b], и ценой своего младшего установит его ворота».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставил народ поклясться», «наложил на народ клятвенное обязательство». Еврейская форма глагола каузативна: Иисус Навин побудил присутствующих принести клятву или поставил их под клятвенное обязательство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «своим первенцем заложит её основание и своим младшим установит её ворота». В контексте проклятия это, вероятно, означает утрату детей как цену восстановления города; точный характер этой связи не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: связал народ клятвой
  rationale: Каузативная порода глагола שׁבע означает, что Иисус Навин заставил присутствующих поклясться или наложил на них клятвенное обязательство. «Народ» восполняет подразумеваемый объект из контекста.
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественная и точная передача устойчивого временного выражения.
- source_word: אָרוּר הָאִישׁ
  choice: Проклят ... тот
  rationale: Сохраняет формулу проклятия, а «тот» естественно передаёт обобщённое значение еврейского существительного мужского рода, не ограничивая высказывание конкретным человеком.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко передаёт значение нахождения перед лицом или в присутствии Яхве и сохраняет личное имя Бога.
- source_word: יָקוּם וּבָנָה
  choice: встанет и отстроит
  rationale: Сохраняет два еврейских глагола; «отстроит» ясно указывает на восстановление только что разрушенного города.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: этот город — Иерихон
  rationale: Тире естественно передаёт пояснительное приложение оригинала.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: ценой своего первенца ... ценой своего младшего сына
  rationale: Предлог ב в контексте проклятия, вероятнее всего, выражает цену или утрату. Формулировка не уточняет механизм смерти; «сына» во второй части делает семейный параллелизм прозрачным по-русски.
- source_word: יְיַסְּדֶנָּה
  choice: заложит его основание
  rationale: Передаёт конкретный строительный смысл глагола יסד; местоимение относится к городу.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: поставит его ворота
  rationale: В контексте укреплённого города דלתות обозначает створки или сооружение городских ворот; выбранная фраза естественна и сохраняет строительный образ.
theological_decisions:
- issue: Характер слов Иисуса Навина
  choice: Торжественное проклятие пред Яхве, подкреплённое клятвой народа
  alternative: Личное пожелание Иисуса Навина или исключительно гражданский запрет
  rationale: Формула «проклят пред Яхве» придаёт словам религиозно-обязательную силу, но перевод не добавляет отсутствующего в стихе объяснения того, как именно действует проклятие.
- issue: Смысл упоминания первенца и младшего сына
  choice: Сыновья будут утрачены в связи с началом и завершением восстановления города
  alternative: Они будут намеренно принесены в жертву при строительстве
  rationale: Оригинал связывает их с закладкой основания и установкой ворот, однако прямо не называет ни жертвоприношения, ни конкретного механизма смерти. «Ценой» передаёт тяжесть утраты, не устраняя эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены формула проклятия, имя Яхве и параллелизм двух этапов строительства. Архаичное «пред» уместно в краткой сакрально-юридической формуле; остальная лексика современна.
