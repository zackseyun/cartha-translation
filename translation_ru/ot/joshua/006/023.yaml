  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: ru
  text: И молодые разведчики вошли и вывели Раав, её отца, её мать, её братьев и всех, кто был у неё[a]. Они вывели всех её родственников[b] и поместили их вне стана Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё, что ей принадлежало». Еврейское выражение может включать не только людей, хотя в данном контексте, вероятно, прежде всего имеются в виду домашние Раав.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все её семьи»; возможно также: «все её роды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: молодые люди
  rationale: נַעַר обычно обозначает юношу или молодого мужчину; здесь речь идёт о двух разведчиках, а не о слугах вообще.
- source_word: הַמְרַגְּלִים
  choice: разведчики
  rationale: Причастие от רגל уточняет, о каких молодых людях идёт речь. «Разведчики» прямо передаёт значение без добавления отсутствующего здесь дополнения «землю».
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: вывели
  rationale: Порода hифиль глагола יצא означает «вывести, заставить выйти». Повтор «вывели» сохраняет повторение еврейского глагола.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: всех, кто был у неё
  rationale: Фраза буквально охватывает всё принадлежавшее ей, но в контексте спасения прежде всего указывает на людей её дома. Формулировка сохраняет некоторую широту выражения.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: всех её родственников
  rationale: מִשְׁפָּחָה может означать семью, род или более широкий круг родичей. После перечисления ближайших членов семьи «родственников» естественно указывает на расширенный семейный круг.
- source_word: וַיַּנִּיחוּם
  choice: оставили их
  rationale: Hифиль глагола נוח здесь может означать «поместить» или «оставить». «Оставили их» естественно описывает их размещение вне стана, не добавляя причины.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: за пределами стана Израиля
  rationale: Формулировка точно передаёт пространственное значение и сохраняет библейски dignified, но понятное современному читателю слово «стан».
theological_decisions:
- issue: Причина размещения Раав и её близких вне стана
  choice: Передать только пространственный факт, не объясняя его причины.
  alternative: Указать на ритуальное отделение, защитное содержание либо ожидание принятия в Израиль.
  rationale: Еврейский текст не сообщает причины такого размещения; её добавление устранило бы намеренную повествовательную и богословскую недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Тире выделяют приложение «разведчики». Сохранён повтор глагола «вывели», присутствующий в еврейском тексте; причина нахождения вне стана не уточняется.
