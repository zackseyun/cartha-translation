source:
  edition: WLC
  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: ru
  text: Вооружённые воины шли перед священниками, трубившими в рога[a], а замыкающий отряд шёл позади ковчега; при этом в рога трубили не переставая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. шофарот — сигнальные рога, обычно изготовлявшиеся из бараньего рога.
    reason: Уточняет вид музыкально-сигнального инструмента, не перегружая основной текст транслитерацией.
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: вооружённые воины
  rationale: Существительное обозначает вооружённую часть войска, идущую впереди. Этот вариант естественен по-русски и ясно передаёт военный характер отряда.
- source_word: הֹלֵךְ
  choice: шли / шёл
  rationale: Причастная форма описывает продолжающееся движение процессии; русское прошедшее несовершенного вида передаёт длительность действия.
- source_word: לִפְנֵי
  choice: перед
  rationale: Прямо передаёт пространственное расположение участников процессии.
- source_word: הַכֹּהֲנִים
  choice: священниками
  rationale: Обычный и точный русский эквивалент в культовом контексте.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: трубившими в рога
  rationale: Причастный оборот естественно показывает, что священники продолжали трубить во время движения; «рога» точнее общего слова «трубы» передаёт вид инструмента.
- source_word: הַמְאַסֵּף
  choice: замыкающий отряд
  rationale: Термин обозначает часть строя, следующую сзади; вариант передаёт и положение, и коллективный военный смысл.
- source_word: אַחֲרֵי
  choice: позади
  rationale: Передаёт пространственное значение в описании порядка шествия.
- source_word: הָאָרוֹן
  choice: ковчега
  rationale: Контекст уже определяет ковчег, поэтому добавление «завета» в этом стихе не требуется.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: при этом в рога трубили не переставая
  rationale: Конструкция выражает продолжающееся действие. Безличная формулировка сохраняет некоторую невыраженность деятеля в итоговом описании и не навязывает, что трубил именно замыкающий отряд.
- source_word: בַּשּׁוֹפָרוֹת
  choice: в рога
  rationale: Сохраняет конкретный образ древнееврейского шофара и лексическую последовательность внутри стиха.
