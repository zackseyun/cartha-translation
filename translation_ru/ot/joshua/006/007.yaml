  rationale: Редакция устраняет добавленную конкретизацию «отряд», сохраняя исходную двусмысленность между вооружёнными людьми вообще и передовым подразделением. Альтернативное функциональное понимание перенесено в сноску. Порядок приказов, положение воинов перед ковчегом и передача имени יהוה сохранены.
