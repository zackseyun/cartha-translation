base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: ru
  text: 'И они сказали народу: «Идите вперёд, обойдите город кругом, а вооружённые воины[a] пусть пройдут перед ковчегом Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передовой отряд», то есть вооружённые воины, идущие впереди ковчега.'
    reason: Лексема חָלוּץ обозначает вооружённых, подготовленных к бою людей; в данном контексте она может также указывать на их функцию как передовой части шествия.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Последовательная глагольная форма продолжает повествование; такой перевод сохраняет связь с предыдущим действием и передаёт множественное число без уточнения не названного здесь субъекта.
- source_word: אֶל־הָעָם
  choice: народу
  rationale: עָם обычно означает «народ». Военный контекст допускает понимание собравшихся сил, но не требует сужать значение до «войска».
- source_word: עִבְרוּ
  choice: идите вперёд
  rationale: В данном шествии עבר обозначает движение дальше или вперёд, а не переход через реку либо иную границу.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: и обойдите город кругом
  rationale: סבב означает движение вокруг города. Добавление «кругом» устраняет возможное русское понимание «обойдите» как «миновать, не заходя».
- source_word: וְהֶחָלוּץ
  choice: вооружённый отряд
  rationale: חָלוּץ обозначает вооружённых и подготовленных к бою людей, здесь выступающих впереди процессии. «Отряд» согласуется с единственным числом последующего глагола; функциональное значение «передовой отряд» отмечено в сноске.
- source_word: יַעֲבֹר
  choice: пусть идёт
  rationale: Имперфект имеет здесь побудительно-предписывающую силу после повелений; русская конструкция с «пусть» естественно её передаёт.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: перед ковчегом Яхве
  rationale: לִפְנֵי указывает на положение впереди ковчега, а имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное божественное имя, а не титул. «Яхве» сохраняет личное имя и представляет принятую в современной русской библеистике реконструкцию произношения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Формулировка сохраняет последовательность двух приказов и не уточняет, кто именно говорит, поскольку субъект в данном стихе прямо не назван.
