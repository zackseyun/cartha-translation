  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: ru
  text: Но вы берегитесь того, что предано уничтожению[a], чтобы, взяв что-либо из преданного уничтожению, самим не подпасть под уничтожение[b], не сделать стан Израиля преданным уничтожению и не навлечь на него беду[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское חֵרֶם (хе́рем) — то, что безвозвратно посвящено Богу; в данном контексте это означает предание уничтожению. Традиционные варианты: «заклятое» или «преданное заклятию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы не подвергнуть себя заклятию»; буквально глагол может означать «предать уничтожению». В данном контексте речь, вероятно, о том, что нарушители сами подпадут под тот же суд.'
    reason: alternative_reading
  - marker: c
    text: Выражение «навлечь ... беду» связано с темой греха Ахана и его последствий для Израиля (Нав. 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Но вы
  rationale: Союз с ограничительной частицей вводит подчёркнутое противопоставление; самостоятельное местоимение выделяет адресатов. Краткое «Но вы» естественно передаёт оба оттенка.
- source_word: שִׁמְרוּ מִן־הַחֵרֶם
  choice: остерегайтесь того, что предано уничтожению
  rationale: שמר с מן выражает предостережение и требование держаться в стороне. Единственное собирательное חֵרֶם сохранено оборотом «того, что», без неоправданного сведения к отдельным предметам.
- source_word: הַחֵרֶם
  choice: то, что предано уничтожению
  rationale: В данном контексте חֵרֶם обозначает людей или имущество, безвозвратно посвящённые Богу посредством уничтожения. Описательный перевод понятнее технических «заклятие» и «преданное заклятию».
- source_word: פֶּן תַּחֲרִימוּ
  choice: чтобы вам самим не оказаться преданными уничтожению
  rationale: פֶּן вводит предостережение о нежелательном результате. Форма חרם допускает буквальное «не предадите уничтожению», но контекст указывает на приобретение самими израильтянами статуса חֵרֶם; «оказаться» естественно выражает этот результат, сохраняя смысловую напряжённость в примечании.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: если возьмёте что-либо из преданного уничтожению
  rationale: В еврейском соединительная конструкция после פֶּן связывает опасный результат с запрещённым действием. Условное «если» ясно передаёт эту зависимость в современном русском; «что-либо» естественно выражает взятие части из целого.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: и тем самым не обречь стан Израиля на уничтожение
  rationale: שׂים с дополнением и לְחֵרֶם означает привести стан в соответствующее состояние. «Обречь ... на уничтожение» передаёт причинный результат и позволяет избежать тяжёлого повторения.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: и не навлечь на него беду
  rationale: עכר означает причинить беду, навлечь несчастье. Местоимение мужского рода естественно соотносится со словом «стан».
theological_decisions:
- issue: Значение חֵרֶם в контексте суда над Иерихоном
  choice: предано уничтожению
  alternative: заклятое; преданное заклятию; находящееся под запретом
  rationale: Термин обозначает безвозвратное посвящение Богу, здесь осуществляемое через уничтожение. Выбранная формулировка передаёт и посвящённость, и предписанный исход, не вводя представления о магическом проклятии.
- issue: Смысл תַּחֲרִימוּ применительно к Израилю
  choice: вам самим не оказаться преданными уничтожению
  alternative: чтобы вы не предали себя уничтожению; чтобы не подвергнуть себя заклятию
  rationale: Контекст допускает формально причинное прочтение, но основной смысл состоит в том, что присвоившие חֵרֶם сами подпадут под тот же статус и суд. Формулировка не уточняет сверх текста, кем именно и посредством какого отдельного акта этот статус будет приведён в исполнение.
- issue: Общинные последствия нарушения
  choice: обречь стан Израиля на уничтожение и навлечь на него беду
  alternative: подвергнуть стан Израиля заклятию и причинить ему беду
  rationale: Текст прямо распространяет последствия поступка отдельных людей на весь стан. Перевод сохраняет эту корпоративную ответственность, не объясняя её какой-либо позднейшей богословской системой.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Сохранён собирательный характер חֵרֶם через «то, что», а повторения смягчены там, где русский синтаксис иначе становится тяжеловесным. «Стан Израиля» выбрано вместо более бытового «лагерь Израиля» ради историко-повествовательного регистра.
