    rationale: '«Если возьмёте» вводит самостоятельное условие, а инфинитивы «не обречь» и «не навлечь» становятся целями при «чтобы». В еврейском после פֶּן следует цепочка глагольных форм, описывающая опасный исход: адресаты подпадут под херем, возьмут от херема, сделают стан херемом и причинят ему бедствие.'
