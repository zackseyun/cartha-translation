    rationale: Это возможно как близкое к форме глагола толкование, но по-русски звучит как преднамеренное действие над собой и менее удачно отражает контекстуальный результат. Нейтральнее отметить вариант «не подвергли себя заклятию / не сделали себя заклятыми».
