source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ אֶת הָ/עִ֜יר בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ פַּ֣עַם אַחַ֔ת וַ/יָּשֻׁ֖בוּ הַֽ/מַּחֲנֶ֑ה כֹּ֥ה עָשׂ֖וּ שֵׁ֥שֶׁת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: ru
  text: На второй день они один раз обошли город[a] и вернулись в лагерь. Так они делали шесть дней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обошли город кругом».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Так они делали шесть дней», то есть повторяли этот порядок на протяжении шести дней.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: они обошли
  rationale: Глагол סבב обозначает движение вокруг чего-либо. «Обошли» естественно передаёт завершённый обход и не добавляет отсутствующего в тексте военного оттенка.
- source_word: אֶת הָעִיר
  choice: город
  rationale: עִיר обычно означает «город»; здесь речь идёт об Иерихоне.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: На второй день
  rationale: Прямой и естественный русский эквивалент временного оборота.
- source_word: פַּעַם אַחַת
  choice: один раз
  rationale: Буквально «один раз»; такая форма яснее в сочетании с «обошли», чем потенциально двусмысленное «однажды».
- source_word: וַיָּשֻׁבוּ
  choice: и вернулись
  rationale: שׁוב в данном контексте означает возвращение после обхода.
- source_word: הַמַּחֲנֶה
  choice: в лагерь
  rationale: מַחֲנֶה означает «лагерь»; русский язык естественно выражает направление предлогом «в».
- source_word: כֹּה עָשׂוּ
  choice: Так они делали
  rationale: 'Сочетание כֹּה с עשה указывает на образ действия: они повторяли описанный порядок.'
- source_word: שֵׁשֶׁת יָמִים
  choice: шесть дней
  rationale: Беспредложная форма сохраняет краткость еврейского текста и в русском контексте ясно выражает продолжительность.
