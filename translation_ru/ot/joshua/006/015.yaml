base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: ru
  text: На седьмой день они встали рано, едва занялась заря, и семь раз обошли город в том же порядке. Только в тот день они обошли город семь раз.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: На седьмой день
  rationale: Естественная русская передача еврейской повествовательной формулы; буквальное «И было» здесь утяжелило бы современный текст, не добавляя смысла.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: едва занялась заря
  rationale: Передаёт раннее начало рассвета и образ восходящей зари естественным литературным русским языком.
- source_word: וַיָּסֹבּוּ אֶת־הָעִיר
  choice: обошли город
  rationale: Глагол סבב означает движение вокруг; «обошли» точно и естественно, тогда как «маршировали вокруг» добавляло бы военную окраску, не выраженную самим глаголом.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: в том же порядке
  rationale: В контексте имеется в виду ранее установленный способ или распорядок обхода; «в том же порядке» ясно связывает действие с предыдущими днями.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: Только в тот день
  rationale: 'Сохраняет эмфатическое ограничение: семь обходов были совершены лишь в этот день.'
theological_decisions: []
