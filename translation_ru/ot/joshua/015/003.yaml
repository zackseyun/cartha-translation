  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: ru
  text: Затем граница шла к югу, к подъёму Акраввим[a], шла к Цину, поднималась с юга к Кадеш-Барнеа[b], миновала Хецрон, поднималась к Аддару и поворачивала к Карке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Акраввим» связано с еврейским словом, означающим «скорпионы». Здесь оно передано как географическое имя.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «поднималась южнее Кадеш-Барнеа» или «поднималась с южной стороны Кадеш-Барнеа». Еврейское выражение допускает как направительное, так и локативное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: Затем граница шла
  rationale: В описании рубежей глагол изображает дальнейшее прохождение пограничной линии. Слово «граница» ясно восстанавливается из контекста, а «шла» естественно передаёт движение линии по местности.
- source_word: אֶל מִנֶּגֶב
  choice: к югу
  rationale: Сочетание указывает направление дальнейшего прохождения границы; русское «к югу» сохраняет направительное значение.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: к подъёму Акраввим
  rationale: מַעֲלֵה обозначает подъём или ведущую вверх дорогу. עַקְרַבִּים здесь является географическим названием, поэтому оно транслитерировано, а его нарицательное значение вынесено в сноску.
- source_word: וְעָבַר צִנָה
  choice: проходила к Цину
  rationale: Направительная форма צִנָה означает движение к Цину; «проходила к» передаёт формулу описания границы, не уточняя без достаточных оснований, пересекала ли она сам населённый пункт.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: поднималась с юга к Кадес-Барне
  rationale: 'Передано наиболее прямое направительное прочтение: граница поднималась с южной стороны к Кадес-Барне. Возможное локативное понимание сохранено в сноске.'
- source_word: וְעָבַר חֶצְרוֹן
  choice: миновала Хецрон
  rationale: В пограничном маршруте עבר может означать прохождение мимо, через или далее за ориентиром. «Миновала» естественно передаёт продвижение границы, не навязывая точной траектории внутри поселения.
- source_word: וְעָלָה אַדָּרָה
  choice: поднималась к Аддару
  rationale: Направительная форма אַדָּרָה указывает движение к географическому пункту Аддар.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: поворачивала к Карке
  rationale: נסב в описании рубежа обозначает поворот линии, а направительная форма הַקַּרְקָעָה — движение к месту Карка.
