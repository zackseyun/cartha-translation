  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: ru
  text: 'Халеву, сыну Иефуннии, он дал удел среди сынов Иуды, по повелению Яхве[a], данному Иисусу Навину: Кирьят-Арбу (Арба был отцом Анака[b]), то есть Хеврон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «по слову Яхве». Буквально по-еврейски: «по устам Яхве».'
    reason: lexical_alternative
  - marker: b
    text: Слово «отец» здесь может также означать «предок» или «основатель».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: Халеву, сыну Иефуннии
  rationale: Сохранена соединительная связь с контекстом без тяжеловесного начального «И»; личные имена переданы в узнаваемой русской библейской форме.
- source_word: נָתַן חֵלֶק
  choice: он дал удел
  rationale: Местоимение сохраняет невыраженный в еврейском тексте субъект, а «удел» естественно передаёт земельную долю в контексте распределения территории.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: среди сынов Иуды
  rationale: Формулировка близка к еврейскому выражению и сохраняет родоплеменное обозначение.
- source_word: אֶל פִּי יְהוָה לִיהוֹשֻׁעַ
  choice: по повелению Яхве Иисусу Навину[a]
  rationale: Идиома «по устам» естественно передана как «по повелению»; дательный падеж показывает, что повеление было дано Иисусу Навину. Альтернативный оттенок «по слову» отмечен в сноске.
- source_word: קִרְיַת אַרְבַּע
  choice: Кирьят-Арбу
  rationale: Название места транслитерировано и поставлено в винительный падеж как прямое дополнение к «дал».
- source_word: אֲבִי הָעֲנָק
  choice: Арба был отцом Анака[b]
  rationale: Скобочное пояснение ясно связывает определение «отец Анака» с Арбой, а не с городом; возможный более широкий смысл слова «отец» сохранён в сноске.
- source_word: הִיא חֶבְרוֹן
  choice: то есть Хеврон
  rationale: Естественная русская формула отождествления прежнего названия города с Хевроном.
theological_decisions:
- issue: Кто является невыраженным субъектом глагола נָתַן («дал»)
  choice: 'Субъект оставлен неопределённым: «он дал».'
  alternative: Уточнить субъект как «Иисус Навин дал» или «Яхве дал».
  rationale: Еврейский текст не называет субъекта прямо. Его явное отождествление с Иисусом Навином или Яхве устранило бы подлинную неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные русские формы Халев, Иефунния, Иисус Навин, Иуда и Хеврон; имя Яхве передано как личное имя. Синтаксис сделан ясным, но неоднозначность невыраженного субъекта намеренно не устранена.
