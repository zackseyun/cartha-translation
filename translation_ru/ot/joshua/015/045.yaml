  text: Екрон[a] с зависевшими от него городами и селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и его дочери, и его селения». «Дочери» — еврейское обозначение зависимых городов или поселений, принадлежавших более крупному городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Екрон
  rationale: Традиционная русская передача еврейского топонима; собственное имя транслитерируется, а не переводится.
- source_word: וּבְנֹתֶיהָ
  choice: с зависевшими от него городами
  rationale: Буквально «и его дочерьми». В территориальных перечнях בנות — устойчивое обозначение зависимых от главного города поселений. Формулировка сохраняет отношение подчинённости и естественно звучит по-русски.
- source_word: וַחֲצֵרֶיהָ
  choice: и селениями
  rationale: В контексте распределения земли חצרים обозначает небольшие поселения, относящиеся к городскому центру. «Селения» ясно передаёт смысл, не навязывая более узкую современную административную категорию.
