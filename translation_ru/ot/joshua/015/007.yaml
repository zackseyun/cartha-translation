  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: ru
  text: И поднималась граница от долины Ахор к Девиру, затем поворачивала на север, к Галгалу[a], что напротив подъёма Адуммим, расположенного к югу от вади[b]. Далее граница проходила к водам Эн-Шемеша, а заканчивалась у Эн-Рогела[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Галгала». Еврейское выражение может обозначать как направление к этому месту, так и достижение его линией границы.'
    reason: lexical_alternative
  - marker: b
    text: Вади — обычно сухое русло, которое наполняется водой сезонно или после дождей, а также образованный им овраг; еврейское נחל в подобных топографических описаниях часто имеет именно такой смысл.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «и выходы её были к Эн-Рогелу». В еврейском тексте употреблена форма множественного числа, обозначающая окончание или конечный участок границы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: И поднималась граница
  rationale: В описаниях границ עלה обозначает движение вверх, нередко с учётом рельефа. «Поднималась граница» естественно для русского топографического описания и сохраняет этот оттенок.
- source_word: דְּבִרָה מֵעֵמֶק עָכוֹר
  choice: от долины Ахор к Девиру
  rationale: Направительное окончание -ה при названии Девир передаёт движение к месту; מִן указывает исходную точку — долину Ахор.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: затем поворачивала на север
  rationale: Сочетание פנה с указанием направления описывает поворот или обращённость линии границы; в данном контексте «поворачивала» наиболее естественно.
- source_word: אֶל הַגִּלְגָּל
  choice: к Галгалу
  rationale: Предлог אֶל допускает как движение к самому месту, так и направление в его сторону. Русское «к» сохраняет эту умеренную неоднозначность.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: что напротив подъёма Адуммим
  rationale: נֹכַח означает «напротив, перед лицом», а מַעֲלֶה — подъём или восходящий участок пути. Сочетание передано без превращения топографического обозначения в более конкретный объект.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: расположенного к югу от вади
  rationale: נֶגֶב здесь обозначает направление «юг», а נַחַל в таком ландшафте часто означает сезонное русло или овраг, для чего подходит заимствованное и понятное географическое слово «вади».
- source_word: וְעָבַר הַגְּבוּל
  choice: Далее граница проходила
  rationale: עבר в формулах межевания означает, что линия проходит или продолжается к следующему ориентиру; перевод не навязывает значение физического пересечения.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: к водам Эн-Шемеша
  rationale: מֵי буквально означает «воды». Название источника транслитерировано, а не переведено, чтобы сохранить его функцию как топонима.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: а заканчивалась у Эн-Рогела
  rationale: В описаниях границ תֹצָאוֹת обозначает окончание или конечный пункт. Идиоматическое русское единственное число передаёт смысл множественной еврейской формы без тяжеловесного буквализма.
