base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: ru
  text: Ашдод с зависимыми от него городами[a] и селениями; Газа с зависимыми от неё городами и селениями — до Египетского потока[b]; Великое море[c] и его берег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его дочери». В территориальных перечнях так называются города или поселения, относящиеся к главному городу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Египетского вади». Древнееврейское слово может обозначать сезонный водоток или сухое русло, наполняющееся после дождей.'
    reason: lexical_alternative
  - marker: c
    text: То есть Средиземное море.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: зависимые от него/неё города
  rationale: Буквально «её дочери»; в территориальных перечнях это устойчивое обозначение небольших городов, зависимых от главного города. Смысл передан ясно, без неестественной для современного русского языка буквальной метафоры.
- source_word: חֲצֵרֶיהָ
  choice: селения
  rationale: В данном географическом контексте слово обозначает небольшие поселения вне главного города. «Селения» позволяет отличить их от зависимых городов.
- source_word: נַחַל מִצְרָיִם
  choice: Египетский поток
  rationale: נַחַל может обозначать поток, русло или сезонный водоток. Выбран традиционно понятный русский эквивалент, сохраняющий значение пограничного топонима.
- source_word: הַיָּם הַגָּדוֹל
  choice: Великое море
  rationale: Библейское географическое название Средиземного моря передано близко к форме древнееврейского выражения; пояснение дано в сноске.
- source_word: גְבוּל
  choice: границей служило
  rationale: Краткая и эллиптическая древнееврейская концовка выражает функцию моря как рубежа территории. Русская формулировка делает синтаксическую связь ясной, не добавляя нового содержания.
- source_word: עַד
  choice: до
  rationale: Естественный современный русский предлог для обозначения предела территории.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Ашдод / Газа
  rationale: Использованы закрепившиеся в русской библейской и географической традиции формы топонимов.
