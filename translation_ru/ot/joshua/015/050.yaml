lexical_decisions:
- source_word: עֲנָב
  choice: Анав
  rationale: Название города передано транслитерацией; форма «Анав» непосредственно отражает еврейское עֲנָב и соответствует русской библейской традиции.
- source_word: אֶשְׁתְּמֹה
  choice: Эштемо
  rationale: Топоним передан транслитерацией по масоретской форме Эштемо; вариант «Эштемоа» связан с иной формой того же названия в других местах, но здесь текст WLC имеет אֶשְׁתְּמֹה.
- source_word: עָנִים
  choice: Аним
  rationale: Несмотря на внешнее сходство с формой множественного числа, слово функционирует как название города и потому не переводится, а транслитерируется.
- source_word: וְ
  choice: и
  rationale: Префиксальный союз соединяет последние названия в перечне; по нормам современного русского языка союз естественно ставится перед последним элементом.
