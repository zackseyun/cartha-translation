base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: ru
  text: Затем граница поднималась по долине Бен-Хинном к южному склону Иевуса[a] — то есть Иерусалима, — а оттуда поднималась к вершине горы, расположенной к западу[b] от долины Хинном, у северного края долины Рефаим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к плечу иевусея с южной стороны»; «плечо» употреблено здесь в топографическом смысле: «склон, бок возвышенности». «Иевус» передаёт обозначение места, которое далее отождествляется с Иерусалимом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в сторону моря» — обычное древнееврейское обозначение запада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: Затем граница поднималась
  rationale: В описании рубежа глагол עלה обозначает последовательное движение границы вверх; несовершенный вид естественен для русского повествовательного описания маршрута.
- source_word: גֵּי בֶן הִנֹּם
  choice: по долине Бен-Хинном
  rationale: Сохранено топонимическое имя Бен-Хинном; предлог передаёт прохождение линии по долине в направлении следующего ориентира.
- source_word: כֶּתֶף הַיְבוּסִי מִנֶּגֶב
  choice: к южному склону Иевусея
  rationale: כֶּתֶף буквально означает «плечо», но в топографическом контексте — бок или склон возвышенности. מִנֶּגֶב указывает на её южную сторону. Форма «Иевусея» сохраняет необычное обозначение еврейского текста, не подставляя прямо не названное слово «город».
- source_word: הִיא יְרוּשָׁלִָם
  choice: это Иерусалим
  rationale: Краткое поясняющее отождествление сохранено без расширения; еврейское местоимение женского рода может подразумевать местность или город.
- source_word: רֹאשׁ הָהָר
  choice: вершине горы
  rationale: Еврейская идиома «голова горы» естественно передаётся как «вершина горы».
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: расположенной к западу от долины Хинном
  rationale: Сочетание עַל־פְּנֵי выражает положение перед или напротив ориентира, а יָמָּה задаёт западное направление; русская формулировка ясно передаёт географическое отношение.
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: у северного края долины Рефаим
  rationale: בִּקְצֵה обозначает край или оконечность, а צָפֹנָה уточняет северное направление. Рефаим сохранено как имя долины.
