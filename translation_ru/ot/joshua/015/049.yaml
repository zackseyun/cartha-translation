base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/049.yaml
  text: and Dannah[a], and Kiriath-sannah (that is, Debir),
translation:
  language: ru
  text: и Данна, и Кириат-Санна (то есть Девир),
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַנָּה
  choice: Данна
  rationale: Название места передано транслитерацией в форме, соответствующей современному русскому библейскому употреблению.
- source_word: קִרְיַת סַנָּה
  choice: Кириат-Санна
  rationale: Составной топоним сохранён как единое имя и передан транслитерацией; первый компонент не переведён как «город», чтобы не затушевать форму названия.
- source_word: הִיא
  choice: то есть
  rationale: В данном перечислении местоименная связка отождествляет Кириат-Санну с Девиром; «то есть» естественно и ясно передаёт эту функцию по-русски.
- source_word: דְבִר
  choice: Девир
  rationale: Топоним передан в традиционной русской библейской форме; здесь это другое название Кириат-Санны.
- source_word: וְ
  choice: и
  rationale: Союз сохранён, поскольку он поддерживает структуру перечня городов.
