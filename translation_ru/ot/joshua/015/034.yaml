  text: Zanoah[a], En-gannim, Tappuah[c][b], and Enam.
translation:
  language: ru
  text: Заноах, Эн-Ганним[a], Таппуах[b] и Энам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Эн-Ганним», вероятно, означает «источник садов».
    reason: lexical_alternative
  - marker: b
    text: «Таппуах» — название места; соответствующее еврейское слово может также означать «яблоко» или плодовое дерево.
    reason: lexical_alternative
  - marker: c
    text: «Энам» — название места; в еврейском тексте оно употреблено с определённым артиклем и буквально может быть понято как «источники».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
  choice: Заноах
  rationale: Название города в перечне; передано русской транслитерацией, а не переведено.
- source_word: עֵין גַּנִּים
  choice: Эн-Ганним
  rationale: Составной топоним со значением «источник садов»; в основном тексте сохранён как имя собственное.
- source_word: תַּפּוּחַ
  choice: Таппуах
  rationale: Здесь слово служит названием места, хотя как нарицательное может обозначать яблоко или плодовое дерево.
- source_word: הָעֵינָם
  choice: Энам
  rationale: Топоним с еврейским определённым артиклем; передан как цельное имя собственное без отдельного воспроизведения артикля.
