  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: ru
  text: Удел, доставшийся по жребию племени потомков Иуды[b], по их родам[a], простирался до границы Эдома, до пустыни Цин — с южной стороны, от крайнего предела Темана[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «И был жребий племени потомков Иуды, по их родам: до границы Эдома…»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Иуды»; имеются в виду потомки Иуды, принадлежавшие к этому племени.'
    reason: cultural_note
  - marker: c
    text: 'Или: «от крайнего предела юга». Еврейское выражение может означать «от края Темана» (географического названия) или «от края юга».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Вот какой жребий выпал
  rationale: Формула естественно вводит описание доставшегося по жребию удела и сохраняет конкретный образ жребия, не заменяя его только словом «удел».
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: племени потомков Иуды
  rationale: מַטֶּה в данном административно-родовом контексте означает «племя», а בְּנֵי обозначает не непосредственных сыновей, а потомков Иуды.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте распределения земли מִשְׁפָּחָה означает родовое подразделение племени; «роды» звучит естественно и точнее современного бытового «семьи».
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: до границы Эдома
  rationale: Передаёт территориальный предел; «Эдом» сохраняет древнее географическое имя, не подменяя его поздней формой «Идумея».
- source_word: מִדְבַּר צִן
  choice: пустыни Цин
  rationale: מִדְבָּר здесь обозначает пустынную местность, а Цин является географическим названием.
- source_word: נֶגְבָּה
  choice: на юге
  rationale: Форма имеет направительно-местное значение; в этой фразе естественное русское выражение «на юге» не требует понимать слово как собственное имя Негев.
- source_word: מִקְצֵה תֵימָן
  choice: у самого южного края
  rationale: Передаёт вероятный смысл крайнего южного предела, сохраняя погранично-географическую функцию выражения.
