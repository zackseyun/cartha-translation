    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Нившан
  rationale: Собственное название передано транслитерацией; еврейский определённый артикль не включён в русскую форму топонима.
- source_word: עִיר הַמֶּלַח
  choice: Город Соли
  rationale: Прозрачное по смыслу название буквально означает «город соли»; перевод сохраняет значение топонима и его характер как собственного названия.
- source_word: עֵין גֶּדִי
  choice: Эйн-Геди
  rationale: Устоявшийся по структуре семитский топоним передан транслитерацией; его буквальное значение («источник козлёнка/молодого козла») в основном тексте не подменяет название места.
- source_word: עָרִים שֵׁשׁ
  choice: всего шесть городов
  rationale: Числовой итог списка передан прямо; «всего» естественно вводит итоговый подсчёт, а «города» соответствует обычному значению עָרִים в территориальном перечне.
- source_word: חַצְרֵיהֶן
  choice: с их селениями
  rationale: Слово обозначает меньшие, вероятно неукреплённые зависимые населённые пункты при названных городах; «селения» сохраняет широту значения.
- source_word: וְ
  choice: и
  rationale: Начальный союз сохранён, поскольку стих продолжает перечень предыдущего контекста; повторные союзы переданы естественно для русского перечисления.
