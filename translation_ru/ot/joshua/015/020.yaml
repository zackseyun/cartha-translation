  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/020.yaml
  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: ru
  text: Вот удел племени сынов Иуды по их родам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Таков удел племени сынов Иуды по их родам».'
    reason: Еврейская именная конструкция не содержит выраженной глагольной временной формы; возможен более явный итоговый перевод в настоящем времени.
lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное местоимение подводит итог описанию территории; русское «вот» естественно передаёт такой итоговый указательный оборот без добавления отсутствующей в еврейском глагольной временной формы.
- source_word: נַחֲלַת
  choice: удел
  rationale: В контексте распределения земли «удел» точно и естественно обозначает полученное во владение наследственное земельное наделение, сохраняя библейский оттенок.
- source_word: מַטֵּה
  choice: племени
  rationale: Здесь слово обозначает племя как основную родовую общность Израиля, а не свой буквальный смысл «посох».
- source_word: בְנֵי יְהוּדָה
  choice: сынов Иуды
  rationale: Формально сохраняет генеалогический и племенной оборот еврейского текста и остаётся понятным в современном русском языке.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В контексте земельного раздела מִשְׁפָּחָה обозначает родовые подразделения племени; «по их родам» передаёт также распределительное значение предлога לְ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Формула «вот удел» кратко и естественно завершает перечень границ и городов; «роды» точнее обычного «семьи» передаёт внутренние подразделения племени.
