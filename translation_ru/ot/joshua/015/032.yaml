  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: ru
  text: Леваоф, Шилхим, Аин и Риммон — всего двадцать девять городов с их селениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с их деревнями»; еврейское слово может обозначать небольшие поселения или селения, зависевшие от перечисленных городов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: Леваоф
  rationale: Название города передано традиционной русской транслитерацией. Начальный союз не воспроизведён отдельно, поскольку стих продолжает перечень, а в современном русском начальное «и» здесь звучало бы тяжеловесно.
- source_word: וְשִׁלְחִים
  choice: Шилхим
  rationale: Топоним передан транслитерацией, а не переведён как нарицательное слово.
- source_word: וְעַיִן
  choice: Аин
  rationale: В перечне городов это топоним; выбран привычный для русской библейской традиции облик имени.
- source_word: וְרִמּוֹן
  choice: Риммон
  rationale: В данном контексте слово обозначает город, поэтому передано как имя собственное, а не переведено в значении «гранат».
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: всего двадцать девять городов
  rationale: Итоговая формула перечня передана естественным современным русским оборотом с сохранением указанного в еврейском тексте числа.
- source_word: וְחַצְרֵיהֶן
  choice: с принадлежавшими им селениями
  rationale: חָצֵר в территориальных перечнях обозначает небольшие зависимые населённые пункты при перечисленных городах. Такая формулировка ясно выражает связь, заданную местоименным суффиксом.
