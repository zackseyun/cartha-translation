  text: Иармут, Одоллам, Сохо и Азека.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте дан простой перечень городов Иудеи: «Иармут, Одоллам, Сохо и Азека». В русских переводах и справочных изданиях написание этих названий может различаться, особенно названия Сохо (также Соко или Соха).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: Иармут
  rationale: Географическое название передано в традиционной русской библейской форме, соответствующей еврейскому топониму.
- source_word: וַ/עֲדֻלָּם
  choice: Одоллам
  rationale: Топоним передан в узнаваемой русской библейской форме; союз при перечислении естественно выражен перед последним элементом списка.
- source_word: שׂוֹכֹה
  choice: Сохо
  rationale: Топоним транслитерирован с еврейского; написание отражает согласные שׂ־כ и конечную гласную форму названия.
- source_word: וַ/עֲזֵקָה
  choice: и Азека
  rationale: Союз ו передан русским «и» перед последним названием, а топоним — в традиционной русской форме.
