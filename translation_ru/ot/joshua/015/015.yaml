  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: ru
  text: Оттуда он двинулся против жителей Девира[a]. (Прежде Девир назывался Кириаф-Сефер.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
