lexical_decisions:
- source_word: וַיַּעַל
  choice: он двинулся против
  rationale: Глагол עלה буквально означает «подниматься, идти вверх», но в данном военном контексте обозначает наступательное движение. «Двинулся против» естественно передаёт враждебную направленность, не усиливая значение до явного «напал».
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Обычное указательное наречие, обозначающее исходную точку движения.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: против жителей Девира
  rationale: יֹשְׁבֵי — «жители, обитатели»; предлог אֶל буквально указывает направление, а военный контекст позволяет естественно передать сочетание как «против жителей».
- source_word: דְּבִר
  choice: Девир
  rationale: Географическое название передано традиционной русской библейской формой.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Прежде Девир назывался
  rationale: לְפָנִים имеет временное значение «прежде, раньше». Русская конструкция кратко и естественно передаёт сообщение о прежнем названии города.
- source_word: קִרְיַת סֵפֶר
  choice: Кириаф-Сефер
  rationale: Топоним сохранён как имя собственное в традиционной русской передаче; возможное значение компонентов вынесено в примечание.
