  text: וּ/גְדֵר֕וֹת בֵּית דָּג֥וֹן וְ/נַעֲמָ֖ה וּ/מַקֵּדָ֑ה עָרִ֥ים שֵׁשׁ עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: ru
  text: Гедерот, Бейт-Дагон[a], Наама и Маккеда — шестнадцать городов с их селениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бейт-Дагон буквально означает «дом Дагона», но здесь это название места, поэтому оно передано транслитерацией.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: Гедерот
  rationale: Название места передано транслитерацией с еврейского; начальный союз естественно опущен в продолжении перечня.
- source_word: בֵּית דָּגוֹן
  choice: Бейт-Дагон
  rationale: Составной топоним передан транслитерацией, а не буквальным переводом; дефис показывает единство названия.
- source_word: וְ/נַעֲמָה
  choice: Наама
  rationale: Название места передано близкой к еврейскому звучанию русской транслитерацией.
- source_word: וּ/מַקֵּדָה
  choice: Маккеда
  rationale: Удвоенная согласная отражает сильный дагеш в еврейской форме и отличает транслитерацию от традиционного написания «Македа».
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: шестнадцать городов
  rationale: Прямо передаёт число и обычное для территориальных списков значение עִיר.
- source_word: וְ/חַצְרֵי/הֶן
  choice: с их селениями
  rationale: חָצֵר здесь обозначает зависимые небольшие поселения при перечисленных городах; «селения» сохраняет географико-административный смысл без излишней конкретизации.
theological_decisions: []
