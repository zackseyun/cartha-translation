  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: ru
  text: 'Города на краю владений колена сынов Иуды, в сторону границы Эдома, в Негеве[b], были: Кавцеил, Эдер и Ягур.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Негев» можно также перевести как «юг» или «южная область». Здесь, вероятно, имеется в виду определённая южная область владений Иуды.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: А вот города
  rationale: Оборот вводит перечень городов; такая формулировка естественно передаёт повествовательное וַיִּהְיוּ без ненужной тяжеловесности.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: на краю владений племени сынов Иуды
  rationale: מִקְצֵה обозначает край или оконечность; добавление «владений» ясно выражает территориальный контекст, а «племени сынов Иуды» сохраняет традиционное родоплеменное обозначение.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: по направлению к границе Эдома
  rationale: Предлог אֶל указывает на направленность к пограничной области и не обязательно утверждает непосредственное расположение на самой границе.
- source_word: בַּנֶּגְבָּה
  choice: в Негеве
  rationale: В данном географическом перечне נֶגֶב, вероятнее всего, обозначает конкретную южную область, хотя возможно и нарицательное значение «на юге».
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Кавцеил, Эдер и Ягур
  rationale: Географические названия переданы русской транслитерацией с учётом древнееврейского звучания.
