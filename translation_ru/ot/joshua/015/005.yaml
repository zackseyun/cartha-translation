  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: ru
  text: Восточной границей было Солёное море до устья Иордана. А северная граница начиналась от языка моря, от устья Иордана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: Солёное море
  rationale: Буквальная и устоявшаяся передача древнееврейского географического названия («море соли»).
- source_word: קְצֵה הַיַּרְדֵּן
  choice: устье Иордана
  rationale: Буквально «край/конец Иордана»; в данном пограничном описании имеется в виду место впадения Иордана в Солёное море.
- source_word: לְשׁוֹן הַיָּם
  choice: язык моря
  rationale: Сохранён конкретный географический образ исходного текста; вероятно, обозначает вытянутый залив или оконечность водоёма.
- source_word: לִפְאַת צָפוֹנָה
  choice: северная
  rationale: Естественная русская передача выражения «со стороны севера» в описании границы.
