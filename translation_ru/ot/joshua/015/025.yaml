  text: וְ/חָצ֤וֹר חֲדַתָּה֙ וּ/קְרִיּ֔וֹת חֶצְר֖וֹן הִ֥יא חָצֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: ru
  text: и Хацор-Хадатта[a], и Кериот-Хецрон (то есть Хацор)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Хацор, Хадатта и Кериот-Хецрон (то есть Хацор)», если חֲדַתָּה понимать как название отдельного города, а не как часть составного названия «Хацор-Хадатта».'
    reason: alternative_reading
  - marker: b
    text: Название «Кериот» можно также передать как «Кириот».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר
  choice: и Хацор
  rationale: Союз וְ передан как «и», а топоним חָצוֹר — принятой русской транслитерацией «Хацор».
- source_word: חֲדַתָּה
  choice: -Хадатта
  rationale: Форма понята как вторая часть составного топонима «Хацор-Хадатта» в соответствии с масоретской акцентуацией и контекстом перечня городов; возможное понимание как отдельного названия сохранено в сноске.
- source_word: וּ/קְרִיּוֹת
  choice: и Кериот
  rationale: В перечне городов слово передано как имя собственное, а не как нарицательное «города»; вариант транслитерации «Кириот» отмечен в сноске.
- source_word: חֶצְרוֹן
  choice: -Хецрон
  rationale: Передано как вторая часть составного топонима «Кериот-Хецрон».
- source_word: הִיא
  choice: то есть
  rationale: Местоимение вводит поясняющее отождествление; «то есть» естественно передаёт эту функцию по-русски.
- source_word: חָצוֹר
  choice: Хацор
  rationale: Итоговое название передано последовательно как «Хацор».
theological_decisions: []
