  text: Baalah[a], Iyyim[c][b], and Ezem.
translation:
  language: ru
  text: Баала[a], Ийим[b] и Ацем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых переводах это название передано как «Бала», вероятно под влиянием параллельных перечней городов; в масоретском тексте здесь стоит «Баала».
    reason: alternative_reading
  - marker: b
    text: Название «Ийим», возможно, связано с еврейским словом со значением «развалины» или «груды»; здесь оно употреблено как название места и поэтому транслитерировано.
    reason: lexical_alternative
  - marker: c
    text: В переводах встречаются также написания «Эцем» и «Азем»; форма «Ацем» передаёт масоретскую огласовку и согласную צ в соответствии с русской транслитерацией.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: Баала
  rationale: Название города передано транслитерацией с масоретской огласовки; конечная ה отражена конечным «а», естественным для русского написания.
- source_word: עִיִּים
  choice: Ийим
  rationale: В перечне городов слово выступает как топоним, поэтому оно транслитерировано, а не переведено как «развалины» или «груды»; «йи» передаёт удвоенный йод.
- source_word: עָצֶם
  choice: Ацем
  rationale: 'Топоним транслитерирован согласно масоретской огласовке: начальная гласная — а, а צ передано как «ц».'
- source_word: וְ / וָ
  choice: и
  rationale: Союз соединяет последние элементы простого перечня; по нормам русского языка он явно передан перед последним названием.
theological_decisions: []
translation_notes:
  register: Краткий перечень топонимов сохранён без добавления слова «города». Использованы современные, читаемые русские транслитерации, ориентированные прежде всего на масоретский текст.
