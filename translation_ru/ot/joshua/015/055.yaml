  text: Маон[a], Кармил, Зиф и Ютта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь перечислены только названия поселений: «Маон, Кармил, Зиф и Ютта».'
    reason: cultural_note
lexical_decisions:
- source_word: מָעוֹן
  choice: Маон
  rationale: В контексте перечня городов это топоним, поэтому он передан транслитерацией, а не переведён как нарицательное «жилище».
- source_word: כַּרְמֶל
  choice: Кармил
  rationale: Здесь имеется в виду город в Иудее; название передано принятой русской библейской формой, а не переведено как нарицательное.
- source_word: וָזִיף
  choice: Зиф
  rationale: Союз ו передан в составе русского перечисления, а топоним זִיף — традиционной русской формой «Зиф».
- source_word: וְיוּטָּה
  choice: и Ютта
  rationale: Союз ו переведён как «и», а название יוּטָּה передано близкой к еврейскому звучанию формой «Ютта».
