  text: from Ekron westward, all that is beside Ashdod, and their villages.
translation:
  language: ru
  text: От Екрона к западу — всё, что близ Ашдода, и их селения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעֶקְרוֹן
  choice: от Екрона
  rationale: Предлог מִן обозначает исходную точку территории; название города передано в принятой русской библейской форме.
- source_word: וָיָמָּה
  choice: к морю
  rationale: Направительный суффикс -ָה при יָם буквально указывает движение или простирание к морю; в данном контексте это западное направление, но образное географическое обозначение оригинала сохранено.
- source_word: עַל יַד אַשְׁדּוֹד
  choice: близ Ашдода
  rationale: Идиома עַל יַד означает расположение рядом, по соседству; «близ» естественно и точно передаёт пространственную близость без уточнения стороны.
- source_word: וְחַצְרֵיהֶן
  choice: и их селения
  rationale: חָצֵר в перечнях населённых мест обозначает зависимое неукреплённое поселение или селение; местоименный суффикс женского рода множественного числа сохранён формой «их».
