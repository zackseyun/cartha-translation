lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: И вот их ... шла
  rationale: Еврейская конструкция вводит описание границы удела; русская притяжательная конструкция с глаголом «шла» естественно передаёт смысл в географическом контексте.
- source_word: גְּבוּל נֶגֶב
  choice: южная граница
  rationale: נֶגֶב здесь обозначает сторону света, а не собственное название области Негев.
- source_word: מִקְצֵה
  choice: от края
  rationale: Передаёт исходную точку у оконечности водоёма без излишне тяжеловесного «от крайней оконечности».
- source_word: יָם הַמֶּלַח
  choice: Солёного моря
  rationale: Сохраняет буквальное древнееврейское название водоёма; современное название пояснено в сноске.
- source_word: מִן הַלָּשׁוֹן
  choice: от залива
  rationale: Буквально «от языка»; в топографическом употреблении слово обозначает языкообразный залив или выступ. В основном тексте выбран понятный географический термин, а образ исходного слова сохранён в сноске.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: обращённого к югу
  rationale: Естественно передаёт ориентацию географического объекта, выраженную причастием פנה и направительным окончанием.
