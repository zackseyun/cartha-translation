base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: ru
  text: Но сыны Иуды не смогли лишить иевусеев, жителей Иерусалима, их владений, и иевусеи живут вместе с сынами Иуды в Иерусалиме до сего дня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте «иевусей» стоит в единственном числе как собирательное название народа. После глагола «жить» употреблена необычная конструкция с показателем прямого дополнения; по смыслу она означает: «иевусей живёт с (или среди) сынов Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Но
  rationale: Союз с показателем прямого дополнения вводит контрастное исключение после описания удела; «но» естественно передаёт эту дискурсивную функцию.
- source_word: הַיְבוּסִי
  choice: иевусеев / иевусеи
  rationale: Форма в еврейском тексте морфологически единственного числа, но имеет собирательное значение и обозначает народ.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: жителей Иерусалима
  rationale: Причастная конструкция характеризует иевусеев как населявших Иерусалим; приложение передано кратко и естественно.
- source_word: לֹא יוכלו
  choice: не смогли
  rationale: Форма выражает неспособность в повествовании о прошлом; совершенный вид по-русски естественно обозначает неудавшийся результат.
- source_word: בְנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Сохранён родовой образ еврейского выражения, обозначающего потомков Иуды и членов его племени; «сыны» уместно в современном литературном библейском регистре.
- source_word: לְהוֹרִישָׁם
  choice: лишить владения
  rationale: Hiphil глагола ירשׁ в контексте завоевания означает заставить прежних жителей утратить владение. Этот вариант точнее «изгнать», не утверждая конкретного способа устранения.
- source_word: וַיֵּשֶׁב
  choice: живут
  rationale: В сочетании с «до сего дня» действие представлено как состояние, продолжающееся до времени повествователя; русское настоящее время естественно передаёт эту актуальную длительность.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: вместе с сынами Иуды
  rationale: Необычная конструкция с אֶת после «жить» по контексту выражает совместное проживание; перевод сохраняет смысл сосуществования, не уточняя характер отношений.
- source_word: בִּירוּשָׁלַם
  choice: в Иерусалиме
  rationale: Прямое локативное соответствие.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и понятное русское соответствие формуле, указывающей на продолжение положения до времени повествователя.
theological_decisions:
- issue: Передача בְנֵי יְהוּדָה
  choice: сыны Иуды
  alternative: потомки Иуды / племя Иуды
  rationale: Сохранён родовой библейский образ без сведения выражения только к мужчинам; в контексте оно коллективно обозначает племя.
- issue: Смысл וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: иевусеи живут вместе с сынами Иуды
  alternative: иевусеи живут среди сынов Иуды
  rationale: Синтаксис необычен, но контекст поддерживает совместное проживание. «Вместе с» сохраняет нейтральность и не предполагает ни полного смешения, ни особого союза.
- issue: Значение לְהוֹרִישָׁם
  choice: лишить владения
  alternative: изгнать их
  rationale: Глагол прежде всего указывает на утрату владения; выбранный вариант не сужает смысл до физического изгнания и сохраняет связь с темой обладания землёй.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Сыны Иуды» и «до сего дня» сохраняют достоинство и образность исходного текста; синтаксис остаётся ясным для обычного читателя.
