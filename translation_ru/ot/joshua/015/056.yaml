lexical_decisions:
- source_word: יִזְרְעֶאל
  choice: Изреель
  rationale: Название города передано традиционной русской библейской формой, соответствующей еврейскому топониму Yizreʿel.
- source_word: יָקְדְעָם
  choice: Иокдеам
  rationale: Редкий топоним транслитерирован с учётом еврейского звучания и русской библейской традиции передачи начального йода.
- source_word: זָנוֹחַ
  choice: Заноах
  rationale: Название города транслитерировано; конечная буква ח передана как «х», а гласная последовательность сохранена в форме «Заноах».
- source_word: וְ
  choice: и
  rationale: Союз связывает названия в простом перечне; по нормам русского языка запятые используются между первыми элементами, а «и» — перед последним.
