lexical_decisions:
- source_word: ו/ינים
  choice: Янум
  rationale: Название поселения передано транслитерацией с учётом масоретской формы, известной как יָנוּם. В русском тексте начальное й обозначено буквой «Я», а не сочетанием «Иа».
- source_word: וּ/בֵית תַּפּוּחַ
  choice: Бейт-Таппуах
  rationale: Составной топоним сохранён как название, а не переведён буквально («дом яблока»). «Бейт» непосредственно передаёт еврейское בֵית, а дефис показывает единство названия.
- source_word: וַ/אֲפֵקָה
  choice: Афека
  rationale: Топоним транслитерирован с сохранением конечного элемента -а, соответствующего форме אֲפֵקָה и отличающего её от более краткой формы «Афек».
- source_word: ו / וּ / וַ
  choice: и
  rationale: 'Повторяющийся еврейский союз естественно передан по нормам русского перечисления: запятыми между первыми названиями и союзом «и» перед последним.'
