  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: ru
  text: Затем граница поднималась к Бет-Хогле, проходила к северу от Бет-Аравы и поднималась к камню Бохана, сына Рувима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: поднималась
  rationale: В описании границ глагол указывает на движение линии вверх по местности; выбранный глагол сохраняет топографический оттенок и естественно звучит по-русски.
- source_word: הַגְּבוּל
  choice: граница
  rationale: Здесь имеется в виду пограничная линия, а не вся территория; «граница» — точный и естественный русский эквивалент.
- source_word: בֵּית חָגְלָה
  choice: Бет-Хогла
  rationale: Географическое название передано транслитерацией с сохранением его узнаваемой библейской формы.
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: проходила к северу от Бет-Аравы
  rationale: Сочетание предлогов в формуле описания границы обозначает положение линии относительно названного места; русский оборот ясно и естественно передаёт этот смысл.
- source_word: אֶבֶן בֹּהַן
  choice: камень Бохана
  rationale: Сопряжённая конструкция передаёт принадлежность или именование ориентира; форма «камень Бохана» сохраняет структуру и остаётся естественной.
- source_word: בֶּן רְאוּבֵן
  choice: сын Рувима
  rationale: Перевод следует явной формулировке еврейского текста и не заменяет её более толковательным «рувимлянин».
