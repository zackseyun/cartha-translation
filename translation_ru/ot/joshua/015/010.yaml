  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: ru
  text: От Ваалы граница поворачивала на запад, к горе Сеир, затем шла к северному склону горы Иеарим (то есть Кесалона), спускалась к Бет-Шемешу и шла дальше к Тимне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: граница поворачивала
  rationale: В описании рубежа глагол обозначает изменение направления линии границы; несовершенный вид естественен для последовательного описания её прохождения.
- source_word: מִבַּעֲלָה
  choice: от Ваалы
  rationale: Топоним передан транслитерацией и поставлен в родительный падеж после предлога.
- source_word: יָמָּה
  choice: на запад
  rationale: Направительная форма буквально означает «к морю», но в географии Ханаана это обычное обозначение запада; современному читателю направление передано прямо.
- source_word: אֶל הַר שֵׂעִיר
  choice: к горе Сеир
  rationale: הַר может означать гору или гористую местность; здесь сохранено прямое географическое значение «гора» без отождествления с более известным Сеиром к югу от Иудеи.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: затем проходила по ... склону
  rationale: В формулах границ עבר описывает продолжение линии, а כֶּתֶף, буквально «плечо, бок», применительно к горе естественно передаётся как «склон».
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: северному склону горы Иеарим
  rationale: Сочетание указывает на северную сторону горы; топоним יְעָרִים транслитерирован, а не переведён как «леса».
- source_word: הִיא כְסָלוֹן
  choice: это Кесалон
  rationale: Женское местоимение, вероятно, пояснительно отождествляет названную гору или местность с Кесалоном; русский оборот сохраняет краткость исходного уточнения и некоторую неопределённость референта.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: спускалась к Бет-Шемешу
  rationale: Глагол сохраняет топографический смысл движения вниз; предлог «к» естественно выражает направление, подразумеваемое перед названием пункта.
- source_word: וְעָבַר תִּמְנָה
  choice: шла дальше к Тимне
  rationale: Глагол продолжает описание линии границы, а направительная форма топонима выражает движение к Тимне.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, сдержанный картографический стиль. Имена переданы в формах «Ваала», «Сеир», «Иеарим», «Кесалон», «Бет-Шемеш», «Тимна»; синтаксис сохраняет последовательность ориентиров еврейского текста без ненужного буквального воспроизведения идиомы «к морю».
