base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: ru
  text: Затем граница проходила к Ацмону, выходила к Египетскому потоку[a] и оканчивалась у моря. Это будет вашей южной границей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Египетскому вади». Еврейское на́халь часто означает сезонный водоток или его русло. Традиционный перевод «Египетская река» в данном контексте может ошибочно наводить на мысль о Ниле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Затем граница проходила
  rationale: В описании рубежа глагол עבר обозначает дальнейшее прохождение линии границы. Явно названное подлежащее «граница» делает русский текст естественным, не добавляя нового референта.
- source_word: עַצְמֹנָה
  choice: к Ацмону
  rationale: Направительный суффикс -ה передан предлогом «к»; название места транслитерировано в привычной для русского библейского регистра форме.
- source_word: וְיָצָא
  choice: выходила к
  rationale: Сохранён пространственный образ глагола יצא, который в описаниях границ указывает на достижение следующего ориентира.
- source_word: נַחַל מִצְרַיִם
  choice: Египетскому потоку
  rationale: נחל обычно означает поток, русло сезонного водотока или вади, а не крупную реку. «Поток» естественен в русском тексте и не создаёт сильной ассоциации с Нилом.
- source_word: וְהיה תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: и оканчивалась у моря
  rationale: Идиома תוצאות הגבול указывает на конечный пункт границы, а ימה — на направление к морю, здесь к Средиземному. Перевод передаёт смысл без буквального и неестественного «выходы границы».
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Это будет вашей южной границей
  rationale: נֶגֶב употреблено как указание стороны света, поэтому передано прилагательным «южной», а не как собственное название Негев.
