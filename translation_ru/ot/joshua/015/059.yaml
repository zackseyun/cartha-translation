  text: וּ/מַעֲרָ֥ת וּ/בֵית עֲנ֖וֹת וְ/אֶלְתְּקֹ֑ן עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: ru
  text: Маарат, Бет-Анот и Элтекон — шесть городов с прилегающими к ним селениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с их посёлками» / «с их деревнями». Еврейское слово обозначает зависимые сельские поселения, относившиеся к перечисленным городам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: Маарат
  rationale: Географическое название передано традиционной русской транслитерацией; начальный союз естественно выражен перечислением.
- source_word: וּ/בֵית עֲנוֹת
  choice: Бет-Анот
  rationale: Составной топоним транслитерирован, а дефис показывает его цельность как собственного имени.
- source_word: וְ/אֶלְתְּקֹן
  choice: Элтекон
  rationale: Географическое название транслитерировано без попытки перевода.
- source_word: עָרִים
  choice: городов
  rationale: В перечне удела עִיר обозначает населённый пункт; «город» сохраняет принятую библейскую географическую терминологию.
- source_word: שֵׁשׁ
  choice: шесть
  rationale: Прямое соответствие количественному числительному.
- source_word: וְ/חַצְרֵי/הֶן
  choice: с прилегающими к ним селениями
  rationale: חָצֵר здесь означает зависимые сельские поселения при перечисленных городах, а не буквально «дворы»; формулировка ясно передаёт эту связь.
