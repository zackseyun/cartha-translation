lexical_decisions:
- source_word: לָכִישׁ
  choice: Лахис
  rationale: Название иудейского города передано в принятой русской библейской форме, соответствующей еврейскому топониму.
- source_word: בָצְקַת
  choice: Боцкат
  rationale: Топоним транслитерирован с еврейского; буква צ передана как «ц», а конечная ת — как «т».
- source_word: עֶגְלוֹן
  choice: Еглон
  rationale: Название города передано в традиционной русской библейской форме; в данном перечне оно обозначает город, а не одноимённого моавитского царя.
- source_word: וּ / וְ
  choice: и
  rationale: Префиксальный союз связывает последние названия в простом перечне городов; по нормам русского языка союз явно поставлен перед последним элементом.
