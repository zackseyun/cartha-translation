base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: ru
  text: Западной границей было Великое море и его побережье[a]. Такова граница сынов Иуды со всех сторон, по их родам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к морю: Великое море и граница [его]»; речь идёт о Средиземном море и его береговой линии как западной границе.'
    reason: cultural_note
  - marker: b
    text: 'Или: «по их семействам». Еврейское слово обозначает родовые объединения внутри колена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: А западной границей
  rationale: В описаниях границ יָם обозначает сторону моря, то есть запад; сочетание естественно передаётся по-русски как «западная граница».
- source_word: הַיָּמָּה הַגָּדוֹל וּגְבוּל
  choice: было Великое море
  rationale: 'Повторное גְּבוּל представляет собой краткую аппозиционную конструкцию: Великое море служило самой границей. Русская именная конструкция ясно передаёт этот смысл без неестественного повтора.'
- source_word: זֶה גְּבוּל
  choice: Такова была граница владений
  rationale: В еврейском это безглагольное предложение; прошедшее время соответствует повествовательному контексту. Добавление «владений» естественно поясняет территориальный характер границы, не меняя смысла.
- source_word: בְּנֵי יְהוּדָה
  choice: сынов Иуды
  rationale: Сохранена стандартная библейская родовая формула, буквально называющая племенных потомков Иуды.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт итоговое указание на границу, окружавшую удел.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовые подразделения внутри колена; «роды» естественно и точно для контекста распределения земли.
theological_decisions:
- issue: Родоплеменное обозначение בְּנֵי יְהוּדָה
  choice: сынов Иуды
  alternative: потомков Иуды; народа Иуды
  rationale: Формулировка сохраняет выраженный в источнике образ сыновства и коллективно обозначает колено, не привнося особого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Географическая формула сделана естественной для русского читателя; традиционные «сыны Иуды» и «роды» сохранены как понятные родоплеменные обозначения.
