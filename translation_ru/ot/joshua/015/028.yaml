  text: Hazar-shual[a], Beersheba, and Bizjothjah.
translation:
  language: ru
  text: Хацар-Шуал, Беэр-Шева[a] и Бизйотья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название Беэр-Шева может быть связано с еврейскими словами «колодец семи» и, по игре слов, «колодец клятвы».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Хацар-Шуал
  rationale: Составное географическое название передано транслитерацией, а не переводом («поселение/селение лисицы»), что естественно для перечня городов и сохраняет форму топонима.
- source_word: בְּאֵר שֶׁבַע
  choice: Беэр-Шева
  rationale: Устоявшийся библейский топоним передан транслитерацией; возможная связь названия со словами «семь» и «клятва» отмечена в сноске.
- source_word: בִּזְיוֹתְיָה
  choice: Бизйотья
  rationale: Происхождение названия неясно, поэтому оно передано близкой к еврейской форме русской транслитерацией.
- source_word: וַ / וּ
  choice: запятые и союз «и»
  rationale: Повторяющийся еврейский союз связывает названия; по нормам современного русского языка перечень оформлен запятыми с союзом «и» перед последним элементом.
theological_decisions: []
