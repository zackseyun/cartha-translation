lexical_decisions:
- source_word: כַבּוֹן
  choice: Каббон
  rationale: Название города передано транслитерацией; удвоение «б» отражает дагеш в בּ и согласуется с привычной русской передачей библейских имён.
- source_word: לַחְמָס
  choice: Лахмас
  rationale: Название города передано транслитерацией; «х» естественно передаёт еврейскую ח в русском языке.
- source_word: כִתְלִישׁ
  choice: Китлиш
  rationale: Название города передано транслитерацией; начальная כ передана буквой «к», а שׁ — сочетанием «ш».
- source_word: וְ
  choice: и
  rationale: Повторяющийся союз связывает названия в перечислении; по нормам современного русского языка он явно передан перед последним элементом, а предыдущая связь выражена запятой.
