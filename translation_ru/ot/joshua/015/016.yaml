  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: ru
  text: 'И сказал Халев: «Кто поразит Кириаф-Сефер и захватит его, тому я отдам в жёны свою дочь Ахсу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная форма wayyiqtol продолжает последовательность событий; русский союз «и» сохраняет ход еврейского повествования без лишнего уточнения времени.
- source_word: כָּלֵב
  choice: Халев
  rationale: Традиционная русская библейская форма имени, соответствующая еврейскому כָּלֵב.
- source_word: אֲשֶׁר
  choice: кто
  rationale: Вводит неопределённое относительное условие; «кто» естественно передаёт открытый характер вызова.
- source_word: יַכֶּה
  choice: поразит
  rationale: Hiphil глагола נכה означает «нанести удар, поразить»; в данном контексте речь идёт о военном нападении на город. Выбор сохраняет конкретность исходного глагола.
- source_word: קִרְיַת סֵפֶר
  choice: Кириаф-Сефер
  rationale: Географическое название передано в традиционной русской библейской форме; первый компонент не переводится отдельно, поскольку входит в состав имени.
- source_word: וּלְכָדָהּ
  choice: и захватит его
  rationale: לכד в военном контексте означает овладеть городом, захватить его; местоимение «его» соотносится с грамматическим родом слова «город» в русском.
- source_word: וְנָתַתִּי לוֹ
  choice: тому я отдам
  rationale: Передаёт обещание и явно обозначенного получателя; перестройка «тому» естественно связывает главное предложение с предшествующим «кто».
- source_word: עַכְסָה
  choice: Ахсу
  rationale: Имя передано традиционной русской библейской формой и поставлено в винительный падеж.
- source_word: בִתִּי
  choice: свою дочь
  rationale: Притяжательное значение сохранено; русское «свою» естественно соотносит дочь с говорящим Халевом.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Естественная современная русская формула передачи женщины в брак; она точно выражает брачное значение оборота без дополнительных уточнений.
