  source_fidelity: 'Текст точно передаёт еврейский оригинал: повествовательное «И сказал», открытое условие «Кто», два военных действия («поразит» и «захватит его»), обещание Калеба и обозначение Ахсы как его дочери сохранены. «Его» однозначно отсылает к городу Кириаф-Сефер.'
