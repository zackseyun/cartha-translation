- source_word: צְנָן
  choice: Ценан
  rationale: Название города в перечне населённых пунктов Иудеи; передано традиционной русской транслитерацией, а не переведено.
- source_word: חֲדָשָׁה
  choice: Хадаша
  rationale: Хотя слово связано с прилагательным «новая», здесь оно употреблено как географическое название и потому транслитерировано.
- source_word: מִגְדַּל גָּד
  choice: Мигдал-Гад
  rationale: Составное географическое название сохранено как имя собственное; дефис передаёт его составной характер.
- source_word: וַ / וּ
  choice: и
  rationale: Союзы связывают названия в перечне; в естественном русском перечислении достаточно союза перед последним элементом.
