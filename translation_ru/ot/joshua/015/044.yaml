lexical_decisions:
- source_word: קְעִילָה
  choice: Кеила
  rationale: Географическое название передано принятой русской библейской формой, близкой к еврейскому звучанию.
- source_word: אַכְזִיב
  choice: Ахзив
  rationale: Географическое название транслитерировано в соответствии с еврейской формой.
- source_word: מָרֵאשָׁה
  choice: Мареша
  rationale: Географическое название передано традиционной русской библейской формой.
- source_word: עָרִים
  choice: города
  rationale: Обычное обозначение городских поселений; в территориальном перечне сохраняет административный оттенок.
- source_word: תֵּשַׁע
  choice: девять
  rationale: Количественное числительное прямо относится к городам.
- source_word: חַצְרֵיהֶן
  choice: прилегающие к ним селения
  rationale: Слово обозначает зависимые сельские или неукреплённые поселения, связанные с перечисленными городами; такая формулировка естественно передаёт эту связь по-русски.
- source_word: וְ
  choice: и / с
  rationale: Союз ו соединяет названия, а перед חַצְרֵיהֶן естественно передаётся русским предлогом «с» в итоговой формуле.
