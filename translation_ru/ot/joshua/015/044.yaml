  text: Кеила, Ахзив и Мареша — девять городов с их селениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с их зависимыми поселениями». Еврейское слово может обозначать сельские неукреплённые поселения, относившиеся к городу.'
