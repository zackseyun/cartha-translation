base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: ru
  text: И изгнал[a] оттуда Халев трёх сыновей Анака — Шешая, Ахимана и Талмая, потомков Анака[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишил владения и вытеснил». Еврейский глагол может подчёркивать овладение местом через изгнание прежних жителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рождённых от Анака». В стихе об одной и той же группе употреблены два близких родственных обозначения: «сыновья Анака» и «рождённые от Анака».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: изгнал
  rationale: Каузативная форма глагола ירשׁ при личном дополнении означает лишить прежних жителей владения, вытеснив их. «Изгнал» естественно звучит по-русски и соответствует контексту завоевания, а оттенок лишения владения отмечен в сноске.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямой и естественный русский эквивалент обстоятельства места с предлогом מן.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: трёх сыновей Анака
  rationale: Сохраняется буквальное родственное обозначение בְּנֵי; поскольку далее названы три человека, оно понятно и не требует обобщающего «анакиты».
- source_word: שֵׁשַׁי
  choice: Шешая
  rationale: Русская передача имени «Шешай» в форме винительного падежа, требуемой синтаксисом предложения.
- source_word: אֲחִימַן
  choice: Ахимана
  rationale: Русская передача имени «Ахиман» в форме винительного падежа.
- source_word: תַּלְמַי
  choice: Талмая
  rationale: Русская передача имени «Талмай» в форме винительного падежа.
- source_word: יְלִידֵי הָעֲנָק
  choice: потомков Анака
  rationale: Сочетание буквально указывает на рождённых от Анака, то есть принадлежащих к его роду. «Потомков» естественно передаёт генеалогический смысл, не отождествляя выражение полностью с предшествующим «сыновей».
