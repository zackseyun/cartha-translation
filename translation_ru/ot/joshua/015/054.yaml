  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: ru
  text: Хумта, Кириаф-Арба (то есть Хеврон)[a] и Циор — девять городов с их селениями.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст отождествляет Кириаф-Арбу с Хевроном.
    reason: cross_reference
  - marker: b
    text: 'Или: «с их деревнями». Еврейское слово может обозначать небольшие зависимые поселения, связанные с перечисленными городами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Хумта
  rationale: Название места передано традиционной русской транслитерацией, без попытки перевести его как нарицательное слово.
- source_word: קִרְיַת אַרְבַּע
  choice: Кириаф-Арба
  rationale: Устоявшаяся в русской библейской традиции форма топонима; в данном перечне выражение функционирует как собственное название.
- source_word: הִיא חֶבְרוֹן
  choice: то есть Хеврон
  rationale: Естественно передаёт пояснительное отождествление прежнего названия Кириаф-Арба с Хевроном.
- source_word: צִיעֹר
  choice: Циор
  rationale: Топоним транслитерирован в форме, естественной для русского библейского именослова.
- source_word: עָרִים תֵּשַׁע
  choice: девять городов
  rationale: Сохраняет обычное значение עָרִים и формулу территориального перечня.
- source_word: חַצְרֵיהֶן
  choice: с их селениями
  rationale: Слово обозначает меньшие зависимые поселения при перечисленных городах; «селения» достаточно широко и не уточняет без основания наличие стен или размер.
