  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: ru
  text: 'Она сказала: «Дай мне, пожалуйста, благословение[a]: раз ты дал мне землю Негева[b], дай мне и источники воды[c]». И он дал ей верхние и нижние источники.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар». Еврейское слово буквально означает «благословение», но здесь относится к испрашиваемому благому дару.'
    reason: lexical_alternative
  - marker: b
    text: «Негев» может также означать «южный край» или «южную область»; в некоторых контекстах слово связано с засушливой местностью.
    reason: lexical_alternative
  - marker: c
    text: 'Точное значение еврейского слова не вполне ясно: оно может обозначать источники, водоёмы или водные бассейны; здесь по контексту переведено как «источники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: благословение
  rationale: Сохраняет обычное значение еврейского слова и язык благого дара; в данном контексте речь идёт о даровании полезного владения.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: землю в Негеве
  rationale: Негев здесь естественно понимать как географическую область; предлог «в» передаёт смысл владения землёй, расположенной в этом регионе, без тяжеловесного «землю Негева».
- source_word: גֻּלֹּת מָיִם
  choice: источники воды
  rationale: Точное значение גֻּלֹּת спорно, однако контекст верхних и нижних водных объектов лучше всего допускает «источники»; дополнение «воды» отражает מָיִם.
- source_word: תְּנָה
  choice: дай мне, пожалуйста
  rationale: Императив передаёт просьбу; «пожалуйста» естественно выражает её вежливый характер в русском контексте.
- source_word: וְנָתַתָּה לִי
  choice: дай мне и
  rationale: Союз связывает дополнительную просьбу с уже данным земельным владением; частица «и» ясно передаёт добавочное значение.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: верхние источники
  rationale: Прилагательное обозначает источники, расположенные выше; перевод согласован с גֻּלֹּת מָיִם.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: нижние источники
  rationale: Передаёт параллельное обозначение водных источников, расположенных ниже.
- source_word: וַיִּתֶּן לָהּ
  choice: И он дал ей
  rationale: Простое повествовательное продолжение сохраняет структуру еврейского текста и не усиливает причинно-следственную связь.
theological_decisions:
- issue: Значение просьбы о בְרָכָה
  choice: Сохранено слово «благословение» с пояснением его предметного смысла.
  alternative: Перевести как «дар» или «подарок».
  rationale: Так сохраняются и буквальная лексика, и возможный оттенок благого дара, не сводя выражение только к материальному подарку.
translation_notes:
  register: Современный литературный русский язык с простой, достойной повествовательной интонацией. Вежливая просьба передана естественно, без архаизмов; подлинная лексическая неопределённость отмечена в сносках.
