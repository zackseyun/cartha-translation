base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: ru
  text: 'Когда она пришла, она побудила его попросить у её отца поле. Затем она сошла[a] с осла, и Халев спросил её: «Что тебе нужно?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спешилась»; еврейский глагол может подразумевать резкий спуск.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Что тебе?» Возможные значения: «Что тебе нужно?» или «Что с тобой?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: когда она пришла
  rationale: Инфинитивная конструкция с ב и суффиксом 3-го лица женского рода образует временную придаточную часть; перевод не уточняет не названное в стихе место прибытия.
- source_word: וַתְּסִיתֵהוּ
  choice: она стала убеждать его
  rationale: Глагол סות может означать побуждение, уговаривание или подстрекательство. В данном семейном контексте «убеждать» естественно передаёт настойчивое побуждение без неоправданно отрицательной окраски.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: попросить у её отца поле
  rationale: Конструкция שאל מֵאֵת обозначает просьбу, обращённую к человеку, а שׂדה здесь означает поле или участок земли. Русская конструкция «попросить у ... поле» сохраняет отношения исходного текста.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: она соскочила с осла
  rationale: צנח обозначает спуск или падение и может подразумевать резкое движение. «Соскочила» сохраняет эту возможную живость действия; менее выразительное понимание отмечено в сноске.
- source_word: מַה לָּךְ
  choice: Что тебе нужно?
  rationale: Буквально идиома означает «Что тебе?» и по контексту вводит просьбу Ахсы. Выбран естественный современный русский эквивалент без добавления содержания самой просьбы.
