  text: 'И в горной местности: Шамир, Яттир и Сохо.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: А в горной области
  rationale: Сочетание союза, предлога с артиклем и существительного буквально означает «и/а в горной области». Союз сохранён, поскольку стих продолжает перечень городов; «горная область» естественно обозначает Иудейское нагорье.
- source_word: שָׁמִיר
  choice: Шамир
  rationale: Топоним передан транслитерацией, близкой к еврейскому звучанию.
- source_word: וְ/יַתִּיר
  choice: Яттир
  rationale: Топоним передан непосредственно с еврейского; начальный י соответствует русскому «й», а удвоение «т» отражает дагеш.
- source_word: וְ/שׂוֹכֹה
  choice: Сохо
  rationale: Топоним передан непосредственно с еврейского; буква שׂ здесь обозначает звук «с», а конечная ה передаёт конечный гласный.
