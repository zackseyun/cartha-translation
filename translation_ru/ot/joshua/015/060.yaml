base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: ru
  text: Кириаф-Баал (то есть Кириаф-Иарим) и Рабба — два города с их селениями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Кириаф-Баал
  rationale: Название места передано принятой русской библейской транслитерацией, а не этимологическим переводом «город Ваала».
- source_word: הִיא
  choice: то есть
  rationale: Местоимение здесь пояснительно отождествляет Кириаф-Баал с Кириаф-Иаримом; «то есть» естественно передаёт эту функцию по-русски.
- source_word: קִרְיַת יְעָרִים
  choice: Кириаф-Иарим
  rationale: Альтернативное название города передано принятой русской библейской транслитерацией.
- source_word: הָרַבָּה
  choice: Рабба
  rationale: Топоним транслитерирован; еврейский артикль не воспроизводится как часть русского названия.
- source_word: עָרִים שְׁתַּיִם
  choice: два города
  rationale: Прямое и естественное обозначение общего числа названных городов в территориальном перечне.
- source_word: חַצְרֵיהֶן
  choice: с прилегающими к ним селениями
  rationale: חָצֵר в подобных перечнях обозначает зависимые или окружающие поселения, связанные с названными городами; формулировка уточняет связь местоименного суффикса с обоими городами.
theological_decisions: []
