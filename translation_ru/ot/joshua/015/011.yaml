  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: ru
  text: Затем граница вышла к северной стороне Экрона[a], повернула к Шиккерону[b], прошла через гору Баала и вышла к Явнеэлу; граница оканчивалась у моря[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к плечу Экрона, к северу». «Плечо» — топографический образ стороны или склона; возможно также: «к северной стороне Экрона» или «к северу от Экрона».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «повернула в сторону Шиккерона» или «огибала в направлении Шиккерона»; глагол описывает изменение направления границы.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «выходы границы были к морю». Вероятно, имеется в виду Средиземное море как западный предел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: выходила
  rationale: В описаниях границ глагол обозначает продвижение линии к следующему ориентиру; повтор перед Явнеэлом сохранён.
- source_word: גְּבוּל
  choice: граница
  rationale: Естественное русское обозначение линии, отделяющей территорию, в контексте размежевания земель.
- source_word: כֶּתֶף
  choice: склон
  rationale: Буквально «плечо»; в топографическом употреблении слово обозначает бок или склон. «Склон» сохраняет географический смысл и звучит естественно по-русски.
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: северному склону Экрона
  rationale: Направительная форма צָפוֹנָה указывает на северную ориентацию; в сочетании с כֶּתֶף выражение допускает понимание как северной стороны или склона Экрона.
- source_word: תָּאַר
  choice: поворачивала к
  rationale: В формулах проведения границ глагол описывает изменение направления линии; перевод не придаёт ему излишне технического смысла.
- source_word: שִׁכְּרוֹנָה
  choice: Шиккерону
  rationale: Топоним передан транслитерацией с учётом направительного значения формы.
- source_word: עָבַר
  choice: проходила через
  rationale: Глагол обозначает движение через ориентир или мимо него; здесь выбран естественный русский оборот для линии границы, пересекающей возвышенность.
- source_word: הַר הַבַּעֲלָה
  choice: гору Баала
  rationale: הַר обозначает гору или возвышенность; Баала сохранено как имя собственное без богословского истолкования.
- source_word: יַבְנְאֵל
  choice: Явнеэлу
  rationale: Топоним передан близкой к еврейскому звучанию современной русской транслитерацией.
- source_word: תֹּצְאוֹת
  choice: заканчивалась
  rationale: Еврейское существительное во множественном числе указывает на крайние точки или завершение границы; по-русски смысл естественно выражен глаголом.
- source_word: יָמָּה
  choice: у моря
  rationale: Форма может означать «к морю» или «на запад»; в данном пограничном описании море выступает конечным западным пределом.
