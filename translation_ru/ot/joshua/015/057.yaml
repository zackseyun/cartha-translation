lexical_decisions:
- source_word: הַקַּיִן
  choice: Га-Каин
  rationale: Топоним передан транслитерацией; начальное הַ־ сохранено как часть формы названия и передано по-русски как «Га-».
- source_word: גִּבְעָה
  choice: Гива
  rationale: В перечне городов это топоним, поэтому его смысл «холм» не переводится; выбрана устоявшаяся русская форма.
- source_word: תִמְנָה
  choice: Тимна
  rationale: Название города передано современной русской транслитерацией.
- source_word: עָרִים עֶשֶׂר
  choice: десять городов
  rationale: Сохранена обычная итоговая формула территориального перечня; עָרִים здесь обозначает перечисленные городские поселения.
- source_word: וְחַצְרֵיהֶן
  choice: с принадлежащими им селениями
  rationale: חָצֵר в подобных перечнях обозначает небольшие зависимые поселения при названных городах; формулировка также ясно передаёт местоименный суффикс «их».
