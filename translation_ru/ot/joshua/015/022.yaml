lexical_decisions:
- source_word: קִינָה
  choice: Кина
  rationale: Название города передано принятой русской практической транслитерацией; начальная ק закономерно передаётся буквой «к», а конечная ה отражена окончанием «-а».
- source_word: דִימוֹנָה
  choice: Димона
  rationale: Название города транслитерировано в естественной для русского языка форме «Димона», соответствующей еврейскому звучанию и современной русской передаче этого топонима.
- source_word: עַדְעָדָה
  choice: Адада
  rationale: Топоним транслитерирован с сохранением повторяющегося согласного рисунка еврейского имени.
- source_word: וְ
  choice: и
  rationale: Повторяющийся еврейский союз связывает названия в перечне; по нормам современного русского языка достаточно поставить запятую и союз «и» перед последним названием.
