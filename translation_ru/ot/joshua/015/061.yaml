lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: В пустыне
  rationale: Предлог ב с определённым артиклем образует обстоятельство места и вводит географическую область, где находились перечисленные города. «Пустыня» естественно передаёт מִדְבָּר в контексте Иудейской пустыни, хотя слово не обязательно обозначает совершенно безводную местность.
- source_word: בֵּית הָעֲרָבָה
  choice: Бет-Арава
  rationale: Географическое название передано транслитерацией с сохранением узнаваемого элемента Бет («дом»), а не переведено как нарицательное словосочетание.
- source_word: מִדִּין
  choice: Миддин
  rationale: Собственное географическое название транслитерировано с передачей удвоенного согласного, отмеченного дагешем.
- source_word: וּסְכָכָה
  choice: и Сехаха
  rationale: Союз ו передан как «и»; название транслитерировано непосредственно с еврейского, включая фрикативное произношение букв כ без дагеша.
