lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: Хацар-Гадда
  rationale: Название города передано транслитерацией. Дефис показывает составной характер топонима, не превращая его компоненты в пояснительный перевод.
- source_word: חֶשְׁמוֹן
  choice: Хешмон
  rationale: Топоним передан транслитерацией в форме, естественной для современного русского библейского текста.
- source_word: בֵית פָּלֶט
  choice: Бет-Пелет
  rationale: Составной топоним передан транслитерацией; בֵית буквально означает «дом», однако здесь всё сочетание функционирует как географическое название.
- source_word: וְ / וּ
  choice: и
  rationale: Союз координирует названия в перечне; по нормам русского языка он явно передан перед последним элементом, а остальные разделены запятыми.
