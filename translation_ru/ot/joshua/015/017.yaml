lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: захватил его
  rationale: Глагол לכד передаёт военный захват; местоименный суффикс женского рода относится к городу Кириаф-Сеферу (Давиру) из предыдущего стиха, но в русском согласуется со словом «город» в мужском роде.
- source_word: עָתְנִיאֵל
  choice: Гофониил
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶּן קְנַז
  choice: сын Кеназа
  rationale: Прямо передаёт древнееврейскую конструкцию родства; имя передано в форме, близкой к источнику и принятой в русской библейской традиции.
- source_word: אֲחִי כָלֵב
  choice: брата Халева
  rationale: 'Форма согласована с «Кеназа»: Гофониил — сын Кеназа, брата Халева. אָח в основном значении означает «брат», хотя иногда может обозначать более широкое родство.'
- source_word: וַיִּתֶּן לוֹ
  choice: и Халев отдал ему
  rationale: Имя Халева повторено для устранения неясности двух местоимений в русском; из контекста именно Халев является тем, кто отдаёт дочь Гофониилу.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: свою дочь Ахсу
  rationale: Естественный русский порядок слов сохраняет имя и указание на родство; возвратное «свою» ясно соотносит дочь с Халевом.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Естественная современная русская формула, точно передающая передачу женщины в брак.
theological_decisions:
- issue: Степень родства Кеназа и Халева
  choice: брат Халева
  alternative: родственник Халева
  rationale: Сохранено основное и наиболее прямое значение אָח — «брат»; более широкое значение возможно, но контекст не требует выбирать его в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка прояснён повтором имени Халева, а традиционные русские формы имён сохранены. Ссылка на город из предыдущего стиха передана местоимением без отдельной сноски, поскольку русский мужской род ясно указывает на подразумеваемый «город».
