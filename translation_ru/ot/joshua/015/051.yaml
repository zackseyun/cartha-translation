  text: Гошен, Холон и Гило — одиннадцать городов с их селениями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: Гошен
  rationale: Топоним передан традиционной русской библейской формой, соответствующей еврейскому названию.
- source_word: חֹלֹן
  choice: Холон
  rationale: Транслитерация топонима, отражающая начальный еврейский согласный ח и форму имени.
- source_word: גִלֹה
  choice: Гило
  rationale: Топоним передан как «Гило»; конечная ה здесь обозначает гласный звук, а не требует отдельного согласного в русском написании.
- source_word: עָרִים
  choice: городов
  rationale: В территориальном перечне слово обозначает городские центры; русское «города» сохраняет обычное библейское и административное значение.
- source_word: אַחַת עֶשְׂרֵה
  choice: одиннадцать
  rationale: Составное количественное числительное естественно передано одним русским числительным.
- source_word: חַצְרֵיהֶן
  choice: с их селениями
  rationale: Имеются в виду зависимые от городов небольшие, вероятно неукреплённые поселения; «селения» передаёт смысл, не уточняя их размер или устройство сверх текста.
