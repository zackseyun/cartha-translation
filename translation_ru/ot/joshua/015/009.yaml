  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: ru
  text: От вершины горы граница поворачивала к источнику вод Нефтоаха[a], затем шла к городам горы Ефрон; далее граница поворачивала к Баале — это Кириат-Иеарим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «граница была проведена»; возможно также: «граница огибала». В описаниях рубежей еврейский глагол может обозначать проведение линии границы или изменение её направления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: поворачивала
  rationale: В описании границ глагол обозначает проведение линии границы, в частности изменение её направления. «Поворачивала» естественно звучит по-русски и сохраняет топографический смысл; неоднозначность отмечена в сноске.
- source_word: הַגְּבוּל
  choice: граница
  rationale: Обычное и точное обозначение рубежа территории в современном русском языке.
- source_word: מֵרֹאשׁ הָהָר
  choice: от вершины горы
  rationale: «Вершина» естественно передаёт географическое употребление רֹאשׁ и не воспроизводит неуместно буквальное «голова».
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: к источнику вод Нефтоаха
  rationale: Формулировка близко сохраняет еврейскую сопряжённую конструкцию и передаёт Нефтоах как географическое имя.
- source_word: וְיָצָא
  choice: затем шла
  rationale: В формулах описания границ глагол указывает на дальнейшее прохождение линии. «Шла» идиоматично для русских географических описаний.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: к городам горы Ефрон
  rationale: 'Сохраняется сжатая структура исходного текста: עָרֵי передано как «города», а הַר עֶפְרוֹן — как «гора Ефрон», без более толковательного «нагорья».'
- source_word: בַּעֲלָה
  choice: Баала
  rationale: Географическое имя передано русской транслитерацией.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: то есть к Кириат-Иеариму
  rationale: Местоименная конструкция отождествляет Баалу с другим названием; «то есть» естественно выражает это пояснение. Предлог повторён ради ясности русского синтаксиса.
