  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: ru
  text: На ногах у них были изношенные, залатанные сандалии, а на них была изношенная одежда; весь хлеб из их припасов был сухим и раскрошившимся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заплесневелым». Редкое еврейское слово, переведённое как «раскрошившимся», может обозначать сухой хлеб, распавшийся на куски; некоторые понимают его как «заплесневелый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: сандалии
  rationale: Слово обозначает обувь; «сандалии» конкретно и естественно передаёт древний тип обуви.
- source_word: בָּלוֹת
  choice: изношенные
  rationale: Передаёт состояние вещей, обветшавших от времени и употребления, а не просто старых.
- source_word: מְטֻלָּאוֹת
  choice: залатанные
  rationale: Страдательное причастие указывает на обувь, починенную наложением заплат.
- source_word: בְּרַגְלֵיהֶם
  choice: на ногах у них
  rationale: Сохраняет конкретную пространственную деталь и естественно звучит по-русски.
- source_word: שְׂלָמוֹת
  choice: одежда
  rationale: Общее обозначение одежды здесь не требует более узкого уточнения вроде «верхняя одежда».
- source_word: עֲלֵיהֶם
  choice: на них самих
  rationale: Сохраняет параллель с обувью на ногах и подчёркивает одежду, надетую на них.
- source_word: לֶחֶם צֵידָם
  choice: хлеб, взятый ими в дорогу
  rationale: Передаёт конкретное «хлеб» и смысл дорожного запаса естественным современным русским выражением.
- source_word: יָבֵשׁ הָיָה
  choice: был сухим
  rationale: Прямо передаёт описываемое состояние хлеба.
- source_word: נִקֻּדִים
  choice: раскрошившимся
  rationale: Редкое слово, вероятно, описывает пересохший хлеб, распавшийся на куски или крошки; выбранное слово передаёт этот смысл, не скрывая альтернативу в сноске.
