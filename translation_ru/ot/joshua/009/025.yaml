  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: соединительно-временное «И теперь», предъявительное «вот мы», образ зависимости «в твоей руке», а также оценочную формулу «хорошо и правильно в твоих глазах». Русское «Сделай с нами то, что…» естественно передаёт просьбу, хотя формально не воспроизводит повтор инфинитива и императива עשה; такое сглаживание оправдано нормами современного русского.'
