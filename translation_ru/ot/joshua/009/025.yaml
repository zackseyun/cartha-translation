  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: ru
  text: И теперь — вот мы в твоей руке. Сделай с нами то, что хорошо и правильно в твоих глазах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «А теперь мы в твоей власти. Поступи с нами так, как сочтёшь хорошим и правильным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительный союз וְ, и временно-дискурсивное עַתָּה, вводя нынешнее подчинённое положение гаваонитян.
- source_word: הִנְנוּ
  choice: вот мы
  rationale: Передаёт указательно-предъявительное значение формы естественным современным русским выражением без архаического «се».
- source_word: בְיָדֶךָ
  choice: в твоей руке
  rationale: Сохраняет ясную древнееврейскую метафору полной зависимости от чужой власти, не заменяя её сразу толкованием «в твоей власти» или «в твоей милости».
- source_word: כַּטּוֹב
  choice: хорошо
  rationale: Прямо передаёт основное значение טוֹב в составе оценки того, как следует поступить.
- source_word: וְכַיָּשָׁר
  choice: и правильно
  rationale: יָשָׁר здесь обозначает должное, правое или справедливое; «правильно» естественно сочетается с «хорошо» и сохраняет оценочный оттенок.
- source_word: בְּעֵינֶיךָ
  choice: в твоих глазах
  rationale: Сохраняет древнееврейскую идиому оценки и суждения, понятную в современном русском контексте.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Сделай с нами то, что…
  rationale: Повтор корня עשה в инфинитиве и императиве невозможно воспроизвести столь же естественно; русская конструкция сохраняет прямую просьбу и объект действия без лишнего истолкования.
