  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: ru
  text: 'И сказали нам наши старейшины и все жители нашей земли: «Возьмите с собой припасы в дорогу, пойдите им навстречу и скажите им: „Мы — ваши слуги“[a]. А теперь заключите с нами завет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «слуги», в других контекстах может также означать «рабы»; здесь это почтительная дипломатическая формула.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «разрубите с нами завет» — древнееврейское устойчивое выражение со значением «заключите завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: наши старейшины
  rationale: В данном контексте речь идёт о руководителях общины, а не просто о пожилых мужчинах.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: все жители нашей земли
  rationale: Передаёт собирательное обозначение людей, живущих в этой земле; כָל отражено словом «все».
- source_word: צֵידָה לַדֶּרֶךְ
  choice: припасы в дорогу
  rationale: צֵידָה обозначает дорожные припасы, прежде всего пищу; русское выражение естественно и не сужает значение только до еды.
- source_word: בְיֶדְכֶם
  choice: с собой
  rationale: Буквально «в вашу руку / в ваших руках»; по-русски в данном повелении естественнее «возьмите с собой», при этом предметный смысл сохраняется.
- source_word: לִקְרָאתָם
  choice: им навстречу
  rationale: Точно передаёт движение с целью встречи.
- source_word: עַבְדֵיכֶם
  choice: ваши слуги
  rationale: עֶבֶד может означать и раба, и слугу; здесь это почтительная дипломатическая формула подчинённости, поэтому «слуги» соответствует контексту без устранения более широкого значения слова.
- source_word: וְעַתָּה
  choice: а теперь
  rationale: Обозначает переход от поручения к главной просьбе; «а теперь» естественно передаёт этот ход речи.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: заключите с нами завет
  rationale: כרת ברית — устойчивое выражение, буквально «разрубить завет»; «заключить завет» сохраняет библейскую категорию и звучит естественно по-русски.
theological_decisions:
- issue: Передача בְּרִית в политико-дипломатическом контексте
  choice: завет
  alternative: договор / союз
  rationale: Хотя здесь имеется в виду соглашение между народами, «завет» сохраняет ключевой библейский термин и не исключает договорного смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис формулы речи слегка сглажен ради естественности, а вложенная цитата сохранена. Термин «завет» удерживает библейскую лексику, тогда как сноски отмечают буквальный идиоматический образ и диапазон значения עֶבֶד.
