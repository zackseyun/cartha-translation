  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: ru
  text: Через три дня после того, как они заключили с ними завет, израильтяне услышали, что те находятся неподалёку от них и живут среди них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: через три дня
  rationale: Естественная русская передача временного выражения «по истечении трёх дней» без изменения смысла.
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: заключили с ними завет
  rationale: Устойчивое и точное соответствие древнееврейской идиоме «срубили/заключили завет».
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: те живут неподалёку от них
  rationale: Прилагательное קְרֹבִים передано наречным выражением в связи со следующим сообщением о месте проживания; местоименные референты прояснены по контексту.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: среди них
  rationale: Сохраняет смысл проживания внутри области/среды Израиля и не сводит выражение лишь к географической близости.
theological_decisions:
- issue: Характер соглашения с гаваонитянами
  choice: завет
  alternative: договор
  rationale: בְּרִית — ключевой библейский термин; «завет» сохраняет юридическую и богословскую весомость обязательства, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; фраза перестроена естественно для русского синтаксиса. Подлежащее «израильтяне» восстановлено из контекста, чтобы избежать неясной цепочки местоимений; торжественное «и случилось» не воспроизводится как неестественное в данном повествовательном контексте.
