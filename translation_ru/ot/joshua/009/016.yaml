  source_fidelity: В черновике верно переданы временная последовательность, заключение завета и сообщение о близости гаваонитян. Однако глагол «живут» синтаксически распространён также на «неподалёку», тогда как в еврейском тексте сначала отдельно сказано, что они «близки/находятся близко», а затем — что они живут «среди/внутри» Израиля. Раздельная передача этих двух сообщений точнее.
