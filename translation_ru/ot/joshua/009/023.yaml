base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: ru
  text: Теперь же вы прокляты, и среди вас никогда не переведутся рабы — те, кто заготавливает древесину и черпает воду для дома моего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет отсечён из вашей среды раб»; еврейский оборот означает, что из этого народа постоянно будут назначаться люди для такого труда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак, теперь
  rationale: Передаёт и связующий союз, и переход от обвинения к объявлению последствия.
- source_word: אֲרוּרִים אַתֶּם
  choice: вы прокляты
  rationale: Прямо передаёт именное сказуемое во множественном числе без смягчения силы приговора.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: и не переведутся среди вас рабы
  rationale: Русский оборот «не переведутся среди вас» естественно выражает непрерывность положения, буквально описанного как отсутствие прекращения или отсечения раба из их среды; множественное «рабы» раскрывает собирательное значение еврейского единственного числа.
- source_word: עֶבֶד
  choice: рабы
  rationale: В контексте проклятия и принудительно назначенного подчинённого труда слово «рабы» точнее, чем смягчающее «слуги».
- source_word: חֹטְבֵי עֵצִים
  choice: рубящие дрова
  rationale: Передаёт причастную конструкцию и конкретный вид назначенного труда современным русским языком.
- source_word: שֹׁאֲבֵי מַיִם
  choice: черпающие воду
  rationale: Сохраняет буквальный образ набирания воды и параллелизм с «рубящие дрова».
- source_word: לְבֵית אֱלֹהָי
  choice: для дома моего Бога
  rationale: Сохраняет указание на святилище как дом Бога и личную форму «моего Бога».
theological_decisions:
- issue: Характер навязанного зависимого положения в проклятии Иисуса Навина
  choice: рабы
  alternative: слуги; работники
  rationale: Контекст описывает постоянный, принудительно установленный подчинённый труд. «Рабы» сохраняет суровость проклятия и не привносит более мягкого представления о добровольной службе.
- issue: Корпоративная продолжительность приговора
  choice: не переведутся среди вас рабы
  alternative: никто из вас не перестанет быть рабом
  rationale: Еврейская конструкция говорит о том, что из их среды не прекратится наличие раба, а не обязательно о том, что каждый отдельный человек навсегда останется рабом. Выбранная формулировка сохраняет эту корпоративную перспективу.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Оборот «не переведутся среди вас» понятен современному читателю и сохраняет длительный корпоративный смысл исходной конструкции; параллельные причастия воспроизводят структуру еврейского текста.
