- source_word: וַיִּתְקַבְּצוּ
  choice: они собрались
  rationale: Возвратная форма естественно передаёт нифаль глагола קבץ — совместное собирание в группу.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие прямо подчёркивает совместность действия; русский эквивалент точен и естественен.
- source_word: לְהִלָּחֵם
  choice: чтобы воевать
  rationale: Инфинитив с ל выражает цель, а нифаль לחם означает вступать в вооружённую борьбу; «воевать» соответствует контексту и литературному регистру.
- source_word: עִם ... וְעִם
  choice: против ... и против
  rationale: При глаголе войны עִם обозначает противостояние. Повтор предлога сохраняет параллельную структуру еврейского текста.
- source_word: יְהוֹשֻׁעַ
  choice: Иисуса Навина
  rationale: Устоявшаяся русская библейская форма имени позволяет отличить этого персонажа от других носителей имени Иисус.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Устоявшаяся русская передача имени народа и коллективного обозначения Израиля.
- source_word: פֶּה אֶחָד
  choice: все как один
  rationale: Буквально «одними устами»; идиома выражает полное единство намерения и действия. «Все как один» естественно передаёт её смысл, не сливая её с предшествующим יַחְדָּו.
