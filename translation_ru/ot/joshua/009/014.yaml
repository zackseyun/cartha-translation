  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: ru
  text: И люди взяли часть их припасов, но не спросили совета у Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уста Яхве»; это выражение означает обратиться к нему за указанием или решением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Основное значение לקח — «брать, взять»; конкретное действие сохранено без уточнения, не выраженного в тексте.
- source_word: הָאֲנָשִׁים
  choice: люди
  rationale: Существительное с артиклем означает «люди»; контекст указывает на израильтян, но сам стих не называет их ни вождями, ни представителями Израиля.
- source_word: מִצֵּידָם
  choice: часть их припасов
  rationale: צֵיד обозначает дорожные припасы, часто пищу; предлог מִן здесь естественно понимать в партитивном значении — была взята часть припасов.
- source_word: פִּי יְהוָה
  choice: совета у Яхве
  rationale: Буквально «уст Яхве»; в данном обороте речь идёт о том, чтобы узнать решение или указание Яхве. Идиоматический перевод естественен по-русски, а буквальный образ отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: לֹא שָׁאָלוּ
  choice: не спросили совета у
  rationale: שׁאל значит «спрашивать, вопрошать». В сочетании с פִּי יְהוָה русское «спросить совета у Яхве» ясно передаёт обращение за Божьим решением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Передача выражения פִּי יְהוָה
  choice: не спросили совета у Яхве
  alternative: не вопросили уст Яхве
  rationale: Буквальное «уста Яхве» сохраняет образ оригинала, но в современном русском звучит неясно и неестественно. Основной текст передаёт значение обращения за решением Яхве, а сноска сохраняет буквальную форму и возможность оттенков «указание» или «решение».
translation_notes:
  register: Современный литературный русский язык; изложение краткое и повествовательное. Союз «но» естественно выражает заложенное контекстом противопоставление между проверкой припасов и отсутствием обращения к Яхве.
