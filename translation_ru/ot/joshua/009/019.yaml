source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: ru
  text: 'Но все предводители сказали всей общине: «Мы поклялись им Яхве, Богом Израиля, и теперь не можем тронуть их[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причинить им вред», «поразить их»; буквально: «коснуться их».'
    reason: Уточняет буквальное значение נגע и его вероятный контекстуальный смысл враждебного действия.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Но … сказали
  rationale: Союз וְ продолжает повествование, однако здесь ответ предводителей противопоставлен недовольству общины; «но» естественно передаёт эту контрастную связь.
- source_word: הַנְּשִׂיאִים
  choice: предводители
  rationale: נָשִׂיא обозначает глав, вождей или руководителей народа. «Предводители» ясно указывает на полномочных представителей Израиля и сохраняет достоинство повествовательного стиля.
- source_word: הָעֵדָה
  choice: община
  rationale: עֵדָה здесь означает собранное сообщество Израиля. «Община» передаёт корпоративный смысл и естественно звучит по-русски.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: мы поклялись им
  rationale: Форма от שׁבע означает принесение клятвы; прошедшее время в русском языке вместе с контекстом передаёт сохраняющуюся обязательность клятвы.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: При глаголе клятвы предлог בְּ обозначает того, кем клянутся. Русская конструкция «поклялись … Яхве» передаёт это значение без добавления отсутствующего в тексте слова «именем».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Творительный падеж согласован с русской конструкцией клятвы и точно передаёт сочетание «Бог Израиля», относящееся к Яхве.
- source_word: וְעַתָּה
  choice: и теперь
  rationale: Сочетание отмечает нынешнее следствие ранее принесённой клятвы и сохраняет связность исходного текста.
- source_word: לֹא נוּכַל
  choice: не можем
  rationale: יכל выражает невозможность; здесь она обусловлена обязательностью клятвы. «Не можем» сохраняет как прямой смысл, так и нравственную обусловленность, не делая её явной сверх текста.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: тронуть их
  rationale: נגע буквально означает «касаться», но в данном контексте подразумевает враждебное действие или причинение вреда. Русское «тронуть» сохраняет телесный образ и одновременно естественно допускает значение «причинить вред».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон, поэтому личное заветное имя передано транслитерацией «Яхве», а не заменено титулом.
- issue: Характер невозможности нарушить клятву
  choice: не можем
  alternative: не имеем права
  rationale: Исходный глагол выражает невозможность, а контекст связывает её с клятвой. Перевод сохраняет эту богословско-нравственную напряжённость и не заменяет невозможность более однозначным юридическим запретом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис остаётся простым и понятным; «предводители» и «община» сохраняют историческую и коллективную окраску без архаизации.
