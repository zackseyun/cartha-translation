  terminology: «Предводители» адекватно передаёт הַנְּשִׂיאִים, «община» — הָעֵדָה, а «Яхве, Богом Израиля» правильно воспроизводит божественное имя и приложение в творительном падеже. Передача имени «Яхве» согласуется с указанным актуальным решением аудиторской документации; расхождение в одном пункте английского лексического аудита, где упомянуто «the LORD», не требует изменения русского текста, поскольку английское богословское решение прямо предписывает «Yahweh».
