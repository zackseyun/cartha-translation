source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: ru
  text: Поступим с ними так и оставим их в живых[a], чтобы на нас не пал гнев[b] из-за клятвы, которую мы им дали».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохраним им жизнь»; или: «пощадим их».'
    reason: lexical_alternative
  - marker: b
    text: По контексту, вероятно, имеется в виду Божий гнев, хотя в еврейском тексте Господь прямо не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Поступим с ними так
  rationale: Передаёт указательное זֹאת как ввод предлагаемого образа действий, а имперфект נַעֲשֶׂה — как намерение совершить действие. Русское «поступить с ними» естественно выражает сочетание עשה с ל.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: и оставим их в живых
  rationale: Хифиль от חיה здесь означает позволить жить или сохранить жизнь. Формулировка естественна по-русски и не уточняет способ пощады.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: чтобы на нас не пал гнев
  rationale: Целевая связь ясна из контекста; выражение «пал гнев» естественно передаёт היה עַל и сохраняет серьёзность предупреждения.
- source_word: עַל הַשְּׁבוּעָה
  choice: из-за клятвы
  rationale: Предлог עַל указывает здесь на основание или причину ожидаемого гнева.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: которую мы им дали
  rationale: Русское «дать клятву кому-либо» идиоматично передаёт Niphal שׁבע с ל, не меняя содержания обязательства.
theological_decisions:
- issue: Кому принадлежит гнев (קֶצֶף)
  choice: В основном тексте оставлено просто «гнев»
  alternative: «гнев Господа»
  rationale: В контексте, вероятнее всего, подразумевается Божий гнев за нарушение клятвы, однако имя Господа в еврейском тексте этого стиха прямо не названо. Перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Координация «и оставим» сохраняет последовательность еврейской фразы; лексика понятна широкому кругу читателей.
