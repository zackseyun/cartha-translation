  source_fidelity: '«Поступим с ними так и оставим их в живых» точно передаёт זֹאת נַעֲשֶׂה לָהֶם וְהַחֲיֵה אֹתָם: предложенное действие в будущем и сохранение жизни не смешиваются с более интерпретирующим «пощадим». «Чтобы на нас не пал гнев» адекватно передаёт опасение гнева, выраженное через וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף, а «из-за клятвы, которую мы им дали» верно выражает причинную связь и клятву, данную им.'
