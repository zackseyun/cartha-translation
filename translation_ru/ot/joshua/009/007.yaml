  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: ru
  text: 'Но люди Израиля сказали хиввеянину: «Может быть, ты живёшь среди нас[a]; как же мне заключить с тобой завет[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди меня»; единственное число, вероятно, отражает речь представителя Израиля от имени всего народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рассечь с тобой завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: люди Израиля
  rationale: При глаголе во множественном числе формально единственное אִישׁ имеет собирательное значение и обозначает представителей Израиля. «Люди Израиля» естественно передаёт эту функцию, не создавая впечатления, будто говорил только один человек.
- source_word: הַחִוִּי
  choice: хиввею
  rationale: 'Сохранено единственное число еврейского текста: назван представитель группы, к которому обращаются израильтяне.'
- source_word: אוּלַי
  choice: может быть
  rationale: Передаёт осторожное подозрение без усиления уверенности и соответствует современному литературному русскому языку.
- source_word: בְּקִרְבִּי
  choice: среди нас
  rationale: Буквально стоит «посреди меня», но говорящий представляет Израиль как общность. Коллективное «среди нас» ясно передаёт географический и общественный смысл; формальная особенность отмечена в сноске.
- source_word: יוֹשֵׁב
  choice: живёшь
  rationale: Причастие от ישׁב здесь означает постоянное или продолжающееся проживание; «живёшь» звучит естественно и точно по контексту.
- source_word: וְאֵיךְ
  choice: Как же
  rationale: '«Же» передаёт вывод из высказанного подозрения: если адресат живёт среди Израиля, заключение завета с ним ставится под вопрос.'
- source_word: אכרות ... בְרִית
  choice: заключить ... завет
  rationale: Нормальное русское соответствие еврейской идиоме «рассечь завет»; сохраняет само понятие завета без неестественной буквальности.
- source_word: לְךָ
  choice: с тобой
  rationale: При глаголе «заключить» русский язык требует естественной конструкции «заключить завет с кем-либо».
theological_decisions:
- issue: Собирательное и представительское единственное число в речи Израиля
  choice: Во фразе בְּקִרְבִּי употребить коллективное «среди нас», а единственное число אכרות передать как «мне заключить»
  alternative: 'Последовательно сгладить формы во множественное число: «среди нас… как же нам заключить»; либо формально сохранить: «посреди меня… как же мне заключить»'
  rationale: Еврейский текст сочетает коллективное обозначение представителей Израиля с формами первого лица единственного числа. Перевод делает первую фразу понятной по-русски, но сохраняет единственное число во второй, не устраняя полностью представительский характер речи и внутреннее напряжение формы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. «Завет» сохранён как точный и общеупотребительный богословско-исторический термин; устаревшие обороты не использованы. Маркеры сносок поставлены непосредственно после соответствующих выражений.
