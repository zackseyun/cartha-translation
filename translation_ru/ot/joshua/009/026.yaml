  text: וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּ֑ן וַ/יַּצֵּ֥ל אוֹתָ֛/ם מִ/יַּ֥ד בְּנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֥א הֲרָגֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: ru
  text: И он поступил с ними так, и избавил их от руки сынов Израиля[a], и те их не убили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: И он поступил с ними так
  rationale: Оборот с עשה и כן означает «сделать так, поступить таким образом». Формулировка естественна по-русски и сохраняет связь с предшествующим контекстом.
- source_word: וַיַּצֵּל
  choice: избавил
  rationale: Порода Hiphil глагола נצל передаёт значение избавления или спасения из-под чьей-либо власти; «избавил» хорошо сочетается с последующим образом «от руки».
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к гаваонитянам.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён конкретный древнееврейский образ руки как власти или силы; он понятен в русском библейском повествовании.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально передаёт мужское множественное число и традиционное национальное обозначение, не заменяя его в основном тексте более обобщённым словом «израильтяне».
- source_word: וְלֹא הֲרָגוּם
  choice: и те их не убили
  rationale: Глагол הרג прямо означает «убить». Указательное местоимение «те» ясно связывает множественное подлежащее с сынами Израиля и устраняет нежелательную русскую местоименную неясность.
theological_decisions:
- issue: Гендерно маркированное собирательное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет явно мужскую форму и исходный образ родства, тогда как более естественный русский национальный термин приводится в примечании.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Двоеточие естественно раскрывает, в чём именно состоял поступок Иисуса Навина, не меняя смысловой последовательности еврейских предложений.
