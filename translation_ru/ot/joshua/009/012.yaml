  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: ru
  text: 'Вот наш хлеб: он был ещё тёплым, когда мы взяли его из наших домов в дорогу, в тот день, когда отправились в путь к вам; а теперь, посмотрите, он высох и покрылся пятнами[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал крошиться»; возможно также: «покрылся плесенью». Еврейское слово указывает на точки или пятна, но применительно к старому хлебу его точный смысл неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Вот наш хлеб
  rationale: Передаёт указательное предъявление хлеба как вещественного доказательства; по-русски естественнее, чем буквальное «этот наш хлеб».
- source_word: חָם
  choice: был ещё тёплым
  rationale: Сохраняет буквальное значение «тёплый» и естественно подразумевает свежесть хлеба, не подменяя её прямым утверждением.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: мы взяли его ... в дорогу
  rationale: Глагольная форма означает снабдиться припасами; выражение «взяли ... в дорогу» естественно по-русски и удерживает хлеб в роли объекта.
- source_word: מִבָּתֵּינוּ
  choice: из наших домов
  rationale: Сохранён конкретный множественный образ исходного текста.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: в день выхода
  rationale: Близко передаёт временную конструкцию и остаётся понятным в контексте отправления в путь.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: к вам
  rationale: Передаёт направление движения без неестественного для русского дублирования «идти к вам» после выражения «в дорогу».
- source_word: וְעַתָּה הִנֵּה
  choice: а теперь, посмотрите
  rationale: «А теперь» выражает контраст, а «посмотрите» сохраняет призыв обратить внимание на предъявляемое доказательство.
- source_word: יָבֵשׁ
  choice: он высох
  rationale: Естественно передаёт нынешнее состояние хлеба как результат прошедшего времени.
- source_word: וְהָיָה נִקֻּדִים
  choice: покрылся пятнами[a]
  rationale: Нִקֻּדִים буквально связано с точками или пятнами. Перевод сохраняет наблюдаемый признак и не разрешает неопределённость в пользу плесени или крошливости.
