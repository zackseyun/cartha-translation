base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: ru
  text: Израильтяне отправились и на третий день пришли к городам тех людей. Это были Гаваон, Кефира, Беэрот и Кириат-Иеарим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в повествовательной форме обозначает выступление в путь; «отправились» естественно передаёт начало движения, не добавляя прямо не выраженного упоминания о снятии лагеря.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Буквально «сыны Израиля», но в данном контексте это устойчивое обозначение народа. «Израильтяне» ясно и естественно передаёт его этническое значение в современном русском языке.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: пришли к их городам
  rationale: Сочетание בוא с אֶל означает прибытие к указанному месту; предлог «к» сохраняет формулировку источника и не утверждает сверх текста, что израильтяне вошли внутрь городов.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Прямое и обычное соответствие еврейскому временному обороту в повествовании.
- source_word: וְעָרֵיהֶם
  choice: Города же их были
  rationale: Союз вводит поясняющее перечисление. Частица «же» естественно отмечает переход к уточнению, сохраняя связь с предыдущей фразой.
- source_word: גִּבְעוֹן
  choice: Гаваон
  rationale: Устоявшаяся и узнаваемая русская библейская форма топонима.
- source_word: הַכְּפִירָה
  choice: Кефира
  rationale: Передача еврейского названия כְּפִירָה средствами русской транслитерации с сохранением узнаваемой библейской формы.
- source_word: בְּאֵרוֹת
  choice: Беэрот
  rationale: Транслитерация еврейского топонима, отражающая конечный согласный ת и потому более близкая к исходной форме, чем традиционное «Беероф».
- source_word: קִרְיַת יְעָרִים
  choice: Кириат-Иеарим
  rationale: Транслитерация составного еврейского топонима; дефис показывает единство названия, а написание сохраняет различимость его двух компонентов.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным ритмом. Этноним передан естественным словом «израильтяне», а топонимы — узнаваемыми либо близкими к еврейскому оригиналу русскими формами. Повтор союза в начале сохранён для передачи последовательности еврейского повествования.
