  text: וְ/אֵ֣ת כָּל אֲשֶׁ֣ר עָשָׂ֗ה לִ/שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן לְ/סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וּ/לְ/ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן אֲשֶׁ֥ר בְּ/עַשְׁתָּרֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: ru
  text: и обо всём, что Он сделал с двумя аморрейскими царями, жившими за Иорданом[a], — с Сихоном, царём Хешбона, и с Огом, царём Башана, который был в Аштароте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на другой стороне Иордана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «который находился в Аштароте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר
  choice: и обо всём, что
  rationale: Союз продолжает перечисление предыдущего стиха, а сочетание כָּל אֲשֶׁר обозначает совокупность всех упомянутых деяний. Предлог «о» обусловлен русским управлением глагола «слышали» из контекста стиха 9.
- source_word: עָשָׂה
  choice: Он сделал
  rationale: Общее значение глагола — «делать». Местоимение сохраняет не названный прямо в этом стихе субъект; прописная буква указывает на Господа согласно ближайшему контексту, не вставляя само имя.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: с двумя аморрейскими царями
  rationale: При עשה предлог לְ указывает на тех, с кем нечто было сделано. Русское «сделал с» естественно и не усиливает выражение до более истолковывающего «сделал против».
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: жившими за Иорданом
  rationale: בְּעֵבֶר означает сторону по ту сторону реки. Причастный оборот естественно связывает географическое определение с царями; лексическая вариативность отмечена в сноске.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: с Сихоном, царём Хешбона
  rationale: Сохраняются имя, царский титул и географическое название; русская пунктуация ясно оформляет приложение.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: и с Огом, царём Башана
  rationale: Передана синтаксическая параллель с упоминанием Сихона.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: который жил в Аштароте
  rationale: Относительное придаточное естественнее всего относится к Огу. Предлог בְּ допускает обозначение пребывания или местонахождения; это отражено в сноске.
theological_decisions:
- issue: Не выраженный существительным субъект עָשָׂה
  choice: «Он» с прописной буквы, с опорой на контекст
  alternative: Явно вставить «Господь» либо написать «он» со строчной буквы
  rationale: В еврейском тексте субъект заключён в форме глагола и прямо не назван, тогда как предыдущий стих указывает на Господа. Местоимение сохраняет форму источника и не добавляет Божьего имени; прописная буква предотвращает неясность в русском тексте.
- issue: К чему относится אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: 'К Огу: «который жил в Аштароте»'
  alternative: Понять оборот как более общее указание на местонахождение или резиденцию царя без глагола «жил»
  rationale: Ближайший грамматический антецедент — Ог; перевод сохраняет эту естественную связь, не уточняя характер его пребывания сверх текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис согласован с продолжающейся из предыдущего стиха речью: начальное «и обо всём» намеренно сохраняет зависимость от «мы слышали». Имена переданы в привычной русской библейской форме; фраза остаётся понятной без архаизмов.'
