  naturalness: Текст в целом литературен и понятен. «Аморрейскими царями» и привычные формы имён естественны. Для последнего определения «который был в Аштароте» точнее и не менее естественно, чем «который жил в Аштароте».
  terminology: «Аморрейские», «Иордан», «Сихон», «Хешбон», «Ог», «Башан», «Аштарот» употреблены последовательно и соответствуют устоявшейся русской библейской передаче. Прописное «Он» уместно в данном контексте и сохраняет невыраженность субъекта в самом стихе.
