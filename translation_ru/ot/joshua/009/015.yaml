  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: ru
  text: Иисус Навин заключил с ними мир и заключил с ними завет[a], чтобы сохранить им жизнь[b], а вожди общины[c] дали им клятву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально означает «резать» или «отсекать»; выражение «резать завет» — идиома со значением «заключить завет».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы оставить их в живых».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «главы собрания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם ... שָׁלוֹם
  choice: заключил с ними мир
  rationale: Еврейская идиома означает установление мирных отношений. «Заключил мир» естественно звучит по-русски и передаёт политико-договорный смысл.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована традиционная русская библейская форма имени, позволяющая отличить этого Иисуса от других носителей того же еврейского имени.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: заключил с ними завет
  rationale: Буквальная еврейская идиома — «разрезал завет», однако по-русски нормативным и понятным соответствием служит «заключил завет»; ключевой термин «завет» сохранён.
- source_word: לְחַיּוֹתָם
  choice: чтобы сохранить им жизнь
  rationale: 'Инфинитив выражает цель завета: оставить гаваонитян в живых. Формулировка передаёт этот смысл ясно, не уточняя сверх текста способ их спасения.'
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: дали им клятву
  rationale: Глагол обозначает принесение клятвы. «Дали им клятву» естественнее современного русского «поклялись им» и сохраняет адресованность обязательства.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: вожди общины
  rationale: נְשִׂיאִים — признанные главы или вожди, а עֵדָה — собранная община Израиля. Выражение сохраняет общественно-заветный характер, не привнося поздней церковной терминологии.
theological_decisions:
- issue: Передача формулы заключения завета
  choice: заключил с ними завет
  alternative: 'буквально: «разрезал с ними завет»'
  rationale: Русская идиома сохраняет юридический и богословский смысл завета, тогда как буквальное калькирование было бы неясным и могло бы ошибочно направить внимание на физическое действие.
- issue: Цель завета — לְחַיּוֹתָם
  choice: чтобы сохранить им жизнь
  alternative: чтобы оставить их в живых
  rationale: Оба варианта возможны; выбранный естественно передаёт обязательство не умерщвлять их, не снимая нравственного и повествовательного напряжения, связанного с обманом гаваонитян и клятвой Израиля.
- issue: Значение הָעֵדָה
  choice: община
  alternative: собрание; общество
  rationale: «Община» передаёт совокупность Израиля как организованного народа, но не отождествляет её с какой-либо поздней конфессиональной структурой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «заключил» сохранён ради параллелизма двух последовательных действий — установления мира и заключения завета. Союз «а» перед последней частью естественно выделяет отдельное действие вождей, не создавая смыслового противопоставления.
