  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: ru
  text: 'Они пошли к Иисусу Навину в стан, находившийся в Галгале, и сказали ему и израильтянам: «Мы пришли из далёкой страны. Теперь заключите с нами союз[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключите с нами договор». Буквально по-древнееврейски: «разрубите союз с нами».'
    reason: Лексическая альтернатива для בְרִית и пояснение древнееврейской идиомы כרת ברית.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Они пошли
  rationale: Обычное значение הלך — «идти»; повествовательная форма передаёт последовательное действие без замены на ориентированное к говорящему «пришли».
- source_word: אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה הַגִּלְגָּל
  choice: к Иисусу Навину, в стан в Галгале
  rationale: Повторение אֶל обозначает направление к Иисусу Навину и к месту расположения стана. Русская конструкция сохраняет оба элемента и звучит естественно.
- source_word: הַמַּחֲנֶה
  choice: стан
  rationale: מַחֲנֶה означает лагерь или стан; «стан» уместен в повествовании о расположении Израиля и сохраняет достоинство библейского регистра.
- source_word: אֵלָיו וְאֶל־אִישׁ יִשְׂרָאֵל
  choice: ему и израильтянам
  rationale: אִישׁ יִשְׂרָאֵל — собирательная конструкция. «Израильтянам» естественно передаёт коллективных адресатов и не вводит неоправданного ограничения только взрослыми мужчинами.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: из далёкой земли
  rationale: Сохраняет значения אֶרֶץ «земля, страна» и רְחוֹקָה «далёкая», а также заявление о географической удалённости.
- source_word: בָּאנוּ
  choice: мы пришли
  rationale: Русский прошедший вид естественно описывает завершённое прибытие, результат которого актуален в момент речи.
- source_word: וְעַתָּה
  choice: теперь
  rationale: Передаёт переход от изложенного основания к просьбе; логическая связь ясна из контекста и не требует добавления «поэтому».
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: заключите с нами союз
  rationale: Идиома буквально говорит «разрубите/срежьте союз», но по-русски нормативно «заключить союз». «Союз» сохраняет широкий смысл בְרִית и подходит дипломатическому контексту.
theological_decisions:
- issue: Передача בְרִית в контексте политического соглашения
  choice: союз
  alternative: 'договор; буквально: «разрубите с нами союз»'
  rationale: «Союз» сохраняет ключевое библейское понятие взаимного обязательства, оставаясь естественным в дипломатическом контексте. «Договор» точнее подчёркивает политико-правовую сторону, но сужает диапазон בְרִית.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной лексикой. Имя «Иисус Навин» использовано в принятой русской библейской форме; синтаксис прямой речи сделан ясным и естественным.
