base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: ru
  text: 'И они сказали ему: «Твои слуги пришли из очень далёкой земли ради имени Яхве, твоего Бога, потому что мы услышали о Его известности[a] и обо всём, что Он сделал в Египте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы услышали весть о Нём»; «мы услышали о Его славе». В еврейском тексте употреблены однокоренные слова; буквально: «мы услышали Его молву (слух о Нём)».'
    reason: Лексическая неоднозначность однокоренной конструкции שָׁמַעְנוּ שָׁמְעוֹ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: И они сказали ему
  rationale: Обычная передача повествовательной формы wayyiqtol; союз сохраняет последовательное течение еврейского рассказа.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: из очень далёкой земли
  rationale: Сохраняет существительное «земля», значение прилагательного «далёкая» и усилитель מְאֹד («очень»), оставаясь естественным по-русски.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: В дипломатической речи это почтительное самообозначение; «слуги» передаёт смиренный тон без излишнего акцента на рабском статусе.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: ради имени Яхве, твоего Бога
  rationale: «Ради имени» непосредственно передаёт לְשֵׁם и сохраняет связь имени Бога с причиной и целью прихода послов.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: мы услышали о Его славе
  rationale: Однокоренная еврейская конструкция означает услышанный слух, молву или известность о ком-либо; «услышали о Его славе» естественно выражает широкую известность деяний Яхве, а неоднозначность отмечена в сноске.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: и обо всём, что Он сделал в Египте
  rationale: Прямая и естественная передача всей относительной конструкции.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение לְשֵׁם в выражении о приходе
  choice: ради имени
  alternative: из-за имени; услышав об имени
  rationale: 'Формулировка сохраняет открытую смысловую связь: имя и известность Яхве выступают основанием и мотивом прихода, без чрезмерного уточнения этой связи.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика сохраняет дипломатически почтительное «твои слуги» и прямое именование Яхве. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской религиозной издательской практикой.
