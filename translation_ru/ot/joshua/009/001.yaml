base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: ru
  text: И когда все цари, находившиеся по ту сторону Иордана[a], в нагорье, в низменности[b] и по всему побережью Великого моря в сторону Ливана, — хеттеи, аморреи, хананеи, ферезеи, евеи и иевусеи — услышали об этом[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Иорданом». Еврейское выражение может указывать на противоположную сторону реки в зависимости от точки отсчёта.'
    reason: lexical_alternative
  - marker: b
    text: То есть в Шефеле — области западных предгорий.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «услышали»; о чём именно, в еврейском тексте здесь прямо не сказано. Слова «об этом» добавлены по контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: И когда ... услышали
  rationale: Сочетание повествовательного וַיְהִי с временным инфинитивным оборотом естественно передаётся по-русски придаточным времени; поскольку предложение продолжается в следующем стихе, оборот оставлен незавершённым.
- source_word: כָּל הַמְּלָכִים
  choice: все цари
  rationale: Прямое соответствие еврейскому сочетанию с квантором כָּל.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: жившие по ту сторону Иордана
  rationale: Добавленное «жившие» естественно связывает относительное придаточное с перечислением областей; выражение «по ту сторону» сохраняет зависимость географической перспективы от точки отсчёта.
- source_word: בָּהָר
  choice: в нагорье
  rationale: Здесь הַר обозначает географическую область центральных возвышенностей, а не отдельную гору.
- source_word: וּבַשְּׁפֵלָה
  choice: в низменности
  rationale: Прозрачный перевод названия западной предгорной области; специальное название указано в примечании.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: и по всему побережью Великого моря
  rationale: חוֹף передано как «побережье», а традиционное еврейское обозначение Средиземного моря сохранено буквально.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: в сторону Ливана
  rationale: Передаёт пространственную направленность выражения, не сводя его более широкое значение к строго определённому «напротив».
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: хеттеи, аморреи, хананеи, ферезеи, евеи и иевусеи
  rationale: Еврейские собирательные формы единственного числа естественно переданы русскими названиями народов во множественном числе.
- source_word: כִשְׁמֹעַ
  choice: услышали об этом
  rationale: В еврейском тексте объект не назван; «об этом» восполняет его из ближайшего повествовательного контекста и отмечено сноской.
