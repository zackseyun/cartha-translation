  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: ru
  text: 'А вот мехи для вина: мы наполнили их, когда они были новыми; посмотрите, они растрескались[a]. И вот наша одежда и наши сандалии — они износились из-за очень долгого пути.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лопнули»; «разорвались».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: мехи для вина
  rationale: נֹאד — сосуд из кожи, употреблявшийся, в частности, для вина. «Мехи для вина» точно передаёт древнюю реалию и понятно современному читателю.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: которые мы наполнили новыми
  rationale: 'Прилагательное חֲדָשִׁים относится к мехам: их наполнили, когда они были новыми. Сжатая конструкция сохраняет порядок и выразительность еврейской речи.'
- source_word: וְהִנֵּה
  choice: посмотрите
  rationale: Частица הִנֵּה привлекает внимание к предъявляемому доказательству; «посмотрите» естественно передаёт эту функцию в прямой речи.
- source_word: הִתְבַּקָּעוּ
  choice: растрескались
  rationale: Глагол обозначает разрыв или появление трещин. «Растрескались» естественно описывает обветшавшие кожаные мехи, не уточняя сверх текста, насколько полным был разрыв.
- source_word: שַׂלְמוֹתֵינוּ וּנְעָלֵינוּ
  choice: наша одежда и наши сандалии
  rationale: שְׂלָמוֹת обозначает одежду в широком смысле, а נְעָלִים в данном историческом контексте точнее передать как «сандалии».
- source_word: בָּלוּ
  choice: совсем износились
  rationale: Глагол означает «износиться, обветшать». Наречие «совсем» вместе с последующей фразой передаёт усилительный элемент מְאֹד.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: от долгого пути
  rationale: Буквально выражение указывает на чрезвычайную протяжённость пути как причину износа. В сочетании «совсем износились от долгого пути» причинность и усиление переданы естественно по-русски.
