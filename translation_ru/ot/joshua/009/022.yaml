  source_fidelity: 'Текст точно передаёт все смысловые компоненты еврейского оригинала: Иисус Навин призывает их, обращается к ним с вопросом об обмане, приводит их заявление о крайней удалённости и противопоставляет ему их действительное проживание среди Израиля. «Хотя сами живёте» естественно выражает контраст וְאַתֶּם, не добавляя нового содержания.'
