  terminology: Имя «Иисус Навин» дано в общепринятой русской библейской форме. «Обманули», «очень далеко», «живёте среди нас» точно и нейтрально передают ключевые выражения. Сноска корректно отмечает более буквальный вариант בְּקִרְבֵּנוּ и её маркер поставлен на соответствующем месте.
