  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: ru
  text: 'Иисус Навин позвал их и сказал им: «Почему вы обманули нас, сказав: „Мы очень далеко от вас“, — хотя сами живёте среди нас[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: позвал их
  rationale: В данном контексте קרא означает, что Иисус Навин вызвал гаваонитян к себе. «Позвал их» естественно передаёт это значение без излишне официального оттенка.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: сказал им
  rationale: Стандартная древнееврейская формула введения прямой речи. По-русски «сказал им» передаёт её естественно, не воспроизводя тяжеловесное буквальное «говорил им, говоря».
- source_word: לָמָּה
  choice: почему
  rationale: Прямой вопрос о причине; «почему» — точный и естественный русский эквивалент.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: вы обманули нас
  rationale: Форма пиэль глагола רמה выражает намеренный обман. «Обманули» сохраняет прямоту и серьёзность обвинения.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: мы очень далеко от вас
  rationale: Сохраняется именная конструкция исходного текста и усиление מְאֹד — «очень».
- source_word: בְּקִרְבֵּנוּ
  choice: среди нас
  rationale: Идиома означает нахождение внутри сообщества или в его пределах. «Среди нас» звучит естественно в современном русском языке; более буквальный вариант отмечен в сноске.
- source_word: יֹשְׁבִים
  choice: живёте
  rationale: Причастие от ישב здесь обозначает постоянное или продолжающееся проживание, а не просто сидение.
theological_decisions:
- issue: Подразумеваемое обвинение в связи с заключённым союзом
  choice: Передать только прямое обвинение в обмане относительно расстояния
  alternative: Расширить формулировку, прямо упомянув последствия для заключённого союза
  rationale: Сам стих обвиняет гаваонитян в ложном утверждении о месте их проживания. Заветные последствия важны для контекста, но не выражены непосредственно в этой фразе и потому не добавляются.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательной интонацией. Имя יְהוֹשֻׁעַ передано в принятой русской библейской форме «Иисус Навин». Конструкция с тире помогает естественно оформить противопоставление между заявлением гаваонитян и действительностью.
