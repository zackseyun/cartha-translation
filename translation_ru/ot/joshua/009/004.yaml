  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: ru
  text: 'Они тоже поступили хитро: отправились, притворившись послами[a], и взяли для своих ослов ветхие мешки и ветхие мехи для вина — лопнувшие и перевязанные[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского глагола неясно. Возможны также переводы: «снарядились» или «запаслись провизией».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «залатанные»; буквально слово может описывать мехи, которые после разрыва связали или стянули.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  choice: пошли на хитрость
  rationale: Существительное обозначает хитрость или изворотливость; в данном повествовании выражение имеет оттенок намеренного обмана. Русская идиома естественно передаёт образ действия.
- source_word: וַיִּצְטַיָּרוּ
  choice: снарядившись
  rationale: Значение редкой и трудной формы спорно. Выбор передаёт подготовку к пути и согласуется с последующим перечислением дорожного снаряжения, не устраняя альтернативного понимания как притворного облика.
- source_word: שַׂקִּים בָּלִים
  choice: ветхие мешки
  rationale: שַׂקִּים — грубые мешки для перевозки груза, а בָּלִים указывает на изношенность и обветшание от употребления.
- source_word: לַחֲמוֹרֵיהֶם
  choice: для своих ослов
  rationale: Предлог выражает назначение или принадлежность мешков; такое сочетание естественно по-русски и не утверждает прямо, что мешки уже были навьючены.
- source_word: נֹאדוֹת יַיִן
  choice: мехи для вина
  rationale: Обычное русское обозначение кожаных сосудов, в которых хранили и перевозили вино.
- source_word: מְבֻקָּעִים
  choice: лопнувшие
  rationale: Причастие от בקע обозначает расколотое или разорванное; применительно к кожаным мехам естественно сказать «лопнувшие».
- source_word: מְצֹרָרִים
  choice: перевязанные
  rationale: Форма, вероятно, описывает связывание повреждённых мехов как способ ремонта. «Перевязанные» ближе к конкретному образу еврейского слова, чем обобщённое «залатанные».
- source_word: גַם הֵמָּה
  choice: они тоже
  rationale: Сочетание связывает действия гаваонитян с реакцией других народов и естественно передаётся современным русским оборотом.
