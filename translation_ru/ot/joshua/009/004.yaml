  source_fidelity: 'Основная проблема — וַיִּצְטַיָּרוּ. В масоретском тексте это трудная форма, но в данном контексте наиболее естественно передать её как притворное представление себя послами/гонцами; «снарядившись» сводит глагол к подготовке и недостаточно отражает обманный характер действия. Альтернативное понимание как приготовления запасов следует оставить в примечании. Остальные предметные детали переданы точно: ветхие мешки, мехи для вина, лопнувшие и перевязанные.'
