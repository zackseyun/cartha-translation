  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: ru
  text: Но сыны Израиля не поразили их[a], потому что вожди общины поклялись им именем Яхве, Бога Израиля. И вся община стала роптать на вождей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не напали на них»; возможно также: «не убили их». В данном контексте еврейский глагол может обозначать поражение с применением смертельной силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: не поразили их
  rationale: Глагол נכה обозначает нанесение удара и в военном контексте может подразумевать нападение или убийство. «Не поразили их» сохраняет конкретность и смысловую широту еврейского выражения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт еврейскую идиому и уместно звучит в современном литературном русском библейском повествовании.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: вожди общины
  rationale: נְשִׂיאִים — признанные руководители народа; «вожди» сохраняет исторический колорит, а «община» естественно передаёт עֵדָה как собранное сообщество Израиля.
- source_word: נִשְׁבְּעוּ לָהֶם בַּיהוָה
  choice: поклялись им именем Яхве
  rationale: При глаголе клятвы ב указывает на того, чьим именем клянутся. Русское «именем Яхве» ясно и естественно выражает эту функцию.
- source_word: וַיִּלֹּנוּ
  choice: стала роптать
  rationale: Глагол לון описывает коллективный недовольный ропот, знакомый по повествованиям о странствиях Израиля. Единственное число согласуется с собирательным «вся община».
- source_word: עַל הַנְּשִׂיאִים
  choice: на вождей
  rationale: После לון предлог עַל обозначает объект ропота; нормативное русское сочетание — «роптать на кого-либо».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено личное имя Бога. Транслитерация «Яхве» сохраняет его статус как имени и не заменяет титулом.
- issue: Передача עֵדָה
  choice: община
  alternative: собрание
  rationale: «Община» передаёт Израиль как собранное целое, не привнося более поздних церковных структур.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. «Сыны Израиля», «вожди» и «роптать» сохраняют достоинство и повествовательные связи с Пятикнижием, оставаясь понятными современному читателю.
