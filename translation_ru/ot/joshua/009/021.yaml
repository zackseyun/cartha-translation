  source_fidelity: 'Основной смысл передан верно: начальники постановляют сохранить гаваонитян в живых, после чего им назначается служебная работа для всей общины. Однако «стали они рубить дрова» несколько ослабляет значение именной характеристики/назначенного постоянного статуса; кроме того, «как и сказали» с частицей «и» менее точно передаёт כַּאֲשֶׁר («как, согласно тому как»).'
  naturalness: Текст в целом понятен и соответствует современному литературному русскому. Сочетание «рубщики дров» в сноске неестественно и не является удачным русским эквивалентом. Формулировка «стали теми, кто рубит дрова и черпает воду» естественна и яснее обозначает назначенную роль.
  terminology: «Начальники» допустимо для הַנְּשִׂיאִים в данном гражданско-общинном контексте; «община» удачно передаёт עֵדָה. «Черпать воду» сохраняет конкретное значение שָׁאַב, не подменяя его более широким «носить воду».
