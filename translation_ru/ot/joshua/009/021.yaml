  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: ru
  text: 'Начальники сказали им: «Пусть живут». И они стали теми, кто рубит дрова и черпает воду для всей общины[a], как сказали им начальники.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рубящие дерево и черпающие воду».'
    reason: Буквально передаёт две субстантивированные причастные формы еврейского текста; основной текст естественно выражает их как назначенную постоянную роль.
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: начальники
  rationale: В повествовании это признанные главы израильской общины. «Начальники» ясно передаёт общественную руководящую роль, не внося монархического оттенка слова «князья».
- source_word: יִחְיוּ
  choice: Пусть живут
  rationale: Имперфект употреблён в юссивном значении и выражает решение сохранить гаваонитянам жизнь.
- source_word: וַיִּהְיוּ
  choice: И стали они
  rationale: Форма обозначает наступившее в результате решения положение, а не просто статическое состояние.
- source_word: חֹטְבֵי עֵצִים וְשֹׁאֲבֵי מַיִם
  choice: рубить дрова и черпать воду
  rationale: Естественная современная русская формулировка ясно передаёт постоянные трудовые обязанности; буквальная именная конструкция сохранена в примечании.
- source_word: לְכָל הָעֵדָה
  choice: для всей общины
  rationale: «Община» передаёт собирательное значение עֵדָה применительно к народу Израиля и звучит естественно в современном русском языке.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: как и сказали им
  rationale: Фраза связывает установленную повинность с предшествующим решением начальников; частица «и» естественно подчёркивает соответствие.
