source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: ru
  text: 'Они ответили Иисусу Навину: «Нам, твоим слугам, было доподлинно сообщено, что Яхве, твой Бог, повелел своему слуге Моисею отдать вам всю землю и уничтожить перед вами всех жителей земли. Поэтому мы очень испугались за свою жизнь из-за вас и сделали это».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Они ответили Иисусу Навину
  rationale: Естественная русская формула ответа; отдельное «и сказали» избыточно, поскольку прямая речь уже следует за глаголом «ответили».
- source_word: הֻגֵּד הֻגַּד
  choice: доподлинно дошло
  rationale: Инфинитив абсолютный при личной форме усиливает достоверность сообщения; безличная конструкция сохраняет пассивный характер еврейского выражения.
- source_word: לַעֲבָדֶיךָ
  choice: до нас, твоих слуг
  rationale: Это почтительное самообозначение гаваонитян, а не акцент на рабском положении; первое лицо естественно в русской прямой речи.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Передаёт личное имя יהוה транслитерацией и сохраняет обращённое к Иисусу Навину «твой Бог».
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: отдать вам всю эту землю
  rationale: В контексте речь идёт о конкретной земле; указательное «эту» естественно выражает контекстуальную определённость артикля.
- source_word: וּלְהַשְׁמִיד
  choice: и уничтожить
  rationale: Передаёт сильное значение השמיד прямо, не ослабляя и не усиливая его современными терминами с дополнительными ассоциациями.
- source_word: מִפְּנֵיכֶם
  choice: перед вами
  rationale: В первой позиции выражает устранение жителей с пути наступающего Израиля.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ
  choice: мы очень испугались за свою жизнь
  rationale: לְנַפְשֹׁתֵינוּ здесь относится к сохранению жизни; единственное число — естественное русское распределительное употребление.
- source_word: מִפְּנֵיכֶם
  choice: из-за вас
  rationale: 'Во второй позиции та же конструкция имеет причинный смысл: страх вызван угрозой со стороны израильтян.'
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: и сделали это
  rationale: Естественно передаёт еврейское «сделали это дело», не добавляя толкования их уловки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Степень категоричности сообщения הֻגֵּד הֻגַּד
  choice: доподлинно дошло
  alternative: нам было точно сообщено
  rationale: Выбранная формулировка передаёт усиление, но не уточняет источник или способ сообщения, которых еврейский текст не называет.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Дипломатическое самоумаление передано словом «слуги»; синтаксис упрощён там, где буквальное повторение «ответили и сказали» звучало бы по-русски тяжеловесно.
