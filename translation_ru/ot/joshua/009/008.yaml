  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: ru
  text: 'Они сказали Иисусу Навину: «Мы — твои слуги[a]». Иисус Навин сказал им: «Кто вы и откуда пришли?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабы». Еврейское עֲבָדֶיךָ может означать и слуг, и рабов; здесь, вероятно, это почтительная формула дипломатического обращения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: Слово עֶבֶד может обозначать как слугу, так и раба. Здесь гаваонитяне употребляют почтительную дипломатическую формулу, заявляя о готовности подчиниться, а не описывая уже существующее юридическое рабство.
- source_word: אֲנָחְנוּ
  choice: мы —
  rationale: В еврейском это именное предложение без выраженной связки. В русском настоящего времени связка не требуется; тире естественно передаёт конструкцию и подчёркивает сказуемое.
- source_word: מִי אַתֶּם
  choice: кто вы
  rationale: Прямо передаёт вопросительное местоимение с личным местоимением, не добавляя отсутствующего в источнике существительного.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: и откуда пришли
  rationale: מֵאַיִן спрашивает об исходном месте, а форма בוא в данном диалоге относится к прибытию собеседников. Русское «откуда пришли» естественно выражает их происхождение или путь прибытия, не навязывая более узкого значения.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: они сказали ... Иисус Навин спросил
  rationale: Последовательность повествовательных форм передана русским прошедшим временем. Во второй реплике глагол «спросил» контекстуально естественно выражает речевой акт, поскольку далее следуют два прямых вопроса.
