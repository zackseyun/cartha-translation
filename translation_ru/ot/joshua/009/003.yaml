  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: ru
  text: А жители Гаваона услышали, что Иисус Навин сделал с Иерихоном и Гаем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но жители Гаваона услышали, что Иисус Навин сделал с Иерихоном и Гаем».'
    reason: Лексико-дискурсивный вариант передачи начального союза וְ с более выраженным противопоставлением.
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: А жители
  rationale: 'יֹשְׁבֵי обозначает жителей, обитателей. Начальное וְ передано союзом «А»: он естественно отмечает переход от реакции царей в 9:1–2 к иной реакции жителей Гаваона, не делая противопоставление чрезмерно резким.'
- source_word: גִבְעוֹן
  choice: Гаваона
  rationale: Использована укоренившаяся в русской библейской традиции форма географического имени; родительный падеж обусловлен словом «жители».
- source_word: שָׁמְעוּ
  choice: услышали
  rationale: Прямое соответствие значению qal перфекта שׁמע; сохраняет образ получения вести, не заменяя его более толковательным «узнали».
- source_word: אֵת אֲשֶׁר
  choice: что
  rationale: Естественно передаёт конструкцию, вводящую содержание услышанного.
- source_word: עָשָׂה
  choice: сделал
  rationale: Прямое значение עשה. Русский совершенный вид уже показывает завершённость предшествующего действия, поэтому плюсквамперфект не требуется.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Употреблена общепринятая русская библейская форма имени, позволяющая отличить этого персонажа от Иисуса Христа.
- source_word: לִֽ/ירִיחוֹ
  choice: с Иерихоном
  rationale: При русском глаголе «сделал» сочетание «что сделал с…» естественно передаёт направленность действия, выраженную ל, без уточняющего толкования «против».
- source_word: וְ/לָ/עָי
  choice: и Гаем
  rationale: Передано параллельно предыдущему названию; использована традиционная русская форма «Гай» в творительном падеже после предлога «с», который синтаксически относится к обоим однородным членам.
theological_decisions:
- issue: Значение начального союза וְ
  choice: А
  alternative: Но; И
  rationale: Контекст указывает на смену участников и различие в их реакции, однако еврейский союз сам по себе допускает простое присоединение. «А» сохраняет переход и умеренный контраст, не усиливая его до однозначного «но».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные русские формы имён «Гаваон», «Иерихон», «Гай» и «Иисус Навин»; синтаксис сделан естественным для современного читателя.
