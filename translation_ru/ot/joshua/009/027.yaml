  - severity: low
    issue: Тире перед «и они делают это доныне» разрывает конструкцию.
    rationale: Оригинал представляет единое сообщение о назначении и его продолжающемся статусе. Более цельная русская конструкция лучше сохраняет его синтаксическую связь.
