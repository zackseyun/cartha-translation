  source_fidelity: 'Основной смысл передан верно: Иисус Навин назначает гаваонитян на постоянные работы по заготовке дров и доставании воды для общины и жертвенника Яхве. Однако «и они делают это доныне» — развёртывающее добавление, которого в оригинале нет; его лучше не вводить как отдельное предложение. Финальный оборот следует привязать к служению без искусственного тире.'
  naturalness: «Назначил их рубить дрова и черпать воду» — современно и естественно. Перестановка «доныне» после указания места делает русскую фразу более плавной и не создаёт впечатления вставного авторского комментария с новым сказуемым.
  terminology: «Община», «жертвенник» и «Яхве» точны и соответствуют регистру. «Черпать воду» сохраняет значение שׁאב — доставать/набирать воду — лучше, чем ограничивающее «носить воду».
