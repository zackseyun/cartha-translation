base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: ru
  text: В тот день Иисус Навин назначил их рубить дрова и черпать воду для общины и для жертвенника Яхве на месте, которое Он изберёт, доныне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: назначил их
  rationale: Буквально глагол נתן означает «дал, поставил», но с последующими причастными обозначениями занятий выражает назначение на определённую работу.
- source_word: חֹטְבֵי עֵצִים
  choice: рубить дрова
  rationale: Выражение обозначает людей, занятых рубкой древесины; глагольная формулировка после «назначил их» естественна в современном русском.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: черпать воду
  rationale: שאב непосредственно означает набирать или черпать воду; перевод сохраняет конкретное действие, не сводя его лишь к переноске.
- source_word: לָעֵדָה
  choice: для общины
  rationale: עֵדָה обозначает собранное сообщество Израиля; «община» передаёт коллективный и религиозный оттенок без архаизма.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: и для жертвенника Яхве
  rationale: Сохраняется связь назначенного служения с жертвенником и передаётся личное имя יְהוָה.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и они делают это доныне
  rationale: Еврейская идиома указывает на продолжение установленного порядка до времени повествователя; добавление явного сказуемого делает эту связь ясной по-русски.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: на месте, которое Он изберёт
  rationale: В данном контексте אֶל относится к месту служения. Будущая форма «изберёт» сохраняет перспективу повествования, а местоимение указывает на подразумеваемого Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет его, не заменяя титулом.
- issue: Субъект глагола יִבְחָר («изберёт»)
  choice: место, которое Он изберёт
  alternative: место, которое будет избрано
  rationale: В устойчивом библейском выражении подразумевается выбор места самим Яхве. Личное местоимение сохраняет активную форму оригинала; прописная буква проясняет референта.
- issue: Связь оборота «доныне»
  choice: установленное служение продолжается до времени повествователя
  alternative: сам Иисус Навин назначает их вплоть до настоящего дня
  rationale: По смыслу контекста продолжается статус и работа гаваонитян, а не одноразовое действие назначения; русская формулировка устраняет ложное синтаксическое прочтение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Избегнуты архаичные «дровосеки» и «водоносы» в пользу точных глагольных обозначений труда. Тире выделяют временное пояснение «и они делают это доныне», не меняя содержания стиха.
