  text: Около трёх тысяч человек из народа поднялись туда, но обратились в бегство перед людьми Гая.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: пошли
  rationale: Глагол עלה буквально означает движение вверх, однако в данном повествовательном контексте обозначает поход к Гаю; русское «пошли» естественно передаёт движение, не добавляя к самому глаголу значения нападения.
- source_word: מִן הָעָם
  choice: из народа
  rationale: עם означает «народ»; речь идёт о части израильского народа, отправленной к Гаю. Буквальное выражение остаётся понятным по контексту.
- source_word: שָׁמָּה
  choice: туда
  rationale: Наречие указывает направление к ранее названному месту; «туда» кратко и естественно передаёт это значение.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: около трёх тысяч человек
  rationale: Префикс כִּ при числительном выражает приблизительность, а אִישׁ после числа служит для счёта людей. «Человек» точнее исходного слова, чем добавляющее военное значение «воинов».
- source_word: וַיָּנֻסוּ
  choice: побежали
  rationale: נוס означает «бежать, спасаясь; обращаться в бегство». В сочетании с «от» русское «побежали» ясно передаёт бегство и звучит естественно.
- source_word: לִפְנֵי
  choice: от
  rationale: В сочетании с глаголом бегства לִפְנֵי указывает, от чьего присутствия или натиска отступают. В современном русском «побежали от» естественнее буквального «перед».
- source_word: אַנְשֵׁי הָעָי
  choice: жителей Гая
  rationale: Конструкция буквально означает «мужчины/люди Гая» и в контексте относится к защитникам города. «Жители Гая» естественно и без излишнего уточнения передаёт их принадлежность к городу.
