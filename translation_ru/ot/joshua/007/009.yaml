- from: Услышат об этом хананеи и все жители этой земли, окружат нас и истребят само имя наше с лица земли[a]. И что тогда Ты сделаешь ради Своего великого имени?
  to: Хананеи и все жители земли услышат, окружат нас и истребят наше имя с лица земли[a]. И что Ты сделаешь ради Своего великого имени?
  rationale: Убраны не выраженные прямо в оригинале уточнения «об этом» и «тогда», а также ненужное усиление «само». Сохранены собирательное «хананеи», военный образ окружения, идиома уничтожения имени и обращение к Божьему великому имени.
