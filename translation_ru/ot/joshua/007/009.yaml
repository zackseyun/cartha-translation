  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: ru
  text: Хананеи и все жители земли услышат, окружат нас и истребят наше имя с лица земли[a]. И что Ты сделаешь ради Своего великого имени?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Истребить имя» — еврейский образ полного уничтожения народа, при котором прекращается его существование и исчезает память о нём.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: Услышат об этом
  rationale: Имперфект имеет будущее значение в описании ожидаемых последствий; добавленное «об этом» естественно передаёт подразумеваемую в еврейском объектную ситуацию — поражение Израиля.
- source_word: הַכְּנַעֲנִי
  choice: хананеи
  rationale: Форма грамматически единственного числа употреблена собирательно и обозначает народ.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: и все жители этой земли
  rationale: Причастная конструкция означает жителей; הָאָרֶץ в контексте относится к окружающей стране, а не ко всей земле как миру.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: окружат нас
  rationale: Сочетание נסב с עַל выражает окружение, здесь — военную угрозу.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: и истребят само имя наше с лица земли
  rationale: Сохранён образ «имени», означающий полное уничтожение народа вместе с памятью о нём; «с лица земли» естественно передаёт масштаб окончательного исчезновения.
- source_word: וּמַה תַּעֲשֶׂה
  choice: И что тогда Ты сделаешь
  rationale: Вопросительное предложение и имперфект переданы прямо; «тогда» делает естественной связь с предполагаемым уничтожением, не меняя смысла.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: ради Своего великого имени
  rationale: Предлог לְ здесь естественно выражает заинтересованность или заботу о Божьем имени; «ради» ясно передаёт обращение к Божьей чести среди народов.
theological_decisions:
- issue: Смысл обращения к «великому имени» Бога
  choice: Просьба защитить публичную честь и славу Бога, связанные в глазах народов с судьбой Израиля
  alternative: Вопрос о том, что Бог сделает со Своим великим именем или для него
  rationale: Контекст связывает возможное истребление Израиля с тем, как окружающие народы воспримут Бога. Формулировка не разворачивает эту заветную связь сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Синтаксис энергичный и понятный; образ «имени» сохранён и пояснён сноской. Местоимения обращения к Богу написаны с прописной буквы в соответствии с принятой русской библейской традицией.
