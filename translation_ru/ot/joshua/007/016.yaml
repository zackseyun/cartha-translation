  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: ru
  text: Иисус встал рано утром и подвёл Израиль, колено за коленом[a], и было взято колено Иуды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвёл Израиль по его коленам».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская идиома; означает, что колено Иуды было выделено в ходе процедуры. Способ определения в этой фразе прямо не назван.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: встал рано утром
  rationale: Сочетание точно передаёт значение породы hифиль глагола שׁכם и временное указание «утром», сохраняя подчёркнуто раннее начало действия.
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Глагол в hифиле означает «приблизить, подвести». «Подвёл» сохраняет образ приближения и процедурный характер действия, не добавляя прямо не названного адресата.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняется собирательное обозначение народа завета, прямо соответствующее еврейскому тексту.
- source_word: לִשְׁבָטָיו
  choice: по коленам
  rationale: Предлог ל здесь обозначает распределение народа по племенным единицам; традиционное русское «колено» уместно в библейском повествовании и понятно в данном контексте.
- source_word: וַיִּלָּכֵד
  choice: было взято
  rationale: Страдательная форма сохраняет еврейскую идиому «быть взятым», которая в контексте означает выделение в ходе определения виновного, но сама по себе не называет способ определения.
- source_word: שֵׁבֶט יְהוּדָה
  choice: колено Иуды
  rationale: Прямо передаёт конструкцию принадлежности и использует установившееся русское обозначение одного из колен Израиля.
theological_decisions:
- issue: Характер процедуры, подразумеваемой формой וַיִּלָּכֵד
  choice: Сохранить идиоматическое страдательное выражение «было взято», не уточняя в основном тексте, кем или каким способом было определено колено.
  alternative: «было избрано»; «было определено по жребию»; «было выявлено»
  rationale: В самом стихе способ действия прямо не указан. Более явная формулировка разрешила бы оставленную текстом неопределённость и внесла бы сведения из контекста в данный стих.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Термин «колено» сохранён как общеупотребительное библейское обозначение племени Израиля; синтаксис сделан ясным и лаконичным.
