  naturalness: Предлагаемое «подвёл Израиль, колено за коленом» ясно передаёт последовательное приведение племенных групп и звучит естественнее в современном литературном библейском повествовании. Пассив «было взято колено Иуды» несколько отмечен библейским регистром, но уместен и объяснён сноской.
