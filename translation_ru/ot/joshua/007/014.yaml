  rationale: 'Добавлено явное «должен подойти» для рода и дома, поскольку это повторяется в исходном тексте и необходимо для естественного русского синтаксиса. Остальные решения сохранены: «на которое укажет» уместно для контекстуального выявления, не навязывает конкретный механизм, а буквальная семантика לכד и возможный жребий отмечены в сноске.'
