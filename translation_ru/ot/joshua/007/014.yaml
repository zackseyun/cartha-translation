  source_fidelity: 'Основная последовательность общественных единиц передана верно: колена → роды → дома → отдельные мужчины. «На которое укажет Яхве» приемлемо передаёт контекстуальное значение לכד как божественного выявления, не утверждая способ отбора в основном тексте. Однако в двух последних звеньях исходного перевода опущено сказуемое «должен подойти», хотя оно повторяется в еврейском тексте; из-за этого фраза о роде и особенно о доме синтаксически неполна и ослабляет процедуру последовательного приближения.'
  naturalness: '«Дом ... — мужчина за мужчиной» в данном виде звучит как неполная конструкция: невозможно непосредственно сказать, что дом есть «мужчина за мужчиной». Явное повторение сказуемого делает русский текст гладким, ясным и сохраняет намеренный повтор оригинала. «Утром вы должны подойти» можно естественно и прямо передать будущим повелительным по функции «утром вы подойдёте».'
  terminology: «Колено», «род» и «дом» удачно сохраняют иерархию терминов. «Мужчина за мужчиной» точно отражает мужской и распределительный характер לַגְּבָרִים. Имя Яхве передано последовательно. Сноска a корректно отмечает буквальное значение глагола и не выносит вероятный жребий в основной текст.
