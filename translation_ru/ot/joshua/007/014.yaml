  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: ru
  text: Утром вы подойдёте по своим коленам. Затем колено, на которое укажет Яхве[a], должно подойти по родам; род, на который укажет Яхве, должен подойти по домам; а дом, на который укажет Яхве, должен подойти мужчина за мужчиной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которое схватит (или захватит) Яхве». Здесь глагол обозначает группу, на которую укажет Яхве, вероятно посредством священного жребия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по мужчинам»; то есть каждого мужчину в доме следовало представить отдельно.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם
  choice: вы должны подойти
  rationale: Глагол קרב здесь обозначает установленное приближение или представление перед Яхве для выявления виновного. «Подойти» сохраняет повторяющийся образ исходного текста, а модальная конструкция естественно передаёт предписание.
- source_word: לְשִׁבְטֵיכֶם
  choice: по своим коленам
  rationale: Предлог выражает распределение по группам. «Колено» — обычное русское обозначение крупных подразделений Израиля.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: на которое укажет
  rationale: לכד обычно означает «схватить, захватить», но здесь описывает выявление группы в ходе последовательного отбора, вероятно посредством жребия. «Укажет» ясно передаёт контекстуальную функцию, а буквальный образ отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: לַמִּשְׁפָּחוֹת
  choice: по родам
  rationale: מִשְׁפָּחָה здесь — подразделение колена, более широкое, чем отдельный дом; «род» естественно передаёт этот уровень общественного устройства.
- source_word: לַבָּתִּים
  choice: по домам
  rationale: בַּיִת означает не здание, а дом как семейно-родовую единицу внутри рода. Краткое «по домам» сохраняет термин и последовательное сужение групп.
- source_word: לַגְּבָרִים
  choice: мужчина за мужчиной
  rationale: גְּבָרִים — форма мужского рода, употреблённая распределительно; перевод сохраняет переход к отдельным мужчинам и не делает выражение гендерно нейтральным.
- source_word: וְהָיָה
  choice: структурно передано последовательностью предписаний
  rationale: Формула вводит очередной этап процедуры. В русском отдельное «и будет» утяжеляло бы фразу, поэтому её функция передана синтаксической последовательностью.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Способ выявления колена, рода и дома
  choice: на которое укажет Яхве
  alternative: которое схватит Яхве; которое выберет Яхве
  rationale: Контекст говорит о божественном выявлении, но сам стих прямо не называет жребий. Основной текст не уточняет механизм, а сноска сохраняет буквальную силу глагола и вероятный процедурный фон.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Термины «колено — род — дом — мужчина» сохраняют последовательное сужение общественных единиц. Повторы намеренно сохранены ради ясности процедуры и соответствия структуре еврейского текста.
