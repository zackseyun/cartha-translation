  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: ru
  text: Затем он подвёл род Иуды, и был выбран род Зерахитов. Затем он подвёл род Зерахитов — по одному мужчине[a], и был выбран Забди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по мужчинам». Вероятнее всего, имеется в виду, что мужчин из рода Зерахитов подводили по одному.'
    reason: Лексическая неоднозначность выражения לַגְּבָרִים.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Хифиль от קרב означает «приблизить, подвести, представить». «Подвёл» естественно передаёт последовательное выведение групп и людей для выявления виновного.
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: Здесь слово обозначает родовую группу внутри колена. Русское «род» точнее и естественнее, чем более узкое «семья».
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Устоявшаяся русская передача имени и названия колена.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: был выбран
  rationale: В данном обрядовом контексте глагол описывает выявление при последовательном отборе. Буквальное «был схвачен» создало бы ложный оттенок физического задержания; «был выбран» сохраняет результативно-пассивный смысл, не уточняя не названный прямо в стихе способ.
- source_word: הַזַּרְחִי
  choice: Зерахитов
  rationale: Форма указывает на потомков Зераха как родовую группу; «род Зерахитов» ясно передаёт это значение.
- source_word: לַגְּבָרִים
  choice: по одному мужчине
  rationale: 'Буквально конструкция допускает «по мужчинам», но в ходе сужающегося отбора, вероятнее всего, имеет распределительный смысл: мужчин рода подводили по одному.'
- source_word: זַבְדִּי
  choice: Забди
  rationale: Передача личного имени непосредственно по древнееврейской форме, без добавления отсутствующего в источнике окончания.
