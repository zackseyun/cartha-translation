  source_fidelity: 'Текст точно передаёт последовательность древнееврейского повествования: приведение рода Иуды, выявление рода Зерахитов, затем приведение этого рода по мужчинам и выявление Забди. Пассивное «был выбран» корректно передаёт וַיִּלָּכֵד в данном контексте, не навязывая способ выбора. Смысл לַגְּבָרִים передан как вероятное распределительное «по одному мужчине», а альтернативное более буквальное понимание сохранено в сноске.'
