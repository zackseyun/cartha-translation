source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: ru
  text: '«Встань, освяти народ и скажи: „Освятитесь к завтрашнему дню, ибо так говорит Яхве, Бог Израиля: в твоей среде, Израиль, есть нечто преданное уничтожению[a]. Ты не сможешь устоять перед своими врагами, пока не удалите из своей среды преданное уничтожению“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское חֵרֶם (хе́рем) — нечто безвозвратно посвящённое Богу; здесь оно подлежит уничтожению. Традиционные варианты: «заклятое», «находящееся под заклятием».'
    reason: Уточнение значения многозначного термина, существенного для контекста.
lexical_decisions:
- source_word: קֻם
  choice: Встань
  rationale: Повеление Иисусу Навину немедленно приступить к действию; современное и естественное соответствие, сохраняющее настойчивость.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: освяти / освятитесь
  rationale: Сохраняет общий корень двух еврейских форм и различие между переходным пиэлем и возвратным хитпаэлем; в контексте речь о ритуальной подготовке народа.
- source_word: לְמָחָר
  choice: к завтрашнему дню
  rationale: Передаёт подготовку с расчётом на следующий день яснее, чем буквальное «на завтра».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: חֵרֶם
  choice: нечто преданное уничтожению / преданное уничтожению
  rationale: В данном контексте обозначает нечто безвозвратно посвящённое и подлежащее уничтожению. Формулировка раскрывает смысл термина без неясного специального слова «заклятое».
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: среди тебя, Израиль
  rationale: Сохраняет прямое обращение и грамматическое единственное число, представляющее Израиль как единое целое.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Ты не сможешь устоять перед своими врагами
  rationale: Идиоматически передаёт неспособность выдержать натиск врагов или одолеть их, не сводя выражение к буквальному вставанию.
- source_word: עַד הֲסִירְכֶם
  choice: пока не удалите
  rationale: Передаёт временную границу, зависящую от исполнения необходимого условия; множественное число сохраняет переход оригинала от олицетворённого Израиля к народу как множеству лиц.
theological_decisions:
- issue: Значение חֵרֶם в контексте суда и войны
  choice: нечто преданное уничтожению / преданное уничтожению
  alternative: заклятое; находящееся под заклятием; посвящённое
  rationale: Термин указывает не просто на проклятый предмет, а на то, что безвозвратно отдано Богу и в данном повествовании подлежит уничтожению. Перевод сохраняет связь посвящения с уничтожением и не превращает её в абстрактное проклятие.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, и отличает его от титула.
- issue: Смена числа при обращении к Израилю
  choice: «среди тебя… Ты… пока не удалите… из своей среды»
  alternative: 'Последовательно множественное число: «среди вас… вы…»'
  rationale: В оригинале Израиль сначала персонифицирован и назван в единственном числе, а в הֲסִירְכֶם обращение переходит во множественное. Эта напряжённость сохранена, а не сглажена.
translation_notes:
  register: Современный литературный русский с достоинством прямой божественной речи. Повтор «освяти / освятитесь» и необычная смена единственного числа на множественное намеренно сохраняют структуру и корпоративное обращение еврейского текста.
