  source_fidelity: В черновике верно переданы разрывание одежд, падение ниц, ковчег Яхве, временной предел и жест с прахом. Однако перестройка «Он и старейшины Израиля оставались там до вечера» заменяет подразумеваемое продолжение общей позы конкретным, но менее точным сообщением о пребывании в месте. В исправлении старейшины прямо включены в действие падения ниц до вечера.
  naturalness: «Пал ниц» — естественный современный литературный и библейски уместный способ передать «пал лицом на землю». Разделение длинной древнееврейской цепочки на два предложения делает русский текст ясным, не добавляя нового события.
  terminology: «Иисус Навин», «ковчег Яхве», «старейшины Израиля» и «прах» употреблены последовательно и уместно. «Прах» в основном тексте сохраняет традиционный русский образ ритуального жеста; примечание поясняет его значение.
