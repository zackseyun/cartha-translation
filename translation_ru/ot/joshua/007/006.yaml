base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: ru
  text: Тогда Иисус Навин разорвал на себе одежды и пал ниц перед ковчегом Яхве до вечера; вместе с ним пали ниц и старейшины Израиля. Они посыпали головы прахом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Посыпание головы прахом было обычным знаком скорби, унижения или траура.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע שִׂמְלֹתָיו
  choice: разорвал на себе одежды
  rationale: В контексте скорби и потрясения глагол קרע обозначает разрывание одежды. Оборот «разорвал на себе одежды» естественен по-русски и ясно передаёт ритуальный жест.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: пал лицом на землю
  rationale: Выражение описывает полное простирание ниц. Формулировка сохраняет телесную конкретность древнееврейского текста и звучит достойно и понятно.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: перед ковчегом Яхве
  rationale: לִפְנֵי передаёт положение «перед» или «в присутствии», а אֲרוֹן здесь обозначает священный ковчег. Личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: עַד הָעֶרֶב
  choice: до вечера
  rationale: Прямое и естественное русское соответствие временному выражению.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: он и старейшины Израиля
  rationale: Местоимение присоединяет Иисуса Навина к старейшинам как совместным участникам продолжительного пребывания перед ковчегом.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: посыпали головы прахом
  rationale: Это естественный русский способ передать древнееврейский жест нанесения праха на голову; «прах» уместен для земли или пыли в ритуальном контексте скорби.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, а не титул. Транслитерация сохраняет различие между именем Яхве и словом «Господь».
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис слегка перестроен ради ясности: совместное действие Иисуса Навина и старейшин выражено отдельным подлежащим, без устранения смысловой связи с простиранием перед ковчегом.'
