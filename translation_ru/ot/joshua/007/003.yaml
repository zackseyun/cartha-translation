  - severity: medium
    issue: Союз אוֹ между двумя приблизительными численностями недостаточно различён.
    rationale: 'Фраза «около двух или трёх тысяч» может означать диапазон в две—три тысячи. В оригинале названы две альтернативы: около двух тысяч либо около трёх тысяч; повтор «около» делает это ясным.'
  - severity: low
