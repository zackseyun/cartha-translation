base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: ru
  text: 'Они вернулись к Иисусу Навину и сказали ему: «Пусть не весь народ[a] поднимается туда. Пусть поднимутся около двух тысяч человек или около трёх тысяч человек и поразят Гай. Не утруждай там весь народ[b], потому что их мало».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «народ» здесь по контексту может обозначать именно воинов — войско или отряд.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Не обременяй там весь народ». Еврейский глагол может означать причинение усталости или лишних тягот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: Они вернулись к Иисусу Навину и сказали ему
  rationale: Последовательные повествовательные формы переданы естественным русским прошедшим временем; «вернулись» сохраняет движение разведчиков обратно к Иисусу Навину.
- source_word: אַל יַעַל כָּל־הָעָם
  choice: Пусть не весь народ идёт туда
  rationale: Сочетание אַל с юссивом выражает совет-запрет. «Народ» сохраняет широкое значение הָעָם, хотя по контексту речь идёт о боеспособных людях; «туда» естественно обозначает подразумеваемое направление к Гаю.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: около двух или трёх тысяч человек
  rationale: Префикс כ в обоих числовых выражениях указывает на приблизительность. Русское объединение «около двух или трёх тысяч» ясно и не создаёт ненужного повтора.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: пусть пойдут ... и поразят Гай
  rationale: עלה в военном контексте обозначает движение к цели, а נכה — нанесение удара. «Поразят» сохраняет более открытую семантику, чем «победят», не предрешая исход.
- source_word: אַל תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: Не утруждай там весь народ
  rationale: Пиэль יגע означает причинять утомление или обременять усилием. «Утруждай» точно и достойно передаёт ненужную тяготу, не усиливая значение до полного изнеможения.
- source_word: כִּי מְעַט הֵמָּה
  choice: потому что их мало
  rationale: Местоимение относится к жителям или защитникам Гая. Русское безличное количественное выражение естественно передаёт краткость оригинала.
