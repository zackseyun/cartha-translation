lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: подвёл
  rationale: Порода hифиль глагола קרב означает «приблизить, подвести, представить». В контексте определения по жребию «подвёл» сохраняет конкретность еврейского выражения.
- source_word: בֵּיתוֹ
  choice: дом его
  rationale: בַּיִת здесь обозначает не строение, а дом как родственно-хозяйственную группу. Формулировка «дом его» сохраняет библейскую социальную категорию и связь с предыдущим контекстом.
- source_word: לַגְּבָרִים
  choice: мужчину за мужчиной
  rationale: Краткое еврейское выражение допускает понимание «по мужчинам» или последовательное представление отдельных мужчин. Выбранный вариант естественно передаёт процедурный смысл, не устраняя неоднозначность без примечания.
- source_word: וַיִּלָּכֵד
  choice: был взят
  rationale: Нифаль глагола לכד буквально означает «быть взятым, пойманным». В данном контексте речь об обнаружении по жребию; «был взят» сохраняет повторяющуюся еврейскую формулу и не заменяет её толкованием «был избран».
- source_word: עָכָן
  choice: Ахан
  rationale: Имя передано в принятой русской библейской форме.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: сын Карми, сын Завди, сын Зераха
  rationale: Полностью сохранена приведённая в еврейском тексте цепь происхождения; имена даны в традиционных русских формах.
- source_word: לְמַטֵּה יְהוּדָה
  choice: из колена Иуды
  rationale: מַטֶּה в данном родоплеменном контексте означает «колено, племя». «Из колена Иуды» — ясная и устоявшаяся русская формулировка.
