source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: ru
  text: Поэтому сыны Израиля не могут устоять перед своими врагами; они обращаются в бегство перед врагами, потому что оказались обречёнными на уничтожение[a]. Я больше не буду с вами, если вы не уничтожите из вашей среды то, что обречено на уничтожение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חֵרֶם (хе́рем) обозначает лицо, предмет или сообщество, посвящённые Богу под уничтожение. Здесь этим словом названы и состояние Израиля, и то, что должно быть уничтожено из его среды. В традиционных переводах встречается «заклятое».
    reason: Поясняет специальный судебно-сакральный термин, его связь в обоих употреблениях стиха и традиционный вариант перевода.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет образное корпоративное обозначение народа и заветный оттенок еврейского выражения; форма понятна в современном литературном русском.
- source_word: יֻכְלוּ
  choice: не могут
  rationale: Имперфект выражает действующую неспособность Израиля противостоять врагам вследствие Божьего суда.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: устоять перед своими врагами
  rationale: Передаёт военный смысл идиомы — удержаться и не потерпеть поражение — естественнее, чем буквальное «встать перед».
- source_word: עֹרֶף יִפְנוּ
  choice: они поворачиваются к врагам спиной
  rationale: Сохраняет еврейский образ поворота затылком, то есть отступления и бегства, не заменяя его истолкованием.
- source_word: הָיוּ לְחֵרֶם
  choice: сами оказались под заклятием
  rationale: Естественно передаёт состояние народа, подпавшего под тот же судебно-сакральный запрет, который относился к присвоенному предмету.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Я больше не буду с вами
  rationale: Конструкция יסף с инфинитивом обозначает прекращение продолжающегося Божьего присутствия при условии непослушания.
- source_word: אִם לֹא
  choice: если не
  rationale: Прямо и естественно сохраняет отрицательное условие; русское «если не» здесь яснее и торжественнее возможного «пока не».
- source_word: תַשְׁמִידוּ
  choice: уничтожите
  rationale: Hiphil глагола שׁמד требует решительного уничтожения, но не уточняет способ.
- source_word: הַחֵרֶם
  choice: заклятое
  rationale: Субстантивированное прилагательное обозначает конкретно то, что было посвящено Богу и определено на уничтожение; сохраняет связь с «под заклятием».
- source_word: מִקִּרְבְּכֶם
  choice: из вашей среды
  rationale: Сохраняет заветную формулу удаления из сообщества и звучит естественно в возвышенной современной прозе.
theological_decisions:
- issue: Различение двух употреблений חֵרֶם в одном стихе
  choice: «оказались под заклятием» для לְחֵרֶם и «заклятое» для הַחֵרֶם
  alternative: «стали обречёнными на уничтожение» и «преданное уничтожению»
  rationale: Один еврейский термин обозначает как положение Израиля под судебно-сакральным запретом, так и конкретное находящееся среди народа заклятое. Повтор корня «заклят-» сохраняет эту намеренную связь, не сводя понятие ни к простой «проклятости», ни только к физическому уничтожению.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Сыны Израиля» и «из вашей среды» сохраняют корпоративную и заветную окраску оригинала; синтаксис упрощён до естественного русского без устранения сурового богословского напряжения текста.
