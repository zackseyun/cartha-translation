  source_fidelity: 'Основной смысл передан точно: неспособность Израиля противостоять врагам, обращение в бегство, последствие херема и условие его устранения сохранены. Однако «под заклятием» для הָיוּ לְחֵרֶם менее точно, чем формулировка, прямо выражающая обречение на уничтожение; слово «заклятие» в современном русском прежде всего обозначает магическую формулу или действие, а не статус посвящения под уничтожение. Вторая часть также должна сохранять лексическую связь с этим термином.'
