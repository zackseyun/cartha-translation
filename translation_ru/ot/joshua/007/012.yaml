  terminology: 'חֵרֶם следует передать последовательно, но без неестественного или вводящего в заблуждение «заклятия»: «обречёнными на уничтожение» / «то, что обречено на уничтожение». Это выражает судебно-сакральный статус и конкретный объект, не навязывая конфессионального толкования. Сноска объясняет специальный термин и его два употребления.'
