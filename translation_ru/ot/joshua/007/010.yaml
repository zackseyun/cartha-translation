  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: ru
  text: 'И сказал Яхве Иисусу Навину: «Встань! Почему ты лежишь лицом вниз?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма; союз сохраняет связь с предшествующим рассказом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: יְהוֹשֻׁעַ
  choice: Иисусу Навину
  rationale: Устоявшаяся русская библейская форма имени, однозначно обозначающая данного персонажа.
- source_word: קֻם לָךְ
  choice: Встань!
  rationale: Естественно передаёт повеление подняться; לָךְ здесь идиоматически усиливает обращённость действия к адресату и не требует отдельного перевода.
- source_word: לָמָּה זֶּה
  choice: Почему
  rationale: Вопросительное сочетание с указательным компонентом естественно передаётся по-русски словом «почему»; отдельное «это» сделало бы фразу тяжеловесной.
- source_word: אַתָּה נֹפֵל
  choice: ты лежишь, пав
  rationale: Причастие описывает нынешнее состояние Иисуса Навина, распростёртого перед Богом; буквальное «падаешь» в русском ошибочно звучало бы как продолжающееся движение.
- source_word: עַל־פָּנֶיךָ
  choice: на лицо
  rationale: Прямо сохраняет древнееврейский образ простёртости лицом вниз; в сочетании «пав на лицо» это естественная русская библейская формула.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер вопроса Бога к Иисусу Навину
  choice: Почему ты лежишь, пав на лицо?
  alternative: Почему ты падаешь на лицо?
  rationale: Форма נֹפֵל в контексте обозначает пребывание в простёртом положении, а не повторяющееся или ещё не завершившееся падение; перевод не добавляет оценки самого поклонного жеста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Краткость и резкость Божьего повеления сохранены; неестественный буквальный синтаксис не воспроизводится.
