source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: ru
  text: Израиль согрешил. Они также нарушили Мой завет, соблюдать который Я повелел им[a]; также взяли кое-что из того, что было предано заклятию[b]; также украли, также солгали и также положили это среди своих вещей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мой завет, который Я повелел им».'
    reason: В русском тексте «соблюдать» добавлено как подразумеваемое дополнение, необходимое для естественного синтаксиса; оно не изменяет смысла.
  - marker: b
    text: Еврейское слово «хе́рем» обозначает то, что было предано заклятию и запрещено к присвоению; в данном контексте это также связано с уничтожением.
    reason: Поясняет специализированный термин חֵרֶם, сохраняя его смысловую многогранность в контексте книги Иисуса Навина.
lexical_decisions:
- source_word: חָטָא יִשְׂרָאֵל
  choice: Израиль согрешил
  rationale: Прямо передаёт богословский вес глагола חטא и сохраняет корпоративное наименование виновного в единственном числе.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: нарушили Мой завет
  rationale: В современном русском «нарушили завет» естественно и точно выражает преступление установленных заветом границ.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: который Я заповедал им соблюдать
  rationale: Русский глагол «заповедать» здесь требует смыслового дополнения; «соблюдать» эксплицирует подразумеваемое отношение к завету, не меняя содержания.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: взяли из заклятого
  rationale: «Заклятое» сохраняет особый сакрально-судебный смысл חֵרֶם — имущества, безвозвратно посвящённого Богу и в данном контексте подлежавшего уничтожению.
- source_word: גָּנְבוּ
  choice: украли
  rationale: Прямой и естественный эквивалент.
- source_word: כִּחֲשׁוּ
  choice: солгали
  rationale: Контекстуально ясное значение; возможные оттенки отрицания и обмана отмечены в сноске.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: положили среди своих вещей
  rationale: כְּלִים имеет широкое значение предметов, утвари или имущества; «вещи» естественно обозначает личное имущество, среди которого спрятали взятое.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: также ... [перечень однородных обвинений]
  rationale: Первое «также» передаёт нарастающее присоединение обвинений, а далее русское бессоюзное перечисление сохраняет риторическое накопление без тяжеловесного многократного повтора.
theological_decisions:
- issue: Корпоративное вменение греха Израилю при поступке одного человека
  choice: Сохранены «Израиль согрешил» и последующие формы множественного числа.
  alternative: Сузить обвинение до Ахана или заменить множественное число единственным.
  rationale: Еврейский текст прямо называет субъектом Израиль, а затем употребляет глаголы во множественном числе; перевод не должен устранять напряжение между личной и корпоративной ответственностью.
- issue: Значение חֵרֶם
  choice: «заклятое»
  alternative: «то, что было обречено на уничтожение» или «посвящённое Богу»
  rationale: В контексте Иисуса Навина термин сочетает посвящение Богу и запрет на присвоение, часто с уничтожением; краткий традиционно понятный термин сохраняет эту смысловую ёмкость, а сноска разъясняет её.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавные буквы в местоимениях Бога соответствуют принятой русской издательской традиции. Сохранён резкий судебный перечень обвинений; чрезмерно тяжеловесный повтор «и также» в каждом звене не воспроизводится механически.
