  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранены корпоративный субъект «Израиль» при последующих формах множественного числа, заветная терминология и последовательность обвинений. Однако повторяемое וְגַם («и также») в еврейском тексте образует намеренно нарастающий перечень; в черновике он почти полностью нивелирован. Формулировка «взяли из заклятого» также слишком эллиптична и в современном русском может быть неясна без пояснения.'
  naturalness: «Нарушили Мой завет, который Я заповедал им соблюдать» понятно, но несколько тяжеловесно; оборот «соблюдать который Я повелел им» естественнее и яснее. «То, что было предано заклятию» передаёт חֵרֶם доступнее, не сводя его к одному лишь уничтожению.
  terminology: «Согрешил», «завет» и «заклятие» уместны в современном литературном библейском регистре. Для חֵרֶם сохранён термин «заклятие» с кратким пояснением. «Солгали» допустимо как контекстуальное значение כִּחֲשׁוּ; сноска отмечает более широкие оттенки отрицания или обмана.
