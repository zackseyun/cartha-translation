base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: ru
  text: Они взяли их изнутри шатра, принесли к Иисусу Навину и ко всем сынам Израиля и разложили[a] перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол, переведённый как «разложили», обычно означает «вылили» или «высыпали». Здесь речь идёт о найденных вещах, помещённых перед Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: они взяли всё это
  rationale: Глагол לקח в данном повествовательном контексте означает «взять». Местоименный суффикс мужского рода множественного числа относится к ранее названным найденным вещам; русское собирательное «всё это» естественно передаёт эту связь.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: из шатра
  rationale: תּוֹךְ указывает на внутренность пространства. В русском сочетание «взяли из шатра» естественно выражает извлечение изнутри, не утяжеляя фразу словами «изнутри шатра».
- source_word: וַיְבִאוּם
  choice: принесли
  rationale: Каузативная форма בוא имеет обычное значение «принести». Она передаёт перемещение вещей, не добавляя церемониального оттенка «представили».
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: к Иисусу Навину и ко всем сынам Израиля
  rationale: Повторное אֶל передано естественной русской конструкцией «к... и ко...». Традиционное русское имя «Иисус Навин» однозначно обозначает персонажа; «сыны Израиля» сохраняет форму устойчивого древнееврейского этнонима.
- source_word: וַיַּצִּקֻם
  choice: разложили
  rationale: יצק буквально часто означает «лить, выливать», однако здесь его объект — найденные вещи. «Разложили» естественно передаёт их размещение для обозрения, тогда как буквальное «высыпали» было бы более конкретным и могло бы ложно указывать на способ обращения со всеми предметами.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии». Передача тетраграмматона личным именем «Яхве» сохраняет исходную форму как имя, а не заменяет её титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יְהוָה. «Яхве» прямо отражает его как имя; традиционное «Господь» является почтительной заменой титулом и потому не помещено в основной текст.
- issue: Значение לִפְנֵי יְהוָה в сцене предъявления найденного
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: Краткое «перед Яхве» сохраняет пространственный и богословский оттенки исходного выражения, не уточняя без основания, каким именно образом присутствие Яхве понималось в этой сцене.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формула обозначает народ Израиля, но буквально имеет форму «сыны Израиля». Основной текст сохраняет традиционную формулу и её повествовательно-заветный оттенок; «израильтяне» было бы более гладким, но менее прозрачным.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Шатёр» выбран вместо более архаичного «скиния», поскольку здесь обычное жилище. Синтаксис сделан плавным, но последовательность действий и формула «сыны Израиля» сохранены.
