base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: ru
  text: Прошу, Господи, что мне сказать после того, как Израиль повернулся спиной к своим врагам?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернул шею (затылок) перед своими врагами»; это еврейский образ отступления и поражения в бою.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: О
  rationale: В обращении к высшему лицу частица выражает настойчивую, почтительную мольбу. Русское «О» естественно передаёт эмоциональное молитвенное восклицание, не навязывая буквального пространственного значения.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Форма звательного падежа естественно передаёт почтительное непосредственное обращение к Богу и не подменяет данный титул отсутствующим здесь именем Бога.
- source_word: מָה אֹמַר
  choice: Что мне сказать
  rationale: Так передаётся буквальный вопрос с формой несовершенного вида, способной выражать будущее или модальное значение. Русская формулировка сохраняет и вопрос, и ощущение беспомощности Иисуса Навина.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: после того, как
  rationale: Естественная русская конструкция, вводящая обстоятельство, ставшее причиной вопроса.
- source_word: הָפַךְ ... עֹרֶף
  choice: повернулся спиной
  rationale: Выражение буквально связано с поворотом затылка или спины и в военном контексте обозначает отступление перед неприятелем. Перевод сохраняет образ исходного текста, а примечание поясняет его смысл.
- source_word: לִפְנֵי אֹיְבָיו
  choice: к своим врагам
  rationale: При русском выражении «повернуться спиной» направление естественно обозначается предлогом «к». Возвратное «своим» согласуется с коллективным обозначением народа Израиля.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господи
  alternative: мой Господь
  rationale: Здесь אֲדֹנָי употреблено как устойчивый благоговейный титул Бога в прямом обращении. «Господи» естественно для русского языка и не усиливает притяжательное значение, которое в данном употреблении не обязательно.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Краткое восклицание передаёт отчаяние и почтительность; военный образ сохранён без архаизации.
