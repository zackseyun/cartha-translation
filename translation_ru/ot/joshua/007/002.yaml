base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: ru
  text: 'Иисус Навин послал из Иерихона людей в Гай, который находится близ Бет-Авена[a], к востоку от Бет-Эля, и сказал им: «Поднимитесь и разведайте землю». Люди поднялись и разведали Гай.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который расположен рядом с Бет-Авеном»; буквально: «который с Бет-Авеном». Здесь еврейский предлог может обозначать географическую близость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычная передача повествовательной формы глагола שלח; естественно и точно обозначает поручение.
- source_word: אֲנָשִׁים
  choice: людей
  rationale: В контексте ясно, что речь о мужчинах-разведчиках; русское «людей» естественно после глагола «послал» и не меняет референта.
- source_word: מִירִיחוֹ
  choice: из Иерихона
  rationale: Предлог מִן обозначает исходный пункт; использована нормативная русская форма топонима.
- source_word: הָעַי
  choice: Гай
  rationale: Традиционная и узнаваемая русская передача названия города עַי; еврейский артикль перед топонимом отдельно не передаётся.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: который находится близ Бет-Авена
  rationale: עִם буквально означает «с», но в географическом описании выражает соседство или близость; «близ» сохраняет пространственный смысл без чрезмерной конкретизации.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: к востоку от Бет-Эля
  rationale: Географическое выражение указывает положение Гая восточнее Бет-Эля.
- source_word: עֲלוּ
  choice: поднимитесь
  rationale: Сохраняет направительный оттенок עלה — движение вверх, вероятно в более высокую местность.
- source_word: וְרַגְּלוּ
  choice: разведайте
  rationale: Пиэль רגל обозначает разведку местности; «разведайте» естественно передаёт военный контекст.
- source_word: אֶת הָאָרֶץ
  choice: эту землю
  rationale: «Землю» соответствует אָרֶץ, а указательное «эту» естественно по-русски обозначает территорию, о которой только что шла речь, хотя формально в еврейском стоит определённый артикль.
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Повторяет корень עלה из приказа и сохраняет направительный оттенок и повествовательный отклик.
- source_word: וַיְרַגְּלוּ
  choice: разведали
  rationale: Сохраняет лексическую связь с повелением וְרַגְּלוּ и военный смысл действия.
