  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: ru
  text: 'Тогда Иисус Навин сказал Ахану: «Сын мой, прошу тебя, воздай славу Яхве, Богу Израиля, и возблагодари Его[a]. Прошу, расскажи мне, что ты сделал; ничего от меня не скрывай».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и воздай Ему хвалу»; в данном контексте возможно также: «и признайся перед Ним».'
    reason: Слово תוֹדָה обычно означает благодарение или благодарность; оно может также иметь оттенок хвалы, а в данном контексте — исповедания или признания.
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет мужской род, личный характер обращения и его отечески-торжественный тон.
- source_word: שִׂים נָא כָבוֹד
  choice: прошу тебя, воздай славу
  rationale: Еврейская идиома буквально говорит «положи славу», но по смыслу призывает признать Божью славу. «Прошу тебя» естественно передаёт вежливую частицу נָא.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, обозначенное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: и воздай Ему хвалу[a]
  rationale: Слово תוֹדָה может обозначать хвалу, благодарение или признание/исповедание. Основной текст сохраняет широкое обращённое к Богу значение, а контекстуально важные варианты отмечены в сноске.
- source_word: וְהַגֶּד נָא לִי
  choice: Прошу, расскажи мне
  rationale: Естественно передаёт каузативный императив נגד и повторную вежливую частицу נָא.
- source_word: מֶה עָשִׂיתָ
  choice: что ты сделал
  rationale: Передаёт завершённое действие, непосредственно относящееся к допросу Ахана.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: ничего от меня не скрывай
  rationale: כחד означает скрывать или утаивать; «ничего» естественно восполняет подразумеваемый объект в русском языке, не меняя смысла.
theological_decisions:
- issue: Значение תוֹדָה в контексте призыва к признанию вины
  choice: В основном тексте — «воздай Ему хвалу», с вариантами в сноске
  alternative: «возблагодари Его» или, с учётом контекста, «признайся перед Ним»
  rationale: Судебно-исповедальный контекст делает значение «признание» вероятным, однако семантический диапазон слова шире. Сноска сохраняет эту напряжённость, не сужая значение в основном тексте.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация позволяет отличить личное имя Бога от титула אֲדֹנָי и следует представленному консультационному тексту, не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Повтор «прошу» сохраняет обе частицы נָא; местоимение «Ему» написано с прописной буквы как принято в уважительном библейском регистре.
