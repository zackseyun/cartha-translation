  choice: одну красивую одежду из Сеннаара
  rationale: אַדֶּרֶת — верхняя, нередко роскошная одежда или накидка; нейтральное «одежда» сохраняет широту значения, а «из Сеннаара» указывает на происхождение.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: двести шекелей серебра
  rationale: Сохранена древняя мера веса без приблизительного пересчёта.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: один слиток золота
  rationale: Буквально «один язык золота»; в контексте речь, вероятно, о языкообразном куске золота, для которого «слиток» является естественным русским обозначением.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: весом в пятьдесят шекелей
  rationale: Естественно передаёт буквальное указание «его вес — пятьдесят шекелей».
- source_word: וָאֶחְמְדֵם
  choice: Я возжелал их
  rationale: חמד выражает сильное желание и в данном контексте неправомерного присвоения имеет явную нравственную окраску.
- source_word: וָאֶקָּחֵם
  choice: и взял
  rationale: Прямое соответствие обычному значению לקח без неоправданного усиления.
- source_word: וְהִנָּם
  choice: Вот, они
  rationale: «Вот» сохраняет указательную силу частицы и непосредственность признания.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: спрятаны в земле
  rationale: Причастие означает сокрытие, а בָּאָרֶץ в обстановке шатра указывает на грунт, куда были спрятаны предметы.
- source_word: בְּתוֹךְ הָאָֽהֳלִי
  choice: внутри моего шатра
  rationale: Точно и естественно передаёт внутреннее местоположение.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: а серебро — под одеждой
  rationale: Женский суффикс единственного числа наиболее естественно относится к одежде; повтор существительного по-русски устраняет неясность местоименного рода, не меняя референции.
