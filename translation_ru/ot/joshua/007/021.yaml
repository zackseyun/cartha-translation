base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: ru
  text: Я увидел среди добычи одну прекрасную накидку из Сеннаара[a], двести шекелей серебра и один слиток золота[b] весом в пятьдесят шекелей. Я возжелал их и взял. Вот, они спрятаны в земле внутри моего шатра, а серебро — под ней[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одну прекрасную верхнюю одежду из Сеннаара». Еврейское слово может обозначать нарядную верхнюю одежду, накидку, плащ или мантию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «один язык золота» — вероятно, языкообразный кусок или слиток золота.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте: «под ней». Местоименный суффикс стоит в женском роде и, вероятнее всего, относится к накидке.'
    reason: lexical_alternative
