base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: ru
  text: 'Ахан ответил Иисусу Навину: «Воистину, я согрешил против Яхве, Бога Израиля, и вот что я сделал[a]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так и так я сделал». Это еврейское выражение вводит подробности того, что было сделано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן עָכָן אֶת־יְהוֹשֻׁעַ וַיֹּאמַר
  choice: Ахан ответил Иисусу Навину
  rationale: Сочетание «ответил и сказал» обычно передаётся по-русски одним естественным глаголом «ответил»; адресат выражен дательным падежом.
- source_word: אָמְנָה
  choice: Воистину
  rationale: Передаёт торжественное и усиленное признание; слово литературно и понятно, не добавляя значения уверения сверх оригинала.
- source_word: אָנֹכִי חָטָאתִי
  choice: я согрешил
  rationale: Самостоятельное местоимение сохраняется как «я»; форма совершенного вида естественно выражает признание совершённого проступка.
- source_word: לַיהוָה
  choice: против Яхве
  rationale: При глаголе חטא предлог ל обозначает сторону, против которой совершен грех; личное имя יהוה передано как «Яхве».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямо передаёт конструкцию принадлежности и определение Яхве как Бога Израиля.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: и вот что я сделал
  rationale: Повторная формула буквально близка к «так и так я сделал», но идиоматически вводит последующее подробное признание; «вот что я сделал» естественно выполняет эту функцию в современном русском.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и согласуется с заданным консультационным слоем.
- issue: Направленность греха в сочетании חטא ל
  choice: согрешил против Яхве
  alternative: согрешил перед Яхве; согрешил Яхве
  rationale: «Против» ясно передаёт Яхве как оскорблённую сторону, не ослабляя богословского смысла признания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Имя Joshua передано по устойчивой русской библейской традиции как «Иисус Навин». Двоеточие сохраняет переход к подробностям признания в следующем стихе.
