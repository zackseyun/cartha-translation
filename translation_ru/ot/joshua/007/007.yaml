  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: ru
  text: 'И сказал Иисус Навин: «Ах, Владыка Яхве[a], зачем Ты вообще провёл этот народ через Иордан? Чтобы отдать нас в руки аморреев и погубить нас? Если бы только мы решились остаться по ту сторону Иордана!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Владыка Яхве»; здесь соединены титул אֲדֹנָי («Владыка, Господь») и личное имя Бога יהוה («Яхве»).'
    reason: Пояснение составного обращения и передачи божественного имени.
lexical_decisions:
- source_word: אֲהָהּ
  choice: О
  rationale: Передаёт внезапный возглас скорби и смятения естественно для современного русского языка; «увы» здесь звучало бы более книжно и отстранённо.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт обращение אֲדֹנָי, а «Яхве» сохраняет личное имя Бога, избегая неестественного повторения «Господь Господь».
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: вообще перевёл
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом усиливает вопрос. Частица «вообще» естественно выражает это эмоциональное усиление по-русски.
- source_word: אֶת־הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет единственное число и коллективный, национальный смысл עָם.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: отдать нас в руки аморреев
  rationale: Сохраняет образ власти, выраженный идиомой «дать в руку», но использует естественное русское множественное число «в руки».
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Форма единственного числа имеет собирательное значение и обозначает народ; в русском естественно множественное число.
- source_word: לְהַאֲבִידֵנוּ
  choice: погубить
  rationale: Прямо и весомо передаёт причинный смысл уничтожения, не усиливая его до разговорного «истребить подчистую».
- source_word: וְלוּ הוֹאַלְנוּ
  choice: Если бы только мы решились
  rationale: Передаёт пожелание о нереализованной возможности и волевой оттенок יאל — согласиться, решиться, взять на себя, — не внося отсутствующего значения довольства.
- source_word: וַנֵּשֶׁב
  choice: остаться
  rationale: В контексте пожелания речь идёт не просто о проживании, а о выборе не переходить Иордан и продолжить жить на прежней стороне; «остаться» ясно передаёт этот смысл.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: по ту сторону Иордана
  rationale: Сохраняет относительное пространственное выражение оригинала. В данном повествовательном контексте имеется в виду восточная сторона, откуда Израиль перешёл реку.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Текст содержит титул אֲדֹנָי и тетраграмматон. Передача «Яхве» сохраняет различие между титулом и личным именем и не создаёт повтора одного русского слова.
- issue: Смысл вопроса Иисуса Навина
  choice: Сохранён как резкий вопрос скорби без богословского смягчения
  alternative: Переформулировать как молитвенную просьбу о объяснении
  rationale: Еврейский текст передаёт потрясённый вопрос после поражения. Перевод не должен заранее оправдывать, осуждать или смягчать слова Иисуса Навина.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет порывистость скорбного возгласа и два вопроса. Местоимение «Ты» написано с прописной буквы как принятая русская форма почтительного обращения к Богу; это графическая конвенция, а не особенность еврейского текста.
