revisions:
- from: Тогда Иисус Навин взял Ахана, сына Зераха, серебро, плащ, слиток золота[a], его сыновей и дочерей, его быка, осла, мелкий скот, шатёр и всё, что ему принадлежало. Вместе с ним пошёл весь Израиль, и они вывели всё это и всех их в долину Ахор[b].
  to: Тогда Иисус Навин взял Ахана, сына Зераха, серебро, плащ, слиток золота[a], его сыновей и дочерей, его быка, осла, мелкий скот, шатёр и всё, что ему принадлежало; с ним был весь Израиль, и они привели их в долину Ахор[b].
  rationale: 'Исправлена только заключительная часть: устранено неестественное разворачивание обобщающего местоимения и сохранён единый, неинтерпретированный референт «их», охватывающий всех и всё перечисленное. Структура предложения с точкой с запятой яснее выражает, что весь Израиль был с Иисусом Навином, а затем совместно совершил действие.'
