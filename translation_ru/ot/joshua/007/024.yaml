  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: ru
  text: Тогда Иисус Навин взял Ахана, сына Зераха, серебро, плащ, слиток золота[a], его сыновей и дочерей, его быка, осла, мелкий скот, шатёр и всё, что ему принадлежало; с ним был весь Израиль, и они привели их в долину Ахор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «язык золота», то есть кусок золота, по форме напоминавший язык; традиционный перевод — «золотой клин».'
    reason: lexical_alternative
  - marker: b
    text: Название «Ахор» созвучно еврейскому слову со значением «беда, несчастье».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Тогда Иисус Навин взял
  rationale: Последовательная форма с וַ передвигает повествование вперёд; «тогда» естественно передаёт развитие событий, а «взял» не добавляет не выраженного в глаголе оттенка насильственного захвата.
- source_word: עָכָן בֶּן זֶרַח
  choice: Ахана, сына Зераха
  rationale: Сохранены личное имя и патроним; форма «Зерах» ближе передаёт еврейское זֶרַח, а падежное оформление естественно для русского предложения.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: Слово прямо обозначает серебро и отсылает к ранее названной похищенной вещи; перевод «деньги» был бы более истолковательным.
- source_word: הָאַדֶּרֶת
  choice: плащ
  rationale: Речь идёт о заметной верхней одежде; «плащ» — современное и понятное соответствие без архаического оттенка.
- source_word: לְשׁוֹן הַזָּהָב
  choice: слиток золота
  rationale: Буквально выражение означает «язык золота», то есть кусок золота характерной формы. «Слиток золота» ясно называет предмет, а буквальный образ сохранён в сноске.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: его сыновей и дочерей
  rationale: Еврейский текст раздельно называет сыновей и дочерей, поэтому эта конкретность сохранена.
- source_word: שׁוֹרוֹ ... חֲמֹרוֹ ... צֹאנוֹ
  choice: его быка, осла, мелкий скот
  rationale: Единственное число первых двух существительных сохранено; צֹאן — собирательное обозначение овец и коз, поэтому «мелкий скот» точнее, чем одно лишь «овцы».
- source_word: אָהֳלוֹ
  choice: шатёр
  rationale: Прямое значение слова передано обычным русским обозначением переносного жилища.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: всё, что ему принадлежало
  rationale: Естественно передаёт обобщающее указание на всё его имущество.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Вместе с ним пошёл весь Израиль
  rationale: Местоименный суффикс естественнее всего относится к Иисусу Навину. Глагол «пошёл» добавлен по-русски для ясного выражения сопровождения, не меняя смысла.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: и они вывели всё это и всех их в долину Ахор
  rationale: Глагол движения передан как «вывели» без неестественного для русского буквального «подняли в долину». Развёрнутое «всё это и всех их» ясно охватывает перечисленные вещи, животных и людей, сохраняя широкий референт множественного местоимения.
theological_decisions:
- issue: Следует ли пояснять виновность или невиновность детей Ахана
  choice: Оставить прямое упоминание его сыновей и дочерей без оценки их причастности
  alternative: Добавить пояснение, что они были соучастниками, либо что они лишь присутствовали и не подверглись наказанию
  rationale: Сам стих перечисляет детей Ахана среди выведенных в долину, но не определяет степень их участия. Перевод не разрешает эту богословскую и повествовательную напряжённость за пределами сказанного.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и умеренно высоким библейским регистром. Традиционное русское имя «Иисус Навин» обеспечивает узнаваемость, тогда как остальные имена переданы близко к еврейской форме. Сноски поставлены непосредственно после тех слов, к которым относятся.
