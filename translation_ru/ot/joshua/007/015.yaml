base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: ru
  text: А тот, кто будет обнаружен с заклятым[a], будет сожжён огнём — он и всё, что ему принадлежит, — потому что он нарушил завет Яхве и совершил постыдное дело в Израиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. хе́рем — то, что безвозвратно посвящено Богу, изъято из обычного употребления и в данном случае предназначено для уничтожения; также возможно: «посвящённое уничтожению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: тот, кто будет выявлен
  rationale: Страдательное причастие от לכד здесь описывает человека, которого определят посредством жребия; «выявлен» естественно передаёт судебно-следственный контекст и не подразумевает военного пленения.
- source_word: בַּחֵרֶם
  choice: из-за заклятого
  rationale: חֵרֶם обозначает то, что посвящено Богу и изъято из обычного употребления, в данном контексте предназначенное для уничтожения. «Заклятое» — краткий русский библейский термин, а предлог «из-за» ясно выражает основание выявления виновного в контексте, не сводя значение слова к проклятию.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: будет сожжён огнём
  rationale: Прямо передаёт страдательную форму и инструментальное בָּאֵשׁ, сохраняя выраженный в еврейском тексте акцент на огне.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: он и всё, что ему принадлежит
  rationale: 'Конструкция уточняет объём приговора: виновный и всё принадлежащее ему. Формулировка не конкретизирует сверх текста, входят ли сюда только имущество или также домочадцы.'
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: нарушил завет Яхве
  rationale: עבר с объектом «завет» означает преступление установленных заветом границ; «нарушил» естественно и точно передаёт юридико-заветный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: נְבָלָה
  choice: постыдное дело
  rationale: Здесь נְבָלָה обозначает нравственно возмутительный, позорный поступок, а не интеллектуальную глупость. «Постыдное дело» звучит естественно и сохраняет моральную оценку.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: 'Предлог имеет локативно-общинный смысл: преступление совершено внутри народа завета.'
theological_decisions:
- issue: Значение חֵרֶם в контексте суда за нарушение завета
  choice: заклятое
  alternative: посвящённое уничтожению; находящееся под заклятием
  rationale: Термин совмещает посвящение Богу, запрет на обычное использование и, в данном повествовании, предназначение к уничтожению. Основной текст использует компактный традиционный эквивалент, а сноска раскрывает его смысл, не сводя его просто к «проклятой вещи».
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не заменяет его титулом.
- issue: Объём выражения «всё, что ему принадлежит»
  choice: сохранить широкую формулировку без уточнения
  alternative: явно указать имущество или домочадцев
  rationale: Еврейское выражение широко, а ближайший стих сам по себе не определяет полный состав принадлежащего виновному; перевод не должен молча сужать или расширять его.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-заветной речи. Синтаксис близок к еврейскому, но прояснён тире; термин «заклятое» пояснён в сноске.
