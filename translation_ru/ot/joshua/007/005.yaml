base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: ru
  text: И люди Гая поразили из них около тридцати шести человек, преследовали их от ворот до Шеварима[a] и поразили их на спуске. Тогда сердце народа растаяло и стало как вода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до каменоломен»; возможно также: «до разрушенных мест». Еврейское הַשְּׁבָרִים можно понимать как название места или как нарицательное обозначение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: убили из них
  rationale: В военном контексте נכה обозначает нанесение смертельного поражения; מֵהֶם указывает, что погибшие были из числа израильтян.
- source_word: אַנְשֵׁי הָעַי
  choice: жители Гая
  rationale: Конструкция означает мужчин, принадлежавших городу Гай; в русском повествовании «жители Гая» звучит естественно и ясно в данном военном контексте.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: около тридцати шести человек
  rationale: Префикс כְּ при числительном передаёт приблизительность; אִישׁ здесь служит счётным обозначением людей.
- source_word: וַיִּרְדְּפוּם
  choice: преследовали их
  rationale: רדף — обычный глагол военного преследования.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: от городских ворот
  rationale: Буквально «от места перед воротами»; естественное русское выражение передаёт исходную точку преследования, а уточнение «городских» делает референт ясным.
- source_word: עַד הַשְּׁבָרִים
  choice: до Шеварима
  rationale: Слово допускает понимание как названия места и как нарицательного обозначения; в основном тексте сохранён топоним, а неоднозначность отмечена в сноске.
- source_word: וַיַּכּוּם
  choice: поражали их
  rationale: Повтор נכה передан близким военным глаголом без утверждения, что каждый поражённый на этом участке непременно был убит.
- source_word: בַּמּוֹרָד
  choice: на спуске
  rationale: מוֹרָד обозначает спуск или нисходящий склон; «на спуске» естественно сохраняет топографический смысл.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: сердце народа растаяло
  rationale: Сохранён яркий и понятный древнееврейский образ полной утраты мужества.
- source_word: וַיְהִי לְמָיִם
  choice: стало как вода
  rationale: 'Сохранено продолжение метафоры: внутренняя стойкость народа полностью исчезла.'
