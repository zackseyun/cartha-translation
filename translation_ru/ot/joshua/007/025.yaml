base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: ru
  text: 'И сказал Иисус Навин: «Зачем ты навлёк на нас беду? Яхве навлечёт на тебя беду в этот день[a]». И все израильтяне забросали его камнями[c], а затем они сожгли их[b] огнём и побили их камнями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте в обеих частях фразы повторён один и тот же глагол: «навлёк… беду — навлечёт… беду».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст сначала говорит «его», а далее переходит к множественному числу — «их». Этот переход сохранён без уточнения, относится ли «их» к другим людям, к домашним Ахана или также к его имуществу.
    reason: alternative_reading
  - marker: c
    text: В этом стихе употреблены два разных еврейских глагола, обозначающих побивание камнями. Русские «забросали камнями» и «побили камнями» передают эту лексическую смену, не подразумевая обязательно разные способы казни.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: навлёк на нас беду / навлечёт беду на тебя
  rationale: Глагол עכר означает причинять беду, несчастье или смятение. Одинаковая конструкция в обоих случаях сохраняет словесную перекличку и ответный характер слов Иисуса Навина.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет отличие имени Бога от титула «Господь».
- source_word: בַּיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественно передаёт непосредственное временное значение еврейского выражения «в этот день» в данном высказывании.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: побил его камнями
  rationale: Глагол רגם обозначает побивание камнями; русский оборот передаёт и действие, и явно названное орудие.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: их сожгли в огне
  rationale: Сохранены множественное местоимение и прямое упоминание огня без уточнения, кого или что охватывает «их».
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: закидали камнями
  rationale: Глагол סקל также обозначает побивание камнями. Выбор другого русского глагола позволяет отразить лексическую смену в еврейском тексте, не предполагая иной способ казни.
theological_decisions:
- issue: Переход от единственного числа к множественному после упоминания Ахана
  choice: 'Сохранить переход: «его» — «их».'
  alternative: Согласовать все местоимения в единственном числе либо пояснить, что множественное число относится к семье или имуществу Ахана.
  rationale: Масоретский текст явно переходит от единственного числа к множественному. Перевод сохраняет эту неоднозначность и не определяет без достаточного основания, кого или что включает местоимение «их».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Имя יְהוָה передано как «Яхве». Синтаксическая напряжённость исходного текста, включая переход «его» — «их» и повторное упоминание побивания камнями после сожжения, намеренно сохранена.
