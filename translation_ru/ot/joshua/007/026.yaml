    issue: Неудачная русская передача прекращения гнева
    rationale: 'Оборот «Яхве отвратился от пыла Своего гнева» семантически и стилистически тяжеловесен: «отвратиться от гнева» не является обычным русским способом сказать, что гнев был отведён. Глагольная конструкция «отвратил Свой пылающий гнев» передаёт смысл в контексте и сохраняет метафорическую образность.'
  - severity: low
    issue: Добавочное «там» в первой формуле «до сего дня»
    rationale: Указание на место отсутствует в еврейском тексте и не нужно для естественности русского перевода.
  - severity: low
    issue: Сноска может точнее обозначить значение игры слов
    rationale: Для עָכוֹר уместно «бедствие, беда»; это яснее связывает название с контекстом Навина 7:25.
