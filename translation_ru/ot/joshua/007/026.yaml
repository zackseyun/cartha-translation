  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: ru
  text: И они воздвигли над ним большую груду камней, и она остаётся по сей день. Тогда Яхве отвратил Свой пылающий гнев. Поэтому то место по сей день называется долиной Ахор[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Ахор» созвучно еврейскому слову со значением «бедствие», «беда»; ср. Навин 7:25.
    reason: Передаёт игру слов, которую невозможно одновременно сохранить в основном тексте вместе с формой топонима.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: насыпали над ним большую груду камней
  rationale: Глагол в породе хифиль означает «воздвигли, соорудили»; применительно к груде камней естественное русское соответствие — «насыпали». עָלָיו прямо передано как «над ним».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: которая остаётся там до сего дня / и по сей день
  rationale: В первом случае для ясности по-русски раскрыто подразумеваемое продолжение существования груды; во втором употреблена естественная формула сохранения названия.
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Тогда Яхве отвратился от пыла Своего гнева
  rationale: «Отвратился от» сохраняет пространственную метафору שׁוּב с מִן и не перетолковывает её как перемену решения; «пыл гнева» естественно передаёт образ חֲרוֹן אַף.
- source_word: עֵמֶק עָכוֹר
  choice: долиной Ахор
  rationale: Топоним транслитерирован, а связанная с ним игра слов объяснена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Передано личное имя, стоящее в еврейском тексте, без замены титулом.
- issue: Описание прекращения Божьего гнева
  choice: Яхве отвратился от пыла Своего гнева
  alternative: Яхве смягчил Свой яростный гнев
  rationale: Сохранены образность и богословское напряжение исходного текста без уточнения природы перемены сверх сказанного.
- issue: Неназванный субъект в формуле наименования
  choice: то место ... называется
  alternative: он назвал то место
  rationale: Безличная русская конструкция сохраняет неопределённость еврейского субъекта и естественно сочетается с указанием на продолжающееся употребление названия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «до сего дня» сохранён как понятная традиционная формула; синтаксис сделан естественным для русского языка.
