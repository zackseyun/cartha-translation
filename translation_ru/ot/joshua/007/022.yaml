  source_fidelity: 'Текст точно передаёт последовательность еврейского повествования: Иисус Навин посылает человеческих посланников, они бегут к шатру, затем следует формула обнаружения. «Она была спрятана» обоснованно сохраняет женский род формы טְמוּנָה и её связь с одеждой, названной в предыдущем стихе, не добавляя это существительное в сам текст. «Серебро было под ней» корректно передаёт וְהַכֶּסֶף תַּחְתֶּיהָ и не устраняет исходную местоименную связь.'
