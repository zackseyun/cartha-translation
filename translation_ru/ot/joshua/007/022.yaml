  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: ru
  text: И послал Иисус Навин посланников, и они побежали к шатру. И вот, она была спрятана в его шатре, а серебро было под ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח; естественно передаёт поручение отправиться.
- source_word: מַלְאָכִים
  choice: посланников
  rationale: Здесь речь о людях, посланных Иисусом Навином; «посланники» точно передаёт значение без ангелологической окраски.
- source_word: וַיָּרֻצוּ
  choice: побежали
  rationale: Глагол רוץ прямо обозначает бег и сохраняет живость повествования.
- source_word: הָאֹהֱלָה
  choice: к шатру
  rationale: Направительный суффикс -ה указывает движение к шатру; «шатёр» соответствует обстановке повествования.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательную и драматическую силу частицы при неожиданном обнаружении спрятанного.
- source_word: טְמוּנָה
  choice: она была спрятана
  rationale: Форма женского рода отсылает к названной в предыдущем стихе одежде; местоимение сохраняет эту грамматическую связь, не повторяя отсутствующее здесь существительное.
- source_word: בְּאָהֳלוֹ
  choice: в его шатре
  rationale: Прямая передача предложной конструкции с суффиксом третьего лица мужского рода, относящимся к Ахану.
- source_word: וְהַכֶּסֶף
  choice: а серебро
  rationale: Русское «а» естественно вводит дополнительную деталь о другом предмете и его расположении; оно не придаёт фразе сильного противопоставления.
- source_word: תַּחְתֶּיהָ
  choice: под ней
  rationale: Суффикс женского рода естественно соотносится со спрятанной одеждой из предыдущего стиха.
