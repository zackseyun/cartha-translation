  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: ru
  text: 'Но сыны Израиля проявили неверность в отношении заклятого[a]: Ахан, сын Карми, сын Завди, сын Зераха, из колена Иуды, взял кое-что из заклятого. И гнев Яхве воспылал против сынов Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящённого»; более буквально: «того, что под заклятием». Еврейское חֵרֶם обозначает людей или предметы, безвозвратно отделённые для Бога — для уничтожения или изъятия из обычного человеческого употребления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: проявили неверность
  rationale: Глагол מעל с однокоренным существительным обозначает серьёзное нарушение доверия и верности, особенно в отношениях завета. Русское выражение передаёт этот смысл без тяжеловесного буквального повтора.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: 'Сохранён семейно-корпоративный образ исходного текста: ответственность относится ко всему народу, хотя далее назван один виновник.'
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: заклятое
  rationale: «Заклятое» служит кратким русским обозначением того, что безвозвратно посвящено Богу и потому изъято из обычного человеческого употребления, в данном контексте — предназначено для уничтожения. Неоднозначность термина поясняется в сноске.
- source_word: וַיִּקַּח ... מִן
  choice: взял кое-что из
  rationale: '«Кое-что» естественно передаёт частичное значение предлога מִן: Ахан взял часть из совокупности заклятого.'
- source_word: לְמַטֵּה יְהוּדָה
  choice: из колена Иуды
  rationale: В генеалогическом контексте מַטֶּה означает племенное подразделение Израиля; традиционное русское «колено» здесь ясно и уместно.
- source_word: וַיִּחַר אַף יְהוָה
  choice: гнев Яхве воспылал
  rationale: Сохранён яркий древнееврейский образ пылающего гнева, звучащий естественно в литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Корпоративная ответственность сынов Израиля при личном проступке Ахана
  choice: Сохранить множественное корпоративное подлежащее, а затем прямо назвать Ахана единственным описанным исполнителем.
  alternative: Отнести неверность только к Ахану либо заменить выражение обобщённым «Израиль согрешил».
  rationale: Исходный текст намеренно соединяет поступок одного человека с неверностью и последствиями для всего народа; перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Сыны Израиля», «колено» и «воспылал» сохраняют достоинство и образность текста; синтаксис остаётся понятным современному читателю.
