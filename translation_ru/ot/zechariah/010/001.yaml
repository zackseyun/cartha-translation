    issue: «Ливни» для וּמְטַר גֶּשֶׁם
    rationale: Сочетание подчёркивает дождь, но не требует значения сильного ливня. «Ливни» сужают и усиливают смысл сверх необходимого.
  - severity: low
    issue: «Зелень» для עֵשֶׂב
    rationale: В современном русском «зелень» часто ассоциируется с пищевыми травами; «растительность» лучше сохраняет широкий смысл травы/растительного покрова.
  - severity: low
    issue: Формулировка сноски b
    rationale: Лексическая альтернатива относится к חֲזִיזִים как к вспышкам молний; формула «творит молнии» менее точна, чем указание на сам предмет альтернативного прочтения.
