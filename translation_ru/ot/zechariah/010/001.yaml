  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
translation:
  language: ru
  text: Просите у Яхве дождя во время позднего дождя[a]. Яхве создаёт грозовые тучи[b] и даст им дождь, каждому человеку — растительность в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пору позднего дождя»; то есть сезонного дождя перед сбором урожая.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «создаёт вспышки молний».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ מֵיְהוָה מָטָר
  choice: Просите у Яхве дождя
  rationale: Множественное повелительное שַׁאֲלוּ и מִן источника естественно передаются русской конструкцией «просить у кого-либо чего-либо».
- source_word: בְּעֵת מַלְקוֹשׁ
  choice: во время позднего дождя
  rationale: מַלְקוֹשׁ обозначает поздний сезонный дождь, завершающий дождливый период; буквальная сезонная формулировка сохраняет сельскохозяйственный образ и допускаемую многозначность.
- source_word: עֹשֶׂה חֲזִיזִים
  choice: создаёт грозовые тучи
  rationale: חֲזִיזִים может обозначать молнии либо грозовые явления. В контексте дарования дождя «грозовые тучи» естественно передаёт метеорологический смысл; альтернатива отмечена в сноске.
- source_word: וּמְטַר גֶּשֶׁם
  choice: ливни
  rationale: Сочетание двух слов со значением дождя выражает сильные или обильные дождевые потоки; «ливни» передаёт усиление без тяжеловесного повтора.
- source_word: יִתֵּן לָהֶם
  choice: даст им
  rationale: Имперфект передан будущим временем как обещанное действие; местоимение относится к людям, к которым обращён призыв.
- source_word: לְאִישׁ
  choice: каждому человеку
  rationale: Единственное אִישׁ употреблено дистрибутивно. «Каждому человеку» сохраняет индивидуализирующий смысл и в современном русском не звучит как указание исключительно на взрослого мужчину.
- source_word: עֵשֶׂב בַּשָּׂדֶה
  choice: зелень в поле
  rationale: עֵשֶׂב охватывает траву и другую зелёную растительность; «зелень» сохраняет широкий земледельческий образ, а определённое בַּשָּׂדֶה передано без добавления притяжательности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, поскольку в стихе дважды прямо употреблено имя יהוה.
- issue: Дистрибутивное לְאִישׁ
  choice: каждому человеку
  alternative: каждому мужчине; каждому
  rationale: Форма мужского рода в еврейском имеет дистрибутивное значение. Русское «человек» точно и естественно передаёт אִישׁ в этом общем употреблении, не утверждая сверх текста, что дар относится лишь к мужчинам.
- issue: Связь дождя и растительности
  choice: даст им ливни, каждому человеку — зелень в поле
  alternative: даст им дождь, чтобы у каждого была зелень в поле
  rationale: Сохранена сжатая структура исходного текста и напряжение между общим «им» и дистрибутивным «каждому», без внесения явной целевой связи «чтобы», которой в еврейском нет.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Повелительное «просите» обращено ко множеству людей. Пунктуация во втором предложении помогает ясно передать два дополнения при «даст», не добавляя отсутствующих в оригинале причинно-целевых связок.
