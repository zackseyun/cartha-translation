source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
translation:
  language: ru
  text: Я укреплю дом Иуды и спасу дом Иосифа[a]. Я восстановлю их[b], ибо Я проявил к ним сострадание, и они будут такими, словно Я не отвергал их. Ибо Я — Яхве, их Бог, и Я отвечу им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Иосифа» — собирательное обозначение потомков Иосифа, нередко прежде всего северных колен Израиля.
    reason: cultural_note
  - marker: b
    text: 'Или: «верну их». Еврейский глагол может означать возвращение обратно или восстановление прежнего положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  choice: Я укреплю
  rationale: 'Порода пиэль глагола גבר имеет каузативный смысл: сделать сильным, придать силу. «Укреплю» естественно передаёт его по-русски, не добавляя прямо не выраженного военного оттенка.'
- source_word: בֵּית יְהוּדָה
  choice: дом Иуды
  rationale: Сохранено корпоративное родоплеменное обозначение «дом», а не только имя Иуды.
- source_word: בֵּית יוֹסֵף
  choice: дом Иосифа
  rationale: Буквально сохранено корпоративное обозначение потомков Иосифа; в пророческом контексте оно нередко относится прежде всего к северным коленам.
- source_word: אוֹשִׁיעַ
  choice: спасу
  rationale: Глагол ישׁע в породе хифиль означает спасти или избавить. «Спасу» прямо передаёт широкий смысл исходного слова.
- source_word: וְהוֹשְׁבוֹתִים
  choice: восстановлю их
  rationale: Форма хифиля от שוב может означать «вернуть, привести обратно» и шире — «восстановить». В контексте обновления народа «восстановлю» сохраняет более широкий смысл, а пространственное значение отмечено в сноске.
- source_word: כִּי רִחַמְתִּים
  choice: потому что сжалился над ними
  rationale: רחם выражает милость и сострадание. Русское «сжалился» естественно передаёт совершенную форму и основание обещанного восстановления.
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  choice: и они будут словно те, кого Я не отвергал
  rationale: Сохранено сравнительное, контрфактическое выражение исходного текста. זנח передано глаголом «отвергать», без усиления до полного оставления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: וְאֶעֱנֵם
  choice: и Я отвечу им
  rationale: Глагол ענה в породе каль прямо означает «ответить, откликнуться»; «отвечу» сохраняет этот смысл без сведения его к простому слушанию.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Образ прежнего отвержения народа
  choice: «словно те, кого Я не отвергал»
  alternative: «как если бы Я их не отвергал»
  rationale: 'Выбранная формулировка сохраняет напряжение текста: прежнее отвержение не отрицается, но обещанное восстановление будет настолько полным, словно его не было.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены повтор «дом», личное имя Яхве и последовательность обещаний от первого лица; синтаксис слегка упорядочен для естественного русского звучания без устранения смысловой неоднозначности.
