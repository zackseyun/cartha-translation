  source_fidelity: 'Смысловые соответствия в целом точны: сохранены «дом Иуды», «дом Иосифа», каузативное «укреплю», спасение, восстановление, имя Яхве и прямое «отвечу им». Сноска к «восстановлю» корректно отмечает возвратный/пространственный оттенок הוֹשְׁבוֹתִים.'
  naturalness: Фраза «они будут словно те, кого Я не отвергал» грамматически понятна, но по-русски звучит тяжеловесно и несколько отчуждённо. Конструкция «они будут такими, словно Я не отвергал их» естественнее и непосредственно передаёт сравнительное контрфактическое выражение. «Ведь» в данном торжественном пророческом регистре лучше заменить на «ибо».
