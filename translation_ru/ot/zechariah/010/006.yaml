  to: Я укреплю дом Иуды и спасу дом Иосифа[a]. Я восстановлю их[b], ибо Я проявил к ним сострадание, и они будут такими, словно Я не отвергал их. Ибо Я — Яхве, их Бог, и Я отвечу им.
