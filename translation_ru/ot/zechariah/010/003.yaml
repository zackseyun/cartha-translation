  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
translation:
  language: ru
  text: Мой гнев пылает против пастырей, и козлов[a] Я призову к ответу; ибо Яхве Воинств позаботился о Своём стаде — доме Иуды — и сделает их подобными Своему величественному коню в битве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Пастыри» и «козлы» здесь могут образно обозначать правителей и других влиятельных руководителей.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: пастырей
  rationale: Сохраняет прозрачный пророческий образ руководителей как пастухов; современное «пастухов» звучало бы преимущественно буквально, тогда как «пастырей» естественно допускает переносный смысл.
- source_word: חָרָה אַפִּי
  choice: пылает Мой гнев
  rationale: Естественно передаёт древнееврейскую идиому сильного, разгоревшегося гнева без буквального воспроизведения образа носа.
- source_word: הָעַתּוּדִים
  choice: козлов
  rationale: Сохраняет буквальный образ взрослых самцов коз и связь с пастушеской метафорикой; переносное обозначение влиятельных вождей разъясняется в сноске.
- source_word: אֶפְקֹד
  choice: призову к ответу
  rationale: В первом употреблении פקד контекст требует карательного смысла; выражение передаёт взыскание, не сужая его непременно до уже совершённого наказания.
- source_word: פָקַד
  choice: позаботился
  rationale: 'Во втором употреблении тот же глагол имеет благоприятный смысл: Яхве обращает внимание на стадо и деятельно вступается за него.'
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве», а צְבָאוֹת — прозрачным и сохраняющим военную окраску словом «Воинств».
- source_word: עֶדְרוֹ
  choice: Своём стаде
  rationale: Поддерживает пастырский образ и ясно связывает стадо с Яхве.
- source_word: בֵּית יְהוּדָה
  choice: доме Иуды
  rationale: Формально и естественно сохраняет собирательное библейское выражение, обозначающее народ Иуды.
- source_word: וְשָׂם אוֹתָם
  choice: и сделает их
  rationale: Передаёт вероятное будущее следствие Божьего попечения; местоимение во множественном числе сохраняет согласование по смыслу с коллективом «дом Иуды».
- source_word: כְּסוּס הוֹדוֹ
  choice: Своим величественным конём
  rationale: הוֹד передаёт величие и великолепие; притяжательное «Своим» естественно выражает суффикс третьего лица, относящийся к Яхве.
- source_word: בַּמִּלְחָמָה
  choice: в битве
  rationale: Кратко и идиоматично передаёт военный контекст сравнения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Толкование עַתּוּדִים
  choice: Сохранить буквальный образ «козлов» в основном тексте
  alternative: вожди / правители
  rationale: Слово буквально обозначает козлов, но метафорически может указывать на влиятельных руководителей. Основной текст сохраняет образ и напряжение метафоры, а сноска поясняет возможный смысл.
- issue: Два контрастных употребления פקד
  choice: «призову к ответу» и «позаботился»
  alternative: Передать оба одним русским глаголом «посетить»
  rationale: Контекст придаёт первому употреблению карательную, а второму благоприятную направленность. Разные русские соответствия ясно передают контраст, присутствующий в исходном тексте.
- issue: Временное значение וְשָׂם
  choice: 'будущее: «сделает»'
  alternative: 'прошедшее: «сделал»'
  rationale: В пророческом контексте действие естественно понимается как последствие уже начавшегося Божьего вмешательства; при этом еврейская форма допускает дискурсивную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Метафоры стада, пастырей, козлов и боевого коня сохранены; архаизмы сведены к прозрачному слову «пастыри». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
