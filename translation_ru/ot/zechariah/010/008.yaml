base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
translation:
  language: ru
  text: Я свистну им и соберу их[a], потому что Я искупил их; и они станут столь же многочисленны, как прежде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я подам им знак свистом и соберу их». Еврейский глагол может означать свист или шипение как сигнал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они умножатся, как умножались».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁרְקָה לָהֶם
  choice: Я свистну им, подзывая их
  rationale: Глагол שׁרק обозначает свист или шипящий звук как сигнал. Уточнение «подзывая их» естественно передаёт назначение свиста и не придаёт ему русского значения неодобрения.
- source_word: וַאֲקַבְּצֵם
  choice: и соберу их
  rationale: קבץ означает собирать рассеянных; краткий перевод сохраняет образ восстановления народа без пояснительного расширения.
- source_word: כִּי פְדִיתִים
  choice: потому что Я искупил их
  rationale: כִּי вводит основание собирания, а פדה передаёт освобождение ценой выкупа. «Искупил» сохраняет как прямой смысл, так и богословское звучание.
- source_word: וְרָבוּ כְּמוֹ רָבוּ
  choice: и они снова станут многочисленными, как прежде
  rationale: Повтор רָבוּ допускает более буквальное «умножатся, как умножались», но в контексте выражает восстановление прежней многочисленности. «Снова» ясно передаёт возвращение к прежнему состоянию.
theological_decisions:
- issue: Связь искупления, собирания и умножения народа
  choice: 'Сохранена последовательность: совершённое Богом искупление служит основанием будущего собирания и восстановления численности народа.'
  alternative: Истолковать собирание исключительно как эсхатологическое либо исключительно как духовное.
  rationale: Сам стих не уточняет механизм или временные рамки исполнения, поэтому перевод не вводит более узкой конфессиональной схемы.
- issue: Временная форма פְדִיתִים
  choice: «Я искупил их»
  alternative: «Я искуплю их»
  rationale: Еврейская форма непосредственно представляет искупление как совершённое действие; это соотношение с последующим будущим собиранием сохранено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавное «Я» указывает на говорящего Бога. Формулировка избегает двусмысленного русского «свистну им» без пояснения и сохраняет конкретный образ призыва свистом.
