base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/007.yaml
  text: Ephraim will be like a mighty warrior[a], and their heart will rejoice as with wine; their children will see and rejoice[b]; their heart will exult in Yahweh.
translation:
  language: ru
  text: И Ефрем станет подобен могучему воину, и сердце их возрадуется, как от вина; их дети увидят и возрадуются; сердце их будет ликовать в Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ כְגִבּוֹר אֶפְרַיִם
  choice: И Ефрем станет подобен могучему воину
  rationale: Пророческая форма передана будущим временем. Имя «Ефрем» обозначает народ собирательно; единственное число в русском позволяет естественно согласовать его с образом одного могучего воина.
- source_word: וְשָׂמַח לִבָּם
  choice: и сердца их возрадуются
  rationale: Буквально в еврейском стоит собирательное «их сердце». Русское множественное «сердца» естественнее при соотнесении со множеством людей и сохраняет внутренний характер радости.
- source_word: כְמוֹ יָיִן
  choice: как от вина
  rationale: Сравнивается радость, вызванная восстановлением, с радостью от вина; русский оборот передаёт подразумеваемое воздействие, не вводя тему опьянения.
- source_word: וּבְנֵיהֶם
  choice: их дети
  rationale: בנים буквально может означать «сыновья», но также употребляется шире о детях или потомках. В данном семейно-поколенческом контексте «дети» передаёт вероятный общий смысл.
- source_word: יִרְאוּ וְשָׂמֵחוּ
  choice: увидят это и возрадуются
  rationale: Объект глагола «увидят» в еврейском подразумевается. Местоимение «это» делает русскую фразу естественной и указывает на описанное восстановление и радость, не добавляя нового события.
- source_word: יָגֵל לִבָּם
  choice: сердца их будут ликовать
  rationale: גיל выражает сильную, торжествующую радость. «Ликовать» сохраняет усиление по сравнению с предшествующим שמח.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог указывает на Того, в Ком сосредоточена и укоренена радость; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя Бога, поэтому транслитерация сохраняет различие между יהוה и титулом «Господь».
- issue: Смысл выражения בַּיהוָה
  choice: ликование «в Яхве»
  alternative: ликование «из-за Яхве» или «о Яхве»
  rationale: 'Формулировка «в Яхве» сохраняет широту предлога ב: Яхве может пониматься как основание, средоточие и сфера радости, без искусственного выбора лишь одного оттенка.'
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Лексика «могучий воин», «возрадуются», «ликовать» передаёт воинственный образ и нарастание радости. Порядок слов слегка приближен к библейскому регистру, не нарушая естественности русского.
