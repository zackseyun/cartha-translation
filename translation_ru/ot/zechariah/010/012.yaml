  text: Я укреплю их в Яхве[a], и будут ходить во имя Его[b], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сделаю их сильными в Яхве»; возможен также смысл: «Я укреплю их через Яхве».'
