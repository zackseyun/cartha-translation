lexical_decisions:
- source_word: וְגִבַּרְתִּים
  choice: Я укреплю их
  rationale: 'Каузативно-интенсивный смысл формы от גבר передан естественным русским глаголом «укреплю»: Яхве сделает их сильными.'
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: 'Предлог ב сохраняет возможный смысл сферы или основания: их сила обретается в Яхве; буквальная конструкция также не исключает оттенка «через Яхве».'
- source_word: וּבִשְׁמוֹ
  choice: и во имя Его
  rationale: Сочетание сохраняет образ имени, который может включать власть, явленный характер и принадлежность, не сводя его к одному толкованию.
- source_word: יִתְהַלָּכוּ
  choice: они будут ходить
  rationale: Форма Hitpael от הלך может означать «ходить», «поступать», «жить». Буквальный образ «ходить» сохраняет широту и богословскую насыщенность еврейской метафоры.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Современная и торжественная передача устойчивой пророческой формулы божественного изречения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, непосредственно стоящее в еврейском тексте, без замены титулом.
- issue: Смысл выражения «ходить во имя Его»
  choice: сохранить метафору «ходить»
  alternative: жить; поступать; действовать Его властью
  rationale: Еврейский оборот допускает оттенки образа жизни, верности и действия под властью Яхве; буквальная метафора не сужает эту многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены еврейские образы «в Яхве», «во имя» и «ходить», чтобы не устранять смысловую и богословскую многозначность.
