  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
translation:
  language: ru
  text: Я посею их среди народов[a], и в далёких краях они вспомнят Меня; они и их дети будут жить, и они возвратятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассею их среди народов». Еврейский глагол буквально означает «посею» и может передавать как рассеяние, так и целенаправленный посев ради будущего умножения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  choice: Я посею их
  rationale: Буквальный образ от זרע — «сеять». Здесь он допускает одновременно рассеяние среди народов и целенаправленный посев с надеждой на будущий плод; поэтому образ сохранён, а не заменён однозначным «рассею».
- source_word: בָּעַמִּים
  choice: среди народов
  rationale: Множественное עַמִּים означает «народы»; такое соответствие естественно по-русски и не сводит речь к современным государствам.
- source_word: וּבַמֶּרְחַקִּים
  choice: в далёких краях
  rationale: מֶרְחַקִּים указывает на удалённые места. «В далёких краях» сохраняет пространственный смысл и звучит естественно и достойно.
- source_word: יִזְכְּרוּנִי
  choice: они вспомнят Меня
  rationale: Прямое соответствие глаголу זכר с суффиксом первого лица; отсутствующее в еврейском тексте наречие «там» не добавляется.
- source_word: וְחָיוּ
  choice: будут жить
  rationale: חיה здесь обозначает жизнь, продолжение жизни или оживление; широкое «будут жить» не устраняет эту смысловую ёмкость.
- source_word: אֶת־בְּנֵיהֶם
  choice: они и их дети
  rationale: 'אֶת понимается комитативно: речь идёт о них вместе с их детьми. В русском co-субъектная конструкция ясно передаёт, что жить будут оба поколения.'
- source_word: וָשָׁבוּ
  choice: возвратятся
  rationale: שוב означает возвращение и в контексте восстановления может сохранять как пространственный, так и заветный оттенок без сведения смысла исключительно к покаянию.
theological_decisions:
- issue: Смысл образа сеяния в контексте восстановления
  choice: Сохранён образ целенаправленного сеяния среди народов, которое включает рассеяние, памятование о Боге и последующее возвращение.
  alternative: Передать только «рассею» как суд либо только «посажу» как благотворное укоренение.
  rationale: Контекст восстановления не отменяет факта рассеяния, а образ «посею» удерживает напряжение между удалением от родины и замыслом о будущем плоде.
- issue: Отношение детей к глаголу «жить»
  choice: «они и их дети будут жить»
  alternative: «они будут жить со своими детьми»
  rationale: Комитативное אֶת допускает обе формулировки, но конструкция с однородным субъектом яснее выражает, что обещание жизни относится и к ним, и к детям, не меняя содержания стиха.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческого образа и лаконичного синтаксиса. Местоимение «Меня» написано с прописной буквы согласно принятой русской библейской традиции. Единственная сноска поставлена непосредственно после спорного образа; отдельная сноска при «вспомнят Меня» не требуется, поскольку предложенная английская сноска фактически относится к следующей еврейской конструкции.
