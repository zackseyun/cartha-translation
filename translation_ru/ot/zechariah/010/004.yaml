base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
translation:
  language: ru
  text: Из него — краеугольный камень[a], из него — шатровый кол, из него — боевой лук; из него выйдут все властители вместе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Краеугольный камень», «шатровый кол» и «боевой лук» — образы устойчивости, опоры и военной силы, исходящих от Иуды.
    reason: cultural_note
  - marker: b
    text: 'Или: «все притеснители» либо «все надсмотрщики». Еврейское слово может обозначать того, кто принуждает к труду или взыскивает дань, но здесь, возможно, шире относится к представителям власти, выходящим из Иуды.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: из него
  rationale: Четырёхкратный оборот имеет суффикс мужского рода единственного числа. Перевод сохраняет эту форму и допускает, что речь собирательно идёт об Иуде и его народе.
- source_word: פִנָּה
  choice: краеугольный камень
  rationale: В данном ряду образов существительное обозначает краеугольный камень как символ основания и устойчивости; уточнение «главный» в еврейском тексте отсутствует.
- source_word: יָתֵד
  choice: шатровый кол
  rationale: Слово обозначает кол или колышек, нередко удерживающий шатёр. Такой перевод сохраняет конкретный образ прочной опоры.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: боевой лук
  rationale: Сочетание буквально обозначает лук для войны; «боевой лук» естественно и кратко передаёт военный смысл.
- source_word: יֵצֵא
  choice: выйдет
  rationale: Сохранено основное пространственное значение глагола יצא без истолковывающего расширения.
- source_word: כָל נוֹגֵשׂ
  choice: всякий властитель
  rationale: Хотя נֹגֵשׂ часто обозначает притеснителя или надсмотрщика, положительный контекст восстановления и ряд образов власти и силы позволяют понять его шире как обладающего властью. Более жёсткие значения отмечены в сноске.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Передаёт собирательный смысл наречия и одновременно естественно поясняет по-русски сочетание с распределительным «всякий».
theological_decisions:
- issue: Положительный или отрицательный смысл כָל נוֹגֵשׂ
  choice: нейтрально-положительное «всякий властитель»
  alternative: «всякий притеснитель» или «всякий надсмотрщик»
  rationale: Непосредственный контекст перечисляет возникающие из Иуды образы устойчивости, поддержки и военной силы, поэтому значение представителя власти здесь вероятно. Поскольку само еврейское слово часто имеет отрицательную окраску, неоднозначность сохранена в сноске.
- issue: Референт мужского единственного суффикса в מִמֶּנּוּ
  choice: сохранить буквально «из него»
  alternative: «из неё» (из земли Иуды) или «из них» (из народа Иуды)
  rationale: Еврейская форма грамматически имеет мужской род и единственное число и, вероятно, отсылает к Иуде как собирательному целому. Перевод не устраняет эту грамматическую и смысловую особенность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой ритмикой. Повтор «из него» сохраняет анафору оригинала; именные конструкции первых трёх частей передают краткость еврейского текста.
