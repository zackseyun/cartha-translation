  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
translation:
  language: ru
  text: Он пройдёт через море бедствия[a] и поразит морские волны; иссохнут все глубины Нила[b]. Гордость Ассирии будет низложена, и скипетр Египта[c] исчезнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через море в бедствии»; возможно также: «через бурное море». Еврейский оборот сжат и может напоминать о переходе через море при исходе. Субъект глагола прямо не назван; по контексту им, вероятнее всего, является Бог.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать «реку», но в контексте Египта обычно относится к Нилу.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жезл Египта». Здесь, вероятно, имеется в виду его правящая власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Он пройдёт
  rationale: Перфект с союзом в пророческой последовательности передан будущим временем. Местоимение указывает на подразумеваемого деятеля, наиболее естественно — Бога в контексте, хотя в самом стихе субъект прямо не назван.
- source_word: בַּיָּם צָרָה
  choice: через море бедствия
  rationale: Сохранена сжатая именная конструкция и возможная отсылка к исходу; слово צָרָה передано существительным «бедствие», а не сведено однозначно к характеристике бурного моря.
- source_word: וְהִכָּה בַיָּם גַּלִּים
  choice: и поразит морские волны
  rationale: Глагол נכה сохраняет сильное значение «поразить»; более естественная русская конструкция «морские волны» передаёт волны моря без изменения образа.
- source_word: וְהֹבִישׁוּ כֹּל מְצוּלוֹת יְאֹר
  choice: иссохнут все глубины Нила
  rationale: В отношении вод יבש означает высыхание. Форма согласуется с множественным מְצוּלוֹת, поэтому глубины представлены субъектом результата, без добавления явно названного деятеля.
- source_word: גְּאוֹן אַשּׁוּר
  choice: гордость Ассирии
  rationale: В контексте суда גְּאוֹן естественно обозначает надменную гордость, хотя слово может также означать величие или превосходство.
- source_word: וְהוּרַד
  choice: будет низложена
  rationale: Страдательно-каузативная форма передаёт ниспровержение; «низложена» естественно сочетается с олицетворённой гордостью и сохраняет судебно-политический оттенок.
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  choice: и скипетр Египта исчезнет
  rationale: שֵׁבֶט в параллелизме обозначает власть, потому выбран «скипетр»; יָסוּר передан как «исчезнет», то есть власть прекратится или будет устранена.
theological_decisions:
- issue: Подразумеваемый субъект первых глаголов
  choice: В основном тексте субъект обозначен местоимением «Он», относящимся в контексте к Богу.
  alternative: Субъектом может считаться восстановленный народ; возможен также синтаксический разбор, при котором через море проходит само бедствие.
  rationale: Единственное число глаголов и окружающее обещание Божьего избавления поддерживают отнесение действия к Богу, но имя в данном стихе не выражено, поэтому альтернативы отмечены в сноске.
- issue: Образ моря и исхода
  choice: Сохранён метафорически ёмкий оборот «море бедствия».
  alternative: «Бурное море» или буквальное море, через которое проходят в бедствии.
  rationale: Текст допускает одновременно образ тяжёлого испытания и отзвук перехода через море при исходе; перевод не должен исключать ни один из этих смыслов.
- issue: Политическая власть Египта
  choice: שֵׁבֶט передано как «скипетр».
  alternative: «Жезл Египта».
  rationale: «Скипетр» яснее выражает правящую власть и соответствует параллели с гордостью Ассирии, не вводя особой конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис сделан ясным и ритмичным, но сохранены образы моря, иссыхающих глубин и падения имперской власти. Все сноски поставлены непосредственно при соответствующих выражениях.
