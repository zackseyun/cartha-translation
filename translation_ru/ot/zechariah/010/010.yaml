  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
translation:
  language: ru
  text: Я приведу их обратно из земли Египта и соберу их из Ассирии; я приведу их в землю Галаада и Ливана, и места для них не найдётся[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не найдётся для них»; слово «места» подразумевается.'
    reason: В еврейском тексте после глагола «не найдётся» объект не выражен явно.
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  choice: Я приведу их обратно
  rationale: Порода хифиль глагола שוב выражает причинение возвращения. «Приведу обратно» естественно передаёт пространственный смысл возвращения из рассеяния.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египта
  rationale: Сохраняется явно названная «земля» и географический смысл исхода из Египта, но без излишне архаичной конструкции.
- source_word: וּמֵאַשּׁוּר אֲקַבְּצֵם
  choice: и соберу их из Ассирии
  rationale: קבץ обычно обозначает собирание рассеянных людей; «соберу» точно и естественно передаёт этот образ.
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן אֲבִיאֵם
  choice: Я приведу их в землю Галаада и Ливана
  rationale: ביא в хифиле означает «привести». Формулировка сохраняет существительное אֶרֶץ и оба географических названия как область назначения.
- source_word: וְלֹא יִמָּצֵא לָהֶם
  choice: и места для них не найдётся
  rationale: В еврейском тексте объект не назван; русское «места» делает подразумеваемый пространственный смысл понятным, а «не найдётся» сохраняет безлично-пассивную форму.
theological_decisions:
- issue: Подразумеваемый объект в וְלֹא יִמָּצֵא לָהֶם
  choice: Явно указать «места», понимая заключительную фразу как образ многочисленности возвращённого народа.
  alternative: 'Оставить объект невыраженным: «и не найдётся для них».'
  rationale: Контекст вселения в Галаад и Ливан указывает на нехватку пространства. Добавление слова «места» необходимо для ясного русского текста, но отмечается в сноске как подразумеваемое.
- issue: Связь заключительной фразы с предшествующей
  choice: Сохранить сочинительное «и».
  alternative: 'Передать как результат: «так что места для них не найдётся» или «пока не останется места».'
  rationale: Еврейское וְ непосредственно координирует части фразы; перевод не навязывает более определённое целевое или результативное отношение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повторение «Я приведу» сохранено для передачи параллелизма и подчёркивания действия Бога; синтаксис остаётся ясным и не перегруженным архаизмами.
