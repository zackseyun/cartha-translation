source:
  edition: WLC
  text: וְ/הָי֨וּ כְ/גִבֹּרִ֜ים בּוֹסִ֨ים בְּ/טִ֤יט חוּצוֹת֙ בַּ/מִּלְחָמָ֔ה וְ/נִ֨לְחֲמ֔וּ כִּ֥י יְהוָ֖ה עִמָּ֑/ם וְ/הֹבִ֖ישׁוּ רֹכְבֵ֥י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
translation:
  language: ru
  text: Они будут подобны могучим воинам[a], топчущим в бою грязь на улицах. Они будут сражаться, потому что Яхве с ними, и посрамят всадников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильным воинам». Еврейское слово мужского рода обозначает могучих, доблестных бойцов.'
    reason: Лексическая альтернатива для גִּבּוֹרִים и краткое пояснение мужского воинского образа.
lexical_decisions:
- source_word: וְהָיוּ
  choice: Они будут
  rationale: Перфект с союзом в пророческом контексте передаёт будущее; начальный союз по-русски опущен ради естественного начала фразы.
- source_word: כְגִבֹּרִים
  choice: подобны могучим воинам
  rationale: גִּבּוֹרִים обозначает сильных, доблестных воинов; сочетание сохраняет и образ силы, и военный контекст.
- source_word: בּוֹסִים בְּטִיט חוּצוֹת
  choice: топчущим в бою уличную грязь
  rationale: Причастие בוס передаёт попирание ногами, а טִיט חוּצוֹת — грязь или месиво на улицах; компактная формулировка сохраняет конкретный образ.
- source_word: בַּמִּלְחָמָה
  choice: в бою
  rationale: Здесь מִלְחָמָה относится к непосредственной сцене сражения, поэтому «в бою» естественнее широкого «на войне».
- source_word: וְנִלְחֲמוּ
  choice: Они будут сражаться
  rationale: Нифаль глагола לחם в данном контексте означает вступать в бой, сражаться.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание их способности и успеха в сражении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, а не заменяющий его титул.
- source_word: עִמָּם
  choice: с ними
  rationale: В русском настоящая связка естественно опускается; выражение сохраняет смысл Божьего присутствия как основания победы.
- source_word: וְהֹבִישׁוּ
  choice: и посрамят
  rationale: Каузативная форма передаёт причинение стыда и военное унижение противника; «посрамят» кратко и уместно в возвышенной пророческой речи.
- source_word: רֹכְבֵי סוּסִים
  choice: всадников
  rationale: Обычный и точный русский эквивалент выражения «ездящие на конях», обозначающего конницу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Мужской воинский образ גִּבּוֹרִים
  choice: могучие воины
  alternative: сильные; богатыри
  rationale: Форма мужского рода и воинский образ сохранены; «воины» ясно передаёт контекст, а «могучие» — семантику силы и доблести.
- issue: Объект попирания в выражении בּוֹסִים בְּטִיט חוּצוֹת
  choice: топчущие уличную грязь
  alternative: топчущие врагов, словно уличную грязь
  rationale: Масоретский текст прямо называет уличную грязь, но не выражает объект «врагов» и сравнительную частицу; перевод не делает подразумеваемое сравнение явным, сохраняя образную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. «Посрамят» выбрано как краткое и достойное по регистру слово; синтаксис разделён на два предложения для ясности без изменения логической связи.
