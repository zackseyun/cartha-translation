  text: כִּ֧י הַ/תְּרָפִ֣ים דִּבְּרוּ אָ֗וֶן וְ/הַ/קּֽוֹסְמִים֙ חָ֣זוּ שֶׁ֔קֶר וַֽ/חֲלֹמוֹת֙ הַ/שָּׁ֣וא יְדַבֵּ֔רוּ הֶ֖בֶל יְנַֽחֵמ֑וּ/ן עַל כֵּן֙ נָסְע֣וּ כְמוֹ צֹ֔אן יַעֲנ֖וּ כִּֽי אֵ֥ין רֹעֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
translation:
  language: ru
  text: Ибо домашние идолы[a] возвещают обман, прорицатели видят обманчивые видения, а пустые сны возвещают пустое и дают тщетное утешение. Поэтому народ скитается, словно овцы, и страдает, потому что нет пастуха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «терафимы» — домашние культовые предметы или идолы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: домашние идолы
  rationale: Терафимы были культовыми предметами или божками, часто связанными с домом; понятное русское соответствие сохраняет конкретный характер термина.
- source_word: דִּבְּרוּ אָוֶן
  choice: говорят неправду
  rationale: В параллели с ложными видениями и пустыми снами אָוֶן обозначает ложное, пагубное содержание речи; «неправду» естественно передаёт смысл, не сужая его до одного вида обмана.
- source_word: הַקּוֹסְמִים
  choice: прорицатели
  rationale: Термин обозначает людей, практикующих гадание и прорицание; это точное и литературно нейтральное русское слово.
- source_word: חָזוּ שֶׁקֶר
  choice: видят ложь
  rationale: Сохранён образ видения, относящийся к притязаниям на сверхъестественное откровение, и его ложный характер.
- source_word: חֲלֹמוֹת הַשָּׁוְא יְדַבֵּרוּ
  choice: рассказывают пустые сны
  rationale: Глагол в данном сочетании естественно передаётся как «рассказывают», а שָׁוְא — как «пустые», то есть ложные или ничего не стоящие.
- source_word: הֶבֶל יְנַחֵמוּן
  choice: напрасно утешают
  rationale: הֶבֶל указывает на тщетность и несостоятельность утешения; наречная конструкция звучит естественно и сохраняет смысл бесполезности.
- source_word: נָסְעוּ כְמוֹ צֹאן
  choice: народ скитается, словно овцы
  rationale: Форма נָסְעוּ буквально указывает на отправление или движение, но образ овец без пастуха предполагает бесцельное скитание. Подлежащее «народ» эксплицирует подразумеваемую общность и согласует русский образ.
- source_word: יַעֲנוּ
  choice: страдает
  rationale: Форма допускает значения страдания, бедствия или угнетения; широкое «страдает» не уточняет источник беды сверх текста.
- source_word: אֵין רֹעֶה
  choice: нет пастуха
  rationale: Прямая передача сохраняет пастушеский образ и его возможный смысл отсутствующего руководства.
theological_decisions:
- issue: Характер осуждаемых источников руководства
  choice: Сохранены конкретные образы домашних идолов, прорицателей и ложных снов как несостоятельных источников наставления.
  alternative: Истолковать весь перечень исключительно как метафору политического руководства.
  rationale: Непосредственный текст говорит о культовых предметах и прорицательной практике, тогда как более широкий образ руководства выражен в заключительном упоминании пастуха.
- issue: Референт глаголов «скитается» и «страдает»
  choice: В русском тексте подразумеваемая группа обозначена словом «народ».
  alternative: Оставить местоимение «они», которое грамматически могло бы ошибочно отсылать к снам или прорицателям.
  rationale: В еврейском тексте происходит переход к людям, уподобленным овцам; экспликация устраняет неестественную русскую двусмысленность, не определяя группу точнее, чем позволяет контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; культовая терминология сохранена без конфессиональных уточнений. Подлинная смысловая широта יַעֲנוּ передана общим глаголом «страдает».
