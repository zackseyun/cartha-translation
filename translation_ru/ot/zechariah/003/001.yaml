base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
translation:
  language: ru
  text: И он показал мне Иисуса, первосвященника, стоящего перед ангелом Яхве, и обвинителя, стоящего по правую руку от Иисуса, чтобы обвинять его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сатану… чтобы противостоять ему». В еврейском тексте употреблено «сатан» с определённым артиклем; это слово может обозначать титул или роль: «обвинитель» либо «противник».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: И Он показал мне
  rationale: Глагол в породе хифиль с суффиксом первого лица означает «дал мне увидеть», идиоматически — «показал мне». Союз «и» сохраняет повествовательную связь с предыдущим видением.
- source_word: יְהוֹשֻׁעַ
  choice: Иисуса
  rationale: Использована укоренившаяся русская библейская форма имени יְהוֹשֻׁעַ; падеж обусловлен синтаксисом русского предложения.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященника
  rationale: Обычное и точное русское наименование главного священника Израиля.
- source_word: לִפְנֵי
  choice: перед
  rationale: Передаёт пространственный смысл и возможный судебный оттенок сцены, не делая его явным сверх текста.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангелом Яхве
  rationale: В пророческом видении מַלְאָךְ естественно передать как «Ангел», а тетраграмматон — личным именем «Яхве».
- source_word: הַשָּׂטָן
  choice: Обвинителя
  rationale: Артикль указывает прежде всего на роль или титул. В судебном контексте «Обвинитель» передаёт значение корня, не превращая обозначение роли безоговорочно в собственное имя.
- source_word: עַל יְמִינוֹ
  choice: по правую руку от него
  rationale: Сохраняет древнееврейский образ и положение обвиняющей стороны в сцене.
- source_word: לְשִׂטְנוֹ
  choice: чтобы обвинять его
  rationale: Инфинитив того же корня, что и הַשָּׂטָן, в данном судебном контексте обозначает действие обвинителя.
theological_decisions:
- issue: Следует ли понимать הַשָּׂטָן как собственное имя или как обозначение роли
  choice: Обвинитель
  alternative: Сатана; противник
  rationale: Артикль и инфинитив того же корня в непосредственном контексте поддерживают значение роли — «обвинитель». Варианты «Сатана» и «противник» сохранены в примечании, чтобы не устранять подлинную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Заглавные буквы в словах «Ангел» и «Обвинитель» отмечают их функцию как титулов в видении, не предрешая более поздней богословской идентификации.
