  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תִּקְרְא֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ אֶל תַּ֥חַת גֶּ֖פֶן וְ/אֶל תַּ֥חַת תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/010.yaml
  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
translation:
  language: ru
  text: В тот день, — возвещает Яхве Воинств, — каждый из вас пригласит своего ближнего под виноградную лозу и под смоковницу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сидеть под виноградной лозой и смоковницей — библейский образ мира, безопасности и благополучия; ср. 3 Цар. 4:25; Мих. 4:4. Еврейский глагол можно также передать как «позовёт» или, более буквально, «окликнет»; в данном контексте он имеет смысл приглашения. Притяжательное местоимение, встречающееся в сходных выражениях («свою лозу», «свою смоковницу»), в еврейском тексте здесь отсутствует.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача устойчивой пророческой формулы, указывающей на грядущее время Божьего действия.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: נְאֻם передано торжественным глаголом пророческой речи «возвещает»; имя יהוה сохранено как «Яхве», а צְבָאוֹת — как «Воинств», что выражает образ небесных и земных сил и сохраняет форму божественного титула.
- source_word: תִּקְרְאוּ
  choice: позовёт
  rationale: Основное значение קרא — «звать»; в данном контексте оно естественно допускает смысл приглашения, но перевод «позовёт» сохраняет лексическую широту оригинала.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: каждый из вас ... своего ближнего
  rationale: אִישׁ имеет распределительное значение, а форма глагола во втором лице множественного числа оправдывает «каждый из вас». רֵעַ передано словом «ближний», охватывающим соседа, товарища или другого члена общины.
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  choice: под виноградную лозу и под смоковницу
  rationale: Сочетание אֶל с תַּחַת обозначает направленность к месту под лозой и смоковницей. В русском винительный падеж после «под» передаёт это движение; притяжательное местоимение в еврейском тексте отсутствует.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Собственное заветное имя передано непосредственно, без замены титулом, в соответствии с формой исходного текста.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных Воинств
  rationale: «Воинств» сохраняет значение еврейского титула и его торжественную библейскую форму, не ограничивая референт только небесными силами.
- issue: Образ лозы и смоковницы
  choice: сохранён без поясняющей вставки в основном тексте
  alternative: явно назвать мир, безопасность и благополучие
  rationale: Образ сам выражает состояние мира и защищённости; его раскрытие внутри стиха стало бы интерпретирующим дополнением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пунктуация выделяет вводную формулу речи Яхве. Сохранена неоднозначность קרא между буквальным «позвать» и контекстуальным «пригласить»; не добавлено отсутствующее в оригинале притяжательное местоимение.
