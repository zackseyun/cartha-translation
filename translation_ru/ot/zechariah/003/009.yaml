  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
translation:
  language: ru
  text: 'Ибо вот камень, который Я положил перед Иисусом: на одном камне — семь глаз. Вот, Я Сам вырежу на нём резьбу[a], — возвещает Яхве Воинств[b], — и удалю беззаконие той земли в один день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более гладко: «сделаю на нём надпись». В еврейском тексте стоят однокоренные глагол и существительное; буквально: «вырежу его резьбу», где «его» относится к камню.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная передача: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: כִּי вводит пояснение или усиление, а הִנֵּה привлекает внимание; сочетание «Ибо вот» сохраняет торжественный пророческий тон.
- source_word: הָאֶבֶן
  choice: камень
  rationale: Передаётся прямое значение без внесения символического толкования.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵי יְהוֹשֻׁעַ
  choice: который Я положил перед Иисусом
  rationale: נתן здесь естественно означает «положить, поместить»; יְהוֹשֻׁעַ передано традиционной русской библейской формой имени первосвященника — «Иисус».
- source_word: עַל אֶבֶן אַחַת שִׁבְעָה עֵינָיִם
  choice: на одном камне — семь глаз
  rationale: Буквальный образ и синтаксическая резкость еврейского текста сохранены; символика не истолковывается внутри перевода.
- source_word: הִנְנִי
  choice: Вот, Я Сам
  rationale: Конструкция выражает и указательность, и подчёркнутое личное действие говорящего.
- source_word: מְפַתֵּחַ פִּתֻּחָהּ
  choice: вырежу на нём резьбу
  rationale: Сохранён этимологический повтор глагола и существительного; местоименное «на нём» естественно соотносит действие с камнем.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: נְאֻם передано как формула пророческого провозглашения; имя יהוה транслитерировано, а צְבָאוֹת переведено прозрачно и буквально.
- source_word: וּמַשְׁתִּי
  choice: и удалю
  rationale: Редкая форма в данном контексте выражает устранение; «удалю» естественно сочетается с объектом «вина».
- source_word: עֲוֺן
  choice: вину
  rationale: עָוֹן охватывает беззаконие, вину и её последствия. «Вина» здесь хорошо сочетается с глаголом устранения и не сводит выражение только к поступку.
- source_word: הָאָרֶץ הַהִיא בְּיוֹם אֶחָד
  choice: той земли в один день
  rationale: Указательное значение הַהִיא сохранено, а בְּיוֹם אֶחָד передано кратко и буквально.
theological_decisions:
- issue: Символика камня и семи глаз
  choice: Сохранить образы буквально, не отождествляя их в основном тексте.
  alternative: Истолковать камень мессиански, а семь глаз — как всеведение Бога.
  rationale: Сам стих не даёт прямого истолкования этих символов, поэтому перевод не должен устранять заложенную в тексте неоднозначность.
- issue: Значение עָוֹן
  choice: вина
  alternative: беззаконие; грех; наказание за вину
  rationale: Еврейское слово допускает несколько взаимосвязанных оттенков. «Вина» сохраняет нравственно-судебный смысл и естественно описывает то, что Бог удаляет.
- issue: Передача יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: Передача собственного имени как «Яхве» сохраняет его отличие от титула, а «Воинств» оставляет широкий образ небесных или иных сил без чрезмерного уточнения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксическая резкость образа «на одном камне — семь глаз» намеренно сохранена. Заглавные местоимения при обращении Бога к Себе использованы в соответствии с русской библейской традицией.
