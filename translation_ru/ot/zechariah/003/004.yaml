  terminology: «Грязные одежды» достаточно точно и понятно передаёт резко отрицательную характеристику הַבְּגָדִים הַצֹּאִים, хотя не эксплицирует её предельно грубый оттенок; это оправдано литературной нормой русского библейского текста. Выбор «вина» для עָוֹן и «нарядные одежды» для מַחֲלָצוֹת сопровождается корректными, ненавязчивыми сносками. Термины не вносят конфессиональных интерпретаций.
