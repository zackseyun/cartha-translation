  source_fidelity: 'Перевод точно передаёт последовательность древнееврейского текста: двойную вводную формулу «ответил и сказал», обращение к описательно названным стоящим перед говорящим, повеление снять одежды, совершённое удаление עָוֹן и последующее облачение. «Снял с тебя твою вину» удачно сохраняет образ удаления «с тебя» и не сужает עָוֹן до одного только значения греха. «Нарядные одежды» приемлемо передаёт מַחֲלָצוֹת как почётную/парадную одежду, не навязывая обрядового толкования.'
