  text: וַ/יַּ֣עַן וַ/יֹּ֗אמֶר אֶל הָ/עֹמְדִ֤ים לְ/פָנָי/ו֙ לֵ/אמֹ֔ר הָסִ֛ירוּ הַ/בְּגָדִ֥ים הַ/צֹּאִ֖ים מֵ/עָלָ֑י/ו וַ/יֹּ֣אמֶר אֵלָ֗י/ו רְאֵ֨ה הֶעֱבַ֤רְתִּי מֵ/עָלֶ֨י/ךָ֙ עֲוֺנֶ֔/ךָ וְ/הַלְבֵּ֥שׁ אֹתְ/ךָ֖ מַחֲלָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
translation:
  language: ru
  text: 'И он ответил и сказал стоявшим перед ним[a]: «Снимите с него грязные одежды». Затем он сказал ему: «Смотри, я снял с тебя твою вину[b] и облеку тебя в нарядные одежды[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стоявшие перед ним, вероятно, были небесными служителями, однако в еврейском тексте они названы лишь описательно.
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может означать также «беззаконие» или последствие вины.
    reason: lexical_ambiguity
  - marker: c
    text: 'Или: «богатые одежды», «парадное облачение». Еврейское слово обозначает почётную, роскошную одежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: ответил и сказал
  rationale: Сохраняет оба древнееврейских глагола и повествовательную формулу, не предполагая наличия явно заданного вопроса.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: стоявшим перед ним
  rationale: Передаёт описательное выражение буквально и естественно, не добавляя прямо не названных ангелов или слуг.
- source_word: הַבְּגָדִים הַצֹּאִים
  choice: грязные одежды
  rationale: צֹאִים обозначает крайне нечистое, запачканное состояние; «грязные» сохраняет яркий образ без внесения отдельного ритуального толкования.
- source_word: הֶעֱבַרְתִּי מֵעָלֶיךָ עֲוֺנֶךָ
  choice: я снял с тебя твою вину
  rationale: Глагол передаёт совершившееся устранение, а עָוֹן здесь допускает значения вины, беззакония и его последствий; «вина» естественно сочетается с образом снятой одежды.
- source_word: וְהַלְבֵּשׁ אֹתְךָ
  choice: и облеку тебя
  rationale: Передаёт продолжение речи от первого лица и сохраняет возвышенный, но понятный глагол, соответствующий образу облачения.
- source_word: מַחֲלָצוֹת
  choice: нарядные одежды
  rationale: Редкое слово обозначает почётное, богатое или парадное одеяние; «нарядные одежды» передаёт достоинство одежды, не уточняя сверх текста её обрядовое назначение.
theological_decisions:
- issue: Смысл смены одежд
  choice: Сохранить прямую связь между снятием грязных одежд и снятием вины, не превращая образ в догматическую формулу.
  alternative: Раскрыть действие как оправдание либо восстановление первосвященника в служении.
  rationale: Стих сам истолковывает символическое снятие одежд как удаление עָוֹן, но не формулирует более узкой систематической доктрины.
- issue: Кто такие стоящие перед говорящим
  choice: Оставить описательное выражение «стоявшие перед ним».
  alternative: Назвать их небесными служителями или ангелами.
  rationale: Контекст допускает небесных служителей, однако само древнееврейское выражение не называет их прямо.
- issue: Значение עָוֹן
  choice: 'Основной текст: «вина», с указанием в сноске иных возможных оттенков.'
  alternative: «Беззаконие» или «наказание за беззаконие».
  rationale: Слово семантически охватывает проступок, виновность и порой его последствие; контекст удаления нечистоты особенно поддерживает значение вины, но неоднозначность следует обозначить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Местоимения, относящиеся к говорящему, оставлены со строчной буквы, чтобы не решать средствами орфографии вопрос о его тождестве. Повтор «ответил и сказал» сохранён как значимая древнееврейская повествовательная формула; остальные обороты сделаны естественными для современного читателя.
