  text: כֹּה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אִם בִּ/דְרָכַ֤/י תֵּלֵךְ֙ וְ/אִ֣ם אֶת מִשְׁמַרְתִּ֣/י תִשְׁמֹ֔ר וְ/גַם אַתָּה֙ תָּדִ֣ין אֶת בֵּיתִ֔/י וְ/גַ֖ם תִּשְׁמֹ֣ר אֶת חֲצֵרָ֑/י וְ/נָתַתִּ֤י לְ/ךָ֙ מַהְלְכִ֔ים בֵּ֥ין הָ/עֹמְדִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Если ты будешь ходить Моими путями и исполнять порученное Мною служение, то будешь и управлять Моим домом, и охранять Мои дворы, а Я дам тебе свободно ходить среди тех, кто стоит здесь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение редкого еврейского слова спорно. Возможны также переводы: «Я дам тебе ходящих среди тех, кто стоит здесь» или «Я дам тебе места для хождения среди тех, кто стоит здесь».'
    reason: Сохранение неоднозначности редкого слова מַהְלְכִים и его синтаксической связи с последующей фразой.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — широким и традиционно понятным словом «Воинств», без сужения значения до земных армий.
- source_word: בִּדְרָכַי תֵּלֵךְ
  choice: будешь ходить Моими путями
  rationale: Сохранена ясная для современного русского читателя библейская метафора нравственной и заветной жизни.
- source_word: מִשְׁמַרְתִּי תִשְׁמֹר
  choice: исполнять порученную Мною службу
  rationale: В священническом контексте выражение обозначает вверенную обязанность или служение; такой перевод точнее общего «соблюдать Мою заповедь».
- source_word: תָּדִין אֶת־בֵּיתִי
  choice: управлять Моим домом
  rationale: דין здесь допускает значение управления и надзора; храмовый контекст не требует сужать смысл до судебной деятельности.
- source_word: תִּשְׁמֹר אֶת־חֲצֵרָי
  choice: охранять Мои дворы
  rationale: Глагол передаёт обязанность хранить и блюсти храмовые дворы, а «дворы» естественно обозначает храмовые пространства.
- source_word: מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: свободно ходить среди тех, кто стоит здесь
  rationale: Фраза, вероятно, обещает право свободного движения и доступа среди присутствующих небесных служителей; глагольная формулировка естественна по-русски, а неоднозначность отмечена в сноске.
- source_word: וְגַם ... וְגַם
  choice: и управлять ... и охранять
  rationale: Парная русская конструкция сохраняет ступенчатое добавление двух обещанных обязанностей.
theological_decisions:
- issue: Значение обещания וְנָתַתִּי לְךָ מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: Обещание свободно ходить среди стоящих здесь, то есть получить доступ в их среду
  alternative: «дам тебе ходящих среди стоящих здесь» или «дам тебе места для хождения среди стоящих здесь»
  rationale: Редкое слово מַהְלְכִים и вся конструкция допускают несколько разборов. Контекст видения благоприятствует смыслу дарованного доступа среди небесных служителей, однако спорные альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ «ходить Моими путями», храмовая терминология и прямое личное имя Бога; синтаксис сделан плавным и понятным без устранения спорности заключительного обещания.
