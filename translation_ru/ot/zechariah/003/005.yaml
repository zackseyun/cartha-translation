base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
translation:
  language: ru
  text: 'Тогда я сказал[a]: «Пусть наденут ему на голову чистый[b] тюрбан». И они надели ему на голову чистый тюрбан и облекли его в одежды, в то время как ангел Яхве[c] стоял рядом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я сказал». Еврейский союз может быть передан простым «и»; «тогда» отражает последовательность повествования.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «ритуально чистый».'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение «ангел Яхве» оставлено без дополнительного истолкования: мнения о том, идёт ли речь о сотворённом ангеле-посланнике или о явлении самого Яхве, расходятся.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я сказал
  rationale: Последовательная форма с וַ־ продвигает повествование; «тогда» естественно передаёт переход к следующему действию, сохраняя первое лицо.
- source_word: יָשִׂימוּ
  choice: Пусть наденут
  rationale: Форма выражает побуждение или пожелание в третьем лице множественного числа. В сочетании с головным убором русское «надеть» звучит естественнее буквального «положить».
- source_word: צָנִיף
  choice: тюрбан
  rationale: Слово обозначает обёрнутый вокруг головы убор; «тюрбан» точно и без излишнего уточнения передаёт предмет в данном контексте.
- source_word: טָהוֹר
  choice: чистый
  rationale: «Чистый» сохраняет обычную лексику ритуальной чистоты; возможное «чистый, непорочный» не требуется, а «чистый» применительно к одежде остаётся естественным.
- source_word: עַל רֹאשׁוֹ
  choice: ему на голову
  rationale: Локативное значение сохранено; местоименная конструкция перестроена в соответствии с естественным русским управлением глагола «надеть».
- source_word: וַיָּשִׂימוּ הַצָּנִיף הַטָּהוֹר
  choice: И они надели ему на голову чистый тюрбан
  rationale: Сохранены последовательность действия и повтор определения «чистый»; определённость предмета в русском ясна из непосредственного контекста.
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  choice: и облекли его в одежды
  rationale: «Облекли» передаёт каузативное значение «одели» и поддерживает достоинство сцены, не уточняя вид одежд сверх текста.
- source_word: בְּגָדִים
  choice: одежды
  rationale: Общее слово исходного текста сохранено; более специальное «облачения» могло бы неоправданно уточнить, что речь именно о священнических одеждах.
- source_word: וּמַלְאַךְ יְהוָה
  choice: а ангел Яхве
  rationale: Союз передаёт сопутствующее обстоятельство, а сочетание מַלְאַךְ יְהוָה переведено прямо, без истолкования личности ангела. Имя יהוה передано как «Яхве».
- source_word: עֹמֵד
  choice: стоял рядом
  rationale: Причастие обозначает продолжающееся состояние; несовершенный вид «стоял» передаёт его длительность, а «рядом» — присутствие при происходящем.
theological_decisions:
- issue: Личность מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве; ангел Господень
  rationale: Прямой перевод не решает, является ли этот персонаж сотворённым небесным посланником или явлением самого Яхве; неоднозначность исходного выражения сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис прост и доступен; «облекли» сохраняет достоинство сцены, а остальные глаголы употреблены в современном естественном значении.
