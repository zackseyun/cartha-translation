source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן יִגְעַ֨ר יְהוָ֤ה בְּ/ךָ֙ הַ/שָּׂטָ֔ן וְ/יִגְעַ֤ר יְהוָה֙ בְּ/ךָ֔ הַ/בֹּחֵ֖ר בִּ/ירֽוּשָׁלִָ֑ם הֲ/ל֧וֹא זֶ֦ה א֖וּד מֻצָּ֥ל מֵ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
translation:
  language: ru
  text: 'И сказал Яхве обвинителю[a]: «Да обличит тебя Яхве, обвинитель! Да обличит тебя Яхве, избравший Иерусалим! Разве это не головня, выхваченная из огня[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, по традиции, «Сатане». В еврейском тексте стоит титул «обвинитель».
    reason: alternative_reading
  - marker: b
    text: 'Или: «обгоревшая ветка, спасённая из огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַשָּׂטָן
  choice: обвинитель
  rationale: С артиклем еврейское слово здесь обозначает роль или титул — обвинителя в судебной сцене видения; традиционное «Сатана» дано в сноске.
- source_word: יִגְעַר
  choice: да обличит
  rationale: Передаёт сильное властное порицание и сохраняет форму пожелания/приговора в прямой речи.
- source_word: הַבֹּחֵר בִּירוּשָׁלִָם
  choice: избравший Иерусалим
  rationale: Естественно передаёт субстантивированное причастие и состоявшийся выбор Иерусалима, не утяжеляя фразу придаточным предложением.
- source_word: הֲלוֹא
  choice: разве ... не
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: אוּד
  choice: головня
  rationale: Точное и образное русское обозначение обгоревшего куска дерева, ещё сохраняющего связь с огнём.
- source_word: מֻצָּל מֵאֵשׁ
  choice: выхваченная из огня
  rationale: Передаёт пассивное избавление и яркий образ спасения от непосредственной опасности.
theological_decisions:
- issue: Следует ли передавать הַשָּׂטָן как имя собственное или как титул
  choice: В основном тексте — «обвинитель»
  alternative: «Сатана» или «противник»
  rationale: Артикль и судебный контекст указывают на функцию обвинителя. Традиционное отождествление не отвергается, а отражено в сноске.
- issue: Повтор формулы יִגְעַר יְהוָה בְּךָ
  choice: Сохранить оба повелительных пожелания без объединения
  alternative: Свести их к одной фразе
  rationale: Повтор присутствует в еврейском тексте, усиливает судебную и риторическую выразительность и не должен сглаживаться.
- issue: Референт указательного местоимения זֶה
  choice: «это» без явного называния лица
  alternative: «он» или явное «Иисус»
  rationale: Еврейский текст оставляет референт дейктически выраженным; нейтральное русское «это» сохраняет образ и не устраняет возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор оригинала сохранён; устаревшие синтаксические конструкции и конфессионально маркированная терминология не вводятся.
