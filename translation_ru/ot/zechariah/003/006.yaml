lexical_decisions:
- source_word: וַיָּעַד
  choice: И … торжественно наставил
  rationale: Глагол выражает официальное и веское наставление или предостережение; «торжественно наставил» сохраняет эту силу, не предрешая, будет ли последующая речь преимущественно повелением или предупреждением. Союз «И» передаёт повествовательную последовательность формы с וַ־.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאַךְ может означать как ангела, так и посланника; в контексте пророческого видения естественнее «Ангел». Возможное значение «Посланник» сохранено в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя, представленное тетраграмматоном, передано принятой русской транслитерацией «Яхве», а не заменено титулом «Господь».
- source_word: בִּיהוֹשֻׁעַ
  choice: Иисуса
  rationale: Предлог ב при יעד обозначает лицо, к которому обращено торжественное наставление. Имя יְהוֹשֻׁעַ передано традиционной русской библейской формой «Иисус»; винительный падеж обусловлен выбранной естественной русской конструкцией.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Сохранена стандартная древнееврейская формула, вводящая прямую речь в следующем стихе.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное Божье имя; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  alternative: Посланник Яхве
  rationale: Контекст видения поддерживает традиционное понимание «Ангел», однако лексическая двузначность не устранена и отмечена в сноске без дальнейшего догматического отождествления.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка сохраняет официальный и веский характер речи, не используя архаичные обороты.
