  to: Выслушай же, Иисус, первосвященник, ты и твои товарищи, сидящие перед тобою, ибо они — люди, служащие знамением[a], ибо вот, Я привожу Моего слугу — Отрасль.
  rationale: Убрано не поддержанное оригиналом «итак»; «же» передаёт функцию נָא. Формулировка о людях-знамениях приближена к именной конструкции אַנְשֵׁי מוֹפֵת при сохранении современного литературного русского и смысловой неоднозначности в сноске. Остальные ключевые термины и образный строй сохранены.
