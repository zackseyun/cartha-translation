source:
  edition: WLC
  text: שְֽׁמַֽע נָ֞א יְהוֹשֻׁ֣עַ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל אַתָּה֙ וְ/רֵעֶ֨י/ךָ֙ הַ/יֹּשְׁבִ֣ים לְ/פָנֶ֔י/ךָ כִּֽי אַנְשֵׁ֥י מוֹפֵ֖ת הֵ֑מָּה כִּֽי הִנְ/נִ֥י מֵבִ֛יא אֶת עַבְדִּ֖/י צֶֽמַח־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
translation:
  language: ru
  text: Выслушай же, Иисус, первосвященник, ты и твои товарищи, сидящие перед тобою, ибо они — люди, служащие знамением[a], ибо вот, Я привожу Моего слугу — Отрасль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди, которые сами являются знамением»; возможный смысл: «люди-предзнаменования».'
    reason: Слово מוֹפֵת может обозначать знак, символическое указание или предзнаменование; конструкция характеризует названных людей как имеющих такое значение.
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Итак, выслушай
  rationale: Императив с частицей נָא выражает настойчивый призыв обратить внимание. «Выслушай» естественно передаёт направленное обращение, а «итак» отмечает переход к торжественному объявлению.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус
  rationale: Использована устоявшаяся русская библейская форма имени Иисуса, сына Иоседекова, а не передача через английскую форму Joshua.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Это общепринятое и точное русское обозначение высшей священнической должности.
- source_word: וְרֵעֶיךָ
  choice: твои товарищи
  rationale: רֵעַ здесь обозначает находящихся рядом с Иисусом спутников или соратников, не обязательно близких друзей.
- source_word: הַיֹּשְׁבִים לְפָנֶיךָ
  choice: сидящие перед тобой
  rationale: Сохранён конкретный образ людей, сидящих в присутствии Иисуса и обращённых к нему.
- source_word: אַנְשֵׁי מוֹפֵת
  choice: эти люди служат знамением
  rationale: Русское «люди знамения» звучит неестественно. Выбранная формулировка передаёт, что сами люди имеют символическое, предзнаменовательное значение, не уточняя его сверх текста.
- source_word: הִנְנִי
  choice: Вот
  rationale: «Вот» естественно вводит торжественное Божье объявление и сохраняет указательную силу частицы.
- source_word: מֵבִיא
  choice: Я привожу
  rationale: Настоящее время передаёт непосредственность и уверенность конструкции הִנְנִי с причастием; «привожу» уместно для явления назначенного Богом лица.
- source_word: עַבְדִּי
  choice: Моего слугу
  rationale: «Слуга» передаёт служение и поручение; форма «раба» могла бы неоправданно выдвинуть на первый план несвободный статус.
- source_word: צֶמַח
  choice: Отрасль
  rationale: Слово означает росток или побег и в данном пророческом контексте выступает как именование грядущей фигуры. «Отрасль» сохраняет растительную метафору и узнаваемую титульность; прописная буква отмечает употребление как особого наименования.
theological_decisions:
- issue: Следует ли передавать צֶמַח как особое мессианское именование или как обычное существительное
  choice: «Отрасль» с прописной буквы
  alternative: «росток», «побег», «отрасль» со строчной буквы
  rationale: Сочетание с «Моим слугой» и дальнейшее употребление в Зах 6:12 поддерживают титульное прочтение. Перевод сохраняет образ, но не добавляет прямого отождествления, которого нет в самом стихе.
- issue: Насколько явно истолковывать אַנְשֵׁי מוֹפֵת
  choice: «эти люди служат знамением» с примечанием
  alternative: «люди знамения», «люди-предзнаменования», «люди, являющиеся знамением»
  rationale: Основной текст передаёт символическую функцию этих людей естественным русским языком, а примечание сохраняет диапазон значения מוֹפֵת — знак или предзнаменование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим тоном. Обращение дано на «ты» по форме древнееврейского единственного числа. Заглавные буквы в местоимениях Бога и в именовании «Отрасль» отражают русскую библейскую издательскую традицию, не расширяя содержания стиха.
