lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  choice: Иисус
  rationale: Союз ו продолжает повествование и по-русски не требует отдельной передачи в начале предложения. Имя передано в принятой русской библейской форме.
- source_word: הָיָה לָבֻשׁ
  choice: был одет
  rationale: Сочетание описывает состояние Иисуса, а не переход в новое состояние; естественное русское соответствие сохраняет пассивно-стативный смысл.
- source_word: בְּגָדִים
  choice: одежды
  rationale: Форма множественного числа сохраняет структуру исходного выражения и соответствует несколько возвышенному регистру видения, не уточняя вид облачения.
- source_word: צוֹאִים
  choice: грязные
  rationale: Слово обозначает резко выраженную нечистоту одежды. «Грязные» звучит естественно и непосредственно; более сильный оттенок отмечен в сноске.
- source_word: וְ/עֹמֵד
  choice: и стоял
  rationale: Причастие обозначает продолжающееся положение, одновременное описанному состоянию; русская форма несовершенного вида передаёт длительность.
- source_word: לִ/פְנֵי
  choice: перед
  rationale: Краткое и обычное соответствие пространственному значению присутствия перед кем-либо.
- source_word: הַ/מַּלְאָךְ
  choice: ангелом
  rationale: В контексте небесного видения «ангел» является наиболее естественным значением, тогда как буквальное «вестник» остаётся возможным и указано в сноске.
theological_decisions:
- issue: Личность הַמַּלְאָךְ в данном стихе
  choice: ангелом
  alternative: вестником; ангелом Господним как теофанической фигурой в более широком контексте
  rationale: Сам стих называет фигуру только «ангелом» с определённым артиклем и не даёт более точного отождествления. Перевод не вносит в текст богословское определение из контекста.
translation_notes:
