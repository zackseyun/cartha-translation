lexical_decisions:
- source_word: וַיַּזְעֵק אֹתִי
  choice: громко обратился ко мне
  rationale: Глагол זעק обозначает громкий возглас или настойчивое обращение. Такой перевод передаёт усиленную звуковую окраску, не приписывая говорящему конкретной эмоции.
- source_word: וַיְדַבֵּר אֵלַי לֵאמֹר
  choice: и сказал
  rationale: Стандартная древнееврейская формула введения прямой речи естественно и без потери смысла передаётся по-русски одним глаголом.
- source_word: רְאֵה
