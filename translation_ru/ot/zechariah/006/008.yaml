  rationale: Императив привлекает внимание к смыслу увиденного; «смотри» современно и уместно в контексте видения.
- source_word: הַיּוֹצְאִים
  choice: вышедшие
  rationale: Причастие обозначает участников видения, отправившихся в указанную землю. В русском контексте совершившееся движение естественнее передаётся формой «вышедшие», без уточнения подразумеваемых колесниц.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: в северную землю
  rationale: Сохраняет географическое обозначение и направление движения; оборот «земля севера» был бы менее естественным по-русски.
- source_word: הֵנִיחוּ
  choice: успокоили
  rationale: Каузативная форма от נוח выражает приведение к покою или состоянию успокоения. «Успокоили» кратко передаёт этот смысл, сохраняя возможность оттенка утолённого судебного негодования.
- source_word: רוּחִי
  choice: Мой Дух
  rationale: רוּחַ может означать дух, ветер или внутреннее состояние. В прямой речи Бога контекст поддерживает «Мой Дух», тогда как возможный смысл Божьего негодования разъясняется в примечании, а не подменяет исходный образ.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: в северной земле
  rationale: Повтор географического выражения сохранён вслед за еврейским текстом ради его риторического акцента.
theological_decisions:
- issue: Смысл выражения «успокоили Мой Дух»
  choice: Сохранено прямое упоминание Божьего Духа и образ приведения Его к покою.
  alternative: «утолили Мой гнев» или «дали покой моему духу»
  rationale: Еврейское רוּחִי допускает понимание как Божьего Духа или внутреннего расположения, возможно включая судебное негодование. Основной текст не сводит многозначный образ к одному истолкованию; вероятный оттенок гнева отмечен в сноске.
translation_notes:
