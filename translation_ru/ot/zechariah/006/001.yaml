base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
translation:
  language: ru
  text: 'Я снова поднял глаза и увидел: вот, четыре колесницы выходили из промежутка между двумя горами[a], а горы эти были горами из бронзы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из промежутка между этими двумя горами»; в еврейском тексте слово «горы» употреблено с определённым артиклем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из меди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב וָאֶשָּׂא עֵינַי
  choice: Я снова поднял глаза
  rationale: 'Сочетание שׁוב с последующим действием естественно передаёт возобновление действия: пророк вновь обращает взор к видению. Русское «снова поднял глаза» сохраняет смысл формулы и звучит естественнее буквального «я возвратился и поднял глаза».'
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 'и увидел: вот'
  rationale: Глагол ראה прямо обозначает зрительное восприятие, а הִנֵּה живо вводит открывшуюся картину. Двоеточие естественно связывает их в современном русском повествовании.
- source_word: אַרְבַּע מַרְכָּבוֹת
  choice: четыре колесницы
  rationale: מַרְכָּבָה здесь обозначает колесницу; прямой русский эквивалент соответствует контексту видения.
- source_word: יֹצְאוֹת
  choice: выходили
  rationale: Причастная форма изображает действие в процессе. Русское прошедшее несовершенного вида согласуется с рассказом о видении и сохраняет длительность наблюдаемого выхода.
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  choice: между двумя горами
  rationale: Предлог מִבֵּין указывает на движение из пространства между горами. В сочетании с «выходили» русское «между двумя горами» естественно передаёт исходную точку; определённость еврейского выражения отмечена в сноске.
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  choice: а горы эти были горами из бронзы
  rationale: Повтор слова «горы» сохраняет выразительную структуру еврейского текста. «Из бронзы» передаёт נְחֹשֶׁת в обычном для библейского монументального образа значении, не исключая варианта «медь».
theological_decisions:
- issue: Значение названия металла נְחֹשֶׁת
  choice: бронза
  alternative: медь
  rationale: Это лексическая, а не конфессиональная развилка. В основном тексте выбрана «бронза» как традиционное и контекстуально уместное обозначение материала; допустимое значение «медь» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Формула «поднял глаза» сохраняет библейский образ, «вот» — живость видения, а повтор «горы… горами» — подчёркнутую структуру оригинала.
