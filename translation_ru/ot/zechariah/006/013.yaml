reference: Zechariah 6:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
translation:
  language: ru
  text: Он воздвигнет храм Яхве и понесёт на себе величие[c]. Он воссядет на своём престоле и будет править; он будет священником на своём престоле[a], и между ними двумя будет совет мира[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и на его престоле будет священник»; еврейский текст допускает понимание священника как фигуры, отличной от восседающего правителя.'
    reason: alternative_reading
  - marker: b
    text: Слова «между ними двумя» могут относиться к царской и священнической ролям либо к двум отдельным фигурам — правителю и священнику.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «честь» или «блеск».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Именно он
  rationale: Выделительное местоимение передаёт эмфатическое указание на названную ранее фигуру; русское «именно он» естественнее и точнее, чем вводное «да».
- source_word: הֵיכַל יְהוָה
  choice: храм Яхве
  rationale: В данном контексте הֵיכָל обозначает святилище, а тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: יִשָּׂא הוֹד
  choice: понесёт на себе величие
  rationale: Сохраняется конкретный образ глагола נשׂא «нести» и царственный оттенок הוֹד; добавление «на себе» делает сочетание естественным по-русски, не превращая его в «получит славу».
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  choice: воссядет на своём престоле и будет править
  rationale: «Воссядет» естественно выражает царское сидение на престоле, а отдельный глагол «будет править» сохраняет последовательность еврейского текста.
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  choice: он будет священником на своём престоле
  rationale: Наиболее прямое грамматическое прочтение сохраняет того же подлежащего и не устраняет необычное соединение священнического и царского образов.
- source_word: וַעֲצַת שָׁלוֹם
  choice: и … будет совет мира
  rationale: Буквальное сочетание сохраняет возможные значения совета, замысла и согласованного решения, не сводя выражение только к мирному согласию.
- source_word: בֵּין שְׁנֵיהֶם
  choice: между ними обоими
  rationale: Формулировка сохраняет намеренно неуточнёнными два референта местоимения.
theological_decisions:
- issue: Относится ли «священник» к восседающему правителю или к иной фигуре
  choice: 'В основном тексте сохранено единое подлежащее: «он будет священником на своём престоле».'
  alternative: «На его престоле будет священник» или понимание священника как второй, отдельной от правителя фигуры.
  rationale: Цепочка форм третьего лица единственного числа естественнее указывает на одного деятеля, однако синтаксис допускает неопределённое «будет священник»; альтернатива отмечена в сноске.
- issue: Кого обозначает выражение «между ними обоими»
  choice: Референты в переводе не уточняются.
  alternative: Две отдельные фигуры — правитель и священник — либо две роли, царская и священническая, соединённые в одном лице.
  rationale: Еврейский текст явно говорит о двух, но не называет их здесь; уточнение сняло бы подлинную богословскую и синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Воздвигнет» и «воссядет» слегка возвышенны, но общеупотребительны в храмовом и царском контексте. Пунктуация разделяет царскую и священническую части, не разрывая последовательность одного подлежащего.
