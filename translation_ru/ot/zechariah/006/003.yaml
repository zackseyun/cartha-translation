  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
translation:
  language: ru
  text: В третьей колеснице — белые кони, и в четвёртой колеснице — пегие кони, сильные.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «пегие кони — и сильные», если слово «сильные» обозначает отдельную группу, а не дополнительно характеризует коней четвёртой колесницы.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  choice: в … колеснице
  rationale: Предлог ב допускает значения «в» и «на»; здесь речь идёт о конях, составляющих упряжку соответствующей колесницы, поэтому по-русски естественно «в … колеснице».
- source_word: הַשְּׁלִשִׁית
  choice: третьей
  rationale: Порядковое числительное согласовано с существительным «колесница».
- source_word: סוּסִים
  choice: кони
  rationale: Обычное обозначение лошадей; «кони» естественно звучит в возвышенном повествовании о колесницах и последовательно передано в обеих частях стиха.
- source_word: לְבָנִים
  choice: белые
  rationale: Прямое обозначение белого цвета.
- source_word: הָרְבִעִית
  choice: четвёртой
  rationale: Порядковое числительное согласовано с существительным «колесница».
- source_word: בְּרֻדִּים
  choice: пегие
  rationale: Слово обозначает неоднородную, пятнистую масть; «пегие» — естественное русское определение масти коней.
- source_word: אֲמֻצִּים
  choice: сильные
  rationale: Прилагательное от корня אמץ выражает силу и крепость. Обособленное определение сохраняет еврейский порядок слов и не сливает его с обозначением масти.
theological_decisions:
- issue: Описывает ли אֲמֻצִּים пегих коней четвёртой колесницы или обозначает отдельную группу коней
  choice: 'В основном тексте слово отнесено к коням четвёртой колесницы: «пегие кони, сильные».'
  alternative: «пегие кони — и сильные», где «сильные» понимаются как отдельная группа.
  rationale: Последовательность «кони — пегие — сильные» без повторения существительного естественно позволяет понимать оба прилагательных как характеристики одних коней. Однако синтаксическая краткость допускает выделение «сильных» в отдельную группу, поэтому эта возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Тире делает перечисление ясным, а обособленное «сильные» сохраняет порядок и некоторую неоднозначность еврейского текста.
