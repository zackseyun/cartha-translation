id: ZEC.6.6
reference: Zechariah 6:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
translation:
  language: ru
  text: Чёрные кони в ней выходят в северную страну, белые вышли вслед за ними, а пёстрые вышли в южную страну[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в страну Феман», если תֵּימָן понимать как название местности, а не как обозначение юга.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  choice: в ней
  rationale: Местоимение относится к колеснице из предыдущего контекста; краткая конструкция естественно передаёт локативный смысл без тяжеловесного относительного оборота.
- source_word: הַסּוּסִים הַשְּׁחֹרִים
  choice: чёрные кони
  rationale: Прямое и ясное обозначение животных и их масти; «кони» уместно в возвышенном повествовании о колесницах.
- source_word: יֹצְאִים
  choice: выходят
  rationale: Причастная форма изображает действие как происходящее в видении.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: в северную страну
  rationale: Естественно по-русски передаёт буквальное «в землю севера» и сохраняет географическую параллель с южной страной.
- source_word: וְהַלְּבָנִים
  choice: белые
  rationale: Сохраняет эллипсис оригинала, где существительное «кони» не повторяется.
- source_word: יָצְאוּ
  choice: вышли
  rationale: Совершенный вид передаёт завершённость действия в отличие от предшествующего причастия «выходят».
- source_word: אֶל אַחֲרֵיהֶם
  choice: вслед за ними
  rationale: Ясно передаёт движение белых коней следом за чёрными.
- source_word: וְהַבְּרֻדִּים
  choice: пёстрые
  rationale: Передаёт неоднородную, пятнистую масть коней естественным русским обозначением.
- source_word: אֶל אֶרֶץ הַתֵּימָן
  choice: в южную страну
  rationale: В данном параллелизме תֵּימָן вероятнее обозначает юг; вариант с топонимом сохранён в примечании.
theological_decisions:
- issue: Значение הַתֵּימָן в контексте видения
  choice: южная страна
  alternative: страна Феман
  rationale: Противопоставление «северной стране» указывает на направление или область юга, однако возможное понимание слова как топонима не устранено и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранено видовременное различие между причастием יֹצְאִים («выходят») и формами יָצְאוּ («вышли»). Маркер примечания поставлен при «южную страну», поскольку именно к слову הַתֵּימָן относится альтернативное чтение.
