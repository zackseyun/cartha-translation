  text: וְ/לָקַחְתָּ֥ כֶֽסֶף וְ/זָהָ֖ב וְ/עָשִׂ֣יתָ עֲטָר֑וֹת וְ/שַׂמְתָּ֗ בְּ/רֹ֛אשׁ יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֥ן הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
translation:
  language: ru
  text: Возьми серебро и золото, сделай венцы[a] и возложи их на голову Иисуса, сына Иоседека, первосвященника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «венцы» (множественное число). Некоторые понимают это как один составной венец и переводят «венец».
    reason: Альтернативное понимание грамматического множественного числа в контексте единого символического действия.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Возьми
  rationale: Форма перфекта 2-го лица мужского рода единственного числа с союзом в контексте пророческого повеления естественно передаётся русским императивом.
- source_word: כֶסֶף וְזָהָב
  choice: серебро и золото
  rationale: Названия конкретных материалов переданы прямо, без обобщения как «деньги» или «драгоценные металлы».
- source_word: וְעָשִׂיתָ עֲטָרוֹת
  choice: сделай венцы
  rationale: Существительное עֲטָרוֹת имеет форму множественного числа; «венцы» сохраняет грамматическую форму и значимую неоднозначность пророческого символического действия.
- source_word: וְשַׂמְתָּ בְּרֹאשׁ
  choice: возложи их на голову
  rationale: «Возложи» естественно звучит при церемониальном помещении венца на голову; местоимение «их» эксплицирует подразумеваемое дополнение и требуется для ясного русского синтаксиса.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Иисуса, сына Иоседека
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, узнаваемые современным читателем.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященника
  rationale: Это обычное и точное русское обозначение должности главного священника.
theological_decisions:
- issue: Множественное число עֲטָרוֹת при возложении на голову одного человека
  choice: Сохранить в основном тексте множественное число «венцы»
  alternative: Передать единственным числом «венец», понимая несколько частей как один составной венец
  rationale: В еврейском тексте прямо стоит множественное число. Его сохранение не устраняет истолковательную напряжённость пророческого знамения, а возможное понимание как одного составного венца отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным оттенком. Синтаксис краткий и повелительный; традиционные формы имён и термин «первосвященник» обеспечивают узнаваемость без архаических конструкций.
