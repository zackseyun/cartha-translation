base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
translation:
  language: ru
  text: Возьми у изгнанников — у Хелдая, у Товии и у Иедаии — и сам в тот день пойди в дом Иосии, сына Софонии. Они пришли из Вавилона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте заключительное придаточное стоит во множественном числе: «которые пришли из Вавилона». Вероятнее всего, оно относится к Хелдаю, Товии и Иедаии, а не к Иосии; в русском переводе это передано отдельным предложением, чтобы избежать грамматической двусмысленности.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקוֹחַ
  choice: Возьми
  rationale: Инфинитив абсолютный породы qal употреблён как повеление; краткая форма «возьми» естественно передаёт пророческое указание.
- source_word: מֵאֵת הַגּוֹלָה
  choice: у переселенцев
  rationale: הַגּוֹלָה обозначает сообщество изгнанников или вернувшихся переселенцев, а не отвлечённое состояние плена.
- source_word: חֶלְדַּי
  choice: Хелдай
  rationale: Транслитерация личного имени с сохранением начального гортанного согласного через принятую русскую форму «Х».
- source_word: טוֹבִיָּה
  choice: Товия
  rationale: Традиционная и узнаваемая русская передача имени, сохраняющая конечный теофорный элемент -ия.
- source_word: יְדַעְיָה
  choice: Иедаия
  rationale: Транслитерация личного имени в соответствии с русской библейской ономастической традицией.
- source_word: וּבָאתָ אַתָּה
  choice: и сам ... пойди
  rationale: בוא может обозначать движение «прийти/пойти» в зависимости от точки отсчёта; здесь естественно «пойди», а явное местоимение אַתָּה передано усилительным «сам».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямой и естественный эквивалент устойчивого временного оборота.
- source_word: וּבָאתָ בֵּית
  choice: пойди в дом
  rationale: Повторный глагол בוא вместе с בֵּית указывает на движение к дому; по-русски единая конструкция «пойди в дом» передаёт обе еврейские формы без неестественного повторения.
- source_word: יֹאשִׁיָּה בֶן צְפַנְיָה
  choice: Иосии, сына Софонии
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён и явно передано отношение отца и сына.
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: куда они пришли из Вавилона
  rationale: Множественное בָּאוּ относится к трём ранее названным людям; наречное «куда» естественно связывает их прибытие с домом Иосии и избегает ошибочного отнесения множественного числа к одному Иосии.
