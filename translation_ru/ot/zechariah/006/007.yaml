base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
translation:
  language: ru
  text: 'И сильные[a] вышли и пожелали отправиться, чтобы ходить по всей земле[b]. Он сказал: «Идите, ходите по всей земле», — и они ходили по всей земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пёстрые». Так это слово традиционно понимают как обозначение масти коней или упряжек; однако огласовка еврейского Масоретского текста естественнее означает «сильные».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «по стране». Еврейское אֶרֶץ в зависимости от контекста может означать как всю землю, так и отдельную страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  choice: сильные
  rationale: Масоретская огласовка естественно указывает на прилагательное со значением силы или мощи. Контекст допускает традиционное цветовое обозначение, поэтому оно вынесено в сноску.
- source_word: יָצְאוּ
  choice: вышли
  rationale: Прямо передаёт обычное значение глагола יצא и соответствует повествовательной перспективе видения.
- source_word: וַיְבַקְשׁוּ
  choice: пожелали
  rationale: В сочетании с инфинитивом глагол выражает стремление или намерение; «пожелали» звучит естественно и не превращает действие в явно сформулированную просьбу.
- source_word: לָלֶכֶת
  choice: отправиться
  rationale: Передаёт начало движения и позволяет естественно соединить простой глагол הלך с последующим итеративным התהלך.
- source_word: לְהִתְהַלֵּךְ / הִתְהַלְּכוּ / וַתִּתְהַלַּכְנָה
  choice: ходить / ходите / стали ходить
  rationale: Сохраняет трёхкратный повтор одного еврейского корня и передаёт продолжительное, совершаемое по пространству движение, не добавляя более специального смысла «патрулировать».
- source_word: בָּאָרֶץ
  choice: по (всей) земле
  rationale: В контексте видения предпочтителен широкий смысл «земля, мир»; в первом употреблении «по всей» ясно передаёт пространственный охват, подразумеваемый формой глагола.
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Мужская форма единственного числа указывает на подразумеваемого говорящего; местоимение сохраняет имеющуюся в контексте референцию без дополнительного уточнения личности.
- source_word: לְכוּ
  choice: Идите
  rationale: Прямой и естественный русский эквивалент формы повелительного наклонения множественного числа.
theological_decisions:
- issue: Масштаб значения אֶרֶץ в видении
  choice: земля в смысле всей земли, мира
  alternative: страна, земля как ограниченная территория
  rationale: Посланники в видении направляются в разные стороны, что поддерживает всемирный масштаб; лексически возможное локальное значение отмечено в сноске.
- issue: Значение הָאֲמֻצִּים
  choice: сильные
  alternative: пёстрые (или гнедые)
  rationale: Основной текст следует масоретской огласовке, указывающей на силу. Цветовое толкование существенно из-за описания коней в ближайшем контексте и истории перевода, поэтому сохранено как альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Повтор «ходить по земле» намеренно сохраняет настойчивый трёхкратный повтор еврейского корня; форма «стали ходить» естественно передаёт начало последующего действия.
