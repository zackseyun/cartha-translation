lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: Тогда я спросил
  rationale: 'Буквально: «И я ответил и сказал». В данном контексте эта древнееврейская формула вводит вопрос пророка; естественное русское «спросил» точно передаёт речевое действие, не создавая впечатления, будто ангел только что задал вопрос.'
- source_word: הַמַּלְאָךְ
  choice: ангела
  rationale: Хотя מַלְאָךְ может означать «вестник», в контексте видения Захарии речь идёт о сверхъестественном ангеле-толкователе.
- source_word: הַדֹּבֵר בִּי
  choice: говорившего со мной
  rationale: Причастие דֹּבֵר обозначает продолжающееся или характерное действие, а сочетание с בִּי здесь передаёт общение с пророком. Такая формулировка естественна по-русски и сохраняет значение исходного выражения.
- source_word: מָה אֵלֶּה
  choice: Что это
  rationale: Вопрос относится к увиденным в видении предметам или явлениям. Русское «Что это?» естественно передаёт множественное указательное אֵלֶּה без избыточного добавления «всё» или «предметы».
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это уважительное обращение к ангелу, а не божественное имя. Постпозиция местоимения сохраняет достоинство и библейский оттенок, не делая обращение архаичным.
theological_decisions:
- issue: Относится ли אֲדֹנִי к Богу или служит уважительным обращением к ангелу
  choice: 'Уважительное обращение к ангелу: «господин мой»'
  alternative: «Господь мой» как божественный титул
  rationale: Непосредственный адресат назван ангелом, говорившим с пророком. Строчная буква и форма «господин мой» сохраняют почтительность, не отождествляя ангела с Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «ответил и сказал» передана функционально как «спросил», а уважительное обращение сохранено без ошибочного божественного оттенка.
