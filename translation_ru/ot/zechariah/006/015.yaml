  rationale: Правка восстанавливает предлог «в» при «храме Яхве» и тем самым сохраняет синтаксис и смысл еврейского текста без интерпретационного уточнения характера строительных работ. Слегка выровнены русская идиоматика и сноска к божественному имени. Неоднозначность круга «далёких» и точный охват заключительного условия сохранены.
