    rationale: Фраза «строить храм Яхве» переводит объект строительства, тогда как еврейский текст говорит о строительной деятельности «в храме Яхве». Контекст может подразумевать участие в храмовом строительстве, но перевод не должен снимать предлог и тем самым сужать или менять формулировку.
