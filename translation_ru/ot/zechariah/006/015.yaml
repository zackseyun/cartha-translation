  text: וּ/רְחוֹקִ֣ים יָבֹ֗אוּ וּ/בָנוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה וִ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/הָיָה֙ אִם שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
translation:
  language: ru
  text: И те, кто вдали, придут и будут строить в храме Яхве[a]. И вы узнаете, что Яхве Воинств послал меня к вам[b]. И это произойдёт, если вы будете неуклонно слушаться голоса Яхве, вашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь». Здесь и далее в стихе еврейский текст содержит личное имя Бога — Яхве.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «те, кто вдали» может относиться к живущим далеко, например к изгнанникам, но сам текст не уточняет, о какой группе идёт речь.
    reason: alternative_reading
lexical_decisions:
- source_word: וּרְחוֹקִים
  choice: те, кто далеко
  rationale: Прилагательное употреблено как существительное и обозначает находящихся вдали людей; формулировка не уточняет, имеются ли в виду изгнанники, другие отдалённые народы или более широкий круг.
- source_word: יָבֹאוּ וּבָנוּ
  choice: придут и будут строить
  rationale: Передаёт последовательность будущих действий, выраженную имперфектом и продолжающим его перфектом с союзом.
- source_word: בְּהֵיכַל יְהוָה
  choice: строить храм Яхве
  rationale: В сочетании с глаголом «строить» русский винительный без предлога естественно передаёт участие в возведении храма; буквальное «в храме» могло бы ошибочно означать работу только внутри здания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: וִידַעְתֶּם
  choice: тогда вы узнаете
  rationale: «Тогда» естественно выражает результирующую связь с предшествующим событием, не меняя содержания глагола.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя и передаёт צְבָאוֹת прозрачным для современного читателя словом, не ограничивая его исключительно земными войсками.
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: послал меня к вам
  rationale: Перфект обозначает завершённое послание, сохраняющее значение в настоящем контексте.
- source_word: וְהָיָה
  choice: это исполнится
  rationale: В пророческом контексте естественно отсылает к обещанному событию; формулировка сохраняет связь последующего условия с предшествующим обещанием.
- source_word: אִם שָׁמוֹעַ תִּשְׁמְעוּן
  choice: если вы будете неуклонно слушаться
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол; «слушаться» передаёт ответное повиновение, а «неуклонно» — усиление.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  choice: голоса Яхве, вашего Бога
  rationale: Сохраняет образ голоса и естественно передаёт заветную формулу; запятая ясно показывает приложение.
theological_decisions:
- issue: Кого обозначают «те, кто далеко»
  choice: Оставлено общее обозначение без уточнения группы.
  alternative: Возвращающиеся иудейские изгнанники; язычники; рассеянные израильтяне.
  rationale: Еврейский текст не называет группу, поэтому перевод сохраняет пророческую открытость выражения.
- issue: Связь условия с исполнением обещания
  choice: Заключительное условие связано с исполнением предшествующего обещания без дальнейшего догматического уточнения.
  alternative: Условие относится только к признанию посланника либо представляет собой отдельное увещание.
  rationale: Синтаксис естественно допускает условное исполнение сказанного, но не определяет с полной ясностью точный объём условия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; сохранены условность финальной фразы и неопределённость круга «далёких».
