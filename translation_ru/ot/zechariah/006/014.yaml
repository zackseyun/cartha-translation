  source_fidelity: В основном точно переданы множественное число «венцы», имена масоретского текста, личное имя Яхве и мемориальная функция в храме. Однако «и останутся» вносит невыраженное в еврейском тексте значение продолжения/хранения и перестраивает две конструкции с לְ в самостоятельное сказуемое.
  naturalness: «Будут принадлежать ... и останутся памятным знаком» звучит по-русски понятно, но избыточно истолковывает текст. Формула «будут для ... на память в храме» лаконична, литературна и ближе к синтаксису оригинала.
  terminology: «Венцы», «Хелем», «Товия», «Иедая», «Хен», «Софония» и «Яхве» приемлемы. Сноска верно сохраняет связь с формой «Хелдай» в 6:10, не гармонизируя основной текст.
