base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/014.yaml
  text: And the crowns shall be for Helem[a], Tobijah, Jedaiah, and Hen son of Zephaniah, as a memorial in the temple of Yahweh.
translation:
  language: ru
  text: А венцы будут для Хелема[a], Товии, Иедаи и Хена, сына Софонии, на память в храме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Захарии 6:10 Хелем назван Хелдаем; возможно, это разные формы одного имени.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲטָרֹת
  choice: венцы
  rationale: Существительное во множественном числе передано множественным числом, без сведения к одному венцу.
- source_word: תִּהְיֶה לְ
  choice: будут принадлежать
  rationale: Сочетание глагола «быть» с לְ перед именами естественно передаёт предназначение или принадлежность; в русском множественное подлежащее требует формы «будут».
- source_word: לְחֵלֶם
  choice: Хелему
  rationale: Сохранена огласованная форма имени в данном стихе; отличие от формы в Захарии 6:10 отмечено в сноске.
- source_word: וּלְטוֹבִיָּה וְלִידַעְיָה
  choice: Товии, Иедаии
  rationale: Личные имена транслитерированы и поставлены в дательный падеж в соответствии с конструкцией לְ.
- source_word: וּלְחֵן בֶּן צְפַנְיָה
  choice: Хену, сыну Софонии
  rationale: חֵן понят как личное имя, поскольку за ним следует указание на отца; имена переданы в принятой русской библейской форме.
- source_word: לְזִכָּרוֹן
  choice: останутся памятным знаком
  rationale: Переданы цель и длительная памятная функция венцов; добавление «останутся» естественно выражает подразумеваемое хранение в храме, не меняя смысла.
- source_word: בְּהֵיכַל
  choice: в храме
  rationale: В сочетании с именем Яхве הֵיכָל обозначает храм, а не царский дворец.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
theological_decisions:
- issue: Различие личных имён между Захарией 6:10 и 6:14
  choice: 'Сохранить чтение масоретского текста данного стиха: «Хелем» и «Хен».'
  alternative: Согласовать «Хелем» с «Хелдаем» из 6:10 либо истолковать חֵן как нарицательное «милость».
  rationale: Текст стиха не гармонизирован с соседним стихом; возможная вариантность имени открыто отмечена, а חֵן в конструкции «сын Софонии» естественно читается как имя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «А» передаёт начальное וְ. Формулировка избегает архаического «для памятования», сохраняя культово-мемориальный смысл.
