  text: וְ/אָמַרְתָּ֤ אֵלָי/ו֙ לֵ/אמֹ֔ר כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הִנֵּה אִ֞ישׁ צֶ֤מַח שְׁמ/וֹ֙ וּ/מִ/תַּחְתָּ֣י/ו יִצְמָ֔ח וּ/בָנָ֖ה אֶת הֵיכַ֥ל יְהוָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
translation:
  language: ru
  text: 'И скажи ему: «Так говорит Яхве Воинств: вот человек, имя которому — Росток. Он вырастет на своём месте[a] и построит храм Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-под него произрастёт».'
    reason: Сноска сохраняет буквальную форму неоднозначного выражения וּמִתַּחְתָּיו יִצְמָח, тогда как основной текст передаёт его вероятный контекстуальный смысл естественным русским языком.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет образ многочисленных небесных и земных сил, находящихся под властью Яхве, и соответствует достоинству пророческой формулы.
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно передаёт указательную и торжественно-презентативную силу еврейского междометия.
- source_word: אִישׁ
  choice: муж
  rationale: Обозначает конкретного мужчину; литературное «муж» уместно в торжественном пророческом провозглашении.
- source_word: צֶמַח
  choice: Росток
  rationale: Сохраняет растительный образ и функцию имени-прозвания; заглавная буква указывает на титульное употребление, не добавляя прямо мессианского толкования.
- source_word: שְׁמוֹ
  choice: имя которому
  rationale: Естественная русская передача формулы именования при сохранении её аппозиционного смысла.
- source_word: וּמִתַּחְתָּיו
  choice: на своём месте
  rationale: Передаёт вероятный контекстуальный смысл сжатого выражения естественным русским языком; буквальный пространственный образ сохранён в сноске.
- source_word: יִצְמָח
  choice: вырастет
  rationale: Сохраняет ботанический образ и словесную связь с именем «Росток», не прибегая к неестественному русскому словообразованию.
- source_word: וּבָנָה
  choice: и построит
  rationale: Будущее значение ясно из пророческого контекста; подлежащее сохраняется тем же, что и у предыдущего глагола.
- source_word: הֵיכַל
  choice: храм
  rationale: В сочетании с именем Яхве слово обозначает храм и не требует более широкого варианта «дворец».
theological_decisions:
- issue: Мессианское звучание צֶמַח
  choice: Передать как титульное имя «Росток», не называя фигуру прямо Мессией.
  alternative: Передать как нарицательное «росток», «побег» либо добавить пояснение «Мессия».
  rationale: Формула «имя которому — Росток» поддерживает употребление в качестве имени-прозвания. При этом сам стих не содержит слова «Мессия», поэтому перевод сохраняет подразумеваемое пророческое звучание без догматического расширения.
- issue: Кого обозначает строитель храма
  choice: Сохранить указание на названного в стихе мужа, не отождествляя его в переводе ни с Иисусом, сыном Иоседека, ни с будущим Мессией.
  alternative: Прямо назвать фигуру Иисусом, сыном Иоседека, или Мессией.
  rationale: Еврейский текст оставляет символический референт неуточнённым; перевод не должен разрешать эту богословско-экзегетическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Порядок фраз упрощён лишь настолько, насколько требуется для ясности; имя «Росток» и образ роста сохранены. Сноска отмечена в основном тексте как [a].
