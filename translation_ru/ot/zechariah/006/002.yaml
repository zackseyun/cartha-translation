  text: In the first chariot were red horses, and in the second chariot black horses.
translation:
  language: ru
  text: В первой колеснице были красные кони, а во второй колеснице — чёрные.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמֶּרְכָּבָה
  choice: в колеснице
  rationale: מֶרְכָּבָה обозначает колесницу; предлог ב в контексте видения естественно передаётся русским «в», указывая, какие кони были при каждой колеснице.
- source_word: הָרִאשֹׁנָה
  choice: первой
  rationale: Порядковое прилагательное обозначает первую колесницу в последовательности.
- source_word: סוּסִים
  choice: кони
  rationale: Обычное множественное число существительного «конь»; «кони» соответствует возвышенному, но понятному регистру пророческого видения.
- source_word: אֲדֻמִּים
  choice: красные
  rationale: Прямое обозначение красного цвета, сохраняющее зрительный образ и контраст.
- source_word: וּבַמֶּרְכָּבָה
  choice: а во второй колеснице
  rationale: Союз ו здесь связывает параллельные элементы перечисления; русское «а» естественно подчёркивает смену колесницы и цвета без смыслового противопоставления.
- source_word: הַשֵּׁנִית
  choice: второй
  rationale: Порядковое прилагательное прямо обозначает следующую колесницу.
- source_word: שְׁחֹרִים
  choice: чёрные
  rationale: Основное значение цветового прилагательного — «чёрный»; оно сохраняет ясный контраст с красными конями.
theological_decisions: []
