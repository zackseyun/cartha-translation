base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
translation:
  language: ru
  text: 'Тогда ангел ответил мне: «Это четыре небесных ветра[a], которые выходят от Владыки всей земли, перед которым они стояли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четыре небесных духа». Еврейское слово может означать и «ветры», и «духи».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן הַמַּלְאָךְ וַיֹּאמֶר אֵלָי
  choice: Тогда ангел ответил мне
  rationale: Естественно передаёт древнееврейскую повествовательную формулу «ответил и сказал мне», не воспроизводя в русском избыточную парность глаголов.
- source_word: אַרְבַּע רֻחוֹת הַשָּׁמַיִם
  choice: четыре ветра небесные
  rationale: רוּחוֹת допускает значения «ветры» и «духи». В образе четырёх колесниц основным выбрано «ветры», а подлинная смысловая неоднозначность сохранена в сноске.
- source_word: יוֹצְאוֹת
  choice: выходящие
  rationale: Причастная форма передаёт разворачивающееся движение и согласуется с существительным «ветра» во множественном числе.
- source_word: מֵהִתְיַצֵּב עַל
  choice: оттуда, где они стояли перед
  rationale: Передаёт исходное значение מִן «от, из» и служебное стояние перед владыкой; такая формулировка естественнее буквального русского «выходящие от стояния» и не навязывает завершённость действия.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Владыкой всей земли
  rationale: «Владыка» ясно выражает верховную власть Бога, а «всей земли» сохраняет универсальный масштаб видения.
theological_decisions:
- issue: Значение רֻחוֹת в видении
  choice: ветра
  alternative: духи
  rationale: В контексте четырёх колесниц «ветры» сохраняют космический и направленный образ, однако еврейское слово может обозначать также духов; альтернативное понимание поэтому указано в сноске.
- issue: Отношение колесниц к небесным ветрам/духам
  choice: не добавлять поясняющего отождествления сверх формулы «это»
  alternative: перевести описательно как небесные силы или посланники
  rationale: Текст прямо отождествляет увиденное с четырьмя רֻחוֹת, но не объясняет природу этого отождествления; перевод сохраняет напряжение образа.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Формула «ответил и сказал» естественно сокращена до «ответил». Неоднозначность רוּחוֹת вынесена в обязательную сноску; её маркер помещён непосредственно после соответствующего выражения.
