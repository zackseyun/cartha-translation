  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/009.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И пришло ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: Указание формы оригинала и традиционного варианта передачи Божьего имени.
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Последовательная форма глагола היה вводит очередное событие повествования. В сочетании с דְבַר естественный русский пророческий оборот «пришло слово» передаёт ход повествования без архаичного буквализма «и было».
- source_word: דְבַר
  choice: слово
  rationale: В устойчивой пророческой формуле דְבַר יְהוָה слово «слово» точно передаёт исходный образ и сохраняет межтекстовые связи; более свободное «весть» здесь не требуется.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с суффиксом первого лица обозначает направленность речи к пророку; «ко мне» — прямой и естественный русский эквивалент.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание последующей прямой речи. В современном русском эту функцию естественно и полно выполняет двоеточие; буквальное «говоря» после выражения «пришло слово» звучало бы тяжеловесно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя YHWH. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой формулы. Двоеточие вводит содержание речи, начинающееся в следующем стихе.
