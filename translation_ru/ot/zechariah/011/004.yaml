  text: 'Thus says Yahweh my God: Shepherd the flock for slaughter[a].'
translation:
  language: ru
  text: 'Так говорит Яхве, мой Бог: «Паси стадо, предназначенное на заклание[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стадо заклания»; то есть стадо, предназначенное для того, чтобы быть закланным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая русская формула пророческой речи; настоящее время естественно передаёт авторитетное провозглашение, несмотря на перфект אָמַר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהָי
  choice: мой Бог
  rationale: Сохраняет суффикс первого лица единственного числа и отношение говорящего к Богу.
- source_word: רְעֵה
  choice: Паси
  rationale: Императив мужского рода единственного числа от רעה. Русское «паси» естественно и сохраняет пастушеский образ, центральный для контекста главы.
- source_word: צֹאן
  choice: стадо
  rationale: Коллективное существительное обозначает мелкий скот как единое стадо; в сочетании с «паси» это естественный русский эквивалент.
- source_word: הַהֲרֵגָה
  choice: предназначенное на заклание
  rationale: Передаёт конструкцию «стадо заклания» как стадо, которому предстоит быть закланным; «заклание» сохраняет высокий, но понятный библейский регистр.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Отношение говорящего в אֱלֹהָי
  choice: мой Бог
  alternative: Бог; Господь Бог
  rationale: Суффикс первого лица единственного числа выражен явно, поэтому его необходимо сохранить.
- issue: Смысл сочетания צֹאן הַהֲרֵגָה
  choice: стадо, предназначенное на заклание
  alternative: стадо заклания; стадо для заклания
  rationale: Еврейское сочетание с существительным «заклание» допускает более буквальную сжатую передачу, но по смыслу обозначает стадо, которому уготовано заклание. Формулировка не уточняет, кто именно определил эту участь.
translation_notes:
  register: Современный литературный русский с достоинством пророческой формулы. «Паси» поддерживает сквозной образ пастыря; «заклание» несколько возвышенно, но точно и общеупотребительно в библейском контексте.
