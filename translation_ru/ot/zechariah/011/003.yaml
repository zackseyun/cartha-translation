base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
translation:
  language: ru
  text: Слышен плач пастухов, потому что разорено их великолепие[a]; слышен рёв молодых львов, потому что разорено величие Иордана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «великолепие», может также обозначать роскошное одеяние и, возможно, намекает на то, что украшало пастухов.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гордость Иордана». Выражение может относиться к пышным зарослям по берегам Иордана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  choice: слышен
  rationale: Существительное обозначает голос или звук. В поэтической конструкции естественное русское «слышен» сохраняет слуховой образ и вводит оба параллельных возгласа.
- source_word: יִלְלַ֣ת
  choice: плач
  rationale: Форма от ילל обозначает громкий скорбный вопль или вой; применительно к пастухам «плач» естественно передаёт человеческое горе.
- source_word: הָרֹעִ֔ים
  choice: пастухов
  rationale: Сохранён прямой образ пастухов без истолковывающей замены на «вождей» или «правителей».
- source_word: כִּ֥י
  choice: потому что
  rationale: Союз вводит причину плача и рёва; современная русская формулировка ясно передаёт причинную связь.
- source_word: שֻׁדְּדָ֖ה / שֻׁדַּ֖ד
  choice: разорено
  rationale: Глагол שׁדד означает разорять, опустошать или разграблять. Одинаковый перевод в обоих полустишиях сохраняет параллелизм.
- source_word: אַדַּרְתָּ֑ם
  choice: их великолепие
  rationale: אדרת может обозначать великолепие, а также роскошное одеяние. «Великолепие» сохраняет основной поэтический смысл и не устраняет возможный конкретный оттенок.
- source_word: שַׁאֲגַ֣ת
  choice: рёв
  rationale: Слово обозначает характерный рёв льва и образует выразительную параллель с плачем пастухов.
- source_word: כְּפִירִ֔ים
  choice: молодых львов
  rationale: כפיר — молодой, уже сильный лев; этот обычный русский эквивалент точнее, чем «львята».
- source_word: גְּא֥וֹן
  choice: величие
  rationale: גאון может означать величие, возвышенность или гордость. «Величие» сохраняет возвышенный образ и не навязывает отрицательной нравственной оценки.
- source_word: הַיַּרְדֵּֽן
  choice: Иордана
  rationale: Передано традиционное русское название реки; добавление слова «река» в поэтическом контексте не требуется.
theological_decisions:
- issue: Следует ли раскрывать пастухов и молодых львов как символы вождей, правителей или угнетателей
  choice: Сохранить буквальные поэтические образы без истолковывающей конкретизации.
  alternative: Передать «пастухов» как «вождей», а «молодых львов» как «правителей» или «угнетателей».
  rationale: Сам стих не называет символические соответствия прямо; их раскрытие в основном тексте устранило бы намеренную образность и неоднозначность.
- issue: Значение выражения גְּאוֹן הַיַּרְדֵּן
  choice: «величие Иордана»
  alternative: «гордость Иордана» или «заросли по берегам Иордана»
  rationale: Основное значение גאון — величие, возвышенность или гордость; в данном сочетании выражение может конкретно указывать на пышные прибрежные заросли. Основной текст сохраняет образ исходного выражения, а конкретное толкование отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Повтор «слышен» и одинаковый перевод глагола שׁדד сохраняют параллелизм двух полустиший. Маркеры сносок поставлены после соответствующих образов.
