  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י הַשְׁלִיכֵ֨/הוּ֙ אֶל הַ/יּוֹצֵ֔ר אֶ֣דֶר הַ/יְקָ֔ר אֲשֶׁ֥ר יָקַ֖רְתִּי מֵֽ/עֲלֵי/הֶ֑ם וָֽ/אֶקְחָ/ה֙ שְׁלֹשִׁ֣ים הַ/כֶּ֔סֶף וָ/אַשְׁלִ֥יךְ אֹת֛/וֹ בֵּ֥ית יְהוָ֖ה אֶל הַ/יּוֹצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
translation:
  language: ru
  text: 'Тогда Яхве сказал мне: «Брось это горшечнику[a] — вот великолепная цена[b], в которую они Меня оценили!» Я взял тридцать серебряников и бросил их в дом Яхве — горшечнику.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «горшечнику». Из-за трудного контекста некоторые предлагают читать здесь «в сокровищницу», однако в масоретском тексте в обоих случаях стоит слово «горшечник».'
    reason: alternative_reading
  - marker: b
    text: 'Выражение «великолепная цена», вероятно, иронично: оно высмеивает унизительно низкую оценку — тридцать серебряников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога как имя собственное, а не заменяет его титулом «Господь».
- source_word: הַשְׁלִיכֵהוּ
  choice: Брось это
  rationale: Императив означает резкое действие; местоимение мужского рода в еврейском относится к ранее названной плате, а нейтральное «это» естественно передаёт эту отсылку по-русски.
- source_word: הַיּוֹצֵר
  choice: горшечнику
  rationale: Обычное значение субстантивированного причастия от יצר — «горшечник». Трудность контекста не даёт достаточных оснований заменять масоретское чтение conjectural «сокровищницей».
- source_word: אֶדֶר הַיְקָר
  choice: великолепная цена
  rationale: 'Сохраняет возвышенную лексику сочетания и его вероятную иронию: тридцать серебряников представлены как якобы великолепная оценка.'
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  choice: в которую они Меня оценили
  rationale: Естественно передаёт смысл оценки говорящего этими людьми, не устраняя иронического напряжения фразы.
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  choice: тридцать серебряников
  rationale: Понятное устойчивое обозначение отдельных денежных единиц из серебра; не уточняет «сикли», поскольку единица в еврейском тексте прямо не названа.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Формально сохраняет еврейское «дом», не подменяя его более толковательным «храм».
- source_word: אֶל הַיּוֹצֵר
  choice: горшечнику
  rationale: Сохраняет повтор слова «горшечник» в заключительной фразе масоретского текста.
theological_decisions:
- issue: Трудное чтение «горшечнику» и ироническое обозначение цены
  choice: Сохранить масоретское «горшечнику» в обоих местах и передать אֶדֶר הַיְקָר как «великолепная цена».
  alternative: Исправить «горшечнику» на «в сокровищницу» либо нейтрализовать выражение как «цена».
  rationale: Такой перевод следует засвидетельствованному еврейскому тексту, не исправляет его ради более гладкого контекста и сохраняет насмешливо-горькую силу оценки в тридцать серебряников.
- issue: Лицо говорящего в словах «Меня оценили»
  choice: Сохранить первое лицо и прописную букву «Меня» как указание на Яхве, непосредственно произносящего эти слова.
  alternative: Передать строчной буквой или перестроить фразу без явного местоимения.
  rationale: В контексте грамматическим говорящим остаётся Яхве; прописная буква является русской издательской нормой почтительного местоименного обозначения Бога, а не отдельным догматическим толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет резкость повеления и иронию прямой речи; трудность заключительного «в доме Яхве горшечнику» намеренно не сглажена добавлением отсутствующих в источнике обстоятельств.
