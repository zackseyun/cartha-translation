base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/012.yaml
  text: 'Then I said to them[a], “If it is good in your eyes, give me my wages; but if not, refrain.” So they weighed out my wages: thirty pieces of silver.'
translation:
  language: ru
  text: 'Тогда я сказал им: «Если вам угодно, дайте мне мою плату, а если нет — воздержитесь». И они отвесили мне мою плату: тридцать серебряных[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать серебра»; возможно, имеются в виду тридцать сиклей серебра.'
    reason: 'Лексическая альтернатива: единица веса или денежного расчёта в еврейском тексте прямо не указана.'
lexical_decisions:
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: Тогда я сказал им
  rationale: Последовательная форма с וַ־ продолжает повествование; «тогда» естественно передаёт переход к следующему действию, а местоименное дополнение сохраняет прямых адресатов.
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  choice: Если вам угодно
  rationale: Это естественный современный русский эквивалент еврейской идиомы «если хорошо в ваших глазах»; он сохраняет условность и не делает просьбу требованием.
- source_word: הָבוּ שְׂכָרִי
  choice: дайте мне мою плату
  rationale: «Дайте» прямо передаёт императив הָבוּ, а «плата» обозначает вознаграждение за исполненное служение и подходит к контексту пастуха.
- source_word: וְאִם לֹא חֲדָלוּ
  choice: а если нет — воздержитесь
  rationale: Глагол חדל означает прекратить действие или воздержаться от него. Формулировка сохраняет лаконичность оригинала, где подразумевается отказ от выплаты.
- source_word: וַיִּשְׁקְלוּ
  choice: И они отвесили
  rationale: שקל обозначает взвешивание серебра при расчёте; «отвесили» сохраняет конкретный древний способ выплаты.
- source_word: שְׁלֹשִׁים כָּסֶף
  choice: тридцать серебряных монет
  rationale: В еврейском тексте буквально стоит «тридцать серебра» без явно названной единицы. В основном тексте выбрано понятное обозначение серебряных платёжных единиц, а возможное уточнение «сиклей» вынесено в примечание.
theological_decisions:
- issue: Денежная единица в выражении שְׁלֹשִׁים כָּסֶף
  choice: тридцать серебряных монет
  alternative: тридцать сиклей серебра
  rationale: Текст не называет сикль прямо, поэтому основной перевод не должен без необходимости уточнять единицу веса. Это также позволяет сохранить связь с последующим библейским употреблением, не подчиняя перевод формулировке Нового Завета.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Сохранены лаконичность прямой речи и образ взвешивания серебра; буквальная идиома «хорошо в ваших глазах» передана естественным русским выражением.
