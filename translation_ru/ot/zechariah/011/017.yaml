  source_fidelity: 'Смысл передан точно: הוֹי — «Горе», הָאֱלִיל — «негодному», характеристика пастуха как оставляющего стадо, а также усиленные формы «совершенно иссохнет / совершенно померкнет» сохранены. Однако «Меч — на его руку и на его правый глаз» в современном русском может читаться как пространственное расположение меча и неясно выражает направленность угрозы, которую передаёт עַל в данном оракуле.'
