  text: ה֣וֹי רֹעִ֤י הָֽ/אֱלִיל֙ עֹזְבִ֣י הַ/צֹּ֔אן חֶ֥רֶב עַל זְרוֹע֖/וֹ וְ/עַל עֵ֣ין יְמִינ֑/וֹ זְרֹע/וֹ֙ יָב֣וֹשׁ תִּיבָ֔שׁ וְ/עֵ֥ין יְמִינ֖/וֹ כָּהֹ֥ה תִכְהֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
translation:
  language: ru
  text: Горе негодному пастуху[a], бросающему стадо! Меч — против его руки и против его правого глаза! Рука его совершенно иссохнет, и правый глаз его совершенно померкнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идольскому пастуху»; еврейское слово может означать нечто ничтожное, пустое или подобное идолу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт пророческое обличение и возвещение суда, сохраняя также оттенок плача.
- source_word: רֹעִי הָאֱלִיל
  choice: негодному пастуху
  rationale: Слово אֱלִיל может указывать на ничтожность, пустоту или идольский характер. В контексте неверного руководителя «негодный» естественно передаёт его нравственную и функциональную несостоятельность; буквальная альтернатива отмечена в сноске.
- source_word: עֹזְבִי הַצֹּאן
  choice: бросающему стадо
  rationale: Причастная форма характеризует пастуха постоянным или определяющим поступком — оставлением вверенного ему стада.
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  choice: Меч — на его руку и на его правый глаз
  rationale: Безглагольная конструкция сохранена как краткое пророческое возвещение суда без добавления явно пожелательного «пусть поразит».
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  choice: Рука его совсем отсохнет
  rationale: Инфинитив абсолютный с личной формой усиливает действие; «совсем отсохнет» передаёт полноту и несомненность поражения.
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  choice: правый глаз его совершенно померкнет
  rationale: Усилительная конструкция передана наречием «совершенно». Глагол означает утрату ясности или света, поэтому «померкнет» не усиливает смысл до недвусмысленной полной слепоты.
theological_decisions:
- issue: Передача אֱלִיל в метафоре пастыря-руководителя
  choice: негодный пастух
  alternative: идольский пастух; пустой пастух
  rationale: Непосредственный контекст обличает пастуха за оставление стада, поэтому «негодный» ясно выражает его несостоятельность. Возможный оттенок идольской пустоты сохранён в сноске, чтобы не устранять лексическую неоднозначность.
- issue: Характер формулы חֶרֶב עַל
  choice: 'пророческое возвещение: «Меч — на…»'
  alternative: 'пожелательное проклятие: «Пусть меч поразит…»'
  rationale: В еврейском тексте нет выраженного глагола. Именная формула позволяет сохранить напряжение между объявлением и имплицитным призывом к суду, не разрешая его искусственно.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Инверсия «рука его / глаз его» поддерживает библейское достоинство, оставаясь понятной современному читателю.
