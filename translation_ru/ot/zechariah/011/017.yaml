  terminology: «Негодному пастуху» адекватно передаёт оценочное значение אֱלִיל, не навязывая специфического истолкования. Альтернатива «идольскому пастуху» сохранена в сноске как отражение возможного идольского/пустого оттенка. «Пастух» и «стадо» соответствуют образному ряду оригинала.
