  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י ע֣וֹד קַח לְ/ךָ֔ כְּלִ֖י רֹעֶ֥ה אֱוִלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Снова возьми себе снаряжение[a] глупого пастуха».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принадлежности» или «орудия». Еврейское слово имеет широкое значение и обозначает предметы или снаряжение, связанные с пастухом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; обычное русское «И сказал» естественно передаёт связь с предыдущим действием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֵלָי
  choice: мне
  rationale: Естественная русская передача предлога с суффиксом первого лица в сочетании с глаголом речи.
- source_word: עוֹד
  choice: снова
  rationale: В данном повелении слово указывает на повторное или ещё одно символическое действие.
- source_word: קַח לְךָ
  choice: возьми себе
  rationale: «Возьми» передаёт императив, а «себе» сохраняет личную вовлечённость, выраженную לְךָ.
- source_word: כְּלִי
  choice: снаряжение
  rationale: Широкое существительное обозначает предмет, орудие или принадлежности; в контексте пастуха собирательное «снаряжение» звучит естественно и не уточняет предметы сверх текста.
- source_word: רֹעֶה
  choice: пастуха
  rationale: Стандартное контекстуальное соответствие; родительный падеж выражает принадлежность или характерную связь с названным снаряжением.
- source_word: אֱוִלִי
  choice: глупого
  rationale: Прилагательное обозначает глупость и нравственное безрассудство. «Глупого» передаёт прямой смысл, не усиливая его до «никчёмного».
theological_decisions:
- issue: Символическая личность пастуха
  choice: Оставить описательное обозначение «глупый пастух» без уточнения личности.
  alternative: Истолковать его как конкретного исторического правителя, совокупный образ порочных вождей Израиля или эсхатологическую фигуру.
  rationale: Сам стих не отождествляет этого пастуха с определённым лицом или группой; нейтральная передача сохраняет неоднозначность и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Порядок слов слегка сглажен для естественной русской речи; символический и неоднозначный характер образа сохранён.
