lexical_decisions:
- source_word: וָאַכְחִד
  choice: я устранил
  rationale: Каузативная форма глагола כחד может означать «заставить исчезнуть», «устранить» или «истребить». «Устранил» передаёт решительность действия, но не уточняет без достаточных оснований, были ли пастухи убиты, смещены или удалены иным образом.
- source_word: שְׁלֹשֶׁת הָרֹעִים
  choice: трёх пастухов
  rationale: Сохраняется прямое значение и центральная для главы метафора; отождествление пастухов с конкретными лицами или группами не вносится в текст.
- source_word: בְּיֶרַח אֶחָד
  choice: за один месяц
  rationale: Предлог בְּ здесь естественно передаёт срок, в пределах которого действие было совершено. Русское «за один месяц» ясно выражает временную сжатость.
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם
  choice: Душа моя потеряла терпение с ними
  rationale: Идиома קצר נפש выражает истощение терпения, тягость или отвращение. Слово «душа» сохранено ради еврейского образа и параллели со следующей частью стиха.
- source_word: וְגַם נַפְשָׁם בָּחֲלָה בִי
  choice: и их душа также возненавидела меня
  rationale: Глагол בחל обозначает сильное неприятие, отвращение или омерзение. «Возненавидела» естественно и сильно звучит по-русски; единственное число «душа» сохраняет форму оригинала и взаимную параллель.
theological_decisions:
- issue: Кто такие «три пастуха»
  choice: Сохранить выражение «три пастуха» без отождествления.
  alternative: Понимать их как трёх исторических правителей, три разряда руководителей либо символическое обозначение порочного руководства.
  rationale: Сам еврейский текст не называет этих пастухов. Более точное отождествление разрешило бы заложенную в тексте неоднозначность на основании внешней интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор слова «душа» намеренно сохраняет антропологический образ и взаимность двух частей фразы; необычное единственное число «их душа» отражает форму оригинала.
