  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
translation:
  language: ru
  text: 'И я сказал: «Не буду пасти вас. Та, что умирает, пусть умрёт; та, что гибнет, пусть погибнет; а оставшиеся[a] пусть пожирают плоть друг друга[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уцелевшие»; буквально: «оставшиеся».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждая [пожирает] плоть своей ближней». Это распределительный оборот в женском роде, согласованный с образом стада: каждая пожирает плоть другой.'
    reason: cultural_note
lexical_decisions:
- source_word: אֶרְעֶה
  choice: пасти
  rationale: Глагол רעה обозначает действие пастуха. Русское «пасти» естественно сохраняет сквозной образ пастуха и стада, не сужая его до одного лишь кормления.
- source_word: הַמֵּתָה תָמוּת
  choice: Та, что умирает, пусть умрёт
  rationale: Сочетание причастия и личной формы того же корня передано повтором, сохраняющим краткость, усиление и оттенок отказа вмешиваться.
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  choice: та, что гибнет, пусть погибнет
  rationale: Niphal от כחד выражает уничтожение или гибель. «Гибнет — пусть погибнет» сохраняет корневой повтор и не вводит более узкого понятия полного истребления.
- source_word: הַנִּשְׁאָרוֹת
  choice: оставшиеся
  rationale: Причастная форма от שׁאר буквально обозначает тех, кто остался. «Оставшиеся» прозрачно передаёт значение, не добавляя оттенка благополучного спасения, возможного у слова «уцелевшие».
- source_word: תֹּאכַלְנָה
  choice: пусть пожирают
  rationale: Основное значение — «есть», но сочетание с «плотью» описывает крайнюю жестокость. «Пожирать» естественно передаёт силу образа.
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  choice: плоть друг друга
  rationale: 'Буквально конструкция имеет женский род: «каждая — плоть своей ближней/другой». Здесь это распределительный оборот, согласованный с образом овец; русское «друг друга» ясно передаёт взаимное насилие и не создаёт ложного впечатления, будто речь обязательно идёт о женщинах.'
theological_decisions:
- issue: Сохранение образа пастуха в словах отказа
  choice: Не буду пасти вас
  alternative: Не буду кормить вас
  rationale: Вся пророческая инсценировка главы строится на образе пастуха. «Пасти» сохраняет этот образ, тогда как «кормить» неоправданно сужает смысл.
- issue: Степень буквальности заключительного образа взаимного пожирания
  choice: пусть пожирают плоть друг друга
  alternative: пусть уничтожают друг друга
  rationale: Еврейский текст намеренно использует резкий образ поедания плоти. Перевод сохраняет его и не смягчает до общего обозначения взаимного уничтожения.
- issue: Передача повторных конструкций о смерти и гибели
  choice: Та, что умирает, пусть умрёт; та, что гибнет, пусть погибнет
  alternative: Обречённые пусть погибнут
  rationale: Раздельные параллельные формулы сохраняют судебную суровость и напряжение исходного текста, не объединяя два выражения в одно толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, суровым пророческим ритмом. Формы «та, что умирает» и «та, что гибнет» сохраняют женский род образа овец, не добавляя слова «овца» в основной текст. Пунктуация подчёркивает параллелизм трёх последствий.
