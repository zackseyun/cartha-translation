base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: ru
  text: 'И я пас стадо, обречённое на заклание, — бедных в этом стаде.[a] Я взял себе два посоха: один назвал «Благоволение», а другой — «Узы»; и пас стадо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза допускает и другое понимание: «поэтому — бедных (или угнетённых) в стаде».'
    reason: Сохраняет синтаксическую и лексическую неоднозначность לָכֵן עֲנִיֵּי הַצֹּאן, не вводя в основной текст превосходную степень, которой нет в оригинале.
lexical_decisions:
- source_word: צֹאן הַהֲרֵגָה
  choice: стадо, обречённое на заклание
  rationale: Передаёт образ стада, предназначенного для умерщвления, сохраняя жертвенно-убойную окраску существительного הֲרֵגָה.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: беднейших овец стада
  rationale: עָנִי может обозначать бедного, угнетённого или несчастного; форма в сопряжённом сочетании естественно передана как выделение наиболее обездоленной части стада.
- source_word: מַקְלוֹת
  choice: посоха
  rationale: В контексте пастуха речь идёт о пастушеских посохах, а не просто о палках.
- source_word: נֹעַם
  choice: Благоволение
  rationale: Слово выражает приятность, благосклонность и милость; «Благоволение» подходит как символическое имя посоха и согласуется с контекстом заветной защиты в следующем отрывке.
- source_word: חֹבְלִים
  choice: Узы
  rationale: Множественная форма связана с корнем, обозначающим связывание и верёвки; «Узы» сохраняет конкретный образ связи и подготавливает символическое объяснение единства в ст. 14.
theological_decisions:
- issue: Связь выражения לָכֵן עֲנִיֵּי הַצֹּאן с предшествующей фразой
  choice: именно беднейших овец стада
  alternative: поэтому — бедных овец стада / ради беднейших овец стада
  rationale: Синтаксис необычен, а לָכֵן обычно означает «поэтому». В данном контексте выражение широко понимается как уточнение того, какую часть обречённого стада пасёт пророк. Перевод следует этому пониманию, но сноска сохраняет реальную неоднозначность еврейского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Намеренный повтор глагола «пасти» сохранён; символические имена посохов выделены кавычками и переданы существительными с прописной буквы.
