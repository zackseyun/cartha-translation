  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
translation:
  language: ru
  text: И я рассёк мой второй посох — «Узы»[a], чтобы разрушить братство между Иудой и Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Связи» либо «Связывающие». Еврейское название вызывает образ того, что связывает вместе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶגְדַּע
  choice: И я рассёк
  rationale: Глагол גדע означает отсекать или срубать. «Рассёк» сохраняет образ намеренного физического повреждения посоха и звучит естественно в данном символическом действии.
- source_word: מַקְלִי הַשֵּׁנִי
  choice: мой второй посох
  rationale: מַקֵּל — «посох, жезл», а הַשֵּׁנִי прямо указывает на второй из двух посохов.
- source_word: הַחֹבְלִים
  choice: «Узы»
  rationale: Название посоха связано с корнем, обозначающим связывание, и в контексте символизирует связь между Иудой и Израилем. «Узы» сохраняют предметно-реляционный образ лучше, чем отвлечённое «Единство».
- source_word: לְהָפֵר
  choice: чтобы разрушить
  rationale: הפר может означать нарушить, отменить или разрушить установленную связь. С существительным «братство» глагол «разрушить» естественно передаёт прекращение отношений.
- source_word: הָאַחֲוָה
  choice: братство
  rationale: אַחֲוָה обозначает братство, братские отношения или родственную сплочённость; перевод сохраняет семейно-политическую метафору исходного текста.
- source_word: בֵּין יְהוּדָה וּבֵין יִשְׂרָאֵל
  choice: между Иудой и Израилем
  rationale: Прямо сохраняется историко-политическое различение двух названных сторон без поясняющего расширения.
theological_decisions:
- issue: Передача символического имени הַחֹבְלִים
  choice: «Узы»
  alternative: «Связи»; «Связывающие»; «Единство»
  rationale: Контекст связывает имя посоха с отношениями между Иудой и Израилем. «Узы» сохраняют многозначный образ того, что связывает, не сводя его только к абстрактному единству.
- issue: Передача אַחֲוָה
  choice: братство
  alternative: единство; содружество; родство
  rationale: Еврейское слово выражает именно братскую, семейную связь. «Братство» сохраняет эту метафору и присущую тексту богословско-политическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Название символического посоха выделено кавычками; синтаксис остаётся ясным и близким к еврейскому оригиналу.
