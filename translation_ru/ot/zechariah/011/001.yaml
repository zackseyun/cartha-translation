source:
  edition: WLC
  text: פְּתַ֥ח לְבָנ֖וֹן דְּלָתֶ֑י/ךָ וְ/תֹאכַ֥ל אֵ֖שׁ בַּ/אֲרָזֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/001.yaml
  text: Open your doors[a], Lebanon, so that fire may consume your cedars.
translation:
  language: ru
  text: Открой свои двери, Ливан, и огонь пожрёт твои кедры.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Открой свои ворота, Ливан, чтобы огонь пожрал твои кедры».'
    reason: Лексема דלת допускает передачу «ворота», а имперфект после повеления может выражать цель или результат.
lexical_decisions:
- source_word: פְּתַח
  choice: Открой
  rationale: Повелительная форма 2-го лица единственного числа от פתח; прямое и естественное обращение к олицетворённому Ливану.
- source_word: לְבָנוֹן
  choice: Ливан
  rationale: Имя собственное, выступающее здесь как олицетворённый адресат.
- source_word: דְּלָתֶיךָ
  choice: свои двери
  rationale: דלת прежде всего означает «дверь, створка двери»; возвратное «свои» естественно передаёт суффикс 2-го лица при русском повелительном наклонении. Возможный контекстуальный вариант — «ворота».
- source_word: וְתֹאכַל
  choice: и ... пожрёт
  rationale: Имперфект Qal 3-го лица женского рода от אכל после повеления может обозначать последствие или цель. Союз «и» сохраняет формальную связь и пророческую определённость, не исключая оттенка результата.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое соответствие основному значению существительного.
- source_word: בַּאֲרָזֶיךָ
  choice: твои кедры
  rationale: Хотя предлог ב буквально допускает локативное понимание «среди твоих кедров», при אכל конструкция естественно передаёт охваченный уничтожением объект; «твои кедры» ясно и идиоматично выражает образ.
theological_decisions:
- issue: Олицетворение и пророческий образ
  choice: Ливан прямо назван олицетворённым адресатом, двери которого открываются разрушительному огню.
  alternative: Понимать двери буквально как горные проходы или входы в лес либо символически относить образ к связанным с Ливаном политическим силам.
  rationale: Еврейский текст не уточняет окончательный символический референт. Перевод сохраняет образ и его напряжение, не сводя его к одной исторической или богословской трактовке.
- issue: Связь между повелением и последующим имперфектом
  choice: «и огонь пожрёт»
  alternative: «чтобы огонь пожрал» / «и пусть огонь пожрёт»
  rationale: Форма допускает оттенок результата или цели. Основной текст сохраняет союз וְ и уверенную пророческую перспективу; примечание отмечает возможное целевое прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим звучанием. Глагол «пожрёт» сохраняет яркость образа אכל применительно к огню; олицетворение Ливана оставлено без поясняющей конкретизации.
