  text: אֲשֶׁ֨ר קֹנֵי/הֶ֤ן יַֽהֲרְגֻ/ן֙ וְ/לֹ֣א יֶאְשָׁ֔מוּ וּ/מֹכְרֵי/הֶ֣ן יֹאמַ֔ר בָּר֥וּךְ יְהוָ֖ה וַ/אעְשִׁ֑ר וְ/רֹ֣עֵי/הֶ֔ם לֹ֥א יַחְמ֖וֹל עֲלֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/005.yaml
  text: whose buyers slaughter them and are not held guilty[a], and whose sellers say, “Blessed be Yahweh[b], for I have become rich,” and their shepherds have no compassion on them.
translation:
  language: ru
  text: 'которых покупатели закалывают и не несут за это вины[a], а их продавцы говорят: «Благословен Яхве! Я разбогател», — и их пастухи не жалеют[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не признаются виновными»; возможно также: «остаются безнаказанными».'
    reason: 'Лексическая неоднозначность глагола אשם: вина, признание виновным или последствие вины.'
  - marker: b
    text: 'Или: «не щадят их».'
    reason: Глагол חמל может означать как жалость и сострадание, так и действие — пощадить.
lexical_decisions:
- source_word: קֹנֵיהֶן
  choice: покупатели
  rationale: Сохраняет торговый образ и смысловую параллель с «теми, кто их продаёт»; перевод «владельцы» ослабил бы этот образ.
- source_word: יַהֲרְגֻן
  choice: закалывают
  rationale: Глагол означает «убивать»; в контексте стада «закалывают» естественно передаёт и буквальный образ овец, и жестокость обращения с ними.
- source_word: וְלֹא יֶאְשָׁמוּ
  choice: и не несут за это вины
  rationale: Передаёт значение אשם — оказаться виновным, понести вину или ответственность, — не сводя выражение исключительно к отсутствию наказания.
- source_word: וּמֹכְרֵיהֶן יֹאמַר
  choice: а каждый из тех, кто их продаёт, говорит
  rationale: Так естественно передано сочетание множественного обозначения продавцов с глаголом в единственном числе; единственное число также согласуется с последующей репликой от первого лица.
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Яхве!
  rationale: Сохраняет формулу благословения и передаёт личное имя Бога как «Яхве».
- source_word: וָאֶעְשִׁר
  choice: Я разбогател
  rationale: Точно и естественно передаёт результативный смысл формы от עשר и самодовольный тон продавца.
- source_word: וְרֹעֵיהֶם
  choice: и пастухи их
  rationale: Сохраняет пастушескую метафору и притяжательное отношение, не подменяя образ толкованием «руководители» или церковным термином.
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  choice: не жалеют
  rationale: Современное и естественное выражение отсутствия жалости и сострадания; возможный оттенок «не щадят» отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Образ רֹעִים
  choice: пастухи
  alternative: руководители; пастыри
  rationale: Сохранён исходный образ без преждевременного истолкования как политического или церковного служения.
- issue: Характер отсутствия вины в וְלֹא יֶאְשָׁמוּ
  choice: не несут за это вины
  alternative: не признаются виновными; остаются безнаказанными
  rationale: Выбранная формулировка сохраняет напряжение между самой виновностью и привлечением к ответственности, не ограничивая смысл одной юридической трактовкой.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческого образа стада. Начальная относительная конструкция намеренно оставлена как продолжение предыдущего стиха. Реплика продавца оформлена живо, но без разговорной сниженности; местоименная форма «каждый из тех» естественно согласует коллективный субъект с еврейским глаголом в единственном числе.
