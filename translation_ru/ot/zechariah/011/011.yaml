base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
translation:
  language: ru
  text: И в тот день завет был расторгнут[b], и тогда страдальцы из стада[a], наблюдавшие за мной, поняли, что это было слово Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедняки из стада»; или: «смиренные из стада».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «она была нарушена». Или, в связи с образом сломанного посоха в предыдущем стихе: «она была сломана»; «она была отменена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  choice: он был сломан
  rationale: Пассивная форма глагола פרר отсылает к посоху и одновременно допускает подразумеваемое упразднение завета; «сломан» сохраняет предметный образ.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественное русское соответствие устойчивому временному выражению.
- source_word: וַיֵּדְעוּ כֵן
  choice: и тогда ... поняли
  rationale: כֵן передаёт связь между совершённым действием и последующим узнаванием; «тогда» естественно выражает эту связь по-русски.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: страдальцы из стада
  rationale: עֲנִיֵּי может обозначать бедных, угнетённых или смиренных; «страдальцы» сохраняет значение переживаемого бедствия, не сводя его только к материальной бедности.
- source_word: הַשֹּׁמְרִים אֹתִי
  choice: наблюдавшие за мной
  rationale: Причастие שׁמר с прямым дополнением здесь естественно передаёт внимательное наблюдение за говорящим.
- source_word: כִּי דְבַר יְהוָה הוּא
  choice: что это было слово Яхве
  rationale: Фраза определяет происходящее как слово Яхве или его исполнение; указательное «это» делает отсылку ясной, не устраняя исходной смысловой ёмкости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Референт местоимения в וַתֻּפַר
  choice: 'мужской род: «он был сломан»'
  alternative: 'средний род: «это было нарушено/упразднено»'
  rationale: Мужской род естественно отсылает к посоху из предыдущего стиха, а примечание сохраняет заветный оттенок глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для широкого читателя; образ сломанного посоха и смысловая неоднозначность עֲנִיֵּי сохранены посредством примечаний.
