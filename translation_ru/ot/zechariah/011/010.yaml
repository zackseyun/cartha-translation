  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
translation:
  language: ru
  text: Тогда я взял свой посох «Благоволение» и разрубил его, чтобы расторгнуть Мой завет, который Я заключил со всеми народами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со всеми племенами». Еврейское слово может обозначать народы, племена или этнические общности; в основном тексте сохранено множественное число.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  choice: свой посох
  rationale: מַקֵּל обозначает посох или жезл; в образе пастуха естественнее современное русское «посох».
- source_word: נֹעַם
  choice: «Благоволение»
  rationale: Название посоха передано по смыслу. Слово выражает приятность, благосклонность и благоволение; здесь «Благоволение» естественно связывает название с символикой заветной милости, не сводя его к узкому богословскому термину.
- source_word: וָאֶגְדַּע אֹתוֹ
  choice: и разрубил его
  rationale: גדע означает отсечь, срубить или перерубить. «Разрубил» ясно передаёт символическое рассечение посоха, не добавляя прямо отсутствующего в еврейском тексте уточнения «надвое».
- source_word: לְהָפֵיר
  choice: чтобы расторгнуть
  rationale: В отношении завета הפר означает нарушить, упразднить или сделать недействительным. «Расторгнуть завет» — точное и естественное русское сочетание, подчёркивающее прекращение его действия.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: בְּרִית — устойчивый библейский термин «завет»; прописная буква у местоимения соответствует достоинству русской библейской речи при отнесении слов к Богу.
- source_word: כָּרַתִּי
  choice: который Я заключил
  rationale: כרת ברית — идиома «заключить завет». Русское относительное придаточное естественно показывает, что завет был заключён прежде его расторжения.
- source_word: כָּל הָעַמִּים
  choice: со всеми народами
  rationale: Множественное עַמִּים передано множественным «народами», без сужения референта до одного народа или соседних народов.
theological_decisions:
- issue: Объём выражения «со всеми народами»
  choice: Сохранено широкое «со всеми народами».
  alternative: «со всеми племенами»; «со всеми окружающими народами»; ограничение одним Израилем
  rationale: Еврейский текст прямо говорит כָּל הָעַמִּים и в самом стихе не уточняет более узкий круг. Перевод сохраняет эту широту и богословское напряжение.
- issue: Характер прекращения завета
  choice: «расторгнуть Мой завет»
  alternative: «нарушить Мой завет»; «отменить Мой завет»
  rationale: Форма с говорящим от первого лица и символическим действием указывает здесь на прекращение действия завета. «Расторгнуть» передаёт это без предположения, что говорящий виновен в вероломном нарушении.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Название посоха выделено кавычками; синтаксис остаётся ясным и близким к последовательности еврейского текста. Маркер сноски поставлен непосредственно после соответствующего выражения.
