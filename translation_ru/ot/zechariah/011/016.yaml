  text: כִּ֣י הִנֵּֽה אָנֹכִי֩ מֵקִ֨ים רֹעֶ֜ה בָּ/אָ֗רֶץ הַ/נִּכְחָד֤וֹת לֹֽא יִפְקֹד֙ הַ/נַּ֣עַר לֹֽא יְבַקֵּ֔שׁ וְ/הַ/נִּשְׁבֶּ֖רֶת לֹ֣א יְרַפֵּ֑א הַ/נִּצָּבָה֙ לֹ֣א יְכַלְכֵּ֔ל וּ/בְשַׂ֤ר הַ/בְּרִיאָה֙ יֹאכַ֔ל וּ/פַרְסֵי/הֶ֖ן יְפָרֵֽק־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
translation:
  language: ru
  text: 'Ибо вот, Я поставлю в земле пастуха: он не позаботится о пропадающих, не станет искать молодую овцу[a], не исцелит покалеченную, не станет поддерживать ту, что ещё стоит на ногах[b]. Но он будет есть мясо откормленных овец и срывать с них копыта.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обычно означает «юноша» или «молодой». В этом контексте его иногда понимают как обозначение заблудившейся или уязвимой овцы.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стоящую». Возможно, имеется в виду овца, которая ещё держится на ногах, то есть уцелевшая или здоровая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: поставлю
  rationale: Каузативная форма от קום означает «воздвигнуть, поставить, утвердить». «Поставлю» естественно передаёт действие Бога, не уточняя, идёт ли речь о формальном назначении.
- source_word: רֹעֶה
  choice: пастуха
  rationale: Обычное обозначение пастуха; сохраняет как прямой образ стада, так и возможный переносный смысл правителя или вождя.
- source_word: הַנִּכְחָדוֹת
  choice: о пропадающих
  rationale: Форма обозначает исчезающих, гибнущих или истребляемых. «Пропадающие» сохраняет смысловую широту и естественно звучит применительно к овцам.
- source_word: יִפְקֹד
  choice: позаботится
  rationale: В данном контексте פקד означает обратить внимание, присмотреть, позаботиться. Выбор передаёт пастырскую обязанность без искусственной буквальности «посетит».
- source_word: הַנַּעַר
  choice: молодую овцу
  rationale: Масоретский текст буквально содержит существительное со значением «молодой, юный». Слово «овцу» добавлено из очевидного контекста стада; спорное понимание «заблудившуюся» не внесено в основной текст.
- source_word: יְבַקֵּשׁ
  choice: не станет искать
  rationale: Прямое и естественное соответствие глаголу בקש — «искать».
- source_word: הַנִּשְׁבֶּרֶת
  choice: покалеченную
  rationale: Страдательное причастие от שבר буквально означает «сломанная». В отношении животного «покалеченная» ясно передаёт физическую травму и не исключает образного смысла.
- source_word: יְרַפֵּא
  choice: не исцелит
  rationale: רפא означает «исцелять, лечить». «Исцелит» сохраняет одновременно телесный и переносный оттенки.
- source_word: הַנִּצָּבָה
  choice: ту, что ещё стоит на ногах
  rationale: Буквально — «стоящая». Развёрнутая русская формулировка сохраняет образ стоящего животного и не превращает его безоговорочно в характеристику «здоровая».
- source_word: יְכַלְכֵּל
  choice: не прокормит
  rationale: כלכל может означать содержать, поддерживать, снабжать пищей. В контексте обязанностей пастуха «прокормит» естественно, хотя значение шире одного кормления.
- source_word: הַבְּרִיאָה
  choice: откормленной овцы
  rationale: בריא здесь означает упитанную, жирную, хорошо откормленную. Такой выбор подчёркивает хищническое поведение пастуха, не смешивая это слово с «стоящей» овцой из предыдущей строки.
- source_word: פַרְסֵיהֶן יְפָרֵק
  choice: срывать с овец копыта
  rationale: פרסה — «копыто», а פרק в данном образе означает отрывать или раздирать. Повтор «с овец» естественно передаёт еврейское множественное местоимение «их» после существительного в единственном числе.
theological_decisions:
- issue: Кем является поставленный пастух
  choice: Оставить просто «пастух», не отождествляя его с конкретным историческим или эсхатологическим лицом.
  alternative: Назвать его злым, негодным пастухом либо прямо указать на определённого противника.
  rationale: Сам стих описывает жестокость этого пастуха, но здесь не называет его и не даёт однозначного исторического отождествления.
- issue: Божье действие и ответственность жестокого пастуха
  choice: Сохранить прямое «Я поставлю», одновременно не добавляя объяснения причинности.
  alternative: Ослабить до «Я допущу появление пастуха».
  rationale: Каузативная форма מֵקִים прямо выражает действие Бога. Перевод не должен заранее разрешать напряжение между Божьим судом и виновностью самого пастуха.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Начальное «Ибо вот» сохраняет связку כִּי и эмфатическое הִנֵּה. Параллельный ряд отрицаний передан ритмично; после него «Зато» ясно вводит контраст хищнических действий пастуха. Заглавная буква в «Я» указывает на говорящего Бога по русской библейской издательской традиции, не добавляя имени в сам стих.
