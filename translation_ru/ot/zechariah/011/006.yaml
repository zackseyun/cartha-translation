  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
translation:
  language: ru
  text: '«Ибо Я больше не буду щадить жителей земли[a], — возвещает Яхве. — Вот, Я отдаю людей: каждого — в руки его ближнего и в руки его царя[b]. Они сокрушат землю, и Я не избавлю её из их рук[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «жителей всей земли», если הָאָרֶץ понимается универсально, а не как конкретная земля.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «человека — каждого в руку его ближнего и в руку его царя»; выражение означает, что каждый будет отдан во власть другого.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте объект глагола «избавлю» не назван. По контексту это может быть земля («её») или её жители («их»).
    reason: ambiguity
lexical_decisions:
- source_word: אֶחְמוֹל
  choice: не буду щадить
  rationale: Глагол חמל может означать как сострадание, так и удержание от кары. В контексте суда «щадить» естественно передаёт обе стороны значения.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жителей этой земли
  rationale: Причастная конструкция обозначает жителей, а הָאָרֶץ в ближайшем контексте вероятнее относится к конкретной земле. Указательное «этой» естественно выражает определённость в русском, не устраняя возможного значения «земля» в более широком смысле.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Сохранена торжественная пророческая формула и передано собственное имя יהוה.
- source_word: מַמְצִיא
  choice: предаю
  rationale: Порода hифиль здесь означает отдать людей во власть других; «предаю» кратко и естественно передаёт каузативный смысл.
- source_word: הָאָדָם אִישׁ
  choice: людей — каждого
  rationale: 'הָאָדָם обозначает людей собирательно, а אִישׁ вводит распределительный смысл: каждого по отдельности.'
- source_word: בְיַד רֵעֵהוּ וּבְיַד מַלְכּוֹ
  choice: в руки его ближнего и в руки его царя
  rationale: Образ «руки» как власти сохранён; повтор передаёт параллелизм еврейского текста. Местоимение «его» сохраняет форму оригинала и распределительную связь с «каждого».
- source_word: וְכִתְּתוּ
  choice: они сокрушат
  rationale: כתת выражает насильственное раздробление или сокрушение; «сокрушат» соответствует образу опустошительного суда.
- source_word: וְלֹא אַצִּיל מִיָּדָם
  choice: и Я не избавлю её из их рук
  rationale: נצל в hифиле означает избавить или спасти. Местоимение «её» восполняет невыраженный объект по ближайшему antecedent — «землю», а «из их рук» сохраняет сквозной образ власти.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Масштаб значения הָאָרֶץ
  choice: эта земля
  alternative: земля как весь мир
  rationale: Контекст Захарии 11 прежде всего указывает на конкретную страну и её жителей, однако возможное универсальное прочтение отмечено в сноске.
- issue: Референт невыраженного объекта при אַצִּיל
  choice: земля — «не избавлю её»
  alternative: жители/люди — «не избавлю их»; оставить объект подразумеваемым
  rationale: Ближайший явно названный объект — הָאָרֶץ, поэтому женское местоимение обеспечивает связность русского текста. Поскольку еврейский оригинал объекта не выражает, неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены повтор образа «рук», резкий переход к прямой речи Яхве и напряжение между коллективным «людей» и распределительным «каждого».
