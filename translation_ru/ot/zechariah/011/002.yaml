source:
  edition: WLC
  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
translation:
  language: ru
  text: 'Рыдай, кипарис[a],

    ведь пал кедр,

    ведь величественные уничтожены[b]!

    Рыдайте, дубы Башана,

    ведь рухнул неприступный лес[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пихта»; точный вид дерева неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «могущественные разорены».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «густой лес» или «укреплённый лес».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  choice: Рыдай / Рыдайте
  rationale: Повелительные формы глагола ילל призывают к громкому плачу от скорби или бедствия. «Рыдать» естественно передаёт пророческий плач и сохраняет различие единственного и множественного числа.
- source_word: בְּרוֹשׁ
  choice: кипарис
  rationale: Название дерева точно не установлено; «кипарис» соответствует распространённому современному лексикографическому пониманию и уместно в параллели с кедром и дубами.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит причину плача. «Ведь» ясно выражает причинную связь и сохраняет поэтическую плавность.
- source_word: נָפַל
  choice: пал
  rationale: Глагол буквально обозначает падение. Перевод не уточняет, был ли кедр срублен, и тем самым не добавляет отсутствующей в еврейском тексте причины.
- source_word: אֶרֶז
  choice: кедр
  rationale: Обычное соответствие еврейскому слову; в пророческой поэзии кедр служит образом величия и силы.
- source_word: אַדִּרִים
  choice: величественные
  rationale: Слово обозначает величественных, славных или могущественных. Субстантивированное прилагательное сохраняет возможность относить его как к величественным деревьям, так и метафорически к влиятельным людям.
- source_word: שֻׁדָּדוּ
  choice: погублены
  rationale: Пассивная форма передаёт насильственное разорение или уничтожение. «Погублены» естественно сочетается с неоднозначным «величественные» и не сводит образ к буквальному разграблению.
- source_word: אַלּוֹנֵי בָשָׁן
  choice: дубы Башана
  rationale: Традиционное и узнаваемое обозначение прославленных могучих деревьев Башана; возможное ботаническое отождествление с терпентинными деревьями здесь не является несомненным.
- source_word: יָרַד
  choice: рухнул
  rationale: Буквально глагол значит «сошёл, опустился». В отношении леса «рухнул» естественно передаёт его падение, не делая явно выраженным действующее лицо.
- source_word: יַעַר הַבָּצוּר
  choice: неприступный лес
  rationale: Прилагательное בָּצוּר обычно связано с укреплённостью или недоступностью. В сочетании с лесом «неприступный» сохраняет этот смысл лучше, чем более истолковывающее «густой».
theological_decisions:
- issue: Следует ли прямо истолковать деревья как правителей или могущественные силы
  choice: Сохранить в основном тексте образ кедра, кипариса, дубов и леса
  alternative: Заменить деревья прямыми обозначениями правителей, знати или народов
  rationale: Образ, вероятно, имеет метафорическое отношение к влиятельным людям или силам, однако еврейский текст выражает мысль через деревья. Сохранение образа не устраняет намеренно оставленную интерпретационную напряжённость.
- issue: К кому относятся «величественные»
  choice: Оставить субстантивированное прилагательное без уточняющего существительного
  alternative: Передать как «величественные деревья» или «могущественные правители»
  rationale: Еврейское אַדִּרִים допускает связь с величественными деревьями в непосредственном образе и с могущественными людьми на метафорическом уровне. Уточнение разрешило бы эту неоднозначность за читателя.
translation_notes:
  register: Современный литературный русский язык с краткими поэтическими строками и возвышенной, но понятной лексикой. Повтор «Рыдай / Рыдайте» передаёт структуру еврейского плача; образность и неоднозначность исходного текста сохранены.
