  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
translation:
  language: ru
  text: И придут многие народы и могущественные нации, чтобы искать Яхве Воинств в Иерусалиме и молить Яхве о благосклонности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искать благосклонности Яхве». В еврейской идиоме буквально упоминается «лицо Яхве»; она означает просить его милости или благосклонности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: И придут
  rationale: Перфект с союзом в пророческом контексте передаёт будущее действие; «придут» естественно выражает паломничество к Иерусалиму.
- source_word: עַמִּים רַבִּים
  choice: многие народы
  rationale: «Народы» передаёт множественное עַמִּים и сохраняет коллективно-этнический смысл.
- source_word: וְגוֹיִם עֲצוּמִים
  choice: и могущественные племена
  rationale: «Племена» позволяет не повторять «народы» и сохраняет различие между עַמִּים и גוֹיִם; עֲצוּמִים обозначает силу и могущество.
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  choice: чтобы искать Яхве Воинств
  rationale: «Искать» прямо передаёт בקשׁ; «Яхве» воспроизводит личное имя, а «Воинств» сохраняет образ небесных или военных сил в титуле צְבָאוֹת.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Обычное локативное значение предлога בְּ.
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  choice: и молить Яхве о благосклонности
  rationale: Идиома буквально связана с «лицом Яхве», но означает настойчиво просить его милости или благосклонного присутствия; выбран естественный современный русский оборот.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Передача צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Всемогущий
  rationale: «Воинств» сохраняет конкретный образ исходного титула; «Всемогущий» выражал бы более широкое богословское понятие, а «Саваоф» для многих современных читателей непрозрачно.
- issue: Значение идиомы חלה את־פני יהוה
  choice: молить Яхве о благосклонности
  alternative: искать благосклонности Яхве; умолять пред лицом Яхве
  rationale: Основной текст ясно передаёт просительный и relational sense идиомы, а сноска сохраняет её буквальный образ и возможный оттенок присутствия.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; имя Бога и образ титула переданы формально, тогда как непрозрачная идиома раскрыта по смыслу и снабжена сноской.
