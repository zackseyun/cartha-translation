lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Последовательная форма глагола היה вводит новое пророческое откровение; формула «И было слово…» естественна для библейского повествования и сохраняет событийный оттенок исходного выражения.
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле существительное обозначает исходящее от Бога слово или весть; «слово» сохраняет устойчивую формулу и её богословскую значимость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе титула слово передаёт образ небесных и земных сил, находящихся под властью Яхве; прописная буква подчёркивает цельность титула.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Инфинитив вводит последующую прямую речь. В современном русском языке эту функцию естественно и без потери смысла выполняет двоеточие, избегая тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф / Яхве, Бог воинств / Яхве Всемогущий
  rationale: Формальная передача сохраняет образ воинств и не сводит титул к более общему понятию всемогущества. Она также не уточняет без необходимости, являются ли эти воинства небесными, земными или теми и другими.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Архаичное «Саваоф» не использовано; לֵאמֹר передано русской пунктуацией как ввод прямой речи.
