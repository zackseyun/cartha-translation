base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
translation:
  language: ru
  text: 'Ибо будет семя мира[a]: виноградная лоза даст свой плод, земля даст свой урожай, и небеса дадут свою росу; и Я дам остатку этого народа всё это в наследие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благополучное семя», «мирный посев» или «семя благополучия». Еврейское выражение кратко и многозначно и, вероятно, обобщает всю картину восстановленного земледельческого благословения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע הַשָּׁלוֹם
  choice: семя мира
  rationale: Сохраняет краткий и многозначный земледельческий образ еврейского текста. «Мир» передаёт широту שָׁלוֹם — мир, благополучие, целостность и процветание, — не сводя выражение лишь к материальному достатку.
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующим обещанием и соответствует достоинству пророческой речи.
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  choice: виноградная лоза даст свой плод
  rationale: Близко следует еврейскому выражению и ясно называет лозу, не оставляя возможной двусмысленности русского слова «лоза».
- source_word: יְבוּל
  choice: урожай
  rationale: Естественное современное обозначение того, что производит земля в данном земледельческом контексте.
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  choice: небеса дадут свою росу
  rationale: Сохраняет множественное «небеса», конкретный образ росы и повтор глагола נתן — «дать».
- source_word: וְהִנְחַלְתִּי
  choice: Я дам ... унаследовать
  rationale: Передаёт каузативную форму глагола נחל и сохраняет оттенок наследственного, дарованного Богом владения.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: остатку этого народа
  rationale: «Остаток» — точный и естественный пророческий термин, сохраняющий как буквальный, так и богословский смысл.
- source_word: אֶת כָּל אֵלֶּה
  choice: всё это
  rationale: Естественно по-русски указывает на все перечисленные благословения как на единое целое.
theological_decisions:
- issue: Смысловой диапазон שָׁלוֹם в контексте земледельческого благословения
  choice: В основном тексте сохранено «семя мира».
  alternative: «благополучное семя», «мирный посев», «семя благополучия»
  rationale: שָׁלוֹם охватывает мир, благополучие, целостность и процветание. Буквально-образная передача сохраняет богословскую широту и подлинную сжатость еврейской фразы.
- issue: Наследственная семантика וְהִנְחַלְתִּי
  choice: Сохранена конструкция «Я дам ... унаследовать».
  alternative: «Я отдам ... во владение», «Я дам ... всё это»
  rationale: Так передаются и каузативность глагольной формы, и связь с темой наследия как Божьего дара, без сведения смысла к простому обладанию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «даст» сохранён для передачи ритма и структуры оригинала; образные и заветно-наследственные выражения не упрощены.
