base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
translation:
  language: ru
  text: Но теперь Я не буду для остатка этого народа таким, каким был в прежние дни[a], — возвещает Яхве Воинств[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Но теперь не как в прежние дни Я — для остатка этого народа». В еврейском тексте сказуемое опущено; по смыслу возможно также: «Я не стану обращаться с остатком этого народа так, как в прежние дни».'
    reason: alternative_reading
  - marker: b
    text: 'Традиционный перевод: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Союз с наречием вводит контраст с прежними бедствиями, описанными в предыдущих стихах.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: как в прежние дни
  rationale: Предлог כ выражает сравнение; «прежние дни» естественно передаёт отсылку к предшествующему периоду.
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  choice: для остатка этого народа
  rationale: Сохранено важное для пророческой речи понятие «остаток»; ל при подразумеваемом бытийном сказуемом естественно передаётся русским «для».
- source_word: נְאֻם
  choice: возвещает
  rationale: Торжественная формула пророческого изречения; глагол настоящего времени звучит по-русски естественно и сохраняет декларативный характер.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת переведено как «Воинств», что сохраняет военный и небесно-космический диапазон обозначения.
theological_decisions:
- issue: Отсутствие явного сказуемого после אֲנִי
  choice: «Я не буду… таким, как в прежние дни» с поясняющей сноской об эллипсисе
  alternative: «Я не стану обращаться с остатком этого народа так, как в прежние дни»
  rationale: В еврейском тексте сказуемое не выражено. Русская грамматика требует минимального восполнения; «не буду… таким» меньше конкретизирует характер Божьих действий, чем «не стану обращаться», а сноска сохраняет осведомлённость читателя о неоднозначности.
- issue: Передача имени и титула יְהוָה צְבָאוֹת
  choice: «Яхве Воинств»
  alternative: «Господь Саваоф»
  rationale: Основной текст прямо передаёт личное имя и смысл צְבָאוֹת, не ограничивая титул одной традиционной церковной формой; традиционный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Эллиптическая еврейская конструкция минимально восполнена ради естественности, а её буквальная форма и возможный смысл приведены в сноске.
