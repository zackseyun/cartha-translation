base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Вот, Я спасу[a] свой народ из земли востока и из земли захода солнца[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможная передача: «Вот, Я спасаю свой народ». Еврейское причастие в пророческой речи может выражать начинающееся, близкое или несомненное будущее действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из земли востока и из земли захода солнца». Эти противоположные направления могут вместе обозначать далёкие земли на востоке и на западе.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка торжественная формула пророческого возвещения; настоящее время передаёт непреходящую авторитетность произносимого слова.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога и сохраняет широкий смысл титула, указывающего на подвластные Ему воинства, не сужая его только до земных армий.
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: Сохраняет эмфатическое указание на Самого говорящего и на близость объявленного Им действия; соответствует возвышенному пророческому регистру.
- source_word: מוֹשִׁיעַ
  choice: спасу
  rationale: Причастие в сочетании с הִנְנִי в пророческом обещании естественно передаётся по-русски будущим временем, выражая предстоящее и несомненное действие.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямо передаёт притяжательную форму и обозначение народа, принадлежащего говорящему, без поясняющего расширения.
- source_word: מֵאֶרֶץ מִזְרָח
  choice: из страны востока
  rationale: Сохраняет существительное אֶרֶץ и направление, не превращая выражение в название конкретного государства.
- source_word: וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  choice: и из страны захода солнца
  rationale: Формально и поэтически передаёт еврейское обозначение запада и сохраняет образную пару восток—заход солнца.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Временной и видовой оттенок מוֹשִׁיעַ после הִנְנִי
  choice: спасу
  alternative: спасаю; намерен спасти
  rationale: Еврейское причастие допускает оттенок начинающегося, близкого или несомненного будущего действия. Русское будущее здесь звучит естественно, а примечание сохраняет аспектуальную неоднозначность.
- issue: Объём выражения восток—заход солнца
  choice: сохранить обе образные географические формулы
  alternative: с востока и с запада; отовсюду
  rationale: Исходный текст называет два противоположных края. Сохранение образа не устраняет возможность понимать их как меризм, но и не навязывает это понимание непосредственно в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены личное имя «Яхве», традиционно понятный титул «Воинств» и поэтическая географическая образность оригинала; синтаксис остаётся доступным обычному читателю.
