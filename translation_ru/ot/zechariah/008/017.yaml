    rationale: 'В тексте «пусть никто из вас не замышляет ... и не любите» первая часть построена в 3-м лице единственного числа, а вторая — во 2-м лице множественного. Это неестественно для русского и не требуется оригиналом: распределительный смысл можно сохранить единообразной конструкцией в 3-м лице.'
  - severity: low
    issue: Неточность формулировки сноски
    rationale: 'В сноске «И каждый — не замышляйте ... против его ближнего» смешиваются русские грамматические лица и создаётся впечатление дословного перевода. Следует ясно описать еврейскую особенность: существительное в единственном числе, но запрет и «сердца ваши» — во множественном.'
