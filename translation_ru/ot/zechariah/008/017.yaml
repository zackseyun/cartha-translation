base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
translation:
  language: ru
  text: И пусть никто из вас не замышляет в сердце своём зла против ближнего и не любит ложной клятвы, ибо всё это Я ненавижу, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ ... אַל תַּחְשְׁבוּ
  choice: И пусть никто из вас не замышляет
  rationale: 'Сочетание единственного אִישׁ с глаголом во втором лице множественного числа выражает распределённое обращение ко всей общине: запрет относится к каждому. «Никто из вас» естественно передаёт это по-русски.'
- source_word: רָעַת רֵעֵהוּ
  choice: зла против ближнего
  rationale: רָעָה обозначает зло или вред, а רֵעַ — ближнего, товарища, другого человека. Такая формулировка сохраняет направленность замысла против ближнего.
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  choice: не замышляет в своём сердце
  rationale: В данном контексте חשב означает не просто мысль, а намеренное обдумывание или замысел; образ сердца сохранён как обозначение внутренней воли и намерения.
- source_word: שְׁבֻעַת שֶׁקֶר
  choice: ложной клятвы
  rationale: Буквально «клятва лжи»; выбранное выражение естественно передаёт ложную, обманную клятву, не сужая значение до строго юридического термина «лжеприсяга».
- source_word: תֶּאֱהָבוּ
  choice: не любите
  rationale: Прямое значение אהב сохранено, поскольку речь идёт не только о совершении поступка, но и о внутреннем одобрении и привязанности к нему.
- source_word: כִּי אֶת כָּל אֵלֶּה אֲשֶׁר שָׂנֵאתִי
  choice: ведь всё это Я ненавижу
  rationale: Формулировка сохраняет обобщение «всё это» и передаёт совершенную форму שָׂנֵאתִי как настоящее состояние ненависти, что естественно в русском контексте.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — устойчивая пророческая формула, а имя יהוה передано транслитерацией «Яхве» как личное заветное имя Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объект Божьей ненависти
  choice: всё это Я ненавижу
  alternative: всех таких людей Я ненавижу
  rationale: Указательное אֵלֶּה отсылает к перечисленным злым установкам и действиям. Перевод не переносит ненависть с них на самих людей, чего текст прямо не утверждает.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сделан естественным для русского языка, при этом сохранены образы сердца, ложной клятвы, Божьей ненависти и формула пророческого возвещения.
