base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Я возвратился на Сион и буду обитать посреди Иерусалима. Иерусалим назовут Городом истины[a] и гору Яхве Воинств[b] — Святой горой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Городом верности». Еврейское אֱמֶת может означать истину, верность и надёжность.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Яхве Саваоф» или «Господь Саваоф». Еврейское צְבָאוֹת означает «воинства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула в естественной для современного русского библейской речи форме; личное имя יהוה передано как «Яхве».
- source_word: שַׁבְתִּי
  choice: Я возвратился
  rationale: Перфект выражает совершившееся возвращение с сохраняющимся результатом; «возвратился» звучит литературно и ясно.
- source_word: אֶל צִיּוֹן
  choice: на Сион
  rationale: Для русского названия возвышенности и священного места нормативно направительное сочетание «на Сион».
- source_word: וְשָׁכַנְתִּי
  choice: и буду обитать
  rationale: В контексте форма имеет перспективное значение после совершившегося возвращения; «обитать» сохраняет смысл постоянного Божьего присутствия.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: посреди Иерусалима
  rationale: Передаёт более точное значение בְּתוֹךְ, чем простое «в Иерусалиме», подчёркивая присутствие внутри города.
- source_word: וְנִקְרְאָה יְרוּשָׁלִַם
  choice: Иерусалим назовут
  rationale: Неопределённо-личная русская конструкция естественно передаёт еврейскую пассивную форму и будущее наименование.
- source_word: עִיר הָאֱמֶת
  choice: Город истины
  rationale: Прямо передаёт אֱמֶת, сохраняя при этом возможность значения верности, отмеченную в сноске.
- source_word: הַר יְהוָה צְבָאוֹת
  choice: гора Яхве Воинств
  rationale: צְבָאוֹת переведено по смыслу, а не транслитерировано как «Саваоф»; конструкция сохраняет титул и его образность.
- source_word: הַר הַקֹּדֶשׁ
  choice: Святая гора
  rationale: Точное и естественное соответствие, сохраняющее библейскую торжественность без архаизации.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, стоящее в еврейском тексте, без замены титулом.
- issue: Временное соотношение שַׁבְתִּי и וְשָׁכַנְתִּי
  choice: Я возвратился ... и буду обитать
  alternative: Я возвращаюсь ... и обитаю; Я возвратился ... и обитал
  rationale: Сочетание совершившегося возвращения с последующим обещанием обитания сохраняет временное напряжение пророческого высказывания.
- issue: Значение אֱמֶת
  choice: истина
  alternative: верность; надёжность
  rationale: Основной текст сохраняет прямое значение «истина», а сноска открыто отмечает реальную смысловую широту слова.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя; неоднозначность אֱמֶת не устранена, а вынесена в сноску. Маркеры сносок поставлены непосредственно после соответствующих выражений.
