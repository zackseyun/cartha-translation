  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֹ֤ד יֵֽשְׁבוּ֙ זְקֵנִ֣ים וּ/זְקֵנ֔וֹת בִּ/רְחֹב֖וֹת יְרוּשָׁלִָ֑ם וְ/אִ֧ישׁ מִשְׁעַנְתּ֛/וֹ בְּ/יָד֖/וֹ מֵ/רֹ֥ב יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Ещё будут сидеть на улицах Иерусалима[a] пожилые мужчины и женщины, и у каждого из них будет в руке посох по причине преклонного возраста».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площадях».'
    reason: Еврейское רְחֹבוֹת может обозначать улицы, широкие открытые места или городские площади.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчиво и естественно передаёт пророческую формулу в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широкий смысл традиционного божественного титула, не ограничивая его только земными армиями.
- source_word: עֹד יֵשְׁבוּ
  choice: Ещё будут сидеть
  rationale: Передаёт обещание грядущего восстановления и сохраняет конкретный образ сидящих в общественных местах людей.
- source_word: זְקֵנִים וּזְקֵנוֹת
  choice: старики и старухи
  rationale: Парные формы обозначают пожилых мужчин и женщин, а не должностных старейшин.
- source_word: בִּרְחֹבוֹת
  choice: на улицах
  rationale: Естественный русский эквивалент; возможное значение «на площадях» сохранено в сноске.
- source_word: וְאִישׁ
  choice: и у каждого
  rationale: Передаёт дистрибутивное значение единственного числа и естественно связывает его с предшествующей парой.
- source_word: מִשְׁעַנְתּוֹ בְּיָדוֹ
  choice: будет в руке посох
  rationale: Сохраняет конкретный образ опоры в руке, при этом русская конструкция естественно выражает принадлежность каждому.
- source_word: מֵרֹב יָמִים
  choice: от множества прожитых дней
  rationale: Сохраняет образность еврейского выражения «от множества дней» и ясно указывает на преклонный возраст.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение титула צְבָאוֹת
  choice: Воинств
  alternative: Сил; армий
  rationale: «Воинств» сохраняет намеренную широту титула и не уточняет без достаточного основания, земные или небесные силы имеются в виду.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «Так говорит» и титул «Яхве Воинств» сохраняют торжественность; остальная фраза остаётся ясной обычному читателю. Образ «множества прожитых дней» намеренно несколько возвышен и близок к еврейскому оригиналу.
