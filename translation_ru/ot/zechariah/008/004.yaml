  source_fidelity: 'Основной смысл передан верно: пророческая формула, имя Яхве, титул «Воинств», будущее восстановление, публичные места Иерусалима и посох как признак глубокой старости сохранены. Однако «от множества прожитых дней» в русской фразе неестественно присоединяется к посоху и недостаточно ясно выражает причинный смысл מֵרֹב יָמִים («по причине преклонного возраста»).'
  naturalness: «Старухи» в современном литературном русском обычно имеет пренебрежительный или грубоватый оттенок и потому неудачно в торжественном пророческом контексте. «Пожилые мужчины и женщины» нейтрально и ясно. Перестройка второй части устраняет двусмысленную связь причины с посохом.
  terminology: «Яхве Воинств» точно и последовательно передаёт יְהוָה צְבָאוֹת. «Посох» уместно передаёт מִשְׁעֶנֶת. Сноска к «улицах» корректно сохраняет лексическую возможность «площадей».
