  to: 'Так говорит Яхве Воинств: «Ещё будут сидеть на улицах Иерусалима[a] пожилые мужчины и женщины, и у каждого из них будет в руке посох по причине преклонного возраста».'
  rationale: Исправлены только стилистически маркированное обозначение пожилых женщин и неясная передача причинного выражения «от множества дней». Образ, дистрибутивность («у каждого из них»), наличие посоха в руке и причинная связь с преклонным возрастом сохранены.
