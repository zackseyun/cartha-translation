base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: пост четвёртого месяца[a], пост пятого, пост седьмого и пост десятого станут для дома Иуды ликованием, радостью и добрыми праздниками[b]. А истину и мир любите.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четвёртый пост, пятый пост, седьмой пост и десятый пост». В еврейском тексте посты названы порядковыми числительными; вероятнее всего, имеются в виду месяцы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «добрыми назначенными временами». Употреблённое еврейское слово часто обозначает установленные дни или праздники, особенно священные.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — кратким традиционно-библейским обозначением небесных и земных воинств без сужения смысла до одной армии.
- source_word: צ֣וֹם ... הָרְבִיעִי / הַחֲמִישִׁי / הַשְּׁבִיעִי / הָעֲשִׂירִי
  choice: пост четвёртого месяца, пост пятого, пост седьмого и пост десятого
  rationale: В еврейском тексте при каждом порядковом числительном повторено «пост»; слово «месяц» подразумевается. Его явное добавление при первом элементе делает выражение понятным по-русски, не перегружая последующее перечисление.
- source_word: יִהְיֶה
  choice: станут
  rationale: Форма глагола буквально означает «будут», но контекст говорит о превращении дней поста в поводы для празднования; «станут» естественно выражает этот переход.
- source_word: לְבֵית יְהוּדָה
  choice: для дома Иуды
  rationale: Сохранено корпоративное и заветное обозначение «дом Иуды», а предлог «для» передаёт значение отношения и пользы.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחָה
  choice: ликованием, радостью
  rationale: Два близких существительных переданы разными русскими словами, чтобы сохранить риторическую парность и не свести их к одному понятию.
- source_word: וּלְמֹעֲדִים טוֹבִים
  choice: и добрыми праздниками
  rationale: מוֹעֵד обозначает установленное время и нередко календарный священный праздник. В данном контексте «праздниками» естественно передаёт значение, а примечание поясняет оттенок назначенного времени.
- source_word: וְהָאֱמֶת וְהַשָּׁלוֹם אֱהָבוּ
  choice: Поэтому любите истину и мир
  rationale: Императив передан прямо. «Поэтому» естественно обозначает переход от обещания к требуемому отклику, хотя буквальная связь может быть передана союзом «и».
theological_decisions:
- issue: Преобразование памятных постов
  choice: Посты «станут» для Иуды днями ликования, радости и праздника.
  alternative: Посты «будут» ликованием и радостью; либо посты отменяются и заменяются праздниками.
  rationale: Перевод выражает изменение характера этих дней, но не утверждает прямо ни отмену постов, ни конкретный исторический механизм исполнения обещания.
- issue: Связь заключительного повеления с обещанием
  choice: «Поэтому любите истину и мир».
  alternative: «И любите истину и мир» или «Но любите истину и мир».
  rationale: Еврейское ו допускает простое присоединение, тогда как по смыслу повеление служит практическим откликом на обещание. «Поэтому» проясняет ход речи, не меняя содержания самого повеления.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Синтаксис перечисления слегка упрощён для естественности; повтор слова «пост» сохранён, а «месяца» указано один раз. Все примечания имеют соответствующие маркеры в основном тексте.
