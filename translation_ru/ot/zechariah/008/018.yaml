  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/018.yaml
  text: 'And the word of Yahweh of hosts came to me[a], saying:'
translation:
  language: ru
  text: 'И пришло ко мне слово Яхве Воинств:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Последовательная форма глагола היה вводит новое пророческое сообщение; по-русски естественно передать всю формулу сочетанием «пришло… слово», а не буквальным «и было».
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле обозначает конкретное Божье откровение; «слово» сохраняет устойчивый библейский образ и не сужает значение до пересказа как «сообщение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, не заменяя его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет образ многочисленных небесных сил в составе титула «Яхве Воинств», не подменяя его толкованием «Всемогущий».
- source_word: אֵלַי
  choice: ко мне
  rationale: Естественно обозначает Захарию как получателя пророческого слова.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Вводную функцию инфинитива «сказать» в современном русском естественно выражает двоеточие, поскольку далее следует содержание речи; буквальное «говоря» было бы тяжеловесным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств; Яхве небесных воинств
  rationale: Формулировка сохраняет личное имя и образ воинств, не уточняя без прямого основания, небесные это силы или земные армии.
translation_notes:
  register: 'Современный литературный русский с сохранением торжественной пророческой формулы. «Пришло ко мне слово» звучит естественнее буквального «было ко мне слово». Заглавная буква в «Воинств» отмечает цельный божественный титул. Ошибочная английская сноска не перенесена: её текст не соответствует месту маркера и не сообщает реального варианта еврейского текста.'
