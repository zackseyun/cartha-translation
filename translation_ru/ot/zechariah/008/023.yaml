  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «В те дни десять мужчин из всех языковых групп народов ухватятся — да, ухватятся — за край одежды иудея[a] и скажут: „Мы пойдём с вами, потому что слышали: Бог с вами“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека из Иудеи»; еврейское слово может обозначать как принадлежность к народу Иуды, так и связь с Иудеей.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога и конкретный смысл צְבָאוֹת; традиционное «Господь Саваоф» возможно, но менее прозрачно современному читателю.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: В те дни
  rationale: Естественный русский эквивалент устойчивого еврейского временного оборота.
- source_word: יַחֲזִיקוּ ... וְהֶחֱזִיקוּ
  choice: ухватятся — да, ухватятся
  rationale: Повтор глагола сохранён как выразительное усиление; «ухватятся» естественно передаёт крепкое, настойчивое удерживание.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: десять человек
  rationale: В русском языке обычное сочетание с числительным; оно не устраняет мужскую форму исходного существительного, но избегает неестественного «десять мужчин» в данном обобщённом образе.
- source_word: מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  choice: из народов, говорящих на разных языках
  rationale: Передаёт охват языков всех народов естественным современным русским языком, не превращая «языки» в обозначение физических органов.
- source_word: בִּכְנַף
  choice: за край одежды
  rationale: כָּנָף здесь обозначает край или угол одежды; перевод сохраняет конкретный образ, не уточняя вид одежды.
- source_word: אִישׁ יְהוּדִי
  choice: иудея
  rationale: Краткое и естественное обозначение человека из народа Иуды; возможный географический оттенок отмечен в сноске.
- source_word: נֵלְכָה עִמָּכֶם
  choice: Мы пойдём с вами
  rationale: Когортатив выражает решительное волеизъявление. Такая форма по-русски естественнее буквального «пойдёмте с вами», поскольку говорящие присоединяются к адресатам.
- source_word: אֱלֹהִים עִמָּכֶם
  choice: Бог с вами
  rationale: Прямо и естественно передаёт утверждение о Божьем присутствии с адресатами.
theological_decisions:
- issue: Передача יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве Саваоф
  rationale: Сохраняются личное имя и образ небесных или военных множеств без конфессионального переосмысления.
- issue: Значение יְהוּדִי
  choice: иудей
  alternative: человек из Иудеи; еврей
  rationale: «Иудей» сохраняет связь с Иудой и допускает этническую и территориальную стороны значения, не сводя его заранее только к одной из них.
- issue: Число местоимения עִמָּכֶם
  choice: с вами
  alternative: с тобой
  rationale: В еврейском тексте местоимение стоит во множественном числе, хотя люди держатся за одежду одного иудея. Перевод сохраняет это напряжение и не исправляет число по предполагаемому смыслу.
translation_notes:
  register: Современный литературный русский, торжественный пророческий регистр без архаизмов. Повтор «ухватятся» сохранён ради риторического нажима оригинала; множественное «с вами» оставлено вопреки единственному «иудею», поскольку именно так построен еврейский текст.
