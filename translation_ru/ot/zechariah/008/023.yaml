revisions:
- from: 'Так говорит Яхве Воинств: «В те дни десять человек из народов, говорящих на разных языках, ухватятся — да, ухватятся — за край одежды иудея[a] и скажут: „Мы пойдём с вами, потому что слышали: Бог с вами“».'
  to: 'Так говорит Яхве Воинств: «В те дни десять мужчин из всех языковых групп народов ухватятся — да, ухватятся — за край одежды иудея[a] и скажут: „Мы пойдём с вами, потому что слышали: Бог с вами“».'
  rationale: Уточнён перевод выражения «из всех языков народов» через естественное русское «из всех языковых групп народов», без изменения его всеохватности. «Десять человек» заменено на «десять мужчин» для более близкой передачи мужской формы исходного слова. Остальные решения, включая повтор глагола, «край одежды», когортативное «пойдём» и множественное «с вами», сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:07:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная структура, повтор глагола חזק, образ края одежды, когортативное «пойдём» и неожиданное множественное «с вами» переданы верно. Однако «из народов, говорящих на разных языках» ослабляет и перераспределяет формулировку מִכֹּל לְשֹׁנוֹת הַגּוֹיִם: в оригинале речь идёт о людях от всех языковых сообществ народов, а не просто о народах с разными языками. «Десять мужчин» точнее отражает אֲנָשִׁים, чем нейтральное «десять человек».'
  naturalness: Исправленная формулировка остаётся современной и литературной. «Языковые группы народов» — необходимое естественное пояснение, поскольку люди по-русски не могут быть «из языков». Торжественный регистр и риторическое усиление повтором «ухватятся — да, ухватятся» сохранены.
  terminology: '«Яхве Воинств» последовательно передаёт личное имя и צְבָאוֹת. «Иудей» уместно сохраняет неоднозначность יְהוּדִי между принадлежностью к Иудее/Иуде и более широким этническим значением; сноска корректно отмечает альтернативу. Сноска к «краю одежды» не обязательна: основной перевод уже достаточно точно передаёт כָּנָף.'
  issues:
  - severity: medium
    issue: Передача מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
    rationale: Оборот «из народов, говорящих на разных языках» заменяет исходный охват «всех языков народов» общей характеристикой народов и не выражает, что пришедшие представляют все языковые сообщества.
  - severity: low
    issue: Передача עֲשָׂרָה אֲנָשִׁים
    rationale: «Десять человек» по-русски естественно, но не отражает мужской род אֲנָשִׁים. В данном образе безопасно передать его как «десять мужчин».
