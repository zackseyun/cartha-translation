  text: And the streets of the city will be filled with boys and girls playing in its streets[a].
translation:
  language: ru
  text: И улицы города наполнятся мальчиками и девочками, играющими на его улицах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «площади города… играющими на его площадях». Еврейское слово может обозначать широкие улицы или открытые городские площади.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְחֹבוֹת
  choice: И улицы
  rationale: רְחֹבוֹת обозначает широкие городские пространства — улицы или площади. «Улицы» естественно звучит по-русски и позволяет сохранить повтор того же слова в конце стиха.
- source_word: הָ/עִיר
  choice: города
  rationale: עִיר — обычное обозначение города; родительный падеж естественно передаёт конструкцию принадлежности.
- source_word: יִמָּלְאוּ
  choice: наполнятся
  rationale: Нифаль имперфекта מלא передаёт будущее наполнение; возвратная форма «наполнятся» естественна в современном русском и сохраняет динамический глагольный смысл.
- source_word: יְלָדִים וִֽ/ילָדוֹת
  choice: мальчиками и девочками
  rationale: Мужская и женская формы образуют явную парную конструкцию; конкретные обозначения пола точнее, чем общее «детьми».
- source_word: מְשַׂחֲקִים
  choice: играющими
  rationale: В контексте восстановленного мирного города причастие от שׂחק естественно означает детскую игру; форма согласуется с «мальчиками и девочками».
- source_word: בִּ/רְחֹבֹתֶי/הָ
  choice: на его улицах
  rationale: Фраза повторяет רְחֹבוֹת и содержит суффикс 3-го лица женского рода, относящийся к городу. В русском местоимение согласуется с грамматическим родом слова «город», поэтому «его»; с «улицах» нормативен предлог «на».
