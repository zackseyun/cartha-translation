  naturalness: «Непременно пойдём» сохраняет настойчивый призыв и звучит современно и литературно. «Я тоже пойду» естественно выражает גַּם־אָנִי, включая присоединительное значение частицы גַּם.
  terminology: «Господь» для יהוה и «Господь Воинств» для יהוה צבאות последовательны и приемлемы. Оборот «умолять Господа о благосклонности» адекватно передаёт идиому לְחַלּוֹת אֶת־פְּנֵי יהוה, не сливая её со следующим «искать Господа Воинств».
