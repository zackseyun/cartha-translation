base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: ru
  text: 'И жители одного города пойдут к жителям другого и скажут: «Непременно пойдём умолять Господа о благосклонности и искать Господа Воинств». — «Я тоже пойду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי אַחַת אֶל אַחַת
  choice: жители одного города пойдут к жителям другого
  rationale: Существительное «город» подразумевается из контекста предыдущего стиха; по-русски его необходимо выразить явно. Повтор «одного… другого» естественно передаёт идиому движения из одного города в другой.
- source_word: נֵלְכָה הָלוֹךְ
  choice: Пойдём же, пойдём
  rationale: Сочетание личной формы с абсолютным инфинитивом усиливает призыв. Повтор сохраняет настойчивость и побуждение, не сводя выражение только к указанию времени.
- source_word: לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  choice: умолять Господа о благосклонности
  rationale: Идиома буквально связана с попыткой смягчить лицо адресата; выбранный оборот естественно передаёт почтительную мольбу о благоволении.
- source_word: יְהוָה צְבָאוֹת
  choice: Господа Воинств
  rationale: Передаёт традиционное замещение тетраграмматона словом «Господь» и сохраняет конкретный смысл צְבָאוֹת без архаичного транслитерированного «Саваоф».
- source_word: אֵלְכָה גַּם־אָנִי
  choice: И я пойду
  rationale: И местоимение אָנִי, и частица גַּם придают личное присоединительное ударение; в современном русском оно естественно выражается конструкцией «И я».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Употреблена общепринятая русская библейская форма, обозначающая тетраграмматон, без навязывания спорной реконструкции произношения.
- issue: Значение выражения יהוה צבאות
  choice: Господь Воинств
  alternative: Господь Саваоф / Господь сил
  rationale: Форма сохраняет широкую образность небесных и земных воинств и не ограничивает её одной богословской трактовкой.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Прямая речь оформлена так, чтобы заключительное личное присоединение звучало как отклик одного из слушателей; еврейский текст допускает такое прочтение, хотя пунктуация в оригинале не маркирована.
