  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
translation:
  language: ru
  text: Ведь до тех дней не было платы за труд человека и платы за труд скота; выходящему и входящему не было мира[a] от врага[b], и Я обращал каждого против его ближнего[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «мир» может также означать безопасность, благополучие и покой.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от противника»; еврейское слово обозначает враждебную сторону или врага.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и Я посылал каждого против его ближнего»; речь идёт о том, что Бог предавал людей взаимной вражде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение противопоставления в контексте; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  choice: до тех дней
  rationale: Сохраняется конкретный временной образ еврейского текста без обобщения до «тех времён».
- source_word: שְׂכַר הָאָדָם ... וּשְׂכַר הַבְּהֵמָה
  choice: платы за труд ни человека, ни скота
  rationale: שׂכר означает плату или вознаграждение. Добавление «за труд» делает параллель человека и рабочего скота ясной и естественной по-русски, не меняя смысла.
- source_word: וְלַיּוֹצֵא וְלַבָּא
  choice: выходящему и входящему
  rationale: Сохранена парная формула с субстантивированными причастиями; она обозначает людей в их обычных передвижениях и занятиях.
- source_word: אֵין שָׁלוֹם
  choice: не было мира
  rationale: «Мир» — основное соответствие שׁלום; примечание сохраняет присущие слову оттенки безопасности, благополучия и покоя.
- source_word: מִן הַצָּר
  choice: из-за врага
  rationale: הַצָּר здесь естественно понимать как враждебного противника, из-за которого передвижение стало небезопасным; מן передано причинно.
- source_word: וַאֲשַׁלַּח
  choice: Я обращал
  rationale: Буквально глагол означает «посылал», но конструкция с направлением одного человека против другого выражает то, что Бог предавал людей взаимной вражде. «Обращал ... против» передаёт это без излишне эмоциональной окраски.
- source_word: אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  choice: каждого против его ближнего
  rationale: 'Передана распределительная конструкция: все люди оказывались один против другого. «Ближний» сохраняет обычное межличностное значение רֵעַ.'
theological_decisions:
- issue: Обобщающее значение הָאָדָם
  choice: человека
  alternative: людей / человека как представителя человечества
  rationale: В противопоставлении человеку и скоту слово относится к людям вообще. Русское единственное число естественно сохраняет собирательно-родовое значение исходного текста.
- issue: Божественная роль во взаимной вражде людей
  choice: и Я обращал каждого против его ближнего
  alternative: и Я посылал каждого против его ближнего
  rationale: Текст прямо приписывает это действие Богу. Перевод не смягчает данную богословскую напряжённость, но передаёт конструкцию естественным русским выражением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и образ «выходящего и входящего» сохранены, а не заменены пояснительным пересказом.
