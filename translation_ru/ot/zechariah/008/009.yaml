base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств[a]: «Пусть будут крепки ваши руки[b], вы, кто в эти дни слышит эти слова из уст пророков[c], присутствовавших в день, когда было заложено основание дома Яхве Воинств, чтобы был построен храм[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь Воинств»; традиционно также: «Господь Саваоф».'
    reason: lexical_alternative
  - marker: b
    text: «Пусть будут крепки ваши руки» — древнееврейский образный призыв набраться мужества и решительно взяться за дело.
    reason: idiom_explanation
  - marker: c
    text: 'Буквально: «изо рта пророков», то есть слушая произносимую ими весть.'
    reason: lexical_alternative
  - marker: d
    text: 'Еврейская относительная конструкция очень сжата; глагол при «пророках» не выражен. Возможно также: «...из уст пророков, возвещавших в день, когда было заложено основание дома Яхве Воинств, чтобы был построен храм».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет устойчивую древнееврейскую формулу пророческого послания и естественно звучит в современном литературном русском языке.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה как «Яхве», а צְבָאוֹת — как «Воинств», сохраняя образ небесных и земных сил под властью Бога.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: Пусть ваши руки будут крепки
  rationale: Близко воспроизводит грамматическую форму и древнееврейский образ, означающий призыв к мужеству, решимости и деятельному труду.
- source_word: הַשֹּׁמְעִים בַּיָּמִים הָאֵלֶּה
  choice: вы, кто в эти дни слышит
  rationale: Передаёт причастную форму как характеристику тех, кто теперь слушает пророческое слово.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В контексте слышимой пророческой речи דְּבָרִים естественнее всего означает именно «слова».
- source_word: מִפִּי הַנְּבִיאִים
  choice: из уст пророков
  rationale: Сохраняет конкретный и выразительный древнееврейский оборот, понятный и по-русски.
- source_word: אֲשֶׁר בְּיוֹם יֻסַּד
  choice: говоривших в день, когда было положено основание
  rationale: Компактная относительная конструкция допускает эллипсис; «говоривших» связывает пророков с их речью, а «было положено основание» точно передаёт строительное значение пассива יסד.
- source_word: בֵּית יְהוָה צְבָאוֹת
  choice: дома Яхве Воинств
  rationale: Сохраняет библейское обозначение храма как дома Яхве; последующее слово «храм» уточняет референт.
- source_word: הַהֵיכָל לְהִבָּנוֹת
  choice: чтобы возвести храм
  rationale: Передаёт целевое значение конструкции с инфинитивом и избегает тяжеловесного русского пассива «чтобы храм был построен».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Передача צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных Воинств
  rationale: «Воинств» сохраняет традиционно возвышенный регистр и образ Бога как Владыки воинств, не ограничивая их явно только небесной сферой.
- issue: Смысл призыва о крепких руках
  choice: Сохранён буквальный образ как призыв к мужеству и труду
  alternative: Будьте мужественны; трудитесь решительно
  rationale: Образ рук связывает внутреннюю решимость с практическим восстановлением храма; его не следует сводить только к эмоциональной смелости.
- issue: Связь относительного אֲשֶׁר с пророками
  choice: пророки, говорившие в день основания
  alternative: пророки, присутствовавшие в тот день; слова, звучавшие со дня основания
  rationale: Еврейская фраза сжата и не выражает подразумеваемый глагол. Основной текст выбирает контекстуально вероятную связь с пророческой речью, а примечание сохраняет синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены формула «Так говорит», образ крепких рук, выражение «из уст пророков» и храм как «дом Яхве». Синтаксис слегка распрямлён для ясности, а подлинная неоднозначность относительной конструкции отмечена в сноске.
