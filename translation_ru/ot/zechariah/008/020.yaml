source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת עֹ֚ד אֲשֶׁ֣ר יָבֹ֣אוּ עַמִּ֔ים וְ/יֹשְׁבֵ֖י עָרִ֥ים רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/020.yaml
  text: 'Thus says Yahweh of hosts: Yet peoples shall come[a], and the inhabitants of many cities,'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: ещё придут народы[a] и жители многих городов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «племена».'
    reason: Лексема עַמִּים может обозначать народы или этнические общности; основной вариант «народы» наиболее естественен по-русски.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчиво и естественно передаёт пророческую формулу в настоящем времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Традиционное ёмкое соответствие в составе божественного имени-титула; сохраняет широту значения и не ограничивает его только земными армиями.
- source_word: עֹד אֲשֶׁר יָבֹאוּ
  choice: ещё придут
  rationale: Естественно выражает предстоящее дальнейшее исполнение обещания; אֲשֶׁר не требует отдельного соответствия в русском синтаксисе.
- source_word: עַמִּים
  choice: народы
  rationale: Обозначает множество народов или этнических общностей; это наиболее естественное русское соответствие множественному числу.
- source_word: וְיֹשְׁבֵי
  choice: и жители
  rationale: Кратко и естественно передаёт субстантивированное причастие в сопряжённой форме.
- source_word: עָרִים רַבּוֹת
  choice: многих городов
  rationale: רַבּוֹת здесь указывает прежде всего на многочисленность городов, а не на их величину.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение צְבָאוֹת в титуле יְהוָה צְבָאוֹת
  choice: Воинств
  alternative: Сил; армий
  rationale: «Воинств» сохраняет традиционную возвышенность и допускает широкий охват небесных и земных сил, не уточняя сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сделан завершённым для отдельного стиха; смысл продолжается в следующем стихе.
