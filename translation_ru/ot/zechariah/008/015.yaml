base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/015.yaml
  text: So now I have returned and purposed in these days to do good to Jerusalem and to the house of Judah. Do not fear.
translation:
  language: ru
  text: Так Я вновь решил в эти дни делать добро Иерусалиму и дому Иуды. Не бойтесь!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: Так и
  rationale: Сохраняет связь и сопоставление с предшествующим высказыванием, не превращая частицу лишь во временное «теперь».
- source_word: שַׁבְתִּי זָמַמְתִּי
  choice: Я вновь решил
  rationale: שַׁבְתִּי здесь естественно передаёт возобновление или перемену намерения, а זָמַמְתִּי — твёрдо принятое решение; по-русски сочетание передано без тяжеловесного «Я возвратился и замыслил».
- source_word: בַּיָּמִים הָאֵלֶּה
  choice: в эти дни
  rationale: Прямое и естественное соответствие еврейскому временному выражению.
- source_word: לְהֵיטִיב
  choice: благотворить
  rationale: Передаёт активное намерение делать благо, сохраняя возвышенный, но понятный библейский регистр.
- source_word: בֵּית יְהוּדָה
  choice: дому Иуды
  rationale: Сохраняет коллективное обозначение народа или династического сообщества без преждевременного устранения его широты.
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь!
  rationale: Точно передаёт запрет во множественном числе и его ободряющую силу.
theological_decisions:
- issue: Характер Божьего намерения после прежнего суда
  choice: «вновь решил ... благотворить»
  alternative: «возвратился и замыслил делать добро»
  rationale: Формулировка сохраняет заявленную перемену от намерения навести бедствие к намерению принести благо, но не вводит дополнительных догматических объяснений о природе Божьей неизменности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Я» написано с прописной буквы как реплика Бога. Краткие фразы сохраняют уверенный и утешительный тон оригинала.
