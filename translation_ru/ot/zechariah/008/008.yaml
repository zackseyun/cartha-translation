source:
  edition: WLC
  text: וְ/הֵבֵאתִ֣י אֹתָ֔/ם וְ/שָׁכְנ֖וּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָיוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים בֶּ/אֱמֶ֖ת וּ/בִ/צְדָקָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
translation:
  language: ru
  text: Я приведу их, и они будут жить посреди Иерусалима[a]. Они будут Моим народом, а Я буду их Богом — в истине[b] и праведности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «внутри Иерусалима». Еврейское выражение буквально означает «посреди Иерусалима».'
    reason: lexical_alternative
  - marker: b
    text: «В истине» можно также понимать как «в верности» или «верно».
    reason: lexical_alternative
  - marker: c
    text: Слово, переведённое как «праведность», в данном контексте может также означать «справедливость».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Я приведу
  rationale: 'Каузативная форма глагола בוא означает «привести». Контекст говорит о возвращении, однако добавлять «обратно» нет необходимости: этого слова непосредственно в еврейском тексте нет.'
- source_word: וְשָׁכְנוּ
  choice: будут жить
  rationale: Глагол שכן обозначает постоянное проживание или обитание. «Будут жить» естественно для современного русского языка и передаёт устойчивое поселение, не утрачивая смысла контекста.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: посреди Иерусалима
  rationale: Предлог בְּתוֹךְ буквально указывает на пребывание «внутри» или «посреди» чего-либо. «Посреди Иерусалима» сохраняет пространственную выразительность оригинала и его торжественный тон.
- source_word: וְהָיוּ לִי לְעָם
  choice: Они будут Моим народом
  rationale: Сохранена устойчивая формула завета; буквальная конструкция «будут Мне народом» по-русски менее естественна.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: а Я буду их Богом
  rationale: Естественная русская передача второй части формулы завета. Союз «а» ясно обозначает соотнесённость двух сторон, не вводя смыслового противопоставления.
- source_word: בֶּאֱמֶת
  choice: в истине
  rationale: Существительное אֱמֶת может означать истину, верность и надёжность. Формулировка «в истине» сохраняет именную конструкцию и её смысловую многозначность.
- source_word: וּבִצְדָקָה
  choice: и праведности
  rationale: צְדָקָה охватывает значения праведности и справедливости. «Праведность» сохраняет традиционную библейскую лексику и хорошо сочетается с «истиной», а возможное значение «справедливость» отмечено в сноске.
theological_decisions:
- issue: Формула завета
  choice: Сохранить формулировку «Они будут Моим народом, а Я буду их Богом».
  alternative: 'Передать описательно: «они будут принадлежать Мне, а Я буду заботиться о них как их Бог».'
  rationale: В еврейском тексте употреблена устойчивая формула завета. Её сохранение поддерживает межтекстовые связи и не добавляет отсутствующего в оригинале толкования.
- issue: Смысловой охват выражения בֶּאֱמֶת וּבִצְדָקָה
  choice: Передать именной парой «в истине и праведности», не уточняя, относится ли она только к Божьему отношению или ко всему описанному союзу.
  alternative: Истолковать наречно как «верно и справедливо» либо однозначно отнести слова только к тому, каким Бог будет для народа.
  rationale: Синтаксис еврейского текста допускает некоторую широту смыслового охвата. Формальная именная конструкция сохраняет эту богословскую напряжённость и не сужает смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула завета сохранена в узнаваемом виде; архаичные и искусственно буквальные обороты устранены. Тире перед заключительной парой помогает сохранить её открытый смысловой охват.
