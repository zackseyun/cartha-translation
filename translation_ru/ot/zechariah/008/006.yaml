base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Если в те дни это кажется чудом[a] в глазах остатка этого народа, разве и в Моих глазах это будет чудом?» — возвещает Яхве Воинств.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слишком трудным» или «невозможным». Еврейский глагол может обозначать нечто необычайное либо недоступное человеческим силам.'
    reason: Лексическая многозначность формы יִפָּלֵא.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и естественная для современного русского языка формула пророческой речи, сохраняющая торжественную краткость еврейского оборота.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога транслитерацией, а צְבָאוֹת — широким титулом, не ограничивающим его значение только земными армиями.
- source_word: כִּי
  choice: Если
  rationale: В контексте параллельных формулировок вводит условную предпосылку риторического вопроса.
- source_word: יִפָּלֵא
  choice: кажется чудом / будет чудом
  rationale: Корень פלא охватывает необычайное, дивное и недоступное человеческим силам; «чудо» сохраняет смысловую ёмкость, а «кажется» естественно выражает оценочную конструкцию «в глазах» без добавления слова «слишком» в основной текст.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняет еврейский образ и параллелизм между восприятием остатка и Божьей перспективой; оборот понятен по-русски.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: остатку этого народа
  rationale: «Остаток» — точный и закрепившийся пророческий термин для сохранившейся части народа после бедствия и суда.
- source_word: בַּיָּמִים הָהֵם
  choice: в те дни
  rationale: Прямо передаёт множественное число и характерную пророческую временную формулу.
- source_word: גַּם בְּעֵינַי יִפָּלֵא
  choice: то неужели и в Моих глазах это будет чудом?
  rationale: Сохраняет лексический повтор, параллелизм и риторический вопрос с подразумеваемым отрицательным ответом.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: Передаёт торжественную формулу божественного изречения и отличает её от начального «Так говорит».
theological_decisions:
- issue: Смысл риторического вопроса относительно Божьей способности исполнить обещанное
  choice: 'Сохранён риторический вопрос: «неужели и в Моих глазах это будет чудом?»'
  alternative: 'Утвердительное чтение: «и в Моих глазах это будет чудом»'
  rationale: Повтор глагола и частица גַּם в контексте противопоставляют человеческую оценку Божьей; вопрос естественно подразумевает отрицательный ответ, не превращая пояснение в добавленное догматическое утверждение.
- issue: Многозначность יִפָּלֵא
  choice: В основном тексте — «чудом», с пояснением в сноске
  alternative: «слишком трудным» или «невозможным»
  rationale: Так сохраняется связь с необычайным и удивительным, а возможный оттенок недостижимости не устраняется, но честно фиксируется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксис сделан естественным для русского читателя, при этом сохранены повтор ключевого слова, образ «в глазах», термин «остаток» и напряжение риторического вопроса.
