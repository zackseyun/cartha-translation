  naturalness: «Вершите суд истины и мира» — понятная литературная формула с уместно возвышенным наставительным регистром; она естественнее, чем конструкция с дублированными «судите» и «выносите решения». «У ваших ворот» сохраняет исходный образ и поясняется сноской.
