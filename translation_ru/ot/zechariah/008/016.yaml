  text: אֵ֥לֶּה הַ/דְּבָרִ֖ים אֲשֶׁ֣ר תַּֽעֲשׂ֑וּ דַּבְּר֤וּ אֱמֶת֙ אִ֣ישׁ אֶת רֵעֵ֔/הוּ אֱמֶת֙ וּ/מִשְׁפַּ֣ט שָׁל֔וֹם שִׁפְט֖וּ בְּ/שַׁעֲרֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
translation:
  language: ru
  text: 'Вот что вы должны делать: говорите правду друг другу[a]; у ваших ворот[b] вершите суд истины и мира[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорите правду, каждый своему ближнему». В еврейском тексте употреблена форма мужского рода в единственном числе с представительным значением.'
    reason: lexical_alternative
  - marker: b
    text: Городские ворота были обычным местом, где разбирали тяжбы и выносили судебные решения.
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «у ваших ворот вершите истинный и мирный суд».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Вот что
  rationale: В данном контексте דְּבָרִים обозначает предписанные дела, а не только слова; «вот что» естественно вводит перечень повелений.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: вы должны делать
  rationale: Имперфект имеет предписывающую силу; эта формулировка ясно передаёт обязательность и звучит естественно по-русски.
- source_word: דַּבְּרוּ אֱמֶת
  choice: говорите правду
  rationale: Передаёт прямое повеление и этический акцент существительного אֱמֶת без ослабления до общего «говорите честно».
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: друг другу
  rationale: Еврейский представитель­ный оборот буквально означает «каждый своему ближнему» и в контексте взаимных отношений естественно передаётся русским «друг другу»; буквальная форма сохранена в примечании.
- source_word: אֱמֶת וּמִשְׁפַּט שָׁלוֹם
  choice: по истине и … решения, ведущие к миру
  rationale: Формулировка сохраняет оба смысловых центра — истину и мир — и передаёт שָׁלוֹם как характеристику либо результат судебного решения, не сводя его лишь к мягкости или уступчивости.
- source_word: שִׁפְטוּ
  choice: судите … и выносите решения
  rationale: «Судите» сохраняет прямое повеление, а «выносите решения» естественно раскрывает судебное значение в сочетании с מִשְׁפַּט.
- source_word: בְּשַׁעֲרֵיכֶם
  choice: у ваших ворот
  rationale: Сохраняет древний городской образ и одновременно естественнее по-русски обозначает место разбирательства, чем буквальное «в ваших воротах».
theological_decisions:
- issue: Мужской представитель­ный единственный оборот אִישׁ אֶת־רֵעֵהוּ
  choice: друг другу
  alternative: каждый своему ближнему
  rationale: Смысл повеления взаимный и относится ко всем членам общины. Естественная русская формулировка не ограничивает адресатов мужчинами, а буквальная структура отмечена в сноске.
- issue: Значение שָׁלוֹם в судебной формуле
  choice: решения, ведущие к миру
  alternative: истинный и мирный суд
  rationale: שָׁלוֹם может характеризовать решение как мирное либо указывать на его миротворящий результат. Основной текст ясно передаёт связь справедливого суда с общественным миром, а альтернативная грамматическая формулировка дана в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified наставительным тоном. Древний образ городских ворот сохранён, а его общественно-судебное значение пояснено в сноске. Компактность еврейской судебной формулы умеренно раскрыта ради естественности, при этом её возможная альтернативная структура сохранена в примечании.
