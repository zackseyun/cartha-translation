  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Я ревную о Сионе великой ревностью[a] и ревную о ней в великой ярости».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пылаю о Сионе великим рвением». В еврейском тексте глагол и существительное образованы от одного корня, который может выражать как ревность, так и пылкое рвение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יְהוָה передано транслитерацией «Яхве», а צְבָאוֹת — традиционным широким обозначением небесных и земных воинств, без сужения смысла до одних человеческих армий.
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: Я ревную ... великой ревностью
  rationale: Сохранены общий корень глагола и существительного и присущее выражению усиление; «ревную» удерживает напряжение между ревностью и пламенной преданностью в контексте завета.
- source_word: לְצִיּוֹן
  choice: о Сионе
  rationale: При русском глаголе «ревновать» управление «о» естественно передаёт направленную на Сион ревностную заботу и притязание.
- source_word: וְחֵמָה גְדוֹלָה
  choice: в великой ярости
  rationale: חֵמָה обозначает пылающий гнев, ярость; «ярость» передаёт высокую степень интенсивности, усиленную прилагательным גְדוֹלָה.
- source_word: לָהּ
  choice: о нём
  rationale: Местоимение относится к Сиону; в современном русском название «Сион» грамматически мужского рода, поэтому «о нём» звучит естественно, хотя еврейская форма женского рода допускает олицетворение города.
theological_decisions:
- issue: Передача Божьей ревности
  choice: Сохранить прямое выражение «ревную ... великой ревностью».
  alternative: «Пылаю великой ревностью / рвением»
  rationale: Корень קנא допускает оттенки ревности и рвения, но повтор корня и контекст завета требуют не смягчать сильное утверждение о Божьей исключительной и страстной приверженности Сиону.
- issue: Связь ярости с ревностью о Сионе
  choice: Сохранить формулировку «ревную о нём в великой ярости», не уточняя объект ярости.
  alternative: «Из-за него Я исполнен великой ярости»
  rationale: Еврейский текст не называет тех, против кого обращена ярость; перевод сохраняет эту неоднозначность и синтаксическую связь с повторным קִנֵּאתִי.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Формула «Так говорит» и прямая речь сохраняют характер возвещения; лексический повтор намеренно удержан ради еврейского усиления.
