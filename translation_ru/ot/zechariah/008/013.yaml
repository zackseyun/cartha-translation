  source_fidelity: 'Нужна небольшая правка для явного отражения вводной будущей формулы וְהָיָה («И будет») и для более ясного оформления обращения «дом Иуды и дом Израиля». Основные соответствия сохранены: קְלָלָה — «проклятие», אוֹשִׁיעַ — «спасу», בְּרָכָה — «благословение», образ «крепких рук» передан точно.'
