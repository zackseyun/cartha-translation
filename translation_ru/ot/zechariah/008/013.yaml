  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
translation:
  language: ru
  text: 'И будет: как вы, дом Иуды и дом Израиля, были проклятием среди народов[a], так Я спасу[b] вас, и вы станете благословением. Не бойтесь; пусть ваши руки будут крепки[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предметом проклятий» — то есть народом, имя которого употребляли в проклятиях среди народов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавлю». Еврейский глагол может обозначать спасение или избавление в широком смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пусть ваши руки будут крепки». Это еврейский образ мужества и решимости действовать.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: И как
  rationale: 'В данном контексте וְהָיָה вводит предстоящее соответствие между прежним состоянием народа и его будущим обращением к благословению. По-русски конструкция «И как… так…» естественно передаёт сопоставление, не добавляя тяжеловесного «и будет: как».'
- source_word: הֱיִיתֶם קְלָלָה
  choice: вы были проклятием
  rationale: 'Сохраняет прямой образ еврейского существительного קְלָלָה: народ был проклятием либо предметом проклятий. Более разъяснительный оттенок вынесен в примечание.'
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Передаёт положение Иуды и Израиля среди окружающих народов и не вносит более позднего противопоставления «иудеи — язычники».
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  choice: дом Иуды и дом Израиля
  rationale: Сохраняет корпоративное обозначение בֵּית и прямое обращение к обеим общностям.
- source_word: כֵּן
  choice: так
  rationale: Образует естественную русскую пару «как… так…» и подчёркивает обещанное изменение положения народа.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: Я спасу вас
  rationale: Глагол ישׁע в породе hифиль охватывает спасение и избавление. «Спасу» сохраняет широту значения, не ограничивая его только политическим или военным освобождением.
- source_word: וִהְיִיתֶם בְּרָכָה
  choice: и вы станете благословением
  rationale: 'Форма היה здесь обозначает будущий результат и перемену положения: народ, бывший проклятием, станет благословением.'
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь
  rationale: Естественно и точно передаёт стандартный еврейский запрет со значением ободрения.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: пусть руки ваши будут крепки
  rationale: Сохраняет конкретный еврейский образ рук, укреплённых для решительных действий, а переносное значение поясняется в сноске.
theological_decisions:
- issue: Объём значения אוֹשִׁיעַ
  choice: Я спасу вас
  alternative: Я избавлю вас
  rationale: «Спасу» сохраняет широкий смысл Божьего избавления и восстановления, не сводя обещание исключительно к политическому освобождению и не добавляя более поздних богословских уточнений.
- issue: Корпоративная идентичность Иуды и Израиля
  choice: дом Иуды и дом Израиля
  alternative: Иуда и Израиль
  rationale: Слово «дом» сохраняет коллективный, историко-заветный характер обращения и точно отражает повторённое בֵּית.
- issue: Характер будущего состояния народа
  choice: вы станете благословением
  alternative: вы будете благословенны
  rationale: Еврейский текст называет сам народ «благословением», а не просто получателем благословения; выбранный вариант сохраняет эту значимую напряжённость образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическая пара «как… так…» делает противопоставление ясным; традиционные образы «проклятие», «благословение» и «крепкие руки» сохранены без конфессионального истолкования.
