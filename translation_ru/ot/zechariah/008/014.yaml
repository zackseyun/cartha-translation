  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ כַּ/אֲשֶׁ֨ר זָמַמְ֜תִּי לְ/הָרַ֣ע לָ/כֶ֗ם בְּ/הַקְצִ֤יף אֲבֹֽתֵי/כֶם֙ אֹתִ֔/י אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֖א נִחָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств: «Как Я замыслил навести на вас бедствие, когда ваши отцы прогневали Меня[a], — говорит Яхве Воинств, — и Я не изменил Своего решения[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши предки». Буквально: «ваши отцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не передумал», «не отступил от Своего решения»; буквально возможно также: «не раскаялся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционно понятную по-русски форму божественного титула и его смысл, связанный с небесными и земными силами.
- source_word: כִּי כֹה אָמַר
  choice: Ибо так говорит
  rationale: Естественно передаёт причинную связь с контекстом и сохраняет торжественную пророческую формулу.
- source_word: כַּאֲשֶׁר
  choice: Как
  rationale: Вводит сопоставление с последующим обещанием в стихе 15; форма оставляет предложение открытым, как в исходном стихе.
- source_word: זָמַמְתִּי
  choice: Я замыслил
  rationale: Передаёт обдуманное намерение и решимость, выраженные глаголом זמם.
- source_word: לְהָרַע לָכֶם
  choice: навести на вас бедствие
  rationale: В данном контексте обозначает причинение беды как суда, а не совершение Богом нравственного зла.
- source_word: בְּהַקְצִיף ... אֹתִי
  choice: когда ... прогневали Меня
  rationale: 'Передаёт обстоятельственное значение предлога ב и каузативный смысл глагола: отцы вызвали Божий гнев.'
- source_word: אֲבֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет конкретную мужскую форму еврейского текста; по контексту речь идёт о предках адресатов.
- source_word: וְלֹא נִחָמְתִּי
  choice: и не смягчился
  rationale: Выражает отсутствие отказа от назначенного суда, не создавая впечатления нравственного раскаяния Бога.
theological_decisions:
- issue: Смысл לְהָרַע в речи о Божьем суде
  choice: навести на вас бедствие
  alternative: сделать вам зло; причинить вам вред
  rationale: Каузативная форма в контексте означает наведение бедствия или кары. Перевод сохраняет суровость суда, но не приписывает Богу нравственного зла.
- issue: Антропопатическое выражение וְלֹא נִחָמְתִּי
  choice: и не смягчился
  alternative: и не передумал; и не отступил от Своего решения; и не раскаялся
  rationale: Еврейский глагол допускает оттенки сожаления, перемены решения и отказа от действия. В контексте речь о том, что Яхве не отменил задуманный суд; выбранный вариант сохраняет напряжение образного языка без идеи нравственной вины.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Синтаксическая незавершённость в конце сохранена, поскольку конструкция «как… так и…» продолжается в стихе 15. Кавычки обозначают прямую речь Яхве.
