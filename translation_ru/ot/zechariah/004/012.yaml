  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
translation:
  language: ru
  text: 'Тогда я ответил во второй раз и сказал ему: «Что это за две оливковые ветви[a], которые через две золотые трубки[b] изливают из себя золото[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «две кисти маслин» или «два плодоносящих побега маслин». Употреблённое здесь еврейское слово необычно: чаще оно означает «колосья».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «золотых желобков» либо «золотых каналов». Точное устройство этих деталей неизвестно.'
    reason: lexical_alternative
  - marker: c
    text: 'Вероятно, имеется в виду золотистое оливковое масло; буквально по-еврейски: «золото».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן שֵׁנִית
  choice: Тогда я ответил во второй раз
  rationale: Последовательная глагольная форма продолжает повествование, а שֵׁנִית прямо указывает на повторное обращение.
- source_word: וָאֹמַר אֵלָיו
  choice: и сказал ему
  rationale: Сохранено обычное значение глагола «сказать», хотя последующая реплика имеет форму вопроса.
- source_word: שְׁתֵּי שִׁבֲּלֵי הַזֵּיתִים
  choice: две оливковые ветви
  rationale: Редкое в данном контексте שִׁבֲּלֵי обычно обозначает колосья или кисти; в образе маслин естественное «ветви» передаёт отростки, вероятно плодоносящие, не устраняя лексическую трудность, отмеченную в сноске.
- source_word: אֲשֶׁר בְּיַד
  choice: возле
  rationale: Буквально «у руки»; здесь это пространственный оборот со значением «рядом с, возле».
- source_word: שְׁנֵי צַנְתְּרוֹת הַזָּהָב
  choice: двух золотых трубок
  rationale: Редкое צַנְתְּרוֹת обозначает трубчатые каналы или желобки, по которым течёт жидкость. «Трубки» естественно описывает части устройства и сохраняет неопределённость их точной формы.
- source_word: הַמְרִיקִים מֵעֲלֵיהֶם
  choice: из которых они изливают
  rationale: 'Причастие передаёт опорожнение или изливание. Местоименные суффиксы создают трудный образ: ветви выступают источником, а трубки — каналами; русская формулировка передаёт эту механику без тяжёлого буквального «из самих себя».'
- source_word: הַזָּהָב
  choice: золото
  rationale: Еврейский текст буквально называет истекающее вещество «золотом»; вероятный образ золотистого масла не внесён в основной текст.
theological_decisions:
- issue: Что означает «золото» в видении светильника
  choice: Сохранить буквальное «золото» в основном тексте
  alternative: «золотое масло» или «золотистое масло»
  rationale: Видение намеренно образно, и оригинал употребляет существительное «золото». Буквальный образ не следует заменять толкованием; вероятный смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Формулировка остаётся понятной обычному читателю, а необычная образность и лексическая неопределённость оригинала сохранены в тексте и сносках.
