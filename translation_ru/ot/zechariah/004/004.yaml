base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: ru
  text: 'Тогда я ответил и сказал ангелу, говорившему со мной[a]: «Что это, господин мой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беседовавшему со мной». Это еврейское выражение неоднократно встречается у Захарии как обозначение ангела-толкователя, сопровождающего пророка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן
  choice: Тогда я ответил
  rationale: Форма wayyiqtol от ענה вводит ответ в последовательном повествовании; «тогда» естественно передаёт ход рассказа.
- source_word: וָאֹמַר
  choice: и сказал
  rationale: Сохранены оба еврейских глагола — «ответил и сказал», чтобы передать характерную повествовательную формулу оригинала.
- source_word: הַמַּלְאָךְ
  choice: ангелу
  rationale: В контексте видения речь идёт о небесном вестнике, истолковывающем видение пророку.
- source_word: הַדֹּבֵר בִּי
  choice: говорившему со мной
  rationale: Причастная конструкция с בְּ в повторяющейся формуле Захарии обозначает собеседника пророка; «со мной» передаёт контекстуальный смысл без вводящего в заблуждение буквализма «во мне».
- source_word: לֵאמֹר
  choice: отдельно не передано
  rationale: Инфинитив вводит прямую речь; в русском языке после «сказал» эту функцию уже выполняют двоеточие и цитата.
- source_word: מָה אֵלֶּה
  choice: Что это
  rationale: Русское неизменяемое указательное «это» естественно используется в вопросе о нескольких увиденных предметах; добавление слова «предметы» не требуется.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение к ангелу, а не имя или титул Бога. Постпозиция местоимения сохраняет возвышенный библейский тон, оставаясь понятной современному читателю.
theological_decisions:
- issue: Относится ли אֲדֹנִי к Богу или к ангелу-толкователю
  choice: 'Обращение к ангелу: «господин мой» со строчной буквы'
  alternative: Понять как божественный титул «Господь мой»
  rationale: Непосредственный адресат назван ангелом, говорившим с пророком; строчная буква не позволяет ошибочно отождествить почтительное обращение с божественным титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Сохранена двойная формула «ответил и сказал»; обращение «господин мой» намеренно отличается от божественного титула «Господь».
