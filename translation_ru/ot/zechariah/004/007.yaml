base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
translation:
  language: ru
  text: 'Кто ты, великая гора? Перед Зоровавелем ты станешь равниной. И он вынесет завершающий камень[a] под возгласы: «Благодать, благодать ему!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «головной камень»; возможно также: «верхний камень».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Благоволение, благоволение ему!» Еврейское слово также может означать «прелесть» или «красота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר הַגָּדוֹל
  choice: великая гора
  rationale: Сохраняет образ огромного препятствия и прямое обращение без добавления отсутствующей в еврейском звательной частицы.
- source_word: לְמִישֹׁר
  choice: ты станешь равниной
  rationale: Передаёт значение ровной местности и сохраняет образ превращения горы в равнину.
- source_word: וְהוֹצִיא
  choice: и он вынесет
  rationale: Форма хифиль от יצא означает вынести или вывести; подразумеваемым субъектом по контексту является Зоровавель.
- source_word: הָאֶבֶן הָרֹאשָׁה
  choice: верхний камень
  rationale: Еврейское выражение буквально означает «головной камень». В контексте завершения строительства «верхний камень» естественно передаёт архитектурный образ, не устраняя возможность понимания как завершающего камня.
- source_word: תְּשֻׁאוֹת
  choice: под возгласы
  rationale: Передаёт громкие публичные восклицания и естественно звучит в сцене торжественного завершения строительства.
- source_word: חֵן חֵן לָהּ
  choice: «Благодать, благодать ему!»
  rationale: Сохраняет повтор и основное значение חֵן — благодать или благоволение. Местоимение «ему» согласовано по-русски со словом «камень», хотя в еврейском оно женского рода и относится к אֶבֶן.
theological_decisions:
- issue: Смысл חֵן в торжественном возгласе
  choice: над камнем призывается или провозглашается благодать
  alternative: камню приписываются красота или привлекательность
  rationale: חֵן допускает значения благодати, благоволения, прелести и красоты. «Благодать» сохраняет религиозное звучание пророческого контекста, а сноска отмечает реальную лексическую неоднозначность, не закрепляя узкое догматическое толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Синтаксис сохраняет прямое обращение, образ превращения горы и повтор торжественного возгласа.
