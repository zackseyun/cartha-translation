  terminology: Имя «Зоровавель» нормативно. «Благодать, благодать ему!» сохраняет повтор חֵן חֵן и позволяет по-русски отослать местоимением к слову «камень»; это не является утверждением о грамматическом роде еврейского местоимения. Сноска должна прямо отметить, что חֵן также может значить «благоволение» или «красота/прелесть».
