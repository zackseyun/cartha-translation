  verdict: revise
  source_fidelity: 'Основной смысл передан верно: великая гора как препятствие станет равниной перед Зоровавелем, после чего будет вынесен/предъявлен головной (вероятно завершающий) камень под повторяемые возгласы חֵן. Однако сочетание «вынесет верхний камень» в современном русском звучит неестественно и неясно в строительном контексте; «завершающий камень» точнее передаёт наиболее вероятную функцию האבן הראשׁה, при сохранении буквального варианта в сноске.'
