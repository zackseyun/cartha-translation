  text: וַ/יַּ֜עַן וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר זֶ֚ה דְּבַר יְהוָ֔ה אֶל זְרֻבָּבֶ֖ל לֵ/אמֹ֑ר לֹ֤א בְ/חַ֨יִל֙ וְ/לֹ֣א בְ/כֹ֔חַ כִּ֣י אִם בְּ/רוּחִ֔/י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
translation:
  language: ru
  text: 'Тогда он ответил мне: «Вот слово Яхве к Зоровавелю: „Не мощью[a] и не силой, но Моим Духом“, — говорит Яхве Воинств[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не войском» либо «не военной силой»; еврейское слово חַיִל может обозначать также войско и военную мощь.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Господь Саваоф». Буквально титул означает «Яхве Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Тогда он ответил мне
  rationale: Естественно передаёт последовательность повествования и вводную формулу речи, не воспроизводя избыточно еврейское «сказал… говоря».
- source_word: זֶה דְבַר יְהוָה
  choice: Вот слово Яхве
  rationale: «Слово» сохраняет пророческую формулу и межтекстовые связи; «вот» естественно вводит содержание вести.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֶל זְרֻבָּבֶל
  choice: к Зоровавелю
  rationale: Предлог אֶל указывает на адресата пророческого слова.
- source_word: לֹא בְחַיִל
  choice: Не мощью
  rationale: חַיִל охватывает значения мощи, ресурсов и военной силы. «Мощь» сохраняет широту значения, а военный оттенок отмечен в сноске.
- source_word: וְלֹא בְכֹחַ
  choice: и не силой
  rationale: כֹּחַ означает силу или способность; формулировка сохраняет параллелизм оригинала.
- source_word: כִּי אִם בְרוּחִי
  choice: но Моим Духом
  rationale: Конструкция כִּי אִם выражает резкое противопоставление, а одинаковая инструментальная форма сохранена. Заглавная буква указывает на Дух Яхве, не устраняя лексическую многозначность самого רוּחַ.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: говорит Яхве Воинств
  rationale: «Говорит» естественно передаёт пророческую формулу; «Воинств» прозрачно переводит צְבָאוֹת и сохраняет образ небесных и земных сил.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Передача בְרוּחִי
  choice: Моим Духом
  alternative: моим духом / Моим дыханием
  rationale: Контекст противопоставляет человеческой мощи действенное присутствие и силу Яхве. «Дух» наиболее уместен, при этом исходная многозначность רוּחַ признаётся.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Выбран смысловой перевод צְבָאוֹת вместо малопонятной современной аудитории традиционной транслитерации «Саваоф».
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой формулой. Сохранены параллелизм отрицаний, инструментальное значение предлога и личное имя Яхве; архаизм «Саваоф» вынесен в сноску.
