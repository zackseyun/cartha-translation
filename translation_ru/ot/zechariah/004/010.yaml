base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
translation:
  language: ru
  text: Ибо кто презрел день малого? И возрадуются и увидят камень-отвес[a] в руке Зоровавеля эти семь — очи Яхве, обходящие всю землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оловянный камень»; традиционно: «отвес». Еврейское слово может означать олово, но в данном строительном контексте, вероятно, имеется в виду груз отвеса или мерительный камень.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז
  choice: презрел
  rationale: Глагол выражает пренебрежение чем-либо как малым и незначительным; «презрел» сохраняет силу риторического вопроса и соответствует возвышенному, но понятному регистру.
- source_word: לְיוֹם קְטַנּוֹת
  choice: день малого
  rationale: Буквально выражение означает «день малостей/малого». Формулировка «день малого» сохраняет образ и не сужает его до «малых начинаний», хотя контекст допускает такой смысл.
- source_word: וְשָׂמְחוּ וְרָאוּ
  choice: возрадуются и увидят
  rationale: Оба координированных глагола переданы явно и как будущие по контексту. Их подлежащее — постпозитивное «эти семь».
- source_word: הָאֶבֶן הַבְּדִיל
  choice: камень-отвес
  rationale: בְּדִיל обычно обозначает олово, однако в контексте строительства сочетание, вероятнее всего, называет отвесный груз или мерительный камень. Дефисная форма сохраняет предметный образ камня и ясно передаёт его функцию.
- source_word: בְּיַד זְרֻבָּבֶל
  choice: в руке Зоровавеля
  rationale: Прямая передача еврейского оборота с акцентом на видимый знак в руке строителя.
- source_word: שִׁבְעָה אֵלֶּה
  choice: эти семь
  rationale: Сохраняется намеренно неполное указание исходного текста и его связь с последующим объяснением; добавление «глаз» или «светильников» раньше времени устранило бы образную неоднозначность.
- source_word: עֵינֵי יְהוָה
  choice: очи Яхве
  rationale: «Очи» естественно для возвышенной библейской образности и сохраняет символическое выражение; личное имя יהוה передано транслитерацией «Яхве».
- source_word: מְשׁוֹטְטִים בְּכָל הָאָרֶץ
  choice: обозревающие всю землю
  rationale: Причастие обозначает активное движение повсюду; в отношении глаз русское «обозревающие» естественно выражает всеохватное наблюдение, не вводя дополнительного толкования.
theological_decisions:
- issue: Кого обозначают «эти семь»
  choice: Последующая фраза отождествляет «эти семь» с очами Яхве.
  alternative: «Эти семь» могут отсылать к семи светильникам видения, которые затем символически названы очами Яхве.
  rationale: 'Еврейский порядок слов естественно допускает приложение: «эти семь — очи Яхве». Перевод сохраняет символическую связь, не уточняя сверх текста, являются ли непосредственным референтом семь светильников.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («возрадуются», «очи»). Синтаксис сделан ясным, но необычное «эти семь» сохранено ради образной и референциальной неоднозначности оригинала.
