  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
translation:
  language: ru
  text: 'Тогда он сказал мне: «Разве ты не знаешь, что это?» Я сказал: «Нет, господин мой».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сударь». Еврейское אֲדֹנִי — почтительное обращение со значением «мой господин»; здесь оно относится к собеседнику пророка в видении, а не является Божественным именем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Тогда он сказал мне
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность. Инфинитив לֵאמֹר отдельно не выражен, поскольку его вводную функцию выполняет прямая речь.
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Разве ты не знаешь
  rationale: Сочетание вопросительной частицы с отрицанием образует риторический вопрос, предполагающий утвердительный ответ; русское «разве… не» сохраняет его форму и оттенок ожидания.
- source_word: מָה אֵלֶּה
  choice: что это
  rationale: В современном русском указательное «это» естественно употребляется и при указании на несколько предметов; перевод сохраняет вопрос об их сущности или значении, не уточняя его искусственно.
- source_word: וָאֹמַר לֹא
  choice: 'Я ответил: «Нет»'
  rationale: Глагол буквально означает «сказал», но в обмене репликами «ответил» естественно выражает его функцию. Краткое «нет» сохраняет эллиптический ответ оригинала.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение к собеседнику в видении, а не Божественное имя. Порядок слов сохраняет возвышенный библейский регистр, оставаясь понятным современному читателю.
theological_decisions:
- issue: Следует ли понимать אֲדֹנִי как обращение к Богу или как почтительное обращение к посреднику видения
  choice: господин мой
  alternative: Господь / сударь
  rationale: По контексту Захария обращается к истолковывающему вестнику. Строчная буква и сноска предотвращают отождествление этого обращения с Божественным именем, а буквальный почтительный оттенок сохраняется.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Риторическая форма вопроса и краткость ответа сохранены; неоднозначность того, спрашивается ли о природе или значении увиденного, не устранена.
