  text: יְדֵ֣י זְרֻבָּבֶ֗ל יִסְּד֛וּ הַ/בַּ֥יִת הַ/זֶּ֖ה וְ/יָדָ֣י/ו תְּבַצַּ֑עְנָה וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/009.yaml
  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
translation:
  language: ru
  text: Руки Зоровавеля заложили основание этого дома[a], и его руки завершат его. Тогда ты узнаешь, что Яхве Воинств[b] послал меня к вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «этим домом» подразумевается храм.
    reason: cultural_note
  - marker: b
    text: 'Или, в традиционной передаче титула: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵי זְרֻבָּבֶל
  choice: Руки Зоровавеля
  rationale: Сохранено множественное число и подчеркнутое в еврейском тексте указание на личное участие Зоровавеля.
- source_word: יִסְּדוּ
  choice: заложили основание
  rationale: В контексте строительства храма глагол יסד означает закладку основания; русское выражение передаёт этот конкретный строительный смысл.
- source_word: הַבַּיִת הַזֶּה
  choice: этого дома
  rationale: Буквальное значение בַּיִת — «дом». Контекстуальное указание на храм вынесено в примечание, чтобы сохранить образ дома.
- source_word: וְיָדָיו תְּבַצַּעְנָה
  choice: и его руки завершат его
  rationale: Повтор слова «руки» сохранён ради смысловой связи между началом и завершением строительства; местоимение «его» относится к дому.
- source_word: וְיָדַעְתָּ
  choice: Тогда ты узнаешь
  rationale: Форма второго лица единственного числа передана словом «ты», а союз истолкован в естественном для пророческой речи значении последующего результата.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צְבָאוֹת переведено по смыслу как «Воинств», сохраняя титул Бога как Повелителя небесных и земных сил.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Совершённое действие передано естественной русской формой прошедшего времени; полномочия посланника остаются значимыми в момент исполнения знамения.
- source_word: אֲלֵיכֶם
  choice: к вам
  rationale: Сохранено множественное число местоимения, заметно отличающееся от предшествующего обращения «ты».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф
  rationale: Перевод «Воинств» раскрывает значение еврейского слова современному читателю, тогда как традиционная форма приведена в примечании.
- issue: Смена числа адресата
  choice: «ты узнаешь» и «к вам»
  alternative: Унифицировать обращение во множественном числе
  rationale: Еврейский текст намеренно или стилистически переходит от единственного числа וְיָדַעְתָּ к множественному אֲלֵיכֶם; перевод сохраняет эту грамматическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «руки» и переход от единственного «ты» к множественному «вам» сохранены вслед за еврейским текстом.
