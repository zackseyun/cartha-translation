base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: ru
  text: 'И он сказал мне: «Что ты видишь?» Я ответил: «Вижу: вот светильник, весь золотой; наверху его — чаша, на нём — семь ламп и семь и семь трубочек[a] для ламп, которые находятся наверху его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «семь и семь». Возможны разные понимания, в том числе: семь трубочек для каждой из семи ламп.'
    reason: Сохраняет необычную числовую формулировку оригинала в основном тексте и кратко отмечает вероятное распределительное толкование, не навязывая его.
lexical_decisions:
- source_word: מְנוֹרַת
  choice: светильник
  rationale: Обозначает подставку с лампами; «светильник» естественно передаёт предмет целиком и сохраняет связь с семью отдельными лампами.
- source_word: גֻלָּהּ
  choice: чаша
  rationale: В данном устройстве это находящийся сверху резервуар чашеобразной формы; нейтральное «чаша» не уточняет сверх текста её функцию.
- source_word: מוּצָקוֹת
  choice: желобков
  rationale: Редкое слово в этом контексте понимается как каналы или проводники подачи масла. «Желобки» сохраняет предметность образа, не вводя современную техническую терминологию.
- source_word: שִׁבְעָה וְשִׁבְעָה
  choice: по семь
  rationale: Буквально «семь и семь»; конструкция, вероятнее всего, распределяет семь каналов к каждой из семи ламп, однако текстовая формулировка необычна, поэтому неоднозначность отмечена в сноске.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт указательно-восклицательную функцию формулы видения естественным современным русским языком.
theological_decisions:
- issue: Число каналов при лампах
  choice: по семь желобков к лампам
  alternative: семь и семь желобков для ламп / семь желобков для семи ламп
  rationale: Сохранено наиболее прямое распределительное понимание повторения «семь и семь», без попытки объяснить символику или гармонизировать устройство светильника.
translation_notes:
  register: Современный литературный русский с достоинством пророческого видения. Синтаксис сделан ясным, но повтор формулы «я вижу — вот» сохранён в естественной форме. Термины не привязаны к поздней культовой или конфессиональной интерпретации.
