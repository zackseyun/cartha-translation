  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/008.yaml
  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: ru
  text: 'И было ко мне слово Яхве[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское: «YHWH»; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Вав с имперфектом глагола היה отмечает новое развитие повествования; в устойчивой пророческой формуле по-русски естественно «И было ко мне слово…».
- source_word: דְבַר
  choice: слово
  rationale: В сочетании דְבַר יְהוָה это традиционная пророческая формула, обозначающая конкретное Божье обращение; «весть» возможно, но хуже сохраняет повторяющуюся библейскую формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямое и естественное соответствие предлогу אֶל с суффиксом первого лица единственного числа.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском двоеточие естественно выполняет эту функцию и позволяет избежать тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога — тетраграмматон YHWH. Форма «Яхве» сохраняет имя и не подменяет его титулом; примечание сообщает читателю о традиционной передаче.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой пророческой формулы. Инверсия «было ко мне слово» слегка возвышенна, но ясна и соответствует библейскому регистру; לֵאמֹר передано пунктуационно, поскольку далее следует содержание речи.
