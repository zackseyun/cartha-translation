  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
translation:
  language: ru
  text: 'И две маслины стояли рядом с ней[a]: одна справа от чаши[b], другая слева от неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на ней» / «над ней». Еврейский предлог имеет более широкий пространственный смысл, но дальнейшее указание на правую и левую стороны говорит в пользу значения «рядом с ней».'
    reason: lexical_alternative
  - marker: b
    text: То есть чаша — это чашеобразный сосуд для масла в видении светильника.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם
  choice: И две
  rationale: Союз продолжает описание видения, а числительное прямо сохраняет указание на два дерева.
- source_word: זֵיתִים
  choice: маслины
  rationale: В данном пространственном описании речь идёт о масличных деревьях; современное русское «маслины» естественно передаёт этот смысл.
- source_word: עָלֶיהָ
  choice: стояли рядом с ней
  rationale: Предлог עַל допускает широкий круг пространственных значений. Последующее расположение справа и слева указывает на близость; добавлен нейтральный глагол «стояли», необходимый для естественной русской фразы.
- source_word: אֶחָד
  choice: одна
  rationale: 'Распределительное употребление: одно дерево с одной стороны; женский род согласован с существительным «маслина».'
- source_word: מִ/ימִין הַ/גֻּלָּה
  choice: справа от чаши
  rationale: Точно и естественно обозначает положение одного дерева относительно чашеобразного сосуда.
- source_word: וְ/אֶחָד עַל שְׂמֹאלָהּ
  choice: другая слева от неё
  rationale: Русская парная конструкция «одна… другая…» ясно передаёт еврейское «одна… и одна…» и сохраняет симметрию расположения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-возвышенное. Местоимение «ней» в основном тексте сохраняет женский род еврейского указания, вероятнее всего относящегося к ранее упомянутому светильнику; слово «чаша» вводится лишь там, где оно прямо стоит в еврейском тексте.
