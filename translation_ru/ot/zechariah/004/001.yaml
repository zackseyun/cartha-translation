  text: Then the angel who was speaking with me returned and woke me[a], like a man who is awakened from his sleep.
translation:
  language: ru
  text: И ангел, говоривший со мной, вернулся и разбудил меня, словно человека, которого пробуждают ото сна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно человека, пробуждающегося ото сна». Еврейский глагол допускает как пассивный, так и возвратный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שׁוב обычно означает возвращение или поворот назад; здесь «вернулся» естественно передаёт возобновление ангелом общения с пророком, не уточняя того, чего исходный текст не сообщает.
- source_word: הַמַּלְאָךְ
  choice: ангел
  rationale: Хотя מַלְאָךְ может означать «вестник», в контексте пророческого видения речь идёт о небесном посреднике, поэтому современное русское «ангел» наиболее ясно и уместно.
- source_word: הַדֹּבֵר בִּי
  choice: говоривший со мной
  rationale: Причастная конструкция характеризует ангела как собеседника пророка; «говоривший со мной» естественно передаёт продолжительный характер действия и значение предлога.
- source_word: וַיְעִירֵנִי
  choice: разбудил меня
  rationale: Порода hифиль указывает на побуждение к пробуждению. «Разбудил меня» — точное и естественное выражение на современном русском языке.
- source_word: כְּאִישׁ
  choice: словно человека
  rationale: Сравнение относится к самому пророку как к человеку, которого будят; винительный падеж естественно связан с предшествующим «разбудил меня».
- source_word: אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  choice: которого пробуждают ото сна
  rationale: Форма нифаль допускает пассивно-возвратное понимание. Основной текст сохраняет пассивный оттенок и параллель с предшествующим каузативным глаголом, а возвратное прочтение отмечено в сноске.
