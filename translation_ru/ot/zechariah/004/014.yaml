  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: повествовательное «И он сказал», указательную конструкцию «Это два», намеренно необычный образ «два сына елея», причастное определение «стоящие» и титул «Владыка всей земли». «Елей» уместно передаёт יִצְהָר в возвышенном библейском контексте, не устраняя метафору через интерпретацию «помазанники».'
