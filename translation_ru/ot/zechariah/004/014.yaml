source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֵ֖לֶּה שְׁנֵ֣י בְנֵֽי הַ/יִּצְהָ֑ר הָ/עֹמְדִ֖ים עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
translation:
  language: ru
  text: 'И он сказал: «Это два сына елея[a], стоящие при Владыке всей земли[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «два помазанника». Буквально: «два сына свежего масла».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стоящие пред Владыкой всей земли».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Стандартная повествовательная форма wayyiqtol от אמר; передаёт последовательность речи без добавочной интерпретации.
- source_word: אֵלֶּה שְׁנֵי
  choice: Это два
  rationale: Множественное указательное местоимение с подразумеваемой связкой; по-русски естественно передаётся конструкцией «это два».
- source_word: בְּנֵי הַיִּצְהָר
  choice: два сына елея
  rationale: Сохраняет необычную еврейскую метафору «сыны масла/елея» и не подменяет её сразу толкованием «помазанники». Слово יִצְהָר обозначает свежее, прежде всего оливковое, масло; «елей» позволяет передать образ кратко и в достойном регистре.
- source_word: הָעֹמְדִים עַל
  choice: стоящие при
  rationale: В сочетании со стоянием перед владыкой предлог עַל может обозначать положение рядом и служение в его присутствии. Русское «стоящие при» передаёт эту придворно-служебную окраску.
- source_word: אֲדוֹן
  choice: Владыке
  rationale: Титул означает господина или владыку. «Владыка» естественно выражает верховную власть в данном возвышенном контексте, не смешивая этот титул с передачей имени Бога.
- source_word: כָּל הָאָרֶץ
  choice: всей земли
  rationale: Передаёт всеобщий охват владычества; формулировка естественна для современного литературного русского языка.
theological_decisions:
- issue: Толкование בְּנֵי הַיִּצְהָר
  choice: Сохранить в основном тексте метафору «два сына елея».
  alternative: два помазанника
  rationale: В еврейском тексте стоит не обычное слово «помазанники», а буквальное и намеренно образное выражение «сыны елея». Его сохранение не навязывает более узкое отождествление двух фигур; распространённое толкование указано в сноске.
- issue: Значение עַל при הָעֹמְדִים
  choice: стоящие при Владыке
  alternative: стоящие пред Владыкой
  rationale: «При» передаёт близость и служебное присутствие возле верховного правителя, тогда как «пред» сильнее подчёркивает нахождение перед ним. Оба оттенка допустимы, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Необычный исходный образ намеренно сохранён; «елей» выбрано как краткое и стилистически уместное обозначение оливкового масла. Маркеры сносок поставлены непосредственно после выражений, к которым относятся.
