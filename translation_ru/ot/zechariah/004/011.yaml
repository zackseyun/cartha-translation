  text: Then I answered and said to him[a], “What are these two olive trees on the right of the lampstand and on its left?”
translation:
  language: ru
  text: 'Тогда я ответил и сказал ему: «Что это за два масличных дерева справа от светильника и слева от него?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: Тогда я ответил и сказал
  rationale: Сохранена последовательная повествовательная конструкция с обычной еврейской формулой «ответил и сказал»; «тогда» естественно передаёт развитие повествования.
- source_word: אֵלָיו
  choice: ему
  rationale: Сохранено местоимение оригинала без внесения в текст подразумеваемого из контекста существительного.
- source_word: מַה שְּׁנֵי הַזֵּיתִים הָאֵלֶּה
  choice: Что это за две маслины
  rationale: Русская вопросительная конструкция естественно передаёт вопрос о значении или сущности увиденных деревьев; זֵיתִים обозначает масличные деревья, а не ветви.
- source_word: עַל יְמִין הַמְּנוֹרָה וְעַל שְׂמֹאולָהּ
  choice: справа от светильника и слева от него
  rationale: Передано пространственное расположение по обе стороны светильника без неестественного буквального «на правой стороне»; местоимение относится к светильнику.
- source_word: הַמְּנוֹרָה
  choice: светильника
  rationale: מְנוֹרָה — подставка для ламп; традиционное и понятное русское «светильник» здесь обозначает многоламповый храмовый предмет и не требует транслитерации «менора».
