base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
translation:
  language: ru
  text: 'Тогда ангел, говоривший со мной[a], ответил и сказал мне: «Разве ты не знаешь, что это?» Я сказал: «Нет, господин мой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беседовавший со мной». Еврейский оборот описывает ангела, который продолжает беседу с Захарией.'
    reason: lexical_alternative
  - marker: b
    text: То есть уважительное обращение к ангелу; здесь еврейское слово «господин» не относится к Господу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: В повествовательной формуле ענה означает «ответить»; по-русски нет необходимости отдельно передавать следующее ויאמר («и сказал»), поскольку естественная конструкция «ответил мне» уже вводит прямую речь.
- source_word: הַמַּלְאָךְ
  choice: ангел
  rationale: Хотя מַלְאָךְ может означать «вестник», в видении Захарии это небесный истолкователь.
- source_word: הַדֹּבֵר בִּי
  choice: говоривший со мной
  rationale: Причастие и оборот с בְ описывают ангела как собеседника Захарии; несовершенный вид передаёт продолжающееся общение.
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Разве ты не знаешь
  rationale: «Разве… не» естественно передаёт форму и риторический оттенок отрицательного вопроса, не усиливая его до утверждения.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: что это
  rationale: Естественная русская формулировка вопроса об увиденных предметах; собирательное «это» не уточняет их природу сверх еврейского текста.
- source_word: לֹא
  choice: Нет
  rationale: Сохраняет краткий отрицательный ответ оригинала без добавления подразумеваемого «не знаю».
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Сохраняет уважительное обращение к ангелу и не отождествляет его с Господом; порядок слов придаёт обращению достоинство и соответствует библейскому контексту.
theological_decisions:
- issue: К кому относится אֲדֹנִי и какова сила обращения
  choice: 'уважительное обращение к ангелу: «господин мой»'
  alternative: «господин»; «мой господин»
  rationale: Здесь Захария обращается к беседующему с ним ангелу, а не к Яхве. Строчная буква и примечание предотвращают ошибочное понимание как божественного титула.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис диалога упрощён естественным для русского объединением «ответил и сказал» в «ответил мне», при сохранении всех смысловых компонентов.
