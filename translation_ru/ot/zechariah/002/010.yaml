base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
translation:
  language: ru
  text: Эй! Эй! Бегите из северной страны, — возвещает Яхве, — ибо Я рассеял вас по четырём небесным ветрам[a], — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я рассеял вас, словно четыре ветра небесные». Еврейское выражение можно понимать как сравнение («словно четыре ветра небесные»); в контексте рассеяния возможно и направительное понимание: «по четырём небесным ветрам».'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי הוֹי
  choice: Эй! Эй!
  rationale: В данном контексте повторённое междометие служит настойчивым призывом к вниманию и немедленному действию, а не выражением скорби. «Эй! Эй!» естественно передаёт этот оклик по-русски.
- source_word: וְנֻסוּ
  choice: Бегите
  rationale: Форма повелительного наклонения множественного числа от נוּס требует немедленного бегства; «бегите» ясно и непосредственно передаёт приказ.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: из северной страны
  rationale: Перевод сохраняет еврейскую конструкцию и её географическое и богословское звучание, оставаясь естественным для современного русского языка.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана торжественно и понятно; личное имя יהוה транслитерировано как «Яхве».
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для повеления; «ведь» естественно связывает обе части высказывания.
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: по четырём ветрам небесным
  rationale: Контекст рассеяния допускает направительное понимание выражения как распространения во все стороны. Подлинная неоднозначность приставки כ отмечена в сноске.
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  choice: Я рассеял вас
  rationale: Глагол буквально связан с растягиванием или распространением; в отношении людей «рассеял» естественно выражает их рассредоточение, не устраняя образ распространения по сторонам света.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет Тетраграмматон как личное имя; «Яхве» сохраняет его явное присутствие в тексте.
- issue: Характер рассеяния в כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: по четырём ветрам небесным
  alternative: словно четыре ветра небесных
  rationale: Направительное прочтение хорошо соответствует контексту рассеяния, однако сравнительное значение приставки כ грамматически возможно и потому сохранено в сноске, без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Повтор междометия и дважды повторённая формула «возвещает Яхве» сохранены; синтаксис сделан ясным без устранения неоднозначности исходного выражения.
