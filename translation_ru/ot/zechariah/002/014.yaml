  text: רָנִּ֥י וְ/שִׂמְחִ֖י בַּת צִיּ֑וֹן כִּ֧י הִנְ/נִי בָ֛א וְ/שָׁכַנְתִּ֥י בְ/תוֹכֵ֖/ךְ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/014.yaml
  text: Sing for joy and rejoice[a], daughter Zion, for behold, I am coming, and I will dwell in your midst[c][b], declares Yahweh.
translation:
  language: ru
  text: Ликуй и радуйся, дочь Сиона[a], ведь вот, Я прихожу и поселюсь среди тебя, — возвещает Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дочь Сиона» — поэтическое олицетворение Сиона, то есть Иерусалима и его жителей.
    reason: cultural_note
  - marker: b
    text: В еврейском тексте — יהוה (ЙХВХ), личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: רָנִּי
  choice: Ликуй
  rationale: Повелительная форма от רנן призывает громко выразить торжественную радость; «ликуй» естественно и ёмко передаёт этот смысл по-русски.
- source_word: וְשִׂמְחִי
  choice: и радуйся
  rationale: Повелительная форма от שמח дополняет призыв к ликованию и сохраняет два параллельных глагола исходного текста.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохраняет поэтическое олицетворение Сиона/Иерусалима и грамматически объясняет женский род обращённых императивов и местоимения.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для призыва и звучит естественнее в современном русском, чем более книжное «ибо».
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Передаёт указательно-эмфатическую формулу «вот Я / вот, Я здесь», привлекающую внимание к приближению говорящего.
- source_word: בָא
  choice: иду
  rationale: Причастие после הִנְנִי изображает актуальное или близкое действие; «Я иду» естественно передаёт движение к Сиону, не уточняя сроки сверх текста.
- source_word: וְשָׁכַנְתִּי
  choice: и буду жить
  rationale: שכן означает поселиться или обитать. «Буду жить» понятно современному читателю и сохраняет устойчивое пребывание Бога среди народа без искусственно архаичного оттенка.
- source_word: בְתוֹכֵךְ
  choice: среди тебя
  rationale: Суффикс женского рода единственного числа относится к олицетворённому Сиону; выражение сохраняет это обращение и допускает коллективный смысл — среди его жителей.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и сохраняет личное имя יהוה в транслитерации.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» позволяет отличить личное имя от титула, а традиционная передача указана в примечании.
- issue: Образ Божьего пребывания на Сионе
  choice: буду жить среди тебя
  alternative: буду обитать посреди тебя
  rationale: Формулировка сохраняет тему реального Божьего присутствия, но не конкретизирует способ исполнения пророчества и не привносит более поздних богословских толкований.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены параллельные повеления и женский род обращения; архаизмы «возликуй», «ибо» и «обитать посреди» не использованы ради ясности.
