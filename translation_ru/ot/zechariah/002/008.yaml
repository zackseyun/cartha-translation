  text: וַ/יֹּ֣אמֶר אֵלָ֔/ו רֻ֗ץ דַּבֵּ֛ר אֶל הַ/נַּ֥עַר הַלָּ֖ז לֵ/אמֹ֑ר פְּרָזוֹת֙ תֵּשֵׁ֣ב יְרוּשָׁלִַ֔ם מֵ/רֹ֥ב אָדָ֛ם וּ/בְהֵמָ֖ה בְּ/תוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
translation:
  language: ru
  text: 'И он сказал ему: «Беги, скажи тому юноше: „Иерусалим будет заселён, как неограждённые стенами селения[a], из-за множества людей[b] и скота в нём“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иерусалим будет жить на открытом пространстве»; еврейское выражение обозначает открытые, не окружённые стенами селения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово стоит в единственном числе, но здесь имеет собирательное значение: человеческое население; буквально: «человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻץ
  choice: Беги
  rationale: Повелительная форма передаёт прямое и энергичное указание быстро отправиться к юноше; «поспеши» возможно, но менее буквально.
- source_word: דַּבֵּר
  choice: скажи
  rationale: В данном контексте естественно передаёт повеление обратиться к юноше с последующим сообщением; буквальное «говори» по-русски звучало бы менее естественно.
- source_word: הַנַּעַר הַלָּז
  choice: тому юноше
  rationale: נַעַר обозначает молодого мужчину или юношу, а указательное הַלָּז сохранено словом «тому».
- source_word: פְּרָזוֹת
  choice: как селения без стен
  rationale: Множественное число обозначает открытые, не окружённые стенами поселения. Формулировка сохраняет образ разросшегося Иерусалима, который не вмещается в укреплённые границы.
- source_word: תֵּשֵׁב
  choice: будет жить
  rationale: Форма от ישב выражает пребывание и оседлую жизнь. «Будет жить» сохраняет активную конструкцию оригинала, не заменяя её пассивным «будет населён».
- source_word: מֵרֹב
  choice: из-за множества
  rationale: 'Предлог מִן при רֹב здесь выражает причину: открытый характер поселения обусловлен многочисленностью населения и скота.'
- source_word: אָדָם
  choice: людей
  rationale: Существительное употреблено собирательно и противопоставлено скоту; русское «людей» естественно обозначает человеческое население, сохраняя это противопоставление.
- source_word: וּבְהֵמָה
  choice: и скота
  rationale: בְּהֵמָה здесь имеет собирательное значение домашних животных; «скот» точнее в контексте населения поселения, чем общее «животные».
- source_word: בְּתוֹכָהּ
  choice: в нём
  rationale: Местоимение относится к Иерусалиму. В русском языке название города грамматически мужского рода, поэтому естественно «в нём», без искусственного сохранения женского рода еврейского местоимения.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: людей
  alternative: человека / рода человеческого
  rationale: Здесь речь идёт о многочисленном человеческом населении в противопоставлении скоту. «Людей» передаёт собирательный смысл естественным современным русским языком и не добавляет богословского толкования.
- issue: Образ Иерусалима как открытого поселения
  choice: будет жить, как селения без стен
  alternative: будет жить на открытом месте / будет населён как неукреплённые селения
  rationale: Перевод сохраняет множественный образ פְרָזוֹת и связь с отсутствием городских стен, не уточняя сверх текста, идёт ли речь главным образом о пространственном разрастании или о безопасности без укреплений.
translation_notes:
  register: Современный литературный русский язык с краткой, энергичной прямой речью. Синтаксис сохраняет последовательность повелений и вложенную цитату оригинала; архаизмы и конфессионально окрашенная терминология не используются.
