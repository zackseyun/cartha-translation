source:
  edition: WLC
  text: וְ/נָחַ֨ל יְהוָ֤ה אֶת יְהוּדָה֙ חֶלְק֔/וֹ עַ֖ל אַדְמַ֣ת הַ/קֹּ֑דֶשׁ וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
translation:
  language: ru
  text: И Яхве унаследует Иуду как Свою долю[a] на святой земле[b] и вновь изберёт Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмёт Иуду Себе в наследие». В еврейском тексте сохранён образ наследования, а не употреблён общий глагол со значением владения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на земле святости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל
  choice: И унаследует
  rationale: Глагол נחל в породе qal означает получение или обладание наследием. «Унаследует» сохраняет необычный для этого контекста образ наследования; соединительный ו передан союзом «и».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֶת יְהוּדָה
  choice: Иуду
  rationale: Прямое дополнение с собственным именем; форма винительного падежа естественна после переходного глагола.
- source_word: חֶלְקוֹ
  choice: как Свою долю
  rationale: חֵלֶק обозначает долю, часть или удел. Слово «доля» сохраняет образ распределённого владения, а конструкция с «как» делает русскую фразу ясной.
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  choice: на святой земле
  rationale: Буквально выражение означает «на земле/почве святости». Естественное русское «на святой земле» передаёт и территориальный смысл, и её освящённый статус.
- source_word: וּבָחַר
  choice: и изберёт
  rationale: בחר означает «выбирать, избирать». «Изберёт» уместно для торжественного пророческого контекста; подлежащим остаётся Яхве.
- source_word: עוֹד
  choice: вновь
  rationale: 'В контексте восстановления עוֹד указывает на повторное действие: Яхве снова изберёт Иерусалим.'
- source_word: בִּירוּשָׁלָם
  choice: Иерусалим
  rationale: Собственное имя передано в общепринятой русской форме.
theological_decisions:
- issue: Язык наследования применительно к Иуде как владению Яхве
  choice: 'Сохранено: «Яхве унаследует Иуду как Свою долю»'
  alternative: «Яхве возьмёт Иуду Себе во владение»
  rationale: Еврейский текст намеренно использует язык наследия и удела, хотя обычно говорится о наследовании земли Израилем. Необычная формулировка сохраняет напряжение образа взаимной принадлежности Яхве, Иуды и земли.
- issue: Значение אַדְמַת הַקֹּדֶשׁ
  choice: «на святой земле»
  alternative: «на земле святости» или «на святой почве»
  rationale: Речь идёт о земле в её освящённом статусе, а не просто об отдельном участке почвы. Выбранная формулировка естественна по-русски и не добавляет к исходному тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Необычный глагол «унаследует» оставлен намеренно ради образности оригинала; сноска поясняет более естественную альтернативу.
