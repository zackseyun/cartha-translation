  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
translation:
  language: ru
  text: И в тот день многие народы присоединятся к ГОСПОДУ и станут моим народом. Я буду обитать среди тебя, и ты узнаешь, что ГОСПОДЬ Воинств послал меня к тебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Говорящий произносит: «ГОСПОДЬ Воинств послал меня к тебе». В еврейском тексте прямо не сказано, кто именно назван словом «меня».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִלְווּ
  choice: присоединятся
  rationale: Нифаль глагола לוה здесь передаёт присоединение или вступление в союз; возвратный оттенок естественно выражен русским «присоединятся».
- source_word: גוֹיִם רַבִּים
  choice: многие народы
  rationale: Передаёт международный масштаб без внесения более узкого противопоставления «иудеев» и «язычников».
- source_word: אֶל יְהוָה
  choice: к ГОСПОДУ
  rationale: Предлог обозначает направленность присоединения и верности; имя יהוה передано принятой формой «ГОСПОДЬ».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохраняет устойчивую пророческую временную формулу.
- source_word: וְהָיוּ לִי לְעָם
  choice: и станут Моим народом
  rationale: Естественно передаёт заветную формулу и сохраняет единственное число «народ» при подлежащем «многие народы».
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  choice: Я буду обитать среди тебя
  rationale: «Обитать» соответствует שׁכן и сохраняет обращение во втором лице женского рода единственного числа к Сиону/Иерусалиму.
- source_word: וְיָדַעַתְּ
  choice: и ты узнаешь
  rationale: Передаёт формулу последующего распознания и сохраняет женский род адресата.
- source_word: יְהוָה צְבָאוֹת
  choice: ГОСПОДЬ Воинств
  rationale: «Воинств» прозрачно передаёт צְבָאוֹת и сохраняет возвышенный библейский титул.
- source_word: שְׁלָחַנִי
  choice: послал Меня
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённое действие еврейского qatal в формуле узнавания.
- source_word: אֵלָיִךְ
  choice: к тебе
  rationale: Сохраняет местоименное обращение второго лица женского рода единственного числа, не добавляя из контекста имя адресата.
theological_decisions:
- issue: Личность говорящего в словах «ГОСПОДЬ Воинств послал Меня к тебе»
  choice: Сохранить первое лицо «Меня» без поясняющего отождествления
  alternative: Отождествить говорящего с ангелом, пророком либо божественной/мессианской фигурой
  rationale: Еврейский текст не называет прямо того, кого послал ГОСПОДЬ; перевод сохраняет эту богословскую напряжённость и не разрешает неоднозначность толкованием.
- issue: Единственное число в заветной формуле при множественном подлежащем
  choice: «многие народы… станут Моим народом»
  alternative: «станут Моими народами»
  rationale: Единственное עָם представляет многие народы как единый заветный народ и должно быть сохранено.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Формы «среди тебя», «ты узнаешь» и «к тебе» намеренно сохраняют обращение к Сиону/Иерусалиму как к лицу женского рода единственного числа. Прописные местоимения «Моим», «Меня» согласованы с божественной речью, но не используются для устранения неоднозначности личности посланного.
