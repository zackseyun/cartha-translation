  text: And I lifted up my eyes and saw[a], and behold, four horns.
translation:
  language: ru
  text: 'Я поднял глаза и увидел: вот четыре рога[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по смыслу: «четыре силы» или «четыре власти». В библейской образности рог часто символизирует силу и власть; в основном тексте сохранён буквальный образ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: Я поднял глаза
  rationale: Естественно передаёт еврейское устойчивое выражение «поднять глаза», то есть направить взгляд, сохраняя при этом его образность.
- source_word: וָאֵרֶא
  choice: и увидел
  rationale: Передаёт последовательное повествовательное действие без ненужного повторения местоимения.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет указательную и привлекающую внимание силу הִנֵּה и естественно звучит в описании видения.
- source_word: אַרְבַּע
  choice: четыре
  rationale: Прямое соответствие количественному числительному.
- source_word: קְרָנוֹת
  choice: рога
  rationale: Сохраняет буквальный и значимый образ пророческого видения; истолкование символа не подменяет сам образ в основном тексте.
theological_decisions:
- issue: Символика четырёх рогов в пророческом видении
  choice: Сохранить в основном тексте буквальный образ «четыре рога».
  alternative: «четыре силы» или «четыре власти»
  rationale: В этом стихе символ вводится прежде, чем получает объяснение в дальнейшем контексте. Интерпретирующий перевод преждевременно устранил бы образность и присущую тексту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным синтаксисом видения. Двоеточие естественно вводит внезапно представший взору образ, а «вот» сохраняет пророческую наглядность без архаического «се».
