  text: And I lifted up my eyes and saw[a], and behold, a man, and in his hand a measuring line.
translation:
  language: ru
  text: 'Я поднял глаза и увидел: вот человек, а в руке у него — мерный шнур[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верёвка для измерения». Еврейское слово חֶבֶל обозначает шнур или верёвку, используемую здесь как измерительный инструмент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Я поднял глаза
  rationale: Сохраняет еврейскую идиому «поднять глаза», характерную для описания видения, и при этом естественно звучит по-русски.
- source_word: וָאֵרֶא
  choice: и увидел
  rationale: Прямая передача формы первого лица; союз сохраняет последовательность действий в повествовании.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт указательный маркер, привлекающий внимание к внезапно представшей перед пророком картине, без излишне архаичного «се».
- source_word: אִישׁ
  choice: человек
  rationale: Передаёт мужскую фигуру в видении; в русском существительное «человек» здесь естественнее, чем неопределённое «кто-то».
- source_word: וּבְיָדוֹ
  choice: а в руке у него
  rationale: Сохраняет зрительную деталь исходного текста; противительный по форме русский союз «а» естественно вводит сопутствующую деталь и не создаёт смыслового противопоставления.
- source_word: חֶבֶל מִדָּה
  choice: мерный шнур
  rationale: Обозначает шнур или верёвку, служащую для измерения. «Мерный шнур» кратко, точно и естественно передаёт назначение предмета.
