base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
translation:
  language: ru
  text: 'Тогда я спросил: «Что они пришли делать?» Он ответил: «Это те рога[b], которые рассеяли Иудею, так что никто не поднимал головы[a]. Они пришли, чтобы устрашить эти рога и повергнуть[c] рога народов, поднимавших рог против земли Иудеи, чтобы рассеять её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейское выражение звучит необычно: «по устам человека он не поднимал своей головы»; по смыслу это образ унижения и беспомощности.'
    reason: lexical_alternative
  - marker: b
    text: Рога служат образом силы и воинственной власти; этот образ сохранён в переводе, а не заменён толкованием.
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «сбросить» или «низвергнуть». Употреблённый здесь еврейский глагол редок, и его точный оттенок не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּרָנוֹת / קֶרֶן
  choice: рога / рог
  rationale: Сохранён буквальный образ рогов как символа силы и воинственной власти; замена на «державы» или «силы» преждевременно истолковала бы видение.
- source_word: זֵרוּ / לְזָרוֹתָהּ
  choice: рассеяли / рассеять её
  rationale: Глагол обозначает рассеивание; выбранный вариант естественен по-русски и сохраняет связь с изгнанием и опустошением Иудеи.
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  choice: так что никто не поднимал головы
  rationale: Русский оборот естественно передаёт образ полного унижения и бессилия, не превращая подразумеваемую невозможность в явное «не мог».
- source_word: לְהַחֲרִיד
  choice: устрашить
  rationale: Передаёт каузативное значение — привести в страх или трепет — и соответствует серьёзному пророческому регистру.
- source_word: לְיַדּוֹת
  choice: повергнуть
  rationale: Редкий и трудный глагол в данном контексте означает низвержение враждебных рогов; «повергнуть» сохраняет направленный образ свержения.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: Речь идёт о чужеземных народах, выступивших против Иудеи; «народы» — точный и нейтральный русский эквивалент.
- source_word: הַנֹּשְׂאִים קֶרֶן
  choice: поднимавших рог
  rationale: Сохранена еврейская метафора утверждения силы и надменного выступления против Иудеи.
- source_word: אֵלֶּה בָאִים לַעֲשׂוֹת
  choice: что они идут делать?
  rationale: Передано настоящее значение причастия внутри разворачивающегося видения без замены на более истолковывающее «что они собираются сделать?».
- source_word: וַיָּבֹאוּ אֵלֶּה
  choice: они пришли
  rationale: Последовательная глагольная форма продвигает рассказ и вводит цель появления этих фигур.
theological_decisions:
- issue: Символика рогов как враждебной силы
  choice: Сохранить в основном тексте образ «рогов».
  alternative: Передать как «силы», «державы» или «царства».
  rationale: Само видение строится на символическом образе рогов; его истолкование не следует подменять переводом.
- issue: Образ унижения в выражении о неподнятой голове
  choice: «так что никто не поднимал головы»
  alternative: «так что никто не мог поднять головы»
  rationale: Выбранный вариант ближе к явной грамматике еврейского текста и сохраняет образ, тогда как «не мог» делает подразумеваемое бессилие эксплицитным.
- issue: Неясность редкого глагола לְיַדּוֹת
  choice: «повергнуть» с указанием варианта в сноске
  alternative: «сбросить» или «низвергнуть»
  rationale: Контекст требует действия против рогов народов, но точный оттенок редкого глагола не вполне определён; сноска сохраняет лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан понятным обычному читателю, но ключевые зрительные образы — рога, поднятая голова и поднятый рог — сохранены без конфессионального истолкования.
