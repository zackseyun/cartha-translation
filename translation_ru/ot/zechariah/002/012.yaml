  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств: «После славы[a] он послал меня против народов, грабящих вас, ибо тот, кто прикасается к вам, прикасается к зрачку его глаза[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ради славы он послал меня к народам, грабящим вас». Еврейское выражение «после славы» трудно для истолкования и может указывать на цель, последовательность событий или связь с честью и славой.'
    reason: alternative_reading
  - marker: b
    text: 'Буквальный образ указывает на зрачок — наиболее чувствительную и тщательно оберегаемую часть глаза. Традиционный русский эквивалент: «зеница его ока».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционный и понятный образ множества небесных сил, не сужая значение до земных армий.
- source_word: אַחַר כָּבוֹד
  choice: После славы
  rationale: Формальная передача сохраняет трудность и многозначность эллиптического еврейского выражения, не определяя однозначно цель или временную последовательность.
- source_word: שְׁלָחַנִי
  choice: он послал меня
  rationale: Естественно передаёт завершённое действие еврейской формы qatal и сохраняет смену лица без поясняющей гармонизации.
- source_word: אֶל הַגּוֹיִם
  choice: против народов
  rationale: Хотя אֶל обычно обозначает направление «к», контекст враждебных народов и последующего суда допускает направленность миссии против них.
- source_word: הַשֹּׁלְלִים אֶתְכֶם
  choice: грабящих вас
  rationale: Причастие от שׁלל обозначает тех, кто берёт добычу и разоряет; русское выражение ясно и сохраняет причастную конструкцию.
- source_word: הַנֹּגֵעַ בָּכֶם ... נֹגֵעַ
  choice: тот, кто прикасается к вам, прикасается
  rationale: Повтор одного и того же глагола сохраняет риторическую силу исходного текста и не усиливает его до «ударяет».
- source_word: בְּבָבַת עֵינוֹ
  choice: к зрачку его глаза
  rationale: Прямо и понятно передаёт чувствительную, тщательно оберегаемую часть глаза, сохраняя телесный образ оригинала.
theological_decisions:
- issue: Кто говорит «он послал меня» и к кому относится «его»
  choice: Местоимения оставлены без уточнения референтов, как в еврейском тексте.
  alternative: Назвать говорящего пророком, ангелом-посланником или божественной фигурой, посланной Яхве, а обладателя глаза прямо назвать Яхве.
  rationale: В тексте заметна смена между речью Яхве и формулой посланничества от первого лица. Уточнение действующих лиц устранило бы подлинную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сохранены имя Яхве, титул «Воинств», повтор глагола и трудное выражение «после славы». Местоимения намеренно даны со строчной буквы, чтобы не предрешать неоднозначные референты.
