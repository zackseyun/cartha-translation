lexical_decisions:
- source_word: הַס
  choice: Умолкни
  rationale: Междометие-повеление требует благоговейной тишины. «Умолкни» естественно и торжественно передаёт призыв к молчанию.
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Буквальное пророческое выражение охватывает всё человечество и подчёркивает тварность людей перед Богом; оно понятно в современном литературном русском.
- source_word: מִפְּנֵי
  choice: пред
  rationale: Кратко передаёт пребывание перед лицом и в присутствии Яхве, сохраняя возвышенный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем и титулом.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание повеления и соответствует торжественному пророческому регистру.
- source_word: נֵעוֹר
  choice: Он пробудился
  rationale: Глагол рисует переход от покоя к действию. «Пробудился» сохраняет образ, не конкретизируя сверх текста характер последующего действия.
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: в Своём святом жилище
  rationale: Русское «пробудиться в жилище» естественно передаёт исходную точку предстоящего действия, тогда как буквальное «из жилища» при этом глаголе звучало бы неестественно. «Святое жилище» сохраняет сакральный пространственный образ.
theological_decisions:
- issue: Объём выражения «всякая плоть»
  choice: Сохранить буквальное пророческое выражение «всякая плоть».
  alternative: «всё человечество»; «все люди»
  rationale: Выражение относится ко всему человечеству, но буквальная форма также подчёркивает человеческую тварность перед Божьим присутствием.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: «Господь»; «Иегова»
  rationale: Транслитерация сохраняет личное имя Бога, не заменяя его титулом.
- issue: Образ в глаголе נֵעוֹר
  choice: «пробудился» с примечанием о возможном значении начала действия
  alternative: «восстал»; «пришёл в движение»; «пробудил Себя»
  rationale: Исходный глагол допускает образ пробуждения или поднятия к действию. Основной текст сохраняет образ, а примечание не позволяет свести его к буквальному сну.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Формы «умолкни», «пред» и «ибо» поддерживают достоинство речи, не делая её архаичной. Местоимение «Он» и притяжательное «Своём» написаны с прописной буквы как принятая русская форма благоговейного обозначения Бога.
