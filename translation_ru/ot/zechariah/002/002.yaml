base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
translation:
  language: ru
  text: 'Я спросил ангела, говорившего со мной: «Что это?» Он ответил мне: «Это рога[a], которые рассеяли Иудею, Израиль и Иерусалим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «силы» или «царства»; в еврейском тексте буквально «рога» — распространённый пророческий образ силы или правящей власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ангела
  rationale: Слово מַלְאָךְ может означать «посланник» или «ангел»; в контексте видения Захарии речь идёт о небесном истолкователе, поэтому «ангел» точнее передаёт референта.
- source_word: הַדֹּבֵר בִּי
  choice: говорившего со мной
  rationale: В книге Захарии сочетание דֹּבֵר с בְּ обозначает ангела, беседующего с пророком. Русское «со мной» естественно передаёт этот оборот, тогда как буквальное «во мне» здесь не соответствует контексту.
- source_word: מָה אֵלֶּה
  choice: Что это?
  rationale: Естественная русская форма вопроса с указанием на несколько видимых предметов; множественность раскрывается в ответе «это рога».
- source_word: הַקְּרָנוֹת
  choice: рога
  rationale: Кֶרֶן буквально означает «рог» и в пророческих видениях символизирует силу или владычество. Основной текст сохраняет сам образ, не подменяя его толкованием.
- source_word: זֵרוּ
  choice: рассеяли
  rationale: Глагол זרה означает разбрасывать или рассеивать, иногда подобно веянию зерна. Здесь «рассеяли» ясно и естественно передаёт изгнание и разобщение народа.
- source_word: יְהוּדָה ... יִשְׂרָאֵל ... וִירוּשָׁלָם
  choice: Иудею, Израиль и Иерусалим
  rationale: Сохранены все три собственных имени и их координация в еврейском тексте; падежные формы обусловлены русским синтаксисом.
theological_decisions:
- issue: Символическое значение рогов
  choice: В основном тексте сохранён буквальный образ «рога».
  alternative: «силы» или «царства»
  rationale: Текст видения прямо называет увиденное рогами. Замена образа его возможным толкованием устранила бы намеренную символику и сузила смысл.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с сохранением пророческого образа. Глаголы речи в вопросно-ответном контексте естественно переданы как «спросил» и «ответил», без изменения содержания.
