base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
translation:
  language: ru
  text: А Я сам буду для неё стеной огня вокруг неё, — возвещает Яхве, — и буду славой[a] посреди неё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте перед словом «слава» нет артикля; конструкция может пониматься как «буду славой» или «буду одной славой». Русский язык этого различия здесь не выражает.
    reason: Сохраняет лексико-грамматическую альтернативу, отмеченную в английском аудиторском следе, не выдавая адаптированный русский порядок слов за буквальный перевод.
lexical_decisions:
- source_word: וַאֲנִי
  choice: А Я Сам
  rationale: Самостоятельное местоимение усиливает уже выраженное глагольной формой подлежащее; «Я Сам» естественно передаёт эмфазу. Союз ו здесь может продолжать речь с оттенком смыслового перехода, поэтому выбран русский «А».
- source_word: אֶהְיֶה לָהּ
  choice: буду для неё
  rationale: Имперфект היה в данном пророческом контексте имеет будущее значение, а ל обозначает отношение и благотворную для города функцию. Женский род сохраняет олицетворение Иерусалима.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно; личное имя יהוה транслитерировано как «Яхве».
- source_word: חוֹמַת אֵשׁ סָבִיב
  choice: огненной стеной вокруг
  rationale: Конструкция «стена огня» обозначает окружающую город божественную защиту. Творительный падеж естественно оформляет именную часть сказуемого в русском языке, а «вокруг» сохраняет значение סָבִיב.
- source_word: וּלְכָבוֹד אֶהְיֶה
  choice: и буду славой
  rationale: 'Предикативное существительное כָבוֹד сохранено без превращения в прилагательное «славен»: сам Яхве будет славой города. Русская конструкция с творительным падежом естественно передаёт роль или качество, выраженное לְ.'
- source_word: בְתוֹכָהּ
  choice: посреди неё
  rationale: Передаёт пребывание внутри города и сохраняет женский образ Иерусалима.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Женское олицетворение Иерусалима
  choice: для неё; посреди неё
  alternative: для него; внутри города; посреди Иерусалима
  rationale: Женские суффиксы оригинала представляют город как женщину; это поэтическое олицетворение сохранено без добавления отсутствующего в стихе названия города.
- issue: Предикативное значение כָבוֹד
  choice: буду славой
  alternative: буду ей славой; буду славен
  rationale: 'Выбранный вариант сохраняет сильную метафору: Яхве не просто славен, но Сам является славой среди города. При этом артиклевая неопределённость, возможная в английском («glory» / «a glory»), грамматически не выражается в русском.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Инверсия сведена к минимуму ради ясности; эмфаза וַאֲנִי передана словами «Я Сам». Пунктуация выделяет формулу «возвещает Яхве», не нарушая параллелизма двух обещаний.
