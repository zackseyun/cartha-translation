id: ZEC.2.7
reference: Zechariah 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י יֹצֵ֑א וּ/מַלְאָ֣ךְ אַחֵ֔ר יֹצֵ֖א לִ/קְרָאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/007.yaml
  text: And behold[a], the angel who was speaking with me went out, and another angel went out to meet him.
translation:
  language: ru
  text: И вот, ангел, говоривший со мной[a], вышел, и другой ангел вышел ему навстречу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беседовавший со мной».'
    reason: Лексическая альтернатива для הַדֹּבֵר בִּי; «беседовавший» сильнее подчёркивает двусторонний характер общения, тогда как основной вариант ближе к форме исходного выражения.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт указательно-повествовательную функцию הִנֵּה, привлекая внимание к внезапному развитию видения, и при этом звучит естественно в современном русском языке.
- source_word: הַמַּלְאָךְ
  choice: ангел
  rationale: Хотя מַלְאָךְ может означать и обычного посланника, контекст пророческого видения и появление двух небесных действующих лиц делают «ангел» наиболее уместным соответствием.
- source_word: הַדֹּבֵר בִּי
  choice: говоривший со мной
  rationale: Причастная конструкция обозначает ангела по его продолжающейся повествовательной роли. Предлог בְּ в повторяющейся у Захарии формуле естественно передаётся как «со мной»; вид и время русского причастия согласованы с прошедшим повествованием.
- source_word: יֹצֵא
  choice: вышел
  rationale: Причастие в повествовательной последовательности имеет глагольную силу; совершенный вид естественно передаёт последовательные перемещения фигур.
- source_word: וּמַלְאָךְ אַחֵר
  choice: и другой ангел
  rationale: אַחֵר обозначает ещё одного, отличного от первого ангела, не приписывая ему не названной в тексте особой природы или должности.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: Передаёт направленность и цель движения второго ангела и является ясным, идиоматичным русским выражением.
theological_decisions:
- issue: Кем являются два ангела
  choice: Оба случая מַלְאָךְ переданы общим словом «ангел» без дальнейшего отождествления фигур.
  alternative: Считать первого ангелом-толкователем, а второго — отдельным небесным посланником с определённым поручением.
  rationale: Сам стих различает их только по роли и последовательности действий. Перевод сохраняет это различие, не внося в текст дополнительных ангелологических отождествлений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим оборотом «И вот». Синтаксис сохраняет зрительную последовательность еврейского повествования, оставаясь ясным и естественным.
