base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own servants[c][b]. Then you will know that Yahweh of Armies has sent me.
translation:
  language: ru
  text: Ибо вот, я взмахну над ними рукой, и они станут добычей своих рабов[a]. Тогда вы узнаете, что Яхве Воинств[b] послал меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для своих слуг». Еврейское עבד может означать как раба, так и слугу; вариант «рабов» сильнее передаёт переворот положения.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Господь Саваоф»; также возможно: «Господь Воинств».'
    reason: lexical_alternative
  - marker: c
    text: Говорящий утверждает, что Яхве Воинств послал его, но здесь прямо не называет себя; контекст оставляет его личность открытой.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для предыдущего утверждения; «ведь» естественно передаёт пояснительную связь в русском языке.
- source_word: הִנְנִי
  choice: вот, я
  rationale: Оборот привлекает внимание к говорящему и предстоящему действию; «вот» сохраняет его дейктическую выразительность без архаического «се».
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  choice: взмахну над ними рукой
  rationale: Глагол נוף обозначает движение, взмах или размахивание; выбранный вариант сохраняет конкретный образ и подразумеваемую контекстом угрозу, не заменяя его толкованием «подниму руку против них».
- source_word: וְהָיוּ
  choice: и они станут
  rationale: Здесь היה выражает переход в новое состояние, поэтому «станут» точнее простого «будут».
- source_word: שָׁלָל
  choice: добычей
  rationale: Современный и понятный русский эквивалент военной добычи или награбленного имущества.
- source_word: לְעַבְדֵיהֶם
  choice: для своих рабов
  rationale: 'עבד может обозначать и слугу, и раба. «Рабов» подчёркивает резкий переворот положения: прежние подчинённые получают своих господ как добычу.'
- source_word: וִידַעְתֶּם
  choice: Тогда вы узнаете
  rationale: «Тогда» естественно выражает результат предшествующего действия, заложенный в последовательности еврейского текста.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Имя יהוה передано как «Яхве», а צבאות переведено смысловым словом «Воинств», сохраняющим военный оттенок титула.
- source_word: שְׁלָחָנִי
  choice: послал меня
  rationale: Русское прошедшее время естественно передаёт завершённое поручение; контекст сохраняет его актуальную значимость.
theological_decisions:
- issue: 'Кто говорит: «Яхве Воинств послал меня»'
  choice: Сохранить первое лицо, не называя говорящего и не разрешая его тождество средствами перевода.
  alternative: Отождествить говорящего с пророком Захарией, ангелом-посланником либо божественной/мессианской фигурой.
  rationale: Еврейский текст прямо не устанавливает здесь личность говорящего. Строчная форма местоимений не добавляет в русский текст решения, которого нет в исходной формулировке.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаической интонацией. «Ведь вот» сохраняет пророческую выразительность; конкретный жест руки передан буквально. Местоимения первого лица написаны со строчной буквы, чтобы русская типографическая традиция не предрешала личность говорящего.
