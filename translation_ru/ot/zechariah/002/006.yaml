  source_fidelity: Черновик точно передаёт вопрос о направлении, цель измерения и обе пространственные характеристики Иерусалима. Однако וָאֹמַר прямо означает «и я сказал», а не «спросил»; לִרְאוֹת буквально «чтобы увидеть», и в переводе его лучше сохранить, не заменяя интерпретирующим «чтобы узнать».
