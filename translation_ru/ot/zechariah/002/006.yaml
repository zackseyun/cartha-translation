  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
translation:
  language: ru
  text: 'И я сказал: «Куда ты идёшь?» Он ответил мне: «Измерить Иерусалим, чтобы увидеть, каковы его ширина и длина».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָ֖נָה
  choice: Куда
  rationale: Вопросительное наречие обозначает направление или место назначения; русское «куда» точно и естественно передаёт этот смысл.
- source_word: הֹלֵ֑ךְ
  choice: ты идёшь
  rationale: Причастная форма глагола הלך в сочетании с местоимением описывает совершающееся движение; «ты идёшь» естественно в вопросе о цели пути.
- source_word: לָמֹד֙
  choice: Измерить
  rationale: Инфинитив глагола מדד прямо означает «измерять»; этот вариант сохраняет конкретный характер действия.
- source_word: אֶת יְר֣וּשָׁלִַ֔ם
  choice: Иерусалим
  rationale: Прямое дополнение с общепринятой русской формой названия города.
- source_word: לִרְא֥וֹת
  choice: чтобы узнать
  rationale: Буквально «чтобы увидеть»; в контексте измерения глагол выражает цель — установить величину. «Чтобы узнать» естественно передаёт функцию оборота, не меняя его смысла.
- source_word: כַּמָּֽה רָחְבָּ֖הּ
  choice: какова его ширина
  rationale: Буквально «сколько/какова её ширина». Существительное с суффиксом женского рода относится к Иерусалиму; в русском название города мужского рода, поэтому употреблено «его».
- source_word: וְכַמָּ֥ה אָרְכָּֽהּ
  choice: и какова его длина
  rationale: Сохраняет параллелизм исходного текста и прямо передаёт выражение «сколько/какова её длина» с грамматическим согласованием по-русски.
