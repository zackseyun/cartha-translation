  text: И Яхве показал мне четырёх ремесленников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четырёх мастеров»; еврейское слово может обозначать искусных работников вообще, в том числе кузнецов.'
    reason: 'Лексическая альтернатива: род занятия этих людей в еврейском тексте не уточнён.'
lexical_decisions:
- source_word: וַ/יַּרְאֵ/נִי
  choice: И показал мне
  rationale: Порода хифиль глагола ראה с суффиксом 1-го лица единственного числа буквально передаёт значение «дал мне увидеть», а естественно по-русски — «показал мне». Союз «и» сохраняет последовательное развитие пророческого видения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: אַרְבָּעָה
  choice: четырёх
  rationale: Количественное числительное согласовано с одушевлённым существительным в винительном падеже.
- source_word: חָרָשִׁים
  choice: мастеров
  rationale: חָרָשׁ обозначает искусного работника или ремесленника и может относиться к обработке металла, дерева либо камня. «Мастера» естественно звучит по-русски и не сужает значение до одной профессии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон. Форма «Яхве» сохраняет личное имя и отличает его от титула.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет достоинство и последовательность видения. «Мастера» выбрано как понятное широкое обозначение искусных работников.
