  yaml_path: translation/ot/zechariah/002/011.yaml
  text: Up[a], Zion! Escape, you who dwell with Daughter Babylon.
translation:
  language: ru
  text: О Сион! Спасайся, ты, живущая в Дочери Вавилона![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Эй, Сион! Беги, ты, живущая в Дочери Вавилона!»'
    reason: Лексические варианты для הוֹי («Эй») и הִמָּלְטִי («беги»). «Дочь Вавилона» — образное, персонифицированное обозначение Вавилона.
lexical_decisions:
- source_word: הוֹי
  choice: Эй!
  rationale: Междометие здесь служит срочным призывом, а не выражением скорби. «Эй!» естественно передаёт оклик в современном русском; «горе» ошибочно придало бы фразе характер плача.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Традиционная русская передача топонима; здесь Сион персонифицирован и выступает адресатом призыва.
- source_word: הִמָּלְטִי
  choice: спасайся
  rationale: Императив нифаля женского рода единственного числа от מלט означает срочно выбраться из опасности, спастись. «Спасайся» сохраняет направленность на избавление, не уточняя способ бегства.
- source_word: יוֹשֶׁבֶת
  choice: ты, живущий
  rationale: Причастие женского рода единственного числа характеризует персонифицированный Сион. В русском грамматическое согласование идёт с названием «Сион», имеющим мужской род, поэтому употреблено «живущий».
- source_word: בַּת בָּבֶל
  choice: дочь Вавилона
  rationale: Буквальная конструкция сохраняет пророческую персонификацию и намеренно не сводится просто к географическому обозначению Вавилона.
theological_decisions:
- issue: К кому относится обращение в женском роде
  choice: Сион персонифицирован как женщина и назван живущим у дочери Вавилона; через этот образ призыв обращён к связанным с Сионом изгнанникам.
  alternative: Причастие можно понимать как отдельное обращение к женщине, символически представляющей жительницу Вавилона.
  rationale: Женские формы в еврейском тексте и структура обращения естественно соотносятся с обычной пророческой персонификацией Сиона. Перевод сохраняет образ и не заменяет его поясняющим коллективным существительным.
- issue: Значение предлога ב в בַּת בָּבֶל
  choice: у дочери Вавилона
  alternative: в дочери Вавилона
  rationale: Предлог ב может обозначать пребывание «в» или «у/среди». Основной текст передаёт естественное русское понимание проживания у персонифицированного Вавилона, а буквальная пространственная конструкция сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Резкий оклик передан словом «Эй», а традиционная персонификация «дочь Вавилона» сохранена. Грамматический мужской род определения обусловлен русским родом названия «Сион», хотя еврейские формы женского рода выражают его персонификацию.
