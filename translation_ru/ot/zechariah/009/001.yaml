source:
  edition: WLC
  text: מַשָּׂ֤א דְבַר יְהוָה֙ בְּ/אֶ֣רֶץ חַדְרָ֔ךְ וְ/דַמֶּ֖שֶׂק מְנֻחָת֑/וֹ כִּ֤י לַֽ/יהוָה֙ עֵ֣ין אָדָ֔ם וְ/כֹ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
translation:
  language: ru
  text: 'Пророческое изречение: слово Яхве — о земле Хадрах[a], и Дамаск — место покоя[b], ибо взор человечества и всех колен Израиля обращён к Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «в земле Хадрах»; по смыслу пророческого заголовка — «против земли Хадрах».'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте стоит суффикс со значением «его/его место покоя», однако его антецедент неясен: он может относиться к слову (или пророческому изречению) либо к Яхве. В русском основном тексте притяжательное местоимение опущено, чтобы не разрешать эту неоднозначность.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская фраза сжата. Возможен и другой смысл: «ибо взор Яхве обращён на человечество и на все колена Израиля».'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророческое изречение
  rationale: В заголовках пророчеств слово обозначает возвещение или изречение, нередко грозное. Этот вариант естественен по-русски и не навязывает спорную буквальную метафору «бремя».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена обычная пророческая формула и передано личное имя יהוה.
- source_word: בְּאֶרֶץ חַדְרָךְ
  choice: о земле Хадрах
  rationale: Предлог ב буквально может означать «в», однако в заголовке пророчества способен указывать на предмет или цель возвещения. «О» сохраняет это значение, не усиливая его до однозначного «против».
- source_word: מְנֻחָתוֹ
  choice: место его покоя
  rationale: Существительное означает место покоя, а местоименный суффикс мужского рода имеет неясный антецедент. Русское «его» сохраняет грамматическую и смысловую неоднозначность.
- source_word: לַיהוָה עֵין אָדָם
  choice: взор человечества обращён к Яхве
  rationale: Сжатая конструкция понята так, что «взор» является подлежащим, а לַיהוָה обозначает направленность к Яхве. «Человечество» естественно передаёт родовое значение אָדָם.
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: и всех колен Израиля
  rationale: Родительный падеж связывает эту группу с существительным «взор» и сохраняет распространение высказывания на все колена Израиля.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному богословскому решению.
- issue: Смысл сжатой конструкции לַיהוָה עֵין אָדָם
  choice: взор человечества и всех колен Израиля обращён к Яхве
  alternative: Яхве обращает взор на человечество и на все колена Израиля
  rationale: Порядок слов естественно допускает понимание עֵין как подлежащего и לַיהוָה как указания направления, однако альтернативный синтаксический разбор остаётся возможным и отмечен в сноске.
- issue: Антецедент суффикса в מְנֻחָתוֹ
  choice: место его покоя
  alternative: место покоя слова/изречения; место покоя Яхве
  rationale: Еврейский суффикс формально мужского рода, но его отнесение неочевидно; основной текст не разрешает эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. «Пророческое изречение» избегает архаичного «бремя»; «взор» уместен в возвышенном контексте. Неоднозначность местоименного суффикса и синтаксиса заключительной части сохранена в тексте и сносках.
