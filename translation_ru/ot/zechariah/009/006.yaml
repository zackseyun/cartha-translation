  yaml_path: translation/ot/zechariah/009/006.yaml
  text: A mixed people will dwell in Ashdod[a], and I will cut off the pride of the Philistines.
translation:
  language: ru
  text: В Аздоде поселится смешанный народ[a], и Я положу конец гордости филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек незаконного происхождения поселится в Аздоде». Значение еврейского слова מַמְזֵר не вполне ясно: оно может обозначать человека смешанного или исключённого статуса; здесь по контексту оно передано собирательно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: поселится
  rationale: Глагол означает «сидеть, жить, обитать». В пророчестве об изменении населения города «поселится» естественно передаёт начало или факт проживания.
- source_word: מַמְזֵר
  choice: смешанный народ
  rationale: Редкое и трудное слово может обозначать человека незаконного происхождения либо человека смешанного или исключённого статуса. В контексте судьбы города собирательное «смешанный народ» передаёт вероятный социально-этнический смысл, не сужая его до одного лица.
- source_word: בְּאַשְׁדּוֹד
  choice: в Аздоде
  rationale: Предлог בְּ обозначает местонахождение; форма «в Аздоде» идиоматична для проживания внутри города.
- source_word: הִכְרַתִּי
  choice: положу конец
  rationale: Каузативная форма כרת означает «отсечь, устранить, истребить». «Положу конец» ясно и естественно передаёт полное устранение, сохраняя судебную силу выражения.
- source_word: גְּאוֹן
  choice: гордости
  rationale: Слово может означать величие, возвышенность или гордость. В пророчестве о суде уместен отрицательный смысл — гордое самовозвышение и могущество.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Еврейская форма обозначает народ, а не территорию Филистии.
theological_decisions:
- issue: Значение и референт מַמְזֵר в пророчестве о суде
  choice: Собирательное «смешанный народ», который поселится в Аздоде
  alternative: «человек незаконного происхождения»; «чужеземец»
  rationale: Контекст говорит об унижении и изменении самобытности филистимского города. Буквально-индивидуальное понимание возможно, но может неоправданно сузить смысл. Основной текст передаёт вероятное коллективное значение, а примечание сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Положу конец» выбрано вместо менее естественного здесь «отсеку»; прописное «Я» отражает речь Бога, подразумеваемую контекстом.
