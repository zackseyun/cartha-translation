  text: וְ/גַם חֲמָ֖ת תִּגְבָּל בָּ֑/הּ צֹ֣ר וְ/צִיד֔וֹן כִּ֥י חָֽכְמָ֖ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/002.yaml
  text: and also Hamath[a], which borders on it; Tyre and Sidon, because they are very wise.
translation:
  language: ru
  text: а также Хамат[a], граничащий с ней; Тир и Сидон, ибо они весьма мудры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «и Хамат, граничащий с ней; Тир и Сидон, ибо она весьма мудра». В еврейском тексте при названиях двух городов неожиданно употреблено сказуемое женского рода единственного числа.'
    reason: Сохранение синтаксической неоднозначности и формального несогласования числа в еврейском тексте.
lexical_decisions:
- source_word: וְגַם
  choice: а также
  rationale: Передаёт соединительное וְ и добавочное значение גַּם, связывая стих с предшествующим перечнем мест.
- source_word: חֲמָת
  choice: Хамат
  rationale: Современная русская передача географического названия без замены традиционным, но менее прозрачным экзонимом.
- source_word: תִּגְבָּל בָּהּ
  choice: граничащий с ней
  rationale: Глагол גבל означает «граничить»; причастный оборот естественно передаёт определительное значение формы 3-го лица женского рода. Местоимение сохраняет женский род еврейского суффикса и его не вполне явную отсылку к территории из предыдущего стиха.
- source_word: צֹר וְצִידוֹן
  choice: Тир и Сидон
  rationale: Употреблены общепринятые русские формы названий городов.
- source_word: כִּי
  choice: ибо
  rationale: Сохраняет причинно-пояснительное значение союза и подходит к достоинству пророческой речи.
- source_word: חָכְמָה מְאֹד
  choice: они весьма мудры
  rationale: Формально сказуемое стоит в женском роде единственного числа, однако по смыслу может относиться к паре «Тир и Сидон»; русское множественное число делает общий референт ясным, а «весьма» передаёт усилитель מְאֹד.
theological_decisions:
- issue: Синтаксическая функция упоминания Тира и Сидона
  choice: 'Сохранена причинная связь: «ибо они весьма мудры»'
  alternative: Понимать слова о мудрости как вставочное описание городов без явной причинной связи
  rationale: Союз כִּי естественно имеет причинно-пояснительное значение; перевод не уточняет сверх текста, почему мудрость служит основанием их включения в пророчество.
- issue: Несогласование числа и рода в חָכְמָה при двух названиях городов
  choice: 'Множественное число: «они весьма мудры»'
  alternative: 'Единственное число: «она весьма мудра», возможно с отнесением к Сидону или к совокупному образу города'
  rationale: Множественное число естественно относит характеристику к Тиру и Сидону вместе, тогда как сноска сохраняет формальную особенность еврейского текста и реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным союзом «ибо». Причастный оборот позволяет сохранить связь с предыдущим стихом и сжатость еврейского перечня; пунктуация намеренно не устраняет его синтаксическую напряжённость.
