source:
  edition: WLC
  text: גַּם אַ֣תְּ בְּ/דַם בְּרִיתֵ֗/ךְ שִׁלַּ֤חְתִּי אֲסִירַ֨יִ/ךְ֙ מִ/בּ֔וֹר אֵ֥ין מַ֖יִם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
translation:
  language: ru
  text: 'А что до тебя: ради крови твоего завета[a] Я выпустил твоих узников из ямы, в которой нет воды[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «кровью твоего завета». Еврейский предлог допускает как причинное значение («ради», «из-за»), так и значение средства («кровью»).'
    reason: lexical_alternative
  - marker: b
    text: «Яма» может также означать водосборник или темницу — здесь это лишённое воды место заключения.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: А что до тебя
  rationale: Передаёт переход к прямому обращению и добавочную связь с предыдущим обещанием; местоимение женского рода соответствует олицетворённому Сиону или Иерусалиму.
- source_word: בְּדַם בְּרִיתֵךְ
  choice: ради крови твоего завета
  rationale: Предлог ב может выражать основание или средство. «Ради» естественно передаёт причинно-оснóвное значение, не устраняя возможного инструментального понимания, отмеченного в сноске.
- source_word: שִׁלַּחְתִּי
  choice: Я выпустил
  rationale: Форма перфекта первого лица обозначает совершённое действие; «выпустил» естественно сочетается с узниками и сохраняет основную идею отпускания.
- source_word: אֲסִירַיִךְ
  choice: твоих узников
  rationale: «Узники» точно обозначает заключённых или связанных людей и соответствует образу выхода из ямы.
- source_word: מִבּוֹר
  choice: из ямы
  rationale: בּוֹר может означать яму, водосборник или место заключения. «Яма» сохраняет широту образа, а последующее указание на отсутствие воды уточняет его.
- source_word: אֵין מַיִם בּוֹ
  choice: в которой нет воды
  rationale: Прямо и естественно передаёт еврейскую конструкцию существования и согласуется с русским словом «яма».
theological_decisions:
- issue: Значение выражения «кровь твоего завета»
  choice: Сохранено общее заветное выражение без уточнения конкретного завета.
  alternative: Прямая отсылка к Синайскому завету, скреплённому кровью, либо типологическое предвосхищение нового завета.
  rationale: Текст вызывает образ скреплённого кровью завета, но сам стих не называет конкретный исторический или богословский завет; перевод сохраняет эту открытость.
- issue: Причинное или инструментальное значение предлога ב
  choice: В основном тексте выбрано причинно-оснóвное «ради».
  alternative: «Кровью твоего завета» — инструментальное значение.
  rationale: Оба значения грамматически возможны. Основной вариант звучит естественно по-русски, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение передано в женском роде через «тебя» и «твоего», что соответствует олицетворённому Сиону/Иерусалиму. Синтаксис сделан ясным, при этом сохранены заветная лексика и образ безводной ямы.
