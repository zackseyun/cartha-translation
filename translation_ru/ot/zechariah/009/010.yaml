source:
  edition: WLC
  text: וְ/הִכְרַתִּי רֶ֣כֶב מֵ/אֶפְרַ֗יִם וְ/סוּס֙ מִ/יר֣וּשָׁלִַ֔ם וְ/נִכְרְתָה֙ קֶ֣שֶׁת מִלְחָמָ֔ה וְ/דִבֶּ֥ר שָׁל֖וֹם לַ/גּוֹיִ֑ם וּ/מָשְׁל/וֹ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/נָּהָ֖ר עַד אַפְסֵי אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: ru
  text: И Я истреблю колесницы у Ефрема и коней в Иерусалиме, и боевой лук будет уничтожен. Он возвестит мир народам, и его владычество прострётся от моря до моря и от Реки[a] до краёв земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Рекой», вероятно, подразумевается Евфрат.
    reason: Культурно-географическое пояснение определённого названия הַנָּהָר, традиционно обозначающего Евфрат.
lexical_decisions:
- source_word: וְהִכְרַתִּי רֶכֶב
  choice: И Я истреблю колесницы
  rationale: Глагол כרת в породе hифиль означает устранить, отсечь, истребить. Множественное «колесницы» естественно передаёт собирательное значение еврейского единственного числа и ясно обозначает военную силу.
- source_word: מֵאֶפְרַיִם
  choice: у Ефрема
  rationale: Ефрем обозначает северное царство или его территорию; предлог «у» здесь естественно передаёт удаление военной силы из его владений.
- source_word: וְסוּס מִירוּשָׁלִַם
  choice: и коней в Иерусалиме
  rationale: Единственное число סוּס употреблено собирательно. Русское множественное число передаёт смысл без неестественного впечатления, будто речь идёт об одном коне.
- source_word: וְנִכְרְתָה קֶשֶׁת מִלְחָמָה
  choice: и боевой лук будет уничтожен
  rationale: Пассивная форма сохраняет результат устранения оружия; «боевой лук» кратко и точно передаёт конструкцию «лук войны».
- source_word: וְדִבֶּר שָׁלוֹם לַגּוֹיִם
  choice: Он возвестит мир народам
  rationale: דבר в интенсивной породе допускает значение торжественного провозглашения. «Возвестит мир» естественно по-русски передаёт обращённое к народам царское слово о мире, не сужая שָׁלוֹם до одного лишь прекращения войны.
- source_word: וּמָשְׁלוֹ
  choice: и владычество его прострётся
  rationale: Форма является существительным с местоименным суффиксом — «его владычество», а не личной формой глагола. «Прострётся» естественно вводит последующие географические пределы.
- source_word: מִיָּם עַד יָם
  choice: от моря до моря
  rationale: Сохранена буквальная и одновременно понятная русская идиома всеохватного пространства.
- source_word: וּמִנָּהָר עַד אַפְסֵי אָרֶץ
  choice: и от Реки до краёв земли
  rationale: Определённая «Река» служит известным географическим ориентиром, вероятнее всего Евфратом; формулировка сохраняет лаконичность оригинала, а уточнение вынесено в сноску.
theological_decisions:
- issue: К кому относятся формы третьего лица «Он» и «его»
  choice: Они отнесены к грядущему царю из предыдущего стиха.
  alternative: 'Безличная передача: «мир будет возвещён», «владычество прострётся».'
  rationale: Переход от Божьего «Я истреблю» к третьему лицу естественно возвращает читателя к царю, названному в Зах 9:9. Личные формы сохраняют царско-мессианский образ, не добавляя последующей догматической конкретизации.
- issue: Масштаб царского владычества
  choice: Сохранены всеохватные географические выражения «от моря до моря» и «до краёв земли».
  alternative: Истолковать выражения как указание только на исторические границы местного царства.
  rationale: Текст намеренно изображает предельно широкое владычество. Перевод сохраняет эту широту, не решая за читателя вопрос о характере и способе её осуществления.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Собирательные названия военной силы переданы естественным русским множественным числом; синтаксический переход от первого лица Бога к третьему лицу царя сохранён. Ошибочная английская сноска [a], содержание которой дублировало фразу о владычестве и не соответствовало месту маркера, не перенесена; дана только источниково обоснованная сноска о Реке.
