source:
  edition: WLC
  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
translation:
  language: ru
  text: Ибо Я натянул Иуду, как Свой лук, и наполнил его Ефремом. Я подниму твоих сыновей, Сион, против твоих сыновей, Греция[a], и уподоблю тебя мечу воина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Яван» — традиционное название греческих народов и греческого мира.
    reason: Уточнение исходного собственного имени и его исторического значения.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему обетованию; «ибо» естественно передаёт эту связь в возвышенной современной прозе.
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  choice: Я натянул Иуду, как Свой лук
  rationale: Глагол דרך в сочетании с קשת означает натягивание лука. Дательное לִי передано притяжательным «Свой», а сравнение явно сохраняет образ Иуды как лука.
- source_word: מִלֵּאתִי אֶפְרַיִם
  choice: и наполнил его Ефремом
  rationale: Местоимение «его» восполняет подразумеваемый лук из предыдущей части. Необычный воинский образ сохранён без уточнения, является ли Ефрем стрелой или иным наполнением лука.
- source_word: וְעוֹרַרְתִּי
  choice: Я подниму
  rationale: В пророческой последовательности форма указывает на предстоящее побуждение к действию и битве. «Подниму» естественно звучит по-русски и не добавляет лишней конкретики.
- source_word: בָנַיִךְ צִיּוֹן
  choice: твоих сыновей, Сион
  rationale: Женский суффикс представляет Сион как мать; «сыновей» сохраняет род и воинскую направленность образа.
- source_word: עַל בָּנַיִךְ יָוָן
  choice: против твоих сыновей, Греция[a]
  rationale: יָוָן обозначает Ионию и шире греческий мир. «Греция» ясно передаёт историко-этнический референт современному читателю, а параллельное обращение сохраняет олицетворение страны как матери.
- source_word: וְשַׂמְתִּיךְ
  choice: и сделаю тебя
  rationale: В сочетании со сравнением «сделаю тебя подобным» по-русски естественнее буквального «поставлю тебя как».
- source_word: כְּחֶרֶב גִּבּוֹר
  choice: подобным мечу воина
  rationale: גִּבּוֹר здесь обозначает сильного бойца; «меч воина» сохраняет воинственный образ и звучит современно и достойно.
theological_decisions:
- issue: Референт и передача יָוָן
  choice: Греция
  alternative: Яван; Иония
  rationale: В данном пророческом противопоставлении слово указывает на греческие народы или греческий мир. Понятная форма «Греция» дана в тексте, а традиционное еврейское имя сохранено в примечании.
- issue: Временная сила перфектных форм в пророческой речи
  choice: Подготовительные действия переданы прошедшим совершенным временем («натянул», «наполнил»), последующие — будущим («подниму», «сделаю»)
  alternative: Передать все действия будущим временем; передать все действия пророческим прошедшим
  rationale: Так сохраняется риторическое движение от представленной как уже совершённой Божьей подготовки к предстоящему выступлению, без устранения временного напряжения оригинала.
- issue: Точный образ Ефрема в метафоре лука
  choice: Сохранить общее выражение «наполнил его Ефремом»
  alternative: 'Уточнить: «вложил в него Ефрема как стрелу» или «снарядил его Ефремом»'
  rationale: Еврейский текст не называет Ефрема прямо стрелой. Более общее выражение сохраняет образ и его подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохранён образным и энергичным; обращения к олицетворённым Сиону и Греции сделаны явными. Божественные местоимения оформлены с прописной буквы по принятой русской библейской традиции.
