  edition: WLC
  text: יְהוָ֣ה צְבָאוֹת֮ יָגֵ֣ן עֲלֵי/הֶם֒ וְ/אָכְל֗וּ וְ/כָֽבְשׁוּ֙ אַבְנֵי קֶ֔לַע וְ/שָׁת֥וּ הָמ֖וּ כְּמוֹ יָ֑יִן וּ/מָֽלְאוּ֙ כַּ/מִּזְרָ֔ק כְּ/זָוִיּ֖וֹת מִזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: ru
  text: Господь Воинств защитит их. Они будут пожирать и попирать камни пращи; будут пить и шуметь, словно от вина. Они наполнятся, как жертвенная чаша, как углы жертвенника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Жертвенные чаши наполняли кровью, которой окропляли жертвенник; здесь этот образ передаёт полноту победы, хотя кровь в еврейском тексте прямо не названа.
    reason: Поясняет непривычный современному читателю культовый образ, не внося подразумеваемую кровь в основной текст.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Передаёт традиционное замещение имени יהוה словом «Господь», сохраняя военный образ множественного צְבָאוֹת без сужения до одного значения.
- source_word: וְכָבְשׁוּ אַבְנֵי קֶלַע
  choice: и попирать камни пращи
  rationale: Глагол כבשׁ означает подчинять, покорять или попирать; в данном образе «попирать» естественно сочетается с камнями, выпущенными из пращи, и соответствует победному контексту.
- source_word: הָמוּ
  choice: шуметь
  rationale: Сохраняет широкое значение «громко шуметь, гудеть, реветь», не уточняя без достаточных оснований, идёт ли речь о боевом крике или пьяном буйстве.
- source_word: כַּמִּזְרָק
  choice: как жертвенная чаша
  rationale: מִזְרָק — храмовый сосуд, использовавшийся при жертвоприношениях; уточнение «жертвенная» делает культовый образ понятным современному читателю.
- source_word: כְּזָוִיּוֹת מִזְבֵּחַ
  choice: как углы жертвенника
  rationale: Формально сохраняет необычный образ оригинала и не заменяет «углы» более истолковывающим выражением.
theological_decisions:
- issue: Насильственная и культовая образность победы
  choice: Сохранить образы пожирания, попирания, питья и наполнения жертвенной чаши и углов жертвенника без добавления прямого упоминания крови или врагов.
  alternative: Разъяснить в основном тексте, что победители пожирают врагов и наполняются их кровью.
  rationale: В контексте эти ассоциации вероятны, но в еврейском тексте соответствующие дополнения не названы прямо; их добавление устранило бы намеренную поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским звучанием. Сохранены резкие воинские и жертвенные метафоры оригинала; синтаксис разбит на три предложения ради ясности и ритма.
