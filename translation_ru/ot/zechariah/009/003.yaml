base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
translation:
  language: ru
  text: Тир построил себе крепость[a] и накопил серебра, как пыли, и золота[b] — как грязи на улицах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепление». Еврейское מָצוֹר может обозначать укреплённое место или оборонительные сооружения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чистого золота». Еврейское חָרוּץ в некоторых контекстах может обозначать очищенное золото.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: Тир
  rationale: Общепринятое русское название финикийского города; мужской род сказуемых обусловлен грамматическим родом русского топонима.
- source_word: וַתִּבֶן
  choice: построил
  rationale: Форма wayyiqtol обозначает последовательное действие в прошлом; простой глагол естественно передаёт повествование.
- source_word: מָצוֹר
  choice: крепость
  rationale: В данном контексте слово обозначает укреплённое место или оборонительное сооружение; «крепость» ясно передаёт основное значение, а близкая альтернатива вынесена в примечание.
- source_word: לָהּ
  choice: себе
  rationale: Местоименный суффикс указывает, что Тир возводит укрепление для собственной защиты; русское «себе» сохраняет возвратный смысл.
- source_word: וַתִּצְבָּר
  choice: накопил
  rationale: Глагол выражает собирание большого количества; «накопил» естественно сочетается с серебром и золотом, сохраняя образ несметного богатства.
- source_word: כֶּסֶף
  choice: серебра
  rationale: Здесь имеется в виду драгоценный металл, параллельный золоту, а не деньги как средство расчёта.
- source_word: כֶּעָפָר
  choice: как пыли
  rationale: Сравнение подчёркивает неисчислимое изобилие и прямо сохраняет образ еврейского текста.
- source_word: חָרוּץ
  choice: золота
  rationale: В контексте слово обозначает золото; возможное уточнение «чистого золота» не обязательно и отмечено в сноске.
- source_word: כְּטִיט חוּצוֹת
  choice: как грязи на улицах
  rationale: Естественная русская формулировка сохраняет наглядное сравнение с повсеместной уличной грязью.
