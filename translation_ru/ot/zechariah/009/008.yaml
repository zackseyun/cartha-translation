base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
translation:
  language: ru
  text: И Я расположусь станом у Моего дома, охраняя его[a] от проходящего и возвращающегося[b]. И угнетатель[c] больше не пройдёт по ним, ибо ныне Я увидел Своими глазами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как стража» или «как гарнизон». Древнееврейское слово обозначает поставленный караул, сторожевой пост или оборонительное подразделение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от проходящего и от возвращающегося» — вероятно, речь о передвижении вражеских сил в обоих направлениях.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «взыскатель», «надсмотрщик». Слово может обозначать того, кто притесняет, принуждает к труду или взыскивает подать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: И Я стану станом
  rationale: Глагол חנה означает «располагаться станом, разбивать лагерь»; выражение сохраняет военный образ и передаёт обещание личного присутствия и защиты.
- source_word: לְבֵיתִי
  choice: у Моего дома
  rationale: Предлог ל допускает значения «у, при, для». В сочетании с образом охраняющего стана русский оборот «у Моего дома» естественно передаёт место защитного присутствия, не сужая «дом» исключительно до храма.
- source_word: מִצָּבָה
  choice: охраняя его
  rationale: Существительное обозначает поставленный пост, караул или гарнизон. Деепричастный оборот ясно передаёт функцию стана; местоимение «его» относится к дому и не вводит в текст отдельное войсковое подразделение.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: от проходящих туда и обратно
  rationale: Субстантивированные формы от עבר и שוב буквально описывают проходящего и возвращающегося. «Туда и обратно» сохраняет образ движения в обоих направлениях, вероятно вражеских сил.
- source_word: וְלֹא יַעֲבֹר עֲלֵיהֶם עוֹד נֹגֵשׂ
  choice: И угнетатель больше не пройдёт по их земле
  rationale: נֹגֵשׂ является подлежащим — тем, кто притесняет или взыскивает. Выражение עבר על в военном контексте означает пройти по территории, вторгнуться или захватить; добавление «земле» делает образ естественным по-русски, хотя слово подразумевается контекстом.
- source_word: כִּי עַתָּה רָאִיתִי בְעֵינָי
  choice: потому что теперь Я увидел это Своими глазами
  rationale: כִּי вводит основание обещания, עַתָּה отмечает решающий момент, а «Своими глазами» сохраняет эмфатический смысл древнееврейского выражения. «Это» необходимо для естественного русского управления глагола.
theological_decisions:
- issue: К чему относится выражение «Мой дом»
  choice: Сохранено буквальное «Мой дом» без уточнения его объёма.
  alternative: «Мой храм» либо «Мой народ/Моя земля».
  rationale: Возможна отсылка к храму, однако последующее множественное местоимение «их» расширяет перспективу до связанных с Божьим домом людей. Перевод не устраняет эту смысловую напряжённость.
- issue: Смысл Божьих слов «Я увидел»
  choice: Сохранено прямое утверждение «теперь Я увидел это Своими глазами».
  alternative: Истолковать как «теперь Я обратил на них внимание» или «увидел их бедствие».
  rationale: Исходный текст не называет прямо объект видения. Добавленное лишь ради русского синтаксиса «это» оставляет объект контекстуально открытым и не навязывает конкретного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Военный образ передан ясно, но без излишне специальной лексики. Заглавные местоимения относятся к Богу согласно принятой русской библейской стилистике.
