base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/004.yaml
  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
translation:
  language: ru
  text: Вот, Господь лишит её владений, поразит в море её силу[a], и она будет поглощена огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богатство», «средства», «войско» или «мощь». Еврейское слово может обозначать богатство, ресурсы или военную силу; в предыдущем стихе говорится о сокровищах Тира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную и торжественно-возвещательную силу пророческого объявления, оставаясь естественным в современном русском языке.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул Адонай и отличает его от тетраграмматона; слово уместно в возвышенной пророческой речи.
- source_word: יוֹרִשֶׁנָּה
  choice: лишит её владений
  rationale: Каузативная форма от ירש выражает лишение владения или вытеснение. Этот вариант ясно передаёт суд над Тиром, не уточняя сверх текста способ утраты.
- source_word: וְהִכָּה בַיָּם
  choice: повергнет в море
  rationale: Глагол נכה обозначает поражение или сокрушение, а сочетание с морем в данном контексте естественно передаётся как низвержение в море. «Повергнет» сохраняет силу образа без архаического «поразит» в неясной конструкции.
- source_word: חֵילָהּ
  choice: её богатство
  rationale: חַיִל может обозначать богатство, средства, силу или войско. Упоминание серебра и золота Тира в предыдущем стихе делает «богатство» наиболее вероятным здесь, при этом альтернативы отмечены в сноске.
- source_word: וְהִיא
  choice: и она
  rationale: Женский род относится к олицетворённому городу Тиру; русский грамматический род слова «город» этого не требует, но контекстуальный референт — названный ранее Тир — допускает и поддерживает форму женского рода в пророческом образе.
- source_word: בָּאֵשׁ תֵּאָכֵל
  choice: будет поглощена огнём
  rationale: Страдательная форма אכל с огнём буквально рисует огонь как поглощающую силу. Русское выражение сохраняет метафору и естественно передаёт полное уничтожение.
theological_decisions:
- issue: Референт форм женского рода
  choice: Формы «её» и «она» относятся к олицетворённому Тиру.
  alternative: Передать город безлично или перестроить фразу, избегая женского рода.
  rationale: Еврейский текст последовательно использует формы женского рода для города. Их сохранение поддерживает литературный образ и не вносит дополнительного богословского толкования.
- issue: Смысл суда, выраженного יוֹרִשֶׁנָּה
  choice: Передать как лишение города владений.
  alternative: «Изгонит её» или «овладеет ею».
  rationale: Форма допускает связанные значения вытеснения и завладения. «Лишит её владений» сохраняет центральную мысль об утрате, не определяя, идёт ли речь прежде всего об изгнании жителей или захвате города.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Вот» и «Владыка» сохраняют торжественность, а синтаксис остаётся ясным для широкого читателя.
