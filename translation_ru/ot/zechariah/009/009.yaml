  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
translation:
  language: ru
  text: Ликуй безмерно, дочь Сиона! Восклицай, дочь Иерусалима! Вот, твой царь идёт к тебе — праведный и спасённый[a], смиренный[b], едущий на осле, на молодом осле, сыне ослицы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «победоносный», «имеющий спасение» или «наделённый спасением». Еврейская форма может описывать того, кого Бог избавил и кто поэтому приходит как победитель.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «бедный», «угнетённый», «униженный» или «занимающий низкое положение». Еврейское слово может указывать как на смирение, так и на тяжёлое или незнатное положение человека.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «на осле, на молодом осле, сыне ослицы», вероятнее всего, представляет собой поэтический параллелизм и описывает одно животное с двух сторон.
    reason: cultural_note
lexical_decisions:
- source_word: גִּילִי מְאֹד
  choice: Ликуй от всего сердца
  rationale: Повеление выражает усиленный призыв к радостному ликованию. Русское «от всего сердца» естественно передаёт интенсивность מְאֹד, не создавая тяжеловесного сочетания «ликуй весьма».
- source_word: בַּת צִיּוֹן / בַּת יְרוּשָׁלִַם
  choice: дочь Сиона / дочь Иерусалима
  rationale: Сохранено поэтическое олицетворение города и народа без поясняющего расширения.
- source_word: הָרִיעִי
  choice: Восклицай от радости
  rationale: Глагол обозначает громкий возглас, нередко радостный или победный. Выбранный вариант передаёт и звучность, и праздничный контекст прибытия царя.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная современная русская частица, привлекающая внимание к последующему возвещению.
- source_word: מַלְכֵּךְ יָבוֹא לָךְ
  choice: твой царь идёт к тебе
  rationale: Настоящее время передаёт живую пророческую непосредственность еврейской формы и сохраняет направление «к тебе».
- source_word: צַדִּיק
  choice: праведный
  rationale: Сохраняет нравственный и заветный смысл характеристики царя.
- source_word: וְנוֹשָׁע
  choice: и победоносный
  rationale: Страдательное причастие от ישׁע допускает значение получившего избавление и потому торжествующего победу. «Победоносный» естественно звучит в царском контексте, а формально более явные варианты сохранены в примечании.
- source_word: עָנִי
  choice: смиренный
  rationale: Слово может обозначать бедного, угнетённого или занимающего низкое положение. В данном контексте «смиренный» естественно передаёт непышный образ прибытия царя, при сохранении других значений в примечании.
- source_word: וְרֹכֵב עַל חֲמוֹר
  choice: едущий на осле
  rationale: Прямая и естественная передача причастного оборота, описывающего способ прибытия царя.
- source_word: עַיִר בֶּן אֲתֹנוֹת
  choice: молодом осле, сыне ослицы
  rationale: «Молодой осёл» понятно передаёт עַיִר, а «сын ослицы» сохраняет образ и семитское уточнение происхождения животного.
theological_decisions:
- issue: Значение וְנוֹשָׁע в пророчестве о грядущем царе
  choice: победоносный
  alternative: спасённый; получивший спасение; имеющий спасение
  rationale: Форма страдательная и может указывать на царя, избавленного Богом, однако в царском контексте результатом такого избавления является победа. Основной текст передаёт контекстуальный результат, а примечание сохраняет грамматическую форму и богословское напряжение.
- issue: Значение עָנִי как характеристики царя
  choice: смиренный
  alternative: бедный; угнетённый; униженный; кроткий
  rationale: Контекст противопоставляет скромное прибытие царя обычной царской пышности, но еврейское слово охватывает также бедность и угнетённое положение. Эта широта не сводится к одной черте характера и отмечена в примечании.
- issue: Упоминание осла и молодого осла
  choice: поэтическое описание одного животного с двух сторон
  alternative: два отдельных животных
  rationale: Параллельное построение еврейской поэзии, вероятнее всего, уточняет одно животное, но формулировка основного текста сохраняет структуру оригинала, а примечание объясняет вероятную функцию параллелизма.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но не архаичным пророческим звучанием. Сохранены обращения-олицетворения, поэтический параллелизм и смысловая неоднозначность ключевых еврейских слов. Строчная буква в слове «царь» избегает внесения в сам перевод конфессионально обусловленной типографической интерпретации.
