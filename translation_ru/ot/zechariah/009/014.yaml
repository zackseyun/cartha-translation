base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
translation:
  language: ru
  text: И Яхве явится над ними, и стрела его вылетит, словно молния. Господь Яхве затрубит в шофар[a] и выступит в бурях юга[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шофар — рог, обычно бараний, которым подавали боевые и церемониальные сигналы.
    reason: cultural_note
  - marker: b
    text: 'Или: «в бурях Фемана». Еврейское слово может означать как юг, так и местность Феман.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עֲלֵיהֶם יֵרָאֶה
  choice: явится над ними
  rationale: Сохраняет пространственный образ теофании и не уточняет без необходимости, к кому именно относится местоимение.
- source_word: וְיָצָא כַבָּרָק חִצּוֹ
  choice: и, словно молния, вылетит Его стрела
  rationale: Передаёт стремительный выход стрелы и яркость сравнения; русский порядок слов делает образ естественным.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняет оба элемента сочетания: титул אֲדֹנָי и личное имя יְהוָה.'
- source_word: בַּשּׁוֹפָר יִתְקָע
  choice: затрубит в шофар
  rationale: Сохраняет конкретное название ритуально-сигнального рога; значение пояснено в сноске.
- source_word: וְהָלַךְ
  choice: и выступит
  rationale: В воинственном контексте означает движение вперёд; «выступит» естественно передаёт наступательное шествие, не усиливая образ до строевого марша.
- source_word: בְּסַעֲרוֹת תֵימָן
  choice: в бурях юга
  rationale: סְעָרוֹת передано как «бури», а תֵּימָן — в его нарицательном значении «юг»; топонимическая возможность сохранена в сноске.
theological_decisions:
- issue: Передача имён יְהוָה и אֲדֹנָי יְהוִה
  choice: Яхве ... Владыка Яхве
  alternative: Господь ... Владыка Господь / Господь Бог
  rationale: Так личное имя сохраняется в обоих случаях, а сочетание אֲדֹנָי יְהוִה не сводится к одному титулу.
- issue: Референт עֲלֵיהֶם («над ними»)
  choice: Сохранить местоимение без поясняющего уточнения
  alternative: 'Уточнить: над Божьим народом или против врагов'
  rationale: Непосредственный контекст благоприятствует Божьему народу, однако грамматика стиха сама по себе не называет референт; буквальное «над ними» сохраняет эту открытость.
- issue: Значение תֵּימָן
  choice: юг
  alternative: Феман
  rationale: В образе бурь возможно обычное обозначение южного направления, но слово также может быть топонимом; альтернативу следует отметить, а не устранять.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Синтаксис сохраняет стремительное развитие воинственно-теофанического образа; архаизмы избегаются, кроме закрепившегося библейского имени «Яхве» и культурного термина «шофар».
