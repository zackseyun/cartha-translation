  text: תֵּרֶ֨א אַשְׁקְל֜וֹן וְ/תִירָ֗א וְ/עַזָּה֙ וְ/תָחִ֣יל מְאֹ֔ד וְ/עֶקְר֖וֹן כִּֽי הֹבִ֣ישׁ מֶבָּטָ֑/הּ וְ/אָ֤בַד מֶ֨לֶךְ֙ מֵֽ/עַזָּ֔ה וְ/אַשְׁקְל֖וֹן לֹ֥א תֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
translation:
  language: ru
  text: Ашкелон увидит и испугается; Газа будет сильно корчиться, и Экрон тоже, потому что его надежда посрамлена[a]. У Газы не станет царя[b], и Ашкелон останется без жителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что его ожидание обмануто».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «царь погибнет (или исчезнет) из Газы».'
    reason: translation_ambiguity
lexical_decisions:
- source_word: תֵּרֶא
  choice: увидит это
  rationale: Форма qal, 3-е лицо, женский род, единственное число, с Ашкелоном как названием города; объект в еврейском тексте не выражен, но подразумевается предшествующий суд. Местоимение «это» естественно передаёт данный контекст по-русски.
- source_word: וְתִירָא
  choice: и испугается
  rationale: Глагол ירא обозначает страх как реакцию на увиденное; совершенный вид в форме будущего времени естественен для русского пророческого повествования.
- source_word: וְתָחִיל מְאֹד
  choice: будет сильно корчиться
  rationale: חיל передаёт сильную, телесно ощутимую муку, дрожь или родовые схватки. «Будет сильно корчиться» сохраняет образную силу выражения.
- source_word: וְעֶקְרוֹן
  choice: и Экрон — тоже
  rationale: Сказуемое «будет сильно корчиться» эллиптически относится и к Экрону; «тоже» делает эту связь ясной, не добавляя нового смысла.
- source_word: מֶבָּטָהּ
  choice: его надежда
  rationale: Существительное обозначает ожидание, надежду или то, на что смотрят с надеждой. В русском род местоимения согласован с названием «Экрон».
- source_word: הֹבִישׁ
  choice: посрамлена
  rationale: Hiphil от בוש здесь выражает крушение и посрамление ожидания. Пассивная конструкция естественна по-русски и не вводит не названного в тексте деятеля.
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  choice: Не станет царя в Газе
  rationale: Идиоматически передаёт исчезновение царя или царской власти из Газы; отсутствие артикля не требует указания на определённого царя.
- source_word: לֹא תֵשֵׁב
  choice: останется без жителей
  rationale: При названии города ישב означает «быть населённым». Выбранная формулировка естественна по-русски и ясно передаёт запустение.
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  choice: Ашкелон / Газа / Экрон
  rationale: Устоявшиеся русские формы географических названий.
theological_decisions: []
