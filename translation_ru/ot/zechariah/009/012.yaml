  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
translation:
  language: ru
  text: 'Возвращайтесь к крепости[a], узники надежды[b]! Даже сегодня Я возвещаю: возвращу тебе вдвое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к укреплённому месту»; «крепость» сохраняет конкретный образ защищённого места.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пленники надежды». Еврейское выражение образно: речь о тех, кто связан или удерживаем, но не лишён надежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Возвращайтесь
  rationale: Повелительная форма множественного числа от שוב. «Возвращайтесь» сохраняет как пространственный смысл, так и возможный призыв к восстановлению отношений с Богом, не делая один из оттенков единственным.
- source_word: לְבִצָּרוֹן
  choice: в крепость
  rationale: בצרון обозначает укреплённое, защищённое место. «Крепость» сохраняет конкретный образ и не сводит его сразу к отвлечённой «безопасности».
- source_word: אֲסִירֵי הַתִּקְוָה
  choice: узники надежды
  rationale: Буквально конструкция означает «узники надежды». Необычная метафора сохранена; «узники» в современном русском звучит естественнее и выразительнее, чем «пленники», не устраняя намеренной напряжённости образа.
- source_word: גַּם הַיּוֹם
  choice: Уже сегодня
  rationale: Передаёт подчёркнутую непосредственность обещания. Возможны также «даже сегодня» и «ещё сегодня», однако «уже сегодня» естественно звучит в данном пророческом объявлении.
- source_word: מַגִּיד
  choice: Я возвещаю
  rationale: Причастие от נגד в сочетании с последующим глаголом первого лица выражает совершаемое сейчас торжественное объявление. «Возвещаю» соответствует возвышенному, но понятному пророческому регистру.
- source_word: מִשְׁנֶה
  choice: вдвое больше
  rationale: מִשְׁנֶה может означать «двойное», «двойную долю» или «вдвое». В русском фраза «верну вдвое больше» естественно передаёт меру обещанного возмещения, хотя предмет возвращения, как и в еврейском тексте, прямо не назван.
- source_word: אָשִׁיב לָךְ
  choice: верну тебе
  rationale: Каузативная форма от שוב здесь имеет смысл возвращения или восстановления утраченного. «Верну» сохраняет связь с корнем שוב, уже прозвучавшим в повелении «возвращайтесь», и менее явно предполагает наказание или расчёт, чем «воздам».
theological_decisions:
- issue: К кому относится местоимение «тебе»
  choice: Сохранено обращение в единственном числе «тебе» без поясняющей подстановки имени.
  alternative: Передать как обращение ко всем узникам во множественном числе либо прямо назвать Сион или Иерусалим.
  rationale: Еврейский суффикс имеет форму женского рода единственного числа и, вероятно, относится к олицетворённому Сиону, Иерусалиму или народу завета. Сохранение единственного числа не устраняет намеренную неоднозначность.
- issue: Характер обещанного двойного возвращения
  choice: «верну тебе вдвое больше»
  alternative: «воздам тебе вдвойне» или «верну тебе двойную долю»
  rationale: Текст обещает обращение прежней участи и восстановление, но не уточняет, идёт ли речь о двойной доле, двойном возмещении или полноте благословения. Перевод не конкретизирует предмет обещания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены конкретный образ крепости, парадоксальная метафора «узники надежды» и смена обращения от множественного числа к женскому единственному; синтаксис сделан ясным без конфессиональной конкретизации.
