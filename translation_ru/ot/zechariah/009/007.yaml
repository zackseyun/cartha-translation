  text: וַ/הֲסִרֹתִ֨י דָמָ֜י/ו מִ/פִּ֗י/ו וְ/שִׁקֻּצָי/ו֙ מִ/בֵּ֣ין שִׁנָּ֔י/ו וְ/נִשְׁאַ֥ר גַּם ה֖וּא לֵֽ/אלֹהֵ֑י/נוּ וְ/הָיָה֙ כְּ/אַלֻּ֣ף בִּֽ/יהוּדָ֔ה וְ/עֶקְר֖וֹן כִּ/יבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
translation:
  language: ru
  text: Я удалю кровь из его уст и мерзости, что между его зубами[a]. Тогда и он останется для нашего Бога[b]; он будет как глава рода в Иудее, а Екрон — как иевусей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «мерзостями», вероятно, подразумевается нечто связанное с идолопоклонством или ритуальной нечистотой — возможно, пища, связанная с языческими жертвенными обрядами.
    reason: cultural_note
  - marker: b
    text: 'Или: «и он будет оставлен для нашего Бога»; возможен также перевод с оттенком пророческого понятия остатка: «и он будет остатком для нашего Бога».'
    reason: lexical_alternative
  - marker: c
    text: Сравнение с иевусеем, возможно, указывает на подчинение или включение Екрона в состав Иудеи. Точный смысл сравнения остаётся предметом толкования.
    reason: cross_reference
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Я удалю
  rationale: 'Каузативная форма глагола סור выражает действие Бога: Он устраняет то, что находится во рту филистимлянина. «Удалю» ясно и естественно сочетается с обоими дополнениями.'
- source_word: דָמָיו
  choice: кровь
  rationale: Сохранён конкретный образ крови во рту. Контекст допускает связь с употреблением крови в языческих обрядах или с виной за пролитую кровь, но основной текст не устраняет эту неоднозначность.
- source_word: שִׁקֻּצָיו
  choice: мерзости
  rationale: Слово обозначает нечто отвратительное, часто идольское или ритуально нечистое. «Мерзости» сохраняет сильную отрицательную окраску, не сужая значение до одного конкретного предмета или обряда.
- source_word: מִבֵּין שִׁנָּיו
  choice: из-за его зубов
  rationale: Русское выражение естественно передаёт буквальный образ извлечения чего-либо находящегося между зубами.
- source_word: וְנִשְׁאַר גַּם הוּא
  choice: Тогда и он останется
  rationale: Глагольный перевод непосредственно передаёт значение «остаться, быть оставленным», а частица גַּם и местоимение הוּא отражены словами «и он». Возможный пророческий оттенок «остатка» отмечен в сноске.
- source_word: לֵאלֹהֵינוּ
  choice: для нашего Бога
  rationale: Предлог ל выражает отношение или принадлежность; формулировка указывает на включение очищенного филистимлянина в число принадлежащих Богу Израиля.
- source_word: וְהָיָה כְּאַלֻּף בִּיהוּדָה
  choice: станет как глава рода в Иудее
  rationale: אַלּוּף здесь вероятнее всего обозначает вождя или главу родовой группы. «Глава рода» понятно современному читателю и передаёт положение признанного руководителя.
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  choice: а Екрон — как иевусей
  rationale: Сравнение сохранено без поясняющей вставки в основной текст. Вероятный смысл включения прежде чужого народа в Иудею раскрыт в сноске.
theological_decisions:
- issue: Положение очищенного филистимлянина
  choice: Сохранить образ очищения и принадлежности Богу, не уточняя, идёт ли речь об отдельном представителе или о Филистии в целом.
  alternative: Истолковать стих только как политическое подчинение либо прямо заменить единственное число собирательным обозначением народа.
  rationale: Удаление крови и мерзостей, а затем слова «и он… для нашего Бога» предполагают очищение и включение, а не только военное поражение. При этом грамматическое единственное число сохранено, чтобы не разрешать без необходимости вопрос о его представительном значении.
- issue: Оттенок «остатка» в וְנִשְׁאַר
  choice: В основном тексте употребить глагол «останется», а пророческий оттенок «остатка» отметить в сноске.
  alternative: 'Перевести существительным: «будет остатком для нашего Бога».'
  rationale: Еврейский текст использует глагол со значением «остаться, быть оставленным». Глагольный русский перевод точнее сохраняет форму и неоднозначность, тогда как сноска позволяет читателю увидеть значимый для пророческой речи мотив остатка.
- issue: Смысл сравнения Екрона с иевусеем
  choice: Сохранить краткое сравнение в тексте и пояснить вероятное значение в сноске.
  alternative: Прямо перевести как обещание присоединения Екрона к Иудее.
  rationale: Историческое включение иевусеев в население Иерусалима делает такой смысл вероятным, однако само сравнение не формулирует его явно.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой образности. Синтаксис сделан ясным для обычного читателя; конкретные образы рта и зубов сохранены. Формулировки не навязывают узкого ритуального или политического толкования.
