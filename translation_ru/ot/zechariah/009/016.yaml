reference: Zechariah 9:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ/הוֹשִׁיעָ֞/ם יְהוָ֧ה אֱלֹהֵי/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/צֹ֣אן עַמּ֑/וֹ כִּ֚י אַבְנֵי נֵ֔זֶר מִֽתְנוֹסְס֖וֹת עַל אַדְמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
translation:
  language: ru
  text: И спасёт их в тот день Яхве, их Бог, как стадо Своего народа, ибо они — камни венца[b], сияющие[a] над Его землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднятые высоко» либо «выставленные напоказ». Еврейский глагол может обозначать не только сияние, но и заметное возвышение или выставление, подобно знамени.'
    reason: lexical_alternative
  - marker: b
    text: '«Камни венца» можно также перевести как «драгоценные камни венца» или, менее вероятно, «посвящённые камни»: слово «венец» может быть связано и с посвящением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  choice: И спасёт их
  rationale: Hiphil глагола ישׁע означает «спасти, избавить»; «спасёт» сохраняет широкий смысл избавления и победы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: אֱלֹהֵיהֶם
  choice: их Бог
  rationale: Прямая передача формы с местоименным суффиксом, сохраняющая указание на отношения Бога с народом.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская формула для распространённого пророческого выражения.
- source_word: כְּצֹאן עַמּוֹ
  choice: как стадо Своего народа
  rationale: Сохраняет сравнительную конструкцию и коллективный пастырский образ; прописная буква указывает на Бога как обладателя стада.
- source_word: כִּי
  choice: ибо
  rationale: Передаёт пояснительную или причинную связь с предшествующим утверждением в возвышенном, но современно понятном регистре.
- source_word: אַבְנֵי נֵזֶר
  choice: камни венца
  rationale: Формально сохраняет поэтический образ; נֵזֶר обозначает венец или диадему и может также нести оттенок посвящения.
- source_word: מִתְנוֹסְסוֹת
  choice: сияющие
  rationale: В контексте драгоценных камней передаёт их заметный блеск, при этом альтернативный смысл поднятия или выставления напоказ указан в сноске.
- source_word: עַל אַדְמָתוֹ
  choice: над Его землёй
  rationale: «Земля» естественно передаёт אדמה в контексте восстановления страны; ближайшим референтом суффикса является Яхве.
theological_decisions:
- issue: Соотношение образов стада и камней венца
  choice: Спасённый народ сначала представлен как принадлежащее Богу стадо, а затем как камни венца, заметно сияющие над Его землёй.
  alternative: Оборот со стадом может описывать способ спасения («спасёт их, как спасают стадо»), а камни могут пониматься как посвящённые или памятные камни.
  rationale: Наиболее естественно синтаксис отождествляет спасаемых со стадом Божьего народа, после чего поэзия переходит к образу их славы; формулировка и сноски не устраняют иных возможных оттенков.
- issue: Референт местоимения в «над Его землёй»
  choice: Местоимение отнесено к Яхве.
  alternative: Земля может восприниматься как земля Его народа, находящаяся под Божьим владычеством.
  rationale: Бог является главным субъектом ближайшего контекста, однако смысл принадлежности земли народу косвенно не исключается.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Сохранены смена метафор, порядок основных образов и лексическая неоднозначность заключительной строки; все сноски отмечены в основном тексте.
