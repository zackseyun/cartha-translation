base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
translation:
  language: ru
  text: Ибо как велика его благость[a][c] и как велика его красота! Зерно взрастит юношей, а молодое вино — девушек[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как он благ и как прекрасен». В еврейском тексте стоят существительные: «его благость» и «его красота».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «девственниц»; здесь это слово, вероятно, выступает женским соответствием слову «юноши».'
    reason: lexical_alternative
  - marker: c
    text: Слова «его благость» и «его красота», вероятнее всего, относятся к Господу; их также понимают как указание на восстановленное состояние Израиля или на царя.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительную связь с предыдущим стихом и естественно вводит восклицание.
- source_word: מַה טּוּבוֹ
  choice: как велика его благость
  rationale: Передаёт восклицательную конструкцию и сохраняет отвлечённое существительное с суффиксом 3-го лица мужского рода.
- source_word: וּמַה יָפְיוֹ
  choice: и как велика его красота
  rationale: Сохраняет именной параллелизм еврейского текста и не сводит неоднозначное выражение к прилагательному.
- source_word: דָּגָן
  choice: хлеб
  rationale: В современном литературном русском «хлеб» естественно обозначает зерновые и их урожай в поэтической речи; речь не о готовом печёном хлебе.
- source_word: בַּחוּרִים
  choice: юношей
  rationale: Обозначает молодых мужчин и образует естественную пару с молодыми женщинами во второй части строки.
- source_word: יְנוֹבֵב
  choice: взрастит
  rationale: Передаёт редкий каузативный глагол со значением побуждения к росту и процветанию, сохраняя земледельческий образ.
- source_word: וְתִירוֹשׁ
  choice: а молодое вино
  rationale: תירוש обозначает молодое или свежее вино; союз передан как «а» для естественного русского параллелизма.
- source_word: בְּתֻלוֹת
  choice: девушек
  rationale: В паре с «юношами» слово обозначает молодых незамужних женщин; более узкое значение отмечено в сноске.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в выражениях «его благость» и «его красота»
  choice: В основном тексте референт оставлен неуточнённым; в контексте наиболее вероятно указание на Господа.
  alternative: Возможны указание на восстановленное состояние Израиля/Сиона либо на царя, упомянутого ранее.
  rationale: Еврейские суффиксы сами по себе не называют референта. Контекст спасительного действия Господа поддерживает основное понимание, но не позволяет устранять другие толкования из перевода.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим звучанием. Сохранены восклицание, параллелизм и неоднозначность местоименного референта. «Хлеб» употреблён в библейско-поэтическом значении зерна и урожая; «взрастит» поддерживает образ изобилия.
