  text: רָאִ֣יתִי הַ/לַּ֗יְלָה וְ/הִנֵּה אִישׁ֙ רֹכֵב֙ עַל ס֣וּס אָדֹ֔ם וְ/ה֣וּא עֹמֵ֔ד בֵּ֥ין הַ/הֲדַסִּ֖ים אֲשֶׁ֣ר בַּ/מְּצֻלָ֑ה וְ/אַחֲרָי/ו֙ סוּסִ֣ים אֲדֻמִּ֔ים שְׂרֻקִּ֖ים וּ/לְבָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
translation:
  language: ru
  text: 'Ночью я увидел: вот мужчина верхом на рыжем коне! Он стоял среди миртов, росших в низине[a], а позади него были кони — рыжие, пёстрые[b] и белые.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в глубине», «в лощине»; еврейское слово, вероятно, означает низкое или углублённое место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крапчатые», «гнедые»; точное обозначение масти в еврейском тексте неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי הַלַּיְלָה
  choice: Ночью я увидел
  rationale: Глагол ראה передан прямо как «увидел», без добавления значения «получил видение»; הַלַּיְלָה естественно обозначает ночное время.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к внезапно представшей сцене; «вот» сохраняет её живость и естественно звучит по-русски.
- source_word: אִישׁ רֹכֵב עַל סוּס אָדֹם
  choice: мужчина верхом на рыжем коне
  rationale: אִישׁ означает мужчину; конструкция с причастием описывает всадника. Для масти коня русское «рыжий» естественнее буквального «красный» и передаёт אָדֹם.
- source_word: וְהוּא עֹמֵד
  choice: Он стоял
  rationale: Местоимение с причастием создаёт фоновое, описательное состояние внутри видения.
- source_word: בֵּין הַהֲדַסִּים
  choice: среди миртов
  rationale: Множественное הֲדַסִּים обозначает мирты, а בֵּין при группе растений естественно передаётся как «среди».
- source_word: אֲשֶׁר בַּמְּצֻלָה
  choice: росших в низине
  rationale: Относительная конструкция относится к миртам. מְצֻלָה указывает на глубокое или низменное место; «низина» сохраняет топографический смысл без чрезмерной конкретизации.
- source_word: וְאַחֲרָיו
  choice: а позади него
  rationale: В данной пространственной сцене אַחֲרָיו естественно означает положение позади всадника.
- source_word: אֲדֻמִּים שְׂרֻקִּים וּלְבָנִים
  choice: рыжие, пёстрые и белые
  rationale: אֲדֻמִּים и לְבָנִים обозначают рыжую/красную и белую масти. Значение редкого שְׂרֻקִּים не вполне определённо; в тексте выбрано «пёстрые», а альтернативы отмечены в сноске.
theological_decisions:
- issue: Кем является мужчина на рыжем коне
  choice: 'Передать только прямо названное в стихе: «мужчина», не отождествляя его с иной фигурой.'
  alternative: Ангел Господень, символический всадник или предвечное явление Христа.
  rationale: Сам стих называет его אִישׁ, «мужчина». Возможное уточнение его личности в дальнейшем контексте не следует заранее вносить в перевод этого стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования и живостью пророческого видения. Синтаксис умеренно близок к еврейскому, но естественен по-русски; редкие или спорные топографический термин и название масти вынесены в сноски.
