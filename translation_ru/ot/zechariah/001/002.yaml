  yaml_path: translation/ot/zechariah/001/002.yaml
  text: Yahweh was very angry with your fathers[a].
translation:
  language: ru
  text: Яхве сильно разгневался на ваших отцов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших предков»; буквально: «ваших отцов».'
