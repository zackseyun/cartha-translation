lexical_decisions:
- source_word: קָצַף ... קָצֶף
  choice: сильно разгневался
  rationale: Однокоренные глагол и существительное образуют усилительную конструкцию, буквально «разгневался гневом». Наречие «сильно» естественно передаёт это усиление по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: עַל
  choice: на
  rationale: При глаголе гнева предлог обозначает тех, на кого направлен гнев; сочетание «разгневаться на» естественно для современного русского языка.
- source_word: אֲבֹתֵיכֶם
  choice: ваших отцов
  rationale: Сохранено буквальное значение «ваших отцов»; в данном пророческом контексте речь шире идёт о предках адресатов, что отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная пророческая формулировка. Усилительная древнееврейская конструкция передана идиоматически, без неестественного повтора.
