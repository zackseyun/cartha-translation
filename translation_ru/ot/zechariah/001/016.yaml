base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: ru
  text: 'Поэтому так говорит Господь: «Я вернулся в Иерусалим с состраданием; Мой дом[a] будет построен в Иерусалиме, — возвещает Господь Воинств, — и над Иерусалимом будет протянут мерный шнур».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм Господа.
    reason: Еврейское בֵּיתִי буквально означает «Мой дом»; в контексте пророчества о восстановлении Иерусалима речь идёт о храме.
lexical_decisions:
- source_word: שַׁבְתִּי
  choice: Я вновь обратился
  rationale: Глагол שׁוב буквально обозначает возвращение; в сочетании с направлением к городу здесь естественно передаёт восстановленное благосклонное присутствие Господа, не сводя смысл к физическому возвращению.
- source_word: בְּרַחֲמִים
  choice: с состраданием
  rationale: Множественная форма רַחֲמִים выражает глубокую милость и сострадание; выбран современный и ясный русский эквивалент.
- source_word: בֵּיתִי
  choice: Мой храм
  rationale: Буквально «Мой дом», но в данном контексте речь идёт о храме; явное обозначение устраняет неуместную для современного читателя бытовую двусмысленность.
- source_word: יְהוָה צְבָאוֹת
  choice: Господь Воинств
  rationale: Сохраняет образ Бога как Владыки небесных и земных воинств и ближе к צְבָאוֹת, чем традиционное транслитерированное «Саваоф».
- source_word: קוה
  choice: мерную верёвку
  rationale: В контексте строительства и восстановления קָו означает измерительный шнур; «мерная верёвка» конкретна и понятна современному читателю.
- source_word: יִנָּטֶה עַל
  choice: протянут ... над
  rationale: Сохраняет пассивную конструкцию и пространственный образ исходного текста, подразумевающий измерение города для восстановления.
theological_decisions:
- issue: Значение возвращения Господа к Иерусалиму
  choice: Я вновь обратился к Иерусалиму
  alternative: Я вернулся в Иерусалим
  rationale: Выбранная формулировка сохраняет идею возвращения и одновременно естественно выражает возобновление Божьей милости, не утверждая телесно-пространственного перемещения.
- issue: Референт местоименного суффикса בָּהּ
  choice: В нём
  alternative: В ней
  rationale: Грамматически суффикс женского рода относится к Иерусалиму, но по-русски название города мужского рода; «в нём» сохраняет референцию без искусственной персонификации.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Прямая речь оформлена ясно; заглавные буквы в «Мой» следуют принятому благоговейному оформлению речи Бога. Архаизмы и непрозрачная транслитерация «Саваоф» не используются.
