source:
  edition: WLC
  text: אַל תִּהְי֣וּ כַ/אֲבֹֽתֵי/כֶ֡ם אֲשֶׁ֣ר קָרְאֽוּ אֲלֵי/הֶם֩ הַ/נְּבִיאִ֨ים הָ/רִֽאשֹׁנִ֜ים לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֤וּבוּ נָא֙ מִ/דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים ו/מעלילי/כם הָֽ/רָעִ֑ים וְ/לֹ֥א שָׁמְע֛וּ וְ/לֹֽא הִקְשִׁ֥יבוּ אֵלַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
translation:
  language: ru
  text: 'Не будьте как ваши отцы[a], к которым обращались прежние пророки со словами: «Так говорит Яхве Воинств: Прошу, отвернитесь от своих злых путей и злых дел. Но они не слушали и не внимали Мне, — возвещает Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предки». Буквально по-еврейски: «отцы»; здесь имеются в виду прежние поколения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Не будьте
  rationale: Запретительная конструкция с אַל и имперфектом естественно передаётся прямым запретом «не будьте».
- source_word: כַאֲבֹתֵיכֶם
  choice: как ваши отцы
  rationale: Сохраняет буквальный образ еврейского אָבוֹת; в данном контексте речь идёт о прежних поколениях, что пояснено в сноске.
- source_word: קָרְאוּ אֲלֵיהֶם
  choice: к которым ... взывали
  rationale: Глагол קרא здесь обозначает обращённое к людям провозглашение пророческой вести; «взывали» сохраняет силу публичного настойчивого обращения.
- source_word: הַנְּבִיאִים הָרִאשֹׁנִים
  choice: прежние пророки
  rationale: הָרִאשֹׁנִים указывает на пророков более раннего времени; «прежние» не навязывает технического названия части канона.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: Так говорит Яхве Воинств
  rationale: Сохраняет формулу пророческого посланничества, личное имя יְהוָה и широкий образ צְבָאוֹת без сужения исключительно до земных армий.
- source_word: שׁוּבוּ נָא
  choice: Прошу, обратитесь
  rationale: שוב выражает нравственный поворот и возвращение, а частица נָא придаёт призыву оттенок настойчивой просьбы, а не обязательно значение времени «сейчас».
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: от ваших злых путей
  rationale: «Пути» сохраняют библейскую метафору образа жизни и поведения, а «злых» прямо передаёт רָעִים.
- source_word: וּמַעֲלִילֵיכֶם הָרָעִים
  choice: и от ваших злых дел
  rationale: מַעֲלָלִים обозначает поступки или деяния; «дел» естественно и конкретно передаёт нравственный смысл.
- source_word: וְלֹא שָׁמְעוּ וְלֹא הִקְשִׁיבוּ אֵלַי
  choice: Но они не слушали и не внимали Мне
  rationale: 'Различение двух близких глаголов сохранено: שמע — слушать, הקשיב — внимательно воспринимать, внимать. Перевод не сводит первый глагол прямо к «повиновались».'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт особую пророческую формулу утверждения и отличает её от предшествующего כֹּה אָמַר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное заветное имя; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному английскому консультационному слою.
- issue: Передача אָבוֹת
  choice: отцы
  alternative: предки
  rationale: Основной текст сохраняет мужской образ и буквальную форму еврейского слова, тогда как более широкое контекстуальное значение «предыдущие поколения» отмечено в сноске.
- issue: Смысл שׁוּבוּ в пророческом призыве
  choice: обратитесь
  alternative: вернитесь
  rationale: «Обратитесь» естественно выражает нравственный поворот, не устраняя заложенную в שוב идею возвращения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формулы «Так говорит» и «возвещает Яхве» разграничены; синтаксис сохраняет прямую речь и настойчивость Божьего призыва.
