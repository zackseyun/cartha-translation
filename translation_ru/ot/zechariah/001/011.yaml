  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
translation:
  language: ru
  text: 'Они ответили ангелу Яхве[a], стоявшему среди миртов, и сказали: «Мы обошли землю[b], и вот — вся земля пребывает в покое и безмятежности[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланнику Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы ходили по земле»; еврейский глагол может подразумевать движение по ней взад и вперёд.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сидит спокойно»; возможен также перевод: «вся страна пребывает в покое и безмятежности».'
    reason: literal_rendering_and_scope
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת ... וַיֹּאמְרוּ
  choice: ответили ... и сказали
  rationale: 'Сохранены оба глагола еврейского повествования: ענה обозначает ответ, а אמר вводит прямую речь.'
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: В контексте видения מַלְאָךְ естественно означает ангела, хотя его основное значение «посланник» отмечено в сноске; имя יהוה передано как «Яхве».
- source_word: הָעֹמֵד
  choice: стоявшему
  rationale: Причастие описывает положение ангела во время происходящего; форма прошедшего времени естественна в русском повествовании.
- source_word: בֵּין הַהֲדַסִּים
  choice: среди миртов
  rationale: בֵּין буквально означает «между», но при множестве деревьев по-русски естественнее «среди»; הֲדַסִּים — мирты.
- source_word: הִתְהַלַּכְנוּ בָאָרֶץ
  choice: мы обошли всю землю
  rationale: Порода hitpael передаёт движение по территории, возможно взад и вперёд. «Обошли» сохраняет идею широкого обследования, не добавляя явно военного смысла слова «патрулировали»; «всю» естественно передаёт подразумеваемый охват и согласуется со следующим כָּל־הָאָרֶץ.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Обычный современный русский способ сохранить указательно-эмфатическую функцию הִנֵּה и пророческий тон.
- source_word: כָל־הָאָרֶץ
  choice: вся земля
  rationale: В отчёте небесных дозорных выражение имеет всеобщий охват; возможное значение «вся страна» отмечено в сноске.
- source_word: יֹשֶׁבֶת וְשֹׁקָטֶת
  choice: пребывает в покое и безмятежности
  rationale: Перевод естественно выражает устойчивое, ничем не тревожимое состояние земли, сохраняя два согласованных определения и не сводя их к одному слову.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: В контексте видения традиционное и естественное обозначение сверхъестественного вестника — «ангел»; сноска сохраняет лексическую возможность «посланник», не определяя сверх текста его природу или тождество.
- issue: Характер покоя всей земли
  choice: пребывает в покое и безмятежности
  alternative: 'буквально: «сидит и спокойна»'
  rationale: Фраза описывает внешнюю устойчивость и отсутствие тревоги. Перевод не уточняет, оценивается ли такое положение положительно или служит напряжённым фоном для бедствия Иерусалима.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис прям и понятен; сохранены повтор «ответили ... и сказали» и указательное «и вот». Образное еврейское «сидит» раскрыто идиоматически, а буквальная форма дана в сноске.
