  source_fidelity: 'В основном перевод точно передаёт синтаксис и лексику стиха: «ангел Яхве», «среди миртов», «и вот», а также двучленная характеристика спокойного состояния земли. Однако «обошли всю землю» вводит «всю» уже в первую часть сообщения, тогда как בָאָרֶץ значит «по земле / в земле»; всеобщий охват прямо выражен лишь далее, в כָּל־הָאָרֶץ. Это уточнение лучше не добавлять в основной текст.'
