  source_fidelity: 'Перевод точно передаёт структуру и содержание еврейского текста: ангел обращается к пророку с повелением возгласить пророческую формулу; сохранены «Так говорит», имя Яхве, образ «Воинств», повтор предлогов при Иерусалиме и Сионе и усиление קִנֵּאתִי ... קִנְאָה גְדוֹלָה. «Говоривший со мной» корректно передаёт идиому הַדֹּבֵר בִּי в данном контексте.'
