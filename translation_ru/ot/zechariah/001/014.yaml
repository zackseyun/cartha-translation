  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
translation:
  language: ru
  text: 'И ангел, говоривший со мной, сказал мне: «Провозгласи: „Так говорит Яхве Воинств: Я ревную об Иерусалиме и о Сионе великой ревностью[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Я пылаю великой ревностью об Иерусалиме и о Сионе». В еврейском тексте для усиления употреблены однокоренные глагол и существительное.'
    reason: Лексема קנא может выражать как ревность, так и горячую ревностную преданность; примечание сохраняет эту смысловую широту и поясняет внутреннее усиление.
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  choice: ангел, говоривший со мной
  rationale: Оборот דֹּבֵר בִּי в видениях Захарии означает общение с пророком, а не речь внутри него; причастная конструкция передана естественным русским оборотом.
- source_word: קְרָא לֵאמֹר
  choice: Провозгласи
  rationale: В пророческом контексте קרא обозначает публичное возвещение. Отдельное «говоря» по-русски избыточно, поскольку содержание возглашения непосредственно следует далее.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена устойчивая торжественная формула пророческого посланничества.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — буквально как «Воинств», что сохраняет военный и небесно-космический образ исходного выражения.
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: Я ревную ... великой ревностью
  rationale: Однокоренные глагол и существительное воспроизведены для сохранения усиления и напряжённого образа Божьей ревности; перфект в данной прямой декларации выражает актуальное, твёрдо установленное состояние.
- source_word: לִירוּשָׁלִַם וּלְצִיּוֹן
  choice: об Иерусалиме и о Сионе
  rationale: Повтор предлога отражает повтор לְ и подчёркивает оба наименования священного города.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога, непосредственно присутствующее в еврейском тексте, и не подменяет его титулом.
- issue: Передача קנא / קנאה применительно к Богу
  choice: ревную / ревностью
  alternative: пылаю ревностью; ревностно забочусь
  rationale: Формулировка сохраняет прямой язык божественной ревности и его заветное богословское напряжение, не смягчая его до одной лишь усердной заботы.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим звучанием. Оборот «ревную ... великой ревностью» намеренно слегка маркирован: он передаёт повтор корня и не устраняет богословскую напряжённость оригинала.'
