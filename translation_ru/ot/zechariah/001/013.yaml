lexical_decisions:
- source_word: וַיַּעַן
  choice: отвечал
  rationale: Глагол ענה в повествовательной форме естественно означает ответ; форма несовершенного вида согласуется с русским стилем рассказа о видении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: הַמַּלְאָךְ
  choice: ангелу
  rationale: В контексте видения זכרии מַלְאָךְ обозначает сверхъестественного посланника; дательный падеж естественно оформляет адресата ответа после русского глагола «отвечать».
- source_word: הַדֹּבֵר בִּי
  choice: говорившему со мной
  rationale: Причастная конструкция указывает на продолжающееся общение ангела с пророком; «со мной» естественно передаёт значение בִּי в данном обороте.
- source_word: דְּבָרִים טוֹבִים
  choice: добрыми словами
  rationale: Прямо сохраняет широкий смысл благих, благоприятных слов, не сужая его до одной эмоциональной окраски.
- source_word: דְּבָרִים נִחֻמִים
  choice: словами утешения
  rationale: Передаёт значение корня נחם и сохраняет повтор существительного «слова», важный для еврейского параллелизма.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор слова «слова», параллелизм двух выражений и личное имя Яхве; тире делает еврейское пояснительное соположение естественным по-русски.
