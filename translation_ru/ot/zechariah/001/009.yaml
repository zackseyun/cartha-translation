base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
translation:
  language: ru
  text: 'Тогда я сказал: «Что это такое, господин мой?[a]» И ангел, говоривший со мной[b], сказал мне: «Я покажу тебе, что это такое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сударь». Еврейское אֲדֹנִי здесь служит почтительным обращением и в данном контексте не относится к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «говорящий во мне». В данном видении это еврейское выражение означает, что ангел говорил с пророком или обращался к нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я спросил
  rationale: Форма продвигает повествование, а глагол «спросил» естественно передаёт функцию реплики, непосредственно содержащей вопрос.
- source_word: מָה אֵלֶּה
  choice: Что это
  rationale: Вопросительное מָה с указательным אֵלֶּה требует установить, что представляют собой увиденные фигуры. Русское «Что это?» передаёт смысл естественно и без лишнего существительного.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение к истолковывающему ангелу, а не божественное имя. Такой порядок слов сохраняет возвышенный тон и при этом звучит как обращение.
- source_word: הַמַּלְאָךְ
  choice: ангел
  rationale: Хотя מַלְאָךְ может означать также «вестник», в контексте видения речь идёт о небесном истолкователе.
- source_word: הַדֹּבֵר בִּי
  choice: говоривший со мной
  rationale: Буквально предлог בְּ означает «в», но повторяющееся у Захарии выражение описывает общение ангела с пророком; буквальное «говоривший во мне» создало бы ложное впечатление внутренней речи.
- source_word: וַיֹּאמֶר אֵלַי
  choice: ответил мне
  rationale: Буквально «сказал мне»; в данном диалоге естественное русское «ответил» ясно передаёт связь с заданным вопросом, не добавляя нового содержания.
- source_word: אֲנִי אַרְאֶךָּ
  choice: Я покажу тебе
  rationale: Порода hifil глагола ראה означает «дать увидеть, показать»; явное אֲנִי сохраняется личным местоимением «Я».
- source_word: מָה הֵמָּה אֵלֶּה
  choice: что это
  rationale: Русская конструкция естественно передаёт повтор вопроса об отождествлении увиденного; более буквальное «что они, эти» было бы неясным и неестественным.
theological_decisions:
- issue: Значение и адресат אֲדֹנִי
  choice: Почтительное обращение «господин мой» к ангелу-истолкователю
  alternative: «сударь»; «мой господин»; понимание как божественного титула
  rationale: Контекст представляет собеседником пророка ангела. Перевод сохраняет почтительность, но примечание предохраняет от отождествления обращения с божественным именем или титулом.
- issue: Смысл בִּי в выражении הַדֹּבֵר בִּי
  choice: Идиоматическое «говоривший со мной»
  alternative: Буквальное «говоривший во мне»
  rationale: В контексте видения выражение обозначает общение ангела с пророком. Буквальный вариант мог бы без достаточных оснований внести идею внутреннего внушения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Диалог передан ясно и естественно; архаизмы исключены. Порядок «господин мой» сохраняет достоинство обращения, а примечания отмечают подлинные лексические особенности еврейского текста.
