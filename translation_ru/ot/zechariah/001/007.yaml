base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
translation:
  language: ru
  text: 'В двадцать четвёртый день одиннадцатого месяца, то есть месяца шевата, во второй год Дария слово Яхве пришло к Захарии, сыну Берехии, сыну пророка Иддо:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: В двадцать четвёртый день
  rationale: Естественная русская форма датировки точно передаёт еврейское сочетание предлога времени и числительного.
- source_word: לְעַשְׁתֵּי עָשָׂר חֹדֶשׁ הוּא חֹדֶשׁ שְׁבָט
  choice: одиннадцатого месяца — месяца шевата
  rationale: Тире естественно передаёт пояснительное отождествление הוּא; название месяца транслитерировано в принятой русской форме.
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: во второй год правления Дария
  rationale: «Год правления» ясно передаёт формулу царского летосчисления, не добавляя титула, отсутствующего в стихе.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: к … пришло слово Яхве
  rationale: Сохранены ключевой образ «слова» и направление откровения; порядок слов сделан естественным для современного русского языка.
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָהוּ בֶּן עִדּוֹא
  choice: Захарии, сыну Берехии, сыну Иддо
  rationale: Генеалогическая цепочка воспроизведена непосредственно, с традиционными русскими формами библейских имён.
- source_word: הַנָּבִיא
  choice: к пророку Захарии
  rationale: В основном тексте титул отнесён к Захарии, как наиболее вероятно в формуле представления адресата; возможное отнесение к Иддо отмечено в сноске.
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Перед последующей прямой речью русское двоеточие естественно выполняет функцию еврейской вводной формулы «сказать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: К кому относится определение הַנָּבִיא («пророк»)?
  choice: к Захарии
  alternative: к Иддо
  rationale: Наиболее естественно понимать его как титул главного названного лица и получателя слова; однако из-за положения определения после имени Иддо грамматическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой формулы. Синтаксис облегчён без устранения генеалогии и формулы получения откровения; архаические обороты вроде «было слово Господне» не использованы.
