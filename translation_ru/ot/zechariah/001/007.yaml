revisions:
- from: 'В двадцать четвёртый день одиннадцатого месяца — месяца шевата, во второй год правления Дария, к пророку Захарии, сыну Берехии, сыну Иддо[a], пришло слово Яхве[b]:'
  to: 'В двадцать четвёртый день одиннадцатого месяца, то есть месяца шевата, во второй год Дария слово Яхве пришло к Захарии, сыну Берехии, сыну пророка Иддо:'
  rationale: Исправлена связь определения «пророк» с Иддо, устранена дефектная сноска и приведена к более прямой форме датировка. Пояснительный характер названия месяца передан явно; заключительное двоеточие естественно передаёт вводную формулу «говоря» перед следующей речью.
