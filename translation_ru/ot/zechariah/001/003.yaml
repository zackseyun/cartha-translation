  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
translation:
  language: ru
  text: 'Поэтому скажи им: «Так говорит Яхве Воинств: „Вернитесь ко Мне[a], — возвещает Яхве Воинств, — и Я вернусь к вам“, — говорит Яхве Воинств».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обратитесь ко Мне… и Я обращусь к вам». В еврейском тексте в обеих частях употреблён один и тот же глагол, что подчёркивает взаимность восстановления отношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Поэтому скажи им
  rationale: Союз связывает повеление с предшествующим сообщением о гневе Яхве; «поэтому» естественно передаёт смысловое следствие в русском контексте.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула, сохраняющая торжественный и ясный современный стиль.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — широким традиционным соответствием «Воинств», не ограничивающим значение земными армиями.
- source_word: שׁוּבוּ אֵלַי ... וְאָשׁוּב אֲלֵיכֶם
  choice: Вернитесь ко Мне ... и Я вернусь к вам
  rationale: Повтор одного глагола שׁוב сохранён, чтобы передать намеренную взаимность обращения и восстановления отношений.
- source_word: נְאֻם
  choice: возвещает
  rationale: Передаёт авторитетную пророческую формулу и позволяет отличить её от последующего אָמַר — «говорит».
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: говорит Яхве Воинств
  rationale: Сохраняет повтор формулы божественной речи и различие между אָמַר и נְאֻם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл и взаимность שׁוב
  choice: Вернитесь ко Мне ... и Я вернусь к вам
  alternative: Обратитесь ко Мне ... и Я обращусь к вам
  rationale: Выбор сохраняет один и тот же русский глагол в обеих частях и не сводит многозначное заветное обращение только к внутреннему покаянию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в местоимениях «Мне», «Я» употреблены как уважительная издательская норма. Тройное повторение титула сохранено.
