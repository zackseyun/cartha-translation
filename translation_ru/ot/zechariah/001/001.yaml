  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁמִינִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔ה בֶּן עִדּ֥וֹ הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/001.yaml
  text: In the eighth month[a], in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet, saying,
translation:
  language: ru
  text: 'В восьмом месяце, во второй год правления Дария, слово Яхве[a] было обращено к Захарии, сыну Берехии, сыну Иддо, пророку:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Яхве — личное имя Бога; в еврейском тексте оно записано четырьмя согласными: יהוה (YHWH).'
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: В восьмом месяце
  rationale: Естественная русская передача временной формулы с порядковым числительным; сохраняет структуру датировки.
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: во второй год правления Дария
  rationale: Оборот обозначает год царствования; слово «правления» ясно передаёт смысл формулы и естественно звучит по-русски.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: слово Яхве было обращено к
  rationale: Пророческая формула сообщает о получении откровения. Русский оборот естественен и не превращает «слово» в действующее лицо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: זְכַרְיָה
  choice: Захарии
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בֶּן בֶּרֶכְיָה בֶּן עִדּוֹ
  choice: сыну Берехии, сыну Иддо
  rationale: Сохраняет повторение родственного обозначения и допускаемую синтаксисом родословную цепочку.
- source_word: הַנָּבִיא
  choice: пророку
  rationale: Определённое существительное передано обычным русским наименованием служения; его положение рядом с Захарией принято как характеристика Захарии.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В современном русском двоеточие естественно вводит последующую прямую речь и функционально передаёт еврейское «говоря».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя YHWH. Форма «Яхве» сохраняет имя и отражает наиболее распространённую научную реконструкцию произношения.
- issue: К кому относится определение הַנָּבִיא («пророк»)?
  choice: 'к Захарии: «к пророку Захарии»'
  alternative: 'к Иддо: «к Захарии, сыну Берехии, сыну пророка Иддо»'
  rationale: Возможна формальная привязка к ближайшему имени Иддо, однако в заголовочной формуле наиболее естественно видеть обозначение самого Захарии; перестановка в русском делает выбранное понимание явным, поэтому альтернативная привязка отмечена в решениях.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого заголовка. Датировочная формула сохранена, но уточнена словом «правления». Инфинитив לֵאמֹר передан двоеточием как естественным русским способом введения следующей речи.
