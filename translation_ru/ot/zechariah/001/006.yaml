source:
  edition: WLC
  text: אַ֣ךְ דְּבָרַ֣/י וְ/חֻקַּ֗/י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הֲ/ל֥וֹא הִשִּׂ֖יגוּ אֲבֹתֵי/כֶ֑ם וַ/יָּשׁ֣וּבוּ וַ/יֹּאמְר֗וּ כַּ/אֲשֶׁ֨ר זָמַ֜ם יְהוָ֤ה צְבָאוֹת֙ לַ/עֲשׂ֣וֹת לָ֔/נוּ כִּ/דְרָכֵ֨י/נוּ֙ וּ/כְ/מַ֣עֲלָלֵ֔י/נוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽ/נוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
translation:
  language: ru
  text: 'Но разве Мои слова и Мои постановления, которые Я повелел Моим слугам, пророкам,[a] не настигли ваших отцов? Тогда они обратились[b] и сказали: «Как Яхве Воинств[c] замыслил поступить с нами по нашим путям и по нашим делам, так Он с нами и поступил».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые Я повелел через Моих слуг, пророков».'
    reason: Еврейская конструкция буквально называет пророков получателями повеления, но по контексту они также выступают посредниками, передающими Божьи слова.
  - marker: b
    text: 'Или: «раскаялись»; буквально также возможно: «вернулись».'
    reason: Еврейский глагол может обозначать возвращение, обращение или, в соответствующем контексте, покаяние.
  - marker: c
    text: 'Традиционно: «Господь Саваоф» или «Господь воинств».'
    reason: Примечание сохраняет знакомые традиционные варианты титула יְהוָה צְבָאוֹת.
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: 'Передаёт противопоставление предшествующей мысли: отцы и пророки умерли, но Божьи слова исполнились.'
- source_word: דְּבָרַי וְחֻקַּי
  choice: Мои слова и Мои постановления
  rationale: Сохраняет различие между Божьими речениями и установленными Им предписаниями; «постановления» естественнее в современном русском, чем «уставы» в данном контексте.
- source_word: צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים
  choice: которые Я заповедал Моим слугам-пророкам
  rationale: Следует прямому синтаксису еврейского текста, не вводя в основной текст интерпретирующее «через».
- source_word: הִשִּׂיגוּ
  choice: настигли
  rationale: Сохраняет образ Божьих слов и приговоров, которые догнали предков и исполнились над ними.
- source_word: וַיָּשׁוּבוּ
  choice: они обратились
  rationale: «Обратились» сохраняет смысл поворота или возвращения и допускает покаянный оттенок, не утверждая его однозначно.
- source_word: זָמַם
  choice: замыслил
  rationale: Передаёт целенаправленное намерение; слово уместно в dignified современном русском.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה как «Яхве» и переводит צְבָאוֹת прозрачно, сохраняя военный и небесный масштаб титула.
- source_word: כִדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  choice: по нашим путям и по нашим делам
  rationale: Сохраняет параллелизм и нравственный смысл образа путей как образа жизни и дел как поступков.
- source_word: כֵּן עָשָׂה אִתָּנוּ
  choice: так Он с нами и поступил
  rationale: Естественно передаёт итоговое признание точного соответствия Божьего действия Его замыслу.
theological_decisions:
- issue: Следует ли וַיָּשׁוּבוּ прямо переводить как покаяние
  choice: они обратились
  alternative: они раскаялись; они вернулись
  rationale: Глагол שׁוּב может обозначать как возвращение или поворот, так и покаяние. Контекст сообщает признание справедливости Божьего суда, но не требует однозначно утверждать полноту внутреннего покаяния.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога; транслитерация сохраняет его как имя и не смешивает с титулом «Господь».
- issue: Смысл образа «настигли»
  choice: сохранён буквальный образ исполнения Божьих слов
  alternative: исполнились над вашими отцами
  rationale: Форма הִשִּׂיגוּ изображает слова и постановления как догоняющие людей; сохранение образа подчёркивает неизбежность объявленного суда.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сохраняет риторический вопрос и параллелизм оригинала; прописные местоимения при обращении Бога к Себе использованы как принятая русская религиозно-издательская норма.
