base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
translation:
  language: ru
  text: И Я весьма разгневан[a] на народы, живущие безмятежно[b], потому что Я гневался лишь немного[c], а они усугубили бедствие[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «гневаюсь великим гневом».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «на самодовольные народы» или «на народы, живущие беспечно».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «Я гневался недолгое время»; древнееврейское выражение может указывать не на степень, а на продолжительность гнева.'
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «они помогли ко злу», то есть содействовали бедствию и усилили его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל ... קֹצֵף
  choice: И Я весьма разгневан
  rationale: Сочетание существительного «великий гнев» с причастием от того же корня усиливает высказывание. Наречная передача естественна по-русски и сохраняет значение сильного, продолжающегося гнева.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В контексте речь идёт об иноземных народах, угнетавших Иудею; «народы» прямо передаёт значение без привнесения более поздней религиозной терминологии.
- source_word: הַשַּׁאֲנַנִּים
  choice: живущие безмятежно
  rationale: Слово обозначает пребывание в покое и безопасности, с возможным оттенком самодовольной беспечности. Основной вариант сохраняет образ, а оттенок отмечен в сноске.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: Относительная частица здесь вводит основание Божьего гнева; причинная связь естественно выражается русским союзом «потому что».
- source_word: קָצַפְתִּי מְעָט
  choice: Я гневался лишь немного
  rationale: מְעָט наиболее вероятно ограничивает степень гнева, что создаёт контраст с чрезмерными действиями народов. Возможное значение ограниченной продолжительности сохранено в сноске.
- source_word: וְהֵמָּה
  choice: а они
  rationale: Выраженное местоимение имеет эмфатический характер, а союз в контексте передаёт противопоставление между ограниченным Божьим гневом и действиями народов.
- source_word: עָזְרוּ לְרָעָה
  choice: усугубили бедствие
  rationale: Буквально выражение означает «помогли ко злу/бедствию» и в контексте указывает, что народы содействовали бедствию и усилили его сверх меры.
theological_decisions:
- issue: Соотношение Божьего гнева и ответственности народов
  choice: Сохранён контраст между ограниченным Божьим гневом на Свой народ и тем, что другие народы усугубили постигшее его бедствие.
  alternative: Народы лишь исполнили Божий суд, не выходя за его пределы.
  rationale: Противительная конструкция «Я… лишь немного, а они…» возлагает на народы ответственность за чрезмерное причинение бедствия, не отрицая при этом Божьего гнева.
- issue: Значение מְעָט
  choice: 'Ограниченная степень гнева: «лишь немного».'
  alternative: 'Ограниченная продолжительность: «недолгое время».'
  rationale: Степенное значение лучше соответствует непосредственному контрасту, однако древнееврейская формулировка допускает временное понимание, поэтому оно указано в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Повтор корня «гнев» в древнееврейском тексте передан естественным русским усилением; неоднозначности הַשַּׁאֲנַנִּים, מְעָט и идиомы עָזְרוּ לְרָעָה сохранены в сносках.
