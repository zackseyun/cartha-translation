  text: אֲבֽוֹתֵי/כֶ֖ם אַיֵּה הֵ֑ם וְ/הַ֨/נְּבִאִ֔ים הַ/לְ/עוֹלָ֖ם יִֽחְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/005.yaml
  text: Your fathers—where are they? And the prophets[a], do they live forever?
translation:
  language: ru
  text: Ваши отцы — где они? И пророки — разве они живут вечно?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  choice: ваши отцы
  rationale: Буквальное соответствие форме «отцы ваши»; в контексте речь идёт о прежних поколениях адресатов. Русское «отцы» сохраняет родственный образ и риторическую прямоту еврейского текста.
- source_word: אַיֵּה הֵם
  choice: где они?
  rationale: Вопросительное наречие с явно выраженным местоимением; естественная русская конструкция сохраняет эмфатический риторический вопрос.
- source_word: וְהַנְּבִאִים
  choice: И пророки
  rationale: Сохраняются простой союз, определённость существительного и параллелизм с первой частью стиха.
- source_word: הַלְעוֹלָם
  choice: вечно
  rationale: Передаёт значение неограниченной продолжительности в риторическом вопросе.
- source_word: יִחְיוּ
  choice: живут
  rationale: Имперфект Qal допускает незавершённое или обобщённое значение; настоящее время по-русски естественно выражает вопрос о том, продолжают ли пророки жить бесконечно.
theological_decisions:
- issue: Референт и риторическая сила упоминания пророков
  choice: Стих подчёркивает смертность как прежних поколений, так и пророков.
  alternative: Можно понимать вторую часть лишь как подготовку к контрасту следующего стиха между смертными вестниками и сохраняющей силу Божьей речью.
  rationale: Сам еврейский текст данного стиха спрашивает, живут ли пророки вечно, но ещё не формулирует вывод о непреходящей силе их вести; этот вывод не следует преждевременно вносить в перевод.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный и риторически параллельный строй. Частица «разве» естественно обозначает ожидаемый отрицательный ответ, уже заложенный в контекстном риторическом вопросе.
