  text: וַ/יַּ֣עַן מַלְאַךְ יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֣ה צְבָא֔וֹת עַד מָתַ֗י אַתָּה֙ לֹֽא תְרַחֵ֣ם אֶת יְרוּשָׁלִַ֔ם וְ/אֵ֖ת עָרֵ֣י יְהוּדָ֑ה אֲשֶׁ֣ר זָעַ֔מְתָּה זֶ֖ה שִׁבְעִ֥ים שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
translation:
  language: ru
  text: 'Тогда Ангел Яхве ответил и сказал[a]: «Яхве Воинств! Доколе Ты не будешь миловать Иерусалим и города Иудеи, на которые Ты гневаешься вот уже семьдесят лет?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вестник Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел»; в контексте пророческого видения естественно «Ангел». Имя יְהוָה передано как «Яхве».
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ответил и сказал
  rationale: Сохранены оба глагола исходного текста и характерная для библейского повествования формула речи.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Формально передаёт титул с צְבָאוֹת («воинства, сонмы»), не сужая его до одного современного значения «армии».
- source_word: עַד מָתַי
  choice: доколе
  rationale: Краткая, понятная и достойная формула вопроса-жалобы, соответствующая значению «как долго?».
- source_word: לֹא תְרַחֵם
  choice: Ты не будешь миловать
  rationale: רחם выражает милость и сострадание; «миловать» сохраняет отрицательную глагольную конструкцию и хорошо сочетается с объектами — городом и городами.
- source_word: אֲשֶׁר זָעַמְתָּה
  choice: на которые Ты гневаешься
  rationale: זעם обозначает гнев или негодование. Настоящее время передаёт состояние, продолжающееся к моменту молитвы, а относительное местоимение грамматически соотнесено с Иерусалимом и городами Иудеи.
- source_word: זֶה שִׁבְעִים שָׁנָה
  choice: вот уже семьдесят лет
  rationale: Естественно по-русски выражает длительность вплоть до настоящего момента и передаёт указательно-временную силу זֶה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, прямо присутствующее в еврейском тексте.
- issue: Идентичность מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  alternative: вестник Яхве
  rationale: Перевод не отождествляет этого персонажа с какой-либо иной личностью и сохраняет неразрешённость богословского вопроса.
- issue: Сфера Божьего гнева в אֲשֶׁר זָעַמְתָּה
  choice: на которые Ты гневаешься
  alternative: которыми Ты негодуешь; на которые Ты гневался
  rationale: Относительное предложение оставлено связанным с Иерусалимом и городами Иудеи; продолжающийся временной оттенок уместен при последующем «вот уже семьдесят лет».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Доколе» и «Яхве Воинств» сохраняют достоинство и формальную плотность оригинала, оставаясь понятными; обращение обозначено восклицанием без добавленного «о».
