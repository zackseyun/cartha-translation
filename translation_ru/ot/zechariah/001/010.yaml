id: ZEC.1.10
reference: Zechariah 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּ֗עַן הָ/אִ֛ישׁ הָ/עֹמֵ֥ד בֵּין הַ/הַדַסִּ֖ים וַ/יֹּאמַ֑ר אֵ֚לֶּה אֲשֶׁ֣ר שָׁלַ֣ח יְהוָ֔ה לְ/הִתְהַלֵּ֖ךְ בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/010.yaml
  text: Then the man who was standing among the myrtle trees answered and said[b][a], “These are the ones whom Yahweh has sent to walk throughout the earth.”
translation:
  language: ru
  text: 'Тогда человек, стоявший среди миртов, ответил и сказал: «Это те, кого Яхве послал обходить[a] землю[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «патрулировать» или «ходить по».
    reason: lexical_alternative
  - marker: b
    text: Или «страну» — в зависимости от того, имеется ли в виду весь мир или определённая территория.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן … וַיֹּאמַר
  choice: ответил и сказал
  rationale: Сохраняет оба глагола еврейской повествовательной формулы; в торжественном контексте видения такая конструкция уместна по-русски.
- source_word: הָאִישׁ הָעֹמֵד
  choice: человек, стоявший
  rationale: Причастный оборот естественно передаёт определительное значение и положение этой конкретной мужской фигуры в сцене.
- source_word: בֵּין הַהַדַסִּים
  choice: среди миртов
  rationale: בֵּין буквально указывает на положение между предметами, но при множестве деревьев русское «среди» звучит естественнее; הֲדַסִּים — мирты.
- source_word: אֵלֶּה אֲשֶׁר
  choice: это те, кого
  rationale: Указательное слово относится к ранее показанным одушевлённым участникам видения; конструкция сохраняет эту отсылку без лишнего уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לְהִתְהַלֵּךְ
  choice: обходить
  rationale: Форма хитпаэль от הלך выражает передвижение по местности, хождение туда и сюда. «Обходить» сохраняет образ движения, не делая военный оттенок обязательным.
- source_word: בָּאָרֶץ
  choice: землю
  rationale: אֶרֶץ допускает значения «земля» и «страна». В широком контексте видения основным выбрано «землю», но локальное значение сохранено в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» прямо отражает тетраграмматон и не подменяет его титулом.
- issue: Масштаб поручения посланных
  choice: землю
  alternative: страну
  rationale: Контекст видения допускает всемирный охват, однако многозначность אֶרֶץ не позволяет исключить более локальное понимание; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «ответил и сказал» намеренно сохраняет повтор исходного текста; остальной синтаксис сделан естественным и ясным.
