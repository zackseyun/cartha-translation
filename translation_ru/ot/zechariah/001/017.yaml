  variant: modern literary Russian
source:
  edition: WLC
  text: ע֣וֹד קְרָ֣א לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֛וֹד תְּפוּצֶ֥ינָה עָרַ֖/י מִ/טּ֑וֹב וְ/נִחַ֨ם יְהוָ֥ה עוֹד֙ אֶת צִיּ֔וֹן וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
translation:
  language: ru
  text: 'Снова провозгласи: «Так говорит Яхве Воинств: Мои города вновь будут изобиловать благами[a]; Яхве снова утешит Сион и снова изберёт Иерусалим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои города вновь широко раскинутся благодаря благополучию»; возможно также: «вновь переполнятся благами».'
    reason: Еврейский глагол допускает как пространственное значение распространения, так и контекстуальный оттенок переполнения или изобилия.
lexical_decisions:
- source_word: עוֹד
  choice: снова / вновь
  rationale: Повторяющееся наречие указывает на возобновление Божьих благих действий после суда. Варьирование «снова / вновь» естественно для русского языка и сохраняет повтор во всех значимых позициях.
- source_word: קְרָא לֵאמֹר
  choice: провозгласи
  rationale: Императив требует публично возвестить последующее пророческое слово. По-русски «провозгласи» естественно передаёт и глагол призыва, и функцию לֵאמֹר, не нуждаясь в тяжеловесном «провозгласи, говоря».
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула пророческой вести; настоящее время в русском языке идиоматично вводит прямую речь Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет его как имя, а не заменяет титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционный широкий образ множества небесных сил в составе божественного титула, не сужая значение до земных армий.
- source_word: תְּפוּצֶינָה
  choice: будут изобиловать
  rationale: В сочетании с מִטּוֹב глагол в данном контексте обозначает обильное распространение благополучия; «изобиловать» естественно передаёт восстановительное изобилие, а альтернативный пространственный смысл отмечен в сноске.
- source_word: עָרַי
  choice: Мои города
  rationale: 'Сохраняет значимый суффикс первого лица: города представлены как принадлежащие Яхве.'
- source_word: מִטּוֹב
  choice: благами
  rationale: טוֹב здесь охватывает дарованное благополучие и добрые дары, а не только нравственную доброту.
- source_word: וְנִחַם
  choice: утешит
  rationale: В контексте восстановления после бедствия נחם означает утешение Сиона.
- source_word: וּבָחַר
  choice: изберёт
  rationale: Прямо передаёт заветный язык выбора, не уточняя его посредством позднейших богословских систем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» передаёт его транслитерацией и не подменяет титулом.
- issue: Повторное избрание Иерусалима
  choice: снова изберёт Иерусалим
  alternative: снова благоволит к Иерусалиму; снова возьмёт Иерусалим Себе
  rationale: Буквальный язык выбора сохраняет заветное содержание и напряжение формулировки о повторном избрании, не объясняя его сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Синтаксис упрощён там, где буквальное воспроизведение еврейского оборота было бы неестественным, при сохранении повторов עוֹד и ключевой богословской лексики.
