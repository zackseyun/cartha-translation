base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/011.yaml
  text: And they will dwell in it[a], and there will no longer be anything devoted to destruction, and Jerusalem will dwell securely.
translation:
  language: ru
  text: И будут жить в нём, и больше не будет ничего, предназначенного для уничтожения[a]; Иерусалим будет жить в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и проклятия уже не будет». Еврейское חֵרֶם может также означать то, что отдано под заклятие или предназначено для уничтожения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: И будут жить в нём
  rationale: Форма 3-го лица множественного числа оставляет субъект невыраженным; русский перевод сохраняет это, не добавляя слова «люди». «Жить» естественно передаёт значение постоянного обитания.
- source_word: חֵרֶם
  choice: ничто… не будет предано уничтожению
  rationale: חֵרֶם может обозначать то, что отдано под заклятие и обречено на уничтожение. Такая передача ясна современному читателю и сохраняет связь с судом, не сводя значение к абстрактному «проклятию».
- source_word: לֹא יִהְיֶה עוֹד
  choice: уже не будет
  rationale: Оборот выражает окончательное прекращение состояния в будущем; это краткая и естественная русская формулировка.
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם
  choice: Иерусалим будет жить
  rationale: Сохранена персонификация города и лексический параллелизм с первым употреблением глагола ישׁב.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Передаёт состояние защищённости и является естественным современным русским выражением.
theological_decisions:
- issue: Значение חֵרֶם в контексте восстановления Иерусалима
  choice: предано уничтожению
  alternative: проклятие; заклятие
  rationale: Выбранный вариант сохраняет конкретный смысл посвящения на уничтожение вследствие суда. Возможное значение «проклятие» отмечено в сноске, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; сдержанный пророческий стиль. Сохранены повтор глагола «жить» и персонификация Иерусалима; невыраженный субъект первой части не конкретизирован.
