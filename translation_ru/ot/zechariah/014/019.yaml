base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
translation:
  language: ru
  text: Таково будет наказание[a] Египта и наказание всех народов, которые не поднимутся праздновать Праздник шалашей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кара»; еврейское слово в других контекстах может означать «грех», но здесь оно указывает на наказание, навлечённое отказом прийти на праздник.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Праздник кущей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Таково будет
  rationale: Указательное местоимение женского рода отсылает к ранее описанному последствию; эта формулировка естественно согласуется в русском с существительным «наказание».
- source_word: חַטַּאת
  choice: наказание
  rationale: Хотя слово обычно обозначает «грех» или «жертву за грех», здесь контекст суда в стихах 18–19 указывает на кару, навлекаемую отказом прийти на праздник.
- source_word: מִצְרָיִם
  choice: Египта
  rationale: Нормативная передача названия страны; родительный падеж обусловлен сочетанием «наказание Египта».
- source_word: וְחַטַּאת כָּל הַגּוֹיִם
  choice: и наказание всех народов
  rationale: Повтор существительного сохранён, а גּוֹיִם передано нейтральным и контекстуально точным словом «народы».
- source_word: אֲשֶׁר לֹא יַעֲלוּ
  choice: которые не поднимутся
  rationale: Сохранён паломнический образ восхождения в Иерусалим; будущая форма соответствует контексту пророчества.
- source_word: לָחֹג
  choice: праздновать
  rationale: Инфинитив от חגג обозначает участие в праздновании паломнического праздника.
- source_word: אֶת חַג הַסֻּכּוֹת
  choice: Праздник шалашей
  rationale: Название переведено прозрачно для современного читателя, при этом сохранён буквальный образ временных жилищ — סֻכּוֹת.
theological_decisions:
- issue: Значение חַטַּאת в контексте эсхатологического суда
  choice: наказание
  alternative: грех; кара; возмездие
  rationale: Стих подводит итог описанному суду над Египтом и другими народами, отказывающимися прийти на поклонение. «Наказание» передаёт обусловленное проступком последствие, не привнося сюда жертвенного смысла.
- issue: Передача названия חַג הַסֻּכּוֹת
  choice: Праздник шалашей
  alternative: Праздник кущей
  rationale: «Шалаши» непосредственно и понятно передают образ סֻכּוֹת; традиционный вариант «кущи» отмечен в сноске, чтобы сохранить связь с устоявшейся библейской терминологией.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены повтор слова «наказание» и паломнический образ восхождения; архаизм «кущи» вынесен в сноску.
