  text: הִנֵּ֥ה יֽוֹם בָּ֖א לַֽ/יהוָ֑ה וְ/חֻלַּ֥ק שְׁלָלֵ֖/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
translation:
  language: ru
  text: Вот, наступает день для ГОСПОДА[a], и награбленное у тебя разделят посреди тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «наступает день ГОСПОДЕНЬ». Буквально по-еврейски: «наступает день для ГОСПОДА».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Вводит торжественное пророческое возвещение и призывает слушателя обратить внимание; «вот» естественно сохраняет возвышенную силу еврейского маркера.
- source_word: יוֹם בָּא
  choice: наступает день
  rationale: Причастная форма בָּא в пророческой речи указывает на грядущее событие. По-русски «наступает день» естественно передаёт приближение значимого дня.
- source_word: לַיהוָה
  choice: для ГОСПОДА
  rationale: Предлог לְ буквально выражает отношение дня к ГОСПОДУ и допускает оттенки предназначения или принадлежности. Основной текст сохраняет необычную конструкцию источника, не заменяя её без пояснения традиционным «день ГОСПОДЕНЬ».
- source_word: וְחֻלַּק
  choice: разделят
  rationale: Еврейская пассивная форма обозначает раздел добычи. Русская неопределённо-личная конструкция естественно передаёт тот же смысл, не называя исполнителей действия.
- source_word: שְׁלָלֵךְ
  choice: награбленное у тебя
  rationale: Слово обозначает военную добычу, а суффикс женского рода единственного числа обращён к Иерусалиму. Формулировка ясно показывает, что речь идёт об имуществе, отнятом у города, и избегает возможного ошибочного смысла «добыча, захваченная тобой».
- source_word: בְּקִרְבֵּךְ
  choice: посреди тебя
  rationale: 'Сохраняет пространственный и риторический образ: добычу будут делить внутри самого Иерусалима, к которому обращаются как к лицу женского рода.'
theological_decisions:
- issue: Связь לַיהוָה с пророческим выражением о дне
  choice: день для ГОСПОДА
  alternative: день ГОСПОДЕНЬ
  rationale: В еврейском тексте стоит предлог לְ, а не более прямое сочетание со значением «день ГОСПОДА». При этом выражение явно перекликается с общей пророческой темой дня ГОСПОДА. Необычная форма источника сохранена в основном тексте, а традиционный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Написание «ГОСПОДЬ» передаёт божественное имя יהוה. Обращение к Иерусалиму как к лицу женского рода сохранено местоимением «тебя».
