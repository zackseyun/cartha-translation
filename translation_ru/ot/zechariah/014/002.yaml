base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
translation:
  language: ru
  text: Я соберу все народы на войну против Иерусалима. Город будет взят, дома разграблены, а женщины изнасилованы[a]. Половина города будет уведена в изгнание, но остальной народ не будет отсечён от города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В письменной форме еврейского текста употреблено грубое слово, прямо обозначающее изнасилование; традиционное чтение заменяет его более мягким выражением.
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Или: «не будет удалён из города». Возможно и более сильное понимание: «не будет истреблён».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָסַפְתִּי
  choice: Я соберу
  rationale: Форма qal, 1-е лицо единственного числа, в пророческой речи передаёт будущее действие говорящего Бога; «соберу» естественно выражает Его активное действие.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: В военном и международном контексте גּוֹיִם обозначает народы как политические общности.
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: на войну против Иерусалима
  rationale: Хотя אֶל буквально указывает направление, в контексте нападения по-русски требуется «против»; выражение «на войну» звучит естественно и передаёт цель сбора.
- source_word: וְנִלְכְּדָה הָעִיר
  choice: Город будет взят
  rationale: Нифаль глагола לכד обозначает захват города в ходе войны; «будет взят» — ясная и устоявшаяся русская формулировка.
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  choice: дома разграблены
  rationale: Глагол означает разграбление и захват добычи; выбранное слово сохраняет смысл военного насилия.
- source_word: וְהַנָּשִׁים תשגלנה
  choice: женщины изнасилованы
  rationale: Письменная форма содержит грубое обозначение сексуального насилия. Прямой перевод не смягчает описываемое злодеяние.
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  choice: Половина города отправится в изгнание
  rationale: Сохранена метонимия оригинала «половина города», а בַּגּוֹלָה передано как насильственное изгнание, не как добровольный уход.
- source_word: וְיֶתֶר הָעָם
  choice: но остальной народ
  rationale: יֶתֶר означает оставшуюся часть; «остальной народ» естественно и не вносит дополнительных богословских оттенков слова «остаток».
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  choice: не будет отсечён от города
  rationale: Формулировка сохраняет образ глагола כרת и его неоднозначность между удалением и уничтожением; сочетание с מִן допускает понимание отделения или устранения из города.
theological_decisions:
- issue: Передача сексуального насилия при завоевании
  choice: женщины изнасилованы
  alternative: женщины подвергнутся насилию; с женщинами лягут
  rationale: Прямое выражение соответствует грубой письменной форме еврейского текста и не преуменьшает тяжесть описанного преступления; традиционное чтение выражается мягче и отмечено в сноске.
- issue: Значение לֹא יִכָּרֵת מִן הָעִיר
  choice: остальной народ не будет отсечён от города
  alternative: остальной народ не будет удалён из города; остальной народ не будет истреблён
  rationale: Глагол допускает значения удаления и уничтожения. Основной текст сохраняет образ и напряжение оригинала, а сноска указывает более сильное возможное значение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие пассивные конструкции сохраняют стремительное перечисление бедствий. Прямое обозначение сексуального насилия соответствует исходному тексту; архаизмы и конфессионально окрашенное слово «остаток» не используются.
