source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
translation:
  language: ru
  text: И тогда все оставшиеся из всех народов, которые выступили против Иерусалима, будут из года в год подниматься, чтобы поклониться Царю — Яхве Воинств[a] — и праздновать Праздник шалашей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному наименованию: «Господу Саваофу».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционное название: «Праздник кущей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И тогда ... будут
  rationale: Оборот вводит будущий результат в пророческой последовательности; «И тогда» естественно передаёт связь с предшествующим контекстом, а форма «будут» сохраняет будущность.
- source_word: כָּל הַנּוֹתָר
  choice: все оставшиеся
  rationale: Причастие обозначает тех, кто остался или уцелел; формулировка не уточняет сверх текста характер их спасения.
- source_word: מִכָּל הַגּוֹיִם
  choice: из всех народов
  rationale: Передаёт принадлежность оставшихся ко всем упомянутым народам и звучит естественно по-русски.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: которые выступили против Иерусалима
  rationale: В данном военном контексте сочетание בוא с עַל означает враждебное выступление или наступление; перевод сохраняет направленность против города, не конкретизируя стадию нападения.
- source_word: וְעָלוּ
  choice: будут ... подниматься
  rationale: עלה — обычный глагол восхождения в Иерусалим, сохраняющий одновременно географический и паломнический оттенок.
- source_word: מִדֵּי שָׁנָה בְשָׁנָה
  choice: из года в год
  rationale: Передаёт регулярную ежегодную повторяемость действия.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: чтобы поклониться
  rationale: В культовом контексте физическое преклонение выражает поклонение Богу; русский глагол сохраняет оба оттенка лучше отвлечённого «почтить».
- source_word: לְמֶלֶךְ
  choice: Царю
  rationale: Сохраняется значимый в контексте титул, а дательный падеж естественно управляется глаголом «поклониться».
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת — прозрачным и возвышенным «Воинств», которое допускает как земные войска, так и небесные сонмы и не сужает образ до одного вида сил.
- source_word: וְלָחֹג
  choice: и праздновать
  rationale: Глагол חגג обозначает празднование или соблюдение паломнического праздника; «праздновать» ясно передаёт праздничный характер действия.
- source_word: חַג הַסֻּכּוֹת
  choice: Праздник шалашей
  rationale: סֻכּוֹת буквально обозначает временные шалаши; название понятно современному читателю и ближе к предметному значению еврейского слова, чем традиционное «кущи».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и отличает его от титула «Царь».
- issue: Передача צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: Саваоф; небесных воинств; войск
  rationale: «Воинств» сохраняет величественный титульный характер и широту образа, не ограничивая его только человеческими армиями или только небесными силами; традиционная форма отмечена в сноске.
- issue: Эсхатологический смысл паломничества народов
  choice: Пророческий образ сохранён без истолкования
  alternative: Буквальное будущее ежегодное паломничество; символ всеобщего поклонения
  rationale: Стих изображает уцелевшие народы ежегодно восходящими на поклонение и праздник, но сам не определяет, следует ли понимать это исключительно буквально, типологически или символически.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим регистром. Синтаксис сохраняет размах исходного предложения, но остаётся ясным. «Подниматься» удерживает паломнический мотив восхождения в Иерусалим; «шалашей» предпочтено архаичному «кущей» в основном тексте.
