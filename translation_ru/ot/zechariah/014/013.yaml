  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא תִּֽהְיֶ֧ה מְהֽוּמַת יְהוָ֛ה רַבָּ֖ה בָּ/הֶ֑ם וְ/הֶחֱזִ֗יקוּ אִ֚ישׁ יַ֣ד רֵעֵ֔/הוּ וְ/עָלְתָ֥ה יָד֖/וֹ עַל יַ֥ד רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
translation:
  language: ru
  text: В тот день среди них будет великое смятение от Яхве[a]. Каждый схватит руку своего ближнего, и рука каждого поднимется против руки его ближнего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великая паника» или «великий ужас от Яхве». Еврейское слово может обозначать посланное Яхве состояние хаотического страха и растерянности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рука каждого поднимется против руки его ближнего» — яркий образ того, как люди насильственно обращаются друг против друга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת
  choice: смятение
  rationale: Слово обозначает вызванное Богом состояние хаоса, страха и растерянности. «Смятение» передаёт как внутренний ужас, так и беспорядок, который далее приводит к взаимному насилию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом, в соответствии с формой еврейского текста.
- source_word: רַבָּה
  choice: великое
  rationale: Прилагательное усиливает степень смятения; «великое» сохраняет торжественную простоту и акцент оригинала.
- source_word: בָּהֶם
  choice: среди них
  rationale: Предлог ב здесь естественно указывает на смятение, возникшее внутри их среды; это согласуется с последующим описанием взаимного нападения.
- source_word: וְהֶחֱזִיקוּ
  choice: схватит
  rationale: Порода hифиль глагола חזק передаёт решительное, силовое хватание; русский глагол «схватить» уместен в контексте враждебного столкновения.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Еврейское существительное употреблено дистрибутивно: речь идёт о каждом человеке в группе. Русское «каждый» естественно передаёт эту функцию без ненужного уточнения пола.'
- source_word: רֵעֵהוּ
  choice: своего ближнего
  rationale: В данном контексте это другой человек из той же группы. «Ближний» сохраняет широкий смысл слова и библейскую выразительность.
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  choice: и рука его поднимется против руки ближнего
  rationale: Сохранены повтор слова «рука» и конкретный образ оригинала, обозначающий насильственное обращение людей друг против друга.
theological_decisions:
- issue: Характер смятения, связанного с Яхве
  choice: Смятение представлено как исходящее от Яхве и охватывающее враждебную группу изнутри.
  alternative: Выражение можно понимать шире как смятение, сопровождающее вмешательство Яхве.
  rationale: Сочетание מְהוּמַת יְהוָה естественно обозначает смятение, посланное Яхве. Следующие слова показывают его результат — внутреннее столкновение, — но перевод не уточняет механизм божественного действия сверх сказанного в тексте.
- issue: Дистрибутивное употребление אִישׁ
  choice: каждый
  alternative: каждый мужчина; каждый человек
  rationale: В этом синтаксическом обороте אִישׁ означает «каждый» и соотносится с местоимениями мужского рода. Русская форма сохраняет дистрибутивный смысл и естественность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены личное имя Яхве, повтор слова «рука» и напряжённая образность оригинала; синтаксис разделён на два предложения для ясности.
