  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
translation:
  language: ru
  text: 'И будет один день[a], ведомый Яхве[b]: не день и не ночь[c]; но вечером будет свет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один день»; в данном контексте выражение может подчёркивать как единичность, так и исключительность этого дня.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога, здесь переданное как «Яхве».
    reason: cultural_note
  - marker: c
    text: 'Возможный более плавный перевод: «ни день ни ночь». Еврейский текст буквально повторяет отрицание: «не день и не ночь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сочетание союза וְ с формой הָיָה в пророческой речи вводит будущее событие; перевод сохраняет структуру и торжественную простоту еврейского текста.
- source_word: יוֹם אֶחָד
  choice: один день
  rationale: 'Буквально: «один день». Формулировка сохраняет возможность понимать אֶחָד как указание либо на единичность, либо на исключительность дня, не закрепляя одну интерпретацию в основном тексте.'
- source_word: הוּא יִוָּדַע לַיהוָה
  choice: известный Яхве
  rationale: Местоимение относится к «дню», а нифаль יִוָּדַע с לַיהוָה выражает, что этот день известен Яхве. Причастная конструкция естественна по-русски и не создаёт лишнего оттенка «станет известен».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога как «Яхве» сохраняет различие между тетраграмматоном и титулом «Господь».
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  choice: не день и не ночь
  rationale: Буквальное повторение отрицания перед обеими категориями сохраняет резкую парадоксальность оригинала; более гладкое «ни день ни ночь» возможно, но несколько смягчает форму.
- source_word: לְעֵת עֶרֶב
  choice: вечером
  rationale: Естественная современная передача выражения «во время вечера», без добавления идеи постепенного приближения.
- source_word: יִהְיֶה אוֹר
  choice: будет свет
  rationale: 'Сохраняется именная образность оригинала и неожиданный контраст: именно вечером будет свет.'
theological_decisions:
- issue: Природа необычного дня
  choice: Представить единственный или исключительный день, известный Яхве, не уточняя механизм и пророческую хронологию.
  alternative: Истолковать описание как строго астрономическое явление, чистый символ спасения или указание на конкретную эсхатологическую схему.
  rationale: Сам стих описывает необычный день и свет вечером, но не определяет, как именно это осуществится и к какой системе пророческой хронологии относится.
- issue: Смысл слов «известный Яхве»
  choice: Сохранить краткое утверждение об известности дня Яхве.
  alternative: Перевести «день, который знает только Яхве» или «день, избранный Яхве».
  rationale: Слова «только» и «избранный» могут быть контекстуально предполагаемыми толкованиями, но непосредственно в еврейском тексте отсутствуют.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным ритмом пророческой речи. Двоеточие связывает характеристику необычного дня с предшествующим утверждением, а точка с запятой подчёркивает контраст вечернего света. Необычная формула «не день и не ночь» сохранена намеренно.
