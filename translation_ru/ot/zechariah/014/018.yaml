base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
translation:
  language: ru
  text: А если египетский род не поднимется и не придёт[a], то язва не постигнет их[b] — та язва, которой Яхве поразит народы, не поднимающиеся праздновать Праздник шалашей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не поднимется и не придёт». Два глагола, вероятно, усиливают мысль о паломничестве в Иерусалим.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально говорит: «то не на них будет язва — та язва, которой Яхве поразит народы». В контексте это трудное чтение: в предыдущем стихе наказанием названо отсутствие дождя. Поэтому некоторые понимают данный стих как указание на то, что Египет, менее зависимый от дождей, будет поражён язвой; другие предлагают исправить текст или подразумевают здесь дождь.'
    reason: alternative_reading
  - marker: c
    text: 'Традиционное название: «Праздник кущей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  choice: египетский род
  rationale: Сохраняет собирательное значение единственного числа מִשְׁפָּחָה и звучит естественнее по-русски, чем буквальное «семья Египта».
- source_word: תַעֲלֶה
  choice: поднимется
  rationale: Передаёт обычное обозначение восхождения в Иерусалим, в том числе ради паломнического праздника.
- source_word: וְלֹא בָאָה
  choice: и не придёт
  rationale: Сохраняет второй глагол еврейского текста, не сводя сочетание «поднимется и придёт» к одному действию.
- source_word: וְלֹא עֲלֵיהֶם תִּהְיֶה הַמַּגֵּפָה
  choice: то не на них будет язва
  rationale: Близко воспроизводит трудную формулировку масоретского текста, не устраняя отрицание и не подставляя из предыдущего стиха слово «дождь».
- source_word: הַמַּגֵּפָה
  choice: язва
  rationale: В библейском контексте естественно обозначает посланное Богом губительное поражение и сохраняет смысловую связь с глаголом «поразит».
- source_word: יִגֹּף
  choice: поразит
  rationale: Передаёт נָגַף как нанесение губительного удара и образует ясную смысловую связь с «язвой».
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Обозначает здесь народы вообще, без внесения более позднего противопоставления «иудеев» и «язычников».
- source_word: לָחֹג
  choice: праздновать
  rationale: Естественно передаёт соблюдение и празднование паломнического праздника.
- source_word: חַג הַסֻּכּוֹת
  choice: Праздник шалашей
  rationale: Прозрачно передаёт буквальный образ סֻכּוֹת и одновременно сохраняет название установленного праздника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Трудная связь с предыдущим стихом и отрицание перед выражением «на них будет язва»
  choice: 'Сохранить чтение масоретского текста: «не на них будет язва»'
  alternative: Понять фразу как эллиптическое «то и на них не будет дождя» либо исправить отрицание и перевести «на них будет язва»
  rationale: В масоретском тексте прямо присутствуют отрицание לֹא и существительное הַמַּגֵּפָה. Основной текст не должен молча гармонизировать трудное место с предыдущим стихом или принимать конъектуру.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется собственное имя Бога, стоящее в исходном тексте, без замены титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Египетский род» сохраняет собирательный образ без тяжеловесного буквализма; «поднимется» удерживает паломническую направленность к Иерусалиму. Трудность масоретского текста оставлена заметной и объяснена в сноске.
