review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: речь идёт о всеобщем освящении сосудов, о приходящих совершать жертвоприношения и о заключительном неоднозначном слове כְּנַעֲנִי. Однако «возьмут из этих котлов» по-русски означает, что из котлов извлекут нечто находящееся внутри, тогда как еврейское מֵהֶם отсылает к самим котлам: их будут брать для варки. Формулировка требует исправления.'
  naturalness: «Будет святыней для Яхве» возможно, но для обычного кухонного сосуда звучит менее естественно и может создавать образ самого предмета культа. «Будет свят для Яхве Воинств» прямо и естественно передаёт предикативное קֹדֶשׁ. Остальной регистр современный литературный и соответствует пророческому контексту.
  terminology: «Котёл», «Яхве Воинств», «приносящие жертвы», «хананей» и сноска с вариантами «торговец/купец» приемлемы. Основной текст не разрешает спорное значение כְּנַעֲנִי односторонне, а сноска надлежащим образом сохраняет альтернативу.
  issues:
  - severity: medium
    issue: «Возьмут из этих котлов»
    rationale: Русская конструкция означает «возьмут что-либо из внутренности котлов». В контексте местоимение מֵהֶם относится к котлам как предметам, которые берут и используют для варки; следует сказать «возьмут их и будут варить в них».
  - severity: low
    issue: «Будет святыней для Яхве»
    rationale: «Святыня» в русском обычно обозначает почитаемую святую вещь или место и менее удачна как сказуемое о каждом котле. «Будет свят для Яхве» точнее передаёт освящённость/посвящённость без смещения образа.
