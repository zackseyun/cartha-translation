  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
translation:
  language: ru
  text: И каждый котёл в Иерусалиме и Иудее будет свят для Яхве Воинств. Все приносящие жертвы придут, возьмут их и будут варить в них. И в тот день в доме Яхве Воинств больше не будет хананея[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «торговца» или «купца»; еврейское слово в некоторых контекстах может иметь такое значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר
  choice: котёл
  rationale: Обозначает сосуд для варки; «котёл» естественно сочетается с последующим «варить в них» и сохраняет культово-бытовой образ.
- source_word: קֹדֶשׁ
  choice: святыня
  rationale: Предикативное существительное передаёт не просто качество, а посвящённость сосудов Яхве; формулировка «будет святыней» сохраняет культовую силу еврейского слова.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יהוה и сохраняет традиционный пророческий титул צְבָאוֹת без замены его толкованием «Всемогущий».
- source_word: הַזֹּבְחִים
  choice: все приносящие жертвы
  rationale: Субстантивированное причастие обозначает людей, совершающих жертвоприношения; выбранная формулировка ясна и естественна по-русски.
- source_word: מֵהֶם
  choice: из этих котлов
  rationale: Местоимение относится к котлам. Повтор существительного устраняет возможную неясность русского «из них», не добавляя нового смысла.
- source_word: וּבִשְּׁלוּ בָהֶם
  choice: и будут варить в них
  rationale: Сохраняется значение варки и не вводится отсутствующий в еврейском тексте прямой объект.
- source_word: כְנַעֲנִי
  choice: хананей
  rationale: Основное лексическое значение — этноним «хананей». Возможное контекстуальное значение «торговец» не исключается, а отмечается в сноске.
- source_word: בְּבֵית יְהוָה צְבָאוֹת
  choice: в доме Яхве Воинств
  rationale: Буквально сохраняет образ «дома», которым назван храм, не подменяя исходную метафору пояснением.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивой пророческой формулы.
theological_decisions:
- issue: Значение כְנַעֲנִי в заключительной фразе
  choice: хананей
  alternative: торговец; купец
  rationale: Еврейское слово прежде всего означает «хананей», но в некоторых контекстах может обозначать торговца. Основной текст сохраняет этнический и канонический образ, а сноска — реальную лексическую неоднозначность, не разрешая её без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксис слегка разделён для естественного чтения; повтор «котлов» проясняет референт местоимения. Маркер сноски поставлен непосредственно после неоднозначного слова «хананея».
