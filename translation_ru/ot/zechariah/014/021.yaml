revisions:
- from: И каждый котёл в Иерусалиме и Иудее будет святыней для Яхве Воинств. Все приносящие жертвы придут, возьмут из этих котлов и будут варить в них. И в тот день в доме Яхве Воинств больше не будет хананея[a].
  to: И каждый котёл в Иерусалиме и Иудее будет свят для Яхве Воинств. Все приносящие жертвы придут, возьмут их и будут варить в них. И в тот день в доме Яхве Воинств больше не будет хананея[a].
  rationale: Исправлены две точки, где русская формулировка либо затемняла, либо меняла смысл. «Свят для Яхве» сохраняет культовое значение קֹדֶשׁ как посвящённости Богу, а «возьмут их» устраняет ошибочное представление, будто берут содержимое котлов. Неоднозначность слова «хананей» сохранена в основном тексте и отмечена сноской.
