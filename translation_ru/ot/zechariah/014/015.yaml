source:
  edition: WLC
  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
translation:
  language: ru
  text: То же поражение постигнет коней, мулов, верблюдов, ослов и весь скот, который будет в тех станах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֵן
  choice: То же
  rationale: Передаёт соответствие с карой, описанной в предыдущем стихе, и естественно связывает её с поражением животных.
- source_word: תִּהְיֶה מַגֵּפַת
  choice: поражение постигнет
  rationale: מַגֵּפָה обозначает тяжёлое поражение, мор или карающую напасть. Русская конструкция с глаголом «постигнет» естественна и сохраняет смысл будущего бедствия, не уточняя его медицинскую природу сверх текста.
- source_word: הַסּוּס הַפֶּרֶד הַגָּמָל וְהַחֲמוֹר
  choice: коней, мулов, верблюдов, ослов
  rationale: Названия животных переданы обычными современными эквивалентами; собирательные формы единственного числа в еврейском естественно выражены русским множественным числом.
- source_word: וְכָל הַבְּהֵמָה
  choice: и весь скот
  rationale: В данном перечне лагерных домашних животных בְּהֵמָה естественнее означает скот, а не животных вообще.
- source_word: אֲשֶׁר יִהְיֶה בַּמַּחֲנוֹת הָהֵמָּה
  choice: который будет в тех станах
  rationale: Сохранены будущее время относительной конструкции и прямое значение מַחֲנוֹת — «станы, лагеря», без истолкования как «войска».
- source_word: כַּמַּגֵּפָה הַזֹּאת
  choice: То же поражение
  rationale: Сравнение с только что описанным поражением перенесено в начало русского предложения вместе с וְכֵן; это устраняет тяжеловесный повтор и сохраняет смысл полного соответствия.
theological_decisions:
- issue: Распространение суда на животных во вражеских станах
  choice: Передать как то же реальное поражение, которое постигнет животных
  alternative: Обобщить до неопределённого «бедствия» или понимать только образно
  rationale: Повтор מַגֵּפָה и прямое сравнение с предыдущим стихом указывают, что описанный суд распространяется и на животных, находящихся во вражеских станах.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским словом «станы». Синтаксис упрощён ради ясности, но сопоставление с поражением из предыдущего стиха сохранено.
