  text: וְ/עָמְד֣וּ רַגְלָ֣י/ו בַּ/יּוֹם הַ֠/הוּא עַל הַ֨ר הַ/זֵּתִ֜ים אֲשֶׁ֨ר עַל פְּנֵ֥י יְרוּשָׁלִַם֮ מִ/קֶּדֶם֒ וְ/נִבְקַע֩ הַ֨ר הַ/זֵּיתִ֤ים מֵֽ/חֶצְי/וֹ֙ מִזְרָ֣חָ/ה וָ/יָ֔מָּ/ה גֵּ֖יא גְּדוֹלָ֣ה מְאֹ֑ד וּ/מָ֨שׁ חֲצִ֥י הָ/הָ֛ר צָפ֖וֹנָ/ה וְ/חֶצְי/וֹ נֶֽגְבָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
translation:
  language: ru
  text: В тот день Его ноги станут на Масличной горе, которая находится к востоку от Иерусалима[a]. Масличная гора рассечётся надвое от своей середины к востоку и к западу, образовав огромную долину[b]; одна половина горы сдвинется к северу, а другая — к югу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая расположена напротив Иерусалима, к востоку от него».'
    reason: Лексико-синтаксическая альтернатива для עַל־פְּנֵי ... מִקֶּדֶם.
  - marker: b
    text: 'Глагол «расколется» относится к Масличной горе; весьма большая долина описана как результат разлома. Буквально: «расколется Масличная гора от своей середины к востоку и к западу — долина весьма большая».'
    reason: Пояснение синтаксической связи и пространственной картины еврейского текста без приписывания исходнику отдельного глагола «образуется».
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  choice: Его ноги станут
  rationale: Сохранён конкретный телесный образ еврейского текста. Перфект с ו в пророческом контексте передан будущим временем.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивое и естественное по-русски соответствие пророческой временной формуле.
- source_word: הַר הַזֵּתִים / הַר הַזֵּיתִים
  choice: Масличная гора
  rationale: Традиционное и общепонятное русское название данного географического объекта.
- source_word: אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִַם מִקֶּדֶם
  choice: которая находится перед Иерусалимом с востока
  rationale: Передаёт пространственные значения «перед, напротив» и «с востока», не превращая их в более свободное пояснение.
- source_word: וְנִבְקַע
  choice: рассечётся надвое
  rationale: Возвратная форма передаёт нифаль со значением раскалывания; «надвое» следует из дальнейшего упоминания двух половин.
- source_word: מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  choice: от своей середины к востоку и к западу
  rationale: Сохраняет существенную деталь מֵחֶצְיוֹ — начало разлома от середины — и обе направительные формы.
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  choice: огромную долину
  rationale: Естественно передаёт усиленное сочетание «долина весьма большая».
- source_word: וּמָשׁ
  choice: сдвинется
  rationale: Глагол обозначает движение или отступление в сторону; «сдвинется» ясно описывает пространственное раздвижение половин горы.
- source_word: צָפוֹנָה / נֶגְבָּה
  choice: к северу / к югу
  rationale: Точно и естественно передаёт направительные формы.
theological_decisions:
- issue: Антропоморфное описание божественного лица в контексте
  choice: Сохранить буквальное «Его ноги станут»
  alternative: «Он явится» или «Его присутствие будет»
  rationale: Еврейский текст использует конкретную телесную образность; перевод не должен сглаживать её и заранее разрешать богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но не архаичным библейским регистром. Конкретная образность и направления движения сохранены; синтаксис слегка упорядочен для ясности.
