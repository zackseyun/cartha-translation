- from: В тот день Его ноги станут на Масличной горе, которая находится перед Иерусалимом с востока[a]. Масличная гора рассечётся надвое от своей середины к востоку и к западу, образовав огромную долину[b]; одна половина горы сдвинется к северу, а другая — к югу.
