  naturalness: Текст в целом литературный и ясный. Замена пространственного оборота на «к востоку от Иерусалима» устраняет неидиоматичность без смысловой потери.
  terminology: «Масличная гора» — устойчивое русское библейское название. «Его ноги станут» уместно сохраняет намеренно конкретную антропоморфную образность исходного текста. «Рассечётся надвое» приемлемо для נִבְקַע.
