  terminology: Топонимы и названия сооружений переданы последовательно. «Первых ворот» и «Угловых ворот» приемлемы как названия ворот; «Хананэла» соответствует обычной передаче имени חֲנַנְאֵל. Сноска корректно сохраняет возможность сравнительного значения כָּעֲרָבָה.
