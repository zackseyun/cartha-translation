source:
  edition: WLC
  text: יִסּ֨וֹב כָּל הָ/אָ֤רֶץ כָּ/עֲרָבָה֙ מִ/גֶּ֣בַע לְ/רִמּ֔וֹן נֶ֖גֶב יְרֽוּשָׁלִָ֑ם וְֽ/רָאֲמָה֩ וְ/יָשְׁבָ֨ה תַחְתֶּ֜י/הָ לְ/מִ/שַּׁ֣עַר בִּנְיָמִ֗ן עַד מְק֞וֹם שַׁ֤עַר הָֽ/רִאשׁוֹן֙ עַד שַׁ֣עַר הַ/פִּנִּ֔ים וּ/מִגְדַּ֣ל חֲנַנְאֵ֔ל עַ֖ד יִקְבֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
translation:
  language: ru
  text: Вся земля превратится в равнину[a] — от Гевы до Риммона, что к югу от Иерусалима. А Иерусалим возвысится и будет обитаем на своём месте — от Ворот Вениамина до места Первых ворот, затем до Угловых ворот и от башни Хананэла до царских виноградных давилен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станет подобна Араве». Еврейский текст может сравнивать землю с Аравой — долиной или степной областью, — а не просто говорить, что она станет равниной.'
    reason: Лексическая и синтаксическая неоднозначность כָּעֲרָבָה.
lexical_decisions:
- source_word: יִסּוֹב
  choice: превратится
  rationale: В данном топографическом контексте глагол описывает изменение рельефа; возвратная форма естественно передаёт переход земли в новое состояние, не уточняя действующего лица.
- source_word: כָּל הָאָרֶץ
  choice: вся эта земля
  rationale: Указанные далее местные границы говорят о регионе вокруг Иерусалима, а не обязательно обо всей земле или планете; «эта» естественно обозначает описываемую область.
- source_word: כָּעֲרָבָה
  choice: в равнину
  rationale: עֲרָבָה может обозначать равнину или собственно Араву. Основной текст ясно передаёт топографическое изменение, а буквальная сравнительная возможность сохранена в сноске.
- source_word: מִגֶּבַע לְרִמּוֹן נֶגֶב יְרוּשָׁלִָם
  choice: от Гевы до Риммона, что к югу от Иерусалима
  rationale: Топонимы задают пределы области; придаточное однозначно и естественно связывает южное уточнение с Риммоном.
- source_word: וְרָאֲמָה
  choice: возвысится
  rationale: Форма выражает возвышение Иерусалима на фоне выровненной окружающей земли; русский глагол сохраняет эту пространственную противоположность без излишнего уточнения залога.
- source_word: וְיָשְׁבָה תַחְתֶּיהָ
  choice: останется на своём месте
  rationale: Буквальное «будет обитать на своём месте» здесь идиоматически означает устойчивое пребывание города в его местоположении.
- source_word: לְמִשַּׁעַר בִּנְיָמִן
  choice: от Ворот Вениамина
  rationale: В последовательности городских ориентиров предлог обозначает начальную точку описываемого пространства.
- source_word: מְקוֹם שַׁעַר הָרִאשׁוֹן
  choice: места Первых ворот
  rationale: מְקוֹם указывает на место или участок, возможно, уже не существовавших ворот; это различие сохранено.
- source_word: שַׁעַר הַפִּנִּים
  choice: Угловых ворот
  rationale: Название связано с פנה, «угол»; форма «Угловые ворота» ясна и естественна по-русски.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: башни Хананэла
  rationale: Сочетание нарицательного обозначения сооружения и транслитерированного личного имени.
- source_word: יִקְבֵי הַמֶּלֶךְ
  choice: царских давилен
  rationale: יֶקֶב обозначает виноградную давильню либо связанный с ней чан; «давильни» кратко и конкретно передаёт царские сооружения для производства вина.
theological_decisions:
- issue: Масштаб преобразования местности
  choice: преобразование области вокруг Иерусалима
  alternative: преобразование всей земли или всей планеты
  rationale: Конкретные границы от Гевы до Риммона и последующий перечень городских ориентиров поддерживают региональное понимание; перевод не расширяет масштаб сверх контекста.
- issue: Характер כָּעֲרָבָה
  choice: результат преобразования — равнина
  alternative: сравнение с географической областью Арава
  rationale: Контекст противопоставляет выровненную землю возвышенному Иерусалиму, однако возможное собственное название и сравнительное значение כ־ сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Топонимы и названия городских сооружений переданы ясно, без архаизации; параллельные границы сохранены.
