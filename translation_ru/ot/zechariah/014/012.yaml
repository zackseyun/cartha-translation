  terminology: «Яхве», «народы», «Иерусалим», «плоть», «глазницы» употреблены последовательно и точно. Сноска с альтернативой «все племена» корректно отмечает диапазон עַמִּים; добавление «нации» пояснительно допустимо и не создаёт смысловой проблемы.
