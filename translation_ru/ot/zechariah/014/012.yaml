  source_fidelity: 'Текст точно передаёт структуру и содержание еврейского оригинала: יְהוָה передано как «Яхве»; מַגֵּפָה и יִגֹּף — как «поражением… поразит»; военный смысл צָבְאוּ עַל — как «воевавшие против». Распределительный переход от «всех народов» к единственному представителю («каждого из них… он… его») обоснован и не меняет смысла. «Истлеет» адекватно передаёт повтор מקק, не навязывая конкретный механизм бедствия.'
