source:
  edition: WLC
  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
translation:
  language: ru
  text: 'Вот каким поражением Яхве поразит все народы[a], воевавшие против Иерусалима: плоть каждого из них истлеет, пока он ещё будет стоять на ногах; глаза его истлеют в глазницах, и язык его истлеет во рту.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все племена»; еврейское слово עַמִּים может обозначать народы, племена или нации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגֵּפָה
  choice: поражение
  rationale: Существительное מַגֵּפָה обозначает поражающий удар или бедствие, в том числе мор. «Поражение» сохраняет связь с последующим глаголом נגף и не уточняет без достаточных оснований, идёт ли речь именно об эпидемии.
- source_word: יִגֹּף
  choice: поразит
  rationale: Глагол נגף означает «ударить, поразить, подвергнуть бедствию». «Поразит» естественно передаёт действие божественного суда и сохраняет корневой повтор с «поражением».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: כָּל־הָעַמִּים
  choice: все народы
  rationale: Множественное עַמִּים естественно передаётся как «народы»; контекст допускает также понимание «все племена/нации», что отмечено в сноске.
- source_word: צָבְאוּ עַל
  choice: воевавшие против
  rationale: В данном контексте צבא указывает на военное выступление или ведение войны против Иерусалима.
- source_word: הָמֵק / תִּמַּקְנָה / תִּמַּק
  choice: истлеет / истлеют
  rationale: Повтор глагола מקק описывает распад плоти, глаз и языка. «Истлеть» сохраняет страшную конкретность образа, не определяя его как обычное гниение от конкретной болезни.
- source_word: בְּשָׂרוֹ
  choice: плоть каждого из них
  rationale: «Плоть» точно передаёт בָּשָׂר. Добавление «каждого из них» естественно выражает переход еврейского текста от множества народов к единичному представителю в мужском роде.
- source_word: וְהוּא עֹמֵד עַל־רַגְלָיו
  choice: пока он ещё будет стоять на ногах
  rationale: Причастная конструкция изображает поражение человека в тот момент, когда он всё ещё находится на ногах; «ещё» передаёт шокирующую одновременность, не меняя смысла.
- source_word: בְחֹרֵיהֶן
  choice: в глазницах
  rationale: חֹרִים здесь обозначает полости, в которых находятся глаза; «глазницы» — точный и естественный анатомический эквивалент.
- source_word: בְּפִיהֶם
  choice: во рту
  rationale: 'Несмотря на формально множественный суффикс в еврейском слове, контекст распределительный: у каждого человека язык истлевает в его собственном рту. Русское единственное число согласуется с ближайшим единичным представителем.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Характер описанного суда
  choice: Сохранить буквальную и графически резкую картину телесного распада
  alternative: Истолковать её как метафору поражения либо как указание на определённую болезнь
  rationale: Текст описывает истлевание плоти, глаз и языка, но не объясняет механизм бедствия. Перевод не должен решать, является ли оно чудесным, военным или эпидемиологическим.
- issue: Переход от множественного к единственному числу
  choice: 'Передать распределительно: «плоть каждого из них… он… его»'
  alternative: Сохранить множественное число во всём описании
  rationale: После «всех народов» еврейский текст описывает типичного отдельного человека в единственном числе. Распределительная формулировка делает этот переход ясным, не устраняя его смысл.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Корневой повтор «поражением… поразит» намеренно отражает еврейскую словесную связь מַגֵּפָה / נגף. Троекратное «истлеет» сохраняет настойчивый повтор и суровую образность оригинала.
