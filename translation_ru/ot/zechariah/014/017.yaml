source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
translation:
  language: ru
  text: И если какой-либо из родов земли не взойдёт в Иерусалим, чтобы поклониться Царю[a], Яхве Воинств[b], то на него не будет дождя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасть ниц перед Царём».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная передача: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  choice: И если какой-либо
  rationale: Еврейский оборот вводит условие и его следствие. Такая передача естественна по-русски и сохраняет условный смысл без тяжеловесного буквализма.
- source_word: לֹא יַעֲלֶה
  choice: не взойдёт
  rationale: Глагол עלה буквально означает движение вверх и регулярно употребляется о паломничестве в Иерусалим; «взойдёт» сохраняет и направление, и торжественный контекст.
- source_word: מֵאֵת מִשְׁפְּחוֹת הָאָרֶץ
  choice: из родов земли
  rationale: מִשְׁפְּחוֹת обозначает большие родственные группы — роды или кланы. «Роды» здесь литературнее и точнее, чем бытовое «семьи»; הָאָרֶץ в контексте народов означает всю землю, а не только землю Израиля.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: поклониться
  rationale: Глагол обозначает поклон или простирание ниц, а в данном культовом контексте также выражает поклонение. Русское «поклониться» сохраняет обе смысловые стороны; более зримая формулировка дана в сноске.
- source_word: לְמֶלֶךְ
  choice: Царю
  rationale: Определённый титул относится к Яхве, названному далее; прописная буква уместно передаёт титульное употребление.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יְהוָה передано как «Яхве», а צְבָאוֹת — прозрачным для современного читателя словом «Воинств», сохраняющим военный и небесный оттенки титула.
- source_word: וְלֹא עֲלֵיהֶם יִהְיֶה הַגָּשֶׁם
  choice: то на них не будет дождя
  rationale: Формулировка сохраняет отрицательную конструкцию и предлог עַל, при этом звучит естественно и ясно по-русски.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит Тетраграмматон; передача личным именем сохраняет его функцию как открытого Богом имени завета.
- issue: Объём значения הָאָרֶץ
  choice: земли
  alternative: страны
  rationale: Контекст Захарии 14 говорит о народах мира, поэтому универсальное «земли» предпочтительнее узкого указания на землю Израиля.
- issue: Значение לְהִשְׁתַּחֲוֺת
  choice: поклониться
  alternative: пасть ниц перед
  rationale: Основной текст сохраняет одновременно телесный жест и религиозное поклонение, не сводя значение исключительно к одному из них.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Взойдёт» и «Царь» поддерживают библейский регистр, не делая фразу архаичной; синтаксис условия остаётся естественным для современного читателя.
