  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
translation:
  language: ru
  text: И вы побежите по долине моих гор, ибо долина гор протянется до Ацала. Вы побежите, как бежали от землетрясения во дни Озии, царя Иудеи. И придёт Яхве, Бог мой, и все святые[b] — с Тобой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Масоретский текст: «с Тобой». В некоторых древних переводах и во многих современных переводах: «с Ним».'
    reason: textual_variant
  - marker: b
    text: «Святые» могут означать небесных служителей; это слово также понимают как указание на святых людей или ангелов.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַסְתֶּם
  choice: вы побежите
  rationale: Глагол נוּס обычно означает «бежать, спасаться бегством»; повторение той же формы в сравнении с бегством от землетрясения подтверждает это значение.
- source_word: גֵּיא הָרַי
  choice: по долине между Моими горами
  rationale: Суффикс первого лица в הָרַי сохранён как «Моими». Предлог «между» естественно передаёт топографический смысл долины, образованной разделившейся горой.
- source_word: יַגִּיעַ גֵּי הָרִים אֶל אָצַל
  choice: эта долина будет простираться до Ацала
  rationale: В данном пространственном контексте יַגִּיעַ указывает на протяжённость до названного места; Ацал передан транслитерацией как топоним.
- source_word: מִפְּנֵי הָרַעַשׁ
  choice: от землетрясения
  rationale: Русское «бежать от землетрясения» естественно и точно передаёт причинно-пространственное значение מִפְּנֵי; буквальное «от лица землетрясения» в современном русском неуместно.
- source_word: וּבָא יְהוָה אֱלֹהַי
  choice: И придёт Яхве, Бог мой
  rationale: Будущее значение формы передано прямо; личное Божье имя и суффикс первого лица сохранены.
- source_word: כָּל קְדֹשִׁים
  choice: все святые
  rationale: Слово קְדֹשִׁים обозначает святых существ или лиц, не уточняя прямо, ангелы ли это или люди; общее русское «святые» сохраняет эту неоднозначность.
- source_word: עִמָּךְ
  choice: с Ним … о Боже мой
  rationale: Консонантный текст WLC читается «с Тобой», однако синтаксис третьего лица и древняя текстовая традиция поддерживают чтение «с Ним». Формула обращения «о Боже мой» отражает возможное понимание конечного элемента как обращения и позволяет дать связный русский текст, при этом разночтение явно отмечено.
theological_decisions:
- issue: Кто такие «все святые»
  choice: все святые
  alternative: все святые ангелы; все угодники Божьи
  rationale: Еврейский текст не определяет их точнее, поэтому перевод не отождествляет их исключительно с ангелами или с прославленными людьми.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- issue: Последнее слово עִמָּךְ и его связь с предложением
  choice: с Ним … о Боже мой
  alternative: с Тобой
  rationale: 'Текстовая и синтаксическая трудность не разрешается молча: основной текст следует широко засвидетельствованному пониманию «с Ним», а форма масоретского текста приведена в сноске.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Формы «во дни» и «Иудеи» сохраняют достоинство пророческой речи; топографическое выражение передано естественно. Текстовая неоднозначность заключительной фразы вынесена в сноску.
