    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет обычную пророческую формулу будущего события и звучит естественно и торжественно по-русски.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и понятное соответствие пророческому временному выражению.
- source_word: לֹא יִהְיֶה אוֹר
  choice: не станет света
  rationale: Передаёт отрицательную экзистенциальную конструкцию естественным современным русским языком.
- source_word: יְקָרוֹת
  choice: сияющие
  rationale: Форма связана с тем, что дорого, великолепно или ярко; в данном контексте может обозначать небесные светила. Субстантивированное «сияющие» сохраняет образ, не называя их прямо светилами.
- source_word: יקפאון
  choice: застынут
  rationale: Передаёт конкретный образ застывания или замерзания, сохраняя необычность и трудность масоретского текста без пояснительного перетолкования.
theological_decisions:
- issue: Толкование трудной заключительной фразы יְקָרוֹת יקפאון
  choice: «сияющие застынут» — относительно буквальное описание ярких или великолепных небесных сущностей
  alternative: '«не будет ни холода, ни мороза»; также возможно: «светила померкнут»'
  rationale: Еврейская фраза лексически и синтаксически трудна. Основной текст следует масоретскому чтению и сохраняет его напряжённость, а важное традиционное истолкование приводится в примечании без догматического предпочтения.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. Необычное «сияющие застынут» намеренно сохраняет образность и неоднозначность трудного еврейского выражения.
