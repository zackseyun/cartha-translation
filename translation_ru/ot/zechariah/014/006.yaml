  source_fidelity: 'Основной текст точно передаёт пророческую временную формулу וְהָיָה בַּיּוֹם הַהוּא и отрицание существования света. Трудное сочетание יְקָרוֹת יִקְפָאוֹן передано с намеренно сохранённой образностью: «сияющие застынут». Хотя «сияющие» несколько конкретизирует возможную связь с небесными светилами, оно не называет их прямо и не устраняет текстовую неоднозначность; «застынут» удачно отражает образ יקפאון.'
