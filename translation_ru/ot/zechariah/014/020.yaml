  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
translation:
  language: ru
  text: 'В тот день будет на колокольчиках коней: «Святыня Господу»[a], и котлы в доме Господа будут как жертвенные чаши[b] перед жертвенником.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Святость Господу» или «Святое Господу». Эта формула повторяет надпись на золотой пластине первосвященника (Исх. 28:36).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертвенные тазы». Это были священные сосуды, использовавшиеся при храмовых обрядах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача устойчивой пророческой формулы с сохранением её указательного и эсхатологического звучания.
- source_word: יִהְיֶה עַל
  choice: на … будет написано
  rationale: В контексте следующей цитируемой посвятительной формулы подразумевается надпись. Добавленное «написано» делает русский текст ясным, не меняя смысла.
- source_word: מְצִלּוֹת הַסּוּס
  choice: колокольчиках коней
  rationale: Слово, вероятно, обозначает небольшие звенящие металлические детали конской сбруи; единственное число «коня» имеет собирательное значение.
- source_word: קֹדֶשׁ לַיהוָה
  choice: «Святыня Господу»
  rationale: Сохранена краткая культовая формула, перекликающаяся с надписью на золотой пластине первосвященника в Исх. 28:36; «святыня» передаёт существительное קֹדֶשׁ и посвятительный смысл.
- source_word: יְהוָה
  choice: Господь
  rationale: Тетраграмматон передан традиционным русским reverential-эквивалентом «Господь».
- source_word: הַסִּירוֹת
  choice: котлы
  rationale: Речь идёт о сосудах для варки; «котлы» точнее передаёт функцию, чем более общее «сосуды».
- source_word: בְּבֵית יְהוָה
  choice: в доме Господа
  rationale: Сохранён еврейский образ «дом Господа», ясно обозначающий храм.
- source_word: כַּמִּזְרָקִים
  choice: как жертвенные чаши
  rationale: מִזְרָקִים — культовые чаши или тазы, применявшиеся при жертвоприношениях; определение «жертвенные» кратко проясняет их назначение.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: перед жертвенником
  rationale: Прямая и естественная передача культового пространственного выражения.
theological_decisions:
- issue: Распространение культовой святости на обычные предметы
  choice: Сохранено прямое уподобление конской утвари и храмовых котлов освящённым предметам культа.
  alternative: Понять стих лишь как общий символ будущего благословения, не подчёркивая стирание границы между обычным и священным.
  rationale: Надпись קֹדֶשׁ לַיהוָה и сопоставление котлов с чашами перед жертвенником непосредственно переносят статус святыни на предметы, прежде считавшиеся обычными; перевод не развивает этот образ сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены храмовая терминология и лаконизм пророческой формулы; редкие предметные названия кратко пояснены в сносках.
