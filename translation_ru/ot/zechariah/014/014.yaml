source:
  edition: WLC
  text: וְ/גַ֨ם יְהוּדָ֔ה תִּלָּחֵ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/אֻסַּף֩ חֵ֨יל כָּל הַ/גּוֹיִ֜ם סָבִ֗יב זָהָ֥ב וָ/כֶ֛סֶף וּ/בְגָדִ֖ים לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
translation:
  language: ru
  text: 'И Иуда тоже будет сражаться в Иерусалиме[a], и будут собраны богатства всех окрестных народов: золото, серебро и одежды — в чрезвычайном изобилии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иуда тоже будет сражаться против Иерусалима». Еврейский предлог обычно означает «в», однако в свете контекста некоторые понимают эту фразу как указание на выступление против Иерусалима.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: И ... тоже
  rationale: Сочетание союза с добавочной частицей продолжает повествование и подчёркивает присоединение Иуды; «И ... тоже» естественно передаёт обе функции.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская форма названия народа и области Иуды.
- source_word: תִּלָּחֵם
  choice: будет сражаться
  rationale: Нифаль глагола לחם здесь означает участие в битве; эта формулировка ясна и не уточняет сверх текста характер военных действий.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог ב прежде всего имеет локативное значение «в»; возможное контекстуальное понимание «против Иерусалима» сохранено в сноске.
- source_word: וְאֻסַּף
  choice: и будут собраны
  rationale: Пассивная форма в пророческой последовательности передана будущим временем; множественное число по-русски согласуется с «богатствами».
- source_word: חֵיל
  choice: богатства
  rationale: Хотя слово может означать силу или войско, следующий перечень золота, серебра и одежд определяет здесь значение материального достояния.
- source_word: כָּל הַגּוֹיִם סָבִיב
  choice: всех окрестных народов
  rationale: «Окрестных» естественно и точно передаёт пространственное значение סָבִיב.
- source_word: זָהָב וָכֶסֶף וּבְגָדִים
  choice: золото, серебро и одежды
  rationale: Прямой и стилистически достойный перевод перечня ценностей.
- source_word: לָרֹב מְאֹד
  choice: в чрезвычайном изобилии
  rationale: Формулировка передаёт как идею множества, так и усиление מְאֹד, оставаясь естественной для современного литературного русского языка.
theological_decisions:
- issue: Означает ли בִּירוּשָׁלִָם, что Иуда сражается в Иерусалиме или против Иерусалима
  choice: Иуда тоже будет сражаться в Иерусалиме
  alternative: Иуда тоже будет сражаться против Иерусалима
  rationale: Предлог ב наиболее естественно понимать локативно — «в». Однако контекст главы позволяет некоторым понимать эту фразу как указание на противостояние Иерусалиму, поэтому альтернативу следует сохранить в сноске, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис ясен для широкого читателя; подлинная неоднозначность предлога сохранена посредством сноски.
