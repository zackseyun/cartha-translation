  text: וְ/יָצָ֣א יְהוָ֔ה וְ/נִלְחַ֖ם בַּ/גּוֹיִ֣ם הָ/הֵ֑ם כְּ/י֥וֹם הִֽלָּחֲמ֖/ו בְּ/י֥וֹם קְרָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/003.yaml
  text: Then Yahweh will go out and fight against those nations[a], as when he fights in a day of battle.
translation:
  language: ru
  text: Тогда Яхве выйдет и сразится с теми народами, как сражается Он в день битвы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как в день Его сражения, в день битвы». Еврейское сравнение допускает более буквальную передачу с повторением слова «день»; инфинитивная конструкция не уточняет временную отнесённость.'
    reason: Сохранение грамматической и временной неоднозначности еврейского сравнения.
lexical_decisions:
- source_word: וְיָצָא
  choice: Тогда ... выйдет
  rationale: В пророческом контексте форма обозначает последующее будущее действие; «тогда» естественно связывает стих с предшествующими событиями.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וְנִלְחַם
  choice: и сразится
  rationale: Глагол обозначает вступление в бой; «сразится» естественно звучит в данном военном контексте и сохраняет совершенный вид будущего действия.
- source_word: בַּגּוֹיִם הָהֵם
  choice: с теми народами
  rationale: Предлог ב при глаголе לחם указывает на противников; русская конструкция «сразиться с» естественно выражает это отношение, а «теми» передаёт הָהֵם.
- source_word: כְּיוֹם הִלָּחֲמוֹ
  choice: как сражается Он
  rationale: Сравнительная конструкция буквально содержит «день», но по смыслу может естественно передаваться как «как [в тот момент, когда] Он сражается»; настоящее время сохраняет возможное обобщённо-характерное значение.
- source_word: בְּיוֹם קְרָב
  choice: в день битвы
  rationale: Передаёт военную формулу без уточнения конкретного исторического сражения; русский язык естественно допускает единственное число без дополнительного указательного определения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Транслитерация сохраняет личное имя, непосредственно стоящее в еврейском тексте, и не подменяет его титулом.
- issue: Временная отнесённость сравнения הִלָּחֲמוֹ
  choice: как сражается Он
  alternative: как сражался Он
  rationale: Инфинитивная конструкция сама по себе не требует однозначно прошедшего времени. Настоящее время сохраняет обобщённое описание того, как Яхве выступает в битве, не привязывая сравнение к не названному в тексте событию.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия «сражается Он» слегка возвышает регистр и ясно соотносит субъект с Яхве. Маркер сноски поставлен непосредственно после всего предложения, к которому относится вариант.
