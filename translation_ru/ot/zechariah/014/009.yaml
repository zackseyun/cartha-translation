source:
  edition: WLC
  text: וְ/הָיָ֧ה יְהוָ֛ה לְ/מֶ֖לֶךְ עַל כָּל הָ/אָ֑רֶץ בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֧ה יְהוָ֛ה אֶחָ֖ד וּ/שְׁמ֥/וֹ אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
translation:
  language: ru
  text: И Яхве будет Царём над всей землёй. В тот день Яхве будет един[a], и имя Его — едино[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве будет единственным» либо «Яхве один». Еврейское слово אֶחָד означает «один», но может выражать также единственность, исключительность или единство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «имя Его будет единственным» либо «только Его имя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И ... будет
  rationale: Перфект qal с союзом в пророческом контексте имеет будущее значение; русское «будет» естественно передаёт предсказание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: לְמֶלֶךְ
  choice: Царём
  rationale: 'Предлог לְ указывает здесь на положение и функцию: Яхве будет Царём. Творительный падеж после «будет» соответствует современной русской норме.'
- source_word: עַל כָּל הָאָרֶץ
  choice: над всей землёй
  rationale: Предлог עַל выражает царское владычество, а הָאָרֶץ в данном эсхатологическом контексте имеет всеобщий охват.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивое пророческое обозначение будущего дня; форма естественна для современного русского языка.
- source_word: יִהְיֶה יְהוָה אֶחָד
  choice: Яхве будет един
  rationale: «Един» формально и ёмко передаёт אֶחָד, не сводя его смысл только к единственности, исключительности или единству.
- source_word: וּשְׁמוֹ אֶחָד
  choice: и имя Его — едино
  rationale: Сохраняется параллелизм двух употреблений אֶחָד и краткая богословская формулировка еврейского текста.
theological_decisions:
- issue: Передача Божьего имени
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон יהוה; передача «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение אֶחָד в выражении «Яхве будет един»
  choice: Сохранить «един» в основном тексте
  alternative: Яхве будет единственным; Яхве один будет признан Богом; Яхве будет один
  rationale: Еврейское אֶחָד допускает оттенки единства, единственности и исключительности. Краткое «един» сохраняет богословское напряжение, а примечание сообщает основные варианты.
- issue: Значение אֶחָד в выражении об имени
  choice: Сохранить параллельное «едино»
  alternative: имя Его будет единственным; только Его имя
  rationale: Повтор того же еврейского слова связывает обе части высказывания; параллельная русская форма не устраняет намеренно возможные оттенки смысла.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской краткостью. Формы «един» и «едино» слегка возвышенны, но понятны, сохраняют параллелизм оригинала и не устраняют его смысловую многозначность.
