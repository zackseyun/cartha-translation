base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/008.yaml
  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
translation:
  language: ru
  text: 'И будет в тот день: из Иерусалима потекут живые воды[a] — половина их к восточному морю[b], а половина к западному морю[c]. Так будет и летом, и зимой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проточные воды» либо «пресные воды»; буквально по-еврейски — «живые воды», обычное обозначение текучей или животворной воды.'
    reason: lexical_alternative
  - marker: b
    text: То есть море к востоку от Иерусалима, традиционно отождествляемое с Мёртвым морем.
    reason: cultural_note
  - marker: c
    text: То есть море к западу от Иерусалима, традиционно отождествляемое со Средиземным морем.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохранена характерная для пророческой речи формула наступления будущего события; двоеточие естественно вводит его содержание по-русски.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и понятное соответствие пророческой временной формуле, сохраняющее её эсхатологическую окраску.
- source_word: יֵצְאוּ
  choice: потекут
  rationale: Буквально глагол означает «выйдут», но при подлежащем «воды» русский глагол «потекут» естественно выражает то же движение.
- source_word: מַיִם חַיִּים
  choice: живые воды
  rationale: Сохранён буквальный библейский образ, который может обозначать текучую, свежую или животворную воду и не сводится в переводе лишь к одному оттенку.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Прямо передаёт исходную точку движения вод.
- source_word: חֶצְיָם
  choice: половина их
  rationale: Местоименный суффикс отнесён к ранее названным водам; русская формулировка сохраняет это указание.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: восточное море
  rationale: Направленческое значение קַדְמוֹנִי передано без внесения традиционного географического отождествления в основной текст.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: западное море
  rationale: В данной паре אַחֲרוֹן обозначает противоположное, западное направление; перевод ясно передаёт географический контраст.
- source_word: בַּקַּיִץ וּבָחֹרֶף
  choice: и летом, и зимой
  rationale: Парная русская конструкция естественно подчёркивает непрерывность явления во все сезоны.
- source_word: יִהְיֶה
  choice: Так будет
  rationale: Краткая форма сохраняет единственное число еврейского глагола и естественно отсылает ко всему описанному течению вод.
theological_decisions:
- issue: Возможный символический смысл выражения מַיִם חַיִּים
  choice: Сохранить в основном тексте выражение «живые воды», не определяя его как исключительно физическое или исключительно символическое.
  alternative: Передать только как «проточная вода», «свежая вода» либо истолковать как исключительно духовную, животворящую воду.
  rationale: Еврейское выражение может обычно обозначать текучую или свежую воду, но в пророческом контексте допускает более глубокий богословский смысл. Буквальный образ сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; библейский образ «живые воды» сохранён, а географические пояснения вынесены в сноски.
