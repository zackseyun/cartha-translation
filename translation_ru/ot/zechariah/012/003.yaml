base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
translation:
  language: ru
  text: В тот день Я сделаю Иерусалим тяжёлым камнем для всех народов[a]. Все, кто станет поднимать его, непременно тяжело поранятся[b], и все народы земли[c] соберутся против Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камнем, тяжёлым для всех народов»; еврейское выражение может обозначать тяжёлый камень, который поднимают или несут как груз.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «непременно будут изрезаны (изранены)» — усиленная еврейская конструкция, указывающая на тяжёлые повреждения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «все народы страны», если слово «земля» понимать в более локальном смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохраняет пророческую формулу и связь с предшествующим текстом, оставаясь естественным для современного литературного русского языка.
- source_word: אָשִׂים אֶת יְרוּשָׁלִַם אֶבֶן מַעֲמָסָה
  choice: Я сделаю Иерусалим тяжёлым камнем
  rationale: Глагол שׂים в этой конструкции обозначает придание нового состояния, а אֶבֶן מַעֲמָסָה — тяжёлый камень, который пытаются поднять или нагрузить на себя.
- source_word: לְכָל הָעַמִּים
  choice: для всех народов
  rationale: «Народы» естественно передаёт множественное עַמִּים; отличие от последующего גּוֹיִם в русском контексте невозможно сохранить без неестественного выражения.
- source_word: כָּל עֹמְסֶיהָ
  choice: все, кто попытается поднять его
  rationale: Причастие от עמס связано с поднятием или возложением груза. Добавление «попытается» естественно выражает попытку поднять камень, заканчивающуюся травмой.
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  choice: непременно изранят себя
  rationale: Инфинитив абсолютный с личной формой усиливает утверждение, а корень שׂרט означает нанесение порезов или ран. Формулировка сохраняет и интенсивность, и образ телесного повреждения.
- source_word: וְנֶאֶסְפוּ עָלֶיהָ
  choice: соберутся против него
  rationale: В военно-пророческом контексте עַל выражает враждебную направленность. Местоимение согласовано с грамматическим родом названия «Иерусалим» в русском языке.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: все народы земли
  rationale: В международном контексте пророчества הָאָרֶץ естественнее понимать широко — как землю или мир, хотя локальное значение «страна» остаётся возможным.
theological_decisions:
- issue: Масштаб враждебного союза против Иерусалима
  choice: все народы земли
  alternative: все народы страны
  rationale: Широкий международный контекст поддерживает значение «земля, мир», однако еврейское הָאָרֶץ допускает и более локальное значение; эта неоднозначность отмечена в сноске, а не устранена догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён образ тяжёлого камня и усиление в описании ран; грамматические местоимения согласованы с русским мужским родом названия «Иерусалим».
