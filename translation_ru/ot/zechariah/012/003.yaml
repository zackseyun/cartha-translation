  source_fidelity: 'Нужна небольшая правка. עֹמְסֶיהָ обозначает тех, кто поднимает/нагружает себя этим камнем; добавление «попытается» вносит не выраженную в тексте модальность. שָׂרוֹט יִשָּׂרֵטוּ — усиленная пассивная форма: смысл тяжёлого ранения передан лучше без излишне определённого возвратного «себя». Местоименный суффикс в заключении относится к Иерусалиму, поэтому повтор имени устраняет русскую двусмысленность между городом и камнем.'
  naturalness: «В тот день Я сделаю…» — естественная современная литературная передача пророческой формулы. «Непременно тяжело поранятся» сохраняет усиление и образ телесного повреждения, звуча естественнее, чем «изранят себя». Повтор «Иерусалима» в последней клаузе делает референт ясным.
  terminology: «Иерусалим», «тяжёлый камень», «народы земли» и враждебное «соберутся против» соответствуют исходному тексту и английскому аудиторскому следу. Различие עַמִּים и גּוֹיִם в данном русском контексте не следует искусственно маркировать. Сноска о локальном значении הָאָרֶץ сохраняет допустимую неоднозначность.
