  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
translation:
  language: ru
  text: И Яхве сначала спасёт шатры Иуды[a], чтобы слава дома Давида и слава жителей Иерусалима не возвысилась над Иудой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жилища Иуды». В еврейском тексте буквально сказано «шатры Иуды»; вероятно, они противопоставлены Иерусалиму и дому Давида как поселения Иуды вне Иерусалима.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не стала великой над Иудой» или «не возвеличилась над Иудой». Еврейский глагол может обозначать возрастание или возвышение; выражение указывает на превосходство по отношению к Иуде.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הוֹשִׁיעַ
  choice: и спасёт
  rationale: Порода hифиль глагола ישׁע означает «спасти, избавить»; «спасёт» естественно звучит по-русски и сохраняет богословскую значимость Божьего избавления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом.
- source_word: אָהֳלֵי יְהוּדָה
  choice: шатры Иуды
  rationale: Буквальный образ шатров, вероятно обозначающий поселения Иуды вне столицы, важен для противопоставления Иерусалиму и дому Давида.
- source_word: בָּ/רִאשֹׁנָה
  choice: прежде
  rationale: Наречие указывает на приоритет в последовательности; «прежде» здесь естественнее, чем двусмысленное русское «сначала».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза.
- source_word: תִגְדַּל
  choice: не возвысилась
  rationale: Глагол גדל означает «стать великим, возвыситься»; при подлежащем «слава» эта форма естественна и вместе с עַל выражает превосходство над Иудой.
- source_word: תִּפְאֶרֶת
  choice: слава
  rationale: Слово может означать славу, великолепие или почёт; «слава» сохраняет широкий смысл и параллелизм.
- source_word: בֵּית דָּוִיד
  choice: дом Давида
  rationale: Устоявшееся обозначение Давидовой династии, сохраняющее буквальный образ дома.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Единственное число причастия имеет собирательное значение; множественное число естественно передаёт его в современном русском языке.
- source_word: עַל יְהוּדָה
  choice: над Иудой
  rationale: Предлог здесь выражает превосходство или более высокое положение по отношению к Иуде.
theological_decisions:
- issue: Социально-политическое противопоставление внутри Божьего народа
  choice: Сначала спасаются шатры Иуды, чтобы дом Давида и жители Иерусалима не возвысились над Иудой.
  alternative: Стих сообщает только хронологическую последовательность спасения, не подчёркивая уравновешивание статуса.
  rationale: Сопоставление шатров Иуды с домом Давида и жителями Иерусалима, усиленное целевым придаточным, указывает не только на последовательность, но и на предотвращение превосходства царского и столичного центра. Перевод сохраняет этот смысл, не уточняя его сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены личное имя Яхве, метафора «шатры Иуды» и двукратное «слава» ради параллелизма. Порядок примечаний приведён к последовательному [a], [b].
