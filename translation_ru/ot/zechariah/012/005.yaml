source:
  edition: WLC
  text: וְ/אָֽמְר֛וּ אַלֻּפֵ֥י יְהוּדָ֖ה בְּ/לִבָּ֑/ם אַמְצָ֥ה לִ/י֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם בַּ/יהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
translation:
  language: ru
  text: 'И скажут роды Иуды[a] в своих сердцах: «Жители Иерусалима — моя сила в Яхве Воинств[b], их Боге».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вожди Иуды» либо «главы родов Иуды». Древнееврейское слово אַלֻּפֵי может обозначать как родовые объединения, так и их предводителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Жители Иерусалима — сила для меня благодаря Яхве Воинств, их Богу». Предлог может указывать как на сферу («в»), так и на средство или основание («благодаря», «посредством»).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И скажут
  rationale: Союз и глагольная форма продолжают пророческое описание будущего; простое «и скажут» естественно передаёт последовательность, не усиливая её сверх текста.
- source_word: אַלֻּפֵי יְהוּדָה
  choice: роды Иуды
  rationale: אַלּוּף может обозначать как родовую группу, так и её главу. В основном тексте выбрано корпоративное значение, соответствующее противопоставлению Иуды и Иерусалима; личное значение отмечено в сноске.
- source_word: בְּלִבָּם
  choice: в своих сердцах
  rationale: Сохранён древнееврейский образ внутренней речи и убеждения; множественное число согласовано с подлежащим.
- source_word: אַמְצָה לִי
  choice: моя сила
  rationale: 'Сжатое выражение «сила для меня» естественно передано как «моя сила». Единственное число первого лица сохранено как распределительная речь: каждый род говорит от своего лица.'
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: Жители Иерусалима
  rationale: Прямой и современный эквивалент субстантивированного причастия со значением постоянно живущих в городе.
- source_word: בַּיהוָה צְבָאוֹת
  choice: в Яхве Воинств
  rationale: Предлог ב передан как «в», сохраняя возможное значение сферы или основания силы. Имя יהוה транслитерировано как «Яхве», а צְבָאוֹת — прозрачным словом «Воинств».
- source_word: אֱלֹהֵיהֶם
  choice: их Боге
  rationale: Местоименный суффикс множественного числа относится к жителям Иерусалима; падеж обусловлен конструкцией «в Яхве …, их Боге».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит имя завета יהוה. Форма «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных воинств
  rationale: «Воинств» сохраняет военную образность и широту исходного титула, не ограничивая его явно только небесными силами и не используя малопонятную современному читателю транслитерацию.
- issue: Связь силы жителей Иерусалима с Яхве
  choice: моя сила в Яхве Воинств
  alternative: сила для меня благодаря Яхве Воинств
  rationale: Древнееврейский предлог ב допускает понимание сферы, основания или средства. Основной текст сохраняет формальную конструкцию «в», а сноска представляет естественную причинно-инструментальную возможность.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены внутренняя речь, распределительное «моя» при множественном подлежащем и смысловая сжатость оригинала. Необычность титула «Яхве Воинств» намеренна: она прозрачно передаёт имя и военную образность еврейского выражения.'
