  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: будущее высказывание, внутреннюю речь, корпоративное значение אַלֻּפֵי («роды»), распределительное первое лицо единственного числа («моя»), жителей Иерусалима и титул Яхве. Неоднозначность בַּיהוָה сохранена основным вариантом «в» и оговорена в сноске; альтернативное понимание как основания/средства не выдано за единственно возможное.'
