  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אַכֶּ֤ה כָל סוּס֙ בַּ/תִּמָּה֔וֹן וְ/רֹכְב֖/וֹ בַּ/שִּׁגָּע֑וֹן וְ/עַל בֵּ֤ית יְהוּדָה֙ אֶפְקַ֣ח אֶת עֵינַ֔/י וְ/כֹל֙ ס֣וּס הָֽ/עַמִּ֔ים אַכֶּ֖ה בַּֽ/עִוָּרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
translation:
  language: ru
  text: В тот день, — возвещает Яхве, — Я поражу каждого коня смятением, а его всадника — безумием. Но на дом Иуды Я обращу взор[a] и поражу каждого коня народов[b] слепотой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я открою Мои глаза на дом Иуды». Этот образ, вероятно, выражает внимательное и благосклонное отношение.'
    reason: лексическая и идиоматическая альтернатива
  - marker: b
    text: 'Или: «каждого коня племён».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула передана естественно и торжественно; «возвещает» выражает авторитетное божественное изречение, а личное имя Яхве сохраняет форму исходного текста.
- source_word: אַכֶּה
  choice: Я поражу
  rationale: Передаёт значение Hiphil от נכה без архаичного «сокрушу» и без добавочного указания на смертельный исход.
- source_word: כָל סוּס
  choice: каждого коня
  rationale: Единственное число после כָל имеет распределительное значение, естественно выражаемое по-русски сочетанием «каждого коня».
- source_word: בַּתִּמָּהוֹן
  choice: смятением
  rationale: Слово обозначает ошеломление, растерянность или панический ужас; «смятение» сохраняет широту значения и подходит возвышенному военному контексту.
- source_word: וְרֹכְבוֹ
  choice: а его всадника
  rationale: Местоименный суффикс относится к коню; союз передан как «а» для естественного русского параллелизма.
- source_word: בַּשִּׁגָּעוֹן
  choice: безумием
  rationale: Прямо передаёт тяжёлое помрачение рассудка, не придавая выражению современного клинического оттенка.
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  choice: Но на дом Иуды Я открою глаза
  rationale: Сохранены образ и направленность еврейского выражения; «но» выявляет контраст с судом над конями и всадниками, не превращая подразумеваемое благоволение в явное утверждение о защите.
- source_word: בֵּית יְהוּדָה
  choice: дом Иуды
  rationale: Сохранена заветно-родовая формула, а не сведена к одному географическому или политическому названию «Иуда».
- source_word: כֹל סוּס הָעַמִּים
  choice: каждого коня народов
  rationale: «Народов» близко передаёт множественное עַמִּים и сохраняет возможность понимать его как чужеземные народы или нации.
- source_word: בַּעִוָּרוֹן
  choice: слепотой
  rationale: Прямой эквивалент, сохраняющий параллель с «смятением» и «безумием».
theological_decisions:
- issue: Божественный взгляд на дом Иуды
  choice: Сохранить буквальный образ «Я открою глаза», который в контексте допускает внимательное и благосклонное отношение.
  alternative: «Я буду хранить дом Иуды» или «Я буду бодрствовать над домом Иуды».
  rationale: Более толковательные варианты прямо утверждают защиту, тогда как исходный текст выражает её лишь контекстуально; буквальный образ сохраняет смысловую напряжённость.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное имя в исходном тексте и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксический параллелизм исходного текста сохранён; архаизмы и чрезмерно толковательные формулировки исключены. Все сноски отмечены в основном тексте.
