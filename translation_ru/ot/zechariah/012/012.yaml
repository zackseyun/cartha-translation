base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
translation:
  language: ru
  text: 'И будет скорбеть страна[a], род за родом, каждый отдельно: род дома Давида — отдельно, и их жёны — отдельно; род дома Нафана — отдельно, и их жёны — отдельно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָפְדָה
  choice: И будет оплакивать
  rationale: Глагол ספד обозначает скорбное оплакивание или плач; «оплакивать» естественно передаёт общественный траур, не уточняя его внешнюю форму.
- source_word: הָאָרֶץ
  choice: вся страна
  rationale: אֶרֶץ допускает значения «земля» и «страна». Контекст перечисления родов Иудеи и Иерусалима указывает на страну и её население; «вся» естественно выражает собирательный смысл подлежащего.
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת
  choice: род за родом
  rationale: Повтор существительного имеет распределительное значение. «Род за родом» сохраняет его заметнее и естественнее по-русски, чем буквальное повторение.
- source_word: לְבָד
  choice: каждый отдельно / отдельно
  rationale: לבד подчёркивает раздельность плача. Повтор «отдельно» сохранён во всех перечисленных группах, как в еврейском тексте.
- source_word: מִשְׁפַּחַת בֵּית דָּוִיד
  choice: род дома Давида
  rationale: Конструкция обозначает династическую семейную линию; «род дома Давида» сохраняет оба элемента и звучит по-русски торжественно, но понятно.
- source_word: וּנְשֵׁיהֶם
  choice: и их жёны
  rationale: Хотя אשה может значить «женщина» или «жена», местоименный суффикс и семейный контекст естественно указывают на жён.
- source_word: מִשְׁפַּחַת בֵּית נָתָן
  choice: род дома Нафана
  rationale: Передаётся как именованная родовая линия параллельно дому Давида; имя נָתָן традиционно и фонетически обоснованно передано как «Нафан».
theological_decisions:
- issue: Объём значения הָאָרֶץ в пророческом контексте
  choice: страна
  alternative: земля
  rationale: Ближайший контекст говорит о конкретных родах Иудеи и Иерусалима, поэтому речь, вероятнее всего, идёт о стране и её населении, а не обо всей земле; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Распределительный повтор передан выражением «род за родом», а многократное לְבָד — последовательным «отдельно», чтобы сохранить риторический акцент оригинала.
