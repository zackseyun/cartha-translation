  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יָגֵ֤ן יְהוָה֙ בְּעַד֙ יוֹשֵׁ֣ב יְרוּשָׁלִַ֔ם וְ/הָיָ֞ה הַ/נִּכְשָׁ֥ל בָּ/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/דָוִ֑יד וּ/בֵ֤ית דָּוִיד֙ כֵּֽ/אלֹהִ֔ים כְּ/מַלְאַ֥ךְ יְהוָ֖ה לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
translation:
  language: ru
  text: В тот день Яхве будет защищать жителей Иерусалима, и тот, кто спотыкается среди них, в тот день будет как Давид, а дом Давида — как Бог[a], как ангел Яхве перед ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как боги»; или: «как божественные существа». Еврейское אֱלֹהִים в некоторых контекстах допускает эти значения, хотя здесь наиболее вероятно значение «как Бог».'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגֵן
  choice: будет защищать
  rationale: Глагол обозначает прикрытие и защиту. Русское «защищать» естественно сочетается с предлогом בְּעַד и ясно передаёт смысл обороны, не добавляя отсутствующего в тексте предметного образа щита.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: жителей Иерусалима
  rationale: Причастие в единственном числе имеет собирательное значение; множественное «жителей» естественно передаёт его по-русски.
- source_word: הַנִּכְשָׁל
  choice: споткнувшийся
  rationale: Сохраняет конкретный образ корня כשל и допускает подразумеваемые значения слабости и шаткости, не сводя выражение только к «слабому».
- source_word: בָּהֶם
  choice: среди них
  rationale: 'Предлог понимается в социально-корпоративном смысле: споткнувшийся находится среди жителей Иерусалима.'
- source_word: כְּדָוִיד
  choice: как Давид
  rationale: Прямая и естественная передача сравнения без поясняющего добавления о силе или царском достоинстве Давида.
- source_word: בֵּית דָּוִיד
  choice: дом Давида
  rationale: Сохраняет одновременно семейный и династический оттенки устойчивого библейского выражения.
- source_word: כֵּאלֹהִים
  choice: как Бог
  rationale: В ближайшем контексте параллель с «ангелом Яхве» поддерживает единственное референтное значение, хотя лексическая неоднозначность אֱלֹהִים отмечена в сноске.
- source_word: כְּמַלְאַךְ יְהוָה
  choice: как ангел Яхве
  rationale: В устойчивом библейском сочетании מַלְאָךְ יְהוָה преимущественно обозначает сверхъестественного посланника; «ангел» сохраняет межтекстовые связи.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Формально близкая передача оставляет открытыми оттенки предводительства, движения впереди и присутствия перед народом.
theological_decisions:
- issue: Значение אֱלֹהִים в сравнении с домом Давида
  choice: «как Бог»
  alternative: «как боги» или «как божественные существа»
  rationale: Последующее сравнение с ангелом Яхве склоняет к единственному и возвышенному сравнению, однако форма אֱלֹהִים допускает в иных контекстах множественные значения. Основной текст передаёт наиболее вероятное прочтение, а сноска сохраняет подлинную неоднозначность.
- issue: Характер выражения מַלְאַךְ יְהוָה
  choice: «ангел Яхве»
  alternative: «посланник Яхве»
  rationale: Слово מַלְאָךְ само по себе может означать посланника, но устойчивое выражение и возвышенный параллелизм здесь поддерживают традиционное «ангел», без дальнейшего догматического отождествления.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксический параллелизм оригинала сохранён; тире восполняет подразумеваемую связку. Личное имя Яхве передано последовательно. Неоднозначность אֱלֹהִים вынесена в сноску, маркер которой присутствует в основном тексте.
