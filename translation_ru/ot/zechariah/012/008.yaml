  verdict: revise
  source_fidelity: 'Смысловой строй и все основные соответствия еврейскому тексту переданы верно: защитное действие Яхве, собирательные жители Иерусалима, сопоставления с Давидом, Богом и ангелом Яхве, а также «перед ними». Однако «споткнувшийся» в русском обычно обозначает разовое уже совершившееся действие, тогда как определённое причастие נִכְשָׁל описывает человека как слабого/спотыкающегося; настоящее относительное выражение точнее сохраняет этот аспект.'
