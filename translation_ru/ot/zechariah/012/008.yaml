  - severity: low
    issue: Фраза сноски «имеется в виду единственное число» неточна в отношении формы אֱלֹהִים.
    rationale: Форма אֱלֹהִים морфологически множественна; в контексте вероятно единоличное значение «Бог». Это лучше выразить без утверждения о грамматическом единственном числе.
