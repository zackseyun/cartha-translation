translation:
  language: ru
  text: И в тот день Я буду стремиться истребить все народы, выступающие против Иерусалима.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я задамся целью истребить». Еврейский глагол может выражать твёрдое, целенаправленное намерение, а не просто поиск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохранена обычная пророческая формула будущего события; по-русски она естественно соединяется с обстоятельством времени.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и естественное соответствие пророческой временной формуле без уточнения времени исполнения.
- source_word: אֲבַקֵּשׁ
  choice: Я вознамерюсь
  rationale: В сочетании с инфинитивом глагол выражает целенаправленное намерение и решимость, а не поиск способа или простое желание.
- source_word: לְהַשְׁמִיד
  choice: истребить
  rationale: Передаёт каузативное значение уничтожения и силу данного контекста; это современное литературное слово без разговорной окраски.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: Сохраняет собирательный и всеобъемлющий смысл; «язычники» внесло бы более позднее религиозное противопоставление.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: выступающие против Иерусалима
  rationale: Причастие обозначает народы, направляющиеся с враждебным намерением; «выступающие против» естественно передаёт военную направленность עַל в контексте.
theological_decisions:
- issue: Божественный говорящий и действие суда
  choice: 'Сохранена прямая речь от первого лица: «Я вознамерюсь истребить».'
  alternative: Безличная передача будущего уничтожения народов.
  rationale: Форма первого лица единственного числа прямо представляет Бога говорящим и действующим; перевод не смягчает и не обезличивает эту агентность.
- issue: Пророческая формула времени
  choice: «в тот день» без пояснения её исторического или эсхатологического референта.
  alternative: Раскрыть формулу как указание на конкретную эсхатологическую схему.
  rationale: Сам стих не определяет сроки и способ исполнения, поэтому перевод сохраняет пророческую открытость.
- issue: Оттенок אֲבַקֵּשׁ
  choice: Основной текст передаёт решительное намерение словом «вознамерюсь».
  alternative: 'Более буквально: «буду искать, как истребить» или «постараюсь истребить».'
  rationale: Буквальная русская формулировка могла бы ошибочно подразумевать неуверенность или поиск средств; примечание сохраняет лексическую особенность и альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Двоеточие после временной формулы делает синтаксис ясным; «вознамерюсь» несколько возвышенно, но понятно и точно передаёт решительную целенаправленность. Маркер примечания поставлен непосредственно после предложения.
