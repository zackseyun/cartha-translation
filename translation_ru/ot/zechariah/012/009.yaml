  terminology: '«Истребить», «все народы», «против Иерусалима» уместны и точны в данном контексте. Название «Иерусалим» и термин «народы» сохранены. Примечание следует переформулировать: «буквальнее» не должно сопровождаться неестественной русской конструкцией «искать, чтобы истребить».'
