  source_fidelity: 'Основной смысл передан верно: сохранены будущее время, первое лицо божественного говорящего, всеобщий объект («все народы») и враждебная направленность против Иерусалима. Однако «вознамерюсь» передаёт лишь момент принятия намерения и несколько сужает значение אֲבַקֵּשׁ, которое здесь выражает целенаправленное устремление/решимость. Начальная формула «И будет в тот день:» в данном синтаксисе звучит искусственно для современного литературного русского.'
