  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
translation:
  language: ru
  text: В тот день плач в Иерусалиме станет великим[a], как плач Хадад-Риммона на равнине Мегиддо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хадад-Риммон может обозначать место близ Мегиддо, возможно связанное с плачем по Иосии (ср. 2 Пар. 35:22–25), либо другую широко известную традицию плача.
    reason: Альтернативные толкования не позволяют уверенно отождествить Хадад-Риммон или конкретный плач.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная для современного русского языка передача устойчивой пророческой временной формулы с сохранением её указательного значения.
- source_word: יִגְדַּל
  choice: станет великим
  rationale: Глагол גדל выражает становление или возрастание; такая передача сохраняет динамику и согласуется с образом плача большой силы.
- source_word: הַמִּסְפֵּד
  choice: плач
  rationale: מִסְפֵּד обозначает публичный траурный плач или оплакивание умершего. «Плач» здесь звучит естественно, ёмко и торжественно.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямая передача обстоятельства места.
- source_word: כְּמִסְפַּד
  choice: как плач по
  rationale: Предлог כ вводит сравнение, а конструкция обозначает известный плач, связанный с Хадад-Риммоном. Русское «плач по» естественно передаёт траурный контекст, не уточняя, является ли имя лицом, местом или названием традиции.
- source_word: הֲדַד רִמּוֹן
  choice: Хадад-Риммон
  rationale: Имя транслитерировано и сохранено без спорной идентификации; дефис отражает составную форму.
- source_word: בְּבִקְעַת מְגִדּוֹן
  choice: на равнине Мегиддо
  rationale: בִּקְעָה обозначает широкую долину или равнину; «на равнине» естественно передаёт топографический смысл.
theological_decisions:
- issue: Идентификация Хадад-Риммона
  choice: Сохранить имя в основном тексте без уточнения исторического события.
  alternative: Понимать выражение как указание на плач по царю Иосии у Мегиддо либо как культовый плач, связанный с Хададом-Риммоном.
  rationale: Еврейский текст не объясняет имя, а его историческая и религиозная идентификация остаётся спорной. Основной текст сохраняет эту неоднозначность, а примечание сообщает основные варианты.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, без архаизации. Неоднозначность имени Хадад-Риммон сохранена и пояснена в сноске.
