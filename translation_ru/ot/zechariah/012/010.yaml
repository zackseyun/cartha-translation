base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
translation:
  language: ru
  text: И Я изолью на дом Давида и на жителей Иерусалима дух благодати и мольбы[a]. Они взглянут на Меня, Которого они пронзили, и будут оплакивать Его[b], как оплакивают единственного сына, и горько оплакивать Его, как горько оплакивают первенца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух благодати и просьб о милости».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь происходит переход от «Меня» к «Его»; перевод сохраняет эту напряжённость, не согласовывая местоимения.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁפַכְתִּי
  choice: изолью
  rationale: Сохраняет метафору щедрого дарования и естественно сочетается в русском языке со словом «дух».
- source_word: רוּחַ חֵן וְתַחֲנוּנִים
  choice: дух благодати и молений о милости
  rationale: Строчная буква сохраняет неопределённость относительно того, обозначен ли здесь Святой Дух или даруемое расположение; «моления о милости» доступно передаёт смысл настойчивых просьб о благоволении.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: жителей Иерусалима
  rationale: Грамматически единственное причастие имеет собирательное значение, которое естественно передаётся русским множественным числом.
- source_word: וְהִבִּיטוּ אֵלַי
  choice: обратят взор ко Мне
  rationale: Передаёт направленность внимания, выраженную предлогом אֶל, и сохраняет возвышенный, но понятный регистр.
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  choice: к Тому, Кого пронзили
  rationale: Явно передаёт личный референт относительной конструкции и обычное значение דקר — «пронзить».
- source_word: וְסָפְדוּ עָלָיו
  choice: будут оплакивать Его
  rationale: Глагол обозначает траурный плач; «оплакивать» естественно выражает это значение по-русски.
- source_word: הַיָּחִיד
  choice: единственного сына
  rationale: В контексте утраты мужской образ естественно передаётся как «единственный сын», не ослабляя силу сравнения.
- source_word: וְהָמֵר עָלָיו
  choice: горько скорбеть о Нём
  rationale: Передаёт интенсивную горечь утраты и поддерживает поэтический параллелизм, избегая не засвидетельствованного прямого добавления глагола «плакать».
- source_word: הַבְּכוֹר
  choice: первенце
  rationale: Сохраняет культурную и эмоциональную значимость утраты первенца без лишнего уточнения.
theological_decisions:
- issue: Переход от первого лица «ко Мне» к третьему лицу «Его»
  choice: 'Сохранить: «ко Мне — к Тому, Кого пронзили… оплакивать Его»'
  alternative: Согласовать местоимения как «смотреть на Меня… оплакивать Меня» либо изменить текст
  rationale: Масоретский текст содержит выразительный переход от первого лица к третьему; перевод сохраняет эту богословски значимую напряжённость, не устраняя её толкованием.
- issue: Обозначает ли רוּחַ непосредственно Святого Духа
  choice: «дух» со строчной буквы
  alternative: «Дух благодати и моления» с прописной буквы
  rationale: Еврейская формулировка допускает действие Божьего Духа, но сама по себе не требует однозначной идентификации; строчная буква сохраняет неопределённость.
- issue: Позднейшее христологическое прочтение стиха
  choice: Переводить непосредственно еврейский текст без добавленной мессианской идентификации
  alternative: Эксплицитно обозначить пронзённого как Мессию
  rationale: Текст остаётся совместим с христологическим прочтением, однако перевод не вносит в основную строку сведений, отсутствующих в исходной формулировке.
