  to: И Я изолью на дом Давида и на жителей Иерусалима дух благодати и мольбы[a]. Они взглянут на Меня, Которого они пронзили, и будут оплакивать Его[b], как оплакивают единственного сына, и горько оплакивать Его, как горько оплакивают первенца.
  rationale: Перевод упрощён там, где русская синтаксическая ясность позволяет точнее передать еврейскую относительную конструкцию. Лексика «мольбы» естественна и не сужает значение. Сноска о местоименном переходе перенесена к месту, которое она объясняет; отдельная сноска к варианту «взглянут» не требуется, поскольку «на Меня» уже передаёт допустимый и естественный вариант значения.
