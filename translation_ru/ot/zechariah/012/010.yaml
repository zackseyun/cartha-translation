  source_fidelity: В основной строке верно переданы излияние, собирательные «жители Иерусалима», «дух благодати», пронзение, траур по единственному сыну и первенцу. Однако конструкция «ко Мне — к Тому, Кого пронзили» неоправданно разворачивает еврейскую относительную конструкцию в пояснительное приложение и делает фразу тяжеловесной. Более прямое «на Меня, Которого они пронзили» точнее передаёт אֵלַי אֵת אֲשֶׁר דָּקָרוּ. Переход от первого лица к третьему должен быть сохранён и отмечен сноской непосредственно при «Его».
  naturalness: «Дух благодати и молений о милости» понятно, но «мольбы» естественнее, лаконичнее и ближе к תַּחֲנוּנִים. «Взглянут на Меня» — современная литературная и достаточно торжественная формулировка. «Горько оплакивать» ясно выражает усиленное скорбное оплакивание и сохраняет параллелизм.
  terminology: Строчная буква в слове «дух» корректно не предрешает референт רוּחַ. «Пронзили», «единственный сын» и «первенец» точны. Местоимения «Меня» / «Его» сохранены без богословской гармонизации.
