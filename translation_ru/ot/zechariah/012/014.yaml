  text: all the families that remain[a], family by family by themselves, and their wives by themselves.
translation:
  language: ru
  text: все оставшиеся роды — каждый род отдельно, и их жёны отдельно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «роды, роды отдельно, и их женщины (или жёны) отдельно». Повтор слова «роды» имеет распределительное значение: каждый род отдельно.'
    reason: 'Сохраняет сведения о еврейском распределительном повторе и неоднозначности слова נָשִׁים: «женщины» или в данном контексте «жёны».'
lexical_decisions:
- source_word: כֹּל הַמִּשְׁפָּחוֹת הַנִּשְׁאָרוֹת
  choice: все оставшиеся роды
  rationale: «Все» передаёт совокупный охват, «оставшиеся» — значение причастия от שׁאר без уточнения причины, по которой они остались. «Роды» здесь естественно обозначает расширенные семейно-родовые группы, а не только отдельные домашние семьи.
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  choice: каждый род
  rationale: Повтор существительного имеет распределительное значение. Русское «каждый род» ясно и естественно передаёт это значение, не воспроизводя механически еврейский повтор.
- source_word: לְבָד
  choice: отдельно
  rationale: Передаёт отделённость каждой группы; повтор слова в конце стиха сохранён для соответствия еврейскому акценту.
- source_word: וּנְשֵׁיהֶם
  choice: и их жёны
  rationale: В данном семейно-родовом контексте נָשִׁים наиболее естественно понимать как «жёны», хотя лексически возможно более широкое «женщины».
theological_decisions:
- issue: Раздельное участие мужчин и женщин в плаче
  choice: 'Сохранено прямое указание: «их жёны отдельно»'
  alternative: «их женщины отдельно»
  rationale: Еврейский текст явно отмечает раздельность групп. Перевод не сглаживает это различие, а лексическая неоднозначность נָשִׁים указана в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. «Роды» выбрано вместо более узкого «семьи», поскольку речь идёт о крупных родовых группах; тире естественно вводит распределительное пояснение.
