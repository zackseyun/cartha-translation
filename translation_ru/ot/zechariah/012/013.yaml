  text: מִשְׁפַּ֤חַת בֵּית לֵוִי֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָ֑ד מִשְׁפַּ֤חַת הַ/שִּׁמְעִי֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/013.yaml
  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
translation:
  language: ru
  text: род дома Левия — отдельно, и их жёны — отдельно; род Шимея[a] — отдельно, и их жёны — отдельно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «род шимеитов». Еврейское обозначение, вероятно, относится к клану потомков Шимея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת
  choice: род
  rationale: Слово обозначает родственную группу шире отдельной семьи. «Род» естественно передаёт генеалогический и клановый смысл в данном перечне.
- source_word: בֵּית לֵוִי
  choice: дома Левия
  rationale: Сохранён буквальный образ «дома» как линии потомков Левия, а не только общее обозначение левитов.
- source_word: לְבָד
  choice: отдельно
  rationale: Повтор слова сохранён во всех четырёх случаях, чтобы передать подчёркнутое раздельное совершение плача и ритм еврейского текста.
- source_word: וּנְשֵׁיהֶם
  choice: и их жёны
  rationale: В семейном контексте נָשִׁים с местоименным суффиксом наиболее естественно означает «их жёны»; перевод сохраняет явное разделение мужчин и женщин.
- source_word: הַשִּׁמְעִי
  choice: Шимея
  rationale: Форма связана с именем Шимей и может обозначать как самого родоначальника в названии рода, так и образованный от его имени клан. В основном тексте употреблено естественное русское генеалогическое выражение «род Шимея», а групповой смысл отмечен в сноске.
theological_decisions:
- issue: Раздельный плач мужчин и женщин
  choice: Сохранить прямое упоминание жён и четырёхкратное «отдельно».
  alternative: 'Обобщить: «каждый род отдельно, мужчины и женщины отдельно».'
  rationale: Еврейский текст последовательно называет род и его жён отдельно. Обобщение ослабило бы повтор и конкретную структуру описанного плача.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире поддерживают повторяющийся ритм оригинала; «род» предпочтён более бытовому «семья» и более специальному «клан».
