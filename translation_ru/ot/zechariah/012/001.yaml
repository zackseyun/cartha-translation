source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
translation:
  language: ru
  text: 'Пророческое изречение — слово Яхве об Израиле: так говорит Яхве, простирающий небеса, закладывающий основание земли и образующий дух человека в нём[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «образующий человеческий дух внутри него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: пророческое изречение
  rationale: В заголовках пророчеств слово обозначает весомое пророческое возвещение. Такое сочетание ясно современному читателю и сохраняет торжественный характер текста, не сводя смысл к буквальному «бремени».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена устойчивая пророческая формула и её связь с Божьим откровением; «весть» было бы более толковательным переводом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עַל
  choice: об
  rationale: Предлог здесь наиболее естественно указывает на предмет пророчества. Дальнейший контекст содержит и суд, и спасение Израиля, поэтому «против» было бы преждевременным сужением смысла; возможность такого значения отмечена в сноске.
- source_word: נְאֻם יְהוָה
  choice: Возвещение Яхве
  rationale: Именная пророческая формула сохранена как именная, а не преобразована в глагольное «говорит Яхве».
- source_word: נֹטֶה שָׁמַיִם
  choice: простирающего небеса
  rationale: Причастная форма передаёт продолжающееся величественное описание Яхве как Творца.
- source_word: וְיֹסֵד אָרֶץ
  choice: закладывающего основание земли
  rationale: Глагол יָסַד связан с основанием и учреждением; выбранный оборот сохраняет наглядный образ творения.
- source_word: וְיֹצֵר רוּחַ אָדָם
  choice: и образующего дух человека
  rationale: יֹצֵר передаёт образ формирования или придания формы, а רוּחַ в данном контексте естественно понимается как внутренний дух человека.
- source_word: אָדָם
  choice: человека
  rationale: Русское единственное число сохраняет собирательно-представительный смысл еврейского אָדָם и при этом естественно охватывает человека как такового.
- source_word: בְּקִרְבּוֹ
  choice: в нём
  rationale: Местоименный суффикс мужского рода и единственного числа естественно относится к אָדָם; перевод сохраняет эту грамматическую связь без лишнего уточнения.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Обобщающее значение אָדָם
  choice: человек
  alternative: человечество; человеческое существо
  rationale: Еврейское слово имеет форму единственного числа и обозначает человека как представителя человеческого рода. Русское «человек» сохраняет и грамматическое число, и обобщающий смысл.
- issue: Направленность пророчества в сочетании עַל יִשְׂרָאֵל
  choice: об Израиле
  alternative: против Израиля
  rationale: Предлог допускает оба оттенка. Поскольку последующий раздел включает как суд, так и избавление, основной текст сохраняет более широкое значение, а более резкое чтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис заголовка и именные формулы сохранены настолько, насколько это допускает естественная русская речь; причастный ряд передаёт единство трёх творческих действий Яхве.
