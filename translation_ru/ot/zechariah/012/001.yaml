  source_fidelity: 'Основной смысл передан точно: מַשָּׂא — пророческое изречение, עַל יִשְׂרָאֵל — «об Израиле» с допустимой альтернативой «против», а три причастия описывают Яхве как Творца. Однако «Возвещение Яхве, простирающего…» в русском тексте синтаксически тяжеловесно и неестественно; формулу נְאֻם יְהוָה безопасно передать обычным пророческим оборотом «так говорит Яхве», сохранив её функцию.'
