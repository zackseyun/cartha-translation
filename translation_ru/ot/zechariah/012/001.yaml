  terminology: «Яхве», «слово», «пророческое изречение», «дух человека» и «основание земли» уместны и не вносят конфессионально обусловленного толкования. Альтернатива «человеческий дух» должна быть обозначена как возможный лексический вариант, а не как буквальный перевод.
