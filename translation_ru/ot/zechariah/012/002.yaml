base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
translation:
  language: ru
  text: Вот, Я сделаю Иерусалим чашей, от которой пошатнутся все окрестные народы[a]. И Иуда также окажется под ударом при осаде Иерусалима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно передать более буквально как «таз (или порог) шатания». Слово סַף может означать сосуд или «порог», однако в данном контексте вероятнее образ чаши, от которой пьянеют и теряют устойчивость.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Возможны также переводы: «Иуда также будет осаждён вместе с Иерусалимом» и «это постигнет и Иуду при осаде Иерусалима».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет торжественную пророческую формулу привлечения внимания и при этом естественно звучит на современном русском языке.
- source_word: אָנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение подчёркивает говорящего; русское «Я» в прямом божественном изречении передаёт это без утяжеляющего «Я Сам».
- source_word: שָׂם
  choice: сделаю
  rationale: Причастие после הִנֵּה имеет живое предстоящее значение. Будущее «сделаю» ясно и естественно передаёт близкое пророческое действие.
- source_word: סַף רַעַל
  choice: чашей, от которой пошатнутся
  rationale: סַף может обозначать порог либо сосуд, а רַעַל — шатание от опьянения. Контекст образа суда лучше поддерживает сосуд; развёрнутая формулировка передаёт причинный эффект образа без неестественного «чаша шатания».
- source_word: לְכָל הָעַמִּים סָבִיב
  choice: все окрестные народы
  rationale: Передаёт совокупность окружающих народов естественным русским выражением; отношение к «чаше» раскрывается оборотом «от которой».
- source_word: וְגַם עַל יְהוּדָה
  choice: И Иуда также окажется под ударом
  rationale: Сохраняет добавочное значение וְגַם и неблагоприятную направленность עַל, не уточняя сверх текста, будет ли Иуда осаждён вместе с городом или иным образом затронут осадой.
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  choice: при осаде Иерусалима
  rationale: Естественно передаёт военную ситуацию и направленность осады против Иерусалима.
theological_decisions:
- issue: Смысл трудной фразы וְגַם עַל־יְהוּדָה יִהְיֶה בַמָּצוֹר עַל־יְרוּשָׁלִָם
  choice: Иуда также окажется под ударом при осаде Иерусалима
  alternative: «Иуда также будет осаждён вместе с Иерусалимом» или «это постигнет и Иуду при осаде Иерусалима»
  rationale: Еврейская конструкция синтаксически сжата и допускает несколько связей слов. Основной текст сохраняет неблагоприятную вовлечённость Иуды, но не решает однозначно, является ли он соучастником нападения, дополнительным объектом осады или затронутым судом.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим тоном. Образ чаши передан понятно, а неоднозначность второй части стиха сохранена и пояснена в сноске.
