source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא אָשִׂים֩ אֶת אַלֻּפֵ֨י יְהוּדָ֜ה כְּֽ/כִיּ֧וֹר אֵ֣שׁ בְּ/עֵצִ֗ים וּ/כְ/לַפִּ֥יד אֵשׁ֙ בְּ/עָמִ֔יר וְ/אָ֨כְל֜וּ עַל יָמִ֧ין וְ/עַל שְׂמֹ֛אול אֶת כָּל הָ/עַמִּ֖ים סָבִ֑יב וְ/יָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּ/ירוּשָׁלִָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
translation:
  language: ru
  text: В тот день Я сделаю роды Иуды[a] словно жаровню с огнём среди дров и словно пылающий факел среди снопов. Они поглотят справа и слева все окрестные народы, а Иерусалим снова будет жить на своём месте[b] — в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводителей Иуды»; или: «вождей Иуды».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «под собой» — еврейское выражение со значением «на своём месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלֻּפֵי יְהוּדָה
  choice: роды Иуды
  rationale: Слово אַלּוּף может обозначать как предводителя рода, так и сам род как общественную и военную единицу. В собирательном образе здесь выбрано «роды», а личное значение сохранено в сноске.
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  choice: словно жаровню с огнём среди дров
  rationale: כִּיּוֹר обозначает сосуд или чашу; сочетание с огнём и дровами указывает на жаровню, от которой загорается окружающее топливо.
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  choice: и словно пылающий факел среди снопов
  rationale: Передаёт образ огненного факела среди собранных стеблей или снопов, сохраняя сельскохозяйственную образность.
- source_word: וְאָכְלוּ
  choice: они поглотят
  rationale: Глагол «есть» употреблён метафорически о сокрушительном уничтожении; «поглотят» естественно продолжает образ огня.
- source_word: עַל יָמִין וְעַל שְׂמֹאול
  choice: справа и слева
  rationale: Сохранены направления исходного текста без обобщающей замены на «со всех сторон».
- source_word: כָּל הָעַמִּים סָבִיב
  choice: все окрестные народы
  rationale: עַמִּים означает народы или группы людей, а סָבִיב указывает на окружающее их положение.
- source_word: וְיָשְׁבָה יְרוּשָׁלַם
  choice: а Иерусалим снова будет жить
  rationale: Сохранено олицетворение города и активное значение глагола ישׁב — «жить, обитать».
- source_word: עוֹד תַּחְתֶּיהָ
  choice: на своём месте
  rationale: Буквальное «под собой» является идиомой пребывания или восстановления на собственном месте.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Итоговое повторение названия города сохранено как риторическое уточнение и усиление.
theological_decisions:
- issue: Коллективное или личное значение אַלֻּפֵי יְהוּדָה
  choice: коллективное «роды Иуды»
  alternative: «предводители Иуды» или «вожди Иуды»
  rationale: Военно-коллективный образ допускает понимание родов Иуды как действующих общественных единиц; поскольку слово также может обозначать их руководителей, эта неоднозначность явно сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образы жаровни, дров, факела и снопов сохранены; повтор «Иерусалим… в Иерусалиме» оставлен ради риторического акцента оригинала.
