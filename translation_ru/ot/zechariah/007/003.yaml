base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
translation:
  language: ru
  text: 'чтобы сказать священникам при доме Яхве Воинств[a] и пророкам: «Плакать ли мне в пятом месяце, воздерживаясь, как я делал уже столько лет?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный перевод: «Господь Саваоф»; буквально титул означает «Яхве Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: чтобы сказать
  rationale: Инфинитив выражает цель посольства и связывает стих с предшествующим контекстом.
- source_word: אֶל הַכֹּהֲנִים אֲשֶׁר לְבֵית יְהוָה צְבָאוֹת
  choice: священникам при доме Яхве Воинств
  rationale: Оборот указывает на принадлежность или служение священников при храме; «при доме» естественно по-русски и не сводит связь к случайному местонахождению.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя יְהוָה и переводит צְבָאוֹת, сохраняя военный и небесно-космический оттенок титула.
- source_word: הַנְּבִיאִים
  choice: пророкам
  rationale: Прямое обозначение признанных пророческих служителей, к которым обращено посольство.
- source_word: הַאֶבְכֶּה
  choice: Плакать ли мне
  rationale: 'Вопросительная форма несовершенного вида первого лица имеет совещательный смысл: спрашивающий выясняет, следует ли продолжать обрядовый плач.'
- source_word: בַּחֹדֶשׁ הַחֲמִשִּׁי
  choice: в пятом месяце
  rationale: Сохранено порядковое обозначение месяца без внесения отсутствующего в еврейском тексте названия.
- source_word: הִנָּזֵר
  choice: воздерживаясь
  rationale: Глагол נזר обозначает отделение себя или ритуальное воздержание и шире одного лишь поста.
- source_word: כַּאֲשֶׁר עָשִׂיתִי זֶה כַּמֶּה שָׁנִים
  choice: как я делал уже столько лет
  rationale: Естественно передаёт продолжительную практику, сохранявшуюся до момента вопроса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и отличает его от титула.
- issue: Смысл הִנָּזֵר в обрядовом вопросе
  choice: воздерживаясь
  alternative: постясь
  rationale: Контекст предполагает пост и траур, однако само слово шире поста; перевод не сужает его семантику и сохраняет возможную обрядовую многозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Начальное «чтобы сказать» намеренно сохраняет синтаксическую зависимость от предыдущего стиха. Формулировка вопроса естественна для русской речи и не устраняет обрядовую широту глагола נזר.
