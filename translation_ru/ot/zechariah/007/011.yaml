  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
translation:
  language: ru
  text: Но они отказались внимать, подставили непокорное плечо[a] и сделали свои уши тяжёлыми[b], чтобы не слышать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали непокорное плечо» — образ упорного сопротивления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделали свои уши нечуткими», «заткнули уши». Буквально еврейский текст говорит: «сделали свои уши тяжёлыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: они отказались
  rationale: Глагол מאן выражает сознательный отказ или нежелание; «отказались» ясно передаёт волевой характер сопротивления.
- source_word: לְהַקְשִׁיב
  choice: внимать
  rationale: В породе Hiphil קשב означает внимательно слушать, принимать к сведению. «Внимать» передаёт не просто слышание звука, а внимание к наставлению и остаётся понятным в современном литературном русском.
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  choice: упрямо повернулись плечом
  rationale: Сочетание буквально говорит о «непокорном/упрямом плече» и образно обозначает упорное сопротивление. Формулировка сохраняет телесный образ, не превращая его в отвлечённое «не повиновались».
- source_word: סֹרָרֶת
  choice: упрямо
  rationale: Причастное прилагательное от סרר передаёт непокорность и мятежное упрямство. Наречная передача по-русски естественно определяет жест, сохраняя нравственный оттенок сознательного сопротивления.
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ
  choice: сделали свои уши тяжёлыми
  rationale: Сохранена еврейская метафора намеренно вызванной невосприимчивости. Некоторая необычность русского оборота соответствует выразительности исходного образа и разъясняется в сноске.
- source_word: מִשְּׁמוֹעַ
  choice: чтобы не слышать
  rationale: 'Предлог מ с инфинитивом здесь выражает предотвращение или цель: они сделали себя невосприимчивыми, чтобы не слышать. Такая передача естественнее буквального «от слышания».'
theological_decisions:
- issue: Телесные образы непокорности и намеренной глухоты
  choice: Сохранить образы плеча и тяжёлых ушей в основном тексте.
  alternative: «Они упорно не желали слушать и закрыли уши».
  rationale: Конкретные образы подчёркивают сознательный и деятельный характер сопротивления пророческому слову. Их устранение ослабило бы риторическую и нравственную напряжённость стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Внимать» уместно в пророческом контексте; необычные телесные метафоры оригинала сохранены и пояснены сносками.
