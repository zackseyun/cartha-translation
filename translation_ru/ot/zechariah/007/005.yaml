  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
translation:
  language: ru
  text: '«Скажи всему народу этой земли и священникам: „Когда вы постились и скорбели в пятом месяце и в седьмом на протяжении этих семидесяти лет, разве для Меня — именно для Меня — вы постились?[a]“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. использует усиленную конструкцию: абсолютный инфинитив перед личной формой глагола («постом постились») и завершает вопрос самостоятельным местоимением «Я»: «Постом ли постились вы для Меня — Я?»'
    reason: 'Передать необычное усиление: сочетание абсолютного инфинитива с личной формой глагола и конечное самостоятельное местоимение אֲנִי.'
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: всему народу этой земли
  rationale: Буквально — «народ земли». В данном контексте выражение широко обозначает жителей страны, а не особое общественное сословие; указательное «этой» естественно передаёт определённость выражения по-русски.
- source_word: הַכֹּהֲנִים
  choice: священникам
  rationale: Обычный и контекстуально точный перевод כֹּהֵן.
- source_word: צַמְתֶּם
  choice: вы постились
  rationale: Прямо передаёт форму Qal perfect 2-го лица множественного числа от צום и обозначает соблюдение поста.
- source_word: וְסָפוֹד
  choice: и скорбели
  rationale: ספד обозначает скорбь и оплакивание, нередко ритуальное. «Скорбели» естественно сочетается с постом и не конкретизирует внешнюю форму плача сверх сказанного.
- source_word: בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  choice: в пятом и седьмом месяцах
  rationale: В еврейском стоят порядковые числительные, а слово «месяц» подразумевается. В русском оно добавлено для ясности календарного смысла.
- source_word: וְזֶה שִׁבְעִים שָׁנָה
  choice: на протяжении этих семидесяти лет
  rationale: Передаёт длительность, продолжающуюся до настоящего момента, и сохраняет указательную силу זֶה.
- source_word: הֲצוֹם צַמְתֻּנִי
  choice: разве для Меня ... вы постились?
  rationale: Сочетание абсолютного инфинитива с личной формой глагола создаёт усиление, а вопросительная частица задаёт риторический вопрос. Русская конструкция с «разве» передаёт его вызывающую, проверяющую направленность.
- source_word: אָֽנִי
  choice: именно для Меня
  rationale: Самостоятельное местоимение в конце еврейской фразы дополнительно выделяет Бога. Повтор с «именно» сохраняет усиление без искусственной буквальности.
- source_word: אֱמֹר ... לֵאמֹר
  choice: 'Скажи ... :'
  rationale: Двойная формула речи естественно передаётся по-русски глаголом введения и двоеточием; буквальное «скажи... говоря» было бы тяжеловесно.
theological_decisions:
- issue: Смысл риторического вопроса о посте
  choice: Вопрос ставит под сомнение искреннюю обращённость поста к Богу, не отрицая самого факта поста.
  alternative: Понимать слова как полное объявление этих постов недействительными.
  rationale: Эмфатическая конструкция спрашивает, действительно ли пост был ради Бога. Перевод сохраняет напряжение риторического вопроса и не вводит более широкого богословского заключения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «именно для Меня» сохраняет еврейское эмфатическое выделение; местоимение о Боге написано с прописной буквы согласно распространённой русской библейской традиции.
