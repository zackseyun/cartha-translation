  yaml_path: translation/ot/zechariah/007/006.yaml
  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
translation:
  language: ru
  text: И когда вы едите и когда пьёте[a], разве не вы сами едите и пьёте?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И если вы едите и если пьёте». Еврейский союз может иметь временное («когда») или условное («если») значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: И когда
  rationale: כִּי допускает временное и условное понимание; временное «когда» естественно продолжает рассуждение о посте в предыдущем стихе.
- source_word: תֹאכְלוּ
  choice: вы едите
  rationale: Qal imperfect 2-го лица множественного числа обозначает обычное, повторяющееся действие; настоящее время естественно передаёт это по-русски.
- source_word: וְכִי תִשְׁתּוּ
  choice: и когда пьёте
  rationale: Повтор союза сохраняет параллелизм еврейской фразы; местоимение ясно из формы глагола и по-русски может не повторяться.
- source_word: הֲלוֹא
  choice: разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; «разве не» естественно и точно передаёт эту силу.
- source_word: אַתֶּם הָאֹכְלִים וְאַתֶּם הַשֹּׁתִים
  choice: для самих себя вы едите и не для самих себя пьёте
  rationale: Буквально конструкция означает «не вы ли едящие и вы пьющие?» Эмфатические местоимения в контексте противопоставлены «Мне» из предыдущего стиха; русский оборот «для самих себя» ясно передаёт контекстуально подразумеваемую направленность действий, сохраняя риторический вопрос и параллелизм.
theological_decisions:
- issue: Самонаправленный характер еды и питья
  choice: «для самих себя»
  alternative: «разве не вы едите и не вы пьёте?»
  rationale: В еврейском тексте дополнение «для себя» не выражено предлогом, однако эмфатическое אַתֶּם отвечает на повторённое в 7:5 «для Меня ли?». Такой перевод раскрывает подразумеваемое противопоставление, не добавляя доктринального вывода.
- issue: Временное или условное значение כִּי
  choice: «когда»
  alternative: «если»
  rationale: Оба значения грамматически возможны. Временное прочтение лучше соответствует упоминанию обычной практики народа и ходу аргумента; альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; риторический тон сохранён через «разве не», а симметрия двух действий — повтором «для самих себя».
