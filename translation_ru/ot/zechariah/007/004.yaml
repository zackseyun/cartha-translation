  yaml_path: translation/ot/zechariah/007/004.yaml
  text: Then the word of Yahweh of hosts came to me[a], saying,
translation:
  language: ru
  text: 'И пришло ко мне слово Яхве Воинств[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя: יהוה (YHWH); здесь оно передано как «Яхве».'
    reason: Уточняет передачу тетраграмматона, не смешивая еврейское написание с русским переводом титула «Воинств».
lexical_decisions:
- source_word: וַיְהִי
  choice: И пришло
  rationale: Последовательная форма глагола היה вводит очередное событие повествования; по-русски сочетание «пришло слово» естественно передаёт начало пророческой формулы.
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле существительное обозначает Божье откровение или сообщение; «слово» сохраняет традиционный образ, не сужая смысла до пересказа «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, представленное тетраграмматоном יהוה, передано транслитерацией, а не заменено титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе божественного наименования это слово охватывает небесные и земные силы; «Воинств» сохраняет широту и торжественность выражения.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог с местоименным суффиксом прямо указывает на получателя пророческого слова.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога. Форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача титула יהוה צבאות
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: «Яхве Воинств» передаёт смысл обоих еврейских слов и остаётся понятным современному читателю; традиционное «Саваоф» транслитерирует второе слово, не раскрывая его значения.
translation_notes:
  register: Современный литературный русский с сохранением краткой, торжественной пророческой формулы. Двоеточие естественно вводит содержание слова в следующем стихе; архаизмы «и было» и «глаголя» не используются.
