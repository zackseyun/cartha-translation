lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: В устойчивой пророческой формуле передаёт наступление события откровения и сохраняет связь с предшествующим повествованием; формулировка естественна для возвышенной современной русской библейской прозы.
- source_word: דְּבַר
  choice: слово
  rationale: В сочетании דְּבַר יְהוָה это обычное обозначение обращённого к пророку Божьего слова; «слово» сохраняет повторяющуюся библейскую формулу лучше, чем пояснительное «весть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом; вариант пояснён в сноске для читателей, знакомых с традиционным переводом.
- source_word: אֶל
  choice: к
  rationale: Естественно обозначает направленность слова к получателю откровения в русском обороте «слово … к Захарии».
- source_word: זְכַרְיָה
  choice: Захарии
  rationale: Использована закрепившаяся в русской библейской традиции форма имени Захария, поставленная в требуемый предлогом дательный падеж.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит последующую прямую речь и функционально передаёт еврейское לֵאמֹר без тяжеловесного русского «говоря».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация сохраняет его как имя, а сноска указывает традиционную замену титулом, не стирая различия между ними.
translation_notes:
