source:
  edition: WLC
  text: וְ/אֵ֣סָעֲרֵ֗/ם עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/הָ/אָ֨רֶץ֙ נָשַׁ֣מָּה אַֽחֲרֵי/הֶ֔ם מֵֽ/עֹבֵ֖ר וּ/מִ/שָּׁ֑ב וַ/יָּשִׂ֥ימוּ אֶֽרֶץ חֶמְדָּ֖ה לְ/שַׁמָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
translation:
  language: ru
  text: '«И Я развеял их вихрем среди всех народов, которых они не знали[a]. После них земля опустела: никто не проходил по ней и не возвращался. Так они превратили желанную землю[b] в пустошь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я унёс их бурей среди всех народов». Еврейский глагол содержит образ бури, а не просто обычного рассеяния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прекрасную землю», «землю, которой восхищались».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  choice: И Я развеял их вихрем
  rationale: Форма от סער в пиэле передаёт не обычное рассеяние, а унесение бурей. «Развеял их вихрем» сохраняет образ стихии и причинный характер действия.
- source_word: עַל כָּל הַגּוֹיִם
  choice: среди всех народов
  rationale: 'При глаголе рассеяния עַל имеет распределительно-пространственный смысл: изгнанники оказались среди множества народов.'
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: которых они не знали
  rationale: Относительное предложение относится к народам и подчёркивает, что это были прежде незнакомые им чужеземные народы.
- source_word: וְהָאָרֶץ נָשַׁמָּה אַחֲרֵיהֶם
  choice: После них земля опустела
  rationale: 'Передан результат их удаления: оставшаяся позади земля стала безлюдной и разорённой.'
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: никто не проходил по ней и не возвращался
  rationale: Парные причастия описывают полное прекращение движения людей в обоих направлениях; добавление «никто» естественно выражает отрицательный смысл конструкции.
- source_word: וַיָּשִׂימוּ
  choice: Так они превратили
  rationale: Последовательная форма глагола вводит итог предшествующих событий и одновременно сохраняет ответственность людей за состояние земли.
- source_word: אֶרֶץ חֶמְדָּה
  choice: желанную землю
  rationale: חֶמְדָּה обозначает нечто желанное, привлекательное и доставляющее радость. «Желанная земля» естественно и кратко сохраняет положительную оценку.
- source_word: לְשַׁמָּה
  choice: в пустошь
  rationale: Существительное называет итоговое состояние запустения. «Пустошь» создаёт выразительный контраст с «желанной землёй».
theological_decisions:
- issue: Ответственность за суд и запустение земли
  choice: Бог прямо назван действующим лицом рассеяния, а люди — теми, кто превратил землю в пустошь.
  alternative: Смягчить божественную инициативу безличным описанием изгнания либо приписать запустение исключительно непосредственному действию Бога.
  rationale: Первое лицо в וְאֵסָעֲרֵם прямо указывает на действие Бога, тогда как множественное וַיָּשִׂימוּ относит ответственность за итоговое запустение к людям. Перевод сохраняет оба аспекта, не устраняя напряжения между Божьим судом и человеческой виной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образ бури сохранён без архаизации; синтаксис упрощён для ясности, а контраст между желанной землёй и пустошью сделан риторически заметным.
