lexical_decisions:
- source_word: אַלְמָנָה
  choice: вдова
  rationale: Прямой и естественный русский эквивалент; слово входит в традиционный перечень социально уязвимых людей.
- source_word: יָתוֹם
  choice: сирота
  rationale: В современном русском «сирота» естественно передаёт социально-правовой статус человека, лишённого родительской защиты; возможный более буквальный оттенок отмечен в сноске.
- source_word: גֵּר
  choice: переселенец
  rationale: Передаёт статус чужеземца, постоянно живущего среди Израиля, не сводя значение ни к временному путнику, ни к современным юридическим категориям миграции.
- source_word: עָנִי
  choice: бедный
  rationale: В перечне уязвимых групп на первом плане социально-экономическая нужда.
- source_word: תַּעֲשֹׁקוּ
  choice: притесняйте
  rationale: Широко охватывает неправомерное угнетение, эксплуатацию и ущемление уязвимых людей.
- source_word: רָעַת
  choice: зла
  rationale: Сохраняет нравственную силу еврейского слова и не сужает его до одного лишь причинения вреда.
- source_word: תַּחְשְׁבוּ
  choice: замышляйте
  rationale: В сочетании со «злом» и «в сердцах» обозначает намеренное обдумывание или планирование, а не просто мысль.
- source_word: אִישׁ אָחִיו
  choice: друг против друга
  rationale: Естественно передаёт взаимно-распределительный смысл выражения в обращении ко всей общине; буквальная форма сохранена в сноске.
- source_word: בִּלְבַבְכֶם
  choice: в своих сердцах
  rationale: Сохраняет множественное число адресатов и библейский образ сердца как средоточия намерений.
theological_decisions:
- issue: Грамматически мужское распределительное выражение אִישׁ אָחִיו
  choice: друг против друга
  alternative: каждый против своего брата; человек против своего брата
  rationale: В контексте заповедь касается взаимоотношений всей общины, тогда как еврейская мужская форма служит распределительным идиоматическим выражением. Основной текст передаёт взаимный смысл, а сноска сохраняет буквальную форму и подлинную языковую особенность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и слегка библейским звучанием. Парная конструкция «ни… ни…» естественно оформляет перечень после отрицательного повеления; «в своих сердцах» сохраняет исходный образ внутреннего умысла.
