id: ZEC.7.1
reference: Zechariah 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/דָרְיָ֖וֶשׁ הַ/מֶּ֑לֶךְ הָיָ֨ה דְבַר יְהוָ֜ה אֶל זְכַרְיָ֗ה בְּ/אַרְבָּעָ֛ה לַ/חֹ֥דֶשׁ הַ/תְּשִׁעִ֖י בְּ/כִסְלֵֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/001.yaml
  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
translation:
  language: ru
  text: В четвёртый год царя Дария, в четвёртый день девятого месяца, то есть в кислеве[a], слово Яхве пришло к Захарии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кислев — название девятого месяца еврейского календаря.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: В четвёртый год…
  rationale: Начальная повествовательная формула вводит датировку. В современном русском её функцию естественно передаёт временное обстоятельство без архаичного «и было».
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: в четвёртый год царя Дария
  rationale: Сохранена обычная формула датировки по году царствования; имя דָרְיָוֶשׁ передано в принятой русской форме «Дарий».
- source_word: הָיָה דְבַר יְהוָה אֶל זְכַרְיָה
  choice: слово Яхве пришло к Захарии
  rationale: Буквально сказано, что слово Яхве «было к» Захарии, однако глагол здесь имеет событийное значение. «Пришло к» естественно передаёт устойчивую пророческую формулу по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: в четвёртый день девятого месяца
  rationale: Слово «день» явно подразумевается еврейской календарной формулой и добавлено для ясности.
- source_word: בְּכִסְלֵו
  choice: в кислеве
  rationale: Название месяца транслитерировано в принятой русской форме; строчная буква соответствует русскому написанию названий месяцев.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сделан естественным, без архаичной формулы «и было», при сохранении точной датировки и традиционной формулы откровения.
