base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Судите по истине и проявляйте друг к другу[a] верную любовь и сострадание».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый — к своему брату». Это еврейский способ выразить взаимное отношение между членами общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка пророческая формула, сохраняющая торжественный характер речи.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Бога и сохраняет вес традиционного титула, не сужая значение צְבָאוֹת до одних земных армий.
- source_word: לֵאמֹר
  choice: двоеточие и кавычки
  rationale: Инфинитив вводит содержание высказывания; в русском языке это естественно выражается пунктуацией без тяжеловесного «говоря».
- source_word: מִשְׁפַּט אֱמֶת שְׁפֹטוּ
  choice: Судите по истине
  rationale: Сохраняет судебное значение שׁפט и характеристику суда как истинного, честного и неподкупного; не превращает выражение в отвлечённый призыв к справедливости.
- source_word: חֶסֶד
  choice: верную любовь
  rationale: Передаёт устойчивую, деятельную и верную любовь; «милость» могла бы чрезмерно сблизить слово с последующим רַחֲמִים.
- source_word: רַחֲמִים
  choice: сострадание
  rationale: Естественно передаёт нежную жалость и милосердие, выраженные еврейским абстрактным множественным числом.
- source_word: עֲשׂוּ
  choice: проявляйте
  rationale: В сочетании с любовью и состраданием это естественный русский эквивалент буквального «делайте».
- source_word: אִישׁ אֶת־אָחִיו
  choice: друг к другу
  rationale: Передаёт распределительное взаимное значение оборота в естественном русском языке; буквальный образ «каждый — своему брату» отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его отличие от титула «Господь».
- issue: Значение חֶסֶד
  choice: верная любовь
  alternative: милость; доброта; заветная верность
  rationale: Выбранное выражение сохраняет одновременно отношение, деятельную доброту и устойчивую верность, не вводя в текст явно отсутствующее слово «завет».
- issue: Взаимное выражение אִישׁ אֶת־אָחִיו
  choice: друг к другу
  alternative: каждый — к своему брату
  rationale: Контекст требует взаимного отношения внутри общины. Основной текст передаёт функцию оборота без ограничения его только мужчинами, а буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Императивы переданы во множественном числе. Кавычки ясно отделяют Божье повеление от вводной формулы.
