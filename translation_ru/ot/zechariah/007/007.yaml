base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
translation:
  language: ru
  text: Разве не эти слова возвещал Яхве через прежних пророков[a], когда Иерусалим был населён и пребывал в спокойствии[b], а его окрестные города, Негев и Шефела[c] были населены?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой прежних пророков»; то есть через пророков, живших прежде.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пребывал в безопасности». Еврейское слово может обозначать спокойствие, защищённость и безмятежное благополучие.'
    reason: lexical_alternative
  - marker: c
    text: Шефела — низменная и предгорная область на западе Иудеи.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלוֹא אֶת הַדְּבָרִים
  choice: Разве не те слова
  rationale: Риторический вопрос предполагает утвердительный ответ; «те слова» естественно указывает на уже известное пророческое возвещение.
- source_word: קָרָא
  choice: провозглашал
  rationale: В контексте Божьей речи через пророков глагол обозначает публичное и властное возвещение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, выраженное тетраграмматоном.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: через прежних пророков
  rationale: Еврейская идиома буквально означает «рукой прежних пророков» и выражает посредничество; «прежних» здесь значит более ранних.
- source_word: יְרוּשָׁלִַם יֹשֶׁבֶת וּשְׁלֵוָה וְעָרֶיהָ סְבִיבֹתֶיהָ
  choice: Иерусалим и окружавшие его города были населены и жили спокойно
  rationale: Формулировка естественно передаёт населённость города и состояние покоя или безопасности, распространяя описание на окружающие города без неясного женского местоимения.
- source_word: וְהַנֶּגֶב
  choice: Негев
  rationale: Здесь это название южной географической области, а не просто сторона света.
- source_word: וְהַשְּׁפֵלָה
  choice: Шефела
  rationale: Сохраняет название западной низменной и предгорной области Иудеи.
- source_word: יֹשֵׁב
  choice: были обитаемы
  rationale: Причастие употреблено собирательно применительно к двум названным областям и указывает на их заселённость.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Посредничество пророков в Божьем возвещении
  choice: через прежних пророков
  alternative: рукой прежних пророков
  rationale: «Через» естественно передаёт еврейскую идиому агентности и не создаёт впечатления буквального действия рукой.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос сохранён; синтаксис слегка перестроен ради ясности. Географические названия переданы как топонимы, а неоднозначность שְׁלֵוָה отмечена в сноске.
