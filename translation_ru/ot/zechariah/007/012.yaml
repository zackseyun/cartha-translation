base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
translation:
  language: ru
  text: Они сделали свои сердца твёрдыми, как кремень[a], чтобы не слушать закон[b] и слова, которые Яхве Воинств[c] послал Своим Духом через прежних пророков. И тогда от Яхве Воинств пришёл великий гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שָׁמִיר обозначает чрезвычайно твёрдое вещество; традиционно — «адамант», возможно также «кремень».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наставление».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционный перевод титула: «Господь Саваоф»; буквально: «Яхве Воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבָּם שָׂמוּ שָׁמִיר
  choice: сделали свои сердца твёрдыми, как алмаз
  rationale: Оборот с שׂוּם описывает сознательное придание сердцу определённого состояния. שָׁמִיר обозначает исключительно твёрдое вещество, точная идентификация которого неясна; сравнение с алмазом естественно передаёт образ крайней ожесточённости, а неопределённость отмечена в сноске.
- source_word: מִשְּׁמוֹעַ
  choice: чтобы не слушать
  rationale: Предлог מִן с инфинитивом выражает уклонение или воспрепятствование. «Слушать» здесь включает не только слышание, но и готовность принять и исполнить сказанное.
- source_word: הַתּוֹרָה
  choice: закон
  rationale: תּוֹרָה означает Божье авторитетное наставление и в данном контексте имеет заветно-правовой оттенок. Возможное более широкое значение «наставление» сохранено в сноске.
- source_word: הַדְּבָרִים
  choice: слова
  rationale: Прямой перевод сохраняет параллель между законом и пророческими словами, не сужая значение до отдельных сообщений.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Имя יְהוָה передано как «Яхве», а צְבָאוֹת — прозрачным современным словом «Воинств», сохраняющим образ небесных и земных сил под Божьей властью.
- source_word: בְּרוּחוֹ
  choice: Своим Духом
  rationale: Фраза обозначает Божий Дух как средство и действующую силу передачи пророческого слова. Прописная буква отражает личную божественную отнесённость, не устраняя лексическую широту רוּחַ.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: через прежних пророков
  rationale: Идиома «рукой» передаёт посредничество, поэтому по-русски естественно «через». הָרִאשֹׁנִים означает пророков прежних времён, а не обязательно техническое название раздела канона.
- source_word: וַיְהִי קֶצֶף גָּדוֹל מֵאֵת
  choice: И тогда … пришёл великий гнев
  rationale: Формулировка сохраняет событийность וַיְהִי и связь гнева с предшествующим непослушанием, не усиливая простую повествовательную связь до формального «поэтому».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Отнесение רוּחוֹ
  choice: Своим Духом
  alternative: своим духом; Своим дыханием
  rationale: В контексте Бог посылает Свои слова посредством Своего Духа через пророков. Такой перевод лучше всего передаёт божественную действенность, хотя само слово רוּחַ лексически допускает значения «дух», «дыхание» и «ветер».
- issue: Значение צְבָאוֹת в божественном титуле
  choice: Воинств
  alternative: Саваоф; Небесных сил
  rationale: «Воинств» переводит образ исходного слова и остаётся достаточно широким, чтобы не ограничивать его только человеческими армиями или только ангельскими силами.
- issue: Характер Божьего гнева
  choice: великий гнев пришёл от Яхве
  alternative: у Яхве был великий гнев
  rationale: Сохранена событийная формулировка еврейского текста и прямая отнесённость гнева к Яхве без смягчения или дополнительного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис близок к еврейской последовательности мысли, при этом идиомы переданы естественно. Метафора ожесточённого сердца сохранена без архаизма «адамант» в основном тексте; традиционные и альтернативные варианты вынесены в сноски.
