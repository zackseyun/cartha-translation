base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
translation:
  language: ru
  text: «И как Он звал, а они не хотели слушать, так и они будут звать, а Я не буду слушать», — сказал Яхве Воинств[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф»; или: «Яхве, Повелитель воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר ... כֵּן
  choice: И как ... так и
  rationale: Передаёт сравнительно-следственную конструкцию естественно для современного русского языка, не утяжеляя её буквальным «и было, когда».
- source_word: קָרָא / יִקְרְאוּ
  choice: звал / будут звать
  rationale: 'Одинаковый русский глагол сохраняет намеренный риторический параллелизм: прежде звал Бог, затем звать будут непослушные.'
- source_word: וְלֹא שָׁמֵעוּ / וְלֹא אֶשְׁמָע
  choice: не слушали / не стану слушать
  rationale: В данном контексте שׁמע обозначает не простое восприятие звука, а внимательный и ответный отклик. Повтор глагола сохраняет взаимную соразмерность суда.
- source_word: אָמַר
  choice: сказал
  rationale: Прошедшее время прямо соответствует форме еврейского глагола и естественно вводит обозначение говорящего после прямой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет краткую форму божественного титула и его связь с многочисленными воинствами; пояснение дано в сноске.
theological_decisions:
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве, Повелитель воинств
  rationale: Основной текст сохраняет личное имя Яхве и компактную структуру еврейского титула. Сноска поясняет смысл слова «воинства», не ограничивая его без достаточного основания только земными или только небесными силами.
- issue: Взаимность непослушания и суда
  choice: не слушали / не стану слушать
  alternative: не слышали / не услышу
  rationale: 'Так передаётся волевой и ответный оттенок שׁמע, при этом сохраняется напряжённая симметрия высказывания: отказ народа внимать Божьему зову соответствует Божьему отказу внимать их будущему зову.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Простой синтаксический параллелизм сохраняет строгость и риторическую симметрию еврейского текста. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
