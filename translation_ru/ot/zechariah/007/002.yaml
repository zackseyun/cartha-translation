base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/002.yaml
  text: Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
translation:
  language: ru
  text: Вефиль[b] послал Сарецера, Регем-Мелеха и его людей, чтобы испросить благоволения у Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы искать благоволения Яхве». Буквально еврейская идиома говорит о том, чтобы «умолять лицо» Яхве.'
    reason: lexical_alternative
  - marker: b
    text: Евр. «Бет-Эль». Здесь это, вероятнее всего, название города Вефиль, хотя само название буквально означает «дом Бога».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Последовательная повествовательная форма передаётся простым прошедшим временем; отдельное вводное слово здесь не требуется.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: В данном контексте сочетание естественнее всего понимать как название города или представляющей его общины, выступающей отправителем.
- source_word: שַׂר אֶצֶר
  choice: Сарецера
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в винительный падеж.
- source_word: וְרֶגֶם מֶלֶךְ
  choice: Регем-Мелеха
  rationale: Сложное личное имя транслитерировано через дефис, а не истолковано как титул или выражение «слово царя».
- source_word: וַאֲנָשָׁיו
  choice: и его людей
  rationale: Местоименный суффикс мужского рода единственного числа наиболее естественно соотнести с ближайшим названным лицом, Регем-Мелехом; русский текст сохраняет эту связь без лишнего уточнения.
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: чтобы испросить благоволения у
  rationale: Еврейская идиома обозначает почтительное обращение с просьбой о благосклонности. Такой перевод передаёт смысл и просительный оттенок, не воспроизводя буквально непривычное русскому читателю выражение о «лице».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Определение субъекта בֵּית אֵל
  choice: Вефиль как город или представляющая его община
  alternative: «дом Бога» как нарицательное выражение
  rationale: Синтаксис и контекст лучше поддерживают топоним. Перевод «дом Бога» внёс бы не требуемый здесь богословский оттенок.
- issue: Просьба о благоволении Яхве
  choice: испросить благоволения
  alternative: умилостивить; искать благоволения
  rationale: Формулировка сохраняет обращённую к Богу просьбу, не утверждая сверх текста, что люди могли механически «умилостивить» Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Испросить благоволения» понятно современному читателю и сохраняет почтительность исходной идиомы; имена даны в привычных русских библейских формах.
