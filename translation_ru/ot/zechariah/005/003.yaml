base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
translation:
  language: ru
  text: 'Он сказал мне: «Это проклятие, которое распространяется по всей земле[a], ибо всякий, кто крадёт, будет удалён согласно написанному на одной стороне свитка[b][c], и всякий, кто клянётся, будет удалён согласно написанному на другой его стороне[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אֶרֶץ может означать «земля, страна» или «земля, мир».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «с этой [стороны], согласно ей … с этой [стороны], согласно ей». Выражение эллиптично и не вполне ясно; вероятно, оно относится к надписям на двух сторонах летящего свитка.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол может означать «быть чистым, невиновным», «быть очищенным» или «быть устранённым». В контексте проклятия вероятен смысл судебного удаления виновного.
    reason: lexical_alternative
  - marker: d
    text: То есть, вероятно, клянётся ложно; это прямо уточняется в ст. 4. В данном стихе слово «ложно» отсутствует.
    reason: contextual_clarification
lexical_decisions:
- source_word: הָאָלָה
  choice: это проклятие
  rationale: В контексте летящего свитка אָלָה обозначает проклятие, связанное с клятвой и несущие судебный приговор.
- source_word: הַיּוֹצֵאת
  choice: которое выходит
  rationale: Причастие передаёт продолжающееся движение проклятия; настоящее время естественно сохраняет образ.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: на лицо всей земли
  rationale: Формулировка сохраняет пространственный образ еврейского выражения, а многозначность אֶרֶץ отмечена в сноске.
- source_word: הַגֹּנֵב
  choice: всякий, кто крадёт
  rationale: Субстантивированное причастие имеет обобщающий смысл и обозначает каждого совершающего кражу.
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: согласно написанному на одной стороне свитка … согласно написанному на другой его стороне
  rationale: Еврейская конструкция эллиптична. Контекст летящего свитка позволяет передать вероятное указание на надписи с двух сторон, не скрывая буквальную неясность в сноске.
- source_word: נִקָּה
  choice: будет удалён
  rationale: В контексте действующего проклятия форма имеет карательно-судебную силу. «Будет удалён» передаёт устранение виновного, не усиливая образ до уничтожения и не придавая ему противоположного смысла оправдания.
- source_word: הַנִּשְׁבָּע
  choice: всякий, кто клянётся
  rationale: В данном стихе причастие само по себе означает дающего клятву; вероятный смысл ложной клятвы следует из контекста и отмечен в сноске, а не внесён безоговорочно в основной текст.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: земля с сохранённой двусмысленностью
  alternative: страна; вся земля как весь мир
  rationale: אֶרֶץ может обозначать как страну/землю Израиля, так и землю в более широком смысле. Русское «земля» сохраняет часть этой многозначности, а сноска делает её явной.
- issue: Смысл נִקָּה в контексте суда
  choice: 'карательное удаление: «будет удалён»'
  alternative: «будет оправдан»; «будет очищен»; «будет отсечён»
  rationale: Проклятие направлено против нарушителей и далее уничтожает их дома, поэтому оправдательный смысл здесь противоречил бы ходу видения. При этом нейтральное «удалён» не уточняет способ наказания сверх текста.
- issue: Характер клятвы в הַנִּשְׁבָּע
  choice: не добавлять «ложно» в основной текст
  alternative: «всякий, кто клянётся ложно»
  rationale: Ложная клятва весьма вероятна по ст. 4 и по параллели с кражей, однако в самой форме הַנִּשְׁבָּע наречие «ложно» отсутствует. Напряжение между буквальной формой и контекстуальным смыслом сохранено с помощью сноски.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранён образ «на лицо всей земли»; эллипсис о сторонах свитка раскрыт умеренно и снабжён сноской. Неоднозначности относительно охвата земли, значения נִקָּה и характера клятвы не устранены молча.
