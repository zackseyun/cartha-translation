  source_fidelity: 'Смысл и последовательность действий переданы в целом верно: женщина, отождествлённая с רִשְׁעָה, брошена в эфу, затем тяжёлый предмет из свинца помещён на её отверстие. Однако «камень из свинца» — неестественная русская конструкция; «свинцовый камень» ближе к форме еврейского сочетания и не уточняет функцию предмета как гири или крышки.'
