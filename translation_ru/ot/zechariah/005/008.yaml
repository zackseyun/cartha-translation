base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
translation:
  language: ru
  text: 'Он сказал: «Это — Зло». Затем он бросил её внутрь ефы[a] и бросил свинцовый камень[b] на её отверстие[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ефа — мера сыпучих тел и сосуд соответствующей вместимости; здесь имеется в виду показанный в видении сосуд, подобный корзине.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «камень свинца»; возможно также: «свинцовая гиря».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к её рту»; то есть к отверстию ефы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִשְׁעָה
  choice: Нечестие
  rationale: Абстрактное существительное женского рода с определённым артиклем здесь служит олицетворённым наименованием женщины. Прописная буква передаёт олицетворение, не превращая слово в характеристику «нечестивая женщина».
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  choice: бросил её
  rationale: Глагол שׁלך обычно означает «бросать, швырять»; местоимение женского рода указывает на женщину, отождествлённую с Нечестием.
- source_word: אֶל תּוֹךְ הָאֵיפָה
  choice: внутрь ефы
  rationale: תּוֹךְ обозначает внутреннюю часть, а אֵיפָה — меру сухих тел и соответствующий сосуд. Традиционный термин «ефа» сохраняется и поясняется в сноске.
- source_word: אֶבֶן הָעֹפֶרֶת
  choice: камень из свинца
  rationale: Формально выражение означает «камень свинца». Перевод сохраняет конкретный образ тяжёлого куска свинца и не вводит более толковательное «гиря» или «крышка».
- source_word: אֶל פִּיהָ
  choice: на её устье
  rationale: פֶּה буквально значит «рот, уста», а применительно к сосуду — его устье или отверстие. «Устье» сохраняет образ исходного текста и естественно обозначает верхнее отверстие сосуда.
theological_decisions:
- issue: Олицетворение зла в видении
  choice: Передать абстрактное существительное как олицетворённое имя «Нечестие», сохранив местоимение женского рода.
  alternative: «Это нечестие» либо толковательное «Это нечестивая женщина».
  rationale: Древнееврейский текст прямо отождествляет женщину с абстрактным понятием רִשְׁעָה. Перевод должен показать олицетворение, но не превращать это отождествление в отсутствующее в тексте нравственное описание женщины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной образностью пророческого видения. Повтор глагола «бросил» сохранён вслед за древнееврейским текстом. Термин «ефа» оставлен ради предметной и культурной точности и пояснён в сноске.
