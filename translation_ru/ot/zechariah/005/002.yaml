  text: וַ/יֹּ֣אמֶר אֵלַ֔/י מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר אֲנִ֤י רֹאֶה֙ מְגִלָּ֣ה עָפָ֔ה אָרְכָּ/הּ֙ עֶשְׂרִ֣ים בָּֽ/אַמָּ֔ה וְ/רָחְבָּ֖/הּ עֶ֥שֶׂר בָּ/אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
translation:
  language: ru
  text: 'И он сказал мне: «Что ты видишь?» Я ответил: «Я вижу летящий свиток. Длина его — двадцать локтей[a], а ширина — десять локтей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, примерно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И он сказал мне
  rationale: Последовательная форма с וַ передаёт развитие повествования; союз «и» сохраняет связь с предшествующим видением без добавления временного оттенка.
- source_word: מָה אַתָּה רֹאֶה
  choice: Что ты видишь?
  rationale: Причастие רֹאֶה обозначает непосредственное восприятие в настоящем; это естественная русская формулировка вопроса.
- source_word: וָאֹמַר אֲנִי רֹאֶה
  choice: 'Я ответил: «Я вижу'
  rationale: Глагол אָמַר буквально значит «сказал», но в паре вопрос—ответ русское «ответил» естественно передаёт речевую функцию; אֲנִי передано явным «я», а причастие — настоящим временем.
- source_word: מְגִלָּה עָפָה
  choice: летящий свиток
  rationale: מְגִלָּה обозначает свиток, а причастие עָפָה — находящийся в полёте; образ сохранён без поясняющего расширения.
- source_word: אָרְכָּהּ עֶשְׂרִים בָּאַמָּה
  choice: Длина его — двадцать локтей
  rationale: Сохранены исходная мера длины и точное числовое значение; именная конструкция с тире естественна для описания размеров по-русски.
- source_word: וְרָחְבָּהּ עֶשֶׂר בָּאַמָּה
  choice: а ширина — десять локтей
  rationale: «А» естественно оформляет сопоставление двух измерений; единица сохранена из исходного культурного контекста.
