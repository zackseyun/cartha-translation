lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапное появление нового элемента видения и сохраняет живость пророческого повествования.
- source_word: כִּכַּר עֹפֶרֶת
  choice: свинцовая глыба
  rationale: כִּכָּר может обозначать тяжёлую округлую массу или установленную меру веса. «Глыба» сохраняет предметность и тяжесть свинца, не превращая предполагаемую функцию крышки в прямое значение слова.
- source_word: נִשֵּׂאת
  choice: была поднята
  rationale: Сохраняет пассивную форму и не называет действующего лица, которого нет в еврейском тексте.
- source_word: וְזֹאת
  choice: а там
  rationale: Естественно по-русски указывает на то, что открылось взору после поднятия свинцовой массы, не добавляя объяснения образа.
- source_word: אִשָּׁה אַחַת
  choice: одна женщина
  rationale: Передаёт выраженное в оригинале числительное אַחַת, не истолковывая его как неопределённое «некая».
- source_word: יוֹשֶׁבֶת
  choice: сидящая
  rationale: Прямо передаёт позу женщины и длительный характер причастной формы.
- source_word: בְּתוֹךְ הָאֵיפָה
  choice: внутри эфы
  rationale: Сохраняет культурно-конкретный термин אֵיפָה и естественно передаёт пространственное значение בְּתוֹךְ.
