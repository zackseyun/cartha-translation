revisions:
- from: 'И он сказал мне: «Чтобы построить для неё дом в земле Сеннаар[b]. Когда он будет готов, её поставят там на её основание[a]».'
  to: 'И он сказал мне: «Чтобы построить для неё дом в земле Сеннаар[b]. Когда дом будет готов, она будет поставлена там на своё основание[a]».'
  rationale: Исправлен залог заключительного глагола в соответствии с еврейской страдательной формой; уточнён явный антецедент «дом» для формы «будет готов»; местоимение при «основании» заменено на возвратительное, более естественное в русском при сохранении значения суффикса. Примечание переработано так, чтобы сохранять действительную неоднозначность референта, но не искажать женский род еврейских форм.
