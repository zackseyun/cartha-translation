base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
translation:
  language: ru
  text: 'И он сказал мне: «Чтобы построить для неё дом в земле Сеннаар[b]. Когда дом будет готов, она будет поставлена там на своё основание[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она будет поставлена там на своё основание (подставку)»; формы женского рода в еврейском тексте могут относиться к женщине, названной Нечестием, либо более отвлечённо — к эфе или её содержимому.'
    reason: alternative_reading
  - marker: b
    text: Сеннаар — древнее название земли, связываемой в Ветхом Завете с Вавилонией.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: И он сказал мне
  rationale: Сохраняет обычное повествовательное продолжение, выраженное wayyiqtol, и явно передаёт אֵלַי — «мне».
- source_word: לִבְנוֹת לָהּ בַּיִת
  choice: Чтобы построить для неё дом
  rationale: Инфинитив с ל передаёт цель; «для неё» сохраняет отсылку к олицетворённому Нечестию — женщине в эфе.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: в земле Сеннаар
  rationale: Сеннаар оставлен как историческое географическое название, а не заменён толкованием «Вавилония».
- source_word: וְהוּכַן
  choice: Когда он будет готов
  rationale: Форма от כון допускает значения приготовления и утверждения; мужской род естественно относит её к дому. Временная связь ясно передаёт последовательность действий.
- source_word: וְהֻנִּיחָה
  choice: её поставят там
  rationale: Передаёт помещение женского персонажа на предназначенное место, сохраняя образ женщины; неопределённо-личная конструкция не вводит названного в тексте деятеля.
- source_word: עַל מְכֻנָתָהּ
  choice: на её основание
  rationale: מְכוּנָה обозначает основание, подставку или установленное место. «Основание» прямо и без излишней культовой конкретизации передаёт образ, а женское местоимение сохраняет грамматическую связь.
theological_decisions:
- issue: К чему относятся формы женского рода в заключительной части стиха
  choice: 'Они отнесены к женщине — олицетворённому Нечестию из Зах 5:8: «её… на её основание».'
  alternative: 'Их можно понимать более отвлечённо как указание на эфу или её содержимое: «это поставят там на его основание».'
  rationale: Ближайший контекст представляет Нечестие в образе женщины, поэтому личная отсылка литературно естественна; при этом подлинная неоднозначность еврейского текста сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому, но последовательность предложений оформлена естественно для русского читателя; неоднозначность заключительных форм не устранена, а вынесена в примечание.
