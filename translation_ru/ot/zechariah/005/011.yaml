  verdict: revise
  source_fidelity: 'В целом перевод верно передаёт смысл стиха: цель строительства дома в земле Сеннаар, последующее приготовление дома и помещение женского образа на предназначенное основание. Однако еврейское וְהֻנִּיחָה — страдательная форма, поэтому «её поставят» менее точно передаёт залог; предпочтительно «она будет поставлена». Явное «дом» в следующей фразе естественно проясняет мужскую форму וְהוּכַן, относящуюся к дому.'
  naturalness: «На её основание» возможно, но с личным местоимением звучит тяжеловесно. Конструкция «она будет поставлена там на своё основание» литературна и естественно выражает установление фигуры на принадлежащем ей основании. «Когда дом будет готов» устраняет неудачную русскую двусмысленность местоимения «он», не добавляя нового смысла.
  terminology: '«Сеннаар» является приемлемой русской передачей שִׁנְעָר. «Основание» точно передаёт מְכֻנָה, не навязывая более узкое значение «пьедестал». «Нечестие» уместно как обозначение персонифицированного образа из предыдущего стиха. Альтернативное примечание следует исправить: «это ... на его основание» не согласуется с тем, что в еврейском обе заключительные формы женского рода, и по-русски создаёт ненужную смену рода.'
