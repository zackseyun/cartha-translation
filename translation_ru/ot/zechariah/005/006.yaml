base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
translation:
  language: ru
  text: 'Я спросил: «Что это?» Он сказал: «Это мерная корзина[a], которая выходит». И сказал: «Таков их облик[b] по всей земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эфа». Эфа — древняя мера объёма сыпучих тел; тем же словом мог называться мерный сосуд такой вместимости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «это их глаз по всей земле». Это выражение часто понимают как «их облик» или «то, что видно от них»; по иному чтению или толкованию: «их беззаконие по всей земле».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: корзина-мера
  rationale: Слово обозначает меру сыпучих тел «эфа» и метонимически — сосуд такой вместимости. «Корзина-мера» передаёт видимый в видении предмет и его назначение; точный древний термин сохранён в сноске.
- source_word: הַיּוֹצֵאת
  choice: которая выходит
  rationale: Причастие от יצא с артиклем определяет корзину как находящуюся в движении. Настоящее время сохраняет динамику видения, не уточняя направление сверх сказанного в еврейском тексте.
- source_word: עֵינָם
  choice: их облик
  rationale: Масоретский текст буквально означает «их глаз», но עין может переносно относиться к видимому облику. «Их облик» даёт связный русский смысл без принятия альтернативного чтения «их беззаконие».
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: הָאָרֶץ допускает значения «земля» и «страна». Русское «по всей земле» сохраняет пространственный охват и не вынуждает однозначно выбирать между местным и всемирным масштабом.
- source_word: מַה הִיא
  choice: Что это?
  rationale: 'Местоимение женского рода согласовано с последующим אֵיפָה, но по-русски о ещё не названном предмете естественно спросить: «Что это?»'
theological_decisions:
- issue: Толкование עֵינָם в заключительной части стиха
  choice: 'В основном тексте: «их облик»'
  alternative: 'Буквально: «их глаз»; по иному чтению или толкованию: «их беззаконие»'
  rationale: Выбор опирается на масоретское עֵינָם и возможное переносное значение «видимый облик», не внося в основной текст конъектуру. Известное чтение «беззаконие» отмечено в сноске, чтобы сохранить текстовую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным повествовательным строем. Повтор וַיֹּאמֶר передан сначала как «ответил», затем как «добавил», чтобы естественно обозначить реплики одного говорящего без изменения их содержания. Неясный антецедент местоимения «их» сохранён.
