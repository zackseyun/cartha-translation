  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
translation:
  language: ru
  text: 'Затем я поднял глаза и увидел: вот, выходят две женщины, и в их крыльях был ветер. Крылья у них были как у аиста, и они подняли эфу[a] между землёй и небом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфа — древняя мера сыпучих тел; здесь имеется в виду сосуд для отмеривания, показанный в видении.
    reason: Пояснение исторической меры и конкретного предмета в образе видения.
  - marker: b
    text: 'Буквально: «между землёй и небесами».'
    reason: Отражает грамматическую форму еврейского слова, которое в данном выражении по-русски естественно передаётся единственным числом.
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Затем я поднял глаза
  rationale: Сохраняет образное еврейское выражение рассказа о видении; «затем» передаёт последовательность повествования.
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 'и увидел: вот'
  rationale: Двоеточие естественно вводит содержание увиденного, а «вот» сохраняет наглядную, указательную силу הִנֵּה.
- source_word: שְׁתַּיִם נָשִׁים יֹצְאוֹת
  choice: выходят две женщины
  rationale: Настоящее время передаёт продолжающееся действие причастия и непосредственность видения; женский пол прямо выражен в исходном тексте.
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  choice: и ветер наполняет их крылья
  rationale: רוּחַ допускает значения «ветер» и «дух», но образ полёта и крыльев здесь прежде всего указывает на ветер. Глагольная формулировка естественно передаёт еврейскую конструкцию «ветер в их крыльях».
- source_word: וְלָהֵנָּה כְנָפַיִם כְּכַנְפֵי הַחֲסִידָה
  choice: Крылья у них были как у аиста
  rationale: Естественно передаёт конструкцию обладания и сохраняет прямое сравнение с крыльями аиста.
- source_word: וַתִּשֶּׂאנָה אֶת־הָאֵיפָה
  choice: и они подняли эфу
  rationale: נשׂא в сцене воздушного переноса означает «поднять/нести». Термин «эфа» сохраняет ключевой образ видения и его связь с предшествующими стихами; пояснение дано в сноске.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמָיִם
  choice: между землёй и небом
  rationale: В русском языке космическое противопоставление естественно выражается устойчивой парой «земля и небо»; множественная форма שָׁמַיִם отмечена в сноске.
theological_decisions:
- issue: Значение רוּחַ в сцене переноса
  choice: ветер
  alternative: дух
  rationale: Непосредственный контекст говорит о крыльях, сравнении с аистом и полёте, поэтому конкретное значение «ветер» предпочтительнее и не привносит богословского толкования, которого текст не требует.
- issue: Передача אֵיפָה в пророческом видении
  choice: эфа
  alternative: корзина для отмеривания; мера
  rationale: Исходное слово обозначает меру сыпучих тел и в видении — соответствующий сосуд. Транслитерация сохраняет повторяющийся образ и его намеренную необычность, а сноска делает его понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией рассказа о видении. Сохранено указательное «вот», но синтаксис сделан ясным и естественным. Архаизмов и конфессионально окрашенных толкований нет.
