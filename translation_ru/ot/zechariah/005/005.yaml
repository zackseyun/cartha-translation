base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
translation:
  language: ru
  text: 'Тогда ангел, говоривший со мной[b], вышел[a] и сказал мне: «Подними, пожалуйста, глаза и посмотри, что это такое, что выходит[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «появился»; еврейский глагол יָצָא обычно означает «выйти» и сам по себе не определяет, воспринимается ли движение как направленное от наблюдателя или к нему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «говоривший во мне»; здесь это еврейский оборот со значением «говоривший со мной».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «что это такое, что уходит?» Еврейская форма обозначает движение наружу, а его направление относительно наблюдателя определяется контекстом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычное значение יָצָא — движение наружу; «вышел» прямо передаёт еврейский глагол, не уточняя пространственную перспективу сверх текста.
- source_word: הַמַּלְאָךְ
  choice: ангел
  rationale: מַלְאָךְ может означать «посланник», но в контексте видения Захарии речь идёт об ангеле, который беседует с пророком и истолковывает видение.
- source_word: הַדֹּבֵר בִּי
  choice: говоривший со мной
  rationale: Буквально предлог означает «во мне», однако в повторяющейся формуле книги это идиоматическое обозначение беседы ангела с пророком. Причастие передано формой, указывающей на продолжающееся общение.
- source_word: וַיֹּאמֶר אֵלַי
  choice: и сказал мне
  rationale: Естественная русская передача стандартной повествовательной конструкции.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: подними, пожалуйста, глаза
  rationale: Сохранён образ еврейского выражения «поднять глаза», а נָא передано вежливым «пожалуйста».
- source_word: וּרְאֵה
  choice: и посмотри
  rationale: В данном повелении רָאָה призывает направить внимание на новый предмет видения; «посмотри» естественнее по-русски, чем буквальное «увидь».
- source_word: מָה הַיּוֹצֵאת הַזֹּאת
  choice: что это выходит
  rationale: Переданы вопросительное מָה, указательное הַזֹּאת и продолжающееся действие причастия הַיּוֹצֵאת. Формулировка сохраняет неопределённость ещё не названного предмета.
