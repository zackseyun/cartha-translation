lexical_decisions:
- source_word: וָאָשׁוּב
  choice: И снова
  rationale: Глагол שוב в повествовательной последовательности может означать возвращение или повторное действие. В переходе к следующему видению «И снова» естественно передаёт возобновление зрительного восприятия, не вынуждая понимать выражение как физический поворот.
- source_word: וָאֶשָּׂא עֵינַי
  choice: я поднял глаза
  rationale: Устойчивое еврейское выражение буквально передаёт поднятие глаз; такая формулировка ясна и естественна в современном русском языке.
- source_word: וָאֶרְאֶה
  choice: увидел
  rationale: Глагол ראה прямо обозначает зрительное, здесь визионерское, восприятие пророка.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица הִנֵּה живо вводит внезапно представший взору предмет; русское «вот» сохраняет её указательную и привлекающую внимание силу.
- source_word: מְגִלָּה
  choice: свиток
  rationale: Слово обозначает свёрнутый письменный документ; «свиток» — общепонятный и точный современный эквивалент.
- source_word: עָפָה
  choice: летит
  rationale: Причастие женского рода согласовано со словом «свиток» и изображает его находящимся в полёте. Личная глагольная форма по-русски передаёт эту динамичную картину естественнее, чем тяжеловесное «летящий свиток».
theological_decisions:
- issue: Значение וָאָשׁוּב при переходе к новому видению
  choice: И снова
  alternative: И я повернулся
  rationale: Контекст допускает как физический или мысленный поворот, так и возобновление действия. Формулировка «И снова» следует обычной функции שוב в последовательности видений, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением лаконичности и зрительной выразительности еврейского повествования. «Вот» передаёт הִנֵּה без архаичного «вот, behold»-подобного оттенка; порядок фразы остаётся естественным для русского языка.
