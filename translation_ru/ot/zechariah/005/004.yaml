base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
translation:
  language: ru
  text: «Я послал это[a], — возвещает Яхве Воинств, — и оно войдёт в дом вора и в дом того, кто ложно клянётся Моим именем. Оно останется внутри его дома[b] и уничтожит его — его деревянные части и его камни».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я вывел это». Еврейский глагол буквально допускает такое значение, но здесь речь идёт о том, что Яхве посылает проклятие совершить суд.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «поселится» или «будет ночевать». Еврейский глагол подчёркивает, что оно не просто войдёт в дом, но останется там.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  choice: Я послал это
  rationale: Порода хифиль глагола יצא с местоименным суффиксом 3-го лица женского рода указывает на ранее названное проклятие либо на свиток. В русском неодушевлённый референт естественно передан словом «это»; «послал» ясно выражает действие Яхве и назначение проклятия.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: נְאֻם — торжественная пророческая формула. «Возвещает» сохраняет её достоинство, а «Яхве Воинств» передаёт личное имя יהוה и традиционный широкий смысл צבאות, не сужая его до одного вида войска.
- source_word: וּבָאָה
  choice: и оно войдёт
  rationale: При אֶל и существительном «дом» глагол בוא обозначает движение внутрь; «войдёт» естественно и точно передаёт контекст.
- source_word: בֵּית הַגַּנָּב
  choice: дом вора
  rationale: גַּנָּב прямо обозначает вора; родительный оборот сохраняет простую структуру оригинала.
- source_word: הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  choice: того, кто ложно клянётся Моим именем
  rationale: Причастная конструкция описывает человека, который обманно призывает Божье имя в клятве. Формулировка естественна по-русски и сохраняет серьёзность ложной клятвы.
- source_word: וְלָנֶה
  choice: оно останется
  rationale: לון буквально может означать «ночевать, поселиться», однако здесь подчёркнуто продолжительное пребывание проклятия в доме до его уничтожения. «Останется» естественно передаёт эту длительность.
- source_word: בְּתוֹךְ בֵּיתוֹ
  choice: внутри его дома
  rationale: בְּתוֹךְ обозначает внутреннее пространство; перевод сохраняет эту конкретную пространственную деталь.
- source_word: וְכִלַּתּוּ
  choice: и уничтожит его
  rationale: Пиэль глагола כלה выражает доведение до конца, полное истребление. «Уничтожит» ясно передаёт полное разрушение дома; местоимение относится к дому.
- source_word: עֵצָיו
  choice: брёвна его
  rationale: В контексте строения עֵצִים обозначает деревянные конструктивные части. «Брёвна» создаёт конкретный образ, не ограничивая смысл только балками.
- source_word: אֲבָנָיו
  choice: камни его
  rationale: Прямой перевод сохраняет конкретный образ полного разрушения каменного и деревянного состава дома.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон יהוה. «Яхве» передаёт личное заветное имя Бога, не заменяя его титулом.
- issue: Референт местоимений женского рода в הוֹצֵאתִיהָ и וּבָאָה
  choice: нейтральное «это / оно», допускающее соотнесение с проклятием или свитком
  alternative: «её / она» с однозначным отнесением к проклятию
  rationale: Ближайший контекст называет «проклятие» (женский род в еврейском), а видение прежде описывает летящий свиток, также мужского рода в еврейском. Русская нейтральная конструкция не навязывает более узкого толкования, чем допускает контекст.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены конкретные образы дома, деревянных частей и камней. Заглавная буква в «Моим» маркирует речь Бога по принятой русской религиозно-литературной норме.
