lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я спросил
  rationale: Форма wayyiqtol продвигает повествование. Буквально «тогда я сказал», но перед прямым вопросом русское «спросил» естественно передаёт речевое действие без изменения смысла.
- source_word: הַמַּלְאָךְ
  choice: ангела
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; в контексте видения Захарии это сверхъестественный истолковывающий посланник, поэтому «ангел» наиболее ясно.
- source_word: הַדֹּבֵר בִּי
  choice: говорившего со мной
  rationale: Причастная конструкция в повторяющейся формуле Захарии означает того, кто говорит с пророком. «Со мной» передаёт идиоматическое значение בִּי, не буквальное «во мне».
- source_word: אָנָה
  choice: куда
  rationale: Наречие обозначает направление и спрашивает о месте назначения; современное русское соответствие — «куда».
- source_word: הֵמָּה מוֹלִכוֹת
  choice: они несут
  rationale: Женский род множественного числа отсылает к двум женщинам из предыдущего стиха. Каузативная форма הלך здесь означает перемещение предмета; «несут» естественно в данном зримом контексте, не уточняя способ сверх сказанного.
- source_word: אֶת הָאֵיפָה
  choice: ефу
  rationale: אֵיפָה — ефа, мера сыпучих тел, а в видении также сосуд соответствующего назначения. Сохранение термина поддерживает связь с предыдущими стихами; пояснение дано в сноске.
