  text: וְ/אָמַ֕ר לֹ֥א נָבִ֖יא אָנֹ֑כִי אִישׁ עֹבֵ֤ד אֲדָמָה֙ אָנֹ֔כִי כִּ֥י אָדָ֖ם הִקְנַ֥/נִי מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
translation:
  language: ru
  text: 'И он скажет: «Я не пророк; я человек, возделывающий землю, ибо человек приобрёл меня ещё в юности[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «купил меня»; возможно также: «владел мной с юности». Еврейский глагол может означать приобретение, покупку или обладание.'
    reason: Сохраняется реальная неоднозначность значения הִקְנַנִי и временной связи с «юностью».
lexical_decisions:
- source_word: וְאָמַר
  choice: И он скажет
  rationale: В пророческом контексте waw с перфектом продолжает описание будущих событий «в тот день», поэтому выбрано будущее время.
- source_word: נָבִיא
  choice: пророк
  rationale: Прямой и общепринятый русский эквивалент; говорящий отрицает принадлежность к пророкам.
- source_word: אִישׁ עֹבֵד אֲדָמָה
  choice: человек, возделывающий землю
  rationale: Передаёт и существительное אִישׁ, и причастную форму עֹבֵד, и сельскохозяйственный смысл אֲדָמָה, не сводя выражение к более узкому названию профессии.
- source_word: כִּי
  choice: потому что
  rationale: Передаёт пояснительно-причинную связь заключительной части высказывания с предшествующим утверждением.
- source_word: אָדָם
  choice: один человек
  rationale: Сохраняет неопределённое существительное мужского рода в единственном числе и позволяет избежать ошибочного отождествления אָדָם с אֲדָמָה («земля»).
- source_word: הִקְנַנִי
  choice: приобрёл меня
  rationale: Глагол קנה в данной форме допускает значения приобретения, покупки и обладания. Широкое «приобрёл» сохраняет лексическую неоднозначность, не уточняя без достаточных оснований общественное положение говорящего.
- source_word: מִנְּעוּרָי
  choice: ещё с юности
  rationale: Естественно передаёт исходную временную точку, выраженную предлогом מִן, и значение «моя юность».
theological_decisions:
- issue: Правдивость слов говорящего о своём занятии
  choice: Передать его отрицание пророческого статуса и заявление о земледельческом занятии без оценки их искренности.
  alternative: Явно представить говорящего либо лжепророком, скрывающим прошлое, либо бывшим пророком, искренне отрёкшимся от прежних притязаний.
  rationale: Контекст допускает оба прочтения, но сам стих не решает, говорит ли этот человек искренне или пытается избежать ответственности.
- issue: Характер приобретения, выраженного הִקְנַנִי
  choice: Сохранить общее значение «приобрёл меня» и пояснить варианты в сноске.
  alternative: 'Уточнить: «купил меня», «взял меня к себе» или «сделал меня рабом».'
  rationale: Еврейский глагол допускает несколько связанных значений, а стих не определяет точный характер отношений между говорящим и упомянутым человеком.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Оборот «человек, возделывающий землю» близок к структуре еврейского текста, но остаётся понятным современному читателю. Необычность заключительной фразы сохранена как особенность и неоднозначность оригинала, а не устранена догадочной переформулировкой.
