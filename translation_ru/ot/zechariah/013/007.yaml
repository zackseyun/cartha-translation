source:
  edition: WLC
  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
translation:
  language: ru
  text: '«Пробудись, меч,

    против Моего пастыря,

    против человека, близкого Мне, —

    возвещает Господь Воинств.


    Порази пастыря —

    и овцы рассеются;

    Я обращу Свою руку против малых».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  choice: Пробудись, меч
  rationale: Сохранены прямое обращение к мечу и яркое пророческое олицетворение. Современное «пробудись» передаёт повеление без архаичного оттенка.
- source_word: רֹעִי
  choice: Моего пастыря
  rationale: Прямо передаёт существительное с суффиксом первого лица и сохраняет выраженную в еврейском тексте принадлежность.
- source_word: גֶּבֶר עֲמִיתִי
  choice: человека, близкого Мне
  rationale: גֶּבֶר здесь естественно означает «человек», а עֲמִית обозначает человека, состоящего в близкой связи или сопричастности с другим. Формулировка не усиливает значение до однозначного «равного».
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Господь Воинств
  rationale: נְאֻם передано формулой пророческого провозглашения. «Господь Воинств» ясно передаёт значение צְבָאוֹת и сохраняет возвышенный регистр.
- source_word: הַךְ
  choice: Порази
  rationale: Повелительная форма передана сильным, но естественным для современного литературного русского языка глаголом; приказ по контексту обращён к мечу.
- source_word: וּתְפוּצֶיןָ הַצֹּאן
  choice: и овцы рассеются
  rationale: Сохранены образ овец и результат поражения пастыря. Русская возвратная форма естественно передаёт пассивно-результативный смысл.
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  choice: Я обращу Свою руку против
  rationale: В контексте поражения и рассеяния оборот вероятнее всего означает направленное против кого-либо действие. Неоднозначность предлога и идиомы отмечена в сноске.
- source_word: הַצֹּעֲרִים
  choice: малых
  rationale: Субстантивированное «малые» сохраняет возможную отсылку как к младшим или юным, так и к слабым либо незначительным, не сужая смысл до одной группы.
theological_decisions:
- issue: Значение עֲמִיתִי и отношение этого лица к пастырю
  choice: человека, близкого Мне
  alternative: Моего товарища / соратника; возможно, равного Мне
  rationale: Перевод выражает особую близость, но не вносит в основной текст более сильное метафизическое утверждение, чем однозначно позволяет лексема. Возможные усиленные варианты сохранены в сноске.
- issue: Направленность выражения וַהֲשִׁבֹתִי יָדִי עַל
  choice: Я обращу Свою руку против малых
  alternative: Я обращу Свою руку к малым / на малых
  rationale: Ближайший контекст суда поддерживает неблагоприятный смысл, однако сама идиома допускает более общее действие по отношению к ним. Эта напряжённость не устранена и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Поэтическое членение сохраняет параллелизм и последовательность повелений. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому стилю; архаизмы вроде «секи» и непрозрачное без пояснения «Саваоф» не использованы в основном тексте.
