  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
translation:
  language: ru
  text: 'И будет в тот день: каждый из пророков устыдится своего видения, когда будет пророчествовать, и не станет надевать волосяной плащ[a], чтобы обманывать[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «накидку из волоса» — грубую верхнюю одежду, связанную с обликом пророка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы лгать». Еврейский глагол может означать ложь или обман; здесь речь, вероятно, идёт о том, чтобы вводить других в заблуждение пророческим обликом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет обычную пророческую формулу введения будущего события без архаичного «и будет, и произойдёт».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивой пророческой временной формулы.
- source_word: יֵבֹשׁוּ
  choice: устыдятся
  rationale: Передаёт значение стыда и посрамления, не уточняя сверх текста, внутреннее это чувство или следствие разоблачения.
- source_word: הַנְּבִיאִים
  choice: пророки
  rationale: Еврейский текст прямо говорит «пророки»; определение «лжепророки» не добавляется, хотя контекст указывает на ложное пророчество.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Передаёт дистрибутивное значение: речь идёт о каждом пророке в отдельности.'
- source_word: מֵחֶזְיֹנוֹ
  choice: своего видения
  rationale: Предлог при глаголе стыда обозначает предмет или причину стыда; русское управление «стыдиться чего» выражает это естественно.
- source_word: בְּהִנָּבְאֹתוֹ
  choice: когда станет пророчествовать
  rationale: Передаёт временное значение инфинитивной конструкции и соотносит единственное число с дистрибутивным «каждый».
- source_word: וְלֹא יִלְבְּשׁוּ
  choice: и не будут надевать
  rationale: Сохраняет значение намеренного облачения в одежду, служащую внешним признаком пророка.
- source_word: אַדֶּרֶת שֵׂעָר
  choice: волосяной плащ
  rationale: Конкретно и понятно передаёт грубое верхнее одеяние из волоса, связанное с обликом пророка, не подменяя его более узким понятием «власяница».
- source_word: לְמַעַן כַּחֵשׁ
  choice: чтобы обманывать
  rationale: В контексте притворного пророческого облика глагол указывает на ложь, направленную на введение других в заблуждение.
theological_decisions:
- issue: Следует ли прямо назвать пророков лжепророками
  choice: Сохранить «пророки» без добавления «лже-»
  alternative: лжепророки
  rationale: Контекст осуждает ложное пророчество, однако в самом стихе употреблено обычное слово «пророки». Перевод сохраняет формулировку источника и не снимает заложенное в контексте напряжение.
- issue: Считать ли плащ однозначно знаком пророческого служения
  choice: Оставить образ волосяного плаща без пояснения в основном тексте
  alternative: пророческий плащ
  rationale: Связь такой одежды с пророческим обликом вероятна и объясняет обман, но определение «пророческий» отсутствует в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «И будет в тот день» сохраняет библейскую торжественность, а остальная фраза избегает ненужных архаизмов. Тире помогают ясно передать дистрибутивную конструкцию «пророки — каждый».
