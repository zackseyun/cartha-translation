  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
translation:
  language: ru
  text: И будет в тот день, — возвещает Господь Воинств, — Я истреблю имена идолов из земли, и их больше не вспомнят. Также Я удалю из земли пророков[b] и нечистого духа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух нечистоты».'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте речь идёт о пророках, связанных с идолопоклонством и нечистотой, то есть о пророках, вводящих народ в заблуждение.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет формулу пророческого возвещения о будущем и при этом звучит естественно и торжественно по-русски.
- source_word: בַיּוֹם הַהוּא
  choice: в тот день
  rationale: Точно передаёт устойчивую пророческую временную формулу.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Господь Воинств
  rationale: «Возвещает» передаёт формулу נְאֻם, а «Господь Воинств» сохраняет традиционное значение имени и эпитета без транслитерации «Саваоф».
- source_word: אַכְרִית
  choice: Я истреблю
  rationale: Передаёт решительное и полное устранение; русское «отсеку имена» было бы неестественно и могло бы затемнить смысл.
- source_word: שְׁמוֹת הָעֲצַבִּים
  choice: имена идолов
  rationale: Сохраняет явно выраженное «имена» и передаёт עֲצַבִּים обычным современным словом «идолы».
- source_word: מִן הָאָרֶץ
  choice: из этой земли
  rationale: Контекст очищения конкретной страны или земли благоприятствует территориальному значению; указательное «этой» естественно обозначает подразумеваемую землю, не превращая הָאָרֶץ во всю планету.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: и их больше не вспомнят
  rationale: Естественная русская неопределённо-личная конструкция передаёт еврейский пассив и сохраняет мысль об исчезновении идолов из памяти.
- source_word: וְגַם
  choice: Также
  rationale: Ясно передаёт присоединительное значение и естественно связывает второе действие очищения с первым.
- source_word: הַנְּבִיאִים
  choice: пророков
  rationale: Не добавляет отсутствующее в еврейском тексте определение «лжепророков»; отрицательный смысл следует из контекста и поясняется в сноске.
- source_word: רוּחַ הַטֻּמְאָה
  choice: нечистого духа
  rationale: Сохраняет возможное личностно-духовное значение конструкции; вариант «дух нечистоты» остаётся возможным и отмечен в сноске.
- source_word: אַעֲבִיר
  choice: Я удалю
  rationale: Прямо и естественно передаёт каузативное значение «устраню, заставлю уйти» и поддерживает параллель с истреблением идолов.
theological_decisions:
- issue: Следует ли прямо назвать пророков лжепророками
  choice: Оставить «пророков» в основном тексте и пояснить контекст в сноске.
  alternative: «лжепророков»
  rationale: В еврейском тексте нет прилагательного «ложные». Контекст связывает этих пророков с идолопоклонством и нечистотой, однако перевод не должен устранять формальную напряжённость оригинала.
- issue: Обозначает ли רוּחַ הַטֻּמְאָה личностного духа или дух/состояние нечистоты
  choice: «нечистого духа»
  alternative: «дух нечистоты»
  rationale: Конструкция допускает оба оттенка. Основной вариант сохраняет вероятный духовно-личностный смысл, а сноска отмечает более абстрактное прочтение без догматического разрешения неоднозначности.
- issue: Как передать יהוה צבאות
  choice: «Господь Воинств»
  alternative: «Яхве Воинств»; «Господь Саваоф»
  rationale: В современном литературном русском этот вариант передаёт значение титула и остаётся понятным обычному читателю; он не вводит конфессионально маркированную транслитерацию.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным, но сохранены повтор «из этой земли», формула «в тот день» и неуточнённое слово «пророков». Все маркеры сносок размещены непосредственно после соответствующих выражений.
