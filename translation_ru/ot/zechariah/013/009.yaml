base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
translation:
  language: ru
  text: 'И Я проведу эту треть через огонь[a], очищу их, как очищают серебро, и испытаю их, как испытывают золото. Он призовёт Моё имя, и Я отвечу ему. Я скажу: «Он — Мой народ», а он скажет: «Яхве — мой Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «введу эту треть в огонь». Здесь огонь изображает процесс очищения и испытания.'
    reason: Уточнение смыслового диапазона предлога и сохранение образа исходного текста.
lexical_decisions:
- source_word: הַשְּׁלִשִׁית
  choice: эту треть
  rationale: Субстантивированное порядковое числительное женского рода отсылает к уцелевшей трети из предыдущего стиха. «Эту треть» естественно по-русски выражает определённую часть целого.
- source_word: בָּאֵשׁ
  choice: через огонь
  rationale: При הֵבֵאתִי выражение описывает проведение остатка через очищающее огненное испытание, а не только помещение в огонь.
- source_word: וּצְרַפְתִּים
  choice: очищу их
  rationale: צרף обозначает очищение металла плавкой; «очищу» сохраняет металлургический образ и звучит естественно в сочетании с серебром.
- source_word: כִּצְרֹף אֶת־הַכֶּסֶף
  choice: как очищают серебро
  rationale: Инфинитивная конструкция с כ выражает сравнение. Неопределённо-личная форма точно и естественно передаёт процесс очищения металла.
- source_word: וּבְחַנְתִּים
  choice: и испытаю их
  rationale: בחן означает проверять, испытывать подлинность или качество; «испытаю» передаёт как проверку золота, так и образ испытания людей.
- source_word: כִּבְחֹן אֶת־הַזָּהָב
  choice: как испытывают золото
  rationale: Формулировка сохраняет параллелизм с очищением серебра и образ проверки драгоценного металла.
- source_word: הוּא יִקְרָא בִשְׁמִי
  choice: Он призовёт Моё имя
  rationale: קרא בשם здесь означает призвать имя Бога, обращаясь к Нему в молитве или поклонении. Формулировка сохраняет упоминание имени и русский библейский регистр.
- source_word: וַאֲנִי אֶעֱנֶה אֹתוֹ
  choice: и Я отвечу ему
  rationale: Единственное число передаёт коллективный остаток как одного представительного субъекта и сохраняет грамматический переход с множественного числа.
- source_word: עַמִּי הוּא
  choice: Он — Мой народ
  rationale: Намеренно сохранено напряжение между местоимением единственного числа и собирательным существительным «народ», присутствующее в еврейском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהָי
  choice: мой Бог
  rationale: Прямо передаёт притяжательную форму и личное исповедание в формуле завета.
theological_decisions:
- issue: Число местоимений в заключительной формуле завета
  choice: 'Сохранить единственное число: «Он — Мой народ»; «Яхве — мой Бог»'
  alternative: Сгладить как «Они — Мой народ»; «Яхве — наш Бог»
  rationale: Еврейский текст переходит от множественного числа «их» к единственному «он/ему», представляя остаток как единое целое. Сохранение перехода не устраняет содержательно значимую неоднозначность.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в местоимениях, относящихся к Богу, использованы последовательно. Необычное «Он — Мой народ» сохранено намеренно ради перехода от множественного к представительному единственному числу; сноска относится только к образу прохождения через огонь.
