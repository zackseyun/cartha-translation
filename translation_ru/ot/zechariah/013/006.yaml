base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
translation:
  language: ru
  text: 'И кто-нибудь скажет ему: «Что это за раны между твоими руками?[a]» — он ответит: «Это те раны, которыми меня ранили в доме тех, кто любит меня».[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между твоими руками»; вероятно, это выражение указывает на область груди или туловища, то есть место между руками.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в доме моих возлюбленных» или «в доме моих близких»; еврейское выражение может обозначать любимых людей, близких друзей или тех, с кем говорящий тесно связан.'
    reason: lexical_alternative
  - marker: c
    text: Некоторые христианские толкователи понимают эти раны мессиански, связывая их со страданиями Мессии; однако сам стих прямо этого не утверждает.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו
  choice: Если кто-нибудь спросит его
  rationale: В пророческом диалоге форма допускает обусловленную контекстом будущую или условную ситуацию. Неопределённый субъект естественно передан словом «кто-нибудь», а глагол «спросит» явно выражает функцию последующей прямой речи.
- source_word: הַמַּכּוֹת
  choice: раны
  rationale: מַכָּה может обозначать как удары, так и оставленные ими повреждения; вопрос касается видимых следов, поэтому «раны» здесь точнее и естественнее.
- source_word: בֵּין יָדֶיךָ
  choice: между твоими руками
  rationale: Сохранена буквальная и неоднозначная формулировка еврейского текста; возможное идиоматическое указание на грудь или туловище вынесено в сноску.
- source_word: הֻכֵּיתִי
  choice: мне нанесли
  rationale: Пассивная форма глагола נכה означает, что говорящий подвергся ударам или был ранен. В сочетании с уже названными ранами русское «их мне нанесли» передаёт смысл без тяжеловесного повтора.
- source_word: בֵּית מְאַהֲבָי
  choice: в доме тех, кто любит меня
  rationale: «Дом» сохранён прямо, а причастная форма от אהב передана как «те, кто любит меня», что удерживает широкое значение близких, любимых или тесно связанных с говорящим людей и не сужает его до романтических отношений.
theological_decisions:
- issue: Следует ли прямо отождествить говорящего с Мессией, а раны — с ранами распятия
  choice: Основной текст не вводит прямого мессианского отождествления.
  alternative: Христологическое прочтение связывает эти раны со страданиями и распятием Мессии; другое прочтение видит здесь ложного пророка, объясняющего свои раны.
  rationale: Сам еврейский стих описывает вопрос о видимых ранах и ответ на него, но прямо не называет ни Мессию, ни распятие. Поэтому богословская неоднозначность сохраняется, а известное христианское прочтение отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Буквально необычный образ «между твоими руками» сохранён ради неоднозначности оригинала и пояснён в сноске; синтаксис ответа слегка сглажен для естественной русской речи.
