  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
translation:
  language: ru
  text: 'И будет: если кто-либо ещё будет пророчествовать[a], отец и мать, родившие его, скажут ему: «Тебе не жить, потому что ты изрёк ложь именем Яхве». И отец и мать, родившие его, пронзят его[b], когда он будет пророчествовать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда кто-либо снова будет пророчествовать». Еврейское עוֹד может указывать как на продолжающееся, так и на возобновившееся действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заколют его» или «пронзят его насквозь». Еврейский глагол обозначает пронзание колющим оружием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет формулу введения будущего обстоятельства и её торжественную краткость без излишней архаизации.
- source_word: כִּי יִנָּבֵא אִישׁ עוֹד
  choice: если кто-нибудь ещё станет пророчествовать
  rationale: כִּי с имперфектом передаёт возможное будущее обстоятельство; עוֹד обозначает продолжение либо возобновление действия, а нейтральное «пророчествовать» не привносит ложность до прямого обвинения.
- source_word: אָבִיו וְאִמּוֹ יֹלְדָיו
  choice: отец и мать, родившие его
  rationale: Сохраняет явное упоминание обоих родителей и конкретный смысл причастия ילד, не сводя выражение просто к слову «родители».
- source_word: לֹא תִחְיֶה
  choice: Ты не должен жить
  rationale: Передаёт не простое предсказание, а суровый приговор или нормативное заявление.
- source_word: שֶׁקֶר דִּבַּרְתָּ
  choice: говорил ложь
  rationale: Естественное русское выражение, сохраняющее обвинение в ложной речи; форма может обозначать совершённое говорение в рамках пророческой деятельности.
- source_word: בְּשֵׁם יְהוָה
  choice: именем Яхве
  rationale: Передаёт действие от имени и с притязанием на авторитет Бога; тетраграмматон транслитерирован как личное имя «Яхве».
- source_word: וּדְקָרֻהוּ
  choice: пронзят его
  rationale: דקר обозначает нанесение колющего удара, обычно оружием; «пронзят» сохраняет прямоту и тяжесть действия.
- source_word: בְּהִנָּבְאוֹ
  choice: когда он будет пророчествовать
  rationale: Предлог ב при инфинитивной конструкции естественно передаётся временным придаточным и связывает действие родителей с моментом пророчествования.
theological_decisions:
- issue: Суровость действий родителей против лжепророка
  choice: Сохранить прямое заявление о смертном приговоре и пронзании собственного сына.
  alternative: Смягчить смысл до отречения, изгнания или несмертельного ранения.
  rationale: Еврейский текст прямо сочетает לֹא תִחְיֶה с דקר; перевод не должен ослаблять изображённую ревность против лжи, произнесённой именем Яхве.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В исходном тексте стоит тетраграмматон как личное имя; «Яхве» открыто сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Синтаксис сохраняет повтор «отец и мать, родившие его», значимый для резкого контраста между родительской близостью и исполнением суда. Архаические обороты избегаются; жестокость исходного текста не смягчается.
