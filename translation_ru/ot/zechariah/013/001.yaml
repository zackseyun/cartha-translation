lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная русская передача устойчивой пророческой формулы времени, сохраняющая её указательный характер.
- source_word: יִהְיֶה מָקוֹר נִפְתָּח
  choice: откроется источник
  rationale: Так передаётся будущее значение יִהְיֶה и пассивный смысл נִפְתָּח, при этом фраза звучит естественно по-русски.
- source_word: לְבֵית דָּוִיד
  choice: для дома Давида
  rationale: Предлог ל обозначает здесь предназначение и доступность источника для дома Давида.
- source_word: וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: и жителей Иерусалима
  rationale: Причастие יֹשְׁבֵי употреблено субстантивно и естественно передаётся словом «жители».
- source_word: לְחַטָּאת
  choice: для очищения от греха
  rationale: חַטָּאת может означать «грех» или «жертва за грех»; образ источника и параллель с נִדָּה указывают здесь прежде всего на очищение от греха. Слово «очищения» делает функцию источника понятной по-русски, не объясняя механизма очищения.
- source_word: וּלְנִדָּה
  choice: и нечистоты
  rationale: В данном контексте נִדָּה обозначает ритуальную нечистоту в широком смысле, хотя может употребляться и конкретно о менструальной нечистоте.
theological_decisions:
- issue: Смысл образа источника в пророческом контексте
  choice: Сохранить образ открытого источника, предназначенного для очищения от греха и нечистоты, не уточняя способ очищения.
  alternative: Истолковать источник непосредственно как искупление, кровь Мессии или иное конкретное средство очищения.
  rationale: Сам стих говорит о дарованном средстве очищения для дома Давида и жителей Иерусалима, но не определяет его механизм. Перевод сохраняет эту богословскую открытость.
- issue: Значение חַטָּאת
  choice: Передать как «грех», указав альтернативу в сноске.
  alternative: Передать как «жертва за грех».
  rationale: Сочетание с образом воды и с «нечистотой» поддерживает значение того, от чего очищают, однако лексическую неоднозначность следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая фраза без архаизмов. Порядок слов слегка перестроен ради естественности, а повтор «для» сохраняет связь обеих групп с открываемым источником.
