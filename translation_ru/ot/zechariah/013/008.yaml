base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/008.yaml
  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: ru
  text: И будет по всей земле, — возвещает ГОСПОДЬ, — что две трети в ней будут истреблены и погибнут, а треть останется в ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְכָל־הָאָרֶץ
  choice: по всей земле
  rationale: Сохраняет пространственный охват еврейского выражения; слово אֶרֶץ допускает значения «земля» и «страна», поэтому перевод не конкретизирует территорию сверх контекста.
- source_word: נְאֻם יְהוָה
  choice: возвещает ГОСПОДЬ
  rationale: Передаёт устойчивую пророческую формулу как торжественное Божье заявление; тетраграмматон представлен принятой заменой «ГОСПОДЬ».
- source_word: פִּי שְׁנַיִם
  choice: две трети
  rationale: В данном противопоставлении «третьей части» идиоматическое выражение обозначает две доли из трёх.
- source_word: יִכָּרְתוּ יִגְוָעוּ
  choice: будут истреблены и погибнут
  rationale: 'Сохраняет два последовательных еврейских глагола: отсечение/уничтожение и гибель.'
- source_word: הַשְּׁלִשִׁית יִוָּתֶר
  choice: треть останется
  rationale: Естественно передаёт третью долю и её сохранение как остатка.
theological_decisions:
- issue: Географический охват слова אֶרֶץ
  choice: земле
  alternative: стране
  rationale: Оставлена присущая слову широта значения; контекст стиха сам по себе не требует однозначно понимать весь мир или только землю Израиля.
- issue: Характер участи двух третей
  choice: будут истреблены и погибнут
  alternative: будут отсечены и умрут
  rationale: Не смягчается двойная формулировка исходного текста и не вводится дополнительное учение о способе или вечном значении этой гибели.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Инверсия и вставная формула речи сохранены без архаизмов; повтор «на ней» отражает повтор בָּהּ в исходном тексте.
