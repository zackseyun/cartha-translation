base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
translation:
  language: ru
  text: Ибо дворец будет покинут, многолюдный город — оставлен; Офел[a] и сторожевая башня станут пещерами[b] навеки, отрадой для диких ослов, пастбищем для стад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Офел — название укреплённого холма или возвышенного участка Иерусалима.
    reason: cultural_note
  - marker: b
    text: 'Или: «станут логовами навеки». Еврейский текст может изображать разрушенные укрепления как убежища для животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  choice: дворец
  rationale: Обычное значение — царское или укреплённое значительное здание; в контексте запустения города естественно «дворец».
- source_word: נֻטָּשׁ
  choice: будет покинут
  rationale: Пассивная форма обозначает оставленное, опустевшее место; будущее время естественно в русском пророческом контексте.
- source_word: הֲמוֹן עִיר
  choice: шумный город
  rationale: הָמוֹן может обозначать множество людей, гул и оживление; «шумный город» сохраняет образ городской многолюдности и шума.
- source_word: עֻזָּב
  choice: оставлен
  rationale: Передаёт пассив от עזב и сохраняет параллелизм с «будет покинут», не повторяя тот же глагол.
- source_word: עֹפֶל
  choice: Офел
  rationale: Вероятнее всего, это топоним — название укреплённого возвышенного участка Иерусалима; поэтому он транслитерирован.
- source_word: בַּחַן
  choice: сторожевая башня
  rationale: Слово, вероятно, обозначает дозорную или наблюдательную башню; конкретный перевод соответствует образу укреплений.
- source_word: הָיָה בְעַד מְעָרוֹת
  choice: станут пещерами
  rationale: Необычная конструкция передаёт превращение укреплений в пещерообразные развалины или звериные логова; сохранено основное значение מְעָרוֹת.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Устойчивое обозначение длительной, неопределённо долгой продолжительности; «навеки» естественно для пророческой поэзии.
- source_word: מְשׂוֹשׂ פְּרָאִים
  choice: отрадой для диких ослов
  rationale: מְשׂוֹשׂ означает радость или отраду; выражение изображает животных, свободно обитающих среди развалин.
- source_word: מִרְעֵה עֲדָרִים
  choice: пастбищем для стад
  rationale: Прямо и естественно передаёт место выпаса стад и заключительный образ запустевшего города.
theological_decisions:
- issue: Значение עַד עוֹלָם в пророческом контексте
  choice: навеки
  alternative: на долгие времена
  rationale: Сохранена сильная формулировка еврейского текста без догматического вывода об абсолютной бесконечности; дальнейший контекст книги может уточнять риторический масштаб выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Сохранён параллелизм первых двух частей и цепь образов запустения. «Шумный город» передаёт смысл множества и городского гула, не сужая выражение только до численности населения.
