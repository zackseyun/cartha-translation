lexical_decisions:
- source_word: נָבָל
  choice: глупец
  rationale: Слово обозначает не просто недостаток ума, а нравственно безрассудного, низкого человека. «Глупец» сохраняет краткость и привычный для библейской литературы этический смысл.
- source_word: נָדִיב
  choice: благородный
  rationale: Слово может указывать на благородство, знатность или щедрость. В сочетании с глаголом «называть» здесь естественно звучит как почётное общественное определение.
- source_word: כִילַי
  choice: скупец
  rationale: Редкое слово характеризует человека скупого, корыстного и нравственно низкого. «Скупец» передаёт его наиболее явный смысл и создаёт ясный контраст со «щедрым».
- source_word: שׁוֹעַ
  choice: щедрый
  rationale: Слово допускает значения, связанные со знатностью, богатством и высоким положением. По контрасту со скупцом «щедрый» естественно выражает нравственно-социальное противопоставление, а иные оттенки отмечены в сноске.
- source_word: יִקָּרֵא / יֵאָמֵר
  choice: будут называть
  rationale: Обе пассивные формы описывают то, как людей именуют или характеризуют окружающие. Единая русская конструкция сохраняет лаконичный параллелизм стиха.
- source_word: לֹא ... עוֹד
  choice: больше не
  rationale: Сочетание отрицания с עוֹד означает прекращение прежнего положения; «больше не» естественно передаёт это по-русски.
theological_decisions:
- issue: Характер противопоставления
  choice: Прекращение ложной общественно-нравственной оценки людей, когда порочным дают почётные наименования.
  alternative: Прямое описание исключительно мессианской эпохи либо общее изречение о правдивой речи.
  rationale: Сам стих говорит о правильном именовании людей по их нравственным качествам. Более широкий контекст может придавать этому будущий или эсхатологический оттенок, но его не следует вводить в перевод явно.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный синтаксис сохраняет параллелизм еврейского стиха. Эллипсис «а скупца — щедрым» естественен по-русски и не ослабляет значение второго пассивного глагола.
