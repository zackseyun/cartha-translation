  yaml_path: translation/ot/isaiah/032/012.yaml
  text: They beat their breasts in mourning over the delightful fields[b][a], over the fruitful vine.
translation:
  language: ru
  text: Бьют себя в грудь[a], скорбя о прекрасных полях, о плодоносной виноградной лозе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о грудях скорбят». Еврейская фраза сжата; обычно её понимают как указание на обычай бить себя в грудь в знак скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁדַיִם
  choice: себя в грудь
  rationale: 'Буквально — «груди». В сочетании с причастием «скорбящие» это, вероятнее всего, сжатое указание на жест скорби — удары себя в грудь. В русском устойчивом выражении естественно употребить единственное число: «бить себя в грудь».'
- source_word: סֹפְדִים
  choice: Бьют себя в грудь, скорбя
  rationale: Причастие означает «скорбящие, оплакивающие». Перевод сохраняет значение скорби и раскрывает подразумеваемый в сжатой еврейской конструкции жест, не превращая причастие в повеление или явно будущее действие.
- source_word: שְׂדֵי חֶמֶד
  choice: прекрасных полях
  rationale: חֶמֶד обозначает нечто желанное, ценное и привлекательное. «Прекрасные поля» звучит естественно по-русски и передаёт ценность утрачиваемых угодий.
- source_word: גֶּפֶן פֹּרִיָּה
  choice: плодоносной виноградной лозе
  rationale: גֶּפֶן — виноградная лоза, а פֹּרִיָּה — плодоносящая, плодовитая. Выбранная формулировка ясна современному читателю и сохраняет земледельческий образ.
- source_word: עַל
  choice: о
  rationale: Повторённый предлог указывает на предмет скорби. Русское «скорбеть о» естественно передаёт эту связь; повтор «о… о…» сохраняет параллелизм оригинала.
