  - severity: medium
    issue: «Опояшьте бёдра» неточно передаёт синтаксис и образ עַל חֲלָצָיִם.
    rationale: Еврейское выражение буквально означает «на/по чреслам» и описывает место подпоясывания. По-русски естественнее «подпояшьтесь по чреслам»; «опоясать бёдра» звучит неуклюже.
  - severity: low
