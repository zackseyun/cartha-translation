base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
translation:
  language: ru
  text: Содрогнитесь, беспечные женщины; трепещите, уверенные в своей безопасности! Снимите с себя одежду, обнажитесь и подпояшьтесь по чреслам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на чреслах»; то есть в области поясницы или талии. Предмет, которым следует подпоясаться, в еврейском тексте прямо не назван; в траурном контексте его часто понимают как вретище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְדוּ
  choice: содрогнитесь
  rationale: Повелительная форма множественного числа от חרד передаёт испуганную дрожь. «Содрогнитесь» звучит естественно и сохраняет силу пророческого призыва.
- source_word: שַׁאֲנַנּוֹת
  choice: беспечные женщины
  rationale: Форма женского рода множественного числа обозначает женщин, живущих спокойно и беззаботно; в контексте обличения «беспечные» передаёт оттенок самодовольной безмятежности.
- source_word: רְגָזָה
  choice: трепещите
  rationale: Повелительная форма женского рода множественного числа от רגז выражает дрожь и смятение. Выбор сохраняет параллелизм с חִרְדוּ, не сливая два глагола в один.
- source_word: בֹּטְחוֹת
  choice: чувствующие себя в безопасности
  rationale: Причастие женского рода множественного числа от בטח описывает тех, кто ощущает себя защищённым и не ждёт беды. Развёрнутая формулировка естественнее по-русски и не приписывает им добродетель доверия.
- source_word: פְּשֹׁטָה
  choice: снимите с себя одежду
  rationale: Императив от פשט в данном контексте означает снять одежду. Эксплицитная формулировка передаёт действие ясно и не объединяет его со следующим повелением.
- source_word: וְעֹרָה
  choice: обнажитесь
  rationale: Второй императив усиливает первый и указывает на состояние обнажённости. «Обнажитесь» кратко сохраняет последовательность двух еврейских повелений.
- source_word: וַחֲגֹרָה
  choice: и опояшьте … вретищем
  rationale: Глагол חגר означает опоясать или подвязать вокруг тела. Предмет в еврейском тексте не назван; «вретище» восполняется по контексту пророческого плача и отмечено сноской.
- source_word: עַל חֲלָצָיִם
  choice: бёдра
  rationale: Буквально выражение указывает на чресла или область бёдер. «Опояшьте бёдра» понятно современному читателю и сохраняет телесный образ без архаизма «чресла».
