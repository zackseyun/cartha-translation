base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/002.yaml
  text: And a man will be like a hiding place from the wind[a], and a shelter from the storm, like streams of water in a dry place[c][b], like the shade of a massive rock in a weary land.
translation:
  language: ru
  text: И человек[c] будет как укрытие от ветра[a] и убежище от ливня[b], как потоки воды в иссохшей местности, как тень массивной скалы в измученной земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прибежище от ветра».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убежище от бури»; еврейское слово может обозначать сильный ливень или ненастье.'
    reason: lexical_alternative
  - marker: c
    text: Слово «человек» может относиться к идеальному правителю из предыдущего стиха, представительно — к каждому справедливому правителю или типологически указывать за их пределы.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: И ... будет
  rationale: Сохраняет связь с предыдущим стихом; форма в пророческом контексте естественно передаётся будущим временем.
- source_word: אִישׁ
  choice: человек
  rationale: Передаёт единственное число и не уточняет, идёт ли речь об одном идеальном правителе или о представительном образе.
- source_word: מַחֲבֵא רוּחַ
  choice: укрытие от ветра
  rationale: «Укрытие» естественно передаёт место, где можно скрыться и найти защиту, сохраняя конкретный образ.
- source_word: סֵתֶר זָרֶם
  choice: убежище от ливня
  rationale: זָרֶם может обозначать сильный ливень, бурный поток или ненастье; «ливень» сохраняет погодный образ и не дублирует «ветер».
- source_word: פַלְגֵי מַיִם
  choice: потоки воды
  rationale: Передаёт текущие водные русла и живительный контраст с засушливой местностью.
- source_word: בְּצָיוֹן
  choice: в иссохшей местности
  rationale: Существительное обозначает сухость или засушливую область; формулировка естественна по-русски и сохраняет пространственный образ.
- source_word: צֵל סֶלַע כָּבֵד
  choice: тень массивной скалы
  rationale: כָּבֵד буквально «тяжёлый», но здесь характеризует внушительную, массивную скалу, дающую надёжную тень.
- source_word: בְּאֶרֶץ עֲיֵפָה
  choice: в земле изнуряющей
  rationale: Сохраняет олицетворяющую метафору עֲיֵפָה и допускает смысл земли, которая утомляет путника жарой и бесплодием.
theological_decisions:
- issue: К кому относится אִישׁ («человек»)
  choice: Оставлено неопределённое «человек»
  alternative: «Он», «каждый из них», «царь» или прямое мессианское обозначение
  rationale: Контекст упоминает царя и князей, однако еврейский текст не уточняет референта. Перевод сохраняет возможность отнести образ к идеальному правителю, к каждому праведному правителю или понимать его типологически.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной образностью. Синтаксический параллелизм оригинала сохранён; неоднозначный референт «человек» не конкретизирован.
