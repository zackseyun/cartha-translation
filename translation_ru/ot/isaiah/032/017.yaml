  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: ru
  text: Делом праведности будет мир, а плодом праведности — покой и безопасность навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: плодом
  rationale: В сочетании с абстрактным родительным выражает то, что праведность производит; «плод» естественно передаёт результат, не сводя слово к отдельному поступку.
- source_word: הַצְּדָקָה
  choice: праведности
  rationale: Сохраняет основной нравственно-богословский смысл צְדָקָה и параллелизм обеих строк.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Передаёт центральное значение שָׁלוֹם; в контексте оно включает благополучие, но расширение в основном тексте не требуется.
- source_word: עֲבֹדַת
  choice: делом
  rationale: Здесь слово обозначает действие или результат действия праведности; «дело» звучит естественно и сохраняет параллель с первой строкой, тогда как буквальное «служение» могло бы неоправданно сузить смысл.
- source_word: הַשְׁקֵט
  choice: покой
  rationale: Передаёт состояние тишины и отсутствия тревоги в данном контексте.
- source_word: בֶטַח
  choice: безопасность
  rationale: Передаёт состояние защищённости и уверенности; вместе с «покоем» сохраняет парную конструкцию оригинала.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и естественно выражает неограниченную длительность.
theological_decisions:
- issue: Причинно-результативная связь между праведностью и миром
  choice: «плодом праведности будет мир»
  alternative: «делом праведности будет мир»
  rationale: Формулировка показывает мир как производимый праведностью результат, не уточняя сверх текста, идёт ли речь о человеческой праведности, Божьем праведном правлении или обоих аспектах.
- issue: Значение עֲבֹדַת הַצְּדָקָה
  choice: «делом праведности»
  alternative: «служением праведности»
  rationale: Выбран нейтральный вариант, не вводящий специального культового или конфессионального смысла; неоднозначность между действием и его результатом частично сохраняется.
translation_notes:
  register: Современный литературный русский язык, сжатый и торжественный синтаксис. Сохранены две параллельные части стиха и будущая направленность высказывания; архаизмы и конфессионально маркированные уточнения исключены.
