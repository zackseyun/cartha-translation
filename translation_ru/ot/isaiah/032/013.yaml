  text: עַ֚ל אַדְמַ֣ת עַמִּ֔/י ק֥וֹץ שָׁמִ֖יר תַּֽעֲלֶ֑ה כִּ֚י עַל כָּל בָּתֵּ֣י מָשׂ֔וֹשׂ קִרְיָ֖ה עַלִּיזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
translation:
  language: ru
  text: На земле моего народа взойдут[a] терновник и колючки — даже на всех домах веселья в ликующем городе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прорастут».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в городе, полном ликования»; еврейское выражение описывает город, отмеченный радостью и весельем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  choice: земле моего народа
  rationale: אַדְמָה обозначает землю или почву; «земля» естественно передаёт как конкретную поверхность, так и территорию народа.
- source_word: קוֹץ שָׁמִיר
  choice: терновник и колючки
  rationale: Сочетание двух названий колючей растительности создаёт образ запустения; русский перевод сохраняет этот образ, не приписывая словам чрезмерно точного ботанического значения.
- source_word: תַּעֲלֶה
  choice: взойдут
  rationale: В данном контексте עלה описывает появление растительности из земли; «взойдут» кратко и естественно передаёт этот смысл.
- source_word: כִּי
  choice: даже
  rationale: 'Здесь частица, вероятнее всего, усиливает и расширяет картину опустошения: колючая растительность появится не только на земле, но даже на домах города. Перевод сохраняет связь с предшествующей строкой, не превращая её в причинное предложение.'
- source_word: בָּתֵּי מָשׂוֹשׂ
  choice: домах веселья
  rationale: Буквальное образное сочетание «дома веселья» сохраняет открытым вопрос, имеются ли в виду праздничные жилища, места увеселения или дома, прежде наполненные радостью.
- source_word: קִרְיָה עַלִּיזָה
  choice: ликующем городе
  rationale: עַלִּיזָה прямо обозначает радостный, ликующий характер города; перевод не усиливает возможный оттенок беспечности, который остаётся контекстуальным.
