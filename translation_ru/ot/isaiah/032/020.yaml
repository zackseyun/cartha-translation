  source_fidelity: «Блаженны вы» точно передаёт אַשְׁרֵיכֶם как обращённое ко множеству адресатов выражение блаженства. Причастные обороты сохраняют параллелизм זֹרְעֵי и מְשַׁלְּחֵי. «У всех вод» адекватно передаёт образ сеяния возле многочисленных водных источников, не навязывая спорного более узкого толкования. «Отпускающие вола и осла свободно ходить» естественно передаёт смысл идиомы מְשַׁלְּחֵי רֶגֶל, а буквальный образ «посылающие ногу» честно отражён в сноске.
