  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
translation:
  language: ru
  text: Блаженны вы, сеющие у всех вод и отпускающие вола и осла свободно ходить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посылающие ногу вола и осла»; это выражение означает, что животных выпускают свободно ходить или пастись.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  choice: Блаженны вы
  rationale: Форма во множественном числе выражает блаженное, достойное зависти состояние адресатов; эта формулировка сохраняет силу блаженства и звучит естественно в библейском контексте.
- source_word: זֹרְעֵי
  choice: сеющие
  rationale: Причастие характеризует адресатов по совершаемому ими действию и естественно согласуется с обращением во множественном числе.
- source_word: עַל כָּל מָיִם
  choice: у всех вод
  rationale: Предлог עַל здесь вероятнее всего указывает на место рядом с водой; выражение передаёт картину обильно орошаемой земли, не сводя множественное מָיִם к одному водоёму.
- source_word: מְשַׁלְּחֵי רֶגֶל
  choice: отпускающие ... свободно ходить
  rationale: Буквально выражение говорит о «посылании ноги» животных, но в земледельческом контексте означает, что их выпускают свободно передвигаться или пастись. Русская формулировка передаёт идиоматический смысл, а буквальный образ отмечен в сноске.
- source_word: הַשּׁוֹר
  choice: вола
  rationale: «Вол» естественно обозначает рабочее крупное рогатое животное в земледельческом контексте и сохраняет форму единственного числа.
- source_word: וְהַחֲמוֹר
  choice: и осла
  rationale: «Осёл» — ясное современное соответствие, сохраняющее единственное число и парную конструкцию с «волом».
