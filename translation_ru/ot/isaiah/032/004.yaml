  - marker: b
    text: 'Или: «будет быстро и отчётливо говорить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַב
  choice: сердце
  rationale: Сохраняет древнееврейский образ внутреннего средоточия мысли и понимания; познавательный смысл ясно выражен глаголом «постигнет».
- source_word: נִמְהָרִים
  choice: опрометчивых
  rationale: Передаёт значение людей поспешных в суждениях и поступках, а не просто действующих быстро.
- source_word: יָבִין לָדַעַת
  choice: постигнет знание
  rationale: Передаёт сочетание глагола בין «понимать, постигать» с инфинитивом דעת «знать» и сохраняет его познавательную направленность.
- source_word: לְשׁוֹן עִלְּגִים
  choice: язык заикающихся
  rationale: Сохраняет конкретный поэтический образ языка и людей с затруднённой, запинающейся речью.
- source_word: תְּמַהֵר לְדַבֵּר
  choice: поспешит говорить
  rationale: Прямо передаёт значение быстроты и сохраняет словесную перекличку корня מהר с характеристикой опрометчивых в первой строке.
- source_word: צָחוֹת
  choice: ясно
  rationale: Естественно выражает ясность, отчётливость и понятность речи в противопоставлении заиканию.
