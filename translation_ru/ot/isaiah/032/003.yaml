  text: וְ/לֹ֥א תִשְׁעֶ֖ינָה עֵינֵ֣י רֹאִ֑ים וְ/אָזְנֵ֥י שֹׁמְעִ֖ים תִּקְשַֽׁבְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/003.yaml
  text: Then the eyes of those who see will not be dim[a], and the ears of those who hear will listen attentively.
translation:
  language: ru
  text: Тогда глаза видящих не померкнут, и уши слышащих будут внимать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לֹא תִשְׁעֶינָה
  choice: Тогда … не померкнут
  rationale: Первый союз передаёт связь с обещанным преобразованием в предыдущем контексте. Отрицание сохранено прямо; редкий глагол שעה в данном контексте, вероятно, говорит о помрачении или нарушении зрения. «Не померкнут» естественно по-русски и не усиливает значение до полной слепоты.
- source_word: עֵינֵי רֹאִים
  choice: глаза видящих
  rationale: Сохранены конструкция принадлежности и намеренный парадокс еврейского текста; причастие понято субстантивно, без узкого технического значения «пророки-провидцы».
- source_word: וְ/אָזְנֵי שֹׁמְעִים
  choice: и уши слышащих
  rationale: Сохранены союз, синтаксическая конструкция и параллелизм с «глазами видящих».
- source_word: תִּקְשַׁבְנָה
  choice: будут внимать
  rationale: Глагол קשׁב обозначает сосредоточенное, внимательное слушание. «Будут внимать» кратко и точно передаёт этот оттенок в достойном современном регистре.
theological_decisions:
- issue: Характер восстановленного восприятия
  choice: Сохранить конкретные образы зрения и слуха, допускающие нравственное, духовное и общественное осмысление
  alternative: Передать стих как буквальное исцеление слепоты и глухоты либо прямо заменить образы словами о духовной проницательности
  rationale: Контекст Ис 32:1–4 связывает обещание с праведным правлением и обновлённым пониманием, однако сам стих выражает это через телесно-чувственные образы. Перевод не разрешает эту смысловую напряжённость за читателя.
- issue: Круг обозначенных словом רֹאִים
  choice: «видящие» в общем смысле
  alternative: «провидцы» как особая группа пророческих руководителей
  rationale: В данном параллелизме причастия «видящие» и «слышащие» естественнее понимать широко; техническое пророческое значение контекстом не требуется.
translation_notes:
  register: Современный литературный русский язык; краткая поэтическая фраза сохраняет параллелизм оригинала. «Внимать» несколько возвышенно, но общеупотребительно в библейском контексте и точно передаёт внимательное слушание. Смысловая неоднозначность редкого תִשְׁעֶינָה отражена выбором «не померкнут» без примечания, поскольку это хорошо поддержанный контекстом вариант и текст не содержит маркеров сносок.
