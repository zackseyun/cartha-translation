  text: Then justice will dwell in the wilderness[b][a], and righteousness will abide in the fruitful field.
translation:
  language: ru
  text: Тогда правосудие поселится в пустыне, и праведность будет пребывать[a] на плодородной земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сядет»; здесь имеется в виду постоянное, прочное пребывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на Кармиле». Еврейское слово кармель может обозначать плодородную возделанную землю либо быть названием местности — Кармил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַן
  choice: Тогда … поселится
  rationale: Перфект Qal в данном пророческом контексте имеет будущее значение; «тогда» естественно передаёт последовательность по отношению к предыдущему стиху, а «поселится» сохраняет образ постоянного пребывания.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необработанную местность и здесь контрастирует с плодородной землёй.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В контексте восстановления речь идёт об установленном справедливом порядке; «правосудие» сохраняет отличие от следующего צְדָקָה.
- source_word: וּצְדָקָה
  choice: а праведность
  rationale: «Праведность» сохраняет смысловую самостоятельность второго понятия в традиционной паре מִשְׁפָּט וּצְדָקָה; союз «а» естественно оформляет поэтический параллелизм и сопоставление двух мест.
- source_word: בַּכַּרְמֶל
  choice: на плодородной земле
  rationale: כַּרְמֶל может быть нарицательным обозначением плодородной, возделанной земли. Здесь такое понимание поддерживается контрастом с пустыней, но возможность топонима «Кармил» сохранена в примечании.
- source_word: תֵּשֵׁב
  choice: обоснуется
  rationale: Глагол ישׁב буквально может означать «сидеть», но также выражает устойчивое проживание или пребывание. «Обоснуется» естественно передаёт здесь олицетворение праведности и её прочное пребывание, не повторяя «поселится».
theological_decisions:
- issue: Различение מִשְׁפָּט и צְדָקָה
  choice: правосудие … праведность
  alternative: справедливость … правда
  rationale: 'Два близких понятия не сведены к одному слову: первое обозначает справедливый порядок и суд, второе — нравственную правоту и праведность. Это сохраняет богословское и поэтическое напряжение еврейской пары.'
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим ритмом. Олицетворение правосудия и праведности сохранено; синтаксис остаётся прозрачным для широкого читателя.
