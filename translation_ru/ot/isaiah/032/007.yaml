  text: וְ/כֵלַ֖י כֵּלָ֣י/ו רָעִ֑ים ה֚וּא זִמּ֣וֹת יָעָ֔ץ לְ/חַבֵּ֤ל ענוים בְּ/אִמְרֵי שֶׁ֔קֶר וּ/בְ/דַבֵּ֥ר אֶבְי֖וֹן מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
translation:
  language: ru
  text: 'А орудия негодяя злы[a]: он замышляет козни, чтобы погубить смиренных[b] лживыми словами, даже когда бедняк говорит то, что справедливо[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «средства», «приёмы»; еврейское слово может обозначать буквальные орудия или переносно способы действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «угнетённых» или «кротких».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и когда бедняк говорит справедливость (или: правосудие, законное дело)». Смысл, вероятно, в том, что негодяй противится бедняку, даже когда тот прав.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  choice: орудия негодяя
  rationale: כֵלַי обозначает негодяя, названного в предыдущем стихе, а כֵּלָיו — его орудия, средства или приёмы. «Орудия» сохраняет конкретный образ и допускает переносный смысл.
- source_word: רָעִים
  choice: злы
  rationale: Предикативное прилагательное выражает нравственную оценку орудий или способов негодяя; «злы» сохраняет пророческую силу обвинения.
- source_word: זִמּוֹת יָעָץ
  choice: он замышляет козни
  rationale: Сочетание существительного со значением злонамеренных планов и глагола «советовать/замышлять» естественно передаётся как намеренное составление пагубных замыслов.
- source_word: לְחַבֵּל
  choice: чтобы погубить
  rationale: Инфинитив обозначает цель причинения разрушительного вреда; «погубить» передаёт серьёзность угрозы, не обязательно подразумевая физическое убийство.
- source_word: ענוים
  choice: смиренных
  rationale: Слово может обозначать смиренных, кротких или угнетённых. «Смиренных» сохраняет этико-религиозный оттенок и не смешивает эту группу с прямо названным далее бедняком.
- source_word: בְּאִמְרֵי שֶׁקֶר
  choice: лживыми словами
  rationale: Предлог указывает на средство действия; перевод сохраняет множественное число и звучит естественно по-русски.
- source_word: אֶבְיוֹן
  choice: бедняк
  rationale: Мужской род и единственное число исходного слова переданы конкретным русским существительным; в контексте оно имеет обобщающее значение.
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: даже когда бедняк говорит то, что справедливо
  rationale: Конструкция с בְּ и инфинитивом понята обстоятельственно-временно. מִשְׁפָּט сохраняет правовой и нравственный смысл через выражение «то, что справедливо», не сводясь лишь к абстрактной «справедливости».
theological_decisions:
- issue: 'Значение ענוים: смиренные или угнетённые'
  choice: смиренных
  alternative: угнетённых; кротких
  rationale: Контекст допускает как внутреннее качество, так и социальное бедствие. В основном тексте выбран традиционно понятный этический смысл, а реальная неоднозначность отмечена в сноске.
- issue: Синтаксис заключительной фразы וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: даже когда бедняк говорит то, что справедливо
  alternative: когда бедняк излагает своё законное дело; и когда бедняк говорит о правосудии
  rationale: 'Так передаётся вероятный уступительный смысл: негодяй губит бедного вопреки справедливости его слов или дела. Поскольку еврейская формулировка сжата и допускает иные оттенки, они указаны в сноске.'
- issue: Представительный мужской род единственного числа אֶבְיוֹן
  choice: бедняк
  alternative: нуждающийся человек; бедный
  rationale: «Бедняк» точно отражает грамматическую форму и остаётся естественным обобщающим обозначением, не утверждая, что сказанное относится исключительно к мужчинам.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис ясен для широкого читателя; слова «негодяй», «козни» и «погубить» сохраняют высокую нравственную напряжённость без архаизации.
