  source_fidelity: 'Основной смысл передан верно: нравственно испорченный глупец говорит глупость; его внутреннее намерение направлено на зло, нечестие, ложную речь о/против Яхве и лишение нуждающихся пищи и питья. Однако в исходном русском тексте ряд после двоеточия грамматически неудачно приписывается ближайшему слову «сердце» и не выражает целевую функцию еврейских инфинитивов.'
  naturalness: '«Сердце его творит зло: поступает нечестиво…» звучит тяжеловесно и создаёт неясность субъекта. «Сердце его замышляет зло, чтобы…» естественно для современного литературного русского и ясно связывает последующий ряд с намерением/деятельностью нечестивца.'
  terminology: '«Глупец / глупость» уместно сохраняет еврейскую игру слов; «нечестие», «Яхве», «голодный» и «жаждущий» точны по регистру и смыслу. Сноску к נֶפֶשׁ следует уточнить: выражение не значит буквально «голодная нефеш», а содержит слово «нефеш» применительно к голодному.'
