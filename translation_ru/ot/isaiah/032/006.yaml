  text: כִּ֤י נָבָל֙ נְבָלָ֣ה יְדַבֵּ֔ר וְ/לִבּ֖/וֹ יַעֲשֶׂה אָ֑וֶן לַ/עֲשׂ֣וֹת חֹ֗נֶף וּ/לְ/דַבֵּ֤ר אֶל יְהוָה֙ תּוֹעָ֔ה לְ/הָרִיק֙ נֶ֣פֶשׁ רָעֵ֔ב וּ/מַשְׁקֶ֥ה צָמֵ֖א יַחְסִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/006.yaml
  text: 'For a fool speaks folly[a], and his heart devises iniquity: to practice godlessness and to speak error against Yahweh[c][b], to leave the hungry person empty and to withhold drink from the thirsty.'
translation:
  language: ru
  text: Ведь глупец говорит глупость, а сердце его замышляет зло, чтобы творить нечестие[a], говорить ложь против Яхве[c], оставлять голодного ни с чем[b] и лишать жаждущего питья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицемерие»; еврейское слово חֹנֶף может обозначать как нечестие и безбожие, так и лицемерную порочность.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «нефеш голодного»; здесь еврейское נֶפֶשׁ означает голодного человека или его жизнь, а не обязательно «душу» в узком смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «говорить ложное о Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: נָבָל / נְבָלָה
  choice: глупец / глупость
  rationale: Сохраняет еврейскую игру однокоренных слов и передаёт не недостаток ума как таковой, а нравственную испорченность и безрассудство.
- source_word: וְלִבּוֹ יַעֲשֶׂה אָוֶן
  choice: и сердце его творит зло
  rationale: «Сердце» сохраняет еврейский образ внутреннего центра воли и мысли; глагольное выражение передаёт деятельное порождение зла без излишнего уточнения «замышляет».
- source_word: חֹנֶף
  choice: поступает нечестиво
  rationale: В контексте слово обозначает безбожную, порочную деятельность; глагольная формулировка естественно передаёт конструкцию לַעֲשׂוֹת חֹנֶף.
- source_word: אֶל יְהוָה תּוֹעָה
  choice: говорит ложь против Яхве
  rationale: Передаёт ложность или заблуждение в речи и возможную направленность этой речи против Бога, не скрывая альтернативного понимания предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, транслитерацией, а не заменяет его титулом.
- source_word: לְהָרִיק נֶפֶשׁ רָעֵב
  choice: оставляет голодного ни с чем
  rationale: נֶפֶשׁ здесь относится к живому человеку в телесной нужде; русское выражение естественно передаёт лишение голодного необходимой пищи.
- source_word: וּמַשְׁקֶה צָמֵא יַחְסִיר
  choice: лишает жаждущего питья
  rationale: Кратко и естественно передаёт причинение недостатка питья тому, кто испытывает жажду.
theological_decisions:
- issue: Значение חֹנֶף в религиозно-нравственном контексте
  choice: нечестие
  alternative: лицемерие
  rationale: Связь с ложью против Яхве и лишением нуждающихся необходимого указывает на широкое значение порочной безбожности, а не только на притворство.
- issue: Значение נֶפֶשׁ применительно к голодному
  choice: человек, то есть «голодный»
  alternative: душа / аппетит
  rationale: В данном контексте речь идёт о целом живом человеке, нуждающемся в пище, а не об отделённой от тела душе.
- issue: Отношение ложной речи к Яхве в אֶל יְהוָה תּוֹעָה
  choice: ложь против Яхве
  alternative: ложное о Яхве
  rationale: Основной текст сохраняет возможную в контексте враждебную направленность речи; сноска отмечает допустимое понимание как ложного высказывания о Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический ряд после двоеточия сохраняет последовательность проявлений зла, а формулировки остаются понятными обычному читателю.
