  text: וְ/יָשַׁ֥ב עַמִּ֖/י בִּ/נְוֵ֣ה שָׁל֑וֹם וּֽ/בְ/מִשְׁכְּנוֹת֙ מִבְטַחִ֔ים וּ/בִ/מְנוּחֹ֖ת שַׁאֲנַנּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
translation:
  language: ru
  text: И будет жить Мой народ в мирной обители[a], в безопасных жилищах и в безмятежных местах покоя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в обители мира».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в спокойных местах отдыха»; возможный смысл: «в местах покоя, где ничто не тревожит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: И будет жить
  rationale: Глагол ישב может означать «сидеть, жить, обитать»; в контексте устойчивой и безопасной жизни естественное русское «будет жить» передаёт продолжительное пребывание, а союз וְ — последовательность обещания.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Стандартное выражение עם с суффиксом первого лица передано реляционно и без менее уместного здесь значения «нация».
- source_word: בִּנְוֵה שָׁלוֹם
  choice: в мирной обители
  rationale: נָוֶה здесь обозначает место обитания, а שָׁלוֹם — мир, благополучие и целостность. Формулировка естественна по-русски; более буквальное «в обители мира» сохранено в примечании.
- source_word: וּבְמִשְׁכְּנוֹת מִבְטַחִים
  choice: в безопасных жилищах
  rationale: מִשְׁכָּנוֹת означает жилища, а מִבְטַחִים указывает на безопасность и надёжность; перевод не вносит ненужных культовых ассоциаций слова «скинии».
- source_word: וּבִמְנוּחֹת שַׁאֲנַנּוֹת
  choice: и в безмятежных местах покоя
  rationale: מְנוּחוֹת — места отдыха или покоя; שַׁאֲנַנּוֹת выражает состояние покоя, невозмутимости и отсутствия тревоги. «Безмятежных» передаёт эту характеристику без оттенка беспечности.
theological_decisions:
- issue: Характер и горизонт обещанного мира
  choice: Передать конкретные общинные условия мира, безопасности и покоя для Божьего народа, не уточняя время и способ исполнения обещания.
  alternative: Истолковать обещание исключительно как историческое восстановление Иудеи либо исключительно как эсхатологический мессианский мир.
  rationale: Сам стих обещает Божьему народу мирное и безопасное жительство, но отдельно не ограничивает горизонт исполнения; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Обитель» сохраняет образ места постоянного жительства, а «жилища» и «места покоя» ясно передают трёхчастный параллелизм. Местоимение «Мой» написано с прописной буквы по принятой русской библейской издательской традиции.
