  yaml_path: translation/ot/isaiah/032/009.yaml
  text: You complacent women[a], rise up; hear my voice. You confident daughters[c][b], listen to my word.
translation:
  language: ru
  text: Беспечные женщины[a], встаньте, услышьте мой голос! Дочери[b], уверенные в своей безопасности[c], прислушайтесь к моему слову!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущие без тревог». Еврейское слово может обозначать тех, кто живёт спокойно и безмятежно, но здесь содержит оттенок беспечности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочери». Сохранена еврейская форма обращения к женщинам.'
    reason: cultural_note
  - marker: c
    text: 'Или: «уверенные», «самоуверенные». Еврейское слово подчёркивает ощущение защищённости или уверенности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: женщины
  rationale: Существительное обозначает женщин; в данном параллелизме с «дочерьми» нет оснований сужать значение до «жён».
- source_word: שַׁאֲנַנּוֹת
  choice: беспечные
  rationale: Передаёт спокойную, ничем не тревожимую жизнь и одновременно отрицательный оттенок беззаботности в контексте пророческого обличения.
- source_word: קֹמְנָה
  choice: встаньте
  rationale: Женская форма множественного числа повелительного наклонения от קום; естественный русский призыв, сохраняющий его прямоту.
- source_word: שְׁמַעְנָה
  choice: услышьте
  rationale: Сохраняет прямое значение «слышать» и позволяет передать усиленный оттенок следующего глагола посредством «прислушайтесь».
- source_word: קוֹלִי
  choice: мой голос
  rationale: Прямой и естественный эквивалент в контексте обращения.
- source_word: בָּנוֹת
  choice: дочери
  rationale: Сохранена буквальная форма обращения и параллелизм еврейского текста; здесь это обращение к женщинам, а не обязательно указание на родство.
- source_word: בֹּטְחוֹת
  choice: самоуверенные
  rationale: Причастие выражает ощущение безопасности и уверенности; в пророческом обличении «самоуверенные» естественно передаёт подразумеваемую ложную или чрезмерную уверенность.
- source_word: הַאְזֵנָּה
  choice: прислушайтесь
  rationale: Hiphil от אזן призывает внимательно обратить слух; «прислушайтесь» точнее простого «слушайте» передаёт усиленное внимание.
- source_word: אִמְרָתִי
  choice: моему слову
  rationale: Естественно передаёт обозначение произнесённого слова или высказывания и сохраняет параллель с «моим голосом».
