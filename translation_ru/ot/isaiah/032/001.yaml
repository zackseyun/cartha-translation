base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
translation:
  language: ru
  text: Вот, царь будет царствовать в праведности[a], и правители будут править по правосудию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведно»; буквально: «в праведности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по справедливости». Еврейское מִשְׁפָּט охватывает суд, правосудие и справедливый порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Естественное для современного литературного русского языка вводное слово, привлекающее внимание и сохраняющее торжественную пророческую силу без излишней архаичности.
- source_word: לְצֶדֶק
  choice: по правде
  rationale: Передаёт образ действия или норму царствования и сохраняет существительное со свойственным צֶדֶק нравственно-правовым содержанием.
- source_word: יִמְלָךְ מֶלֶךְ
  choice: царь будет царствовать
  rationale: Сохраняет внутренний повтор еврейского выражения и неопределённость существительного без добавления указания на конкретного царя; русский язык не имеет неопределённого артикля.
- source_word: וּלְשָׂרִים
  choice: и правители
  rationale: שָׂרִים обозначает князей, начальников или должностных правителей. «Правители» здесь понятно современному читателю и не сужает значение до лиц наследственного княжеского звания.
- source_word: לְמִשְׁפָּט
  choice: по справедливости
  rationale: Передаёт судебно-нравственную норму правления; «суд» в современном русском мог бы быть воспринят слишком узко.
- source_word: יָשֹׂרוּ
  choice: будут править
  rationale: Форма от שׂרר означает осуществление власти; «править» прямо и естественно передаёт смысл в политическом контексте.
theological_decisions:
- issue: Следует ли прямо обозначить царя как Мессию
  choice: Оставить просто «царь», не отождествляя его в основном тексте с Мессией.
  alternative: Передать как «тот Царь» либо прямо назвать Мессией.
  rationale: Хотя в более широком контексте стих может пониматься мессиански, еврейский текст здесь говорит просто מֶלֶךְ, без артикля и без явного мессианского титула. Перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Вот» сохраняет призыв к вниманию; параллельные «царствовать» и «править» отражают структуру оригинала. Термины «правда» и «справедливость» различают צֶדֶק и מִשְׁפָּט, не превращая их в строго технические понятия.
