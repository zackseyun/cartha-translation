  text: יָמִים֙ עַל שָׁנָ֔ה תִּרְגַּ֖זְנָה בֹּֽטְח֑וֹת כִּ֚י כָּלָ֣ה בָצִ֔יר אֹ֖סֶף בְּלִ֥י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
translation:
  language: ru
  text: Через год и несколько дней[a] вы содрогнётесь, беспечные женщины[b], потому что сбор винограда прекратится, а сбора плодов не будет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дни сверх года»; то есть год и ещё несколько дней.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «женщины, чувствующие себя в безопасности»; также возможно: «самоуверенные женщины».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «собирание урожая не наступит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  choice: Через год и несколько дней
  rationale: 'Буквально: «дни сверх года». Формулировка естественно передаёт короткий срок сверх полного года и сохраняет конкретный временной образ еврейского текста.'
- source_word: תִּרְגַּזְנָה
  choice: вы содрогнётесь
  rationale: Форма от רגז выражает сильное беспокойство, дрожь или потрясение. «Содрогнётесь» уместно передаёт пророческое предупреждение и обращение во втором лице множественного числа.
- source_word: בֹּטְחוֹת
  choice: беспечные женщины
  rationale: Причастие женского рода множественного числа обозначает женщин, чувствующих себя в безопасности. В обличительном контексте «беспечные» передаёт оттенок ложной уверенности, не устраняя основное значение защищённости.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину предстоящего потрясения; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: כָּלָה
  choice: прекратится
  rationale: Глагол означает завершиться, иссякнуть. Хотя в еврейском стоит перфект, в пророческом контексте он описывает грядущее как несомненное; русское будущее время передаёт эту функцию естественно.
- source_word: בָצִיר
  choice: сбор винограда
  rationale: Слово обозначает именно сбор винограда, а не урожай вообще. Выбор сохраняет сельскохозяйственную конкретность исходного текста.
- source_word: אֹסֶף
  choice: сбор плодов
  rationale: Существительное обозначает собирание урожая, вероятно более поздний сбор прочих плодов. «Сбор плодов» понятно современному читателю, тогда как более буквальное «собирание» здесь звучало бы неясно.
- source_word: בְּלִי יָבֹא
  choice: не будет
  rationale: 'Буквально: «не придёт». В сочетании со «сбором плодов» русское «не будет» естественно выражает отсутствие ожидаемого сбора, сохраняя категоричность предупреждения.'
