translation:
  language: ru
  text: Но благородный человек замышляет благородное[a] и стоит на благородном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замышляет великодушное». Еврейские слова נָדִיב и נְדִיבוֹת могут указывать как на благородство, так и на великодушие или щедрость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и он стоит на благородном». Возможно также: «благодаря благородному он устоит» или «он утверждён в благородном». Краткая еврейская конструкция допускает эти близкие смысловые оттенки.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  choice: благородный человек
  rationale: Субстантивированное прилагательное мужского рода обозначает благородного, знатного или великодушного человека. В противопоставлении негодяю из ближайшего контекста «благородный человек» передаёт прежде всего нравственное достоинство, не приписывая ему определённого общественного положения.
- source_word: נְדִיבוֹת
  choice: благородное
  rationale: Форма может обозначать благородные или великодушные намерения и дела. Субстантивированное «благородное» сохраняет корневой повтор с נָדִיב и не сужает смысл только до замыслов или поступков.
- source_word: יָעָץ
  choice: замышляет
  rationale: В данном контексте глагол означает обдумывать и намереваться сделать что-либо, а не давать кому-либо совет. «Замышляет» естественно сочетается с предметом замысла и сохраняет целенаправленность действия.
- source_word: עַל ... יָקוּם
  choice: держится благородного
  rationale: Краткое еврейское выражение буквально создаёт образ стояния «на» благородном и может передавать стойкость, утверждённость или опору на благородные дела. Русское «держится благородного» естественно выражает постоянство, а неоднозначность конструкции отмечена в сноске.
