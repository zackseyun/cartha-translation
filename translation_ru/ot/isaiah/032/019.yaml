    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרַד
  choice: И град обрушится
  rationale: Форму от корня ברד можно понять как безличное обозначение града («будет град»), однако в связи с בְּרֶדֶת естественно передать выпадение града глаголом «обрушится», сохраняя катастрофический образ.
- source_word: בְּרֶדֶת
  choice: когда падёт
  rationale: 'Инфинитив конструктив от ירד с предлогом בְּ имеет временное значение: «когда спустится / падёт»; при подлежащем «лес» слово «падёт» звучит естественно и сохраняет образ разрушения.'
- source_word: הַיָּעַר
  choice: лес
  rationale: Прямой современный эквивалент יער, обозначающего лес или лесистую местность.
- source_word: וּבַשִּׁפְלָה
  choice: и ... в низине
  rationale: שְׁפֵלָה обозначает низменную местность; «в низине» сохраняет топографический смысл и одновременно словесную связь с последующим глаголом «быть низким».
- source_word: תִּשְׁפַּל
  choice: будет повержен
  rationale: Глагол שׁפל здесь означает стать низким, быть низвергнутым или униженным; применительно к городу «будет повержен» выражает катастрофическое падение без нравственного оттенка смирения.
- source_word: הָעִיר
  choice: город
  rationale: Обычный эквивалент עיר; определённость передаётся контекстом русского высказывания.
