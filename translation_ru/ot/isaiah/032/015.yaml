  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
translation:
  language: ru
  text: 'пока не изольётся на нас дух свыше[a]: пустыня станет плодородной землёй[b], а плодородная земля будет считаться лесом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух свыше». Еврейское רוּחַ может означать «дух»; в данном контексте речь может идти именно о Божьем Духе.'
    reason: alternative_reading
  - marker: b
    text: Еврейское כַּרְמֶל здесь означает плодородную или возделанную землю; вероятнее всего, это не название местности Кармил.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: пока не
  rationale: Передаёт временной предел состояния, описанного ранее, и естественно сочетается в русском с совершенным видом будущего действия.
- source_word: יֵעָרֶה
  choice: не изольётся
  rationale: Пассивная форма породы нифаль от ערה выражает излияние; русский возвратный глагол сохраняет пассивно-результативный образ.
- source_word: עָלֵינוּ
  choice: на нас
  rationale: Обычное русское управление для образа излияния и точное соответствие עַל с местоименным суффиксом.
- source_word: רוּחַ
  choice: дух
  rationale: רוּחַ может означать дух, ветер или дыхание; в контексте преобразующего действия свыше лучше всего подходит «дух». Строчное написание не снимает возможной отсылки к Божьему Духу и не делает её более определённой, чем еврейский текст.
- source_word: מִמָּרוֹם
  choice: свыше
  rationale: Кратко и естественно передаёт происхождение из высоты, сохраняя небесную и возвышенную окраску.
- source_word: וְהָיָה
  choice: и ... не станет
  rationale: В конструкции после «пока не» русский совершенный вид естественно выражает предстоящее преобразование и его результат.
- source_word: מִדְבָּר
  choice: пустыня
  rationale: Передаёт необжитую и неплодородную местность и ясно поддерживает противопоставление возделанной земле.
- source_word: לַכַּרְמֶל
  choice: плодородной землёй
  rationale: כַּרְמֶל здесь вероятнее является нарицательным обозначением плодородной или возделанной земли, а не топонимом Кармил.
- source_word: וְכַרְמֶל
  choice: а плодородная земля
  rationale: Повторяется то же нарицательное значение; союз «а» естественно вводит следующую ступень образного преобразования.
- source_word: לַיַּעַר
  choice: лесом
  rationale: יַעַר означает лес или лесистую местность; творительный падеж соответствует русскому управлению глагола «считаться».
- source_word: יֵחָשֵׁב
  choice: не будет считаться
  rationale: Нифаль от חשב означает «считаться, рассматриваться»; формулировка сохраняет элемент оценки, не превращая его без необходимости в прямое «станет».
theological_decisions:
- issue: Следует ли понимать רוּחַ как определённое указание на Святого Духа
  choice: дух свыше
  alternative: Дух свыше; Святой Дух свыше
  rationale: Контекст указывает на животворящее действие от Бога, однако в еврейском тексте нет артикля и определения «Святой». Основной текст сохраняет смысловую открытость, а примечание отмечает более конкретное понимание.
translation_notes:
  register: Современный литературный русский с достойным пророческим звучанием. Синтаксис «пока не... и... а...» связывает стих с предшествующим контекстом; строчное «дух» сохраняет подлинную неоднозначность исходного текста.
