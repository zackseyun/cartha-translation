base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
translation:
  language: ru
  text: 'И земля Иудеи станет ужасом[a] для Египта: всякий, кому о ней будет сказано[b], испугается из-за замысла Яхве Воинств[c], который Яхве замышляет против него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «страхом», «кошмаром»; согласно другой традиции толкования — «шатанием». Еврейское слово редкое и трудное для понимания.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза сжата и синтаксически трудна. Возможен также смысл: «всякий, кто упомянет её ему»; в данном переводе передан вероятный смысл, что упоминание Иудеи будет пугать египтянина.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционная передача: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  choice: земля Иудеи
  rationale: אַדְמָה может означать почву или землю; в геополитическом контексте естественно «земля Иудеи».
- source_word: לְחָגָּא
  choice: ужасом
  rationale: Редкое и трудное слово. Последующее יִפְחָד указывает на вызываемый страх; «ужас» естественно передаёт этот смысл, а альтернативное понимание «шатанием» вынесено в примечание.
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  choice: всякий, кому о ней упомянут
  rationale: 'Сжатая еврейская конструкция имеет распределительный смысл: всякий египтянин, услышавший упоминание об Иудее, испугается. Формулировка сохраняет неопределённого деятеля и соотносит местоимение с Иудеей.'
- source_word: יִפְחָד
  choice: испугается
  rationale: Прямое и естественное соответствие глаголу פחד в данном контексте.
- source_word: מִפְּנֵי עֲצַת
  choice: из-за замысла
  rationale: מִפְּנֵי выражает причину, а עֵצָה здесь обозначает целенаправленный замысел, а не просто совет.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано как «Яхве», а צְבָאוֹת переведено прозрачным словом «Воинств», сохраняющим образ небесных или военных сил.
- source_word: אֲשֶׁר הוּא יוֹעֵץ עָלָיו
  choice: который Он замышляет против него
  rationale: Причастная форма передаёт продолжающееся или намеренное действие. Мужское «него» грамматически отсылает к Египту и сохраняет местоименную форму оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; сил
  rationale: «Воинств» переводит значение титула и сохраняет его военный и космический оттенок; традиционный вариант отмечен в сноске.
- issue: Направленность божественного замысла
  choice: против Египта, выраженного местоимением «него»
  alternative: против земли Иудеи
  rationale: Ближайший смысловой объект угрозы во всём отрывке — Египет; при этом местоименная формулировка оригинала сохранена, а не заменена поясняющим существительным.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Синтаксис слегка сохраняет сжатость еврейского оригинала, но остаётся понятным; редкость לְחָגָּא и традиционный божественный титул пояснены сносками.
